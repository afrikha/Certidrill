id: sr-02-vm-operators
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure subscription named **Sub1** that contains two resource groups named **RG1** and **RG2**. Both resource groups contain virtual machines. New virtual machines are regularly added to RG1.

    A Microsoft Entra group named **VMOps** must be able to view, start, restart, and stop (deallocate) every virtual machine in RG1, including virtual machines added later. VMOps must not be able to create, modify, or delete any resource, and must not be able to manage the virtual machines in RG2. The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient deux groupes de ressources nommés **RG1** et **RG2**. Les deux groupes de ressources contiennent des machines virtuelles. De nouvelles machines virtuelles sont régulièrement ajoutées à RG1.

    Un groupe Microsoft Entra nommé **VMOps** doit pouvoir consulter, démarrer, redémarrer et arrêter (libérer) toutes les machines virtuelles de RG1, y compris celles ajoutées plus tard. VMOps ne doit pouvoir créer, modifier ni supprimer aucune ressource, et ne doit pas pouvoir gérer les machines virtuelles de RG2. La solution doit respecter le principe du privilège minimum.
