id: sr-09-cpu-alert
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure virtual machine named **VM1** that runs Windows Server. You have a Log Analytics workspace named **Workspace1**.
    
    You need to ensure that the operations team receives an email at `ops@contoso.com` whenever the average CPU usage of VM1 exceeds **85 percent** over a 5-minute period.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute Windows Server. Vous disposez d'un espace de travail Log Analytics nommé **Workspace1**.
    
    Vous devez faire en sorte que l'équipe des opérations reçoive un e-mail à `ops@contoso.com` chaque fois que l'utilisation moyenne du processeur de VM1 dépasse **85 %** sur une période de 5 minutes.
