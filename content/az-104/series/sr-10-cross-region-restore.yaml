id: sr-10-cross-region-restore
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure virtual machine named **VM1** in the **East US** region. VM1 is not backed up. The paired region of East US is West US.
    
    You need to implement a backup solution for VM1 that meets the following requirements:
    
    - Back up VM1 once a day and keep each daily recovery point for 30 days.
    - Be able to restore VM1 from its backups to West US at any time, including during disaster recovery drills when there is no outage in East US.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'une machine virtuelle Azure nommée **VM1** dans la région **East US**. VM1 n'est pas sauvegardée. La région jumelée d'East US est West US.
    
    Vous devez implémenter pour VM1 une solution de sauvegarde qui répond aux exigences suivantes :
    
    - Sauvegarder VM1 une fois par jour et conserver chaque point de récupération quotidien pendant 30 jours.
    - Pouvoir restaurer VM1 à partir de ses sauvegardes dans West US à tout moment, y compris lors d'exercices de récupération d'urgence sans panne dans East US.
