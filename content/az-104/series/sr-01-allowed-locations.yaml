id: sr-01-allowed-locations
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure subscription named **Sub1** that contains several resource groups. Developers create new resource groups in Sub1 every week.
    
    You need to ensure that any new resource deployed in Sub1, including resources deployed to resource groups that will be created in the future, can be created only in the **East US** or **West Europe** region. Deployments to any other region must be blocked. Existing resources must not be deleted or modified.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient plusieurs groupes de ressources. Les développeurs créent de nouveaux groupes de ressources dans Sub1 chaque semaine.
    
    Vous devez faire en sorte que toute nouvelle ressource déployée dans Sub1, y compris dans des groupes de ressources qui seront créés à l'avenir, ne puisse être créée que dans la région **East US** ou **West Europe**. Les déploiements vers toute autre région doivent être bloqués. Les ressources existantes ne doivent être ni supprimées ni modifiées.
