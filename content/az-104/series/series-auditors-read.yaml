id: series-auditors-read
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure subscription named **Sub1** that contains several resource groups. New resource groups are created every month.

    A Microsoft Entra group named **Auditors** must be able to view all the resources in Sub1, including resources created in the future. Auditors must not be able to modify any resource. The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient plusieurs groupes de ressources. De nouveaux groupes de ressources sont créés chaque mois.

    Un groupe Microsoft Entra nommé **Auditors** doit pouvoir consulter toutes les ressources de Sub1, y compris celles créées à l'avenir. Auditors ne doit pouvoir modifier aucune ressource. La solution doit respecter le principe du moindre privilège.
