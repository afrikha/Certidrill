id: sr-06-appservice-autoscale
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure App Service plan named **ASP1** in the **Basic (B1)** pricing tier. ASP1 runs one instance and hosts a web app named **WebApp1**.

    You need to ensure that the number of instances that run WebApp1 increases automatically, up to **8** instances, when the average CPU percentage of ASP1 exceeds 70 percent, and decreases automatically when the load drops. Nobody must have to change the instance count manually.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un plan App Service nommé **ASP1** dans le niveau tarifaire **Basic (B1)**. ASP1 exécute une instance et héberge une application web nommée **WebApp1**.

    Vous devez faire en sorte que le nombre d'instances qui exécutent WebApp1 augmente automatiquement, jusqu'à **8** instances, lorsque le pourcentage moyen d'utilisation du processeur d'ASP1 dépasse 70 %, et diminue automatiquement lorsque la charge baisse. Personne ne doit avoir à modifier manuellement le nombre d'instances.
