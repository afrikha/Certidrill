id: sr-07-spoke-to-spoke
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have three virtual networks in the same Azure region: **VNetHub** (10.0.0.0/16), **VNet1** (10.1.0.0/16), and **VNet2** (10.2.0.0/16). VNetHub is peered with VNet1 and with VNet2. VNet1 and VNet2 are not peered with each other. No virtual network contains a gateway or a network virtual appliance, and no route table is associated with any subnet. The network security groups allow all traffic between the three address spaces.

    You need to ensure that the virtual machines in VNet1 can communicate with the virtual machines in VNet2 by using their private IP addresses.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez de trois réseaux virtuels dans la même région Azure : **VNetHub** (10.0.0.0/16), **VNet1** (10.1.0.0/16) et **VNet2** (10.2.0.0/16). VNetHub est appairé avec VNet1 et avec VNet2. VNet1 et VNet2 ne sont pas appairés entre eux. Aucun réseau virtuel ne contient de passerelle ni d'appliance virtuelle réseau, et aucune table de routage n'est associée à un sous-réseau. Les groupes de sécurité réseau autorisent tout le trafic entre les trois espaces d'adressage.

    Vous devez faire en sorte que les machines virtuelles de VNet1 puissent communiquer avec les machines virtuelles de VNet2 en utilisant leurs adresses IP privées.
