id: sr-04-storage-network
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure subscription that contains a virtual network named **VNet1** in the West Europe region. VNet1 contains a single subnet named **Subnet1** that hosts several virtual machines. The virtual machines have no public IP addresses, and VNet1 is not peered or connected to any other network.

    You have a Standard general-purpose v2 storage account named **stor1** in West Europe. Public network access to stor1 is currently enabled from all networks.

    You need to ensure that the virtual machines in Subnet1 can read and write blobs in stor1 by using the default endpoint name `stor1.blob.core.windows.net`. Requests to stor1 from any other network, including the internet, must be rejected.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un abonnement Azure qui contient un réseau virtuel nommé **VNet1** dans la région West Europe. VNet1 contient un seul sous-réseau nommé **Subnet1** qui héberge plusieurs machines virtuelles. Les machines virtuelles n'ont pas d'adresse IP publique, et VNet1 n'est ni appairé ni connecté à aucun autre réseau.

    Vous disposez d'un compte de stockage usage général v2 standard nommé **stor1** dans West Europe. L'accès réseau public à stor1 est actuellement activé à partir de tous les réseaux.

    Vous devez faire en sorte que les machines virtuelles de Subnet1 puissent lire et écrire des objets blob dans stor1 en utilisant le nom de point de terminaison par défaut `stor1.blob.core.windows.net`. Les requêtes vers stor1 provenant de tout autre réseau, y compris d'Internet, doivent être rejetées.
