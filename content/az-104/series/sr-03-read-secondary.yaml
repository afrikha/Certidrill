id: sr-03-read-secondary
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You plan to create a Standard general-purpose v2 storage account named **stor1** in the **East US** region. An application named **App1** will store and read block blobs in stor1.

    You need to choose the redundancy option of stor1. If the whole East US region becomes unavailable, App1 must still be able to read the blob data immediately, without anyone initiating a storage account failover. Writes during a regional outage are not required.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous prévoyez de créer un compte de stockage usage général v2 standard nommé **stor1** dans la région **East US**. Une application nommée **App1** stockera et lira des objets blob de blocs dans stor1.

    Vous devez choisir l'option de redondance de stor1. Si toute la région East US devient indisponible, App1 doit pouvoir continuer à lire immédiatement les données blob, sans que personne ne lance de basculement du compte de stockage. Les écritures pendant une panne régionale ne sont pas requises.
