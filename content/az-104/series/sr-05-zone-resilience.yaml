id: sr-05-zone-resilience
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You plan to deploy an application named **App1** to three Azure virtual machines in the **East US 2** region, which supports availability zones. The virtual machines will be placed in the backend pool of an existing zone-redundant Standard load balancer.
    
    You need to deploy the virtual machines so that App1 remains available if an entire datacenter (availability zone) in East US 2 fails.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous prévoyez de déployer une application nommée **App1** sur trois machines virtuelles Azure dans la région **East US 2**, qui prend en charge les zones de disponibilité. Les machines virtuelles seront placées dans le pool principal d'un équilibreur de charge Standard redondant interzone existant.
    
    Vous devez déployer les machines virtuelles de façon qu'App1 reste disponible en cas de défaillance d'un centre de données entier (zone de disponibilité) d'East US 2.
