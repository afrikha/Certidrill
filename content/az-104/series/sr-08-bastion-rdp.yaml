id: sr-08-bastion-rdp
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a virtual network named **VNet1** that contains a subnet named **Workload** with ten Windows Server virtual machines. The virtual machines have no public IP addresses. VNet1 has unused address space.
    
    Administrators must be able to open RDP sessions to the virtual machines from the internet, by using only a web browser and the Azure portal. The virtual machines must not be assigned public IP addresses, and TCP port 3389 of the virtual machines must not be reachable from the internet.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un réseau virtuel nommé **VNet1** qui contient un sous-réseau nommé **Workload** avec dix machines virtuelles Windows Server. Les machines virtuelles n'ont pas d'adresse IP publique. VNet1 dispose d'espace d'adressage inutilisé.
    
    Les administrateurs doivent pouvoir ouvrir des sessions RDP vers les machines virtuelles depuis Internet, en utilisant uniquement un navigateur web et le portail Azure. Aucune adresse IP publique ne doit être attribuée aux machines virtuelles, et le port TCP 3389 des machines virtuelles ne doit pas être accessible depuis Internet.
