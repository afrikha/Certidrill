# AZ-104 — Microsoft Azure Administrator
# Everything describing the exam is data: changing it requires no code change.
# Source: official study guide, "Skills measured as of October 26, 2023"
# (page re-checked on 2026-11-10). Re-sync with the study guide in force before
# generating the question bank.
certification:
  code: az-104
  title: Microsoft Azure Administrator
  vendor: Microsoft
  active: true

blueprint:
  version: "2023-10-26"
  durationMin: 100
  # Real exam: 40–60 questions. The simulator draws a total in this range.
  questionCount: { min: 45, max: 58 }
  passScore: 700
  maxScore: 1000

  # Target share of each question type in an exam (0..1). series_yesno is
  # driven by structure.series below and is therefore not listed here.
  typeMix:
    single: { min: 0.35, max: 0.45 }
    multi: { min: 0.10, max: 0.15 }
    yesno_statements: { min: 0.10, max: 0.15 }
    dropdown: { min: 0.10, max: 0.15 }
    dragdrop: { min: 0.05, max: 0.10 }
    ordering: { min: 0.05, max: 0.10 }
    hotarea: { min: 0.00, max: 0.05 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 1, max: 2 }
      questionsEach: { min: 4, max: 7 }
      # Where case-study sections go: "start", "end" or "random" (drawn per exam).
      placement: random
    series:
      # Spec §6: one Yes/No series of 3 to 4 questions per exam.
      count: { min: 1, max: 1 }
      questionsEach: { min: 3, max: 4 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # "Ready" indicator on the dashboard.
    readiness: { consecutive: 3, minScore: 800 }

domains:
  - code: identities
    order: 1
    weight: { min: 0.20, max: 0.25 }
    title:
      en: Manage Azure identities and governance
      fr: Gérer les identités et la gouvernance Azure
  - code: storage
    order: 2
    weight: { min: 0.15, max: 0.20 }
    title:
      en: Implement and manage storage
      fr: Implémenter et gérer le stockage
  - code: compute
    order: 3
    weight: { min: 0.20, max: 0.25 }
    title:
      en: Deploy and manage Azure compute resources
      fr: Déployer et gérer les ressources de calcul Azure
  - code: networking
    order: 4
    weight: { min: 0.15, max: 0.20 }
    title:
      en: Implement and manage virtual networking
      fr: Implémenter et gérer la mise en réseau virtuelle
  - code: monitoring
    order: 5
    weight: { min: 0.10, max: 0.15 }
    title:
      en: Monitor and maintain Azure resources
      fr: Surveiller et tenir à jour les ressources Azure
