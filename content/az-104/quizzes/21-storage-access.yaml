chapter: 21-storage-access
questions:
  - id: az104-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a storage account named **stnorthwind01**. You set **Public network access** to **Disabled**.

        Which connections to stnorthwind01 are still accepted?
      fr: |
        Vous disposez d'un compte de stockage nommé **stnorthwind01**. Vous définissez **Accès réseau public** sur **Désactivé**.

        Quelles connexions à stnorthwind01 sont encore acceptées ?
    body:
      options:
        - { id: a, text: { en: "Connections through a private endpoint of stnorthwind01", fr: "Les connexions via un point de terminaison privé de stnorthwind01" } }
        - { id: b, text: { en: "Connections from the subnets listed in a virtual network rule", fr: "Les connexions depuis les sous-réseaux listés dans une règle de réseau virtuel" } }
        - { id: c, text: { en: "Connections from the public IP addresses listed in an IP network rule", fr: "Les connexions depuis les adresses IP publiques listées dans une règle de réseau IP" } }
        - { id: d, text: { en: "Connections from the Azure services on the trusted services list", fr: "Les connexions depuis les services Azure de la liste des services approuvés" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Disabling public network access blocks every request that arrives on the public endpoint of the account. Access remains possible only through a private endpoint, whose traffic uses a private IP address in a virtual network and is not evaluated by the storage firewall.
        fr: |
          Désactiver l'accès réseau public bloque toute demande qui arrive sur le point de terminaison public du compte. L'accès reste possible uniquement via un point de terminaison privé, dont le trafic utilise une adresse IP privée dans un réseau virtuel et n'est pas évalué par le pare-feu du stockage.
      options:
        b:
          en: |
            Virtual network rules allow subnets through the public endpoint; they only apply when access is enabled from selected networks.
          fr: |
            Les règles de réseau virtuel laissent passer des sous-réseaux par le point de terminaison public ; elles ne s'appliquent que lorsque l'accès est activé à partir des réseaux sélectionnés.
        c:
          en: |
            IP network rules also open the public endpoint, which is closed to every network when public access is disabled.
          fr: |
            Les règles de réseau IP ouvrent elles aussi le point de terminaison public, fermé à tous les réseaux quand l'accès public est désactivé.
        d:
          en: |
            The trusted services exception is an exception to the network rules of the public endpoint; it does not reopen a public endpoint that is disabled.
          fr: |
            L'exception des services approuvés est une exception aux règles réseau du point de terminaison public ; elle ne rouvre pas un point de terminaison public désactivé.
    references:
      - title: Set the default public network access rule
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access
      - title: Use private endpoints
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints

  - id: az104-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A blob container named **contracts** has a stored access policy named **legal-read** whose expiry time is December 31, 2026. Twelve service SAS tokens reference legal-read and do not specify their own expiry time.

        You change the expiry time of legal-read to March 31, 2027. What is the effect on the twelve tokens?
      fr: |
        Un conteneur d'objets blob nommé **contracts** possède une stratégie d'accès stockée nommée **legal-read** dont l'heure d'expiration est le 31 décembre 2026. Douze jetons SAS de service référencent legal-read et ne spécifient pas leur propre heure d'expiration.

        Vous changez l'heure d'expiration de legal-read pour le 31 mars 2027. Quel est l'effet sur les douze jetons ?
    body:
      options:
        - { id: a, text: { en: "They stay valid until December 31, 2026; only new tokens get the new expiry time.", fr: "Ils restent valides jusqu'au 31 décembre 2026 ; seuls les nouveaux jetons reçoivent la nouvelle heure d'expiration." } }
        - { id: b, text: { en: "They are revoked; new tokens must be generated from the updated policy.", fr: "Ils sont révoqués ; de nouveaux jetons doivent être générés à partir de la stratégie modifiée." } }
        - { id: c, text: { en: "They stay valid until March 31, 2027, without being generated again.", fr: "Ils restent valides jusqu'au 31 mars 2027, sans être générés à nouveau." } }
        - { id: d, text: { en: "The change is rejected while service SAS tokens reference the policy.", fr: "La modification est refusée tant que des jetons SAS de service référencent la stratégie." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A service SAS that references a stored access policy takes the values it does not define itself from the policy, and every change to the policy applies to all the SAS associated with it. Keeping the same identifier keeps the association, so the twelve tokens are extended to March 31, 2027 once the change is effective (up to 30 seconds).
        fr: |
          Une SAS de service qui référence une stratégie d'accès stockée prend dans la stratégie les valeurs qu'elle ne définit pas elle-même, et toute modification de la stratégie s'applique à toutes les SAS qui lui sont associées. En conservant le même identificateur, l'association est conservée : les douze jetons sont prolongés jusqu'au 31 mars 2027 dès que la modification prend effet (jusqu'à 30 secondes).
      options:
        a:
          en: |
            The expiry time is read from the policy at each request, so the existing tokens follow the new value too.
          fr: |
            L'heure d'expiration est lue dans la stratégie à chaque demande : les jetons existants suivent donc aussi la nouvelle valeur.
        b:
          en: |
            Tokens are revoked when the policy is deleted, renamed or given an expiry time in the past, not when its expiry time is extended.
          fr: |
            Les jetons sont révoqués quand la stratégie est supprimée, renommée ou reçoit une heure d'expiration passée, pas quand son heure d'expiration est prolongée.
        d:
          en: |
            A stored access policy can be modified at any time; this is precisely what makes it useful for managing service SAS.
          fr: |
            Une stratégie d'accès stockée peut être modifiée à tout moment ; c'est précisément ce qui la rend utile pour gérer des SAS de service.
    references:
      - title: Define a stored access policy
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy

  - id: az104-qz-21-03
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A storage account named **stadatumfs** uses on-premises AD DS authentication for Azure Files. A hybrid user named **User1** has the Storage File Data SMB Share Contributor role on a file share named **legal** and the Full control NTFS permission on the **Contracts** directory of the share.

        User1 maps legal by using his AD DS credentials. When he tries to change the NTFS permissions of Contracts in File Explorer, the operation is denied.

        You need to allow User1 to manage the NTFS permissions of Contracts. The solution must follow the principle of least privilege and must not give User1 access to the storage account keys.

        What should you assign to User1?
      fr: |
        Un compte de stockage nommé **stadatumfs** utilise l'authentification AD DS locale pour Azure Files. Un utilisateur hybride nommé **User1** dispose du rôle Storage File Data SMB Share Contributor sur un partage de fichiers nommé **legal** et de l'autorisation NTFS Contrôle total sur le répertoire **Contracts** du partage.

        User1 mappe legal avec ses informations d'identification AD DS. Lorsqu'il tente de modifier les autorisations NTFS de Contracts dans l'Explorateur de fichiers, l'opération est refusée.

        Vous devez permettre à User1 de gérer les autorisations NTFS de Contracts. La solution doit respecter le principe des privilèges minimum et ne doit pas donner à User1 l'accès aux clés du compte de stockage.

        Que devez-vous attribuer à User1 ?
    body:
      options:
        - { id: a, text: { en: "The Storage File Data SMB Share Reader role on the legal share", fr: "Le rôle Storage File Data SMB Share Reader sur le partage legal" } }
        - { id: b, text: { en: "The Storage Account Contributor role on stadatumfs", fr: "Le rôle Storage Account Contributor sur stadatumfs" } }
        - { id: c, text: { en: "The Storage Account Key Operator Service Role on stadatumfs", fr: "Le rôle Storage Account Key Operator Service Role sur stadatumfs" } }
        - { id: d, text: { en: "The Storage File Data SMB Share Elevated Contributor role on the legal share", fr: "Le rôle Storage File Data SMB Share Elevated Contributor sur le partage legal" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Over SMB, the share-level role and the NTFS permissions are both checked and the most restrictive one wins. Storage File Data SMB Share Contributor allows read, write and delete but not modifying ACLs, so the Full control NTFS permission is capped. Storage File Data SMB Share Elevated Contributor adds the modify-ACLs right and is the smallest role that lets User1 change the permissions with his own identity.
        fr: |
          En SMB, le rôle au niveau du partage et les autorisations NTFS sont vérifiés tous les deux, et le plus restrictif l'emporte. Storage File Data SMB Share Contributor permet la lecture, l'écriture et la suppression, mais pas la modification des ACL : l'autorisation NTFS Contrôle total est donc plafonnée. Storage File Data SMB Share Elevated Contributor ajoute le droit de modifier les ACL et c'est le plus petit rôle qui permet à User1 de changer les autorisations avec sa propre identité.
      options:
        a:
          en: |
            The Reader role grants less than the current Contributor role; it allows reading only.
          fr: |
            Le rôle Reader accorde moins que le rôle Contributor actuel ; il ne permet que la lecture.
        b:
          en: |
            Storage Account Contributor manages the account through Azure Resource Manager; it is not a share-level permission for SMB access, and it can read the account keys.
          fr: |
            Storage Account Contributor gère le compte via Azure Resource Manager ; ce n'est pas une autorisation au niveau du partage pour l'accès SMB, et il permet de lire les clés du compte.
        c:
          en: |
            This role exists to list and regenerate the account keys, which the requirements forbid; it gives no share-level permission.
          fr: |
            Ce rôle sert à lister et régénérer les clés du compte, ce que les exigences interdisent ; il ne donne aucune autorisation au niveau du partage.
    references:
      - title: Assign Share-Level Permissions for Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions

  - id: az104-qz-21-04
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An application of Tailspin must use a single SAS token to perform the following operations on a storage account named **sttailspin**:

        - Upload blobs to any container of the account.
        - Add messages to a queue named **orders**.
        - Read the properties of the Blob service.

        Signing the token with an account key is allowed. Which type of SAS should you create?
      fr: |
        Une application de Tailspin doit utiliser un seul jeton SAS pour effectuer les opérations suivantes sur un compte de stockage nommé **sttailspin** :

        - Charger des objets blob dans n'importe quel conteneur du compte.
        - Ajouter des messages à une file d'attente nommée **orders**.
        - Lire les propriétés du service Blob.

        La signature du jeton avec une clé de compte est autorisée. Quel type de SAS devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A service SAS for the Blob service", fr: "Une SAS de service pour le service Blob" } }
        - { id: b, text: { en: "An account SAS", fr: "Une SAS de compte" } }
        - { id: c, text: { en: "A user delegation SAS", fr: "Une SAS de délégation d'utilisateur" } }
        - { id: d, text: { en: "A service SAS that references a stored access policy of the orders queue", fr: "Une SAS de service qui référence une stratégie d'accès stockée de la file d'attente orders" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An account SAS is signed with an account key and can delegate access to several services at once (here `ss=bq`). It is also the only type that can delegate service-level operations, such as reading the properties of the Blob service (`srt=s`), in addition to container and object operations.
        fr: |
          Une SAS de compte est signée avec une clé de compte et peut déléguer l'accès à plusieurs services à la fois (ici `ss=bq`). C'est aussi le seul type qui peut déléguer des opérations au niveau du service, comme la lecture des propriétés du service Blob (`srt=s`), en plus des opérations sur les conteneurs et les objets.
      options:
        a:
          en: |
            A service SAS covers a resource of only one service, so it cannot also add messages to the queue, and it cannot delegate service-level operations.
          fr: |
            Une SAS de service couvre une ressource d'un seul service : elle ne peut donc pas aussi ajouter des messages à la file d'attente, ni déléguer des opérations au niveau du service.
        c:
          en: |
            A user delegation SAS is scoped to a resource of one service, such as a container or a blob, and does not delegate service-level operations.
          fr: |
            Une SAS de délégation d'utilisateur est limitée à une ressource d'un seul service, comme un conteneur ou un objet blob, et ne délègue pas d'opérations au niveau du service.
        d:
          en: |
            A stored access policy defined on the queue only applies to a service SAS for that queue; the token would give no access to the blobs.
          fr: |
            Une stratégie d'accès stockée définie sur la file d'attente ne s'applique qu'à une SAS de service pour cette file d'attente ; le jeton ne donnerait aucun accès aux objets blob.
    references:
      - title: Grant limited access to data with shared access signatures (SAS)
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview

  - id: az104-qz-21-05
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        The security team of Contoso sets two requirements for a storage account named **stcontoso** in a subscription named **Sub1**:

        - A reminder must be displayed when the access keys of stcontoso have not been rotated for 60 days.
        - A compliance report must list the storage accounts of Sub1 whose access keys are past their rotation interval.

        Both access keys of stcontoso were regenerated last month.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de sécurité de Contoso fixe deux exigences pour un compte de stockage nommé **stcontoso** dans un abonnement nommé **Sub1** :

        - Un rappel doit s'afficher lorsque les clés d'accès de stcontoso n'ont pas fait l'objet d'une rotation depuis 60 jours.
        - Un rapport de conformité doit lister les comptes de stockage de Sub1 dont les clés d'accès ont dépassé leur intervalle de rotation.

        Les deux clés d'accès de stcontoso ont été régénérées le mois dernier.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set a rotation reminder of 60 days on the Access keys page of stcontoso.", fr: "Définir un rappel de rotation de 60 jours sur la page Clés d'accès de stcontoso." } }
        - { id: b, text: { en: "Set Allow storage account key access to Disabled on stcontoso.", fr: "Définir Autoriser l'accès à la clé du compte de stockage sur Désactivé pour stcontoso." } }
        - { id: c, text: { en: "Assign the built-in policy Storage account keys should not be expired to Sub1.", fr: "Attribuer la stratégie intégrée Storage account keys should not be expired à Sub1." } }
        - { id: d, text: { en: "Assign the Storage Account Key Operator Service Role to the security team.", fr: "Attribuer le rôle Storage Account Key Operator Service Role à l'équipe de sécurité." } }
        - { id: e, text: { en: "Create a lifecycle management rule of 60 days on stcontoso.", fr: "Créer une règle de gestion du cycle de vie de 60 jours sur stcontoso." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The rotation reminder creates a key expiration policy on the account, and the portal displays a reminder once the interval has elapsed without rotation; since both keys were already regenerated, the setting is available. The built-in Azure Policy definition Storage account keys should not be expired then reports as non-compliant the accounts whose keys exceed their expiration policy. Neither action rotates the keys automatically.
        fr: |
          Le rappel de rotation crée une stratégie d'expiration de clé sur le compte, et le portail affiche un rappel lorsque l'intervalle est écoulé sans rotation ; comme les deux clés ont déjà été régénérées, le réglage est disponible. La définition intégrée Azure Policy Storage account keys should not be expired signale ensuite comme non conformes les comptes dont les clés dépassent leur stratégie d'expiration. Aucune des deux actions ne régénère les clés automatiquement.
      options:
        b:
          en: |
            Disabling Shared Key authorization blocks the use of the keys; it neither creates a reminder nor reports key age.
          fr: |
            Désactiver l'autorisation par clé partagée bloque l'utilisation des clés ; cela ne crée pas de rappel et ne signale pas l'âge des clés.
        d:
          en: |
            This role lets its holders list and regenerate the keys; it produces no reminder and no compliance report.
          fr: |
            Ce rôle permet à ses détenteurs de lister et de régénérer les clés ; il ne produit ni rappel ni rapport de conformité.
        e:
          en: |
            Lifecycle management moves or deletes blobs according to their age; it does not apply to access keys.
          fr: |
            La gestion du cycle de vie déplace ou supprime des objets blob selon leur âge ; elle ne s'applique pas aux clés d'accès.
    references:
      - title: Manage account access keys
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage

  - id: az104-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has an on-premises network connected to a virtual network named **VNet1** by a site-to-site VPN. A storage account named **stfabfiles**, in the same region as VNet1, contains an SMB file share named **projects**. Public network access on stfabfiles is set to **Disabled**.

        On-premises users must map projects by using the path `\\stfabfiles.file.core.windows.net\projects`, and the SMB traffic must cross the VPN. The on-premises DNS servers already forward the queries for Azure Storage names to a DNS resolver in VNet1.

        How should you complete the configuration? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un réseau local connecté à un réseau virtuel nommé **VNet1** par un VPN site à site. Un compte de stockage nommé **stfabfiles**, situé dans la même région que VNet1, contient un partage de fichiers SMB nommé **projects**. L'accès réseau public de stfabfiles est défini sur **Désactivé**.

        Les utilisateurs locaux doivent mapper projects avec le chemin `\\stfabfiles.file.core.windows.net\projects`, et le trafic SMB doit passer par le VPN. Les serveurs DNS locaux transfèrent déjà les requêtes portant sur les noms du Stockage Azure vers un résolveur DNS de VNet1.

        Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Target sub-resource of the private endpoint created in VNet1: [[sub]]

          Private DNS zone linked to VNet1: [[zone]]

          Port to allow from the on-premises network to the private endpoint: [[port]]
        fr: |
          Sous-ressource cible du point de terminaison privé créé dans VNet1 : [[sub]]

          Zone DNS privée liée à VNet1 : [[zone]]

          Port à autoriser depuis le réseau local vers le point de terminaison privé : [[port]]
      slots:
        - id: sub
          options:
            - { id: blob, text: blob }
            - { id: dfs, text: dfs }
            - { id: file, text: file }
            - { id: table, text: table }
        - id: zone
          options:
            - { id: plblob, text: privatelink.blob.core.windows.net }
            - { id: plfile, text: privatelink.file.core.windows.net }
            - { id: pubfile, text: file.core.windows.net }
            - { id: pldfs, text: privatelink.dfs.core.windows.net }
        - id: port
          options:
            - { id: p443, text: TCP 443 }
            - { id: p2049, text: TCP 2049 }
            - { id: p3389, text: TCP 3389 }
            - { id: p445, text: TCP 445 }
    answer:
      values: { sub: file, zone: plfile, port: p445 }
    explanation:
      correct:
        en: |
          With public network access disabled, only a private endpoint can carry the traffic, and each storage service needs its own private endpoint; an SMB share is served by the `file` sub-resource. The private DNS zone privatelink.file.core.windows.net makes stfabfiles.file.core.windows.net resolve to the private IP address, so users keep the usual path. SMB uses TCP port 445, which must be open across the VPN.
        fr: |
          Avec l'accès réseau public désactivé, seul un point de terminaison privé peut transporter le trafic, et chaque service de stockage a besoin de son propre point de terminaison privé ; un partage SMB est servi par la sous-ressource `file`. La zone DNS privée privatelink.file.core.windows.net fait résoudre stfabfiles.file.core.windows.net vers l'adresse IP privée : les utilisateurs conservent le chemin habituel. SMB utilise le port TCP 445, qui doit être ouvert à travers le VPN.
      options:
        blob:
          en: |
            The `blob` sub-resource only exposes the Blob service, not Azure Files.
          fr: |
            La sous-ressource `blob` n'expose que le service Blob, pas Azure Files.
        plblob:
          en: |
            This zone resolves the blob endpoint names; it does not contain the file endpoint record.
          fr: |
            Cette zone résout les noms du point de terminaison blob ; elle ne contient pas l'enregistrement du point de terminaison file.
        pubfile:
          en: |
            The public zone name would not resolve to the private IP address; the private endpoint record lives in the privatelink zone.
          fr: |
            Le nom de la zone publique ne résoudrait pas vers l'adresse IP privée ; l'enregistrement du point de terminaison privé se trouve dans la zone privatelink.
        p443:
          en: |
            TCP 443 carries HTTPS (REST) requests; mounting a share over SMB uses TCP 445.
          fr: |
            Le port TCP 443 transporte les demandes HTTPS (REST) ; le montage d'un partage en SMB utilise le port TCP 445.
        p2049:
          en: |
            TCP 2049 is used by NFS shares, not by SMB shares.
          fr: |
            Le port TCP 2049 est utilisé par les partages NFS, pas par les partages SMB.
    references:
      - title: Use private endpoints
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints

  - id: az104-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Several access tokens and URLs of a storage account named **stwingtip** have leaked:

        | Leak | Details |
        | --- | --- |
        | Leak1 | A service SAS for the **catalog** container, signed with key1, that references no stored access policy |
        | Leak2 | An account SAS signed with key2 |
        | Leak3 | A user delegation SAS for the **reports** container |
        | Leak4 | The URL of a blob in the **media** container, whose anonymous access level is **Blob** |

        You need to revoke the access given by each leak. Each action must affect as few other clients of stwingtip as possible.

        Which action should you perform for each leak? To answer, drag the appropriate actions to the correct leaks. Each action may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Plusieurs jetons d'accès et URL d'un compte de stockage nommé **stwingtip** ont fuité :

        | Fuite | Détails |
        | --- | --- |
        | Leak1 | Une SAS de service pour le conteneur **catalog**, signée avec key1, qui ne référence aucune stratégie d'accès stockée |
        | Leak2 | Une SAS de compte signée avec key2 |
        | Leak3 | Une SAS de délégation d'utilisateur pour le conteneur **reports** |
        | Leak4 | L'URL d'un objet blob du conteneur **media**, dont le niveau d'accès anonyme est **Blob** |

        Vous devez révoquer l'accès donné par chaque fuite. Chaque action doit affecter le moins possible d'autres clients de stwingtip.

        Quelle action devez-vous effectuer pour chaque fuite ? Pour répondre, faites glisser les actions appropriées vers les fuites correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: key1, text: { en: "Regenerate key1", fr: "Régénérer key1" } }
        - { id: key2, text: { en: "Regenerate key2", fr: "Régénérer key2" } }
        - { id: udk, text: { en: "Revoke the user delegation keys of stwingtip", fr: "Révoquer les clés de délégation d'utilisateur de stwingtip" } }
        - { id: private, text: { en: "Set the anonymous access level of the container to Private", fr: "Définir le niveau d'accès anonyme du conteneur sur Privé" } }
        - { id: policy, text: { en: "Delete the stored access policies of the container", fr: "Supprimer les stratégies d'accès stockées du conteneur" } }
        - { id: nokey, text: { en: "Set Allow storage account key access to Disabled", fr: "Définir Autoriser l'accès à la clé du compte de stockage sur Désactivé" } }
      targets:
        - { id: leak1, text: "Leak1" }
        - { id: leak2, text: "Leak2" }
        - { id: leak3, text: "Leak3" }
        - { id: leak4, text: "Leak4" }
    answer:
      mapping: { leak1: key1, leak2: key2, leak3: udk, leak4: private }
    explanation:
      correct:
        en: |
          A SAS signed with an account key and bound to no stored access policy can only be revoked by regenerating the key that signed it, so Leak1 needs key1 and Leak2 needs key2. A user delegation SAS does not depend on the account keys; revoking the user delegation keys invalidates it. An anonymous URL carries no token at all, so the access stops only when the container access level is set back to Private.
        fr: |
          Une SAS signée avec une clé de compte et liée à aucune stratégie d'accès stockée ne peut être révoquée qu'en régénérant la clé qui l'a signée : Leak1 demande key1 et Leak2 demande key2. Une SAS de délégation d'utilisateur ne dépend pas des clés du compte ; la révocation des clés de délégation d'utilisateur l'invalide. Une URL anonyme ne porte aucun jeton : l'accès ne cesse que lorsque le niveau d'accès du conteneur repasse à Privé.
      options:
        policy:
          en: |
            Leak1 references no stored access policy, and the other leaks cannot use one, so deleting policies revokes none of them.
          fr: |
            Leak1 ne référence aucune stratégie d'accès stockée et les autres fuites ne peuvent pas en utiliser : supprimer des stratégies n'en révoque aucune.
        nokey:
          en: |
            Disabling Shared Key access would revoke Leak1 and Leak2 but would also break every other client that uses a key or a service or account SAS.
          fr: |
            Désactiver l'accès par clé partagée révoquerait Leak1 et Leak2, mais casserait aussi tous les autres clients qui utilisent une clé ou une SAS de service ou de compte.
    references:
      - title: Create a user delegation SAS
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
      - title: Configure anonymous read access for containers and blobs
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure

  - id: az104-qz-21-08
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Adatum has an on-premises AD DS domain that is synced to Microsoft Entra ID. Its domain-joined Windows clients have line of sight to the domain controllers. A storage account named **stadatumhr** contains an SMB file share named **hr**.

        You need to give the members of the HR-Staff group access to hr by using their AD DS credentials. The HR administrators must set the NTFS permissions of the folders with their own AD DS identities. Company policy forbids any use of the storage account keys.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Adatum dispose d'un domaine AD DS local synchronisé avec Microsoft Entra ID. Ses clients Windows joints au domaine ont une visibilité directe des contrôleurs de domaine. Un compte de stockage nommé **stadatumhr** contient un partage de fichiers SMB nommé **hr**.

        Vous devez donner aux membres du groupe HR-Staff l'accès à hr avec leurs informations d'identification AD DS. Les administrateurs RH doivent définir les autorisations NTFS des dossiers avec leurs propres identités AD DS. La politique de l'entreprise interdit toute utilisation des clés du compte de stockage.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: join, text: { en: "Register stadatumhr in AD DS by running Join-AzStorageAccount from the AzFilesHybrid module.", fr: "Inscrire stadatumhr dans AD DS en exécutant Join-AzStorageAccount du module AzFilesHybrid." } }
        - { id: roles, text: { en: "Assign Storage File Data SMB Share Elevated Contributor to the HR administrators and Storage File Data SMB Share Contributor to HR-Staff on hr.", fr: "Attribuer Storage File Data SMB Share Elevated Contributor aux administrateurs RH et Storage File Data SMB Share Contributor à HR-Staff sur hr." } }
        - { id: acl, text: { en: "Have an HR administrator mount hr with their AD DS credentials and set the NTFS permissions.", fr: "Faire monter hr par un administrateur RH avec ses informations d'identification AD DS, puis définir les autorisations NTFS." } }
        - { id: mount, text: { en: "Have the HR-Staff members map hr from domain-joined clients with their AD DS credentials.", fr: "Faire mapper hr par les membres de HR-Staff depuis des clients joints au domaine avec leurs informations d'identification AD DS." } }
        - { id: keyacl, text: { en: "Mount hr by using the storage account key and set the NTFS permissions.", fr: "Monter hr avec la clé du compte de stockage et définir les autorisations NTFS." } }
        - { id: kerb, text: { en: "Enable Microsoft Entra Kerberos as the identity source of stadatumhr.", fr: "Activer Microsoft Entra Kerberos comme source d'identité de stadatumhr." } }
        - { id: sac, text: { en: "Assign the Storage Account Contributor role on stadatumhr to the HR administrators.", fr: "Attribuer le rôle Storage Account Contributor sur stadatumhr aux administrateurs RH." } }
    answer:
      sequence: [join, roles, acl, mount]
    explanation:
      correct:
        en: |
          AD DS authentication is enabled first by registering the storage account in the domain. Share-level permissions come next, because without them every SMB access is denied whatever the NTFS permissions; the administrators need Elevated Contributor to modify ACLs. Since the account key is forbidden, an administrator then sets the NTFS permissions over an identity-based mount, and finally the users map the share.
        fr: |
          L'authentification AD DS s'active d'abord en inscrivant le compte de stockage dans le domaine. Viennent ensuite les autorisations au niveau du partage, car sans elles tout accès SMB est refusé, quelles que soient les autorisations NTFS ; les administrateurs ont besoin d'Elevated Contributor pour modifier les ACL. La clé du compte étant interdite, un administrateur définit ensuite les autorisations NTFS via un montage basé sur l'identité, puis les utilisateurs mappent le partage.
      options:
        keyacl:
          en: |
            Mounting with the account key is the usual way to set the first ACLs, but the company policy forbids it here.
          fr: |
            Le montage avec la clé du compte est la méthode habituelle pour définir les premières ACL, mais la politique de l'entreprise l'interdit ici.
        kerb:
          en: |
            Only one identity source can be enabled on the account, and the domain-joined clients with line of sight to the domain controllers call for AD DS.
          fr: |
            Une seule source d'identité peut être activée sur le compte, et des clients joints au domaine qui voient les contrôleurs de domaine appellent AD DS.
        sac:
          en: |
            Storage Account Contributor is a management role; it gives no share-level permission over SMB.
          fr: |
            Storage Account Contributor est un rôle de gestion ; il ne donne aucune autorisation au niveau du partage en SMB.
    references:
      - title: On-Premises AD DS Authentication for Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-ad-ds-overview
      - title: Assign Share-Level Permissions for Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions

  - id: az104-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A storage account named **stproseware** contains a container named **exports**. A stored access policy named **partner-ro** on exports defines the permissions `rl` and no start or expiry time. A partner uses a service SAS that references partner-ro and whose token specifies an expiry time of December 31, 2026.

        You need to extend the access of the partner to March 31, 2027. Later extensions and an early revocation must be possible without sending the partner another token and without regenerating the account keys.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un compte de stockage nommé **stproseware** contient un conteneur nommé **exports**. Une stratégie d'accès stockée nommée **partner-ro** sur exports définit les autorisations `rl`, sans heure de début ni d'expiration. Un partenaire utilise une SAS de service qui référence partner-ro et dont le jeton spécifie une heure d'expiration au 31 décembre 2026.

        Vous devez prolonger l'accès du partenaire jusqu'au 31 mars 2027. Les prolongations ultérieures et une révocation anticipée doivent être possibles sans envoyer d'autre jeton au partenaire et sans régénérer les clés du compte.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Change the se value in the existing SAS URL of the partner to March 31, 2027.", fr: "Changer la valeur se dans l'URL SAS existante du partenaire pour le 31 mars 2027." } }
        - { id: b, text: { en: "Set an expiry time of March 31, 2027, on partner-ro.", fr: "Définir une heure d'expiration au 31 mars 2027 sur partner-ro." } }
        - { id: c, text: { en: "Generate a service SAS that references partner-ro with an expiry time of March 31, 2027, and send it to the partner.", fr: "Générer une SAS de service qui référence partner-ro avec une heure d'expiration au 31 mars 2027, et l'envoyer au partenaire." } }
        - { id: d, text: { en: "Generate a service SAS that references partner-ro without any expiry time, and send it to the partner.", fr: "Générer une SAS de service qui référence partner-ro sans aucune heure d'expiration, et l'envoyer au partenaire." } }
        - { id: e, text: { en: "Generate a user delegation SAS that expires on March 31, 2027, and send it to the partner.", fr: "Générer une SAS de délégation d'utilisateur qui expire le 31 mars 2027, et l'envoyer au partenaire." } }
        - { id: f, text: { en: "Regenerate the account key that signed the existing SAS of the partner.", fr: "Régénérer la clé du compte qui a signé la SAS existante du partenaire." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          An expiry time fixed inside a token cannot be changed later, and a value cannot be defined both in the policy and in the SAS. To control the end date from the policy, the expiry must move to partner-ro, and the partner needs one last token that references partner-ro without its own expiry time. After that, changing the expiry of partner-ro extends the access, and deleting or renaming the policy, or setting its expiry in the past, revokes it.
        fr: |
          Une heure d'expiration fixée dans un jeton ne peut plus être modifiée, et une valeur ne peut pas être définie à la fois dans la stratégie et dans la SAS. Pour piloter la date de fin depuis la stratégie, l'expiration doit passer dans partner-ro, et le partenaire a besoin d'un dernier jeton qui référence partner-ro sans heure d'expiration propre. Ensuite, modifier l'expiration de partner-ro prolonge l'accès, et supprimer ou renommer la stratégie, ou lui donner une expiration passée, le révoque.
      options:
        a:
          en: |
            The se value is covered by the signature; editing it makes the signature invalid and the requests fail.
          fr: |
            La valeur se est couverte par la signature ; la modifier rend la signature invalide et les demandes échouent.
        c:
          en: |
            This new token would work until March 31, 2027, but its own expiry time could not be extended later without sending another token.
          fr: |
            Ce nouveau jeton fonctionnerait jusqu'au 31 mars 2027, mais sa propre heure d'expiration ne pourrait plus être prolongée sans envoyer un autre jeton.
        e:
          en: |
            A user delegation SAS is valid for seven days at most and cannot reference a stored access policy.
          fr: |
            Une SAS de délégation d'utilisateur est valide sept jours au plus et ne peut pas référencer de stratégie d'accès stockée.
        f:
          en: |
            Regenerating the key revokes the existing token instead of extending it, and the requirements forbid it.
          fr: |
            Régénérer la clé révoque le jeton existant au lieu de le prolonger, et les exigences l'interdisent.
    references:
      - title: Create a service SAS
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-service-sas
      - title: Define a stored access policy
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy

  - id: az104-qz-21-10
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A storage account named **stcontoso** in West Europe has the following configuration:

        - Public network access: **Enabled from selected networks**
        - Virtual network rule: **VNet1/Subnet1**, which has the Microsoft.Storage service endpoint
        - Exceptions: none
        - Allow storage account key access: **Enabled**
        - A private endpoint for the **blob** sub-resource in **VNet1/Subnet-PE**. The private DNS zone privatelink.blob.core.windows.net is linked to VNet1 and VNet2 only.

        The following virtual machines run in West Europe and use the DNS provided by Azure:

        | VM | Network | Details |
        | --- | --- | --- |
        | VM1 | VNet1/Subnet1 | No role assignment on stcontoso |
        | VM2 | VNet2/Subnet1 | VNet2 is peered with VNet1; no service endpoint |
        | VM3 | VNet3/Subnet1 | Microsoft.Storage service endpoint enabled; VNet3 is not peered |

        All the applications connect to `stcontoso.blob.core.windows.net`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un compte de stockage nommé **stcontoso** dans la région West Europe présente la configuration suivante :

        - Accès réseau public : **Activé à partir des réseaux sélectionnés**
        - Règle de réseau virtuel : **VNet1/Subnet1**, qui dispose du point de terminaison de service Microsoft.Storage
        - Exceptions : aucune
        - Autoriser l'accès à la clé du compte de stockage : **Activé**
        - Un point de terminaison privé pour la sous-ressource **blob** dans **VNet1/Subnet-PE**. La zone DNS privée privatelink.blob.core.windows.net est liée uniquement à VNet1 et VNet2.

        Les machines virtuelles suivantes s'exécutent dans West Europe et utilisent le DNS fourni par Azure :

        | Machine virtuelle | Réseau | Détails |
        | --- | --- | --- |
        | VM1 | VNet1/Subnet1 | Aucune attribution de rôle sur stcontoso |
        | VM2 | VNet2/Subnet1 | VNet2 a un peering avec VNet1 ; aucun point de terminaison de service |
        | VM3 | VNet3/Subnet1 | Point de terminaison de service Microsoft.Storage activé ; VNet3 n'a aucun peering |

        Toutes les applications se connectent à `stcontoso.blob.core.windows.net`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              An application on VM2 that has the Storage Blob Data Reader role on stcontoso can read the blobs of stcontoso.
            fr: |
              Une application de VM2 qui dispose du rôle Storage Blob Data Reader sur stcontoso peut lire les objets blob de stcontoso.
        - id: s2
          text:
            en: |
              An application on VM3 that has the Storage Blob Data Reader role on stcontoso can read the blobs of stcontoso.
            fr: |
              Une application de VM3 qui dispose du rôle Storage Blob Data Reader sur stcontoso peut lire les objets blob de stcontoso.
        - id: s3
          text:
            en: |
              An application on VM1 that uses a connection string containing key1 can read the blobs of stcontoso.
            fr: |
              Une application de VM1 qui utilise une chaîne de connexion contenant key1 peut lire les objets blob de stcontoso.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Because the private DNS zone is linked to VNet2, VM2 resolves the usual name to the private IP address and reaches the private endpoint through the peering; the storage firewall only filters the public endpoint, so VM2 needs no network rule. VM3 resolves the public address, and a service endpoint on its subnet is not enough without a virtual network rule for that subnet, so its requests are rejected. VM1 is allowed by the network and authorized by the account key, which Shared Key access still accepts; no role is needed.
        fr: |
          Comme la zone DNS privée est liée à VNet2, VM2 résout le nom habituel vers l'adresse IP privée et atteint le point de terminaison privé par le peering ; le pare-feu du stockage ne filtre que le point de terminaison public : VM2 n'a besoin d'aucune règle réseau. VM3 résout l'adresse publique, et un point de terminaison de service sur son sous-réseau ne suffit pas sans règle de réseau virtuel pour ce sous-réseau : ses demandes sont rejetées. VM1 est admise par le réseau et autorisée par la clé du compte, que l'accès par clé partagée accepte toujours ; aucun rôle n'est nécessaire.
    references:
      - title: Use private endpoints
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
      - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
