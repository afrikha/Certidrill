chapter: 51-azure-monitor
questions:
  - id: az104-qz-51-01
    objective: "5.1.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You have an Azure subscription named **Sub1**. No diagnostic setting and no legacy log profile are configured for the activity log of Sub1.

        How long does Azure retain the activity log events of Sub1?
      fr: |
        Vous disposez d'un abonnement Azure nommé **Sub1**. Aucun paramètre de diagnostic ni aucun profil de journal hérité n'est configuré pour le journal d'activité de Sub1.

        Pendant combien de temps Azure conserve-t-il les événements du journal d'activité de Sub1 ?
    body:
      options:
        - { id: a, text: { en: "30 days", fr: "30 jours" } }
        - { id: b, text: { en: "90 days", fr: "90 jours" } }
        - { id: c, text: { en: "93 days", fr: "93 jours" } }
        - { id: d, text: { en: "365 days", fr: "365 jours" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Azure keeps activity log events for 90 days at no charge and then deletes them; this built-in period cannot be changed. To keep the events longer, you export them with a diagnostic setting, for example to a Log Analytics workspace (table AzureActivity) whose retention you extend."
        fr: "Azure conserve les événements du journal d'activité pendant 90 jours sans frais, puis les supprime ; cette durée intégrée ne se modifie pas. Pour les garder plus longtemps, vous les exportez avec un paramètre de diagnostic, par exemple vers un espace de travail Log Analytics (table AzureActivity) dont vous allongez la rétention."
      options:
        a: { en: "30 days is the default interactive retention of a Log Analytics workspace, not the retention of the activity log itself.", fr: "30 jours est la rétention interactive par défaut d'un espace de travail Log Analytics, pas la conservation du journal d'activité lui-même." }
        c: { en: "93 days is the retention of platform metrics in the metrics database.", fr: "93 jours est la conservation des métriques de plateforme dans la base de données de métriques." }
        d: { en: "The activity log is not kept for a year without an export; you need a diagnostic setting for that.", fr: "Le journal d'activité n'est pas conservé un an sans export : il faut pour cela un paramètre de diagnostic." }
    references:
      - title: Activity log in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log

  - id: az104-qz-51-02
    objective: "5.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a route-based virtual network gateway named **VGW1** with a site-to-site IPsec connection named **CN-Paris** to an on-premises device. Since this morning, the status of CN-Paris is Not connected.

        You need to diagnose the health of VGW1 and CN-Paris and obtain the detailed diagnostic log files in a storage account.

        Which Network Watcher tool should you use?
      fr: |
        Vous disposez d'une passerelle de réseau virtuel basée sur un itinéraire nommée **VGW1**, avec une connexion IPsec site à site nommée **CN-Paris** vers un appareil local. Depuis ce matin, l'état de CN-Paris est Not connected.

        Vous devez diagnostiquer l'intégrité de VGW1 et de CN-Paris et obtenir les fichiers journaux de diagnostic détaillés dans un compte de stockage.

        Quel outil de Network Watcher devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion" } }
        - { id: b, text: { en: "Connection monitor", fr: "Moniteur de connexion" } }
        - { id: c, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes de VPN" } }
        - { id: d, text: { en: "Packet capture", fr: "Capture de paquets" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "VPN troubleshoot diagnoses a virtual network gateway or one of its connections (route-based VPN gateways, IPsec and VNet-to-VNet connections) and returns a health result. When the diagnosis ends, it writes log files such as connection statistics and IKE logs to the storage account you select."
        fr: "La résolution des problèmes de VPN diagnostique une passerelle de réseau virtuel ou l'une de ses connexions (passerelles VPN basées sur un itinéraire, connexions IPsec et de réseau virtuel à réseau virtuel) et renvoie un résultat d'intégrité. À la fin du diagnostic, elle écrit des fichiers journaux, comme les statistiques de connexion et les journaux IKE, dans le compte de stockage que vous choisissez."
      options:
        a: { en: "Connection troubleshoot runs a one-time connectivity test from a source such as a virtual machine to a destination; it does not diagnose a gateway or produce gateway logs.", fr: "La résolution des problèmes de connexion exécute un test de connectivité ponctuel depuis une source comme une machine virtuelle vers une destination ; elle ne diagnostique pas une passerelle et ne produit pas ses journaux." }
        b: { en: "Connection monitor runs connectivity tests continuously between endpoints; it reports reachability and latency, not the diagnosis of a gateway.", fr: "Le Moniteur de connexion exécute des tests de connectivité en continu entre des points de terminaison ; il indique l'accessibilité et la latence, pas le diagnostic d'une passerelle." }
        d: { en: "Network Watcher packet capture records the traffic of a virtual machine or a scale set that has the Network Watcher agent extension, not the health of a gateway.", fr: "La capture de paquets de Network Watcher enregistre le trafic d'une machine virtuelle ou d'un groupe identique équipé de l'extension de l'agent Network Watcher, pas l'intégrité d'une passerelle." }
    references:
      - title: VPN troubleshoot overview
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview

  - id: az104-qz-51-03
    objective: "5.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You enabled VM insights on three virtual machines named **VM1**, **VM2** and **VM3** last month. The data is sent to a Log Analytics workspace named **law-ops**.

        Since yesterday, the VM insights performance charts show data for VM2 and VM3 but none for VM1. The Azure Monitor Agent extension of VM1 is in the Provisioning succeeded state, and Metrics Explorer still displays the Percentage CPU metric of VM1. The Resources page of the VM insights data collection rule lists VM2 and VM3 only.

        What should you do to restore the VM insights data of VM1?
      fr: |
        Vous avez activé VM Insights le mois dernier sur trois machines virtuelles nommées **VM1**, **VM2** et **VM3**. Les données sont envoyées à un espace de travail Log Analytics nommé **law-ops**.

        Depuis hier, les graphiques de performances de VM Insights affichent des données pour VM2 et VM3, mais aucune pour VM1. L'extension de l'agent Azure Monitor de VM1 est dans l'état Provisioning succeeded, et Metrics Explorer affiche toujours la métrique Percentage CPU de VM1. La page Ressources de la règle de collecte de données de VM Insights ne liste que VM2 et VM3.

        Que devez-vous faire pour rétablir les données VM Insights de VM1 ?
    body:
      options:
        - { id: a, text: { en: "Add VM1 as a resource of the VM insights data collection rule.", fr: "Ajouter VM1 comme ressource de la règle de collecte de données de VM Insights." } }
        - { id: b, text: { en: "Create a diagnostic setting on VM1 that sends AllMetrics to law-ops.", fr: "Créer sur VM1 un paramètre de diagnostic qui envoie AllMetrics à law-ops." } }
        - { id: c, text: { en: "Uninstall and reinstall the Azure Monitor Agent extension on VM1.", fr: "Désinstaller puis réinstaller l'extension de l'agent Azure Monitor sur VM1." } }
        - { id: d, text: { en: "Enable boot diagnostics on VM1 with a managed storage account.", fr: "Activer les diagnostics de démarrage sur VM1 avec un compte de stockage managé." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: "The Azure Monitor Agent collects only what the data collection rules associated with the machine define. VM1 is no longer associated with the VM insights rule, so the agent runs but sends nothing to law-ops. Adding VM1 back as a resource of the rule recreates the association and the guest performance data flows again."
        fr: "L'agent Azure Monitor ne collecte que ce que définissent les règles de collecte de données associées à la machine. VM1 n'est plus associée à la règle de VM Insights : l'agent fonctionne mais n'envoie rien à law-ops. Rajouter VM1 comme ressource de la règle recrée l'association, et les données de performances de l'invité reviennent."
      options:
        b: { en: "A diagnostic setting routes platform metrics, which Metrics Explorer already shows; VM insights needs the guest performance data collected by the agent.", fr: "Un paramètre de diagnostic achemine les métriques de plateforme, que Metrics Explorer affiche déjà ; VM Insights a besoin des données de performances de l'invité collectées par l'agent." }
        c: { en: "Installing the extension alone creates no association: without a data collection rule, the agent still collects nothing.", fr: "Installer l'extension seule ne crée aucune association : sans règle de collecte de données, l'agent ne collecte toujours rien." }
        d: { en: "Boot diagnostics capture the console output and screenshot of the boot; they play no part in VM insights.", fr: "Les diagnostics de démarrage capturent la sortie console et la capture d'écran du démarrage ; ils ne jouent aucun rôle dans VM Insights." }
    references:
      - title: Install and manage the Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-manage
      - title: Enable VM monitoring in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable-portal

  - id: az104-qz-51-04
    objective: "5.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso runs its production virtual machines in the West Europe region, in a subscription named **Sub1**. An action group named **ag-ops** sends SMS messages to the operations team.

        The team must be notified when Microsoft publishes a service issue or a planned maintenance for the Virtual Machines service in West Europe that affects Sub1.

        What should you create?
      fr: |
        Contoso exécute ses machines virtuelles de production dans la région West Europe, dans un abonnement nommé **Sub1**. Un groupe d'actions nommé **ag-ops** envoie des SMS à l'équipe d'exploitation.

        L'équipe doit être notifiée quand Microsoft publie un problème de service ou une maintenance planifiée pour le service Virtual Machines dans West Europe qui concerne Sub1.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A metric alert rule on the VM Availability Metric of the virtual machines in West Europe, with a static threshold, that uses ag-ops", fr: "Une règle d'alerte de métrique sur la métrique VM Availability Metric des machines virtuelles de West Europe, avec un seuil statique, qui utilise ag-ops" } }
        - { id: b, text: { en: "A Service Health alert rule for Virtual Machines in West Europe, for service issues and planned maintenance, that uses ag-ops", fr: "Une règle d'alerte Service Health pour Virtual Machines dans West Europe, pour les problèmes de service et les maintenances planifiées, qui utilise ag-ops" } }
        - { id: c, text: { en: "A Resource Health alert rule on the virtual machines of Sub1 in West Europe, for the Unavailable and Degraded statuses, that uses ag-ops", fr: "Une règle d'alerte Resource Health sur les machines virtuelles de Sub1 dans West Europe, pour les états Unavailable et Degraded, qui utilise ag-ops" } }
        - { id: d, text: { en: "An alert processing rule scoped to Sub1 that applies ag-ops to the Service Health alerts of West Europe", fr: "Une règle de traitement des alertes dont l'étendue est Sub1 et qui applique ag-ops aux alertes Service Health de West Europe" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Service Health notifications are stored in the activity log, and a Service Health alert rule (an activity log alert on that category) fires when Microsoft publishes one for your subscription. You filter it by service, region and event type (service issues, planned maintenance, health advisories, security advisories) and attach ag-ops. No agent and no workspace are needed."
        fr: "Les notifications Service Health sont stockées dans le journal d'activité, et une règle d'alerte Service Health (une alerte de journal d'activité sur cette catégorie) se déclenche quand Microsoft en publie une pour votre abonnement. Vous la filtrez par service, région et type d'événement (problèmes de service, maintenance planifiée, avis d'intégrité, avis de sécurité) et y associez ag-ops. Aucun agent ni espace de travail n'est nécessaire."
      options:
        a: { en: "A metric alert detects that a virtual machine became unavailable after the fact; it does not report the service issues and planned maintenance announced by Microsoft.", fr: "Une alerte de métrique détecte après coup qu'une machine virtuelle est devenue indisponible ; elle ne signale pas les problèmes de service et les maintenances planifiées annoncés par Microsoft." }
        c: { en: "Resource Health alerts report changes in the health of each of your resources; they are not the alerts for the service-wide notifications that Microsoft publishes.", fr: "Les alertes Resource Health signalent les changements d'intégrité de chacune de vos ressources ; ce ne sont pas les alertes des notifications de service publiées par Microsoft." }
        d: { en: "An alert processing rule never creates alerts, and alert processing rules don't affect Service Health alerts.", fr: "Une règle de traitement des alertes ne crée jamais d'alertes, et les règles de traitement des alertes n'agissent pas sur les alertes Service Health." }
    references:
      - title: Create Service Health alerts
        url: https://learn.microsoft.com/en-us/azure/service-health/alerts-activity-log-service-notifications-portal
      - title: Alert processing rules
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules

  - id: az104-qz-51-05
    objective: "5.1.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Your Windows virtual machines send their Application event log to a Log Analytics workspace by using the Azure Monitor Agent. The names of the web servers start with WEB (WEB01, WEB02 and so on).

        You need a query that returns, for the web servers only, the number of Error and Warning events of the last 12 hours for each computer and each event source.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vos machines virtuelles Windows envoient leur journal d'événements Application à un espace de travail Log Analytics avec l'agent Azure Monitor. Les noms des serveurs web commencent par WEB (WEB01, WEB02, etc.).

        Vous avez besoin d'une requête qui renvoie, pour les serveurs web uniquement, le nombre d'événements Error et Warning des 12 dernières heures pour chaque ordinateur et chaque source d'événement.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        Event
        | where TimeGenerated > ago(12h)
        | where EventLog == "Application"
        | where [[level]]
        | where [[name]]
        | summarize Events = count() by Computer, [[group]]
      slots:
        - id: level
          options:
            - { id: lin, text: 'EventLevelName in ("Error", "Warning")' }
            - { id: land, text: 'EventLevelName == "Error" and EventLevelName == "Warning"' }
            - { id: lcontains, text: 'EventLevelName contains "Error,Warning"' }
        - id: name
          options:
            - { id: nequal, text: 'Computer == "WEB*"' }
            - { id: nstart, text: 'Computer startswith "WEB"' }
            - { id: nend, text: 'Computer endswith "WEB"' }
        - id: group
          options:
            - { id: geventid, text: EventID }
            - { id: gbin, text: "bin(TimeGenerated, 12h)" }
            - { id: gsource, text: Source }
            - { id: gdesc, text: RenderedDescription }
    answer:
      values: { level: lin, name: nstart, group: gsource }
    explanation:
      correct:
        en: "`in` keeps the rows whose level equals any value of the list, so both Error and Warning events remain. `startswith` keeps the computers whose name begins with WEB, including fully qualified names such as WEB01.contoso.com. Grouping by Computer and Source gives one count per computer and per event source."
        fr: "`in` garde les lignes dont le niveau vaut l'une des valeurs de la liste : les événements Error et Warning restent tous deux. `startswith` garde les ordinateurs dont le nom commence par WEB, y compris les noms complets comme WEB01.contoso.com. Le regroupement par Computer et Source donne un total par ordinateur et par source d'événement."
      options:
        land: { en: "An event has a single level, so it can never be both Error and Warning: the condition returns no rows.", fr: "Un événement n'a qu'un seul niveau, il ne peut donc jamais être à la fois Error et Warning : la condition ne renvoie aucune ligne." }
        lcontains: { en: "contains looks for the literal text Error,Warning inside the level, which no event has.", fr: "contains cherche le texte littéral Error,Warning dans le niveau, qu'aucun événement ne possède." }
        nequal: { en: "== is an exact comparison: the asterisk is not a wildcard, so only a computer literally named WEB* would match.", fr: "== est une comparaison exacte : l'astérisque n'est pas un caractère générique, seul un ordinateur nommé littéralement WEB* correspondrait." }
        nend: { en: "endswith tests the end of the name, not its beginning.", fr: "endswith teste la fin du nom, pas son début." }
        geventid: { en: "Grouping by EventID counts per event number, not per event source.", fr: "Regrouper par EventID compte par numéro d'événement, pas par source d'événement." }
        gbin: { en: "A 12-hour bin produces time buckets, not one count per source.", fr: "Une tranche de 12 heures produit des tranches de temps, pas un total par source." }
        gdesc: { en: "Grouping by the description text produces one row per distinct message, not per source.", fr: "Regrouper par le texte de la description produit une ligne par message distinct, pas par source." }
    references:
      - title: String operators
        url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
      - title: Azure Monitor Logs reference - Event
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/event

  - id: az104-qz-51-06
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A virtual machine named **VM-WEB1** hosts an online store. Users reported slow pages between 14:10 and 14:20 yesterday.

        In Metrics Explorer, you open a chart of the **Percentage CPU** metric of VM-WEB1 with the following settings:

        - Time range: yesterday, from 00:00 to 24:00
        - Time granularity: 1 hour
        - Aggregation: Avg

        The highest point of the chart is 45%, for the 14:00 to 15:00 interval.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une machine virtuelle nommée **VM-WEB1** héberge une boutique en ligne. Des utilisateurs ont signalé des pages lentes hier entre 14 h 10 et 14 h 20.

        Dans Metrics Explorer, vous ouvrez un graphique de la métrique **Percentage CPU** de VM-WEB1 avec les réglages suivants :

        - Plage de temps : hier, de 00 h 00 à 24 h 00
        - Granularité temporelle : 1 heure
        - Agrégation : Avg

        Le point le plus haut du graphique vaut 45 %, pour l'intervalle de 14 h 00 à 15 h 00.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The chart proves that the Percentage CPU of VM-WEB1 never exceeded 45% between 14:00 and 15:00."
            fr: "Le graphique prouve que le Percentage CPU de VM-WEB1 n'a jamais dépassé 45 % entre 14 h 00 et 15 h 00."
        - id: s2
          text:
            en: "If you change only the aggregation to Max, the point of the 14:00 interval displays a value of 45% or more."
            fr: "Si vous passez uniquement l'agrégation à Max, le point de l'intervalle de 14 h 00 affiche une valeur de 45 % ou plus."
        - id: s3
          text:
            en: "If you change only the time granularity to 5 minutes, the chart can display points above 45% between 14:00 and 15:00."
            fr: "Si vous passez uniquement la granularité temporelle à 5 minutes, le graphique peut afficher des points au-dessus de 45 % entre 14 h 00 et 15 h 00."
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: "With Avg, each point is the sum of the values captured during the interval divided by their count, so a 10-minute peak is diluted over the hour (No). Max returns the largest value captured during the interval, which is never lower than the average of the same interval (Yes). With 5-minute buckets the average is computed over shorter periods, so the buckets of the peak can be well above the hourly average of 45% (Yes)."
        fr: "Avec Avg, chaque point est la somme des valeurs capturées pendant l'intervalle divisée par leur nombre : un pic de 10 minutes est dilué sur l'heure (Non). Max renvoie la plus grande valeur capturée pendant l'intervalle, qui n'est jamais inférieure à la moyenne du même intervalle (Oui). Avec des tranches de 5 minutes, la moyenne est calculée sur des périodes plus courtes : les tranches du pic peuvent dépasser largement la moyenne horaire de 45 % (Oui)."
    references:
      - title: Azure Monitor metrics aggregation and display explained
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/metrics-aggregation-explained

  - id: az104-qz-51-07
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has 20 Linux virtual machines in Azure and 15 Linux servers in its on-premises datacenter. The on-premises servers have outbound internet access but are not connected to Azure in any way. No monitoring agent is installed on the 35 servers. A Log Analytics workspace named **law-sec** exists in the West Europe region.

        The security team needs the Syslog messages of the auth and authpriv facilities, with a severity of Warning or higher, from all 35 servers in law-sec. The solution must minimize administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de 20 machines virtuelles Linux dans Azure et de 15 serveurs Linux dans son centre de données local. Les serveurs locaux ont un accès Internet sortant mais ne sont reliés à Azure d'aucune manière. Aucun agent de supervision n'est installé sur les 35 serveurs. Un espace de travail Log Analytics nommé **law-sec** existe dans la région West Europe.

        L'équipe de sécurité a besoin dans law-sec des messages Syslog des facilités auth et authpriv, de gravité Warning ou supérieure, provenant des 35 serveurs. La solution doit réduire au minimum l'effort d'administration.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Install the Log Analytics agent on the 15 on-premises servers and connect the agent to law-sec.", fr: "Installer l'agent Log Analytics sur les 15 serveurs locaux et connecter l'agent à law-sec." } }
        - { id: b, text: { en: "Install the Azure Connected Machine agent on the 15 on-premises servers.", fr: "Installer l'agent Azure Connected Machine sur les 15 serveurs locaux." } }
        - { id: c, text: { en: "Create a diagnostic setting on each Azure virtual machine that sends its logs to law-sec.", fr: "Créer sur chaque machine virtuelle Azure un paramètre de diagnostic qui envoie ses journaux à law-sec." } }
        - { id: d, text: { en: "Create a data collection rule with a Syslog data source and law-sec as destination, and associate it with the 35 servers.", fr: "Créer une règle de collecte de données avec une source de données Syslog et law-sec comme destination, puis l'associer aux 35 serveurs." } }
        - { id: e, text: { en: "Enable VM insights on the 35 servers and select law-sec as the Log Analytics workspace.", fr: "Activer VM Insights sur les 35 serveurs et sélectionner law-sec comme espace de travail Log Analytics." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: "Guest data such as Syslog is collected by the Azure Monitor Agent according to a data collection rule, in which you select each facility and its minimum log level. A machine outside Azure must first become an Azure Arc-enabled server by installing the Connected Machine agent. When you add the 35 machines as resources of the rule in the portal, the Azure Monitor Agent is installed where it is missing and the associations are created."
        fr: "Les données de l'invité comme Syslog sont collectées par l'agent Azure Monitor selon une règle de collecte de données, dans laquelle vous choisissez chaque facilité et son niveau minimal. Une machine hors Azure doit d'abord devenir un serveur avec Azure Arc grâce à l'agent Connected Machine. Quand vous ajoutez les 35 machines comme ressources de la règle dans le portail, l'agent Azure Monitor s'installe là où il manque et les associations sont créées."
      options:
        a: { en: "The Log Analytics agent is retired and no longer supported; the Azure Monitor Agent replaces it.", fr: "L'agent Log Analytics est retiré et n'est plus pris en charge ; l'agent Azure Monitor le remplace." }
        c: { en: "A diagnostic setting routes the platform metrics and resource logs of a resource; Syslog messages are guest data that it cannot collect, and it does not cover the on-premises servers.", fr: "Un paramètre de diagnostic achemine les métriques de plateforme et les journaux de ressources d'une ressource ; les messages Syslog sont des données de l'invité qu'il ne peut pas collecter, et il ne couvre pas les serveurs locaux." }
        e: { en: "VM insights collects performance data with its own rule; it does not collect the Syslog facilities, and it still requires the on-premises servers to be Arc-enabled.", fr: "VM Insights collecte des données de performances avec sa propre règle ; il ne collecte pas les facilités Syslog, et il exige quand même que les serveurs locaux soient activés par Arc." }
    references:
      - title: Collect Syslog events from virtual machine client with Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-syslog
      - title: Install and manage the Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-manage

  - id: az104-qz-51-08
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Your Windows virtual machines send their System event log to a Log Analytics workspace named **law-ops**. To find the drivers and services that cause errors on many servers at once, a colleague runs the following query in law-ops.

        ```kusto
        Event
        | where TimeGenerated > ago(1d)
        | where EventLog == "System" and EventLevelName == "Error"
        | summarize Errors = count(), Machines = dcount(Computer) by Source
        | where Machines >= 3
        | top 5 by Errors desc
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vos machines virtuelles Windows envoient leur journal d'événements System à un espace de travail Log Analytics nommé **law-ops**. Pour trouver les pilotes et les services qui provoquent des erreurs sur de nombreux serveurs à la fois, un collègue exécute la requête suivante dans law-ops.

        ```kusto
        Event
        | where TimeGenerated > ago(1d)
        | where EventLog == "System" and EventLevelName == "Error"
        | summarize Errors = count(), Machines = dcount(Computer) by Source
        | where Machines >= 3
        | top 5 by Errors desc
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "A source that logged 400 errors on two computers is excluded from the result."
            fr: "Une source qui a enregistré 400 erreurs sur deux ordinateurs est exclue du résultat."
        - id: s2
          text:
            en: "The result contains one row for each computer that logged at least one error."
            fr: "Le résultat contient une ligne pour chaque ordinateur qui a enregistré au moins une erreur."
        - id: s3
          text:
            en: "If you replace the last line with `take 5`, the query still returns the five sources that have the most errors."
            fr: "Si vous remplacez la dernière ligne par `take 5`, la requête renvoie toujours les cinq sources qui ont le plus d'erreurs."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: "summarize by Source produces one row per event source, with the total number of errors and the number of distinct computers on which the source logged them (No for one row per computer). The where that follows keeps only the sources seen on three computers or more, so a source seen on two computers is removed whatever its error count (Yes). top 5 by Errors desc sorts and keeps the five largest, whereas take returns any five rows, with no guarantee about which ones, because the data is not sorted (No)."
        fr: "summarize by Source produit une ligne par source d'événement, avec le nombre total d'erreurs et le nombre d'ordinateurs distincts sur lesquels la source les a enregistrées (Non pour une ligne par ordinateur). Le where qui suit ne garde que les sources vues sur trois ordinateurs ou plus : une source vue sur deux ordinateurs est écartée quel que soit son nombre d'erreurs (Oui). top 5 by Errors desc trie et garde les cinq plus grandes valeurs, alors que take renvoie cinq lignes quelconques, sans garantie sur lesquelles, car les données ne sont pas triées (Non)."
    references:
      - title: dcount() (aggregation function)
        url: https://learn.microsoft.com/en-us/kusto/query/dcount-aggregation-function
      - title: take operator
        url: https://learn.microsoft.com/en-us/kusto/query/take-operator

  - id: az104-qz-51-09
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have 40 Windows virtual machines in a resource group named **RG-App**. A data collection rule sends the `% Free Space` counter of the LogicalDisk object, for every volume, to a Log Analytics workspace named **law1** every minute. An action group named **ag-ops** exists.

        You need to configure alerting that meets the following requirements:

        - An alert fires when a volume of a virtual machine has less than 10% free space.
        - Each affected virtual machine generates its own alert, even when another virtual machine already has a fired alert.
        - The alert of a virtual machine is resolved automatically when its free space is back above the threshold.
        - ag-ops is notified for each alert.

        The solution must minimize the number of alert rules. What should you create?
      fr: |
        Vous disposez de 40 machines virtuelles Windows dans un groupe de ressources nommé **RG-App**. Une règle de collecte de données envoie toutes les minutes le compteur `% Free Space` de l'objet LogicalDisk, pour chaque volume, à un espace de travail Log Analytics nommé **law1**. Un groupe d'actions nommé **ag-ops** existe.

        Vous devez configurer des alertes qui répondent aux exigences suivantes :

        - Une alerte se déclenche quand un volume d'une machine virtuelle a moins de 10 % d'espace libre.
        - Chaque machine virtuelle concernée génère sa propre alerte, même quand une autre machine virtuelle a déjà une alerte déclenchée.
        - L'alerte d'une machine virtuelle est résolue automatiquement quand son espace libre repasse au-dessus du seuil.
        - ag-ops est notifié pour chaque alerte.

        La solution doit réduire au minimum le nombre de règles d'alerte. Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "One log search alert rule on law1, with no dimension and with automatic resolution of alerts enabled", fr: "Une règle d'alerte de recherche dans les journaux sur law1, sans dimension et avec la résolution automatique des alertes activée" } }
        - { id: b, text: { en: "One metric alert rule scoped to the 40 virtual machines, on the OS Disk IOPS Consumed Percentage metric with a static threshold", fr: "Une règle d'alerte de métrique dont l'étendue couvre les 40 machines virtuelles, sur la métrique OS Disk IOPS Consumed Percentage avec un seuil statique" } }
        - { id: c, text: { en: "One log search alert rule on law1, split by the Azure Resource ID column and with automatic resolution of alerts enabled", fr: "Une règle d'alerte de recherche dans les journaux sur law1, fractionnée par la colonne Azure Resource ID et avec la résolution automatique des alertes activée" } }
        - { id: d, text: { en: "One log search alert rule per virtual machine, each on law1 and with automatic resolution of alerts enabled", fr: "Une règle d'alerte de recherche dans les journaux par machine virtuelle, chacune sur law1 et avec la résolution automatique des alertes activée" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "Free disk space is guest data stored in law1, so the signal is a log search alert. When the query is split by the Azure Resource ID column, the rule evaluates each virtual machine separately and fires an alert for each one that meets the condition. Automatic resolution makes the alerts stateful: each one is resolved when its own condition is no longer met."
        fr: "L'espace disque libre est une donnée de l'invité stockée dans law1 : le signal est donc une alerte de recherche dans les journaux. Quand la requête est fractionnée par la colonne Azure Resource ID, la règle évalue chaque machine virtuelle séparément et déclenche une alerte pour chacune de celles qui remplissent la condition. La résolution automatique rend les alertes avec état : chacune est résolue quand sa propre condition n'est plus remplie."
      options:
        a: { en: "Without a dimension, the rule evaluates all the machines as one series and fires a single alert on the workspace; while it is fired, a second machine does not generate its own alert.", fr: "Sans dimension, la règle évalue toutes les machines comme une seule série et déclenche une seule alerte sur l'espace de travail ; tant qu'elle est déclenchée, une deuxième machine ne génère pas sa propre alerte." }
        b: { en: "No platform metric measures free disk space: OS Disk IOPS Consumed Percentage measures the use of the disk's IOPS, not its capacity, and it ignores data disks.", fr: "Aucune métrique de plateforme ne mesure l'espace disque libre : OS Disk IOPS Consumed Percentage mesure l'utilisation des IOPS du disque, pas sa capacité, et ignore les disques de données." }
        d: { en: "Forty rules meet the requirements, but a single rule split by resource does the same and minimizes the number of rules.", fr: "Quarante règles répondent aux exigences, mais une seule règle fractionnée par ressource fait de même et réduit au minimum le nombre de règles." }
    references:
      - title: Create or edit a log search alert rule
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
      - title: Supported metrics - Microsoft.Compute/virtualMachines
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-compute-virtualmachines-metrics

  - id: az104-qz-51-10
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A subscription named **Sub1** contains the following alert configuration. All the rules were created more than a month ago.

        | Name | Type | Configuration |
        | --- | --- | --- |
        | AR-VM1 | Metric alert rule | Scope: VM1 in resource group RG1. Severity: Sev1. Action group: AG-Mail |
        | AR-VM2 | Metric alert rule | Scope: VM2 in resource group RG2. Severity: Sev1. Action group: AG-Mail |
        | AR-VM3 | Metric alert rule | Scope: VM3 in resource group RG2. Severity: Sev3. Action group: AG-Mail |
        | APR-Patch | Alert processing rule | Scope: RG1. Action: Suppress notifications. Schedule: every Saturday from 01:00 to 05:00 |
        | APR-Pager | Alert processing rule | Scope: Sub1. Filter: Severity equals Sev0 or Sev1. Action: Apply action group AG-Pager. Schedule: always active |

        On Saturday at 02:00, AR-VM1, AR-VM2 and AR-VM3 each fire an alert.

        How are the three alerts processed? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un abonnement nommé **Sub1** contient la configuration d'alertes suivante. Toutes les règles ont été créées il y a plus d'un mois.

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | AR-VM1 | Règle d'alerte de métrique | Étendue : VM1 dans le groupe de ressources RG1. Gravité : Sev1. Groupe d'actions : AG-Mail |
        | AR-VM2 | Règle d'alerte de métrique | Étendue : VM2 dans le groupe de ressources RG2. Gravité : Sev1. Groupe d'actions : AG-Mail |
        | AR-VM3 | Règle d'alerte de métrique | Étendue : VM3 dans le groupe de ressources RG2. Gravité : Sev3. Groupe d'actions : AG-Mail |
        | APR-Patch | Règle de traitement des alertes | Étendue : RG1. Action : Suppress notifications. Planification : chaque samedi de 01 h 00 à 05 h 00 |
        | APR-Pager | Règle de traitement des alertes | Étendue : Sub1. Filtre : Severity égale à Sev0 ou Sev1. Action : Apply action group AG-Pager. Planification : toujours active |

        Le samedi à 02 h 00, AR-VM1, AR-VM2 et AR-VM3 déclenchent chacune une alerte.

        Comment les trois alertes sont-elles traitées ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Action groups invoked for the alert of AR-VM1: [[vm1]]
          Action groups invoked for the alert of AR-VM2: [[vm2]]
          Action groups invoked for the alert of AR-VM3: [[vm3]]
          On the Alerts page, the alert of AR-VM1: [[page]]
        fr: |
          Groupes d'actions appelés pour l'alerte d'AR-VM1 : [[vm1]]
          Groupes d'actions appelés pour l'alerte d'AR-VM2 : [[vm2]]
          Groupes d'actions appelés pour l'alerte d'AR-VM3 : [[vm3]]
          Sur la page Alertes, l'alerte d'AR-VM1 : [[page]]
      slots:
        - id: vm1
          options:
            - { id: v1none, text: { en: "None", fr: "Aucun" } }
            - { id: v1mail, text: { en: "AG-Mail only", fr: "AG-Mail uniquement" } }
            - { id: v1pager, text: { en: "AG-Pager only", fr: "AG-Pager uniquement" } }
            - { id: v1both, text: { en: "AG-Mail and AG-Pager", fr: "AG-Mail et AG-Pager" } }
        - id: vm2
          options:
            - { id: v2none, text: { en: "None", fr: "Aucun" } }
            - { id: v2mail, text: { en: "AG-Mail only", fr: "AG-Mail uniquement" } }
            - { id: v2pager, text: { en: "AG-Pager only", fr: "AG-Pager uniquement" } }
            - { id: v2both, text: { en: "AG-Mail and AG-Pager", fr: "AG-Mail et AG-Pager" } }
        - id: vm3
          options:
            - { id: v3none, text: { en: "None", fr: "Aucun" } }
            - { id: v3mail, text: { en: "AG-Mail only", fr: "AG-Mail uniquement" } }
            - { id: v3pager, text: { en: "AG-Pager only", fr: "AG-Pager uniquement" } }
            - { id: v3both, text: { en: "AG-Mail and AG-Pager", fr: "AG-Mail et AG-Pager" } }
        - id: page
          options:
            - { id: plisted, text: { en: "is listed as a fired alert", fr: "est listée comme alerte déclenchée" } }
            - { id: pnone, text: { en: "is not created", fr: "n'est pas créée" } }
            - { id: plater, text: { en: "is listed only after 05:00", fr: "n'est listée qu'après 05 h 00" } }
    answer:
      values: { vm1: v1none, vm2: v2both, vm3: v3mail, page: plisted }
    explanation:
      correct:
        en: "VM1 is in RG1, so both processing rules apply to its alert; suppression has a higher priority than Apply action groups, so neither AG-Mail nor AG-Pager is invoked. The alert of VM2 is outside RG1 and has severity Sev1, so APR-Pager adds AG-Pager to the AG-Mail of the rule. The Sev3 alert of VM3 matches no processing rule and only calls AG-Mail. A suppressed alert still fires and stays visible on the Alerts page."
        fr: "VM1 est dans RG1 : les deux règles de traitement s'appliquent à son alerte, et la suppression est prioritaire sur Apply action group, donc ni AG-Mail ni AG-Pager n'est appelé. L'alerte de VM2 est hors de RG1 et de gravité Sev1 : APR-Pager ajoute AG-Pager à l'AG-Mail de la règle. L'alerte Sev3 de VM3 ne correspond à aucune règle de traitement et n'appelle qu'AG-Mail. Une alerte supprimée se déclenche quand même et reste visible sur la page Alertes."
      options:
        v1pager: { en: "Apply action group does not override suppression: when both rule types affect an alert, all its action groups are suppressed.", fr: "Apply action group ne l'emporte pas sur la suppression : quand les deux types de règles touchent une alerte, tous ses groupes d'actions sont supprimés." }
        v1mail: { en: "Suppression removes all the action groups of the alert, including the one defined on the alert rule.", fr: "La suppression retire tous les groupes d'actions de l'alerte, y compris celui défini sur la règle d'alerte." }
        v2mail: { en: "APR-Pager covers the whole subscription and matches Sev1, so it adds AG-Pager to the alert of VM2.", fr: "APR-Pager couvre tout l'abonnement et correspond à Sev1 : il ajoute AG-Pager à l'alerte de VM2." }
        v3both: { en: "The severity filter of APR-Pager keeps only Sev0 and Sev1 alerts; a Sev3 alert is not affected.", fr: "Le filtre de gravité d'APR-Pager ne garde que les alertes Sev0 et Sev1 ; une alerte Sev3 n'est pas concernée." }
        pnone: { en: "An alert processing rule never prevents an alert from firing; it only changes the actions invoked.", fr: "Une règle de traitement des alertes n'empêche jamais une alerte de se déclencher ; elle ne change que les actions appelées." }
    references:
      - title: Alert processing rules
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
