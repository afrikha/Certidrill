chapter: 22-storage-accounts
questions:
  # ---------------------------------------------------------------- 1
  - id: az104-qz-22-01
    objective: "2.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You create a general-purpose v2 storage account named **stcontosodocs** with the default settings and upload blobs to it. You do not configure any encryption option.

        How is the data in stcontosodocs protected at rest?
      fr: |
        Vous créez un compte de stockage usage général v2 nommé **stcontosodocs** avec les paramètres par défaut et vous y chargez des objets blob. Vous ne configurez aucune option de chiffrement.

        Comment les données de stcontosodocs sont-elles protégées au repos ?
    body:
      options:
        - id: a
          text: { en: "They are encrypted with 256-bit AES by using Microsoft-managed keys.", fr: "Elles sont chiffrées en AES 256 bits avec des clés gérées par Microsoft." }
        - id: b
          text: { en: "They are not encrypted until you enable Storage Service Encryption.", fr: "Elles ne sont pas chiffrées tant que vous n'activez pas Storage Service Encryption." }
        - id: c
          text: { en: "They are encrypted twice, at the service and infrastructure levels.", fr: "Elles sont chiffrées deux fois, au niveau du service et de l'infrastructure." }
        - id: d
          text: { en: "They are encrypted with a customer-managed key that Azure creates.", fr: "Elles sont chiffrées avec une clé gérée par le client créée par Azure." }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Storage encryption is enabled for every storage account and cannot be disabled. Data is encrypted with 256-bit AES, and a new account uses Microsoft-managed keys by default, at no extra cost. The only choice you make is which key protects the data.
        fr: |
          Le chiffrement du Stockage Azure est activé sur tous les comptes de stockage et ne peut pas être désactivé. Les données sont chiffrées en AES 256 bits, et un nouveau compte utilise par défaut des clés gérées par Microsoft, sans coût supplémentaire. Le seul choix à faire porte sur la clé qui protège les données.
      options:
        b:
          en: |
            Storage Service Encryption is the at-rest encryption itself; it is always on and there is nothing to enable.
          fr: |
            Storage Service Encryption est le chiffrement au repos lui-même ; il est toujours actif et il n'y a rien à activer.
        c:
          en: |
            Infrastructure encryption is an optional second layer; it is disabled unless you enable it, which you can do only when you create the account.
          fr: |
            Le chiffrement de l'infrastructure est une seconde couche facultative ; il reste désactivé tant que vous ne l'activez pas, ce qui n'est possible qu'à la création du compte.
        d:
          en: |
            Azure never creates a customer-managed key for you: you create it in Azure Key Vault or Managed HSM and configure the account to use it. Without that configuration, Microsoft-managed keys are used.
          fr: |
            Azure ne crée jamais de clé gérée par le client à votre place : vous la créez dans Azure Key Vault ou un HSM managé et configurez le compte pour l'utiliser. Sans cette configuration, ce sont des clés gérées par Microsoft qui sont utilisées.
    references:
      - title: Azure Storage encryption for data at rest
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption

  # ---------------------------------------------------------------- 2
  - id: az104-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to configure object replication between two general-purpose v2 storage accounts.

        Which blobs can object replication copy from the source container to the destination container?
      fr: |
        Vous prévoyez de configurer la réplication d'objets entre deux comptes de stockage usage général v2.

        Quels objets blob la réplication d'objets peut-elle copier du conteneur source vers le conteneur de destination ?
    body:
      options:
        - id: a
          text: { en: "Block blobs only", fr: "Les objets blob de blocs uniquement" }
        - id: b
          text: { en: "Block blobs and append blobs only", fr: "Les objets blob de blocs et d'ajout uniquement" }
        - id: c
          text: { en: "Block blobs and page blobs only", fr: "Les objets blob de blocs et de pages uniquement" }
        - id: d
          text: { en: "Block blobs, append blobs and page blobs", fr: "Les objets blob de blocs, d'ajout et de pages" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Object replication supports block blobs only. Append blobs and page blobs stored in the source container are never copied to the destination container.
        fr: |
          La réplication d'objets ne prend en charge que les objets blob de blocs. Les objets blob d'ajout et de pages du conteneur source ne sont jamais copiés vers le conteneur de destination.
      options:
        b:
          en: |
            Append blobs, such as logs, are not supported by object replication.
          fr: |
            Les objets blob d'ajout, comme les journaux, ne sont pas pris en charge par la réplication d'objets.
        c:
          en: |
            Page blobs are not supported by object replication.
          fr: |
            Les objets blob de pages ne sont pas pris en charge par la réplication d'objets.
        d:
          en: |
            Only one of the three blob types is supported; append and page blobs are excluded.
          fr: |
            Un seul des trois types d'objets blob est pris en charge ; les objets blob d'ajout et de pages sont exclus.
    references:
      - title: Object replication overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview

  # ---------------------------------------------------------------- 3
  - id: az104-qz-22-03
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a standard general-purpose v2 storage account named **stfabdata** that was created without a hierarchical namespace. The account contains only block blobs, and none of its enabled features conflicts with a hierarchical namespace.

        The data engineering team needs a hierarchical namespace on the data of stfabdata. The applications must keep using the same account name and endpoints.

        What should you do?
      fr: |
        Fabrikam dispose d'un compte de stockage usage général v2 standard nommé **stfabdata**, créé sans espace de noms hiérarchique. Le compte ne contient que des objets blob de blocs, et aucune des fonctionnalités activées n'est incompatible avec un espace de noms hiérarchique.

        L'équipe d'ingénierie des données a besoin d'un espace de noms hiérarchique sur les données de stfabdata. Les applications doivent continuer à utiliser le même nom de compte et les mêmes points de terminaison.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text: { en: "Upgrade stfabdata by using the **Data Lake Gen2 migration** option of the account.", fr: "Mettre à niveau stfabdata avec l'option **Data Lake Gen2 migration** du compte." }
        - id: b
          text: { en: "Create an account that has a hierarchical namespace, and then copy the data by using AzCopy.", fr: "Créer un compte doté d'un espace de noms hiérarchique, puis copier les données avec AzCopy." }
        - id: c
          text: { en: "Change the account kind of stfabdata to `BlockBlobStorage`, and then enable the namespace.", fr: "Changer le type de compte de stfabdata en `BlockBlobStorage`, puis activer l'espace de noms." }
        - id: d
          text: { en: "Run `az storage account migration start` on stfabdata to enable the namespace.", fr: "Exécuter `az storage account migration start` sur stfabdata pour activer l'espace de noms." }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An existing account without a hierarchical namespace can be upgraded in place with **Data Lake Gen2 migration** (validation, then upgrade); the account keeps its name and endpoints. The upgrade is one-way, and writes are paused while it runs.
        fr: |
          Un compte existant sans espace de noms hiérarchique peut être mis à niveau sur place avec **Data Lake Gen2 migration** (validation, puis mise à niveau) ; le compte conserve son nom et ses points de terminaison. La mise à niveau est irréversible, et les écritures sont suspendues pendant l'opération.
      options:
        b:
          en: |
            A new account has a new name and new endpoints, which the applications must not have to use.
          fr: |
            Un nouveau compte a un nouveau nom et de nouveaux points de terminaison, que les applications ne doivent pas avoir à utiliser.
        c:
          en: |
            The type of a storage account can't be changed after creation; moving to premium block blobs requires a new account.
          fr: |
            Le type d'un compte de stockage ne peut pas être changé après la création ; passer aux objets blob de blocs Premium exige un nouveau compte.
        d:
          en: "`az storage account migration start` requests a redundancy conversion, such as LRS to ZRS; it does not add a hierarchical namespace."
          fr: "`az storage account migration start` demande une conversion de la redondance, par exemple de LRS vers ZRS ; elle n'ajoute pas d'espace de noms hiérarchique."
    references:
      - title: Upgrade Azure Blob Storage with Azure Data Lake Storage capabilities
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/upgrade-to-data-lake-storage-gen2-how-to
      - title: Storage account overview
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview

  # ---------------------------------------------------------------- 4
  - id: az104-qz-22-04
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A user named **User1** has the **Storage Blob Data Contributor** role on a storage account named **stsales01** and no other role assignment. User1 signs in to Azure Storage Explorer with a Microsoft Entra account and selects the subscription of stsales01, but no storage account is listed under the subscription.

        You need stsales01 to be listed under the subscription in Storage Explorer. The solution must follow the principle of least privilege.

        Which role should you assign to User1 on stsales01?
      fr: |
        Un utilisateur nommé **User1** dispose du rôle **Storage Blob Data Contributor** sur un compte de stockage nommé **stsales01** et d'aucune autre attribution de rôle. User1 se connecte à l'Explorateur Stockage Azure avec un compte Microsoft Entra et sélectionne l'abonnement de stsales01, mais aucun compte de stockage n'apparaît sous l'abonnement.

        Vous devez faire en sorte que stsales01 apparaisse sous l'abonnement dans l'Explorateur Stockage Azure. La solution doit respecter le principe du privilège minimum.

        Quel rôle devez-vous attribuer à User1 sur stsales01 ?
    body:
      options:
        - id: a
          text: Reader
        - id: b
          text: Storage Account Contributor
        - id: c
          text: Storage Blob Data Owner
        - id: d
          text: Contributor
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Listing storage accounts after signing in is a management (Azure Resource Manager) operation, and the Reader role is the minimum that grants it. User1 already has a data role, so once the account is listed, the blob operations use Storage Blob Data Contributor.
        fr: |
          Lister les comptes de stockage après la connexion est une opération de gestion (Azure Resource Manager), et le rôle Reader est le minimum qui l'accorde. User1 a déjà un rôle de données : une fois le compte listé, les opérations sur les objets blob utilisent Storage Blob Data Contributor.
      options:
        b:
          en: |
            Storage Account Contributor lets User1 list the account, but it also grants management of the account and access to its keys, which exceeds the need.
          fr: |
            Storage Account Contributor permet à User1 de lister le compte, mais il accorde aussi la gestion du compte et l'accès à ses clés, ce qui dépasse le besoin.
        c:
          en: |
            Storage Blob Data Owner is a data plane role; like the current role, it grants no management permission, so the account would still not be listed.
          fr: |
            Storage Blob Data Owner est un rôle du plan de données ; comme le rôle actuel, il n'accorde aucune autorisation de gestion, donc le compte ne serait toujours pas listé.
        d:
          en: |
            Contributor lists the account but grants full management of it, including its keys, which does not follow least privilege.
          fr: |
            Contributor liste le compte mais accorde sa gestion complète, clés comprises, ce qui ne respecte pas le principe du privilège minimum.
    references:
      - title: Azure Storage Explorer troubleshooting guide
        url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-storage/blobs/alerts/storage-explorer-troubleshooting
      - title: Get started with Storage Explorer
        url: https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer

  # ---------------------------------------------------------------- 5
  - id: az104-qz-22-05
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum is writing a design document that compares the geo-redundant options available to its new general-purpose v2 storage accounts. All the accounts will be created in the France Central region, and several application teams want to understand where the secondary copies of their data will be kept and when they can use them.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum rédige un document de conception qui compare les options géoredondantes proposées pour ses nouveaux comptes de stockage usage général v2. Tous les comptes seront créés dans la région France Central, et plusieurs équipes applicatives veulent savoir où les copies secondaires de leurs données seront conservées et quand elles pourront les utiliser.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With RA-GRS, an application can read data from the secondary endpoint while the primary region is available.", fr: "Avec RA-GRS, une application peut lire des données sur le point de terminaison secondaire pendant que la région primaire est disponible." }
        - id: s2
          text: { en: "With GZRS, Adatum can select the region that receives the asynchronous copies of the data.", fr: "Avec GZRS, Adatum peut sélectionner la région qui reçoit les copies asynchrones des données." }
        - id: s3
          text: { en: "With GZRS, the copies in the secondary region are spread across availability zones.", fr: "Avec GZRS, les copies de la région secondaire sont réparties entre des zones de disponibilité." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With read access (RA-GRS, RA-GZRS), the secondary endpoint `<account>-secondary` is always readable, not only during an outage. The secondary region is the paired region of the primary region and can't be chosen or changed. GZRS uses ZRS in the primary region, but the secondary region keeps its three copies with LRS.
        fr: |
          Avec l'accès en lecture (RA-GRS, RA-GZRS), le point de terminaison secondaire `<compte>-secondary` est toujours lisible, pas seulement pendant une panne. La région secondaire est la région jumelée de la région primaire ; elle ne peut être ni choisie ni modifiée. GZRS utilise ZRS dans la région primaire, mais la région secondaire conserve ses trois copies en LRS.
      options:
        s2:
          en: |
            Only the primary region is chosen; the secondary region is determined by the region pair (France South for France Central).
          fr: |
            Seule la région primaire est choisie ; la région secondaire est déterminée par la paire de régions (France South pour France Central).
        s3:
          en: |
            Zone redundancy applies to the primary region only; within the secondary region, the data is copied synchronously with LRS.
          fr: |
            La redondance de zone ne s'applique qu'à la région primaire ; dans la région secondaire, les données sont copiées de façon synchrone en LRS.
    references:
      - title: Data redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ---------------------------------------------------------------- 6
  - id: az104-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a standard general-purpose v2 storage account named **sttailspinlogs** that uses locally redundant storage (LRS). The account contains only block blobs in the Hot tier, which are written and read by a log-ingestion service. No other service of the account is used.

        The service now requires SSD-based storage with consistently low latency. The following requirements must also be met:

        - The data must remain available if an availability zone of the region fails.
        - All the existing blobs must be kept.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un compte de stockage usage général v2 standard nommé **sttailspinlogs** qui utilise le stockage localement redondant (LRS). Le compte ne contient que des objets blob de blocs au niveau chaud (Hot), écrits et lus par un service d'ingestion de journaux. Aucun autre service du compte n'est utilisé.

        Le service exige désormais un stockage sur SSD avec une latence faible et constante. Les exigences suivantes doivent aussi être respectées :

        - Les données doivent rester disponibles si une zone de disponibilité de la région tombe en panne.
        - Tous les objets blob existants doivent être conservés.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text: { en: "Create a premium block blob account that uses ZRS, and then copy the blobs by using AzCopy.", fr: "Créer un compte d'objets blob de blocs Premium qui utilise ZRS, puis copier les objets blob avec AzCopy." }
        - id: b
          text: { en: "Change the performance of sttailspinlogs to Premium, and then convert the account to ZRS.", fr: "Passer les performances de sttailspinlogs à Premium, puis convertir le compte en ZRS." }
        - id: c
          text: { en: "Create a premium block blob account that uses GZRS, and then copy the blobs by using AzCopy.", fr: "Créer un compte d'objets blob de blocs Premium qui utilise GZRS, puis copier les objets blob avec AzCopy." }
        - id: d
          text: { en: "Create a premium file shares account that uses ZRS, and then copy the blobs by using AzCopy.", fr: "Créer un compte de partages de fichiers Premium qui utilise ZRS, puis copier les objets blob avec AzCopy." }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          SSD performance for block blobs requires a premium block blob account (`BlockBlobStorage`), and premium accounts support ZRS, which survives a zone failure. Because the type of an existing account can't be changed, you create the new account and copy the blobs to it, for example with AzCopy.
        fr: |
          Des performances SSD pour des objets blob de blocs exigent un compte d'objets blob de blocs Premium (`BlockBlobStorage`), et les comptes Premium prennent en charge ZRS, qui résiste à la panne d'une zone. Le type d'un compte existant ne pouvant pas être changé, vous créez le nouveau compte et y copiez les objets blob, par exemple avec AzCopy.
      options:
        b:
          en: |
            The performance and type of a storage account are fixed at creation; a standard account can't become premium.
          fr: |
            Les performances et le type d'un compte de stockage sont fixés à la création ; un compte standard ne peut pas devenir Premium.
        c:
          en: |
            Premium accounts support only LRS and ZRS; GZRS is available for standard general-purpose v2 accounts only.
          fr: |
            Les comptes Premium ne prennent en charge que LRS et ZRS ; GZRS n'est disponible que pour les comptes usage général v2 standard.
        d:
          en: |
            A premium file shares account hosts Azure Files shares only; it can't store block blobs.
          fr: |
            Un compte de partages de fichiers Premium n'héberge que des partages Azure Files ; il ne peut pas stocker d'objets blob de blocs.
    references:
      - title: Storage account overview
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
      - title: Data redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ---------------------------------------------------------------- 7
  - id: az104-qz-22-07
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A Windows server named **SRV-EXP1** writes CSV files and other files to the local folder **D:\Exports** and its subfolders. AzCopy on SRV-EXP1 is signed in with a Microsoft Entra identity that has the Storage Blob Data Contributor role on the container **exports** of the storage account **stadatumexp**.

        You need to create a scheduled AzCopy command that meets the following requirements:

        - Upload only the files whose name ends with `.csv`, from D:\Exports and all its subfolders.
        - Store the uploaded blobs directly in the Cool tier. The default access tier of stadatumexp is Hot and must not change.
        - Never replace a blob that already exists in **exports**, even if the local file was modified after its upload.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur Windows nommé **SRV-EXP1** écrit des fichiers CSV et d'autres fichiers dans le dossier local **D:\Exports** et ses sous-dossiers. AzCopy sur SRV-EXP1 est connecté avec une identité Microsoft Entra qui dispose du rôle Storage Blob Data Contributor sur le conteneur **exports** du compte de stockage **stadatumexp**.

        Vous devez créer une commande AzCopy planifiée qui respecte les exigences suivantes :

        - Charger uniquement les fichiers dont le nom se termine par `.csv`, depuis D:\Exports et tous ses sous-dossiers.
        - Stocker les objets blob chargés directement au niveau froid (Cool). Le niveau d'accès par défaut de stadatumexp est chaud (Hot) et ne doit pas changer.
        - Ne jamais remplacer un objet blob qui existe déjà dans **exports**, même si le fichier local a été modifié après son chargement.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        azcopy [[cmd]] 'D:\Exports' 'https://stadatumexp.blob.core.windows.net/exports' `
          --recursive [[filter]]='*.csv' [[ow]] [[tier]]
      slots:
        - id: cmd
          options:
            - { id: copy, text: "copy" }
            - { id: sync, text: "sync" }
            - { id: remove, text: "remove" }
        - id: filter
          options:
            - { id: incpattern, text: "--include-pattern" }
            - { id: incpath, text: "--include-path" }
            - { id: excpattern, text: "--exclude-pattern" }
        - id: ow
          options:
            - { id: owfalse, text: "--overwrite=false" }
            - { id: ownewer, text: "--overwrite=ifSourceNewer" }
            - { id: owtrue, text: "--overwrite=true" }
            - { id: delfalse, text: "--delete-destination=false" }
        - id: tier
          options:
            - { id: bbtier, text: "--block-blob-tier=Cool" }
            - { id: blobtype, text: "--blob-type=BlockBlob" }
            - { id: s2stier, text: "--s2s-preserve-access-tier=false" }
            - { id: cold, text: "--block-blob-tier=Cold" }
    answer:
      values: { cmd: copy, filter: incpattern, ow: owfalse, tier: bbtier }
    explanation:
      correct:
        en: "`azcopy copy` with `--overwrite=false` skips every file whose blob already exists, so existing blobs are never replaced. `--include-pattern` filters on file names and accepts wildcards such as `*.csv`, and `--block-blob-tier=Cool` sets the tier of each uploaded blob without changing the default access tier of the account."
        fr: "`azcopy copy` avec `--overwrite=false` ignore tout fichier dont l'objet blob existe déjà : les objets blob existants ne sont jamais remplacés. `--include-pattern` filtre sur les noms de fichiers et accepte les caractères génériques comme `*.csv`, et `--block-blob-tier=Cool` définit le niveau de chaque objet blob chargé sans changer le niveau d'accès par défaut du compte."
      options:
        sync:
          en: "`azcopy sync` transfers a local file again when it is newer than the blob, which replaces the blob; it also has no `--block-blob-tier` option."
          fr: "`azcopy sync` transfère de nouveau un fichier local plus récent que l'objet blob, ce qui remplace l'objet blob ; il n'a pas non plus d'option `--block-blob-tier`."
        incpath:
          en: "`--include-path` takes relative path prefixes and does not support wildcard characters."
          fr: "`--include-path` prend des préfixes de chemins relatifs et ne prend pas en charge les caractères génériques."
        ownewer:
          en: "`ifSourceNewer` replaces the blob when the local file is newer, which the third requirement forbids."
          fr: "`ifSourceNewer` remplace l'objet blob quand le fichier local est plus récent, ce que la troisième exigence interdit."
        owtrue:
          en: "`--overwrite=true` is the default and replaces conflicting blobs."
          fr: "`--overwrite=true` est la valeur par défaut et remplace les objets blob en conflit."
        s2stier:
          en: "`--s2s-preserve-access-tier` applies to service-to-service copies between accounts, not to uploads from a local folder."
          fr: "`--s2s-preserve-access-tier` s'applique aux copies de service à service entre comptes, pas aux chargements depuis un dossier local."
        blobtype:
          en: "`--blob-type` sets the type of blob (block, page or append), not its access tier."
          fr: "`--blob-type` définit le type d'objet blob (blocs, pages ou ajout), pas son niveau d'accès."
        cold:
          en: "Cold is a different online tier from Cool, with lower storage and higher access costs; the requirement is the Cool tier."
          fr: "Cold est un niveau en ligne distinct de Cool, avec un stockage moins cher et un accès plus cher ; l'exigence porte sur le niveau froid (Cool)."
    references:
      - title: Upload files to Azure Blob storage by using AzCopy v10
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-upload
      - title: Synchronize with Azure Blob storage by using AzCopy v10
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-synchronize

  # ---------------------------------------------------------------- 8
  - id: az104-qz-22-08
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders is creating a general-purpose v2 storage account named **stnwrecords** in the West Europe region for its records portal. The account must meet the following requirements:

        - A lifecycle management rule must move the records that are older than three years to the Archive tier.
        - If West Europe becomes unavailable, the portal must keep reading the records stored in online tiers from another region, without waiting for a failover.
        - Costs must be minimized.

        Which redundancy option should you select for stnwrecords?
      fr: |
        Northwind Traders crée un compte de stockage usage général v2 nommé **stnwrecords** dans la région West Europe pour son portail d'archives. Le compte doit respecter les exigences suivantes :

        - Une règle de gestion du cycle de vie doit déplacer les documents de plus de trois ans vers le niveau archive (Archive).
        - Si West Europe devient indisponible, le portail doit continuer à lire depuis une autre région les documents stockés dans les niveaux en ligne, sans attendre de basculement.
        - Les coûts doivent être réduits au minimum.

        Quelle option de redondance devez-vous sélectionner pour stnwrecords ?
    body:
      options:
        - id: a
          text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" }
        - id: b
          text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" }
        - id: c
          text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
        - id: d
          text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Reading from another region without a failover requires read access to the secondary region (an RA- option). The Archive tier is supported only with LRS, GRS and RA-GRS, so RA-GRS is the only option that meets both requirements.
        fr: |
          Lire depuis une autre région sans basculement exige l'accès en lecture à la région secondaire (une option RA-). Le niveau archive (Archive) n'est pris en charge qu'avec LRS, GRS et RA-GRS : RA-GRS est donc la seule option qui respecte les deux exigences.
      options:
        a:
          en: |
            GRS supports the Archive tier, but its secondary region can't be read until a failover occurs.
          fr: |
            GRS prend en charge le niveau archive (Archive), mais sa région secondaire n'est lisible qu'après un basculement.
        c:
          en: |
            GZRS doesn't support the Archive tier, and its secondary region can't be read without a failover.
          fr: |
            GZRS ne prend pas en charge le niveau archive (Archive), et sa région secondaire n'est pas lisible sans basculement.
        d:
          en: |
            RA-GZRS allows reads from the secondary region, but it doesn't support the Archive tier, so the lifecycle rule couldn't archive the records.
          fr: |
            RA-GZRS permet de lire dans la région secondaire, mais ne prend pas en charge le niveau archive (Archive) : la règle de cycle de vie ne pourrait pas archiver les documents.
    references:
      - title: Data redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview

  # ---------------------------------------------------------------- 9
  - id: az104-qz-22-09
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a general-purpose v2 storage account named **stwgpayments** that uses Microsoft-managed keys. The account stores blobs and Azure Files shares. The security team created the following keys in a key vault named **kv-wg-sec**, which has soft delete and purge protection enabled.

        | Key | Key type |
        | --- | --- |
        | key-ec | EC, curve P-256 |
        | key-rsa | RSA, 3072 bits |

        You plan to configure customer-managed keys for stwgpayments by using the system-assigned managed identity of the account. You will not specify a key version.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un compte de stockage usage général v2 nommé **stwgpayments** qui utilise des clés gérées par Microsoft. Le compte stocke des objets blob et des partages Azure Files. L'équipe de sécurité a créé les clés suivantes dans un coffre de clés nommé **kv-wg-sec**, dont la suppression réversible et la protection contre le vidage sont activées.

        | Clé | Type de clé |
        | --- | --- |
        | key-ec | EC, courbe P-256 |
        | key-rsa | RSA, 3072 bits |

        Vous prévoyez de configurer des clés gérées par le client pour stwgpayments avec l'identité managée affectée par le système du compte. Vous ne spécifierez pas de version de clé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You can configure stwgpayments to use **key-ec** as its customer-managed key.", fr: "Vous pouvez configurer stwgpayments pour qu'il utilise **key-ec** comme clé gérée par le client." }
        - id: s2
          text: { en: "After the security team creates a new version of **key-rsa**, stwgpayments starts using that version without being reconfigured.", fr: "Après la création d'une nouvelle version de **key-rsa** par l'équipe de sécurité, stwgpayments commence à utiliser cette version sans être reconfiguré." }
        - id: s3
          text: { en: "An application can protect the files that it writes to a share of stwgpayments with a customer-provided key sent with each request.", fr: "Une application peut protéger les fichiers qu'elle écrit dans un partage de stwgpayments avec une clé fournie par le client, envoyée avec chaque requête." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A customer-managed key for Azure Storage must be an RSA or RSA-HSM key of 2048, 3072 or 4096 bits, so only key-rsa qualifies. When no key version is specified, Azure Storage checks the key vault daily and automatically uses the newest version. Customer-provided keys are supported for Blob Storage requests only, not for Azure Files.
        fr: |
          Une clé gérée par le client pour le Stockage Azure doit être une clé RSA ou RSA-HSM de 2048, 3072 ou 4096 bits : seule key-rsa convient. Quand aucune version de clé n'est spécifiée, le Stockage Azure vérifie le coffre de clés chaque jour et utilise automatiquement la version la plus récente. Les clés fournies par le client ne sont prises en charge que pour les requêtes au Stockage Blob, pas pour Azure Files.
      options:
        s1:
          en: |
            Elliptic curve (EC) keys are not supported for Azure Storage encryption; the key must be RSA or RSA-HSM.
          fr: |
            Les clés à courbe elliptique (EC) ne sont pas prises en charge pour le chiffrement du Stockage Azure ; la clé doit être RSA ou RSA-HSM.
        s3:
          en: |
            A customer-provided key is sent with Blob Storage read and write requests only; Azure Files data is protected by the account-level key.
          fr: |
            Une clé fournie par le client n'est envoyée qu'avec les requêtes de lecture et d'écriture au Stockage Blob ; les données Azure Files sont protégées par la clé de niveau compte.
    references:
      - title: Customer-managed keys for account encryption
        url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
      - title: Azure Storage encryption for data at rest
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption

  # ---------------------------------------------------------------- 10
  - id: az104-qz-22-10
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has two general-purpose v2 storage accounts in the same Microsoft Entra tenant: **stcontosoeu** and **stcontosous**. Blob versioning is enabled on both accounts, and the change feed is enabled on stcontosoeu.

        On November 2, 2026, you create an object replication policy from stcontosoeu to stcontosous with a single rule: source container **finance**, destination container **finance-copy**, prefix filter `invoices/`, and the default copy scope. Since then, no blob in **finance** has changed tier.

        On November 20, 2026, the **finance** container contains the following blobs.

        | Blob | Blob type | Access tier | Created on |
        | --- | --- | --- | --- |
        | invoices/2026-10.pdf | Block | Hot | October 30, 2026 |
        | invoices/2026-11a.pdf | Block | Cool | November 5, 2026 |
        | invoices/ledger.log | Append | Not applicable | November 6, 2026 |
        | invoices/disk01.vhd | Page | Not applicable | November 8, 2026 |
        | reports/2026-11.pdf | Block | Hot | November 9, 2026 |
        | invoices/2026-11b.pdf | Block | Cold | November 12, 2026 |

        Which two blobs are replicated to **finance-copy**?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux comptes de stockage usage général v2 dans le même locataire Microsoft Entra : **stcontosoeu** et **stcontosous**. Le contrôle de version des objets blob est activé sur les deux comptes, et le flux de modification est activé sur stcontosoeu.

        Le 2 novembre 2026, vous créez une stratégie de réplication d'objets de stcontosoeu vers stcontosous avec une seule règle : conteneur source **finance**, conteneur de destination **finance-copy**, filtre de préfixe `invoices/` et étendue de copie par défaut. Depuis, aucun objet blob de **finance** n'a changé de niveau.

        Le 20 novembre 2026, le conteneur **finance** contient les objets blob suivants.

        | Objet blob | Type d'objet blob | Niveau d'accès | Créé le |
        | --- | --- | --- | --- |
        | invoices/2026-10.pdf | Blocs | Chaud (Hot) | 30 octobre 2026 |
        | invoices/2026-11a.pdf | Blocs | Froid (Cool) | 5 novembre 2026 |
        | invoices/ledger.log | Ajout | Sans objet | 6 novembre 2026 |
        | invoices/disk01.vhd | Pages | Sans objet | 8 novembre 2026 |
        | reports/2026-11.pdf | Blocs | Chaud (Hot) | 9 novembre 2026 |
        | invoices/2026-11b.pdf | Blocs | Froid (Cold) | 12 novembre 2026 |

        Quels sont les deux objets blob répliqués dans **finance-copy** ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "invoices/2026-10.pdf" }
        - { id: b, text: "invoices/2026-11a.pdf" }
        - { id: c, text: "invoices/ledger.log" }
        - { id: d, text: "invoices/disk01.vhd" }
        - { id: e, text: "reports/2026-11.pdf" }
        - { id: f, text: "invoices/2026-11b.pdf" }
    answer:
      optionIds: [b, f]
    explanation:
      correct:
        en: |
          A blob is replicated only if it is a block blob, it matches the prefix filter, and, with the default copy scope, it was created after the rule. invoices/2026-11a.pdf and invoices/2026-11b.pdf meet all three conditions; object replication works with blobs in any online tier (Hot, Cool or Cold).
        fr: |
          Un objet blob n'est répliqué que s'il s'agit d'un objet blob de blocs, s'il correspond au filtre de préfixe et, avec l'étendue de copie par défaut, s'il a été créé après la règle. invoices/2026-11a.pdf et invoices/2026-11b.pdf remplissent les trois conditions ; la réplication d'objets fonctionne avec des objets blob dans n'importe quel niveau en ligne (Hot, Cool ou Cold).
      options:
        a:
          en: |
            This blob existed before the rule was created; the default copy scope copies only the blobs created after the rule.
          fr: |
            Cet objet blob existait avant la création de la règle ; l'étendue de copie par défaut ne copie que les objets blob créés après la règle.
        c:
          en: |
            Append blobs are not supported by object replication, even when they match the prefix.
          fr: |
            Les objets blob d'ajout ne sont pas pris en charge par la réplication d'objets, même s'ils correspondent au préfixe.
        d:
          en: |
            Page blobs are not supported by object replication, even when they match the prefix.
          fr: |
            Les objets blob de pages ne sont pas pris en charge par la réplication d'objets, même s'ils correspondent au préfixe.
        e:
          en: |
            The name of this blob doesn't start with `invoices/`, so the prefix filter of the rule excludes it.
          fr: |
            Le nom de cet objet blob ne commence pas par `invoices/` : le filtre de préfixe de la règle l'exclut.
    references:
      - title: Object replication overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
