chapter: 41-virtual-networks
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to deploy a VPN gateway to a virtual network named **VNet1**. You need to add to VNet1 the subnet that will host the gateway.

        What should you name the subnet?
      fr: |
        Vous prévoyez de déployer une passerelle VPN dans un réseau virtuel nommé **VNet1**. Vous devez ajouter à VNet1 le sous-réseau qui hébergera la passerelle.

        Quel nom devez-vous donner au sous-réseau ?
    body:
      options:
        - { id: a, text: AzureFirewallSubnet }
        - { id: b, text: GatewaySubnet }
        - { id: c, text: AzureBastionSubnet }
        - { id: d, text: RouteServerSubnet }
    answer: { optionId: b }
    explanation:
      correct:
        en: A VPN or ExpressRoute gateway is deployed only in a dedicated subnet that must be named GatewaySubnet; the name tells Azure where to place the gateway instances. Nothing else should be deployed in this subnet, and every SKU except Basic requires a /27 or larger subnet.
        fr: "Une passerelle VPN ou ExpressRoute se déploie uniquement dans un sous-réseau dédié qui doit s'appeler GatewaySubnet ; ce nom indique à Azure où placer les instances de la passerelle. Rien d'autre ne doit être déployé dans ce sous-réseau, et toutes les SKU sauf Basic exigent un sous-réseau /27 ou plus grand."
      options:
        a: { en: "AzureFirewallSubnet is the dedicated subnet of Azure Firewall, not of a virtual network gateway.", fr: "AzureFirewallSubnet est le sous-réseau dédié du Pare-feu Azure, pas d'une passerelle de réseau virtuel." }
        c: { en: "AzureBastionSubnet is the dedicated subnet of Azure Bastion.", fr: "AzureBastionSubnet est le sous-réseau dédié d'Azure Bastion." }
        d: { en: "RouteServerSubnet hosts Azure Route Server, not a VPN gateway.", fr: "RouteServerSubnet héberge Azure Route Server, pas une passerelle VPN." }
    references:
      - title: Azure VPN Gateway configuration settings
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings

  # ------------------------------------------------------------------ 2
  - id: az104-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A virtual machine named **VM1** has a Standard SKU public IP address named **pip-vm1** associated with its network interface.

        On Friday, you stop (deallocate) VM1. On Monday, you start VM1 again.

        Which public IP address does VM1 use on Monday?
      fr: |
        Une machine virtuelle nommée **VM1** a une adresse IP publique de SKU Standard nommée **pip-vm1** associée à son interface réseau.

        Le vendredi, vous arrêtez (désallouez) VM1. Le lundi, vous démarrez de nouveau VM1.

        Quelle adresse IP publique VM1 utilise-t-elle le lundi ?
    body:
      options:
        - { id: a, text: { en: "A new address that Azure assigns from the region when VM1 starts", fr: "Une nouvelle adresse qu'Azure attribue dans la région au démarrage de VM1" } }
        - { id: b, text: { en: "No address until you associate pip-vm1 with the network interface again", fr: "Aucune adresse tant que vous n'associez pas de nouveau pip-vm1 à l'interface réseau" } }
        - { id: c, text: { en: "The same address only if pip-vm1 has a DNS name label", fr: "La même adresse uniquement si pip-vm1 possède une étiquette de nom DNS" } }
        - { id: d, text: { en: "The same address that pip-vm1 had before VM1 was stopped", fr: "La même adresse que pip-vm1 avait avant l'arrêt de VM1" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: A Standard SKU public IP address always uses static allocation. The address is assigned when the public IP resource is created and is released only when that resource is deleted, so stopping and starting the virtual machine doesn't change it.
        fr: "Une adresse IP publique de SKU Standard utilise toujours l'allocation statique. L'adresse est attribuée à la création de la ressource d'IP publique et n'est libérée qu'à la suppression de cette ressource : arrêter puis démarrer la machine virtuelle ne la modifie donc pas."
      options:
        a: { en: "A new address at start was the behavior of dynamic allocation, which only the retired Basic SKU offered.", fr: "Une nouvelle adresse au démarrage correspondait à l'allocation dynamique, que seule la SKU Basic, retirée, proposait." }
        b: { en: "Deallocating the virtual machine doesn't dissociate the public IP resource from the network interface.", fr: "Désallouer la machine virtuelle ne dissocie pas la ressource d'IP publique de l'interface réseau." }
        c: { en: "A DNS name label only maps a name to the address; it plays no role in keeping the address.", fr: "Une étiquette de nom DNS associe seulement un nom à l'adresse ; elle ne joue aucun rôle dans la conservation de l'adresse." }
    references:
      - title: Public IP addresses in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses

  # ------------------------------------------------------------------ 3
  - id: az104-qz-41-03
    objective: "4.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A virtual network named **VNet1** contains three subnets: **snet-web** (10.10.1.0/24), **snet-db** (10.10.2.0/24) and **snet-nva** (10.10.3.0/24). A network virtual appliance named **NVA1** in snet-nva has the private IP address 10.10.3.4, and IP forwarding is enabled on its network interface and in its operating system.

        You create a route table named **RT1** that contains a route for 10.10.2.0/24 with the next hop type Virtual appliance and the next hop address 10.10.3.4. You need the traffic sent from snet-web to snet-db to be routed through NVA1.

        With which subnet or subnets should you associate RT1?
      fr: |
        Un réseau virtuel nommé **VNet1** contient trois sous-réseaux : **snet-web** (10.10.1.0/24), **snet-db** (10.10.2.0/24) et **snet-nva** (10.10.3.0/24). Une appliance virtuelle réseau nommée **NVA1**, dans snet-nva, a l'adresse IP privée 10.10.3.4, et le transfert IP est activé sur son interface réseau et dans son système d'exploitation.

        Vous créez une table de routage nommée **RT1** qui contient un itinéraire pour 10.10.2.0/24 avec le type de tronçon suivant Appliance virtuelle et l'adresse de tronçon suivant 10.10.3.4. Vous devez faire passer par NVA1 le trafic envoyé de snet-web vers snet-db.

        À quel(s) sous-réseau(x) devez-vous associer RT1 ?
    body:
      options:
        - { id: a, text: { en: "snet-db only", fr: "snet-db uniquement" } }
        - { id: b, text: { en: "snet-web only", fr: "snet-web uniquement" } }
        - { id: c, text: { en: "snet-nva only", fr: "snet-nva uniquement" } }
        - { id: d, text: { en: "snet-web and snet-nva", fr: "snet-web et snet-nva" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: A route table applies to the traffic that leaves the subnets it is associated with. The traffic to redirect leaves snet-web, so RT1 must be associated with snet-web; its route for 10.10.2.0/24 then overrides the system route of the virtual network for that destination.
        fr: "Une table de routage s'applique au trafic qui quitte les sous-réseaux auxquels elle est associée. Le trafic à rediriger quitte snet-web : RT1 doit donc être associée à snet-web ; son itinéraire pour 10.10.2.0/24 remplace alors l'itinéraire système du réseau virtuel pour cette destination."
      options:
        a: { en: "Associated with snet-db, RT1 would act on traffic leaving snet-db, including traffic between the machines of snet-db, and not on traffic coming from snet-web.", fr: "Associée à snet-db, RT1 agirait sur le trafic qui quitte snet-db, y compris entre les machines de snet-db, et pas sur le trafic venant de snet-web." }
        c: { en: "Associated with snet-nva, RT1 would send the packets that NVA1 forwards to snet-db back to NVA1 itself, and the traffic from snet-web would still follow the system route.", fr: "Associée à snet-nva, RT1 renverrait vers NVA1 elle-même les paquets que NVA1 transfère vers snet-db, et le trafic de snet-web suivrait toujours l'itinéraire système." }
        d: { en: "Adding snet-nva creates a loop: the packets that NVA1 forwards to snet-db match the route again and return to NVA1.", fr: "Ajouter snet-nva crée une boucle : les paquets que NVA1 transfère vers snet-db correspondent de nouveau à l'itinéraire et reviennent vers NVA1." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview

  # ------------------------------------------------------------------ 4
  - id: az104-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Two virtual networks named **VNet-Dev** and **VNet-Test** are peered, and both peering links are **Connected**. Each virtual network contains 12 subnets.

        During a two-week audit, no traffic must flow between VNet-Dev and VNet-Test. After the audit, communication must be restored quickly. The solution must keep both peering links and minimize administrative effort.

        What should you do?
      fr: |
        Deux réseaux virtuels nommés **VNet-Dev** et **VNet-Test** sont reliés par un peering, et les deux liens de peering sont à l'état **Connected**. Chaque réseau virtuel contient 12 sous-réseaux.

        Pendant un audit de deux semaines, aucun trafic ne doit circuler entre VNet-Dev et VNet-Test. Après l'audit, la communication doit être rétablie rapidement. La solution doit conserver les deux liens de peering et réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "On both peering links, clear the setting that allows forwarded traffic from the remote virtual network.", fr: "Sur les deux liens de peering, désactivez le réglage qui autorise le trafic transféré depuis le réseau virtuel distant." } }
        - { id: b, text: { en: "On both peering links, clear the setting that allows access to the remote virtual network.", fr: "Sur les deux liens de peering, désactivez le réglage qui autorise l'accès au réseau virtuel distant." } }
        - { id: c, text: { en: "On every subnet, associate a route table that sends the other network's address space to the next hop type None.", fr: "Sur chaque sous-réseau, associez une table de routage qui envoie l'espace d'adressage de l'autre réseau vers le type de tronçon suivant Aucun (None)." } }
        - { id: d, text: { en: "On both peering links, clear the settings that allow gateway transit and the use of remote gateways.", fr: "Sur les deux liens de peering, désactivez les réglages qui autorisent le transit par passerelle et l'utilisation des passerelles distantes." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: The setting that allows access to the remote virtual network (enabled by default) is what lets the two peered networks communicate. Microsoft recommends clearing it to block traffic to the peer when networks must communicate only some of the time, because toggling it is easier than deleting and re-creating peerings. Selecting it again restores the traffic.
        fr: "Le réglage qui autorise l'accès au réseau virtuel distant (activé par défaut) est celui qui permet aux deux réseaux reliés de communiquer. Microsoft recommande de le désactiver pour bloquer le trafic vers le pair quand les réseaux ne doivent communiquer que par moments, car le basculer est plus simple que supprimer puis recréer les peerings. Le réactiver rétablit le trafic."
      options:
        a: { en: "Forwarded traffic concerns only traffic that didn't originate in the peer, such as traffic relayed by an appliance; it is already off by default and doesn't block the direct traffic.", fr: "Le trafic transféré ne concerne que le trafic qui ne provient pas du pair, par exemple relayé par une appliance ; il est déjà désactivé par défaut et ne bloque pas le trafic direct." }
        c: { en: "Routes to None would drop the traffic, but on 24 subnets they are far more administrative effort than one setting per peering link.", fr: "Des itinéraires vers None abandonneraient le trafic, mais sur 24 sous-réseaux ils demandent bien plus d'effort d'administration qu'un réglage par lien de peering." }
        d: { en: "Gateway settings only control the sharing of a VPN or ExpressRoute gateway; the networks would still communicate.", fr: "Les réglages de passerelle ne contrôlent que le partage d'une passerelle VPN ou ExpressRoute ; les réseaux communiqueraient toujours." }
    references:
      - title: Create, Change, or Delete Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering

  # ------------------------------------------------------------------ 5
  - id: az104-qz-41-05
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Two virtual machines named **VM1** (10.20.1.4) and **VM2** (10.20.2.5) are in different subnets of the same virtual network. An application on VM2 listens on TCP port 8443, and a local test on VM2 succeeds. VM1 cannot connect to VM2 on TCP port 8443.

        Network Watcher returns the following results:

        - IP flow verify, outbound TCP from VM1 to 10.20.2.5 port 8443: **Access allowed**
        - IP flow verify, inbound TCP to VM2 port 8443 from 10.20.1.4: **Access allowed**
        - Next hop from VM1 to 10.20.2.5: **VirtualNetwork**, route table **System Route**

        What should you check next?
      fr: |
        Deux machines virtuelles nommées **VM1** (10.20.1.4) et **VM2** (10.20.2.5) se trouvent dans des sous-réseaux différents du même réseau virtuel. Une application sur VM2 écoute sur le port TCP 8443, et un test local sur VM2 réussit. VM1 ne parvient pas à se connecter à VM2 sur le port TCP 8443.

        Network Watcher renvoie les résultats suivants :

        - Vérification des flux IP, TCP sortant de VM1 vers 10.20.2.5 port 8443 : **Access allowed**
        - Vérification des flux IP, TCP entrant vers VM2 port 8443 depuis 10.20.1.4 : **Access allowed**
        - Tronçon suivant de VM1 vers 10.20.2.5 : **VirtualNetwork**, table de routage **System Route**

        Que devez-vous vérifier ensuite ?
    body:
      options:
        - { id: a, text: { en: "The network security group associated with the subnet of VM2", fr: "Le groupe de sécurité réseau associé au sous-réseau de VM2" } }
        - { id: b, text: { en: "The route table associated with the subnet of VM1", fr: "La table de routage associée au sous-réseau de VM1" } }
        - { id: c, text: { en: "The firewall of the guest operating system of VM2", fr: "Le pare-feu du système d'exploitation invité de VM2" } }
        - { id: d, text: { en: "The IP forwarding setting of the network interface of VM2", fr: "Le réglage de transfert IP de l'interface réseau de VM2" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: IP flow verify evaluates the security rules of every network security group applied to the network interface, whether the group is associated with the subnet or the interface, and next hop confirms that the traffic stays in the virtual network. Azure therefore allows and routes the flow, which leaves a cause inside the machine, such as the guest operating system firewall of VM2 blocking TCP 8443 from other hosts.
        fr: "La vérification des flux IP évalue les règles de sécurité de tous les groupes de sécurité réseau appliqués à l'interface réseau, qu'ils soient associés au sous-réseau ou à l'interface, et le tronçon suivant confirme que le trafic reste dans le réseau virtuel. Azure autorise et achemine donc le flux, ce qui laisse une cause dans la machine, comme le pare-feu du système d'exploitation invité de VM2 qui bloque le port TCP 8443 depuis les autres hôtes."
      options:
        a: { en: "The inbound IP flow verify test already includes the rules of the network security group of VM2's subnet, and it returned Access allowed.", fr: "Le test de vérification des flux IP entrant inclut déjà les règles du groupe de sécurité réseau du sous-réseau de VM2, et il a renvoyé Access allowed." }
        b: { en: "Next hop returned a system route of type VirtualNetwork, so no user-defined route redirects this traffic.", fr: "Le tronçon suivant a renvoyé un itinéraire système de type VirtualNetwork : aucun itinéraire défini par l'utilisateur ne redirige ce trafic." }
        d: { en: "IP forwarding is needed only on an interface that forwards traffic for other addresses; VM2 is the destination of the traffic.", fr: "Le transfert IP n'est nécessaire que sur une interface qui relaie du trafic destiné à d'autres adresses ; VM2 est la destination du trafic." }
    references:
      - title: IP Flow Verify Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
      - title: Next Hop Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview

  # ------------------------------------------------------------------ 6
  - id: az104-qz-41-06
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has an Azure subscription that contains the resources shown in the following table. West Europe and North Europe both have three availability zones.

        | Name | Type | Region | Configuration |
        | --- | --- | --- | --- |
        | VM1 | Virtual machine | West Europe | One network interface, no public IP address |
        | pip-shop-we | Public IP address (Standard SKU) | West Europe | Zone-redundant, DNS name label `woodgrove-shop` |
        | pip-ne | Public IP address (Standard SKU) | North Europe | Zone-redundant, no DNS name label, not associated |
        | pfx-we | Public IP address prefix | West Europe | /28, three public IP addresses already created from it |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un abonnement Azure qui contient les ressources présentées dans le tableau suivant. West Europe et North Europe ont chacune trois zones de disponibilité.

        | Nom | Type | Région | Configuration |
        | --- | --- | --- | --- |
        | VM1 | Machine virtuelle | West Europe | Une interface réseau, aucune adresse IP publique |
        | pip-shop-we | Adresse IP publique (SKU Standard) | West Europe | Redondante interzone, étiquette de nom DNS `woodgrove-shop` |
        | pip-ne | Adresse IP publique (SKU Standard) | North Europe | Redondante interzone, sans étiquette de nom DNS, non associée |
        | pfx-we | Préfixe d'adresses IP publiques | West Europe | /28, trois adresses IP publiques déjà créées à partir de celui-ci |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: You can associate pip-ne with the network interface of VM1.
            fr: Vous pouvez associer pip-ne à l'interface réseau de VM1.
        - id: s2
          text:
            en: The DNS name label of pip-shop-we prevents you from assigning the label woodgrove-shop to pip-ne.
            fr: L'étiquette de nom DNS de pip-shop-we vous empêche d'attribuer l'étiquette woodgrove-shop à pip-ne.
        - id: s3
          text:
            en: You can create 13 more public IP addresses from pfx-we.
            fr: Vous pouvez créer 13 adresses IP publiques supplémentaires à partir de pfx-we.
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: A public IP address can be associated only with a resource in its own region, so pip-ne (North Europe) cannot be used by VM1 (West Europe). A DNS name label must be unique only within its region, because the name includes the region (woodgrove-shop.westeurope.cloudapp.azure.com and woodgrove-shop.northeurope.cloudapp.azure.com are different names). A /28 prefix provides 16 addresses that can all be used, with no reserved addresses as in a subnet, so 13 remain after three.
        fr: "Une adresse IP publique ne peut être associée qu'à une ressource de sa propre région : pip-ne (North Europe) ne peut donc pas servir à VM1 (West Europe). Une étiquette de nom DNS ne doit être unique que dans sa région, car le nom inclut la région (woodgrove-shop.westeurope.cloudapp.azure.com et woodgrove-shop.northeurope.cloudapp.azure.com sont des noms différents). Un préfixe /28 fournit 16 adresses toutes utilisables, sans adresses réservées comme dans un sous-réseau : il en reste 13 après trois."
      options:
        s1: { en: "Being zone-redundant doesn't make an address usable in another region; the region must match.", fr: "Être redondante interzone ne rend pas une adresse utilisable dans une autre région : la région doit correspondre." }
        s3: { en: "The 5 reserved addresses apply to subnets of a virtual network, not to public IP prefixes.", fr: "Les 5 adresses réservées s'appliquent aux sous-réseaux d'un réseau virtuel, pas aux préfixes d'adresses IP publiques." }
    references:
      - title: Public IP addresses in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
      - title: Azure Public IP address prefix
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix

  # ------------------------------------------------------------------ 7
  - id: az104-qz-41-07
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin has a virtual network named **VNet1** (10.4.0.0/16) that is peered with a virtual network named **VNet2**. You investigate three connectivity incidents reported by users of VNet1.

        Which action should you perform to resolve each incident? To answer, drag the appropriate actions to the correct incidents. Each action may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un réseau virtuel nommé **VNet1** (10.4.0.0/16) relié par un peering à un réseau virtuel nommé **VNet2**. Vous analysez trois incidents de connectivité signalés par des utilisateurs de VNet1.

        Quelle action devez-vous effectuer pour résoudre chaque incident ? Pour répondre, faites glisser les actions appropriées vers les incidents correspondants. Chaque action peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: restart, text: { en: "Restart the virtual machine", fr: "Redémarrer la machine virtuelle" } }
        - { id: nexthop, text: { en: "Change the next hop address of the route in the route table", fr: "Modifier l'adresse de tronçon suivant de l'itinéraire dans la table de routage" } }
        - { id: sync, text: { en: "Sync the virtual network peering", fr: "Synchroniser le peering de réseaux virtuels" } }
        - { id: ipfwd, text: { en: "Enable IP forwarding on the network interface of the appliance", fr: "Activer le transfert IP sur l'interface réseau de l'appliance" } }
        - { id: fwd, text: { en: "Allow forwarded traffic on the peering links", fr: "Autoriser le trafic transféré sur les liens de peering" } }
        - { id: nat, text: { en: "Associate a NAT gateway with the subnet", fr: "Associer une passerelle NAT au sous-réseau" } }
      targets:
        - id: t1
          text:
            en: "Last week, the DNS servers of VNet1 were changed from Default (Azure-provided) to a custom server at 10.4.0.10, which hosts the zone corp.tailspin.com. VM1 has been running since before the change; on VM1, nslookup app1.corp.tailspin.com shows the server 168.63.129.16 and fails. A virtual machine deployed yesterday resolves the name."
            fr: "La semaine dernière, les serveurs DNS de VNet1 sont passés de Par défaut (fourni par Azure) à un serveur personnalisé à 10.4.0.10, qui héberge la zone corp.tailspin.com. VM1 est en cours d'exécution depuis avant ce changement ; sur VM1, nslookup app1.corp.tailspin.com affiche le serveur 168.63.129.16 et échoue. Une machine virtuelle déployée hier résout le nom."
        - id: t2
          text:
            en: "VM2 cannot reach 10.30.1.10. Next hop from VM2 to 10.30.1.10 returns VirtualAppliance, IP address 10.4.9.4, route table rt-app. The appliance NVA1 was redeployed last week and its address is now 10.4.9.5."
            fr: "VM2 n'atteint pas 10.30.1.10. Le tronçon suivant de VM2 vers 10.30.1.10 renvoie VirtualAppliance, adresse IP 10.4.9.4, table de routage rt-app. L'appliance NVA1 a été redéployée la semaine dernière et son adresse est désormais 10.4.9.5."
        - id: t3
          text:
            en: "Yesterday, the range 10.6.0.0/16 was added to the address space of VNet2. VM3 in VNet1 reaches the virtual machines in the original range of VNet2 but not those in 10.6.0.0/16, and the effective routes of VM3 contain no route for 10.6.0.0/16."
            fr: "Hier, la plage 10.6.0.0/16 a été ajoutée à l'espace d'adressage de VNet2. VM3, dans VNet1, atteint les machines virtuelles de la plage d'origine de VNet2 mais pas celles de 10.6.0.0/16, et les itinéraires effectifs de VM3 ne contiennent aucun itinéraire pour 10.6.0.0/16."
    answer:
      mapping: { t1: restart, t2: nexthop, t3: sync }
    explanation:
      correct:
        en: Virtual machines that inherit the DNS servers of the virtual network keep their current DNS settings until they are restarted, which is why VM1 still queries 168.63.129.16. Next hop shows that the user-defined route in rt-app still points to the old appliance address, so the route must be updated to 10.4.9.5. After the address space of a peered virtual network is resized, the peering must be synced so that the peer learns the new range.
        fr: "Les machines virtuelles qui héritent des serveurs DNS du réseau virtuel conservent leurs paramètres DNS actuels jusqu'à leur redémarrage : c'est pourquoi VM1 interroge encore 168.63.129.16. Le tronçon suivant montre que l'itinéraire défini par l'utilisateur de rt-app pointe toujours vers l'ancienne adresse de l'appliance : il faut le modifier pour 10.4.9.5. Après le redimensionnement de l'espace d'adressage d'un réseau virtuel relié par un peering, il faut synchroniser le peering pour que le pair apprenne la nouvelle plage."
      options:
        ipfwd: { en: "IP forwarding matters only when the packets reach the appliance; here they are sent to an address where NVA1 no longer is.", fr: "Le transfert IP n'importe que si les paquets atteignent l'appliance ; ici, ils sont envoyés à une adresse où NVA1 ne se trouve plus." }
        fwd: { en: "Forwarded traffic concerns traffic relayed by an appliance in the peer; it doesn't add the routes of a new address range.", fr: "Le trafic transféré concerne le trafic relayé par une appliance du pair ; il n'ajoute pas les itinéraires d'une nouvelle plage d'adresses." }
        nat: { en: "A NAT gateway provides outbound internet access; none of the incidents concerns the internet.", fr: "Une passerelle NAT fournit un accès sortant à internet ; aucun incident ne concerne internet." }
    references:
      - title: Create, change, or delete an Azure virtual network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
      - title: Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview

  # ------------------------------------------------------------------ 8
  - id: az104-qz-41-08
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind creates a virtual network named **VNet1** (10.1.0.0/16) by using the Azure portal. VNet1 contains the following subnets:

        - **snet-app** (10.1.1.0/24): Default outbound access is disabled (private subnet). It contains two virtual machines named VM1 and VM2 that have no public IP address. The network security group of snet-app allows all outbound traffic.
        - **AzureFirewallSubnet** (10.1.255.0/26): it contains an Azure Firewall named **FW1** with the private IP address 10.1.255.4 and a Standard SKU public IP address. The policy of FW1 allows outbound HTTPS to the internet.

        VM1 and VM2 must download updates from a vendor website over HTTPS. The vendor accepts only source addresses that Northwind registers in advance, so the outbound traffic must use a public IP address that Northwind owns and that doesn't change. Virtual machines added to snet-app later must get the same outbound access without any configuration on each virtual machine.

        Which two actions can you perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind crée un réseau virtuel nommé **VNet1** (10.1.0.0/16) à l'aide du portail Azure. VNet1 contient les sous-réseaux suivants :

        - **snet-app** (10.1.1.0/24) : l'accès sortant par défaut est désactivé (sous-réseau privé). Il contient deux machines virtuelles nommées VM1 et VM2, sans adresse IP publique. Le groupe de sécurité réseau de snet-app autorise tout le trafic sortant.
        - **AzureFirewallSubnet** (10.1.255.0/26) : il contient un Pare-feu Azure nommé **FW1** avec l'adresse IP privée 10.1.255.4 et une adresse IP publique de SKU Standard. La stratégie de FW1 autorise le trafic HTTPS sortant vers internet.

        VM1 et VM2 doivent télécharger des mises à jour depuis le site web d'un éditeur en HTTPS. L'éditeur n'accepte que les adresses sources que Northwind déclare à l'avance : le trafic sortant doit donc utiliser une adresse IP publique qui appartient à Northwind et qui ne change pas. Les machines virtuelles ajoutées plus tard à snet-app doivent obtenir le même accès sortant sans aucune configuration sur chaque machine virtuelle.

        Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set Default outbound access to Enabled on snet-app, and then stop (deallocate) and start VM1 and VM2.", fr: "Activer l'accès sortant par défaut sur snet-app, puis arrêter (désallouer) et démarrer VM1 et VM2." } }
        - { id: b, text: { en: "Associate a NAT gateway that has a Standard SKU public IP address with snet-app.", fr: "Associer à snet-app une passerelle NAT dotée d'une adresse IP publique de SKU Standard." } }
        - { id: c, text: { en: "Associate with snet-app a route table that sends 0.0.0.0/0 to the next hop type Internet.", fr: "Associer à snet-app une table de routage qui envoie 0.0.0.0/0 vers le type de tronçon suivant Internet." } }
        - { id: d, text: { en: "Associate a Standard SKU public IP address with the network interface of VM1 and of VM2.", fr: "Associer une adresse IP publique de SKU Standard à l'interface réseau de VM1 et à celle de VM2." } }
        - { id: e, text: { en: "Associate with snet-app a route table that sends 0.0.0.0/0 to the next hop type Virtual appliance at 10.1.255.4.", fr: "Associer à snet-app une table de routage qui envoie 0.0.0.0/0 vers le type de tronçon suivant Appliance virtuelle à 10.1.255.4." } }
        - { id: f, text: { en: "Add to the network security group of snet-app an outbound rule that allows the Internet service tag on TCP 443.", fr: "Ajouter au groupe de sécurité réseau de snet-app une règle sortante qui autorise l'étiquette de service Internet sur TCP 443." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: A private subnet needs an explicit outbound method. A NAT gateway associated with the subnet gives every current and future virtual machine of snet-app outbound access through Northwind's static public IP, and it is the method Microsoft recommends. A 0.0.0.0/0 route to the firewall is also an explicit method at subnet level; FW1 sends the allowed traffic to the internet from its own static public IP address.
        fr: "Un sous-réseau privé exige une méthode sortante explicite. Une passerelle NAT associée au sous-réseau donne à toutes les machines virtuelles actuelles et futures de snet-app un accès sortant via l'IP publique statique de Northwind ; c'est la méthode recommandée par Microsoft. Un itinéraire 0.0.0.0/0 vers le pare-feu est aussi une méthode explicite au niveau du sous-réseau ; FW1 envoie le trafic autorisé vers internet depuis sa propre adresse IP publique statique."
      options:
        a: { en: "Default outbound access uses an address that Microsoft owns and can change without notice, so the vendor cannot rely on it.", fr: "L'accès sortant par défaut utilise une adresse qui appartient à Microsoft et peut changer sans préavis : l'éditeur ne peut pas s'y fier." }
        c: { en: "In a private subnet, routes with the next hop type Internet don't work without an explicit outbound method, and they wouldn't provide an address that Northwind owns.", fr: "Dans un sous-réseau privé, les itinéraires de type de tronçon suivant Internet ne fonctionnent pas sans méthode sortante explicite, et ils ne fourniraient pas d'adresse appartenant à Northwind." }
        d: { en: "A public IP on each interface works for VM1 and VM2 but must be configured on every new virtual machine, and each machine uses a different address.", fr: "Une IP publique sur chaque interface fonctionne pour VM1 et VM2, mais doit être configurée sur chaque nouvelle machine virtuelle, et chaque machine utilise une adresse différente." }
        f: { en: "A network security group only filters traffic; it doesn't create an outbound path, and outbound traffic is already allowed.", fr: "Un groupe de sécurité réseau ne fait que filtrer le trafic ; il ne crée pas de chemin sortant, et le trafic sortant est déjà autorisé." }
    references:
      - title: Default Outbound Access in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access

  # ------------------------------------------------------------------ 9
  - id: az104-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a hub-and-spoke network in one region:

        - **Hub** (10.0.0.0/16) contains a network virtual appliance named **NVA1** (10.0.1.4) that has a public IP address and IP forwarding enabled on its network interface and in its operating system, a subnet named **snet-shared** (10.0.5.0/24) for shared services, and a VPN gateway. The gateway learns only the prefix 192.168.0.0/16 from the on-premises network by using BGP.
        - **Spoke1** (10.1.0.0/16) is peered with Hub, uses the remote gateway of Hub and allows forwarded traffic. A route table on GatewaySubnet already sends the traffic for 10.1.0.0/16 to NVA1.

        You create a route table named **RT-Spoke1**, leave Propagate gateway routes set to Yes, and associate it with all the subnets of Spoke1. The traffic from Spoke1 must meet the following requirements:

        - All internet-bound traffic must be inspected by NVA1.
        - All traffic to the on-premises network must be inspected by NVA1.
        - Traffic to snet-shared must not go through NVA1.

        How should you configure RT-Spoke1? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau hub-and-spoke dans une région :

        - **Hub** (10.0.0.0/16) contient une appliance virtuelle réseau nommée **NVA1** (10.0.1.4) qui possède une adresse IP publique et dont le transfert IP est activé sur l'interface réseau et dans le système d'exploitation, un sous-réseau nommé **snet-shared** (10.0.5.0/24) pour les services partagés, et une passerelle VPN. La passerelle n'apprend que le préfixe 192.168.0.0/16 du réseau local, par BGP.
        - **Spoke1** (10.1.0.0/16) est relié à Hub par un peering, utilise la passerelle distante de Hub et autorise le trafic transféré. Une table de routage sur GatewaySubnet envoie déjà le trafic destiné à 10.1.0.0/16 vers NVA1.

        Vous créez une table de routage nommée **RT-Spoke1**, laissez « Propager les itinéraires de la passerelle » sur Oui et l'associez à tous les sous-réseaux de Spoke1. Le trafic de Spoke1 doit respecter les exigences suivantes :

        - Tout le trafic destiné à internet doit être inspecté par NVA1.
        - Tout le trafic vers le réseau local doit être inspecté par NVA1.
        - Le trafic vers snet-shared ne doit pas passer par NVA1.

        Comment devez-vous configurer RT-Spoke1 ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Route for 0.0.0.0/0: [[s1]]

          Traffic to 192.168.0.0/16: [[s2]]

          Traffic to 10.0.5.0/24: [[s3]]
        fr: |
          Itinéraire pour 0.0.0.0/0 : [[s1]]

          Trafic vers 192.168.0.0/16 : [[s2]]

          Trafic vers 10.0.5.0/24 : [[s3]]
      slots:
        - id: s1
          options:
            - { id: vng, text: { en: "Next hop type Virtual network gateway", fr: "Type de tronçon suivant Passerelle de réseau virtuel" } }
            - { id: va, text: { en: "Next hop type Virtual appliance, address 10.0.1.4", fr: "Type de tronçon suivant Appliance virtuelle, adresse 10.0.1.4" } }
            - { id: inet, text: { en: "Next hop type Internet", fr: "Type de tronçon suivant Internet" } }
            - { id: none, text: { en: "Next hop type None", fr: "Type de tronçon suivant Aucun (None)" } }
        - id: s2
          options:
            - { id: noroute, text: { en: "No additional route: the 0.0.0.0/0 route applies", fr: "Aucun itinéraire supplémentaire : l'itinéraire 0.0.0.0/0 s'applique" } }
            - { id: vng2, text: { en: "A route for 192.168.0.0/16 to the next hop type Virtual network gateway", fr: "Un itinéraire pour 192.168.0.0/16 vers le type de tronçon suivant Passerelle de réseau virtuel" } }
            - { id: va2, text: { en: "A route for 192.168.0.0/16 to the next hop type Virtual appliance, address 10.0.1.4", fr: "Un itinéraire pour 192.168.0.0/16 vers le type de tronçon suivant Appliance virtuelle, adresse 10.0.1.4" } }
            - { id: none2, text: { en: "A route for 192.168.0.0/16 to the next hop type None", fr: "Un itinéraire pour 192.168.0.0/16 vers le type de tronçon suivant Aucun (None)" } }
        - id: s3
          options:
            - { id: va3, text: { en: "A route for 10.0.5.0/24 to the next hop type Virtual appliance, address 10.0.1.4", fr: "Un itinéraire pour 10.0.5.0/24 vers le type de tronçon suivant Appliance virtuelle, adresse 10.0.1.4" } }
            - { id: vng3, text: { en: "A route for 10.0.5.0/24 to the next hop type Virtual network gateway", fr: "Un itinéraire pour 10.0.5.0/24 vers le type de tronçon suivant Passerelle de réseau virtuel" } }
            - { id: peer, text: { en: "No additional route: the peering system route applies", fr: "Aucun itinéraire supplémentaire : l'itinéraire système du peering s'applique" } }
            - { id: none3, text: { en: "A route for 10.0.5.0/24 to the next hop type None", fr: "Un itinéraire pour 10.0.5.0/24 vers le type de tronçon suivant Aucun (None)" } }
    answer:
      values: { s1: va, s2: va2, s3: peer }
    explanation:
      correct:
        en: Azure first selects the route with the longest prefix match, then prefers a user-defined route over a BGP route and a system route. A 0.0.0.0/0 route to NVA1 sends internet-bound traffic for inspection, but traffic to 192.168.0.0/16 matches the longer BGP route learned through the gateway and would bypass NVA1, so a user-defined route for the same prefix to NVA1 is required, and it wins over the BGP route. Traffic to 10.0.5.0/24 matches the system route of the peering (10.0.0.0/16), which is longer than 0.0.0.0/0, so it goes directly to Hub without any extra route.
        fr: "Azure sélectionne d'abord l'itinéraire à la correspondance de préfixe la plus longue, puis préfère un itinéraire défini par l'utilisateur à un itinéraire BGP et à un itinéraire système. Un itinéraire 0.0.0.0/0 vers NVA1 envoie le trafic destiné à internet à l'inspection, mais le trafic vers 192.168.0.0/16 correspond à l'itinéraire BGP, plus long, appris par la passerelle et contournerait NVA1 : un itinéraire défini par l'utilisateur pour le même préfixe vers NVA1 est nécessaire, et il l'emporte sur l'itinéraire BGP. Le trafic vers 10.0.5.0/24 correspond à l'itinéraire système du peering (10.0.0.0/16), plus long que 0.0.0.0/0 : il va directement vers Hub sans itinéraire supplémentaire."
      options:
        vng: { en: "For 0.0.0.0/0, the next hop type Virtual network gateway would force the internet-bound traffic to the VPN gateway and the on-premises network instead of NVA1.", fr: "Pour 0.0.0.0/0, le type de tronçon suivant Passerelle de réseau virtuel enverrait le trafic destiné à internet vers la passerelle VPN et le réseau local au lieu de NVA1." }
        inet: { en: "The next hop type Internet keeps the default behavior: internet-bound traffic leaves without inspection.", fr: "Le type de tronçon suivant Internet conserve le comportement par défaut : le trafic destiné à internet sort sans inspection." }
        vng2: { en: "A route to the virtual network gateway sends the on-premises traffic straight to the VPN gateway, so it isn't inspected by NVA1.", fr: "Un itinéraire vers la passerelle de réseau virtuel envoie le trafic vers le réseau local directement à la passerelle VPN : il n'est pas inspecté par NVA1." }
        va3: { en: "A route for 10.0.5.0/24 to NVA1 would send the shared-services traffic through NVA1, which the requirement forbids.", fr: "Un itinéraire pour 10.0.5.0/24 vers NVA1 ferait passer le trafic des services partagés par NVA1, ce que l'exigence interdit." }
        noroute: { en: "For 192.168.0.0/16, the BGP route is more specific than 0.0.0.0/0 and wins, so the on-premises traffic would skip NVA1.", fr: "Pour 192.168.0.0/16, l'itinéraire BGP est plus spécifique que 0.0.0.0/0 et l'emporte : le trafic vers le réseau local éviterait NVA1." }
        none: { en: "The next hop type None drops the traffic.", fr: "Le type de tronçon suivant Aucun (None) abandonne le trafic." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview

  # ------------------------------------------------------------------ 10
  - id: az104-qz-41-10
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Fabrikam has three virtual networks in the same region and subscription:

        - **Hub** (10.0.0.0/16) contains a VPN gateway that has a site-to-site connection to the on-premises network, and a network virtual appliance named **NVA1** (10.0.1.4). IP forwarding is enabled on the network interface and in the operating system of NVA1.
        - **Spoke1** (10.1.0.0/16) and **Spoke2** (10.2.0.0/16) have no gateway. Each spoke is peered only with Hub, and all the peering links are **Connected**.
        - The subnets of Spoke1 use a route table that sends 10.2.0.0/16 to the next hop type Virtual appliance at 10.0.1.4. The subnets of Spoke2 use a route table that sends 10.1.0.0/16 to the same next hop.

        The virtual machines in Spoke1 can reach the on-premises network, but those in Spoke2 cannot. Connections between Spoke1 and Spoke2 fail, although the logs of NVA1 show the packets from Spoke1 to Spoke2 arriving on NVA1 and being forwarded. The following table shows the configuration of the four peering links.

        For each requirement, select the setting that you must change. Each requirement is met by changing a single setting.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de trois réseaux virtuels dans la même région et le même abonnement :

        - **Hub** (10.0.0.0/16) contient une passerelle VPN dotée d'une connexion site à site vers le réseau local, et une appliance virtuelle réseau nommée **NVA1** (10.0.1.4). Le transfert IP est activé sur l'interface réseau et dans le système d'exploitation de NVA1.
        - **Spoke1** (10.1.0.0/16) et **Spoke2** (10.2.0.0/16) n'ont pas de passerelle. Chaque spoke est relié par un peering uniquement à Hub, et tous les liens de peering sont à l'état **Connected**.
        - Les sous-réseaux de Spoke1 utilisent une table de routage qui envoie 10.2.0.0/16 vers le type de tronçon suivant Appliance virtuelle à 10.0.1.4. Les sous-réseaux de Spoke2 utilisent une table de routage qui envoie 10.1.0.0/16 vers le même tronçon suivant.

        Les machines virtuelles de Spoke1 atteignent le réseau local, mais pas celles de Spoke2. Les connexions entre Spoke1 et Spoke2 échouent, bien que les journaux de NVA1 montrent les paquets de Spoke1 vers Spoke2 arriver sur NVA1 et être transférés. Le tableau suivant présente la configuration des quatre liens de peering.

        Pour chaque exigence, sélectionnez le réglage que vous devez modifier. Chaque exigence est satisfaite en modifiant un seul réglage.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The virtual machines in Spoke2 must reach the on-premises network through the VPN gateway of Hub.", fr: "Les machines virtuelles de Spoke2 doivent atteindre le réseau local via la passerelle VPN de Hub." }
        - id: p2
          text: { en: "The traffic between Spoke1 and Spoke2 must flow through NVA1.", fr: "Le trafic entre Spoke1 et Spoke2 doit passer par NVA1." }
      grid:
        caption: { en: "Peering links", fr: "Liens de peering" }
        header: [ { en: "Link (on virtual network)", fr: "Lien (sur le réseau virtuel)" }, allowVirtualNetworkAccess, allowForwardedTraffic, allowGatewayTransit, useRemoteGateways ]
        rows:
          - [ { text: "Hub-to-Spoke1 (Hub)" }, { text: { en: "Yes", fr: "Oui" }, area: h1-access }, { text: { en: "No", fr: "Non" }, area: h1-fwd }, { text: { en: "Yes", fr: "Oui" }, area: h1-transit }, { text: { en: "No", fr: "Non" }, area: h1-remote } ]
          - [ { text: "Hub-to-Spoke2 (Hub)" }, { text: { en: "Yes", fr: "Oui" }, area: h2-access }, { text: { en: "No", fr: "Non" }, area: h2-fwd }, { text: { en: "Yes", fr: "Oui" }, area: h2-transit }, { text: { en: "No", fr: "Non" }, area: h2-remote } ]
          - [ { text: "Spoke1-to-Hub (Spoke1)" }, { text: { en: "Yes", fr: "Oui" }, area: s1-access }, { text: { en: "Yes", fr: "Oui" }, area: s1-fwd }, { text: { en: "No", fr: "Non" }, area: s1-transit }, { text: { en: "Yes", fr: "Oui" }, area: s1-remote } ]
          - [ { text: "Spoke2-to-Hub (Spoke2)" }, { text: { en: "Yes", fr: "Oui" }, area: s2-access }, { text: { en: "No", fr: "Non" }, area: s2-fwd }, { text: { en: "No", fr: "Non" }, area: s2-transit }, { text: { en: "No", fr: "Non" }, area: s2-remote } ]
    answer:
      values: { p1: s2-remote, p2: s2-fwd }
    explanation:
      correct:
        en: Hub already allows gateway transit on its link to Spoke2, so Spoke2 only needs useRemoteGateways on its own link, as Spoke1 has. Allow forwarded traffic is set on the link of the virtual network that receives the forwarded traffic. The packets that NVA1 relays from Spoke1 enter Spoke2 without originating in Hub, so Spoke2-to-Hub must allow forwarded traffic; Spoke1-to-Hub already allows it for the return traffic, and the links of Hub don't need it because the traffic entering Hub originates in the spokes.
        fr: "Hub autorise déjà le transit par passerelle sur son lien vers Spoke2 : Spoke2 a seulement besoin de useRemoteGateways sur son propre lien, comme Spoke1. L'autorisation du trafic transféré se règle sur le lien du réseau virtuel qui reçoit le trafic transféré. Les paquets que NVA1 relaie depuis Spoke1 entrent dans Spoke2 sans provenir de Hub : Spoke2-to-Hub doit donc autoriser le trafic transféré ; Spoke1-to-Hub l'autorise déjà pour le trafic retour, et les liens de Hub n'en ont pas besoin car le trafic qui entre dans Hub provient des spokes."
      options:
        h2-fwd: { en: "This setting on Hub's link controls traffic forwarded into Hub; the traffic that enters Hub from the spokes originates in the spokes, so it isn't forwarded traffic.", fr: "Ce réglage sur le lien de Hub contrôle le trafic transféré qui entre dans Hub ; le trafic qui entre dans Hub depuis les spokes provient des spokes : ce n'est pas du trafic transféré." }
        h2-transit: { en: "Gateway transit is already allowed on Hub-to-Spoke2; the missing half is on the spoke's side.", fr: "Le transit par passerelle est déjà autorisé sur Hub-to-Spoke2 ; la moitié manquante est du côté du spoke." }
        s2-transit: { en: "Gateway transit is set on the network that has the gateway; Spoke2 has none.", fr: "Le transit par passerelle se règle sur le réseau qui possède la passerelle ; Spoke2 n'en a pas." }
    references:
      - title: Create, Change, or Delete Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
      - title: Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
