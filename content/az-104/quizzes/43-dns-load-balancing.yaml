chapter: 43-dns-load-balancing
questions:
  # ---------------------------------------------------------------- 1
  - id: az104-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You manage a public DNS zone named **northwind-travel.com** in Azure DNS. The record set **www** of type A contains two IP addresses.

        You need to change how long DNS resolvers cache the answers for www.northwind-travel.com.

        Where should you set the time to live (TTL)?
      fr: |
        Vous gérez une zone DNS publique nommée **northwind-travel.com** dans Azure DNS. Le jeu d'enregistrements **www** de type A contient deux adresses IP.

        Vous devez modifier la durée pendant laquelle les résolveurs DNS mettent en cache les réponses pour www.northwind-travel.com.

        Où devez-vous définir la durée de vie (TTL) ?
    body:
      options:
        - { id: a, text: { en: "On each IP address of the www record set separately", fr: "Sur chaque adresse IP du jeu d'enregistrements www, séparément" } }
        - { id: b, text: { en: "On the www A record set, for both addresses at once", fr: "Sur le jeu d'enregistrements A www, pour les deux adresses à la fois" } }
        - { id: c, text: { en: "On the SOA record, for all the record sets of the zone", fr: "Sur l'enregistrement SOA, pour tous les jeux d'enregistrements de la zone" } }
        - { id: d, text: { en: "On the NS record set at the apex of the zone", fr: "Sur le jeu d'enregistrements NS à la racine de la zone" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: In Azure DNS, the TTL belongs to the record set, not to the individual records. A record set groups all the records that share the same name and type, so the two addresses of the www A record set always use the same TTL. To change the caching duration, you edit the TTL of that record set.
        fr: "Dans Azure DNS, la durée de vie (TTL) appartient au jeu d'enregistrements, pas à chaque enregistrement. Un jeu d'enregistrements regroupe tous les enregistrements de même nom et de même type : les deux adresses du jeu A www utilisent donc toujours la même TTL. Pour changer la durée de mise en cache, vous modifiez la TTL de ce jeu d'enregistrements."
      options:
        a: { en: "Azure DNS has no per-record TTL: all the records of a record set share one value.", fr: "Azure DNS n'a pas de TTL par enregistrement : tous les enregistrements d'un jeu partagent une seule valeur." }
        c: { en: "The SOA record holds the parameters of the zone; it does not set the TTL of the other record sets.", fr: "L'enregistrement SOA contient les paramètres de la zone ; il ne définit pas la TTL des autres jeux d'enregistrements." }
        d: { en: "The NS record set at the apex lists the name servers of the zone; its TTL applies only to that record set.", fr: "Le jeu d'enregistrements NS à la racine liste les serveurs de noms de la zone ; sa TTL ne s'applique qu'à ce jeu." }
    references:
      - title: DNS Zones and Records Overview
        url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records

  # ---------------------------------------------------------------- 2
  - id: az104-qz-43-02
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans a public Standard Load Balancer named **LB1** for a web application. The candidate virtual machines are spread over several virtual networks of the same region and subscription.

        Which virtual machines can you add to the same backend pool of LB1?
      fr: |
        Adatum prévoit un équilibreur de charge public Standard nommé **LB1** pour une application web. Les machines virtuelles candidates sont réparties sur plusieurs réseaux virtuels de la même région et du même abonnement.

        Quelles machines virtuelles pouvez-vous ajouter au même pool principal de LB1 ?
    body:
      options:
        - { id: a, text: { en: "Virtual machines of any virtual network of the subscription", fr: "Des machines virtuelles de n'importe quel réseau virtuel de l'abonnement" } }
        - { id: b, text: { en: "Virtual machines of any virtual networks that are peered together", fr: "Des machines virtuelles de tous réseaux virtuels reliés par peering" } }
        - { id: c, text: { en: "Only virtual machines that are in a single virtual network", fr: "Uniquement des machines virtuelles situées dans un seul réseau virtuel" } }
        - { id: d, text: { en: "Only virtual machines that have a Standard public IP address", fr: "Uniquement des machines virtuelles dotées d'une adresse IP publique Standard" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: The scope of a Standard Load Balancer backend pool is any virtual machine or scale set instance in a single virtual network. A load-balancing rule can't span two virtual networks, so the frontends and the backend instances of LB1 must all belong to one virtual network.
        fr: "La portée du pool principal d'un équilibreur de charge Standard est n'importe quelle machine virtuelle ou instance de groupe identique d'un seul réseau virtuel. Une règle d'équilibrage de charge ne peut pas couvrir deux réseaux virtuels : les frontends et les instances du pool principal de LB1 doivent tous appartenir au même réseau virtuel."
      options:
        a: { en: "Being in the same subscription is not enough: the pool is limited to one virtual network.", fr: "Être dans le même abonnement ne suffit pas : le pool est limité à un seul réseau virtuel." }
        b: { en: "Peering connects the traffic of two networks, but a backend pool still can't span them.", fr: "Le peering relie le trafic de deux réseaux, mais un pool principal ne peut toujours pas les couvrir tous les deux." }
        d: { en: "Backend virtual machines need no public IP address; they receive traffic on their private addresses.", fr: "Les machines virtuelles du pool principal n'ont pas besoin d'adresse IP publique ; elles reçoivent le trafic sur leurs adresses privées." }
    references:
      - title: Azure Load Balancer Components Overview
        url: https://learn.microsoft.com/en-us/azure/load-balancer/components

  # ---------------------------------------------------------------- 3
  - id: az104-qz-43-03
    objective: "4.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam hosts the public zone **fabrikam.com** in Azure DNS. The zone contains an A record set named **portal** that points to 20.61.15.4, the address of a server that is being decommissioned.

        The portal now runs in an App Service app whose default host name is **fabrikam-portal.azurewebsites.net**. You need portal.fabrikam.com to resolve to that host name by using a CNAME record. When you try to create a CNAME record set named portal, the operation fails.

        What should you do?
      fr: |
        Fabrikam héberge la zone publique **fabrikam.com** dans Azure DNS. La zone contient un jeu d'enregistrements A nommé **portal** qui pointe vers 20.61.15.4, l'adresse d'un serveur en cours de mise hors service.

        Le portail s'exécute désormais dans une application App Service dont le nom d'hôte par défaut est **fabrikam-portal.azurewebsites.net**. Vous devez faire en sorte que portal.fabrikam.com soit résolu vers ce nom d'hôte à l'aide d'un enregistrement CNAME. Lorsque vous essayez de créer un jeu d'enregistrements CNAME nommé portal, l'opération échoue.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a TXT record set named portal that contains fabrikam-portal.azurewebsites.net.", fr: "Créer un jeu d'enregistrements TXT nommé portal qui contient fabrikam-portal.azurewebsites.net." } }
        - { id: b, text: { en: "Add fabrikam-portal.azurewebsites.net as a second value of the A record set named portal.", fr: "Ajouter fabrikam-portal.azurewebsites.net comme deuxième valeur du jeu d'enregistrements A nommé portal." } }
        - { id: c, text: { en: "Set the TTL of the A record set named portal to 1 second, and then create the CNAME record set.", fr: "Régler la TTL du jeu d'enregistrements A nommé portal sur 1 seconde, puis créer le jeu d'enregistrements CNAME." } }
        - { id: d, text: { en: "Delete the A record set named portal, and then create the CNAME record set named portal.", fr: "Supprimer le jeu d'enregistrements A nommé portal, puis créer le jeu d'enregistrements CNAME nommé portal." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: A CNAME record set can't coexist with another record set of the same name. Because the zone already has an A record set named portal, the CNAME creation is rejected. Once the obsolete A record set is deleted, the CNAME record set named portal can point to fabrikam-portal.azurewebsites.net.
        fr: "Un jeu d'enregistrements CNAME ne peut pas coexister avec un autre jeu d'enregistrements du même nom. Comme la zone contient déjà un jeu A nommé portal, la création du CNAME est refusée. Une fois le jeu A obsolète supprimé, le jeu d'enregistrements CNAME nommé portal peut pointer vers fabrikam-portal.azurewebsites.net."
      options:
        a: { en: "A TXT record holds free text, for example for domain verification; resolvers don't follow it to another name.", fr: "Un enregistrement TXT contient du texte libre, par exemple pour la vérification de domaine ; les résolveurs ne le suivent pas vers un autre nom." }
        b: { en: "An A record set contains IPv4 addresses only; it can't hold a host name.", fr: "Un jeu d'enregistrements A ne contient que des adresses IPv4 ; il ne peut pas contenir un nom d'hôte." }
        c: { en: "The TTL controls caching only; the conflict between the A and CNAME record sets of the same name remains.", fr: "La TTL ne règle que la mise en cache ; le conflit entre les jeux A et CNAME du même nom subsiste." }
    references:
      - title: DNS Zones and Records Overview
        url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records

  # ---------------------------------------------------------------- 4
  - id: az104-qz-43-04
    objective: "4.3.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys publishes a TCP application on port 9000 through a public Standard Load Balancer named **LB-Trade**. The load-balancing rule uses the default settings. Client sessions can stay idle for up to 20 minutes between two messages.

        Users report that idle sessions are cut, and that neither the clients nor the servers detect it until they try to send data again. You need idle sessions to stay open for 20 minutes, and both endpoints to be notified at once when the load balancer closes an idle connection. You must not change the application.

        Which two settings should you configure on the load-balancing rule? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys publie une application TCP sur le port 9000 par l'intermédiaire d'un équilibreur de charge public Standard nommé **LB-Trade**. La règle d'équilibrage de charge utilise les paramètres par défaut. Les sessions des clients peuvent rester inactives jusqu'à 20 minutes entre deux messages.

        Les utilisateurs signalent que les sessions inactives sont coupées, et que ni les clients ni les serveurs ne s'en aperçoivent avant d'essayer d'envoyer de nouveau des données. Les sessions inactives doivent rester ouvertes pendant 20 minutes, et les deux extrémités doivent être prévenues immédiatement lorsque l'équilibreur de charge ferme une connexion inactive. Vous ne devez pas modifier l'application.

        Quels sont les deux paramètres que vous devez configurer sur la règle d'équilibrage de charge ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set **Session persistence** to **Client IP**.", fr: "Régler la **persistance de session** sur **IP client**." } }
        - { id: b, text: { en: "Set **Idle timeout (minutes)** to 30.", fr: "Régler le **délai d'inactivité (minutes)** sur 30." } }
        - { id: c, text: { en: "Enable **Floating IP**.", fr: "Activer l'**IP flottante**." } }
        - { id: d, text: { en: "Enable **TCP reset**.", fr: "Activer la **réinitialisation TCP**." } }
        - { id: e, text: { en: "Select **HA ports**.", fr: "Sélectionner les **ports HA**." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: The idle timeout of a load-balancing rule is 4 minutes by default and can be raised up to 100 minutes on a Standard Load Balancer, so 30 minutes keeps 20-minute idle sessions open. When TCP reset is enabled on the rule, the load balancer sends a TCP RST to both the client and the server at idle timeout, so both endpoints close the socket immediately instead of discovering the dead connection later.
        fr: "Le délai d'inactivité d'une règle d'équilibrage de charge est de 4 minutes par défaut et peut monter jusqu'à 100 minutes sur un équilibreur de charge Standard : 30 minutes gardent ouvertes des sessions inactives de 20 minutes. Lorsque la réinitialisation TCP est activée sur la règle, l'équilibreur de charge envoie un TCP RST au client et au serveur à l'expiration du délai : les deux extrémités ferment le socket immédiatement au lieu de découvrir plus tard la connexion morte."
      options:
        a: { en: "Client IP keeps a client on the same instance for new connections; it doesn't extend the idle timeout.", fr: "IP client garde un client sur la même instance pour ses nouvelles connexions ; elle ne prolonge pas le délai d'inactivité." }
        c: { en: "Floating IP changes the destination address seen by the backend; it doesn't affect idle connections.", fr: "L'IP flottante change l'adresse de destination vue par le pool principal ; elle n'agit pas sur les connexions inactives." }
        e: { en: "HA ports rules exist only on internal load balancers, and they don't change the idle behavior.", fr: "Les règles de ports HA n'existent que sur les équilibreurs de charge internes, et elles ne changent pas le comportement en inactivité." }
    references:
      - title: Load Balancer TCP Reset and idle timeout in Azure - Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset

  # ---------------------------------------------------------------- 5
  - id: az104-qz-43-05
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware collects syslog messages on three virtual machines placed behind an internal Standard Load Balancer named **ILB-Log**. The load-balancing rule forwards **UDP 514**. The syslog service listens only on UDP 514, and it exposes a status page at `http://<vm>:8080/health` that returns HTTP 200 only while the service runs. Every virtual machine also accepts RDP connections on TCP 3389.

        You need a virtual machine to stop receiving syslog traffic when its syslog service stops.

        How should you configure the health probe?
      fr: |
        Litware collecte des messages syslog sur trois machines virtuelles placées derrière un équilibreur de charge interne Standard nommé **ILB-Log**. La règle d'équilibrage de charge transfère **UDP 514**. Le service syslog n'écoute que sur UDP 514, et il expose une page d'état `http://<vm>:8080/health` qui renvoie HTTP 200 uniquement tant que le service s'exécute. Chaque machine virtuelle accepte aussi les connexions RDP sur TCP 3389.

        Une machine virtuelle doit cesser de recevoir le trafic syslog lorsque son service syslog s'arrête.

        Comment devez-vous configurer la sonde d'intégrité ?
    body:
      options:
        - { id: a, text: { en: "Protocol TCP, port 514", fr: "Protocole TCP, port 514" } }
        - { id: b, text: { en: "Protocol HTTP, port 8080, path /health", fr: "Protocole HTTP, port 8080, chemin /health" } }
        - { id: c, text: { en: "Protocol HTTPS, port 8080, path /health", fr: "Protocole HTTPS, port 8080, chemin /health" } }
        - { id: d, text: { en: "Protocol TCP, port 3389", fr: "Protocole TCP, port 3389" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: Health probes support TCP, HTTP and HTTPS, not UDP. For a UDP service, the probe must target a TCP, HTTP or HTTPS endpoint of the same instance that reflects the health of that service. The HTTP status page on port 8080 returns 200 only while syslog runs, so an HTTP probe on /health marks the instance down when the service stops.
        fr: "Les sondes d'intégrité prennent en charge TCP, HTTP et HTTPS, pas UDP. Pour un service UDP, la sonde doit viser un point de terminaison TCP, HTTP ou HTTPS de la même instance qui reflète l'état de ce service. La page d'état HTTP du port 8080 ne renvoie 200 que tant que syslog s'exécute : une sonde HTTP sur /health marque donc l'instance comme défaillante dès que le service s'arrête."
      options:
        a: { en: "The service listens on UDP 514 only, so a TCP handshake on port 514 fails and every instance is marked down.", fr: "Le service n'écoute que sur UDP 514 : une négociation TCP sur le port 514 échoue et toutes les instances sont marquées défaillantes." }
        c: { en: "The status page is plain HTTP; an HTTPS probe can't complete the TLS handshake and marks the instance down.", fr: "La page d'état est en HTTP simple ; une sonde HTTPS ne peut pas établir la négociation TLS et marque l'instance comme défaillante." }
        d: { en: "RDP keeps answering when syslog stops, so the instance would keep receiving syslog traffic.", fr: "RDP continue de répondre quand syslog s'arrête : l'instance continuerait de recevoir le trafic syslog." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview

  # ---------------------------------------------------------------- 6
  - id: az104-qz-43-06
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso uses a hub-and-spoke topology in one Azure region. **VNet-Hub** is peered with **VNet-Spoke1** and **VNet-Spoke2**. All the virtual networks use the default Azure-provided DNS.

        A storage account named **stcontosodata** has public network access disabled. Its blob private endpoint is in VNet-Hub and is registered in the private DNS zone **privatelink.blob.core.windows.net**, which is linked to VNet-Hub only. Virtual machines in VNet-Hub access the blobs successfully.

        From virtual machines in both spokes, `nslookup stcontosodata.blob.core.windows.net` returns a public IP address, and access to the blobs is denied.

        You need the virtual machines in the spokes to access stcontosodata through the existing private endpoint. The solution must minimize costs.

        What should you do?
      fr: |
        Contoso utilise une topologie hub-and-spoke dans une région Azure. **VNet-Hub** est relié par peering à **VNet-Spoke1** et à **VNet-Spoke2**. Tous les réseaux virtuels utilisent le DNS par défaut fourni par Azure.

        Un compte de stockage nommé **stcontosodata** a l'accès réseau public désactivé. Son point de terminaison privé blob se trouve dans VNet-Hub et est inscrit dans la zone DNS privée **privatelink.blob.core.windows.net**, liée uniquement à VNet-Hub. Les machines virtuelles de VNet-Hub accèdent aux objets blob sans problème.

        Depuis les machines virtuelles des deux spokes, `nslookup stcontosodata.blob.core.windows.net` renvoie une adresse IP publique, et l'accès aux objets blob est refusé.

        Les machines virtuelles des spokes doivent accéder à stcontosodata par le point de terminaison privé existant. La solution doit réduire les coûts au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create another private endpoint for stcontosodata in each spoke virtual network.", fr: "Créer un autre point de terminaison privé pour stcontosodata dans chaque réseau virtuel spoke." } }
        - { id: b, text: { en: "Enable autoregistration on the link between privatelink.blob.core.windows.net and VNet-Hub.", fr: "Activer l'inscription automatique sur le lien entre privatelink.blob.core.windows.net et VNet-Hub." } }
        - { id: c, text: { en: "Link privatelink.blob.core.windows.net to VNet-Spoke1 and VNet-Spoke2, without autoregistration.", fr: "Lier privatelink.blob.core.windows.net à VNet-Spoke1 et VNet-Spoke2, sans inscription automatique." } }
        - { id: d, text: { en: "Set the DNS servers of VNet-Spoke1 and VNet-Spoke2 to the custom address 168.63.129.16.", fr: "Définir l'adresse personnalisée 168.63.129.16 comme serveur DNS de VNet-Spoke1 et VNet-Spoke2." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: A private DNS zone answers only the virtual networks that are linked to it; peering carries the traffic but not the zone links. The spokes therefore follow the public resolution chain and get the public IP address. Linking the same privatelink zone to every spoke that contains clients makes them resolve the private endpoint address, at no extra endpoint cost; a resolution link is enough because the record already exists.
        fr: "Une zone DNS privée ne répond qu'aux réseaux virtuels qui lui sont liés ; le peering transporte le trafic mais pas les liens de zone. Les spokes suivent donc la chaîne de résolution publique et obtiennent l'adresse IP publique. Lier la même zone privatelink à chaque spoke qui contient des clients leur fait résoudre l'adresse du point de terminaison privé, sans coût de point de terminaison supplémentaire ; un lien de résolution suffit, car l'enregistrement existe déjà."
      options:
        a: { en: "Additional private endpoints are billed and still need DNS resolution in the spokes, so this doesn't minimize costs.", fr: "Des points de terminaison privés supplémentaires sont facturés et nécessitent toujours une résolution DNS dans les spokes : cela ne réduit pas les coûts au minimum." }
        b: { en: "Autoregistration only creates records for the virtual machines of VNet-Hub; it gives the spokes no access to the zone.", fr: "L'inscription automatique ne crée que les enregistrements des machines virtuelles de VNet-Hub ; elle ne donne pas aux spokes l'accès à la zone." }
        d: { en: "168.63.129.16 is the Azure-provided DNS that the spokes already use; it still answers only from the zones linked to each spoke.", fr: "168.63.129.16 est le DNS fourni par Azure que les spokes utilisent déjà ; il ne répond toujours qu'à partir des zones liées à chaque spoke." }
    references:
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
      - title: What is a virtual network link subresource of Azure DNS private zones
        url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links

  # ---------------------------------------------------------------- 7
  - id: az104-qz-43-07
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware runs a SQL Server Always On availability group on two virtual machines named **SQL1** and **SQL2**. They are in the subnet **snet-sql** of a virtual network named **VNet-Data**. The application servers are in a peered virtual network named **VNet-App** and must connect to the availability group listener at the private address **10.30.2.50**. The listener must never be reachable from the internet.

        SQL1 and SQL2 have no public IP addresses and must stay without public IP addresses. They must be able to download updates from the internet.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute un groupe de disponibilité SQL Server Always On sur deux machines virtuelles nommées **SQL1** et **SQL2**. Elles se trouvent dans le sous-réseau **snet-sql** d'un réseau virtuel nommé **VNet-Data**. Les serveurs d'applications se trouvent dans un réseau virtuel relié par peering nommé **VNet-App** et doivent se connecter à l'écouteur du groupe de disponibilité à l'adresse privée **10.30.2.50**. L'écouteur ne doit jamais être accessible depuis internet.

        SQL1 et SQL2 n'ont pas d'adresse IP publique et doivent rester sans adresse IP publique. Elles doivent pouvoir télécharger des mises à jour depuis internet.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Load balancer that holds the listener address: [[lb]]

          Setting that the listener requires on the load-balancing rule: [[rule]]

          Outbound internet access for SQL1 and SQL2: [[out]]
        fr: |
          Équilibreur de charge qui porte l'adresse de l'écouteur : [[lb]]

          Paramètre que l'écouteur exige sur la règle d'équilibrage de charge : [[rule]]

          Accès internet sortant pour SQL1 et SQL2 : [[out]]
      slots:
        - id: lb
          options:
            - { id: ilb, text: { en: "An internal Standard Load Balancer", fr: "Un équilibreur de charge interne Standard" } }
            - { id: plb, text: { en: "A public Standard Load Balancer", fr: "Un équilibreur de charge public Standard" } }
            - { id: gwlb, text: { en: "A Gateway Load Balancer", fr: "Un équilibreur de charge de passerelle" } }
        - id: rule
          options:
            - { id: fip, text: { en: "Floating IP: Enabled", fr: "IP flottante : activée" } }
            - { id: cip, text: { en: "Session persistence: Client IP", fr: "Persistance de session : IP client" } }
            - { id: haports, text: { en: "HA ports: selected", fr: "Ports HA : sélectionnés" } }
            - { id: rst, text: { en: "TCP reset: Enabled", fr: "Réinitialisation TCP : activée" } }
        - id: out
          options:
            - { id: natgw, text: { en: "Associate a NAT gateway with snet-sql", fr: "Associer une passerelle NAT à snet-sql" } }
            - { id: outrule, text: { en: "Add an outbound rule to the load balancer of the listener", fr: "Ajouter une règle de trafic sortant à l'équilibreur de charge de l'écouteur" } }
            - { id: natin, text: { en: "Add an inbound NAT rule for each virtual machine", fr: "Ajouter une règle NAT entrante pour chaque machine virtuelle" } }
            - { id: nosnat, text: { en: "Disable outbound SNAT on the load-balancing rule", fr: "Désactiver la SNAT sortante sur la règle d'équilibrage de charge" } }
    answer:
      values: { lb: ilb, rule: fip, out: natgw }
    explanation:
      correct:
        en: The listener uses a private address and must stay off the internet, so it sits on the frontend of an internal Standard Load Balancer, which peered networks can reach. An availability group listener requires Floating IP (direct server return) on the load-balancing rule. An internal load balancer gives its backend no outbound path, and outbound rules need a public frontend, so a NAT gateway on snet-sql provides internet access without public IP addresses on the virtual machines.
        fr: "L'écouteur utilise une adresse privée et doit rester hors d'internet : il se place sur le frontend d'un équilibreur de charge interne Standard, que les réseaux reliés par peering peuvent atteindre. Un écouteur de groupe de disponibilité exige l'IP flottante (retour direct du serveur) sur la règle d'équilibrage de charge. Un équilibreur de charge interne ne donne aucun chemin sortant à son pool principal, et les règles de trafic sortant exigent un frontend public : une passerelle NAT sur snet-sql fournit l'accès internet sans adresse IP publique sur les machines virtuelles."
      options:
        plb: { en: "A public frontend would expose the listener to the internet.", fr: "Un frontend public exposerait l'écouteur sur internet." }
        gwlb: { en: "A Gateway Load Balancer chains network virtual appliances to another frontend; it doesn't host a listener address.", fr: "Un équilibreur de charge de passerelle chaîne des appliances virtuelles réseau à un autre frontend ; il ne porte pas d'adresse d'écouteur." }
        cip: { en: "Client IP affinity is not what the listener needs; the rule keeps the default persistence.", fr: "L'affinité IP client n'est pas ce dont l'écouteur a besoin ; la règle garde la persistance par défaut." }
        haports: { en: "HA ports balance every port and protocol, typically for NVAs; they don't give the listener its floating address.", fr: "Les ports HA équilibrent tous les ports et protocoles, typiquement pour des NVA ; ils ne donnent pas son adresse flottante à l'écouteur." }
        outrule: { en: "Outbound rules define SNAT through a public frontend; the internal load balancer has none.", fr: "Les règles de trafic sortant définissent la SNAT par un frontend public ; l'équilibreur de charge interne n'en a pas." }
        natin: { en: "Inbound NAT rules forward incoming traffic to one instance; they provide no outbound connectivity.", fr: "Les règles NAT entrantes transfèrent du trafic entrant vers une instance ; elles ne fournissent aucune connectivité sortante." }
        nosnat: { en: "Disabling outbound SNAT removes outbound connectivity instead of adding it.", fr: "Désactiver la SNAT sortante supprime la connectivité sortante au lieu de l'ajouter." }
    references:
      - title: Configure a Load Balancer & Availability Group Listener (Azure Portal) - SQL Server on Azure VMs
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-load-balancer-portal-configure
      - title: Outbound Rules for Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules

  # ---------------------------------------------------------------- 8
  - id: az104-qz-43-08
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank publishes an internal web application through an internal Standard Load Balancer named **ILB-App** whose frontend IP address is **10.20.1.100**. The backend pool contains **VM1**, **VM2** and **VM3**. The load-balancing rule forwards TCP 80, and the health probe uses **HTTP** on port 80 with the path **/**. The NSG of the subnet contains only the default rules.

        Yesterday, the following happened:

        - On VM2, a developer enabled authentication on the whole website. Anonymous requests to any path of VM2 now receive **HTTP 401**.
        - From a session on VM1, an administrator ran `curl http://10.20.1.100/` to test the application through the load balancer. The command timed out. The same command against the private IP address of VM3 returned the home page.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank publie une application web interne par l'intermédiaire d'un équilibreur de charge interne Standard nommé **ILB-App**, dont l'adresse IP frontale est **10.20.1.100**. Le pool principal contient **VM1**, **VM2** et **VM3**. La règle d'équilibrage de charge transfère TCP 80, et la sonde d'intégrité utilise **HTTP** sur le port 80 avec le chemin **/**. Le NSG du sous-réseau ne contient que les règles par défaut.

        Hier, les événements suivants se sont produits :

        - Sur VM2, un développeur a activé l'authentification sur tout le site web. Les requêtes anonymes vers n'importe quel chemin de VM2 reçoivent désormais **HTTP 401**.
        - Depuis une session sur VM1, un administrateur a exécuté `curl http://10.20.1.100/` pour tester l'application à travers l'équilibreur de charge. La commande a expiré. La même commande vers l'adresse IP privée de VM3 a renvoyé la page d'accueil.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "VM2 no longer receives new connections from ILB-App.", fr: "VM2 ne reçoit plus de nouvelles connexions d'ILB-App." } }
        - { id: s2, text: { en: "The timeout of the test run from VM1 is caused by the NSG of the subnet.", fr: "L'expiration du test exécuté depuis VM1 est due au NSG du sous-réseau." } }
        - { id: s3, text: { en: "If you change the health probe to TCP on port 80, ILB-App reports VM2 as healthy.", fr: "Si vous changez la sonde d'intégrité en TCP sur le port 80, ILB-App signale VM2 comme saine." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: "An HTTP probe marks an instance up only when it receives HTTP 200; the 401 answer marks VM2 down, so it gets no new flows (Yes). An outbound flow from a backend virtual machine to the frontend of its own internal load balancer fails: this is a documented limitation, and the default AllowVnetInBound rule allows the traffic, as the direct test to VM3 shows (No). A TCP probe only checks the handshake on port 80, which still succeeds on VM2, so VM2 would be reported healthy even though users would get 401 (Yes)."
        fr: "Une sonde HTTP ne marque une instance comme saine que si elle reçoit HTTP 200 ; la réponse 401 marque VM2 comme défaillante, qui ne reçoit donc plus de nouveaux flux (Oui). Un flux sortant d'une machine virtuelle du pool principal vers le frontend de son propre équilibreur de charge interne échoue : c'est une limitation documentée, et la règle par défaut AllowVnetInBound autorise le trafic, comme le montre le test direct vers VM3 (Non). Une sonde TCP ne vérifie que la négociation sur le port 80, qui réussit toujours sur VM2 : VM2 serait signalée saine alors que les utilisateurs recevraient 401 (Oui)."
      options:
        s2: { en: "The default rules allow traffic within the virtual network, as the direct test to VM3 shows; the timeout comes from the backend-to-own-frontend limitation, so test the frontend from a virtual machine outside the pool.", fr: "Les règles par défaut autorisent le trafic au sein du réseau virtuel, comme le montre le test direct vers VM3 ; l'expiration vient de la limitation pool principal vers son propre frontend : testez le frontend depuis une machine virtuelle hors du pool." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
      - title: Azure Load Balancer Components Overview
        url: https://learn.microsoft.com/en-us/azure/load-balancer/components

  # ---------------------------------------------------------------- 9
  - id: az104-qz-43-09
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has an on-premises network connected to a virtual network named **VNet-Hub** by a site-to-site VPN. The on-premises clients use two Windows DNS servers that host the on-premises zones.

        A private DNS zone named **corp.contoso.internal** is linked to VNet-Hub with autoregistration enabled and contains the records of the Azure virtual machines. VNet-Hub uses the default Azure-provided DNS.

        You need the on-premises clients to resolve the names of corp.contoso.internal. The solution must not require you to deploy or maintain DNS server virtual machines in Azure.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau local connecté à un réseau virtuel nommé **VNet-Hub** par un VPN site à site. Les clients locaux utilisent deux serveurs DNS Windows qui hébergent les zones locales.

        Une zone DNS privée nommée **corp.contoso.internal** est liée à VNet-Hub avec l'inscription automatique activée et contient les enregistrements des machines virtuelles Azure. VNet-Hub utilise le DNS par défaut fourni par Azure.

        Les clients locaux doivent résoudre les noms de corp.contoso.internal. La solution ne doit pas vous obliger à déployer ni à maintenir des machines virtuelles de serveur DNS dans Azure.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deploy an Azure DNS Private Resolver in VNet-Hub with an outbound endpoint and a DNS forwarding ruleset for corp.contoso.internal.", fr: "Déployer un Azure DNS Private Resolver dans VNet-Hub avec un point de terminaison sortant et un ensemble de règles de transfert DNS pour corp.contoso.internal." } }
        - { id: b, text: { en: "Deploy an Azure DNS Private Resolver in VNet-Hub with an inbound endpoint.", fr: "Déployer un Azure DNS Private Resolver dans VNet-Hub avec un point de terminaison entrant." } }
        - { id: c, text: { en: "Set the DNS servers of VNet-Hub to the IP addresses of the two on-premises DNS servers.", fr: "Définir les adresses IP des deux serveurs DNS locaux comme serveurs DNS de VNet-Hub." } }
        - { id: d, text: { en: "On the on-premises DNS servers, create a conditional forwarder for corp.contoso.internal that targets 168.63.129.16.", fr: "Sur les serveurs DNS locaux, créer un redirecteur conditionnel pour corp.contoso.internal qui cible 168.63.129.16." } }
        - { id: e, text: { en: "On the on-premises DNS servers, create a conditional forwarder for corp.contoso.internal that targets the IP address of the inbound endpoint.", fr: "Sur les serveurs DNS locaux, créer un redirecteur conditionnel pour corp.contoso.internal qui cible l'adresse IP du point de terminaison entrant." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: An inbound endpoint of Azure DNS Private Resolver receives queries from on-premises on a private IP address of VNet-Hub and resolves them against the private zones linked to that virtual network. The on-premises DNS servers then need a conditional forwarder for corp.contoso.internal that points to the inbound endpoint IP address, reachable through the VPN. The resolver is a managed service, so no DNS virtual machine is needed.
        fr: "Un point de terminaison entrant d'Azure DNS Private Resolver reçoit les requêtes venant du réseau local sur une adresse IP privée de VNet-Hub et les résout avec les zones privées liées à ce réseau virtuel. Les serveurs DNS locaux ont ensuite besoin d'un redirecteur conditionnel pour corp.contoso.internal qui pointe vers l'adresse IP du point de terminaison entrant, accessible par le VPN. Le résolveur est un service managé : aucune machine virtuelle DNS n'est nécessaire."
      options:
        a: { en: "An outbound endpoint and its ruleset forward queries from Azure to other DNS servers, the opposite direction.", fr: "Un point de terminaison sortant et son ensemble de règles transfèrent des requêtes d'Azure vers d'autres serveurs DNS : c'est le sens inverse." }
        c: { en: "This sends Azure queries to on-premises; the on-premises servers still have no way to resolve the private zone.", fr: "Cela envoie les requêtes d'Azure vers le réseau local ; les serveurs locaux n'ont toujours aucun moyen de résoudre la zone privée." }
        d: { en: "168.63.129.16 is a virtual IP of the Azure host that serves the virtual machines of Azure; on-premises servers can't use it through the VPN.", fr: "168.63.129.16 est une IP virtuelle de l'hôte Azure qui sert les machines virtuelles d'Azure ; les serveurs locaux ne peuvent pas l'utiliser par le VPN." }
    references:
      - title: Azure DNS Private Resolver Overview
        url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
      - title: Resolve Azure and on-premises domains
        url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-hybrid-dns

  # ---------------------------------------------------------------- 10
  - id: az104-qz-43-10
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso publishes a website through a public Standard Load Balancer named **LB-Web**. The load-balancing rule forwards TCP 443 from the frontend public IP address to a backend pool of three virtual machines that have no public IP addresses. The health probe uses HTTP on port 80 with the path /health. The subnet of the virtual machines is associated with the NSG **NSG-Web**, and no NSG is associated with their network interfaces.

        In addition to the default rules, NSG-Web contains the following inbound security rules.

        | Priority | Name | Port | Protocol | Source | Action |
        | --- | --- | --- | --- | --- | --- |
        | 100 | Allow-LB-443 | 443 | TCP | AzureLoadBalancer | Allow |
        | 200 | Allow-Probe-80 | 80 | TCP | AzureLoadBalancer | Allow |

        The **Health Probe Status** metric shows 100 percent for every instance. Internet users time out when they browse to the website through the frontend IP address of LB-Web. From another virtual machine in the same virtual network, HTTPS requests to the private IP address of each web server succeed.

        You need internet users to reach the website.

        What should you do?
      fr: |
        Contoso publie un site web par l'intermédiaire d'un équilibreur de charge public Standard nommé **LB-Web**. La règle d'équilibrage de charge transfère TCP 443 de l'adresse IP publique frontale vers un pool principal de trois machines virtuelles qui n'ont pas d'adresse IP publique. La sonde d'intégrité utilise HTTP sur le port 80 avec le chemin /health. Le sous-réseau des machines virtuelles est associé au NSG **NSG-Web**, et aucun NSG n'est associé à leurs interfaces réseau.

        En plus des règles par défaut, NSG-Web contient les règles de sécurité entrantes suivantes.

        | Priorité | Nom | Port | Protocole | Source | Action |
        | --- | --- | --- | --- | --- | --- |
        | 100 | Allow-LB-443 | 443 | TCP | AzureLoadBalancer | Allow |
        | 200 | Allow-Probe-80 | 80 | TCP | AzureLoadBalancer | Allow |

        La métrique **Health Probe Status** affiche 100 % pour chaque instance. Les connexions des utilisateurs d'internet expirent lorsqu'ils accèdent au site web par l'adresse IP frontale de LB-Web. Depuis une autre machine virtuelle du même réseau virtuel, les requêtes HTTPS vers l'adresse IP privée de chaque serveur web réussissent.

        Les utilisateurs d'internet doivent pouvoir accéder au site web.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate a NAT gateway that has a public IP address with the subnet of the web servers.", fr: "Associer une passerelle NAT dotée d'une adresse IP publique au sous-réseau des serveurs web." } }
        - { id: b, text: { en: "Change the source of the Allow-LB-443 rule to the IP address 168.63.129.16/32.", fr: "Remplacer la source de la règle Allow-LB-443 par l'adresse IP 168.63.129.16/32." } }
        - { id: c, text: { en: "Change the health probe of LB-Web to HTTPS on port 443 with the path /health.", fr: "Remplacer la sonde d'intégrité de LB-Web par une sonde HTTPS sur le port 443 avec le chemin /health." } }
        - { id: d, text: { en: "Add an inbound rule to NSG-Web that allows TCP 443 from the Internet service tag.", fr: "Ajouter à NSG-Web une règle entrante qui autorise TCP 443 depuis l'étiquette de service Internet." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: The AzureLoadBalancer service tag stands for 168.63.129.16, the source of the health probes only; it doesn't include the client traffic that the load balancer forwards. Load-balanced packets reach the virtual machines with the internet client as their source, so they match no allow rule and are dropped by DenyAllInBound, because a Standard Load Balancer is closed to inbound traffic unless an NSG allows it. A rule that allows TCP 443 from the Internet tag opens the website, while the probe already works.
        fr: "L'étiquette de service AzureLoadBalancer représente 168.63.129.16, la source des seules sondes d'intégrité ; elle n'inclut pas le trafic des clients que l'équilibreur de charge transfère. Les paquets équilibrés arrivent sur les machines virtuelles avec le client internet comme source : ils ne correspondent à aucune règle d'autorisation et sont rejetés par DenyAllInBound, car un équilibreur de charge Standard est fermé au trafic entrant tant qu'un NSG ne l'autorise pas. Une règle qui autorise TCP 443 depuis l'étiquette Internet ouvre le site web, la sonde fonctionnant déjà."
      options:
        a: { en: "A NAT gateway handles outbound connections started by the virtual machines; replies to inbound load-balanced flows don't need it.", fr: "Une passerelle NAT gère les connexions sortantes ouvertes par les machines virtuelles ; les réponses aux flux entrants équilibrés n'en ont pas besoin." }
        b: { en: "168.63.129.16 is exactly what the AzureLoadBalancer tag already covers, so client traffic stays blocked.", fr: "168.63.129.16 est exactement ce que couvre déjà l'étiquette AzureLoadBalancer : le trafic des clients reste bloqué." }
        c: { en: "The probe already reports 100 percent; changing it doesn't open the NSG to the clients.", fr: "La sonde indique déjà 100 % ; la changer n'ouvre pas le NSG aux clients." }
    references:
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
      - title: What is Azure Load Balancer?
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
