chapter: 32-virtual-machines
questions:
  # ---------------------------------------------------------------- 1. recall (3.2.1)
  - id: az104-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You plan to create a virtual machine named **VM1** in the **West Europe** region, in a resource group named **RG-VM** of a subscription named **Sub1**. Your Microsoft Entra tenant contains the following virtual networks.

        | Name | Subscription | Resource group | Region |
        | --- | --- | --- | --- |
        | VNet1 | Sub1 | RG-VM | North Europe |
        | VNet2 | Sub1 | RG-Net | West Europe |
        | VNet3 | Sub2 | RG-VM | West Europe |
        | VNet4 | Sub2 | RG-Net | North Europe |

        To which virtual network can you connect the network interface of VM1?
      fr: |
        Vous prévoyez de créer une machine virtuelle nommée **VM1** dans la région **West Europe**, dans un groupe de ressources nommé **RG-VM** d'un abonnement nommé **Sub1**. Votre locataire Microsoft Entra contient les réseaux virtuels suivants.

        | Nom | Abonnement | Groupe de ressources | Région |
        | --- | --- | --- | --- |
        | VNet1 | Sub1 | RG-VM | North Europe |
        | VNet2 | Sub1 | RG-Net | West Europe |
        | VNet3 | Sub2 | RG-VM | West Europe |
        | VNet4 | Sub2 | RG-Net | North Europe |

        À quel réseau virtuel pouvez-vous connecter l'interface réseau de VM1 ?
    body:
      options:
        - { id: a, text: VNet1 }
        - { id: b, text: VNet2 }
        - { id: c, text: VNet3 }
        - { id: d, text: VNet4 }
    answer: { optionId: b }
    explanation:
      correct:
        en: "A virtual machine, its network interfaces and the virtual network they connect to must be in the same region and the same subscription. The resource group doesn't matter, so VNet2 (Sub1, West Europe) can be used even though it is in RG-Net."
        fr: "Une machine virtuelle, ses interfaces réseau et le réseau virtuel auquel elles se connectent doivent être dans la même région et le même abonnement. Le groupe de ressources n'a pas d'importance : VNet2 (Sub1, West Europe) convient même s'il se trouve dans RG-Net."
      options:
        a:
          en: "VNet1 is in the right subscription and resource group, but in North Europe. The region of the virtual network must match the region of VM1."
          fr: "VNet1 est dans le bon abonnement et le bon groupe de ressources, mais en North Europe. La région du réseau virtuel doit être celle de VM1."
        c:
          en: "VNet3 is in West Europe, but in Sub2. A network interface can't connect to a virtual network of another subscription."
          fr: "VNet3 est en West Europe, mais dans Sub2. Une interface réseau ne peut pas se connecter à un réseau virtuel d'un autre abonnement."
        d:
          en: "VNet4 is in another subscription and another region than VM1."
          fr: "VNet4 est dans un autre abonnement et une autre région que VM1."
    references:
      - title: Virtual networks and virtual machines in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-overview

  # ---------------------------------------------------------------- 2. recall (3.2.4)
  - id: az104-qz-32-02
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to deploy a virtual machine of size **Standard_D8ads_v5**.

        What does the letter **d** that follows the letter **a** in this size name indicate?
      fr: |
        Vous prévoyez de déployer une machine virtuelle de taille **Standard_D8ads_v5**.

        Qu'indique la lettre **d** qui suit la lettre **a** dans ce nom de taille ?
    body:
      options:
        - { id: a, text: { en: "The size uses an AMD-based processor.", fr: "La taille utilise un processeur AMD." } }
        - { id: b, text: { en: "The size is compatible with Premium SSD disks.", fr: "La taille est compatible avec les disques SSD Premium." } }
        - { id: c, text: { en: "The size includes a local temporary disk.", fr: "La taille inclut un disque temporaire local." } }
        - { id: d, text: { en: "The size has more memory per vCPU than the base size.", fr: "La taille offre plus de mémoire par processeur virtuel que la taille de base." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "In a size name, the additive feature letters follow the number of vCPUs. In D8ads_v5, a means an AMD-based processor, d means that the size includes a local temporary disk, and s means that the size is compatible with Premium SSD disks."
        fr: "Dans un nom de taille, les lettres de fonctionnalités suivent le nombre de processeurs virtuels. Dans D8ads_v5, a signifie un processeur AMD, d signifie que la taille inclut un disque temporaire local, et s que la taille est compatible avec les disques SSD Premium."
      options:
        a:
          en: "The AMD-based processor is indicated by the letter a, which precedes the d."
          fr: "Le processeur AMD est indiqué par la lettre a, qui précède le d."
        b:
          en: "Premium SSD compatibility is indicated by the letter s, the last letter before the version."
          fr: "La compatibilité avec les SSD Premium est indiquée par la lettre s, la dernière lettre avant la version."
        d:
          en: "Extra memory is indicated by the letter m (memory intensive), which isn't in this size name."
          fr: "Une mémoire supérieure est indiquée par la lettre m (memory intensive), absente de ce nom de taille."
    references:
      - title: Azure VM sizes naming conventions
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/vm-naming-conventions

  # ---------------------------------------------------------------- 3. apply (3.2.5)
  - id: az104-qz-32-03
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Windows Server virtual machine named **VM3** of size Standard_D4ds_v5. An application on VM3 writes daily report files to drive D:. After a maintenance event on the host and a stop and start of VM3 from the Azure portal, the report files are missing.

        You need to ensure that the report files are kept after maintenance events, deallocation and redeployment of VM3.

        What should you do?
      fr: |
        Vous disposez d'une machine virtuelle Windows Server nommée **VM3** de taille Standard_D4ds_v5. Une application de VM3 écrit des rapports quotidiens sur le lecteur D:. Après un événement de maintenance de l'hôte, puis un arrêt et un démarrage de VM3 depuis le portail Azure, les fichiers de rapport ont disparu.

        Vous devez faire en sorte que les fichiers de rapport soient conservés après les événements de maintenance, la libération et le redéploiement de VM3.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Resize VM3 to Standard_D8ds_v5 to get a larger drive D:.", fr: "Redimensionner VM3 en Standard_D8ds_v5 pour obtenir un lecteur D: plus grand." } }
        - { id: b, text: { en: "Restart VM3 from Windows instead of stopping it from the portal.", fr: "Redémarrer VM3 depuis Windows au lieu de l'arrêter depuis le portail." } }
        - { id: c, text: { en: "Attach a managed data disk to VM3 and write the files to it.", fr: "Attacher un disque de données managé à VM3 et y écrire les fichiers." } }
        - { id: d, text: { en: "Enable encryption at host on VM3 to protect drive D:.", fr: "Activer le chiffrement sur l'hôte sur VM3 pour protéger le lecteur D:." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "Drive D: is the temporary disk of the size (the d in D4ds_v5). It isn't a managed disk, and its data can be lost during maintenance, redeployment or when the VM is stopped. Data that must persist belongs on a managed data disk, which keeps its content in all these cases."
        fr: "Le lecteur D: est le disque temporaire de la taille (le d de D4ds_v5). Ce n'est pas un disque managé, et ses données peuvent être perdues lors d'une maintenance, d'un redéploiement ou de l'arrêt de la machine virtuelle. Les données à conserver doivent être sur un disque de données managé, qui garde son contenu dans tous ces cas."
      options:
        a:
          en: "A larger size still provides a temporary disk, with the same lack of persistence."
          fr: "Une taille plus grande fournit toujours un disque temporaire, tout aussi peu persistant."
        b:
          en: "A restart keeps the temporary disk content, but maintenance events and redeployment can still erase it."
          fr: "Un redémarrage conserve le contenu du disque temporaire, mais les maintenances et le redéploiement peuvent toujours l'effacer."
        d:
          en: "Encryption at host encrypts the temporary disk; it doesn't make its data persistent."
          fr: "Le chiffrement sur l'hôte chiffre le disque temporaire ; il ne rend pas ses données persistantes."
    references:
      - title: Overview of Azure Disk Storage
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview

  # ---------------------------------------------------------------- 4. apply (3.2.6)
  - id: az104-qz-32-04
    objective: "3.2.6"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an availability set named **AS1** in an Azure region that doesn't support availability zones. AS1 was created with 2 fault domains and 5 update domains, and it contains three virtual machines that run a web application behind a load balancer. A standalone virtual machine named **VM5** runs in the same region.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un groupe à haute disponibilité nommé **AS1** dans une région Azure qui ne prend pas en charge les zones de disponibilité. AS1 a été créé avec 2 domaines d'erreur et 5 domaines de mise à jour, et il contient trois machines virtuelles qui exécutent une application web derrière un équilibreur de charge. Une machine virtuelle autonome nommée **VM5** s'exécute dans la même région.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "You can add VM5 to AS1 by updating the configuration of VM5.", fr: "Vous pouvez ajouter VM5 à AS1 en mettant à jour la configuration de VM5." } }
        - { id: b, text: { en: "During planned maintenance, only one update domain of AS1 is restarted at a time.", fr: "Lors d'une maintenance planifiée, un seul domaine de mise à jour d'AS1 est redémarré à la fois." } }
        - { id: c, text: { en: "AS1 keeps the application available if a whole datacenter of the region fails.", fr: "AS1 maintient l'application disponible si un centre de données entier de la région tombe en panne." } }
        - { id: d, text: { en: "You can raise the fault domain count of AS1 to 3 after its creation.", fr: "Vous pouvez porter le nombre de domaines d'erreur d'AS1 à 3 après sa création." } }
        - { id: e, text: { en: "Two or more VMs in AS1 are needed to meet the 99.95% VM SLA.", fr: "Au moins deux machines virtuelles dans AS1 sont nécessaires pour le contrat SLA de 99,95 %." } }
    answer: { optionIds: [ b, e ] }
    explanation:
      correct:
        en: "During planned maintenance, the platform restarts only one update domain at a time, so the VMs of the other update domains keep running. Microsoft recommends two or more VMs in an availability set to meet the 99.95% SLA."
        fr: "Lors d'une maintenance planifiée, la plateforme ne redémarre qu'un domaine de mise à jour à la fois : les machines virtuelles des autres domaines de mise à jour continuent de s'exécuter. Microsoft recommande au moins deux machines virtuelles dans un groupe à haute disponibilité pour atteindre le contrat SLA de 99,95 %."
      options:
        a:
          en: "A VM can be added to an availability set only when it is created. To place VM5 in AS1, you must delete VM5 and re-create it."
          fr: "Une machine virtuelle ne peut être ajoutée à un groupe à haute disponibilité qu'à sa création. Pour placer VM5 dans AS1, vous devez supprimer VM5 puis la recréer."
        c:
          en: "An availability set spreads VMs across racks (fault domains) of one datacenter. Protection against a datacenter failure requires availability zones."
          fr: "Un groupe à haute disponibilité répartit les machines virtuelles sur des racks (domaines d'erreur) d'un même centre de données. La protection contre la panne d'un centre de données exige des zones de disponibilité."
        d:
          en: "The fault domain and update domain counts of an availability set can't be changed after it is created."
          fr: "Les nombres de domaines d'erreur et de domaines de mise à jour d'un groupe à haute disponibilité ne peuvent pas être modifiés après sa création."
    references:
      - title: Availability sets overview
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
      - title: Change a VM's availability set by using Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/change-availability-set

  # ---------------------------------------------------------------- 5. apply (3.2.3)
  - id: az104-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys uses Azure Resource Mover to move a virtual machine named **VM-App2** and its dependent resources from the **East US** region to the **Canada Central** region. The resources are in a move collection, and all their dependencies are resolved.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Azure Resource Mover pour déplacer une machine virtuelle nommée **VM-App2** et ses ressources dépendantes de la région **East US** vers la région **Canada Central**. Les ressources sont dans une collection de déplacement et toutes leurs dépendances sont résolues.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When you prepare VM-App2, its data starts to replicate to Canada Central.", fr: "Lorsque vous préparez VM-App2, ses données commencent à être répliquées vers Canada Central." } }
        - { id: s2, text: { en: "When you commit the move, Resource Mover deletes the source VM-App2 in East US.", fr: "Lorsque vous validez le déplacement, Resource Mover supprime la machine VM-App2 source d'East US." } }
        - { id: s3, text: { en: "After you initiate the move and before you commit it, you can discard the move.", fr: "Après avoir lancé le déplacement et avant de le valider, vous pouvez l'abandonner." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: "Preparing a VM installs the replication agent and starts replicating its data to the target region. Initiating the move creates the resources in the target region; you can then commit the move or discard it. Committing doesn't delete anything in the source region; you delete the source resources yourself afterward."
        fr: "La préparation d'une machine virtuelle installe l'agent de réplication et commence à répliquer ses données vers la région cible. Le lancement du déplacement crée les ressources dans la région cible ; vous pouvez ensuite valider le déplacement ou l'abandonner. La validation ne supprime rien dans la région source : vous supprimez vous-même les ressources sources ensuite."
      options:
        s2:
          en: "After the commit, the source resources are in the Delete source pending state, and deleting them is a separate, optional step."
          fr: "Après la validation, les ressources sources sont dans l'état Delete source pending, et leur suppression est une étape distincte et facultative."
    references:
      - title: Move Azure VMs across regions with Azure Resource Mover
        url: https://learn.microsoft.com/en-us/azure/resource-mover/tutorial-move-region-virtual-machines

  # ---------------------------------------------------------------- 6. exam level (3.2.1)
  - id: az104-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has the following virtual machines in an Azure subscription:

        - **VM-Batch1**: an Azure Spot Virtual Machine that runs Linux. Its eviction policy is **Deallocate**, and its maximum price is **-1**.
        - **VM-Web1**: a pay-as-you-go Windows Server virtual machine of size Standard_D4ds_v5, with a Premium SSD OS disk and a Premium SSD data disk.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose des machines virtuelles suivantes dans un abonnement Azure :

        - **VM-Batch1** : une machine virtuelle Spot Azure qui exécute Linux. Sa stratégie d'éviction est **Deallocate** et son prix maximal est **-1**.
        - **VM-Web1** : une machine virtuelle Windows Server avec paiement à l'utilisation, de taille Standard_D4ds_v5, avec un disque du système d'exploitation SSD Premium et un disque de données SSD Premium.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Because its maximum price is -1, Azure never evicts VM-Batch1.", fr: "Comme son prix maximal est -1, Azure n'évince jamais VM-Batch1." } }
        - { id: b, text: { en: "After Azure evicts VM-Batch1, you still pay for the storage of its disks.", fr: "Après l'éviction de VM-Batch1 par Azure, vous payez toujours le stockage de ses disques." } }
        - { id: c, text: { en: "Shutting down VM-Web1 from inside Windows stops its compute charges.", fr: "L'arrêt de VM-Web1 depuis Windows met fin à ses frais de calcul." } }
        - { id: d, text: { en: "Running `az vm deallocate` for VM-Web1 stops its compute charges.", fr: "L'exécution de `az vm deallocate` pour VM-Web1 met fin à ses frais de calcul." } }
        - { id: e, text: { en: "VM-Batch1 gets the same SLA as a regular VM that uses Premium SSD disks.", fr: "VM-Batch1 bénéficie du même contrat SLA qu'une machine virtuelle normale avec des disques SSD Premium." } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: "With the Deallocate eviction policy, an evicted Spot VM moves to the Stopped (deallocated) state and its disks remain billed. For any VM, deallocation stops the compute charges, but the managed disks keep being billed because they still exist."
        fr: "Avec la stratégie d'éviction Deallocate, une machine virtuelle Spot évincée passe à l'état Arrêtée (libérée) et ses disques restent facturés. Pour toute machine virtuelle, la libération arrête les frais de calcul, mais les disques managés restent facturés puisqu'ils existent toujours."
      options:
        a:
          en: "A maximum price of -1 only prevents evictions for price reasons. Azure can still evict the VM, with 30 seconds' notice, when it needs the capacity back."
          fr: "Un prix maximal de -1 empêche seulement les évictions pour raison de prix. Azure peut toujours évincer la machine virtuelle, avec un préavis de 30 secondes, quand il a besoin de récupérer la capacité."
        c:
          en: "A shutdown from the guest operating system leaves the VM in the Stopped state, still allocated on its host, and compute is still billed."
          fr: "Un arrêt depuis le système d'exploitation invité laisse la machine virtuelle à l'état Arrêtée, toujours allouée sur son hôte, et le calcul reste facturé."
        e:
          en: "Spot VMs have no SLA and offer no high availability guarantee, whatever their disk type."
          fr: "Les machines virtuelles Spot n'ont aucun contrat SLA et n'offrent aucune garantie de haute disponibilité, quel que soit leur type de disque."
    references:
      - title: About Azure Spot Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
      - title: States and billing status of Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing

  # ---------------------------------------------------------------- 7. exam level (3.2.2)
  - id: az104-qz-32-07
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have an Azure subscription that contains a Windows Server virtual machine named **VM2** in the resource group **RG-App**. VM2 has the following configuration:

        - Region: **North Europe**
        - Size: Standard_D4s_v5
        - Disks: one OS disk and two data disks
        - Power state: **Stopped (deallocated)**
        - Encryption at host: not enabled

        The subscription contains one key vault, named **KV1**, in the **West Europe** region. KV1 is enabled for Azure Disk Encryption.

        You need to encrypt the OS volume and the data volumes of VM2 by using Azure Disk Encryption.

        How should you complete the script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un abonnement Azure qui contient une machine virtuelle Windows Server nommée **VM2** dans le groupe de ressources **RG-App**. VM2 a la configuration suivante :

        - Région : **North Europe**
        - Taille : Standard_D4s_v5
        - Disques : un disque du système d'exploitation et deux disques de données
        - État d'alimentation : **Arrêtée (libérée)**
        - Chiffrement sur l'hôte : non activé

        L'abonnement contient un seul coffre de clés, nommé **KV1**, dans la région **West Europe**. KV1 est activé pour Azure Disk Encryption.

        Vous devez chiffrer le volume du système d'exploitation et les volumes de données de VM2 avec Azure Disk Encryption.

        Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az vm [[state]] --resource-group RG-App --name VM2

        az keyvault create --name kv-ne-ade01 --resource-group RG-App \
          --location [[loc]] [[flag]]

        az vm encryption enable --resource-group RG-App --name VM2 \
          --disk-encryption-keyvault kv-ne-ade01 --volume-type [[vol]]
      slots:
        - id: state
          options:
            - { id: deallocate, text: deallocate }
            - { id: redeploy, text: redeploy }
            - { id: start, text: start }
            - { id: stop, text: stop }
        - id: loc
          options:
            - { id: westeurope, text: westeurope }
            - { id: northeurope, text: northeurope }
            - { id: francecentral, text: francecentral }
        - id: flag
          options:
            - { id: deploy, text: "--enabled-for-deployment" }
            - { id: template, text: "--enabled-for-template-deployment" }
            - { id: purge, text: "--enable-purge-protection" }
            - { id: disk, text: "--enabled-for-disk-encryption" }
        - id: vol
          options:
            - { id: os, text: OS }
            - { id: all, text: All }
            - { id: data, text: Data }
    answer:
      values: { state: start, loc: northeurope, flag: disk, vol: all }
    explanation:
      correct:
        en: "Azure Disk Encryption runs an extension inside the guest, so VM2 must be running first. The key vault must be in the same region and subscription as the VM, so KV1 (West Europe) can't be used and a new vault is created in North Europe with access enabled for disk encryption. The volume type All encrypts the OS volume and the data volumes."
        fr: "Azure Disk Encryption exécute une extension dans l'invité : VM2 doit donc d'abord être en cours d'exécution. Le coffre de clés doit être dans la même région et le même abonnement que la machine virtuelle : KV1 (West Europe) ne convient pas, et un nouveau coffre est créé en North Europe avec l'accès activé pour le chiffrement de disque. Le type de volume All chiffre le volume du système d'exploitation et les volumes de données."
      options:
        deallocate:
          en: "VM2 is already deallocated. Deallocation is a step of encryption at host, not of Azure Disk Encryption."
          fr: "VM2 est déjà libérée. La libération est une étape du chiffrement sur l'hôte, pas d'Azure Disk Encryption."
        westeurope:
          en: "A vault in West Europe is in another region than VM2; Azure Disk Encryption requires a vault in the region of the VM."
          fr: "Un coffre en West Europe est dans une autre région que VM2 ; Azure Disk Encryption exige un coffre dans la région de la machine virtuelle."
        deploy:
          en: "This flag lets Microsoft.Compute retrieve secrets, such as certificates, when it creates a VM. It doesn't enable Azure Disk Encryption."
          fr: "Cet indicateur permet à Microsoft.Compute de récupérer des secrets, comme des certificats, lors de la création d'une machine virtuelle. Il n'active pas Azure Disk Encryption."
        os:
          en: "The volume type OS encrypts only the OS volume, not the data volumes."
          fr: "Le type de volume OS ne chiffre que le volume du système d'exploitation, pas les volumes de données."
    references:
      - title: Creating and configuring a key vault for Azure Disk Encryption on a Windows VM
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-key-vault
      - title: Azure Disk Encryption scenarios on Windows VMs
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-windows

  # ---------------------------------------------------------------- 8. exam level (3.2.5)
  - id: az104-qz-32-08
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware runs Azure virtual machines in a region that supports availability zones. Litware has the disk requirements shown in the answer area.

        Which action should you perform for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute des machines virtuelles Azure dans une région qui prend en charge les zones de disponibilité. Litware a les exigences de disques indiquées dans la zone de réponse.

        Quelle action devez-vous effectuer pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correctes. Chaque action peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: img, text: { en: "Generalize VM-Ref1 and capture an image version in an Azure Compute Gallery", fr: "Généraliser VM-Ref1 et capturer une version d'image dans une galerie Azure Compute Gallery" } }
        - { id: snap, text: { en: "Create a snapshot of the disk", fr: "Créer un instantané du disque" } }
        - { id: zrs, text: { en: "Create a Premium SSD disk that uses zone-redundant storage (ZRS)", fr: "Créer un disque SSD Premium qui utilise le stockage redondant interzone (ZRS)" } }
        - { id: pv2, text: { en: "Create a Premium SSD v2 disk in the zone of VM-Sql1", fr: "Créer un disque SSD Premium v2 dans la zone de VM-Sql1" } }
        - { id: newdisk, text: { en: "Create a 512 GiB managed disk and copy the data to it", fr: "Créer un disque managé de 512 Gio et y copier les données" } }
        - { id: update, text: { en: "Run `az disk update` on the disk with `--size-gb 512`", fr: "Exécuter `az disk update` sur le disque avec `--size-gb 512`" } }
      targets:
        - { id: t1, text: { en: "Deploy 12 identical web servers from VM-Ref1, a fully configured Windows Server VM", fr: "Déployer 12 serveurs web identiques à partir de VM-Ref1, une machine virtuelle Windows Server entièrement configurée" } }
        - { id: t2, text: { en: "Keep a new database data disk usable from another VM if the zone that hosts VM-Sql1 fails", fr: "Garder un nouveau disque de données de base de données utilisable depuis une autre machine virtuelle si la zone qui héberge VM-Sql1 tombe en panne" } }
        - { id: t3, text: { en: "Bring a 2 TiB data disk that holds 300 GiB of data down to a provisioned size of 512 GiB", fr: "Ramener un disque de données de 2 Tio contenant 300 Gio de données à une taille provisionnée de 512 Gio" } }
        - { id: t4, text: { en: "Before patching VM-App1, keep a read-only, point-in-time copy of its OS disk that can be used to create a new disk", fr: "Avant d'appliquer des correctifs à VM-App1, conserver une copie en lecture seule, à un instant donné, de son disque du système d'exploitation, utilisable pour créer un nouveau disque" } }
    answer:
      mapping: { t1: img, t2: zrs, t3: newdisk, t4: snap }
    explanation:
      correct:
        en: "A generalized image version in an Azure Compute Gallery is the template for many identical VMs, whereas a snapshot is a read-only, point-in-time copy of a single disk from which a new disk can be created. A ZRS disk is replicated synchronously across three zones, so it can be attached to another VM after a zone failure. A managed disk can be expanded but never shrunk, so a smaller disk must be created and the data copied to it."
        fr: "Une version d'image généralisée dans une galerie Azure Compute Gallery est le modèle de nombreuses machines virtuelles identiques, alors qu'un instantané est une copie en lecture seule, à un instant donné, d'un seul disque, à partir de laquelle on peut créer un nouveau disque. Un disque ZRS est répliqué de façon synchrone sur trois zones : il peut être attaché à une autre machine virtuelle après la panne d'une zone. Un disque managé peut être étendu mais jamais réduit : il faut créer un disque plus petit et y copier les données."
      options:
        pv2:
          en: "Premium SSD v2 doesn't support ZRS; a disk in the zone of VM-Sql1 fails with that zone."
          fr: "Le SSD Premium v2 ne prend pas en charge ZRS ; un disque dans la zone de VM-Sql1 tombe avec cette zone."
        update:
          en: "`az disk update --size-gb` can only increase the size of a disk. Shrinking a managed disk isn't supported."
          fr: "`az disk update --size-gb` ne peut qu'augmenter la taille d'un disque. La réduction d'un disque managé n'est pas prise en charge."
    references:
      - title: Redundancy options for Azure managed disks
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-redundancy
      - title: Expand Virtual Hard Disks Attached to a Windows VM in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks

  # ---------------------------------------------------------------- 9. exam level (3.2.4)
  - id: az104-qz-32-09
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have an Azure subscription that contains the following virtual machines in the West Europe region.

        | Name | Size | Power state |
        | --- | --- | --- |
        | VM3 | Standard_D8s_v5 | Running |
        | VM4 | Standard_E8s_v5 | Running |
        | VM5 | Standard_E8s_v5 | Stopped (deallocated) |
        | VM6 | Standard_E4s_v5 | Running |

        The subscription has the following vCPU quotas in West Europe.

        | Quota | Current usage | Limit |
        | --- | --- | --- |
        | Total Regional vCPUs | 28 | 100 |
        | Standard DSv5 Family vCPUs | 8 | 20 |
        | Standard ESv5 Family vCPUs | 20 | 24 |

        You try to resize VM3 to Standard_E8s_v5, and the operation fails because of a vCPU quota. All four virtual machines must be kept.

        What should you do before you retry the resize?
      fr: |
        Vous disposez d'un abonnement Azure qui contient les machines virtuelles suivantes dans la région West Europe.

        | Nom | Taille | État d'alimentation |
        | --- | --- | --- |
        | VM3 | Standard_D8s_v5 | En cours d'exécution |
        | VM4 | Standard_E8s_v5 | En cours d'exécution |
        | VM5 | Standard_E8s_v5 | Arrêtée (libérée) |
        | VM6 | Standard_E4s_v5 | En cours d'exécution |

        L'abonnement a les quotas de processeurs virtuels suivants en West Europe.

        | Quota | Utilisation actuelle | Limite |
        | --- | --- | --- |
        | Total Regional vCPUs | 28 | 100 |
        | Standard DSv5 Family vCPUs | 8 | 20 |
        | Standard ESv5 Family vCPUs | 20 | 24 |

        Vous essayez de redimensionner VM3 en Standard_E8s_v5, et l'opération échoue à cause d'un quota de processeurs virtuels. Les quatre machines virtuelles doivent être conservées.

        Que devez-vous faire avant de relancer le redimensionnement ?
    body:
      options:
        - { id: a, text: { en: "Stop and deallocate VM4, and start it again after the resize of VM3.", fr: "Arrêter et libérer VM4, puis la redémarrer après le redimensionnement de VM3." } }
        - { id: b, text: { en: "Stop and deallocate VM3, and keep it deallocated during the resize.", fr: "Arrêter et libérer VM3, et la laisser libérée pendant le redimensionnement." } }
        - { id: c, text: { en: "Request an increase of the Total Regional vCPUs quota to 108.", fr: "Demander une augmentation du quota Total Regional vCPUs à 108." } }
        - { id: d, text: { en: "Request an increase of the Standard ESv5 Family vCPUs quota to 28.", fr: "Demander une augmentation du quota Standard ESv5 Family vCPUs à 28." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: "The ESv5 family already uses 20 vCPUs (VM4, VM5 and VM6), and quota counts deallocated VMs too. Resizing VM3 to Standard_E8s_v5 adds 8 ESv5 vCPUs, for 28, above the limit of 24, so the family quota must be raised to at least 28. The regional total doesn't change, because VM3 releases 8 DSv5 vCPUs."
        fr: "La famille ESv5 utilise déjà 20 processeurs virtuels (VM4, VM5 et VM6), et le quota compte aussi les machines virtuelles libérées. Redimensionner VM3 en Standard_E8s_v5 ajoute 8 processeurs virtuels ESv5, soit 28, au-delà de la limite de 24 : le quota de la famille doit passer à au moins 28. Le total régional ne change pas, car VM3 libère 8 processeurs virtuels DSv5."
      options:
        a:
          en: "Quota is calculated on the cores of both allocated and deallocated VMs, so deallocating VM4 doesn't free any ESv5 quota."
          fr: "Le quota est calculé sur les cœurs des machines virtuelles allouées comme libérées : libérer VM4 ne libère aucun quota ESv5."
        b:
          en: "Deallocating VM3 makes more sizes available when the hardware cluster lacks the size; it doesn't change the vCPUs that VM3 counts against the quota."
          fr: "Libérer VM3 rend plus de tailles disponibles quand le cluster matériel ne propose pas la taille ; cela ne change pas les processeurs virtuels que VM3 compte dans le quota."
        c:
          en: "The regional usage stays at 28 of 100 after the resize. The limit that blocks the resize is the ESv5 family quota."
          fr: "L'utilisation régionale reste à 28 sur 100 après le redimensionnement. La limite qui bloque le redimensionnement est le quota de la famille ESv5."
    references:
      - title: vCPU quotas
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
      - title: Increase VM-family vCPU quotas
        url: https://learn.microsoft.com/en-us/azure/quotas/per-vm-quota-requests

  # ---------------------------------------------------------------- 10. exam level (3.2.7)
  - id: az104-qz-32-10
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        You have a Virtual Machine Scale Set named **VMSS1** that uses Uniform orchestration and spans availability zones 1, 2, and 3. The scale-in policy of VMSS1 is **OldestVM**. The instance IDs of VMSS1 were assigned in creation order.

        VMSS1 contains the instances shown in the following table. Autoscale removes one instance from VMSS1 and later removes a second instance. No instance is added in between.

        Answer each prompt by selecting the appropriate instance.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un groupe de machines virtuelles identiques nommé **VMSS1** qui utilise l'orchestration Uniform et s'étend sur les zones de disponibilité 1, 2 et 3. La stratégie de scale-in de VMSS1 est **OldestVM**. Les ID d'instance de VMSS1 ont été attribués dans l'ordre de création.

        VMSS1 contient les instances indiquées dans le tableau suivant. La mise à l'échelle automatique retire une instance de VMSS1, puis retire plus tard une deuxième instance. Aucune instance n'est ajoutée entre-temps.

        Répondez à chaque consigne en sélectionnant l'instance appropriée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "Which instance is removed first?", fr: "Quelle instance est retirée en premier ?" } }
        - { id: p2, text: { en: "Which instance is removed second?", fr: "Quelle instance est retirée en deuxième ?" } }
      grid:
        header: [{ en: "Instance ID", fr: "ID d'instance" }, { en: "Zone", fr: "Zone" }, Protect from scale-in]
        rows:
          - [{ text: "0", area: i0 }, { text: "1" }, { text: { en: "Yes", fr: "Oui" } }]
          - [{ text: "1", area: i1 }, { text: "2" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "3", area: i3 }, { text: "3" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "4", area: i4 }, { text: "1" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "5", area: i5 }, { text: "2" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "6", area: i6 }, { text: "3" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "7", area: i7 }, { text: "1" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "8", area: i8 }, { text: "2" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "9", area: i9 }, { text: "3" }, { text: { en: "No", fr: "Non" } }]
          - [{ text: "10", area: i10 }, { text: "3" }, { text: { en: "No", fr: "Non" } }]
    answer:
      values: { p1: i3, p2: i1 }
    explanation:
      correct:
        en: "In a zone-spanning scale set, scale-in first balances the zones, then applies the scale-in policy. Zone 3 has four instances and zones 1 and 2 have three, so the first removal is the oldest instance of zone 3, instance 3. The zones are then balanced, so OldestVM picks the oldest instance of the scale set; instance 0 is protected from scale-in and is skipped, so instance 1 is removed."
        fr: "Dans un groupe identique réparti sur plusieurs zones, le scale-in équilibre d'abord les zones, puis applique la stratégie de scale-in. La zone 3 a quatre instances et les zones 1 et 2 en ont trois : le premier retrait est l'instance la plus ancienne de la zone 3, l'instance 3. Les zones sont alors équilibrées, et OldestVM choisit l'instance la plus ancienne du groupe identique ; l'instance 0 est protégée contre le scale-in et ignorée : l'instance 1 est retirée."
      options:
        i0:
          en: "Instance 0 is the oldest, but an instance protected from scale-in is never removed by an autoscale scale-in, whatever the policy."
          fr: "L'instance 0 est la plus ancienne, mais une instance protégée contre le scale-in n'est jamais retirée par un scale-in de la mise à l'échelle automatique, quelle que soit la stratégie."
        i10:
          en: "Instance 10 is the newest instance; it would be chosen in zone 3 only with the NewestVM policy."
          fr: "L'instance 10 est la plus récente ; elle ne serait choisie dans la zone 3 qu'avec la stratégie NewestVM."
    references:
      - title: Use scale-in policies with Azure Virtual Machine Scale Sets
        url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-scale-in-policy
      - title: Instance Protection for Azure Virtual Machine Scale Set instances
        url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-instance-protection
