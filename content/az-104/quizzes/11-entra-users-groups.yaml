chapter: 11-entra-users-groups
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans to create security groups whose membership is calculated automatically from the **department** attribute of users.

        What is the minimum licensing that Adatum needs for this feature?
      fr: |
        Adatum prévoit de créer des groupes de sécurité dont l'appartenance est calculée automatiquement à partir de l'attribut **department** des utilisateurs.

        Quelle est la licence minimale dont Adatum a besoin pour cette fonctionnalité ?
    body:
      options:
        - { id: a, text: { en: "No license: Microsoft Entra ID Free includes dynamic membership", fr: "Aucune licence : Microsoft Entra ID Free inclut l'appartenance dynamique" } }
        - { id: b, text: { en: "Microsoft Entra ID P1, for each user who is a member of a dynamic group", fr: "Microsoft Entra ID P1, pour chaque utilisateur membre d'un groupe dynamique" } }
        - { id: c, text: { en: "Microsoft Entra ID P2, for each user who is a member of a dynamic group", fr: "Microsoft Entra ID P2, pour chaque utilisateur membre d'un groupe dynamique" } }
        - { id: d, text: { en: "Microsoft Entra ID P1, only for the administrator who creates the groups", fr: "Microsoft Entra ID P1, uniquement pour l'administrateur qui crée les groupes" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Dynamic membership groups require Microsoft Entra ID P1 (or higher). The organization must have enough licenses to cover every unique user who is a member of one or more dynamic groups."
        fr: "Les groupes d'appartenance dynamique exigent Microsoft Entra ID P1 (ou supérieur). L'organisation doit disposer d'assez de licences pour couvrir chaque utilisateur unique membre d'un ou de plusieurs groupes dynamiques."
      options:
        a: { en: "The Free edition includes users, groups and guests, but not dynamic membership.", fr: "L'édition Free inclut les utilisateurs, les groupes et les invités, mais pas l'appartenance dynamique." }
        c: { en: "P2 includes dynamic membership, but it isn't the minimum: P1 is enough.", fr: "P2 inclut l'appartenance dynamique, mais ce n'est pas le minimum : P1 suffit." }
        d: { en: "The licenses are counted on the members of dynamic groups, not on the administrator who creates them.", fr: "Les licences se comptent sur les membres des groupes dynamiques, pas sur l'administrateur qui les crée." }
    references:
      - title: Manage rules for dynamic membership groups in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership

  # ------------------------------------------------------------------ 2
  - id: az104-qz-11-02
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso invites **zoe@northwindmail.com** as a B2B guest user. The domain northwindmail.com isn't associated with any Microsoft Entra tenant, Zoe has no Microsoft account, and Contoso hasn't configured federation with any identity provider. Contoso uses the default settings.

        How will Zoe authenticate when she redeems the invitation?
      fr: |
        Contoso invite **zoe@northwindmail.com** en tant qu'utilisateur invité B2B. Le domaine northwindmail.com n'est associé à aucun locataire Microsoft Entra, Zoe n'a pas de compte Microsoft et Contoso n'a configuré de fédération avec aucun fournisseur d'identité. Contoso utilise les paramètres par défaut.

        Comment Zoe s'authentifiera-t-elle lorsqu'elle acceptera l'invitation ?
    body:
      options:
        - { id: a, text: { en: "With a one-time passcode sent to her email address", fr: "Avec un code secret à usage unique envoyé à son adresse e-mail" } }
        - { id: b, text: { en: "With a temporary password that the inviter enters in the invitation", fr: "Avec un mot de passe temporaire que l'inviteur saisit dans l'invitation" } }
        - { id: c, text: { en: "With a code sent by SMS to a phone number entered in the invitation", fr: "Avec un code envoyé par SMS à un numéro de téléphone saisi dans l'invitation" } }
        - { id: d, text: { en: "With a password that she creates in the Contoso tenant during redemption", fr: "Avec un mot de passe qu'elle crée dans le locataire Contoso lors de l'acceptation" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: "Email one-time passcode is turned on by default. It is the fallback method when the guest has no Microsoft Entra account, no Microsoft account and no federated identity provider: Zoe receives a code by email and enters it to sign in."
        fr: "Le code secret à usage unique par e-mail est activé par défaut. C'est la méthode de repli lorsque l'invité n'a ni compte Microsoft Entra, ni compte Microsoft, ni fournisseur d'identité fédéré : Zoe reçoit un code par e-mail et le saisit pour se connecter."
      options:
        b: { en: "A guest account has no credentials in the host tenant; the inviter never sets a password for it.", fr: "Un compte invité n'a aucune information d'identification dans le locataire hôte ; l'inviteur ne lui définit jamais de mot de passe." }
        c: { en: "The B2B invitation contains an email address, not a phone number; the passcode is sent by email.", fr: "L'invitation B2B contient une adresse e-mail, pas un numéro de téléphone ; le code est envoyé par e-mail." }
        d: { en: "Authentication is performed by the guest's identity provider or by passcode, never with a password stored in the host tenant.", fr: "L'authentification est réalisée par le fournisseur d'identité de l'invité ou par code secret, jamais avec un mot de passe stocké dans le locataire hôte." }
    references:
      - title: Email one-time passcode authentication
        url: https://learn.microsoft.com/en-us/entra/external-id/one-time-passcode

  # ------------------------------------------------------------------ 3
  - id: az104-qz-11-03
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a Microsoft Entra tenant. A service desk technician named **Tom** must assign and remove product licenses on user accounts.

        You need to grant Tom the required access by following the principle of least privilege.

        Which role should you assign to Tom?
      fr: |
        Fabrikam dispose d'un locataire Microsoft Entra. Un technicien du centre de services nommé **Tom** doit attribuer et retirer des licences de produits sur des comptes d'utilisateurs.

        Vous devez accorder à Tom l'accès nécessaire en respectant le principe du moindre privilège.

        Quel rôle devez-vous attribuer à Tom ?
    body:
      options:
        - { id: a, text: User Administrator }
        - { id: b, text: Billing Administrator }
        - { id: c, text: License Administrator }
        - { id: d, text: Helpdesk Administrator }
    answer: { optionId: c }
    explanation:
      correct:
        en: "License Administrator is the least privileged Microsoft Entra role to assign and revoke licenses on users. It doesn't allow creating users or resetting passwords."
        fr: "License Administrator est le rôle Microsoft Entra le moins privilégié pour attribuer et révoquer des licences sur des utilisateurs. Il ne permet ni de créer des utilisateurs ni de réinitialiser des mots de passe."
      options:
        a: { en: "User Administrator can assign licenses, but it also creates and manages users and resets passwords: it grants more than Tom needs.", fr: "User Administrator peut attribuer des licences, mais il crée et gère aussi des utilisateurs et réinitialise des mots de passe : il accorde plus que ce dont Tom a besoin." }
        b: { en: "Billing Administrator performs billing tasks such as updating payment information; it isn't the role for assigning licenses to users.", fr: "Billing Administrator effectue des tâches de facturation comme la mise à jour des informations de paiement ; ce n'est pas le rôle d'attribution des licences aux utilisateurs." }
        d: { en: "Helpdesk Administrator resets passwords of non-administrators; it doesn't manage licenses.", fr: "Helpdesk Administrator réinitialise les mots de passe des non-administrateurs ; il ne gère pas les licences." }
    references:
      - title: Least privileged roles by task
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/delegate-by-task
      - title: Microsoft Entra built-in roles
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference

  # ------------------------------------------------------------------ 4
  - id: az104-qz-11-04
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a cloud-only Microsoft Entra tenant licensed with Microsoft Entra ID P1. The security group **GRP-Sales** has the **Dynamic User** membership type and the rule `user.department -eq "Sales"`.

        A new salesperson named **Ravi** must become a member of GRP-Sales. The **Department** property of Ravi is empty, and the **Add members** option of GRP-Sales is unavailable. The membership of GRP-Sales must remain automatic.

        What should you do?
      fr: |
        Litware dispose d'un locataire Microsoft Entra uniquement cloud avec des licences Microsoft Entra ID P1. Le groupe de sécurité **GRP-Sales** a le type d'appartenance **Dynamic User** et la règle `user.department -eq "Sales"`.

        Un nouveau commercial nommé **Ravi** doit devenir membre de GRP-Sales. La propriété **Department** de Ravi est vide et l'option **Add members** de GRP-Sales n'est pas disponible. L'appartenance de GRP-Sales doit rester automatique.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Ravi as an owner of GRP-Sales.", fr: "Ajouter Ravi comme propriétaire de GRP-Sales." } }
        - { id: b, text: { en: "Set the Department property of Ravi to Sales.", fr: "Définir la propriété Department de Ravi sur Sales." } }
        - { id: c, text: { en: "Select Ravi on the Validate Rules tab of GRP-Sales.", fr: "Sélectionner Ravi dans l'onglet Validate Rules de GRP-Sales." } }
        - { id: d, text: { en: "Change the membership type of GRP-Sales to Assigned.", fr: "Changer le type d'appartenance de GRP-Sales en Affecté." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Members can't be added or removed by hand in a dynamic membership group: the rule decides. Ravi is cloud-only, so you can set his Department to Sales in Microsoft Entra ID, and the group adds him when the rule is processed."
        fr: "On ne peut pas ajouter ni retirer de membres à la main dans un groupe d'appartenance dynamique : c'est la règle qui décide. Ravi est uniquement cloud ; vous pouvez donc définir son service sur Sales dans Microsoft Entra ID, et le groupe l'ajoute lors du traitement de la règle."
      options:
        a: { en: "Owners manage a group; being an owner doesn't make Ravi a member, and the rule still excludes him.", fr: "Les propriétaires gèrent un groupe ; être propriétaire ne fait pas de Ravi un membre, et la règle l'exclut toujours." }
        c: { en: "Validate Rules only shows whether selected users match the rule; it doesn't change the membership.", fr: "Validate Rules indique seulement si les utilisateurs sélectionnés correspondent à la règle ; il ne modifie pas l'appartenance." }
        d: { en: "An Assigned group would accept Ravi, but its membership would no longer be automatic.", fr: "Un groupe Affecté accepterait Ravi, mais son appartenance ne serait plus automatique." }
    references:
      - title: Manage rules for dynamic membership groups in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
      - title: Validate rules for dynamic membership groups
        url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-rule-validation

  # ------------------------------------------------------------------ 5
  - id: az104-qz-11-05
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank synchronizes its on-premises AD DS domain to Microsoft Entra ID by using Microsoft Entra Connect. Self-service password reset (SSPR) is enabled for all users and password writeback is enabled.

        Users who mistype their password several times are locked out of AD DS. They remember their password and must be able to regain access by using SSPR while keeping their current password.

        What should you configure?
      fr: |
        Woodgrove Bank synchronise son domaine AD DS local avec Microsoft Entra ID à l'aide de Microsoft Entra Connect. La réinitialisation de mot de passe en libre-service (SSPR) est activée pour tous les utilisateurs et la réécriture du mot de passe est activée.

        Les utilisateurs qui se trompent plusieurs fois de mot de passe sont verrouillés dans AD DS. Ils se souviennent de leur mot de passe et doivent pouvoir retrouver l'accès avec SSPR tout en conservant leur mot de passe actuel.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "In Password reset > Registration, set Require users to register when signing in to Yes.", fr: "Dans Password reset > Registration, définir Require users to register when signing in sur Yes." } }
        - { id: b, text: { en: "In Authentication methods > Password protection, reduce the smart lockout duration.", fr: "Dans Authentication methods > Password protection, réduire la durée du verrouillage intelligent." } }
        - { id: c, text: { en: "In Password reset > Authentication methods, set the number of methods required to 1.", fr: "Dans Password reset > Authentication methods, définir le nombre de méthodes requises sur 1." } }
        - { id: d, text: { en: "In Password reset > On-premises integration, allow users to unlock accounts without resetting their password.", fr: "Dans Password reset > On-premises integration, autoriser les utilisateurs à déverrouiller leur compte sans réinitialiser leur mot de passe." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: "By default, SSPR unlocks an account only as part of a password reset. Setting Allow users to unlock accounts without resetting their password to Yes, on the On-premises integration page, lets users choose to unlock their AD DS account and keep their current password."
        fr: "Par défaut, SSPR ne déverrouille un compte que lors d'une réinitialisation de mot de passe. Définir Allow users to unlock accounts without resetting their password sur Yes, dans la page On-premises integration, permet aux utilisateurs de déverrouiller leur compte AD DS en conservant leur mot de passe actuel."
      options:
        a: { en: "Registration at sign-in makes users register their methods; it doesn't change what SSPR does with a locked-out account.", fr: "L'inscription à la connexion oblige les utilisateurs à inscrire leurs méthodes ; elle ne change pas ce que fait SSPR d'un compte verrouillé." }
        b: { en: "Smart lockout protects Microsoft Entra sign-ins; it doesn't unlock accounts locked out in AD DS.", fr: "Le verrouillage intelligent protège les connexions Microsoft Entra ; il ne déverrouille pas les comptes verrouillés dans AD DS." }
        c: { en: "The number of methods changes how users prove their identity, not whether they must choose a new password.", fr: "Le nombre de méthodes change la façon dont les utilisateurs prouvent leur identité, pas l'obligation de choisir un nouveau mot de passe." }
    references:
      - title: Self-service password reset deep dive
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks

  # ------------------------------------------------------------------ 6
  - id: az104-qz-11-06
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a Microsoft Entra tenant whose initial domain is **contoso.onmicrosoft.com**. Fabrikam, a partner, uses its own Microsoft Entra tenant. Contoso uses the default external collaboration settings.

        You invite **kim@fabrikam.com** as a B2B guest user from the Microsoft Entra admin center. Next year, Kim will join Contoso as an employee and must then have the default directory permissions of a Contoso member.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un locataire Microsoft Entra dont le domaine initial est **contoso.onmicrosoft.com**. Fabrikam, un partenaire, utilise son propre locataire Microsoft Entra. Contoso utilise les paramètres de collaboration externe par défaut.

        Vous invitez **kim@fabrikam.com** en tant qu'utilisateur invité B2B depuis le Centre d'administration Microsoft Entra. L'an prochain, Kim rejoindra Contoso comme employée et devra alors disposer des autorisations par défaut d'un membre de Contoso sur l'annuaire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Kim's account appears in the Contoso directory only after Kim redeems the invitation.", fr: "Le compte de Kim n'apparaît dans l'annuaire de Contoso qu'après l'acceptation de l'invitation par Kim." }
        - id: s2
          text: { en: "After redemption, Kim signs in to Contoso resources with a password stored in the Contoso tenant.", fr: "Après l'acceptation, Kim se connecte aux ressources de Contoso avec un mot de passe stocké dans le locataire Contoso." }
        - id: s3
          text: { en: "When Kim joins Contoso, you can give her the member permissions by changing the User type of her existing account to Member.", fr: "Quand Kim rejoindra Contoso, vous pourrez lui donner les autorisations d'un membre en changeant le type d'utilisateur de son compte existant en Member." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: "The guest account is created in the Contoso directory as soon as the invitation is sent, with the invitation state Pending acceptance. It has no credentials in Contoso: Kim authenticates with her Fabrikam account. User type is a property that can be changed from Guest to Member when the relationship of the user to the organization changes."
        fr: "Le compte invité est créé dans l'annuaire de Contoso dès l'envoi de l'invitation, avec l'état d'invitation Acceptation en attente. Il n'a aucune information d'identification dans Contoso : Kim s'authentifie avec son compte Fabrikam. Le type d'utilisateur est une propriété qui peut passer de Guest à Member quand la relation de l'utilisateur avec l'organisation change."
      options:
        s1: { en: "No. The account exists as soon as the invitation is sent, in the Pending acceptance state; redemption only completes it.", fr: "Non. Le compte existe dès l'envoi de l'invitation, à l'état Acceptation en attente ; l'acceptation ne fait que le compléter." }
        s2: { en: "No. Kim's identity provider is her Fabrikam tenant; the guest object has no password.", fr: "Non. Le fournisseur d'identité de Kim est son locataire Fabrikam ; l'objet invité n'a pas de mot de passe." }
    references:
      - title: B2B guest user properties
        url: https://learn.microsoft.com/en-us/entra/external-id/user-properties

  # ------------------------------------------------------------------ 7
  - id: az104-qz-11-07
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. You must create four groups that meet the following requirements. None of the groups needs Microsoft Entra roles.

        Which group configuration should you use for each group? To answer, drag the appropriate configurations to the correct groups. Each configuration may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. Vous devez créer quatre groupes qui répondent aux exigences suivantes. Aucun de ces groupes n'a besoin de rôles Microsoft Entra.

        Quelle configuration de groupe devez-vous utiliser pour chaque groupe ? Pour répondre, faites glisser les configurations appropriées vers les groupes correspondants. Chaque configuration peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: secassigned, text: { en: "Security group, Assigned membership", fr: "Groupe de sécurité, appartenance Affecté" } }
        - { id: secdynuser, text: { en: "Security group, Dynamic User membership", fr: "Groupe de sécurité, appartenance Dynamic User" } }
        - { id: secdyndevice, text: { en: "Security group, Dynamic Device membership", fr: "Groupe de sécurité, appartenance Dynamic Device" } }
        - { id: m365assigned, text: { en: "Microsoft 365 group, Assigned membership", fr: "Groupe Microsoft 365, appartenance Affecté" } }
        - { id: m365dynuser, text: { en: "Microsoft 365 group, Dynamic User membership", fr: "Groupe Microsoft 365, appartenance Dynamic User" } }
      targets:
        - id: t1
          text: { en: "GRP-App1: contains three administrators and the service principal of the application App1, so that one Azure role assignment covers all of them", fr: "GRP-App1 : contient trois administrateurs et le principal de service de l'application App1, pour qu'une seule attribution de rôle Azure les couvre tous" }
        - id: t2
          text: { en: "GRP-Marketing: every user whose department is Marketing, kept up to date automatically, with a shared mailbox and a SharePoint site", fr: "GRP-Marketing : tous les utilisateurs dont le service est Marketing, mis à jour automatiquement, avec une boîte aux lettres partagée et un site SharePoint" }
        - id: t3
          text: { en: "GRP-France: contains the existing security groups GRP-Lyon and GRP-Paris, so that an Azure role assignment made to GRP-France applies to their members", fr: "GRP-France : contient les groupes de sécurité existants GRP-Lyon et GRP-Paris, pour qu'une attribution de rôle Azure faite à GRP-France s'applique à leurs membres" }
        - id: t4
          text: { en: "GRP-LicFR: every user whose usage location is FR, kept up to date automatically, used only for group-based licensing, without any mailbox or SharePoint site", fr: "GRP-LicFR : tous les utilisateurs dont l'emplacement d'utilisation est FR, mis à jour automatiquement, utilisé uniquement pour les licences basées sur les groupes, sans boîte aux lettres ni site SharePoint" }
    answer:
      mapping: { t1: secassigned, t2: m365dynuser, t3: secassigned, t4: secdynuser }
    explanation:
      correct:
        en: "A security group can contain users, devices, service principals and other groups, but dynamic rules only add users or devices: a service principal or a nested group needs Assigned membership (GRP-App1, GRP-France). Only a Microsoft 365 group comes with a mailbox and a SharePoint site, and it supports Dynamic User membership (GRP-Marketing). GRP-LicFR needs automatic user membership without collaboration resources: a Dynamic User security group."
        fr: "Un groupe de sécurité peut contenir des utilisateurs, des appareils, des principaux de service et d'autres groupes, mais les règles dynamiques n'ajoutent que des utilisateurs ou des appareils : un principal de service ou un groupe imbriqué exige l'appartenance Affecté (GRP-App1, GRP-France). Seul un groupe Microsoft 365 s'accompagne d'une boîte aux lettres et d'un site SharePoint, et il prend en charge l'appartenance Dynamic User (GRP-Marketing). GRP-LicFR exige une appartenance automatique d'utilisateurs sans ressources de collaboration : un groupe de sécurité Dynamic User."
      options:
        m365assigned: { en: "A Microsoft 365 group contains users only, so it can't hold a service principal or other groups, and Assigned membership isn't automatic.", fr: "Un groupe Microsoft 365 ne contient que des utilisateurs : il ne peut accueillir ni principal de service ni autres groupes, et l'appartenance Affecté n'est pas automatique." }
        secdyndevice: { en: "Dynamic Device rules add devices only; none of the four groups is made of devices.", fr: "Les règles Dynamic Device n'ajoutent que des appareils ; aucun des quatre groupes n'est constitué d'appareils." }
    references:
      - title: Learn About Groups, Group Membership, and Access
        url: https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups

  # ------------------------------------------------------------------ 8
  - id: az104-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders assigns an Office 365 E3 license, with all its service plans, to the security group **LIC-O365E3**. During an earlier pilot, 12 members of LIC-O365E3 received an Office 365 E1 license by direct assignment.

        On the **Errors & issues** tab of Office 365 E3, the 12 users show the error **Conflicting service plans**. All the other members of LIC-O365E3 received the license. Enough licenses are available.

        You need to ensure that the 12 users receive every service of Office 365 E3 through LIC-O365E3. The solution must minimize the number of licenses consumed.

        What should you do?
      fr: |
        Northwind Traders attribue une licence Office 365 E3, avec tous ses plans de service, au groupe de sécurité **LIC-O365E3**. Lors d'un pilote antérieur, 12 membres de LIC-O365E3 ont reçu une licence Office 365 E1 par attribution directe.

        Dans l'onglet **Errors & issues** d'Office 365 E3, les 12 utilisateurs affichent l'erreur **Conflicting service plans**. Tous les autres membres de LIC-O365E3 ont reçu la licence. Assez de licences sont disponibles.

        Vous devez faire en sorte que les 12 utilisateurs reçoivent tous les services d'Office 365 E3 par LIC-O365E3. La solution doit réduire au minimum le nombre de licences consommées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Reprocess for LIC-O365E3 without changing the licenses of the 12 users.", fr: "Sélectionner Retraiter (Reprocess) pour LIC-O365E3 sans modifier les licences des 12 utilisateurs." } }
        - { id: b, text: { en: "Turn off Exchange Online (Plan 2) in the Office 365 E3 assignment of LIC-O365E3.", fr: "Désactiver Exchange Online (Plan 2) dans l'attribution d'Office 365 E3 de LIC-O365E3." } }
        - { id: c, text: { en: "Remove the direct Office 365 E1 licenses of the 12 users, and then reprocess them.", fr: "Retirer les licences Office 365 E1 directes des 12 utilisateurs, puis les retraiter." } }
        - { id: d, text: { en: "Assign Office 365 E3 directly to the 12 users, and keep their E1 licenses.", fr: "Attribuer directement Office 365 E3 aux 12 utilisateurs, en conservant leurs licences E1." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "Office 365 E1 and E3 contain service plans that can't be assigned together, such as Exchange Online (Plan 1) and Exchange Online (Plan 2), so group-based licensing can't apply E3 to these users. Removing the redundant direct E1 license removes the cause and frees 12 licenses; reprocessing then applies the E3 license inherited from the group."
        fr: "Office 365 E1 et E3 contiennent des plans de service qui ne peuvent pas être attribués ensemble, comme Exchange Online (Plan 1) et Exchange Online (Plan 2) ; les licences basées sur les groupes ne peuvent donc pas appliquer E3 à ces utilisateurs. Retirer la licence E1 directe redondante supprime la cause et libère 12 licences ; le retraitement applique ensuite la licence E3 héritée du groupe."
      options:
        a: { en: "Reprocessing without fixing the cause produces the same conflict.", fr: "Retraiter sans corriger la cause produit le même conflit." }
        b: { en: "Disabling a plan of E3 would resolve the conflict, but the users wouldn't receive every E3 service and would still consume an E1 license.", fr: "Désactiver un plan d'E3 résoudrait le conflit, mais les utilisateurs ne recevraient pas tous les services d'E3 et consommeraient toujours une licence E1." }
        d: { en: "The conflict comes from the service plans, not from the assignment method: a direct E3 conflicts with E1 too, and the users must receive E3 through the group.", fr: "Le conflit vient des plans de service, pas de la méthode d'attribution : un E3 direct est lui aussi en conflit avec E1, et les utilisateurs doivent recevoir E3 par le groupe." }
    references:
      - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses

  # ------------------------------------------------------------------ 9
  - id: az104-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Litware has a cloud-only Microsoft Entra tenant licensed with Microsoft Entra ID P1. Self-service password reset (SSPR) is currently disabled. The tenant contains two security groups named **HR-Staff** and **Sales-Staff**.

        You need to configure SSPR to meet the following requirements:

        - SSPR must be available to the members of HR-Staff and Sales-Staff only, including users added to these groups later.
        - Users who haven't registered must be prompted to register when they sign in.
        - Once registered, users must never be asked to confirm their authentication information again.
        - Administrative effort must be minimized.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un locataire Microsoft Entra uniquement cloud avec des licences Microsoft Entra ID P1. La réinitialisation de mot de passe en libre-service (SSPR) est actuellement désactivée. Le locataire contient deux groupes de sécurité nommés **HR-Staff** et **Sales-Staff**.

        Vous devez configurer SSPR pour répondre aux exigences suivantes :

        - SSPR doit être disponible uniquement pour les membres de HR-Staff et de Sales-Staff, y compris les utilisateurs ajoutés plus tard à ces groupes.
        - Les utilisateurs qui ne se sont pas inscrits doivent être invités à s'inscrire lors de leur connexion.
        - Une fois inscrits, les utilisateurs ne doivent plus jamais être invités à confirmer leurs informations d'authentification.
        - L'effort d'administration doit être réduit au minimum.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Properties > Self service password reset enabled: [[scope]]

          Group selected on the Properties page: [[group]]

          Registration > Require users to register when signing in: Yes

          Registration > Number of days before users are asked to reconfirm their authentication information: [[days]]
        fr: |
          Properties > Self service password reset enabled : [[scope]]

          Groupe sélectionné dans la page Properties : [[group]]

          Registration > Require users to register when signing in : Yes

          Registration > Number of days before users are asked to reconfirm their authentication information : [[days]]
      slots:
        - id: scope
          options:
            - { id: none, text: None }
            - { id: selected, text: Selected }
            - { id: all, text: All }
        - id: group
          options:
            - { id: hr, text: HR-Staff }
            - { id: nested, text: { en: "A new security group that has HR-Staff and Sales-Staff as members", fr: "Un nouveau groupe de sécurité dont HR-Staff et Sales-Staff sont membres" } }
            - { id: m365, text: { en: "A new Microsoft 365 group that has HR-Staff and Sales-Staff as members", fr: "Un nouveau groupe Microsoft 365 dont HR-Staff et Sales-Staff sont membres" } }
            - { id: dyn, text: { en: "A new Dynamic User group that has the rule user.userType -eq \"Member\"", fr: "Un nouveau groupe Dynamic User avec la règle user.userType -eq \"Member\"" } }
        - id: days
          options:
            - { id: d0, text: "0" }
            - { id: d90, text: "90" }
            - { id: d180, text: "180" }
            - { id: d730, text: "730" }
    answer:
      values: { scope: selected, group: nested, days: d0 }
    explanation:
      correct:
        en: "The Selected scope accepts only one group in the admin center, but nested groups are supported: a security group whose members are HR-Staff and Sales-Staff covers both groups and their future members. The reconfirmation interval ranges from 0 to 730 days, and 0 means that users are never asked to confirm their information again; this setting requires registration at sign-in, which is enabled."
        fr: "L'étendue Selected n'accepte qu'un groupe dans le Centre d'administration, mais les groupes imbriqués sont pris en charge : un groupe de sécurité dont HR-Staff et Sales-Staff sont membres couvre les deux groupes et leurs futurs membres. L'intervalle de reconfirmation va de 0 à 730 jours, et 0 signifie que les utilisateurs ne sont plus jamais invités à confirmer leurs informations ; ce paramètre exige l'inscription à la connexion, qui est activée."
      options:
        all: { en: "All would enable SSPR for every user of the tenant, not only the two groups.", fr: "All activerait SSPR pour tous les utilisateurs du locataire, pas seulement pour les deux groupes." }
        hr: { en: "Selecting HR-Staff alone leaves the members of Sales-Staff out of scope.", fr: "Sélectionner HR-Staff seul laisse les membres de Sales-Staff hors de l'étendue." }
        m365: { en: "A Microsoft 365 group contains users only; it can't have other groups as members.", fr: "Un groupe Microsoft 365 ne contient que des utilisateurs ; il ne peut pas avoir d'autres groupes comme membres." }
        dyn: { en: "This rule matches every member user of the tenant, not only the members of the two groups.", fr: "Cette règle inclut tous les utilisateurs membres du locataire, pas seulement les membres des deux groupes." }
        d730: { en: "730 days is the maximum interval, not never: users would be asked again after two years.", fr: "730 jours est l'intervalle maximal, pas jamais : les utilisateurs seraient à nouveau sollicités après deux ans." }
    references:
      - title: Enable Microsoft Entra self-service password reset
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
      - title: Self-service password reset deep dive
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks

  # ------------------------------------------------------------------ 10
  - id: az104-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Proseware has a Microsoft Entra tenant whose location is France. A Microsoft 365 E5 license is assigned to the security group **LIC-E5**. The security group **TEAM-NE** is a member of LIC-E5. Enough E5 licenses are available, and E5 is available in every usage location used by Proseware.

        The users are configured as shown in the following table.

        Answer each prompt by selecting the appropriate user.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un locataire Microsoft Entra dont l'emplacement est la France. Une licence Microsoft 365 E5 est attribuée au groupe de sécurité **LIC-E5**. Le groupe de sécurité **TEAM-NE** est membre de LIC-E5. Assez de licences E5 sont disponibles, et E5 est disponible dans tous les emplacements d'utilisation de Proseware.

        Les utilisateurs sont configurés comme le montre le tableau suivant.

        Répondez à chaque consigne en sélectionnant l'utilisateur approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The only user who has no Microsoft 365 E5 license", fr: "Le seul utilisateur qui n'a aucune licence Microsoft 365 E5" }
        - id: p2
          text: { en: "The only user who would keep a Microsoft 365 E5 license if you removed the E5 license from LIC-E5", fr: "Le seul utilisateur qui conserverait une licence Microsoft 365 E5 si vous retiriez la licence E5 de LIC-E5" }
      grid:
        header: [{ en: "User", fr: "Utilisateur" }, { en: "Direct member of LIC-E5", fr: "Membre direct de LIC-E5" }, { en: "Member of TEAM-NE", fr: "Membre de TEAM-NE" }, { en: "E5 assigned directly", fr: "E5 attribuée directement" }, { en: "Usage location", fr: "Emplacement d'utilisation" }]
        rows:
          - [{ text: Ana, area: ana }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "No", fr: "Non" } }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Belgium", fr: "Belgique" } }]
          - [{ text: Ben, area: ben }, { text: { en: "No", fr: "Non" } }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "No", fr: "Non" } }, { text: { en: "France", fr: "France" } }]
          - [{ text: Cleo, area: cleo }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "No", fr: "Non" } }, { text: { en: "No", fr: "Non" } }, { text: { en: "Not set", fr: "Non défini" } }]
          - [{ text: Dan, area: dan }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "No", fr: "Non" } }, { text: { en: "Germany", fr: "Allemagne" } }]
    answer:
      values: { p1: ben, p2: ana }
    explanation:
      correct:
        en: "Group-based licensing doesn't support nested groups: Ben is only a member of TEAM-NE, so he gets no license. Cleo has no usage location and inherits the tenant's location, so she receives E5; Dan is also a direct member of LIC-E5, so his membership of TEAM-NE doesn't matter. A user's licenses combine direct and inherited assignments: removing the license from LIC-E5 removes the inherited E5 only, and Ana keeps her direct E5."
        fr: "Les licences basées sur les groupes ne prennent pas en charge les groupes imbriqués : Ben n'est membre que de TEAM-NE et n'obtient donc aucune licence. Cleo n'a pas d'emplacement d'utilisation et hérite de celui du locataire ; elle reçoit donc E5. Dan est aussi membre direct de LIC-E5 : son appartenance à TEAM-NE ne change rien. Les licences d'un utilisateur combinent attributions directes et héritées : retirer la licence de LIC-E5 ne retire que l'E5 héritée, et Ana conserve son E5 directe."
      options:
        cleo: { en: "A missing usage location doesn't block group-based licensing: the tenant's location is used.", fr: "L'absence d'emplacement d'utilisation ne bloque pas les licences basées sur les groupes : l'emplacement du locataire est utilisé." }
        dan: { en: "Dan's E5 is inherited only from LIC-E5; it would be removed with the group's license.", fr: "L'E5 de Dan n'est héritée que de LIC-E5 ; elle serait retirée avec la licence du groupe." }
    references:
      - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
      - title: Manage licenses
        url: https://learn.microsoft.com/en-us/training/modules/create-configure-manage-identities/8-manage-licenses
