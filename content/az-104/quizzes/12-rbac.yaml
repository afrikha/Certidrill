chapter: 12-rbac
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are writing the JSON definition of a custom Azure role. The role must allow its holders to read the content of blobs, which is the operation `Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read`.

        In which property of the role definition should you add this operation?
      fr: |
        Vous rédigez la définition JSON d'un rôle Azure personnalisé. Le rôle doit permettre à ses détenteurs de lire le contenu des objets blob, c'est-à-dire l'opération `Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read`.

        Dans quelle propriété de la définition de rôle devez-vous ajouter cette opération ?
    body:
      options:
        - { id: a, text: "`Actions`" }
        - { id: b, text: "`DataActions`" }
        - { id: c, text: "`NotDataActions`" }
        - { id: d, text: "`AssignableScopes`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Reading the content of a blob is a data plane operation, and data plane operations are listed in `DataActions`. Control plane properties such as `Actions` never grant access to the data itself, which is why Storage Blob Data Reader lists this exact operation in its `DataActions`.
        fr: |
          La lecture du contenu d'un objet blob est une opération du plan de données, et les opérations du plan de données se listent dans `DataActions`. Les propriétés du plan de contrôle comme `Actions` ne donnent jamais accès aux données elles-mêmes ; c'est pourquoi Storage Blob Data Reader liste exactement cette opération dans ses `DataActions`.
      options:
        a: { en: "`Actions` lists control plane (management) operations; a data operation placed there doesn't grant access to the blob content.", fr: "`Actions` liste les opérations du plan de contrôle (gestion) ; une opération de données placée là ne donne pas accès au contenu des objets blob." }
        c: { en: "`NotDataActions` subtracts data operations from `DataActions`: it would remove the permission instead of granting it.", fr: "`NotDataActions` soustrait des opérations de données de `DataActions` : il retirerait l'autorisation au lieu de l'accorder." }
        d: { en: "`AssignableScopes` lists where the role can be assigned (management group, subscription, resource group), not which operations it allows.", fr: "`AssignableScopes` liste les étendues où le rôle peut être attribué (groupe d'administration, abonnement, groupe de ressources), pas les opérations qu'il autorise." }
    references:
      - title: Understand Azure role definitions - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions

  # ------------------------------------------------------------------ 2
  - id: az104-qz-12-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        At Contoso, 15 help desk technicians need the Virtual Machine Contributor role on a resource group named **RG-Support**. Technicians join and leave the team every month.

        You need to grant the access and keep it up to date with the least administrative effort. What should you do?
      fr: |
        Chez Contoso, 15 techniciens du support ont besoin du rôle Virtual Machine Contributor sur un groupe de ressources nommé **RG-Support**. Des techniciens arrivent dans l'équipe et en partent chaque mois.

        Vous devez accorder cet accès et le tenir à jour avec un minimum d'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the role on RG-Support to each technician, and remove the assignment when a technician leaves.", fr: "Attribuer le rôle sur RG-Support à chaque technicien, puis supprimer l'attribution quand un technicien part." } }
        - { id: b, text: { en: "Assign the role on the subscription to each technician, so that the assignment also covers future resource groups.", fr: "Attribuer le rôle sur l'abonnement à chaque technicien, afin que l'attribution couvre aussi les futurs groupes de ressources." } }
        - { id: c, text: { en: "Assign the role on RG-Support to a Microsoft Entra group, and manage the technicians as members of the group.", fr: "Attribuer le rôle sur RG-Support à un groupe Microsoft Entra, puis gérer les techniciens comme membres du groupe." } }
        - { id: d, text: { en: "Create a custom role for each technician, with RG-Support in the AssignableScopes of the role.", fr: "Créer un rôle personnalisé pour chaque technicien, avec RG-Support dans les AssignableScopes du rôle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Assigning the role once to a group and managing access through group membership is the recommended practice. Arrivals and departures then only change the group membership, with no new role assignment, and the number of assignments stays low.
        fr: |
          Attribuer le rôle une seule fois à un groupe et gérer l'accès par l'appartenance au groupe est la pratique recommandée. Les arrivées et les départs ne modifient alors que l'appartenance au groupe, sans nouvelle attribution de rôle, et le nombre d'attributions reste faible.
      options:
        a: { en: "Per-user assignments work but require a role assignment change every time the team changes.", fr: "Des attributions par utilisateur fonctionnent, mais exigent une modification d'attribution à chaque changement dans l'équipe." }
        b: { en: "The subscription scope is broader than required, and per-user assignments still have to be maintained.", fr: "L'étendue de l'abonnement est plus large que nécessaire, et les attributions par utilisateur restent à maintenir." }
        d: { en: "A built-in role already fits; one custom role per user adds definitions to maintain and still needs per-user assignments.", fr: "Un rôle intégré convient déjà ; un rôle personnalisé par utilisateur ajoute des définitions à maintenir et exige toujours des attributions par utilisateur." }
    references:
      - title: Best practices for Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices

  # ------------------------------------------------------------------ 3
  - id: az104-qz-12-03
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure subscription named **Sub-Corp**. Members of a group named **G-FinOps** must add and update the `CostCenter` tag on all the resource groups and resources of Sub-Corp.

        G-FinOps must not be able to create, delete or reconfigure resources. The solution must follow the principle of least privilege.

        Which built-in role should you assign to G-FinOps on Sub-Corp?
      fr: |
        Fabrikam dispose d'un abonnement Azure nommé **Sub-Corp**. Les membres d'un groupe nommé **G-FinOps** doivent ajouter et mettre à jour l'étiquette `CostCenter` sur tous les groupes de ressources et toutes les ressources de Sub-Corp.

        G-FinOps ne doit pas pouvoir créer, supprimer ou reconfigurer des ressources. La solution doit respecter le principe du moindre privilège.

        Quel rôle intégré devez-vous attribuer à G-FinOps sur Sub-Corp ?
    body:
      options:
        - { id: a, text: Contributor }
        - { id: b, text: Reader }
        - { id: c, text: Resource Policy Contributor }
        - { id: d, text: Tag Contributor }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Tag Contributor lets its holders manage tags on resources and resource groups without access to the resources themselves. Its permissions are limited to reading the resources and resource groups and to `Microsoft.Resources/tags/*`, so G-FinOps can't create, delete or reconfigure anything.
        fr: |
          Tag Contributor permet à ses détenteurs de gérer les étiquettes des ressources et des groupes de ressources sans accès aux ressources elles-mêmes. Ses autorisations se limitent à la lecture des ressources et des groupes de ressources et à `Microsoft.Resources/tags/*` ; G-FinOps ne peut donc rien créer, supprimer ni reconfigurer.
      options:
        a: { en: "Contributor can write tags, but also create, delete and reconfigure every resource: it breaks least privilege.", fr: "Contributor peut écrire des étiquettes, mais aussi créer, supprimer et reconfigurer toutes les ressources : il enfreint le moindre privilège." }
        b: { en: "Reader can view tags but can't add or update them, because writing a tag isn't a read operation.", fr: "Reader peut consulter les étiquettes mais ne peut ni en ajouter ni en modifier, car écrire une étiquette n'est pas une opération de lecture." }
        c: { en: "Resource Policy Contributor manages Azure Policy definitions and assignments; it doesn't write tags on resources.", fr: "Resource Policy Contributor gère les définitions et les attributions Azure Policy ; il n'écrit pas d'étiquettes sur les ressources." }
    references:
      - title: Azure built-in roles for Management and governance - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/management-and-governance

  # ------------------------------------------------------------------ 4
  - id: az104-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a subscription named **Sub1** that contains a resource group named **RG1**. RG1 contains a virtual machine named **VM1**.

        You open **Access control (IAM)** on Sub1, select **Check access**, and select a user named User1. No role assignment is listed for User1. However, User1 can restart VM1.

        What explains this result?
      fr: |
        Adatum dispose d'un abonnement nommé **Sub1** qui contient un groupe de ressources nommé **RG1**. RG1 contient une machine virtuelle nommée **VM1**.

        Vous ouvrez **Contrôle d'accès (IAM)** sur Sub1, sélectionnez **Vérifier l'accès**, puis sélectionnez un utilisateur nommé User1. Aucune attribution de rôle n'est listée pour User1. Pourtant, User1 peut redémarrer VM1.

        Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "User1 holds a role assignment at the Tenant Root Group, and Check access on Sub1 doesn't list assignments made at parent scopes.", fr: "User1 détient une attribution de rôle sur le Tenant Root Group, et Vérifier l'accès sur Sub1 ne liste pas les attributions faites aux étendues parentes." } }
        - { id: b, text: { en: "User1 holds a role assignment on RG1 or VM1, and Check access on Sub1 doesn't list assignments made at child scopes.", fr: "User1 détient une attribution de rôle sur RG1 ou VM1, et Vérifier l'accès sur Sub1 ne liste pas les attributions faites aux étendues enfants." } }
        - { id: c, text: { en: "User1 holds the Global Administrator role in Microsoft Entra ID, which grants access to every subscription without a role assignment.", fr: "User1 détient le rôle Administrateur général dans Microsoft Entra ID, qui donne accès à tous les abonnements sans attribution de rôle." } }
        - { id: d, text: { en: "User1 is an excluded principal of a deny assignment on RG1, and the exclusion grants User1 the denied actions.", fr: "User1 est un principal exclu d'une affectation de refus sur RG1, et l'exclusion accorde à User1 les actions refusées." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Check access lists the assignments of a principal at the selected scope and those inherited from its parent scopes, but not the assignments made at child scopes. An assignment on RG1 or VM1 lets User1 restart VM1 without appearing in Check access on Sub1; checking access on VM1 would show it.
        fr: |
          Vérifier l'accès liste les attributions d'un principal à l'étendue sélectionnée et celles héritées de ses étendues parentes, mais pas les attributions faites aux étendues enfants. Une attribution sur RG1 ou VM1 permet à User1 de redémarrer VM1 sans apparaître dans Vérifier l'accès sur Sub1 ; vérifier l'accès sur VM1 l'afficherait.
      options:
        a: { en: "Check access does list the assignments inherited from parent scopes, so a Tenant Root Group assignment would appear on Sub1.", fr: "Vérifier l'accès liste bien les attributions héritées des étendues parentes : une attribution sur le Tenant Root Group apparaîtrait sur Sub1." }
        c: { en: "Global Administrator grants no access to Azure resources by itself; the user must first elevate access, which creates a role assignment.", fr: "Administrateur général ne donne par lui-même aucun accès aux ressources Azure ; l'utilisateur doit d'abord élever son accès, ce qui crée une attribution de rôle." }
        d: { en: "A deny assignment only blocks actions; excluding a principal from it removes the block but never grants a permission.", fr: "Une affectation de refus ne fait que bloquer des actions ; en exclure un principal lève le blocage mais n'accorde jamais d'autorisation." }
    references:
      - title: Quickstart - Check access for a user to a single Azure resource - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/check-access

  # ------------------------------------------------------------------ 5
  - id: az104-qz-12-05
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware has a subscription named **Sub-Lab** in its Microsoft Entra tenant. Sub-Lab contains a resource group named **RG-Lab**, which contains a storage account named **stlablitware** with a blob container named **results**. Sub-Lab will be transferred to the Microsoft Entra directory of a partner company next quarter.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un abonnement nommé **Sub-Lab** dans son locataire Microsoft Entra. Sub-Lab contient un groupe de ressources nommé **RG-Lab**, qui contient un compte de stockage nommé **stlablitware** avec un conteneur d'objets blob nommé **results**. Sub-Lab sera transféré vers l'annuaire Microsoft Entra d'une société partenaire le trimestre prochain.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If you assign the Reader role to a group named G-Audit on Sub-Lab today, the members of G-Audit can view a resource group that is created in Sub-Lab next week.", fr: "Si vous attribuez aujourd'hui le rôle Reader à un groupe nommé G-Audit sur Sub-Lab, les membres de G-Audit peuvent consulter un groupe de ressources créé dans Sub-Lab la semaine prochaine." }
        - id: s2
          text: { en: "You can assign the Storage Blob Data Reader role to a group named G-Analysts at the scope of the results container, without access to the other containers of stlablitware.", fr: "Vous pouvez attribuer le rôle Storage Blob Data Reader à un groupe nommé G-Analysts à l'étendue du conteneur results, sans accès aux autres conteneurs de stlablitware." }
        - id: s3
          text: { en: "After the transfer, the role assignments made on Sub-Lab and RG-Lab still apply to the same Litware users.", fr: "Après le transfert, les attributions de rôles faites sur Sub-Lab et RG-Lab s'appliquent toujours aux mêmes utilisateurs de Litware." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Role assignments are inherited by every child scope, including resource groups created later. A blob container is a valid scope below the storage account, so a data role can be limited to it. When a subscription is transferred to another Microsoft Entra directory, all its role assignments and custom roles are permanently deleted and must be re-created for objects of the target directory.
        fr: |
          Les attributions de rôles sont héritées par toutes les étendues enfants, y compris les groupes de ressources créés plus tard. Un conteneur d'objets blob est une étendue valide sous le compte de stockage : un rôle de données peut donc s'y limiter. Quand un abonnement est transféré vers un autre annuaire Microsoft Entra, toutes ses attributions de rôles et tous ses rôles personnalisés sont définitivement supprimés et doivent être recréés pour des objets de l'annuaire cible.
      options:
        s3: { en: "The transfer permanently deletes the role assignments; save them first (for example with az role assignment list --all) to re-create them in the target directory.", fr: "Le transfert supprime définitivement les attributions de rôles ; enregistrez-les d'abord (par exemple avec az role assignment list --all) pour les recréer dans l'annuaire cible." }
    references:
      - title: Understand scope for Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
      - title: Transfer an Azure subscription to a different Microsoft Entra directory
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/transfer-subscription

  # ------------------------------------------------------------------ 6
  - id: az104-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a storage account named **stwgledger** in a resource group named **RG-Finance**. Shared Key authorization is allowed on stwgledger. The role assignments are the following:

        | Principal | Role | Scope |
        | --- | --- | --- |
        | G-StorageOps (group) | Contributor | RG-Finance |
        | G-Analysts (group) | Reader | stwgledger |
        | G-Analysts (group) | Storage Blob Data Reader | stwgledger |

        All the applications that use stwgledger authenticate with managed identities that hold storage data roles. An audit finds that members of G-StorageOps can browse and download the blobs of stwgledger in the Azure portal.

        You need to ensure that G-StorageOps can no longer read blob data in stwgledger by using any tool. G-StorageOps must keep managing the configuration of stwgledger, such as its redundancy and network rules. G-Analysts and the applications must keep their access. You must not change any role assignment, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un compte de stockage nommé **stwgledger** dans un groupe de ressources nommé **RG-Finance**. L'autorisation par clé partagée (Shared Key) est autorisée sur stwgledger. Les attributions de rôles sont les suivantes :

        | Principal | Rôle | Étendue |
        | --- | --- | --- |
        | G-StorageOps (groupe) | Contributor | RG-Finance |
        | G-Analysts (groupe) | Reader | stwgledger |
        | G-Analysts (groupe) | Storage Blob Data Reader | stwgledger |

        Toutes les applications qui utilisent stwgledger s'authentifient avec des identités managées qui détiennent des rôles de données du stockage. Un audit constate que les membres de G-StorageOps peuvent parcourir et télécharger les objets blob de stwgledger dans le portail Azure.

        Vous devez faire en sorte que G-StorageOps ne puisse plus lire les données blob de stwgledger, avec quelque outil que ce soit. G-StorageOps doit continuer à gérer la configuration de stwgledger, comme sa redondance et ses règles réseau. G-Analysts et les applications doivent conserver leur accès. Vous ne devez modifier aucune attribution de rôle, et la solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set **Default to Microsoft Entra authorization in the Azure portal** to **Enabled** on stwgledger.", fr: "Définir **Default to Microsoft Entra authorization in the Azure portal** sur **Enabled** sur stwgledger." } }
        - { id: b, text: { en: "Apply a **ReadOnly** lock to stwgledger so that the account keys can no longer be listed.", fr: "Appliquer un verrou **ReadOnly** à stwgledger pour que les clés du compte ne puissent plus être listées." } }
        - { id: c, text: { en: "Set **Allow storage account key access** to **Disabled** on stwgledger.", fr: "Définir **Allow storage account key access** sur **Disabled** sur stwgledger." } }
        - { id: d, text: { en: "Add the blob read operation to the **NotDataActions** of the Contributor role definition.", fr: "Ajouter l'opération de lecture des objets blob aux **NotDataActions** de la définition du rôle Contributor." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Contributor has no data actions, but it includes `listKeys`, so the portal and other tools read the blobs with the account key. Disallowing Shared Key authorization makes Azure Storage reject every request authorized with the account keys, while G-StorageOps keeps its control plane permissions. G-Analysts and the managed identities use Microsoft Entra authorization with their data roles, so they keep their access.
        fr: |
          Contributor n'a aucune action de données, mais il inclut `listKeys` ; le portail et les autres outils lisent donc les objets blob avec la clé du compte. Interdire l'autorisation par clé partagée fait rejeter par Stockage Azure toute requête autorisée avec les clés du compte, tandis que G-StorageOps conserve ses autorisations du plan de contrôle. G-Analysts et les identités managées utilisent l'autorisation Microsoft Entra avec leurs rôles de données ; ils conservent donc leur accès.
      options:
        a: { en: "This setting only changes the default method in the portal; a user who holds listKeys can still switch to the access key.", fr: "Ce paramètre ne change que la méthode par défaut du portail ; un utilisateur qui détient listKeys peut toujours basculer vers la clé d'accès." }
        b: { en: "A ReadOnly lock blocks listing the keys, but it also blocks every configuration change, which G-StorageOps must keep making.", fr: "Un verrou ReadOnly bloque bien la liste des clés, mais il bloque aussi toute modification de configuration, que G-StorageOps doit pouvoir continuer à faire." }
        d: { en: "Built-in role definitions can't be modified, and Contributor has no DataActions to subtract from: the access comes from the account key.", fr: "Les définitions des rôles intégrés ne sont pas modifiables, et Contributor n'a aucune DataActions à soustraire : l'accès vient de la clé du compte." }
    references:
      - title: Prevent authorization with Shared Key - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
      - title: Authorize access to blob data in the Azure portal - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal

  # ------------------------------------------------------------------ 7
  - id: az104-qz-12-07
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a subscription named **Sub-Apps** that contains a resource group named **RG-App** in the West Europe region. RG-App contains:

        - A virtual network named **vnet-app** with a subnet named **snet-app**, and a virtual machine named **vm-app1** connected to snet-app.
        - A storage account named **stapp01**. Its networking is set to **Enabled from selected virtual networks and IP addresses**, and the only allowed network is snet-app, through a service endpoint for Microsoft.Storage.

        An Azure Policy assignment on Sub-Apps uses the built-in **Allowed locations** policy definition with West Europe as the only allowed location.

        A user named Eva is a member of a group named G-App, which has the Contributor role on RG-App. Eva also has the Storage Blob Data Contributor role on stapp01. No deny assignment or resource lock applies.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un abonnement nommé **Sub-Apps** qui contient un groupe de ressources nommé **RG-App** dans la région Europe Ouest. RG-App contient :

        - Un réseau virtuel nommé **vnet-app** avec un sous-réseau nommé **snet-app**, et une machine virtuelle nommée **vm-app1** connectée à snet-app.
        - Un compte de stockage nommé **stapp01**. Sa mise en réseau est définie sur **Enabled from selected virtual networks and IP addresses**, et le seul réseau autorisé est snet-app, via un point de terminaison de service pour Microsoft.Storage.

        Une attribution de stratégie Azure Policy sur Sub-Apps utilise la définition de stratégie intégrée **Allowed locations** avec Europe Ouest comme seul emplacement autorisé.

        Une utilisatrice nommée Eva est membre d'un groupe nommé G-App, qui dispose du rôle Contributor sur RG-App. Eva dispose aussi du rôle Storage Blob Data Contributor sur stapp01. Aucune affectation de refus ni aucun verrou de ressource ne s'applique.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Signed in to vm-app1 with her Microsoft Entra account, Eva can upload a blob to stapp01 by using Microsoft Entra authorization.", fr: "Connectée à vm-app1 avec son compte Microsoft Entra, Eva peut charger un objet blob dans stapp01 en utilisant l'autorisation Microsoft Entra." }
        - id: s2
          text: { en: "Eva can create a virtual machine in RG-App in the North Europe region.", fr: "Eva peut créer une machine virtuelle dans RG-App dans la région Europe Nord." }
        - id: s3
          text: { en: "From her home computer, whose public IP address isn't allowed by stapp01, Eva can upload a blob to stapp01 by using Microsoft Entra authorization.", fr: "Depuis son ordinateur personnel, dont l'adresse IP publique n'est pas autorisée par stapp01, Eva peut charger un objet blob dans stapp01 en utilisant l'autorisation Microsoft Entra." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Azure RBAC is only one of the checks. From vm-app1, the request comes from the allowed subnet and Eva's direct Storage Blob Data Contributor assignment provides the data action, even though Contributor has none. Contributor allows creating virtual machines, but Azure Policy still denies a resource whose location isn't allowed. From an address that the storage firewall doesn't allow, the request is denied whatever Eva's roles.
        fr: |
          Azure RBAC n'est qu'un des contrôles. Depuis vm-app1, la requête provient du sous-réseau autorisé et l'attribution directe Storage Blob Data Contributor d'Eva fournit l'action de données, même si Contributor n'en a aucune. Contributor permet de créer des machines virtuelles, mais Azure Policy refuse quand même une ressource dont l'emplacement n'est pas autorisé. Depuis une adresse que le pare-feu du stockage n'autorise pas, la requête est refusée quels que soient les rôles d'Eva.
      options:
        s2: { en: "Even with Contributor, a create request whose result is non-compliant with the Allowed locations policy is denied.", fr: "Même avec Contributor, une demande de création dont le résultat n'est pas conforme à la stratégie Allowed locations est refusée." }
        s3: { en: "Network rules are a separate gate: only traffic from allowed sources reaches the account, and it must then also be authorized.", fr: "Les règles réseau sont un contrôle distinct : seul le trafic des sources autorisées atteint le compte, et il doit ensuite être aussi autorisé." }
    references:
      - title: Overview of Azure Policy - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
      - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security

  # ------------------------------------------------------------------ 8
  - id: az104-qz-12-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a management group named **MG-Apps** that contains several subscriptions, including **Sub-Apps** (ID `4f8c2a1d-6b3e-4d7a-9e21-5c0b8f3a7d64`). Sub-Apps contains a resource group named **rg-pipeline**.

        A deployment pipeline runs with a user-assigned managed identity named **id-deploy** that was created a few minutes ago. Its object (principal) ID is `9d3b6e20-1c4f-4a8b-b7e5-2f6a0c9d8e13`. For each release, the pipeline creates a new resource group in Sub-Apps and deploys virtual machines, virtual networks and storage accounts into it.

        id-deploy must not be able to grant access to other identities and must have no permission outside Sub-Apps. The solution must follow the principle of least privilege and avoid failures caused by replication delays of the new identity.

        How should you complete the Azure CLI command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un groupe d'administration nommé **MG-Apps** qui contient plusieurs abonnements, dont **Sub-Apps** (ID `4f8c2a1d-6b3e-4d7a-9e21-5c0b8f3a7d64`). Sub-Apps contient un groupe de ressources nommé **rg-pipeline**.

        Un pipeline de déploiement s'exécute avec une identité managée affectée par l'utilisateur nommée **id-deploy**, créée il y a quelques minutes. Son ID d'objet (principal) est `9d3b6e20-1c4f-4a8b-b7e5-2f6a0c9d8e13`. À chaque mise en production, le pipeline crée un nouveau groupe de ressources dans Sub-Apps et y déploie des machines virtuelles, des réseaux virtuels et des comptes de stockage.

        id-deploy ne doit pas pouvoir accorder d'accès à d'autres identités et ne doit avoir aucune autorisation en dehors de Sub-Apps. La solution doit respecter le principe du moindre privilège et éviter les échecs dus aux délais de réplication de la nouvelle identité.

        Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az role assignment create \
          --assignee-object-id "9d3b6e20-1c4f-4a8b-b7e5-2f6a0c9d8e13" \
          --assignee-principal-type [[ptype]] \
          --role [[role]] \
          --scope [[scope]]
      slots:
        - id: ptype
          options:
            - { id: user, text: User }
            - { id: group, text: Group }
            - { id: sp, text: ServicePrincipal }
            - { id: foreign, text: ForeignGroup }
        - id: role
          options:
            - { id: owner, text: "\"Owner\"" }
            - { id: contrib, text: "\"Contributor\"" }
            - { id: vmc, text: "\"Virtual Machine Contributor\"" }
            - { id: rbacadmin, text: "\"Role Based Access Control Administrator\"" }
        - id: scope
          options:
            - { id: rg, text: "\"/subscriptions/4f8c2a1d-6b3e-4d7a-9e21-5c0b8f3a7d64/resourceGroups/rg-pipeline\"" }
            - { id: mg, text: "\"/providers/Microsoft.Management/managementGroups/MG-Apps\"" }
            - { id: sub, text: "\"/subscriptions/4f8c2a1d-6b3e-4d7a-9e21-5c0b8f3a7d64\"" }
            - { id: root, text: "\"/\"" }
    answer:
      values: { ptype: sp, role: contrib, scope: sub }
    explanation:
      correct:
        en: |
          A managed identity is a service principal, and passing its object ID with `--assignee-principal-type ServicePrincipal` avoids failures while the new identity replicates. Contributor allows creating resource groups and every resource type the pipeline deploys, without role assignment writes. Because the pipeline creates new resource groups, the assignment must be at the subscription scope; a resource group scope can't create sibling resource groups.
        fr: |
          Une identité managée est un principal de service, et transmettre son ID d'objet avec `--assignee-principal-type ServicePrincipal` évite les échecs pendant la réplication de la nouvelle identité. Contributor permet de créer des groupes de ressources et tous les types de ressources que le pipeline déploie, sans écriture d'attributions de rôles. Comme le pipeline crée de nouveaux groupes de ressources, l'attribution doit se faire à l'étendue de l'abonnement ; une étendue de groupe de ressources ne permet pas de créer d'autres groupes de ressources.
      options:
        owner: { en: "Owner can also assign roles, which id-deploy must not do.", fr: "Owner peut aussi attribuer des rôles, ce qu'id-deploy ne doit pas faire." }
        vmc: { en: "Virtual Machine Contributor can't create virtual networks, storage accounts or resource groups.", fr: "Virtual Machine Contributor ne peut créer ni réseaux virtuels, ni comptes de stockage, ni groupes de ressources." }
        rbacadmin: { en: "Role Based Access Control Administrator manages role assignments only and can't deploy resources.", fr: "Role Based Access Control Administrator gère uniquement les attributions de rôles et ne peut pas déployer de ressources." }
        rg: { en: "An assignment on rg-pipeline doesn't cover the new resource groups that the pipeline must create.", fr: "Une attribution sur rg-pipeline ne couvre pas les nouveaux groupes de ressources que le pipeline doit créer." }
        mg: { en: "MG-Apps also covers the other subscriptions, outside Sub-Apps.", fr: "MG-Apps couvre aussi les autres abonnements, en dehors de Sub-Apps." }
    references:
      - title: Assign Azure roles using Azure CLI - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-cli

  # ------------------------------------------------------------------ 9
  - id: az104-qz-12-09
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware has a storage account named **stprosedata** that has a hierarchical namespace enabled. It contains a container named **raw** and a container named **landing**. A second storage account named **stprosefiles** hosts an Azure file share named **cad**, with identity-based authentication over SMB configured.

        Four access requirements are listed in the answer area, each with the scope of its role assignment. The solution must follow the principle of least privilege.

        Which role should you assign for each requirement? To answer, drag the appropriate roles to the correct requirements. Each role may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un compte de stockage nommé **stprosedata** dont l'espace de noms hiérarchique est activé. Il contient un conteneur nommé **raw** et un conteneur nommé **landing**. Un second compte de stockage nommé **stprosefiles** héberge un partage de fichiers Azure nommé **cad**, avec l'authentification basée sur l'identité via SMB configurée.

        Quatre exigences d'accès figurent dans la zone de réponse, chacune avec l'étendue de son attribution de rôle. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer pour chaque exigence ? Pour répondre, faites glisser les rôles appropriés vers les exigences correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sbdo, text: Storage Blob Data Owner }
        - { id: sbdc, text: Storage Blob Data Contributor }
        - { id: sac, text: Storage Account Contributor }
        - { id: keyop, text: Storage Account Key Operator Service Role }
        - { id: smbelev, text: Storage File Data SMB Share Elevated Contributor }
        - { id: smbcontrib, text: Storage File Data SMB Share Contributor }
      targets:
        - id: eng
          text: { en: "Data engineers (scope: raw): read and write data, and set POSIX access control lists (ACLs) on its directories", fr: "Ingénieurs de données (étendue : raw) : lire et écrire des données, et définir des listes de contrôle d'accès (ACL) POSIX sur ses répertoires" }
        - id: ingest
          text: { en: "Ingestion function identity (scope: landing): write and delete blobs, without changing ACLs", fr: "Identité de la fonction d'ingestion (étendue : landing) : écrire et supprimer des objets blob, sans modifier les ACL" }
        - id: sec
          text: { en: "Security team (scope: stprosedata): regenerate the access keys and configure the network rules of the account", fr: "Équipe de sécurité (étendue : stprosedata) : régénérer les clés d'accès et configurer les règles réseau du compte" }
        - id: cadleads
          text: { en: "CAD leads (scope: cad): modify files over SMB and change their NTFS permissions", fr: "Responsables CAO (étendue : cad) : modifier des fichiers via SMB et changer leurs autorisations NTFS" }
    answer:
      mapping: { eng: sbdo, ingest: sbdc, sec: sac, cadleads: smbelev }
    explanation:
      correct:
        en: |
          Storage Blob Data Owner is the blob data role that includes assigning POSIX access control, while Storage Blob Data Contributor reads, writes and deletes blobs without managing ACLs. Storage Account Contributor manages the account, including its keys and network rules. Storage File Data SMB Share Elevated Contributor adds the modify-permissions data action to the read, write and delete actions of SMB Share Contributor.
        fr: |
          Storage Blob Data Owner est le rôle de données blob qui inclut l'attribution du contrôle d'accès POSIX, tandis que Storage Blob Data Contributor lit, écrit et supprime des objets blob sans gérer les ACL. Storage Account Contributor gère le compte, y compris ses clés et ses règles réseau. Storage File Data SMB Share Elevated Contributor ajoute l'action de données de modification des autorisations aux actions de lecture, d'écriture et de suppression de SMB Share Contributor.
      options:
        keyop: { en: "Storage Account Key Operator Service Role lists and regenerates keys only; it can't configure network rules.", fr: "Storage Account Key Operator Service Role liste et régénère seulement les clés ; il ne peut pas configurer les règles réseau." }
        smbcontrib: { en: "Storage File Data SMB Share Contributor can read, write and delete files but can't change NTFS permissions.", fr: "Storage File Data SMB Share Contributor peut lire, écrire et supprimer des fichiers, mais ne peut pas changer les autorisations NTFS." }
    references:
      - title: Azure built-in roles for Storage - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage

  # ------------------------------------------------------------------ 10
  - id: az104-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has the hierarchy **MG-Fab** > **Sub-Prod**. Sub-Prod contains two resource groups:

        - **RG-Web** contains a virtual machine named **vm-web1**, a network security group named **nsg-web** and a storage account named **stweb1**.
        - **RG-Data** contains a storage account named **stdata1**.

        A user named Mia is a member of a group named **G-Web**. G-Web is a member of a group named **G-Eng**. A custom role named **VM Operator** has the following permissions:

        - `Actions`: `Microsoft.Compute/virtualMachines/*` and `Microsoft.Network/networkSecurityGroups/read`
        - `NotActions`: `Microsoft.Compute/virtualMachines/delete`

        The following table shows all the role assignments that apply to these principals.

        | Principal | Role | Scope |
        | --- | --- | --- |
        | G-Eng | Reader | MG-Fab |
        | G-Eng | Virtual Machine Contributor | Sub-Prod |
        | G-Web | VM Operator | RG-Web |
        | Mia | Storage Blob Data Reader | stdata1 |

        No deny assignment, condition or resource lock applies.

        Which two actions can Mia perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de la hiérarchie **MG-Fab** > **Sub-Prod**. Sub-Prod contient deux groupes de ressources :

        - **RG-Web** contient une machine virtuelle nommée **vm-web1**, un groupe de sécurité réseau nommé **nsg-web** et un compte de stockage nommé **stweb1**.
        - **RG-Data** contient un compte de stockage nommé **stdata1**.

        Une utilisatrice nommée Mia est membre d'un groupe nommé **G-Web**. G-Web est membre d'un groupe nommé **G-Eng**. Un rôle personnalisé nommé **VM Operator** dispose des autorisations suivantes :

        - `Actions` : `Microsoft.Compute/virtualMachines/*` et `Microsoft.Network/networkSecurityGroups/read`
        - `NotActions` : `Microsoft.Compute/virtualMachines/delete`

        Le tableau suivant présente toutes les attributions de rôles qui s'appliquent à ces principaux.

        | Principal | Rôle | Étendue |
        | --- | --- | --- |
        | G-Eng | Reader | MG-Fab |
        | G-Eng | Virtual Machine Contributor | Sub-Prod |
        | G-Web | VM Operator | RG-Web |
        | Mia | Storage Blob Data Reader | stdata1 |

        Aucune affectation de refus, aucune condition et aucun verrou de ressource ne s'applique.

        Quelles sont les deux actions que Mia peut effectuer ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add an inbound security rule to nsg-web.", fr: "Ajouter une règle de sécurité de trafic entrant à nsg-web." } }
        - { id: b, text: { en: "Delete vm-web1.", fr: "Supprimer vm-web1." } }
        - { id: c, text: { en: "Read the blobs of stweb1 by using Microsoft Entra authorization.", fr: "Lire les objets blob de stweb1 en utilisant l'autorisation Microsoft Entra." } }
        - { id: d, text: { en: "Assign the Reader role to a colleague on RG-Web.", fr: "Attribuer le rôle Reader à un collègue sur RG-Web." } }
        - { id: e, text: { en: "Download a blob from stdata1 by using the Azure CLI with `--auth-mode login`.", fr: "Télécharger un objet blob de stdata1 avec Azure CLI et `--auth-mode login`." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Group assignments are transitive, so Mia receives the roles of G-Web and of G-Eng, and permissions add up across scopes. The NotActions of VM Operator apply only within that role; Virtual Machine Contributor, inherited from Sub-Prod through G-Eng, includes `Microsoft.Compute/virtualMachines/*` and therefore the delete operation. Storage Blob Data Reader on stdata1 provides the blob read data action that `--auth-mode login` needs.
        fr: |
          Les attributions de groupes sont transitives : Mia reçoit donc les rôles de G-Web et de G-Eng, et les autorisations s'additionnent d'une étendue à l'autre. Les NotActions de VM Operator ne s'appliquent qu'à ce rôle ; Virtual Machine Contributor, hérité de Sub-Prod via G-Eng, inclut `Microsoft.Compute/virtualMachines/*` et donc l'opération de suppression. Storage Blob Data Reader sur stdata1 fournit l'action de données de lecture des objets blob dont `--auth-mode login` a besoin.
      options:
        a: { en: "VM Operator and Virtual Machine Contributor can only read (and join) network security groups; Reader is read-only.", fr: "VM Operator et Virtual Machine Contributor peuvent seulement lire (et joindre) les groupes de sécurité réseau ; Reader est en lecture seule." }
        c: { en: "Mia has no data role on stweb1; Reader, Virtual Machine Contributor and VM Operator contain no DataActions.", fr: "Mia n'a aucun rôle de données sur stweb1 ; Reader, Virtual Machine Contributor et VM Operator ne contiennent aucune DataActions." }
        d: { en: "None of Mia's roles includes `Microsoft.Authorization/roleAssignments/write`.", fr: "Aucun des rôles de Mia n'inclut `Microsoft.Authorization/roleAssignments/write`." }
    references:
      - title: Understand Azure role definitions - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
      - title: Azure built-in roles for Compute - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
