chapter: 42-secure-access
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You are adding a custom inbound security rule to a network security group named **NSG1**.

        Which priority value can you assign to the rule?
      fr: |
        Vous ajoutez une règle de sécurité entrante personnalisée à un groupe de sécurité réseau nommé **NSG1**.

        Quelle valeur de priorité pouvez-vous attribuer à la règle ?
    body:
      options:
        - { id: a, text: "50" }
        - { id: b, text: "4096" }
        - { id: c, text: "4500" }
        - { id: d, text: "65001" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A custom security rule takes a priority between 100 and 4096. Lower numbers are processed first, and processing stops at the first rule that matches. 4096 is the last value available to custom rules, and it is still processed before the default rules (65000 and above).
        fr: |
          Une règle de sécurité personnalisée prend une priorité comprise entre 100 et 4096. Les plus petits numéros sont traités en premier, et le traitement s'arrête à la première règle qui correspond. 4096 est la dernière valeur disponible pour les règles personnalisées, et elle est encore traitée avant les règles par défaut (65000 et au-delà).
      options:
        a: { en: "50 is below 100, the lowest priority number of a custom rule.", fr: "50 est inférieur à 100, le plus petit numéro de priorité d'une règle personnalisée." }
        c: { en: "4500 is above 4096, the highest priority number of a custom rule.", fr: "4500 est supérieur à 4096, le plus grand numéro de priorité d'une règle personnalisée." }
        d: { en: "65001 is outside the 100–4096 range; it is the priority of the default rules AllowAzureLoadBalancerInBound and AllowInternetOutBound.", fr: "65001 est hors de la plage 100–4096 ; c'est la priorité des règles par défaut AllowAzureLoadBalancerInBound et AllowInternetOutBound." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 2
  - id: az104-qz-42-02
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        VMs connected to a subnet named **Subnet1** of **VNet1** must reach the key vault **kv1** over a service endpoint.

        Where do you enable the Microsoft.KeyVault service endpoint?
      fr: |
        Les machines virtuelles connectées à un sous-réseau nommé **Subnet1** de **VNet1** doivent joindre le coffre de clés **kv1** via un point de terminaison de service.

        Où activez-vous le point de terminaison de service Microsoft.KeyVault ?
    body:
      options:
        - { id: a, text: { en: "On kv1, in its networking settings", fr: "Sur kv1, dans ses paramètres de mise en réseau" } }
        - { id: b, text: { en: "On the network interface of each VM", fr: "Sur l'interface réseau de chaque machine virtuelle" } }
        - { id: c, text: { en: "On Subnet1, in the settings of VNet1", fr: "Sur Subnet1, dans les paramètres de VNet1" } }
        - { id: d, text: { en: "On the network security group of Subnet1", fr: "Sur le groupe de sécurité réseau de Subnet1" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A service endpoint is configured on a subnet, for one service, and applies to every compute resource of that subnet. Traffic from Subnet1 to Key Vault then carries the identity of the subnet, which a virtual network rule on kv1 can allow.
        fr: |
          Un point de terminaison de service se configure sur un sous-réseau, pour un service, et s'applique à toutes les ressources de calcul de ce sous-réseau. Le trafic de Subnet1 vers Key Vault porte alors l'identité du sous-réseau, qu'une règle de réseau virtuel sur kv1 peut autoriser.
      options:
        a: { en: "kv1 receives the virtual network rule that allows Subnet1; the service endpoint itself is enabled on the subnet.", fr: "kv1 reçoit la règle de réseau virtuel qui autorise Subnet1 ; le point de terminaison de service lui-même s'active sur le sous-réseau." }
        b: { en: "Service endpoints aren't set per network interface: they apply to the whole subnet.", fr: "Les points de terminaison de service ne se règlent pas par interface réseau : ils s'appliquent à tout le sous-réseau." }
        d: { en: "An NSG filters traffic with rules, which can use the AzureKeyVault service tag, but it doesn't enable a service endpoint.", fr: "Un NSG filtre le trafic avec des règles, qui peuvent utiliser l'étiquette de service AzureKeyVault, mais il n'active pas de point de terminaison de service." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 3
  - id: az104-qz-42-03
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a virtual network named **VNet1** that contains an Azure Bastion host named **Bastion1** (Standard SKU) and a VM named **VM1**. VM1 has no public IP address. A user named **User1** will connect to VM1 from the Azure portal through Bastion1 by using a local administrator account of VM1.

        You need to grant User1 the Azure role assignments required for the connection. The solution must follow the principle of least privilege.

        Which three role assignments should you create? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau virtuel nommé **VNet1** qui contient un hôte Azure Bastion nommé **Bastion1** (référence SKU Standard) et une machine virtuelle nommée **VM1**. VM1 n'a pas d'adresse IP publique. Un utilisateur nommé **User1** se connectera à VM1 depuis le portail Azure via Bastion1 avec un compte d'administrateur local de VM1.

        Vous devez accorder à User1 les attributions de rôles Azure nécessaires à la connexion. La solution doit respecter le principe du privilège minimum.

        Quelles sont les trois attributions de rôles à créer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Reader on VM1", fr: "Reader sur VM1" } }
        - { id: b, text: { en: "Virtual Machine Contributor on VM1", fr: "Virtual Machine Contributor sur VM1" } }
        - { id: c, text: { en: "Reader on the network interface of VM1", fr: "Reader sur l'interface réseau de VM1" } }
        - { id: d, text: { en: "Network Contributor on VNet1", fr: "Network Contributor sur VNet1" } }
        - { id: e, text: { en: "Reader on Bastion1", fr: "Reader sur Bastion1" } }
        - { id: f, text: { en: "Reader on the public IP address of Bastion1", fr: "Reader sur l'adresse IP publique de Bastion1" } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          To connect through Azure Bastion, a user needs the Reader role on the VM, on the network interface that holds the VM's private IP address, and on the Bastion resource. Bastion1 and VM1 are in the same virtual network, so no other assignment is needed. Signing in to Windows with a local account requires no Azure role.
        fr: |
          Pour se connecter via Azure Bastion, un utilisateur a besoin du rôle Reader sur la machine virtuelle, sur l'interface réseau qui porte l'adresse IP privée de la machine et sur la ressource Bastion. Bastion1 et VM1 sont dans le même réseau virtuel : aucune autre attribution n'est nécessaire. La connexion à Windows avec un compte local ne demande aucun rôle Azure.
      options:
        b: { en: "Virtual Machine Contributor lets User1 manage VM1; reading VM1 is enough to connect.", fr: "Virtual Machine Contributor permet à User1 de gérer VM1 ; la lecture de VM1 suffit pour se connecter." }
        d: { en: "Network Contributor grants write access to the network; the connection only needs read access to the VM, its network interface and the bastion.", fr: "Network Contributor accorde un accès en écriture au réseau ; la connexion ne demande qu'un accès en lecture à la machine virtuelle, à son interface réseau et au bastion." }
        f: { en: "The public IP address of the bastion isn't one of the resources a user must be able to read to connect.", fr: "L'adresse IP publique du bastion ne fait pas partie des ressources qu'un utilisateur doit pouvoir lire pour se connecter." }
    references:
      - title: Azure Bastion FAQ
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-faq

  # ------------------------------------------------------------------ 4
  - id: az104-qz-42-04
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam creates a private endpoint in **VNet1** for the blob sub-resource of a storage account named **stfab1** and integrates it with the private DNS zone privatelink.blob.core.windows.net. VMs in VNet1 now reach stfab1 through the private IP address of the private endpoint.

        A security review finds that clients on the internet can still connect to stfab1. Only the private endpoint must be able to reach the account.

        What should you do?
      fr: |
        Fabrikam crée dans **VNet1** un point de terminaison privé pour la sous-ressource blob d'un compte de stockage nommé **stfab1** et l'intègre à la zone DNS privée privatelink.blob.core.windows.net. Les machines virtuelles de VNet1 joignent désormais stfab1 via l'adresse IP privée du point de terminaison privé.

        Un audit de sécurité constate que des clients sur Internet peuvent toujours se connecter à stfab1. Seul le point de terminaison privé doit pouvoir joindre le compte.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable network policies for private endpoints on the subnet of the private endpoint", fr: "Activer les stratégies réseau des points de terminaison privés sur le sous-réseau du point de terminaison privé" } }
        - { id: b, text: { en: "Associate an NSG that denies inbound traffic from Internet with the subnet of the private endpoint", fr: "Associer au sous-réseau du point de terminaison privé un NSG qui refuse le trafic entrant provenant d'Internet" } }
        - { id: c, text: { en: "Delete the CNAME record of stfab1 from the public DNS zone blob.core.windows.net", fr: "Supprimer l'enregistrement CNAME de stfab1 de la zone DNS publique blob.core.windows.net" } }
        - { id: d, text: { en: "Set the public network access of stfab1 to Disable", fr: "Définir l'accès réseau public de stfab1 sur Disable" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A private endpoint gives the account a private IP address, but creating it doesn't block connections on the public endpoint. Setting public network access to Disable blocks the public endpoint; traffic from the virtual network of the private endpoint is still allowed, because the storage firewall only controls the public endpoint.
        fr: |
          Un point de terminaison privé donne au compte une adresse IP privée, mais sa création ne bloque pas les connexions sur le point de terminaison public. Définir l'accès réseau public sur Disable bloque le point de terminaison public ; le trafic du réseau virtuel du point de terminaison privé reste autorisé, car le pare-feu du stockage ne contrôle que le point de terminaison public.
      options:
        a: { en: "Network policies make the subnet's NSG and route table apply to traffic sent to the private endpoint; they don't affect connections to the public endpoint.", fr: "Les stratégies réseau font appliquer le NSG et la table de routage du sous-réseau au trafic envoyé au point de terminaison privé ; elles n'affectent pas les connexions au point de terminaison public." }
        b: { en: "Internet clients connect to the public endpoint of the storage service, not to the subnet, so an NSG on the subnet doesn't stop them.", fr: "Les clients d'Internet se connectent au point de terminaison public du service de stockage, pas au sous-réseau : un NSG sur le sous-réseau ne les arrête pas." }
        c: { en: "The public zone blob.core.windows.net is managed by Microsoft, not by you, and the public endpoint would stay open.", fr: "La zone publique blob.core.windows.net est gérée par Microsoft, pas par vous, et le point de terminaison public resterait ouvert." }
    references:
      - title: Use private endpoints - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
      - title: "Set the default public network access rule: Azure Storage"
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access

  # ------------------------------------------------------------------ 5
  - id: az104-qz-42-05
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a virtual network named **VNet1** that is connected to the on-premises network through a site-to-site VPN. **VM1** (10.1.1.4) and **VM2** (10.1.1.5) are connected to the same subnet, **Subnet1**, which is associated with the network security group **NSG1**. No NSG is associated with the network interfaces.

        In addition to the default rules, NSG1 contains one custom inbound rule: priority 200, source **VirtualNetwork**, destination Any, TCP port 22, action **Deny**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un réseau virtuel nommé **VNet1** connecté au réseau local par un VPN site à site. **VM1** (10.1.1.4) et **VM2** (10.1.1.5) sont connectées au même sous-réseau, **Subnet1**, associé au groupe de sécurité réseau **NSG1**. Aucun NSG n'est associé aux interfaces réseau.

        En plus des règles par défaut, NSG1 contient une seule règle entrante personnalisée : priorité 200, source **VirtualNetwork**, destination Any, port TCP 22, action **Deny**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "VM2 can open an SSH connection to VM1.", fr: "VM2 peut ouvrir une connexion SSH vers VM1." }
        - id: s2
          text: { en: "VM1 can open a connection to VM2 on TCP port 1433.", fr: "VM1 peut ouvrir une connexion vers VM2 sur le port TCP 1433." }
        - id: s3
          text: { en: "An administrator on the on-premises network can open an SSH connection to VM1 through the VPN.", fr: "Un administrateur du réseau local peut ouvrir une connexion SSH vers VM1 via le VPN." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          An NSG associated with a subnet also filters the traffic between VMs of that subnet: SSH from VM2 to VM1 matches the deny rule at priority 200 before AllowVNetInBound (65000). TCP 1433 matches no custom rule, so the default rules AllowVnetOutBound and AllowVNetInBound allow it. The VirtualNetwork tag includes the on-premises address spaces connected through the VPN gateway, so SSH from on-premises is denied by the same rule.
        fr: |
          Un NSG associé à un sous-réseau filtre aussi le trafic entre les machines virtuelles de ce sous-réseau : SSH de VM2 vers VM1 correspond à la règle de refus de priorité 200 avant AllowVNetInBound (65000). TCP 1433 ne correspond à aucune règle personnalisée : les règles par défaut AllowVnetOutBound et AllowVNetInBound l'autorisent. L'étiquette VirtualNetwork inclut les espaces d'adressage locaux connectés par la passerelle VPN : SSH depuis le réseau local est refusé par la même règle.
      options:
        s1: { en: "Being in the same subnet doesn't bypass the NSG associated with that subnet.", fr: "Être dans le même sous-réseau ne permet pas de contourner le NSG associé à ce sous-réseau." }
        s3: { en: "VirtualNetwork covers the on-premises ranges connected through a gateway, so the deny rule matches.", fr: "VirtualNetwork couvre les plages locales connectées par une passerelle : la règle de refus correspond." }
    references:
      - title: How Network Security Groups Filter Network Traffic in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview

  # ------------------------------------------------------------------ 6
  - id: az104-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has the following virtual networks in the same region:

        - **VNet-Hub** (10.0.0.0/16) contains a VPN gateway connected to the on-premises network (192.168.0.0/16) and an Azure Bastion host named **Bastion1** (Standard SKU) in AzureBastionSubnet (10.0.1.0/26).
        - **VNet-App** (10.1.0.0/16) is peered with VNet-Hub and uses its remote gateway. Its subnet **Subnet-App** hosts Windows VMs and is associated with the network security group **NSG-App**, which contains only the default rules.
        - **VNet-Test** (10.2.0.0/16) is peered with VNet-App.

        You need to ensure that RDP connections to the VMs in Subnet-App are possible only through Bastion1. RDP from the on-premises network and from VNet-Test must be blocked. All other traffic must remain unchanged.

        Which two inbound rules should you add to NSG-App? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose des réseaux virtuels suivants dans la même région :

        - **VNet-Hub** (10.0.0.0/16) contient une passerelle VPN connectée au réseau local (192.168.0.0/16) et un hôte Azure Bastion nommé **Bastion1** (référence SKU Standard) dans AzureBastionSubnet (10.0.1.0/26).
        - **VNet-App** (10.1.0.0/16) est relié à VNet-Hub par un peering et utilise sa passerelle distante. Son sous-réseau **Subnet-App** héberge des machines virtuelles Windows et est associé au groupe de sécurité réseau **NSG-App**, qui ne contient que les règles par défaut.
        - **VNet-Test** (10.2.0.0/16) est relié à VNet-App par un peering.

        Vous devez faire en sorte que les connexions RDP aux machines virtuelles de Subnet-App ne soient possibles que via Bastion1. RDP depuis le réseau local et depuis VNet-Test doit être bloqué. Tout le reste du trafic doit rester inchangé.

        Quelles sont les deux règles entrantes à ajouter à NSG-App ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Priority 100: deny TCP 3389 from Any", fr: "Priorité 100 : refuser TCP 3389 depuis Any" } }
        - { id: b, text: { en: "Priority 110: allow TCP 3389 from the GatewayManager service tag", fr: "Priorité 110 : autoriser TCP 3389 depuis l'étiquette de service GatewayManager" } }
        - { id: c, text: { en: "Priority 150: allow TCP 3389 from 10.0.1.0/26", fr: "Priorité 150 : autoriser TCP 3389 depuis 10.0.1.0/26" } }
        - { id: d, text: { en: "Priority 200: deny TCP 3389 from the VirtualNetwork service tag", fr: "Priorité 200 : refuser TCP 3389 depuis l'étiquette de service VirtualNetwork" } }
        - { id: e, text: { en: "Priority 250: deny TCP 3389 from the Internet service tag", fr: "Priorité 250 : refuser TCP 3389 depuis l'étiquette de service Internet" } }
        - { id: f, text: { en: "Priority 300: allow TCP 3389 from the VirtualNetwork service tag", fr: "Priorité 300 : autoriser TCP 3389 depuis l'étiquette de service VirtualNetwork" } }
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          Bastion1 opens RDP sessions from the private addresses of AzureBastionSubnet, so an allow rule for 10.0.1.0/26 at priority 150 admits them. Without a custom deny, AllowVNetInBound (65000) keeps allowing RDP from VNet-Test and from on-premises, because both belong to the VirtualNetwork tag of VNet-App; the deny rule at 200 blocks them and is processed after the Bastion allow rule. Both rules only cover TCP 3389, so other traffic is unchanged.
        fr: |
          Bastion1 ouvre les sessions RDP depuis les adresses privées d'AzureBastionSubnet : une règle d'autorisation pour 10.0.1.0/26 de priorité 150 les laisse passer. Sans refus personnalisé, AllowVNetInBound (65000) continue d'autoriser RDP depuis VNet-Test et depuis le réseau local, car les deux font partie de l'étiquette VirtualNetwork de VNet-App ; la règle de refus de priorité 200 les bloque et elle est traitée après la règle d'autorisation de Bastion. Les deux règles ne couvrent que TCP 3389 : le reste du trafic est inchangé.
      options:
        a: { en: "At priority 100, this deny is processed before any allow rule you add at a higher number, so it also blocks the sessions of Bastion1.", fr: "Avec la priorité 100, ce refus est traité avant toute règle d'autorisation ajoutée avec un numéro supérieur : il bloque aussi les sessions de Bastion1." }
        b: { en: "GatewayManager is the source of the control-plane traffic sent to AzureBastionSubnet; RDP sessions reach the VMs from the private addresses of AzureBastionSubnet.", fr: "GatewayManager est la source du trafic du plan de contrôle envoyé à AzureBastionSubnet ; les sessions RDP arrivent sur les machines virtuelles depuis les adresses privées d'AzureBastionSubnet." }
        e: { en: "RDP from the internet is already denied by DenyAllInBound; this rule doesn't block VNet-Test or on-premises, which match AllowVNetInBound.", fr: "RDP depuis Internet est déjà refusé par DenyAllInBound ; cette règle ne bloque ni VNet-Test ni le réseau local, qui correspondent à AllowVNetInBound." }
        f: { en: "This rule allows RDP from VNet-Test and from on-premises, which is exactly what must be blocked.", fr: "Cette règle autorise RDP depuis VNet-Test et depuis le réseau local, c'est-à-dire ce qui doit être bloqué." }
    references:
      - title: Configure NSG rules for Azure Bastion
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview

  # ------------------------------------------------------------------ 7
  - id: az104-qz-42-07
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        A virtual network named **VNet1** (10.1.0.0/16) contains two subnets. **VM1** (10.1.1.4) is connected to **Subnet1** (10.1.1.0/24), and **VM2** (10.1.2.4) is connected to **Subnet2** (10.1.2.0/24). Four network security groups apply:

        - **NSG-VM1** is associated with the network interface of VM1, and **NSG-Sub1** with Subnet1.
        - **NSG-Sub2** is associated with Subnet2, and **NSG-VM2** with the network interface of VM2.

        The custom rules of the four NSGs are shown in the following table; they all use TCP. Each NSG also contains the default rules.

        VM1 initiates three connections to VM2, and all three fail. For each connection, select the rule that blocks it.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un réseau virtuel nommé **VNet1** (10.1.0.0/16) contient deux sous-réseaux. **VM1** (10.1.1.4) est connectée à **Subnet1** (10.1.1.0/24), et **VM2** (10.1.2.4) à **Subnet2** (10.1.2.0/24). Quatre groupes de sécurité réseau s'appliquent :

        - **NSG-VM1** est associé à l'interface réseau de VM1, et **NSG-Sub1** à Subnet1.
        - **NSG-Sub2** est associé à Subnet2, et **NSG-VM2** à l'interface réseau de VM2.

        Les règles personnalisées des quatre NSG figurent dans le tableau suivant ; elles utilisent toutes TCP. Chaque NSG contient aussi les règles par défaut.

        VM1 lance trois connexions vers VM2, et les trois échouent. Pour chaque connexion, sélectionnez la règle qui la bloque.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "VM1 to VM2 on TCP port 1433", fr: "De VM1 vers VM2 sur le port TCP 1433" }
        - id: p2
          text: { en: "VM1 to VM2 on TCP port 22", fr: "De VM1 vers VM2 sur le port TCP 22" }
        - id: p3
          text: { en: "VM1 to VM2 on TCP port 8080", fr: "De VM1 vers VM2 sur le port TCP 8080" }
      grid:
        caption: { en: "Custom security rules", fr: "Règles de sécurité personnalisées" }
        header: [ NSG, { en: Direction, fr: Sens }, { en: Priority, fr: Priorité }, { en: Name, fr: Nom }, Source, Destination, Port, Action ]
        rows:
          - [ { text: NSG-VM1 }, { text: { en: Outbound, fr: Sortant } }, { text: "100" }, { text: Allow-Sql, area: vm1_100 }, { text: 10.1.1.4 }, { text: 10.1.2.0/24 }, { text: "1433" }, { text: Allow } ]
          - [ { text: NSG-VM1 }, { text: { en: Outbound, fr: Sortant } }, { text: "200" }, { text: Deny-8080, area: vm1_200 }, { text: Any }, { text: VirtualNetwork }, { text: "8080" }, { text: Deny } ]
          - [ { text: NSG-Sub1 }, { text: { en: Outbound, fr: Sortant } }, { text: "100" }, { text: Deny-Sql-VM2, area: s1_100 }, { text: Any }, { text: 10.1.2.4 }, { text: "1433" }, { text: Deny } ]
          - [ { text: NSG-Sub1 }, { text: { en: Outbound, fr: Sortant } }, { text: "300" }, { text: Deny-Web, area: s1_300 }, { text: Any }, { text: 10.1.2.0/24 }, { text: "8080" }, { text: Deny } ]
          - [ { text: NSG-Sub2 }, { text: { en: Inbound, fr: Entrant } }, { text: "100" }, { text: Allow-Ssh-Sub1, area: s2_100 }, { text: 10.1.1.0/24 }, { text: Any }, { text: "22" }, { text: Allow } ]
          - [ { text: NSG-Sub2 }, { text: { en: Inbound, fr: Entrant } }, { text: "200" }, { text: Deny-Ssh-VNet, area: s2_200 }, { text: VirtualNetwork }, { text: Any }, { text: "22" }, { text: Deny } ]
          - [ { text: NSG-VM2 }, { text: { en: Inbound, fr: Entrant } }, { text: "100" }, { text: Deny-Ssh-All, area: vm2_100 }, { text: Any }, { text: Any }, { text: "22" }, { text: Deny } ]
          - [ { text: NSG-VM2 }, { text: { en: Inbound, fr: Entrant } }, { text: "200" }, { text: Allow-Ssh-VM1, area: vm2_200 }, { text: 10.1.1.4 }, { text: Any }, { text: "22" }, { text: Allow } ]
    answer:
      values: { p1: s1_100, p2: vm2_100, p3: vm1_200 }
    explanation:
      correct:
        en: |
          The flow leaves VM1 through NSG-VM1 then NSG-Sub1 (outbound: network interface first, then subnet), and reaches VM2 through NSG-Sub2 then NSG-VM2 (inbound: subnet first, then network interface); every NSG on the path must allow it. TCP 1433 is allowed by Allow-Sql in NSG-VM1 but denied by Deny-Sql-VM2 in NSG-Sub1. TCP 22 passes both outbound NSGs through AllowVnetOutBound and Allow-Ssh-Sub1 in NSG-Sub2, then Deny-Ssh-All (100) in NSG-VM2 matches before Allow-Ssh-VM1. TCP 8080 is dropped by Deny-8080 in NSG-VM1, because VirtualNetwork includes 10.1.2.4; NSG-Sub1 never evaluates it.
        fr: |
          Le flux sort de VM1 par NSG-VM1 puis NSG-Sub1 (en sortie : l'interface réseau d'abord, puis le sous-réseau), et atteint VM2 par NSG-Sub2 puis NSG-VM2 (en entrée : le sous-réseau d'abord, puis l'interface réseau) ; chaque NSG du chemin doit l'autoriser. TCP 1433 est autorisé par Allow-Sql dans NSG-VM1, mais refusé par Deny-Sql-VM2 dans NSG-Sub1. TCP 22 traverse les deux NSG sortants grâce à AllowVnetOutBound et passe Allow-Ssh-Sub1 dans NSG-Sub2, puis Deny-Ssh-All (100) correspond dans NSG-VM2 avant Allow-Ssh-VM1. TCP 8080 est rejeté par Deny-8080 dans NSG-VM1, car VirtualNetwork inclut 10.1.2.4 ; NSG-Sub1 ne l'évalue jamais.
      options:
        vm1_100: { en: "Allow-Sql allows TCP 1433 in NSG-VM1, but NSG-Sub1 must allow it too.", fr: "Allow-Sql autorise TCP 1433 dans NSG-VM1, mais NSG-Sub1 doit l'autoriser aussi." }
        s1_300: { en: "For outbound traffic, NSG-VM1 is evaluated first and Deny-8080 already drops the flow, so NSG-Sub1 never sees it.", fr: "Pour le trafic sortant, NSG-VM1 est évalué en premier et Deny-8080 rejette déjà le flux : NSG-Sub1 ne le voit jamais." }
        s2_200: { en: "Allow-Ssh-Sub1 (100) matches first in NSG-Sub2, so Deny-Ssh-VNet is never reached.", fr: "Allow-Ssh-Sub1 (100) correspond en premier dans NSG-Sub2 : Deny-Ssh-VNet n'est jamais atteinte." }
        vm2_200: { en: "Deny-Ssh-All (100) matches first in NSG-VM2; a more specific rule with a higher number is never reached.", fr: "Deny-Ssh-All (100) correspond en premier dans NSG-VM2 ; une règle plus précise de numéro supérieur n'est jamais atteinte." }
    references:
      - title: How Network Security Groups Filter Network Traffic in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works

  # ------------------------------------------------------------------ 8
  - id: az104-qz-42-08
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an Azure SQL Database logical server named **sql-fab** in West Europe. You plan to allow access to sql-fab only from selected subnets: you will enable a Microsoft.Sql service endpoint on each subnet and add a virtual network rule for it to sql-fab. **Allow Azure services and resources to access this server** will be set to **No**, and sql-fab will have no IP firewall rules.

        The clients of sql-fab are in the following subnets:

        | Subnet | Virtual network | Region | Subscription |
        | --- | --- | --- | --- |
        | Subnet1 | VNet1 | West Europe | Sub1 |
        | Subnet2 | VNet2 | West Europe | Sub2 |
        | Subnet3 | VNet3, globally peered with VNet1 | North Europe | Sub1 |
        | Subnet4 | VNet4 | West Europe | Sub3 |
        | GatewaySubnet | VNet1, VPN gateway for the on-premises servers | West Europe | Sub1 |

        Sub1 and Sub2 belong to the Microsoft Entra tenant of Fabrikam. Sub3 belongs to the tenant of a partner company. The Microsoft.Sql resource provider is registered in every subscription.

        For which two subnets will this approach let the clients connect to sql-fab?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un serveur logique Azure SQL Database nommé **sql-fab** en West Europe. Vous prévoyez de n'autoriser l'accès à sql-fab que depuis des sous-réseaux choisis : vous activerez un point de terminaison de service Microsoft.Sql sur chaque sous-réseau et ajouterez à sql-fab une règle de réseau virtuel pour ce sous-réseau. **Allow Azure services and resources to access this server** sera défini sur **No**, et sql-fab n'aura aucune règle de pare-feu IP.

        Les clients de sql-fab se trouvent dans les sous-réseaux suivants :

        | Sous-réseau | Réseau virtuel | Région | Abonnement |
        | --- | --- | --- | --- |
        | Subnet1 | VNet1 | West Europe | Sub1 |
        | Subnet2 | VNet2 | West Europe | Sub2 |
        | Subnet3 | VNet3, relié à VNet1 par un peering mondial | North Europe | Sub1 |
        | Subnet4 | VNet4 | West Europe | Sub3 |
        | GatewaySubnet | VNet1, passerelle VPN des serveurs locaux | West Europe | Sub1 |

        Sub1 et Sub2 appartiennent au locataire Microsoft Entra de Fabrikam. Sub3 appartient au locataire d'une société partenaire. Le fournisseur de ressources Microsoft.Sql est inscrit dans tous les abonnements.

        Pour quels deux sous-réseaux cette approche permettra-t-elle aux clients de se connecter à sql-fab ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: Subnet3 }
        - { id: b, text: Subnet1 }
        - { id: c, text: Subnet4 }
        - { id: d, text: Subnet2 }
        - { id: e, text: GatewaySubnet }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          For Azure SQL Database, a service endpoint applies only within the region of its virtual network, so the referenced subnets must be in the region of the server: Subnet1 qualifies. Subnet2 is in another subscription, which is supported when both subscriptions are in the same Microsoft Entra tenant and have the Microsoft.Sql provider registered.
        fr: |
          Pour Azure SQL Database, un point de terminaison de service ne s'applique que dans la région de son réseau virtuel : les sous-réseaux référencés doivent donc être dans la région du serveur, ce qui est le cas de Subnet1. Subnet2 est dans un autre abonnement, ce qui est pris en charge quand les deux abonnements sont dans le même locataire Microsoft Entra et ont le fournisseur Microsoft.Sql inscrit.
      options:
        a: { en: "Subnet3 is in North Europe; a Microsoft.Sql service endpoint doesn't reach a server in another region, and the peering with VNet1 doesn't extend the service endpoints of VNet1.", fr: "Subnet3 est en North Europe ; un point de terminaison de service Microsoft.Sql n'atteint pas un serveur d'une autre région, et le peering avec VNet1 n'étend pas les points de terminaison de service de VNet1." }
        c: { en: "A virtual network rule can reference a subnet of another subscription only if both subscriptions are in the same Microsoft Entra tenant.", fr: "Une règle de réseau virtuel ne peut référencer un sous-réseau d'un autre abonnement que si les deux abonnements sont dans le même locataire Microsoft Entra." }
        e: { en: "Virtual network rules don't apply to traffic that comes from on-premises through a site-to-site VPN; that traffic needs IP rules for the public (NAT) addresses of the on-premises network.", fr: "Les règles de réseau virtuel ne s'appliquent pas au trafic provenant du réseau local par un VPN site à site ; ce trafic demande des règles IP pour les adresses publiques (NAT) du réseau local." }
    references:
      - title: Virtual Network Endpoints and Rules for Azure SQL Database - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 9
  - id: az104-qz-42-09
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has an Azure SQL Database logical server named **sql-tail**. The network is configured as follows:

        - **VNet-Hub** contains a VPN gateway connected to the on-premises network, a subnet named **Subnet-PE**, and an Azure DNS Private Resolver whose inbound endpoint has the IP address 10.0.5.4.
        - **VNet-Spoke1** is peered with VNet-Hub. Its app VMs use the Azure-provided DNS.
        - The on-premises DNS servers will resolve the names of sql-tail by using a conditional forwarder for database.windows.net.

        Apps in VNet-Spoke1 and on-premises clients must connect to sql-tail through a single private endpoint in Subnet-PE, and keep the server name `sql-tail.database.windows.net` in their connection strings. Public network access to sql-tail will be disabled.

        How should you complete the configuration? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un serveur logique Azure SQL Database nommé **sql-tail**. Le réseau est configuré comme suit :

        - **VNet-Hub** contient une passerelle VPN connectée au réseau local, un sous-réseau nommé **Subnet-PE** et un Azure DNS Private Resolver dont le point de terminaison entrant a l'adresse IP 10.0.5.4.
        - **VNet-Spoke1** est relié à VNet-Hub par un peering. Ses machines virtuelles d'application utilisent le DNS fourni par Azure.
        - Les serveurs DNS locaux résoudront les noms de sql-tail à l'aide d'un redirecteur conditionnel pour database.windows.net.

        Les applications de VNet-Spoke1 et les clients locaux doivent se connecter à sql-tail via un seul point de terminaison privé dans Subnet-PE, et conserver le nom de serveur `sql-tail.database.windows.net` dans leurs chaînes de connexion. L'accès réseau public à sql-tail sera désactivé.

        Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          1. Create the private endpoint in Subnet-PE with the target sub-resource [[sub]].
          2. Integrate the private endpoint with the private DNS zone [[zone]].
          3. Link the private DNS zone to [[link]].
          4. Set the target of the on-premises conditional forwarder to [[fwd]].
        fr: |
          1. Créez le point de terminaison privé dans Subnet-PE avec la sous-ressource cible [[sub]].
          2. Intégrez le point de terminaison privé à la zone DNS privée [[zone]].
          3. Liez la zone DNS privée à [[link]].
          4. Définissez la cible du redirecteur conditionnel local sur [[fwd]].
      slots:
        - id: sub
          options:
            - { id: sqlserver, text: sqlServer }
            - { id: managedinstance, text: managedInstance }
            - { id: synsql, text: Sql }
            - { id: ondemand, text: SqlOnDemand }
        - id: zone
          options:
            - { id: pubzone, text: database.windows.net }
            - { id: pldb, text: privatelink.database.windows.net }
            - { id: plsyn, text: privatelink.sql.azuresynapse.net }
        - id: link
          options:
            - { id: hub, text: { en: "VNet-Hub only", fr: "VNet-Hub uniquement" } }
            - { id: spoke, text: { en: "VNet-Spoke1 only", fr: "VNet-Spoke1 uniquement" } }
            - { id: both, text: { en: "VNet-Hub and VNet-Spoke1", fr: "VNet-Hub et VNet-Spoke1" } }
            - { id: none, text: { en: "no virtual network", fr: "aucun réseau virtuel" } }
        - id: fwd
          options:
            - { id: azdns, text: 168.63.129.16 }
            - { id: pe, text: { en: "the private IP address of the private endpoint", fr: "l'adresse IP privée du point de terminaison privé" } }
            - { id: inbound, text: 10.0.5.4 }
    answer:
      values: { sub: sqlserver, zone: pldb, link: both, fwd: inbound }
    explanation:
      correct:
        en: |
          The target sub-resource of an Azure SQL Database logical server is sqlServer, and its private DNS zone is privatelink.database.windows.net; the public name becomes a CNAME to the privatelink name, so connection strings don't change. A private DNS zone answers only the virtual networks linked to it: VNet-Spoke1 needs a link because its VMs use the Azure-provided DNS, and VNet-Hub needs one because the resolver answers through the Azure-provided DNS of VNet-Hub. The on-premises conditional forwarder must target the IP address of the resolver's inbound endpoint, 10.0.5.4.
        fr: |
          La sous-ressource cible d'un serveur logique Azure SQL Database est sqlServer, et sa zone DNS privée est privatelink.database.windows.net ; le nom public devient un CNAME vers le nom privatelink, donc les chaînes de connexion ne changent pas. Une zone DNS privée ne répond qu'aux réseaux virtuels qui lui sont liés : VNet-Spoke1 a besoin d'un lien car ses machines virtuelles utilisent le DNS fourni par Azure, et VNet-Hub en a besoin car le résolveur répond via le DNS fourni par Azure de VNet-Hub. Le redirecteur conditionnel local doit cibler l'adresse IP du point de terminaison entrant du résolveur, 10.0.5.4.
      options:
        managedinstance: { en: "managedInstance is the sub-resource of Azure SQL Managed Instance.", fr: "managedInstance est la sous-ressource d'Azure SQL Managed Instance." }
        synsql: { en: "Sql is a sub-resource of an Azure Synapse Analytics workspace.", fr: "Sql est une sous-ressource d'un espace de travail Azure Synapse Analytics." }
        ondemand: { en: "SqlOnDemand is a sub-resource of an Azure Synapse Analytics workspace.", fr: "SqlOnDemand est une sous-ressource d'un espace de travail Azure Synapse Analytics." }
        pubzone: { en: "A private zone named after the public zone would capture the names of every Azure SQL server, including servers without a private endpoint.", fr: "Une zone privée portant le nom de la zone publique capturerait les noms de tous les serveurs Azure SQL, y compris ceux sans point de terminaison privé." }
        plsyn: { en: "privatelink.sql.azuresynapse.net is the zone of Azure Synapse Analytics SQL endpoints.", fr: "privatelink.sql.azuresynapse.net est la zone des points de terminaison SQL d'Azure Synapse Analytics." }
        hub: { en: "Without a link, VNet-Spoke1 resolves the public address, which is blocked once public network access is disabled.", fr: "Sans lien, VNet-Spoke1 résout l'adresse publique, bloquée une fois l'accès réseau public désactivé." }
        spoke: { en: "The resolver in VNet-Hub can only return the private record if the zone is linked to VNet-Hub.", fr: "Le résolveur de VNet-Hub ne peut renvoyer l'enregistrement privé que si la zone est liée à VNet-Hub." }
        azdns: { en: "168.63.129.16 is the virtual IP of the Azure host that serves resources inside Azure; on-premises DNS servers forward to the inbound endpoint of the resolver.", fr: "168.63.129.16 est l'adresse IP virtuelle de l'hôte Azure qui sert les ressources dans Azure ; les serveurs DNS locaux transfèrent vers le point de terminaison entrant du résolveur." }
        pe: { en: "The private endpoint is the SQL endpoint itself, not a DNS server.", fr: "Le point de terminaison privé est le point de terminaison SQL lui-même, pas un serveur DNS." }
    references:
      - title: Azure Private Endpoint private DNS zone values
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 10
  - id: az104-qz-42-10
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has the following virtual networks in a single Microsoft Entra tenant:

        | Virtual network | Subscription | Peerings |
        | --- | --- | --- |
        | VNet-Hub | Sub-Hub | VNet-Spoke1 |
        | VNet-Spoke1 | Sub-Apps | VNet-Hub, VNet-Spoke2 |
        | VNet-Spoke2 | Sub-Apps | VNet-Spoke1 |

        An Azure Bastion host named **Bastion1** (Standard SKU) is deployed in VNet-Hub. **VM1** is connected to VNet-Spoke1 and **VM2** to VNet-Spoke2; neither has a public IP address. The subnets of VM1 and VM2 are associated with NSGs that contain only the default rules. No route table, network virtual appliance or gateway is deployed.

        An administrator named **Admin1** has the Reader role on VM1, on the network interface of VM1 and on Bastion1, and no other role assignment.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose des réseaux virtuels suivants dans un seul locataire Microsoft Entra :

        | Réseau virtuel | Abonnement | Peerings |
        | --- | --- | --- |
        | VNet-Hub | Sub-Hub | VNet-Spoke1 |
        | VNet-Spoke1 | Sub-Apps | VNet-Hub, VNet-Spoke2 |
        | VNet-Spoke2 | Sub-Apps | VNet-Spoke1 |

        Un hôte Azure Bastion nommé **Bastion1** (référence SKU Standard) est déployé dans VNet-Hub. **VM1** est connectée à VNet-Spoke1 et **VM2** à VNet-Spoke2 ; aucune n'a d'adresse IP publique. Les sous-réseaux de VM1 et VM2 sont associés à des NSG qui ne contiennent que les règles par défaut. Aucune table de routage, appliance virtuelle réseau ou passerelle n'est déployée.

        Un administrateur nommé **Admin1** a le rôle Reader sur VM1, sur l'interface réseau de VM1 et sur Bastion1, et aucune autre attribution de rôle.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With the current NSG rules, an RDP session opened from Bastion1 to VM1 is allowed.", fr: "Avec les règles de NSG actuelles, une session RDP ouverte depuis Bastion1 vers VM1 est autorisée." }
        - id: s2
          text: { en: "Admin1 can connect to VM1 from the Azure portal through Bastion1.", fr: "Admin1 peut se connecter à VM1 depuis le portail Azure via Bastion1." }
        - id: s3
          text: { en: "Bastion1 can reach VM2 by using an IP-based connection to the private IP address of VM2.", fr: "Bastion1 peut joindre VM2 au moyen d'une connexion basée sur IP vers l'adresse IP privée de VM2." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Azure Bastion serves the VMs of directly peered virtual networks, including peerings across subscriptions of the same tenant, and the default rule AllowVNetInBound admits the sessions coming from the peered hub. When the bastion is in a peered virtual network, the user also needs the Reader role on the virtual network of the target VM, which Admin1 lacks on VNet-Spoke1. Peering isn't transitive: without a gateway, an appliance or routes, VNet-Hub has no path to VNet-Spoke2, so even an IP-based connection can't reach VM2.
        fr: |
          Azure Bastion dessert les machines virtuelles des réseaux virtuels directement reliés par peering, y compris entre abonnements du même locataire, et la règle par défaut AllowVNetInBound admet les sessions venant du hub relié par peering. Quand le bastion est dans un réseau virtuel relié par peering, l'utilisateur a aussi besoin du rôle Reader sur le réseau virtuel de la machine cible, ce qui manque à Admin1 sur VNet-Spoke1. Le peering n'est pas transitif : sans passerelle, appliance ou itinéraires, VNet-Hub n'a aucun chemin vers VNet-Spoke2, donc même une connexion basée sur IP ne peut pas joindre VM2.
      options:
        s2: { en: "With the bastion in a peered virtual network, Reader on VNet-Spoke1 is also required.", fr: "Avec le bastion dans un réseau virtuel relié par peering, Reader sur VNet-Spoke1 est aussi nécessaire." }
        s3: { en: "VNet-Spoke2 is peered only with VNet-Spoke1, and peering isn't transitive.", fr: "VNet-Spoke2 n'est relié par peering qu'à VNet-Spoke1, et le peering n'est pas transitif." }
    references:
      - title: Azure Bastion FAQ
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-faq
      - title: VNet peering and Azure Bastion architecture
        url: https://learn.microsoft.com/en-us/azure/bastion/vnet-peering
