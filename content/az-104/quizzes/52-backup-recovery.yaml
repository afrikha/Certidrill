chapter: 52-backup-recovery
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-52-01
    objective: "5.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Your company runs Azure virtual machines in West Europe. If a regional outage occurs, the virtual machines must be running again in North Europe within minutes, and no more than a few minutes of data can be lost.

        Which service should you use?
      fr: |
        Votre entreprise exécute des machines virtuelles Azure dans West Europe. En cas de panne régionale, les machines virtuelles doivent fonctionner de nouveau dans North Europe en quelques minutes, et la perte de données ne doit pas dépasser quelques minutes.

        Quel service devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
        - { id: b, text: { en: "Azure Backup with Cross Region Restore", fr: "Sauvegarde Azure avec la restauration interrégion" } }
        - { id: c, text: { en: "Azure Backup with an Enhanced policy", fr: "Sauvegarde Azure avec une stratégie Enhanced" } }
        - { id: d, text: { en: "Azure Disk Backup in a Backup vault", fr: "Sauvegarde de disque Azure dans un coffre de sauvegarde" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: "Azure Site Recovery replicates the virtual machines continuously to the target region and keeps them ready to start, so a failover gives an RTO and an RPO measured in minutes. Azure Backup keeps scheduled recovery points to recover data, which gives an RPO and an RTO measured in hours."
        fr: "Azure Site Recovery réplique en continu les machines virtuelles vers la région cible et les garde prêtes à démarrer ; un basculement donne donc un RTO et un RPO de l'ordre de quelques minutes. Sauvegarde Azure conserve des points de récupération planifiés pour récupérer des données, avec un RPO et un RTO de l'ordre de quelques heures."
      options:
        b:
          en: "Cross Region Restore restores scheduled, vault-tier recovery points in the paired region. Each restore creates a machine from a backup that can be many hours old, so neither the RPO nor the RTO is in minutes."
          fr: "La restauration interrégion restaure dans la région jumelée des points de récupération planifiés du niveau coffre. Chaque restauration crée une machine à partir d'une sauvegarde qui peut dater de plusieurs heures : ni le RPO ni le RTO ne sont de quelques minutes."
        c:
          en: "The Enhanced policy backs up at most every 4 hours and still requires a restore, so data loss and downtime are counted in hours."
          fr: "La stratégie Enhanced sauvegarde au mieux toutes les 4 heures et exige toujours une restauration : la perte de données et l'interruption se comptent en heures."
        d:
          en: "Azure Disk Backup takes scheduled snapshots of individual managed disks and restores them as new disks. It doesn't keep virtual machines ready to start in another region."
          fr: "La sauvegarde de disque Azure prend des instantanés planifiés de disques managés isolés et les restaure sous forme de nouveaux disques. Elle ne garde pas de machines virtuelles prêtes à démarrer dans une autre région."
    references:
      - title: About Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview

  # ------------------------------------------------------------------ 2
  - id: az104-qz-52-02
    objective: "5.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You try to delete a Recovery Services vault named **RSV-Old**. The deletion fails because RSV-Old still protects three Azure virtual machines.

        Which action must you perform on the backup item of each virtual machine before you can delete RSV-Old?
      fr: |
        Vous essayez de supprimer un coffre Recovery Services nommé **RSV-Old**. La suppression échoue, car RSV-Old protège encore trois machines virtuelles Azure.

        Quelle action devez-vous effectuer sur l'élément de sauvegarde de chaque machine virtuelle avant de pouvoir supprimer RSV-Old ?
    body:
      options:
        - { id: a, text: { en: "Stop backup and delete the backup data", fr: "Arrêter la sauvegarde et supprimer les données de sauvegarde" } }
        - { id: b, text: { en: "Stop backup and retain the backup data", fr: "Arrêter la sauvegarde et conserver les données de sauvegarde" } }
        - { id: c, text: { en: "Delete the virtual machine", fr: "Supprimer la machine virtuelle" } }
        - { id: d, text: { en: "Delete the backup policy of the virtual machine", fr: "Supprimer la stratégie de sauvegarde de la machine virtuelle" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: "A vault can't be deleted while it contains protected items or backup data, including soft-deleted data. You stop backup and delete the backup data of every item, then make sure no item remains in the soft-deleted state (permanently delete it, or wait for the soft delete period to end), and unregister any servers and storage accounts before you delete the vault."
        fr: "Un coffre ne peut pas être supprimé tant qu'il contient des éléments protégés ou des données de sauvegarde, y compris des données supprimées de façon réversible. Vous arrêtez la sauvegarde et supprimez les données de sauvegarde de chaque élément, puis vous vous assurez qu'aucun élément ne reste en suppression réversible (supprimez-le définitivement ou attendez la fin de la période de suppression réversible), et vous désinscrivez les serveurs et comptes de stockage avant de supprimer le coffre."
      options:
        b:
          en: "Retained backup data stays in the vault, and a vault that contains backup data can't be deleted."
          fr: "Les données de sauvegarde conservées restent dans le coffre, et un coffre qui contient des données de sauvegarde ne peut pas être supprimé."
        c:
          en: "Deleting the virtual machine doesn't remove its backup item or recovery points from the vault, so the deletion still fails. Learn states that you don't need to delete the virtual machine."
          fr: "Supprimer la machine virtuelle ne retire ni son élément de sauvegarde ni ses points de récupération du coffre : la suppression échoue toujours. Learn précise qu'il n'est pas nécessaire de supprimer la machine virtuelle."
        d:
          en: "A policy that still protects items can't be deleted, and deleting a policy isn't a prerequisite for deleting the vault; the backup items and their data are."
          fr: "Une stratégie qui protège encore des éléments ne peut pas être supprimée, et la suppression d'une stratégie n'est pas un prérequis à la suppression du coffre ; ce sont les éléments de sauvegarde et leurs données qui le sont."
    references:
      - title: Delete a Microsoft Azure Recovery Services Vault - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-delete-vault

  # ------------------------------------------------------------------ 3
  - id: az104-qz-52-03
    objective: "5.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso uses a Backup vault named **BV1** to protect the block blobs of a storage account named **stcontracts**. A compliance rule states that the blobs must remain recoverable even if stcontracts itself is deleted.

        Which data protection option meets the requirement?
      fr: |
        Contoso utilise un coffre de sauvegarde nommé **BV1** pour protéger les objets blob de blocs d'un compte de stockage nommé **stcontracts**. Une règle de conformité exige que les objets blob restent récupérables même si stcontracts lui-même est supprimé.

        Quelle option de protection des données répond à l'exigence ?
    body:
      options:
        - { id: a, text: { en: "Operational backup of stcontracts with BV1", fr: "Sauvegarde opérationnelle (operational backup) de stcontracts avec BV1" } }
        - { id: b, text: { en: "Vaulted backup of stcontracts with BV1", fr: "Sauvegarde dans le coffre (vaulted backup) de stcontracts avec BV1" } }
        - { id: c, text: { en: "Blob soft delete on stcontracts", fr: "Suppression réversible des objets blob sur stcontracts" } }
        - { id: d, text: { en: "Container soft delete on stcontracts", fr: "Suppression réversible des conteneurs sur stcontracts" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Vaulted backup copies the blob data to the Backup vault on the schedule of the backup policy. Because the copies live outside the storage account, they protect against the accidental or malicious deletion of the blobs and of the storage account itself."
        fr: "La sauvegarde dans le coffre copie les données des objets blob dans le coffre de sauvegarde selon la planification de la stratégie de sauvegarde. Comme ces copies se trouvent hors du compte de stockage, elles protègent contre la suppression accidentelle ou malveillante des objets blob et du compte de stockage lui-même."
      options:
        a:
          en: "Operational backup is continuous but local: its data stays in the source storage account and is not transferred to the vault. It only applies a delete lock to make the deletion of the account less likely; it keeps no copy outside the account."
          fr: "La sauvegarde opérationnelle est continue mais locale : ses données restent dans le compte de stockage source et ne sont pas transférées dans le coffre. Elle pose seulement un verrou de suppression pour rendre la suppression du compte moins probable ; elle ne garde aucune copie hors du compte."
        c:
          en: "Blob soft delete keeps deleted blobs inside the same storage account, so it doesn't survive the deletion of the account."
          fr: "La suppression réversible des objets blob conserve les objets blob supprimés dans le même compte de stockage : elle ne survit pas à la suppression du compte."
        d:
          en: "Container soft delete keeps deleted containers inside the same storage account, so it doesn't survive the deletion of the account."
          fr: "La suppression réversible des conteneurs conserve les conteneurs supprimés dans le même compte de stockage : elle ne survit pas à la suppression du compte."
    references:
      - title: Overview of Azure Blobs backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview

  # ------------------------------------------------------------------ 4
  - id: az104-qz-52-04
    objective: "5.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has a Recovery Services vault named **RSV-Ops** in West Europe. RSV-Ops contains a Standard backup policy named **PolicyDaily** that backs up at 23:00 every day and keeps the daily recovery points for 30 days. PolicyDaily protects two virtual machines in a resource group named **RG-App** in West Europe.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un coffre Recovery Services nommé **RSV-Ops** dans West Europe. RSV-Ops contient une stratégie de sauvegarde Standard nommée **PolicyDaily** qui sauvegarde chaque jour à 23:00 et conserve les points de récupération quotidiens pendant 30 jours. PolicyDaily protège deux machines virtuelles d'un groupe de ressources nommé **RG-App** dans West Europe.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "You can configure PolicyDaily to also keep the Sunday recovery point for 12 weeks."
            fr: "Vous pouvez configurer PolicyDaily pour conserver en plus le point de récupération du dimanche pendant 12 semaines."
        - id: s2
          text:
            en: "You can configure PolicyDaily to create a recovery point every 6 hours."
            fr: "Vous pouvez configurer PolicyDaily pour créer un point de récupération toutes les 6 heures."
        - id: s3
          text:
            en: "PolicyDaily can protect a virtual machine named VM3 that is in a resource group named RG-Data in West Europe."
            fr: "PolicyDaily peut protéger une machine virtuelle nommée VM3 qui se trouve dans un groupe de ressources nommé RG-Data dans West Europe."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: "A backup policy combines one schedule with several retention ranges, so a daily policy can also keep weekly, monthly and yearly points, such as the Sunday point for 12 weeks. A Standard policy backs up at most once a day; several backups per day require an Enhanced policy. A policy protects many virtual machines of the vault's region, whatever their resource group."
        fr: "Une stratégie de sauvegarde associe une planification à plusieurs durées de rétention ; une stratégie quotidienne peut donc aussi conserver des points hebdomadaires, mensuels et annuels, comme le point du dimanche pendant 12 semaines. Une stratégie Standard sauvegarde au plus une fois par jour ; plusieurs sauvegardes par jour exigent une stratégie Enhanced. Une stratégie protège de nombreuses machines virtuelles de la région du coffre, quel que soit leur groupe de ressources."
      options:
        s2:
          en: "An interval of 4, 6, 8, 12 or 24 hours is an Hourly schedule, which only the Enhanced policy offers."
          fr: "Un intervalle de 4, 6, 8, 12 ou 24 heures correspond à une planification Hourly, que seule la stratégie Enhanced propose."
        s3:
          en: "The vault must be in the same region as the virtual machine, but not in the same resource group, so VM3 can use PolicyDaily."
          fr: "Le coffre doit être dans la même région que la machine virtuelle, mais pas dans le même groupe de ressources : VM3 peut donc utiliser PolicyDaily."
    references:
      - title: Back Up Azure VMs in a Recovery Services Vault - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-vms-prepare
      - title: Back Up Azure VMs with the Enhanced Policy - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy

  # ------------------------------------------------------------------ 5
  - id: az104-qz-52-05
    objective: "5.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An Azure virtual machine named **VM-App1** was deleted by mistake. VM-App1 was backed up every day to a Recovery Services vault in the same region.

        You need to recreate VM-App1 from yesterday's recovery point in an existing availability set named **AS-App**, which is in the same region.

        Which restore option should you use?
      fr: |
        Une machine virtuelle Azure nommée **VM-App1** a été supprimée par erreur. VM-App1 était sauvegardée chaque jour dans un coffre Recovery Services de la même région.

        Vous devez recréer VM-App1 à partir du point de récupération d'hier dans un groupe à haute disponibilité existant nommé **AS-App**, qui se trouve dans la même région.

        Quelle option de restauration devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Create new virtual machine", fr: "Créer une machine virtuelle" } }
        - { id: b, text: { en: "Replace existing", fr: "Remplacer l'existant" } }
        - { id: c, text: { en: "Restore disks", fr: "Restaurer les disques" } }
        - { id: d, text: { en: "File recovery", fr: "Récupération de fichiers" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: "Restore disks restores the disks and generates a template. You then deploy the virtual machine from the disks with the template or PowerShell, which is where you specify settings that the portal restore doesn't offer, such as the availability set AS-App."
        fr: "Restaurer les disques restaure les disques et génère un modèle. Vous déployez ensuite la machine virtuelle à partir des disques avec ce modèle ou PowerShell, et c'est là que vous indiquez les paramètres que la restauration du portail ne propose pas, comme le groupe à haute disponibilité AS-App."
      options:
        a:
          en: "Create new quickly creates a basic virtual machine, but the portal offers no availability set choice, so the restored machine isn't in an availability set."
          fr: "Créer une machine virtuelle crée rapidement une machine de base, mais le portail ne propose aucun choix de groupe à haute disponibilité : la machine restaurée n'appartient à aucun groupe à haute disponibilité."
        b:
          en: "Replace existing replaces the disks of a virtual machine that still exists. VM-App1 was deleted, so this option can't be used."
          fr: "Remplacer l'existant remplace les disques d'une machine virtuelle qui existe encore. VM-App1 a été supprimée : cette option est inutilisable."
        d:
          en: "File recovery mounts a recovery point to copy individual files; it doesn't recreate a virtual machine."
          fr: "La récupération de fichiers monte un point de récupération pour copier des fichiers isolés ; elle ne recrée pas de machine virtuelle."
    references:
      - title: Restore VMs by using the Azure portal using Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms

  # ------------------------------------------------------------------ 6
  - id: az104-qz-52-06
    objective: "5.2.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam has an Azure subscription named **Sub1** that contains 12 Recovery Services vaults, including vaults named **RSV-Prod1** and **RSV-Test**. All the vaults send their diagnostic data in resource-specific mode to a Log Analytics workspace named **law-backup**. The vaults use the default monitoring settings, and no alert rule or alert processing rule exists.

        You have the following requirements:

        - RSV-Test must no longer generate alerts for failed backup and restore jobs. Its security alerts must not change.
        - The operations team wants an alert only when the same Azure virtual machine backup item in RSV-Prod1 fails more than once within 24 hours.
        - The security team wants a text message whenever soft delete is disabled on any vault in Sub1.

        What should you use for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un abonnement Azure nommé **Sub1** qui contient 12 coffres Recovery Services, dont des coffres nommés **RSV-Prod1** et **RSV-Test**. Tous les coffres envoient leurs données de diagnostic en mode propre à la ressource (resource-specific) vers un espace de travail Log Analytics nommé **law-backup**. Les coffres utilisent les paramètres de supervision par défaut, et il n'existe aucune règle d'alerte ni aucune règle de traitement des alertes.

        Vous avez les exigences suivantes :

        - RSV-Test ne doit plus générer d'alertes pour les travaux de sauvegarde et de restauration en échec. Ses alertes de sécurité ne doivent pas changer.
        - L'équipe d'exploitation veut une alerte uniquement lorsque le même élément de sauvegarde de machine virtuelle Azure de RSV-Prod1 échoue plus d'une fois en 24 heures.
        - L'équipe de sécurité veut un SMS chaque fois que la suppression réversible est désactivée sur un coffre de Sub1.

        Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: mon, text: { en: "Turn off the built-in alerts for job failures in the monitoring settings of the vault", fr: "Désactiver les alertes intégrées d'échec de travaux dans les paramètres de supervision du coffre" } }
        - { id: sup, text: { en: "An alert processing rule that suppresses notifications", fr: "Une règle de traitement des alertes qui supprime les notifications" } }
        - { id: apr, text: { en: "An alert processing rule that applies an action group", fr: "Une règle de traitement des alertes qui applique un groupe d'actions" } }
        - { id: lsa, text: { en: "A log search alert rule on law-backup", fr: "Une règle d'alerte de recherche dans les journaux sur law-backup" } }
        - { id: reports, text: { en: "Backup reports", fr: "Rapports de sauvegarde" } }
      targets:
        - { id: test, text: { en: "No more job failure alerts for RSV-Test", fr: "Plus d'alertes d'échec de travaux pour RSV-Test" } }
        - { id: repeat, text: { en: "Alert when the same item fails more than once in 24 hours", fr: "Alerte lorsque le même élément échoue plus d'une fois en 24 heures" } }
        - { id: sms, text: { en: "Text message when soft delete is disabled", fr: "SMS lorsque la suppression réversible est désactivée" } }
    answer:
      mapping: { test: mon, repeat: lsa, sms: apr }
    explanation:
      correct:
        en: "Built-in alerts for backup and restore job failures are generated by default and can be turned off in the monitoring settings of a vault, while security alerts for destructive operations can't be turned off and stay unchanged. The built-in alerts have no condition such as \"more than once for the same item\", so a log search alert rule queries the AddonAzureBackupJobs table in law-backup, counts the failed jobs per backup item over a 24-hour period, and fires above a threshold of one. Disabling soft delete already raises a built-in security alert, but it notifies nobody: an alert processing rule on Sub1 that applies an action group with SMS sends the message."
        fr: "Les alertes intégrées d'échec des travaux de sauvegarde et de restauration sont générées par défaut et peuvent être désactivées dans les paramètres de supervision d'un coffre, tandis que les alertes de sécurité des opérations destructrices ne peuvent pas être désactivées et restent inchangées. Les alertes intégrées n'offrent pas de condition comme « plus d'une fois pour le même élément » : une règle d'alerte de recherche dans les journaux interroge la table AddonAzureBackupJobs de law-backup, compte les travaux en échec par élément de sauvegarde sur une période de 24 heures et se déclenche au-delà d'un seuil de un. La désactivation de la suppression réversible déclenche déjà une alerte de sécurité intégrée, mais elle ne notifie personne : une règle de traitement des alertes sur Sub1 qui applique un groupe d'actions avec SMS envoie le message."
      options:
        sup:
          en: "Suppression only removes the action groups from the fired alerts: the job failure alerts of RSV-Test are still generated and stay visible in the portal."
          fr: "La suppression retire seulement les groupes d'actions des alertes déclenchées : les alertes d'échec de travaux de RSV-Test sont toujours générées et restent visibles dans le portail."
        reports:
          en: "Backup reports show the history of jobs, usage and policy adherence from law-backup; they don't raise alerts."
          fr: "Les rapports de sauvegarde affichent l'historique des travaux, de l'utilisation et du respect des stratégies à partir de law-backup ; ils ne déclenchent pas d'alertes."
    references:
      - title: Manage Azure Monitor based alerts for Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-monitoring-alerts
      - title: Azure Monitor Logs in Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-monitoring-use-azuremonitor

  # ------------------------------------------------------------------ 7
  - id: az104-qz-52-07
    objective: "5.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware replicates an Azure virtual machine named **VM-Web1** from West Europe to North Europe by using Azure Site Recovery. VM-Web1 is not part of a recovery plan.

        During an outage in West Europe, you plan to fail over VM-Web1 to North Europe and to select the **Shut down machine before beginning failover** option.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware réplique une machine virtuelle Azure nommée **VM-Web1** de West Europe vers North Europe avec Azure Site Recovery. VM-Web1 ne fait partie d'aucun plan de récupération.

        Pendant une panne dans West Europe, vous prévoyez de basculer VM-Web1 vers North Europe en sélectionnant l'option **Shut down machine before beginning failover**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "If the shutdown of VM-Web1 in West Europe fails, the failover is canceled."
            fr: "Si l'arrêt de VM-Web1 dans West Europe échoue, le basculement est annulé."
        - id: s2
          text:
            en: "After the failover completes, and before you commit it, you can switch VM-Web1 to a different recovery point."
            fr: "Une fois le basculement terminé, et avant de le valider, vous pouvez faire passer VM-Web1 à un autre point de récupération."
        - id: s3
          text:
            en: "When you commit the failover, Site Recovery starts replicating VM-Web1 from North Europe to West Europe."
            fr: "Lorsque vous validez le basculement, Site Recovery commence à répliquer VM-Web1 de North Europe vers West Europe."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: "Site Recovery tries to shut down the source machine to avoid data loss, but the failover continues even if the shutdown fails. Until you commit, the recovery points are kept and you can use Change recovery point; committing deletes the other recovery points. Commit only completes the failover; replication back to West Europe starts when you re-protect the virtual machine."
        fr: "Site Recovery tente d'arrêter la machine source pour éviter une perte de données, mais le basculement continue même si l'arrêt échoue. Tant que vous n'avez pas validé, les points de récupération sont conservés et vous pouvez utiliser Change recovery point ; la validation supprime les autres points de récupération. La validation ne fait que terminer le basculement ; la réplication vers West Europe démarre lorsque vous reprotégez la machine virtuelle."
      options:
        s1:
          en: "The shutdown is a best effort. During a real outage the source region may be unreachable, so the failover doesn't depend on it."
          fr: "L'arrêt est tenté au mieux. Pendant une vraie panne, la région source peut être injoignable : le basculement n'en dépend donc pas."
        s3:
          en: "Re-protect is a separate operation that you start after the status becomes Failover committed."
          fr: "La reprotection est une opération distincte que vous lancez une fois l'état passé à Failover committed."
    references:
      - title: Tutorial to fail over Azure VMs to a secondary region for disaster recovery with Azure Site Recovery. - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-failover-failback

  # ------------------------------------------------------------------ 8
  - id: az104-qz-52-08
    objective: "5.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an Azure virtual machine named **VM-Erp1** in West Europe. VM-Erp1 uses managed disks, is connected to a virtual network named **VNet-Erp**, and is in neither an availability set nor an availability zone. You created a Recovery Services vault named **RSV-DR** in North Europe.

        You enable replication of VM-Erp1 to North Europe by using Azure Site Recovery, and you keep the default target settings.

        Which three resources does Site Recovery create in North Europe when you enable replication?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une machine virtuelle Azure nommée **VM-Erp1** dans West Europe. VM-Erp1 utilise des disques managés, est connectée à un réseau virtuel nommé **VNet-Erp** et n'appartient ni à un groupe à haute disponibilité ni à une zone de disponibilité. Vous avez créé un coffre Recovery Services nommé **RSV-DR** dans North Europe.

        Vous activez la réplication de VM-Erp1 vers North Europe avec Azure Site Recovery, en conservant les paramètres cibles par défaut.

        Quelles sont les trois ressources que Site Recovery crée dans North Europe lorsque vous activez la réplication ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "A target resource group", fr: "Un groupe de ressources cible" } }
        - { id: b, text: { en: "A target availability set", fr: "Un groupe à haute disponibilité cible" } }
        - { id: c, text: { en: "A target virtual network", fr: "Un réseau virtuel cible" } }
        - { id: d, text: { en: "A cache storage account", fr: "Un compte de stockage de cache" } }
        - { id: e, text: { en: "Replica managed disks", fr: "Des disques managés réplicas" } }
        - { id: f, text: { en: "A target virtual machine in the Stopped (deallocated) state", fr: "Une machine virtuelle cible à l'état Arrêté (désalloué)" } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: "With the default settings, Site Recovery creates in the target region a resource group and a virtual network with the asr suffix (plus a network mapping from VNet-Erp), and a replica of each managed disk with the -ASRReplica suffix, which receives the replicated data."
        fr: "Avec les paramètres par défaut, Site Recovery crée dans la région cible un groupe de ressources et un réseau virtuel portant le suffixe asr (avec un mappage réseau depuis VNet-Erp), ainsi qu'un réplica de chaque disque managé portant le suffixe -ASRReplica, qui reçoit les données répliquées."
      options:
        b:
          en: "A target availability set is created only for a source machine that is in an availability set. VM-Erp1 isn't in one."
          fr: "Un groupe à haute disponibilité cible n'est créé que pour une machine source qui appartient à un groupe à haute disponibilité. Ce n'est pas le cas de VM-Erp1."
        d:
          en: "The cache storage account is in the source region, West Europe, where it receives the writes before they are sent to the target region."
          fr: "Le compte de stockage de cache se trouve dans la région source, West Europe, où il reçoit les écritures avant leur envoi vers la région cible."
        f:
          en: "No target virtual machine exists during replication. Site Recovery creates it from the replica disks only when you run a failover or a test failover."
          fr: "Aucune machine virtuelle cible n'existe pendant la réplication. Site Recovery la crée à partir des disques réplicas uniquement lors d'un basculement ou d'un test de basculement."
    references:
      - title: Azure to Azure disaster recovery architecture in Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture

  # ------------------------------------------------------------------ 9
  - id: az104-qz-52-09
    objective: "5.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a Recovery Services vault named **RSV-Fin** that protects 30 Azure virtual machines. The backup policy keeps daily recovery points for one year. RSV-Fin uses the default security settings.

        After a ransomware review, you must ensure that no one can remove recovery points before they expire, either by deleting backup data or by reducing the retention of a backup policy. Once applied, the protection must not be removable, even by an Owner of the subscription.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un coffre Recovery Services nommé **RSV-Fin** qui protège 30 machines virtuelles Azure. La stratégie de sauvegarde conserve les points de récupération quotidiens pendant un an. RSV-Fin utilise les paramètres de sécurité par défaut.

        À la suite d'une revue sur les rançongiciels, vous devez garantir que personne ne puisse supprimer des points de récupération avant leur expiration, que ce soit en supprimant des données de sauvegarde ou en réduisant la rétention d'une stratégie de sauvegarde. Une fois appliquée, la protection ne doit plus pouvoir être retirée, même par un Owner de l'abonnement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable immutability on RSV-Fin without locking it", fr: "Activer l'immuabilité sur RSV-Fin sans la verrouiller" } }
        - { id: b, text: { en: "Make soft delete always-on for RSV-Fin with a 180-day retention", fr: "Rendre la suppression réversible permanente sur RSV-Fin avec une rétention de 180 jours" } }
        - { id: c, text: { en: "Apply a delete lock (CanNotDelete) to RSV-Fin", fr: "Appliquer un verrou Suppression (CanNotDelete) sur RSV-Fin" } }
        - { id: d, text: { en: "Enable immutability on RSV-Fin and lock it", fr: "Activer l'immuabilité sur RSV-Fin et la verrouiller" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: "An immutable vault blocks the operations that could lose backups before they expire, such as stopping protection with deletion of data and reducing the retention of a policy or replacing it with a shorter one. Locking the immutability makes it irreversible, so no one can disable it afterwards."
        fr: "Un coffre immuable bloque les opérations qui pourraient faire perdre des sauvegardes avant leur expiration, comme l'arrêt de la protection avec suppression des données, ou la réduction de la rétention d'une stratégie ou son remplacement par une stratégie plus courte. Verrouiller l'immuabilité la rend irréversible : personne ne peut plus la désactiver ensuite."
      options:
        a:
          en: "Unlocked immutability blocks the same operations, but the setting can still be disabled, which fails the second requirement."
          fr: "L'immuabilité non verrouillée bloque les mêmes opérations, mais le paramètre peut encore être désactivé, ce qui ne respecte pas la seconde exigence."
        b:
          en: "Soft delete only keeps deleted backup data recoverable for a while; it doesn't block a reduction of the policy retention, which makes recovery points expire early."
          fr: "La suppression réversible garde seulement les données de sauvegarde supprimées récupérables pendant un temps ; elle n'empêche pas de réduire la rétention de la stratégie, ce qui fait expirer les points de récupération plus tôt."
        c:
          en: "A delete lock protects the vault resource from deletion, but it doesn't stop a policy change that shortens retention, and an Owner can remove the lock."
          fr: "Un verrou Suppression protège la ressource coffre contre la suppression, mais il n'empêche pas de modifier une stratégie pour raccourcir la rétention, et un Owner peut retirer le verrou."
    references:
      - title: Concept of Immutable Vault for Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept

  # ------------------------------------------------------------------ 10
  - id: az104-qz-52-10
    objective: "5.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Recovery Services vault named **rsv-erp** in a resource group named **RG-ERP**. rsv-erp protects an Azure virtual machine named **VM-Erp2** with a daily backup policy. VM-Erp2 will be decommissioned.

        You need to perform the following tasks by using the Azure CLI:

        - Create a final recovery point of VM-Erp2 now, and keep it until 31 December 2030.
        - Then stop the scheduled backups of VM-Erp2, and keep all its existing recovery points until an administrator deletes them.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un coffre Recovery Services nommé **rsv-erp** dans un groupe de ressources nommé **RG-ERP**. rsv-erp protège une machine virtuelle Azure nommée **VM-Erp2** avec une stratégie de sauvegarde quotidienne. VM-Erp2 va être mise hors service.

        Vous devez effectuer les tâches suivantes avec Azure CLI :

        - Créer maintenant un dernier point de récupération de VM-Erp2, et le conserver jusqu'au 31 décembre 2030.
        - Ensuite, arrêter les sauvegardes planifiées de VM-Erp2, et conserver tous ses points de récupération existants jusqu'à ce qu'un administrateur les supprime.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az backup protection [[op1]] -g RG-ERP --vault-name rsv-erp \
          --container-name VM-Erp2 --item-name VM-Erp2 \
          --backup-management-type AzureIaasVM --retain-until 31-12-2030

        az backup protection [[op2]] -g RG-ERP --vault-name rsv-erp \
          --container-name VM-Erp2 --item-name VM-Erp2 \
          --backup-management-type AzureIaasVM [[keep]] --yes
      slots:
        - id: op1
          options:
            - { id: enable, text: enable-for-vm }
            - { id: now, text: backup-now }
            - { id: resume, text: resume }
            - { id: update, text: update-for-vm }
        - id: op2
          options:
            - { id: undelete, text: undelete }
            - { id: resume, text: resume }
            - { id: disable, text: disable }
            - { id: update, text: update-for-vm }
        - id: keep
          options:
            - { id: policy, text: "--retain-as-per-policy true" }
            - { id: deltrue, text: "--delete-backup-data true" }
            - { id: delfalse, text: "--delete-backup-data false" }
    answer:
      values: { op1: now, op2: disable, keep: delfalse }
    explanation:
      correct:
        en: "`backup-now` runs an on-demand backup of an item that is already protected, and `--retain-until` (UTC date, d-m-Y) gives that recovery point its own expiry, independent of the policy. `disable` stops protection; with `--delete-backup-data false`, the existing recovery points are retained with no expiry, until someone deletes them."
        fr: "`backup-now` lance une sauvegarde à la demande d'un élément déjà protégé, et `--retain-until` (date UTC au format d-m-Y) donne à ce point de récupération sa propre expiration, indépendante de la stratégie. `disable` arrête la protection ; avec `--delete-backup-data false`, les points de récupération existants sont conservés sans expiration, jusqu'à ce que quelqu'un les supprime."
      options:
        enable: { en: "`enable-for-vm` starts protecting a virtual machine that is not yet protected; VM-Erp2 already is.", fr: "`enable-for-vm` démarre la protection d'une machine virtuelle qui n'est pas encore protégée ; VM-Erp2 l'est déjà." }
        update: { en: "`update-for-vm` changes the disk exclusion settings of a protected virtual machine; it neither backs up nor stops protection.", fr: "`update-for-vm` modifie les exclusions de disques d'une machine virtuelle protégée ; il ne sauvegarde pas et n'arrête pas la protection." }
        resume: { en: "`resume` restarts the backups of an item whose protection was stopped, for example to assign a policy again.", fr: "`resume` relance les sauvegardes d'un élément dont la protection a été arrêtée, par exemple pour lui réattribuer une stratégie." }
        undelete: { en: "`undelete` rehydrates a soft-deleted item; VM-Erp2 is not deleted.", fr: "`undelete` réhydrate un élément supprimé de façon réversible ; l'élément VM-Erp2 n'est pas supprimé." }
        policy: { en: "`--retain-as-per-policy` keeps the recovery points only for the retention of the policy, so the daily points would expire.", fr: "`--retain-as-per-policy` ne conserve les points de récupération que pendant la rétention de la stratégie : les points quotidiens expireraient." }
        deltrue: { en: "`--delete-backup-data true` deletes the existing recovery points (they go to soft delete).", fr: "`--delete-backup-data true` supprime les points de récupération existants (ils passent en suppression réversible)." }
    references:
      - title: az backup protection
        url: https://learn.microsoft.com/en-us/cli/azure/backup/protection
