chapter: 23-files-blobs
questions:
  - id: az104-qz-23-01
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a storage account named **stcontosofin**. You need to create a blob container to store the scanned invoices of 2026.

        Which name can you use for the container?
      fr: |
        Vous disposez d'un compte de stockage nommé **stcontosofin**. Vous devez créer un conteneur d'objets blob pour stocker les factures numérisées de 2026.

        Quel nom pouvez-vous utiliser pour le conteneur ?
    body:
      options:
        - { id: a, text: "invoices-2026" }
        - { id: b, text: "Invoices-2026" }
        - { id: c, text: "invoices_2026" }
        - { id: d, text: "invoices.2026" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A container name must be a valid DNS name of 3 to 63 characters that contains only lowercase letters, digits and hyphens, and starts and ends with a letter or a digit. invoices-2026 meets all these rules.
        fr: |
          Un nom de conteneur doit être un nom DNS valide de 3 à 63 caractères qui ne contient que des lettres minuscules, des chiffres et des traits d'union, et qui commence et finit par une lettre ou un chiffre. invoices-2026 respecte toutes ces règles.
      options:
        b:
          en: "All the letters of a container name must be lowercase; the uppercase I makes this name invalid."
          fr: "Toutes les lettres d'un nom de conteneur doivent être en minuscules ; le I majuscule rend ce nom non valide."
        c:
          en: "The underscore isn't allowed in a container name; only letters, digits and hyphens are."
          fr: "Le trait de soulignement n'est pas autorisé dans un nom de conteneur ; seuls les lettres, les chiffres et les traits d'union le sont."
        d:
          en: "The period isn't allowed in a container name; only letters, digits and hyphens are."
          fr: "Le point n'est pas autorisé dans un nom de conteneur ; seuls les lettres, les chiffres et les traits d'union le sont."
    references:
      - title: Naming and Referencing Containers, Blobs, and Metadata
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/naming-and-referencing-containers--blobs--and-metadata

  - id: az104-qz-23-02
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to use Azure File Sync to synchronize a folder of a Windows Server file server with an Azure file share named **projects**.

        In the sync group, which element represents the **projects** file share?
      fr: |
        Fabrikam prévoit d'utiliser Azure File Sync pour synchroniser un dossier d'un serveur de fichiers Windows Server avec un partage de fichiers Azure nommé **projects**.

        Dans le groupe de synchronisation, quel élément représente le partage de fichiers **projects** ?
    body:
      options:
        - { id: a, text: { en: "The cloud endpoint", fr: "Le point de terminaison cloud" } }
        - { id: b, text: { en: "The server endpoint", fr: "Le point de terminaison de serveur" } }
        - { id: c, text: { en: "The registered server", fr: "Le serveur inscrit" } }
        - { id: d, text: { en: "The Storage Sync Service", fr: "Le service de synchronisation de stockage (Storage Sync Service)" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A sync group defines the sync relationship between one cloud endpoint and one or more server endpoints. The cloud endpoint is the Azure file share, here projects.
        fr: |
          Un groupe de synchronisation définit la relation de synchronisation entre un point de terminaison cloud et un ou plusieurs points de terminaison de serveur. Le point de terminaison cloud est le partage de fichiers Azure, ici projects.
      options:
        b:
          en: "A server endpoint is a path on a registered server, the folder of the file server that is synchronized, not the Azure file share."
          fr: "Un point de terminaison de serveur est un chemin sur un serveur inscrit, le dossier du serveur de fichiers qui est synchronisé, pas le partage de fichiers Azure."
        c:
          en: "The registered server is the Windows Server that has the Azure File Sync agent and is trusted by the Storage Sync Service; it isn't the file share."
          fr: "Le serveur inscrit est le Windows Server équipé de l'agent Azure File Sync et approuvé par le service de synchronisation de stockage ; ce n'est pas le partage de fichiers."
        d:
          en: "The Storage Sync Service is the top-level resource that contains the sync groups and the registered servers; it doesn't represent a share."
          fr: "Le service de synchronisation de stockage est la ressource de niveau supérieur qui contient les groupes de synchronisation et les serveurs inscrits ; il ne représente pas un partage."
    references:
      - title: Plan an Azure File Sync deployment
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning

  - id: az104-qz-23-03
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a general-purpose v2 storage account named **stlitwaredocs** whose default access tier is Hot. The account contains 50,000 block blobs. Most of them were uploaded without a tier. An administrator set 200 of them to the Hot tier explicitly by using Set Blob Tier.

        You change the default access tier of stlitwaredocs to Cool.

        What happens to the existing blobs?
      fr: |
        Litware dispose d'un compte de stockage usage général v2 nommé **stlitwaredocs** dont le niveau d'accès par défaut est chaud (Hot). Le compte contient 50 000 objets blob de blocs. La plupart ont été chargés sans niveau. Un administrateur a défini explicitement 200 d'entre eux sur le niveau chaud (Hot) avec Set Blob Tier.

        Vous changez le niveau d'accès par défaut de stlitwaredocs en froid (Cool).

        Qu'arrive-t-il aux objets blob existants ?
    body:
      options:
        - id: a
          text:
            en: "The blobs uploaded without a tier move to Cool; the 200 blobs set explicitly to Hot stay in Hot."
            fr: "Les objets blob chargés sans niveau passent au niveau froid (Cool) ; les 200 objets blob définis explicitement sur chaud (Hot) y restent."
        - id: b
          text:
            en: "All 50,000 blobs move to Cool, including the 200 blobs that were set explicitly to Hot."
            fr: "Les 50 000 objets blob passent au niveau froid (Cool), y compris les 200 objets blob définis explicitement sur chaud (Hot)."
        - id: c
          text:
            en: "No existing blob changes tier; only the blobs uploaded later without a tier are stored in Cool."
            fr: "Aucun objet blob existant ne change de niveau ; seuls les objets blob chargés ensuite sans niveau sont stockés en froid (Cool)."
        - id: d
          text:
            en: "The blobs uploaded without a tier move to Cool only after they have spent 30 days in the Hot tier."
            fr: "Les objets blob chargés sans niveau ne passent au niveau froid (Cool) qu'après 30 jours passés au niveau chaud (Hot)."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A blob that has no explicit tier inherits the default access tier of the account (it shows as Hot (inferred)). When you change the default tier, every blob with an inferred tier follows it, and you pay write operations for them. A blob whose tier was set explicitly keeps that tier.
        fr: |
          Un objet blob sans niveau explicite hérite du niveau d'accès par défaut du compte (il apparaît comme Hot (inferred)). Quand vous changez le niveau par défaut, tous les objets blob au niveau déduit le suivent, et des opérations d'écriture sont facturées pour eux. Un objet blob dont le niveau a été défini explicitement conserve ce niveau.
      options:
        b:
          en: "The default tier applies only to blobs without an explicit tier; the 200 blobs set with Set Blob Tier keep the Hot tier."
          fr: "Le niveau par défaut ne s'applique qu'aux objets blob sans niveau explicite ; les 200 objets blob définis avec Set Blob Tier gardent le niveau chaud (Hot)."
        c:
          en: "The inferred tier isn't fixed at upload time; existing blobs without an explicit tier follow the new default immediately."
          fr: "Le niveau déduit n'est pas figé au chargement ; les objets blob existants sans niveau explicite suivent immédiatement le nouveau niveau par défaut."
        d:
          en: "The Hot tier has no minimum duration, and the change of the default tier doesn't wait for any delay."
          fr: "Le niveau chaud (Hot) n'a pas de durée minimale, et le changement du niveau par défaut n'attend aucun délai."
    references:
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview

  - id: az104-qz-23-04
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a standard general-purpose v2 storage account named **stcontosoeng** that contains an SMB Azure file share named **drawings**. Engineers map the share on their Windows computers.

        You need to ensure that the engineers can restore files from a daily share snapshot for 30 days. The snapshots must be created and removed automatically. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso dispose d'un compte de stockage usage général v2 standard nommé **stcontosoeng** qui contient un partage de fichiers Azure SMB nommé **drawings**. Les ingénieurs mappent le partage sur leurs ordinateurs Windows.

        Vous devez faire en sorte que les ingénieurs puissent restaurer des fichiers à partir d'un instantané de partage quotidien pendant 30 jours. Les instantanés doivent être créés et supprimés automatiquement. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Configure Azure Backup for drawings with a daily backup policy that keeps the recovery points for 30 days."
            fr: "Configurer Sauvegarde Azure pour drawings avec une stratégie de sauvegarde quotidienne qui conserve les points de récupération pendant 30 jours."
        - id: b
          text:
            en: "Enable soft delete for the file shares of stcontosoeng with a retention period of 30 days."
            fr: "Activer la suppression réversible pour les partages de fichiers de stcontosoeng avec une période de rétention de 30 jours."
        - id: c
          text:
            en: "Add a lifecycle management rule to stcontosoeng that deletes the share snapshots after 30 days."
            fr: "Ajouter à stcontosoeng une règle de gestion du cycle de vie qui supprime les instantanés de partage après 30 jours."
        - id: d
          text:
            en: "Schedule a script that runs az storage share snapshot for drawings every night."
            fr: "Planifier un script qui exécute az storage share snapshot pour drawings chaque nuit."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Backup for Azure Files takes the share snapshots on a schedule and deletes them according to the retention of its backup policy, with no script to maintain. The snapshots it creates are ordinary share snapshots, so engineers can restore files from the Previous Versions tab.
        fr: |
          Sauvegarde Azure pour Azure Files prend les instantanés de partage selon une planification et les supprime selon la rétention de sa stratégie de sauvegarde, sans script à maintenir. Les instantanés créés sont des instantanés de partage ordinaires : les ingénieurs peuvent restaurer des fichiers depuis l'onglet Versions précédentes.
      options:
        b:
          en: "Soft delete protects the share itself against deletion; it takes no snapshot and doesn't let users restore individual files."
          fr: "La suppression réversible protège le partage lui-même contre la suppression ; elle ne prend aucun instantané et ne permet pas de restaurer des fichiers isolés."
        c:
          en: "Lifecycle management applies to blobs, not to file shares, and it never creates snapshots."
          fr: "La gestion du cycle de vie s'applique aux objets blob, pas aux partages de fichiers, et elle ne crée jamais d'instantanés."
        d:
          en: "The script creates snapshots but never removes them, so they accumulate up to the limit of 200 per share, and you must maintain the script."
          fr: "Le script crée des instantanés mais ne les supprime jamais : ils s'accumulent jusqu'à la limite de 200 par partage, et vous devez maintenir le script."
    references:
      - title: About Azure Files backup
        url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
      - title: Use Azure Files Share Snapshots
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files

  - id: az104-qz-23-05
    objective: "2.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a general-purpose v2 storage account named **stadatumhr**. Blob versioning is enabled. Blob soft delete is disabled.

        This morning, an application overwrote the block blob **salaries.xlsx** with incorrect data. The blob wasn't deleted.

        You need the content that salaries.xlsx had before the overwrite to become the current content of the blob again.

        What should you do?
      fr: |
        Adatum dispose d'un compte de stockage usage général v2 nommé **stadatumhr**. Le contrôle de version des objets blob est activé. La suppression réversible des objets blob est désactivée.

        Ce matin, une application a écrasé l'objet blob de blocs **salaries.xlsx** avec des données incorrectes. L'objet blob n'a pas été supprimé.

        Vous devez faire en sorte que le contenu qu'avait salaries.xlsx avant l'écrasement redevienne le contenu actuel de l'objet blob.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Copy the previous version of salaries.xlsx over the base blob."
            fr: "Copier la version précédente de salaries.xlsx sur l'objet blob de base."
        - id: b
          text:
            en: "Run an Undelete Blob operation on salaries.xlsx."
            fr: "Exécuter une opération Undelete Blob sur salaries.xlsx."
        - id: c
          text:
            en: "Restore the container to a point in time before the overwrite."
            fr: "Restaurer le conteneur à un instant antérieur à l'écrasement."
        - id: d
          text:
            en: "Edit the metadata of the previous version to make it the current version."
            fr: "Modifier les métadonnées de la version précédente pour en faire la version actuelle."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With versioning, the overwrite saved the former content as a previous version. Copying that version over the base blob makes its content the current version again (the portal's Make current version does the same), and the incorrect data stays available as a previous version.
        fr: |
          Avec le contrôle de version, l'écrasement a conservé l'ancien contenu sous forme de version précédente. Copier cette version sur l'objet blob de base refait de son contenu la version actuelle (l'action Make current version du portail fait de même), et les données incorrectes restent disponibles comme version précédente.
      options:
        b:
          en: "Undelete Blob restores soft-deleted data; soft delete is disabled and the blob wasn't deleted."
          fr: "Undelete Blob restaure des données supprimées de façon réversible ; la suppression réversible est désactivée et l'objet blob n'a pas été supprimé."
        c:
          en: "Point-in-time restore requires blob soft delete and the change feed in addition to versioning; with soft delete disabled, it can't be in use."
          fr: "La restauration à un instant dans le passé exige la suppression réversible des objets blob et le flux de modification en plus du contrôle de version ; avec la suppression réversible désactivée, elle ne peut pas être en service."
        d:
          en: "Previous versions are immutable; their content and metadata can't be modified."
          fr: "Les versions précédentes sont immuables ; leur contenu et leurs métadonnées ne peuvent pas être modifiés."
    references:
      - title: Blob Versioning in Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview

  - id: az104-qz-23-06
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Fabrikam has three Windows Server file servers: **FS-PAR** in Paris, **FS-LYO** in Lyon and **FS-LIL** in Lille. You plan to deploy Azure File Sync in the Azure region of a storage account named **stfabrikamsync**, which will contain the Azure file shares.

        The synchronization requirements are the following:

        - The **D:\Projects** folder of the three servers must contain the same data, synchronized through a file share named **projects**.
        - The **D:\Finance** folder of FS-PAR must be synchronized with a file share named **finance**. Finance data must not be stored on the other servers.
        - The **E:\Archive** folder of FS-LYO and FS-LIL must be synchronized through a file share named **archive**, with cloud tiering enabled.

        You need to meet the requirements by creating the minimum number of Azure File Sync resources.

        How many resources of each type should you create? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de trois serveurs de fichiers Windows Server : **FS-PAR** à Paris, **FS-LYO** à Lyon et **FS-LIL** à Lille. Vous prévoyez de déployer Azure File Sync dans la région Azure d'un compte de stockage nommé **stfabrikamsync**, qui contiendra les partages de fichiers Azure.

        Les exigences de synchronisation sont les suivantes :

        - Le dossier **D:\Projects** des trois serveurs doit contenir les mêmes données, synchronisées par un partage de fichiers nommé **projects**.
        - Le dossier **D:\Finance** de FS-PAR doit être synchronisé avec un partage de fichiers nommé **finance**. Les données financières ne doivent pas être stockées sur les autres serveurs.
        - Le dossier **E:\Archive** de FS-LYO et de FS-LIL doit être synchronisé par un partage de fichiers nommé **archive**, avec la hiérarchisation cloud activée.

        Vous devez répondre aux exigences en créant le nombre minimal de ressources Azure File Sync.

        Combien de ressources de chaque type devez-vous créer ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Storage Sync Services: [[svc]]

          Sync groups: [[groups]]

          Server endpoints: [[endpoints]]
        fr: |
          Services de synchronisation de stockage : [[svc]]

          Groupes de synchronisation : [[groups]]

          Points de terminaison de serveur : [[endpoints]]
      slots:
        - id: svc
          options:
            - { id: svc1, text: "1" }
            - { id: svc2, text: "2" }
            - { id: svc3, text: "3" }
        - id: groups
          options:
            - { id: grp1, text: "1" }
            - { id: grp2, text: "2" }
            - { id: grp3, text: "3" }
            - { id: grp6, text: "6" }
        - id: endpoints
          options:
            - { id: ep3, text: "3" }
            - { id: ep6, text: "6" }
            - { id: ep8, text: "8" }
            - { id: ep9, text: "9" }
    answer:
      values: { svc: svc1, groups: grp3, endpoints: ep6 }
    explanation:
      correct:
        en: |
          One Storage Sync Service is enough: the three servers register with it, and a registered server can take part in several of its sync groups. A sync group has exactly one cloud endpoint (one file share), so the three shares need three sync groups: projects, finance and archive. Each synchronized folder of a server is a server endpoint: 3 for projects, 1 for finance and 2 for archive, 6 in total; cloud tiering is a setting of the server endpoint, not an extra resource.
        fr: |
          Un seul service de synchronisation de stockage suffit : les trois serveurs s'y inscrivent, et un serveur inscrit peut participer à plusieurs de ses groupes de synchronisation. Un groupe de synchronisation a exactement un point de terminaison cloud (un partage de fichiers) : les trois partages exigent donc trois groupes, projects, finance et archive. Chaque dossier synchronisé d'un serveur est un point de terminaison de serveur : 3 pour projects, 1 pour finance et 2 pour archive, soit 6 ; la hiérarchisation cloud est un paramètre du point de terminaison de serveur, pas une ressource supplémentaire.
      options:
        svc3:
          en: "A Storage Sync Service isn't needed per office; a server registers with a single service, which can serve all the offices."
          fr: "Il ne faut pas un service de synchronisation de stockage par site ; un serveur s'inscrit auprès d'un seul service, qui peut servir tous les sites."
        grp1:
          en: "A sync group can't contain three cloud endpoints, and finance data in the same group would be synchronized to every server."
          fr: "Un groupe de synchronisation ne peut pas contenir trois points de terminaison cloud, et les données financières d'un même groupe seraient synchronisées sur tous les serveurs."
        ep9:
          en: "Nine would mean that every server synchronizes every share, which the finance and archive requirements forbid or don't need."
          fr: "Neuf signifierait que chaque serveur synchronise chaque partage, ce que les exigences de finance et d'archive interdisent ou n'imposent pas."
    references:
      - title: Plan an Azure File Sync deployment
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning

  - id: az104-qz-23-07
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has a general-purpose v2 storage account named **stwoodgroveaudit**. Blob versioning is disabled. A container named **trades** has a container-level time-based retention policy with a retention period of 365 days. The policy is unlocked.

        To meet a regulatory requirement, you lock the policy today.

        Which two statements are true after the policy is locked?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un compte de stockage usage général v2 nommé **stwoodgroveaudit**. Le contrôle de version des objets blob est désactivé. Un conteneur nommé **trades** a une stratégie de rétention limitée dans le temps au niveau du conteneur, avec une durée de rétention de 365 jours. La stratégie est déverrouillée.

        Pour répondre à une exigence réglementaire, vous verrouillez la stratégie aujourd'hui.

        Quelles sont les deux affirmations vraies une fois la stratégie verrouillée ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - id: a
          text:
            en: "Applications can still upload new blobs to trades."
            fr: "Les applications peuvent toujours charger de nouveaux objets blob dans trades."
        - id: b
          text:
            en: "You can increase the retention period of the policy to 730 days."
            fr: "Vous pouvez porter la durée de rétention de la stratégie à 730 jours."
        - id: c
          text:
            en: "You can decrease the retention period of the policy to 180 days."
            fr: "Vous pouvez réduire la durée de rétention de la stratégie à 180 jours."
        - id: d
          text:
            en: "A user who has the Owner role on stwoodgroveaudit can delete the policy."
            fr: "Un utilisateur qui a le rôle Owner sur stwoodgroveaudit peut supprimer la stratégie."
        - id: e
          text:
            en: "An application can overwrite a blob uploaded 200 days ago with corrected data."
            fr: "Une application peut écraser un objet blob chargé il y a 200 jours avec des données corrigées."
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          A time-based retention policy is a WORM protection: blobs can still be created and read, but not modified or deleted until their retention period, counted from their creation, has elapsed. Once locked, the policy can't be removed and its retention period can only be extended (at most five times for a container-level policy).
        fr: |
          Une stratégie de rétention limitée dans le temps est une protection WORM : les objets blob peuvent toujours être créés et lus, mais ni modifiés ni supprimés tant que leur durée de rétention, comptée depuis leur création, n'est pas écoulée. Une fois verrouillée, la stratégie ne peut plus être supprimée et sa durée ne peut qu'être allongée (au plus cinq fois pour une stratégie au niveau du conteneur).
      options:
        c:
          en: "Only an unlocked policy can have its retention period shortened; a locked policy can only be extended."
          fr: "Seule une stratégie déverrouillée peut voir sa durée de rétention raccourcie ; une stratégie verrouillée ne peut qu'être allongée."
        d:
          en: "A locked policy can't be deleted by anyone, whatever their Azure role."
          fr: "Une stratégie verrouillée ne peut être supprimée par personne, quel que soit son rôle Azure."
        e:
          en: "The blob is only 200 days old, so it is still in its 365-day retention period and can't be overwritten."
          fr: "L'objet blob n'a que 200 jours ; il est encore dans sa période de rétention de 365 jours et ne peut pas être écrasé."
    references:
      - title: Immutable Storage for Blob Data Overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview

  - id: az104-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a premium block blob storage account (BlockBlobStorage) named **sttailspinrender** that uses LRS. A rendering application reads and writes recent frames in the **frames** container with low latency.

        The frames container also holds 30 TB of frames older than two years. These frames are never read but must be kept for seven years. A retrieval delay of several hours is acceptable for them.

        You need to minimize the storage cost of the old frames. The performance of the application on the recent frames must not change.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un compte de stockage d'objets blob de blocs Premium (BlockBlobStorage) nommé **sttailspinrender** qui utilise LRS. Une application de rendu lit et écrit les images récentes du conteneur **frames** avec une faible latence.

        Le conteneur frames contient aussi 30 To d'images de plus de deux ans. Ces images ne sont jamais lues mais doivent être conservées sept ans. Un délai de récupération de plusieurs heures est acceptable pour elles.

        Vous devez réduire au minimum le coût de stockage des anciennes images. Les performances de l'application sur les images récentes ne doivent pas changer.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Add a lifecycle management rule to sttailspinrender that moves the frames older than two years to the Archive tier."
            fr: "Ajouter à sttailspinrender une règle de gestion du cycle de vie qui déplace les images de plus de deux ans vers le niveau archive (Archive)."
        - id: b
          text:
            en: "Run az storage blob set-tier with --tier Archive on the frames older than two years in sttailspinrender."
            fr: "Exécuter az storage blob set-tier avec --tier Archive sur les images de plus de deux ans dans sttailspinrender."
        - id: c
          text:
            en: "Copy the old frames with AzCopy to a new standard general-purpose v2 LRS account, archive the copies, and delete the originals."
            fr: "Copier les anciennes images avec AzCopy vers un nouveau compte usage général v2 standard LRS, archiver les copies et supprimer les originaux."
        - id: d
          text:
            en: "Change the performance of sttailspinrender from Premium to Standard, and then move the old frames to the Archive tier."
            fr: "Faire passer les performances de sttailspinrender de Premium à Standard, puis déplacer les anciennes images vers le niveau archive (Archive)."
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Access tiers apply to block blobs in standard accounts; data in a premium block blob account can't be tiered, neither with Set Blob Tier nor with lifecycle management. You must copy the old frames to a standard general-purpose v2 account (AzCopy supports this copy), set them to Archive there, and delete them from the premium account, which keeps serving the recent frames unchanged.
        fr: |
          Les niveaux d'accès s'appliquent aux objets blob de blocs des comptes standard ; les données d'un compte d'objets blob de blocs Premium ne peuvent pas changer de niveau, ni avec Set Blob Tier ni avec la gestion du cycle de vie. Vous devez copier les anciennes images vers un compte usage général v2 standard (AzCopy prend en charge cette copie), les y passer au niveau archive (Archive) et les supprimer du compte Premium, qui continue de servir les images récentes sans changement.
      options:
        a:
          en: "Lifecycle management is supported on premium block blob accounts, but only to delete blobs; tiering isn't supported there."
          fr: "La gestion du cycle de vie est prise en charge sur les comptes d'objets blob de blocs Premium, mais seulement pour supprimer ; le changement de niveau n'y est pas pris en charge."
        b:
          en: "Set Blob Tier can't move blobs of a premium block blob account to the Hot, Cool, Cold or Archive tier."
          fr: "Set Blob Tier ne peut pas déplacer les objets blob d'un compte d'objets blob de blocs Premium vers les niveaux chaud (Hot), froid (Cool), froid (Cold) ou archive (Archive)."
        d:
          en: "The performance of a storage account is chosen at creation and can't be changed; a conversion would also affect the recent frames."
          fr: "Les performances d'un compte de stockage se choisissent à la création et ne peuvent pas être modifiées ; une conversion toucherait aussi les images récentes."
    references:
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
      - title: Azure Blob Storage lifecycle management overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview

  - id: az104-qz-23-09
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Northwind Traders has a general-purpose v2 storage account named **stnwtelemetry** that uses LRS. Last access time tracking is disabled.

        Yesterday, you added the following lifecycle management policy to stnwtelemetry. The policy has taken effect, but it hasn't run yet.

        ```json
        {
          "rules": [
            {
              "name": "app-logs",
              "enabled": true,
              "type": "Lifecycle",
              "definition": {
                "filters": { "blobTypes": [ "blockBlob" ], "prefixMatch": [ "logs/app" ] },
                "actions": {
                  "baseBlob": {
                    "tierToCool": { "daysAfterModificationGreaterThan": 30 },
                    "tierToCold": { "daysAfterModificationGreaterThan": 90 },
                    "delete":     { "daysAfterModificationGreaterThan": 365 }
                  }
                }
              }
            }
          ]
        }
        ```

        The account contains the blobs shown in the following table.

        Answer each prompt by selecting the blob that the first run of the policy affects as described. Each prompt has exactly one correct blob.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un compte de stockage usage général v2 nommé **stnwtelemetry** qui utilise LRS. Le suivi de l'heure d'accès est désactivé.

        Hier, vous avez ajouté la stratégie de gestion du cycle de vie suivante à stnwtelemetry. La stratégie a pris effet, mais elle n'a pas encore été exécutée.

        ```json
        {
          "rules": [
            {
              "name": "app-logs",
              "enabled": true,
              "type": "Lifecycle",
              "definition": {
                "filters": { "blobTypes": [ "blockBlob" ], "prefixMatch": [ "logs/app" ] },
                "actions": {
                  "baseBlob": {
                    "tierToCool": { "daysAfterModificationGreaterThan": 30 },
                    "tierToCold": { "daysAfterModificationGreaterThan": 90 },
                    "delete":     { "daysAfterModificationGreaterThan": 365 }
                  }
                }
              }
            }
          ]
        }
        ```

        Le compte contient les objets blob présentés dans le tableau suivant.

        Répondez à chaque consigne en sélectionnant l'objet blob que la première exécution de la stratégie traite comme indiqué. Chaque consigne a exactement un objet blob correct.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The first run moves this blob to the Cool tier.", fr: "La première exécution déplace cet objet blob vers le niveau froid (Cool)." }
        - id: p2
          text: { en: "The first run deletes this blob.", fr: "La première exécution supprime cet objet blob." }
      grid:
        header: [{ en: "Blob (container/name)", fr: "Objet blob (conteneur/nom)" }, { en: "Blob type", fr: "Type d'objet blob" }, { en: "Days since last modification", fr: "Jours depuis la dernière modification" }, { en: "Current tier", fr: "Niveau actuel" }]
        rows:
          - [{ text: logs/app/2026/batch.log, area: b1 }, { text: { en: "Block blob", fr: "Objet blob de blocs" } }, { text: "20" }, { text: Hot }]
          - [{ text: logs/app/2026/api.log, area: b2 }, { text: { en: "Block blob", fr: "Objet blob de blocs" } }, { text: "45" }, { text: Hot }]
          - [{ text: logs/app/2025/audit.log, area: b3 }, { text: { en: "Append blob", fr: "Objet blob d'ajout" } }, { text: "500" }, { text: { en: "Not applicable", fr: "Non applicable" } }]
          - [{ text: logs/web/2025/front.log, area: b4 }, { text: { en: "Block blob", fr: "Objet blob de blocs" } }, { text: "500" }, { text: Hot }]
          - [{ text: logs/app/2025/web.log, area: b5 }, { text: { en: "Block blob", fr: "Objet blob de blocs" } }, { text: "400" }, { text: Cold }]
          - [{ text: archive/app/2024/api.log, area: b6 }, { text: { en: "Block blob", fr: "Objet blob de blocs" } }, { text: "700" }, { text: Hot }]
    answer:
      values: { p1: b2, p2: b5 }
    explanation:
      correct:
        en: |
          The rule applies only to block blobs whose full name, container included, starts with logs/app. Among them, api.log (45 days) meets only the tierToCool condition and moves to Cool. web.log (400 days) meets the tierToCold and delete conditions; when several actions match, the least expensive one applies, so it is deleted. audit.log is an append blob, excluded by blobTypes; front.log is under logs/web and archive/app/2024/api.log is in another container, so the prefix excludes them; batch.log is only 20 days old.
        fr: |
          La règle ne s'applique qu'aux objets blob de blocs dont le nom complet, conteneur compris, commence par logs/app. Parmi eux, api.log (45 jours) ne remplit que la condition de tierToCool et passe au niveau froid (Cool). web.log (400 jours) remplit les conditions de tierToCold et de delete ; quand plusieurs actions correspondent, la moins chère s'applique : il est supprimé. audit.log est un objet blob d'ajout, exclu par blobTypes ; front.log est sous logs/web et archive/app/2024/api.log est dans un autre conteneur : le préfixe les exclut ; batch.log n'a que 20 jours.
      options:
        b3:
          en: "The blobTypes filter includes only blockBlob, so the append blob audit.log isn't processed, whatever its age."
          fr: "Le filtre blobTypes n'inclut que blockBlob : l'objet blob d'ajout audit.log n'est pas traité, quel que soit son âge."
        b6:
          en: "prefixMatch starts with the container name; archive/app/2024/api.log is in the archive container and doesn't match logs/app."
          fr: "prefixMatch commence par le nom du conteneur ; archive/app/2024/api.log est dans le conteneur archive et ne correspond pas à logs/app."
    references:
      - title: Azure Blob Storage lifecycle management policy structure
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure

  - id: az104-qz-23-10
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a general-purpose v2 storage account named **stcontosorates**. Blob versioning is enabled. Blob soft delete is enabled with a retention period of 7 days.

        The block blob **rates.csv** in the **pricing** container has the following history:

        - November 3: an application uploads rates.csv.
        - November 10: the application overwrites rates.csv with new prices.
        - November 17: a faulty job overwrites rates.csv with corrupted data.
        - November 18: an administrator deletes the version created on November 10 by specifying its version ID.
        - November 19: a user deletes rates.csv.

        Today is November 20.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un compte de stockage usage général v2 nommé **stcontosorates**. Le contrôle de version des objets blob est activé. La suppression réversible des objets blob est activée avec une période de rétention de 7 jours.

        L'objet blob de blocs **rates.csv** du conteneur **pricing** a l'historique suivant :

        - 3 novembre : une application charge rates.csv.
        - 10 novembre : l'application écrase rates.csv avec de nouveaux prix.
        - 17 novembre : une tâche défaillante écrase rates.csv avec des données corrompues.
        - 18 novembre : un administrateur supprime la version créée le 10 novembre en indiquant son ID de version.
        - 19 novembre : un utilisateur supprime rates.csv.

        Nous sommes le 20 novembre.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "rates.csv currently has no current version."
            fr: "rates.csv n'a actuellement aucune version actuelle."
        - id: s2
          text:
            en: "If you take no action, the corrupted data written on November 17 will be permanently deleted on November 26."
            fr: "Si vous ne faites rien, les données corrompues écrites le 17 novembre seront définitivement supprimées le 26 novembre."
        - id: s3
          text:
            en: "You can restore the prices of November 10 now by copying the November 10 version over rates.csv."
            fr: "Vous pouvez restaurer dès maintenant les prix du 10 novembre en copiant la version du 10 novembre sur rates.csv."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With versioning enabled, deleting rates.csv without a version ID turned its current version (the November 17 data) into a previous version, so no current version remains. That previous version isn't soft-deleted: the soft delete retention doesn't apply to it, and it stays until someone deletes it. Deleting the November 10 version by its ID, however, soft-deleted it: you must first run Undelete Blob to restore it, and only then copy it over the base blob.
        fr: |
          Avec le contrôle de version activé, la suppression de rates.csv sans ID de version a transformé sa version actuelle (les données du 17 novembre) en version précédente : il ne reste aucune version actuelle. Cette version précédente n'est pas supprimée de façon réversible : la rétention de la suppression réversible ne s'y applique pas, et elle reste jusqu'à ce que quelqu'un la supprime. En revanche, la suppression de la version du 10 novembre par son ID l'a supprimée de façon réversible : il faut d'abord exécuter Undelete Blob pour la restaurer, puis seulement la copier sur l'objet blob de base.
      options:
        s2:
          en: "The 7-day retention would apply to a deleted version, not to the version that the deletion of the base blob created; that version persists."
          fr: "La rétention de 7 jours s'appliquerait à une version supprimée, pas à la version créée par la suppression de l'objet blob de base ; cette version persiste."
        s3:
          en: "The November 10 version is soft-deleted, so it can't be read or copied before Undelete Blob restores it."
          fr: "La version du 10 novembre est supprimée de façon réversible : elle ne peut être ni lue ni copiée avant qu'Undelete Blob la restaure."
    references:
      - title: Blob Versioning in Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
