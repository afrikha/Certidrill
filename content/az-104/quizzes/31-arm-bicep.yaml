chapter: 31-arm-bicep
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are writing an Azure Resource Manager (ARM) template in JSON.

        Which of the following sections must every ARM template contain?
      fr: |
        Vous rédigez un modèle Azure Resource Manager (ARM) en JSON.

        Parmi les sections suivantes, laquelle tout modèle ARM doit-il contenir ?
    body:
      options:
        - { id: a, text: "`parameters`" }
        - { id: b, text: "`variables`" }
        - { id: c, text: "`resources`" }
        - { id: d, text: "`outputs`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: "An ARM template requires only three top-level elements: `$schema`, `contentVersion` and `resources`. The `resources` array describes what Resource Manager deploys; a template without it is not valid."
        fr: "Un modèle ARM n'exige que trois éléments de niveau supérieur : `$schema`, `contentVersion` et `resources`. Le tableau `resources` décrit ce que Resource Manager déploie ; un modèle sans ce tableau n'est pas valide."
      options:
        a: { en: "Parameters are optional: a template can hard-code every value.", fr: "Les paramètres sont facultatifs : un modèle peut coder toutes les valeurs en dur." }
        b: { en: "Variables are optional: they only avoid repeating computed values.", fr: "Les variables sont facultatives : elles évitent seulement de répéter des valeurs calculées." }
        d: { en: "Outputs are optional: a deployment does not have to return any value.", fr: "Les sorties sont facultatives : un déploiement n'a pas à renvoyer de valeur." }
    references:
      - title: Template structure and syntax
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/syntax

  # ------------------------------------------------------------------ 2
  - id: az104-qz-31-02
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You deploy a Bicep file named **app.bicep** to a resource group named **RG1**. The deployment creates a storage account and a virtual network.

        The next day, nobody has changed the resources, and you deploy app.bicep to RG1 again with the same parameter values.

        What is the result of the second deployment?
      fr: |
        Vous déployez un fichier Bicep nommé **app.bicep** dans un groupe de ressources nommé **RG1**. Le déploiement crée un compte de stockage et un réseau virtuel.

        Le lendemain, personne n'a modifié les ressources, et vous déployez de nouveau app.bicep dans RG1 avec les mêmes valeurs de paramètres.

        Quel est le résultat du second déploiement ?
    body:
      options:
        - { id: a, text: { en: "The deployment fails because the storage account and the virtual network already exist.", fr: "Le déploiement échoue, car le compte de stockage et le réseau virtuel existent déjà." } }
        - { id: b, text: { en: "The existing resources stay as they are, and no additional resource is created.", fr: "Les ressources existantes restent telles quelles, et aucune ressource supplémentaire n'est créée." } }
        - { id: c, text: { en: "A second storage account and a second virtual network are created with new names.", fr: "Un deuxième compte de stockage et un deuxième réseau virtuel sont créés avec de nouveaux noms." } }
        - { id: d, text: { en: "The storage account and the virtual network are deleted, then created again.", fr: "Le compte de stockage et le réseau virtuel sont supprimés, puis recréés." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Bicep files and ARM templates are declarative and idempotent: they describe the desired state. When a resource of the file already exists with unchanged settings, Resource Manager takes no operation on it, so redeploying the same file with the same values changes nothing."
        fr: "Les fichiers Bicep et les modèles ARM sont déclaratifs et idempotents : ils décrivent l'état voulu. Lorsqu'une ressource du fichier existe déjà avec des paramètres inchangés, Resource Manager n'effectue aucune opération sur elle : redéployer le même fichier avec les mêmes valeurs ne change donc rien."
      options:
        a: { en: "An existing resource is not an error: Resource Manager creates or updates it to match the file.", fr: "Une ressource existante n'est pas une erreur : Resource Manager la crée ou la met à jour pour qu'elle corresponde au fichier." }
        c: { en: "The names come from the file, so the same resources are targeted; nothing is duplicated.", fr: "Les noms viennent du fichier : ce sont donc les mêmes ressources qui sont ciblées, et rien n'est dupliqué." }
        d: { en: "Resource Manager never deletes and recreates a resource that already matches the file.", fr: "Resource Manager ne supprime et ne recrée jamais une ressource qui correspond déjà au fichier." }
    references:
      - title: Deployment modes
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes

  # ------------------------------------------------------------------ 3
  - id: az104-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        You are modifying an existing ARM template that deploys virtual machines for Fabrikam. You add a parameter named **instanceCount**.

        The parameter must meet the following requirements:

        - It accepts only whole numbers from 2 to 6.
        - The person who deploys the template must always provide a value.

        How should you complete the parameter definition? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous modifiez un modèle ARM existant qui déploie des machines virtuelles pour Fabrikam. Vous ajoutez un paramètre nommé **instanceCount**.

        Le paramètre doit répondre aux exigences suivantes :

        - Il n'accepte que des nombres entiers de 2 à 6.
        - La personne qui déploie le modèle doit toujours fournir une valeur.

        Comment devez-vous compléter la définition du paramètre ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        "parameters": {
          "instanceCount": {
            "type": "[[ptype]]",
            "[[low]]": 2,
            "[[high]]": 6,
            "metadata": {
              "description": "Number of virtual machines to deploy"
            }
          }
        }
      slots:
        - id: ptype
          options:
            - { id: int, text: int }
            - { id: string, text: string }
            - { id: array, text: array }
            - { id: securestring, text: securestring }
        - id: low
          options:
            - { id: minValue, text: minValue }
            - { id: minLength, text: minLength }
            - { id: defaultValue, text: defaultValue }
        - id: high
          options:
            - { id: maxValue, text: maxValue }
            - { id: maxLength, text: maxLength }
            - { id: allowedValues, text: allowedValues }
    answer:
      values: { ptype: int, low: minValue, high: maxValue }
    explanation:
      correct:
        en: "A whole number is an `int` parameter. `minValue` and `maxValue` set the inclusive bounds of an `int`. Because no `defaultValue` is set, the parameter must be supplied at every deployment."
        fr: "Un nombre entier est un paramètre `int`. `minValue` et `maxValue` définissent les bornes incluses d'un `int`. Comme aucune `defaultValue` n'est définie, le paramètre doit être fourni à chaque déploiement."
      options:
        string: { en: "A string accepts any text; minValue and maxValue apply to int parameters.", fr: "Une chaîne accepte n'importe quel texte ; minValue et maxValue s'appliquent aux paramètres int." }
        minLength: { en: "minLength and maxLength limit the length of a string, securestring or array, not the value of a number.", fr: "minLength et maxLength limitent la longueur d'une chaîne, d'un securestring ou d'un tableau, pas la valeur d'un nombre." }
        defaultValue: { en: "A default value would let the deployment run without a value, which the requirement forbids.", fr: "Une valeur par défaut permettrait au déploiement de s'exécuter sans valeur, ce que l'exigence interdit." }
        allowedValues: { en: "allowedValues expects an array of values, not a single upper bound.", fr: "allowedValues attend un tableau de valeurs, pas une seule borne supérieure." }
    references:
      - title: Template structure and syntax
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/syntax

  # ------------------------------------------------------------------ 4
  - id: az104-qz-31-04
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has a Bicep file named **main.bicep** and a second Bicep file named **storage.bicep** in the same folder. storage.bicep declares a parameter named **env**.

        You need to modify main.bicep so that storage.bicep is deployed as a unit during the deployment of main.bicep, with env set to the value of the env parameter of main.bicep.

        How should you complete main.bicep? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un fichier Bicep nommé **main.bicep** et d'un second fichier Bicep nommé **storage.bicep** dans le même dossier. storage.bicep déclare un paramètre nommé **env**.

        Vous devez modifier main.bicep pour que storage.bicep soit déployé comme une unité pendant le déploiement de main.bicep, avec env défini sur la valeur du paramètre env de main.bicep.

        Comment devez-vous compléter main.bicep ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        @allowed([
          'dev'
          'prod'
        ])
        param env string = 'dev'

        [[kw]] storage './storage.bicep' = {
          name: 'storageDeploy'
          [[prop]]: {
            env: env
          }
        }
      slots:
        - id: kw
          options:
            - { id: module, text: module }
            - { id: resource, text: resource }
            - { id: import, text: import }
            - { id: using, text: using }
        - id: prop
          options:
            - { id: params, text: params }
            - { id: parameters, text: parameters }
            - { id: properties, text: properties }
    answer:
      values: { kw: module, prop: params }
    explanation:
      correct:
        en: "A `module` declaration deploys another Bicep (or ARM JSON) file as a unit, as a nested deployment named by `name`. The values of the module's parameters are passed in the `params` object."
        fr: "Une déclaration `module` déploie un autre fichier Bicep (ou ARM JSON) comme une unité, sous la forme d'un déploiement imbriqué nommé par `name`. Les valeurs des paramètres du module sont passées dans l'objet `params`."
      options:
        resource: { en: "resource declares an Azure resource with a type and an API version, not a file to deploy.", fr: "resource déclare une ressource Azure avec un type et une version d'API, pas un fichier à déployer." }
        using: { en: "using is the first line of a .bicepparam file; it links parameter values to a Bicep file.", fr: "using est la première ligne d'un fichier .bicepparam ; il relie des valeurs de paramètres à un fichier Bicep." }
        import: { en: "import brings types or variables from another file at compile time; it deploys nothing.", fr: "import importe des types ou des variables d'un autre fichier à la compilation ; il ne déploie rien." }
        parameters: { en: "parameters is the name of the section of a JSON template; a Bicep module uses params.", fr: "parameters est le nom de la section d'un modèle JSON ; un module Bicep utilise params." }
        properties: { en: "properties holds the settings of a resource, not the parameter values of a module.", fr: "properties contient les paramètres d'une ressource, pas les valeurs de paramètres d'un module." }
    references:
      - title: Bicep modules
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/modules

  # ------------------------------------------------------------------ 5
  - id: az104-qz-31-05
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Bicep file named **rg.bicep** that starts with `targetScope = 'subscription'` and declares a resource group named **RG-Analytics** in the West Europe region.

        You need to deploy rg.bicep to the current subscription of your Azure CLI session.

        Which command should you run?
      fr: |
        Vous disposez d'un fichier Bicep nommé **rg.bicep** qui commence par `targetScope = 'subscription'` et déclare un groupe de ressources nommé **RG-Analytics** dans la région Europe Ouest.

        Vous devez déployer rg.bicep dans l'abonnement actuel de votre session Azure CLI.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`az deployment group create --resource-group RG-Analytics --template-file rg.bicep`" }
        - { id: b, text: "`az deployment sub create --name rgDeploy --template-file rg.bicep`" }
        - { id: c, text: "`az deployment mg create --management-group-id MG1 --location westeurope --template-file rg.bicep`" }
        - { id: d, text: "`az deployment sub create --location westeurope --template-file rg.bicep`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: "A file whose target scope is the subscription is deployed with `az deployment sub create`. Subscription deployments require a location, which is where Resource Manager stores the deployment metadata; it is separate from the region of the resources."
        fr: "Un fichier dont l'étendue cible est l'abonnement se déploie avec `az deployment sub create`. Les déploiements au niveau de l'abonnement exigent un emplacement, où Resource Manager stocke les métadonnées du déploiement ; il est distinct de la région des ressources."
      options:
        a: { en: "A resource group deployment targets an existing resource group; it cannot run a file whose target scope is the subscription.", fr: "Un déploiement sur un groupe de ressources cible un groupe de ressources existant ; il ne peut pas exécuter un fichier dont l'étendue cible est l'abonnement." }
        b: { en: "The scope is right, but a subscription deployment requires --location.", fr: "L'étendue est la bonne, mais un déploiement au niveau de l'abonnement exige --location." }
        c: { en: "The file targets the subscription scope, not a management group.", fr: "Le fichier cible l'étendue de l'abonnement, pas un groupe d'administration." }
    references:
      - title: Use Bicep to deploy resources to subscription
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-to-subscription

  # ------------------------------------------------------------------ 6
  - id: az104-qz-31-06
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso plans to use one ARM template to deploy a virtual machine with boot diagnostics in several resource groups of the same subscription. Before the first deployment, you review the following excerpt of the template, from which irrelevant properties were removed.

        ```json
        "variables": {
          "vnetName": "vnet-app",
          "storageName": "[concat('stdiag', uniqueString(subscription().subscriptionId))]"
        },
        "resources": [
          {
            "type": "Microsoft.Network/virtualNetworks",
            "apiVersion": "2024-05-01",
            "name": "[variables('vnetName')]",
            "location": "[resourceGroup().location]",
            "properties": {
              "addressSpace": { "addressPrefixes": [ "10.60.0.0/16" ] },
              "subnets": [
                { "name": "snet-app", "properties": { "addressPrefix": "10.60.1.0/24" } }
              ]
            }
          },
          {
            "type": "Microsoft.Storage/storageAccounts",
            "apiVersion": "2023-05-01",
            "name": "[variables('storageName')]",
            "location": "[resourceGroup().location]",
            "sku": { "name": "Standard_LRS" },
            "kind": "StorageV2"
          },
          {
            "type": "Microsoft.Network/networkInterfaces",
            "apiVersion": "2024-05-01",
            "name": "nic-vm1",
            "location": "[resourceGroup().location]",
            "properties": {
              "ipConfigurations": [ {
                "name": "ipconfig1",
                "properties": {
                  "subnet": {
                    "id": "[resourceId('Microsoft.Network/virtualNetworks/subnets', variables('vnetName'), 'snet-app')]"
                  }
                }
              } ]
            }
          },
          {
            "type": "Microsoft.Compute/virtualMachines",
            "apiVersion": "2024-07-01",
            "name": "vm1",
            "location": "[resourceGroup().location]",
            "dependsOn": [ "[resourceId('Microsoft.Network/networkInterfaces', 'nic-vm1')]" ],
            "properties": {
              "diagnosticsProfile": {
                "bootDiagnostics": {
                  "enabled": true,
                  "storageUri": "[reference(variables('storageName')).primaryEndpoints.blob]"
                }
              }
            }
          }
        ]
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso prévoit d'utiliser un même modèle ARM pour déployer une machine virtuelle avec diagnostics de démarrage dans plusieurs groupes de ressources du même abonnement. Avant le premier déploiement, vous examinez l'extrait suivant du modèle, dont les propriétés sans rapport ont été retirées.

        ```json
        "variables": {
          "vnetName": "vnet-app",
          "storageName": "[concat('stdiag', uniqueString(subscription().subscriptionId))]"
        },
        "resources": [
          {
            "type": "Microsoft.Network/virtualNetworks",
            "apiVersion": "2024-05-01",
            "name": "[variables('vnetName')]",
            "location": "[resourceGroup().location]",
            "properties": {
              "addressSpace": { "addressPrefixes": [ "10.60.0.0/16" ] },
              "subnets": [
                { "name": "snet-app", "properties": { "addressPrefix": "10.60.1.0/24" } }
              ]
            }
          },
          {
            "type": "Microsoft.Storage/storageAccounts",
            "apiVersion": "2023-05-01",
            "name": "[variables('storageName')]",
            "location": "[resourceGroup().location]",
            "sku": { "name": "Standard_LRS" },
            "kind": "StorageV2"
          },
          {
            "type": "Microsoft.Network/networkInterfaces",
            "apiVersion": "2024-05-01",
            "name": "nic-vm1",
            "location": "[resourceGroup().location]",
            "properties": {
              "ipConfigurations": [ {
                "name": "ipconfig1",
                "properties": {
                  "subnet": {
                    "id": "[resourceId('Microsoft.Network/virtualNetworks/subnets', variables('vnetName'), 'snet-app')]"
                  }
                }
              } ]
            }
          },
          {
            "type": "Microsoft.Compute/virtualMachines",
            "apiVersion": "2024-07-01",
            "name": "vm1",
            "location": "[resourceGroup().location]",
            "dependsOn": [ "[resourceId('Microsoft.Network/networkInterfaces', 'nic-vm1')]" ],
            "properties": {
              "diagnosticsProfile": {
                "bootDiagnostics": {
                  "enabled": true,
                  "storageUri": "[reference(variables('storageName')).primaryEndpoints.blob]"
                }
              }
            }
          }
        ]
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Resource Manager deploys vm1 only after the storage account has been created.
            fr: Resource Manager ne déploie vm1 qu'après la création du compte de stockage.
        - id: s2
          text:
            en: Resource Manager deploys nic-vm1 only after vnet-app has been created.
            fr: Resource Manager ne déploie nic-vm1 qu'après la création de vnet-app.
        - id: s3
          text:
            en: If you deploy the template to a resource group named RG1 and then to a resource group named RG2 in the same subscription, the two storage accounts get different names.
            fr: Si vous déployez le modèle dans un groupe de ressources nommé RG1, puis dans un groupe de ressources nommé RG2 du même abonnement, les deux comptes de stockage reçoivent des noms différents.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: "A `reference()` expression that names a resource of the same template creates an implicit dependency, so vm1 waits for the storage account. `resourceId()` only builds an ID and creates no dependency: without `dependsOn`, nic-vm1 and vnet-app can be deployed in parallel and the deployment can fail. `uniqueString()` returns the same value for the same input, and the subscription ID is the same for RG1 and RG2, so both deployments compute the same storage account name; because storage account names are globally unique, the second deployment cannot create a second account."
        fr: "Une expression `reference()` qui nomme une ressource du même modèle crée une dépendance implicite : vm1 attend donc le compte de stockage. `resourceId()` ne fait que construire un ID et ne crée aucune dépendance : sans `dependsOn`, nic-vm1 et vnet-app peuvent être déployés en parallèle et le déploiement peut échouer. `uniqueString()` renvoie la même valeur pour la même entrée, et l'ID d'abonnement est le même pour RG1 et RG2 : les deux déploiements calculent donc le même nom de compte de stockage ; comme les noms de comptes de stockage sont uniques au monde, le second déploiement ne peut pas créer un second compte."
      options:
        s2: { en: "Add a dependsOn entry on the virtual network to the network interface to force the order.", fr: "Ajoutez à l'interface réseau une entrée dependsOn sur le réseau virtuel pour imposer l'ordre." }
        s3: { en: "To get a different name per resource group, hash resourceGroup().id instead of the subscription ID.", fr: "Pour obtenir un nom différent par groupe de ressources, hachez resourceGroup().id au lieu de l'ID d'abonnement." }
    references:
      - title: Set deployment order for resources
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-dependency

  # ------------------------------------------------------------------ 7
  - id: az104-qz-31-07
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has an ARM template that deploys a logical SQL server. The name of the server is stored in a variable named **sqlServerName**. The template has a string parameter named **environment** whose allowed values are dev and prod.

        You need to add a database named **db-reports** to the template. The solution must meet the following requirements:

        - The database is declared as a top-level resource in the `resources` array of the template, not inside the definition of the server.
        - The database is deployed only when environment is prod.
        - Resource Manager never tries to create the database before the server exists.

        How should you complete the resource definition? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un modèle ARM qui déploie un serveur SQL logique. Le nom du serveur est stocké dans une variable nommée **sqlServerName**. Le modèle comporte un paramètre de type chaîne nommé **environment** dont les valeurs autorisées sont dev et prod.

        Vous devez ajouter au modèle une base de données nommée **db-reports**. La solution doit répondre aux exigences suivantes :

        - La base de données est déclarée comme ressource de niveau supérieur dans le tableau `resources` du modèle, et non dans la définition du serveur.
        - La base de données n'est déployée que lorsque environment vaut prod.
        - Resource Manager ne tente jamais de créer la base de données avant que le serveur existe.

        Comment devez-vous compléter la définition de la ressource ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "type": "[[rtype]]",
          "apiVersion": "2021-11-01",
          "name": "[[rname]]",
          "location": "[resourceGroup().location]",
          "condition": "[[cond]]",
          "dependsOn": [
            "[[dep]]"
          ],
          "sku": {
            "name": "S0"
          }
        }
      slots:
        - id: rtype
          options:
            - { id: t_full, text: Microsoft.Sql/servers/databases }
            - { id: t_short, text: databases }
            - { id: t_db, text: Microsoft.Sql/databases }
            - { id: t_server, text: Microsoft.Sql/servers }
        - id: rname
          options:
            - { id: n_short, text: db-reports }
            - { id: n_format, text: "[format('{0}/db-reports', variables('sqlServerName'))]" }
            - { id: n_rid, text: "[resourceId('Microsoft.Sql/servers/databases', variables('sqlServerName'), 'db-reports')]" }
            - { id: n_dot, text: "[concat(variables('sqlServerName'), '.db-reports')]" }
        - id: cond
          options:
            - { id: c_op, text: "[parameters('environment') == 'prod']" }
            - { id: c_empty, text: "[not(empty(parameters('environment')))]" }
            - { id: c_equals, text: "[equals(parameters('environment'), 'prod')]" }
            - { id: c_param, text: "[parameters('prod')]" }
        - id: dep
          options:
            - { id: d_db, text: "[resourceId('Microsoft.Sql/servers/databases', variables('sqlServerName'), 'db-reports')]" }
            - { id: d_sub, text: "[subscriptionResourceId('Microsoft.Sql/servers', variables('sqlServerName'))]" }
            - { id: d_server, text: "[resourceId('Microsoft.Sql/servers', variables('sqlServerName'))]" }
            - { id: d_env, text: "[parameters('environment')]" }
    answer:
      values: { rtype: t_full, rname: n_format, cond: c_equals, dep: d_server }
    explanation:
      correct:
        en: "A child resource declared outside its parent uses the full type (`Microsoft.Sql/servers/databases`) and a name that includes the parent name (`server/database`). ARM JSON has no `==` operator: the condition uses `equals()`. A child resource gets no implicit dependency on its parent, so `dependsOn` must reference the resource ID of the server."
        fr: "Une ressource enfant déclarée en dehors de son parent utilise le type complet (`Microsoft.Sql/servers/databases`) et un nom qui inclut le nom du parent (`serveur/base`). Le JSON ARM n'a pas d'opérateur `==` : la condition utilise `equals()`. Une ressource enfant n'a pas de dépendance implicite envers son parent : `dependsOn` doit donc référencer l'ID de ressource du serveur."
      options:
        t_short: { en: "The short type is valid only when the child is nested in the resources array of its parent.", fr: "Le type court n'est valide que lorsque l'enfant est imbriqué dans le tableau resources de son parent." }
        n_short: { en: "Outside the parent, the name must include the server name.", fr: "En dehors du parent, le nom doit inclure le nom du serveur." }
        n_rid: { en: "resourceId() returns a resource ID, not the name of the resource.", fr: "resourceId() renvoie un ID de ressource, pas le nom de la ressource." }
        c_empty: { en: "This expression is also true for dev, so the database would be deployed in every environment.", fr: "Cette expression est aussi vraie pour dev : la base de données serait déployée dans tous les environnements." }
        d_db: { en: "A resource cannot depend on itself.", fr: "Une ressource ne peut pas dépendre d'elle-même." }
        d_sub: { en: "The server is a resource of the resource group; a subscription-level ID does not identify it.", fr: "Le serveur est une ressource du groupe de ressources ; un ID de niveau abonnement ne l'identifie pas." }
    references:
      - title: Child resources in templates
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/child-resource-name-type
      - title: Set deployment order for resources
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-dependency

  # ------------------------------------------------------------------ 8
  - id: az104-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has a Bicep file named **network.bicep** that deploys a virtual network named **vnet-app**. The subnets are currently declared as separate child resources that use the `parent` property. Litware redeploys network.bicep regularly and wants the subnets to survive every redeployment of the virtual network.

        You need to modify network.bicep to meet the following requirements:

        - Create one subnet for each element of **subnetNames**, named snet-web, snet-app and snet-data with the default parameter value.
        - Assign the address prefixes 10.50.1.0/24, 10.50.2.0/24 and 10.50.3.0/24, in the order of subnetNames.

        How should you complete the file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un fichier Bicep nommé **network.bicep** qui déploie un réseau virtuel nommé **vnet-app**. Les sous-réseaux sont actuellement déclarés comme des ressources enfants distinctes qui utilisent la propriété `parent`. Litware redéploie régulièrement network.bicep et veut que les sous-réseaux soient conservés à chaque redéploiement du réseau virtuel.

        Vous devez modifier network.bicep pour répondre aux exigences suivantes :

        - Créer un sous-réseau par élément de **subnetNames**, soit snet-web, snet-app et snet-data avec la valeur par défaut du paramètre.
        - Attribuer les préfixes d'adresse 10.50.1.0/24, 10.50.2.0/24 et 10.50.3.0/24, dans l'ordre de subnetNames.

        Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        param subnetNames array = [
          'web'
          'app'
          'data'
        ]

        resource vnet 'Microsoft.Network/virtualNetworks@2024-05-01' = {
          name: 'vnet-app'
          location: resourceGroup().location
          properties: {
            addressSpace: {
              addressPrefixes: [
                '10.50.0.0/16'
              ]
            }
            [[prop]]: [[loop]]
              name: 'snet-${name}'
              properties: {
                addressPrefix: [[prefix]]
              }
            }]
          }
        }
      slots:
        - id: prop
          options:
            - { id: p_resources, text: resources }
            - { id: p_subnets, text: subnets }
            - { id: p_depends, text: dependsOn }
        - id: loop
          options:
            - { id: l_rev, text: "[for (i, name) in subnetNames: {" }
            - { id: l_noidx, text: "[for name in subnetNames: {" }
            - { id: l_ok, text: "[for (name, i) in subnetNames: {" }
            - { id: l_range, text: "[for i in range(0, length(subnetNames)): {" }
        - id: prefix
          options:
            - { id: x_i, text: "'10.50.${i}.0/24'" }
            - { id: x_plus, text: "'10.50.${i + 1}.0/24'" }
            - { id: x_name, text: "'10.50.${name}.0/24'" }
            - { id: x_lit, text: "'10.50.i.0/24'" }
    answer:
      values: { prop: p_subnets, loop: l_ok, prefix: x_plus }
    explanation:
      correct:
        en: "A redeployment reapplies every property of the virtual network, so subnets must be defined in its `subnets` property rather than as child resources to be kept. A `for` expression can build that array. The syntax `(item, index)` gives both the name and a zero-based index, so `${i + 1}` produces 1, 2 and 3."
        fr: "Un redéploiement réapplique toutes les propriétés du réseau virtuel : pour être conservés, les sous-réseaux doivent donc être définis dans sa propriété `subnets` plutôt que comme des ressources enfants. Une expression `for` peut construire ce tableau. La syntaxe `(élément, index)` fournit à la fois le nom et un index basé sur zéro : `${i + 1}` produit donc 1, 2 et 3."
      options:
        p_resources: { en: "resources is not a property of a virtual network; child resources are separate declarations in Bicep.", fr: "resources n'est pas une propriété d'un réseau virtuel ; en Bicep, les ressources enfants sont des déclarations distinctes." }
        l_rev: { en: "The item comes first and the index second: here i would hold the name and name the index.", fr: "L'élément vient en premier et l'index en second : ici, i contiendrait le nom et name l'index." }
        l_noidx: { en: "This loop declares no index variable, so i is undefined in the prefix.", fr: "Cette boucle ne déclare pas de variable d'index : i n'est donc pas défini dans le préfixe." }
        l_range: { en: "This loop declares only an index, so name is undefined in the subnet name.", fr: "Cette boucle ne déclare qu'un index : name n'est donc pas défini dans le nom du sous-réseau." }
        x_i: { en: "The index starts at 0, so the first subnet would get 10.50.0.0/24.", fr: "L'index commence à 0 : le premier sous-réseau recevrait donc 10.50.0.0/24." }
    references:
      - title: Deployment modes
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
      - title: Iterative loops in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/loops

  # ------------------------------------------------------------------ 9
  - id: az104-qz-31-09
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum Corporation has a resource group named **RG-Prod** in a subscription named **Sub1**. RG-Prod contains a Windows Server virtual machine named **vm-app1** with its network interface and managed disks, a virtual network, and a storage account named **stadatumdiag01** that stores the boot diagnostics of vm-app1. All these resources were deployed from an ARM template a year ago. Since then, administrators resized vm-app1 and added a data disk in the Azure portal.

        You select all the resources of RG-Prod and use **Export template** to export them as a Bicep file named **main.bicep**. You plan to deploy main.bicep by running `az deployment group create` to an empty resource group named **RG-Test** that you created in Sub1. The resources in RG-Test must have the current configuration of the production resources.

        Which two actions should you perform on main.bicep before you deploy it? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose d'un groupe de ressources nommé **RG-Prod** dans un abonnement nommé **Sub1**. RG-Prod contient une machine virtuelle Windows Server nommée **vm-app1** avec son interface réseau et ses disques managés, un réseau virtuel et un compte de stockage nommé **stadatumdiag01** qui stocke les diagnostics de démarrage de vm-app1. Toutes ces ressources ont été déployées à partir d'un modèle ARM il y a un an. Depuis, des administrateurs ont redimensionné vm-app1 et ajouté un disque de données dans le portail Azure.

        Vous sélectionnez toutes les ressources de RG-Prod et utilisez **Exporter le modèle** pour les exporter sous forme d'un fichier Bicep nommé **main.bicep**. Vous prévoyez de déployer main.bicep en exécutant `az deployment group create` dans un groupe de ressources vide nommé **RG-Test** que vous avez créé dans Sub1. Les ressources de RG-Test doivent avoir la configuration actuelle des ressources de production.

        Quelles sont les deux actions à effectuer sur main.bicep avant de le déployer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add a parameter that has the `@secure()` decorator for the administrator password of vm-app1, and use it in the definition of the virtual machine.", fr: "Ajouter un paramètre doté du décorateur `@secure()` pour le mot de passe administrateur de vm-app1, et l'utiliser dans la définition de la machine virtuelle." } }
        - { id: b, text: { en: "Replace main.bicep with the template saved from the deployment history of RG-Prod, and decompile that template to Bicep.", fr: "Remplacer main.bicep par le modèle enregistré depuis l'historique des déploiements de RG-Prod, et décompiler ce modèle en Bicep." } }
        - { id: c, text: { en: "Replace the hard-coded name of the storage account with an expression that uses `uniqueString(resourceGroup().id)`.", fr: "Remplacer le nom codé en dur du compte de stockage par une expression qui utilise `uniqueString(resourceGroup().id)`." } }
        - { id: d, text: { en: "Run `az bicep build` on main.bicep, and deploy the resulting JSON template instead of the Bicep file.", fr: "Exécuter `az bicep build` sur main.bicep, et déployer le modèle JSON obtenu au lieu du fichier Bicep." } }
        - { id: e, text: { en: "Add `targetScope = 'subscription'` at the top of main.bicep so that the file deploys to RG-Test.", fr: "Ajouter `targetScope = 'subscription'` en haut de main.bicep pour que le fichier se déploie dans RG-Test." } }
    answer: { optionIds: [ a, c ] }
    explanation:
      correct:
        en: "A template exported from a resource group reflects the current state of the resources, but it contains hard-coded values and can omit passwords. A new Windows virtual machine needs an administrator password, so you add a secure parameter for it. Storage account names are globally unique, so the hard-coded stadatumdiag01 would conflict with the production account; a name based on `uniqueString(resourceGroup().id)` differs in RG-Test."
        fr: "Un modèle exporté depuis un groupe de ressources reflète l'état actuel des ressources, mais il contient des valeurs codées en dur et peut omettre les mots de passe. Une nouvelle machine virtuelle Windows a besoin d'un mot de passe administrateur : vous ajoutez donc un paramètre sécurisé pour celui-ci. Les noms de comptes de stockage sont uniques au monde : le nom codé en dur stadatumdiag01 entrerait en conflit avec le compte de production, alors qu'un nom basé sur `uniqueString(resourceGroup().id)` est différent dans RG-Test."
      options:
        b: { en: "The deployment history holds the template as it was deployed a year ago, without the new size and the added data disk.", fr: "L'historique des déploiements contient le modèle tel qu'il a été déployé il y a un an, sans la nouvelle taille ni le disque de données ajouté." }
        d: { en: "az deployment group create accepts a .bicep file directly; building it to JSON first adds nothing.", fr: "az deployment group create accepte directement un fichier .bicep ; le compiler d'abord en JSON n'apporte rien." }
        e: { en: "The resources belong to a resource group; a resource group deployment uses the default resourceGroup target scope.", fr: "Les ressources appartiennent à un groupe de ressources ; un déploiement sur un groupe de ressources utilise l'étendue cible par défaut resourceGroup." }
    references:
      - title: Export template in Azure portal
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal
      - title: Use Bicep to manage secrets
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/scenarios-secrets

  # ------------------------------------------------------------------ 10
  - id: az104-qz-31-10
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: multi
    shuffle: false
    stem:
      en: |
        Northwind Traders has a resource group named **RG1** that contains the following resources:

        - Three storage accounts named stnwlogs1, stnwlogs2 and stnwlogs3, created by an earlier deployment of an ARM template named **logs.json**
        - A virtual network named vnet1, defined in logs.json
        - A network security group named nsg-legacy, created manually in the Azure portal

        A resource group named **RG2** in the same subscription contains a virtual machine named vm-test that was created manually. No lock exists in the subscription.

        In addition to the definition of vnet1, logs.json contains the following resource definition.

        ```json
        {
          "type": "Microsoft.Storage/storageAccounts",
          "apiVersion": "2023-05-01",
          "name": "[concat('stnwlogs', copyIndex(1))]",
          "location": "[resourceGroup().location]",
          "sku": { "name": "Standard_LRS" },
          "kind": "StorageV2",
          "copy": {
            "name": "logLoop",
            "count": "[parameters('logCount')]"
          }
        }
        ```

        You run the following command.

        ```bash
        az deployment group create \
          --resource-group RG1 \
          --template-file logs.json \
          --mode Complete \
          --parameters logCount=2
        ```

        Which two resources does the deployment delete?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un groupe de ressources nommé **RG1** qui contient les ressources suivantes :

        - Trois comptes de stockage nommés stnwlogs1, stnwlogs2 et stnwlogs3, créés par un déploiement antérieur d'un modèle ARM nommé **logs.json**
        - Un réseau virtuel nommé vnet1, défini dans logs.json
        - Un groupe de sécurité réseau nommé nsg-legacy, créé manuellement dans le portail Azure

        Un groupe de ressources nommé **RG2** du même abonnement contient une machine virtuelle nommée vm-test, créée manuellement. Aucun verrou n'existe dans l'abonnement.

        En plus de la définition de vnet1, logs.json contient la définition de ressource suivante.

        ```json
        {
          "type": "Microsoft.Storage/storageAccounts",
          "apiVersion": "2023-05-01",
          "name": "[concat('stnwlogs', copyIndex(1))]",
          "location": "[resourceGroup().location]",
          "sku": { "name": "Standard_LRS" },
          "kind": "StorageV2",
          "copy": {
            "name": "logLoop",
            "count": "[parameters('logCount')]"
          }
        }
        ```

        Vous exécutez la commande suivante.

        ```bash
        az deployment group create \
          --resource-group RG1 \
          --template-file logs.json \
          --mode Complete \
          --parameters logCount=2
        ```

        Quelles sont les deux ressources que le déploiement supprime ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: stnwlogs1 }
        - { id: b, text: stnwlogs2 }
        - { id: c, text: stnwlogs3 }
        - { id: d, text: vnet1 }
        - { id: e, text: nsg-legacy }
        - { id: f, text: vm-test }
    answer: { optionIds: [ c, e ] }
    explanation:
      correct:
        en: "With logCount=2 and `copyIndex(1)`, the loop resolves to stnwlogs1 and stnwlogs2 only. In complete mode, Resource Manager deletes the resources of the target resource group that are not in the resolved template: stnwlogs3 and nsg-legacy. Microsoft recommends running what-if before any complete-mode deployment, and using deployment stacks rather than complete mode to delete resources."
        fr: "Avec logCount=2 et `copyIndex(1)`, la boucle se résout en stnwlogs1 et stnwlogs2 uniquement. En mode complet, Resource Manager supprime les ressources du groupe de ressources cible qui ne figurent pas dans le modèle résolu : stnwlogs3 et nsg-legacy. Microsoft recommande d'exécuter what-if avant tout déploiement en mode complet, et d'utiliser les piles de déploiement (deployment stacks) plutôt que le mode complet pour supprimer des ressources."
      options:
        a: { en: "copyIndex(1) starts at 1, so stnwlogs1 is the first instance of the loop and is kept.", fr: "copyIndex(1) commence à 1 : stnwlogs1 est donc la première instance de la boucle et est conservé." }
        b: { en: "stnwlogs2 is the second instance of the loop; it would be deleted only if copyIndex() started at 0.", fr: "stnwlogs2 est la deuxième instance de la boucle ; il ne serait supprimé que si copyIndex() commençait à 0." }
        d: { en: "vnet1 is defined in the template, so it is created or updated, not deleted.", fr: "vnet1 est défini dans le modèle : il est donc créé ou mis à jour, pas supprimé." }
        f: { en: "Complete mode deletes only resources of the resource group targeted by the deployment, here RG1.", fr: "Le mode complet ne supprime que des ressources du groupe de ressources ciblé par le déploiement, ici RG1." }
    references:
      - title: Deployment modes
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
