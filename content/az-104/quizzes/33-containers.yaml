chapter: 33-containers
questions:
  - id: az104-qz-33-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso plans to create an Azure container registry for its production images. The chosen name must not already be used by another registry in Azure.

        Which name can you use for the registry?
      fr: |
        Contoso prévoit de créer un registre de conteneurs Azure pour ses images de production. Le nom choisi ne doit pas déjà être utilisé par un autre registre dans Azure.

        Quel nom pouvez-vous utiliser pour le registre ?
    body:
      options:
        - { id: a, text: cr-contoso-prod }
        - { id: b, text: crcontosoprod01 }
        - { id: c, text: cr_contoso_prod }
        - { id: d, text: crc1 }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A registry name must be unique in Azure and contain 5 to 50 lowercase alphanumeric characters. crcontosoprod01 has 15 lowercase letters and digits, so it is valid. Clients then reach the registry through its login server, which ends in azurecr.io.
        fr: |
          Un nom de registre doit être unique dans Azure et contenir de 5 à 50 caractères alphanumériques en minuscules. crcontosoprod01 compte 15 lettres minuscules et chiffres : il est donc valide. Les clients accèdent ensuite au registre par son serveur de connexion, qui se termine par azurecr.io.
      options:
        a:
          en: "The dash isn't permitted in a registry name."
          fr: "Le tiret n'est pas autorisé dans un nom de registre."
        c:
          en: "An underscore isn't an alphanumeric character."
          fr: "Le trait de soulignement n'est pas un caractère alphanumérique."
        d:
          en: "crc1 has only 4 characters; the minimum is 5."
          fr: "crc1 ne compte que 4 caractères ; le minimum est de 5."
    references:
      - title: Quickstart - Create Registry - Azure CLI
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli

  - id: az104-qz-33-02
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin creates a container group named **aci-export** by running `az container create` without the `--restart-policy` parameter. The only container runs an export script that ends with exit code 0 after about 10 minutes.

        What happens after the script ends?
      fr: |
        Tailspin crée un groupe de conteneurs nommé **aci-export** en exécutant `az container create` sans le paramètre `--restart-policy`. L'unique conteneur exécute un script d'exportation qui se termine avec le code de sortie 0 au bout d'environ 10 minutes.

        Que se passe-t-il une fois le script terminé ?
    body:
      options:
        - { id: a, text: { en: "The container group goes to the Terminated state, and billing stops.", fr: "Le groupe de conteneurs passe à l'état Terminated, et la facturation s'arrête." } }
        - { id: b, text: { en: "The container group is deleted automatically, and billing stops.", fr: "Le groupe de conteneurs est supprimé automatiquement, et la facturation s'arrête." } }
        - { id: c, text: { en: "The container is restarted, and the container group keeps being billed.", fr: "Le conteneur est redémarré, et le groupe de conteneurs continue d'être facturé." } }
        - { id: d, text: { en: "The container is restarted once, and then the group goes to the Terminated state.", fr: "Le conteneur est redémarré une fois, puis le groupe passe à l'état Terminated." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When no restart policy is specified, Azure Container Instances applies Always, the default policy. With Always, the containers of the group are restarted whenever they exit, even with exit code 0, so the group keeps running and per-second billing continues. For a run-once task, set OnFailure or Never.
        fr: |
          Lorsqu'aucune stratégie de redémarrage n'est indiquée, Azure Container Instances applique Always, la stratégie par défaut. Avec Always, les conteneurs du groupe sont redémarrés chaque fois qu'ils se terminent, même avec le code de sortie 0 : le groupe reste donc en exécution et la facturation à la seconde continue. Pour une tâche à exécution unique, définissez OnFailure ou Never.
      options:
        a:
          en: "This is what happens with OnFailure or Never, not with the default policy."
          fr: "C'est ce qui se passe avec OnFailure ou Never, pas avec la stratégie par défaut."
        b:
          en: "Azure Container Instances doesn't delete a container group when its containers exit."
          fr: "Azure Container Instances ne supprime pas un groupe de conteneurs quand ses conteneurs se terminent."
        d:
          en: "No restart policy restarts a container once and then stops; Always keeps restarting it."
          fr: "Aucune stratégie de redémarrage ne redémarre un conteneur une seule fois avant de s'arrêter ; Always le redémarre indéfiniment."
    references:
      - title: Restart policy for run-once tasks
        url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-restart-policy

  - id: az104-qz-33-03
    objective: "3.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure container registry named **crfabrikam**. Some container groups can't reach Docker Hub and must run the official Redis image, tag 7.2, from crfabrikam instead.

        You need to copy the image into crfabrikam from a workstation where the Azure CLI is installed but Docker isn't. The solution must minimize administrative effort.

        What should you run?
      fr: |
        Fabrikam dispose d'un registre de conteneurs Azure nommé **crfabrikam**. Certains groupes de conteneurs ne peuvent pas joindre Docker Hub et doivent exécuter l'image officielle Redis, balise 7.2, à partir de crfabrikam.

        Vous devez copier l'image dans crfabrikam depuis un poste de travail sur lequel Azure CLI est installé, mais pas Docker. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`az acr build --registry crfabrikam --image redis:7.2 .`" }
        - { id: b, text: { en: "`az acr login --name crfabrikam`, then `docker pull`, `docker tag` and `docker push`", fr: "`az acr login --name crfabrikam`, puis `docker pull`, `docker tag` et `docker push`" } }
        - { id: c, text: "`az acr import --name crfabrikam --source docker.io/library/redis:7.2 --image redis:7.2`" }
        - { id: d, text: "`az acr replication create --registry crfabrikam --location westeurope`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `az acr import` copies an image from another registry, such as Docker Hub, directly into the registry by using Azure APIs, so no local Docker installation is needed. For an official Docker Hub image, `--source` includes the `library` repository and the tag.
        fr: |
          `az acr import` copie une image d'un autre registre, comme Docker Hub, directement dans le registre en utilisant les API Azure : aucune installation locale de Docker n'est nécessaire. Pour une image officielle de Docker Hub, `--source` inclut le référentiel `library` et la balise.
      options:
        a:
          en: "`az acr build` builds an image from the Dockerfile of a build context; it doesn't copy an existing image from Docker Hub."
          fr: "`az acr build` génère une image à partir du Dockerfile d'un contexte de build ; il ne copie pas une image existante de Docker Hub."
        b:
          en: "The docker pull, tag and push commands need a local Docker engine, which the workstation doesn't have."
          fr: "Les commandes docker pull, tag et push nécessitent un moteur Docker local, que le poste de travail n'a pas."
        d:
          en: "Geo-replication copies the registry's own content to another region (Premium tier only); it doesn't bring in images from Docker Hub."
          fr: "La géoréplication copie le contenu du registre lui-même vers une autre région (niveau Premium uniquement) ; elle n'importe pas d'images de Docker Hub."
    references:
      - title: Import Container Images to ACR using Azure APIs
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-import-images

  - id: az104-qz-33-04
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum deploys a container app named **ca-portal** in a Container Apps environment that is reachable from the internet. ca-portal has external HTTP ingress with the target port set to 80. Its container image runs a Node.js web server that listens on port 3000.

        Requests to the FQDN of ca-portal fail. You need users to reach the portal over HTTPS from the internet.

        What should you do?
      fr: |
        Adatum déploie une application conteneur nommée **ca-portal** dans un environnement Container Apps accessible depuis Internet. ca-portal dispose d'une entrée HTTP externe dont le port cible est défini sur 80. Son image conteneur exécute un serveur web Node.js qui écoute sur le port 3000.

        Les requêtes vers le FQDN de ca-portal échouent. Vous devez permettre aux utilisateurs d'atteindre le portail en HTTPS depuis Internet.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the ingress type of ca-portal to internal.", fr: "Changer le type d'entrée de ca-portal en interne." } }
        - { id: b, text: { en: "Allow insecure connections on the ingress of ca-portal.", fr: "Autoriser les connexions non sécurisées sur l'entrée de ca-portal." } }
        - { id: c, text: { en: "Change the ingress transport of ca-portal to TCP and expose port 3000.", fr: "Changer le transport de l'entrée de ca-portal en TCP et exposer le port 3000." } }
        - { id: d, text: { en: "Change the ingress target port of ca-portal to 3000.", fr: "Changer le port cible de l'entrée de ca-portal en 3000." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The target port is the port that the container listens to for incoming requests. HTTP ingress always exposes the app on port 443 and forwards each request to the target port, so nothing answers while the target port is 80. Setting it to 3000, the port of the Node.js server, fixes the app.
        fr: |
          Le port cible est le port sur lequel le conteneur écoute les requêtes entrantes. L'entrée HTTP expose toujours l'application sur le port 443 et transmet chaque requête au port cible : rien ne répond tant que le port cible est 80. Le définir sur 3000, le port du serveur Node.js, corrige l'application.
      options:
        a:
          en: "Internal ingress makes the app reachable only from the same environment, not from the internet."
          fr: "Une entrée interne rend l'application accessible uniquement depuis le même environnement, pas depuis Internet."
        b:
          en: "Allowing insecure connections only stops the redirection of HTTP to HTTPS; requests would still be sent to port 80, where nothing listens."
          fr: "Autoriser les connexions non sécurisées supprime seulement la redirection de HTTP vers HTTPS ; les requêtes seraient toujours envoyées au port 80, où rien n'écoute."
        c:
          en: "The TCP transport is for apps that use a protocol other than HTTP; the portal is a web app, and only its target port is wrong."
          fr: "Le transport TCP sert aux applications qui utilisent un autre protocole que HTTP ; le portail est une application web, et seul son port cible est incorrect."
    references:
      - title: Configure Ingress for your app in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-how-to

  - id: az104-qz-33-05
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip runs a public REST API in a container group named **aci-catalog** in Azure Container Instances. The group has 2 CPUs and 4 GB of memory. Traffic ranges from a few requests per hour at night to thousands of concurrent requests during promotions.

        You need the API to add instances automatically when the number of HTTP requests grows and to remove them when traffic drops. The solution must not require you to manage a Kubernetes cluster and must minimize administrative effort.

        What should you do?
      fr: |
        Wingtip exécute une API REST publique dans un groupe de conteneurs nommé **aci-catalog** dans Azure Container Instances. Le groupe dispose de 2 processeurs et de 4 Go de mémoire. Le trafic va de quelques requêtes par heure la nuit à des milliers de requêtes simultanées pendant les promotions.

        Vous devez faire en sorte que l'API ajoute automatiquement des instances quand le nombre de requêtes HTTP augmente et les supprime quand le trafic baisse. La solution ne doit pas vous obliger à gérer un cluster Kubernetes et doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Redeploy the API to Azure Container Apps with an HTTP scale rule.", fr: "Redéployer l'API dans Azure Container Apps avec une règle de mise à l'échelle HTTP." } }
        - { id: b, text: { en: "Create an Azure Monitor autoscale setting for aci-catalog based on CPU usage.", fr: "Créer un paramètre de mise à l'échelle automatique Azure Monitor pour aci-catalog fondé sur l'utilisation du processeur." } }
        - { id: c, text: { en: "Recreate aci-catalog with twice as much CPU and memory.", fr: "Recréer aci-catalog avec deux fois plus de processeur et de mémoire." } }
        - { id: d, text: { en: "Deploy the API to an AKS cluster with a Horizontal Pod Autoscaler.", fr: "Déployer l'API sur un cluster AKS avec un Horizontal Pod Autoscaler." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Container Instances has no autoscale: a container group keeps the CPU and memory set at its creation, and more capacity means deploying more groups yourself. Azure Container Apps is a serverless platform that adds and removes replicas automatically; an HTTP scale rule adds a replica when the concurrent requests per replica exceed the configured value, and you don't manage the underlying infrastructure.
        fr: |
          Azure Container Instances n'a pas de mise à l'échelle automatique : un groupe de conteneurs conserve le processeur et la mémoire définis à sa création, et obtenir plus de capacité implique de déployer vous-même d'autres groupes. Azure Container Apps est une plateforme serverless qui ajoute et supprime des réplicas automatiquement ; une règle de mise à l'échelle HTTP ajoute un réplica quand les requêtes simultanées par réplica dépassent la valeur configurée, sans que vous gériez l'infrastructure sous-jacente.
      options:
        b:
          en: "Container groups don't support autoscale, so no autoscale setting can add or remove instances of aci-catalog."
          fr: "Les groupes de conteneurs ne prennent pas en charge la mise à l'échelle automatique : aucun paramètre ne peut ajouter ou supprimer des instances d'aci-catalog."
        c:
          en: "A bigger group has a fixed size; it doesn't add or remove instances with traffic, and it's billed for its full size at night."
          fr: "Un groupe plus grand a une taille fixe ; il n'ajoute ni ne supprime d'instances selon le trafic, et il est facturé pour sa taille complète la nuit."
        d:
          en: "AKS requires you to manage a Kubernetes cluster, which the requirements exclude."
          fr: "AKS vous oblige à gérer un cluster Kubernetes, ce que les exigences excluent."
    references:
      - title: Azure Container Apps overview
        url: https://learn.microsoft.com/en-us/azure/container-apps/overview
      - title: Scaling in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app

  - id: az104-qz-33-06
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware has an Azure container registry named **crlitware**. The Dockerfiles of its application images are stored in GitHub repositories. No computer at Litware has a Docker engine installed.

        You need to meet the following requirements:

        - **web**: rebuild the image each time the platform team pushes a patched version of the `base/aspnet:8.0` image to crlitware. The web Dockerfile uses this image in its `FROM` instruction.
        - **scanner**: rebuild the image every Sunday at 23:00 UTC, even when neither its code nor its base image has changed.
        - **api**: build the image once, now, from the files in a folder on a developer's laptop.
        - **portal**: rebuild the image each time a developer pushes a change to the main branch of its repository.

        Which registry feature should you use for each image? To answer, drag the appropriate features to the correct images. Each feature may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un registre de conteneurs Azure nommé **crlitware**. Les Dockerfiles de ses images d'application sont stockés dans des référentiels GitHub. Aucun ordinateur de Litware n'a de moteur Docker installé.

        Vous devez répondre aux exigences suivantes :

        - **web** : générer à nouveau l'image chaque fois que l'équipe plateforme envoie (push) une version corrigée de l'image `base/aspnet:8.0` vers crlitware. Le Dockerfile de web utilise cette image dans son instruction `FROM`.
        - **scanner** : générer à nouveau l'image chaque dimanche à 23:00 UTC, même si ni son code ni son image de base n'ont changé.
        - **api** : générer l'image une seule fois, maintenant, à partir des fichiers d'un dossier de l'ordinateur portable d'un développeur.
        - **portal** : générer à nouveau l'image chaque fois qu'un développeur envoie une modification vers la branche main de son référentiel.

        Quelle fonctionnalité du registre devez-vous utiliser pour chaque image ? Pour répondre, faites glisser les fonctionnalités appropriées vers les images correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: quick, text: { en: "Quick task (`az acr build`)", fr: "Tâche rapide (`az acr build`)" } }
        - { id: commit, text: { en: "ACR task with a source code commit trigger", fr: "Tâche ACR avec un déclencheur sur commit du code source" } }
        - { id: base, text: { en: "ACR task with a base image update trigger", fr: "Tâche ACR avec un déclencheur sur mise à jour de l'image de base" } }
        - { id: timer, text: { en: "ACR task with a timer trigger", fr: "Tâche ACR avec un déclencheur de minuteur" } }
        - { id: import, text: { en: "Image import (`az acr import`)", fr: "Importation d'image (`az acr import`)" } }
        - { id: georep, text: { en: "Geo-replication", fr: "Géoréplication" } }
      targets:
        - { id: web, text: web }
        - { id: scanner, text: scanner }
        - { id: api, text: api }
        - { id: portal, text: portal }
    answer:
      mapping: { web: base, scanner: timer, api: quick, portal: commit }
    explanation:
      correct:
        en: |
          ACR Tasks builds images in Azure, so no local Docker engine is needed. A base image update trigger rebuilds the images that depend on a base image when an updated version is pushed to the registry. A timer trigger runs the task on a cron schedule, whatever has changed. A quick task (`az acr build`) sends a local build context to the registry and builds the image once. A source code commit trigger starts a build when code is committed to the Git repository.
        fr: |
          ACR Tasks génère les images dans Azure : aucun moteur Docker local n'est nécessaire. Un déclencheur sur mise à jour de l'image de base génère à nouveau les images qui dépendent d'une image de base quand une version mise à jour est envoyée vers le registre. Un déclencheur de minuteur exécute la tâche selon une planification cron, quels que soient les changements. Une tâche rapide (`az acr build`) envoie un contexte de build local au registre et génère l'image une fois. Un déclencheur sur commit du code source lance un build quand du code est validé dans le référentiel Git.
      options:
        import:
          en: "Import copies an existing image from another registry; it doesn't build an image from a Dockerfile."
          fr: "L'importation copie une image existante d'un autre registre ; elle ne génère pas d'image à partir d'un Dockerfile."
        georep:
          en: "Geo-replication replicates the registry to other regions; it doesn't build images."
          fr: "La géoréplication réplique le registre dans d'autres régions ; elle ne génère pas d'images."
    references:
      - title: Automate Container Builds with Azure Container Registry Tasks
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview

  - id: az104-qz-33-07
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Contoso has a container app named **ca-checkout** that runs on the Consumption plan and has external HTTP ingress. Load tests show the following:

        - One replica handles up to 40 concurrent HTTP requests without errors.
        - The peak load is 400 concurrent requests.
        - Each replica opens one connection to a database server that accepts at most 10 connections from ca-checkout.

        You need to configure scaling for ca-checkout to meet the following requirements:

        - At least two replicas must run at all times, so that no request waits for a replica to start.
        - The app must handle the peak load without exceeding the database connection limit.
        - Costs must be minimized.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une application conteneur nommée **ca-checkout** qui s'exécute sur le plan Consommation et possède une entrée HTTP externe. Les tests de charge montrent ce qui suit :

        - Un réplica traite jusqu'à 40 requêtes HTTP simultanées sans erreur.
        - La charge de pointe est de 400 requêtes simultanées.
        - Chaque réplica ouvre une connexion vers un serveur de base de données qui accepte au plus 10 connexions de ca-checkout.

        Vous devez configurer la mise à l'échelle de ca-checkout pour répondre aux exigences suivantes :

        - Au moins deux réplicas doivent s'exécuter en permanence, afin qu'aucune requête n'attende le démarrage d'un réplica.
        - L'application doit absorber la charge de pointe sans dépasser la limite de connexions de la base de données.
        - Les coûts doivent être réduits au minimum.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az containerapp update --name ca-checkout --resource-group rg-shop \
          --min-replicas [[min]] --max-replicas [[max]] \
          --scale-rule-name http-load --scale-rule-type http \
          --scale-rule-http-concurrency [[conc]]
      slots:
        - id: min
          options:
            - { id: m0, text: "0" }
            - { id: m1, text: "1" }
            - { id: m2, text: "2" }
            - { id: m10, text: "10" }
        - id: max
          options:
            - { id: x4, text: "4" }
            - { id: x10, text: "10" }
            - { id: x40, text: "40" }
        - id: conc
          options:
            - { id: c10, text: "10" }
            - { id: c40, text: "40" }
            - { id: c400, text: "400" }
    answer:
      values: { min: m2, max: x10, conc: c40 }
    explanation:
      correct:
        en: |
          With a minimum of 2, two replicas always run, so no request waits for a cold start, and 2 is the lowest value that meets the requirement. The HTTP rule adds a replica when the concurrent requests per replica exceed the concurrency value; 40 matches what one replica can handle, so replicas are added only when needed. At the peak, desiredReplicas = ceil(400 / 40) = 10, and a maximum of 10 keeps the app within the 10 database connections.
        fr: |
          Avec un minimum de 2, deux réplicas s'exécutent toujours : aucune requête n'attend un démarrage à froid, et 2 est la plus petite valeur qui répond à l'exigence. La règle HTTP ajoute un réplica quand les requêtes simultanées par réplica dépassent la valeur de concurrence ; 40 correspond à ce qu'un réplica peut traiter, de sorte que des réplicas ne sont ajoutés qu'en cas de besoin. À la pointe, desiredReplicas = ceil(400 / 40) = 10, et un maximum de 10 maintient l'application dans la limite de 10 connexions à la base de données.
      options:
        m0:
          en: "With 0, the app scales to zero when idle, and the first request then waits for a replica to start."
          fr: "Avec 0, l'application descend à zéro quand elle est inactive, et la première requête attend alors le démarrage d'un réplica."
        m1:
          en: "One replica doesn't meet the requirement of two replicas at all times."
          fr: "Un seul réplica ne répond pas à l'exigence de deux réplicas en permanence."
        m10:
          en: "Ten permanent replicas meet the requirement but cost more than two."
          fr: "Dix réplicas permanents répondent à l'exigence mais coûtent plus cher que deux."
        x4:
          en: "Four replicas handle only 160 concurrent requests at 40 each."
          fr: "Quatre réplicas ne traitent que 160 requêtes simultanées à raison de 40 chacun."
        x40:
          en: "Up to 40 replicas could open 40 database connections, above the limit of 10."
          fr: "Jusqu'à 40 réplicas pourraient ouvrir 40 connexions à la base de données, au-delà de la limite de 10."
        c10:
          en: "A value of 10 adds replicas four times earlier than needed, which increases costs."
          fr: "Une valeur de 10 ajoute des réplicas quatre fois plus tôt que nécessaire, ce qui augmente les coûts."
        c400:
          en: "A single replica would receive up to 400 concurrent requests, ten times what it can handle."
          fr: "Un seul réplica recevrait jusqu'à 400 requêtes simultanées, soit dix fois ce qu'il peut traiter."
    references:
      - title: Scaling in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app

  - id: az104-qz-33-08
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has a virtual network named **VNet1** that contains two subnets:

        - **snet-aci**, which is delegated to Azure Container Instances and contains no other resources
        - **snet-vm**, which contains two virtual machines

        You deploy a container group named **aci-ingest** by running `az container create --resource-group rg-ingest --file aci-ingest.yaml`. The file is shown in the **aci-ingest.yaml** exhibit. Registry credentials are configured and aren't shown.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un réseau virtuel nommé **VNet1** qui contient deux sous-réseaux :

        - **snet-aci**, délégué à Azure Container Instances et qui ne contient aucune autre ressource
        - **snet-vm**, qui contient deux machines virtuelles

        Vous déployez un groupe de conteneurs nommé **aci-ingest** en exécutant `az container create --resource-group rg-ingest --file aci-ingest.yaml`. Le fichier figure dans la pièce **aci-ingest.yaml**. Les informations d'identification du registre sont configurées et ne sont pas affichées.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: yaml
        title: aci-ingest.yaml
        body: |
          ```yaml
          apiVersion: 2019-12-01
          location: westeurope
          name: aci-ingest
          properties:
            osType: Linux
            restartPolicy: OnFailure
            containers:
            - name: ingest
              properties:
                image: crwoodgrove.azurecr.io/ingest:2.3
                resources:
                  requests:
                    cpu: 1
                    memoryInGB: 2
                ports:
                - port: 8080
                volumeMounts:
                - name: staging
                  mountPath: /mnt/staging
            - name: metrics
              properties:
                image: crwoodgrove.azurecr.io/metrics:1.0
                resources:
                  requests:
                    cpu: 0.5
                    memoryInGB: 0.5
                ports:
                - port: 9100
            ipAddress:
              type: Private
              ports:
              - protocol: tcp
                port: 8080
            subnetIds:
            - id: /subscriptions/<subscription ID>/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/VNet1/subnets/snet-aci
            volumes:
            - name: staging
              azureFile:
                shareName: staging
                storageAccountName: stwoodgrove
                storageAccountKey: <storage account key>
          type: Microsoft.ContainerInstance/containerGroups
          ```
    body:
      statements:
        - id: s1
          text:
            en: "A virtual machine in snet-vm can connect to the metrics container on port 9100 by using the private IP address of aci-ingest."
            fr: "Une machine virtuelle de snet-vm peut se connecter au conteneur metrics sur le port 9100 en utilisant l'adresse IP privée d'aci-ingest."
        - id: s2
          text:
            en: "The files that the ingest container writes to /mnt/staging are still in the staging file share after aci-ingest is deleted."
            fr: "Les fichiers que le conteneur ingest écrit dans /mnt/staging se trouvent toujours dans le partage de fichiers staging après la suppression d'aci-ingest."
        - id: s3
          text:
            en: "You can redeploy aci-ingest to snet-vm by changing only the subnet ID in the file."
            fr: "Vous pouvez redéployer aci-ingest dans snet-vm en changeant uniquement l'ID de sous-réseau dans le fichier."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          To reach a container from outside its group, its port must be exposed both from the container and on the group's IP address. Only port 8080 is listed under ipAddress, so port 9100 is reachable only by the other container of the group, through localhost. The Azure file share is an external store, so its data persists beyond the lifetime of the containers and of the group. A subnet used for container groups must be delegated and can contain only container groups, so snet-vm, which hosts virtual machines, can't receive aci-ingest.
        fr: |
          Pour atteindre un conteneur depuis l'extérieur de son groupe, son port doit être exposé à la fois par le conteneur et sur l'adresse IP du groupe. Seul le port 8080 figure sous ipAddress : le port 9100 n'est donc accessible qu'à l'autre conteneur du groupe, par localhost. Le partage de fichiers Azure est un stockage externe : ses données persistent au-delà de la durée de vie des conteneurs et du groupe. Un sous-réseau utilisé pour des groupes de conteneurs doit être délégué et ne peut contenir que des groupes de conteneurs : snet-vm, qui héberge des machines virtuelles, ne peut donc pas recevoir aci-ingest.
      options:
        s1:
          en: "Port 9100 is exposed by the metrics container but not on the group's IP address."
          fr: "Le port 9100 est exposé par le conteneur metrics, mais pas sur l'adresse IP du groupe."
        s3:
          en: "snet-vm contains virtual machines and isn't delegated to Azure Container Instances, so the deployment fails."
          fr: "snet-vm contient des machines virtuelles et n'est pas délégué à Azure Container Instances : le déploiement échoue."
    references:
      - title: Introduction to container groups
        url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-container-groups
      - title: Deploy container group to Azure virtual network
        url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-vnet

  - id: az104-qz-33-09
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind has a container app named **ca-billing** in multiple revision mode. Two revisions are active: **ca-billing--v7** receives 90 percent of the traffic and **ca-billing--v8** receives 10 percent. In both revisions, the environment variable `DB_CONN` references the app secret `db-conn`.

        After a password rotation, you run the following command:

        ```bash
        az containerapp secret set --name ca-billing --resource-group rg-billing \
          --secrets db-conn=<new connection string>
        ```

        You need both revisions to use the new value. ca-billing--v7 and ca-billing--v8 must remain the only active revisions, with the current traffic split. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Northwind dispose d'une application conteneur nommée **ca-billing** en mode révisions multiples. Deux révisions sont actives : **ca-billing--v7** reçoit 90 % du trafic et **ca-billing--v8** en reçoit 10 %. Dans les deux révisions, la variable d'environnement `DB_CONN` référence le secret d'application `db-conn`.

        Après une rotation de mot de passe, vous exécutez la commande suivante :

        ```bash
        az containerapp secret set --name ca-billing --resource-group rg-billing \
          --secrets db-conn=<new connection string>
        ```

        Vous devez faire en sorte que les deux révisions utilisent la nouvelle valeur. ca-billing--v7 et ca-billing--v8 doivent rester les seules révisions actives, avec la répartition actuelle du trafic. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Do nothing more, because application-scope settings apply to all active revisions.", fr: "Ne rien faire de plus, car les paramètres de portée application s'appliquent à toutes les révisions actives." } }
        - { id: b, text: { en: "Restart ca-billing--v8 only, because it's the latest revision.", fr: "Redémarrer ca-billing--v8 uniquement, car c'est la dernière révision." } }
        - { id: c, text: { en: "Restart both ca-billing--v7 and ca-billing--v8.", fr: "Redémarrer à la fois ca-billing--v7 et ca-billing--v8." } }
        - { id: d, text: { en: "Deploy a new revision of ca-billing that uses the current image.", fr: "Déployer une nouvelle révision de ca-billing qui utilise l'image actuelle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Secrets are scoped to the application, and changing one doesn't create a revision, but an updated secret doesn't automatically affect the existing revisions. To pick up the new value, you either deploy a new revision or restart the existing ones. Because v7 and v8 must remain the only active revisions, you restart both of them with `az containerapp revision restart`.
        fr: |
          Les secrets ont une portée application, et en modifier un ne crée pas de révision, mais un secret mis à jour n'affecte pas automatiquement les révisions existantes. Pour prendre en compte la nouvelle valeur, vous déployez une nouvelle révision ou vous redémarrez les révisions existantes. Comme v7 et v8 doivent rester les seules révisions actives, vous redémarrez les deux avec `az containerapp revision restart`.
      options:
        a:
          en: "Running revisions keep the old value until they're restarted, even though the secret itself is defined at the application level."
          fr: "Les révisions en cours d'exécution conservent l'ancienne valeur jusqu'à leur redémarrage, même si le secret lui-même est défini au niveau de l'application."
        b:
          en: "A restart affects only the revision that is restarted; ca-billing--v7, which receives 90 percent of the traffic, would keep the old value."
          fr: "Un redémarrage n'affecte que la révision redémarrée ; ca-billing--v7, qui reçoit 90 % du trafic, conserverait l'ancienne valeur."
        d:
          en: "A new revision adds a third active revision and leaves v7 and v8 with the old value, which the requirements forbid."
          fr: "Une nouvelle révision ajoute une troisième révision active et laisse l'ancienne valeur à v7 et v8, ce que les exigences interdisent."
    references:
      - title: Manage secrets in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
      - title: Manage revisions in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/revisions-manage

  - id: az104-qz-33-10
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Fabrikam has a container app named **ca-shop** with external HTTP ingress. ca-shop already uses multiple revision mode, and its traffic settings are the defaults. One revision is active: **ca-shop--v1**.

        You plan to release version 2.0 of the container image as a revision named **ca-shop--v2**. The release must meet the following requirements:

        - Customers must keep using ca-shop--v1 until testers approve ca-shop--v2.
        - Testers must use the same URL for this release and for later releases.
        - After approval, all customer traffic must go to ca-shop--v2.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Fabrikam dispose d'une application conteneur nommée **ca-shop** avec une entrée HTTP externe. ca-shop utilise déjà le mode révisions multiples, et ses paramètres de trafic sont ceux par défaut. Une révision est active : **ca-shop--v1**.

        Vous prévoyez de publier la version 2.0 de l'image conteneur sous la forme d'une révision nommée **ca-shop--v2**. La publication doit répondre aux exigences suivantes :

        - Les clients doivent continuer à utiliser ca-shop--v1 jusqu'à ce que les testeurs approuvent ca-shop--v2.
        - Les testeurs doivent utiliser la même URL pour cette publication et pour les suivantes.
        - Après l'approbation, tout le trafic des clients doit aller vers ca-shop--v2.

        Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans l'ordre correct.
    body:
      count: 4
      actions:
        - { id: deploy, text: { en: "Run `az containerapp update` with the 2.0 image and the revision suffix `v2`.", fr: "Exécuter `az containerapp update` avec l'image 2.0 et le suffixe de révision `v2`." } }
        - { id: single, text: { en: "Switch ca-shop to single revision mode.", fr: "Passer ca-shop en mode révision unique." } }
        - { id: switch, text: { en: "Set the traffic weight of ca-shop--v2 to 100 and that of ca-shop--v1 to 0.", fr: "Définir le poids de trafic de ca-shop--v2 sur 100 et celui de ca-shop--v1 sur 0." } }
        - { id: deact, text: { en: "Deactivate ca-shop--v1.", fr: "Désactiver ca-shop--v1." } }
        - { id: pin, text: { en: "Set the traffic weight of ca-shop--v1 to 100.", fr: "Définir le poids de trafic de ca-shop--v1 sur 100." } }
        - { id: restart, text: { en: "Restart ca-shop--v1.", fr: "Redémarrer ca-shop--v1." } }
        - { id: label, text: { en: "Add the label `test` to ca-shop--v2 and give the label's URL to the testers.", fr: "Ajouter l'étiquette `test` à ca-shop--v2 et donner l'URL de l'étiquette aux testeurs." } }
    answer:
      sequence: [pin, deploy, label, switch]
    explanation:
      correct:
        en: |
          By default, all traffic goes to the latest deployed revision, so you first fix 100 percent of the traffic on ca-shop--v1 by revision name; otherwise customers move to v2 as soon as it's ready. You then deploy v2, which receives no customer traffic, and assign it a label once it exists: a label gives a URL that stays the same when the label is moved to another revision. After approval, you set the weights so that v2 receives 100 percent.
        fr: |
          Par défaut, tout le trafic va vers la dernière révision déployée : vous fixez donc d'abord 100 % du trafic sur ca-shop--v1 par son nom de révision, sinon les clients basculent vers v2 dès qu'elle est prête. Vous déployez ensuite v2, qui ne reçoit aucun trafic client, puis vous lui attribuez une étiquette une fois qu'elle existe : une étiquette fournit une URL qui reste la même quand l'étiquette est déplacée vers une autre révision. Après l'approbation, vous définissez les poids pour que v2 reçoive 100 %.
      options:
        single:
          en: "In single revision mode, v2 replaces v1 as soon as it's ready, before any test."
          fr: "En mode révision unique, v2 remplace v1 dès qu'elle est prête, avant tout test."
        deact:
          en: "Deactivating v1 stops its replicas while customers still need it."
          fr: "Désactiver v1 arrête ses réplicas alors que les clients en ont encore besoin."
        restart:
          en: "Restarting v1 doesn't change which revision receives the traffic."
          fr: "Redémarrer v1 ne change pas la révision qui reçoit le trafic."
    references:
      - title: Blue-Green Deployment in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
      - title: Traffic splitting in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
