chapter: 34-app-service
questions:
  # ------------------------------------------------------------------ 1
  - id: az104-qz-34-01
    objective: "3.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have an App Service plan named **plan-contoso** that hosts two web apps named **app-sales** and **app-hr**.

        Which setting is defined by plan-contoso and therefore applies to both apps?
      fr: |
        Vous disposez d'un plan App Service nommé **plan-contoso** qui héberge deux applications web nommées **app-sales** et **app-hr**.

        Quel paramètre est défini par plan-contoso et s'applique donc aux deux applications ?
    body:
      options:
        - { id: a, text: { en: "The pricing tier", fr: "Le niveau tarifaire" } }
        - { id: b, text: { en: "The runtime stack", fr: "La pile d'exécution" } }
        - { id: c, text: { en: "The app settings", fr: "Les paramètres d'application" } }
        - { id: d, text: { en: "The custom domain names", fr: "Les noms de domaine personnalisés" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An App Service plan defines the operating system, the region, the number and size of the instances and the pricing tier. Every app in the plan runs on the same instances, so the tier and its features apply to app-sales and app-hr alike.
        fr: |
          Un plan App Service définit le système d'exploitation, la région, le nombre et la taille des instances ainsi que le niveau tarifaire. Toutes les applications du plan s'exécutent sur les mêmes instances : le niveau et ses fonctionnalités s'appliquent donc à app-sales comme à app-hr.
      options:
        b:
          en: "The runtime stack (.NET, Node.js, Python...) is chosen for each app when you create it: one plan can host apps that use different stacks on the same operating system."
          fr: "La pile d'exécution (.NET, Node.js, Python...) se choisit pour chaque application à sa création : un plan peut héberger des applications qui utilisent des piles différentes sur le même système d'exploitation."
        c:
          en: "App settings belong to each app (and each slot): they are passed to that app's code as environment variables."
          fr: "Les paramètres d'application appartiennent à chaque application (et à chaque emplacement) : ils sont transmis au code de cette application sous forme de variables d'environnement."
        d:
          en: "Custom domains are added and validated on each app; the plan only decides whether its tier allows them."
          fr: "Les domaines personnalisés s'ajoutent et se valident sur chaque application ; le plan décide seulement si son niveau les autorise."
    references:
      - title: "Azure App Service Plans"
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans

  # ------------------------------------------------------------------ 2
  - id: az104-qz-34-02
    objective: "3.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a web app named **app-fabrikam** that runs on an App Service plan in the Standard S1 tier. The app receives no requests at night, and the first request each morning takes several seconds because the app must load again.

        You need to keep the app loaded even when it receives no traffic.

        Which setting should you turn on?
      fr: |
        Vous disposez d'une application web nommée **app-fabrikam** qui s'exécute sur un plan App Service de niveau Standard S1. L'application ne reçoit aucune requête la nuit, et la première requête de chaque matin prend plusieurs secondes, car l'application doit se recharger.

        Vous devez garder l'application chargée même quand elle ne reçoit aucun trafic.

        Quel paramètre devez-vous activer ?
    body:
      options:
        - { id: a, text: "Always On" }
        - { id: b, text: "Session affinity" }
        - { id: c, text: "Web sockets" }
        - { id: d, text: "HTTP version 2.0" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Always On is off by default, and App Service unloads an app after 20 minutes without requests, so the next request waits for the warm-up. When Always On is on, the front end sends a request to the app root every five minutes and the app stays loaded. Always On is available from the Basic tier, so Standard S1 supports it.
        fr: |
          Always On est désactivé par défaut, et App Service décharge une application après 20 minutes sans requête : la requête suivante attend donc le préchauffage. Quand Always On est activé, le serveur frontal envoie une requête à la racine de l'application toutes les cinq minutes, et l'application reste chargée. Always On est disponible à partir du niveau Basic : Standard S1 le prend en charge.
      options:
        b:
          en: "Session affinity routes a client to the same instance for the whole session; it does not prevent the app from being unloaded."
          fr: "L'affinité de session achemine un client vers la même instance pendant toute la session ; elle n'empêche pas le déchargement de l'application."
        c:
          en: "Web sockets enable persistent connections for frameworks such as SignalR or socket.io; they do not keep an idle app loaded."
          fr: "Les sockets web permettent des connexions persistantes pour des frameworks comme SignalR ou socket.io ; ils ne gardent pas chargée une application inactive."
        d:
          en: "HTTP version 2.0 enables the HTTP/2 protocol; it has no effect on unloading after idle time."
          fr: "La version HTTP 2.0 active le protocole HTTP/2 ; elle n'a aucun effet sur le déchargement après une période d'inactivité."
    references:
      - title: "Configure an App Service App"
        url: https://learn.microsoft.com/en-us/azure/app-service/configure-common

  # ------------------------------------------------------------------ 3
  - id: az104-qz-34-03
    objective: "3.4.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a web app named **app-tailspin** that runs on an App Service plan in the Standard S2 tier. The app has a deployment slot named **staging** that isn't used at the moment. Only the automatic backups are configured.

        A faulty deployment corrupted files of the production app. You need to restore the app to its state of yesterday at 08:00. The solution must minimize the downtime of the production app.

        What should you do?
      fr: |
        Vous disposez d'une application web nommée **app-tailspin** qui s'exécute sur un plan App Service de niveau Standard S2. L'application possède un emplacement de déploiement nommé **staging**, inutilisé pour le moment. Seules les sauvegardes automatiques sont configurées.

        Un déploiement défectueux a endommagé des fichiers de l'application de production. Vous devez restaurer l'application dans son état d'hier à 08:00. La solution doit réduire au minimum l'interruption de l'application de production.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Restore yesterday's 08:00 backup to the staging slot, and then swap staging into production."
            fr: "Restaurer la sauvegarde d'hier à 08:00 vers l'emplacement staging, puis échanger staging avec la production."
        - id: b
          text:
            en: "Restore yesterday's 08:00 backup directly to app-tailspin to overwrite the production content."
            fr: "Restaurer la sauvegarde d'hier à 08:00 directement vers app-tailspin pour écraser le contenu de production."
        - id: c
          text:
            en: "Configure a custom backup to a storage account, and then restore that backup to app-tailspin."
            fr: "Configurer une sauvegarde personnalisée vers un compte de stockage, puis restaurer cette sauvegarde vers app-tailspin."
        - id: d
          text:
            en: "Swap staging into production, and then restore yesterday's 08:00 backup to the staging slot."
            fr: "Échanger staging avec la production, puis restaurer la sauvegarde d'hier à 08:00 vers l'emplacement staging."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Automatic backups run every hour, and the hourly restore points of the last three days are kept, so yesterday's 08:00 backup exists. App Service stops the target app or slot during a restore, so Microsoft recommends restoring to a deployment slot first and then swapping it into production: the swap warms up the restored slot and causes no downtime.
        fr: |
          Les sauvegardes automatiques s'exécutent toutes les heures, et les points de restauration horaires des trois derniers jours sont conservés : la sauvegarde d'hier à 08:00 existe donc. App Service arrête l'application ou l'emplacement cible pendant une restauration ; Microsoft recommande donc de restaurer d'abord vers un emplacement de déploiement, puis de l'échanger avec la production : l'échange préchauffe l'emplacement restauré et ne provoque aucune interruption.
      options:
        b:
          en: "Restoring to the production app stops it for the duration of the restore, which doesn't minimize downtime."
          fr: "Restaurer vers l'application de production l'arrête pendant toute la restauration, ce qui ne réduit pas l'interruption au minimum."
        c:
          en: "A new custom backup would capture the current, corrupted state; the restore point of yesterday 08:00 is an automatic backup."
          fr: "Une nouvelle sauvegarde personnalisée capturerait l'état actuel, endommagé ; le point de restauration d'hier à 08:00 est une sauvegarde automatique."
        d:
          en: "Swapping first puts the unused content of staging into production; the restored version would then sit in staging, not in production."
          fr: "Échanger d'abord place en production le contenu inutilisé de staging ; la version restaurée se retrouverait ensuite dans l'emplacement staging, pas en production."
    references:
      - title: "Back Up an App"
        url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup

  # ------------------------------------------------------------------ 4
  - id: az104-qz-34-04
    objective: "3.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an App Service plan named **plan-adatum** in the Standard S3 tier. An Azure Monitor autoscale setting scales out the plan between 2 and 10 instances based on CPU percentage.

        During sales events, the plan reaches 10 instances and the apps still respond slowly. You need the autoscale setting to be able to scale out the plan to 15 instances. The solution must minimize cost.

        What should you do first?
      fr: |
        Vous disposez d'un plan App Service nommé **plan-adatum** de niveau Standard S3. Un paramètre de mise à l'échelle automatique d'Azure Monitor effectue le scale-out du plan entre 2 et 10 instances selon le pourcentage de processeur.

        Pendant les périodes de soldes, le plan atteint 10 instances et les applications répondent toujours lentement. Vous devez permettre au paramètre de mise à l'échelle automatique d'effectuer le scale-out du plan jusqu'à 15 instances. La solution doit réduire les coûts au minimum.

        Que devez-vous faire en premier ?
    body:
      options:
        - id: a
          text:
            en: "Scale up plan-adatum to the Premium v3 P1v3 tier."
            fr: "Effectuer le scale-up de plan-adatum vers le niveau Premium v3 P1v3."
        - id: b
          text:
            en: "Set the maximum instance limit of the autoscale setting to 15."
            fr: "Définir le nombre maximal d'instances du paramètre de mise à l'échelle automatique sur 15."
        - id: c
          text:
            en: "Scale up plan-adatum to the Isolated v2 I1v2 tier."
            fr: "Effectuer le scale-up de plan-adatum vers le niveau Isolé v2 I1v2."
        - id: d
          text:
            en: "Enable per-app scaling on plan-adatum."
            fr: "Activer la mise à l'échelle par application sur plan-adatum."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A Standard plan can scale out to 10 instances at most, whatever the autoscale setting says. Premium v2, v3 and v4 plans can scale out to 30 instances, so you first scale up to P1v3 and then raise the maximum instance limit of the autoscale setting to 15.
        fr: |
          Un plan Standard ne peut pas dépasser 10 instances, quel que soit le paramètre de mise à l'échelle automatique. Les plans Premium v2, v3 et v4 peuvent monter jusqu'à 30 instances : vous effectuez donc d'abord le scale-up vers P1v3, puis vous portez à 15 le nombre maximal d'instances du paramètre de mise à l'échelle automatique.
      options:
        b:
          en: "The autoscale limits can't exceed the maximum instance count of the tier: 10 for Standard."
          fr: "Les limites de mise à l'échelle automatique ne peuvent pas dépasser le nombre maximal d'instances du niveau : 10 pour Standard."
        c:
          en: "Isolated v2 runs only in an App Service Environment, which means redeploying the apps into an environment that costs much more than a Premium v3 plan."
          fr: "Isolé v2 ne s'exécute que dans un App Service Environment, ce qui impose de redéployer les applications dans un environnement bien plus coûteux qu'un plan Premium v3."
        d:
          en: "Per-app scaling limits each app to a subset of the plan's instances; it doesn't raise the maximum number of instances of the plan."
          fr: "La mise à l'échelle par application limite chaque application à une partie des instances du plan ; elle n'augmente pas le nombre maximal d'instances du plan."
    references:
      - title: "Azure subscription and service limits, quotas, and constraints"
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
      - title: "Azure App Service Plans"
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans

  # ------------------------------------------------------------------ 5
  - id: az104-qz-34-05
    objective: "3.4.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Windows web app named **app-litware** that runs on an App Service plan in the Basic B2 tier. The custom domain **orders.litware.com** is mapped to the app. You have a PFX file that contains a certificate and its private key for orders.litware.com, issued by a public certification authority (CA).

        The app code calls a partner API whose certificate is issued by the partner's private CA.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une application web Windows nommée **app-litware** qui s'exécute sur un plan App Service de niveau Basic B2. Le domaine personnalisé **orders.litware.com** est mappé à l'application. Vous disposez d'un fichier PFX qui contient un certificat et sa clé privée pour orders.litware.com, émis par une autorité de certification (CA) publique.

        Le code de l'application appelle une API partenaire dont le certificat est émis par la CA privée du partenaire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "You can upload the public certificate (.cer) of the partner's CA to app-litware so that the app code can load it when it calls the partner API."
            fr: "Vous pouvez charger le certificat public (.cer) de la CA du partenaire dans app-litware afin que le code de l'application puisse le charger quand il appelle l'API partenaire."
        - id: s2
          text:
            en: "You can secure orders.litware.com by uploading only the .cer file of its certificate and adding an SNI SSL binding."
            fr: "Vous pouvez sécuriser orders.litware.com en chargeant uniquement le fichier .cer de son certificat et en ajoutant une liaison SNI SSL."
        - id: s3
          text:
            en: "After you upload the PFX file and bind it to orders.litware.com, App Service renews the certificate before it expires."
            fr: "Après que vous avez chargé le fichier PFX et l'avez lié à orders.litware.com, App Service renouvelle le certificat avant son expiration."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Public certificates (.cer) aren't used to secure custom domains: you upload them so that the app code can load them to reach remote resources, such as an API whose certificate chains to a private CA. A TLS/SSL binding needs a private certificate that includes the private key (PFX, managed certificate, App Service certificate or Key Vault). An uploaded private certificate isn't renewed by App Service: you upload the renewed certificate and update the binding yourself.
        fr: |
          Les certificats publics (.cer) ne servent pas à sécuriser les domaines personnalisés : vous les chargez pour que le code de l'application puisse les charger afin d'accéder à des ressources distantes, comme une API dont le certificat est émis par une CA privée. Une liaison TLS/SSL demande un certificat privé qui contient la clé privée (PFX, certificat managé, certificat App Service ou Key Vault). App Service ne renouvelle pas un certificat privé chargé : c'est à vous de charger le certificat renouvelé et de mettre à jour la liaison.
      options:
        s2:
          en: "A .cer file contains no private key, so it can't be used in a binding."
          fr: "Un fichier .cer ne contient pas de clé privée : il ne peut donc pas servir à une liaison."
        s3:
          en: "Only the App Service managed certificate and the App Service certificate are renewed automatically."
          fr: "Seuls le certificat managé App Service et le certificat App Service sont renouvelés automatiquement."
    references:
      - title: "Install a TLS/SSL Certificate for Your App"
        url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate

  # ------------------------------------------------------------------ 6
  - id: az104-qz-34-06
    objective: "3.4.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a web app named **app-wingtip** that runs on an App Service plan in the Premium v3 tier. The public DNS zone **wingtiptoys.com** is hosted by a third-party DNS provider and contains no CNAME records.

        Each franchise of the company gets its own subdomain, such as **paris.wingtiptoys.com**, and new franchises open every week. You need to map **\*.wingtiptoys.com** to app-wingtip. The solution must meet the following requirements:

        - Subdomains of new franchises must reach app-wingtip without any change in DNS or in App Service.
        - The mapping must keep working if the inbound IP address of app-wingtip changes.
        - App Service must verify that you own the domain.

        How should you complete the DNS configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une application web nommée **app-wingtip** qui s'exécute sur un plan App Service de niveau Premium v3. La zone DNS publique **wingtiptoys.com** est hébergée par un fournisseur DNS tiers et ne contient aucun enregistrement CNAME.

        Chaque franchise de l'entreprise reçoit son propre sous-domaine, par exemple **paris.wingtiptoys.com**, et de nouvelles franchises ouvrent chaque semaine. Vous devez mapper **\*.wingtiptoys.com** à app-wingtip. La solution doit répondre aux exigences suivantes :

        - Les sous-domaines des nouvelles franchises doivent atteindre app-wingtip sans aucune modification dans le DNS ni dans App Service.
        - Le mappage doit continuer à fonctionner si l'adresse IP entrante d'app-wingtip change.
        - App Service doit vérifier que le domaine vous appartient.

        Comment devez-vous compléter la configuration DNS ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Routing record: a [[type]] record for the host `*` whose value is [[value]].

          Ownership record: a TXT record for the host [[txt]] whose value is the custom domain verification ID of app-wingtip.
        fr: |
          Enregistrement d'acheminement : un enregistrement [[type]] pour l'hôte `*` dont la valeur est [[value]].

          Enregistrement de propriété : un enregistrement TXT pour l'hôte [[txt]] dont la valeur est l'ID de vérification du domaine personnalisé d'app-wingtip.
      slots:
        - id: type
          options:
            - { id: cname, text: CNAME }
            - { id: a, text: A }
            - { id: ns, text: NS }
            - { id: txt, text: TXT }
        - id: value
          options:
            - { id: default, text: "app-wingtip.azurewebsites.net" }
            - { id: inbound, text: { en: "the inbound IP address of app-wingtip", fr: "l'adresse IP entrante d'app-wingtip" } }
            - { id: outbound, text: { en: "the outbound IP addresses of app-wingtip", fr: "les adresses IP sortantes d'app-wingtip" } }
            - { id: scm, text: "app-wingtip.scm.azurewebsites.net" }
        - id: txt
          options:
            - { id: asuid, text: "asuid" }
            - { id: asuidstar, text: "asuid.*" }
            - { id: asuidparis, text: "asuid.paris" }
            - { id: dnsauth, text: "_dnsauth" }
    answer:
      values: { type: cname, value: default, txt: asuid }
    explanation:
      correct:
        en: |
          A wildcard name is mapped with a CNAME record for the host `*` that points to the app's default host name, app-wingtip.azurewebsites.net: every subdomain without its own record resolves to the app, and the mapping follows any change of the app's IP address. For a wildcard, App Service verifies ownership with a TXT record for the host `asuid`, the same host as for the root domain, not one record per subdomain.
        fr: |
          Un nom générique se mappe avec un enregistrement CNAME pour l'hôte `*` qui pointe vers le nom d'hôte par défaut de l'application, app-wingtip.azurewebsites.net : tout sous-domaine sans enregistrement propre est résolu vers l'application, et le mappage suit tout changement de l'adresse IP de l'application. Pour un nom générique, App Service vérifie la propriété avec un enregistrement TXT pour l'hôte `asuid`, le même que pour le domaine racine, et non un enregistrement par sous-domaine.
      options:
        a:
          en: "An A record points to a fixed IP address and must be updated if the inbound IP address of the app changes."
          fr: "Un enregistrement A pointe vers une adresse IP fixe et doit être mis à jour si l'adresse IP entrante de l'application change."
        inbound:
          en: "The inbound IP address is the value of an A record, which the IP change requirement excludes."
          fr: "L'adresse IP entrante est la valeur d'un enregistrement A, exclu par l'exigence sur le changement d'IP."
        outbound:
          en: "Outbound IP addresses are the sources of the app's calls to other services; they don't receive requests."
          fr: "Les adresses IP sortantes sont les sources des appels de l'application vers d'autres services ; elles ne reçoivent pas de requêtes."
        scm:
          en: "The scm host name serves the Kudu site used for deployment and diagnostics, not the app itself."
          fr: "Le nom d'hôte scm sert le site Kudu utilisé pour le déploiement et les diagnostics, pas l'application elle-même."
        asuidparis:
          en: "asuid.paris would verify only paris.wingtiptoys.com and would require a new record for each franchise."
          fr: "asuid.paris ne vérifierait que paris.wingtiptoys.com et imposerait un nouvel enregistrement par franchise."
        dnsauth:
          en: "_dnsauth is the validation record of Azure Front Door custom domains, not of App Service."
          fr: "_dnsauth est l'enregistrement de validation des domaines personnalisés d'Azure Front Door, pas d'App Service."
    references:
      - title: "Migrate an Active Domain"
        url: https://learn.microsoft.com/en-us/azure/app-service/manage-custom-dns-migrate-domain
      - title: "Set Up an Existing Custom Domain Name for Your App"
        url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain

  # ------------------------------------------------------------------ 7
  - id: az104-qz-34-07
    objective: "3.4.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have an App Service plan named **plan-northwind** in the Standard S2 tier. You configure the following autoscale setting for plan-northwind. No other rule is configured.

        | Profile | Type | Instance limits | Rules |
        | --- | --- | --- | --- |
        | Default | Default | Minimum 2, maximum 6, default 2 | Increase the count by 2 when the average CPU percentage is greater than 75 over 10 minutes |
        | Sale | Fixed date: 27 November, 00:00-23:59 | Minimum 8, maximum 10, default 8 | Same rule as the Default profile |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un plan App Service nommé **plan-northwind** de niveau Standard S2. Vous configurez le paramètre de mise à l'échelle automatique suivant pour plan-northwind. Aucune autre règle n'est configurée.

        | Profil | Type | Limites d'instances | Règles |
        | --- | --- | --- | --- |
        | Default | Par défaut | Minimum 2, maximum 6, par défaut 2 | Augmenter le nombre d'instances de 2 quand le pourcentage de processeur moyen dépasse 75 sur 10 minutes |
        | Sale | Date fixe : 27 novembre, 00:00-23:59 | Minimum 8, maximum 10, par défaut 8 | Même règle que le profil Default |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "On 12 November, after a peak that scaled out the plan to six instances, autoscale returns the plan to two instances once the average CPU percentage stays below 30."
            fr: "Le 12 novembre, après un pic qui a porté le plan à six instances, la mise à l'échelle automatique ramène le plan à deux instances dès que le pourcentage de processeur moyen reste inférieur à 30."
        - id: s2
          text:
            en: "On 27 November, the plan runs at least eight instances, even if the average CPU percentage stays below 75."
            fr: "Le 27 novembre, le plan exécute au moins huit instances, même si le pourcentage de processeur moyen reste inférieur à 75."
        - id: s3
          text:
            en: "On 12 November, if the average CPU percentage stays above 75 for one hour, the plan scales out to eight instances."
            fr: "Le 12 novembre, si le pourcentage de processeur moyen reste supérieur à 75 pendant une heure, le plan monte à huit instances."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Profiles are evaluated in order: fixed-date profiles, then recurring profiles, then the default profile, and the first suitable one is used. On 27 November the Sale profile applies, and autoscale always keeps the count between the profile's limits, so at least eight instances run. On other days the Default profile applies: with only a scale-out rule, autoscale acts in one direction until it reaches the maximum, so it never scales in, and the count stops at the maximum of six.
        fr: |
          Les profils sont évalués dans l'ordre : profils à date fixe, puis profils récurrents, puis profil par défaut, et le premier profil applicable est utilisé. Le 27 novembre, le profil Sale s'applique, et la mise à l'échelle automatique maintient toujours le nombre d'instances entre les limites du profil : au moins huit instances s'exécutent donc. Les autres jours, le profil Default s'applique : avec une seule règle de scale-out, la mise à l'échelle automatique n'agit que dans un sens jusqu'au maximum ; elle n'effectue donc jamais de scale-in, et le nombre s'arrête au maximum de six.
      options:
        s1:
          en: "No rule decreases the count, so the plan stays at six instances after the peak. Each scale-out rule needs a matching scale-in rule."
          fr: "Aucune règle ne diminue le nombre d'instances : le plan reste à six instances après le pic. Chaque règle de scale-out a besoin d'une règle de scale-in correspondante."
        s3:
          en: "The Default profile caps the count at six instances, whatever the duration of the load."
          fr: "Le profil Default plafonne le nombre à six instances, quelle que soit la durée de la charge."
    references:
      - title: "Understand autoscale settings in Azure Monitor"
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-understanding-settings
      - title: "Best practices for autoscale"
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-best-practices

  # ------------------------------------------------------------------ 8
  - id: az104-qz-34-08
    objective: "3.4.8"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        You have a web app named **app-proseware** that runs on an App Service plan in the Standard S1 tier. The app has a deployment slot named **staging**. The following table shows the configuration of both slots.

        You deploy a new release to staging, and then you swap the staging slot into production.

        Answer each prompt by selecting the cell that contains the value that applies after the swap.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une application web nommée **app-proseware** qui s'exécute sur un plan App Service de niveau Standard S1. L'application possède un emplacement de déploiement nommé **staging**. Le tableau suivant présente la configuration des deux emplacements.

        Vous déployez une nouvelle version sur staging, puis vous échangez l'emplacement staging avec la production.

        Répondez à chaque consigne en sélectionnant la cellule qui contient la valeur applicable après l'échange.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The value of DB_CONNECTION in the production slot", fr: "La valeur de DB_CONNECTION dans l'emplacement de production" }
        - id: p2
          text: { en: "The value of API_VERSION in the production slot", fr: "La valeur d'API_VERSION dans l'emplacement de production" }
        - id: p3
          text: { en: "The Always On setting of the production slot", fr: "Le paramètre Always On de l'emplacement de production" }
      grid:
        header:
          - { en: "Setting", fr: "Paramètre" }
          - { en: "Deployment slot setting", fr: "Paramètre d'emplacement de déploiement" }
          - { en: "Production slot", fr: "Emplacement de production" }
          - { en: "Staging slot", fr: "Emplacement staging" }
        rows:
          - [ { text: "DB_CONNECTION (connection string)" }, { text: { en: "Selected", fr: "Coché" } }, { text: "sql-prod", area: dbprod }, { text: "sql-test", area: dbstg } ]
          - [ { text: "API_VERSION (app setting)" }, { text: { en: "Not selected", fr: "Non coché" } }, { text: "2025-10", area: apiprod }, { text: "2026-11", area: apistg } ]
          - [ { text: "Always On (general setting)" }, { text: { en: "Not applicable", fr: "Sans objet" } }, { text: "On", area: onprod }, { text: "Off", area: onstg } ]
    answer:
      values: { p1: dbprod, p2: apistg, p3: onprod }
    explanation:
      correct:
        en: |
          A connection string marked as a deployment slot setting stays with its slot, so production keeps sql-prod. An app setting that isn't marked moves with the content, so production now uses the staging value 2026-11, and staging receives 2025-10. Always On is one of the settings that are never swapped, like custom domains, scale settings and managed identities, so production stays On.
        fr: |
          Une chaîne de connexion marquée comme paramètre d'emplacement de déploiement reste avec son emplacement : la production conserve donc sql-prod. Un paramètre d'application non marqué suit le contenu : la production utilise désormais la valeur de staging, 2026-11, et staging reçoit 2025-10. Always On fait partie des paramètres jamais échangés, comme les domaines personnalisés, les paramètres de mise à l'échelle et les identités managées : la production reste donc sur On.
      options:
        dbstg:
          en: "sql-test would reach production only if the connection string weren't marked as a deployment slot setting."
          fr: "sql-test n'arriverait en production que si la chaîne de connexion n'était pas marquée comme paramètre d'emplacement de déploiement."
        apiprod:
          en: "2025-10 is now the value of the staging slot: unmarked app settings follow the content."
          fr: "2025-10 est désormais la valeur de l'emplacement staging : les paramètres d'application non marqués suivent le contenu."
        onstg:
          en: "Always On is slot-specific and isn't swapped, even though it isn't an app setting."
          fr: "Always On est propre à l'emplacement et n'est pas échangé, même s'il ne s'agit pas d'un paramètre d'application."
    references:
      - title: "Set Up Staging Environments"
        url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots

  # ------------------------------------------------------------------ 9
  - id: az104-qz-34-09
    objective: "3.4.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Your company, Fabrikam, has the following resources:

        - A web app named **app-fabrikam** that runs on an App Service plan in the Standard S1 tier in the West Europe region.
        - A virtual network named **VNet-WE** in West Europe. VNet-WE contains a subnet named **snet-vms** that hosts virtual machines, and it has unused address space. VNet-WE has no peering.
        - A virtual network named **VNet-US** in the East US region. VNet-US contains a virtual machine named **SQL1** that runs SQL Server and has only a private IP address.

        You need app-fabrikam to connect to SQL1 on its private IP address by using regional virtual network integration. The solution must minimize cost.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre entreprise, Fabrikam, dispose des ressources suivantes :

        - Une application web nommée **app-fabrikam** qui s'exécute sur un plan App Service de niveau Standard S1 dans la région West Europe.
        - Un réseau virtuel nommé **VNet-WE** dans la région West Europe. VNet-WE contient un sous-réseau nommé **snet-vms** qui héberge des machines virtuelles, et il dispose d'espace d'adressage inutilisé. VNet-WE n'a aucun peering.
        - Un réseau virtuel nommé **VNet-US** dans la région East US. VNet-US contient une machine virtuelle nommée **SQL1** qui exécute SQL Server et n'a qu'une adresse IP privée.

        Vous devez permettre à app-fabrikam de se connecter à SQL1 sur son adresse IP privée à l'aide de l'intégration au réseau virtuel régionale. La solution doit réduire les coûts au minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - id: a
          text:
            en: "Configure virtual network integration for app-fabrikam with a new subnet in VNet-US."
            fr: "Configurer l'intégration au réseau virtuel d'app-fabrikam avec un nouveau sous-réseau de VNet-US."
        - id: b
          text:
            en: "Configure virtual network integration for app-fabrikam with snet-vms in VNet-WE."
            fr: "Configurer l'intégration au réseau virtuel d'app-fabrikam avec snet-vms dans VNet-WE."
        - id: c
          text:
            en: "Configure virtual network integration for app-fabrikam with a new subnet in VNet-WE."
            fr: "Configurer l'intégration au réseau virtuel d'app-fabrikam avec un nouveau sous-réseau de VNet-WE."
        - id: d
          text:
            en: "Create a virtual network peering between VNet-WE and VNet-US."
            fr: "Créer un peering de réseaux virtuels entre VNet-WE et VNet-US."
        - id: e
          text:
            en: "Create a private endpoint for app-fabrikam in VNet-US."
            fr: "Créer un point de terminaison privé pour app-fabrikam dans VNet-US."
        - id: f
          text:
            en: "Scale up the App Service plan to the Premium v3 tier."
            fr: "Effectuer le scale-up du plan App Service vers le niveau Premium v3."
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          Regional virtual network integration requires a virtual network in the same region as the app and a dedicated, unused subnet, which App Service delegates to Microsoft.Web/serverFarms: a new subnet in VNet-WE. Through the integration, the app reaches resources in peered virtual networks, including global peering, with no extra configuration, so a peering between VNet-WE and VNet-US gives access to SQL1. The Standard tier already supports the integration.
        fr: |
          L'intégration au réseau virtuel régionale exige un réseau virtuel dans la même région que l'application et un sous-réseau dédié et inutilisé, qu'App Service délègue à Microsoft.Web/serverFarms : un nouveau sous-réseau de VNet-WE. Grâce à l'intégration, l'application atteint les ressources des réseaux virtuels connectés par peering, y compris par peering mondial, sans configuration supplémentaire : un peering entre VNet-WE et VNet-US donne donc accès à SQL1. Le niveau Standard prend déjà en charge l'intégration.
      options:
        a:
          en: "VNet-US is in East US, and regional integration requires a virtual network in the app's region."
          fr: "VNet-US se trouve dans la région East US, et l'intégration régionale exige un réseau virtuel dans la région de l'application."
        b:
          en: "The integration subnet must be dedicated to the integration; snet-vms already hosts virtual machines."
          fr: "Le sous-réseau d'intégration doit être dédié à l'intégration ; snet-vms héberge déjà des machines virtuelles."
        e:
          en: "A private endpoint gives clients private inbound access to the app; it doesn't let the app make outbound calls to SQL1."
          fr: "Un point de terminaison privé donne aux clients un accès entrant privé à l'application ; il ne permet pas à l'application d'appeler SQL1 en sortie."
        f:
          en: "Virtual network integration is available from the Basic tier, so scaling up only adds cost."
          fr: "L'intégration au réseau virtuel est disponible à partir du niveau Basic : le scale-up ne ferait qu'ajouter des coûts."
    references:
      - title: "Integrate your app with an Azure virtual network"
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration

  # ------------------------------------------------------------------ 10
  - id: az104-qz-34-10
    objective: "3.4.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a web app named **app-woodgrove** that runs on an App Service plan in the Premium v3 tier. The app has a deployment slot named **staging**. The production slot and the staging slot each have a system-assigned managed identity. A key vault named **kv-woodgrove** uses the Azure role-based access control (Azure RBAC) permission model.

        A new release reads a secret from kv-woodgrove by using the system-assigned managed identity of the slot that it runs in. The vault URI is stored in an app setting that isn't marked as a deployment slot setting. You deploy the release to staging, assign the Key Vault Secrets User role on kv-woodgrove to the identity of the staging slot, and the tests succeed.

        After you swap staging into production, every call from production to kv-woodgrove fails with HTTP 403 (Forbidden).

        You need production to read the secret. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Vous disposez d'une application web nommée **app-woodgrove** qui s'exécute sur un plan App Service de niveau Premium v3. L'application possède un emplacement de déploiement nommé **staging**. L'emplacement de production et l'emplacement staging ont chacun une identité managée affectée par le système. Un coffre de clés nommé **kv-woodgrove** utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure (Azure RBAC).

        Une nouvelle version lit un secret dans kv-woodgrove à l'aide de l'identité managée affectée par le système de l'emplacement dans lequel elle s'exécute. L'URI du coffre est stocké dans un paramètre d'application qui n'est pas marqué comme paramètre d'emplacement de déploiement. Vous déployez la version sur staging, attribuez le rôle Key Vault Secrets User sur kv-woodgrove à l'identité de l'emplacement staging, et les tests réussissent.

        Après l'échange de staging avec la production, tous les appels de la production vers kv-woodgrove échouent avec le code HTTP 403 (Forbidden).

        Vous devez permettre à la production de lire le secret. La solution doit respecter le principe du privilège minimum.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Assign the Key Vault Secrets User role on kv-woodgrove to the managed identity of the production slot."
            fr: "Attribuer le rôle Key Vault Secrets User sur kv-woodgrove à l'identité managée de l'emplacement de production."
        - id: b
          text:
            en: "Mark the app setting that contains the vault URI as a deployment slot setting in both slots."
            fr: "Marquer le paramètre d'application qui contient l'URI du coffre comme paramètre d'emplacement de déploiement dans les deux emplacements."
        - id: c
          text:
            en: "Assign the Key Vault Secrets Officer role on kv-woodgrove to the managed identity of the staging slot."
            fr: "Attribuer le rôle Key Vault Secrets Officer sur kv-woodgrove à l'identité managée de l'emplacement staging."
        - id: d
          text:
            en: "Swap the slots again so that the managed identity of the staging slot moves to production."
            fr: "Échanger de nouveau les emplacements afin que l'identité managée de l'emplacement staging passe en production."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Managed identities are among the settings that aren't swapped: after the swap, the new code runs in the production slot and authenticates with the production slot's identity, which has no role on kv-woodgrove. Assigning Key Vault Secrets User, which only reads secret contents, to that identity fixes the error with the least privilege.
        fr: |
          Les identités managées font partie des paramètres qui ne sont pas échangés : après l'échange, le nouveau code s'exécute dans l'emplacement de production et s'authentifie avec l'identité de cet emplacement, qui n'a aucun rôle sur kv-woodgrove. Attribuer à cette identité le rôle Key Vault Secrets User, qui ne permet que de lire le contenu des secrets, corrige l'erreur avec le privilège minimum.
      options:
        b:
          en: "The vault URI is the same in both slots and already reaches production; the failure comes from the identity, not from the setting."
          fr: "L'URI du coffre est identique dans les deux emplacements et arrive déjà en production ; l'échec vient de l'identité, pas du paramètre."
        c:
          en: "The staging identity isn't used by production, and Secrets Officer also grants write and delete permissions on secrets."
          fr: "La production n'utilise pas l'identité de staging, et Secrets Officer accorde en plus l'écriture et la suppression des secrets."
        d:
          en: "Identities stay with their slot, so a second swap only rolls back to the previous release in production."
          fr: "Les identités restent avec leur emplacement : un second échange ne fait que remettre l'ancienne version en production."
    references:
      - title: "Set Up Staging Environments"
        url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
      - title: "Managed Identities"
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity
