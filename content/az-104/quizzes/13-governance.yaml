chapter: 13-governance
questions:
  - id: az104-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A subscription named **Sub1** has an assignment of the built-in **Allowed locations** policy definition with the `deny` effect. West Europe is the only allowed location.

        Admin1 has the Owner role on Sub1. Admin1 tries to create a storage account in East US.

        What is the result?
      fr: |
        Un abonnement nommé **Sub1** a une attribution de la définition de stratégie intégrée **Allowed locations** avec l'effet `deny`. West Europe est le seul emplacement autorisé.

        Admin1 a le rôle Owner sur Sub1. Admin1 tente de créer un compte de stockage dans East US.

        Quel est le résultat ?
    body:
      options:
        - { id: a, text: { en: "The request is denied by the policy assignment.", fr: "La requête est refusée par l'attribution de stratégie." } }
        - { id: b, text: { en: "The storage account is created because the Owner role bypasses Azure Policy.", fr: "Le compte de stockage est créé, car le rôle Owner contourne Azure Policy." } }
        - { id: c, text: { en: "The storage account is created in East US and reported as non-compliant.", fr: "Le compte de stockage est créé dans East US et signalé comme non conforme." } }
        - { id: d, text: { en: "The storage account is created in West Europe instead of East US.", fr: "Le compte de stockage est créé dans West Europe au lieu de East US." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: Azure RBAC decides who may act; Azure Policy decides what the resulting resource may look like, whoever makes the request. Even a user who has every permission is blocked when the create request would produce a non-compliant resource, so the `deny` effect rejects the request.
        fr: "Azure RBAC décide qui peut agir ; Azure Policy décide à quoi peut ressembler la ressource obtenue, quel que soit l'auteur de la requête. Même un utilisateur qui a toutes les autorisations est bloqué lorsque la requête de création produirait une ressource non conforme : l'effet `deny` rejette donc la requête."
      options:
        b: { en: "No Azure role exempts a user from Azure Policy: Owner has full rights in RBAC, but the policy is evaluated on the request anyway.", fr: "Aucun rôle Azure n'exempte un utilisateur d'Azure Policy : Owner a tous les droits dans RBAC, mais la stratégie est quand même évaluée sur la requête." }
        c: { en: "Creating the resource and reporting it as non-compliant is the behavior of the `audit` effect, not of `deny`.", fr: "Créer la ressource et la signaler comme non conforme est le comportement de l'effet `audit`, pas de `deny`." }
        d: { en: "Azure Policy never changes the region of a request; `deny` rejects the request instead of correcting it.", fr: "Azure Policy ne change jamais la région d'une requête ; `deny` rejette la requête au lieu de la corriger." }
    references:
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview

  - id: az104-qz-13-02
    objective: "1.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam creates a subscription named **Sub-Media**. A team will deploy Azure Container Instances in Sub-Media for the first time, so the **Microsoft.ContainerInstance** resource provider must be registered.

        Where should you register the resource provider?
      fr: |
        Fabrikam crée un abonnement nommé **Sub-Media**. Une équipe va déployer Azure Container Instances dans Sub-Media pour la première fois : le fournisseur de ressources **Microsoft.ContainerInstance** doit donc être inscrit.

        Où devez-vous inscrire le fournisseur de ressources ?
    body:
      options:
        - { id: a, text: { en: "In each resource group of Sub-Media that will contain container groups", fr: "Dans chaque groupe de ressources de Sub-Media qui contiendra des groupes de conteneurs" } }
        - { id: b, text: { en: "In the management group that contains Sub-Media", fr: "Dans le groupe d'administration qui contient Sub-Media" } }
        - { id: c, text: { en: "In the Sub-Media subscription", fr: "Dans l'abonnement Sub-Media" } }
        - { id: d, text: { en: "In the Microsoft Entra tenant that Sub-Media trusts", fr: "Dans le locataire Microsoft Entra qu'approuve Sub-Media" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: Resource providers are registered per subscription; registration configures the subscription to work with that provider. It requires the `/register/action` permission of the provider, which Owner and Contributor include, and is done in the portal or with `az provider register` or `Register-AzResourceProvider`.
        fr: "Les fournisseurs de ressources s'inscrivent par abonnement : l'inscription configure l'abonnement pour qu'il fonctionne avec ce fournisseur. Elle demande l'autorisation `/register/action` du fournisseur, incluse dans Owner et Contributor, et se fait dans le portail ou avec `az provider register` ou `Register-AzResourceProvider`."
      options:
        a: { en: "A resource group cannot register a resource provider: once the subscription is registered, every resource group of the subscription can use it.", fr: "Un groupe de ressources ne peut pas inscrire de fournisseur de ressources : une fois l'abonnement inscrit, tous ses groupes de ressources peuvent l'utiliser." }
        b: { en: "Management groups carry policies and role assignments, not resource provider registrations.", fr: "Les groupes d'administration portent des stratégies et des attributions de rôles, pas des inscriptions de fournisseurs de ressources." }
        d: { en: "The tenant holds identities; resource providers are registered for each subscription, not for the directory.", fr: "Le locataire contient les identités ; les fournisseurs de ressources s'inscrivent pour chaque abonnement, pas pour l'annuaire." }
    references:
      - title: Azure resource providers and types
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/resource-providers-and-types

  - id: az104-qz-13-03
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        A storage account named **stcontoso01** in a resource group named **RG-Web** has two tags, `Env=Prod` and `Team=Web`. The finance team asks you to label the account with its cost center. You run the following Azure CLI command.

        `az tag update --resource-id <stcontoso01 ID> --operation Replace --tags CostCenter=4410`

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un compte de stockage nommé **stcontoso01**, situé dans un groupe de ressources nommé **RG-Web**, a deux étiquettes, `Env=Prod` et `Team=Web`. L'équipe financière vous demande d'étiqueter le compte avec son centre de coût. Vous exécutez la commande Azure CLI suivante.

        `az tag update --resource-id <stcontoso01 ID> --operation Replace --tags CostCenter=4410`

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: After the command, stcontoso01 still has the tag `Team=Web`.
            fr: Après la commande, stcontoso01 a toujours l'étiquette `Team=Web`.
        - id: s2
          text:
            en: If you then run the same command with `--operation Merge --tags costcenter=5520`, the value of the existing CostCenter tag changes and no second tag is added.
            fr: Si vous exécutez ensuite la même commande avec `--operation Merge --tags costcenter=5520`, la valeur de l'étiquette CostCenter existante change et aucune deuxième étiquette n'est ajoutée.
        - id: s3
          text:
            en: You can add to stcontoso01 a tag whose name is 200 characters long.
            fr: Vous pouvez ajouter à stcontoso01 une étiquette dont le nom compte 200 caractères.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: "`Replace` overwrites the whole set of tags, so only CostCenter=4410 remains. Tag names are case-insensitive for operations and a tag name holds a single value, so `costcenter=5520` updates the existing CostCenter tag. Tag names are limited to 512 characters, but to 128 characters on storage accounts."
        fr: "`Replace` remplace tout l'ensemble des étiquettes : seule CostCenter=4410 reste. Les noms d'étiquettes ne respectent pas la casse pour les opérations et un nom d'étiquette n'a qu'une valeur : `costcenter=5520` met donc à jour l'étiquette CostCenter existante. Les noms d'étiquettes sont limités à 512 caractères, mais à 128 caractères sur les comptes de stockage."
      options:
        s1: { en: "Keeping the existing tags is the behavior of `Merge`; `Replace` keeps only the tags passed in the command.", fr: "Conserver les étiquettes existantes est le comportement de `Merge` ; `Replace` ne garde que les étiquettes passées dans la commande." }
        s3: { en: "200 characters is within the general 512-character limit, but not within the 128-character limit of storage accounts.", fr: "200 caractères respectent la limite générale de 512 caractères, mais pas la limite de 128 caractères des comptes de stockage." }
    references:
      - title: Tag resources, resource groups, and subscriptions with Azure CLI
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources-cli
      - title: Use tags to organize your Azure resources and management hierarchy
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources

  - id: az104-qz-13-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a virtual machine named **VM-Web1** that runs in West Europe. VM-Web1, its managed disks and its network interface are in a resource group named **RG-Web**, whose location is West Europe.

        To meet a data residency requirement, VM-Web1 must run in the North Europe region. A resource group named **RG-NE**, whose location is North Europe, already exists.

        What should you do?
      fr: |
        Contoso dispose d'une machine virtuelle nommée **VM-Web1** qui s'exécute dans West Europe. VM-Web1, ses disques managés et son interface réseau se trouvent dans un groupe de ressources nommé **RG-Web**, dont l'emplacement est West Europe.

        Pour satisfaire une exigence de résidence des données, VM-Web1 doit s'exécuter dans la région North Europe. Un groupe de ressources nommé **RG-NE**, dont l'emplacement est North Europe, existe déjà.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `az resource move` to move VM-Web1, its disks and its network interface to RG-NE.", fr: "Exécuter `az resource move` pour déplacer VM-Web1, ses disques et son interface réseau vers RG-NE." } }
        - { id: b, text: { en: "Use Azure Resource Mover to move VM-Web1 and its dependent resources to North Europe.", fr: "Utiliser Azure Resource Mover pour déplacer VM-Web1 et ses ressources dépendantes vers North Europe." } }
        - { id: c, text: { en: "Change the location of RG-Web to North Europe, and then restart VM-Web1.", fr: "Modifier l'emplacement de RG-Web en North Europe, puis redémarrer VM-Web1." } }
        - { id: d, text: { en: "Run `Move-AzResource` to move VM-Web1 and its dependent resources to another subscription.", fr: "Exécuter `Move-AzResource` pour déplacer VM-Web1 et ses ressources dépendantes vers un autre abonnement." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: Moving a resource to another resource group or subscription changes only its resource group and resource ID, never its physical region. Changing the region is a different operation, which Azure Resource Mover performs for virtual machines with their disks and network interfaces.
        fr: "Déplacer une ressource vers un autre groupe de ressources ou un autre abonnement ne change que son groupe de ressources et son ID de ressource, jamais sa région physique. Changer de région est une opération différente, qu'Azure Resource Mover réalise pour les machines virtuelles avec leurs disques et leurs interfaces réseau."
      options:
        a: { en: "The location of RG-NE is only where its metadata is stored: after the move, VM-Web1 is in RG-NE but still runs in West Europe.", fr: "L'emplacement de RG-NE n'est que l'endroit où sont stockées ses métadonnées : après le déplacement, VM-Web1 est dans RG-NE mais s'exécute toujours dans West Europe." }
        c: { en: "The location of a resource group cannot be changed, and it would not change the region of the resources it contains anyway.", fr: "L'emplacement d'un groupe de ressources ne peut pas être modifié, et il ne changerait de toute façon pas la région des ressources qu'il contient." }
        d: { en: "A move between subscriptions keeps the region of the resources; VM-Web1 would still run in West Europe.", fr: "Un déplacement entre abonnements conserve la région des ressources ; VM-Web1 s'exécuterait toujours dans West Europe." }
    references:
      - title: Move Azure resources to a new resource group or subscription
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
      - title: What is Azure Resource Mover?
        url: https://learn.microsoft.com/en-us/azure/resource-mover/overview

  - id: az104-qz-13-05
    objective: "1.3.6"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a resource group named **RG-Dev** that contains 12 Windows Server virtual machines. Developers use them from 08:00 to 18:00 on weekdays. Every evening, the developers shut down the virtual machines from within Windows. Fabrikam owns unused Windows Server core licenses with active Software Assurance, enough to cover the 12 virtual machines.

        You need to recommend two changes that lower the compute charges of the virtual machines. The virtual machines must stay available during office hours.

        Which two changes should you recommend? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un groupe de ressources nommé **RG-Dev** qui contient 12 machines virtuelles Windows Server. Les développeurs les utilisent de 8 h à 18 h en semaine. Chaque soir, les développeurs arrêtent les machines virtuelles depuis Windows. Fabrikam possède des licences de cœur Windows Server inutilisées avec Software Assurance active, en nombre suffisant pour les 12 machines virtuelles.

        Vous devez recommander deux modifications qui réduisent les frais de calcul des machines virtuelles. Les machines virtuelles doivent rester disponibles pendant les heures de bureau.

        Quelles sont les deux modifications que vous devez recommander ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a monthly budget on RG-Dev with a Forecasted alert condition at 80 percent.", fr: "Créer un budget mensuel sur RG-Dev avec une condition d'alerte Prévu (Forecasted) à 80 %." } }
        - { id: b, text: { en: "Enable Azure Hybrid Benefit for Windows Server on the virtual machines.", fr: "Activer Azure Hybrid Benefit pour Windows Server sur les machines virtuelles." } }
        - { id: c, text: { en: "Move the virtual machines to a resource group located in a lower-priced region.", fr: "Déplacer les machines virtuelles vers un groupe de ressources situé dans une région moins chère." } }
        - { id: d, text: { en: "Stop the virtual machines from Azure every evening so that they are deallocated.", fr: "Arrêter les machines virtuelles depuis Azure chaque soir pour qu'elles soient libérées." } }
        - { id: e, text: { en: "Add a CostCenter tag to the virtual machines and group their costs in Cost analysis.", fr: "Ajouter une étiquette CostCenter aux machines virtuelles et regrouper leurs coûts dans l'analyse des coûts." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: A virtual machine shut down from within the guest OS stays allocated and is still billed for compute; stopping it from Azure deallocates it, and compute billing stops (disks are still billed). Azure Hybrid Benefit reuses Windows Server licenses with active Software Assurance, so the virtual machines are no longer charged at the pay-as-you-go Windows rate.
        fr: "Une machine virtuelle arrêtée depuis le système d'exploitation invité reste allouée et elle est toujours facturée pour le calcul ; l'arrêter depuis Azure la libère et la facturation du calcul s'arrête (les disques restent facturés). Azure Hybrid Benefit réutilise des licences Windows Server avec Software Assurance active : les machines virtuelles ne sont plus facturées au tarif Windows à l'utilisation."
      options:
        a: { en: "A budget only notifies; it never stops or resizes resources, so the charges stay the same.", fr: "Un budget ne fait que notifier ; il n'arrête ni ne redimensionne jamais de ressources : les frais restent les mêmes." }
        c: { en: "A move to another resource group changes only the resource group; the virtual machines keep running in their region at the same price.", fr: "Un déplacement vers un autre groupe de ressources ne change que le groupe de ressources ; les machines virtuelles restent dans leur région, au même prix." }
        e: { en: "Tags and Cost analysis show where the money goes, but they do not lower any charge.", fr: "Les étiquettes et l'analyse des coûts montrent où va l'argent, mais elles ne réduisent aucun frais." }
    references:
      - title: States and billing status of Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
      - title: Explore Azure Hybrid Benefit for Windows VMs
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/hybrid-use-benefit-licensing

  - id: az104-qz-13-06
    objective: "1.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has the following management group hierarchy: the Tenant root group contains two management groups named **MG-Prod** and **MG-Sandbox**. A security initiative is assigned to the Tenant root group. Production policies are assigned to MG-Prod, and cost-control policies for experiments are assigned to MG-Sandbox.

        Developers create several subscriptions each month. Each new subscription appears under the Tenant root group, and it gets the cost-control policies only after an administrator moves it to MG-Sandbox. Production subscriptions are created by a separate process and are moved to MG-Prod by the platform team.

        You need to ensure that every new subscription gets the cost-control policies as soon as it is created. Production subscriptions must never get the cost-control policies. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Litware dispose de la hiérarchie de groupes d'administration suivante : le Groupe racine du locataire contient deux groupes d'administration nommés **MG-Prod** et **MG-Sandbox**. Une initiative de sécurité est attribuée au Groupe racine du locataire. Des stratégies de production sont attribuées à MG-Prod, et des stratégies de maîtrise des coûts pour les expérimentations sont attribuées à MG-Sandbox.

        Les développeurs créent plusieurs abonnements chaque mois. Chaque nouvel abonnement apparaît sous le Groupe racine du locataire, et il ne reçoit les stratégies de maîtrise des coûts qu'après qu'un administrateur l'a déplacé vers MG-Sandbox. Les abonnements de production sont créés par un processus distinct et déplacés vers MG-Prod par l'équipe plateforme.

        Vous devez faire en sorte que chaque nouvel abonnement reçoive les stratégies de maîtrise des coûts dès sa création. Les abonnements de production ne doivent jamais recevoir les stratégies de maîtrise des coûts. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the cost-control policies to the Tenant root group in addition to MG-Sandbox.", fr: "Attribuer les stratégies de maîtrise des coûts au Groupe racine du locataire en plus de MG-Sandbox." } }
        - { id: b, text: { en: "In the hierarchy settings of the Tenant root group, set MG-Sandbox as the default management group.", fr: "Dans les paramètres de hiérarchie du Groupe racine du locataire, définir MG-Sandbox comme groupe d'administration par défaut." } }
        - { id: c, text: { en: "In the hierarchy settings of the Tenant root group, require write permissions to create management groups.", fr: "Dans les paramètres de hiérarchie du Groupe racine du locataire, exiger des autorisations d'écriture pour créer des groupes d'administration." } }
        - { id: d, text: { en: "Schedule a nightly script that runs `az account management-group subscription add` for each new subscription.", fr: "Planifier un script nocturne qui exécute `az account management-group subscription add` pour chaque nouvel abonnement." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: By default, a new subscription becomes a member of the root management group. The hierarchy settings let you choose another default management group for new subscriptions, so each new subscription lands in MG-Sandbox and inherits its policies from the start. Production subscriptions are then moved to MG-Prod and no longer inherit anything from MG-Sandbox.
        fr: "Par défaut, un nouvel abonnement devient membre du groupe d'administration racine. Les paramètres de hiérarchie permettent de choisir un autre groupe d'administration par défaut pour les nouveaux abonnements : chaque nouvel abonnement arrive dans MG-Sandbox et hérite de ses stratégies dès le départ. Les abonnements de production sont ensuite déplacés vers MG-Prod et n'héritent plus de rien de MG-Sandbox."
      options:
        a: { en: "Every subscription of the tenant, including those in MG-Prod, would inherit an assignment made on the Tenant root group.", fr: "Tous les abonnements du locataire, y compris ceux de MG-Prod, hériteraient d'une attribution faite sur le Groupe racine du locataire." }
        c: { en: "This setting controls who can create management groups; it does not change where new subscriptions are placed.", fr: "Ce paramètre contrôle qui peut créer des groupes d'administration ; il ne change pas l'endroit où sont placés les nouveaux abonnements." }
        d: { en: "A nightly move leaves each new subscription without the policies until the script runs, and the script must be maintained.", fr: "Un déplacement nocturne laisse chaque nouvel abonnement sans les stratégies jusqu'à l'exécution du script, et le script doit être maintenu." }
    references:
      - title: Protect your resource hierarchy
        url: https://learn.microsoft.com/en-us/azure/governance/management-groups/how-to/protect-resource-hierarchy

  - id: az104-qz-13-07
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a subscription named **Sub-Render** that contains a resource group named **RG-Render**. RG-Render contains GPU virtual machines that render videos.

        You create a monthly budget of 10,000 USD at the scope of RG-Render with the following alert conditions:

        - **Actual** at 100 percent: calls an action group that runs a runbook, which deallocates the virtual machines in RG-Render.
        - **Forecasted** at 90 percent: sends an email to the finance team.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un abonnement nommé **Sub-Render** qui contient un groupe de ressources nommé **RG-Render**. RG-Render contient des machines virtuelles GPU qui effectuent le rendu de vidéos.

        Vous créez un budget mensuel de 10 000 USD à l'étendue de RG-Render avec les conditions d'alerte suivantes :

        - **Réel** (Actual) à 100 % : appelle un groupe d'actions qui exécute un runbook, lequel libère les machines virtuelles de RG-Render.
        - **Prévu** (Forecasted) à 90 % : envoie un e-mail à l'équipe financière.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: When the actual cost of RG-Render reaches 10,000 USD, the budget blocks the creation of new resources in RG-Render.
            fr: Lorsque le coût réel de RG-Render atteint 10 000 USD, le budget bloque la création de nouvelles ressources dans RG-Render.
        - id: s2
          text:
            en: The virtual machines can keep running, and accruing compute charges, for several hours after the actual cost of RG-Render exceeds 10,000 USD.
            fr: Les machines virtuelles peuvent continuer de s'exécuter, et d'accumuler des frais de calcul, pendant plusieurs heures après que le coût réel de RG-Render a dépassé 10 000 USD.
        - id: s3
          text:
            en: To be warned when the daily cost of RG-Render alone deviates from its usual pattern, you can create an anomaly alert rule at the scope of RG-Render.
            fr: Pour être averti lorsque le coût quotidien de RG-Render seul s'écarte de son profil habituel, vous pouvez créer une règle d'alerte d'anomalie à l'étendue de RG-Render.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: A budget never affects resources or stops consumption by itself; only the runbook called through the action group deallocates the virtual machines. Cost data is typically available within 8 to 24 hours and budgets are evaluated every 24 hours, so the runbook can start well after the threshold is crossed. Anomaly alert rules can be created only at the subscription scope.
        fr: "Un budget n'affecte jamais les ressources et n'arrête pas la consommation de lui-même ; seul le runbook appelé par le groupe d'actions libère les machines virtuelles. Les données de coût sont généralement disponibles sous 8 à 24 heures et les budgets sont évalués toutes les 24 heures : le runbook peut donc démarrer bien après le franchissement du seuil. Les règles d'alerte d'anomalie ne peuvent être créées qu'à l'étendue de l'abonnement."
      options:
        s1: { en: "Budgets notify and can trigger an action group; blocking creations would require Azure Policy, not a budget.", fr: "Les budgets notifient et peuvent déclencher un groupe d'actions ; bloquer des créations demanderait Azure Policy, pas un budget." }
        s3: { en: "An anomaly alert rule would have to target Sub-Render, which also covers the other resource groups of the subscription.", fr: "Une règle d'alerte d'anomalie devrait cibler Sub-Render, ce qui couvre aussi les autres groupes de ressources de l'abonnement." }
    references:
      - title: Tutorial - Create and manage budgets
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
      - title: Identify anomalies and unexpected changes in cost
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/understand/analyze-unexpected-charges

  - id: az104-qz-13-08
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Proseware has a resource group named **RG-Archive** that has a **Read-only** lock. RG-Archive contains a virtual machine named **VM-Report**, its managed disks and its network interface. VM-Report also has a Read-only lock applied directly to it. Its virtual network is in another resource group named **RG-Network**. You have the Owner role on the subscription.

        You need to move VM-Report, its disks and its network interface to an existing resource group named **RG-Reporting** in the same subscription. When you finish, RG-Archive must be protected by a Read-only lock again, VM-Report must keep its own Read-only lock, and RG-Reporting must remain modifiable.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Proseware dispose d'un groupe de ressources nommé **RG-Archive** qui a un verrou **Lecture seule**. RG-Archive contient une machine virtuelle nommée **VM-Report**, ses disques managés et son interface réseau. VM-Report a aussi un verrou Lecture seule appliqué directement. Son réseau virtuel se trouve dans un autre groupe de ressources nommé **RG-Network**. Vous avez le rôle Owner sur l'abonnement.

        Vous devez déplacer VM-Report, ses disques et son interface réseau vers un groupe de ressources existant nommé **RG-Reporting**, dans le même abonnement. À la fin, RG-Archive doit être de nouveau protégé par un verrou Lecture seule, VM-Report doit conserver son propre verrou Lecture seule, et RG-Reporting doit rester modifiable.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: unlockvm, text: { en: "Remove the Read-only lock from VM-Report.", fr: "Supprimer le verrou Lecture seule de VM-Report." } }
        - { id: unlockrg, text: { en: "Remove the Read-only lock from RG-Archive.", fr: "Supprimer le verrou Lecture seule de RG-Archive." } }
        - { id: lockdest, text: { en: "Apply a Read-only lock to RG-Reporting.", fr: "Appliquer un verrou Lecture seule à RG-Reporting." } }
        - { id: move, text: { en: "Move VM-Report, its disks and its network interface to RG-Reporting.", fr: "Déplacer VM-Report, ses disques et son interface réseau vers RG-Reporting." } }
        - { id: register, text: { en: "Register the Microsoft.Compute resource provider for RG-Reporting.", fr: "Inscrire le fournisseur de ressources Microsoft.Compute pour RG-Reporting." } }
        - { id: relockrg, text: { en: "Apply a Read-only lock to RG-Archive.", fr: "Appliquer un verrou Lecture seule à RG-Archive." } }
    answer:
      sequence: [unlockrg, move, relockrg]
    explanation:
      correct:
        en: A Read-only lock on a resource group prevents moving resources in or out of it, so the lock of RG-Archive must be removed before the move and applied again afterward. A resource that has its own Read-only lock can still be moved to another resource group, so the lock of VM-Report can stay in place.
        fr: "Un verrou Lecture seule sur un groupe de ressources empêche d'y faire entrer ou d'en faire sortir des ressources : le verrou de RG-Archive doit donc être supprimé avant le déplacement, puis appliqué de nouveau ensuite. Une ressource qui a son propre verrou Lecture seule peut quand même être déplacée vers un autre groupe de ressources : le verrou de VM-Report peut rester en place."
      options:
        unlockvm: { en: "Not needed: a resource with a Read-only lock can be moved, and VM-Report must keep its lock.", fr: "Inutile : une ressource qui a un verrou Lecture seule peut être déplacée, et VM-Report doit conserver son verrou." }
        lockdest: { en: "RG-Reporting must remain modifiable; a Read-only lock would block every change in it.", fr: "RG-Reporting doit rester modifiable ; un verrou Lecture seule y bloquerait toute modification." }
        register: { en: "Resource providers are registered per subscription, not per resource group, and Microsoft.Compute is already in use in this subscription.", fr: "Les fournisseurs de ressources s'inscrivent par abonnement, pas par groupe de ressources, et Microsoft.Compute est déjà utilisé dans cet abonnement." }
    references:
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
      - title: Move Azure resources to a new resource group or subscription
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription

  - id: az104-qz-13-09
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank assigns an initiative named **Woodgrove-Baseline** to a management group named **MG-Corp**. The initiative contains 12 policy definitions. One of them, with the reference ID **denyStoragePublic**, denies storage accounts that allow public network access.

        A subscription named **Sub-Trading** in MG-Corp contains a resource group named **RG-MarketData** with three storage accounts. One of them, **stmarket01**, must receive files from a partner over the internet. The storage firewall of stmarket01 accepts only the partner's public IP range, and the security team considers that this configuration achieves the protection that denyStoragePublic is meant to provide.

        You need to meet the following requirements:

        - stmarket01 must no longer be evaluated against denyStoragePublic.
        - stmarket01 must still be evaluated against the 11 other definitions, and the other storage accounts against all 12.
        - stmarket01 must remain visible in the compliance results, with the reason recorded.
        - The assignment of Woodgrove-Baseline must not be modified.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank attribue une initiative nommée **Woodgrove-Baseline** à un groupe d'administration nommé **MG-Corp**. L'initiative contient 12 définitions de stratégie. L'une d'elles, dont l'ID de référence est **denyStoragePublic**, refuse les comptes de stockage qui autorisent l'accès au réseau public.

        Un abonnement nommé **Sub-Trading** de MG-Corp contient un groupe de ressources nommé **RG-MarketData** avec trois comptes de stockage. L'un d'eux, **stmarket01**, doit recevoir des fichiers d'un partenaire par Internet. Le pare-feu de stockage de stmarket01 n'accepte que la plage d'adresses IP publiques du partenaire, et l'équipe de sécurité considère que cette configuration apporte la protection que denyStoragePublic est censée fournir.

        Vous devez satisfaire les exigences suivantes :

        - stmarket01 ne doit plus être évalué par rapport à denyStoragePublic.
        - stmarket01 doit toujours être évalué par rapport aux 11 autres définitions, et les autres comptes de stockage par rapport aux 12.
        - stmarket01 doit rester visible dans les résultats de conformité, avec le motif enregistré.
        - L'attribution de Woodgrove-Baseline ne doit pas être modifiée.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Object to create: [[object]]

          Scope of the object: [[scope]]

          Policies covered: [[covered]]

          Category: [[category]]
        fr: |
          Objet à créer : [[object]]

          Étendue de l'objet : [[scope]]

          Stratégies concernées : [[covered]]

          Catégorie : [[category]]
      slots:
        - id: object
          options:
            - { id: exemption, text: { en: "A policy exemption", fr: "Une exemption de stratégie" } }
            - { id: exclusion, text: { en: "An exclusion (notScopes) in the initiative assignment", fr: "Une exclusion (notScopes) dans l'attribution de l'initiative" } }
            - { id: donotenforce, text: { en: "A second assignment of the initiative with enforcement mode DoNotEnforce", fr: "Une deuxième attribution de l'initiative avec le mode d'application DoNotEnforce" } }
        - id: scope
          options:
            - { id: mg, text: MG-Corp }
            - { id: sub, text: Sub-Trading }
            - { id: rg, text: RG-MarketData }
            - { id: st, text: stmarket01 }
        - id: covered
          options:
            - { id: all, text: { en: "The whole Woodgrove-Baseline initiative", fr: "Toute l'initiative Woodgrove-Baseline" } }
            - { id: one, text: { en: "Only denyStoragePublic (policyDefinitionReferenceId)", fr: "Uniquement denyStoragePublic (policyDefinitionReferenceId)" } }
        - id: category
          options:
            - { id: waiver, text: Waiver }
            - { id: mitigated, text: Mitigated }
    answer:
      values: { object: exemption, scope: st, covered: one, category: mitigated }
    explanation:
      correct:
        en: An exemption is a separate object, so the assignment is not modified, and exempt resources are shown as Exempted in compliance results. Created on stmarket01 itself and limited to the denyStoragePublic reference ID, it leaves the 11 other definitions and the other storage accounts evaluated. The Mitigated category records that the intent of the policy is met by another method.
        fr: "Une exemption est un objet distinct : l'attribution n'est pas modifiée, et les ressources exemptées apparaissent comme exemptées dans les résultats de conformité. Créée sur stmarket01 lui-même et limitée à l'ID de référence denyStoragePublic, elle laisse évaluer les 11 autres définitions et les autres comptes de stockage. La catégorie Mitigated (atténué) indique que l'intention de la stratégie est respectée par une autre méthode."
      options:
        exclusion: { en: "An exclusion modifies the assignment, removes the scope from the compliance count and covers the whole initiative.", fr: "Une exclusion modifie l'attribution, retire l'étendue du décompte de conformité et couvre toute l'initiative." }
        donotenforce: { en: "A second assignment does not cancel the first one: the deny of the existing assignment still applies to stmarket01.", fr: "Une deuxième attribution n'annule pas la première : le refus de l'attribution existante s'applique toujours à stmarket01." }
        rg: { en: "An exemption on RG-MarketData would also exempt the two other storage accounts.", fr: "Une exemption sur RG-MarketData exempterait aussi les deux autres comptes de stockage." }
        all: { en: "Exempting the whole initiative would stop the evaluation of the 11 other definitions for stmarket01.", fr: "Exempter toute l'initiative arrêterait l'évaluation des 11 autres définitions pour stmarket01." }
        waiver: { en: "Waiver means that the non-compliance is temporarily accepted, not that the intent is met another way.", fr: "Waiver (dérogation) signifie que la non-conformité est acceptée temporairement, pas que l'intention est respectée autrement." }
    references:
      - title: Details of the policy exemption structure
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
      - title: Understand scope in Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/scope

  - id: az104-qz-13-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Adatum has a management group named **MG-Corp** that contains two subscriptions, **Sub-A** and **Sub-B**. The following assignments of the built-in **Allowed locations** policy definition exist.

        | Assignment | Scope | Allowed locations | Effect | Enforcement mode | Excluded scopes |
        | --- | --- | --- | --- | --- | --- |
        | PA1 | MG-Corp | West Europe | deny | Enabled | RG-A2 |
        | PA2 | Sub-B | West Europe, North Europe | deny | Enabled | None |
        | PA3 | RG-B2 | North Europe | deny | Disabled | None |

        No other policy assignment exists. The resource groups are shown in the table.

        Answer each prompt by selecting the appropriate resource group in the table.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un groupe d'administration nommé **MG-Corp** qui contient deux abonnements, **Sub-A** et **Sub-B**. Les attributions suivantes de la définition de stratégie intégrée **Allowed locations** existent.

        | Attribution | Étendue | Emplacements autorisés | Effet | Mode d'application | Étendues exclues |
        | --- | --- | --- | --- | --- | --- |
        | PA1 | MG-Corp | West Europe | deny | Activé | RG-A2 |
        | PA2 | Sub-B | West Europe, North Europe | deny | Activé | Aucune |
        | PA3 | RG-B2 | North Europe | deny | Désactivé | Aucune |

        Aucune autre attribution de stratégie n'existe. Les groupes de ressources sont présentés dans le tableau.

        Répondez à chaque consigne en sélectionnant le groupe de ressources approprié dans le tableau.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The resource group in which a user can create a storage account in North Europe", fr: "Le groupe de ressources dans lequel un utilisateur peut créer un compte de stockage dans North Europe" }
        - id: p2
          text: { en: "The resource group in which a storage account created in West Europe is reported as non-compliant", fr: "Le groupe de ressources dans lequel un compte de stockage créé dans West Europe est signalé comme non conforme" }
      grid:
        header: [{ en: "Resource group", fr: "Groupe de ressources" }, { en: "Subscription", fr: "Abonnement" }, { en: "Location of the resource group", fr: "Emplacement du groupe de ressources" }]
        rows:
          - [{ text: RG-A1, area: rga1 }, { text: Sub-A }, { text: North Europe }]
          - [{ text: RG-A2, area: rga2 }, { text: Sub-A }, { text: West Europe }]
          - [{ text: RG-B1, area: rgb1 }, { text: Sub-B }, { text: North Europe }]
          - [{ text: RG-B2, area: rgb2 }, { text: Sub-B }, { text: West Europe }]
    answer:
      values: { p1: rga2, p2: rgb2 }
    explanation:
      correct:
        en: Assignments are cumulative and Azure Policy is an explicit deny system, so PA2 cannot relax PA1 for Sub-B; only an exclusion removes a scope from PA1. RG-A2 is excluded from PA1 and no other assignment covers it, so it is the only resource group where North Europe is allowed. In RG-B2, a West Europe account passes PA1 and PA2, and PA3 (enforcement disabled) lets it be created but reports it as non-compliant. The location of a resource group does not matter for Allowed locations.
        fr: "Les attributions sont cumulatives et Azure Policy est un système de refus explicite : PA2 ne peut pas assouplir PA1 pour Sub-B ; seule une exclusion retire une étendue de PA1. RG-A2 est exclu de PA1 et aucune autre attribution ne le couvre : c'est le seul groupe de ressources où North Europe est autorisé. Dans RG-B2, un compte dans West Europe passe PA1 et PA2, et PA3 (application désactivée) le laisse créer mais le signale comme non conforme. L'emplacement d'un groupe de ressources ne compte pas pour Allowed locations."
      options:
        rga1: { en: "RG-A1 is located in North Europe, but PA1 still denies resources outside West Europe in it.", fr: "RG-A1 est situé dans North Europe, mais PA1 y refuse toujours les ressources hors de West Europe." }
        rgb1: { en: "PA2 allows North Europe, but PA1 also applies to RG-B1 and denies it; a West Europe account there is compliant with both.", fr: "PA2 autorise North Europe, mais PA1 s'applique aussi à RG-B1 et le refuse ; un compte dans West Europe y est conforme aux deux." }
    references:
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
      - title: Details of the policy assignment structure
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
