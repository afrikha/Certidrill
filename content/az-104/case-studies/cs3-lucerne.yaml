id: cs3-lucerne
status: draft
title:
  en: A. Lucerne Publishing
  fr: A. Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        A. Lucerne Publishing is a book publisher based in Boston. It publishes about 600 titles a year and keeps the archives of all its manuscripts and author contracts in Azure.

        A compliance department sets the retention and protection rules for the archives. An IT team of four administrators manages Azure. Freelance translators who work for two partner agencies edit manuscripts in the editorial application.
      fr: |
        A. Lucerne Publishing est un éditeur de livres basé à Boston. Il publie environ 600 titres par an et conserve dans Azure les archives de tous ses manuscrits et contrats d'auteurs.

        Un service conformité définit les règles de rétention et de protection des archives. Une équipe informatique de quatre administrateurs gère Azure. Des traducteurs indépendants qui travaillent pour deux agences partenaires modifient les manuscrits dans l'application éditoriale.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        All the resources are in a subscription named **Sub-Publishing**, in the East US 2 region.

        **Resource groups**

        | Resource group | Tag | Content |
        | --- | --- | --- |
        | RG-Archive | CostCenter = CC-310 | stlucarchive, kv-lucerne-sec |
        | RG-Editorial | CostCenter = CC-420 | VM-CMS1, stluceditorial |

        About 70 percent of the resources have no tags. Some resources already have a **CostCenter** tag that project managers set manually.

        **Resources**

        | Name | Type | Configuration |
        | --- | --- | --- |
        | stlucarchive | Storage account | General-purpose v2, GRS, hierarchical namespace disabled, containers **manuscripts** and **contracts**. Blob versioning, blob soft delete and container soft delete are disabled. Encryption uses Microsoft-managed keys. No managed identity is assigned. |
        | stluceditorial | Storage account | General-purpose v2, LRS, Azure Files share **editorial-share** |
        | kv-lucerne-sec | Key vault | Azure RBAC permission model, soft delete enabled (90 days), purge protection disabled. Contains the RSA 3072 key **contracts-cmk** with a rotation policy that creates a new version every year. |
        | VM-CMS1 | Virtual machine | Windows Server 2022, editorial application, managed disks |

        No backup is configured.

        **Identities**

        The Microsoft Entra tenant is lucernepublishing.com. The external collaboration settings use the default configuration: invitations can be sent to any domain.

        The translators of the partner agencies use email addresses in the litwareinc.com and adatum.com domains. The agencies don't have Microsoft Entra tenants.

        **Deployment**

        Storage accounts are deployed by using a Bicep file named **storage.bicep**.
      fr: |
        Toutes les ressources se trouvent dans un abonnement nommé **Sub-Publishing**, dans la région East US 2.

        **Groupes de ressources**

        | Groupe de ressources | Étiquette | Contenu |
        | --- | --- | --- |
        | RG-Archive | CostCenter = CC-310 | stlucarchive, kv-lucerne-sec |
        | RG-Editorial | CostCenter = CC-420 | VM-CMS1, stluceditorial |

        Environ 70 % des ressources n'ont aucune étiquette. Certaines ressources ont déjà une étiquette **CostCenter** que des chefs de projet ont définie manuellement.

        **Ressources**

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | stlucarchive | Compte de stockage | Usage général v2, GRS, espace de noms hiérarchique désactivé, conteneurs **manuscripts** et **contracts**. Le contrôle de version des objets blob, la suppression réversible des objets blob et la suppression réversible de conteneur sont désactivés. Le chiffrement utilise des clés gérées par Microsoft. Aucune identité managée n'est attribuée. |
        | stluceditorial | Compte de stockage | Usage général v2, LRS, partage Azure Files **editorial-share** |
        | kv-lucerne-sec | Coffre de clés | Modèle d'autorisation Azure RBAC, suppression réversible activée (90 jours), protection contre la purge désactivée. Contient la clé RSA 3072 **contracts-cmk** avec une stratégie de rotation qui crée une nouvelle version chaque année. |
        | VM-CMS1 | Machine virtuelle | Windows Server 2022, application éditoriale, disques managés |

        Aucune sauvegarde n'est configurée.

        **Identités**

        Le locataire Microsoft Entra est lucernepublishing.com. Les paramètres de collaboration externe utilisent la configuration par défaut : des invitations peuvent être envoyées à n'importe quel domaine.

        Les traducteurs des agences partenaires utilisent des adresses e-mail dans les domaines litwareinc.com et adatum.com. Les agences n'ont pas de locataire Microsoft Entra.

        **Déploiement**

        Les comptes de stockage sont déployés à l'aide d'un fichier Bicep nommé **storage.bicep**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Compliance requirements**

        1. Editors must be able to recover any earlier state of a manuscript that was overwritten or deleted by mistake.
        2. The data in stlucarchive must be encrypted by using the **contracts-cmk** key. The storage account must start using each new key version automatically.
        3. VM-CMS1, the **editorial-share** file share, the blobs of the **contracts** container (vaulted backup) and the managed disks of VM-CMS1 (Azure Disk Backup) must be backed up by Azure Backup.

        **Governance requirements**

        4. Every resource must have a **CostCenter** tag that has the value of its resource group's tag. This applies to new and existing resources. A CostCenter value already set on a resource must not be changed.
        5. Only users from litwareinc.com and adatum.com can be invited as guests.

        **Planned changes**

        6. Lucerne will deploy a new storage account named stlucmedia by using storage.bicep. The account must accept only HTTPS traffic, require TLS 1.2 or later, block anonymous read access to blobs and keep a copy of the data in three availability zones of the region.

        **Constraints**

        7. Administrative effort and cost must be minimized.
      fr: |
        **Exigences de conformité**

        1. Les éditeurs doivent pouvoir récupérer n'importe quel état antérieur d'un manuscrit remplacé ou supprimé par erreur.
        2. Les données de stlucarchive doivent être chiffrées avec la clé **contracts-cmk**. Le compte de stockage doit utiliser automatiquement chaque nouvelle version de la clé.
        3. VM-CMS1, le partage de fichiers **editorial-share**, les objets blob du conteneur **contracts** (sauvegarde dans le coffre) et les disques managés de VM-CMS1 (Azure Disk Backup) doivent être sauvegardés par Sauvegarde Azure.

        **Exigences de gouvernance**

        4. Chaque ressource doit avoir une étiquette **CostCenter** dont la valeur est celle de l'étiquette de son groupe de ressources. Cela s'applique aux ressources nouvelles et existantes. Une valeur CostCenter déjà définie sur une ressource ne doit pas être modifiée.
        5. Seuls des utilisateurs de litwareinc.com et adatum.com peuvent être invités en tant qu'invités.

        **Modifications prévues**

        6. Lucerne déploiera un nouveau compte de stockage nommé stlucmedia à l'aide de storage.bicep. Le compte doit accepter uniquement le trafic HTTPS, exiger TLS 1.2 ou version ultérieure, bloquer l'accès en lecture anonyme aux objets blob et conserver une copie des données dans trois zones de disponibilité de la région.

        **Contraintes**

        7. L'effort d'administration et les coûts doivent être réduits au minimum.
