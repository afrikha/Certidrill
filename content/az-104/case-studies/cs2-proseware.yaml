id: cs2-proseware
status: draft
title:
  en: Proseware Inc
  fr: Proseware Inc
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Proseware Inc runs an online education platform for 400,000 students. Its head office is in Montréal.

        The load on the platform is highly seasonal: enrollment peaks from mid-August to the end of September and in January, and exam weeks in December and May generate heavy traffic. The rest of the year, the load is low.

        A team of four administrators manages the Azure environment.
      fr: |
        Proseware Inc exploite une plateforme d'enseignement en ligne pour 400 000 étudiants. Son siège est à Montréal.

        La charge de la plateforme est très saisonnière : les inscriptions culminent de la mi-août à la fin septembre et en janvier, et les semaines d'examens de décembre et de mai génèrent un trafic important. Le reste de l'année, la charge est faible.

        Une équipe de quatre administrateurs gère l'environnement Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity**

        Proseware has a cloud-only Microsoft Entra tenant named proseware.com. All the users have Microsoft Entra ID P1 licenses.

        | Group | Membership type | Members |
        | --- | --- | --- |
        | GRP-Instructors | Assigned | About 1,800 instructors, added and removed manually by the help desk. The **department** attribute of every instructor is set to *Instructors*. About 150 of the instructors are guest users invited from partner universities |
        | GRP-Finance | Assigned | The finance team |

        **Subscription**

        All resources are in a subscription named **Sub-Learning** in the Canada Central region, in the resource groups RG-Web, RG-Media and RG-Ops.

        **App Service**

        | App Service plan | OS and pricing tier | Instances | Apps |
        | --- | --- | --- | --- |
        | ASP-Portal | Windows, Basic B2 | 2 (manual) | app-pw-portal (enrollment portal) |
        | ASP-Learn | Linux, Premium v3 P1v3 | 3 (manual) | app-pw-learn (course platform), with a deployment slot named **staging** |

        The app-pw-learn app has a connection string named **SqlConnection**. The production slot must use the database sql-learn-prod, and the staging slot must use the database sql-learn-test.

        **Storage**

        | Storage account | Configuration |
        | --- | --- |
        | stpwmedia | General-purpose v2, LRS, default access tier Hot. Containers **lectures** (recorded lectures, block blobs) and **thumbnails**. Last access time tracking is disabled |

        **Monitoring**

        A Log Analytics workspace named LAW-Ops and two action groups are in RG-Ops: **AG-Ops** sends an email and an SMS to the on-call administrator, and **AG-Web** sends an email to the web development team and calls the webhook of its ticketing tool. Twelve metric and log search alert rules in Sub-Learning use only AG-Ops; five of them monitor resources in RG-Web.
      fr: |
        **Identité**

        Proseware dispose d'un locataire Microsoft Entra uniquement cloud nommé proseware.com. Tous les utilisateurs disposent de licences Microsoft Entra ID P1.

        | Groupe | Type d'appartenance | Membres |
        | --- | --- | --- |
        | GRP-Instructors | Affecté | Environ 1 800 formateurs, ajoutés et supprimés manuellement par le support technique. L'attribut **department** de chaque formateur a la valeur *Instructors*. Environ 150 formateurs sont des utilisateurs invités provenant d'universités partenaires |
        | GRP-Finance | Affecté | L'équipe financière |

        **Abonnement**

        Toutes les ressources se trouvent dans un abonnement nommé **Sub-Learning** dans la région Canada Central, dans les groupes de ressources RG-Web, RG-Media et RG-Ops.

        **App Service**

        | Plan App Service | Système et niveau tarifaire | Instances | Applications |
        | --- | --- | --- | --- |
        | ASP-Portal | Windows, Basic B2 | 2 (manuel) | app-pw-portal (portail d'inscription) |
        | ASP-Learn | Linux, Premium v3 P1v3 | 3 (manuel) | app-pw-learn (plateforme de cours), avec un emplacement de déploiement nommé **staging** |

        L'application app-pw-learn possède une chaîne de connexion nommée **SqlConnection**. L'emplacement de production doit utiliser la base de données sql-learn-prod, et l'emplacement staging la base de données sql-learn-test.

        **Stockage**

        | Compte de stockage | Configuration |
        | --- | --- |
        | stpwmedia | Usage général v2, LRS, niveau d'accès par défaut chaud (Hot). Conteneurs **lectures** (cours enregistrés, objets blob de blocs) et **thumbnails**. Le suivi de l'heure d'accès est désactivé |

        **Supervision**

        Un espace de travail Log Analytics nommé LAW-Ops et deux groupes d'actions se trouvent dans RG-Ops : **AG-Ops** envoie un e-mail et un SMS à l'administrateur d'astreinte, et **AG-Web** envoie un e-mail à l'équipe de développement web et appelle le webhook de son outil de tickets. Douze règles d'alerte de métrique et de recherche dans les journaux de Sub-Learning utilisent uniquement AG-Ops ; cinq d'entre elles surveillent des ressources de RG-Web.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Business requirements**

        1. The finance team must receive an email as soon as the cost of Sub-Learning for the current month is projected to exceed CAD 25,000, before that amount is actually spent.
        2. Costs must be minimized, especially outside the peak periods.

        **Technical requirements**

        3. app-pw-portal must scale out and in automatically based on CPU usage. During the enrollment periods (August 15 to September 30, and January 1 to January 31), it must run between 6 and 10 instances. The rest of the year, it must run between 2 and 4 instances.
        4. New releases of app-pw-learn must be tested in the staging slot against sql-learn-test, and then moved to production without downtime. The production app must always use sql-learn-prod. The administrators must be able to roll back a release quickly.
        5. Recorded lectures that have not been read for 60 days must move to the Cool tier. They must remain readable immediately, without rehydration. Recorded lectures must be deleted three years (1,095 days) after their last modification.
        6. GRP-Instructors must contain only the member users of proseware.com whose department attribute is *Instructors*. Guest users must never be members of the group. Members must be added and removed automatically.
        7. The web development team must be notified through AG-Web of every alert fired for a resource in RG-Web, including the alerts of rules created later. The existing alert rules must not be modified.
        8. Administrative effort must be minimized.
      fr: |
        **Exigences métier**

        1. L'équipe financière doit recevoir un e-mail dès que le coût de Sub-Learning pour le mois en cours est projeté au-delà de 25 000 CAD, avant que ce montant ne soit réellement dépensé.
        2. Les coûts doivent être réduits au minimum, en particulier en dehors des périodes de pointe.

        **Exigences techniques**

        3. app-pw-portal doit effectuer automatiquement un scale-out et un scale-in en fonction de l'utilisation de l'UC. Pendant les périodes d'inscription (du 15 août au 30 septembre, et du 1er au 31 janvier), il doit s'exécuter sur 6 à 10 instances. Le reste de l'année, il doit s'exécuter sur 2 à 4 instances.
        4. Les nouvelles versions d'app-pw-learn doivent être testées dans l'emplacement staging avec sql-learn-test, puis passer en production sans interruption de service. L'application de production doit toujours utiliser sql-learn-prod. Les administrateurs doivent pouvoir revenir rapidement à la version précédente.
        5. Les cours enregistrés qui n'ont pas été lus depuis 60 jours doivent passer au niveau froid (Cool). Ils doivent rester lisibles immédiatement, sans réhydratation. Les cours enregistrés doivent être supprimés trois ans (1 095 jours) après leur dernière modification.
        6. GRP-Instructors ne doit contenir que les utilisateurs membres de proseware.com dont l'attribut department a la valeur *Instructors*. Les utilisateurs invités ne doivent jamais être membres du groupe. Les membres doivent être ajoutés et retirés automatiquement.
        7. L'équipe de développement web doit être avertie via AG-Web de chaque alerte déclenchée pour une ressource de RG-Web, y compris les alertes des règles créées ultérieurement. Les règles d'alerte existantes ne doivent pas être modifiées.
        8. L'effort d'administration doit être réduit au minimum.
