id: cs-northwind-clinics
status: draft
title:
  en: Northwind Clinics
  fr: Northwind Clinics
tabs:
  - key: overview
    title: { en: Overview, fr: Vue d'ensemble }
    body:
      en: |
        Northwind Clinics operates 40 medical clinics in France. The head office is in Lyon. A team of six administrators manages the IT infrastructure.

        Northwind is moving its document management application to Azure.
      fr: |
        Northwind Clinics exploite 40 cliniques médicales en France. Le siège est à Lyon. Une équipe de six administrateurs gère l'infrastructure informatique.

        Northwind migre son application de gestion documentaire vers Azure.
  - key: existing
    title: { en: Existing environment, fr: Environnement existant }
    body:
      en: |
        Northwind has an Azure subscription named **Sub-Prod** in the France Central region, and a Microsoft Entra tenant synchronized with its on-premises Active Directory.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | VNet-Prod | Virtual network | 10.50.0.0/16 — subnets Web (10.50.1.0/24), App (10.50.2.0/24) |
        | VM-WEB1, VM-WEB2 | Virtual machines | Windows Server 2022, subnet Web, no public IP address |
        | VM-APP1 | Virtual machine | Windows Server 2022, subnet App |
        | stnwscans | Storage account | General-purpose v2, LRS, containers **scans** and **lab-results** |

        Clinics upload scanned documents to the **scans** container.
      fr: |
        Northwind dispose d'un abonnement Azure nommé **Sub-Prod** dans la région France Central, et d'un locataire Microsoft Entra synchronisé avec son Active Directory local.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | VNet-Prod | Réseau virtuel | 10.50.0.0/16 — sous-réseaux Web (10.50.1.0/24), App (10.50.2.0/24) |
        | VM-WEB1, VM-WEB2 | Machines virtuelles | Windows Server 2022, sous-réseau Web, sans adresse IP publique |
        | VM-APP1 | Machine virtuelle | Windows Server 2022, sous-réseau App |
        | stnwscans | Compte de stockage | Usage général v2, LRS, conteneurs **scans** et **lab-results** |

        Les cliniques déposent les documents numérisés dans le conteneur **scans**.
  - key: requirements
    title: { en: Requirements, fr: Exigences }
    body:
      en: |
        Northwind identifies the following requirements:

        1. Scanned documents that have not been modified for 90 days must move to the Archive tier. Documents must be deleted after 10 years (3,650 days).
        2. An external laboratory must be able to upload results to the **lab-results** container for seven days. It must be possible to revoke this access at any time without affecting any other application that uses stnwscans.
        3. HTTPS traffic from the internet must be distributed between VM-WEB1 and VM-WEB2. An unhealthy server must stop receiving traffic.
        4. The administrators must be notified by SMS when the average CPU of VM-APP1 exceeds 90%.
        5. Administrative effort must be minimized.
      fr: |
        Northwind a défini les exigences suivantes :

        1. Les documents numérisés non modifiés depuis 90 jours doivent passer au niveau archive (Archive). Les documents doivent être supprimés au bout de 10 ans (3 650 jours).
        2. Un laboratoire externe doit pouvoir déposer des résultats dans le conteneur **lab-results** pendant sept jours. Cet accès doit pouvoir être révoqué à tout moment sans affecter les autres applications qui utilisent stnwscans.
        3. Le trafic HTTPS venant d'Internet doit être réparti entre VM-WEB1 et VM-WEB2. Un serveur défaillant doit cesser de recevoir du trafic.
        4. Les administrateurs doivent être prévenus par SMS quand l'utilisation moyenne du processeur de VM-APP1 dépasse 90 %.
        5. L'effort d'administration doit être réduit au minimum.
