id: cs3-coho
status: draft
title:
  en: Coho Winery
  fr: Coho Winery
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Coho Winery produces wine in three countries. The head office and the main datacenter are in Bordeaux (France). Coho also operates wineries in Rioja (Spain) and Napa (United States), and will open a winery in Mendoza (Argentina) next year.

        Every site connects to an Azure hub virtual network by using a site-to-site VPN. The ERP application and the vineyard sensor platform run in Azure. A network and operations team of five administrators in Bordeaux manages Azure.
      fr: |
        Coho Winery produit du vin dans trois pays. Le siège et le centre de données principal se trouvent à Bordeaux (France). Coho exploite aussi des domaines viticoles à Rioja (Espagne) et à Napa (États-Unis), et ouvrira un domaine à Mendoza (Argentine) l'année prochaine.

        Chaque site se connecte à un réseau virtuel hub Azure au moyen d'un VPN de site à site. L'application ERP et la plateforme de capteurs des vignobles s'exécutent dans Azure. Une équipe réseau et exploitation de cinq administrateurs basée à Bordeaux gère Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Hub network**

        All the resources below are in a subscription named **Sub-Coho**, in the resource group **RG-Hub** in the France Central region, unless stated otherwise.

        VNet-Hub has the address space 10.60.0.0/16 and the following subnets:

        | Subnet | Prefix | Resources |
        | --- | --- | --- |
        | GatewaySubnet | 10.60.255.0/27 | vgw-hub: route-based VPN gateway, SKU VpnGw2AZ |
        | snet-fw | 10.60.1.0/24 | FW1: network virtual appliance, private IP address 10.60.1.4, IP forwarding enabled |
        | snet-erp | 10.60.2.0/24 | VM-ERP1, VM-ERP2. Network security group nsg-erp. |
        | snet-sensors | 10.60.3.0/24 | VM-IOT1 |

        The route table rt-gateway is associated with GatewaySubnet. It already sends the traffic for 10.60.2.0/24 to FW1. No route table is associated with snet-erp.

        **On-premises sites**

        | Local network gateway | Site | Address prefixes |
        | --- | --- | --- |
        | lng-bordeaux | Bordeaux | 192.168.0.0/20, 10.61.0.0/16 |
        | lng-rioja | Rioja | 192.168.16.0/22 |
        | lng-napa | Napa | 172.16.40.0/22 |

        The Mendoza winery will use the on-premises range 10.62.0.0/16.

        **Application security groups**

        The network interfaces of VM-ERP1 and VM-ERP2 are members of **asg-erp**. The network interface of VM-IOT1 is a member of **asg-sensors**.

        **Other resources**

        | Name | Type | Configuration |
        | --- | --- | --- |
        | stcohoharvest | Storage account | General-purpose v2, container **harvest** |
        | rsv-coho-fr | Recovery Services vault | France Central, backs up VM-ERP1, VM-ERP2 and VM-IOT1 |
        | rsv-coho-us | Recovery Services vault | West US 2 (resource group RG-Napa), backs up the Napa virtual machines |
        | law-coho | Log Analytics workspace | France Central, default 30-day retention |

        The Microsoft Entra group GG-SensorsOps has the Virtual Machine Contributor role assigned at the scope of the VM-IOT1 resource.

        The file server SRV-HARVEST in Bordeaux stores the harvest sensor files in the folder D:\harvest\2026. AzCopy is installed on SRV-HARVEST.
      fr: |
        **Réseau hub**

        Toutes les ressources ci-dessous se trouvent dans un abonnement nommé **Sub-Coho**, dans le groupe de ressources **RG-Hub** de la région France Central, sauf indication contraire.

        VNet-Hub a l'espace d'adressage 10.60.0.0/16 et les sous-réseaux suivants :

        | Sous-réseau | Préfixe | Ressources |
        | --- | --- | --- |
        | GatewaySubnet | 10.60.255.0/27 | vgw-hub : passerelle VPN basée sur les itinéraires, référence SKU VpnGw2AZ |
        | snet-fw | 10.60.1.0/24 | FW1 : appliance virtuelle réseau, adresse IP privée 10.60.1.4, transfert IP activé |
        | snet-erp | 10.60.2.0/24 | VM-ERP1, VM-ERP2. Groupe de sécurité réseau nsg-erp. |
        | snet-sensors | 10.60.3.0/24 | VM-IOT1 |

        La table de routage rt-gateway est associée à GatewaySubnet. Elle envoie déjà le trafic à destination de 10.60.2.0/24 vers FW1. Aucune table de routage n'est associée à snet-erp.

        **Sites locaux**

        | Passerelle de réseau local | Site | Préfixes d'adresse |
        | --- | --- | --- |
        | lng-bordeaux | Bordeaux | 192.168.0.0/20, 10.61.0.0/16 |
        | lng-rioja | Rioja | 192.168.16.0/22 |
        | lng-napa | Napa | 172.16.40.0/22 |

        Le domaine de Mendoza utilisera la plage locale 10.62.0.0/16.

        **Groupes de sécurité d'application**

        Les interfaces réseau de VM-ERP1 et VM-ERP2 sont membres de **asg-erp**. L'interface réseau de VM-IOT1 est membre de **asg-sensors**.

        **Autres ressources**

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | stcohoharvest | Compte de stockage | Usage général v2, conteneur **harvest** |
        | rsv-coho-fr | Coffre Recovery Services | France Central, sauvegarde VM-ERP1, VM-ERP2 et VM-IOT1 |
        | rsv-coho-us | Coffre Recovery Services | West US 2 (groupe de ressources RG-Napa), sauvegarde les machines virtuelles de Napa |
        | law-coho | Espace de travail Log Analytics | France Central, rétention par défaut de 30 jours |

        Le groupe Microsoft Entra GG-SensorsOps dispose du rôle Virtual Machine Contributor attribué à l'étendue de la ressource VM-IOT1.

        Le serveur de fichiers SRV-HARVEST de Bordeaux stocke les fichiers des capteurs de vendange dans le dossier D:\harvest\2026. AzCopy est installé sur SRV-HARVEST.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Network**

        1. A new virtual network named VNet-Analytics will be created in France Central with a /16 address space and peered with VNet-Hub. It will use the VPN gateway of VNet-Hub to reach all the sites. Its address space must not overlap with any existing or planned network.
        2. The traffic from snet-erp to the Rioja winery must be inspected by FW1.
        3. Security rules for the ERP and sensor servers must use application security groups instead of IP addresses.

        **Operations**

        4. VM-IOT1 and its dependent resources will be moved to a new resource group named RG-Sensors, created in the West Europe region in Sub-Coho.
        5. Every night, SRV-HARVEST must upload to the **harvest** container only the files of D:\harvest\2026 that are new or modified. Files deleted from the folder must also be deleted from the container. Access to the storage account uses a SAS token.

        **Monitoring**

        6. The operations team needs one Backup report that covers the backup jobs and storage usage of both Recovery Services vaults for the last 12 months.

        **Constraints**

        7. Administrative effort and cost must be minimized.
      fr: |
        **Réseau**

        1. Un nouveau réseau virtuel nommé VNet-Analytics sera créé dans France Central avec un espace d'adressage /16 et appairé avec VNet-Hub. Il utilisera la passerelle VPN de VNet-Hub pour atteindre tous les sites. Son espace d'adressage ne doit chevaucher aucun réseau existant ou prévu.
        2. Le trafic de snet-erp vers le domaine de Rioja doit être inspecté par FW1.
        3. Les règles de sécurité des serveurs ERP et des capteurs doivent utiliser des groupes de sécurité d'application plutôt que des adresses IP.

        **Exploitation**

        4. VM-IOT1 et ses ressources dépendantes seront déplacées vers un nouveau groupe de ressources nommé RG-Sensors, créé dans la région West Europe dans Sub-Coho.
        5. Chaque nuit, SRV-HARVEST doit charger dans le conteneur **harvest** uniquement les fichiers de D:\harvest\2026 nouveaux ou modifiés. Les fichiers supprimés du dossier doivent aussi être supprimés du conteneur. L'accès au compte de stockage utilise un jeton SAS.

        **Supervision**

        6. L'équipe d'exploitation a besoin d'un seul rapport de sauvegarde qui couvre les travaux de sauvegarde et l'utilisation du stockage des deux coffres Recovery Services sur les 12 derniers mois.

        **Contraintes**

        7. L'effort d'administration et les coûts doivent être réduits au minimum.
