id: cs2-wingtip
status: draft
title:
  en: Wingtip Toys
  fr: Wingtip Toys
tabs:
  - key: overview
    title: { en: Overview, fr: Vue d'ensemble }
    body:
      en: |
        Wingtip Toys is an online toy retailer that sells to customers in North America. Its online store is built from containerized microservices.

        Traffic is ten times higher than usual during the holiday season, from Black Friday to the end of December. A team of three cloud administrators manages the Azure environment; developers publish new container images several times a day.
      fr: |
        Wingtip Toys est un détaillant de jouets en ligne qui vend à des clients en Amérique du Nord. Sa boutique en ligne repose sur des microservices conteneurisés.

        Le trafic est dix fois plus élevé que d'habitude pendant les fêtes, du Black Friday à la fin décembre. Une équipe de trois administrateurs cloud gère l'environnement Azure ; les développeurs publient de nouvelles images conteneur plusieurs fois par jour.
  - key: existing
    title: { en: Existing environment, fr: Environnement existant }
    body:
      en: |
        All resources are in a subscription named **Sub-Shop**, in a resource group named **RG-Shop** in the East US region, unless otherwise noted.

        **Container registry**

        | Name | Configuration |
        | --- | --- |
        | crwingtip | Azure Container Registry, Standard service tier, East US. Role assignment permissions mode: **RBAC Registry Permissions**. The admin user is enabled, and its password is stored in the configuration of the container apps |

        **Container workloads**

        | Name | Type | Configuration |
        | --- | --- | --- |
        | cae-shop | Container Apps environment | Consumption workload profile, integrated with the subnet snet-cae of VNet-Shop |
        | ca-storefront | Container app in cae-shop | External HTTP ingress, minimum 2 and maximum 20 replicas |
        | ca-orders-worker | Container app in cae-shop | No ingress. Processes the messages of the Azure Service Bus queue **orders** in the namespace sb-wingtip. Minimum 1 and maximum 10 replicas, no scale rule. The Service Bus connection string is stored in the app secret **sb-connection** |
        | aci-catalog-import | Container group in Azure Container Instances | Runs every night, imports the supplier catalog for about 40 minutes, then exits with code 0. It exits with a non-zero code when the import fails. Restart policy: **Always** |

        ca-storefront and ca-orders-worker each have a system-assigned managed identity.

        **Network**

        | Virtual network | Address space | Subnets and resources |
        | --- | --- | --- |
        | VNet-Shop | 10.1.0.0/16 | snet-cae (10.1.0.0/23), snet-vm (10.1.4.0/24) with the inventory virtual machines VM-INV1 and VM-INV2 |
        | VNet-Ops | 10.2.0.0/16 | snet-ops (10.2.1.0/24) with the monitoring virtual machine VM-MON1 |

        VNet-Shop and VNet-Ops are peered. Both virtual networks use the Azure-provided DNS. No DNS zone exists yet.

        **Storage**

        | Storage account | Configuration |
        | --- | --- |
        | stwingtipimages | General-purpose v2, LRS, East US. Container **products** with the product images displayed by ca-storefront |
      fr: |
        Toutes les ressources se trouvent dans un abonnement nommé **Sub-Shop**, dans un groupe de ressources nommé **RG-Shop** de la région East US, sauf mention contraire.

        **Registre de conteneurs**

        | Nom | Configuration |
        | --- | --- |
        | crwingtip | Azure Container Registry, niveau de service Standard, East US. Mode d'autorisations des attributions de rôle : **RBAC Registry Permissions**. L'utilisateur administrateur est activé et son mot de passe est enregistré dans la configuration des applications de conteneur |

        **Charges de travail conteneurisées**

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | cae-shop | Environnement Container Apps | Profil de charge de travail Consumption, intégré au sous-réseau snet-cae de VNet-Shop |
        | ca-storefront | Application de conteneur dans cae-shop | Entrée HTTP externe, minimum 2 et maximum 20 réplicas |
        | ca-orders-worker | Application de conteneur dans cae-shop | Aucune entrée. Traite les messages de la file d'attente Azure Service Bus **orders** de l'espace de noms sb-wingtip. Minimum 1 et maximum 10 réplicas, aucune règle de mise à l'échelle. La chaîne de connexion Service Bus est stockée dans le secret d'application **sb-connection** |
        | aci-catalog-import | Groupe de conteneurs dans Azure Container Instances | S'exécute chaque nuit, importe le catalogue des fournisseurs pendant environ 40 minutes, puis se termine avec le code 0. Il se termine avec un code différent de zéro quand l'import échoue. Stratégie de redémarrage : **Always** |

        ca-storefront et ca-orders-worker disposent chacune d'une identité managée affectée par le système.

        **Réseau**

        | Réseau virtuel | Espace d'adressage | Sous-réseaux et ressources |
        | --- | --- | --- |
        | VNet-Shop | 10.1.0.0/16 | snet-cae (10.1.0.0/23), snet-vm (10.1.4.0/24) avec les machines virtuelles d'inventaire VM-INV1 et VM-INV2 |
        | VNet-Ops | 10.2.0.0/16 | snet-ops (10.2.1.0/24) avec la machine virtuelle de supervision VM-MON1 |

        VNet-Shop et VNet-Ops sont appairés. Les deux réseaux virtuels utilisent le DNS fourni par Azure. Aucune zone DNS n'existe encore.

        **Stockage**

        | Compte de stockage | Configuration |
        | --- | --- |
        | stwingtipimages | Usage général v2, LRS, East US. Conteneur **products** avec les images des produits affichées par ca-storefront |
  - key: requirements
    title: { en: Requirements, fr: Exigences }
    body:
      en: |
        **Business requirements**

        1. The store must keep displaying product images if the East US region becomes unavailable, without waiting for a failover.
        2. Costs must be minimized.

        **Technical requirements**

        3. crwingtip must replicate the images to the West US region, and it must be reachable only through private endpoints from VNet-Shop.
        4. The container apps must pull images from crwingtip by using their managed identities instead of the admin user. Follow the principle of least privilege.
        5. ca-orders-worker must incur no usage charges when the orders queue is empty, and it must add replicas as the number of messages in the queue grows.
        6. aci-catalog-import must be restarted automatically only when it fails. It must not be restarted after a successful run.
        7. The virtual machines in VNet-Shop must register their host names automatically in a DNS zone named **shop.wingtip.internal**. VM-MON1 must resolve these names, but the virtual machines of VNet-Ops must not register records in the zone.
        8. stwingtipimages must also survive the failure of an availability zone in East US without data loss.
      fr: |
        **Exigences métier**

        1. La boutique doit continuer à afficher les images des produits si la région East US devient indisponible, sans attendre de basculement.
        2. Les coûts doivent être réduits au minimum.

        **Exigences techniques**

        3. crwingtip doit répliquer les images vers la région West US, et il ne doit être joignable que via des points de terminaison privés depuis VNet-Shop.
        4. Les applications de conteneur doivent extraire les images de crwingtip avec leurs identités managées au lieu de l'utilisateur administrateur. Respectez le principe du privilège minimum.
        5. ca-orders-worker ne doit entraîner aucun frais d'utilisation quand la file d'attente orders est vide, et doit ajouter des réplicas à mesure que le nombre de messages de la file augmente.
        6. aci-catalog-import doit être redémarré automatiquement uniquement en cas d'échec. Il ne doit pas être redémarré après une exécution réussie.
        7. Les machines virtuelles de VNet-Shop doivent inscrire automatiquement leur nom d'hôte dans une zone DNS nommée **shop.wingtip.internal**. VM-MON1 doit résoudre ces noms, mais les machines virtuelles de VNet-Ops ne doivent pas inscrire d'enregistrements dans la zone.
        8. stwingtipimages doit aussi résister à la défaillance d'une zone de disponibilité d'East US sans perte de données.
