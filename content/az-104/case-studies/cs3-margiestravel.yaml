id: cs3-margiestravel
status: draft
title:
  en: Margie's Travel
  fr: Margie's Travel
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Margie's Travel is a travel agency that has its head office in Lisbon and agencies in Lisbon, Paris and Madrid. Customers book trips on the website www.margiestravel.com, and 280 travel agents use the same site to manage bookings.

        The booking application runs on Azure App Service. It doesn't use a relational database: booking data is stored in Azure Table Storage. Margie's Travel is adding a second region so that the site stays available during a regional outage.

        Two administrators manage Azure and Microsoft Entra ID.
      fr: |
        Margie's Travel est une agence de voyages dont le siège est à Lisbonne et qui possède des agences à Lisbonne, Paris et Madrid. Les clients réservent leurs voyages sur le site web www.margiestravel.com, et 280 agents de voyages utilisent le même site pour gérer les réservations.

        L'application de réservation s'exécute sur Azure App Service. Elle n'utilise pas de base de données relationnelle : les données de réservation sont stockées dans Stockage Table Azure. Margie's Travel ajoute une deuxième région pour que le site reste disponible pendant une panne régionale.

        Deux administrateurs gèrent Azure et Microsoft Entra ID.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure resources**

        All the resources are in a subscription named **Sub-Travel**.

        | Name | Type | Resource group | Region | Configuration |
        | --- | --- | --- | --- | --- |
        | asp-booking-we | App Service plan | RG-Web-WE | West Europe | Windows, Basic B2, 2 instances |
        | app-booking-we | Web app | RG-Web-WE | West Europe | Runs in asp-booking-we. No custom domain. No access restrictions. |
        | app-booking-ne | Web app | RG-Web-NE | North Europe | Created last week in its own plan, same code as app-booking-we |
        | law-travel | Log Analytics workspace | RG-Ops | West Europe | Central workspace for all logs |
        | stmtlogswe | Storage account | RG-Ops | West Europe | General-purpose v2, Standard, LRS, used to archive logs |

        **DNS**

        The domain margiestravel.com is registered with a third-party registrar, which also hosts the DNS zone today. The zone contains an MX record for email and an A record for the apex domain that points to the old hosting provider.

        **Identities and licenses**

        | Microsoft Entra group | Type | Members |
        | --- | --- | --- |
        | GG-Agents-All | Security, assigned | The groups GG-Agents-Lisbon, GG-Agents-Paris and GG-Agents-Madrid (no users) |
        | GG-Agents-Lisbon, GG-Agents-Paris, GG-Agents-Madrid | Security, assigned | The travel agents of each agency |

        Margie's Travel purchased 300 Microsoft 365 Business Premium licenses. Business Premium includes Microsoft Entra ID P1. No license is assigned yet. Every user has a usage location.
      fr: |
        **Ressources Azure**

        Toutes les ressources se trouvent dans un abonnement nommé **Sub-Travel**.

        | Nom | Type | Groupe de ressources | Région | Configuration |
        | --- | --- | --- | --- | --- |
        | asp-booking-we | Plan App Service | RG-Web-WE | West Europe | Windows, Basic B2, 2 instances |
        | app-booking-we | Application web | RG-Web-WE | West Europe | S'exécute dans asp-booking-we. Aucun domaine personnalisé. Aucune restriction d'accès. |
        | app-booking-ne | Application web | RG-Web-NE | North Europe | Créée la semaine dernière dans son propre plan, même code qu'app-booking-we |
        | law-travel | Espace de travail Log Analytics | RG-Ops | West Europe | Espace de travail central pour tous les journaux |
        | stmtlogswe | Compte de stockage | RG-Ops | West Europe | Usage général v2, Standard, LRS, utilisé pour archiver les journaux |

        **DNS**

        Le domaine margiestravel.com est enregistré auprès d'un bureau d'enregistrement tiers, qui héberge aussi la zone DNS aujourd'hui. La zone contient un enregistrement MX pour la messagerie et un enregistrement A pour le domaine apex qui pointe vers l'ancien hébergeur.

        **Identités et licences**

        | Groupe Microsoft Entra | Type | Membres |
        | --- | --- | --- |
        | GG-Agents-All | Sécurité, Affecté | Les groupes GG-Agents-Lisbon, GG-Agents-Paris et GG-Agents-Madrid (aucun utilisateur) |
        | GG-Agents-Lisbon, GG-Agents-Paris, GG-Agents-Madrid | Sécurité, Affecté | Les agents de voyages de chaque agence |

        Margie's Travel a acheté 300 licences Microsoft 365 Business Premium. Business Premium inclut Microsoft Entra ID P1. Aucune licence n'est encore attribuée. Chaque utilisateur a un emplacement d'utilisation.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Web application**

        1. app-booking-we must have three deployment slots in addition to the production slot: staging, qa and hotfix.
        2. asp-booking-we must scale out automatically based on CPU usage.
        3. The site must be reachable at www.margiestravel.com and at margiestravel.com (apex). App Service must verify the ownership of each domain.
        4. Both host names must be secured with HTTPS by using free certificates that App Service renews automatically.

        **DNS**

        5. The margiestravel.com zone must be hosted in a public DNS zone in Azure DNS. Name resolution, including email, must not be interrupted during the migration.

        **Identities**

        6. Every travel agent must receive a Microsoft 365 Business Premium license. Agents who join an agency group later must be licensed automatically.

        **Monitoring**

        7. The HTTP logs of app-booking-we and app-booking-ne must be sent to law-travel. The HTTP logs must also be archived in a storage account; stmtlogswe must be reused wherever Azure Monitor supports it.

        **Constraints**

        8. Cost and administrative effort must be minimized.
      fr: |
        **Application web**

        1. app-booking-we doit avoir trois emplacements de déploiement en plus de l'emplacement de production : staging, qa et hotfix.
        2. asp-booking-we doit effectuer un scale-out automatique en fonction de l'utilisation du processeur.
        3. Le site doit être accessible à www.margiestravel.com et à margiestravel.com (apex). App Service doit vérifier la propriété de chaque domaine.
        4. Les deux noms d'hôte doivent être sécurisés en HTTPS à l'aide de certificats gratuits qu'App Service renouvelle automatiquement.

        **DNS**

        5. La zone margiestravel.com doit être hébergée dans une zone DNS publique d'Azure DNS. La résolution de noms, messagerie comprise, ne doit pas être interrompue pendant la migration.

        **Identités**

        6. Chaque agent de voyages doit recevoir une licence Microsoft 365 Business Premium. Les agents qui rejoignent plus tard un groupe d'agence doivent recevoir une licence automatiquement.

        **Supervision**

        7. Les journaux HTTP d'app-booking-we et d'app-booking-ne doivent être envoyés à law-travel. Les journaux HTTP doivent aussi être archivés dans un compte de stockage ; stmtlogswe doit être réutilisé partout où Azure Monitor le permet.

        **Contraintes**

        8. Les coûts et l'effort d'administration doivent être réduits au minimum.
