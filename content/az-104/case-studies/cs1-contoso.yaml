id: cs1-contoso
status: draft
title:
  en: Contoso Ltd
  fr: Contoso Ltd
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Contoso Ltd is a retail chain that operates 220 stores in North America. The head office is in Seattle. An IT team of eight administrators manages the Azure environment, and a finance team controls the cloud budget.

        Contoso sells online through an e-commerce website hosted in Azure. The head office network connects to Azure through a site-to-site VPN. The point-of-sale systems of the stores run in Azure and send their data to the head office systems.
      fr: |
        Contoso Ltd est une chaîne de distribution qui exploite 220 magasins en Amérique du Nord. Le siège est à Seattle. Une équipe informatique de huit administrateurs gère l'environnement Azure, et une équipe financière contrôle le budget cloud.

        Contoso vend en ligne via un site d'e-commerce hébergé dans Azure. Le réseau du siège se connecte à Azure par un VPN site à site. Les systèmes de point de vente des magasins s'exécutent dans Azure et envoient leurs données aux systèmes du siège.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Contoso has a Microsoft Entra tenant named contoso.com. All users have a Microsoft Entra ID P1 license. The **department** and **jobTitle** attributes of every user are maintained by the HR application.

        **Subscriptions and resource groups**

        | Subscription | Resource group | Region | Contents |
        | --- | --- | --- | --- |
        | Sub-Retail-Prod | RG-Hub | East US | VNet-Hub, VPN gateway VPNGW1 |
        | Sub-Retail-Prod | RG-Stores | East US | VNet-Stores, VM-WEB1, VM-WEB2 |
        | Sub-Retail-Prod | RG-Data | East US | VM-POSDB1, stcontosoreceipts, RSV-Contoso |
        | Sub-Retail-Dev | RG-Dev | East US 2 | Test virtual machines |

        **Virtual networks**

        | Name | Address space | Subnets | Notes |
        | --- | --- | --- | --- |
        | VNet-Hub | 10.10.0.0/16 | GatewaySubnet (10.10.0.0/27), Shared (10.10.1.0/24) | VPNGW1 connects the head office network |
        | VNet-Stores | 10.20.0.0/16 | Web (10.20.1.0/24), Data (10.20.2.0/24) | Peered with VNet-Hub, default peering settings |

        **Virtual machines and storage**

        | Name | Type | Configuration |
        | --- | --- | --- |
        | VM-WEB1, VM-WEB2 | Virtual machines | Ubuntu 22.04, subnet Web, availability set AS-Web, e-commerce front end |
        | VM-POSDB1 | Virtual machine | Windows Server 2022 with SQL Server, subnet Data, protected in the Recovery Services vault RSV-Contoso by the Standard policy DefaultPolicy (one backup per day at 23:00) |
        | stcontosoreceipts | Storage account | General-purpose v2, LRS, container **receipts** |

        **Microsoft Entra groups**

        | Group | Type | Membership |
        | --- | --- | --- |
        | SG-StoreManagers | Security | Assigned; HR adds and removes the 220 store managers manually |
        | SG-Finance | Security | Assigned; 6 members of the finance team |
      fr: |
        Contoso dispose d'un locataire Microsoft Entra nommé contoso.com. Tous les utilisateurs disposent d'une licence Microsoft Entra ID P1. Les attributs **department** et **jobTitle** de chaque utilisateur sont tenus à jour par l'application RH.

        **Abonnements et groupes de ressources**

        | Abonnement | Groupe de ressources | Région | Contenu |
        | --- | --- | --- | --- |
        | Sub-Retail-Prod | RG-Hub | East US | VNet-Hub, passerelle VPN VPNGW1 |
        | Sub-Retail-Prod | RG-Stores | East US | VNet-Stores, VM-WEB1, VM-WEB2 |
        | Sub-Retail-Prod | RG-Data | East US | VM-POSDB1, stcontosoreceipts, RSV-Contoso |
        | Sub-Retail-Dev | RG-Dev | East US 2 | Machines virtuelles de test |

        **Réseaux virtuels**

        | Nom | Espace d'adressage | Sous-réseaux | Remarques |
        | --- | --- | --- | --- |
        | VNet-Hub | 10.10.0.0/16 | GatewaySubnet (10.10.0.0/27), Shared (10.10.1.0/24) | VPNGW1 relie le réseau du siège |
        | VNet-Stores | 10.20.0.0/16 | Web (10.20.1.0/24), Data (10.20.2.0/24) | Peering avec VNet-Hub, paramètres de peering par défaut |

        **Machines virtuelles et stockage**

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | VM-WEB1, VM-WEB2 | Machines virtuelles | Ubuntu 22.04, sous-réseau Web, groupe à haute disponibilité AS-Web, front-end d'e-commerce |
        | VM-POSDB1 | Machine virtuelle | Windows Server 2022 avec SQL Server, sous-réseau Data, protégée dans le coffre Recovery Services RSV-Contoso par la stratégie Standard DefaultPolicy (une sauvegarde par jour à 23 h 00) |
        | stcontosoreceipts | Compte de stockage | Usage général v2, LRS, conteneur **receipts** |

        **Groupes Microsoft Entra**

        | Groupe | Type | Appartenance |
        | --- | --- | --- |
        | SG-StoreManagers | Sécurité | Affecté ; les RH ajoutent et retirent manuellement les 220 responsables de magasin |
        | SG-Finance | Sécurité | Affecté ; 6 membres de l'équipe financière |
  - key: planned
    title: { en: "Planned changes", fr: "Modifications prévues" }
    body:
      en: |
        Contoso plans the following changes:

        - Replace VM-WEB1 and VM-WEB2 with a Virtual Machine Scale Set named **VMSS-Web** in the Web subnet of VNet-Stores.
        - Grant store managers access to a new store portal through a Microsoft Entra group.
        - Connect the store systems in VNet-Stores to the head office network.
      fr: |
        Contoso prévoit les modifications suivantes :

        - Remplacer VM-WEB1 et VM-WEB2 par un groupe de machines virtuelles identiques nommé **VMSS-Web** dans le sous-réseau Web de VNet-Stores.
        - Donner aux responsables de magasin l'accès à un nouveau portail des magasins par l'intermédiaire d'un groupe Microsoft Entra.
        - Relier les systèmes des magasins situés dans VNet-Stores au réseau du siège.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Business requirements**

        1. The monthly Azure budget of Sub-Retail-Prod is USD 40,000. The members of SG-Finance must receive an email as soon as Azure projects that the spending of the month will exceed USD 36,000, before that amount is actually reached.
        2. Every user whose job title is **Store Manager** must automatically become a member of the group that grants access to the store portal. A user whose job title changes must automatically lose that membership.
        3. Receipts stored in stcontosoreceipts must remain available for reads and writes in East US if an availability zone fails. Auditors must be able to read the receipts from the secondary region at any time, without waiting for a failover.

        **Technical requirements**

        4. VMSS-Web must scale automatically between 2 and 10 instances based on the average CPU usage, and the web tier must remain available if one availability zone of East US fails.
        5. Store systems in VNet-Stores must reach the head office network through VPNGW1. No VPN gateway may be deployed in VNet-Stores.
        6. Backups of VM-POSDB1 in RSV-Contoso must create a recovery point at least every four hours.
        7. Administrative effort and cost must be minimized.
      fr: |
        **Exigences métier**

        1. Le budget Azure mensuel de Sub-Retail-Prod est de 40 000 USD. Les membres de SG-Finance doivent recevoir un e-mail dès qu'Azure prévoit que les dépenses du mois dépasseront 36 000 USD, avant que ce montant soit réellement atteint.
        2. Chaque utilisateur dont le poste est **Store Manager** doit devenir automatiquement membre du groupe qui donne accès au portail des magasins. Un utilisateur dont le poste change doit perdre automatiquement cette appartenance.
        3. Les tickets de caisse stockés dans stcontosoreceipts doivent rester disponibles en lecture et en écriture dans East US en cas de défaillance d'une zone de disponibilité. Les auditeurs doivent pouvoir lire les tickets depuis la région secondaire à tout moment, sans attendre un basculement.

        **Exigences techniques**

        4. VMSS-Web doit se mettre à l'échelle automatiquement entre 2 et 10 instances selon l'utilisation moyenne de l'UC, et le niveau web doit rester disponible en cas de défaillance d'une zone de disponibilité d'East US.
        5. Les systèmes des magasins situés dans VNet-Stores doivent joindre le réseau du siège via VPNGW1. Aucune passerelle VPN ne peut être déployée dans VNet-Stores.
        6. Les sauvegardes de VM-POSDB1 dans RSV-Contoso doivent créer un point de récupération au moins toutes les quatre heures.
        7. L'effort d'administration et les coûts doivent être réduits au minimum.
