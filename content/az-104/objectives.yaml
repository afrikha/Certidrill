# AZ-104 objectives — official study guide, skills measured as of 2023-10-26.
# `code` is the stable key referenced by question files (objective: "2.3.5").
# Service names, commands and acronyms stay in English in the French titles.
identities:
  - group: { en: Manage Microsoft Entra users and groups, fr: Gérer les utilisateurs et groupes Microsoft Entra }
    objectives:
      - { code: "1.1.1", en: Create users and groups, fr: "Créer des utilisateurs et des groupes" }
      - { code: "1.1.2", en: Manage user and group properties, fr: "Gérer les propriétés des utilisateurs et des groupes" }
      - { code: "1.1.3", en: Manage licenses in Microsoft Entra ID, fr: "Gérer les licences dans Microsoft Entra ID" }
      - { code: "1.1.4", en: Manage external users, fr: "Gérer les utilisateurs externes" }
      - { code: "1.1.5", en: Configure self-service password reset (SSPR), fr: "Configurer la réinitialisation de mot de passe en libre-service (SSPR)" }
  - group: { en: Manage access to Azure resources, fr: Gérer l'accès aux ressources Azure }
    objectives:
      - { code: "1.2.1", en: Manage built-in Azure roles, fr: "Gérer les rôles Azure intégrés" }
      - { code: "1.2.2", en: Assign roles at different scopes, fr: "Attribuer des rôles à différentes étendues" }
      - { code: "1.2.3", en: Interpret access assignments, fr: "Interpréter les attributions d'accès" }
  - group: { en: Manage Azure subscriptions and governance, fr: Gérer les abonnements Azure et la gouvernance }
    objectives:
      - { code: "1.3.1", en: Implement and manage Azure Policy, fr: "Implémenter et gérer Azure Policy" }
      - { code: "1.3.2", en: Configure resource locks, fr: "Configurer des verrous sur les ressources" }
      - { code: "1.3.3", en: Apply and manage tags on resources, fr: "Appliquer et gérer des étiquettes sur les ressources" }
      - { code: "1.3.4", en: Manage resource groups, fr: "Gérer les groupes de ressources" }
      - { code: "1.3.5", en: Manage subscriptions, fr: "Gérer les abonnements" }
      - { code: "1.3.6", en: "Manage costs by using alerts, budgets, and Azure Advisor recommendations", fr: "Gérer les coûts en utilisant des alertes, des budgets et les recommandations d'Azure Advisor" }
      - { code: "1.3.7", en: Configure management groups, fr: "Configurer des groupes d'administration" }

storage:
  - group: { en: Configure access to storage, fr: Configurer l'accès au stockage }
    objectives:
      - { code: "2.1.1", en: Configure Azure Storage firewalls and virtual networks, fr: "Configurer des pare-feux et des réseaux virtuels dans Stockage Azure" }
      - { code: "2.1.2", en: Create and use shared access signature (SAS) tokens, fr: "Créer et utiliser des jetons de signature d'accès partagé (SAS)" }
      - { code: "2.1.3", en: Configure stored access policies, fr: "Configurer des stratégies d'accès stockées" }
      - { code: "2.1.4", en: Manage access keys, fr: "Gérer les clés d'accès" }
      - { code: "2.1.5", en: Configure identity-based access for Azure Files, fr: "Configurer l'accès basé sur l'identité pour Azure Files" }
  - group: { en: Configure and manage storage accounts, fr: Configurer et gérer les comptes de stockage }
    objectives:
      - { code: "2.2.1", en: Create and configure storage accounts, fr: "Créer et configurer des comptes de stockage" }
      - { code: "2.2.2", en: Configure Azure Storage redundancy, fr: "Configurer la redondance du Stockage Azure" }
      - { code: "2.2.3", en: Configure object replication, fr: "Configurer la réplication d'objets" }
      - { code: "2.2.4", en: Configure storage account encryption, fr: "Configurer le chiffrement du compte de stockage" }
      - { code: "2.2.5", en: Manage data by using Azure Storage Explorer and AzCopy, fr: "Gérer les données avec Explorateur Stockage Azure et AzCopy" }
  - group: { en: Configure Azure Files and Azure Blob Storage, fr: Configurer Azure Files et Azure Blob Storage }
    objectives:
      - { code: "2.3.1", en: Create and configure a file share in Azure Storage, fr: "Créer et configurer un partage de fichiers dans stockage Azure" }
      - { code: "2.3.2", en: Create and configure a container in Blob Storage, fr: "Créer et configurer un conteneur dans Stockage Blob" }
      - { code: "2.3.3", en: Configure storage tiers, fr: "Configurer les niveaux de stockage" }
      - { code: "2.3.4", en: Configure snapshots and soft delete for Azure Files, fr: "Configurer des instantanés et la suppression réversible pour Azure Files" }
      - { code: "2.3.5", en: Configure blob lifecycle management, fr: "Configurer la gestion de cycle de vie des objets blob" }
      - { code: "2.3.6", en: Configure blob versioning, fr: "Configurer le versioning des objets blob" }

compute:
  - group: { en: Automate deployment of resources by using ARM templates or Bicep files, fr: Automatiser le déploiement de ressources avec des modèles ARM ou des fichiers Bicep }
    objectives:
      - { code: "3.1.1", en: Interpret an Azure Resource Manager template or a Bicep file, fr: "Interpréter un modèle Azure Resource Manager ou un fichier Bicep" }
      - { code: "3.1.2", en: Modify an existing Azure Resource Manager template, fr: "Modifier un modèle Azure Resource Manager existant" }
      - { code: "3.1.3", en: Modify an existing Bicep file, fr: "Modifier un fichier Bicep existant" }
      - { code: "3.1.4", en: Deploy resources by using an Azure Resource Manager template or a Bicep file, fr: "Déployer des ressources en utilisant un modèle Azure Resource Manager ou un fichier Bicep" }
      - { code: "3.1.5", en: Export a deployment as an ARM template or convert an ARM template to a Bicep file, fr: "Exporter un déploiement en tant que modèle Azure Resource Manager ou convertir un modèle Azure Resource Manager en fichier Bicep" }
  - group: { en: Create and configure virtual machines, fr: Créer et configurer des machines virtuelles }
    objectives:
      - { code: "3.2.1", en: Create a virtual machine, fr: "Créer une machine virtuelle" }
      - { code: "3.2.2", en: Configure Azure Disk Encryption, fr: "Configurer Azure Disk Encryption" }
      - { code: "3.2.3", en: "Move a virtual machine to another resource group, subscription, or region", fr: "Déplacer une machine virtuelle vers un autre groupe de ressources, un autre abonnement ou une autre région" }
      - { code: "3.2.4", en: Manage virtual machine sizes, fr: "Gérer les tailles des machines virtuelles" }
      - { code: "3.2.5", en: Manage virtual machine disks, fr: "Gérer des disques de machines virtuelles" }
      - { code: "3.2.6", en: Deploy virtual machines to availability zones and availability sets, fr: "Déployer des machines virtuelles dans des zones de disponibilité et des groupes à haute disponibilité" }
      - { code: "3.2.7", en: Deploy and configure Azure Virtual Machine Scale Sets, fr: "Déployer et configurer une instance Groupes de machines virtuelles identiques Azure" }
  - group: { en: Provision and manage containers in the Azure portal, fr: Provisionner et gérer des conteneurs dans le portail Azure }
    objectives:
      - { code: "3.3.1", en: Create and manage an Azure container registry, fr: "Créer et gérer un registre de conteneurs Azure" }
      - { code: "3.3.2", en: Provision a container by using Azure Container Instances, fr: "Provisionner un conteneur en utilisant Azure Container Instances" }
      - { code: "3.3.3", en: Provision a container by using Azure Container Apps, fr: "Provisionner un conteneur en utilisant Azure Container Apps" }
      - { code: "3.3.4", en: "Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps", fr: "Gérer le dimensionnement et la mise à l'échelle de conteneurs, y compris Azure Container Instances et Azure Container Apps" }
  - group: { en: Create and configure Azure App Service, fr: Créer et configurer Azure App Service }
    objectives:
      - { code: "3.4.1", en: Provision an App Service plan, fr: "Provisionner un plan App Service" }
      - { code: "3.4.2", en: Configure scaling for an App Service plan, fr: "Configurer la mise à l'échelle pour un plan App Service" }
      - { code: "3.4.3", en: Create an App Service, fr: "Créer un App Service" }
      - { code: "3.4.4", en: Configure certificates and Transport Layer Security (TLS) for an App Service, fr: "Configurer des certificats et le protocole TLS (Transport Layer Security) pour une instance App Service" }
      - { code: "3.4.5", en: Map an existing custom DNS name to an App Service, fr: "Mapper un nom DNS personnalisé existant à une instance App Service" }
      - { code: "3.4.6", en: Configure backup for an App Service, fr: "Configurer la sauvegarde pour une instance App Service" }
      - { code: "3.4.7", en: Configure networking settings for an App Service, fr: "Configurer les paramètres réseau pour une instance App Service" }
      - { code: "3.4.8", en: Configure deployment slots for an App Service, fr: "Configurer des emplacements de déploiement pour une instance App Service" }

networking:
  - group: { en: Configure and manage virtual networks in Azure, fr: Configurer et gérer les réseaux virtuels Azure }
    objectives:
      - { code: "4.1.1", en: Create and configure virtual networks and subnets, fr: "Créer et configurer des réseaux et sous-réseaux virtuels" }
      - { code: "4.1.2", en: Create and configure virtual network peering, fr: "Créer et configurer le peering de réseau virtuel" }
      - { code: "4.1.3", en: Configure public IP addresses, fr: "Configurer des adresses IP publiques" }
      - { code: "4.1.4", en: Configure user-defined network routes, fr: "Configurer des routes réseau définies par l'utilisateur" }
      - { code: "4.1.5", en: Troubleshoot network connectivity, fr: "Résoudre les problèmes de connectivité réseau" }
  - group: { en: Configure secure access to virtual networks, fr: Configurer l'accès sécurisé aux réseaux virtuels }
    objectives:
      - { code: "4.2.1", en: Create and configure network security groups (NSGs) and application security groups, fr: "Créer et configurer des groupes de sécurité réseau (NSG) et des groupes de sécurité d'application" }
      - { code: "4.2.2", en: Evaluate effective security rules in NSGs, fr: "Évaluer les règles de sécurité effectives dans des groupes de sécurité réseau" }
      - { code: "4.2.3", en: Implement Azure Bastion, fr: "Mettre en œuvre Azure Bastion" }
      - { code: "4.2.4", en: Configure service endpoints for Azure platform as a service (PaaS), fr: "Configurer des points de terminaison de service pour Azure PaaS (plateforme en tant que service)" }
      - { code: "4.2.5", en: Configure private endpoints for Azure PaaS, fr: "Configurer des points de terminaison privés pour Azure PaaS" }
  - group: { en: Configure name resolution and load balancing, fr: Configurer la résolution de noms et l'équilibrage de charge }
    objectives:
      - { code: "4.3.1", en: Configure Azure DNS, fr: "Configurer Azure DNS" }
      - { code: "4.3.2", en: Configure an internal or public load balancer, fr: "Configurer un équilibreur de charge interne ou public" }
      - { code: "4.3.3", en: Troubleshoot load balancing, fr: "Résoudre les problèmes d'équilibrage de charge" }

monitoring:
  - group: { en: Monitor resources in Azure, fr: Surveiller les ressources Azure }
    objectives:
      - { code: "5.1.1", en: Interpret metrics in Azure Monitor, fr: "Interpréter les métriques dans Azure Monitor" }
      - { code: "5.1.2", en: Configure log settings in Azure Monitor, fr: "Configurer les paramètres de journal dans Azure Monitor" }
      - { code: "5.1.3", en: Query and analyze logs in Azure Monitor, fr: "Interroger et analyser les journaux dans Azure Monitor" }
      - { code: "5.1.4", en: "Set up alert rules, action groups, and alert processing rules in Azure Monitor", fr: "Configurer des règles d'alerte, des groupes d'actions et des règles de traitement des alertes dans Azure Monitor" }
      - { code: "5.1.5", en: "Configure and interpret monitoring of virtual machines, storage accounts, and networks by using Azure Monitor Insights", fr: "Configurer et interpréter la supervision des machines virtuelles, des comptes de stockage et des réseaux en utilisant Azure Monitor Insights" }
      - { code: "5.1.6", en: Use Azure Network Watcher and Connection Monitor, fr: "Utiliser Azure Network Watcher et le Moniteur de connexion" }
  - group: { en: Implement backup and recovery, fr: Implémenter la sauvegarde et la récupération }
    objectives:
      - { code: "5.2.1", en: Create a Recovery Services vault, fr: "Créer un coffre Recovery Services" }
      - { code: "5.2.2", en: Create an Azure Backup vault, fr: "Créer un coffre Sauvegarde Azure" }
      - { code: "5.2.3", en: Create and configure a backup policy, fr: "Créer et configurer une stratégie de sauvegarde" }
      - { code: "5.2.4", en: Perform backup and restore operations by using Azure Backup, fr: "Effectuer des opérations de sauvegarde et de restauration avec Sauvegarde Azure" }
      - { code: "5.2.5", en: Configure Azure Site Recovery for Azure resources, fr: "Configurer Azure Site Recovery pour les ressources Azure" }
      - { code: "5.2.6", en: Perform a failover to a secondary region by using Site Recovery, fr: "Effectuer un basculement vers une région secondaire en utilisant Site Recovery" }
      - { code: "5.2.7", en: Configure and interpret reports and alerts for backups, fr: "Configurer et interpréter les rapports et les alertes pour les sauvegardes" }
