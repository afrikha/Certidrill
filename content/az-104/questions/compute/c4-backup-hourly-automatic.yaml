id: c4-backup-hourly-automatic
objective: "3.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-wingtip** that runs on an App Service plan in the Basic B2 tier. The app doesn't use a database.

    You need to be able to restore the app's files and configuration to any hour of the last three days. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-wingtip** qui s'exécute sur un plan App Service de niveau Basic B2. L'application n'utilise pas de base de données.

    Vous devez pouvoir restaurer les fichiers et la configuration de l'application à n'importe quelle heure des trois derniers jours. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Nothing, because automatic backups already meet the requirement.
        fr: Rien, car les sauvegardes automatiques répondent déjà à l'exigence.
    - id: b
      text:
        en: Configure a custom backup schedule that runs every hour.
        fr: Configurer une planification de sauvegarde personnalisée qui s'exécute toutes les heures.
    - id: c
      text:
        en: Create a Recovery Services vault and a backup policy for app-wingtip.
        fr: Créer un coffre Recovery Services et une stratégie de sauvegarde pour app-wingtip.
    - id: d
      text:
        en: Scale up the plan to the Standard tier, and then configure custom backups.
        fr: Effectuer un scale-up du plan vers le niveau Standard, puis configurer des sauvegardes personnalisées.
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the Basic, Standard, Premium and Isolated tiers, App Service creates automatic backups every hour without any configuration. Hourly backups are kept for the first three days (then thinned out up to 30 days), so you can restore to any hour of the last three days.
    fr: |
      Dans les niveaux Basic, Standard, Premium et Isolated, App Service crée des sauvegardes automatiques toutes les heures, sans aucune configuration. Les sauvegardes horaires sont conservées pendant les trois premiers jours (puis espacées jusqu'à 30 jours) : vous pouvez donc restaurer l'application à n'importe quelle heure des trois derniers jours.
  options:
    b:
      en: |
        Custom backups can run at most every 2 hours and require a storage account to configure.
      fr: |
        Les sauvegardes personnalisées peuvent s'exécuter au mieux toutes les 2 heures et nécessitent la configuration d'un compte de stockage.
    c:
      en: |
        App Service apps aren't protected by Azure Backup vaults; they use the built-in App Service backup feature.
      fr: |
        Les applications App Service ne sont pas protégées par les coffres Sauvegarde Azure ; elles utilisent la fonctionnalité de sauvegarde intégrée d'App Service.
    d:
      en: |
        Backups are already supported in the Basic tier, and custom backups can't run hourly.
      fr: |
        Les sauvegardes sont déjà prises en charge au niveau Basic, et les sauvegardes personnalisées ne peuvent pas s'exécuter toutes les heures.
references:
  - title: Back up an app in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup
