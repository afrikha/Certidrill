id: c2-enc-options-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank reviews the encryption of the managed disks attached to its Azure virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Woodgrove Bank examine le chiffrement des disques managés attachés à ses machines virtuelles Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: Server-side encryption is automatically enabled for all managed disks and cannot be disabled.
        fr: Le chiffrement côté serveur est activé automatiquement pour tous les disques managés et ne peut pas être désactivé.
    - id: s2
      text:
        en: Server-side encryption with platform-managed keys also encrypts the temp disk of the VM.
        fr: Le chiffrement côté serveur avec des clés gérées par la plateforme chiffre aussi le disque temporaire de la machine virtuelle.
    - id: s3
      text:
        en: You can enable encryption at host on a VM after you disable Azure Disk Encryption on it.
        fr: Vous pouvez activer le chiffrement sur l'hôte sur une machine virtuelle après y avoir désactivé Azure Disk Encryption.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Azure Disk Storage server-side encryption is always enabled and encrypts OS and data disks as they are persisted, but it does not encrypt temp disks or disk caches. Encryption at host can't be enabled on a VM or scale set that currently has, or ever had, Azure Disk Encryption enabled.
    fr: Le chiffrement côté serveur de Stockage sur disque Azure est toujours activé et chiffre les disques du système d'exploitation et de données lors de leur écriture, mais il ne chiffre ni les disques temporaires ni les caches de disque. Le chiffrement sur l'hôte ne peut pas être activé sur une machine virtuelle ou un groupe de machines virtuelles identiques sur lequel Azure Disk Encryption est ou a déjà été activé.
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
  - title: Enable end-to-end encryption using encryption at host - Azure portal
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-host-based-encryption-portal
