id: c2-enc-match-requirements
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has four encryption requirements for the disks of its Azure virtual machines.

    Which encryption option meets each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.
  fr: |
    Contoso a quatre exigences de chiffrement pour les disques de ses machines virtuelles Azure.

    Quelle option de chiffrement répond à chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: cmk, text: { en: Server-side encryption with a disk encryption set, fr: Chiffrement côté serveur avec un jeu de chiffrement de disque } }
    - { id: host, text: { en: Encryption at host, fr: Chiffrement sur l'hôte } }
    - { id: ade, text: Azure Disk Encryption }
    - { id: conf, text: { en: Confidential disk encryption, fr: Chiffrement de disque confidentiel } }
    - { id: tls, text: { en: Minimum TLS version 1.2, fr: Version TLS minimale 1.2 } }
  targets:
    - id: t1
      text: { en: "Encrypt data at rest on managed disks with keys that the company manages in Azure Key Vault, without changing the VM configuration", fr: "Chiffrer les données au repos des disques managés avec des clés gérées par l'entreprise dans Azure Key Vault, sans modifier la configuration de la machine virtuelle" }
    - id: t2
      text: { en: "Encrypt temp disks and disk caches, with encryption performed by the host instead of the guest OS", fr: "Chiffrer les disques temporaires et les caches de disque, le chiffrement étant effectué par l'hôte et non par le système d'exploitation invité" }
    - id: t3
      text: { en: "Encrypt volumes inside the guest OS by using BitLocker or DM-Crypt", fr: "Chiffrer les volumes dans le système d'exploitation invité avec BitLocker ou DM-Crypt" }
    - id: t4
      text: { en: "Bind the OS disk encryption keys to the virtual TPM of the VM", fr: "Lier les clés de chiffrement du disque du système d'exploitation au module TPM virtuel de la machine virtuelle" }
answer:
  mapping: { t1: cmk, t2: host, t3: ade, t4: conf }
explanation:
  correct:
    en: A disk encryption set lets server-side encryption use customer-managed keys from Key Vault. Encryption at host encrypts temp disks and caches on the VM host. Azure Disk Encryption runs BitLocker (Windows) or DM-Crypt (Linux) inside the guest. Confidential disk encryption binds the keys to the VM's TPM so that only the VM can access the protected disk.
    fr: Un jeu de chiffrement de disque permet au chiffrement côté serveur d'utiliser des clés gérées par le client stockées dans Key Vault. Le chiffrement sur l'hôte chiffre les disques temporaires et les caches sur l'hôte de la machine virtuelle. Azure Disk Encryption exécute BitLocker (Windows) ou DM-Crypt (Linux) dans l'invité. Le chiffrement de disque confidentiel lie les clés au module TPM de la machine virtuelle, de sorte que seule celle-ci peut accéder au disque protégé.
  options:
    tls: { en: The minimum TLS version protects connections to a storage account; it does not encrypt VM disks., fr: La version TLS minimale protège les connexions à un compte de stockage ; elle ne chiffre pas les disques de machines virtuelles. }
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
