id: cs1-tailspin-01
objective: "3.3.4"
type: single
caseStudy: cs1-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the scaling requirement for lobby-api. The solution must minimize cost.

    What should you configure?
  fr: |
    Vous devez satisfaire l'exigence de mise à l'échelle pour lobby-api. La solution doit réduire les coûts au minimum.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Set the minimum replicas to 0, and add an HTTP scale rule based on the number of concurrent requests", fr: "Définir le nombre minimal de réplicas sur 0, et ajouter une règle de mise à l'échelle HTTP fondée sur le nombre de requêtes simultanées" } }
    - { id: b, text: { en: "Set the minimum replicas to 0, and add a CPU scale rule with a utilization threshold of 70%", fr: "Définir le nombre minimal de réplicas sur 0, et ajouter une règle de mise à l'échelle UC avec un seuil d'utilisation de 70 %" } }
    - { id: c, text: { en: "Keep the minimum replicas at 3, set the maximum replicas to 10, and add an HTTP scale rule", fr: "Conserver le nombre minimal de réplicas à 3, définir le nombre maximal sur 10, et ajouter une règle de mise à l'échelle HTTP" } }
    - { id: d, text: { en: "Redeploy lobby-api to Azure Container Instances with the restart policy set to Never", fr: "Redéployer lobby-api dans Azure Container Instances avec la stratégie de redémarrage définie sur Never" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Container Apps can scale a revision to zero replicas when the minimum replica count is 0. An HTTP scale rule adds replicas based on the number of concurrent HTTP requests and starts replicas again when requests arrive, so lobby-api costs nothing while idle.
    fr: |
      Azure Container Apps peut réduire une révision à zéro réplica quand le nombre minimal de réplicas est 0. Une règle de mise à l'échelle HTTP ajoute des réplicas selon le nombre de requêtes HTTP simultanées et redémarre des réplicas quand des requêtes arrivent ; lobby-api ne coûte donc rien lorsqu'elle est inactive.
  options:
    b: { en: "CPU and memory scale rules cannot scale an app to zero, and they do not react to the number of HTTP requests.", fr: "Les règles de mise à l'échelle UC et mémoire ne peuvent pas réduire une application à zéro, et elles ne réagissent pas au nombre de requêtes HTTP." }
    c: { en: "A minimum of three replicas keeps lobby-api running when no player is connected.", fr: "Un minimum de trois réplicas maintient lobby-api en exécution quand aucun joueur n'est connecté." }
    d: { en: "Azure Container Instances does not scale a container group automatically based on HTTP requests.", fr: "Azure Container Instances ne met pas à l'échelle automatiquement un groupe de conteneurs selon les requêtes HTTP." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
