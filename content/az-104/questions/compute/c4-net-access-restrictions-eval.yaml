id: c4-net-access-restrictions-eval
objective: "3.4.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A web app named **app-contoso** has the main site access restriction rules shown in the following table. No private endpoint is configured.

    Answer each prompt by selecting the rule that determines what happens to the request.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application web nommée **app-contoso** possède les règles de restriction d'accès du site principal présentées dans le tableau suivant. Aucun point de terminaison privé n'est configuré.

    Répondez à chaque consigne en sélectionnant la règle qui détermine le sort de la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A request from the public IP address 203.0.113.70", fr: "Une requête depuis l'adresse IP publique 203.0.113.70" }
    - id: p2
      text: { en: "A request from the public IP address 198.51.100.20, which isn't an Azure Front Door address", fr: "Une requête depuis l'adresse IP publique 198.51.100.20, qui n'est pas une adresse Azure Front Door" }
  grid:
    header: [ { en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, { en: Source, fr: Source }, Action ]
    rows:
      - [ { text: "100" }, { text: Allow-Offices, area: r100 }, { text: 203.0.113.0/24 }, { text: Allow } ]
      - [ { text: "200" }, { text: Deny-Contractors, area: r200 }, { text: 203.0.113.64/26 }, { text: Deny } ]
      - [ { text: "300" }, { text: Allow-FrontDoor, area: r300 }, { text: { en: "Service tag AzureFrontDoor.Backend", fr: "Étiquette de service AzureFrontDoor.Backend" } }, { text: Allow } ]
      - [ { text: "-" }, { text: { en: "Unmatched rule action", fr: "Action de la règle sans correspondance" }, area: unmatched }, { text: Any }, { text: Deny } ]
answer:
  values: { p1: r100, p2: unmatched }
explanation:
  correct:
    en: |
      Access restriction rules are evaluated in priority order, lowest number first, and the first matching rule applies. 203.0.113.70 is in 203.0.113.0/24, so Allow-Offices (100) allows it before Deny-Contractors (200) is evaluated, even though that rule is more specific. 198.51.100.20 matches no rule, so the unmatched rule action denies it with HTTP 403.
    fr: |
      Les règles de restriction d'accès sont évaluées par ordre de priorité, du plus petit numéro au plus grand, et la première règle correspondante s'applique. 203.0.113.70 appartient à 203.0.113.0/24 : Allow-Offices (100) l'autorise donc avant l'évaluation de Deny-Contractors (200), même si cette règle est plus spécifique. 198.51.100.20 ne correspond à aucune règle : l'action de la règle sans correspondance la refuse avec un code HTTP 403.
references:
  - title: "Set Up Access Restrictions"
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions
