id: cs3-relecloud-04
objective: "3.2.5"
type: dragdrop
caseStudy: cs3-relecloud
difficulty: 3
status: draft
stem:
  en: |
    You need to select the managed disk type for each disk to meet the live ingest and disk requirements.

    Which disk type should you use for each disk? To answer, drag the appropriate disk types to the correct disks. Each disk type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir le type de disque managé de chaque disque pour satisfaire les exigences d'ingestion en direct et de disques.

    Quel type de disque devez-vous utiliser pour chaque disque ? Pour répondre, faites glisser les types de disques appropriés vers les disques correspondants. Chaque type de disque peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ultra, text: { en: "Ultra Disk", fr: "Disque Ultra" } }
    - { id: pv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
    - { id: premium, text: { en: "Premium SSD", fr: "SSD Premium" } }
    - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
    - { id: stdhdd, text: { en: "Standard HDD", fr: "HDD Standard" } }
  targets:
    - { id: ingest, text: { en: "Ingest buffer data disk of VM-ING1", fr: "Disque de données de la mémoire tampon d'ingestion de VM-ING1" } }
    - { id: trnos, text: { en: "OS disks of VM-TRN1 and VM-TRN2", fr: "Disques du système d'exploitation de VM-TRN1 et VM-TRN2" } }
    - { id: devos, text: { en: "OS disk of VM-DEV1", fr: "Disque du système d'exploitation de VM-DEV1" } }
    - { id: logs, text: { en: "logs data disks of VM-TRN1 and VM-TRN2", fr: "Disques de données logs de VM-TRN1 et VM-TRN2" } }
answer:
  mapping: { ingest: ultra, trnos: premium, devos: stdssd, logs: stdhdd }
explanation:
  correct:
    en: "Only Ultra Disk offers submillisecond latency with up to 400,000 IOPS per disk and performance changes without detaching the disk. Ultra Disk and Premium SSD v2 can't be OS disks, so the high-performance SSD for the transcoding OS disks is Premium SSD. Standard SSD is the least expensive SSD type and suits a lightly used test server. Standard HDD is the cheapest type and suits data that is rarely accessed, such as the logs disks."
    fr: "Seul le disque Ultra offre une latence inférieure à la milliseconde avec jusqu'à 400 000 IOPS par disque et des changements de performances sans détacher le disque. Les disques Ultra et SSD Premium v2 ne peuvent pas être des disques du système d'exploitation : le SSD hautes performances des disques du système d'exploitation de transcodage est donc le SSD Premium. Le SSD Standard est le type SSD le moins cher et convient à un serveur de test peu utilisé. Le HDD Standard est le type le moins cher et convient aux données rarement consultées, comme les disques logs."
  options:
    pv2: { en: "Premium SSD v2 is limited to 80,000 IOPS per disk, below the 200,000 IOPS required, and can't be an OS disk.", fr: "Le SSD Premium v2 est limité à 80 000 IOPS par disque, en dessous des 200 000 IOPS exigées, et ne peut pas être un disque du système d'exploitation." }
references:
  - title: "Select a disk type for Azure IaaS VMs - managed disks"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
