id: c3-acr-georeplica-behavior
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Premium Azure container registry named **cradatum** that was created in the West Europe region. You run the following command:

    ```bash
    az acr replication create --registry cradatum --location eastus
    ```

    Workloads in both regions pull images by using `cradatum.azurecr.io/<image>:<tag>`.

    Which two statements are true? Each correct answer presents a complete solution.
  fr: |
    Adatum dispose d'un registre de conteneurs Azure Premium nommé **cradatum**, créé dans la région West Europe. Vous exécutez la commande suivante :

    ```bash
    az acr replication create --registry cradatum --location eastus
    ```

    Les charges de travail des deux régions récupèrent les images avec `cradatum.azurecr.io/<image>:<tag>`.

    Quelles sont les deux affirmations vraies ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - id: a
      text: { en: An image pushed once to cradatum is automatically synchronized to the East US replica., fr: Une image envoyée une seule fois vers cradatum est automatiquement synchronisée vers le réplica East US. }
    - id: b
      text: { en: Storage is billed for each replica, so a 1-GiB image is charged as 2 GiB of storage., fr: "Le stockage est facturé pour chaque réplica : une image de 1 Gio est facturée comme 2 Gio de stockage." }
    - id: c
      text: { en: You must create separate role assignments on the East US replica for identities that pull images there., fr: Vous devez créer des attributions de rôle distinctes sur le réplica East US pour les identités qui y récupèrent des images. }
    - id: d
      text: { en: Workloads in East US must use the login server cradatum-eastus.azurecr.io to reach the nearest replica., fr: Les charges de travail d'East US doivent utiliser le serveur de connexion cradatum-eastus.azurecr.io pour atteindre le réplica le plus proche. }
    - id: e
      text: { en: If West Europe becomes unavailable, ACR tasks of cradatum keep running from East US., fr: "Si West Europe devient indisponible, les tâches ACR de cradatum continuent de s'exécuter depuis East US." }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: A geo-replicated registry is managed as a single registry with one global endpoint; content pushed once is replicated to every geo-replica (eventual consistency), and requests are routed to the replica with the best network profile, usually the closest. Storage is billed per geo-replica, so each replica adds the full storage size to the bill.
    fr: "Un registre géorépliqué est géré comme un seul registre avec un point de terminaison global ; le contenu envoyé une fois est répliqué vers chaque géoréplica (cohérence éventuelle), et les requêtes sont acheminées vers le réplica au meilleur profil réseau, généralement le plus proche. Le stockage est facturé par géoréplica : chaque réplica ajoute la taille totale du stockage à la facture."
  options:
    c: { en: Credentials, role assignments and network rules are shared by all geo-replicas of the registry., fr: "Les informations d'identification, les attributions de rôle et les règles réseau sont communes à tous les géoréplicas du registre." }
    d: { en: All regions use the same global endpoint cradatum.azurecr.io; Azure routes requests to the nearest replica., fr: Toutes les régions utilisent le même point de terminaison global cradatum.azurecr.io ; Azure achemine les requêtes vers le réplica le plus proche. }
    e: { en: ACR tasks are bound to the home region and do not run while the home region is unavailable., fr: Les tâches ACR sont liées à la région d'origine et ne s'exécutent pas tant que celle-ci est indisponible. }
references:
  - title: Geo-replication in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication
