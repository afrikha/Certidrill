id: c1-arm-param-constraints
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are modifying the `parameters` section of an existing ARM template that deploys a virtual machine.

    The template must meet the following requirements:

    - The value of **adminPassword** must not be logged or displayed in the deployment history.
    - **vmSize** can only be set to Standard_D2s_v5 or Standard_D4s_v5.
    - If no value is provided for **vmSize**, Standard_D2s_v5 is used.

    How should you complete the template? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez la section `parameters` d'un modèle ARM existant qui déploie une machine virtuelle.

    Le modèle doit répondre aux exigences suivantes :

    - la valeur de **adminPassword** ne doit pas être journalisée ni affichée dans l'historique de déploiement ;
    - **vmSize** ne peut être défini que sur Standard_D2s_v5 ou Standard_D4s_v5 ;
    - si aucune valeur n'est fournie pour **vmSize**, Standard_D2s_v5 est utilisé.

    Comment devez-vous compléter le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "parameters": {
      "adminPassword": {
        "type": "[[pwType]]"
      },
      "vmSize": {
        "type": "string",
        "[[constraint]]": [
          "Standard_D2s_v5",
          "Standard_D4s_v5"
        ],
        "[[def]]": "Standard_D2s_v5"
      }
    }
  slots:
    - id: pwType
      options:
        - { id: secure, text: securestring }
        - { id: string, text: string }
        - { id: secobj, text: secureObject }
        - { id: password, text: password }
    - id: constraint
      options:
        - { id: allowedValues, text: allowedValues }
        - { id: allowed, text: allowed }
        - { id: enum, text: enum }
        - { id: values, text: values }
    - id: def
      options:
        - { id: defaultValue, text: defaultValue }
        - { id: value, text: value }
        - { id: default, text: default }
answer:
  values: { pwType: secure, constraint: allowedValues, def: defaultValue }
explanation:
  correct:
    en: A parameter of type `securestring` is not logged or returned in the deployment history. `allowedValues` restricts the parameter to a list of values and the deployment fails validation for any other value. `defaultValue` supplies the value used when none is passed.
    fr: "Un paramètre de type `securestring` n'est ni journalisé ni renvoyé dans l'historique de déploiement. `allowedValues` limite le paramètre à une liste de valeurs, et toute autre valeur fait échouer la validation du déploiement. `defaultValue` fournit la valeur utilisée lorsqu'aucune n'est transmise."
  options:
    string: { en: A plain string value can appear in the deployment history., fr: "Une valeur de type string peut apparaître dans l'historique de déploiement." }
    secobj: { en: "secureObject is for objects, not for a password string.", fr: "secureObject est destiné aux objets, pas à une chaîne de mot de passe." }
    allowed: { en: "@allowed is the Bicep decorator; ARM JSON uses allowedValues.", fr: "@allowed est le décorateur Bicep ; ARM JSON utilise allowedValues." }
    value: { en: "value is used in parameter files, not in the template's parameter definition.", fr: "value s'utilise dans les fichiers de paramètres, pas dans la définition de paramètre du modèle." }
references:
  - title: Parameters in templates
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/parameters
