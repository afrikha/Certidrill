id: c3-acr-admin-user-facts
objective: "3.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure container registry named **crfabrikam** (Standard tier). A developer asks you to enable the admin user so that she can test image pushes from her workstation.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Fabrikam dispose d'un registre de conteneurs Azure nommé **crfabrikam** (niveau Standard). Une développeuse vous demande d'activer l'utilisateur administrateur pour pouvoir tester l'envoi (push) d'images depuis son poste de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: The admin user account of a new registry is disabled by default.
        fr: Le compte d'utilisateur administrateur d'un nouveau registre est désactivé par défaut.
    - id: s2
      text:
        en: You can restrict the admin user account so that it can only pull images.
        fr: Vous pouvez restreindre le compte d'utilisateur administrateur pour qu'il puisse uniquement récupérer (pull) des images.
    - id: s3
      text:
        en: The admin user has two passwords, so clients can keep using one password while you regenerate the other.
        fr: L'utilisateur administrateur possède deux mots de passe ; les clients peuvent donc continuer à utiliser l'un pendant que vous régénérez l'autre.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Every registry includes an admin user account that is disabled until you enable it (for example with `az acr update --admin-enabled true`). The admin account always has both pull and push access and cannot be scoped down, which is why Microsoft recommends individual Microsoft Entra identities or service principals instead. It has two passwords that you can regenerate independently to rotate credentials without interruption.
    fr: "Chaque registre comprend un compte d'utilisateur administrateur désactivé tant que vous ne l'activez pas (par exemple avec `az acr update --admin-enabled true`). Le compte administrateur dispose toujours des accès en récupération et en envoi et ne peut pas être restreint : c'est pourquoi Microsoft recommande plutôt des identités Microsoft Entra individuelles ou des principaux de service. Il possède deux mots de passe que vous pouvez régénérer séparément pour faire tourner les informations d'identification sans interruption."
  options:
    s2:
      en: The admin user always has pull and push access; use Microsoft Entra role assignments (for example AcrPull) for pull-only access.
      fr: L'utilisateur administrateur a toujours les accès pull et push ; utilisez des attributions de rôle Microsoft Entra (par exemple AcrPull) pour un accès en récupération seule.
references:
  - title: Azure Container Registry Authentication Options Explained
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
