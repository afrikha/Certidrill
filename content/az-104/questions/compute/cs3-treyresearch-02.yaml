id: cs3-treyresearch-02
objective: "3.1.4"
type: dropdown
caseStudy: cs3-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the second compute requirement for vmss-geno-spot.bicep.

    How should you complete the Azure CLI command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire la deuxième exigence de calcul pour vmss-geno-spot.bicep.

    Comment devez-vous compléter la commande Azure CLI ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az deployment [[scope]] [[op]] \
      --resource-group RG-HPC \
      --template-file vmss-geno-spot.bicep
  slots:
    - id: scope
      options:
        - { id: group, text: group }
        - { id: sub, text: sub }
        - { id: mg, text: mg }
        - { id: tenant, text: tenant }
    - id: op
      options:
        - { id: whatif, text: what-if }
        - { id: validate, text: validate }
        - { id: create, text: create }
        - { id: show, text: show }
answer:
  values: { scope: group, op: whatif }
explanation:
  correct:
    en: "The file targets a resource group, so you use the az deployment group commands with --resource-group. The what-if operation shows the resources that the deployment would create, modify or delete without applying any change, which lets the administrators review the changes before the real deployment."
    fr: "Le fichier cible un groupe de ressources : vous utilisez donc les commandes az deployment group avec --resource-group. L'opération de simulation (what-if) affiche les ressources que le déploiement créerait, modifierait ou supprimerait sans appliquer de modification, ce qui permet aux administrateurs d'examiner les changements avant le déploiement réel."
  options:
    op: { en: "validate only checks that the template is syntactically correct and would be accepted; it doesn't list the changes. create deploys the changes. show displays an existing deployment.", fr: "validate vérifie seulement que le modèle est correct et serait accepté ; il ne liste pas les changements. create déploie les changements. show affiche un déploiement existant." }
    scope: { en: "sub, mg and tenant are for files whose targetScope is subscription, managementGroup or tenant.", fr: "sub, mg et tenant servent aux fichiers dont le targetScope est subscription, managementGroup ou tenant." }
references:
  - title: "Bicep deployment what-if operation"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
