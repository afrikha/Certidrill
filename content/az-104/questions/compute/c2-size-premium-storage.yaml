id: c2-size-premium-storage
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a virtual machine named **DB1** that uses the Standard_E4_v3 size and has Standard SSD disks. You need to convert the disks of DB1 to Premium SSD. The new size must stay in the same memory-optimized series with the same number of vCPUs.

    To which size should you resize DB1?
  fr: |
    Vous disposez d'une machine virtuelle nommée **DB1** qui utilise la taille Standard_E4_v3 et des disques SSD Standard. Vous devez convertir les disques de DB1 en SSD Premium. La nouvelle taille doit rester dans la même série à mémoire optimisée, avec le même nombre de processeurs virtuels.

    Vers quelle taille devez-vous redimensionner DB1 ?
body:
  options:
    - id: a
      text: Standard_E4s_v3
    - id: b
      text: Standard_E8_v3
    - id: c
      text: Standard_D4_v3
    - id: d
      text: Standard_E4-2s_v3
answer: { optionId: a }
explanation:
  correct:
    en: Premium SSD disks require a VM size that supports Premium Storage, identified by an **s** in the size name. Standard_E4s_v3 is the Premium Storage-capable version of Standard_E4_v3 with the same number of vCPUs.
    fr: Les disques SSD Premium nécessitent une taille de machine virtuelle qui prend en charge le stockage Premium, identifiée par un **s** dans le nom de la taille. Standard_E4s_v3 est la version compatible avec le stockage Premium de Standard_E4_v3, avec le même nombre de processeurs virtuels.
  options:
    b:
      en: Standard_E8_v3 has more vCPUs and, without the s suffix, still doesn't support Premium Storage.
      fr: Standard_E8_v3 a plus de processeurs virtuels et, sans le suffixe s, ne prend toujours pas en charge le stockage Premium.
    c:
      en: Standard_D4_v3 is a general purpose size without Premium Storage support.
      fr: Standard_D4_v3 est une taille à usage général qui ne prend pas en charge le stockage Premium.
    d:
      en: Standard_E4-2s_v3 is a constrained vCPU size that exposes only 2 of the 4 vCPUs.
      fr: Standard_E4-2s_v3 est une taille à processeurs virtuels limités qui n'expose que 2 des 4 processeurs virtuels.
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
