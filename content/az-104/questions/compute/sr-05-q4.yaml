id: sr-05-q4
objective: "3.2.6"
type: series_yesno
series: sr-05-zone-resilience
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You deploy a Virtual Machine Scale Set in Flexible orchestration mode across zones 1, 2, and 3.
  fr: |
    Vous déployez un groupe de machines virtuelles identiques en mode d'orchestration Flexible dans les zones 1, 2 et 3.
body:
  solution:
    en: |
      You deploy a Virtual Machine Scale Set in **Flexible** orchestration mode with **3 instances**, configured to spread its instances across **zones 1, 2, and 3**, and you connect it to the backend pool of the load balancer.
    fr: |
      Vous déployez un groupe de machines virtuelles identiques en mode d'orchestration **Flexible** avec **3 instances**, configuré pour répartir ses instances entre les **zones 1, 2 et 3**, et vous le connectez au pool principal de l'équilibreur de charge.
answer: { value: true }
explanation:
  correct:
    en: |
      A scale set can deploy its virtual machines across multiple availability zones. With the three instances spread over zones 1, 2, and 3, the loss of one zone leaves two instances running behind the zone-redundant load balancer, so App1 stays available and the goal is met.
    fr: |
      Un groupe de machines virtuelles identiques peut déployer ses machines virtuelles dans plusieurs zones de disponibilité. Avec les trois instances réparties entre les zones 1, 2 et 3, la perte d'une zone laisse deux instances en fonctionnement derrière l'équilibreur de charge redondant interzone : App1 reste disponible et l'objectif est atteint.
references:
  - title: "Availability options for Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
