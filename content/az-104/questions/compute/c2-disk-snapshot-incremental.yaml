id: c2-disk-snapshot-incremental
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a 1 TiB Premium SSD managed disk named **Disk1**. You need to take a daily point-in-time copy of Disk1 that can be used to create a new managed disk. The solution must minimize storage costs.

    What should you create every day?
  fr: |
    Vous disposez d'un disque managé SSD Premium de 1 Tio nommé **Disk1**. Vous devez réaliser chaque jour une copie à un instant donné de Disk1 qui pourra servir à créer un nouveau disque managé. La solution doit réduire au minimum les coûts de stockage.

    Que devez-vous créer chaque jour ?
body:
  options:
    - id: a
      text: { en: An incremental snapshot of Disk1, fr: Un instantané incrémentiel de Disk1 }
    - id: b
      text: { en: A full snapshot of Disk1 stored on Premium SSD, fr: Un instantané complet de Disk1 stocké sur SSD Premium }
    - id: c
      text: { en: A copy of Disk1 as a new Standard HDD managed disk, fr: Une copie de Disk1 sous forme de nouveau disque managé HDD Standard }
    - id: d
      text: { en: A new image version in an Azure Compute Gallery, fr: Une nouvelle version d'image dans une galerie Azure Compute Gallery }
answer: { optionId: a }
explanation:
  correct:
    en: After the first full copy, each incremental snapshot stores only the changes since the previous snapshot, and it is billed for the used size only. Incremental snapshots always use Standard HDD storage, whatever the source disk type, and can be used to create a full managed disk.
    fr: Après la première copie complète, chaque instantané incrémentiel ne stocke que les modifications depuis l'instantané précédent et n'est facturé que pour la taille utilisée. Les instantanés incrémentiels utilisent toujours le stockage HDD Standard, quel que soit le type du disque source, et permettent de créer un disque managé complet.
  options:
    b:
      en: Each full snapshot stores the whole disk, and Premium SSD storage is the most expensive option.
      fr: Chaque instantané complet stocke le disque entier, et le stockage SSD Premium est l'option la plus coûteuse.
    c:
      en: A full disk copy is billed for its whole provisioned size every day.
      fr: Une copie complète de disque est facturée chaque jour pour toute sa taille provisionnée.
    d:
      en: A gallery image is designed to deploy new VMs at scale, not to keep daily backups of a data disk.
      fr: Une image de galerie sert à déployer de nouvelles machines virtuelles à grande échelle, pas à conserver des copies quotidiennes d'un disque de données.
references:
  - title: Create an incremental snapshot
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-incremental-snapshots
