id: cs1-contoso-04
objective: "3.2.7"
type: yesno_statements
caseStudy: cs1-contoso
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy VMSS-Web to meet the technical requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de déployer VMSS-Web pour satisfaire les exigences techniques.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: |
          Spreading the instances of VMSS-Web across availability zones 1, 2, and 3 keeps the web tier available if one zone of East US fails.
        fr: |
          Répartir les instances de VMSS-Web sur les zones de disponibilité 1, 2 et 3 permet au niveau web de rester disponible en cas de défaillance d'une zone d'East US.
    - id: s2
      text:
        en: |
          An autoscale rule based on the average Percentage CPU of VMSS-Web requires you to install the Azure Monitor Agent on every instance.
        fr: |
          Une règle de mise à l'échelle automatique fondée sur la métrique Percentage CPU moyenne de VMSS-Web vous oblige à installer l'agent Azure Monitor sur chaque instance.
    - id: s3
      text:
        en: |
          Setting the instance limits to a minimum of 2 and a maximum of 10 prevents autoscale from reducing VMSS-Web to fewer than two instances.
        fr: |
          Définir les limites d'instances à un minimum de 2 et un maximum de 10 empêche la mise à l'échelle automatique de réduire VMSS-Web à moins de deux instances.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A zone-spanning scale set distributes its instances across zones, so the remaining zones keep serving traffic when one zone fails. Percentage CPU is a host-level platform metric that autoscale reads without any agent in the guest OS. The minimum and maximum instance limits bound every autoscale action, so the scale set never goes below two instances.
    fr: |
      Un groupe identique réparti sur plusieurs zones distribue ses instances entre ces zones ; les zones restantes continuent de servir le trafic si une zone tombe en panne. Percentage CPU est une métrique de plateforme au niveau de l'hôte, que la mise à l'échelle automatique lit sans aucun agent dans le système d'exploitation invité. Les nombres minimal et maximal d'instances encadrent toutes les actions de mise à l'échelle automatique : le groupe ne descend jamais sous deux instances.
  options:
    s2: { en: "Host metrics such as Percentage CPU are collected by the platform; only guest OS metrics need an agent.", fr: "Les métriques d'hôte comme Percentage CPU sont collectées par la plateforme ; seules les métriques du système d'exploitation invité nécessitent un agent." }
references:
  - title: Availability zone options for Azure Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-use-availability-zones
  - title: Overview of autoscale with Azure Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-autoscale-overview
