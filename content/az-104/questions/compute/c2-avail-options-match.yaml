id: c2-avail-options-match
objective: "3.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans to deploy several virtual machine workloads in Azure and has the four requirements shown in the answer area.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.
  fr: |
    Wingtip Toys prévoit de déployer plusieurs charges de travail de machines virtuelles dans Azure et a les quatre exigences présentées dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: az, text: { en: Availability zones, fr: Zones de disponibilité } }
    - { id: as, text: { en: Availability set, fr: Groupe à haute disponibilité } }
    - { id: ppg, text: { en: Proximity placement group, fr: Groupe de placement de proximité } }
    - { id: vmss, text: { en: Virtual Machine Scale Set, fr: Groupe de machines virtuelles identiques } }
    - { id: asr, text: Azure Site Recovery }
  targets:
    - id: t1
      text: { en: "Keep an application running if one datacenter of the region fails", fr: "Maintenir une application en fonctionnement si un centre de données de la région tombe en panne" }
    - id: t2
      text: { en: "Spread VMs across fault domains in a region that has no availability zones", fr: "Répartir des machines virtuelles entre des domaines d'erreur dans une région sans zones de disponibilité" }
    - id: t3
      text: { en: "Place VMs as physically close as possible to get the lowest network latency", fr: "Placer des machines virtuelles le plus près possible physiquement pour obtenir la latence réseau la plus faible" }
    - id: t4
      text: { en: "Automatically add or remove VM instances based on CPU load", fr: "Ajouter ou supprimer automatiquement des instances de machine virtuelle selon la charge du processeur" }
answer:
  mapping: { t1: az, t2: as, t3: ppg, t4: vmss }
explanation:
  correct:
    en: Availability zones protect against the loss of a datacenter. Availability sets distribute VMs across fault and update domains and are especially useful in regions without zones. A proximity placement group colocates VMs to minimize latency. A scale set automatically increases or decreases the number of instances in response to demand.
    fr: Les zones de disponibilité protègent contre la perte d'un centre de données. Les groupes à haute disponibilité répartissent les machines virtuelles entre domaines d'erreur et de mise à jour, et sont particulièrement utiles dans les régions sans zones. Un groupe de placement de proximité rapproche les machines virtuelles pour réduire la latence. Un groupe de machines virtuelles identiques augmente ou diminue automatiquement le nombre d'instances selon la demande.
  options:
    asr: { en: Azure Site Recovery replicates VMs to another region for disaster recovery; it does none of the listed tasks within a region., fr: Azure Site Recovery réplique des machines virtuelles vers une autre région pour la reprise d'activité ; il ne réalise aucune des tâches listées au sein d'une région. }
references:
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
