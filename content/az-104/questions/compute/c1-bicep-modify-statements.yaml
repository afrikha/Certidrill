id: c1-bicep-modify-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You maintain a Bicep file named **main.bicep** that Litware uses to deploy its application infrastructure. You plan to make several changes to the file.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous gérez un fichier Bicep nommé **main.bicep** que Litware utilise pour déployer l'infrastructure de son application. Vous prévoyez d'apporter plusieurs modifications au fichier.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "To declare a subnet as a child of a virtual network declared in the same file, you can set the subnet's `parent` property to the symbolic name of the virtual network."
        fr: "Pour déclarer un sous-réseau comme enfant d'un réseau virtuel déclaré dans le même fichier, vous pouvez définir la propriété `parent` du sous-réseau sur le nom symbolique du réseau virtuel."
    - id: s2
      text:
        en: "When a property of a resource references another resource through its symbolic name, for example `stg.id`, you must also add that resource to `dependsOn`."
        fr: "Lorsqu'une propriété d'une ressource référence une autre ressource par son nom symbolique, par exemple `stg.id`, vous devez également ajouter cette ressource à `dependsOn`."
    - id: s3
      text:
        en: "To make the file create resource groups, you add `targetScope = 'subscription'` to the file and deploy it at subscription scope."
        fr: "Pour que le fichier crée des groupes de ressources, vous ajoutez `targetScope = 'subscription'` au fichier et vous le déployez dans l'étendue de l'abonnement."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The `parent` property links a child resource to its parent through the parent's symbolic name, which also creates an implicit dependency. A reference to a symbolic name already creates an implicit dependency, so an explicit `dependsOn` is unnecessary. Resource groups are subscription-level resources: the file needs `targetScope = 'subscription'` and a subscription deployment such as `az deployment sub create`."
    fr: "La propriété `parent` relie une ressource enfant à son parent par le nom symbolique de celui-ci, ce qui crée aussi une dépendance implicite. Une référence à un nom symbolique crée déjà une dépendance implicite : un `dependsOn` explicite est inutile. Les groupes de ressources sont des ressources de niveau abonnement : le fichier a besoin de `targetScope = 'subscription'` et d'un déploiement d'abonnement, par exemple `az deployment sub create`."
references:
  - title: Child resources in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/child-resource-name-type
  - title: Use Bicep to deploy resources to subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-to-subscription
