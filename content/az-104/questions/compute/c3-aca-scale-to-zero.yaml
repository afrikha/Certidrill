id: c3-aca-scale-to-zero
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a container app named **ca-reports** that runs on the Consumption plan and has external HTTP ingress. The app is used only a few hours per week.

    You need to configure scaling for ca-reports so that no usage charges are incurred while the app receives no requests. The app must still start automatically when a request arrives.

    What should you configure?
  fr: |
    Tailspin dispose d'une application conteneur nommée **ca-reports** qui s'exécute sur le plan Consommation et possède une entrée HTTP externe. L'application n'est utilisée que quelques heures par semaine.

    Vous devez configurer la mise à l'échelle de ca-reports pour qu'aucun frais d'utilisation ne soit facturé tant que l'application ne reçoit aucune requête. L'application doit tout de même démarrer automatiquement à l'arrivée d'une requête.

    Que devez-vous configurer ?
body:
  options:
    - id: min0
      text: { en: Set the minimum number of replicas to 0 and keep an HTTP scale rule., fr: "Définir le nombre minimal de réplicas sur 0 et conserver une règle de mise à l'échelle HTTP." }
    - id: min1
      text: { en: Set the minimum number of replicas to 1 and the maximum number of replicas to 1., fr: Définir le nombre minimal de réplicas sur 1 et le nombre maximal de réplicas sur 1. }
    - id: max0
      text: { en: Set the maximum number of replicas to 0 outside business hours., fr: Définir le nombre maximal de réplicas sur 0 en dehors des heures ouvrées. }
    - id: dedicated
      text: { en: Move the app to a Dedicated workload profile., fr: Déplacer l'application vers un profil de charge de travail Dedicated. }
answer: { optionId: min0 }
explanation:
  correct:
    en: With a minimum of 0 replicas, a revision scales to zero when there is no traffic, and you aren't billed usage charges while it has no replicas. The HTTP scale rule, driven by concurrent requests through ingress, adds a replica again when requests arrive.
    fr: "Avec un nombre minimal de 0 réplica, une révision est mise à l'échelle à zéro en l'absence de trafic, et aucun frais d'utilisation n'est facturé tant qu'elle n'a pas de réplica. La règle de mise à l'échelle HTTP, basée sur les requêtes simultanées reçues par l'entrée, ajoute de nouveau un réplica à l'arrivée des requêtes."
  options:
    min1:
      en: A minimum of 1 keeps one replica running at all times, so the app never scales to zero.
      fr: Un minimum de 1 maintient en permanence un réplica en cours d'exécution ; l'application ne descend donc jamais à zéro.
    max0:
      en: The maximum number of replicas must be at least 1, and a scheduled change would not start the app when a request arrives.
      fr: Le nombre maximal de réplicas doit être au moins égal à 1, et une modification planifiée ne démarrerait pas l'application à l'arrivée d'une requête.
    dedicated:
      en: The Dedicated plan adds a fixed management cost and billed instances; it does not remove charges when the app is idle.
      fr: Le plan Dedicated ajoute un coût de gestion fixe et des instances facturées ; il ne supprime pas les frais quand l'application est inactive.
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
