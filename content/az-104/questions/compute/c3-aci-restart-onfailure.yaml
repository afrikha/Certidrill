id: c3-aci-restart-onfailure
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin uses Azure Container Instances to run a nightly image-rendering job. The job runs in a container group named **aci-render**, processes a batch of files, and then exits.

    You need to configure aci-render so that:

    - the container is restarted automatically only if the process exits with an error;
    - the container is not restarted after the process completes successfully.

    Which restart policy should you configure?
  fr: |
    Tailspin utilise Azure Container Instances pour exécuter chaque nuit un travail de rendu d'images. Le travail s'exécute dans un groupe de conteneurs nommé **aci-render**, traite un lot de fichiers, puis se termine.

    Vous devez configurer aci-render pour que :

    - le conteneur soit redémarré automatiquement uniquement si le processus se termine par une erreur ;
    - le conteneur ne soit pas redémarré lorsque le processus se termine avec succès.

    Quelle stratégie de redémarrage devez-vous configurer ?
body:
  options:
    - { id: always, text: Always }
    - { id: never, text: Never }
    - { id: onfailure, text: OnFailure }
    - id: probe
      text: { en: "Always, with a liveness probe on the container", fr: "Always, avec une sonde liveness sur le conteneur" }
answer: { optionId: onfailure }
explanation:
  correct:
    en: With `OnFailure`, containers in the group are restarted only when their process terminates with a nonzero exit code, and they run at least once. After a successful exit, the container stops in the Terminated state and billing stops, which suits run-once tasks.
    fr: "Avec `OnFailure`, les conteneurs du groupe ne sont redémarrés que lorsque leur processus se termine avec un code de sortie différent de zéro, et ils s'exécutent au moins une fois. Après une sortie réussie, le conteneur s'arrête dans l'état Terminated et la facturation cesse, ce qui convient aux tâches à exécution unique."
  options:
    always:
      en: Always is the default policy; it restarts the container even after a successful exit, so the job would run again and again.
      fr: Always est la stratégie par défaut ; elle redémarre le conteneur même après une sortie réussie, si bien que le travail s'exécuterait sans fin.
    never:
      en: Never does not provide the required automatic restart when the job fails.
      fr: Never n'assure pas le redémarrage automatique exigé en cas d'échec du travail.
    probe:
      en: A liveness probe restarts unhealthy containers, but with the Always policy the container would still restart after a successful exit.
      fr: Une sonde liveness redémarre les conteneurs défaillants, mais avec la stratégie Always le conteneur redémarrerait quand même après une sortie réussie.
references:
  - title: Restart policy for run-once tasks
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-restart-policy
