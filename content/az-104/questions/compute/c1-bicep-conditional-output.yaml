id: c1-bicep-conditional-output
objective: "3.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Bicep file that deploys monitoring resources for Tailspin Toys.

    You need to modify the file to meet the following requirements:

    - The Log Analytics workspace is deployed only when **environment** is prod.
    - The output **workspaceId** returns the resource ID of the workspace when it is deployed, and an empty string otherwise.

    How should you complete the file? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un fichier Bicep qui déploie les ressources de supervision de Tailspin Toys.

    Vous devez modifier le fichier pour répondre aux exigences suivantes :

    - l'espace de travail Log Analytics n'est déployé que lorsque **environment** vaut prod ;
    - la sortie **workspaceId** renvoie l'ID de ressource de l'espace de travail lorsqu'il est déployé, et une chaîne vide dans le cas contraire.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bicep
  template: |
    @allowed([
      'dev'
      'prod'
    ])
    param environment string

    resource law 'Microsoft.OperationalInsights/workspaces@2023-09-01' = [[cond]] {
      name: 'law-tailspin-${environment}'
      location: resourceGroup().location
      properties: {
        sku: {
          name: 'PerGB2018'
        }
        retentionInDays: 30
      }
    }

    output workspaceId string = [[out]]
  slots:
    - id: cond
      options:
        - { id: if, text: "if (environment == 'prod')" }
        - { id: ifnoparen, text: "if environment == 'prod'" }
        - { id: when, text: "when (environment == 'prod')" }
        - { id: condition, text: "condition(environment == 'prod')" }
    - id: out
      options:
        - { id: ternary, text: "environment == 'prod' ? law.id : ''" }
        - { id: id, text: law.id }
        - { id: ifout, text: "if (environment == 'prod') law.id" }
        - { id: coalesce, text: "environment == 'prod' ?? law.id" }
answer:
  values: { cond: if, out: ternary }
explanation:
  correct:
    en: "A conditional resource is declared with `if (<condition>)` placed before the resource body; the parentheses are required. To return a value only when the resource is deployed, use the conditional operator `condition ? valueIfTrue : valueIfFalse`, which returns an empty string when the workspace is skipped."
    fr: "Une ressource conditionnelle se déclare avec `if (<condition>)` placé avant le corps de la ressource ; les parenthèses sont obligatoires. Pour ne renvoyer une valeur que lorsque la ressource est déployée, utilisez l'opérateur conditionnel `condition ? valeurSiVrai : valeurSiFaux`, qui renvoie une chaîne vide lorsque l'espace de travail est ignoré."
  options:
    ifnoparen: { en: The condition of an if expression must be enclosed in parentheses., fr: "La condition d'une expression if doit être entre parenthèses." }
    when: { en: Bicep has no when keyword., fr: "Bicep n'a pas de mot clé when." }
    id: { en: This always returns a workspace ID, even when the workspace is not deployed, instead of an empty string., fr: "Cela renvoie toujours un ID d'espace de travail, même lorsque l'espace de travail n'est pas déployé, au lieu d'une chaîne vide." }
    ifout: { en: "An if expression cannot be used as an output value; use the ?: operator.", fr: "Une expression if ne peut pas servir de valeur de sortie ; utilisez l'opérateur ?:." }
    coalesce: { en: "?? returns the first non-null operand; it does not test a condition.", fr: "?? renvoie le premier opérande non null ; il ne teste pas de condition." }
references:
  - title: Conditional deployments in Bicep with the if expression
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/conditional-resource-deployment
  - title: Outputs in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/outputs
