id: sr-05-q3
objective: "3.2.6"
type: series_yesno
series: sr-05-zone-resilience
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You deploy the three virtual machines to zone 1 in a proximity placement group.
  fr: |
    Vous déployez les trois machines virtuelles dans la zone 1, dans un groupe de placement de proximité.
body:
  solution:
    en: |
      To minimize latency between the virtual machines, you create a proximity placement group in **zone 1** and deploy the three virtual machines to **zone 1** in that group.
    fr: |
      Pour réduire la latence entre les machines virtuelles, vous créez un groupe de placement de proximité dans la **zone 1** et y déployez les trois machines virtuelles dans la **zone 1**.
answer: { value: false }
explanation:
  correct:
    en: |
      All three virtual machines run in the same availability zone, and the proximity placement group places them even closer together. A failure of zone 1 would stop every instance of App1, so the goal isn't met.
    fr: |
      Les trois machines virtuelles s'exécutent dans la même zone de disponibilité, et le groupe de placement de proximité les rapproche encore davantage. Une défaillance de la zone 1 arrêterait toutes les instances d'App1 : l'objectif n'est pas atteint.
references:
  - title: "What are Azure availability zones?"
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
