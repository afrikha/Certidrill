id: c4-slot-routing-optin
objective: "3.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-contoso** that runs on an App Service plan in the Standard S1 tier. A beta version of the app is deployed to a deployment slot named **beta**. The Traffic % of the beta slot is explicitly set to 0.

    You need to let selected users opt in to the beta version from a link on the production site, while they keep using the production host name. Other users must never be routed to the beta slot automatically.

    What should the link point to?
  fr: |
    Vous disposez d'une application web nommée **app-contoso** qui s'exécute sur un plan App Service de niveau Standard S1. Une version bêta de l'application est déployée dans un emplacement de déploiement nommé **beta**. La valeur Traffic % de l'emplacement beta est explicitement définie sur 0.

    Vous devez permettre à certains utilisateurs de choisir la version bêta à partir d'un lien sur le site de production, tout en continuant d'utiliser le nom d'hôte de production. Les autres utilisateurs ne doivent jamais être acheminés automatiquement vers l'emplacement beta.

    Vers quoi le lien doit-il pointer ?
body:
  options:
    - { id: a, text: "https://app-contoso.azurewebsites.net/?x-ms-routing-name=beta" }
    - { id: b, text: "https://app-contoso.azurewebsites.net/?x-ms-routing-name=self" }
    - { id: c, text: "https://app-contoso-beta.azurewebsites.net" }
    - { id: d, text: "https://app-contoso.scm.azurewebsites.net/beta" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `x-ms-routing-name` query parameter routes a request on the production host name to a specific slot, and the resulting cookie pins the session to that slot. With Traffic % explicitly set to 0, nobody is routed to the slot automatically, but users who follow the link opt in.
    fr: |
      Le paramètre de requête `x-ms-routing-name` achemine une requête adressée au nom d'hôte de production vers un emplacement précis, et le cookie obtenu épingle la session à cet emplacement. Avec Traffic % explicitement défini sur 0, personne n'est acheminé automatiquement vers l'emplacement, mais les utilisateurs qui suivent le lien y adhèrent.
  options:
    b:
      en: |
        `self` designates the production slot; this link lets users opt out of the beta.
      fr: |
        `self` désigne l'emplacement de production ; ce lien permet aux utilisateurs de quitter la bêta.
    c:
      en: |
        This is the slot's own host name, so users would no longer use the production host name.
      fr: |
        Il s'agit du nom d'hôte propre à l'emplacement : les utilisateurs n'utiliseraient donc plus le nom d'hôte de production.
    d:
      en: |
        The SCM (Kudu) site is a management endpoint, not a way to route users to a slot.
      fr: |
        Le site SCM (Kudu) est un point de terminaison de gestion, pas un moyen d'acheminer les utilisateurs vers un emplacement.
references:
  - title: "Set Up Staging Environments"
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
