id: c3-aca-separate-environments
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to run two sets of container apps in Azure Container Apps: production apps and test apps. Both sets are deployed to the same Azure region.

    The solution must meet the following requirements:

    - Production apps and test apps must never share compute resources.
    - Test apps must not be able to call production apps through the built-in Dapr service invocation API.
    - Production logs must not be sent to the same logging destination as test logs.

    What should you do?
  fr: |
    Adatum prévoit d'exécuter deux ensembles d'applications conteneur dans Azure Container Apps : des applications de production et des applications de test. Les deux ensembles sont déployés dans la même région Azure.

    La solution doit répondre aux exigences suivantes :

    - Les applications de production et de test ne doivent jamais partager de ressources de calcul.
    - Les applications de test ne doivent pas pouvoir appeler les applications de production via l'API d'appel de service Dapr intégrée.
    - Les journaux de production ne doivent pas être envoyés vers la même destination que les journaux de test.

    Que devez-vous faire ?
body:
  options:
    - id: twoenv
      text: { en: Deploy the production apps and the test apps to two separate Container Apps environments., fr: Déployer les applications de production et de test dans deux environnements Container Apps distincts. }
    - id: internal
      text: { en: Deploy all the apps to one environment and set internal ingress on the test apps., fr: Déployer toutes les applications dans un seul environnement et définir une entrée interne sur les applications de test. }
    - id: labels
      text: { en: "Deploy all the apps to one environment in multiple revision mode, with the labels test and prod.", fr: "Déployer toutes les applications dans un seul environnement en mode de révisions multiples, avec les étiquettes test et prod." }
    - id: iprestrict
      text: { en: Deploy all the apps to one environment and add IP restrictions to the production apps., fr: Déployer toutes les applications dans un seul environnement et ajouter des restrictions IP aux applications de production. }
answer: { optionId: twoenv }
explanation:
  correct:
    en: A Container Apps environment is the secure boundary around its apps. Apps in the same environment share the same virtual network and write logs to the same destination, and they can communicate through Dapr service invocation. Microsoft recommends separate environments when apps must never share compute resources, must not communicate through Dapr, or must be isolated for team or test/production usage.
    fr: "Un environnement Container Apps est la limite sécurisée qui entoure ses applications. Les applications d'un même environnement partagent le même réseau virtuel, écrivent leurs journaux vers la même destination et peuvent communiquer via l'appel de service Dapr. Microsoft recommande des environnements distincts lorsque les applications ne doivent jamais partager de ressources de calcul, ne doivent pas communiquer via Dapr ou doivent être isolées selon l'équipe ou l'usage (test ou production)."
  options:
    internal:
      en: Internal ingress only limits who can reach an app's endpoint; the apps would still share the environment, its network and its log destination.
      fr: L'entrée interne limite seulement qui peut atteindre le point de terminaison d'une application ; les applications partageraient toujours l'environnement, son réseau et sa destination de journaux.
    labels:
      en: Labels route traffic to specific revisions of one app; they do not isolate different apps from each other.
      fr: Les étiquettes routent le trafic vers des révisions précises d'une application ; elles n'isolent pas des applications différentes les unes des autres.
    iprestrict:
      en: IP restrictions filter inbound ingress traffic; they do not separate compute, Dapr communication or logs.
      fr: Les restrictions IP filtrent le trafic d'entrée ; elles ne séparent ni le calcul, ni la communication Dapr, ni les journaux.
references:
  - title: Azure Container Apps environments
    url: https://learn.microsoft.com/en-us/azure/container-apps/environment
