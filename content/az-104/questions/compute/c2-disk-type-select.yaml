id: c2-disk-type-select
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a zonal virtual machine named **SQL1** in availability zone 1 of the North Europe region. You need to add a data disk to SQL1 that meets the following requirements:

    - It must sustain 30,000 IOPS.
    - Its IOPS and throughput must be adjustable later without detaching the disk or restarting SQL1.
    - Costs must be minimized.

    Which disk type should you use?
  fr: |
    Vous disposez d'une machine virtuelle zonale nommée **SQL1** dans la zone de disponibilité 1 de la région North Europe. Vous devez ajouter à SQL1 un disque de données qui répond aux exigences suivantes :

    - Il doit soutenir 30 000 IOPS.
    - Ses IOPS et son débit doivent pouvoir être ajustés plus tard sans détacher le disque ni redémarrer SQL1.
    - Les coûts doivent être réduits au minimum.

    Quel type de disque devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: Premium SSD v2, fr: SSD Premium v2 }
    - id: b
      text: { en: Ultra Disk, fr: Disque Ultra }
    - id: c
      text: { en: Premium SSD (P80), fr: SSD Premium (P80) }
    - id: d
      text: { en: Standard SSD (E80), fr: SSD Standard (E80) }
answer: { optionId: a }
explanation:
  correct:
    en: Premium SSD v2 supports up to 80,000 IOPS, lets you change capacity, IOPS and throughput without downtime, and is generally less costly than Ultra Disk for most workloads. It can be attached to zonal VMs, and North Europe supports zonal Premium SSD v2 disks.
    fr: Le SSD Premium v2 prend en charge jusqu'à 80 000 IOPS, permet de modifier la capacité, les IOPS et le débit sans interruption, et coûte généralement moins cher que le disque Ultra pour la plupart des charges de travail. Il peut être attaché à des machines virtuelles zonales, et North Europe prend en charge les disques SSD Premium v2 zonaux.
  options:
    b:
      en: Ultra Disk also meets the performance requirements, but it is the most expensive option and is intended for the most I/O-intensive workloads.
      fr: Le disque Ultra répond aussi aux exigences de performances, mais c'est l'option la plus coûteuse, destinée aux charges de travail les plus intensives en E/S.
    c:
      en: A Premium SSD is limited to 20,000 IOPS, and its performance is tied to fixed disk sizes.
      fr: Un SSD Premium est limité à 20 000 IOPS, et ses performances sont liées à des tailles de disque fixes.
    d:
      en: A Standard SSD provides at most 6,000 IOPS.
      fr: Un SSD Standard fournit au maximum 6 000 IOPS.
references:
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
