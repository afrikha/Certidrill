id: c3-aca-cpu-memory-combos
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a workload profiles environment in Azure Container Apps. You plan to deploy several container apps on the **Consumption** workload profile and need to size their CPU and memory.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Northwind dispose d'un environnement de profils de charge de travail dans Azure Container Apps. Vous prévoyez de déployer plusieurs applications conteneur sur le profil de charge de travail **Consumption** et devez dimensionner leur processeur et leur mémoire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A container app with a single container that is allocated 0.5 vCPU and 1.0Gi of memory is a valid configuration.
        fr: Une application conteneur avec un seul conteneur auquel sont alloués 0,5 processeur virtuel et 1.0Gi de mémoire est une configuration valide.
    - id: s2
      text:
        en: A container app with a single container that is allocated 1.0 vCPU and 4.0Gi of memory is a valid configuration.
        fr: Une application conteneur avec un seul conteneur auquel sont alloués 1,0 processeur virtuel et 4.0Gi de mémoire est une configuration valide.
    - id: s3
      text:
        en: A container app with a main container (0.75 vCPU, 1.5Gi) and a sidecar container (0.25 vCPU, 0.5Gi) is a valid configuration.
        fr: Une application conteneur avec un conteneur principal (0,75 processeur virtuel, 1.5Gi) et un conteneur sidecar (0,25 processeur virtuel, 0.5Gi) est une configuration valide.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: On the Consumption workload profile, the total CPU and memory of all the containers in an app must match one of the supported combinations, from 0.25 vCPU with 0.5Gi up to 4.0 vCPU with 8.0Gi, always with 2Gi of memory per vCPU. 0.5 vCPU with 1.0Gi is supported, and the main container plus sidecar add up to 1.0 vCPU with 2.0Gi, which is supported. 1.0 vCPU must be paired with 2.0Gi, not 4.0Gi. Container Apps scales horizontally by adding replicas; vertical scaling isn't supported.
    fr: "Sur le profil de charge de travail Consumption, le total processeur et mémoire de tous les conteneurs d'une application doit correspondre à l'une des combinaisons prises en charge, de 0,25 processeur virtuel avec 0.5Gi jusqu'à 4,0 processeurs virtuels avec 8.0Gi, toujours avec 2Gi de mémoire par processeur virtuel. 0,5 processeur virtuel avec 1.0Gi est pris en charge, et le conteneur principal plus le sidecar totalisent 1,0 processeur virtuel avec 2.0Gi, ce qui est pris en charge. 1,0 processeur virtuel doit être associé à 2.0Gi, pas à 4.0Gi. Container Apps met à l'échelle horizontalement en ajoutant des réplicas ; la mise à l'échelle verticale n'est pas prise en charge."
  options:
    s2:
      en: The supported combination for 1.0 vCPU is 2.0Gi of memory.
      fr: La combinaison prise en charge pour 1,0 processeur virtuel est 2.0Gi de mémoire.
references:
  - title: Containers in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/containers
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
