id: cs2-wingtip-03
objective: "3.3.2"
type: single
caseStudy: cs2-wingtip
difficulty: 1
status: draft
stem:
  en: You need to meet the technical requirement for aci-catalog-import. Which restart policy should you configure?
  fr: Vous devez satisfaire l'exigence technique concernant aci-catalog-import. Quelle stratégie de redémarrage devez-vous configurer ?
body:
  options:
    - { id: a, text: "OnFailure" }
    - { id: b, text: "Always" }
    - { id: c, text: "Never" }
    - { id: d, text: { en: "Always, with a liveness probe", fr: "Always, avec une sonde liveness" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With the OnFailure restart policy, Azure Container Instances restarts the containers only when they exit with a non-zero code. After a successful run (exit code 0), the container group stops and is no longer billed for compute.
    fr: |
      Avec la stratégie de redémarrage OnFailure, Azure Container Instances ne redémarre les conteneurs que lorsqu'ils se terminent avec un code différent de zéro. Après une exécution réussie (code 0), le groupe de conteneurs s'arrête et n'est plus facturé pour le calcul.
  options:
    b: { en: "Always restarts the container even after a successful run, so the import runs again and again.", fr: "Always redémarre le conteneur même après une exécution réussie ; l'import s'exécute donc en boucle." }
    c: { en: "Never does not restart the container when the import fails.", fr: "Never ne redémarre pas le conteneur quand l'import échoue." }
    d: { en: "A liveness probe restarts unhealthy containers, but Always still restarts the container after success.", fr: "Une sonde liveness redémarre les conteneurs défaillants, mais Always redémarre toujours le conteneur après une réussite." }
references:
  - title: "Restart policy for run-once tasks - Azure Container Instances"
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-restart-policy
