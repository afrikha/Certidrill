id: cs3-margiestravel-01
objective: "3.4.1"
type: single
caseStudy: cs3-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to change the pricing tier of asp-booking-we to meet the web application requirements.

    To which pricing tier should you scale up the plan?
  fr: |
    Vous devez modifier le niveau tarifaire d'asp-booking-we pour satisfaire les exigences relatives à l'application web.

    Vers quel niveau tarifaire devez-vous effectuer un scale-up du plan ?
body:
  options:
    - { id: a, text: { en: "Free (F1)", fr: "Gratuit (F1)" } }
    - { id: b, text: { en: "Basic (B3)", fr: "Basic (B3)" } }
    - { id: c, text: { en: "Standard (S1)", fr: "Standard (S1)" } }
    - { id: d, text: { en: "Isolated v2 (I1v2)", fr: "Isolé v2 (I1v2)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Deployment slots and autoscale require the Standard tier or higher. The Standard tier supports up to five deployment slots, which covers staging, qa and hotfix, and it is the least expensive tier that meets both requirements."
    fr: "Les emplacements de déploiement et la mise à l'échelle automatique exigent le niveau Standard ou supérieur. Le niveau Standard prend en charge jusqu'à cinq emplacements de déploiement, ce qui couvre staging, qa et hotfix, et c'est le niveau le moins cher qui satisfait les deux exigences."
  options:
    a: { en: "The Free tier runs on shared compute and supports neither deployment slots nor scale-out.", fr: "Le niveau Gratuit s'exécute sur un calcul partagé et ne prend en charge ni les emplacements de déploiement ni le scale-out." }
    b: { en: "Basic supports only manual scale-out and has no deployment slots; a larger Basic instance doesn't change that.", fr: "Basic ne prend en charge que le scale-out manuel et n'offre pas d'emplacements de déploiement ; une instance Basic plus grande n'y change rien." }
    d: { en: "Isolated v2 meets the requirements but runs in an App Service Environment and costs much more.", fr: "Isolé v2 satisfait les exigences, mais s'exécute dans un App Service Environment et coûte beaucoup plus cher." }
references:
  - title: "Set Up Staging Environments - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: "Azure App Service plan overview"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
