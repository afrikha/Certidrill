id: c1-bicep-existing-vnet
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Bicep file that is deployed to a resource group named **RG-App**. The file deploys a network interface that must be connected to a subnet of an existing virtual network named **vnet-hub**. vnet-hub is in a resource group named **RG-Network** in the same subscription.

    You need to modify the file so that the network interface can use the virtual network without redeploying or modifying vnet-hub.

    Which declaration should you add to the file?

    **Declaration A**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'vnet-hub'
      scope: resourceGroup('RG-Network')
    }
    ```

    **Declaration B**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-hub'
      location: resourceGroup().location
    }
    ```

    **Declaration C**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'vnet-hub'
    }
    ```

    **Declaration D**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'RG-Network/vnet-hub'
    }
    ```
  fr: |
    Vous disposez d'un fichier Bicep déployé dans un groupe de ressources nommé **RG-App**. Le fichier déploie une interface réseau qui doit être connectée à un sous-réseau d'un réseau virtuel existant nommé **vnet-hub**. vnet-hub se trouve dans un groupe de ressources nommé **RG-Network**, dans le même abonnement.

    Vous devez modifier le fichier pour que l'interface réseau puisse utiliser le réseau virtuel sans redéployer ni modifier vnet-hub.

    Quelle déclaration devez-vous ajouter au fichier ?

    **Déclaration A**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'vnet-hub'
      scope: resourceGroup('RG-Network')
    }
    ```

    **Déclaration B**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-hub'
      location: resourceGroup().location
    }
    ```

    **Déclaration C**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'vnet-hub'
    }
    ```

    **Déclaration D**

    ```bicep
    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' existing = {
      name: 'RG-Network/vnet-hub'
    }
    ```
shuffle: false
body:
  options:
    - { id: a, text: { en: Declaration A, fr: Déclaration A } }
    - { id: b, text: { en: Declaration B, fr: Déclaration B } }
    - { id: c, text: { en: Declaration C, fr: Déclaration C } }
    - { id: d, text: { en: Declaration D, fr: Déclaration D } }
answer: { optionId: a }
explanation:
  correct:
    en: The `existing` keyword references a resource that is already deployed without redeploying it. Because vnet-hub is not in the resource group targeted by the deployment, the `scope` property must point to RG-Network with `resourceGroup('RG-Network')`.
    fr: "Le mot clé `existing` référence une ressource déjà déployée sans la redéployer. Comme vnet-hub ne se trouve pas dans le groupe de ressources ciblé par le déploiement, la propriété `scope` doit pointer vers RG-Network avec `resourceGroup('RG-Network')`."
  options:
    b: { en: "Without existing, the declaration deploys a new virtual network named vnet-hub in RG-App.", fr: "Sans existing, la déclaration déploie un nouveau réseau virtuel nommé vnet-hub dans RG-App." }
    c: { en: "Without scope, Bicep looks for vnet-hub in RG-App, the target resource group, where it does not exist.", fr: "Sans scope, Bicep recherche vnet-hub dans RG-App, le groupe de ressources cible, où il n'existe pas." }
    d: { en: The name cannot carry the resource group; a slash in the name denotes a child resource., fr: "Le nom ne peut pas contenir le groupe de ressources ; une barre oblique dans le nom désigne une ressource enfant." }
references:
  - title: Reference existing resource in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/existing-resource
