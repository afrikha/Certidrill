id: c4-tls-basic-bindings
objective: "3.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-proseware** that runs on an App Service plan in the Basic B1 tier. The custom domain **shop.proseware.com** is mapped to the app by using a CNAME record that points directly to app-proseware.azurewebsites.net.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application web nommée **app-proseware** qui s'exécute sur un plan App Service de niveau Basic B1. Le domaine personnalisé **shop.proseware.com** est mappé à l'application par un enregistrement CNAME qui pointe directement vers app-proseware.azurewebsites.net.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can secure shop.proseware.com with an SNI SSL binding in the Basic tier.
        fr: Vous pouvez sécuriser shop.proseware.com avec une liaison SNI SSL au niveau Basic.
    - id: s2
      text:
        en: You can add an IP-based SSL binding for shop.proseware.com without changing the pricing tier.
        fr: Vous pouvez ajouter une liaison SSL basée sur IP pour shop.proseware.com sans changer de niveau tarifaire.
    - id: s3
      text:
        en: An App Service managed certificate created for shop.proseware.com can be exported as a PFX file for use on an Azure Application Gateway.
        fr: Un certificat managé App Service créé pour shop.proseware.com peut être exporté sous forme de fichier PFX pour être utilisé sur une passerelle Azure Application Gateway.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The Basic tier supports unlimited SNI SSL bindings and App Service managed certificates. IP-based SSL is supported only in the Standard tier or higher. The free managed certificate is fully managed by App Service and isn't exportable.
    fr: |
      Le niveau Basic prend en charge un nombre illimité de liaisons SNI SSL ainsi que les certificats managés App Service. Le SSL basé sur IP n'est pris en charge qu'à partir du niveau Standard. Le certificat managé gratuit est entièrement géré par App Service et n'est pas exportable.
references:
  - title: "Secure Your Domain with TLS/SSL"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings
  - title: "Install a TLS/SSL Certificate for Your App"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate
