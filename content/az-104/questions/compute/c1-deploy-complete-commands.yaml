id: c1-deploy-complete-commands
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Bicep file named **main.bicep** that defines all the resources that must exist in a resource group named **RG1**. RG1 also contains resources that are not defined in main.bicep. The Azure CLI, Azure PowerShell and the Bicep CLI are installed on your computer.

    You need to deploy main.bicep so that the resources of RG1 that are not defined in the file are deleted.

    Which two commands should you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un fichier Bicep nommé **main.bicep** qui définit toutes les ressources qui doivent exister dans un groupe de ressources nommé **RG1**. RG1 contient aussi des ressources qui ne sont pas définies dans main.bicep. Azure CLI, Azure PowerShell et l'interface CLI Bicep sont installés sur votre ordinateur.

    Vous devez déployer main.bicep de sorte que les ressources de RG1 qui ne sont pas définies dans le fichier soient supprimées.

    Quelles sont les deux commandes à exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`az deployment group create --resource-group RG1 --template-file main.bicep --mode Complete`" }
    - { id: b, text: "`New-AzResourceGroupDeployment -ResourceGroupName RG1 -TemplateFile main.bicep -Mode Complete`" }
    - { id: c, text: "`az deployment sub create --location westeurope --template-file main.bicep --mode Complete`" }
    - { id: d, text: "`New-AzResourceGroupDeployment -ResourceGroupName RG1 -TemplateFile main.bicep -Mode Incremental`" }
    - { id: e, text: "`az deployment group what-if --resource-group RG1 --template-file main.bicep --mode Complete`" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: In complete mode, Resource Manager deletes the resources of the target resource group that are not in the template. You set it with `--mode Complete` in the Azure CLI or `-Mode Complete` in Azure PowerShell. Always run what-if first. Note that Microsoft no longer recommends complete mode, which will be gradually deprecated, and deployment stacks are the recommended way to delete resources with Bicep or ARM template deployments.
    fr: "En mode complet, Resource Manager supprime les ressources du groupe de ressources cible qui ne figurent pas dans le modèle. Vous le définissez avec `--mode Complete` dans Azure CLI ou `-Mode Complete` dans Azure PowerShell. Exécutez toujours d'abord l'opération de simulation (what-if). Notez que Microsoft ne recommande plus le mode complet : il sera progressivement déconseillé, et les piles de déploiement sont la méthode recommandée pour supprimer des ressources lors de déploiements Bicep ou de modèles ARM."
  options:
    c: { en: "Subscription-level deployments do not support complete mode, and they do not target RG1.", fr: "Les déploiements au niveau de l'abonnement ne prennent pas en charge le mode complet, et ils ne ciblent pas RG1." }
    d: { en: Incremental mode leaves unchanged the resources that are not in the template., fr: "Le mode incrémentiel laisse intactes les ressources qui ne figurent pas dans le modèle." }
    e: { en: what-if only predicts the deletions; it does not deploy or delete anything., fr: "what-if ne fait que prévoir les suppressions ; elle ne déploie et ne supprime rien." }
references:
  - title: Deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
  - title: Deploy Bicep files with Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-powershell
