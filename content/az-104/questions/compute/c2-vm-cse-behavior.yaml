id: c2-vm-cse-behavior
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a Windows virtual machine named **VM1** for Tailspin Toys. You use the Custom Script Extension to install software on VM1 after deployment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une machine virtuelle Windows nommée **VM1** pour Tailspin Toys. Vous utilisez l'extension Custom Script pour installer des logiciels sur VM1 après le déploiement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A script that runs for more than 90 minutes causes the extension provisioning to fail.
        fr: Un script qui s'exécute pendant plus de 90 minutes fait échouer le provisionnement de l'extension.
    - id: s2
      text:
        en: You can apply two separate instances of the Custom Script Extension to VM1 at the same time, each running a different script.
        fr: Vous pouvez appliquer simultanément deux instances distinctes de l'extension Custom Script à VM1, chacune exécutant un script différent.
    - id: s3
      text:
        en: To run the same script again with the same extension name, you can change the `timestamp` value in the extension settings.
        fr: Pour exécuter à nouveau le même script avec le même nom d'extension, vous pouvez modifier la valeur `timestamp` dans les paramètres de l'extension.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The Custom Script Extension allows a script 90 minutes to run; longer runs fail the provisioning. Only one version of an extension can be applied to a VM, so to run a second script you update the existing extension or remove and reapply it. The handler does not rerun a script when the settings are identical; changing `timestamp` (or another setting) signals an explicit rerun.
    fr: L'extension Custom Script accorde 90 minutes au script ; au-delà, le provisionnement échoue. Une seule version d'une extension peut être appliquée à une machine virtuelle ; pour exécuter un second script, vous mettez à jour l'extension existante ou vous la supprimez puis la réappliquez. Le gestionnaire ne réexécute pas un script si les paramètres sont identiques ; modifier `timestamp` (ou un autre paramètre) indique une réexécution explicite.
references:
  - title: Azure Custom Script Extension for Windows
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-windows
