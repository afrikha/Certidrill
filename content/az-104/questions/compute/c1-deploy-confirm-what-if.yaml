id: c1-deploy-confirm-what-if
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a Bicep file named **main.bicep** to a resource group named **RG1** by using the Azure CLI.

    You need to preview the changes that the deployment will make and be prompted to confirm before the deployment starts. The solution must use a single command.

    Which command should you run?
  fr: |
    Vous prévoyez de déployer un fichier Bicep nommé **main.bicep** dans un groupe de ressources nommé **RG1** avec Azure CLI.

    Vous devez afficher un aperçu des modifications que le déploiement effectuera et être invité à confirmer avant le début du déploiement. La solution doit utiliser une seule commande.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`az deployment group create --resource-group RG1 --template-file main.bicep --confirm-with-what-if`" }
    - { id: b, text: "`az deployment group what-if --resource-group RG1 --template-file main.bicep`" }
    - { id: c, text: "`az deployment group validate --resource-group RG1 --template-file main.bicep`" }
    - { id: d, text: "`az deployment group create --resource-group RG1 --template-file main.bicep --mode Incremental`" }
answer: { optionId: a }
explanation:
  correct:
    en: "The `--confirm-with-what-if` switch (short form `-c`) of `az deployment group create` runs the what-if operation, displays the predicted changes and asks you to confirm before it continues with the deployment."
    fr: "Le commutateur `--confirm-with-what-if` (forme courte `-c`) de `az deployment group create` exécute l'opération de simulation (what-if), affiche les modifications prévues et vous demande de confirmer avant de poursuivre le déploiement."
  options:
    b: { en: "what-if only previews the changes; it never deploys, so a second command would be needed.", fr: "what-if ne fait qu'afficher un aperçu des modifications ; elle ne déploie jamais, il faudrait donc une seconde commande." }
    c: { en: validate checks that the template is valid but neither lists the changes nor deploys., fr: "validate vérifie que le modèle est valide, mais n'énumère pas les modifications et ne déploie pas." }
    d: { en: Incremental is the default mode; the command deploys immediately without a preview., fr: "Incremental est le mode par défaut ; la commande déploie immédiatement, sans aperçu." }
references:
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
  - title: Template deployment what-if
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if
