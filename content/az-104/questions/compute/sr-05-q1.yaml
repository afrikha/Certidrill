series: sr-05-zone-resilience
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You deploy the three virtual machines to an availability set.
  fr: |
    Vous déployez les trois machines virtuelles dans un groupe à haute disponibilité.
body:
  solution:
    en: |
      You create an availability set with **3 fault domains** and **5 update domains**, and you deploy the three virtual machines to it.
    fr: |
      Vous créez un groupe à haute disponibilité avec **3 domaines d'erreur** et **5 domaines de mise à jour**, et vous y déployez les trois machines virtuelles.
answer: { value: false }
explanation:
  correct:
    en: |
      An availability set spreads the virtual machines across fault domains (separate power sources and network switches) and update domains, which protects against hardware failures and planned maintenance. The virtual machines remain in close physical proximity and stay exposed to datacenter-level failures, so App1 isn't protected against the loss of an availability zone.
    fr: |
      Un groupe à haute disponibilité répartit les machines virtuelles entre des domaines d'erreur (sources d'alimentation et commutateurs réseau distincts) et des domaines de mise à jour, ce qui protège contre les pannes matérielles et la maintenance planifiée. Les machines virtuelles restent physiquement proches et exposées aux défaillances au niveau du centre de données : App1 n'est pas protégée contre la perte d'une zone de disponibilité.
references:
  - title: "Availability sets overview"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
