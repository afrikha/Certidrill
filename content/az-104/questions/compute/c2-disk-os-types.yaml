id: c2-disk-os-types
objective: "3.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a new production virtual machine named **VM10** in a region that supports all managed disk types.

    Which two disk types can you use for the OS disk of VM10? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer une nouvelle machine virtuelle de production nommée **VM10** dans une région qui prend en charge tous les types de disques managés.

    Quels sont les deux types de disques que vous pouvez utiliser pour le disque du système d'exploitation de VM10 ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: Premium SSD, fr: SSD Premium } }
    - { id: b, text: { en: Standard SSD, fr: SSD Standard } }
    - { id: c, text: { en: Premium SSD v2, fr: SSD Premium v2 } }
    - { id: d, text: { en: Ultra Disk, fr: Disque Ultra } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Premium SSD and Standard SSD can be used as OS disks. Ultra Disks and Premium SSD v2 disks can only be used as data disks; Microsoft recommends a Premium SSD OS disk when you attach them.
    fr: Les SSD Premium et SSD Standard peuvent servir de disques du système d'exploitation. Les disques Ultra et SSD Premium v2 ne peuvent être utilisés que comme disques de données ; Microsoft recommande un disque du système d'exploitation SSD Premium lorsque vous les attachez.
  options:
    c: { en: Premium SSD v2 can't be used as an OS disk., fr: Le SSD Premium v2 ne peut pas servir de disque du système d'exploitation. }
    d: { en: Ultra Disks must be used as data disks., fr: Les disques Ultra doivent être utilisés comme disques de données. }
references:
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
