id: c4-net-feature-match
objective: "3.4.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-adatum** that runs on an App Service plan in the Premium v3 tier in the West Europe region. You have a virtual network named **VNet1** in West Europe.

    You need to meet the following networking requirements. Each requirement must be met by using a single App Service networking feature.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application web nommée **app-adatum** qui s'exécute sur un plan App Service de niveau Premium v3 dans la région West Europe. Vous disposez d'un réseau virtuel nommé **VNet1** dans West Europe.

    Vous devez répondre aux exigences réseau suivantes. Chaque exigence doit être satisfaite à l'aide d'une seule fonctionnalité réseau d'App Service.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hybrid, text: { en: "Hybrid Connections", fr: "Connexions hybrides" } }
    - { id: vnetint, text: { en: "Virtual network integration", fr: "Intégration au réseau virtuel" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: ar, text: { en: "Access restrictions", fr: "Restrictions d'accès" } }
    - { id: aaa, text: { en: App-assigned address, fr: "Adresse attribuée à l'application (App-assigned address)" } }
  targets:
    - id: onprem
      text:
        en: Call a SQL Server instance on TCP port 1433 in a branch office that has no VPN or ExpressRoute connection to Azure.
        fr: Appeler une instance SQL Server sur le port TCP 1433 dans une succursale qui n'a aucune connexion VPN ni ExpressRoute vers Azure.
    - id: vm
      text:
        en: Call an API hosted on a VM that has only a private IP address in VNet1.
        fr: Appeler une API hébergée sur une machine virtuelle qui n'a qu'une adresse IP privée dans VNet1.
    - id: private
      text:
        en: Let clients in VNet1 reach app-adatum on a private IP address from VNet1.
        fr: Permettre aux clients de VNet1 d'atteindre app-adatum sur une adresse IP privée de VNet1.
    - id: ip
      text:
        en: Accept inbound requests only from the public IP range 203.0.113.0/24.
        fr: N'accepter les requêtes entrantes que depuis la plage d'adresses IP publiques 203.0.113.0/24.
answer:
  mapping: { onprem: hybrid, vm: vnetint, private: pe, ip: ar }
explanation:
  correct:
    en: |
      Hybrid Connections lets the app make outbound calls to a single TCP host and port through Azure Relay, without a VPN. Virtual network integration lets the app make outbound calls into a virtual network. A private endpoint exposes the app on a private IP address for inbound traffic. Access restrictions filter inbound requests by IP range, service tag or subnet.
    fr: |
      Les connexions hybrides permettent à l'application d'effectuer des appels sortants vers un seul hôte et port TCP via Azure Relay, sans VPN. L'intégration au réseau virtuel permet à l'application d'effectuer des appels sortants dans un réseau virtuel. Un point de terminaison privé expose l'application sur une adresse IP privée pour le trafic entrant. Les restrictions d'accès filtrent les requêtes entrantes par plage d'adresses IP, étiquette de service ou sous-réseau.
  options:
    aaa:
      en: |
        An app-assigned address gives the app a dedicated public inbound IP address (IP-based SSL); it doesn't meet any of the requirements.
      fr: |
        Une adresse attribuée à l'application lui donne une adresse IP publique entrante dédiée (SSL basé sur IP) ; elle ne répond à aucune des exigences.
references:
  - title: "Networking Features"
    url: https://learn.microsoft.com/en-us/azure/app-service/networking-features
