id: c1-arm-copyindex-names
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have the following Azure Resource Manager (ARM) template.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {
        "nsgCount": {
          "type": "int",
          "defaultValue": 3
        }
      },
      "resources": [
        {
          "type": "Microsoft.Network/networkSecurityGroups",
          "apiVersion": "2023-09-01",
          "name": "[format('nsg-app-{0}', copyIndex(1))]",
          "location": "[resourceGroup().location]",
          "copy": {
            "name": "nsgLoop",
            "count": "[parameters('nsgCount')]"
          }
        }
      ]
    }
    ```

    You deploy the template to a resource group named **RG1** without providing any parameter value.

    Which network security groups are created?
  fr: |
    Vous disposez du modèle Azure Resource Manager (ARM) suivant.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {
        "nsgCount": {
          "type": "int",
          "defaultValue": 3
        }
      },
      "resources": [
        {
          "type": "Microsoft.Network/networkSecurityGroups",
          "apiVersion": "2023-09-01",
          "name": "[format('nsg-app-{0}', copyIndex(1))]",
          "location": "[resourceGroup().location]",
          "copy": {
            "name": "nsgLoop",
            "count": "[parameters('nsgCount')]"
          }
        }
      ]
    }
    ```

    Vous déployez le modèle dans un groupe de ressources nommé **RG1** sans fournir de valeur de paramètre.

    Quels groupes de sécurité réseau sont créés ?
body:
  options:
    - { id: a, text: "nsg-app-1, nsg-app-2, nsg-app-3" }
    - { id: b, text: "nsg-app-0, nsg-app-1, nsg-app-2" }
    - { id: c, text: "nsg-app-1, nsg-app-2, nsg-app-3, nsg-app-4" }
    - { id: d, text: "nsg-app-0, nsg-app-1, nsg-app-2, nsg-app-3" }
answer: { optionId: a }
explanation:
  correct:
    en: The copy loop runs `count` times, here 3 (the default value of `nsgCount`). `copyIndex()` is zero-based, but passing an offset of 1 shifts the value, so the iterations return 1, 2 and 3 while the number of iterations stays 3.
    fr: "La boucle de copie s'exécute `count` fois, ici 3 (la valeur par défaut de `nsgCount`). `copyIndex()` est basé sur zéro, mais le décalage de 1 passé en argument déplace la valeur : les itérations renvoient 1, 2 et 3, et le nombre d'itérations reste 3."
  options:
    b: { en: These names would be produced by copyIndex() without an offset., fr: Ces noms seraient produits par copyIndex() sans décalage. }
    c: { en: The offset changes the index value, not the number of iterations; count stays 3., fr: "Le décalage modifie la valeur de l'index, pas le nombre d'itérations : count reste 3." }
    d: { en: The loop creates three instances, not four, and the offset starts the index at 1., fr: "La boucle crée trois instances, pas quatre, et le décalage fait commencer l'index à 1." }
references:
  - title: Deploy multiple instances of resources
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/copy-resources
