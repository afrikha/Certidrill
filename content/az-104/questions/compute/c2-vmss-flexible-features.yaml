id: c2-vmss-flexible-features
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to deploy a Virtual Machine Scale Set named **VMSS3** and must choose its orchestration mode.

    Which two requirements can be met only by the Flexible orchestration mode? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déployer un groupe de machines virtuelles identiques nommé **VMSS3** et doit choisir son mode d'orchestration.

    Quelles sont les deux exigences qui ne peuvent être satisfaites que par le mode d'orchestration Flexible ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Linux and Windows instances in the same scale set.", fr: "Exécuter des instances Linux et Windows dans le même groupe identique." } }
    - { id: b, text: { en: "Add an existing standalone VM to the scale set.", fr: "Ajouter une machine virtuelle autonome existante au groupe identique." } }
    - { id: c, text: { en: "Use image-based automatic OS upgrades.", fr: "Utiliser les mises à niveau automatiques du système d'exploitation basées sur une image." } }
    - { id: d, text: { en: "Scale out automatically based on CPU metrics.", fr: "Effectuer un scale-out automatique en fonction des métriques du processeur." } }
    - { id: e, text: { en: "Use the scale set in a Service Fabric cluster.", fr: "Utiliser le groupe identique dans un cluster Service Fabric." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Flexible orchestration manages standard Azure VMs, so Linux and Windows instances can coexist in the same scale set and existing VMs can be added to it. With Uniform orchestration, all instances use the same OS from the scale set model and existing VMs can't be added.
    fr: L'orchestration Flexible gère des machines virtuelles Azure standard ; des instances Linux et Windows peuvent donc coexister dans le même groupe identique et des machines virtuelles existantes peuvent y être ajoutées. Avec l'orchestration Uniforme, toutes les instances utilisent le même système d'exploitation défini par le modèle et les machines existantes ne peuvent pas être ajoutées.
  options:
    c:
      en: "In the orchestration modes comparison, automatic OS image upgrades are supported with Uniform orchestration and not with Flexible, so this isn't a Flexible-only capability."
      fr: "Dans la comparaison des modes d'orchestration, les mises à niveau automatiques de l'image du système d'exploitation sont prises en charge avec l'orchestration Uniforme et pas avec Flexible ; ce n'est donc pas une capacité propre à Flexible."
    d:
      en: Metrics-based autoscale is supported by both orchestration modes.
      fr: La mise à l'échelle automatique basée sur les métriques est prise en charge par les deux modes d'orchestration.
    e:
      en: Service Fabric requires Uniform orchestration.
      fr: Service Fabric nécessite l'orchestration Uniforme.
references:
  - title: Orchestration modes for Virtual Machine Scale Sets in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes
