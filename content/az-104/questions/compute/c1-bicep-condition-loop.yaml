id: c1-bicep-condition-loop
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the following Bicep file named **network.bicep**.

    ```bicep
    param environment string = 'dev'
    param subnetNames array = [
      'web'
      'app'
    ]

    var isProd = environment == 'prod'

    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-${environment}'
      location: resourceGroup().location
      properties: {
        addressSpace: {
          addressPrefixes: [
            '10.20.0.0/16'
          ]
        }
        subnets: [for (name, i) in subnetNames: {
          name: 'snet-${name}'
          properties: {
            addressPrefix: '10.20.${i}.0/24'
          }
        }]
      }
    }

    resource bastionPip 'Microsoft.Network/publicIPAddresses@2023-09-01' = if (isProd) {
      name: 'pip-bastion-${environment}'
      location: resourceGroup().location
      sku: {
        name: 'Standard'
      }
      properties: {
        publicIPAllocationMethod: 'Static'
      }
    }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous disposez du fichier Bicep suivant, nommé **network.bicep**.

    ```bicep
    param environment string = 'dev'
    param subnetNames array = [
      'web'
      'app'
    ]

    var isProd = environment == 'prod'

    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-${environment}'
      location: resourceGroup().location
      properties: {
        addressSpace: {
          addressPrefixes: [
            '10.20.0.0/16'
          ]
        }
        subnets: [for (name, i) in subnetNames: {
          name: 'snet-${name}'
          properties: {
            addressPrefix: '10.20.${i}.0/24'
          }
        }]
      }
    }

    resource bastionPip 'Microsoft.Network/publicIPAddresses@2023-09-01' = if (isProd) {
      name: 'pip-bastion-${environment}'
      location: resourceGroup().location
      sku: {
        name: 'Standard'
      }
      properties: {
        publicIPAllocationMethod: 'Static'
      }
    }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: If you deploy the file with the default parameter values, a public IP address named pip-bastion-dev is created.
        fr: Si vous déployez le fichier avec les valeurs de paramètres par défaut, une adresse IP publique nommée pip-bastion-dev est créée.
    - id: s2
      text:
        en: If you deploy the file with the default parameter values, the subnet named snet-app uses the address prefix 10.20.1.0/24.
        fr: Si vous déployez le fichier avec les valeurs de paramètres par défaut, le sous-réseau nommé snet-app utilise le préfixe d'adresse 10.20.1.0/24.
    - id: s3
      text:
        en: If you deploy the file with environment set to prod, a virtual network named vnet-prod and a public IP address are created.
        fr: Si vous déployez le fichier avec environment défini sur prod, un réseau virtuel nommé vnet-prod et une adresse IP publique sont créés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The public IP address is declared with `if (isProd)`, so it is only deployed when environment is prod; with the default value dev it is skipped. The subnet loop uses the zero-based index `i`, so web gets 10.20.0.0/24 and app gets 10.20.1.0/24. With environment set to prod, the name becomes vnet-prod and the condition is true, so the public IP address is also deployed.
    fr: "L'adresse IP publique est déclarée avec `if (isProd)` : elle n'est déployée que lorsque environment vaut prod ; avec la valeur par défaut dev, elle est ignorée. La boucle des sous-réseaux utilise l'index `i` basé sur zéro : web reçoit 10.20.0.0/24 et app reçoit 10.20.1.0/24. Avec environment défini sur prod, le nom devient vnet-prod et la condition est vraie, donc l'adresse IP publique est également déployée."
references:
  - title: Conditional deployments in Bicep with the if expression
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/conditional-resource-deployment
  - title: Iterative loops in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/loops
