id: cs2-wingtip-02
objective: "3.3.4"
type: dropdown
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to configure scaling for ca-orders-worker. The solution must meet the technical requirements.

    How should you complete the command? To answer, select the appropriate options in the answer area.
  fr: |
    Vous devez configurer la mise à l'échelle de ca-orders-worker. La solution doit respecter les exigences techniques.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az containerapp update \
      --name ca-orders-worker \
      --resource-group RG-Shop \
      --min-replicas [[min]] \
      --max-replicas 10 \
      --scale-rule-name orders-queue \
      --scale-rule-type [[type]] \
      --scale-rule-metadata "queueName=orders" "namespace=sb-wingtip" "messageCount=20" \
      --scale-rule-auth "connection=sb-connection"
  slots:
    - id: min
      options:
        - { id: m0, text: "0" }
        - { id: m1, text: "1" }
        - { id: m2, text: "2" }
    - id: type
      options:
        - { id: http, text: "http" }
        - { id: sb, text: "azure-servicebus" }
        - { id: cpu, text: "cpu" }
answer:
  values: { min: m0, type: sb }
explanation:
  correct:
    en: |
      With a minimum of 0 replicas, the app scales to zero when the queue is empty and incurs no usage charges. The azure-servicebus custom scale rule (a KEDA scaler) adds replicas based on the number of messages in the orders queue.
    fr: |
      Avec un minimum de 0 réplica, l'application descend à zéro quand la file d'attente est vide et n'entraîne aucun frais d'utilisation. La règle de mise à l'échelle personnalisée azure-servicebus (un scaler KEDA) ajoute des réplicas en fonction du nombre de messages de la file orders.
  options:
    m1: { en: "One replica would always run and be billed, even when the queue is empty.", fr: "Un réplica s'exécuterait en permanence et serait facturé, même quand la file est vide." }
    http: { en: "ca-orders-worker has no ingress and receives no HTTP requests.", fr: "ca-orders-worker n'a pas d'entrée et ne reçoit aucune requête HTTP." }
    cpu: { en: "A CPU rule does not follow the queue length and cannot scale the app to zero.", fr: "Une règle d'UC ne suit pas la longueur de la file et ne peut pas descendre l'application à zéro." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
