id: c4-tls-wildcard-cert
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-fabrikam** that runs on an App Service plan in the Standard S1 tier. The app is mapped to the wildcard custom domain **\*.fabrikam.com**, and new subdomains are added every month.

    You need to secure all current and future subdomains with a single TLS/SSL certificate that Azure renews for you. You do not have a certificate from a third-party certificate authority.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-fabrikam** qui s'exécute sur un plan App Service de niveau Standard S1. L'application est mappée au domaine personnalisé générique **\*.fabrikam.com**, et de nouveaux sous-domaines sont ajoutés chaque mois.

    Vous devez sécuriser tous les sous-domaines actuels et futurs avec un seul certificat TLS/SSL renouvelé par Azure. Vous ne disposez d'aucun certificat d'une autorité de certification tierce.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Buy a wildcard App Service certificate, then import it into app-fabrikam and bind it.
        fr: Acheter un certificat App Service générique (wildcard), puis l'importer dans app-fabrikam et le lier.
    - id: b
      text:
        en: Create a free App Service managed certificate for \*.fabrikam.com and bind it.
        fr: Créer un certificat managé App Service gratuit pour \*.fabrikam.com et le lier.
    - id: c
      text:
        en: Upload a public certificate (.cer) for fabrikam.com to app-fabrikam.
        fr: Charger un certificat public (.cer) pour fabrikam.com dans app-fabrikam.
    - id: d
      text:
        en: Turn on HTTPS Only and set the minimum TLS version to 1.2.
        fr: Activer HTTPS uniquement et définir la version TLS minimale sur 1.2.
answer: { optionId: a }
explanation:
  correct:
    en: |
      An App Service certificate is a private certificate that Azure issues, stores in Key Vault and can renew automatically, and it is available as a wildcard certificate. After you import it into the app, you bind it to the custom domain.
    fr: |
      Un certificat App Service est un certificat privé émis par Azure, stocké dans Key Vault et pouvant être renouvelé automatiquement ; il est disponible en version générique (wildcard). Après l'avoir importé dans l'application, vous le liez au domaine personnalisé.
  options:
    b:
      en: |
        The free App Service managed certificate doesn't support wildcard certificates.
      fr: |
        Le certificat managé App Service gratuit ne prend pas en charge les certificats génériques.
    c:
      en: |
        Public certificates are used by app code to call remote resources; they can't secure a custom domain.
      fr: |
        Les certificats publics sont utilisés par le code de l'application pour appeler des ressources distantes ; ils ne peuvent pas sécuriser un domaine personnalisé.
    d:
      en: |
        These settings enforce HTTPS and the protocol version, but a certificate binding is still needed for the custom domain.
      fr: |
        Ces paramètres imposent HTTPS et la version du protocole, mais une liaison de certificat reste nécessaire pour le domaine personnalisé.
references:
  - title: "Install a TLS/SSL Certificate for Your App"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate
