id: c3-aca-traffic-split-cli
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a container app named **ca-store** with external ingress enabled. The app uses the default revision mode. Two revisions exist: **ca-store--v1**, which currently serves all traffic, and **ca-store--v2**, which was just deployed.

    You need to send 90 percent of the traffic to ca-store--v1 and 10 percent to ca-store--v2 so that both revisions stay active at the same time.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.
  fr: |
    Northwind dispose d'une application conteneur nommée **ca-store** dont l'entrée externe est activée. L'application utilise le mode de révision par défaut. Deux révisions existent : **ca-store--v1**, qui reçoit actuellement tout le trafic, et **ca-store--v2**, qui vient d'être déployée.

    Vous devez envoyer 90 % du trafic vers ca-store--v1 et 10 % vers ca-store--v2, afin que les deux révisions restent actives en même temps.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az containerapp revision set-mode \
      --name ca-store --resource-group rg-store \
      --mode [[mode]]

    az containerapp [[cmd]] \
      --name ca-store --resource-group rg-store \
      [[weight]] ca-store--v1=90 ca-store--v2=10
  slots:
    - id: mode
      options:
        - { id: multiple, text: multiple }
        - { id: single, text: single }
        - { id: latest, text: latest }
    - id: cmd
      options:
        - { id: traffic, text: ingress traffic set }
        - { id: activate, text: revision activate }
        - { id: update, text: update }
        - { id: enable, text: ingress enable }
    - id: weight
      options:
        - { id: revweight, text: "--revision-weight" }
        - { id: labelweight, text: "--label-weight" }
        - { id: percent, text: "--percentage" }
        - { id: split, text: "--split" }
answer:
  values: { mode: multiple, cmd: traffic, weight: revweight }
explanation:
  correct:
    en: "Single revision mode, the default, keeps only one active revision. To split traffic, you first switch the app to multiple revision mode, then run `az containerapp ingress traffic set` and give the weights by revision name with `--revision-weight`. The weights must add up to 100."
    fr: "Le mode de révision unique, utilisé par défaut, ne conserve qu'une seule révision active. Pour fractionner le trafic, vous passez d'abord l'application en mode de révisions multiples, puis vous exécutez `az containerapp ingress traffic set` en indiquant les poids par nom de révision avec `--revision-weight`. La somme des poids doit être égale à 100."
  options:
    single: { en: In single revision mode, traffic moves entirely to the new revision once it is ready., fr: "En mode de révision unique, le trafic bascule entièrement vers la nouvelle révision dès qu'elle est prête." }
    activate: { en: Activating a revision does not assign it a share of the traffic., fr: L'activation d'une révision ne lui attribue pas de part du trafic. }
    update: { en: "`az containerapp update` changes the template and creates a revision; it does not set traffic weights.", fr: "`az containerapp update` modifie le modèle et crée une révision ; il ne définit pas les poids du trafic." }
    labelweight: { en: "`--label-weight` expects revision labels; the command uses revision names.", fr: "`--label-weight` attend des étiquettes de révision ; la commande utilise des noms de révision." }
references:
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
