id: c2-size-resize-effects
objective: "3.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a running virtual machine named **VM9** that has managed OS and data disks and a temporary disk. You plan to change the size of VM9.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle en cours d'exécution nommée **VM9** qui possède des disques managés du système d'exploitation et de données ainsi qu'un disque temporaire. Vous prévoyez de changer la taille de VM9.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the new size is available on the current hardware cluster, you can resize VM9 without restarting it.
        fr: Si la nouvelle taille est disponible sur le cluster matériel actuel, vous pouvez redimensionner VM9 sans la redémarrer.
    - id: s2
      text:
        en: If you deallocate VM9 before the resize, the data on its temporary disk is lost.
        fr: Si vous libérez VM9 avant le redimensionnement, les données de son disque temporaire sont perdues.
    - id: s3
      text:
        en: Deallocating VM9 deletes the data on its OS disk and data disks.
        fr: La libération de VM9 supprime les données de ses disques du système d'exploitation et de données.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Changing the size of a running VM always restarts it, even when deallocation is not required, so resizing is a disruptive operation. Deallocation moves the VM off its host, so the content of the temporary disk (which is local to the host) is lost, while the OS and data disks, which are managed disks, are not affected.
    fr: "Changer la taille d'une machine virtuelle en cours d'exécution la redémarre toujours, même lorsque la libération n'est pas nécessaire ; le redimensionnement est donc une opération perturbatrice. La libération retire la machine de son hôte : le contenu du disque temporaire (local à l'hôte) est perdu, tandis que les disques du système d'exploitation et de données, qui sont des disques managés, ne sont pas affectés."
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
  - title: "States and billing status"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
