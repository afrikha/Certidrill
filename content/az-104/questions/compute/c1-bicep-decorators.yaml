id: c1-bicep-decorators
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are modifying the parameters of an existing Bicep file.

    The file must meet the following requirements:

    - The value of **sqlAdminPassword** must not be logged or displayed.
    - **storageAccountName** must contain between 3 and 24 characters.
    - **environment** can only be set to dev or prod.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez les paramètres d'un fichier Bicep existant.

    Le fichier doit répondre aux exigences suivantes :

    - la valeur de **sqlAdminPassword** ne doit être ni journalisée ni affichée ;
    - **storageAccountName** doit contenir entre 3 et 24 caractères ;
    - **environment** ne peut être défini que sur dev ou prod.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    [[secure]]
    param sqlAdminPassword string

    [[minDec]](3)
    @maxLength(24)
    param storageAccountName string

    [[allowedDec]]([
      'dev'
      'prod'
    ])
    param environment string = 'dev'
  slots:
    - id: secure
      options:
        - { id: secure, text: "@secure()" }
        - { id: sealed, text: "@sealed()" }
        - { id: desc, text: "@description('secret')" }
        - { id: export, text: "@export()" }
    - id: minDec
      options:
        - { id: minLength, text: "@minLength" }
        - { id: minValue, text: "@minValue" }
        - { id: length, text: "@length" }
        - { id: min, text: "@min" }
    - id: allowedDec
      options:
        - { id: allowed, text: "@allowed" }
        - { id: allowedValues, text: "@allowedValues" }
        - { id: enum, text: "@enum" }
        - { id: values, text: "@values" }
answer:
  values: { secure: secure, minDec: minLength, allowedDec: allowed }
explanation:
  correct:
    en: "`@secure()` marks a string or object parameter as secure, so its value is not logged or saved in the deployment history. `@minLength()` and `@maxLength()` limit the length of strings and arrays. `@allowed()` restricts the parameter to a list of values."
    fr: "`@secure()` marque un paramètre de type chaîne ou objet comme sécurisé : sa valeur n'est ni journalisée ni enregistrée dans l'historique de déploiement. `@minLength()` et `@maxLength()` limitent la longueur des chaînes et des tableaux. `@allowed()` limite le paramètre à une liste de valeurs."
  options:
    sealed: { en: "@sealed() applies to object types, not to secrets.", fr: "@sealed() s'applique aux types objet, pas aux secrets." }
    desc: { en: "@description() only documents the parameter.", fr: "@description() ne fait que documenter le paramètre." }
    minValue: { en: "@minValue() applies to integers, not to string length.", fr: "@minValue() s'applique aux entiers, pas à la longueur des chaînes." }
    allowedValues: { en: allowedValues is the ARM JSON property; the Bicep decorator is @allowed()., fr: "allowedValues est la propriété ARM JSON ; le décorateur Bicep est @allowed()." }
references:
  - title: Parameters in Bicep files
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters
