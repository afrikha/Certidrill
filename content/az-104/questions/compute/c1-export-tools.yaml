id: c1-export-tools
objective: "3.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage a resource group named **RG1** for Adatum Corporation. You have several template tasks to perform by using the Azure CLI.

    Which command should you use for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un groupe de ressources nommé **RG1** pour Adatum Corporation. Vous avez plusieurs tâches liées aux modèles à effectuer avec Azure CLI.

    Quelle commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: depexport, text: az deployment group export }
    - { id: grpexport, text: az group export --resource-ids }
    - { id: decompile, text: az bicep decompile }
    - { id: build, text: az bicep build }
    - { id: format, text: az bicep format }
    - { id: whatif, text: az deployment group what-if }
  targets:
    - id: t1
      text: { en: "Retrieve the exact template that was used by a deployment named deploy-web in RG1", fr: "Récupérer le modèle exact utilisé par un déploiement nommé deploy-web dans RG1" }
    - id: t2
      text: { en: "Generate a template from two specific resources of RG1 that includes changes made in the portal", fr: "Générer un modèle à partir de deux ressources précises de RG1 qui inclut les modifications faites dans le portail" }
    - id: t3
      text: { en: "Convert an ARM JSON template to a Bicep file", fr: "Convertir un modèle ARM JSON en fichier Bicep" }
    - id: t4
      text: { en: "Convert a Bicep file to an ARM JSON template", fr: "Convertir un fichier Bicep en modèle ARM JSON" }
answer:
  mapping: { t1: depexport, t2: grpexport, t3: decompile, t4: build }
explanation:
  correct:
    en: "`az deployment group export` saves the template of a deployment from the deployment history, exactly as it was deployed. `az group export` with `--resource-ids` generates a template from the current state of the selected resources. `az bicep decompile` converts JSON to Bicep, and `az bicep build` compiles Bicep to JSON."
    fr: "`az deployment group export` enregistre le modèle d'un déploiement depuis l'historique de déploiement, tel qu'il a été déployé. `az group export` avec `--resource-ids` génère un modèle à partir de l'état actuel des ressources sélectionnées. `az bicep decompile` convertit du JSON en Bicep, et `az bicep build` compile du Bicep en JSON."
  options:
    format: { en: format only reformats a Bicep file., fr: "format ne fait que remettre en forme un fichier Bicep." }
    whatif: { en: what-if previews the changes of a deployment; it does not produce a template., fr: "what-if affiche un aperçu des modifications d'un déploiement ; elle ne produit pas de modèle." }
references:
  - title: Export template in Azure CLI
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-cli
  - title: Bicep CLI commands
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-cli
