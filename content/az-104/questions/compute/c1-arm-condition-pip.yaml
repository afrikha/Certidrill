id: c1-arm-condition-pip
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an ARM template that deploys a virtual machine and a public IP address. You add the following parameter to the template.

    ```json
    "deployPublicIp": {
      "type": "bool",
      "defaultValue": false
    }
    ```

    You need to modify the template so that the public IP address is deployed only when **deployPublicIp** is true.

    What should you add to the public IP address resource definition?
  fr: |
    Vous disposez d'un modèle ARM qui déploie une machine virtuelle et une adresse IP publique. Vous ajoutez le paramètre suivant au modèle.

    ```json
    "deployPublicIp": {
      "type": "bool",
      "defaultValue": false
    }
    ```

    Vous devez modifier le modèle pour que l'adresse IP publique ne soit déployée que lorsque **deployPublicIp** a la valeur true.

    Que devez-vous ajouter à la définition de ressource de l'adresse IP publique ?
body:
  options:
    - id: a
      text: |-
        `"condition": "[parameters('deployPublicIp')]"`
    - id: b
      text: |-
        `"dependsOn": [ "[parameters('deployPublicIp')]" ]`
    - id: c
      text: |-
        `"if": "[parameters('deployPublicIp')]"`
    - id: d
      text: |-
        `"copy": { "name": "pipLoop", "count": "[parameters('deployPublicIp')]" }`
answer: { optionId: a }
explanation:
  correct:
    en: The `condition` element takes a value that resolves to true or false. When it is false, Resource Manager skips the resource during the deployment.
    fr: "L'élément `condition` reçoit une valeur qui est résolue en true ou false. Lorsqu'elle est false, Resource Manager ignore la ressource pendant le déploiement."
  options:
    b: { en: dependsOn sets the deployment order between resources; it does not decide whether a resource is deployed., fr: "dependsOn définit l'ordre de déploiement entre les ressources ; il ne décide pas si une ressource est déployée." }
    c: { en: ARM JSON has no if element; if() is a function and the Bicep keyword., fr: "ARM JSON n'a pas d'élément if ; if() est une fonction, et le mot clé Bicep." }
    d: { en: count expects an integer, not a boolean., fr: "count attend un entier, pas une valeur booléenne." }
references:
  - title: Conditional deployment with templates
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/conditional-resource-deployment
