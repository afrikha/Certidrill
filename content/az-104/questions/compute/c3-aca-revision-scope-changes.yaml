id: c3-aca-revision-scope-changes
objective: "3.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has a container app named **ca-orders** in multiple revision mode. You plan to make four changes to ca-orders.

    You need to identify which changes create a new revision.

    What is the effect of each change? To answer, drag the appropriate effects to the correct changes. Each effect may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une application conteneur nommée **ca-orders** en mode de révisions multiples. Vous prévoyez d'apporter quatre modifications à ca-orders.

    Vous devez identifier les modifications qui créent une nouvelle révision.

    Quel est l'effet de chaque modification ? Pour répondre, faites glisser les effets appropriés vers les modifications correspondantes. Chaque effet peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: newrev
      text: { en: "Creates a new revision", fr: "Crée une nouvelle révision" }
    - id: allrev
      text: { en: Applies to all revisions without creating a new revision, fr: "S'applique à toutes les révisions sans créer de nouvelle révision" }
    - id: newenv
      text: { en: "Requires redeploying the app to a new environment", fr: "Exige de redéployer l'application dans un nouvel environnement" }
    - id: deact
      text: { en: "Creates a new revision and deactivates all the other revisions", fr: "Crée une nouvelle révision et désactive toutes les autres révisions" }
  targets:
    - id: image
      text: { en: "Change the container image tag from 1.4 to 1.5", fr: "Changer la balise de l'image conteneur de 1.4 à 1.5" }
    - id: secret
      text: { en: Update the value of a secret used by the app, fr: "Mettre à jour la valeur d'un secret utilisé par l'application" }
    - id: scale
      text: { en: "Add a custom scale rule based on an Azure Service Bus queue", fr: "Ajouter une règle de mise à l'échelle personnalisée basée sur une file d'attente Azure Service Bus" }
    - id: traffic
      text: { en: "Change the traffic split between two active revisions", fr: "Modifier le fractionnement du trafic entre deux révisions actives" }
answer:
  mapping: { image: newrev, secret: allrev, scale: newrev, traffic: allrev }
explanation:
  correct:
    en: Revision-scope changes are changes to the `properties.template` section, such as container images and configuration or scale rules; they create a new revision. Application-scope changes are changes to `properties.configuration`, such as secret values, the revision mode, ingress and traffic splitting rules; they apply to all revisions and do not create one. None of these changes requires a new environment, and in multiple revision mode a new revision does not deactivate the existing ones.
    fr: "Les modifications de niveau révision concernent la section `properties.template`, par exemple les images et la configuration des conteneurs ou les règles de mise à l'échelle ; elles créent une nouvelle révision. Les modifications de niveau application concernent `properties.configuration`, par exemple les valeurs des secrets, le mode de révision, l'entrée et les règles de fractionnement du trafic ; elles s'appliquent à toutes les révisions et n'en créent pas. Aucune de ces modifications n'exige un nouvel environnement et, en mode de révisions multiples, une nouvelle révision ne désactive pas les révisions existantes."
  options:
    secret:
      en: A new secret value is applied to all revisions, but running revisions must be restarted before containers read it.
      fr: Une nouvelle valeur de secret s'applique à toutes les révisions, mais les révisions en cours d'exécution doivent être redémarrées pour que les conteneurs la lisent.
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
