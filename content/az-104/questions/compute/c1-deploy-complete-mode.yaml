id: c1-deploy-complete-mode
objective: "3.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A resource group named **RG1** contains the following resources: a virtual network named **vnet1**, a storage account named **stwoodgrove1**, a public IP address named **pip1**, and a network security group named **nsg1**. No lock is applied to RG1 or to its resources.

    You have an ARM template named **main.json** that defines vnet1, stwoodgrove1 and pip1. pip1 has the following element:

    ```json
    "condition": "[parameters('deployPip')]"
    ```

    You run the following command by using the latest version of the Azure CLI.

    ```bash
    az deployment group create \
      --resource-group RG1 \
      --template-file main.json \
      --mode Complete \
      --parameters deployPip=false
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de ressources nommé **RG1** contient les ressources suivantes : un réseau virtuel nommé **vnet1**, un compte de stockage nommé **stwoodgrove1**, une adresse IP publique nommée **pip1** et un groupe de sécurité réseau nommé **nsg1**. Aucun verrou n'est appliqué à RG1 ni à ses ressources.

    Vous disposez d'un modèle ARM nommé **main.json** qui définit vnet1, stwoodgrove1 et pip1. pip1 comporte l'élément suivant :

    ```json
    "condition": "[parameters('deployPip')]"
    ```

    Vous exécutez la commande suivante avec la dernière version d'Azure CLI.

    ```bash
    az deployment group create \
      --resource-group RG1 \
      --template-file main.json \
      --mode Complete \
      --parameters deployPip=false
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: pip1 is deleted from RG1.
        fr: pip1 est supprimée de RG1.
    - id: s2
      text:
        en: If RG1 had a Delete lock (CanNotDelete), nsg1 would still be deleted by the deployment.
        fr: Si RG1 avait un verrou Suppression (CanNotDelete), nsg1 serait quand même supprimé par le déploiement.
    - id: s3
      text:
        en: "You can apply the same complete-mode behavior to a subscription by running `az deployment sub create` with `--mode Complete`."
        fr: "Vous pouvez appliquer le même comportement du mode complet à un abonnement en exécutant `az deployment sub create` avec `--mode Complete`."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: In complete mode, Resource Manager deletes the resources of the resource group that the template does not deploy. With REST API 2019-05-10 or later, which the current Azure CLI uses, a resource whose condition evaluates to false is also deleted, so pip1 is removed (nsg1 too). Complete mode does not delete resources when the resource group is locked, and subscription-level deployments do not support complete mode.
    fr: "En mode complet, Resource Manager supprime les ressources du groupe de ressources que le modèle ne déploie pas. Avec l'API REST 2019-05-10 ou ultérieure, qu'utilise la version actuelle d'Azure CLI, une ressource dont la condition est false est également supprimée : pip1 est donc supprimée (nsg1 aussi). Le mode complet ne supprime pas de ressources lorsque le groupe de ressources est verrouillé, et les déploiements au niveau de l'abonnement ne prennent pas en charge le mode complet."
references:
  - title: Deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
