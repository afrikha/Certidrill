id: c2-disk-expand-data
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows virtual machine named **File1** that has a 512 GiB Premium SSD data disk named **Data1**. The F: volume on Data1 is almost full.

    You need to increase the capacity of the F: volume to 1 TiB. The solution must minimize downtime for File1.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Windows nommée **File1** qui possède un disque de données SSD Premium de 512 Gio nommé **Data1**. Le volume F: de Data1 est presque plein.

    Vous devez augmenter la capacité du volume F: à 1 Tio. La solution doit réduire au minimum le temps d'arrêt de File1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "While File1 is running, increase the size of Data1 to 1,024 GiB, and then extend the F: volume in Disk Management.", fr: "Pendant que File1 s'exécute, augmenter la taille de Data1 à 1 024 Gio, puis étendre le volume F: dans Gestion des disques." }
    - id: b
      text: { en: "Deallocate File1, increase the size of Data1 to 1,024 GiB, and then start File1.", fr: "Libérer File1, augmenter la taille de Data1 à 1 024 Gio, puis démarrer File1." }
    - id: c
      text: { en: "Create a snapshot of Data1, create a 1,024 GiB disk from the snapshot, and replace Data1 with the new disk.", fr: "Créer un instantané de Data1, créer un disque de 1 024 Gio à partir de l'instantané et remplacer Data1 par le nouveau disque." }
    - id: d
      text: { en: "Resize File1 to a larger VM size, and then extend the F: volume.", fr: "Redimensionner File1 vers une taille de machine virtuelle supérieure, puis étendre le volume F:." }
answer: { optionId: a }
explanation:
  correct:
    en: Data disks can be expanded without deallocating the VM, as long as a Standard HDD, Standard SSD or Premium SSD disk does not cross the 4 TiB boundary. After you increase the managed disk size, you must extend the volume inside Windows to use the new space.
    fr: Les disques de données peuvent être étendus sans libérer la machine virtuelle, tant qu'un disque HDD Standard, SSD Standard ou SSD Premium ne franchit pas la limite de 4 Tio. Après avoir augmenté la taille du disque managé, vous devez étendre le volume dans Windows pour utiliser le nouvel espace.
  options:
    b:
      en: Deallocation works but causes unnecessary downtime; it is only required for OS disks or disks that don't meet the expand-without-downtime requirements.
      fr: La libération fonctionne mais entraîne un temps d'arrêt inutile ; elle n'est nécessaire que pour les disques du système d'exploitation ou les disques qui ne remplissent pas les conditions d'extension sans interruption.
    c:
      en: Replacing the disk requires detaching it and adds downtime and effort, while the disk can simply be expanded.
      fr: Remplacer le disque nécessite de le détacher et ajoute du temps d'arrêt et de l'effort, alors que le disque peut simplement être étendu.
    d:
      en: The VM size controls CPU, memory and the number of data disks, not the capacity of an existing disk.
      fr: La taille de la machine virtuelle détermine le processeur, la mémoire et le nombre de disques de données, pas la capacité d'un disque existant.
references:
  - title: "Expand Virtual Hard Disks Attached to a Windows VM in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks
