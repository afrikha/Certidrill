id: c4-scale-autoscale-tiers
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an App Service plan named **plan-proseware** in the Basic B2 tier. The plan hosts a Windows web app.

    You need to configure the plan to scale out and scale in automatically by using Azure Monitor autoscale rules based on CPU percentage and on a weekly schedule.

    To which pricing tiers can you scale up the plan to meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un plan App Service nommé **plan-proseware** au niveau Basic B2. Le plan héberge une application web Windows.

    Vous devez configurer le plan pour qu'il effectue automatiquement un scale-out et un scale-in à l'aide de règles de mise à l'échelle automatique Azure Monitor basées sur le pourcentage de processeur et sur une planification hebdomadaire.

    Vers quels niveaux tarifaires pouvez-vous faire passer le plan pour répondre à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Basic B3 }
    - { id: b, text: Standard S1 }
    - { id: c, text: Premium v3 P1v3 }
    - { id: d, text: Shared D1 }
    - { id: e, text: Free F1 }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |
      Rule-based autoscale (metric and schedule rules from Azure Monitor) requires the Standard tier or higher, so both Standard S1 and Premium v3 P1v3 meet the requirement. Basic supports only manual scale-out.
    fr: |
      La mise à l'échelle automatique basée sur des règles (règles de métrique et de planification d'Azure Monitor) nécessite le niveau Standard ou supérieur : Standard S1 et Premium v3 P1v3 répondent donc tous deux à l'exigence. Basic ne prend en charge que le scale-out manuel.
  options:
    a:
      en: |
        B3 is a larger Basic instance, but the Basic tier only supports manual scale-out to 3 instances.
      fr: |
        B3 est une instance Basic plus grande, mais le niveau Basic ne prend en charge que le scale-out manuel jusqu'à 3 instances.
    d:
      en: |
        The Shared tier cannot scale out.
      fr: |
        Le niveau Shared ne permet pas de scale-out.
    e:
      en: |
        The Free tier cannot scale out.
      fr: |
        Le niveau Free ne permet pas de scale-out.
references:
  - title: Get started with autoscale in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
  - title: How to enable automatic scaling in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-automatic-scaling
