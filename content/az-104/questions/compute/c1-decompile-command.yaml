id: c1-decompile-command
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an ARM template named **azuredeploy.json**. The team wants to maintain the template in Bicep from now on.

    You need to create a Bicep file from azuredeploy.json by using the Azure CLI.

    Which command should you run?
  fr: |
    Northwind Traders dispose d'un modèle ARM nommé **azuredeploy.json**. L'équipe souhaite désormais gérer le modèle en Bicep.

    Vous devez créer un fichier Bicep à partir d'azuredeploy.json en utilisant Azure CLI.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`az bicep decompile --file azuredeploy.json`" }
    - { id: b, text: "`az bicep build --file azuredeploy.json`" }
    - { id: c, text: "`az bicep format --file azuredeploy.json`" }
    - { id: d, text: "`az deployment group export --resource-group RG1 --name azuredeploy`" }
answer: { optionId: a }
explanation:
  correct:
    en: "`az bicep decompile` converts an ARM JSON template to Bicep and writes azuredeploy.bicep next to the source file. The conversion is best effort, so you might need to fix warnings and rename symbols in the generated file."
    fr: "`az bicep decompile` convertit un modèle ARM JSON en Bicep et écrit azuredeploy.bicep à côté du fichier source. La conversion n'est pas garantie : vous devrez peut-être corriger des avertissements et renommer des symboles dans le fichier généré."
  options:
    b: { en: build does the opposite conversion, from a Bicep file to an ARM JSON template., fr: "build effectue la conversion inverse, d'un fichier Bicep vers un modèle ARM JSON." }
    c: { en: format reformats an existing Bicep file; it does not convert JSON., fr: "format remet en forme un fichier Bicep existant ; il ne convertit pas de JSON." }
    d: { en: This retrieves a JSON template from the deployment history; it does not produce Bicep., fr: "Cette commande récupère un modèle JSON depuis l'historique de déploiement ; elle ne produit pas de Bicep." }
references:
  - title: Decompile a JSON Azure Resource Manager template to Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile
