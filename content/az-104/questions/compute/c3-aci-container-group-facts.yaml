id: c3-aci-container-group-facts
objective: "3.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to deploy applications to Azure Container Instances by using container groups. Some groups will contain a main application container and a logging sidecar container.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de déployer des applications sur Azure Container Instances en utilisant des groupes de conteneurs. Certains groupes contiendront un conteneur d'application principal et un conteneur sidecar de journalisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Containers in the same container group can reach each other on localhost, even on ports that are not exposed on the group's IP address.
        fr: Les conteneurs d'un même groupe de conteneurs peuvent communiquer entre eux via localhost, même sur des ports qui ne sont pas exposés sur l'adresse IP du groupe.
    - id: s2
      text:
        en: A container group can contain two Windows containers.
        fr: Un groupe de conteneurs peut contenir deux conteneurs Windows.
    - id: s3
      text:
        en: If each of two containers in a group requests 1 CPU, the container group is allocated 2 CPUs.
        fr: Si chacun des deux conteneurs d'un groupe demande 1 processeur, le groupe de conteneurs se voit allouer 2 processeurs.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Containers in a group are scheduled on the same host and share a lifecycle, the local network and storage volumes, so they communicate over localhost on any port. Multi-container groups are supported only for Linux containers; for Windows, a container group runs a single container. A group's resources are the sum of the resource requests of its containers.
    fr: "Les conteneurs d'un groupe sont planifiés sur le même hôte et partagent un cycle de vie, le réseau local et les volumes de stockage : ils communiquent donc via localhost sur n'importe quel port. Les groupes multiconteneurs ne sont pris en charge que pour les conteneurs Linux ; pour Windows, un groupe de conteneurs exécute un seul conteneur. Les ressources d'un groupe correspondent à la somme des demandes de ressources de ses conteneurs."
  options:
    s2:
      en: Multi-container groups currently support only Linux containers.
      fr: Les groupes multiconteneurs ne prennent actuellement en charge que les conteneurs Linux.
references:
  - title: Introduction to container groups
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-container-groups
