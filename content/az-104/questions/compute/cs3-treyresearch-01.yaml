stem:
  en: |
    You need to configure vmss-geno-spot to meet the first compute requirement.

    How should you configure the scale set?
  fr: |
    Vous devez configurer vmss-geno-spot pour satisfaire la première exigence de calcul.

    Comment devez-vous configurer le groupe de machines virtuelles identiques ?
body:
  options:
    - { id: a, text: { en: "Azure Spot priority with the eviction policy set to Delete", fr: "Priorité Azure Spot avec la stratégie d'éviction définie sur Delete" } }
    - { id: b, text: { en: "Azure Spot priority with the eviction policy set to Deallocate", fr: "Priorité Azure Spot avec la stratégie d'éviction définie sur Deallocate" } }
    - { id: c, text: { en: "Regular priority with an autoscale rule that scales in to 0 instances when the queue is empty", fr: "Priorité normale avec une règle de mise à l'échelle automatique qui effectue un scale-in à 0 instance quand la file d'attente est vide" } }
    - { id: d, text: { en: "Regular priority with Azure reserved VM instances for 50 instances", fr: "Priorité normale avec des instances de machines virtuelles réservées Azure pour 50 instances" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Spot Virtual Machines use unused Azure capacity at a large discount and suit interruptible jobs that restart from a checkpoint. With the Delete eviction policy, evicted instances are deleted together with their disks, so there is no storage charge and they don't count against the scale set quota."
    fr: "Les machines virtuelles Azure Spot utilisent la capacité Azure inutilisée avec une forte remise et conviennent aux travaux interruptibles qui redémarrent à partir d'un point de contrôle. Avec la stratégie d'éviction Delete, les instances évincées sont supprimées avec leurs disques : il n'y a pas de frais de stockage et elles ne sont pas comptabilisées dans le quota du groupe."
  options:
    b: { en: "With Deallocate, evicted instances stay in the stopped-deallocated state: their disks are still billed and they count against the instance quota.", fr: "Avec Deallocate, les instances évincées restent à l'état arrêté (libéré) : leurs disques sont toujours facturés et elles sont comptabilisées dans le quota d'instances." }
    c: { en: "Regular-priority instances are billed at the pay-as-you-go price, which is higher than the Spot price while jobs run.", fr: "Les instances de priorité normale sont facturées au tarif paiement à l'utilisation, plus élevé que le tarif Spot pendant l'exécution des travaux." }
    d: { en: "Reservations require a one-year or three-year commitment and don't give the lowest cost for interruptible workloads.", fr: "Les réservations exigent un engagement d'un ou trois ans et ne donnent pas le coût le plus bas pour des charges de travail interruptibles." }
references:
  - title: "Create a scale set that uses Azure Spot Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/use-spot
