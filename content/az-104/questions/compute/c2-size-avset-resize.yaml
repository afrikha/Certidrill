id: c2-size-avset-resize
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an availability set named **AS1** that contains three running virtual machines named **Web1**, **Web2** and **Web3**. All three VMs use the Standard_D2s_v3 size.

    You need to resize Web1 to Standard_M32ms. When you run `Get-AzVMSize -ResourceGroupName RG1 -VMName Web1`, Standard_M32ms is not in the list of available sizes.

    What should you do first?
  fr: |
    Vous disposez d'un groupe à haute disponibilité nommé **AS1** qui contient trois machines virtuelles en cours d'exécution nommées **Web1**, **Web2** et **Web3**. Les trois machines utilisent la taille Standard_D2s_v3.

    Vous devez redimensionner Web1 en Standard_M32ms. Lorsque vous exécutez `Get-AzVMSize -ResourceGroupName RG1 -VMName Web1`, Standard_M32ms ne figure pas dans la liste des tailles disponibles.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Stop and deallocate Web1, Web2 and Web3.", fr: "Arrêter et libérer Web1, Web2 et Web3." }
    - id: b
      text: { en: Stop and deallocate Web1 only., fr: Arrêter et libérer uniquement Web1. }
    - id: c
      text: { en: Redeploy Web1., fr: Redéployer Web1. }
    - id: d
      text: { en: Restart Web1 from the guest operating system., fr: Redémarrer Web1 depuis le système d'exploitation invité. }
answer: { optionId: a }
explanation:
  correct:
    en: "`Get-AzVMSize` with `-VMName` lists only the sizes available on the hardware cluster that currently hosts the VM. For a VM in an availability set, if the new size isn't available on that cluster, you must deallocate all the VMs in the availability set before you resize; they can then be allocated on hardware that supports the new size."
    fr: "`Get-AzVMSize` avec `-VMName` ne liste que les tailles disponibles sur le cluster matériel qui héberge actuellement la machine virtuelle. Pour une machine d'un groupe à haute disponibilité, si la nouvelle taille n'est pas disponible sur ce cluster, vous devez libérer toutes les machines virtuelles du groupe avant le redimensionnement ; elles peuvent ensuite être allouées sur du matériel qui prend en charge la nouvelle taille."
  options:
    b:
      en: Deallocating a single VM of the availability set is not enough when the size is missing from the cluster that hosts the set.
      fr: Libérer une seule machine du groupe à haute disponibilité ne suffit pas lorsque la taille est absente du cluster qui héberge le groupe.
    c:
      en: Redeploying moves the VM to another host to fix connectivity or host issues; it does not make the size available.
      fr: Le redéploiement déplace la machine vers un autre hôte pour résoudre des problèmes de connectivité ou d'hôte ; il ne rend pas la taille disponible.
    d:
      en: A guest restart keeps the VM on the same hardware cluster.
      fr: Un redémarrage de l'invité laisse la machine virtuelle sur le même cluster matériel.
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
