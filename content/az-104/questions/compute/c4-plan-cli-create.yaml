id: c4-plan-cli-create
objective: "3.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create an App Service plan named **plan-tailspin** in a resource group named **rg-web** by using the Azure CLI. The plan must meet the following requirements:

    - Host Linux web apps.
    - Use the Premium v3 Small pricing tier.
    - Run three instances.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un plan App Service nommé **plan-tailspin** dans un groupe de ressources nommé **rg-web** à l'aide d'Azure CLI. Le plan doit répondre aux exigences suivantes :

    - Héberger des applications web Linux.
    - Utiliser le niveau tarifaire Premium v3 Small.
    - Exécuter trois instances.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az appservice plan create \
      --resource-group rg-web \
      --name plan-tailspin \
      [[os]] \
      --sku [[sku]] \
      [[count]] 3
  slots:
    - id: os
      options:
        - { id: linux, text: "--is-linux" }
        - { id: hyperv, text: "--hyper-v" }
        - { id: persite, text: "--per-site-scaling" }
    - id: sku
      options:
        - { id: p1v3, text: P1V3 }
        - { id: p1v2, text: P1V2 }
        - { id: s1, text: S1 }
        - { id: b3, text: B3 }
    - id: count
      options:
        - { id: workers, text: "--number-of-workers" }
        - { id: elastic, text: "--max-elastic-worker-count" }
        - { id: instcount, text: "--instance-count" }
answer:
  values: { os: linux, sku: p1v3, count: workers }
explanation:
  correct:
    en: "`--is-linux` creates a plan that hosts Linux apps, `P1V3` is the Premium v3 Small SKU, and `--number-of-workers` sets the number of instances allocated to the plan."
    fr: "`--is-linux` crée un plan qui héberge des applications Linux, `P1V3` est la référence SKU Premium v3 Small, et `--number-of-workers` définit le nombre d'instances allouées au plan."
  options:
    hyperv: { en: "--hyper-v creates a plan for Windows containers.", fr: "--hyper-v crée un plan pour des conteneurs Windows." }
    persite: { en: "--per-site-scaling enables per-app scaling; it does not choose the operating system.", fr: "--per-site-scaling active la mise à l'échelle par application ; il ne choisit pas le système d'exploitation." }
    p1v2: { en: P1V2 is a Premium v2 SKU., fr: P1V2 est une référence SKU Premium v2. }
    elastic: { en: "--max-elastic-worker-count is the maximum burst for automatic scaling, not a fixed instance count, and it is a parameter of az appservice plan update.", fr: "--max-elastic-worker-count est la rafale maximale de l'Automatic scaling, pas un nombre fixe d'instances, et c'est un paramètre de az appservice plan update." }
    instcount: { en: This parameter does not exist for az appservice plan create., fr: Ce paramètre n'existe pas pour az appservice plan create. }
references:
  - title: az appservice plan
    url: https://learn.microsoft.com/en-us/cli/azure/appservice/plan
