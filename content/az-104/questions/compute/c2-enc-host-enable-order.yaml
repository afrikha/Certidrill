id: c2-enc-host-enable-order
objective: "3.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure subscription named **Sub1** that contains a running Linux virtual machine named **VM4**. The VM size of VM4 supports encryption at host. Azure Disk Encryption has never been enabled on VM4, and encryption at host has never been used in Sub1.

    You need to enable encryption at host with platform-managed keys on VM4 by using the Azure CLI.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient une machine virtuelle Linux en cours d'exécution nommée **VM4**. La taille de VM4 prend en charge le chiffrement sur l'hôte. Azure Disk Encryption n'a jamais été activé sur VM4, et le chiffrement sur l'hôte n'a jamais été utilisé dans Sub1.

    Vous devez activer le chiffrement sur l'hôte avec des clés gérées par la plateforme sur VM4 avec Azure CLI.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: feat
      text: { en: "Run `az feature register --namespace Microsoft.Compute --name EncryptionAtHost` and wait for the state **Registered**.", fr: "Exécuter `az feature register --namespace Microsoft.Compute --name EncryptionAtHost` et attendre l'état **Registered**." }
    - id: dealloc
      text: { en: "Run `az vm deallocate` for VM4.", fr: "Exécuter `az vm deallocate` pour VM4." }
    - id: update
      text: { en: "Run `az vm update --set securityProfile.encryptionAtHost=true` for VM4.", fr: "Exécuter `az vm update --set securityProfile.encryptionAtHost=true` pour VM4." }
    - id: start
      text: { en: "Run `az vm start` for VM4.", fr: "Exécuter `az vm start` pour VM4." }
    - id: kv
      text: { en: Create a key vault and enable it for Azure Disk Encryption., fr: Créer un coffre de clés et l'activer pour Azure Disk Encryption. }
    - id: ade
      text: { en: "Run `az vm encryption enable --volume-type all` for VM4.", fr: "Exécuter `az vm encryption enable --volume-type all` pour VM4." }
answer:
  sequence: [feat, dealloc, update, start]
explanation:
  correct:
    en: The EncryptionAtHost feature must first be registered for the subscription. An existing VM must then be deallocated and reallocated to be encrypted, so you deallocate VM4, set `securityProfile.encryptionAtHost` to true, and start it again. With platform-managed keys, no key vault or disk encryption set is required.
    fr: |
      La fonctionnalité EncryptionAtHost doit d'abord être inscrite pour l'abonnement. Une machine virtuelle existante doit ensuite être libérée puis réallouée pour être chiffrée : vous libérez VM4, définissez `securityProfile.encryptionAtHost` sur true, puis la redémarrez. Avec des clés gérées par la plateforme, aucun coffre de clés ni jeu de chiffrement de disque n'est nécessaire.
  options:
    kv: { en: A key vault enabled for disk encryption is only used by Azure Disk Encryption., fr: Un coffre de clés activé pour le chiffrement de disque ne sert qu'à Azure Disk Encryption. }
    ade: { en: "This enables Azure Disk Encryption; after that, encryption at host can never be enabled on VM4.", fr: "Cette commande active Azure Disk Encryption ; ensuite, le chiffrement sur l'hôte ne pourra plus jamais être activé sur VM4." }
references:
  - title: Enable end-to-end encryption using encryption at host - Azure CLI
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli
