id: c1-bicep-dependencies
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have the following Bicep file.

    ```bicep
    param location string = resourceGroup().location

    resource stg 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: 'stfabrikamdiag01'
      location: location
      sku: {
        name: 'Standard_LRS'
      }
      kind: 'StorageV2'
    }

    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-app'
      location: location
      properties: {
        addressSpace: {
          addressPrefixes: [
            '10.30.0.0/16'
          ]
        }
      }
    }

    resource subnet 'Microsoft.Network/virtualNetworks/subnets@2023-09-01' = {
      parent: vnet
      name: 'snet-app'
      properties: {
        addressPrefix: '10.30.1.0/24'
      }
    }

    resource nsg 'Microsoft.Network/networkSecurityGroups@2023-09-01' = {
      name: 'nsg-app'
      location: location
      dependsOn: [
        stg
      ]
    }

    output blobEndpoint string = stg.properties.primaryEndpoints.blob
    ```

    Which two statements about the deployment of this file are true? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez du fichier Bicep suivant.

    ```bicep
    param location string = resourceGroup().location

    resource stg 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: 'stfabrikamdiag01'
      location: location
      sku: {
        name: 'Standard_LRS'
      }
      kind: 'StorageV2'
    }

    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: 'vnet-app'
      location: location
      properties: {
        addressSpace: {
          addressPrefixes: [
            '10.30.0.0/16'
          ]
        }
      }
    }

    resource subnet 'Microsoft.Network/virtualNetworks/subnets@2023-09-01' = {
      parent: vnet
      name: 'snet-app'
      properties: {
        addressPrefix: '10.30.1.0/24'
      }
    }

    resource nsg 'Microsoft.Network/networkSecurityGroups@2023-09-01' = {
      name: 'nsg-app'
      location: location
      dependsOn: [
        stg
      ]
    }

    output blobEndpoint string = stg.properties.primaryEndpoints.blob
    ```

    Quelles sont les deux affirmations vraies concernant le déploiement de ce fichier ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The subnet is deployed after the virtual network because the `parent` property creates an implicit dependency.", fr: "Le sous-réseau est déployé après le réseau virtuel, car la propriété `parent` crée une dépendance implicite." } }
    - { id: b, text: { en: "The network security group is deployed after the storage account.", fr: "Le groupe de sécurité réseau est déployé après le compte de stockage." } }
    - { id: c, text: { en: "The storage account and the virtual network are deployed one after the other, in the order in which they appear in the file.", fr: "Le compte de stockage et le réseau virtuel sont déployés l'un après l'autre, dans l'ordre où ils apparaissent dans le fichier." } }
    - { id: d, text: { en: "The output fails unless you add `dependsOn` to the output declaration.", fr: "La sortie échoue, sauf si vous ajoutez `dependsOn` à la déclaration de sortie." } }
    - { id: e, text: { en: "The network security group is deployed only after the subnet is created.", fr: "Le groupe de sécurité réseau n'est déployé qu'après la création du sous-réseau." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Bicep adds an implicit dependency when a resource references another one, for example through `parent` or a symbolic name in a property, so the subnet waits for the virtual network. The explicit `dependsOn` makes the network security group wait for the storage account. Resources without dependencies between them are deployed in parallel.
    fr: "Bicep ajoute une dépendance implicite quand une ressource en référence une autre, par exemple avec `parent` ou un nom symbolique dans une propriété : le sous-réseau attend donc le réseau virtuel. Le `dependsOn` explicite fait attendre le compte de stockage au groupe de sécurité réseau. Les ressources sans dépendance entre elles sont déployées en parallèle."
  options:
    c: { en: Resource Manager deploys independent resources in parallel; the order in the file does not set the deployment order., fr: "Resource Manager déploie en parallèle les ressources indépendantes ; l'ordre dans le fichier ne détermine pas l'ordre de déploiement." }
    d: { en: Outputs are evaluated after the resources are deployed; dependsOn is not used on outputs., fr: "Les sorties sont évaluées après le déploiement des ressources ; dependsOn ne s'utilise pas sur les sorties." }
    e: { en: The network security group depends only on the storage account; nothing links it to the subnet., fr: "Le groupe de sécurité réseau dépend seulement du compte de stockage ; rien ne le lie au sous-réseau." }
references:
  - title: Set resource dependencies in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/resource-dependencies
  - title: Child resources in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/child-resource-name-type
