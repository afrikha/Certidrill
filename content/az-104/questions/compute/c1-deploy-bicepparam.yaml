id: c1-deploy-bicepparam
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Bicep file named **main.bicep** that deploys resources to a resource group. You also have the following Bicep parameters file named **main.bicepparam** in the same folder.

    ```bicep
    using './main.bicep'

    param environment = 'prod'
    param vmCount = 2
    ```

    You need to deploy main.bicep to a resource group named **RG1** with the values of main.bicepparam by using the Azure CLI.

    Which command should you run?
  fr: |
    Vous disposez d'un fichier Bicep nommé **main.bicep** qui déploie des ressources dans un groupe de ressources. Vous disposez aussi du fichier de paramètres Bicep suivant, nommé **main.bicepparam**, dans le même dossier.

    ```bicep
    using './main.bicep'

    param environment = 'prod'
    param vmCount = 2
    ```

    Vous devez déployer main.bicep dans un groupe de ressources nommé **RG1** avec les valeurs de main.bicepparam en utilisant Azure CLI.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`az deployment group create --resource-group RG1 --parameters main.bicepparam`" }
    - { id: b, text: "`az deployment group create --resource-group RG1 --template-file main.bicepparam`" }
    - { id: c, text: "`az deployment sub create --location westeurope --parameters main.bicepparam`" }
    - { id: d, text: "`az bicep build-params --file main.bicepparam`" }
answer: { optionId: a }
explanation:
  correct:
    en: "A Bicep parameters file names its Bicep file with the `using` statement, so you only pass the .bicepparam file to `--parameters`; the `--template-file` switch is not needed. `az deployment group create` targets the resource group given in `--resource-group`."
    fr: "Un fichier de paramètres Bicep désigne son fichier Bicep avec l'instruction `using` : il suffit donc de passer le fichier .bicepparam à `--parameters`, sans le commutateur `--template-file`. `az deployment group create` cible le groupe de ressources indiqué dans `--resource-group`."
  options:
    b: { en: --template-file expects a Bicep or JSON template, not a parameters file., fr: "--template-file attend un modèle Bicep ou JSON, pas un fichier de paramètres." }
    c: { en: The file deploys resources to a resource group; a subscription deployment does not target RG1., fr: "Le fichier déploie des ressources dans un groupe de ressources ; un déploiement d'abonnement ne cible pas RG1." }
    d: { en: build-params only converts the parameters file to a JSON parameters file; it does not deploy anything., fr: "build-params convertit seulement le fichier de paramètres en fichier de paramètres JSON ; il ne déploie rien." }
references:
  - title: Deploy Bicep files with the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-cli
  - title: Create a parameters file for bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameter-files
