id: c4-plan-tier-slots-autoscale
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a web app named **app-litware** in Azure App Service.

    The app has the following requirements:

    - Two deployment slots must be available for staging and testing.
    - The number of instances must scale out automatically based on CPU usage rules.

    You need to provision an App Service plan for the app. The solution must minimize cost.

    Which pricing tier should you use?
  fr: |
    Vous prévoyez de déployer une application web nommée **app-litware** dans Azure App Service.

    L'application a les exigences suivantes :

    - Deux emplacements de déploiement doivent être disponibles pour la préproduction et les tests.
    - Le nombre d'instances doit faire l'objet d'un scale-out automatique selon des règles basées sur l'utilisation du processeur.

    Vous devez provisionner un plan App Service pour l'application. La solution doit réduire les coûts au minimum.

    Quel niveau tarifaire devez-vous utiliser ?
body:
  options:
    - { id: a, text: Shared (D1) }
    - { id: b, text: Basic (B1) }
    - { id: c, text: Standard (S1) }
    - { id: d, text: Premium v3 (P1v3) }
answer: { optionId: c }
explanation:
  correct:
    en: Standard is the lowest tier that supports both deployment slots (up to 5 per app) and rule-based autoscale. Premium v3 also meets the requirements but costs more, so it does not minimize cost.
    fr: |
      Standard est le niveau le moins élevé qui prend en charge à la fois les emplacements de déploiement (jusqu'à 5 par application) et la mise à l'échelle automatique basée sur des règles (autoscale). Premium v3 répond aussi aux exigences, mais coûte plus cher : il ne réduit donc pas les coûts au minimum.
  options:
    a:
      en: The Shared tier runs on shared VMs, cannot scale out and has no deployment slots.
      fr: Le niveau Shared s'exécute sur des machines virtuelles partagées, ne peut pas faire de scale-out et n'offre aucun emplacement de déploiement.
    b:
      en: Basic supports manual scale-out (up to 3 instances) but neither autoscale nor deployment slots.
      fr: Basic prend en charge le scale-out manuel (jusqu'à 3 instances), mais ni la mise à l'échelle automatique basée sur des règles ni les emplacements de déploiement.
    d:
      en: Premium v3 supports both features but is more expensive than Standard.
      fr: Premium v3 prend en charge les deux fonctionnalités, mais il est plus cher que Standard.
references:
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
  - title: "Set Up Staging Environments"
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
