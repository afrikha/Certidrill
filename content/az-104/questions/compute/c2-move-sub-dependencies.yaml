id: c2-move-sub-dependencies
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have two Azure subscriptions named **Sub1** and **Sub2** in the same Microsoft Entra tenant. All the required resource providers are registered in Sub2.

    Sub1 contains the following resources:

    | Name | Type | Resource group |
    | --- | --- | --- |
    | VM8 | Virtual machine | RG-Compute |
    | VM8-osdisk | Managed disk | RG-Compute |
    | VM8-nic | Network interface | RG-Network |
    | VNet8 | Virtual network | RG-Network |

    VM8 is the only resource connected to VNet8. It does not use disk encryption, a Marketplace plan or Azure Backup.

    You need to move VM8 to Sub2.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux abonnements Azure nommés **Sub1** et **Sub2** dans le même locataire Microsoft Entra. Tous les fournisseurs de ressources nécessaires sont inscrits dans Sub2.

    Sub1 contient les ressources suivantes :

    | Nom | Type | Groupe de ressources |
    | --- | --- | --- |
    | VM8 | Machine virtuelle | RG-Compute |
    | VM8-osdisk | Disque managé | RG-Compute |
    | VM8-nic | Interface réseau | RG-Network |
    | VNet8 | Réseau virtuel | RG-Network |

    VM8 est la seule ressource connectée à VNet8. Elle n'utilise ni chiffrement de disque, ni plan de la Place de marché, ni Sauvegarde Azure.

    Vous devez déplacer VM8 vers Sub2.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Move VM8-nic and VNet8 to RG-Compute.", fr: "Déplacer VM8-nic et VNet8 vers RG-Compute." }
    - id: b
      text: { en: "Move VM8, VM8-osdisk, VM8-nic and VNet8 to Sub2 in a single operation.", fr: "Déplacer VM8, VM8-osdisk, VM8-nic et VNet8 vers Sub2 en une seule opération." }
    - id: c
      text: { en: "Move only VM8 and VM8-osdisk to Sub2 and connect VM8 to a new virtual network in Sub2.", fr: "Déplacer uniquement VM8 et VM8-osdisk vers Sub2 et connecter VM8 à un nouveau réseau virtuel dans Sub2." }
    - id: d
      text: { en: "Create a peering between VNet8 and a virtual network in Sub2.", fr: "Créer un peering entre VNet8 et un réseau virtuel de Sub2." }
    - id: e
      text: { en: "Add VM8 to a move collection in Azure Resource Mover.", fr: "Ajouter VM8 à une collection de déplacement dans Azure Resource Mover." }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: For a move across subscriptions, a resource and its dependent resources must be in the same resource group and be moved together. A VM in an existing virtual network can move to another subscription only if the virtual network and its dependent resources move too. So you first consolidate the NIC and the virtual network into RG-Compute, then move all four resources to Sub2 in one operation.
    fr: Pour un déplacement entre abonnements, une ressource et ses ressources dépendantes doivent se trouver dans le même groupe de ressources et être déplacées ensemble. Une machine virtuelle d'un réseau virtuel existant ne peut passer dans un autre abonnement que si le réseau virtuel et ses ressources dépendantes sont aussi déplacés. Vous regroupez donc d'abord l'interface réseau et le réseau virtuel dans RG-Compute, puis vous déplacez les quatre ressources vers Sub2 en une seule opération.
  options:
    c:
      en: The VM depends on its network interface and virtual network; the move fails with a missing dependent resources error.
      fr: La machine virtuelle dépend de son interface réseau et de son réseau virtuel ; le déplacement échoue avec une erreur de ressources dépendantes manquantes.
    d:
      en: Peering connects networks; it does not move any resource between subscriptions.
      fr: Le peering connecte des réseaux ; il ne déplace aucune ressource entre abonnements.
    e:
      en: Azure Resource Mover is designed for moves across regions, which is not required here.
      fr: Azure Resource Mover est conçu pour les déplacements entre régions, ce qui n'est pas demandé ici.
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
  - title: Special cases to move Azure VMs to new subscription or resource group
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/virtual-machines-move-limitations
