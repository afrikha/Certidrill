id: c2-enc-host-temp-disk
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to deploy a new Windows virtual machine named **VM3** that has managed disks. The security policy requires that:

    - the temp disk and the OS and data disk caches are encrypted at rest;
    - data flows between the VM host and Azure Storage are encrypted;
    - the encryption must not consume CPU resources of VM3.

    Which encryption option should you enable for VM3?
  fr: |
    Adatum prévoit de déployer une nouvelle machine virtuelle Windows nommée **VM3** avec des disques managés. La stratégie de sécurité exige que :

    - le disque temporaire et les caches des disques du système d'exploitation et de données soient chiffrés au repos ;
    - les flux de données entre l'hôte de la machine virtuelle et le Stockage Azure soient chiffrés ;
    - le chiffrement ne consomme pas de ressources processeur de VM3.

    Quelle option de chiffrement devez-vous activer pour VM3 ?
body:
  options:
    - id: a
      text: { en: Encryption at host, fr: Le chiffrement sur l'hôte }
    - id: b
      text: { en: Azure Disk Encryption, fr: Azure Disk Encryption }
    - id: c
      text: { en: Server-side encryption with a customer-managed key in a disk encryption set, fr: Le chiffrement côté serveur avec une clé gérée par le client dans un jeu de chiffrement de disque }
    - id: d
      text: { en: Server-side encryption with platform-managed keys, fr: Le chiffrement côté serveur avec des clés gérées par la plateforme }
answer: { optionId: a }
explanation:
  correct:
    en: Encryption at host extends server-side encryption so that temp disks and disk caches are encrypted at rest and data flows encrypted to the storage clusters. The encryption happens on the host, not inside the guest, so it does not use the VM's CPU. Microsoft also recommends it for new VMs because Azure Disk Encryption is scheduled for retirement in September 2028.
    fr: Le chiffrement sur l'hôte étend le chiffrement côté serveur afin que les disques temporaires et les caches de disque soient chiffrés au repos et que les données soient chiffrées jusqu'aux clusters de stockage. Le chiffrement est réalisé sur l'hôte, pas dans l'invité, et n'utilise donc pas le processeur de la machine virtuelle. Microsoft le recommande aussi pour les nouvelles machines virtuelles, car la mise hors service d'Azure Disk Encryption est prévue en septembre 2028.
  options:
    b:
      en: Azure Disk Encryption encrypts the temp disk and caches, but it runs BitLocker inside the guest and therefore uses the VM's CPU.
      fr: Azure Disk Encryption chiffre le disque temporaire et les caches, mais il exécute BitLocker dans l'invité et utilise donc le processeur de la machine virtuelle.
    c:
      en: Server-side encryption, even with customer-managed keys, does not encrypt temp disks or disk caches.
      fr: Le chiffrement côté serveur, même avec des clés gérées par le client, ne chiffre ni les disques temporaires ni les caches de disque.
    d:
      en: Server-side encryption with platform-managed keys is always on, but it does not cover temp disks, caches or the data flow from the host.
      fr: Le chiffrement côté serveur avec des clés gérées par la plateforme est toujours actif, mais il ne couvre ni les disques temporaires, ni les caches, ni le flux de données depuis l'hôte.
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
