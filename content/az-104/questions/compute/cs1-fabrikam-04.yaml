id: cs1-fabrikam-04
objective: "3.2.3"
type: ordering
caseStudy: cs1-fabrikam
difficulty: 3
status: draft
stem:
  en: |
    You need to move VM-HIST-AP1 to meet the requirements. You open Azure Resource Mover and choose to move resources across regions, with Southeast Asia as the source and East US as the destination.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez déplacer VM-HIST-AP1 pour satisfaire les exigences. Vous ouvrez Azure Resource Mover et choisissez de déplacer des ressources entre régions, avec Southeast Asia comme source et East US comme destination.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: select, text: { en: "Select VM-HIST-AP1 as a resource to move.", fr: "Sélectionner VM-HIST-AP1 comme ressource à déplacer." } }
    - { id: deps, text: { en: "Validate the dependencies and add the dependent resources.", fr: "Valider les dépendances et ajouter les ressources dépendantes." } }
    - { id: prepare, text: { en: "Prepare the resources.", fr: "Préparer les ressources (Prepare)." } }
    - { id: initiate, text: { en: "Initiate the move.", fr: "Lancer le déplacement (Initiate move)." } }
    - { id: commit, text: { en: "Commit the move.", fr: "Valider le déplacement (Commit move)." } }
    - { id: delete, text: { en: "Delete the source resources.", fr: "Supprimer les ressources sources." } }
    - { id: discard, text: { en: "Discard the move.", fr: "Abandonner le déplacement (Discard move)." } }
    - { id: testfo, text: { en: "Run a test failover in a Recovery Services vault.", fr: "Exécuter un test de basculement dans un coffre Recovery Services." } }
answer:
  sequence: [select, deps, prepare, initiate, commit]
explanation:
  correct:
    en: |
      Resource Mover adds the selected VM to a move collection, then validates and adds its dependencies (NIC, virtual network, NSG…). Preparing the resources starts replicating the VM to the target region; initiating the move creates the VM in East US; committing completes the move. The source resources stay in place after the commit until you delete them, which meets the 30-day retention requirement.
    fr: |
      Resource Mover ajoute la machine virtuelle sélectionnée à une collection de déplacement, puis valide et ajoute ses dépendances (interface réseau, réseau virtuel, NSG…). La préparation des ressources lance la réplication de la machine virtuelle vers la région cible ; le lancement du déplacement crée la machine virtuelle dans East US ; la validation termine le déplacement. Les ressources sources restent en place après la validation jusqu'à ce que vous les supprimiez, ce qui respecte l'exigence de conservation de 30 jours.
  options:
    delete: { en: "Deleting the source resources is optional and would violate the requirement to keep the source VM for 30 days.", fr: "La suppression des ressources sources est facultative et irait à l'encontre de l'exigence de conserver la machine virtuelle source pendant 30 jours." }
    discard: { en: "Discarding the move cancels it and returns the resources to the Initiate move pending state.", fr: "Abandonner le déplacement l'annule et ramène les ressources à l'état Initiate move pending." }
    testfo: { en: "Resource Mover manages the replication itself; you do not run a Site Recovery test failover in your own vault.", fr: "Resource Mover gère lui-même la réplication ; vous n'exécutez pas de test de basculement Site Recovery dans votre propre coffre." }
references:
  - title: Move Azure VMs across regions with Azure Resource Mover
    url: https://learn.microsoft.com/en-us/azure/resource-mover/tutorial-move-region-virtual-machines
