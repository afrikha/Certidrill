id: c4-backup-over-vnet
objective: "3.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a web app named **app-contoso** that runs on an App Service plan in the Premium v3 tier. app-contoso uses virtual network integration with a subnet named **snet-integration** in **VNet1**.

    You have a storage account named **stbackupcontoso**. Its firewall allows access only from snet-integration, which has a service endpoint for Microsoft.Storage.

    You configure custom backups of app-contoso to a container in stbackupcontoso, but every backup fails with the error "Storage access failed".

    You need to make sure that the custom backups succeed. The storage account must stay restricted to VNet1.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-contoso** qui s'exécute sur un plan App Service de niveau Premium v3. app-contoso utilise l'intégration au réseau virtuel avec un sous-réseau nommé **snet-integration** dans **VNet1**.

    Vous disposez d'un compte de stockage nommé **stbackupcontoso**. Son pare-feu n'autorise l'accès que depuis snet-integration, qui possède un point de terminaison de service pour Microsoft.Storage.

    Vous configurez des sauvegardes personnalisées d'app-contoso vers un conteneur de stbackupcontoso, mais chaque sauvegarde échoue avec l'erreur « Storage access failed ».

    Vous devez vous assurer que les sauvegardes personnalisées réussissent. Le compte de stockage doit rester limité à VNet1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: In the custom backup configuration, select Backup/restore over virtual network integration.
        fr: Dans la configuration des sauvegardes personnalisées, sélectionner Backup/restore over virtual network integration.
    - id: b
      text:
        en: Create a private endpoint for app-contoso in VNet1.
        fr: Créer un point de terminaison privé pour app-contoso dans VNet1.
    - id: c
      text:
        en: Enable a system-assigned managed identity for app-contoso and assign it the Storage Blob Data Contributor role on stbackupcontoso.
        fr: Activer une identité managée affectée par le système pour app-contoso et lui attribuer le rôle Storage Blob Data Contributor sur stbackupcontoso.
    - id: d
      text:
        en: Rely on the automatic backups and select stbackupcontoso as their destination.
        fr: S'appuyer sur les sauvegardes automatiques et sélectionner stbackupcontoso comme destination.
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, backup traffic doesn't go through the virtual network integration. Custom backups can reach a firewall-protected storage account when the app is integrated with a virtual network that the storage account allows and you select **Backup/restore over virtual network integration** in the backup configuration.
    fr: |
      Par défaut, le trafic de sauvegarde ne passe pas par l'intégration au réseau virtuel. Les sauvegardes personnalisées peuvent atteindre un compte de stockage protégé par un pare-feu lorsque l'application est intégrée à un réseau virtuel autorisé par le compte de stockage et que vous sélectionnez **Backup/restore over virtual network integration** dans la configuration de sauvegarde.
  options:
    b:
      en: |
        A private endpoint only handles inbound traffic to the app; backups are outbound traffic to storage.
      fr: |
        Un point de terminaison privé ne gère que le trafic entrant vers l'application ; les sauvegardes sont du trafic sortant vers le stockage.
    c:
      en: |
        App Service backup and restore require SAS-based authorization to the storage account; managed identity authentication isn't supported.
      fr: |
        La sauvegarde et la restauration App Service exigent une autorisation basée sur SAS pour le compte de stockage ; l'authentification par identité managée n'est pas prise en charge.
    d:
      en: |
        Automatic backups are stored by the platform; you can't choose a storage account for them.
      fr: |
        Les sauvegardes automatiques sont stockées par la plateforme ; vous ne pouvez pas choisir de compte de stockage pour elles.
references:
  - title: "Back Up an App"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup
