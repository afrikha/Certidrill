id: cs3-lucerne-05
objective: "3.1.3"
type: dropdown
caseStudy: cs3-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You need to modify storage.bicep to deploy stlucmedia according to the planned changes.

    How should you complete the Bicep file? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez modifier storage.bicep pour déployer stlucmedia conformément aux modifications prévues.

    Comment devez-vous compléter le fichier Bicep ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource stlucmedia 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: 'stlucmedia'
      location: location
      kind: 'StorageV2'
      sku: {
        name: [[sku]]
      }
      properties: {
        supportsHttpsTrafficOnly: [[https]]
        minimumTlsVersion: [[tls]]
        allowBlobPublicAccess: [[anon]]
      }
    }
  slots:
    - id: sku
      options:
        - { id: lrs, text: "'Standard_LRS'" }
        - { id: zrs, text: "'Standard_ZRS'" }
        - { id: grs, text: "'Standard_GRS'" }
        - { id: plrs, text: "'Premium_LRS'" }
    - id: https
      options:
        - { id: t, text: "true" }
        - { id: f, text: "false" }
    - id: tls
      options:
        - { id: t10, text: "'TLS1_0'" }
        - { id: t11, text: "'TLS1_1'" }
        - { id: t12, text: "'TLS1_2'" }
    - id: anon
      options:
        - { id: t, text: "true" }
        - { id: f, text: "false" }
answer:
  values: { sku: zrs, https: t, tls: t12, anon: f }
explanation:
  correct:
    en: "Standard_ZRS replicates the data synchronously across three availability zones of the region. supportsHttpsTrafficOnly set to true rejects HTTP requests, minimumTlsVersion set to TLS1_2 rejects older TLS versions, and allowBlobPublicAccess set to false blocks anonymous read access to every container."
    fr: "Standard_ZRS réplique les données de manière synchrone dans trois zones de disponibilité de la région. supportsHttpsTrafficOnly à true rejette les requêtes HTTP, minimumTlsVersion à TLS1_2 rejette les versions de TLS plus anciennes, et allowBlobPublicAccess à false bloque l'accès en lecture anonyme à tous les conteneurs."
  options:
    sku: { en: "LRS keeps three copies in a single datacenter, GRS uses a single datacenter in each of two regions, and Premium_LRS isn't zone redundant.", fr: "LRS conserve trois copies dans un seul centre de données, GRS utilise un seul centre de données dans chacune de deux régions, et Premium_LRS n'est pas redondant interzone." }
references:
  - title: "Microsoft.Storage/storageAccounts - Bicep, ARM template & Terraform AzAPI reference"
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.storage/storageaccounts
  - title: "Azure Storage redundancy"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
