id: c2-vm-create-zone-cli
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a Linux virtual machine named **VM1** in the resource group **RG1** by using the Azure CLI. The solution must meet the following requirements:

    - VM1 must be deployed in availability zone 2 of the region.
    - Administrators must sign in with SSH keys only.
    - VM1 must have a static public IP address that can be used with availability zones.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer une machine virtuelle Linux nommée **VM1** dans le groupe de ressources **RG1** avec Azure CLI. La solution doit répondre aux exigences suivantes :

    - VM1 doit être déployée dans la zone de disponibilité 2 de la région.
    - Les administrateurs doivent se connecter uniquement avec des clés SSH.
    - VM1 doit disposer d'une adresse IP publique statique utilisable avec les zones de disponibilité.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm create \
      --resource-group RG1 \
      --name VM1 \
      --image Ubuntu2204 \
      --admin-username azureuser \
      [[zone]] \
      [[auth]] \
      [[pip]]
  slots:
    - id: zone
      options:
        - { id: z, text: "--zone 2" }
        - { id: fd, text: "--platform-fault-domain 2" }
        - { id: as, text: "--availability-set AS2" }
        - { id: ppg, text: "--ppg PPG2" }
    - id: auth
      options:
        - { id: ssh, text: "--generate-ssh-keys" }
        - { id: pwd, text: "--authentication-type password" }
        - { id: all, text: "--authentication-type all" }
        - { id: adminpwd, text: "--admin-password \"<password>\"" }
    - id: pip
      options:
        - { id: std, text: "--public-ip-sku Standard" }
        - { id: basic, text: "--public-ip-sku Basic" }
        - { id: none, text: "--public-ip-address \"\"" }
        - { id: dyn, text: "--public-ip-address-allocation dynamic" }
answer:
  values: { zone: z, auth: ssh, pip: std }
explanation:
  correct:
    en: "`--zone 2` places VM1 in availability zone 2. `--generate-ssh-keys` uses an existing key in `~/.ssh` or creates one, so sign-in is key-based. A Standard SKU public IP address is always static and supports availability zones, whereas the Basic SKU is retired, so the public IP must use `--public-ip-sku Standard`."
    fr: "`--zone 2` place VM1 dans la zone de disponibilité 2. `--generate-ssh-keys` utilise une clé existante dans `~/.ssh` ou en crée une : la connexion se fait par clé. Une adresse IP publique de référence SKU Standard est toujours statique et prend en charge les zones de disponibilité, alors que la référence SKU Basic est mise hors service : l'adresse IP publique doit donc utiliser `--public-ip-sku Standard`."
  options:
    fd: { en: A fault domain is not an availability zone; it applies to availability sets and scale sets., fr: Un domaine d'erreur n'est pas une zone de disponibilité ; il concerne les groupes à haute disponibilité et les groupes identiques. }
    as: { en: "`--availability-set` places the VM in an availability set, which can't be combined with an availability zone.", fr: "`--availability-set` place la machine virtuelle dans un groupe à haute disponibilité, qui ne peut pas être combiné avec une zone de disponibilité." }
    ppg: { en: "`--ppg` places the VM in a proximity placement group to reduce latency; it does not select a zone.", fr: "`--ppg` place la machine virtuelle dans un groupe de placement de proximité pour réduire la latence ; il ne sélectionne pas de zone." }
    pwd: { en: Password authentication does not meet the SSH-keys-only requirement., fr: L'authentification par mot de passe ne répond pas à l'exigence « clés SSH uniquement ». }
    adminpwd: { en: "Supplying an admin password for a Linux VM enables password authentication.", fr: "Fournir un mot de passe d'administrateur pour une machine virtuelle Linux active l'authentification par mot de passe." }
    all: { en: "`all` enables both password and SSH key authentication.", fr: "`all` active à la fois l'authentification par mot de passe et par clé SSH." }
    basic: { en: "The Basic SKU public IP is retired, and it never supported availability zones.", fr: "La référence SKU Basic de l'adresse IP publique est mise hors service, et elle n'a jamais pris en charge les zones de disponibilité." }
    none: { en: An empty value creates the VM without a public IP address., fr: Une valeur vide crée la machine virtuelle sans adresse IP publique. }
    dyn: { en: "Dynamic allocation isn't supported by the Standard SKU, and the requirement is a static address.", fr: "L'allocation dynamique n'est pas prise en charge par la référence SKU Standard, et l'exigence porte sur une adresse statique." }
references:
  - title: "Quickstart: Use the Azure CLI to create a Linux Virtual Machine"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/quick-create-cli
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
