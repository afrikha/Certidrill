id: c2-move-region-mover
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a running virtual machine named **VM7** in the East US region. VM7 is connected to a virtual network and a network security group in the same resource group.

    You need to move VM7 and its network resources to the West US 2 region by using Azure Resource Mover. You must keep the option to cancel the move before it is finalized.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'une machine virtuelle en cours d'exécution nommée **VM7** dans la région East US. VM7 est connectée à un réseau virtuel et à un groupe de sécurité réseau situés dans le même groupe de ressources.

    Vous devez déplacer VM7 et ses ressources réseau vers la région West US 2 avec Azure Resource Mover. Vous devez conserver la possibilité d'annuler le déplacement avant qu'il soit finalisé.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: add
      text: { en: "Select East US as the source and West US 2 as the destination, and add VM7 to the move.", fr: "Sélectionner East US comme source et West US 2 comme destination, puis ajouter VM7 au déplacement." }
    - id: deps
      text: { en: Validate the dependencies and add the dependent resources., fr: Valider les dépendances et ajouter les ressources dépendantes. }
    - id: prep
      text: { en: Prepare the resources., fr: Préparer les ressources. }
    - id: init
      text: { en: Initiate the move., fr: Lancer le déplacement. }
    - id: commit
      text: { en: Commit the move., fr: Valider le déplacement. }
    - id: dealloc
      text: { en: Stop and deallocate VM7., fr: Arrêter et libérer VM7. }
    - id: armmove
      text: { en: "Run `az resource move` with the target region.", fr: "Exécuter `az resource move` avec la région cible." }
answer:
  sequence: [add, deps, prep, init, commit]
explanation:
  correct:
    en: In Resource Mover you add the resources for a source and destination region pair, resolve their dependencies, and then prepare them (VM data starts replicating and templates are generated for the other resources). The source resource group, which Resource Mover adds automatically, is moved before the other resources are prepared. Initiating the move creates the resources in the target region; until you commit, you can still discard the move. Committing finalizes it, after which you can delete the source resources.
    fr: Dans Resource Mover, vous ajoutez les ressources pour une paire de régions source et destination, résolvez leurs dépendances, puis les préparez (la réplication des données de la machine virtuelle démarre et des modèles sont générés pour les autres ressources). Le groupe de ressources source, que Resource Mover ajoute automatiquement, est déplacé avant la préparation des autres ressources. Le lancement du déplacement crée les ressources dans la région cible ; tant que vous n'avez pas validé, vous pouvez encore abandonner le déplacement. La validation le finalise ; vous pouvez ensuite supprimer les ressources sources.
  options:
    dealloc: { en: The VMs to move must be running so that their data can be replicated., fr: Les machines virtuelles à déplacer doivent être en cours d'exécution pour que leurs données puissent être répliquées. }
    armmove: { en: "`az resource move` changes the resource group or subscription, never the region.", fr: "`az resource move` change le groupe de ressources ou l'abonnement, jamais la région." }
references:
  - title: Move Azure VMs across regions with Azure Resource Mover
    url: https://learn.microsoft.com/en-us/azure/resource-mover/tutorial-move-region-virtual-machines
