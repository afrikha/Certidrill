id: cs3-relecloud-03
objective: "3.2.4"
type: single
caseStudy: cs3-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to resize VM-TRN1 and VM-TRN2 to meet the transcoding requirement.

    Which size should you use?
  fr: |
    Vous devez redimensionner VM-TRN1 et VM-TRN2 pour satisfaire l'exigence de transcodage.

    Quelle taille devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Standard_E16_v5" }
    - { id: b, text: "Standard_E16s_v5" }
    - { id: c, text: "Standard_D32s_v5" }
    - { id: d, text: "Standard_F16s_v2" }
answer: { optionId: b }
explanation:
  correct:
    en: "Standard_E16s_v5 is a memory-optimized size with 16 vCPUs and 128 GiB of memory. The **s** in the name indicates that the size supports Premium Storage, so the VMs can keep their Premium SSD disks. Because the VMs are in an availability set, you might have to deallocate both VMs if the size isn't available on the current hardware cluster."
    fr: "Standard_E16s_v5 est une taille à mémoire optimisée qui offre 16 vCPU et 128 Gio de mémoire. Le **s** du nom indique que la taille prend en charge le stockage Premium : les machines virtuelles peuvent donc conserver leurs disques SSD Premium. Comme les machines virtuelles sont dans un groupe à haute disponibilité, vous devrez peut-être libérer les deux machines si la taille n'est pas disponible sur le cluster matériel actuel."
  options:
    a: { en: "Sizes without the s suffix don't support Premium Storage, so the Premium SSD disks couldn't stay attached.", fr: "Les tailles sans le suffixe s ne prennent pas en charge le stockage Premium : les disques SSD Premium ne pourraient pas rester attachés." }
    c: { en: "Standard_D32s_v5 has 128 GiB of memory but 32 vCPUs, twice the 16 vCPUs required, so it costs more than Standard_E16s_v5.", fr: "Standard_D32s_v5 offre 128 Gio de mémoire mais 32 vCPU, soit le double des 16 vCPU exigés : elle coûte plus cher que Standard_E16s_v5." }
    d: { en: "Standard_F16s_v2 is compute optimized and has only 32 GiB of memory.", fr: "Standard_F16s_v2 est optimisée pour le calcul et n'offre que 32 Gio de mémoire." }
references:
  - title: "Esv5 size series - Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/memory-optimized/esv5-series
  - title: "Resize a virtual machine - Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
