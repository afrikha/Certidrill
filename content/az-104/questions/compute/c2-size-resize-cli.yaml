id: c2-size-resize-cli
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a standalone virtual machine named **App1** in the resource group **RG1**. You write a Bash script that must:

    1. list the sizes that App1 can be resized to on its current hardware cluster;
    2. release the compute resources of App1 so that it can be allocated on another cluster;
    3. change the size of App1 to Standard_D4s_v5.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle autonome nommée **App1** dans le groupe de ressources **RG1**. Vous écrivez un script Bash qui doit :

    1. lister les tailles vers lesquelles App1 peut être redimensionnée sur son cluster matériel actuel ;
    2. libérer les ressources de calcul d'App1 afin qu'elle puisse être allouée sur un autre cluster ;
    3. changer la taille d'App1 en Standard_D4s_v5.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm [[list]] --resource-group RG1 --name App1 --output table
    az vm [[release]] --resource-group RG1 --name App1
    az vm [[change]] --resource-group RG1 --name App1 --size Standard_D4s_v5
    az vm start --resource-group RG1 --name App1
  slots:
    - id: list
      options:
        - { id: resizeopt, text: list-vm-resize-options }
        - { id: sizes, text: list-sizes }
        - { id: usage, text: list-usage }
        - { id: skus, text: list-skus }
    - id: release
      options:
        - { id: dealloc, text: deallocate }
        - { id: stop, text: stop }
        - { id: redeploy, text: redeploy }
        - { id: restart, text: restart }
    - id: change
      options:
        - { id: resize, text: resize }
        - { id: reapply, text: reapply }
        - { id: reimage, text: reimage }
        - { id: convert, text: convert }
answer:
  values: { list: resizeopt, release: dealloc, change: resize }
explanation:
  correct:
    en: "`az vm list-vm-resize-options` returns the sizes available for an existing VM on its current hardware cluster. `az vm deallocate` releases the compute resources (a plain `stop` keeps the VM allocated and billed). `az vm resize --size` changes the VM size, and `az vm start` allocates it again."
    fr: "`az vm list-vm-resize-options` renvoie les tailles disponibles pour une machine virtuelle existante sur son cluster matériel actuel. `az vm deallocate` libère les ressources de calcul (un simple `stop` laisse la machine allouée et facturée). `az vm resize --size` modifie la taille, puis `az vm start` alloue à nouveau la machine."
  options:
    sizes: { en: "`list-sizes` lists all sizes of a region, not those available for this VM.", fr: "`list-sizes` liste toutes les tailles d'une région, pas celles disponibles pour cette machine." }
    skus: { en: "`list-skus` lists SKUs and restrictions for a location, not the cluster of the VM.", fr: "`list-skus` liste les références SKU et leurs restrictions pour un emplacement, pas pour le cluster de la machine." }
    stop: { en: "`az vm stop` powers off the guest but keeps the hardware allocated.", fr: "`az vm stop` arrête l'invité mais conserve le matériel alloué." }
    redeploy: { en: "Redeploy moves the VM to a new host but does not change its size.", fr: "Le redéploiement déplace la machine vers un nouvel hôte sans changer sa taille." }
    reimage: { en: "`az vm reimage` reinstalls the operating system of the VM; it does not change the size.", fr: "`az vm reimage` réinstalle le système d'exploitation de la machine virtuelle ; elle ne change pas sa taille." }
    reapply: { en: "`az vm reapply` reapplies the current VM state to recover from a failed state; it does not change the size.", fr: "`az vm reapply` réapplique l'état actuel de la machine virtuelle pour sortir d'un état d'échec ; elle ne change pas sa taille." }
    convert: { en: "`az vm convert` converts unmanaged disks to managed disks.", fr: "`az vm convert` convertit des disques non managés en disques managés." }
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
