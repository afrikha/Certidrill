id: c3-acr-roles-least-privilege
objective: "3.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind has an Azure container registry named **crnorthwind**. Its role assignment permissions mode is **RBAC Registry Permissions**.

    You need to grant registry access to three identities. Each identity must receive only the permissions it needs (principle of least privilege).

    Which built-in role should you assign to each identity? To answer, drag the appropriate roles to the correct identities. Each role may be used once, more than once, or not at all.
  fr: |
    Northwind dispose d'un registre de conteneurs Azure nommé **crnorthwind**. Son mode d'autorisations d'attribution de rôle est **RBAC Registry Permissions**.

    Vous devez accorder l'accès au registre à trois identités. Chaque identité ne doit recevoir que les autorisations dont elle a besoin (principe du moindre privilège).

    Quel rôle intégré devez-vous attribuer à chaque identité ? Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.
body:
  reuse: true
  items:
    - { id: pull, text: AcrPull }
    - { id: push, text: AcrPush }
    - { id: del, text: AcrDelete }
    - { id: signer, text: AcrImageSigner }
    - { id: contrib, text: Contributor }
  targets:
    - id: aci
      text: { en: "The managed identity of a container group that only pulls images to start its containers", fr: "L'identité managée d'un groupe de conteneurs qui récupère uniquement des images pour démarrer ses conteneurs" }
    - id: ci
      text: { en: "The service principal of a CI pipeline that builds images and pushes them to the registry", fr: "Le principal de service d'un pipeline CI qui génère des images et les envoie vers le registre" }
    - id: purge
      text: { en: "A cleanup script that only deletes old tags and images", fr: "Un script de nettoyage qui supprime uniquement d'anciennes étiquettes et images" }
answer:
  mapping: { aci: pull, ci: push, purge: del }
explanation:
  correct:
    en: AcrPull grants read-only data plane access to pull images. AcrPush grants push and pull access, which a build pipeline needs. AcrDelete only allows deleting artifacts and tags, without pushing or managing the registry. Contributor manages the registry resource itself and is far broader than needed.
    fr: AcrPull accorde un accès en lecture seule au plan de données pour récupérer des images. AcrPush accorde les accès en envoi et en récupération, nécessaires à un pipeline de build. AcrDelete permet uniquement de supprimer des artefacts et des étiquettes, sans envoyer d'images ni gérer le registre. Contributor gère la ressource de registre elle-même et va bien au-delà du nécessaire.
  options:
    signer: { en: AcrImageSigner is used to sign images with Docker Content Trust, which none of the identities needs., fr: AcrImageSigner sert à signer des images avec Docker Content Trust, ce dont aucune identité n'a besoin. }
    contrib: { en: Contributor grants control plane rights on the registry and does not follow least privilege., fr: Contributor accorde des droits sur le plan de contrôle du registre et ne respecte pas le moindre privilège. }
references:
  - title: Azure Container Registry Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
