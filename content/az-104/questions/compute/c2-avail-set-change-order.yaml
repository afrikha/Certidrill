id: c2-avail-set-change-order
objective: "3.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a Windows virtual machine named **VM12** that has managed disks and is not in an availability set. The delete option of its disks and network interface is set to **Detach**.

    You need to place VM12 in a new availability set named **AS3** by using Azure PowerShell, while keeping its existing disks and network interface.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Windows nommée **VM12** qui utilise des disques managés et ne fait partie d'aucun groupe à haute disponibilité. L'option de suppression de ses disques et de son interface réseau est définie sur **Détacher**.

    Vous devez placer VM12 dans un nouveau groupe à haute disponibilité nommé **AS3** avec Azure PowerShell, en conservant ses disques et son interface réseau existants.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: newas
      text: { en: "Run `New-AzAvailabilitySet` with the `-Sku Aligned` parameter to create AS3.", fr: "Exécuter `New-AzAvailabilitySet` avec le paramètre `-Sku Aligned` pour créer AS3." }
    - id: remove
      text: { en: "Run `Remove-AzVM` to delete VM12.", fr: "Exécuter `Remove-AzVM` pour supprimer VM12." }
    - id: config
      text: { en: "Run `New-AzVMConfig -AvailabilitySetId`, then attach the existing OS disk, data disks and network interface to the configuration.", fr: "Exécuter `New-AzVMConfig -AvailabilitySetId`, puis attacher le disque du système d'exploitation, les disques de données et l'interface réseau existants à la configuration." }
    - id: create
      text: { en: "Run `New-AzVM` with the new configuration.", fr: "Exécuter `New-AzVM` avec la nouvelle configuration." }
    - id: update
      text: { en: "Set the `AvailabilitySetReference` property of VM12 and run `Update-AzVM`.", fr: "Définir la propriété `AvailabilitySetReference` de VM12 et exécuter `Update-AzVM`." }
    - id: move
      text: { en: "Run `Move-AzResource` to move VM12 into AS3.", fr: "Exécuter `Move-AzResource` pour déplacer VM12 dans AS3." }
answer:
  sequence: [newas, remove, config, create]
explanation:
  correct:
    en: A VM can be added to an availability set only when it is created. To change it, you create the availability set (Aligned SKU for managed disks), delete the VM while keeping its disks and NIC, build a new VM configuration that references the availability set and attaches the existing resources, and then re-create the VM.
    fr: Une machine virtuelle ne peut être ajoutée à un groupe à haute disponibilité qu'au moment de sa création. Pour la changer, vous créez le groupe à haute disponibilité (référence SKU Aligned pour les disques managés), supprimez la machine virtuelle en conservant ses disques et son interface réseau, créez une nouvelle configuration qui référence le groupe et attache les ressources existantes, puis recréez la machine virtuelle.
  options:
    update: { en: The availability set of an existing VM can't be changed with an update., fr: Le groupe à haute disponibilité d'une machine virtuelle existante ne peut pas être modifié par une mise à jour. }
    move: { en: "`Move-AzResource` moves resources between resource groups or subscriptions; an availability set is not a container you move a VM into.", fr: "`Move-AzResource` déplace des ressources entre groupes de ressources ou abonnements ; un groupe à haute disponibilité n'est pas un conteneur dans lequel on déplace une machine virtuelle." }
references:
  - title: Change a VM's availability set by using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/change-availability-set
