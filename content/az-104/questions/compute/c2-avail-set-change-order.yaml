id: c2-avail-set-change-order
objective: "3.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a Windows virtual machine named **VM12** that has managed disks and is not in an availability set. An availability set named **AS3** that uses the Aligned SKU already exists in the same region and resource group. The delete option of the disks and network interface of VM12 is set to **Detach**.

    You need to place VM12 in AS3 by using Azure PowerShell, while keeping its existing disks and network interface.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Windows nommée **VM12** qui utilise des disques managés et ne fait partie d'aucun groupe à haute disponibilité. Un groupe à haute disponibilité nommé **AS3**, de référence SKU Aligned, existe déjà dans la même région et le même groupe de ressources. L'option de suppression des disques et de l'interface réseau de VM12 est définie sur **Détacher**.

    Vous devez placer VM12 dans AS3 avec Azure PowerShell, en conservant ses disques et son interface réseau existants.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: get
      text: { en: "Run `Get-AzVM` and store the size, OS disk, data disks and network interface of VM12 in a variable.", fr: "Exécuter `Get-AzVM` et stocker la taille, le disque du système d'exploitation, les disques de données et l'interface réseau de VM12 dans une variable." }
    - id: remove
      text: { en: "Run `Remove-AzVM` to delete VM12.", fr: "Exécuter `Remove-AzVM` pour supprimer VM12." }
    - id: create
      text: { en: "Run `New-AzVM` with a configuration that references AS3 and attaches the existing OS disk, data disks and network interface.", fr: "Exécuter `New-AzVM` avec une configuration qui référence AS3 et attache le disque du système d'exploitation, les disques de données et l'interface réseau existants." }
    - id: update
      text: { en: "Set the `AvailabilitySetReference` property of VM12 and run `Update-AzVM`.", fr: "Définir la propriété `AvailabilitySetReference` de VM12 et exécuter `Update-AzVM`." }
    - id: move
      text: { en: "Run `Move-AzResource` to move VM12 into AS3.", fr: "Exécuter `Move-AzResource` pour déplacer VM12 dans AS3." }
    - id: snap
      text: { en: Create a snapshot of each disk and delete the original disks., fr: Créer un instantané de chaque disque et supprimer les disques d'origine. }
answer:
  sequence: [ get, remove, create ]
explanation:
  correct:
    en: A VM can be added to an availability set only when it is created. To change it, you first capture the VM settings, then delete the VM while keeping its disks and NIC (delete option Detach), and finally re-create the VM with a configuration that references the availability set and attaches the existing resources.
    fr: Une machine virtuelle ne peut être ajoutée à un groupe à haute disponibilité qu'au moment de sa création. Pour la changer, vous récupérez d'abord les paramètres de la machine virtuelle, puis vous la supprimez en conservant ses disques et son interface réseau (option Détacher), et enfin vous la recréez avec une configuration qui référence le groupe et attache les ressources existantes.
  options:
    update: { en: The availability set of an existing VM can't be changed with an update., fr: Le groupe à haute disponibilité d'une machine virtuelle existante ne peut pas être modifié par une mise à jour. }
    move: { en: "`Move-AzResource` moves resources between resource groups or subscriptions; an availability set is not a container you move a VM into.", fr: "`Move-AzResource` déplace des ressources entre groupes de ressources ou abonnements ; un groupe à haute disponibilité n'est pas un conteneur dans lequel on déplace une machine virtuelle." }
    snap: { en: "Snapshots are not needed because the disks are detached, not deleted, when the VM is removed.", fr: "Les instantanés sont inutiles, car les disques sont détachés et non supprimés lors de la suppression de la machine virtuelle." }
references:
  - title: Change a VM's availability set by using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/change-availability-set
