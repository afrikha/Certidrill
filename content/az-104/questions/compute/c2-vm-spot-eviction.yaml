id: c2-vm-spot-eviction
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs nightly batch jobs on Azure Spot Virtual Machines. When Azure evicts a Spot VM, its managed disks must be kept so that the VM can be started again later.

    Which setting should you configure when you create the Spot VMs?
  fr: |
    Fabrikam exécute des traitements par lots nocturnes sur des machines virtuelles Azure Spot. Quand Azure évince une machine virtuelle Spot, ses disques managés doivent être conservés pour qu'elle puisse être redémarrée ultérieurement.

    Quel paramètre devez-vous configurer lors de la création des machines virtuelles Spot ?
body:
  options:
    - id: a
      text: { en: "Eviction policy: Deallocate", fr: "Stratégie d'éviction : Deallocate (libérer)" }
    - id: b
      text: { en: "Eviction policy: Delete", fr: "Stratégie d'éviction : Delete (supprimer)" }
    - id: c
      text: { en: "Maximum price: -1", fr: "Prix maximal : -1" }
    - id: d
      text: { en: "Eviction type: Capacity only", fr: "Type d'éviction : capacité uniquement" }
answer: { optionId: a }
explanation:
  correct:
    en: With the Deallocate eviction policy (the default), an evicted Spot VM moves to the stopped (deallocated) state and keeps its disks, so you can restart it later. You keep paying for disk storage, and the VM still counts against your quota.
    fr: Avec la stratégie d'éviction Deallocate (valeur par défaut), une machine virtuelle Spot évincée passe à l'état arrêté (libéré) et conserve ses disques ; vous pouvez la redémarrer plus tard. Le stockage des disques reste facturé et la machine compte toujours dans votre quota.
  options:
    b:
      en: The Delete policy deletes the VM together with its underlying disks.
      fr: La stratégie Delete supprime la machine virtuelle ainsi que ses disques sous-jacents.
    c:
      en: A maximum price of -1 prevents evictions for price reasons, but it does not define what happens to the disks when a capacity eviction occurs.
      fr: Un prix maximal de -1 empêche les évictions liées au prix, mais ne définit pas ce qu'il advient des disques lors d'une éviction pour capacité.
    d:
      en: The eviction type controls why a VM can be evicted (capacity or price), not what happens to its disks.
      fr: Le type d'éviction détermine pourquoi une machine peut être évincée (capacité ou prix), pas ce qu'il advient de ses disques.
references:
  - title: About Azure Spot Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
