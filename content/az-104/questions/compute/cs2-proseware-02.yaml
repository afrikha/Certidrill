id: cs2-proseware-02
objective: "3.4.8"
type: yesno_statements
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the staging slot of app-pw-learn to meet the release requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser l'emplacement staging d'app-pw-learn pour satisfaire l'exigence de mise en production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To keep each database with its slot, the SqlConnection connection string must be marked as a deployment slot setting.
        fr: Pour que chaque base de données reste associée à son emplacement, la chaîne de connexion SqlConnection doit être marquée comme paramètre d'emplacement de déploiement.
    - id: s2
      text:
        en: During a swap, the production slot is stopped until the new release has started, so a short downtime is expected.
        fr: Pendant un échange, l'emplacement de production est arrêté jusqu'au démarrage de la nouvelle version ; une courte interruption de service est donc attendue.
    - id: s3
      text:
        en: After a swap, the previous production release runs in the staging slot, so you can roll back by swapping again.
        fr: Après un échange, l'ancienne version de production s'exécute dans l'emplacement staging ; vous pouvez donc revenir en arrière en effectuant un nouvel échange.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Connection strings are swapped by default. A connection string marked as a deployment slot setting stays with its slot during a swap, so production keeps sql-learn-prod and staging keeps sql-learn-test; each slot keeps its own value of SqlConnection. App Service warms up the source slot instances with the target settings before it switches the routing, so the swap causes no downtime. The swap exchanges the contents of the slots, so the previous release ends up in staging and a second swap rolls back.
    fr: |
      Les chaînes de connexion sont échangées par défaut. Une chaîne de connexion marquée comme paramètre d'emplacement de déploiement reste attachée à son emplacement pendant un échange ; la production garde donc sql-learn-prod et staging garde sql-learn-test, chaque emplacement conservant sa propre valeur de SqlConnection. App Service préchauffe les instances de l'emplacement source avec les paramètres de la cible avant de basculer le routage ; l'échange n'entraîne donc aucune interruption. L'échange permute le contenu des emplacements : l'ancienne version se retrouve dans staging et un second échange permet de revenir en arrière.
references:
  - title: "Set Up Staging Environments - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
