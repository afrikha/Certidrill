id: c2-move-rg-effects
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains a resource group named **RG-App** in the West Europe region and a resource group named **RG-Prod** in the North Europe region. RG-App contains a running virtual machine named **VM5** and all of its dependent resources.

    You move VM5 and its dependent resources from RG-App to RG-Prod.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous disposez d'un abonnement Azure qui contient un groupe de ressources nommé **RG-App** dans la région West Europe et un groupe de ressources nommé **RG-Prod** dans la région North Europe. RG-App contient une machine virtuelle en cours d'exécution nommée **VM5** et toutes ses ressources dépendantes.

    Vous déplacez VM5 et ses ressources dépendantes de RG-App vers RG-Prod.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: VM5 keeps running during the move.
        fr: VM5 continue de s'exécuter pendant le déplacement.
    - id: s2
      text:
        en: After the move, VM5 runs in the North Europe region.
        fr: Après le déplacement, VM5 s'exécute dans la région North Europe.
    - id: s3
      text:
        en: After the move, the resource ID of VM5 is different.
        fr: Après le déplacement, l'ID de ressource de VM5 est différent.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: During a move, the source and target resource groups are locked against changes, but existing resources keep operating without downtime. A move only changes the resource group, never the physical region of the resource, so VM5 stays in West Europe. Because the resource group name is part of the resource ID, the ID changes and scripts or dashboards that reference it must be updated.
    fr: |
      Pendant un déplacement, les groupes de ressources source et cible sont verrouillés contre les modifications, mais les ressources existantes continuent de fonctionner sans interruption. Un déplacement ne change que le groupe de ressources, jamais la région physique de la ressource : VM5 reste en West Europe. Comme le nom du groupe de ressources fait partie de l'ID de ressource, l'ID change et les scripts ou tableaux de bord qui le référencent doivent être mis à jour.
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
