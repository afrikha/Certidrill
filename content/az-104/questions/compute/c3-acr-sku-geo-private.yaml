id: c3-acr-sku-geo-private
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to create an Azure container registry named **crcontoso01** in the West Europe region.

    The registry must meet the following requirements:

    - Replicate images to the East US region so that clusters in both regions pull images from a nearby copy by using the same registry name.
    - Allow access only through private endpoints in Contoso's virtual networks.

    You need to choose a service tier for crcontoso01. The solution must minimize cost.

    Which service tier should you choose?
  fr: |
    Contoso prévoit de créer un registre de conteneurs Azure nommé **crcontoso01** dans la région West Europe.

    Le registre doit répondre aux exigences suivantes :

    - Répliquer les images vers la région East US afin que les clusters des deux régions récupèrent les images depuis une copie proche en utilisant le même nom de registre.
    - Autoriser l'accès uniquement via des points de terminaison privés dans les réseaux virtuels de Contoso.

    Vous devez choisir un niveau de service pour crcontoso01. La solution doit réduire les coûts au minimum.

    Quel niveau de service devez-vous choisir ?
body:
  options:
    - { id: basic, text: Basic }
    - { id: standard, text: Standard }
    - { id: premium, text: Premium }
    - id: stdzr
      text: { en: "Standard, with zone redundancy enabled", fr: "Standard, avec la redondance de zone activée" }
answer: { optionId: premium }
explanation:
  correct:
    en: Geo-replication and private link with private endpoints are both features of the Premium tier only. Basic and Standard offer the same core registry features with less included storage and throughput, but neither can replicate a registry to another region or use private endpoints.
    fr: "La géoréplication et la liaison privée avec des points de terminaison privés sont deux fonctionnalités réservées au niveau Premium. Basic et Standard offrent les mêmes fonctionnalités de base avec moins de stockage inclus et de débit, mais aucun des deux ne peut répliquer un registre vers une autre région ni utiliser des points de terminaison privés."
  options:
    basic:
      en: Basic is the entry-level tier; it supports neither geo-replication nor private endpoints.
      fr: Basic est le niveau d'entrée de gamme ; il ne prend en charge ni la géoréplication ni les points de terminaison privés.
    standard:
      en: Standard increases storage and throughput compared to Basic, but geo-replication and private endpoints still require Premium.
      fr: Standard augmente le stockage et le débit par rapport à Basic, mais la géoréplication et les points de terminaison privés exigent toujours Premium.
    stdzr:
      en: Zone redundancy protects against an availability zone failure inside one region and is available in every tier; it does not replicate the registry to another region.
      fr: La redondance de zone protège contre la panne d'une zone de disponibilité dans une seule région et elle est disponible dans tous les niveaux ; elle ne réplique pas le registre vers une autre région.
references:
  - title: Azure Container Registry SKU Features and Limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
  - title: Geo-replication in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication
