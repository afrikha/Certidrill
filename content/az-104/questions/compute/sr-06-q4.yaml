id: sr-06-q4
objective: "3.4.2"
type: series_yesno
series: sr-06-appservice-autoscale
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You scale up ASP1 to Standard S1 and set the instance count manually to 8.
  fr: |
    Vous effectuez un scale-up d'ASP1 vers Standard S1 et définissez manuellement le nombre d'instances sur 8.
body:
  solution:
    en: |
      You scale up ASP1 to the **Standard (S1)** tier and, on the **Scale out** page, select **Manual scale** with an instance count of **8**.
    fr: |
      Vous effectuez un scale-up d'ASP1 vers le niveau **Standard (S1)** et, dans la page **Scale out**, sélectionnez **Manual scale** avec un nombre d'instances de **8**.
answer: { value: false }
explanation:
  correct:
    en: |
      Manual scale keeps a fixed number of instances. WebApp1 always runs on 8 instances, whatever the CPU load, and the count never decreases when the load drops. The goal requires the count to change automatically with CPU usage, so it isn't met.
    fr: |
      La mise à l'échelle manuelle maintient un nombre fixe d'instances. WebApp1 s'exécute toujours sur 8 instances, quelle que soit la charge du processeur, et ce nombre ne diminue jamais lorsque la charge baisse. L'objectif exige que le nombre change automatiquement selon l'utilisation du processeur ; il n'est donc pas atteint.
references:
  - title: "Get started with autoscale in Azure"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
