id: sr-06-q1
objective: "3.4.2"
type: series_yesno
series: sr-06-appservice-autoscale
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You configure CPU-based autoscale rules on ASP1 in the Basic tier.
  fr: |
    Vous configurez des règles de mise à l'échelle automatique basées sur le processeur sur ASP1 au niveau Basic.
body:
  solution:
    en: |
      You keep ASP1 in the **Basic (B1)** tier and configure a custom autoscale setting on ASP1: scale out by one instance when the average CPU percentage exceeds 70 percent, scale in by one instance below 30 percent, with a maximum of 8 instances.
    fr: |
      Vous conservez ASP1 au niveau **Basic (B1)** et configurez un paramètre de mise à l'échelle automatique personnalisé sur ASP1 : scale-out d'une instance lorsque le pourcentage moyen d'utilisation du processeur dépasse 70 %, scale-in d'une instance en dessous de 30 %, avec un maximum de 8 instances.
answer: { value: false }
explanation:
  correct:
    en: |
      Azure Monitor autoscale for App Service requires an App Service plan in the Standard tier or higher, so these rules can't be applied to a Basic plan. In addition, a Basic plan scales out to at most 3 instances, below the required 8. The goal isn't met.
    fr: |
      La mise à l'échelle automatique Azure Monitor pour App Service exige un plan App Service au niveau Standard ou supérieur : ces règles ne peuvent pas s'appliquer à un plan Basic. De plus, un plan Basic ne peut effectuer un scale-out que jusqu'à 3 instances, en dessous des 8 requises. L'objectif n'est pas atteint.
references:
  - title: "Get started with autoscale in Azure"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
  - title: "Scale up features and capacities - Azure App Service"
