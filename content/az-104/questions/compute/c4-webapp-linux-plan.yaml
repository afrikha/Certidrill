id: c4-webapp-linux-plan
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows App Service plan named **Plan1** in the Standard S1 tier. Plan1 hosts two ASP.NET web apps.

    You need to deploy a new web app named **app-woodgrove** that must run on Linux with the Node.js runtime stack. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un plan App Service Windows nommé **Plan1** au niveau Standard S1. Plan1 héberge deux applications web ASP.NET.

    Vous devez déployer une nouvelle application web nommée **app-woodgrove** qui doit s'exécuter sous Linux avec la pile d'exécution Node.js. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Create app-woodgrove with the Linux operating system in a new Linux App Service plan., fr: Créer app-woodgrove avec le système d'exploitation Linux dans un nouveau plan App Service Linux. } }
    - { id: b, text: { en: Change the operating system of Plan1 to Linux and create app-woodgrove in Plan1., fr: Changer le système d'exploitation de Plan1 en Linux et créer app-woodgrove dans Plan1. } }
    - { id: c, text: { en: Create app-woodgrove in Plan1 and select Linux on the Basics tab., fr: Créer app-woodgrove dans Plan1 et sélectionner Linux dans l'onglet Basics. } }
    - { id: d, text: { en: Create app-woodgrove in Plan1 and set the platform to 64-bit., fr: Créer app-woodgrove dans Plan1 et définir la plateforme sur 64 bits. } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The operating system is a property of the App Service plan: a plan hosts either Windows or Linux apps. A Linux web app must therefore be created in a Linux plan, which you can create at the same time as the app.
    fr: |
      Le système d'exploitation est une propriété du plan App Service : un plan héberge soit des applications Windows, soit des applications Linux. Une application web Linux doit donc être créée dans un plan Linux, que vous pouvez créer en même temps que l'application.
  options:
    b:
      en: |
        You cannot change the operating system of an existing plan.
      fr: |
        Vous ne pouvez pas changer le système d'exploitation d'un plan existant.
    c:
      en: |
        When you select Linux, the portal only offers Linux plans; Plan1 is a Windows plan.
      fr: |
        Lorsque vous sélectionnez Linux, le portail ne propose que des plans Linux ; Plan1 est un plan Windows.
    d:
      en: |
        The 32-bit/64-bit platform setting applies to Windows apps and does not change the operating system.
      fr: |
        Le paramètre de plateforme 32 bits/64 bits s'applique aux applications Windows et ne change pas le système d'exploitation.
references:
  - title: Azure App Service plans
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
