id: c4-backup-partial-filter
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows web app named **app-litware** that runs on an App Service plan in the Standard S2 tier. Custom scheduled backups are configured to a storage account.

    The folder **site\wwwroot\logs** has grown to several gigabytes, and the backups are approaching the size limit.

    You need to exclude the logs folder from future custom backups.

    What should you do?
  fr: |
    Vous disposez d'une application web Windows nommée **app-litware** qui s'exécute sur un plan App Service de niveau Standard S2. Des sauvegardes personnalisées planifiées sont configurées vers un compte de stockage.

    Le dossier **site\wwwroot\logs** atteint plusieurs gigaoctets, et les sauvegardes approchent de la limite de taille.

    Vous devez exclure le dossier logs des futures sauvegardes personnalisées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Create a _backup.filter file in site\wwwroot that lists \site\wwwroot\logs.
        fr: Créer un fichier _backup.filter dans site\wwwroot qui liste \site\wwwroot\logs.
    - id: b
      text:
        en: Add a .gitignore file in site\wwwroot that lists the logs folder.
        fr: Ajouter un fichier .gitignore dans site\wwwroot qui liste le dossier logs.
    - id: c
      text:
        en: Reduce the retention of the custom backups to 1 day.
        fr: Réduire la rétention des sauvegardes personnalisées à 1 jour.
    - id: d
      text:
        en: Disable the automatic backups of app-litware.
        fr: Désactiver les sauvegardes automatiques d'app-litware.
answer: { optionId: a }
explanation:
  correct:
    en: |
      Custom backups support partial backups: you list the files and folders to exclude, one per line and without the %HOME% root, in a _backup.filter file stored in the %HOME%\site\wwwroot folder. Partial backups aren't supported for automatic backups.
    fr: |
      Les sauvegardes personnalisées prennent en charge les sauvegardes partielles : vous listez les fichiers et dossiers à exclure, un par ligne et sans la racine %HOME%, dans un fichier _backup.filter placé dans le dossier %HOME%\site\wwwroot. Les sauvegardes partielles ne sont pas prises en charge pour les sauvegardes automatiques.
  options:
    b:
      en: |
        A .gitignore file only affects Git; the backup feature doesn't read it.
      fr: |
        Un fichier .gitignore n'affecte que Git ; la fonctionnalité de sauvegarde ne le lit pas.
    c:
      en: |
        Retention controls how long backups are kept, not what each backup contains.
      fr: |
        La rétention contrôle la durée de conservation des sauvegardes, pas leur contenu.
    d:
      en: |
        Automatic backups are separate from custom backups; they don't determine what a custom backup contains or how large it is.
      fr: |
        Les sauvegardes automatiques sont distinctes des sauvegardes personnalisées ; elles ne déterminent ni le contenu ni la taille d'une sauvegarde personnalisée.
references:
  - title: Back up an app in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup
