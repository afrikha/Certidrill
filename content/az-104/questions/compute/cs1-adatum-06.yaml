id: cs1-adatum-06
objective: "3.2.2"
type: multi
caseStudy: cs1-adatum
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the encryption requirement for VM-LEDGER1 by using Azure Disk Encryption.

    Which two actions should you perform before you enable encryption? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de chiffrement de VM-LEDGER1 en utilisant Azure Disk Encryption.

    Quelles sont les deux actions à effectuer avant d'activer le chiffrement ? Chaque bonne réponse constitue une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a key vault in the France Central region", fr: "Créer un coffre de clés dans la région France Central" } }
    - { id: b, text: { en: "On the key vault, enable access to Azure Disk Encryption for volume encryption", fr: "Sur le coffre de clés, activer l'accès à Azure Disk Encryption pour le chiffrement de volume" } }
    - { id: c, text: { en: "Create a disk encryption set that uses a key in kv-adatum-sec", fr: "Créer un jeu de chiffrement de disque qui utilise une clé de kv-adatum-sec" } }
    - { id: d, text: { en: "Enable encryption at host on VM-LEDGER1", fr: "Activer le chiffrement sur l'hôte pour VM-LEDGER1" } }
    - { id: e, text: { en: "Assign a system-assigned managed identity to VM-LEDGER1", fr: "Affecter une identité managée affectée par le système à VM-LEDGER1" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Azure Disk Encryption uses BitLocker inside Windows and stores its secrets in Azure Key Vault. To keep the encryption secrets within the region, the key vault must be in the same region as the VM; kv-adatum-sec is in West Europe while VM-LEDGER1 is in France Central, so you need a new key vault in France Central. The key vault must also allow access to Azure Disk Encryption for volume encryption (EnabledForDiskEncryption).
    fr: |
      Azure Disk Encryption utilise BitLocker dans Windows et stocke ses secrets dans Azure Key Vault. Pour que les secrets de chiffrement restent dans la région, le coffre de clés doit se trouver dans la même région que la machine virtuelle ; kv-adatum-sec est dans West Europe alors que VM-LEDGER1 est dans France Central, il faut donc un nouveau coffre de clés dans France Central. Le coffre doit aussi autoriser l'accès à Azure Disk Encryption pour le chiffrement de volume (EnabledForDiskEncryption).
  options:
    c: { en: "A disk encryption set configures server-side encryption with customer-managed keys, not encryption inside the guest OS; kv-adatum-sec is also in another region.", fr: "Un jeu de chiffrement de disque configure le chiffrement côté serveur avec des clés gérées par le client, pas le chiffrement dans le système d'exploitation invité ; kv-adatum-sec se trouve en outre dans une autre région." }
    d: { en: "Encryption at host encrypts data on the VM host (temporary disk and caches); it does not use BitLocker in the guest OS.", fr: "Le chiffrement sur l'hôte chiffre les données sur l'hôte de la machine virtuelle (disque temporaire et caches) ; il n'utilise pas BitLocker dans le système d'exploitation invité." }
    e: { en: "Azure Disk Encryption does not require a managed identity on the VM; the platform accesses the key vault through its disk encryption access policy.", fr: "Azure Disk Encryption n'exige pas d'identité managée sur la machine virtuelle ; la plateforme accède au coffre de clés grâce à sa stratégie d'accès pour le chiffrement de disque." }
references:
  - title: Creating and configuring a key vault for Azure Disk Encryption on a Windows VM
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-key-vault
  - title: Enable Azure Disk Encryption for Windows VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-overview
