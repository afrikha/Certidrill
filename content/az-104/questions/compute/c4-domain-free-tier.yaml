id: c4-domain-free-tier
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-litware** that runs on an App Service plan in the Free F1 tier.

    You need users to reach the app at **https://www.litware.com** by using a free App Service managed certificate. The solution must minimize cost.

    To which pricing tier should you scale up the plan?
  fr: |
    Vous disposez d'une application web nommée **app-litware** qui s'exécute sur un plan App Service de niveau Free F1.

    Les utilisateurs doivent accéder à l'application via **https://www.litware.com** à l'aide d'un certificat managé App Service gratuit. La solution doit réduire les coûts au minimum.

    Vers quel niveau tarifaire devez-vous faire passer le plan ?
body:
  options:
    - { id: a, text: Shared (D1) }
    - { id: b, text: Basic (B1) }
    - { id: c, text: Standard (S1) }
    - { id: d, text: Premium v3 (P0v3) }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Free tier doesn't support custom domains at all. The Shared tier supports custom domains but not TLS/SSL bindings for them. Basic is the lowest tier that supports both custom domains and App Service managed certificates with SNI SSL bindings.
    fr: |
      Le niveau Free ne prend pas du tout en charge les domaines personnalisés. Le niveau Shared prend en charge les domaines personnalisés, mais pas les liaisons TLS/SSL pour ces domaines. Basic est le niveau le moins élevé qui prend en charge à la fois les domaines personnalisés et les certificats managés App Service avec des liaisons SNI SSL.
  options:
    a:
      en: |
        Shared allows custom domains, but you can't secure them with a certificate, so HTTPS on www.litware.com isn't possible.
      fr: |
        Shared autorise les domaines personnalisés, mais vous ne pouvez pas les sécuriser avec un certificat : HTTPS sur www.litware.com n'est donc pas possible.
    c:
      en: |
        Standard works but costs more than Basic.
      fr: |
        Standard fonctionne, mais coûte plus cher que Basic.
    d:
      en: |
        Premium v3 works but costs more than Basic.
      fr: |
        Premium v3 fonctionne, mais coûte plus cher que Basic.
references:
  - title: Install a TLS/SSL Certificate for Your App
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate
  - title: "Set Up an Existing Custom Domain Name for Your App"
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
