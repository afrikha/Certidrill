id: c1-arm-uniquestring-name
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an ARM template that contains the following variable and resource definition.

    ```json
    "variables": {
      "storageName": "[concat('stlogs', uniqueString(resourceGroup().id))]"
    },
    "resources": [
      {
        "type": "Microsoft.Storage/storageAccounts",
        "apiVersion": "2023-05-01",
        "name": "[variables('storageName')]",
        "location": "[resourceGroup().location]",
        "sku": {
          "name": "Standard_LRS"
        },
        "kind": "StorageV2"
      }
    ]
    ```

    In the same subscription, you deploy the template twice to a resource group named **RG1**, and then once to a resource group named **RG2**. All deployments succeed.

    What is the result?
  fr: |
    Vous disposez d'un modèle ARM qui contient la variable et la définition de ressource suivantes.

    ```json
    "variables": {
      "storageName": "[concat('stlogs', uniqueString(resourceGroup().id))]"
    },
    "resources": [
      {
        "type": "Microsoft.Storage/storageAccounts",
        "apiVersion": "2023-05-01",
        "name": "[variables('storageName')]",
        "location": "[resourceGroup().location]",
        "sku": {
          "name": "Standard_LRS"
        },
        "kind": "StorageV2"
      }
    ]
    ```

    Dans le même abonnement, vous déployez le modèle deux fois dans un groupe de ressources nommé **RG1**, puis une fois dans un groupe de ressources nommé **RG2**. Tous les déploiements réussissent.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: Two storage accounts with different names, one in RG1 and one in RG2, fr: "Deux comptes de stockage de noms différents, l'un dans RG1 et l'autre dans RG2" }
    - id: b
      text: { en: Three storage accounts with three different names, fr: Trois comptes de stockage portant trois noms différents }
    - id: c
      text: { en: Two storage accounts with the same name, one in RG1 and one in RG2, fr: "Deux comptes de stockage portant le même nom, l'un dans RG1 et l'autre dans RG2" }
    - id: d
      text: { en: Three storage accounts in RG1 and RG2 that share the same name prefix and a random suffix, fr: Trois comptes de stockage dans RG1 et RG2 qui partagent le même préfixe et un suffixe aléatoire }
answer: { optionId: a }
explanation:
  correct:
    en: "`uniqueString()` is a deterministic hash of its arguments: the same resource group ID always gives the same 13-character value. The second deployment to RG1 therefore targets the existing account and updates it, while RG2 has a different ID, which produces a different name."
    fr: "`uniqueString()` est un hachage déterministe de ses arguments : le même ID de groupe de ressources donne toujours la même valeur de 13 caractères. Le second déploiement dans RG1 cible donc le compte existant et le met à jour, tandis que RG2 a un ID différent, qui produit un autre nom."
  options:
    b: { en: Redeploying to RG1 generates the same name, so no third account is created., fr: "Le redéploiement dans RG1 génère le même nom : aucun troisième compte n'est créé." }
    c: { en: The resource group IDs differ, so the hashes differ; storage account names must also be globally unique., fr: "Les ID des groupes de ressources diffèrent, donc les hachages aussi ; de plus, les noms de comptes de stockage doivent être uniques au niveau global." }
    d: { en: uniqueString() is not random; it returns the same value for the same inputs., fr: "uniqueString() n'est pas aléatoire ; elle renvoie la même valeur pour les mêmes entrées." }
references:
  - title: Template functions - string
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-string
