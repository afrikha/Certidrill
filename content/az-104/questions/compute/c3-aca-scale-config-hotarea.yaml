id: c3-aca-scale-config-hotarea
objective: "3.3.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware has four container apps in a Container Apps environment on the Consumption plan. Their ingress and scale settings are shown in the following table. No other scale rules are configured.

    Answer each prompt by selecting the appropriate container app.
  fr: |
    Litware dispose de quatre applications conteneur dans un environnement Container Apps sur le plan Consommation. Leurs paramètres d'entrée et de mise à l'échelle figurent dans le tableau suivant. Aucune autre règle de mise à l'échelle n'est configurée.

    Répondez à chaque consigne en sélectionnant l'application conteneur appropriée.
body:
  prompts:
    - id: p1
      text: { en: "The app that scales to zero and then has no way to start a replica again", fr: "L'application qui descend à zéro puis n'a plus aucun moyen de redémarrer un réplica" }
    - id: p2
      text: { en: "The app that keeps running replicas even when it receives no traffic or events", fr: "L'application qui conserve des réplicas en cours d'exécution même lorsqu'elle ne reçoit ni trafic ni événements" }
  grid:
    header: [{ en: Container app, fr: Application conteneur }, { en: Ingress, fr: Entrée }, { en: Min replicas, fr: Nb min. de réplicas }, { en: Max replicas, fr: Nb max. de réplicas }, { en: Scale rule, fr: Règle de mise à l'échelle }]
    rows:
      - [{ text: ca-web, area: web }, { text: { en: External, fr: Externe } }, { text: "0" }, { text: "10" }, { text: { en: "HTTP, 100 concurrent requests", fr: "HTTP, 100 requêtes simultanées" } }]
      - [{ text: ca-worker, area: worker }, { text: { en: Disabled, fr: Désactivée } }, { text: "0" }, { text: "10" }, { text: { en: None (default), fr: Aucune (par défaut) } }]
      - [{ text: ca-api, area: api }, { text: { en: Internal, fr: Interne } }, { text: "2" }, { text: "6" }, { text: { en: "HTTP, 50 concurrent requests", fr: "HTTP, 50 requêtes simultanées" } }]
      - [{ text: ca-queue, area: queue }, { text: { en: Disabled, fr: Désactivée } }, { text: "0" }, { text: "20" }, { text: { en: "Custom, azure-servicebus", fr: "Personnalisée, azure-servicebus" } }]
answer:
  values: { p1: worker, p2: api }
explanation:
  correct:
    en: Without a scale rule, the default HTTP rule applies (0 to 10 replicas), but it is driven by ingress traffic. ca-worker has ingress disabled, no custom rule and a minimum of 0, so it scales to zero and nothing can start it again; Microsoft recommends creating a scale rule or setting minReplicas to 1 or more in this case. ca-api has a minimum of 2 replicas, so two replicas always remain. ca-web restarts on HTTP requests, and ca-queue is started by its KEDA Service Bus scaler.
    fr: "Sans règle de mise à l'échelle, la règle HTTP par défaut s'applique (0 à 10 réplicas), mais elle est déclenchée par le trafic d'entrée. ca-worker a l'entrée désactivée, aucune règle personnalisée et un minimum de 0 : elle descend à zéro et plus rien ne peut la redémarrer ; Microsoft recommande dans ce cas de créer une règle de mise à l'échelle ou de définir minReplicas sur 1 ou plus. ca-api a un minimum de 2 réplicas : deux réplicas restent donc toujours actifs. ca-web redémarre sur les requêtes HTTP, et ca-queue est démarrée par son scaler KEDA Service Bus."
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
