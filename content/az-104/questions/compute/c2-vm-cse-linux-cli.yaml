id: c2-vm-cse-linux-cli
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Ubuntu virtual machine named **VM2** in the resource group **RG2**. You need to install the Apache web server on VM2 by using the Custom Script Extension version 2. The command to run must be encrypted when it is sent to VM2.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Ubuntu nommée **VM2** dans le groupe de ressources **RG2**. Vous devez installer le serveur web Apache sur VM2 avec l'extension Custom Script version 2. La commande à exécuter doit être chiffrée lors de son envoi à VM2.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm extension set \
      --resource-group RG2 \
      --vm-name VM2 \
      --publisher [[pub]] \
      --name [[name]] \
      [[set]] '{"commandToExecute": "apt-get -y update && apt-get install -y apache2"}'
  slots:
    - id: pub
      options:
        - { id: ext, text: Microsoft.Azure.Extensions }
        - { id: comp, text: Microsoft.Compute }
        - { id: ostc, text: Microsoft.OSTCExtensions }
        - { id: mon, text: Microsoft.Azure.Monitor }
    - id: name
      options:
        - { id: cs, text: customScript }
        - { id: cse, text: CustomScriptExtension }
        - { id: run, text: RunCommandLinux }
        - { id: ama, text: AzureMonitorLinuxAgent }
    - id: set
      options:
        - { id: prot, text: "--protected-settings" }
        - { id: pubset, text: "--settings" }
        - { id: tags, text: "--tags" }
answer:
  values: { pub: ext, name: cs, set: prot }
explanation:
  correct:
    en: Version 2 of the Linux Custom Script Extension is published as `Microsoft.Azure.Extensions` with the type `CustomScript`. Protected settings are encrypted with a key known only to Azure and the VM, whereas public settings (`--settings`) are sent in clear text.
    fr: La version 2 de l'extension Custom Script pour Linux est publiée sous `Microsoft.Azure.Extensions` avec le type `CustomScript`. Les paramètres protégés sont chiffrés avec une clé connue uniquement d'Azure et de la machine virtuelle, alors que les paramètres publics (`--settings`) sont envoyés en clair.
  options:
    comp: { en: "`Microsoft.Compute` publishes `CustomScriptExtension`, the Windows version.", fr: "`Microsoft.Compute` publie `CustomScriptExtension`, la version pour Windows." }
    ostc: { en: "`Microsoft.OSTCExtensions` is the publisher of version 1 (`CustomScriptForLinux`).", fr: "`Microsoft.OSTCExtensions` est l'éditeur de la version 1 (`CustomScriptForLinux`)." }
    cse: { en: CustomScriptExtension is the Windows extension., fr: CustomScriptExtension est l'extension Windows. }
    pubset: { en: Public settings are not encrypted., fr: Les paramètres publics ne sont pas chiffrés. }
    run: { en: "RunCommandLinux is the Run Command extension, published by Microsoft.CPlat.Core, not the Custom Script Extension.", fr: "RunCommandLinux est l'extension Run Command, publiée par Microsoft.CPlat.Core, et non l'extension Custom Script." }
    ama: { en: AzureMonitorLinuxAgent is the Azure Monitor Agent extension; it does not run scripts., fr: AzureMonitorLinuxAgent est l'extension Azure Monitor Agent ; elle n'exécute pas de scripts. }
references:
  - title: Run Custom Script Extension on Linux VMs in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-linux
