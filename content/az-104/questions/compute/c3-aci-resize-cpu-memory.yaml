id: c3-aci-resize-cpu-memory
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a running Linux container group named **aci-etl** in Azure Container Instances. aci-etl was created with the following command:

    ```bash
    az container create --resource-group rg-etl --name aci-etl \
      --image fabrikam/etl:4.2 --cpu 1 --memory 1.5 --restart-policy Always
    ```

    The workload now needs 2 CPUs and 4 GB of memory. The regional quota allows these values.

    You need to give aci-etl the new resources.

    What should you do?
  fr: |
    Fabrikam dispose d'un groupe de conteneurs Linux en cours d'exécution nommé **aci-etl** dans Azure Container Instances. aci-etl a été créé avec la commande suivante :

    ```bash
    az container create --resource-group rg-etl --name aci-etl \
      --image fabrikam/etl:4.2 --cpu 1 --memory 1.5 --restart-policy Always
    ```

    La charge de travail a désormais besoin de 2 processeurs et de 4 Go de mémoire. Le quota régional autorise ces valeurs.

    Vous devez attribuer les nouvelles ressources à aci-etl.

    Que devez-vous faire ?
body:
  options:
    - id: recreate
      text: { en: "Delete aci-etl, and then create it again with `--cpu 2 --memory 4`.", fr: "Supprimer aci-etl, puis le recréer avec `--cpu 2 --memory 4`." }
    - id: update
      text: { en: "Run the same `az container create` command with `--cpu 2 --memory 4` to update aci-etl in place.", fr: "Exécuter la même commande `az container create` avec `--cpu 2 --memory 4` pour mettre à jour aci-etl sur place." }
    - id: autoscale
      text: { en: Configure an autoscale rule on aci-etl based on the CPU usage metric., fr: "Configurer une règle de mise à l'échelle automatique sur aci-etl basée sur la métrique d'utilisation du processeur." }
    - id: limit
      text: { en: Set a resource limit of 2 CPUs and 4 GB on the container while keeping the group's resource requests., fr: Définir une limite de ressources de 2 processeurs et 4 Go sur le conteneur en conservant les demandes de ressources du groupe. }
answer: { optionId: recreate }
explanation:
  correct:
    en: You update a container group by redeploying it with modified properties, but not every property supports updates. Changes to CPU, memory or GPU resources (like the OS type, restart policy or availability zone) require deleting the container group and creating it again. The new group is created from scratch, so its image layers are pulled again and its IP address might change.
    fr: "Vous mettez à jour un groupe de conteneurs en le redéployant avec des propriétés modifiées, mais toutes les propriétés ne prennent pas en charge la mise à jour. La modification des ressources processeur, mémoire ou GPU (comme celle du type de système d'exploitation, de la stratégie de redémarrage ou de la zone de disponibilité) exige de supprimer le groupe de conteneurs puis de le recréer. Le nouveau groupe est créé de zéro : ses couches d'image sont de nouveau récupérées et son adresse IP peut changer."
  options:
    update:
      en: An in-place update works for properties such as the image or DNS name label, but not for CPU or memory.
      fr: Une mise à jour sur place fonctionne pour des propriétés comme l'image ou l'étiquette de nom DNS, mais pas pour le processeur ni la mémoire.
    autoscale:
      en: Azure Container Instances doesn't support scaling of container groups.
      fr: Azure Container Instances ne prend pas en charge la mise à l'échelle des groupes de conteneurs.
    limit:
      en: A resource limit can't exceed the total resources allocated to the group, which equals the sum of the requests (1 CPU and 1.5 GB here).
      fr: Une limite de ressources ne peut pas dépasser le total des ressources allouées au groupe, égal à la somme des demandes (ici 1 processeur et 1,5 Go).
references:
  - title: Update container group
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-update
  - title: Introduction to container groups
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-container-groups
