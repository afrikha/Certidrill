id: c4-scale-automatic-cli
objective: "3.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an App Service plan named **plan-wingtip** in the Premium v3 P1v3 tier. The plan hosts a web app named **app-wingtip**. No Azure Monitor autoscale setting is configured.

    You need to use App Service automatic scaling so that:

    - the plan can scale out to a maximum of 20 instances based on incoming HTTP traffic;
    - app-wingtip always has at least 3 instances ready.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un plan App Service nommé **plan-wingtip** au niveau Premium v3 P1v3. Le plan héberge une application web nommée **app-wingtip**. Aucun paramètre de mise à l'échelle automatique Azure Monitor (autoscale) n'est configuré.

    Vous devez utiliser l'Automatic scaling d'App Service afin que :

    - le plan puisse effectuer un scale-out jusqu'à 20 instances au maximum en fonction du trafic HTTP entrant ;
    - app-wingtip dispose toujours d'au moins 3 instances prêtes.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az appservice plan update --resource-group rg-web --name plan-wingtip \
      [[enable]] true [[max]] 20

    az webapp update --resource-group rg-web --name app-wingtip \
      [[min]] 3
  slots:
    - id: enable
      options:
        - { id: elastic, text: "--elastic-scale" }
        - { id: persite, text: "--per-site-scaling" }
        - { id: async, text: "--async-scaling-enabled" }
    - id: max
      options:
        - { id: maxelastic, text: "--max-elastic-worker-count" }
        - { id: workers, text: "--number-of-workers" }
        - { id: burst, text: "--max-burst" }
    - id: min
      options:
        - { id: minelastic, text: "--minimum-elastic-instance-count" }
        - { id: prewarmed, text: "--prewarmed-instance-count" }
        - { id: workers2, text: "--number-of-workers" }
answer:
  values: { enable: elastic, max: maxelastic, min: minelastic }
explanation:
  correct:
    en: |
      `--elastic-scale true` turns on automatic scaling for the plan, and `--max-elastic-worker-count` sets the **Maximum burst** (the highest instance count the plan can reach based on HTTP traffic). At the app level, `--minimum-elastic-instance-count` sets the **Always ready instances**.
    fr: |
      `--elastic-scale true` active l'Automatic scaling pour le plan, et `--max-elastic-worker-count` définit la **Rafale maximale** (Maximum burst, le nombre d'instances le plus élevé que le plan peut atteindre selon le trafic HTTP). Au niveau de l'application, `--minimum-elastic-instance-count` définit les **Instances toujours prêtes** (Always ready instances).
  options:
    persite:
      en: |
        Per-app scaling limits apps to a subset of the plan's instances; it does not enable traffic-based scaling.
      fr: |
        La mise à l'échelle par application limite les applications à une partie des instances du plan ; elle n'active pas la mise à l'échelle basée sur le trafic.
    async:
      en: |
        `--async-scaling-enabled` lets a scale operation run asynchronously when not enough workers are available; it doesn't turn on automatic scaling.
      fr: |
        `--async-scaling-enabled` permet d'exécuter une opération de mise à l'échelle de façon asynchrone quand les workers disponibles sont insuffisants ; il n'active pas l'Automatic scaling.
    burst:
      en: |
        `--max-burst` is a parameter of `az functionapp plan` for Elastic Premium plans, not of `az appservice plan update`.
      fr: |
        `--max-burst` est un paramètre d'`az functionapp plan` pour les plans Elastic Premium, pas d'`az appservice plan update`.
    workers:
      en: |
        `--number-of-workers` sets a fixed instance count (manual scale-out), not a maximum.
      fr: |
        `--number-of-workers` définit un nombre fixe d'instances (scale-out manuel), pas un maximum.
    workers2:
      en: |
        `az webapp update` has no `--number-of-workers` parameter; the instance count of a plan is set at the plan level.
      fr: |
        `az webapp update` n'a pas de paramètre `--number-of-workers` ; le nombre d'instances d'un plan se définit au niveau du plan.
    prewarmed:
      en: |
        Prewarmed instances are a buffer of extra warmed instances (default 1), not the minimum number of ready instances.
      fr: |
        Les instances préchauffées sont une réserve d'instances supplémentaires prêtes (1 par défaut), pas le nombre minimal d'instances prêtes.
references:
  - title: "How to Enable Automatic Scaling"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-automatic-scaling
  - title: az appservice plan
    url: https://learn.microsoft.com/en-us/cli/azure/appservice/plan
