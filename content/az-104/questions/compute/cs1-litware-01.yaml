id: cs1-litware-01
objective: "3.4.8"
type: single
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    ASP-Desk now runs in a pricing tier that supports deployment slots, and you created the staging slot for app-litwaredesk.

    You need to meet the connection string requirement for the release process. What should you do?
  fr: |
    ASP-Desk s'exécute désormais dans un niveau tarifaire qui prend en charge les emplacements de déploiement, et vous avez créé l'emplacement staging pour app-litwaredesk.

    Vous devez satisfaire l'exigence relative aux chaînes de connexion pour le processus de mise en production. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In each slot, configure the connection string with its slot-specific value and select Deployment slot setting", fr: "Dans chaque emplacement, configurer la chaîne de connexion avec sa valeur propre à l'emplacement et cocher Paramètre d'emplacement de déploiement" } }
    - { id: b, text: { en: "Store both connection strings in Azure Key Vault and reference them from the app settings of the production slot", fr: "Stocker les deux chaînes de connexion dans Azure Key Vault et les référencer depuis les paramètres d'application de l'emplacement de production" } }
    - { id: c, text: { en: "Enable auto swap on the staging slot", fr: "Activer l'échange automatique sur l'emplacement staging" } }
    - { id: d, text: { en: "Always use Swap with preview instead of a direct swap", fr: "Toujours utiliser l'échange avec aperçu au lieu d'un échange direct" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An app setting or connection string marked as a deployment slot setting is sticky; it stays with its slot when the slots are swapped. Configuring StagingDb in the staging slot and ProductionDb in the production slot, both as slot settings, guarantees that a swap never moves them.
    fr: |
      Un paramètre d'application ou une chaîne de connexion marqué comme paramètre d'emplacement de déploiement est « collant » ; il reste attaché à son emplacement lors d'un échange. Configurer StagingDb dans l'emplacement staging et ProductionDb dans l'emplacement de production, tous deux comme paramètres d'emplacement, garantit qu'un échange ne les déplace jamais.
  options:
    b: { en: "A Key Vault reference only changes where the value is stored; unless it is marked as a slot setting, the setting still swaps.", fr: "Une référence Key Vault change seulement l'endroit où la valeur est stockée ; si elle n'est pas marquée comme paramètre d'emplacement, le paramètre est toujours échangé." }
    c: { en: "Auto swap automates the swap after each deployment; it does not keep settings in their slot.", fr: "L'échange automatique automatise l'échange après chaque déploiement ; il ne maintient pas les paramètres dans leur emplacement." }
    d: { en: "Swap with preview lets you validate the target settings before completing the swap, but non-sticky settings are still exchanged.", fr: "L'échange avec aperçu permet de valider les paramètres cibles avant de terminer l'échange, mais les paramètres non collants sont tout de même échangés." }
references:
  - title: Set up staging environments - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
