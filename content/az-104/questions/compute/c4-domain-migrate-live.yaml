id: c4-domain-migrate-live
objective: "3.4.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    The site **www.northwind.com** is served by an on-premises web server. The www record at the DNS provider is a CNAME that points to the on-premises server. You have a PFX certificate for www.northwind.com issued by a public certificate authority.

    You migrate the site to a web app named **app-northwind** that runs on an App Service plan in the Standard S1 tier.

    You need to move www.northwind.com to app-northwind without any DNS or HTTPS downtime.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le site **www.northwind.com** est servi par un serveur web local. L'enregistrement www chez le fournisseur DNS est un CNAME qui pointe vers le serveur local. Vous disposez d'un certificat PFX pour www.northwind.com émis par une autorité de certification publique.

    Vous migrez le site vers une application web nommée **app-northwind** qui s'exécute sur un plan App Service de niveau Standard S1.

    Vous devez déplacer www.northwind.com vers app-northwind sans aucune interruption DNS ni HTTPS.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: txt
      text:
        en: At the DNS provider, create a TXT record for asuid.www that contains the domain verification ID of app-northwind.
        fr: Chez le fournisseur DNS, créer un enregistrement TXT pour asuid.www contenant l'ID de vérification de domaine d'app-northwind.
    - id: add
      text:
        en: In app-northwind, add and validate the custom domain www.northwind.com and select Add certificate later.
        fr: Dans app-northwind, ajouter et valider le domaine personnalisé www.northwind.com en sélectionnant Add certificate later.
    - id: bind
      text:
        en: Upload the PFX certificate to app-northwind and add an SNI SSL binding for www.northwind.com.
        fr: Charger le certificat PFX dans app-northwind et ajouter une liaison SNI SSL pour www.northwind.com.
    - id: cname
      text:
        en: Update the www CNAME record so that it points to app-northwind.azurewebsites.net.
        fr: Modifier l'enregistrement CNAME www pour qu'il pointe vers app-northwind.azurewebsites.net.
    - id: managed
      text:
        en: Create an App Service managed certificate for www.northwind.com.
        fr: Créer un certificat managé App Service pour www.northwind.com.
    - id: delete
      text:
        en: Delete the existing www record at the DNS provider.
        fr: Supprimer l'enregistrement www existant chez le fournisseur DNS.
answer:
  sequence: [txt, add, bind, cname]
explanation:
  correct:
    en: |
      To migrate an active domain, you bind it to the app before you change DNS: the asuid.www TXT record alone lets App Service validate ownership while traffic still goes to the old server. You then secure the domain with the existing certificate, and only then remap the CNAME, so users reach a fully configured app with no DNS or certificate gap.
    fr: |
      Pour migrer un domaine actif, vous le liez à l'application avant de modifier le DNS : l'enregistrement TXT asuid.www suffit à App Service pour valider la propriété pendant que le trafic va encore vers l'ancien serveur. Vous sécurisez ensuite le domaine avec le certificat existant, puis seulement vous remappez le CNAME : les utilisateurs atteignent ainsi une application entièrement configurée, sans interruption DNS ni de certificat.
  options:
    managed:
      en: |
        A managed certificate can be added to a migrated live domain only after the DNS name is remapped to the app, and the existing PFX already meets the need.
      fr: |
        Un certificat managé ne peut être ajouté à un domaine actif migré qu'après le remappage du nom DNS vers l'application, et le PFX existant répond déjà au besoin.
    delete:
      en: |
        Deleting the record would cause DNS resolution downtime; you modify it instead.
      fr: |
        Supprimer l'enregistrement provoquerait une interruption de la résolution DNS ; vous le modifiez plutôt.
references:
  - title: "Migrate an Active Domain"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-custom-dns-migrate-domain
