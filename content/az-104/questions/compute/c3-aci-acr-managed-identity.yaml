id: c3-aci-acr-managed-identity
objective: "3.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Premium Azure container registry named **crcontoso01** that stores an image named `web/api:3.0`. The registry's role assignment permissions mode is **RBAC Registry Permissions**, and the admin user is disabled.

    You need to deploy a container group named **aci-api** in Azure Container Instances from this image. The image pull must authenticate without any username or password, and the admin user must stay disabled.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un registre de conteneurs Azure Premium nommé **crcontoso01** qui stocke une image nommée `web/api:3.0`. Le mode d'autorisations d'attribution de rôle du registre est **RBAC Registry Permissions**, et l'utilisateur administrateur est désactivé.

    Vous devez déployer un groupe de conteneurs nommé **aci-api** dans Azure Container Instances à partir de cette image. La récupération de l'image doit s'authentifier sans nom d'utilisateur ni mot de passe, et l'utilisateur administrateur doit rester désactivé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: Create a user-assigned managed identity., fr: Créer une identité managée affectée par l'utilisateur. } }
    - { id: role, text: { en: Assign the AcrPull role to the identity at the scope of crcontoso01., fr: Attribuer le rôle AcrPull à l'identité dans l'étendue de crcontoso01. } }
    - { id: deploy, text: { en: "Run `az container create` with `--assign-identity` and `--acr-identity` set to the identity's resource ID.", fr: "Exécuter `az container create` avec `--assign-identity` et `--acr-identity` définis sur l'ID de ressource de l'identité." } }
    - { id: system, text: { en: Deploy aci-api with a system-assigned managed identity and rely on it for the image pull., fr: Déployer aci-api avec une identité managée affectée par le système et l'utiliser pour la récupération de l'image. } }
    - { id: reader, text: { en: Assign the Reader role to the identity on the resource group that contains crcontoso01., fr: Attribuer le rôle Reader à l'identité sur le groupe de ressources qui contient crcontoso01. } }
    - { id: admin, text: { en: Enable the admin user and pass its password with `--registry-password`., fr: "Activer l'utilisateur administrateur et passer son mot de passe avec `--registry-password`." } }
answer:
  sequence: [create, role, deploy]
explanation:
  correct:
    en: Azure Container Instances authenticates image pulls from Azure Container Registry with a user-assigned managed identity. You create the identity, grant it AcrPull on the registry so that it can pull images, and then create the container group with the identity assigned (`--assign-identity`) and designated for registry authentication (`--acr-identity`).
    fr: "Azure Container Instances authentifie la récupération d'images depuis Azure Container Registry avec une identité managée affectée par l'utilisateur. Vous créez l'identité, vous lui accordez AcrPull sur le registre pour qu'elle puisse récupérer des images, puis vous créez le groupe de conteneurs en lui affectant l'identité (`--assign-identity`) et en la désignant pour l'authentification auprès du registre (`--acr-identity`)."
  options:
    system: { en: ACI does not support image pulls from ACR authenticated with a system-assigned managed identity., fr: ACI ne prend pas en charge la récupération d'images depuis ACR authentifiée par une identité managée affectée par le système. }
    reader: { en: Reader grants control plane read access only; it does not allow pulling images., fr: Reader accorde uniquement un accès en lecture au plan de contrôle ; il ne permet pas de récupérer des images. }
    admin: { en: The admin user relies on a password and must stay disabled., fr: L'utilisateur administrateur repose sur un mot de passe et doit rester désactivé. }
references:
  - title: Deploy container image from Azure Container Registry using a managed identity
    url: https://learn.microsoft.com/en-us/azure/container-instances/using-azure-container-registry-mi
