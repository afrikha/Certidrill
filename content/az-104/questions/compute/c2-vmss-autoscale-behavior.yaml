id: c2-vmss-autoscale-behavior
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Virtual Machine Scale Set named **VMSS4** has the following autoscale profile:

    - Minimum: 2 instances, maximum: 10 instances, default: 2 instances
    - Scale-out rule: increase the count by 3 when the average Percentage CPU is greater than 70% over 5 minutes
    - Scale-in rule: decrease the count by 1 when the average Percentage CPU is less than 30% over 5 minutes

    VMSS4 currently runs 9 instances, and the average CPU usage stays at 85% for 15 minutes.

    Which two statements are true? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de machines virtuelles identiques nommé **VMSS4** a le profil de mise à l'échelle automatique suivant :

    - Minimum : 2 instances, maximum : 10 instances, par défaut : 2 instances
    - Règle de scale-out : augmenter le nombre d'instances de 3 lorsque la moyenne de Percentage CPU dépasse 70 % pendant 5 minutes
    - Règle de scale-in : diminuer le nombre d'instances de 1 lorsque la moyenne de Percentage CPU est inférieure à 30 % pendant 5 minutes

    VMSS4 exécute actuellement 9 instances, et l'utilisation moyenne du processeur reste à 85 % pendant 15 minutes.

    Quelles sont les deux affirmations vraies ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "VMSS4 scales out to 10 instances.", fr: "VMSS4 effectue un scale-out jusqu'à 10 instances." } }
    - { id: b, text: { en: Autoscale never reduces VMSS4 to fewer than 2 instances., fr: "La mise à l'échelle automatique ne réduit jamais VMSS4 à moins de 2 instances." } }
    - { id: c, text: { en: "VMSS4 scales out to 12 instances.", fr: "VMSS4 effectue un scale-out jusqu'à 12 instances." } }
    - { id: d, text: { en: "When the CPU usage drops below 30%, VMSS4 immediately returns to 2 instances.", fr: "Lorsque l'utilisation du processeur passe sous 30 %, VMSS4 revient immédiatement à 2 instances." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The instance limits of the profile bound every autoscale action. A scale-out of 3 from 9 instances would exceed the maximum, so the count stops at 10. Likewise, scale-in actions never go below the minimum of 2 instances.
    fr: Les limites d'instances du profil encadrent chaque action de mise à l'échelle automatique. Un scale-out de 3 à partir de 9 instances dépasserait le maximum ; le nombre s'arrête donc à 10. De même, les actions de scale-in ne descendent jamais sous le minimum de 2 instances.
  options:
    c:
      en: Autoscale never exceeds the maximum instance count of the profile.
      fr: La mise à l'échelle automatique ne dépasse jamais le nombre maximal d'instances du profil.
    d:
      en: The scale-in rule removes one instance each time it triggers, so the count decreases gradually.
      fr: La règle de scale-in supprime une instance à chaque déclenchement ; le nombre diminue donc progressivement.
references:
  - title: Tutorial - Autoscale a scale set with the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/tutorial-autoscale-cli
