series: sr-06-appservice-autoscale
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You scale up ASP1 to the Basic B3 pricing tier.
  fr: |
    Vous effectuez un scale-up d'ASP1 vers le niveau tarifaire Basic B3.
body:
  solution:
    en: |
      You scale up ASP1 from **B1** to **B3** to give the instance more CPU cores and memory.
    fr: |
      Vous effectuez un scale-up d'ASP1 de **B1** vers **B3** pour donner plus de cœurs de processeur et de mémoire à l'instance.
answer: { value: false }
explanation:
  correct:
    en: |
      Scaling up changes the size of the instances, not their number. ASP1 still runs a single instance with no automatic scale-out, and the Basic tier doesn't support autoscale or 8 instances, so the goal isn't met.
    fr: |
      Un scale-up change la taille des instances, pas leur nombre. ASP1 exécute toujours une seule instance sans scale-out automatique, et le niveau Basic ne prend en charge ni la mise à l'échelle automatique ni 8 instances : l'objectif n'est pas atteint.
references:
  - title: "Scale up features and capacities - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
