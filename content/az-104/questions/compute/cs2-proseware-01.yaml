id: cs2-proseware-01
objective: "3.4.2"
type: single
caseStudy: cs2-proseware
difficulty: 3
status: draft
stem:
  en: |
    You scale up ASP-Portal to the Standard S1 pricing tier. You need to configure scaling for app-pw-portal to meet the technical requirements. The administrators already review the scaling configuration of ASP-Portal every July, before the next enrollment periods. The solution must minimize costs and administrative effort.

    What should you configure for ASP-Portal?
  fr: |
    Vous effectuez un scale-up d'ASP-Portal vers le niveau tarifaire Standard S1. Vous devez configurer la mise à l'échelle d'app-pw-portal pour satisfaire les exigences techniques. Les administrateurs révisent déjà chaque année en juillet la configuration de mise à l'échelle d'ASP-Portal, avant les périodes d'inscription suivantes. La solution doit réduire au minimum les coûts et l'effort d'administration.

    Que devez-vous configurer pour ASP-Portal ?
body:
  options:
    - { id: a, text: { en: "An autoscale setting with a 2–4 instance default profile and 6–10 instance fixed-date profiles for the enrollment periods, each with CPU rules", fr: "Un paramètre de mise à l'échelle automatique avec un profil par défaut de 2 à 4 instances et des profils à date fixe de 6 à 10 instances pour les périodes d'inscription, chacun avec des règles d'UC" } }
    - { id: b, text: { en: "An autoscale setting with a 2–4 instance default profile and a 6–10 instance recurring profile for the enrollment periods, each with CPU rules", fr: "Un paramètre de mise à l'échelle automatique avec un profil par défaut de 2 à 4 instances et un profil récurrent de 6 à 10 instances pour les périodes d'inscription, chacun avec des règles d'UC" } }
    - { id: c, text: { en: "An autoscale setting with a single 2–10 instance default profile and CPU scale-out and scale-in rules", fr: "Un paramètre de mise à l'échelle automatique avec un seul profil par défaut de 2 à 10 instances et des règles de scale-out et de scale-in sur l'UC" } }
    - { id: d, text: { en: "Automatic scaling on ASP-Portal with 6 always-ready instances and a maximum burst of 10 instances", fr: "La mise à l'échelle automatique (Automatic scaling) sur ASP-Portal avec 6 instances toujours prêtes et une rafale maximale de 10 instances" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An autoscale setting can contain several profiles, each with its own instance limits and rules. Fixed-date profiles apply to a specific date and time range, such as August 15 to September 30, and take precedence over the default profile, which applies the rest of the year. Each profile keeps CPU-based scale-out and scale-in rules within its own limits. Because a fixed-date profile targets specific dates, its dates must be updated each year; the administrators do this during their yearly July review, and no other option can enforce limits for calendar date ranges.
    fr: |
      Un paramètre de mise à l'échelle automatique peut contenir plusieurs profils, chacun avec ses propres limites d'instances et ses règles. Les profils à date fixe s'appliquent à une plage de dates et d'heures précise, comme du 15 août au 30 septembre, et sont prioritaires sur le profil par défaut, qui s'applique le reste de l'année. Chaque profil conserve des règles de scale-out et de scale-in fondées sur l'UC, dans ses propres limites. Comme un profil à date fixe cible des dates précises, ses dates doivent être mises à jour chaque année ; les administrateurs le font lors de leur révision annuelle de juillet, et aucune autre option ne peut appliquer des limites à des plages de dates du calendrier.
  options:
    b: { en: "A recurring profile repeats only on selected days of the week, so it cannot target the August-September and January date ranges.", fr: "Un profil récurrent se répète uniquement certains jours de la semaine ; il ne peut donc pas cibler les plages de dates d'août-septembre et de janvier." }
    c: { en: "A single 2–10 profile does not guarantee 6 instances during the enrollment periods and lets the plan grow beyond 4 instances the rest of the year.", fr: "Un seul profil de 2 à 10 ne garantit pas 6 instances pendant les périodes d'inscription et laisse le plan dépasser 4 instances le reste de l'année." }
    d: { en: "Automatic scaling is available only in the Premium v2, v3, and v4 tiers, and it scales on HTTP traffic, not on CPU usage.", fr: "La mise à l'échelle automatique (Automatic scaling) n'est disponible qu'aux niveaux Premium v2, v3 et v4, et elle réagit au trafic HTTP, pas à l'utilisation de l'UC." }
references:
  - title: "Autoscale with Multiple Profiles - Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-multiprofile
  - title: "How to Enable Automatic Scaling - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-automatic-scaling
