id: cs2-proseware-01
objective: "3.4.2"
type: single
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: You need to meet the scaling requirement for app-pw-portal. The solution must minimize costs. What should you do first?
  fr: Vous devez satisfaire l'exigence de mise à l'échelle d'app-pw-portal. La solution doit réduire les coûts au minimum. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Scale up ASP-Portal to the Standard S1 pricing tier", fr: "Effectuer un scale-up d'ASP-Portal vers le niveau tarifaire Standard S1" } }
    - { id: b, text: { en: "Scale up ASP-Portal to the Basic B3 pricing tier", fr: "Effectuer un scale-up d'ASP-Portal vers le niveau tarifaire Basic B3" } }
    - { id: c, text: { en: "Create an autoscale setting with a CPU rule on the current ASP-Portal plan", fr: "Créer un paramètre de mise à l'échelle automatique avec une règle d'UC sur le plan ASP-Portal actuel" } }
    - { id: d, text: { en: "Set the instance count of ASP-Portal manually to 10", fr: "Définir manuellement le nombre d'instances d'ASP-Portal sur 10" } }
answer: { optionId: a }
explanation:
  correct:
    en: Rule-based autoscale requires the Standard tier or higher, and the Standard tier scales out to up to 10 instances, which matches requirement 3. Standard S1 is the least expensive tier that meets the requirement; after scaling up, you create the autoscale rule based on CPU percentage.
    fr: La mise à l'échelle automatique basée sur des règles exige le niveau Standard ou supérieur, et le niveau Standard monte jusqu'à 10 instances, ce qui correspond à l'exigence 3. Standard S1 est le niveau le moins cher qui satisfait l'exigence ; après le scale-up, vous créez la règle de mise à l'échelle automatique basée sur le pourcentage d'UC.
  options:
    b: { en: "All Basic plans support only manual scale-out, up to 3 instances.", fr: "Tous les plans Basic ne prennent en charge que le scale-out manuel, jusqu'à 3 instances." }
    c: { en: "Autoscale is not available in the Basic tier.", fr: "La mise à l'échelle automatique n'est pas disponible dans le niveau Basic." }
    d: { en: "A Basic plan is limited to 3 instances, and a fixed count of 10 instances would not scale automatically and would increase costs outside the peaks.", fr: "Un plan Basic est limité à 3 instances, et un nombre fixe de 10 instances ne s'adapterait pas automatiquement et augmenterait les coûts hors pointe." }
references:
  - title: "Scale Up Features and Capacities - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
  - title: "Get started with autoscale in Azure - Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
