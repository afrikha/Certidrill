id: c2-avail-update-domains
objective: "3.2.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You create an availability set named **AS2** with 2 fault domains and 5 update domains. You then deploy 18 virtual machines named VM1 to VM18, in that order, to AS2.

    During planned maintenance of the Azure platform, what is the maximum number of VMs in AS2 that can be restarted at the same time?
  fr: |
    Vous créez un groupe à haute disponibilité nommé **AS2** avec 2 domaines d'erreur et 5 domaines de mise à jour. Vous déployez ensuite 18 machines virtuelles nommées VM1 à VM18, dans cet ordre, dans AS2.

    Pendant une maintenance planifiée de la plateforme Azure, quel est le nombre maximal de machines virtuelles d'AS2 qui peuvent être redémarrées en même temps ?
body:
  options:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "9" }
answer: { optionId: c }
explanation:
  correct:
    en: VMs are placed in the five update domains in turn - VM1 to VM5 in separate update domains, VM6 with VM1, VM7 with VM2, and so on. The first three update domains therefore hold four VMs each (for example VM1, VM6, VM11 and VM16) and the last two hold three. During planned maintenance only one update domain is restarted at a time, so at most four VMs restart together.
    fr: "Les machines virtuelles sont placées à tour de rôle dans les cinq domaines de mise à jour : VM1 à VM5 dans des domaines distincts, VM6 avec VM1, VM7 avec VM2, et ainsi de suite. Les trois premiers domaines de mise à jour contiennent donc quatre machines virtuelles chacun (par exemple VM1, VM6, VM11 et VM16) et les deux derniers en contiennent trois. Pendant une maintenance planifiée, un seul domaine de mise à jour est redémarré à la fois ; au maximum quatre machines virtuelles redémarrent donc ensemble."
  options:
    a:
      en: Two is the number of fault domains; fault domains relate to hardware failures, not to how many VMs planned maintenance restarts.
      fr: Deux est le nombre de domaines d'erreur ; les domaines d'erreur concernent les pannes matérielles, pas le nombre de machines virtuelles redémarrées par une maintenance planifiée.
    b:
      en: 18 VMs do not divide evenly into five update domains; three update domains receive a fourth VM.
      fr: 18 machines virtuelles ne se répartissent pas uniformément sur cinq domaines de mise à jour ; trois domaines de mise à jour reçoivent une quatrième machine.
    d:
      en: Nine VMs share each fault domain, but fault domains relate to hardware failures, not to planned maintenance.
      fr: Neuf machines virtuelles partagent chaque domaine d'erreur, mais les domaines d'erreur concernent les pannes matérielles, pas la maintenance planifiée.
references:
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
