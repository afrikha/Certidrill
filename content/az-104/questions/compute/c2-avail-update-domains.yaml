id: c2-avail-update-domains
objective: "3.2.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You create an availability set named **AS2** with 2 fault domains and 5 update domains. You then deploy seven virtual machines named VM1 to VM7, in that order, to AS2.

    During planned maintenance of the Azure platform, what is the maximum number of VMs in AS2 that can be restarted at the same time?
  fr: |
    Vous créez un groupe à haute disponibilité nommé **AS2** avec 2 domaines d'erreur et 5 domaines de mise à jour. Vous déployez ensuite sept machines virtuelles nommées VM1 à VM7, dans cet ordre, dans AS2.

    Pendant une maintenance planifiée de la plateforme Azure, quel est le nombre maximal de machines virtuelles d'AS2 qui peuvent être redémarrées en même temps ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "7" }
answer: { optionId: b }
explanation:
  correct:
    en: With five update domains, VM1 to VM5 go to separate update domains, then VM6 shares the update domain of VM1 and VM7 the one of VM2. During planned maintenance only one update domain is restarted at a time, so at most two VMs restart together.
    fr: Avec cinq domaines de mise à jour, VM1 à VM5 sont placées dans des domaines distincts, puis VM6 partage le domaine de mise à jour de VM1 et VM7 celui de VM2. Pendant une maintenance planifiée, un seul domaine de mise à jour est redémarré à la fois ; au maximum deux machines virtuelles redémarrent donc ensemble.
  options:
    a:
      en: Two update domains contain two VMs each, so restarting one of them affects two VMs.
      fr: Deux domaines de mise à jour contiennent chacun deux machines virtuelles ; le redémarrage de l'un d'eux touche donc deux machines.
    c:
      en: Four VMs share a fault domain, but fault domains relate to hardware failures, not to planned maintenance.
      fr: Quatre machines virtuelles partagent un domaine d'erreur, mais les domaines d'erreur concernent les pannes matérielles, pas la maintenance planifiée.
    d:
      en: Update domains exist precisely to prevent all the VMs from restarting at the same time.
      fr: Les domaines de mise à jour existent précisément pour éviter que toutes les machines virtuelles redémarrent en même temps.
references:
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
