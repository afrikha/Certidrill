id: cs2-wingtip-01
objective: "3.3.1"
type: single
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You change crwingtip to the Premium service tier and add a replica in West US. You need to complete the configuration of crwingtip to meet the network part of the technical requirement. The solution must minimize costs.

    What should you do?
  fr: |
    Vous faites passer crwingtip au niveau de service Premium et ajoutez un réplica dans West US. Vous devez terminer la configuration de crwingtip pour satisfaire la partie réseau de l'exigence technique. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one private endpoint for crwingtip in VNet-Shop, integrated with the privatelink.azurecr.io zone, and disable public network access", fr: "Créer un point de terminaison privé pour crwingtip dans VNet-Shop, intégré à la zone privatelink.azurecr.io, et désactiver l'accès réseau public" } }
    - { id: b, text: { en: "Create one private endpoint per replica, in East US and in West US, and disable public network access", fr: "Créer un point de terminaison privé par réplica, dans East US et dans West US, et désactiver l'accès réseau public" } }
    - { id: c, text: { en: "Create one private endpoint for crwingtip in VNet-Shop, and add the address space of VNet-Shop to the registry firewall", fr: "Créer un point de terminaison privé pour crwingtip dans VNet-Shop, et ajouter l'espace d'adressage de VNet-Shop au pare-feu du registre" } }
    - { id: d, text: { en: "Disable public network access, and allow trusted Microsoft services to access crwingtip", fr: "Désactiver l'accès réseau public, et autoriser les services Microsoft approuvés à accéder à crwingtip" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A single private endpoint in VNet-Shop receives a private IP address for the registry endpoint and one for the data endpoint of each geo-replica, so the container apps can pull from both regions privately. The privatelink.azurecr.io zone, linked to VNet-Shop, resolves crwingtip.azurecr.io and its data endpoints to these addresses. Disabling public network access then leaves the private endpoint as the only way in.
    fr: |
      Un seul point de terminaison privé dans VNet-Shop reçoit une adresse IP privée pour le point de terminaison du registre et une pour le point de terminaison de données de chaque géoréplica ; les applications de conteneur peuvent donc extraire les images des deux régions de manière privée. La zone privatelink.azurecr.io, liée à VNet-Shop, résout crwingtip.azurecr.io et ses points de terminaison de données vers ces adresses. La désactivation de l'accès réseau public laisse ensuite le point de terminaison privé comme seul accès.
  options:
    b: { en: "One private endpoint already covers the data endpoints of all the replicas; a second one adds cost, and the requirement is access from VNet-Shop.", fr: "Un seul point de terminaison privé couvre déjà les points de terminaison de données de tous les réplicas ; un second ajoute des coûts, et l'exigence porte sur l'accès depuis VNet-Shop." }
    c: { en: "The registry firewall accepts only public IP addresses, and keeping public network access enabled does not make the registry private-only.", fr: "Le pare-feu du registre n'accepte que des adresses IP publiques, et laisser l'accès réseau public activé ne rend pas le registre accessible uniquement en privé." }
    d: { en: "The trusted services exception covers specific Azure services, not Azure Container Apps; without a private endpoint, the apps could not reach the registry.", fr: "L'exception des services approuvés couvre certains services Azure, pas Azure Container Apps ; sans point de terminaison privé, les applications ne pourraient pas joindre le registre." }
references:
  - title: "Set Up Private Endpoint with Private Link - Azure Container Registry"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-private-link
  - title: "Azure Container Registry SKU Features and Limits - Azure Container Registry"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
