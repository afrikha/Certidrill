id: cs2-wingtip-01
objective: "3.3.1"
type: single
caseStudy: cs2-wingtip
difficulty: 1
status: draft
stem:
  en: You need to meet the technical requirement for crwingtip. The solution must minimize costs. What should you do first?
  fr: Vous devez satisfaire l'exigence technique concernant crwingtip. La solution doit réduire les coûts au minimum. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the service tier of crwingtip to Premium", fr: "Changer le niveau de service de crwingtip en Premium" } }
    - { id: b, text: { en: "Create a second Standard registry in West US and an import task", fr: "Créer un second registre Standard dans West US et une tâche d'importation" } }
    - { id: c, text: { en: "Change the service tier of crwingtip to Basic", fr: "Changer le niveau de service de crwingtip en Basic" } }
    - { id: d, text: { en: "Create a private endpoint for crwingtip in snet-vm", fr: "Créer un point de terminaison privé pour crwingtip dans snet-vm" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Geo-replication and private endpoints are available only in the Premium service tier of Azure Container Registry. You can change the tier of an existing registry without downtime, then add a West US replica and the private endpoint.
    fr: |
      La géoréplication et les points de terminaison privés ne sont disponibles que dans le niveau de service Premium d'Azure Container Registry. Vous pouvez changer le niveau d'un registre existant sans interruption, puis ajouter un réplica dans West US et le point de terminaison privé.
  options:
    b: { en: "A second registry must be managed separately and still cannot use private endpoints in the Standard tier.", fr: "Un second registre doit être géré séparément et ne peut toujours pas utiliser de points de terminaison privés au niveau Standard." }
    c: { en: "The Basic tier supports neither geo-replication nor private endpoints.", fr: "Le niveau Basic ne prend en charge ni la géoréplication ni les points de terminaison privés." }
    d: { en: "A Standard registry does not support private endpoints; the tier must be changed first.", fr: "Un registre Standard ne prend pas en charge les points de terminaison privés ; il faut d'abord changer de niveau." }
references:
  - title: "Azure Container Registry SKU Features and Limits - Azure Container Registry"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
