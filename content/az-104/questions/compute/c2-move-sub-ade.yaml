id: c2-move-sub-ade
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure subscriptions named **Sub1** and **Sub2** that are associated with the same Microsoft Entra tenant. Sub1 contains a Windows virtual machine named **VM6** that is encrypted by using Azure Disk Encryption with a key vault named **KV1**.

    You need to move VM6 and its dependent resources to Sub2.

    What should you do first?
  fr: |
    Vous disposez de deux abonnements Azure nommés **Sub1** et **Sub2** associés au même locataire Microsoft Entra. Sub1 contient une machine virtuelle Windows nommée **VM6** chiffrée avec Azure Disk Encryption à l'aide d'un coffre de clés nommé **KV1**.

    Vous devez déplacer VM6 et ses ressources dépendantes vers Sub2.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Disable Azure Disk Encryption on VM6.", fr: "Désactiver Azure Disk Encryption sur VM6." }
    - id: b
      text: { en: "Stop and deallocate VM6.", fr: "Arrêter et libérer VM6." }
    - id: c
      text: { en: "Move KV1 to Sub2.", fr: "Déplacer KV1 vers Sub2." }
    - id: d
      text: { en: "Add VM6 to a move collection in Azure Resource Mover.", fr: "Ajouter VM6 à une collection de déplacement dans Azure Resource Mover." }
answer: { optionId: a }
explanation:
  correct:
    en: A VM that uses Azure Disk Encryption can be moved to another resource group while it is deallocated, but it can't be moved to another subscription while encryption is enabled. You must first disable encryption, for example with `Disable-AzVMDiskEncryption` or `az vm encryption disable`, and then move the VM with its dependent resources.
    fr: Une machine virtuelle qui utilise Azure Disk Encryption peut être déplacée vers un autre groupe de ressources lorsqu'elle est libérée, mais elle ne peut pas être déplacée vers un autre abonnement tant que le chiffrement est activé. Vous devez d'abord désactiver le chiffrement, par exemple avec `Disable-AzVMDiskEncryption` ou `az vm encryption disable`, puis déplacer la machine virtuelle avec ses ressources dépendantes.
  options:
    b:
      en: Deallocation is enough for a move between resource groups, not for a move to another subscription.
      fr: La libération suffit pour un déplacement entre groupes de ressources, pas pour un déplacement vers un autre abonnement.
    c:
      en: Moving the key vault does not lift the restriction on encrypted VMs across subscriptions.
      fr: Déplacer le coffre de clés ne lève pas la restriction qui s'applique aux machines virtuelles chiffrées entre abonnements.
    d:
      en: Azure Resource Mover is designed to move resources across regions; using it does not remove the need to disable encryption before a move to another subscription.
      fr: Azure Resource Mover est conçu pour déplacer des ressources entre régions ; l'utiliser ne supprime pas la nécessité de désactiver le chiffrement avant un déplacement vers un autre abonnement.
references:
  - title: Special cases to move Azure VMs to new subscription or resource group
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/virtual-machines-move-limitations
