id: cs3-margiestravel-03
objective: "3.4.5"
type: dragdrop
caseStudy: cs3-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to create the DNS records required to map both host names to app-booking-we.

    Which record type should you create for each purpose? To answer, drag the appropriate record types to the correct purposes. Each record type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer les enregistrements DNS nécessaires pour mapper les deux noms d'hôte à app-booking-we.

    Quel type d'enregistrement devez-vous créer pour chaque objectif ? Pour répondre, faites glisser les types d'enregistrements appropriés vers les objectifs correspondants. Chaque type d'enregistrement peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: a, text: "A" }
    - { id: aaaa, text: "AAAA" }
    - { id: cname, text: "CNAME" }
    - { id: mx, text: "MX" }
    - { id: ns, text: "NS" }
    - { id: txt, text: "TXT" }
  targets:
    - { id: wwwmap, text: { en: "Point www.margiestravel.com to app-booking-we.azurewebsites.net", fr: "Faire pointer www.margiestravel.com vers app-booking-we.azurewebsites.net" } }
    - { id: wwwver, text: { en: "Record named asuid.www that contains the domain verification ID", fr: "Enregistrement nommé asuid.www qui contient l'ID de vérification de domaine" } }
    - { id: apexmap, text: { en: "Point margiestravel.com (apex) to the inbound IP address of app-booking-we", fr: "Faire pointer margiestravel.com (apex) vers l'adresse IP entrante d'app-booking-we" } }
    - { id: apexver, text: { en: "Record named asuid that contains the domain verification ID", fr: "Enregistrement nommé asuid qui contient l'ID de vérification de domaine" } }
answer:
  mapping: { wwwmap: cname, wwwver: txt, apexmap: a, apexver: txt }
explanation:
  correct:
    en: "A subdomain such as www is mapped with a CNAME record to the default host name of the app. The apex domain can't have a CNAME record, so it uses an A record with the app's inbound IP address. For both, App Service checks ownership with a TXT record named asuid.<subdomain> or asuid that contains the domain verification ID."
    fr: "Un sous-domaine comme www est mappé avec un enregistrement CNAME vers le nom d'hôte par défaut de l'application. Le domaine apex ne peut pas avoir d'enregistrement CNAME : il utilise un enregistrement A avec l'adresse IP entrante de l'application. Dans les deux cas, App Service vérifie la propriété avec un enregistrement TXT nommé asuid.<sous-domaine> ou asuid qui contient l'ID de vérification de domaine."
references:
  - title: "Set up an existing custom domain name for your app - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
