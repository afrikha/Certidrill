id: cs1-litware-03
objective: "3.3.1"
type: yesno_statements
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    You plan to modify crlitware to meet the container image requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de modifier crlitware pour satisfaire l'exigence relative aux images conteneur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: |
          You must change crlitware to the Premium service tier before you can add a replica in West Europe.
        fr: |
          Vous devez faire passer crlitware au niveau de service Premium avant de pouvoir ajouter un réplica dans West Europe.
    - id: s2
      text:
        en: |
          After geo-replication is configured, the workers in West Europe must use a different registry login server name than the workers in Canada Central.
        fr: |
          Une fois la géoréplication configurée, les conteneurs de traitement de West Europe doivent utiliser un nom de serveur de connexion du registre différent de celui des conteneurs de Canada Central.
    - id: s3
      text:
        en: |
          The Standard service tier supports private endpoints for crlitware.
        fr: |
          Le niveau de service Standard prend en charge les points de terminaison privés pour crlitware.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Geo-replication and Private Link with private endpoints are Premium-only features of Azure Container Registry, so crlitware must move from Basic to Premium. A geo-replicated registry keeps a single login server name (crlitware.azurecr.io), and pulls are routed to the closest replica.
    fr: |
      La géoréplication et Private Link avec des points de terminaison privés sont des fonctionnalités réservées au niveau Premium d'Azure Container Registry ; crlitware doit donc passer de Basic à Premium. Un registre géorépliqué conserve un seul nom de serveur de connexion (crlitware.azurecr.io), et les extractions sont dirigées vers le réplica le plus proche.
  options:
    s2: { en: "Geo-replication manages a single registry across regions with one login server name; this is what the single registry name requirement relies on.", fr: "La géoréplication gère un registre unique sur plusieurs régions avec un seul nom de serveur de connexion ; c'est ce qui permet de respecter l'exigence d'un nom de registre unique." }
    s3: { en: "Private endpoints require the Premium tier.", fr: "Les points de terminaison privés exigent le niveau Premium." }
references:
  - title: Geo-replication in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
