id: c4-webapp-create-facts
objective: "3.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a Linux App Service plan named **plan-contoso** in the West Europe region. The plan is in the Basic B1 tier and is in a resource group named **RG1**.

    You plan to create web apps by using the Azure portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous disposez d'un plan App Service Linux nommé **plan-contoso** dans la région West Europe. Le plan est au niveau Basic B1 et se trouve dans un groupe de ressources nommé **RG1**.

    Vous prévoyez de créer des applications web à l'aide du portail Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You can create a Windows web app that uses plan-contoso.
        fr: Vous pouvez créer une application web Windows qui utilise plan-contoso.
    - id: s2
      text:
        en: A web app that uses plan-contoso runs in the West Europe region.
        fr: Une application web qui utilise plan-contoso s'exécute dans la région West Europe.
    - id: s3
      text:
        en: You can host several web apps in plan-contoso without paying for additional instances.
        fr: Vous pouvez héberger plusieurs applications web dans plan-contoso sans payer d'instances supplémentaires.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A plan defines the operating system and the region of the compute resources, so plan-contoso can only host Linux apps, and they run in West Europe. In the dedicated tiers you pay for the plan's VM instances, not per app, so several apps can share the same instances at no extra compute cost (as long as the plan has enough resources).
    fr: |
      Un plan définit le système d'exploitation et la région des ressources de calcul : plan-contoso ne peut donc héberger que des applications Linux, qui s'exécutent dans West Europe. Dans les niveaux dédiés, vous payez les instances de machine virtuelle du plan, pas chaque application : plusieurs applications peuvent donc partager les mêmes instances sans coût de calcul supplémentaire (tant que le plan dispose de ressources suffisantes).
references:
  - title: Azure App Service plans
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
