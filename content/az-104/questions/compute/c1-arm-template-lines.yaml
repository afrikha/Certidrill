id: c1-arm-template-lines
objective: "3.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You review an ARM template that deploys a virtual network, a public IP address and network interfaces. The virtual network, named by the variable `vnetName`, is defined in the same template. The following table shows an excerpt of the template.

    Answer each prompt by selecting the appropriate line of the template.
  fr: |
    Vous examinez un modèle ARM qui déploie un réseau virtuel, une adresse IP publique et des interfaces réseau. Le réseau virtuel, dont le nom est fourni par la variable `vnetName`, est défini dans le même modèle. Le tableau suivant présente un extrait du modèle.

    Répondez à chaque consigne en sélectionnant la ligne appropriée du modèle.
body:
  prompts:
    - id: p1
      text: { en: The line that ensures the network interfaces are deployed only after the virtual network exists, fr: La ligne qui garantit que les interfaces réseau ne sont déployées qu'après la création du réseau virtuel }
    - id: p2
      text: { en: The line that makes the deployment of the public IP address optional, fr: La ligne qui rend facultatif le déploiement de l'adresse IP publique }
  grid:
    header: [{ en: Line, fr: Ligne }, Code]
    rows:
      - - text: "10"
        - text: |-
            "type": "Microsoft.Network/publicIPAddresses",
      - - text: "11"
        - area: l11
          text: |-
            "condition": "[parameters('deployPublicIp')]",
      - - text: "12"
        - area: l12
          text: |-
            "name": "[variables('pipName')]",
      - - text: "30"
        - text: |-
            "type": "Microsoft.Network/networkInterfaces",
      - - text: "31"
        - area: l31
          text: |-
            "copy": { "name": "nicLoop", "count": 2 },
      - - text: "32"
        - area: l32
          text: |-
            "dependsOn": [ "[resourceId('Microsoft.Network/virtualNetworks', variables('vnetName'))]" ],
      - - text: "40"
        - area: l40
          text: |-
            "subnet": { "id": "[resourceId('Microsoft.Network/virtualNetworks/subnets', variables('vnetName'), 'snet-app')]" }
answer:
  values: { p1: l32, p2: l11 }
explanation:
  correct:
    en: In an ARM JSON template, the `dependsOn` element (line 32) tells Resource Manager to deploy the network interfaces after the virtual network. Line 40 only builds a resource ID with `resourceId()`, which does not create a dependency. The `condition` element (line 11) deploys the public IP address only when the parameter evaluates to true.
    fr: "Dans un modèle ARM JSON, l'élément `dependsOn` (ligne 32) indique à Resource Manager de déployer les interfaces réseau après le réseau virtuel. La ligne 40 construit seulement un ID de ressource avec `resourceId()`, ce qui ne crée pas de dépendance. L'élément `condition` (ligne 11) ne déploie l'adresse IP publique que lorsque le paramètre a la valeur true."
  options:
    l40: { en: "resourceId() returns an ID string; unlike reference(), it does not add an implicit dependency.", fr: "resourceId() renvoie une chaîne d'ID ; contrairement à reference(), elle n'ajoute pas de dépendance implicite." }
    l31: { en: The copy element creates two network interfaces; it does not define the deployment order relative to the virtual network., fr: "L'élément copy crée deux interfaces réseau ; il ne définit pas l'ordre de déploiement par rapport au réseau virtuel." }
references:
  - title: Set deployment order for resources
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-dependency
  - title: Conditional deployment with templates
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/conditional-resource-deployment
