id: c4-domain-subdomain-records
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-fabrikam** that runs on an App Service plan in the Standard S1 tier. You manage the public DNS zone **fabrikam.com**.

    You need to map the custom domain **www.fabrikam.com** to app-fabrikam and validate domain ownership in App Service.

    Which two DNS configurations can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application web nommée **app-fabrikam** qui s'exécute sur un plan App Service de niveau Standard S1. Vous gérez la zone DNS publique **fabrikam.com**.

    Vous devez mapper le domaine personnalisé **www.fabrikam.com** à app-fabrikam et valider la propriété du domaine dans App Service.

    Quelles sont les deux configurations DNS que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: A CNAME record for www that points to app-fabrikam.azurewebsites.net, and a TXT record for asuid.www that contains the domain verification ID.
        fr: Un enregistrement CNAME pour www qui pointe vers app-fabrikam.azurewebsites.net, et un enregistrement TXT pour asuid.www qui contient l'ID de vérification de domaine.
    - id: b
      text:
        en: An A record for www that points to the app's IP address, and a TXT record for asuid.www that contains the domain verification ID.
        fr: Un enregistrement A pour www qui pointe vers l'adresse IP de l'application, et un enregistrement TXT pour asuid.www qui contient l'ID de vérification de domaine.
    - id: c
      text:
        en: A CNAME record for asuid.www that points to app-fabrikam.azurewebsites.net, and a TXT record for www that contains the domain verification ID.
        fr: Un enregistrement CNAME pour asuid.www qui pointe vers app-fabrikam.azurewebsites.net, et un enregistrement TXT pour www qui contient l'ID de vérification de domaine.
    - id: d
      text:
        en: An A record for @ that points to the app's IP address, and a TXT record for asuid that contains the domain verification ID.
        fr: Un enregistrement A pour @ qui pointe vers l'adresse IP de l'application, et un enregistrement TXT pour asuid qui contient l'ID de vérification de domaine.
    - id: e
      text:
        en: An MX record for www that points to app-fabrikam.azurewebsites.net, and a TXT record for asuid.www that contains the domain verification ID.
        fr: Un enregistrement MX pour www qui pointe vers app-fabrikam.azurewebsites.net, et un enregistrement TXT pour asuid.www qui contient l'ID de vérification de domaine.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      A subdomain can be mapped with a CNAME record to the app's default host name (recommended, because it follows IP changes) or with an A record to the app's IP address. In both cases, App Service verifies ownership with a TXT record named asuid.<subdomain> that contains the domain verification ID.
    fr: |
      Un sous-domaine peut être mappé avec un enregistrement CNAME vers le nom d'hôte par défaut de l'application (recommandé, car il suit les changements d'adresse IP) ou avec un enregistrement A vers l'adresse IP de l'application. Dans les deux cas, App Service vérifie la propriété avec un enregistrement TXT nommé asuid.<sous-domaine> qui contient l'ID de vérification de domaine.
  options:
    c:
      en: |
        The host names are swapped: the mapping record must be www and the verification record must be asuid.www.
      fr: |
        Les noms d'hôte sont inversés : l'enregistrement de mappage doit être www et l'enregistrement de vérification asuid.www.
    d:
      en: |
        These records map and verify the root domain fabrikam.com, not www.fabrikam.com.
      fr: |
        Ces enregistrements mappent et vérifient le domaine racine fabrikam.com, pas www.fabrikam.com.
    e:
      en: |
        MX records route email; they don't map a host name to a web app.
      fr: |
        Les enregistrements MX acheminent le courrier ; ils ne mappent pas un nom d'hôte à une application web.
references:
  - title: "Set Up an Existing Custom Domain Name for Your App"
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
