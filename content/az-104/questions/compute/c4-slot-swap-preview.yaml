id: c4-slot-swap-preview
objective: "3.4.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-tailspin** that runs on an App Service plan in the Premium v3 tier. The app has a deployment slot named **staging**. Some connection strings are marked as deployment slot settings. App Service authentication isn't enabled.

    You need to release a new version of the app. Before production traffic reaches the new version, you must verify that it works with the production slot settings.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une application web nommée **app-tailspin** qui s'exécute sur un plan App Service de niveau Premium v3. L'application possède un emplacement de déploiement nommé **staging**. Certaines chaînes de connexion sont marquées comme paramètres d'emplacement de déploiement. L'authentification App Service n'est pas activée.

    Vous devez publier une nouvelle version de l'application. Avant que le trafic de production n'atteigne la nouvelle version, vous devez vérifier qu'elle fonctionne avec les paramètres de l'emplacement de production.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: deploy, text: { en: Deploy the new version to the staging slot., fr: Déployer la nouvelle version dans l'emplacement staging. } }
    - id: preview
      text:
        en: "Run `az webapp deployment slot swap` with `--slot staging --target-slot production --action preview`."
        fr: "Exécuter `az webapp deployment slot swap` avec `--slot staging --target-slot production --action preview`."
    - { id: test, text: { en: Test the staging slot URL., fr: Tester l'URL de l'emplacement staging. } }
    - id: complete
      text:
        en: "Run `az webapp deployment slot swap` with `--slot staging --target-slot production --action swap`."
        fr: "Exécuter `az webapp deployment slot swap` avec `--slot staging --target-slot production --action swap`."
    - id: reset
      text:
        en: "Run `az webapp deployment slot swap` with `--slot staging --target-slot production --action reset`."
        fr: "Exécuter `az webapp deployment slot swap` avec `--slot staging --target-slot production --action reset`."
    - { id: autoswap, text: { en: Enable auto swap from the staging slot to production., fr: Activer l'échange automatique de l'emplacement staging vers la production. } }
    - { id: traffic, text: { en: Set Traffic % of the staging slot to 100., fr: Définir Traffic % de l'emplacement staging sur 100. } }
answer:
  sequence: [deploy, preview, test, complete]
explanation:
  correct:
    en: |
      A swap with preview (multi-phase swap) first applies the target slot's settings, such as slot-specific connection strings, to the source slot and restarts it, then pauses. While production still serves the old version, you test the staging slot with the production settings, and then you complete the swap with `--action swap`.
    fr: |
      Un échange avec aperçu (échange multiphase) applique d'abord les paramètres de l'emplacement cible, comme les chaînes de connexion spécifiques à l'emplacement, à l'emplacement source et le redémarre, puis il fait une pause. Pendant que la production sert encore l'ancienne version, vous testez l'emplacement staging avec les paramètres de production, puis vous terminez l'échange avec `--action swap`.
  options:
    reset:
      en: |
        `--action reset` cancels the pending swap instead of completing it.
      fr: |
        `--action reset` annule l'échange en attente au lieu de le terminer.
    autoswap:
      en: |
        Auto swap swaps right after deployment, with no validation step.
      fr: |
        L'échange automatique effectue l'échange juste après le déploiement, sans étape de validation.
    traffic:
      en: |
        Routing production traffic to staging sends users to the new version before it is validated.
      fr: |
        Acheminer le trafic de production vers staging envoie des utilisateurs vers la nouvelle version avant sa validation.
references:
  - title: "Set Up Staging Environments"
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
