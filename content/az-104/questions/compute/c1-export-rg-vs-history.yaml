id: c1-export-rg-vs-history
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Three months ago, you deployed a virtual machine named **VM1** to a resource group named **RG1** by using an ARM template. Since then, administrators used the Azure portal to resize VM1, add a data disk and add tags.

    You need to obtain an ARM template that reflects the current configuration of VM1 and its related resources.

    What should you do?
  fr: |
    Il y a trois mois, vous avez déployé une machine virtuelle nommée **VM1** dans un groupe de ressources nommé **RG1** à l'aide d'un modèle ARM. Depuis, des administrateurs ont utilisé le portail Azure pour redimensionner VM1, ajouter un disque de données et ajouter des étiquettes.

    Vous devez obtenir un modèle ARM qui reflète la configuration actuelle de VM1 et de ses ressources associées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: In RG1, select the resources and use Export template., fr: "Dans RG1, sélectionner les ressources et utiliser Exporter le modèle." } }
    - { id: b, text: { en: In the deployment history of RG1, open the original deployment and download its template., fr: "Dans l'historique de déploiement de RG1, ouvrir le déploiement d'origine et télécharger son modèle." } }
    - { id: c, text: { en: "Run `az deployment group what-if` with the original template.", fr: "Exécuter `az deployment group what-if` avec le modèle d'origine." } }
    - { id: d, text: { en: "Run `az bicep decompile` on the original template.", fr: "Exécuter `az bicep decompile` sur le modèle d'origine." } }
answer: { optionId: a }
explanation:
  correct:
    en: Exporting from the resource group (or from a resource) generates a template from the current state of the resources, so it includes the changes made in the portal after the deployment. You can select only the resources you need.
    fr: "L'exportation depuis le groupe de ressources (ou depuis une ressource) génère un modèle à partir de l'état actuel des ressources : il inclut donc les modifications faites dans le portail après le déploiement. Vous pouvez sélectionner uniquement les ressources nécessaires."
  options:
    b: { en: The template saved in the deployment history is the exact original template; it does not include later manual changes., fr: "Le modèle enregistré dans l'historique de déploiement est le modèle d'origine exact ; il n'inclut pas les modifications manuelles ultérieures." }
    c: { en: what-if lists the differences with the current state but does not produce a template., fr: "what-if énumère les différences avec l'état actuel, mais ne produit pas de modèle." }
    d: { en: Decompiling converts the original template to Bicep; it still describes the original configuration., fr: "La décompilation convertit le modèle d'origine en Bicep ; il décrit toujours la configuration d'origine." }
references:
  - title: Export template in Azure portal
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal
