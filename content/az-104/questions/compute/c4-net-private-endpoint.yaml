id: c4-net-private-endpoint
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-woodgrove** that runs on an App Service plan in the Premium v3 tier. You have a virtual network named **VNet1** that is connected to your on-premises network by a site-to-site VPN.

    You need to meet the following requirements:

    - Users on-premises and in VNet1 must reach app-woodgrove on a private IP address from VNet1.
    - Requests from the internet must be rejected.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-woodgrove** qui s'exécute sur un plan App Service de niveau Premium v3. Vous disposez d'un réseau virtuel nommé **VNet1** connecté à votre réseau local par un VPN site à site.

    Vous devez répondre aux exigences suivantes :

    - Les utilisateurs locaux et ceux de VNet1 doivent atteindre app-woodgrove sur une adresse IP privée de VNet1.
    - Les requêtes provenant d'Internet doivent être refusées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Create a private endpoint for app-woodgrove in VNet1 and disable public network access to the app.
        fr: Créer un point de terminaison privé pour app-woodgrove dans VNet1 et désactiver l'accès réseau public à l'application.
    - id: b
      text:
        en: Create a private endpoint for app-woodgrove in VNet1 and keep the default access settings.
        fr: Créer un point de terminaison privé pour app-woodgrove dans VNet1 et conserver les paramètres d'accès par défaut.
    - id: c
      text:
        en: Configure virtual network integration for app-woodgrove with a subnet of VNet1.
        fr: Configurer l'intégration au réseau virtuel pour app-woodgrove avec un sous-réseau de VNet1.
    - id: d
      text:
        en: Add an access restriction rule that allows a subnet of VNet1 by using a Microsoft.Web service endpoint.
        fr: Ajouter une règle de restriction d'accès qui autorise un sous-réseau de VNet1 à l'aide d'un point de terminaison de service Microsoft.Web.
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private endpoint gives the app a private IP address from VNet1 for inbound traffic, and it is reachable over the VPN from on-premises. Private endpoints and public access can coexist, so you must also disable public network access to reject internet requests.
    fr: |
      Un point de terminaison privé donne à l'application une adresse IP privée de VNet1 pour le trafic entrant, accessible depuis le réseau local via le VPN. Les points de terminaison privés et l'accès public peuvent coexister : vous devez donc aussi désactiver l'accès réseau public pour refuser les requêtes provenant d'Internet.
  options:
    b:
      en: |
        With the default settings, the app stays reachable from the internet.
      fr: |
        Avec les paramètres par défaut, l'application reste accessible depuis Internet.
    c:
      en: |
        Virtual network integration is for outbound traffic from the app; it doesn't give the app a private inbound address.
      fr: |
        L'intégration au réseau virtuel concerne le trafic sortant de l'application ; elle ne lui donne pas d'adresse entrante privée.
    d:
      en: |
        A service endpoint rule restricts which subnet can call the app, but the app is still reached on its public address, and on-premises clients don't come from that subnet.
      fr: |
        Une règle de point de terminaison de service limite les sous-réseaux qui peuvent appeler l'application, mais celle-ci reste atteinte sur son adresse publique, et les clients locaux ne proviennent pas de ce sous-réseau.
references:
  - title: "Use Private Endpoints for Apps"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-private-endpoint
