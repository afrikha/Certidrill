id: c4-tls-managed-cert-apex
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a web app named **app-adatum** that runs on an App Service plan in the Standard S1 tier. The root domain **adatum.com** is mapped to the app with the following public DNS records:

    | Type | Host | Value |
    | --- | --- | --- |
    | A | @ | The IP address of app-adatum |
    | TXT | asuid | The domain verification ID of app-adatum |

    The app has access restriction rules that allow only the public IP range of the company offices, and the unmatched rule action is **Deny**. The domain has no CAA records.

    When you try to create an App Service managed certificate for adatum.com, the creation fails.

    You need to be able to create the managed certificate and to have it renewed automatically.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-adatum** qui s'exécute sur un plan App Service de niveau Standard S1. Le domaine racine **adatum.com** est mappé à l'application avec les enregistrements DNS publics suivants :

    | Type | Hôte | Valeur |
    | --- | --- | --- |
    | A | @ | L'adresse IP d'app-adatum |
    | TXT | asuid | L'ID de vérification de domaine d'app-adatum |

    L'application dispose de règles de restriction d'accès qui n'autorisent que la plage d'adresses IP publiques des bureaux de l'entreprise, et l'action de la règle sans correspondance (unmatched rule) est **Deny**. Le domaine n'a aucun enregistrement CAA.

    Lorsque vous essayez de créer un certificat managé App Service pour adatum.com, la création échoue.

    Vous devez pouvoir créer le certificat managé et le faire renouveler automatiquement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Remove the access restrictions so that the app is reachable from the internet.
        fr: Supprimer les restrictions d'accès pour que l'application soit accessible depuis Internet.
    - id: b
      text:
        en: Replace the A record with a CNAME record for @ that points to app-adatum.azurewebsites.net.
        fr: Remplacer l'enregistrement A par un enregistrement CNAME pour @ qui pointe vers app-adatum.azurewebsites.net.
    - id: c
      text:
        en: Scale up the App Service plan to the Premium v3 tier.
        fr: Effectuer un scale-up du plan App Service vers le niveau Premium v3.
    - id: d
      text:
        en: Rename the TXT record from asuid to asuid.adatum.com.
        fr: Renommer l'enregistrement TXT asuid en asuid.adatum.com.
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a root (apex) domain, both the creation and the periodic renewal of the free managed certificate require the app to be reachable from the internet, so the app must not have IP restrictions. The DNS configuration (A record for @ and TXT record asuid) and the Standard tier already meet the other requirements.
    fr: |
      Pour un domaine racine (apex), la création comme le renouvellement périodique du certificat managé gratuit exigent que l'application soit accessible depuis Internet : l'application ne doit donc pas avoir de restrictions d'adresses IP. La configuration DNS (enregistrement A pour @ et enregistrement TXT asuid) et le niveau Standard satisfont déjà les autres exigences.
  options:
    b:
      en: |
        A root domain must use an A record; a CNAME record must not be used for the apex, and the managed certificate for an apex domain requires the A record.
      fr: |
        Un domaine racine doit utiliser un enregistrement A ; un enregistrement CNAME ne doit pas être utilisé pour l'apex, et le certificat managé d'un domaine apex exige l'enregistrement A.
    c:
      en: |
        Managed certificates are available from the Basic tier; the Standard tier is not the problem.
      fr: |
        Les certificats managés sont disponibles dès le niveau Basic ; le niveau Standard n'est pas en cause.
    d:
      en: |
        For a root domain, the verification TXT record host is asuid, which is already correct.
      fr: |
        Pour un domaine racine, l'hôte de l'enregistrement TXT de vérification est asuid, ce qui est déjà correct.
references:
  - title: "Install a TLS/SSL Certificate for Your App"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate
