id: c1-export-decompile-steps
objective: "3.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a resource group named **RG-Legacy** whose resources were all created manually in the Azure portal. You need to create a reusable Bicep file from these resources and deploy it to a resource group named **RG-Test** by using the Azure CLI.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un groupe de ressources nommé **RG-Legacy** dont toutes les ressources ont été créées manuellement dans le portail Azure. Vous devez créer un fichier Bicep réutilisable à partir de ces ressources et le déployer dans un groupe de ressources nommé **RG-Test** avec Azure CLI.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: export, text: { en: "Run `az group export --name RG-Legacy > main.json`.", fr: "Exécuter `az group export --name RG-Legacy > main.json`." } }
    - { id: decompile, text: { en: "Run `az bicep decompile --file main.json`.", fr: "Exécuter `az bicep decompile --file main.json`." } }
    - { id: fix, text: { en: Review main.bicep, fix the warnings and replace hard-coded values with parameters., fr: "Examiner main.bicep, corriger les avertissements et remplacer les valeurs codées en dur par des paramètres." } }
    - { id: deploy, text: { en: "Run `az deployment group create --resource-group RG-Test --template-file main.bicep`.", fr: "Exécuter `az deployment group create --resource-group RG-Test --template-file main.bicep`." } }
    - { id: depexport, text: { en: "Run `az deployment group export --resource-group RG-Legacy --name RG-Legacy > main.json`.", fr: "Exécuter `az deployment group export --resource-group RG-Legacy --name RG-Legacy > main.json`." } }
    - { id: build, text: { en: "Run `az bicep build --file main.json`.", fr: "Exécuter `az bicep build --file main.json`." } }
answer:
  sequence: [export, decompile, fix, deploy]
explanation:
  correct:
    en: "Because the resources were created manually, there is no deployment history to export from: `az group export` generates a JSON template from their current state. `az bicep decompile` converts it to main.bicep, which usually needs cleanup (warnings, hard-coded names and values) before it is reusable. You then deploy main.bicep to RG-Test."
    fr: "Les ressources ayant été créées manuellement, il n'existe aucun historique de déploiement à exporter : `az group export` génère un modèle JSON à partir de leur état actuel. `az bicep decompile` le convertit en main.bicep, qui doit généralement être nettoyé (avertissements, noms et valeurs codés en dur) avant d'être réutilisable. Vous déployez ensuite main.bicep dans RG-Test."
  options:
    depexport: { en: No template deployment exists for resources created manually in the portal., fr: "Aucun déploiement de modèle n'existe pour des ressources créées manuellement dans le portail." }
    build: { en: build compiles Bicep to JSON; it cannot take a JSON template as input to produce Bicep., fr: "build compile du Bicep en JSON ; il ne peut pas prendre un modèle JSON en entrée pour produire du Bicep." }
references:
  - title: Decompile a JSON Azure Resource Manager template to Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile
  - title: Export template in Azure CLI
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-cli
