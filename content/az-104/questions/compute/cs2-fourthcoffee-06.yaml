id: cs2-fourthcoffee-06
objective: "3.2.6"
type: single
caseStudy: cs2-fourthcoffee
difficulty: 1
status: draft
stem:
  en: You need to deploy VM-POSDB2 and VM-POSDB3 to meet the compute requirement. What should you do?
  fr: Vous devez déployer VM-POSDB2 et VM-POSDB3 pour satisfaire l'exigence de calcul. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy VM-POSDB2 and VM-POSDB3 in two different availability zones of UK South", fr: "Déployer VM-POSDB2 et VM-POSDB3 dans deux zones de disponibilité différentes d'UK South" } }
    - { id: b, text: { en: "Deploy VM-POSDB2 and VM-POSDB3 in the same availability set", fr: "Déployer VM-POSDB2 et VM-POSDB3 dans le même groupe à haute disponibilité" } }
    - { id: c, text: { en: "Deploy VM-POSDB2 and VM-POSDB3 in the same proximity placement group", fr: "Déployer VM-POSDB2 et VM-POSDB3 dans le même groupe de placement de proximité" } }
    - { id: d, text: { en: "Deploy VM-POSDB2 and VM-POSDB3 in the same availability zone with Premium SSD disks", fr: "Déployer VM-POSDB2 et VM-POSDB3 dans la même zone de disponibilité avec des disques SSD Premium" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Availability zones are physically separate datacenters within a region. Two or more virtual machines deployed across two or more zones are covered by a 99.99% connectivity SLA and survive the loss of a datacenter.
    fr: |
      Les zones de disponibilité sont des centres de données physiquement distincts au sein d'une région. Deux machines virtuelles ou plus déployées dans au moins deux zones bénéficient d'un SLA de connectivité de 99,99 % et résistent à la perte d'un centre de données.
  options:
    b: { en: "An availability set spreads the virtual machines across fault domains of one datacenter, with a 99.95% SLA.", fr: "Un groupe à haute disponibilité répartit les machines virtuelles entre les domaines d'erreur d'un seul centre de données, avec un SLA de 99,95 %." }
    c: { en: "A proximity placement group places the virtual machines close together to reduce latency, which increases the impact of a datacenter failure.", fr: "Un groupe de placement de proximité rapproche les machines virtuelles pour réduire la latence, ce qui augmente l'impact d'une défaillance de centre de données." }
    d: { en: "Both virtual machines would depend on the same zone; the disk type does not protect against a datacenter failure.", fr: "Les deux machines virtuelles dépendraient de la même zone ; le type de disque ne protège pas contre la défaillance d'un centre de données." }
references:
  - title: "Availability options for Azure Virtual Machines - Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
