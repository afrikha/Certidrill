id: c1-export-limitations
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to use **Export template** in the Azure portal to generate a template from the resources of a resource group named **RG1**. The resources were deployed over time by different teams, some with templates and some manually.

    Which two statements about the exported template are true? Each correct answer presents a complete solution.
  fr: |
    Vous prévoyez d'utiliser **Exporter le modèle** dans le portail Azure pour générer un modèle à partir des ressources d'un groupe de ressources nommé **RG1**. Les ressources ont été déployées au fil du temps par différentes équipes, certaines avec des modèles et d'autres manuellement.

    Quelles sont les deux affirmations vraies concernant le modèle exporté ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: The export is not supported if RG1 contains more than 200 resources., fr: "L'exportation n'est pas prise en charge si RG1 contient plus de 200 ressources." } }
    - { id: b, text: { en: Some password parameters might be missing and must be added manually before you redeploy the template., fr: "Certains paramètres de mot de passe peuvent manquer et doivent être ajoutés manuellement avant de redéployer le modèle." } }
    - { id: c, text: { en: The template contains only the parameters defined by the authors of the original templates., fr: "Le modèle ne contient que les paramètres définis par les auteurs des modèles d'origine." } }
    - { id: d, text: { en: The template excludes the resources that were created manually in the portal., fr: Le modèle exclut les ressources créées manuellement dans le portail. } }
    - { id: e, text: { en: The template can be exported only as ARM JSON, not as a Bicep file., fr: "Le modèle peut être exporté uniquement au format ARM JSON, pas sous forme de fichier Bicep." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Export from a resource group is limited to resource groups of 200 resources or fewer. The template is generated from the published resource schemas, and some password parameters can be missing, so you must check the template reference and add them before deploying.
    fr: "L'exportation depuis un groupe de ressources est limitée aux groupes de 200 ressources au maximum. Le modèle est généré à partir des schémas de ressources publiés, et certains paramètres de mot de passe peuvent manquer : vous devez consulter la référence des modèles et les ajouter avant le déploiement."
  options:
    c: { en: "The generated template is a snapshot with mostly hard-coded values and auto-generated parameters, not the authors' parameters.", fr: "Le modèle généré est un instantané, avec des valeurs essentiellement codées en dur et des paramètres générés automatiquement, pas les paramètres des auteurs." }
    d: { en: Export from a resource group works for resources that were not created with a template., fr: "L'exportation depuis un groupe de ressources fonctionne pour les ressources qui n'ont pas été créées avec un modèle." }
    e: { en: The portal can export a resource group as a Bicep file or as an ARM JSON template., fr: "Le portail peut exporter un groupe de ressources sous forme de fichier Bicep ou de modèle ARM JSON." }
references:
  - title: Export template in Azure portal
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal
  - title: Export Bicep files in Azure portal
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/export-bicep-portal
