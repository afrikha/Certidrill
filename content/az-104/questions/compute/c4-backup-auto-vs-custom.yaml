id: c4-backup-auto-vs-custom
objective: "3.4.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-tailspin** that runs on an App Service plan in the Standard S1 tier. You are reviewing the backup options of the app.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous disposez d'une application web nommée **app-tailspin** qui s'exécute sur un plan App Service de niveau Standard S1. Vous examinez les options de sauvegarde de l'application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: Automatic backups of app-tailspin require you to configure a storage account.
        fr: Les sauvegardes automatiques d'app-tailspin nécessitent que vous configuriez un compte de stockage.
    - id: s2
      text:
        en: Custom backups of app-tailspin can be downloaded as Azure Storage blobs.
        fr: Les sauvegardes personnalisées d'app-tailspin peuvent être téléchargées sous forme d'objets blob Stockage Azure.
    - id: s3
      text:
        en: You can set the retention of automatic backups to 90 days.
        fr: Vous pouvez définir la rétention des sauvegardes automatiques sur 90 jours.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Automatic backups are created every hour in Basic and higher tiers with no configuration and no storage account; their retention is fixed at 30 days. Custom backups require a storage account and container, and each backup is stored there as a ZIP file and an XML manifest that you can download.
    fr: |
      Les sauvegardes automatiques sont créées toutes les heures dans les niveaux Basic et supérieurs, sans configuration ni compte de stockage ; leur rétention est fixée à 30 jours. Les sauvegardes personnalisées nécessitent un compte de stockage et un conteneur, et chaque sauvegarde y est stockée sous forme d'un fichier ZIP et d'un manifeste XML que vous pouvez télécharger.
references:
  - title: Back up an app in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup
