id: c2-vm-cse-managed-identity
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains a Linux virtual machine named **VM1** and a storage account named **stlitware01**. A configuration script named `setup.sh` is stored in a private container of stlitware01.

    You plan to use the Custom Script Extension to run `setup.sh` on VM1. The security team prohibits the use of storage account keys and shared access signatures (SAS) to download the script.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure qui contient une machine virtuelle Linux nommée **VM1** et un compte de stockage nommé **stlitware01**. Un script de configuration nommé `setup.sh` est stocké dans un conteneur privé de stlitware01.

    Vous prévoyez d'utiliser l'extension Custom Script pour exécuter `setup.sh` sur VM1. L'équipe de sécurité interdit l'utilisation des clés de compte de stockage et des signatures d'accès partagé (SAS) pour télécharger le script.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Enable a managed identity on VM1, grant it the Storage Blob Data Reader role on the container, and set the `managedIdentity` property in the protected settings of the extension.
        fr: Activer une identité managée sur VM1, lui attribuer le rôle Storage Blob Data Reader sur le conteneur, puis définir la propriété `managedIdentity` dans les paramètres protégés de l'extension.
    - id: b
      text:
        en: Change the public access level of the container to **Blob** and reference the blob URL in the `fileUris` property of the extension.
        fr: Définir le niveau d'accès public du conteneur sur **Blob** et référencer l'URL du blob dans la propriété `fileUris` de l'extension.
    - id: c
      text:
        en: Generate a user delegation SAS for the blob and add it to the `fileUris` property in the protected settings of the extension.
        fr: Générer une SAS de délégation d'utilisateur pour le blob et l'ajouter à la propriété `fileUris` dans les paramètres protégés de l'extension.
    - id: d
      text:
        en: Add the `storageAccountName` and `storageAccountKey` properties to the public settings of the extension.
        fr: Ajouter les propriétés `storageAccountName` et `storageAccountKey` aux paramètres publics de l'extension.
answer: { optionId: a }
explanation:
  correct:
    en: The Custom Script Extension (version 2.1 and later on Linux) can download files from private blobs by using a system-assigned or user-assigned managed identity of the VM. You grant the identity read access to the blob data and set `managedIdentity` in the protected settings, so no key or SAS token is involved.
    fr: L'extension Custom Script (version 2.1 et ultérieure sous Linux) peut télécharger des fichiers depuis des blobs privés avec une identité managée affectée par le système ou par l'utilisateur de la machine virtuelle. Vous accordez à l'identité un accès en lecture aux données blob et définissez `managedIdentity` dans les paramètres protégés ; aucune clé ni aucun jeton SAS n'est utilisé.
  options:
    b:
      en: Anonymous public access would expose the script to anyone on the internet, which is not acceptable for a private configuration script.
      fr: L'accès public anonyme exposerait le script à n'importe qui sur Internet, ce qui n'est pas acceptable pour un script de configuration privé.
    c:
      en: A user delegation SAS is still a shared access signature, which the security team prohibits.
      fr: Une SAS de délégation d'utilisateur reste une signature d'accès partagé, ce que l'équipe de sécurité interdit.
    d:
      en: This uses the storage account key, which is prohibited, and public settings are sent in clear text.
      fr: Cette solution utilise la clé du compte de stockage, ce qui est interdit, et les paramètres publics sont envoyés en clair.
references:
  - title: Run Custom Script Extension on Linux VMs in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-linux
