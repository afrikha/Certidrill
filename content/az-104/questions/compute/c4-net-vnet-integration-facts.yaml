id: c4-net-vnet-integration-facts
objective: "3.4.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You plan to configure regional virtual network integration for a web app named **app-fabrikam**. The app runs on an App Service plan in the Standard S1 tier in the East US region.

    Which two statements are true? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer l'intégration au réseau virtuel régionale pour une application web nommée **app-fabrikam**. L'application s'exécute sur un plan App Service de niveau Standard S1 dans la région East US.

    Quelles sont les deux affirmations vraies ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: The integration subnet must be an unused subnet that is delegated to Microsoft.Web/serverFarms.
        fr: Le sous-réseau d'intégration doit être un sous-réseau inutilisé délégué à Microsoft.Web/serverFarms.
    - id: b
      text:
        en: When outbound internet traffic routing (route all) is enabled, the network security groups and route tables of the integration subnet apply to all the outbound traffic of the app.
        fr: Lorsque le routage du trafic Internet sortant (route all) est activé, les groupes de sécurité réseau et les tables de routage du sous-réseau d'intégration s'appliquent à tout le trafic sortant de l'application.
    - id: c
      text:
        en: Clients in the virtual network can reach app-fabrikam by using an IP address from the integration subnet.
        fr: Les clients du réseau virtuel peuvent atteindre app-fabrikam à l'aide d'une adresse IP du sous-réseau d'intégration.
    - id: d
      text:
        en: The integration subnet can also contain the private endpoint of app-fabrikam.
        fr: Le sous-réseau d'intégration peut aussi contenir le point de terminaison privé d'app-fabrikam.
    - id: e
      text:
        en: The virtual network can be in any Azure region, because the integration uses the Microsoft backbone.
        fr: Le réseau virtuel peut se trouver dans n'importe quelle région Azure, car l'intégration utilise le réseau principal de Microsoft.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Virtual network integration needs a dedicated, unused subnet (/28 or larger) that App Service delegates to Microsoft.Web/serverFarms. With route all enabled, all outbound traffic of the app is sent into the virtual network, so the NSGs and UDRs of the integration subnet apply to it; otherwise only private (RFC 1918) traffic goes through the integration.
    fr: |
      L'intégration au réseau virtuel nécessite un sous-réseau dédié et inutilisé (/28 ou plus grand) qu'App Service délègue à Microsoft.Web/serverFarms. Lorsque route all est activé, tout le trafic sortant de l'application est envoyé dans le réseau virtuel : les NSG et les itinéraires définis par l'utilisateur du sous-réseau d'intégration s'y appliquent ; sinon, seul le trafic privé (RFC 1918) passe par l'intégration.
  options:
    c:
      en: |
        Virtual network integration is for outbound calls only; inbound private access requires a private endpoint.
      fr: |
        L'intégration au réseau virtuel ne sert qu'aux appels sortants ; l'accès privé entrant nécessite un point de terminaison privé.
    d:
      en: |
        Virtual network integration can't use the same subnet as a private endpoint.
      fr: |
        L'intégration au réseau virtuel ne peut pas utiliser le même sous-réseau qu'un point de terminaison privé.
    e:
      en: |
        Regional virtual network integration requires the virtual network to be in the same region as the app; other regions are reached through peering.
      fr: |
        L'intégration au réseau virtuel régionale exige que le réseau virtuel soit dans la même région que l'application ; les autres régions sont atteintes via le peering.
references:
  - title: Integrate your app with an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
