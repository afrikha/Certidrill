id: c3-aca-vnet-only-access
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove plans to deploy a container app named **ca-hr** that serves an internal HTTP portal.

    The portal must be reachable from virtual machines in a virtual network named **VNet1** and from on-premises computers connected to VNet1 through a VPN gateway. It must not be reachable from the internet.

    Which two configurations should you use? Each correct answer presents part of the solution.
  fr: |
    Woodgrove prévoit de déployer une application conteneur nommée **ca-hr** qui sert un portail HTTP interne.

    Le portail doit être accessible depuis les machines virtuelles d'un réseau virtuel nommé **VNet1** et depuis les ordinateurs locaux connectés à VNet1 via une passerelle VPN. Il ne doit pas être accessible depuis Internet.

    Quelles deux configurations devez-vous utiliser ? Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: envint
      text: { en: Create the Container Apps environment in a subnet of VNet1 with the internal accessibility level., fr: "Créer l'environnement Container Apps dans un sous-réseau de VNet1 avec le niveau d'accessibilité interne." }
    - id: ingext
      text: { en: "Enable ingress on ca-hr with the type External (accepting traffic from anywhere).", fr: "Activer l'entrée sur ca-hr avec le type Externe (acceptation du trafic de n'importe où)." }
    - id: ingint
      text: { en: "Enable ingress on ca-hr with the type Internal (limited to the Container Apps environment).", fr: "Activer l'entrée sur ca-hr avec le type Interne (limité à l'environnement Container Apps)." }
    - id: envext
      text: { en: Create the Container Apps environment in a subnet of VNet1 with the external accessibility level., fr: "Créer l'environnement Container Apps dans un sous-réseau de VNet1 avec le niveau d'accessibilité externe." }
    - id: noingress
      text: { en: Disable ingress on ca-hr and set the minimum number of replicas to 1., fr: Désactiver l'entrée sur ca-hr et définir le nombre minimal de réplicas sur 1. }
answer: { optionIds: [envint, ingext] }
explanation:
  correct:
    en: Two settings decide who can reach a container app. An internal environment has no public endpoint and is reachable only through an internal load balancer in the virtual network, which provides the isolation from the internet. External app ingress then publishes ca-hr at that internal load balancer, so clients in VNet1 and connected networks can reach it.
    fr: "Deux paramètres déterminent qui peut atteindre une application conteneur. Un environnement interne n'a pas de point de terminaison public et n'est accessible que via un équilibreur de charge interne dans le réseau virtuel, ce qui assure l'isolement vis-à-vis d'Internet. L'entrée externe de l'application publie ensuite ca-hr sur cet équilibreur de charge interne, afin que les clients de VNet1 et des réseaux connectés puissent l'atteindre."
  options:
    ingint:
      en: On an internal environment, internal ingress hides the app from the virtual network as well; only other apps in the environment can reach it.
      fr: Dans un environnement interne, l'entrée interne masque aussi l'application au réseau virtuel ; seules les autres applications de l'environnement peuvent l'atteindre.
    envext:
      en: An external environment has a public inbound IP address, even when it is integrated with VNet1, so an app with external ingress would be reachable from the internet.
      fr: Un environnement externe possède une adresse IP entrante publique, même lorsqu'il est intégré à VNet1 ; une application dotée d'une entrée externe serait donc accessible depuis Internet.
    noingress:
      en: Without ingress, the app receives no HTTP requests at all.
      fr: Sans entrée, l'application ne reçoit aucune requête HTTP.
references:
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
