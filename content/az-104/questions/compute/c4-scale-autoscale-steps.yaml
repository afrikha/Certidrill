id: c4-scale-autoscale-steps
objective: "3.4.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an App Service plan named **plan-northwind** in the Basic B2 tier. It hosts a web app that has a steady load during the day and peaks at the end of each month.

    You need the plan to add an instance automatically when the average CPU percentage exceeds 70 %, up to a maximum of six instances. The solution must minimize cost.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un plan App Service nommé **plan-northwind** au niveau Basic B2. Il héberge une application web dont la charge est stable pendant la journée et qui connaît un pic à la fin de chaque mois.

    Le plan doit ajouter automatiquement une instance lorsque le pourcentage moyen de processeur dépasse 70 %, jusqu'à six instances au maximum. La solution doit réduire les coûts au minimum.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: up, text: { en: Scale up plan-northwind to the Standard S1 tier., fr: Effectuer un scale-up de plan-northwind vers le niveau Standard S1. } }
    - id: custom
      text:
        en: "In the **Scale out (App Service plan)** settings, select **Custom autoscale** and **Scale based on a metric**."
        fr: "Dans les paramètres **Scale out (App Service plan)**, sélectionner **Custom autoscale** puis **Scale based on a metric**."
    - id: rule
      text:
        en: Add a rule that increases the instance count by 1 when CPU Percentage is greater than 70, set the maximum instance limit to 6, and save.
        fr: Ajouter une règle qui augmente le nombre d'instances de 1 lorsque CPU Percentage est supérieur à 70, définir la limite maximale d'instances sur 6, puis enregistrer.
    - { id: auto, text: { en: Enable automatic scaling and set Maximum burst to 6., fr: Activer l'Automatic scaling et définir la Rafale maximale sur 6. } }
    - { id: persite, text: { en: Enable per-app scaling on plan-northwind., fr: Activer la mise à l'échelle par application sur plan-northwind. } }
    - { id: manual, text: { en: Manually scale out plan-northwind to six instances., fr: Effectuer manuellement un scale-out de plan-northwind vers six instances. } }
answer:
  sequence: [up, custom, rule]
explanation:
  correct:
    en: |
      Azure Monitor autoscale requires the Standard tier or higher, so you first scale up to S1, the cheapest tier that supports it. You then switch the plan's scale-out method to custom autoscale based on a metric, and add the CPU rule with the instance limits.
    fr: |
      La mise à l'échelle automatique Azure Monitor nécessite le niveau Standard ou supérieur : vous effectuez donc d'abord un scale-up vers S1, le niveau le moins cher qui la prend en charge. Vous passez ensuite la méthode de scale-out du plan en mise à l'échelle automatique personnalisée basée sur une métrique, puis vous ajoutez la règle de processeur avec les limites d'instances.
  options:
    auto:
      en: |
        Automatic scaling is driven by HTTP traffic, not CPU rules, and it requires Premium v2 or higher.
      fr: |
        L'Automatic scaling est piloté par le trafic HTTP, pas par des règles de processeur, et il nécessite Premium v2 ou supérieur.
    manual:
      en: |
        Six permanent instances would not scale automatically and would increase cost.
      fr: |
        Six instances permanentes ne seraient pas mises à l'échelle automatiquement et augmenteraient les coûts.
references:
  - title: Get started with autoscale in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
