id: c3-aca-scale-rule-servicebus
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a container app named **ca-invoices** that processes messages from an Azure Service Bus queue named **invoices**. Ingress is disabled on ca-invoices.

    You need to configure scaling for ca-invoices to meet the following requirements:

    - Add replicas as the number of messages in the invoices queue grows, up to 20 replicas.
    - Scale to zero replicas when the queue is empty.

    What should you configure?
  fr: |
    Contoso dispose d'une application conteneur nommée **ca-invoices** qui traite les messages d'une file d'attente Azure Service Bus nommée **invoices**. L'entrée est désactivée sur ca-invoices.

    Vous devez configurer la mise à l'échelle de ca-invoices pour répondre aux exigences suivantes :

    - Ajouter des réplicas à mesure que le nombre de messages dans la file d'attente invoices augmente, jusqu'à 20 réplicas.
    - Descendre à zéro réplica quand la file d'attente est vide.

    Que devez-vous configurer ?
body:
  options:
    - id: custom
      text: { en: "A custom scale rule of type azure-servicebus with a messageCount value, a minimum of 0 replicas and a maximum of 20 replicas", fr: "Une règle de mise à l'échelle personnalisée de type azure-servicebus avec une valeur messageCount, un minimum de 0 réplica et un maximum de 20 réplicas" }
    - id: http
      text: { en: "An HTTP scale rule with a concurrency of 10, a minimum of 0 replicas and a maximum of 20 replicas", fr: "Une règle de mise à l'échelle HTTP avec une simultanéité de 10, un minimum de 0 réplica et un maximum de 20 réplicas" }
    - id: tcp
      text: { en: "A TCP scale rule with a concurrency of 10, a minimum of 0 replicas and a maximum of 20 replicas", fr: "Une règle de mise à l'échelle TCP avec une simultanéité de 10, un minimum de 0 réplica et un maximum de 20 réplicas" }
    - id: fixed
      text: { en: "No scale rule, with both the minimum and the maximum number of replicas set to 20", fr: "Aucune règle de mise à l'échelle, avec le nombre minimal et le nombre maximal de réplicas définis sur 20" }
answer: { optionId: custom }
explanation:
  correct:
    en: Container Apps uses KEDA scalers for custom scale rules. A rule of type azure-servicebus polls the queue (every 30 seconds by default) and computes the desired replicas from the queue length divided by messageCount, between the minimum and maximum limits. With a minimum of 0, the app scales to zero after the cool down period once the queue is empty.
    fr: "Container Apps utilise les scalers KEDA pour les règles de mise à l'échelle personnalisées. Une règle de type azure-servicebus interroge la file d'attente (toutes les 30 secondes par défaut) et calcule le nombre de réplicas souhaité à partir de la longueur de la file divisée par messageCount, entre les limites minimale et maximale. Avec un minimum de 0, l'application descend à zéro après la période de refroidissement une fois la file vide."
  options:
    http:
      en: An HTTP rule reacts to concurrent HTTP requests through ingress; ingress is disabled and the load comes from queue messages.
      fr: Une règle HTTP réagit aux requêtes HTTP simultanées reçues par l'entrée ; or l'entrée est désactivée et la charge provient des messages de la file d'attente.
    tcp:
      en: A TCP rule reacts to concurrent TCP connections through ingress, not to the length of a Service Bus queue.
      fr: Une règle TCP réagit aux connexions TCP simultanées reçues par l'entrée, pas à la longueur d'une file d'attente Service Bus.
    fixed:
      en: Twenty fixed replicas never scale with the queue and never scale to zero.
      fr: Vingt réplicas fixes ne suivent jamais la file d'attente et ne descendent jamais à zéro.
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
