id: c2-vmss-autoscale-cli
objective: "3.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Virtual Machine Scale Set named **VMSS1** in the resource group **RG1**. You need to configure autoscale so that:

    - VMSS1 always runs between 2 and 10 instances;
    - two instances are added when the average CPU usage of the instances is greater than 75% over 10 minutes.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de machines virtuelles identiques nommé **VMSS1** dans le groupe de ressources **RG1**. Vous devez configurer la mise à l'échelle automatique pour que :

    - VMSS1 exécute toujours entre 2 et 10 instances ;
    - deux instances soient ajoutées lorsque l'utilisation moyenne du processeur des instances dépasse 75 % pendant 10 minutes.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az monitor autoscale create \
      --resource-group RG1 \
      --resource VMSS1 \
      --resource-type [[type]] \
      --name autoscale-vmss1 \
      --min-count 2 --max-count 10 --count 2

    az monitor autoscale rule create \
      --resource-group RG1 \
      --autoscale-name autoscale-vmss1 \
      --condition "[[metric]] > 75 avg 10m" \
      --scale [[scale]]
  slots:
    - id: type
      options:
        - { id: vmss, text: Microsoft.Compute/virtualMachineScaleSets }
        - { id: vm, text: Microsoft.Compute/virtualMachines }
        - { id: settings, text: Microsoft.Insights/autoscalesettings }
        - { id: farm, text: Microsoft.Web/serverfarms }
    - id: metric
      options:
        - { id: cpu, text: Percentage CPU }
        - { id: credits, text: CPU Credits Remaining }
        - { id: mem, text: Available Memory Bytes }
        - { id: disk, text: Disk Read Operations/Sec }
    - id: scale
      options:
        - { id: out2, text: out 2 }
        - { id: in2, text: in 2 }
        - { id: to2, text: to 2 }
        - { id: up2, text: up 2 }
answer:
  values: { type: vmss, metric: cpu, scale: out2 }
explanation:
  correct:
    en: "`az monitor autoscale create` targets the scale set resource (`Microsoft.Compute/virtualMachineScaleSets`) and defines the minimum, maximum and default instance counts. The rule uses the host metric `Percentage CPU` averaged over 10 minutes, and `--scale out 2` adds two instances when the condition is met."
    fr: "`az monitor autoscale create` cible le groupe de machines virtuelles identiques (`Microsoft.Compute/virtualMachineScaleSets`) et définit les nombres d'instances minimal, maximal et par défaut. La règle utilise la métrique d'hôte `Percentage CPU` en moyenne sur 10 minutes, et `--scale out 2` ajoute deux instances lorsque la condition est remplie."
  options:
    settings: { en: "`Microsoft.Insights/autoscalesettings` is the type of the autoscale setting itself, not of the resource being scaled.", fr: "`Microsoft.Insights/autoscalesettings` est le type du paramètre de mise à l'échelle automatique lui-même, pas celui de la ressource mise à l'échelle." }
    credits: { en: CPU Credits Remaining applies to burstable B-series VMs and does not measure CPU usage., fr: CPU Credits Remaining concerne les machines virtuelles burstables de série B et ne mesure pas l'utilisation du processeur. }
    in2: { en: "`in` removes instances.", fr: "`in` supprime des instances." }
    vm: { en: "Autoscale must target the scale set itself, not an individual virtual machine.", fr: "La mise à l'échelle automatique doit cibler le groupe identique lui-même, pas une machine virtuelle individuelle." }
    farm: { en: "`Microsoft.Web/serverfarms` is the type of an App Service plan.", fr: "`Microsoft.Web/serverfarms` est le type d'un plan App Service." }
    to2: { en: "`to 2` sets the instance count to exactly two.", fr: "`to 2` fixe le nombre d'instances à exactement deux." }
    up2: { en: Autoscale rules scale horizontally (out or in); scaling up means changing the VM size., fr: "Les règles de mise à l'échelle automatique agissent horizontalement (out ou in) ; un scale-up consiste à changer la taille des machines virtuelles." }
references:
  - title: Tutorial - Autoscale a scale set with the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/tutorial-autoscale-cli
