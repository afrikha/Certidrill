id: comp-appservice-custom-domain
objective: "3.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an App Service web app named **app-contoso** hosted on an App Service plan in the Basic tier. The DNS zone **contoso.com** is hosted by a third-party DNS provider.

    You need users to reach the app at **https://www.contoso.com**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une application web App Service nommée **app-contoso**, hébergée sur un plan App Service de niveau Basic. La zone DNS **contoso.com** est hébergée par un fournisseur DNS tiers.

    Les utilisateurs doivent accéder à l'application via **https://www.contoso.com**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: dns
      text: { en: "At the DNS provider, create a CNAME record for `www` and a TXT record `asuid.www` with the domain verification ID.", fr: "Chez le fournisseur DNS, créer un enregistrement CNAME pour `www` et un enregistrement TXT `asuid.www` contenant l'ID de vérification du domaine." }
    - id: add
      text: { en: "In app-contoso, add and validate the custom domain `www.contoso.com`.", fr: "Dans app-contoso, ajouter et valider le domaine personnalisé `www.contoso.com`." }
    - id: tls
      text: { en: Create an App Service managed certificate and add an SNI SSL binding for the domain., fr: Créer un certificat managé App Service et ajouter une liaison SNI SSL pour le domaine. }
    - id: private
      text: { en: Create an Azure DNS private zone named contoso.com., fr: Créer une zone privée Azure DNS nommée contoso.com. }
    - id: slot
      text: { en: Create a deployment slot named www., fr: Créer un emplacement de déploiement nommé www. }
    - id: scale
      text: { en: Scale the App Service plan to the Isolated tier., fr: Faire passer le plan App Service au niveau Isolated. }
answer:
  sequence: [ dns, add, tls ]
explanation:
  correct:
    en: App Service validates domain ownership with the `asuid` TXT record and maps the name with the CNAME, so the records must exist first. Once the custom domain is added and validated, you can secure it with a certificate (a free managed certificate is available from the Basic tier) and an SNI SSL binding.
    fr: "App Service vérifie la propriété du domaine grâce à l'enregistrement TXT `asuid` et mappe le nom avec le CNAME : les enregistrements doivent donc exister en premier. Une fois le domaine personnalisé ajouté et validé, vous pouvez le sécuriser avec un certificat (un certificat managé gratuit est disponible dès le niveau Basic) et une liaison SNI SSL."
  options:
    private: { en: "A private zone is only resolvable from linked virtual networks, not by internet users.", fr: "Une zone privée n'est résolue que depuis les réseaux virtuels liés, pas par les internautes." }
    slot: { en: Deployment slots are unrelated to custom domain mapping., fr: Les emplacements de déploiement n'ont pas de lien avec le mappage de domaine personnalisé. }
    scale: { en: The Basic tier already supports custom domains and TLS bindings., fr: Le niveau Basic prend déjà en charge les domaines personnalisés et les liaisons TLS. }
references:
  - title: Set up an existing custom domain name for your app
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
  - title: Secure your domain with TLS/SSL
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings
