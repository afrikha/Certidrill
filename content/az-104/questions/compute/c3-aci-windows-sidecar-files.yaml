id: c3-aci-windows-sidecar-files
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has a .NET 8 web API packaged as a Windows Server Core container image, and a log-shipping agent packaged as a second Windows container image. Both applications can also run on Linux.

    You need to deploy both containers to Azure Container Instances in a single container group. The containers must share an Azure file share named **logs** mounted as a volume.

    What should you do first?
  fr: |
    Wingtip dispose d'une API web .NET 8 empaquetée sous forme d'image conteneur Windows Server Core, et d'un agent d'expédition de journaux empaqueté sous forme d'une seconde image conteneur Windows. Les deux applications peuvent également s'exécuter sous Linux.

    Vous devez déployer les deux conteneurs sur Azure Container Instances dans un seul groupe de conteneurs. Les conteneurs doivent partager un partage de fichiers Azure nommé **logs**, monté en tant que volume.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Rebuild both applications as Linux container images.", fr: "Régénérer les deux applications sous forme d'images conteneur Linux." }
    - id: b
      text: { en: "Deploy the container group from a YAML file instead of command-line parameters.", fr: "Déployer le groupe de conteneurs à partir d'un fichier YAML au lieu de paramètres de ligne de commande." }
    - id: c
      text: { en: "Deploy the container group into a subnet of an Azure virtual network.", fr: "Déployer le groupe de conteneurs dans un sous-réseau d'un réseau virtuel Azure." }
    - id: d
      text: { en: "Move the logs share to a storage account that supports premium file shares.", fr: "Déplacer le partage logs vers un compte de stockage prenant en charge les partages de fichiers Premium." }
answer: { optionId: a }
explanation:
  correct:
    en: In Azure Container Instances, multiple containers per container group and volume mounts (including Azure Files) are currently restricted to Linux containers. A Windows container group can run only one container and cannot mount the share, so the images must first be rebuilt for Linux.
    fr: "Dans Azure Container Instances, la présence de plusieurs conteneurs par groupe et le montage de volumes (dont Azure Files) sont actuellement réservés aux conteneurs Linux. Un groupe de conteneurs Windows ne peut exécuter qu'un seul conteneur et ne peut pas monter le partage : les images doivent donc d'abord être régénérées pour Linux."
  options:
    b:
      en: A YAML file is a convenient way to describe multi-container groups, but it does not lift the Linux-only restriction.
      fr: Un fichier YAML est pratique pour décrire des groupes multiconteneurs, mais il ne lève pas la restriction aux conteneurs Linux.
    c:
      en: Virtual network deployment controls network connectivity; it does not enable multi-container Windows groups or volume mounts.
      fr: Le déploiement dans un réseau virtuel contrôle la connectivité réseau ; il ne permet ni les groupes Windows multiconteneurs ni le montage de volumes.
    d:
      en: The storage tier of the share is not the problem; Windows containers in ACI cannot mount Azure Files shares at all.
      fr: Le niveau de stockage du partage n'est pas le problème ; les conteneurs Windows dans ACI ne peuvent pas du tout monter de partages Azure Files.
references:
  - title: Serverless containers in Azure
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
  - title: Introduction to container groups
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-container-groups
