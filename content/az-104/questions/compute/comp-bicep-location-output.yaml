id: comp-bicep-location-output
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have the following Bicep file that deploys a virtual network.

    You need to modify the file so that:

    - the virtual network is deployed in the same region as the resource group targeted by the deployment;
    - the deployment returns the resource ID of the virtual network.

    How should you complete the file? Select the appropriate options in the answer area.
  fr: |
    Vous disposez du fichier Bicep suivant, qui déploie un réseau virtuel.

    Vous devez modifier le fichier pour que :

    - le réseau virtuel soit déployé dans la même région que le groupe de ressources ciblé par le déploiement ;
    - le déploiement renvoie l'ID de ressource du réseau virtuel.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bicep
  template: |
    param vnetName string = 'vnet-app'

    resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {
      name: vnetName
      location: [[loc]]
      properties: {
        addressSpace: {
          addressPrefixes: [ '10.10.0.0/16' ]
        }
      }
    }

    output vnetId string = [[out]]
  slots:
    - id: loc
      options:
        - { id: rg, text: resourceGroup().location }
        - { id: sub, text: subscription().location }
        - { id: dep, text: "'westeurope'" }
        - { id: env, text: environment().location }
    - id: out
      options:
        - { id: id, text: vnet.id }
        - { id: name, text: vnet.name }
        - { id: propid, text: vnet.properties.id }
        - { id: rid, text: resourceId(vnet) }
answer:
  values: { loc: rg, out: id }
explanation:
  correct:
    en: "`resourceGroup().location` returns the region of the resource group targeted by the deployment. A Bicep symbolic name exposes the resource ID directly through `vnet.id`."
    fr: "`resourceGroup().location` renvoie la région du groupe de ressources ciblé par le déploiement. Un nom symbolique Bicep expose directement l'ID de ressource avec `vnet.id`."
  options:
    sub: { en: "The object returned by subscription() has no location property.", fr: "L'objet renvoyé par subscription() n'a pas de propriété location." }
    dep: { en: "A hard-coded region does not follow the resource group's region.", fr: "Une région codée en dur ne suit pas la région du groupe de ressources." }
    env: { en: "environment() describes the Azure cloud (endpoints), not a region.", fr: "environment() décrit le cloud Azure (points de terminaison), pas une région." }
    name: { en: "vnet.name returns the name, not the resource ID.", fr: "vnet.name renvoie le nom, pas l'ID de ressource." }
    propid: { en: "The resource ID is a top-level property of the resource, not under properties.", fr: "L'ID de ressource est une propriété de premier niveau de la ressource, pas un élément de properties." }
    rid: { en: "resourceId() expects a resource type and names, not a symbolic name.", fr: "resourceId() attend un type de ressource et des noms, pas un nom symbolique." }
references:
  - title: Bicep functions - scopes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-functions-scope
  - title: Outputs in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/outputs
