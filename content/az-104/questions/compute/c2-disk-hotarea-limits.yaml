id: c2-disk-hotarea-limits
objective: "3.2.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A running zonal virtual machine named **VM11** has the managed disks shown in the following table. Host caching is set to **None** on all data disks. No disk was created from an Azure Compute Gallery image, and no disk uses bursting, shared disks, double encryption, Azure Site Recovery or Azure Backup.

    Answer each prompt by selecting the appropriate disk.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle zonale en cours d'exécution nommée **VM11** possède les disques managés présentés dans le tableau suivant. La mise en cache de l'hôte est définie sur **None** sur tous les disques de données. Aucun disque n'a été créé à partir d'une image Azure Compute Gallery, et aucun disque n'utilise le bursting, les disques partagés, le double chiffrement, Azure Site Recovery ou Sauvegarde Azure.

    Répondez à chaque consigne en sélectionnant le disque approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "You need to expand a disk to 6 TiB without deallocating VM11 or detaching the disk. Which disk can you expand?", fr: "Vous devez étendre un disque à 6 Tio sans libérer VM11 ni détacher le disque. Quel disque pouvez-vous étendre ?" }
    - id: p2
      text: { en: "Which disk that isn't already a Premium SSD v2 disk can't be converted to Premium SSD v2 by changing its disk type?", fr: "Parmi les disques qui ne sont pas déjà des SSD Premium v2, lequel ne peut pas être converti en SSD Premium v2 en changeant son type de disque ?" }
  grid:
    header: [{ en: "Disk", fr: "Disque" }, { en: Role, fr: Rôle }, { en: Type, fr: Type }, { en: Size, fr: Taille }]
    rows:
      - [{ text: VM11-os, area: os }, { text: { en: "OS disk", fr: "Disque du système d'exploitation" } }, { text: { en: Premium SSD, fr: SSD Premium } }, { text: { en: 127 GiB, fr: 127 Gio } }]
      - [{ text: VM11-data1, area: d1 }, { text: { en: "Data disk", fr: "Disque de données" } }, { text: { en: Premium SSD, fr: SSD Premium } }, { text: { en: 1 TiB, fr: 1 Tio } }]
      - [{ text: VM11-data2, area: d2 }, { text: { en: "Data disk", fr: "Disque de données" } }, { text: { en: Standard SSD, fr: SSD Standard } }, { text: { en: 4 TiB, fr: 4 Tio } }]
      - [{ text: VM11-data3, area: d3 }, { text: { en: "Data disk", fr: "Disque de données" } }, { text: { en: Premium SSD v2, fr: SSD Premium v2 } }, { text: { en: 2 TiB, fr: 2 Tio } }]
answer:
  values: { p1: d3, p2: os }
explanation:
  correct:
    en: Data disks can be expanded without downtime, but a Standard HDD, Standard SSD or Premium SSD of 4 TiB or less must be detached (with the VM deallocated) before it grows beyond 4 TiB; that limitation doesn't apply to Premium SSD v2, so only VM11-data3 can reach 6 TiB online. Premium SSD v2 can't be used as an OS disk, so VM11-os can't be switched to it, whereas the Premium SSD and Standard SSD data disks can.
    fr: "Les disques de données peuvent être étendus sans interruption, mais un disque HDD Standard, SSD Standard ou SSD Premium de 4 Tio ou moins doit être détaché (machine libérée) avant de dépasser 4 Tio ; cette limitation ne s'applique pas au SSD Premium v2 : seul VM11-data3 peut atteindre 6 Tio en ligne. Le SSD Premium v2 ne peut pas servir de disque du système d'exploitation : VM11-os ne peut donc pas être converti, alors que les disques de données SSD Premium et SSD Standard le peuvent."
references:
  - title: "Expand Virtual Hard Disks Attached to a Windows VM in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks
  - title: Convert managed disks storage between different disk types
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-convert-types
