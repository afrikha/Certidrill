id: c1-arm-copy-disks
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an ARM template that deploys one managed disk. The template has an integer parameter named **diskCount**.

    You need to modify the template to meet the following requirements:

    - Deploy the number of managed disks specified by diskCount.
    - Name the disks disk-vm1-1, disk-vm1-2, and so on.
    - Deploy the disks two at a time.

    How should you complete the resource definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle ARM qui déploie un disque managé. Le modèle possède un paramètre entier nommé **diskCount**.

    Vous devez modifier le modèle pour répondre aux exigences suivantes :

    - déployer le nombre de disques managés indiqué par diskCount ;
    - nommer les disques disk-vm1-1, disk-vm1-2, et ainsi de suite ;
    - déployer les disques deux par deux.

    Comment devez-vous compléter la définition de ressource ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "type": "Microsoft.Compute/disks",
      "apiVersion": "2023-04-02",
      "name": "[[name]]",
      "location": "[resourceGroup().location]",
      "sku": {
        "name": "Premium_LRS"
      },
      "properties": {
        "creationData": {
          "createOption": "Empty"
        },
        "diskSizeGB": 128
      },
      "copy": {
        "name": "diskLoop",
        "count": "[[count]]",
        "mode": "[[mode]]",
        "batchSize": 2
      }
    }
  slots:
    - id: name
      options:
        - { id: idx1, text: "[format('disk-vm1-{0}', copyIndex(1))]" }
        - { id: idx0, text: "[format('disk-vm1-{0}', copyIndex())]" }
        - { id: param, text: "[format('disk-vm1-{0}', parameters('diskCount'))]" }
        - { id: len, text: "[format('disk-vm1-{0}', length(parameters('diskCount')))]" }
    - id: count
      options:
        - { id: p, text: "[parameters('diskCount')]" }
        - { id: lenp, text: "[length(parameters('diskCount'))]" }
        - { id: ci, text: "[copyIndex(parameters('diskCount'))]" }
        - { id: range, text: "[range(1, parameters('diskCount'))]" }
    - id: mode
      options:
        - { id: serial, text: serial }
        - { id: parallel, text: parallel }
        - { id: sequential, text: sequential }
        - { id: batch, text: batch }
answer:
  values: { name: idx1, count: p, mode: serial }
explanation:
  correct:
    en: "`count` takes the integer number of iterations, here the value of diskCount. `copyIndex()` is zero-based, so `copyIndex(1)` is needed for names that start at 1. To limit how many instances are deployed at the same time, set `mode` to `serial` and `batchSize` to 2; the default `parallel` mode deploys all instances at once."
    fr: "`count` reçoit le nombre entier d'itérations, ici la valeur de diskCount. `copyIndex()` est basé sur zéro : `copyIndex(1)` est nécessaire pour des noms qui commencent à 1. Pour limiter le nombre d'instances déployées en même temps, définissez `mode` sur `serial` et `batchSize` sur 2 ; le mode par défaut `parallel` déploie toutes les instances en même temps."
  options:
    idx0: { en: Without an offset the first disk would be disk-vm1-0., fr: "Sans décalage, le premier disque serait disk-vm1-0." }
    param: { en: "Every iteration would get the same name, and the deployment fails because the same resource is defined several times.", fr: "Chaque itération recevrait le même nom, et le déploiement échoue, car la même ressource est définie plusieurs fois." }
    lenp: { en: "diskCount is already an integer; length() expects an array, a string or an object.", fr: "diskCount est déjà un entier ; length() attend un tableau, une chaîne ou un objet." }
    range: { en: "count expects an integer, not an array.", fr: "count attend un entier, pas un tableau." }
    parallel: { en: "Parallel is the default mode, in which instances are deployed at the same time; batchSize is used with serial mode.", fr: "parallel est le mode par défaut, dans lequel les instances sont déployées en même temps ; batchSize s'utilise avec le mode serial." }
references:
  - title: Deploy multiple instances of resources
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/copy-resources
