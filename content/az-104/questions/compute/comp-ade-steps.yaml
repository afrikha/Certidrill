id: comp-ade-steps
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows virtual machine named **VM1** in the West Europe region. No key vault exists in the subscription.

    You need to enable Azure Disk Encryption on the OS disk of VM1 by using Azure PowerShell.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Windows nommée **VM1** dans la région West Europe. Aucun coffre de clés n'existe dans l'abonnement.

    Vous devez activer Azure Disk Encryption sur le disque du système d'exploitation de VM1 avec Azure PowerShell.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: kv
      text: { en: Create an Azure key vault in the West Europe region., fr: Créer un coffre de clés Azure dans la région West Europe. }
    - id: policy
      text: { en: Set the key vault access policy to enable access to Azure Disk Encryption for volume encryption., fr: Configurer la stratégie d'accès du coffre de clés pour autoriser Azure Disk Encryption pour le chiffrement de volume. }
    - id: run
      text: { en: "Run `Set-AzVMDiskEncryptionExtension` against VM1.", fr: "Exécuter `Set-AzVMDiskEncryptionExtension` sur VM1." }
    - id: rsv
      text: { en: Create a Recovery Services vault., fr: Créer un coffre Recovery Services. }
    - id: dealloc
      text: { en: Stop and deallocate VM1., fr: Arrêter et libérer VM1. }
    - id: snap
      text: { en: Create a snapshot of the OS disk and delete the original disk., fr: Créer un instantané du disque du système d'exploitation et supprimer le disque d'origine. }
answer:
  sequence: [ kv, policy, run ]
explanation:
  correct:
    en: Azure Disk Encryption stores its secrets in a key vault located in the same region as the VM. The vault must be enabled for disk encryption (`EnabledForDiskEncryption`) before you run `Set-AzVMDiskEncryptionExtension`, which installs the extension and encrypts the volumes while the VM is running.
    fr: Azure Disk Encryption stocke ses secrets dans un coffre de clés situé dans la même région que la machine virtuelle. Le coffre doit être activé pour le chiffrement de disque (`EnabledForDiskEncryption`) avant d'exécuter `Set-AzVMDiskEncryptionExtension`, qui installe l'extension et chiffre les volumes pendant que la machine fonctionne.
  options:
    rsv: { en: "A Recovery Services vault is used by Azure Backup and Site Recovery, not by disk encryption.", fr: "Un coffre Recovery Services sert à Sauvegarde Azure et à Azure Site Recovery, pas au chiffrement des disques." }
    dealloc: { en: The VM must be running for the extension to encrypt its volumes., fr: La machine virtuelle doit être en cours d'exécution pour que l'extension chiffre ses volumes. }
references:
  - title: Create and encrypt a Windows VM with Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-powershell-quickstart
  - title: Create and configure a key vault for Azure Disk Encryption
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-key-vault
