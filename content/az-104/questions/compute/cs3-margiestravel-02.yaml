id: cs3-margiestravel-02
objective: "3.4.4"
type: ordering
caseStudy: cs3-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    asp-booking-we now runs in the Standard tier, and the margiestravel.com zone is hosted in Azure DNS. You need to secure www.margiestravel.com to meet the HTTPS requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    asp-booking-we s'exécute désormais au niveau Standard, et la zone margiestravel.com est hébergée dans Azure DNS. Vous devez sécuriser www.margiestravel.com pour satisfaire l'exigence HTTPS.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rec, text: { en: "Create the CNAME record www and the TXT record asuid.www in the margiestravel.com zone.", fr: "Créer l'enregistrement CNAME www et l'enregistrement TXT asuid.www dans la zone margiestravel.com." } }
    - { id: dom, text: { en: "Add the custom domain www.margiestravel.com to app-booking-we.", fr: "Ajouter le domaine personnalisé www.margiestravel.com à app-booking-we." } }
    - { id: cert, text: { en: "Create an App Service managed certificate for www.margiestravel.com.", fr: "Créer un certificat managé App Service pour www.margiestravel.com." } }
    - { id: bind, text: { en: "Add a TLS/SSL binding of type SNI SSL that uses the managed certificate.", fr: "Ajouter une liaison TLS/SSL de type SNI SSL qui utilise le certificat managé." } }
    - { id: pfx, text: { en: "Upload a PFX certificate purchased from a public certificate authority.", fr: "Charger un certificat PFX acheté auprès d'une autorité de certification publique." } }
    - { id: wild, text: { en: "Create an App Service managed certificate for *.margiestravel.com.", fr: "Créer un certificat managé App Service pour *.margiestravel.com." } }
answer:
  sequence: [rec, dom, cert, bind]
explanation:
  correct:
    en: "App Service validates the domain with the TXT record asuid.www and maps it with the CNAME record, so the records must exist before you add the custom domain. A free managed certificate can be created only for a custom domain that is already mapped to the app, and the certificate must exist before you bind it to the host name."
    fr: "App Service valide le domaine avec l'enregistrement TXT asuid.www et le mappe avec l'enregistrement CNAME : les enregistrements doivent donc exister avant l'ajout du domaine personnalisé. Un certificat managé gratuit ne peut être créé que pour un domaine personnalisé déjà mappé à l'application, et le certificat doit exister avant sa liaison au nom d'hôte."
  options:
    pfx: { en: "A purchased certificate isn't free and isn't renewed by App Service.", fr: "Un certificat acheté n'est pas gratuit et n'est pas renouvelé par App Service." }
    wild: { en: "App Service managed certificates don't support wildcard certificates.", fr: "Les certificats managés App Service ne prennent pas en charge les certificats génériques (wildcard)." }
references:
  - title: "Install a TLS/SSL Certificate for Your App - Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate
  - title: "Secure a custom DNS name with a TLS/SSL binding in Azure App Service"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings
