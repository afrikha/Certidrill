id: c1-arm-output-blob
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an ARM template that deploys a storage account. The name of the storage account is stored in a variable named `storageName`.

    You need to add an output that returns the primary blob endpoint of the storage account after the deployment.

    ```json
    "outputs": {
      "blobEndpoint": {
        "type": "string",
        "value": "..."
      }
    }
    ```

    Which value should you use for the output?
  fr: |
    Vous disposez d'un modèle ARM qui déploie un compte de stockage. Le nom du compte de stockage est stocké dans une variable nommée `storageName`.

    Vous devez ajouter une sortie qui renvoie le point de terminaison blob principal du compte de stockage après le déploiement.

    ```json
    "outputs": {
      "blobEndpoint": {
        "type": "string",
        "value": "..."
      }
    }
    ```

    Quelle valeur devez-vous utiliser pour la sortie ?
body:
  options:
    - id: a
      text: |-
        `"[reference(resourceId('Microsoft.Storage/storageAccounts', variables('storageName'))).primaryEndpoints.blob]"`
    - id: b
      text: |-
        `"[resourceId('Microsoft.Storage/storageAccounts', variables('storageName')).primaryEndpoints.blob]"`
    - id: c
      text: |-
        `"[variables('storageName').primaryEndpoints.blob]"`
    - id: d
      text: |-
        `"[reference(variables('storageName')).properties.primaryEndpoints.blob]"`
answer: { optionId: a }
explanation:
  correct:
    en: "`reference()` returns the runtime state of a resource. Called without the 'Full' argument, it returns the resource's properties object, so `primaryEndpoints.blob` can be read directly from it. Passing the resource ID built with `resourceId()` identifies the storage account unambiguously."
    fr: "`reference()` renvoie l'état d'exécution d'une ressource. Appelée sans l'argument 'Full', elle renvoie l'objet des propriétés de la ressource : `primaryEndpoints.blob` peut donc y être lu directement. L'ID de ressource construit avec `resourceId()` identifie le compte de stockage sans ambiguïté."
  options:
    b: { en: resourceId() returns a string ID, not the runtime properties of the resource., fr: "resourceId() renvoie un ID sous forme de chaîne, pas les propriétés d'exécution de la ressource." }
    c: { en: The variable is only the name of the account; a string has no endpoint properties., fr: "La variable n'est que le nom du compte ; une chaîne n'a pas de propriétés de point de terminaison." }
    d: { en: "Without 'Full', reference() already returns the properties object, so the extra properties segment does not exist.", fr: "Sans 'Full', reference() renvoie déjà l'objet des propriétés : le segment properties supplémentaire n'existe pas." }
references:
  - title: Outputs in templates
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/outputs
  - title: Template functions - resources
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-resource
