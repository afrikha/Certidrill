id: c4-tls-https-min-version
objective: "3.4.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-woodgrove** in a resource group named **rg-web**. A custom domain with an SNI SSL binding is already configured. The app currently accepts HTTP requests, and its minimum TLS version is set to 1.0.

    You need to use the Azure CLI to make sure that:

    - HTTP requests are redirected to HTTPS;
    - clients that only support TLS 1.0 or TLS 1.1 can't connect.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application web nommée **app-woodgrove** dans un groupe de ressources nommé **rg-web**. Un domaine personnalisé avec une liaison SNI SSL est déjà configuré. L'application accepte actuellement les requêtes HTTP, et sa version TLS minimale est définie sur 1.0.

    Vous devez utiliser Azure CLI pour vous assurer que :

    - les requêtes HTTP sont redirigées vers HTTPS ;
    - les clients qui ne prennent en charge que TLS 1.0 ou TLS 1.1 ne peuvent pas se connecter.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az webapp update --resource-group rg-web --name app-woodgrove [[a]] true

    az webapp config set --resource-group rg-web --name app-woodgrove [[b]] 1.2
  slots:
    - id: a
      options:
        - { id: httpsonly, text: "--https-only" }
        - { id: affinity, text: "--client-affinity-enabled" }
        - { id: e2e, text: "--end-to-end-encryption-enabled" }
    - id: b
      options:
        - { id: mintls, text: "--min-tls-version" }
        - { id: cipher, text: "--min-tls-cipher-suite" }
        - { id: ftps, text: "--ftps-state" }
answer:
  values: { a: httpsonly, b: mintls }
explanation:
  correct:
    en: |
      `az webapp update --https-only true` enables the **HTTPS Only** setting, which redirects all HTTP traffic to HTTPS. `az webapp config set --min-tls-version 1.2` rejects connections that use an older TLS version.
    fr: |
      `az webapp update --https-only true` active le paramètre **HTTPS uniquement** (HTTPS Only), qui redirige tout le trafic HTTP vers HTTPS. `az webapp config set --min-tls-version 1.2` refuse les connexions qui utilisent une version TLS plus ancienne.
  options:
    affinity:
      en: |
        This setting controls session affinity cookies.
      fr: |
        Ce paramètre contrôle les cookies d'affinité de session.
    cipher:
      en: |
        The minimum cipher suite expects a cipher suite name, not a TLS version.
      fr: |
        La suite de chiffrement minimale attend un nom de suite de chiffrement, pas une version TLS.
    e2e:
      en: |
        End-to-end encryption encrypts the traffic between the App Service front ends and the workers; it doesn't redirect HTTP to HTTPS.
      fr: |
        Le chiffrement de bout en bout chiffre le trafic entre les serveurs frontaux App Service et les workers ; il ne redirige pas HTTP vers HTTPS.
    ftps:
      en: |
        --ftps-state controls FTP/FTPS access (AllAllowed, FtpsOnly, Disabled).
      fr: |
        --ftps-state contrôle l'accès FTP/FTPS (AllAllowed, FtpsOnly, Disabled).
references:
  - title: "Configure an App Service App"
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-common
  - title: az webapp config
    url: https://learn.microsoft.com/en-us/cli/azure/webapp/config
