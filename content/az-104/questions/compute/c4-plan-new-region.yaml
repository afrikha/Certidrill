id: c4-plan-new-region
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an App Service plan named **Plan1** in the West Europe region. Plan1 is in the Premium v3 tier and hosts two web apps named App1 and App2.

    You need to make sure that App2 runs in the North Europe region and that its compute resources can be scaled independently of App1.

    What should you do?
  fr: |
    Vous disposez d'un plan App Service nommé **Plan1** dans la région West Europe. Plan1 est au niveau Premium v3 et héberge deux applications web nommées App1 et App2.

    Vous devez vous assurer qu'App2 s'exécute dans la région North Europe et que ses ressources de calcul peuvent être mises à l'échelle indépendamment d'App1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Create a new App Service plan in North Europe and deploy App2 to it., fr: Créer un plan App Service dans North Europe et y déployer App2. } }
    - { id: b, text: { en: Enable per-app scaling on Plan1 and limit App2 to two instances., fr: Activer la mise à l'échelle par application sur Plan1 et limiter App2 à deux instances. } }
    - { id: c, text: { en: Scale out Plan1 and add an instance in North Europe., fr: Effectuer un scale-out de Plan1 et ajouter une instance dans North Europe. } }
    - { id: d, text: { en: Create a deployment slot for App2 in North Europe., fr: Créer un emplacement de déploiement pour App2 dans North Europe. } }
answer: { optionId: a }
explanation:
  correct:
    en: An App Service plan defines a set of compute resources in one region, and every app in the plan runs on those resources. To run App2 in another region and scale it on its own, it needs its own plan created in North Europe.
    fr: Un plan App Service définit un ensemble de ressources de calcul dans une seule région, et toutes les applications du plan s'exécutent sur ces ressources. Pour exécuter App2 dans une autre région et la mettre à l'échelle séparément, elle a besoin de son propre plan créé dans North Europe.
  options:
    b:
      en: Per-app scaling limits App2 to a subset of Plan1's instances, but those instances stay in West Europe.
      fr: La mise à l'échelle par application limite App2 à une partie des instances de Plan1, mais ces instances restent dans West Europe.
    c:
      en: All the instances of a plan are in the plan's region; you cannot add an instance in another region.
      fr: Toutes les instances d'un plan se trouvent dans la région du plan ; vous ne pouvez pas ajouter une instance dans une autre région.
    d:
      en: Deployment slots run on the same instances as their app, in the same plan and region.
      fr: Les emplacements de déploiement s'exécutent sur les mêmes instances que leur application, dans le même plan et la même région.
references:
  - title: "Azure App Service Plans"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
