id: c4-scale-up-memory
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a web app named **app-adatum** that runs on an App Service plan in the Standard S1 tier with three instances.

    The app regularly runs out of memory on each instance while it processes large reports. The number of requests is stable.

    You need to give each instance more memory.

    What should you do?
  fr: |
    Vous disposez d'une application web nommée **app-adatum** qui s'exécute sur un plan App Service de niveau Standard S1 avec trois instances.

    L'application manque régulièrement de mémoire sur chaque instance lorsqu'elle traite des rapports volumineux. Le nombre de requêtes est stable.

    Vous devez fournir davantage de mémoire à chaque instance.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Scale up the App Service plan to the Standard S2 tier., fr: Effectuer un scale-up du plan App Service vers le niveau Standard S2. } }
    - { id: b, text: { en: Scale out the App Service plan to six instances., fr: Effectuer un scale-out du plan App Service vers six instances. } }
    - { id: c, text: { en: Add an autoscale rule based on the Memory Percentage metric., fr: Ajouter une règle de mise à l'échelle automatique basée sur la métrique Memory Percentage. } }
    - { id: d, text: { en: Turn on session affinity (ARR affinity) for the app., fr: Activer l'affinité de session (affinité ARR) pour l'application. } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Scaling up changes the pricing tier or size of the plan, which gives each instance more CPU, memory and disk. S2 instances have more memory than S1 instances. The change applies to all apps in the plan within seconds and needs no redeployment.
    fr: |
      Le scale-up change le niveau tarifaire ou la taille du plan, ce qui donne à chaque instance plus de processeur, de mémoire et de disque. Les instances S2 disposent de plus de mémoire que les instances S1. La modification s'applique en quelques secondes à toutes les applications du plan, sans redéploiement.
  options:
    b:
      en: |
        Scaling out adds instances of the same size; each instance still has the same amount of memory.
      fr: |
        Le scale-out ajoute des instances de la même taille ; chaque instance dispose toujours de la même quantité de mémoire.
    c:
      en: |
        An autoscale rule changes the instance count, not the memory of each instance.
      fr: |
        Une règle de mise à l'échelle automatique modifie le nombre d'instances, pas la mémoire de chaque instance.
    d:
      en: |
        Session affinity only pins clients to an instance; it does not add memory.
      fr: |
        L'affinité de session ne fait qu'attacher les clients à une instance ; elle n'ajoute pas de mémoire.
references:
  - title: "Scale Up Features and Capacities"
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
