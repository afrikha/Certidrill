id: c1-deploy-template-spec
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an ARM template named **storage.json** that deploys a standardized storage account. A resource group named **RG-Templates** already exists. The members of the operations team have the Contributor role on a resource group named **RG-Ops**.

    You need to make the template available to the operations team so that they can deploy it to RG-Ops. The team must not be able to modify the template, and you must not use SAS tokens. The solution must follow the principle of least privilege.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un modèle ARM nommé **storage.json** qui déploie un compte de stockage standardisé. Un groupe de ressources nommé **RG-Templates** existe déjà. Les membres de l'équipe d'exploitation disposent du rôle Contributor sur un groupe de ressources nommé **RG-Ops**.

    Vous devez mettre le modèle à la disposition de l'équipe d'exploitation pour qu'elle puisse le déployer dans RG-Ops. L'équipe ne doit pas pouvoir modifier le modèle, et vous ne devez pas utiliser de jetons SAS. La solution doit respecter le principe du moindre privilège.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ts, text: { en: "Run `az ts create --name storageSpec --version 1.0 --resource-group RG-Templates --location westeurope --template-file storage.json`.", fr: "Exécuter `az ts create --name storageSpec --version 1.0 --resource-group RG-Templates --location westeurope --template-file storage.json`." } }
    - { id: role, text: { en: "Assign the Template Spec Reader role on the template spec to the operations team.", fr: "Attribuer le rôle Template Spec Reader sur la spec de modèle à l'équipe d'exploitation." } }
    - { id: show, text: { en: "The operations team gets the ID of the template spec version by running `az ts show --name storageSpec --resource-group RG-Templates --version 1.0 --query id`.", fr: "L'équipe d'exploitation obtient l'ID de la version de la spec de modèle en exécutant `az ts show --name storageSpec --resource-group RG-Templates --version 1.0 --query id`." } }
    - { id: deploy, text: { en: "The operations team runs `az deployment group create --resource-group RG-Ops --template-spec <id>`.", fr: "L'équipe d'exploitation exécute `az deployment group create --resource-group RG-Ops --template-spec <id>`." } }
    - { id: sas, text: { en: Upload storage.json to a blob container and share the URL of the template with the team., fr: "Charger storage.json dans un conteneur d'objets blob et partager l'URL du modèle avec l'équipe." } }
    - { id: contrib, text: { en: "Assign the Template Spec Contributor role on RG-Templates to the operations team.", fr: "Attribuer le rôle Template Spec Contributor sur RG-Templates à l'équipe d'exploitation." } }
answer:
  sequence: [ ts, role, show, deploy ]
explanation:
  correct:
    en: A template spec stores the template as an Azure resource (Microsoft.Resources/templateSpecs) and access is managed with Azure RBAC rather than SAS tokens. Users only need read access to the template spec, for example the Template Spec Reader role, plus deployment permissions on the target resource group. They deploy it by passing the ID of a template spec version to `--template-spec`.
    fr: "Une spec de modèle stocke le modèle sous forme de ressource Azure (Microsoft.Resources/templateSpecs), et l'accès est géré avec Azure RBAC plutôt qu'avec des jetons SAS. Les utilisateurs n'ont besoin que d'un accès en lecture à la spec de modèle, par exemple le rôle Template Spec Reader, ainsi que des autorisations de déploiement sur le groupe de ressources cible. Ils la déploient en passant l'ID d'une version de la spec de modèle à `--template-spec`."
  options:
    sas: { en: A template in a private container needs a SAS token or public access to be deployed from its URL., fr: "Un modèle stocké dans un conteneur privé nécessite un jeton SAS ou un accès public pour être déployé depuis son URL." }
    contrib: { en: "Template Spec Contributor would let the team modify template specs, which exceeds the requirement.", fr: "Template Spec Contributor permettrait à l'équipe de modifier les specs de modèle, ce qui dépasse le besoin." }
references:
  - title: Create & deploy template specs
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-specs
