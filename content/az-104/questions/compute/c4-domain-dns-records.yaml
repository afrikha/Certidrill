id: c4-domain-dns-records
objective: "3.4.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-contoso** that runs on an App Service plan in the Basic B1 tier. The public DNS zone **contoso.com** is hosted by a third-party DNS provider.

    You need to map both **contoso.com** and **www.contoso.com** to app-contoso by using the record types recommended for each name, and include the domain verification records.

    Which DNS record type should you create for each host? To answer, drag the appropriate record types to the correct hosts. Each record type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application web nommée **app-contoso** qui s'exécute sur un plan App Service de niveau Basic B1. La zone DNS publique **contoso.com** est hébergée par un fournisseur DNS tiers.

    Vous devez mapper **contoso.com** et **www.contoso.com** à app-contoso en utilisant les types d'enregistrements recommandés pour chaque nom, et inclure les enregistrements de vérification du domaine.

    Quel type d'enregistrement DNS devez-vous créer pour chaque hôte ? Pour répondre, faites glisser les types d'enregistrements appropriés vers les hôtes correspondants. Chaque type d'enregistrement peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: a, text: A }
    - { id: cname, text: CNAME }
    - { id: txt, text: TXT }
    - { id: mx, text: MX }
    - { id: ns, text: NS }
  targets:
    - id: root
      text: { en: "Host @ (maps contoso.com to the app)", fr: "Hôte @ (mappe contoso.com à l'application)" }
    - id: asuid
      text: { en: "Host asuid (proves ownership of contoso.com)", fr: "Hôte asuid (prouve la propriété de contoso.com)" }
    - id: www
      text: { en: "Host www (maps www.contoso.com to the app)", fr: "Hôte www (mappe www.contoso.com à l'application)" }
    - id: asuidwww
      text: { en: "Host asuid.www (proves ownership of www.contoso.com)", fr: "Hôte asuid.www (prouve la propriété de www.contoso.com)" }
answer:
  mapping: { root: a, asuid: txt, www: cname, asuidwww: txt }
explanation:
  correct:
    en: |
      A root domain is mapped with an A record that points to the app's IP address (a CNAME must not be used at the apex). A subdomain is preferably mapped with a CNAME record to the app's default host name, which doesn't change if the IP changes. Each custom domain also needs a TXT record (asuid for the root, asuid.www for www) that contains the domain verification ID.
    fr: |
      Un domaine racine est mappé avec un enregistrement A qui pointe vers l'adresse IP de l'application (un CNAME ne doit pas être utilisé à l'apex). Un sous-domaine est de préférence mappé avec un enregistrement CNAME vers le nom d'hôte par défaut de l'application, qui ne change pas si l'adresse IP change. Chaque domaine personnalisé nécessite aussi un enregistrement TXT (asuid pour la racine, asuid.www pour www) contenant l'ID de vérification de domaine.
  options:
    mx: { en: "MX records route email for a domain; they don't map a host name to a web app.", fr: "Les enregistrements MX acheminent le courrier d'un domaine ; ils ne mappent pas un nom d'hôte à une application web." }
    ns: { en: "NS records delegate a zone to name servers; App Service doesn't use them for mapping or verification.", fr: "Les enregistrements NS délèguent une zone à des serveurs de noms ; App Service ne les utilise ni pour le mappage ni pour la vérification." }
references:
  - title: Set up an existing custom domain name for your app in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
