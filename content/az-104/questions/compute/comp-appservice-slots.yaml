id: comp-appservice-slots
objective: "3.4.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an App Service web app named **app-shop** that runs on an App Service plan in the **Standard S1** tier. You plan to use deployment slots for releases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous disposez d'une application web App Service nommée **app-shop**, exécutée sur un plan App Service de niveau **Standard S1**. Vous prévoyez d'utiliser des emplacements de déploiement pour les mises en production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You can add a staging slot to app-shop without changing the App Service plan tier.
        fr: Vous pouvez ajouter un emplacement de préproduction à app-shop sans changer le niveau du plan App Service.
    - id: s2
      text:
        en: When you swap the staging and production slots, an app setting marked as a deployment slot setting moves to production with the swapped content.
        fr: Lorsque vous permutez les emplacements de préproduction et de production, un paramètre d'application marqué comme paramètre d'emplacement de déploiement passe en production avec le contenu permuté.
    - id: s3
      text:
        en: You can route a percentage of production traffic to the staging slot.
        fr: Vous pouvez acheminer un pourcentage du trafic de production vers l'emplacement de préproduction.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Deployment slots are available from the Standard tier (S1 supports up to five slots). Settings marked as deployment slot settings are \"sticky\": they stay with their slot and do not follow the content during a swap. Traffic routing (testing in production) can send a percentage of the production traffic to another slot."
    fr: "Les emplacements de déploiement sont disponibles à partir du niveau Standard (S1 prend en charge jusqu'à cinq emplacements). Les paramètres marqués comme paramètres d'emplacement sont « collants » : ils restent dans leur emplacement et ne suivent pas le contenu lors d'une permutation. Le routage du trafic (test en production) peut envoyer un pourcentage du trafic de production vers un autre emplacement."
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
