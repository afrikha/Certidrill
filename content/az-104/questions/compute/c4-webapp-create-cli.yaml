id: c4-webapp-create-cli
objective: "3.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Linux App Service plan named **plan-linux** in a resource group named **rg-web**.

    You need to use the Azure CLI to:

    - list the Python versions that are available for Linux web apps;
    - create a Python web app named **app-tailspin-api** in plan-linux;
    - make sure that all HTTP requests to the app are redirected to HTTPS.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un plan App Service Linux nommé **plan-linux** dans un groupe de ressources nommé **rg-web**.

    Vous devez utiliser Azure CLI pour :

    - lister les versions de Python disponibles pour les applications web Linux ;
    - créer une application web Python nommée **app-tailspin-api** dans plan-linux ;
    - vous assurer que toutes les requêtes HTTP vers l'application sont redirigées vers HTTPS.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az webapp list-runtimes --os-type [[os]] --runtime python

    az webapp create --resource-group rg-web --plan plan-linux \
      --name app-tailspin-api [[rt]] "PYTHON:3.12" [[https]] true
  slots:
    - id: os
      options:
        - { id: linux, text: linux }
        - { id: windows, text: windows }
        - { id: container, text: container }
    - id: rt
      options:
        - { id: runtime, text: "--runtime" }
        - { id: startup, text: "--startup-file" }
        - { id: image, text: "--container-image-name" }
    - id: https
      options:
        - { id: httpsonly, text: "--https-only" }
        - { id: e2e, text: "--end-to-end-encryption-enabled" }
        - { id: basicauth, text: "--basic-auth" }
answer:
  values: { os: linux, rt: runtime, https: httpsonly }
explanation:
  correct:
    en: |
      `az webapp list-runtimes --os-type linux` lists the runtime stacks available for Linux apps. `az webapp create` takes the runtime stack in `Framework:Version` format with `--runtime`, and `--https-only true` redirects HTTP traffic to HTTPS.
    fr: |
      `az webapp list-runtimes --os-type linux` liste les piles d'exécution disponibles pour les applications Linux. `az webapp create` reçoit la pile d'exécution au format `Framework:Version` avec `--runtime`, et `--https-only true` redirige le trafic HTTP vers HTTPS.
  options:
    container:
      en: |
        The accepted values of --os-type are linux and windows.
      fr: |
        Les valeurs acceptées par --os-type sont linux et windows.
    startup:
      en: |
        `--startup-file` sets the startup command or file of a Linux app, not its runtime stack.
      fr: |
        `--startup-file` définit la commande ou le fichier de démarrage d'une application Linux, pas sa pile d'exécution.
    image:
      en: |
        `--container-image-name` deploys a container image instead of a built-in runtime stack.
      fr: |
        `--container-image-name` déploie une image conteneur au lieu d'une pile d'exécution intégrée.
    e2e:
      en: |
        End-to-end encryption secures traffic between the front ends and the workers; it does not redirect HTTP to HTTPS.
      fr: |
        Le chiffrement de bout en bout sécurise le trafic entre les serveurs frontaux et les workers ; il ne redirige pas HTTP vers HTTPS.
    basicauth:
      en: |
        --basic-auth controls basic authentication for SCM and FTP publishing and expects Enabled or Disabled.
      fr: |
        --basic-auth contrôle l'authentification de base pour la publication SCM et FTP et attend Enabled ou Disabled.
references:
  - title: az webapp
    url: https://learn.microsoft.com/en-us/cli/azure/webapp
