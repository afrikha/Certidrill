id: c3-aci-azure-files-cli
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a storage account named **stwoodgrovereports** that contains an Azure file share named **reports**.

    You need to deploy a Linux container instance named **aci-report** that meets the following requirements:

    - The container writes its output to the reports share, mounted at `/mnt/reports`.
    - The container is restarted automatically only if it fails.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un compte de stockage nommé **stwoodgrovereports** qui contient un partage de fichiers Azure nommé **reports**.

    Vous devez déployer une instance de conteneur Linux nommée **aci-report** qui répond aux exigences suivantes :

    - Le conteneur écrit sa sortie dans le partage reports, monté sur `/mnt/reports`.
    - Le conteneur est redémarré automatiquement uniquement en cas d'échec.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az container create \
      --resource-group rg-reports \
      --name aci-report \
      --image woodgrove/report-gen:2.1 \
      --os-type Linux \
      --restart-policy [[policy]] \
      --azure-file-volume-account-name stwoodgrovereports \
      --azure-file-volume-account-key $STORAGE_KEY \
      [[share]] reports \
      [[mount]] /mnt/reports
  slots:
    - id: policy
      options:
        - { id: always, text: Always }
        - { id: never, text: Never }
        - { id: onfailure, text: OnFailure }
    - id: share
      options:
        - { id: sharename, text: "--azure-file-volume-share-name" }
        - { id: filesharename, text: "--file-share-name" }
        - { id: volumename, text: "--volume-name" }
        - { id: sharepath, text: "--share-path" }
    - id: mount
      options:
        - { id: mountpath, text: "--azure-file-volume-mount-path" }
        - { id: mountpt, text: "--mount-path" }
        - { id: volmount, text: "--volume-mount-path" }
        - { id: target, text: "--target-path" }
answer:
  values: { policy: onfailure, share: sharename, mount: mountpath }
explanation:
  correct:
    en: "To mount an Azure file share with `az container create`, you provide four values: the storage account name, the storage account key, the share name (`--azure-file-volume-share-name`) and the path inside the container (`--azure-file-volume-mount-path`). Azure Files volumes are supported only for Linux containers. `--restart-policy OnFailure` restarts the container only when it exits with a nonzero code."
    fr: "Pour monter un partage de fichiers Azure avec `az container create`, vous fournissez quatre valeurs : le nom du compte de stockage, la clé du compte de stockage, le nom du partage (`--azure-file-volume-share-name`) et le chemin dans le conteneur (`--azure-file-volume-mount-path`). Les volumes Azure Files ne sont pris en charge que pour les conteneurs Linux. `--restart-policy OnFailure` ne redémarre le conteneur que lorsqu'il se termine avec un code différent de zéro."
  options:
    always: { en: "Always also restarts the container after a successful exit.", fr: "Always redémarre aussi le conteneur après une sortie réussie." }
    never: { en: "Never does not restart the container when it fails.", fr: "Never ne redémarre pas le conteneur en cas d'échec." }
references:
  - title: Mount Azure Files volume to container group
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-volume-azure-files
  - title: Restart policy for run-once tasks
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-restart-policy
