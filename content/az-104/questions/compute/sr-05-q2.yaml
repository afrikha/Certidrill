id: sr-05-q2
objective: "3.2.6"
type: series_yesno
series: sr-05-zone-resilience
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You deploy one virtual machine to each of zones 1, 2, and 3.
  fr: |
    Vous déployez une machine virtuelle dans chacune des zones 1, 2 et 3.
body:
  solution:
    en: |
      You deploy the three virtual machines as zonal virtual machines: **VM1 in zone 1**, **VM2 in zone 2**, and **VM3 in zone 3**. You add the three virtual machines to the backend pool of the load balancer.
    fr: |
      Vous déployez les trois machines virtuelles comme machines virtuelles zonales : **VM1 dans la zone 1**, **VM2 dans la zone 2** et **VM3 dans la zone 3**. Vous ajoutez les trois machines virtuelles au pool principal de l'équilibreur de charge.
answer: { value: true }
explanation:
  correct:
    en: |
      Each availability zone is a physically separate location with independent power, cooling, and networking. If one zone fails, the two virtual machines in the other zones keep serving App1 through the zone-redundant load balancer, so the goal is met.
    fr: |
      Chaque zone de disponibilité est un emplacement physiquement distinct, avec une alimentation, un refroidissement et un réseau indépendants. Si une zone tombe en panne, les deux machines virtuelles des autres zones continuent de servir App1 via l'équilibreur de charge redondant interzone : l'objectif est atteint.
references:
  - title: "What are Azure availability zones?"
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
  - title: "Availability options for Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
