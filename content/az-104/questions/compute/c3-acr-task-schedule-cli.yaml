id: c3-acr-task-schedule-cli
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure container registry named **crlitware01**. A maintenance image named `tools/cleanup:1.0` is stored in the registry.

    You need to create an ACR task that runs a container from this image every day at 02:00 UTC. The task does not build any image and has no source code context.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.
  fr: |
    Litware dispose d'un registre de conteneurs Azure nommé **crlitware01**. Une image de maintenance nommée `tools/cleanup:1.0` est stockée dans le registre.

    Vous devez créer une tâche ACR qui exécute un conteneur à partir de cette image chaque jour à 02:00 UTC. La tâche ne génère aucune image et n'a aucun contexte de code source.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az acr [[cmd]] \
      --name nightly-cleanup \
      --registry crlitware01 \
      --cmd crlitware01.azurecr.io/tools/cleanup:1.0 \
      [[trigger]] "[[cron]]" \
      --context /dev/null
  slots:
    - id: cmd
      options:
        - { id: create, text: task create }
        - { id: build, text: build }
        - { id: run, text: run }
        - { id: taskrun, text: task run }
    - id: trigger
      options:
        - { id: schedule, text: "--schedule" }
        - { id: baseimg, text: "--base-image-trigger-enabled" }
        - { id: commit, text: "--commit-trigger-enabled" }
        - { id: timeout, text: "--timeout" }
    - id: cron
      options:
        - { id: c1, text: "0 2 * * *" }
        - { id: c2, text: "2 0 * * *" }
        - { id: c3, text: "0 0 2 * *" }
        - { id: c4, text: "* 2 * * *" }
answer:
  values: { cmd: create, trigger: schedule, cron: c1 }
explanation:
  correct:
    en: "`az acr task create` creates a task that is stored in the registry and can have triggers; `--schedule` adds a timer trigger that takes a five-field cron expression evaluated in UTC (`{minute} {hour} {day} {month} {day-of-week}`). `0 2 * * *` means minute 0 of hour 2, every day. `--context /dev/null` indicates that the task has no source context."
    fr: "`az acr task create` crée une tâche enregistrée dans le registre et pouvant avoir des déclencheurs ; `--schedule` ajoute un déclencheur de minuteur qui prend une expression cron à cinq champs évaluée en UTC (`{minute} {heure} {jour} {mois} {jour-de-la-semaine}`). `0 2 * * *` signifie minute 0 de l'heure 2, chaque jour. `--context /dev/null` indique que la tâche n'a pas de contexte source."
  options:
    build: { en: "`az acr build` is a quick task that builds and pushes an image once, on demand; it cannot be scheduled.", fr: "`az acr build` est une tâche rapide qui génère et envoie une image une seule fois, à la demande ; elle ne peut pas être planifiée." }
    run: { en: "`az acr run` runs a quick task immediately; it is not stored and has no triggers.", fr: "`az acr run` exécute immédiatement une tâche rapide ; elle n'est pas enregistrée et n'a pas de déclencheur." }
    taskrun: { en: "`az acr task run` manually starts an existing task; it does not create one.", fr: "`az acr task run` démarre manuellement une tâche existante ; il n'en crée pas." }
    baseimg: { en: "This option controls the trigger on base image updates, not a schedule.", fr: "Cette option contrôle le déclencheur sur la mise à jour de l'image de base, pas une planification." }
    commit: { en: A commit trigger requires a Git repository context; the task has no source context., fr: Un déclencheur sur validation exige un contexte de dépôt Git ; la tâche n'a pas de contexte source. }
    timeout: { en: "`--timeout` limits the run duration; it does not schedule the task.", fr: "`--timeout` limite la durée d'exécution ; il ne planifie pas la tâche." }
    c2: { en: This expression runs at 00:02 UTC (minute 2 of hour 0)., fr: Cette expression s'exécute à 00:02 UTC (minute 2 de l'heure 0). }
    c3: { en: This expression runs at midnight on the second day of each month only., fr: Cette expression ne s'exécute qu'à minuit le deuxième jour de chaque mois. }
    c4: { en: This expression runs every minute between 02:00 and 02:59 UTC., fr: Cette expression s'exécute chaque minute entre 02:00 et 02:59 UTC. }
references:
  - title: Schedule Azure Container Registry (ACR) Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-scheduled
  - title: Automate Container Builds with Azure Container Registry Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
