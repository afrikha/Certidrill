id: c2-vmss-upgrade-rolling
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Virtual Machine Scale Set named **VMSS2** that uses Uniform orchestration and runs a production web application behind a Standard Load Balancer that has a health probe.

    You plan to update the image reference of the scale set model regularly. The updates must be applied to the existing instances automatically, in batches, so that a set number of instances always remains available.

    Which upgrade policy mode should you configure?
  fr: |
    Vous disposez d'un groupe de machines virtuelles identiques nommé **VMSS2** qui utilise l'orchestration Uniforme et exécute une application web de production derrière un équilibreur de charge Standard doté d'une sonde d'intégrité.

    Vous prévoyez de mettre à jour régulièrement la référence d'image du modèle du groupe identique. Les mises à jour doivent être appliquées automatiquement aux instances existantes, par lots, afin qu'un nombre défini d'instances reste toujours disponible.

    Quel mode de stratégie de mise à niveau devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: Rolling, fr: Propagé (Rolling) }
    - id: b
      text: { en: Automatic, fr: Automatique (Automatic) }
    - id: c
      text: { en: Manual, fr: Manuel (Manual) }
    - id: d
      text: { en: Manual with instance protection on all instances, fr: Manuel (Manual) avec la protection des instances sur toutes les instances }
answer: { optionId: a }
explanation:
  correct:
    en: The rolling upgrade policy updates instances in batches, with settings such as batch size and maximum unhealthy percentage, so that the application stays available. It is the recommended mode for production workloads. With Uniform orchestration it requires a health probe or the Application Health extension, which VMSS2 has.
    fr: La stratégie de mise à niveau propagée met à jour les instances par lots, avec des paramètres tels que la taille du lot et le pourcentage maximal d'instances non saines, afin que l'application reste disponible. C'est le mode recommandé pour les charges de travail de production. Avec l'orchestration Uniforme, il nécessite une sonde d'intégrité ou l'extension Intégrité de l'application, dont VMSS2 dispose.
  options:
    b:
      en: In Automatic mode the scale set makes no guarantee about the order of updates and might take down all instances at the same time.
      fr: En mode Automatique, le groupe identique ne garantit pas l'ordre des mises à jour et peut arrêter toutes les instances en même temps.
    c:
      en: In Manual mode nothing happens to existing instances until you update them yourself, so updates are not applied automatically.
      fr: En mode Manuel, rien ne se passe sur les instances existantes tant que vous ne les mettez pas à jour vous-même ; les mises à jour ne sont donc pas appliquées automatiquement.
    d:
      en: Instance protection prevents instances from being changed by scale set actions, which is the opposite of the goal.
      fr: La protection des instances empêche les actions du groupe identique de modifier les instances, ce qui est l'inverse de l'objectif.
references:
  - title: Upgrade policy modes for Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
