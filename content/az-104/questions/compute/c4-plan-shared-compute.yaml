id: c4-plan-shared-compute
objective: "3.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your company, Fabrikam, uses Azure App Service. An App Service plan named **Plan1** is in the Standard S1 tier and hosts three web apps named App1, App2 and App3. Per-app scaling is disabled. Another plan named **Plan2** is in the Free F1 tier.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Votre entreprise, Fabrikam, utilise Azure App Service. Un plan App Service nommé **Plan1** est au niveau Standard S1 et héberge trois applications web nommées App1, App2 et App3. La mise à l'échelle par application est désactivée. Un autre plan nommé **Plan2** est au niveau Free F1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: If you scale out Plan1 to three instances, App1, App2 and App3 each run on all three instances.
        fr: Si vous effectuez un scale-out de Plan1 vers trois instances, App1, App2 et App3 s'exécutent chacune sur les trois instances.
    - id: s2
      text:
        en: Apps in Plan2 can run on the same VM as apps of other Azure customers.
        fr: Les applications de Plan2 peuvent s'exécuter sur la même machine virtuelle que les applications d'autres clients Azure.
    - id: s3
      text:
        en: You can scale out Plan2 to two instances without changing its pricing tier.
        fr: Vous pouvez effectuer un scale-out de Plan2 vers deux instances sans changer son niveau tarifaire.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: In dedicated tiers, all apps of a plan share its VM instances and scale together, so scaling Plan1 out to three instances runs every app on the three instances. The Free and Shared tiers run apps on VMs shared with other customers, with CPU quotas, and they cannot scale out.
    fr: "Dans les niveaux dédiés, toutes les applications d'un plan partagent ses instances de machine virtuelle et sont mises à l'échelle ensemble : un scale-out de Plan1 vers trois instances exécute donc chaque application sur les trois instances. Les niveaux Free et Shared exécutent les applications sur des machines virtuelles partagées avec d'autres clients, avec des quotas de processeur, et ne permettent pas de scale-out."
  options:
    s3:
      en: A Free plan is limited to one shared instance; you must scale up to Basic or higher to add instances.
      fr: Un plan Free est limité à une instance partagée ; vous devez passer au niveau Basic ou supérieur pour ajouter des instances.
references:
  - title: Azure App Service plans
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
