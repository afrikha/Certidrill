id: cs1-litware-02
objective: "3.4.2"
type: single
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the scaling requirement for ASP-Desk.

    What should you do first?
  fr: |
    Vous devez satisfaire l'exigence de mise à l'échelle pour ASP-Desk.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Keep the Basic B2 tier and create a custom autoscale setting based on CPU percentage", fr: "Conserver le niveau Basic B2 et créer un paramètre de mise à l'échelle automatique personnalisé selon le pourcentage d'UC" } }
    - { id: b, text: { en: "Scale up ASP-Desk to the Basic B3 tier", fr: "Effectuer un scale-up de ASP-Desk vers le niveau Basic B3" } }
    - { id: c, text: { en: "Scale up ASP-Desk to the Standard S1 tier", fr: "Effectuer un scale-up de ASP-Desk vers le niveau Standard S1" } }
    - { id: d, text: { en: "Scale up ASP-Desk to the Isolated v2 I1v2 tier", fr: "Effectuer un scale-up de ASP-Desk vers le niveau Isolé v2 I1v2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Autoscale and deployment slots are not available in the Basic tier, which can only be scaled out manually to three instances. The Standard tier supports autoscale up to 10 instances and deployment slots, so Standard S1 meets the 2-to-8-instance requirement and requirement 1 at the lowest cost among the options.
    fr: |
      La mise à l'échelle automatique et les emplacements de déploiement ne sont pas disponibles au niveau Basic, qui ne permet qu'un scale-out manuel jusqu'à trois instances. Le niveau Standard prend en charge la mise à l'échelle automatique jusqu'à 10 instances et les emplacements de déploiement ; Standard S1 satisfait donc l'exigence de 2 à 8 instances et l'exigence 1 au coût le plus faible parmi les options.
  options:
    a: { en: "Basic plans do not support autoscale; they can only be scaled out manually.", fr: "Les plans Basic ne prennent pas en charge la mise à l'échelle automatique ; ils ne peuvent faire qu'un scale-out manuel." }
    b: { en: "B3 adds CPU and memory per instance, but the Basic tier still has no autoscale, no deployment slots, and a maximum of three instances.", fr: "B3 ajoute de l'UC et de la mémoire par instance, mais le niveau Basic n'offre toujours ni mise à l'échelle automatique, ni emplacements de déploiement, et reste limité à trois instances." }
    d: { en: "The Isolated v2 tier supports autoscale and slots but runs in a dedicated App Service Environment and costs far more than Standard.", fr: "Le niveau Isolé v2 prend en charge la mise à l'échelle automatique et les emplacements, mais s'exécute dans un App Service Environment dédié et coûte bien plus cher que Standard." }
references:
  - title: Scale up features and capacities - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
  - title: Azure App Service plans
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
