id: c4-slot-swap-sticky
objective: "3.4.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a web app named **app-litware** that runs on an App Service plan in the Standard S2 tier. The app has a deployment slot named **staging**. No app setting is marked as a deployment slot setting, and the legacy swap behavior override isn't configured.

    You swap the staging slot into production.

    Which two settings stay with their original slot after the swap? Each correct answer presents a complete solution.
  fr: |
    Vous disposez d'une application web nommée **app-litware** qui s'exécute sur un plan App Service de niveau Standard S2. L'application possède un emplacement de déploiement nommé **staging**. Aucun paramètre d'application n'est marqué comme paramètre d'emplacement de déploiement, et la substitution rétablissant l'ancien comportement d'échange n'est pas configurée.

    Vous échangez l'emplacement staging avec l'emplacement de production.

    Quels sont les deux paramètres qui restent dans leur emplacement d'origine après l'échange ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: Custom domain names, fr: Noms de domaine personnalisés } }
    - { id: b, text: { en: Scale settings, fr: Paramètres de mise à l'échelle } }
    - { id: c, text: { en: App settings, fr: Paramètres de l'application } }
    - { id: d, text: { en: Language framework version (for example the .NET version), fr: Version du framework de langage (par exemple la version .NET) } }
    - { id: e, text: { en: WebJobs content, fr: Contenu WebJobs } }
    - { id: f, text: { en: Handler mappings, fr: Mappages de gestionnaires } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Some configuration elements are slot specific and never follow the content during a swap, such as custom domain names, nonpublic certificates and TLS settings, scale settings, publishing endpoints, managed identities and virtual network integration. Other elements, such as app settings that aren't marked as slot settings, the framework version, handler mappings and WebJobs content, are swapped with the content.
    fr: |
      Certains éléments de configuration sont spécifiques à l'emplacement et ne suivent jamais le contenu lors d'un échange, comme les noms de domaine personnalisés, les certificats non publics et les paramètres TLS, les paramètres de mise à l'échelle, les points de terminaison de publication, les identités managées et l'intégration au réseau virtuel. D'autres éléments, comme les paramètres d'application non marqués comme paramètres d'emplacement, la version du framework, les mappages de gestionnaires et le contenu WebJobs, sont échangés avec le contenu.
  options:
    c:
      en: |
        App settings are swapped unless you mark them as deployment slot settings.
      fr: |
        Les paramètres d'application sont échangés, sauf si vous les marquez comme paramètres d'emplacement de déploiement.
    d:
      en: |
        Language framework settings follow the content during a swap.
      fr: |
        Les paramètres du framework de langage suivent le contenu lors d'un échange.
    e:
      en: |
        WebJobs content is swapped; only WebJobs schedulers stay with the slot.
      fr: |
        Le contenu WebJobs est échangé ; seuls les planificateurs WebJobs restent dans l'emplacement.
    f:
      en: |
        Handler mappings are swapped.
      fr: |
        Les mappages de gestionnaires sont échangés.
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
