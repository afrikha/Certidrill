id: cs1-tailspin-02
objective: "3.2.7"
type: single
caseStudy: cs1-tailspin
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the scale-in requirement for VMSS-Match.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de scale-in pour VMSS-Match.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the scale-in policy of VMSS-Match to OldestVM", fr: "Remplacer la stratégie de scale-in de VMSS-Match par OldestVM" } }
    - { id: b, text: { en: "Change the scale-in policy of VMSS-Match to NewestVM", fr: "Remplacer la stratégie de scale-in de VMSS-Match par NewestVM" } }
    - { id: c, text: { en: "Keep the Default scale-in policy of VMSS-Match", fr: "Conserver la stratégie de scale-in Default de VMSS-Match" } }
    - { id: d, text: { en: "Enable Protect from scale-in on the newest instances", fr: "Activer Protect from scale-in sur les instances les plus récentes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The OldestVM scale-in policy deletes the oldest instance in the scale set, after balancing the instances across the availability zones. It is set once on the scale set model and applies to every scale-in, whether triggered by autoscale or manually.
    fr: |
      La stratégie de scale-in OldestVM supprime l'instance la plus ancienne du groupe identique, après avoir équilibré les instances entre les zones de disponibilité. Elle se définit une fois sur le modèle du groupe identique et s'applique à chaque scale-in, déclenché par la mise à l'échelle automatique ou manuellement.
  options:
    b: { en: "NewestVM removes the most recently created instances first, the opposite of the requirement.", fr: "NewestVM supprime d'abord les instances créées le plus récemment, soit l'inverse de l'exigence." }
    c: { en: "The Default policy balances the zones and fault domains, then deletes the instance with the highest instance ID, which is not the oldest instance.", fr: "La stratégie Default équilibre les zones et les domaines d'erreur, puis supprime l'instance dont l'ID d'instance est le plus élevé, qui n'est pas l'instance la plus ancienne." }
    d: { en: "Protecting instances must be maintained manually as new instances are created, which increases administrative effort.", fr: "La protection des instances doit être tenue à jour manuellement au fil de la création de nouvelles instances, ce qui augmente l'effort d'administration." }
references:
  - title: Use scale-in policies with Azure Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-scale-in-policy
