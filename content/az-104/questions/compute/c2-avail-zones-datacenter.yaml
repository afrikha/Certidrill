id: c2-avail-zones-datacenter
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to deploy two virtual machines that run a web application in the France Central region, which supports availability zones.

    The application must remain available if an entire datacenter in the region fails, and the deployment must qualify for a 99.99% VM connectivity SLA.

    What should you use?
  fr: |
    Proseware prévoit de déployer deux machines virtuelles qui exécutent une application web dans la région France Central, qui prend en charge les zones de disponibilité.

    L'application doit rester disponible en cas de panne d'un centre de données entier de la région, et le déploiement doit bénéficier d'un contrat de niveau de service de 99,99 % pour la connectivité des machines virtuelles.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Deploy each VM in a different availability zone.", fr: "Déployer chaque machine virtuelle dans une zone de disponibilité différente." }
    - id: b
      text: { en: "Deploy both VMs in the same availability set.", fr: "Déployer les deux machines virtuelles dans le même groupe à haute disponibilité." }
    - id: c
      text: { en: "Deploy both VMs in the same proximity placement group.", fr: "Déployer les deux machines virtuelles dans le même groupe de placement de proximité." }
    - id: d
      text: { en: "Deploy both VMs in availability zone 1.", fr: "Déployer les deux machines virtuelles dans la zone de disponibilité 1." }
answer: { optionId: a }
explanation:
  correct:
    en: Availability zones are physically separate locations within a region, each with independent power, cooling and networking. Spreading VMs across two or more zones protects against the loss of a datacenter and offers a 99.99% SLA.
    fr: Les zones de disponibilité sont des emplacements physiquement séparés au sein d'une région, chacun avec une alimentation, un refroidissement et un réseau indépendants. Répartir les machines virtuelles sur au moins deux zones protège contre la perte d'un centre de données et offre un contrat de niveau de service de 99,99 %.
  options:
    b:
      en: An availability set spreads VMs across fault domains in one datacenter; it offers a 99.95% SLA and is still exposed to datacenter-level failures.
      fr: Un groupe à haute disponibilité répartit les machines virtuelles entre des domaines d'erreur d'un même centre de données ; il offre un contrat de niveau de service de 99,95 % et reste exposé aux pannes à l'échelle du centre de données.
    c:
      en: A proximity placement group keeps VMs physically close to reduce latency, which increases the impact of a datacenter failure.
      fr: Un groupe de placement de proximité rapproche physiquement les machines virtuelles pour réduire la latence, ce qui accroît l'impact d'une panne de centre de données.
    d:
      en: Two VMs in the same zone are both lost if that zone fails.
      fr: Deux machines virtuelles dans la même zone sont toutes deux perdues si cette zone tombe en panne.
references:
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
