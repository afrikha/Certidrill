id: sr-06-q2
objective: "3.4.2"
type: series_yesno
series: sr-06-appservice-autoscale
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You scale up ASP1 to Standard S1 and configure CPU-based autoscale rules.
  fr: |
    Vous effectuez un scale-up d'ASP1 vers Standard S1 et configurez des règles de mise à l'échelle automatique basées sur le processeur.
body:
  solution:
    en: |
      You scale up ASP1 to the **Standard (S1)** tier. You then configure a custom autoscale setting on ASP1: scale out by one instance when the average CPU percentage exceeds 70 percent, scale in by one instance when it drops below 30 percent, with instance limits of minimum 1 and maximum 8.
    fr: |
      Vous effectuez un scale-up d'ASP1 vers le niveau **Standard (S1)**. Vous configurez ensuite un paramètre de mise à l'échelle automatique personnalisé sur ASP1 : scale-out d'une instance lorsque le pourcentage moyen d'utilisation du processeur dépasse 70 %, scale-in d'une instance lorsqu'il descend sous 30 %, avec des limites d'instances de 1 au minimum et de 8 au maximum.
answer: { value: true }
explanation:
  correct:
    en: |
      The Standard tier supports Azure Monitor autoscale and up to 10 instances, so a maximum of 8 is possible. The scale-out rule adds instances when CPU exceeds 70 percent and the scale-in rule removes them when the load drops, without any manual change, so the goal is met.
    fr: |
      Le niveau Standard prend en charge la mise à l'échelle automatique Azure Monitor et jusqu'à 10 instances : un maximum de 8 est donc possible. La règle de scale-out ajoute des instances lorsque l'utilisation du processeur dépasse 70 % et la règle de scale-in les retire lorsque la charge baisse, sans aucune modification manuelle : l'objectif est atteint.
references:
  - title: "Get started with autoscale in Azure"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-get-started
  - title: "Scale up features and capacities - Azure App Service"
