id: c3-aca-ingress-internal
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a microservices application in a Container Apps environment named **cae-shop**. The environment has a public inbound IP address.

    You are deploying a new container app named **ca-pricing** that exposes an HTTP API on port 8080. The API must be reachable only by the other container apps in cae-shop, not from the internet.

    How should you configure ingress for ca-pricing?
  fr: |
    Fabrikam exécute une application de microservices dans un environnement Container Apps nommé **cae-shop**. L'environnement possède une adresse IP entrante publique.

    Vous déployez une nouvelle application conteneur nommée **ca-pricing** qui expose une API HTTP sur le port 8080. L'API doit être accessible uniquement par les autres applications conteneur de cae-shop, et non depuis Internet.

    Comment devez-vous configurer l'entrée pour ca-pricing ?
body:
  options:
    - id: internal
      text: { en: "Enable ingress, set the ingress type to Internal, and set the target port to 8080.", fr: "Activer l'entrée, définir le type d'entrée sur Interne et définir le port cible sur 8080." }
    - id: external
      text: { en: "Enable ingress, set the ingress type to External, and set the target port to 8080.", fr: "Activer l'entrée, définir le type d'entrée sur Externe et définir le port cible sur 8080." }
    - id: disabled
      text: { en: "Disable ingress and let the other apps call ca-pricing on port 8080.", fr: "Désactiver l'entrée et laisser les autres applications appeler ca-pricing sur le port 8080." }
    - id: iprestrict
      text: { en: "Enable External ingress on port 443 and add an IP restriction that denies all internet addresses.", fr: "Activer une entrée Externe sur le port 443 et ajouter une restriction IP qui refuse toutes les adresses Internet." }
answer: { optionId: internal }
explanation:
  correct:
    en: Internal ingress makes the app's FQDN reachable only from within the same Container Apps environment, such as from other container apps, and the app is not exposed through the environment's inbound IP address. The target port tells the ingress which port the container listens on.
    fr: "L'entrée interne rend le nom de domaine complet de l'application accessible uniquement depuis le même environnement Container Apps, par exemple depuis les autres applications conteneur, et l'application n'est pas exposée via l'adresse IP entrante de l'environnement. Le port cible indique à l'entrée le port sur lequel le conteneur écoute."
  options:
    external:
      en: External ingress publishes the app through the environment's inbound IP, which is public here, so it is reachable from the internet.
      fr: L'entrée externe publie l'application via l'adresse IP entrante de l'environnement, publique ici ; l'application serait donc accessible depuis Internet.
    disabled:
      en: Without ingress, the app receives no HTTP traffic at all, even from other apps in the environment.
      fr: Sans entrée, l'application ne reçoit aucun trafic HTTP, même depuis les autres applications de l'environnement.
    iprestrict:
      en: This keeps the app published at the public endpoint and relies on a deny list; the target port must also be the container's port (8080), not 443.
      fr: Cette configuration laisse l'application publiée sur le point de terminaison public et repose sur une liste de refus ; de plus, le port cible doit être celui du conteneur (8080), pas 443.
references:
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
