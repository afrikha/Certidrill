id: stor-portal-zone-failure
objective: "2.2.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stcontoso03**. Its configuration is shown in the following table.

    The account must keep serving read and write requests if one availability zone of the region fails.
  fr: |
    Vous disposez d'un compte de stockage nommé **stcontoso03**. Sa configuration est présentée dans le tableau suivant.

    Le compte doit continuer à traiter les lectures et les écritures si une zone de disponibilité de la région tombe en panne.
body:
  prompts:
    - id: p1
      text:
        en: Which setting should you modify?
        fr: Quel paramètre devez-vous modifier ?
  grid:
    caption: { en: "stcontoso03 | Configuration", fr: "stcontoso03 | Configuration" }
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: Performance, area: perf }, { text: Standard }]
      - [{ text: { en: Replication, fr: Réplication }, area: repl }, { text: "Locally-redundant storage (LRS)" }]
      - [{ text: { en: Blob access tier (default), fr: Niveau d'accès blob (par défaut) }, area: tier }, { text: Hot }]
      - [{ text: { en: Secure transfer required, fr: Transfert sécurisé obligatoire }, area: secure }, { text: { en: Enabled, fr: Activé } }]
      - [{ text: { en: Minimum TLS version, fr: Version TLS minimale }, area: tls }, { text: "Version 1.2" }]
answer:
  values: { p1: repl }
explanation:
  correct:
    en: Changing the replication from LRS to zone-redundant storage (ZRS) spreads the three copies across availability zones, so the account stays available for reads and writes if one zone fails. This is a conversion of the redundancy setting.
    fr: Passer la réplication de LRS au stockage redondant interzone (ZRS) répartit les trois copies entre les zones de disponibilité ; le compte reste ainsi disponible en lecture et en écriture si une zone tombe en panne. Il s'agit d'une conversion du paramètre de redondance.
  options:
    perf: { en: Performance cannot be changed after creation and does not provide zone redundancy., fr: Les performances ne peuvent pas être modifiées après la création et n'apportent pas de redondance entre zones. }
    tier: { en: The access tier affects storage and access costs, not availability., fr: Le niveau d'accès influe sur les coûts de stockage et d'accès, pas sur la disponibilité. }
references:
  - title: Change how a storage account is replicated
    url: https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
