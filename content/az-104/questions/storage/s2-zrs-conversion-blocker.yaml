id: s2-zrs-conversion-blocker
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a standard general-purpose v2 storage account named **starchive01** that uses locally redundant storage (LRS). The account has the following configuration:

    | Setting | Value |
    | --- | --- |
    | Blob versioning | Enabled |
    | Blob soft delete | Enabled, 14 days |
    | Lifecycle management | One rule that moves blobs to the Cool tier after 30 days |
    | Access tiers in use | Hot, Cool and Archive |

    You plan to convert starchive01 to zone-redundant storage (ZRS) by using a customer-initiated conversion.

    Which element of the current configuration prevents the conversion?
  fr: |
    Contoso dispose d'un compte de stockage usage général v2 standard nommé **starchive01** qui utilise le stockage localement redondant (LRS). Le compte présente la configuration suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Contrôle de version des objets blob | Activé |
    | Suppression réversible des objets blob | Activée, 14 jours |
    | Gestion du cycle de vie | Une règle qui déplace les objets blob vers le niveau froid (Cool) après 30 jours |
    | Niveaux d'accès utilisés | Chaud (Hot), froid (Cool) et archive (Archive) |

    Vous prévoyez de convertir starchive01 en stockage redondant interzone (ZRS) au moyen d'une conversion lancée par le client.

    Quel élément de la configuration actuelle empêche la conversion ?
body:
  options:
    - id: a
      text: { en: "The blobs stored in the Archive tier", fr: "Les objets blob stockés au niveau archive (Archive)" }
    - id: b
      text: { en: "Blob versioning", fr: "Le contrôle de version des objets blob" }
    - id: c
      text: { en: "Blob soft delete", fr: "La suppression réversible des objets blob" }
    - id: d
      text: { en: "The lifecycle management rule", fr: "La règle de gestion du cycle de vie" }
answer: { optionId: a }
explanation:
  correct:
    en: ZRS, GZRS and RA-GZRS accounts do not support the Archive tier. Before converting an LRS account to a zone-redundant option, you must first move the archived blobs to a storage account that supports the Archive tier.
    fr: Les comptes ZRS, GZRS et RA-GZRS ne prennent pas en charge le niveau archive (Archive). Avant de convertir un compte LRS vers une option redondante interzone, vous devez d'abord déplacer les objets blob archivés vers un compte de stockage qui prend en charge ce niveau.
  options:
    b:
      en: Blob versioning is a data protection feature that does not block a redundancy conversion.
      fr: Le contrôle de version des objets blob est une fonctionnalité de protection des données qui ne bloque pas une conversion de redondance.
    c:
      en: Soft delete does not prevent a conversion to ZRS.
      fr: La suppression réversible n'empêche pas une conversion vers ZRS.
    d:
      en: A rule that moves blobs to the Cool tier is compatible with ZRS; only the Archive tier is unsupported.
      fr: Une règle qui déplace les objets blob vers le niveau froid (Cool) est compatible avec ZRS ; seul le niveau archive (Archive) n'est pas pris en charge.
references:
  - title: Change how a storage account is replicated
    url: https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
