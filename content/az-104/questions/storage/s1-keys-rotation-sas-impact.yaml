id: s1-keys-rotation-sas-impact
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A storage account named **stproseware** is accessed by using several kinds of shared access signatures. Some were signed with key1, some with key2, and some are user delegation SAS tokens.

    You regenerate key1. Which tokens stop working?
  fr: |
    Un compte de stockage nommé **stproseware** est utilisé au moyen de plusieurs types de signatures d'accès partagé. Certaines ont été signées avec key1, d'autres avec key2, et d'autres sont des jetons SAS de délégation d'utilisateur.

    Vous régénérez key1. Quels jetons cessent de fonctionner ?
body:
  options:
    - id: a
      text:
        en: Only the account SAS and service SAS tokens signed with key1
        fr: Uniquement les jetons SAS de compte et SAS de service signés avec key1
    - id: b
      text:
        en: All the account SAS and service SAS tokens, whichever key signed them
        fr: Tous les jetons SAS de compte et SAS de service, quelle que soit la clé qui les a signés
    - id: c
      text:
        en: The tokens signed with key1 and all the user delegation SAS tokens
        fr: Les jetons signés avec key1 et tous les jetons SAS de délégation d'utilisateur
    - id: d
      text:
        en: None; existing tokens stay valid until their expiry time
        fr: Aucun ; les jetons existants restent valides jusqu'à leur heure d'expiration
answer: { optionId: a }
explanation:
  correct:
    en: Regenerating an access key revokes the SAS tokens that were signed with that key, which are account and service SAS tokens. Tokens signed with key2 keep working, and user delegation SAS tokens are secured with Microsoft Entra credentials, so key rotation does not affect them.
    fr: La régénération d'une clé d'accès révoque les jetons SAS signés avec cette clé, c'est-à-dire des SAS de compte et de service. Les jetons signés avec key2 continuent de fonctionner, et les jetons SAS de délégation d'utilisateur sont sécurisés par des informations d'identification Microsoft Entra ; la rotation des clés ne les affecte donc pas.
  options:
    b:
      en: Tokens signed with key2 are not affected by the regeneration of key1.
      fr: Les jetons signés avec key2 ne sont pas affectés par la régénération de key1.
    c:
      en: User delegation SAS tokens are signed with a user delegation key, not with an account key.
      fr: Les jetons SAS de délégation d'utilisateur sont signés avec une clé de délégation d'utilisateur, pas avec une clé de compte.
    d:
      en: The signature of a token signed with key1 can no longer be verified once key1 changes.
      fr: La signature d'un jeton signé avec key1 ne peut plus être vérifiée une fois key1 modifiée.
references:
  - title: Manage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
