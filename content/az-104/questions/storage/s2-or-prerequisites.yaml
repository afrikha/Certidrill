id: s2-or-prerequisites
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have two general-purpose v2 storage accounts in the same Microsoft Entra tenant: **stsales-weu** (source, West Europe) and **stsales-eus** (destination, East US). Both accounts use Microsoft-managed keys and have no hierarchical namespace.

    You need to configure object replication so that new block blobs in a container of the source account are copied to a container of the destination account.

    Which two actions must you perform before you create the replication policy? Each correct answer presents part of the solution.
  fr: |
    Vous disposez de deux comptes de stockage à usage général v2 dans le même locataire Microsoft Entra : **stsales-weu** (source, West Europe) et **stsales-eus** (destination, East US). Les deux comptes utilisent des clés gérées par Microsoft et n'ont pas d'espace de noms hiérarchique.

    Vous devez configurer la réplication d'objets afin que les nouveaux objets blob de blocs d'un conteneur du compte source soient copiés vers un conteneur du compte de destination.

    Quelles deux actions devez-vous effectuer avant de créer la stratégie de réplication ? Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the change feed on the source account.", fr: "Activer le flux de modification sur le compte source." } }
    - { id: b, text: { en: "Enable blob versioning on both accounts.", fr: "Activer le contrôle de version des objets blob sur les deux comptes." } }
    - { id: c, text: { en: "Enable the change feed on the destination account only.", fr: "Activer le flux de modification sur le compte de destination uniquement." } }
    - { id: d, text: { en: "Enable a hierarchical namespace on both accounts.", fr: "Activer un espace de noms hiérarchique sur les deux comptes." } }
    - { id: e, text: { en: "Configure geo-redundant storage (GRS) on the source account.", fr: "Configurer le stockage géoredondant (GRS) sur le compte source." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Object replication requires the change feed on the source account, because Azure Storage reads it to find the write and delete operations to replicate, and blob versioning on both the source and the destination accounts.
    fr: La réplication d'objets exige le flux de modification sur le compte source, car Stockage Azure le lit pour repérer les opérations d'écriture et de suppression à répliquer, ainsi que le contrôle de version des objets blob sur les comptes source et de destination.
  options:
    c:
      en: The change feed is required on the source account, not on the destination account.
      fr: Le flux de modification est exigé sur le compte source, pas sur le compte de destination.
    d:
      en: Object replication is not supported in accounts that have a hierarchical namespace enabled.
      fr: La réplication d'objets n'est pas prise en charge dans les comptes dont l'espace de noms hiérarchique est activé.
    e:
      en: Object replication works with any redundancy option of the source account; GRS is not a prerequisite.
      fr: La réplication d'objets fonctionne quelle que soit l'option de redondance du compte source ; GRS n'est pas un prérequis.
references:
  - title: Object replication overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
