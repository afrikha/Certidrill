id: s3-blob-setacl-auth-mode
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a storage account named **stproseware** that has **Allow Blob anonymous access** enabled. You are assigned the Owner role and the Storage Blob Data Owner role on the storage account.

    You run the following command from Azure Cloud Shell:

    ```bash
    az storage container set-permission --name brochures --account-name stproseware --public-access blob --auth-mode login
    ```

    The command fails with an authorization error.

    You need to change the anonymous access level of the **brochures** container to Blob.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stproseware** pour lequel **Autoriser l'accès anonyme aux objets blob** est activé. Les rôles Owner et Storage Blob Data Owner vous sont attribués sur le compte de stockage.

    Vous exécutez la commande suivante depuis Azure Cloud Shell :

    ```bash
    az storage container set-permission --name brochures --account-name stproseware --public-access blob --auth-mode login
    ```

    La commande échoue avec une erreur d'autorisation.

    Vous devez définir le niveau d'accès anonyme du conteneur **brochures** sur Blob.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the command again with `--auth-mode key` and the storage account key.", fr: "Exécuter de nouveau la commande avec `--auth-mode key` et la clé du compte de stockage." } }
    - { id: b, text: { en: Assign yourself the Storage Blob Data Contributor role on the brochures container., fr: "Vous attribuer le rôle Storage Blob Data Contributor sur le conteneur brochures." } }
    - { id: c, text: { en: Assign yourself the Storage Account Contributor role on the storage account., fr: "Vous attribuer le rôle Storage Account Contributor sur le compte de stockage." } }
    - { id: d, text: { en: "Disable **Allow Blob anonymous access**, and then enable it again.", fr: "Désactiver **Autoriser l'accès anonyme aux objets blob**, puis le réactiver." } }
answer: { optionId: a }
explanation:
  correct:
    en: The container anonymous access level is set by the Set Container ACL operation, which does not support authorization with Microsoft Entra ID. With `--auth-mode login` the request is always rejected, whatever data role you hold. Authorize the operation with the account key (or a SAS or connection string) instead; as Owner you can read the account key.
    fr: Le niveau d'accès anonyme d'un conteneur est défini par l'opération Set Container ACL, qui ne prend pas en charge l'autorisation avec Microsoft Entra ID. Avec `--auth-mode login`, la demande est toujours refusée, quel que soit le rôle de données attribué. Il faut autoriser l'opération avec la clé du compte (ou une SAS ou une chaîne de connexion) ; en tant qu'Owner, vous pouvez lire la clé du compte.
  options:
    b:
      en: Storage Blob Data Contributor grants fewer data permissions than the Storage Blob Data Owner role you already have, and Entra authorization is not supported for this operation.
      fr: Storage Blob Data Contributor accorde moins d'autorisations de données que le rôle Storage Blob Data Owner déjà attribué, et l'autorisation Entra n'est pas prise en charge pour cette opération.
    c:
      en: Owner already includes the management permissions of Storage Account Contributor; the problem is the authorization method of the data operation.
      fr: Owner inclut déjà les autorisations de gestion de Storage Account Contributor ; le problème vient de la méthode d'autorisation de l'opération de données.
    d:
      en: Anonymous access is already allowed on the account; toggling the setting does not change how Set Container ACL is authorized.
      fr: L'accès anonyme est déjà autorisé sur le compte ; basculer ce paramètre ne change pas la façon dont Set Container ACL est autorisé.
references:
  - title: Configure anonymous read access for containers and blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
