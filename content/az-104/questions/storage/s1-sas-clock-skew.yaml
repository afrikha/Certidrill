id: s1-sas-clock-skew
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web service at Fabrikam issues service SAS tokens for blobs. Each token is created with a start time equal to the current time and an expiry time two hours later.

    Clients report that requests sometimes fail with error 403 during the first few minutes after they receive a new token, and then succeed without any change.

    You need to prevent these failures without extending the access granted to the clients. What should you do?
  fr: |
    Un service web de Fabrikam émet des jetons SAS de service pour des blobs. Chaque jeton est créé avec une heure de début égale à l'heure actuelle et une heure d'expiration deux heures plus tard.

    Les clients signalent que des demandes échouent parfois avec l'erreur 403 pendant les premières minutes qui suivent la réception d'un nouveau jeton, puis réussissent sans aucun changement.

    Vous devez éviter ces échecs sans étendre l'accès accordé aux clients. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Omit the start time, or set it at least 15 minutes in the past.
        fr: Omettre l'heure de début, ou la définir au moins 15 minutes dans le passé.
    - id: b
      text:
        en: Set the expiry time to 24 hours after the start time.
        fr: Définir l'heure d'expiration 24 heures après l'heure de début.
    - id: c
      text:
        en: Issue account SAS tokens instead of service SAS tokens.
        fr: Émettre des jetons SAS de compte au lieu de jetons SAS de service.
    - id: d
      text:
        en: Add the HTTPS-only protocol restriction to the tokens.
        fr: Ajouter aux jetons la restriction de protocole HTTPS uniquement.
answer: { optionId: a }
explanation:
  correct:
    en: Machines can have slightly different clocks (clock skew), so a SAS whose start time is exactly "now" can be seen as not yet valid by the service for a few minutes. Microsoft recommends setting the start time at least 15 minutes in the past or not setting it at all, which makes the SAS valid immediately.
    fr: Les machines peuvent avoir des horloges légèrement différentes (décalage d'horloge) ; une SAS dont l'heure de début est exactement « maintenant » peut donc être considérée par le service comme pas encore valide pendant quelques minutes. Microsoft recommande de définir l'heure de début au moins 15 minutes dans le passé ou de ne pas la définir, ce qui rend la SAS valide immédiatement.
  options:
    b:
      en: The failures happen at the beginning of the validity period; a later expiry only extends access.
      fr: Les échecs se produisent au début de la période de validité ; une expiration plus tardive ne fait qu'étendre l'accès.
    c:
      en: An account SAS has the same start-time behavior and grants broader access than a service SAS.
      fr: Une SAS de compte présente le même comportement pour l'heure de début et accorde un accès plus large qu'une SAS de service.
    d:
      en: Restricting the protocol is a good practice but has no effect on clock skew.
      fr: Restreindre le protocole est une bonne pratique, mais n'a aucun effet sur le décalage d'horloge.
references:
  - title: Grant limited access to data with shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
