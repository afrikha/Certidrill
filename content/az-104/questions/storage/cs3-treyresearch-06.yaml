id: cs3-treyresearch-06
objective: "2.1.4"
type: yesno_statements
caseStudy: cs3-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to plan the rotation of the sttreydata access keys to meet the storage requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez planifier la rotation des clés d'accès de sttreydata pour satisfaire les exigences de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When you regenerate key1, connection strings that contain the previous value of key1 stop working."
        fr: "Quand vous régénérez key1, les chaînes de connexion qui contiennent l'ancienne valeur de key1 cessent de fonctionner."
    - id: s2
      text:
        en: "You can configure a key expiration policy on sttreydata so that Azure regenerates both keys automatically every 180 days."
        fr: "Vous pouvez configurer une stratégie d'expiration de clé sur sttreydata pour qu'Azure régénère automatiquement les deux clés tous les 180 jours."
    - id: s3
      text:
        en: "Before you regenerate key1, you must update the scheduler configuration on VM-HEAD1 to use key2."
        fr: "Avant de régénérer key1, vous devez mettre à jour la configuration du planificateur sur VM-HEAD1 pour qu'elle utilise key2."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Regenerating a key invalidates the old value immediately, so every client that still uses it loses access. The jobs use key1, so you first switch the scheduler to key2, regenerate key1, switch back to the new key1 and then regenerate key2. A key expiration policy only sets a rotation reminder interval and lets you detect expired keys; it doesn't regenerate keys."
    fr: "La régénération d'une clé invalide immédiatement l'ancienne valeur : tous les clients qui l'utilisent encore perdent l'accès. Les travaux utilisent key1 : vous basculez d'abord le planificateur sur key2, régénérez key1, revenez à la nouvelle key1, puis régénérez key2. Une stratégie d'expiration de clé définit seulement un intervalle de rappel de rotation et permet de détecter les clés expirées ; elle ne régénère pas les clés."
references:
  - title: "Manage storage account access keys"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
