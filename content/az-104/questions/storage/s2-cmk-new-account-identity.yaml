id: s2-cmk-new-account-identity
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating a new general-purpose v2 storage account named **stpayroll**. Company policy requires that the account is encrypted with a customer-managed key stored in an existing key vault named **kv-payroll** from the moment the account is created. kv-payroll is in the same Microsoft Entra tenant as the storage account.

    You need to authorize stpayroll to access the key in kv-payroll.

    What should you assign the **Key Vault Crypto Service Encryption User** role on kv-payroll to?
  fr: |
    Vous créez un nouveau compte de stockage à usage général v2 nommé **stpayroll**. La stratégie de l'entreprise exige que le compte soit chiffré avec une clé gérée par le client stockée dans un coffre de clés existant nommé **kv-payroll** dès la création du compte. kv-payroll se trouve dans le même locataire Microsoft Entra que le compte de stockage.

    Vous devez autoriser stpayroll à accéder à la clé de kv-payroll.

    À quoi devez-vous attribuer le rôle **Key Vault Crypto Service Encryption User** sur kv-payroll ?
body:
  options:
    - id: a
      text: { en: "A user-assigned managed identity that you then associate with stpayroll during creation", fr: "Une identité managée affectée par l'utilisateur que vous associez ensuite à stpayroll lors de sa création" }
    - id: b
      text: { en: "The system-assigned managed identity of stpayroll", fr: "L'identité managée affectée par le système de stpayroll" }
    - id: c
      text: { en: "A service principal that uses a client secret stored in kv-payroll", fr: "Un principal de service qui utilise un secret client stocké dans kv-payroll" }
    - id: d
      text: { en: "Your own user account, which creates the storage account", fr: "Votre propre compte d'utilisateur, qui crée le compte de stockage" }
answer: { optionId: a }
explanation:
  correct:
    en: When you configure customer-managed keys at the time you create a storage account, you must use a user-assigned managed identity. It must exist, with permissions on the key, before the account is created, and you select it in the encryption settings of the new account.
    fr: Lorsque vous configurez des clés gérées par le client au moment de la création d'un compte de stockage, vous devez utiliser une identité managée affectée par l'utilisateur. Elle doit exister, avec des autorisations sur la clé, avant la création du compte, et vous la sélectionnez dans les paramètres de chiffrement du nouveau compte.
  options:
    b:
      en: A system-assigned identity exists only after the account is created, so it can be used only to configure customer-managed keys on an existing account.
      fr: Une identité affectée par le système n'existe qu'après la création du compte ; elle ne peut donc servir qu'à configurer des clés gérées par le client sur un compte existant.
    c:
      en: Azure Storage authenticates to the key vault with a managed identity, not with a service principal secret.
      fr: Stockage Azure s'authentifie auprès du coffre de clés avec une identité managée, pas avec le secret d'un principal de service.
    d:
      en: The storage service, not the administrator, must access the key for every encryption and decryption operation.
      fr: C'est le service de stockage, et non l'administrateur, qui doit accéder à la clé pour chaque opération de chiffrement et de déchiffrement.
references:
  - title: Customer-managed keys for account encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
  - title: Configure customer-managed keys in the same tenant for a new storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-configure-new-account
