id: s1-keys-roles-match
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You need to grant permissions on a storage account named **stwoodgrove** to three administrators. Each administrator must receive only the permissions required for the task (principle of least privilege).

    Which built-in role should you assign to each administrator? To answer, drag the appropriate roles to the correct administrators. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez accorder des autorisations sur un compte de stockage nommé **stwoodgrove** à trois administrateurs. Chaque administrateur ne doit recevoir que les autorisations nécessaires à sa tâche (principe du moindre privilège).

    Quel rôle intégré devez-vous attribuer à chaque administrateur ? Pour répondre, faites glisser les rôles appropriés vers les administrateurs correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: keyop, text: Storage Account Key Operator Service Role }
    - { id: sac, text: Storage Account Contributor }
    - { id: bdr, text: Storage Blob Data Reader }
    - { id: owner, text: Owner }
    - { id: reader, text: Reader }
  targets:
    - id: admin1
      text:
        en: "Admin1: list and regenerate the access keys, without changing any other setting of the account"
        fr: "Admin1 : lister et régénérer les clés d'accès, sans modifier aucun autre paramètre du compte"
    - id: admin2
      text:
        en: "Admin2: manage the account settings, including disabling storage account key access, without assigning roles"
        fr: "Admin2 : gérer les paramètres du compte, y compris désactiver l'accès à la clé du compte de stockage, sans attribuer de rôles"
    - id: admin3
      text:
        en: "Admin3: read blob data by using Microsoft Entra credentials, without access to the account keys"
        fr: "Admin3 : lire les données blob avec des informations d'identification Microsoft Entra, sans accès aux clés de compte"
answer:
  mapping: { admin1: keyop, admin2: sac, admin3: bdr }
explanation:
  correct:
    en: Storage Account Key Operator Service Role only permits listing and regenerating the account keys. Storage Account Contributor manages the storage account, including the AllowSharedKeyAccess property, but cannot assign roles. Storage Blob Data Reader grants read access to blob data through Microsoft Entra ID and does not include the listkeys action.
    fr: Storage Account Key Operator Service Role permet uniquement de lister et de régénérer les clés de compte. Storage Account Contributor gère le compte de stockage, y compris la propriété AllowSharedKeyAccess, mais ne peut pas attribuer de rôles. Storage Blob Data Reader accorde l'accès en lecture aux données blob via Microsoft Entra ID et n'inclut pas l'action listkeys.
  options:
    owner:
      en: Owner grants full access including role assignments, which exceeds every requirement.
      fr: Owner accorde un accès complet, attributions de rôles comprises, ce qui dépasse toutes les exigences.
    reader:
      en: Reader can view the account but cannot list keys, change settings or read blob data.
      fr: Reader peut consulter le compte, mais ne peut ni lister les clés, ni modifier les paramètres, ni lire les données blob.
references:
  - title: Manage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
