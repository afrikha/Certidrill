id: s1-files-effective-access
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A storage account named **stnwfiles** uses on-premises AD DS authentication for Azure Files. No default share-level permission is configured. The following hybrid users access a file share named **projects**:

    | User | Share-level role on projects | NTFS permission on the Reports folder |
    | --- | --- | --- |
    | User1 | Storage File Data SMB Share Reader | Modify |
    | User2 | Storage File Data SMB Share Contributor | Read |
    | User3 | None | Full control |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **stnwfiles** utilise l'authentification AD DS locale pour Azure Files. Aucune autorisation par défaut au niveau du partage n'est configurée. Les utilisateurs hybrides suivants accèdent à un partage de fichiers nommé **projects** :

    | Utilisateur | Rôle au niveau du partage sur projects | Autorisation NTFS sur le dossier Reports |
    | --- | --- | --- |
    | User1 | Storage File Data SMB Share Reader | Modifier |
    | User2 | Storage File Data SMB Share Contributor | Lecture |
    | User3 | Aucun | Contrôle total |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 can modify files in the Reports folder.
        fr: User1 peut modifier des fichiers du dossier Reports.
    - id: s2
      text:
        en: User2 can read files in the Reports folder but cannot modify them.
        fr: User2 peut lire les fichiers du dossier Reports, mais ne peut pas les modifier.
    - id: s3
      text:
        en: User3 can read files in the Reports folder.
        fr: User3 peut lire les fichiers du dossier Reports.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Share-level permissions (RBAC) and Windows ACLs are both enforced, and the most restrictive one applies. User1 is limited to read by the SMB Share Reader role. User2 is limited to read by the NTFS Read permission. User3 has no share-level permission, and without a default share-level permission, access to the share is denied whatever the NTFS permissions.
    fr: Les autorisations au niveau du partage (RBAC) et les ACL Windows sont toutes deux appliquées, et seule la plus restrictive compte. User1 est limité à la lecture par le rôle SMB Share Reader. User2 est limité à la lecture par l'autorisation NTFS Lecture. User3 n'a aucune autorisation au niveau du partage et, faute d'autorisation par défaut au niveau du partage, l'accès au partage est refusé quelles que soient les autorisations NTFS.
references:
  - title: Configure directory and file-level permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-configure-file-level-permissions
  - title: Assign share-level permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
