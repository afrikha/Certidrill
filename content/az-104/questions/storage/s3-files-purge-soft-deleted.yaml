id: s3-files-purge-soft-deleted
objective: "2.3.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a storage account named **stadatumdev** that contains several file shares. Soft delete for file shares is enabled with a retention period of 30 days.

    Yesterday you deleted a file share named **temp-export** that contained sensitive data. **temp-export** is now in a soft-deleted state.

    You need to permanently delete **temp-export** today. After the operation, the other file shares in **stadatumdev** must remain protected by soft delete.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte de stockage nommé **stadatumdev** qui contient plusieurs partages de fichiers. La suppression réversible des partages de fichiers est activée avec une période de rétention de 30 jours.

    Hier, vous avez supprimé un partage de fichiers nommé **temp-export** qui contenait des données sensibles. **temp-export** est maintenant à l'état supprimé de manière réversible.

    Vous devez supprimer définitivement **temp-export** aujourd'hui. Après l'opération, les autres partages de fichiers de **stadatumdev** doivent rester protégés par la suppression réversible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: undelete, text: { en: Undelete the temp-export share., fr: "Annuler la suppression du partage temp-export." } }
    - { id: disable, text: { en: Disable soft delete for file shares on stadatumdev., fr: "Désactiver la suppression réversible des partages de fichiers sur stadatumdev." } }
    - { id: delete, text: { en: Delete the temp-export share., fr: "Supprimer le partage temp-export." } }
    - { id: enable, text: { en: Enable soft delete for file shares on stadatumdev again., fr: "Réactiver la suppression réversible des partages de fichiers sur stadatumdev." } }
    - { id: retention, text: { en: Set the soft delete retention period to 1 day., fr: "Définir la période de rétention de la suppression réversible sur 1 jour." } }
    - { id: snapshots, text: { en: Delete all the share snapshots of temp-export., fr: "Supprimer tous les instantanés de partage de temp-export." } }
answer:
  sequence: [undelete, disable, delete, enable]
explanation:
  correct:
    en: A soft-deleted share cannot be purged directly. You must undelete it, disable soft delete, and delete the share again, which now deletes it permanently. Re-enabling soft delete afterwards protects the other shares from accidental deletion.
    fr: Un partage supprimé de manière réversible ne peut pas être purgé directement. Il faut annuler sa suppression, désactiver la suppression réversible, puis supprimer de nouveau le partage, ce qui le supprime alors définitivement. Réactiver ensuite la suppression réversible protège les autres partages contre une suppression accidentelle.
  options:
    retention:
      en: A new retention period applies only to shares deleted after the change; temp-export keeps the period that was in effect when it was deleted.
      fr: Une nouvelle période de rétention ne s'applique qu'aux partages supprimés après la modification ; temp-export conserve la période en vigueur lors de sa suppression.
    snapshots:
      en: Deleting a share also deletes its snapshots; no separate step is needed.
      fr: La suppression d'un partage supprime aussi ses instantanés ; aucune étape distincte n'est nécessaire.
references:
  - title: Azure file share soft delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
