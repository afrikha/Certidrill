id: s1-sas-cli-user-delegation
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are signed in to the Azure CLI with a Microsoft Entra account that has the Storage Blob Data Contributor role on a storage account named **stnorthwind**.

    You need to generate a SAS token for the container **reports** that meets the following requirements:

    - The token is signed with Microsoft Entra credentials, not with an account key.
    - The holder can list the blobs in the container and read them, and nothing else.
    - Requests made over HTTP are rejected.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes connecté à Azure CLI avec un compte Microsoft Entra qui dispose du rôle Storage Blob Data Contributor sur un compte de stockage nommé **stnorthwind**.

    Vous devez générer un jeton SAS pour le conteneur **reports** qui respecte les exigences suivantes :

    - Le jeton est signé avec des informations d'identification Microsoft Entra, et non avec une clé de compte.
    - Son détenteur peut lister les objets blob du conteneur et les lire, et rien d'autre.
    - Les demandes effectuées en HTTP sont rejetées.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az storage container generate-sas \
      --account-name stnorthwind \
      --name reports \
      --permissions [[perm]] \
      --expiry 2026-11-15T18:00Z \
      [[auth]] \
      --as-user \
      [[proto]]
  slots:
    - id: perm
      options:
        - { id: rl, text: rl }
        - { id: r, text: r }
        - { id: rw, text: rw }
        - { id: acdlrw, text: acdlrw }
    - id: auth
      options:
        - { id: login, text: "--auth-mode login" }
        - { id: key, text: "--auth-mode key" }
        - { id: acctkey, text: "--account-key $key" }
        - { id: policy, text: "--policy-name readonly" }
    - id: proto
      options:
        - { id: https, text: "--https-only" }
        - { id: ip, text: "--ip 0.0.0.0" }
        - { id: tls, text: "--min-tls-version TLS1_2" }
        - { id: spr, text: "--protocol http" }
answer:
  values: { perm: rl, auth: login, proto: https }
explanation:
  correct:
    en: "`--as-user` returns a user delegation SAS and requires `--auth-mode login`, so the user delegation key is requested with your Microsoft Entra credentials. The permissions `rl` grant read and list only. `--https-only` sets the signed protocol to HTTPS, so HTTP requests are refused."
    fr: "`--as-user` renvoie une SAS de délégation d'utilisateur et exige `--auth-mode login`, afin que la clé de délégation d'utilisateur soit demandée avec vos informations d'identification Microsoft Entra. Les autorisations `rl` n'accordent que la lecture et la liste. `--https-only` fixe le protocole signé à HTTPS ; les demandes HTTP sont donc refusées."
  options:
    r:
      en: Read alone does not allow listing the blobs in the container.
      fr: La lecture seule ne permet pas de lister les objets blob du conteneur.
    acdlrw:
      en: These permissions also allow adding, creating, deleting and writing, which exceeds the requirement.
      fr: Ces autorisations permettent aussi d'ajouter, créer, supprimer et écrire, ce qui dépasse l'exigence.
    key:
      en: With key authentication the SAS would be signed with the account key; `--as-user` requires `--auth-mode login`.
      fr: Avec l'authentification par clé, la SAS serait signée avec la clé de compte ; `--as-user` exige `--auth-mode login`.
    policy:
      en: A user delegation SAS does not support stored access policies.
      fr: Une SAS de délégation d'utilisateur ne prend pas en charge les stratégies d'accès stockées.
    ip:
      en: "`--ip` restricts client addresses; it does not control the protocol."
      fr: "`--ip` restreint les adresses clientes ; il ne contrôle pas le protocole."
references:
  - title: Use Azure CLI to create a user delegation SAS for a container or blob
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-user-delegation-sas-create-cli
  - title: az storage container
    url: https://learn.microsoft.com/en-us/cli/azure/storage/container
