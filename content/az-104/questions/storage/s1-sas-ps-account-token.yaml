id: s1-sas-ps-account-token
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    An application of Proseware must list the blobs in any container of the storage account **stproseware** and download those blobs. It must not access the Queue, Table or File services, must not list or manage the containers themselves, and must only use HTTPS.

    You decide to give the application an account SAS. You run the following PowerShell commands. `$ctx` is a storage context created with the account key.

    How should you complete the command to follow the principle of least privilege? Select the appropriate options in the answer area.
  fr: |
    Une application de Proseware doit lister les objets blob de n'importe quel conteneur du compte de stockage **stproseware** et télécharger ces objets blob. Elle ne doit pas accéder aux services Queue, Table ou File, ne doit ni lister ni gérer les conteneurs eux-mêmes, et ne doit utiliser que HTTPS.

    Vous décidez de fournir une SAS de compte à l'application. Vous exécutez les commandes PowerShell suivantes. `$ctx` est un contexte de stockage créé avec la clé du compte.

    Comment devez-vous compléter la commande pour respecter le principe du moindre privilège ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    New-AzStorageAccountSASToken `
      -Service [[svc]] `
      -ResourceType [[rt]] `
      -Permission "rl" `
      -Protocol [[proto]] `
      -ExpiryTime (Get-Date).AddHours(8) `
      -Context $ctx
  slots:
    - id: svc
      options:
        - { id: blob, text: Blob }
        - { id: blobfile, text: "Blob,File" }
        - { id: all, text: "Blob,File,Queue,Table" }
        - { id: file, text: File }
    - id: rt
      options:
        - { id: co, text: "Container,Object" }
        - { id: o, text: Object }
        - { id: sco, text: "Service,Container,Object" }
        - { id: s, text: Service }
    - id: proto
      options:
        - { id: httpsonly, text: HttpsOnly }
        - { id: httpsorhttp, text: HttpsOrHttp }
        - { id: https, text: Https }
        - { id: tls, text: Tls12 }
answer:
  values: { svc: blob, rt: co, proto: httpsonly }
explanation:
  correct:
    en: "Only the Blob service is needed. In an account SAS, List Blobs is a container-level operation (resource type Container with List), and Get Blob is an object-level operation (resource type Object with Read), so Container,Object is the minimum. The Service resource type is only needed for operations such as List Containers or Get/Set Service Properties. The -Protocol parameter accepts HttpsOnly or HttpsOrHttp."
    fr: "Seul le service Blob est nécessaire. Dans une SAS de compte, List Blobs est une opération de niveau conteneur (type de ressource Container avec List) et Get Blob une opération de niveau objet (type de ressource Object avec Read) ; Container,Object est donc le minimum. Le type de ressource Service n'est nécessaire que pour des opérations comme List Containers ou Get/Set Service Properties. Le paramètre -Protocol accepte HttpsOnly ou HttpsOrHttp."
  options:
    blobfile:
      en: The File service is not required and must not be accessible.
      fr: Le service File n'est pas nécessaire et ne doit pas être accessible.
    o:
      en: Without the Container resource type, the application cannot list the blobs in a container.
      fr: Sans le type de ressource Container, l'application ne peut pas lister les objets blob d'un conteneur.
    sco:
      en: Service adds service-level operations such as listing containers, which the application must not do.
      fr: Service ajoute des opérations de niveau service, comme lister les conteneurs, que l'application ne doit pas effectuer.
    httpsorhttp:
      en: HttpsOrHttp (the default) also accepts HTTP requests.
      fr: HttpsOrHttp (la valeur par défaut) accepte aussi les demandes HTTP.
    https:
      en: Https is not an accepted value of -Protocol.
      fr: Https n'est pas une valeur acceptée par -Protocol.
references:
  - title: New-AzStorageAccountSASToken (Az.Storage)
    url: https://learn.microsoft.com/en-us/powershell/module/az.storage/new-azstorageaccountsastoken
  - title: Create an account SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas
