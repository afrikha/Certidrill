id: s2-failover-types-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a general-purpose v2 storage account named **stproseware** configured with geo-redundant storage (GRS). The operations team is writing its disaster recovery runbook for the account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Proseware dispose d'un compte de stockage à usage général v2 nommé **stproseware**, configuré avec le stockage géoredondant (GRS). L'équipe d'exploitation rédige son runbook de récupération d'urgence pour ce compte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: After a customer-managed (unplanned) failover completes, stproseware is configured as locally redundant storage (LRS) in the new primary region.
        fr: Une fois un basculement géré par le client (non planifié) terminé, stproseware est configuré en stockage localement redondant (LRS) dans la nouvelle région primaire.
    - id: s2
      text:
        en: You can use a customer-managed planned failover to test the runbook while both regions are available, and geo-redundancy is retained.
        fr: Vous pouvez utiliser un basculement planifié géré par le client pour tester le runbook pendant que les deux régions sont disponibles, et la géoredondance est conservée.
    - id: s3
      text:
        en: You can ask Microsoft to perform a Microsoft-managed failover of stproseware only.
        fr: Vous pouvez demander à Microsoft d'effectuer un basculement géré par Microsoft de stproseware uniquement.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: An unplanned failover promotes the secondary region, deletes the copy in the original primary region and converts the account to LRS. A planned failover swaps the primary and secondary regions while both are available, with no expected data loss, and keeps geo-redundancy. Microsoft-managed failover is initiated only for an entire region or datacenter, never for an individual account.
    fr: Un basculement non planifié promeut la région secondaire, supprime la copie de la région primaire d'origine et convertit le compte en LRS. Un basculement planifié échange les régions primaire et secondaire tant que les deux sont disponibles, sans perte de données attendue, et conserve la géoredondance. Le basculement géré par Microsoft n'est lancé que pour une région ou un centre de données entier, jamais pour un compte individuel.
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
