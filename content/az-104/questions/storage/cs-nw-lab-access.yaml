id: cs-nw-lab-access
objective: "2.1.3"
type: single
caseStudy: cs-northwind-clinics
difficulty: 2
status: draft
stem:
  en: You need to grant the external laboratory access to the lab-results container. The solution must meet the requirements. What should you provide to the laboratory?
  fr: Vous devez accorder au laboratoire externe l'accès au conteneur lab-results. La solution doit respecter les exigences. Que devez-vous fournir au laboratoire ?
body:
  options:
    - { id: a, text: { en: An account SAS that expires in seven days, fr: Une SAS de compte qui expire dans sept jours } }
    - { id: b, text: { en: A service SAS associated with a stored access policy on the lab-results container, fr: Une SAS de service associée à une stratégie d'accès stockée sur le conteneur lab-results } }
    - { id: c, text: { en: One of the storage account access keys, fr: L'une des clés d'accès du compte de stockage } }
    - { id: d, text: { en: A SAS signed with the storage account key and no stored access policy, fr: "Une SAS signée avec la clé du compte de stockage, sans stratégie d'accès stockée" } }
answer: { optionId: b }
explanation:
  correct:
    en: A service SAS scoped to the lab-results container limits access to that container. Because it references a stored access policy, you can revoke it at any time by deleting or changing the policy, without rotating the account keys that other applications use.
    fr: Une SAS de service limitée au conteneur lab-results restreint l'accès à ce conteneur. Comme elle référence une stratégie d'accès stockée, vous pouvez la révoquer à tout moment en supprimant ou en modifiant la stratégie, sans régénérer les clés de compte utilisées par les autres applications.
  options:
    a: { en: "An account SAS cannot use a stored access policy; revoking it requires rotating the key, which affects other applications.", fr: "Une SAS de compte ne peut pas utiliser de stratégie d'accès stockée ; la révoquer impose de régénérer la clé, ce qui affecte les autres applications." }
    c: { en: An access key gives full access to the whole account and does not expire., fr: Une clé d'accès donne un accès complet à tout le compte et n'expire pas. }
    d: { en: "Without a stored access policy, the only way to revoke the SAS early is to rotate the account key.", fr: "Sans stratégie d'accès stockée, le seul moyen de révoquer la SAS avant son expiration est de régénérer la clé du compte." }
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
