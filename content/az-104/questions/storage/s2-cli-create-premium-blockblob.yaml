id: s2-cli-create-premium-blockblob
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create a storage account named **stwingtipiot** by using the Azure CLI. The account must:

    - store block blobs on SSD-based premium performance;
    - keep a copy of the data in three availability zones of the region;
    - reject requests that use a TLS version older than 1.2.

    How should you complete the command? Select the appropriate options in the answer area.
  fr: |
    Vous devez créer un compte de stockage nommé **stwingtipiot** avec Azure CLI. Le compte doit :

    - stocker des objets blob de blocs avec les performances Premium basées sur des SSD ;
    - conserver une copie des données dans trois zones de disponibilité de la région ;
    - refuser les requêtes qui utilisent une version de TLS antérieure à 1.2.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage account create \
      --name stwingtipiot \
      --resource-group RG-IoT \
      --location francecentral \
      --sku [[sku]] \
      --kind [[kind]] \
      --min-tls-version [[tls]]
  slots:
    - id: sku
      options:
        - { id: plrs, text: Premium_LRS }
        - { id: pzrs, text: Premium_ZRS }
        - { id: szrs, text: Standard_ZRS }
        - { id: sgzrs, text: Standard_GZRS }
    - id: kind
      options:
        - { id: v2, text: StorageV2 }
        - { id: bbs, text: BlockBlobStorage }
        - { id: fs, text: FileStorage }
        - { id: blob, text: BlobStorage }
    - id: tls
      options:
        - { id: t10, text: TLS1_0 }
        - { id: t11, text: TLS1_1 }
        - { id: t12, text: TLS1_2 }
answer:
  values: { sku: pzrs, kind: bbs, tls: t12 }
explanation:
  correct:
    en: "A premium block blob account is created with the kind `BlockBlobStorage` and a `Premium_` SKU; `Premium_ZRS` replicates the data across three availability zones. `--min-tls-version TLS1_2` rejects requests that use TLS 1.0 or 1.1."
    fr: "Un compte objets blob de blocs Premium se crée avec le type `BlockBlobStorage` et une référence SKU `Premium_` ; `Premium_ZRS` réplique les données dans trois zones de disponibilité. `--min-tls-version TLS1_2` refuse les requêtes qui utilisent TLS 1.0 ou 1.1."
  options:
    plrs: { en: "Premium_LRS keeps all copies in a single datacenter.", fr: "Premium_LRS conserve toutes les copies dans un seul centre de données." }
    szrs: { en: "Standard_ZRS is zone-redundant but uses standard performance.", fr: "Standard_ZRS est redondant interzone mais utilise les performances standard." }
    sgzrs: { en: "Standard_GZRS uses standard performance; premium block blob accounts do not support geo-redundancy.", fr: "Standard_GZRS utilise les performances standard ; les comptes objets blob de blocs Premium ne prennent pas en charge la géoredondance." }
    v2: { en: "StorageV2 is the general-purpose v2 kind; a premium block blob account requires the BlockBlobStorage kind.", fr: "StorageV2 est le type usage général v2 ; un compte objets blob de blocs Premium exige le type BlockBlobStorage." }
    fs: { en: "FileStorage is the premium file shares kind.", fr: "FileStorage est le type des partages de fichiers Premium." }
    blob: { en: "BlobStorage is a legacy standard account kind.", fr: "BlobStorage est un type de compte standard hérité." }
references:
  - title: az storage account
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account
  - title: Create a storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create
