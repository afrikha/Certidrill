id: s2-cli-create-premium-blockblob
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a storage account named **stwingtipiot** by using the Azure CLI. The account must:

    - store block blobs on SSD-based premium performance;
    - keep a copy of the data in three availability zones of the region;
    - reject every request that is authorized with a storage account access key.

    How should you complete the command? Select the appropriate options in the answer area.
  fr: |
    Vous devez créer un compte de stockage nommé **stwingtipiot** avec Azure CLI. Le compte doit :

    - stocker des objets blob de blocs avec les performances Premium basées sur des SSD ;
    - conserver une copie des données dans trois zones de disponibilité de la région ;
    - refuser toute requête autorisée avec une clé d'accès du compte de stockage.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage account create \
      --name stwingtipiot \
      --resource-group RG-IoT \
      --location francecentral \
      --sku [[sku]] \
      --kind [[kind]] \
      [[tls]] false
  slots:
    - id: sku
      options:
        - { id: plrs, text: Premium_LRS }
        - { id: pzrs, text: Premium_ZRS }
        - { id: szrs, text: Standard_ZRS }
        - { id: sgzrs, text: Standard_GZRS }
    - id: kind
      options:
        - { id: v2, text: StorageV2 }
        - { id: bbs, text: BlockBlobStorage }
        - { id: fs, text: FileStorage }
        - { id: blob, text: BlobStorage }
    - id: tls
      options:
        - { id: sharedkey, text: "--allow-shared-key-access" }
        - { id: public, text: "--allow-blob-public-access" }
        - { id: https, text: "--https-only" }
        - { id: crosstenant, text: "--allow-cross-tenant-replication" }
answer:
  values: { sku: pzrs, kind: bbs, tls: sharedkey }
explanation:
  correct:
    en: "A premium block blob account is created with the kind `BlockBlobStorage` and a `Premium_` SKU; `Premium_ZRS` replicates the data across three availability zones. `--allow-shared-key-access false` disallows Shared Key authorization, so requests signed with an account key, including account and service SAS tokens, are rejected and only Microsoft Entra authorization remains."
    fr: "Un compte d'objets blob de blocs Premium se crée avec le type `BlockBlobStorage` et une référence SKU `Premium_` ; `Premium_ZRS` réplique les données dans trois zones de disponibilité. `--allow-shared-key-access false` interdit l'autorisation par clé partagée : les requêtes signées avec une clé de compte, y compris les SAS de compte et de service, sont refusées et seule l'autorisation Microsoft Entra reste possible."
  options:
    plrs: { en: "Premium_LRS keeps all copies in a single datacenter.", fr: "Premium_LRS conserve toutes les copies dans un seul centre de données." }
    szrs: { en: "Standard_ZRS is zone-redundant but uses standard performance.", fr: "Standard_ZRS est redondant interzone mais utilise les performances standard." }
    sgzrs: { en: "Standard_GZRS uses standard performance; premium block blob accounts do not support geo-redundancy.", fr: "Standard_GZRS utilise les performances standard ; les comptes d'objets blob de blocs Premium ne prennent pas en charge la géoredondance." }
    v2: { en: "StorageV2 is the general-purpose v2 kind; a premium block blob account requires the BlockBlobStorage kind.", fr: "StorageV2 est le type usage général v2 ; un compte d'objets blob de blocs Premium exige le type BlockBlobStorage." }
    fs: { en: "FileStorage is the premium file shares kind.", fr: "FileStorage est le type des partages de fichiers Premium." }
    blob: { en: "BlobStorage is a legacy standard account kind.", fr: "BlobStorage est un type de compte standard hérité." }
    public: { en: "Disabling anonymous blob access blocks unauthenticated requests, not requests authorized with an account key.", fr: "Désactiver l'accès anonyme aux objets blob bloque les requêtes non authentifiées, pas celles autorisées avec une clé de compte." }
    https: { en: "Setting --https-only to false would allow HTTP traffic; it has nothing to do with access keys.", fr: "Définir --https-only sur false autoriserait le trafic HTTP ; cela n'a aucun rapport avec les clés d'accès." }
    crosstenant: { en: "This setting controls object replication across Microsoft Entra tenants.", fr: "Ce paramètre contrôle la réplication d'objets entre locataires Microsoft Entra." }
references:
  - title: az storage account
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account
  - title: Prevent authorization with Shared Key
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
