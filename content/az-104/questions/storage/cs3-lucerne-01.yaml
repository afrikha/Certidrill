id: cs3-lucerne-01
objective: "2.3.6"
type: yesno_statements
caseStudy: cs3-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You enable blob versioning on stlucarchive to meet the first compliance requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez le contrôle de version des objets blob sur stlucarchive pour satisfaire la première exigence de conformité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When an editor deletes a manuscript, its current version becomes a previous version that can be restored."
        fr: "Quand un éditeur supprime un manuscrit, sa version actuelle devient une version précédente qui peut être restaurée."
    - id: s2
      text:
        en: "An editor can modify the metadata of a previous version of a manuscript to correct it."
        fr: "Un éditeur peut modifier les métadonnées d'une version précédente d'un manuscrit pour la corriger."
    - id: s3
      text:
        en: "Blob versioning lets you recover the manuscripts if the manuscripts container is deleted."
        fr: "Le contrôle de version des objets blob permet de récupérer les manuscrits si le conteneur manuscripts est supprimé."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "With versioning, a delete operation turns the current version into a previous version, and you can restore it by copying that version over the base blob. Previous versions are immutable: their content and metadata can't be changed. Versioning works at the blob level only; deleting a container removes all its blobs and versions, so container soft delete is needed for that scenario."
    fr: "Avec le contrôle de version, une suppression transforme la version actuelle en version précédente, que vous pouvez restaurer en la copiant sur l'objet blob de base. Les versions précédentes sont immuables : leur contenu et leurs métadonnées ne peuvent pas être modifiés. Le contrôle de version fonctionne uniquement au niveau de l'objet blob ; la suppression d'un conteneur supprime tous ses objets blob et leurs versions, et ce scénario nécessite la suppression réversible de conteneur."
references:
  - title: "Blob Versioning in Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
