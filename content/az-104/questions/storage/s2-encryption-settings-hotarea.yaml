id: s2-encryption-settings-hotarea
objective: "2.2.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You are creating a general-purpose v2 storage account named **sthealthrec** in the Azure portal. Before you select **Review + create**, the encryption-related settings are as shown in the following table.

    For each requirement, select the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un compte de stockage à usage général v2 nommé **sthealthrec** dans le portail Azure. Avant de sélectionner **Vérifier + créer**, les paramètres liés au chiffrement sont ceux du tableau suivant.

    Pour chaque exigence, sélectionnez le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Data must be encrypted a second time at the infrastructure level with a different key and algorithm.", fr: "Les données doivent être chiffrées une seconde fois au niveau de l'infrastructure, avec une clé et un algorithme différents." }
    - id: p2
      text: { en: "Table data must be protectable by a customer-managed key after the account is created.", fr: "Les données des tables doivent pouvoir être protégées par une clé gérée par le client après la création du compte." }
  grid:
    caption: { en: "sthealthrec | Create storage account (encryption settings)", fr: "sthealthrec | Créer un compte de stockage (paramètres de chiffrement)" }
    header: [{ en: "Setting", fr: "Paramètre" }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: { en: "Encryption type", fr: "Type de chiffrement" }, area: enctype }, { text: { en: "Microsoft-managed keys (MMK)", fr: "Clés gérées par Microsoft (MMK)" } }]
      - [{ text: { en: "Enable support for customer-managed keys", fr: "Activer la prise en charge des clés gérées par le client" }, area: cmksupport }, { text: { en: "Blobs and files only", fr: "Objets blob et fichiers uniquement" } }]
      - [{ text: { en: "Enable infrastructure encryption", fr: "Activer le chiffrement de l'infrastructure" }, area: infra }, { text: { en: Disabled, fr: Désactivé } }]
      - [{ text: { en: "Secure transfer required", fr: "Transfert sécurisé obligatoire" }, area: secure }, { text: { en: Enabled, fr: Activé } }]
      - [{ text: { en: "Minimum TLS version", fr: "Version TLS minimale" }, area: tls }, { text: "Version 1.2" }]
answer:
  values: { p1: infra, p2: cmksupport }
explanation:
  correct:
    en: Infrastructure encryption doubly encrypts the data with a separate Microsoft-managed key and must be enabled when the account is created. Queues and tables can use a customer-managed key only if the account is created to use the account-scoped encryption key for them, which is what extending customer-managed key support to all service types does; this choice cannot be changed later.
    fr: Le chiffrement de l'infrastructure chiffre doublement les données avec une clé distincte gérée par Microsoft et doit être activé à la création du compte. Les files d'attente et les tables ne peuvent utiliser une clé gérée par le client que si le compte est créé pour utiliser pour elles la clé de chiffrement de l'étendue du compte, ce que fait l'extension de la prise en charge des clés gérées par le client à tous les types de services ; ce choix ne peut pas être modifié ensuite.
  options:
    enctype:
      en: Switching to customer-managed keys now is not required; you can switch between Microsoft-managed and customer-managed keys at any time, provided table support was enabled at creation.
      fr: Passer dès maintenant aux clés gérées par le client n'est pas nécessaire ; vous pouvez basculer à tout moment entre clés gérées par Microsoft et clés gérées par le client, à condition que la prise en charge des tables ait été activée à la création.
    secure:
      en: Secure transfer protects data in transit, not at rest.
      fr: Le transfert sécurisé protège les données en transit, pas au repos.
references:
  - title: Enable infrastructure encryption for double encryption of data
    url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
  - title: Create an account that supports customer-managed keys for tables and queues
    url: https://learn.microsoft.com/en-us/azure/storage/common/account-encryption-key-create
