id: s2-cli-change-redundancy
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two standard general-purpose v2 storage accounts that use locally redundant storage (LRS):

    - **stdevfab** must be changed to geo-redundant storage (GRS).
    - **stprodfab** must be changed to zone-redundant storage (ZRS) with no application downtime.

    You need to make the changes by using the Azure CLI.

    How should you complete the commands? Select the appropriate options in the answer area.
  fr: |
    Vous disposez de deux comptes de stockage usage général v2 standard qui utilisent le stockage localement redondant (LRS) :

    - **stdevfab** doit passer au stockage géoredondant (GRS).
    - **stprodfab** doit passer au stockage redondant interzone (ZRS) sans interruption de l'application.

    Vous devez effectuer ces modifications avec Azure CLI.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    # stdevfab: LRS -> GRS
    az storage account [[cmd1]] \
      --name stdevfab --resource-group RG1 --sku Standard_GRS

    # stprodfab: LRS -> ZRS
    az storage account [[cmd2]] \
      --account-name stprodfab --resource-group RG1 --sku Standard_ZRS --no-wait
  slots:
    - id: cmd1
      options:
        - { id: update, text: update }
        - { id: migstart, text: migration start }
        - { id: failover, text: failover }
        - { id: create, text: create }
    - id: cmd2
      options:
        - { id: update, text: update }
        - { id: migstart, text: migration start }
        - { id: failover, text: failover }
        - { id: hns, text: hns-migration start }
answer:
  values: { cmd1: update, cmd2: migstart }
explanation:
  correct:
    en: "Adding or removing geo-redundancy is a simple setting change made with `az storage account update --sku`. Adding zone redundancy requires a conversion; a customer-initiated conversion is started with `az storage account migration start` and runs without data loss or application downtime."
    fr: "L'ajout ou la suppression de la géoredondance est une simple modification de paramètre effectuée avec `az storage account update --sku`. L'ajout de la redondance interzone exige une conversion ; une conversion lancée par le client démarre avec `az storage account migration start` et s'exécute sans perte de données ni interruption de l'application."
  options:
    update: { en: "update is right for stdevfab, but it cannot add zone redundancy to stprodfab: that change requires a conversion.", fr: "update convient pour stdevfab, mais il ne peut pas ajouter la redondance interzone à stprodfab : cette modification exige une conversion." }
    migstart: { en: "migration start performs a zone-redundancy conversion; geo-redundancy for stdevfab is changed directly with update.", fr: "migration start effectue une conversion de redondance interzone ; la géoredondance de stdevfab se modifie directement avec update." }
    failover: { en: "failover switches the primary region of a geo-redundant account; it does not change the SKU.", fr: "failover change la région primaire d'un compte géoredondant ; il ne modifie pas la référence SKU." }
    create: { en: "create would create a new account instead of changing the existing one.", fr: "create créerait un nouveau compte au lieu de modifier le compte existant." }
    hns: { en: "hns-migration start upgrades an account to a hierarchical namespace; it does not change redundancy.", fr: "hns-migration start fait évoluer un compte vers un espace de noms hiérarchique ; il ne modifie pas la redondance." }
references:
  - title: Change how a storage account is replicated
    url: https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
  - title: az storage account migration
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account/migration
