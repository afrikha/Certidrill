id: s3-blob-container-cli-access
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stfabrikam01** that has **Allow Blob anonymous access** enabled.

    You need to use the Azure CLI to:

    - create a container named **press** that does not allow any anonymous access;
    - later, change the container so that anonymous clients can read individual blobs without being able to list the container.

    How should you complete the commands? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un compte de stockage nommé **stfabrikam01** pour lequel **Autoriser l'accès anonyme aux objets blob** est activé.

    Vous devez utiliser Azure CLI pour :

    - créer un conteneur nommé **press** qui n'autorise aucun accès anonyme ;
    - plus tard, modifier le conteneur pour que des clients anonymes puissent lire des objets blob individuels sans pouvoir lister le conteneur.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage container create \
      --name press \
      --account-name stfabrikam01 \
      --public-access [[create]] \
      --account-key $key --auth-mode key

    az storage container [[cmd]] \
      --name press \
      --account-name stfabrikam01 \
      --public-access [[later]] \
      --account-key $key --auth-mode key
  slots:
    - id: create
      options:
        - { id: "off", text: "off" }
        - { id: private, text: private }
        - { id: none, text: none }
    - id: cmd
      options:
        - { id: setperm, text: set-permission }
        - { id: update, text: update }
        - { id: policy, text: policy create }
        - { id: immut, text: immutability-policy create }
    - id: later
      options:
        - { id: blob, text: blob }
        - { id: container, text: container }
        - { id: off2, text: "off" }
answer:
  values: { create: "off", cmd: setperm, later: blob }
explanation:
  correct:
    en: "`--public-access` accepts off, blob or container; off (shown as Private in the portal) is the default and allows no anonymous access. `az storage container set-permission` changes the anonymous access level of an existing container, and blob allows anonymous reads of blobs without listing."
    fr: "`--public-access` accepte off, blob ou container ; off (affiché Privé dans le portail) est la valeur par défaut et n'autorise aucun accès anonyme. `az storage container set-permission` modifie le niveau d'accès anonyme d'un conteneur existant, et blob autorise la lecture anonyme des objets blob sans énumération."
  options:
    private: { en: "Private is the portal label; the CLI value is off.", fr: "Privé est le libellé du portail ; la valeur CLI est off." }
    policy: { en: "policy create creates a stored access policy for SAS tokens.", fr: "policy create crée une stratégie d'accès stockée pour des jetons SAS." }
    immut: { en: An immutability policy makes data WORM; it does not control anonymous access., fr: "Une stratégie d'immuabilité rend les données WORM ; elle ne contrôle pas l'accès anonyme." }
    container: { en: container would also allow anonymous listing of the blobs., fr: container autoriserait aussi l'énumération anonyme des objets blob. }
references:
  - title: Configure anonymous read access for containers and blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
