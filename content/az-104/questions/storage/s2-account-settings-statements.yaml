id: s2-account-settings-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a naming and design standard for the storage accounts of Northwind Traders.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous préparez une norme de nommage et de conception pour les comptes de stockage de Northwind Traders.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: After you create a standard general-purpose v2 account, you can change its performance to premium.
        fr: Après avoir créé un compte usage général v2 standard, vous pouvez passer ses performances à Premium.
    - id: s2
      text:
        en: A premium block blob storage account can use zone-redundant storage (ZRS).
        fr: Un compte de stockage objets blob de blocs Premium peut utiliser le stockage redondant interzone (ZRS).
    - id: s3
      text:
        en: The name **st-northwind-logs** is a valid storage account name.
        fr: Le nom **st-northwind-logs** est un nom de compte de stockage valide.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: You cannot change a storage account to a different type after it is created; to move to premium you create a new account and copy the data. Premium block blob accounts support LRS and ZRS. Storage account names are 3 to 24 characters long and contain only numbers and lowercase letters, so hyphens are not allowed.
    fr: "Vous ne pouvez pas changer le type d'un compte de stockage après sa création : pour passer en Premium, vous créez un nouveau compte et y copiez les données. Les comptes objets blob de blocs Premium prennent en charge LRS et ZRS. Les noms de compte de stockage comptent de 3 à 24 caractères et ne contiennent que des chiffres et des lettres minuscules : les traits d'union ne sont pas autorisés."
references:
  - title: Storage account overview
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
