id: s3-protection-match-features
objective: "2.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses a standard general-purpose v2 storage account named **stwoodgroveapp** for block blobs. The hierarchical namespace is disabled.

    You need to choose a data protection feature for each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.
  fr: |
    Woodgrove Bank utilise un compte de stockage usage général v2 standard nommé **stwoodgroveapp** pour des objets blob de blocs. L'espace de noms hiérarchique est désactivé.

    Vous devez choisir une fonctionnalité de protection des données pour chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: versioning, text: { en: Blob versioning, fr: Contrôle de version des objets blob } }
    - { id: container, text: { en: Container soft delete, fr: Suppression réversible des conteneurs } }
    - { id: pitr, text: { en: Point-in-time restore, fr: Restauration à un instant dans le passé } }
    - { id: blobsd, text: { en: Blob soft delete, fr: Suppression réversible des objets blob } }
    - { id: feed, text: { en: Change feed, fr: Flux de modification } }
    - { id: lock, text: { en: CanNotDelete lock on the storage account, fr: Verrou CanNotDelete sur le compte de stockage } }
  targets:
    - id: t1
      text: { en: Recover a container that was deleted, together with all its blobs, fr: "Récupérer un conteneur supprimé, avec tous ses objets blob" }
    - id: t2
      text: { en: Automatically keep the previous state of a blob every time its metadata is updated, fr: "Conserver automatiquement l'état précédent d'un objet blob à chaque mise à jour de ses métadonnées" }
    - id: t3
      text: { en: Revert all the block blobs of a container to their state of two days ago in a single operation, fr: "Ramener tous les objets blob de blocs d'un conteneur à leur état d'il y a deux jours en une seule opération" }
    - id: t4
      text: { en: Prevent an administrator from deleting the storage account by mistake, fr: "Empêcher un administrateur de supprimer le compte de stockage par erreur" }
answer:
  mapping: { t1: container, t2: versioning, t3: pitr, t4: lock }
explanation:
  correct:
    en: Container soft delete restores a deleted container with its blobs, versions and snapshots. Versioning creates a version on every write, including Set Blob Metadata, whereas blob soft delete does not protect metadata or property writes. Point-in-time restore reverts sets of block blobs to an earlier state in one atomic operation. None of these in-account features protect the account itself; a CanNotDelete lock does.
    fr: La suppression réversible des conteneurs restaure un conteneur supprimé avec ses objets blob, ses versions et ses instantanés. Le contrôle de version crée une version à chaque écriture, y compris Set Blob Metadata, alors que la suppression réversible des objets blob ne protège pas les écritures de métadonnées ou de propriétés. La restauration à un instant dans le passé ramène des ensembles d'objets blob de blocs à un état antérieur en une seule opération atomique. Aucune de ces fonctionnalités internes au compte ne protège le compte lui-même ; un verrou CanNotDelete le fait.
  options:
    t2:
      en: Blob soft delete creates no snapshot when metadata or properties are updated.
      fr: La suppression réversible des objets blob ne crée aucun instantané lors de la mise à jour des métadonnées ou des propriétés.
    t3:
      en: The change feed logs changes but does not revert them by itself; it is a prerequisite of point-in-time restore.
      fr: Le flux de modification journalise les modifications sans les annuler lui-même ; c'est un prérequis de la restauration à un instant dans le passé.
references:
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
  - title: Soft delete for containers
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview
