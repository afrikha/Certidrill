id: s1-sas-token-fields
objective: "2.1.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    A developer at Wingtip sends you the following account SAS token, split into its query parameters.

    Answer each prompt by selecting the parameter that controls the described behavior.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur de Wingtip vous envoie le jeton SAS de compte suivant, découpé en paramètres de requête.

    Répondez à chaque consigne en sélectionnant le paramètre qui contrôle le comportement décrit.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: Requests are accepted only from a specific client address.
        fr: Les demandes ne sont acceptées que depuis une adresse cliente précise.
    - id: p2
      text:
        en: The token stops being valid at a given date and time.
        fr: Le jeton cesse d'être valide à une date et une heure données.
  grid:
    header:
      - { en: "Parameter", fr: "Paramètre" }
      - { en: "Value", fr: "Valeur" }
    rows:
      - [{ text: sv, area: sv }, { text: "2022-11-02" }]
      - [{ text: ss, area: ss }, { text: b }]
      - [{ text: srt, area: srt }, { text: co }]
      - [{ text: sp, area: sp }, { text: rl }]
      - [{ text: st, area: st }, { text: "2026-11-12T08:00:00Z" }]
      - [{ text: se, area: se }, { text: "2026-11-12T16:00:00Z" }]
      - [{ text: sip, area: sip }, { text: "203.0.113.10" }]
      - [{ text: spr, area: spr }, { text: https }]
answer:
  values: { p1: sip, p2: se }
explanation:
  correct:
    en: "`sip` (signed IP) restricts the requests to an IP address or an inclusive range of IPv4 addresses. `se` (signed expiry) is the time at which the SAS becomes invalid; `st` is only the start time. The other fields set the version (sv), services (ss), resource types (srt), permissions (sp) and protocol (spr)."
    fr: "`sip` (IP signée) limite les demandes à une adresse IP ou à une plage inclusive d'adresses IPv4. `se` (expiration signée) est l'heure à laquelle la SAS devient non valide ; `st` n'est que l'heure de début. Les autres champs définissent la version (sv), les services (ss), les types de ressources (srt), les autorisations (sp) et le protocole (spr)."
references:
  - title: Create an account SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas
