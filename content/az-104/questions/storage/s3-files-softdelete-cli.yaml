id: s3-files-softdelete-cli
objective: "2.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stfiles01** in a resource group named **RG1**. The account contains classic SMB file shares.

    You need to use the Azure CLI to:

    - enable soft delete for all the file shares in stfiles01, with the longest retention period supported;
    - restore a soft-deleted share named **projects** whose deleted version is 01D64EB9886F00C4.

    How should you complete the commands? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un compte de stockage nommé **stfiles01** dans un groupe de ressources nommé **RG1**. Le compte contient des partages de fichiers SMB classiques.

    Vous devez utiliser Azure CLI pour :

    - activer la suppression réversible pour tous les partages de fichiers de stfiles01, avec la plus longue période de rétention prise en charge ;
    - restaurer un partage supprimé de manière réversible nommé **projects**, dont la version supprimée est 01D64EB9886F00C4.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage account [[svc]] update \
      --resource-group RG1 \
      --account-name stfiles01 \
      --enable-delete-retention true \
      --delete-retention-days [[days]]

    az storage share-rm [[op]] \
      --resource-group RG1 \
      --storage-account stfiles01 \
      --name projects \
      --deleted-version 01D64EB9886F00C4
  slots:
    - id: svc
      options:
        - { id: file, text: file-service-properties }
        - { id: blob, text: blob-service-properties }
        - { id: mgmt, text: management-policy }
    - id: days
      options:
        - { id: d90, text: "90" }
        - { id: d365, text: "365" }
        - { id: d3650, text: "3650" }
    - id: op
      options:
        - { id: restore, text: restore }
        - { id: undelete, text: undelete }
        - { id: create, text: create }
        - { id: recover, text: recover }
answer:
  values: { svc: file, days: d365, op: restore }
explanation:
  correct:
    en: Soft delete for file shares is a setting of the file service of the storage account, configured with `az storage account file-service-properties update`. The retention period ranges from 1 to 365 days. `az storage share-rm restore` with `--deleted-version` restores a soft-deleted share within the retention period.
    fr: La suppression réversible des partages de fichiers est un paramètre du service de fichiers du compte de stockage, configuré avec `az storage account file-service-properties update`. La période de rétention va de 1 à 365 jours. `az storage share-rm restore` avec `--deleted-version` restaure un partage supprimé de manière réversible pendant la période de rétention.
  options:
    blob: { en: blob-service-properties configures soft delete for blobs, not for file shares., fr: blob-service-properties configure la suppression réversible des objets blob, pas des partages de fichiers. }
    mgmt: { en: management-policy manages blob lifecycle management policies., fr: management-policy gère les stratégies de gestion du cycle de vie des objets blob. }
    d3650: { en: The maximum retention period for soft-deleted shares is 365 days., fr: La période de rétention maximale des partages supprimés de manière réversible est de 365 jours. }
    create: { en: create would create a new empty share instead of restoring the deleted one., fr: create créerait un nouveau partage vide au lieu de restaurer le partage supprimé. }
references:
  - title: Azure file share soft delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
  - title: az storage share-rm
    url: https://learn.microsoft.com/en-us/cli/azure/storage/share-rm
