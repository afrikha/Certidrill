id: sr-03-q3
objective: "2.2.2"
type: series_yesno
series: sr-03-read-secondary
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You configure stor1 to use geo-zone-redundant storage (GZRS).
  fr: |
    Vous configurez stor1 pour utiliser le stockage géoredondant interzone (GZRS).
body:
  solution:
    en: |
      You create stor1 with **geo-zone-redundant storage (GZRS)**.
    fr: |
      Vous créez stor1 avec le **stockage géoredondant interzone (GZRS)**.
answer: { value: false }
explanation:
  correct:
    en: |
      GZRS protects against the loss of an availability zone in East US and replicates the data to the secondary region. As with GRS, the secondary copy can't be read until the account fails over, so App1 would lose read access during a regional outage until a failover is initiated. The goal isn't met.
    fr: |
      GZRS protège contre la perte d'une zone de disponibilité d'East US et réplique les données dans la région secondaire. Comme avec GRS, la copie secondaire ne peut pas être lue tant que le compte n'a pas basculé : App1 perdrait l'accès en lecture pendant une panne régionale jusqu'au lancement d'un basculement. L'objectif n'est pas atteint.
references:
  - title: "Data redundancy - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
