id: cs2-wingtip-06
objective: "2.2.2"
type: single
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You change the redundancy of stwingtipimages to read-access geo-zone-redundant storage (RA-GZRS). You need to ensure that ca-storefront meets business requirement 1.

    How should ca-storefront read the product images when the primary endpoint of stwingtipimages is unavailable?
  fr: |
    Vous changez la redondance de stwingtipimages en stockage géoredondant interzone avec accès en lecture (RA-GZRS). Vous devez vous assurer que ca-storefront satisfait l'exigence métier 1.

    Comment ca-storefront doit-il lire les images des produits quand le point de terminaison principal de stwingtipimages est indisponible ?
body:
  options:
    - { id: a, text: { en: "Retry the reads against the secondary endpoint, stwingtipimages-secondary.blob.core.windows.net", fr: "Relancer les lectures sur le point de terminaison secondaire, stwingtipimages-secondary.blob.core.windows.net" } }
    - { id: b, text: { en: "Keep reading from stwingtipimages.blob.core.windows.net, which redirects the reads to West US automatically", fr: "Continuer à lire depuis stwingtipimages.blob.core.windows.net, qui redirige automatiquement les lectures vers West US" } }
    - { id: c, text: { en: "Start a customer-managed failover of stwingtipimages, and then read from the primary endpoint", fr: "Lancer un basculement géré par le client de stwingtipimages, puis lire depuis le point de terminaison principal" } }
    - { id: d, text: { en: "Wait for a Microsoft-managed failover, and then read from the secondary endpoint", fr: "Attendre un basculement géré par Microsoft, puis lire depuis le point de terminaison secondaire" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With RA-GZRS, the data is replicated asynchronously to the paired region (West US) and can be read at any time from the secondary endpoint, whose name adds the -secondary suffix to the account name. The application must be designed to switch its reads to that endpoint when the primary endpoint does not respond; no failover is needed. Reads from the secondary region can return data that is slightly behind the primary.
    fr: |
      Avec RA-GZRS, les données sont répliquées de manière asynchrone vers la région jumelée (West US) et peuvent être lues à tout moment depuis le point de terminaison secondaire, dont le nom ajoute le suffixe -secondary au nom du compte. L'application doit être conçue pour basculer ses lectures vers ce point de terminaison quand le point de terminaison principal ne répond pas ; aucun basculement n'est nécessaire. Les lectures dans la région secondaire peuvent renvoyer des données légèrement en retard sur la région primaire.
  options:
    b: { en: "Azure Storage does not redirect requests from the primary endpoint to the secondary region; the application must call the secondary endpoint itself.", fr: "Stockage Azure ne redirige pas les requêtes du point de terminaison principal vers la région secondaire ; l'application doit appeler elle-même le point de terminaison secondaire." }
    c: { en: "A failover makes the images available only after it completes, which the requirement rules out.", fr: "Un basculement ne rend les images disponibles qu'une fois terminé, ce que l'exigence exclut." }
    d: { en: "The secondary endpoint of an RA- account is readable without any failover; waiting for Microsoft would delay the store.", fr: "Le point de terminaison secondaire d'un compte RA- est lisible sans aucun basculement ; attendre Microsoft retarderait la boutique." }
references:
  - title: "Data redundancy - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: "Use geo-redundancy to design highly available applications - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/geo-redundant-design
