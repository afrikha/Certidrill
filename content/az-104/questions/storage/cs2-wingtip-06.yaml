id: cs2-wingtip-06
objective: "2.2.2"
type: single
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: You need to change the redundancy of stwingtipimages to meet the requirements. Which redundancy option should you select?
  fr: Vous devez modifier la redondance de stwingtipimages pour respecter les exigences. Quelle option de redondance devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" } }
    - { id: b, text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" } }
    - { id: c, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
    - { id: d, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Requirement 8 needs synchronous copies across availability zones in East US, which GZRS provides. Requirement 1 needs read access to the secondary region (West US) without a failover, which the RA- option adds. RA-GZRS is the only option that combines both.
    fr: |
      L'exigence 8 nécessite des copies synchrones dans plusieurs zones de disponibilité d'East US, ce que fournit GZRS. L'exigence 1 nécessite un accès en lecture à la région secondaire (West US) sans basculement, ce qu'ajoute l'option RA-. RA-GZRS est la seule option qui combine les deux.
  options:
    b: { en: "RA-GRS keeps the primary copies in a single datacenter (LRS), so a zone failure can make the primary data unavailable or lost.", fr: "RA-GRS conserve les copies primaires dans un seul centre de données (LRS) ; une défaillance de zone peut rendre les données primaires indisponibles ou les perdre." }
    c: { en: "Without read access, the secondary copy is readable only after a failover.", fr: "Sans accès en lecture, la copie secondaire n'est lisible qu'après un basculement." }
    d: { en: "ZRS stays in East US and does not protect against a regional outage.", fr: "ZRS reste dans East US et ne protège pas contre une panne régionale." }
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
