id: s2-unplanned-failover-steps
objective: "2.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware has a general-purpose v2 storage account named **stlitwaredocs** configured with geo-redundant storage (GRS). The primary region is East US and the secondary region is West US. Some blobs in the account are in the Archive tier.

    An outage makes the primary endpoints of stlitwaredocs unavailable for several hours. The secondary region is healthy. Management decides to fail over to West US and to restore geo-redundancy as soon as possible afterward.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un compte de stockage à usage général v2 nommé **stlitwaredocs**, configuré avec le stockage géoredondant (GRS). La région primaire est East US et la région secondaire est West US. Certains objets blob du compte sont au niveau archive (Archive).

    Une panne rend les points de terminaison primaires de stlitwaredocs indisponibles pendant plusieurs heures. La région secondaire fonctionne normalement. La direction décide de basculer vers West US, puis de rétablir la géoredondance dès que possible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lst, text: { en: "Check the **Last Sync Time** property to estimate the potential data loss.", fr: "Vérifier la propriété **Heure de la dernière synchronisation** pour estimer la perte de données potentielle." } }
    - { id: unplanned, text: { en: "Initiate a customer-managed (unplanned) failover.", fr: "Lancer un basculement géré par le client (non planifié)." } }
    - { id: rehydrate, text: { en: "Rehydrate the archived blobs to an online tier.", fr: "Réhydrater les objets blob archivés vers un niveau en ligne." } }
    - { id: grs, text: { en: "Change the redundancy of the account back to GRS.", fr: "Rétablir la redondance du compte sur GRS." } }
    - { id: planned, text: { en: "Initiate a customer-managed planned failover.", fr: "Lancer un basculement planifié géré par le client." } }
    - { id: zrs, text: { en: "Perform a conversion of the account to ZRS.", fr: "Effectuer une conversion du compte vers ZRS." } }
    - { id: ticket, text: { en: "Open a support request to ask for a Microsoft-managed failover of the account.", fr: "Ouvrir une demande de support pour obtenir un basculement géré par Microsoft du compte." } }
answer:
  sequence: [lst, unplanned, rehydrate, grs]
explanation:
  correct:
    en: Because replication is asynchronous, you first compare the Last Sync Time with your last writes to evaluate data loss. An unplanned failover is the option when the primary endpoints are unavailable; afterward the account is LRS in the new primary region. Archived blobs must be rehydrated to an online tier before the account can be configured for geo-redundancy again, and then you set it back to GRS.
    fr: "Comme la réplication est asynchrone, vous comparez d'abord l'heure de la dernière synchronisation à vos dernières écritures pour évaluer la perte de données. Le basculement non planifié est l'option à utiliser quand les points de terminaison primaires sont indisponibles ; ensuite, le compte est LRS dans la nouvelle région primaire. Les objets blob archivés doivent être réhydratés vers un niveau en ligne avant de pouvoir reconfigurer la géoredondance, puis vous rétablissez GRS."
  options:
    planned:
      en: A planned failover requires the account to be available in both the primary and the secondary regions.
      fr: Un basculement planifié exige que le compte soit disponible dans la région primaire et dans la région secondaire.
    zrs:
      en: Conversion to ZRS or GZRS is not supported for an LRS account that results from a failover, and it would not restore geo-redundancy.
      fr: La conversion vers ZRS ou GZRS n'est pas prise en charge pour un compte LRS issu d'un basculement, et elle ne rétablirait pas la géoredondance.
    ticket:
      en: Microsoft-managed failover applies to an entire region in extreme circumstances and cannot be requested for an individual storage account.
      fr: Le basculement géré par Microsoft s'applique à une région entière dans des circonstances extrêmes et ne peut pas être demandé pour un compte de stockage individuel.
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
  - title: Change how a storage account is replicated
    url: https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
