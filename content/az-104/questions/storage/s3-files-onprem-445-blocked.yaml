id: s3-files-onprem-445-blocked
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an SMB Azure file share named **projects** in a storage account named **stadatumfs**. Users in the Paris office must map the share directly from their Windows computers. There is no file server in the office.

    The security policy of Adatum forbids opening outbound TCP port 445 to the internet.

    Which two solutions allow the users to map the share? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un partage de fichiers Azure SMB nommé **projects** dans un compte de stockage nommé **stadatumfs**. Les utilisateurs du bureau de Paris doivent mapper le partage directement depuis leurs ordinateurs Windows. Le bureau ne dispose d'aucun serveur de fichiers.

    La stratégie de sécurité d'Adatum interdit d'ouvrir le port TCP 445 sortant vers Internet.

    Quelles sont les deux solutions qui permettent aux utilisateurs de mapper le partage ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect the office to an Azure virtual network by using a site-to-site VPN, and create a private endpoint for stadatumfs in that virtual network.", fr: "Connecter le bureau à un réseau virtuel Azure avec un VPN site à site, et créer un point de terminaison privé pour stadatumfs dans ce réseau virtuel." } }
    - { id: b, text: { en: "Connect the office to an Azure virtual network by using ExpressRoute, and create a private endpoint for stadatumfs in that virtual network.", fr: "Connecter le bureau à un réseau virtuel Azure avec ExpressRoute, et créer un point de terminaison privé pour stadatumfs dans ce réseau virtuel." } }
    - { id: c, text: { en: Enable a service endpoint for Microsoft.Storage on a subnet and allow that subnet in the storage account firewall., fr: "Activer un point de terminaison de service Microsoft.Storage sur un sous-réseau et autoriser ce sous-réseau dans le pare-feu du compte de stockage." } }
    - { id: d, text: { en: Change the protocol of the projects share from SMB to NFS., fr: "Remplacer le protocole du partage projects SMB par NFS." } }
    - { id: e, text: { en: Configure the projects share to accept SMB connections on TCP port 443., fr: "Configurer le partage projects pour accepter les connexions SMB sur le port TCP 443." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: To reach an SMB share from on-premises without exposing port 445 to the internet, connect the on-premises network to Azure through a VPN or ExpressRoute, and expose the storage account on that network through a private endpoint. SMB traffic then flows over the private connection.
    fr: "Pour accéder à un partage SMB depuis le site local sans exposer le port 445 à Internet, il faut relier le réseau local à Azure par un VPN ou par ExpressRoute, et exposer le compte de stockage sur ce réseau avec un point de terminaison privé. Le trafic SMB passe alors par la connexion privée."
  options:
    c:
      en: A service endpoint only restricts the public endpoint to traffic from Azure subnets; on-premises clients still need port 445 to the internet.
      fr: Un point de terminaison de service limite seulement le point de terminaison public au trafic de sous-réseaux Azure ; les clients locaux auraient toujours besoin du port 445 vers Internet.
    d:
      en: The protocol of an existing share cannot be changed, and NFS shares are Linux-only and not internet accessible.
      fr: Le protocole d'un partage existant ne peut pas être modifié, et les partages NFS sont réservés à Linux et ne sont pas accessibles depuis Internet.
    e:
      en: Azure Files does not let you change the SMB port; SMB always uses port 445.
      fr: Azure Files ne permet pas de changer le port SMB ; SMB utilise toujours le port 445.
references:
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
  - title: Mount SMB Azure File Share on Windows
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows
