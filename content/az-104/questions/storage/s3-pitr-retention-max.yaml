id: s3-pitr-retention-max
objective: "2.3.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have a general-purpose v2 storage account named **stlitwareorders**. The account has the following data protection settings:

    - Blob soft delete: enabled, retention period 14 days
    - Blob versioning: enabled
    - Change feed: enabled, retention period 30 days

    You need to enable point-in-time restore with the longest restore period possible without changing the other settings.

    What is the maximum retention period that you can configure for point-in-time restore?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stlitwareorders**. Le compte a les paramètres de protection des données suivants :

    - Suppression réversible des objets blob : activée, période de rétention de 14 jours
    - Contrôle de version des objets blob : activé
    - Flux de modification : activé, période de rétention de 30 jours

    Vous devez activer la restauration à un instant dans le passé avec la période de restauration la plus longue possible, sans modifier les autres paramètres.

    Quelle est la période de rétention maximale que vous pouvez configurer pour la restauration à un instant dans le passé ?
body:
  options:
    - { id: a, text: { en: "13 days", fr: "13 jours" } }
    - { id: b, text: { en: "14 days", fr: "14 jours" } }
    - { id: c, text: { en: "29 days", fr: "29 jours" } }
    - { id: d, text: { en: "30 days", fr: "30 jours" } }
answer: { optionId: a }
explanation:
  correct:
    en: The retention period for point-in-time restore must be at least one day less than both the blob soft delete retention period and the change feed retention period. The shorter of the two, the 14-day soft delete retention, is the limiting one, so the maximum is 13 days.
    fr: La période de rétention de la restauration à un instant dans le passé doit être inférieure d'au moins un jour à la fois à la période de rétention de la suppression réversible des objets blob et à celle du flux de modification. La plus courte des deux, la rétention de 14 jours de la suppression réversible, est celle qui limite ; le maximum est donc de 13 jours.
  options:
    b:
      en: The restore period cannot be equal to the soft delete retention period; it must be at least one day shorter.
      fr: La période de restauration ne peut pas être égale à la période de rétention de la suppression réversible ; elle doit être plus courte d'au moins un jour.
    c:
      en: 29 days respects the change feed retention but exceeds the 14-day soft delete retention, which also limits the restore period.
      fr: 29 jours respecte la rétention du flux de modification, mais dépasse la rétention de 14 jours de la suppression réversible, qui limite aussi la période de restauration.
    d:
      en: The restore period must be shorter than both the soft delete and the change feed retention periods.
      fr: La période de restauration doit être plus courte que les périodes de rétention de la suppression réversible et du flux de modification.
references:
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
