id: s3-files-protocol-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is planning classic Azure file shares (Microsoft.Storage resource provider) for Windows and Linux workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Tailspin Toys planifie des partages de fichiers Azure classiques (fournisseur de ressources Microsoft.Storage) pour des charges de travail Windows et Linux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A single Azure file share can be mounted by Windows clients over SMB and by Linux clients over NFS at the same time.
        fr: Un même partage de fichiers Azure peut être monté en même temps par des clients Windows en SMB et par des clients Linux en NFS.
    - id: s2
      text:
        en: A single storage account can contain both SMB file shares and NFS file shares.
        fr: Un même compte de stockage peut contenir à la fois des partages de fichiers SMB et des partages de fichiers NFS.
    - id: s3
      text:
        en: To move an existing HDD file share to the SSD media tier, you must create a new SSD file share and copy the data to it.
        fr: Pour faire passer un partage de fichiers HDD existant au niveau de média SSD, vous devez créer un nouveau partage SSD et y copier les données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: An Azure file share supports either SMB or NFS, never both on the same share, but SMB and NFS shares can coexist in the same storage account. The media tier of a share cannot be changed after creation, so moving from HDD to SSD means creating a new SSD share and copying the data.
    fr: Un partage de fichiers Azure prend en charge soit SMB, soit NFS, jamais les deux sur le même partage, mais des partages SMB et NFS peuvent coexister dans le même compte de stockage. Le niveau de média d'un partage ne peut pas être modifié après sa création ; passer du HDD au SSD impose donc de créer un nouveau partage SSD et d'y copier les données.
references:
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
