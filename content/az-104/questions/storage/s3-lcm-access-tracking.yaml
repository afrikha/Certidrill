id: s3-lcm-access-tracking
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stadatumdocs**. You plan to add a lifecycle management rule that moves block blobs to the Cold tier when they have not been read for 60 days.

    You need the rule to evaluate the date on which each blob was last read.

    What should you enable on stadatumdocs first?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stadatumdocs**. Vous prévoyez d'ajouter une règle de gestion du cycle de vie qui déplace les objets blob de blocs vers le niveau froid (Cold) lorsqu'ils n'ont pas été lus depuis 60 jours.

    Vous avez besoin que la règle évalue la date à laquelle chaque objet blob a été lu pour la dernière fois.

    Que devez-vous activer d'abord sur stadatumdocs ?
body:
  options:
    - { id: a, text: { en: Last access time tracking, fr: "Le suivi de l'heure d'accès" } }
    - { id: b, text: { en: The change feed, fr: Le flux de modification } }
    - { id: c, text: { en: Blob versioning, fr: Le contrôle de version des objets blob } }
    - { id: d, text: { en: Blob inventory, fr: "L'inventaire d'objets blob" } }
answer: { optionId: a }
explanation:
  correct:
    en: When access time tracking is enabled, the LastAccessTime property of a blob is updated when the blob is read or written, and the `daysAfterLastAccessTimeGreaterThan` condition uses it. Without tracking, the rule uses the date tracking was enabled instead of real access dates.
    fr: Lorsque le suivi de l'heure d'accès est activé, la propriété LastAccessTime d'un objet blob est mise à jour à chaque lecture ou écriture, et la condition `daysAfterLastAccessTimeGreaterThan` l'utilise. Sans suivi, la règle utilise la date d'activation du suivi au lieu des dates d'accès réelles.
  options:
    b:
      en: The change feed logs changes (create, modify, delete), not reads, and lifecycle rules don't use it.
      fr: Le flux de modification journalise les modifications (création, modification, suppression), pas les lectures, et les règles de cycle de vie ne l'utilisent pas.
    c:
      en: Versioning keeps previous versions of blobs; it does not record read times.
      fr: Le contrôle de version conserve les versions précédentes des objets blob ; il n'enregistre pas les heures de lecture.
    d:
      en: Blob inventory produces reports on blobs; lifecycle conditions don't rely on it.
      fr: L'inventaire d'objets blob produit des rapports sur les objets blob ; les conditions de cycle de vie ne s'appuient pas dessus.
references:
  - title: Azure Blob Storage lifecycle management policy structure
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
