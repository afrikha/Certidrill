id: cs3-relecloud-02
objective: "2.3.3"
type: yesno_statements
caseStudy: cs3-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You plan a lifecycle management rule for the **raw-uploads** container that moves each master to the Cold tier 14 days after it is created and to the Archive tier 120 days after it is created.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez une règle de gestion du cycle de vie pour le conteneur **raw-uploads** qui déplace chaque fichier maître vers le niveau froid (Cold) 14 jours après sa création, puis vers le niveau archive (Archive) 120 jours après sa création.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The move from the Cold tier to the Archive tier incurs an early deletion charge for the Cold tier."
        fr: "Le passage du niveau froid (Cold) au niveau archive (Archive) entraîne des frais de suppression anticipée pour le niveau froid (Cold)."
    - id: s2
      text:
        en: "You can set Archive as the default access tier of stmediaraw so that new masters are archived as soon as they are uploaded."
        fr: "Vous pouvez définir le niveau archive (Archive) comme niveau d'accès par défaut de stmediaraw afin que les nouveaux fichiers maîtres soient archivés dès leur dépôt."
    - id: s3
      text:
        en: "To re-encode a master that is in the Archive tier, you must first rehydrate it to an online tier or copy it to an online tier."
        fr: "Pour réencoder un fichier maître qui se trouve au niveau archive (Archive), vous devez d'abord le réhydrater vers un niveau en ligne ou le copier vers un niveau en ligne."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "The Cold tier has a 90-day minimum retention. A master stays in the Cold tier from day 14 to day 120, which is 106 days, so no early deletion charge applies. The default access tier of an account can only be Hot, Cool or Cold, never Archive. An archived blob is offline: it can't be read until it is rehydrated (or copied) to the Hot, Cool or Cold tier, which can take up to 15 hours."
    fr: "Le niveau froid (Cold) impose une rétention minimale de 90 jours. Un fichier maître reste au niveau froid (Cold) du jour 14 au jour 120, soit 106 jours : aucun frais de suppression anticipée ne s'applique. Le niveau d'accès par défaut d'un compte ne peut être que chaud (Hot), froid (Cool) ou froid (Cold), jamais archive (Archive). Un objet blob archivé est hors connexion : il ne peut pas être lu tant qu'il n'a pas été réhydraté (ou copié) vers le niveau chaud (Hot), froid (Cool) ou froid (Cold), ce qui peut prendre jusqu'à 15 heures."
references:
  - title: "Access tiers for blob data - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: "Blob rehydration from the archive tier"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
