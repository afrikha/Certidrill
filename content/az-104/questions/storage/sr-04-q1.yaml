id: sr-04-q1
objective: "2.1.1"
type: series_yesno
series: sr-04-storage-network
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You add a virtual network rule for Subnet1 and allow access only from selected networks.
  fr: |
    Vous ajoutez une règle de réseau virtuel pour Subnet1 et autorisez l'accès uniquement à partir des réseaux sélectionnés.
body:
  solution:
    en: |
      You enable a **service endpoint** for `Microsoft.Storage` on Subnet1. On stor1, you set public network access to **Enabled from selected virtual networks and IP addresses**, add a **virtual network rule** for Subnet1, and add no IP network rule.
    fr: |
      Vous activez un **point de terminaison de service** pour `Microsoft.Storage` sur Subnet1. Sur stor1, vous définissez l'accès réseau public sur **Enabled from selected virtual networks and IP addresses**, ajoutez une **règle de réseau virtuel** pour Subnet1 et n'ajoutez aucune règle de réseau IP.
answer: { value: true }
explanation:
  correct:
    en: |
      Once network rules are configured, only traffic from explicitly allowed sources can reach the public endpoint of stor1; everything else is denied. The virtual network rule allows Subnet1, whose traffic reaches stor1 through the service endpoint, and the virtual machines keep using `stor1.blob.core.windows.net`. Requests from the internet and from any other network are rejected, so the goal is met.
    fr: |
      Dès que des règles réseau sont configurées, seul le trafic provenant de sources explicitement autorisées peut atteindre le point de terminaison public de stor1 ; tout le reste est refusé. La règle de réseau virtuel autorise Subnet1, dont le trafic atteint stor1 via le point de terminaison de service, et les machines virtuelles continuent d'utiliser `stor1.blob.core.windows.net`. Les requêtes provenant d'Internet et de tout autre réseau sont rejetées : l'objectif est atteint.
references:
  - title: "Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
