id: s3-files-nfs-account-type
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your company, Litware, runs a Linux application on Azure virtual machines in a virtual network named **VNet1**. The application requires a POSIX-compliant shared file system that is accessed over the NFS 4.1 protocol.

    You plan to create a classic Azure file share (Microsoft.Storage resource provider) in a new storage account for the application.

    Which type of storage account should you create?
  fr: |
    Votre société, Litware, exécute une application Linux sur des machines virtuelles Azure situées dans un réseau virtuel nommé **VNet1**. L'application a besoin d'un système de fichiers partagé conforme POSIX, accessible avec le protocole NFS 4.1.

    Vous prévoyez de créer un partage de fichiers Azure classique (fournisseur de ressources Microsoft.Storage) dans un nouveau compte de stockage pour cette application.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "Premium performance with the FileStorage account kind (SSD file shares)", fr: "Performances Premium avec le type de compte FileStorage (partages de fichiers SSD)" }
    - id: b
      text: { en: "Standard general-purpose v2 (HDD file shares, pay-as-you-go)", fr: "Usage général v2 standard (partages de fichiers HDD, paiement à l'utilisation)" }
    - id: c
      text: { en: "Premium performance with the BlockBlobStorage account kind", fr: "Performances Premium avec le type de compte BlockBlobStorage" }
    - id: d
      text: { en: "Standard general-purpose v2 with the hierarchical namespace enabled", fr: "Usage général v2 standard avec l'espace de noms hiérarchique activé" }
answer: { optionId: a }
explanation:
  correct:
    en: NFS Azure file shares are available only on the SSD (premium) media tier, which for classic file shares means a premium storage account of the FileStorage kind. An Azure file share uses either SMB or NFS, and the NFS protocol can be chosen only when the share is created in that account type.
    fr: Les partages de fichiers Azure NFS ne sont disponibles que sur le niveau de média SSD (Premium) ; pour un partage classique, il faut donc un compte de stockage Premium de type FileStorage. Un partage utilise soit SMB, soit NFS, et le protocole NFS ne peut être choisi qu'à la création du partage dans ce type de compte.
  options:
    b:
      en: HDD (standard) file shares support only SMB; NFS file shares require SSD.
      fr: Les partages de fichiers HDD (standard) ne prennent en charge que SMB ; les partages NFS exigent le SSD.
    c:
      en: A premium block blob account stores blobs, not Azure file shares.
      fr: Un compte d'objets blob de blocs Premium stocke des objets blob, pas des partages de fichiers Azure.
    d:
      en: The hierarchical namespace enables Data Lake Storage (and NFS 3.0 for blobs), not NFS 4.1 Azure file shares.
      fr: L'espace de noms hiérarchique active Data Lake Storage (et NFS 3.0 pour les objets blob), pas les partages de fichiers Azure NFS 4.1.
references:
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
  - title: az storage share-rm
    url: https://learn.microsoft.com/en-us/cli/azure/storage/share-rm
