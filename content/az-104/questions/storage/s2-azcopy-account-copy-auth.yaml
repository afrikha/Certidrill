id: s2-azcopy-account-copy-auth
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have two storage accounts in the same Microsoft Entra tenant: **stlegacy** and **stmodern**. You need to copy the container **archive** from stlegacy to stmodern by running `azcopy copy` with the `--recursive` flag from a virtual machine that has network access to both accounts.

    Which two authorization methods allow the copy to succeed? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux comptes de stockage dans le même locataire Microsoft Entra : **stlegacy** et **stmodern**. Vous devez copier le conteneur **archive** de stlegacy vers stmodern en exécutant `azcopy copy` avec l'indicateur `--recursive` depuis une machine virtuelle qui dispose d'un accès réseau aux deux comptes.

    Quelles sont les deux méthodes d'autorisation qui permettent à la copie de réussir ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Run `azcopy login` as a user who has Storage Blob Data Reader on stlegacy and Storage Blob Data Contributor on stmodern.", fr: "Exécuter `azcopy login` avec un utilisateur qui dispose de Storage Blob Data Reader sur stlegacy et de Storage Blob Data Contributor sur stmodern." }
    - id: b
      text: { en: "Append a SAS token with read and list permissions to the source URL and a SAS token with write permission to the destination URL.", fr: "Ajouter à l'URL source un jeton SAS avec les autorisations de lecture et de liste, et à l'URL de destination un jeton SAS avec l'autorisation d'écriture." }
    - id: c
      text: { en: "Run `azcopy login` as a user who has the Reader role on both storage accounts.", fr: "Exécuter `azcopy login` avec un utilisateur qui dispose du rôle Reader sur les deux comptes de stockage." }
    - id: d
      text: { en: "Append a SAS token with read and list permissions to the source URL only.", fr: "Ajouter un jeton SAS avec les autorisations de lecture et de liste à l'URL source uniquement." }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: AzCopy can authorize a transfer with Microsoft Entra ID or with SAS tokens appended to each URL. With Microsoft Entra ID, the identity needs a data role that allows reading the source and writing the destination, and both accounts must be in the same tenant, as they are here. With SAS, each URL that needs authorization carries a token with the required permissions.
    fr: AzCopy peut autoriser un transfert avec Microsoft Entra ID ou avec des jetons SAS ajoutés à chaque URL. Avec Microsoft Entra ID, l'identité a besoin d'un rôle de données qui permet de lire la source et d'écrire dans la destination, et les deux comptes doivent être dans le même locataire, ce qui est le cas ici. Avec des SAS, chaque URL qui exige une autorisation porte un jeton disposant des autorisations nécessaires.
  options:
    c:
      en: Reader is a management-plane role; it does not allow reading or writing blob data with Microsoft Entra authorization.
      fr: Reader est un rôle du plan de gestion ; il ne permet ni de lire ni d'écrire des données blob avec l'autorisation Microsoft Entra.
    d:
      en: Without a destination SAS or a Microsoft Entra sign-in with a write role, AzCopy has no authorization to write to stmodern.
      fr: Sans SAS de destination ni connexion Microsoft Entra avec un rôle d'écriture, AzCopy n'a aucune autorisation pour écrire dans stmodern.
references:
  - title: Copy blobs between Azure storage accounts with AzCopy v10
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-copy
  - title: Authorize access for AzCopy with a user identity
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-authorize-user-identity
