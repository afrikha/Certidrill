id: s1-files-default-share-permission
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A storage account named **stlitwarefs** contains several SMB file shares and uses on-premises AD DS authentication. You are considering configuring a default share-level permission on the account instead of assigning share-level roles to specific Microsoft Entra users and groups.

    In which two situations is a default share-level permission the appropriate choice? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **stlitwarefs** contient plusieurs partages de fichiers SMB et utilise l'authentification AD DS locale. Vous envisagez de configurer une autorisation par défaut au niveau du partage sur le compte au lieu d'attribuer des rôles au niveau du partage à des utilisateurs et groupes Microsoft Entra précis.

    Dans quelles deux situations une autorisation par défaut au niveau du partage est-elle le bon choix ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: The on-premises AD DS domain cannot be synced to Microsoft Entra ID.
        fr: Le domaine AD DS local ne peut pas être synchronisé avec Microsoft Entra ID.
    - id: b
      text:
        en: Computer accounts and group Managed Service Accounts must access the shares.
        fr: Des comptes d'ordinateur et des comptes de service administrés de groupe doivent accéder aux partages.
    - id: c
      text:
        en: Each file share must have a different share-level role.
        fr: Chaque partage de fichiers doit disposer d'un rôle différent au niveau du partage.
    - id: d
      text:
        en: Only the members of one AD DS group must be able to reach the shares.
        fr: Seuls les membres d'un groupe AD DS doivent pouvoir accéder aux partages.
    - id: e
      text:
        en: Users must complete multifactor authentication before they mount a share.
        fr: Les utilisateurs doivent effectuer une authentification multifacteur avant de monter un partage.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: A default share-level permission applies to all authenticated identities, so it removes the need to sync identities to Microsoft Entra ID. It is also the only way to give share access to identities that have no Microsoft Entra identity, such as computer accounts, sMSAs and gMSAs. Granular control is then done with Windows ACLs.
    fr: Une autorisation par défaut au niveau du partage s'applique à toutes les identités authentifiées ; elle supprime donc la nécessité de synchroniser les identités avec Microsoft Entra ID. C'est aussi le seul moyen de donner accès au partage à des identités sans identité Microsoft Entra, comme les comptes d'ordinateur, les sMSA et les gMSA. Le contrôle fin se fait ensuite avec les ACL Windows.
  options:
    c:
      en: The default share-level permission is set on the storage account and applies to all its file shares.
      fr: L'autorisation par défaut au niveau du partage est définie sur le compte de stockage et s'applique à tous ses partages de fichiers.
    d:
      en: The default permission grants the same access to every authenticated identity, not to a single group.
      fr: L'autorisation par défaut accorde le même accès à toutes les identités authentifiées, pas à un seul groupe.
    e:
      en: Share-level permissions do not enforce multifactor authentication.
      fr: Les autorisations au niveau du partage n'imposent pas d'authentification multifacteur.
references:
  - title: Assign share-level permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
