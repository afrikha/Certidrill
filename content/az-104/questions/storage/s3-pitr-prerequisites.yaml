id: s3-pitr-prerequisites
objective: "2.3.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a standard general-purpose v2 storage account named **stnorthwindapp** that stores block blobs. The hierarchical namespace is disabled.

    You plan to enable point-in-time restore for the account.

    Which three features must be enabled before you can enable point-in-time restore? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 standard nommé **stnorthwindapp** qui stocke des objets blob de blocs. L'espace de noms hiérarchique est désactivé.

    Vous prévoyez d'activer la restauration à un instant dans le passé pour le compte.

    Quelles sont les trois fonctionnalités qui doivent être activées avant de pouvoir activer la restauration à un instant dans le passé ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Blob soft delete", fr: "Suppression réversible des objets blob" } }
    - { id: b, text: { en: "Blob versioning", fr: "Contrôle de version des objets blob" } }
    - { id: c, text: { en: "Change feed", fr: "Flux de modification" } }
    - { id: d, text: { en: "Container soft delete", fr: "Suppression réversible des conteneurs" } }
    - { id: e, text: { en: Object replication, fr: "Réplication d'objets" } }
    - { id: f, text: { en: Last access time tracking, fr: "Suivi de l'heure d'accès" } }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: Point-in-time restore builds on blob soft delete, blob versioning and the change feed, which must all be enabled first. The restore uses the change feed to find the changes made since the restore point and the versions and soft-deleted data to revert them.
    fr: La restauration à un instant dans le passé s'appuie sur la suppression réversible des objets blob, le contrôle de version des objets blob et le flux de modification, qui doivent tous être activés au préalable. La restauration utilise le flux de modification pour trouver les modifications effectuées depuis le point de restauration, et les versions et données supprimées de manière réversible pour les annuler.
  options:
    d:
      en: Container soft delete is recommended to protect against container deletion, which point-in-time restore cannot undo, but it is not a prerequisite.
      fr: La suppression réversible des conteneurs est recommandée contre la suppression d'un conteneur, que la restauration à un instant dans le passé ne peut pas annuler, mais ce n'est pas un prérequis.
    e:
      en: Object replication copies blobs to another account; it is not required.
      fr: La réplication d'objets copie des objets blob vers un autre compte ; elle n'est pas requise.
    f:
      en: Access time tracking is used by lifecycle management, not by point-in-time restore.
      fr: Le suivi de l'heure d'accès est utilisé par la gestion du cycle de vie, pas par la restauration à un instant dans le passé.
references:
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
