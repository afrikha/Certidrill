id: s3-blob-anon-blob-level
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stwingtipweb** that has **Allow Blob anonymous access** enabled. The account contains a container named **images**.

    You need to ensure that anonymous clients can download a blob in **images** when they know its URL. Anonymous clients must not be able to list the blobs in the container.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stwingtipweb** pour lequel **Autoriser l'accès anonyme aux objets blob** est activé. Le compte contient un conteneur nommé **images**.

    Vous devez vous assurer que des clients anonymes peuvent télécharger un objet blob de **images** lorsqu'ils connaissent son URL. Les clients anonymes ne doivent pas pouvoir lister les objets blob du conteneur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Set the anonymous access level of the images container to Blob., fr: "Définir le niveau d'accès anonyme du conteneur images sur Blob." } }
    - { id: b, text: { en: Set the anonymous access level of the images container to Container., fr: "Définir le niveau d'accès anonyme du conteneur images sur Conteneur." } }
    - { id: c, text: { en: Keep the images container Private and create a stored access policy on it., fr: "Laisser le conteneur images en Privé et y créer une stratégie d'accès stockée." } }
    - { id: d, text: { en: Set the anonymous access level of each blob in the images container to Blob., fr: "Définir le niveau d'accès anonyme de chaque objet blob du conteneur images sur Blob." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Blob access level allows anonymous read requests for the blobs in the container, but container data is not available anonymously, so anonymous clients cannot enumerate the blobs. This works because anonymous access is already allowed on the storage account.
    fr: Le niveau d'accès Blob autorise les demandes de lecture anonymes sur les objets blob du conteneur, mais les données du conteneur ne sont pas disponibles anonymement ; les clients anonymes ne peuvent donc pas énumérer les objets blob. Cela fonctionne parce que l'accès anonyme est déjà autorisé sur le compte de stockage.
  options:
    b:
      en: The Container level also lets anonymous clients list the blobs in the container.
      fr: Le niveau Conteneur permet aussi aux clients anonymes de lister les objets blob du conteneur.
    c:
      en: A stored access policy constrains shared access signatures; clients would still need a SAS token, so access is not anonymous.
      fr: Une stratégie d'accès stockée encadre des signatures d'accès partagé ; les clients auraient toujours besoin d'un jeton SAS, l'accès ne serait donc pas anonyme.
    d:
      en: The anonymous access level can be set only on a container, not on an individual blob.
      fr: Le niveau d'accès anonyme se définit uniquement sur un conteneur, pas sur un objet blob individuel.
references:
  - title: Configure anonymous read access for containers and blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
