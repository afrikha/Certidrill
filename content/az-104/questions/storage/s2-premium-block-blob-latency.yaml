id: s2-premium-block-blob-latency
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is deploying a telemetry ingestion service that writes millions of small block blobs per hour. The service requires consistently low storage latency and a high transaction rate. It does not use Azure Files, queues or tables.

    You need to create a storage account for the service.

    Which type of storage account should you create?
  fr: |
    Tailspin Toys déploie un service d'ingestion de télémétrie qui écrit des millions de petits objets blob de blocs par heure. Le service exige une latence de stockage faible et constante ainsi qu'un taux de transactions élevé. Il n'utilise ni Azure Files, ni files d'attente, ni tables.

    Vous devez créer un compte de stockage pour ce service.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" }
    - id: b
      text: { en: "Standard general-purpose v2 with the Hot access tier", fr: "Usage général v2 standard avec le niveau d'accès chaud (Hot)" }
    - id: c
      text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" }
    - id: d
      text: { en: "Premium file shares", fr: "Partages de fichiers Premium" }
answer: { optionId: a }
explanation:
  correct:
    en: The premium block blobs account type (kind `BlockBlobStorage`) stores block blobs and append blobs on SSDs. Microsoft recommends it for workloads with high transaction rates, small objects or a need for consistently low storage latency.
    fr: Le type de compte d'objets blob de blocs Premium (type `BlockBlobStorage`) stocke les objets blob de blocs et d'ajout sur des SSD. Microsoft le recommande pour les charges de travail à taux de transactions élevé, à petits objets ou exigeant une latence de stockage faible et constante.
  options:
    b:
      en: A standard general-purpose v2 account uses HDD-based standard performance; the access tier changes storage and access costs, not latency.
      fr: Un compte usage général v2 standard utilise les performances standard sur disques HDD ; le niveau d'accès influe sur les coûts de stockage et d'accès, pas sur la latence.
    c:
      en: Premium page blob accounts store only page blobs (for example VHDs), not block blobs.
      fr: Les comptes d'objets blob de pages Premium ne stockent que des objets blob de pages (par exemple des VHD), pas des objets blob de blocs.
    d:
      en: Premium file share accounts store only Azure Files shares.
      fr: Les comptes de partages de fichiers Premium ne stockent que des partages Azure Files.
references:
  - title: Storage account overview
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
  - title: Premium block blob storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-block-blob-premium
