id: cs1-contoso-03
objective: "2.2.2"
type: single
caseStudy: cs1-contoso
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirements for the receipts stored in stcontosoreceipts. The solution must minimize cost.

    Which redundancy option should you configure for stcontosoreceipts?
  fr: |
    Vous devez satisfaire les exigences concernant les tickets de caisse stockés dans stcontosoreceipts. La solution doit réduire les coûts au minimum.

    Quelle option de redondance devez-vous configurer pour stcontosoreceipts ?
body:
  options:
    - { id: a, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
    - { id: b, text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" } }
    - { id: c, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
    - { id: d, text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      RA-GZRS replicates the data synchronously across three availability zones in East US, so reads and writes continue if a zone fails, and it copies the data to the paired secondary region with read access enabled. Auditors can therefore read the secondary endpoint at any time without a failover. It is the only option that meets both requirements.
    fr: |
      RA-GZRS réplique les données de manière synchrone sur trois zones de disponibilité dans East US, ce qui permet de continuer les lectures et écritures si une zone tombe en panne, et copie les données vers la région secondaire jumelée avec l'accès en lecture activé. Les auditeurs peuvent donc lire le point de terminaison secondaire à tout moment sans basculement. C'est la seule option qui satisfait les deux exigences.
  options:
    a: { en: "ZRS protects against a zone failure but keeps no copy in a secondary region.", fr: "ZRS protège contre la défaillance d'une zone mais ne conserve aucune copie dans une région secondaire." }
    b: { en: "RA-GRS uses LRS in the primary region, so a zone failure can make the data unavailable in East US.", fr: "RA-GRS utilise LRS dans la région primaire ; une défaillance de zone peut donc rendre les données indisponibles dans East US." }
    c: { en: "GZRS does not allow reads from the secondary region until a failover occurs.", fr: "GZRS ne permet pas de lire depuis la région secondaire tant qu'aucun basculement n'a eu lieu." }
references:
  - title: Data redundancy - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
