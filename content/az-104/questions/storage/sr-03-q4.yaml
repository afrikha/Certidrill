id: sr-03-q4
objective: "2.2.2"
type: series_yesno
series: sr-03-read-secondary
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You configure stor1 to use read-access geo-zone-redundant storage (RA-GZRS).
  fr: |
    Vous configurez stor1 pour utiliser le stockage géoredondant interzone avec accès en lecture (RA-GZRS).
body:
  solution:
    en: |
      You create stor1 with **read-access geo-zone-redundant storage (RA-GZRS)**, and you configure App1 to read from the secondary endpoint `stor1-secondary.blob.core.windows.net` when the primary endpoint is unavailable.
    fr: |
      Vous créez stor1 avec le **stockage géoredondant interzone avec accès en lecture (RA-GZRS)**, et vous configurez App1 pour lire à partir du point de terminaison secondaire `stor1-secondary.blob.core.windows.net` lorsque le point de terminaison principal est indisponible.
answer: { value: true }
explanation:
  correct:
    en: |
      RA-GZRS combines zone-redundant storage in East US with geo-replication and permanent read access to the secondary region. If East US becomes unavailable, App1 keeps reading the blobs from the secondary endpoint without any failover. The goal sets no cost constraint, so this option also meets it.
    fr: |
      RA-GZRS combine le stockage redondant interzone dans East US avec la géoréplication et un accès permanent en lecture à la région secondaire. Si East US devient indisponible, App1 continue de lire les objets blob à partir du point de terminaison secondaire sans aucun basculement. L'objectif ne fixe aucune contrainte de coût : cette option l'atteint également.
references:
  - title: "Data redundancy - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
