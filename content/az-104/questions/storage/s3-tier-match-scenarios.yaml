id: s3-tier-match-scenarios
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores four data sets as block blobs in a general-purpose v2 storage account that uses LRS.

    You need to assign each data set to the access tier that minimizes its total cost.

    Which tier should you use for each data set? To answer, drag the appropriate tiers to the correct data sets. Each tier may be used once or not at all.
  fr: |
    Proseware stocke quatre jeux de données sous forme d'objets blob de blocs dans un compte de stockage usage général v2 qui utilise LRS.

    Vous devez attribuer à chaque jeu de données le niveau d'accès qui réduit au minimum son coût total.

    Quel niveau devez-vous utiliser pour chaque jeu de données ? Pour répondre, faites glisser les niveaux appropriés vers les jeux de données correspondants. Chaque niveau peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: hot, text: { en: Hot, fr: "Niveau chaud (Hot)" } }
    - { id: cool, text: { en: Cool, fr: "Niveau froid (Cool)" } }
    - { id: cold, text: { en: Cold, fr: "Niveau froid (Cold)" } }
    - { id: archive, text: { en: Archive, fr: "Niveau archive (Archive)" } }
  targets:
    - id: web
      text: { en: "Product images read thousands of times per day by a website", fr: "Images de produits lues des milliers de fois par jour par un site web" }
    - id: backup
      text: { en: "Daily backups deleted after 30 days, rarely restored, that must be readable within milliseconds", fr: "Sauvegardes quotidiennes supprimées au bout de 30 jours, rarement restaurées, qui doivent être lisibles en quelques millisecondes" }
    - id: projects
      text: { en: "Closed project files kept for at least 120 days, almost never read, that must be readable immediately", fr: "Fichiers de projets clos conservés au moins 120 jours, presque jamais lus, qui doivent être lisibles immédiatement" }
    - id: legal
      text: { en: "Legal records kept for 7 years and read once a year, with a retrieval delay of hours acceptable", fr: "Documents juridiques conservés 7 ans et lus une fois par an, avec un délai de récupération de plusieurs heures acceptable" }
answer:
  mapping: { web: hot, backup: cool, projects: cold, legal: archive }
explanation:
  correct:
    en: Hot has the highest storage cost but the lowest access cost, ideal for data in active use. Cool (30-day minimum) and Cold (90-day minimum) are online tiers with millisecond latency for infrequently and rarely accessed data; data deleted after 30 days fits Cool, while data kept over 90 days fits Cold. Archive (180-day minimum) has the lowest storage cost but is offline, with rehydration taking hours.
    fr: Le niveau chaud (Hot) a le coût de stockage le plus élevé mais le coût d'accès le plus bas, idéal pour les données utilisées activement. Les niveaux froid (Cool, minimum 30 jours) et froid (Cold, minimum 90 jours) sont des niveaux en ligne à latence de quelques millisecondes pour les données peu ou rarement consultées ; des données supprimées au bout de 30 jours conviennent au niveau froid (Cool), et des données conservées plus de 90 jours au niveau froid (Cold). Le niveau archive (Archive, minimum 180 jours) a le coût de stockage le plus bas mais il est hors connexion, et la réhydratation prend des heures.
  options:
    backup:
      en: Cold has higher access costs, and deleting the backups after 30 days would incur an early deletion charge for the 60 days remaining before the 90-day minimum.
      fr: Le niveau froid (Cold) a des coûts d'accès plus élevés, et supprimer les sauvegardes au bout de 30 jours entraînerait des frais de suppression anticipée pour les 60 jours restant avant le minimum de 90 jours.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
