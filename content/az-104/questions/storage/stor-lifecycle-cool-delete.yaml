id: stor-lifecycle-cool-delete
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Storage account named **stcontoso01** (general-purpose v2) that stores application logs as block blobs.

    You need to automatically move blobs that have not been modified for 30 days to the Cool tier, and delete blobs that have not been modified for 365 days. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Vous disposez d'un compte Azure Storage nommé **stcontoso01** (usage général v2) qui stocke des journaux d'application sous forme d'objets blob de blocs.

    Vous devez déplacer automatiquement vers le niveau froid (Cool) les blobs non modifiés depuis 30 jours, et supprimer les blobs non modifiés depuis 365 jours. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: A lifecycle management policy, fr: Une stratégie de gestion du cycle de vie }
    - id: b
      text: { en: An Azure Automation runbook that runs daily, fr: Un runbook Azure Automation exécuté chaque jour }
    - id: c
      text: { en: Blob versioning, fr: Le contrôle de version des blobs }
    - id: d
      text: { en: A stored access policy on the container, fr: Une stratégie d'accès stockée sur le conteneur }
answer: { optionId: a }
explanation:
  correct:
    en: A lifecycle management policy defines rules that move blobs to a cooler tier or delete them based on their age (here `daysAfterModificationGreaterThan`). Azure Storage runs the rules for you, with no code to maintain.
    fr: Une stratégie de gestion du cycle de vie définit des règles qui déplacent les blobs vers un niveau plus froid ou les suppriment selon leur âge (ici `daysAfterModificationGreaterThan`). Azure Storage exécute les règles pour vous, sans code à maintenir.
  options:
    b:
      en: A runbook could do it, but it is custom code to write, schedule and maintain, which does not minimize administrative effort.
      fr: Un runbook pourrait le faire, mais c'est du code à écrire, planifier et maintenir, ce qui ne réduit pas l'effort d'administration.
    c:
      en: Versioning keeps previous versions of blobs; it neither changes tiers nor deletes old data.
      fr: Le contrôle de version conserve les versions précédentes des blobs ; il ne change pas de niveau et ne supprime pas les anciennes données.
    d:
      en: A stored access policy controls shared access signatures; it has nothing to do with data tiering.
      fr: Une stratégie d'accès stockée contrôle les signatures d'accès partagé ; elle n'a aucun rapport avec les niveaux d'accès.
references:
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
