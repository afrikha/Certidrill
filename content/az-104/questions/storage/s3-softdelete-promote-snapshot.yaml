id: s3-softdelete-promote-snapshot
objective: "2.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stcontosobi** that does not have a hierarchical namespace. Blob soft delete is enabled with a retention period of 7 days. Blob versioning is disabled.

    This morning, an application overwrote a block blob named **sales.csv** with corrupted data. The blob was not deleted.

    You need to restore the content of **sales.csv** as it was before the overwrite.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stcontosobi** sans espace de noms hiérarchique. La suppression réversible des objets blob est activée avec une période de rétention de 7 jours. Le contrôle de version des objets blob est désactivé.

    Ce matin, une application a remplacé un objet blob de blocs nommé **sales.csv** par des données corrompues. L'objet blob n'a pas été supprimé.

    Vous devez restaurer le contenu de **sales.csv** tel qu'il était avant le remplacement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: list, text: { en: List the blobs of the container including soft-deleted objects to locate the soft-deleted snapshot of sales.csv., fr: "Lister les objets blob du conteneur, objets supprimés de manière réversible compris, pour trouver l'instantané supprimé de manière réversible de sales.csv." } }
    - { id: undelete, text: { en: Call Undelete Blob on sales.csv to restore its soft-deleted snapshots., fr: "Appeler Undelete Blob sur sales.csv pour restaurer ses instantanés supprimés de manière réversible." } }
    - { id: copy, text: { en: Copy the restored snapshot over the base blob sales.csv., fr: "Copier l'instantané restauré sur l'objet blob de base sales.csv." } }
    - { id: versioning, text: { en: Enable blob versioning and promote the previous version of sales.csv., fr: "Activer le contrôle de version des objets blob et promouvoir la version précédente de sales.csv." } }
    - { id: pitr, text: { en: Run a point-in-time restore of the container to a point before the overwrite., fr: "Exécuter une restauration à un instant dans le passé du conteneur à un point antérieur au remplacement." } }
    - { id: container, text: { en: Restore the container by using container soft delete., fr: "Restaurer le conteneur avec la suppression réversible des conteneurs." } }
answer:
  sequence: [list, undelete, copy]
explanation:
  correct:
    en: Without versioning, overwriting a blob while soft delete is enabled automatically creates a soft-deleted snapshot of its previous state. Soft-deleted snapshots are visible only when you list deleted objects. Undelete Blob restores them, and copying the snapshot over the base blob promotes it to the current content.
    fr: Sans contrôle de version, le remplacement d'un objet blob lorsque la suppression réversible est activée crée automatiquement un instantané supprimé de manière réversible de son état précédent. Ces instantanés ne sont visibles que si vous listez les objets supprimés. Undelete Blob les restaure, et la copie de l'instantané sur l'objet blob de base le promeut comme contenu actuel.
  options:
    versioning:
      en: Versioning protects only writes made after it is enabled; no previous version exists for this overwrite.
      fr: Le contrôle de version ne protège que les écritures effectuées après son activation ; aucune version précédente n'existe pour ce remplacement.
    pitr:
      en: Point-in-time restore requires versioning and change feed, and it must have been enabled before the overwrite.
      fr: La restauration à un instant dans le passé exige le contrôle de version et le flux de modification, et elle aurait dû être activée avant le remplacement.
    container:
      en: The container was not deleted.
      fr: Le conteneur n'a pas été supprimé.
references:
  - title: Soft Delete for Blobs to Recover Data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview
