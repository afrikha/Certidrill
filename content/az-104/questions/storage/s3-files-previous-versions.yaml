id: s3-files-previous-versions
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an SMB Azure file share named **finance** that is mapped as drive F: on the Windows computers of the finance team. A share snapshot of **finance** is taken every night. Soft delete for file shares is enabled.

    A user overwrote the file F:\Budget\2026.xlsx by mistake this morning. The user has no access to the Azure portal.

    You need the user to restore the version of the file from last night by themselves.

    What should the user do?
  fr: |
    Fabrikam dispose d'un partage de fichiers Azure SMB nommé **finance**, mappé comme lecteur F: sur les ordinateurs Windows de l'équipe financière. Un instantané de partage de **finance** est pris chaque nuit. La suppression réversible des partages de fichiers est activée.

    Ce matin, un utilisateur a remplacé par erreur le fichier F:\Budget\2026.xlsx. L'utilisateur n'a pas accès au portail Azure.

    Vous devez permettre à l'utilisateur de restaurer lui-même la version du fichier de la nuit dernière.

    Que doit faire l'utilisateur ?
body:
  options:
    - { id: a, text: { en: "In File Explorer, open the properties of the file and restore it from the **Previous Versions** tab.", fr: "Dans l'Explorateur de fichiers, ouvrir les propriétés du fichier et le restaurer depuis l'onglet **Versions précédentes**." } }
    - { id: b, text: { en: Undelete the finance share., fr: "Annuler la suppression du partage finance." } }
    - { id: c, text: { en: Open the Recycle Bin of the computer and restore the file., fr: "Ouvrir la Corbeille de l'ordinateur et restaurer le fichier." } }
    - { id: d, text: { en: Promote the previous version of the file by copying its version ID over the current file., fr: "Promouvoir la version précédente du fichier en copiant son ID de version sur le fichier actuel." } }
answer: { optionId: a }
explanation:
  correct:
    en: Share snapshots of SMB Azure file shares are exposed to Windows clients through the Previous Versions tab, like Volume Shadow Copy snapshots on a Windows file server. The user can open or restore the file from the snapshot taken last night.
    fr: Les instantanés de partage des partages de fichiers Azure SMB sont exposés aux clients Windows dans l'onglet Versions précédentes, comme les clichés instantanés de volume d'un serveur de fichiers Windows. L'utilisateur peut ouvrir ou restaurer le fichier à partir de l'instantané pris la nuit dernière.
  options:
    b:
      en: The share was not deleted; soft delete for file shares works only at the share level.
      fr: Le partage n'a pas été supprimé ; la suppression réversible des partages fonctionne uniquement au niveau du partage.
    c:
      en: Files overwritten on a mapped network share do not go to the local Recycle Bin.
      fr: Les fichiers remplacés sur un partage réseau mappé ne passent pas par la Corbeille locale.
    d:
      en: Version IDs belong to blob versioning in Blob Storage, not to Azure Files.
      fr: Les ID de version appartiennent au contrôle de version des objets blob de Stockage Blob, pas à Azure Files.
references:
  - title: Use Azure Files Share Snapshots
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
