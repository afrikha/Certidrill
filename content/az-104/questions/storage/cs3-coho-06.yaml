id: cs3-coho-06
objective: "2.2.5"
type: dropdown
caseStudy: cs3-coho
difficulty: 2
status: draft
stem:
  en: |
    You need to create the nightly upload command on SRV-HARVEST to meet the operations requirement.

    How should you complete the command? To answer, select the appropriate options in the answer area.
  fr: |
    Vous devez créer la commande de chargement nocturne sur SRV-HARVEST pour satisfaire l'exigence d'exploitation.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    azcopy [[cmd]] 'D:\harvest\2026' 'https://stcohoharvest.blob.core.windows.net/harvest?<SAS-token>' [[flag]]
  slots:
    - id: cmd
      options:
        - { id: sync, text: sync }
        - { id: copy, text: copy }
        - { id: make, text: make }
        - { id: remove, text: remove }
    - id: flag
      options:
        - { id: del, text: "--delete-destination=true" }
        - { id: norec, text: "--recursive=false" }
        - { id: noover, text: "--overwrite=false" }
        - { id: dry, text: "--dry-run" }
answer:
  values: { cmd: sync, flag: del }
explanation:
  correct:
    en: "azcopy sync compares the source and the destination by last modified time and transfers only new or changed files. By default, sync doesn't delete anything at the destination; --delete-destination=true removes from the container the files that no longer exist in the local folder."
    fr: "azcopy sync compare la source et la destination selon la date de dernière modification et ne transfère que les fichiers nouveaux ou modifiés. Par défaut, sync ne supprime rien à la destination ; --delete-destination=true supprime du conteneur les fichiers qui n'existent plus dans le dossier local."
  options:
    cmd: { en: "azcopy copy can skip existing files but never deletes files from the destination; make creates a container and remove deletes data.", fr: "azcopy copy peut ignorer les fichiers existants mais ne supprime jamais de fichiers à la destination ; make crée un conteneur et remove supprime des données." }
    flag: { en: "--dry-run only lists what would be transferred, and --recursive=false would skip the subfolders.", fr: "--dry-run liste seulement ce qui serait transféré, et --recursive=false ignorerait les sous-dossiers." }
references:
  - title: "Synchronize with Azure Blob storage by using AzCopy v10"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-synchronize
