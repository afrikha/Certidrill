id: s3-files-paygo-migration-tier
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a standard general-purpose v2 storage account named **stfabrikamhr** that uses the pay-as-you-go billing model for HDD file shares.

    You plan to create an SMB file share named **hrarchive** and migrate 6 TiB of files from an on-premises file server to it by using Robocopy. After the migration, you will measure the real usage for a few weeks before you decide on the long-term configuration.

    You need to choose the access tier for the share during the migration. The solution must minimize costs.

    Which access tier should you select?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 standard nommé **stfabrikamhr** qui utilise le modèle de facturation avec paiement à l'utilisation pour les partages de fichiers HDD.

    Vous prévoyez de créer un partage de fichiers SMB nommé **hrarchive** et d'y migrer 6 Tio de fichiers depuis un serveur de fichiers local avec Robocopy. Après la migration, vous mesurerez l'utilisation réelle pendant quelques semaines avant de choisir la configuration à long terme.

    Vous devez choisir le niveau d'accès du partage pendant la migration. La solution doit réduire les coûts au minimum.

    Quel niveau d'accès devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: Transaction optimized, fr: "Optimisé pour les transactions (Transaction optimized)" } }
    - { id: b, text: { en: Hot, fr: "Chaud (Hot)" } }
    - { id: c, text: { en: Cool, fr: "Froid (Cool)" } }
    - { id: d, text: { en: Premium, fr: "Premium" } }
answer: { optionId: a }
explanation:
  correct:
    en: A migration generates a very large number of write transactions. The transaction optimized tier has the lowest transaction prices, which is why Microsoft recommends creating pay-as-you-go shares in this tier for the migration and choosing the final tier only after observing normal usage.
    fr: Une migration génère un très grand nombre de transactions d'écriture. Le niveau optimisé pour les transactions offre les prix de transaction les plus bas ; c'est pourquoi Microsoft recommande de créer les partages avec paiement à l'utilisation dans ce niveau pendant la migration et de choisir le niveau définitif après avoir observé l'utilisation normale.
  options:
    b:
      en: Hot has a lower at-rest storage price but higher transaction prices than transaction optimized, so the migration costs more.
      fr: Le niveau chaud (Hot) a un prix de stockage plus bas mais des prix de transaction plus élevés que le niveau optimisé pour les transactions ; la migration coûte donc plus cher.
    c:
      en: Cool has the highest transaction prices; the transactions of a migration would outweigh the storage savings.
      fr: Le niveau froid (Cool) a les prix de transaction les plus élevés ; les transactions de la migration annuleraient l'économie de stockage.
    d:
      en: Premium applies to SSD shares in a FileStorage account, not to a pay-as-you-go general-purpose v2 account.
      fr: Premium s'applique aux partages SSD d'un compte FileStorage, pas à un compte usage général v2 avec paiement à l'utilisation.
references:
  - title: Understand Azure Files billing
    url: https://learn.microsoft.com/en-us/azure/storage/files/understanding-billing
