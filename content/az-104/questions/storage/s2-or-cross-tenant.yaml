id: s2-or-cross-tenant
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso acquired Fabrikam. Contoso and Fabrikam use different Microsoft Entra tenants.

    - **stcontosoar** is a general-purpose v2 storage account in the Contoso tenant, created in March 2025.
    - **stfabrikamar** is a general-purpose v2 storage account in the Fabrikam tenant, created in June 2025.

    Blob versioning is enabled on both accounts and the change feed is enabled on stfabrikamar. Neither account has ever been modified from its default security settings. When you try to create an object replication policy from stfabrikamar to stcontosoar by using full resource IDs, the operation fails.

    You need to create the policy.

    What should you do?
  fr: |
    Contoso a racheté Fabrikam. Contoso et Fabrikam utilisent des locataires Microsoft Entra différents.

    - **stcontosoar** est un compte de stockage à usage général v2 du locataire Contoso, créé en mars 2025.
    - **stfabrikamar** est un compte de stockage à usage général v2 du locataire Fabrikam, créé en juin 2025.

    Le contrôle de version des objets blob est activé sur les deux comptes et le flux de modification est activé sur stfabrikamar. Les paramètres de sécurité par défaut des deux comptes n'ont jamais été modifiés. Lorsque vous essayez de créer une stratégie de réplication d'objets de stfabrikamar vers stcontosoar en utilisant les ID de ressource complets, l'opération échoue.

    Vous devez créer la stratégie.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the **AllowCrossTenantReplication** property to true on both storage accounts.", fr: "Définir la propriété **AllowCrossTenantReplication** sur true sur les deux comptes de stockage." }
    - id: b
      text: { en: "Specify only the account names instead of the full resource IDs in the policy definition.", fr: "Spécifier uniquement les noms de compte au lieu des ID de ressource complets dans la définition de stratégie." }
    - id: c
      text: { en: "Enable the change feed on stcontosoar.", fr: "Activer le flux de modification sur stcontosoar." }
    - id: d
      text: { en: "Invite your account as a guest user in the Fabrikam tenant and assign it the Storage Blob Data Owner role on stcontosoar.", fr: "Inviter votre compte en tant qu'utilisateur invité dans le locataire Fabrikam et lui attribuer le rôle Storage Blob Data Owner sur stcontosoar." }
answer: { optionId: a }
explanation:
  correct:
    en: For storage accounts created on or after December 15, 2023, the **AllowCrossTenantReplication** property is false by default. When it is false on an account, every object replication policy that uses that account as source or destination must stay within one tenant, so you must allow cross-tenant replication on both accounts.
    fr: Pour les comptes de stockage créés à partir du 15 décembre 2023, la propriété **AllowCrossTenantReplication** a la valeur false par défaut. Lorsqu'elle vaut false sur un compte, toute stratégie de réplication d'objets qui utilise ce compte comme source ou destination doit rester dans un seul locataire ; vous devez donc autoriser la réplication entre locataires sur les deux comptes.
  options:
    b:
      en: When cross-tenant replication is disallowed, a policy that uses account names only cannot be created at all, because Azure Storage cannot verify the tenants.
      fr: Lorsque la réplication entre locataires est interdite, une stratégie qui n'utilise que les noms de compte ne peut pas du tout être créée, car Stockage Azure ne peut pas vérifier les locataires.
    c:
      en: The change feed is required only on the source account, which already has it.
      fr: Le flux de modification n'est exigé que sur le compte source, qui l'a déjà.
    d:
      en: A data-plane role assignment does not lift the account-level restriction on cross-tenant policies.
      fr: Une attribution de rôle sur le plan de données ne lève pas la restriction du compte sur les stratégies entre locataires.
references:
  - title: Object replication overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
  - title: Prevent object replication across Microsoft Entra tenants
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-prevent-cross-tenant-policies
