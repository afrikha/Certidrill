id: s1-files-cloud-only-acls
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has no on-premises Active Directory. All users are cloud-only identities in Microsoft Entra ID. A storage account named **stfabfiles** uses Microsoft Entra Kerberos as its identity source, and the Finance group has the Storage File Data SMB Share Contributor role on a file share named **finance**.

    You need to grant the Finance group Modify permission on the **Budgets** directory of the share and Read permission on the rest of the share.

    Which tool should you use to configure the directory-level permissions?
  fr: |
    Fabrikam ne dispose d'aucun Active Directory local. Tous les utilisateurs sont des identités cloud uniquement dans Microsoft Entra ID. Un compte de stockage nommé **stfabfiles** utilise Microsoft Entra Kerberos comme source d'identité, et le groupe Finance dispose du rôle Storage File Data SMB Share Contributor sur un partage de fichiers nommé **finance**.

    Vous devez accorder au groupe Finance l'autorisation Modifier sur le répertoire **Budgets** du partage et l'autorisation Lecture sur le reste du partage.

    Quel outil devez-vous utiliser pour configurer les autorisations au niveau du répertoire ?
body:
  options:
    - id: a
      text:
        en: The Manage access option of the file share in the Azure portal
        fr: L'option Gérer l'accès du partage de fichiers dans le portail Azure
    - id: b
      text:
        en: icacls, run from a Microsoft Entra joined device that has mounted the share
        fr: icacls, exécuté depuis un appareil joint à Microsoft Entra qui a monté le partage
    - id: c
      text:
        en: The Security tab of File Explorer on a Microsoft Entra joined device
        fr: L'onglet Sécurité de l'Explorateur de fichiers sur un appareil joint à Microsoft Entra
    - id: d
      text:
        en: Additional Azure RBAC role assignments scoped to the Budgets directory
        fr: Des attributions de rôles Azure RBAC supplémentaires limitées au répertoire Budgets
answer: { optionId: a }
explanation:
  correct:
    en: For cloud-only identities, Windows ACLs (NTFS permissions) must be configured from the Azure portal (Manage access on the share, directory or file) or with the RestSetAcls PowerShell module. These methods work only when Microsoft Entra Kerberos is the identity source and have no dependency on domain controllers.
    fr: Pour les identités cloud uniquement, les listes de contrôle d'accès Windows (autorisations NTFS) doivent être configurées depuis le portail Azure (Gérer l'accès sur le partage, le répertoire ou le fichier) ou avec le module PowerShell RestSetAcls. Ces méthodes ne fonctionnent que lorsque Microsoft Entra Kerberos est la source d'identité et ne dépendent d'aucun contrôleur de domaine.
  options:
    b:
      en: icacls is not supported for cloud-only identities.
      fr: icacls n'est pas pris en charge pour les identités cloud uniquement.
    c:
      en: Configuring ACLs with File Explorer is not supported for cloud-only identities.
      fr: La configuration des ACL avec l'Explorateur de fichiers n'est pas prise en charge pour les identités cloud uniquement.
    d:
      en: Share-level RBAC roles apply to the whole share; directory-level permissions are Windows ACLs, not role assignments.
      fr: Les rôles RBAC au niveau du partage s'appliquent à tout le partage ; les autorisations au niveau du répertoire sont des ACL Windows, pas des attributions de rôles.
references:
  - title: Configure directory and file-level permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-configure-file-level-permissions
