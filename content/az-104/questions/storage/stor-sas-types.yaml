id: stor-sas-types
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a storage account named **stfabrikam** that is accessed by partner applications by using shared access signatures (SAS).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous gérez un compte de stockage nommé **stfabrikam** auquel des applications partenaires accèdent avec des signatures d'accès partagé (SAS).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A user delegation SAS is secured with Microsoft Entra credentials instead of the storage account key.
        fr: Une SAS de délégation d'utilisateur est sécurisée par des informations d'identification Microsoft Entra plutôt que par la clé du compte de stockage.
    - id: s2
      text:
        en: A service SAS can be associated with a stored access policy.
        fr: Une SAS de service peut être associée à une stratégie d'accès stockée.
    - id: s3
      text:
        en: You can revoke an account SAS by deleting the stored access policy it references.
        fr: Vous pouvez révoquer une SAS de compte en supprimant la stratégie d'accès stockée qu'elle référence.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: A user delegation SAS is signed with a user delegation key obtained with Microsoft Entra credentials. A service SAS can reference a stored access policy defined on the container, share, queue or table, which allows it to be revoked or modified later. An account SAS cannot reference a stored access policy; to revoke it you must rotate the account key used to sign it.
    fr: Une SAS de délégation d'utilisateur est signée avec une clé de délégation obtenue grâce aux informations d'identification Microsoft Entra. Une SAS de service peut référencer une stratégie d'accès stockée définie sur le conteneur, le partage, la file d'attente ou la table, ce qui permet de la révoquer ou de la modifier ensuite. Une SAS de compte ne peut pas référencer de stratégie d'accès stockée ; pour la révoquer, il faut régénérer la clé de compte qui l'a signée.
references:
  - title: Grant limited access to Azure Storage resources using shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
