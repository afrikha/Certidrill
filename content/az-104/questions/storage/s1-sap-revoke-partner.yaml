id: s1-sap-revoke-partner
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A storage account named **stwingtip** contains a container named **catalog**. Several internal applications connect to stwingtip by using key1.

    A partner received a service SAS for catalog. The SAS references a stored access policy named **partner-read** defined on the catalog container. The SAS has leaked.

    You need to revoke the leaked SAS immediately without disrupting the internal applications. What should you do?
  fr: |
    Un compte de stockage nommé **stwingtip** contient un conteneur nommé **catalog**. Plusieurs applications internes se connectent à stwingtip avec key1.

    Un partenaire a reçu une SAS de service pour catalog. La SAS référence une stratégie d'accès stockée nommée **partner-read** définie sur le conteneur catalog. La SAS a fuité.

    Vous devez révoquer immédiatement la SAS divulguée sans perturber les applications internes. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Delete the partner-read stored access policy.
        fr: Supprimer la stratégie d'accès stockée partner-read.
    - id: b
      text:
        en: Regenerate key1.
        fr: Régénérer key1.
    - id: c
      text:
        en: Revoke the user delegation keys of stwingtip.
        fr: Révoquer les clés de délégation d'utilisateur de stwingtip.
    - id: d
      text:
        en: Set the anonymous access level of catalog to Private.
        fr: Définir le niveau d'accès anonyme de catalog sur Privé.
answer: { optionId: a }
explanation:
  correct:
    en: A service SAS that references a stored access policy inherits its constraints from that policy. Deleting the policy (or renaming its identifier, or moving its expiry time to the past) breaks the association and revokes every SAS bound to it, without touching the account keys.
    fr: Une SAS de service qui référence une stratégie d'accès stockée hérite de ses contraintes. Supprimer la stratégie (ou renommer son identificateur, ou placer son heure d'expiration dans le passé) rompt l'association et révoque toutes les SAS qui y sont liées, sans toucher aux clés de compte.
  options:
    b:
      en: Regenerating key1 would revoke the SAS if it was signed with key1, but it would also break the internal applications that use key1.
      fr: Régénérer key1 révoquerait la SAS si elle a été signée avec key1, mais casserait aussi les applications internes qui utilisent key1.
    c:
      en: User delegation keys sign user delegation SAS tokens only; a service SAS is signed with an account key.
      fr: Les clés de délégation d'utilisateur ne signent que les SAS de délégation d'utilisateur ; une SAS de service est signée avec une clé de compte.
    d:
      en: The anonymous access level controls unauthenticated access; it has no effect on requests authorized by a SAS.
      fr: Le niveau d'accès anonyme contrôle l'accès non authentifié ; il n'a aucun effet sur les demandes autorisées par une SAS.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
