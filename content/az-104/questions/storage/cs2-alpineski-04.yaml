id: cs2-alpineski-04
objective: "2.3.4"
type: yesno_statements
caseStudy: cs2-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing how the current configuration of stalpinefiles meets the recovery requirement for skischool.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous examinez comment la configuration actuelle de stalpinefiles répond à l'exigence de récupération de skischool.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: If an instructor deletes a file at 10:00, you can restore the file from the share snapshot created the previous night.
        fr: Si un moniteur supprime un fichier à 10:00, vous pouvez restaurer le fichier à partir de l'instantané de partage créé la nuit précédente.
    - id: s2
      text:
        en: Share soft delete lets you recover a single deleted file without using a snapshot.
        fr: La suppression réversible des partages permet de récupérer un seul fichier supprimé sans utiliser d'instantané.
    - id: s3
      text:
        en: If the skischool share is deleted, you can undelete it within 14 days, and its share snapshots are restored with it.
        fr: Si le partage skischool est supprimé, vous pouvez annuler la suppression dans un délai de 14 jours, et ses instantanés de partage sont restaurés avec lui.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A share snapshot is a read-only, point-in-time copy of the share, so a file that existed at 22:00 can be copied back from it. Soft delete works only at the share level and does not protect individual files. When you undelete a soft-deleted share during the retention period, the share and all its contents, including snapshots, are restored.
    fr: |
      Un instantané de partage est une copie en lecture seule du partage à un instant donné ; un fichier qui existait à 22:00 peut donc en être recopié. La suppression réversible fonctionne uniquement au niveau du partage et ne protège pas les fichiers individuels. Quand vous annulez la suppression d'un partage pendant la période de rétention, le partage et tout son contenu, y compris les instantanés, sont restaurés.
references:
  - title: "Azure File Share Soft Delete"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
  - title: "Use Azure Files Share Snapshots"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
