id: cs2-alpineski-04
objective: "2.3.4"
type: yesno_statements
caseStudy: cs2-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing how the current configuration of stalpinefiles meets the recovery requirement for skischool. The instructors map skischool on Windows computers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez comment la configuration actuelle de stalpinefiles répond à l'exigence de récupération de skischool. Les moniteurs mappent skischool sur des ordinateurs Windows.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If an instructor creates a file at 09:00 and deletes it at 17:00 on the same day, you can restore the file from a share snapshot.
        fr: |
          Si un moniteur crée un fichier à 9 h 00 et le supprime à 17 h 00 le même jour, vous pouvez restaurer le fichier à partir d'un instantané de partage.
    - id: s2
      text:
        en: |
          An instructor can restore an earlier version of a file from the **Previous Versions** tab in File Explorer, without help from an administrator.
        fr: |
          Un moniteur peut restaurer une version antérieure d'un fichier à partir de l'onglet **Versions précédentes** de l'Explorateur de fichiers, sans l'aide d'un administrateur.
    - id: s3
      text:
        en: |
          The nightly share snapshots can be kept for a whole year without deleting any of them.
        fr: |
          Les instantanés de partage nocturnes peuvent être conservés pendant une année entière sans en supprimer aucun.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A share snapshot captures the share as it was when the snapshot was taken, at 22:00; a file created and deleted between two snapshots is in none of them. On Windows, the share snapshots of a mounted SMB share appear in the Previous Versions tab, so users who have access to the files can open or restore earlier versions themselves. A share supports up to 200 snapshots, so one snapshot per night reaches the limit in less than seven months and older snapshots must then be deleted.
    fr: |
      Un instantané de partage capture le partage tel qu'il était au moment de l'instantané, à 22 h 00 ; un fichier créé puis supprimé entre deux instantanés ne figure dans aucun d'eux. Sous Windows, les instantanés d'un partage SMB monté apparaissent dans l'onglet Versions précédentes ; les utilisateurs qui ont accès aux fichiers peuvent donc ouvrir ou restaurer eux-mêmes des versions antérieures. Un partage prend en charge jusqu'à 200 instantanés : à raison d'un instantané par nuit, la limite est atteinte en moins de sept mois, et les instantanés plus anciens doivent alors être supprimés.
  options:
    s1: { en: "No snapshot was taken while the file existed, and share soft delete does not protect individual files.", fr: "Aucun instantané n'a été pris pendant que le fichier existait, et la suppression réversible des partages ne protège pas les fichiers individuels." }
    s3: { en: "Azure Files supports at most 200 snapshots per share; a year of nightly snapshots would need 365.", fr: "Azure Files prend en charge au plus 200 instantanés par partage ; une année d'instantanés nocturnes en nécessiterait 365." }
references:
  - title: "Use Azure Files Share Snapshots"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
  - title: "Azure File Share Soft Delete"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
