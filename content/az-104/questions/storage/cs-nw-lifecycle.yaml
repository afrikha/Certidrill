id: cs-nw-lifecycle
objective: "2.3.5"
type: dropdown
caseStudy: cs-northwind-clinics
difficulty: 2
status: draft
stem:
  en: You need to configure the lifecycle management rule for the scanned documents. How should you complete the rule? Select the appropriate options in the answer area.
  fr: Vous devez configurer la règle de gestion du cycle de vie des documents numérisés. Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: json
  template: |
    "actions": {
      "baseBlob": {
        "tierToArchive": { "daysAfterModificationGreaterThan": [[archive]] },
        "delete": { "daysAfterModificationGreaterThan": [[delete]] }
      }
    },
    "filters": { "blobTypes": [ "blockBlob" ], "prefixMatch": [ "scans/" ] }
  slots:
    - id: archive
      options:
        - { id: d30, text: "30" }
        - { id: d90, text: "90" }
        - { id: d180, text: "180" }
    - id: delete
      options:
        - { id: d365, text: "365" }
        - { id: d2555, text: "2555" }
        - { id: d3650, text: "3650" }
answer:
  values: { archive: d90, delete: d3650 }
explanation:
  correct:
    en: The requirements ask for the Archive tier after 90 days without modification and deletion after 10 years, which is 3,650 days. The `prefixMatch` filter restricts the rule to the scans container.
    fr: Les exigences demandent le niveau Archive après 90 jours sans modification et la suppression au bout de 10 ans, soit 3 650 jours. Le filtre `prefixMatch` limite la règle au conteneur scans.
references:
  - title: Configure a lifecycle management policy
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-configure
