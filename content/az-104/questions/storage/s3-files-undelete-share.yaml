id: s3-files-undelete-share
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stcontosoeng** that contains several SMB Azure file shares. Soft delete for file shares is enabled with a retention period of 14 days.

    An administrator accidentally deleted a file share named **cad-drawings** two days ago. The share had five share snapshots.

    You need to recover the share and its contents. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stcontosoeng** qui contient plusieurs partages de fichiers Azure SMB. La suppression réversible des partages de fichiers est activée avec une période de rétention de 14 jours.

    Il y a deux jours, un administrateur a supprimé par erreur un partage de fichiers nommé **cad-drawings**. Le partage avait cinq instantanés de partage.

    Vous devez récupérer le partage et son contenu. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the file shares list, display the deleted shares, select cad-drawings, and select **Undelete**.", fr: "Dans la liste des partages de fichiers, afficher les partages supprimés, sélectionner cad-drawings, puis sélectionner **Annuler la suppression**." } }
    - { id: b, text: { en: Create a new share named cad-drawings and restore the files from the most recent share snapshot., fr: "Créer un nouveau partage nommé cad-drawings et restaurer les fichiers à partir de l'instantané de partage le plus récent." } }
    - { id: c, text: { en: Perform a point-in-time restore of stcontosoeng to a point three days ago., fr: "Effectuer une restauration à un instant dans le passé de stcontosoeng à un point situé trois jours plus tôt." } }
    - { id: d, text: { en: Open a support request so that Microsoft restores the share from its internal replicas., fr: "Ouvrir une demande de support pour que Microsoft restaure le partage à partir de ses réplicas internes." } }
answer: { optionId: a }
explanation:
  correct:
    en: With soft delete enabled, a deleted file share is kept in a soft-deleted state for the retention period. Undeleting it restores the share and all its contents, including its snapshots, to their state before the deletion.
    fr: Lorsque la suppression réversible est activée, un partage supprimé est conservé à l'état supprimé de manière réversible pendant la période de rétention. L'annulation de la suppression restaure le partage et tout son contenu, y compris ses instantanés, dans l'état antérieur à la suppression.
  options:
    b:
      en: The snapshots belong to the deleted share; they are not available separately. Creating a share with the same name also gives an empty share.
      fr: Les instantanés appartiennent au partage supprimé ; ils ne sont pas disponibles séparément. Créer un partage du même nom donne en outre un partage vide.
    c:
      en: Point-in-time restore applies to block blobs, not to Azure file shares.
      fr: La restauration à un instant dans le passé s'applique aux objets blob de blocs, pas aux partages de fichiers Azure.
    d:
      en: Redundancy copies are not a recovery mechanism for deleted data; soft delete is the self-service feature for this case.
      fr: Les copies de redondance ne sont pas un mécanisme de récupération des données supprimées ; la suppression réversible est la fonctionnalité libre-service prévue pour ce cas.
references:
  - title: Azure file share soft delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
