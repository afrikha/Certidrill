id: s1-keys-reminder-greyed
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stadatum2019** that was created several years ago. Its access keys have never been regenerated.

    You need to configure a key expiration policy so that a reminder appears when the keys have not been rotated for 90 days. On the **Access keys** page of the account, the **Set rotation reminder** button is unavailable.

    What should you do first?
  fr: |
    Vous disposez d'un compte de stockage nommé **stadatum2019**, créé il y a plusieurs années. Ses clés d'accès n'ont jamais été régénérées.

    Vous devez configurer une stratégie d'expiration de clé afin qu'un rappel s'affiche lorsque les clés n'ont pas fait l'objet d'une rotation depuis 90 jours. Sur la page **Clés d'accès** du compte, le bouton **Définir le rappel de rotation** n'est pas disponible.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text:
        en: Regenerate each of the two access keys at least once.
        fr: Régénérer au moins une fois chacune des deux clés d'accès.
    - id: b
      text:
        en: Assign the built-in policy Storage account keys should not be expired.
        fr: Attribuer la stratégie intégrée Storage account keys should not be expired.
    - id: c
      text:
        en: Configure a SAS expiration policy on the account.
        fr: Configurer une stratégie d'expiration SAS sur le compte.
    - id: d
      text:
        en: Store the access keys as secrets in Azure Key Vault.
        fr: Stocker les clés d'accès comme secrets dans Azure Key Vault.
answer: { optionId: a }
explanation:
  correct:
    en: A key expiration policy relies on the keyCreationTime property of each key. On older accounts this property can be null until the keys are regenerated, and the reminder cannot be set while it is null. After both keys are rotated once, you can set the reminder in the portal or with `--key-exp-days` / `-KeyExpirationPeriodInDay`.
    fr: Une stratégie d'expiration de clé s'appuie sur la propriété keyCreationTime de chaque clé. Sur les comptes anciens, cette propriété peut être null tant que les clés n'ont pas été régénérées, et le rappel ne peut pas être défini dans ce cas. Une fois les deux clés régénérées, vous pouvez définir le rappel dans le portail ou avec `--key-exp-days` / `-KeyExpirationPeriodInDay`.
  options:
    b:
      en: The built-in Azure Policy definition monitors compliance with an existing key expiration policy; it does not unlock the setting.
      fr: La définition Azure Policy intégrée surveille la conformité à une stratégie d'expiration de clé existante ; elle ne débloque pas le paramètre.
    c:
      en: A SAS expiration policy limits the validity of SAS tokens; it is a separate setting that has the same key creation prerequisite.
      fr: Une stratégie d'expiration SAS limite la validité des jetons SAS ; c'est un paramètre distinct, soumis au même prérequis de date de création des clés.
    d:
      en: Key Vault can help manage the keys, but storing them does not set their creation time.
      fr: Key Vault peut aider à gérer les clés, mais les y stocker ne définit pas leur date de création.
references:
  - title: Manage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
