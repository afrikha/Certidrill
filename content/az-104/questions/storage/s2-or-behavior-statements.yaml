id: s2-or-behavior-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You configure an object replication policy from the container **media** in the storage account **stmedia01** to the container **media-copy** in the storage account **stmedia02**. You create the replication rule with the default copy scope. The **media** container already contained 20,000 block blobs when you created the rule.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez une stratégie de réplication d'objets du conteneur **media** du compte de stockage **stmedia01** vers le conteneur **media-copy** du compte de stockage **stmedia02**. Vous créez la règle de réplication avec l'étendue de copie par défaut. Le conteneur **media** contenait déjà 20 000 objets blob de blocs lorsque vous avez créé la règle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An application can upload new blobs directly to **media-copy** while the policy is active.
        fr: Une application peut charger directement de nouveaux objets blob dans **media-copy** tant que la stratégie est active.
    - id: s2
      text:
        en: The 20,000 blobs that existed before the rule was created are copied to **media-copy**.
        fr: Les 20 000 objets blob qui existaient avant la création de la règle sont copiés dans **media-copy**.
    - id: s3
      text:
        en: stmedia01 can also replicate to a second destination account by using a second replication policy.
        fr: stmedia01 peut également répliquer vers un second compte de destination au moyen d'une seconde stratégie de réplication.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: After the policy is created, write operations to the destination container fail with error 409 (Conflict); only reads and deletes are allowed. By default a rule copies only block blobs added after its creation, unless you choose to copy existing blobs or set a custom copy scope. A source account can replicate to up to two destination accounts, with one policy for each destination.
    fr: Une fois la stratégie créée, les opérations d'écriture dans le conteneur de destination échouent avec l'erreur 409 (Conflit) ; seules les lectures et les suppressions sont autorisées. Par défaut, une règle ne copie que les objets blob de blocs ajoutés après sa création, sauf si vous choisissez de copier les objets blob existants ou définissez une étendue de copie personnalisée. Un compte source peut répliquer vers deux comptes de destination au maximum, avec une stratégie par destination.
references:
  - title: Object replication overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
