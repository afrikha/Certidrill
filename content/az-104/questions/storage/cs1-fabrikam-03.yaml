id: cs1-fabrikam-03
objective: "2.2.3"
type: yesno_statements
caseStudy: cs1-fabrikam
difficulty: 2
status: draft
stem:
  en: |
    You plan to configure object replication to meet the telemetry requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de configurer la réplication d'objets pour satisfaire l'exigence de télémétrie.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: |
          Blob versioning must be enabled on both stfabussensors and stfabanalytics.
        fr: |
          Le versioning des objets blob doit être activé sur stfabussensors et sur stfabanalytics.
    - id: s2
      text:
        en: |
          The change feed must be enabled on stfabanalytics.
        fr: |
          Le flux de modification doit être activé sur stfabanalytics.
    - id: s3
      text:
        en: |
          After the replication policy is created, applications cannot write blobs directly to the telemetry-us container.
        fr: |
          Une fois la stratégie de réplication créée, les applications ne peuvent plus écrire d'objets blob directement dans le conteneur telemetry-us.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Object replication requires blob versioning on both the source and destination accounts, and the change feed only on the source account (stfabussensors). The accounts can be in different regions. Once a replication rule targets telemetry-us, write operations to that destination container fail with a 409 (Conflict) error; reads and deletes are still allowed.
    fr: |
      La réplication d'objets exige le versioning des objets blob sur les comptes source et de destination, et le flux de modification uniquement sur le compte source (stfabussensors). Les comptes peuvent se trouver dans des régions différentes. Dès qu'une règle de réplication cible telemetry-us, les opérations d'écriture dans ce conteneur de destination échouent avec une erreur 409 (Conflict) ; les lectures et suppressions restent autorisées.
  options:
    s2: { en: "The change feed is required on the source account only, because Azure Storage reads it to find the blobs to replicate.", fr: "Le flux de modification n'est exigé que sur le compte source, car Stockage Azure le lit pour trouver les objets blob à répliquer." }
references:
  - title: Object replication overview - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
