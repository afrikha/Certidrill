id: stor-redundancy-regional-outage
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are creating a general-purpose v2 storage account in the West Europe region.

    The data must remain recoverable if the entire West Europe region becomes unavailable.

    Which two redundancy options meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un compte de stockage à usage général v2 dans la région West Europe.

    Les données doivent rester récupérables si toute la région West Europe devient indisponible.

    Quelles sont les deux options de redondance qui répondent à cette exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
    - { id: b, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
    - { id: c, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
    - { id: d, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: GRS and GZRS asynchronously copy the data to the paired secondary region, so it survives the loss of the primary region. GZRS also spreads the copies across availability zones in the primary region.
    fr: GRS et GZRS copient les données de manière asynchrone vers la région secondaire associée ; elles survivent donc à la perte de la région primaire. GZRS répartit en plus les copies entre les zones de disponibilité de la région primaire.
  options:
    a:
      en: LRS keeps three copies in a single datacenter of the primary region.
      fr: LRS conserve trois copies dans un seul centre de données de la région primaire.
    b:
      en: ZRS spreads the copies across availability zones, but all of them are in the primary region.
      fr: ZRS répartit les copies entre les zones de disponibilité, mais toutes restent dans la région primaire.
references:
  - title: Data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
