id: cs1-adatum-01
objective: "2.3.2"
type: single
caseStudy: cs1-adatum
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the trade-records container to meet the retention requirement.

    What should you do?
  fr: |
    Vous devez configurer le conteneur trade-records pour satisfaire l'exigence de rétention.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure a time-based retention policy of 2,555 days on trade-records, and then lock the policy", fr: "Configurer une stratégie de rétention limitée dans le temps de 2 555 jours sur trade-records, puis verrouiller la stratégie" } }
    - { id: b, text: { en: "Place a legal hold with the tag sevenyears on trade-records", fr: "Placer une conservation légale avec l'étiquette sevenyears sur trade-records" } }
    - { id: c, text: { en: "Enable blob soft delete with a retention period of 365 days and enable blob versioning", fr: "Activer la suppression réversible des objets blob avec une période de rétention de 365 jours et activer le versioning des objets blob" } }
    - { id: d, text: { en: "Apply a CanNotDelete lock to stadatumrecords", fr: "Appliquer un verrou CanNotDelete à stadatumrecords" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A time-based retention policy keeps blobs in a WORM state, so they cannot be modified or deleted by anyone until the retention interval ends. While the policy is unlocked it can still be shortened or deleted; once it is locked, it cannot be deleted and its retention period can only be extended, which meets the regulator's requirement.
    fr: |
      Une stratégie de rétention limitée dans le temps maintient les objets blob dans un état WORM : personne ne peut les modifier ni les supprimer avant la fin de l'intervalle de rétention. Tant que la stratégie est déverrouillée, elle peut encore être raccourcie ou supprimée ; une fois verrouillée, elle ne peut plus être supprimée et sa période de rétention peut seulement être prolongée, ce qui satisfait l'exigence du régulateur.
  options:
    b: { en: "A legal hold has no retention period and can be cleared at any time, so it does not guarantee seven years.", fr: "Une conservation légale n'a pas de période de rétention et peut être levée à tout moment ; elle ne garantit donc pas sept ans." }
    c: { en: "Soft delete and versioning let you recover data, but users can still modify and delete blobs, and the retention is shorter than seven years.", fr: "La suppression réversible et le versioning permettent de récupérer des données, mais les utilisateurs peuvent toujours modifier et supprimer les objets blob, et la rétention est inférieure à sept ans." }
    d: { en: "A resource lock protects the storage account resource on the control plane; it does not prevent blobs from being overwritten or deleted.", fr: "Un verrou de ressource protège la ressource compte de stockage au niveau du plan de contrôle ; il n'empêche pas d'écraser ou de supprimer des objets blob." }
references:
  - title: Immutable storage for blob data overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
