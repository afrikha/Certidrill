id: s1-sas-no-account-key
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage a storage account named **sttailspin** that contains a blob container named **exports**.

    An external auditor needs temporary read access to the blobs in exports. Your security policy states that no shared access signature may be signed with a storage account key.

    Which type of SAS should you create?
  fr: |
    Vous gérez un compte de stockage nommé **sttailspin** qui contient un conteneur d'objets blob nommé **exports**.

    Un auditeur externe a besoin d'un accès temporaire en lecture aux objets blob d'exports. Votre stratégie de sécurité stipule qu'aucune signature d'accès partagé ne doit être signée avec une clé de compte de stockage.

    Quel type de SAS devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: A user delegation SAS
        fr: Une SAS de délégation d'utilisateur
    - id: b
      text:
        en: A service SAS
        fr: Une SAS de service
    - id: c
      text:
        en: An account SAS
        fr: Une SAS de compte
    - id: d
      text:
        en: A service SAS associated with a stored access policy
        fr: Une SAS de service associée à une stratégie d'accès stockée
answer: { optionId: a }
explanation:
  correct:
    en: A user delegation SAS is signed with a user delegation key that is obtained with Microsoft Entra credentials, so no account key is involved. It is the type Microsoft recommends whenever a SAS is required for Blob Storage.
    fr: Une SAS de délégation d'utilisateur est signée avec une clé de délégation d'utilisateur obtenue avec des informations d'identification Microsoft Entra ; aucune clé de compte n'intervient. C'est le type que Microsoft recommande chaque fois qu'une SAS est nécessaire pour le Stockage Blob Azure.
  options:
    b:
      en: A service SAS is signed with the storage account key.
      fr: Une SAS de service est signée avec la clé du compte de stockage.
    c:
      en: An account SAS is also signed with the storage account key.
      fr: Une SAS de compte est elle aussi signée avec la clé du compte de stockage.
    d:
      en: A stored access policy only groups the constraints of a service SAS; the SAS is still signed with the account key.
      fr: Une stratégie d'accès stockée ne fait que regrouper les contraintes d'une SAS de service ; celle-ci reste signée avec la clé de compte.
references:
  - title: Grant limited access to data with shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
