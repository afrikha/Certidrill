id: sr-04-q3
objective: "2.1.1"
type: series_yesno
series: sr-04-storage-network
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You create a private endpoint for the blob service in Subnet1 and disable public network access.
  fr: |
    Vous créez un point de terminaison privé pour le service blob dans Subnet1 et désactivez l'accès réseau public.
body:
  solution:
    en: |
      You create a **private endpoint** for the `blob` sub-resource of stor1 in Subnet1, integrated with a private DNS zone named `privatelink.blob.core.windows.net` that is linked to VNet1. You then set public network access of stor1 to **Disabled**.
    fr: |
      Vous créez un **point de terminaison privé** pour la sous-ressource `blob` de stor1 dans Subnet1, intégré à une zone DNS privée nommée `privatelink.blob.core.windows.net` liée à VNet1. Vous définissez ensuite l'accès réseau public de stor1 sur **Disabled**.
answer: { value: true }
explanation:
  correct:
    en: |
      From VNet1, `stor1.blob.core.windows.net` resolves through the private DNS zone to the private IP address of the endpoint, so the virtual machines keep the same name and reach stor1 over Private Link. Traffic from the virtual network of a private endpoint is allowed even when public network access is disabled, while every request to the public endpoint, including from the internet, is rejected. VNet1 is connected to no other network, so the goal is met.
    fr: |
      Depuis VNet1, `stor1.blob.core.windows.net` est résolu via la zone DNS privée en adresse IP privée du point de terminaison : les machines virtuelles conservent le même nom et atteignent stor1 via Private Link. Le trafic du réseau virtuel d'un point de terminaison privé est autorisé même lorsque l'accès réseau public est désactivé, tandis que toutes les requêtes vers le point de terminaison public, y compris depuis Internet, sont rejetées. VNet1 n'est connecté à aucun autre réseau : l'objectif est atteint.
references:
  - title: "Use private endpoints - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
