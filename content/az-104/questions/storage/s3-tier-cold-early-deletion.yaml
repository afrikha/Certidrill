id: s3-tier-cold-early-deletion
objective: "2.3.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have a general-purpose v2 storage account named **stcontosoarch**. Blob soft delete is disabled.

    On March 1, you upload a block blob named **report.parquet** directly to the Cold tier. On April 30, after 60 days, you delete the blob.

    Which early deletion charge applies to the blob?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stcontosoarch**. La suppression réversible des objets blob est désactivée.

    Le 1er mars, vous chargez un objet blob de blocs nommé **report.parquet** directement dans le niveau froid (Cold). Le 30 avril, au bout de 60 jours, vous supprimez l'objet blob.

    Quels frais de suppression anticipée s'appliquent à l'objet blob ?
body:
  options:
    - { id: a, text: { en: No early deletion charge, fr: Aucuns frais de suppression anticipée } }
    - { id: b, text: { en: The equivalent of 30 days of Cold storage, fr: "L'équivalent de 30 jours de stockage dans le niveau froid (Cold)" } }
    - { id: c, text: { en: The equivalent of 60 days of Cold storage, fr: "L'équivalent de 60 jours de stockage dans le niveau froid (Cold)" } }
    - { id: d, text: { en: The equivalent of 120 days of Cold storage, fr: "L'équivalent de 120 jours de stockage dans le niveau froid (Cold)" } }
answer: { optionId: b }
explanation:
  correct:
    en: In a general-purpose v2 account, data in the Cold tier has a minimum retention of 90 days. Deleting the blob after 60 days triggers a prorated early deletion charge for the remaining 30 days (90 minus 60) of Cold storage.
    fr: Dans un compte usage général v2, les données du niveau froid (Cold) ont une durée de rétention minimale de 90 jours. Supprimer l'objet blob au bout de 60 jours entraîne des frais de suppression anticipée calculés au prorata pour les 30 jours restants (90 moins 60) de stockage dans ce niveau.
  options:
    a:
      en: The 90-day minimum is not reached, so a charge applies; the 30-day minimum is the one of the Cool tier.
      fr: Le minimum de 90 jours n'est pas atteint, des frais s'appliquent donc ; le minimum de 30 jours est celui du niveau froid (Cool).
    c:
      en: The charge covers only the days missing to reach the minimum, not the days already stored.
      fr: Les frais couvrent uniquement les jours manquants pour atteindre le minimum, pas les jours déjà stockés.
    d:
      en: 120 days would correspond to the 180-day minimum of the Archive tier, not to Cold.
      fr: 120 jours correspondraient au minimum de 180 jours du niveau archive (Archive), pas au niveau froid (Cold).
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
