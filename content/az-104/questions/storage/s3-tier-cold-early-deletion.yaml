id: s3-tier-cold-early-deletion
objective: "2.3.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have a general-purpose v2 storage account named **stcontosoarch**. Blob soft delete is disabled.

    On March 1, you upload a block blob named **report.parquet** directly to the Cold tier. On March 21, after 20 days, you delete the blob.

    Which early deletion charge applies to the blob?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stcontosoarch**. La suppression réversible des objets blob est désactivée.

    Le 1er mars, vous chargez un objet blob de blocs nommé **report.parquet** directement dans le niveau froid (Cold). Le 21 mars, au bout de 20 jours, vous supprimez l'objet blob.

    Quels frais de suppression anticipée s'appliquent à l'objet blob ?
body:
  options:
    - { id: a, text: { en: "No early deletion charge", fr: "Pas de frais de suppression anticipée" } }
    - { id: b, text: { en: The equivalent of 10 days of Cold storage, fr: "L'équivalent de 10 jours de stockage dans le niveau froid (Cold)" } }
    - { id: c, text: { en: The equivalent of 20 days of Cold storage, fr: "L'équivalent de 20 jours de stockage dans le niveau froid (Cold)" } }
    - { id: d, text: { en: The equivalent of 70 days of Cold storage, fr: "L'équivalent de 70 jours de stockage dans le niveau froid (Cold)" } }
answer: { optionId: d }
explanation:
  correct:
    en: In a general-purpose v2 account, data in the Cold tier has a minimum retention of 90 days. Deleting the blob after 20 days triggers a prorated early deletion charge for the remaining 70 days (90 minus 20) of Cold storage.
    fr: Dans un compte usage général v2, les données du niveau froid (Cold) ont une durée de rétention minimale de 90 jours. Supprimer l'objet blob au bout de 20 jours entraîne des frais de suppression anticipée calculés au prorata pour les 70 jours restants (90 moins 20) de stockage dans ce niveau.
  options:
    a:
      en: The 90-day minimum of the Cold tier is not reached, so a charge applies.
      fr: Le minimum de 90 jours du niveau froid (Cold) n'est pas atteint, des frais s'appliquent donc.
    b:
      en: Ten days (30 minus 20) would apply to the 30-day minimum of the Cool tier, not to Cold.
      fr: Dix jours (30 moins 20) correspondraient au minimum de 30 jours du niveau froid (Cool), pas au niveau froid (Cold).
    c:
      en: The charge covers only the days missing to reach the minimum, not the days already stored.
      fr: Les frais couvrent uniquement les jours manquants pour atteindre le minimum, pas les jours déjà stockés.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
