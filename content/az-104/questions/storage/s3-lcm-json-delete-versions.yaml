id: s3-lcm-json-delete-versions
objective: "2.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stcontosolegal** that has blob versioning enabled. The account contains a container named **contracts**.

    You need a lifecycle management rule that deletes the previous versions of the block blobs stored under the **signed/** virtual folder of **contracts** when they are more than 90 days old. The current versions must not be affected, and no other blob must be affected.

    How should you complete the rule definition? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stcontosolegal** sur lequel le contrôle de version des objets blob est activé. Le compte contient un conteneur nommé **contracts**.

    Vous avez besoin d'une règle de gestion du cycle de vie qui supprime les versions précédentes des objets blob de blocs stockés sous le dossier virtuel **signed/** de **contracts** lorsqu'elles ont plus de 90 jours. Les versions actuelles ne doivent pas être affectées, ni aucun autre objet blob.

    Comment devez-vous compléter la définition de la règle ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: json
  template: |
    "definition": {
      "filters": {
        "blobTypes": [ "blockBlob" ],
        "prefixMatch": [ [[prefix]] ]
      },
      "actions": {
        "[[section]]": {
          "delete": { "[[cond]]": 90 }
        }
      }
    }
  slots:
    - id: prefix
      options:
        - { id: cont, text: "\"contracts/signed/\"" }
        - { id: folder, text: "\"signed/\"" }
        - { id: wild, text: "\"contracts/signed/*\"" }
        - { id: account, text: "\"stcontosolegal/contracts/signed/\"" }
    - id: section
      options:
        - { id: version, text: version }
        - { id: baseBlob, text: baseBlob }
        - { id: snapshot, text: snapshot }
        - { id: previous, text: previousVersions }
    - id: cond
      options:
        - { id: creation, text: daysAfterCreationGreaterThan }
        - { id: modif, text: daysAfterModificationGreaterThan }
        - { id: access, text: daysAfterLastAccessTimeGreaterThan }
answer:
  values: { prefix: cont, section: version, cond: creation }
explanation:
  correct:
    en: "A `prefixMatch` string must start with the container name, here `contracts/signed/`. Actions on previous versions go in the `version` object, and an age-based delete of a version uses `daysAfterCreationGreaterThan`, based on the creation time of that version; the modification and last access conditions apply only to current versions."
    fr: "Une chaîne `prefixMatch` doit commencer par le nom du conteneur, ici `contracts/signed/`. Les actions sur les versions précédentes se placent dans l'objet `version`, et une suppression d'une version selon son âge utilise `daysAfterCreationGreaterThan`, fondée sur l'heure de création de cette version ; les conditions de modification et de dernier accès ne s'appliquent qu'aux versions actuelles."
  options:
    folder: { en: "Without the container name, the prefix would match a container named signed.", fr: "Sans le nom du conteneur, le préfixe correspondrait à un conteneur nommé signed." }
    wild: { en: Prefixes don't support wildcards; * would be treated as a literal character., fr: "Les préfixes ne prennent pas en charge les caractères génériques ; * serait traité comme un caractère littéral." }
    account: { en: "A prefix starts with the container name, not with the account name.", fr: "Un préfixe commence par le nom du conteneur, pas par celui du compte." }
    baseBlob: { en: "baseBlob actions apply to current versions, which must not be affected.", fr: "Les actions baseBlob s'appliquent aux versions actuelles, qui ne doivent pas être affectées." }
    snapshot: { en: "snapshot actions apply to blob snapshots, not to versions.", fr: "Les actions snapshot s'appliquent aux instantanés d'objets blob, pas aux versions." }
    modif: { en: daysAfterModificationGreaterThan applies only to current versions., fr: daysAfterModificationGreaterThan ne s'applique qu'aux versions actuelles. }
    access: { en: daysAfterLastAccessTimeGreaterThan applies only to current versions., fr: daysAfterLastAccessTimeGreaterThan ne s'applique qu'aux versions actuelles. }
references:
  - title: Azure Blob Storage lifecycle management policy structure
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
