id: s3-tier-rehydrate-urgent
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A 4-GiB block blob named **audit-2025.zip** in a storage account named **stadatumaudit** was moved to the Archive tier 40 days ago.

    An auditor needs to read the content of the blob as soon as possible. The solution must avoid any early deletion charge for **audit-2025.zip**.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un objet blob de blocs de 4 Gio nommé **audit-2025.zip**, situé dans un compte de stockage nommé **stadatumaudit**, a été déplacé vers le niveau archive (Archive) il y a 40 jours.

    Un auditeur doit lire le contenu de l'objet blob le plus rapidement possible. La solution doit éviter tous frais de suppression anticipée pour **audit-2025.zip**.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: Copy audit-2025.zip to a new blob in the Hot tier by using a Copy Blob operation., fr: "Copier audit-2025.zip vers un nouvel objet blob du niveau chaud (Hot) avec une opération Copy Blob." } }
    - { id: b, text: { en: Set the rehydration priority to High., fr: "Définir la priorité de réhydratation sur Élevée (High)." } }
    - { id: c, text: { en: Change the tier of audit-2025.zip to Hot by using a Set Blob Tier operation., fr: "Changer le niveau d'audit-2025.zip en chaud (Hot) avec une opération Set Blob Tier." } }
    - { id: d, text: { en: Set the rehydration priority to Standard., fr: "Définir la priorité de réhydratation sur Standard." } }
    - { id: e, text: { en: Add a lifecycle management rule that moves the blob to the Hot tier., fr: "Ajouter une règle de gestion du cycle de vie qui déplace l'objet blob vers le niveau chaud (Hot)." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Copying the archived blob to a new blob in an online tier rehydrates the data while the source stays unmodified in Archive, so no early deletion fee applies to it. High priority is processed before standard requests and can complete in less than one hour for objects under 10 GB.
    fr: Copier l'objet blob archivé vers un nouvel objet blob d'un niveau en ligne réhydrate les données tandis que la source reste inchangée dans le niveau archive (Archive) ; elle ne subit donc pas de frais de suppression anticipée. La priorité élevée est traitée avant les demandes standard et peut aboutir en moins d'une heure pour les objets de moins de 10 Go.
  options:
    c:
      en: Changing the tier of a blob archived 40 days ago incurs an early deletion charge for the remaining 140 days.
      fr: Changer le niveau d'un objet blob archivé depuis 40 jours entraîne des frais de suppression anticipée pour les 140 jours restants.
    d:
      en: Standard priority can take up to 15 hours, which does not meet the "as soon as possible" requirement.
      fr: La priorité standard peut prendre jusqu'à 15 heures, ce qui ne répond pas à l'exigence « le plus rapidement possible ».
    e:
      en: Lifecycle management policies cannot rehydrate archived blobs to an online tier.
      fr: Les stratégies de gestion du cycle de vie ne peuvent pas réhydrater des objets blob archivés vers un niveau en ligne.
references:
  - title: Blob rehydration from the archive tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
