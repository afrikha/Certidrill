id: s1-files-entra-kerberos-choice
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an on-premises Active Directory Domain Services (AD DS) domain that is synced to Microsoft Entra ID by using Microsoft Entra Connect Sync. Remote employees use Windows 11 Enterprise devices that are Microsoft Entra joined and have no network connectivity to the on-premises domain controllers.

    The employees must access an SMB file share in a storage account named **stcontosofs** by using their existing hybrid identities, without a VPN.

    Which identity source should you enable on stcontosofs?
  fr: |
    Contoso dispose d'un domaine Active Directory Domain Services (AD DS) local synchronisé avec Microsoft Entra ID au moyen de Microsoft Entra Connect Sync. Les employés à distance utilisent des appareils Windows 11 Entreprise joints à Microsoft Entra, sans connectivité réseau vers les contrôleurs de domaine locaux.

    Les employés doivent accéder à un partage de fichiers SMB d'un compte de stockage nommé **stcontosofs** avec leurs identités hybrides existantes, sans VPN.

    Quelle source d'identité devez-vous activer sur stcontosofs ?
body:
  options:
    - id: a
      text:
        en: Microsoft Entra Kerberos
        fr: Microsoft Entra Kerberos
    - id: b
      text:
        en: On-premises AD DS
        fr: AD DS local
    - id: c
      text:
        en: Microsoft Entra Domain Services
        fr: Microsoft Entra Domain Services
    - id: d
      text:
        en: A managed identity assigned to each device
        fr: Une identité managée attribuée à chaque appareil
answer: { optionId: a }
explanation:
  correct:
    en: With Microsoft Entra Kerberos, Microsoft Entra ID issues the Kerberos tickets used to access the file share, so clients do not need connectivity to domain controllers. It supports hybrid identities on Microsoft Entra joined or Microsoft Entra hybrid joined Windows clients.
    fr: Avec Microsoft Entra Kerberos, Microsoft Entra ID émet les tickets Kerberos utilisés pour accéder au partage de fichiers ; les clients n'ont donc pas besoin de connectivité vers les contrôleurs de domaine. Cette source prend en charge les identités hybrides sur des clients Windows joints à Microsoft Entra ou joints à Microsoft Entra hybride.
  options:
    b:
      en: AD DS authentication requires clients to reach the domain controllers, which the remote devices cannot do without a VPN.
      fr: L'authentification AD DS exige que les clients joignent les contrôleurs de domaine, ce que les appareils distants ne peuvent pas faire sans VPN.
    c:
      en: Microsoft Entra Domain Services requires clients joined to the managed domain with connectivity to its domain controllers; Microsoft Entra joined devices do not meet this.
      fr: Microsoft Entra Domain Services exige des clients joints au domaine managé et connectés à ses contrôleurs de domaine ; les appareils joints à Microsoft Entra ne remplissent pas cette condition.
    d:
      en: Managed identities are for applications and Azure workloads; they do not authenticate the employees' user identities.
      fr: Les identités managées sont destinées aux applications et aux charges de travail Azure ; elles n'authentifient pas les identités des employés.
references:
  - title: Overview - Azure Files identity-based authentication
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
  - title: Microsoft Entra Kerberos authentication for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
