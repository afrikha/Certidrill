id: s1-sap-cli-policy-sas
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You manage a storage account named **stfabrikam** that contains a container named **invoices**. `$key` holds an account key of stfabrikam.

    You need to give an accounting firm read access to invoices until June 30, 2027, at 00:00 UTC. You must be able to shorten or revoke this access later without regenerating the account keys.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.
  fr: |
    Vous gérez un compte de stockage nommé **stfabrikam** qui contient un conteneur nommé **invoices**. `$key` contient une clé de compte de stfabrikam.

    Vous devez accorder à un cabinet comptable un accès en lecture à invoices jusqu'au 30 juin 2027 à 00:00 UTC. Vous devez pouvoir raccourcir ou révoquer cet accès ultérieurement sans régénérer les clés de compte.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage container policy [[verb]] \
      --account-name stfabrikam --account-key $key \
      --container-name invoices \
      --name acct-read \
      --permissions r \
      --expiry 2027-06-30T00:00Z

    az storage container generate-sas \
      --account-name stfabrikam --account-key $key \
      --name invoices \
      [[ref]] \
      --https-only
  slots:
    - id: verb
      options:
        - { id: create, text: create }
        - { id: add, text: add }
        - { id: new, text: new }
        - { id: set, text: set }
    - id: ref
      options:
        - { id: policy, text: "--policy-name acct-read" }
        - { id: perms, text: "--policy-name acct-read --permissions r --expiry 2027-06-30T00:00Z" }
        - { id: asuser, text: "--as-user --auth-mode login" }
        - { id: adhoc, text: "--permissions r --expiry 2027-06-30T00:00Z" }
answer:
  values: { verb: create, ref: policy }
explanation:
  correct:
    en: "`az storage container policy create` defines the stored access policy (permissions and expiry) on the container. `generate-sas --policy-name` then creates a service SAS bound to that policy, so you can later change the expiry or delete the policy to revoke the SAS without touching the account keys."
    fr: "`az storage container policy create` définit la stratégie d'accès stockée (autorisations et expiration) sur le conteneur. `generate-sas --policy-name` crée ensuite une SAS de service liée à cette stratégie ; vous pourrez modifier l'expiration ou supprimer la stratégie pour révoquer la SAS sans toucher aux clés de compte."
  options:
    perms:
      en: A parameter cannot be specified both in the stored access policy and in the SAS token; the permissions and expiry already come from acct-read.
      fr: Un paramètre ne peut pas être spécifié à la fois dans la stratégie d'accès stockée et dans le jeton SAS ; les autorisations et l'expiration proviennent déjà d'acct-read.
    asuser:
      en: A user delegation SAS cannot reference a stored access policy.
      fr: Une SAS de délégation d'utilisateur ne peut pas référencer de stratégie d'accès stockée.
    adhoc:
      en: An ad hoc service SAS is not linked to the policy; revoking it early would require regenerating the account key.
      fr: Une SAS de service ad hoc n'est pas liée à la stratégie ; la révoquer avant terme imposerait de régénérer la clé de compte.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
  - title: az storage container
    url: https://learn.microsoft.com/en-us/cli/azure/storage/container
