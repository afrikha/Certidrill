id: s3-blob-anon-access-grid
objective: "2.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has two storage accounts that contain the containers shown in the following table. No firewall rule restricts access to either account.

    Answer each prompt by selecting the container that meets the requirement. Each prompt has exactly one correct container.
  fr: |
    Northwind Traders dispose de deux comptes de stockage qui contiennent les conteneurs présentés dans le tableau suivant. Aucune règle de pare-feu ne restreint l'accès à ces comptes.

    Répondez à chaque consigne en sélectionnant le conteneur qui répond à l'exigence. Chaque consigne a exactement un conteneur correct.
body:
  prompts:
    - id: p1
      text: { en: An anonymous client can list the blobs in this container., fr: Un client anonyme peut lister les objets blob de ce conteneur. }
    - id: p2
      text: { en: "An anonymous client can download a blob from this container by using its URL, but cannot list the blobs.", fr: "Un client anonyme peut télécharger un objet blob de ce conteneur avec son URL, mais ne peut pas lister les objets blob." }
  grid:
    header: [{ en: Container, fr: Conteneur }, { en: Storage account, fr: Compte de stockage }, { en: Allow Blob anonymous access (account), fr: "Autoriser l'accès anonyme aux objets blob (compte)" }, { en: Anonymous access level (container), fr: "Niveau d'accès anonyme (conteneur)" }]
    rows:
      - [{ text: catalog, area: c1 }, { text: stnwsales }, { text: { en: Disabled, fr: Désactivé } }, { text: { en: Container, fr: Conteneur } }]
      - [{ text: logos, area: c2 }, { text: stnwsales }, { text: { en: Disabled, fr: Désactivé } }, { text: Blob }]
      - [{ text: invoices, area: c3 }, { text: stnwweb }, { text: { en: Enabled, fr: Activé } }, { text: { en: Private, fr: Privé } }]
      - [{ text: banners, area: c4 }, { text: stnwweb }, { text: { en: Enabled, fr: Activé } }, { text: Blob }]
      - [{ text: downloads, area: c5 }, { text: stnwweb }, { text: { en: Enabled, fr: Activé } }, { text: { en: Container, fr: Conteneur } }]
answer:
  values: { p1: c5, p2: c4 }
explanation:
  correct:
    en: Anonymous access requires both settings. When the account disallows anonymous access, the account setting overrides every container level, so catalog and logos are not anonymously accessible. In stnwweb, the Container level (downloads) allows anonymous reads and listing of blobs, the Blob level (banners) allows anonymous reads of blobs but not listing, and Private (invoices) allows no anonymous access.
    fr: "L'accès anonyme exige les deux paramètres. Quand le compte interdit l'accès anonyme, le paramètre du compte l'emporte sur le niveau de chaque conteneur : catalog et logos ne sont donc pas accessibles anonymement. Dans stnwweb, le niveau Conteneur (downloads) autorise la lecture anonyme et l'énumération des objets blob, le niveau Blob (banners) autorise la lecture anonyme des objets blob mais pas leur énumération, et Privé (invoices) n'autorise aucun accès anonyme."
references:
  - title: Configure anonymous read access for containers and blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
