id: s2-azcopy-entra-upload-role
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer named **User1** runs `azcopy login` and signs in with a Microsoft Entra account. User1 then tries to upload files to the container **builds** in the storage account **stbuilds01** by using `azcopy copy`, but the request is denied.

    You need to allow User1 to upload blobs to the **builds** container. The solution must follow the principle of least privilege.

    Which role should you assign to User1 at the scope of the container?
  fr: |
    Un développeur nommé **User1** exécute `azcopy login` et se connecte avec un compte Microsoft Entra. User1 tente ensuite de charger des fichiers dans le conteneur **builds** du compte de stockage **stbuilds01** avec `azcopy copy`, mais la requête est refusée.

    Vous devez permettre à User1 de charger des objets blob dans le conteneur **builds**. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à User1 dans l'étendue du conteneur ?
body:
  options:
    - { id: a, text: Storage Blob Data Contributor }
    - { id: b, text: Storage Blob Data Reader }
    - { id: c, text: Storage Account Contributor }
    - { id: d, text: Storage Blob Data Owner }
answer: { optionId: a }
explanation:
  correct:
    en: When AzCopy is authorized with Microsoft Entra ID, the identity needs a data-plane role. Uploads require Storage Blob Data Contributor or Storage Blob Data Owner; Contributor is the least privileged of the two because it does not allow managing POSIX ACLs or ownership.
    fr: Lorsque AzCopy est autorisé avec Microsoft Entra ID, l'identité a besoin d'un rôle sur le plan de données. Les chargements exigent Storage Blob Data Contributor ou Storage Blob Data Owner ; Contributor est le moins privilégié des deux, car il ne permet pas de gérer les ACL POSIX ni la propriété.
  options:
    b:
      en: Storage Blob Data Reader allows downloads only, not uploads.
      fr: Storage Blob Data Reader ne permet que les téléchargements, pas les chargements.
    c:
      en: Storage Account Contributor is a management-plane role; it does not grant data access through Microsoft Entra authorization.
      fr: Storage Account Contributor est un rôle du plan de gestion ; il n'accorde pas d'accès aux données par l'autorisation Microsoft Entra.
    d:
      en: Storage Blob Data Owner allows uploads but grants more permissions than required.
      fr: Storage Blob Data Owner permet les chargements mais accorde plus d'autorisations que nécessaire.
references:
  - title: Authorize access for AzCopy with a user identity
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-authorize-user-identity
