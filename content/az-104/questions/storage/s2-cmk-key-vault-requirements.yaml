id: s2-cmk-key-vault-requirements
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stclinic01** and a key vault named **kv-clinic01**. You plan to configure Azure Storage encryption for stclinic01 with a customer-managed key stored in kv-clinic01.

    Which two settings must be enabled on kv-clinic01? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un compte de stockage nommé **stclinic01** et d'un coffre de clés nommé **kv-clinic01**. Vous prévoyez de configurer le chiffrement Stockage Azure de stclinic01 avec une clé gérée par le client stockée dans kv-clinic01.

    Quels deux paramètres doivent être activés sur kv-clinic01 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Soft delete", fr: "Suppression réversible" } }
    - { id: b, text: { en: "Purge protection", fr: "Protection contre la purge" } }
    - { id: c, text: { en: "The Premium pricing tier", fr: "Le niveau tarifaire Premium" } }
    - { id: d, text: { en: "Azure Disk Encryption for volume encryption", fr: "Azure Disk Encryption pour le chiffrement de volume" } }
    - { id: e, text: { en: "Automatic key rotation every 90 days", fr: "La rotation automatique des clés tous les 90 jours" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: A key vault or managed HSM that stores a customer-managed key for Azure Storage must have both soft delete and purge protection enabled, so that the key cannot be permanently deleted by mistake. The key must also be an RSA or RSA-HSM key of 2048, 3072 or 4096 bits.
    fr: Un coffre de clés ou un HSM managé qui stocke une clé gérée par le client pour Stockage Azure doit avoir la suppression réversible et la protection contre la purge activées, afin que la clé ne puisse pas être supprimée définitivement par erreur. La clé doit aussi être une clé RSA ou RSA-HSM de 2048, 3072 ou 4096 bits.
  options:
    c:
      en: The Standard tier supports software-protected RSA keys; the Premium tier is needed only for HSM-protected keys, which are not required here.
      fr: Le niveau Standard prend en charge les clés RSA protégées par logiciel ; le niveau Premium n'est nécessaire que pour les clés protégées par HSM, qui ne sont pas exigées ici.
    d:
      en: This access policy setting lets Azure Disk Encryption retrieve secrets for VM disks; it is unrelated to storage account encryption.
      fr: Ce paramètre de stratégie d'accès permet à Azure Disk Encryption de récupérer des secrets pour les disques de VM ; il n'a aucun rapport avec le chiffrement du compte de stockage.
    e:
      en: Rotating the key is a recommended practice, but a rotation policy is not a prerequisite for customer-managed keys.
      fr: La rotation de la clé est une pratique recommandée, mais une stratégie de rotation n'est pas un prérequis des clés gérées par le client.
references:
  - title: Customer-managed keys for account encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
