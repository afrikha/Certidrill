id: s3-tier-archive-zrs
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stlitwarelegal** that uses zone-redundant storage (ZRS) in the West Europe region. Several applications use stlitwarelegal, and the account must keep its current redundancy.

    The legal team must keep 40 TB of scanned contracts for 10 years. The contracts are read about once a year, and a retrieval delay of several hours is acceptable. For compliance reasons, no copy of the data can be stored outside West Europe.

    You need to store the contracts at the lowest possible storage cost.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stlitwarelegal** qui utilise le stockage redondant interzone (ZRS) dans la région West Europe. Plusieurs applications utilisent stlitwarelegal, et le compte doit conserver sa redondance actuelle.

    L'équipe juridique doit conserver 40 To de contrats numérisés pendant 10 ans. Les contrats sont lus environ une fois par an, et un délai de récupération de plusieurs heures est acceptable. Pour des raisons de conformité, aucune copie des données ne doit être stockée hors de West Europe.

    Vous devez stocker les contrats au coût de stockage le plus bas possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a storage account that uses LRS, and then upload the contracts to its Archive tier.", fr: "Créer un compte de stockage qui utilise LRS, puis charger les contrats dans son niveau archive (Archive)." } }
    - { id: b, text: { en: "Create a storage account that uses GRS, and then upload the contracts to its Archive tier.", fr: "Créer un compte de stockage qui utilise GRS, puis charger les contrats dans son niveau archive (Archive)." } }
    - { id: c, text: { en: "Upload the contracts to stlitwarelegal, and then set the tier of the blobs to Archive.", fr: "Charger les contrats dans stlitwarelegal, puis définir le niveau des objets blob sur archive (Archive)." } }
    - { id: d, text: { en: "Upload the contracts to stlitwarelegal, and then set the tier of the blobs to Cold.", fr: "Charger les contrats dans stlitwarelegal, puis définir le niveau des objets blob sur froid (Cold)." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Archive tier has the lowest storage cost and fits data that is read rarely and can wait hours for rehydration, but only accounts configured for LRS, GRS or RA-GRS support it. Because stlitwarelegal must stay ZRS and GRS copies data to the paired region, the contracts must go to a new LRS account in West Europe.
    fr: Le niveau archive (Archive) offre le coût de stockage le plus bas et convient à des données rarement lues qui peuvent attendre plusieurs heures leur réhydratation, mais seuls les comptes configurés en LRS, GRS ou RA-GRS le prennent en charge. Comme stlitwarelegal doit rester en ZRS et que GRS copie les données dans la région jumelée, les contrats doivent aller dans un nouveau compte LRS en West Europe.
  options:
    b:
      en: GRS supports the Archive tier, but it replicates the data to the paired secondary region, which breaks the compliance requirement and also costs more than LRS.
      fr: GRS prend en charge le niveau archive (Archive), mais il réplique les données dans la région secondaire jumelée, ce qui enfreint l'exigence de conformité et coûte en outre plus cher que LRS.
    c:
      en: Moving blobs to the Archive tier is not supported in a ZRS account.
      fr: Le déplacement d'objets blob vers le niveau archive (Archive) n'est pas pris en charge dans un compte ZRS.
    d:
      en: Cold is an online tier; it costs more to store than Archive, so it does not minimize the storage cost.
      fr: Le niveau froid (Cold) est un niveau en ligne dont le stockage coûte plus cher que le niveau archive (Archive) ; il ne réduit donc pas le coût au minimum.
references:
