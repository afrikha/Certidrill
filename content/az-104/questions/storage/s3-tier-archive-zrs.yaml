id: s3-tier-archive-zrs
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stlitwarelegal** that uses zone-redundant storage (ZRS) in the West Europe region.

    The legal team must keep 40 TB of scanned contracts for 10 years. The contracts are read about once a year, and a retrieval delay of several hours is acceptable. The data must stay in West Europe.

    You need to store the contracts at the lowest possible storage cost.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stlitwarelegal** qui utilise le stockage redondant interzone (ZRS) dans la région West Europe.

    L'équipe juridique doit conserver 40 To de contrats numérisés pendant 10 ans. Les contrats sont lus environ une fois par an, et un délai de récupération de plusieurs heures est acceptable. Les données doivent rester en West Europe.

    Vous devez stocker les contrats au coût de stockage le plus bas possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Create a new general-purpose v2 account that uses LRS and store the contracts there in the Archive tier., fr: "Créer un nouveau compte usage général v2 utilisant LRS et y stocker les contrats dans le niveau archive (Archive)." } }
    - { id: b, text: { en: Upload the contracts to stlitwarelegal and set their tier to Archive., fr: "Charger les contrats dans stlitwarelegal et définir leur niveau sur archive (Archive)." } }
    - { id: c, text: { en: Set the default access tier of stlitwarelegal to Archive., fr: "Définir le niveau d'accès par défaut de stlitwarelegal sur archive (Archive)." } }
    - { id: d, text: { en: Upload the contracts to stlitwarelegal and set their tier to Cold., fr: "Charger les contrats dans stlitwarelegal et définir leur niveau sur froid (Cold)." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Archive tier has the lowest storage cost and fits data read rarely with a latency of hours, but only accounts configured for LRS, GRS or RA-GRS support it. ZRS, GZRS and RA-GZRS accounts cannot archive blobs, so the contracts must go to an LRS account in the same region.
    fr: Le niveau archive (Archive) offre le coût de stockage le plus bas et convient à des données rarement lues avec une latence de plusieurs heures, mais seuls les comptes configurés en LRS, GRS ou RA-GRS le prennent en charge. Les comptes ZRS, GZRS et RA-GZRS ne peuvent pas archiver d'objets blob ; les contrats doivent donc aller dans un compte LRS de la même région.
  options:
    b:
      en: Moving blobs to the Archive tier is not supported in a ZRS account.
      fr: Le déplacement d'objets blob vers le niveau archive (Archive) n'est pas pris en charge dans un compte ZRS.
    c:
      en: The default access tier can only be Hot, Cool or Cold; Archive is never a default account tier.
      fr: Le niveau d'accès par défaut ne peut être que chaud (Hot), froid (Cool) ou froid (Cold) ; archive (Archive) n'est jamais un niveau par défaut.
    d:
      en: Cold is an online tier; it costs more to store than Archive, so it does not minimize the storage cost.
      fr: Le niveau froid (Cold) est un niveau en ligne dont le stockage coûte plus cher que le niveau archive (Archive) ; il ne réduit donc pas le coût au minimum.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
