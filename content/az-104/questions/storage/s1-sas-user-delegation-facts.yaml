id: s1-sas-user-delegation-facts
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Developers at Adatum generate user delegation SAS tokens for blobs in a storage account named **stadatum** by using the Azure CLI with `--as-user --auth-mode login`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Les développeurs d'Adatum génèrent des jetons SAS de délégation d'utilisateur pour les objets blob d'un compte de stockage nommé **stadatum** avec Azure CLI et les options `--as-user --auth-mode login`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A user delegation SAS generated with an expiry time 30 days after its start time is valid for no more than 7 days.
        fr: Une SAS de délégation d'utilisateur générée avec une heure d'expiration 30 jours après son heure de début n'est valide que 7 jours au maximum.
    - id: s2
      text:
        en: Regenerating key1 and key2 of stadatum invalidates the user delegation SAS tokens already issued.
        fr: La régénération de key1 et de key2 de stadatum invalide les jetons SAS de délégation d'utilisateur déjà émis.
    - id: s3
      text:
        en: Running `az storage account revoke-delegation-keys` for stadatum invalidates all the user delegation SAS tokens of the account.
        fr: L'exécution de `az storage account revoke-delegation-keys` pour stadatum invalide tous les jetons SAS de délégation d'utilisateur du compte.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The user delegation key that signs the SAS is valid for at most 7 days from its start, so a SAS with a longer expiry still stops working after 7 days. Because the SAS is secured with Microsoft Entra credentials, rotating the account keys does not affect it. Revoking the user delegation keys of the account invalidates every SAS signed with them (after a short caching delay).
    fr: La clé de délégation d'utilisateur qui signe la SAS est valide au maximum 7 jours à partir de son début ; une SAS dont l'expiration est plus lointaine cesse donc de fonctionner après 7 jours. Comme la SAS est sécurisée par des informations d'identification Microsoft Entra, la rotation des clés de compte ne l'affecte pas. La révocation des clés de délégation d'utilisateur du compte invalide toutes les SAS signées avec elles (après un court délai de mise en cache).
  options:
    s2:
      en: Only account and service SAS tokens, which are signed with the account key, are revoked by key rotation.
      fr: Seuls les jetons SAS de compte et de service, signés avec la clé de compte, sont révoqués par la rotation des clés.
references:
  - title: Use Azure CLI to create a user delegation SAS for a container or blob
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-user-delegation-sas-create-cli
  - title: Manage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
