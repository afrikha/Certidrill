id: s2-cli-create-encryption-options
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a general-purpose v2 storage account named **stfinance01** by using the Azure CLI. The account must meet the following requirements:

    - All data must be encrypted twice at rest, at the service level and at the infrastructure level.
    - The security team must be able to protect queue data with a customer-managed key later.

    How should you complete the command? Select the appropriate options in the answer area.
  fr: |
    Vous devez créer un compte de stockage à usage général v2 nommé **stfinance01** avec Azure CLI. Le compte doit répondre aux exigences suivantes :

    - Toutes les données doivent être chiffrées deux fois au repos, au niveau du service et au niveau de l'infrastructure.
    - L'équipe de sécurité doit pouvoir protéger plus tard les données des files d'attente avec une clé gérée par le client.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az storage account create \
      --name stfinance01 \
      --resource-group RG-Finance \
      --location westeurope \
      --sku Standard_GZRS \
      --kind StorageV2 \
      [[infra]] \
      --encryption-key-type-for-queue [[qtype]]
  slots:
    - id: infra
      options:
        - { id: rie, text: "--require-infrastructure-encryption" }
        - { id: svc, text: "--encryption-services queue table" }
        - { id: https, text: "--https-only true" }
        - { id: ident, text: "--assign-identity" }
    - id: qtype
      options:
        - { id: account, text: Account }
        - { id: service, text: Service }
        - { id: kv, text: Microsoft.Keyvault }
answer:
  values: { infra: rie, qtype: account }
explanation:
  correct:
    en: "Infrastructure encryption adds a second layer of 256-bit AES encryption with a separate Microsoft-managed key, and it can be enabled only when you create the account (`--require-infrastructure-encryption`). Queue and table data can be protected by a customer-managed key only if the account is created to use the account-scoped encryption key for them (`--encryption-key-type-for-queue Account`); this scope cannot be changed later."
    fr: "Le chiffrement de l'infrastructure ajoute une seconde couche de chiffrement AES 256 bits avec une clé distincte gérée par Microsoft, et il ne peut être activé qu'à la création du compte (`--require-infrastructure-encryption`). Les données des files d'attente et des tables ne peuvent être protégées par une clé gérée par le client que si le compte est créé pour utiliser la clé de chiffrement de l'étendue du compte (`--encryption-key-type-for-queue Account`) ; cette étendue ne peut pas être modifiée ensuite."
  options:
    svc: { en: "This parameter lists services to encrypt; it does not add infrastructure-level encryption.", fr: "Ce paramètre liste des services à chiffrer ; il n'ajoute pas de chiffrement au niveau de l'infrastructure." }
    https: { en: "Secure transfer protects data in transit, not at rest.", fr: "Le transfert sécurisé protège les données en transit, pas au repos." }
    ident: { en: "A managed identity is needed to reach a key vault, but it does not enable double encryption.", fr: "Une identité managée est nécessaire pour accéder à un coffre de clés, mais elle n'active pas le double chiffrement." }
    service: { en: "Service is the default: queue data then uses a service-scoped key that cannot be replaced by a customer-managed key.", fr: "Service est la valeur par défaut : les données des files d'attente utilisent alors une clé de l'étendue du service, qui ne peut pas être remplacée par une clé gérée par le client." }
    kv: { en: "Microsoft.Keyvault is a value of --encryption-key-source, not of the key type for queues.", fr: "Microsoft.Keyvault est une valeur de --encryption-key-source, pas du type de clé des files d'attente." }
references:
  - title: Enable infrastructure encryption for double encryption of data
    url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
  - title: Create an account that supports customer-managed keys for tables and queues
    url: https://learn.microsoft.com/en-us/azure/storage/common/account-encryption-key-create
