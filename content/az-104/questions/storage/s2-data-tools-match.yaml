id: s2-data-tools-match
objective: "2.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The operations team of Fabrikam has four data management tasks, shown in the answer area.

    Which tool or feature should the team use for each task? To answer, drag the appropriate tools or features to the correct tasks. Each tool or feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'exploitation de Fabrikam doit réaliser les quatre tâches de gestion des données indiquées dans la zone de réponse.

    Quel outil ou quelle fonctionnalité l'équipe doit-elle utiliser pour chaque tâche ? Pour répondre, faites glisser les outils ou fonctionnalités appropriés vers les tâches correspondantes. Chaque outil ou fonctionnalité peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: azcopy, text: AzCopy }
    - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
    - { id: or, text: { en: "Object replication", fr: "Réplication d'objets" } }
    - { id: afs, text: Azure File Sync }
    - { id: lifecycle, text: { en: "Lifecycle management", fr: "Gestion du cycle de vie" } }
  targets:
    - id: gui
      text: { en: "Let help desk staff on macOS browse containers, upload a few files and generate a SAS from a desktop application", fr: "Permettre au support technique sous macOS de parcourir des conteneurs, de charger quelques fichiers et de générer une SAS depuis une application de bureau" }
    - id: script
      text: { en: "Run a nightly script on a Linux server that uploads only the new and modified files of a local folder to a container", fr: "Exécuter chaque nuit, sur un serveur Linux, un script qui ne charge dans un conteneur que les fichiers nouveaux et modifiés d'un dossier local" }
    - id: continuous
      text: { en: "Asynchronously and continuously copy new block blobs of a container to an account in another region, without running any tool", fr: "Copier de façon asynchrone et continue les nouveaux objets blob de blocs d'un conteneur vers un compte d'une autre région, sans exécuter d'outil" }
    - id: onetime
      text: { en: "Perform a one-time, server-to-server copy of an entire container to another storage account from the command line", fr: "Effectuer une copie unique, de serveur à serveur, d'un conteneur entier vers un autre compte de stockage depuis la ligne de commande" }
answer:
  mapping: { gui: explorer, script: azcopy, continuous: or, onetime: azcopy }
explanation:
  correct:
    en: Azure Storage Explorer is a desktop application for Windows, macOS and Linux that browses and manages storage data and can generate SAS. AzCopy is the command-line tool for scripted transfers; `azcopy sync` uploads only what changed, and `azcopy copy` between accounts uses server-to-server APIs. Object replication asynchronously copies block blobs between accounts based on rules, with no tool to run.
    fr: L'Explorateur Stockage Azure est une application de bureau pour Windows, macOS et Linux qui permet de parcourir et de gérer les données de stockage et de générer des SAS. AzCopy est l'outil en ligne de commande des transferts scriptés ; `azcopy sync` ne charge que ce qui a changé, et `azcopy copy` entre comptes utilise des API de serveur à serveur. La réplication d'objets copie de façon asynchrone les objets blob de blocs entre comptes selon des règles, sans outil à exécuter.
  options:
    afs:
      en: Azure File Sync caches Azure file shares on Windows Server; it does not work with blob containers.
      fr: Azure File Sync met en cache des partages de fichiers Azure sur Windows Server ; il ne fonctionne pas avec les conteneurs d'objets blob.
    lifecycle:
      en: Lifecycle management moves blobs between access tiers or deletes them; it does not copy data to another account.
      fr: La gestion du cycle de vie déplace des objets blob entre niveaux d'accès ou les supprime ; elle ne copie pas de données vers un autre compte.
references:
  - title: Get started with Storage Explorer
    url: https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
  - title: Copy blobs between Azure storage accounts with AzCopy v10
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-copy
