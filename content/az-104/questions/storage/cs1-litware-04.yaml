id: cs1-litware-04
objective: "2.1.2"
type: single
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the upload requirement for the tenant-uploads container. The web app will generate the token for each upload.

    Which type of token should the web app generate?
  fr: |
    Vous devez satisfaire l'exigence de chargement pour le conteneur tenant-uploads. L'application web générera le jeton de chaque chargement.

    Quel type de jeton l'application web doit-elle générer ?
body:
  options:
    - { id: a, text: { en: "A user delegation SAS with the Create and Write permissions and an expiry time of 24 hours, signed with a user delegation key obtained by the web app's managed identity", fr: "Une SAS de délégation d'utilisateur avec les autorisations Create et Write et une heure d'expiration à 24 heures, signée avec une clé de délégation d'utilisateur obtenue par l'identité managée de l'application web" } }
    - { id: b, text: { en: "A service SAS on tenant-uploads that references a stored access policy with the Create and Write permissions", fr: "Une SAS de service sur tenant-uploads qui référence une stratégie d'accès stockée avec les autorisations Create et Write" } }
    - { id: c, text: { en: "An account SAS for the Blob service with the Create and Write permissions and an expiry time of 24 hours", fr: "Une SAS de compte pour le service Blob avec les autorisations Create et Write et une heure d'expiration à 24 heures" } }
    - { id: d, text: { en: "An access token for the web app's managed identity, sent to the browser", fr: "Un jeton d'accès de l'identité managée de l'application web, envoyé au navigateur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A user delegation SAS is signed with a user delegation key that is requested with Microsoft Entra credentials, not with an account key, so it works when shared key access is disabled. The managed identity's Storage Blob Data Contributor role allows it to request the key, and the SAS can be limited to Create and Write with a 24-hour expiry (a user delegation SAS can be valid for up to seven days).
    fr: |
      Une SAS de délégation d'utilisateur est signée avec une clé de délégation d'utilisateur obtenue avec des informations d'identification Microsoft Entra, et non avec une clé de compte ; elle fonctionne donc quand l'accès par clé partagée est désactivé. Le rôle Storage Blob Data Contributor de l'identité managée lui permet de demander la clé, et la SAS peut être limitée à Create et Write avec une expiration à 24 heures (une SAS de délégation d'utilisateur peut être valide jusqu'à sept jours).
  options:
    b: { en: "A service SAS is signed with an account key, which the requirement forbids and which is rejected because shared key access is disabled.", fr: "Une SAS de service est signée avec une clé de compte, ce que l'exigence interdit et qui est refusé puisque l'accès par clé partagée est désactivé." }
    c: { en: "An account SAS is also signed with an account key, and it is not limited to one container.", fr: "Une SAS de compte est elle aussi signée avec une clé de compte, et elle n'est pas limitée à un conteneur." }
    d: { en: "Handing the managed identity's token to browsers would give every customer all the permissions of the web app, for every container.", fr: "Remettre le jeton de l'identité managée aux navigateurs donnerait à chaque client toutes les autorisations de l'application web, sur tous les conteneurs." }
references:
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
  - title: Grant limited access to data with shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
