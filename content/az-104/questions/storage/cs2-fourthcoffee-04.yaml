id: cs2-fourthcoffee-04
objective: "2.1.1"
type: multi
caseStudy: cs2-fourthcoffee
difficulty: 2
status: draft
stem:
  en: |
    You set the public network access of stfctelemetry to **Enabled from selected virtual networks and IP addresses**. You need to complete the configuration to meet the network requirement for stfctelemetry.

    Which two actions should you perform? Each correct answer presents part of the solution.
  fr: |
    Vous définissez l'accès réseau public de stfctelemetry sur **Activé à partir des réseaux virtuels et adresses IP sélectionnés**. Vous devez compléter la configuration pour satisfaire l'exigence réseau concernant stfctelemetry.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on Snet-Ingest and add a virtual network rule for Snet-Ingest", fr: "Activer le point de terminaison de service Microsoft.Storage sur Snet-Ingest et ajouter une règle de réseau virtuel pour Snet-Ingest" } }
    - { id: b, text: { en: "Add an IP network rule for 203.0.113.0/27", fr: "Ajouter une règle de réseau IP pour 203.0.113.0/27" } }
    - { id: c, text: { en: "Create a private endpoint for the blob service in Snet-Ingest", fr: "Créer un point de terminaison privé pour le service blob dans Snet-Ingest" } }
    - { id: d, text: { en: "Add an IP network rule for 10.60.1.0/24", fr: "Ajouter une règle de réseau IP pour 10.60.1.0/24" } }
    - { id: e, text: { en: "Allow the Azure services on the trusted services list to access the account", fr: "Autoriser les services Azure de la liste des services approuvés à accéder au compte" } }
answer:
  optionIds: [a, b]
explanation:
  correct:
    en: |
      A service endpoint on Snet-Ingest plus a virtual network rule allows the IoT gateways at no extra charge. An IP network rule for the public range 203.0.113.0/27 allows the head office analysts. All other networks are denied by the firewall.
    fr: |
      Un point de terminaison de service sur Snet-Ingest associé à une règle de réseau virtuel autorise les passerelles IoT sans frais supplémentaires. Une règle de réseau IP pour la plage publique 203.0.113.0/27 autorise les analystes du siège. Tous les autres réseaux sont refusés par le pare-feu.
  options:
    c: { en: "A private endpoint works but adds hourly and data processing charges, so it does not minimize costs.", fr: "Un point de terminaison privé fonctionne mais ajoute des frais horaires et de traitement des données ; il ne réduit donc pas les coûts au minimum." }
    d: { en: "IP network rules accept only public IP addresses; private ranges are not allowed.", fr: "Les règles de réseau IP n'acceptent que des adresses IP publiques ; les plages privées ne sont pas autorisées." }
    e: { en: "The exception concerns specific Azure services, not the IoT gateways or the head office.", fr: "L'exception concerne certains services Azure, pas les passerelles IoT ni le siège." }
references:
  - title: "Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
