id: s1-files-identity-source-match
objective: "2.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are planning identity-based access over SMB to Azure file shares for three subsidiaries of Northwind. Each subsidiary has its own storage account.

    Which identity source should you enable for each subsidiary? To answer, drag the appropriate identity sources to the correct subsidiaries. Each identity source may be used once or not at all.
  fr: |
    Vous planifiez l'accès basé sur l'identité via SMB à des partages de fichiers Azure pour trois filiales de Northwind. Chaque filiale dispose de son propre compte de stockage.

    Quelle source d'identité devez-vous activer pour chaque filiale ? Pour répondre, faites glisser les sources d'identité appropriées vers les filiales correspondantes. Chaque source d'identité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: adds, text: { en: On-premises AD DS, fr: AD DS local } }
    - { id: aadds, text: Microsoft Entra Domain Services }
    - { id: kerb, text: Microsoft Entra Kerberos }
    - { id: key, text: { en: Storage account key, fr: Clé du compte de stockage } }
  targets:
    - id: t1
      text:
        en: "Subsidiary A: existing on-premises domain; Windows and Linux computers are domain-joined and reach the domain controllers over ExpressRoute"
        fr: "Filiale A : domaine local existant ; les ordinateurs Windows et Linux sont joints au domaine et joignent les contrôleurs de domaine via ExpressRoute"
    - id: t2
      text:
        en: "Subsidiary B: no on-premises domain; Azure VMs must be joined to a managed domain hosted in Azure for legacy applications"
        fr: "Filiale B : aucun domaine local ; les machines virtuelles Azure doivent être jointes à un domaine managé hébergé dans Azure pour des applications héritées"
    - id: t3
      text:
        en: "Subsidiary C: Microsoft Entra joined Azure Virtual Desktop session hosts store FSLogix profiles and have no domain controller connectivity"
        fr: "Filiale C : des hôtes de session Azure Virtual Desktop joints à Microsoft Entra stockent des profils FSLogix et n'ont aucune connectivité vers des contrôleurs de domaine"
answer:
  mapping: { t1: adds, t2: aadds, t3: kerb }
explanation:
  correct:
    en: On-premises AD DS fits an existing domain whose Windows and Linux clients can reach the domain controllers. Microsoft Entra Domain Services provides a managed domain in Azure; clients must be joined to it. Microsoft Entra Kerberos suits Microsoft Entra joined clients and FSLogix profiles, because Microsoft Entra ID issues the Kerberos tickets and no domain controller connectivity is needed.
    fr: AD DS local convient à un domaine existant dont les clients Windows et Linux joignent les contrôleurs de domaine. Microsoft Entra Domain Services fournit un domaine managé dans Azure, auquel les clients doivent être joints. Microsoft Entra Kerberos convient aux clients joints à Microsoft Entra et aux profils FSLogix, car Microsoft Entra ID émet les tickets Kerberos sans connectivité vers des contrôleurs de domaine.
  options:
    key:
      en: The storage account key gives full, non-identity-based access and is not an identity source.
      fr: La clé du compte de stockage donne un accès complet non basé sur l'identité et n'est pas une source d'identité.
references:
  - title: Overview - Azure Files identity-based authentication
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
