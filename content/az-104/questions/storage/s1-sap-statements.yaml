id: s1-sap-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use stored access policies to manage the service SAS tokens of a storage account named **stnorthwind**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous utilisez des stratégies d'accès stockées pour gérer les jetons SAS de service d'un compte de stockage nommé **stnorthwind**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You can define a stored access policy on an Azure file share in stnorthwind.
        fr: Vous pouvez définir une stratégie d'accès stockée sur un partage de fichiers Azure de stnorthwind.
    - id: s2
      text:
        en: After you create a stored access policy, requests that use a SAS bound to it can fail with error 403 for up to 30 seconds.
        fr: Après la création d'une stratégie d'accès stockée, les demandes qui utilisent une SAS liée à cette stratégie peuvent échouer avec l'erreur 403 pendant 30 secondes au maximum.
    - id: s3
      text:
        en: If a stored access policy defines an expiry time, a SAS that references it can also specify its own expiry time to override the policy.
        fr: Si une stratégie d'accès stockée définit une heure d'expiration, une SAS qui la référence peut aussi spécifier sa propre heure d'expiration pour remplacer celle de la stratégie.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Stored access policies are supported on blob containers, file shares, queues and tables. A new or updated policy can take up to 30 seconds to become active, and during that time associated SAS requests may return 403. The start time, expiry time and permissions can be set on the policy or on the SAS, but a given parameter cannot be set on both.
    fr: Les stratégies d'accès stockées sont prises en charge sur les conteneurs d'objets blob, les partages de fichiers, les files d'attente et les tables. Une stratégie créée ou modifiée peut mettre jusqu'à 30 secondes à devenir active ; pendant ce délai, les demandes avec une SAS associée peuvent renvoyer 403. L'heure de début, l'heure d'expiration et les autorisations peuvent figurer dans la stratégie ou dans la SAS, mais un même paramètre ne peut pas figurer dans les deux.
  options:
    s3:
      en: Specifying the same parameter in both places is not allowed, so a SAS cannot override a value defined by its policy.
      fr: Spécifier le même paramètre aux deux endroits n'est pas autorisé ; une SAS ne peut donc pas remplacer une valeur définie par sa stratégie.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
