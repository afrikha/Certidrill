id: cs3-lucerne-02
objective: "2.2.4"
type: multi
caseStudy: cs3-lucerne
difficulty: 3
status: draft
stem:
  en: |
    You need to prepare the environment so that you can configure stlucarchive to meet the encryption requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.
  fr: |
    Vous devez préparer l'environnement afin de pouvoir configurer stlucarchive pour satisfaire l'exigence de chiffrement.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable purge protection on kv-lucerne-sec.", fr: "Activer la protection contre la purge sur kv-lucerne-sec." } }
    - { id: b, text: { en: "Enable a system-assigned managed identity on stlucarchive and assign it the Key Vault Crypto Service Encryption User role on contracts-cmk.", fr: "Activer une identité managée affectée par le système sur stlucarchive et lui attribuer le rôle Key Vault Crypto Service Encryption User sur contracts-cmk." } }
    - { id: c, text: { en: "Enable infrastructure encryption on stlucarchive.", fr: "Activer le chiffrement de l'infrastructure sur stlucarchive." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets User role on kv-lucerne-sec to the storage account.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-lucerne-sec au compte de stockage." } }
    - { id: e, text: { en: "Copy the URI of the current version of contracts-cmk, including the version identifier, to use in the encryption settings.", fr: "Copier l'URI de la version actuelle de contracts-cmk, identificateur de version compris, pour l'utiliser dans les paramètres de chiffrement." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "A key vault that holds customer-managed keys for Azure Storage must have both soft delete and purge protection enabled; kv-lucerne-sec has purge protection disabled. Azure Storage reaches the key through a managed identity that needs the get, wrapKey and unwrapKey permissions, which the Key Vault Crypto Service Encryption User role grants. For an existing account, a system-assigned identity is supported."
    fr: "Un coffre de clés qui contient des clés gérées par le client pour Stockage Azure doit avoir la suppression réversible et la protection contre la purge activées ; la protection contre la purge est désactivée sur kv-lucerne-sec. Stockage Azure accède à la clé via une identité managée qui a besoin des autorisations get, wrapKey et unwrapKey, accordées par le rôle Key Vault Crypto Service Encryption User. Pour un compte existant, une identité affectée par le système est prise en charge."
  options:
    c: { en: "Infrastructure encryption adds a second layer of encryption, can only be enabled when the account is created, and isn't required to use a customer-managed key.", fr: "Le chiffrement de l'infrastructure ajoute une seconde couche de chiffrement, ne peut être activé qu'à la création du compte et n'est pas nécessaire pour utiliser une clé gérée par le client." }
    d: { en: "The customer-managed key is a key, not a secret; Key Vault Secrets User doesn't grant wrapKey and unwrapKey.", fr: "La clé gérée par le client est une clé, pas un secret ; Key Vault Secrets User n'accorde pas wrapKey et unwrapKey." }
    e: { en: "If you specify a key version, the account keeps using that version until you update it manually. Omit the version to use new versions automatically.", fr: "Si vous indiquez une version de clé, le compte continue d'utiliser cette version jusqu'à une mise à jour manuelle. Omettez la version pour utiliser automatiquement les nouvelles versions." }
references:
  - title: "Customer-managed keys for account encryption - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
