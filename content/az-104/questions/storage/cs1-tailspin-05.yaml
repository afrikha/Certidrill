id: cs1-tailspin-05
objective: "2.3.4"
type: yesno_statements
caseStudy: cs1-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You plan to enable soft delete with a retention period of 14 days for the file shares of stbuilds, and to take daily share snapshots of builds.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer la suppression réversible avec une période de rétention de 14 jours pour les partages de fichiers de stbuilds, et de prendre des instantanés de partage quotidiens de builds.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The soft delete setting is configured on stbuilds and applies to all the file shares in the storage account.
        fr: |
          Le paramètre de suppression réversible se configure sur stbuilds et s'applique à tous les partages de fichiers du compte de stockage.
    - id: s2
      text:
        en: |
          Soft delete lets you undelete an individual build file that was deleted from the builds share.
        fr: |
          La suppression réversible permet d'annuler la suppression d'un fichier de build individuel supprimé du partage builds.
    - id: s3
      text:
        en: |
          If the builds share is deleted and then undeleted, its share snapshots are restored with it.
        fr: |
          Si le partage builds est supprimé puis restauré, ses instantanés de partage sont restaurés avec lui.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Soft delete for Azure Files is enabled at the storage account level and applies to every file share, with a retention period between 1 and 365 days. It works only at the share level, so individual files are recovered from share snapshots or Azure file share backup. When a soft-deleted share is undeleted, the share and all its contents, including its snapshots, are restored.
    fr: |
      La suppression réversible pour Azure Files s'active au niveau du compte de stockage et s'applique à chaque partage de fichiers, avec une période de rétention comprise entre 1 et 365 jours. Elle ne fonctionne qu'au niveau du partage ; les fichiers individuels se récupèrent à partir d'instantanés de partage ou de la sauvegarde de partage de fichiers Azure. Quand un partage supprimé de manière réversible est restauré, le partage et tout son contenu, y compris ses instantanés, sont restaurés.
  options:
    s2: { en: "File share soft delete protects whole shares, not individual files; use share snapshots to restore a file.", fr: "La suppression réversible des partages de fichiers protège des partages entiers, pas des fichiers individuels ; utilisez les instantanés de partage pour restaurer un fichier." }
references:
  - title: Azure file share soft delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
  - title: Use Azure Files share snapshots
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
