id: cs2-woodgrove-02
objective: "2.1.5"
type: dropdown
caseStudy: cs2-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    You need to configure access to the finance-reports file share for the finance staff. The solution must meet the business and technical requirements.

    How should you complete the configuration? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer l'accès au partage de fichiers finance-reports pour le personnel financier. La solution doit respecter les exigences métier et techniques.

    Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Identity source to enable on stwgfinance: [[source]]

      Share-level role to assign to GRP-Finance: [[role]]
    fr: |
      Source d'identité à activer sur stwgfinance : [[source]]

      Rôle au niveau du partage à attribuer à GRP-Finance : [[role]]
  slots:
    - id: source
      options:
        - { id: adds, text: { en: "On-premises AD DS", fr: "AD DS local" } }
        - { id: entrads, text: "Microsoft Entra Domain Services" }
        - { id: kerb, text: "Microsoft Entra Kerberos" }
    - id: role
      options:
        - { id: reader, text: "Storage File Data SMB Share Reader" }
        - { id: contrib, text: "Storage File Data SMB Share Contributor" }
        - { id: elevated, text: "Storage File Data SMB Share Elevated Contributor" }
answer:
  values: { source: adds, role: contrib }
explanation:
  correct:
    en: The computers are joined to the AD DS domain only, so on-premises AD DS authentication lets the finance staff use their existing Kerberos credentials, and the domain controllers are reachable over ExpressRoute. Storage File Data SMB Share Contributor grants read, write and delete access without the right to modify ACLs.
    fr: Les ordinateurs sont joints uniquement au domaine AD DS ; l'authentification AD DS locale permet donc au personnel financier d'utiliser ses informations d'identification Kerberos existantes, et les contrôleurs de domaine sont joignables via ExpressRoute. Storage File Data SMB Share Contributor accorde la lecture, l'écriture et la suppression sans le droit de modifier les ACL.
  options:
    entrads:
      en: Microsoft Entra Domain Services is an additional managed domain, which requirement 6 forbids.
      fr: Microsoft Entra Domain Services est un domaine managé supplémentaire, ce que l'exigence 6 interdit.
    kerb:
      en: In its standard flow, Microsoft Entra Kerberos requires Microsoft Entra joined or hybrid joined clients, and every client must be configured to retrieve Kerberos tickets from Microsoft Entra ID, which requirement 1 forbids.
      fr: Dans son flux standard, Microsoft Entra Kerberos exige des clients joints à Microsoft Entra ou joints à Microsoft Entra hybride, et chaque client doit être configuré pour obtenir des tickets Kerberos auprès de Microsoft Entra ID, ce que l'exigence 1 interdit.
    elevated:
      en: The Elevated Contributor role also allows the members to modify the ACLs.
      fr: Le rôle Elevated Contributor permet aussi aux membres de modifier les ACL.
    reader:
      en: The Reader role grants read access only.
      fr: Le rôle Reader n'accorde que l'accès en lecture.
references:
  - title: "Overview - Azure Files Identity-Based Authentication"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
  - title: "Assign Share-Level Permissions for Azure Files"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
