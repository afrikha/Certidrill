id: s2-account-smb-nfs-shares
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to migrate two file servers to Azure Files:

    - **FS1** is used by Windows clients over the SMB protocol.
    - **FS2** is used by Linux application servers that require the NFS protocol.

    You need to host both workloads in a single new storage account.

    Which type of storage account should you create?
  fr: |
    Fabrikam prévoit de migrer deux serveurs de fichiers vers Azure Files :

    - **FS1** est utilisé par des clients Windows via le protocole SMB.
    - **FS2** est utilisé par des serveurs d'applications Linux qui exigent le protocole NFS.

    Vous devez héberger les deux charges de travail dans un seul nouveau compte de stockage.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "Standard general-purpose v2 with zone-redundant storage (ZRS)", fr: "Usage général v2 standard avec stockage redondant interzone (ZRS)" }
    - id: b
      text: { en: "Premium file shares", fr: "Partages de fichiers Premium" }
    - id: c
      text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" }
    - id: d
      text: { en: "Standard general-purpose v2 with a hierarchical namespace", fr: "Usage général v2 standard avec un espace de noms hiérarchique" }
answer: { optionId: b }
explanation:
  correct:
    en: The premium file shares account type (kind `FileStorage`) is the account type to use when you need NFS file shares in Azure Files, and it supports both SMB and NFS shares in the same account.
    fr: Le type de compte de partages de fichiers Premium (type `FileStorage`) est celui à utiliser lorsque vous avez besoin de partages de fichiers NFS dans Azure Files, et il prend en charge des partages SMB et NFS dans le même compte.
  options:
    a:
      en: Standard general-purpose v2 accounts host SMB file shares, but NFS support in Azure Files requires the premium file shares account type. The redundancy option does not change this.
      fr: Les comptes usage général v2 standard hébergent des partages de fichiers SMB, mais la prise en charge de NFS dans Azure Files exige le type de compte de partages de fichiers Premium. L'option de redondance n'y change rien.
    c:
      en: Premium block blob accounts support only Blob Storage, not Azure Files.
      fr: Les comptes d'objets blob de blocs Premium ne prennent en charge que le Stockage Blob, pas Azure Files.
    d:
      en: A hierarchical namespace enables Data Lake Storage capabilities for blobs; it does not add NFS support to Azure Files.
      fr: Un espace de noms hiérarchique active les fonctionnalités Data Lake Storage pour les objets blob ; il n'ajoute pas la prise en charge de NFS à Azure Files.
references:
  - title: Storage account overview
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
