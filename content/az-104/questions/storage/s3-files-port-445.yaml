id: s3-files-port-445
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stcontosofiles** that contains an SMB Azure file share named **docs**. The share is reachable through its public endpoint.

    A user on an on-premises Windows 11 computer cannot map the share. You run `Test-NetConnection -ComputerName stcontosofiles.file.core.windows.net` on the computer, and the TCP test fails.

    Which outbound TCP port is most likely blocked by the on-premises firewall or the internet service provider?
  fr: |
    Vous disposez d'un compte de stockage nommé **stcontosofiles** qui contient un partage de fichiers Azure SMB nommé **docs**. Le partage est accessible par son point de terminaison public.

    Un utilisateur d'un ordinateur Windows 11 local ne parvient pas à mapper le partage. Vous exécutez `Test-NetConnection -ComputerName stcontosofiles.file.core.windows.net` sur l'ordinateur, et le test TCP échoue.

    Quel port TCP sortant est le plus probablement bloqué par le pare-feu local ou par le fournisseur d'accès Internet ?
body:
  options:
    - { id: a, text: "445" }
    - { id: b, text: "443" }
    - { id: c, text: "2049" }
    - { id: d, text: "3389" }
answer: { optionId: a }
explanation:
  correct:
    en: The SMB protocol uses TCP port 445, and many organizations and internet service providers block outbound traffic on this port. When port 445 is blocked, mounting an SMB Azure file share over the public endpoint fails; a VPN or ExpressRoute connection with a private endpoint avoids exposing it to the internet.
    fr: Le protocole SMB utilise le port TCP 445, que de nombreuses organisations et de nombreux fournisseurs d'accès bloquent en sortie. Lorsque le port 445 est bloqué, le montage d'un partage SMB par le point de terminaison public échoue ; une connexion VPN ou ExpressRoute avec un point de terminaison privé évite de l'exposer à Internet.
  options:
    b:
      en: Port 443 (HTTPS) is used by FileREST, the portal and the SDKs, not by SMB mounts.
      fr: Le port 443 (HTTPS) est utilisé par FileREST, le portail et les SDK, pas par les montages SMB.
    c:
      en: Port 2049 is used by NFS file shares, which are Linux-only and never reachable from the internet.
      fr: Le port 2049 est utilisé par les partages NFS, réservés à Linux et jamais accessibles depuis Internet.
    d:
      en: Port 3389 is used by RDP, not by file shares.
      fr: Le port 3389 est utilisé par RDP, pas par les partages de fichiers.
references:
  - title: Mount SMB Azure file share on Windows
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows
