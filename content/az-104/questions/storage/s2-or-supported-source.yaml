id: s2-or-supported-source
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a premium block blob storage account named **stwingdest** that has blob versioning enabled. You plan to use it as the destination of an object replication policy. Wingtip Toys also has the following storage accounts. Blob versioning and the change feed are enabled on all of them.

    | Name | Account type | Configuration |
    | --- | --- | --- |
    | stwing1 | Standard general-purpose v2 | Hierarchical namespace enabled |
    | stwing2 | Premium block blobs | Default settings |
    | stwing3 | Premium page blobs | Stores VM disks (VHD files) |
    | stwing4 | Premium file shares | Stores SMB file shares |

    Which account can you use as the source account of the replication policy?
  fr: |
    Wingtip Toys dispose d'un compte de stockage objets blob de blocs Premium nommé **stwingdest**, dont le contrôle de version des objets blob est activé. Vous prévoyez de l'utiliser comme destination d'une stratégie de réplication d'objets. Wingtip Toys dispose aussi des comptes de stockage suivants. Le contrôle de version des objets blob et le flux de modification sont activés sur tous ces comptes.

    | Nom | Type de compte | Configuration |
    | --- | --- | --- |
    | stwing1 | Usage général v2 standard | Espace de noms hiérarchique activé |
    | stwing2 | Objets blob de blocs Premium | Paramètres par défaut |
    | stwing3 | Objets blob de pages Premium | Stocke des disques de VM (fichiers VHD) |
    | stwing4 | Partages de fichiers Premium | Stocke des partages de fichiers SMB |

    Quel compte pouvez-vous utiliser comme compte source de la stratégie de réplication ?
body:
  options:
    - { id: a, text: stwing1 }
    - { id: b, text: stwing2 }
    - { id: c, text: stwing3 }
    - { id: d, text: stwing4 }
answer: { optionId: b }
explanation:
  correct:
    en: Object replication supports general-purpose v2 and premium block blob accounts as source and destination, and it replicates block blobs only. stwing2 is a premium block blob account with versioning and the change feed enabled, so it can be the source.
    fr: "La réplication d'objets prend en charge les comptes usage général v2 et objets blob de blocs Premium comme source et destination, et elle ne réplique que les objets blob de blocs. stwing2 est un compte objets blob de blocs Premium dont le contrôle de version et le flux de modification sont activés : il peut donc être la source."
  options:
    a:
      en: Object replication is not supported in accounts that have a hierarchical namespace enabled.
      fr: La réplication d'objets n'est pas prise en charge dans les comptes dont l'espace de noms hiérarchique est activé.
    c:
      en: Premium page blob accounts are not supported, and object replication does not replicate page blobs.
      fr: Les comptes objets blob de pages Premium ne sont pas pris en charge, et la réplication d'objets ne réplique pas les objets blob de pages.
    d:
      en: Object replication copies block blobs between containers; it does not apply to Azure Files shares.
      fr: La réplication d'objets copie des objets blob de blocs entre conteneurs ; elle ne s'applique pas aux partages Azure Files.
references:
  - title: Object replication overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
