id: s2-or-policy-json-steps
objective: "2.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have two general-purpose v2 storage accounts in the same Microsoft Entra tenant: **stsrc** and **stdst**. The containers **invoices** (in stsrc) and **invoices-dr** (in stdst) already exist. No data protection feature is enabled on either account yet.

    The administrators of the two accounts are in different teams, so you must configure object replication by using policy definition files (JSON) with Azure PowerShell instead of the Azure portal.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux comptes de stockage à usage général v2 dans le même locataire Microsoft Entra : **stsrc** et **stdst**. Les conteneurs **invoices** (dans stsrc) et **invoices-dr** (dans stdst) existent déjà. Aucune fonctionnalité de protection des données n'est encore activée sur ces comptes.

    Les administrateurs des deux comptes appartiennent à des équipes différentes : vous devez donc configurer la réplication d'objets avec des fichiers de définition de stratégie (JSON) et Azure PowerShell plutôt qu'avec le portail Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: prereq, text: { en: "Enable blob versioning on both accounts and the change feed on stsrc.", fr: "Activer le contrôle de version des objets blob sur les deux comptes et le flux de modification sur stsrc." } }
    - { id: dstpolicy, text: { en: "Create the replication policy on stdst with the policy ID set to `default`.", fr: "Créer la stratégie de réplication sur stdst avec l'ID de stratégie `default`." } }
    - { id: download, text: { en: "Download the policy definition from stdst to obtain the generated policy and rule IDs.", fr: "Télécharger la définition de stratégie depuis stdst pour obtenir les ID de stratégie et de règle générés." } }
    - { id: srcpolicy, text: { en: "Create the replication policy on stsrc by using the downloaded policy definition.", fr: "Créer la stratégie de réplication sur stsrc à l'aide de la définition de stratégie téléchargée." } }
    - { id: srcfirst, text: { en: "Create the replication policy on stsrc with the policy ID set to `default`.", fr: "Créer la stratégie de réplication sur stsrc avec l'ID de stratégie `default`." } }
    - { id: xtenant, text: { en: "Set the **AllowCrossTenantReplication** property to true on both accounts.", fr: "Définir la propriété **AllowCrossTenantReplication** sur true sur les deux comptes." } }
    - { id: hns, text: { en: "Enable a hierarchical namespace on stdst.", fr: "Activer un espace de noms hiérarchique sur stdst." } }
answer:
  sequence: [prereq, dstpolicy, download, srcpolicy]
explanation:
  correct:
    en: Versioning on both accounts and the change feed on the source are prerequisites. The policy is created first on the destination account with the policy ID `default` and empty rule IDs; Azure Storage generates the IDs. You then download that definition and use it to create the policy on the source account, because the policy ID must be the same on both accounts.
    fr: Le contrôle de version sur les deux comptes et le flux de modification sur la source sont des prérequis. La stratégie est créée d'abord sur le compte de destination avec l'ID de stratégie `default` et des ID de règle vides ; Stockage Azure génère les ID. Vous téléchargez ensuite cette définition et l'utilisez pour créer la stratégie sur le compte source, car l'ID de stratégie doit être identique sur les deux comptes.
  options:
    srcfirst:
      en: The policy is created on the destination account first; the source account uses the ID that the destination generated.
      fr: La stratégie est créée d'abord sur le compte de destination ; le compte source utilise l'ID généré par la destination.
    xtenant:
      en: Both accounts are in the same tenant, so cross-tenant replication does not need to be allowed.
      fr: Les deux comptes sont dans le même locataire ; il n'est donc pas nécessaire d'autoriser la réplication entre locataires.
    hns:
      en: Object replication is not supported in accounts that have a hierarchical namespace enabled.
      fr: La réplication d'objets n'est pas prise en charge dans les comptes dont l'espace de noms hiérarchique est activé.
references:
  - title: Object replication overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
  - title: Configure object replication for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-configure
