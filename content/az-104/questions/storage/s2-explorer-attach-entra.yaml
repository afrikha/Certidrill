id: s2-explorer-attach-entra
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data analyst named **User2** has the **Storage Blob Data Reader** role on the container **sales** of the storage account **stsales01**. User2 has no role assignment at the management plane (no Azure Resource Manager permissions) on the storage account, its resource group or the subscription.

    User2 signs in to Azure Storage Explorer with a Microsoft Entra account, but stsales01 does not appear in the list of storage accounts.

    You need User2 to be able to browse and download the blobs of the **sales** container in Storage Explorer. The solution must not grant User2 any additional permissions.

    What should User2 do?
  fr: |
    Une analyste de données nommée **User2** dispose du rôle **Storage Blob Data Reader** sur le conteneur **sales** du compte de stockage **stsales01**. User2 n'a aucune attribution de rôle sur le plan de gestion (aucune autorisation Azure Resource Manager) sur le compte de stockage, son groupe de ressources ou l'abonnement.

    User2 se connecte à l'Explorateur Stockage Azure avec un compte Microsoft Entra, mais stsales01 n'apparaît pas dans la liste des comptes de stockage.

    Vous devez permettre à User2 de parcourir et de télécharger les objets blob du conteneur **sales** dans l'Explorateur Stockage Azure. La solution ne doit accorder aucune autorisation supplémentaire à User2.

    Que doit faire User2 ?
body:
  options:
    - id: a
      text: { en: "Attach the blob container by using its URL and the **Sign in using Microsoft Entra ID** option.", fr: "Attacher le conteneur d'objets blob à l'aide de son URL et de l'option **Sign in using Microsoft Entra ID**." }
    - id: b
      text: { en: "Attach the storage account by using the account name and an account key.", fr: "Attacher le compte de stockage à l'aide du nom du compte et d'une clé de compte." }
    - id: c
      text: { en: "Generate an account SAS from the Storage Explorer context menu of stsales01.", fr: "Générer une SAS de compte depuis le menu contextuel de stsales01 dans l'Explorateur Stockage Azure." }
    - id: d
      text: { en: "Connect to the local storage emulator and import the container.", fr: "Se connecter à l'émulateur de stockage local et importer le conteneur." }
answer: { optionId: a }
explanation:
  correct:
    en: When User2 signs in to a subscription, Storage Explorer lists accounts through Azure Resource Manager, which requires management-plane permissions. With data-layer access only, Microsoft recommends attaching the individual resource with **Sign in using Microsoft Entra ID** and its URL; the Storage Blob Data Reader role then authorizes listing and downloading the blobs.
    fr: "Lorsque User2 se connecte à un abonnement, l'Explorateur Stockage Azure liste les comptes via Azure Resource Manager, ce qui exige des autorisations sur le plan de gestion. Avec un accès au seul plan de données, Microsoft recommande d'attacher la ressource individuelle avec l'option de connexion Microsoft Entra ID et son URL : le rôle Storage Blob Data Reader autorise alors la liste et le téléchargement des objets blob."
  options:
    b:
      en: User2 has no permission to read the account keys, and using a key would bypass the least-privilege data role.
      fr: User2 n'a pas l'autorisation de lire les clés du compte, et utiliser une clé contournerait le rôle de données à moindre privilège.
    c:
      en: User2 cannot see the account in Storage Explorer, and an account SAS is signed with an account key that User2 cannot access.
      fr: User2 ne voit pas le compte dans l'Explorateur Stockage Azure, et une SAS de compte est signée avec une clé de compte à laquelle User2 n'a pas accès.
    d:
      en: The storage emulator is a local development environment; it gives no access to data in Azure.
      fr: L'émulateur de stockage est un environnement de développement local ; il ne donne aucun accès aux données dans Azure.
references:
  - title: Get started with Storage Explorer
    url: https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
