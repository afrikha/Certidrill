id: s1-fw-resource-instance
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Microsoft Entra tenant contains an Azure Synapse Analytics workspace named **synfabrikam** and a storage account named **stfabdata**, both in North Europe. Public network access on stfabdata is set to **Enabled from selected networks**.

    synfabrikam must read data in stfabdata by using its system-assigned managed identity, which already has the Storage Blob Data Reader role on the account. No other Synapse workspace and no other Azure service must be allowed through the firewall.

    What should you configure on stfabdata?
  fr: |
    Votre locataire Microsoft Entra contient un espace de travail Azure Synapse Analytics nommé **synfabrikam** et un compte de stockage nommé **stfabdata**, tous deux dans la région North Europe. L'accès réseau public de stfabdata est défini sur **Activé à partir des réseaux sélectionnés**.

    synfabrikam doit lire les données de stfabdata avec son identité managée affectée par le système, qui dispose déjà du rôle Storage Blob Data Reader sur le compte. Aucun autre espace de travail Synapse ni aucun autre service Azure ne doit être autorisé à traverser le pare-feu.

    Que devez-vous configurer sur stfabdata ?
body:
  options:
    - id: a
      text:
        en: A resource instance rule for synfabrikam
        fr: Une règle d'instance de ressource pour synfabrikam
    - id: b
      text:
        en: The exception that allows Azure services on the trusted services list
        fr: L'exception qui autorise les services Azure de la liste des services approuvés
    - id: c
      text:
        en: An IP network rule that contains the outbound IP addresses of synfabrikam
        fr: Une règle de réseau IP contenant les adresses IP sortantes de synfabrikam
    - id: d
      text:
        en: A virtual network rule for the subnet used by the Synapse service
        fr: Une règle de réseau virtuel pour le sous-réseau utilisé par le service Synapse
answer: { optionId: a }
explanation:
  correct:
    en: A resource instance rule lets a specific Azure resource instance from the same tenant through the firewall, even though it cannot be isolated by IP or virtual network rules. The rule opens the network path only; data access still comes from the role assigned to the instance's managed identity, which is already in place.
    fr: Une règle d'instance de ressource laisse passer à travers le pare-feu une instance de ressource Azure précise du même locataire, même si elle ne peut pas être isolée par des règles IP ou de réseau virtuel. La règle n'ouvre que le chemin réseau ; l'accès aux données provient toujours du rôle attribué à l'identité managée de l'instance, déjà en place.
  options:
    b:
      en: The trusted services exception is not scoped to one instance; it would also let other trusted services and other workspaces in, which the requirement forbids.
      fr: L'exception des services approuvés n'est pas limitée à une instance ; elle laisserait aussi passer d'autres services approuvés et d'autres espaces de travail, ce que l'exigence interdit.
    c:
      en: Azure services in the same region as the storage account communicate over private Azure addresses, so IP network rules cannot restrict them.
      fr: Les services Azure situés dans la même région que le compte de stockage communiquent par des adresses Azure privées ; les règles de réseau IP ne peuvent donc pas les filtrer.
    d:
      en: The Synapse workspace is a multitenant service that does not run in one of your subnets, so there is no subnet to allow.
      fr: L'espace de travail Synapse est un service mutualisé qui ne s'exécute pas dans l'un de vos sous-réseaux ; il n'y a donc aucun sous-réseau à autoriser.
references:
