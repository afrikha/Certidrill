seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You allow selected networks only and enable the trusted Azure services exception.
  fr: |
    Vous autorisez uniquement les réseaux sélectionnés et activez l'exception pour les services Azure approuvés.
body:
  solution:
    en: |
      On stor1, you set public network access to **Enabled from selected virtual networks and IP addresses** without adding any network rule, and you select the exception that allows **Azure services on the trusted services list** to access the storage account.
    fr: |
      Sur stor1, vous définissez l'accès réseau public sur **Enabled from selected virtual networks and IP addresses** sans ajouter de règle réseau, et vous sélectionnez l'exception qui autorise les **services Azure figurant dans la liste des services approuvés** à accéder au compte de stockage.
answer: { value: false }
explanation:
  correct:
    en: |
      The trusted services exception lets specific Azure services that run outside your network reach the account; it doesn't cover virtual machines that you deploy in a virtual network. With no virtual network rule, the requests of the virtual machines are rejected like any other request, so the goal isn't met.
    fr: |
      L'exception pour les services approuvés permet à certains services Azure qui s'exécutent hors de votre réseau d'atteindre le compte ; elle ne couvre pas les machines virtuelles que vous déployez dans un réseau virtuel. Sans règle de réseau virtuel, les requêtes des machines virtuelles sont rejetées comme toutes les autres : l'objectif n'est pas atteint.
references:
  - title: "Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
