id: sr-03-q2
objective: "2.2.2"
type: series_yesno
series: sr-03-read-secondary
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You configure stor1 to use read-access geo-redundant storage (RA-GRS).
  fr: |
    Vous configurez stor1 pour utiliser le stockage géoredondant avec accès en lecture (RA-GRS).
body:
  solution:
    en: |
      You create stor1 with **read-access geo-redundant storage (RA-GRS)**, and you configure App1 to read from the secondary endpoint `stor1-secondary.blob.core.windows.net` when the primary endpoint is unavailable.
    fr: |
      Vous créez stor1 avec le **stockage géoredondant avec accès en lecture (RA-GRS)**, et vous configurez App1 pour lire à partir du point de terminaison secondaire `stor1-secondary.blob.core.windows.net` lorsque le point de terminaison principal est indisponible.
answer: { value: true }
explanation:
  correct:
    en: |
      With RA-GRS, the data replicated to the secondary region is always readable through the secondary endpoint, including when the primary region is unavailable. No failover is needed for reads, and writes during the outage aren't required, so the goal is met.
    fr: |
      Avec RA-GRS, les données répliquées dans la région secondaire sont toujours lisibles via le point de terminaison secondaire, y compris lorsque la région primaire est indisponible. Aucun basculement n'est nécessaire pour les lectures, et les écritures pendant la panne ne sont pas requises : l'objectif est atteint.
references:
  - title: "Data redundancy - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
