id: s1-keys-rotation-sequence
objective: "2.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    All the applications of Contoso connect to a storage account named **stcontoso** by using a connection string based on key1. The keys are not stored in Azure Key Vault.

    You need to rotate both access keys of stcontoso without any application losing access.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Toutes les applications de Contoso se connectent à un compte de stockage nommé **stcontoso** avec une chaîne de connexion basée sur key1. Les clés ne sont pas stockées dans Azure Key Vault.

    Vous devez effectuer la rotation des deux clés d'accès de stcontoso sans qu'aucune application ne perde l'accès.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: to2
      text:
        en: Update the connection strings of the applications to use key2.
        fr: Mettre à jour les chaînes de connexion des applications pour utiliser key2.
    - id: regen1
      text:
        en: Regenerate key1.
        fr: Régénérer key1.
    - id: to1
      text:
        en: Update the connection strings of the applications to use the new key1.
        fr: Mettre à jour les chaînes de connexion des applications pour utiliser la nouvelle key1.
    - id: regen2
      text:
        en: Regenerate key2.
        fr: Régénérer key2.
    - id: disable
      text:
        en: Set Allow storage account key access to Disabled.
        fr: Définir Autoriser l'accès à la clé du compte de stockage sur Désactivé.
    - id: both
      text:
        en: Regenerate key1 and key2 at the same time.
        fr: Régénérer key1 et key2 en même temps.
answer:
  sequence: [to2, regen1, to1, regen2]
explanation:
  correct:
    en: Two keys exist so that one remains valid while the other is regenerated. Move the applications to key2, regenerate key1, move them to the new key1, and only then regenerate key2. At every step, the key in use is still valid.
    fr: Deux clés existent pour que l'une reste valide pendant que l'autre est régénérée. Basculez les applications sur key2, régénérez key1, basculez-les sur la nouvelle key1, puis seulement régénérez key2. À chaque étape, la clé utilisée reste valide.
  options:
    both:
      en: Regenerating both keys at once invalidates the key in use and interrupts the applications.
      fr: Régénérer les deux clés en même temps invalide la clé utilisée et interrompt les applications.
    disable:
      en: Disabling Shared Key access would block every request authorized with any account key.
      fr: Désactiver l'accès par clé partagée bloquerait toutes les demandes autorisées avec une clé de compte.
references:
  - title: Manage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
