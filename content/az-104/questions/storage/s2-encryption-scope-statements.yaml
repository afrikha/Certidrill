id: s2-encryption-scope-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum hosts data for several customers in a storage account named **stadatumsaas**. You plan to use encryption scopes so that the blobs of each customer are encrypted with a different key.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum héberge les données de plusieurs clients dans un compte de stockage nommé **stadatumsaas**. Vous prévoyez d'utiliser des étendues de chiffrement afin que les objets blob de chaque client soient chiffrés avec une clé différente.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In stadatumsaas, one encryption scope can use a Microsoft-managed key while another uses a customer-managed key stored in Azure Key Vault.
        fr: Dans stadatumsaas, une étendue de chiffrement peut utiliser une clé gérée par Microsoft tandis qu'une autre utilise une clé gérée par le client stockée dans Azure Key Vault.
    - id: s2
      text:
        en: When a customer leaves, you can delete its encryption scope to stop being billed for it.
        fr: Lorsqu'un client part, vous pouvez supprimer son étendue de chiffrement pour ne plus être facturé.
    - id: s3
      text:
        en: After you disable an encryption scope, read and write requests on blobs that use the scope fail with HTTP error 403 (Forbidden).
        fr: Après la désactivation d'une étendue de chiffrement, les requêtes de lecture et d'écriture sur les objets blob qui utilisent cette étendue échouent avec l'erreur HTTP 403 (Interdit).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Different encryption scopes in the same account can each use either a Microsoft-managed key or a customer-managed key. An encryption scope cannot be deleted; you disable it to stop the charges, and after the first 30 days billing is prorated hourly. Once a scope is disabled, operations made with it fail with error 403 until you enable it again.
    fr: Différentes étendues de chiffrement d'un même compte peuvent chacune utiliser une clé gérée par Microsoft ou une clé gérée par le client. Une étendue de chiffrement ne peut pas être supprimée ; vous la désactivez pour arrêter la facturation, qui est calculée au prorata horaire après les 30 premiers jours. Une fois l'étendue désactivée, les opérations effectuées avec elle échouent avec l'erreur 403 jusqu'à sa réactivation.
references:
  - title: Encryption scopes for Blob storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview
