id: sr-03-q1
objective: "2.2.2"
type: series_yesno
series: sr-03-read-secondary
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You configure stor1 to use geo-redundant storage (GRS).
  fr: |
    Vous configurez stor1 pour utiliser le stockage géoredondant (GRS).
body:
  solution:
    en: |
      You create stor1 with **geo-redundant storage (GRS)**.
    fr: |
      Vous créez stor1 avec le **stockage géoredondant (GRS)**.
answer: { value: false }
explanation:
  correct:
    en: |
      GRS copies the data asynchronously to the paired secondary region, but that copy isn't available for read or write access unless the storage account fails over to the secondary region. During an East US outage, App1 couldn't read the data until someone initiated a failover, so the goal isn't met.
    fr: |
      GRS copie les données de façon asynchrone vers la région secondaire jumelée, mais cette copie n'est accessible ni en lecture ni en écriture tant que le compte de stockage n'a pas basculé vers la région secondaire. Pendant une panne d'East US, App1 ne pourrait pas lire les données avant qu'une personne ne lance un basculement : l'objectif n'est pas atteint.
references:
  - title: "Data redundancy - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
