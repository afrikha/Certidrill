id: cs2-proseware-03
objective: "2.3.5"
type: dropdown
caseStudy: cs2-proseware
difficulty: 3
status: draft
stem:
  en: |
    You enable last access time tracking on stpwmedia. You need to create the lifecycle management rule for the recorded lectures. The solution must meet the technical requirements.

    How should you complete the rule? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez le suivi de l'heure d'accès sur stpwmedia. Vous devez créer la règle de gestion du cycle de vie des cours enregistrés. La solution doit respecter les exigences techniques.

    Comment devez-vous compléter la règle ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "actions": {
      "baseBlob": {
        "[[action]]": { "[[condition]]": 60 },
        "delete": { "daysAfterModificationGreaterThan": [[days]] }
      }
    },
    "filters": { "blobTypes": [ "blockBlob" ], "prefixMatch": [ "lectures/" ] }
  slots:
    - id: action
      options:
        - { id: cool, text: "tierToCool" }
        - { id: archive, text: "tierToArchive" }
        - { id: cold, text: "tierToCold" }
    - id: condition
      options:
        - { id: mod, text: "daysAfterModificationGreaterThan" }
        - { id: access, text: "daysAfterLastAccessTimeGreaterThan" }
        - { id: creation, text: "daysAfterCreationGreaterThan" }
    - id: days
      options:
        - { id: d365, text: "365" }
        - { id: d1095, text: "1095" }
        - { id: d1825, text: "1825" }
answer:
  values: { action: cool, condition: access, days: d1095 }
explanation:
  correct:
    en: Requirement 5 is based on reads, so the rule must use daysAfterLastAccessTimeGreaterThan, which requires last access time tracking. The tierToCool action moves the blobs to the Cool tier, an online tier that needs no rehydration. Deletion uses the last modification date with 1,095 days.
    fr: L'exigence 5 repose sur les lectures ; la règle doit donc utiliser daysAfterLastAccessTimeGreaterThan, qui exige le suivi de l'heure d'accès. L'action tierToCool déplace les objets blob vers le niveau froid (Cool), un niveau en ligne qui ne demande pas de réhydratation. La suppression utilise la date de dernière modification avec 1 095 jours.
  options:
    archive: { en: "The Archive tier is offline: blobs must be rehydrated before they can be read.", fr: "Le niveau archive (Archive) est hors connexion : les objets blob doivent être réhydratés avant de pouvoir être lus." }
    cold: { en: "The requirement asks for the Cool tier, not the Cold tier.", fr: "L'exigence demande le niveau froid (Cool), pas le niveau froid (Cold)." }
    mod: { en: "A lecture can be read often without being modified; the condition must track reads.", fr: "Un cours peut être lu souvent sans être modifié ; la condition doit suivre les lectures." }
references:
  - title: "Azure Blob Storage lifecycle management overview - Azure Blob Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
