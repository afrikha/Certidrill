id: s1-keys-disable-shared-key
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a storage account named **sttailspin** that contains only block blobs. You plan to set **Allow storage account key access** to **Disabled** on sttailspin.

    Which two types of requests will still be authorized after the change? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un compte de stockage nommé **sttailspin** qui ne contient que des objets blob de blocs. Vous prévoyez de définir **Autoriser l'accès à la clé du compte de stockage** sur **Désactivé** pour sttailspin.

    Quels sont les deux types de demandes qui seront toujours autorisés après la modification ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: A request to a blob that uses a user delegation SAS
        fr: Une demande vers un objet blob qui utilise une SAS de délégation d'utilisateur
    - id: b
      text:
        en: A request from a managed identity that has the Storage Blob Data Reader role
        fr: Une demande d'une identité managée qui dispose du rôle Storage Blob Data Reader
    - id: c
      text:
        en: A request to a blob that uses a service SAS
        fr: Une demande vers un objet blob qui utilise une SAS de service
    - id: d
      text:
        en: A request to a blob that uses an account SAS created before the change
        fr: Une demande vers un objet blob qui utilise une SAS de compte créée avant la modification
    - id: e
      text:
        en: A request from an application that uses a connection string containing key2
        fr: Une demande d'une application qui utilise une chaîne de connexion contenant key2
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: When AllowSharedKeyAccess is false, only requests authorized with Microsoft Entra ID succeed. A request made by a managed identity with an Azure RBAC data role is authorized with Microsoft Entra ID, and a user delegation SAS is also authorized with Microsoft Entra ID because it is signed with a user delegation key.
    fr: Lorsque AllowSharedKeyAccess a la valeur false, seules les demandes autorisées avec Microsoft Entra ID réussissent. Une demande d'une identité managée disposant d'un rôle de données Azure RBAC est autorisée avec Microsoft Entra ID, tout comme une SAS de délégation d'utilisateur, puisqu'elle est signée avec une clé de délégation d'utilisateur.
  options:
    c:
      en: A service SAS is signed with the account key, so it is authorized with Shared Key and denied.
      fr: Une SAS de service est signée avec la clé de compte ; elle est donc autorisée par clé partagée et refusée.
    d:
      en: An account SAS is authorized with Shared Key, whenever it was created, and is denied.
      fr: Une SAS de compte est autorisée par clé partagée, quelle que soit sa date de création, et elle est refusée.
    e:
      en: A connection string with an account key uses Shared Key authorization, which returns 403 once it is disallowed.
      fr: Une chaîne de connexion avec une clé de compte utilise l'autorisation par clé partagée, qui renvoie 403 une fois interdite.
references:
  - title: Prevent authorization with Shared Key
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
