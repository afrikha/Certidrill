id: s1-fw-onprem-ip-rule
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Storage account named **stlitware01** in West Europe. Public network access is set to **Enabled from selected networks**, and no network rules are configured yet.

    Users in the Litware head office must access blob data in stlitware01 over the internet. All the office traffic leaves through the public IP address range 131.107.8.0/24. The office has no VPN or ExpressRoute connection to Azure.

    What should you add to the storage account firewall?
  fr: |
    Vous disposez d'un compte de stockage Azure nommé **stlitware01** dans la région West Europe. L'accès réseau public est défini sur **Activé à partir des réseaux sélectionnés** et aucune règle réseau n'est encore configurée.

    Les utilisateurs du siège de Litware doivent accéder aux données blob de stlitware01 via Internet. Tout le trafic du siège sort par la plage d'adresses IP publiques 131.107.8.0/24. Le siège ne dispose d'aucune connexion VPN ou ExpressRoute vers Azure.

    Que devez-vous ajouter au pare-feu du compte de stockage ?
body:
  options:
    - id: a
      text:
        en: An IP network rule for 131.107.8.0/24
        fr: Une règle de réseau IP pour 131.107.8.0/24
    - id: b
      text:
        en: A virtual network rule for the office address range
        fr: Une règle de réseau virtuel pour la plage d'adresses du siège
    - id: c
      text:
        en: A resource instance rule for the office network
        fr: Une règle d'instance de ressource pour le réseau du siège
    - id: d
      text:
        en: An IP network rule for the private range 192.168.0.0/16 used in the office
        fr: Une règle de réseau IP pour la plage privée 192.168.0.0/16 utilisée au siège
answer: { optionId: a }
explanation:
  correct:
    en: Clients that are not in an Azure virtual network, such as an on-premises office, are allowed through IP network rules. An IP network rule accepts a public IPv4 address or a public range in CIDR notation, so the office's internet-facing range 131.107.8.0/24 is the value to add.
    fr: Les clients qui ne se trouvent pas dans un réseau virtuel Azure, comme un siège local, sont autorisés au moyen de règles de réseau IP. Une règle de réseau IP accepte une adresse IPv4 publique ou une plage publique en notation CIDR ; c'est donc la plage 131.107.8.0/24 exposée sur Internet par le siège qu'il faut ajouter.
  options:
    b:
      en: A virtual network rule allows a subnet of an Azure virtual network that has a service endpoint; it cannot describe an on-premises address range.
      fr: Une règle de réseau virtuel autorise un sous-réseau d'un réseau virtuel Azure doté d'un point de terminaison de service ; elle ne peut pas décrire une plage d'adresses locale.
    c:
      en: Resource instance rules allow specific Azure resource instances (for example a Synapse workspace) from the same tenant, not on-premises clients.
      fr: Les règles d'instance de ressource autorisent des instances de ressources Azure précises (par exemple un espace de travail Synapse) du même locataire, pas des clients locaux.
    d:
      en: Private address ranges defined by RFC 1918 (10.x, 172.16–172.31, 192.168.x) are not allowed in IP network rules, and Azure only sees the public NAT address anyway.
      fr: Les plages d'adresses privées définies par la RFC 1918 (10.x, 172.16–172.31, 192.168.x) ne sont pas autorisées dans les règles de réseau IP, et Azure ne voit de toute façon que l'adresse publique traduite.
references:
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
