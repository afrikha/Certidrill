id: s3-files-snapshot-statements
objective: "2.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage an SMB Azure file share named **share1** in a storage account named **stnorthwind**. You plan to protect **share1** by using share snapshots.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un partage de fichiers Azure SMB nommé **share1** dans un compte de stockage nommé **stnorthwind**. Vous prévoyez de protéger **share1** avec des instantanés de partage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: share1 can have up to 200 share snapshots.
        fr: share1 peut avoir jusqu'à 200 instantanés de partage.
    - id: s2
      text:
        en: You can delete share1 and keep its share snapshots.
        fr: Vous pouvez supprimer share1 et conserver ses instantanés de partage.
    - id: s3
      text:
        en: The space used by the share snapshots counts toward the quota of share1.
        fr: L'espace utilisé par les instantanés de partage est décompté du quota de share1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Azure Files supports up to 200 share snapshots per share. Snapshots persist until you delete them or until the share is deleted; you cannot delete a share and keep its snapshots. Snapshots are incremental and don't count toward the maximum share size, although storage account limits still apply.
    fr: Azure Files prend en charge jusqu'à 200 instantanés par partage. Les instantanés sont conservés jusqu'à leur suppression ou jusqu'à la suppression du partage ; vous ne pouvez pas supprimer un partage en conservant ses instantanés. Les instantanés sont incrémentiels et ne sont pas décomptés de la taille maximale du partage, même si les limites du compte de stockage s'appliquent toujours.
references:
  - title: Use Azure Files Share Snapshots
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
