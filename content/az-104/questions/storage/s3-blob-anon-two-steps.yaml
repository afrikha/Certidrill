id: s3-blob-anon-two-steps
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stwoodgrove** that was created with **Allow Blob anonymous access** disabled. The account contains a private container named **public-docs**.

    You need to ensure that users on the internet can download the blobs in **public-docs** without any credentials or token. Users must not be able to list the blobs in the container.

    Which two actions should you perform? Each correct answer presents part of the solution.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stwoodgrove**, créé avec **Autoriser l'accès anonyme aux objets blob** désactivé. Le compte contient un conteneur privé nommé **public-docs**.

    Vous devez vous assurer que des utilisateurs sur Internet peuvent télécharger les objets blob de **public-docs** sans informations d'identification ni jeton. Les utilisateurs ne doivent pas pouvoir lister les objets blob du conteneur.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable **Allow Blob anonymous access** in the configuration of stwoodgrove.", fr: "Activer **Autoriser l'accès anonyme aux objets blob** dans la configuration de stwoodgrove." } }
    - { id: b, text: { en: Set the anonymous access level of public-docs to Blob., fr: "Définir le niveau d'accès anonyme de public-docs sur Blob." } }
    - { id: c, text: { en: Set the anonymous access level of public-docs to Container., fr: "Définir le niveau d'accès anonyme de public-docs sur Conteneur." } }
    - { id: d, text: { en: Generate a service SAS for public-docs with Read permission., fr: "Générer une SAS de service pour public-docs avec l'autorisation Lecture." } }
    - { id: e, text: { en: Assign the Storage Blob Data Reader role to All Users at the container scope., fr: "Attribuer le rôle Storage Blob Data Reader à Tous les utilisateurs dans l'étendue du conteneur." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Anonymous access needs two settings. The account must allow anonymous access (AllowBlobPublicAccess); otherwise you cannot set any container level that permits it. Then the container level Blob allows anonymous reads of blobs without listing.
    fr: "L'accès anonyme nécessite deux paramètres. Le compte doit autoriser l'accès anonyme (AllowBlobPublicAccess) ; sinon, aucun niveau de conteneur ne peut l'autoriser. Ensuite, le niveau Blob du conteneur autorise la lecture anonyme des objets blob sans énumération."
  options:
    c:
      en: The Container level also allows anonymous listing of the blobs.
      fr: Le niveau Conteneur autorise aussi l'énumération anonyme des objets blob.
    d:
      en: A SAS is a token; the requirement is access without any token.
      fr: Une SAS est un jeton ; l'exigence est un accès sans aucun jeton.
    e:
      en: Azure RBAC roles are assigned to Microsoft Entra security principals; they cannot grant access to unauthenticated internet users.
      fr: Les rôles Azure RBAC sont attribués à des principaux de sécurité Microsoft Entra ; ils ne peuvent pas donner accès à des utilisateurs Internet non authentifiés.
references:
  - title: Configure anonymous read access for containers and blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
