id: s2-redundancy-ra-gzrs
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating a general-purpose v2 storage account for the order-tracking application of Adatum. The account must meet the following requirements:

    - Remain available for reads and writes if one availability zone of the primary region fails.
    - Allow the application to keep reading data from another region if the entire primary region becomes unavailable, without waiting for a failover.

    Which redundancy option should you select?
  fr: |
    Vous créez un compte de stockage à usage général v2 pour l'application de suivi des commandes d'Adatum. Le compte doit répondre aux exigences suivantes :

    - Rester disponible en lecture et en écriture si une zone de disponibilité de la région primaire tombe en panne.
    - Permettre à l'application de continuer à lire les données depuis une autre région si toute la région primaire devient indisponible, sans attendre un basculement.

    Quelle option de redondance devez-vous sélectionner ?
body:
  options:
    - id: a
      text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
    - id: b
      text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" }
    - id: c
      text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" }
    - id: d
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
answer: { optionId: c }
explanation:
  correct:
    en: RA-GZRS replicates the data synchronously across three availability zones in the primary region and asynchronously to the secondary region, and it exposes a read-only secondary endpoint. The application can read from that endpoint during a regional outage without any failover.
    fr: RA-GZRS réplique les données de façon synchrone dans trois zones de disponibilité de la région primaire et de façon asynchrone vers la région secondaire, et il expose un point de terminaison secondaire en lecture seule. L'application peut lire depuis ce point de terminaison pendant une panne régionale, sans aucun basculement.
  options:
    a:
      en: GZRS meets the zone requirement, but the secondary copy is not readable until a failover occurs.
      fr: GZRS satisfait l'exigence de zone, mais la copie secondaire n'est pas accessible en lecture tant qu'aucun basculement n'a eu lieu.
    b:
      en: RA-GRS provides read access to the secondary region, but it uses LRS in the primary region, so a zone failure can make the primary unavailable.
      fr: RA-GRS fournit l'accès en lecture à la région secondaire, mais il utilise LRS dans la région primaire ; une panne de zone peut donc rendre la région primaire indisponible.
    d:
      en: ZRS protects against a zone failure but keeps all copies in the primary region.
      fr: ZRS protège contre une panne de zone mais conserve toutes les copies dans la région primaire.
references:
  - title: Data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
