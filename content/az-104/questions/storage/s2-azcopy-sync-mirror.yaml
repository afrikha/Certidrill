id: s2-azcopy-sync-mirror
objective: "2.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A scheduled task on a Windows server named **SRV-REP1** must keep the container **reports** of the storage account **stcontosorep** identical to the local folder **D:\Reports**. Files added or changed in D:\Reports must be uploaded, and blobs whose source file was deleted must be removed from the container without any confirmation prompt. AzCopy is already authorized with Microsoft Entra ID.

    How should you complete the AzCopy command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une tâche planifiée sur un serveur Windows nommé **SRV-REP1** doit maintenir le conteneur **reports** du compte de stockage **stcontosorep** identique au dossier local **D:\Reports**. Les fichiers ajoutés ou modifiés dans D:\Reports doivent être chargés, et les objets blob dont le fichier source a été supprimé doivent être retirés du conteneur sans aucune invite de confirmation. AzCopy est déjà autorisé avec Microsoft Entra ID.

    Comment devez-vous compléter la commande AzCopy ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    azcopy [[cmd]] 'D:\Reports' 'https://stcontosorep.blob.core.windows.net/reports' --recursive [[flag]]
  slots:
    - id: cmd
      options:
        - { id: copy, text: copy }
        - { id: sync, text: sync }
        - { id: make, text: make }
        - { id: remove, text: remove }
    - id: flag
      options:
        - { id: deltrue, text: "--delete-destination=true" }
        - { id: delprompt, text: "--delete-destination=prompt" }
        - { id: overwrite, text: "--overwrite=ifSourceNewer" }
        - { id: hash, text: "--compare-hash=MD5" }
answer:
  values: { cmd: sync, flag: deltrue }
explanation:
  correct:
    en: "`azcopy sync` compares the names and last modified times of the source and destination and transfers only what changed. Only sync can remove destination blobs that no longer exist in the source, and `--delete-destination=true` deletes them without prompting."
    fr: "`azcopy sync` compare les noms et les heures de dernière modification de la source et de la destination et ne transfère que ce qui a changé. Seul sync peut supprimer les objets blob de destination qui n'existent plus dans la source, et `--delete-destination=true` les supprime sans invite."
  options:
    copy: { en: "azcopy copy uploads files but never deletes blobs that were removed from the source.", fr: "azcopy copy charge des fichiers mais ne supprime jamais les objets blob retirés de la source." }
    make: { en: "azcopy make creates a container or file share.", fr: "azcopy make crée un conteneur ou un partage de fichiers." }
    remove: { en: "azcopy remove deletes blobs; it does not upload new or changed files.", fr: "azcopy remove supprime des objets blob ; il ne charge pas les fichiers nouveaux ou modifiés." }
    delprompt: { en: "prompt asks for confirmation before each deletion, which a scheduled task cannot answer.", fr: "prompt demande une confirmation avant chaque suppression, à laquelle une tâche planifiée ne peut pas répondre." }
    overwrite: { en: "--overwrite is a copy option that controls overwrites; it does not delete anything.", fr: "--overwrite est une option de copy qui contrôle les remplacements ; elle ne supprime rien." }
    hash: { en: "--compare-hash changes how changes are detected but does not enable deletions.", fr: "--compare-hash modifie la détection des changements mais n'active pas les suppressions." }
references:
  - title: Synchronize with Azure Blob storage by using AzCopy v10
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-synchronize
