id: s2-redundancy-requirements-match
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is creating four general-purpose v2 storage accounts. Each account has the requirements shown in the answer area, and each must use the least expensive redundancy option that meets its requirements.

    Which redundancy option should you select for each account? To answer, drag the appropriate options to the correct accounts. Each option may be used once or not at all.
  fr: |
    Woodgrove Bank crée quatre comptes de stockage à usage général v2. Chaque compte a les exigences indiquées dans la zone de réponse, et chacun doit utiliser l'option de redondance la moins chère qui répond à ses exigences.

    Quelle option de redondance devez-vous sélectionner pour chaque compte ? Pour répondre, faites glisser les options appropriées vers les comptes correspondants. Chaque option peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: lrs, text: "LRS" }
    - { id: zrs, text: "ZRS" }
    - { id: grs, text: "GRS" }
    - { id: ragrs, text: "RA-GRS" }
    - { id: gzrs, text: "GZRS" }
    - { id: ragzrs, text: "RA-GZRS" }
  targets:
    - id: dev
      text: { en: "stdev: test data that can be re-created; protection against a single disk or rack failure is enough", fr: "stdev : données de test pouvant être recréées ; une protection contre la panne d'un disque ou d'un rack suffit" }
    - id: local
      text: { en: "stlocal: must survive the failure of an availability zone; data must never leave the primary region", fr: "stlocal : doit résister à la panne d'une zone de disponibilité ; les données ne doivent jamais quitter la région primaire" }
    - id: reports
      text: { en: "streports: reports must always be readable from the secondary region; zone redundancy is not required", fr: "streports : les rapports doivent toujours être lisibles depuis la région secondaire ; la redondance interzone n'est pas exigée" }
    - id: core
      text: { en: "stcore: must survive a zone failure and a regional disaster; reading from the secondary region is not required", fr: "stcore : doit résister à une panne de zone et à un sinistre régional ; la lecture depuis la région secondaire n'est pas exigée" }
answer:
  mapping: { dev: lrs, local: zrs, reports: ragrs, core: gzrs }
explanation:
  correct:
    en: LRS, the cheapest option, keeps three copies in one datacenter. ZRS spreads copies across three availability zones of the primary region only. RA-GRS adds a readable secondary endpoint to GRS without zone redundancy. GZRS combines ZRS in the primary region with an asynchronous copy in the secondary region; read access to that copy is not needed, so RA-GZRS would cost more than required.
    fr: LRS, l'option la moins chère, conserve trois copies dans un seul centre de données. ZRS répartit les copies dans trois zones de disponibilité de la région primaire uniquement. RA-GRS ajoute à GRS un point de terminaison secondaire lisible, sans redondance interzone. GZRS combine ZRS dans la région primaire et une copie asynchrone dans la région secondaire ; la lecture de cette copie n'étant pas nécessaire, RA-GZRS coûterait plus que nécessaire.
  options:
    grs:
      en: GRS is neither zone-redundant nor readable in the secondary region, so it fits none of the accounts.
      fr: GRS n'est ni redondant interzone ni lisible dans la région secondaire ; il ne convient donc à aucun compte.
    ragzrs:
      en: RA-GZRS meets the stcore requirements but costs more than GZRS because it adds read access to the secondary region.
      fr: RA-GZRS répond aux exigences de stcore mais coûte plus cher que GZRS, car il ajoute l'accès en lecture à la région secondaire.
references:
  - title: Data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
