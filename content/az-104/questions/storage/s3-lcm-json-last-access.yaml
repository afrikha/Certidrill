id: s3-lcm-json-last-access
objective: "2.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stwingtipmedia**. Last access time tracking is enabled on the account.

    You need a lifecycle management rule for the block blobs in the **media** container that:

    - moves a blob to the Cool tier when it has not been read or written for 30 days;
    - automatically moves a blob in the Cool tier back to the Hot tier as soon as it is accessed.

    How should you complete the rule? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stwingtipmedia**. Le suivi de l'heure d'accès est activé sur le compte.

    Vous avez besoin d'une règle de gestion du cycle de vie pour les objets blob de blocs du conteneur **media** qui :

    - déplace un objet blob vers le niveau froid (Cool) lorsqu'il n'a été ni lu ni écrit depuis 30 jours ;
    - ramène automatiquement un objet blob du niveau froid (Cool) vers le niveau chaud (Hot) dès qu'il est consulté.

    Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: json
  template: |
    {
      "rules": [
        {
          "enabled": true,
          "name": "cool-idle-media",
          "type": "Lifecycle",
          "definition": {
            "filters": {
              "blobTypes": [ "blockBlob" ],
              "prefixMatch": [ "media/" ]
            },
            "actions": {
              "baseBlob": {
                "tierToCool": { "[[cond]]": 30 },
                "[[auto]]": true
              }
            }
          }
        }
      ]
    }
  slots:
    - id: cond
      options:
        - { id: access, text: daysAfterLastAccessTimeGreaterThan }
        - { id: modif, text: daysAfterModificationGreaterThan }
        - { id: creation, text: daysAfterCreationGreaterThan }
        - { id: tierchange, text: daysAfterLastTierChangeGreaterThan }
    - id: auto
      options:
        - { id: enable, text: enableAutoTierToHotFromCool }
        - { id: tracking, text: enableLastAccessTimeTracking }
        - { id: rehydrate, text: autoRehydrateToHot }
answer:
  values: { cond: access, auto: enable }
explanation:
  correct:
    en: "`daysAfterLastAccessTimeGreaterThan` uses the last access time recorded by access time tracking, so it covers both reads and writes. `enableAutoTierToHotFromCool` moves a blob set to the Cool tier back to Hot when it is accessed; it is available only together with the `daysAfterLastAccessTimeGreaterThan` condition."
    fr: "`daysAfterLastAccessTimeGreaterThan` utilise l'heure du dernier accès enregistrée par le suivi de l'heure d'accès ; elle couvre donc les lectures et les écritures. `enableAutoTierToHotFromCool` ramène vers le niveau chaud (Hot) un objet blob placé dans le niveau froid (Cool) lorsqu'il est consulté ; cette action n'est disponible qu'avec la condition `daysAfterLastAccessTimeGreaterThan`."
  options:
    modif: { en: The last modified time ignores reads, so a blob read daily but never written would still move to Cool., fr: "L'heure de dernière modification ignore les lectures : un objet blob lu chaque jour mais jamais écrit passerait quand même au niveau froid (Cool)." }
    creation: { en: The creation time ignores all later reads and writes., fr: "L'heure de création ignore toutes les lectures et écritures ultérieures." }
    tierchange: { en: daysAfterLastTierChangeGreaterThan applies only to tierToArchive actions., fr: daysAfterLastTierChangeGreaterThan ne s'applique qu'aux actions tierToArchive. }
    tracking: { en: Access time tracking is a blob service setting of the account, not an action of a rule., fr: "Le suivi de l'heure d'accès est un paramètre du service Blob du compte, pas une action de règle." }
references:
  - title: Azure Blob Storage lifecycle management policy structure
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
