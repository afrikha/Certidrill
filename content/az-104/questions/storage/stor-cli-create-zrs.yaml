id: stor-cli-create-zrs
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create a storage account by using the Azure CLI. The account must:

    - store blobs, files, queues and tables;
    - keep a copy of the data in three availability zones of the region;
    - use standard performance.

    How should you complete the command? Select the appropriate options in the answer area.
  fr: |
    Vous devez créer un compte de stockage avec Azure CLI. Le compte doit :

    - stocker des blobs, des fichiers, des files d'attente et des tables ;
    - conserver une copie des données dans trois zones de disponibilité de la région ;
    - utiliser les performances standard.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: "az storage account create --name stcontoso02 --resource-group RG1 --location westeurope --sku [[sku]] --kind [[kind]]"
  slots:
    - id: sku
      options:
        - { id: lrs, text: Standard_LRS }
        - { id: zrs, text: Standard_ZRS }
        - { id: grs, text: Standard_GRS }
        - { id: plrs, text: Premium_LRS }
    - id: kind
      options:
        - { id: v2, text: StorageV2 }
        - { id: blob, text: BlobStorage }
        - { id: files, text: FileStorage }
        - { id: blockblob, text: BlockBlobStorage }
answer:
  values: { sku: zrs, kind: v2 }
explanation:
  correct:
    en: "`Standard_ZRS` replicates the data synchronously across three availability zones with standard performance. `StorageV2` (general-purpose v2) is the account kind that supports blobs, files, queues and tables."
    fr: "`Standard_ZRS` réplique les données de manière synchrone dans trois zones de disponibilité, avec des performances standard. `StorageV2` (usage général v2) est le type de compte qui prend en charge les blobs, les fichiers, les files d'attente et les tables."
  options:
    lrs: { en: LRS keeps all copies in one datacenter., fr: LRS conserve toutes les copies dans un seul centre de données. }
    grs: { en: GRS uses LRS in the primary region; it is not zone-redundant there., fr: GRS utilise LRS dans la région primaire ; il n'y est pas redondant entre zones. }
    plrs: { en: Premium_LRS is premium performance and locally redundant., fr: Premium_LRS correspond aux performances premium et à une redondance locale. }
    blob: { en: BlobStorage is a legacy kind that only stores blobs., fr: BlobStorage est un type hérité qui ne stocke que des blobs. }
    files: { en: FileStorage is a premium kind for Azure Files only., fr: FileStorage est un type premium réservé à Azure Files. }
    blockblob: { en: BlockBlobStorage is a premium kind for block blobs only., fr: BlockBlobStorage est un type premium réservé aux blobs de blocs. }
references:
  - title: az storage account
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account
  - title: Storage account overview
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
