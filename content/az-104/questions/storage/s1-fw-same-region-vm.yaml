id: s1-fw-same-region-vm
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual machine named **VM1** connected to subnet **Subnet1** of a virtual network named **VNet1**. VM1 has a public IP address. VNet1 and a storage account named **stadatum7** are both in France Central.

    Public network access on stadatum7 is set to **Enabled from selected networks**. An administrator added an IP network rule that contains the public IP address of VM1, but requests from VM1 to blob data still return error 403.

    You need to allow VM1 to access stadatum7 through the public endpoint without allowing any other network.

    Which two actions should you perform? Each correct answer presents part of the solution.
  fr: |
    Vous disposez d'une machine virtuelle nommée **VM1** connectée au sous-réseau **Subnet1** d'un réseau virtuel nommé **VNet1**. VM1 possède une adresse IP publique. VNet1 et un compte de stockage nommé **stadatum7** se trouvent tous deux dans la région France Central.

    L'accès réseau public de stadatum7 est défini sur **Activé à partir des réseaux sélectionnés**. Un administrateur a ajouté une règle de réseau IP contenant l'adresse IP publique de VM1, mais les demandes de VM1 vers les données blob renvoient toujours l'erreur 403.

    Vous devez permettre à VM1 d'accéder à stadatum7 par le point de terminaison public sans autoriser aucun autre réseau.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Enable the Microsoft.Storage service endpoint on Subnet1.
        fr: Activer le point de terminaison de service Microsoft.Storage sur Subnet1.
    - id: b
      text:
        en: Add a virtual network rule for Subnet1 to stadatum7.
        fr: Ajouter une règle de réseau virtuel pour Subnet1 à stadatum7.
    - id: c
      text:
        en: Replace the IP network rule with one that contains the private IP address of VM1.
        fr: Remplacer la règle de réseau IP par une règle contenant l'adresse IP privée de VM1.
    - id: d
      text:
        en: Add a resource instance rule for VM1.
        fr: Ajouter une règle d'instance de ressource pour VM1.
    - id: e
      text:
        en: Allow Azure services on the trusted services list to access the storage account.
        fr: Autoriser les services Azure de la liste des services approuvés à accéder au compte de stockage.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: IP network rules have no effect on requests that come from the same Azure region as the storage account, because that traffic uses private Azure addresses. Same-region access is granted with a virtual network rule for the subnet, and the subnet needs the Microsoft.Storage service endpoint (the portal adds it automatically; the CLI and PowerShell need a separate step).
    fr: Les règles de réseau IP n'ont aucun effet sur les demandes provenant de la même région Azure que le compte de stockage, car ce trafic utilise des adresses Azure privées. L'accès depuis la même région s'accorde par une règle de réseau virtuel pour le sous-réseau, et ce sous-réseau doit disposer du point de terminaison de service Microsoft.Storage (le portail l'ajoute automatiquement ; la CLI et PowerShell nécessitent une étape distincte).
  options:
    c:
      en: IP network rules accept only public addresses; private RFC 1918 ranges are not allowed.
      fr: Les règles de réseau IP n'acceptent que des adresses publiques ; les plages privées RFC 1918 ne sont pas autorisées.
    d:
      en: Resource instance rules target specific service instances such as Synapse or Data Factory, not virtual machines that run in your own subnet.
      fr: Les règles d'instance de ressource ciblent des instances de services comme Synapse ou Data Factory, pas des machines virtuelles exécutées dans votre propre sous-réseau.
    e:
      en: Virtual machines are not trusted services, and the exception would let other Azure services in.
      fr: Les machines virtuelles ne sont pas des services approuvés, et l'exception laisserait entrer d'autres services Azure.
references:
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
  - title: Create a virtual network rule for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-virtual-networks
