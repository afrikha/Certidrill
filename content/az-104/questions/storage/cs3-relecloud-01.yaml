id: cs3-relecloud-01
objective: "2.2.1"
type: single
caseStudy: cs3-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to create the stcatalogthumbs storage account. The solution must meet the thumbnail requirement and minimize cost.

    Which type of storage account should you create?
  fr: |
    Vous devez créer le compte de stockage stcatalogthumbs. La solution doit satisfaire l'exigence relative aux miniatures et réduire les coûts au minimum.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Standard general-purpose v2 with LRS and the Hot default access tier", fr: "Usage général v2 standard avec LRS et le niveau d'accès par défaut chaud (Hot)" } }
    - { id: b, text: { en: "Premium block blobs with LRS", fr: "Objets blob de blocs Premium avec LRS" } }
    - { id: c, text: { en: "Premium page blobs with LRS", fr: "Objets blob de pages Premium avec LRS" } }
    - { id: d, text: { en: "Premium file shares with LRS", fr: "Partages de fichiers Premium avec LRS" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Thumbnails are images stored as blobs. The premium block blobs account type is designed for block blobs with high transaction rates, small objects and consistently low latency, because it uses SSDs. LRS is supported and is the least expensive redundancy option that the requirement accepts."
    fr: "Les miniatures sont des images stockées sous forme d'objets blob. Le type de compte objets blob de blocs Premium est conçu pour les objets blob de blocs avec des taux de transactions élevés, de petits objets et une latence constamment faible, car il utilise des SSD. LRS est pris en charge et constitue l'option de redondance la moins chère acceptée par l'exigence."
  options:
    a: { en: "A standard account uses HDD-based storage and doesn't guarantee consistently low latency for very high transaction rates.", fr: "Un compte standard utilise un stockage sur HDD et ne garantit pas une latence constamment faible pour des taux de transactions très élevés." }
    c: { en: "Premium page blob accounts store only page blobs, such as VM disks, not image files written as block blobs.", fr: "Les comptes objets blob de pages Premium ne stockent que des objets blob de pages, comme des disques de machines virtuelles, pas des fichiers image écrits sous forme d'objets blob de blocs." }
    d: { en: "Premium file share accounts host only Azure Files shares; the application uses blobs.", fr: "Les comptes partages de fichiers Premium n'hébergent que des partages Azure Files ; l'application utilise des objets blob." }
references:
  - title: "Storage Account Overview - Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
  - title: "Premium block blob storage accounts"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-block-blob-premium
