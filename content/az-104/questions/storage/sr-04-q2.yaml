id: sr-04-q2
objective: "2.1.1"
type: series_yesno
series: sr-04-storage-network
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You add an IP network rule for the address range of Subnet1.
  fr: |
    Vous ajoutez une règle de réseau IP pour la plage d'adresses de Subnet1.
body:
  solution:
    en: |
      On stor1, you set public network access to **Enabled from selected virtual networks and IP addresses** and add an **IP network rule** for the private address range of Subnet1 (10.1.1.0/24).
    fr: |
      Sur stor1, vous définissez l'accès réseau public sur **Enabled from selected virtual networks and IP addresses** et ajoutez une **règle de réseau IP** pour la plage d'adresses privée de Subnet1 (10.1.1.0/24).
answer: { value: false }
explanation:
  correct:
    en: |
      IP network rules accept only public internet address ranges: ranges reserved for private networks, such as 10.1.1.0/24, aren't allowed. In addition, IP network rules have no effect on requests that come from the same Azure region as the storage account, which is the case for the virtual machines. Same-region access from a subnet must be granted with a virtual network rule, so the virtual machines can't be allowed this way and the goal isn't met.
    fr: |
      Les règles de réseau IP n'acceptent que des plages d'adresses Internet publiques : les plages réservées aux réseaux privés, comme 10.1.1.0/24, ne sont pas autorisées. De plus, les règles de réseau IP n'ont aucun effet sur les requêtes provenant de la même région Azure que le compte de stockage, ce qui est le cas des machines virtuelles. L'accès depuis un sous-réseau de la même région doit être accordé par une règle de réseau virtuel : les machines virtuelles ne peuvent pas être autorisées de cette façon, et l'objectif n'est pas atteint.
references:
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
