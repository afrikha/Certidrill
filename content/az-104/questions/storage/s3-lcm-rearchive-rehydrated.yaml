id: s3-lcm-rearchive-rehydrated
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a storage account named **stfabrikamrec** that has the following lifecycle management rule for the **records** container:

    ```json
    "baseBlob": {
      "tierToArchive": { "daysAfterModificationGreaterThan": 180 }
    }
    ```

    Last week, an administrator rehydrated a blob named **case-4411.pdf** to the Hot tier by changing its tier. Today, the blob is back in the Archive tier, although nobody changed it.

    You need to ensure that rehydrated blobs remain in an online tier for at least 30 days. The rule must keep archiving the other blobs as it does now.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stfabrikamrec** qui a la règle de gestion du cycle de vie suivante pour le conteneur **records** :

    ```json
    "baseBlob": {
      "tierToArchive": { "daysAfterModificationGreaterThan": 180 }
    }
    ```

    La semaine dernière, un administrateur a réhydraté un objet blob nommé **case-4411.pdf** vers le niveau chaud (Hot) en changeant son niveau. Aujourd'hui, l'objet blob est de nouveau dans le niveau archive (Archive), alors que personne ne l'a modifié.

    Vous devez vous assurer que les objets blob réhydratés restent au moins 30 jours dans un niveau en ligne. La règle doit continuer à archiver les autres objets blob comme aujourd'hui.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the condition `\"daysAfterLastTierChangeGreaterThan\": 30` to the tierToArchive action.", fr: "Ajouter la condition `\"daysAfterLastTierChangeGreaterThan\": 30` à l'action tierToArchive." } }
    - { id: b, text: { en: "Replace `daysAfterModificationGreaterThan` with `daysAfterCreationGreaterThan` in the tierToArchive action.", fr: "Remplacer `daysAfterModificationGreaterThan` par `daysAfterCreationGreaterThan` dans l'action tierToArchive." } }
    - { id: c, text: { en: "Add the action `\"enableAutoTierToHotFromCool\": true` to the baseBlob object.", fr: "Ajouter l'action `\"enableAutoTierToHotFromCool\": true` à l'objet baseBlob." } }
    - { id: d, text: { en: Enable blob versioning on stfabrikamrec., fr: "Activer le contrôle de version des objets blob sur stfabrikamrec." } }
answer: { optionId: a }
explanation:
  correct:
    en: Rehydrating a blob by changing its tier does not update its last modified time, so the rule still sees the blob as older than 180 days and archives it again. The `daysAfterLastTierChangeGreaterThan` condition, supported only on tierToArchive, sets the minimum number of days a rehydrated blob stays online before being archived again.
    fr: Réhydrater un objet blob en changeant son niveau ne met pas à jour son heure de dernière modification ; la règle considère donc toujours l'objet blob comme âgé de plus de 180 jours et l'archive de nouveau. La condition `daysAfterLastTierChangeGreaterThan`, prise en charge uniquement par tierToArchive, définit le nombre minimal de jours pendant lesquels un objet blob réhydraté reste en ligne avant d'être réarchivé.
  options:
    b:
      en: Rehydration does not change the creation time either, so the blob would still be archived again.
      fr: La réhydratation ne modifie pas non plus l'heure de création ; l'objet blob serait donc toujours réarchivé.
    c:
      en: This action moves blobs from Cool to Hot on access; it does not stop the archive action and requires a last access condition.
      fr: Cette action déplace des objets blob du niveau froid (Cool) vers le niveau chaud (Hot) lors d'un accès ; elle n'empêche pas l'action d'archivage et exige une condition de dernier accès.
    d:
      en: Versioning keeps previous versions on writes; it has no effect on how the rule evaluates the current version.
      fr: Le contrôle de version conserve des versions précédentes lors des écritures ; il n'a aucun effet sur l'évaluation de la version actuelle par la règle.
references:
  - title: Azure Blob Storage lifecycle management policy structure
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
  - title: Blob rehydration from the archive tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
