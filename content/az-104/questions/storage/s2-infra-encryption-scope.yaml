id: s2-infra-encryption-scope
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a general-purpose v2 storage account named **stnorthdata** that was created without infrastructure encryption. The account stores several containers used by different departments.

    A new compliance rule requires that all blobs of the Legal department be doubly encrypted at rest. The Legal department will store its data in a new container. You must not create a new storage account, and other departments must not be affected.

    What should you do?
  fr: |
    Northwind Traders dispose d'un compte de stockage à usage général v2 nommé **stnorthdata**, créé sans chiffrement de l'infrastructure. Le compte héberge plusieurs conteneurs utilisés par différents services.

    Une nouvelle règle de conformité exige que tous les objets blob du service juridique soient doublement chiffrés au repos. Le service juridique stockera ses données dans un nouveau conteneur. Vous ne devez pas créer de nouveau compte de stockage, et les autres services ne doivent pas être affectés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an encryption scope with infrastructure encryption enabled, then create the Legal container with this scope as its default and prevent overrides.", fr: "Créer une étendue de chiffrement avec le chiffrement de l'infrastructure activé, puis créer le conteneur du service juridique avec cette étendue par défaut en interdisant son remplacement." }
    - id: b
      text: { en: "Enable infrastructure encryption on stnorthdata, then create the Legal container.", fr: "Activer le chiffrement de l'infrastructure sur stnorthdata, puis créer le conteneur du service juridique." }
    - id: c
      text: { en: "Configure customer-managed keys for stnorthdata in Azure Key Vault, then create the Legal container.", fr: "Configurer des clés gérées par le client pour stnorthdata dans Azure Key Vault, puis créer le conteneur du service juridique." }
    - id: d
      text: { en: "Create the Legal container, then create an encryption scope with infrastructure encryption and set it as the default scope of the container.", fr: "Créer le conteneur du service juridique, puis créer une étendue de chiffrement avec le chiffrement de l'infrastructure et la définir comme étendue par défaut du conteneur." }
answer: { optionId: a }
explanation:
  correct:
    en: When infrastructure encryption is not enabled on the account, you can enable it on an encryption scope when you create the scope. A default encryption scope must be specified when the container is created, and preventing overrides makes every blob uploaded to the container use that doubly encrypted scope.
    fr: Lorsque le chiffrement de l'infrastructure n'est pas activé sur le compte, vous pouvez l'activer sur une étendue de chiffrement lors de la création de l'étendue. Une étendue de chiffrement par défaut doit être spécifiée à la création du conteneur, et l'interdiction de son remplacement oblige chaque objet blob chargé dans le conteneur à utiliser cette étendue doublement chiffrée.
  options:
    b:
      en: Infrastructure encryption for an account can be enabled only when the account is created; it cannot be enabled afterward.
      fr: Le chiffrement de l'infrastructure d'un compte ne peut être activé qu'à la création du compte ; il ne peut pas l'être ensuite.
    c:
      en: Customer-managed keys change who controls the key that protects the data, but the data is still encrypted only once at the service level.
      fr: Les clés gérées par le client changent qui contrôle la clé qui protège les données, mais les données restent chiffrées une seule fois, au niveau du service.
    d:
      en: The default encryption scope of a container must be specified when the container is created; it cannot be set on an existing container.
      fr: L'étendue de chiffrement par défaut d'un conteneur doit être spécifiée à la création du conteneur ; elle ne peut pas être définie sur un conteneur existant.
references:
  - title: Encryption scopes for Blob storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview
  - title: Enable infrastructure encryption for double encryption of data
    url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
