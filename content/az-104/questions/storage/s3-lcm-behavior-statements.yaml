id: s3-lcm-behavior-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are configuring a lifecycle management policy for a general-purpose v2 storage account named **sttailspinlogs**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous configurez une stratégie de gestion du cycle de vie pour un compte de stockage usage général v2 nommé **sttailspinlogs**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: After you add or edit a rule, it can take up to 24 hours before the changes take effect and the first run starts.
        fr: Après l'ajout ou la modification d'une règle, jusqu'à 24 heures peuvent s'écouler avant que les modifications prennent effet et que la première exécution démarre.
    - id: s2
      text:
        en: You can use a filter to exclude from a rule the blobs whose names start with a given prefix.
        fr: Vous pouvez utiliser un filtre pour exclure d'une règle les objets blob dont le nom commence par un préfixe donné.
    - id: s3
      text:
        en: A rule can rehydrate archived blobs to the Hot tier after a given number of days.
        fr: Une règle peut réhydrater des objets blob archivés vers le niveau chaud (Hot) au bout d'un nombre de jours donné.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Policy changes can take up to 24 hours to go into effect. Filters only specify which blobs to include (prefixes and blob index tags, combined with a logical AND); they provide no way to exclude blobs. Lifecycle management policies cannot rehydrate archived blobs to an online tier; use Set Blob Tier or Copy Blob instead.
    fr: Les modifications d'une stratégie peuvent prendre jusqu'à 24 heures pour entrer en vigueur. Les filtres indiquent uniquement les objets blob à inclure (préfixes et étiquettes d'index d'objets blob, combinés par un ET logique) ; ils ne permettent pas d'exclure des objets blob. Les stratégies de gestion du cycle de vie ne peuvent pas réhydrater d'objets blob archivés vers un niveau en ligne ; il faut utiliser Set Blob Tier ou Copy Blob.
references:
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
