id: s1-fw-rules-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the firewall of a storage account named **stwoodgrove** located in East US. The account stores blobs only.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le pare-feu d'un compte de stockage nommé **stwoodgrove**, situé dans la région East US. Le compte ne stocke que des objets blob.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add an IP network rule for the range 203.0.113.16/31.
        fr: Vous pouvez ajouter une règle de réseau IP pour la plage 203.0.113.16/31.
    - id: s2
      text:
        en: A subnet in West Europe can be allowed by a virtual network rule if the subnet has the Microsoft.Storage.Global service endpoint.
        fr: Un sous-réseau situé dans la région West Europe peut être autorisé par une règle de réseau virtuel si ce sous-réseau dispose du point de terminaison de service Microsoft.Storage.Global.
    - id: s3
      text:
        en: Virtual network rules and IP network rules have no effect while the default action of the account is Allow.
        fr: Les règles de réseau virtuel et les règles de réseau IP n'ont aucun effet tant que l'action par défaut du compte est Allow.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: IP network rules do not support /31 or /32 prefixes; you add the addresses as individual IP rules instead. The Microsoft.Storage.Global (cross-region) service endpoint gives a subnet connectivity to storage accounts in any region, so a West Europe subnet can be allowed. Network rules are only enforced when the default action is Deny.
    fr: Les règles de réseau IP ne prennent pas en charge les préfixes /31 ou /32 ; vous ajoutez alors les adresses comme règles IP individuelles. Le point de terminaison de service multirégion Microsoft.Storage.Global donne à un sous-réseau l'accès aux comptes de stockage de toutes les régions ; un sous-réseau de West Europe peut donc être autorisé. Les règles réseau ne sont appliquées que si l'action par défaut est Deny.
  options:
    s1:
      en: Small ranges with a /31 or /32 prefix are not supported; use one rule per individual IP address.
      fr: Les petites plages de préfixe /31 ou /32 ne sont pas prises en charge ; utilisez une règle par adresse IP individuelle.
references:
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
