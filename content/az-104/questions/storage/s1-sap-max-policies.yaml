id: s1-sap-max-policies
objective: "2.1.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You plan to manage the service SAS tokens issued for a blob container named **invoices** by using stored access policies. Each customer will get its own policy.

    What is the maximum number of stored access policies that you can set on the invoices container at the same time?
  fr: |
    Vous prévoyez de gérer les jetons SAS de service émis pour un conteneur d'objets blob nommé **invoices** au moyen de stratégies d'accès stockées. Chaque client disposera de sa propre stratégie.

    Combien de stratégies d'accès stockées au maximum pouvez-vous définir simultanément sur le conteneur invoices ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "5" }
    - { id: c, text: "10" }
    - { id: d, text: "64" }
answer: { optionId: b }
explanation:
  correct:
    en: A container, table, queue or file share can hold at most five stored access policies at a time. Trying to set more returns status code 400 (Bad Request), so a design with one policy per customer does not scale beyond five customers per container.
    fr: Un conteneur, une table, une file d'attente ou un partage de fichiers peut contenir au maximum cinq stratégies d'accès stockées à la fois. Tenter d'en définir davantage renvoie le code d'état 400 (Bad Request) ; une conception à une stratégie par client ne dépasse donc pas cinq clients par conteneur.
  options:
    d:
      en: 64 is the maximum length, in characters, of the signed identifier of a policy, not the number of policies.
      fr: 64 est la longueur maximale, en caractères, de l'identificateur signé d'une stratégie, pas le nombre de stratégies.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
