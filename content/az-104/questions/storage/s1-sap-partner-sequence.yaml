id: s1-sap-partner-sequence
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A storage account named **stlitware** contains a container named **designs**. A design agency must be able to read the blobs in designs during a project. When the project ends, its access must be revoked without regenerating the account keys, which other applications use.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un compte de stockage nommé **stlitware** contient un conteneur nommé **designs**. Une agence de design doit pouvoir lire les objets blob de designs pendant un projet. À la fin du projet, son accès doit être révoqué sans régénérer les clés de compte, que d'autres applications utilisent.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: policy
      text:
        en: Create a stored access policy on the designs container with the Read permission and an expiry time.
        fr: Créer sur le conteneur designs une stratégie d'accès stockée avec l'autorisation Lecture et une heure d'expiration.
    - id: sas
      text:
        en: Generate a service SAS for designs that references the stored access policy.
        fr: Générer pour designs une SAS de service qui référence la stratégie d'accès stockée.
    - id: send
      text:
        en: Send the SAS URI to the agency over a secure channel.
        fr: Envoyer l'URI SAS à l'agence par un canal sécurisé.
    - id: delete
      text:
        en: At the end of the project, delete the stored access policy.
        fr: À la fin du projet, supprimer la stratégie d'accès stockée.
    - id: regen
      text:
        en: At the end of the project, regenerate key1 and key2.
        fr: À la fin du projet, régénérer key1 et key2.
    - id: account
      text:
        en: Generate an account SAS that references the stored access policy.
        fr: Générer une SAS de compte qui référence la stratégie d'accès stockée.
answer:
  sequence: [policy, sas, send, delete]
explanation:
  correct:
    en: The policy must exist before a service SAS can reference it. The agency then uses the SAS URI, distributed over HTTPS or another secure channel. Deleting the policy at the end immediately revokes every SAS bound to it, without affecting the account keys.
    fr: La stratégie doit exister avant qu'une SAS de service puisse la référencer. L'agence utilise ensuite l'URI SAS, transmis par HTTPS ou un autre canal sécurisé. Supprimer la stratégie à la fin révoque immédiatement toutes les SAS qui y sont liées, sans affecter les clés de compte.
  options:
    regen:
      en: Regenerating the keys would revoke the SAS but would break the other applications.
      fr: Régénérer les clés révoquerait la SAS, mais casserait les autres applications.
    account:
      en: An account SAS cannot reference a stored access policy.
      fr: Une SAS de compte ne peut pas référencer de stratégie d'accès stockée.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
  - title: Grant limited access to data with shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
