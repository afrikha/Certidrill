id: s3-tier-archive-statements
objective: "2.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage a general-purpose v2 storage account named **stwingtiplogs** that uses LRS. Some block blobs in the account are in the Archive tier.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un compte de stockage usage général v2 nommé **stwingtiplogs** qui utilise LRS. Certains objets blob de blocs du compte se trouvent dans le niveau archive (Archive).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can list an archived blob and read its metadata and properties without rehydrating it.
        fr: Vous pouvez lister un objet blob archivé et lire ses métadonnées et ses propriétés sans le réhydrater.
    - id: s2
      text:
        en: You can set the default access tier of stwingtiplogs to Archive so that new blobs are archived when they are uploaded.
        fr: Vous pouvez définir le niveau d'accès par défaut de stwingtiplogs sur archive (Archive) pour que les nouveaux objets blob soient archivés dès leur chargement.
    - id: s3
      text:
        en: A standard-priority rehydration of a blob smaller than 10 GB can take up to 15 hours.
        fr: Une réhydratation de priorité standard d'un objet blob de moins de 10 Go peut prendre jusqu'à 15 heures.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: An archived blob is offline, but its metadata stays readable, so you can list it and get its properties and metadata. The default account access tier can be Hot, Cool or Cold only; Archive is not supported as a default. Standard-priority rehydration can take up to 15 hours for objects under 10 GB, while High priority may complete in under one hour.
    fr: Un objet blob archivé est hors connexion, mais ses métadonnées restent lisibles ; vous pouvez donc le lister et obtenir ses propriétés et métadonnées. Le niveau d'accès par défaut du compte ne peut être que chaud (Hot), froid (Cool) ou froid (Cold) ; archive (Archive) n'est pas pris en charge comme niveau par défaut. Une réhydratation de priorité standard peut prendre jusqu'à 15 heures pour les objets de moins de 10 Go, alors qu'une priorité élevée peut aboutir en moins d'une heure.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Blob rehydration from the archive tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
