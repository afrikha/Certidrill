id: s3-versioning-account-support
objective: "2.3.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has the storage accounts shown in the following table.

    Answer each prompt by selecting the storage account that meets the requirement. Each prompt has exactly one correct storage account.
  fr: |
    Adatum dispose des comptes de stockage présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le compte de stockage qui répond à l'exigence. Chaque consigne a exactement un compte de stockage correct.
body:
  prompts:
    - id: p1
      text: { en: You can enable point-in-time restore on this account., fr: Vous pouvez activer la restauration à un instant dans le passé sur ce compte. }
    - id: p2
      text: { en: "You can enable blob versioning on this account, but not point-in-time restore.", fr: "Vous pouvez activer le contrôle de version des objets blob sur ce compte, mais pas la restauration à un instant dans le passé." }
  grid:
    header: [{ en: Name, fr: Nom }, { en: Account kind, fr: Type de compte }, { en: Performance, fr: Performances }, { en: Hierarchical namespace, fr: Espace de noms hiérarchique }]
    rows:
      - [{ text: stadatumlake, area: a1 }, { text: StorageV2 }, { text: Standard }, { text: { en: Enabled, fr: Activé } }]
      - [{ text: stadatumapp, area: a2 }, { text: StorageV2 }, { text: Standard }, { text: { en: Disabled, fr: Désactivé } }]
      - [{ text: stadatumfast, area: a3 }, { text: BlockBlobStorage }, { text: Premium }, { text: { en: Disabled, fr: Désactivé } }]
      - [{ text: stadatumshare, area: a4 }, { text: FileStorage }, { text: Premium }, { text: { en: Not applicable, fr: Non applicable } }]
answer:
  values: { p1: a2, p2: a3 }
explanation:
  correct:
    en: Point-in-time restore supports only standard general-purpose v2 accounts without a hierarchical namespace, so only stadatumapp qualifies. Blob versioning is available on standard general-purpose v2 and premium block blob accounts but not with a hierarchical namespace, so stadatumfast supports versioning but not point-in-time restore. A FileStorage account holds file shares, not blobs.
    fr: La restauration à un instant dans le passé ne prend en charge que les comptes usage général v2 standard sans espace de noms hiérarchique ; seul stadatumapp convient. Le contrôle de version des objets blob est disponible sur les comptes usage général v2 standard et sur les comptes d'objets blob de blocs Premium, mais pas avec un espace de noms hiérarchique ; stadatumfast prend donc en charge le contrôle de version, mais pas la restauration à un instant dans le passé. Un compte FileStorage contient des partages de fichiers, pas des objets blob.
references:
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
  - title: Blob Versioning in Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
