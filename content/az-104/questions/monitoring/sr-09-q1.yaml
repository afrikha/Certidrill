status: draft
stem:
  en: |
    You create an activity log alert rule for VM1.
  fr: |
    Vous créez une règle d'alerte de journal d'activité pour VM1.
body:
  solution:
    en: |
      You create an **activity log alert rule** scoped to VM1 for all administrative operations, and you attach an action group that sends an email to `ops@contoso.com`.
    fr: |
      Vous créez une **règle d'alerte de journal d'activité** dont l'étendue est VM1 pour toutes les opérations d'administration, et vous y attachez un groupe d'actions qui envoie un e-mail à `ops@contoso.com`.
answer: { value: false }
explanation:
  correct:
    en: |
      Activity log alerts fire when an event is written to the activity log, such as a restart, a shutdown, or the deletion of a resource. The activity log doesn't contain CPU measurements, so the rule can't detect that average CPU exceeds 85 percent, and the operations team would instead receive emails about unrelated operations. The goal isn't met.
    fr: |
      Les alertes de journal d'activité se déclenchent lorsqu'un événement est écrit dans le journal d'activité, comme un redémarrage, un arrêt ou la suppression d'une ressource. Le journal d'activité ne contient pas de mesures du processeur : la règle ne peut pas détecter que l'utilisation moyenne dépasse 85 %, et l'équipe des opérations recevrait plutôt des e-mails sur des opérations sans rapport. L'objectif n'est pas atteint.
references:
  - title: "Types of Azure Monitor alerts"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
