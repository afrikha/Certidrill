id: m1-diag-storage-destination
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a key vault named **kv-tailspin** in the West Europe region. You plan to create a diagnostic setting that archives the AuditEvent resource logs of kv-tailspin to a storage account.

    The subscription contains the following storage accounts. No firewall is configured on them.

    | Name | Region | Performance |
    | --- | --- | --- |
    | sttailspin1 | North Europe | Standard |
    | sttailspin2 | West Europe | Premium |
    | sttailspin3 | West Europe | Standard |
    | sttailspin4 | France Central | Standard |

    Which storage account can you select as the destination?
  fr: |
    Vous disposez d'un coffre de clés nommé **kv-tailspin** dans la région West Europe. Vous prévoyez de créer un paramètre de diagnostic qui archive les journaux de ressources AuditEvent de kv-tailspin dans un compte de stockage.

    L'abonnement contient les comptes de stockage suivants. Aucun pare-feu n'est configuré sur ces comptes.

    | Nom | Région | Performances |
    | --- | --- | --- |
    | sttailspin1 | North Europe | Standard |
    | sttailspin2 | West Europe | Premium |
    | sttailspin3 | West Europe | Standard |
    | sttailspin4 | France Central | Standard |

    Quel compte de stockage pouvez-vous sélectionner comme destination ?
body:
  options:
    - { id: a, text: sttailspin1 }
    - { id: b, text: sttailspin2 }
    - { id: c, text: sttailspin3 }
    - { id: d, text: sttailspin4 }
answer: { optionId: c }
explanation:
  correct:
    en: For a regional resource, a storage account used as a diagnostic setting destination must be in the same region as the monitored resource, and Premium storage accounts are not supported as destinations. sttailspin3 is a Standard account in West Europe.
    fr: Pour une ressource régionale, le compte de stockage utilisé comme destination d'un paramètre de diagnostic doit se trouver dans la même région que la ressource surveillée, et les comptes de stockage Premium ne sont pas pris en charge comme destination. sttailspin3 est un compte Standard situé en West Europe.
  options:
    a: { en: sttailspin1 is in a different region., fr: sttailspin1 se trouve dans une autre région. }
    b: { en: Premium storage accounts are not supported as destinations., fr: Les comptes de stockage Premium ne sont pas pris en charge comme destination. }
    d: { en: sttailspin4 is in a different region., fr: sttailspin4 se trouve dans une autre région. }
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings
