id: cs2-fourthcoffee-01
objective: "5.1.2"
type: single
caseStudy: cs2-fourthcoffee
difficulty: 1
status: draft
stem:
  en: You need to meet the event log collection requirement for VM-POSAPP1 and VM-POSDB1. What should you create?
  fr: Vous devez satisfaire l'exigence de collecte des journaux d'événements de VM-POSAPP1 et VM-POSDB1. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A data collection rule that collects the Windows event logs, associated with both virtual machines and sending to LAW-Retail", fr: "Une règle de collecte de données qui collecte les journaux d'événements Windows, associée aux deux machines virtuelles et qui envoie vers LAW-Retail" } }
    - { id: b, text: { en: "A diagnostic setting on each virtual machine that sends to LAW-Retail", fr: "Un paramètre de diagnostic sur chaque machine virtuelle qui envoie vers LAW-Retail" } }
    - { id: c, text: { en: "A Windows event log data source in the agents configuration of LAW-Retail, with the Log Analytics agent installed on both virtual machines", fr: "Une source de données de journaux d'événements Windows dans la configuration des agents de LAW-Retail, avec l'agent Log Analytics installé sur les deux machines virtuelles" } }
    - { id: d, text: { en: "An activity log alert for both virtual machines", fr: "Une alerte de journal d'activité pour les deux machines virtuelles" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Monitor Agent collects guest operating system data as defined in data collection rules. A DCR can select the Application and System logs with the Error and Critical levels and send them to LAW-Retail. When you associate the DCR with the virtual machines in the portal, the agent is installed automatically.
    fr: |
      L'agent Azure Monitor collecte les données du système d'exploitation invité selon les règles de collecte de données. Une règle de collecte de données peut sélectionner les journaux Application et System aux niveaux Error et Critical et les envoyer vers LAW-Retail. Quand vous associez la règle aux machines virtuelles dans le portail, l'agent est installé automatiquement.
  options:
    b: { en: "A virtual machine has no diagnostic setting for guest event logs; diagnostic settings route platform logs and metrics.", fr: "Une machine virtuelle n'a pas de paramètre de diagnostic pour les journaux d'événements invités ; les paramètres de diagnostic acheminent les journaux et métriques de plateforme." }
    c: { en: "The Log Analytics agent is retired and replaced by the Azure Monitor Agent with data collection rules.", fr: "L'agent Log Analytics est mis hors service et remplacé par l'agent Azure Monitor avec des règles de collecte de données." }
    d: { en: "The activity log records control plane operations, not the guest event logs.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle, pas les journaux d'événements invités." }
references:
  - title: Collect data from virtual machines with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
