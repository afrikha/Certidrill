id: cs2-fourthcoffee-01
objective: "5.1.2"
type: single
caseStudy: cs2-fourthcoffee
difficulty: 1
status: draft
stem:
  en: You need to meet the event log collection requirement for VM-POSAPP1 and VM-POSDB1. What should you create?
  fr: Vous devez satisfaire l'exigence de collecte des journaux d'événements de VM-POSAPP1 et VM-POSDB1. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A data collection rule associated with both virtual machines", fr: "Une règle de collecte de données associée aux deux machines virtuelles" } }
    - { id: b, text: { en: "A diagnostic setting on each of the two virtual machines", fr: "Un paramètre de diagnostic sur chacune des deux machines virtuelles" } }
    - { id: c, text: { en: "A Windows event log data source in the legacy agents configuration of LAW-Retail", fr: "Une source de données de journaux d'événements Windows dans la configuration des agents hérités de LAW-Retail" } }
    - { id: d, text: { en: "A diagnostic setting on the activity log of Sub-Retail", fr: "Un paramètre de diagnostic sur le journal d'activité de Sub-Retail" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Monitor Agent collects guest operating system data as defined in data collection rules. A DCR can select the Application and System logs with the Error and Critical levels and send them to LAW-Retail. When you associate the DCR with the virtual machines in the portal, the agent is installed automatically.
    fr: |
      L'agent Azure Monitor collecte les données du système d'exploitation invité selon les règles de collecte de données. Une règle de collecte de données peut sélectionner les journaux Application et System aux niveaux Error et Critical et les envoyer vers LAW-Retail. Quand vous associez la règle aux machines virtuelles dans le portail, l'agent est installé automatiquement.
  options:
    b: { en: "A virtual machine has no diagnostic setting for guest event logs; diagnostic settings route platform logs and metrics.", fr: "Une machine virtuelle n'a pas de paramètre de diagnostic pour les journaux d'événements invités ; les paramètres de diagnostic acheminent les journaux et métriques de plateforme." }
    c: { en: "The legacy agents configuration was used by the Log Analytics agent, which is retired and replaced by the Azure Monitor Agent with data collection rules.", fr: "La configuration des agents hérités servait à l'agent Log Analytics, qui est mis hors service et remplacé par l'agent Azure Monitor avec des règles de collecte de données." }
    d: { en: "The activity log records control plane operations on the subscription, not the event logs of the guest operating system.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle de l'abonnement, pas les journaux d'événements du système d'exploitation invité." }
references:
  - title: "Collect log data from virtual machines with Azure Monitor - Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection
  - title: "Azure Monitor Agent Overview - Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
