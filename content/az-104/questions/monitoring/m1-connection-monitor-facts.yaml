id: m1-connection-monitor-facts
objective: "5.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to use Network Watcher and Connection Monitor to monitor the connectivity between Azure virtual machines and on-premises servers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser Network Watcher et le Moniteur de connexion pour surveiller la connectivité entre des machines virtuelles Azure et des serveurs locaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Network Watcher is enabled automatically in a region when you create a virtual network in that region, unless you opted out of automatic enablement.
        fr: Network Watcher est activé automatiquement dans une région quand vous y créez un réseau virtuel, sauf si vous avez désactivé l'activation automatique.
    - id: s2
      text:
        en: A test group of a connection monitor contains source endpoints, destination endpoints and test configurations.
        fr: Un groupe de tests d'un moniteur de connexion contient des points de terminaison sources, des points de terminaison de destination et des configurations de test.
    - id: s3
      text:
        en: Connection Monitor tests a connection only once, at the time you run it.
        fr: Le Moniteur de connexion teste une connexion une seule fois, au moment où vous l'exécutez.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Creating or updating a virtual network automatically enables Network Watcher in its region, at no charge, unless you opted out. In Connection Monitor, a test group combines sources, destinations and protocol-specific test configurations, and each combination becomes a test. Tests run continuously at the configured frequency; a one-time test is what Connection troubleshoot does.
    fr: La création ou la mise à jour d'un réseau virtuel active automatiquement Network Watcher dans sa région, sans frais, sauf si vous avez refusé cette activation. Dans le Moniteur de connexion, un groupe de tests combine des sources, des destinations et des configurations de test propres à un protocole, et chaque combinaison devient un test. Les tests s'exécutent en continu à la fréquence configurée ; un test ponctuel est ce que fait la résolution des problèmes de connexion.
references:
  - title: Connection Monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
  - title: Azure Network Watcher overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
