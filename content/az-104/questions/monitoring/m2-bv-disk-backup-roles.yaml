id: m2-bv-disk-backup-roles
objective: "5.2.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You have a Backup vault named **BV1** that has a system-assigned managed identity. You plan to use Azure Disk Backup to protect a managed disk named **Disk1**, store the snapshots in a resource group named **RG-Snapshots**, and later restore the disk to a resource group named **RG-Restore**.

    You need to assign the built-in roles that the managed identity of BV1 requires. The solution must follow the principle of least privilege.

    Which role should you assign at each scope? To answer, drag the appropriate roles to the correct scopes. Each role may be used once or not at all.
  fr: |
    Vous disposez d'un coffre de sauvegarde nommé **BV1** qui possède une identité managée affectée par le système. Vous prévoyez d'utiliser Azure Disk Backup pour protéger un disque managé nommé **Disk1**, de stocker les instantanés dans un groupe de ressources nommé **RG-Snapshots**, puis de restaurer ultérieurement le disque dans un groupe de ressources nommé **RG-Restore**.

    Vous devez attribuer les rôles intégrés dont l'identité managée de BV1 a besoin. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à chaque étendue ? Pour répondre, faites glisser les rôles appropriés vers les étendues correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: reader, text: Disk Backup Reader }
    - { id: snap, text: Disk Snapshot Contributor }
    - { id: restore, text: Disk Restore Operator }
    - { id: sabc, text: Storage Account Backup Contributor }
    - { id: bkc, text: Backup Contributor }
  targets:
    - { id: disk, text: { en: Disk1, fr: Disk1 } }
    - { id: rgsnap, text: { en: RG-Snapshots, fr: RG-Snapshots } }
    - { id: rgrestore, text: { en: RG-Restore, fr: RG-Restore } }
answer:
  mapping: { disk: reader, rgsnap: snap, rgrestore: restore }
explanation:
  correct:
    en: The Backup vault uses its managed identity to reach other resources. It needs Disk Backup Reader on the source disk, Disk Snapshot Contributor on the snapshot resource group where incremental snapshots are created and managed, and Disk Restore Operator on the target resource group of a restore.
    fr: Le coffre de sauvegarde utilise son identité managée pour accéder aux autres ressources. Il a besoin de Disk Backup Reader sur le disque source, de Disk Snapshot Contributor sur le groupe de ressources d'instantanés où les instantanés incrémentiels sont créés et gérés, et de Disk Restore Operator sur le groupe de ressources cible d'une restauration.
  options:
    sabc:
      en: Storage Account Backup Contributor is the role the vault needs on a storage account for blob backup, not for disks.
      fr: Storage Account Backup Contributor est le rôle dont le coffre a besoin sur un compte de stockage pour la sauvegarde des blobs, pas pour les disques.
    bkc:
      en: Backup Contributor is a role for people who manage backups in a vault; it is not the role the vault identity needs on disks or snapshot resource groups.
      fr: Backup Contributor est un rôle destiné aux personnes qui gèrent les sauvegardes d'un coffre ; ce n'est pas le rôle dont l'identité du coffre a besoin sur les disques ou les groupes de ressources d'instantanés.
references:
  - title: Back up Azure Managed Disks
    url: https://learn.microsoft.com/en-us/azure/backup/backup-managed-disks
  - title: Restore Azure Managed Disks
    url: https://learn.microsoft.com/en-us/azure/backup/restore-managed-disks
