id: m1-action-group-arm-role
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating an action group named **ag-owners** for the critical alerts of a subscription named **Sub1**.

    The action group must send an email to every user who is assigned the Owner role at the scope of Sub1. When a user is assigned or removed from the Owner role, the recipients must change without any update to the action group.

    Which notification type should you configure?
  fr: |
    Vous créez un groupe d'actions nommé **ag-owners** pour les alertes critiques d'un abonnement nommé **Sub1**.

    Le groupe d'actions doit envoyer un e-mail à chaque utilisateur auquel le rôle Owner est attribué dans l'étendue de Sub1. Quand un utilisateur reçoit ou perd le rôle Owner, les destinataires doivent changer sans aucune mise à jour du groupe d'actions.

    Quel type de notification devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Email Azure Resource Manager role", fr: "Envoyer un e-mail au rôle Azure Resource Manager" } }
    - { id: b, text: { en: "Email/SMS message/Push/Voice with the email address of each owner", fr: "E-mail/SMS/Notification Push/Voix avec l'adresse e-mail de chaque propriétaire" } }
    - { id: c, text: { en: "A webhook action that calls the Microsoft Graph API", fr: "Une action webhook qui appelle l'API Microsoft Graph" } }
    - { id: d, text: { en: "An ITSM action", fr: "Une action ITSM" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Email Azure Resource Manager role notification sends an email to the users assigned a given role (such as Owner, Contributor or Monitoring Reader) at the subscription level. Membership is evaluated from the role assignments, so the action group does not need to be updated when owners change.
    fr: La notification Envoyer un e-mail au rôle Azure Resource Manager envoie un e-mail aux utilisateurs auxquels un rôle donné (Owner, Contributor ou Monitoring Reader par exemple) est attribué au niveau de l'abonnement. Les destinataires sont déterminés à partir des attributions de rôles ; le groupe d'actions n'a donc pas besoin d'être mis à jour quand les propriétaires changent.
  options:
    b:
      en: Fixed email addresses must be edited each time an owner is added or removed.
      fr: Des adresses e-mail fixes doivent être modifiées chaque fois qu'un propriétaire est ajouté ou retiré.
    c:
      en: A webhook would require custom code to resolve the owners and send the emails.
      fr: Un webhook nécessiterait du code personnalisé pour déterminer les propriétaires et envoyer les e-mails.
    d:
      en: An ITSM action creates work items in an IT service management tool; it does not email role members.
      fr: Une action ITSM crée des éléments de travail dans un outil de gestion des services informatiques ; elle n'envoie pas d'e-mail aux membres d'un rôle.
references:
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
