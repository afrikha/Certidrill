id: m2-pol-snapshot-retention-limits
objective: "5.2.3"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are creating Azure VM backup policies with a **daily** backup schedule in a Recovery Services vault. You want to keep instant restore snapshots for as long as possible.

    How should you complete the statements? Select the appropriate options in the answer area.
  fr: |
    Vous créez des stratégies de sauvegarde de machines virtuelles Azure avec une planification **quotidienne** dans un coffre Recovery Services. Vous voulez conserver les instantanés de restauration instantanée le plus longtemps possible.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      With a Standard policy, you can retain instant restore snapshots for up to [[std]] days.

      With an Enhanced policy, you can retain instant restore snapshots for up to [[enh]] days.
    fr: |
      Avec une stratégie Standard, vous pouvez conserver les instantanés de restauration instantanée jusqu'à [[std]] jours.

      Avec une stratégie améliorée (Enhanced), vous pouvez conserver les instantanés de restauration instantanée jusqu'à [[enh]] jours.
  slots:
    - id: std
      options:
        - { id: s2, text: "2" }
        - { id: s5, text: "5" }
        - { id: s7, text: "7" }
        - { id: s30, text: "30" }
    - id: enh
      options:
        - { id: e5, text: "5" }
        - { id: e7, text: "7" }
        - { id: e30, text: "30" }
        - { id: e180, text: "180" }
answer:
  values: { std: s5, enh: e30 }
explanation:
  correct:
    en: Instant restore snapshots are kept with the disks to speed up restores. The Standard policy lets you set the snapshot retention from 1 to 5 days (2 by default), and the Enhanced policy from 1 to 30 days (7 by default).
    fr: Les instantanés de restauration instantanée sont conservés avec les disques pour accélérer les restaurations. La stratégie Standard permet de définir leur rétention de 1 à 5 jours (2 par défaut), et la stratégie améliorée de 1 à 30 jours (7 par défaut).
  options:
    s2: { en: 2 days is the default value of the Standard policy, not its maximum., fr: 2 jours est la valeur par défaut de la stratégie Standard, pas son maximum. }
    e7: { en: 7 days is the default value of the Enhanced policy, not its maximum., fr: 7 jours est la valeur par défaut de la stratégie améliorée, pas son maximum. }
references:
  - title: Azure Instant Restore capability
    url: https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability
