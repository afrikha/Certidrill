id: m1-metrics-splitting
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stfabrikam01**. In Metrics Explorer, you open a chart of the **Transactions** metric of stfabrikam01.

    You need the chart to display a separate line for each API operation (GetBlob, PutBlob, ListBlobs, and so on) so that you can see which operation generates most of the transactions.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stfabrikam01**. Dans Metrics Explorer, vous ouvrez un graphique de la métrique **Transactions** de stfabrikam01.

    Le graphique doit afficher une ligne distincte pour chaque opération d'API (GetBlob, PutBlob, ListBlobs, etc.) afin que vous voyiez quelle opération génère la plupart des transactions.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Apply splitting on the API name dimension.", fr: "Appliquer un fractionnement sur la dimension API name." } }
    - { id: b, text: { en: "Add a filter on the API name dimension.", fr: "Ajouter un filtre sur la dimension API name." } }
    - { id: c, text: { en: "Change the aggregation from Sum to Count.", fr: "Remplacer l'agrégation Sum par Count." } }
    - { id: d, text: { en: "Reduce the time granularity to 1 minute.", fr: "Réduire la granularité temporelle à 1 minute." } }
answer: { optionId: a }
explanation:
  correct:
    en: Splitting segments a multi-dimensional metric by the values of a dimension and draws one line per value, which shows how each API operation contributes to the total number of transactions.
    fr: Le fractionnement segmente une métrique multidimensionnelle selon les valeurs d'une dimension et trace une ligne par valeur, ce qui montre la contribution de chaque opération d'API au nombre total de transactions.
  options:
    b:
      en: A filter keeps only the selected dimension values but still draws a single aggregated line.
      fr: Un filtre ne conserve que les valeurs de dimension sélectionnées, mais trace toujours une seule ligne agrégée.
    c:
      en: Changing the aggregation changes the statistic that is calculated, not the number of lines.
      fr: Changer l'agrégation modifie la statistique calculée, pas le nombre de lignes.
    d:
      en: The time granularity only changes the size of the time buckets on the chart.
      fr: La granularité temporelle change seulement la taille des intervalles de temps du graphique.
references:
  - title: Analyze metrics with Azure Monitor metrics explorer
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/analyze-metrics
