id: m2-rsv-change-redundancy
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a Recovery Services vault named **RSV1** with the default settings. No backup has been configured in RSV1 yet.

    Azure is not the primary backup storage endpoint for your company, and you need to reduce the storage cost of RSV1 by using locally redundant storage (LRS).

    What should you do?
  fr: |
    Vous créez un coffre Recovery Services nommé **RSV1** avec les paramètres par défaut. Aucune sauvegarde n'a encore été configurée dans RSV1.

    Azure n'est pas le point de terminaison principal de stockage des sauvegardes de votre entreprise, et vous devez réduire le coût de stockage de RSV1 en utilisant le stockage localement redondant (LRS).

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: In the vault Properties, update Backup Configuration and set Storage replication type to Locally-redundant.
        fr: Dans les propriétés du coffre, mettre à jour Backup Configuration et définir le type de réplication de stockage sur Locally-redundant.
    - id: b
      text:
        en: Configure the first backup item, and then set Storage replication type to Locally-redundant in the vault.
        fr: Configurer le premier élément de sauvegarde, puis définir le type de réplication de stockage sur Locally-redundant dans le coffre.
    - id: c
      text:
        en: Create a backup policy and set its storage redundancy to Locally-redundant in the retention settings.
        fr: Créer une stratégie de sauvegarde et définir sa redondance de stockage sur Locally-redundant dans les paramètres de rétention.
    - id: d
      text:
        en: Create a Standard_LRS general-purpose v2 storage account and link it to RSV1 as its backup storage.
        fr: Créer un compte de stockage v2 universel Standard_LRS et le lier à RSV1 comme stockage de sauvegarde.
answer: { optionId: a }
explanation:
  correct:
    en: A new Recovery Services vault uses geo-redundant storage by default. You change the storage replication type in Properties > Backup Configuration, and you must do it before you configure a backup, because the setting is disabled once items are protected.
    fr: Un nouveau coffre Recovery Services utilise par défaut le stockage géoredondant. Vous modifiez le type de réplication de stockage dans Propriétés > Backup Configuration, et vous devez le faire avant de configurer une sauvegarde, car le paramètre est désactivé dès que des éléments sont protégés.
  options:
    b:
      en: After a backup is configured, the option to change the storage replication type is disabled; you would have to use a workaround such as a new vault.
      fr: Une fois une sauvegarde configurée, l'option de modification du type de réplication de stockage est désactivée ; il faudrait recourir à une solution de contournement, comme un nouveau coffre.
    c:
      en: Storage redundancy is a vault setting, not a backup policy setting.
      fr: La redondance du stockage est un paramètre du coffre, pas un paramètre de la stratégie de sauvegarde.
    d:
      en: Azure Backup manages the vault storage automatically; you cannot attach your own storage account to a Recovery Services vault.
      fr: Sauvegarde Azure gère automatiquement le stockage du coffre ; vous ne pouvez pas attacher votre propre compte de stockage à un coffre Recovery Services.
references:
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
