id: mon-backup-vault-workloads
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to protect several workloads with Azure Backup. Some workloads must be protected by using a **Backup vault**, and the others by using a **Recovery Services vault**.

    Which two workloads are protected by using a Backup vault? Each correct answer presents a complete solution.
  fr: |
    Vous prévoyez de protéger plusieurs charges de travail avec Sauvegarde Azure. Certaines doivent être protégées avec un **coffre de sauvegarde** (Backup vault), les autres avec un **coffre Recovery Services**.

    Quelles sont les deux charges de travail protégées avec un coffre de sauvegarde ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: Azure Blobs (operational backup), fr: Azure Blobs (sauvegarde opérationnelle) } }
    - { id: b, text: { en: Azure managed disks, fr: Disques managés Azure } }
    - { id: c, text: { en: Azure Files shares, fr: Partages Azure Files } }
    - { id: d, text: { en: Azure virtual machines, fr: Machines virtuelles Azure } }
    - { id: e, text: { en: SQL Server running in an Azure VM, fr: SQL Server exécuté dans une machine virtuelle Azure } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Backup vaults host the newer datasources such as Azure Blobs, Azure managed disks, Azure Database for PostgreSQL and AKS. Azure VMs, Azure Files and SQL Server or SAP HANA in Azure VMs are protected in a Recovery Services vault.
    fr: Les coffres de sauvegarde hébergent les sources de données plus récentes comme Azure Blobs, les disques managés Azure, Azure Database for PostgreSQL et AKS. Les machines virtuelles Azure, Azure Files et SQL Server ou SAP HANA dans des machines virtuelles Azure sont protégés dans un coffre Recovery Services.
references:
  - title: Overview of the Backup vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
