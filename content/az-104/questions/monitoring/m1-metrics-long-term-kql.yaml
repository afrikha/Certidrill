id: m1-metrics-long-term-kql
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains an Azure SQL database named **sqldb-sales** and a Log Analytics workspace named **law-contoso**.

    Analysts must be able to compare the platform metrics of sqldb-sales over the last 12 months by using Kusto Query Language (KQL) queries.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure qui contient une base de données Azure SQL nommée **sqldb-sales** et un espace de travail Log Analytics nommé **law-contoso**.

    Les analystes doivent pouvoir comparer les métriques de plateforme de sqldb-sales sur les 12 derniers mois au moyen de requêtes en langage de requête Kusto (KQL).

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting on sqldb-sales that sends AllMetrics to law-contoso.", fr: "Créer un paramètre de diagnostic sur sqldb-sales qui envoie AllMetrics vers law-contoso." } }
    - { id: b, text: { en: "Increase the metric retention of sqldb-sales to 365 days in Metrics Explorer.", fr: "Augmenter la rétention des métriques de sqldb-sales à 365 jours dans Metrics Explorer." } }
    - { id: c, text: { en: "Create a data collection rule that collects performance counters and associate it with sqldb-sales.", fr: "Créer une règle de collecte de données qui collecte des compteurs de performances et l'associer à sqldb-sales." } }
    - { id: d, text: { en: "Pin a Metrics Explorer chart of sqldb-sales to a shared dashboard.", fr: "Épingler un graphique Metrics Explorer de sqldb-sales sur un tableau de bord partagé." } }
answer: { optionId: a }
explanation:
  correct:
    en: Platform metrics are kept for 93 days in the Azure Monitor metrics database and are not queried with KQL. A diagnostic setting that sends AllMetrics to a Log Analytics workspace copies them into the AzureMetrics table, where the workspace retention applies and you can query them with KQL.
    fr: Les métriques de plateforme sont conservées 93 jours dans la base de métriques d'Azure Monitor et ne s'interrogent pas en KQL. Un paramètre de diagnostic qui envoie AllMetrics vers un espace de travail Log Analytics les copie dans la table AzureMetrics, où s'applique la rétention de l'espace de travail et où vous pouvez les interroger en KQL.
  options:
    b:
      en: The 93-day retention of platform metrics is fixed; Metrics Explorer has no retention setting.
      fr: La rétention de 93 jours des métriques de plateforme est fixe ; Metrics Explorer ne possède aucun paramètre de rétention.
    c:
      en: Data collection rules configure the Azure Monitor Agent on machines; they do not export the platform metrics of a PaaS database.
      fr: Les règles de collecte de données configurent l'agent Azure Monitor sur des machines ; elles n'exportent pas les métriques de plateforme d'une base de données PaaS.
    d:
      en: A pinned chart only displays the existing metric data; it neither extends retention nor allows KQL queries.
      fr: Un graphique épinglé affiche seulement les données de métriques existantes ; il ne prolonge pas la rétention et ne permet pas les requêtes KQL.
references:
  - title: Metrics in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings
