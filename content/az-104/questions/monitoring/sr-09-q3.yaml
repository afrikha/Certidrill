id: sr-09-q3
objective: "5.1.4"
type: series_yesno
series: sr-09-cpu-alert
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create an alert processing rule for VM1 that applies an email action group.
  fr: |
    Vous créez pour VM1 une règle de traitement des alertes qui applique un groupe d'actions de messagerie.
body:
  solution:
    en: |
      You create an **alert processing rule** scoped to VM1 with the action **Apply action group**, using an action group that emails `ops@contoso.com`. You don't create any alert rule.
    fr: |
      Vous créez une **règle de traitement des alertes** dont l'étendue est VM1 avec l'action **Apply action group**, en utilisant un groupe d'actions qui envoie un e-mail à `ops@contoso.com`. Vous ne créez aucune règle d'alerte.
answer: { value: false }
explanation:
  correct:
    en: |
      Alert processing rules modify alerts that have already fired, for example to add or suppress action groups. They don't evaluate metrics and don't generate alerts; that is the role of alert rules. With no alert rule monitoring the CPU of VM1, no alert fires and no email is sent, so the goal isn't met.
    fr: |
      Les règles de traitement des alertes modifient des alertes déjà déclenchées, par exemple pour ajouter ou supprimer des groupes d'actions. Elles n'évaluent pas de métriques et ne génèrent pas d'alertes ; c'est le rôle des règles d'alerte. Sans règle d'alerte qui surveille le processeur de VM1, aucune alerte ne se déclenche et aucun e-mail n'est envoyé : l'objectif n'est pas atteint.
references:
  - title: "Alert processing rules for Azure Monitor alerts"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
