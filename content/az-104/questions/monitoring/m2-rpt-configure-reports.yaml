id: m2-rpt-configure-reports
objective: "5.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 15 Recovery Services vaults in three regions. Management wants a report that shows backup job success, cloud storage usage and policy adherence across all the vaults over the last six months.

    You need to configure Azure Backup reports.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose de 15 coffres Recovery Services répartis dans trois régions. La direction veut un rapport qui montre la réussite des travaux de sauvegarde, l'utilisation du stockage cloud et le respect des stratégies sur l'ensemble des coffres au cours des six derniers mois.

    Vous devez configurer les rapports de Sauvegarde Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ws, text: { en: Create a Log Analytics workspace and set its data retention to at least 180 days., fr: Créer un espace de travail Log Analytics et définir sa rétention des données sur au moins 180 jours. } }
    - { id: diag, text: { en: "On each vault, add a diagnostic setting that sends the Azure Backup events to the workspace in **Resource specific** mode.", fr: "Sur chaque coffre, ajouter un paramètre de diagnostic qui envoie les événements de Sauvegarde Azure à l'espace de travail en mode **Spécifique à la ressource** (Resource specific)." } }
    - { id: wait, text: { en: Wait for the initial data push to the workspace to complete., fr: "Attendre la fin de l'envoi initial des données vers l'espace de travail." } }
    - { id: view, text: { en: "In Resiliency, open **Backup Reports** and select the workspace.", fr: "Dans Resiliency, ouvrir **Backup Reports** (rapports de sauvegarde) et sélectionner l'espace de travail." } }
    - { id: azdiag, text: { en: "On each vault, add a diagnostic setting that sends the legacy Azure Backup Reporting Data event in **Azure diagnostics** mode.", fr: "Sur chaque coffre, ajouter un paramètre de diagnostic qui envoie l'ancien événement Azure Backup Reporting Data en mode **Diagnostics Azure** (Azure diagnostics)." } }
    - { id: sa, text: { en: Create a storage account in each region to receive the vault diagnostics., fr: Créer un compte de stockage dans chaque région pour recevoir les diagnostics des coffres. } }
answer:
  sequence: [ ws, diag, wait, view ]
explanation:
  correct:
    en: Backup reports run on Azure Monitor logs. You need a Log Analytics workspace (it can be in any region and subscription) whose retention covers the period you want, because the default is 30 days. The vaults send their diagnostics events in resource-specific mode; the first data can take up to 24 hours to arrive, and you then view the reports in Resiliency.
    fr: Les rapports de sauvegarde s'appuient sur les journaux Azure Monitor. Il faut un espace de travail Log Analytics (dans n'importe quelle région et n'importe quel abonnement) dont la rétention couvre la période souhaitée, car la valeur par défaut est de 30 jours. Les coffres envoient leurs événements de diagnostic en mode spécifique à la ressource ; les premières données peuvent mettre jusqu'à 24 heures à arriver, puis vous consultez les rapports dans Resiliency.
  options:
    azdiag: { en: The current reports use the new events in resource-specific mode; the legacy event is on a deprecation path., fr: "Les rapports actuels utilisent les nouveaux événements en mode spécifique à la ressource ; l'ancien événement est en voie de dépréciation." }
    sa: { en: "Backup reports read data from a Log Analytics workspace, not from storage accounts.", fr: "Les rapports de sauvegarde lisent les données d'un espace de travail Log Analytics, pas de comptes de stockage." }
references:
  - title: Configure Azure Backup reports
    url: https://learn.microsoft.com/en-us/azure/backup/configure-reports
  - title: Diagnostic events for Azure Backup users
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-diagnostic-events
