id: m2-fo-failover-failback
objective: "5.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An Azure virtual machine named **VM1** in East US is replicated to West US by using Azure Site Recovery. A major outage affects East US.

    You need to run VM1 in West US during the outage, and then return VM1 to East US when the region is available again, so that VM1 is again protected by replication to West US.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une machine virtuelle Azure nommée **VM1** située dans East US est répliquée vers West US avec Azure Site Recovery. Une panne majeure touche East US.

    Vous devez exécuter VM1 dans West US pendant la panne, puis ramener VM1 dans East US lorsque la région est de nouveau disponible, afin que VM1 soit à nouveau protégée par une réplication vers West US.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: fo, text: { en: Run a failover of VM1 from East US to West US., fr: Exécuter un basculement de VM1 d'East US vers West US. } }
    - { id: commit, text: { en: Commit the failover., fr: Valider le basculement. } }
    - { id: rp1, text: { en: Re-protect VM1 so that it replicates from West US to East US., fr: Reprotéger VM1 pour qu'elle soit répliquée de West US vers East US. } }
    - { id: fb, text: { en: Run a failover of VM1 from West US to East US., fr: Exécuter un basculement de VM1 de West US vers East US. } }
    - { id: rp2, text: { en: Re-protect VM1 so that it replicates from East US to West US., fr: Reprotéger VM1 pour qu'elle soit répliquée d'East US vers West US. } }
    - { id: cleanup, text: { en: Clean up the test failover., fr: Nettoyer le test de basculement. } }
    - { id: disable, text: { en: Disable replication of VM1 and enable it again from West US., fr: Désactiver la réplication de VM1 et la réactiver depuis West US. } }
answer:
  sequence: [ fo, commit, rp1, fb, rp2 ]
explanation:
  correct:
    en: After the failover, you commit it (the VM status must be Failover committed) and re-protect the VM so that it replicates back to the primary region. Failback is a failover from the secondary to the primary region. You then re-protect again to restart replication from the primary to the secondary region; for managed disks, Site Recovery cleans up the VMs in the secondary region.
    fr: Après le basculement, vous le validez (l'état de la machine virtuelle doit être Basculement validé) et reprotégez la machine virtuelle pour qu'elle soit répliquée vers la région primaire. La restauration automatique est un basculement de la région secondaire vers la région primaire. Vous reprotégez ensuite à nouveau pour relancer la réplication de la région primaire vers la région secondaire ; pour les disques managés, Site Recovery nettoie les machines virtuelles de la région secondaire.
  options:
    cleanup: { en: "Cleanup applies only to a test failover, which was not run here.", fr: "Le nettoyage ne s'applique qu'à un test de basculement, qui n'a pas été exécuté ici." }
    disable: { en: Disabling replication removes protection; re-protect reverses the replication direction without starting over., fr: "Désactiver la réplication supprime la protection ; la reprotection inverse le sens de réplication sans tout recommencer." }
references:
  - title: Tutorial to fail over Azure VMs to a secondary region
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-failover-failback
  - title: Tutorial to fail back Azure VMs to a primary region
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-failback
