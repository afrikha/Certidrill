id: m1-alert-activity-cli
objective: "5.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an action group named **ag-ops** in a resource group named **RG-Monitor**.

    You need to notify ag-ops whenever a virtual machine in the resource group **RG-Prod** is deleted.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe d'actions nommé **ag-ops** dans un groupe de ressources nommé **RG-Monitor**.

    Vous devez prévenir ag-ops chaque fois qu'une machine virtuelle du groupe de ressources **RG-Prod** est supprimée.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az monitor [[cmd]] create \
      --name alert-vm-delete \
      --resource-group RG-Monitor \
      --scope /subscriptions/<subscription-id>/resourceGroups/RG-Prod \
      --condition category=[[cat]] and operationName=Microsoft.Compute/virtualMachines/delete \
      [[ag]] ag-ops
  slots:
    - id: cmd
      options:
        - { id: al, text: activity-log alert }
        - { id: ma, text: metrics alert }
        - { id: sq, text: scheduled-query }
        - { id: apr, text: alert-processing-rule }
    - id: cat
      options:
        - { id: admin, text: Administrative }
        - { id: sh, text: ServiceHealth }
        - { id: rh, text: ResourceHealth }
        - { id: sec, text: Security }
    - id: ag
      options:
        - { id: agp, text: --action-group }
        - { id: sn, text: --short-name }
        - { id: wh, text: --webhook-properties }
answer:
  values: { cmd: al, cat: admin, ag: agp }
explanation:
  correct:
    en: Deleting a virtual machine is a control plane operation recorded in the Administrative category of the activity log, so you create an activity log alert rule with `az monitor activity-log alert create`. The condition filters on the category and the operation name, and `--action-group` attaches ag-ops by name or resource ID.
    fr: La suppression d'une machine virtuelle est une opération du plan de contrôle enregistrée dans la catégorie Administrative du journal d'activité ; vous créez donc une règle d'alerte de journal d'activité avec `az monitor activity-log alert create`. La condition filtre sur la catégorie et le nom de l'opération, et `--action-group` attache ag-ops par son nom ou son ID de ressource.
  options:
    ma: { en: "A metric alert evaluates numeric metrics; a deletion is an activity log event.", fr: "Une alerte de métrique évalue des métriques numériques ; une suppression est un événement du journal d'activité." }
    sh: { en: "ServiceHealth events describe Azure service incidents and maintenance, not your own operations.", fr: "Les événements ServiceHealth décrivent les incidents et maintenances des services Azure, pas vos propres opérations." }
    sn: { en: "The short name is a property of an action group, not of an alert rule.", fr: "Le nom court est une propriété d'un groupe d'actions, pas d'une règle d'alerte." }
references:
  - title: az monitor activity-log alert
    url: https://learn.microsoft.com/en-us/cli/azure/monitor/activity-log/alert
  - title: Create an activity log, service health, or resource health alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-activity-log-alert-rule
