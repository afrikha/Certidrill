id: m1-dcr-windows-events
objective: "5.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have 20 Windows Server virtual machines in Azure. The Azure Monitor Agent is already installed on all of them. No Log Analytics workspace exists.

    You need to collect the Error and Critical events of the System event log of the virtual machines so that you can query them with KQL. The solution must minimize the number of resources you create.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de 20 machines virtuelles Windows Server dans Azure. L'agent Azure Monitor est déjà installé sur toutes ces machines. Aucun espace de travail Log Analytics n'existe.

    Vous devez collecter les événements de niveau Erreur et Critique du journal des événements Système des machines virtuelles afin de pouvoir les interroger en KQL. La solution doit réduire au minimum le nombre de ressources que vous créez.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: law, text: { en: Create a Log Analytics workspace., fr: Créer un espace de travail Log Analytics. } }
    - { id: dcr, text: { en: "Create a data collection rule with a Windows Event Logs data source and the workspace as the destination.", fr: "Créer une règle de collecte de données avec une source de données Journaux des événements Windows et l'espace de travail comme destination." } }
    - { id: assoc, text: { en: Associate the data collection rule with the 20 virtual machines., fr: Associer la règle de collecte de données aux 20 machines virtuelles. } }
    - { id: mma, text: { en: Install the Log Analytics agent on the virtual machines., fr: Installer l'agent Log Analytics sur les machines virtuelles. } }
    - { id: diag, text: { en: Create a diagnostic setting on each virtual machine that sends the guest logs to the workspace., fr: Créer un paramètre de diagnostic sur chaque machine virtuelle qui envoie les journaux invités vers l'espace de travail. } }
    - { id: sa, text: { en: Create a storage account for the event data., fr: Créer un compte de stockage pour les données d'événements. } }
answer:
  sequence: [law, dcr, assoc]
explanation:
  correct:
    en: The data collection rule must reference an existing destination, so the workspace comes first. The DCR defines the events to collect and where to send them, and the Azure Monitor Agent applies a DCR only after the rule is associated with the machine. Windows events sent by the agent are stored in the Event table of the workspace.
    fr: La règle de collecte de données doit référencer une destination existante ; l'espace de travail vient donc en premier. La DCR définit les événements à collecter et leur destination, et l'agent Azure Monitor n'applique une DCR qu'une fois la règle associée à la machine. Les événements Windows envoyés par l'agent sont stockés dans la table Event de l'espace de travail.
  options:
    mma: { en: The Log Analytics agent is retired; the Azure Monitor Agent is already installed., fr: L'agent Log Analytics est mis hors service ; l'agent Azure Monitor est déjà installé. }
    diag: { en: Diagnostic settings route platform logs and metrics; guest OS events are collected by the agent through a DCR., fr: Les paramètres de diagnostic acheminent les journaux et métriques de plateforme ; les événements du système d'exploitation invité sont collectés par l'agent via une DCR. }
    sa: { en: "A storage account is an extra resource that is not needed; to query the events with KQL, the DCR sends them to the Log Analytics workspace.", fr: "Un compte de stockage est une ressource supplémentaire inutile ; pour interroger les événements en KQL, la DCR les envoie vers l'espace de travail Log Analytics." }
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
  - title: Data collection rules in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-rule-overview
