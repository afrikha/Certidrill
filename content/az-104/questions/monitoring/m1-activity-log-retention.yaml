id: m1-activity-log-retention
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription named **Sub1** and a Log Analytics workspace named **law-audit**.

    The auditors require that all the activity log events of Sub1 are kept for two years and can be analyzed by using log queries.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure nommé **Sub1** et d'un espace de travail Log Analytics nommé **law-audit**.

    Les auditeurs exigent que tous les événements du journal d'activité de Sub1 soient conservés pendant deux ans et puissent être analysés au moyen de requêtes de journal.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting for the activity log of Sub1 that sends the events to law-audit, and set the retention of the AzureActivity table to two years.", fr: "Créer un paramètre de diagnostic pour le journal d'activité de Sub1 qui envoie les événements vers law-audit, et définir la rétention de la table AzureActivity sur deux ans." } }
    - { id: b, text: { en: "Change the retention period of the activity log of Sub1 from 90 days to 730 days.", fr: "Faire passer la période de rétention du journal d'activité de Sub1 de 90 jours à 730 jours." } }
    - { id: c, text: { en: "Create a data collection rule that collects the activity log and associate it with every resource group of Sub1.", fr: "Créer une règle de collecte de données qui collecte le journal d'activité et l'associer à chaque groupe de ressources de Sub1." } }
    - { id: d, text: { en: "Create a diagnostic setting on each resource of Sub1 that sends allLogs to law-audit.", fr: "Créer un paramètre de diagnostic sur chaque ressource de Sub1 qui envoie allLogs vers law-audit." } }
answer: { optionId: a }
explanation:
  correct:
    en: Azure keeps activity log events for 90 days and this period cannot be changed. To keep them longer, you export the activity log with a subscription-level diagnostic setting; in a Log Analytics workspace the events land in the AzureActivity table, whose retention you can extend.
    fr: Azure conserve les événements du journal d'activité pendant 90 jours et cette durée n'est pas modifiable. Pour les conserver plus longtemps, vous exportez le journal d'activité avec un paramètre de diagnostic au niveau de l'abonnement ; dans un espace de travail Log Analytics, les événements arrivent dans la table AzureActivity, dont vous pouvez prolonger la rétention.
  options:
    b:
      en: The 90-day retention of the activity log is fixed.
      fr: La rétention de 90 jours du journal d'activité est fixe.
    c:
      en: The activity log is exported with a diagnostic setting, not with a data collection rule associated with resource groups.
      fr: Le journal d'activité s'exporte avec un paramètre de diagnostic, pas avec une règle de collecte de données associée à des groupes de ressources.
    d:
      en: A resource diagnostic setting sends resource logs (data plane operations), not the subscription activity log (control plane operations).
      fr: Un paramètre de diagnostic de ressource envoie les journaux de ressources (opérations du plan de données), pas le journal d'activité de l'abonnement (opérations du plan de contrôle).
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
