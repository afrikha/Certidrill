id: m1-metrics-multi-resource
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have the following virtual machines:

    | Name | Subscription | Region |
    | --- | --- | --- |
    | VM1 | Sub1 | West Europe |
    | VM2 | Sub1 | West Europe |
    | VM3 | Sub1 | North Europe |
    | VM4 | Sub2 | West Europe |
    | VM5 | Sub1 | West Europe |

    You need to create a single Metrics Explorer chart that displays the Percentage CPU metric of VM1 together with other virtual machines, by selecting several resources in the resource scope picker.

    Which two virtual machines can you add to the chart of VM1? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des machines virtuelles suivantes :

    | Nom | Abonnement | Région |
    | --- | --- | --- |
    | VM1 | Sub1 | West Europe |
    | VM2 | Sub1 | West Europe |
    | VM3 | Sub1 | North Europe |
    | VM4 | Sub2 | West Europe |
    | VM5 | Sub1 | West Europe |

    Vous devez créer un seul graphique Metrics Explorer qui affiche la métrique Percentage CPU de VM1 avec celle d'autres machines virtuelles, en sélectionnant plusieurs ressources dans le sélecteur d'étendue de ressources.

    Quelles sont les deux machines virtuelles que vous pouvez ajouter au graphique de VM1 ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: vm2, text: VM2 }
    - { id: vm3, text: VM3 }
    - { id: vm4, text: VM4 }
    - { id: vm5, text: VM5 }
answer: { optionIds: [vm2, vm5] }
explanation:
  correct:
    en: To chart one metric across several resources selected in the scope picker, the resources must be of the same resource type, in the same location and in the same subscription. VM2 and VM5 are virtual machines in Sub1 and West Europe, like VM1.
    fr: Pour représenter une métrique sur plusieurs ressources sélectionnées dans le sélecteur d'étendue, les ressources doivent être du même type, au même emplacement et dans le même abonnement. VM2 et VM5 sont des machines virtuelles de Sub1 situées en West Europe, comme VM1.
  options:
    vm3: { en: "VM3 is in another region (North Europe).", fr: "VM3 se trouve dans une autre région (North Europe)." }
    vm4: { en: "VM4 is in another subscription (Sub2).", fr: "VM4 se trouve dans un autre abonnement (Sub2)." }
references:
  - title: Analyze metrics with Azure Monitor metrics explorer
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/analyze-metrics
