id: cs1-litware-06
objective: "5.1.3"
type: dropdown
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to write the query for the support team in law-litware.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez écrire la requête pour l'équipe de support dans law-litware.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(24h)
    | where [[col]] >= 500
    | summarize Errors = count() by [[bin]]
  slots:
    - id: table
      options:
        - { id: http, text: AppServiceHTTPLogs }
        - { id: console, text: AppServiceConsoleLogs }
        - { id: activity, text: AzureActivity }
    - id: col
      options:
        - { id: status, text: ScStatus }
        - { id: bytes, text: ScBytes }
        - { id: time, text: TimeTaken }
    - id: bin
      options:
        - { id: h1, text: "bin(TimeGenerated, 1h)" }
        - { id: d1, text: "bin(TimeGenerated, 1d)" }
        - { id: host, text: CsHost }
answer:
  values: { table: http, col: status, bin: h1 }
explanation:
  correct:
    en: |
      The diagnostic setting sends the incoming HTTP requests of app-litwaredesk to the AppServiceHTTPLogs table, whose ScStatus column holds the HTTP status code. Filtering on ScStatus >= 500 keeps the server errors, and summarizing by bin(TimeGenerated, 1h) returns one count per hour.
    fr: |
      Le paramètre de diagnostic envoie les requêtes HTTP entrantes de app-litwaredesk vers la table AppServiceHTTPLogs, dont la colonne ScStatus contient le code d'état HTTP. Le filtre ScStatus >= 500 conserve les erreurs serveur, et l'agrégation par bin(TimeGenerated, 1h) renvoie un nombre par heure.
  options:
    console: { en: "AppServiceConsoleLogs holds the standard output and error of the app, not the HTTP status codes.", fr: "AppServiceConsoleLogs contient la sortie standard et la sortie d'erreur de l'application, pas les codes d'état HTTP." }
    activity: { en: "AzureActivity contains control plane operations from the activity log, not web requests.", fr: "AzureActivity contient les opérations du plan de contrôle issues du journal d'activité, pas les requêtes web." }
    bytes: { en: "ScBytes is the number of bytes sent by the server.", fr: "ScBytes est le nombre d'octets envoyés par le serveur." }
    time: { en: "TimeTaken is the duration of the request in milliseconds.", fr: "TimeTaken est la durée de la requête en millisecondes." }
    d1: { en: "A one-day bin returns a daily total, not an hourly count.", fr: "Un intervalle d'un jour renvoie un total quotidien, pas un nombre par heure." }
    host: { en: "Grouping by CsHost counts errors per host name, not per hour.", fr: "Le regroupement par CsHost compte les erreurs par nom d'hôte, pas par heure." }
references:
  - title: Azure Monitor Logs reference - AppServiceHTTPLogs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appservicehttplogs
