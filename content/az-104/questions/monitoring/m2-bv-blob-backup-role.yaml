id: m2-bv-blob-backup-role
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stwoodgrove01** and a Backup vault named **BV-Woodgrove** in the same region.

    You plan to configure backup of the block blobs in stwoodgrove01 by using BV-Woodgrove. The configuration fails validation because the vault is not allowed to enable the required data protection properties on the storage account.

    Which role should you assign to the managed identity of BV-Woodgrove on stwoodgrove01? The solution must follow the principle of least privilege.
  fr: |
    Vous disposez d'un compte de stockage nommé **stwoodgrove01** et d'un coffre de sauvegarde nommé **BV-Woodgrove** dans la même région.

    Vous prévoyez de configurer la sauvegarde des objets blob de blocs de stwoodgrove01 avec BV-Woodgrove. La validation de la configuration échoue, car le coffre n'est pas autorisé à activer les propriétés de protection des données requises sur le compte de stockage.

    Quel rôle devez-vous attribuer à l'identité managée de BV-Woodgrove sur stwoodgrove01 ? La solution doit respecter le principe du moindre privilège.
body:
  options:
    - { id: a, text: Storage Account Backup Contributor }
    - { id: b, text: Storage Blob Data Contributor }
    - { id: c, text: Backup Operator }
    - { id: d, text: Owner }
answer: { optionId: a }
explanation:
  correct:
    en: When you configure blob backup, Azure Backup enables point-in-time restore, soft delete, versioning and change feed on the storage account, and applies a delete lock. The Backup vault must be granted the Storage Account Backup Contributor role on the storage account to do this.
    fr: Lorsque vous configurez la sauvegarde des blobs, Sauvegarde Azure active la restauration à un point dans le temps, la suppression réversible, le contrôle de version et le flux de modification sur le compte de stockage, et applique un verrou de suppression. Pour cela, le coffre de sauvegarde doit recevoir le rôle Storage Account Backup Contributor sur le compte de stockage.
  options:
    b:
      en: Storage Blob Data Contributor grants access to blob data, not the right to configure the account's data protection properties.
      fr: Storage Blob Data Contributor accorde l'accès aux données des blobs, pas le droit de configurer les propriétés de protection des données du compte.
    c:
      en: Backup Operator is a role for users who manage backups in a vault; it grants nothing on the storage account.
      fr: Backup Operator est un rôle destiné aux utilisateurs qui gèrent les sauvegardes d'un coffre ; il n'accorde rien sur le compte de stockage.
    d:
      en: Owner would work but grants far more than required, which breaks the least-privilege requirement.
      fr: Owner fonctionnerait, mais accorde bien plus que nécessaire, ce qui ne respecte pas le moindre privilège.
references:
  - title: Overview of Azure Blobs backup
    url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
