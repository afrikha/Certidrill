id: m1-kql-perf-timechart
objective: "5.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your Windows virtual machines send performance counters to a Log Analytics workspace by using the Azure Monitor Agent and a data collection rule.

    You need a query that displays, as a line chart, the average total processor time of each computer for each hour of the last day.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vos machines virtuelles Windows envoient des compteurs de performances vers un espace de travail Log Analytics avec l'agent Azure Monitor et une règle de collecte de données.

    Vous avez besoin d'une requête qui affiche, sous forme de graphique en courbes, le temps processeur total moyen de chaque ordinateur pour chaque heure de la dernière journée.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Perf
    | where TimeGenerated > ago(1d)
    | where CounterName == "% Processor Time" and InstanceName == "_Total"
    | summarize AvgCPU = [[agg]](CounterValue) by Computer, [[bucket]]
    | [[viz]]
  slots:
    - id: agg
      options:
        - { id: avg, text: avg }
        - { id: sum, text: sum }
        - { id: dcount, text: dcount }
        - { id: count, text: count }
    - id: bucket
      options:
        - { id: bin, text: "bin(TimeGenerated, 1h)" }
        - { id: raw, text: TimeGenerated }
        - { id: ago, text: ago(1h) }
        - { id: sod, text: startofday(TimeGenerated) }
    - id: viz
      options:
        - { id: tc, text: render timechart }
        - { id: pie, text: render piechart }
        - { id: proj, text: project timechart }
        - { id: ext, text: extend timechart }
answer:
  values: { agg: avg, bucket: bin, viz: tc }
explanation:
  correct:
    en: "`avg(CounterValue)` computes the average of the samples. Grouping by `bin(TimeGenerated, 1h)` rounds each timestamp down to the hour, which produces one row per computer and per hour. `render timechart` draws the result as a line chart with time on the x-axis and one line per computer."
    fr: "`avg(CounterValue)` calcule la moyenne des échantillons. Le regroupement par `bin(TimeGenerated, 1h)` arrondit chaque horodatage à l'heure inférieure, ce qui produit une ligne par ordinateur et par heure. `render timechart` affiche le résultat sous forme de graphique en courbes, avec le temps en abscisse et une courbe par ordinateur."
  options:
    raw: { en: "Grouping by the raw TimeGenerated value creates one group per sample instead of one per hour.", fr: "Le regroupement sur la valeur brute de TimeGenerated crée un groupe par échantillon au lieu d'un groupe par heure." }
    sod: { en: "startofday groups the samples per day, not per hour.", fr: "startofday regroupe les échantillons par jour, pas par heure." }
    pie: { en: "A pie chart does not show values over time.", fr: "Un graphique en secteurs ne montre pas l'évolution des valeurs dans le temps." }
references:
  - title: bin() function (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function
  - title: render operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/render-operator
