id: m2-rpt-report-facts
objective: "5.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to use Azure Backup reports for Recovery Services vaults located in West Europe and East US.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser les rapports de Sauvegarde Azure pour des coffres Recovery Services situés dans West Europe et East US.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The vaults can send their data to a single Log Analytics workspace located in another region.", fr: "Les coffres peuvent envoyer leurs données vers un seul espace de travail Log Analytics situé dans une autre région." } }
    - { id: b, text: { en: "For the reports to show data, the vault events must be sent in Resource specific mode.", fr: "Pour que les rapports affichent des données, les événements des coffres doivent être envoyés en mode Spécifique à la ressource." } }
    - { id: c, text: { en: "The reports include the jobs of the current day up to the last 15 minutes.", fr: "Les rapports incluent les travaux de la journée en cours jusqu'aux 15 dernières minutes." } }
    - { id: d, text: { en: "You must select the Addon Azure Backup Alerts event to see job failures in the reports.", fr: "Vous devez sélectionner l'événement Addon Azure Backup Alerts pour voir les échecs de travaux dans les rapports." } }
    - { id: e, text: { en: "Each vault must send its data to a Log Analytics workspace in the same region as the vault.", fr: "Chaque coffre doit envoyer ses données vers un espace de travail Log Analytics situé dans la même région que lui." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The Log Analytics workspace can be in any region and subscription, so one workspace can collect data from vaults in several regions. For Recovery Services vaults, the reporting events are supported only in resource-specific mode; data sent in Azure diagnostics mode does not appear in Backup reports.
    fr: L'espace de travail Log Analytics peut se trouver dans n'importe quelle région et n'importe quel abonnement ; un seul espace peut donc collecter les données de coffres de plusieurs régions. Pour les coffres Recovery Services, les événements de rapport ne sont pris en charge qu'en mode spécifique à la ressource ; les données envoyées en mode Diagnostics Azure n'apparaissent pas dans les rapports de sauvegarde.
  options:
    c:
      en: Reports never show the current partial day; they cover completed days (UTC) only.
      fr: Les rapports n'affichent jamais la journée partielle en cours ; ils ne couvrent que des journées complètes (UTC).
    d:
      en: Addon Azure Backup Alerts relates to classic alerts and is not recommended; job data comes from the job event.
      fr: Addon Azure Backup Alerts concerne les alertes classiques et n'est pas recommandé ; les données des travaux proviennent de l'événement des travaux.
    e:
      en: Only a storage account destination must be in the same region as the vault; a workspace can be in another region.
      fr: Seule une destination de type compte de stockage doit se trouver dans la même région que le coffre ; un espace de travail peut être dans une autre région.
references:
  - title: Configure Azure Backup reports
    url: https://learn.microsoft.com/en-us/azure/backup/configure-reports
  - title: Diagnostic events for Azure Backup users
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-diagnostic-events
