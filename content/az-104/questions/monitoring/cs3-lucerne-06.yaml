id: cs3-lucerne-06
objective: "5.2.2"
type: single
caseStudy: cs3-lucerne
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You need to meet the backup requirement.

    What is the minimum number of vaults that you must create?
  fr: |
    Vous devez satisfaire l'exigence de sauvegarde.

    Quel est le nombre minimal de coffres que vous devez créer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: "All the resources are in East US 2, so one vault of each type is enough. A Recovery Services vault protects Azure virtual machines and Azure Files shares (VM-CMS1 and editorial-share). A Backup vault protects the newer workloads, including vaulted backup of Azure Blobs (contracts) and Azure Disk Backup (the managed disks of VM-CMS1). One vault can't hold both groups of workloads, so you need two vaults."
    fr: "Toutes les ressources se trouvent dans East US 2 : un coffre de chaque type suffit. Un coffre Recovery Services protège les machines virtuelles Azure et les partages Azure Files (VM-CMS1 et editorial-share). Un coffre de sauvegarde protège les charges de travail plus récentes, notamment la sauvegarde dans le coffre des objets blob Azure (contracts) et Azure Disk Backup (les disques managés de VM-CMS1). Un même coffre ne peut pas héberger les deux groupes de charges de travail ; il faut donc deux coffres."
  options:
    a: { en: "A Recovery Services vault doesn't support vaulted blob backup or Azure Disk Backup, and a Backup vault doesn't support Azure VM or Azure Files backup.", fr: "Un coffre Recovery Services ne prend pas en charge la sauvegarde des objets blob dans le coffre ni Azure Disk Backup, et un coffre de sauvegarde ne prend pas en charge la sauvegarde des machines virtuelles Azure ni d'Azure Files." }
    c: { en: "A vault can protect several types of workloads of the same family; you don't need one vault per workload.", fr: "Un coffre peut protéger plusieurs types de charges de travail de la même famille ; il n'est pas nécessaire d'avoir un coffre par charge de travail." }
    d: { en: "One vault per protected item isn't required and increases administrative effort.", fr: "Un coffre par élément protégé n'est pas nécessaire et augmente l'effort d'administration." }
references:
  - title: "Overview of the Backup vaults - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
  - title: "Create and Configure Recovery Services Vaults - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
