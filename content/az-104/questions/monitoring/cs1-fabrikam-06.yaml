id: cs1-fabrikam-06
objective: "5.1.6"
type: single
caseStudy: cs1-fabrikam
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement for the connection between VM-MES-US1 and VM-ERP1.

    What should you use?
  fr: |
    Vous devez satisfaire l'exigence de supervision de la connexion entre VM-MES-US1 et VM-ERP1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Connection Monitor test group with VM-MES-US1 as the source, VM-ERP1 as the destination, and a round-trip time threshold of 150 ms, with an alert", fr: "Un groupe de tests du Moniteur de connexion avec VM-MES-US1 comme source, VM-ERP1 comme destination et un seuil de temps aller-retour de 150 ms, avec une alerte" } }
    - { id: b, text: { en: "IP flow verify in Network Watcher, run from VM-MES-US1 to VM-ERP1", fr: "La vérification des flux IP de Network Watcher, exécutée de VM-MES-US1 vers VM-ERP1" } }
    - { id: c, text: { en: "A packet capture session on VM-MES-US1", fr: "Une session de capture de paquets sur VM-MES-US1" } }
    - { id: d, text: { en: "Virtual network flow logs for VNet-PlantUS sent to a Log Analytics workspace", fr: "Des journaux de flux de réseau virtuel pour VNet-PlantUS envoyés à un espace de travail Log Analytics" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Connection Monitor runs periodic checks between a source and a destination and records the round-trip time and the percentage of failed checks (packet loss). A test configuration can set a round-trip time threshold, and alerts can be raised when the threshold is exceeded. The Network Watcher agent extension is already installed on the VMs.
    fr: |
      Le Moniteur de connexion exécute des vérifications périodiques entre une source et une destination et enregistre le temps aller-retour ainsi que le pourcentage de vérifications en échec (perte de paquets). Une configuration de test peut définir un seuil de temps aller-retour, et des alertes peuvent être déclenchées en cas de dépassement. L'extension de l'agent Network Watcher est déjà installée sur les machines virtuelles.
  options:
    b: { en: "IP flow verify performs a one-time check of whether NSG rules allow a packet; it does not measure latency continuously.", fr: "La vérification des flux IP contrôle ponctuellement si les règles NSG autorisent un paquet ; elle ne mesure pas la latence en continu." }
    c: { en: "A packet capture records traffic for a limited session; it does not continuously measure round-trip time or raise threshold alerts.", fr: "Une capture de paquets enregistre le trafic pendant une session limitée ; elle ne mesure pas en continu le temps aller-retour et ne déclenche pas d'alertes de seuil." }
    d: { en: "Flow logs record the IP flows allowed or denied, not the round-trip time between two endpoints.", fr: "Les journaux de flux enregistrent les flux IP autorisés ou refusés, pas le temps aller-retour entre deux points de terminaison." }
references:
  - title: Connection Monitor overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
