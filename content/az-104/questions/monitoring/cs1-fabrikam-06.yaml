id: cs1-fabrikam-06
objective: "5.1.6"
type: single
caseStudy: cs1-fabrikam
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement for the connection between VM-MES-US1 and VM-ERP1.

    What should you use?
  fr: |
    Vous devez satisfaire l'exigence de supervision de la connexion entre VM-MES-US1 et VM-ERP1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Connection Monitor in Network Watcher", fr: "Le Moniteur de connexion de Network Watcher" } }
    - { id: b, text: { en: "Connection troubleshoot in Network Watcher", fr: "La résolution des problèmes de connexion de Network Watcher" } }
    - { id: c, text: { en: "IP flow verify in Network Watcher", fr: "La vérification des flux IP de Network Watcher" } }
    - { id: d, text: { en: "Virtual network flow logs with traffic analytics", fr: "Les journaux de flux de réseau virtuel avec l'analytique du trafic" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Connection Monitor runs periodic checks between a source (VM-MES-US1) and a destination (VM-ERP1) and records the round-trip time and the percentage of failed checks (packet loss). A test configuration can set a round-trip time threshold of 150 ms, and a metric alert can be raised when the threshold is exceeded. The Network Watcher agent extension is already installed on the VMs.
    fr: |
      Le Moniteur de connexion exécute des vérifications périodiques entre une source (VM-MES-US1) et une destination (VM-ERP1) et enregistre le temps aller-retour ainsi que le pourcentage de vérifications en échec (perte de paquets). Une configuration de test peut définir un seuil de temps aller-retour de 150 ms, et une alerte de métrique peut être déclenchée en cas de dépassement. L'extension de l'agent Network Watcher est déjà installée sur les machines virtuelles.
  options:
    b: { en: "Connection troubleshoot runs a one-time check and reports the latency of that check only; it does not monitor continuously or raise alerts.", fr: "La résolution des problèmes de connexion effectue une vérification ponctuelle et ne signale que la latence de cette vérification ; elle ne supervise pas en continu et ne déclenche pas d'alertes." }
    c: { en: "IP flow verify performs a one-time check of whether NSG rules allow a packet; it does not measure latency.", fr: "La vérification des flux IP contrôle ponctuellement si les règles NSG autorisent un paquet ; elle ne mesure pas la latence." }
    d: { en: "Flow logs and traffic analytics record and analyze the IP flows allowed or denied, not the round-trip time between two endpoints.", fr: "Les journaux de flux et l'analytique du trafic enregistrent et analysent les flux IP autorisés ou refusés, pas le temps aller-retour entre deux points de terminaison." }
references:
  - title: Connection Monitor overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
