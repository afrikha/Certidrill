id: m1-table-retention-cli
objective: "5.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Log Analytics workspace named **law-contoso** in a resource group named **RG-Monitor**. The workspace uses the default retention of 30 days.

    For the **Event** table only, you need to keep data available for interactive queries for 90 days, and keep it for two years in total before it is deleted. The other tables must keep their current retention.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un espace de travail Log Analytics nommé **law-contoso** dans un groupe de ressources nommé **RG-Monitor**. L'espace de travail utilise la rétention par défaut de 30 jours.

    Pour la table **Event** uniquement, vous devez garder les données disponibles pour les requêtes interactives pendant 90 jours, et les conserver deux ans au total avant leur suppression. Les autres tables doivent conserver leur rétention actuelle.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az monitor log-analytics workspace [[cmd]] \
      --resource-group RG-Monitor \
      --workspace-name law-contoso \
      --name Event \
      [[p1]] 90 \
      [[p2]] 730
  slots:
    - id: cmd
      options:
        - { id: table, text: table update }
        - { id: ws, text: update }
        - { id: export, text: data-export create }
    - id: p1
      options:
        - { id: rt, text: --retention-time }
        - { id: trt, text: --total-retention-time }
        - { id: rid, text: --retention-in-days }
        - { id: arch, text: --archive-days }
    - id: p2
      options:
        - { id: rt, text: --retention-time }
        - { id: trt, text: --total-retention-time }
        - { id: rid, text: --retention-in-days }
        - { id: arch, text: --archive-days }
answer:
  values: { cmd: table, p1: rt, p2: trt }
explanation:
  correct:
    en: Retention can be set per table with `az monitor log-analytics workspace table update`. `--retention-time` sets the analytics (interactive) retention, here 90 days, and `--total-retention-time` sets the total retention, here 730 days, so the data spends the remaining 640 days in long-term retention.
    fr: La rétention se définit par table avec `az monitor log-analytics workspace table update`. `--retention-time` définit la rétention d'analyse (interactive), ici 90 jours, et `--total-retention-time` la rétention totale, ici 730 jours ; les données passent donc les 640 jours restants en rétention à long terme.
  options:
    ws: { en: "`workspace update` changes the default retention of the whole workspace, which affects the other tables.", fr: "`workspace update` modifie la rétention par défaut de tout l'espace de travail, ce qui affecte les autres tables." }
    export: { en: A data export rule copies data to a storage account or event hub; it does not set retention., fr: Une règle d'exportation de données copie les données vers un compte de stockage ou un hub d'événements ; elle ne définit pas la rétention. }
references:
  - title: Manage data retention in a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
