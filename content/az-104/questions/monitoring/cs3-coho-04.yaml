id: cs3-coho-04
objective: "5.2.7"
type: single
caseStudy: cs3-coho
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the backup monitoring requirement.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de supervision des sauvegardes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure diagnostic settings on rsv-coho-fr and rsv-coho-us that send the data to law-coho, increase the retention of law-coho to 365 days, and use Backup reports.", fr: "Configurer sur rsv-coho-fr et rsv-coho-us des paramètres de diagnostic qui envoient les données à law-coho, porter la rétention de law-coho à 365 jours, puis utiliser les rapports de sauvegarde." } }
    - { id: b, text: { en: "Create a Log Analytics workspace in West US 2 for rsv-coho-us, configure each vault to send its diagnostic data to the workspace in its region, and use Backup reports.", fr: "Créer un espace de travail Log Analytics dans West US 2 pour rsv-coho-us, configurer chaque coffre pour envoyer ses données de diagnostic à l'espace de travail de sa région, puis utiliser les rapports de sauvegarde." } }
    - { id: c, text: { en: "Configure diagnostic settings on both vaults that send the data to a storage account, and use the Azure Backup Power BI template app.", fr: "Configurer sur les deux coffres des paramètres de diagnostic qui envoient les données à un compte de stockage, puis utiliser l'application modèle Power BI de Sauvegarde Azure." } }
    - { id: d, text: { en: "Create Azure Monitor alert rules for failed backup jobs on both vaults with an action group that sends an email.", fr: "Créer sur les deux coffres des règles d'alerte Azure Monitor pour les travaux de sauvegarde en échec, avec un groupe d'actions qui envoie un e-mail." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Backup reports read the diagnostic data that the vaults send to Log Analytics. The workspace can be in any region and subscription, so both vaults can use law-coho. The default retention is 30 days, so you extend it to cover 12 months of history."
    fr: "Les rapports de sauvegarde lisent les données de diagnostic que les coffres envoient à Log Analytics. L'espace de travail peut se trouver dans n'importe quelle région et n'importe quel abonnement : les deux coffres peuvent donc utiliser law-coho. La rétention par défaut est de 30 jours ; vous l'augmentez pour couvrir 12 mois d'historique."
  options:
    b: { en: "The workspace doesn't have to be in the vault's region; a second workspace adds cost and effort and doesn't extend the 30-day retention.", fr: "L'espace de travail n'a pas besoin d'être dans la région du coffre ; un deuxième espace de travail ajoute des coûts et de l'effort et ne prolonge pas la rétention de 30 jours." }
    c: { en: "The Power BI template app that reads from a storage account is on a deprecation path; Backup reports use Log Analytics.", fr: "L'application modèle Power BI qui lit un compte de stockage est en voie de dépréciation ; les rapports de sauvegarde utilisent Log Analytics." }
    d: { en: "Alerts notify about individual failures; they don't provide a report of jobs and storage usage over 12 months.", fr: "Les alertes signalent des échecs individuels ; elles ne fournissent pas de rapport sur les travaux et l'utilisation du stockage sur 12 mois." }
references:
  - title: "Configure Azure Backup reports"
    url: https://learn.microsoft.com/en-us/azure/backup/configure-reports
