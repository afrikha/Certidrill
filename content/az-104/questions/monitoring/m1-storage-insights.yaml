id: m1-storage-insights
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 60 storage accounts spread across three subscriptions.

    You need a single view that shows the availability, the end-to-end and server latency, the transactions and the used capacity of all the storage accounts, and that lets you drill down into failures for a specific account. The solution must minimize configuration effort.

    What should you use?
  fr: |
    Fabrikam possède 60 comptes de stockage répartis sur trois abonnements.

    Vous avez besoin d'une vue unique qui affiche la disponibilité, la latence de bout en bout et du serveur, les transactions et la capacité utilisée de tous les comptes de stockage, et qui permet d'explorer en détail les échecs d'un compte donné. La solution doit réduire au minimum l'effort de configuration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: Storage Insights in Azure Monitor, fr: Storage Insights dans Azure Monitor } }
    - { id: b, text: { en: A diagnostic setting on each storage account and a custom workbook in a Log Analytics workspace, fr: Un paramètre de diagnostic sur chaque compte de stockage et un classeur personnalisé dans un espace de travail Log Analytics } }
    - { id: c, text: { en: Storage browser in the Azure portal, fr: Le navigateur de stockage du portail Azure } }
    - { id: d, text: { en: Azure Advisor recommendations, fr: Les recommandations Azure Advisor } }
answer: { optionId: a }
explanation:
  correct:
    en: Storage Insights is built on the storage metrics that Azure collects by default, so nothing needs to be enabled. From Azure Monitor, it shows availability, latency, transactions and capacity across the storage accounts of your subscriptions, with workbooks for failures, performance, availability and capacity.
    fr: Storage Insights s'appuie sur les métriques de stockage collectées par défaut par Azure ; il n'y a donc rien à activer. Depuis Azure Monitor, il affiche la disponibilité, la latence, les transactions et la capacité des comptes de stockage de vos abonnements, avec des classeurs consacrés aux échecs, aux performances, à la disponibilité et à la capacité.
  options:
    b:
      en: This would work but requires 60 diagnostic settings and a custom workbook, which does not minimize configuration.
      fr: Cela fonctionnerait, mais nécessite 60 paramètres de diagnostic et un classeur personnalisé, ce qui ne réduit pas la configuration.
    c:
      en: Storage browser is used to manage the data in an account, not to monitor its performance.
      fr: Le navigateur de stockage sert à gérer les données d'un compte, pas à en surveiller les performances.
    d:
      en: Advisor gives best-practice recommendations, not availability and latency monitoring.
      fr: Advisor fournit des recommandations de bonnes pratiques, pas une supervision de la disponibilité et de la latence.
references:
  - title: Monitor Azure Storage services with Azure Monitor Storage insights
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-insights-overview
