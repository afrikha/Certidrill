id: m1-vminsights-onboarding
objective: "5.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows virtual machine named **VM1** with no monitoring extension installed. You enable VM insights on VM1 from the Azure portal and select an existing Log Analytics workspace for the logs-based metrics experience.

    Which two actions does the onboarding perform on VM1? Each correct answer presents part of the solution.
  fr: |
    Vous disposez d'une machine virtuelle Windows nommée **VM1** sur laquelle aucune extension de supervision n'est installée. Vous activez VM Insights sur VM1 depuis le portail Azure et sélectionnez un espace de travail Log Analytics existant pour l'expérience de métriques basée sur les journaux.

    Quelles sont les deux actions effectuées sur VM1 par l'intégration ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: It installs the Azure Monitor Agent extension., fr: Elle installe l'extension de l'agent Azure Monitor. } }
    - { id: b, text: { en: It associates VM1 with a data collection rule that sends the performance data to the workspace., fr: Elle associe VM1 à une règle de collecte de données qui envoie les données de performances vers l'espace de travail. } }
    - { id: c, text: { en: It installs the Log Analytics agent., fr: Elle installe l'agent Log Analytics. } }
    - { id: d, text: { en: It creates a diagnostic setting that sends the platform metrics of VM1 to the workspace., fr: Elle crée un paramètre de diagnostic qui envoie les métriques de plateforme de VM1 vers l'espace de travail. } }
    - { id: e, text: { en: It installs the Network Watcher Agent extension., fr: Elle installe l'extension de l'agent Network Watcher. } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Monitoring a VM takes three steps (install the Azure Monitor Agent, create data collection rules and associate them with the VM), and the portal onboarding performs them for you. The agent downloads the associated DCR and starts sending the data to its destination.
    fr: La supervision d'une machine virtuelle comporte trois étapes (installer l'agent Azure Monitor, créer des règles de collecte de données et les associer à la machine), et l'intégration depuis le portail les effectue pour vous. L'agent télécharge la DCR associée et commence à envoyer les données vers sa destination.
  options:
    c: { en: The Log Analytics agent is retired; VM insights uses the Azure Monitor Agent., fr: L'agent Log Analytics est mis hors service ; VM Insights utilise l'agent Azure Monitor. }
    d: { en: VM insights collects guest data through a DCR; it does not create diagnostic settings., fr: VM Insights collecte les données invitées via une DCR ; il ne crée pas de paramètres de diagnostic. }
    e: { en: "The Network Watcher Agent is used by Connection Monitor and packet capture, not by VM insights.", fr: "L'agent Network Watcher est utilisé par le Moniteur de connexion et la capture de paquets, pas par VM Insights." }
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
