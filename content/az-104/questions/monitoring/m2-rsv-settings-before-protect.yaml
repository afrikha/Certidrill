id: m2-rsv-settings-before-protect
objective: "5.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You create a new Recovery Services vault named **RSV-Adatum**. Before you protect any workload in the vault, you review its settings.

    Which two settings must be configured before you protect the first item, because you cannot change them afterwards? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un nouveau coffre Recovery Services nommé **RSV-Adatum**. Avant de protéger la moindre charge de travail dans le coffre, vous examinez ses paramètres.

    Quels sont les deux paramètres à configurer avant de protéger le premier élément, car vous ne pouvez plus les modifier ensuite ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The storage replication type", fr: "Le type de réplication de stockage" } }
    - { id: b, text: { en: "Encryption of the backup data with a customer-managed key", fr: "Le chiffrement des données de sauvegarde avec une clé gérée par le client" } }
    - { id: c, text: { en: "The soft delete retention period", fr: "La période de rétention de la suppression réversible" } }
    - { id: d, text: { en: "The diagnostic settings of the vault", fr: "Les paramètres de diagnostic du coffre" } }
    - { id: e, text: { en: "Cross Subscription Restore", fr: "La restauration entre abonnements (Cross Subscription Restore)" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The storage replication type must be changed before you configure a backup, because the option is disabled afterwards. To encrypt backup data with your own key, you must specify the key before any item is added to the vault, and the change cannot be reversed.
    fr: Le type de réplication de stockage doit être modifié avant de configurer une sauvegarde, car l'option est ensuite désactivée. Pour chiffrer les données de sauvegarde avec votre propre clé, vous devez spécifier la clé avant d'ajouter un élément au coffre, et ce choix est irréversible.
  options:
    c:
      en: The soft delete retention period (14 to 180 days) can be changed at any time.
      fr: La période de rétention de la suppression réversible (14 à 180 jours) peut être modifiée à tout moment.
    d:
      en: Diagnostic settings can be added or modified at any time, for example to start sending data to backup reports.
      fr: Les paramètres de diagnostic peuvent être ajoutés ou modifiés à tout moment, par exemple pour commencer à alimenter les rapports de sauvegarde.
    e:
      en: Cross Subscription Restore is updated from the vault Properties whenever needed.
      fr: La restauration entre abonnements se met à jour depuis les propriétés du coffre quand c'est nécessaire.
references:
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
