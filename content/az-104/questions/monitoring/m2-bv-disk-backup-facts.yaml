id: m2-bv-disk-backup-facts
objective: "5.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to protect several Azure managed disks by using Azure Disk Backup and a Backup vault named **BV-Tailspin** that uses geo-redundant storage.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de protéger plusieurs disques managés Azure avec Azure Disk Backup et un coffre de sauvegarde nommé **BV-Tailspin** qui utilise le stockage géoredondant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: BV-Tailspin must be in the same region as the disks that it protects.
        fr: BV-Tailspin doit se trouver dans la même région que les disques qu'il protège.
    - id: s2
      text:
        en: The disk backups are copied to the vault storage, so they are replicated to the paired region because BV-Tailspin uses geo-redundant storage.
        fr: Les sauvegardes de disques sont copiées dans le stockage du coffre ; elles sont donc répliquées dans la région jumelée, car BV-Tailspin utilise le stockage géoredondant.
    - id: s3
      text:
        en: A restore operation can overwrite the original source disk with the selected recovery point.
        fr: Une opération de restauration peut écraser le disque source d'origine avec le point de récupération sélectionné.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure Disk Backup requires the Backup vault and the disk to be in the same region. It supports only the operational tier: incremental snapshots stay in a snapshot resource group of your subscription and are not copied to the vault, so the vault redundancy setting does not apply to them. A restore always creates a new disk (alternate-location recovery); replacing the source disk is not supported.
    fr: Azure Disk Backup exige que le coffre de sauvegarde et le disque se trouvent dans la même région. Il ne prend en charge que le niveau opérationnel ; les instantanés incrémentiels restent dans un groupe de ressources d'instantanés de votre abonnement et ne sont pas copiés dans le coffre, si bien que le paramètre de redondance du coffre ne s'y applique pas. Une restauration crée toujours un nouveau disque (récupération à un autre emplacement) ; le remplacement du disque source n'est pas pris en charge.
references:
  - title: Overview of Azure Disk Backup
    url: https://learn.microsoft.com/en-us/azure/backup/disk-backup-overview
  - title: Restore Azure Managed Disks
    url: https://learn.microsoft.com/en-us/azure/backup/restore-managed-disks
