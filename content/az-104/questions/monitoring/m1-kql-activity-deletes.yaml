id: m1-kql-activity-deletes
objective: "5.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    The activity log of your subscription is sent to a Log Analytics workspace by a diagnostic setting.

    You need a query that lists the virtual machine deletions of the last 30 days. The result must contain only the time of the operation, the caller, the resource group and the resource ID. Values in the AzureActivity table can use different letter cases.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le journal d'activité de votre abonnement est envoyé vers un espace de travail Log Analytics par un paramètre de diagnostic.

    Vous avez besoin d'une requête qui liste les suppressions de machines virtuelles des 30 derniers jours. Le résultat ne doit contenir que l'heure de l'opération, l'appelant, le groupe de ressources et l'ID de ressource. Les valeurs de la table AzureActivity peuvent utiliser une casse différente.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(30d)
    | where OperationNameValue [[cmp]] "microsoft.compute/virtualmachines/delete"
    | [[op]] TimeGenerated, Caller, ResourceGroup, _ResourceId
  slots:
    - id: table
      options:
        - { id: aa, text: AzureActivity }
        - { id: am, text: AzureMetrics }
        - { id: ev, text: Event }
        - { id: hb, text: Heartbeat }
    - id: cmp
      options:
        - { id: ci, text: "=~" }
        - { id: eq, text: "==" }
        - { id: ncs, text: "!~" }
        - { id: ccs, text: contains_cs }
    - id: op
      options:
        - { id: project, text: project }
        - { id: extend, text: extend }
        - { id: summarize, text: summarize }
        - { id: render, text: render }
answer:
  values: { table: aa, cmp: ci, op: project }
explanation:
  correct:
    en: "Activity log events exported to a workspace are stored in the AzureActivity table. Because its values can use different cases, Microsoft recommends case-insensitive comparisons: `=~` is the case-insensitive equality operator. `project` keeps only the listed columns."
    fr: "Les événements du journal d'activité exportés vers un espace de travail sont stockés dans la table AzureActivity. Comme ses valeurs peuvent utiliser une casse différente, Microsoft recommande des comparaisons insensibles à la casse : `=~` est l'opérateur d'égalité insensible à la casse. `project` ne conserve que les colonnes listées."
  options:
    eq: { en: "`==` is case-sensitive and misses values stored in uppercase, such as MICROSOFT.COMPUTE/VIRTUALMACHINES/DELETE.", fr: "`==` est sensible à la casse et manque les valeurs stockées en majuscules, comme MICROSOFT.COMPUTE/VIRTUALMACHINES/DELETE." }
    ccs: { en: "contains_cs is also case-sensitive.", fr: "contains_cs est lui aussi sensible à la casse." }
    ncs: { en: "`!~` returns every operation except the deletions.", fr: "`!~` renvoie toutes les opérations sauf les suppressions." }
    extend: { en: "extend adds columns and keeps all the existing ones.", fr: "extend ajoute des colonnes et conserve toutes les colonnes existantes." }
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
  - title: String operators (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
