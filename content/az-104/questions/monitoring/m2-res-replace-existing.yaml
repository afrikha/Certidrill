id: m2-res-replace-existing
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that uses unencrypted managed disks and is backed up to a Recovery Services vault. After a faulty update, VM1 no longer works correctly.

    You need to restore the disks of VM1 from yesterday's recovery point. The solution must keep the existing VM1 resource, including its network interface and configuration, and minimize administrative effort.

    Which restore option should you use?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui utilise des disques managés non chiffrés et qui est sauvegardée dans un coffre Recovery Services. Après une mise à jour défectueuse, VM1 ne fonctionne plus correctement.

    Vous devez restaurer les disques de VM1 à partir du point de récupération d'hier. La solution doit conserver la ressource VM1 existante, y compris son interface réseau et sa configuration, et réduire au minimum l'effort d'administration.

    Quelle option de restauration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Replace existing", fr: "Remplacer l'existant (Replace existing)" } }
    - { id: b, text: { en: "Create new: Create virtual machine", fr: "Créer nouveau : Créer une machine virtuelle" } }
    - { id: c, text: { en: "Create new: Restore disks", fr: "Créer nouveau : Restaurer des disques" } }
    - { id: d, text: { en: "File Recovery", fr: "Récupération de fichiers (File Recovery)" } }
answer: { optionId: a }
explanation:
  correct:
    en: Replace existing restores the disks from the recovery point and attaches them to the current VM, which must still exist. Azure Backup takes a snapshot of the VM before replacing the disks, and the original disks are kept in the resource group. It is supported for unencrypted managed VMs.
    fr: Remplacer l'existant restaure les disques à partir du point de récupération et les attache à la machine virtuelle actuelle, qui doit toujours exister. Sauvegarde Azure prend un instantané de la machine virtuelle avant de remplacer les disques, et les disques d'origine sont conservés dans le groupe de ressources. Cette option est prise en charge pour les machines virtuelles managées non chiffrées.
  options:
    b:
      en: Create virtual machine creates a separate VM, so the existing VM1 resource is not kept as the running machine.
      fr: Créer une machine virtuelle crée une machine virtuelle distincte ; la ressource VM1 existante n'est donc pas conservée comme machine en service.
    c:
      en: Restore disks only creates disks; you would then have to swap them into VM1 manually, which adds effort.
      fr: Restaurer des disques crée uniquement des disques ; il faudrait ensuite les permuter manuellement dans VM1, ce qui ajoute de l'effort.
    d:
      en: File Recovery mounts a recovery point to copy individual files; it does not restore whole disks.
      fr: La récupération de fichiers monte un point de récupération pour copier des fichiers individuels ; elle ne restaure pas des disques entiers.
references:
  - title: Restore VMs by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
