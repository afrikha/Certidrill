id: m2-res-azure-files-restore
objective: "5.2.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Files share named **finance** that is protected by Azure Backup with a snapshot-tier policy. A user deleted a folder named **Q3** from the share two days ago.

    You need to restore only the Q3 folder into another share named **review** so that an auditor can check it before anything in the finance share is changed.

    The following table shows the restore options. Answer each prompt by selecting the appropriate option.
  fr: |
    Vous disposez d'un partage Azure Files nommé **finance** protégé par Sauvegarde Azure avec une stratégie de niveau instantané. Un utilisateur a supprimé un dossier nommé **Q3** du partage il y a deux jours.

    Vous devez restaurer uniquement le dossier Q3 dans un autre partage nommé **review**, afin qu'un auditeur le vérifie avant toute modification du partage finance.

    Le tableau suivant présente les options de restauration. Répondez à chaque consigne en sélectionnant l'option appropriée.
body:
  prompts:
    - id: p1
      text: { en: Restore type, fr: Type de restauration }
    - id: p2
      text: { en: Recovery destination, fr: Destination de récupération }
  grid:
    header: [ { en: Setting, fr: Paramètre }, { en: Option 1, fr: Option 1 }, { en: Option 2, fr: Option 2 } ]
    rows:
      - [ { text: { en: Restore type, fr: Type de restauration } }, { text: { en: Full share recovery, fr: Récupération du partage complet }, area: full }, { text: { en: Item-level recovery (File Recovery), fr: Récupération au niveau de l'élément (File Recovery) }, area: item } ]
      - [ { text: { en: Recovery destination, fr: Destination de récupération } }, { text: Original Location, area: orig }, { text: Alternate Location, area: alt } ]
answer:
  values: { p1: item, p2: alt }
explanation:
  correct:
    en: Item-level recovery, started from File Recovery, restores selected files or folders instead of the whole share. Alternate Location restores them to another file share (here review, in a folder you name) and keeps the original share as it is.
    fr: La récupération au niveau de l'élément, lancée depuis File Recovery, restaure des fichiers ou dossiers sélectionnés au lieu du partage entier. Alternate Location les restaure dans un autre partage de fichiers (ici review, dans un dossier que vous nommez) et laisse le partage d'origine intact.
  options:
    full: { en: "Full share recovery restores the entire share content, not only the Q3 folder.", fr: "La récupération du partage complet restaure tout le contenu du partage, pas seulement le dossier Q3." }
    orig: { en: "Original Location writes the data back to the finance share, which must not change before the review.", fr: "Original Location réécrit les données dans le partage finance, qui ne doit pas changer avant la vérification." }
references:
  - title: Restore Azure Files
    url: https://learn.microsoft.com/en-us/azure/backup/restore-afs
