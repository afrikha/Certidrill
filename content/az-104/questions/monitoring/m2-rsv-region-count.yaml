id: m2-rsv-region-count
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription that contains the following virtual machines:

    | Name | Region |
    | --- | --- |
    | VM1 | West Europe |
    | VM2 | West Europe |
    | VM3 | East US |
    | VM4 | East US |
    | VM5 | Southeast Asia |

    You plan to back up all the virtual machines by using Azure Backup.

    What is the minimum number of Recovery Services vaults you must create?
  fr: |
    Vous disposez d'un abonnement Azure qui contient les machines virtuelles suivantes :

    | Nom | Région |
    | --- | --- |
    | VM1 | West Europe |
    | VM2 | West Europe |
    | VM3 | East US |
    | VM4 | East US |
    | VM5 | Southeast Asia |

    Vous prévoyez de sauvegarder toutes les machines virtuelles avec Sauvegarde Azure.

    Quel est le nombre minimal de coffres Recovery Services que vous devez créer ?
shuffle: false
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "5" }
answer: { optionId: c }
explanation:
  correct:
    en: To protect a data source, the Recovery Services vault must be in the same region as that data source. One vault in West Europe can protect VM1 and VM2, one vault in East US can protect VM3 and VM4, and one vault in Southeast Asia can protect VM5, so three vaults are enough.
    fr: |
      Pour protéger une source de données, le coffre Recovery Services doit se trouver dans la même région que cette source. Un coffre dans West Europe peut protéger VM1 et VM2, un coffre dans East US peut protéger VM3 et VM4, et un coffre dans Southeast Asia peut protéger VM5 : trois coffres suffisent.
  options:
    a:
      en: A single vault cannot protect virtual machines located in different regions.
      fr: Un seul coffre ne peut pas protéger des machines virtuelles situées dans des régions différentes.
    b:
      en: Two vaults cover only two regions; VM5 in Southeast Asia needs a vault in its own region.
      fr: Deux coffres ne couvrent que deux régions ; VM5, dans Southeast Asia, a besoin d'un coffre dans sa propre région.
    d:
      en: You do not need one vault per virtual machine; one vault per region is enough.
      fr: Il n'est pas nécessaire de créer un coffre par machine virtuelle ; un coffre par région suffit.
references:
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
