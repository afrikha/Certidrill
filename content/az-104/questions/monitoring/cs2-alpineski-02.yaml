id: cs2-alpineski-02
objective: "5.2.3"
type: single
caseStudy: cs2-alpineski
difficulty: 2
status: draft
stem:
  en: You need to configure the backup policy for VM-BOOK1. The solution must meet the backup requirements and minimize administrative effort. What should you configure?
  fr: Vous devez configurer la stratégie de sauvegarde de VM-BOOK1. La solution doit respecter les exigences de sauvegarde et réduire l'effort d'administration au minimum. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Enhanced policy with an Hourly schedule that runs every 4 hours", fr: "Une stratégie Enhanced avec une planification Hourly qui s'exécute toutes les 4 heures" } }
    - { id: b, text: { en: "A Standard policy with a Daily schedule, plus on-demand backups every 4 hours", fr: "Une stratégie Standard avec une planification Daily, plus des sauvegardes à la demande toutes les 4 heures" } }
    - { id: c, text: { en: "A Standard policy with an Instant Restore retention of 4 days", fr: "Une stratégie Standard avec une rétention de restauration instantanée de 4 jours" } }
    - { id: d, text: { en: "An Enhanced policy with a Weekly schedule and 4 retention points", fr: "Une stratégie Enhanced avec une planification Weekly et 4 points de rétention" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Enhanced policy supports multiple backups per day, as often as every 4 hours, which gives an RPO of 4 hours. VM-BOOK1 is a Trusted Launch virtual machine, which the Enhanced policy supports natively.
    fr: |
      La stratégie Enhanced prend en charge plusieurs sauvegardes par jour, jusqu'à toutes les 4 heures, ce qui donne un RPO de 4 heures. VM-BOOK1 est une machine virtuelle à lancement fiable (Trusted Launch), que la stratégie Enhanced prend en charge nativement.
  options:
    b: { en: "Triggering on-demand backups manually every 4 hours does not minimize administrative effort.", fr: "Déclencher manuellement des sauvegardes à la demande toutes les 4 heures ne réduit pas l'effort d'administration." }
    c: { en: "Instant Restore retention sets how long snapshots are kept, not how often backups run; the Standard policy runs once a day.", fr: "La rétention de restauration instantanée fixe la durée de conservation des instantanés, pas la fréquence des sauvegardes ; la stratégie Standard s'exécute une fois par jour." }
    d: { en: "A weekly backup gives an RPO of up to 7 days.", fr: "Une sauvegarde hebdomadaire donne un RPO pouvant atteindre 7 jours." }
references:
  - title: "Back Up Azure VMs with the Enhanced Policy - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
