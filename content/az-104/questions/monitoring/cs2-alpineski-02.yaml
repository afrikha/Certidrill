id: cs2-alpineski-02
objective: "5.2.3"
type: single
caseStudy: cs2-alpineski
difficulty: 2
status: draft
stem:
  en: |
    VM-BOOK1 is protected by an Azure VM backup policy in a Recovery Services vault in Switzerland North. You need to meet the backup requirement for the BookingDB database. The solution must minimize administrative effort.

    What should you configure in the vault?
  fr: |
    VM-BOOK1 est protégée par une stratégie de sauvegarde de machine virtuelle Azure dans un coffre Recovery Services de Switzerland North. Vous devez satisfaire l'exigence de sauvegarde de la base de données BookingDB. La solution doit réduire l'effort d'administration au minimum.

    Que devez-vous configurer dans le coffre ?
body:
  options:
    - { id: a, text: { en: "A SQL Server in Azure VM backup policy with a daily full backup and log backups every 15 minutes", fr: "Une stratégie de sauvegarde SQL Server dans une machine virtuelle Azure avec une sauvegarde complète quotidienne et des sauvegardes de journaux toutes les 15 minutes" } }
    - { id: b, text: { en: "An Enhanced Azure VM backup policy with an Hourly schedule that runs every 4 hours", fr: "Une stratégie de sauvegarde de machine virtuelle Azure Enhanced avec une planification Hourly toutes les 4 heures" } }
    - { id: c, text: { en: "A Standard Azure VM backup policy with a daily backup and an Instant Restore retention of 5 days", fr: "Une stratégie de sauvegarde de machine virtuelle Azure Standard avec une sauvegarde quotidienne et une rétention de restauration instantanée de 5 jours" } }
    - { id: d, text: { en: "A Site Recovery replication policy with an app-consistent snapshot frequency of 1 hour", fr: "Une stratégie de réplication Site Recovery avec une fréquence d'instantanés cohérents avec les applications de 1 heure" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Backup for SQL Server in Azure VMs streams native SQL Server backups to the vault. For a database in the full recovery model, log backups can run as often as every 15 minutes, which gives an RPO of 15 minutes and allows point-in-time restores. A virtual machine backup policy, even an Enhanced one, cannot take recovery points more often than every 4 hours.
    fr: |
      Sauvegarde Azure pour SQL Server dans les machines virtuelles Azure transmet des sauvegardes SQL Server natives au coffre. Pour une base de données en mode de récupération complète, les sauvegardes de journaux peuvent s'exécuter jusqu'à toutes les 15 minutes, ce qui donne un RPO de 15 minutes et permet des restaurations à un point dans le temps. Une stratégie de sauvegarde de machine virtuelle, même Enhanced, ne peut pas créer de points de récupération plus souvent que toutes les 4 heures.
  options:
    b: { en: "The Enhanced policy takes at most one recovery point every 4 hours, so the RPO cannot be lower than 4 hours.", fr: "La stratégie Enhanced crée au plus un point de récupération toutes les 4 heures ; le RPO ne peut donc pas être inférieur à 4 heures." }
    c: { en: "A Standard policy takes one backup per day; the Instant Restore retention changes how long snapshots are kept, not how often they are taken.", fr: "Une stratégie Standard effectue une sauvegarde par jour ; la rétention de restauration instantanée change la durée de conservation des instantanés, pas leur fréquence." }
    d: { en: "Site Recovery replicates the virtual machine for disaster recovery; it is not Azure Backup and does not provide point-in-time restores of the database.", fr: "Site Recovery réplique la machine virtuelle pour la récupération d'urgence ; ce n'est pas Sauvegarde Azure et cela ne permet pas de restaurer la base de données à un point dans le temps." }
references:
  - title: "Back up multiple SQL Server VMs from the vault - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-sql-server-database-azure-vms
  - title: "Back Up Azure VMs with the Enhanced Policy - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
