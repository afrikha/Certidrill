id: m2-fo-recovery-plan
objective: "5.2.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys replicates a three-tier application to a secondary region by using Azure Site Recovery. The application has two SQL Server VMs, three middle-tier VMs and four web VMs.

    During failover, the database tier must start first, the middle tier next and the web tier last. After the web tier starts, a public IP address must be assigned automatically to the web VMs.

    How should you complete the recovery plan design? Select the appropriate options in the answer area.
  fr: |
    Wingtip Toys réplique une application à trois niveaux vers une région secondaire avec Azure Site Recovery. L'application comprend deux machines virtuelles SQL Server, trois machines virtuelles de niveau intermédiaire et quatre machines virtuelles web.

    Lors du basculement, le niveau base de données doit démarrer en premier, puis le niveau intermédiaire et enfin le niveau web. Après le démarrage du niveau web, une adresse IP publique doit être attribuée automatiquement aux machines virtuelles web.

    Comment devez-vous compléter la conception du plan de récupération ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Place the VMs of each tier in [[grp]].

      Within one group, the VMs fail over and start [[par]].

      To assign the public IP addresses, add [[act]].
    fr: |
      Placez les machines virtuelles de chaque niveau dans [[grp]].

      Au sein d'un même groupe, les machines virtuelles basculent et démarrent [[par]].

      Pour attribuer les adresses IP publiques, ajoutez [[act]].
  slots:
    - id: grp
      options:
        - { id: groups, text: { en: "a separate group of a single recovery plan", fr: "un groupe distinct d'un même plan de récupération" } }
        - { id: plans, text: { en: "a separate recovery plan for each tier", fr: "un plan de récupération distinct pour chaque niveau" } }
        - { id: repgroup, text: { en: "the same replication group for all tiers", fr: "le même groupe de réplication pour tous les niveaux" } }
    - id: par
      options:
        - { id: parallel, text: { en: in parallel, fr: en parallèle } }
        - { id: alpha, text: { en: one at a time in alphabetical order, fr: une par une dans l'ordre alphabétique } }
        - { id: size, text: { en: one at a time from the largest VM size to the smallest, fr: une par une de la plus grande taille de machine virtuelle à la plus petite } }
    - id: act
      options:
        - { id: post, text: { en: an Azure Automation runbook as a post action of the web tier group, fr: un runbook Azure Automation comme action postérieure du groupe du niveau web } }
        - { id: pre, text: { en: an Azure Automation runbook as a pre action of the database tier group, fr: un runbook Azure Automation comme action préalable du groupe du niveau base de données } }
        - { id: apr, text: { en: an alert processing rule on the vault, fr: une règle de traitement des alertes sur le coffre } }
answer:
  values: { grp: groups, par: parallel, act: post }
explanation:
  correct:
    en: A recovery plan gathers machines into groups. Groups start in order, so Group 2 starts only after all the machines of Group 1 have failed over and started, while machines in one group fail over in parallel. Tasks such as creating a public IP address after failover are automated with Azure Automation runbooks added to the plan, here after the web tier group.
    fr: Un plan de récupération regroupe les machines dans des groupes. Les groupes démarrent dans l'ordre ; Group 2 ne démarre donc qu'après le basculement et le démarrage de toutes les machines de Group 1, tandis que les machines d'un même groupe basculent en parallèle. Les tâches comme la création d'une adresse IP publique après le basculement sont automatisées avec des runbooks Azure Automation ajoutés au plan, ici après le groupe du niveau web.
  options:
    plans: { en: Separate plans do not enforce a start order between the tiers., fr: Des plans distincts n'imposent pas d'ordre de démarrage entre les niveaux. }
    repgroup: { en: A replication group provides multi-VM consistency; it does not define a start order., fr: "Un groupe de réplication assure la cohérence multi-VM ; il ne définit pas d'ordre de démarrage." }
    pre: { en: A pre action on the database group runs before the web VMs exist in the target region., fr: Une action préalable sur le groupe base de données s'exécute avant que les machines virtuelles web n'existent dans la région cible. }
    apr: { en: Alert processing rules route or suppress alert notifications; they do not run failover tasks., fr: "Les règles de traitement des alertes acheminent ou suppriment des notifications d'alerte ; elles n'exécutent pas de tâches de basculement." }
references:
  - title: About recovery plans in Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/recovery-plan-overview
  - title: Add Azure Automation runbooks to Site Recovery recovery plans
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-runbook-automation
