id: m2-asr-vault-region
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 12 Azure virtual machines in West Europe. You plan to use Azure Site Recovery to replicate the virtual machines to North Europe for disaster recovery.

    Where should you create the Recovery Services vault?
  fr: |
    Fabrikam dispose de 12 machines virtuelles Azure dans West Europe. Vous prévoyez d'utiliser Azure Site Recovery pour répliquer les machines virtuelles vers North Europe à des fins de récupération d'urgence.

    Où devez-vous créer le coffre Recovery Services ?
body:
  options:
    - { id: a, text: { en: "In North Europe", fr: "Dans North Europe" } }
    - { id: b, text: { en: "In West Europe", fr: "Dans West Europe" } }
    - { id: c, text: { en: "In both West Europe and North Europe, one vault per region", fr: "Dans West Europe et dans North Europe, avec un coffre par région" } }
    - { id: d, text: { en: "Nowhere: Site Recovery for Azure VMs does not use a vault", fr: "Nulle part : Site Recovery pour les machines virtuelles Azure n'utilise pas de coffre" } }
answer: { optionId: a }
explanation:
  correct:
    en: For Azure-to-Azure disaster recovery, you create the Recovery Services vault in any region except the source region of the virtual machines. Creating it in the target region, North Europe, keeps the vault available if West Europe has an outage.
    fr: Pour la récupération d'urgence d'Azure vers Azure, vous créez le coffre Recovery Services dans n'importe quelle région sauf la région source des machines virtuelles. Le créer dans la région cible, North Europe, garde le coffre disponible si West Europe subit une panne.
  options:
    b:
      en: The vault must not be in the source region; an outage there would also make the vault unavailable.
      fr: Le coffre ne doit pas se trouver dans la région source ; une panne de celle-ci rendrait aussi le coffre indisponible.
    c:
      en: A single vault outside the source region manages the replication of all the virtual machines; a vault in West Europe is neither needed nor allowed.
      fr: Un seul coffre situé hors de la région source gère la réplication de toutes les machines virtuelles ; un coffre dans West Europe n'est ni nécessaire ni autorisé.
    d:
      en: Replication is enabled and managed from a Recovery Services vault.
      fr: La réplication est activée et gérée depuis un coffre Recovery Services.
references:
  - title: Tutorial to set up Azure VM disaster recovery with Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication
