id: m1-vminsights-table
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You enable VM insights on a virtual machine named **VM1** by using the logs-based (classic) metrics experience. The data is sent to a Log Analytics workspace named **law-ops**.

    You need to write a log query on the performance data that VM insights collects from VM1. Which table should you query?
  fr: |
    Vous activez VM Insights sur une machine virtuelle nommée **VM1** avec l'expérience de métriques basée sur les journaux (classique). Les données sont envoyées vers un espace de travail Log Analytics nommé **law-ops**.

    Vous devez écrire une requête de journal sur les données de performances que VM Insights collecte à partir de VM1. Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: InsightsMetrics }
    - { id: b, text: AzureMetrics }
    - { id: c, text: AzureActivity }
    - { id: d, text: Heartbeat }
answer: { optionId: a }
explanation:
  correct:
    en: The data collection rule created for the logs-based VM insights experience sends the predefined performance counters through the Microsoft-InsightsMetrics stream, so the data is stored in the InsightsMetrics table of the workspace.
    fr: La règle de collecte de données créée pour l'expérience VM Insights basée sur les journaux envoie les compteurs de performances prédéfinis via le flux Microsoft-InsightsMetrics ; les données sont donc stockées dans la table InsightsMetrics de l'espace de travail.
  options:
    b:
      en: AzureMetrics contains platform metrics exported by diagnostic settings, not guest data from VM insights.
      fr: AzureMetrics contient les métriques de plateforme exportées par des paramètres de diagnostic, pas les données invitées de VM Insights.
    c:
      en: AzureActivity contains activity log events.
      fr: AzureActivity contient les événements du journal d'activité.
    d:
      en: Heartbeat only records that the agent is alive; it contains no performance counters.
      fr: Heartbeat indique seulement que l'agent est actif ; elle ne contient aucun compteur de performances.
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
  - title: InsightsMetrics table reference
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/insightsmetrics
