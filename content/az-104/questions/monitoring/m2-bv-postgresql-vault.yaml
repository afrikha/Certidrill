id: m2-bv-postgresql-vault
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs a database on Azure Database for PostgreSQL flexible server. You need to protect the server by using Azure Backup with long-term retention.

    Which resource should you create first?
  fr: |
    Northwind Traders exécute une base de données sur un serveur flexible Azure Database for PostgreSQL. Vous devez protéger le serveur avec Sauvegarde Azure en assurant une rétention à long terme.

    Quelle ressource devez-vous créer en premier ?
body:
  options:
    - { id: a, text: { en: "A Backup vault", fr: "Un coffre de sauvegarde" } }
    - { id: b, text: { en: "A Recovery Services vault", fr: "Un coffre Recovery Services" } }
    - { id: c, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
    - { id: d, text: { en: "A storage account with object replication", fr: "Un compte de stockage avec réplication d'objets" } }
answer: { optionId: a }
explanation:
  correct:
    en: Backup vaults hold the backup data of the newer workloads supported by Azure Backup, such as Azure Database for PostgreSQL servers, Azure Blobs and Azure managed disks. You create the Backup vault, then a backup policy and the backup instance.
    fr: Les coffres de sauvegarde contiennent les données de sauvegarde des charges de travail plus récentes prises en charge par Sauvegarde Azure, comme les serveurs Azure Database for PostgreSQL, Azure Blobs et les disques managés Azure. Vous créez le coffre de sauvegarde, puis une stratégie de sauvegarde et l'instance de sauvegarde.
  options:
    b:
      en: Recovery Services vaults protect workloads such as Azure VMs, Azure Files and SQL Server in Azure VMs, not Azure Database for PostgreSQL servers.
      fr: Les coffres Recovery Services protègent des charges de travail comme les machines virtuelles Azure, Azure Files et SQL Server dans des machines virtuelles Azure, pas les serveurs Azure Database for PostgreSQL.
    c:
      en: A Log Analytics workspace stores monitoring and reporting data; it does not store backups.
      fr: Un espace de travail Log Analytics stocke des données de supervision et de rapport ; il ne stocke pas de sauvegardes.
    d:
      en: Object replication copies block blobs between storage accounts; it is not a database backup solution.
      fr: La réplication d'objets copie des objets blob de blocs entre comptes de stockage ; ce n'est pas une solution de sauvegarde de base de données.
references:
  - title: Overview of the Backup vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
