id: m1-alert-dynamic-thresholds
objective: "5.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a metric alert rule that uses a dynamic threshold on the Percentage CPU metric of 40 virtual machines named **VM1** to **VM40**, which were deployed today.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de créer une règle d'alerte de métrique qui utilise un seuil dynamique sur la métrique Percentage CPU de 40 machines virtuelles nommées **VM1** à **VM40**, déployées aujourd'hui.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: The rule cannot fire an alert until at least three days and 30 samples of metric data are available.
        fr: La règle ne peut pas déclencher d'alerte tant qu'au moins trois jours et 30 échantillons de données de métriques ne sont pas disponibles.
    - id: s2
      text:
        en: You can add a second condition on the Available Memory Bytes metric to the same rule while keeping the dynamic threshold.
        fr: Vous pouvez ajouter à la même règle une deuxième condition sur la métrique Available Memory Bytes tout en conservant le seuil dynamique.
    - id: s3
      text:
        en: Weekly patterns in the CPU usage can be detected once about three weeks of historical data are available.
        fr: Les modèles hebdomadaires de l'utilisation de l'UC peuvent être détectés lorsque environ trois semaines de données historiques sont disponibles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Dynamic thresholds learn the historical behavior of the metric, so a rule does not fire before collecting three days and at least 30 samples of data. Detecting weekly seasonality requires about three weeks of history. Dynamic thresholds cannot be used in alert rules that monitor multiple conditions.
    fr: Les seuils dynamiques apprennent le comportement historique de la métrique ; une règle ne se déclenche donc pas avant d'avoir collecté trois jours et au moins 30 échantillons de données. La détection de la saisonnalité hebdomadaire nécessite environ trois semaines d'historique. Les seuils dynamiques ne peuvent pas être utilisés dans des règles d'alerte qui surveillent plusieurs conditions.
references:
  - title: Alert rules with dynamic thresholds overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-dynamic-thresholds
