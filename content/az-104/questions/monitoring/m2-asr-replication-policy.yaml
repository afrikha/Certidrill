id: m2-asr-replication-policy
objective: "5.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You enable Azure Site Recovery replication for an Azure virtual machine named **VM-SQL1** and keep the default replication policy that Site Recovery creates.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez la réplication Azure Site Recovery pour une machine virtuelle Azure nommée **VM-SQL1** et conservez la stratégie de réplication par défaut créée par Site Recovery.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Crash-consistent recovery points are created every five minutes, and you cannot change this frequency.
        fr: Des points de récupération cohérents en cas d'incident sont créés toutes les cinq minutes, et vous ne pouvez pas modifier cette fréquence.
    - id: s2
      text:
        en: Recovery points are kept for one day.
        fr: Les points de récupération sont conservés pendant un jour.
    - id: s3
      text:
        en: App-consistent snapshots are taken every four hours.
        fr: Des instantanés cohérents d'application sont pris toutes les quatre heures.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Site Recovery creates crash-consistent recovery points every five minutes, and this setting cannot be modified. The default replication policy keeps recovery points for one day, and its app-consistent snapshot frequency is 0 hours, which means app-consistent snapshots are disabled until you set a frequency.
    fr: Site Recovery crée des points de récupération cohérents en cas d'incident toutes les cinq minutes, et ce paramètre ne peut pas être modifié. La stratégie de réplication par défaut conserve les points de récupération pendant un jour, et sa fréquence d'instantanés cohérents d'application est de 0 heure, ce qui signifie qu'ils sont désactivés tant que vous ne définissez pas de fréquence.
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
