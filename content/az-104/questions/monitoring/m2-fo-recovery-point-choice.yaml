id: m2-fo-recovery-point-choice
objective: "5.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage Azure virtual machines that are replicated by Azure Site Recovery. You must choose the recovery point to use when you fail over in four different situations.

    Which recovery point option should you select for each situation? To answer, drag the appropriate options to the correct situations. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des machines virtuelles Azure répliquées par Azure Site Recovery. Vous devez choisir le point de récupération à utiliser lors d'un basculement dans quatre situations différentes.

    Quelle option de point de récupération devez-vous sélectionner pour chaque situation ? Pour répondre, faites glisser les options appropriées vers les situations correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: processed, text: { en: "Latest processed", fr: "Dernier traitement (Latest processed)" } }
    - { id: latest, text: { en: "Latest", fr: "Dernière (Latest)" } }
    - { id: appc, text: { en: "Latest app-consistent", fr: "Dernier point de cohérence des applications" } }
    - { id: custom, text: { en: "Custom", fr: "Personnalisé (Custom)" } }
  targets:
    - { id: rto, text: { en: "Fail over as fast as possible, without spending time processing data", fr: "Basculer le plus vite possible, sans passer de temps à traiter des données" } }
    - { id: rpo, text: { en: "Lose as little data as possible", fr: "Perdre le moins de données possible" } }
    - { id: app, text: { en: "Recover a database VM to a point where in-memory data and transactions were flushed to disk", fr: "Récupérer une machine virtuelle de base de données à un point où les données en mémoire et les transactions ont été écrites sur le disque" } }
    - { id: time, text: { en: "Fail over a single VM, not in a recovery plan, to a point before a known corruption", fr: "Basculer une seule machine virtuelle, hors plan de récupération, vers un point antérieur à une corruption connue" } }
answer:
  mapping: { rto: processed, rpo: latest, app: appc, time: custom }
explanation:
  correct:
    en: Latest processed uses the most recent point already processed, so it gives a low RTO. Latest first processes all data sent to Site Recovery, which gives the lowest RPO. Latest app-consistent uses the newest app-consistent point, created with VSS. Custom lets you pick a specific point, and it is available only when you fail over a single VM without a recovery plan.
    fr: Dernier traitement utilise le point le plus récent déjà traité, ce qui donne un RTO faible. Dernière traite d'abord toutes les données envoyées à Site Recovery, ce qui donne le RPO le plus faible. Le dernier point de cohérence des applications utilise le point cohérent d'application le plus récent, créé avec VSS. Personnalisé permet de choisir un point précis et n'est disponible que pour le basculement d'une seule machine virtuelle sans plan de récupération.
references:
  - title: Tutorial to fail over Azure VMs to a secondary region
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-failover-failback
