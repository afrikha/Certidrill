difficulty: 2
status: draft
shuffle: false
stem:
  en: You need to meet the backup requirement for all the virtual machines. What is the minimum number of Recovery Services vaults that you must create for Azure Backup?
  fr: Vous devez satisfaire l'exigence de sauvegarde de toutes les machines virtuelles. Quel est le nombre minimal de coffres Recovery Services que vous devez créer pour Sauvegarde Azure ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Backup protects a virtual machine only with a Recovery Services vault in the same region as the virtual machine. The virtual machines are in two regions, Switzerland North (VM-BOOK1, VM-LIFT1) and West Europe (VM-RENT1, VM-WEBAT1), so you need one vault per region. A vault can protect several virtual machines and use several backup policies.
    fr: |
      Sauvegarde Azure ne protège une machine virtuelle qu'avec un coffre Recovery Services situé dans la même région que la machine virtuelle. Les machines virtuelles se trouvent dans deux régions, Switzerland North (VM-BOOK1, VM-LIFT1) et West Europe (VM-RENT1, VM-WEBAT1) ; il faut donc un coffre par région. Un coffre peut protéger plusieurs machines virtuelles et utiliser plusieurs stratégies de sauvegarde.
  options:
    a: { en: "A single vault cannot back up virtual machines in another region.", fr: "Un seul coffre ne peut pas sauvegarder des machines virtuelles situées dans une autre région." }
    c: { en: "VM-BOOK1 can use its own backup policy in the Switzerland North vault; it does not need a separate vault.", fr: "VM-BOOK1 peut utiliser sa propre stratégie de sauvegarde dans le coffre de Switzerland North ; elle n'a pas besoin d'un coffre distinct." }
    d: { en: "One vault per virtual machine is not required and increases administrative effort.", fr: "Un coffre par machine virtuelle n'est pas nécessaire et augmente l'effort d'administration." }
references:
  - title: "Quickstart - Back up a VM with the Azure portal by using Azure Backup - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/quick-backup-vm-portal
  - title: "Create and Configure Recovery Services Vaults - Azure Backup"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
