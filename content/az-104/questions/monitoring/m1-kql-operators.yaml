id: m1-kql-operators
objective: "5.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing log queries in Log Analytics against the Perf table.

    Which KQL operator should you use for each requirement? To answer, drag the appropriate operators to the correct requirements. Each operator may be used once or not at all.
  fr: |
    Vous écrivez des requêtes de journal dans Log Analytics sur la table Perf.

    Quel opérateur KQL devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérateurs appropriés vers les exigences correspondantes. Chaque opérateur peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: where, text: where }
    - { id: project, text: project }
    - { id: extend, text: extend }
    - { id: summarize, text: summarize }
    - { id: join, text: join }
    - { id: render, text: render }
  targets:
    - id: t1
      text: { en: "Keep only the rows of the last two hours", fr: "Ne conserver que les lignes des deux dernières heures" }
    - id: t2
      text: { en: "Add a CounterValueGB column calculated from CounterValue, and keep all the other columns", fr: "Ajouter une colonne CounterValueGB calculée à partir de CounterValue, et conserver toutes les autres colonnes" }
    - id: t3
      text: { en: "Return only the Computer, CounterName and CounterValue columns", fr: "Ne renvoyer que les colonnes Computer, CounterName et CounterValue" }
    - id: t4
      text: { en: "Calculate the maximum CounterValue for each computer", fr: "Calculer la valeur CounterValue maximale de chaque ordinateur" }
answer:
  mapping: { t1: where, t2: extend, t3: project, t4: summarize }
explanation:
  correct:
    en: "`where` filters rows on a condition such as `TimeGenerated > ago(2h)`. `extend` adds calculated columns to the existing ones, while `project` selects (and can rename or calculate) the columns to keep and drops the others. `summarize` aggregates rows into groups, for example `max(CounterValue) by Computer`."
    fr: "`where` filtre les lignes selon une condition comme `TimeGenerated > ago(2h)`. `extend` ajoute des colonnes calculées aux colonnes existantes, tandis que `project` sélectionne (et peut renommer ou calculer) les colonnes à conserver et supprime les autres. `summarize` agrège les lignes en groupes, par exemple `max(CounterValue) by Computer`."
  options:
    join: { en: join combines rows of two tables on matching keys., fr: join combine les lignes de deux tables sur des clés correspondantes. }
    render: { en: render only chooses how the result is displayed., fr: render choisit seulement la manière d'afficher le résultat. }
references:
  - title: extend operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/extend-operator
  - title: summarize operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
