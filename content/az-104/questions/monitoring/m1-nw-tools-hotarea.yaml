id: m1-nw-tools-hotarea
objective: "5.1.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You manage the networking of a company named Woodgrove. The following table shows the tools available in Network Watcher.

    Answer each prompt by selecting the tool that you should use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez le réseau d'une entreprise nommée Woodgrove. Le tableau suivant présente les outils disponibles dans Network Watcher.

    Répondez à chaque consigne en sélectionnant l'outil que vous devez utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Check every minute that VM1 can reach an on-premises server on TCP 1433, and get an alert when the round-trip time exceeds 100 ms", fr: "Vérifier toutes les minutes que VM1 peut joindre un serveur local sur TCP 1433, et recevoir une alerte quand le temps aller-retour dépasse 100 ms" }
    - id: p2
      text: { en: "Test once, right now, whether VM1 can connect to www.contoso.com on TCP 443, and see the hops along the path", fr: "Tester une seule fois, dès maintenant, si VM1 peut se connecter à www.contoso.com sur TCP 443, et voir les tronçons du chemin" }
  grid:
    header: [{ en: "Category", fr: "Catégorie" }, { en: Tool, fr: Outil }]
    rows:
      - [{ text: { en: "Monitoring", fr: "Supervision" } }, { text: { en: Topology, fr: Topologie }, area: topo }]
      - [{ text: { en: "Monitoring", fr: "Supervision" } }, { text: { en: Connection monitor, fr: Moniteur de connexion }, area: cm }]
      - [{ text: { en: "Network diagnostic tools", fr: "Outils de diagnostic réseau" } }, { text: { en: IP flow verify, fr: Vérification des flux IP }, area: ipflow }]
      - [{ text: { en: "Network diagnostic tools", fr: "Outils de diagnostic réseau" } }, { text: { en: Next hop, fr: Tronçon suivant }, area: nexthop }]
      - [{ text: { en: "Network diagnostic tools", fr: "Outils de diagnostic réseau" } }, { text: { en: Connection troubleshoot, fr: Résolution des problèmes de connexion }, area: ct }]
      - [{ text: { en: "Network diagnostic tools", fr: "Outils de diagnostic réseau" } }, { text: { en: Packet capture, fr: Capture de paquets }, area: pcap }]
      - [{ text: { en: "Logs", fr: "Journaux" } }, { text: { en: Flow logs, fr: Journaux de flux }, area: flow }]
answer:
  values: { p1: cm, p2: ct }
explanation:
  correct:
    en: Connection monitor runs connectivity checks continuously, at the test frequency you choose, and records the percentage of failed checks and the round-trip time, which you can alert on. Connection troubleshoot tests a connection between a VM and an FQDN, URI or IP address at a point in time and returns the hops, without monitoring over time.
    fr: Le Moniteur de connexion exécute des vérifications de connectivité en continu, à la fréquence de test choisie, et enregistre le pourcentage de vérifications ayant échoué et le temps aller-retour, sur lesquels vous pouvez définir des alertes. La résolution des problèmes de connexion teste à un instant donné une connexion entre une machine virtuelle et un FQDN, un URI ou une adresse IP, et renvoie les tronçons, sans supervision dans la durée.
references:
  - title: Azure Network Watcher overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
  - title: Connection Monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
