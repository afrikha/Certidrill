id: cs1-contoso-06
objective: "5.2.3"
type: single
caseStudy: cs1-contoso
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the backup requirement for VM-POSDB1.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de sauvegarde de VM-POSDB1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an Enhanced backup policy in RSV-Contoso with an Hourly schedule that runs every 4 hours, and protect VM-POSDB1 with it", fr: "Créer une stratégie de sauvegarde Enhanced dans RSV-Contoso avec une planification Hourly toutes les 4 heures, et protéger VM-POSDB1 avec cette stratégie" } }
    - { id: b, text: { en: "Edit DefaultPolicy and add five more daily backup times to its Standard schedule", fr: "Modifier DefaultPolicy et ajouter cinq heures de sauvegarde quotidiennes supplémentaires à sa planification Standard" } }
    - { id: c, text: { en: "Create a Backup vault and a backup policy for Azure virtual machines that runs every 4 hours", fr: "Créer un coffre de sauvegarde et une stratégie de sauvegarde pour les machines virtuelles Azure qui s'exécute toutes les 4 heures" } }
    - { id: d, text: { en: "Increase the instant restore snapshot retention of DefaultPolicy to 5 days", fr: "Augmenter la rétention des instantanés de restauration instantanée de DefaultPolicy à 5 jours" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only the Enhanced policy type for Azure VMs supports multiple backups per day; with the Hourly schedule, you can take a backup every 4, 6, 8, 12, or 24 hours. An Enhanced policy in RSV-Contoso every 4 hours gives a recovery point at least every four hours.
    fr: |
      Seul le type de stratégie Enhanced pour les machines virtuelles Azure prend en charge plusieurs sauvegardes par jour ; avec la planification Hourly, vous pouvez effectuer une sauvegarde toutes les 4, 6, 8, 12 ou 24 heures. Une stratégie Enhanced dans RSV-Contoso toutes les 4 heures fournit un point de récupération au moins toutes les quatre heures.
  options:
    b: { en: "A Standard policy takes at most one backup per day; it cannot schedule several daily backup times.", fr: "Une stratégie Standard effectue au plus une sauvegarde par jour ; elle ne peut pas planifier plusieurs heures de sauvegarde quotidiennes." }
    c: { en: "Azure VM backups are stored in a Recovery Services vault; a Backup vault does not protect Azure VMs.", fr: "Les sauvegardes de machines virtuelles Azure sont stockées dans un coffre Recovery Services ; un coffre de sauvegarde ne protège pas les machines virtuelles Azure." }
    d: { en: "Longer snapshot retention keeps recovery points longer but does not create them more often.", fr: "Une rétention plus longue des instantanés conserve les points de récupération plus longtemps mais n'en crée pas plus souvent." }
references:
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
