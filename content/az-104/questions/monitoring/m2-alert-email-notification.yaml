id: m2-alert-email-notification
objective: "5.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a subscription that contains several Recovery Services vaults. The built-in Azure Monitor alerts for backup failures are enabled and appear in the Azure portal.

    You need the backup team to receive an email each time a backup job fails in any vault of the subscription. The solution must use the built-in alerts and minimize administrative effort.

    What should you create?
  fr: |
    Vous disposez d'un abonnement qui contient plusieurs coffres Recovery Services. Les alertes Azure Monitor intégrées pour les échecs de sauvegarde sont activées et s'affichent dans le portail Azure.

    L'équipe de sauvegarde doit recevoir un e-mail chaque fois qu'un travail de sauvegarde échoue dans un coffre de l'abonnement. La solution doit utiliser les alertes intégrées et réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: An alert processing rule at the subscription scope that applies an action group that sends email
        fr: Une règle de traitement des alertes sur l'étendue de l'abonnement qui applique un groupe d'actions envoyant un e-mail
    - id: b
      text:
        en: A log search alert rule in each vault that queries the AddonAzureBackupJobs table
        fr: Une règle d'alerte de recherche dans les journaux dans chaque coffre qui interroge la table AddonAzureBackupJobs
    - id: c
      text:
        en: A diagnostic setting on each vault that sends the Addon Azure Backup Alerts event to an email address
        fr: Un paramètre de diagnostic sur chaque coffre qui envoie l'événement Addon Azure Backup Alerts à une adresse e-mail
    - id: d
      text:
        en: An activity log alert rule on the subscription for the operation that writes backup jobs to the vaults
        fr: Une règle d'alerte de journal d'activité sur l'abonnement pour l'opération qui écrit les travaux de sauvegarde dans les coffres
answer: { optionId: a }
explanation:
  correct:
    en: Built-in Azure Monitor alerts for Azure Backup fire without any rule to create. To get notifications, you create an alert processing rule over the required scope and attach an action group that sends email (or uses ITSM, webhooks, logic apps and so on). One rule at the subscription scope covers every vault.
    fr: Les alertes Azure Monitor intégrées de Sauvegarde Azure se déclenchent sans règle à créer. Pour recevoir des notifications, vous créez une règle de traitement des alertes sur l'étendue requise et y associez un groupe d'actions qui envoie un e-mail (ou utilise ITSM, des webhooks, des applications logiques, etc.). Une seule règle sur l'étendue de l'abonnement couvre tous les coffres.
  options:
    b:
      en: A log search alert needs diagnostics data in a Log Analytics workspace and one rule per vault; it does not use the built-in alerts and adds effort.
      fr: Une alerte de recherche dans les journaux nécessite des données de diagnostic dans un espace de travail Log Analytics et une règle par coffre ; elle n'utilise pas les alertes intégrées et ajoute de l'effort.
    c:
      en: Diagnostic settings send data to a workspace, a storage account or an event hub, never to an email address; Addon Azure Backup Alerts also relates to the deprecated classic alerts.
      fr: Les paramètres de diagnostic envoient des données vers un espace de travail, un compte de stockage ou un hub d'événements, jamais vers une adresse e-mail ; Addon Azure Backup Alerts concerne en outre les alertes classiques dépréciées.
    d:
      en: Scheduled backup job failures are not user-triggered management operations recorded as activity log events to alert on.
      fr: Les échecs de travaux de sauvegarde planifiés ne sont pas des opérations de gestion déclenchées par un utilisateur et enregistrées dans le journal d'activité.
references:
  - title: Configure and manage Azure Monitor based alert notifications for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-monitor-alerts-notification
  - title: Monitoring and reporting solutions for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/monitoring-and-alerts-overview
