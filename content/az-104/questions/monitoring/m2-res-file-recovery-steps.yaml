id: m2-res-file-recovery-steps
objective: "5.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Windows Server Azure virtual machine named **VM1** that is backed up to a Recovery Services vault. A user deleted three files from VM1 yesterday.

    You need to recover the files without restoring the entire virtual machine or its disks.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure Windows Server nommée **VM1** qui est sauvegardée dans un coffre Recovery Services. Un utilisateur a supprimé trois fichiers de VM1 hier.

    Vous devez récupérer les fichiers sans restaurer toute la machine virtuelle ni ses disques.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: rp, text: { en: "On the Backup pane of VM1, select **File Recovery**, and then select a restore point.", fr: "Dans le volet Sauvegarde de VM1, sélectionner **File Recovery** (récupération de fichiers), puis un point de restauration." } }
    - { id: dl, text: { en: Download the executable and copy the generated password., fr: Télécharger l'exécutable et copier le mot de passe généré. } }
    - { id: run, text: { en: Run the executable as an administrator on a computer with a compatible operating system and enter the password., fr: Exécuter l'exécutable en tant qu'administrateur sur un ordinateur doté d'un système d'exploitation compatible et saisir le mot de passe. } }
    - { id: copy, text: { en: Browse the mounted volumes and copy the files to the required location., fr: Parcourir les volumes montés et copier les fichiers vers l'emplacement souhaité. } }
    - { id: unmount, text: { en: "In the portal, select **Unmount Disks**.", fr: "Dans le portail, sélectionner **Unmount Disks** (démonter les disques)." } }
    - { id: stop, text: { en: Stop and deallocate VM1., fr: Arrêter et libérer VM1. } }
    - { id: staging, text: { en: Select a staging storage account for the restored VHD files., fr: Sélectionner un compte de stockage intermédiaire pour les fichiers VHD restaurés. } }
answer:
  sequence: [ rp, dl, run, copy, unmount ]
explanation:
  correct:
    en: File recovery generates a password-protected executable (a Python script for Linux) for the selected recovery point. Running it mounts the recovery point volumes as local drives through iSCSI, so you can copy the files. You then unmount the disks from the portal to close the connection; otherwise the script stays valid for 12 hours.
    fr: La récupération de fichiers génère, pour le point de récupération sélectionné, un exécutable protégé par mot de passe (un script Python pour Linux). Son exécution monte les volumes du point de récupération comme lecteurs locaux via iSCSI, ce qui permet de copier les fichiers. Vous démontez ensuite les disques depuis le portail pour fermer la connexion ; sinon, le script reste valide 12 heures.
  options:
    stop: { en: File recovery does not require stopping the virtual machine., fr: La récupération de fichiers n'exige pas d'arrêter la machine virtuelle. }
    staging: { en: "A staging location is used by disk and VM restores, not by file recovery.", fr: "Un emplacement intermédiaire sert aux restaurations de disques et de machines virtuelles, pas à la récupération de fichiers." }
references:
  - title: Recover files and folders from Azure VM backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-restore-files-from-vm
