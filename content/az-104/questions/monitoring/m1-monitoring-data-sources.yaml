id: m1-monitoring-data-sources
objective: "5.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are investigating several incidents in an Azure subscription. The subscription contains Windows virtual machines and a key vault named **kv-adatum**.

    Which data source contains the information needed for each question? To answer, drag the appropriate data sources to the correct questions. Each data source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez plusieurs incidents dans un abonnement Azure. L'abonnement contient des machines virtuelles Windows et un coffre de clés nommé **kv-adatum**.

    Quelle source de données contient les informations nécessaires pour chaque question ? Pour répondre, faites glisser les sources de données appropriées vers les questions correspondantes. Chaque source de données peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: activity, text: { en: "Activity log", fr: "Journal d'activité" } }
    - { id: resource, text: { en: "Resource logs collected by a diagnostic setting", fr: "Journaux de ressources collectés par un paramètre de diagnostic" } }
    - { id: metrics, text: { en: "Platform metrics", fr: "Métriques de plateforme" } }
    - { id: dcr, text: { en: "Guest OS data collected by the Azure Monitor Agent through a data collection rule", fr: "Données du système d'exploitation invité collectées par l'agent Azure Monitor via une règle de collecte de données" } }
    - { id: appi, text: { en: "Application Insights telemetry", fr: "Télémétrie Application Insights" } }
  targets:
    - id: t1
      text: { en: "Who deleted a virtual machine yesterday?", fr: "Qui a supprimé une machine virtuelle hier ?" }
    - id: t2
      text: { en: "Which applications read a specific secret in kv-adatum?", fr: "Quelles applications ont lu un secret donné dans kv-adatum ?" }
    - id: t3
      text: { en: "What was the Percentage CPU of a virtual machine host this morning?", fr: "Quel était le pourcentage d'UC (Percentage CPU) de l'hôte d'une machine virtuelle ce matin ?" }
    - id: t4
      text: { en: "Which errors were written to the System event log inside a virtual machine?", fr: "Quelles erreurs ont été écrites dans le journal des événements Système à l'intérieur d'une machine virtuelle ?" }
answer:
  mapping: { t1: activity, t2: resource, t3: metrics, t4: dcr }
explanation:
  correct:
    en: The activity log records control plane operations such as deleting a VM, including the caller. Resource logs record data plane operations such as reading a secret, and they are collected only once a diagnostic setting exists. Percentage CPU is a platform metric collected automatically. Events of the guest operating system need the Azure Monitor Agent and a data collection rule.
    fr: Le journal d'activité enregistre les opérations du plan de contrôle, comme la suppression d'une machine virtuelle, avec l'appelant. Les journaux de ressources enregistrent les opérations du plan de données, comme la lecture d'un secret, et ne sont collectés qu'une fois un paramètre de diagnostic créé. Percentage CPU est une métrique de plateforme collectée automatiquement. Les événements du système d'exploitation invité nécessitent l'agent Azure Monitor et une règle de collecte de données.
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings
