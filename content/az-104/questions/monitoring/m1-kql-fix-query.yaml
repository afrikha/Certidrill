id: m1-kql-fix-query
objective: "5.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A colleague wrote the following query to chart the hourly average processor time of each computer during the last day. The query fails with an error.

    Answer the prompt by selecting a line of the query.
  fr: |
    Un collègue a écrit la requête suivante pour représenter le temps processeur moyen par heure de chaque ordinateur au cours de la dernière journée. La requête échoue avec une erreur.

    Répondez à la consigne en sélectionnant une ligne de la requête.
body:
  prompts:
    - id: p1
      text: { en: "Which line must you change so that the query runs and returns the expected chart?", fr: "Quelle ligne devez-vous modifier pour que la requête s'exécute et renvoie le graphique attendu ?" }
  grid:
    header: [{ en: Line, fr: Ligne }, { en: Query, fr: Requête }]
    rows:
      - [{ text: "1" }, { text: Perf, area: l1 }]
      - [{ text: "2" }, { text: "| where TimeGenerated > ago(1d)", area: l2 }]
      - [{ text: "3" }, { text: "| where CounterName == \"% Processor Time\"", area: l3 }]
      - [{ text: "4" }, { text: "| project Computer, CounterValue", area: l4 }]
      - [{ text: "5" }, { text: "| summarize avg(CounterValue) by Computer, bin(TimeGenerated, 1h)", area: l5 }]
      - [{ text: "6" }, { text: "| render timechart", area: l6 }]
answer:
  values: { p1: l4 }
explanation:
  correct:
    en: "`project` keeps only the listed columns, so TimeGenerated no longer exists when line 5 calls `bin(TimeGenerated, 1h)`, and the query fails to resolve it. Adding TimeGenerated to the project list (or removing line 4) fixes the query; the other lines are valid."
    fr: "`project` ne conserve que les colonnes listées : TimeGenerated n'existe donc plus quand la ligne 5 appelle `bin(TimeGenerated, 1h)`, et la requête ne peut pas la résoudre. Ajouter TimeGenerated à la liste de project (ou supprimer la ligne 4) corrige la requête ; les autres lignes sont valides."
references:
  - title: project operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/project-operator
