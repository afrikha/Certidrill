id: m2-rsv-cross-region-restore
objective: "5.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your company plans to back up Azure virtual machines in West Europe to a Recovery Services vault named **RSV-Fabrikam**. Auditors require the company to prove that it can restore virtual machines in another region even when no outage is declared in West Europe.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Votre entreprise prévoit de sauvegarder des machines virtuelles Azure situées dans West Europe dans un coffre Recovery Services nommé **RSV-Fabrikam**. Les auditeurs exigent que l'entreprise prouve qu'elle peut restaurer des machines virtuelles dans une autre région, même si aucune panne n'est déclarée dans West Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: Cross Region Restore can be enabled only if RSV-Fabrikam uses geo-redundant storage (GRS).
        fr: La restauration interrégion ne peut être activée que si RSV-Fabrikam utilise le stockage géoredondant (GRS).
    - id: s2
      text:
        en: With Cross Region Restore, you can restore a virtual machine to the Azure paired region of West Europe.
        fr: Avec la restauration interrégion, vous pouvez restaurer une machine virtuelle dans la région Azure jumelée de West Europe.
    - id: s3
      text:
        en: After protection starts, you can disable Cross Region Restore at any time to return to standard GRS pricing.
        fr: Une fois la protection démarrée, vous pouvez désactiver la restauration interrégion à tout moment pour revenir à la tarification GRS standard.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Cross Region Restore is supported only for Recovery Services vaults that use GRS, and it restores data in the secondary region, which is the Azure paired region. Once protection has started for the first time, Cross Region Restore currently cannot be reverted, so the vault cannot go back to plain GRS or LRS.
    fr: |
      La restauration interrégion n'est prise en charge que pour les coffres Recovery Services qui utilisent GRS, et elle restaure les données dans la région secondaire, c'est-à-dire la région Azure jumelée. Une fois la protection démarrée pour la première fois, la restauration interrégion ne peut actuellement pas être annulée : le coffre ne peut plus revenir à un simple GRS ou LRS.
references:
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
  - title: Restore VMs by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
