id: m2-alert-built-in-types
objective: "5.2.7"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You review the built-in Azure Monitor alerts that Azure Backup provides for a Recovery Services vault named **RSV1**. Some of the alerts are shown in the following table.

    Answer each prompt by selecting the alert that fires in the described situation.
  fr: |
    Vous examinez les alertes Azure Monitor intégrées que Sauvegarde Azure fournit pour un coffre Recovery Services nommé **RSV1**. Certaines de ces alertes figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'alerte déclenchée dans la situation décrite.
body:
  prompts:
    - id: p1
      text: { en: An administrator stops protection of a VM and deletes its backup data., fr: Un administrateur arrête la protection d'une machine virtuelle et supprime ses données de sauvegarde. }
    - id: p2
      text: { en: An administrator edits a backup policy so that recovery points are kept for fewer days., fr: Un administrateur modifie une stratégie de sauvegarde pour conserver les points de récupération moins de jours. }
  grid:
    header: [ { en: Alert name, fr: Nom de l'alerte }, { en: Category, fr: Catégorie }, { en: Severity, fr: Gravité } ]
    rows:
      - [ { text: Delete Backup Data, area: del }, { text: { en: Security, fr: Sécurité } }, { text: Sev 0 } ]
      - [ { text: Modify Policy with Shorter Retention, area: modpol }, { text: { en: Security, fr: Sécurité } }, { text: Sev 0 } ]
      - [ { text: Modify Protection with Shorter Retention, area: modprot }, { text: { en: Security, fr: Sécurité } }, { text: Sev 0 } ]
      - [ { text: Backup Failure, area: bkfail }, { text: Jobs }, { text: Sev 1 } ]
      - [ { text: Restore Failure, area: rsfail }, { text: Jobs }, { text: Sev 1 } ]
answer:
  values: { p1: del, p2: modpol }
explanation:
  correct:
    en: Delete Backup Data fires when you stop backup and delete backup data. Modify Policy with Shorter Retention fires when a backup policy is modified to use a lower retention. Security alerts (Sev 0) are always generated and cannot be turned off, whereas job failure alerts (Sev 1) can be.
    fr: Delete Backup Data se déclenche lorsque vous arrêtez la sauvegarde et supprimez les données de sauvegarde. Modify Policy with Shorter Retention se déclenche lorsqu'une stratégie de sauvegarde est modifiée pour utiliser une rétention plus courte. Les alertes de sécurité (Sev 0) sont toujours générées et ne peuvent pas être désactivées, contrairement aux alertes d'échec de travaux (Sev 1).
  options:
    modprot: { en: "This alert fires when a backup item is assigned to a different policy with lower retention, not when the policy itself is edited.", fr: "Cette alerte se déclenche quand un élément de sauvegarde est associé à une autre stratégie de rétention plus courte, pas quand la stratégie elle-même est modifiée." }
references:
  - title: Monitoring and reporting solutions for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/monitoring-and-alerts-overview
