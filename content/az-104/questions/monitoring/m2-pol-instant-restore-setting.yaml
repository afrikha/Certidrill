id: m2-pol-instant-restore-setting
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are editing an Azure VM backup policy in a Recovery Services vault. Users report that restores take too long because recent recovery points are often restored from the vault tier.

    You need to keep recovery points in the snapshot tier, stored with the disks, for a longer time.

    Which policy setting should you modify?
  fr: |
    Vous modifiez une stratégie de sauvegarde de machines virtuelles Azure dans un coffre Recovery Services. Les utilisateurs signalent que les restaurations sont trop longues, car les points de récupération récents sont souvent restaurés depuis le niveau coffre.

    Vous devez conserver plus longtemps les points de récupération dans le niveau instantané, stocké avec les disques.

    Quel paramètre de la stratégie devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "Instant Restore snapshot retention", fr: "La rétention des instantanés de restauration instantanée (Instant Restore)" } }
    - { id: b, text: { en: "Retention of daily backup points", fr: "La rétention des points de sauvegarde quotidiens" } }
    - { id: c, text: { en: "Backup schedule time", fr: "L'heure de la planification de sauvegarde" } }
    - { id: d, text: { en: "Retention of monthly backup points", fr: "La rétention des points de sauvegarde mensuels" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Instant Restore setting of the policy defines how many days the VM snapshots are kept with the disks. While a snapshot exists, a restore uses it automatically, which is faster than restoring from the vault.
    fr: Le paramètre Instant Restore de la stratégie définit pendant combien de jours les instantanés de la machine virtuelle sont conservés avec les disques. Tant qu'un instantané existe, la restauration l'utilise automatiquement, ce qui est plus rapide qu'une restauration depuis le coffre.
  options:
    b:
      en: Daily retention controls how long recovery points are kept in the vault tier, not in the snapshot tier.
      fr: La rétention quotidienne contrôle la durée de conservation des points de récupération dans le niveau coffre, pas dans le niveau instantané.
    c:
      en: The schedule time defines when the backup starts; it does not change where or how long recovery points are kept.
      fr: L'heure de planification définit quand la sauvegarde démarre ; elle ne change ni l'emplacement ni la durée de conservation des points de récupération.
    d:
      en: Monthly retention applies to long-term recovery points in the vault tier.
      fr: La rétention mensuelle s'applique aux points de récupération à long terme du niveau coffre.
references:
  - title: Azure Instant Restore capability
    url: https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability
