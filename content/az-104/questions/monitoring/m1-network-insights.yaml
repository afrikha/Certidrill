id: m1-network-insights
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company has virtual networks, load balancers, application gateways and VPN gateways in several subscriptions and regions.

    You need a single place that shows the inventory of these network resources together with their resource health and their fired alerts, and that gives access to the Network Watcher diagnostic tools. The solution must not require any agent or configuration.

    What should you use?
  fr: |
    Votre entreprise possède des réseaux virtuels, des équilibreurs de charge, des passerelles d'application et des passerelles VPN dans plusieurs abonnements et régions.

    Vous avez besoin d'un emplacement unique qui affiche l'inventaire de ces ressources réseau avec leur intégrité et leurs alertes déclenchées, et qui donne accès aux outils de diagnostic de Network Watcher. La solution ne doit nécessiter aucun agent ni aucune configuration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Network insights", fr: "Insights réseau" } }
    - { id: b, text: { en: "Connection Monitor", fr: "Moniteur de connexion" } }
    - { id: c, text: { en: "Traffic analytics", fr: "Traffic analytics" } }
    - { id: d, text: VM Insights }
answer: { optionId: a }
explanation:
  correct:
    en: Network insights gives a visual view of all deployed network resources, with topology, resource health, metrics and alerts, without any configuration. It also gives access to Connection Monitor tests, flow logs, traffic analytics and the Network Watcher diagnostic toolkit.
    fr: Insights réseau offre une vue visuelle de toutes les ressources réseau déployées, avec la topologie, l'intégrité des ressources, les métriques et les alertes, sans aucune configuration. Il donne aussi accès aux tests du Moniteur de connexion, aux journaux de flux, à traffic analytics et à la boîte à outils de diagnostic de Network Watcher.
  options:
    b:
      en: Connection Monitor runs connectivity tests that you must configure; it does not inventory resource health.
      fr: Le Moniteur de connexion exécute des tests de connectivité qu'il faut configurer ; il ne fait pas l'inventaire de l'intégrité des ressources.
    c:
      en: Traffic analytics analyzes flow logs, which must be enabled first.
      fr: Traffic analytics analyse les journaux de flux, qui doivent d'abord être activés.
    d:
      en: VM Insights monitors virtual machines and needs the Azure Monitor Agent.
      fr: VM Insights surveille des machines virtuelles et nécessite l'agent Azure Monitor.
references:
  - title: Network insights
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview
