id: m1-metrics-aggregations
objective: "5.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You use Metrics Explorer to analyze the platform metrics of a virtual machine named **VM1**. The time granularity of the chart is set to 1 hour.

    Which aggregation should you select for each requirement? To answer, drag the appropriate aggregations to the correct requirements. Each aggregation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Metrics Explorer pour analyser les métriques de plateforme d'une machine virtuelle nommée **VM1**. La granularité temporelle du graphique est définie sur 1 heure.

    Quelle agrégation devez-vous sélectionner pour chaque exigence ? Pour répondre, faites glisser les agrégations appropriées vers les exigences correspondantes. Chaque agrégation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sum, text: Sum }
    - { id: count, text: Count }
    - { id: avg, text: Average }
    - { id: min, text: Min }
    - { id: max, text: Max }
  targets:
    - id: t1
      text: { en: "Show the total number of bytes sent by VM1 (Network Out Total) during each hour", fr: "Afficher le nombre total d'octets envoyés par VM1 (Network Out Total) pendant chaque heure" }
    - id: t2
      text: { en: "Show the highest Percentage CPU value reached during each hour", fr: "Afficher la valeur de Percentage CPU la plus élevée atteinte pendant chaque heure" }
    - id: t3
      text: { en: "Show how many measurements were captured during each hour, regardless of their value", fr: "Afficher combien de mesures ont été capturées pendant chaque heure, quelle que soit leur valeur" }
    - id: t4
      text: { en: "Show the lowest value of Available Memory Bytes during each hour", fr: "Afficher la valeur la plus basse d'Available Memory Bytes pendant chaque heure" }
answer:
  mapping: { t1: sum, t2: max, t3: count, t4: min }
explanation:
  correct:
    en: Sum adds all the values captured in the interval, which gives a total. Max and Min return the largest and the smallest value of the interval. Count returns the number of measurements and ignores their values. Average (Sum divided by Count, for most metrics) would hide both the peaks and the total.
    fr: Sum additionne toutes les valeurs capturées dans l'intervalle, ce qui donne un total. Max et Min renvoient la plus grande et la plus petite valeur de l'intervalle. Count renvoie le nombre de mesures sans tenir compte de leur valeur. Average (Sum divisé par Count, pour la plupart des métriques) masquerait à la fois les pics et le total.
references:
  - title: Azure Monitor metrics aggregation and display explained
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/metrics-aggregation-explained
