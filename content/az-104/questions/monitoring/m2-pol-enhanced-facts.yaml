id: m2-pol-enhanced-facts
objective: "5.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a Recovery Services vault named **RSV-Proseware**. Some virtual machines are protected by a Standard policy, and others by an Enhanced policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous gérez un coffre Recovery Services nommé **RSV-Proseware**. Certaines machines virtuelles sont protégées par une stratégie Standard, d'autres par une stratégie améliorée (Enhanced).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You can move a virtual machine protected by an Enhanced policy to a Standard policy to reduce snapshot costs.
        fr: Vous pouvez faire passer une machine virtuelle protégée par une stratégie améliorée à une stratégie Standard pour réduire les coûts d'instantanés.
    - id: s2
      text:
        en: With an Enhanced policy and an Hourly schedule, the shortest interval between two scheduled backups is 4 hours.
        fr: Avec une stratégie améliorée et une planification Hourly, l'intervalle le plus court entre deux sauvegardes planifiées est de 4 heures.
    - id: s3
      text:
        en: You can disable instant restore in a Standard policy by setting the snapshot retention to 0 days.
        fr: Vous pouvez désactiver la restauration instantanée dans une stratégie Standard en définissant la rétention des instantanés sur 0 jour.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Once a VM backup uses the Enhanced policy, Azure Backup does not allow changing the policy type back to Standard. The Enhanced hourly schedule can run every 4, 6, 8, 12 or 24 hours, so 4 hours is the minimum. Instant restore is always enabled and cannot be disabled; the lowest snapshot retention is 1 day.
    fr: Dès qu'une sauvegarde de machine virtuelle utilise la stratégie améliorée, Sauvegarde Azure ne permet plus de repasser au type Standard. La planification horaire de la stratégie améliorée peut s'exécuter toutes les 4, 6, 8, 12 ou 24 heures ; 4 heures est donc le minimum. La restauration instantanée est toujours activée et ne peut pas être désactivée ; la rétention minimale des instantanés est de 1 jour.
references:
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
  - title: Azure Instant Restore capability
    url: https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability
