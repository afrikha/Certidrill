id: m2-pol-powershell-hourly
objective: "5.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You need to create an Azure VM backup policy by using Azure PowerShell. The policy must create a recovery point **every 6 hours**.

    How should you complete the script? Select the appropriate options in the answer area.
  fr: |
    Vous devez créer une stratégie de sauvegarde de machines virtuelles Azure avec Azure PowerShell. La stratégie doit créer un point de récupération **toutes les 6 heures**.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    $sch = Get-AzRecoveryServicesBackupSchedulePolicyObject -WorkloadType AzureVM `
        -BackupManagementType AzureVM -PolicySubType [[sub]] -ScheduleRunFrequency [[freq]]
    $sch.HourlySchedule.ScheduleInterval = [[interval]]
    $sch.HourlySchedule.ScheduleWindowDuration = 24
    $ret = Get-AzRecoveryServicesBackupRetentionPolicyObject -WorkloadType AzureVM -ScheduleRunFrequency Hourly
    New-AzRecoveryServicesBackupProtectionPolicy -Name "Policy6h" -WorkloadType AzureVM `
        -RetentionPolicy $ret -SchedulePolicy $sch
  slots:
    - id: sub
      options:
        - { id: enhanced, text: Enhanced }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: freq
      options:
        - { id: hourly, text: Hourly }
        - { id: daily, text: Daily }
        - { id: weekly, text: Weekly }
    - id: interval
      options:
        - { id: i4, text: "4" }
        - { id: i6, text: "6" }
        - { id: i360, text: "360" }
answer:
  values: { sub: enhanced, freq: hourly, interval: i6 }
explanation:
  correct:
    en: Several backups per day require the Enhanced policy subtype with the Hourly run frequency. `ScheduleInterval` is expressed in hours and sets the interval after which the backup runs again on the same day, so 6 gives a recovery point every 6 hours.
    fr: Plusieurs sauvegardes par jour nécessitent le sous-type de stratégie Enhanced avec la fréquence d'exécution Hourly. `ScheduleInterval` s'exprime en heures et définit l'intervalle au bout duquel la sauvegarde est relancée le même jour ; la valeur 6 donne donc un point de récupération toutes les 6 heures.
  options:
    standard: { en: The Standard subtype supports only daily or weekly schedules for Azure VMs., fr: Le sous-type Standard ne prend en charge que des planifications quotidiennes ou hebdomadaires pour les machines virtuelles Azure. }
    premium: { en: Premium is not a policy subtype; the allowed values are Standard and Enhanced., fr: Premium n'est pas un sous-type de stratégie ; les valeurs autorisées sont Standard et Enhanced. }
    i4: { en: "4 would create a recovery point every 4 hours, not every 6 hours.", fr: "4 créerait un point de récupération toutes les 4 heures, et non toutes les 6 heures." }
    i360: { en: "The interval is in hours, not minutes.", fr: "L'intervalle s'exprime en heures, pas en minutes." }
references:
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
