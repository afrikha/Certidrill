id: m1-metrics-network-total
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** is suspected of sending large amounts of data to the internet.

    You need to use Metrics Explorer to display, for each hour of the last day, the total amount of data that VM1 sent over its network interfaces.

    How should you configure the chart of the **Network Out Total** metric?
  fr: |
    Une machine virtuelle nommée **VM1** est soupçonnée d'envoyer de grandes quantités de données vers Internet.

    Vous devez utiliser Metrics Explorer pour afficher, pour chaque heure de la dernière journée, la quantité totale de données envoyée par VM1 sur ses interfaces réseau.

    Comment devez-vous configurer le graphique de la métrique **Network Out Total** ?
body:
  options:
    - { id: a, text: { en: "Aggregation: Sum; time granularity: 1 hour", fr: "Agrégation : Sum ; granularité temporelle : 1 heure" } }
    - { id: b, text: { en: "Aggregation: Average; time granularity: 1 hour", fr: "Agrégation : Average ; granularité temporelle : 1 heure" } }
    - { id: c, text: { en: "Aggregation: Count; time granularity: 1 hour", fr: "Agrégation : Count ; granularité temporelle : 1 heure" } }
    - { id: d, text: { en: "Aggregation: Max; time granularity: 1 day", fr: "Agrégation : Max ; granularité temporelle : 1 jour" } }
answer: { optionId: a }
explanation:
  correct:
    en: The time granularity defines the interval used to aggregate values on the chart, so 1 hour gives one point per hour. Sum adds all the values captured in each interval, which gives the total number of bytes sent during that hour.
    fr: La granularité temporelle définit l'intervalle utilisé pour agréger les valeurs du graphique ; 1 heure donne donc un point par heure. Sum additionne toutes les valeurs capturées dans chaque intervalle, ce qui donne le nombre total d'octets envoyés pendant l'heure.
  options:
    b:
      en: Average gives the mean of the values captured in the interval, not the total.
      fr: Average donne la moyenne des valeurs capturées dans l'intervalle, pas le total.
    c:
      en: Count returns the number of measurements, not the amount of data.
      fr: Count renvoie le nombre de mesures, pas la quantité de données.
    d:
      en: A 1-day granularity shows a single point for the day, and Max returns only the largest value.
      fr: Une granularité d'un jour n'affiche qu'un point pour la journée, et Max renvoie seulement la plus grande valeur.
references:
  - title: Azure Monitor metrics aggregation and display explained
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/metrics-aggregation-explained
