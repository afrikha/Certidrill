id: mon-alert-components
objective: "5.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring Azure Monitor alerts for a production environment.

    Which component should you use for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.
  fr: |
    Vous configurez des alertes Azure Monitor pour un environnement de production.

    Quel composant devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: rule, text: { en: Alert rule, fr: Règle d'alerte } }
    - { id: ag, text: { en: Action group, fr: Groupe d'actions } }
    - { id: apr, text: { en: Alert processing rule, fr: Règle de traitement des alertes } }
    - { id: diag, text: { en: Diagnostic setting, fr: Paramètre de diagnostic } }
    - { id: wb, text: { en: Workbook, fr: Classeur (workbook) } }
  targets:
    - id: t1
      text: { en: Fire when the average CPU of a VM exceeds 85% for 10 minutes, fr: Se déclencher quand l'UC moyenne d'une machine virtuelle dépasse 85 % pendant 10 minutes }
    - id: t2
      text: { en: Notify the on-call team by e-mail and SMS, fr: Prévenir l'équipe d'astreinte par e-mail et SMS }
    - id: t3
      text: { en: Suppress notifications during a planned maintenance window, fr: Supprimer les notifications pendant une fenêtre de maintenance planifiée }
answer:
  mapping: { t1: rule, t2: ag, t3: apr }
explanation:
  correct:
    en: An alert rule defines the monitored signal and condition. An action group defines who is notified and how (e-mail, SMS, webhook, runbook…). An alert processing rule modifies fired alerts, for example to suppress their actions during maintenance. Diagnostic settings route platform logs; workbooks build reports.
    fr: Une règle d'alerte définit le signal surveillé et la condition. Un groupe d'actions définit qui est prévenu et comment (e-mail, SMS, webhook, runbook…). Une règle de traitement des alertes modifie les alertes déclenchées, par exemple pour supprimer leurs actions pendant une maintenance. Les paramètres de diagnostic acheminent les journaux de plateforme ; les classeurs servent aux rapports.
references:
  - title: Action groups
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
  - title: Alert processing rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
