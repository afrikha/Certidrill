id: sr-10-q3
objective: "5.2.4"
type: series_yesno
series: sr-10-cross-region-restore
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You use a Recovery Services vault created in West US.
  fr: |
    Vous utilisez un coffre Recovery Services créé dans West US.
body:
  solution:
    en: |
      To keep the backups outside East US, you create a Recovery Services vault in **West US**, and you try to enable backup for VM1 in that vault with a daily backup policy that retains recovery points for 30 days.
    fr: |
      Pour conserver les sauvegardes hors d'East US, vous créez un coffre Recovery Services dans **West US**, et vous tentez d'activer la sauvegarde de VM1 dans ce coffre avec une stratégie de sauvegarde quotidienne qui conserve les points de récupération pendant 30 jours.
answer: { value: false }
explanation:
  correct:
    en: |
      To protect a data source, the Recovery Services vault must be in the same region as that data source. A vault in West US can't protect VM1, which runs in East US, so no backup is taken and the goal isn't met.
    fr: |
      Pour protéger une source de données, le coffre Recovery Services doit se trouver dans la même région que celle-ci. Un coffre dans West US ne peut pas protéger VM1, qui s'exécute dans East US : aucune sauvegarde n'est effectuée et l'objectif n'est pas atteint.
references:
  - title: "Create and configure Recovery Services vaults"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
