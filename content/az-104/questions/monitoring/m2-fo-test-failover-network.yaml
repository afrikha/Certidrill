id: m2-fo-test-failover-network
objective: "5.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum replicates its production virtual machines from West Europe to North Europe by using Azure Site Recovery. When replication was enabled, Site Recovery created a virtual network named **VNet-prod-asr** in North Europe for failover.

    You need to run a disaster recovery drill. The drill must not affect production or the IP addresses that will be used during a real failover.

    Which virtual network should you select for the test failover?
  fr: |
    Adatum réplique ses machines virtuelles de production de West Europe vers North Europe avec Azure Site Recovery. À l'activation de la réplication, Site Recovery a créé un réseau virtuel nommé **VNet-prod-asr** dans North Europe pour le basculement.

    Vous devez exécuter un exercice de récupération d'urgence. L'exercice ne doit affecter ni la production ni les adresses IP qui serviront lors d'un vrai basculement.

    Quel réseau virtuel devez-vous sélectionner pour le test de basculement ?
body:
  options:
    - { id: a, text: { en: "An isolated, non-production virtual network in North Europe", fr: Un réseau virtuel isolé hors production dans North Europe } }
    - { id: b, text: { en: VNet-prod-asr, fr: VNet-prod-asr } }
    - { id: c, text: { en: The production virtual network in West Europe, fr: Le réseau virtuel de production dans West Europe } }
    - { id: d, text: { en: A new virtual network peered with VNet-prod-asr and the production virtual network, fr: Un nouveau réseau virtuel connecté par peering à VNet-prod-asr et au réseau virtuel de production } }
answer: { optionId: a }
explanation:
  correct:
    en: A test failover creates VMs in the target region in the network you choose, while replication continues. Microsoft recommends a non-production network, not the network created when you enabled replication, so that production IP addresses and networking components stay available.
    fr: Un test de basculement crée des machines virtuelles dans la région cible, dans le réseau choisi, pendant que la réplication continue. Microsoft recommande un réseau hors production, et non le réseau créé à l'activation de la réplication, afin que les adresses IP et composants réseau de production restent disponibles.
  options:
    b:
      en: VNet-prod-asr is the failover network; test VMs there could conflict with a real failover.
      fr: VNet-prod-asr est le réseau de basculement ; des machines virtuelles de test à cet endroit pourraient entrer en conflit avec un vrai basculement.
    c:
      en: Test failover VMs are created in the target region, and connecting them to production would affect it.
      fr: Les machines virtuelles du test de basculement sont créées dans la région cible, et les connecter à la production l'affecterait.
    d:
      en: Peering the test network with production networks breaks the isolation of the drill.
      fr: Connecter le réseau de test aux réseaux de production par peering rompt l'isolement de l'exercice.
references:
  - title: Tutorial to run an Azure VM disaster recovery drill
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-dr-drill
