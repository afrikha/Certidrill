id: m2-asr-cache-storage
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You enable Azure Site Recovery replication for an Azure virtual machine named **VM1** from East US 2 to Central US.

    Where are the disk writes of VM1 sent first?
  fr: |
    Vous activez la réplication Azure Site Recovery pour une machine virtuelle Azure nommée **VM1**, d'East US 2 vers Central US.

    Où les écritures disque de VM1 sont-elles envoyées en premier ?
body:
  options:
    - { id: a, text: { en: To a cache storage account in East US 2, fr: Vers un compte de stockage de cache dans East US 2 } }
    - { id: b, text: { en: To a cache storage account in Central US, fr: Vers un compte de stockage de cache dans Central US } }
    - { id: c, text: { en: Directly to the replica managed disks in Central US, fr: Directement vers les disques managés de réplica dans Central US } }
    - { id: d, text: { en: To the Recovery Services vault storage, fr: Vers le stockage du coffre Recovery Services } }
answer: { optionId: a }
explanation:
  correct:
    en: The Mobility service extension sends disk writes immediately to a cache storage account in the source region. Site Recovery then processes the cached data and sends it to the replica managed disks in the target region, which limits the impact on the production VM.
    fr: L'extension du service Mobilité envoie immédiatement les écritures disque vers un compte de stockage de cache dans la région source. Site Recovery traite ensuite les données mises en cache et les envoie vers les disques managés de réplica dans la région cible, ce qui limite l'impact sur la machine virtuelle de production.
  options:
    b:
      en: The cache storage account is in the source region, not the target region.
      fr: Le compte de stockage de cache se trouve dans la région source, pas dans la région cible.
    c:
      en: Data reaches the replica disks only after it is processed from the cache.
      fr: Les données n'atteignent les disques de réplica qu'après avoir été traitées depuis le cache.
    d:
      en: The vault orchestrates replication; it does not receive the disk writes.
      fr: Le coffre orchestre la réplication ; il ne reçoit pas les écritures disque.
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
