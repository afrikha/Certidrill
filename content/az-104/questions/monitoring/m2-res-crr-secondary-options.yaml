id: m2-res-crr-secondary-options
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Recovery Services vault named **RSV1** in East US that uses geo-redundant storage with Cross Region Restore enabled. RSV1 protects an Azure virtual machine named **VM1** that uses managed disks and the Standard policy.

    A regional outage makes East US unavailable. You need to recover VM1 as quickly as possible by using Azure Backup.

    What should you do?
  fr: |
    Vous disposez d'un coffre Recovery Services nommé **RSV1** dans East US qui utilise le stockage géoredondant avec la restauration interrégion activée. RSV1 protège une machine virtuelle Azure nommée **VM1** qui utilise des disques managés et la stratégie Standard.

    Une panne régionale rend East US indisponible. Vous devez récupérer VM1 le plus rapidement possible avec Sauvegarde Azure.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: From the secondary region view of the backup items, restore a vault-tier recovery point of VM1 as a new virtual machine in the paired region, West US.
        fr: Depuis la vue Région secondaire des éléments de sauvegarde, restaurer un point de récupération du niveau coffre de VM1 en tant que nouvelle machine virtuelle dans la région associée, West US.
    - id: b
      text:
        en: From the secondary region view of the backup items, use Replace existing to restore the disks of VM1.
        fr: Depuis la vue Région secondaire des éléments de sauvegarde, utiliser Remplacer l'existant pour restaurer les disques de VM1.
    - id: c
      text:
        en: Restore the most recent instant restore snapshot of VM1 to the paired region.
        fr: Restaurer l'instantané de restauration instantanée le plus récent de VM1 dans la région associée.
    - id: d
      text:
        en: Restore VM1 as a new virtual machine in any Azure region that has available capacity.
        fr: Restaurer VM1 en tant que nouvelle machine virtuelle dans n'importe quelle région Azure disposant de capacité.
answer: { optionId: a }
explanation:
  correct:
    en: Cross Region Restore restores Azure VMs in the secondary region, which is the Azure paired region (West US for East US). Only data stored in the vault is replicated, so secondary region restores are vault-tier restores, and they support Create a VM and Restore disks.
    fr: La restauration interrégion restaure les machines virtuelles Azure dans la région secondaire, qui est la région Azure associée (West US pour East US). Seules les données stockées dans le coffre sont répliquées ; les restaurations dans la région secondaire sont donc des restaurations du niveau coffre, et elles prennent en charge Créer une machine virtuelle et Restaurer des disques.
  options:
    b:
      en: Replace existing disks is not supported for Cross Region Restore, and the original VM is in the unavailable region.
      fr: Le remplacement des disques existants n'est pas pris en charge par la restauration interrégion, et la machine virtuelle d'origine se trouve dans la région indisponible.
    c:
      en: Snapshots are not replicated to the secondary region; only vault data is.
      fr: Les instantanés ne sont pas répliqués dans la région secondaire ; seules les données du coffre le sont.
    d:
      en: Cross Region Restore targets only the paired secondary region, not any region.
      fr: La restauration interrégion cible uniquement la région secondaire associée, pas n'importe quelle région.
references:
  - title: Restore VMs by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
