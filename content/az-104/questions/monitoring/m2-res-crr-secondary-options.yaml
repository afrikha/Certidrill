id: m2-res-crr-secondary-options
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Recovery Services vault named **RSV1** in East US that uses geo-redundant storage with Cross Region Restore enabled. RSV1 protects an Azure virtual machine named **VM1** that uses managed disks and the Standard policy.

    A regional outage makes East US unavailable. You need to recover VM1 as quickly as possible by using Azure Backup.

    What should you do?
  fr: |
    Vous disposez d'un coffre Recovery Services nommé **RSV1** dans East US qui utilise le stockage géoredondant avec la restauration interrégion activée. RSV1 protège une machine virtuelle Azure nommée **VM1** qui utilise des disques managés et la stratégie Standard.

    Une panne régionale rend East US indisponible. Vous devez récupérer VM1 le plus rapidement possible avec Sauvegarde Azure.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: In the Secondary Region view of RSV1, select a vault-tier recovery point of VM1, and then use Create new to restore a VM in West US.
        fr: Dans la vue Région secondaire de RSV1, sélectionner un point de récupération du niveau coffre de VM1, puis utiliser Créer nouveau pour restaurer une machine virtuelle dans West US.
    - id: b
      text:
        en: In the Secondary Region view of RSV1, select a vault-tier recovery point of VM1, and then use Replace existing to restore the disks of VM1.
        fr: Dans la vue Région secondaire de RSV1, sélectionner un point de récupération du niveau coffre de VM1, puis utiliser Remplacer l'existant pour restaurer les disques de VM1.
    - id: c
      text:
        en: In the Secondary Region view of RSV1, select the latest snapshot-tier recovery point of VM1, and then use Create new to restore a VM in West US.
        fr: Dans la vue Région secondaire de RSV1, sélectionner le dernier point de récupération du niveau instantané de VM1, puis utiliser Créer nouveau pour restaurer une machine virtuelle dans West US.
    - id: d
      text:
        en: In the Secondary Region view of RSV1, select a vault-tier recovery point of VM1, and then use Create new to restore a VM in Central US.
        fr: Dans la vue Région secondaire de RSV1, sélectionner un point de récupération du niveau coffre de VM1, puis utiliser Créer nouveau pour restaurer une machine virtuelle dans Central US.
answer: { optionId: a }
explanation:
  correct:
    en: Cross Region Restore restores Azure VMs in the secondary region, which is the Azure paired region (West US for East US). Only the vault-tier recovery points are replicated to the secondary region, and a secondary region restore supports Create new (create a virtual machine or restore disks) but not Replace existing.
    fr: La restauration interrégion restaure les machines virtuelles Azure dans la région secondaire, qui est la région Azure jumelée (West US pour East US). Seuls les points de récupération du niveau coffre sont répliqués dans la région secondaire, et une restauration dans la région secondaire prend en charge Créer nouveau (créer une machine virtuelle ou restaurer des disques), mais pas Remplacer l'existant.
  options:
    b:
      en: Replace existing is not supported for Cross Region Restore, and the original VM is in the unavailable region.
      fr: Remplacer l'existant n'est pas pris en charge par la restauration interrégion, et la machine virtuelle d'origine se trouve dans la région indisponible.
    c:
      en: Instant restore snapshots stay in the primary region and are not replicated; only vault-tier recovery points are available in the secondary region.
      fr: Les instantanés de restauration instantanée restent dans la région primaire et ne sont pas répliqués ; seuls les points de récupération du niveau coffre sont disponibles dans la région secondaire.
    d:
      en: A secondary region restore always targets the paired region, West US; you cannot choose another region such as Central US.
      fr: Une restauration dans la région secondaire cible toujours la région jumelée, West US ; vous ne pouvez pas choisir une autre région comme Central US.
references:
  - title: Restore VMs by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
