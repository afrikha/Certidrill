id: m1-kql-event-top
objective: "5.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your virtual machines send Windows events to a Log Analytics workspace by using the Azure Monitor Agent.

    You need a query that returns the five computers that logged the most Error events in the System event log during the last seven days.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vos machines virtuelles envoient des événements Windows vers un espace de travail Log Analytics avec l'agent Azure Monitor.

    Vous avez besoin d'une requête qui renvoie les cinq ordinateurs ayant consigné le plus d'événements de niveau Erreur dans le journal des événements Système au cours des sept derniers jours.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Event
    | where TimeGenerated > ago(7d)
    | [[op]] EventLog == "System" and EventLevelName == "Error"
    | summarize ErrorCount = [[agg]] by Computer
    | [[top]]
  slots:
    - id: op
      options:
        - { id: where, text: where }
        - { id: extend, text: extend }
        - { id: project, text: project }
    - id: agg
      options:
        - { id: count, text: count() }
        - { id: dcount, text: dcount(Computer) }
        - { id: sum, text: sum(EventID) }
        - { id: max, text: max(EventID) }
    - id: top
      options:
        - { id: top, text: top 5 by ErrorCount desc }
        - { id: take, text: take 5 }
        - { id: topc, text: top 5 by Computer desc }
        - { id: sort, text: sort by Computer asc }
answer:
  values: { op: where, agg: count, top: top }
explanation:
  correct:
    en: "`where` keeps only the System errors. `count()` returns the number of rows in each group, that is, the number of errors per computer. `top 5 by ErrorCount desc` sorts the groups by that count, highest first, and keeps the first five."
    fr: "`where` ne conserve que les erreurs du journal Système. `count()` renvoie le nombre de lignes de chaque groupe, c'est-à-dire le nombre d'erreurs par ordinateur. `top 5 by ErrorCount desc` trie les groupes selon ce nombre, du plus élevé au plus faible, et conserve les cinq premiers."
  options:
    dcount: { en: "dcount(Computer) is always 1 when the rows are grouped by Computer.", fr: "dcount(Computer) vaut toujours 1 quand les lignes sont regroupées par Computer." }
    sum: { en: "Adding up event IDs gives a meaningless number.", fr: "Additionner des ID d'événement donne un nombre sans signification." }
    take: { en: "take returns any five rows, without sorting.", fr: "take renvoie cinq lignes quelconques, sans tri." }
    extend: { en: "extend adds a column; it does not filter rows.", fr: "extend ajoute une colonne ; il ne filtre pas les lignes." }
references:
  - title: top operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/top-operator
  - title: Event table reference
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/event
