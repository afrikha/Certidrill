id: mon-kql-heartbeat
objective: "5.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your virtual machines send data to a Log Analytics workspace by using the Azure Monitor Agent.

    You need a query that lists the computers that have not sent a heartbeat during the last 15 minutes.

    How should you complete the query? Select the appropriate options in the answer area.
  fr: |
    Vos machines virtuelles envoient des données à un espace de travail Log Analytics avec l'agent Azure Monitor.

    Vous avez besoin d'une requête qui liste les ordinateurs n'ayant pas envoyé de pulsation (heartbeat) au cours des 15 dernières minutes.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: kusto
  template: |
    Heartbeat
    | summarize LastHeartbeat = [[agg]](TimeGenerated) by Computer
    | where LastHeartbeat < [[time]]
  slots:
    - id: agg
      options:
        - { id: max, text: max }
        - { id: min, text: min }
        - { id: count, text: count }
        - { id: any, text: take_any }
    - id: time
      options:
        - { id: ago, text: ago(15m) }
        - { id: now, text: now(15m) }
        - { id: raw, text: 15m }
        - { id: dt, text: datetime(15m) }
answer:
  values: { agg: max, time: ago }
explanation:
  correct:
    en: "`max(TimeGenerated)` gives the most recent heartbeat of each computer, and `ago(15m)` returns the time 15 minutes before now. A computer whose last heartbeat is older than that has stopped reporting."
    fr: "`max(TimeGenerated)` donne la pulsation la plus récente de chaque ordinateur, et `ago(15m)` renvoie l'heure qu'il était il y a 15 minutes. Un ordinateur dont la dernière pulsation est plus ancienne a cessé de remonter des données."
  options:
    min: { en: min returns the oldest heartbeat in the time range., fr: min renvoie la pulsation la plus ancienne de la plage de temps. }
    now: { en: "now(15m) returns a time 15 minutes in the future.", fr: "now(15m) renvoie une heure située 15 minutes dans le futur." }
    raw: { en: A timespan cannot be compared with a datetime., fr: Une durée ne peut pas être comparée à une date. }
references:
  - title: Azure Monitor Logs reference - Heartbeat
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/heartbeat
  - title: ago()
    url: https://learn.microsoft.com/en-us/kusto/query/ago-function
