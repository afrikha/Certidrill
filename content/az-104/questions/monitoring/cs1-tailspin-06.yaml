id: cs1-tailspin-06
objective: "5.1.4"
type: single
caseStudy: cs1-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for the weekly patching window of VMSS-Match.

    What should you create?
  fr: |
    Vous devez satisfaire l'exigence relative à la fenêtre hebdomadaire de mise à jour de VMSS-Match.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An alert processing rule on VMSS-Match with the Suppress notifications action and a weekly schedule", fr: "Une règle de traitement des alertes sur VMSS-Match avec l'action Supprimer les notifications et une planification hebdomadaire" } }
    - { id: b, text: { en: "An Automation runbook, scheduled weekly, that disables the five alert rules and then enables them again", fr: "Un runbook Automation, planifié chaque semaine, qui désactive les cinq règles d'alerte puis les réactive" } }
    - { id: c, text: { en: "A maintenance configuration assigned to VMSS-Match with a weekly window on Tuesday from 06:00 to 08:00 UTC", fr: "Une configuration de maintenance attribuée à VMSS-Match avec une fenêtre hebdomadaire le mardi de 06 h 00 à 08 h 00 UTC" } }
    - { id: d, text: { en: "An activity log alert rule on the Service Health planned maintenance events of West US 2", fr: "Une règle d'alerte de journal d'activité sur les événements de maintenance planifiée Service Health de West US 2" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An alert processing rule applies to fired alerts without changing the alert rules. With the suppression action and a recurring schedule, the alerts on VMSS-Match are still fired and recorded during the window, but their action groups are not called, so AG-OnCall sends no notification.
    fr: |
      Une règle de traitement des alertes s'applique aux alertes déclenchées sans modifier les règles d'alerte. Avec l'action de suppression et une planification récurrente, les alertes sur VMSS-Match sont toujours déclenchées et enregistrées pendant la fenêtre, mais leurs groupes d'actions ne sont pas appelés ; AG-OnCall n'envoie donc aucune notification.
  options:
    b: { en: "Disabling the alert rules stops the alerts from being fired at all, modifies the existing rules, and adds a runbook to maintain.", fr: "Désactiver les règles d'alerte empêche totalement le déclenchement des alertes, modifie les règles existantes et ajoute un runbook à maintenir." }
    c: { en: "A maintenance configuration schedules when updates are installed by Azure Update Manager; it does not affect the notifications of the alert rules.", fr: "Une configuration de maintenance planifie l'installation des mises à jour par Azure Update Manager ; elle n'a aucun effet sur les notifications des règles d'alerte." }
    d: { en: "A Service Health alert notifies about Azure platform maintenance; it does not silence the existing notifications.", fr: "Une alerte Service Health signale les maintenances de la plateforme Azure ; elle ne met pas en sourdine les notifications existantes." }
references:
  - title: Alert processing rules for Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
