id: m2-pol-enhanced-premium-v2
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** whose data disks are Premium SSD v2 disks. VM1 must be backed up to a Recovery Services vault.

    The backups must meet the following requirements:

    - Allow you to restore the entire virtual machine.
    - Create a recovery point every 4 hours.

    What should you use?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** dont les disques de données sont des disques Premium SSD v2. VM1 doit être sauvegardée dans un coffre Recovery Services.

    Les sauvegardes doivent répondre aux exigences suivantes :

    - Permettre de restaurer l'intégralité de la machine virtuelle.
    - Créer un point de récupération toutes les 4 heures.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: An Azure VM backup policy of the Enhanced subtype with an Hourly schedule every 4 hours
        fr: Une stratégie de sauvegarde de machine virtuelle Azure de sous-type Enhanced (améliorée) avec une planification Hourly toutes les 4 heures
    - id: b
      text:
        en: An Azure VM backup policy of the Standard subtype with an Hourly schedule every 4 hours
        fr: Une stratégie de sauvegarde de machine virtuelle Azure de sous-type Standard avec une planification Hourly toutes les 4 heures
    - id: c
      text:
        en: An Azure VM backup policy of the Standard subtype with a Daily schedule and six on-demand backups per day
        fr: Une stratégie de sauvegarde de machine virtuelle Azure de sous-type Standard avec une planification Daily et six sauvegardes à la demande par jour
    - id: d
      text:
        en: An Azure Disk Backup policy in a Backup vault with an Hourly schedule every 4 hours
        fr: Une stratégie Azure Disk Backup dans un coffre de sauvegarde avec une planification Hourly toutes les 4 heures
answer: { optionId: a }
explanation:
  correct:
    en: The Enhanced policy supports multiple backups per day, as often as every 4 hours, and it is required for newer offerings such as Premium SSD v2 and Ultra disks. It backs up the whole VM, so you can restore the entire virtual machine.
    fr: La stratégie améliorée (Enhanced) prend en charge plusieurs sauvegardes par jour, jusqu'à une toutes les 4 heures, et elle est requise pour les offres plus récentes comme Premium SSD v2 et Ultra Disk. Elle sauvegarde toute la machine virtuelle, ce qui permet de restaurer la machine virtuelle complète.
  options:
    b:
      en: The Standard policy offers daily or weekly schedules only, and it does not support Premium SSD v2 disks.
      fr: La stratégie Standard ne propose que des planifications quotidiennes ou hebdomadaires, et elle ne prend pas en charge les disques Premium SSD v2.
    c:
      en: The Standard policy does not support Premium SSD v2 disks, and manual on-demand backups do not meet a scheduled 4-hour requirement.
      fr: La stratégie Standard ne prend pas en charge les disques Premium SSD v2, et des sauvegardes manuelles à la demande ne répondent pas à une exigence planifiée de 4 heures.
    d:
      en: Azure Disk Backup protects individual disks and cannot restore an entire VM; for Premium SSD v2 disks it also supports only a 12-hour hourly frequency.
      fr: Azure Disk Backup protège des disques individuels et ne peut pas restaurer une machine virtuelle entière ; pour les disques Premium SSD v2, il ne prend en charge qu'une fréquence horaire de 12 heures.
references:
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
