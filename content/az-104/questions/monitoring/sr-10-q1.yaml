id: sr-10-q1
objective: "5.2.4"
type: series_yesno
series: sr-10-cross-region-restore
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You use a GRS Recovery Services vault in East US with Cross Region Restore enabled.
  fr: |
    Vous utilisez un coffre Recovery Services GRS dans East US avec la restauration interrégion activée.
body:
  solution:
    en: |
      You create a Recovery Services vault in **East US**. Before you protect any item, you keep the storage replication type set to **Geo-redundant** and you **enable Cross Region Restore**. You then enable backup for VM1 with a policy that runs a **daily** backup and retains daily recovery points for **30 days**.
    fr: |
      Vous créez un coffre Recovery Services dans **East US**. Avant de protéger un élément, vous laissez le type de réplication de stockage sur **Géoredondant** et vous **activez la restauration interrégion** (Cross Region Restore). Vous activez ensuite la sauvegarde de VM1 avec une stratégie qui effectue une sauvegarde **quotidienne** et conserve les points de récupération quotidiens pendant **30 jours**.
answer: { value: true }
explanation:
  correct:
    en: |
      The vault is in the same region as VM1, as Azure Backup requires, and the policy provides daily recovery points kept for 30 days. Cross Region Restore, available only on GRS vaults, lets you restore VM1 in the paired region West US during an outage or when there is no outage at all, for example during drills. The goal is met.
    fr: |
      Le coffre se trouve dans la même région que VM1, comme l'exige Sauvegarde Azure, et la stratégie fournit des points de récupération quotidiens conservés 30 jours. La restauration interrégion, disponible uniquement sur les coffres GRS, permet de restaurer VM1 dans la région jumelée West US pendant une panne ou en l'absence de toute panne, par exemple lors d'exercices. L'objectif est atteint.
references:
  - title: "Create and configure Recovery Services vaults"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
  - title: "Restore VMs by using the Azure portal"
