id: m1-diag-settings-rules
objective: "5.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage an Azure Firewall named **afw-hub** in a subscription named **Sub1**. You need to send the resource logs of afw-hub to two Log Analytics workspaces: **law-secops** in Sub1 and **law-noc** in a subscription named **Sub2**. You have the required permissions in both subscriptions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous gérez un pare-feu Azure Firewall nommé **afw-hub** dans un abonnement nommé **Sub1**. Vous devez envoyer les journaux de ressources d'afw-hub vers deux espaces de travail Log Analytics : **law-secops** dans Sub1 et **law-noc** dans un abonnement nommé **Sub2**. Vous disposez des autorisations nécessaires dans les deux abonnements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You can send the logs to law-secops and law-noc by using a single diagnostic setting.
        fr: Vous pouvez envoyer les journaux vers law-secops et law-noc au moyen d'un seul paramètre de diagnostic.
    - id: s2
      text:
        en: afw-hub can have up to five diagnostic settings.
        fr: afw-hub peut avoir jusqu'à cinq paramètres de diagnostic.
    - id: s3
      text:
        en: law-noc can be a destination even though it is in a different subscription from afw-hub.
        fr: law-noc peut être une destination même s'il se trouve dans un autre abonnement qu'afw-hub.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A diagnostic setting can contain at most one destination of each type, so sending to two workspaces requires two diagnostic settings, and each resource can have up to five. The destination does not have to be in the same subscription as the resource if the user who configures the setting has the appropriate access to both subscriptions.
    fr: Un paramètre de diagnostic contient au plus une destination de chaque type ; l'envoi vers deux espaces de travail nécessite donc deux paramètres de diagnostic, et chaque ressource peut en avoir jusqu'à cinq. La destination n'a pas besoin d'être dans le même abonnement que la ressource si l'utilisateur qui configure le paramètre dispose des accès appropriés dans les deux abonnements.
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings
