id: m2-asr-nsg-service-tags
objective: "5.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have Azure virtual machines in West Europe that you plan to replicate to North Europe by using Azure Site Recovery. The subnet of the virtual machines has a network security group (NSG) that denies all outbound internet traffic. An existing rule already allows outbound HTTPS to the **EventHub.NorthEurope** service tag.

    You need to add outbound HTTPS rules so that replication works. You must use service tags.

    Which three service tags should you allow? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de machines virtuelles Azure dans West Europe que vous prévoyez de répliquer vers North Europe avec Azure Site Recovery. Le sous-réseau des machines virtuelles possède un groupe de sécurité réseau (NSG) qui refuse tout le trafic Internet sortant. Une règle existante autorise déjà le HTTPS sortant vers l'étiquette de service **EventHub.NorthEurope**.

    Vous devez ajouter des règles HTTPS sortantes pour que la réplication fonctionne. Vous devez utiliser des étiquettes de service.

    Quelles sont les trois étiquettes de service à autoriser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: Storage.WestEurope }
    - { id: b, text: AzureSiteRecovery }
    - { id: c, text: AzureActiveDirectory }
    - { id: d, text: AzureBackup }
    - { id: e, text: AzureMonitor }
    - { id: f, text: AzureLoadBalancer }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: Replicating VMs need outbound HTTPS to the storage accounts of the source region (to write to the cache storage account), to Microsoft Entra ID for authentication, to the Site Recovery service, and to Event Hubs in the target region for monitoring. Site Recovery never needs inbound connectivity to the VMs.
    fr: Les machines virtuelles répliquées ont besoin d'un accès HTTPS sortant vers les comptes de stockage de la région source (pour écrire dans le compte de stockage de cache), vers Microsoft Entra ID pour l'authentification, vers le service Site Recovery et vers Event Hubs dans la région cible pour la supervision. Site Recovery n'a jamais besoin de connectivité entrante vers les machines virtuelles.
  options:
    d:
      en: AzureBackup is used by Azure Backup, not by Site Recovery replication.
      fr: AzureBackup est utilisé par Sauvegarde Azure, pas par la réplication Site Recovery.
    e:
      en: Site Recovery monitoring data goes to Event Hubs, which is already allowed; AzureMonitor is not required.
      fr: Les données de supervision de Site Recovery vont vers Event Hubs, déjà autorisé ; AzureMonitor n'est pas requis.
    f:
      en: AzureLoadBalancer identifies health probes of Azure Load Balancer; it is unrelated to replication.
      fr: AzureLoadBalancer identifie les sondes d'intégrité d'Azure Load Balancer ; il n'a aucun rapport avec la réplication.
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
