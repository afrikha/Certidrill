id: cs3-margiestravel-06
objective: "5.1.2"
type: yesno_statements
caseStudy: cs3-margiestravel
difficulty: 3
status: draft
stem:
  en: |
    You plan to create diagnostic settings that collect the AppServiceHTTPLogs category to meet the monitoring requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de créer des paramètres de diagnostic qui collectent la catégorie AppServiceHTTPLogs pour satisfaire l'exigence de supervision.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "A diagnostic setting on app-booking-ne can send the logs to law-travel."
        fr: "Un paramètre de diagnostic sur app-booking-ne peut envoyer les journaux à law-travel."
    - id: s2
      text:
        en: "A diagnostic setting on app-booking-ne can archive the logs in stmtlogswe."
        fr: "Un paramètre de diagnostic sur app-booking-ne peut archiver les journaux dans stmtlogswe."
    - id: s3
      text:
        en: "A single diagnostic setting on app-booking-we can send the logs to both law-travel and stmtlogswe."
        fr: "Un seul paramètre de diagnostic sur app-booking-we peut envoyer les journaux à la fois à law-travel et à stmtlogswe."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A Log Analytics workspace destination can be in any region, so app-booking-ne in North Europe can send its logs to law-travel. For a regional resource, a storage account destination must be in the same region as the resource, so app-booking-ne needs a storage account in North Europe. A single diagnostic setting can have one destination of each type, such as one workspace and one storage account."
    fr: "Un espace de travail Log Analytics de destination peut se trouver dans n'importe quelle région : app-booking-ne, dans North Europe, peut envoyer ses journaux à law-travel. Pour une ressource régionale, un compte de stockage de destination doit se trouver dans la même région que la ressource : app-booking-ne a besoin d'un compte de stockage dans North Europe. Un même paramètre de diagnostic peut avoir une destination de chaque type, par exemple un espace de travail et un compte de stockage."
references:
  - title: "Diagnostic Settings in Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
