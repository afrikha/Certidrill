id: cs3-treyresearch-05
objective: "5.1.5"
type: single
caseStudy: cs3-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the monitoring requirement for vmss-geno.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de supervision de vmss-geno.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the Azure Monitor Agent on vmss-geno and associate a VM insights data collection rule that targets law-trey.", fr: "Installer l'agent Azure Monitor sur vmss-geno et associer une règle de collecte de données VM Insights qui cible law-trey." } }
    - { id: b, text: { en: "Install the Log Analytics agent extension on vmss-geno and connect the agent to the law-trey workspace.", fr: "Installer l'extension de l'agent Log Analytics sur vmss-geno et connecter l'agent à l'espace de travail law-trey." } }
    - { id: c, text: { en: "Create a diagnostic setting on vmss-geno that sends the AllMetrics category to law-trey.", fr: "Créer sur vmss-geno un paramètre de diagnostic qui envoie la catégorie AllMetrics à law-trey." } }
    - { id: d, text: { en: "Enable boot diagnostics on vmss-geno and store the diagnostic data in a managed storage account.", fr: "Activer les diagnostics de démarrage sur vmss-geno et stocker les données de diagnostic dans un compte de stockage managé." } }
answer: { optionId: a }
explanation:
  correct:
    en: "VM insights collects guest performance counters through the Azure Monitor Agent. The agent sends the data defined in a data collection rule, which you associate with the scale set so that every instance reports to law-trey. Scale sets are supported."
    fr: "VM Insights collecte les compteurs de performances du système d'exploitation invité au moyen de l'agent Azure Monitor. L'agent envoie les données définies dans une règle de collecte de données que vous associez au groupe de machines virtuelles identiques, afin que chaque instance envoie ses données à law-trey. Les groupes de machines virtuelles identiques sont pris en charge."
  options:
    b: { en: "The Log Analytics agent is retired; VM insights uses the Azure Monitor Agent.", fr: "L'agent Log Analytics est mis hors service ; VM Insights utilise l'agent Azure Monitor." }
    c: { en: "Platform metrics are measured by the host and don't include guest memory and disk counters; they don't enable VM insights.", fr: "Les métriques de plateforme sont mesurées par l'hôte et n'incluent pas les compteurs de mémoire et de disque de l'invité ; elles n'activent pas VM Insights." }
    d: { en: "Boot diagnostics captures the console output and screenshots for troubleshooting startup, not performance data.", fr: "Les diagnostics de démarrage capturent la sortie console et des captures d'écran pour dépanner le démarrage, pas des données de performances." }
references:
  - title: "Enable VM monitoring in Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vm-enable-monitoring
