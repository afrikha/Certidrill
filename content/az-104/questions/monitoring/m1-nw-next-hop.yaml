id: m1-nw-next-hop
objective: "5.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual machine named **VM1** in a virtual network named **VNet1** should send all the traffic destined for **10.20.0.4** through a network virtual appliance. Users report that the traffic seems to bypass the appliance.

    You need to identify the next hop type, the next hop IP address and the route table that apply to the traffic from VM1 to 10.20.0.4.

    Which Network Watcher tool should you use?
  fr: |
    Une machine virtuelle nommée **VM1** d'un réseau virtuel nommé **VNet1** doit envoyer tout le trafic à destination de **10.20.0.4** via une appliance virtuelle réseau. Les utilisateurs signalent que le trafic semble contourner l'appliance.

    Vous devez identifier le type de tronçon suivant, l'adresse IP du tronçon suivant et la table de routage qui s'appliquent au trafic de VM1 vers 10.20.0.4.

    Quel outil de Network Watcher devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: b, text: { en: "IP flow verify", fr: "Vérification des flux IP" } }
    - { id: c, text: { en: "Effective security rules", fr: "Règles de sécurité effectives" } }
    - { id: d, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes de VPN" } }
answer: { optionId: a }
explanation:
  correct:
    en: Next hop detects routing issues. For a source VM and a destination IP address, it returns the next hop type, the next hop IP address and the ID of the route table used, which shows whether a user-defined route sends the traffic to the appliance.
    fr: Le tronçon suivant détecte les problèmes de routage. Pour une machine virtuelle source et une adresse IP de destination, il renvoie le type de tronçon suivant, l'adresse IP du tronçon suivant et l'ID de la table de routage utilisée, ce qui montre si un itinéraire défini par l'utilisateur envoie le trafic vers l'appliance.
  options:
    b:
      en: IP flow verify checks whether NSG rules allow or deny a packet; it does not show routing.
      fr: La vérification des flux IP contrôle si les règles NSG autorisent ou refusent un paquet ; elle n'affiche pas le routage.
    c:
      en: Effective security rules lists the NSG rules applied to a network interface, not the routes.
      fr: Les règles de sécurité effectives listent les règles NSG appliquées à une interface réseau, pas les routes.
    d:
      en: VPN troubleshoot diagnoses virtual network gateways and their connections.
      fr: La résolution des problèmes de VPN diagnostique les passerelles de réseau virtuel et leurs connexions.
references:
  - title: Next hop overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview
  - title: Azure Network Watcher overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
