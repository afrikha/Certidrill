id: cs2-woodgrove-05
objective: "5.1.6"
type: single
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You create a connection monitor in Network Watcher for the France Central region. You add a test group with VM-CORE1 as the source. You need to complete the test group to meet the monitoring requirement for SRV-LEGACY. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous créez un moniteur de connexion dans Network Watcher pour la région France Central. Vous ajoutez un groupe de tests avec VM-CORE1 comme source. Vous devez compléter le groupe de tests pour satisfaire l'exigence de supervision concernant SRV-LEGACY. La solution doit réduire l'effort d'administration au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add 192.168.20.15 as an external address destination, with a TCP test configuration on port 443", fr: "Ajouter 192.168.20.15 comme destination d'adresse externe, avec une configuration de test TCP sur le port 443" } }
    - { id: b, text: { en: "Add 192.168.20.15 as an external address destination, with an ICMP test configuration", fr: "Ajouter 192.168.20.15 comme destination d'adresse externe, avec une configuration de test ICMP" } }
    - { id: c, text: { en: "Install the Network Watcher Agent extension on SRV-LEGACY, and then add it as a destination", fr: "Installer l'extension Network Watcher Agent sur SRV-LEGACY, puis l'ajouter comme destination" } }
    - { id: d, text: { en: "Onboard SRV-LEGACY to Azure Arc with the Azure Monitor Agent, and then add it as a destination", fr: "Intégrer SRV-LEGACY à Azure Arc avec l'agent Azure Monitor, puis l'ajouter comme destination" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A connection monitor destination can be an IP address or an FQDN, which needs no agent; the checks run from the agent on the source VM, VM-CORE1. A TCP test configuration on port 443 tests the port that SRV-LEGACY listens on and records the round-trip time and the percentage of failed checks, which are kept in Azure Monitor metrics and in the Log Analytics workspace of the connection monitor.
    fr: |
      Une destination de moniteur de connexion peut être une adresse IP ou un FQDN, ce qui ne demande aucun agent ; les vérifications s'exécutent depuis l'agent de la machine virtuelle source, VM-CORE1. Une configuration de test TCP sur le port 443 teste le port qu'écoute SRV-LEGACY et enregistre le temps aller-retour et le pourcentage de vérifications en échec, conservés dans les métriques Azure Monitor et dans l'espace de travail Log Analytics du moniteur de connexion.
  options:
    b: { en: "An ICMP test measures reachability with ping, not the TCP 443 connection that the requirement specifies.", fr: "Un test ICMP mesure l'accessibilité par ping, pas la connexion TCP 443 exigée." }
    c: { en: "The Network Watcher Agent extension is installed only on Azure virtual machines, and a destination does not need an agent.", fr: "L'extension Network Watcher Agent ne s'installe que sur des machines virtuelles Azure, et une destination n'a pas besoin d'agent." }
    d: { en: "Arc-enabling the server is only needed to use an on-premises machine as a source; as a destination, it adds unnecessary effort.", fr: "L'activation d'Azure Arc sur le serveur n'est nécessaire que pour utiliser une machine locale comme source ; comme destination, elle ajoute un effort inutile." }
references:
  - title: "Connection Monitor Overview - Azure Network Watcher"
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
  - title: "Create a Connection Monitor - Azure Portal - Azure Network Watcher"
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-create-using-portal
