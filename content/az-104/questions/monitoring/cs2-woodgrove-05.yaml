id: cs2-woodgrove-05
objective: "5.1.6"
type: single
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: You need to meet the monitoring requirement for the connection between VM-CORE1 and SRV-LEGACY. What should you use?
  fr: Vous devez satisfaire l'exigence de supervision de la connexion entre VM-CORE1 et SRV-LEGACY. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Connection Monitor test group with VM-CORE1 as the source and 192.168.20.15 on TCP 443 as the destination", fr: "Un groupe de tests Moniteur de connexion avec VM-CORE1 comme source et 192.168.20.15 sur TCP 443 comme destination" } }
    - { id: b, text: { en: "IP flow verify in Network Watcher from VM-CORE1 to 192.168.20.15 on TCP 443", fr: "La vérification des flux IP de Network Watcher de VM-CORE1 vers 192.168.20.15 sur TCP 443" } }
    - { id: c, text: { en: "VPN troubleshoot in Network Watcher on VPNGW-Hub", fr: "La résolution des problèmes de VPN de Network Watcher sur VPNGW-Hub" } }
    - { id: d, text: { en: "Virtual network flow logs on VNet-Core sent to a Log Analytics workspace", fr: "Les journaux de flux de réseau virtuel sur VNet-Core envoyés vers un espace de travail Log Analytics" } }
answer: { optionId: a }
explanation:
  correct:
    en: Connection Monitor runs periodic TCP, ICMP or HTTP checks and records the round-trip time and the percentage of failed checks in Azure Monitor metrics and a Log Analytics workspace. The Azure VM is the source (Network Watcher extension). An IP address destination needs no agent, so SRV-LEGACY does not have to be Azure Arc-enabled.
    fr: Le Moniteur de connexion exécute des vérifications TCP, ICMP ou HTTP périodiques et enregistre le temps d'aller-retour et le pourcentage de vérifications en échec dans les métriques Azure Monitor et un espace de travail Log Analytics. La machine virtuelle Azure est la source (extension Network Watcher). Une destination de type adresse IP ne demande aucun agent ; SRV-LEGACY n'a donc pas besoin d'être activé pour Azure Arc.
  options:
    b: { en: "IP flow verify is a one-time check of the NSG rules; it does not measure latency or keep a history.", fr: "La vérification des flux IP est un contrôle ponctuel des règles NSG ; elle ne mesure pas la latence et ne conserve pas d'historique." }
    c: { en: "VPN troubleshoot diagnoses a gateway or a connection on demand; the main path uses ExpressRoute and no latency history is kept.", fr: "La résolution des problèmes de VPN diagnostique une passerelle ou une connexion à la demande ; le chemin principal utilise ExpressRoute et aucun historique de latence n'est conservé." }
    d: { en: "Flow logs record the IP flows that are allowed or denied, not the round-trip time or failed checks.", fr: "Les journaux de flux enregistrent les flux IP autorisés ou refusés, pas le temps d'aller-retour ni les vérifications en échec." }
references:
  - title: "Connection Monitor Overview - Azure Network Watcher"
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
