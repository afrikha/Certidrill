id: m1-metrics-facts
objective: "5.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You use Metrics Explorer in Azure Monitor to analyze the platform metrics of the virtual machines in a subscription named **Sub1**. No agent is installed on the virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Metrics Explorer dans Azure Monitor pour analyser les métriques de plateforme des machines virtuelles d'un abonnement nommé **Sub1**. Aucun agent n'est installé sur les machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Platform metrics are stored for 93 days.
        fr: Les métriques de plateforme sont stockées pendant 93 jours.
    - id: s2
      text:
        en: A single Metrics Explorer chart can display a time range of 60 days.
        fr: Un même graphique Metrics Explorer peut afficher une plage de temps de 60 jours.
    - id: s3
      text:
        en: The Percentage CPU metric is available only after you install the Azure Monitor Agent.
        fr: La métrique Percentage CPU n'est disponible qu'après l'installation de l'agent Azure Monitor.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Platform metrics are collected automatically, without any agent or configuration, and are stored for 93 days. A single chart can query at most 30 days of data; you can then pan the chart to view the rest of the retention period. Percentage CPU is a host-level platform metric, so it needs no agent.
    fr: |
      Les métriques de plateforme sont collectées automatiquement, sans agent ni configuration, et stockées pendant 93 jours. Un même graphique peut interroger au maximum 30 jours de données ; vous pouvez ensuite faire défiler le graphique pour voir le reste de la période de rétention. Percentage CPU est une métrique de plateforme mesurée au niveau de l'hôte : elle ne nécessite aucun agent.
references:
  - title: Metrics in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
