id: m1-alert-processing-weekend
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a subscription named **Sub1** that contains a resource group named **RG-Prod**. Twelve alert rules, each with its own action group, monitor the virtual machines of RG-Prod. Some of these rules also monitor virtual machines in other resource groups.

    Every Saturday from 01:00 to 05:00, the virtual machines of RG-Prod are patched. During this window:

    - No notification must be sent for alerts fired on the virtual machines of RG-Prod.
    - The fired alerts must still be visible on the Alerts page.
    - Alerts on virtual machines outside RG-Prod must keep notifying the operators.

    The solution must minimize administrative effort. What should you create?
  fr: |
    Vous disposez d'un abonnement nommé **Sub1** qui contient un groupe de ressources nommé **RG-Prod**. Douze règles d'alerte, chacune avec son propre groupe d'actions, surveillent les machines virtuelles de RG-Prod. Certaines de ces règles surveillent aussi des machines virtuelles d'autres groupes de ressources.

    Chaque samedi de 1 h 00 à 5 h 00, les machines virtuelles de RG-Prod reçoivent des correctifs. Pendant cette fenêtre :

    - Aucune notification ne doit être envoyée pour les alertes déclenchées sur les machines virtuelles de RG-Prod.
    - Les alertes déclenchées doivent rester visibles sur la page Alertes.
    - Les alertes sur les machines virtuelles situées hors de RG-Prod doivent continuer à prévenir les opérateurs.

    La solution doit réduire au minimum l'effort d'administration. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An alert processing rule scoped to RG-Prod with the Suppress notifications action and a weekly recurring schedule", fr: "Une règle de traitement des alertes dont l'étendue est RG-Prod, avec l'action Supprimer les notifications et une planification récurrente hebdomadaire" } }
    - { id: b, text: { en: "An Azure Automation runbook that disables the twelve alert rules at 01:00 and enables them again at 05:00", fr: "Un runbook Azure Automation qui désactive les douze règles d'alerte à 1 h 00 et les réactive à 5 h 00" } }
    - { id: c, text: { en: "An alert processing rule scoped to Sub1 with the Apply action group action and a weekly recurring schedule", fr: "Une règle de traitement des alertes dont l'étendue est Sub1, avec l'action Appliquer un groupe d'actions et une planification récurrente hebdomadaire" } }
    - { id: d, text: { en: "A new action group without any notification, assigned to the twelve alert rules every Saturday", fr: "Un nouveau groupe d'actions sans notification, attribué aux douze règles d'alerte chaque samedi" } }
answer: { optionId: a }
explanation:
  correct:
    en: An alert processing rule modifies alerts as they fire. With the suppression action, it removes the action groups of the affected alerts, which stay visible in the portal. Scoping it to RG-Prod and using a recurring schedule limits the suppression to those virtual machines during the patch window, with a single object to maintain.
    fr: Une règle de traitement des alertes modifie les alertes au moment où elles se déclenchent. Avec l'action de suppression, elle retire les groupes d'actions des alertes concernées, qui restent visibles dans le portail. Une étendue limitée à RG-Prod et une planification récurrente cantonnent la suppression à ces machines virtuelles pendant la fenêtre de correctifs, avec un seul objet à maintenir.
  options:
    b:
      en: Disabling the rules stops the alerts from firing at all, so they would not be visible, and the rules that also monitor other resource groups would stop notifying for them.
      fr: Désactiver les règles empêche toute alerte de se déclencher ; elles ne seraient donc pas visibles, et les règles qui surveillent aussi d'autres groupes de ressources cesseraient de prévenir pour ces derniers.
    c:
      en: Applying an action group adds notifications instead of suppressing them, and a Sub1 scope would also affect other resource groups.
      fr: Appliquer un groupe d'actions ajoute des notifications au lieu de les supprimer, et une étendue Sub1 toucherait aussi les autres groupes de ressources.
    d:
      en: Changing the action groups of twelve rules every week is manual work and also affects the resources outside RG-Prod.
      fr: Modifier chaque semaine les groupes d'actions de douze règles est un travail manuel qui affecte aussi les ressources situées hors de RG-Prod.
references:
  - title: Alert processing rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
