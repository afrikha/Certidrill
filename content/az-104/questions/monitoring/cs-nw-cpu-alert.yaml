id: cs-nw-cpu-alert
objective: "5.1.4"
type: single
caseStudy: cs-northwind-clinics
difficulty: 1
status: draft
stem:
  en: You need to meet the notification requirement for VM-APP1. What should you create?
  fr: Vous devez satisfaire l'exigence de notification concernant VM-APP1. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: A metric alert rule on Percentage CPU with an action group that sends an SMS, fr: Une règle d'alerte de métrique sur Percentage CPU avec un groupe d'actions qui envoie un SMS } }
    - { id: b, text: { en: A diagnostic setting that sends the VM metrics to a Log Analytics workspace, fr: Un paramètre de diagnostic qui envoie les métriques de la machine vers un espace de travail Log Analytics } }
    - { id: c, text: { en: A Connection Monitor test in Network Watcher, fr: Un test Connection Monitor dans Network Watcher } }
    - { id: d, text: { en: An Azure Advisor alert, fr: Une alerte Azure Advisor } }
answer: { optionId: a }
explanation:
  correct:
    en: A metric alert rule evaluates the Percentage CPU platform metric against the 90% threshold, and its action group sends the SMS. Platform metrics need no agent or workspace, which minimizes administrative effort.
    fr: Une règle d'alerte de métrique évalue la métrique de plateforme Percentage CPU par rapport au seuil de 90 %, et son groupe d'actions envoie le SMS. Les métriques de plateforme ne demandent ni agent ni espace de travail, ce qui réduit l'effort d'administration.
references:
  - title: Create Azure Monitor metric alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule
