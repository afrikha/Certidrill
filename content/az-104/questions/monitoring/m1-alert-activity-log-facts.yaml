id: m1-alert-activity-log-facts
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating activity log alert rules for a subscription named **Sub1**.

    Which two statements about activity log alerts are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez des règles d'alerte de journal d'activité pour un abonnement nommé **Sub1**.

    Quelles sont les deux affirmations vraies concernant les alertes de journal d'activité ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "They are stateless and fire each time a matching event occurs.", fr: "Elles sont sans état et se déclenchent à chaque événement correspondant." } }
    - { id: b, text: { en: "Service Health alerts are a type of activity log alert.", fr: "Les alertes Service Health sont un type d'alerte de journal d'activité." } }
    - { id: c, text: { en: "Their condition is written as a KQL query on the AzureActivity table.", fr: "Leur condition s'écrit sous forme de requête KQL sur la table AzureActivity." } }
    - { id: d, text: { en: "They can use dynamic thresholds.", fr: "Elles peuvent utiliser des seuils dynamiques." } }
    - { id: e, text: { en: "They require a diagnostic setting that sends the activity log to a Log Analytics workspace.", fr: "Elles nécessitent un paramètre de diagnostic qui envoie le journal d'activité vers un espace de travail Log Analytics." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: All activity log alerts are stateless, so they fire every time a new matching event is recorded. Service Health and Resource Health alerts are activity log alerts on the corresponding event categories.
    fr: Toutes les alertes de journal d'activité sont sans état ; elles se déclenchent donc chaque fois qu'un nouvel événement correspondant est enregistré. Les alertes Service Health et Resource Health sont des alertes de journal d'activité sur les catégories d'événements correspondantes.
  options:
    c: { en: "A KQL condition is a log search alert; activity log alerts filter event fields such as category or operation name.", fr: "Une condition KQL correspond à une alerte de recherche dans les journaux ; les alertes de journal d'activité filtrent des champs d'événement comme la catégorie ou le nom de l'opération." }
    d: { en: "Dynamic thresholds apply to metric and log search alerts.", fr: "Les seuils dynamiques s'appliquent aux alertes de métrique et de recherche dans les journaux." }
    e: { en: "Activity log alerts evaluate the activity log directly; no export is needed.", fr: "Les alertes de journal d'activité évaluent directement le journal d'activité ; aucune exportation n'est nécessaire." }
references:
  - title: Overview of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
  - title: Types of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
