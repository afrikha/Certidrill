id: m1-nw-packet-capture
objective: "5.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A Windows virtual machine named **VM1** intermittently fails TLS handshakes with a partner service. No extension is installed on VM1. A storage account named **stcapture01** exists in the same region.

    You need to capture the TCP 443 traffic of VM1 for 30 minutes and analyze the packets in a network protocol analyzer.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une machine virtuelle Windows nommée **VM1** échoue par intermittence lors des négociations TLS avec un service partenaire. Aucune extension n'est installée sur VM1. Un compte de stockage nommé **stcapture01** existe dans la même région.

    Vous devez capturer le trafic TCP 443 de VM1 pendant 30 minutes et analyser les paquets dans un analyseur de protocole réseau.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ext, text: { en: Install the Network Watcher Agent extension on VM1., fr: Installer l'extension de l'agent Network Watcher sur VM1. } }
    - { id: start, text: { en: "Start a packet capture session on VM1 with a TCP port 443 filter, a 30-minute time limit and stcapture01 as the destination.", fr: "Démarrer une session de capture de paquets sur VM1 avec un filtre sur le port TCP 443, une limite de 30 minutes et stcapture01 comme destination." } }
    - { id: dl, text: { en: Download the capture file from stcapture01 and open it in the protocol analyzer., fr: Télécharger le fichier de capture depuis stcapture01 et l'ouvrir dans l'analyseur de protocole. } }
    - { id: flow, text: { en: Enable a virtual network flow log for the virtual network of VM1., fr: Activer un journal de flux de réseau virtuel pour le réseau virtuel de VM1. } }
    - { id: cm, text: { en: Create a connection monitor with VM1 as the source., fr: Créer un moniteur de connexion avec VM1 comme source. } }
    - { id: ama, text: { en: Install the Azure Monitor Agent on VM1., fr: Installer l'agent Azure Monitor sur VM1. } }
answer:
  sequence: [ ext, start, dl ]
explanation:
  correct:
    en: Packet capture is started remotely through Network Watcher and requires the Network Watcher Agent VM extension (AzureNetworkWatcherExtension) on the VM. A 5-tuple filter limits the capture to TCP 443, and the time limit ends the session. The capture is saved to a storage blob (or the local disk), from which you download it for analysis.
    fr: La capture de paquets se démarre à distance via Network Watcher et nécessite l'extension de VM de l'agent Network Watcher (AzureNetworkWatcherExtension). Un filtre sur le quintuple limite la capture à TCP 443, et la limite de temps met fin à la session. La capture est enregistrée dans un blob de stockage (ou sur le disque local), d'où vous la téléchargez pour l'analyser.
  options:
    flow: { en: "Flow logs record IP flow information, not packet contents.", fr: "Les journaux de flux enregistrent les informations de flux IP, pas le contenu des paquets." }
    cm: { en: Connection Monitor measures reachability and latency; it does not capture packets., fr: Le Moniteur de connexion mesure la joignabilité et la latence ; il ne capture pas de paquets. }
    ama: { en: "Packet capture uses the Network Watcher Agent, not the Azure Monitor Agent.", fr: "La capture de paquets utilise l'agent Network Watcher, pas l'agent Azure Monitor." }
references:
  - title: Packet capture overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview
