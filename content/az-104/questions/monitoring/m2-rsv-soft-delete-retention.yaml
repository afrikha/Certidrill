id: m2-rsv-soft-delete-retention
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Recovery Services vault named **RSV1** that protects 40 Azure virtual machines. RSV1 uses the default security settings.

    A new compliance rule states that if an administrator stops protection and deletes the backup data of a virtual machine, the data must remain recoverable for 90 days.

    What should you do?
  fr: |
    Vous disposez d'un coffre Recovery Services nommé **RSV1** qui protège 40 machines virtuelles Azure. RSV1 utilise les paramètres de sécurité par défaut.

    Une nouvelle règle de conformité impose que, si un administrateur arrête la protection et supprime les données de sauvegarde d'une machine virtuelle, ces données restent récupérables pendant 90 jours.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Set the soft delete retention period of RSV1 to 90 days.
        fr: Définir la période de rétention de la suppression réversible de RSV1 sur 90 jours.
    - id: b
      text:
        en: Set the retention of daily backup points in the backup policy to 90 days.
        fr: Définir la rétention des points de sauvegarde quotidiens de la stratégie de sauvegarde sur 90 jours.
    - id: c
      text:
        en: Add a CanNotDelete lock to the resource group that contains RSV1.
        fr: Ajouter un verrou Suppression (CanNotDelete) au groupe de ressources qui contient RSV1.
    - id: d
      text:
        en: Enable Cross Region Restore on RSV1.
        fr: Activer la restauration interrégion sur RSV1.
answer: { optionId: a }
explanation:
  correct:
    en: Soft delete keeps deleted backup data in a soft-deleted state for the soft delete retention period, which is 14 days by default and can be set from 14 to 180 days. Setting it to 90 days keeps deleted data recoverable for 90 days; the days beyond the first 14 are billed.
    fr: La suppression réversible conserve les données de sauvegarde supprimées à l'état supprimé de façon réversible pendant la période de rétention de la suppression réversible, qui est de 14 jours par défaut et peut aller de 14 à 180 jours. La régler sur 90 jours garde les données supprimées récupérables pendant 90 jours ; les jours au-delà des 14 premiers sont facturés.
  options:
    b:
      en: Policy retention defines how long recovery points are kept while the item is protected; it does not keep data after the backup data is deleted.
      fr: La rétention de la stratégie définit la durée de conservation des points de récupération tant que l'élément est protégé ; elle ne conserve pas les données après la suppression des données de sauvegarde.
    c:
      en: A resource lock protects Azure Resource Manager resources such as the vault itself; it does not govern how long deleted backup items stay recoverable.
      fr: Un verrou de ressource protège des ressources Azure Resource Manager comme le coffre lui-même ; il ne régit pas la durée pendant laquelle les éléments de sauvegarde supprimés restent récupérables.
    d:
      en: Cross Region Restore lets you restore in the paired region; it has no effect on deleted backup data.
      fr: La restauration interrégion permet de restaurer dans la région associée ; elle n'a aucun effet sur les données de sauvegarde supprimées.
references:
  - title: Secure by default with soft delete for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/secure-by-default
