id: cs2-proseware-06
objective: "5.1.4"
type: single
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the notification requirement for the web development team. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de notification de l'équipe de développement web. La solution doit réduire l'effort d'administration au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an alert processing rule scoped to RG-Web with the Apply action group action and AG-Web", fr: "Créer une règle de traitement des alertes dont l'étendue est RG-Web, avec l'action Appliquer le groupe d'actions et AG-Web" } }
    - { id: b, text: { en: "Add AG-Web to the actions of the five alert rules that monitor resources in RG-Web", fr: "Ajouter AG-Web aux actions des cinq règles d'alerte qui surveillent des ressources de RG-Web" } }
    - { id: c, text: { en: "Add the email address and the webhook of the web development team to AG-Ops", fr: "Ajouter l'adresse e-mail et le webhook de l'équipe de développement web à AG-Ops" } }
    - { id: d, text: { en: "Create an activity log alert rule scoped to RG-Web that uses AG-Web", fr: "Créer une règle d'alerte de journal d'activité dont l'étendue est RG-Web, qui utilise AG-Web" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An alert processing rule acts on the alerts fired for the resources in its scope, whatever alert rule fired them, without changing the alert rules. The Apply action group action adds AG-Web to these alerts, so the web team is notified for the current rules and for rules created later in RG-Web. AG-Ops is still called as before.
    fr: |
      Une règle de traitement des alertes agit sur les alertes déclenchées pour les ressources de son étendue, quelle que soit la règle d'alerte qui les a déclenchées, sans modifier les règles d'alerte. L'action Appliquer le groupe d'actions ajoute AG-Web à ces alertes ; l'équipe web est donc avertie pour les règles actuelles comme pour celles créées ultérieurement dans RG-Web. AG-Ops est toujours appelé comme avant.
  options:
    b: { en: "Adding an action group modifies the existing alert rules, and rules created later would need the same change.", fr: "Ajouter un groupe d'actions modifie les règles d'alerte existantes, et les règles créées ultérieurement nécessiteraient la même modification." }
    c: { en: "AG-Ops is used by all twelve rules, so the web team would also be notified of the alerts outside RG-Web.", fr: "AG-Ops est utilisé par les douze règles ; l'équipe web serait donc aussi avertie des alertes hors de RG-Web." }
    d: { en: "An activity log alert reacts to control plane events in the activity log, not to the alerts fired by the metric and log search alert rules.", fr: "Une alerte de journal d'activité réagit aux événements du plan de contrôle du journal d'activité, pas aux alertes déclenchées par les règles d'alerte de métrique et de recherche dans les journaux." }
references:
  - title: "Alert processing rules for Azure Monitor alerts - Azure Monitor"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
