id: cs2-proseware-06
objective: "5.1.4"
type: single
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for alert notifications during the maintenance window. What should you create?
  fr: Vous devez satisfaire l'exigence relative aux notifications d'alerte pendant la fenêtre de maintenance. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An alert processing rule scoped to Sub-Learning that suppresses notifications on a weekly schedule, Sunday 01:00 to 04:00 Eastern Time", fr: "Une règle de traitement des alertes dont l'étendue est Sub-Learning, qui supprime les notifications selon une planification hebdomadaire, le dimanche de 01:00 à 04:00 heure de l'Est" } }
    - { id: b, text: { en: "An Automation runbook that disables the twelve alert rules on Sunday at 01:00 and enables them at 04:00", fr: "Un runbook Automation qui désactive les douze règles d'alerte le dimanche à 01:00 et les réactive à 04:00" } }
    - { id: c, text: { en: "A second action group with no notifications, selected in each alert rule", fr: "Un second groupe d'actions sans notification, sélectionné dans chaque règle d'alerte" } }
    - { id: d, text: { en: "A Delete lock on AG-Ops", fr: "Un verrou Suppression sur AG-Ops" } }
answer: { optionId: a }
explanation:
  correct:
    en: An alert processing rule acts on fired alerts without changing the alert rules. Its suppression action, with a recurring schedule, removes the action groups' notifications during the window. One rule scoped to the subscription covers all twelve alert rules, which minimizes administrative effort.
    fr: Une règle de traitement des alertes agit sur les alertes déclenchées sans modifier les règles d'alerte. Son action de suppression, avec une planification récurrente, supprime les notifications des groupes d'actions pendant la fenêtre. Une seule règle dont l'étendue est l'abonnement couvre les douze règles d'alerte, ce qui réduit l'effort d'administration.
  options:
    b: { en: "Disabling and enabling the rules modifies them, which requirement 7 forbids, and requires maintaining a runbook.", fr: "Désactiver puis réactiver les règles les modifie, ce que l'exigence 7 interdit, et impose de maintenir un runbook." }
    c: { en: "Changing the action group of each rule modifies the alert rules and would also silence them outside the window.", fr: "Changer le groupe d'actions de chaque règle modifie les règles d'alerte et les rendrait muettes aussi en dehors de la fenêtre." }
    d: { en: "A lock prevents deleting the action group; it does not affect notifications.", fr: "Un verrou empêche la suppression du groupe d'actions ; il n'affecte pas les notifications." }
references:
  - title: Alert processing rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
