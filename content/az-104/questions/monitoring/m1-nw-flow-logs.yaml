id: m1-nw-flow-logs
objective: "5.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** that contains 15 subnets and 120 virtual machines. Several network security groups are associated with the subnets. No flow logging is configured.

    You need to start recording the IP traffic that flows through VNet1 and analyze it with traffic analytics. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** qui contient 15 sous-réseaux et 120 machines virtuelles. Plusieurs groupes de sécurité réseau sont associés aux sous-réseaux. Aucun journal de flux n'est configuré.

    Vous devez commencer à enregistrer le trafic IP qui transite par VNet1 et l'analyser avec traffic analytics. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: A virtual network flow log for VNet1 with traffic analytics enabled, fr: Un journal de flux de réseau virtuel pour VNet1 avec traffic analytics activé } }
    - { id: b, text: { en: An NSG flow log for each network security group with traffic analytics enabled, fr: Un journal de flux NSG pour chaque groupe de sécurité réseau avec traffic analytics activé } }
    - { id: c, text: { en: A diagnostic setting on VNet1 that sends allLogs to a Log Analytics workspace, fr: Un paramètre de diagnostic sur VNet1 qui envoie allLogs vers un espace de travail Log Analytics } }
    - { id: d, text: { en: A continuous packet capture session on each virtual machine, fr: Une session de capture de paquets continue sur chaque machine virtuelle } }
answer: { optionId: a }
explanation:
  correct:
    en: A virtual network flow log records the IP flows of a whole virtual network with a single resource, and traffic analytics can process it. NSG flow logs are retiring (September 30, 2027) and new ones can no longer be created, so Microsoft recommends virtual network flow logs instead.
    fr: Un journal de flux de réseau virtuel enregistre les flux IP de tout un réseau virtuel avec une seule ressource, et traffic analytics peut le traiter. Les journaux de flux NSG sont en cours de mise hors service (30 septembre 2027) et il n'est plus possible d'en créer de nouveaux ; Microsoft recommande donc les journaux de flux de réseau virtuel.
  options:
    b:
      en: New NSG flow logs can no longer be created because the feature is retiring.
      fr: Il n'est plus possible de créer de nouveaux journaux de flux NSG, car la fonctionnalité est en cours de mise hors service.
    c:
      en: Flow logs are configured in Network Watcher, not through a diagnostic setting on the virtual network.
      fr: Les journaux de flux se configurent dans Network Watcher, pas via un paramètre de diagnostic sur le réseau virtuel.
    d:
      en: Packet captures on 120 VMs are heavy to manage, and traffic analytics does not process them.
      fr: Des captures de paquets sur 120 machines virtuelles sont lourdes à gérer, et traffic analytics ne les traite pas.
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: NSG flow logs overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
