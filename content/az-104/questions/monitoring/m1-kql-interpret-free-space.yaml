id: m1-kql-interpret-free-space
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run the following query in a Log Analytics workspace that receives performance counters from your Windows virtual machines. Each virtual machine has several logical disks.

    ```kusto
    Perf
    | where TimeGenerated > ago(1h)
    | where CounterName == "% Free Space"
    | summarize MinFree = min(CounterValue) by Computer
    | where MinFree < 10
    ```

    What does the query return?
  fr: |
    Vous exécutez la requête suivante dans un espace de travail Log Analytics qui reçoit les compteurs de performances de vos machines virtuelles Windows. Chaque machine virtuelle possède plusieurs disques logiques.

    ```kusto
    Perf
    | where TimeGenerated > ago(1h)
    | where CounterName == "% Free Space"
    | summarize MinFree = min(CounterValue) by Computer
    | where MinFree < 10
    ```

    Que renvoie la requête ?
body:
  options:
    - { id: a, text: { en: "One row for each computer that had at least one % Free Space sample below 10 during the last hour, with the lowest value", fr: "Une ligne pour chaque ordinateur ayant eu au moins un échantillon % Free Space inférieur à 10 au cours de la dernière heure, avec la valeur la plus basse" } }
    - { id: b, text: { en: "One row for each % Free Space sample below 10 recorded during the last hour", fr: "Une ligne pour chaque échantillon % Free Space inférieur à 10 enregistré au cours de la dernière heure" } }
    - { id: c, text: { en: "One row for each computer whose average % Free Space during the last hour is below 10", fr: "Une ligne pour chaque ordinateur dont la moyenne de % Free Space au cours de la dernière heure est inférieure à 10" } }
    - { id: d, text: { en: "A single row that contains the number of computers with less than 10 percent free space", fr: "Une seule ligne contenant le nombre d'ordinateurs disposant de moins de 10 % d'espace libre" } }
answer: { optionId: a }
explanation:
  correct:
    en: "`summarize min(CounterValue) by Computer` produces one row per computer with the lowest sample of the hour, across all its disks. The final `where` runs on these aggregated rows and keeps only the computers whose minimum is below 10."
    fr: "`summarize min(CounterValue) by Computer` produit une ligne par ordinateur avec l'échantillon le plus bas de l'heure, tous disques confondus. Le `where` final s'exécute sur ces lignes agrégées et ne conserve que les ordinateurs dont le minimum est inférieur à 10."
  options:
    b:
      en: The summarize operator has already grouped the samples by computer, so individual samples are no longer returned.
      fr: L'opérateur summarize a déjà regroupé les échantillons par ordinateur ; les échantillons individuels ne sont donc plus renvoyés.
    c:
      en: The query uses min(), not avg().
      fr: La requête utilise min(), pas avg().
    d:
      en: Counting computers would require a further summarize count(); the query returns one row per computer.
      fr: Compter les ordinateurs nécessiterait un summarize count() supplémentaire ; la requête renvoie une ligne par ordinateur.
references:
  - title: summarize operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
  - title: Log queries in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-query-overview
