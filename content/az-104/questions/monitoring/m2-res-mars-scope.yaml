id: m2-res-mars-scope
objective: "5.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware has an on-premises server named **SRV1** that runs Windows Server 2022. You plan to install the Microsoft Azure Recovery Services (MARS) agent on SRV1 and register it to a Recovery Services vault.

    Which two types of data can you back up from SRV1 by using the MARS agent? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un serveur local nommé **SRV1** qui exécute Windows Server 2022. Vous prévoyez d'installer l'agent MARS (Microsoft Azure Recovery Services) sur SRV1 et de l'inscrire auprès d'un coffre Recovery Services.

    Quels sont les deux types de données que vous pouvez sauvegarder à partir de SRV1 avec l'agent MARS ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Selected files and folders", fr: "Des fichiers et dossiers sélectionnés" } }
    - { id: b, text: { en: "The Windows system state", fr: "L'état du système Windows" } }
    - { id: c, text: { en: "An application-consistent backup of a SQL Server database that uses the SQL Server VSS writer", fr: "Une sauvegarde cohérente avec les applications d'une base SQL Server qui utilise l'enregistreur VSS de SQL Server" } }
    - { id: d, text: { en: "A full image of SRV1 that can be restored directly as an Azure virtual machine", fr: "Une image complète de SRV1 restaurable directement en tant que machine virtuelle Azure" } }
    - { id: e, text: { en: "An Azure Files share mounted on SRV1", fr: "Un partage Azure Files monté sur SRV1" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The MARS agent protects Windows files and folders, entire Windows volumes and the Windows system state, and sends the backups to a Recovery Services vault.
    fr: L'agent MARS protège des fichiers et dossiers Windows, des volumes Windows entiers et l'état du système Windows, et envoie les sauvegardes vers un coffre Recovery Services.
  options:
    c:
      en: The MARS agent uses only the Windows System Writer and does not use application VSS writers, so it does not take app-consistent database backups.
      fr: L'agent MARS n'utilise que l'enregistreur système Windows (System Writer) et pas les enregistreurs VSS des applications ; il ne réalise donc pas de sauvegardes de bases de données cohérentes avec les applications.
    d:
      en: MARS does not create a VM image that is restored as an Azure VM; replicating servers to Azure as VMs is a Site Recovery scenario.
      fr: MARS ne crée pas d'image restaurable comme machine virtuelle Azure ; répliquer des serveurs vers Azure sous forme de machines virtuelles relève de Site Recovery.
    e:
      en: Azure Files shares are protected natively by Azure Backup with snapshot or vaulted backups, not by the MARS agent.
      fr: Les partages Azure Files sont protégés nativement par Sauvegarde Azure avec des sauvegardes d'instantanés ou en coffre, pas par l'agent MARS.
references:
  - title: About the MARS agent
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-about-mars
