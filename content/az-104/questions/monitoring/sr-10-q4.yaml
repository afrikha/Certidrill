id: sr-10-q4
objective: "5.2.4"
type: series_yesno
series: sr-10-cross-region-restore
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You use a zone-redundant Recovery Services vault in East US.
  fr: |
    Vous utilisez un coffre Recovery Services redondant interzone dans East US.
body:
  solution:
    en: |
      You create a Recovery Services vault in **East US** and, before protecting any item, set the storage replication type to **Zone-redundant**. You enable backup for VM1 with a policy that runs a daily backup and retains daily recovery points for 30 days.
    fr: |
      Vous créez un coffre Recovery Services dans **East US** et, avant de protéger un élément, définissez le type de réplication de stockage sur **Redondant interzone**. Vous activez la sauvegarde de VM1 avec une stratégie qui effectue une sauvegarde quotidienne et conserve les points de récupération quotidiens pendant 30 jours.
answer: { value: false }
explanation:
  correct:
    en: |
      Zone-redundant storage keeps the backup data in the availability zones of East US only, with no copy in West US. Cross Region Restore is supported only for vaults that use GRS, so VM1 can't be restored in West US and the goal isn't met.
    fr: |
      Le stockage redondant interzone conserve les données de sauvegarde uniquement dans les zones de disponibilité d'East US, sans copie dans West US. La restauration interrégion n'est prise en charge que pour les coffres qui utilisent GRS : VM1 ne peut pas être restaurée dans West US et l'objectif n'est pas atteint.
references:
  - title: "Create and configure Recovery Services vaults"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
