id: sr-09-q4
objective: "5.1.4"
type: series_yesno
series: sr-09-cpu-alert
seriesOrder: 4
difficulty: 3
status: draft
stem:
  en: |
    You collect the processor counter in Workspace1 and create a log search alert rule.
  fr: |
    Vous collectez le compteur du processeur dans Workspace1 et créez une règle d'alerte de recherche dans les journaux.
body:
  solution:
    en: |
      You install the **Azure Monitor Agent** on VM1 and create a **data collection rule** that sends the `\Processor(_Total)\% Processor Time` performance counter every 60 seconds to Workspace1. You then create a **log search alert rule** on Workspace1 that runs every 5 minutes and uses the following query, with the measure `AvgCPU` (aggregation **Average**), the condition **Greater than 85**, and an action group that emails `ops@contoso.com`:

      ```kusto
      Perf
      | where Computer startswith "VM1" and ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total"
      | summarize AvgCPU = avg(CounterValue) by bin(TimeGenerated, 5m)
      ```
    fr: |
      Vous installez l'**agent Azure Monitor** sur VM1 et créez une **règle de collecte de données** qui envoie le compteur de performances `\Processor(_Total)\% Processor Time` toutes les 60 secondes vers Workspace1. Vous créez ensuite sur Workspace1 une **règle d'alerte de recherche dans les journaux** qui s'exécute toutes les 5 minutes et utilise la requête suivante, avec la mesure `AvgCPU` (agrégation **Average**), la condition **Greater than 85** et un groupe d'actions qui envoie un e-mail à `ops@contoso.com` :

      ```kusto
      Perf
      | where Computer startswith "VM1" and ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total"
      | summarize AvgCPU = avg(CounterValue) by bin(TimeGenerated, 5m)
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The Azure Monitor Agent and the data collection rule send the guest processor counter to the Perf table of Workspace1. A log search alert can calculate a numeric column such as CPU percentage, so the rule computes the 5-minute average and fires above 85, and the action group sends the email. This approach needs more configuration than a metric alert, but the goal sets no effort or latency constraint, so it is met.
    fr: |
      L'agent Azure Monitor et la règle de collecte de données envoient le compteur du processeur invité vers la table Perf de Workspace1. Une alerte de recherche dans les journaux peut calculer une colonne numérique comme le pourcentage d'utilisation du processeur : la règle calcule la moyenne sur 5 minutes et se déclenche au-delà de 85, et le groupe d'actions envoie l'e-mail. Cette approche demande plus de configuration qu'une alerte de métrique, mais l'objectif ne fixe aucune contrainte d'effort ni de latence : il est atteint.
