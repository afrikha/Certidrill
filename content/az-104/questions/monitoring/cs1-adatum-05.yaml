id: cs1-adatum-05
objective: "5.1.2"
type: single
caseStudy: cs1-adatum
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the activity log retention requirement for Sub-Fin-Prod.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de rétention du journal d'activité de Sub-Fin-Prod.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting for the activity log of Sub-Fin-Prod that sends all the categories to stadatumlogs", fr: "Créer un paramètre de diagnostic pour le journal d'activité de Sub-Fin-Prod qui envoie toutes les catégories vers stadatumlogs" } }
    - { id: b, text: { en: "Change the retention of the activity log of Sub-Fin-Prod from 90 days to 2,555 days", fr: "Faire passer la rétention du journal d'activité de Sub-Fin-Prod de 90 jours à 2 555 jours" } }
    - { id: c, text: { en: "Install the Azure Monitor Agent on every VM and create a data collection rule that targets stadatumlogs", fr: "Installer l'agent Azure Monitor sur chaque machine virtuelle et créer une règle de collecte de données qui cible stadatumlogs" } }
    - { id: d, text: { en: "Create an activity log alert rule with an action group that emails the compliance department", fr: "Créer une règle d'alerte de journal d'activité avec un groupe d'actions qui envoie un e-mail au service conformité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure keeps activity log events for 90 days only, and this retention cannot be changed. To keep them longer, you create a diagnostic setting on the subscription's activity log that routes the events to a destination such as a storage account, where they are written to the insights-activity-logs container and can be retained as long as needed.
    fr: |
      Azure conserve les événements du journal d'activité pendant 90 jours seulement, et cette rétention ne peut pas être modifiée. Pour les conserver plus longtemps, vous créez un paramètre de diagnostic sur le journal d'activité de l'abonnement, qui envoie les événements vers une destination comme un compte de stockage, où ils sont écrits dans le conteneur insights-activity-logs et peuvent être conservés aussi longtemps que nécessaire.
  options:
    b: { en: "The 90-day retention of the activity log is fixed; a diagnostic setting is required for longer retention.", fr: "La rétention de 90 jours du journal d'activité est fixe ; un paramètre de diagnostic est nécessaire pour une rétention plus longue." }
    c: { en: "The Azure Monitor Agent collects guest OS data from VMs, not the subscription activity log.", fr: "L'agent Azure Monitor collecte des données du système d'exploitation invité des machines virtuelles, pas le journal d'activité de l'abonnement." }
    d: { en: "An alert notifies about events but does not store them.", fr: "Une alerte signale des événements mais ne les stocke pas." }
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings
