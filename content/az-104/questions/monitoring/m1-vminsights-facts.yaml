id: m1-vminsights-facts
objective: "5.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to monitor its Azure virtual machines and 30 on-premises servers by using VM insights. New deployments will use the OpenTelemetry metrics experience recommended by Microsoft.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de surveiller ses machines virtuelles Azure et 30 serveurs locaux avec VM Insights. Les nouveaux déploiements utiliseront l'expérience de métriques OpenTelemetry recommandée par Microsoft.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Before you enable monitoring on the on-premises servers, you must install the Azure Connected Machine agent so that they become Azure Arc-enabled servers.
        fr: Avant d'activer la supervision sur les serveurs locaux, vous devez installer l'agent Azure Connected Machine pour qu'ils deviennent des serveurs Azure Arc.
    - id: s2
      text:
        en: With the OpenTelemetry metrics experience, the guest performance data is stored in the InsightsMetrics table of a Log Analytics workspace.
        fr: Avec l'expérience de métriques OpenTelemetry, les données de performances invitées sont stockées dans la table InsightsMetrics d'un espace de travail Log Analytics.
    - id: s3
      text:
        en: A single installation of the Azure Monitor Agent on a machine can use several data collection rules.
        fr: Une même installation de l'agent Azure Monitor sur une machine peut utiliser plusieurs règles de collecte de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Machines outside Azure must first be connected to Azure Arc with the Connected Machine agent before the Azure Monitor Agent can be installed. The OpenTelemetry metrics experience stores its metrics in an Azure Monitor workspace; the InsightsMetrics table is used by the classic logs-based experience. The agent is installed once and can be associated with any number of DCRs.
    fr: Les machines situées hors d'Azure doivent d'abord être connectées à Azure Arc avec l'agent Connected Machine avant de pouvoir installer l'agent Azure Monitor. L'expérience de métriques OpenTelemetry stocke ses métriques dans un espace de travail Azure Monitor ; la table InsightsMetrics est utilisée par l'expérience classique basée sur les journaux. L'agent s'installe une seule fois et peut être associé à un nombre quelconque de DCR.
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
