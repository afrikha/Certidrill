id: sr-09-q2
objective: "5.1.4"
type: series_yesno
series: sr-09-cpu-alert
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You create a metric alert rule on the Percentage CPU metric of VM1.
  fr: |
    Vous créez une règle d'alerte de métrique sur la métrique Percentage CPU de VM1.
body:
  solution:
    en: |
      You create a **metric alert rule** on VM1 with the condition **Percentage CPU**, aggregation **Average**, operator **Greater than**, threshold **85**, and an aggregation granularity (lookback period) of **5 minutes**. You attach an **action group** that sends an email notification to `ops@contoso.com`.
    fr: |
      Vous créez sur VM1 une **règle d'alerte de métrique** avec la condition **Percentage CPU**, l'agrégation **Average**, l'opérateur **Greater than**, le seuil **85** et une granularité d'agrégation (période de recherche) de **5 minutes**. Vous y attachez un **groupe d'actions** qui envoie une notification par e-mail à `ops@contoso.com`.
answer: { value: true }
explanation:
  correct:
    en: |
      Percentage CPU is a platform metric of the virtual machine, collected without any agent. The metric alert rule evaluates its average over 5-minute windows and fires when it exceeds 85, and the action group sends the email. Every part of the goal is met.
    fr: |
      Percentage CPU est une métrique de plateforme de la machine virtuelle, collectée sans agent. La règle d'alerte de métrique évalue sa moyenne sur des fenêtres de 5 minutes et se déclenche lorsqu'elle dépasse 85, et le groupe d'actions envoie l'e-mail. Toutes les parties de l'objectif sont atteintes.
references:
  - title: "Types of Azure Monitor alerts"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
