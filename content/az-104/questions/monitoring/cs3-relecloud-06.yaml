id: cs3-relecloud-06
objective: "5.1.1"
type: dropdown
caseStudy: cs3-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to configure a chart in Metrics Explorer for stmediavod to meet the monitoring requirement.

    How should you configure the chart? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer un graphique dans Metrics Explorer pour stmediavod afin de satisfaire l'exigence de supervision.

    Comment devez-vous configurer le graphique ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Metric: [[metric]]
      Aggregation: [[agg]]
      Apply splitting by the dimension: [[split]]
    fr: |
      Métrique : [[metric]]
      Agrégation : [[agg]]
      Appliquer le fractionnement par la dimension : [[split]]
  slots:
    - id: metric
      options:
        - { id: tx, text: Transactions }
        - { id: avail, text: Availability }
        - { id: egress, text: Egress }
        - { id: lat, text: Success E2E Latency }
    - id: agg
      options:
        - { id: sum, text: Sum }
        - { id: avg, text: Avg }
        - { id: max, text: Max }
    - id: split
      options:
        - { id: resp, text: ResponseType }
        - { id: api, text: ApiName }
        - { id: geo, text: GeoType }
        - { id: auth, text: Authentication }
answer:
  values: { metric: tx, agg: sum, split: resp }
explanation:
  correct:
    en: "The Transactions metric counts successful and failed requests, and its aggregation is Sum. Splitting by the ResponseType dimension shows one line per response type, such as Success, ServerBusyError or ClientAccountRequestThrottlingError, which separates throttled requests from successful ones."
    fr: "La métrique Transactions compte les requêtes réussies et en échec, et son agrégation est Sum. Le fractionnement par la dimension ResponseType affiche une ligne par type de réponse, par exemple Success, ServerBusyError ou ClientAccountRequestThrottlingError, ce qui distingue les requêtes limitées des requêtes réussies."
  options:
    avail: { en: "Availability is a percentage and doesn't have the ResponseType dimension.", fr: "Availability est un pourcentage et ne possède pas la dimension ResponseType." }
    api: { en: "ApiName groups requests by operation, not by type of response.", fr: "ApiName regroupe les requêtes par opération, pas par type de réponse." }
references:
  - title: "Azure Blob Storage Monitoring Metrics and Logs Reference"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage-reference
