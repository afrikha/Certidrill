id: sr-10-q2
objective: "5.2.4"
type: series_yesno
series: sr-10-cross-region-restore
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You use a GRS Recovery Services vault in East US without Cross Region Restore.
  fr: |
    Vous utilisez un coffre Recovery Services GRS dans East US sans restauration interrégion.
body:
  solution:
    en: |
      You create a Recovery Services vault in **East US** with the storage replication type **Geo-redundant**, leaving **Cross Region Restore disabled**. You enable backup for VM1 with a policy that runs a daily backup and retains daily recovery points for 30 days.
    fr: |
      Vous créez un coffre Recovery Services dans **East US** avec le type de réplication de stockage **Géoredondant**, en laissant la **restauration interrégion désactivée**. Vous activez la sauvegarde de VM1 avec une stratégie qui effectue une sauvegarde quotidienne et conserve les points de récupération quotidiens pendant 30 jours.
answer: { value: false }
explanation:
  correct:
    en: |
      The backup data is replicated to West US, but that copy isn't available for you to restore from while East US is healthy. Cross Region Restore is the vault option that lets you restore in the secondary region at any time, even when there is no outage. Without it, drills in West US aren't possible, so the goal isn't met.
    fr: |
      Les données de sauvegarde sont répliquées dans West US, mais cette copie n'est pas disponible pour une restauration tant qu'East US fonctionne normalement. La restauration interrégion est l'option du coffre qui permet de restaurer dans la région secondaire à tout moment, même en l'absence de panne. Sans elle, les exercices dans West US ne sont pas possibles : l'objectif n'est pas atteint.
references:
  - title: "Restore VMs by using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
