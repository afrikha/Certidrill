id: m1-nw-nsg-rule-tools
objective: "5.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Users cannot connect to a web application hosted on a virtual machine named **VM1** on TCP port 8443. Network security groups are associated with both the subnet and the network interface of VM1.

    You need to determine whether the inbound traffic on TCP 8443 is allowed or denied and identify the security rule responsible.

    Which two Network Watcher tools can you use? Each correct answer presents a complete solution.
  fr: |
    Les utilisateurs ne parviennent pas à se connecter à une application web hébergée sur une machine virtuelle nommée **VM1** sur le port TCP 8443. Des groupes de sécurité réseau sont associés à la fois au sous-réseau et à l'interface réseau de VM1.

    Vous devez déterminer si le trafic entrant sur TCP 8443 est autorisé ou refusé et identifier la règle de sécurité responsable.

    Quels sont les deux outils de Network Watcher que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: IP flow verify, fr: Vérification des flux IP } }
    - { id: b, text: { en: NSG diagnostics, fr: Diagnostics NSG } }
    - { id: c, text: { en: Next hop, fr: Tronçon suivant } }
    - { id: d, text: { en: VPN troubleshoot, fr: Résolution des problèmes de VPN } }
    - { id: e, text: { en: Topology, fr: Topologie } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: IP flow verify checks whether a packet is allowed or denied to or from a VM and names the security rule that allowed or denied it. NSG diagnostics performs the same kind of evaluation for a VM, a scale set or an application gateway, across the NSGs that apply, and also returns the rule that decides.
    fr: La vérification des flux IP contrôle si un paquet est autorisé ou refusé à destination ou en provenance d'une machine virtuelle et indique la règle de sécurité qui l'a autorisé ou refusé. Les diagnostics NSG réalisent le même type d'évaluation pour une machine virtuelle, un groupe de machines virtuelles identiques ou une passerelle d'application, sur les NSG qui s'appliquent, et renvoient aussi la règle décisive.
  options:
    c: { en: Next hop diagnoses routing, not traffic filtering., fr: Le tronçon suivant diagnostique le routage, pas le filtrage du trafic. }
    d: { en: VPN troubleshoot diagnoses virtual network gateways., fr: La résolution des problèmes de VPN diagnostique les passerelles de réseau virtuel. }
    e: { en: Topology visualizes resources and their relationships; it does not evaluate rules., fr: La topologie visualise les ressources et leurs relations ; elle n'évalue pas les règles. }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - title: Azure Network Watcher overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
