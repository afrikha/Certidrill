id: cs2-alpineski-03
objective: "5.2.6"
type: ordering
caseStudy: cs2-alpineski
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the disaster recovery requirements for VM-BOOK1, including the first quarterly drill.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire les exigences de récupération d'urgence de VM-BOOK1, y compris le premier exercice trimestriel.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: vault, text: { en: "Create a Recovery Services vault in Switzerland West.", fr: "Créer un coffre Recovery Services dans Switzerland West." } }
    - { id: repl, text: { en: "Enable replication of VM-BOOK1 to Switzerland West.", fr: "Activer la réplication de VM-BOOK1 vers Switzerland West." } }
    - { id: test, text: { en: "Run a test failover of VM-BOOK1 to VNet-DR-Test.", fr: "Exécuter un test de basculement de VM-BOOK1 vers VNet-DR-Test." } }
    - { id: cleanup, text: { en: "Clean up the test failover.", fr: "Nettoyer le test de basculement." } }
    - { id: vaultsrc, text: { en: "Create a Recovery Services vault in Switzerland North.", fr: "Créer un coffre Recovery Services dans Switzerland North." } }
    - { id: failover, text: { en: "Run a failover of VM-BOOK1 and commit it.", fr: "Exécuter un basculement de VM-BOOK1 et le valider." } }
    - { id: reprotect, text: { en: "Re-protect VM-BOOK1.", fr: "Reprotéger VM-BOOK1." } }
answer:
  sequence: [vault, repl, test, cleanup]
explanation:
  correct:
    en: |
      For Azure-to-Azure disaster recovery, the vault must be in a region other than the source region, typically the target region. After replication is enabled, a test failover creates a copy of VM-BOOK1 in the isolated VNet-DR-Test without stopping replication or affecting production. Cleaning up the test failover deletes the test virtual machine.
    fr: |
      Pour la récupération d'urgence d'Azure vers Azure, le coffre doit se trouver dans une région autre que la région source, en général la région cible. Une fois la réplication activée, un test de basculement crée une copie de VM-BOOK1 dans le réseau isolé VNet-DR-Test sans arrêter la réplication ni affecter la production. Le nettoyage du test de basculement supprime la machine virtuelle de test.
  options:
    vaultsrc: { en: "The Site Recovery vault cannot be in the source region of the replicated virtual machine.", fr: "Le coffre Site Recovery ne peut pas se trouver dans la région source de la machine virtuelle répliquée." }
    failover: { en: "A real failover moves production to Switzerland West, which the drill must not do.", fr: "Un vrai basculement déplace la production vers Switzerland West, ce que l'exercice ne doit pas faire." }
    reprotect: { en: "Re-protection is needed only after a real failover.", fr: "La reprotection n'est nécessaire qu'après un vrai basculement." }
references:
  - title: Tutorial to set up Azure VM disaster recovery with Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication
  - title: Run a disaster recovery drill for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-dr-drill
