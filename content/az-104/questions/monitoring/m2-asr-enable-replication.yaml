id: m2-asr-enable-replication
objective: "5.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have five Azure virtual machines in a resource group named **RG-App** in West Europe. The virtual machines have outbound connectivity to the required Site Recovery endpoints.

    You need to configure disaster recovery of the virtual machines to North Europe by using Azure Site Recovery with the default target settings.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de cinq machines virtuelles Azure dans un groupe de ressources nommé **RG-App** dans West Europe. Les machines virtuelles disposent d'une connectivité sortante vers les points de terminaison Site Recovery requis.

    Vous devez configurer la récupération d'urgence des machines virtuelles vers North Europe avec Azure Site Recovery et les paramètres cibles par défaut.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: vault, text: { en: Create a Recovery Services vault in North Europe., fr: Créer un coffre Recovery Services dans North Europe. } }
    - { id: source, text: { en: "In the vault, select **Enable replication** for Azure virtual machines and select West Europe, the subscription and RG-App as the source.", fr: "Dans le coffre, sélectionner **Activer la réplication** pour les machines virtuelles Azure et choisir West Europe, l'abonnement et RG-App comme source." } }
    - { id: vms, text: { en: Select the five virtual machines., fr: Sélectionner les cinq machines virtuelles. } }
    - { id: settings, text: { en: "Review the replication settings: target region, target resource group, target virtual network and cache storage.", fr: "Vérifier les paramètres de réplication : région cible, groupe de ressources cible, réseau virtuel cible et stockage de cache." } }
    - { id: policy, text: { en: Select the replication policy, and then select **Enable replication**., fr: "Sélectionner la stratégie de réplication, puis **Activer la réplication**." } }
    - { id: mobility, text: { en: Install the Mobility service manually on each virtual machine., fr: Installer manuellement le service Mobilité sur chaque machine virtuelle. } }
    - { id: vaultwe, text: { en: Create a Recovery Services vault in West Europe., fr: Créer un coffre Recovery Services dans West Europe. } }
answer:
  sequence: [vault, source, vms, settings, policy]
explanation:
  correct:
    en: You create the vault outside the source region, then use Enable replication to choose the source, select the VMs, review the target settings that Site Recovery creates by default, and pick the replication policy. When replication is enabled, the Mobility service extension is installed automatically on each Azure VM.
    fr: Vous créez le coffre hors de la région source, puis utilisez Activer la réplication pour choisir la source, sélectionner les machines virtuelles, vérifier les paramètres cibles que Site Recovery crée par défaut et choisir la stratégie de réplication. À l'activation de la réplication, l'extension du service Mobilité est installée automatiquement sur chaque machine virtuelle Azure.
  options:
    mobility: { en: For Azure VMs, the Mobility service extension is installed automatically when you enable replication., fr: "Pour les machines virtuelles Azure, l'extension du service Mobilité est installée automatiquement à l'activation de la réplication." }
    vaultwe: { en: The vault must be in a region other than the source region., fr: Le coffre doit se trouver dans une autre région que la région source. }
references:
  - title: Tutorial to set up Azure VM disaster recovery with Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication
