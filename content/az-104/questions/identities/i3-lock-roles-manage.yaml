id: i3-lock-roles-manage
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A storage account named **stfinance01** has a Delete lock. A member of the operations team must be able to remove the lock before a planned decommissioning. You plan to assign one built-in role to that user on stfinance01.

    Which two roles allow the user to remove the lock? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **stfinance01** a un verrou Suppression. Un membre de l'équipe d'exploitation doit pouvoir supprimer ce verrou avant une mise hors service planifiée. Vous prévoyez d'attribuer un rôle intégré à cet utilisateur sur stfinance01.

    Quels sont les deux rôles qui permettent à l'utilisateur de supprimer le verrou ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Owner }
    - { id: b, text: User Access Administrator }
    - { id: c, text: Contributor }
    - { id: d, text: Storage Account Contributor }
    - { id: e, text: Reader }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Creating or deleting management locks requires the `Microsoft.Authorization/*` or `Microsoft.Authorization/locks/*` actions. The Owner and User Access Administrator roles include them.
    fr: "La création ou la suppression de verrous de gestion exige les actions `Microsoft.Authorization/*` ou `Microsoft.Authorization/locks/*`. Les rôles Owner et User Access Administrator les incluent."
  options:
    c: { en: "Contributor excludes write and delete operations on Microsoft.Authorization, so it cannot manage locks.", fr: "Contributor exclut les opérations d'écriture et de suppression sur Microsoft.Authorization : il ne peut pas gérer les verrous." }
    d: { en: "Storage Account Contributor manages storage accounts but has no permission on locks.", fr: "Storage Account Contributor gère les comptes de stockage mais n'a aucune autorisation sur les verrous." }
    e: { en: "Reader can only view resources and locks.", fr: "Reader peut seulement consulter les ressources et les verrous." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
