id: i3-policy-donotenforce-test
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a custom policy definition named **Deny-Unapproved-SKUs** whose effect is set to `deny` (the effect is not parameterized). You plan to assign it to a subscription named **Sub-Prod**.

    Before enforcing it, you need to see which existing resources would be non-compliant, without blocking any deployment and without modifying the policy definition.

    What should you do?
  fr: |
    Proseware dispose d'une définition de stratégie personnalisée nommée **Deny-Unapproved-SKUs** dont l'effet est `deny` (l'effet n'est pas paramétré). Vous prévoyez de l'attribuer à un abonnement nommé **Sub-Prod**.

    Avant de l'appliquer, vous devez voir quelles ressources existantes seraient non conformes, sans bloquer aucun déploiement et sans modifier la définition de stratégie.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the definition with the enforcement mode set to Disabled (DoNotEnforce).", fr: "Attribuer la définition avec le mode d'application défini sur Désactivé (DoNotEnforce)." } }
    - { id: b, text: { en: "Assign the definition and add Sub-Prod to the excluded scopes.", fr: "Attribuer la définition et ajouter Sub-Prod aux étendues exclues." } }
    - { id: c, text: { en: "Assign the definition and create a Waiver exemption for Sub-Prod.", fr: "Attribuer la définition et créer une exemption Waiver pour Sub-Prod." } }
    - { id: d, text: { en: "Assign the definition to a resource group in Sub-Prod instead of the subscription.", fr: "Attribuer la définition à un groupe de ressources de Sub-Prod au lieu de l'abonnement." } }
answer: { optionId: a }
explanation:
  correct:
    en: With enforcementMode set to DoNotEnforce, the assignment is evaluated and compliance results are reported, but the deny effect is not applied during resource creation or update. This mode is designed to test the impact of an assignment before enforcing it.
    fr: "Avec enforcementMode défini sur DoNotEnforce, l'attribution est évaluée et les résultats de conformité sont remontés, mais l'effet deny n'est pas appliqué lors de la création ou de la mise à jour des ressources. Ce mode est conçu pour tester l'impact d'une attribution avant de l'appliquer."
  options:
    b: { en: "Excluding the whole scope removes every resource from evaluation, so you get no compliance data.", fr: "Exclure toute l'étendue retire toutes les ressources de l'évaluation : vous n'obtenez aucune donnée de conformité." }
    c: { en: "Exempt resources are reported as Exempt rather than evaluated, so you would not see which ones are non-compliant.", fr: "Les ressources exemptées sont signalées comme exemptées au lieu d'être évaluées : vous ne verriez pas lesquelles sont non conformes." }
    d: { en: "The deny effect would still block deployments in that resource group, and other resources would not be evaluated.", fr: "L'effet deny bloquerait toujours les déploiements dans ce groupe de ressources, et les autres ressources ne seraient pas évaluées." }
references:
  - title: Details of the policy assignment structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
