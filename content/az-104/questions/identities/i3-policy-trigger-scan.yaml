id: i3-policy-trigger-scan
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys assigned an audit policy to a resource group named **RG-Kiosk** last week. This morning, an administrator fixed several non-compliant resources in RG-Kiosk. You need the compliance results in the Azure portal to reflect the changes as soon as possible, instead of waiting for the standard evaluation cycle.

    Which command should you run?
  fr: |
    Wingtip Toys a attribué une stratégie d'audit à un groupe de ressources nommé **RG-Kiosk** la semaine dernière. Ce matin, un administrateur a corrigé plusieurs ressources non conformes de RG-Kiosk. Vous devez faire en sorte que les résultats de conformité du portail Azure reflètent les changements le plus vite possible, au lieu d'attendre le cycle d'évaluation standard.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az policy state trigger-scan --resource-group RG-Kiosk" }
    - { id: b, text: "az policy event list --resource-group RG-Kiosk" }
    - { id: c, text: "az policy state list --resource-group RG-Kiosk" }
    - { id: d, text: "az policy state summarize --resource-group RG-Kiosk" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Policy runs a standard compliance evaluation every 24 hours. `az policy state trigger-scan` (or `Start-AzPolicyComplianceScan` in PowerShell) starts an on-demand evaluation for the subscription or the resource group, so the compliance state is refreshed without waiting.
    fr: "Azure Policy exécute une évaluation de conformité standard toutes les 24 heures. `az policy state trigger-scan` (ou `Start-AzPolicyComplianceScan` en PowerShell) lance une évaluation à la demande pour l'abonnement ou le groupe de ressources : l'état de conformité est actualisé sans attendre."
  options:
    b: { en: "event list returns the policy events already recorded; it does not start a new evaluation.", fr: "event list renvoie les événements de stratégie déjà enregistrés ; il ne lance pas de nouvelle évaluation." }
    c: { en: "state list returns the existing compliance records; it does not start a new evaluation.", fr: "state list renvoie les enregistrements de conformité existants ; il ne lance pas de nouvelle évaluation." }
    d: { en: "state summarize only reads the current compliance results; it does not start a new evaluation.", fr: "state summarize lit seulement les résultats de conformité actuels ; il ne lance pas de nouvelle évaluation." }
references:
  - title: Get policy compliance data
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/get-compliance-data
