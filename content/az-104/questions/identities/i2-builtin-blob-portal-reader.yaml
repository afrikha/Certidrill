id: i2-builtin-blob-portal-reader
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a storage account named **stnwreports** that contains a blob container named **monthly**. No role is currently assigned to a user named Analyst1 at any scope.

    Analyst1 must browse to the **monthly** container in the Azure portal and download blobs by using Microsoft Entra authorization. Analyst1 must not be able to modify blobs or the storage account, and must not be able to retrieve the storage account access keys. The solution must follow the principle of least privilege.

    Which two roles should you assign to Analyst1? Each correct answer presents part of the solution.
  fr: |
    Northwind Traders dispose d'un compte de stockage nommé **stnwreports** qui contient un conteneur d'objets blob nommé **monthly**. Aucun rôle n'est actuellement attribué à un utilisateur nommé Analyst1, quelle que soit l'étendue.

    Analyst1 doit accéder au conteneur **monthly** dans le portail Azure et télécharger des blobs en utilisant l'autorisation Microsoft Entra. Analyst1 ne doit pas pouvoir modifier les blobs ni le compte de stockage, et ne doit pas pouvoir récupérer les clés d'accès du compte de stockage. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer à Analyst1 ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: Reader on stnwreports, fr: Reader sur stnwreports } }
    - { id: b, text: { en: Storage Blob Data Reader on the monthly container, fr: Storage Blob Data Reader sur le conteneur monthly } }
    - { id: c, text: { en: Storage Account Contributor on stnwreports, fr: Storage Account Contributor sur stnwreports } }
    - { id: d, text: { en: Reader and Data Access on stnwreports, fr: Reader and Data Access sur stnwreports } }
    - { id: e, text: { en: Storage Blob Data Contributor on the monthly container, fr: Storage Blob Data Contributor sur le conteneur monthly } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: To work with blob data in the portal with Microsoft Entra credentials, a user needs at least the Azure Resource Manager Reader role (control plane, to navigate to the account and its containers) plus a data role such as Storage Blob Data Reader (data plane, to read blobs). Reader alone gives no data access, and the data role alone does not let the user navigate the account in the portal.
    fr: "Pour manipuler des données blob dans le portail avec des informations d'identification Microsoft Entra, un utilisateur a besoin au minimum du rôle Reader d'Azure Resource Manager (plan de contrôle, pour naviguer jusqu'au compte et à ses conteneurs) et d'un rôle de données tel que Storage Blob Data Reader (plan de données, pour lire les blobs). Reader seul ne donne aucun accès aux données, et le rôle de données seul ne permet pas de naviguer dans le compte depuis le portail."
  options:
    c:
      en: Storage Account Contributor manages the account and includes the listKeys action, so the user could retrieve the access keys.
      fr: Storage Account Contributor gère le compte et inclut l'action listKeys ; l'utilisateur pourrait donc récupérer les clés d'accès.
    d:
      en: Reader and Data Access gives read/write access to the data through the storage account keys, which is exactly what must be avoided.
      fr: Reader and Data Access donne un accès en lecture/écriture aux données par les clés du compte de stockage, ce qu'il faut justement éviter.
    e:
      en: Storage Blob Data Contributor also allows writing and deleting blobs, which exceeds the requirement.
      fr: Storage Blob Data Contributor permet aussi d'écrire et de supprimer des blobs, ce qui dépasse le besoin.
references:
  - title: Assign an Azure Role for Blob Data Access - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access
  - title: Authorize access to blob data in the Azure portal - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal
