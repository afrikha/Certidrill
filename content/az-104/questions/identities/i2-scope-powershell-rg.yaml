id: i2-scope-powershell-rg
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription that contains a resource group named **RG-Web**. A user named Dana (`dana@fabrikam.com`) must be able to create and manage the virtual machines in RG-Web. Dana must not be able to manage the virtual networks or storage accounts of RG-Web, and must not have any permission outside RG-Web.

    How should you complete the Azure PowerShell command? Select the appropriate options in the answer area.
  fr: |
    Fabrikam dispose d'un abonnement Azure qui contient un groupe de ressources nommé **RG-Web**. Une utilisatrice nommée Dana (`dana@fabrikam.com`) doit pouvoir créer et gérer les machines virtuelles de RG-Web. Dana ne doit pas pouvoir gérer les réseaux virtuels ni les comptes de stockage de RG-Web, et ne doit disposer d'aucune autorisation en dehors de RG-Web.

    Comment devez-vous compléter la commande Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -SignInName "dana@fabrikam.com" `
      -RoleDefinitionName [[role]] `
      [[scope]]
  slots:
    - id: cmd
      options:
        - { id: new, text: New-AzRoleAssignment }
        - { id: set, text: Set-AzRoleAssignment }
        - { id: newdef, text: New-AzRoleDefinition }
        - { id: grp, text: Add-AzADGroupMember }
    - id: role
      options:
        - { id: vmc, text: "\"Virtual Machine Contributor\"" }
        - { id: contrib, text: "\"Contributor\"" }
        - { id: vmlogin, text: "\"Virtual Machine Administrator Login\"" }
        - { id: netc, text: "\"Network Contributor\"" }
    - id: scope
      options:
        - { id: rgname, text: "-ResourceGroupName \"RG-Web\"" }
        - { id: scopename, text: "-Scope \"RG-Web\"" }
        - { id: resname, text: "-ResourceName \"RG-Web\"" }
        - { id: subscope, text: "-Scope \"/subscriptions/<subscriptionId>\"" }
answer:
  values: { cmd: new, role: vmc, scope: rgname }
explanation:
  correct:
    en: New-AzRoleAssignment creates a role assignment; -SignInName identifies the user by UPN. Virtual Machine Contributor manages VMs but not the virtual network or storage account they connect to. -ResourceGroupName limits the assignment to RG-Web.
    fr: New-AzRoleAssignment crée une attribution de rôle ; -SignInName identifie l'utilisateur par son UPN. Virtual Machine Contributor gère les machines virtuelles, mais pas le réseau virtuel ni le compte de stockage auxquels elles sont connectées. -ResourceGroupName limite l'attribution à RG-Web.
  options:
    set: { en: Set-AzRoleAssignment updates an existing assignment instead of creating one., fr: Set-AzRoleAssignment met à jour une attribution existante au lieu d'en créer une. }
    newdef: { en: New-AzRoleDefinition creates a custom role definition., fr: New-AzRoleDefinition crée une définition de rôle personnalisé. }
    grp: { en: Add-AzADGroupMember adds a member to a Microsoft Entra group., fr: Add-AzADGroupMember ajoute un membre à un groupe Microsoft Entra. }
    contrib: { en: Contributor would also let Dana manage the virtual networks and storage accounts., fr: Contributor permettrait aussi à Dana de gérer les réseaux virtuels et les comptes de stockage. }
    vmlogin: { en: Virtual Machine Administrator Login only allows signing in to VMs; it does not allow creating them., fr: Virtual Machine Administrator Login permet seulement de se connecter aux machines virtuelles ; il ne permet pas de les créer. }
    netc: { en: Network Contributor manages networks, not virtual machines., fr: Network Contributor gère les réseaux, pas les machines virtuelles. }
    scopename: { en: "-Scope expects a full scope ID such as /subscriptions/{id}/resourceGroups/RG-Web, not a bare name.", fr: "-Scope attend un ID d'étendue complet, comme /subscriptions/{id}/resourceGroups/RG-Web, pas un simple nom." }
    resname: { en: -ResourceName identifies a resource and must be used with -ResourceType and -ResourceGroupName., fr: -ResourceName identifie une ressource et doit être utilisé avec -ResourceType et -ResourceGroupName. }
    subscope: { en: The subscription scope would give Dana permissions outside RG-Web., fr: L'étendue de l'abonnement donnerait à Dana des autorisations en dehors de RG-Web. }
references:
  - title: Assign Azure roles using Azure PowerShell - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-powershell
