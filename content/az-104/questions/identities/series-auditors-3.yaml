status: draft
stem:
  en: You assign Contributor and apply a ReadOnly lock.
  fr: Vous attribuez Contributor et appliquez un verrou ReadOnly.
body:
  solution:
    en: You assign the **Contributor** role to the Auditors group on Sub1, and you apply a **ReadOnly** lock to Sub1.
    fr: Vous attribuez le rôle **Contributor** au groupe Auditors sur Sub1, et vous appliquez un verrou **ReadOnly** à Sub1.
answer: { value: false }
explanation:
  correct:
    en: Contributor grants far more than needed, which breaks least privilege, and a ReadOnly lock on the subscription would also prevent every other administrator from changing resources.
    fr: Contributor accorde bien plus que nécessaire, ce qui enfreint le moindre privilège, et un verrou ReadOnly sur l'abonnement empêcherait aussi tous les autres administrateurs de modifier les ressources.
references:
  - title: Lock your resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
