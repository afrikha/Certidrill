id: i2-scope-single-vm
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a resource group named **RG-DB** that contains five virtual machines, including one named **vm-sql01**. An external consultant has a guest account in your Microsoft Entra tenant.

    The consultant must be able to start, stop, resize and reconfigure **vm-sql01 only**. The consultant must not be able to manage the other virtual machines of RG-DB. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un groupe de ressources nommé **RG-DB** qui contient cinq machines virtuelles, dont une nommée **vm-sql01**. Un consultant externe dispose d'un compte invité dans votre locataire Microsoft Entra.

    Le consultant doit pouvoir démarrer, arrêter, redimensionner et reconfigurer **uniquement vm-sql01**. Il ne doit pas pouvoir gérer les autres machines virtuelles de RG-DB. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Virtual Machine Contributor role to the consultant on vm-sql01.", fr: "Attribuer le rôle Virtual Machine Contributor au consultant sur vm-sql01." } }
    - { id: b, text: { en: "Assign the Virtual Machine Contributor role to the consultant on RG-DB.", fr: "Attribuer le rôle Virtual Machine Contributor au consultant sur RG-DB." } }
    - { id: c, text: { en: "Assign the Owner role to the consultant on vm-sql01.", fr: "Attribuer le rôle Owner au consultant sur vm-sql01." } }
    - { id: d, text: { en: "Assign the Virtual Machine Administrator Login role to the consultant on vm-sql01.", fr: "Attribuer le rôle Virtual Machine Administrator Login au consultant sur vm-sql01." } }
answer: { optionId: a }
explanation:
  correct:
    en: You can assign a role at the resource scope, the narrowest of the four levels. Virtual Machine Contributor on vm-sql01 lets the consultant manage that VM only, and guest users can receive Azure role assignments like any other user.
    fr: Vous pouvez attribuer un rôle à l'étendue de la ressource, le plus restreint des quatre niveaux d'étendue. Virtual Machine Contributor sur vm-sql01 permet au consultant de gérer uniquement cette machine virtuelle, et les utilisateurs invités peuvent recevoir des attributions de rôles Azure comme tout autre utilisateur.
  options:
    b:
      en: The resource group scope is inherited by all five VMs of RG-DB.
      fr: L'étendue du groupe de ressources est héritée par les cinq machines virtuelles de RG-DB.
    c:
      en: Owner also lets the consultant assign roles on vm-sql01, which exceeds the requirement.
      fr: Owner permet aussi au consultant d'attribuer des rôles sur vm-sql01, ce qui dépasse le besoin.
    d:
      en: Virtual Machine Administrator Login only allows signing in to the VM; it does not allow resizing or reconfiguring it.
      fr: Virtual Machine Administrator Login permet seulement de se connecter à la machine virtuelle ; il ne permet ni de la redimensionner ni de la reconfigurer.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: Azure built-in roles for Compute - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
