id: i1-029-sspr-pilot-group
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. Self-service password reset (SSPR) is currently disabled.

    You need to enable SSPR only for the members of a security group named **SSPR-Pilot** so that they can test the feature before a wider rollout.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. La réinitialisation de mot de passe en libre-service (SSPR) est actuellement désactivée.

    Vous devez activer SSPR uniquement pour les membres d'un groupe de sécurité nommé **SSPR-Pilot**, afin qu'ils testent la fonctionnalité avant un déploiement plus large.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In Password reset > Properties, set Self service password reset enabled to Selected and choose SSPR-Pilot.", fr: "Dans Réinitialisation du mot de passe > Properties, définir Self service password reset enabled sur Selected et choisir SSPR-Pilot." }
    - id: b
      text: { en: "In Password reset > Properties, set Self service password reset enabled to All, and exclude the other users with a Conditional Access policy.", fr: "Dans Réinitialisation du mot de passe > Properties, définir Self service password reset enabled sur All, puis exclure les autres utilisateurs avec une stratégie d'accès conditionnel." }
    - id: c
      text: { en: "In Password reset > Registration, set Require users to register when signing in to Yes.", fr: "Dans Réinitialisation du mot de passe > Registration, définir Require users to register when signing in sur Yes." }
    - id: d
      text: { en: "In the Authentication methods policy, target the SMS method to SSPR-Pilot.", fr: "Dans la stratégie de méthodes d'authentification, cibler la méthode SMS sur SSPR-Pilot." }
answer: { optionId: a }
explanation:
  correct:
    en: "SSPR can be enabled for None, Selected or All users. Selected lets you choose one Microsoft Entra group (nested groups are supported) for a pilot, before switching to All."
    fr: "SSPR peut être activée pour aucun utilisateur (None), les utilisateurs sélectionnés (Selected) ou tous (All). Selected permet de choisir un groupe Microsoft Entra (les groupes imbriqués sont pris en charge) pour un pilote, avant de passer à All."
  options:
    b: { en: "Conditional Access doesn't define who is enabled for SSPR; All would enable everyone.", fr: "L'accès conditionnel ne définit pas qui est activé pour SSPR ; All activerait tout le monde." }
    c: { en: "Registration settings apply only to users already enabled for SSPR; they don't enable it.", fr: "Les paramètres d'inscription s'appliquent seulement aux utilisateurs déjà activés pour SSPR ; ils ne l'activent pas." }
    d: { en: "Targeting a method controls which methods users can use, not whether SSPR is enabled for them.", fr: "Cibler une méthode contrôle les méthodes utilisables, pas l'activation de SSPR pour les utilisateurs." }
references:
  - title: Enable Microsoft Entra self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
