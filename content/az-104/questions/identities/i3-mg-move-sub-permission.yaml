id: i3-mg-move-sub-permission
objective: "1.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two management groups, **MG-Retail** and **MG-Online**, both directly under the Tenant root group. A subscription named **Sub-Shop** is a child of MG-Retail.

    Admin1 has the Owner role on MG-Retail (inherited by Sub-Shop) and the Contributor role on MG-Online. Admin1 has no role assigned directly on Sub-Shop. When Admin1 tries to move Sub-Shop to MG-Online, the operation fails.

    You need to allow Admin1 to move Sub-Shop to MG-Online. The solution must not grant Admin1 any new permission on MG-Online.

    What should you do?
  fr: |
    Adatum dispose de deux groupes d'administration, **MG-Retail** et **MG-Online**, tous deux directement sous le Groupe racine du locataire. Un abonnement nommé **Sub-Shop** est enfant de MG-Retail.

    Admin1 a le rôle Owner sur MG-Retail (hérité par Sub-Shop) et le rôle Contributor sur MG-Online. Admin1 n'a aucun rôle attribué directement sur Sub-Shop. Lorsqu'Admin1 essaie de déplacer Sub-Shop vers MG-Online, l'opération échoue.

    Vous devez permettre à Admin1 de déplacer Sub-Shop vers MG-Online. La solution ne doit accorder à Admin1 aucune nouvelle autorisation sur MG-Online.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Admin1 the Owner role directly on Sub-Shop.", fr: "Attribuer à Admin1 le rôle Owner directement sur Sub-Shop." } }
    - { id: b, text: { en: "Assign Admin1 the Management Group Contributor role on MG-Retail.", fr: "Attribuer à Admin1 le rôle Management Group Contributor sur MG-Retail." } }
    - { id: c, text: { en: "Assign Admin1 the Resource Policy Contributor role on Sub-Shop.", fr: "Attribuer à Admin1 le rôle Resource Policy Contributor sur Sub-Shop." } }
    - { id: d, text: { en: "Move MG-Online under MG-Retail first.", fr: "Déplacer d'abord MG-Online sous MG-Retail." } }
answer: { optionId: a }
explanation:
  correct:
    en: When the Owner role on a subscription is inherited from its current management group, you can move the subscription only to a management group where you are also Owner, because you would otherwise lose ownership. If you are directly assigned the Owner role on the subscription, you can move it to any management group where you have the Contributor role, which Admin1 already has on MG-Online.
    fr: "Lorsque le rôle Owner sur un abonnement est hérité de son groupe d'administration actuel, vous ne pouvez déplacer l'abonnement que vers un groupe d'administration où vous êtes aussi Owner, sinon vous perdriez la propriété. Si le rôle Owner vous est attribué directement sur l'abonnement, vous pouvez le déplacer vers tout groupe d'administration où vous avez le rôle Contributor, ce dont Admin1 dispose déjà sur MG-Online."
  options:
    b: { en: "Admin1 already has write access on MG-Retail as Owner; the problem is the inherited ownership of Sub-Shop.", fr: "Admin1 a déjà l'accès en écriture sur MG-Retail en tant qu'Owner ; le problème vient de la propriété héritée de Sub-Shop." }
    c: { en: "Resource Policy Contributor manages policies and gives no right to move subscriptions.", fr: "Resource Policy Contributor gère les stratégies et n'accorde aucun droit de déplacement d'abonnement." }
    d: { en: "Placing MG-Online under MG-Retail would make Admin1 inherit the Owner role on MG-Online, which is a new permission, and it changes the hierarchy for every subscription in MG-Online.", fr: "Placer MG-Online sous MG-Retail donnerait à Admin1 le rôle Owner hérité sur MG-Online, ce qui est une nouvelle autorisation, et modifierait la hiérarchie pour tous les abonnements de MG-Online." }
references:
  - title: Organize your resources with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Manage your Azure subscriptions at scale with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage
