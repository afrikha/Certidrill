id: cs1-fabrikam-01
objective: "1.3.1"
type: single
caseStudy: cs1-fabrikam
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the region requirement for the Fabrikam subscriptions. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de régions pour les abonnements Fabrikam. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Allowed locations policy definition to MG-Fabrikam, with West Europe, East US, and Southeast Asia as the allowed locations", fr: "Attribuer la définition de stratégie Allowed locations à MG-Fabrikam, avec West Europe, East US et Southeast Asia comme emplacements autorisés" } }
    - { id: b, text: { en: "Assign the Allowed locations policy definition to Sub-Corp, Sub-Plant-US, and Sub-Plant-APAC", fr: "Attribuer la définition de stratégie Allowed locations à Sub-Corp, Sub-Plant-US et Sub-Plant-APAC" } }
    - { id: c, text: { en: "Assign the Allowed resource types policy definition to MG-Fabrikam", fr: "Attribuer la définition de stratégie Allowed resource types à MG-Fabrikam" } }
    - { id: d, text: { en: "Assign the Allowed locations for resource groups policy definition to MG-Fabrikam, with the three regions", fr: "Attribuer la définition de stratégie Allowed locations for resource groups à MG-Fabrikam, avec les trois régions" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Allowed locations policy denies the creation of resources outside the listed regions. A policy assigned to a management group is inherited by every subscription in its hierarchy, including subscriptions added later to MG-Corp or MG-Plants, so a single assignment to MG-Fabrikam covers the current and future subscriptions.
    fr: |
      La stratégie Allowed locations refuse la création de ressources en dehors des régions listées. Une stratégie attribuée à un groupe d'administration est héritée par tous les abonnements de sa hiérarchie, y compris ceux ajoutés plus tard à MG-Corp ou MG-Plants ; une seule attribution à MG-Fabrikam couvre donc les abonnements actuels et futurs.
  options:
    b: { en: "Assigning the policy to each subscription works today, but every future plant subscription would need its own assignment, which increases administrative effort.", fr: "Attribuer la stratégie à chaque abonnement fonctionne aujourd'hui, mais chaque futur abonnement d'usine nécessiterait sa propre attribution, ce qui augmente l'effort d'administration." }
    c: { en: "Allowed resource types restricts which kinds of resources can be deployed, not the regions where they are deployed.", fr: "Allowed resource types limite les types de ressources pouvant être déployés, pas les régions où ces ressources sont déployées." }
    d: { en: "This definition restricts only the region of the resource groups; resources inside them could still be deployed to other regions.", fr: "Cette définition limite uniquement la région des groupes de ressources ; les ressources qu'ils contiennent pourraient toujours être déployées dans d'autres régions." }
references:
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - title: Organize your resources with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
