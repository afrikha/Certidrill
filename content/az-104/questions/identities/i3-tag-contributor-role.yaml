id: i3-tag-contributor-role
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The finance team at Woodgrove Bank maintains cost allocation tags. A finance analyst must be able to add, change and remove tags on every resource in a subscription named **Sub-Corp** by using Azure PowerShell. The analyst must not be able to change any other setting of the resources. The solution must follow the principle of least privilege.

    Which role should you assign to the analyst on Sub-Corp?
  fr: |
    L'équipe financière de Woodgrove Bank gère les étiquettes de répartition des coûts. Un analyste financier doit pouvoir ajouter, modifier et supprimer des étiquettes sur toutes les ressources d'un abonnement nommé **Sub-Corp** avec Azure PowerShell. L'analyste ne doit pouvoir modifier aucun autre paramètre des ressources. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'analyste sur Sub-Corp ?
body:
  options:
    - { id: a, text: Tag Contributor }
    - { id: b, text: Contributor }
    - { id: c, text: Resource Policy Contributor }
    - { id: d, text: Reader }
answer: { optionId: a }
explanation:
  correct:
    en: Tag Contributor grants write access to the Microsoft.Resources/tags resource type, which lets the user manage tags on any entity without access to the entities themselves. It supports all tag operations through Azure PowerShell and the REST API.
    fr: "Tag Contributor accorde l'accès en écriture au type de ressource Microsoft.Resources/tags, ce qui permet de gérer les étiquettes de n'importe quelle entité sans accès aux entités elles-mêmes. Il prend en charge toutes les opérations sur les étiquettes avec Azure PowerShell et l'API REST."
  options:
    b: { en: "Contributor can tag resources but can also change every other setting, which breaks least privilege.", fr: "Contributor peut étiqueter les ressources mais peut aussi modifier tous les autres paramètres, ce qui contredit le moindre privilège." }
    c: { en: "Resource Policy Contributor manages policy definitions and assignments, not tags.", fr: "Resource Policy Contributor gère les définitions et les attributions de stratégie, pas les étiquettes." }
    d: { en: "Reader can view tags but cannot change them.", fr: "Reader peut consulter les étiquettes mais pas les modifier." }
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
