id: i1-024-reset-redemption
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders invited **jordan@fabrikam.com** as a B2B guest user one year ago. The guest account is a member of several groups and is assigned to three enterprise applications. Jordan has now joined Litware and will sign in with **jordan@litware.com**, but needs exactly the same access.

    You need to let Jordan sign in with the new address while keeping the object ID, group memberships and application assignments of the guest account.

    What should you do?
  fr: |
    Northwind Traders a invité **jordan@fabrikam.com** comme utilisateur invité B2B il y a un an. Le compte invité est membre de plusieurs groupes et attribué à trois applications d'entreprise. Jordan travaille désormais chez Litware et se connectera avec **jordan@litware.com**, mais a besoin exactement des mêmes accès.

    Vous devez permettre à Jordan de se connecter avec la nouvelle adresse tout en conservant l'ID d'objet, les appartenances aux groupes et les attributions d'applications du compte invité.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Update the email of the guest account to the new address, and then select Reset redemption status.", fr: "Remplacer l'adresse e-mail du compte invité par la nouvelle, puis sélectionner Reset redemption status." }
    - id: b
      text: { en: "Delete the guest account and invite jordan@litware.com.", fr: "Supprimer le compte invité et inviter jordan@litware.com." }
    - id: c
      text: { en: "Select Resend invitation on the guest account.", fr: "Sélectionner Resend invitation sur le compte invité." }
    - id: d
      text: { en: "Change the user type of the guest account from Guest to Member.", fr: "Changer le type d'utilisateur du compte invité de Guest en Member." }
answer: { optionId: a }
explanation:
  correct:
    en: "Resetting the redemption status reinvites the user while keeping the object ID, group memberships and app assignments. Add the new address to the mail or other emails property first; after redemption the UPN doesn't change but the user signs in with the new email."
    fr: "La réinitialisation de l'état d'échange réinvite l'utilisateur tout en conservant l'ID d'objet, les appartenances aux groupes et les attributions d'applications. Ajoutez d'abord la nouvelle adresse dans la propriété mail ou les autres adresses e-mail ; après l'échange, l'UPN ne change pas mais l'utilisateur se connecte avec la nouvelle adresse."
  options:
    b: { en: "A new invitation creates a new object without the existing memberships and assignments.", fr: "Une nouvelle invitation crée un nouvel objet sans les appartenances et attributions existantes." }
    c: { en: "Resending applies to invitations that are still pending acceptance; this one was redeemed with the old identity.", fr: "Le renvoi concerne les invitations encore en attente d'acceptation ; celle-ci a déjà été échangée avec l'ancienne identité." }
    d: { en: "The user type only describes the relationship with the organization; it doesn't change the identity used to sign in.", fr: "Le type d'utilisateur décrit seulement la relation avec l'organisation ; il ne change pas l'identité de connexion." }
references:
  - title: Reset guest redemption status
    url: https://learn.microsoft.com/en-us/entra/external-id/reset-redemption-status
