id: sr-02-q2
objective: "1.2.1"
type: series_yesno
series: sr-02-vm-operators
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You assign Contributor to VMOps on RG1 and apply a Delete lock to RG1.
  fr: |
    Vous attribuez Contributor à VMOps sur RG1 et appliquez un verrou Suppression à RG1.
body:
  solution:
    en: |
      You assign the **Contributor** role to the VMOps group at the scope of **RG1**, and you apply a **Delete** (`CanNotDelete`) lock to RG1.
    fr: |
      Vous attribuez le rôle **Contributor** au groupe VMOps à l'étendue de **RG1**, et vous appliquez un verrou **Suppression** (`CanNotDelete`) à RG1.
answer: { value: false }
explanation:
  correct:
    en: |
      The lock prevents deletions, but Contributor still lets VMOps create new resources in RG1 and modify existing ones, for example resize a virtual machine or change its network settings. The requirement that VMOps can't create or modify resources isn't met, and Contributor is far broader than least privilege allows.
    fr: |
      Le verrou empêche les suppressions, mais Contributor permet toujours à VMOps de créer de nouvelles ressources dans RG1 et de modifier celles qui existent, par exemple redimensionner une machine virtuelle ou changer ses paramètres réseau. L'exigence selon laquelle VMOps ne peut ni créer ni modifier de ressources n'est pas respectée, et Contributor est bien plus large que ne le permet le privilège minimum.
references:
  - title: "Lock your Azure resources to protect your infrastructure"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
