id: i3-rg-move-powershell
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys needs to move a Key Vault named **kv-tailspin** from the resource group **RG-Old** in the current subscription to the resource group **RG-Shared** in another subscription of the same tenant. The subscription ID of the target subscription is stored in `$targetSub`.

    How should you complete the Azure PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys doit déplacer un coffre de clés nommé **kv-tailspin** du groupe de ressources **RG-Old** de l'abonnement actuel vers le groupe de ressources **RG-Shared** d'un autre abonnement du même locataire. L'ID de l'abonnement cible est stocké dans `$targetSub`.

    Comment devez-vous compléter le script Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $kv = Get-AzResource -ResourceGroupName 'RG-Old' -Name 'kv-tailspin'

    [[cmd]] -DestinationResourceGroupName 'RG-Shared' `
      [[param]] $targetSub `
      -ResourceId $kv.ResourceId
  slots:
    - id: cmd
      options:
        - { id: move, text: Move-AzResource }
        - { id: set, text: Set-AzResource }
        - { id: invoke, text: Invoke-AzResourceAction }
        - { id: newrg, text: New-AzResourceGroup }
    - id: param
      options:
        - { id: destsub, text: -DestinationSubscriptionId }
        - { id: sub, text: -SubscriptionId }
        - { id: tenant, text: -TenantId }
        - { id: scope, text: -Scope }
answer:
  values: { cmd: move, param: destsub }
explanation:
  correct:
    en: "`Move-AzResource` moves existing resources to another resource group. To target a resource group in another subscription, you add the `-DestinationSubscriptionId` parameter. Both subscriptions must be in the same Microsoft Entra tenant."
    fr: "`Move-AzResource` déplace des ressources existantes vers un autre groupe de ressources. Pour cibler un groupe de ressources d'un autre abonnement, vous ajoutez le paramètre `-DestinationSubscriptionId`. Les deux abonnements doivent appartenir au même locataire Microsoft Entra."
  options:
    set: { en: "Set-AzResource modifies the properties of a resource; it does not move it.", fr: "Set-AzResource modifie les propriétés d'une ressource ; il ne la déplace pas." }
    invoke: { en: "Invoke-AzResourceAction can call validateMoveResources to test a move, but it does not take these parameters.", fr: "Invoke-AzResourceAction peut appeler validateMoveResources pour tester un déplacement, mais il n'accepte pas ces paramètres." }
    tenant: { en: "The move stays in the same tenant; the destination is identified by its subscription ID.", fr: "Le déplacement reste dans le même locataire ; la destination est identifiée par son ID d'abonnement." }
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
