id: i1-016-set-mguserlicense
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Entra tenant with a Microsoft 365 E5 subscription (SKU part number **SPE_E5**). The user **omar@fabrikam.com** already has a usage location and no license.

    You need to directly assign a Microsoft 365 E5 license to the user by using Microsoft Graph PowerShell.

    How should you complete the script? Select the appropriate options in the answer area.
  fr: |
    Fabrikam dispose d'un locataire Microsoft Entra avec un abonnement Microsoft 365 E5 (référence **SPE_E5**). L'utilisateur **omar@fabrikam.com** a déjà un emplacement d'utilisation et aucune licence.

    Vous devez attribuer directement une licence Microsoft 365 E5 à l'utilisateur avec Microsoft Graph PowerShell.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    Connect-MgGraph -Scopes User.ReadWrite.All, Organization.Read.All
    $e5Sku = [[getsku]] -All | Where SkuPartNumber -eq 'SPE_E5'
    [[cmd]] -UserId "omar@fabrikam.com" [[add]] @{SkuId = $e5Sku.SkuId} -RemoveLicenses @()
  slots:
    - id: getsku
      options:
        - { id: subscribed, text: Get-MgSubscribedSku }
        - { id: detail, text: Get-MgUserLicenseDetail }
        - { id: org, text: Get-MgOrganization }
        - { id: sku, text: Get-MgSku }
    - id: cmd
      options:
        - { id: setuser, text: Set-MgUserLicense }
        - { id: setgroup, text: Set-MgGroupLicense }
        - { id: update, text: Update-MgUser }
        - { id: newlic, text: New-MgUserLicense }
    - id: add
      options:
        - { id: addlic, text: -AddLicenses }
        - { id: skuid, text: -SkuId }
        - { id: assigned, text: -AssignedLicenses }
        - { id: options, text: -LicenseOptions }
answer:
  values: { getsku: subscribed, cmd: setuser, add: addlic }
explanation:
  correct:
    en: "`Get-MgSubscribedSku` lists the licensing plans of the tenant, from which you take the SkuId of SPE_E5. `Set-MgUserLicense` adds or removes licenses for a user: `-AddLicenses` takes hashtables with a SkuId (and optionally DisabledPlans), and `-RemoveLicenses` takes an array of SkuIds, here empty."
    fr: "`Get-MgSubscribedSku` liste les plans de licences du locataire, dont on extrait le SkuId de SPE_E5. `Set-MgUserLicense` ajoute ou retire des licences pour un utilisateur : `-AddLicenses` reçoit des tables de hachage avec un SkuId (et éventuellement DisabledPlans), et `-RemoveLicenses` un tableau de SkuId, ici vide."
  options:
    detail: { en: "Get-MgUserLicenseDetail returns the licenses already assigned to a user; Omar has none.", fr: "Get-MgUserLicenseDetail renvoie les licences déjà attribuées à un utilisateur ; Omar n'en a aucune." }
    setgroup: { en: "Set-MgGroupLicense assigns licenses to a group, not directly to a user.", fr: "Set-MgGroupLicense attribue des licences à un groupe, pas directement à un utilisateur." }
    update: { en: "Update-MgUser changes user properties such as UsageLocation, not licenses.", fr: "Update-MgUser modifie des propriétés comme UsageLocation, pas les licences." }
references:
  - title: Set-MgUserLicense (Microsoft.Graph.Users.Actions)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.graph.users.actions/set-mguserlicense
  - title: Assign Microsoft 365 licenses to user accounts with PowerShell
    url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/assign-licenses-to-user-accounts-with-microsoft-365-powershell
