id: i1-009-static-to-dynamic
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. A security group named **Sales-EU** has the **Assigned** membership type, contains 120 users and is used to grant access to an enterprise application.

    In the properties of Sales-EU, you change the membership type to **Dynamic User** with the rule `user.department -eq "Sales"`, and you save the change.

    What is the result?
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1. Un groupe de sécurité nommé **Sales-EU** a le type d'appartenance **Affecté**, contient 120 utilisateurs et sert à accorder l'accès à une application d'entreprise.

    Dans les propriétés de Sales-EU, vous changez le type d'appartenance en **Dynamic User** avec la règle `user.department -eq "Sales"`, puis vous enregistrez.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "The group keeps its name and object ID; current members who don't match the rule are removed and other matching users are added.", fr: "Le groupe conserve son nom et son ID d'objet ; les membres actuels qui ne correspondent pas à la règle sont retirés et les autres utilisateurs correspondants sont ajoutés." }
    - id: b
      text: { en: "A new group object is created, so the application assignment must be updated to reference it.", fr: "Un nouvel objet groupe est créé : l'attribution de l'application doit donc être mise à jour pour le référencer." }
    - id: c
      text: { en: "All 120 current members are kept, and the rule only adds new matching users.", fr: "Les 120 membres actuels sont conservés, et la règle ajoute seulement les nouveaux utilisateurs correspondants." }
    - id: d
      text: { en: "The change is refused because a group used by an application can't change its membership type.", fr: "La modification est refusée, car un groupe utilisé par une application ne peut pas changer de type d'appartenance." }
answer: { optionId: a }
explanation:
  correct:
    en: "Converting a static group to a dynamic membership group keeps the same name and ID, so existing references stay valid. Existing members who meet the rule remain, those who don't are removed, and other users who satisfy the rule are added automatically. Users may lose access until the rule is fully processed."
    fr: "La conversion d'un groupe statique en groupe d'appartenance dynamique conserve le même nom et le même ID : les références existantes restent valides. Les membres qui respectent la règle restent, les autres sont retirés, et les utilisateurs qui satisfont la règle sont ajoutés automatiquement. Des utilisateurs peuvent perdre l'accès tant que la règle n'est pas entièrement traitée."
  options:
    b: { en: "The conversion is done in place; no new object is created.", fr: "La conversion se fait sur place ; aucun nouvel objet n'est créé." }
    c: { en: "Members of a dynamic group are defined only by the rule; non-matching members are removed.", fr: "Les membres d'un groupe dynamique sont définis uniquement par la règle ; les membres non correspondants sont retirés." }
    d: { en: "Only role-assignable groups can't change their membership type.", fr: "Seuls les groupes attribuables à un rôle ne peuvent pas changer de type d'appartenance." }
references:
  - title: Change Static Groups to Dynamic Membership Groups
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-change-type
