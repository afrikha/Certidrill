id: sr-01-q4
objective: "1.3.1"
type: series_yesno
series: sr-01-allowed-locations
seriesOrder: 4
difficulty: 3
status: draft
stem:
  en: |
    You assign the Allowed locations for resource groups policy to Sub1.
  fr: |
    Vous attribuez la stratégie Allowed locations for resource groups à Sub1.
body:
  solution:
    en: |
      You assign the built-in **Allowed locations for resource groups** policy definition to **Sub1**, with East US and West Europe as the allowed locations.
    fr: |
      Vous attribuez la définition de stratégie intégrée **Allowed locations for resource groups** à **Sub1**, avec East US et West Europe comme emplacements autorisés.
answer: { value: false }
explanation:
  correct:
    en: |
      This definition restricts only the location of the resource groups themselves. A resource group's location stores its metadata and doesn't constrain the resources it contains, so a resource can still be deployed in any region inside a resource group located in East US. The goal is about the resources, so it isn't met; the Allowed locations definition is the one that evaluates resource locations.
    fr: |
      Cette définition limite uniquement l'emplacement des groupes de ressources eux-mêmes. L'emplacement d'un groupe de ressources sert à stocker ses métadonnées et ne contraint pas les ressources qu'il contient : une ressource peut encore être déployée dans n'importe quelle région à l'intérieur d'un groupe de ressources situé dans East US. L'objectif porte sur les ressources ; il n'est donc pas atteint. C'est la définition Allowed locations qui évalue l'emplacement des ressources.
references:
  - title: "Tutorial: Build policies to enforce compliance"
    url: https://learn.microsoft.com/en-us/azure/governance/policy/tutorials/create-and-manage
