id: i3-cost-advisor-cpu-rule
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso reviews Azure Advisor cost recommendations every month for a subscription named **Sub-Apps**. The operations manager wants the list of virtual machine right-sizing recommendations for Sub-Apps to show only virtual machines whose average CPU utilization is very low, so that the team can focus on the largest savings.

    What should you do?
  fr: |
    Contoso examine chaque mois les recommandations de coût d'Azure Advisor pour un abonnement nommé **Sub-Apps**. Le responsable de l'exploitation veut que la liste des recommandations de redimensionnement des machines virtuelles de Sub-Apps n'affiche que les machines virtuelles dont l'utilisation moyenne du processeur est très faible, afin que l'équipe se concentre sur les économies les plus importantes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Advisor Configuration, edit the VM/Virtual Machine Scale Sets right sizing rule for Sub-Apps and select a lower average CPU utilization value.", fr: "Dans la configuration d'Advisor, modifier la règle de redimensionnement des machines virtuelles et groupes de machines virtuelles identiques pour Sub-Apps et sélectionner une valeur d'utilisation moyenne du processeur plus faible." } }
    - { id: b, text: { en: "Create a budget on Sub-Apps with a filter on the Virtual Machines service.", fr: "Créer un budget sur Sub-Apps avec un filtre sur le service Virtual Machines." } }
    - { id: c, text: { en: "Create an Azure Monitor metric alert on Percentage CPU for each virtual machine.", fr: "Créer une alerte de métrique Azure Monitor sur Percentage CPU pour chaque machine virtuelle." } }
    - { id: d, text: { en: "Dismiss the Advisor recommendations of the virtual machines that have the highest CPU usage.", fr: "Ignorer les recommandations Advisor des machines virtuelles dont l'utilisation du processeur est la plus élevée." } }
answer: { optionId: a }
explanation:
  correct:
    en: On the Advisor Configuration page, the VM/Virtual Machine Scale Sets right sizing tab lets you set, per subscription, an average CPU utilization filter. Only machines below the selected value are shown in the recommendations; the setting filters the results without changing how they are generated.
    fr: "Sur la page de configuration d'Advisor, l'onglet de redimensionnement des machines virtuelles et groupes de machines virtuelles identiques permet de définir, par abonnement, un filtre sur l'utilisation moyenne du processeur. Seules les machines en dessous de la valeur choisie apparaissent dans les recommandations ; le paramètre filtre les résultats sans changer leur mode de génération."
  options:
    b: { en: "A budget tracks spending; it does not filter Advisor recommendations.", fr: "Un budget suit les dépenses ; il ne filtre pas les recommandations Advisor." }
    c: { en: "Metric alerts notify on CPU thresholds but do not change the Advisor list.", fr: "Les alertes de métrique notifient sur des seuils de processeur mais ne modifient pas la liste Advisor." }
    d: { en: "Dismissing recommendations one by one is manual and must be repeated as new ones appear.", fr: "Ignorer les recommandations une par une est manuel et doit être répété à chaque nouvelle recommandation." }
references:
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
