id: i3-cost-advisor-cpu-rule
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two Azure subscriptions named **Sub-Apps** and **Sub-Data**. The operations team reviews Azure Advisor cost recommendations every month.

    The team wants the virtual machine right-sizing recommendations for Sub-Apps to include only virtual machines whose average CPU utilization is 5 percent or lower, so that it can focus on the most obvious savings. The recommendations for Sub-Data must not change.

    What should you do?
  fr: |
    Contoso dispose de deux abonnements Azure nommés **Sub-Apps** et **Sub-Data**. L'équipe d'exploitation examine chaque mois les recommandations de coût d'Azure Advisor.

    L'équipe veut que les recommandations de redimensionnement des machines virtuelles de Sub-Apps n'incluent que les machines virtuelles dont l'utilisation moyenne du processeur est inférieure ou égale à 5 %, afin de se concentrer sur les économies les plus évidentes. Les recommandations de Sub-Data ne doivent pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Advisor Configuration, edit the VM/Virtual Machine Scale Sets right sizing rule of Sub-Apps and select 5% as the average CPU utilization.", fr: "Dans la configuration d'Advisor, modifier la règle VM/Virtual Machine Scale Sets right sizing de Sub-Apps et sélectionner 5 % comme utilisation moyenne du processeur." } }
    - { id: b, text: { en: "In Advisor Configuration, edit the VM/Virtual Machine Scale Sets right sizing rule of Sub-Apps and set the lookback period to 7 days.", fr: "Dans la configuration d'Advisor, modifier la règle VM/Virtual Machine Scale Sets right sizing de Sub-Apps et définir la période de recul sur 7 jours." } }
    - { id: c, text: { en: "In Advisor Configuration, on the Resources tab, exclude the resource groups of Sub-Apps that contain the busiest virtual machines.", fr: "Dans la configuration d'Advisor, sous l'onglet Ressources, exclure les groupes de ressources de Sub-Apps qui contiennent les machines virtuelles les plus sollicitées." } }
    - { id: d, text: { en: "In Azure Monitor, create a metric alert rule on Percentage CPU for the Sub-Apps virtual machines with a threshold of 5%.", fr: "Dans Azure Monitor, créer une règle d'alerte de métrique sur Percentage CPU pour les machines virtuelles de Sub-Apps avec un seuil de 5 %." } }
answer: { optionId: a }
explanation:
  correct:
    en: On the Advisor Configuration page, the VM/Virtual Machine Scale Sets right sizing tab lets you set, for each subscription, an average CPU utilization filter. Only machines at or below the selected value then appear in the recommendations of that subscription; the setting filters the results without changing how they are generated, and other subscriptions keep their own setting.
    fr: "Sur la page de configuration d'Advisor, l'onglet VM/Virtual Machine Scale Sets right sizing permet de définir, pour chaque abonnement, un filtre sur l'utilisation moyenne du processeur. Seules les machines inférieures ou égales à la valeur choisie apparaissent alors dans les recommandations de cet abonnement ; le paramètre filtre les résultats sans changer leur mode de génération, et les autres abonnements conservent leur propre paramètre."
  options:
    b: { en: "The lookback period only changes how many days of usage data Advisor analyzes; it does not filter the recommendations by CPU utilization.", fr: "La période de recul change seulement le nombre de jours de données d'utilisation analysés par Advisor ; elle ne filtre pas les recommandations selon l'utilisation du processeur." }
    c: { en: "Excluding resource groups removes all their resources from every Advisor recommendation, whatever their CPU utilization.", fr: "Exclure des groupes de ressources retire toutes leurs ressources de toutes les recommandations Advisor, quelle que soit leur utilisation du processeur." }
    d: { en: "A metric alert notifies when a CPU threshold is crossed; it does not change the Advisor recommendation list.", fr: "Une alerte de métrique prévient lorsqu'un seuil de processeur est franchi ; elle ne modifie pas la liste des recommandations Advisor." }
references:
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
