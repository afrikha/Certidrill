id: i3-policy-layered-scopes
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure subscription named **Sub-Litware** that contains a resource group named **RG-Analytics**. The following policy assignments exist:

    | Assignment | Scope | Definition | Allowed locations | Effect |
    | --- | --- | --- | --- | --- |
    | PA1 | Sub-Litware | Allowed locations | West Europe | deny |
    | PA2 | RG-Analytics | Allowed locations | North Europe | audit |

    A developer tries to create a storage account in **North Europe** in RG-Analytics.

    What is the result?
  fr: |
    Litware dispose d'un abonnement Azure nommé **Sub-Litware** qui contient un groupe de ressources nommé **RG-Analytics**. Les attributions de stratégie suivantes existent :

    | Attribution | Étendue | Définition | Emplacements autorisés | Effet |
    | --- | --- | --- | --- | --- |
    | PA1 | Sub-Litware | Allowed locations | West Europe | deny |
    | PA2 | RG-Analytics | Allowed locations | North Europe | audit |

    Un développeur essaie de créer un compte de stockage dans **North Europe** dans RG-Analytics.

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: The request is denied by PA1., fr: La requête est refusée par PA1. } }
    - { id: b, text: { en: The storage account is created and is compliant with both assignments., fr: Le compte de stockage est créé et il est conforme aux deux attributions. } }
    - { id: c, text: { en: The storage account is created because the assignment at the resource group scope overrides the subscription assignment., fr: "Le compte de stockage est créé, car l'attribution au niveau du groupe de ressources remplace celle de l'abonnement." } }
    - { id: d, text: { en: The storage account is created and is marked non-compliant with PA1 only., fr: Le compte de stockage est créé et il est marqué non conforme à PA1 uniquement. } }
answer: { optionId: a }
explanation:
  correct:
    en: Every assignment that applies to a resource is evaluated independently, and the net result is cumulative most restrictive. A lower scope never overrides a higher one. North Europe is not in the PA1 list, so the deny effect of PA1 rejects the request, even though PA2 would allow it.
    fr: "Chaque attribution qui s'applique à une ressource est évaluée indépendamment, et le résultat net est le plus restrictif cumulé. Une étendue inférieure ne remplace jamais une étendue supérieure. North Europe ne figure pas dans la liste de PA1 : l'effet deny de PA1 rejette la requête, même si PA2 l'autoriserait."
  options:
    b: { en: "The resource would violate PA1, so it cannot be compliant with both.", fr: "La ressource enfreindrait PA1 ; elle ne peut pas être conforme aux deux." }
    c: { en: Policy assignments are not overridden by assignments at child scopes; each one is evaluated., fr: Les attributions de stratégie ne sont pas remplacées par celles des étendues enfants ; chacune est évaluée. }
    d: { en: "PA1 uses deny, not audit, so the request is blocked instead of being created and flagged.", fr: "PA1 utilise deny et non audit : la requête est bloquée au lieu d'être créée puis signalée." }
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
