id: cs3-coho-05
objective: "1.3.4"
type: yesno_statements
caseStudy: cs3-coho
difficulty: 2
status: draft
stem:
  en: |
    You move VM-IOT1 and its dependent resources from RG-Hub to RG-Sensors to meet the operations requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déplacez VM-IOT1 et ses ressources dépendantes de RG-Hub vers RG-Sensors pour satisfaire l'exigence d'exploitation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "VM-IOT1 keeps running while the move is in progress."
        fr: "VM-IOT1 continue de s'exécuter pendant le déplacement."
    - id: s2
      text:
        en: "After the move, VM-IOT1 runs in the West Europe region."
        fr: "Après le déplacement, VM-IOT1 s'exécute dans la région West Europe."
    - id: s3
      text:
        en: "After the move, GG-SensorsOps still has the Virtual Machine Contributor role on VM-IOT1."
        fr: "Après le déplacement, GG-SensorsOps dispose toujours du rôle Virtual Machine Contributor sur VM-IOT1."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "During a move, the source and target resource groups are locked against changes, but the resources keep running. A move changes only the resource group and the resource ID; VM-IOT1 stays in France Central even though RG-Sensors was created in West Europe. A role assignment made directly on the moved resource doesn't move with it and becomes orphaned, so you must assign the role again."
    fr: "Pendant un déplacement, les groupes de ressources source et cible sont verrouillés contre les modifications, mais les ressources continuent de s'exécuter. Un déplacement ne change que le groupe de ressources et l'ID de ressource ; VM-IOT1 reste dans France Central même si RG-Sensors a été créé dans West Europe. Une attribution de rôle faite directement sur la ressource déplacée ne la suit pas et devient orpheline : vous devez attribuer le rôle à nouveau."
references:
  - title: "Move Azure resources to a new resource group or subscription"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
