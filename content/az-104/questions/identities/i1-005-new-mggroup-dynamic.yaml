id: i1-005-new-mggroup-dynamic
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant licensed with Microsoft Entra ID P1.

    You need to create, by using Microsoft Graph PowerShell, a security group named **Finance-Users** whose membership is calculated automatically and contains every user whose department is **Finance**. Membership processing must start as soon as the group is created.

    How should you complete the script? Select the appropriate options in the answer area.
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1.

    Vous devez créer avec Microsoft Graph PowerShell un groupe de sécurité nommé **Finance-Users** dont l'appartenance est calculée automatiquement et qui contient tous les utilisateurs dont le service (department) est **Finance**. Le traitement de l'appartenance doit démarrer dès la création du groupe.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: powershell
  template: |
    Connect-MgGraph -Scopes "Group.ReadWrite.All"
    New-MgGroup -DisplayName "Finance-Users" `
      -MailEnabled:$false -MailNickname "financeusers" -SecurityEnabled `
      -GroupTypes [[gt]] `
      -MembershipRule [[rule]] `
      -MembershipRuleProcessingState [[state]]
  slots:
    - id: gt
      options:
        - { id: dyn, text: "'DynamicMembership'" }
        - { id: unified, text: "'Unified'" }
        - { id: dynamic, text: "'Dynamic'" }
        - { id: assigned, text: "'Assigned'" }
    - id: rule
      options:
        - { id: eq, text: "'(user.department -eq \"Finance\")'" }
        - { id: dbl, text: "'(user.department == \"Finance\")'" }
        - { id: noobj, text: "'(department -eq \"Finance\")'" }
        - { id: mixed, text: "'(user.department -eq \"Finance\") -and (device.deviceOSType -eq \"Windows\")'" }
    - id: state
      options:
        - { id: on, text: "'On'" }
        - { id: paused, text: "'Paused'" }
        - { id: enabled, text: "'Enabled'" }
        - { id: active, text: "'Active'" }
answer:
  values: { gt: dyn, rule: eq, state: on }
explanation:
  correct:
    en: "A group has dynamic membership when its GroupTypes collection contains `DynamicMembership`. The rule uses the `<object>.<property> <operator> <value>` syntax, here `user.department -eq \"Finance\"`. MembershipRuleProcessingState accepts `On` or `Paused`; `On` starts processing immediately."
    fr: "Un groupe a une appartenance dynamique quand sa collection GroupTypes contient `DynamicMembership`. La règle utilise la syntaxe `<objet>.<propriété> <opérateur> <valeur>`, ici `user.department -eq \"Finance\"`. MembershipRuleProcessingState accepte `On` ou `Paused` ; `On` démarre le traitement immédiatement."
  options:
    unified: { en: "Unified makes the group a Microsoft 365 group, not a security group with dynamic membership.", fr: "Unified fait du groupe un groupe Microsoft 365, pas un groupe de sécurité à appartenance dynamique." }
    dbl: { en: "The equality operator is -eq, not ==.", fr: "L'opérateur d'égalité est -eq, pas ==." }
    noobj: { en: "The property must be prefixed with the object type (user.).", fr: "La propriété doit être préfixée par le type d'objet (user.)." }
    mixed: { en: "A rule cannot contain both user and device expressions.", fr: "Une règle ne peut pas contenir à la fois des expressions sur les utilisateurs et sur les appareils." }
    paused: { en: "Paused stops the rule from being processed.", fr: "Paused interrompt le traitement de la règle." }
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
  - title: New-MgGroup (Microsoft.Graph.Groups)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.graph.groups/new-mggroup
