id: i3-mg-delete-order
objective: "1.3.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a management group named **mg-legacy** that contains only one subscription, **Sub-Old1**. You need to delete mg-legacy. Sub-Old1 must be kept and must end up in a new management group named **mg-archive**, which does not exist yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un groupe d'administration nommé **mg-legacy** qui contient un seul abonnement, **Sub-Old1**. Vous devez supprimer mg-legacy. Sub-Old1 doit être conservé et doit se retrouver dans un nouveau groupe d'administration nommé **mg-archive**, qui n'existe pas encore.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create the management group mg-archive.", fr: "Créer le groupe d'administration mg-archive." } }
    - { id: move, text: { en: "Move Sub-Old1 to mg-archive.", fr: "Déplacer Sub-Old1 vers mg-archive." } }
    - { id: delete, text: { en: "Delete mg-legacy.", fr: "Supprimer mg-legacy." } }
    - { id: cancel, text: { en: "Cancel Sub-Old1.", fr: "Annuler Sub-Old1." } }
    - { id: lock, text: { en: "Apply a Delete lock to mg-legacy.", fr: "Appliquer un verrou Suppression à mg-legacy." } }
    - { id: rename, text: { en: "Rename mg-legacy to mg-archive.", fr: "Renommer mg-legacy en mg-archive." } }
answer:
  sequence: [create, move, delete]
explanation:
  correct:
    en: A management group can be deleted only when it has no child management groups or subscriptions. The target must exist before you move Sub-Old1 into it, and once mg-legacy is empty it can be deleted.
    fr: "Un groupe d'administration ne peut être supprimé que s'il n'a aucun groupe d'administration ni abonnement enfant. La cible doit exister avant que vous y déplaciez Sub-Old1, et une fois vide, mg-legacy peut être supprimé."
  options:
    cancel: { en: "Sub-Old1 must be kept.", fr: "Sub-Old1 doit être conservé." }
    lock: { en: "Locks cannot be applied to management groups.", fr: "Les verrous ne peuvent pas être appliqués aux groupes d'administration." }
    rename: { en: "Renaming changes only the display name; the ID stays mg-legacy and the group would not be deleted.", fr: "Le renommage change seulement le nom d'affichage ; l'ID reste mg-legacy et le groupe ne serait pas supprimé." }
references:
  - title: Manage your Azure subscriptions at scale with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage
