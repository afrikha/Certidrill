id: i1-008-restore-deleted-user
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a cloud-only Microsoft Entra tenant. Twelve days ago, an administrator deleted the user account of **Megan Bowen** by mistake.

    You need to recover the account with its existing properties, group memberships and licenses. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose d'un locataire Microsoft Entra uniquement cloud. Il y a douze jours, un administrateur a supprimé par erreur le compte d'utilisateur de **Megan Bowen**.

    Vous devez récupérer le compte avec ses propriétés, ses appartenances aux groupes et ses licences. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In Users > Deleted users, select the account and select Restore user.", fr: "Dans Utilisateurs > Utilisateurs supprimés, sélectionner le compte puis Restaurer l'utilisateur (Restore user)." }
    - id: b
      text: { en: "Create a new user with the same user principal name and add it to the same groups.", fr: "Créer un nouvel utilisateur avec le même nom d'utilisateur principal et l'ajouter aux mêmes groupes." }
    - id: c
      text: { en: "Wait for the next Microsoft Entra Connect synchronization cycle to recreate the account.", fr: "Attendre le prochain cycle de synchronisation Microsoft Entra Connect pour recréer le compte." }
    - id: d
      text: { en: "Open the account and select Reset redemption status.", fr: "Ouvrir le compte et sélectionner Réinitialiser l'état d'échange (Reset redemption status)." }
answer: { optionId: a }
explanation:
  correct:
    en: A deleted user stays in a suspended state for 30 days and appears on the Deleted users page. Restoring it brings back the account with all its organization information, including the licenses assigned at deletion time.
    fr: Un utilisateur supprimé reste dans un état suspendu pendant 30 jours et apparaît dans la page Utilisateurs supprimés. Sa restauration rétablit le compte avec toutes ses informations, y compris les licences attribuées au moment de la suppression.
  options:
    b: { en: A new account gets a new object ID and none of the previous memberships or settings; it also requires much more effort., fr: Un nouveau compte reçoit un nouvel ID d'objet sans les appartenances ni les paramètres précédents ; c'est aussi bien plus d'effort. }
    c: { en: The tenant is cloud-only; there is no synchronization from an on-premises directory., fr: Le locataire est uniquement cloud ; il n'y a aucune synchronisation depuis un annuaire local. }
    d: { en: Resetting the redemption status applies to B2B guest users, not to deleted accounts., fr: La réinitialisation de l'état d'échange concerne les utilisateurs invités B2B, pas les comptes supprimés. }
references:
  - title: Restore or permanently remove recently deleted user
    url: https://learn.microsoft.com/en-us/entra/fundamentals/users-restore
