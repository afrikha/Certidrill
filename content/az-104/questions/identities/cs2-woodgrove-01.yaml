id: cs2-woodgrove-01
objective: "1.2.2"
type: dragdrop
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You need to create the role assignments for internal audit, GRP-NetOps and GRP-AppOps. The solution must meet the technical and business requirements and follow the principle of least privilege.

    At which scope should you create each role assignment? To answer, drag the appropriate scopes to the correct role assignments. Each scope may be used once or not at all.
  fr: |
    Vous devez créer les attributions de rôle pour l'audit interne, GRP-NetOps et GRP-AppOps. La solution doit respecter les exigences techniques et métier, et suivre le principe du privilège minimum.

    À quelle étendue devez-vous créer chaque attribution de rôle ? Pour répondre, faites glisser les étendues appropriées vers les attributions de rôle correspondantes. Chaque étendue peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: mg, text: { en: "Management group MG-Woodgrove", fr: "Groupe d'administration MG-Woodgrove" } }
    - { id: subcore, text: { en: "Subscription Sub-Core", fr: "Abonnement Sub-Core" } }
    - { id: subdev, text: { en: "Subscription Sub-Dev", fr: "Abonnement Sub-Dev" } }
    - { id: rgnet, text: { en: "Resource group RG-Network", fr: "Groupe de ressources RG-Network" } }
    - { id: rgdev, text: { en: "Resource group RG-DevTest", fr: "Groupe de ressources RG-DevTest" } }
  targets:
    - { id: audit, text: { en: "Reader for GRP-Audit", fr: "Reader pour GRP-Audit" } }
    - { id: netops, text: { en: "Network Contributor for GRP-NetOps", fr: "Network Contributor pour GRP-NetOps" } }
    - { id: appops, text: { en: "Virtual Machine Contributor for GRP-AppOps", fr: "Virtual Machine Contributor pour GRP-AppOps" } }
answer:
  mapping: { audit: mg, netops: rgnet, appops: subdev }
explanation:
  correct:
    en: Role assignments are inherited by child scopes. A Reader assignment on MG-Woodgrove covers the current subscriptions and any subscription added to the management group later. Network Contributor on RG-Network limits the network team to that resource group. Virtual Machine Contributor on Sub-Dev applies to every resource group of the subscription, including resource groups created later.
    fr: Les attributions de rôle sont héritées par les étendues enfants. Une attribution Reader sur MG-Woodgrove couvre les abonnements actuels et tout abonnement ajouté ultérieurement au groupe d'administration. Network Contributor sur RG-Network limite l'équipe réseau à ce groupe de ressources. Virtual Machine Contributor sur Sub-Dev s'applique à chaque groupe de ressources de l'abonnement, y compris ceux créés ultérieurement.
  options:
    subcore:
      en: Sub-Core is too broad for the network team and too narrow for internal audit, which must also see Sub-Dev and future subscriptions.
      fr: Sub-Core est trop large pour l'équipe réseau et trop restreint pour l'audit interne, qui doit aussi voir Sub-Dev et les abonnements futurs.
    rgdev:
      en: An assignment on RG-DevTest would not apply to the resource groups created later in Sub-Dev.
      fr: Une attribution sur RG-DevTest ne s'appliquerait pas aux groupes de ressources créés ultérieurement dans Sub-Dev.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
