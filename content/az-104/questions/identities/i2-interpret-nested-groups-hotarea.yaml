id: i2-interpret-nested-groups-hotarea
objective: "1.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a subscription named **Sub1** that contains two resource groups:

    - **RG-Web** contains a virtual machine named **VM1**.
    - **RG-Data** contains a storage account named **stcontosoweb**.

    A user named User3 is a member of the group **G-Web**. G-Web is itself a member of the group **G-All**. The following table shows all the role assignments in Sub1.

    Answer each prompt by selecting the role assignment that grants the permission.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un abonnement nommé **Sub1** qui contient deux groupes de ressources :

    - **RG-Web** contient une machine virtuelle nommée **VM1**.
    - **RG-Data** contient un compte de stockage nommé **stcontosoweb**.

    Un utilisateur nommé User3 est membre du groupe **G-Web**. G-Web est lui-même membre du groupe **G-All**. Le tableau suivant présente toutes les attributions de rôles de Sub1.

    Répondez à chaque consigne en sélectionnant l'attribution de rôle qui accorde l'autorisation.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which assignment allows User3 to restart VM1?", fr: "Quelle attribution permet à User3 de redémarrer VM1 ?" }
    - id: p2
      text: { en: "Which assignment allows User3 to read blobs in stcontosoweb by using Microsoft Entra authorization?", fr: "Quelle attribution permet à User3 de lire des blobs de stcontosoweb en utilisant l'autorisation Microsoft Entra ?" }
  grid:
    header: [ { en: "Principal", fr: "Principal" }, { en: Role, fr: Rôle }, { en: Scope, fr: Étendue } ]
    rows:
      - [ { text: User3 }, { text: Reader, area: r1 }, { text: Sub1 } ]
      - [ { text: { en: "G-All (group)", fr: "G-All (groupe)" } }, { text: Virtual Machine Contributor, area: r2 }, { text: RG-Web } ]
      - [ { text: { en: "G-Web (group)", fr: "G-Web (groupe)" } }, { text: Reader, area: r3 }, { text: RG-Web } ]
      - [ { text: { en: "G-Web (group)", fr: "G-Web (groupe)" } }, { text: Storage Blob Data Reader, area: r4 }, { text: stcontosoweb } ]
      - [ { text: User3 }, { text: Storage Account Contributor, area: r5 }, { text: RG-Web } ]
answer:
  values: { p1: r2, p2: r4 }
explanation:
  correct:
    en: Role assignments are transitive for groups, so User3 receives the assignments of G-Web and of G-All. Virtual Machine Contributor on RG-Web (through G-All) allows restarting VM1. Reading blob data with Microsoft Entra authorization requires a data action, which Storage Blob Data Reader on stcontosoweb (through G-Web) provides.
    fr: Les attributions de rôles sont transitives pour les groupes ; User3 reçoit donc les attributions de G-Web et de G-All. Virtual Machine Contributor sur RG-Web (via G-All) permet de redémarrer VM1. La lecture de données blob avec l'autorisation Microsoft Entra nécessite une action de données, fournie par Storage Blob Data Reader sur stcontosoweb (via G-Web).
  options:
    r1: { en: "Reader allows viewing only and grants no data actions.", fr: "Reader permet seulement la consultation et n'accorde aucune action de données." }
    r3: { en: "Reader cannot restart a virtual machine.", fr: "Reader ne peut pas redémarrer une machine virtuelle." }
    r5: { en: "This assignment is on RG-Web, while stcontosoweb is in RG-Data; it also grants no data actions.", fr: "Cette attribution porte sur RG-Web, alors que stcontosoweb se trouve dans RG-Data ; elle n'accorde de plus aucune action de données." }
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  - title: Assign an Azure Role for Blob Data Access - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access
