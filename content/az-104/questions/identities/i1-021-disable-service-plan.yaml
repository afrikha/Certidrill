id: i1-021-disable-service-plan
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys assigns Microsoft 365 E5 licenses to the group **LIC-STAFF**. The members of LIC-STAFF must not be able to use Microsoft Bookings, but they must keep all the other E5 services.

    You need to meet the requirement by using licensing. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Wingtip Toys attribue des licences Microsoft 365 E5 au groupe **LIC-STAFF**. Les membres de LIC-STAFF ne doivent pas pouvoir utiliser Microsoft Bookings, mais doivent conserver tous les autres services E5.

    Vous devez répondre à cette exigence par le biais des licences. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Edit the license assignment of LIC-STAFF and turn off the Microsoft Bookings service.", fr: "Modifier l'attribution de licence de LIC-STAFF et désactiver le service Microsoft Bookings." }
    - id: b
      text: { en: "Remove the license from LIC-STAFF and assign E5 directly to each member with Bookings disabled.", fr: "Retirer la licence de LIC-STAFF et attribuer E5 directement à chaque membre avec Bookings désactivé." }
    - id: c
      text: { en: "Replace the E5 license of LIC-STAFF with a Microsoft 365 E3 license.", fr: "Remplacer la licence E5 de LIC-STAFF par une licence Microsoft 365 E3." }
    - id: d
      text: { en: "Add the members to a second group that is assigned E5 with Microsoft Bookings turned off.", fr: "Ajouter les membres à un second groupe auquel E5 est attribué avec Microsoft Bookings désactivé." }
answer: { optionId: a }
explanation:
  correct:
    en: "When you assign or edit a group license, you can turn individual apps and services (service plans) on or off. Turning off Bookings on the LIC-STAFF assignment applies to all members at once and keeps the other E5 services."
    fr: "Lorsque vous attribuez ou modifiez la licence d'un groupe, vous pouvez activer ou désactiver individuellement des applications et services (plans de service). Désactiver Bookings sur l'attribution de LIC-STAFF s'applique à tous les membres en une fois et conserve les autres services E5."
  options:
    b: { en: "Direct assignments work but must be managed user by user, which increases effort.", fr: "Les attributions directes fonctionnent mais se gèrent utilisateur par utilisateur, ce qui augmente l'effort." }
    c: { en: "Switching to E3 removes other E5 services that users must keep.", fr: "Passer à E3 retire d'autres services E5 que les utilisateurs doivent conserver." }
    d: { en: "When a user receives the same product from several groups, the enabled services are combined, so Bookings stays enabled through LIC-STAFF.", fr: "Quand un utilisateur reçoit le même produit par plusieurs groupes, les services activés se cumulent : Bookings reste donc activé par LIC-STAFF." }
references:
  - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
