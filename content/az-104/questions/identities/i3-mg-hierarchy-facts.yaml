id: i3-mg-hierarchy-facts
objective: "1.3.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing a management group hierarchy for its 40 Azure subscriptions, which all trust the same Microsoft Entra tenant.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit une hiérarchie de groupes d'administration pour ses 40 abonnements Azure, qui approuvent tous le même locataire Microsoft Entra.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The hierarchy supports up to six levels of management groups below the root management group.", fr: "La hiérarchie prend en charge jusqu'à six niveaux de groupes d'administration sous le groupe d'administration racine." } }
    - { id: b, text: { en: "A newly created subscription is placed under the root management group by default.", fr: "Un abonnement nouvellement créé est placé par défaut sous le groupe d'administration racine." } }
    - { id: c, text: { en: "A subscription can be a member of two management groups at the same time.", fr: "Un abonnement peut être membre de deux groupes d'administration en même temps." } }
    - { id: d, text: { en: "The root management group can be moved under another management group.", fr: "Le groupe d'administration racine peut être déplacé sous un autre groupe d'administration." } }
    - { id: e, text: { en: "A tenant can have several independent management group hierarchies.", fr: "Un locataire peut avoir plusieurs hiérarchies de groupes d'administration indépendantes." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: A management group tree supports up to six levels of depth, not counting the root level or the subscription level. New subscriptions default to the root management group when they are created.
    fr: "Une arborescence de groupes d'administration prend en charge jusqu'à six niveaux de profondeur, sans compter le niveau racine ni le niveau des abonnements. Les nouveaux abonnements sont placés par défaut dans le groupe d'administration racine lors de leur création."
  options:
    c: { en: "Each management group and subscription has only one parent.", fr: "Chaque groupe d'administration et chaque abonnement n'a qu'un seul parent." }
    d: { en: "The root management group cannot be moved or deleted.", fr: "Le groupe d'administration racine ne peut être ni déplacé ni supprimé." }
    e: { en: "All management groups and subscriptions fold up into a single hierarchy per directory.", fr: "Tous les groupes d'administration et abonnements remontent vers une hiérarchie unique par annuaire." }
references:
  - title: Organize your resources with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
