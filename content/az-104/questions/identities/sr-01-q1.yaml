id: sr-01-q1
objective: "1.3.1"
type: series_yesno
series: sr-01-allowed-locations
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You assign the Allowed locations policy to each existing resource group.
  fr: |
    Vous attribuez la stratégie Allowed locations à chaque groupe de ressources existant.
body:
  solution:
    en: |
      You assign the built-in **Allowed locations** policy definition, with East US and West Europe as the allowed locations, to **each existing resource group** of Sub1.
    fr: |
      Vous attribuez la définition de stratégie intégrée **Allowed locations** (« Emplacements autorisés »), avec East US et West Europe comme emplacements autorisés, à **chaque groupe de ressources existant** de Sub1.
answer: { value: false }
explanation:
  correct:
    en: |
      A policy assignment applies only to its scope and the child scopes of that scope. The resource groups that developers create every week are outside every assignment, so resources deployed into them can still be created in any region. The goal explicitly covers future resource groups, so it isn't met.
    fr: |
      Une attribution de stratégie s'applique uniquement à son étendue et aux étendues enfants de celle-ci. Les groupes de ressources créés chaque semaine par les développeurs ne sont couverts par aucune attribution : les ressources qui y sont déployées peuvent encore être créées dans n'importe quelle région. L'objectif couvre explicitement les futurs groupes de ressources ; il n'est donc pas atteint.
references:
  - title: "Understand scope in Azure Policy"
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/scope
