id: i2-builtin-files-smb-contributor
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure file share named **projects** in a storage account named **stcontosofs**. Identity-based authentication over SMB is configured for the storage account.

    Members of a Microsoft Entra group named **Design-Team** must be able to read, create, modify and delete files and directories in the projects share over SMB. They must not be able to change the NTFS permissions (ACLs) on files and directories. The solution must follow the principle of least privilege.

    Which share-level role should you assign to Design-Team?
  fr: |
    Contoso dispose d'un partage de fichiers Azure nommé **projects** dans un compte de stockage nommé **stcontosofs**. L'authentification basée sur l'identité via SMB est configurée pour le compte de stockage.

    Les membres d'un groupe Microsoft Entra nommé **Design-Team** doivent pouvoir lire, créer, modifier et supprimer des fichiers et des répertoires dans le partage projects via SMB. Ils ne doivent pas pouvoir modifier les autorisations NTFS (ACL) des fichiers et des répertoires. La solution doit respecter le principe du moindre privilège.

    Quel rôle au niveau du partage devez-vous attribuer à Design-Team ?
body:
  options:
    - { id: a, text: Storage File Data SMB Share Contributor }
    - { id: b, text: Storage File Data SMB Share Elevated Contributor }
    - { id: c, text: Storage File Data SMB Share Reader }
    - { id: d, text: Storage Account Contributor }
answer: { optionId: a }
explanation:
  correct:
    en: Storage File Data SMB Share Contributor allows read, write and delete access on files and directories in Azure file shares over SMB, without the right to modify ACLs.
    fr: Storage File Data SMB Share Contributor permet l'accès en lecture, écriture et suppression aux fichiers et répertoires des partages de fichiers Azure via SMB, sans le droit de modifier les ACL.
  options:
    b:
      en: The Elevated Contributor role also allows modifying ACLs, which is explicitly not wanted.
      fr: Le rôle Elevated Contributor permet aussi de modifier les ACL, ce qui est explicitement exclu.
    c:
      en: SMB Share Reader allows only read access to files and directories.
      fr: SMB Share Reader permet uniquement l'accès en lecture aux fichiers et répertoires.
    d:
      en: Storage Account Contributor manages the storage account (control plane) and is not a share-level permission for SMB identity-based access.
      fr: Storage Account Contributor gère le compte de stockage (plan de contrôle) et n'est pas une autorisation au niveau du partage pour l'accès SMB basé sur l'identité.
references:
  - title: Azure built-in roles for Storage - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage
