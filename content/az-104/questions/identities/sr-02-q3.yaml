id: sr-02-q3
objective: "1.2.1"
type: series_yesno
series: sr-02-vm-operators
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You assign a custom role with read, start, restart, and deallocate actions to VMOps on RG1.
  fr: |
    Vous attribuez à VMOps sur RG1 un rôle personnalisé avec les actions read, start, restart et deallocate.
body:
  solution:
    en: |
      You create a custom role whose `Actions` are `Microsoft.Compute/virtualMachines/read`, `Microsoft.Compute/virtualMachines/start/action`, `Microsoft.Compute/virtualMachines/restart/action` and `Microsoft.Compute/virtualMachines/deallocate/action`, with RG1 in its `AssignableScopes`. You assign the role to the VMOps group at the scope of **RG1**.
    fr: |
      Vous créez un rôle personnalisé dont les `Actions` sont `Microsoft.Compute/virtualMachines/read`, `Microsoft.Compute/virtualMachines/start/action`, `Microsoft.Compute/virtualMachines/restart/action` et `Microsoft.Compute/virtualMachines/deallocate/action`, avec RG1 dans ses `AssignableScopes`. Vous attribuez ce rôle au groupe VMOps à l'étendue de **RG1**.
answer: { value: true }
explanation:
  correct:
    en: |
      The role contains exactly the operations required: reading the virtual machines and the start, restart, and deallocate actions. It contains no write or delete action, so VMOps can't create, modify, or delete anything. The assignment on RG1 is inherited by virtual machines added to RG1 later and doesn't reach RG2, which satisfies least privilege.
    fr: |
      Le rôle contient exactement les opérations nécessaires : la lecture des machines virtuelles et les actions de démarrage, de redémarrage et de libération. Il ne contient aucune action d'écriture ni de suppression : VMOps ne peut rien créer, modifier ni supprimer. L'attribution sur RG1 est héritée par les machines virtuelles ajoutées plus tard à RG1 et n'atteint pas RG2, ce qui respecte le privilège minimum.
references:
  - title: "Azure custom roles"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - title: "Azure permissions for Compute"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/compute
