id: i2-custom-role-json-notactions
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure subscription named **Sub-Apps** whose ID is `5c1f7a2e-3d4b-4e8a-9b61-0f2d7c8e1a90`. No built-in role meets the needs of the VM operators team, so you are creating a custom role from the following JSON file.

    The custom role must meet the following requirements:

    - Operators can perform every operation on virtual machines **except deleting them**.
    - The role is available for assignment only in Sub-Apps and its resource groups.

    How should you complete the file? Select the appropriate options in the answer area.
  fr: |
    Tailspin Toys dispose d'un abonnement Azure nommé **Sub-Apps** dont l'ID est `5c1f7a2e-3d4b-4e8a-9b61-0f2d7c8e1a90`. Aucun rôle intégré ne répond aux besoins de l'équipe des opérateurs de machines virtuelles ; vous créez donc un rôle personnalisé à partir du fichier JSON suivant.

    Le rôle personnalisé doit répondre aux exigences suivantes :

    - Les opérateurs peuvent effectuer toutes les opérations sur les machines virtuelles **sauf leur suppression**.
    - Le rôle ne peut être attribué que dans Sub-Apps et ses groupes de ressources.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: json
  template: |
    {
      "Name": "Tailspin VM Operator",
      "IsCustom": true,
      "Description": "Manage virtual machines in Sub-Apps without deleting them.",
      "Actions": [
        "Microsoft.Compute/virtualMachines/*",
        "Microsoft.Network/*/read",
        "Microsoft.Resources/subscriptions/resourceGroups/read"
      ],
      [[prop]]: [
        [[act]]
      ],
      "DataActions": [],
      "NotDataActions": [],
      "AssignableScopes": [
        [[scope]]
      ]
    }
  slots:
    - id: prop
      options:
        - { id: notactions, text: "\"NotActions\"" }
        - { id: notdata, text: "\"NotDataActions\"" }
        - { id: deny, text: "\"DenyActions\"" }
        - { id: excl, text: "\"ExcludedActions\"" }
    - id: act
      options:
        - { id: vmdelete, text: "\"Microsoft.Compute/virtualMachines/delete\"" }
        - { id: vmwrite, text: "\"Microsoft.Compute/virtualMachines/write\"" }
        - { id: vmdealloc, text: "\"Microsoft.Compute/virtualMachines/deallocate/action\"" }
        - { id: rgdelete, text: "\"Microsoft.Resources/subscriptions/resourceGroups/delete\"" }
    - id: scope
      options:
        - { id: sub, text: "\"/subscriptions/5c1f7a2e-3d4b-4e8a-9b61-0f2d7c8e1a90\"" }
        - { id: root, text: "\"/\"" }
        - { id: subwild, text: "\"/subscriptions/*\"" }
        - { id: subname, text: "\"/subscriptions/Sub-Apps\"" }
answer:
  values: { prop: notactions, act: vmdelete, scope: sub }
explanation:
  correct:
    en: Control plane actions removed from a wildcard in Actions go in NotActions; effective permissions are Actions minus NotActions, so listing `Microsoft.Compute/virtualMachines/delete` there removes only VM deletion. AssignableScopes must use the full scope ID of the subscription (`/subscriptions/{subscriptionId}`), which also makes the role assignable to the resource groups and resources it contains.
    fr: "Les actions du plan de contrôle retirées d'un caractère générique dans Actions se placent dans NotActions ; les autorisations effectives sont Actions moins NotActions, donc y lister `Microsoft.Compute/virtualMachines/delete` retire uniquement la suppression des machines virtuelles. AssignableScopes doit utiliser l'ID d'étendue complet de l'abonnement (`/subscriptions/{subscriptionId}`), ce qui rend aussi le rôle attribuable aux groupes de ressources et aux ressources qu'il contient."
  options:
    notdata: { en: NotDataActions only subtracts data plane actions; VM deletion is a control plane action., fr: NotDataActions ne retire que des actions du plan de données ; la suppression d'une machine virtuelle est une action du plan de contrôle. }
    deny: { en: "A role definition has no DenyActions property; denying requires a deny assignment, which is a different object.", fr: "Une définition de rôle n'a pas de propriété DenyActions ; un refus nécessite une affectation de refus, qui est un objet différent." }
    excl: { en: ExcludedActions is not a property of an Azure role definition., fr: ExcludedActions n'est pas une propriété d'une définition de rôle Azure. }
    vmwrite: { en: "Excluding write would prevent creating and updating VMs, which operators must be able to do.", fr: "Exclure write empêcherait de créer et de mettre à jour des machines virtuelles, ce que les opérateurs doivent pouvoir faire." }
    vmdealloc: { en: Deallocating is a normal operation the operators must keep; it is not deletion., fr: La libération est une opération normale que les opérateurs doivent conserver ; ce n'est pas une suppression. }
    rgdelete: { en: The role does not grant resource group deletion in the first place; this does not block VM deletion., fr: Le rôle n'accorde pas la suppression de groupes de ressources au départ ; cela n'empêche pas la suppression des machines virtuelles. }
    root: { en: "A custom role can't set AssignableScopes to the root scope (/); it would also exceed Sub-Apps.", fr: "Un rôle personnalisé ne peut pas définir AssignableScopes sur l'étendue racine (/), qui dépasserait de plus Sub-Apps." }
    subwild: { en: Wildcards are not allowed in AssignableScopes., fr: Les caractères génériques ne sont pas autorisés dans AssignableScopes. }
    subname: { en: "A scope uses the subscription ID (GUID), not its display name.", fr: "Une étendue utilise l'ID d'abonnement (GUID), pas son nom d'affichage." }
references:
  - title: Azure custom roles - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - title: Understand Azure role definitions - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
