id: id-interpret-assignments
objective: "1.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The following table shows the role assignments in subscription **Sub1**. User1 is a member of the group **IT-Ops**. The storage account **st1** is in RG1.

    Answer each prompt by selecting the role assignment that grants the permission.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le tableau suivant présente les attributions de rôles de l'abonnement **Sub1**. User1 est membre du groupe **IT-Ops**. Le compte de stockage **st1** se trouve dans RG1.

    Répondez à chaque consigne en sélectionnant l'attribution de rôle qui accorde l'autorisation.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which assignment allows User1 to delete st1?", fr: "Quelle attribution permet à User1 de supprimer st1 ?" }
    - id: p2
      text: { en: "Which assignment allows User2 to assign roles on RG2?", fr: "Quelle attribution permet à User2 d'attribuer des rôles sur RG2 ?" }
  grid:
    header: [{ en: "Principal", fr: "Principal" }, { en: Role, fr: Rôle }, { en: Scope, fr: Étendue }]
    rows:
      - [{ text: { en: "IT-Ops (group)", fr: "IT-Ops (groupe)" } }, { text: Contributor, area: r1 }, { text: "Sub1" }]
      - [{ text: User1 }, { text: Reader, area: r2 }, { text: "RG1" }]
      - [{ text: User1 }, { text: Virtual Machine Contributor, area: r3 }, { text: "RG1" }]
      - [{ text: User2 }, { text: Contributor, area: r4 }, { text: "RG2" }]
      - [{ text: User2 }, { text: User Access Administrator, area: r5 }, { text: "RG2" }]
answer:
  values: { p1: r1, p2: r5 }
explanation:
  correct:
    en: Azure RBAC is additive and assignments are inherited by child scopes. User1 inherits Contributor on Sub1 through IT-Ops, which includes deleting st1 in RG1; Reader and Virtual Machine Contributor do not allow deleting a storage account. Contributor cannot assign roles (it excludes `Microsoft.Authorization/*/Write`), whereas User Access Administrator on RG2 can.
    fr: Azure RBAC est cumulatif et les attributions sont héritées par les étendues enfants. User1 hérite de Contributor sur Sub1 via IT-Ops, ce qui inclut la suppression de st1 dans RG1 ; Reader et Virtual Machine Contributor ne permettent pas de supprimer un compte de stockage. Contributor ne peut pas attribuer de rôles (il exclut `Microsoft.Authorization/*/Write`), contrairement à User Access Administrator sur RG2.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
