id: i1-033-sspr-settings-pages
objective: "1.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has enabled self-service password reset (SSPR) for all users. You must configure SSPR to meet the following requirements.

    On which page of **Entra ID > Password reset** should you configure each requirement? To answer, drag the appropriate pages to the correct requirements. Each page may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a activé la réinitialisation de mot de passe en libre-service (SSPR) pour tous les utilisateurs. Vous devez configurer SSPR pour satisfaire les exigences suivantes.

    Dans quelle page de **Entra ID > Réinitialisation du mot de passe** devez-vous configurer chaque exigence ? Pour répondre, faites glisser les pages appropriées vers les exigences correspondantes. Chaque page peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: props, text: Properties }
    - { id: methods, text: Authentication methods }
    - { id: reg, text: Registration }
    - { id: notif, text: Notifications }
    - { id: custom, text: Customization }
    - { id: onprem, text: On-premises integration }
  targets:
    - id: t1
      text: { en: "Users must provide two methods to reset their password.", fr: "Les utilisateurs doivent fournir deux méthodes pour réinitialiser leur mot de passe." }
    - id: t2
      text: { en: "Users must be prompted to register their methods when they sign in, and reconfirm them every 180 days.", fr: "Les utilisateurs doivent être invités à inscrire leurs méthodes à la connexion, et à les reconfirmer tous les 180 jours." }
    - id: t3
      text: { en: "Users must receive an email when their password is reset.", fr: "Les utilisateurs doivent recevoir un e-mail lorsque leur mot de passe est réinitialisé." }
    - id: t4
      text: { en: "The Contact your administrator link must point to https://support.litware.com.", fr: "Le lien Contactez votre administrateur doit pointer vers https://support.litware.com." }
answer:
  mapping: { t1: methods, t2: reg, t3: notif, t4: custom }
explanation:
  correct:
    en: "Authentication methods sets the number of methods required to reset. Registration sets Require users to register when signing in and the number of days before reconfirmation (0 to 730). Notifications contains Notify users on password resets. Customization lets you replace the Contact your administrator link with a custom helpdesk email or URL."
    fr: "Authentication methods définit le nombre de méthodes requises pour réinitialiser. Registration contient l'obligation d'inscription à la connexion et le nombre de jours avant reconfirmation (0 à 730). Notifications contient la notification des utilisateurs lors des réinitialisations. Customization permet de remplacer le lien Contactez votre administrateur par une adresse e-mail ou une URL de support personnalisée."
  options:
    props: { en: "Properties only defines who is enabled for SSPR (None, Selected or All).", fr: "Properties définit seulement qui est activé pour SSPR (None, Selected ou All)." }
    onprem: { en: "On-premises integration configures password writeback for hybrid users.", fr: "On-premises integration configure la réécriture du mot de passe pour les utilisateurs hybrides." }
references:
  - title: Enable Microsoft Entra self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
  - title: Self-service password reset deep dive
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
