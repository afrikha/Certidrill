id: i3-sub-vcpu-quota
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator at Litware tries to deploy ten new Dsv5-series virtual machines in West Europe in a subscription named **Sub-Render**. The deployment fails because the number of vCPUs would exceed the limit of the subscription for that VM family in the region.

    You need to make the deployment succeed in the same subscription and region.

    What should you do?
  fr: |
    Un administrateur de Litware essaie de déployer dix nouvelles machines virtuelles de la série Dsv5 dans West Europe dans un abonnement nommé **Sub-Render**. Le déploiement échoue, car le nombre de vCPU dépasserait la limite de l'abonnement pour cette famille de machines virtuelles dans la région.

    Vous devez faire réussir le déploiement dans le même abonnement et la même région.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Request an increase of the VM-family vCPU quota from the Quotas page.", fr: "Demander une augmentation du quota de vCPU de la famille de machines virtuelles depuis la page Quotas." } }
    - { id: b, text: { en: "Create a budget with a higher amount for Sub-Render.", fr: "Créer un budget d'un montant plus élevé pour Sub-Render." } }
    - { id: c, text: { en: "Move Sub-Render to another management group.", fr: "Déplacer Sub-Render vers un autre groupe d'administration." } }
    - { id: d, text: { en: "Deploy the virtual machines in a new resource group.", fr: "Déployer les machines virtuelles dans un nouveau groupe de ressources." } }
answer: { optionId: a }
explanation:
  correct:
    en: Standard vCPU quotas are enforced for each subscription in each region, at the regional level and per VM family. You raise an adjustable quota by submitting a new quota request from the Quotas page (or a support request for a quota that cannot be adjusted there).
    fr: "Les quotas de vCPU standard s'appliquent à chaque abonnement dans chaque région, au niveau régional et par famille de machines virtuelles. Vous augmentez un quota ajustable en envoyant une nouvelle demande de quota depuis la page Quotas (ou une demande de support pour un quota non ajustable à cet endroit)."
  options:
    b: { en: "Budgets only send notifications; they do not change quotas.", fr: "Les budgets envoient seulement des notifications ; ils ne modifient pas les quotas." }
    c: { en: "Management groups organize governance; they do not change the quota of a subscription.", fr: "Les groupes d'administration organisent la gouvernance ; ils ne modifient pas le quota d'un abonnement." }
    d: { en: "The quota applies to the whole subscription in the region, whatever the resource group.", fr: "Le quota s'applique à l'ensemble de l'abonnement dans la région, quel que soit le groupe de ressources." }
references:
  - title: Increase VM-family vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/quotas/per-vm-quota-requests
