id: i1-014-dynamic-rule-evaluation
objective: "1.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. You create two dynamic membership groups:

    - **GRP-1** with the rule `(user.department -eq "Sales") -and (user.usageLocation -in ["FR","BE"]) -and (user.userType -eq "Member")`
    - **GRP-2** with the rule `(user.department -eq "Sales") -and -not (user.usageLocation -in ["FR","BE"])`

    The tenant contains the users shown in the following table.

    Answer each prompt by selecting the appropriate user.
  fr: |
    Contoso dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1. Vous créez deux groupes d'appartenance dynamique :

    - **GRP-1** avec la règle `(user.department -eq "Sales") -and (user.usageLocation -in ["FR","BE"]) -and (user.userType -eq "Member")`
    - **GRP-2** avec la règle `(user.department -eq "Sales") -and -not (user.usageLocation -in ["FR","BE"])`

    Le locataire contient les utilisateurs indiqués dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'utilisateur approprié.
body:
  prompts:
    - id: p1
      text: { en: "The only user who becomes a member of GRP-1", fr: "Le seul utilisateur qui devient membre de GRP-1" }
    - id: p2
      text: { en: "The only user who becomes a member of GRP-2", fr: "Le seul utilisateur qui devient membre de GRP-2" }
  grid:
    header: [{ en: Name, fr: Nom }, department, usageLocation, userType]
    rows:
      - [{ text: Alice, area: alice }, { text: Sales }, { text: FR }, { text: Guest }]
      - [{ text: Bruno, area: bruno }, { text: Sales }, { text: BE }, { text: Member }]
      - [{ text: Chloé, area: chloe }, { text: Marketing }, { text: FR }, { text: Member }]
      - [{ text: David, area: david }, { text: Sales }, { text: CH }, { text: Member }]
answer:
  values: { p1: bruno, p2: david }
explanation:
  correct:
    en: "GRP-1 requires all three conditions; Alice is a guest and Chloé isn't in Sales, so only Bruno matches. GRP-2 requires Sales and a usage location that is neither FR nor BE; Alice and Bruno are excluded by their location, and only David (CH) matches."
    fr: "GRP-1 exige les trois conditions : Alice est invitée et Chloé n'est pas dans Sales, donc seul Bruno correspond. GRP-2 exige Sales et un emplacement d'utilisation qui n'est ni FR ni BE : Alice et Bruno sont exclus par leur emplacement, et seul David (CH) correspond."
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
