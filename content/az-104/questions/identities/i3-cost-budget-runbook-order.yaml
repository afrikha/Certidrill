id: i3-cost-budget-runbook-order
objective: "1.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs non-critical test virtual machines in a resource group named **RG-QA**. When the actual cost of RG-QA reaches 90 percent of a monthly amount of 2,000 USD, all virtual machines in RG-QA must be stopped automatically.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys exécute des machines virtuelles de test non critiques dans un groupe de ressources nommé **RG-QA**. Lorsque le coût réel de RG-QA atteint 90 % d'un montant mensuel de 2 000 USD, toutes les machines virtuelles de RG-QA doivent être arrêtées automatiquement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: runbook, text: { en: "Create an Azure Automation account and publish a runbook that stops the VMs in RG-QA.", fr: "Créer un compte Azure Automation et publier un runbook qui arrête les machines virtuelles de RG-QA." } }
    - { id: ag, text: { en: "Create an action group that runs the runbook.", fr: "Créer un groupe d'actions qui exécute le runbook." } }
    - { id: budget, text: { en: "Create a monthly budget of 2,000 USD on RG-QA with an actual cost alert at 90 percent that uses the action group.", fr: "Créer un budget mensuel de 2 000 USD sur RG-QA avec une alerte sur le coût réel à 90 % qui utilise le groupe d'actions." } }
    - { id: advisor, text: { en: "Configure the Azure Advisor right-sizing rule for RG-QA.", fr: "Configurer la règle de redimensionnement Azure Advisor pour RG-QA." } }
    - { id: lock, text: { en: "Apply a ReadOnly lock to RG-QA.", fr: "Appliquer un verrou ReadOnly à RG-QA." } }
    - { id: anomaly, text: { en: "Create an anomaly alert for the subscription.", fr: "Créer une alerte d'anomalie pour l'abonnement." } }
answer:
  sequence: [runbook, ag, budget]
explanation:
  correct:
    en: Budgets never stop resources by themselves; they can call an action group when a threshold is met at the subscription or resource group scope. The action group needs an existing runbook to run, and the budget alert needs an existing action group to select, so you create the runbook, then the action group, then the budget.
    fr: "Les budgets n'arrêtent jamais les ressources d'eux-mêmes ; ils peuvent appeler un groupe d'actions lorsqu'un seuil est atteint, à l'étendue de l'abonnement ou du groupe de ressources. Le groupe d'actions a besoin d'un runbook existant à exécuter, et l'alerte budgétaire d'un groupe d'actions existant à sélectionner : vous créez donc le runbook, puis le groupe d'actions, puis le budget."
  options:
    advisor: { en: "Advisor only filters right-sizing recommendations; it stops nothing.", fr: "Advisor filtre seulement les recommandations de redimensionnement ; il n'arrête rien." }
    lock: { en: "A ReadOnly lock would even prevent the runbook from stopping the VMs.", fr: "Un verrou ReadOnly empêcherait même le runbook d'arrêter les machines virtuelles." }
    anomaly: { en: "Anomaly alerts send emails only and cannot call an action group.", fr: "Les alertes d'anomalie envoient seulement des e-mails et ne peuvent pas appeler un groupe d'actions." }
references:
  - title: Tutorial - Create and manage budgets
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
  - title: Azure billing and cost management budget scenario
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/manage/cost-management-budget-scenario
