id: i3-tag-no-inheritance
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A resource group named **RG-HR** contains a virtual machine named **VM-HR1** that has the tag `App=Payroll`. No Azure Policy assignment exists. You add the tag `Dept=HR` to RG-HR.

    Which tags does VM-HR1 have?
  fr: |
    Un groupe de ressources nommé **RG-HR** contient une machine virtuelle nommée **VM-HR1** qui a l'étiquette `App=Payroll`. Aucune attribution Azure Policy n'existe. Vous ajoutez l'étiquette `Dept=HR` à RG-HR.

    Quelles étiquettes VM-HR1 possède-t-elle ?
body:
  options:
    - { id: a, text: { en: "App=Payroll only", fr: "App=Payroll uniquement" } }
    - { id: b, text: { en: "App=Payroll and Dept=HR", fr: "App=Payroll et Dept=HR" } }
    - { id: c, text: { en: "Dept=HR only", fr: "Dept=HR uniquement" } }
    - { id: d, text: { en: "No tags", fr: "Aucune étiquette" } }
answer: { optionId: a }
explanation:
  correct:
    en: Resources do not inherit the tags applied to their resource group or subscription. VM-HR1 keeps only its own tag. To copy tags from a resource group to its resources, assign a tag inheritance policy such as Inherit a tag from the resource group.
    fr: "Les ressources n'héritent pas des étiquettes appliquées à leur groupe de ressources ou à leur abonnement. VM-HR1 conserve uniquement sa propre étiquette. Pour copier les étiquettes d'un groupe de ressources vers ses ressources, attribuez une stratégie d'héritage d'étiquette, comme Inherit a tag from the resource group."
  options:
    b: { en: "Tags are not inherited automatically; a policy would be required.", fr: "Les étiquettes ne sont pas héritées automatiquement ; une stratégie serait nécessaire." }
    c: { en: "Tagging the resource group never changes or removes the tags of its resources.", fr: "L'étiquetage du groupe de ressources ne modifie ni ne supprime jamais les étiquettes de ses ressources." }
    d: { en: "The existing App tag on the VM is not affected.", fr: "L'étiquette App existante de la machine virtuelle n'est pas affectée." }
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
