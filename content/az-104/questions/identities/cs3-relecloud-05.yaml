id: cs3-relecloud-05
objective: "1.2.3"
type: hotarea
caseStudy: cs3-relecloud
difficulty: 2
status: draft
stem:
  en: |
    The following table shows the Azure role assignments in Sub-Media.

    For each prompt, select the role assignment that grants Ana the permission.
  fr: |
    Le tableau suivant présente les attributions de rôles Azure dans Sub-Media.

    Pour chaque consigne, sélectionnez l'attribution de rôle qui accorde l'autorisation à Ana.
body:
  prompts:
    - id: p1
      text: { en: "Restart VM-TRN1", fr: "Redémarrer VM-TRN1" }
    - id: p2
      text: { en: "Regenerate the access keys of stmediaraw", fr: "Régénérer les clés d'accès de stmediaraw" }
  grid:
    header: [{ en: "Principal", fr: "Principal" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: GG-MediaOps }, { text: Reader, area: r1 }, { text: Sub-Media }]
      - [{ text: GG-MediaOps }, { text: Virtual Machine Contributor, area: r2 }, { text: RG-Transcode }]
      - [{ text: Ana }, { text: Storage Account Contributor, area: r3 }, { text: stmediaraw }]
      - [{ text: Ben }, { text: Contributor, area: r4 }, { text: RG-Catalog }]
      - [{ text: GG-Finance }, { text: Cost Management Reader, area: r5 }, { text: Sub-Media }]
answer:
  values: { p1: r2, p2: r3 }
explanation:
  correct:
    en: "Ana inherits the role assignments of GG-MediaOps. Virtual Machine Contributor at RG-Transcode is inherited by VM-TRN1 and includes the permission to restart virtual machines. Storage Account Contributor on stmediaraw lets Ana manage the account, including listing and regenerating its access keys. Reader only allows read operations, and the assignments of Ben and GG-Finance don't apply to Ana."
    fr: "Ana hérite des attributions de rôles de GG-MediaOps. Virtual Machine Contributor sur RG-Transcode est hérité par VM-TRN1 et inclut l'autorisation de redémarrer les machines virtuelles. Storage Account Contributor sur stmediaraw permet à Ana de gérer le compte, y compris de lister et de régénérer ses clés d'accès. Reader n'autorise que les opérations de lecture, et les attributions de Ben et de GG-Finance ne s'appliquent pas à Ana."
references:
  - title: "List Azure role assignments using the Azure portal - Azure RBAC"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-portal
  - title: "Azure built-in roles"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
