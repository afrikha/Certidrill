id: cs3-lucerne-03
objective: "1.3.3"
type: single
caseStudy: cs3-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the CostCenter tagging requirement.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence d'étiquetage CostCenter.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the built-in policy Inherit a tag from the resource group if missing to Sub-Publishing, and then create a remediation task.", fr: "Attribuer la stratégie intégrée Inherit a tag from the resource group if missing à Sub-Publishing, puis créer une tâche de correction." } }
    - { id: b, text: { en: "Assign the built-in policy Inherit a tag from the resource group to Sub-Publishing, and then create a remediation task.", fr: "Attribuer la stratégie intégrée Inherit a tag from the resource group à Sub-Publishing, puis créer une tâche de correction." } }
    - { id: c, text: { en: "Assign the built-in policy Append a tag and its value from the resource group to Sub-Publishing.", fr: "Attribuer la stratégie intégrée Append a tag and its value from the resource group à Sub-Publishing." } }
    - { id: d, text: { en: "Do nothing, because resources inherit the tags of their resource group automatically.", fr: "Ne rien faire, car les ressources héritent automatiquement des étiquettes de leur groupe de ressources." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Inherit a tag from the resource group if missing uses the modify effect: it adds the resource group's CostCenter value to resources that don't have the tag and leaves an existing value unchanged. A remediation task applies the modification to the existing resources, which meets the requirement with minimal effort."
    fr: "Inherit a tag from the resource group if missing utilise l'effet modify : elle ajoute la valeur CostCenter du groupe de ressources aux ressources qui n'ont pas l'étiquette et ne modifie pas une valeur existante. Une tâche de correction applique la modification aux ressources existantes, ce qui satisfait l'exigence avec un effort minimal."
  options:
    b: { en: "This policy adds or replaces the tag, so it would overwrite the CostCenter values that project managers set.", fr: "Cette stratégie ajoute ou remplace l'étiquette : elle écraserait les valeurs CostCenter définies par les chefs de projet." }
    c: { en: "The append effect only tags resources when they are created or updated; it can't remediate existing resources.", fr: "L'effet append n'étiquette les ressources que lors de leur création ou mise à jour ; il ne peut pas corriger les ressources existantes." }
    d: { en: "Resources don't inherit tags from their resource group.", fr: "Les ressources n'héritent pas des étiquettes de leur groupe de ressources." }
references:
  - title: "Policy definitions for tagging resources - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
