id: cs1-tailspin-03
objective: "1.1.5"
type: dropdown
caseStudy: cs1-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the password reset requirement for the studio.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de réinitialisation de mot de passe pour le studio.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. Assign [[lic]] licenses to the members of GG-Studio.
      2. In the Microsoft Entra admin center, go to Password reset > Properties and set Self service password reset enabled to [[scope]].
      3. Select the group [[group]], and then select Save.
    fr: |
      1. Attribuez des licences [[lic]] aux membres de GG-Studio.
      2. Dans le Centre d'administration Microsoft Entra, accédez à Réinitialisation du mot de passe > Propriétés et définissez Réinitialisation du mot de passe en libre-service activée sur [[scope]].
      3. Sélectionnez le groupe [[group]], puis sélectionnez Enregistrer.
  slots:
    - id: lic
      options:
        - { id: p1, text: Microsoft Entra ID P1 }
        - { id: p2, text: Microsoft Entra ID P2 }
        - { id: gov, text: Microsoft Entra ID Governance }
    - id: scope
      options:
        - { id: none, text: { en: "None", fr: "Aucun" } }
        - { id: selected, text: { en: "Selected", fr: "Sélectionné" } }
        - { id: all, text: { en: "All", fr: "Tous" } }
    - id: group
      options:
        - { id: studio, text: GG-Studio }
        - { id: allstaff, text: GG-AllStaff }
        - { id: contractors, text: GG-Contractors }
answer:
  values: { lic: p1, scope: selected, group: studio }
explanation:
  correct:
    en: |
      Password reset for cloud-only users is not included in Microsoft Entra ID Free; Microsoft Entra ID P1 is the least expensive of the listed licenses that includes it. Setting SSPR to Selected with GG-Studio enables it only for the employees; GG-AllStaff also contains the contractors through nesting.
    fr: |
      La réinitialisation de mot de passe pour les utilisateurs cloud uniquement n'est pas incluse dans Microsoft Entra ID Free ; Microsoft Entra ID P1 est la licence la moins chère parmi celles proposées qui l'inclut. Définir SSPR sur Sélectionné avec GG-Studio l'active uniquement pour les employés ; GG-AllStaff contient aussi les prestataires par imbrication.
  options:
    p2: { en: "P2 also includes SSPR but costs more than P1.", fr: "P2 inclut aussi SSPR mais coûte plus cher que P1." }
    all: { en: "All would enable SSPR for the contractors too.", fr: "Tous activerait SSPR aussi pour les prestataires." }
    allstaff: { en: "GG-AllStaff includes GG-Contractors as a nested group.", fr: "GG-AllStaff inclut GG-Contractors en tant que groupe imbriqué." }
references:
  - title: Enable Microsoft Entra self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
  - title: License self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-licensing
