id: i1-034-sspr-writeback
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders synchronizes its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID by using Microsoft Entra Connect with password hash synchronization. The tenant has Microsoft Entra ID P1 licenses, and self-service password reset (SSPR) is already enabled for all users.

    Synchronized users can't reset their password with SSPR. You need to enable password writeback by following the procedure recommended by Microsoft.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders synchronise son domaine Active Directory Domain Services (AD DS) local avec Microsoft Entra ID à l'aide de Microsoft Entra Connect et de la synchronisation de hachage de mot de passe. Le locataire dispose de licences Microsoft Entra ID P1, et la réinitialisation de mot de passe en libre-service (SSPR) est déjà activée pour tous les utilisateurs.

    Les utilisateurs synchronisés ne peuvent pas réinitialiser leur mot de passe avec SSPR. Vous devez activer la réécriture du mot de passe en suivant la procédure recommandée par Microsoft.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: perms, text: { en: "In AD DS, grant the Microsoft Entra Connect account the Reset password, Change password, Write lockoutTime, Write pwdLastSet and Unexpire Password permissions.", fr: "Dans AD DS, accorder au compte Microsoft Entra Connect les autorisations Reset password, Change password, Write lockoutTime, Write pwdLastSet et Unexpire Password." } }
    - { id: connect, text: { en: "In the Microsoft Entra Connect wizard, select Customize synchronization options and enable Password writeback on the Optional features page.", fr: "Dans l'assistant Microsoft Entra Connect, sélectionner Customize synchronization options et activer Password writeback dans la page Optional features." } }
    - { id: portal, text: { en: "In Password reset > On-premises integration, select Write back passwords to your on-premises directory and save.", fr: "Dans Réinitialisation du mot de passe > On-premises integration, sélectionner Write back passwords to your on-premises directory et enregistrer." } }
    - { id: none, text: { en: "In Password reset > Properties, set Self service password reset enabled to None.", fr: "Dans Réinitialisation du mot de passe > Properties, définir Self service password reset enabled sur None." } }
    - { id: minage, text: { en: "Set the Minimum password age Group Policy setting to 30 days.", fr: "Définir le paramètre de stratégie de groupe Minimum password age sur 30 jours." } }
    - { id: p2, text: { en: "Assign Microsoft Entra ID P2 licenses to the synchronized users.", fr: "Attribuer des licences Microsoft Entra ID P2 aux utilisateurs synchronisés." } }
answer:
  sequence: [perms, connect, portal]
explanation:
  correct:
    en: "The Microsoft Entra Connect account first needs the permissions to reset passwords in AD DS. Then the Password writeback optional feature is enabled in Microsoft Entra Connect, and finally writeback is turned on for SSPR in the On-premises integration page of the Microsoft Entra admin center."
    fr: "Le compte Microsoft Entra Connect a d'abord besoin des autorisations de réinitialisation de mot de passe dans AD DS. Ensuite, la fonctionnalité facultative Password writeback est activée dans Microsoft Entra Connect, puis la réécriture est activée pour SSPR dans la page On-premises integration du Centre d'administration Microsoft Entra."
  options:
    minage: { en: "Microsoft recommends a minimum password age of 0 so that resets are processed correctly.", fr: "Microsoft recommande un âge minimal du mot de passe de 0 pour que les réinitialisations soient traitées correctement." }
    p2: { en: "Writeback is included in Microsoft Entra ID P1, which the tenant already has.", fr: "La réécriture est incluse dans Microsoft Entra ID P1, dont le locataire dispose déjà." }
references:
  - title: Enable Microsoft Entra Password Writeback
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr-writeback
