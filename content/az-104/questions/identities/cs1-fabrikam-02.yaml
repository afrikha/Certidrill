id: cs1-fabrikam-02
objective: "1.2.2"
type: dropdown
caseStudy: cs1-fabrikam
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the access requirement for GG-PlantOps.

    How should you complete the role assignment? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence d'accès pour GG-PlantOps.

    Comment devez-vous compléter l'attribution de rôle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assign the [[role]] role to GG-PlantOps at the scope of [[scope]].
    fr: |
      Attribuez le rôle [[role]] à GG-PlantOps à l'étendue [[scope]].
  slots:
    - id: role
      options:
        - { id: vmc, text: Virtual Machine Contributor }
        - { id: contrib, text: Contributor }
        - { id: owner, text: Owner }
        - { id: reader, text: Reader }
    - id: scope
      options:
        - { id: mgplants, text: { en: "the MG-Plants management group", fr: "du groupe d'administration MG-Plants" } }
        - { id: mgfab, text: { en: "the MG-Fabrikam management group", fr: "du groupe d'administration MG-Fabrikam" } }
        - { id: subs, text: { en: "the Sub-Plant-US and Sub-Plant-APAC subscriptions", fr: "des abonnements Sub-Plant-US et Sub-Plant-APAC" } }
        - { id: rgs, text: { en: "the RG-Plant-US and RG-Plant-APAC resource groups", fr: "des groupes de ressources RG-Plant-US et RG-Plant-APAC" } }
answer:
  values: { role: vmc, scope: mgplants }
explanation:
  correct:
    en: |
      Virtual Machine Contributor lets users manage virtual machines, but not the virtual networks or storage accounts they connect to, and it does not allow role assignments. Assigned at MG-Plants, it is inherited by every plant subscription, including the subscriptions of future plants, without granting access to Sub-Corp.
    fr: |
      Virtual Machine Contributor permet de gérer les machines virtuelles, mais pas les réseaux virtuels ni les comptes de stockage auxquels elles sont connectées, et ne permet pas d'attribuer des rôles. Attribué à MG-Plants, il est hérité par chaque abonnement d'usine, y compris ceux des futures usines, sans donner accès à Sub-Corp.
  options:
    contrib: { en: "Contributor can also manage virtual networks and storage accounts.", fr: "Contributor permet aussi de gérer les réseaux virtuels et les comptes de stockage." }
    owner: { en: "Owner can manage all resources and grant access to other users.", fr: "Owner permet de gérer toutes les ressources et d'accorder des accès à d'autres utilisateurs." }
    reader: { en: "Reader can only view resources; it cannot start, stop, or resize virtual machines.", fr: "Reader permet uniquement de consulter les ressources ; il ne permet pas de démarrer, d'arrêter ni de redimensionner des machines virtuelles." }
    mgfab: { en: "MG-Fabrikam also contains Sub-Corp, which is not a plant subscription.", fr: "MG-Fabrikam contient aussi Sub-Corp, qui n'est pas un abonnement d'usine." }
    subs: { en: "Subscription-level assignments do not apply to the subscriptions of future plants.", fr: "Des attributions au niveau des abonnements ne s'appliquent pas aux abonnements des futures usines." }
    rgs: { en: "Resource group assignments do not cover new resource groups or future plant subscriptions.", fr: "Des attributions au niveau des groupes de ressources ne couvrent ni les nouveaux groupes de ressources ni les futurs abonnements d'usine." }
references:
  - title: Azure built-in roles for Compute
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
