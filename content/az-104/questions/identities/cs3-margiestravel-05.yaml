id: cs3-margiestravel-05
objective: "1.1.3"
type: single
caseStudy: cs3-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the licensing requirement for the travel agents.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de licences des agents de voyages.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Microsoft 365 Business Premium license to GG-Agents-All.", fr: "Attribuer la licence Microsoft 365 Business Premium à GG-Agents-All." } }
    - { id: b, text: { en: "Assign the Microsoft 365 Business Premium license to GG-Agents-Lisbon, GG-Agents-Paris and GG-Agents-Madrid.", fr: "Attribuer la licence Microsoft 365 Business Premium à GG-Agents-Lisbon, GG-Agents-Paris et GG-Agents-Madrid." } }
    - { id: c, text: { en: "Assign the Microsoft 365 Business Premium license directly to each of the 280 agents.", fr: "Attribuer la licence Microsoft 365 Business Premium directement à chacun des 280 agents." } }
    - { id: d, text: { en: "Change the membership type of GG-Agents-All to Dynamic User, and then assign the license to GG-Agents-All.", fr: "Changer le type d'appartenance de GG-Agents-All en Utilisateur dynamique, puis attribuer la licence à GG-Agents-All." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Group-based licensing assigns the license to every user who is a direct member of the group, including users added later. It doesn't support nested groups: a license assigned to a group applies only to its first-level user members. The agents are direct members of the three agency groups, so you assign the license to those groups."
    fr: "La licence basée sur un groupe attribue la licence à chaque utilisateur membre direct du groupe, y compris les utilisateurs ajoutés plus tard. Elle ne prend pas en charge les groupes imbriqués : une licence attribuée à un groupe ne s'applique qu'à ses utilisateurs membres de premier niveau. Les agents sont membres directs des trois groupes d'agence ; vous attribuez donc la licence à ces groupes."
  options:
    a: { en: "GG-Agents-All contains only nested groups, so no user would receive a license.", fr: "GG-Agents-All ne contient que des groupes imbriqués : aucun utilisateur ne recevrait de licence." }
    c: { en: "Direct assignment doesn't license new agents automatically and increases administrative effort.", fr: "L'attribution directe n'accorde pas automatiquement de licence aux nouveaux agents et augmente l'effort d'administration." }
    d: { en: "No dynamic membership rule is defined for the agents, and rebuilding membership adds effort without being required.", fr: "Aucune règle d'appartenance dynamique n'est définie pour les agents, et reconstruire l'appartenance ajoute un effort inutile." }
references:
  - title: "Assign or unassign licenses to a group in the Microsoft 365 admin center"
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
