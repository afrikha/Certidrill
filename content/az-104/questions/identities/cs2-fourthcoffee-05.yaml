id: cs2-fourthcoffee-05
objective: "1.1.5"
type: yesno_statements
caseStudy: cs2-fourthcoffee
difficulty: 3
status: draft
stem:
  en: |
    You plan to configure self-service password reset (SSPR) to meet the identity requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous prévoyez de configurer la réinitialisation de mot de passe en libre-service (SSPR) pour satisfaire l'exigence d'identité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: You must set SSPR to Selected and select SG-StoreManagers.
        fr: Vous devez définir SSPR sur Sélectionné et sélectionner SG-StoreManagers.
    - id: s2
      text:
        en: Ana and Liam will be able to use security questions as one of their two methods.
        fr: Ana et Liam pourront utiliser les questions de sécurité comme l'une de leurs deux méthodes.
    - id: s3
      text:
        en: Password writeback is not required for the store managers to reset their passwords.
        fr: La réécriture du mot de passe n'est pas nécessaire pour que les responsables de magasin réinitialisent leur mot de passe.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Selected scope limits SSPR to one group. Accounts with an administrator role such as Helpdesk Administrator always use the two-gate administrator policy, because the tenant has a custom domain; that policy requires two methods and prohibits security questions. The users are cloud-only, so no on-premises directory has to be updated.
    fr: |
      L'étendue Sélectionné limite SSPR à un groupe. Les comptes qui ont un rôle d'administrateur comme Helpdesk Administrator utilisent toujours la stratégie d'administrateur à deux portes, car le locataire a un domaine personnalisé ; cette stratégie exige deux méthodes et interdit les questions de sécurité. Les utilisateurs sont uniquement cloud ; aucun annuaire local ne doit donc être mis à jour.
references:
  - title: "Self-service password reset policies - Microsoft Entra ID"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-policy
  - title: "Enable Microsoft Entra self-service password reset - Microsoft Entra ID"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
