id: i2-builtin-storage-contrib-listkeys
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a storage account named **stprosedocs** that allows Shared Key authorization. A user named Ops1 has a single role assignment: **Storage Account Contributor** on stprosedocs. Ops1 has no data plane role, and anonymous access is disabled on every container.

    Ops1 opens a container of stprosedocs in the Azure portal and can list and download its blobs. The security team expected Ops1 to manage the account only, without access to blob data.

    What explains why Ops1 can read the blobs?
  fr: |
    Proseware dispose d'un compte de stockage nommé **stprosedocs** qui autorise l'autorisation par clé partagée (Shared Key). Un utilisateur nommé Ops1 dispose d'une seule attribution de rôle : **Storage Account Contributor** sur stprosedocs. Ops1 n'a aucun rôle du plan de données, et l'accès anonyme est désactivé sur tous les conteneurs.

    Ops1 ouvre un conteneur de stprosedocs dans le portail Azure et peut lister et télécharger ses blobs. L'équipe de sécurité s'attendait à ce qu'Ops1 gère uniquement le compte, sans accès aux données blob.

    Qu'est-ce qui explique qu'Ops1 puisse lire les blobs ?
body:
  options:
    - id: a
      text:
        en: The role includes the `Microsoft.Storage/storageAccounts/listkeys/action` action, so the portal authorizes the requests with the account access key.
        fr: Le rôle inclut l'action `Microsoft.Storage/storageAccounts/listkeys/action` ; le portail autorise donc les requêtes avec la clé d'accès du compte.
    - id: b
      text:
        en: The role includes the blob DataActions of Storage Blob Data Contributor, so Ops1 reads the blobs with Microsoft Entra authorization.
        fr: Le rôle inclut les DataActions blob de Storage Blob Data Contributor ; Ops1 lit donc les blobs avec l'autorisation Microsoft Entra.
    - id: c
      text:
        en: Control plane permissions on a storage account are always inherited by the data plane, whatever the authorization method.
        fr: Les autorisations du plan de contrôle sur un compte de stockage sont toujours héritées par le plan de données, quelle que soit la méthode d'autorisation.
    - id: d
      text:
        en: The portal generates a user delegation SAS for every user who has a role assignment on the storage account.
        fr: Le portail génère une SAS de délégation d'utilisateur pour chaque utilisateur qui dispose d'une attribution de rôle sur le compte de stockage.
answer: { optionId: a }
explanation:
  correct:
    en: Storage Account Contributor provides access to the account keys. When a user opens blob data in the portal, the portal first checks for the listkeys action; if the user has it, the portal uses the account key (Shared Key) instead of Microsoft Entra credentials. To prevent this, disallow Shared Key authorization or use a role without listkeys and a data role.
    fr: Storage Account Contributor donne accès aux clés du compte. Quand un utilisateur ouvre des données blob dans le portail, le portail vérifie d'abord l'action listkeys ; si l'utilisateur en dispose, le portail utilise la clé du compte (Shared Key) au lieu des informations d'identification Microsoft Entra. Pour l'éviter, interdisez l'autorisation par clé partagée ou utilisez un rôle sans listkeys et un rôle de données.
  options:
    b:
      en: Storage Account Contributor has no DataActions; it is a management (control plane) role.
      fr: Storage Account Contributor n'a aucune DataAction ; c'est un rôle de gestion (plan de contrôle).
    c:
      en: Control plane access is not inherited by the data plane when Microsoft Entra authorization is used; data access requires DataActions.
      fr: L'accès au plan de contrôle n'est pas hérité par le plan de données lorsque l'autorisation Microsoft Entra est utilisée ; l'accès aux données nécessite des DataActions.
    d:
      en: The portal does not create user delegation SAS tokens on its own; it uses either the account key or the user's Microsoft Entra account.
      fr: Le portail ne crée pas de lui-même de jetons SAS de délégation d'utilisateur ; il utilise soit la clé du compte, soit le compte Microsoft Entra de l'utilisateur.
references:
  - title: Authorize access to blob data in the Azure portal - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal
  - title: Azure built-in roles for Storage - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage
