id: i1-025-new-mginvitation
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You manage the Microsoft Entra tenant of Contoso. You need to invite **kim@fabrikam.com** as a B2B guest user by using Microsoft Graph PowerShell. Kim must receive an invitation email. The connection must request the least privileged permission scope.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez le locataire Microsoft Entra de Contoso. Vous devez inviter **kim@fabrikam.com** comme utilisateur invité B2B avec Microsoft Graph PowerShell. Kim doit recevoir un e-mail d'invitation. La connexion doit demander l'étendue d'autorisation la moins privilégiée.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Connect-MgGraph -Scopes [[scope]]
    [[cmd]] -InvitedUserDisplayName "Kim Akers" `
      -InvitedUserEmailAddress "kim@fabrikam.com" `
      -InviteRedirectUrl "https://myapplications.microsoft.com" `
      [[send]]
  slots:
    - id: scope
      options:
        - { id: invite, text: "'User.Invite.All'" }
        - { id: dirread, text: "'Directory.Read.All'" }
        - { id: groupsrw, text: "'Group.ReadWrite.All'" }
        - { id: userread, text: "'User.Read'" }
    - id: cmd
      options:
        - { id: newinv, text: New-MgInvitation }
        - { id: newuser, text: New-MgUser }
        - { id: newguest, text: New-MgGuestUser }
        - { id: mail, text: Send-MgUserMail }
    - id: send
      options:
        - { id: sendmsg, text: "-SendInvitationMessage:$true" }
        - { id: reset, text: -ResetRedemption }
        - { id: type, text: -InvitedUserType Guest }
        - { id: mailen, text: "-MailEnabled:$true" }
answer:
  values: { scope: invite, cmd: newinv, send: sendmsg }
explanation:
  correct:
    en: "`New-MgInvitation` calls the Microsoft Graph invitation API and creates the guest account in the tenant. The `User.Invite.All` scope is enough to invite guests. `-SendInvitationMessage:$true` makes the service email the invitation to Kim; the guest's UPN will look like `kim_fabrikam.com#EXT#@contoso.onmicrosoft.com`."
    fr: "`New-MgInvitation` appelle l'API d'invitation Microsoft Graph et crée le compte invité dans le locataire. L'étendue `User.Invite.All` suffit pour inviter des invités. `-SendInvitationMessage:$true` fait envoyer l'invitation par e-mail à Kim ; l'UPN de l'invité ressemblera à `kim_fabrikam.com#EXT#@contoso.onmicrosoft.com`."
  options:
    dirread: { en: "Directory.Read.All only allows reading directory data.", fr: "Directory.Read.All permet seulement de lire les données de l'annuaire." }
    newuser: { en: "New-MgUser creates an internal account with a password, not a B2B invitation.", fr: "New-MgUser crée un compte interne avec un mot de passe, pas une invitation B2B." }
    reset: { en: "-ResetRedemption reinvites an existing guest; it is not used for a first invitation.", fr: "-ResetRedemption réinvite un invité existant ; il ne sert pas à une première invitation." }
    type: { en: "Guest is already the default user type, and this parameter doesn't send the email.", fr: "Guest est déjà le type d'utilisateur par défaut, et ce paramètre n'envoie pas l'e-mail." }
references:
  - title: "Quickstart: Add a guest user with PowerShell"
    url: https://learn.microsoft.com/en-us/entra/external-id/b2b-quickstart-invite-powershell
