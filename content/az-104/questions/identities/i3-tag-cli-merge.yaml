id: i3-tag-cli-merge
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A storage account named **stwingtip01** in a resource group named **RG-Web** already has the tags `Env=Prod` and `Team=Web`. You need to add the tag `CostCenter=4410` while keeping the existing tags.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **stwingtip01**, situé dans un groupe de ressources nommé **RG-Web**, possède déjà les étiquettes `Env=Prod` et `Team=Web`. Vous devez ajouter l'étiquette `CostCenter=4410` en conservant les étiquettes existantes.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    id=$(az resource show -g RG-Web -n stwingtip01 \
      --resource-type Microsoft.Storage/storageAccounts --query id -o tsv)

    [[cmd]] --resource-id $id --operation [[op]] --tags CostCenter=4410
  slots:
    - id: cmd
      options:
        - { id: update, text: az tag update }
        - { id: create, text: az tag create }
        - { id: add, text: az tag add-value }
        - { id: group, text: az group update }
    - id: op
      options:
        - { id: merge, text: Merge }
        - { id: replace, text: Replace }
        - { id: delete, text: Delete }
        - { id: append, text: Append }
answer:
  values: { cmd: update, op: merge }
explanation:
  correct:
    en: "`az tag update` with `--operation Merge` adds the new tags to the existing ones; if a tag name already exists, only its value changes. `az tag create` replaces the whole set of tags, and `--operation Replace` would also leave only CostCenter on the account."
    fr: "`az tag update` avec `--operation Merge` ajoute les nouvelles étiquettes aux existantes ; si un nom d'étiquette existe déjà, seule sa valeur change. `az tag create` remplace l'ensemble des étiquettes, et `--operation Replace` ne laisserait lui aussi que CostCenter sur le compte."
  options:
    create: { en: "az tag create replaces all tags and has no --operation parameter.", fr: "az tag create remplace toutes les étiquettes et n'a pas de paramètre --operation." }
    add: { en: "az tag add-value adds a value to a predefined tag name in the subscription; it does not tag a resource.", fr: "az tag add-value ajoute une valeur à un nom d'étiquette prédéfini dans l'abonnement ; elle n'applique pas d'étiquette à une ressource." }
    group: { en: "az group update changes a resource group, not a storage account.", fr: "az group update modifie un groupe de ressources, pas un compte de stockage." }
    delete: { en: "Delete removes the listed tags.", fr: "Delete supprime les étiquettes indiquées." }
references:
  - title: Tag resources, resource groups, and subscriptions with Azure CLI
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources-cli
