id: i2-scope-subscription-contributor
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following Azure hierarchy:

    - Management group **MG-Corp**
      - Subscription **Sub-Finance**
        - Resource group **RG-Ledger** (contains a storage account named **stledger**)
      - Subscription **Sub-HR**
        - Resource group **RG-Payroll**

    A user named Fin1 has a single role assignment: **Contributor** at the scope of **Sub-Finance**.

    Which two actions can Fin1 perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de la hiérarchie Azure suivante :

    - Groupe d'administration **MG-Corp**
      - Abonnement **Sub-Finance**
        - Groupe de ressources **RG-Ledger** (contient un compte de stockage nommé **stledger**)
      - Abonnement **Sub-HR**
        - Groupe de ressources **RG-Payroll**

    Un utilisateur nommé Fin1 dispose d'une seule attribution de rôle : **Contributor** à l'étendue de **Sub-Finance**.

    Quelles sont les deux actions que Fin1 peut effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the redundancy of stledger.", fr: "Modifier la redondance de stledger." } }
    - { id: b, text: { en: "Create a new resource group in Sub-Finance.", fr: "Créer un groupe de ressources dans Sub-Finance." } }
    - { id: c, text: { en: "Create a virtual machine in RG-Payroll.", fr: "Créer une machine virtuelle dans RG-Payroll." } }
    - { id: d, text: { en: "Assign the Reader role to a colleague on RG-Ledger.", fr: "Attribuer le rôle Reader à un collègue sur RG-Ledger." } }
    - { id: e, text: { en: "Move Sub-Finance to another management group.", fr: "Déplacer Sub-Finance vers un autre groupe d'administration." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: An assignment at the subscription scope is inherited by every resource group and resource in it, so Fin1 can manage stledger. Contributor at the subscription also lets Fin1 create resource groups in that subscription.
    fr: Une attribution à l'étendue de l'abonnement est héritée par tous les groupes de ressources et toutes les ressources qu'il contient ; Fin1 peut donc gérer stledger. Contributor sur l'abonnement permet aussi à Fin1 de créer des groupes de ressources dans cet abonnement.
  options:
    c:
      en: RG-Payroll belongs to Sub-HR; access is inherited downward only, not by sibling subscriptions.
      fr: RG-Payroll appartient à Sub-HR ; l'accès n'est hérité que vers le bas, pas par les abonnements voisins.
    d:
      en: Contributor excludes `Microsoft.Authorization/*/Write`, so Fin1 cannot create role assignments.
      fr: Contributor exclut `Microsoft.Authorization/*/Write` ; Fin1 ne peut donc pas créer d'attributions de rôles.
    e:
      en: Moving a subscription requires write permissions on the source and target management groups and role assignment write permissions on the subscription (for example, Owner); Contributor on the subscription grants neither.
      fr: Déplacer un abonnement nécessite des autorisations d'écriture sur les groupes d'administration source et cible, ainsi que l'écriture d'attributions de rôles sur l'abonnement (par exemple Owner) ; Contributor sur l'abonnement n'accorde ni l'un ni l'autre.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: Azure built-in roles for Privileged - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged
