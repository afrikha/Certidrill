id: i3-policy-remediation-cli-order
objective: "1.3.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a custom policy definition named **Add-CostCenter-Tag** that uses the `modify` effect. Its `roleDefinitionIds` property lists the Tag Contributor role. Hundreds of existing resources in a subscription named **Sub-Retail** are missing the tag.

    You need to assign the definition to Sub-Retail by using the Azure CLI and bring the existing resources into compliance.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'une définition de stratégie personnalisée nommée **Add-CostCenter-Tag** qui utilise l'effet `modify`. Sa propriété `roleDefinitionIds` liste le rôle Tag Contributor. Des centaines de ressources existantes d'un abonnement nommé **Sub-Retail** n'ont pas l'étiquette.

    Vous devez attribuer la définition à Sub-Retail avec Azure CLI et rendre les ressources existantes conformes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: assign, text: { en: "Run `az policy assignment create` with `--mi-system-assigned` and `--location`.", fr: "Exécuter `az policy assignment create` avec `--mi-system-assigned` et `--location`." } }
    - { id: role, text: { en: "Assign the Tag Contributor role on Sub-Retail to the managed identity of the assignment.", fr: "Attribuer le rôle Tag Contributor sur Sub-Retail à l'identité managée de l'attribution." } }
    - { id: remediate, text: { en: "Run `az policy remediation create` for the assignment.", fr: "Exécuter `az policy remediation create` pour l'attribution." } }
    - { id: exempt, text: { en: "Create a Waiver exemption for the non-compliant resources.", fr: "Créer une exemption Waiver pour les ressources non conformes." } }
    - { id: donot, text: { en: "Set the enforcement mode of the assignment to DoNotEnforce.", fr: "Définir le mode d'application de l'attribution sur DoNotEnforce." } }
    - { id: lock, text: { en: "Apply a Delete lock to Sub-Retail.", fr: "Appliquer un verrou Suppression à Sub-Retail." } }
answer:
  sequence: [assign, role, remediate]
explanation:
  correct:
    en: A modify assignment needs a managed identity, created with the assignment (a system-assigned identity also requires a location). Only the portal grants the roles listed in roleDefinitionIds automatically; because the command is run without `--role` and `--identity-scope`, you must then assign Tag Contributor to the identity yourself. A remediation task then applies the modify operations to existing resources, which the policy never changes on its own.
    fr: "Une attribution modify a besoin d'une identité managée, créée avec l'attribution (une identité affectée par le système exige aussi un emplacement). Seul le portail accorde automatiquement les rôles listés dans roleDefinitionIds ; comme la commande est exécutée sans `--role` ni `--identity-scope`, vous devez ensuite attribuer vous-même Tag Contributor à l'identité. Une tâche de correction applique ensuite les opérations modify aux ressources existantes, que la stratégie ne modifie jamais d'elle-même."
  options:
    exempt: { en: "An exemption hides the resources from evaluation instead of fixing them.", fr: "Une exemption retire les ressources de l'évaluation au lieu de les corriger." }
    donot: { en: "DoNotEnforce stops the effect on new requests; it does not remediate anything.", fr: "DoNotEnforce désactive l'effet sur les nouvelles requêtes ; il ne corrige rien." }
    lock: { en: "A lock has no role in remediation; a ReadOnly lock would even block tag changes.", fr: "Un verrou ne joue aucun rôle dans la correction ; un verrou Lecture seule bloquerait même la modification des étiquettes." }
references:
  - title: Remediate non-compliant resources
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - title: Azure Policy definitions modify effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-modify
