id: i1-007-least-privilege-identity-roles
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Entra tenant. You need to delegate four identity tasks to four administrators. Each administrator must receive the least privileged Microsoft Entra role that allows the task.

    Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.
  fr: |
    Wingtip Toys dispose d'un locataire Microsoft Entra. Vous devez déléguer quatre tâches d'identité à quatre administrateurs. Chaque administrateur doit recevoir le rôle Microsoft Entra disposant du moins de privilèges qui permet la tâche.

    Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: useradm, text: User Administrator }
    - { id: inviter, text: Guest Inviter }
    - { id: groupsadm, text: Groups Administrator }
    - { id: pra, text: Privileged Role Administrator }
    - { id: ga, text: Global Administrator }
    - { id: helpdesk, text: Helpdesk Administrator }
  targets:
    - id: t1
      text: { en: "Create new internal member user accounts", fr: "Créer de nouveaux comptes d'utilisateurs membres internes" }
    - id: t2
      text: { en: "Invite external guest users, and nothing else", fr: "Inviter des utilisateurs invités externes, et rien d'autre" }
    - id: t3
      text: { en: "Create security groups and manage their members and owners", fr: "Créer des groupes de sécurité et gérer leurs membres et propriétaires" }
    - id: t4
      text: { en: "Assign Microsoft Entra roles to users", fr: "Attribuer des rôles Microsoft Entra à des utilisateurs" }
answer:
  mapping: { t1: useradm, t2: inviter, t3: groupsadm, t4: pra }
explanation:
  correct:
    en: "User Administrator is the least privileged role to create users, and Guest Inviter only allows sending B2B invitations. Groups Administrator manages groups, their members and owners without managing users. Assigning Microsoft Entra roles requires Privileged Role Administrator. Global Administrator would grant far more than needed."
    fr: "User Administrator est le rôle le moins privilégié pour créer des utilisateurs, et Guest Inviter permet seulement d'envoyer des invitations B2B. Groups Administrator gère les groupes, leurs membres et leurs propriétaires sans gérer les utilisateurs. L'attribution de rôles Microsoft Entra exige Privileged Role Administrator. Global Administrator accorderait bien plus que nécessaire."
  options:
    helpdesk: { en: "Helpdesk Administrator resets passwords of non-administrators but can't create users or groups.", fr: "Helpdesk Administrator réinitialise les mots de passe des non-administrateurs mais ne peut pas créer d'utilisateurs ni de groupes." }
references:
  - title: How to create, invite, and delete users in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-create-delete-users
  - title: How to manage groups
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-groups
