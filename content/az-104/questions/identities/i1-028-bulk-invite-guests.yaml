id: i1-028-bulk-invite-guests
objective: "1.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware must invite 60 consultants from a partner company as B2B guest users. Each consultant must receive an invitation email and be redirected to the My Apps portal after accepting it.

    You need to invite the consultants from the Microsoft Entra admin center.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware doit inviter 60 consultants d'une société partenaire comme utilisateurs invités B2B. Chaque consultant doit recevoir un e-mail d'invitation et être redirigé vers le portail Mes applications après l'avoir acceptée.

    Vous devez inviter les consultants depuis le Centre d'administration Microsoft Entra.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Browse to Users, and then select Bulk operations > Bulk invite.", fr: "Accéder à Utilisateurs, puis sélectionner Opérations en bloc > Invitation en bloc (Bulk invite)." } }
    - { id: download, text: { en: "Download the CSV template.", fr: "Télécharger le modèle CSV." } }
    - { id: fill, text: { en: "Add one row per consultant with the Email address to invite and the Redirection url https://myapps.microsoft.com.", fr: "Ajouter une ligne par consultant avec l'adresse e-mail à inviter et l'URL de redirection https://myapps.microsoft.com." } }
    - { id: submit, text: { en: "Upload the CSV file, wait for validation, and select Submit.", fr: "Charger le fichier CSV, attendre la validation, puis sélectionner Envoyer (Submit)." } }
    - { id: version, text: { en: "Delete the version row at the top of the template.", fr: "Supprimer la ligne de version en haut du modèle." } }
    - { id: create, text: { en: "Browse to Users, and then select Bulk create.", fr: "Accéder à Utilisateurs, puis sélectionner Création en bloc (Bulk create)." } }
answer:
  sequence: [open, download, fill, submit]
explanation:
  correct:
    en: "Bulk invite is started from Users > Bulk operations. You download the template, fill in the required columns (email address to invite and redirection URL), then upload the file and submit it once validation succeeds. The results appear on the Bulk operation results page."
    fr: "L'invitation en bloc se lance depuis Utilisateurs > Opérations en bloc. Vous téléchargez le modèle, remplissez les colonnes obligatoires (adresse e-mail à inviter et URL de redirection), puis chargez le fichier et l'envoyez une fois la validation réussie. Les résultats apparaissent dans la page des résultats des opérations en bloc."
  options:
    version: { en: "The first two rows of the template, including the version row, must not be removed.", fr: "Les deux premières lignes du modèle, dont la ligne de version, ne doivent pas être supprimées." }
    create: { en: "Bulk create creates internal members with passwords and sends no invitation.", fr: "La création en bloc crée des membres internes avec mot de passe et n'envoie aucune invitation." }
references:
  - title: Bulk invite B2B users
    url: https://learn.microsoft.com/en-us/entra/external-id/tutorial-bulk-invite
