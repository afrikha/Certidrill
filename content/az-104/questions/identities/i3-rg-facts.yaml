id: i3-rg-facts
objective: "1.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are training new administrators at Wingtip Toys on how resource groups work in Azure Resource Manager.

    Which two statements are true? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous formez de nouveaux administrateurs de Wingtip Toys au fonctionnement des groupes de ressources dans Azure Resource Manager.

    Quelles sont les deux affirmations vraies ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A resource group in West Europe can contain a virtual machine deployed in East US.", fr: "Un groupe de ressources dans West Europe peut contenir une machine virtuelle déployée dans East US." } }
    - { id: b, text: { en: "Deleting a resource group deletes all the resources it contains.", fr: "La suppression d'un groupe de ressources supprime toutes les ressources qu'il contient." } }
    - { id: c, text: { en: "A storage account can belong to two resource groups at the same time.", fr: "Un compte de stockage peut appartenir à deux groupes de ressources en même temps." } }
    - { id: d, text: { en: "A resource group can contain other resource groups.", fr: "Un groupe de ressources peut contenir d'autres groupes de ressources." } }
    - { id: e, text: { en: "The region of a resource group can be changed after it is created.", fr: "La région d'un groupe de ressources peut être modifiée après sa création." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The location of a resource group is where its metadata is stored; the resources it contains can be in other regions. Resources in a group share a lifecycle, so deleting the resource group deletes them all.
    fr: "L'emplacement d'un groupe de ressources est celui où ses métadonnées sont stockées ; les ressources qu'il contient peuvent se trouver dans d'autres régions. Les ressources d'un groupe partagent le même cycle de vie : supprimer le groupe de ressources les supprime toutes."
  options:
    c: { en: "Each resource exists in exactly one resource group.", fr: "Chaque ressource existe dans un seul groupe de ressources." }
    d: { en: "Resource groups cannot be nested.", fr: "Les groupes de ressources ne peuvent pas être imbriqués." }
    e: { en: "The location of a resource group is set at creation and cannot be changed.", fr: "L'emplacement d'un groupe de ressources est défini à la création et ne peut pas être modifié." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - title: Use the Azure portal and Azure Resource Manager to manage resource groups
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
