id: i3-policy-effects-match
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The governance team at Tailspin Toys writes four custom Azure Policy definitions. Each definition must meet one of the requirements shown in the answer area.

    Which effect should you use for each requirement? To answer, drag the appropriate effects to the correct requirements. Each effect may be used once or not at all.
  fr: |
    L'équipe de gouvernance de Tailspin Toys rédige quatre définitions Azure Policy personnalisées. Chaque définition doit satisfaire l'une des exigences présentées dans la zone de réponse.

    Quel effet devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les effets appropriés vers les exigences correspondantes. Chaque effet peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: deny, text: deny }
    - { id: audit, text: audit }
    - { id: aine, text: auditIfNotExists }
    - { id: dine, text: deployIfNotExists }
    - { id: denyaction, text: denyAction }
    - { id: disabled, text: disabled }
  targets:
    - id: t1
      text: { en: "Block the creation of public IP addresses", fr: "Bloquer la création d'adresses IP publiques" }
    - id: t2
      text: { en: "Report storage accounts that allow public network access, without blocking any request", fr: "Signaler les comptes de stockage qui autorisent l'accès au réseau public, sans bloquer aucune requête" }
    - id: t3
      text: { en: "Report key vaults that have no diagnostic setting, without deploying anything", fr: "Signaler les coffres de clés qui n'ont aucun paramètre de diagnostic, sans rien déployer" }
    - id: t4
      text: { en: "Prevent the deletion of SQL databases that carry the tag Tier=Critical", fr: "Empêcher la suppression des bases de données SQL qui portent l'étiquette Tier=Critical" }
answer:
  mapping: { t1: deny, t2: audit, t3: aine, t4: denyaction }
explanation:
  correct:
    en: deny rejects a create or update request that matches the rule. audit records a non-compliant resource based on its own properties. auditIfNotExists evaluates a related resource (such as a diagnostic setting) and reports when it is missing. denyAction blocks specific actions on matching resources, currently the delete action.
    fr: "deny rejette une requête de création ou de mise à jour qui correspond à la règle. audit signale une ressource non conforme d'après ses propres propriétés. auditIfNotExists évalue une ressource associée (comme un paramètre de diagnostic) et signale son absence. denyAction bloque des actions précises sur les ressources correspondantes, actuellement l'action de suppression."
  options:
    dine: { en: deployIfNotExists would deploy the missing diagnostic setting, which requirement 3 forbids., fr: "deployIfNotExists déploierait le paramètre de diagnostic manquant, ce que l'exigence 3 interdit." }
    disabled: { en: disabled turns the policy off; nothing is evaluated., fr: "disabled désactive la stratégie : rien n'est évalué." }
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - title: Azure Policy definitions denyAction effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deny-action
