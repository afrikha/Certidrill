id: i1-015-usage-location-license
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Microsoft Entra tenant. You create a cloud-only user named **lea@proseware.com** by using `New-MgUser` with only the required properties.

    When you run `Set-MgUserLicense` to directly assign a Microsoft 365 E3 license to the user, the assignment fails. Enough licenses are available.

    What should you do first?
  fr: |
    Proseware dispose d'un locataire Microsoft Entra. Vous créez un utilisateur uniquement cloud nommé **lea@proseware.com** avec `New-MgUser`, en ne renseignant que les propriétés obligatoires.

    Lorsque vous exécutez `Set-MgUserLicense` pour attribuer directement une licence Microsoft 365 E3 à l'utilisateur, l'attribution échoue. Des licences sont disponibles en nombre suffisant.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Run Update-MgUser to set the UsageLocation property of the user.", fr: "Exécuter Update-MgUser pour définir la propriété UsageLocation de l'utilisateur." }
    - id: b
      text: { en: "Run Update-MgUser to set the Country property of the user.", fr: "Exécuter Update-MgUser pour définir la propriété Country de l'utilisateur." }
    - id: c
      text: { en: "Run Update-MgUser to set the PreferredLanguage property of the user.", fr: "Exécuter Update-MgUser pour définir la propriété PreferredLanguage de l'utilisateur." }
    - id: d
      text: { en: "Run Update-MgUser to set the PreferredDataLocation property of the user.", fr: "Exécuter Update-MgUser pour définir la propriété PreferredDataLocation de l'utilisateur." }
answer: { optionId: a }
explanation:
  correct:
    en: "Licenses can be assigned directly only to accounts whose UsageLocation is set to a valid two-letter country code (ISO 3166-1 alpha-2), because some services aren't available in every country. New-MgUser doesn't require this property, so you must set it before Set-MgUserLicense can succeed."
    fr: "Une licence ne peut être attribuée directement qu'à un compte dont la propriété UsageLocation contient un code pays valide à deux lettres (ISO 3166-1 alpha-2), car certains services ne sont pas disponibles dans tous les pays. New-MgUser n'exige pas cette propriété : vous devez donc la définir avant que Set-MgUserLicense puisse réussir."
  options:
    b: { en: "Country is a contact information property; license assignment checks UsageLocation, not Country.", fr: "Country est une propriété des coordonnées ; l'attribution de licence vérifie UsageLocation, pas Country." }
    c: { en: "The preferred language only sets the user's language; it doesn't determine where services can be provided.", fr: "La langue préférée définit seulement la langue de l'utilisateur ; elle ne détermine pas où les services peuvent être fournis." }
    d: { en: "PreferredDataLocation is used by Microsoft 365 Multi-Geo to choose where user data is stored; it isn't checked for license assignment.", fr: "PreferredDataLocation sert à Microsoft 365 Multi-Geo pour choisir où les données de l'utilisateur sont stockées ; elle n'est pas vérifiée lors de l'attribution de licences." }
references:
  - title: Assign Microsoft 365 licenses to user accounts with PowerShell
    url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/assign-licenses-to-user-accounts-with-microsoft-365-powershell
