id: i1-015-usage-location-license
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Microsoft Entra tenant. You create a cloud-only user named **lea@proseware.com** by using `New-MgUser` with only the required properties.

    When you run `Set-MgUserLicense` to directly assign a Microsoft 365 E3 license to the user, the assignment fails. Enough licenses are available.

    What should you do first?
  fr: |
    Proseware dispose d'un locataire Microsoft Entra. Vous créez un utilisateur uniquement cloud nommé **lea@proseware.com** avec `New-MgUser`, en ne renseignant que les propriétés obligatoires.

    Lorsque vous exécutez `Set-MgUserLicense` pour attribuer directement une licence Microsoft 365 E3 à l'utilisateur, l'attribution échoue. Des licences sont disponibles en nombre suffisant.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Set the UsageLocation property of the user, for example with Update-MgUser -UsageLocation FR.", fr: "Définir la propriété UsageLocation de l'utilisateur, par exemple avec Update-MgUser -UsageLocation FR." }
    - id: b
      text: { en: "Assign the License Administrator role to the user.", fr: "Attribuer le rôle License Administrator à l'utilisateur." }
    - id: c
      text: { en: "Set the PreferredLanguage property of the user to fr-FR.", fr: "Définir la propriété PreferredLanguage de l'utilisateur sur fr-FR." }
    - id: d
      text: { en: "Force the user to change the password at the next sign-in.", fr: "Obliger l'utilisateur à changer de mot de passe à la prochaine connexion." }
answer: { optionId: a }
explanation:
  correct:
    en: "Licenses can be assigned directly only to accounts whose UsageLocation is set to a valid ISO 3166-1 alpha-2 country code, because some services aren't available everywhere. After you set it, the Set-MgUserLicense command succeeds."
    fr: "Une licence ne peut être attribuée directement qu'à un compte dont la propriété UsageLocation contient un code pays ISO 3166-1 alpha-2 valide, car certains services ne sont pas disponibles partout. Une fois la propriété définie, Set-MgUserLicense réussit."
  options:
    b: { en: "The License Administrator role lets a user manage licenses for others; it doesn't make the user licensable.", fr: "Le rôle License Administrator permet de gérer les licences des autres ; il ne rend pas l'utilisateur éligible à une licence." }
    c: { en: "The preferred language doesn't determine where services can be provided.", fr: "La langue préférée ne détermine pas où les services peuvent être fournis." }
    d: { en: "Password settings have no effect on license assignment.", fr: "Les paramètres de mot de passe n'ont aucun effet sur l'attribution de licences." }
references:
  - title: Assign Microsoft 365 licenses to user accounts with PowerShell
    url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/assign-licenses-to-user-accounts-with-microsoft-365-powershell
