id: cs1-contoso-02
objective: "1.3.6"
type: dropdown
caseStudy: cs1-contoso
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the budget requirement for Sub-Retail-Prod. The solution must minimize administrative effort.

    How should you configure the budget? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de budget pour Sub-Retail-Prod. La solution doit réduire au minimum l'effort d'administration.

    Comment devez-vous configurer le budget ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create a budget of USD 40,000 with a Monthly reset period at the [[scope]] scope.
      Add an alert condition of type [[type]] with a threshold of [[pct]] % of the budget, and add the email addresses of the SG-Finance members as alert recipients.
    fr: |
      Créez un budget de 40 000 USD avec une période de réinitialisation mensuelle à l'étendue [[scope]].
      Ajoutez une condition d'alerte de type [[type]] avec un seuil de [[pct]] % du budget, et ajoutez les adresses e-mail des membres de SG-Finance comme destinataires de l'alerte.
  slots:
    - id: scope
      options:
        - { id: sub, text: { en: "Sub-Retail-Prod subscription", fr: "abonnement Sub-Retail-Prod" } }
        - { id: rg, text: { en: "RG-Data resource group", fr: "groupe de ressources RG-Data" } }
        - { id: root, text: { en: "Tenant root group management group", fr: "groupe d'administration Groupe racine du locataire" } }
    - id: type
      options:
        - { id: actual, text: { en: Actual, fr: Réel } }
        - { id: forecasted, text: { en: Forecasted, fr: Prévu } }
    - id: pct
      options:
        - { id: p80, text: "80" }
        - { id: p90, text: "90" }
        - { id: p100, text: "100" }
answer:
  values: { scope: sub, type: forecasted, pct: p90 }
explanation:
  correct:
    en: |
      The budget applies to all the spending of Sub-Retail-Prod, so it is created at the subscription scope. A Forecasted alert condition triggers when Cost Management projects that the costs will exceed the threshold, before the actual spending reaches it. Budget alert thresholds are percentages of the budget amount: USD 36,000 is 90% of USD 40,000.
    fr: |
      Le budget s'applique à toutes les dépenses de Sub-Retail-Prod ; il est donc créé à l'étendue de l'abonnement. Une condition d'alerte de type Prévu se déclenche quand Cost Management prévoit que les coûts dépasseront le seuil, avant que les dépenses réelles l'atteignent. Les seuils d'alerte d'un budget sont des pourcentages du montant du budget : 36 000 USD représentent 90 % de 40 000 USD.
  options:
    rg: { en: "A resource group budget only tracks RG-Data, not the whole subscription.", fr: "Un budget de groupe de ressources ne suit que RG-Data, pas tout l'abonnement." }
    root: { en: "A budget at the tenant root group would include Sub-Retail-Dev as well.", fr: "Un budget au niveau du groupe racine du locataire inclurait aussi Sub-Retail-Dev." }
    actual: { en: "An Actual alert triggers only after the spending has really reached the threshold.", fr: "Une alerte de type Réel ne se déclenche qu'une fois le seuil réellement atteint par les dépenses." }
    p80: { en: "80% of USD 40,000 is USD 32,000, which would notify the finance team too early.", fr: "80 % de 40 000 USD représentent 32 000 USD, ce qui avertirait l'équipe financière trop tôt." }
    p100: { en: "100% corresponds to USD 40,000, not to USD 36,000.", fr: "100 % correspond à 40 000 USD, et non à 36 000 USD." }
references:
  - title: Tutorial - Create and manage budgets
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
