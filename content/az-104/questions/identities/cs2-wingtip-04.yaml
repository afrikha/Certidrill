id: cs2-wingtip-04
objective: "1.2.1"
type: single
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for pulling images from crwingtip. Which role should you assign to the managed identities of the container apps on crwingtip?
  fr: Vous devez satisfaire l'exigence relative à l'extraction des images depuis crwingtip. Quel rôle devez-vous attribuer aux identités managées des applications de conteneur sur crwingtip ?
body:
  options:
    - { id: a, text: "AcrPull" }
    - { id: b, text: "AcrPush" }
    - { id: c, text: "Container Registry Contributor and Data Access Configuration Administrator" }
    - { id: d, text: "AcrDelete" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the RBAC Registry Permissions mode, AcrPull grants data plane read-only access to pull images and artifacts, without control plane or write permissions. It is the least-privileged role for an orchestrator such as Azure Container Apps.
    fr: |
      Dans le mode RBAC Registry Permissions, AcrPull accorde un accès en lecture seule au plan de données pour extraire les images et les artefacts, sans autorisation sur le plan de contrôle ni en écriture. C'est le rôle de privilège minimum pour un orchestrateur comme Azure Container Apps.
  options:
    b: { en: "AcrPush also allows pushing images and managing tags, which the apps do not need.", fr: "AcrPush permet aussi d'envoyer des images et de gérer les étiquettes, ce dont les applications n'ont pas besoin." }
    c: { en: "This role manages the registry configuration on the control plane and does not grant image pull.", fr: "Ce rôle gère la configuration du registre sur le plan de contrôle et n'accorde pas l'extraction d'images." }
    d: { en: "AcrDelete allows deleting artifacts and tags, not pulling images.", fr: "AcrDelete permet de supprimer des artefacts et des étiquettes, pas d'extraire des images." }
references:
  - title: Azure Container Registry Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
