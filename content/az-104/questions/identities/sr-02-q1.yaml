id: sr-02-q1
objective: "1.2.1"
type: series_yesno
series: sr-02-vm-operators
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You assign the Virtual Machine Contributor role to VMOps on RG1.
  fr: |
    Vous attribuez le rôle Virtual Machine Contributor à VMOps sur RG1.
body:
  solution:
    en: |
      You assign the built-in **Virtual Machine Contributor** role to the VMOps group at the scope of **RG1**.
    fr: |
      Vous attribuez le rôle intégré **Virtual Machine Contributor** au groupe VMOps à l'étendue de **RG1**.
answer: { value: false }
explanation:
  correct:
    en: |
      Virtual Machine Contributor lets VMOps start, restart, and deallocate the virtual machines of RG1, but it also allows creating, updating, and deleting virtual machines (`Microsoft.Compute/virtualMachines/*`) and managing their disks. VMOps must not be able to create, modify, or delete resources, so the role grants too much and the goal isn't met.
    fr: |
      Virtual Machine Contributor permet à VMOps de démarrer, redémarrer et libérer les machines virtuelles de RG1, mais aussi de créer, mettre à jour et supprimer des machines virtuelles (`Microsoft.Compute/virtualMachines/*`) et de gérer leurs disques. VMOps ne doit pouvoir créer, modifier ni supprimer de ressources : le rôle accorde trop de droits et l'objectif n'est pas atteint.
references:
  - title: "Azure built-in roles for Compute"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
