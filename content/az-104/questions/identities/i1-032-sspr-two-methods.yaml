id: i1-032-sspr-two-methods
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has migrated to the Authentication methods policy. Self-service password reset (SSPR) is enabled for all users, with **Number of methods required to reset** set to **2**. Microsoft Authenticator, software OATH tokens, hardware OATH tokens, SMS and email OTP are enabled for SSPR. None of the users below holds an administrator role.

    Which two users can reset their password by using SSPR? Each correct answer presents a complete solution.
  fr: |
    Fabrikam a migré vers la stratégie de méthodes d'authentification. La réinitialisation de mot de passe en libre-service (SSPR) est activée pour tous les utilisateurs, avec **Nombre de méthodes requises pour réinitialiser** défini sur **2**. Microsoft Authenticator, les jetons OATH logiciels, les jetons OATH matériels, le SMS et le code à usage unique par e-mail sont activés pour SSPR. Aucun des utilisateurs ci-dessous ne détient de rôle d'administrateur.

    Quels sont les deux utilisateurs qui peuvent réinitialiser leur mot de passe avec SSPR ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "User1, who registered Microsoft Authenticator and a software OATH token", fr: "User1, qui a inscrit Microsoft Authenticator et un jeton OATH logiciel" } }
    - { id: b, text: { en: "User2, who registered Microsoft Authenticator and an email address", fr: "User2, qui a inscrit Microsoft Authenticator et une adresse e-mail" } }
    - { id: c, text: { en: "User3, who registered a mobile phone for SMS and an email address", fr: "User3, qui a inscrit un téléphone mobile pour le SMS et une adresse e-mail" } }
    - { id: d, text: { en: "User4, who registered only an email address", fr: "User4, qui a inscrit uniquement une adresse e-mail" } }
    - { id: e, text: { en: "User5, who registered Microsoft Authenticator and a hardware OATH token", fr: "User5, qui a inscrit Microsoft Authenticator et un jeton OATH matériel" } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: "For SSPR, Microsoft Authenticator, software OATH tokens and hardware OATH tokens count as a single method, so they can't be combined to satisfy a two-method requirement. User2 (Authenticator + email) and User3 (SMS + email) each have two distinct methods."
    fr: "Pour SSPR, Microsoft Authenticator, les jetons OATH logiciels et les jetons OATH matériels comptent comme une seule méthode : ils ne peuvent pas être combinés pour satisfaire une exigence de deux méthodes. User2 (Authenticator + e-mail) et User3 (SMS + e-mail) ont chacun deux méthodes distinctes."
  options:
    a: { en: "Authenticator and a software OATH token count as one method.", fr: "Authenticator et un jeton OATH logiciel comptent comme une seule méthode." }
    d: { en: "One method doesn't meet a requirement of two.", fr: "Une seule méthode ne satisfait pas une exigence de deux." }
    e: { en: "Authenticator and a hardware OATH token count as one method.", fr: "Authenticator et un jeton OATH matériel comptent comme une seule méthode." }
references:
  - title: Self-service password reset deep dive
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
