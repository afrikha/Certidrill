id: i1-013-direct-reports-rule
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. **Ana Silva** manages a team whose composition changes often.

    You need a security group that always contains the users who report directly to Ana Silva, without manual updates.

    How should you configure the group? Select the appropriate options in the answer area.
  fr: |
    Adatum dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. **Ana Silva** dirige une équipe dont la composition change souvent.

    Vous avez besoin d'un groupe de sécurité qui contient toujours les utilisateurs rattachés directement à Ana Silva, sans mise à jour manuelle.

    Comment devez-vous configurer le groupe ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Membership type: [[mt]]

      Membership rule: [[rule]]

      User property that must be populated on each team member: [[prop]]
    fr: |
      Type d'appartenance : [[mt]]

      Règle d'appartenance : [[rule]]

      Propriété utilisateur qui doit être renseignée pour chaque membre de l'équipe : [[prop]]
  slots:
    - id: mt
      options:
        - { id: dynuser, text: Dynamic User }
        - { id: dyndev, text: Dynamic Device }
        - { id: assigned, text: { en: "Assigned", fr: "Affecté" } }
    - id: rule
      options:
        - { id: dr, text: "Direct Reports for \"<object ID of Ana Silva>\"" }
        - { id: mgr, text: "user.manager -eq \"<UPN of Ana Silva>\"" }
        - { id: any, text: "user.directReports -any (_ -eq \"<object ID of Ana Silva>\")" }
        - { id: drupn, text: "Direct Reports for \"<UPN of Ana Silva>\"" }
    - id: prop
      options:
        - { id: manager, text: Manager }
        - { id: dept, text: Department }
        - { id: title, text: { en: "Job title", fr: "Poste (Job title)" } }
        - { id: loc, text: { en: "Usage location", fr: "Emplacement d'utilisation" } }
answer:
  values: { mt: dynuser, rule: dr, prop: manager }
explanation:
  correct:
    en: "A direct reports group is a dynamic user group whose rule uses the syntax `Direct Reports for \"{objectID_of_manager}\"`, with the manager's object ID. The rule relies on the Manager property being set correctly on the users. It can't be combined with other rules, and the manager is also added to the group."
    fr: "Un groupe de subordonnés directs est un groupe dynamique d'utilisateurs dont la règle utilise la syntaxe `Direct Reports for \"{objectID_of_manager}\"`, avec l'ID d'objet du responsable. La règle s'appuie sur la propriété Manager correctement renseignée pour les utilisateurs. Elle ne peut pas être combinée à d'autres règles, et le responsable est lui aussi ajouté au groupe."
  options:
    assigned: { en: "Assigned membership requires manual updates.", fr: "L'appartenance Affecté exige des mises à jour manuelles." }
    mgr: { en: "The manager isn't a supported property in a single expression; the Direct Reports syntax must be used.", fr: "Le responsable n'est pas une propriété prise en charge dans une expression simple ; il faut la syntaxe Direct Reports." }
    drupn: { en: "The rule expects the object ID of the manager, not the UPN.", fr: "La règle attend l'ID d'objet du responsable, pas son UPN." }
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
