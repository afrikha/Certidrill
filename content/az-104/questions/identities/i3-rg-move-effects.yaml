id: i3-rg-move-effects
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a subscription that contains two resource groups: **RG-East** in East US and **RG-West** in West US. RG-East contains a web app named **app-proseware** that is deployed in East US. A user has the Website Contributor role assigned directly on app-proseware.

    You move app-proseware and its App Service plan from RG-East to RG-West.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un abonnement qui contient deux groupes de ressources : **RG-East** dans East US et **RG-West** dans West US. RG-East contient une application web nommée **app-proseware** déployée dans East US. Un utilisateur a le rôle Website Contributor attribué directement sur app-proseware.

    Vous déplacez app-proseware et son plan App Service de RG-East vers RG-West.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the move, app-proseware runs in West US.
        fr: Après le déplacement, app-proseware s'exécute dans West US.
    - id: s2
      text:
        en: After the move, the resource ID of app-proseware is different.
        fr: Après le déplacement, l'ID de ressource d'app-proseware est différent.
    - id: s3
      text:
        en: The Website Contributor role assignment moves with app-proseware and still applies.
        fr: L'attribution du rôle Website Contributor est déplacée avec app-proseware et s'applique toujours.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Moving a resource changes only its resource group, not its physical region, so the app stays in East US. The resource group name is part of the resource ID, so the ID changes and scripts or dashboards that reference it must be updated. A role assignment on the moved resource does not move; it becomes orphaned and must be recreated.
    fr: "Déplacer une ressource change uniquement son groupe de ressources, pas sa région physique : l'application reste dans East US. Le nom du groupe de ressources fait partie de l'ID de ressource : l'ID change, et les scripts ou tableaux de bord qui le référencent doivent être mis à jour. Une attribution de rôle sur la ressource déplacée n'est pas déplacée ; elle devient orpheline et doit être recréée."
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
