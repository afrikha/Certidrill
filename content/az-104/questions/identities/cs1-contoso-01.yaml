id: cs1-contoso-01
objective: "1.1.1"
type: single
caseStudy: cs1-contoso
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the store manager requirement for the store portal. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Vous devez satisfaire l'exigence concernant les responsables de magasin pour le portail des magasins. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A security group with the Dynamic User membership type and the rule (user.jobTitle -eq \"Store Manager\")", fr: "Un groupe de sécurité avec le type d'appartenance Utilisateur dynamique et la règle (user.jobTitle -eq \"Store Manager\")" } }
    - { id: b, text: { en: "A security group with the Assigned membership type, owned by the HR team", fr: "Un groupe de sécurité avec le type d'appartenance Affecté, dont l'équipe RH est propriétaire" } }
    - { id: c, text: { en: "A security group with the Dynamic Device membership type and the rule (device.displayName -startsWith \"STORE\")", fr: "Un groupe de sécurité avec le type d'appartenance Appareil dynamique et la règle (device.displayName -startsWith \"STORE\")" } }
    - { id: d, text: { en: "An administrative unit that contains SG-StoreManagers", fr: "Une unité administrative qui contient SG-StoreManagers" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A dynamic membership group evaluates a rule against user attributes and adds or removes members automatically when the attributes change. Because HR already maintains jobTitle and every user has a Microsoft Entra ID P1 license, a Dynamic User rule on jobTitle meets the requirement with no manual work.
    fr: |
      Un groupe d'appartenance dynamique évalue une règle sur les attributs des utilisateurs et ajoute ou retire automatiquement des membres quand les attributs changent. Comme les RH tiennent déjà jobTitle à jour et que chaque utilisateur dispose d'une licence Microsoft Entra ID P1, une règle Utilisateur dynamique sur jobTitle satisfait l'exigence sans travail manuel.
  options:
    b: { en: "An assigned group requires HR to add and remove members manually, which is the current situation the requirement wants to avoid.", fr: "Un groupe affecté oblige les RH à ajouter et retirer manuellement les membres, ce qui est justement la situation actuelle à éviter." }
    c: { en: "A Dynamic Device group contains devices, not users, so it cannot grant store managers access based on their job title.", fr: "Un groupe Appareil dynamique contient des appareils, pas des utilisateurs : il ne peut pas donner accès aux responsables de magasin selon leur poste." }
    d: { en: "An administrative unit delegates administration of a set of objects; it does not manage group membership automatically.", fr: "Une unité administrative délègue l'administration d'un ensemble d'objets ; elle ne gère pas automatiquement l'appartenance aux groupes." }
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
