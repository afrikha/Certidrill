id: cs2-proseware-04
objective: "1.1.1"
type: dropdown
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for GRP-Instructors.

    How should you configure the group? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence concernant GRP-Instructors.

    Comment devez-vous configurer le groupe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Membership type: [[type]]

      Dynamic membership rule: (user.[[attr]] -eq "Instructors") -and [[clause]]
    fr: |
      Type d'appartenance : [[type]]

      Règle d'appartenance dynamique : (user.[[attr]] -eq "Instructors") -and [[clause]]
  slots:
    - id: type
      options:
        - { id: assigned, text: { en: "Assigned", fr: "Affecté" } }
        - { id: dynuser, text: { en: "Dynamic User", fr: "Utilisateur dynamique" } }
        - { id: dyndevice, text: { en: "Dynamic Device", fr: "Appareil dynamique" } }
    - id: attr
      options:
        - { id: dept, text: "department" }
        - { id: title, text: "jobTitle" }
        - { id: company, text: "companyName" }
    - id: clause
      options:
        - { id: member, text: '(user.userType -eq "Member")' }
        - { id: guest, text: '(user.userType -eq "Guest")' }
        - { id: enabled, text: '(user.accountEnabled -eq true)' }
        - { id: notnull, text: '(user.objectId -ne null)' }
answer:
  values: { type: dynuser, attr: dept, clause: member }
explanation:
  correct:
    en: |
      A Dynamic User group adds and removes members automatically when their attributes match the rule, so the help desk no longer maintains the membership. The rule tests the department attribute and, because the guest instructors have the same department value, also requires userType to be Member. The tenant already has the Microsoft Entra ID P1 licenses that dynamic membership groups require.
    fr: |
      Un groupe Utilisateur dynamique ajoute et retire automatiquement les membres selon que leurs attributs correspondent ou non à la règle ; le support n'a plus à gérer l'appartenance. La règle teste l'attribut department et, comme les formateurs invités ont la même valeur de department, exige aussi que userType soit Member. Le locataire dispose déjà des licences Microsoft Entra ID P1 qu'exigent les groupes d'appartenance dynamique.
  options:
    assigned: { en: "With the Assigned type, members are still added and removed manually, and a rule cannot be used.", fr: "Avec le type Affecté, les membres sont toujours ajoutés et retirés manuellement, et aucune règle ne peut être utilisée." }
    dyndevice: { en: "A Dynamic Device group contains devices, not users.", fr: "Un groupe Appareil dynamique contient des appareils, pas des utilisateurs." }
    title: { en: "The case study sets the department attribute, not the job title.", fr: "L'étude de cas renseigne l'attribut department, pas le poste." }
    guest: { en: "This clause would keep only the guest instructors, the opposite of the requirement.", fr: "Cette clause ne conserverait que les formateurs invités, soit l'inverse de l'exigence." }
    enabled: { en: "Guest accounts are also enabled, so this clause does not exclude them.", fr: "Les comptes invités sont eux aussi activés ; cette clause ne les exclut donc pas." }
    notnull: { en: "Every user has an object ID, so this clause filters nothing.", fr: "Chaque utilisateur possède un ID d'objet ; cette clause ne filtre donc rien." }
references:
  - title: "Manage rules for dynamic membership groups in Microsoft Entra ID - Microsoft Entra ID"
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
