id: cs2-proseware-04
objective: "1.1.1"
type: dropdown
caseStudy: cs2-proseware
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement for GRP-Instructors.

    How should you configure the group? To answer, select the appropriate options in the answer area.
  fr: |
    Vous devez satisfaire l'exigence concernant GRP-Instructors.

    Comment devez-vous configurer le groupe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Membership type: [[type]]

      Dynamic membership rule: [[rule]]
    fr: |
      Type d'appartenance : [[type]]

      Règle d'appartenance dynamique : [[rule]]
  slots:
    - id: type
      options:
        - { id: assigned, text: { en: "Assigned", fr: "Affecté" } }
        - { id: dynuser, text: { en: "Dynamic User", fr: "Utilisateur dynamique" } }
        - { id: dyndevice, text: { en: "Dynamic Device", fr: "Appareil dynamique" } }
    - id: rule
      options:
        - { id: dept, text: '(user.department -eq "Instructors")' }
        - { id: title, text: '(user.jobTitle -eq "Instructors")' }
        - { id: device, text: '(device.displayName -eq "Instructors")' }
answer:
  values: { type: dynuser, rule: dept }
explanation:
  correct:
    en: A dynamic membership group of users adds and removes members automatically when their attributes match the rule, so no help desk action is needed. The rule must test the department attribute. The tenant already has Microsoft Entra ID P1 licenses, which dynamic membership groups require.
    fr: Un groupe d'appartenance dynamique d'utilisateurs ajoute et retire automatiquement les membres selon que leurs attributs correspondent ou non à la règle ; aucune action du support n'est nécessaire. La règle doit tester l'attribut department. Le locataire dispose déjà de licences Microsoft Entra ID P1, nécessaires pour les groupes d'appartenance dynamique.
  options:
    assigned: { en: "With the Assigned type, members are still added and removed manually.", fr: "Avec le type Affecté, les membres sont toujours ajoutés et retirés manuellement." }
    dyndevice: { en: "A Dynamic Device group contains devices, not users.", fr: "Un groupe Appareil dynamique contient des appareils, pas des utilisateurs." }
    title: { en: "The case study sets the department attribute, not the job title.", fr: "L'étude de cas renseigne l'attribut department, pas le poste." }
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
