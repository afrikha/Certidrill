id: cs2-alpineski-06
objective: "1.3.1"
type: single
caseStudy: cs2-alpineski
difficulty: 3
status: draft
stem:
  en: You need to meet the tagging requirement. The solution must minimize administrative effort. What should you do?
  fr: Vous devez satisfaire l'exigence relative aux étiquettes. La solution doit réduire l'effort d'administration au minimum. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the built-in policy Inherit a tag from the resource group to Sub-Alpine with the tag name Site, and create a remediation task", fr: "Attribuer la stratégie intégrée Inherit a tag from the resource group à Sub-Alpine avec le nom d'étiquette Site, et créer une tâche de correction" } }
    - { id: b, text: { en: "Assign the built-in policy Inherit a tag from the resource group to Sub-Alpine with the tag name Site, without a remediation task", fr: "Attribuer la stratégie intégrée Inherit a tag from the resource group à Sub-Alpine avec le nom d'étiquette Site, sans tâche de correction" } }
    - { id: c, text: { en: "Assign the built-in policy Require a tag on resources to Sub-Alpine with the tag name Site", fr: "Attribuer la stratégie intégrée Require a tag on resources à Sub-Alpine avec le nom d'étiquette Site" } }
    - { id: d, text: { en: "Apply a Delete lock to RG-CH, RG-AT and RG-DR", fr: "Appliquer un verrou Suppression à RG-CH, RG-AT et RG-DR" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Inherit a tag from the resource group uses the Modify effect to add or replace the Site tag with the value of the parent resource group, which also fixes incorrect values. A policy assignment evaluates new and updated resources only; a remediation task applies the change to the existing non-compliant resources.
    fr: |
      Inherit a tag from the resource group utilise l'effet Modify pour ajouter ou remplacer l'étiquette Site par la valeur du groupe de ressources parent, ce qui corrige aussi les valeurs incorrectes. Une attribution de stratégie n'évalue que les ressources créées ou modifiées ; une tâche de correction applique la modification aux ressources existantes non conformes.
  options:
    b: { en: "Without a remediation task, the existing resources keep their missing or incorrect tags.", fr: "Sans tâche de correction, les ressources existantes conservent leurs étiquettes manquantes ou incorrectes." }
    c: { en: "This policy denies new resources without the tag, but it neither sets the value nor fixes existing resources.", fr: "Cette stratégie refuse les nouvelles ressources sans l'étiquette, mais elle ne définit pas la valeur et ne corrige pas les ressources existantes." }
    d: { en: "A lock prevents deletion; it does not manage tags.", fr: "Un verrou empêche la suppression ; il ne gère pas les étiquettes." }
references:
  - title: "Policy definitions for tagging resources - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
  - title: "Remediate non-compliant resources - Azure Policy"
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
