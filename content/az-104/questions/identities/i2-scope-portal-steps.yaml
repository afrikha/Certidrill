id: i2-scope-portal-steps
objective: "1.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a resource group named **RG-Analytics**. You need to use the Azure portal to assign the Log Analytics Reader role on RG-Analytics to a Microsoft Entra group named **Data-Team**.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un groupe de ressources nommé **RG-Analytics**. Vous devez utiliser le portail Azure pour attribuer le rôle Log Analytics Reader sur RG-Analytics à un groupe Microsoft Entra nommé **Data-Team**.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Open the RG-Analytics resource group.", fr: "Ouvrir le groupe de ressources RG-Analytics." } }
    - { id: iam, text: { en: "Select **Access control (IAM)**, and then select **Add** > **Add role assignment**.", fr: "Sélectionner **Contrôle d'accès (IAM)**, puis **Ajouter** > **Ajouter une attribution de rôle**." } }
    - { id: role, text: { en: "On the **Role** tab, select **Log Analytics Reader**, and then select **Next**.", fr: "Sous l'onglet **Rôle**, sélectionner **Log Analytics Reader**, puis **Suivant**." } }
    - { id: members, text: { en: "On the **Members** tab, select **Select members** and add Data-Team.", fr: "Sous l'onglet **Membres**, choisir **Sélectionner des membres** et ajouter Data-Team." } }
    - { id: review, text: { en: "Select **Review + assign**.", fr: "Sélectionner **Vérifier + attribuer**." } }
    - { id: entra, text: { en: "In Microsoft Entra ID, open **Roles and administrators** and select **Add assignments**.", fr: "Dans Microsoft Entra ID, ouvrir **Rôles et administrateurs** et sélectionner **Ajouter des affectations**." } }
    - { id: policy, text: { en: "In Azure Policy, create an assignment scoped to RG-Analytics.", fr: "Dans Azure Policy, créer une affectation dont l'étendue est RG-Analytics." } }
answer:
  sequence: [ open, iam, role, members, review ]
explanation:
  correct:
    en: You first open the scope (here the resource group), then Access control (IAM) > Add > Add role assignment. On the Role tab you choose the role, on the Members tab you select the principals, and Review + assign creates the assignment.
    fr: Vous ouvrez d'abord l'étendue (ici le groupe de ressources), puis Contrôle d'accès (IAM) > Ajouter > Ajouter une attribution de rôle. Sous l'onglet Rôle, vous choisissez le rôle ; sous l'onglet Membres, vous sélectionnez les principaux ; Vérifier + attribuer crée l'attribution.
  options:
    entra: { en: "Roles and administrators assigns Microsoft Entra roles, which do not grant access to Azure resources.", fr: "Rôles et administrateurs attribue des rôles Microsoft Entra, qui n'accordent pas l'accès aux ressources Azure." }
    policy: { en: "An Azure Policy assignment evaluates resource compliance; it does not grant permissions.", fr: "Une affectation Azure Policy évalue la conformité des ressources ; elle n'accorde pas d'autorisations." }
references:
  - title: Assign Azure roles using the Azure portal - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-portal
