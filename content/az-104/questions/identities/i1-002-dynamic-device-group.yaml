id: i1-002-dynamic-device-group
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. Windows devices are registered in the tenant.

    You need to create a group that automatically contains every Windows device, including the devices added in the future.

    What should you create?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1. Des appareils Windows sont inscrits dans le locataire.

    Vous devez créer un groupe qui contient automatiquement tous les appareils Windows, y compris ceux qui seront ajoutés ultérieurement.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "A security group with the Dynamic Device membership type and the rule device.deviceOSType -eq \"Windows\"", fr: "Un groupe de sécurité avec le type d'appartenance Dynamic Device et la règle device.deviceOSType -eq \"Windows\"" }
    - id: b
      text: { en: "A Microsoft 365 group with the Dynamic Device membership type and the rule device.deviceOSType -eq \"Windows\"", fr: "Un groupe Microsoft 365 avec le type d'appartenance Dynamic Device et la règle device.deviceOSType -eq \"Windows\"" }
    - id: c
      text: { en: "A security group with the Dynamic User membership type and a rule on the attributes of the device owners", fr: "Un groupe de sécurité avec le type d'appartenance Dynamic User et une règle sur les attributs des propriétaires des appareils" }
    - id: d
      text: { en: "A Microsoft 365 group with the Assigned membership type, refreshed by a scheduled script", fr: "Un groupe Microsoft 365 avec le type d'appartenance Affecté, mis à jour par un script planifié" }
answer: { optionId: a }
explanation:
  correct:
    en: Only security groups can contain devices. A Dynamic Device membership rule such as `device.deviceOSType -eq "Windows"` adds and removes devices automatically when their attributes change.
    fr: Seuls les groupes de sécurité peuvent contenir des appareils. Une règle d'appartenance Dynamic Device telle que `device.deviceOSType -eq "Windows"` ajoute et retire automatiquement les appareils quand leurs attributs changent.
  options:
    b:
      en: Microsoft 365 groups can include only users, never devices.
      fr: Les groupes Microsoft 365 ne peuvent inclure que des utilisateurs, jamais des appareils.
    c:
      en: A dynamic user group contains users, and a device rule cannot reference the attributes of the device owner.
      fr: Un groupe dynamique d'utilisateurs contient des utilisateurs, et une règle d'appareil ne peut pas référencer les attributs du propriétaire de l'appareil.
    d:
      en: Microsoft 365 groups cannot contain devices, and a script adds administrative effort compared to a dynamic rule.
      fr: Les groupes Microsoft 365 ne peuvent pas contenir d'appareils, et un script ajoute de l'effort d'administration par rapport à une règle dynamique.
references:
  - title: Manage rules for dynamic membership groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
