id: i1-003-create-user-commands
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You manage a Microsoft Entra tenant for **fabrikam.com**. You use Azure Cloud Shell and have the required permissions.

    You need to create a cloud-only internal member user named **Ines Moreau** with a password that you set yourself.

    Which two commands can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un locataire Microsoft Entra pour **fabrikam.com**. Vous utilisez Azure Cloud Shell et disposez des autorisations nécessaires.

    Vous devez créer un utilisateur membre interne, uniquement cloud, nommé **Ines Moreau**, avec un mot de passe que vous définissez vous-même.

    Quelles sont les deux commandes que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: az ad user create }
    - { id: b, text: New-MgUser }
    - { id: c, text: New-MgInvitation }
    - { id: d, text: az ad user update }
    - { id: e, text: az ad group member add }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "`az ad user create` (with `--display-name`, `--user-principal-name` and `--password`) and the Microsoft Graph PowerShell cmdlet `New-MgUser` both create a user account in the tenant with the password you provide."
    fr: "`az ad user create` (avec `--display-name`, `--user-principal-name` et `--password`) et l'applet de commande Microsoft Graph PowerShell `New-MgUser` créent toutes deux un compte d'utilisateur dans le locataire avec le mot de passe que vous fournissez."
  options:
    c:
      en: "New-MgInvitation invites an external user and creates a guest account without a password in your tenant."
      fr: "New-MgInvitation invite un utilisateur externe et crée un compte invité sans mot de passe dans votre locataire."
    d:
      en: "az ad user update modifies an existing user; it cannot create one."
      fr: "az ad user update modifie un utilisateur existant ; il ne peut pas en créer."
    e:
      en: "az ad group member add adds an existing object to a group."
      fr: "az ad group member add ajoute un objet existant à un groupe."
references:
  - title: az ad user
    url: https://learn.microsoft.com/en-us/cli/azure/ad/user
  - title: New-MgUser (Microsoft.Graph.Users)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.graph.users/new-mguser
