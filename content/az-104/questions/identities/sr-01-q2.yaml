series: sr-01-allowed-locations
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You assign the Allowed locations policy at the scope of Sub1.
  fr: |
    Vous attribuez la stratégie Allowed locations à l'étendue de Sub1.
body:
  solution:
    en: |
      You assign the built-in **Allowed locations** policy definition to **Sub1**. You set the allowed locations parameter to East US and West Europe and leave **Policy enforcement** set to **Enabled**.
    fr: |
      Vous attribuez la définition de stratégie intégrée **Allowed locations** (« Emplacements autorisés ») à **Sub1**. Vous définissez le paramètre des emplacements autorisés sur East US et West Europe et laissez **Application de la stratégie** sur **Activée**.
answer: { value: true }
explanation:
  correct:
    en: |
      Allowed locations uses the Deny effect: any create or update request for a resource in another region is rejected. An assignment at the subscription scope is inherited by every resource group, including the ones created later. Policy evaluation of existing resources only reports them as non-compliant; Deny never deletes or changes them, so every part of the goal is met.
    fr: |
      Allowed locations utilise l'effet Deny : toute demande de création ou de mise à jour d'une ressource dans une autre région est refusée. Une attribution à l'étendue de l'abonnement est héritée par tous les groupes de ressources, y compris ceux créés plus tard. L'évaluation des ressources existantes se contente de les signaler comme non conformes ; Deny ne les supprime ni ne les modifie jamais. Toutes les parties de l'objectif sont donc atteintes.
references:
