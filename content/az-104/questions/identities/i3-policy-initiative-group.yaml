id: i3-policy-initiative-group
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must meet an internal security baseline made of 14 Azure Policy definitions. You need to assign the 14 definitions to a management group as a single unit and track their overall compliance in one place. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Woodgrove Bank doit respecter une base de référence de sécurité interne composée de 14 définitions Azure Policy. Vous devez attribuer les 14 définitions à un groupe d'administration comme une seule unité et suivre leur conformité globale à un seul endroit. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An initiative definition that contains the 14 policy definitions", fr: "Une définition d'initiative qui contient les 14 définitions de stratégie" } }
    - { id: b, text: { en: "14 policy assignments at the management group scope", fr: "14 attributions de stratégie à l'étendue du groupe d'administration" } }
    - { id: c, text: { en: "A custom Azure role that includes the 14 policy definitions", fr: "Un rôle Azure personnalisé qui inclut les 14 définitions de stratégie" } }
    - { id: d, text: { en: "A policy exemption that references the 14 policy definitions", fr: "Une exemption de stratégie qui référence les 14 définitions de stratégie" } }
answer: { optionId: a }
explanation:
  correct:
    en: An initiative (policy set) groups several policy definitions so that you assign them once and see a single compliance state for the group. Assigning definitions that are always used together through an initiative is the recommended approach.
    fr: "Une initiative (ensemble de stratégies) regroupe plusieurs définitions de stratégie : vous les attribuez en une fois et vous voyez un état de conformité unique pour le groupe. Attribuer via une initiative les définitions toujours utilisées ensemble est l'approche recommandée."
  options:
    b: { en: "14 separate assignments work but must each be managed and reviewed individually, which does not minimize effort.", fr: "14 attributions distinctes fonctionnent, mais chacune doit être gérée et suivie séparément, ce qui ne réduit pas l'effort." }
    c: { en: "Roles grant permissions; they cannot contain policy definitions.", fr: "Les rôles accordent des autorisations ; ils ne peuvent pas contenir de définitions de stratégie." }
    d: { en: "An exemption removes resources from evaluation; it does not assign anything.", fr: "Une exemption retire des ressources de l'évaluation ; elle n'attribue rien." }
references:
  - title: Details of the initiative definition structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/initiative-definition-structure
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
