id: i3-tag-policy-builtin-match
objective: "1.3.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Adatum uses tags for chargeback. Each resource group carries a **CostCenter** tag and the subscription **Sub-Adatum** carries an **Owner** tag. You plan to assign built-in Azure Policy definitions to Sub-Adatum to meet the requirements shown in the answer area.

    Which policy definition should you assign for each requirement? To answer, drag the appropriate policy definitions to the correct requirements. Each policy definition may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise les étiquettes pour la refacturation. Chaque groupe de ressources porte une étiquette **CostCenter** et l'abonnement **Sub-Adatum** porte une étiquette **Owner**. Vous prévoyez d'attribuer des définitions Azure Policy intégrées à Sub-Adatum pour satisfaire les exigences présentées dans la zone de réponse.

    Quelle définition de stratégie devez-vous attribuer pour chaque exigence ? Pour répondre, faites glisser les définitions de stratégie appropriées vers les exigences correspondantes. Chaque définition de stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inhrg, text: Inherit a tag from the resource group }
    - { id: inhrgmiss, text: Inherit a tag from the resource group if missing }
    - { id: inhsubmiss, text: Inherit a tag from the subscription if missing }
    - { id: inhsub, text: Inherit a tag from the subscription }
    - { id: reqtag, text: Require a tag on resources }
    - { id: append, text: Append a tag and its value to resources }
  targets:
    - id: t1
      text: { en: "Copy the CostCenter tag of the resource group to every resource, replacing any different value already on the resource", fr: "Copier l'étiquette CostCenter du groupe de ressources sur chaque ressource, en remplaçant toute valeur différente déjà présente sur la ressource" }
    - id: t2
      text: { en: "Copy the Owner tag of the subscription only to resources that do not have an Owner tag, never changing an existing value", fr: "Copier l'étiquette Owner de l'abonnement uniquement sur les ressources qui n'ont pas d'étiquette Owner, sans jamais modifier une valeur existante" }
    - id: t3
      text: { en: "Block the creation of any resource that has no Environment tag", fr: "Bloquer la création de toute ressource qui n'a pas d'étiquette Environment" }
answer:
  mapping: { t1: inhrg, t2: inhsubmiss, t3: reqtag }
explanation:
  correct:
    en: "Inherit a tag from the resource group adds or replaces the tag with the value of the parent resource group. Inherit a tag from the subscription if missing adds the subscription's tag only when the resource lacks it and leaves an existing value unchanged. Both use the modify effect, so existing resources can be fixed with a remediation task. Require a tag on resources uses the deny effect to block non-compliant creations."
    fr: "Inherit a tag from the resource group ajoute ou remplace l'étiquette avec la valeur du groupe de ressources parent. Inherit a tag from the subscription if missing ajoute l'étiquette de l'abonnement seulement si la ressource ne l'a pas et ne modifie pas une valeur existante. Les deux utilisent l'effet modify : les ressources existantes peuvent être corrigées par une tâche de correction. Require a tag on resources utilise l'effet deny pour bloquer les créations non conformes."
  options:
    inhrgmiss: { en: "The if missing variant does not replace a different existing value, which t1 requires.", fr: "La variante if missing ne remplace pas une valeur existante différente, ce qu'exige t1." }
    inhsub: { en: "This variant replaces existing values, which t2 forbids.", fr: "Cette variante remplace les valeurs existantes, ce que t2 interdit." }
    append: { en: "It adds a fixed value defined in the assignment, not the value of a parent scope, and it does not block anything.", fr: "Elle ajoute une valeur fixe définie dans l'attribution, pas la valeur d'une étendue parente, et ne bloque rien." }
references:
  - title: Policy definitions for tagging resources
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
