id: i1-012-edit-multiple-users
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a cloud-only Microsoft Entra tenant. After a reorganization, 40 existing users must have their **Department** attribute changed to **Risk**.

    You need to make the change in the Microsoft Entra admin center. The solution must minimize administrative effort and must not use a script.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra uniquement cloud. Après une réorganisation, l'attribut **Department** de 40 utilisateurs existants doit être changé en **Risk**.

    Vous devez effectuer la modification dans le Centre d'administration Microsoft Entra. La solution doit réduire au minimum l'effort d'administration et ne pas utiliser de script.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "On the All users page, select the 40 users, select Edit > Edit properties, and set the department.", fr: "Dans la page Tous les utilisateurs, sélectionner les 40 utilisateurs, choisir Modifier > Modifier les propriétés, puis définir le service." }
    - id: b
      text: { en: "Use Bulk create with a CSV file that contains the 40 users and the new department.", fr: "Utiliser la création en bloc avec un fichier CSV contenant les 40 utilisateurs et le nouveau service." }
    - id: c
      text: { en: "Create a dynamic membership group with the rule user.department -eq \"Risk\".", fr: "Créer un groupe d'appartenance dynamique avec la règle user.department -eq \"Risk\"." }
    - id: d
      text: { en: "Use Bulk operations > Download users, edit the file, and upload it again.", fr: "Utiliser Opérations en bloc > Télécharger les utilisateurs, modifier le fichier, puis le recharger." }
answer: { optionId: a }
explanation:
  correct:
    en: "The All users page lets you select up to 60 users and edit some attributes at once, including Department, Job title and Usage location. This is the quickest way for 40 users without scripting."
    fr: "La page Tous les utilisateurs permet de sélectionner jusqu'à 60 utilisateurs et de modifier certains attributs en une fois, dont le service (Department), le poste et l'emplacement d'utilisation. C'est la méthode la plus rapide pour 40 utilisateurs sans script."
  options:
    b: { en: "Bulk create creates new accounts; it doesn't update existing ones.", fr: "La création en bloc crée de nouveaux comptes ; elle ne met pas à jour les comptes existants." }
    c: { en: "A dynamic rule reads attributes to calculate membership; it never changes user attributes.", fr: "Une règle dynamique lit des attributs pour calculer l'appartenance ; elle ne modifie jamais les attributs des utilisateurs." }
    d: { en: "Downloading users exports a list; re-uploading that file doesn't update attributes.", fr: "Le téléchargement des utilisateurs exporte une liste ; recharger ce fichier ne met pas à jour les attributs." }
references:
  - title: How to manage user profile information in the Microsoft Entra admin center
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info
