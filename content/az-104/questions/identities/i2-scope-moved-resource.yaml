id: i2-scope-moved-resource
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a virtual network named **vnet-branch** in a resource group named **RG-Old**. Last month, you assigned the Network Contributor role to a user named NetOps1 directly on vnet-branch. NetOps1 has no other role assignment.

    Yesterday, an administrator moved vnet-branch from RG-Old to a resource group named **RG-Network** in the same subscription. Today, NetOps1 can no longer modify vnet-branch.

    You need NetOps1 to be able to manage vnet-branch again. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Northwind Traders dispose d'un réseau virtuel nommé **vnet-branch** dans un groupe de ressources nommé **RG-Old**. Le mois dernier, vous avez attribué le rôle Network Contributor à un utilisateur nommé NetOps1 directement sur vnet-branch. NetOps1 ne dispose d'aucune autre attribution de rôle.

    Hier, un administrateur a déplacé vnet-branch de RG-Old vers un groupe de ressources nommé **RG-Network** dans le même abonnement. Aujourd'hui, NetOps1 ne peut plus modifier vnet-branch.

    Vous devez permettre à NetOps1 de gérer de nouveau vnet-branch. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Create a new Network Contributor role assignment for NetOps1 on vnet-branch., fr: Créer une nouvelle attribution du rôle Network Contributor pour NetOps1 sur vnet-branch. } }
    - { id: b, text: { en: Assign the Network Contributor role to NetOps1 on RG-Network., fr: Attribuer le rôle Network Contributor à NetOps1 sur RG-Network. } }
    - { id: c, text: { en: Ask NetOps1 to sign out and sign in again to refresh the role assignment., fr: Demander à NetOps1 de se déconnecter et de se reconnecter pour actualiser l'attribution de rôle. } }
    - { id: d, text: { en: Assign the Network Contributor role to NetOps1 on RG-Old., fr: Attribuer le rôle Network Contributor à NetOps1 sur RG-Old. } }
answer: { optionId: a }
explanation:
  correct:
    en: When you move a resource that has a role assignment directly on it, the role assignment is not moved and becomes orphaned. You must re-create the role assignment on the resource at its new location; the orphaned assignment is removed automatically later.
    fr: "Lorsque vous déplacez une ressource qui a une attribution de rôle directement sur elle, l'attribution n'est pas déplacée et devient orpheline. Vous devez recréer l'attribution de rôle sur la ressource à son nouvel emplacement ; l'attribution orpheline est supprimée automatiquement plus tard."
  options:
    b:
      en: An assignment on RG-Network would also give NetOps1 control of every other network resource in that resource group.
      fr: Une attribution sur RG-Network donnerait aussi à NetOps1 le contrôle de toutes les autres ressources réseau de ce groupe de ressources.
    c:
      en: Signing out only refreshes recent changes; here the assignment no longer applies to the moved resource.
      fr: La déconnexion ne fait qu'actualiser les changements récents ; ici, l'attribution ne s'applique plus à la ressource déplacée.
    d:
      en: vnet-branch is no longer in RG-Old, so an assignment on RG-Old is not inherited by it.
      fr: vnet-branch ne se trouve plus dans RG-Old ; une attribution sur RG-Old n'est donc pas héritée par ce réseau virtuel.
references:
  - title: Troubleshoot Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/troubleshooting
