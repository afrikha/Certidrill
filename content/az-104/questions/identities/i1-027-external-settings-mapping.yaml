id: i1-027-external-settings-mapping
objective: "1.1.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. Woodgrove collaborates with Fabrikam, which uses its own Microsoft Entra tenant. You must meet the following requirements.

    Which feature should you configure for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1. Woodgrove collabore avec Fabrikam, qui utilise son propre locataire Microsoft Entra. Vous devez satisfaire les exigences suivantes.

    Quelle fonctionnalité devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.
body:
  reuse: true
  items:
    - { id: extcollab, text: { en: "External collaboration settings", fr: "Paramètres de collaboration externe" } }
    - { id: xtenant, text: { en: "Cross-tenant access settings", fr: "Paramètres d'accès interlocataire" } }
    - { id: tenantres, text: { en: "Tenant restrictions", fr: "Restrictions de locataire (Tenant restrictions)" } }
    - { id: authmethods, text: { en: "Authentication methods policy", fr: "Stratégie de méthodes d'authentification" } }
  targets:
    - id: t1
      text: { en: "Prevent invitations to addresses in the outlook.com domain", fr: "Empêcher les invitations vers des adresses du domaine outlook.com" }
    - id: t2
      text: { en: "Accept the MFA that Fabrikam users already completed in their home tenant", fr: "Accepter l'authentification multifacteur que les utilisateurs de Fabrikam ont déjà effectuée dans leur locataire d'origine" }
    - id: t3
      text: { en: "Allow inbound B2B collaboration only for the members of one specific Fabrikam group", fr: "N'autoriser la collaboration B2B entrante que pour les membres d'un groupe précis de Fabrikam" }
    - id: t4
      text: { en: "Let only users with the Guest Inviter or User Administrator role send invitations", fr: "Ne laisser envoyer des invitations qu'aux utilisateurs ayant le rôle Guest Inviter ou User Administrator" }
answer:
  mapping: { t1: extcollab, t2: xtenant, t3: xtenant, t4: extcollab }
explanation:
  correct:
    en: "External collaboration settings control who can invite guests and which domains can be invited (allow or block list). Cross-tenant access settings manage collaboration with other Microsoft Entra organizations: inbound trust settings can accept MFA claims, and inbound access can be scoped to specific users and groups of the external tenant (both require P1)."
    fr: "Les paramètres de collaboration externe contrôlent qui peut inviter des invités et quels domaines peuvent être invités (liste d'autorisation ou de blocage). Les paramètres d'accès interlocataire gèrent la collaboration avec d'autres organisations Microsoft Entra : les paramètres d'approbation entrants peuvent accepter les revendications MFA, et l'accès entrant peut être limité à des utilisateurs et groupes précis du locataire externe (les deux exigent P1)."
  options:
    tenantres: { en: "Tenant restrictions control which external accounts your own users can use on managed devices.", fr: "Les restrictions de locataire contrôlent les comptes externes que vos propres utilisateurs peuvent utiliser sur les appareils gérés." }
    authmethods: { en: "The Authentication methods policy defines which methods your users can register; it doesn't trust another tenant's MFA.", fr: "La stratégie de méthodes d'authentification définit les méthodes que vos utilisateurs peuvent inscrire ; elle n'approuve pas l'authentification multifacteur d'un autre locataire." }
references:
  - title: Cross-tenant access overview
    url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-overview
  - title: Configure external collaboration
    url: https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
