id: i2-builtin-keyvault-secrets-user
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a key vault named **kv-litware-app** that uses the **Azure role-based access control** permission model. A web app named **app-orders** has a system-assigned managed identity.

    At startup, app-orders must read the value of a secret named **SqlConnection** stored in kv-litware-app. The managed identity must not be able to create, update or delete secrets, and must not be able to manage the key vault itself. The solution must follow the principle of least privilege.

    Which role should you assign to the managed identity on kv-litware-app?
  fr: |
    Litware dispose d'un coffre de clés nommé **kv-litware-app** qui utilise le modèle d'autorisation **Contrôle d'accès en fonction du rôle Azure**. Une application web nommée **app-orders** dispose d'une identité managée affectée par le système.

    Au démarrage, app-orders doit lire la valeur d'un secret nommé **SqlConnection** stocké dans kv-litware-app. L'identité managée ne doit pas pouvoir créer, mettre à jour ni supprimer de secrets, et ne doit pas pouvoir gérer le coffre de clés lui-même. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité managée sur kv-litware-app ?
body:
  options:
    - { id: a, text: Key Vault Secrets User }
    - { id: b, text: Key Vault Reader }
    - { id: c, text: Key Vault Secrets Officer }
    - { id: d, text: Key Vault Contributor }
answer: { optionId: a }
explanation:
  correct:
    en: Key Vault Secrets User is a data plane role that reads secret contents and nothing else. It only works for key vaults that use the Azure RBAC permission model, which is the case here.
    fr: Key Vault Secrets User est un rôle du plan de données qui lit le contenu des secrets et rien d'autre. Il ne fonctionne qu'avec les coffres de clés qui utilisent le modèle d'autorisation Azure RBAC, ce qui est le cas ici.
  options:
    b:
      en: Key Vault Reader reads the metadata of the vault and its objects, but cannot read sensitive values such as secret contents.
      fr: Key Vault Reader lit les métadonnées du coffre et de ses objets, mais ne peut pas lire les valeurs sensibles comme le contenu des secrets.
    c:
      en: Key Vault Secrets Officer can perform any action on secrets, including creating and deleting them, which exceeds the requirement.
      fr: Key Vault Secrets Officer peut effectuer toute action sur les secrets, y compris les créer et les supprimer, ce qui dépasse le besoin.
    d:
      en: Key Vault Contributor manages the key vault resource (control plane) and does not allow access to secrets, keys or certificates.
      fr: Key Vault Contributor gère la ressource coffre de clés (plan de contrôle) et ne permet pas d'accéder aux secrets, clés ou certificats.
references:
  - title: Grant permission to applications to access an Azure key vault using Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
