id: i1-035-sspr-who-can-reset
objective: "1.1.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a hybrid Microsoft Entra tenant licensed with Microsoft Entra ID P1. Microsoft Entra Connect synchronizes some users from on-premises AD DS with password hash synchronization. Password writeback is **not** enabled.

    Self-service password reset (SSPR) is enabled for the group **SSPR-Users** (Selected), with **Number of methods required to reset** set to **2**. Mobile phone and email are enabled. None of the users below holds an administrator role.

    Answer each prompt by selecting the appropriate user.
  fr: |
    Adatum dispose d'un locataire Microsoft Entra hybride disposant de licences Microsoft Entra ID P1. Microsoft Entra Connect synchronise certains utilisateurs depuis AD DS local avec la synchronisation de hachage de mot de passe. La réécriture du mot de passe n'est **pas** activée.

    La réinitialisation de mot de passe en libre-service (SSPR) est activée pour le groupe **SSPR-Users** (Selected), avec **Nombre de méthodes requises pour réinitialiser** défini sur **2**. Le téléphone mobile et l'e-mail sont activés. Aucun des utilisateurs ci-dessous ne détient de rôle d'administrateur.

    Répondez à chaque consigne en sélectionnant l'utilisateur approprié.
body:
  prompts:
    - id: p1
      text: { en: "The only user who can reset a forgotten password by using SSPR today", fr: "Le seul utilisateur qui peut aujourd'hui réinitialiser un mot de passe oublié avec SSPR" }
    - id: p2
      text: { en: "The user who will be able to reset after you enable password writeback, without any other change", fr: "L'utilisateur qui pourra réinitialiser après l'activation de la réécriture du mot de passe, sans autre modification" }
  grid:
    header: [{ en: User, fr: Utilisateur }, { en: Member of SSPR-Users, fr: Membre de SSPR-Users }, { en: Source, fr: Source }, { en: Registered methods, fr: Méthodes inscrites }]
    rows:
      - [{ text: Ana, area: ana }, { text: { en: "No", fr: "Non" } }, { text: { en: Cloud-only, fr: Uniquement cloud } }, { text: { en: "Mobile phone, email", fr: "Téléphone mobile, e-mail" } }]
      - [{ text: Ben, area: ben }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: Synchronized, fr: Synchronisé } }, { text: { en: "Mobile phone, email", fr: "Téléphone mobile, e-mail" } }]
      - [{ text: Cara, area: cara }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: Cloud-only, fr: Uniquement cloud } }, { text: { en: "Mobile phone, email", fr: "Téléphone mobile, e-mail" } }]
      - [{ text: Dev, area: dev }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: Cloud-only, fr: Uniquement cloud } }, { text: { en: Email, fr: E-mail } }]
answer:
  values: { p1: cara, p2: ben }
explanation:
  correct:
    en: "Cara is in scope, is cloud-only and has two methods. Ben meets the scope and method requirements, but his password is managed on-premises: without writeback he is told to contact his administrator, and enabling writeback lets him reset. Ana isn't in the SSPR group and Dev has only one method, so writeback changes nothing for them."
    fr: "Cara est dans l'étendue, uniquement cloud et dispose de deux méthodes. Ben respecte l'étendue et le nombre de méthodes, mais son mot de passe est géré en local : sans réécriture, il est invité à contacter son administrateur, et l'activation de la réécriture lui permet de réinitialiser. Ana n'est pas dans le groupe SSPR et Dev n'a qu'une méthode : la réécriture ne change rien pour eux."
references:
  - title: Self-service password reset deep dive
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
