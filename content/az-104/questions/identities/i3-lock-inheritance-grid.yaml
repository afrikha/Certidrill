id: i3-lock-inheritance-grid
objective: "1.3.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has the following resources in a subscription named **Sub-Web**. No lock exists at the subscription scope. The table shows the locks applied directly to each item.

    Answer each prompt by selecting the appropriate item in the table.
  fr: |
    Tailspin Toys dispose des ressources suivantes dans un abonnement nommé **Sub-Web**. Aucun verrou n'existe à l'étendue de l'abonnement. Le tableau indique les verrous appliqués directement à chaque élément.

    Répondez à chaque consigne en sélectionnant l'élément approprié dans le tableau.
body:
  prompts:
    - id: p1
      text: { en: "The resource (not a resource group) that can be resized or reconfigured but cannot be deleted", fr: "La ressource (pas un groupe de ressources) qui peut être redimensionnée ou reconfigurée, mais pas supprimée" }
    - id: p2
      text: { en: "The resource whose tags cannot be changed", fr: "La ressource dont les étiquettes ne peuvent pas être modifiées" }
  grid:
    header: [{ en: Name, fr: Nom }, Type, { en: Resource group, fr: Groupe de ressources }, { en: Lock applied directly, fr: Verrou appliqué directement }]
    rows:
      - [{ text: rg-web, area: rgweb }, { text: { en: Resource group, fr: Groupe de ressources } }, { text: "-" }, { text: { en: Delete, fr: Suppression } }]
      - [{ text: stweb01, area: stweb }, { text: { en: Storage account, fr: Compte de stockage } }, { text: rg-web }, { text: { en: Read-only, fr: Lecture seule } }]
      - [{ text: vm-web1, area: vmweb }, { text: { en: Virtual machine, fr: Machine virtuelle } }, { text: rg-web }, { text: { en: None, fr: Aucun } }]
      - [{ text: rg-dev, area: rgdev }, { text: { en: Resource group, fr: Groupe de ressources } }, { text: "-" }, { text: { en: None, fr: Aucun } }]
      - [{ text: vm-dev1, area: vmdev }, { text: { en: Virtual machine, fr: Machine virtuelle } }, { text: rg-dev }, { text: { en: None, fr: Aucun } }]
answer:
  values: { p1: vmweb, p2: stweb }
explanation:
  correct:
    en: Locks are inherited from the parent scope and the most restrictive lock wins. vm-web1 inherits the Delete lock of rg-web, so it can be modified but not deleted. stweb01 has a Read-only lock (more restrictive than the inherited Delete lock), so no update, including a tag change, is allowed. vm-dev1 has no direct or inherited lock and can be deleted.
    fr: "Les verrous sont hérités de l'étendue parente et le verrou le plus restrictif l'emporte. vm-web1 hérite du verrou Suppression de rg-web : elle peut être modifiée mais pas supprimée. stweb01 a un verrou Lecture seule (plus restrictif que le verrou Suppression hérité) : aucune mise à jour, y compris une modification d'étiquette, n'est autorisée. vm-dev1 n'a aucun verrou direct ou hérité et peut être supprimée."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
