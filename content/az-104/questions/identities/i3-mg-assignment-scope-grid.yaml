id: i3-mg-assignment-scope-grid
objective: "1.3.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following management group hierarchy in its tenant.

    Answer each prompt by selecting the scope where you should create the assignment. Each assignment must be a single assignment, and it must also apply automatically to subscriptions added later to the same branch.
  fr: |
    Contoso dispose de la hiérarchie de groupes d'administration suivante dans son locataire.

    Répondez à chaque consigne en sélectionnant l'étendue où vous devez créer l'attribution. Chaque attribution doit être unique et s'appliquer aussi automatiquement aux abonnements ajoutés plus tard dans la même branche.
body:
  prompts:
    - id: p1
      text: { en: "A policy assignment that applies to Sub-Prod1 and Sub-Prod2, but not to Sub-Dev1 or Sub-Test1", fr: "Une attribution de stratégie qui s'applique à Sub-Prod1 et Sub-Prod2, mais pas à Sub-Dev1 ni à Sub-Test1" }
    - id: p2
      text: { en: "A Reader role assignment for auditors that applies to the four Contoso subscriptions, but not to Sub-Partner", fr: "Une attribution du rôle Reader pour les auditeurs qui s'applique aux quatre abonnements Contoso, mais pas à Sub-Partner" }
  grid:
    header: [{ en: Scope, fr: Étendue }, Type, Parent]
    rows:
      - [{ text: { en: Tenant root group, fr: Groupe racine du locataire }, area: root }, { text: { en: Management group, fr: Groupe d'administration } }, { text: "-" }]
      - [{ text: MG-Contoso, area: mgcontoso }, { text: { en: Management group, fr: Groupe d'administration } }, { text: { en: Tenant root group, fr: Groupe racine du locataire } }]
      - [{ text: MG-Prod, area: mgprod }, { text: { en: Management group, fr: Groupe d'administration } }, { text: MG-Contoso }]
      - [{ text: MG-NonProd, area: mgnonprod }, { text: { en: Management group, fr: Groupe d'administration } }, { text: MG-Contoso }]
      - [{ text: Sub-Prod1, area: subprod1 }, { text: { en: Subscription, fr: Abonnement } }, { text: MG-Prod }]
      - [{ text: Sub-Prod2, area: subprod2 }, { text: { en: Subscription, fr: Abonnement } }, { text: MG-Prod }]
      - [{ text: Sub-Dev1, area: subdev1 }, { text: { en: Subscription, fr: Abonnement } }, { text: MG-NonProd }]
      - [{ text: Sub-Test1, area: subtest1 }, { text: { en: Subscription, fr: Abonnement } }, { text: MG-NonProd }]
      - [{ text: Sub-Partner, area: subpartner }, { text: { en: Subscription, fr: Abonnement } }, { text: { en: Tenant root group, fr: Groupe racine du locataire } }]
answer:
  values: { p1: mgprod, p2: mgcontoso }
explanation:
  correct:
    en: Policy and role assignments made on a management group are inherited by all its child management groups and subscriptions, including ones added later. MG-Prod contains exactly the production subscriptions. MG-Contoso contains MG-Prod and MG-NonProd, and therefore the four Contoso subscriptions, while Sub-Partner sits directly under the Tenant root group, so an assignment on the root would also reach it.
    fr: "Les attributions de stratégies et de rôles effectuées sur un groupe d'administration sont héritées par tous ses groupes d'administration et abonnements enfants, y compris ceux ajoutés plus tard. MG-Prod contient exactement les abonnements de production. MG-Contoso contient MG-Prod et MG-NonProd, donc les quatre abonnements Contoso, tandis que Sub-Partner se trouve directement sous le Groupe racine du locataire : une attribution sur la racine l'atteindrait aussi."
references:
  - title: Organize your resources with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
