id: i1-026-b2b-guest-properties
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    The Microsoft Entra tenant of Contoso uses the initial domain **contoso.onmicrosoft.com**. From **Users > New user > Invite external user**, you invite **lena@fabrikam.com**. Fabrikam uses its own Microsoft Entra tenant. You don't change any default setting.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le locataire Microsoft Entra de Contoso utilise le domaine initial **contoso.onmicrosoft.com**. Depuis **Users > New user > Invite external user**, vous invitez **lena@fabrikam.com**. Fabrikam utilise son propre locataire Microsoft Entra. Vous ne modifiez aucun paramètre par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The user principal name of the new account is lena_fabrikam.com#EXT#@contoso.onmicrosoft.com."
        fr: "Le nom d'utilisateur principal du nouveau compte est lena_fabrikam.com#EXT#@contoso.onmicrosoft.com."
    - id: s2
      text:
        en: "The user type of the new account is Member."
        fr: "Le type d'utilisateur du nouveau compte est Member."
    - id: s3
      text:
        en: "After Lena redeems the invitation, the Identities property of the account shows ExternalAzureAD."
        fr: "Après que Lena a échangé l'invitation, la propriété Identities du compte affiche ExternalAzureAD."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A B2B guest's UPN is the guest's email (with @ replaced by _), followed by #EXT# and the inviting tenant's onmicrosoft.com domain. Invited B2B users get the user type Guest by default; inviting them as members requires the invitation APIs. A user who authenticates with another Microsoft Entra organization shows ExternalAzureAD as identity."
    fr: "L'UPN d'un invité B2B est son adresse e-mail (@ remplacé par _), suivie de #EXT# et du domaine onmicrosoft.com du locataire qui invite. Les utilisateurs B2B invités reçoivent par défaut le type Guest ; les inviter comme membres exige les API d'invitation. Un utilisateur qui s'authentifie auprès d'une autre organisation Microsoft Entra affiche ExternalAzureAD comme identité."
references:
  - title: B2B guest user properties
    url: https://learn.microsoft.com/en-us/entra/external-id/user-properties
