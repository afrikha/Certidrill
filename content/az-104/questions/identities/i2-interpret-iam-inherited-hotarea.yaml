id: i2-interpret-iam-inherited-hotarea
objective: "1.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has the hierarchy **MG-Fabrikam** > **Sub-Corp** > **RG-Finance**. RG-Finance contains a storage account named **stfin01** and a virtual machine named **vm-fin01**. A user named Bob is a member of a group named **FinOps**.

    You open **Access control (IAM)** on RG-Finance, select **Check access** for Bob, and get the following list of role assignments.

    Answer each prompt by selecting the appropriate role assignment.
  fr: |
    Fabrikam dispose de la hiérarchie **MG-Fabrikam** > **Sub-Corp** > **RG-Finance**. RG-Finance contient un compte de stockage nommé **stfin01** et une machine virtuelle nommée **vm-fin01**. Un utilisateur nommé Bob est membre d'un groupe nommé **FinOps**.

    Vous ouvrez **Contrôle d'accès (IAM)** sur RG-Finance, sélectionnez **Vérifier l'accès** pour Bob et obtenez la liste d'attributions de rôles suivante.

    Répondez à chaque consigne en sélectionnant l'attribution de rôle appropriée.
body:
  prompts:
    - id: p1
      text: { en: Which assignment allows Bob to delete stfin01?, fr: Quelle attribution permet à Bob de supprimer stfin01 ? }
    - id: p2
      text: { en: Which assignment can be removed only from Access control (IAM) of Sub-Corp?, fr: Quelle attribution ne peut être supprimée que depuis Contrôle d'accès (IAM) de Sub-Corp ? }
  grid:
    header: [ { en: Role, fr: Rôle }, { en: Assigned to, fr: Attribué à }, { en: Scope, fr: Étendue } ]
    rows:
      - [ { text: Reader, area: r1 }, { text: Bob }, { text: { en: This resource, fr: Cette ressource } } ]
      - [ { text: Virtual Machine Contributor, area: r2 }, { text: Bob }, { text: { en: This resource, fr: Cette ressource } } ]
      - [ { text: Storage Account Contributor, area: r3 }, { text: FinOps }, { text: { en: "Management group (Inherited)", fr: "Groupe d'administration (hérité)" } } ]
      - [ { text: Monitoring Reader, area: r4 }, { text: Bob }, { text: { en: "Subscription (Inherited)", fr: "Abonnement (hérité)" } } ]
answer:
  values: { p1: r3, p2: r4 }
explanation:
  correct:
    en: Storage Account Contributor permits management of storage accounts, including deletion, and Bob receives it through FinOps from MG-Fabrikam. An inherited assignment cannot be removed at a child scope; you must open Access control (IAM) at the scope where it was made, which is Sub-Corp for Monitoring Reader.
    fr: Storage Account Contributor permet la gestion des comptes de stockage, y compris leur suppression, et Bob le reçoit via FinOps depuis MG-Fabrikam. Une attribution héritée ne peut pas être supprimée à une étendue enfant ; il faut ouvrir Contrôle d'accès (IAM) à l'étendue où elle a été créée, soit Sub-Corp pour Monitoring Reader.
  options:
    r1: { en: Reader cannot delete resources., fr: Reader ne peut pas supprimer de ressources. }
    r2: { en: "Virtual Machine Contributor manages VMs, not storage accounts, and it is assigned at this resource group.", fr: "Virtual Machine Contributor gère les machines virtuelles, pas les comptes de stockage, et il est attribué sur ce groupe de ressources." }
    r3: { en: "For p2, this assignment is inherited from the management group, so it is removed from Access control (IAM) of MG-Fabrikam.", fr: "Pour p2, cette attribution est héritée du groupe d'administration ; elle se supprime donc depuis Contrôle d'accès (IAM) de MG-Fabrikam." }
references:
  - title: List Azure role assignments using the Azure portal - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-portal
  - title: Remove Azure role assignments - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-remove
