id: i3-cost-tools-match
objective: "1.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The FinOps team at Fabrikam has the cost management requirements shown in the answer area.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.
  fr: |
    L'équipe FinOps de Fabrikam a les exigences de gestion des coûts présentées dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: advisor, text: Azure Advisor }
    - { id: budget, text: { en: Budgets, fr: Budgets } }
    - { id: analysis, text: { en: Cost analysis, fr: Analyse des coûts } }
    - { id: policy, text: Azure Policy }
    - { id: locks, text: { en: Resource locks, fr: Verrous de ressources } }
    - { id: mg, text: { en: Management groups, fr: Groupes d'administration } }
  targets:
    - id: t1
      text: { en: "Identify underutilized virtual machines that could be resized or shut down", fr: "Identifier les machines virtuelles sous-utilisées qui pourraient être redimensionnées ou arrêtées" }
    - id: t2
      text: { en: "Send an email when monthly spending reaches 80 percent of a set amount", fr: "Envoyer un e-mail lorsque les dépenses mensuelles atteignent 80 % d'un montant défini" }
    - id: t3
      text: { en: "View last quarter's costs grouped by the Department tag", fr: "Afficher les coûts du dernier trimestre regroupés par l'étiquette Department" }
    - id: t4
      text: { en: "Ensure that every new resource is created with a Department tag", fr: "Garantir que chaque nouvelle ressource est créée avec une étiquette Department" }
answer:
  mapping: { t1: advisor, t2: budget, t3: analysis, t4: policy }
explanation:
  correct:
    en: Azure Advisor cost recommendations identify underutilized VMs to resize or shut down. Budgets send alerts at thresholds of actual or forecasted cost. Cost analysis lets you group and filter costs, for example by tag. Azure Policy can require a tag at creation with a deny effect, or add it with modify.
    fr: "Les recommandations de coût d'Azure Advisor identifient les machines virtuelles sous-utilisées à redimensionner ou à arrêter. Les budgets envoient des alertes à des seuils de coût réel ou prévu. L'analyse des coûts permet de regrouper et de filtrer les coûts, par exemple par étiquette. Azure Policy peut exiger une étiquette à la création avec l'effet deny, ou l'ajouter avec modify."
  options:
    locks: { en: "Locks prevent deletion or modification; they do not manage costs or tags.", fr: "Les verrous empêchent la suppression ou la modification ; ils ne gèrent ni les coûts ni les étiquettes." }
    mg: { en: "Management groups organize subscriptions; they do not report or enforce tags by themselves.", fr: "Les groupes d'administration organisent les abonnements ; ils ne publient ni n'imposent d'étiquettes par eux-mêmes." }
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
  - title: Tutorial - Create and manage budgets
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
