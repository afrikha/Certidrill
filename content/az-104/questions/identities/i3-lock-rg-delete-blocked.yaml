id: i3-lock-rg-delete-blocked
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A resource group named **RG-Lab** has no lock. It contains three resources: a virtual machine named **VM-Lab1** that has a **Delete** lock, a virtual network, and a storage account. User1 has the Owner role on the subscription and runs `az group delete --name RG-Lab`.

    What is the result?
  fr: |
    Un groupe de ressources nommé **RG-Lab** n'a aucun verrou. Il contient trois ressources : une machine virtuelle nommée **VM-Lab1** qui a un verrou **Suppression**, un réseau virtuel et un compte de stockage. User1 a le rôle Owner sur l'abonnement et exécute `az group delete --name RG-Lab`.

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "The operation fails and no resource is deleted.", fr: "L'opération échoue et aucune ressource n'est supprimée." } }
    - { id: b, text: { en: "The virtual network and the storage account are deleted; VM-Lab1 and RG-Lab remain.", fr: "Le réseau virtuel et le compte de stockage sont supprimés ; VM-Lab1 et RG-Lab sont conservés." } }
    - { id: c, text: { en: "Everything is deleted because User1 is an Owner at the subscription scope.", fr: "Tout est supprimé, car User1 est Owner à l'étendue de l'abonnement." } }
    - { id: d, text: { en: "VM-Lab1 is moved to a new resource group and RG-Lab is deleted.", fr: "VM-Lab1 est déplacée dans un nouveau groupe de ressources et RG-Lab est supprimé." } }
answer: { optionId: a }
explanation:
  correct:
    en: When a resource in a resource group has a Delete lock, an attempt to delete the resource group is blocked as a whole. A partial deletion is not possible, even though the resource group and the other resources are not locked.
    fr: "Lorsqu'une ressource d'un groupe de ressources a un verrou Suppression, la tentative de suppression du groupe de ressources est entièrement bloquée. Une suppression partielle n'est pas possible, même si le groupe de ressources et les autres ressources ne sont pas verrouillés."
  options:
    b: { en: "Azure does not perform a partial deletion of the resource group.", fr: "Azure n'effectue pas de suppression partielle du groupe de ressources." }
    c: { en: "Locks override permissions for all users, including Owners.", fr: "Les verrous priment sur les autorisations de tous les utilisateurs, Owners compris." }
    d: { en: "Azure never moves resources automatically during a deletion.", fr: "Azure ne déplace jamais automatiquement des ressources lors d'une suppression." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
