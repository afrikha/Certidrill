id: i3-sub-change-directory-account
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a subscription named **Sub-Lab** that trusts the Microsoft Entra tenant **northwindlab.onmicrosoft.com**. You need to associate Sub-Lab with the corporate tenant **northwind.onmicrosoft.com** by using **Change directory** in the Azure portal.

    Which account can perform the operation?
  fr: |
    Northwind Traders dispose d'un abonnement nommé **Sub-Lab** qui fait confiance au locataire Microsoft Entra **northwindlab.onmicrosoft.com**. Vous devez associer Sub-Lab au locataire de l'entreprise **northwind.onmicrosoft.com** avec **Changer d'annuaire** dans le portail Azure.

    Quel compte peut effectuer l'opération ?
body:
  options:
    - { id: a, text: { en: "An account that has the Owner role on Sub-Lab and exists in both tenants", fr: "Un compte qui a le rôle Owner sur Sub-Lab et qui existe dans les deux locataires" } }
    - { id: b, text: { en: "An account that is a Global Administrator of northwind.onmicrosoft.com only", fr: "Un compte qui est uniquement Administrateur général de northwind.onmicrosoft.com" } }
    - { id: c, text: { en: "An account that has the Contributor role on Sub-Lab and exists in both tenants", fr: "Un compte qui a le rôle Contributor sur Sub-Lab et qui existe dans les deux locataires" } }
    - { id: d, text: { en: "An account that has the User Access Administrator role on Sub-Lab and exists only in northwindlab.onmicrosoft.com", fr: "Un compte qui a le rôle User Access Administrator sur Sub-Lab et qui existe uniquement dans northwindlab.onmicrosoft.com" } }
answer: { optionId: a }
explanation:
  correct:
    en: To change the directory of a subscription, you sign in with an account that has an Owner role assignment on the subscription and that exists in both the current directory and the new directory (for example as a B2B guest in one of them).
    fr: "Pour changer l'annuaire d'un abonnement, vous vous connectez avec un compte qui a une attribution du rôle Owner sur l'abonnement et qui existe à la fois dans l'annuaire actuel et dans le nouvel annuaire (par exemple en tant qu'invité B2B dans l'un d'eux)."
  options:
    b: { en: "A Microsoft Entra role in the target tenant grants no right on the subscription itself.", fr: "Un rôle Microsoft Entra dans le locataire cible n'accorde aucun droit sur l'abonnement lui-même." }
    c: { en: "Contributor is not enough; the Owner role is required.", fr: "Contributor ne suffit pas ; le rôle Owner est requis." }
    d: { en: "The account must be Owner and must also exist in the target directory.", fr: "Le compte doit être Owner et doit aussi exister dans l'annuaire cible." }
references:
  - title: Add an existing Azure subscription to your tenant
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptions-associated-directory
