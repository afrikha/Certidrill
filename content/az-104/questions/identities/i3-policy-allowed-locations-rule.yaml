id: i3-policy-allowed-locations-rule
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso wants to prevent anyone from creating resources outside the regions listed in a parameter named **allowedLocations**. You write the following policy rule.

    How should you complete the rule? Select the appropriate options in the answer area.
  fr: |
    Contoso veut empêcher quiconque de créer des ressources en dehors des régions listées dans un paramètre nommé **allowedLocations**. Vous écrivez la règle de stratégie suivante.

    Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: json
  template: |
    "policyRule": {
      "if": {
        "allOf": [
          {
            "field": "[[field]]",
            "[[op]]": "[parameters('allowedLocations')]"
          },
          {
            "field": "location",
            "notEquals": "global"
          }
        ]
      },
      "then": {
        "effect": "[[effect]]"
      }
    }
  slots:
    - id: field
      options:
        - { id: location, text: location }
        - { id: type, text: type }
        - { id: kind, text: kind }
        - { id: tags, text: tags }
    - id: op
      options:
        - { id: notin, text: notIn }
        - { id: in, text: in }
        - { id: equals, text: equals }
        - { id: like, text: like }
    - id: effect
      options:
        - { id: deny, text: deny }
        - { id: audit, text: audit }
        - { id: append, text: append }
        - { id: disabled, text: disabled }
answer:
  values: { field: location, op: notin, effect: deny }
explanation:
  correct:
    en: "The rule must match resources whose `location` field is not in the allowed list, so the condition is `\"field\": \"location\"` with `notIn` against the parameter. The `deny` effect then rejects the create or update request. The second condition excludes global resources, which have no regional location."
    fr: "La règle doit correspondre aux ressources dont le champ `location` n'est pas dans la liste autorisée : la condition est donc `\"field\": \"location\"` avec `notIn` sur le paramètre. L'effet `deny` rejette ensuite la requête de création ou de mise à jour. La seconde condition exclut les ressources globales, qui n'ont pas d'emplacement régional."
  options:
    type: { en: "type is the resource type (for example Microsoft.Storage/storageAccounts), not the region.", fr: "type est le type de ressource (par exemple Microsoft.Storage/storageAccounts), pas la région." }
    in: { en: "in would match the allowed regions and deny exactly the resources you want to allow.", fr: "in correspondrait aux régions autorisées et refuserait justement les ressources à autoriser." }
    audit: { en: "audit only reports the resource; it does not prevent its creation.", fr: "audit signale seulement la ressource ; il n'empêche pas sa création." }
references:
  - title: Details of the policy definition structure policy rules
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/definition-structure-policy-rule
