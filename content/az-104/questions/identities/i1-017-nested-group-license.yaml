id: i1-017-nested-group-license
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses group-based licensing. A Microsoft 365 E3 license is assigned to the security group **LIC-E3**. LIC-E3 contains 10 users and the security group **TEAM-B**, which contains 25 users. All users have a usage location and enough licenses are available.

    The 10 direct members of LIC-E3 have the license, but the members of TEAM-B don't.

    You need the members of TEAM-B to receive the license through group-based licensing. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys utilise la licence basée sur un groupe. Une licence Microsoft 365 E3 est attribuée au groupe de sécurité **LIC-E3**. LIC-E3 contient 10 utilisateurs et le groupe de sécurité **TEAM-B**, qui contient 25 utilisateurs. Tous les utilisateurs ont un emplacement d'utilisation et les licences disponibles sont suffisantes.

    Les 10 membres directs de LIC-E3 ont la licence, mais pas les membres de TEAM-B.

    Vous devez faire en sorte que les membres de TEAM-B reçoivent la licence par le biais de la licence basée sur un groupe. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Microsoft 365 E3 license to TEAM-B.", fr: "Attribuer la licence Microsoft 365 E3 à TEAM-B." }
    - id: b
      text: { en: "Select Reprocess for LIC-E3 in the license assignment errors.", fr: "Sélectionner Retraiter (Reprocess) pour LIC-E3 dans les erreurs d'attribution de licence." }
    - id: c
      text: { en: "Set the usage location of each TEAM-B member again.", fr: "Redéfinir l'emplacement d'utilisation de chaque membre de TEAM-B." }
    - id: d
      text: { en: "Change the membership type of LIC-E3 to Dynamic User.", fr: "Changer le type d'appartenance de LIC-E3 en Dynamic User." }
answer: { optionId: a }
explanation:
  correct:
    en: "Group-based licensing doesn't support nested groups; when a license is assigned to a group that contains groups, only the first-level users get it. Assigning the license to TEAM-B itself gives its members the license with a single action."
    fr: "La licence basée sur un groupe ne prend pas en charge les groupes imbriqués : quand une licence est attribuée à un groupe qui contient des groupes, seuls les utilisateurs de premier niveau la reçoivent. Attribuer la licence directement à TEAM-B la donne à ses membres en une seule action."
  options:
    b: { en: "Reprocessing retries the same assignment, which still ignores nested members.", fr: "Le retraitement relance la même attribution, qui ignore toujours les membres imbriqués." }
    c: { en: "Usage location isn't the problem; nesting is.", fr: "L'emplacement d'utilisation n'est pas le problème ; c'est l'imbrication." }
    d: { en: "Converting LIC-E3 would replace its members with the rule results and requires writing a rule; it isn't needed.", fr: "Convertir LIC-E3 remplacerait ses membres par le résultat d'une règle à écrire ; ce n'est pas nécessaire." }
references:
  - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
