id: sr-02-q4
objective: "1.2.1"
type: series_yesno
series: sr-02-vm-operators
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You assign the same custom role to VMOps at the scope of Sub1.
  fr: |
    Vous attribuez le même rôle personnalisé à VMOps à l'étendue de Sub1.
body:
  solution:
    en: |
      You create a custom role that contains only the `read`, `start/action`, `restart/action` and `deallocate/action` operations of `Microsoft.Compute/virtualMachines`. You assign the role to the VMOps group at the scope of **Sub1**.
    fr: |
      Vous créez un rôle personnalisé qui contient uniquement les opérations `read`, `start/action`, `restart/action` et `deallocate/action` de `Microsoft.Compute/virtualMachines`. Vous attribuez ce rôle au groupe VMOps à l'étendue de **Sub1**.
answer: { value: false }
explanation:
  correct:
    en: |
      The permissions are right, but the scope isn't. An assignment at the subscription scope is inherited by RG2, so VMOps could also start and deallocate the virtual machines of RG2, which the goal forbids. Least privilege requires assigning the role at the RG1 scope.
    fr: |
      Les autorisations sont correctes, mais pas l'étendue. Une attribution à l'étendue de l'abonnement est héritée par RG2 : VMOps pourrait aussi démarrer et libérer les machines virtuelles de RG2, ce que l'objectif interdit. Le privilège minimum impose d'attribuer le rôle à l'étendue de RG1.
references:
  - title: "Understand scope for Azure RBAC"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
