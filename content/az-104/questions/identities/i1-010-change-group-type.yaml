id: i1-010-change-group-type
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Microsoft Entra tenant that contains a security group named **Project-Atlas**. The project team now needs a shared group mailbox, so the group must become a Microsoft 365 group.

    What should you do?
  fr: |
    Proseware dispose d'un locataire Microsoft Entra qui contient un groupe de sécurité nommé **Project-Atlas**. L'équipe projet a désormais besoin d'une boîte aux lettres de groupe partagée : le groupe doit devenir un groupe Microsoft 365.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a new Microsoft 365 group, add the members, and then delete Project-Atlas.", fr: "Créer un nouveau groupe Microsoft 365, y ajouter les membres, puis supprimer Project-Atlas." }
    - id: b
      text: { en: "In the properties of Project-Atlas, change the Group type to Microsoft 365.", fr: "Dans les propriétés de Project-Atlas, changer le type de groupe en Microsoft 365." }
    - id: c
      text: { en: "In the properties of Project-Atlas, change the Membership type to Dynamic User.", fr: "Dans les propriétés de Project-Atlas, changer le type d'appartenance en Dynamic User." }
    - id: d
      text: { en: "Add Project-Atlas as a member of an existing Microsoft 365 group.", fr: "Ajouter Project-Atlas comme membre d'un groupe Microsoft 365 existant." }
answer: { optionId: a }
explanation:
  correct:
    en: The group type can't be changed after a group is created. To get a Microsoft 365 group, you must create a new group of that type (which offers a group email address) and delete the old one.
    fr: Le type d'un groupe ne peut pas être modifié après sa création. Pour obtenir un groupe Microsoft 365, il faut créer un nouveau groupe de ce type (qui propose une adresse e-mail de groupe) et supprimer l'ancien.
  options:
    b: { en: The Group type field is fixed once the group exists., fr: Le champ Type de groupe est figé une fois le groupe créé. }
    c: { en: The membership type controls how members are added, not whether the group is a security or Microsoft 365 group., fr: Le type d'appartenance contrôle la façon dont les membres sont ajoutés, pas la nature sécurité ou Microsoft 365 du groupe. }
    d: { en: Security groups can't be added as members of Microsoft 365 groups., fr: Les groupes de sécurité ne peuvent pas être ajoutés comme membres de groupes Microsoft 365. }
references:
  - title: How to manage groups
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-groups
