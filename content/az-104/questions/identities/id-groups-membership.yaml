id: id-groups-membership
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your company uses a Microsoft Entra tenant licensed with Microsoft Entra ID P1. You plan the group structure of the tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Votre entreprise utilise un locataire Microsoft Entra disposant de licences Microsoft Entra ID P1. Vous planifiez la structure des groupes du locataire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A security group can use a dynamic membership rule based on the user's department attribute.
        fr: Un groupe de sécurité peut utiliser une règle d'appartenance dynamique fondée sur l'attribut department de l'utilisateur.
    - id: s2
      text:
        en: A Microsoft 365 group can contain devices as members.
        fr: Un groupe Microsoft 365 peut contenir des appareils comme membres.
    - id: s3
      text:
        en: A guest user can be added as a member of a security group.
        fr: Un utilisateur invité peut être ajouté comme membre d'un groupe de sécurité.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Dynamic membership rules on user attributes such as `user.department` are available for security groups and Microsoft 365 groups with Entra ID P1. Microsoft 365 groups only contain users; devices can only be members of security groups. Guest (B2B) users are directory objects that can be added to security groups like members.
    fr: Les règles d'appartenance dynamique sur des attributs utilisateur comme `user.department` sont disponibles pour les groupes de sécurité et les groupes Microsoft 365 avec Entra ID P1. Les groupes Microsoft 365 ne contiennent que des utilisateurs ; les appareils ne peuvent être membres que de groupes de sécurité. Les utilisateurs invités (B2B) sont des objets de l'annuaire qui peuvent être ajoutés aux groupes de sécurité comme les membres.
references:
  - title: Learn about groups and access rights in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups
  - title: Dynamic membership rules for groups in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
