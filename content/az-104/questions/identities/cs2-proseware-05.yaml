id: cs2-proseware-05
objective: "1.3.6"
type: single
caseStudy: cs2-proseware
difficulty: 2
status: draft
stem:
  en: You need to meet the business requirement for the finance team. What should you configure?
  fr: Vous devez satisfaire l'exigence métier concernant l'équipe financière. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A monthly budget of CAD 25,000 on Sub-Learning with a Forecasted alert condition at 100% that emails the finance team", fr: "Un budget mensuel de 25 000 CAD sur Sub-Learning avec une condition d'alerte Prévu à 100 % qui envoie un e-mail à l'équipe financière" } }
    - { id: b, text: { en: "A monthly budget of CAD 25,000 on Sub-Learning with an Actual alert condition at 100% that emails the finance team", fr: "Un budget mensuel de 25 000 CAD sur Sub-Learning avec une condition d'alerte Réel à 100 % qui envoie un e-mail à l'équipe financière" } }
    - { id: c, text: { en: "An Azure Advisor cost recommendation alert for Sub-Learning", fr: "Une alerte de recommandation de coût Azure Advisor pour Sub-Learning" } }
    - { id: d, text: { en: "An activity log alert on Sub-Learning that uses AG-Ops", fr: "Une alerte de journal d'activité sur Sub-Learning qui utilise AG-Ops" } }
answer: { optionId: a }
explanation:
  correct:
    en: A Cost Management budget can evaluate the forecasted cost of the period. A Forecasted alert condition at 100% of CAD 25,000 notifies the finance team as soon as the projected monthly cost exceeds the amount, before it is spent.
    fr: Un budget Cost Management peut évaluer le coût prévu de la période. Une condition d'alerte Prévu à 100 % de 25 000 CAD avertit l'équipe financière dès que le coût mensuel projeté dépasse ce montant, avant qu'il ne soit dépensé.
  options:
    b: { en: "An Actual condition fires only after the money has been spent.", fr: "Une condition Réel ne se déclenche qu'une fois l'argent dépensé." }
    c: { en: "Advisor recommends savings; it does not compare the spending with an amount.", fr: "Advisor recommande des économies ; il ne compare pas les dépenses à un montant." }
    d: { en: "Activity log alerts react to control plane operations and service events, not to costs.", fr: "Les alertes de journal d'activité réagissent aux opérations du plan de contrôle et aux événements de service, pas aux coûts." }
references:
  - title: "Tutorial - Create and manage budgets - Microsoft Cost Management"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
