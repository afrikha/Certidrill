id: i3-lock-cli-storage
objective: "1.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware has a storage account named **stlitwarelogs** in a resource group named **RG-Logs**. Users must still be able to change the configuration of the account and list its keys, but the account must not be deleted.

    You need to complete the following Azure CLI command. How should you complete the command? Select the appropriate options in the answer area.
  fr: |
    Litware dispose d'un compte de stockage nommé **stlitwarelogs** dans un groupe de ressources nommé **RG-Logs**. Les utilisateurs doivent toujours pouvoir modifier la configuration du compte et afficher ses clés, mais le compte ne doit pas être supprimé.

    Vous devez compléter la commande Azure CLI suivante. Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] --name lock-stlogs \
      --lock-type [[level]] \
      --resource-group RG-Logs \
      --resource-name stlitwarelogs \
      --resource-type [[rtype]]
  slots:
    - id: cmd
      options:
        - { id: lock, text: az lock create }
        - { id: policy, text: az policy assignment create }
        - { id: tag, text: az tag create }
        - { id: role, text: az role assignment create }
    - id: level
      options:
        - { id: cnd, text: CanNotDelete }
        - { id: ro, text: ReadOnly }
        - { id: del, text: Delete }
        - { id: dnd, text: DoNotDelete }
    - id: rtype
      options:
        - { id: sa, text: Microsoft.Storage/storageAccounts }
        - { id: blob, text: Microsoft.Storage/storageAccounts/blobServices }
        - { id: rg, text: Microsoft.Resources/resourceGroups }
answer:
  values: { cmd: lock, level: cnd, rtype: sa }
explanation:
  correct:
    en: "`az lock create` creates a management lock. On the command line the two levels are CanNotDelete and ReadOnly; CanNotDelete blocks deletion only. Listing keys is a POST operation that a ReadOnly lock would block. To lock a single resource you pass its name and its resource type, here Microsoft.Storage/storageAccounts."
    fr: "`az lock create` crée un verrou de gestion. En ligne de commande, les deux niveaux sont CanNotDelete et ReadOnly ; CanNotDelete bloque uniquement la suppression. L'affichage des clés est une opération POST qu'un verrou ReadOnly bloquerait. Pour verrouiller une seule ressource, vous indiquez son nom et son type de ressource, ici Microsoft.Storage/storageAccounts."
  options:
    ro: { en: "ReadOnly would block configuration changes and the listKeys operation.", fr: "ReadOnly bloquerait les modifications de configuration et l'opération listKeys." }
    del: { en: "Delete is the portal name of the level; the CLI value is CanNotDelete.", fr: "Suppression (Delete) est le nom du niveau dans le portail ; la valeur CLI est CanNotDelete." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
