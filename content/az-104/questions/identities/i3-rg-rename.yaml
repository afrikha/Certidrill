id: i3-rg-rename
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a resource group named **rg-temp-01** that contains a web app, an App Service plan and a storage account, all of which support move operations. To follow a new naming convention, the resources must be in a resource group named **rg-crm-prod** in the same subscription.

    What should you do?
  fr: |
    Fabrikam dispose d'un groupe de ressources nommé **rg-temp-01** qui contient une application web, un plan App Service et un compte de stockage, qui prennent tous en charge le déplacement. Pour respecter une nouvelle convention de nommage, les ressources doivent se trouver dans un groupe de ressources nommé **rg-crm-prod** dans le même abonnement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create rg-crm-prod, and then move the resources from rg-temp-01 to rg-crm-prod.", fr: "Créer rg-crm-prod, puis déplacer les ressources de rg-temp-01 vers rg-crm-prod." } }
    - { id: b, text: { en: "Rename rg-temp-01 from its Overview page in the Azure portal.", fr: "Renommer rg-temp-01 depuis sa page Vue d'ensemble dans le portail Azure." } }
    - { id: c, text: { en: "Run az group update --name rg-temp-01 --set name=rg-crm-prod.", fr: "Exécuter az group update --name rg-temp-01 --set name=rg-crm-prod." } }
    - { id: d, text: { en: "Add the tag Name=rg-crm-prod to rg-temp-01.", fr: "Ajouter l'étiquette Name=rg-crm-prod à rg-temp-01." } }
answer: { optionId: a }
explanation:
  correct:
    en: A resource group cannot be renamed. To change the name, create a resource group with the new name and move the resources into it; then delete the empty old group if needed. Remember that the resource IDs change with the move.
    fr: "Un groupe de ressources ne peut pas être renommé. Pour changer de nom, créez un groupe de ressources portant le nouveau nom et déplacez-y les ressources, puis supprimez au besoin l'ancien groupe vide. N'oubliez pas que les ID de ressources changent avec le déplacement."
  options:
    b: { en: "The portal offers no rename operation for resource groups.", fr: "Le portail ne propose aucune opération de renommage pour les groupes de ressources." }
    c: { en: "The name of a resource group is immutable; the update is rejected.", fr: "Le nom d'un groupe de ressources est immuable ; la mise à jour est rejetée." }
    d: { en: "A tag adds metadata but does not change the name of the resource group.", fr: "Une étiquette ajoute des métadonnées mais ne change pas le nom du groupe de ressources." }
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
  - title: Use the Azure portal and Azure Resource Manager to manage resource groups
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
