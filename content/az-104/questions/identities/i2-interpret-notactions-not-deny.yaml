id: i2-interpret-notactions-not-deny
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a subscription named **Sub-Retail** that contains a resource group named **RG-POS**. A user named Ops2 has the following role assignments:

    | Role | Scope |
    | --- | --- |
    | Contributor | Sub-Retail |
    | User Access Administrator | RG-POS |

    The Contributor role definition includes `Microsoft.Authorization/*/Write` in its NotActions. No deny assignment and no condition applies to Ops2.

    Where can Ops2 create role assignments?
  fr: |
    Tailspin Toys dispose d'un abonnement nommé **Sub-Retail** qui contient un groupe de ressources nommé **RG-POS**. Un utilisateur nommé Ops2 dispose des attributions de rôles suivantes :

    | Rôle | Étendue |
    | --- | --- |
    | Contributor | Sub-Retail |
    | User Access Administrator | RG-POS |

    La définition du rôle Contributor inclut `Microsoft.Authorization/*/Write` dans ses NotActions. Aucune affectation de refus et aucune condition ne s'applique à Ops2.

    Où Ops2 peut-il créer des attributions de rôles ?
body:
  options:
    - { id: a, text: { en: On RG-POS and its resources only, fr: Sur RG-POS et ses ressources uniquement } }
    - { id: b, text: { en: Nowhere, because the NotActions of Contributor block role assignment writes, fr: Nulle part, car les NotActions de Contributor bloquent l'écriture d'attributions de rôles } }
    - { id: c, text: { en: On Sub-Retail and all its resource groups, fr: Sur Sub-Retail et tous ses groupes de ressources } }
    - { id: d, text: { en: On every resource group except RG-POS, fr: Sur tous les groupes de ressources sauf RG-POS } }
answer: { optionId: a }
explanation:
  correct:
    en: NotActions is not a deny rule; it only subtracts actions from the Contributor role itself. Because permissions are additive, the User Access Administrator assignment still grants `Microsoft.Authorization/*` on RG-POS and everything below it, but nowhere else in Sub-Retail.
    fr: NotActions n'est pas une règle de refus ; il retire seulement des actions du rôle Contributor lui-même. Les autorisations étant cumulatives, l'attribution User Access Administrator accorde toujours `Microsoft.Authorization/*` sur RG-POS et tout ce qu'il contient, mais nulle part ailleurs dans Sub-Retail.
  options:
    b:
      en: Only a deny assignment can block an action granted by another role; NotActions cannot.
      fr: Seule une affectation de refus peut bloquer une action accordée par un autre rôle ; NotActions ne le peut pas.
    c:
      en: User Access Administrator is assigned on RG-POS, and assignments are inherited downward only, not by the parent subscription.
      fr: User Access Administrator est attribué sur RG-POS, et les attributions ne sont héritées que vers le bas, pas par l'abonnement parent.
    d:
      en: Contributor at the subscription grants no role assignment rights anywhere; only RG-POS has User Access Administrator.
      fr: Contributor sur l'abonnement n'accorde aucun droit d'attribution de rôles ; seul RG-POS bénéficie de User Access Administrator.
references:
  - title: Understand Azure role definitions - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
