id: i2-interpret-cli-list-inherited
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is auditing the access of a user named `kim@northwind.com`. Kim has role assignments at the management group, subscription and resource group scopes, both directly and through Microsoft Entra groups.

    You need a single Azure CLI command that lists the role assignments that apply to Kim in the current subscription and below, **including** the assignments made at parent scopes and the assignments made to the groups Kim belongs to.

    Which command should you run?
  fr: |
    Northwind Traders audite l'accès d'une utilisatrice nommée `kim@northwind.com`. Kim dispose d'attributions de rôles aux étendues groupe d'administration, abonnement et groupe de ressources, directement et par l'intermédiaire de groupes Microsoft Entra.

    Vous avez besoin d'une seule commande Azure CLI qui liste les attributions de rôles s'appliquant à Kim dans l'abonnement actuel et en dessous, **y compris** les attributions effectuées à des étendues parentes et celles effectuées aux groupes dont Kim est membre.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az role assignment list --assignee kim@northwind.com --all --include-inherited --include-groups" }
    - { id: b, text: "az role assignment list --assignee kim@northwind.com --all --include-groups --output table" }
    - { id: c, text: "az role assignment list --assignee kim@northwind.com --all --include-inherited --output table" }
    - { id: d, text: "az role assignment list --assignee kim@northwind.com --include-inherited --include-groups --output table" }
answer: { optionId: a }
explanation:
  correct:
    en: By default `az role assignment list` only shows assignments for the current subscription. `--all` adds the scopes below it, `--include-inherited` adds assignments made at parent scopes such as management groups, and `--include-groups` adds assignments made to the groups the user is a transitive member of.
    fr: Par défaut, `az role assignment list` n'affiche que les attributions de l'abonnement actuel. `--all` ajoute les étendues inférieures, `--include-inherited` ajoute les attributions effectuées à des étendues parentes comme les groupes d'administration, et `--include-groups` ajoute les attributions faites aux groupes dont l'utilisateur est membre de manière transitive.
  options:
    b:
      en: Without --include-inherited, the command misses the assignments made at the management group scope. The output format has no effect on which assignments are returned.
      fr: Sans --include-inherited, la commande ne montre pas les attributions effectuées à l'étendue du groupe d'administration. Le format de sortie ne change pas les attributions renvoyées.
    c:
      en: Without --include-groups, the command misses the assignments that Kim receives through her groups.
      fr: Sans --include-groups, la commande ne montre pas les attributions que Kim reçoit par ses groupes.
    d:
      en: Without --all, the command shows only the assignments scoped to the subscription itself, not those made on its resource groups and resources.
      fr: Sans --all, la commande n'affiche que les attributions dont l'étendue est l'abonnement lui-même, pas celles effectuées sur ses groupes de ressources et ses ressources.
references:
  - title: List Azure role assignments using Azure CLI - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-cli
