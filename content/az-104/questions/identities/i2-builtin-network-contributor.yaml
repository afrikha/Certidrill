id: i2-builtin-network-contributor
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company, Tailspin Toys, has an Azure subscription named **Sub-Prod** that contains a resource group named **RG-Network**. RG-Network contains virtual networks, network security groups and route tables.

    A network engineer named Engineer1 must be able to create and modify the networking resources in RG-Network. Engineer1 must not be able to deploy or manage virtual machines and must not be able to grant access to other users. The solution must follow the principle of least privilege.

    Which built-in role should you assign to Engineer1 on RG-Network?
  fr: |
    Votre entreprise, Tailspin Toys, dispose d'un abonnement Azure nommé **Sub-Prod** qui contient un groupe de ressources nommé **RG-Network**. RG-Network contient des réseaux virtuels, des groupes de sécurité réseau et des tables de routage.

    Un ingénieur réseau nommé Engineer1 doit pouvoir créer et modifier les ressources réseau de RG-Network. Engineer1 ne doit pas pouvoir déployer ni gérer de machines virtuelles, et ne doit pas pouvoir accorder l'accès à d'autres utilisateurs. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer à Engineer1 sur RG-Network ?
body:
  options:
    - { id: a, text: Network Contributor }
    - { id: b, text: Contributor }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: Owner }
answer: { optionId: a }
explanation:
  correct:
    en: Network Contributor lets a user manage networks (virtual networks, NSGs, route tables…) but not access to them, and it does not grant permission to deploy or manage virtual machines. It is the narrowest built-in role that meets every requirement.
    fr: Network Contributor permet de gérer les réseaux (réseaux virtuels, NSG, tables de routage…) mais pas l'accès à ces ressources, et il n'accorde pas l'autorisation de déployer ou de gérer des machines virtuelles. C'est le rôle intégré le plus restreint qui répond à toutes les exigences.
  options:
    b:
      en: Contributor manages every resource type in RG-Network, including virtual machines, which exceeds the requirement.
      fr: Contributor gère tous les types de ressources de RG-Network, y compris les machines virtuelles, ce qui dépasse le besoin.
    c:
      en: Virtual Machine Contributor manages virtual machines and only lets you join existing networks; it does not let you create or modify virtual networks.
      fr: Virtual Machine Contributor gère les machines virtuelles et permet seulement de rejoindre des réseaux existants ; il ne permet pas de créer ni de modifier des réseaux virtuels.
    d:
      en: Owner grants full access to all resources and also allows assigning roles to other users.
      fr: Owner accorde un accès complet à toutes les ressources et permet aussi d'attribuer des rôles à d'autres utilisateurs.
references:
  - title: Azure built-in roles for Networking - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking
