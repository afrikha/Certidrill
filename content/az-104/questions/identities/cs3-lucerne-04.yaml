id: cs3-lucerne-04
objective: "1.1.4"
type: single
caseStudy: cs3-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the guest invitation requirement.

    What should you configure in the Microsoft Entra admin center?
  fr: |
    Vous devez satisfaire l'exigence relative aux invitations d'invités.

    Que devez-vous configurer dans le Centre d'administration Microsoft Entra ?
body:
  options:
    - { id: a, text: { en: "In External collaboration settings, set Collaboration restrictions to Allow invitations only to the specified domains and add litwareinc.com and adatum.com.", fr: "Dans les paramètres de collaboration externe, définir Restrictions de collaboration sur Autoriser les invitations uniquement pour les domaines spécifiés et ajouter litwareinc.com et adatum.com." } }
    - { id: b, text: { en: "In Cross-tenant access settings, add organizational settings for the tenants of Litware and Adatum and block inbound B2B collaboration by default.", fr: "Dans les paramètres d'accès interlocataire, ajouter des paramètres d'organisation pour les locataires de Litware et Adatum et bloquer par défaut la collaboration B2B entrante." } }
    - { id: c, text: { en: "In External collaboration settings, set Guest invite settings so that only users assigned to specific admin roles can invite guest users.", fr: "Dans les paramètres de collaboration externe, configurer les paramètres d'invitation des invités pour que seuls les utilisateurs disposant de rôles d'administrateur spécifiques puissent inviter des utilisateurs invités." } }
    - { id: d, text: { en: "Create a Conditional Access policy that blocks guest users whose domain isn't litwareinc.com or adatum.com.", fr: "Créer une stratégie d'accès conditionnel qui bloque les utilisateurs invités dont le domaine n'est pas litwareinc.com ou adatum.com." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The collaboration restrictions of the external collaboration settings define an allow list or a block list of domains for B2B invitations. With an allow list, invitations to any domain that isn't in the list fail."
    fr: "Les restrictions de collaboration des paramètres de collaboration externe définissent une liste d'autorisation ou de blocage de domaines pour les invitations B2B. Avec une liste d'autorisation, les invitations vers tout domaine absent de la liste échouent."
  options:
    b: { en: "Organizational settings in cross-tenant access settings target Microsoft Entra tenants; the agencies don't have one.", fr: "Les paramètres d'organisation des paramètres d'accès interlocataire ciblent des locataires Microsoft Entra ; les agences n'en ont pas." }
    c: { en: "Guest invite settings control who can send invitations, not which domains can be invited.", fr: "Les paramètres d'invitation des invités contrôlent qui peut envoyer des invitations, pas quels domaines peuvent être invités." }
    d: { en: "Conditional Access controls sign-in, not invitations; guests from other domains could still be invited.", fr: "L'accès conditionnel contrôle la connexion, pas les invitations ; des invités d'autres domaines pourraient encore être invités." }
references:
  - title: "Allow or block invitations - Microsoft Entra External ID"
    url: https://learn.microsoft.com/en-us/entra/external-id/allow-deny-list
