id: id-roles-least-privilege
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You need to grant permissions on a resource group named **RG1** to three teams. Each team must receive only the permissions it needs (principle of least privilege).

    Which built-in role should you assign to each team? To answer, drag the appropriate roles to the correct teams. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez accorder des autorisations sur un groupe de ressources nommé **RG1** à trois équipes. Chaque équipe ne doit recevoir que les autorisations dont elle a besoin (principe du moindre privilège).

    Quel rôle intégré devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: owner, text: Owner }
    - { id: contrib, text: Contributor }
    - { id: reader, text: Reader }
    - { id: uaa, text: User Access Administrator }
    - { id: vmc, text: Virtual Machine Contributor }
  targets:
    - id: ops
      text: { en: "Operations: manage virtual machines, but not the virtual networks or storage accounts they connect to", fr: "Exploitation : gérer les machines virtuelles, mais pas les réseaux virtuels ni les comptes de stockage auxquels elles sont connectées" }
    - id: sec
      text: { en: "Security: manage who has access to the resources, without managing the resources themselves", fr: "Sécurité : gérer qui a accès aux ressources, sans gérer les ressources elles-mêmes" }
    - id: audit
      text: { en: "Audit: view all resources without changing anything", fr: "Audit : consulter toutes les ressources sans rien modifier" }
answer:
  mapping: { ops: vmc, sec: uaa, audit: reader }
explanation:
  correct:
    en: Virtual Machine Contributor lets users manage VMs but not the virtual network or storage account they are connected to. User Access Administrator lets users manage access (role assignments) without managing resources. Reader lets users view everything without making changes. Owner and Contributor would grant more than required.
    fr: Virtual Machine Contributor permet de gérer les machines virtuelles, mais pas le réseau virtuel ni le compte de stockage auxquels elles sont connectées. User Access Administrator permet de gérer les accès (attributions de rôles) sans gérer les ressources. Reader permet de tout consulter sans rien modifier. Owner et Contributor accorderaient plus que nécessaire.
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
