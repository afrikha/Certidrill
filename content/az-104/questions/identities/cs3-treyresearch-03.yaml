id: cs3-treyresearch-03
objective: "1.3.7"
type: yesno_statements
caseStudy: cs3-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the governance requirement for Sub-Proteomics.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous devez satisfaire l'exigence de gouvernance pour Sub-Proteomics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "Sub-Proteomics is currently a child of the Tenant root group."
        fr: "Sub-Proteomics est actuellement un enfant du Groupe racine du locataire."
    - id: s2
      text:
        en: "To receive the policy assignments of both MG-Trey and MG-Research, Sub-Proteomics must be a child of both management groups."
        fr: "Pour recevoir les attributions de stratégies de MG-Trey et de MG-Research, Sub-Proteomics doit être un enfant des deux groupes d'administration."
    - id: s3
      text:
        en: "After you move Sub-Proteomics to MG-Research, the policy assignments of MG-Trey apply to Sub-Proteomics."
        fr: "Après le déplacement de Sub-Proteomics vers MG-Research, les attributions de stratégies de MG-Trey s'appliquent à Sub-Proteomics."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "New subscriptions are placed in the root management group by default, and nobody moved Sub-Proteomics. A subscription can have only one parent management group. Assignments are inherited down the hierarchy, so a subscription under MG-Research also receives the assignments of MG-Trey, the parent of MG-Research."
    fr: "Les nouveaux abonnements sont placés par défaut dans le groupe d'administration racine, et personne n'a déplacé Sub-Proteomics. Un abonnement ne peut avoir qu'un seul groupe d'administration parent. Les attributions sont héritées dans la hiérarchie : un abonnement sous MG-Research reçoit aussi les attributions de MG-Trey, le parent de MG-Research."
references:
  - title: "Organize your resources with management groups - Azure Governance"
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
