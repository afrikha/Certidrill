id: i2-interpret-global-admin-elevate
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    At Proseware, a user named GA1 holds the Microsoft Entra **Global Administrator** role. GA1 has no Azure role assignment. When GA1 signs in to the Azure portal, no subscription of the tenant is listed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Chez Proseware, un utilisateur nommé GA1 dispose du rôle Microsoft Entra **Administrateur général**. GA1 n'a aucune attribution de rôle Azure. Lorsque GA1 se connecte au portail Azure, aucun abonnement du locataire n'est affiché.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: The Global Administrator role automatically grants GA1 the Owner role on every subscription of the tenant.
        fr: Le rôle Administrateur général accorde automatiquement à GA1 le rôle Owner sur chaque abonnement du locataire.
    - id: s2
      text:
        en: If GA1 sets **Access management for Azure resources** to **Yes**, GA1 is assigned the User Access Administrator role at root scope (/).
        fr: Si GA1 définit **Gestion de l'accès pour les ressources Azure** sur **Oui**, GA1 se voit attribuer le rôle User Access Administrator à l'étendue racine (/).
    - id: s3
      text:
        en: Microsoft recommends removing this elevated access once GA1 has made the required changes at root scope.
        fr: Microsoft recommande de supprimer cet accès élevé une fois que GA1 a effectué les modifications nécessaires à l'étendue racine.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Microsoft Entra ID and Azure resources are secured independently; Microsoft Entra roles do not grant access to Azure resources. A Global Administrator can elevate access with the Access management for Azure resources toggle, which assigns User Access Administrator at root scope so they can view all resources and assign access in any subscription or management group. This elevated access should be removed after use.
    fr: Microsoft Entra ID et les ressources Azure sont sécurisés indépendamment ; les rôles Microsoft Entra n'accordent pas l'accès aux ressources Azure. Un Administrateur général peut élever son accès avec le bouton bascule Gestion de l'accès pour les ressources Azure, qui lui attribue User Access Administrator à l'étendue racine afin de voir toutes les ressources et d'attribuer l'accès dans n'importe quel abonnement ou groupe d'administration. Cet accès élevé doit être supprimé après usage.
references:
  - title: Elevate access to manage all Azure subscriptions and management groups
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin
