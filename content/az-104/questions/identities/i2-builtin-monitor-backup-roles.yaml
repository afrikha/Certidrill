id: i2-builtin-monitor-backup-roles
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure subscription named **Sub-Ops** that contains virtual machines protected by a Recovery Services vault named **rsv-adatum**. You need to grant permissions to four operations teams. Each team must receive only the permissions it needs (principle of least privilege).

    Which built-in role should you assign to each team? To answer, drag the appropriate roles to the correct teams. Each role may be used once or not at all.
  fr: |
    Adatum dispose d'un abonnement Azure nommé **Sub-Ops** qui contient des machines virtuelles protégées par un coffre Recovery Services nommé **rsv-adatum**. Vous devez accorder des autorisations à quatre équipes d'exploitation. Chaque équipe ne doit recevoir que les autorisations dont elle a besoin (principe du moindre privilège).

    Quel rôle intégré devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: monr, text: Monitoring Reader }
    - { id: monc, text: Monitoring Contributor }
    - { id: bkop, text: Backup Operator }
    - { id: bkc, text: Backup Contributor }
    - { id: bkr, text: Backup Reader }
    - { id: contrib, text: Contributor }
  targets:
    - id: noc
      text: { en: "NOC: view metrics, logs and fired alerts, without changing any setting", fr: "NOC : consulter les métriques, les journaux et les alertes déclenchées, sans modifier aucun paramètre" }
    - id: sre
      text: { en: "SRE: create and edit alert rules and diagnostic settings", fr: "SRE : créer et modifier des règles d'alerte et des paramètres de diagnostic" }
    - id: night
      text: { en: "Night shift: run on-demand backups in rsv-adatum, but not stop protection or change backup policies", fr: "Équipe de nuit : lancer des sauvegardes à la demande dans rsv-adatum, sans arrêter la protection ni modifier les stratégies de sauvegarde" }
    - id: bkadmin
      text: { en: "Backup admins: manage backup policies and stop protection in rsv-adatum, without creating vaults or granting access", fr: "Administrateurs de sauvegarde : gérer les stratégies de sauvegarde et arrêter la protection dans rsv-adatum, sans créer de coffres ni accorder d'accès" }
answer:
  mapping: { noc: monr, sre: monc, night: bkop, bkadmin: bkc }
explanation:
  correct:
    en: Monitoring Reader reads all monitoring data, while Monitoring Contributor can also edit monitoring settings such as alert rules and diagnostic settings. Backup Operator has everything Backup Contributor has except removing backups and managing backup policies, so it fits on-demand backups. Backup Contributor manages backups and policies (including stopping protection) but cannot create vaults or give access to others.
    fr: Monitoring Reader lit toutes les données de supervision, tandis que Monitoring Contributor peut aussi modifier les paramètres de supervision comme les règles d'alerte et les paramètres de diagnostic. Backup Operator dispose de tout ce qu'a Backup Contributor sauf la suppression des sauvegardes et la gestion des stratégies de sauvegarde ; il convient aux sauvegardes à la demande. Backup Contributor gère les sauvegardes et les stratégies (y compris l'arrêt de la protection) mais ne peut pas créer de coffres ni accorder l'accès à d'autres.
  options:
    bkr:
      en: Backup Reader can only view backup services and cannot trigger a backup.
      fr: Backup Reader peut seulement consulter les services de sauvegarde et ne peut pas lancer de sauvegarde.
    contrib:
      en: Contributor would grant management of every resource in its scope, far beyond any team's needs.
      fr: Contributor accorderait la gestion de toutes les ressources de son étendue, bien au-delà des besoins de chaque équipe.
references:
  - title: Manage Backups with Azure role-based access control - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-rbac-rs-vault
  - title: Azure built-in roles for Monitor - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/monitor
