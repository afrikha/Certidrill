id: i3-lock-delete-allow-changes
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a resource group named **RG-Payroll** that contains virtual machines, disks and a virtual network. Administrators must still be able to resize the virtual machines and change network settings, but nobody must be able to delete RG-Payroll or any resource in it by mistake.

    What should you configure?
  fr: |
    Contoso dispose d'un groupe de ressources nommé **RG-Payroll** qui contient des machines virtuelles, des disques et un réseau virtuel. Les administrateurs doivent toujours pouvoir redimensionner les machines virtuelles et modifier les paramètres réseau, mais personne ne doit pouvoir supprimer par erreur RG-Payroll ni aucune de ses ressources.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Delete (CanNotDelete) lock on RG-Payroll", fr: "Un verrou Suppression (CanNotDelete) sur RG-Payroll" } }
    - { id: b, text: { en: "A Read-only (ReadOnly) lock on RG-Payroll", fr: "Un verrou Lecture seule (ReadOnly) sur RG-Payroll" } }
    - { id: c, text: { en: "A Delete (CanNotDelete) lock on each virtual machine only", fr: "Un verrou Suppression (CanNotDelete) sur chaque machine virtuelle uniquement" } }
    - { id: d, text: { en: "The Reader role on RG-Payroll for all administrators", fr: "Le rôle Reader sur RG-Payroll pour tous les administrateurs" } }
answer: { optionId: a }
explanation:
  correct:
    en: A CanNotDelete lock (Delete in the portal) lets authorized users read and modify resources but not delete them. Applied to the resource group, it is inherited by every resource in it, including resources added later, and it also prevents the deletion of the resource group itself.
    fr: "Un verrou CanNotDelete (Suppression dans le portail) permet aux utilisateurs autorisés de lire et de modifier les ressources, mais pas de les supprimer. Appliqué au groupe de ressources, il est hérité par toutes ses ressources, y compris celles ajoutées plus tard, et il empêche aussi la suppression du groupe de ressources lui-même."
  options:
    b: { en: "A ReadOnly lock also blocks updates, so administrators could no longer resize VMs or change network settings.", fr: "Un verrou ReadOnly bloque aussi les mises à jour : les administrateurs ne pourraient plus redimensionner les machines virtuelles ni modifier le réseau." }
    c: { en: "Locks on the VMs alone leave the disks, the virtual network and the resource group unprotected.", fr: "Des verrous sur les seules machines virtuelles laissent les disques, le réseau virtuel et le groupe de ressources sans protection." }
    d: { en: "Reader prevents all changes, which breaks the requirement to resize VMs.", fr: "Reader empêche toute modification, ce qui contredit l'exigence de redimensionner les machines virtuelles." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
