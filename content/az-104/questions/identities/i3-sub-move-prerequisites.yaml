id: i3-sub-move-prerequisites
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to move an Azure Batch account named **batchrisk01** from the subscription **Sub-Research** to a resource group in the subscription **Sub-Risk**. No Batch account was ever created in Sub-Risk.

    Which two conditions must be met for the move to succeed? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de déplacer un compte Azure Batch nommé **batchrisk01** de l'abonnement **Sub-Research** vers un groupe de ressources de l'abonnement **Sub-Risk**. Aucun compte Batch n'a jamais été créé dans Sub-Risk.

    Quelles sont les deux conditions à remplir pour que le déplacement réussisse ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sub-Research and Sub-Risk trust the same Microsoft Entra tenant.", fr: "Sub-Research et Sub-Risk approuvent le même locataire Microsoft Entra." } }
    - { id: b, text: { en: "The Microsoft.Batch resource provider is registered in Sub-Risk.", fr: "Le fournisseur de ressources Microsoft.Batch est inscrit dans Sub-Risk." } }
    - { id: c, text: { en: "Sub-Research and Sub-Risk are in the same management group.", fr: "Sub-Research et Sub-Risk se trouvent dans le même groupe d'administration." } }
    - { id: d, text: { en: "The target resource group is in the same region as batchrisk01.", fr: "Le groupe de ressources cible se trouve dans la même région que batchrisk01." } }
    - { id: e, text: { en: "Sub-Research and Sub-Risk use the same offer type.", fr: "Sub-Research et Sub-Risk utilisent le même type d'offre." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Resources can be moved between subscriptions only if both subscriptions are in the same Microsoft Entra tenant. The destination subscription must also be registered for the resource provider of the moved resource; otherwise the move fails with an error saying that the subscription isn't registered for the resource type.
    fr: "Les ressources ne peuvent être déplacées entre abonnements que si les deux abonnements appartiennent au même locataire Microsoft Entra. L'abonnement de destination doit aussi être inscrit auprès du fournisseur de ressources de la ressource déplacée ; sinon, le déplacement échoue avec une erreur indiquant que l'abonnement n'est pas inscrit pour le type de ressource."
  options:
    c: { en: "The position of the subscriptions in the management group hierarchy does not matter for a resource move.", fr: "La position des abonnements dans la hiérarchie des groupes d'administration n'a pas d'importance pour un déplacement de ressources." }
    d: { en: "A move never changes the region of a resource, and the resource group can be in any region.", fr: "Un déplacement ne change jamais la région d'une ressource, et le groupe de ressources peut se trouver dans n'importe quelle région." }
    e: { en: "The offer type is not a prerequisite for moving resources.", fr: "Le type d'offre n'est pas un prérequis pour déplacer des ressources." }
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
