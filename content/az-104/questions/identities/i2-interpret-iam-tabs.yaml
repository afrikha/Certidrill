id: i2-interpret-iam-tabs
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage a subscription named **Sub-Ops** for Wingtip Toys. You open **Access control (IAM)** on a resource group named **RG-Ops** to answer four questions from the security team.

    Which portal feature should you use for each question? To answer, drag the appropriate items to the correct questions. Each item may be used once or not at all.
  fr: |
    Vous gérez un abonnement nommé **Sub-Ops** pour Wingtip Toys. Vous ouvrez **Contrôle d'accès (IAM)** sur un groupe de ressources nommé **RG-Ops** pour répondre à quatre questions de l'équipe de sécurité.

    Quelle fonctionnalité du portail devez-vous utiliser pour chaque question ? Pour répondre, faites glisser les éléments appropriés vers les questions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: check, text: { en: Check access, fr: Vérifier l'accès } }
    - { id: assignments, text: { en: Role assignments, fr: Attributions de rôles } }
    - { id: roles, text: { en: Roles, fr: Rôles } }
    - { id: deny, text: { en: Deny assignments, fr: "Affectations de refus (Deny assignments)" } }
    - { id: activity, text: { en: Activity log, fr: Journal d'activité } }
  targets:
    - id: q1
      text: { en: "Which permissions (Actions and DataActions) are included in the Backup Reader role?", fr: "Quelles autorisations (Actions et DataActions) le rôle Backup Reader inclut-il ?" }
    - id: q2
      text: { en: "What access does the user Lee have at this scope, including access inherited from parent scopes?", fr: "De quel accès l'utilisateur Lee dispose-t-il à cette étendue, y compris l'accès hérité des étendues parentes ?" }
    - id: q3
      text: { en: "Which principals hold the Owner role at this scope?", fr: "Quels principaux disposent du rôle Owner à cette étendue ?" }
    - id: q4
      text: { en: "Are any actions blocked by Azure for resources managed by a deployment stack?", fr: "Des actions sont-elles bloquées par Azure pour les ressources gérées par une pile de déploiement ?" }
answer:
  mapping: { q1: roles, q2: check, q3: assignments, q4: deny }
explanation:
  correct:
    en: The Roles tab lists role definitions and their permissions. Check access shows the access of one principal at this scope and inherited to it (not at child scopes). The Role assignments tab lists who holds which role, grouped by role such as Owner. The Deny assignments tab shows deny assignments, such as those created by deployment stacks with deny settings.
    fr: L'onglet Rôles liste les définitions de rôles et leurs autorisations. Vérifier l'accès montre l'accès d'un principal à cette étendue et hérité vers elle (pas aux étendues enfants). L'onglet Attributions de rôles liste qui dispose de quel rôle, regroupé par rôle comme Owner. L'onglet Affectations de refus (Deny assignments) affiche les affectations de refus, comme celles créées par les piles de déploiement avec des paramètres de refus.
  options:
    activity:
      en: The activity log records control plane operations over time; it does not list current permissions.
      fr: Le journal d'activité enregistre les opérations du plan de contrôle dans le temps ; il ne liste pas les autorisations actuelles.
references:
  - title: List Azure role assignments using the Azure portal - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-portal
  - title: Quickstart - Check access for a user to a single Azure resource - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/check-access
