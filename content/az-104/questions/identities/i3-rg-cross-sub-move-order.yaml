id: i3-rg-cross-sub-move-order
objective: "1.3.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso has two subscriptions, **Sub-Dev** and **Sub-Prod**, in the same Microsoft Entra tenant. All required resource providers are registered in both subscriptions.

    In Sub-Dev, a virtual machine named **VM-Api**, its network interface and its virtual network are in a resource group named **RG-App**, and its managed disks are in a resource group named **RG-Disks**.

    You need to move VM-Api and its dependent resources to Sub-Prod. In Sub-Prod, the virtual machine must end up in the existing resource group **RG-Api** and the managed disks in the existing resource group **RG-Storage**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose de deux abonnements, **Sub-Dev** et **Sub-Prod**, dans le même locataire Microsoft Entra. Tous les fournisseurs de ressources nécessaires sont inscrits dans les deux abonnements.

    Dans Sub-Dev, une machine virtuelle nommée **VM-Api**, son interface réseau et son réseau virtuel se trouvent dans un groupe de ressources nommé **RG-App**, et ses disques managés dans un groupe de ressources nommé **RG-Disks**.

    Vous devez déplacer VM-Api et ses ressources dépendantes vers Sub-Prod. Dans Sub-Prod, la machine virtuelle doit se retrouver dans le groupe de ressources existant **RG-Api** et les disques managés dans le groupe de ressources existant **RG-Storage**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: consolidate, text: { en: "In Sub-Dev, move the managed disks from RG-Disks to RG-App.", fr: "Dans Sub-Dev, déplacer les disques managés de RG-Disks vers RG-App." } }
    - { id: move, text: { en: "Move VM-Api and all its dependent resources together from RG-App to RG-Api in Sub-Prod.", fr: "Déplacer ensemble VM-Api et toutes ses ressources dépendantes de RG-App vers RG-Api dans Sub-Prod." } }
    - { id: split, text: { en: "In Sub-Prod, move the managed disks from RG-Api to RG-Storage.", fr: "Dans Sub-Prod, déplacer les disques managés de RG-Api vers RG-Storage." } }
    - { id: moverg, text: { en: "Move the resource group RG-App to Sub-Prod.", fr: "Déplacer le groupe de ressources RG-App vers Sub-Prod." } }
    - { id: disksfirst, text: { en: "Move the managed disks from RG-Disks directly to RG-Storage in Sub-Prod.", fr: "Déplacer les disques managés de RG-Disks directement vers RG-Storage dans Sub-Prod." } }
    - { id: dir, text: { en: "Change the directory of Sub-Prod.", fr: "Changer l'annuaire de Sub-Prod." } }
answer:
  sequence: [consolidate, move, split]
explanation:
  correct:
    en: For a move across subscriptions, a resource and its dependent resources must be in the same resource group and be moved together. So you first gather the disks with the VM in one resource group in the source subscription, then move everything in one operation, and finally redistribute the disks to another resource group in the target subscription.
    fr: "Pour un déplacement entre abonnements, une ressource et ses ressources dépendantes doivent se trouver dans le même groupe de ressources et être déplacées ensemble. Vous regroupez donc d'abord les disques avec la machine virtuelle dans un même groupe de ressources de l'abonnement source, puis vous déplacez tout en une seule opération, et enfin vous répartissez les disques dans un autre groupe de ressources de l'abonnement cible."
  options:
    moverg: { en: "A resource group itself cannot be moved to another subscription; only its resources can.", fr: "Un groupe de ressources ne peut pas lui-même être déplacé vers un autre abonnement ; seules ses ressources le peuvent." }
    disksfirst: { en: "Dependent resources must move together with the VM in a cross-subscription move.", fr: "Les ressources dépendantes doivent être déplacées avec la machine virtuelle lors d'un déplacement entre abonnements." }
    dir: { en: "Both subscriptions already trust the same tenant; changing the directory would remove role assignments.", fr: "Les deux abonnements font déjà confiance au même locataire ; changer l'annuaire supprimerait les attributions de rôles." }
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
