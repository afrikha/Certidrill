id: i1-030-sspr-licensing
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is planning self-service password reset (SSPR). Some users are cloud-only, and others are synchronized from on-premises Active Directory by using Microsoft Entra Connect.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Adatum planifie la réinitialisation de mot de passe en libre-service (SSPR). Certains utilisateurs sont uniquement cloud, d'autres sont synchronisés depuis Active Directory local avec Microsoft Entra Connect.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "With Microsoft Entra ID Free, a cloud-only user who knows the current password can change it."
        fr: "Avec Microsoft Entra ID Free, un utilisateur uniquement cloud qui connaît son mot de passe actuel peut le changer."
    - id: s2
      text:
        en: "Microsoft 365 Business Standard includes password reset for cloud-only users who forgot their password."
        fr: "Microsoft 365 Business Standard inclut la réinitialisation du mot de passe pour les utilisateurs uniquement cloud qui l'ont oublié."
    - id: s3
      text:
        en: "Microsoft 365 Business Standard includes password reset with writeback to on-premises Active Directory for synchronized users."
        fr: "Microsoft 365 Business Standard inclut la réinitialisation du mot de passe avec réécriture vers Active Directory local pour les utilisateurs synchronisés."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Cloud-only password change is available in every edition, including Free. Cloud-only password reset requires Microsoft 365 Business Standard or higher, or Microsoft Entra ID P1/P2. Change or reset with on-premises writeback for hybrid users requires Microsoft Entra ID P1, P2 or Microsoft 365 Business Premium."
    fr: "Le changement de mot de passe des utilisateurs uniquement cloud est disponible dans toutes les éditions, y compris Free. La réinitialisation pour ces utilisateurs exige Microsoft 365 Business Standard ou supérieur, ou Microsoft Entra ID P1/P2. Le changement ou la réinitialisation avec réécriture locale pour les utilisateurs hybrides exige Microsoft Entra ID P1, P2 ou Microsoft 365 Business Premium."
references:
  - title: License self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-licensing
