id: i3-sub-change-directory-effects
objective: "1.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    After an acquisition, Adatum must associate its subscription **Sub-Adatum** with the Microsoft Entra tenant of its new parent company, Contoso. Sub-Adatum contains virtual machines that use system-assigned managed identities, and several users have Azure role assignments on the subscription.

    You change the directory of Sub-Adatum to the Contoso tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Après une acquisition, Adatum doit associer son abonnement **Sub-Adatum** au locataire Microsoft Entra de sa nouvelle société mère, Contoso. Sub-Adatum contient des machines virtuelles qui utilisent des identités managées affectées par le système, et plusieurs utilisateurs ont des attributions de rôles Azure sur l'abonnement.

    Vous changez l'annuaire de Sub-Adatum pour le locataire Contoso.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure role assignments of the Adatum users are kept on Sub-Adatum.
        fr: Les attributions de rôles Azure des utilisateurs d'Adatum sont conservées sur Sub-Adatum.
    - id: s2
      text:
        en: The system-assigned managed identities of the virtual machines must be re-enabled.
        fr: Les identités managées affectées par le système des machines virtuelles doivent être réactivées.
    - id: s3
      text:
        en: The billing ownership of Sub-Adatum is transferred to Contoso.
        fr: La propriété de facturation de Sub-Adatum est transférée à Contoso.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: When a subscription is associated with another directory, users with Azure RBAC role assignments lose their access, and role assignments must be recreated in the new tenant. System-assigned managed identities must be re-enabled and user-assigned ones recreated. Changing the directory is a service-level operation and does not change billing ownership, which requires a separate billing transfer.
    fr: "Lorsqu'un abonnement est associé à un autre annuaire, les utilisateurs disposant d'attributions de rôles Azure RBAC perdent leur accès, et les attributions de rôles doivent être recréées dans le nouveau locataire. Les identités managées affectées par le système doivent être réactivées et celles affectées par l'utilisateur recréées. Le changement d'annuaire est une opération au niveau du service et ne change pas la propriété de facturation, qui exige un transfert de facturation distinct."
references:
  - title: Add an existing Azure subscription to your tenant
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptions-associated-directory
  - title: Transfer an Azure subscription to a different Microsoft Entra directory
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/transfer-subscription
