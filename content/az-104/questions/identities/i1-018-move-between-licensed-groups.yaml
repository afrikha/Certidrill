id: i1-018-move-between-licensed-groups
objective: "1.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses group-based licensing. The group **LIC-SALES** assigns a Microsoft 365 E3 license and the group **LIC-ENG** assigns a Microsoft 365 E5 license.

    The user **Kai Turner** moves from Sales to Engineering. You need to move Kai from LIC-SALES to LIC-ENG without any temporary loss of access to licensed services. Group membership changes are processed asynchronously by group-based licensing.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders utilise la licence basée sur un groupe. Le groupe **LIC-SALES** attribue une licence Microsoft 365 E3 et le groupe **LIC-ENG** une licence Microsoft 365 E5.

    L'utilisateur **Kai Turner** passe des ventes à l'ingénierie. Vous devez déplacer Kai de LIC-SALES vers LIC-ENG sans aucune perte temporaire d'accès aux services sous licence. Les modifications d'appartenance aux groupes sont traitées de façon asynchrone par la licence basée sur un groupe.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: add, text: { en: "Add Kai to LIC-ENG.", fr: "Ajouter Kai à LIC-ENG." } }
    - { id: confirm, text: { en: "Confirm on the Licenses page of Kai that the E5 license is applied.", fr: "Vérifier dans la page Licences de Kai que la licence E5 est appliquée." } }
    - { id: remove, text: { en: "Remove Kai from LIC-SALES.", fr: "Retirer Kai de LIC-SALES." } }
    - { id: direct, text: { en: "Assign the E5 license directly to Kai.", fr: "Attribuer directement la licence E5 à Kai." } }
    - { id: reprocess, text: { en: "Select Reprocess on LIC-SALES.", fr: "Sélectionner Retraiter (Reprocess) sur LIC-SALES." } }
    - { id: delete, text: { en: "Delete the LIC-SALES group.", fr: "Supprimer le groupe LIC-SALES." } }
answer:
  sequence: [add, confirm, remove]
explanation:
  correct:
    en: "Add the user to the destination group first, confirm that the new license is applied, and only then remove the user from the original group. Because both changes are processed asynchronously, removing the user before the new license shows as applied (even right after adding them) can leave the user without a license for a while; Microsoft documents this add, verify, then remove order."
    fr: "Ajoutez d'abord l'utilisateur au groupe de destination, vérifiez que la nouvelle licence est appliquée, puis seulement retirez-le du groupe d'origine. Les deux modifications étant traitées de façon asynchrone, retirer l'utilisateur avant que la nouvelle licence apparaisse comme appliquée (même juste après l'avoir ajouté) peut le laisser sans licence un moment ; Microsoft documente cet ordre : ajouter, vérifier, puis retirer."
  options:
    direct: { en: "A direct assignment isn't needed and would have to be cleaned up later.", fr: "Une attribution directe n'est pas nécessaire et devrait être nettoyée ensuite." }
    delete: { en: "Deleting LIC-SALES would affect every other member of the group.", fr: "Supprimer LIC-SALES affecterait tous les autres membres du groupe." }
references:
  - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
