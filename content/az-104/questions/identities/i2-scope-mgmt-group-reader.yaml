id: i2-scope-mgmt-group-reader
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has the following management group hierarchy:

    - **Tenant Root Group**
      - **MG-Europe**: contains eight subscriptions
      - **MG-Americas**: contains five subscriptions

    New subscriptions are added to MG-Europe every quarter. A Microsoft Entra group named **EU-Auditors** must be able to view all the resources in the subscriptions of MG-Europe, including subscriptions added later. EU-Auditors must not see the resources of MG-Americas. The solution must minimize the number of role assignments.

    Where should you assign the Reader role to EU-Auditors?
  fr: |
    Adatum dispose de la hiérarchie de groupes d'administration suivante :

    - **Tenant Root Group**
      - **MG-Europe** : contient huit abonnements
      - **MG-Americas** : contient cinq abonnements

    De nouveaux abonnements sont ajoutés à MG-Europe chaque trimestre. Un groupe Microsoft Entra nommé **EU-Auditors** doit pouvoir consulter toutes les ressources des abonnements de MG-Europe, y compris les abonnements ajoutés ultérieurement. EU-Auditors ne doit pas voir les ressources de MG-Americas. La solution doit réduire au minimum le nombre d'attributions de rôles.

    Où devez-vous attribuer le rôle Reader à EU-Auditors ?
body:
  options:
    - { id: a, text: { en: On the MG-Europe management group, fr: Sur le groupe d'administration MG-Europe } }
    - { id: b, text: { en: On the Tenant Root Group, fr: Sur le Tenant Root Group } }
    - { id: c, text: { en: On each of the eight subscriptions in MG-Europe, fr: Sur chacun des huit abonnements de MG-Europe } }
    - { id: d, text: { en: On each resource group of the subscriptions in MG-Europe, fr: Sur chaque groupe de ressources des abonnements de MG-Europe } }
answer: { optionId: a }
explanation:
  correct:
    en: A role assignment at a management group is inherited by every subscription, resource group and resource below it, including subscriptions moved into the group later. One assignment on MG-Europe therefore covers current and future subscriptions without exposing MG-Americas.
    fr: Une attribution de rôle sur un groupe d'administration est héritée par tous les abonnements, groupes de ressources et ressources situés en dessous, y compris les abonnements ajoutés ensuite au groupe. Une seule attribution sur MG-Europe couvre donc les abonnements actuels et futurs sans exposer MG-Americas.
  options:
    b:
      en: The Tenant Root Group is the parent of MG-Americas as well, so EU-Auditors would also see those resources.
      fr: Le Tenant Root Group est aussi le parent de MG-Americas ; EU-Auditors verrait donc également ces ressources.
    c:
      en: Eight assignments do not cover the subscriptions added every quarter and do not minimize the number of assignments.
      fr: Huit attributions ne couvrent pas les abonnements ajoutés chaque trimestre et ne réduisent pas le nombre d'attributions.
    d:
      en: Resource group assignments miss new resource groups and new subscriptions, and require many more assignments.
      fr: Des attributions sur les groupes de ressources ne couvrent ni les nouveaux groupes de ressources ni les nouveaux abonnements, et en nécessitent beaucoup plus.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
