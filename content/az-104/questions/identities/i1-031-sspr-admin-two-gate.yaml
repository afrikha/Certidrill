id: i1-031-sspr-admin-two-gate
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant with the custom domain **contoso.com** and Microsoft Entra ID P1 licenses. Self-service password reset (SSPR) is enabled for **All** users, with **Number of methods required to reset** set to **1**. The mobile phone and email methods are enabled.

    The user **Paul**, who holds the Helpdesk Administrator role, registered only a mobile phone number. When Paul tries to reset his forgotten password at https://aka.ms/sspr, he is told to contact his administrator. A non-administrator user with the same registration can reset successfully.

    What is the cause of the issue?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra avec le domaine personnalisé **contoso.com** et des licences Microsoft Entra ID P1. La réinitialisation de mot de passe en libre-service (SSPR) est activée pour **All**, avec **Nombre de méthodes requises pour réinitialiser** défini sur **1**. Les méthodes téléphone mobile et e-mail sont activées.

    L'utilisateur **Paul**, qui détient le rôle Helpdesk Administrator, a inscrit uniquement un numéro de téléphone mobile. Lorsque Paul tente de réinitialiser son mot de passe oublié sur https://aka.ms/sspr, il est invité à contacter son administrateur. Un utilisateur non administrateur ayant la même inscription parvient à réinitialiser son mot de passe.

    Quelle est la cause du problème ?
body:
  options:
    - id: a
      text: { en: "Accounts with an administrator role are subject to a two-gate policy that requires two authentication methods.", fr: "Les comptes ayant un rôle d'administrateur sont soumis à une stratégie à deux verrous qui exige deux méthodes d'authentification." }
    - id: b
      text: { en: "Administrator accounts can never use SSPR; only another administrator can reset their password.", fr: "Les comptes administrateurs ne peuvent jamais utiliser SSPR ; seul un autre administrateur peut réinitialiser leur mot de passe." }
    - id: c
      text: { en: "The mobile phone method can't be the only registered method for SSPR.", fr: "La méthode téléphone mobile ne peut pas être la seule méthode inscrite pour SSPR." }
    - id: d
      text: { en: "Administrators need a Microsoft Entra ID P2 license to use SSPR.", fr: "Les administrateurs ont besoin d'une licence Microsoft Entra ID P2 pour utiliser SSPR." }
answer: { optionId: a }
explanation:
  correct:
    en: "Administrator accounts are enabled for SSPR by default, but a strong two-gate policy is enforced on them when a custom domain is configured (or Microsoft Entra Connect syncs identities). This policy, which can't be changed, requires two pieces of authentication data and prohibits security questions, whatever the policy defined for users."
    fr: "Les comptes administrateurs sont activés pour SSPR par défaut, mais une stratégie forte à deux verrous leur est imposée dès qu'un domaine personnalisé est configuré (ou que Microsoft Entra Connect synchronise des identités). Cette stratégie, non modifiable, exige deux éléments d'authentification et interdit les questions de sécurité, quelle que soit la stratégie définie pour les utilisateurs."
  options:
    b: { en: "SSPR is enabled for administrator accounts by default; it can be turned off with the AllowedToUseSspr setting.", fr: "SSPR est activée par défaut pour les comptes administrateurs ; elle peut être désactivée avec le paramètre AllowedToUseSspr." }
    c: { en: "The non-administrator user resets successfully with the same single method.", fr: "L'utilisateur non administrateur réussit avec la même méthode unique." }
    d: { en: "SSPR doesn't require P2; the tenant's P1 licenses cover it.", fr: "SSPR n'exige pas P2 ; les licences P1 du locataire la couvrent." }
references:
  - title: Self-service password reset policies
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-policy
