id: i1-004-role-assignable-group
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Entra tenant licensed with Microsoft Entra ID P1. You plan to create a security group named **Helpdesk-Admins** with the setting **Microsoft Entra roles can be assigned to the group** set to **Yes**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. Vous prévoyez de créer un groupe de sécurité nommé **Helpdesk-Admins** avec le paramètre **Microsoft Entra roles can be assigned to the group** défini sur **Yes**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "You can set the membership type of Helpdesk-Admins to Dynamic User."
        fr: "Vous pouvez définir le type d'appartenance de Helpdesk-Admins sur Dynamic User."
    - id: s2
      text:
        en: "You can add another security group as a member of Helpdesk-Admins."
        fr: "Vous pouvez ajouter un autre groupe de sécurité comme membre de Helpdesk-Admins."
    - id: s3
      text:
        en: "To create Helpdesk-Admins with this setting enabled, you need at least the Privileged Role Administrator role."
        fr: "Pour créer Helpdesk-Admins avec ce paramètre activé, vous avez besoin au minimum du rôle Privileged Role Administrator."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Enabling role assignment on a group automatically sets the membership type to Assigned, and the membership type can no longer be changed. Groups cannot be added as members of a role-assignable group. Creating such a group requires at least the Privileged Role Administrator role and a P1 or P2 license."
    fr: "L'activation de l'attribution de rôles sur un groupe définit automatiquement le type d'appartenance sur Affecté, et ce type ne peut plus être modifié. Aucun groupe ne peut être ajouté comme membre d'un groupe attribuable à un rôle. La création d'un tel groupe exige au minimum le rôle Privileged Role Administrator et une licence P1 ou P2."
references:
  - title: How to manage groups
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-groups
  - title: Use Microsoft Entra groups to manage role assignments
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept
