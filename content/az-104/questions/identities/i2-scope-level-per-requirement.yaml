id: i2-scope-level-per-requirement
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has a management group named **MG-Prod** that contains several subscriptions. One of them, **Sub-Shop**, contains a resource group named **rg-shop-app** and a hub virtual network named **vnet-hub** in a resource group named **rg-connectivity**.

    You need to choose the scope of four role assignments. Each assignment must cover only the resources named in the requirement, including those created later, with the fewest assignments possible.

    Which scope should you use for each requirement? To answer, drag the appropriate scopes to the correct requirements. Each scope may be used once or not at all.
  fr: |
    Litware dispose d'un groupe d'administration nommé **MG-Prod** qui contient plusieurs abonnements. L'un d'eux, **Sub-Shop**, contient un groupe de ressources nommé **rg-shop-app** et un réseau virtuel hub nommé **vnet-hub** dans un groupe de ressources nommé **rg-connectivity**.

    Vous devez choisir l'étendue de quatre attributions de rôles. Chaque attribution doit couvrir uniquement les ressources nommées dans l'exigence, y compris celles créées ultérieurement, avec le moins d'attributions possible.

    Quelle étendue devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les étendues appropriées vers les exigences correspondantes. Chaque étendue peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: mg, text: { en: Management group, fr: Groupe d'administration } }
    - { id: sub, text: { en: Subscription, fr: Abonnement } }
    - { id: rg, text: { en: Resource group, fr: Groupe de ressources } }
    - { id: res, text: { en: Resource, fr: Ressource } }
    - { id: tenant, text: { en: Microsoft Entra directory role, fr: Rôle d'annuaire Microsoft Entra } }
  targets:
    - id: t1
      text: { en: "Security Reader for all the subscriptions of MG-Prod, including future subscriptions", fr: "Security Reader pour tous les abonnements de MG-Prod, y compris les abonnements futurs" }
    - id: t2
      text: { en: "Network Contributor for vnet-hub only", fr: "Network Contributor pour vnet-hub uniquement" }
    - id: t3
      text: { en: "Contributor for all current and future resources of rg-shop-app", fr: "Contributor pour toutes les ressources actuelles et futures de rg-shop-app" }
    - id: t4
      text: { en: "Cost Management Reader for all the costs of Sub-Shop", fr: "Cost Management Reader pour tous les coûts de Sub-Shop" }
answer:
  mapping: { t1: mg, t2: res, t3: rg, t4: sub }
explanation:
  correct:
    en: Azure RBAC scopes form a parent-child hierarchy (management group, subscription, resource group, resource) and lower levels inherit assignments from higher levels. Pick the narrowest level that still contains everything required, including future objects; a Microsoft Entra directory role does not grant access to Azure resources.
    fr: "Les étendues Azure RBAC forment une hiérarchie parent-enfant (groupe d'administration, abonnement, groupe de ressources, ressource) et les niveaux inférieurs héritent des attributions des niveaux supérieurs. Choisissez le niveau le plus restreint qui contient tout ce qui est requis, y compris les objets futurs ; un rôle d'annuaire Microsoft Entra n'accorde pas l'accès aux ressources Azure."
  options:
    tenant:
      en: Microsoft Entra roles manage directory objects (users, groups, domains), not Azure resources.
      fr: Les rôles Microsoft Entra gèrent les objets d'annuaire (utilisateurs, groupes, domaines), pas les ressources Azure.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
