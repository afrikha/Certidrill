id: i3-lock-readonly-effects
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a resource group named **RG-Orders** that contains a virtual machine named **VM-Orders1** and an Azure SQL logical server named **sql-orders** with one database. You apply a **ReadOnly** lock to RG-Orders.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Fabrikam dispose d'un groupe de ressources nommé **RG-Orders** qui contient une machine virtuelle nommée **VM-Orders1** et un serveur logique Azure SQL nommé **sql-orders** avec une base de données. Vous appliquez un verrou **ReadOnly** (Lecture seule) à RG-Orders.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A user who has the Owner role on RG-Orders can restart VM-Orders1.
        fr: Un utilisateur qui a le rôle Owner sur RG-Orders peut redémarrer VM-Orders1.
    - id: s2
      text:
        en: An application can still insert rows into the database on sql-orders.
        fr: Une application peut toujours insérer des lignes dans la base de données de sql-orders.
    - id: s3
      text:
        en: An administrator can add a new tag to VM-Orders1.
        fr: Un administrateur peut ajouter une nouvelle étiquette à VM-Orders1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Locks apply to every user whatever the role, and a ReadOnly lock blocks every control plane operation except reads. Starting or restarting a VM is a POST request, so it is denied, and adding a tag is an update, so it is denied too. Locks do not apply to data plane operations, so the application can still write data to the database.
    fr: "Les verrous s'appliquent à tous les utilisateurs quel que soit leur rôle, et un verrou ReadOnly bloque toutes les opérations du plan de contrôle sauf les lectures. Démarrer ou redémarrer une machine virtuelle est une requête POST : elle est refusée, et ajouter une étiquette est une mise à jour : elle est refusée aussi. Les verrous ne s'appliquent pas aux opérations du plan de données : l'application peut toujours écrire dans la base de données."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
