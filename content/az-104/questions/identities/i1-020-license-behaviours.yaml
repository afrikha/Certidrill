id: i1-020-license-behaviours
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Entra tenant whose default location is France. Licenses are assigned both directly and through group-based licensing.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un locataire Microsoft Entra dont l'emplacement par défaut est la France. Les licences sont attribuées à la fois directement et par le biais de licences basées sur un groupe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A member of a licensed group who has no usage location receives the license by using the location of the tenant."
        fr: "Un membre d'un groupe sous licence qui n'a pas d'emplacement d'utilisation reçoit la licence en utilisant l'emplacement du locataire."
    - id: s2
      text:
        en: "When you delete a licensed user account, its license becomes available to assign to another user."
        fr: "Lorsque vous supprimez un compte d'utilisateur sous licence, sa licence devient disponible pour un autre utilisateur."
    - id: s3
      text:
        en: "If no license is available, restoring a deleted user fails until you free a license."
        fr: "Si aucune licence n'est disponible, la restauration d'un utilisateur supprimé échoue tant que vous n'avez pas libéré une licence."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "For group-based licensing, users without a usage location inherit the location of the tenant. Deleting a user releases the licenses it consumed. When a deleted user is restored, the licenses assigned at deletion time are restored even if none are available, which can temporarily put the organization out of license compliance."
    fr: "Pour la licence basée sur un groupe, les utilisateurs sans emplacement d'utilisation héritent de l'emplacement du locataire. La suppression d'un utilisateur libère les licences qu'il consommait. Lors de la restauration d'un utilisateur supprimé, les licences attribuées au moment de la suppression sont restaurées même si aucune n'est disponible, ce qui peut rendre l'organisation temporairement non conforme."
references:
  - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
  - title: Restore or permanently remove recently deleted user
    url: https://learn.microsoft.com/en-us/entra/fundamentals/users-restore
