id: cs2-woodgrove-06
objective: "1.3.2"
type: yesno_statements
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    To meet requirement 10, you apply a **Delete** lock (CanNotDelete) to RG-Network.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Pour respecter l'exigence 10, vous appliquez un verrou **Suppression** (CanNotDelete) à RG-Network.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A member of GRP-NetOps can change the configuration of VPNGW-Hub while the lock is in place.
        fr: Un membre de GRP-NetOps peut modifier la configuration de VPNGW-Hub tant que le verrou est en place.
    - id: s2
      text:
        en: A user who has the Owner role on Sub-Core can delete ERGW-Hub without first removing the lock.
        fr: Un utilisateur qui dispose du rôle Owner sur Sub-Core peut supprimer ERGW-Hub sans supprimer d'abord le verrou.
    - id: s3
      text:
        en: A resource that is created in RG-Network after the lock is applied is also protected from deletion.
        fr: Une ressource créée dans RG-Network après l'application du verrou est également protégée contre la suppression.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A Delete lock blocks deletion but allows reads and updates, so the network team can still reconfigure the gateways. Locks apply to all users, whatever their role; an Owner must remove the lock before deleting. A lock on a resource group is inherited by all its resources, including those created later.
    fr: Un verrou Suppression bloque la suppression mais autorise la lecture et les modifications ; l'équipe réseau peut donc toujours reconfigurer les passerelles. Les verrous s'appliquent à tous les utilisateurs, quel que soit leur rôle ; un Owner doit supprimer le verrou avant de supprimer la ressource. Un verrou sur un groupe de ressources est hérité par toutes ses ressources, y compris celles créées ultérieurement.
references:
  - title: "Lock your Azure resources to protect your infrastructure - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
