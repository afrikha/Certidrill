id: cs2-woodgrove-06
objective: "1.3.2"
type: yesno_statements
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    To meet requirement 10, you plan to use resource locks. GRP-NetOps has the Network Contributor role on RG-Network.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour respecter l'exigence 10, vous prévoyez d'utiliser des verrous de ressource. GRP-NetOps dispose du rôle Network Contributor sur RG-Network.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After a **Delete** (CanNotDelete) lock is applied to RG-Network, a member of GRP-NetOps can remove the lock.
        fr: |
          Une fois un verrou **Suppression** (CanNotDelete) appliqué à RG-Network, un membre de GRP-NetOps peut retirer le verrou.
    - id: s2
      text:
        en: |
          You can apply the lock to MG-Woodgrove so that it is inherited by RG-Network and by the resource groups of future subscriptions.
        fr: |
          Vous pouvez appliquer le verrou à MG-Woodgrove pour qu'il soit hérité par RG-Network et par les groupes de ressources des futurs abonnements.
    - id: s3
      text:
        en: |
          A user who has the Owner role on Sub-Core can remove a **Delete** lock from RG-Network and then delete ERGW-Hub.
        fr: |
          Un utilisateur qui dispose du rôle Owner sur Sub-Core peut retirer un verrou **Suppression** de RG-Network, puis supprimer ERGW-Hub.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Creating or deleting a lock requires Microsoft.Authorization/locks/* permissions, which Owner and User Access Administrator have but Network Contributor does not. Locks can be applied to subscriptions, resource groups, and resources, but not to management groups. A lock prevents accidental deletion; an Owner can deliberately remove it first and then delete the resource, which is why lock management should be limited to a few administrators.
    fr: |
      La création ou la suppression d'un verrou exige les autorisations Microsoft.Authorization/locks/*, dont disposent Owner et User Access Administrator mais pas Network Contributor. Les verrous peuvent être appliqués aux abonnements, aux groupes de ressources et aux ressources, mais pas aux groupes d'administration. Un verrou empêche les suppressions accidentelles ; un Owner peut le retirer délibérément puis supprimer la ressource, c'est pourquoi la gestion des verrous doit être réservée à quelques administrateurs.
  options:
    s1: { en: "Network Contributor does not include the Microsoft.Authorization/locks/delete permission.", fr: "Network Contributor n'inclut pas l'autorisation Microsoft.Authorization/locks/delete." }
    s2: { en: "Resource locks cannot be added to management groups.", fr: "Les verrous de ressource ne peuvent pas être ajoutés à des groupes d'administration." }
references:
  - title: "Lock your Azure resources to protect your infrastructure - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: "Azure built-in roles for Networking - Azure RBAC"
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking
