id: i2-interpret-additive-scopes
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a subscription named **Sub-Dev** that contains resource groups named **RG-Test** and **RG-Shared**. A developer named Dev1 has the following role assignments:

    | Role | Scope |
    | --- | --- |
    | Reader | Sub-Dev |
    | Contributor | RG-Test |

    Which statement describes the effective access of Dev1?
  fr: |
    Wingtip Toys dispose d'un abonnement nommé **Sub-Dev** qui contient des groupes de ressources nommés **RG-Test** et **RG-Shared**. Un développeur nommé Dev1 dispose des attributions de rôles suivantes :

    | Rôle | Étendue |
    | --- | --- |
    | Reader | Sub-Dev |
    | Contributor | RG-Test |

    Quelle affirmation décrit l'accès effectif de Dev1 ?
body:
  options:
    - id: a
      text:
        en: Dev1 can create and delete resources in RG-Test, and can only view the resources of RG-Shared.
        fr: Dev1 peut créer et supprimer des ressources dans RG-Test, et peut seulement consulter les ressources de RG-Shared.
    - id: b
      text:
        en: Dev1 can only view the resources of RG-Test, because the Reader assignment at the parent scope takes precedence.
        fr: Dev1 peut seulement consulter les ressources de RG-Test, car l'attribution Reader à l'étendue parente est prioritaire.
    - id: c
      text:
        en: Dev1 can create and delete resources in both RG-Test and RG-Shared.
        fr: Dev1 peut créer et supprimer des ressources dans RG-Test et dans RG-Shared.
    - id: d
      text:
        en: Dev1 can create and delete resources in RG-Test, and cannot view the resources of RG-Shared.
        fr: Dev1 peut créer et supprimer des ressources dans RG-Test, et ne peut pas consulter les ressources de RG-Shared.
answer: { optionId: a }
explanation:
  correct:
    en: Azure RBAC is additive. On RG-Test, Dev1 has the sum of Reader (inherited from Sub-Dev) and Contributor, which is effectively Contributor. On RG-Shared, only the inherited Reader applies.
    fr: Azure RBAC est cumulatif. Sur RG-Test, Dev1 dispose de la somme de Reader (hérité de Sub-Dev) et de Contributor, soit effectivement Contributor. Sur RG-Shared, seul le rôle Reader hérité s'applique.
  options:
    b:
      en: A parent assignment never restricts a child assignment; permissions add up.
      fr: Une attribution parente ne restreint jamais une attribution enfant ; les autorisations s'additionnent.
    c:
      en: Contributor is assigned on RG-Test only; it is not inherited by the sibling resource group RG-Shared.
      fr: Contributor est attribué uniquement sur RG-Test ; il n'est pas hérité par le groupe de ressources voisin RG-Shared.
    d:
      en: The Reader assignment on Sub-Dev is inherited by RG-Shared, so Dev1 can view its resources.
      fr: L'attribution Reader sur Sub-Dev est héritée par RG-Shared ; Dev1 peut donc consulter ses ressources.
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
