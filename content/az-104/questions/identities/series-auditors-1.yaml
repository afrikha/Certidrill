id: series-auditors-1
objective: "1.2.2"
type: series_yesno
series: series-auditors-read
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You assign the Reader role to Auditors.
  fr: Vous attribuez le rôle Reader à Auditors.
body:
  solution:
    en: You assign the **Reader** role to the Auditors group at the scope of **Sub1**.
    fr: Vous attribuez le rôle **Reader** au groupe Auditors à l'étendue de **Sub1**.
answer: { value: true }
explanation:
  correct:
    en: An assignment at the subscription scope is inherited by every resource group and resource of Sub1, including those created later. Reader only allows viewing.
    fr: Une attribution à l'étendue de l'abonnement est héritée par tous les groupes de ressources et toutes les ressources de Sub1, y compris ceux créés plus tard. Reader permet uniquement la consultation.
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
