id: i3-cost-anomaly-alert
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a subscription named **Sub-Media** with a monthly budget that is rarely reached. Last month, a misconfigured job doubled the daily cost for a week without crossing any budget threshold.

    You need to receive an email automatically when the daily cost of Sub-Media deviates from its usual pattern, even if spending stays below the budget. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Proseware dispose d'un abonnement nommé **Sub-Media** avec un budget mensuel rarement atteint. Le mois dernier, une tâche mal configurée a doublé le coût quotidien pendant une semaine sans franchir aucun seuil budgétaire.

    Vous devez recevoir automatiquement un e-mail lorsque le coût quotidien de Sub-Media s'écarte de son profil habituel, même si les dépenses restent inférieures au budget. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An anomaly alert in Cost Management", fr: "Une alerte d'anomalie dans Cost Management" } }
    - { id: b, text: { en: "A forecasted budget alert at 100 percent", fr: "Une alerte budgétaire sur le coût prévu à 100 %" } }
    - { id: c, text: { en: "An Azure Advisor alert for cost recommendations", fr: "Une alerte Azure Advisor pour les recommandations de coût" } }
    - { id: d, text: { en: "An activity log alert on write operations", fr: "Une alerte de journal d'activité sur les opérations d'écriture" } }
answer: { optionId: a }
explanation:
  correct:
    en: Cost Management evaluates subscriptions daily for anomalies by comparing the day's usage with a forecast based on the last 60 days. An anomaly alert, created at the subscription scope from Cost alerts, emails recipients when an anomaly is detected, whatever the budget.
    fr: "Cost Management évalue chaque jour les abonnements pour détecter les anomalies, en comparant l'utilisation du jour à une prévision fondée sur les 60 derniers jours. Une alerte d'anomalie, créée à l'étendue de l'abonnement depuis Alertes de coût, envoie un e-mail aux destinataires lorsqu'une anomalie est détectée, quel que soit le budget."
  options:
    b: { en: "A forecasted alert fires only when the projected cost exceeds the budget threshold, which did not happen.", fr: "Une alerte sur le coût prévu ne se déclenche que si le coût projeté dépasse le seuil budgétaire, ce qui ne s'est pas produit." }
    c: { en: "Advisor alerts report new recommendations, such as resizing VMs, not unusual daily spending.", fr: "Les alertes Advisor signalent de nouvelles recommandations, comme le redimensionnement de machines virtuelles, pas des dépenses quotidiennes inhabituelles." }
    d: { en: "Activity log alerts track management operations, not cost.", fr: "Les alertes de journal d'activité suivent les opérations de gestion, pas les coûts." }
references:
  - title: Identify anomalies and unexpected changes in cost
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/understand/analyze-unexpected-charges
