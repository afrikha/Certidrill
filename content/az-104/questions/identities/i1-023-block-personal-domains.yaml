id: i1-023-block-personal-domains
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso collaborates with many partner organizations through Microsoft Entra B2B collaboration. Users must still be able to invite people from any organization, but invitations to the personal email domains **gmail.com** and **outlook.com** must be prevented.

    What should you configure?
  fr: |
    Contoso collabore avec de nombreuses organisations partenaires par le biais de la collaboration B2B Microsoft Entra. Les utilisateurs doivent toujours pouvoir inviter des personnes de n'importe quelle organisation, mais les invitations vers les domaines de messagerie personnels **gmail.com** et **outlook.com** doivent être empêchées.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "In the external collaboration settings, under Collaboration restrictions, select Deny invitations to the specified domains and enter both domains.", fr: "Dans les paramètres de collaboration externe, sous Collaboration restrictions, sélectionner Deny invitations to the specified domains et saisir les deux domaines." }
    - id: b
      text: { en: "In the external collaboration settings, under Collaboration restrictions, select Allow invitations only to the specified domains and enter both domains.", fr: "Dans les paramètres de collaboration externe, sous Collaboration restrictions, sélectionner Allow invitations only to the specified domains et saisir les deux domaines." }
    - id: c
      text: { en: "In the cross-tenant access settings, add both domains as organizations and block inbound B2B collaboration.", fr: "Dans les paramètres d'accès interlocataire, ajouter les deux domaines comme organisations et bloquer la collaboration B2B entrante." }
    - id: d
      text: { en: "In the external collaboration settings, set Guest user access to the most restrictive option.", fr: "Dans les paramètres de collaboration externe, définir Guest user access sur l'option la plus restrictive." }
answer: { optionId: a }
explanation:
  correct:
    en: "A block (deny) list prevents invitations to the listed domains while all other domains remain allowed. After you save the policy, invitations to blocked domains fail and the inviter sees a blocked-domain message."
    fr: "Une liste de blocage empêche les invitations vers les domaines listés, tandis que tous les autres domaines restent autorisés. Une fois la stratégie enregistrée, les invitations vers les domaines bloqués échouent et l'auteur de l'invitation voit un message de domaine bloqué."
  options:
    b: { en: "An allow list would permit invitations only to Gmail and Outlook and block every partner domain.", fr: "Une liste d'autorisation n'autoriserait les invitations que vers Gmail et Outlook et bloquerait tous les domaines partenaires." }
    c: { en: "Cross-tenant access settings apply to other Microsoft Entra organizations, not to consumer email domains.", fr: "Les paramètres d'accès interlocataire s'appliquent aux autres organisations Microsoft Entra, pas aux domaines de messagerie grand public." }
    d: { en: "Guest user access controls what guests can see in the directory, not who can be invited.", fr: "Guest user access contrôle ce que les invités peuvent voir dans l'annuaire, pas qui peut être invité." }
references:
  - title: Allow or block invitations
    url: https://learn.microsoft.com/en-us/entra/external-id/allow-deny-list
