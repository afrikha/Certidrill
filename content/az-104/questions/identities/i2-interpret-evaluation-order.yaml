id: i2-interpret-evaluation-order
objective: "1.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    A user at Woodgrove Bank calls the Azure Resource Manager API to delete a virtual machine. You are explaining to the support team how Azure RBAC decides whether the request is allowed, so that they can troubleshoot access issues.

    Which five steps does Azure RBAC follow, in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Un utilisateur de Woodgrove Bank appelle l'API Azure Resource Manager pour supprimer une machine virtuelle. Vous expliquez à l'équipe du support comment Azure RBAC décide si la requête est autorisée, afin qu'elle puisse résoudre les problèmes d'accès.

    Quelles sont les cinq étapes suivies par Azure RBAC, dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: token, text: { en: "The user acquires a token that includes the user's group memberships, including transitive memberships.", fr: "L'utilisateur obtient un jeton qui inclut ses appartenances aux groupes, y compris les appartenances transitives." } }
    - { id: retrieve, text: { en: "Azure Resource Manager retrieves the role assignments and deny assignments that apply to the resource.", fr: "Azure Resource Manager récupère les attributions de rôles et les affectations de refus qui s'appliquent à la ressource." } }
    - { id: deny, text: { en: "If a deny assignment applies, access is blocked; otherwise evaluation continues.", fr: "Si une affectation de refus s'applique, l'accès est bloqué ; sinon, l'évaluation continue." } }
    - { id: actions, text: { en: "Azure Resource Manager checks whether the action is included in the user's roles (Actions minus NotActions).", fr: "Azure Resource Manager vérifie si l'action est incluse dans les rôles de l'utilisateur (Actions moins NotActions)." } }
    - { id: conditions, text: { en: "If the matching role assignment has conditions, they are evaluated before access is allowed.", fr: "Si l'attribution de rôle correspondante comporte des conditions, elles sont évaluées avant d'autoriser l'accès." } }
    - { id: closest, text: { en: "Azure Resource Manager keeps only the role assignment closest to the resource and ignores those at parent scopes.", fr: "Azure Resource Manager ne conserve que l'attribution de rôle la plus proche de la ressource et ignore celles des étendues parentes." } }
    - { id: entra, text: { en: "Microsoft Entra ID checks whether the user holds the Global Administrator role.", fr: "Microsoft Entra ID vérifie si l'utilisateur dispose du rôle Administrateur général." } }
answer:
  sequence: [ token, retrieve, deny, actions, conditions ]
explanation:
  correct:
    en: The token carries the user's (transitive) group memberships. Azure Resource Manager gathers the role and deny assignments for the resource, stops if a deny assignment applies, then checks whether the action is in the effective permissions (Actions minus NotActions, or DataActions minus NotDataActions). Finally, any conditions on the assignment are evaluated.
    fr: Le jeton contient les appartenances (transitives) de l'utilisateur aux groupes. Azure Resource Manager rassemble les attributions de rôles et les affectations de refus de la ressource, s'arrête si une affectation de refus s'applique, puis vérifie si l'action figure dans les autorisations effectives (Actions moins NotActions, ou DataActions moins NotDataActions). Enfin, les conditions éventuelles de l'attribution sont évaluées.
  options:
    closest: { en: "Azure RBAC is additive; assignments at parent scopes are inherited and added, not ignored.", fr: "Azure RBAC est cumulatif ; les attributions des étendues parentes sont héritées et additionnées, pas ignorées." }
    entra: { en: "Microsoft Entra roles do not grant access to Azure resources and are not part of this evaluation.", fr: "Les rôles Microsoft Entra n'accordent pas l'accès aux ressources Azure et ne font pas partie de cette évaluation." }
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
