id: cs1-adatum-03
objective: "1.2.1"
type: dragdrop
caseStudy: cs1-adatum
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the access requirements for GG-Compliance, GG-Auditors, and GG-SecOps. You will assign each role at the scope named in the corresponding requirement.

    Which built-in role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences d'accès pour GG-Compliance, GG-Auditors et GG-SecOps. Vous attribuerez chaque rôle à l'étendue indiquée dans l'exigence correspondante.

    Quel rôle intégré devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Reader }
    - { id: sbdr, text: Storage Blob Data Reader }
    - { id: rbacadmin, text: Role Based Access Control Administrator }
    - { id: contrib, text: Contributor }
    - { id: sac, text: Storage Account Contributor }
    - { id: owner, text: Owner }
  targets:
    - { id: compliance, text: { en: "GG-Compliance (scope: stadatumrecords)", fr: "GG-Compliance (étendue : stadatumrecords)" } }
    - { id: auditors, text: { en: "GG-Auditors (scope: Sub-Fin-Prod)", fr: "GG-Auditors (étendue : Sub-Fin-Prod)" } }
    - { id: secops, text: { en: "GG-SecOps (scope: Sub-Fin-Prod)", fr: "GG-SecOps (étendue : Sub-Fin-Prod)" } }
answer:
  mapping: { compliance: sbdr, auditors: reader, secops: rbacadmin }
explanation:
  correct:
    en: |
      Storage Blob Data Reader grants read access to blob data only, and assigned on stadatumrecords it does not reach other storage accounts. Reader lets auditors view all resources in the subscription without changing them. Role Based Access Control Administrator lets SecOps create and delete role assignments and read the resources, without managing the resources themselves or managing access through other means such as Azure Policy. Owner, Contributor, and Storage Account Contributor would all allow configuration changes.
    fr: |
      Storage Blob Data Reader donne un accès en lecture aux seules données blob et, attribué sur stadatumrecords, ne s'étend pas aux autres comptes de stockage. Reader permet aux auditeurs de consulter toutes les ressources de l'abonnement sans les modifier. Role Based Access Control Administrator permet à SecOps de créer et de supprimer des attributions de rôles et de lire les ressources, sans gérer les ressources elles-mêmes ni gérer l'accès par d'autres moyens comme Azure Policy. Owner, Contributor et Storage Account Contributor permettraient tous de modifier la configuration.
  options:
    sac: { en: "Storage Account Contributor manages the storage account configuration, which GG-Compliance must not change.", fr: "Storage Account Contributor gère la configuration du compte de stockage, que GG-Compliance ne doit pas modifier." }
    contrib: { en: "Contributor can manage the resources but cannot assign roles, so it meets neither the SecOps nor the auditor requirement.", fr: "Contributor peut gérer les ressources mais ne peut pas attribuer de rôles : il ne satisfait donc ni l'exigence de SecOps ni celle des auditeurs." }
    owner: { en: "Owner can also manage every resource, which exceeds the SecOps requirement.", fr: "Owner peut aussi gérer toutes les ressources, ce qui dépasse l'exigence de SecOps." }
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
