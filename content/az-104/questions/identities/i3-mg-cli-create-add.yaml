id: i3-mg-cli-create-add
objective: "1.3.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam needs to create a management group with the ID **mg-finance** and the display name **Finance**, and then place the existing subscription **Sub-Fin01** under it.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.
  fr: |
    Fabrikam doit créer un groupe d'administration avec l'ID **mg-finance** et le nom d'affichage **Finance**, puis placer l'abonnement existant **Sub-Fin01** sous ce groupe.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az account management-group [[c1]] --name mg-finance --display-name "Finance"

    az account management-group [[c2]] --name mg-finance --subscription Sub-Fin01
  slots:
    - id: c1
      options:
        - { id: create, text: create }
        - { id: add, text: add }
        - { id: new, text: new }
        - { id: update, text: update }
    - id: c2
      options:
        - { id: subadd, text: subscription add }
        - { id: subcreate, text: subscription create }
        - { id: move, text: move }
        - { id: updparent, text: update --parent }
answer:
  values: { c1: create, c2: subadd }
explanation:
  correct:
    en: "`az account management-group create` creates the management group; `--name` is its ID and `--display-name` its friendly name. `az account management-group subscription add` moves an existing subscription under the management group."
    fr: "`az account management-group create` crée le groupe d'administration ; `--name` est son ID et `--display-name` son nom convivial. `az account management-group subscription add` déplace un abonnement existant sous le groupe d'administration."
  options:
    update: { en: "update changes the display name or the parent of an existing management group.", fr: "update modifie le nom d'affichage ou le parent d'un groupe d'administration existant." }
    updparent: { en: "update --parent moves a management group under another one, not a subscription.", fr: "update --parent déplace un groupe d'administration sous un autre, pas un abonnement." }
references:
  - title: Manage your Azure subscriptions at scale with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage
