id: cs1-adatum-02
objective: "1.3.2"
type: yesno_statements
caseStudy: cs1-adatum
difficulty: 2
status: draft
stem:
  en: |
    To meet the requirement for RG-Ledger, you apply a lock of type **Delete** (CanNotDelete) to RG-Ledger.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence concernant RG-Ledger, vous appliquez un verrou de type **Suppression** (CanNotDelete) à RG-Ledger.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who has the Owner role on Sub-Fin-Prod can delete VM-APP1 without first removing the lock.
        fr: |
          Un utilisateur qui dispose du rôle Owner sur Sub-Fin-Prod peut supprimer VM-APP1 sans retirer d'abord le verrou.
    - id: s2
      text:
        en: |
          A virtual machine created in RG-Ledger after the lock was applied is also protected from deletion.
        fr: |
          Une machine virtuelle créée dans RG-Ledger après l'application du verrou est elle aussi protégée contre la suppression.
    - id: s3
      text:
        en: |
          A lock of type **Read-only** (ReadOnly) on RG-Ledger would also meet the requirement.
        fr: |
          Un verrou de type **Lecture seule** (ReadOnly) sur RG-Ledger satisferait aussi l'exigence.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Locks override permissions, so even an Owner must remove the lock before deleting a locked resource. A lock on a resource group is inherited by all its resources, including resources added later. A read-only lock would also block POST operations such as starting or restarting the virtual machines, and changes such as resizing, which the administrators must still be able to perform.
    fr: |
      Les verrous l'emportent sur les autorisations ; même un Owner doit retirer le verrou avant de supprimer une ressource verrouillée. Un verrou sur un groupe de ressources est hérité par toutes ses ressources, y compris celles ajoutées plus tard. Un verrou en lecture seule bloquerait aussi les opérations POST comme le démarrage ou le redémarrage des machines virtuelles, ainsi que les modifications comme le redimensionnement, que les administrateurs doivent toujours pouvoir effectuer.
  options:
    s1: { en: "Locks apply to all users and roles; an Owner can only delete the resource after removing the lock.", fr: "Les verrous s'appliquent à tous les utilisateurs et à tous les rôles ; un Owner ne peut supprimer la ressource qu'après avoir retiré le verrou." }
    s3: { en: "ReadOnly prevents resizing, starting, and restarting the VMs.", fr: "ReadOnly empêche de redimensionner, de démarrer et de redémarrer les machines virtuelles." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
