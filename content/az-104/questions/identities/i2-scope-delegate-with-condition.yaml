id: i2-scope-delegate-with-condition
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a resource group named **RG-Backup** that contains a Recovery Services vault. Every week, a team lead named Lead1 asks you to grant the Backup Operator or Backup Reader role to new team members.

    You need to allow Lead1 to assign **only** the Backup Operator and Backup Reader roles on RG-Backup. Lead1 must not be able to assign any other role and must not be able to manage resources. The solution must follow the principle of least privilege.

    What should you assign to Lead1 on RG-Backup?
  fr: |
    Fabrikam dispose d'un groupe de ressources nommé **RG-Backup** qui contient un coffre Recovery Services. Un chef d'équipe nommé Lead1 vous demande chaque semaine d'attribuer le rôle Backup Operator ou Backup Reader aux nouveaux membres de son équipe.

    Vous devez permettre à Lead1 d'attribuer **uniquement** les rôles Backup Operator et Backup Reader sur RG-Backup. Lead1 ne doit pouvoir attribuer aucun autre rôle et ne doit pas pouvoir gérer les ressources. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à Lead1 sur RG-Backup ?
body:
  options:
    - { id: a, text: { en: "Role Based Access Control Administrator, with a condition that limits the roles Lead1 can assign", fr: "Role Based Access Control Administrator, avec une condition qui limite les rôles que Lead1 peut attribuer" } }
    - { id: b, text: { en: "User Access Administrator, with no condition on the role assignment", fr: "User Access Administrator, sans condition sur l'attribution de rôle" } }
    - { id: c, text: { en: "Owner, with a condition that limits the roles Lead1 can assign", fr: "Owner, avec une condition qui limite les rôles que Lead1 peut attribuer" } }
    - { id: d, text: { en: "Backup Contributor, with no condition on the role assignment", fr: "Backup Contributor, sans condition sur l'attribution de rôle" } }
answer: { optionId: a }
explanation:
  correct:
    en: Role Based Access Control Administrator is designed to delegate role assignment management. It can create and delete role assignments and read resources, but not manage them. Adding a delegation condition restricts which roles (and optionally which principals) Lead1 can assign.
    fr: Role Based Access Control Administrator est conçu pour déléguer la gestion des attributions de rôles. Il peut créer et supprimer des attributions de rôles et lire les ressources, mais pas les gérer. L'ajout d'une condition de délégation limite les rôles (et éventuellement les principaux) que Lead1 peut attribuer.
  options:
    b:
      en: Without a condition, User Access Administrator lets Lead1 assign any role, including Owner, to anyone in RG-Backup.
      fr: Sans condition, User Access Administrator permet à Lead1 d'attribuer n'importe quel rôle, y compris Owner, à n'importe qui dans RG-Backup.
    c:
      en: Even if its role assignments are constrained, Owner still grants full management of every resource in RG-Backup.
      fr: Même si ses attributions de rôles sont limitées, Owner accorde toujours la gestion complète de toutes les ressources de RG-Backup.
    d:
      en: Backup Contributor manages backups but cannot give access to others.
      fr: Backup Contributor gère les sauvegardes mais ne peut pas accorder l'accès à d'autres.
references:
  - title: Delegate Azure access management to others - Azure ABAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/delegate-role-assignments-overview
