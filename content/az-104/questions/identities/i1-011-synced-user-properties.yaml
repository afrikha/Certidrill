id: i1-011-synced-user-properties
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware synchronizes its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID by using Microsoft Entra Connect. The user **Ben Miller** is synchronized from AD DS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware synchronise son domaine Active Directory Domain Services (AD DS) local avec Microsoft Entra ID à l'aide de Microsoft Entra Connect. L'utilisateur **Ben Miller** est synchronisé depuis AD DS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "You can set the usage location of Ben Miller directly in the Microsoft Entra admin center."
        fr: "Vous pouvez définir l'emplacement d'utilisation de Ben Miller directement dans le Centre d'administration Microsoft Entra."
    - id: s2
      text:
        en: "To change the job title of Ben Miller, you update it in AD DS and wait for the next synchronization cycle."
        fr: "Pour modifier le poste de Ben Miller, vous le mettez à jour dans AD DS et attendez le prochain cycle de synchronisation."
    - id: s3
      text:
        en: "Password writeback is not enabled. You can reset the password of Ben Miller from the Microsoft Entra admin center, and he can then sign in to on-premises resources with the new password."
        fr: "L'écriture différée du mot de passe n'est pas activée. Vous pouvez réinitialiser le mot de passe de Ben Miller depuis le Centre d'administration Microsoft Entra, et il peut ensuite se connecter aux ressources locales avec le nouveau mot de passe."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "For users whose source of authority is AD DS, identity, contact and job information must be changed on-premises and then synchronized, but Microsoft Entra attributes such as the usage location can be updated in the admin center. The password of a synchronized user is mastered in AD DS: only password writeback writes an administrator's reset from the Microsoft Entra admin center back to AD DS. Without it, the on-premises password stays unchanged, so the new password doesn't work for on-premises resources."
    fr: "Pour les utilisateurs dont la source d'autorité est AD DS, les informations d'identité, de contact et de poste doivent être modifiées en local puis synchronisées, mais les attributs propres à Microsoft Entra, comme l'emplacement d'utilisation, peuvent être mis à jour dans le centre d'administration. Le mot de passe d'un utilisateur synchronisé est géré dans AD DS : seule l'écriture différée du mot de passe réécrit dans AD DS une réinitialisation faite par un administrateur dans le Centre d'administration Microsoft Entra. Sans elle, le mot de passe local reste inchangé ; le nouveau mot de passe ne fonctionne donc pas pour les ressources locales."
references:
  - title: How to manage user profile information in the Microsoft Entra admin center
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info
  - title: On-premises password writeback with self-service password reset
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-writeback
