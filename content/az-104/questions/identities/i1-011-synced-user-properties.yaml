id: i1-011-synced-user-properties
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware synchronizes its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID by using Microsoft Entra Connect. The user **Ben Miller** is synchronized from AD DS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Litware synchronise son domaine Active Directory Domain Services (AD DS) local avec Microsoft Entra ID à l'aide de Microsoft Entra Connect. L'utilisateur **Ben Miller** est synchronisé depuis AD DS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "You can set the usage location of Ben Miller directly in the Microsoft Entra admin center."
        fr: "Vous pouvez définir l'emplacement d'utilisation de Ben Miller directement dans le Centre d'administration Microsoft Entra."
    - id: s2
      text:
        en: "To change the job title of Ben Miller, you update it in AD DS and wait for the next synchronization cycle."
        fr: "Pour modifier le poste de Ben Miller, vous le mettez à jour dans AD DS et attendez le prochain cycle de synchronisation."
    - id: s3
      text:
        en: "If you delete Ben Miller in Microsoft Entra ID while his account still exists in AD DS, the account stays deleted after the next synchronization cycle."
        fr: "Si vous supprimez Ben Miller dans Microsoft Entra ID alors que son compte existe toujours dans AD DS, le compte reste supprimé après le prochain cycle de synchronisation."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "For users whose source of authority is AD DS, identity, contact and job information must be changed on-premises and then synchronized, but Microsoft Entra attributes such as the usage location can be updated in the admin center. Microsoft Entra ID isn't the source of authority for synced users, so the sync engine can restore a deleted user that still exists on-premises."
    fr: "Pour les utilisateurs dont la source d'autorité est AD DS, les informations d'identité, de contact et de poste doivent être modifiées en local puis synchronisées, mais les attributs propres à Microsoft Entra, comme l'emplacement d'utilisation, peuvent être mis à jour dans le centre d'administration. Microsoft Entra ID n'étant pas la source d'autorité des utilisateurs synchronisés, le moteur de synchronisation peut restaurer un utilisateur supprimé qui existe toujours en local."
references:
  - title: How to manage user profile information in the Microsoft Entra admin center
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info
  - title: Restore or permanently remove recently deleted user
    url: https://learn.microsoft.com/en-us/entra/fundamentals/users-restore
