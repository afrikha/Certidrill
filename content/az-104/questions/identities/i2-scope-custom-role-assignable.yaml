id: i2-scope-custom-role-assignable
objective: "1.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a management group named **MG-Retail** that contains three subscriptions. You plan to create custom roles that the administrators of MG-Retail will assign at different scopes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Proseware dispose d'un groupe d'administration nommé **MG-Retail** qui contient trois abonnements. Vous prévoyez de créer des rôles personnalisés que les administrateurs de MG-Retail attribueront à différentes étendues.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A custom role that contains DataActions and lists MG-Retail in AssignableScopes can be assigned at the scope of a subscription in MG-Retail.
        fr: Un rôle personnalisé qui contient des DataActions et liste MG-Retail dans AssignableScopes peut être attribué à l'étendue d'un abonnement de MG-Retail.
    - id: s2
      text:
        en: A custom role that contains DataActions can be assigned at the scope of MG-Retail itself.
        fr: Un rôle personnalisé qui contient des DataActions peut être attribué à l'étendue de MG-Retail elle-même.
    - id: s3
      text:
        en: The AssignableScopes of a single custom role can list MG-Retail and a second management group.
        fr: La propriété AssignableScopes d'un même rôle personnalisé peut lister MG-Retail et un deuxième groupe d'administration.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Custom roles with DataActions cannot be assigned at management group scope, but a role with DataActions and one management group in AssignableScopes can be assigned to the subscriptions inside that management group. A custom role can define only one management group in AssignableScopes.
    fr: Les rôles personnalisés avec des DataActions ne peuvent pas être attribués à l'étendue d'un groupe d'administration, mais un rôle avec des DataActions et un groupe d'administration dans AssignableScopes peut être attribué aux abonnements de ce groupe d'administration. Un rôle personnalisé ne peut définir qu'un seul groupe d'administration dans AssignableScopes.
references:
  - title: Azure custom roles - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
