id: i2-builtin-vm-user-login
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Windows Server virtual machine named **VM-Kiosk01** that is configured for sign-in with Microsoft Entra ID. A help desk technician named Tech1 has the **Contributor** role on the resource group that contains VM-Kiosk01.

    Tech1 reports that sign-in to VM-Kiosk01 by using a Microsoft Entra account fails. Tech1 must be able to sign in to VM-Kiosk01 as a standard user, without local administrator privileges.

    Which role should you assign to Tech1 on VM-Kiosk01?
  fr: |
    Fabrikam dispose d'une machine virtuelle Windows Server nommée **VM-Kiosk01** configurée pour la connexion avec Microsoft Entra ID. Un technicien du support nommé Tech1 dispose du rôle **Contributor** sur le groupe de ressources qui contient VM-Kiosk01.

    Tech1 signale que la connexion à VM-Kiosk01 avec un compte Microsoft Entra échoue. Tech1 doit pouvoir se connecter à VM-Kiosk01 en tant qu'utilisateur standard, sans privilèges d'administrateur local.

    Quel rôle devez-vous attribuer à Tech1 sur VM-Kiosk01 ?
body:
  options:
    - { id: a, text: Virtual Machine User Login }
    - { id: b, text: Virtual Machine Administrator Login }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: Owner }
answer: { optionId: a }
explanation:
  correct:
    en: Signing in to a VM with Microsoft Entra ID requires the Virtual Machine User Login or Virtual Machine Administrator Login role. Owner or Contributor alone does not grant sign-in rights, which separates the people who manage VMs from the people who use them. Virtual Machine User Login gives regular user privileges, as required.
    fr: La connexion à une machine virtuelle avec Microsoft Entra ID nécessite le rôle Virtual Machine User Login ou Virtual Machine Administrator Login. Owner ou Contributor seul n'accorde pas le droit de se connecter, ce qui sépare les personnes qui gèrent les machines virtuelles de celles qui les utilisent. Virtual Machine User Login donne des privilèges d'utilisateur standard, comme demandé.
  options:
    b:
      en: Virtual Machine Administrator Login signs the user in with administrator privileges, which the requirement excludes.
      fr: Virtual Machine Administrator Login connecte l'utilisateur avec des privilèges d'administrateur, ce que l'exigence exclut.
    c:
      en: Virtual Machine Contributor manages the VM resource but, like Contributor, does not grant sign-in rights.
      fr: Virtual Machine Contributor gère la ressource machine virtuelle mais, comme Contributor, n'accorde pas le droit de se connecter.
    d:
      en: Owner does not grant Microsoft Entra sign-in to the VM either, and it would add unneeded privileges.
      fr: Owner n'accorde pas non plus la connexion Microsoft Entra à la machine virtuelle, et ajouterait des privilèges inutiles.
references:
