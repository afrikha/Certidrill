id: i2-builtin-privileged-roles-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named **Sub-Core**. Three administrators have built-in role assignments at the scope of Sub-Core:

    | User | Role |
    | --- | --- |
    | Admin1 | Contributor |
    | Admin2 | Role Based Access Control Administrator |
    | Admin3 | User Access Administrator |

    No other role is assigned to these users and no condition is set on the assignments.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub-Core**. Trois administrateurs disposent d'attributions de rôles intégrés à l'étendue de Sub-Core :

    | Utilisateur | Rôle |
    | --- | --- |
    | Admin1 | Contributor |
    | Admin2 | Role Based Access Control Administrator |
    | Admin3 | User Access Administrator |

    Aucun autre rôle n'est attribué à ces utilisateurs et aucune condition n'est définie sur les attributions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Admin1 can delete a resource group in Sub-Core.
        fr: Admin1 peut supprimer un groupe de ressources de Sub-Core.
    - id: s2
      text:
        en: Admin2 can create a virtual machine in Sub-Core.
        fr: Admin2 peut créer une machine virtuelle dans Sub-Core.
    - id: s3
      text:
        en: Admin3 can create a custom role whose AssignableScopes is Sub-Core.
        fr: Admin3 peut créer un rôle personnalisé dont la propriété AssignableScopes est Sub-Core.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Contributor has the `*` action and only excludes authorization writes and deletes (plus a few other actions), so Admin1 can delete resource groups. Role Based Access Control Administrator can only read resources (`*/read`) and create or delete role assignments; it cannot create resources. User Access Administrator has `Microsoft.Authorization/*`, which includes writing role definitions, so Admin3 can create a custom role for that scope.
    fr: Contributor dispose de l'action `*` et n'exclut que les écritures et suppressions d'autorisations (et quelques autres actions) ; Admin1 peut donc supprimer des groupes de ressources. Role Based Access Control Administrator peut seulement lire les ressources (`*/read`) et créer ou supprimer des attributions de rôles ; il ne peut pas créer de ressources. User Access Administrator dispose de `Microsoft.Authorization/*`, qui inclut l'écriture de définitions de rôles ; Admin3 peut donc créer un rôle personnalisé pour cette étendue.
references:
  - title: Azure built-in roles for Privileged - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged
  - title: Azure custom roles - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
