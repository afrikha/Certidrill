id: i3-policy-exemption-facts
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum assigns an initiative named **Adatum-Baseline** to a subscription. A storage account named **stlegacy01** is non-compliant with two of the policy definitions in the initiative. You plan to create a policy exemption for stlegacy01.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Adatum attribue une initiative nommée **Adatum-Baseline** à un abonnement. Un compte de stockage nommé **stlegacy01** est non conforme à deux des définitions de stratégie de l'initiative. Vous prévoyez de créer une exemption de stratégie pour stlegacy01.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: The exemption can apply to only the two non-compliant policy definitions instead of the whole initiative.
        fr: L'exemption peut s'appliquer uniquement aux deux définitions de stratégie non conformes au lieu de l'initiative entière.
    - id: s2
      text:
        en: The Mitigated category indicates that the intent of the policy is met by another method.
        fr: La catégorie Mitigated (atténué) indique que l'intention de la stratégie est satisfaite par une autre méthode.
    - id: s3
      text:
        en: When the expiresOn date is reached, Azure deletes the exemption object automatically.
        fr: Lorsque la date expiresOn est atteinte, Azure supprime automatiquement l'objet d'exemption.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: For an initiative assignment, the exemption can list the reference IDs of only some policy definitions of the initiative (the policyDefinitionReferenceId array). The two categories are Mitigated (intent met another way) and Waiver (non-compliance temporarily accepted). An expired exemption is kept for record-keeping but is no longer honored; you delete it yourself.
    fr: "Pour une attribution d'initiative, l'exemption peut lister les ID de référence de certaines définitions de stratégie seulement (tableau policyDefinitionReferenceId). Les deux catégories sont Mitigated (intention satisfaite autrement) et Waiver (non-conformité acceptée temporairement). Une exemption expirée est conservée pour l'historique, mais elle n'est plus appliquée ; c'est à vous de la supprimer."
references:
  - title: Details of the policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
