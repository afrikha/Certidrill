id: i3-tag-rules-statements
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is defining a tagging standard for its Azure environment, which includes management groups, subscriptions, resource groups and resources.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Northwind Traders définit une norme d'étiquetage pour son environnement Azure, qui comprend des groupes d'administration, des abonnements, des groupes de ressources et des ressources.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A resource group can have up to 50 tag name-value pairs.
        fr: Un groupe de ressources peut avoir jusqu'à 50 paires nom-valeur d'étiquettes.
    - id: s2
      text:
        en: The tag values `Production` and `production` are treated as the same value.
        fr: Les valeurs d'étiquette `Production` et `production` sont considérées comme la même valeur.
    - id: s3
      text:
        en: You can apply a tag to a management group to group its costs.
        fr: Vous pouvez appliquer une étiquette à un groupe d'administration pour regrouper ses coûts.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Each resource, resource group and subscription supports a maximum of 50 tag name-value pairs. Tag names are case-insensitive for operations, but tag values are case-sensitive. Tags can be applied to resources, resource groups and subscriptions, but not to management groups.
    fr: "Chaque ressource, groupe de ressources et abonnement prend en charge au maximum 50 paires nom-valeur d'étiquettes. Les noms d'étiquettes ne respectent pas la casse pour les opérations, mais les valeurs d'étiquettes la respectent. Les étiquettes peuvent être appliquées aux ressources, aux groupes de ressources et aux abonnements, mais pas aux groupes d'administration."
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
