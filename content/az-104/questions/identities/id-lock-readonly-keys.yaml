id: id-lock-readonly-keys
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A resource group named **RG1** contains a storage account named **stdata01**. You apply a **ReadOnly** lock to RG1.

    User1 has the Owner role on RG1. User1 tries to list the access keys of stdata01 in the Azure portal.

    What is the result?
  fr: |
    Un groupe de ressources nommé **RG1** contient un compte de stockage nommé **stdata01**. Vous appliquez un verrou **ReadOnly** (lecture seule) à RG1.

    User1 a le rôle Owner sur RG1. User1 essaie d'afficher les clés d'accès de stdata01 dans le portail Azure.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: The keys are listed because the Owner role is not affected by locks., fr: Les clés s'affichent, car le rôle Owner n'est pas concerné par les verrous. }
    - id: b
      text: { en: The keys are listed because viewing keys is a read operation., fr: Les clés s'affichent, car l'affichage des clés est une opération de lecture. }
    - id: c
      text: { en: The operation fails because listing keys is a POST operation that the lock blocks., fr: L'opération échoue, car l'affichage des clés est une opération POST que le verrou bloque. }
    - id: d
      text: { en: The keys are listed only if User1 also has the Storage Account Key Operator Service Role., fr: Les clés ne s'affichent que si User1 a aussi le rôle Storage Account Key Operator Service Role. }
answer: { optionId: c }
explanation:
  correct:
    en: A ReadOnly lock blocks every management operation other than GET. Listing the keys of a storage account calls the `listKeys` action, which is a POST request, so it is denied. Locks apply to all users, whatever their role.
    fr: "Un verrou ReadOnly bloque toutes les opérations de gestion autres que GET. L'affichage des clés d'un compte de stockage appelle l'action `listKeys`, qui est une requête POST : elle est donc refusée. Les verrous s'appliquent à tous les utilisateurs, quel que soit leur rôle."
  options:
    a: { en: Locks override permissions for every user, including Owners. An Owner can remove the lock, but while it is in place it applies., fr: Les verrous priment sur les autorisations de tous les utilisateurs, Owners compris. Un Owner peut supprimer le verrou, mais tant qu'il est en place il s'applique. }
    b: { en: Listing keys looks like a read, but it is implemented as a POST action., fr: L'affichage des clés ressemble à une lecture, mais il est implémenté sous forme d'action POST. }
    d: { en: No role assignment bypasses a lock., fr: Aucune attribution de rôle ne permet de contourner un verrou. }
references:
  - title: Lock your resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
