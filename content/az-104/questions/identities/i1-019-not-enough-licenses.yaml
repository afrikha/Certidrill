id: i1-019-not-enough-licenses
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware assigns Microsoft 365 E5 licenses through the group **LIC-E5**. On the **Errors & issues** tab of the product, 15 members of LIC-E5 show the error **Not enough licenses**. Some other users of the tenant have E5 licenses assigned directly that they no longer use.

    You need to resolve the error for the 15 users.

    Which two actions should you perform? Each correct answer presents a complete solution.
  fr: |
    Litware attribue des licences Microsoft 365 E5 par le biais du groupe **LIC-E5**. Dans l'onglet **Errors & issues** du produit, 15 membres de LIC-E5 affichent l'erreur **Not enough licenses**. D'autres utilisateurs du locataire ont des licences E5 attribuées directement qu'ils n'utilisent plus.

    Vous devez résoudre l'erreur pour les 15 utilisateurs.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Purchase at least 15 additional E5 licenses.", fr: "Acheter au moins 15 licences E5 supplémentaires." } }
    - { id: b, text: { en: "Remove the unused direct E5 assignments from the other users.", fr: "Retirer les attributions directes E5 inutilisées des autres utilisateurs." } }
    - { id: c, text: { en: "Set the usage location of the 15 users.", fr: "Définir l'emplacement d'utilisation des 15 utilisateurs." } }
    - { id: d, text: { en: "Select Reprocess for the 15 users without changing anything else.", fr: "Sélectionner Retraiter (Reprocess) pour les 15 utilisateurs sans rien changer d'autre." } }
    - { id: e, text: { en: "Add the 15 users to a second group that is assigned the same E5 license.", fr: "Ajouter les 15 utilisateurs à un second groupe auquel la même licence E5 est attribuée." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "The error means the subscription has no free E5 license for these members. You can fix it by buying more licenses or by freeing licenses, for example by removing unused direct assignments. Once licenses are available, group-based licensing assigns them (you can reprocess to speed it up)."
    fr: "L'erreur signifie que l'abonnement n'a plus de licence E5 libre pour ces membres. Vous pouvez la corriger en achetant des licences supplémentaires ou en libérant des licences, par exemple en retirant les attributions directes inutilisées. Une fois des licences disponibles, la licence basée sur un groupe les attribue (le retraitement peut accélérer l'opération)."
  options:
    c: { en: "Usage location causes a different error; missing locations inherit the tenant location.", fr: "L'emplacement d'utilisation provoque une autre erreur ; un emplacement absent hérite de celui du locataire." }
    d: { en: "Reprocessing without freeing or buying licenses fails again.", fr: "Retraiter sans libérer ni acheter de licences échoue de nouveau." }
    e: { en: "A second group draws from the same pool of E5 licenses, which is exhausted.", fr: "Un second groupe puise dans le même stock de licences E5, qui est épuisé." }
references:
  - title: Assign or unassign licenses to a group in the Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-group-licenses
