id: i2-scope-cli-container
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a storage account named **stlitwareinv** in a resource group named **rg-billing**. The account contains several blob containers, including one named **invoices**. A function app has a system-assigned managed identity whose object ID is `3b7e2c41-9a0d-4f6e-8c15-7d2a4b9e0c63`.

    The managed identity must be able to read, write and delete blobs in the invoices container only. The solution must follow the principle of least privilege.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.
  fr: |
    Litware dispose d'un compte de stockage nommé **stlitwareinv** dans un groupe de ressources nommé **rg-billing**. Le compte contient plusieurs conteneurs d'objets blob, dont un nommé **invoices**. Une application de fonction dispose d'une identité managée affectée par le système dont l'ID d'objet est `3b7e2c41-9a0d-4f6e-8c15-7d2a4b9e0c63`.

    L'identité managée doit pouvoir lire, écrire et supprimer des blobs dans le conteneur invoices uniquement. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] \
      --assignee-object-id "3b7e2c41-9a0d-4f6e-8c15-7d2a4b9e0c63" \
      --assignee-principal-type ServicePrincipal \
      --role [[role]] \
      --scope "/subscriptions/<subscriptionId>/resourceGroups/rg-billing/providers/Microsoft.Storage/storageAccounts/stlitwareinv[[path]]"
  slots:
    - id: cmd
      options:
        - { id: create, text: az role assignment create }
        - { id: update, text: az role assignment update }
        - { id: defcreate, text: az role definition create }
        - { id: spupdate, text: az ad sp update }
    - id: role
      options:
        - { id: blobcontrib, text: "\"Storage Blob Data Contributor\"" }
        - { id: blobowner, text: "\"Storage Blob Data Owner\"" }
        - { id: accontrib, text: "\"Storage Account Contributor\"" }
        - { id: blobreader, text: "\"Storage Blob Data Reader\"" }
    - id: path
      options:
        - { id: container, text: /blobServices/default/containers/invoices }
        - { id: nosvc, text: /containers/invoices }
        - { id: svconly, text: /blobServices/default }
        - { id: noname, text: /blobServices/invoices }
answer:
  values: { cmd: create, role: blobcontrib, path: container }
explanation:
  correct:
    en: "`az role assignment create` assigns a role to the managed identity (identified by its object ID and the ServicePrincipal principal type). Storage Blob Data Contributor allows reading, writing and deleting blobs. Scoping it to `.../blobServices/default/containers/invoices` limits the access to that single container."
    fr: "`az role assignment create` attribue un rôle à l'identité managée (identifiée par son ID d'objet et le type de principal ServicePrincipal). Storage Blob Data Contributor permet de lire, d'écrire et de supprimer des blobs. L'étendue `.../blobServices/default/containers/invoices` limite l'accès à ce seul conteneur."
  options:
    update: { en: az role assignment update modifies an existing assignment; it does not create one., fr: az role assignment update modifie une attribution existante ; il n'en crée pas. }
    defcreate: { en: "az role definition create creates a custom role, not an assignment.", fr: "az role definition create crée un rôle personnalisé, pas une attribution." }
    spupdate: { en: az ad sp update changes service principal properties in Microsoft Entra ID; it does not grant Azure access., fr: az ad sp update modifie les propriétés du principal de service dans Microsoft Entra ID ; il n'accorde pas d'accès Azure. }
    blobowner: { en: "Storage Blob Data Owner adds full control, including POSIX access control management, beyond the need.", fr: "Storage Blob Data Owner ajoute le contrôle total, y compris la gestion du contrôle d'accès POSIX, au-delà du besoin." }
    accontrib: { en: "Storage Account Contributor is a management role with access to the account keys, not a container-scoped data role.", fr: "Storage Account Contributor est un rôle de gestion avec accès aux clés du compte, pas un rôle de données limité à un conteneur." }
    blobreader: { en: Storage Blob Data Reader cannot write or delete blobs., fr: Storage Blob Data Reader ne peut ni écrire ni supprimer de blobs. }
    nosvc: { en: The container resource ID must include the blobServices/default segment., fr: L'ID de ressource du conteneur doit inclure le segment blobServices/default. }
    svconly: { en: Scoping to the blob service grants access to every container of the account., fr: Une étendue sur le service blob accorde l'accès à tous les conteneurs du compte. }
    noname: { en: The blob service segment is always named default before the containers segment., fr: "Le segment du service blob s'appelle toujours default, avant le segment containers." }
references:
  - title: Assign Azure roles using Azure CLI - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-cli
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
