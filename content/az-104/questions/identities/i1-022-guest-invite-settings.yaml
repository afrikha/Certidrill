id: i1-022-guest-invite-settings
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Entra tenant that uses the default external collaboration settings. Many employees and some guest users invite external users without control.

    You need to ensure that only users who hold the User Administrator or Guest Inviter role can invite guest users. Other members and guests must not be able to send invitations.

    Which **Guest invite settings** option should you select?
  fr: |
    Fabrikam dispose d'un locataire Microsoft Entra qui utilise les paramètres de collaboration externe par défaut. De nombreux employés et certains utilisateurs invités invitent des utilisateurs externes sans contrôle.

    Vous devez faire en sorte que seuls les utilisateurs disposant du rôle User Administrator ou Guest Inviter puissent inviter des utilisateurs invités. Les autres membres et les invités ne doivent pas pouvoir envoyer d'invitations.

    Quelle option de **Guest invite settings** devez-vous sélectionner ?
body:
  options:
    - id: a
      text: Only users assigned to specific admin roles can invite guest users
    - id: b
      text: Member users and users assigned to specific admin roles can invite guest users including guests with member permissions
    - id: c
      text: Anyone in the organization can invite guest users including guests and non-admins (most inclusive)
    - id: d
      text: No one in the organization can invite guest users including admins (most restrictive)
answer: { optionId: a }
explanation:
  correct:
    en: "With **Only users assigned to specific admin roles can invite guest users**, only users with roles such as User Administrator or Guest Inviter can send B2B invitations. The Guest Inviter role can be given to individual users who need to invite guests without a broader admin role."
    fr: "Avec **Only users assigned to specific admin roles can invite guest users**, seuls les utilisateurs disposant de rôles comme User Administrator ou Guest Inviter peuvent envoyer des invitations B2B. Le rôle Guest Inviter peut être donné à des utilisateurs qui doivent inviter des invités sans rôle d'administration plus large."
  options:
    b: { en: "This option still lets every member user invite guests.", fr: "Cette option permet toujours à chaque utilisateur membre d'inviter des invités." }
    c: { en: "This is the most permissive option; guests and non-admins can invite.", fr: "C'est l'option la plus permissive ; les invités et les non-administrateurs peuvent inviter." }
    d: { en: "This option blocks everyone, including the User Administrator and Guest Inviter roles.", fr: "Cette option bloque tout le monde, y compris les rôles User Administrator et Guest Inviter." }
references:
  - title: Configure external collaboration
    url: https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
