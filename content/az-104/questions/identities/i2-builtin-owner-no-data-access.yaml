id: i2-builtin-owner-no-data-access
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a storage account named **stwingtipraw** in a subscription named **Sub-Data**. Shared Key authorization is disallowed on stwingtipraw. The account contains a container named **ingest**.

    A user named Admin1 has the **Owner** role on Sub-Data and no other role assignment. When Admin1 runs `az storage blob list --account-name stwingtipraw --container-name ingest --auth-mode login`, the command fails with an authorization error.

    Admin1 must be able to list and read the blobs in the ingest container by using Microsoft Entra authorization.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un compte de stockage nommé **stwingtipraw** dans un abonnement nommé **Sub-Data**. L'autorisation par clé partagée (Shared Key) est interdite sur stwingtipraw. Le compte contient un conteneur nommé **ingest**.

    Un utilisateur nommé Admin1 dispose du rôle **Owner** sur Sub-Data et d'aucune autre attribution de rôle. Lorsque Admin1 exécute `az storage blob list --account-name stwingtipraw --container-name ingest --auth-mode login`, la commande échoue avec une erreur d'autorisation.

    Admin1 doit pouvoir lister et lire les blobs du conteneur ingest en utilisant l'autorisation Microsoft Entra.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign Admin1 the Storage Blob Data Reader role on stwingtipraw.", fr: "Attribuer à Admin1 le rôle Storage Blob Data Reader sur stwingtipraw." } }
    - { id: b, text: { en: "Assign Admin1 the Storage Blob Data Contributor role on the ingest container.", fr: "Attribuer à Admin1 le rôle Storage Blob Data Contributor sur le conteneur ingest." } }
    - { id: c, text: { en: "Assign Admin1 the Reader and Data Access role on stwingtipraw.", fr: "Attribuer à Admin1 le rôle Reader and Data Access sur stwingtipraw." } }
    - { id: d, text: { en: "Assign Admin1 the Storage Account Contributor role on stwingtipraw.", fr: "Attribuer à Admin1 le rôle Storage Account Contributor sur stwingtipraw." } }
    - { id: e, text: { en: "Assign Admin1 the User Access Administrator role on stwingtipraw.", fr: "Attribuer à Admin1 le rôle User Access Administrator sur stwingtipraw." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Owner grants every control plane action (`*`) but no DataActions, so it does not authorize reading blob data with Microsoft Entra credentials. A data plane role that includes blob read, such as Storage Blob Data Reader on the account or Storage Blob Data Contributor on the container, gives Admin1 that access.
    fr: Owner accorde toutes les actions du plan de contrôle (`*`) mais aucune DataAction ; il n'autorise donc pas la lecture des données blob avec des informations d'identification Microsoft Entra. Un rôle du plan de données qui inclut la lecture de blobs, comme Storage Blob Data Reader sur le compte ou Storage Blob Data Contributor sur le conteneur, donne cet accès à Admin1.
  options:
    c:
      en: Reader and Data Access reaches the data through the account keys, and Shared Key authorization is disallowed on this account.
      fr: Reader and Data Access accède aux données par les clés du compte, et l'autorisation par clé partagée est interdite sur ce compte.
    d:
      en: Storage Account Contributor is a control plane role; its access to the keys is useless because Shared Key authorization is disallowed.
      fr: Storage Account Contributor est un rôle du plan de contrôle ; son accès aux clés est inutile puisque l'autorisation par clé partagée est interdite.
    e:
      en: User Access Administrator manages role assignments; it grants no data access by itself.
      fr: User Access Administrator gère les attributions de rôles ; il n'accorde lui-même aucun accès aux données.
references:
  - title: Understand Azure role definitions - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
  - title: Assign an Azure Role for Blob Data Access - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access
