id: sr-01-q3
objective: "1.3.1"
type: series_yesno
series: sr-01-allowed-locations
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You assign Allowed locations to Sub1 with policy enforcement disabled.
  fr: |
    Vous attribuez Allowed locations à Sub1 avec l'application de la stratégie désactivée.
body:
  solution:
    en: |
      You assign the built-in **Allowed locations** policy definition to **Sub1** with East US and West Europe as the allowed locations. To avoid any impact on existing resources, you set **Policy enforcement** to **Disabled** (`enforcementMode: DoNotEnforce`).
    fr: |
      Vous attribuez la définition de stratégie intégrée **Allowed locations** (« Emplacements autorisés ») à **Sub1** avec East US et West Europe comme emplacements autorisés. Pour ne pas affecter les ressources existantes, vous définissez **Application de la stratégie** sur **Désactivée** (`enforcementMode: DoNotEnforce`).
answer: { value: false }
explanation:
  correct:
    en: |
      With the DoNotEnforce enforcement mode, the policy effect isn't applied when resources are created or updated: compliance is evaluated and reported, but nothing is denied. Deployments to other regions therefore still succeed, and the goal of blocking them isn't met. Existing resources are never changed by a Deny assignment, so disabling enforcement isn't needed to protect them.
    fr: |
      Avec le mode d'application DoNotEnforce, l'effet de la stratégie n'est pas appliqué lors de la création ou de la mise à jour des ressources : la conformité est évaluée et signalée, mais rien n'est refusé. Les déploiements vers d'autres régions réussissent donc toujours, et l'objectif de les bloquer n'est pas atteint. Une attribution Deny ne modifie jamais les ressources existantes ; désactiver l'application n'est pas nécessaire pour les protéger.
references:
  - title: "Details of the policy assignment structure"
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
