id: i2-interpret-effective-vm-network
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a subscription named **Sub-Apps** that contains a resource group named **RG-Net**. RG-Net contains a virtual network named **vnet-apps**, a network security group named **nsg-apps** and a virtual machine named **vm-api01**.

    A user named Eng4 has the following role assignments:

    | Role | Scope |
    | --- | --- |
    | Virtual Machine Contributor | Sub-Apps |
    | Reader | RG-Net |

    Which two actions can Eng4 perform? Each correct answer presents a complete solution.
  fr: |
    Litware dispose d'un abonnement nommé **Sub-Apps** qui contient un groupe de ressources nommé **RG-Net**. RG-Net contient un réseau virtuel nommé **vnet-apps**, un groupe de sécurité réseau nommé **nsg-apps** et une machine virtuelle nommée **vm-api01**.

    Un utilisateur nommé Eng4 dispose des attributions de rôles suivantes :

    | Rôle | Étendue |
    | --- | --- |
    | Virtual Machine Contributor | Sub-Apps |
    | Reader | RG-Net |

    Quelles sont les deux actions qu'Eng4 peut effectuer ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: Restart vm-api01., fr: Redémarrer vm-api01. } }
    - { id: b, text: { en: View the security rules of nsg-apps., fr: Consulter les règles de sécurité de nsg-apps. } }
    - { id: c, text: { en: Add a subnet to vnet-apps., fr: Ajouter un sous-réseau à vnet-apps. } }
    - { id: d, text: { en: Add an inbound security rule to nsg-apps., fr: Ajouter une règle de sécurité entrante à nsg-apps. } }
    - { id: e, text: { en: Assign the Reader role to another user on RG-Net., fr: Attribuer le rôle Reader à un autre utilisateur sur RG-Net. } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Virtual Machine Contributor at the subscription is inherited by RG-Net, so Eng4 can manage vm-api01. Reader on RG-Net (and the read permissions of Virtual Machine Contributor) allow viewing nsg-apps. Permissions are the sum of both assignments.
    fr: Virtual Machine Contributor sur l'abonnement est hérité par RG-Net ; Eng4 peut donc gérer vm-api01. Reader sur RG-Net (ainsi que les autorisations de lecture de Virtual Machine Contributor) permet de consulter nsg-apps. Les autorisations sont la somme des deux attributions.
  options:
    c:
      en: Virtual Machine Contributor can only read virtual networks and join subnets; it cannot modify the virtual network.
      fr: Virtual Machine Contributor peut seulement lire les réseaux virtuels et rejoindre des sous-réseaux ; il ne peut pas modifier le réseau virtuel.
    d:
      en: Virtual Machine Contributor can read and join network security groups but cannot change their rules, and Reader is read-only.
      fr: Virtual Machine Contributor peut lire et associer des groupes de sécurité réseau mais pas modifier leurs règles, et Reader est en lecture seule.
    e:
      en: Neither role includes `Microsoft.Authorization/roleAssignments/write`.
      fr: Aucun des deux rôles n'inclut `Microsoft.Authorization/roleAssignments/write`.
references:
  - title: Azure built-in roles for Compute - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
