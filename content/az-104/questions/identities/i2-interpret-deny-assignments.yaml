id: i2-interpret-deny-assignments
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses deployment stacks to deploy its landing zone resources. While reviewing access to a resource group named **RG-Landing**, you find a deny assignment in the **Deny assignments** tab of Access control (IAM).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise des piles de déploiement pour déployer les ressources de sa zone d'atterrissage. En examinant l'accès à un groupe de ressources nommé **RG-Landing**, vous trouvez une affectation de refus sous l'onglet **Deny assignments** de Contrôle d'accès (IAM).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who has the Owner role on RG-Landing can still perform an action that the deny assignment denies to that user.
        fr: Un utilisateur disposant du rôle Owner sur RG-Landing peut tout de même effectuer une action que l'affectation de refus lui refuse.
    - id: s2
      text:
        en: A deployment stack with deny settings creates a deny assignment on the resources it manages.
        fr: Une pile de déploiement avec des paramètres de refus crée une affectation de refus sur les ressources qu'elle gère.
    - id: s3
      text:
        en: An administrator with User Access Administrator on RG-Landing can create a new deny assignment from the Access control (IAM) page by selecting Add > Add deny assignment.
        fr: Un administrateur disposant de User Access Administrator sur RG-Landing peut créer une affectation de refus depuis la page Contrôle d'accès (IAM) en sélectionnant Add > Add deny assignment.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure Resource Manager checks deny assignments before role assignments; if a deny assignment applies, access is blocked even when a role such as Owner grants it. For generally available scenarios, deny assignments are created and managed by Azure, for example by a deployment stack configured with deny settings; you cannot create them directly from Access control (IAM).
    fr: "Azure Resource Manager vérifie les affectations de refus avant les attributions de rôles : si une affectation de refus s'applique, l'accès est bloqué même lorsqu'un rôle comme Owner l'accorde. Pour les scénarios en disponibilité générale, les affectations de refus sont créées et gérées par Azure, par exemple par une pile de déploiement configurée avec des paramètres de refus ; vous ne pouvez pas les créer directement depuis Contrôle d'accès (IAM)."
references:
  - title: List Azure deny assignments - Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/deny-assignments
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
