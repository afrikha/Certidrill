id: i1-001-bulk-create-users
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Entra tenant for the domain **adatum.com**. The HR department sends you a file that lists 250 new employees with their name, user principal name and initial password.

    You need to create the 250 employees as internal member accounts in Microsoft Entra ID. The solution must use the Microsoft Entra admin center and must not require writing a script.

    What should you use?
  fr: |
    Adatum Corporation dispose d'un locataire Microsoft Entra pour le domaine **adatum.com**. Le service RH vous envoie un fichier qui liste 250 nouveaux employés avec leur nom, leur nom d'utilisateur principal et leur mot de passe initial.

    Vous devez créer ces 250 employés en tant que comptes membres internes dans Microsoft Entra ID. La solution doit utiliser le Centre d'administration Microsoft Entra et ne doit pas nécessiter l'écriture d'un script.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Users > Bulk create, with the downloaded CSV template", fr: "Utilisateurs > Création en bloc (Bulk create), avec le modèle CSV téléchargé" }
    - id: b
      text: { en: "Users > Bulk operations > Bulk invite, with the downloaded CSV template", fr: "Utilisateurs > Opérations en bloc > Invitation en bloc (Bulk invite), avec le modèle CSV téléchargé" }
    - id: c
      text: { en: "A dynamic membership group with the rule user.objectId -ne null", fr: "Un groupe d'appartenance dynamique avec la règle user.objectId -ne null" }
    - id: d
      text: { en: "Group > Members > Bulk operations > Import members, with the CSV file", fr: "Groupe > Membres > Opérations en bloc > Importer des membres, avec le fichier CSV" }
answer: { optionId: a }
explanation:
  correct:
    en: "The bulk create operation reads a CSV file built from the downloaded template and creates internal member accounts. Only the Name, User name (UPN) and Initial password columns are required, which matches the data provided by HR. No invitation email is sent and no script is needed."
    fr: "L'opération de création en bloc lit un fichier CSV construit à partir du modèle téléchargé et crée des comptes membres internes. Seules les colonnes Nom, Nom d'utilisateur (UPN) et Mot de passe initial sont obligatoires, ce qui correspond aux données fournies par les RH. Aucune invitation n'est envoyée et aucun script n'est nécessaire."
  options:
    b:
      en: "Bulk invite creates external guest accounts and sends invitation emails; it does not create internal members with a password."
      fr: "L'invitation en bloc crée des comptes invités externes et envoie des invitations ; elle ne crée pas de membres internes avec un mot de passe."
    c:
      en: "A dynamic membership rule only selects existing users as group members; it never creates user accounts."
      fr: "Une règle d'appartenance dynamique sélectionne seulement des utilisateurs existants comme membres d'un groupe ; elle ne crée jamais de comptes."
    d:
      en: "Import members adds users that already exist to a group; it cannot create new accounts."
      fr: "L'importation de membres ajoute à un groupe des utilisateurs qui existent déjà ; elle ne peut pas créer de comptes."
references:
  - title: Bulk create users in the Azure portal
    url: https://learn.microsoft.com/en-us/entra/identity/users/users-bulk-add
