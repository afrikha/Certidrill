id: i3-cost-forecast-alert
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a monthly budget of 5,000 USD on a resource group named **RG-Events**. The finance manager wants to be warned by email as early as possible when the spending trend shows that RG-Events will exceed 5,000 USD by the end of the month, before the money is actually spent.

    How should you configure the budget alert condition?
  fr: |
    Wingtip Toys a un budget mensuel de 5 000 USD sur un groupe de ressources nommé **RG-Events**. Le responsable financier veut être averti par e-mail le plus tôt possible lorsque la tendance des dépenses montre que RG-Events dépassera 5 000 USD d'ici la fin du mois, avant que l'argent soit réellement dépensé.

    Comment devez-vous configurer la condition d'alerte du budget ?
body:
  options:
    - { id: a, text: { en: "Type: Forecasted, threshold: 100 percent", fr: "Type : Prévu, seuil : 100 %" } }
    - { id: b, text: { en: "Type: Actual, threshold: 100 percent", fr: "Type : Réel, seuil : 100 %" } }
    - { id: c, text: { en: "Type: Actual, threshold: 1000 percent", fr: "Type : Réel, seuil : 1000 %" } }
    - { id: d, text: { en: "Type: Forecasted, threshold: 0.01 percent", fr: "Type : Prévu, seuil : 0,01 %" } }
answer: { optionId: a }
explanation:
  correct:
    en: A forecasted budget alert fires when the forecasted cost projection exceeds the threshold, which gives advance notice that spending is likely to exceed the budget. A 100 percent threshold matches the requirement of exceeding the full 5,000 USD.
    fr: "Une alerte budgétaire sur le coût prévu se déclenche lorsque la projection du coût prévu dépasse le seuil, ce qui avertit à l'avance que les dépenses dépasseront probablement le budget. Un seuil de 100 % correspond à l'exigence de dépassement des 5 000 USD."
  options:
    b: { en: "An actual cost alert fires only after the cost has really been incurred.", fr: "Une alerte sur le coût réel ne se déclenche qu'une fois le coût réellement engagé." }
    c: { en: "The alert would fire only after spending ten times the budget.", fr: "L'alerte ne se déclencherait qu'après avoir dépensé dix fois le budget." }
    d: { en: "A forecast above 0.01 percent of the budget is almost always reached, so the alert would be meaningless.", fr: "Une prévision supérieure à 0,01 % du budget est presque toujours atteinte : l'alerte n'aurait aucun sens." }
references:
  - title: Tutorial - Create and manage budgets
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
