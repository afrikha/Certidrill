id: i1-006-nested-groups
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Entra tenant that contains cloud-only security groups and Microsoft 365 groups. None of the groups is role-assignable or synchronized from on-premises.

    You plan to use nested groups to simplify administration.

    Which two configurations are supported? Each correct answer presents a complete solution.
  fr: |
    Litware dispose d'un locataire Microsoft Entra qui contient des groupes de sécurité uniquement cloud et des groupes Microsoft 365. Aucun groupe n'est attribuable à un rôle ni synchronisé depuis l'environnement local.

    Vous prévoyez d'utiliser des groupes imbriqués pour simplifier l'administration.

    Quelles sont les deux configurations prises en charge ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the security group SG-Lyon as a member of the security group SG-France.", fr: "Ajouter le groupe de sécurité SG-Lyon comme membre du groupe de sécurité SG-France." } }
    - { id: b, text: { en: "Add the security group SG-Lyon as a member of the Microsoft 365 group M365-Sales.", fr: "Ajouter le groupe de sécurité SG-Lyon comme membre du groupe Microsoft 365 M365-Sales." } }
    - { id: c, text: { en: "Add the Microsoft 365 group M365-Sales as a member of the security group SG-France.", fr: "Ajouter le groupe Microsoft 365 M365-Sales comme membre du groupe de sécurité SG-France." } }
    - { id: d, text: { en: "Target SG-France in a Conditional Access policy so that the members of the nested group SG-Lyon are in scope.", fr: "Cibler SG-France dans une stratégie d'accès conditionnel pour que les membres du groupe imbriqué SG-Lyon soient inclus dans l'étendue." } }
    - { id: e, text: { en: "Assign a license to SG-France so that the members of the nested group SG-Lyon receive it.", fr: "Attribuer une licence à SG-France pour que les membres du groupe imbriqué SG-Lyon la reçoivent." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "A security group can be a member of another security group, and nested groups can be used for membership and Conditional Access scopes."
    fr: "Un groupe de sécurité peut être membre d'un autre groupe de sécurité, et les groupes imbriqués peuvent être utilisés pour l'appartenance et pour l'étendue de l'accès conditionnel."
  options:
    b: { en: "Adding security groups to Microsoft 365 groups isn't supported.", fr: "L'ajout de groupes de sécurité à des groupes Microsoft 365 n'est pas pris en charge." }
    c: { en: "Microsoft 365 groups can't be added to security groups or to other Microsoft 365 groups.", fr: "Les groupes Microsoft 365 ne peuvent pas être ajoutés à des groupes de sécurité ni à d'autres groupes Microsoft 365." }
    e: { en: "Group-based licensing doesn't support nested groups; only the direct members of SG-France would get the license.", fr: "La licence basée sur un groupe ne prend pas en charge les groupes imbriqués ; seuls les membres directs de SG-France recevraient la licence." }
references:
  - title: How to manage groups
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-groups
