id: i3-policy-dine-monitoring-agent
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription named **Sub-Ops** that contains 300 Windows virtual machines. Some of the virtual machines do not have the Azure Monitor Agent extension installed.

    You need to create a custom Azure Policy definition that automatically installs the extension on any virtual machine that does not have it, for new virtual machines and, through remediation, for existing ones.

    Which policy effect should the definition use?
  fr: |
    Fabrikam dispose d'un abonnement Azure nommé **Sub-Ops** qui contient 300 machines virtuelles Windows. Certaines machines virtuelles n'ont pas l'extension Azure Monitor Agent installée.

    Vous devez créer une définition Azure Policy personnalisée qui installe automatiquement l'extension sur toute machine virtuelle qui ne l'a pas, pour les nouvelles machines virtuelles et, par correction, pour les machines existantes.

    Quel effet de stratégie la définition doit-elle utiliser ?
body:
  options:
    - { id: a, text: deployIfNotExists }
    - { id: b, text: auditIfNotExists }
    - { id: c, text: append }
    - { id: d, text: deny }
answer: { optionId: a }
explanation:
  correct:
    en: The deployIfNotExists effect checks whether a related resource (here the VM extension) exists and, if not, deploys a template to create it. Existing non-compliant virtual machines are fixed by a remediation task that runs with the managed identity of the policy assignment.
    fr: "L'effet deployIfNotExists vérifie si une ressource associée (ici l'extension de la machine virtuelle) existe et, sinon, déploie un modèle pour la créer. Les machines virtuelles existantes non conformes sont corrigées par une tâche de correction exécutée avec l'identité managée de l'attribution de stratégie."
  options:
    b: { en: auditIfNotExists only reports the missing extension as non-compliant; it never deploys anything., fr: "auditIfNotExists signale seulement l'extension manquante comme non conforme ; il ne déploie jamais rien." }
    c: { en: append adds fields to the request of the resource being created or updated; it cannot deploy a separate extension resource., fr: append ajoute des champs à la requête de la ressource créée ou mise à jour ; il ne peut pas déployer une ressource d'extension distincte. }
    d: { en: "deny blocks non-compliant requests instead of fixing them, and it does nothing for existing virtual machines.", fr: "deny bloque les requêtes non conformes au lieu de les corriger, et n'agit pas sur les machines virtuelles existantes." }
references:
  - title: Azure Policy definitions deployIfNotExists effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists
  - title: Remediate non-compliant resources
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
