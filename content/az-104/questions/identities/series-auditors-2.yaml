id: series-auditors-2
objective: "1.2.2"
type: series_yesno
series: series-auditors-read
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign the Reader role to Auditors on each resource group.
  fr: Vous attribuez le rôle Reader à Auditors sur chaque groupe de ressources.
body:
  solution:
    en: You assign the **Reader** role to the Auditors group on **each existing resource group** of Sub1.
    fr: Vous attribuez le rôle **Reader** au groupe Auditors sur **chaque groupe de ressources existant** de Sub1.
answer: { value: false }
explanation:
  correct:
    en: Assignments on the existing resource groups do not cover the resource groups created every month, so Auditors would not see future resources.
    fr: "Les attributions sur les groupes de ressources existants ne couvrent pas ceux créés chaque mois : Auditors ne verrait pas les ressources futures."
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
