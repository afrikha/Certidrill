id: i3-rg-move-permissions
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware is creating a custom role for operators who move resources from a resource group named **RG-Staging** to a resource group named **RG-Release** in the same subscription. The role must contain the minimum permissions required for the move.

    Which two permissions should the operators have? Each correct answer presents part of the solution.
  fr: |
    Litware crée un rôle personnalisé pour des opérateurs qui déplacent des ressources d'un groupe de ressources nommé **RG-Staging** vers un groupe de ressources nommé **RG-Release** dans le même abonnement. Le rôle doit contenir les autorisations minimales nécessaires au déplacement.

    Quelles sont les deux autorisations dont les opérateurs ont besoin ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft.Resources/subscriptions/resourceGroups/moveResources/action on RG-Staging", fr: "Microsoft.Resources/subscriptions/resourceGroups/moveResources/action sur RG-Staging" } }
    - { id: b, text: { en: "Microsoft.Resources/subscriptions/resourceGroups/write on RG-Release", fr: "Microsoft.Resources/subscriptions/resourceGroups/write sur RG-Release" } }
    - { id: c, text: { en: "Microsoft.Resources/subscriptions/resourceGroups/moveResources/action on RG-Release", fr: "Microsoft.Resources/subscriptions/resourceGroups/moveResources/action sur RG-Release" } }
    - { id: d, text: { en: "Microsoft.Resources/subscriptions/resourceGroups/delete on RG-Staging", fr: "Microsoft.Resources/subscriptions/resourceGroups/delete sur RG-Staging" } }
    - { id: e, text: { en: "Microsoft.Authorization/locks/write on RG-Release", fr: "Microsoft.Authorization/locks/write sur RG-Release" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The account that moves resources needs at least the moveResources action on the source resource group and write permission on the destination resource group.
    fr: "Le compte qui déplace des ressources a besoin au minimum de l'action moveResources sur le groupe de ressources source et de l'autorisation d'écriture sur le groupe de ressources de destination."
  options:
    c: { en: "moveResources/action is required on the source, not on the destination.", fr: "moveResources/action est requis sur la source, pas sur la destination." }
    d: { en: "The move does not delete the source resource group.", fr: "Le déplacement ne supprime pas le groupe de ressources source." }
    e: { en: "Azure locks both resource groups itself during the move; operators do not need permission on management locks.", fr: "Azure verrouille lui-même les deux groupes de ressources pendant le déplacement ; les opérateurs n'ont pas besoin d'autorisation sur les verrous de gestion." }
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
