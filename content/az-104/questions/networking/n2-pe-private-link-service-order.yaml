id: n2-pe-private-link-service-order
objective: "4.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts an application on VMs in its virtual network **VNet-App**. Contoso, a partner with its own Microsoft Entra tenant, must reach the application from its virtual network **VNet-Partner** over a private IP address in VNet-Partner. The two virtual networks have overlapping address spaces. Contoso has no permissions on Fabrikam's resources.

    You administer the Fabrikam environment and coordinate with Contoso's administrator. Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam héberge une application sur des machines virtuelles de son réseau virtuel **VNet-App**. Contoso, un partenaire disposant de son propre locataire Microsoft Entra, doit joindre l'application depuis son réseau virtuel **VNet-Partner** via une adresse IP privée de VNet-Partner. Les deux réseaux virtuels ont des espaces d'adressage qui se chevauchent. Contoso n'a aucune autorisation sur les ressources de Fabrikam.

    Vous administrez l'environnement de Fabrikam et vous vous coordonnez avec l'administrateur de Contoso. Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lb, text: { en: "Place the application VMs behind a Standard internal load balancer in VNet-App.", fr: "Placer les machines virtuelles de l'application derrière un équilibreur de charge interne Standard dans VNet-App." } }
    - { id: pls, text: { en: "Create a Private Link service that uses the frontend IP configuration of the load balancer.", fr: "Créer un service Private Link qui utilise la configuration IP frontale de l'équilibreur de charge." } }
    - { id: pe, text: { en: "In VNet-Partner, create a private endpoint that targets the alias of the Private Link service, with the manual approval method.", fr: "Dans VNet-Partner, créer un point de terminaison privé qui cible l'alias du service Private Link, avec la méthode d'approbation manuelle." } }
    - { id: approve, text: { en: "Approve the pending private endpoint connection on the Private Link service.", fr: "Approuver la connexion de point de terminaison privé en attente sur le service Private Link." } }
    - { id: peering, text: { en: "Create a virtual network peering between VNet-App and VNet-Partner.", fr: "Créer un peering de réseaux virtuels entre VNet-App et VNet-Partner." } }
    - { id: se, text: { en: "Enable a service endpoint on the subnet of VNet-Partner.", fr: "Activer un point de terminaison de service sur le sous-réseau de VNet-Partner." } }
answer:
  sequence: [ lb, pls, pe, approve ]
explanation:
  correct:
    en: A Private Link service is created behind a Standard load balancer, which generates an alias that the provider shares with consumers. A consumer without permissions on the service creates the private endpoint with the manual method, so the connection is Pending until the service owner approves it. Only approved connections carry traffic, and overlapping address spaces are not a problem because the consumer uses an IP from its own network.
    fr: "Un service Private Link se crée derrière un équilibreur de charge Standard, ce qui génère un alias que le fournisseur partage avec les consommateurs. Un consommateur sans autorisation sur le service crée le point de terminaison privé avec la méthode manuelle : la connexion reste En attente jusqu'à ce que le propriétaire du service l'approuve. Seules les connexions approuvées acheminent du trafic, et le chevauchement d'adresses ne pose pas de problème, car le consommateur utilise une IP de son propre réseau."
  options:
    peering: { en: Peering is impossible with overlapping address spaces and is not needed with Private Link., fr: "Le peering est impossible avec des espaces d'adressage qui se chevauchent et n'est pas nécessaire avec Private Link." }
    se: { en: "Service endpoints apply to Azure PaaS services, not to a custom application behind a load balancer.", fr: "Les points de terminaison de service s'appliquent aux services PaaS Azure, pas à une application personnalisée derrière un équilibreur de charge." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
