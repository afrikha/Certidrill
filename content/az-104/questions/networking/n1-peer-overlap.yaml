id: n1-peer-overlap
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have the following virtual networks in the same Microsoft Entra tenant:

    | Name | Subscription | Region | Address space |
    | --- | --- | --- | --- |
    | VNetA | Sub1 | West Europe | 10.0.0.0/16 |
    | VNetB | Sub2 | North Europe | 10.0.128.0/17 |

    You try to create a virtual network peering between VNetA and VNetB, and the operation fails.

    What is the cause of the failure?
  fr: |
    Vous disposez des réseaux virtuels suivants dans le même locataire Microsoft Entra :

    | Nom | Abonnement | Région | Espace d'adressage |
    | --- | --- | --- | --- |
    | VNetA | Sub1 | West Europe | 10.0.0.0/16 |
    | VNetB | Sub2 | North Europe | 10.0.128.0/17 |

    Vous essayez de créer un peering de réseaux virtuels entre VNetA et VNetB, et l'opération échoue.

    Quelle est la cause de l'échec ?
body:
  options:
    - { id: a, text: { en: The address spaces of the two virtual networks overlap., fr: Les espaces d'adressage des deux réseaux virtuels se chevauchent. } }
    - { id: b, text: { en: Virtual networks in different regions must be connected by a VPN gateway., fr: Des réseaux virtuels de régions différentes doivent être connectés par une passerelle VPN. } }
    - { id: c, text: { en: Virtual networks in different subscriptions cannot be peered., fr: Des réseaux virtuels d'abonnements différents ne peuvent pas être appairés. } }
    - { id: d, text: { en: A virtual network peering requires a gateway subnet in one of the virtual networks., fr: Un peering de réseaux virtuels nécessite un sous-réseau de passerelle dans l'un des réseaux virtuels. } }
answer: { optionId: a }
explanation:
  correct:
    en: 10.0.128.0/17 is contained in 10.0.0.0/16, so the address spaces overlap. Peered virtual networks must have nonoverlapping address spaces; you must re-address one of them before you can peer them.
    fr: "10.0.128.0/17 est inclus dans 10.0.0.0/16 : les espaces d'adressage se chevauchent. Des réseaux virtuels appairés doivent avoir des espaces d'adressage qui ne se chevauchent pas ; vous devez réadresser l'un d'eux avant de pouvoir les appairer."
  options:
    b: { en: Global virtual network peering connects virtual networks across regions without any gateway., fr: Le peering de réseaux virtuels mondial connecte des réseaux virtuels de régions différentes sans aucune passerelle. }
    c: { en: Peering works across subscriptions, and even across Microsoft Entra tenants., fr: Le peering fonctionne entre abonnements, et même entre locataires Microsoft Entra. }
    d: { en: Peering does not use gateways; a gateway subnet is only needed for a virtual network gateway., fr: Le peering n'utilise pas de passerelle ; un sous-réseau de passerelle n'est nécessaire que pour une passerelle de réseau virtuel. }
references:
  - title: Create, change, or delete an Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
