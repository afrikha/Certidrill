id: n1-pip-cli-create
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a public IPv4 address named **pip-web1** in a resource group named **RG1** in the West Europe region, which has three availability zones. The address must meet the following requirements:

    - use a SKU that is still supported;
    - keep the same IP address for the life of the resource;
    - remain available if any single availability zone fails.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer une adresse IPv4 publique nommée **pip-web1** dans un groupe de ressources nommé **RG1**, dans la région West Europe, qui compte trois zones de disponibilité. L'adresse doit répondre aux exigences suivantes :

    - utiliser une référence SKU toujours prise en charge ;
    - conserver la même adresse IP pendant toute la vie de la ressource ;
    - rester disponible en cas de panne d'une zone de disponibilité quelconque.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network public-ip create \
      --resource-group RG1 \
      --name pip-web1 \
      --location westeurope \
      --sku [[sku]] \
      --allocation-method [[alloc]] \
      --zone [[zone]]
  slots:
    - id: sku
      options:
        - { id: std, text: Standard }
        - { id: basic, text: Basic }
        - { id: prem, text: Premium }
    - id: alloc
      options:
        - { id: static, text: Static }
        - { id: dynamic, text: Dynamic }
    - id: zone
      options:
        - { id: all, text: 1 2 3 }
        - { id: one, text: "1" }
        - { id: two, text: "2" }
answer:
  values: { sku: std, alloc: static, zone: all }
explanation:
  correct:
    en: Basic SKU public IP addresses are retired, and the Standard SKU supports only static allocation, so the address never changes until the resource is deleted. Specifying zones 1, 2 and 3 creates a zone-redundant address that survives the failure of a single zone.
    fr: "Les adresses IP publiques de référence SKU De base sont mises hors service, et la référence SKU Standard ne prend en charge que l'allocation statique : l'adresse ne change jamais jusqu'à la suppression de la ressource. Spécifier les zones 1, 2 et 3 crée une adresse redondante interzone qui survit à la panne d'une zone."
  options:
    basic: { en: "Basic SKU public IP addresses were retired on September 30, 2025.", fr: "Les adresses IP publiques de référence SKU De base ont été mises hors service le 30 septembre 2025." }
    prem: { en: "Premium is not a public IP address SKU; the SKUs are Basic (retired) and Standard (v1 or v2).", fr: "Premium n'est pas une référence SKU d'adresse IP publique ; les références SKU sont De base (mise hors service) et Standard (v1 ou v2)." }
    dynamic: { en: "Standard public IP addresses support only static allocation.", fr: "Les adresses IP publiques Standard ne prennent en charge que l'allocation statique." }
    one: { en: "A single zone creates a zonal address that fails with its zone.", fr: "Une seule zone crée une adresse zonale qui tombe en panne avec sa zone." }
    two: { en: "A single zone creates a zonal address that fails with its zone.", fr: "Une seule zone crée une adresse zonale qui tombe en panne avec sa zone." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
