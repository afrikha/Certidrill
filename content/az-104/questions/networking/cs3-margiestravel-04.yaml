id: cs3-margiestravel-04
objective: "4.3.1"
type: ordering
caseStudy: cs3-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to move the hosting of the margiestravel.com zone to Azure DNS to meet the DNS requirement.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez transférer l'hébergement de la zone margiestravel.com vers Azure DNS pour satisfaire l'exigence DNS.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: zone, text: { en: "Create a public DNS zone named margiestravel.com in Azure DNS.", fr: "Créer une zone DNS publique nommée margiestravel.com dans Azure DNS." } }
    - { id: recs, text: { en: "Create in the Azure DNS zone all the record sets that the current zone contains.", fr: "Créer dans la zone Azure DNS tous les jeux d'enregistrements que contient la zone actuelle." } }
    - { id: ns, text: { en: "At the registrar, replace the name servers of the domain with the four Azure DNS name servers assigned to the zone.", fr: "Chez le bureau d'enregistrement, remplacer les serveurs de noms du domaine par les quatre serveurs de noms Azure DNS attribués à la zone." } }
    - { id: priv, text: { en: "Create a private DNS zone named margiestravel.com and link it to a virtual network.", fr: "Créer une zone DNS privée nommée margiestravel.com et la lier à un réseau virtuel." } }
    - { id: auto, text: { en: "Enable autoregistration for the zone.", fr: "Activer l'inscription automatique pour la zone." } }
    - { id: nswww, text: { en: "Create an NS record set named www in the zone.", fr: "Créer un jeu d'enregistrements NS nommé www dans la zone." } }
answer:
  sequence: [zone, recs, ns]
explanation:
  correct:
    en: "Azure DNS assigns name servers when you create the public zone. You copy the existing records, including the MX record, into the new zone before the delegation so that queries never reach an empty zone. Finally, you delegate the domain by updating its name servers at the registrar."
    fr: "Azure DNS attribue des serveurs de noms quand vous créez la zone publique. Vous recopiez les enregistrements existants, dont l'enregistrement MX, dans la nouvelle zone avant la délégation, afin que les requêtes n'atteignent jamais une zone vide. Enfin, vous déléguez le domaine en mettant à jour ses serveurs de noms chez le bureau d'enregistrement."
  options:
    priv: { en: "A private DNS zone resolves names only inside linked virtual networks, not for internet customers.", fr: "Une zone DNS privée ne résout les noms qu'à l'intérieur des réseaux virtuels liés, pas pour les clients sur Internet." }
    auto: { en: "Autoregistration is a feature of private DNS zones for virtual machines.", fr: "L'inscription automatique est une fonctionnalité des zones DNS privées pour les machines virtuelles." }
    nswww: { en: "An NS record set for www would delegate the subdomain to other name servers; it isn't needed.", fr: "Un jeu d'enregistrements NS pour www déléguerait le sous-domaine à d'autres serveurs de noms ; ce n'est pas nécessaire." }
references:
  - title: "Tutorial: Host your domain in Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
