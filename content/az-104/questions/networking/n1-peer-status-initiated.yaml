id: n1-peer-status-initiated
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two virtual networks named **VNet1** and **VNet2** in the same subscription. Their address spaces do not overlap.

    You run the `Add-AzVirtualNetworkPeering` cmdlet once to create a peering named **VNet1-to-VNet2** on VNet1. The peering status of VNet1-to-VNet2 is **Initiated**, and the virtual machines in the two networks cannot communicate.

    What should you do next?
  fr: |
    Vous disposez de deux réseaux virtuels nommés **VNet1** et **VNet2** dans le même abonnement. Leurs espaces d'adressage ne se chevauchent pas.

    Vous exécutez une fois l'applet de commande `Add-AzVirtualNetworkPeering` pour créer sur VNet1 un peering nommé **VNet1-to-VNet2**. L'état du peering VNet1-to-VNet2 est **Démarré** (Initiated), et les machines virtuelles des deux réseaux ne peuvent pas communiquer.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: Create a peering from VNet2 to VNet1., fr: Créer un peering de VNet2 vers VNet1. } }
    - { id: b, text: { en: Sync the VNet1-to-VNet2 peering., fr: Synchroniser le peering VNet1-to-VNet2. } }
    - { id: c, text: { en: Enable Allow forwarded traffic on the VNet1-to-VNet2 peering., fr: Activer l'autorisation du trafic transféré sur le peering VNet1-to-VNet2. } }
    - { id: d, text: { en: Enable Use remote gateways on the VNet1-to-VNet2 peering., fr: Activer « Utiliser des passerelles distantes » sur le peering VNet1-to-VNet2. } }
answer: { optionId: a }
explanation:
  correct:
    en: With PowerShell or the Azure CLI, a peering must be created on each virtual network. After the first link is created its status is Initiated; when the link from VNet2 to VNet1 is created, both peerings become Connected and traffic can flow. The Azure portal can create both links in one operation.
    fr: "Avec PowerShell ou Azure CLI, un peering doit être créé sur chaque réseau virtuel. Après la création du premier lien, son état est Démarré (Initiated) ; quand le lien de VNet2 vers VNet1 est créé, les deux peerings passent à l'état Connecté et le trafic peut circuler. Le portail Azure peut créer les deux liens en une seule opération."
  options:
    b: { en: Sync is used after the address space of a peered network changes; it does not create the missing link., fr: La synchronisation sert après une modification de l'espace d'adressage d'un réseau appairé ; elle ne crée pas le lien manquant. }
    c: { en: Allow forwarded traffic is for traffic relayed by an NVA; direct traffic still needs both links., fr: L'autorisation du trafic transféré concerne le trafic relayé par une NVA ; le trafic direct nécessite toujours les deux liens. }
    d: { en: Use remote gateways requires a gateway in the remote network and does not complete the peering., fr: « Utiliser des passerelles distantes » nécessite une passerelle dans le réseau distant et ne termine pas le peering. }
references:
  - title: Create, change, or delete an Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
