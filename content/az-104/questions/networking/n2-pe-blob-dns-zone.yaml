id: n2-pe-blob-dns-zone
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a private endpoint in **VNet1** for the **blob** subresource of a storage account named **stwingtip**. VMs in VNet1 use the Azure-provided DNS.

    The VMs must keep using the connection string `https://stwingtip.blob.core.windows.net` and reach the account through the private IP address of the private endpoint.

    Which private DNS zone should you create and link to VNet1?
  fr: |
    Vous créez dans **VNet1** un point de terminaison privé pour la sous-ressource **blob** d'un compte de stockage nommé **stwingtip**. Les machines virtuelles de VNet1 utilisent le DNS fourni par Azure.

    Les machines virtuelles doivent continuer à utiliser la chaîne de connexion `https://stwingtip.blob.core.windows.net` et joindre le compte via l'adresse IP privée du point de terminaison privé.

    Quelle zone DNS privée devez-vous créer et lier à VNet1 ?
body:
  options:
    - { id: a, text: "privatelink.blob.core.windows.net" }
    - { id: b, text: "blob.core.windows.net" }
    - { id: c, text: "privatelink.file.core.windows.net" }
    - { id: d, text: "stwingtip.privatelink.azure.net" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure public DNS returns a CNAME from stwingtip.blob.core.windows.net to stwingtip.privatelink.blob.core.windows.net. A private DNS zone named privatelink.blob.core.windows.net, linked to the virtual network, answers that name with the private endpoint IP, so the connection string does not change.
    fr: "Le DNS public d'Azure renvoie un CNAME de stwingtip.blob.core.windows.net vers stwingtip.privatelink.blob.core.windows.net. Une zone DNS privée nommée privatelink.blob.core.windows.net, liée au réseau virtuel, répond à ce nom avec l'IP du point de terminaison privé : la chaîne de connexion ne change pas."
  options:
    b: { en: Overriding the public zone would break the resolution of every other storage account., fr: Remplacer la zone publique casserait la résolution de tous les autres comptes de stockage. }
    c: { en: This zone is for the file subresource (Azure Files)., fr: Cette zone sert à la sous-ressource file (Azure Files). }
    d: { en: This name is not part of the CNAME chain of Azure Storage., fr: Ce nom ne fait pas partie de la chaîne CNAME de Stockage Azure. }
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
