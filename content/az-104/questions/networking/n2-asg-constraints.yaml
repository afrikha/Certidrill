id: n2-asg-constraints
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two virtual networks in the same region: **VNet1** and **VNet2**. The application security group **ASG-Web** contains the network interfaces of VM1 and VM2, which are both connected to VNet1. The network security group **NSG1** is associated with Subnet1 of VNet1 and contains an inbound rule whose destination is ASG-Web. VM3 is connected to VNet2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de deux réseaux virtuels dans la même région : **VNet1** et **VNet2**. Le groupe de sécurité d'application **ASG-Web** contient les interfaces réseau de VM1 et VM2, toutes deux connectées à VNet1. Le groupe de sécurité réseau **NSG1** est associé à Subnet1 de VNet1 et contient une règle entrante dont la destination est ASG-Web. VM3 est connectée à VNet2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "You can add the network interface of VM3 to ASG-Web.", fr: "Vous pouvez ajouter l'interface réseau de VM3 à ASG-Web." }
    - id: s2
      text: { en: "The network interface of VM1 can also be a member of a second application security group named ASG-Mgmt.", fr: "L'interface réseau de VM1 peut également être membre d'un second groupe de sécurité d'application nommé ASG-Mgmt." }
    - id: s3
      text: { en: "The rule in NSG1 that targets ASG-Web does not apply to a VM in Subnet1 whose network interface is not a member of ASG-Web.", fr: "La règle de NSG1 qui cible ASG-Web ne s'applique pas à une machine virtuelle de Subnet1 dont l'interface réseau n'est pas membre d'ASG-Web." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: All network interfaces in an application security group must be in the same virtual network as the first member, so a NIC from VNet2 cannot join ASG-Web. A NIC can belong to several application security groups, up to the Azure limits. A rule that names an application security group applies only to the NICs that are members of that group, even if the NSG is associated with the whole subnet.
    fr: "Toutes les interfaces réseau d'un groupe de sécurité d'application doivent se trouver dans le même réseau virtuel que le premier membre : une interface de VNet2 ne peut pas rejoindre ASG-Web. Une interface réseau peut appartenir à plusieurs groupes de sécurité d'application, dans la limite des quotas Azure. Une règle qui cite un groupe de sécurité d'application ne s'applique qu'aux interfaces membres de ce groupe, même si le NSG est associé à tout le sous-réseau."
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
