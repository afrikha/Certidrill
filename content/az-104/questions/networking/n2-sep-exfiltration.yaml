id: n2-sep-exfiltration
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a subnet named **Subnet-Analytics** with a **Microsoft.Storage** service endpoint. Data scientists use VMs in this subnet to process data stored in two storage accounts named **stsales** and **stmarketing**, both in the same region as the virtual network.

    The security team wants to prevent data exfiltration: VMs in Subnet-Analytics must not be able to copy data to any other storage account, including storage accounts in the same region that belong to other customers.

    What should you configure?
  fr: |
    Proseware dispose d'un sous-réseau nommé **Subnet-Analytics** doté d'un point de terminaison de service **Microsoft.Storage**. Des data scientists utilisent des machines virtuelles de ce sous-réseau pour traiter des données stockées dans deux comptes de stockage nommés **stsales** et **stmarketing**, situés dans la même région que le réseau virtuel.

    L'équipe de sécurité veut empêcher l'exfiltration de données : les machines virtuelles de Subnet-Analytics ne doivent pouvoir copier des données vers aucun autre compte de stockage, y compris des comptes de la même région appartenant à d'autres clients.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: A service endpoint policy that allows only stsales and stmarketing, associated with Subnet-Analytics, fr: "Une stratégie de point de terminaison de service n'autorisant que stsales et stmarketing, associée à Subnet-Analytics" } }
    - { id: b, text: { en: An NSG outbound rule that allows only the regional Storage service tag of the region, fr: Une règle NSG sortante qui n'autorise que l'étiquette de service Storage régionale de la région } }
    - { id: c, text: { en: Virtual network rules for Subnet-Analytics on the firewalls of stsales and stmarketing, fr: Des règles de réseau virtuel pour Subnet-Analytics dans les pare-feux de stsales et stmarketing } }
    - { id: d, text: { en: A Microsoft.Storage.Global service endpoint on Subnet-Analytics, fr: Un point de terminaison de service Microsoft.Storage.Global sur Subnet-Analytics } }
answer: { optionId: a }
explanation:
  correct:
    en: "Service endpoint policies filter the egress traffic of a subnet to Azure Storage over service endpoints. They are allow lists: once a policy is attached, only the listed storage accounts (or all accounts of a listed resource group or subscription) can be reached, and every other account is denied."
    fr: "Les stratégies de point de terminaison de service filtrent le trafic sortant d'un sous-réseau vers Stockage Azure via les points de terminaison de service. Ce sont des listes d'autorisation : une fois la stratégie attachée, seuls les comptes listés (ou tous les comptes d'un groupe de ressources ou d'un abonnement listé) sont accessibles, et tous les autres sont refusés."
  options:
    b: { en: A service tag allows every storage account in the region, including other customers' accounts., fr: "Une étiquette de service autorise tous les comptes de stockage de la région, y compris ceux d'autres clients." }
    c: { en: Virtual network rules control who can reach stsales and stmarketing; they do not stop the subnet from writing to other accounts., fr: "Les règles de réseau virtuel contrôlent qui peut joindre stsales et stmarketing ; elles n'empêchent pas le sous-réseau d'écrire dans d'autres comptes." }
    d: { en: A cross-region service endpoint changes the scope of the endpoint but does not filter which accounts are reachable., fr: Un point de terminaison de service interrégional change la portée du point de terminaison mais ne filtre pas les comptes accessibles. }
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
