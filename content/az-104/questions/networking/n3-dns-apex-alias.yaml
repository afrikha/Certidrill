id: n3-dns-apex-alias
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank hosts the public DNS zone **woodgrove-app.com** in Azure DNS. A web application is published through a Standard SKU public IP address resource named **pip-web1**.

    You need users to reach the application by browsing to **woodgrove-app.com** (the zone apex). The solution must meet the following requirements:

    - The DNS record must update automatically if the IP address of pip-web1 changes.
    - The record must not keep pointing to an old IP address if pip-web1 is deleted.

    What should you create in the zone?
  fr: |
    Woodgrove Bank héberge la zone DNS publique **woodgrove-app.com** dans Azure DNS. Une application web est publiée par l'intermédiaire d'une ressource d'adresse IP publique de référence SKU Standard nommée **pip-web1**.

    Les utilisateurs doivent atteindre l'application en accédant à **woodgrove-app.com** (l'apex de la zone). La solution doit répondre aux exigences suivantes :

    - L'enregistrement DNS doit être mis à jour automatiquement si l'adresse IP de pip-web1 change.
    - L'enregistrement ne doit pas continuer à pointer vers une ancienne adresse IP si pip-web1 est supprimée.

    Que devez-vous créer dans la zone ?
body:
  options:
    - id: a
      text: { en: "An A record set named @ that is an alias of the pip-web1 resource", fr: "Un jeu d'enregistrements A nommé @ défini comme alias de la ressource pip-web1" }
    - id: b
      text: { en: "A CNAME record set named @ that points to the DNS name label of pip-web1", fr: "Un jeu d'enregistrements CNAME nommé @ qui pointe vers l'étiquette de nom DNS de pip-web1" }
    - id: c
      text: { en: "An A record set named @ that contains the current IP address of pip-web1", fr: "Un jeu d'enregistrements A nommé @ qui contient l'adresse IP actuelle de pip-web1" }
    - id: d
      text: { en: "An NS record set named @ that contains the DNS name label of pip-web1", fr: "Un jeu d'enregistrements NS nommé @ qui contient l'étiquette de nom DNS de pip-web1" }
answer: { optionId: a }
explanation:
  correct:
    en: An alias record set (A, AAAA or CNAME) can reference an Azure resource such as a Standard public IP address. Azure DNS resolves it dynamically, so the record follows IP changes and becomes an empty record set if the resource is deleted, which prevents dangling records. Unlike a CNAME, an alias A record can be created at the zone apex.
    fr: "Un jeu d'enregistrements d'alias (A, AAAA ou CNAME) peut référencer une ressource Azure telle qu'une adresse IP publique Standard. Azure DNS le résout dynamiquement : l'enregistrement suit les changements d'IP et devient un jeu d'enregistrements vide si la ressource est supprimée, ce qui évite les enregistrements orphelins. Contrairement à un CNAME, un enregistrement d'alias A peut être créé à l'apex de la zone."
  options:
    b:
      en: The zone apex already contains the NS and SOA record sets, so a CNAME record set cannot be created there.
      fr: L'apex de la zone contient déjà les jeux d'enregistrements NS et SOA ; un jeu d'enregistrements CNAME ne peut donc pas y être créé.
    c:
      en: A static A record does not change when the IP address changes or the resource is deleted, so it can become a dangling record.
      fr: Un enregistrement A statique ne change pas quand l'adresse IP change ou que la ressource est supprimée ; il peut donc devenir un enregistrement orphelin.
    d:
      en: The apex NS record set lists the zone's name servers; it is used for delegation, not to point a name to a web application.
      fr: Le jeu d'enregistrements NS de l'apex liste les serveurs de noms de la zone ; il sert à la délégation, pas à faire pointer un nom vers une application web.
references:
  - title: Alias records overview - Azure DNS
    url: https://learn.microsoft.com/en-us/azure/dns/dns-alias
