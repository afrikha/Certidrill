id: n2-se-source-ip-switch
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A VM named **VM8** has the public IP address 20.31.40.50 and is connected to **Subnet1** of **VNet1**. The firewall of the storage account **stdata8** allows access only from selected networks, and it contains an IP network rule for 20.31.40.50.

    You enable a **Microsoft.Storage** service endpoint on Subnet1. VM8 can no longer access stdata8.

    You need to restore access from VM8 while keeping the service endpoint. The solution must not allow other networks. What should you do?
  fr: |
    Une machine virtuelle nommée **VM8** possède l'adresse IP publique 20.31.40.50 et est connectée à **Subnet1** de **VNet1**. Le pare-feu du compte de stockage **stdata8** n'autorise l'accès que depuis des réseaux sélectionnés et contient une règle de réseau IP pour 20.31.40.50.

    Vous activez un point de terminaison de service **Microsoft.Storage** sur Subnet1. VM8 ne peut plus accéder à stdata8.

    Vous devez rétablir l'accès depuis VM8 tout en conservant le point de terminaison de service. La solution ne doit pas autoriser d'autres réseaux. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a virtual network rule for VNet1/Subnet1 to the firewall of stdata8.", fr: "Ajouter une règle de réseau virtuel pour VNet1/Subnet1 au pare-feu de stdata8." } }
    - { id: b, text: { en: "Add the private IP address of VM8 to the IP network rules of stdata8.", fr: "Ajouter l'adresse IP privée de VM8 aux règles de réseau IP de stdata8." } }
    - { id: c, text: { en: "Add an outbound NSG rule on Subnet1 that allows the Storage service tag.", fr: "Ajouter sur Subnet1 une règle NSG sortante qui autorise l'étiquette de service Storage." } }
    - { id: d, text: { en: "Set the public network access of stdata8 to Enabled from all networks.", fr: "Définir l'accès réseau public de stdata8 sur Activé à partir de tous les réseaux." } }
answer: { optionId: a }
explanation:
  correct:
    en: With a service endpoint, the traffic from the subnet to the service uses the VM's private IP address as its source instead of the public IP, so existing IP rules based on public addresses stop matching. The service endpoint carries the subnet identity, which you allow with a virtual network rule on the storage account.
    fr: "Avec un point de terminaison de service, le trafic du sous-réseau vers le service utilise l'adresse IP privée de la machine virtuelle comme source au lieu de l'IP publique : les règles IP existantes basées sur des adresses publiques ne correspondent plus. Le point de terminaison de service transporte l'identité du sous-réseau, que vous autorisez par une règle de réseau virtuel sur le compte de stockage."
  options:
    b: { en: IP network rules accept only public IP ranges; private addresses cannot be used., fr: "Les règles de réseau IP n'acceptent que des plages IP publiques ; les adresses privées ne sont pas utilisables." }
    c: { en: The NSG already allows the traffic by default; the storage firewall is what denies it., fr: "Le NSG autorise déjà le trafic par défaut ; c'est le pare-feu du stockage qui le refuse." }
    d: { en: "Allowing all networks would open the account to any network.", fr: "Autoriser tous les réseaux ouvrirait le compte à n'importe quel réseau." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
