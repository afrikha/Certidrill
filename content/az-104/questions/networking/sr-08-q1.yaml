series: sr-08-bastion-rdp
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You deploy a Standard public load balancer with an inbound NAT rule for RDP.
  fr: |
    Vous déployez un équilibreur de charge public Standard avec une règle NAT entrante pour RDP.
body:
  solution:
    en: |
      You deploy a **Standard public load balancer** and create an **inbound NAT rule** for each virtual machine that maps a distinct frontend port to TCP port **3389** of the virtual machine.
    fr: |
      Vous déployez un **équilibreur de charge public Standard** et créez pour chaque machine virtuelle une **règle NAT entrante** qui associe un port frontal distinct au port TCP **3389** de la machine virtuelle.
answer: { value: false }
explanation:
  correct:
    en: |
      The virtual machines don't get public IP addresses, but the NAT rules publish their RDP port on the public frontend of the load balancer, so TCP 3389 of the virtual machines becomes reachable from the internet. Administrators would also need an RDP client instead of only the Azure portal. The goal isn't met.
    fr: |
      Les machines virtuelles ne reçoivent pas d'adresse IP publique, mais les règles NAT publient leur port RDP sur l'adresse frontale publique de l'équilibreur de charge : le port TCP 3389 des machines virtuelles devient accessible depuis Internet. Les administrateurs auraient en outre besoin d'un client RDP au lieu du seul portail Azure. L'objectif n'est pas atteint.
references:
  - title: "What is Azure Bastion?"
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
