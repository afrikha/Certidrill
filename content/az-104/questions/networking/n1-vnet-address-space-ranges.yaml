id: n1-vnet-address-space-ranges
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing the address plan for several new Azure virtual networks.

    Which two address ranges can you NOT add to the address space of a virtual network? Each correct answer presents a complete solution.
  fr: |
    Litware conçoit le plan d'adressage de plusieurs nouveaux réseaux virtuels Azure.

    Quelles sont les deux plages d'adresses que vous ne pouvez PAS ajouter à l'espace d'adressage d'un réseau virtuel ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: 172.20.0.0/16 }
    - { id: b, text: 100.64.10.0/24 }
    - { id: c, text: 127.1.0.0/16 }
    - { id: d, text: 169.254.10.0/24 }
    - { id: e, text: 192.168.50.0/24 }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: Azure blocks some ranges in a virtual network address space, including 127.0.0.0/8 (loopback), 169.254.0.0/16 (link local), 224.0.0.0/4 (multicast), 255.255.255.255/32 (broadcast) and 168.63.129.16/32 (internal DNS). 127.1.0.0/16 and 169.254.10.0/24 fall inside these blocked ranges.
    fr: "Azure interdit certaines plages dans l'espace d'adressage d'un réseau virtuel, notamment 127.0.0.0/8 (bouclage), 169.254.0.0/16 (lien local), 224.0.0.0/4 (multidiffusion), 255.255.255.255/32 (diffusion) et 168.63.129.16/32 (DNS interne). 127.1.0.0/16 et 169.254.10.0/24 se trouvent dans ces plages interdites."
  options:
    a: { en: "172.20.0.0/16 is inside the RFC 1918 range 172.16.0.0/12, which is recommended.", fr: "172.20.0.0/16 fait partie de la plage RFC 1918 172.16.0.0/12, qui est recommandée." }
    b: { en: 100.64.0.0/10 (RFC 6598 shared address space) is treated as private address space by Azure and can be used., fr: 100.64.0.0/10 (espace d'adressage partagé RFC 6598) est traité comme un espace privé par Azure et peut être utilisé. }
    e: { en: 192.168.50.0/24 is inside the RFC 1918 range 192.168.0.0/16., fr: 192.168.50.0/24 fait partie de la plage RFC 1918 192.168.0.0/16. }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
