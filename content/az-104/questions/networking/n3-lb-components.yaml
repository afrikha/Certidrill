id: n3-lb-components
objective: "4.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring a public Standard Load Balancer named **LB-Web** for a set of web servers.

    Which load balancer component should you configure for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez un équilibreur de charge public Standard nommé **LB-Web** pour un ensemble de serveurs web.

    Quel composant de l'équilibreur de charge devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fe, text: { en: "Frontend IP configuration", fr: "Configuration IP frontale" } }
    - { id: pool, text: { en: "Backend pool", fr: "Pool principal" } }
    - { id: probe, text: { en: "Health probe", fr: "Sonde d'intégrité" } }
    - { id: lbrule, text: { en: "Load-balancing rule", fr: "Règle d'équilibrage de charge" } }
    - { id: nat, text: { en: "Inbound NAT rule", fr: "Règle NAT entrante" } }
    - { id: out, text: { en: "Outbound rule", fr: "Règle de trafic sortant" } }
  targets:
    - id: t1
      text: { en: "Define the group of virtual machines that can receive the load-balanced traffic", fr: "Définir le groupe de machines virtuelles qui peuvent recevoir le trafic à charge équilibrée" }
    - id: t2
      text: { en: "Stop sending new connections to a web server whose application no longer responds", fr: "Cesser d'envoyer de nouvelles connexions à un serveur web dont l'application ne répond plus" }
    - id: t3
      text: { en: "Distribute TCP 443 traffic received on the public IP address across the web servers", fr: "Répartir entre les serveurs web le trafic TCP 443 reçu sur l'adresse IP publique" }
    - id: t4
      text: { en: "Forward TCP port 50001 on the public IP address to port 3389 of a single web server", fr: "Rediriger le port TCP 50001 de l'adresse IP publique vers le port 3389 d'un seul serveur web" }
answer:
  mapping: { t1: pool, t2: probe, t3: lbrule, t4: nat }
explanation:
  correct:
    en: The backend pool lists the instances that serve traffic. The health probe marks an unresponsive instance as unhealthy so that it stops receiving new flows. A load-balancing rule maps a frontend IP and port to the backend pool. An inbound NAT rule forwards a frontend port to a specific port of one backend instance.
    fr: Le pool principal liste les instances qui traitent le trafic. La sonde d'intégrité marque une instance qui ne répond pas comme défaillante pour qu'elle ne reçoive plus de nouveaux flux. Une règle d'équilibrage de charge associe une IP frontale et un port au pool principal. Une règle NAT entrante redirige un port frontal vers un port précis d'une seule instance back-end.
  options:
    fe: { en: "The frontend IP configuration only holds the IP address that clients connect to.", fr: "La configuration IP frontale contient seulement l'adresse IP à laquelle les clients se connectent." }
    out: { en: "An outbound rule configures SNAT for traffic leaving the backend pool, not inbound distribution.", fr: "Une règle de trafic sortant configure la SNAT du trafic qui quitte le pool principal, pas la répartition entrante." }
references:
  - title: Azure Load Balancer Components Overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/components
