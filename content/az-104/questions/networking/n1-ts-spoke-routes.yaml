id: n1-ts-spoke-routes
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has three virtual networks: **Hub** (10.0.0.0/16), **Spoke1** (10.1.0.0/16) and **Spoke2** (10.2.0.0/16). Each spoke is peered with Hub. Hub contains no network virtual appliance and no gateway.

    A virtual machine named **VM1** in Spoke1 cannot connect to a virtual machine named **VM2** (10.2.0.4) in Spoke2. The effective routes of the network interface of VM1 are shown in the following table.

    | Source | State | Address prefix | Next hop type |
    | --- | --- | --- | --- |
    | Default | Active | 10.1.0.0/16 | Virtual network |
    | Default | Active | 10.0.0.0/16 | VNet peering |
    | Default | Active | 0.0.0.0/0 | Internet |
    | Default | Active | 10.0.0.0/8 | None |

    You need to restore connectivity between VM1 and VM2. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Proseware dispose de trois réseaux virtuels : **Hub** (10.0.0.0/16), **Spoke1** (10.1.0.0/16) et **Spoke2** (10.2.0.0/16). Chaque spoke est appairé avec Hub. Hub ne contient ni appliance virtuelle réseau ni passerelle.

    Une machine virtuelle nommée **VM1** dans Spoke1 ne parvient pas à se connecter à une machine virtuelle nommée **VM2** (10.2.0.4) dans Spoke2. Les itinéraires effectifs de l'interface réseau de VM1 figurent dans le tableau suivant.

    | Source | État | Préfixe d'adresse | Type de tronçon suivant |
    | --- | --- | --- | --- |
    | Par défaut | Actif | 10.1.0.0/16 | Réseau virtuel |
    | Par défaut | Actif | 10.0.0.0/16 | Peering de réseaux virtuels |
    | Par défaut | Actif | 0.0.0.0/0 | Internet |
    | Par défaut | Actif | 10.0.0.0/8 | Aucun |

    Vous devez rétablir la connectivité entre VM1 et VM2. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Create a virtual network peering between Spoke1 and Spoke2., fr: Créer un peering de réseaux virtuels entre Spoke1 et Spoke2. } }
    - { id: b, text: { en: Enable Allow forwarded traffic on all the peerings., fr: Activer l'autorisation du trafic transféré sur tous les peerings. } }
    - { id: c, text: { en: In Spoke1, add a user-defined route for 10.2.0.0/16 with the next hop type Virtual network peering., fr: "Dans Spoke1, ajouter un itinéraire défini par l'utilisateur pour 10.2.0.0/16 avec le type de tronçon suivant Peering de réseaux virtuels." } }
    - { id: d, text: { en: Enable gateway transit on the peerings of Hub., fr: Activer le transit par passerelle sur les peerings de Hub. } }
answer: { optionId: a }
explanation:
  correct:
    en: The effective routes contain a peering route only for Hub (10.0.0.0/16). Peering is not transitive, so no route exists for Spoke2, and traffic to 10.2.0.4 matches the 10.0.0.0/8 route with next hop None and is dropped. Without an NVA or gateway in Hub, a direct peering between Spoke1 and Spoke2 is the simplest fix; Azure then adds a Virtual network peering route for 10.2.0.0/16.
    fr: "Les itinéraires effectifs ne contiennent une route de peering que pour Hub (10.0.0.0/16). Le peering n'est pas transitif : aucune route n'existe pour Spoke2, et le trafic vers 10.2.0.4 correspond à la route 10.0.0.0/8 avec le tronçon suivant Aucun, il est donc supprimé. Sans NVA ni passerelle dans Hub, un peering direct entre Spoke1 et Spoke2 est la solution la plus simple ; Azure ajoute alors une route Peering de réseaux virtuels pour 10.2.0.0/16."
  options:
    b: { en: Allowing forwarded traffic creates no route and there is no NVA to forward the traffic., fr: "L'autorisation du trafic transféré ne crée aucune route, et il n'existe aucune NVA pour relayer le trafic." }
    c: { en: Virtual network peering cannot be used as the next hop type of a user-defined route., fr: Peering de réseaux virtuels ne peut pas être utilisé comme type de tronçon suivant d'un itinéraire défini par l'utilisateur. }
    d: { en: Gateway transit shares a VPN or ExpressRoute gateway, and Hub has no gateway., fr: Le transit par passerelle partage une passerelle VPN ou ExpressRoute, et Hub n'en possède aucune. }
references:
  - title: Diagnose an Azure virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
