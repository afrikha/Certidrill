id: n1-ts-effective-routes-export
objective: "4.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** is stopped (deallocated). The network team asks you for the list of effective routes of the network interface of VM1 as a .csv file.

    You need to provide the file by using the Azure portal.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une machine virtuelle nommée **VM1** est arrêtée (libérée). L'équipe réseau vous demande la liste des itinéraires effectifs de l'interface réseau de VM1 sous forme de fichier .csv.

    Vous devez fournir le fichier à l'aide du portail Azure.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: start, text: { en: Start VM1., fr: Démarrer VM1. } }
    - { id: open, text: { en: Open the network interface of VM1 and select **Effective routes**., fr: Ouvrir l'interface réseau de VM1 et sélectionner **Itinéraires effectifs**. } }
    - { id: download, text: { en: Select **Download** to save the routes as a .csv file., fr: Sélectionner **Télécharger** pour enregistrer les routes dans un fichier .csv. } }
    - { id: agent, text: { en: Install the Network Watcher Agent extension on VM1., fr: Installer l'extension Network Watcher Agent sur VM1. } }
    - { id: flowlogs, text: { en: Enable virtual network flow logs on the virtual network of VM1., fr: Activer les journaux de flux de réseau virtuel sur le réseau virtuel de VM1. } }
    - { id: ipfv, text: { en: Run IP flow verify for VM1., fr: Exécuter la vérification des flux IP pour VM1. } }
answer:
  sequence: [ start, open, download ]
explanation:
  correct:
    en: Effective routes are returned only for a network interface attached to a running virtual machine, so VM1 must be started first. You then open the network interface and select Effective routes, and you can use the Download option to save the list as a .csv file.
    fr: "Les itinéraires effectifs ne sont renvoyés que pour une interface réseau attachée à une machine virtuelle en cours d'exécution : VM1 doit donc d'abord être démarrée. Vous ouvrez ensuite l'interface réseau et sélectionnez Itinéraires effectifs, puis l'option Télécharger permet d'enregistrer la liste dans un fichier .csv."
  options:
    agent: { en: Viewing effective routes does not require any VM extension., fr: L'affichage des itinéraires effectifs ne nécessite aucune extension de machine virtuelle. }
    flowlogs: { en: Flow logs record traffic; they do not list routes., fr: Les journaux de flux enregistrent le trafic ; ils ne listent pas les routes. }
    ipfv: { en: "IP flow verify evaluates security rules, not routes.", fr: "La vérification des flux IP évalue les règles de sécurité, pas les routes." }
references:
  - title: Diagnose an Azure virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
