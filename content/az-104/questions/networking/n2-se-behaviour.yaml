id: n2-se-behaviour
objective: "4.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware enables a **Microsoft.Sql** service endpoint on **Subnet-DB** of **VNet1**. VNet1 is connected to the on-premises network through a site-to-site VPN. The logical server **sql-litware** is in the same region as VNet1 and has a virtual network rule for Subnet-DB.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.
  fr: |
    Litware active un point de terminaison de service **Microsoft.Sql** sur **Subnet-DB** de **VNet1**. VNet1 est connecté au réseau local par un VPN site à site. Le serveur logique **sql-litware** se trouve dans la même région que VNet1 et possède une règle de réseau virtuel pour Subnet-DB.

    Pour chacune des affirmations suivantes, sélectionnez Oui si elle est vraie. Sinon, sélectionnez Non.
body:
  statements:
    - id: s1
      text: { en: "From a VM in Subnet-DB, the name sql-litware.database.windows.net now resolves to a private IP address of VNet1.", fr: "Depuis une machine virtuelle de Subnet-DB, le nom sql-litware.database.windows.net est désormais résolu en une adresse IP privée de VNet1." }
    - id: s2
      text: { en: On-premises servers can use the service endpoint of Subnet-DB to reach sql-litware through the VPN., fr: Les serveurs locaux peuvent utiliser le point de terminaison de service de Subnet-DB pour joindre sql-litware via le VPN. }
    - id: s3
      text: { en: The service endpoint itself adds no extra charge., fr: Le point de terminaison de service lui-même n'entraîne aucun coût supplémentaire. }
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: With service endpoints, DNS entries do not change and still resolve to the public IP addresses of the service; only the source of the traffic becomes the private address of the subnet. Service endpoints cannot be used by traffic that comes from on-premises; you would allow the on-premises public (NAT) addresses in the service firewall instead. There is no extra charge for service endpoints.
    fr: "Avec les points de terminaison de service, les entrées DNS ne changent pas et continuent d'être résolues vers les adresses IP publiques du service ; seule la source du trafic devient l'adresse privée du sous-réseau. Les points de terminaison de service ne peuvent pas être utilisés par du trafic provenant du réseau local : il faut alors autoriser les adresses publiques (NAT) locales dans le pare-feu du service. Les points de terminaison de service n'entraînent aucun coût supplémentaire."
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
