id: n3-lb-session-persistence
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware publishes a legacy web application on TCP port 443 through a public Standard Load Balancer named **LB1**. The backend pool contains four virtual machines. The application keeps user session state in the memory of each virtual machine.

    Users report that they are signed out randomly, because their browser opens new TCP connections that are sent to different virtual machines.

    You need to ensure that all the connections from the same client IP address are sent to the same virtual machine. The solution must not require changes to the application.

    What should you configure on the load-balancing rule of LB1?
  fr: |
    Proseware publie une application web ancienne sur le port TCP 443 par l'intermédiaire d'un équilibreur de charge public Standard nommé **LB1**. Le pool principal contient quatre machines virtuelles. L'application conserve l'état de session des utilisateurs dans la mémoire de chaque machine virtuelle.

    Des utilisateurs signalent des déconnexions aléatoires, car leur navigateur ouvre de nouvelles connexions TCP qui sont envoyées à des machines virtuelles différentes.

    Vous devez faire en sorte que toutes les connexions provenant de la même adresse IP cliente soient envoyées à la même machine virtuelle. La solution ne doit pas nécessiter de modification de l'application.

    Que devez-vous configurer sur la règle d'équilibrage de charge de LB1 ?
body:
  options:
    - { id: a, text: { en: "Set **Session persistence** to **Client IP**.", fr: "Définir **Persistance de session** sur **Adresse IP du client**." } }
    - { id: b, text: { en: "Set **Session persistence** to **None**.", fr: "Définir **Persistance de session** sur **Aucune**." } }
    - { id: c, text: { en: "Set **Floating IP** to **Enabled**.", fr: "Définir **IP flottante** sur **Activé**." } }
    - { id: d, text: { en: "Increase the **Idle timeout (minutes)** value to 30.", fr: "Augmenter la valeur **Délai d'inactivité (minutes)** à 30." } }
answer: { optionId: a }
explanation:
  correct:
    en: By default, Azure Load Balancer uses a five-tuple hash, so a new connection with a new source port can land on another backend instance. Session persistence set to Client IP uses a two-tuple hash (source and destination IP addresses), so successive connections from the same client IP address go to the same virtual machine.
    fr: "Par défaut, Azure Load Balancer utilise un hachage à cinq tuples : une nouvelle connexion avec un nouveau port source peut aboutir sur une autre instance back-end. La persistance de session définie sur Adresse IP du client utilise un hachage à deux tuples (adresses IP source et de destination), de sorte que les connexions successives d'une même adresse IP cliente sont envoyées à la même machine virtuelle."
  options:
    b: { en: "None is the default five-tuple distribution that causes the problem.", fr: "Aucune correspond à la distribution par défaut à cinq tuples qui cause le problème." }
    c: { en: Floating IP changes the destination IP seen by the backend (direct server return); it does not provide client affinity., fr: "L'IP flottante modifie l'adresse IP de destination vue par le back-end (retour direct du serveur) ; elle n'apporte pas d'affinité cliente." }
    d: { en: The idle timeout only keeps idle flows open longer; new connections are still distributed with the five-tuple hash., fr: "Le délai d'inactivité garde seulement les flux inactifs ouverts plus longtemps ; les nouvelles connexions restent réparties avec le hachage à cinq tuples." }
references:
  - title: Azure Load Balancer distribution modes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
