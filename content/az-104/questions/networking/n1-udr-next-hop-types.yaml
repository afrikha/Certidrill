id: n1-udr-next-hop-types
objective: "4.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are adding user-defined routes to a route table named **RT1**. RT1 is associated with a subnet of a virtual network named **VNet1** (10.0.0.0/16). VNet1 contains a firewall virtual machine at 10.0.1.4 and a VPN gateway with a site-to-site connection.

    Which next hop type should you use for each route? To answer, drag the appropriate next hop types to the correct routes. Each next hop type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez des itinéraires définis par l'utilisateur à une table de routage nommée **RT1**. RT1 est associée à un sous-réseau d'un réseau virtuel nommé **VNet1** (10.0.0.0/16). VNet1 contient une machine virtuelle pare-feu en 10.0.1.4 et une passerelle VPN disposant d'une connexion site à site.

    Quel type de tronçon suivant devez-vous utiliser pour chaque route ? Pour répondre, faites glisser les types de tronçon suivant appropriés vers les routes correspondantes. Chaque type de tronçon suivant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: none, text: { en: "None", fr: "Aucun (None)" } }
    - { id: va, text: { en: "Virtual appliance", fr: "Appliance virtuelle (Virtual appliance)" } }
    - { id: vng, text: { en: "Virtual network gateway", fr: "Passerelle de réseau virtuel (Virtual network gateway)" } }
    - { id: vnet, text: { en: "Virtual network", fr: "Réseau virtuel (Virtual network)" } }
    - { id: inet, text: Internet }
    - { id: peer, text: { en: "Virtual network peering", fr: "Peering de réseaux virtuels (Virtual network peering)" } }
  targets:
    - id: t1
      text: { en: "Drop all the traffic sent to 10.50.0.0/16.", fr: "Supprimer tout le trafic envoyé vers 10.50.0.0/16." }
    - id: t2
      text: { en: "Send the traffic for 0.0.0.0/0 to the firewall at 10.0.1.4.", fr: "Envoyer le trafic pour 0.0.0.0/0 vers le pare-feu en 10.0.1.4." }
    - id: t3
      text: { en: "Send the traffic for 192.168.0.0/16 to the on-premises network through the VPN gateway.", fr: "Envoyer le trafic pour 192.168.0.0/16 vers le réseau local via la passerelle VPN." }
    - id: t4
      text: { en: "Keep the traffic for 10.0.5.0/24 inside VNet1 even though another route sends 10.0.0.0/16 to the firewall.", fr: "Garder dans VNet1 le trafic pour 10.0.5.0/24 même si une autre route envoie 10.0.0.0/16 vers le pare-feu." }
answer:
  mapping: { t1: none, t2: va, t3: vng, t4: vnet }
explanation:
  correct:
    en: None drops the traffic. Virtual appliance sends traffic to a private IP address such as an NVA or firewall. Virtual network gateway sends traffic to the VPN gateway of the virtual network. Virtual network overrides a broader route so that traffic for a prefix stays within the virtual network.
    fr: "Aucun supprime le trafic. Appliance virtuelle envoie le trafic vers une adresse IP privée, comme une NVA ou un pare-feu. Passerelle de réseau virtuel envoie le trafic vers la passerelle VPN du réseau virtuel. Réseau virtuel remplace une route plus large pour que le trafic d'un préfixe reste dans le réseau virtuel."
  options:
    peer: { en: Virtual network peering cannot be specified in a user-defined route; Azure creates these routes when you configure a peering., fr: "Peering de réseaux virtuels ne peut pas être indiqué dans un itinéraire défini par l'utilisateur ; Azure crée ces routes quand vous configurez un peering." }
    inet: { en: "Internet sends traffic to the internet, which matches none of the requirements.", fr: "Internet envoie le trafic vers Internet, ce qui ne correspond à aucune exigence." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
