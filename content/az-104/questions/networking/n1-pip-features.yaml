id: n1-pip-features
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are creating Standard SKU public IP addresses for several workloads in Azure.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des adresses IP publiques de référence SKU Standard pour plusieurs charges de travail Azure.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dns, text: { en: "DNS name label", fr: "Étiquette de nom de domaine" } }
    - { id: global, text: { en: "Global tier", fr: "Niveau global" } }
    - { id: rp, text: { en: "Routing preference: Internet", fr: "Préférence de routage : Internet" } }
    - { id: zr, text: { en: "Zone-redundant", fr: "Redondance interzone" } }
    - { id: prefix, text: { en: "Public IP address prefix", fr: "Préfixe d'adresse IP publique" } }
    - { id: regional, text: { en: "Regional tier", fr: "Niveau régional" } }
  targets:
    - id: t1
      text: { en: "The address must resolve from the name webapp1.westeurope.cloudapp.azure.com.", fr: "L'adresse doit être résolue à partir du nom webapp1.westeurope.cloudapp.azure.com." }
    - id: t2
      text: { en: "The address must be an anycast frontend for a cross-region load balancer.", fr: "L'adresse doit être un front-end anycast pour un équilibreur de charge inter-régions." }
    - id: t3
      text: { en: "Traffic must spend as little time as possible on the Microsoft network to lower egress data transfer cost.", fr: "Le trafic doit passer le moins de temps possible sur le réseau Microsoft pour réduire le coût de transfert de données sortantes." }
    - id: t4
      text: { en: "The address must survive the failure of a single availability zone.", fr: "L'adresse doit survivre à la panne d'une seule zone de disponibilité." }
answer:
  mapping: { t1: dns, t2: global, t3: rp, t4: zr }
explanation:
  correct:
    en: A DNS name label maps label.region.cloudapp.azure.com to the address. The Global tier creates a global anycast IP used by cross-region load balancers. Routing preference Internet hands traffic to the internet as close to the Azure region as possible, which lowers egress cost. A zone-redundant address is created in several zones and survives a single zone failure.
    fr: "Une étiquette de nom de domaine associe étiquette.région.cloudapp.azure.com à l'adresse. Le niveau global crée une adresse IP anycast globale utilisée par les équilibreurs de charge inter-régions. La préférence de routage Internet remet le trafic à Internet au plus près de la région Azure, ce qui réduit le coût sortant. Une adresse redondante interzone est créée dans plusieurs zones et survit à la panne d'une zone."
  options:
    prefix: { en: "A prefix reserves a contiguous range; it does not meet any of these requirements by itself.", fr: "Un préfixe réserve une plage contiguë ; il ne répond à aucune de ces exigences à lui seul." }
    regional: { en: "The Regional tier is the default and cannot be used by a cross-region load balancer frontend.", fr: "Le niveau régional est la valeur par défaut et ne peut pas servir de front-end à un équilibreur de charge inter-régions." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
