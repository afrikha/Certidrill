id: n1-pip-zones
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to create Standard SKU public IPv4 addresses in the West Europe region, which has three availability zones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer des adresses IPv4 publiques de référence SKU Standard dans la région West Europe, qui compte trois zones de disponibilité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create a public IP address that is zonal in zone 2.
        fr: Vous pouvez créer une adresse IP publique zonale dans la zone 2.
    - id: s2
      text:
        en: After you create a zonal public IP address in zone 2, you can change it to zone-redundant.
        fr: Après avoir créé une adresse IP publique zonale dans la zone 2, vous pouvez la rendre redondante interzone.
    - id: s3
      text:
        en: A zone-redundant public IP address keeps working if a single availability zone fails.
        fr: Une adresse IP publique redondante interzone continue de fonctionner si une seule zone de disponibilité tombe en panne.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: In regions with availability zones, a Standard public IP can be zonal (tied to one zone and sharing its fate) or zone-redundant (created in several zones and able to survive the failure of any single zone). Once created, a public IP address cannot change its availability zone; you must create a new address.
    fr: "Dans les régions dotées de zones de disponibilité, une adresse IP publique Standard peut être zonale (liée à une zone dont elle partage le sort) ou redondante interzone (créée dans plusieurs zones et capable de survivre à la panne d'une zone). Une fois créée, une adresse IP publique ne peut pas modifier sa zone de disponibilité ; il faut créer une nouvelle adresse."
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
