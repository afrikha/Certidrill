id: cs1-adatum-04
objective: "4.2.2"
type: hotarea
caseStudy: cs1-adatum
difficulty: 3
status: draft
stem:
  en: |
    The following table shows all the inbound security rules that apply to NSG-Db, including the default rules.

    Answer each prompt by selecting the rule that processes the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le tableau suivant présente toutes les règles de sécurité entrantes qui s'appliquent à NSG-Db, y compris les règles par défaut.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "TCP 1433 from VM-MGMT1 to VM-SQL1", fr: "TCP 1433 depuis VM-MGMT1 vers VM-SQL1" }
    - id: p2
      text: { en: "TCP 3389 from VM-LEDGER1 to VM-SQL2", fr: "TCP 3389 depuis VM-LEDGER1 vers VM-SQL2" }
  grid:
    header: [{ en: Priority, fr: Priorité }, { en: Name, fr: Nom }, Source, Destination, Port, Action]
    rows:
      - [{ text: "100" }, { text: Allow-SQL-App, area: r100 }, { text: ASG-App }, { text: ASG-Db }, { text: "1433" }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-SQL-VNet, area: r200 }, { text: VirtualNetwork }, { text: Any }, { text: "1433" }, { text: Deny }]
      - [{ text: "300" }, { text: Allow-RDP-Mgmt, area: r300 }, { text: 10.40.1.10 }, { text: ASG-Db }, { text: "3389" }, { text: Allow }]
      - [{ text: "4000" }, { text: Deny-VNet-Inbound, area: r4000 }, { text: VirtualNetwork }, { text: Any }, { text: Any }, { text: Deny }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: AzureLoadBalancer }, { text: Any }, { text: Any }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r200, p2: r4000 }
explanation:
  correct:
    en: |
      NSG rules are processed by priority, lowest number first, and processing stops at the first match. VM-MGMT1 is not in ASG-App, so its SQL traffic skips rule 100 and matches Deny-SQL-VNet (200). VM-LEDGER1 (10.40.1.20) does not match the source of Allow-RDP-Mgmt (10.40.1.10), so its RDP traffic matches Deny-VNet-Inbound (4000) before the default AllowVnetInBound rule.
    fr: |
      Les règles NSG sont traitées par priorité, du plus petit numéro au plus grand, et le traitement s'arrête à la première correspondance. VM-MGMT1 n'appartient pas à ASG-App ; son trafic SQL ne correspond pas à la règle 100 et correspond à Deny-SQL-VNet (200). VM-LEDGER1 (10.40.1.20) ne correspond pas à la source de Allow-RDP-Mgmt (10.40.1.10) ; son trafic RDP correspond donc à Deny-VNet-Inbound (4000), avant la règle par défaut AllowVnetInBound.
  options:
    r100: { en: "Rule 100 only matches traffic whose source network interface is a member of ASG-App.", fr: "La règle 100 ne correspond qu'au trafic dont l'interface réseau source est membre de ASG-App." }
    r65000: { en: "Default rules are evaluated last; the custom rule 4000 matches first.", fr: "Les règles par défaut sont évaluées en dernier ; la règle personnalisée 4000 correspond avant." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - title: Azure application security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
