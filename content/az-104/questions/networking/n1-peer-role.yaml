id: n1-peer-role
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a resource group named **RG-Network** that contains several virtual networks.

    A user named **Admin1** must create, change, and delete virtual network peerings between the virtual networks in RG-Network. The solution must follow the principle of least privilege.

    Which built-in role should you assign to Admin1 on RG-Network?
  fr: |
    Vous disposez d'un groupe de ressources nommé **RG-Network** qui contient plusieurs réseaux virtuels.

    Un utilisateur nommé **Admin1** doit créer, modifier et supprimer des peerings entre les réseaux virtuels de RG-Network. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer à Admin1 sur RG-Network ?
body:
  options:
    - { id: a, text: Network Contributor }
    - { id: b, text: Contributor }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: Reader }
answer: { optionId: a }
explanation:
  correct:
    en: Network Contributor lets a user manage networks, including the virtualNetworkPeerings read, write and delete actions, without granting rights on other resource types. It is the role documented for working with virtual network peerings.
    fr: Network Contributor permet de gérer les réseaux, y compris les actions read, write et delete de virtualNetworkPeerings, sans accorder de droits sur les autres types de ressources. C'est le rôle documenté pour gérer les peerings de réseaux virtuels.
  options:
    b: { en: "Contributor would work but grants rights on every resource type in the group, which is more than required.", fr: "Contributor fonctionnerait, mais accorde des droits sur tous les types de ressources du groupe, ce qui dépasse le besoin." }
    c: { en: Virtual Machine Contributor manages VMs but not the virtual networks they connect to., fr: "Virtual Machine Contributor gère les machines virtuelles, mais pas les réseaux virtuels auxquels elles sont connectées." }
    d: { en: "Reader can only view the peerings.", fr: "Reader peut seulement consulter les peerings." }
references:
  - title: Create, Change, or Delete Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
