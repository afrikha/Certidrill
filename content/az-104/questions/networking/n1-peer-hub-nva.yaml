id: n1-peer-hub-nva
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has the following virtual networks in the same region:

    | Name | Address space | Peered with |
    | --- | --- | --- |
    | Hub-VNet | 10.0.0.0/16 | Spoke1, Spoke2 |
    | Spoke1 | 10.1.0.0/16 | Hub-VNet |
    | Spoke2 | 10.2.0.0/16 | Hub-VNet |

    Hub-VNet contains a network virtual appliance named **NVA1** with the private IP address 10.0.1.4. IP forwarding is enabled on the network interface and in the operating system of NVA1. The peerings use the default settings. There is no virtual network gateway.

    You need the virtual machines in Spoke1 and Spoke2 to communicate with each other. All the traffic between the spokes must be inspected by NVA1.

    Which two actions should you perform? Each correct answer presents part of the solution.
  fr: |
    Adatum dispose des réseaux virtuels suivants dans la même région :

    | Nom | Espace d'adressage | Appairé avec |
    | --- | --- | --- |
    | Hub-VNet | 10.0.0.0/16 | Spoke1, Spoke2 |
    | Spoke1 | 10.1.0.0/16 | Hub-VNet |
    | Spoke2 | 10.2.0.0/16 | Hub-VNet |

    Hub-VNet contient une appliance virtuelle réseau nommée **NVA1** d'adresse IP privée 10.0.1.4. Le transfert IP est activé sur l'interface réseau et dans le système d'exploitation de NVA1. Les peerings utilisent les paramètres par défaut. Il n'existe aucune passerelle de réseau virtuel.

    Les machines virtuelles de Spoke1 et de Spoke2 doivent communiquer entre elles. Tout le trafic entre les spokes doit être inspecté par NVA1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In Spoke1 and Spoke2, associate route tables that send the other spoke's address space to the next hop type Virtual appliance with the address 10.0.1.4.", fr: "Dans Spoke1 et Spoke2, associer des tables de routage qui envoient l'espace d'adressage de l'autre spoke vers le type de tronçon suivant Appliance virtuelle avec l'adresse 10.0.1.4." } }
    - { id: b, text: { en: On the peerings between the hub and the spokes, enable the setting that allows forwarded traffic., fr: Sur les peerings entre le hub et les spokes, activer le paramètre qui autorise le trafic transféré. } }
    - { id: c, text: { en: Create a virtual network peering between Spoke1 and Spoke2., fr: Créer un peering de réseaux virtuels entre Spoke1 et Spoke2. } }
    - { id: d, text: { en: On the peerings of Hub-VNet, enable gateway transit., fr: Sur les peerings de Hub-VNet, activer le transit par passerelle. } }
    - { id: e, text: { en: On the peerings of Spoke1 and Spoke2, enable Use remote gateways., fr: Sur les peerings de Spoke1 et Spoke2, activer « Utiliser des passerelles distantes ». } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Peering is not transitive, so the spokes have no route to each other. User-defined routes in each spoke send the other spoke's prefix to NVA1 (next hop type Virtual appliance). Because the packets that NVA1 relays originate outside the network that sends them over the peering, the peerings must allow forwarded traffic; enabling this setting does not create any route by itself, which is why both actions are needed.
    fr: "Le peering n'est pas transitif : les spokes n'ont aucune route l'un vers l'autre. Des itinéraires définis par l'utilisateur dans chaque spoke envoient le préfixe de l'autre spoke vers NVA1 (type de tronçon suivant Appliance virtuelle). Comme les paquets relayés par NVA1 proviennent d'un autre réseau que celui qui les envoie sur le peering, les peerings doivent autoriser le trafic transféré ; ce paramètre ne crée lui-même aucune route, d'où la nécessité des deux actions."
  options:
    c: { en: A direct spoke-to-spoke peering would let traffic bypass NVA1., fr: Un peering direct entre spokes permettrait au trafic de contourner NVA1. }
    d: { en: Gateway transit shares a VPN or ExpressRoute gateway; there is no gateway in Hub-VNet., fr: Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; Hub-VNet ne contient aucune passerelle. }
    e: { en: Use remote gateways requires a gateway in the hub and gateway transit on the hub side., fr: « Utiliser des passerelles distantes » nécessite une passerelle dans le hub et le transit par passerelle côté hub. }
references:
  - title: Create, change, or delete an Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
