id: n1-ts-next-hop-none
objective: "4.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A virtual machine named **VM1** in a subnet named **Subnet1** has a Standard public IP address. The network security groups allow all outbound traffic. A route table named **RT1** is associated with Subnet1 and contains the following routes:

    | Name | Address prefix | Next hop type | Next hop IP address |
    | --- | --- | --- | --- |
    | Block-All | 0.0.0.0/0 | None | - |
    | To-OnPrem | 192.168.0.0/16 | Virtual appliance | 10.0.9.4 |

    VM1 cannot reach any website on the internet. Network Watcher next hop for a public destination returns the next hop type **None** and the route table **RT1**.

    You need VM1 to reach the internet directly. Traffic from Subnet1 to 192.168.0.0/16 must still go through the appliance at 10.0.9.4.

    Which two actions can you perform? Each correct answer presents a complete solution.
  fr: |
    Une machine virtuelle nommée **VM1**, dans un sous-réseau nommé **Subnet1**, possède une adresse IP publique Standard. Les groupes de sécurité réseau autorisent tout le trafic sortant. Une table de routage nommée **RT1** est associée à Subnet1 et contient les routes suivantes :

    | Nom | Préfixe d'adresse | Type de tronçon suivant | Adresse IP du tronçon suivant |
    | --- | --- | --- | --- |
    | Block-All | 0.0.0.0/0 | Aucun | - |
    | To-OnPrem | 192.168.0.0/16 | Appliance virtuelle | 10.0.9.4 |

    VM1 ne peut joindre aucun site web sur Internet. Le tronçon suivant de Network Watcher pour une destination publique renvoie le type de tronçon suivant **Aucun** et la table de routage **RT1**.

    VM1 doit joindre Internet directement. Le trafic de Subnet1 vers 192.168.0.0/16 doit toujours passer par l'appliance en 10.0.9.4.

    Quelles sont les deux actions possibles ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: Change the next hop type of the Block-All route to Internet., fr: Remplacer le type de tronçon suivant de la route Block-All par Internet. } }
    - { id: b, text: { en: Delete the Block-All route from RT1., fr: Supprimer la route Block-All de RT1. } }
    - { id: c, text: { en: Dissociate RT1 from Subnet1., fr: Dissocier RT1 de Subnet1. } }
    - { id: d, text: { en: Add an outbound NSG rule that allows the Internet service tag., fr: Ajouter une règle NSG sortante qui autorise l'étiquette de service Internet. } }
    - { id: e, text: { en: Enable IP forwarding on the network interface of VM1., fr: Activer le transfert IP sur l'interface réseau de VM1. } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Next hop shows that the user-defined route Block-All (0.0.0.0/0, next hop None) drops the traffic, because it overrides the system default route to the internet. Changing its next hop type to Internet sends the traffic to the internet, and deleting it lets the system route 0.0.0.0/0 with next hop Internet apply again. In both cases To-OnPrem stays in place.
    fr: "Le tronçon suivant montre que l'itinéraire défini par l'utilisateur Block-All (0.0.0.0/0, tronçon suivant Aucun) supprime le trafic, car il remplace la route système par défaut vers Internet. Remplacer son type de tronçon suivant par Internet envoie le trafic vers Internet, et le supprimer permet à la route système 0.0.0.0/0 de tronçon suivant Internet de s'appliquer à nouveau. Dans les deux cas, To-OnPrem est conservée."
  options:
    c: { en: "Dissociating RT1 also removes the To-OnPrem route, so on-premises traffic would bypass the appliance.", fr: Dissocier RT1 retire aussi la route To-OnPrem ; le trafic vers le réseau local contournerait l'appliance. }
    d: { en: "The NSGs already allow the traffic; the packets are dropped by routing, not by a security rule.", fr: "Les NSG autorisent déjà le trafic ; les paquets sont supprimés par le routage, pas par une règle de sécurité." }
    e: { en: IP forwarding is needed only on an appliance that relays traffic for other machines., fr: Le transfert IP n'est nécessaire que sur une appliance qui relaie le trafic d'autres machines. }
references:
  - title: Next hop overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview
  - title: Virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
