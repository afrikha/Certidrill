id: cs3-coho-02
objective: "4.1.4"
type: dropdown
caseStudy: cs3-coho
difficulty: 3
status: draft
stem:
  en: |
    You create a route table named rt-erp to meet the requirement for the traffic from snet-erp to the Rioja winery.

    How should you configure the route and the route table? To answer, select the appropriate options in the answer area.
  fr: |
    Vous créez une table de routage nommée rt-erp pour satisfaire l'exigence relative au trafic de snet-erp vers le domaine de Rioja.

    Comment devez-vous configurer l'itinéraire et la table de routage ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Address prefix: [[prefix]]
      Next hop type: [[hop]]
      Next hop address: [[addr]]
      Associate rt-erp with: [[subnet]]
    fr: |
      Préfixe d'adresse : [[prefix]]
      Type de tronçon suivant : [[hop]]
      Adresse du tronçon suivant : [[addr]]
      Associer rt-erp à : [[subnet]]
  slots:
    - id: prefix
      options:
        - { id: p0, text: "0.0.0.0/0" }
        - { id: p20, text: "192.168.0.0/20" }
        - { id: p22, text: "192.168.16.0/22" }
        - { id: pfw, text: "10.60.1.0/24" }
    - id: hop
      options:
        - { id: va, text: { en: "Virtual appliance", fr: "Appliance virtuelle" } }
        - { id: vng, text: { en: "Virtual network gateway", fr: "Passerelle de réseau virtuel" } }
        - { id: vnet, text: { en: "Virtual network", fr: "Réseau virtuel" } }
        - { id: none, text: { en: "None", fr: "Aucun" } }
    - id: addr
      options:
        - { id: fw, text: "10.60.1.4" }
        - { id: gw, text: "10.60.255.4" }
        - { id: empty, text: { en: "(no address)", fr: "(aucune adresse)" } }
    - id: subnet
      options:
        - { id: erp, text: snet-erp }
        - { id: fwsub, text: snet-fw }
        - { id: gwsub, text: GatewaySubnet }
answer:
  values: { prefix: p22, hop: va, addr: fw, subnet: erp }
explanation:
  correct:
    en: "The route targets the Rioja range 192.168.16.0/22. The next hop type Virtual appliance with the address 10.60.1.4 sends the traffic to FW1. A route table only affects traffic that leaves the subnets it is associated with, so rt-erp must be associated with snet-erp. For the same prefix, a user-defined route takes precedence over the route learned from the VPN gateway."
    fr: "L'itinéraire cible la plage de Rioja 192.168.16.0/22. Le type de tronçon suivant Appliance virtuelle avec l'adresse 10.60.1.4 envoie le trafic vers FW1. Une table de routage n'affecte que le trafic qui quitte les sous-réseaux auxquels elle est associée : rt-erp doit donc être associée à snet-erp. Pour un même préfixe, un itinéraire défini par l'utilisateur est prioritaire sur l'itinéraire appris de la passerelle VPN."
  options:
    prefix: { en: "0.0.0.0/0 would also send internet traffic to FW1, and 192.168.0.0/20 is the Bordeaux range.", fr: "0.0.0.0/0 enverrait aussi le trafic Internet vers FW1, et 192.168.0.0/20 est la plage de Bordeaux." }
    hop: { en: "Virtual network gateway would send the traffic straight to the VPN gateway and bypass FW1, Virtual network keeps it inside VNet-Hub, and None drops it.", fr: "Passerelle de réseau virtuel enverrait le trafic directement à la passerelle VPN sans passer par FW1, Réseau virtuel le maintient dans VNet-Hub, et Aucun le supprime." }
    subnet: { en: "Associating the table with snet-fw would loop the firewall's own traffic, and GatewaySubnet already has rt-gateway for the return traffic.", fr: "Associer la table à snet-fw ferait boucler le trafic du pare-feu lui-même, et GatewaySubnet dispose déjà de rt-gateway pour le trafic retour." }
references:
  - title: "Virtual network traffic routing"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
