id: n1-ts-ip-flow-verify
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual machine named **VM1** cannot connect to a virtual machine named **VM2** on TCP port 1433. Both virtual machines are in the same virtual network, and Network Watcher is enabled in the region.

    You need to quickly determine whether a network security group rule denies this traffic and, if so, which rule.

    Which Network Watcher feature should you use?
  fr: |
    Une machine virtuelle nommée **VM1** ne parvient pas à se connecter à une machine virtuelle nommée **VM2** sur le port TCP 1433. Les deux machines virtuelles se trouvent dans le même réseau virtuel, et Network Watcher est activé dans la région.

    Vous devez déterminer rapidement si une règle de groupe de sécurité réseau refuse ce trafic et, le cas échéant, laquelle.

    Quelle fonctionnalité de Network Watcher devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: IP flow verify, fr: Vérification des flux IP } }
    - { id: b, text: { en: Next hop, fr: Tronçon suivant } }
    - { id: c, text: { en: Packet capture, fr: Capture de paquets } }
    - { id: d, text: { en: Topology, fr: Topologie } }
answer: { optionId: a }
explanation:
  correct:
    en: IP flow verify tests a flow defined by direction, protocol, local and remote IP addresses and ports against the security rules applied to the virtual machine's network interface. It returns Access allowed or Access denied and the name of the rule that made the decision.
    fr: La vérification des flux IP teste un flux défini par la direction, le protocole, les adresses IP et ports locaux et distants, par rapport aux règles de sécurité appliquées à l'interface réseau de la machine virtuelle. Elle renvoie « Accès autorisé » ou « Accès refusé » et le nom de la règle qui a pris la décision.
  options:
    b: { en: "Next hop shows how traffic is routed, not whether a security rule blocks it.", fr: "Le tronçon suivant indique comment le trafic est routé, pas si une règle de sécurité le bloque." }
    c: { en: Packet capture records traffic for analysis; it does not name the NSG rule that denies a flow., fr: La capture de paquets enregistre le trafic pour analyse ; elle n'indique pas la règle NSG qui refuse un flux. }
    d: { en: "Topology displays the resources of a network and their relationships, not rule evaluation.", fr: "La topologie affiche les ressources d'un réseau et leurs relations, pas l'évaluation des règles." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
