id: n2-asg-web-db-rule
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual network named **VNet1** that contains a subnet named **Apps**. The Apps subnet hosts web server VMs and database server VMs. The network security group **NSG1** is associated with the Apps subnet.

    You need to allow only the web servers to connect to the database servers on TCP 1433. New web and database VMs will be added every week, and their IP addresses are assigned dynamically.

    The solution must minimize administrative effort when VMs are added. What should you use as the source and destination of the rule in NSG1?
  fr: |
    Vous disposez d'un réseau virtuel Azure nommé **VNet1** qui contient un sous-réseau nommé **Apps**. Le sous-réseau Apps héberge des machines virtuelles de serveurs web et de serveurs de bases de données. Le groupe de sécurité réseau **NSG1** est associé au sous-réseau Apps.

    Vous devez autoriser uniquement les serveurs web à se connecter aux serveurs de bases de données sur le port TCP 1433. De nouvelles machines virtuelles web et de bases de données seront ajoutées chaque semaine, et leurs adresses IP sont attribuées dynamiquement.

    La solution doit réduire au minimum l'effort d'administration lors de l'ajout de machines virtuelles. Que devez-vous utiliser comme source et comme destination de la règle dans NSG1 ?
body:
  options:
    - { id: a, text: { en: "Two application security groups, one for the web servers and one for the database servers", fr: "Deux groupes de sécurité d'application, l'un pour les serveurs web et l'autre pour les serveurs de bases de données" } }
    - { id: b, text: { en: "The VirtualNetwork service tag as the source and the database server IP addresses as the destination", fr: "L'étiquette de service VirtualNetwork comme source et les adresses IP des serveurs de bases de données comme destination" } }
    - { id: c, text: { en: "The private IP addresses of each web server and each database server", fr: "Les adresses IP privées de chaque serveur web et de chaque serveur de bases de données" } }
    - { id: d, text: { en: "The address prefix of the Apps subnet as both the source and the destination", fr: "Le préfixe d'adresse du sous-réseau Apps comme source et comme destination" } }
answer: { optionId: a }
explanation:
  correct:
    en: Application security groups let you group network interfaces by role and use the groups as the source and destination of security rules. When a new VM is added, you only make its network interface a member of the right group; the rule itself never changes and no IP address has to be maintained.
    fr: "Les groupes de sécurité d'application permettent de regrouper les interfaces réseau par rôle et d'utiliser ces groupes comme source et destination des règles de sécurité. Lorsqu'une nouvelle machine virtuelle est ajoutée, il suffit de rendre son interface réseau membre du bon groupe : la règle ne change pas et aucune adresse IP n'est à maintenir."
  options:
    b: { en: "VirtualNetwork includes every address of the virtual network, so all VMs (not only web servers) would be allowed, and listing database IPs requires manual updates.", fr: "VirtualNetwork inclut toutes les adresses du réseau virtuel : toutes les machines (pas seulement les serveurs web) seraient autorisées, et la liste des IP de bases de données doit être tenue à jour manuellement." }
    c: { en: Explicit IP addresses must be edited every time a VM is added or its dynamic address changes., fr: Les adresses IP explicites doivent être modifiées à chaque ajout de machine virtuelle ou changement d'adresse dynamique. }
    d: { en: Both tiers share the subnet, so the subnet prefix cannot distinguish web servers from database servers., fr: "Les deux niveaux partagent le sous-réseau : le préfixe du sous-réseau ne permet pas de distinguer les serveurs web des serveurs de bases de données." }
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
