id: n2-bastion-shareable-link
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Bastion host named **Bastion1** that uses the Standard SKU in **VNet1**. A VM named **VM7** is connected to VNet1 and has no public IP address.

    An external auditor must connect to VM7 over RDP from a web browser for two weeks. The auditor has no account in your Microsoft Entra tenant and must not get access to the Azure portal. You will give the auditor the local credentials of VM7.

    What should you do?
  fr: |
    Fabrikam dispose d'un hôte Azure Bastion nommé **Bastion1** qui utilise la référence SKU Standard dans **VNet1**. Une machine virtuelle nommée **VM7** est connectée à VNet1 et n'a pas d'adresse IP publique.

    Un auditeur externe doit se connecter à VM7 en RDP depuis un navigateur web pendant deux semaines. L'auditeur n'a aucun compte dans votre locataire Microsoft Entra et ne doit pas accéder au portail Azure. Vous lui fournirez les informations d'identification locales de VM7.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Shareable Link feature on Bastion1, create a link for VM7 with an expiration date, and send the link to the auditor.", fr: "Activer la fonctionnalité Shareable Link sur Bastion1, créer pour VM7 un lien avec une date d'expiration et envoyer le lien à l'auditeur." } }
    - { id: b, text: { en: "Invite the auditor as a guest user and assign the Reader role on VM7, its network interface and Bastion1.", fr: "Inviter l'auditeur comme utilisateur invité et lui attribuer le rôle Reader sur VM7, son interface réseau et Bastion1." } }
    - { id: c, text: { en: Enable IP-based connection on Bastion1 and send the private IP address of VM7 to the auditor., fr: Activer la connexion basée sur IP sur Bastion1 et envoyer l'adresse IP privée de VM7 à l'auditeur. } }
    - { id: d, text: { en: Enable Native Client Support on Bastion1 and ask the auditor to run az network bastion rdp., fr: Activer Native Client Support sur Bastion1 et demander à l'auditeur d'exécuter az network bastion rdp. } }
answer: { optionId: a }
explanation:
  correct:
    en: A Bastion shareable link opens a web page where a user without Azure credentials signs in to the target VM over RDP or SSH. The link contains no credentials, you can set an expiration date, and the feature requires the Standard SKU or higher.
    fr: "Un lien partageable Bastion ouvre une page web où un utilisateur sans informations d'identification Azure se connecte à la machine virtuelle cible en RDP ou SSH. Le lien ne contient aucune information d'identification, vous pouvez définir une date d'expiration, et la fonctionnalité exige la référence SKU Standard ou supérieure."
  options:
    b: { en: A guest account would be an account in the tenant and would give the auditor access to the Azure portal., fr: "Un compte invité serait un compte du locataire et donnerait à l'auditeur l'accès au portail Azure." }
    c: { en: An IP-based connection is still started from the Azure portal or the Azure CLI by a signed-in user., fr: "Une connexion basée sur IP est toujours lancée depuis le portail Azure ou Azure CLI par un utilisateur connecté." }
    d: { en: The native client requires the user to sign in to Azure with the Azure CLI., fr: Le client natif exige que l'utilisateur se connecte à Azure avec Azure CLI. }
references:
  - title: Create a shareable link for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/shareable-link
