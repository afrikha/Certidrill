id: sr-07-q3
objective: "4.1.2"
type: series_yesno
series: sr-07-spoke-to-spoke
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You route spoke-to-spoke traffic through a network virtual appliance in VNetHub.
  fr: |
    Vous faites transiter le trafic entre les spokes par une appliance virtuelle réseau dans VNetHub.
body:
  solution:
    en: |
      You deploy a network virtual appliance (NVA) with the private IP address **10.0.1.4** in VNetHub. You enable **IP forwarding** on its network interface and configure its operating system to route traffic. You then:

      - associate a route table with the subnets of VNet1 that contains a route for **10.2.0.0/16** with the next hop type **Virtual appliance** and the address 10.0.1.4;
      - associate a route table with the subnets of VNet2 that contains a route for **10.1.0.0/16** with the next hop type **Virtual appliance** and the address 10.0.1.4;
      - allow forwarded traffic on the four peering links.
    fr: |
      Vous déployez une appliance virtuelle réseau (NVA) avec l'adresse IP privée **10.0.1.4** dans VNetHub. Vous activez le **transfert IP** sur son interface réseau et configurez son système d'exploitation pour router le trafic. Ensuite :

      - vous associez aux sous-réseaux de VNet1 une table de routage qui contient un itinéraire pour **10.2.0.0/16** avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.0.1.4 ;
      - vous associez aux sous-réseaux de VNet2 une table de routage qui contient un itinéraire pour **10.1.0.0/16** avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.0.1.4 ;
      - vous autorisez le trafic transféré sur les quatre liens de peering.
answer: { value: true }
explanation:
  correct:
    en: |
      This is service chaining in a hub-and-spoke topology: peering allows a user-defined route to use a virtual machine in the peered virtual network as its next hop. Each spoke sends the traffic for the other spoke to the NVA, which forwards it, and the peerings accept the forwarded packets. The virtual machines of VNet1 and VNet2 can communicate, so the goal is met.
    fr: |
      Il s'agit du chaînage de services dans une topologie hub-and-spoke : le peering permet à un itinéraire défini par l'utilisateur d'utiliser comme tronçon suivant une machine virtuelle du réseau virtuel appairé. Chaque spoke envoie le trafic destiné à l'autre spoke vers la NVA, qui le transfère, et les peerings acceptent les paquets transférés. Les machines virtuelles de VNet1 et de VNet2 peuvent communiquer : l'objectif est atteint.
references:
