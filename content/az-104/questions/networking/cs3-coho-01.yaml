id: cs3-coho-01
objective: "4.1.1"
type: single
caseStudy: cs3-coho
difficulty: 2
status: draft
stem:
  en: |
    You need to choose the address space of VNet-Analytics to meet the network requirements.

    Which address space should you use?
  fr: |
    Vous devez choisir l'espace d'adressage de VNet-Analytics pour satisfaire les exigences réseau.

    Quel espace d'adressage devez-vous utiliser ?
body:
  options:
    - { id: a, text: "192.168.0.0/16" }
    - { id: b, text: "10.62.0.0/16" }
    - { id: c, text: "10.64.0.0/16" }
    - { id: d, text: "172.16.0.0/16" }
answer: { optionId: c }
explanation:
  correct:
    en: "Peered virtual networks and the on-premises networks reached through the gateway must not have overlapping address ranges. 10.64.0.0/16 doesn't overlap with VNet-Hub (10.60.0.0/16), Bordeaux (192.168.0.0/20 and 10.61.0.0/16), Rioja (192.168.16.0/22), Napa (172.16.40.0/22) or the planned Mendoza range (10.62.0.0/16)."
    fr: "Des réseaux virtuels appairés et les réseaux locaux joints via la passerelle ne doivent pas avoir de plages d'adresses qui se chevauchent. 10.64.0.0/16 ne chevauche ni VNet-Hub (10.60.0.0/16), ni Bordeaux (192.168.0.0/20 et 10.61.0.0/16), ni Rioja (192.168.16.0/22), ni Napa (172.16.40.0/22), ni la plage prévue de Mendoza (10.62.0.0/16)."
  options:
    a: { en: "192.168.0.0/16 contains the Bordeaux range 192.168.0.0/20 and the Rioja range 192.168.16.0/22.", fr: "192.168.0.0/16 contient la plage de Bordeaux 192.168.0.0/20 et la plage de Rioja 192.168.16.0/22." }
    b: { en: "10.62.0.0/16 is reserved for the planned Mendoza winery.", fr: "10.62.0.0/16 est réservée au futur domaine de Mendoza." }
    d: { en: "172.16.0.0/16 contains the Napa range 172.16.40.0/22.", fr: "172.16.0.0/16 contient la plage de Napa 172.16.40.0/22." }
references:
  - title: "Plan virtual networks"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm
  - title: "Create, change, or delete a virtual network peering"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
