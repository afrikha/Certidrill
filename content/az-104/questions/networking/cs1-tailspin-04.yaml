id: cs1-tailspin-04
objective: "4.3.2"
type: dropdown
caseStudy: cs1-tailspin
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the player traffic requirement for VMSS-Match.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative au trafic des joueurs pour VMSS-Match.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy [[lb]] with VMSS-Match in the backend pool.
      Create one load-balancing rule for UDP 7777 and one for TCP 7778, and set the session persistence of both rules to [[persist]].
    fr: |
      Déployez [[lb]] avec VMSS-Match dans le pool principal.
      Créez une règle d'équilibrage de charge pour UDP 7777 et une pour TCP 7778, et définissez la persistance de session des deux règles sur [[persist]].
  slots:
    - id: lb
      options:
        - { id: publb, text: { en: "a Standard public load balancer", fr: "un équilibreur de charge public Standard" } }
        - { id: intlb, text: { en: "a Standard internal load balancer", fr: "un équilibreur de charge interne Standard" } }
        - { id: appgw, text: { en: "an Azure Application Gateway (Standard_v2)", fr: "une instance Azure Application Gateway (Standard_v2)" } }
    - id: persist
      options:
        - { id: none, text: { en: None, fr: Aucune } }
        - { id: clientip, text: { en: Client IP, fr: IP du client } }
        - { id: clientipproto, text: { en: Client IP and protocol, fr: IP et protocole du client } }
answer:
  values: { lb: publb, persist: clientip }
explanation:
  correct:
    en: |
      The traffic comes from the internet and uses UDP and TCP, so it needs a layer 4 public load balancer; the instances have no public IP addresses. Client IP session persistence uses a two-tuple hash (source IP, destination IP), so the TCP and UDP flows of a player go to the same instance. Client IP and protocol includes the protocol in the hash, so the two flows could reach different instances.
    fr: |
      Le trafic vient d'Internet et utilise UDP et TCP ; il faut donc un équilibreur de charge public de couche 4, les instances n'ayant pas d'adresse IP publique. La persistance de session IP du client utilise un hachage à deux éléments (IP source, IP de destination) ; les flux TCP et UDP d'un joueur vont donc vers la même instance. IP et protocole du client inclut le protocole dans le hachage : les deux flux pourraient alors atteindre des instances différentes.
  options:
    intlb: { en: "An internal load balancer has only a private frontend and cannot receive traffic from the internet.", fr: "Un équilibreur de charge interne n'a qu'un front-end privé et ne peut pas recevoir de trafic depuis Internet." }
    appgw: { en: "Application Gateway is a layer 7 HTTP(S) load balancer and does not balance UDP traffic.", fr: "Application Gateway est un équilibreur de charge HTTP(S) de couche 7 et ne répartit pas le trafic UDP." }
    none: { en: "With no persistence, the five-tuple hash can send each flow of the same player to a different instance.", fr: "Sans persistance, le hachage à cinq éléments peut envoyer chaque flux d'un même joueur vers une instance différente." }
    clientipproto: { en: "The three-tuple hash includes the protocol, so TCP and UDP flows from the same player are hashed separately.", fr: "Le hachage à trois éléments inclut le protocole ; les flux TCP et UDP d'un même joueur sont donc hachés séparément." }
references:
  - title: Azure Load Balancer distribution modes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
  - title: What is Azure Load Balancer?
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
