id: n3-dns-private-registration
objective: "4.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two virtual networks named **VNet-App** and **VNet-Data**. The virtual networks are not peered and use the default Azure-provided DNS.

    VNet-App is linked to a private DNS zone named **legacy.adatum.internal**, and autoregistration is enabled on that link. legacy.adatum.internal also contains A records that were created manually for on-premises servers.

    You create a new private DNS zone named **corp.adatum.internal**. You need to meet the following requirements:

    - The A records of the virtual machines in both virtual networks must be created and removed automatically in corp.adatum.internal.
    - The virtual machines in each virtual network must be able to resolve the names of the virtual machines in the other virtual network by using corp.adatum.internal.
    - The virtual machines in VNet-App must still be able to resolve the manually created records of legacy.adatum.internal.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de deux réseaux virtuels nommés **VNet-App** et **VNet-Data**. Les réseaux virtuels ne sont pas appairés et utilisent le DNS fourni par Azure par défaut.

    VNet-App est lié à une zone DNS privée nommée **legacy.adatum.internal**, et l'inscription automatique est activée sur ce lien. legacy.adatum.internal contient aussi des enregistrements A créés manuellement pour des serveurs locaux.

    Vous créez une nouvelle zone DNS privée nommée **corp.adatum.internal**. Vous devez répondre aux exigences suivantes :

    - Les enregistrements A des machines virtuelles des deux réseaux virtuels doivent être créés et supprimés automatiquement dans corp.adatum.internal.
    - Les machines virtuelles de chaque réseau virtuel doivent pouvoir résoudre les noms des machines virtuelles de l'autre réseau virtuel à l'aide de corp.adatum.internal.
    - Les machines virtuelles de VNet-App doivent toujours pouvoir résoudre les enregistrements créés manuellement dans legacy.adatum.internal.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Disable autoregistration on the link between VNet-App and legacy.adatum.internal.", fr: "Désactiver l'inscription automatique sur le lien entre VNet-App et legacy.adatum.internal." } }
    - { id: b, text: { en: "Link VNet-App to corp.adatum.internal with autoregistration enabled.", fr: "Lier VNet-App à corp.adatum.internal avec l'inscription automatique activée." } }
    - { id: c, text: { en: "Link VNet-Data to corp.adatum.internal with autoregistration enabled.", fr: "Lier VNet-Data à corp.adatum.internal avec l'inscription automatique activée." } }
    - { id: d, text: { en: "Delete the link between VNet-App and legacy.adatum.internal.", fr: "Supprimer le lien entre VNet-App et legacy.adatum.internal." } }
    - { id: e, text: { en: "Peer VNet-App and VNet-Data.", fr: "Appairer VNet-App et VNet-Data." } }
    - { id: f, text: { en: "In legacy.adatum.internal, create an NS record set named **corp** that delegates to corp.adatum.internal.", fr: "Dans legacy.adatum.internal, créer un jeu d'enregistrements NS nommé **corp** qui délègue à corp.adatum.internal." } }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: A virtual network can be a registration network for only one private zone, so autoregistration must first be turned off on the VNet-App link to legacy.adatum.internal; the link itself stays as a resolution link, so the manually created records remain resolvable. Then both virtual networks are linked to corp.adatum.internal with autoregistration, which both registers their VMs and lets each network resolve all records of the zone.
    fr: "Un réseau virtuel ne peut être réseau d'inscription que pour une seule zone privée : il faut donc d'abord désactiver l'inscription automatique sur le lien de VNet-App vers legacy.adatum.internal ; le lien est conservé comme lien de résolution, donc les enregistrements créés manuellement restent résolubles. Les deux réseaux virtuels sont ensuite liés à corp.adatum.internal avec l'inscription automatique, ce qui inscrit leurs machines virtuelles et permet à chaque réseau de résoudre tous les enregistrements de la zone."
  options:
    d:
      en: Deleting the link would stop VNet-App from resolving the records of legacy.adatum.internal, which breaks the third requirement.
      fr: Supprimer le lien empêcherait VNet-App de résoudre les enregistrements de legacy.adatum.internal, ce qui contredit la troisième exigence.
    e:
      en: Resolution across virtual networks linked to the same private zone does not depend on peering.
      fr: La résolution entre réseaux virtuels liés à la même zone privée ne dépend pas du peering.
    f:
      en: Delegation with NS records is not how private zones are shared; virtual network links provide resolution.
      fr: Les zones privées ne se partagent pas par délégation avec des enregistrements NS ; ce sont les liens de réseau virtuel qui assurent la résolution.
references:
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: What is a virtual network link subresource of Azure DNS private zones
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
