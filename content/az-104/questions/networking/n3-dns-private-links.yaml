id: n3-dns-private-links
objective: "4.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has two virtual networks named **VNet1** and **VNet2** in the same subscription. The virtual networks are not peered.

    You create a private DNS zone named **corp.northwind.internal** and configure the following virtual network links:

    | Link | Virtual network | Autoregistration |
    | --- | --- | --- |
    | Link1 | VNet1 | Enabled |
    | Link2 | VNet2 | Disabled |

    VNet1 contains a virtual machine named **VM1** and an internal Standard Load Balancer named **ILB1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de deux réseaux virtuels nommés **VNet1** et **VNet2** dans le même abonnement. Les réseaux virtuels ne sont pas appairés.

    Vous créez une zone DNS privée nommée **corp.northwind.internal** et vous configurez les liens de réseau virtuel suivants :

    | Lien | Réseau virtuel | Inscription automatique |
    | --- | --- | --- |
    | Link1 | VNet1 | Activée |
    | Link2 | VNet2 | Désactivée |

    VNet1 contient une machine virtuelle nommée **VM1** et un équilibreur de charge interne Standard nommé **ILB1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine in VNet2 can resolve the A record of VM1 in the private zone.
        fr: Une machine virtuelle de VNet2 peut résoudre l'enregistrement A de VM1 dans la zone privée.
    - id: s2
      text:
        en: An A record for the frontend IP address of ILB1 is created automatically in the private zone.
        fr: Un enregistrement A pour l'adresse IP frontale d'ILB1 est créé automatiquement dans la zone privée.
    - id: s3
      text:
        en: You can link VNet1 to a second private DNS zone with autoregistration enabled while Link1 keeps autoregistration enabled.
        fr: Vous pouvez lier VNet1 à une deuxième zone DNS privée avec l'inscription automatique activée tout en conservant l'inscription automatique activée sur Link1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Every virtual network linked to a private zone can resolve all its records, including those autoregistered from other linked networks; peering is not required for name resolution. Autoregistration creates records only for virtual machines (primary NIC), so records for resources such as an internal load balancer must be created manually. A virtual network can have only one registration zone, so a second link with autoregistration from VNet1 is not allowed.
    fr: "Chaque réseau virtuel lié à une zone privée peut résoudre tous ses enregistrements, y compris ceux inscrits automatiquement depuis d'autres réseaux liés ; le peering n'est pas nécessaire pour la résolution de noms. L'inscription automatique ne crée des enregistrements que pour les machines virtuelles (carte réseau principale) : les enregistrements de ressources comme un équilibreur de charge interne doivent être créés manuellement. Un réseau virtuel ne peut avoir qu'une seule zone d'inscription ; un deuxième lien avec inscription automatique depuis VNet1 n'est donc pas autorisé."
references:
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: "Azure Private DNS: Secure DNS for Virtual Networks"
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
