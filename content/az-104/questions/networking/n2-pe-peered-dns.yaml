id: n2-pe-peered-dns
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has two peered virtual networks, **VNet-Hub** and **VNet-Spoke1**, which both use the Azure-provided DNS. A private endpoint for the Key Vault **kv-woodgrove** is deployed in VNet-Hub, with a record in the private DNS zone **privatelink.vaultcore.azure.net**. The zone is linked only to VNet-Hub. Public network access to kv-woodgrove is disabled.

    VMs in VNet-Hub can access kv-woodgrove. VMs in VNet-Spoke1 resolve `kv-woodgrove.vault.azure.net` to a public IP address and are denied.

    You need to allow the VMs in VNet-Spoke1 to access kv-woodgrove through the existing private endpoint. The solution must minimize administrative effort. What should you do?
  fr: |
    Woodgrove dispose de deux réseaux virtuels appairés, **VNet-Hub** et **VNet-Spoke1**, qui utilisent tous deux le DNS fourni par Azure. Un point de terminaison privé pour le coffre Key Vault **kv-woodgrove** est déployé dans VNet-Hub, avec un enregistrement dans la zone DNS privée **privatelink.vaultcore.azure.net**. La zone n'est liée qu'à VNet-Hub. L'accès réseau public à kv-woodgrove est désactivé.

    Les machines virtuelles de VNet-Hub peuvent accéder à kv-woodgrove. Celles de VNet-Spoke1 résolvent `kv-woodgrove.vault.azure.net` en une adresse IP publique et sont refusées.

    Vous devez permettre aux machines virtuelles de VNet-Spoke1 d'accéder à kv-woodgrove via le point de terminaison privé existant. La solution doit réduire au minimum l'effort d'administration. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Add a virtual network link for VNet-Spoke1 to the privatelink.vaultcore.azure.net zone., fr: Ajouter à la zone privatelink.vaultcore.azure.net un lien de réseau virtuel pour VNet-Spoke1. } }
    - { id: b, text: { en: Create a second private endpoint for kv-woodgrove in VNet-Spoke1., fr: Créer un second point de terminaison privé pour kv-woodgrove dans VNet-Spoke1. } }
    - { id: c, text: { en: Enable autoregistration on the existing virtual network link of VNet-Hub., fr: Activer l'inscription automatique sur le lien de réseau virtuel existant de VNet-Hub. } }
    - { id: d, text: { en: Enable a Microsoft.KeyVault service endpoint on the subnets of VNet-Spoke1., fr: Activer un point de terminaison de service Microsoft.KeyVault sur les sous-réseaux de VNet-Spoke1. } }
answer: { optionId: a }
explanation:
  correct:
    en: A private endpoint is reachable from peered virtual networks, so only name resolution is missing. A virtual network can resolve the records of a private DNS zone only if it is linked to the zone; linking VNet-Spoke1 makes the CNAME chain end on the private endpoint IP.
    fr: "Un point de terminaison privé est joignable depuis les réseaux virtuels appairés : seule la résolution de noms manque. Un réseau virtuel ne peut résoudre les enregistrements d'une zone DNS privée que s'il est lié à cette zone ; lier VNet-Spoke1 fait aboutir la chaîne CNAME sur l'IP du point de terminaison privé."
  options:
    b: { en: A second endpoint is not needed over peering and adds DNS records to manage; Microsoft recommends a single endpoint per resource with common DNS., fr: "Un second point de terminaison n'est pas nécessaire avec le peering et ajoute des enregistrements DNS à gérer ; Microsoft recommande un seul point de terminaison par ressource avec un DNS commun." }
    c: { en: Autoregistration creates records for VMs; it does not let another virtual network query the zone., fr: "L'inscription automatique crée des enregistrements pour les machines virtuelles ; elle ne permet pas à un autre réseau virtuel d'interroger la zone." }
    d: { en: "A service endpoint uses the public endpoint, which is disabled on kv-woodgrove.", fr: "Un point de terminaison de service utilise le point de terminaison public, qui est désactivé sur kv-woodgrove." }
references:
  - title: "Azure Private DNS: Secure DNS for Virtual Networks"
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
