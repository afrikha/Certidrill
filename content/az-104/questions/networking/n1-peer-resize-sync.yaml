id: n1-peer-resize-sync
objective: "4.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have two virtual networks named **VNet1** (10.4.0.0/16) and **VNet2** (10.6.0.0/16) that are peered.

    You need to add the address range 10.5.0.0/16 to VNet1 so that virtual machines in VNet2 can later reach resources deployed in the new range. The solution must not interrupt the traffic that currently flows over the peering.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux réseaux virtuels appairés nommés **VNet1** (10.4.0.0/16) et **VNet2** (10.6.0.0/16).

    Vous devez ajouter la plage d'adresses 10.5.0.0/16 à VNet1 pour que les machines virtuelles de VNet2 puissent ensuite joindre les ressources déployées dans la nouvelle plage. La solution ne doit pas interrompre le trafic qui circule actuellement sur le peering.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: add, text: { en: "On VNet1, add 10.5.0.0/16 under Address space and save.", fr: "Sur VNet1, ajouter 10.5.0.0/16 sous Espace d'adressage et enregistrer." } }
    - { id: sync, text: { en: "On VNet1, under Peerings, select the peering to VNet2 and select **Sync**.", fr: "Sur VNet1, sous Peerings, sélectionner le peering vers VNet2 et sélectionner **Synchroniser**." } }
    - { id: verify, text: { en: "On VNet2, verify that the address space of the peered network now includes 10.5.0.0/16.", fr: "Sur VNet2, vérifier que l'espace d'adressage du réseau appairé inclut désormais 10.5.0.0/16." } }
    - { id: delete, text: { en: Delete the peering between VNet1 and VNet2., fr: Supprimer le peering entre VNet1 et VNet2. } }
    - { id: recreate, text: { en: Re-create the peering between VNet1 and VNet2., fr: Recréer le peering entre VNet1 et VNet2. } }
    - { id: fwd, text: { en: Enable Allow forwarded traffic on both peerings., fr: Activer l'autorisation du trafic transféré sur les deux peerings. } }
answer:
  sequence: [ add, sync, verify ]
explanation:
  correct:
    en: You can resize the address space of peered virtual networks without downtime. After you add the range to VNet1, you sync the peering so that the remote peer learns the new address space, then you check on the peered network that the update is visible. Deleting and re-creating the peering would interrupt traffic and is no longer required.
    fr: "Vous pouvez redimensionner l'espace d'adressage de réseaux virtuels appairés sans interruption. Après avoir ajouté la plage à VNet1, vous synchronisez le peering pour que le pair distant prenne en compte le nouvel espace d'adressage, puis vous vérifiez sur le réseau appairé que la mise à jour est visible. Supprimer et recréer le peering interromprait le trafic et n'est plus nécessaire."
  options:
    delete: { en: "Deleting the peering interrupts existing traffic, which violates the requirement.", fr: "Supprimer le peering interrompt le trafic existant, ce qui enfreint l'exigence." }
    fwd: { en: Forwarded traffic is unrelated to address space changes., fr: Le trafic transféré n'a aucun rapport avec les modifications d'espace d'adressage. }
references:
  - title: Update the address space for a peered virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/update-virtual-network-peering-address-space
