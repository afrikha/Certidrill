id: sr-07-q4
objective: "4.1.2"
type: series_yesno
series: sr-07-spoke-to-spoke
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You enable gateway transit on the peerings of VNetHub.
  fr: |
    Vous activez le transit par passerelle sur les peerings de VNetHub.
body:
  solution:
    en: |
      On the peering links from VNetHub to VNet1 and from VNetHub to VNet2, you enable the option that allows VNet1 and VNet2 to use the **gateway** of VNetHub (gateway transit).
    fr: |
      Sur les liens de peering de VNetHub vers VNet1 et de VNetHub vers VNet2, vous activez l'option qui permet à VNet1 et à VNet2 d'utiliser la **passerelle** de VNetHub (transit par passerelle).
answer: { value: false }
explanation:
  correct:
    en: |
      Gateway transit lets peered virtual networks use a VPN gateway or ExpressRoute gateway deployed in the hub. VNetHub contains no gateway, so there is nothing to share, and the option doesn't make peering transitive between VNet1 and VNet2. The goal isn't met.
    fr: |
      Le transit par passerelle permet aux réseaux virtuels appairés d'utiliser une passerelle VPN ou ExpressRoute déployée dans le hub. VNetHub ne contient aucune passerelle : il n'y a rien à partager, et l'option ne rend pas le peering transitif entre VNet1 et VNet2. L'objectif n'est pas atteint.
references:
  - title: "Azure Virtual Network Peering"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
