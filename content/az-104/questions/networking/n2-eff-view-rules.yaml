id: n2-eff-view-rules
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A running VM named **VM3** has a network interface associated with an NSG, and its subnet is associated with another NSG. Users report that they cannot connect to an application on VM3.

    You need to display, in one place, the list of all the security rules from both NSGs that apply to the network interface of VM3, including the default rules.

    What should you use?
  fr: |
    Une machine virtuelle en cours d'exécution nommée **VM3** possède une interface réseau associée à un NSG, et son sous-réseau est associé à un autre NSG. Des utilisateurs signalent qu'ils ne peuvent pas se connecter à une application de VM3.

    Vous devez afficher, en un seul endroit, la liste de toutes les règles de sécurité des deux NSG qui s'appliquent à l'interface réseau de VM3, y compris les règles par défaut.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: Effective security rules of the network interface, fr: Les règles de sécurité effectives de l'interface réseau } }
    - { id: b, text: { en: Effective routes of the network interface, fr: Les itinéraires effectifs de l'interface réseau } }
    - { id: c, text: { en: Network Watcher next hop, fr: Le tronçon suivant de Network Watcher } }
    - { id: d, text: { en: The activity log of each NSG, fr: Le journal d'activité de chaque NSG } }
answer: { optionId: a }
explanation:
  correct:
    en: The effective security rules of a network interface aggregate the rules of the NSG associated with the NIC and of the NSG associated with its subnet, including default rules and the prefixes behind service tags. The VM must be running to display them. You can also use Get-AzEffectiveNetworkSecurityGroup or az network nic list-effective-nsg.
    fr: "Les règles de sécurité effectives d'une interface réseau regroupent les règles du NSG associé à l'interface et du NSG associé à son sous-réseau, y compris les règles par défaut et les préfixes derrière les étiquettes de service. La machine virtuelle doit être en cours d'exécution pour les afficher. Vous pouvez aussi utiliser Get-AzEffectiveNetworkSecurityGroup ou az network nic list-effective-nsg."
  options:
    b: { en: Effective routes show the routing table applied to the NIC, not security rules., fr: "Les itinéraires effectifs montrent la table de routage appliquée à l'interface, pas les règles de sécurité." }
    c: { en: Next hop identifies the next hop type for a destination; it does not list NSG rules., fr: "Le tronçon suivant identifie le type de tronçon pour une destination ; il ne liste pas les règles NSG." }
    d: { en: The activity log records management operations on the NSG, not the rules that apply to the traffic., fr: "Le journal d'activité enregistre les opérations de gestion sur le NSG, pas les règles qui s'appliquent au trafic." }
references:
  - title: Diagnose a virtual machine network traffic filter problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-traffic-filter-problem
