id: n1-udr-nva-forwarding
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet1** contains a subnet named **Workload** and a subnet named **NVA**. A Linux virtual machine named **NVA1** in the NVA subnet acts as a router and has the private IP address 10.0.2.4.

    A route table associated with Workload contains a route for 10.20.0.0/16 with the next hop type Virtual appliance and the address 10.0.2.4. The effective routes of the workload virtual machines show this route as active, but traffic from Workload to 10.20.0.0/16 never reaches its destination. No IP forwarding setting has been configured.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet1** contient un sous-réseau nommé **Workload** et un sous-réseau nommé **NVA**. Une machine virtuelle Linux nommée **NVA1**, dans le sous-réseau NVA, joue le rôle de routeur et possède l'adresse IP privée 10.0.2.4.

    Une table de routage associée à Workload contient une route pour 10.20.0.0/16 avec le type de tronçon suivant Appliance virtuelle et l'adresse 10.0.2.4. Les itinéraires effectifs des machines virtuelles de Workload indiquent que cette route est active, mais le trafic de Workload vers 10.20.0.0/16 n'atteint jamais sa destination. Aucun paramètre de transfert IP n'a été configuré.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable IP forwarding on the network interface of NVA1 in Azure.", fr: "Activer le transfert IP sur l'interface réseau de NVA1 dans Azure." } }
    - { id: b, text: { en: "Enable IP forwarding in the operating system of NVA1.", fr: "Activer le transfert IP dans le système d'exploitation de NVA1." } }
    - { id: c, text: { en: "Associate the route table with the NVA subnet as well.", fr: "Associer également la table de routage au sous-réseau NVA." } }
    - { id: d, text: { en: "Set Propagate gateway routes to No on the route table.", fr: "Définir « Propager les itinéraires de passerelle » sur Non dans la table de routage." } }
    - { id: e, text: { en: "Assign a Standard public IP address to NVA1.", fr: "Attribuer une adresse IP publique Standard à NVA1." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: A network interface that forwards traffic not addressed to its own IP must have the Azure Enable IP forwarding setting turned on; otherwise Azure drops those packets. The operating system of the appliance must also forward packets between interfaces (for Linux, kernel IP forwarding).
    fr: "Une interface réseau qui transfère du trafic non destiné à sa propre adresse IP doit avoir le paramètre Azure « Activer le transfert IP » activé ; sinon Azure supprime ces paquets. Le système d'exploitation de l'appliance doit aussi transférer les paquets entre interfaces (pour Linux, le transfert IP du noyau)."
  options:
    c: { en: "Applying the route table to the appliance's own subnet can create a routing loop.", fr: "Appliquer la table de routage au sous-réseau de l'appliance elle-même peut créer une boucle de routage." }
    d: { en: "Gateway route propagation concerns routes learned from a virtual network gateway, not forwarding by an NVA.", fr: "La propagation des itinéraires de passerelle concerne les routes apprises d'une passerelle de réseau virtuel, pas le transfert par une NVA." }
    e: { en: The destination is a private range; a public IP address is not needed to forward this traffic., fr: "La destination est une plage privée ; une adresse IP publique n'est pas nécessaire pour transférer ce trafic." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: Diagnose an Azure virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
