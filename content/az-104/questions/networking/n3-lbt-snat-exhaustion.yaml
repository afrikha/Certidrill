id: n3-lbt-snat-exhaustion
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs 20 virtual machines in the backend pool of a public Standard Load Balancer named **LB-API**. The virtual machines have no public IP addresses and call many external REST APIs. Outbound connectivity comes from the default SNAT of the load-balancing rule.

    During peak hours, some outbound calls fail intermittently. The **SNAT Connection Count** metric of LB-API, filtered on **Connection State = Failed**, is greater than zero, and **Used SNAT Ports** is close to **Allocated SNAT Ports** for every instance. Inbound traffic is not affected.

    You need to resolve the issue in a scalable way and minimize the risk of it happening again. What should you do?
  fr: |
    Northwind Traders exécute 20 machines virtuelles dans le pool principal d'un équilibreur de charge public Standard nommé **LB-API**. Les machines virtuelles n'ont pas d'adresse IP publique et appellent de nombreuses API REST externes. La connectivité sortante est fournie par la SNAT par défaut de la règle d'équilibrage de charge.

    Aux heures de pointe, certains appels sortants échouent de façon intermittente. La métrique **Nombre de connexions SNAT** de LB-API, filtrée sur **État de la connexion = Échec**, est supérieure à zéro, et **Ports SNAT utilisés** est proche de **Ports SNAT alloués** pour chaque instance. Le trafic entrant n'est pas affecté.

    Vous devez résoudre le problème de manière évolutive et réduire au minimum le risque qu'il se reproduise. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Associate a NAT gateway that has a public IP address with the subnet of the virtual machines., fr: "Associer une passerelle NAT dotée d'une adresse IP publique au sous-réseau des machines virtuelles." } }
    - { id: b, text: { en: Replace the HTTP health probe of LB-API with a TCP health probe on the same port., fr: "Remplacer la sonde d'intégrité HTTP de LB-API par une sonde d'intégrité TCP sur le même port." } }
    - { id: c, text: { en: Set session persistence to Client IP and protocol on the load-balancing rule., fr: Définir la persistance de session sur Adresse IP du client et protocole dans la règle d'équilibrage de charge. } }
    - { id: d, text: { en: Create an inbound NAT rule that targets the backend pool and uses a second frontend IP address., fr: "Créer une règle NAT entrante qui cible le pool principal et utilise une deuxième adresse IP frontale." } }
answer: { optionId: a }
explanation:
  correct:
    en: Failed SNAT connections with used ports close to the allocation indicate SNAT port exhaustion. Microsoft recommends Azure NAT Gateway for scalable outbound connectivity; once associated with the subnet, it takes over outbound traffic from the load balancer and provides up to 64,000 ports per public IP address, shared dynamically by the virtual machines. Outbound rules with more frontend IP addresses are an alternative.
    fr: "Des connexions SNAT en échec avec des ports utilisés proches de l'allocation indiquent un épuisement des ports SNAT. Microsoft recommande la passerelle NAT Azure pour une connectivité sortante évolutive : une fois associée au sous-réseau, elle prend en charge le trafic sortant à la place de l'équilibreur de charge et fournit jusqu'à 64 000 ports par adresse IP publique, partagés dynamiquement par les machines virtuelles. Des règles de trafic sortant avec davantage d'adresses IP frontales sont une alternative."
  options:
    b: { en: The probe affects inbound distribution only; inbound traffic is healthy and probes do not consume SNAT ports., fr: "La sonde n'agit que sur la répartition entrante ; le trafic entrant est sain et les sondes ne consomment pas de ports SNAT." }
    c: { en: Session persistence changes inbound distribution and does not add SNAT ports., fr: La persistance de session modifie la répartition entrante et n'ajoute pas de ports SNAT. }
    d: { en: "Inbound NAT rules provide port forwarding only, not outbound connectivity.", fr: "Les règles NAT entrantes assurent uniquement la redirection de port, pas la connectivité sortante." }
references:
  - title: Load Balancer Diagnostics - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-diagnostics
  - title: Outbound Rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
