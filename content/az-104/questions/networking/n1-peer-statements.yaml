id: n1-peer-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is planning virtual network peerings between several virtual networks in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip planifie des peerings entre plusieurs réseaux virtuels Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual network in North Europe can use the VPN gateway of a virtual network in West Europe through a global virtual network peering.
        fr: Un réseau virtuel situé en North Europe peut utiliser la passerelle VPN d'un réseau virtuel situé en West Europe via un peering de réseaux virtuels mondial.
    - id: s2
      text:
        en: A virtual network that already has its own VPN gateway can enable Use remote gateways on one of its peerings.
        fr: Un réseau virtuel qui possède déjà sa propre passerelle VPN peut activer « Utiliser des passerelles distantes » sur l'un de ses peerings.
    - id: s3
      text:
        en: You can peer two virtual networks whose subscriptions are associated with different Microsoft Entra tenants.
        fr: Vous pouvez appairer deux réseaux virtuels dont les abonnements sont associés à des locataires Microsoft Entra différents.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Both local and global virtual network peering support gateway transit, so a spoke in another region can use the hub's gateway. A virtual network can have only one gateway, local or remote, so a network with its own gateway cannot use a remote gateway. Peering is supported across subscriptions, including subscriptions in different Microsoft Entra tenants.
    fr: "Le peering de réseaux virtuels local comme mondial prend en charge le transit par passerelle : un spoke d'une autre région peut donc utiliser la passerelle du hub. Un réseau virtuel ne peut avoir qu'une passerelle, locale ou distante : un réseau qui possède sa propre passerelle ne peut pas utiliser de passerelle distante. Le peering est pris en charge entre abonnements, y compris entre abonnements de locataires Microsoft Entra différents."
references:
  - title: Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: Create, Change, or Delete Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
