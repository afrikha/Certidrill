id: n3-lb-internal-tier
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a three-tier application in a virtual network named **VNet1** in the West Europe region. The data tier consists of three virtual machines that listen on TCP port 1433.

    You need to distribute the connections from the application tier across the three data-tier virtual machines. The data tier must be reachable only through a private IP address of VNet1, and the frontend must be zone-redundant.

    What should you deploy?
  fr: |
    Litware exécute une application à trois niveaux dans un réseau virtuel nommé **VNet1** dans la région West Europe. Le niveau données se compose de trois machines virtuelles qui écoutent sur le port TCP 1433.

    Vous devez répartir les connexions issues du niveau application entre les trois machines virtuelles du niveau données. Le niveau données ne doit être accessible que par une adresse IP privée de VNet1, et le front-end doit être redondant interzone.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: An internal Standard Load Balancer, fr: Un équilibreur de charge interne Standard } }
    - { id: b, text: { en: A public Standard Load Balancer, fr: Un équilibreur de charge public Standard } }
    - { id: c, text: { en: A Gateway Load Balancer, fr: Un équilibreur de charge de passerelle } }
    - { id: d, text: { en: An Azure Traffic Manager profile, fr: Un profil Azure Traffic Manager } }
answer: { optionId: a }
explanation:
  correct:
    en: An internal load balancer uses a private frontend IP address from a subnet of the virtual network, so it distributes TCP 1433 traffic only to clients that can reach that network. The Standard SKU supports zone-redundant frontend IP configurations.
    fr: Un équilibreur de charge interne utilise une adresse IP frontale privée issue d'un sous-réseau du réseau virtuel ; il répartit donc le trafic TCP 1433 uniquement pour les clients qui peuvent atteindre ce réseau. La référence SKU Standard prend en charge les configurations IP frontales redondantes interzone.
  options:
    b: { en: A public load balancer exposes a public frontend IP address on the internet, which breaks the private-only requirement., fr: Un équilibreur de charge public expose une adresse IP frontale publique sur Internet, ce qui contredit l'exigence d'accès privé uniquement. }
    c: { en: A Gateway Load Balancer is chained to another frontend to insert third-party network virtual appliances; it does not load-balance an application tier., fr: "Un équilibreur de charge de passerelle est chaîné à un autre front-end pour insérer des appliances virtuelles réseau tierces ; il n'équilibre pas un niveau d'application." }
    d: { en: Traffic Manager is a DNS-based global traffic distributor for public endpoints; it has no private frontend., fr: Traffic Manager est un service de répartition globale basé sur le DNS pour des points de terminaison publics ; il n'a pas de front-end privé. }
references:
