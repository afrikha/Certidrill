id: n3-lbt-probe-facts
objective: "4.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are troubleshooting health probes on an internal Standard Load Balancer named **ILB-App** whose backend pool contains three virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous résolvez des problèmes de sondes d'intégrité sur un équilibreur de charge interne Standard nommé **ILB-App** dont le pool principal contient trois machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: The guest OS firewall of each virtual machine must allow probe traffic from the IP address 168.63.129.16.
        fr: Le pare-feu du système d'exploitation invité de chaque machine virtuelle doit autoriser le trafic de sonde provenant de l'adresse IP 168.63.129.16.
    - id: s2
      text:
        en: If the probes of all three virtual machines go down, the TCP connections that are already established continue.
        fr: Si les sondes des trois machines virtuelles sont toutes en échec, les connexions TCP déjà établies se poursuivent.
    - id: s3
      text:
        en: You can configure a UDP health probe to monitor a UDP-based application in the backend pool.
        fr: Vous pouvez configurer une sonde d'intégrité UDP pour surveiller une application basée sur UDP dans le pool principal.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: All IPv4 health probes originate from 168.63.129.16, so NSGs and local firewalls must allow it (the AzureLoadBalancer service tag identifies it). On a Standard Load Balancer, when all probes are down no new flows are sent, but established TCP flows continue. Health probes support only TCP, HTTP and HTTPS; for a UDP application you expose a TCP, HTTP or HTTPS health signal from the backend.
    fr: "Toutes les sondes d'intégrité IPv4 proviennent de 168.63.129.16 : les NSG et les pare-feu locaux doivent l'autoriser (l'étiquette de service AzureLoadBalancer l'identifie). Sur un équilibreur de charge Standard, quand toutes les sondes sont en échec, aucun nouveau flux n'est envoyé, mais les flux TCP établis se poursuivent. Les sondes d'intégrité ne prennent en charge que TCP, HTTP et HTTPS ; pour une application UDP, vous exposez un signal d'intégrité TCP, HTTP ou HTTPS depuis le back-end."
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
