id: net-bastion-subnet
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** with the address space 10.20.0.0/16. Several virtual machines without public IP addresses are connected to VNet1.

    You plan to deploy Azure Bastion (Basic SKU) in VNet1 so that administrators can connect to the virtual machines from the Azure portal.

    Which subnet must you create in VNet1?
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dont l'espace d'adressage est 10.20.0.0/16. Plusieurs machines virtuelles sans adresse IP publique sont connectées à VNet1.

    Vous prévoyez de déployer Azure Bastion (référence SKU Basic) dans VNet1 pour que les administrateurs se connectent aux machines virtuelles depuis le portail Azure.

    Quel sous-réseau devez-vous créer dans VNet1 ?
body:
  options:
    - { id: a, text: { en: "A subnet named `GatewaySubnet` with a /27 prefix", fr: "Un sous-réseau nommé `GatewaySubnet` de taille /27" } }
    - { id: b, text: { en: "A subnet named `AzureBastionSubnet` with a /26 prefix or larger", fr: "Un sous-réseau nommé `AzureBastionSubnet` de taille /26 ou supérieure" } }
    - { id: c, text: { en: "A subnet named `AzureBastionSubnet` with a /29 prefix", fr: "Un sous-réseau nommé `AzureBastionSubnet` de taille /29" } }
    - { id: d, text: { en: "Any subnet whose network security group allows inbound TCP 3389 from the internet", fr: "N'importe quel sous-réseau dont le groupe de sécurité réseau autorise le trafic TCP 3389 entrant depuis Internet" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Bastion is deployed in a dedicated subnet that must be named exactly `AzureBastionSubnet`, with a size of /26 or larger (/25, /24…). The Developer SKU is the only one that needs no dedicated subnet.
    fr: Azure Bastion se déploie dans un sous-réseau dédié qui doit s'appeler exactement `AzureBastionSubnet` et avoir une taille /26 ou supérieure (/25, /24…). Seule la référence SKU Developer n'a pas besoin de sous-réseau dédié.
  options:
    a: { en: "GatewaySubnet is reserved for VPN and ExpressRoute gateways.", fr: "GatewaySubnet est réservé aux passerelles VPN et ExpressRoute." }
    c: { en: "A /29 subnet is too small for Bastion, which requires at least /26.", fr: "Un sous-réseau /29 est trop petit pour Bastion, qui exige au moins /26." }
    d: { en: "Bastion avoids exposing RDP to the internet; it needs its own dedicated subnet.", fr: "Bastion évite d'exposer RDP sur Internet ; il a besoin de son propre sous-réseau dédié." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
