id: n1-pip-secure-by-default
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deploy a Windows Server virtual machine named **VM1**. You associate a new Standard SKU public IP address with the network interface of VM1. No network security group is associated with the network interface or with the subnet of VM1.

    VM1 is running, and Remote Desktop is enabled in the operating system. However, administrators cannot connect to VM1 by using RDP from the internet.

    You need to allow RDP connections to VM1 from the public IP address of the administrators' office.

    What should you do?
  fr: |
    Vous déployez une machine virtuelle Windows Server nommée **VM1**. Vous associez une nouvelle adresse IP publique de référence SKU Standard à l'interface réseau de VM1. Aucun groupe de sécurité réseau n'est associé à l'interface réseau ni au sous-réseau de VM1.

    VM1 est en cours d'exécution et le Bureau à distance est activé dans le système d'exploitation. Pourtant, les administrateurs ne peuvent pas se connecter à VM1 en RDP depuis Internet.

    Vous devez autoriser les connexions RDP vers VM1 depuis l'adresse IP publique du bureau des administrateurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Associate a network security group that has an inbound rule allowing TCP 3389 from the office address.", fr: "Associer un groupe de sécurité réseau doté d'une règle entrante qui autorise TCP 3389 depuis l'adresse du bureau." } }
    - { id: b, text: { en: "Change the allocation method of the public IP address to Dynamic so that it accepts inbound connections.", fr: "Passer la méthode d'allocation de l'adresse IP publique à Dynamique pour qu'elle accepte les connexions entrantes." } }
    - { id: c, text: { en: "Enable IP forwarding on the network interface of VM1 so that it accepts inbound traffic on TCP 3389.", fr: "Activer le transfert IP sur l'interface réseau de VM1 pour qu'elle accepte le trafic entrant sur TCP 3389." } }
    - { id: d, text: { en: "Configure a DNS name label on the public IP address and connect to VM1 by using its FQDN instead.", fr: "Configurer une étiquette de nom de domaine sur l'adresse IP publique et se connecter à VM1 par son FQDN." } }
answer: { optionId: a }
explanation:
  correct:
    en: Standard SKU public IP addresses are secure by default and closed to inbound traffic. Inbound traffic must be explicitly allowed by a network security group, for example on the NIC or subnet of the virtual machine. An NSG rule allowing TCP 3389 from the office address opens RDP only for that source.
    fr: "Les adresses IP publiques de référence SKU Standard sont sécurisées par défaut et fermées au trafic entrant. Le trafic entrant doit être explicitement autorisé par un groupe de sécurité réseau, par exemple sur l'interface réseau ou le sous-réseau de la machine virtuelle. Une règle NSG autorisant TCP 3389 depuis l'adresse du bureau n'ouvre RDP que pour cette source."
  options:
    b: { en: "Standard public IP addresses support only static allocation, and the allocation method never controls inbound access.", fr: "Les adresses IP publiques Standard ne prennent en charge que l'allocation statique, et la méthode d'allocation ne contrôle pas l'accès entrant." }
    c: { en: "IP forwarding lets a VM forward traffic that is not addressed to it (NVA scenario); it does not open inbound ports.", fr: "Le transfert IP permet à une machine virtuelle de relayer du trafic qui ne lui est pas destiné (scénario NVA) ; il n'ouvre aucun port entrant." }
    d: { en: "A DNS name label only provides a name that resolves to the same address; inbound traffic is still blocked.", fr: "Une étiquette de nom de domaine ne fournit qu'un nom résolu vers la même adresse ; le trafic entrant reste bloqué." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
