id: cs1-litware-05
objective: "4.3.1"
type: dropdown
caseStudy: cs1-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the name resolution requirement for litware.internal. The solution must minimize administrative effort.

    How should you configure name resolution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de résolution de noms pour litware.internal. La solution doit réduire au minimum l'effort d'administration.

    Comment devez-vous configurer la résolution de noms ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create litware.internal as [[type]].
      VNet-App: [[app]]
      VNet-Mgmt: [[mgmt]]
    fr: |
      Créez litware.internal en tant que [[type]].
      VNet-App : [[app]]
      VNet-Mgmt : [[mgmt]]
  slots:
    - id: type
      options:
        - { id: private, text: { en: "an Azure private DNS zone", fr: "zone DNS privée Azure" } }
        - { id: public, text: { en: "an Azure public DNS zone", fr: "zone DNS publique Azure" } }
        - { id: vmdns, text: { en: "a DNS server role on VM-JUMP1", fr: "rôle de serveur DNS sur VM-JUMP1" } }
    - id: app
      options:
        - { id: auto, text: { en: "Linked, with auto registration enabled", fr: "Lié, avec l'inscription automatique activée" } }
        - { id: noauto, text: { en: "Linked, with auto registration disabled", fr: "Lié, avec l'inscription automatique désactivée" } }
        - { id: nolink, text: { en: "Not linked", fr: "Non lié" } }
    - id: mgmt
      options:
        - { id: auto, text: { en: "Linked, with auto registration enabled", fr: "Lié, avec l'inscription automatique activée" } }
        - { id: noauto, text: { en: "Linked, with auto registration disabled", fr: "Lié, avec l'inscription automatique désactivée" } }
        - { id: nolink, text: { en: "Not linked", fr: "Non lié" } }
answer:
  values: { type: private, app: auto, mgmt: noauto }
explanation:
  correct:
    en: |
      A private DNS zone resolves names only for the virtual networks linked to it. Linking VNet-App with auto registration makes Azure create and delete the A records of its VMs automatically. VNet-Mgmt must also be linked so VM-JUMP1 can resolve the zone, but without auto registration, because its records are created manually.
    fr: |
      Une zone DNS privée ne résout les noms que pour les réseaux virtuels qui lui sont liés. Lier VNet-App avec l'inscription automatique fait créer et supprimer automatiquement par Azure les enregistrements A de ses machines virtuelles. VNet-Mgmt doit aussi être lié pour que VM-JUMP1 puisse résoudre la zone, mais sans inscription automatique, car ses enregistrements sont créés manuellement.
  options:
    public: { en: "A public zone is resolvable from the internet and offers no virtual network links or auto registration.", fr: "Une zone publique peut être résolue depuis Internet et n'offre ni liens de réseau virtuel ni inscription automatique." }
    vmdns: { en: "A self-managed DNS server requires you to maintain the VM and the records yourself, which increases administrative effort.", fr: "Un serveur DNS autogéré vous oblige à maintenir la machine virtuelle et les enregistrements vous-même, ce qui augmente l'effort d'administration." }
    nolink: { en: "A virtual network that is not linked to the private zone cannot resolve its records.", fr: "Un réseau virtuel non lié à la zone privée ne peut pas résoudre ses enregistrements." }
references:
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: What is a virtual network link subresource of Azure DNS private zones
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
