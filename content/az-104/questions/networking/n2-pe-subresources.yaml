id: n2-pe-subresources
objective: "4.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stlitware** with a hierarchical namespace enabled. Public network access will be disabled, and every workload in **VNet1** must reach the account through private endpoints.

    Which target subresource should you select for the private endpoint of each workload? To answer, drag the appropriate subresources to the correct workloads. Each subresource may be used once or not at all.
  fr: |
    Vous disposez d'un compte de stockage v2 à usage général nommé **stlitware** avec un espace de noms hiérarchique activé. L'accès réseau public sera désactivé, et chaque charge de travail de **VNet1** doit joindre le compte via des points de terminaison privés.

    Quelle sous-ressource cible devez-vous sélectionner pour le point de terminaison privé de chaque charge de travail ? Pour répondre, faites glisser les sous-ressources appropriées vers les charges de travail correspondantes. Chaque sous-ressource peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: blob, text: blob }
    - { id: file, text: file }
    - { id: dfs, text: dfs }
    - { id: web, text: web }
    - { id: table, text: table }
    - { id: queue, text: queue }
  targets:
    - id: t1
      text: { en: An app reads and writes block blobs with the Blob service REST API, fr: Une application lit et écrit des objets blob de blocs avec l'API REST du service Blob }
    - id: t2
      text: { en: Windows servers map an SMB file share, fr: Des serveurs Windows mappent un partage de fichiers SMB }
    - id: t3
      text: { en: Analytics jobs rename and list directories with the Data Lake Storage Gen2 endpoint, fr: Des traitements analytiques renomment et listent des répertoires avec le point de terminaison Data Lake Storage Gen2 }
    - id: t4
      text: { en: Users browse a static website hosted in the account, fr: Des utilisateurs consultent un site web statique hébergé dans le compte }
answer:
  mapping: { t1: blob, t2: file, t3: dfs, t4: web }
explanation:
  correct:
    en: A private endpoint connects to one subresource, so each storage service you use needs its own private endpoint and private DNS zone. The Blob service uses blob, Azure Files uses file, the Data Lake Storage Gen2 endpoint uses dfs, and static websites use web.
    fr: "Un point de terminaison privé se connecte à une seule sous-ressource : chaque service de stockage utilisé a besoin de son propre point de terminaison privé et de sa propre zone DNS privée. Le service Blob utilise blob, Azure Files utilise file, le point de terminaison Data Lake Storage Gen2 utilise dfs et les sites web statiques utilisent web."
  options:
    table: { en: table is for Azure Table storage., fr: table sert au stockage Table Azure. }
    queue: { en: queue is for Azure Queue Storage., fr: queue sert au stockage File d'attente Azure. }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
