id: n1-pip-prefix-assign
objective: "4.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual machine named **VM1** in the West Europe region. VM1 has one network interface and no public IP address.

    Partners must connect to VM1 from the internet. Their firewalls allow outbound connections only to destinations in a contiguous range of public addresses that your company reserves in Azure. A network security group already allows the required inbound traffic to VM1.

    You need to give VM1 a public IP address that meets the partners' requirement.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle nommée **VM1** dans la région West Europe. VM1 possède une interface réseau et aucune adresse IP publique.

    Des partenaires doivent se connecter à VM1 depuis Internet. Leurs pare-feu n'autorisent les connexions sortantes que vers une plage contiguë d'adresses publiques que votre entreprise réserve dans Azure. Un groupe de sécurité réseau autorise déjà le trafic entrant nécessaire vers VM1.

    Vous devez attribuer à VM1 une adresse IP publique qui répond à l'exigence des partenaires.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: prefix, text: { en: Create a public IP address prefix in West Europe in the subscription of VM1., fr: "Créer un préfixe d'adresse IP publique dans West Europe, dans l'abonnement de VM1." } }
    - { id: ip, text: { en: Create a Standard static public IP address from the prefix., fr: Créer une adresse IP publique Standard statique à partir du préfixe. } }
    - { id: assoc, text: { en: Associate the public IP address with the IP configuration of the network interface of VM1., fr: "Associer l'adresse IP publique à la configuration IP de l'interface réseau de VM1." } }
    - { id: direct, text: { en: Associate the public IP address prefix directly with the network interface of VM1., fr: Associer directement le préfixe d'adresse IP publique à l'interface réseau de VM1. } }
    - { id: nat, text: { en: Create a NAT gateway that uses the prefix and associate it with the subnet of VM1., fr: Créer une passerelle NAT qui utilise le préfixe et l'associer au sous-réseau de VM1. } }
    - { id: existing, text: { en: Create a Standard public IP address and then move it into the prefix., fr: Créer une adresse IP publique Standard puis la déplacer dans le préfixe. } }
answer:
  sequence: [ prefix, ip, assoc ]
explanation:
  correct:
    en: You first create the prefix, which reserves a contiguous range in the region and subscription. You then create a static Standard public IP address from that prefix, and finally associate this address with the IP configuration of VM1's network interface, as you would with any public IP address.
    fr: "Vous créez d'abord le préfixe, qui réserve une plage contiguë dans la région et l'abonnement. Vous créez ensuite une adresse IP publique Standard statique à partir de ce préfixe, puis vous associez cette adresse à la configuration IP de l'interface réseau de VM1, comme toute adresse IP publique."
  options:
    direct: { en: "A network interface uses a public IP address resource, not a whole prefix.", fr: "Une interface réseau utilise une ressource d'adresse IP publique, pas un préfixe entier." }
    nat: { en: A NAT gateway provides outbound connectivity only; partners could not connect inbound to VM1., fr: "Une passerelle NAT ne fournit que la connectivité sortante ; les partenaires ne pourraient pas se connecter à VM1 en entrée." }
    existing: { en: You cannot specify the addresses of a prefix or move an existing address into it; addresses are created from the prefix., fr: "Vous ne pouvez ni choisir les adresses d'un préfixe ni y déplacer une adresse existante ; les adresses sont créées à partir du préfixe." }
references:
  - title: Azure Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
