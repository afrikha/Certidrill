id: n2-sep-configure-order
objective: "4.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** in the subscription **Sub1**, in the North Europe region. The subnet **Subnet1** already has a service endpoint for **Microsoft.Storage**. Apps in Subnet1 read data from the storage account **stcorp1**.

    You need to prevent the VMs in Subnet1 from accessing any storage account other than stcorp1 over the service endpoint. Access to stcorp1 must never be interrupted during the change.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dans l'abonnement **Sub1**, dans la région North Europe. Le sous-réseau **Subnet1** dispose déjà d'un point de terminaison de service pour **Microsoft.Storage**. Des applications de Subnet1 lisent des données dans le compte de stockage **stcorp1**.

    Vous devez empêcher les machines virtuelles de Subnet1 d'accéder, via le point de terminaison de service, à tout autre compte de stockage que stcorp1. L'accès à stcorp1 ne doit jamais être interrompu pendant la modification.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: Create a service endpoint policy named SEP1 in Sub1 and in North Europe., fr: Créer une stratégie de point de terminaison de service nommée SEP1 dans Sub1 et en North Europe. } }
    - { id: def, text: { en: Add a policy definition to SEP1 that lists the resource ID of stcorp1., fr: Ajouter à SEP1 une définition de stratégie qui contient l'ID de ressource de stcorp1. } }
    - { id: assoc, text: { en: Associate SEP1 with Subnet1., fr: Associer SEP1 à Subnet1. } }
    - { id: region, text: { en: Create a service endpoint policy named SEP1 in West Europe., fr: Créer une stratégie de point de terminaison de service nommée SEP1 en West Europe. } }
    - { id: nsg, text: { en: Add an outbound NSG rule that allows the Storage.NorthEurope service tag., fr: Ajouter une règle NSG sortante qui autorise l'étiquette de service Storage.NorthEurope. } }
    - { id: pe, text: { en: Create a private endpoint for the blob subresource of stcorp1., fr: Créer un point de terminaison privé pour la sous-ressource blob de stcorp1. } }
answer:
  sequence: [create, def, assoc]
explanation:
  correct:
    en: A service endpoint policy must be in the same region and subscription as the virtual network. Its definitions list the allowed storage accounts by resource ID. Once a policy is associated with a subnet, every storage account that is not listed is denied, so the definition for stcorp1 must exist before you associate the policy.
    fr: "Une stratégie de point de terminaison de service doit se trouver dans la même région et le même abonnement que le réseau virtuel. Ses définitions listent les comptes de stockage autorisés par ID de ressource. Dès qu'une stratégie est associée à un sous-réseau, tout compte de stockage non listé est refusé : la définition de stcorp1 doit donc exister avant l'association."
  options:
    region: { en: The policy must be in the same region as VNet1., fr: La stratégie doit être dans la même région que VNet1. }
    nsg: { en: A regional service tag allows every storage account in the region, not only stcorp1., fr: "Une étiquette de service régionale autorise tous les comptes de stockage de la région, pas seulement stcorp1." }
    pe: { en: A private endpoint does not restrict which other storage accounts the subnet can reach., fr: Un point de terminaison privé ne restreint pas les autres comptes de stockage accessibles depuis le sous-réseau. }
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
