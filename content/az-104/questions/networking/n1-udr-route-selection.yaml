id: n1-udr-route-selection
objective: "4.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named **VNet1** (10.1.0.0/16) is peered with a virtual network named **VNet2** (10.2.0.0/16). A route table named **RT1** is associated with the subnet of a virtual machine named **VM1**. The following table shows all the routes that apply to the network interface of VM1, before Azure selects the routes that are used.

    For each destination, select the route that Azure uses for traffic sent by VM1.
  fr: |
    Un réseau virtuel nommé **VNet1** (10.1.0.0/16) est appairé avec un réseau virtuel nommé **VNet2** (10.2.0.0/16). Une table de routage nommée **RT1** est associée au sous-réseau d'une machine virtuelle nommée **VM1**. Le tableau suivant présente toutes les routes qui s'appliquent à l'interface réseau de VM1, avant qu'Azure ne sélectionne les routes utilisées.

    Pour chaque destination, sélectionnez la route qu'Azure utilise pour le trafic envoyé par VM1.
body:
  prompts:
    - id: p1
      text: { en: Traffic to 10.2.5.4, fr: Trafic vers 10.2.5.4 }
    - id: p2
      text: { en: Traffic to 10.2.1.10, fr: Trafic vers 10.2.1.10 }
    - id: p3
      text: { en: Traffic to 10.1.3.7, fr: Trafic vers 10.1.3.7 }
  grid:
    header: [{ en: Route, fr: Route }, { en: Source, fr: Source }, { en: Address prefix, fr: Préfixe d'adresse }, { en: Next hop type, fr: Type de tronçon suivant }, { en: Next hop IP address, fr: Adresse IP du tronçon suivant }]
    rows:
      - [{ text: R1, area: r1 }, { text: { en: Default, fr: Par défaut } }, { text: 10.1.0.0/16 }, { text: { en: Virtual network, fr: Réseau virtuel } }, { text: "-" }]
      - [{ text: R2, area: r2 }, { text: { en: Default, fr: Par défaut } }, { text: 10.2.0.0/16 }, { text: { en: Virtual network peering, fr: Peering de réseaux virtuels } }, { text: "-" }]
      - [{ text: R3, area: r3 }, { text: { en: User, fr: Utilisateur } }, { text: 10.2.0.0/16 }, { text: { en: Virtual appliance, fr: Appliance virtuelle } }, { text: 10.1.0.4 }]
      - [{ text: R4, area: r4 }, { text: { en: User, fr: Utilisateur } }, { text: 10.2.1.0/24 }, { text: { en: None, fr: Aucun } }, { text: "-" }]
      - [{ text: R5, area: r5 }, { text: { en: Default, fr: Par défaut } }, { text: 0.0.0.0/0 }, { text: Internet }, { text: "-" }]
      - [{ text: R6, area: r6 }, { text: { en: User, fr: Utilisateur } }, { text: 0.0.0.0/0 }, { text: { en: Virtual appliance, fr: Appliance virtuelle } }, { text: 10.1.0.4 }]
answer:
  values: { p1: r3, p2: r4, p3: r1 }
explanation:
  correct:
    en: Azure first applies the longest prefix match, then, for identical prefixes, prefers a user-defined route over a BGP route and a system route. 10.2.5.4 matches 10.2.0.0/16 (R2 and R3) and the user route R3 wins, so the traffic goes to the appliance. 10.2.1.10 matches the longer prefix 10.2.1.0/24 (R4), so it is dropped. 10.1.3.7 matches only 10.1.0.0/16 (R1) besides 0.0.0.0/0, so it stays in the virtual network.
    fr: "Azure applique d'abord la correspondance de préfixe la plus longue puis, pour des préfixes identiques, préfère un itinéraire défini par l'utilisateur à un itinéraire BGP et à un itinéraire système. 10.2.5.4 correspond à 10.2.0.0/16 (R2 et R3) et la route utilisateur R3 l'emporte : le trafic va à l'appliance. 10.2.1.10 correspond au préfixe plus long 10.2.1.0/24 (R4) : il est supprimé. 10.1.3.7 ne correspond qu'à 10.1.0.0/16 (R1) en plus de 0.0.0.0/0 : il reste dans le réseau virtuel."
  options:
    r2: { en: The system peering route has the same prefix as R3, and a user-defined route overrides it., fr: La route système de peering a le même préfixe que R3, et un itinéraire défini par l'utilisateur la remplace. }
    r6: { en: 0.0.0.0/0 is the shortest prefix; it is used only when no more specific route matches., fr: "0.0.0.0/0 est le préfixe le plus court ; il n'est utilisé que si aucune route plus spécifique ne correspond." }
references:
  - title: Virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
