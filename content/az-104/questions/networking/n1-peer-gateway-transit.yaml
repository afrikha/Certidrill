id: n1-peer-gateway-transit
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a hub-and-spoke topology. A virtual network named **Hub-VNet** contains a VPN gateway that has a site-to-site connection to the on-premises network. A virtual network named **Spoke-VNet** is peered with Hub-VNet and has no gateway.

    You need the virtual machines in Spoke-VNet to reach the on-premises network through the VPN gateway in Hub-VNet. The solution must not deploy another gateway.

    Which setting should you enable on each peering? Select the appropriate options in the answer area.
  fr: |
    Contoso utilise une topologie hub-and-spoke. Un réseau virtuel nommé **Hub-VNet** contient une passerelle VPN disposant d'une connexion site à site vers le réseau local. Un réseau virtuel nommé **Spoke-VNet** est appairé avec Hub-VNet et ne possède aucune passerelle.

    Les machines virtuelles de Spoke-VNet doivent joindre le réseau local via la passerelle VPN de Hub-VNet. La solution ne doit pas déployer d'autre passerelle.

    Quel paramètre devez-vous activer sur chaque peering ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Peering on Hub-VNet (Hub-VNet to Spoke-VNet): [[hub]]

      Peering on Spoke-VNet (Spoke-VNet to Hub-VNet): [[spoke]]
    fr: |
      Peering sur Hub-VNet (Hub-VNet vers Spoke-VNet) : [[hub]]

      Peering sur Spoke-VNet (Spoke-VNet vers Hub-VNet) : [[spoke]]
  slots:
    - id: hub
      options:
        - { id: gt, text: { en: Allow gateway transit (allowGatewayTransit), fr: Autoriser le transit par passerelle (allowGatewayTransit) } }
        - { id: urg, text: { en: Use remote gateways (useRemoteGateways), fr: Utiliser des passerelles distantes (useRemoteGateways) } }
        - { id: aft, text: { en: Allow forwarded traffic (allowForwardedTraffic), fr: Autoriser le trafic transféré (allowForwardedTraffic) } }
    - id: spoke
      options:
        - { id: gt, text: { en: Allow gateway transit (allowGatewayTransit), fr: Autoriser le transit par passerelle (allowGatewayTransit) } }
        - { id: urg, text: { en: Use remote gateways (useRemoteGateways), fr: Utiliser des passerelles distantes (useRemoteGateways) } }
        - { id: aft, text: { en: Allow forwarded traffic (allowForwardedTraffic), fr: Autoriser le trafic transféré (allowForwardedTraffic) } }
answer:
  values: { hub: gt, spoke: urg }
explanation:
  correct:
    en: Gateway transit is configured on both sides. The peering on the virtual network that owns the gateway (Hub-VNet) allows its gateway to forward traffic to the peered network (gateway transit), and the peering on the virtual network without a gateway (Spoke-VNet) uses the remote gateway. Use remote gateways can be enabled only when the remote side allows gateway transit and the local virtual network has no gateway of its own.
    fr: "Le transit par passerelle se configure des deux côtés. Le peering du réseau virtuel qui possède la passerelle (Hub-VNet) autorise sa passerelle à transférer le trafic vers le réseau appairé (transit par passerelle), et le peering du réseau virtuel sans passerelle (Spoke-VNet) utilise la passerelle distante. « Utiliser des passerelles distantes » ne peut être activé que si le côté distant autorise le transit par passerelle et que le réseau virtuel local n'a pas sa propre passerelle."
  options:
    aft: { en: Allow forwarded traffic lets a network receive traffic forwarded by an NVA or another network; it does not share a VPN gateway., fr: Autoriser le trafic transféré permet à un réseau de recevoir du trafic transféré par une NVA ou un autre réseau ; il ne partage pas une passerelle VPN. }
references:
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: Create, change, or delete an Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
