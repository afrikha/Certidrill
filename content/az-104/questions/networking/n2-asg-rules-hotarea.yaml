id: n2-asg-rules-hotarea
objective: "4.2.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The network security group **NSG1** is associated with the only subnet of a virtual network. No NSG is associated with any network interface. The subnet contains the following VMs:

    | VM | Application security group of its NIC |
    | --- | --- |
    | VM-Web1 | ASG-Web |
    | VM-App1 | ASG-App |
    | VM-Db1 | ASG-Db |
    | VM-Jump | None |

    The inbound security rules of NSG1 are shown in the following table. Answer each prompt by selecting the rule that processes the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le groupe de sécurité réseau **NSG1** est associé à l'unique sous-réseau d'un réseau virtuel. Aucun NSG n'est associé à une interface réseau. Le sous-réseau contient les machines virtuelles suivantes :

    | Machine virtuelle | Groupe de sécurité d'application de son interface réseau |
    | --- | --- |
    | VM-Web1 | ASG-Web |
    | VM-App1 | ASG-App |
    | VM-Db1 | ASG-Db |
    | VM-Jump | Aucun |

    Les règles de sécurité entrantes de NSG1 figurent dans le tableau suivant. Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "VM-Web1 connects to VM-Db1 on TCP 1433", fr: "VM-Web1 se connecte à VM-Db1 sur TCP 1433" }
    - id: p2
      text: { en: "VM-Jump connects to VM-App1 on TCP 3389", fr: "VM-Jump se connecte à VM-App1 sur TCP 3389" }
  grid:
    caption: { en: "NSG1 inbound security rules", fr: "Règles de sécurité entrantes de NSG1" }
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, Source, Destination, Port, Action]
    rows:
      - [{ text: "100" }, { text: Allow-Web-HTTPS, area: r100 }, { text: Internet }, { text: ASG-Web }, { text: "443" }, { text: Allow }]
      - [{ text: "110" }, { text: Allow-App-Db, area: r110 }, { text: ASG-App }, { text: ASG-Db }, { text: "1433" }, { text: Allow }]
      - [{ text: "120" }, { text: Deny-Db-All, area: r120 }, { text: Any }, { text: ASG-Db }, { text: "1433" }, { text: Deny }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: AzureLoadBalancer }, { text: Any }, { text: Any }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r120, p2: r65000 }
explanation:
  correct:
    en: VM-Web1 is not in ASG-App, so Allow-App-Db (110) does not match; the next matching rule is Deny-Db-All (120), which blocks the connection. For VM-Jump to VM-App1 on 3389, no custom rule matches because VM-App1 is not in ASG-Web or ASG-Db, so the default rule AllowVnetInBound (65000) allows the traffic.
    fr: "VM-Web1 n'appartient pas à ASG-App : Allow-App-Db (110) ne correspond pas et la règle suivante qui correspond est Deny-Db-All (120), qui bloque la connexion. Pour VM-Jump vers VM-App1 sur 3389, aucune règle personnalisée ne correspond car VM-App1 n'est ni dans ASG-Web ni dans ASG-Db : la règle par défaut AllowVnetInBound (65000) autorise le trafic."
  options:
    r110: { en: "Allow-App-Db only matches sources whose NIC is a member of ASG-App.", fr: "Allow-App-Db ne correspond qu'aux sources dont l'interface réseau est membre d'ASG-App." }
    r65500: { en: "Traffic inside the virtual network matches AllowVnetInBound before DenyAllInBound.", fr: "Le trafic interne au réseau virtuel correspond à AllowVnetInBound avant DenyAllInBound." }
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
