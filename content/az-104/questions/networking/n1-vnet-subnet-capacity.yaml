id: n1-vnet-subnet-capacity
objective: "4.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a virtual network named **VNet-App** that uses the address space 10.10.0.0/16. VNet-App contains the empty subnets shown in the following table.

    You plan to deploy two groups of virtual machines. Each virtual machine has one network interface with one private IP address.

    For each group, select the smallest existing subnet that can host all its virtual machines.
  fr: |
    Tailspin dispose d'un réseau virtuel nommé **VNet-App** qui utilise l'espace d'adressage 10.10.0.0/16. VNet-App contient les sous-réseaux vides indiqués dans le tableau suivant.

    Vous prévoyez de déployer deux groupes de machines virtuelles. Chaque machine virtuelle possède une interface réseau avec une adresse IP privée.

    Pour chaque groupe, sélectionnez le plus petit sous-réseau existant qui peut héberger toutes ses machines virtuelles.
body:
  prompts:
    - id: p1
      text: { en: A group of 28 virtual machines, fr: Un groupe de 28 machines virtuelles }
    - id: p2
      text: { en: A group of 11 virtual machines, fr: Un groupe de 11 machines virtuelles }
  grid:
    header: [{ en: Subnet, fr: Sous-réseau }, { en: Address range, fr: Plage d'adresses }]
    rows:
      - [{ text: Web, area: web }, { text: 10.10.1.0/24 }]
      - [{ text: App, area: app }, { text: 10.10.2.0/27 }]
      - [{ text: Data, area: data }, { text: 10.10.2.32/28 }]
      - [{ text: Mgmt, area: mgmt }, { text: 10.10.2.48/29 }]
      - [{ text: Batch, area: batch }, { text: 10.10.3.0/26 }]
answer:
  values: { p1: batch, p2: data }
explanation:
  correct:
    en: Azure reserves five addresses in each subnet, so the usable addresses are /24 = 251, /26 = 59, /27 = 27, /28 = 11 and /29 = 3. App (/27) offers 27 addresses, one short of 28 VMs, so the smallest subnet for 28 VMs is Batch (/26). Data (/28) offers exactly 11 usable addresses, enough for 11 VMs.
    fr: "Azure réserve cinq adresses dans chaque sous-réseau ; les adresses utilisables sont donc /24 = 251, /26 = 59, /27 = 27, /28 = 11 et /29 = 3. App (/27) offre 27 adresses, une de moins que les 28 machines virtuelles : le plus petit sous-réseau pour 28 machines virtuelles est Batch (/26). Data (/28) offre exactement 11 adresses utilisables, assez pour 11 machines virtuelles."
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
