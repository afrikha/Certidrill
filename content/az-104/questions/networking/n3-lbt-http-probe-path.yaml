id: n3-lbt-http-probe-path
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an internal Standard Load Balancer named **ILB1** in front of three web servers. ILB1 has a health probe with the following settings:

    - Protocol: HTTP
    - Port: 80
    - Path: /status/health.html

    The **Health Probe Status** metric shows 0 percent for all three web servers. On each server, `netstat -an` shows port 80 in the LISTENING state, the guest firewall allows 168.63.129.16, and the NSG keeps the default AllowAzureLoadBalancerInBound rule. Browsing to `http://<server-ip>/` from another virtual machine returns the home page, but browsing to `http://<server-ip>/status/health.html` returns HTTP 404.

    You need the web servers to be marked healthy. What should you do?
  fr: |
    Tailspin Toys dispose d'un équilibreur de charge interne Standard nommé **ILB1** devant trois serveurs web. ILB1 a une sonde d'intégrité avec les paramètres suivants :

    - Protocole : HTTP
    - Port : 80
    - Chemin : /status/health.html

    La métrique **État de la sonde d'intégrité** affiche 0 % pour les trois serveurs web. Sur chaque serveur, `netstat -an` affiche le port 80 à l'état LISTENING, le pare-feu invité autorise 168.63.129.16 et le NSG conserve la règle par défaut AllowAzureLoadBalancerInBound. Depuis une autre machine virtuelle, l'accès à `http://<server-ip>/` renvoie la page d'accueil, mais l'accès à `http://<server-ip>/status/health.html` renvoie HTTP 404.

    Les serveurs web doivent être marqués comme sains. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Change the probe path to a page that returns HTTP 200 on every server., fr: Modifier le chemin de la sonde pour une page qui renvoie HTTP 200 sur chaque serveur. } }
    - { id: b, text: { en: Increase the probe interval from 5 seconds to 30 seconds., fr: Augmenter l'intervalle de sonde de 5 à 30 secondes. } }
    - { id: c, text: { en: Add an inbound NSG rule that allows the VirtualNetwork service tag on TCP port 80., fr: Ajouter une règle NSG entrante qui autorise l'étiquette de service VirtualNetwork sur le port TCP 80. } }
    - { id: d, text: { en: Set session persistence to Client IP on the load-balancing rule., fr: Définir la persistance de session sur Adresse IP du client dans la règle d'équilibrage de charge. } }
answer: { optionId: a }
explanation:
  correct:
    en: An HTTP or HTTPS probe is marked up only when the endpoint returns HTTP 200. Any other status code, such as 404, immediately marks the instance down, even if the port is listening and the network path is open. Pointing the probe to a path that returns 200 (or creating that page) fixes the issue.
    fr: "Une sonde HTTP ou HTTPS n'est considérée comme réussie que si le point de terminaison renvoie HTTP 200. Tout autre code d'état, comme 404, marque immédiatement l'instance comme défaillante, même si le port écoute et que le chemin réseau est ouvert. Faire pointer la sonde vers un chemin qui renvoie 200 (ou créer cette page) résout le problème."
  options:
    b: { en: A longer interval does not change the response code; the probe still receives 404 and fails., fr: Un intervalle plus long ne change pas le code de réponse ; la sonde reçoit toujours 404 et échoue. }
    c: { en: "The network path is already open (default AllowAzureLoadBalancerInBound rule), and probes do not come from the VirtualNetwork tag.", fr: "Le chemin réseau est déjà ouvert (règle par défaut AllowAzureLoadBalancerInBound), et les sondes ne proviennent pas de l'étiquette VirtualNetwork." }
    d: { en: Session persistence only changes how flows are distributed among healthy instances; no instance is healthy here., fr: "La persistance de session modifie seulement la répartition des flux entre instances saines ; aucune instance n'est saine ici." }
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
