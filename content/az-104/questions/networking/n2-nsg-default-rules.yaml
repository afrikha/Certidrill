id: n2-nsg-default-rules
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a network security group named **NSG1** and associate it with a subnet named **Subnet1** in **VNet1**. You do not add any custom security rules to NSG1. VNet1 is peered with **VNet2**.

    Which statement about the traffic to or from the VMs in Subnet1 is true?
  fr: |
    Vous créez un groupe de sécurité réseau nommé **NSG1** et l'associez à un sous-réseau nommé **Subnet1** de **VNet1**. Vous n'ajoutez aucune règle de sécurité personnalisée à NSG1. VNet1 est appairé avec **VNet2**.

    Quelle affirmation concernant le trafic vers ou depuis les machines virtuelles de Subnet1 est vraie ?
body:
  options:
    - { id: a, text: { en: "Inbound traffic from the VMs in VNet2 is allowed without any custom rule.", fr: "Le trafic entrant provenant des machines virtuelles de VNet2 est autorisé sans règle personnalisée." } }
    - { id: b, text: { en: "Inbound RDP traffic (TCP 3389) from the internet is allowed without any custom rule.", fr: "Le trafic RDP entrant (TCP 3389) provenant d'Internet est autorisé sans règle personnalisée." } }
    - { id: c, text: { en: "Outbound traffic to the internet is denied until you add an outbound rule.", fr: "Le trafic sortant vers Internet est refusé tant que vous n'ajoutez pas de règle sortante." } }
    - { id: d, text: { en: "Health probes from Azure Load Balancer are denied until you add an inbound rule.", fr: "Les sondes d'intégrité d'Azure Load Balancer sont refusées tant que vous n'ajoutez pas de règle entrante." } }
answer: { optionId: a }
explanation:
  correct:
    en: Every NSG contains default rules. AllowVNetInBound (65000) allows traffic whose source and destination are the VirtualNetwork service tag, which includes the address space of peered virtual networks. Inbound internet traffic is blocked by DenyAllInbound (65500).
    fr: Chaque NSG contient des règles par défaut. AllowVNetInBound (65000) autorise le trafic dont la source et la destination correspondent à l'étiquette de service VirtualNetwork, qui inclut l'espace d'adressage des réseaux virtuels appairés. Le trafic entrant depuis Internet est bloqué par DenyAllInbound (65500).
  options:
    b: { en: No default rule allows inbound traffic from the internet; DenyAllInbound blocks it., fr: "Aucune règle par défaut n'autorise le trafic entrant depuis Internet ; DenyAllInbound le bloque." }
    c: { en: "The default rule AllowInternetOutBound (65001) allows outbound internet traffic.", fr: "La règle par défaut AllowInternetOutBound (65001) autorise le trafic sortant vers Internet." }
    d: { en: "The default rule AllowAzureLoadBalancerInBound (65001) allows the health probes.", fr: "La règle par défaut AllowAzureLoadBalancerInBound (65001) autorise les sondes d'intégrité." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - title: Azure service tags overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
