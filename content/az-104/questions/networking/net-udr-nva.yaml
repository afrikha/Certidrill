id: net-udr-nva
objective: "4.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A virtual network named **VNet1** contains a subnet named **Workload** and a network virtual appliance (NVA) with the private IP address 10.0.9.4. IP forwarding is already enabled on the NVA's network interface.

    You need all the internet-bound traffic from the Workload subnet to go through the NVA.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un réseau virtuel nommé **VNet1** contient un sous-réseau nommé **Workload** et une appliance virtuelle réseau (NVA) d'adresse IP privée 10.0.9.4. Le transfert IP est déjà activé sur l'interface réseau de la NVA.

    Tout le trafic à destination d'Internet issu du sous-réseau Workload doit passer par la NVA.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rt, text: { en: Create a route table., fr: Créer une table de routage. } }
    - { id: route, text: { en: "Add a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the address 10.0.9.4.", fr: "Ajouter un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.0.9.4." } }
    - { id: assoc, text: { en: Associate the route table with the Workload subnet., fr: Associer la table de routage au sous-réseau Workload. } }
    - { id: nat, text: { en: Create a NAT gateway and associate it with the Workload subnet., fr: Créer une passerelle NAT et l'associer au sous-réseau Workload. } }
    - { id: nsg, text: { en: Create a network security group with an outbound rule allowing the internet., fr: Créer un groupe de sécurité réseau avec une règle sortante autorisant Internet. } }
    - { id: gw, text: { en: Associate the route table with GatewaySubnet., fr: Associer la table de routage à GatewaySubnet. } }
answer:
  sequence: [ rt, route, assoc ]
explanation:
  correct:
    en: |
      A user-defined route lives in a route table, so you create the table, add the route, and then associate the table with the subnet. The default route 0.0.0.0/0 with the next hop type Virtual appliance overrides the system route to the internet, and it only applies to the subnets the route table is associated with.
    fr: |
      Un itinéraire défini par l'utilisateur se trouve dans une table de routage : vous créez la table, vous y ajoutez l'itinéraire, puis vous l'associez au sous-réseau. L'itinéraire par défaut 0.0.0.0/0 avec le type de tronçon suivant Appliance virtuelle remplace l'itinéraire système vers Internet, et il ne s'applique qu'aux sous-réseaux associés à la table de routage.
  options:
    nat: { en: "A NAT gateway provides outbound connectivity but bypasses the NVA.", fr: "Une passerelle NAT fournit la connectivité sortante mais contourne la NVA." }
    nsg: { en: "An NSG filters traffic but cannot change its next hop, so the traffic would not go through the NVA.", fr: "Un groupe de sécurité réseau filtre le trafic mais ne peut pas changer son tronçon suivant : le trafic ne passerait pas par la NVA." }
    gw: { en: "The route must apply to the Workload subnet, not to the gateway subnet.", fr: "L'itinéraire doit s'appliquer au sous-réseau Workload, pas au sous-réseau de passerelle." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
