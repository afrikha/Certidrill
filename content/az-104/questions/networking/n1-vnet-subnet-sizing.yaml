id: n1-vnet-subnet-sizing
objective: "4.1.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has a virtual network named **VNet-Prod** with the address space 10.40.0.0/16.

    You need to add a subnet that will host 60 virtual machines. Each virtual machine has one network interface with one private IP address. No other resource will be deployed in the subnet. The solution must use the smallest possible address range.

    Which subnet size should you use?
  fr: |
    Fabrikam dispose d'un réseau virtuel nommé **VNet-Prod** dont l'espace d'adressage est 10.40.0.0/16.

    Vous devez ajouter un sous-réseau qui hébergera 60 machines virtuelles. Chaque machine virtuelle possède une interface réseau avec une adresse IP privée. Aucune autre ressource ne sera déployée dans le sous-réseau. La solution doit utiliser la plus petite plage d'adresses possible.

    Quelle taille de sous-réseau devez-vous utiliser ?
body:
  options:
    - { id: a, text: /23 }
    - { id: b, text: /24 }
    - { id: c, text: /25 }
    - { id: d, text: /26 }
answer: { optionId: c }
explanation:
  correct:
    en: Azure reserves five addresses in every subnet. A /26 contains 64 addresses, which leaves only 59 usable addresses - one short of the 60 required. A /25 contains 128 addresses (123 usable), so it is the smallest range that fits.
    fr: "Azure réserve cinq adresses dans chaque sous-réseau. Un /26 contient 64 adresses, ce qui ne laisse que 59 adresses utilisables, soit une de moins que les 60 nécessaires. Un /25 contient 128 adresses (123 utilisables) : c'est la plus petite plage qui convient."
  options:
    a: { en: "A /23 (507 usable addresses) fits, but it is four times larger than the smallest range that fits.", fr: "Un /23 (507 adresses utilisables) convient, mais il est quatre fois plus grand que la plus petite plage qui convient." }
    b: { en: "A /24 (251 usable addresses) fits, but a /25 is smaller and still large enough.", fr: "Un /24 (251 adresses utilisables) convient, mais un /25 est plus petit et reste suffisant." }
    d: { en: "64 minus the 5 reserved addresses leaves 59 usable addresses, which is not enough for 60 VMs.", fr: "64 moins les 5 adresses réservées laisse 59 adresses utilisables, ce qui ne suffit pas pour 60 machines virtuelles." }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
