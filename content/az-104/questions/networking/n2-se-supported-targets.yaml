id: n2-se-supported-targets
objective: "4.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** in the West Europe region. You plan to enable service endpoints on **Subnet1** of VNet1 and then add a virtual network rule for Subnet1 to the network settings of Azure resources, so that they accept traffic from Subnet1 over the service endpoint.

    For which two resources can you use this approach? Each correct answer presents a complete solution.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dans la région West Europe. Vous prévoyez d'activer des points de terminaison de service sur **Subnet1** de VNet1, puis d'ajouter une règle de réseau virtuel pour Subnet1 dans les paramètres réseau de ressources Azure, afin qu'elles acceptent le trafic de Subnet1 via le point de terminaison de service.

    Pour quelles deux ressources pouvez-vous utiliser cette approche ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: An Azure SQL Database logical server in West Europe, fr: Un serveur logique Azure SQL Database en West Europe } }
    - { id: b, text: { en: An Azure Key Vault in North Europe, fr: Un coffre Azure Key Vault en North Europe } }
    - { id: c, text: { en: An Azure SQL Database logical server in North Europe, fr: Un serveur logique Azure SQL Database en North Europe } }
    - { id: d, text: { en: A Log Analytics workspace in West Europe, fr: Un espace de travail Log Analytics en West Europe } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: Azure SQL Database supports service endpoints (Microsoft.Sql), but only for virtual networks in the same region as the server. For other supported services, such as Azure Key Vault (Microsoft.KeyVault), the resource can be secured to virtual networks in any region.
    fr: "Azure SQL Database prend en charge les points de terminaison de service (Microsoft.Sql), mais uniquement pour des réseaux virtuels situés dans la même région que le serveur. Pour les autres services pris en charge, comme Azure Key Vault (Microsoft.KeyVault), la ressource peut être sécurisée sur des réseaux virtuels de n'importe quelle région."
  options:
    c: { en: For Azure SQL Database the virtual network must be in the same region as the server., fr: "Pour Azure SQL Database, le réseau virtuel doit se trouver dans la même région que le serveur." }
    d: { en: Log Analytics is not in the list of services that support virtual network service endpoints; use Azure Monitor Private Link Scope instead., fr: "Log Analytics ne figure pas dans la liste des services qui prennent en charge les points de terminaison de service ; utilisez plutôt une étendue Azure Monitor Private Link." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
