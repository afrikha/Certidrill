id: n3-lbt-new-vm-down
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a public Standard Load Balancer named **LB2** with a TCP health probe on port 8080. You add a new virtual machine named **VM4** to the backend pool. VM4 runs in the same subnet as the three existing virtual machines, which are healthy.

    The **Health Probe Status** metric, split by backend IP address, shows 0 percent for VM4, and VM4 receives no load-balanced traffic. The subnet NSG keeps all the default inbound rules and has no custom deny rule.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un équilibreur de charge public Standard nommé **LB2** avec une sonde d'intégrité TCP sur le port 8080. Vous ajoutez une nouvelle machine virtuelle nommée **VM4** au pool principal. VM4 s'exécute dans le même sous-réseau que les trois machines virtuelles existantes, qui sont saines.

    La métrique **État de la sonde d'intégrité**, fractionnée par adresse IP du serveur principal, affiche 0 % pour VM4, et VM4 ne reçoit aucun trafic à charge équilibrée. Le NSG du sous-réseau conserve toutes les règles entrantes par défaut et n'a aucune règle de refus personnalisée.

    Quels sont les deux problèmes qui peuvent provoquer ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The application service on VM4 is not listening on TCP port 8080.", fr: "Le service d'application de VM4 n'écoute pas sur le port TCP 8080." } }
    - { id: b, text: { en: "The guest OS firewall of VM4 blocks inbound TCP 8080 from 168.63.129.16.", fr: "Le pare-feu du système d'exploitation invité de VM4 bloque le trafic TCP 8080 entrant provenant de 168.63.129.16." } }
    - { id: c, text: { en: "VM4 does not have a public IP address.", fr: "VM4 n'a pas d'adresse IP publique." } }
    - { id: d, text: { en: "Session persistence on the load-balancing rule is set to None.", fr: "La persistance de session de la règle d'équilibrage de charge est définie sur Aucune." } }
    - { id: e, text: { en: Floating IP is disabled on the load-balancing rule., fr: "L'IP flottante est désactivée dans la règle d'équilibrage de charge." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: A TCP probe fails when nothing answers the handshake on the probe port, either because no process listens on it (check with netstat) or because the guest OS firewall drops traffic from the probe source 168.63.129.16. The NSG is not the cause here because the default AllowAzureLoadBalancerInBound rule allows the probe.
    fr: "Une sonde TCP échoue quand rien ne répond à la négociation sur le port de sonde, soit parce qu'aucun processus n'écoute sur ce port (à vérifier avec netstat), soit parce que le pare-feu du système d'exploitation invité rejette le trafic provenant de la source de sonde 168.63.129.16. Le NSG n'est pas en cause ici, car la règle par défaut AllowAzureLoadBalancerInBound autorise la sonde."
  options:
    c: { en: Backend instances need only private IP addresses; the public IP is on the load balancer frontend., fr: "Les instances back-end n'ont besoin que d'adresses IP privées ; l'IP publique se trouve sur le front-end de l'équilibreur de charge." }
    d: { en: "None is the default five-tuple distribution and has no effect on probe results.", fr: "Aucune est la distribution par défaut à cinq tuples et n'a aucun effet sur le résultat des sondes." }
    e: { en: "Floating IP is disabled by default, and the three other virtual machines are healthy with the same rule; it does not affect the probe.", fr: "L'IP flottante est désactivée par défaut, et les trois autres machines virtuelles sont saines avec la même règle ; elle n'a pas d'effet sur la sonde." }
references:
  - title: Troubleshoot Azure Load Balancer health probe status
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/load-balancer/load-balancer-troubleshoot-health-probe-status
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
