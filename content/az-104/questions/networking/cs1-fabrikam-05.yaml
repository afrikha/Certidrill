id: cs1-fabrikam-05
objective: "4.2.5"
type: dropdown
caseStudy: cs1-fabrikam
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the private access requirement for stfabanalytics.

    How should you complete the configuration? Select the appropriate options in the answer area.
  fr: |
    Vous devez satisfaire l'exigence d'accès privé pour stfabanalytics.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      1. Create a private endpoint for stfabanalytics in the Endpoints subnet, with the target sub-resource [[sub]].
      2. Integrate the private endpoint with a private DNS zone named [[zone]].
      3. Link the private DNS zone to [[link]].
      4. Set Public network access of stfabanalytics to Disabled.
    fr: |
      1. Créez un point de terminaison privé pour stfabanalytics dans le sous-réseau Endpoints, avec la sous-ressource cible [[sub]].
      2. Intégrez le point de terminaison privé à une zone DNS privée nommée [[zone]].
      3. Liez la zone DNS privée à [[link]].
      4. Définissez l'option Accès réseau public de stfabanalytics sur Désactivé.
  slots:
    - id: sub
      options:
        - { id: blob, text: blob }
        - { id: file, text: file }
        - { id: dfs, text: dfs }
        - { id: web, text: web }
    - id: zone
      options:
        - { id: plblob, text: privatelink.blob.core.windows.net }
        - { id: pubzone, text: blob.core.windows.net }
        - { id: plfab, text: privatelink.fabrikam.com }
    - id: link
      options:
        - { id: corp, text: VNet-Corp }
        - { id: plantus, text: VNet-PlantUS }
        - { id: none, text: { en: "no virtual network", fr: "aucun réseau virtuel" } }
answer:
  values: { sub: blob, zone: plblob, link: corp }
explanation:
  correct:
    en: |
      VM-ERP1 uses the blob service, so the private endpoint targets the blob sub-resource. Azure Storage private endpoints use the privatelink.blob.core.windows.net zone; the public name stfabanalytics.blob.core.windows.net is a CNAME to stfabanalytics.privatelink.blob.core.windows.net, which the zone resolves to the private IP. The zone must be linked to VNet-Corp, where VM-ERP1 resolves names.
    fr: |
      VM-ERP1 utilise le service blob ; le point de terminaison privé cible donc la sous-ressource blob. Les points de terminaison privés de Stockage Azure utilisent la zone privatelink.blob.core.windows.net ; le nom public stfabanalytics.blob.core.windows.net est un CNAME vers stfabanalytics.privatelink.blob.core.windows.net, que la zone résout en adresse IP privée. La zone doit être liée à VNet-Corp, où VM-ERP1 résout les noms.
  options:
    pubzone: { en: "A private zone named blob.core.windows.net would capture the names of every storage account, including accounts without a private endpoint.", fr: "Une zone privée nommée blob.core.windows.net intercepterait les noms de tous les comptes de stockage, y compris ceux qui n'ont pas de point de terminaison privé." }
    plantus: { en: "VM-ERP1 is in VNet-Corp; a link to VNet-PlantUS does not change name resolution in VNet-Corp.", fr: "VM-ERP1 se trouve dans VNet-Corp ; un lien vers VNet-PlantUS ne modifie pas la résolution de noms dans VNet-Corp." }
    none: { en: "A private DNS zone answers queries only from the virtual networks linked to it.", fr: "Une zone DNS privée ne répond qu'aux requêtes des réseaux virtuels qui lui sont liés." }
references:
  - title: Use private endpoints - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
