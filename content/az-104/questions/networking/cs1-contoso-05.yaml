id: cs1-contoso-05
objective: "4.1.2"
type: dropdown
caseStudy: cs1-contoso
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the connectivity requirement for the store systems in VNet-Stores.

    How should you configure the virtual network peering? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de connectivité des systèmes des magasins situés dans VNet-Stores.

    Comment devez-vous configurer le peering de réseaux virtuels ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On the peering from VNet-Hub to VNet-Stores, enable [[hub]].
      On the peering from VNet-Stores to VNet-Hub, enable [[spoke]].
    fr: |
      Sur le peering de VNet-Hub vers VNet-Stores, activez [[hub]].
      Sur le peering de VNet-Stores vers VNet-Hub, activez [[spoke]].
  slots:
    - id: hub
      options:
        - { id: transit, text: { en: "Allow gateway transit (allowGatewayTransit)", fr: "le transit par passerelle (allowGatewayTransit)" } }
        - { id: remote, text: { en: "Use remote gateways (useRemoteGateways)", fr: "l'utilisation des passerelles distantes (useRemoteGateways)" } }
        - { id: forwarded, text: { en: "Allow forwarded traffic (allowForwardedTraffic) only", fr: "uniquement le trafic transféré (allowForwardedTraffic)" } }
    - id: spoke
      options:
        - { id: transit, text: { en: "Allow gateway transit (allowGatewayTransit)", fr: "le transit par passerelle (allowGatewayTransit)" } }
        - { id: remote, text: { en: "Use remote gateways (useRemoteGateways)", fr: "l'utilisation des passerelles distantes (useRemoteGateways)" } }
        - { id: forwarded, text: { en: "Allow forwarded traffic (allowForwardedTraffic) only", fr: "uniquement le trafic transféré (allowForwardedTraffic)" } }
answer:
  values: { hub: transit, spoke: remote }
explanation:
  correct:
    en: |
      With gateway transit, the virtual network that hosts the VPN gateway (VNet-Hub) allows its peers to use the gateway, and the peered virtual network without a gateway (VNet-Stores) is set to use the remote gateway. VNet-Stores then learns the head office routes through VPNGW1 without deploying its own gateway.
    fr: |
      Avec le transit par passerelle, le réseau virtuel qui héberge la passerelle VPN (VNet-Hub) autorise ses pairs à l'utiliser, et le réseau virtuel appairé sans passerelle (VNet-Stores) est configuré pour utiliser la passerelle distante. VNet-Stores apprend alors les routes du siège via VPNGW1 sans déployer sa propre passerelle.
  options:
    forwarded: { en: "Allowing forwarded traffic accepts traffic that did not originate in the peer, but does not let VNet-Stores use VPNGW1.", fr: "Autoriser le trafic transféré accepte le trafic qui ne provient pas du pair, mais ne permet pas à VNet-Stores d'utiliser VPNGW1." }
references:
  - title: Configure VPN gateway transit for virtual network peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
