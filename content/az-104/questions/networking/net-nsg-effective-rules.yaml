id: net-nsg-effective-rules
objective: "4.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A virtual machine named **VM1** has a public IP address and is connected to a subnet that has the network security group **NSG1**. No other NSG applies to VM1. The inbound security rules of NSG1 are shown in the following table.

    Answer each prompt by selecting the rule that processes the traffic.
  fr: |
    Une machine virtuelle nommée **VM1** possède une adresse IP publique et est connectée à un sous-réseau associé au groupe de sécurité réseau **NSG1**. Aucun autre NSG ne s'applique à VM1. Les règles de sécurité entrantes de NSG1 figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.
body:
  prompts:
    - id: p1
      text: { en: RDP (TCP 3389) from a computer on the internet to VM1, fr: RDP (TCP 3389) depuis un ordinateur sur Internet vers VM1 }
    - id: p2
      text: { en: RDP (TCP 3389) from a VM in the same virtual network to VM1, fr: RDP (TCP 3389) depuis une machine virtuelle du même réseau virtuel vers VM1 }
  grid:
    header: [{ en: Priority, fr: Priorité }, { en: Name, fr: Nom }, Port, { en: Source, fr: Source }, Action]
    rows:
      - [{ text: "100" }, { text: Allow-HTTPS, area: r100 }, { text: "443" }, { text: Any }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-RDP-Internet, area: r200 }, { text: "3389" }, { text: Internet }, { text: Deny }]
      - [{ text: "300" }, { text: Allow-RDP-Any, area: r300 }, { text: "3389" }, { text: Any }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: Any }, { text: VirtualNetwork }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: Any }, { text: AzureLoadBalancer }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r200, p2: r300 }
explanation:
  correct:
    en: Rules are evaluated by priority, lowest number first, and processing stops at the first match. Internet RDP traffic matches Deny-RDP-Internet (200) first. Traffic from the virtual network does not match the Internet service tag, so the next matching rule is Allow-RDP-Any (300), evaluated before the default AllowVnetInBound (65000).
    fr: "Les règles sont évaluées par priorité, du plus petit numéro au plus grand, et le traitement s'arrête à la première correspondance. Le trafic RDP venant d'Internet correspond d'abord à Deny-RDP-Internet (200). Le trafic issu du réseau virtuel ne correspond pas à l'étiquette de service Internet : la règle suivante qui correspond est Allow-RDP-Any (300), évaluée avant la règle par défaut AllowVnetInBound (65000)."
references:
  - title: Network security groups — security rules
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
