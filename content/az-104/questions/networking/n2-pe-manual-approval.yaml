id: n2-pe-manual-approval
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator at Adatum creates a private endpoint in an Adatum virtual network that targets an Azure SQL Database logical server owned by another team. The administrator has no permissions on the logical server and uses the **manual** connection approval method.

    What is the state of the private endpoint connection until the server owner acts, and can traffic flow?
  fr: |
    Un administrateur d'Adatum crée, dans un réseau virtuel d'Adatum, un point de terminaison privé qui cible un serveur logique Azure SQL Database appartenant à une autre équipe. L'administrateur n'a aucune autorisation sur le serveur logique et utilise la méthode d'approbation **manuelle** de la connexion.

    Quel est l'état de la connexion de point de terminaison privé tant que le propriétaire du serveur n'a pas agi, et le trafic peut-il circuler ?
body:
  options:
    - { id: a, text: { en: "Pending; no traffic flows until the server owner approves the connection", fr: "En attente ; aucun trafic ne circule tant que le propriétaire du serveur n'a pas approuvé la connexion" } }
    - { id: b, text: { en: "Approved; traffic flows immediately because the request message is optional", fr: "Approuvée ; le trafic circule immédiatement, car le message de requête est facultatif" } }
    - { id: c, text: { en: "Disconnected; the administrator must recreate the endpoint with automatic approval", fr: "Déconnectée ; l'administrateur doit recréer le point de terminaison avec l'approbation automatique" } }
    - { id: d, text: { en: "Pending; traffic flows through the public endpoint of the server until approval", fr: "En attente ; le trafic passe par le point de terminaison public du serveur jusqu'à l'approbation" } }
answer: { optionId: a }
explanation:
  correct:
    en: With the manual method, the private endpoint connection is created in the Pending state, and the owner of the private link resource approves or rejects it. Only connections in the Approved state can send traffic to the resource.
    fr: "Avec la méthode manuelle, la connexion de point de terminaison privé est créée dans l'état En attente, et le propriétaire de la ressource de liaison privée l'approuve ou la rejette. Seules les connexions à l'état Approuvée peuvent envoyer du trafic vers la ressource."
  options:
    b: { en: Automatic approval requires permissions on the target resource., fr: L'approbation automatique exige des autorisations sur la ressource cible. }
    c: { en: Disconnected is the state after the resource owner deletes the connection., fr: Déconnectée est l'état obtenu lorsque le propriétaire de la ressource supprime la connexion. }
    d: { en: A pending private endpoint does not redirect traffic anywhere; access through the public endpoint depends only on the server firewall., fr: "Un point de terminaison privé en attente ne redirige aucun trafic ; l'accès par le point de terminaison public ne dépend que du pare-feu du serveur." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
