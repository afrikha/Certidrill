id: n1-vnet-subnet-29-usable
objective: "4.1.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have a virtual network named **VNet1** that uses the address space 10.30.0.0/16.

    You plan to add a subnet named **Mgmt** with the address range 10.30.4.0/29 for a few management virtual machines.

    How many IP addresses in Mgmt can you assign to network interfaces?
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** qui utilise l'espace d'adressage 10.30.0.0/16.

    Vous prévoyez d'ajouter un sous-réseau nommé **Mgmt** avec la plage d'adresses 10.30.4.0/29 pour quelques machines virtuelles d'administration.

    Combien d'adresses IP de Mgmt pouvez-vous attribuer à des interfaces réseau ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "5" }
    - { id: c, text: "6" }
    - { id: d, text: "8" }
answer: { optionId: a }
explanation:
  correct:
    en: A /29 range contains 8 addresses. Azure reserves five of them in every subnet - the network address (.0), the default gateway (.1), two addresses that map Azure DNS (.2 and .3) and the broadcast address (.7) - so only 3 addresses are left for resources. /29 is also the smallest IPv4 subnet Azure supports.
    fr: "Une plage /29 contient 8 adresses. Azure en réserve cinq dans chaque sous-réseau : l'adresse réseau (.0), la passerelle par défaut (.1), deux adresses qui mappent Azure DNS (.2 et .3) et l'adresse de diffusion (.7). Il ne reste donc que 3 adresses pour les ressources. /29 est aussi le plus petit sous-réseau IPv4 pris en charge par Azure."
  options:
    b: { en: Five is the number of addresses Azure reserves, not the number left., fr: Cinq est le nombre d'adresses réservées par Azure, pas le nombre restant. }
    c: { en: Six only removes the network and broadcast addresses, as on a traditional network; Azure also reserves .1, .2 and .3., fr: "Six ne retire que l'adresse réseau et l'adresse de diffusion, comme sur un réseau classique ; Azure réserve aussi .1, .2 et .3." }
    d: { en: Eight is the size of the range before the five reserved addresses are removed., fr: Huit est la taille de la plage avant le retrait des cinq adresses réservées. }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
