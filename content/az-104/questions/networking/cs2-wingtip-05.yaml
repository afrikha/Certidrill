id: cs2-wingtip-05
objective: "4.3.1"
type: dropdown
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the name resolution requirement for shop.wingtip.internal.

    How should you configure name resolution? To answer, select the appropriate options in the answer area.
  fr: |
    Vous devez satisfaire l'exigence de résolution de noms pour shop.wingtip.internal.

    Comment devez-vous configurer la résolution de noms ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Create shop.wingtip.internal as a: [[zone]]

      Virtual network link for VNet-Shop: [[shop]]

      Virtual network link for VNet-Ops: [[ops]]
    fr: |
      Créer shop.wingtip.internal en tant que : [[zone]]

      Lien de réseau virtuel pour VNet-Shop : [[shop]]

      Lien de réseau virtuel pour VNet-Ops : [[ops]]
  slots:
    - id: zone
      options:
        - { id: private, text: { en: "Private DNS zone", fr: "Zone DNS privée" } }
        - { id: public, text: { en: "Public DNS zone", fr: "Zone DNS publique" } }
    - id: shop
      options:
        - { id: auto, text: { en: "Autoregistration enabled", fr: "Inscription automatique activée" } }
        - { id: noauto, text: { en: "Autoregistration disabled", fr: "Inscription automatique désactivée" } }
        - { id: nolink, text: { en: "No link (the peering is enough)", fr: "Aucun lien (le peering suffit)" } }
    - id: ops
      options:
        - { id: auto, text: { en: "Autoregistration enabled", fr: "Inscription automatique activée" } }
        - { id: noauto, text: { en: "Autoregistration disabled", fr: "Inscription automatique désactivée" } }
        - { id: nolink, text: { en: "No link (the peering is enough)", fr: "Aucun lien (le peering suffit)" } }
answer:
  values: { zone: private, shop: auto, ops: noauto }
explanation:
  correct:
    en: |
      A private DNS zone resolves names inside the linked virtual networks. With autoregistration enabled on the VNet-Shop link, Azure creates an A record for each virtual machine of VNet-Shop. VNet-Ops needs its own link to resolve the zone, because peering does not share private DNS zones; autoregistration stays disabled so that its virtual machines do not register.
    fr: |
      Une zone DNS privée résout les noms dans les réseaux virtuels liés. Avec l'inscription automatique activée sur le lien de VNet-Shop, Azure crée un enregistrement A pour chaque machine virtuelle de VNet-Shop. VNet-Ops a besoin de son propre lien pour résoudre la zone, car le peering ne partage pas les zones DNS privées ; l'inscription automatique reste désactivée pour que ses machines virtuelles ne s'inscrivent pas.
  options:
    public: { en: "A public zone is resolved from the internet and does not support autoregistration.", fr: "Une zone publique est résolue depuis Internet et ne prend pas en charge l'inscription automatique." }
    nolink: { en: "A virtual network resolves a private zone only through a virtual network link; peering does not share it.", fr: "Un réseau virtuel ne résout une zone privée que par un lien de réseau virtuel ; le peering ne la partage pas." }
references:
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: What is a virtual network link?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
