id: cs2-wingtip-05
objective: "4.3.1"
type: dropdown
caseStudy: cs2-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the DNS requirement for wingtiptoys.com. You will add www.wingtiptoys.com as a custom domain of ca-storefront.

    How should you complete the configuration? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence DNS concernant wingtiptoys.com. Vous ajouterez www.wingtiptoys.com comme domaine personnalisé de ca-storefront.

    Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. In RG-Shop, create wingtiptoys.com as [[zone]].

      2. At the domain registrar: [[registrar]]

      3. In the zone, create [[record]] for www whose value is the generated domain name of ca-storefront, and a TXT record named asuid.www that contains the domain verification code.
    fr: |
      1. Dans RG-Shop, créez wingtiptoys.com en tant que [[zone]].

      2. Auprès du bureau d'enregistrement : [[registrar]]

      3. Dans la zone, créez [[record]] pour www dont la valeur est le nom de domaine généré de ca-storefront, et un enregistrement TXT nommé asuid.www qui contient le code de vérification du domaine.
  slots:
    - id: zone
      options:
        - { id: public, text: { en: "an Azure DNS public zone", fr: "zone DNS publique Azure" } }
        - { id: private, text: { en: "an Azure DNS private zone", fr: "zone DNS privée Azure" } }
        - { id: privlinked, text: { en: "an Azure DNS private zone linked to VNet-Shop", fr: "zone DNS privée Azure liée à VNet-Shop" } }
    - id: registrar
      options:
        - { id: ns, text: { en: "Replace the name servers of the domain with the four Azure DNS name servers assigned to the zone", fr: "Remplacez les serveurs de noms du domaine par les quatre serveurs de noms Azure DNS attribués à la zone" } }
        - { id: cname, text: { en: "Create a CNAME record for wingtiptoys.com that points to the Azure DNS zone", fr: "Créez un enregistrement CNAME pour wingtiptoys.com qui pointe vers la zone Azure DNS" } }
        - { id: soa, text: { en: "Replace the SOA record of the domain with the SOA record of the Azure DNS zone", fr: "Remplacez l'enregistrement SOA du domaine par l'enregistrement SOA de la zone Azure DNS" } }
    - id: record
      options:
        - { id: cnamerec, text: { en: "a CNAME record", fr: "un enregistrement CNAME" } }
        - { id: arec, text: { en: "an A record", fr: "un enregistrement A" } }
        - { id: alias, text: { en: "an alias record set of type A", fr: "un jeu d'enregistrements d'alias de type A" } }
answer:
  values: { zone: public, registrar: ns, record: cnamerec }
explanation:
  correct:
    en: |
      Customers resolve www.wingtiptoys.com from the internet, so the zone must be an Azure DNS public zone. To delegate the domain to Azure DNS, you replace the NS records at the registrar with the name servers that Azure DNS assigned to the zone. Container Apps validates a subdomain with a CNAME record that points to the generated domain name of the app and a TXT record named asuid.<subdomain>.
    fr: |
      Les clients résolvent www.wingtiptoys.com depuis Internet ; la zone doit donc être une zone DNS publique Azure. Pour déléguer le domaine à Azure DNS, vous remplacez les enregistrements NS chez le bureau d'enregistrement par les serveurs de noms qu'Azure DNS a attribués à la zone. Container Apps valide un sous-domaine avec un enregistrement CNAME qui pointe vers le nom de domaine généré de l'application et un enregistrement TXT nommé asuid.<sous-domaine>.
  options:
    private: { en: "A private zone is resolved only from linked virtual networks, not by customers on the internet.", fr: "Une zone privée n'est résolue que depuis les réseaux virtuels liés, pas par les clients sur Internet." }
    privlinked: { en: "Linking the private zone to VNet-Shop still does not make it resolvable from the internet.", fr: "Lier la zone privée à VNet-Shop ne la rend toujours pas résolvable depuis Internet." }
    cname: { en: "A domain is delegated with NS records; a CNAME record cannot be created at the zone apex.", fr: "Un domaine est délégué avec des enregistrements NS ; un enregistrement CNAME ne peut pas être créé à l'apex de la zone." }
    soa: { en: "The SOA record is not used for delegation; the parent zone needs the NS records of Azure DNS.", fr: "L'enregistrement SOA ne sert pas à la délégation ; la zone parente a besoin des enregistrements NS d'Azure DNS." }
    arec: { en: "An A record contains an IP address; it cannot point to the generated domain name of the app.", fr: "Un enregistrement A contient une adresse IP ; il ne peut pas pointer vers le nom de domaine généré de l'application." }
    alias: { en: "Alias record sets target Azure resources such as public IP addresses, Traffic Manager profiles, or Azure Front Door, not a container app.", fr: "Les jeux d'enregistrements d'alias ciblent des ressources Azure comme des adresses IP publiques, des profils Traffic Manager ou Azure Front Door, pas une application de conteneur." }
references:
  - title: "Tutorial: Host your domain in Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
  - title: "Custom Domain Names and Free Managed Certificates in Container Apps"
    url: https://learn.microsoft.com/en-us/azure/container-apps/custom-domains-managed-certificates
