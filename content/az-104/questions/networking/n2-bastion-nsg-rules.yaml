id: n2-bastion-nsg-rules
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys Azure Bastion (Standard SKU) in **VNet1** and wants to associate a network security group named **NSG-Bastion** with **AzureBastionSubnet**. The target VMs are in **Subnet-App**, which is associated with **NSG-App**. Default ports 3389 and 22 are used.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie Azure Bastion (référence SKU Standard) dans **VNet1** et souhaite associer un groupe de sécurité réseau nommé **NSG-Bastion** à **AzureBastionSubnet**. Les machines virtuelles cibles se trouvent dans **Subnet-App**, associé à **NSG-App**. Les ports par défaut 3389 et 22 sont utilisés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "NSG-Bastion must allow inbound TCP 443 from the GatewayManager service tag.", fr: "NSG-Bastion doit autoriser le trafic entrant TCP 443 depuis l'étiquette de service GatewayManager." }
    - id: s2
      text: { en: "NSG-Bastion must allow inbound TCP 3389 from the Internet service tag.", fr: "NSG-Bastion doit autoriser le trafic entrant TCP 3389 depuis l'étiquette de service Internet." }
    - id: s3
      text:
        en: "NSG-App contains the default rules and one custom inbound rule, with priority 4000, that denies all traffic from the VirtualNetwork service tag. With this configuration, RDP and SSH sessions opened through Bastion to the VMs in Subnet-App are blocked."
        fr: "NSG-App contient les règles par défaut et une règle de sécurité entrante personnalisée, de priorité 4000, qui refuse tout le trafic provenant de l'étiquette de service VirtualNetwork. Avec cette configuration, les sessions RDP et SSH ouvertes via Bastion vers les machines virtuelles de Subnet-App sont bloquées."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: An NSG on AzureBastionSubnet must allow inbound 443 from Internet, GatewayManager and AzureLoadBalancer, and 8080/5701 within VirtualNetwork, plus the required outbound rules. Users reach Bastion over HTTPS, so 3389 and 22 are not needed inbound on AzureBastionSubnet. Bastion then opens RDP/SSH to the VMs from the private IP addresses of AzureBastionSubnet, which belong to the VirtualNetwork service tag; the default AllowVNetInBound rule (priority 65000) would allow this traffic, but the custom deny rule at priority 4000 is processed first and blocks it. To restore access, add to NSG-App an allow rule for TCP 3389 and 22 from the AzureBastionSubnet range with a priority number lower than 4000.
    fr: "Un NSG sur AzureBastionSubnet doit autoriser en entrée le port 443 depuis Internet, GatewayManager et AzureLoadBalancer, et les ports 8080/5701 au sein de VirtualNetwork, en plus des règles sortantes requises. Les utilisateurs joignent Bastion en HTTPS : 3389 et 22 ne sont pas nécessaires en entrée sur AzureBastionSubnet. Bastion ouvre ensuite RDP/SSH vers les machines virtuelles depuis les adresses IP privées d'AzureBastionSubnet, qui font partie de l'étiquette de service VirtualNetwork ; la règle par défaut AllowVNetInBound (priorité 65000) autoriserait ce trafic, mais la règle de refus personnalisée de priorité 4000 est traitée avant et le bloque. Pour rétablir l'accès, ajoutez à NSG-App une règle d'autorisation pour TCP 3389 et 22 depuis la plage d'AzureBastionSubnet, avec un numéro de priorité inférieur à 4000."
  options:
    s2:
      en: Inbound 3389 and 22 are not required on AzureBastionSubnet; users connect to Bastion over TCP 443.
      fr: Les ports 3389 et 22 ne sont pas nécessaires en entrée sur AzureBastionSubnet ; les utilisateurs se connectent à Bastion via TCP 443.
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
