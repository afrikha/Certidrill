id: n2-bastion-nsg-rules
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys Azure Bastion (Standard SKU) in **VNet1** and wants to associate a network security group named **NSG-Bastion** with **AzureBastionSubnet**. The target VMs are in **Subnet-App**, which is associated with **NSG-App**. Default ports 3389 and 22 are used.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.
  fr: |
    Woodgrove Bank déploie Azure Bastion (référence SKU Standard) dans **VNet1** et souhaite associer un groupe de sécurité réseau nommé **NSG-Bastion** à **AzureBastionSubnet**. Les machines virtuelles cibles se trouvent dans **Subnet-App**, associé à **NSG-App**. Les ports par défaut 3389 et 22 sont utilisés.

    Pour chacune des affirmations suivantes, sélectionnez Oui si elle est vraie. Sinon, sélectionnez Non.
body:
  statements:
    - id: s1
      text: { en: NSG-Bastion must allow inbound TCP 443 from the GatewayManager service tag., fr: NSG-Bastion doit autoriser le trafic entrant TCP 443 depuis l'étiquette de service GatewayManager. }
    - id: s2
      text: { en: NSG-Bastion must allow inbound TCP 3389 from the Internet service tag., fr: NSG-Bastion doit autoriser le trafic entrant TCP 3389 depuis l'étiquette de service Internet. }
    - id: s3
      text: { en: NSG-App must allow inbound TCP 3389 and 22 from the address range of AzureBastionSubnet., fr: NSG-App doit autoriser le trafic entrant TCP 3389 et 22 depuis la plage d'adresses d'AzureBastionSubnet. }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: An NSG on AzureBastionSubnet must allow inbound 443 from Internet, GatewayManager and AzureLoadBalancer, and 8080/5701 within VirtualNetwork, plus the required outbound rules. Users reach Bastion over HTTPS, so 3389 and 22 are not needed inbound on AzureBastionSubnet. Bastion then opens RDP/SSH to the VMs over their private IPs, so the target subnet must allow 3389 and 22 from the Bastion subnet.
    fr: "Un NSG sur AzureBastionSubnet doit autoriser en entrée le port 443 depuis Internet, GatewayManager et AzureLoadBalancer, et les ports 8080/5701 au sein de VirtualNetwork, en plus des règles sortantes requises. Les utilisateurs joignent Bastion en HTTPS : 3389 et 22 ne sont pas nécessaires en entrée sur AzureBastionSubnet. Bastion ouvre ensuite RDP/SSH vers les machines virtuelles via leurs IP privées : le sous-réseau cible doit autoriser 3389 et 22 depuis le sous-réseau Bastion."
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
