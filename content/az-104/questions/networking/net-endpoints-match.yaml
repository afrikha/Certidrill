id: net-endpoints-match
objective: "4.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the following connectivity requirements for workloads in a virtual network named **VNet1**.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.
  fr: |
    Vous devez satisfaire les exigences de connectivité suivantes pour des charges de travail d'un réseau virtuel nommé **VNet1**.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: pe, text: { en: Private endpoint, fr: Point de terminaison privé } }
    - { id: se, text: { en: Service endpoint, fr: Point de terminaison de service } }
    - { id: bastion, text: Azure Bastion }
    - { id: nat, text: NAT gateway }
    - { id: vpn, text: VPN gateway }
  targets:
    - id: t1
      text: { en: Reach a storage account through a private IP address from VNet1, fr: Joindre un compte de stockage via une adresse IP privée depuis VNet1 }
    - id: t2
      text: { en: Restrict a storage account to traffic from a subnet of VNet1 while it keeps its public endpoint, fr: Restreindre un compte de stockage au trafic d'un sous-réseau de VNet1 tout en conservant son point de terminaison public }
    - id: t3
      text: { en: Connect to VMs over RDP from the Azure portal without public IP addresses on the VMs, fr: Se connecter en RDP aux machines virtuelles depuis le portail Azure sans adresse IP publique sur les machines }
answer:
  mapping: { t1: pe, t2: se, t3: bastion }
explanation:
  correct:
    en: A private endpoint gives the service a private IP address in your virtual network. A service endpoint extends the subnet identity to the service, whose firewall can then allow only that subnet, but traffic still targets the public endpoint. Azure Bastion provides RDP/SSH from the portal over TLS without public IPs on the VMs. NAT gateway (outbound internet) and VPN gateway (hybrid connectivity) do not meet these needs.
    fr: Un point de terminaison privé donne au service une adresse IP privée dans votre réseau virtuel. Un point de terminaison de service étend l'identité du sous-réseau au service, dont le pare-feu peut alors n'autoriser que ce sous-réseau, mais le trafic vise toujours le point de terminaison public. Azure Bastion fournit RDP/SSH depuis le portail via TLS sans IP publique sur les machines. NAT gateway (sortie Internet) et VPN gateway (connectivité hybride) ne répondent pas à ces besoins.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
