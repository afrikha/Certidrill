id: net-peering-transitivity
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have three virtual networks:

    | Name | Region | Address space |
    | --- | --- | --- |
    | VNet1 | West Europe | 10.1.0.0/16 |
    | VNet2 | West Europe | 10.2.0.0/16 |
    | VNet3 | North Europe | 10.3.0.0/16 |

    VNet1 is peered with VNet2, and VNet2 is peered with VNet3. No gateway, network virtual appliance or user-defined route is configured.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de trois réseaux virtuels :

    | Nom | Région | Espace d'adressage |
    | --- | --- | --- |
    | VNet1 | West Europe | 10.1.0.0/16 |
    | VNet2 | West Europe | 10.2.0.0/16 |
    | VNet3 | North Europe | 10.3.0.0/16 |

    Un peering existe entre VNet1 et VNet2, et un autre entre VNet2 et VNet3. Aucune passerelle, aucune appliance virtuelle réseau et aucun itinéraire défini par l'utilisateur ne sont configurés.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A virtual machine in VNet1 can communicate with a virtual machine in VNet3.", fr: "Une machine virtuelle de VNet1 peut communiquer avec une machine virtuelle de VNet3." } }
    - { id: b, text: { en: "A virtual machine in VNet2 can communicate with a virtual machine in VNet3.", fr: "Une machine virtuelle de VNet2 peut communiquer avec une machine virtuelle de VNet3." } }
    - { id: c, text: { en: "Traffic between VNet1 and VNet2 stays on the Microsoft backbone network.", fr: "Le trafic entre VNet1 et VNet2 reste sur le réseau principal de Microsoft." } }
    - { id: d, text: { en: "Traffic between VNet2 and VNet3 goes over the public internet because the networks are in different regions.", fr: "Le trafic entre VNet2 et VNet3 passe par Internet, car les réseaux sont dans des régions différentes." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: VNet2 and VNet3 are directly peered (global peering works across regions), and peered traffic uses the Microsoft backbone, never the public internet. Peering is not transitive, so VNet1 cannot reach VNet3 through VNet2 without a gateway or an NVA with user-defined routes.
    fr: "VNet2 et VNet3 sont directement reliés par peering (le peering global fonctionne entre régions), et le trafic entre réseaux reliés par peering emprunte le réseau principal de Microsoft, jamais Internet. Le peering n'est pas transitif : VNet1 ne peut pas joindre VNet3 via VNet2 sans passerelle ni appliance virtuelle réseau associée à des itinéraires définis par l'utilisateur."
  options:
    a: { en: "Peering is not transitive: VNet1 and VNet3 are not peered with each other.", fr: "Le peering n'est pas transitif : VNet1 et VNet3 ne sont pas reliés entre eux par peering." }
    d: { en: "Global peering also uses the Microsoft backbone; traffic never crosses the public internet.", fr: "Le peering global utilise lui aussi le réseau principal de Microsoft ; le trafic ne passe jamais par Internet." }
references:
  - title: Azure Virtual Network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
