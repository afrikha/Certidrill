id: n2-service-tags-match
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are creating security rules in a network security group named **NSG1**. VNet1, the virtual network that uses NSG1, is peered with VNet2 and connected to an on-premises network through a site-to-site VPN.

    Which service tag should you use for each requirement? To answer, drag the appropriate service tags to the correct requirements. Each service tag may be used once or not at all.
  fr: |
    Vous créez des règles de sécurité dans un groupe de sécurité réseau nommé **NSG1**. VNet1, le réseau virtuel qui utilise NSG1, est appairé avec VNet2 et connecté à un réseau local par un VPN site à site.

    Quelle étiquette de service devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les étiquettes de service appropriées vers les exigences correspondantes. Chaque étiquette de service peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: lb, text: AzureLoadBalancer }
    - { id: sql, text: Sql }
    - { id: vnet, text: VirtualNetwork }
    - { id: internet, text: Internet }
    - { id: cloud, text: AzureCloud }
    - { id: gm, text: GatewayManager }
  targets:
    - id: t1
      text: { en: Allow the health probes of an Azure load balancer (source), fr: Autoriser les sondes d'intégrité d'un équilibreur de charge Azure (source) }
    - id: t2
      text: { en: Allow outbound traffic to Azure SQL Database (destination), fr: Autoriser le trafic sortant vers Azure SQL Database (destination) }
    - id: t3
      text: { en: "Allow inbound traffic from VNet2 and from the on-premises network (source)", fr: "Autoriser le trafic entrant provenant de VNet2 et du réseau local (source)" }
    - id: t4
      text: { en: Deny outbound traffic to public addresses outside the virtual network (destination), fr: Refuser le trafic sortant vers les adresses publiques situées hors du réseau virtuel (destination) }
answer:
  mapping: { t1: lb, t2: sql, t3: vnet, t4: internet }
explanation:
  correct:
    en: AzureLoadBalancer represents the host IP 168.63.129.16 where health probes originate. Sql represents Azure SQL Database. VirtualNetwork includes the VNet address space, peered virtual networks and on-premises address spaces connected through a gateway. Internet represents the public address space outside the virtual network.
    fr: AzureLoadBalancer représente l'adresse IP de l'hôte 168.63.129.16 d'où proviennent les sondes d'intégrité. Sql représente Azure SQL Database. VirtualNetwork inclut l'espace d'adressage du réseau virtuel, les réseaux virtuels appairés et les espaces d'adressage locaux connectés via une passerelle. Internet représente l'espace d'adressage public situé hors du réseau virtuel.
  options:
    cloud: { en: AzureCloud covers all Azure datacenter public IP addresses, which is too broad for these requirements., fr: "AzureCloud couvre toutes les adresses IP publiques des centres de données Azure, ce qui est trop large ici." }
    gm: { en: GatewayManager represents the management traffic of VPN Gateway and Application Gateway deployments., fr: GatewayManager représente le trafic de gestion des déploiements VPN Gateway et Application Gateway. }
references:
  - title: Azure service tags overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
