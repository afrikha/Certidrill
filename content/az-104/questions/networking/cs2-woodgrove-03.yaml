id: cs2-woodgrove-03
objective: "4.1.2"
type: dropdown
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the peering between VNet-Hub and VNet-Payments. The solution must meet the technical requirements.

    Which setting should you enable on each side of the peering? To answer, select the appropriate options in the answer area.
  fr: |
    Vous configurez le peering entre VNet-Hub et VNet-Payments. La solution doit respecter les exigences techniques.

    Quel paramètre devez-vous activer de chaque côté du peering ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Peering from VNet-Hub to VNet-Payments: [[hub]]

      Peering from VNet-Payments to VNet-Hub: [[spoke]]
    fr: |
      Peering de VNet-Hub vers VNet-Payments : [[hub]]

      Peering de VNet-Payments vers VNet-Hub : [[spoke]]
  slots:
    - id: hub
      options:
        - { id: transit, text: { en: "Allow gateway transit", fr: "Autoriser le transit par passerelle" } }
        - { id: remote, text: { en: "Use remote gateways", fr: "Utiliser des passerelles distantes" } }
        - { id: fwd, text: { en: "Allow forwarded traffic only", fr: "Autoriser uniquement le trafic transféré" } }
    - id: spoke
      options:
        - { id: transit, text: { en: "Allow gateway transit", fr: "Autoriser le transit par passerelle" } }
        - { id: remote, text: { en: "Use remote gateways", fr: "Utiliser des passerelles distantes" } }
        - { id: fwd, text: { en: "Allow forwarded traffic only", fr: "Autoriser uniquement le trafic transféré" } }
answer:
  values: { hub: transit, spoke: remote }
explanation:
  correct:
    en: Gateway transit lets a peered virtual network use the gateways of another virtual network. The virtual network that owns the gateways (VNet-Hub) allows gateway transit, and the virtual network without a gateway (VNet-Payments) uses the remote gateways. VNet-Payments then learns the on-premises routes without its own gateway, which meets requirement 7 and minimizes cost.
    fr: Le transit par passerelle permet à un réseau virtuel appairé d'utiliser les passerelles d'un autre réseau virtuel. Le réseau virtuel qui possède les passerelles (VNet-Hub) autorise le transit par passerelle, et le réseau virtuel sans passerelle (VNet-Payments) utilise les passerelles distantes. VNet-Payments apprend alors les routes locales sans passerelle propre, ce qui respecte l'exigence 7 et réduit les coûts.
  options:
    fwd:
      en: Forwarded traffic concerns traffic relayed by an appliance; it does not share the gateways or the on-premises routes.
      fr: Le trafic transféré concerne le trafic relayé par une appliance ; il ne partage ni les passerelles ni les routes locales.
references:
  - title: "Configure VPN gateway transit for virtual network peering - Azure VPN Gateway"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
  - title: "Azure Virtual Network Peering"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
