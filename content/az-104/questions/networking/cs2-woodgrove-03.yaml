id: cs2-woodgrove-03
objective: "4.1.2"
type: dropdown
caseStudy: cs2-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    You create VNet-Payments and peer it with VNet-Hub. The peering uses the gateways of VNet-Hub through gateway transit. You need to complete the configuration to meet requirement 7. The solution must minimize administrative effort.

    What should you do? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez VNet-Payments et l'appairez avec VNet-Hub. Le peering utilise les passerelles de VNet-Hub grâce au transit par passerelle. Vous devez terminer la configuration pour respecter l'exigence 7. La solution doit réduire l'effort d'administration au minimum.

    Que devez-vous faire ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To let VNet-Payments communicate with VNet-Core: [[core]]

      After 10.31.0.0/16 is added to VNet-Payments: [[sync]]
    fr: |
      Pour permettre à VNet-Payments de communiquer avec VNet-Core : [[core]]

      Après l'ajout de 10.31.0.0/16 à VNet-Payments : [[sync]]
  slots:
    - id: core
      options:
        - { id: peer, text: { en: "Create a virtual network peering between VNet-Payments and VNet-Core", fr: "Créer un peering de réseaux virtuels entre VNet-Payments et VNet-Core" } }
        - { id: nothing, text: { en: "Nothing; VNet-Hub routes the traffic between its peered virtual networks", fr: "Rien ; VNet-Hub route le trafic entre ses réseaux virtuels appairés" } }
        - { id: fwd, text: { en: "Enable Allow forwarded traffic on all the peerings of VNet-Hub", fr: "Activer l'autorisation du trafic transféré sur tous les peerings de VNet-Hub" } }
        - { id: transit, text: { en: "Enable Allow gateway transit on the peering from VNet-Hub to VNet-Core", fr: "Activer le transit par passerelle sur le peering de VNet-Hub vers VNet-Core" } }
    - id: sync
      options:
        - { id: sync, text: { en: "Sync the peerings of VNet-Payments with the remote virtual networks", fr: "Synchroniser les peerings de VNet-Payments avec les réseaux virtuels distants" } }
        - { id: recreate, text: { en: "Delete and re-create every peering of VNet-Payments", fr: "Supprimer et recréer chaque peering de VNet-Payments" } }
        - { id: auto, text: { en: "Nothing; the peered virtual networks learn the new range automatically", fr: "Rien ; les réseaux virtuels appairés apprennent automatiquement la nouvelle plage" } }
        - { id: udr, text: { en: "Add a user-defined route for 10.31.0.0/16 to the subnets of VNet-Core", fr: "Ajouter un itinéraire défini par l'utilisateur pour 10.31.0.0/16 aux sous-réseaux de VNet-Core" } }
answer:
  values: { core: peer, sync: sync }
explanation:
  correct:
    en: |
      Virtual network peering is not transitive: two spokes peered with the same hub cannot communicate unless they are peered with each other or traffic is routed through an appliance, which requirement 7 excludes. A direct peering between VNet-Payments and VNet-Core meets the need. When you add an address range to a peered virtual network, you must sync the peering with each remote virtual network so that the peers learn the new range; there is no downtime.
    fr: |
      Le peering de réseaux virtuels n'est pas transitif : deux réseaux spoke appairés avec le même hub ne peuvent pas communiquer, sauf s'ils sont appairés entre eux ou si le trafic passe par une appliance, ce que l'exigence 7 exclut. Un peering direct entre VNet-Payments et VNet-Core répond au besoin. Quand vous ajoutez une plage d'adresses à un réseau virtuel appairé, vous devez synchroniser le peering avec chaque réseau virtuel distant pour que les pairs apprennent la nouvelle plage ; il n'y a aucune interruption.
  options:
    nothing: { en: "Peering is not transitive; VNet-Hub does not forward traffic between its spokes by itself.", fr: "Le peering n'est pas transitif ; VNet-Hub ne transfère pas de lui-même le trafic entre ses spokes." }
    fwd: { en: "Allowing forwarded traffic only accepts traffic relayed by an appliance, which the requirement excludes and which does not exist.", fr: "Autoriser le trafic transféré ne fait qu'accepter le trafic relayé par une appliance, ce que l'exigence exclut et qui n'existe pas." }
    transit: { en: "Gateway transit shares the gateways of VNet-Hub; it does not connect VNet-Payments to VNet-Core.", fr: "Le transit par passerelle partage les passerelles de VNet-Hub ; il ne relie pas VNet-Payments à VNet-Core." }
    recreate: { en: "Re-creating the peerings interrupts traffic and is not required; a sync updates the peerings in place.", fr: "Recréer les peerings interrompt le trafic et n'est pas nécessaire ; une synchronisation met les peerings à jour sur place." }
    auto: { en: "After an address space change, the peerings show that a sync is required; the remote networks do not learn the range until then.", fr: "Après une modification de l'espace d'adressage, les peerings indiquent qu'une synchronisation est nécessaire ; les réseaux distants n'apprennent pas la plage avant." }
    udr: { en: "A user-defined route cannot replace the peering sync, and the next hop for a peered range is the peering itself.", fr: "Un itinéraire défini par l'utilisateur ne remplace pas la synchronisation du peering, et le tronçon suivant d'une plage appairée est le peering lui-même." }
references:
  - title: "Azure Virtual Network Peering"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: "Update the address space for a peered virtual network - Azure portal"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/update-virtual-network-peering-address-space
