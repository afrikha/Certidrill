id: n1-udr-gateway-propagation
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named **VNet1** contains the subnets **GatewaySubnet**, **App** and **DMZ**. A VPN gateway in GatewaySubnet exchanges routes with the on-premises network by using BGP. A route table named **RT-DMZ** is associated with DMZ.

    You need to ensure that the routes learned from the on-premises network no longer appear in the effective routes of the virtual machines in DMZ. The virtual machines in App must keep the on-premises routes, and the VPN gateway must keep working.

    What should you do?
  fr: |
    Un réseau virtuel nommé **VNet1** contient les sous-réseaux **GatewaySubnet**, **App** et **DMZ**. Une passerelle VPN dans GatewaySubnet échange des itinéraires avec le réseau local par BGP. Une table de routage nommée **RT-DMZ** est associée à DMZ.

    Vous devez faire en sorte que les itinéraires appris du réseau local n'apparaissent plus dans les itinéraires effectifs des machines virtuelles de DMZ. Les machines virtuelles d'App doivent conserver les itinéraires locaux, et la passerelle VPN doit continuer de fonctionner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Set Propagate gateway routes to No on RT-DMZ., fr: Définir « Propager les itinéraires de passerelle » sur Non dans RT-DMZ. } }
    - { id: b, text: { en: Disable BGP on the connection between the VPN gateway and the on-premises network., fr: Désactiver BGP sur la connexion entre la passerelle VPN et le réseau local. } }
    - { id: c, text: { en: Associate a route table that has Propagate gateway routes set to No with GatewaySubnet., fr: Associer à GatewaySubnet une table de routage dont « Propager les itinéraires de passerelle » est défini sur Non. } }
    - { id: d, text: { en: Associate a network security group that denies the on-premises address ranges with DMZ., fr: Associer à DMZ un groupe de sécurité réseau qui refuse les plages d'adresses locales. } }
answer: { optionId: a }
explanation:
  correct:
    en: Virtual network gateway route propagation is a property of a route table. When it is disabled, Azure does not add the gateway's static and BGP routes to the subnets associated with that table, while other subnets keep receiving them. Disabling it on RT-DMZ therefore affects only DMZ.
    fr: "La propagation des itinéraires de la passerelle de réseau virtuel est une propriété de la table de routage. Quand elle est désactivée, Azure n'ajoute pas les itinéraires statiques et BGP de la passerelle aux sous-réseaux associés à cette table, alors que les autres sous-réseaux continuent de les recevoir. La désactiver dans RT-DMZ n'affecte donc que DMZ."
  options:
    b: { en: Disabling BGP changes the routes of every subnet, including App, which must keep the on-premises routes., fr: Désactiver BGP modifie les itinéraires de tous les sous-réseaux, y compris App, qui doit conserver les itinéraires locaux. }
    c: { en: Route propagation must not be disabled on GatewaySubnet; the gateway stops working., fr: "La propagation des itinéraires ne doit pas être désactivée sur GatewaySubnet ; la passerelle cesse de fonctionner." }
    d: { en: An NSG filters traffic but does not remove routes from the effective routes., fr: Un NSG filtre le trafic, mais ne retire aucun itinéraire des itinéraires effectifs. }
references:
  - title: Virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: Create, change, or delete an Azure route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
