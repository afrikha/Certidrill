id: n2-bastion-ip-connect
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a hub virtual network named **VNet-Hub** that contains a VPN gateway connected to the on-premises datacenter through a site-to-site VPN. Forced tunneling is not configured. An Azure Bastion host named **Bastion1** that uses the Basic SKU is deployed in VNet-Hub.

    Administrators must use Bastion1 to connect over RDP to an on-premises server that has the IP address 192.168.20.15. The server is not an Azure resource.

    What should you do?
  fr: |
    Adatum dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient une passerelle VPN connectée au centre de données local par un VPN site à site. Le tunneling forcé n'est pas configuré. Un hôte Azure Bastion nommé **Bastion1**, qui utilise la référence SKU Basic, est déployé dans VNet-Hub.

    Les administrateurs doivent utiliser Bastion1 pour se connecter en RDP à un serveur local dont l'adresse IP est 192.168.20.15. Ce serveur n'est pas une ressource Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: Upgrade Bastion1 to the Standard SKU and enable IP-based connection., fr: Mettre à niveau Bastion1 vers la référence SKU Standard et activer la connexion basée sur IP. } }
    - { id: b, text: { en: Upgrade Bastion1 to the Standard SKU and create a shareable link for the server., fr: Mettre à niveau Bastion1 vers la référence SKU Standard et créer un lien partageable pour le serveur. } }
    - { id: c, text: { en: Keep the Basic SKU and add a user-defined route for 192.168.20.0/24 to AzureBastionSubnet., fr: Conserver la référence SKU Basic et ajouter une route définie par l'utilisateur pour 192.168.20.0/24 à AzureBastionSubnet. } }
    - { id: d, text: { en: Deploy a second Bastion host with the Developer SKU in VNet-Hub., fr: Déployer un second hôte Bastion avec la référence SKU Developer dans VNet-Hub. } }
answer: { optionId: a }
explanation:
  correct:
    en: IP-based connection lets Bastion reach a machine by its IP address, including on-premises and non-Azure servers reachable over ExpressRoute or a site-to-site VPN. It requires the Standard SKU or higher and the IP-based connection setting enabled on the Bastion configuration page. It does not work with forced tunneling.
    fr: "La connexion basée sur IP permet à Bastion de joindre une machine par son adresse IP, y compris des serveurs locaux ou non Azure accessibles via ExpressRoute ou un VPN site à site. Elle exige la référence SKU Standard ou supérieure et le paramètre de connexion basée sur IP activé dans la page Configuration de Bastion. Elle ne fonctionne pas avec le tunneling forcé."
  options:
    b: { en: Shareable links do not support on-premises or non-Azure machines., fr: Les liens partageables ne prennent pas en charge les machines locales ou non Azure. }
    c: { en: "User-defined routes are not supported on AzureBastionSubnet, and Basic cannot target an IP address.", fr: "Les routes définies par l'utilisateur ne sont pas prises en charge sur AzureBastionSubnet, et Basic ne peut pas cibler une adresse IP." }
    d: { en: The Developer SKU only connects to VMs in its own virtual network and has no IP-based connection., fr: "La référence SKU Developer ne se connecte qu'aux machines de son propre réseau virtuel et n'offre pas de connexion basée sur IP." }
references:
  - title: About Azure Bastion IP-based connection
    url: https://learn.microsoft.com/en-us/azure/bastion/connect-ip-address
