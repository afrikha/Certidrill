id: n3-lb-inbound-nat
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a public Standard Load Balancer named **LB1** with a backend pool named **Pool1** that contains six virtual machines. The virtual machines have no public IP addresses.

    Administrators must connect to each virtual machine by using SSH through the frontend IP address of LB1, each virtual machine being reached on a different frontend port. You plan to create an inbound NAT rule that targets Pool1, with a **Frontend port range start** of 50000.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un équilibreur de charge public Standard nommé **LB1** avec un pool principal nommé **Pool1** qui contient six machines virtuelles. Les machines virtuelles n'ont pas d'adresse IP publique.

    Les administrateurs doivent se connecter à chaque machine virtuelle en SSH via l'adresse IP frontale de LB1, chaque machine virtuelle étant jointe sur un port frontal différent. Vous prévoyez de créer une règle NAT entrante qui cible Pool1, avec un **Début de la plage de ports frontaux** de 50000.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a virtual machine is added to Pool1, a port mapping for it is created automatically from the preallocated frontend port range.
        fr: Quand une machine virtuelle est ajoutée à Pool1, un mappage de port est créé automatiquement pour elle à partir de la plage de ports frontaux préallouée.
    - id: s2
      text:
        en: The inbound NAT rule must be associated with a health probe before it forwards traffic.
        fr: La règle NAT entrante doit être associée à une sonde d'intégrité avant de transférer le trafic.
    - id: s3
      text:
        en: The inbound NAT rule also provides outbound internet connectivity (SNAT) for the virtual machines in Pool1.
        fr: La règle NAT entrante fournit aussi la connectivité Internet sortante (SNAT) aux machines virtuelles de Pool1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: An inbound NAT rule that targets a backend pool preallocates a frontend port range from the Frontend port range start and the maximum number of machines; new pool members get mappings automatically. Unlike load-balancing rules, inbound NAT rules do not need a health probe. Inbound NAT rules provide no outbound NAT; outbound connectivity comes from an outbound rule, a NAT gateway or instance-level public IP addresses.
    fr: "Une règle NAT entrante qui cible un pool principal préalloue une plage de ports frontaux à partir du début de plage et du nombre maximal de machines ; les nouveaux membres du pool reçoivent automatiquement un mappage. Contrairement aux règles d'équilibrage de charge, les règles NAT entrantes n'ont pas besoin de sonde d'intégrité. Les règles NAT entrantes ne fournissent aucune NAT sortante : la connectivité sortante vient d'une règle de trafic sortant, d'une passerelle NAT ou d'adresses IP publiques au niveau de l'instance."
references:
  - title: Inbound NAT rules - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules
  - title: Outbound Rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
