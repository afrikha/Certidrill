id: cs3-coho-03
objective: "4.2.1"
type: yesno_statements
caseStudy: cs3-coho
difficulty: 2
status: draft
stem:
  en: |
    You are configuring application security groups and security rules to meet the network requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous configurez des groupes de sécurité d'application et des règles de sécurité pour satisfaire les exigences réseau.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: "You can create a rule in nsg-erp that uses asg-sensors as the source and asg-erp as the destination."
        fr: "Vous pouvez créer dans nsg-erp une règle qui utilise asg-sensors comme source et asg-erp comme destination."
    - id: s2
      text:
        en: "You can add the network interface of a virtual machine in VNet-Analytics to asg-erp."
        fr: "Vous pouvez ajouter à asg-erp l'interface réseau d'une machine virtuelle de VNet-Analytics."
    - id: s3
      text:
        en: "The network interface of VM-IOT1 can be a member of asg-erp in addition to asg-sensors."
        fr: "L'interface réseau de VM-IOT1 peut être membre de asg-erp en plus de asg-sensors."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A rule can use application security groups as both source and destination when all their network interfaces are in the same virtual network; asg-sensors and asg-erp contain only interfaces from VNet-Hub. All the network interfaces of an application security group must be in the virtual network of its first member, so an interface in VNet-Analytics can't join asg-erp, even with peering. A network interface can belong to several application security groups."
    fr: "Une règle peut utiliser des groupes de sécurité d'application comme source et comme destination quand toutes leurs interfaces réseau se trouvent dans le même réseau virtuel ; asg-sensors et asg-erp ne contiennent que des interfaces de VNet-Hub. Toutes les interfaces réseau d'un groupe de sécurité d'application doivent se trouver dans le réseau virtuel de son premier membre : une interface de VNet-Analytics ne peut pas rejoindre asg-erp, même avec un peering. Une interface réseau peut appartenir à plusieurs groupes de sécurité d'application."
references:
  - title: "Azure Application Security Groups Overview"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
