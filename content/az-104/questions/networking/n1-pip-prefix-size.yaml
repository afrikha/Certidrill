id: n1-pip-prefix-size
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind is deploying eight virtual machines in a subscription named **Sub1** in the North Europe region. Each virtual machine needs its own static public IPv4 address.

    A partner will allow the eight addresses on its firewall by using a single rule that contains one contiguous range. The solution must minimize the number of public IP addresses that are reserved.

    What should you create?
  fr: |
    Northwind déploie huit machines virtuelles dans un abonnement nommé **Sub1**, dans la région North Europe. Chaque machine virtuelle a besoin de sa propre adresse IPv4 publique statique.

    Un partenaire autorisera les huit adresses sur son pare-feu avec une seule règle contenant une plage contiguë. La solution doit réduire au minimum le nombre d'adresses IP publiques réservées.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: A public IP address prefix of size /29, fr: Un préfixe d'adresse IP publique de taille /29 } }
    - { id: b, text: { en: A public IP address prefix of size /28, fr: Un préfixe d'adresse IP publique de taille /28 } }
    - { id: c, text: { en: A public IP address prefix of size /30, fr: Un préfixe d'adresse IP publique de taille /30 } }
    - { id: d, text: { en: Eight individual Standard public IP addresses, fr: Huit adresses IP publiques Standard individuelles } }
answer: { optionId: a }
explanation:
  correct:
    en: A public IP address prefix reserves a contiguous range of static public addresses in a region and subscription. A /29 prefix contains exactly 8 addresses, and you create a Standard static public IP from it for each VM. Public IP prefixes do not lose addresses to reservations the way subnets do, and the whole prefix counts against the regional quota, so a larger prefix reserves more addresses than needed.
    fr: "Un préfixe d'adresse IP publique réserve une plage contiguë d'adresses publiques statiques dans une région et un abonnement. Un préfixe /29 contient exactement 8 adresses, et vous créez à partir de celui-ci une adresse IP publique Standard statique pour chaque machine virtuelle. Contrairement aux sous-réseaux, un préfixe d'adresse IP publique ne perd aucune adresse réservée, et tout le préfixe compte dans le quota régional : un préfixe plus grand réserve plus d'adresses que nécessaire."
  options:
    b: { en: "A /28 prefix contains 16 addresses, twice the number required.", fr: "Un préfixe /28 contient 16 adresses, deux fois le nombre nécessaire." }
    c: { en: A /30 prefix contains only 4 addresses., fr: Un préfixe /30 ne contient que 4 adresses. }
    d: { en: Individual addresses are picked from the regional pool and are not guaranteed to be contiguous., fr: Les adresses individuelles sont prises dans le pool régional et ne sont pas forcément contiguës. }
references:
  - title: Azure Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
