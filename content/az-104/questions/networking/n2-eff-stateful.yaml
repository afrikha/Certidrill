id: n2-eff-stateful
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A VM named **VM4** is connected to a subnet associated with the network security group **NSG4**. NSG4 contains only the default rules and one custom inbound rule, **Allow-SSH** (priority 100), that allows TCP 22 from your administration network. No NSG is associated with the network interface of VM4.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Une machine virtuelle nommée **VM4** est connectée à un sous-réseau associé au groupe de sécurité réseau **NSG4**. NSG4 ne contient que les règles par défaut et une règle entrante personnalisée, **Allow-SSH** (priorité 100), qui autorise TCP 22 depuis votre réseau d'administration. Aucun NSG n'est associé à l'interface réseau de VM4.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text: { en: "When VM4 downloads updates from a public website over HTTPS, the response traffic reaches VM4 even though no inbound rule allows it.", fr: "Lorsque VM4 télécharge des mises à jour depuis un site web public en HTTPS, le trafic de réponse atteint VM4 même si aucune règle entrante ne l'autorise." }
    - id: s2
      text: { en: "If you delete Allow-SSH while an administrator has an open SSH session to VM4, the session is disconnected immediately.", fr: "Si vous supprimez Allow-SSH pendant qu'un administrateur a une session SSH ouverte vers VM4, la session est immédiatement déconnectée." }
    - id: s3
      text: { en: An SSH connection from the administration network to VM4 is allowed., fr: Une connexion SSH depuis le réseau d'administration vers VM4 est autorisée. }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: NSGs are stateful; a flow record lets the return traffic of an allowed outbound connection back in. Rule changes only affect new connections, so an established SSH session stays connected after its rule is removed. With no NSG on the NIC, the traffic allowed by the subnet NSG reaches the VM.
    fr: "Les NSG sont avec état : un enregistrement de flux laisse revenir le trafic de réponse d'une connexion sortante autorisée. Les modifications de règles n'affectent que les nouvelles connexions : une session SSH établie reste connectée après la suppression de sa règle. Sans NSG sur l'interface réseau, le trafic autorisé par le NSG du sous-réseau atteint la machine virtuelle."
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - title: How Network Security Groups Filter Network Traffic in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
