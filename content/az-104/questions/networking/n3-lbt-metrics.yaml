id: n3-lbt-metrics
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Users report intermittent failures when they connect to an application published through a public Standard Load Balancer named **LB1**. You open **Metrics** for LB1 in the Azure portal to isolate the cause.

    How should you complete the troubleshooting plan? Select the appropriate options in the answer area.
  fr: |
    Des utilisateurs signalent des échecs intermittents lorsqu'ils se connectent à une application publiée par l'intermédiaire d'un équilibreur de charge public Standard nommé **LB1**. Vous ouvrez **Métriques** pour LB1 dans le portail Azure afin d'isoler la cause.

    Comment devez-vous compléter le plan de résolution des problèmes ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      To check whether the Azure data path from the region to the frontend and the backend hosts is healthy, use the [[m1]] metric.

      To identify which backend virtual machine is failing its health probe, use the [[m2]] metric with the Average aggregation, and apply splitting by [[dim]].
    fr: |
      Pour vérifier si le chemin de données Azure depuis la région jusqu'au front-end et aux hôtes back-end est sain, utilisez la métrique [[m1]].

      Pour identifier la machine virtuelle back-end dont la sonde d'intégrité échoue, utilisez la métrique [[m2]] avec l'agrégation Moyenne, et appliquez un fractionnement par [[dim]].
  slots:
    - id: m1
      options:
        - { id: dpa, text: { en: Data Path Availability, fr: Disponibilité du chemin des données } }
        - { id: hps, text: { en: Health Probe Status, fr: État de la sonde d'intégrité } }
        - { id: syn, text: { en: SYN Count, fr: Nombre de SYN } }
        - { id: bytes, text: { en: Byte Count, fr: Nombre d'octets } }
    - id: m2
      options:
        - { id: dpa, text: { en: Data Path Availability, fr: Disponibilité du chemin des données } }
        - { id: hps, text: { en: Health Probe Status, fr: État de la sonde d'intégrité } }
        - { id: snat, text: { en: Used SNAT Ports, fr: Ports SNAT utilisés } }
        - { id: packets, text: { en: Packet Count, fr: Nombre de paquets } }
    - id: dim
      options:
        - { id: backendip, text: { en: Backend IP address, fr: Adresse IP du serveur principal } }
        - { id: feport, text: { en: Frontend port, fr: Port frontal } }
        - { id: connstate, text: { en: Connection state, fr: État de la connexion } }
answer:
  values: { m1: dpa, m2: hps, dim: backendip }
explanation:
  correct:
    en: Data Path Availability is generated by an Azure probing service that sends traffic through the frontend and load-balancing rule to the hosts of the backend VMs, so it shows whether the platform path is healthy. Health Probe Status shows how the load balancer sees each backend endpoint according to your probe; splitting it by backend IP address shows one line per instance, which isolates the failing virtual machine.
    fr: "La disponibilité du chemin des données est générée par un service de détection Azure qui envoie du trafic via le front-end et la règle d'équilibrage de charge jusqu'aux hôtes des machines virtuelles back-end ; elle indique si le chemin de la plateforme est sain. L'état de la sonde d'intégrité montre comment l'équilibreur de charge voit chaque point de terminaison back-end selon votre sonde ; le fractionnement par adresse IP du serveur principal affiche une ligne par instance, ce qui isole la machine virtuelle défaillante."
  options:
    syn: { en: SYN Count only counts TCP connection attempts., fr: Nombre de SYN compte seulement les tentatives de connexion TCP. }
    snat: { en: Used SNAT Ports concerns outbound connections, not probe health., fr: "Ports SNAT utilisés concerne les connexions sortantes, pas l'intégrité des sondes." }
    feport: { en: Splitting by frontend port does not separate the backend instances., fr: Le fractionnement par port frontal ne sépare pas les instances back-end. }
    connstate: { en: Connection state is a dimension of the SNAT Connection Count metric., fr: "L'état de la connexion est une dimension de la métrique de nombre de connexions SNAT." }
references:
  - title: Load Balancer Diagnostics - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-diagnostics
