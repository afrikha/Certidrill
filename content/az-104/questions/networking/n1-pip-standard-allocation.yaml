id: n1-pip-standard-allocation
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a public IPv4 address named **pip-app1** with the Standard SKU for a virtual machine.

    Which allocation method can you select for pip-app1?
  fr: |
    Vous créez une adresse IPv4 publique nommée **pip-app1**, de référence SKU Standard, pour une machine virtuelle.

    Quelle méthode d'allocation pouvez-vous sélectionner pour pip-app1 ?
body:
  options:
    - { id: a, text: { en: Static only, fr: Statique uniquement } }
    - { id: b, text: { en: Dynamic only, fr: Dynamique uniquement } }
    - { id: c, text: { en: Static or dynamic, fr: Statique ou dynamique } }
    - { id: d, text: { en: Dynamic for a virtual machine, static for a load balancer, fr: "Dynamique pour une machine virtuelle, statique pour un équilibreur de charge" } }
answer: { optionId: a }
explanation:
  correct:
    en: Standard SKU public IP addresses, IPv4 and IPv6, always use static allocation. The address is assigned when the resource is created and kept until the public IP resource is deleted. Dynamic allocation existed only for the Basic SKU, which was retired on September 30, 2025.
    fr: "Les adresses IP publiques de référence SKU Standard, IPv4 comme IPv6, utilisent toujours l'allocation statique. L'adresse est attribuée à la création de la ressource et conservée jusqu'à la suppression de la ressource d'adresse IP publique. L'allocation dynamique n'existait que pour la référence SKU De base, mise hors service le 30 septembre 2025."
  options:
    b: { en: Dynamic allocation is not available for Standard public IP addresses., fr: L'allocation dynamique n'est pas disponible pour les adresses IP publiques Standard. }
    c: { en: Only the retired Basic SKU offered a choice between static and dynamic IPv4 allocation., fr: Seule la référence SKU De base, mise hors service, proposait le choix entre allocation IPv4 statique et dynamique. }
    d: { en: The allocation method of a Standard public IP does not depend on the resource it is associated with., fr: La méthode d'allocation d'une adresse IP publique Standard ne dépend pas de la ressource associée. }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
