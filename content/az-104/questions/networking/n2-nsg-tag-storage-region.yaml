id: n2-nsg-tag-storage-region
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** in the West Europe region. VMs in Subnet1 of VNet1 must not access the internet. They must still be able to reach Azure Storage accounts located in West Europe, but not storage accounts in other regions.

    The network security group **NSG1** is associated with Subnet1. You add an outbound rule at priority 4000 that denies traffic to the **Internet** service tag. You need to add an outbound allow rule at priority 200.

    Which destination should you specify in the allow rule?
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dans la région West Europe. Les machines virtuelles de Subnet1 de VNet1 ne doivent pas accéder à Internet. Elles doivent toutefois pouvoir joindre les comptes Stockage Azure situés en West Europe, mais pas ceux des autres régions.

    Le groupe de sécurité réseau **NSG1** est associé à Subnet1. Vous ajoutez une règle sortante de priorité 4000 qui refuse le trafic vers l'étiquette de service **Internet**. Vous devez ajouter une règle sortante d'autorisation de priorité 200.

    Quelle destination devez-vous spécifier dans la règle d'autorisation ?
body:
  options:
    - { id: a, text: { en: "The Storage.WestEurope service tag", fr: "L'étiquette de service Storage.WestEurope" } }
    - { id: b, text: { en: "The Storage service tag", fr: "L'étiquette de service Storage" } }
    - { id: c, text: { en: "The AzureCloud.WestEurope service tag", fr: "L'étiquette de service AzureCloud.WestEurope" } }
    - { id: d, text: { en: "The VirtualNetwork service tag", fr: "L'étiquette de service VirtualNetwork" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Storage service tag supports a regional scope. Storage.WestEurope contains only the Azure Storage address prefixes of West Europe, and Microsoft keeps the prefixes up to date. Because the allow rule has a lower priority number than the deny rule, it is processed first.
    fr: "L'étiquette de service Storage prend en charge une portée régionale. Storage.WestEurope ne contient que les préfixes d'adresse de Stockage Azure de West Europe, et Microsoft les tient à jour. Comme la règle d'autorisation a un numéro de priorité plus petit que la règle de refus, elle est traitée en premier."
  options:
    b: { en: "The Storage tag covers Azure Storage in every region.", fr: "L'étiquette Storage couvre Stockage Azure dans toutes les régions." }
    c: { en: "AzureCloud.WestEurope includes all public IP addresses of Azure datacenters in the region, not only Azure Storage.", fr: "AzureCloud.WestEurope inclut toutes les adresses IP publiques des centres de données Azure de la région, pas seulement Stockage Azure." }
    d: { en: "VirtualNetwork covers private address spaces and does not include the public endpoints of Azure Storage.", fr: "VirtualNetwork couvre les espaces d'adressage privés et n'inclut pas les points de terminaison publics de Stockage Azure." }
references:
  - title: Azure service tags overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
