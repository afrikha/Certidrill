id: n2-bastion-basic-features
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Bastion host named **Bastion1** that uses the Basic SKU in a hub virtual network. The hub is peered with several spoke virtual networks in the same tenant.

    Which two capabilities can administrators use with Bastion1 without changing its SKU? Each correct answer presents a complete solution.
  fr: |
    Northwind Traders dispose d'un hôte Azure Bastion nommé **Bastion1** qui utilise la référence SKU Basic dans un réseau virtuel hub. Le hub est appairé avec plusieurs réseaux virtuels spoke du même locataire.

    Quelles sont les deux fonctionnalités que les administrateurs peuvent utiliser avec Bastion1 sans changer sa référence SKU ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: Connect from the Azure portal to VMs in the peered spoke virtual networks, fr: Se connecter depuis le portail Azure aux machines virtuelles des réseaux virtuels spoke appairés } }
    - { id: b, text: { en: Sign in to a Linux VM by using an SSH private key stored in Azure Key Vault, fr: Se connecter à une machine virtuelle Linux avec une clé privée SSH stockée dans Azure Key Vault } }
    - { id: c, text: { en: Connect by using the native SSH client and az network bastion ssh, fr: Se connecter avec le client SSH natif et az network bastion ssh } }
    - { id: d, text: { en: Upload files to a Windows VM, fr: Charger des fichiers vers une machine virtuelle Windows } }
    - { id: e, text: { en: Connect to a Linux VM over RDP, fr: Se connecter à une machine virtuelle Linux en RDP } }
    - { id: f, text: { en: Use a custom inbound port for RDP, fr: Utiliser un port d'entrée personnalisé pour RDP } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: The Basic SKU supports portal connections to VMs in the same and in peered virtual networks, and it can retrieve Linux private keys from Azure Key Vault. Native client, file transfer, RDP to Linux, SSH to Windows and custom ports require the Standard SKU or higher.
    fr: "La référence SKU Basic prend en charge les connexions par le portail aux machines virtuelles du même réseau virtuel et des réseaux appairés, et peut récupérer des clés privées Linux dans Azure Key Vault. Le client natif, le transfert de fichiers, RDP vers Linux, SSH vers Windows et les ports personnalisés exigent la référence SKU Standard ou supérieure."
  options:
    c: { en: Native client support requires Standard or Premium., fr: La prise en charge du client natif exige Standard ou Premium. }
    d: { en: File upload and download require the native client and the Standard SKU or higher., fr: Le chargement et le téléchargement de fichiers exigent le client natif et la référence SKU Standard ou supérieure. }
    e: { en: RDP to a Linux VM requires Standard or higher., fr: RDP vers une machine virtuelle Linux exige Standard ou supérieur. }
    f: { en: Custom ports are supported from the Standard SKU only., fr: Les ports personnalisés ne sont pris en charge qu'à partir de la référence SKU Standard. }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
