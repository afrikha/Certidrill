id: n2-nsg-association-targets
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You create a network security group named **NSG1** in the same region and subscription as a virtual network named **VNet1**.

    To which two types of resources can you directly associate NSG1? Each correct answer presents a complete solution.
  fr: |
    Vous créez un groupe de sécurité réseau nommé **NSG1** dans la même région et le même abonnement qu'un réseau virtuel nommé **VNet1**.

    À quels deux types de ressources pouvez-vous associer directement NSG1 ? Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: A subnet of VNet1, fr: Un sous-réseau de VNet1 } }
    - { id: b, text: { en: The network interface of a VM connected to VNet1, fr: L'interface réseau d'une machine virtuelle connectée à VNet1 } }
    - { id: c, text: { en: VNet1 itself, fr: VNet1 lui-même } }
    - { id: d, text: { en: A Standard SKU public IP address, fr: Une adresse IP publique de référence SKU Standard } }
    - { id: e, text: { en: A route table, fr: Une table de routage } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: An NSG is associated with a subnet, with a network interface, or with both. The same NSG can be associated with as many subnets and network interfaces as you need.
    fr: Un NSG s'associe à un sous-réseau, à une interface réseau, ou aux deux. Le même NSG peut être associé à autant de sous-réseaux et d'interfaces réseau que nécessaire.
  options:
    c: { en: An NSG cannot be associated with a whole virtual network; associate it with each subnet instead., fr: "Un NSG ne peut pas être associé à un réseau virtuel entier ; associez-le plutôt à chaque sous-réseau." }
    d: { en: A public IP address has no NSG association; filtering happens on the subnet or network interface., fr: "Une adresse IP publique n'a pas d'association de NSG ; le filtrage se fait sur le sous-réseau ou l'interface réseau." }
    e: { en: Route tables control routing, not filtering, and they are not associated with NSGs., fr: "Les tables de routage gèrent le routage, pas le filtrage, et ne s'associent pas à un NSG." }
references:
  - title: How Network Security Groups Filter Network Traffic in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
