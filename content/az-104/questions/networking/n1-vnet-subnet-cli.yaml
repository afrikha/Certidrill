id: n1-vnet-subnet-cli
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** in a resource group named **RG1**. VNet1 uses the address space 10.1.0.0/16.

    You need to add a new subnet named **snet-apps** to VNet1 with the address range 10.1.8.0/24. The subnet must be delegated to Azure App Service.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dans un groupe de ressources nommé **RG1**. VNet1 utilise l'espace d'adressage 10.1.0.0/16.

    Vous devez ajouter à VNet1 un nouveau sous-réseau nommé **snet-apps** avec la plage d'adresses 10.1.8.0/24. Le sous-réseau doit être délégué à Azure App Service.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: code
  language: bash
  template: |
    az network vnet subnet [[verb]] \
      --resource-group RG1 \
      --vnet-name VNet1 \
      --name snet-apps \
      [[prefix]] 10.1.8.0/24 \
      [[deleg]] Microsoft.Web/serverFarms
  slots:
    - id: verb
      options:
        - { id: create, text: create }
        - { id: update, text: update }
        - { id: add, text: add }
    - id: prefix
      options:
        - { id: ap, text: --address-prefixes }
        - { id: as, text: --address-space }
        - { id: sp, text: --subnet-prefixes }
    - id: deleg
      options:
        - { id: del, text: --delegations }
        - { id: se, text: --service-endpoints }
        - { id: sep, text: --service-endpoint-policy }
answer:
  values: { verb: create, prefix: ap, deleg: del }
explanation:
  correct:
    en: "`az network vnet subnet create` adds a new subnet to an existing virtual network. The subnet range is set with `--address-prefixes`, and `--delegations` delegates the subnet to a service such as Microsoft.Web/serverFarms."
    fr: "`az network vnet subnet create` ajoute un nouveau sous-réseau à un réseau virtuel existant. La plage du sous-réseau se définit avec `--address-prefixes`, et `--delegations` délègue le sous-réseau à un service comme Microsoft.Web/serverFarms."
  options:
    update: { en: update changes an existing subnet; snet-apps does not exist yet., fr: update modifie un sous-réseau existant ; snet-apps n'existe pas encore. }
    add: { en: There is no add command in the az network vnet subnet group., fr: Il n'existe pas de commande add dans le groupe az network vnet subnet. }
    as: { en: --address-space belongs to az network vnet create/update and sets the virtual network range., fr: --address-space appartient à az network vnet create/update et définit la plage du réseau virtuel. }
    sp: { en: --subnet-prefixes is used by az network vnet create to create a first subnet with the network., fr: --subnet-prefixes est utilisé par az network vnet create pour créer un premier sous-réseau avec le réseau. }
    se: { en: Service endpoints secure access to PaaS services; they do not delegate the subnet., fr: Les points de terminaison de service sécurisent l'accès aux services PaaS ; ils ne délèguent pas le sous-réseau. }
    sep: { en: A service endpoint policy filters service endpoint traffic; it is not a delegation., fr: Une stratégie de point de terminaison de service filtre le trafic des points de terminaison de service ; ce n'est pas une délégation. }
references:
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
  - title: Subnet delegation in Azure Virtual Network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/subnet-delegation-overview
