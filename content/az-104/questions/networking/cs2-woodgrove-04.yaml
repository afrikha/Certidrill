id: cs2-woodgrove-04
objective: "4.2.5"
type: single
caseStudy: cs2-woodgrove
difficulty: 2
status: draft
stem:
  en: You need to configure network access to stwgaudit for the on-premises servers. The solution must meet the technical requirements. What should you do?
  fr: Vous devez configurer l'accès réseau à stwgaudit pour les serveurs locaux. La solution doit respecter les exigences techniques. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a private endpoint for the blob service of stwgaudit in Snet-Shared, and disable public network access", fr: "Créer un point de terminaison privé pour le service blob de stwgaudit dans Snet-Shared, et désactiver l'accès réseau public" }
    - id: b
      text: { en: "Enable a Microsoft.Storage service endpoint on Snet-Shared, and add a virtual network rule to stwgaudit", fr: "Activer un point de terminaison de service Microsoft.Storage sur Snet-Shared, et ajouter une règle de réseau virtuel à stwgaudit" }
    - id: c
      text: { en: "Add an IP network rule for 192.168.0.0/16 to the firewall of stwgaudit", fr: "Ajouter une règle de réseau IP pour 192.168.0.0/16 au pare-feu de stwgaudit" }
    - id: d
      text: { en: "Enable the trusted Azure services exception on stwgaudit", fr: "Activer l'exception des services Azure approuvés sur stwgaudit" }
answer: { optionId: a }
explanation:
  correct:
    en: A private endpoint gives stwgaudit a private IP address in VNet-Hub, which the on-premises servers reach over the ExpressRoute private peering. Public network access can then be disabled. The on-premises DNS must resolve the storage name to the private IP address, for example through the privatelink.blob.core.windows.net zone.
    fr: Un point de terminaison privé donne à stwgaudit une adresse IP privée dans VNet-Hub, que les serveurs locaux atteignent via le peering privé ExpressRoute. L'accès réseau public peut alors être désactivé. Le DNS local doit résoudre le nom du stockage vers l'adresse IP privée, par exemple via la zone privatelink.blob.core.windows.net.
  options:
    b: { en: "A service endpoint secures traffic from the subnet itself, but the account keeps its public endpoint, and traffic from on-premises cannot use it.", fr: "Un point de terminaison de service sécurise le trafic issu du sous-réseau lui-même, mais le compte conserve son point de terminaison public, et le trafic local ne peut pas l'utiliser." }
    c: { en: "IP network rules accept only public IP addresses, and they require public network access to stay enabled.", fr: "Les règles de réseau IP n'acceptent que des adresses IP publiques et exigent que l'accès réseau public reste activé." }
    d: { en: "The exception applies to selected Azure services, not to on-premises servers, and it gives no private IP address.", fr: "L'exception s'applique à certains services Azure, pas aux serveurs locaux, et ne fournit aucune adresse IP privée." }
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
