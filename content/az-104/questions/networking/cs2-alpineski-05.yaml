id: cs2-alpineski-05
objective: "4.2.3"
type: dropdown
caseStudy: cs2-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy a single Azure Bastion host in VNet-CH to meet the administration requirements.

    How should you configure the deployment? To answer, select the appropriate options in the answer area.
  fr: |
    Vous prévoyez de déployer un seul hôte Azure Bastion dans VNet-CH pour respecter les exigences d'administration.

    Comment devez-vous configurer le déploiement ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      SKU: [[sku]]

      Subnet name: [[name]]

      Subnet prefix: [[prefix]]
    fr: |
      Référence SKU : [[sku]]

      Nom du sous-réseau : [[name]]

      Préfixe du sous-réseau : [[prefix]]
  slots:
    - id: sku
      options:
        - { id: developer, text: "Developer" }
        - { id: basic, text: "Basic" }
        - { id: standard, text: "Standard" }
    - id: name
      options:
        - { id: bastion, text: "AzureBastionSubnet" }
        - { id: gateway, text: "GatewaySubnet" }
        - { id: custom, text: "snet-bastion" }
    - id: prefix
      options:
        - { id: p28, text: "10.40.250.0/28" }
        - { id: p27, text: "10.40.250.0/27" }
        - { id: p26, text: "10.40.250.0/26" }
answer:
  values: { sku: standard, name: bastion, prefix: p26 }
explanation:
  correct:
    en: |
      Connecting with the native client requires the Standard SKU or higher, and Standard also reaches the virtual machines of the peered VNet-AT, so one host is enough. A dedicated Bastion deployment needs a subnet named AzureBastionSubnet with a /26 prefix or larger.
    fr: |
      La connexion avec le client natif exige la référence SKU Standard ou supérieure, et Standard atteint aussi les machines virtuelles du réseau appairé VNet-AT ; un seul hôte suffit donc. Un déploiement Bastion dédié a besoin d'un sous-réseau nommé AzureBastionSubnet avec un préfixe /26 ou plus grand.
  options:
    developer: { en: "Developer does not support peered virtual networks or the native client.", fr: "Developer ne prend en charge ni les réseaux virtuels appairés ni le client natif." }
    basic: { en: "Basic supports peered virtual networks but not the native client.", fr: "Basic prend en charge les réseaux virtuels appairés mais pas le client natif." }
    p27: { en: "Since November 2021, a /27 subnet is too small for a new Bastion deployment.", fr: "Depuis novembre 2021, un sous-réseau /27 est trop petit pour un nouveau déploiement Bastion." }
references:
  - title: "Choose the right Azure Bastion SKU to meet your needs"
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
  - title: "About Azure Bastion configuration settings"
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
