id: cs-nw-load-balancer
objective: "4.3.2"
type: yesno_statements
caseStudy: cs-northwind-clinics
difficulty: 2
status: draft
stem:
  en: You plan to deploy a Standard public load balancer for VM-WEB1 and VM-WEB2. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: Vous prévoyez de déployer un équilibreur de charge public Standard pour VM-WEB1 et VM-WEB2. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: If VM-WEB1 stops responding to a health probe on TCP port 443, the load balancer stops sending new connections to VM-WEB1.
        fr: Si VM-WEB1 ne répond plus à une sonde d'intégrité sur le port TCP 443, l'équilibreur de charge cesse de lui envoyer de nouvelles connexions.
    - id: s2
      text:
        en: VM-WEB1 and VM-WEB2 must have public IP addresses to be in the backend pool.
        fr: VM-WEB1 et VM-WEB2 doivent avoir des adresses IP publiques pour faire partie du pool principal.
    - id: s3
      text:
        en: By default, a load-balancing rule distributes traffic based on a five-tuple hash (source IP, source port, destination IP, destination port, protocol).
        fr: Par défaut, une règle d'équilibrage de charge répartit le trafic selon un hachage à cinq éléments (IP source, port source, IP de destination, port de destination, protocole).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The health probe marks an instance unhealthy when it stops responding, and the load balancer stops sending it new flows. Backend pool instances only need private IP addresses; the public IP address is on the frontend IP configuration of the load balancer. The default distribution mode is the five-tuple hash.
    fr: La sonde d'intégrité marque une instance comme défaillante quand elle ne répond plus, et l'équilibreur de charge cesse de lui envoyer de nouveaux flux. Les instances du pool principal n'ont besoin que d'adresses IP privées ; l'adresse IP publique se trouve sur la configuration IP frontale de l'équilibreur de charge. Le mode de distribution par défaut est le hachage à cinq éléments.
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
  - title: Azure Load Balancer distribution modes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
