id: cs-nw-load-balancer
objective: "4.3.2"
type: yesno_statements
caseStudy: cs-northwind-clinics
difficulty: 2
status: draft
stem:
  en: You plan to deploy a Standard public load balancer for VM-WEB1 and VM-WEB2. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: Vous prévoyez de déployer un équilibreur de charge public Standard pour VM-WEB1 et VM-WEB2. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A health probe on TCP port 443 stops sending new connections to a server that does not respond.
        fr: Une sonde d'intégrité sur le port TCP 443 cesse d'envoyer de nouvelles connexions à un serveur qui ne répond pas.
    - id: s2
      text:
        en: VM-WEB1 and VM-WEB2 must have public IP addresses to be in the backend pool.
        fr: VM-WEB1 et VM-WEB2 doivent avoir des adresses IP publiques pour faire partie du pool de back-ends.
    - id: s3
      text:
        en: By default, a load-balancing rule distributes traffic based on a five-tuple hash (source IP, source port, destination IP, destination port, protocol).
        fr: Par défaut, une règle d'équilibrage de charge répartit le trafic selon un hachage à cinq éléments (IP source, port source, IP de destination, port de destination, protocole).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The health probe marks an instance unhealthy when it stops responding, and the load balancer stops sending it new flows. Backend instances only need private IP addresses; the public IP is on the load balancer frontend. The default distribution mode is the five-tuple hash.
    fr: La sonde d'intégrité marque une instance comme défaillante quand elle ne répond plus, et l'équilibreur cesse de lui envoyer de nouveaux flux. Les instances du back-end n'ont besoin que d'adresses IP privées ; l'IP publique se trouve sur le front-end de l'équilibreur. Le mode de distribution par défaut est le hachage à cinq éléments.
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
  - title: Azure Load Balancer distribution modes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
