id: n3-lb-ha-ports-nva
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys deploys two firewall network virtual appliances (NVAs) in the hub virtual network of a hub-and-spoke topology. User-defined routes in the spoke subnets send all traffic to a frontend IP address in front of the NVAs.

    You need a load balancer to distribute all TCP and UDP flows, on every port, across the healthy NVAs by using a single load-balancing rule.

    How should you complete the configuration? Select the appropriate options in the answer area.
  fr: |
    Wingtip Toys déploie deux appliances virtuelles réseau (NVA) de pare-feu dans le réseau virtuel hub d'une topologie hub-and-spoke. Des itinéraires définis par l'utilisateur dans les sous-réseaux spoke envoient tout le trafic vers une adresse IP frontale placée devant les NVA.

    Vous avez besoin d'un équilibreur de charge qui répartisse tous les flux TCP et UDP, sur tous les ports, entre les NVA saines, à l'aide d'une seule règle d'équilibrage de charge.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Load balancer: [[lbtype]]

      Load-balancing rule protocol: [[proto]]

      Frontend port and backend port: [[port]]
    fr: |
      Équilibreur de charge : [[lbtype]]

      Protocole de la règle d'équilibrage de charge : [[proto]]

      Port frontal et port principal : [[port]]
  slots:
    - id: lbtype
      options:
        - { id: ilb, text: { en: Internal Standard Load Balancer, fr: Équilibreur de charge interne Standard } }
        - { id: plb, text: { en: Public Standard Load Balancer, fr: Équilibreur de charge public Standard } }
        - { id: gwlb, text: { en: Gateway Load Balancer, fr: Équilibreur de charge de passerelle } }
    - id: proto
      options:
        - { id: all, text: All }
        - { id: tcp, text: TCP }
        - { id: udp, text: UDP }
    - id: port
      options:
        - { id: p0, text: "0" }
        - { id: p1, text: "1" }
        - { id: p65535, text: "65535" }
        - { id: p443, text: "443" }
answer:
  values: { lbtype: ilb, proto: all, port: p0 }
explanation:
  correct:
    en: HA ports is a load-balancing rule type available only on an internal Standard Load Balancer. It is configured with the protocol All and the frontend and backend ports set to 0, so one rule balances every TCP and UDP flow on every port, which is the typical design for highly available NVAs reached through user-defined routes.
    fr: "Les ports HA sont un type de règle d'équilibrage de charge disponible uniquement sur un équilibreur de charge interne Standard. La règle se configure avec le protocole All et les ports frontal et principal à 0 : une seule règle équilibre alors tous les flux TCP et UDP sur tous les ports, ce qui est la conception type pour des NVA hautement disponibles atteintes via des itinéraires définis par l'utilisateur."
  options:
    plb: { en: HA ports rules are not available on a public load balancer., fr: Les règles de ports HA ne sont pas disponibles sur un équilibreur de charge public. }
    gwlb: { en: A Gateway Load Balancer is chained to a public frontend; it is not the target of user-defined routes from spoke subnets., fr: "Un équilibreur de charge de passerelle est chaîné à un front-end public ; ce n'est pas la cible d'itinéraires définis par l'utilisateur depuis les sous-réseaux spoke." }
    tcp: { en: TCP alone would leave UDP flows unbalanced., fr: TCP seul laisserait les flux UDP non équilibrés. }
    p65535: { en: "Port 65535 is a single port, not the all-ports value.", fr: "Le port 65535 est un port unique, pas la valeur « tous les ports »." }
references:
  - title: High availability ports overview in Azure - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
