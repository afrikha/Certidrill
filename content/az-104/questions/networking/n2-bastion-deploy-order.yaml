id: n2-bastion-deploy-order
objective: "4.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** with the address space 10.50.0.0/16. The whole address space is already allocated to existing subnets that host VMs, and the subnets cannot be resized. The range 10.60.0.0/24 is not used anywhere in your network. The VMs have no public IP addresses.

    You need to deploy Azure Bastion with the Standard SKU in VNet1 so that administrators can connect to the VMs.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dont l'espace d'adressage est 10.50.0.0/16. Tout l'espace d'adressage est déjà alloué à des sous-réseaux existants qui hébergent des machines virtuelles, et ces sous-réseaux ne peuvent pas être redimensionnés. La plage 10.60.0.0/24 n'est utilisée nulle part dans votre réseau. Les machines virtuelles n'ont pas d'adresse IP publique.

    Vous devez déployer Azure Bastion avec la référence SKU Standard dans VNet1 pour que les administrateurs se connectent aux machines virtuelles.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: space, text: { en: "Add the address range 10.60.0.0/24 to the address space of VNet1.", fr: "Ajouter la plage d'adresses 10.60.0.0/24 à l'espace d'adressage de VNet1." } }
    - { id: subnet, text: { en: "Add a subnet named AzureBastionSubnet with the prefix 10.60.0.0/26 to VNet1.", fr: "Ajouter à VNet1 un sous-réseau nommé AzureBastionSubnet avec le préfixe 10.60.0.0/26." } }
    - { id: host, text: { en: "Create the Bastion host in VNet1 with the Standard SKU and a new Standard static public IP address.", fr: "Créer l'hôte Bastion dans VNet1 avec la référence SKU Standard et une nouvelle adresse IP publique Standard statique." } }
    - { id: gw, text: { en: "Add a subnet named GatewaySubnet with the prefix 10.60.0.0/27 to VNet1.", fr: "Ajouter à VNet1 un sous-réseau nommé GatewaySubnet avec le préfixe 10.60.0.0/27." } }
    - { id: vmpip, text: { en: "Assign a public IP address to each VM.", fr: "Attribuer une adresse IP publique à chaque machine virtuelle." } }
    - { id: udr, text: { en: "Associate a route table with a 0.0.0.0/0 route to a firewall with AzureBastionSubnet.", fr: "Associer à AzureBastionSubnet une table de routage contenant une route 0.0.0.0/0 vers un pare-feu." } }
answer:
  sequence: [space, subnet, host]
explanation:
  correct:
    en: Bastion needs a dedicated subnet named exactly AzureBastionSubnet, /26 or larger, in the virtual network where it is deployed. Because VNet1 has no free space, you first add an address range, then create the subnet, then create the Bastion host with a Standard, static public IP address. The VMs need no public IP address.
    fr: "Bastion nécessite un sous-réseau dédié nommé exactement AzureBastionSubnet, de /26 ou plus, dans le réseau virtuel où il est déployé. Comme VNet1 n'a plus d'espace libre, vous ajoutez d'abord une plage d'adresses, puis créez le sous-réseau, puis l'hôte Bastion avec une adresse IP publique Standard statique. Les machines virtuelles n'ont pas besoin d'adresse IP publique."
  options:
    gw: { en: "GatewaySubnet is for VPN and ExpressRoute gateways.", fr: "GatewaySubnet est destiné aux passerelles VPN et ExpressRoute." }
    vmpip: { en: "Bastion connects to the VMs over their private IP addresses.", fr: "Bastion se connecte aux machines virtuelles via leurs adresses IP privées." }
    udr: { en: "User-defined routes are not supported on AzureBastionSubnet.", fr: "Les routes définies par l'utilisateur ne sont pas prises en charge sur AzureBastionSubnet." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
