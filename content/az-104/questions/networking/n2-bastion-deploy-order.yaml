id: n2-bastion-deploy-order
objective: "4.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** with the address space 10.50.0.0/16. The range 10.50.250.0/24 is unused. VMs in VNet1 have no public IP addresses.

    You need to deploy Azure Bastion with the Standard SKU so that administrators can connect to the VMs. Your company requires every public IP address to be created as a separate resource before the resource that uses it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** dont l'espace d'adressage est 10.50.0.0/16. La plage 10.50.250.0/24 est inutilisée. Les machines virtuelles de VNet1 n'ont pas d'adresse IP publique.

    Vous devez déployer Azure Bastion avec la référence SKU Standard pour que les administrateurs se connectent aux machines virtuelles. Votre entreprise exige que chaque adresse IP publique soit créée comme ressource distincte avant la ressource qui l'utilise.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: subnet, text: { en: "Add a subnet named AzureBastionSubnet with the prefix 10.50.250.0/26 to VNet1.", fr: "Ajouter à VNet1 un sous-réseau nommé AzureBastionSubnet avec le préfixe 10.50.250.0/26." } }
    - { id: pip, text: { en: Create a public IP address with the Standard SKU and a static assignment., fr: Créer une adresse IP publique de référence SKU Standard avec une attribution statique. } }
    - { id: host, text: { en: "Create the Bastion host in VNet1, select the Standard SKU and the public IP address.", fr: "Créer l'hôte Bastion dans VNet1, en sélectionnant la référence SKU Standard et l'adresse IP publique." } }
    - { id: gw, text: { en: "Add a subnet named GatewaySubnet with the prefix 10.50.250.0/27 to VNet1.", fr: "Ajouter à VNet1 un sous-réseau nommé GatewaySubnet avec le préfixe 10.50.250.0/27." } }
    - { id: vmpip, text: { en: Assign a public IP address to each VM., fr: Attribuer une adresse IP publique à chaque machine virtuelle. } }
    - { id: udr, text: { en: Associate a route table with a 0.0.0.0/0 route to a firewall with AzureBastionSubnet., fr: Associer à AzureBastionSubnet une table de routage contenant une route 0.0.0.0/0 vers un pare-feu. } }
answer:
  sequence: [subnet, pip, host]
explanation:
  correct:
    en: Bastion needs a dedicated subnet named AzureBastionSubnet of /26 or larger in the target virtual network, and a Standard, static public IP address (except for private-only Premium deployments). You then create the Bastion host and select both. The VMs need no public IP address.
    fr: "Bastion nécessite, dans le réseau virtuel cible, un sous-réseau dédié nommé AzureBastionSubnet de /26 ou plus, ainsi qu'une adresse IP publique Standard statique (sauf en déploiement Premium privé uniquement). Vous créez ensuite l'hôte Bastion en sélectionnant les deux. Les machines virtuelles n'ont pas besoin d'adresse IP publique."
  options:
    gw: { en: GatewaySubnet is for VPN and ExpressRoute gateways., fr: GatewaySubnet est destiné aux passerelles VPN et ExpressRoute. }
    vmpip: { en: Bastion connects to the VMs over their private IP addresses., fr: Bastion se connecte aux machines virtuelles via leurs adresses IP privées. }
    udr: { en: User-defined routes are not supported on AzureBastionSubnet., fr: Les routes définies par l'utilisateur ne sont pas prises en charge sur AzureBastionSubnet. }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
