id: n1-ts-choose-tool
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are troubleshooting the connectivity of a running virtual machine named **VM2**. Network Watcher is enabled in the region of VM2.

    Which tool should you use for each task? Select the appropriate options in the answer area.
  fr: |
    Vous résolvez des problèmes de connectivité d'une machine virtuelle en cours d'exécution nommée **VM2**. Network Watcher est activé dans la région de VM2.

    Quel outil devez-vous utiliser pour chaque tâche ? Sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Determine whether a security rule denies inbound TCP 22 from 10.5.0.10 to VM2: [[s1]]

      Identify the next hop type and the route table used for traffic from VM2 to 172.16.5.10: [[s2]]

      List every route applied to the network interface of VM2, including the routes learned through BGP: [[s3]]
    fr: |
      Déterminer si une règle de sécurité refuse le trafic TCP 22 entrant de 10.5.0.10 vers VM2 : [[s1]]

      Identifier le type de tronçon suivant et la table de routage utilisés pour le trafic de VM2 vers 172.16.5.10 : [[s2]]

      Lister toutes les routes appliquées à l'interface réseau de VM2, y compris les routes apprises par BGP : [[s3]]
  slots:
    - id: s1
      options:
        - { id: ipfv, text: { en: IP flow verify, fr: Vérification des flux IP } }
        - { id: nh, text: { en: Next hop, fr: Tronçon suivant } }
        - { id: er, text: { en: Effective routes of the network interface, fr: Itinéraires effectifs de l'interface réseau } }
        - { id: pc, text: { en: Packet capture, fr: Capture de paquets } }
    - id: s2
      options:
        - { id: ipfv, text: { en: IP flow verify, fr: Vérification des flux IP } }
        - { id: nh, text: { en: Next hop, fr: Tronçon suivant } }
        - { id: er, text: { en: Effective routes of the network interface, fr: Itinéraires effectifs de l'interface réseau } }
        - { id: pc, text: { en: Packet capture, fr: Capture de paquets } }
    - id: s3
      options:
        - { id: ipfv, text: { en: IP flow verify, fr: Vérification des flux IP } }
        - { id: nh, text: { en: Next hop, fr: Tronçon suivant } }
        - { id: er, text: { en: Effective routes of the network interface, fr: Itinéraires effectifs de l'interface réseau } }
        - { id: pc, text: { en: Packet capture, fr: Capture de paquets } }
answer:
  values: { s1: ipfv, s2: nh, s3: er }
explanation:
  correct:
    en: IP flow verify tests a specific flow against the security rules and names the rule that allows or denies it. Next hop returns the next hop type and route table for one destination address. The effective routes of a network interface list the combination of system routes, user-defined routes and BGP routes that apply to it.
    fr: "La vérification des flux IP teste un flux précis par rapport aux règles de sécurité et nomme la règle qui l'autorise ou le refuse. Le tronçon suivant renvoie le type de tronçon suivant et la table de routage pour une adresse de destination. Les itinéraires effectifs d'une interface réseau listent la combinaison des itinéraires système, des itinéraires définis par l'utilisateur et des itinéraires BGP qui s'y appliquent."
  options:
    pc: { en: Packet capture records packets for deep analysis; it is not the direct tool for any of these tasks., fr: La capture de paquets enregistre des paquets pour une analyse approfondie ; ce n'est l'outil direct d'aucune de ces tâches. }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - title: Diagnose an Azure virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
