id: n2-bastion-sku-match
objective: "4.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans four Azure Bastion deployments, each in a different virtual network. For each deployment, you must choose the SKU that meets the requirement at the lowest cost.

    Which SKU should you choose for each deployment? To answer, select the appropriate options in the answer area.
  fr: |
    Tailspin Toys prévoit quatre déploiements Azure Bastion, chacun dans un réseau virtuel différent. Pour chaque déploiement, vous devez choisir la référence SKU qui répond à l'exigence au coût le plus bas.

    Quelle référence SKU devez-vous choisir pour chaque déploiement ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.
body:
  layout: text
  template:
    en: |
      Record the RDP and SSH sessions to a storage account for audits: [[rec]]

      Deploy Bastion without any public IP address (private-only): [[priv]]

      Give a developer free portal access to one test VM at a time, without creating AzureBastionSubnet: [[dev]]

      Scale out the Bastion host to 10 instances for 200 concurrent RDP sessions: [[scale]]
    fr: |
      Enregistrer les sessions RDP et SSH dans un compte de stockage pour les audits : [[rec]]

      Déployer Bastion sans aucune adresse IP publique (déploiement privé uniquement) : [[priv]]

      Donner gratuitement à un développeur un accès par le portail à une machine virtuelle de test à la fois, sans créer AzureBastionSubnet : [[dev]]

      Faire monter en charge l'hôte Bastion à 10 instances pour 200 sessions RDP simultanées : [[scale]]
  slots:
    - id: rec
      options:
        - { id: developer, text: Developer }
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: priv
      options:
        - { id: developer, text: Developer }
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: dev
      options:
        - { id: developer, text: Developer }
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: scale
      options:
        - { id: developer, text: Developer }
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
answer:
  values: { rec: premium, priv: premium, dev: developer, scale: standard }
explanation:
  correct:
    en: Session recording and private-only deployment are available only with the Premium SKU. The Developer SKU is free, uses a shared resource, needs no AzureBastionSubnet or public IP address and supports one VM connection at a time. Host scaling (2 to 50 instances) starts with the Standard SKU; Basic is fixed at two instances.
    fr: "L'enregistrement de session et le déploiement privé uniquement ne sont disponibles qu'avec la référence SKU Premium. La référence SKU Developer est gratuite, utilise une ressource partagée, ne nécessite ni AzureBastionSubnet ni adresse IP publique et prend en charge une connexion de machine virtuelle à la fois. La mise à l'échelle de l'hôte (2 à 50 instances) commence avec la référence SKU Standard ; Basic est fixé à deux instances."
  options:
    standard: { en: "Standard has no session recording or private-only deployment, but it is the cheapest SKU with host scaling.", fr: "Standard n'offre ni enregistrement de session ni déploiement privé uniquement, mais c'est la référence SKU la moins chère avec mise à l'échelle de l'hôte." }
    basic: { en: Basic always runs two instances (up to 40 RDP sessions) and requires AzureBastionSubnet and a public IP., fr: "Basic exécute toujours deux instances (jusqu'à 40 sessions RDP) et exige AzureBastionSubnet et une adresse IP publique." }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
