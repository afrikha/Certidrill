id: n3-dns-child-zone
objective: "4.3.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts the public DNS zone **contoso.com** in Azure DNS. The domain is already delegated to Azure DNS at the registrar.

    The partner team must manage the records of **partners.contoso.com** in its own Azure DNS zone, in a separate resource group. You use the Azure CLI, so no part of the delegation is configured for you automatically.

    You need to delegate partners.contoso.com to the new zone and confirm that the delegation works.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso héberge la zone DNS publique **contoso.com** dans Azure DNS. Le domaine est déjà délégué à Azure DNS chez le bureau d'enregistrement.

    L'équipe chargée des partenaires doit gérer les enregistrements de **partners.contoso.com** dans sa propre zone Azure DNS, dans un groupe de ressources distinct. Vous utilisez Azure CLI : aucune partie de la délégation n'est configurée automatiquement pour vous.

    Vous devez déléguer partners.contoso.com à la nouvelle zone et vérifier que la délégation fonctionne.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a DNS zone named partners.contoso.com.", fr: "Créer une zone DNS nommée partners.contoso.com." } }
    - { id: getns, text: { en: "Retrieve the name servers assigned to the partners.contoso.com zone.", fr: "Récupérer les serveurs de noms attribués à la zone partners.contoso.com." } }
    - { id: nsrec, text: { en: "In the contoso.com zone, create an NS record set named **partners** that contains those name servers.", fr: "Dans la zone contoso.com, créer un jeu d'enregistrements NS nommé **partners** qui contient ces serveurs de noms." } }
    - { id: verify, text: { en: "Run `nslookup -type=SOA partners.contoso.com` and check the primary name server in the answer.", fr: "Exécuter `nslookup -type=SOA partners.contoso.com` et vérifier le serveur de noms principal dans la réponse." } }
    - { id: registrar, text: { en: "At the registrar, replace the NS records of contoso.com with the name servers of partners.contoso.com.", fr: "Chez le bureau d'enregistrement, remplacer les enregistrements NS de contoso.com par les serveurs de noms de partners.contoso.com." } }
    - { id: cname, text: { en: "In the contoso.com zone, create a CNAME record named **partners** that points to the first name server of the child zone.", fr: "Dans la zone contoso.com, créer un enregistrement CNAME nommé **partners** qui pointe vers le premier serveur de noms de la zone enfant." } }
    - { id: apexns, text: { en: "In the partners.contoso.com zone, create an NS record set at the apex that lists the name servers of contoso.com.", fr: "Dans la zone partners.contoso.com, créer à l'apex un jeu d'enregistrements NS qui liste les serveurs de noms de contoso.com." } }
answer:
  sequence: [ create, getns, nsrec, verify ]
explanation:
  correct:
    en: Azure DNS assigns name servers to a zone only when the zone is created, so you create the child zone first and then read its name servers. A subdomain is delegated by an NS record set in the parent zone whose name is the child label (partners). Once the record propagates, an SOA query for the child zone should return an Azure DNS name server of the child zone.
    fr: "Azure DNS n'attribue des serveurs de noms à une zone qu'au moment de sa création : vous créez d'abord la zone enfant, puis vous relevez ses serveurs de noms. Un sous-domaine est délégué par un jeu d'enregistrements NS dans la zone parente dont le nom est l'étiquette enfant (partners). Une fois l'enregistrement propagé, une requête SOA sur la zone enfant doit renvoyer un serveur de noms Azure DNS de la zone enfant."
  options:
    registrar:
      en: The registrar delegates contoso.com; changing it would break the parent domain. Subdomains are delegated from the parent zone.
      fr: Le bureau d'enregistrement délègue contoso.com ; le modifier casserait le domaine parent. Les sous-domaines sont délégués depuis la zone parente.
    cname:
      en: Delegation requires NS records; a CNAME cannot delegate a zone.
      fr: La délégation exige des enregistrements NS ; un CNAME ne peut pas déléguer une zone.
    apexns:
      en: The apex NS record set of the child zone is created automatically with the Azure DNS name servers of that zone and its prepopulated servers cannot be replaced.
      fr: Le jeu d'enregistrements NS de l'apex de la zone enfant est créé automatiquement avec les serveurs de noms Azure DNS de cette zone, et ses serveurs préremplis ne peuvent pas être remplacés.
references:
  - title: "Tutorial: Create an Azure child DNS zone - Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/tutorial-public-dns-zones-child
  - title: DNS Zones and Records Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
