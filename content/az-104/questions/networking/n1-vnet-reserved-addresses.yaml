id: n1-vnet-reserved-addresses
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named **VNet1** that contains a subnet named **App**. App uses the address range 10.20.1.0/24 and does not contain any resources yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un réseau virtuel nommé **VNet1** qui contient un sous-réseau nommé **App**. App utilise la plage d'adresses 10.20.1.0/24 et ne contient encore aucune ressource.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure uses 10.20.1.1 as the default gateway of the App subnet.
        fr: Azure utilise 10.20.1.1 comme passerelle par défaut du sous-réseau App.
    - id: s2
      text:
        en: 10.20.1.4 is the first address of App that can be assigned to the network interface of a virtual machine.
        fr: 10.20.1.4 est la première adresse d'App qui peut être attribuée à l'interface réseau d'une machine virtuelle.
    - id: s3
      text:
        en: You can assign 10.20.1.255 as a static private IP address to a virtual machine in App.
        fr: Vous pouvez attribuer 10.20.1.255 comme adresse IP privée statique à une machine virtuelle d'App.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Azure reserves the first four addresses and the last address of every subnet. In 10.20.1.0/24, .0 is the network address, .1 is the default gateway, .2 and .3 map the Azure DNS addresses into the virtual network, and .255 is the broadcast address. The first assignable address is therefore 10.20.1.4, and 10.20.1.255 can never be assigned to a resource.
    fr: "Azure réserve les quatre premières adresses et la dernière adresse de chaque sous-réseau. Dans 10.20.1.0/24, .0 est l'adresse réseau, .1 la passerelle par défaut, .2 et .3 mappent les adresses d'Azure DNS dans le réseau virtuel, et .255 est l'adresse de diffusion. La première adresse attribuable est donc 10.20.1.4, et 10.20.1.255 ne peut jamais être attribuée à une ressource."
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
