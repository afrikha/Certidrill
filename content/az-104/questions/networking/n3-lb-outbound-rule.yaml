id: n3-lb-outbound-rule
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a public Standard Load Balancer named **LB1**. LB1 has the following configuration:

    - Frontend IP configuration **FE1** that uses the public IP address **PIP1**
    - Frontend IP configuration **FE2** that uses the public IP address **PIP2**
    - Backend pool **Pool1** configured by NIC, that contains four virtual machines without public IP addresses
    - Load-balancing rule **Rule1**: FE1, TCP 443, Pool1, default settings

    Partners allow only PIP2 in their firewalls. You need all the outbound internet traffic from the virtual machines in Pool1, both TCP and UDP, to use PIP2. You must also be able to set the number of SNAT ports allocated to each virtual machine.

    What should you do?
  fr: |
    Fabrikam dispose d'un équilibreur de charge public Standard nommé **LB1**. LB1 a la configuration suivante :

    - Configuration IP frontale **FE1** qui utilise l'adresse IP publique **PIP1**
    - Configuration IP frontale **FE2** qui utilise l'adresse IP publique **PIP2**
    - Pool principal **Pool1** configuré par carte réseau, qui contient quatre machines virtuelles sans adresse IP publique
    - Règle d'équilibrage de charge **Rule1** : FE1, TCP 443, Pool1, paramètres par défaut

    Les partenaires n'autorisent que PIP2 dans leurs pare-feu. Tout le trafic Internet sortant des machines virtuelles de Pool1, TCP comme UDP, doit utiliser PIP2. Vous devez aussi pouvoir définir le nombre de ports SNAT alloués à chaque machine virtuelle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Disable outbound SNAT on Rule1, and then create an outbound rule that uses FE2, Pool1 and the protocol All.", fr: "Désactiver la SNAT sortante sur Rule1, puis créer une règle de trafic sortant qui utilise FE2, Pool1 et le protocole All." }
    - id: b
      text: { en: "Create an inbound NAT rule that uses FE2 and targets Pool1, and keep the default settings of Rule1.", fr: "Créer une règle NAT entrante qui utilise FE2 et cible Pool1, et conserver les paramètres par défaut de Rule1." }
    - id: c
      text: { en: "Change the frontend of Rule1 to FE2, and then set the session persistence of Rule1 to Client IP.", fr: "Remplacer le front-end de Rule1 par FE2, puis définir la persistance de session de Rule1 sur Adresse IP du client." }
    - id: d
      text: { en: "Disable outbound SNAT on Rule1, and then add a load-balancing rule that uses FE2, Pool1 and HA ports.", fr: "Désactiver la SNAT sortante sur Rule1, puis ajouter une règle d'équilibrage de charge qui utilise FE2, Pool1 et les ports HA." }
answer: { optionId: a }
explanation:
  correct:
    en: An outbound rule explicitly defines SNAT for a backend pool on a public Standard Load Balancer, including the frontend IP used, the protocol (All covers TCP and UDP) and the number of SNAT ports per instance. The automatic outbound SNAT of Rule1 must be disabled so that the outbound rule controls outbound traffic for the same pool.
    fr: "Une règle de trafic sortant définit explicitement la SNAT d'un pool principal sur un équilibreur de charge public Standard : l'IP frontale utilisée, le protocole (All couvre TCP et UDP) et le nombre de ports SNAT par instance. La SNAT sortante automatique de Rule1 doit être désactivée pour que la règle de trafic sortant contrôle le trafic sortant du même pool."
  options:
    b:
      en: Inbound NAT rules provide port forwarding to the virtual machines only; they never provide outbound NAT.
      fr: Les règles NAT entrantes assurent uniquement la redirection de port vers les machines virtuelles ; elles ne fournissent jamais de NAT sortante.
    c:
      en: The implicit SNAT of a load-balancing rule follows the rule's protocol (TCP only here) and does not let you set the SNAT port allocation; session persistence has no effect on outbound traffic.
      fr: La SNAT implicite d'une règle d'équilibrage de charge suit le protocole de la règle (TCP seulement ici) et ne permet pas de définir l'allocation de ports SNAT ; la persistance de session n'a aucun effet sur le trafic sortant.
    d:
      en: HA ports rules are available only on an internal Standard Load Balancer, so this rule cannot be created on LB1.
      fr: Les règles de ports HA ne sont disponibles que sur un équilibreur de charge interne Standard ; cette règle ne peut donc pas être créée sur LB1.
references:
  - title: Outbound Rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
