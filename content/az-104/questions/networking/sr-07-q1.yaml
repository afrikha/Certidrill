id: sr-07-q1
objective: "4.1.2"
type: series_yesno
series: sr-07-spoke-to-spoke
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You allow forwarded traffic on all the existing peerings.
  fr: |
    Vous autorisez le trafic transféré sur tous les peerings existants.
body:
  solution:
    en: |
      On the four existing peering links (VNetHub to VNet1, VNet1 to VNetHub, VNetHub to VNet2, and VNet2 to VNetHub), you enable the setting that allows **traffic forwarded** from the remote virtual network.
    fr: |
      Sur les quatre liens de peering existants (VNetHub vers VNet1, VNet1 vers VNetHub, VNetHub vers VNet2 et VNet2 vers VNetHub), vous activez le paramètre qui autorise le **trafic transféré** depuis le réseau virtuel distant.
answer: { value: false }
explanation:
  correct:
    en: |
      Peering isn't transitive: VNet1 and VNet2 each learn only the routes of VNetHub, never the address space of each other. Allowing forwarded traffic only accepts packets that a device in the peered network has forwarded; no virtual appliance forwards anything and no route sends VNet2 traffic toward the hub. VNet1 still can't reach VNet2, so the goal isn't met.
    fr: |
      Le peering n'est pas transitif : VNet1 et VNet2 n'apprennent chacun que les itinéraires de VNetHub, jamais l'espace d'adressage de l'autre. Autoriser le trafic transféré permet seulement d'accepter les paquets qu'un équipement du réseau appairé a transférés ; aucune appliance virtuelle ne transfère quoi que ce soit et aucun itinéraire n'envoie le trafic destiné à VNet2 vers le hub. VNet1 ne peut toujours pas atteindre VNet2 : l'objectif n'est pas atteint.
references:
