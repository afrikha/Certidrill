seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You peer VNet1 directly with VNet2.
  fr: |
    Vous appairez directement VNet1 avec VNet2.
body:
  solution:
    en: |
      You create a virtual network peering between **VNet1** and **VNet2**, which creates the peering link in both directions, with access between the two virtual networks allowed.
    fr: |
      Vous créez un peering de réseaux virtuels entre **VNet1** et **VNet2**, ce qui crée le lien de peering dans les deux sens, avec l'accès entre les deux réseaux virtuels autorisé.
answer: { value: true }
explanation:
  correct:
    en: |
      Resources in directly peered virtual networks can connect to each other by using private IP addresses over the Microsoft backbone. The address spaces don't overlap and the network security groups allow the traffic, so the virtual machines of VNet1 and VNet2 can communicate and the goal is met.
    fr: |
      Les ressources de réseaux virtuels directement appairés peuvent se connecter entre elles avec leurs adresses IP privées via le réseau principal de Microsoft. Les espaces d'adressage ne se chevauchent pas et les groupes de sécurité réseau autorisent le trafic : les machines virtuelles de VNet1 et de VNet2 peuvent communiquer et l'objectif est atteint.
references:
  - title: "Azure Virtual Network Peering"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
