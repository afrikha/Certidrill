id: n1-vnet-subnet-delegation
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an App Service app named **app-orders** in a Premium v3 App Service plan, and a virtual network named **VNet1** in the same region. VNet1 contains an empty subnet named **snet-integration**.

    You plan to use App Service virtual network integration so that app-orders can reach resources in VNet1. The subnet must be dedicated to App Service, and App Service must be able to apply the network configuration it requires to the subnet.

    What should you configure on snet-integration?
  fr: |
    Vous disposez d'une application App Service nommée **app-orders** dans un plan App Service Premium v3, et d'un réseau virtuel nommé **VNet1** dans la même région. VNet1 contient un sous-réseau vide nommé **snet-integration**.

    Vous prévoyez d'utiliser l'intégration au réseau virtuel d'App Service pour qu'app-orders puisse joindre des ressources de VNet1. Le sous-réseau doit être dédié à App Service, et App Service doit pouvoir appliquer au sous-réseau la configuration réseau dont il a besoin.

    Que devez-vous configurer sur snet-integration ?
body:
  options:
    - { id: a, text: { en: A subnet delegation to Microsoft.Web/serverFarms, fr: Une délégation de sous-réseau à Microsoft.Web/serverFarms } }
    - { id: b, text: { en: A service endpoint for Microsoft.Web, fr: Un point de terminaison de service pour Microsoft.Web } }
    - { id: c, text: { en: A private endpoint for app-orders, fr: Un point de terminaison privé pour app-orders } }
    - { id: d, text: { en: A NAT gateway associated with the subnet, fr: Une passerelle NAT associée au sous-réseau } }
answer: { optionId: a }
explanation:
  correct:
    en: Subnet delegation designates a subnet for a specific Azure PaaS service that is injected into the virtual network, and lets that service apply the network intent policies it needs. App Service virtual network integration uses a dedicated subnet delegated to Microsoft.Web/serverFarms.
    fr: La délégation de sous-réseau réserve un sous-réseau à un service PaaS Azure précis injecté dans le réseau virtuel, et permet à ce service d'appliquer les stratégies d'intention réseau dont il a besoin. L'intégration au réseau virtuel d'App Service utilise un sous-réseau dédié, délégué à Microsoft.Web/serverFarms.
  options:
    b: { en: A service endpoint secures traffic from the subnet to a PaaS service; it does not dedicate the subnet to App Service., fr: Un point de terminaison de service sécurise le trafic du sous-réseau vers un service PaaS ; il ne dédie pas le sous-réseau à App Service. }
    c: { en: A private endpoint provides inbound private access to the app; virtual network integration is for outbound calls., fr: Un point de terminaison privé fournit un accès privé entrant à l'application ; l'intégration au réseau virtuel concerne les appels sortants. }
    d: { en: A NAT gateway provides a dedicated outbound IP address; it is optional and does not delegate the subnet., fr: Une passerelle NAT fournit une adresse IP sortante dédiée ; elle est facultative et ne délègue pas le sous-réseau. }
references:
  - title: Subnet Delegation in Azure Virtual Network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/subnet-delegation-overview
  - title: Integrate your app with an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
