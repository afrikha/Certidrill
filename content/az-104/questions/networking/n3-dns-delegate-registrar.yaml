id: n3-dns-delegate-registrar
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys bought the domain name **tailspin-games.com** from a third-party domain registrar. The registrar currently hosts the domain on its own name servers.

    You create a public DNS zone named **tailspin-games.com** in Azure DNS and add the required A and MX records to it.

    You need internet clients to resolve the records of tailspin-games.com from the Azure DNS zone.

    What should you do next?
  fr: |
    Tailspin Toys a acheté le nom de domaine **tailspin-games.com** auprès d'un bureau d'enregistrement de domaines tiers. Le bureau d'enregistrement héberge actuellement le domaine sur ses propres serveurs de noms.

    Vous créez une zone DNS publique nommée **tailspin-games.com** dans Azure DNS et vous y ajoutez les enregistrements A et MX nécessaires.

    Les clients Internet doivent résoudre les enregistrements de tailspin-games.com à partir de la zone Azure DNS.

    Que devez-vous faire ensuite ?
body:
  options:
    - id: a
      text: { en: "At the registrar, replace the domain's NS records with the four name servers assigned to the Azure DNS zone.", fr: "Chez le bureau d'enregistrement, remplacer les enregistrements NS du domaine par les quatre serveurs de noms attribués à la zone Azure DNS." }
    - id: b
      text: { en: "In the Azure DNS zone, edit the SOA record so that its host property points to the registrar's primary name server.", fr: "Dans la zone Azure DNS, modifier l'enregistrement SOA pour que sa propriété host désigne le serveur de noms principal du bureau d'enregistrement." }
    - id: c
      text: { en: "At the registrar, create a CNAME record for tailspin-games.com that points to the Azure DNS zone name.", fr: "Chez le bureau d'enregistrement, créer un enregistrement CNAME pour tailspin-games.com qui pointe vers le nom de la zone Azure DNS." }
    - id: d
      text: { en: "In the Azure DNS zone, add the registrar's name servers to the NS record set at the zone apex.", fr: "Dans la zone Azure DNS, ajouter les serveurs de noms du bureau d'enregistrement au jeu d'enregistrements NS à l'apex de la zone." }
answer: { optionId: a }
explanation:
  correct:
    en: Creating a zone in Azure DNS does not make it authoritative on the internet. You must delegate the domain by configuring, at the registrar, NS records that list all four Azure DNS name servers shown on the zone's Overview page. The parent zone (.com) then refers resolvers to Azure DNS.
    fr: "Créer une zone dans Azure DNS ne la rend pas faisant autorité sur Internet. Vous devez déléguer le domaine en configurant, chez le bureau d'enregistrement, des enregistrements NS qui listent les quatre serveurs de noms Azure DNS affichés dans la page Vue d'ensemble de la zone. La zone parente (.com) redirige alors les résolveurs vers Azure DNS."
  options:
    b:
      en: The host property of the SOA record is fixed to the Azure DNS primary name server and cannot be changed; the SOA record does not delegate the domain anyway.
      fr: La propriété host de l'enregistrement SOA est fixée sur le serveur de noms principal Azure DNS et ne peut pas être modifiée ; l'enregistrement SOA ne délègue de toute façon pas le domaine.
    c:
      en: A CNAME record cannot be created at the zone apex, and delegation is done with NS records, not CNAME records.
      fr: Un enregistrement CNAME ne peut pas être créé à l'apex de la zone, et la délégation se fait avec des enregistrements NS, pas des enregistrements CNAME.
    d:
      en: Adding name servers to the apex NS record set inside Azure only supports co-hosting; the parent zone still points to the registrar's servers, so resolvers never reach Azure DNS.
      fr: Ajouter des serveurs de noms au jeu d'enregistrements NS de l'apex dans Azure sert uniquement au co-hébergement ; la zone parente pointe toujours vers les serveurs du bureau d'enregistrement, donc les résolveurs n'atteignent jamais Azure DNS.
references:
  - title: "Tutorial: Host your domain in Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
  - title: DNS Zones and Records Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
