id: n1-ts-next-hop
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Traffic from a virtual machine named **VM1** to a server at 10.20.0.4 should be inspected by a network virtual appliance, but the appliance logs show no traffic from VM1.

    You need to identify the next hop type and the route table that Azure uses for traffic from VM1 to 10.20.0.4.

    Which Network Watcher feature should you use?
  fr: |
    Le trafic d'une machine virtuelle nommée **VM1** vers un serveur en 10.20.0.4 devrait être inspecté par une appliance virtuelle réseau, mais les journaux de l'appliance n'indiquent aucun trafic provenant de VM1.

    Vous devez identifier le type de tronçon suivant et la table de routage qu'Azure utilise pour le trafic de VM1 vers 10.20.0.4.

    Quelle fonctionnalité de Network Watcher devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: Next hop, fr: Tronçon suivant } }
    - { id: b, text: { en: IP flow verify, fr: Vérification des flux IP } }
    - { id: c, text: { en: Connection monitor, fr: Moniteur de connexion } }
    - { id: d, text: { en: Virtual network flow logs, fr: Journaux de flux de réseau virtuel } }
answer: { optionId: a }
explanation:
  correct:
    en: Next hop returns the next hop type, the next hop IP address and the route table ID for traffic from a virtual machine to a destination IP address. If a user-defined route is used, it returns the route table that contains the route; otherwise it reports System Route.
    fr: "Le tronçon suivant renvoie le type de tronçon suivant, l'adresse IP du tronçon suivant et l'ID de la table de routage pour le trafic d'une machine virtuelle vers une adresse IP de destination. Si un itinéraire défini par l'utilisateur est utilisé, il renvoie la table de routage qui contient la route ; sinon, il indique System Route."
  options:
    b: { en: "IP flow verify evaluates security rules, not routes.", fr: "La vérification des flux IP évalue les règles de sécurité, pas les routes." }
    c: { en: Connection monitor continuously monitors reachability and latency; it does not report the route table used., fr: Le Moniteur de connexion surveille en continu l'accessibilité et la latence ; il n'indique pas la table de routage utilisée. }
    d: { en: Flow logs record the IP traffic that flows through a virtual network; they do not show the routing decision., fr: Les journaux de flux enregistrent le trafic IP qui traverse un réseau virtuel ; ils n'indiquent pas la décision de routage. }
references:
  - title: Next Hop Overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview
