id: cs3-treyresearch-04
objective: "4.2.4"
type: multi
caseStudy: cs3-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the network requirement for sttreydata.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence réseau de sttreydata.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on snet-hpc.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-hpc." } }
    - { id: b, text: { en: "On sttreydata, set public network access to Enabled from selected virtual networks and IP addresses and add a virtual network rule for snet-hpc.", fr: "Sur sttreydata, définir l'accès réseau public sur Activé à partir des réseaux virtuels et adresses IP sélectionnés et ajouter une règle de réseau virtuel pour snet-hpc." } }
    - { id: c, text: { en: "Create a private endpoint for the blob service of sttreydata in snet-hpc.", fr: "Créer un point de terminaison privé pour le service blob de sttreydata dans snet-hpc." } }
    - { id: d, text: { en: "Add an IP network rule for 10.70.0.0/22 on sttreydata.", fr: "Ajouter une règle de réseau IP pour 10.70.0.0/22 sur sttreydata." } }
    - { id: e, text: { en: "Associate a NAT gateway with snet-hpc.", fr: "Associer une passerelle NAT à snet-hpc." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "A service endpoint extends the identity of snet-hpc to Azure Storage over the Azure backbone and has no extra charge. The storage firewall then allows only the selected virtual networks: a virtual network rule for snet-hpc admits traffic from that subnet, and all other public traffic is denied."
    fr: "Un point de terminaison de service étend l'identité de snet-hpc à Stockage Azure via le réseau principal Azure, sans frais supplémentaires. Le pare-feu du stockage n'autorise alors que les réseaux virtuels sélectionnés : une règle de réseau virtuel pour snet-hpc admet le trafic de ce sous-réseau, et tout autre trafic public est refusé."
  options:
    c: { en: "A private endpoint also keeps traffic on the backbone, but it is billed per hour and per GB processed.", fr: "Un point de terminaison privé maintient aussi le trafic sur le réseau principal, mais il est facturé à l'heure et par Go traité." }
    d: { en: "IP network rules grant access to public internet address ranges. Traffic from snet-hpc reaches the account from private addresses, so an IP rule for 10.70.0.0/22 has no effect.", fr: "Les règles de réseau IP accordent l'accès à des plages d'adresses Internet publiques. Le trafic de snet-hpc atteint le compte depuis des adresses privées : une règle IP pour 10.70.0.0/22 n'a aucun effet." }
    e: { en: "A NAT gateway is a billed resource and sends traffic from public IP addresses; it doesn't restrict access to the storage account.", fr: "Une passerelle NAT est une ressource facturée qui envoie le trafic depuis des adresses IP publiques ; elle ne limite pas l'accès au compte de stockage." }
references:
  - title: "Azure virtual network service endpoints"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: "Configure Azure Storage firewalls and virtual networks"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
