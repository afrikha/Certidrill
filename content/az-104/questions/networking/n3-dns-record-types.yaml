id: n3-dns-record-types
objective: "4.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam hosts the public DNS zone **fabrikam-shop.com** in Azure DNS. You need to add records to the zone to meet several requirements.

    Which record type should you create for each requirement? To answer, drag the appropriate record types to the correct requirements. Each record type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam héberge la zone DNS publique **fabrikam-shop.com** dans Azure DNS. Vous devez ajouter des enregistrements à la zone pour répondre à plusieurs exigences.

    Quel type d'enregistrement devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les types d'enregistrements appropriés vers les exigences correspondantes. Chaque type d'enregistrement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aaaa, text: AAAA }
    - { id: cname, text: CNAME }
    - { id: mx, text: MX }
    - { id: txt, text: TXT }
    - { id: caa, text: CAA }
    - { id: ptr, text: PTR }
  targets:
    - id: mail
      text: { en: "Direct email for the domain to the mail server mail.fabrikam-shop.com", fr: "Diriger le courrier électronique du domaine vers le serveur de messagerie mail.fabrikam-shop.com" }
    - id: spf
      text: { en: "Publish a Sender Policy Framework (SPF) policy for the domain", fr: "Publier une stratégie SPF (Sender Policy Framework) pour le domaine" }
    - id: www
      text: { en: "Make shop.fabrikam-shop.com an alias of the host name fabrikam-shop.azurewebsites.net", fr: "Faire de shop.fabrikam-shop.com un alias du nom d'hôte fabrikam-shop.azurewebsites.net" }
    - id: ca
      text: { en: "Specify which certificate authorities are allowed to issue certificates for the domain", fr: "Indiquer quelles autorités de certification sont autorisées à émettre des certificats pour le domaine" }
answer:
  mapping: { mail: mx, spf: txt, www: cname, ca: caa }
explanation:
  correct:
    en: An MX record maps the domain to its mail servers. SPF policies must be published as TXT records, because Azure DNS does not support the obsolete SPF record type. A CNAME record maps a name to another host name. A CAA record lists the certificate authorities allowed to issue certificates for the domain.
    fr: Un enregistrement MX associe le domaine à ses serveurs de messagerie. Les stratégies SPF doivent être publiées sous forme d'enregistrements TXT, car Azure DNS ne prend pas en charge l'ancien type d'enregistrement SPF. Un enregistrement CNAME associe un nom à un autre nom d'hôte. Un enregistrement CAA liste les autorités de certification autorisées à émettre des certificats pour le domaine.
  options:
    aaaa: { en: "An AAAA record maps a name to an IPv6 address.", fr: "Un enregistrement AAAA associe un nom à une adresse IPv6." }
    ptr: { en: "A PTR record is used for reverse lookups (IP address to name).", fr: "Un enregistrement PTR sert aux recherches inversées (de l'adresse IP vers le nom)." }
references:
  - title: DNS Zones and Records Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
