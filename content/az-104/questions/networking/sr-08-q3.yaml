id: sr-08-q3
objective: "4.2.3"
type: series_yesno
series: sr-08-bastion-rdp
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure Bastion to a subnet named BastionSubnet.
  fr: |
    Vous déployez Azure Bastion dans un sous-réseau nommé BastionSubnet.
body:
  solution:
    en: |
      You create a **/26** subnet named **BastionSubnet** in VNet1 and try to deploy an Azure Bastion host of the **Basic** SKU to it.
    fr: |
      Vous créez dans VNet1 un sous-réseau **/26** nommé **BastionSubnet** et tentez d'y déployer un hôte Azure Bastion de la référence SKU **Basic**.
answer: { value: false }
explanation:
  correct:
    en: |
      Every Bastion SKU except the Developer offering requires a dedicated subnet whose name is exactly **AzureBastionSubnet**. A subnet named BastionSubnet can't host the Basic bastion, so the deployment fails and administrators can't connect. The goal isn't met.
    fr: |
      Toutes les références SKU de Bastion, sauf l'offre Developer, exigent un sous-réseau dédié dont le nom est exactement **AzureBastionSubnet**. Un sous-réseau nommé BastionSubnet ne peut pas héberger le bastion Basic : le déploiement échoue et les administrateurs ne peuvent pas se connecter. L'objectif n'est pas atteint.
references:
  - title: "About Azure Bastion configuration settings"
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
