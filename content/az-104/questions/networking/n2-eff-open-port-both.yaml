id: n2-eff-open-port-both
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A VM named **VM5** has a public IP address and runs an application that listens on TCP 8443. Its subnet is associated with the network security group **NSG-A**, and its network interface is associated with **NSG-B**. Both NSGs contain only their default rules.

    You need to allow clients on the internet to connect to the application. Other traffic must remain unchanged.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM5** possède une adresse IP publique et exécute une application qui écoute sur TCP 8443. Son sous-réseau est associé au groupe de sécurité réseau **NSG-A**, et son interface réseau à **NSG-B**. Les deux NSG ne contiennent que leurs règles par défaut.

    Vous devez permettre aux clients d'Internet de se connecter à l'application. Le reste du trafic doit rester inchangé.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an inbound rule to NSG-A that allows TCP 8443 from the Internet service tag.", fr: "Ajouter à NSG-A une règle entrante qui autorise TCP 8443 depuis l'étiquette de service Internet." } }
    - { id: b, text: { en: "Add an inbound rule to NSG-B that allows TCP 8443 from the Internet service tag.", fr: "Ajouter à NSG-B une règle entrante qui autorise TCP 8443 depuis l'étiquette de service Internet." } }
    - { id: c, text: { en: "Add an outbound rule to NSG-B that allows the responses from source port 8443 to the internet.", fr: "Ajouter à NSG-B une règle sortante qui autorise les réponses depuis le port source 8443 vers Internet." } }
    - { id: d, text: { en: "Change the action of the DenyAllInbound default rule in NSG-B to Allow.", fr: "Remplacer l'action de la règle par défaut DenyAllInbound de NSG-B par Allow." } }
    - { id: e, text: { en: "Associate NSG-A with the virtual network instead of the subnet.", fr: "Associer NSG-A au réseau virtuel au lieu du sous-réseau." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: When NSGs are associated with both the subnet and the network interface, inbound traffic must be allowed by the subnet NSG and then by the NIC NSG. Each NSG therefore needs its own allow rule for TCP 8443 with a priority between 100 and 4096.
    fr: "Lorsque des NSG sont associés à la fois au sous-réseau et à l'interface réseau, le trafic entrant doit être autorisé par le NSG du sous-réseau puis par celui de l'interface. Chaque NSG doit donc avoir sa propre règle d'autorisation pour TCP 8443, avec une priorité comprise entre 100 et 4096."
  options:
    c: { en: "NSGs are stateful, so responses to allowed inbound connections need no outbound rule.", fr: "Les NSG sont avec état : les réponses aux connexions entrantes autorisées n'ont pas besoin de règle sortante." }
    d: { en: "Default rules cannot be modified or removed, and allowing everything would change other traffic.", fr: "Les règles par défaut ne peuvent être ni modifiées ni supprimées, et tout autoriser changerait le reste du trafic." }
    e: { en: "NSGs cannot be associated with a virtual network.", fr: "Un NSG ne peut pas être associé à un réseau virtuel." }
references:
  - title: Diagnose a virtual machine network traffic filter problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-traffic-filter-problem
