id: n1-udr-association-rules
objective: "4.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage route tables and virtual networks in a subscription named **Sub1**. Sub1 contains virtual networks in the East US and West Europe regions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.
  fr: |
    Vous gérez des tables de routage et des réseaux virtuels dans un abonnement nommé **Sub1**. Sub1 contient des réseaux virtuels dans les régions East US et West Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.
body:
  statements:
    - id: s1
      text:
        en: A subnet can be associated with two route tables at the same time.
        fr: Un sous-réseau peut être associé à deux tables de routage en même temps.
    - id: s2
      text:
        en: A single route table can be associated with several subnets.
        fr: Une même table de routage peut être associée à plusieurs sous-réseaux.
    - id: s3
      text:
        en: A route table created in East US can be associated with a subnet of a virtual network in West Europe.
        fr: Une table de routage créée dans East US peut être associée à un sous-réseau d'un réseau virtuel situé dans West Europe.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Each subnet can have zero or one route table, while a route table can be associated with zero or more subnets. A route table can only be associated with subnets of virtual networks in the same Azure region and subscription as the route table.
    fr: "Chaque sous-réseau peut avoir zéro ou une table de routage, alors qu'une table de routage peut être associée à zéro ou plusieurs sous-réseaux. Une table de routage ne peut être associée qu'à des sous-réseaux de réseaux virtuels situés dans la même région Azure et le même abonnement qu'elle."
references:
  - title: Create, change, or delete an Azure route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
