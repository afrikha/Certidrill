id: n2-eff-outbound-tags
objective: "4.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A VM named **VM1** is connected to Subnet1 of **VNet1** in West Europe. VNet1 is peered with **VNet2**. The network security group **NSG1** is associated with Subnet1, and no NSG is associated with the network interface of VM1. The outbound security rules of NSG1 are shown in the following table.

    Answer each prompt by selecting the rule that processes the traffic.
  fr: |
    Une machine virtuelle nommée **VM1** est connectée à Subnet1 de **VNet1** en West Europe. VNet1 est appairé avec **VNet2**. Le groupe de sécurité réseau **NSG1** est associé à Subnet1, et aucun NSG n'est associé à l'interface réseau de VM1. Les règles de sécurité sortantes de NSG1 figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.
body:
  prompts:
    - id: p1
      text: { en: VM1 connects on TCP 1433 to the public endpoint of an Azure SQL database hosted in North Europe, fr: VM1 se connecte sur TCP 1433 au point de terminaison public d'une base de données Azure SQL hébergée en North Europe }
    - id: p2
      text: { en: VM1 connects on TCP 443 to a VM in VNet2, fr: VM1 se connecte sur TCP 443 à une machine virtuelle de VNet2 }
  grid:
    caption: { en: NSG1 outbound security rules, fr: Règles de sécurité sortantes de NSG1 }
    header: [{ en: Priority, fr: Priorité }, { en: Name, fr: Nom }, Destination, Port, Action]
    rows:
      - [{ text: "100" }, { text: Allow-Sql-WE, area: r100 }, { text: Sql.WestEurope }, { text: "1433" }, { text: Allow }]
      - [{ text: "110" }, { text: Allow-Storage, area: r110 }, { text: Storage }, { text: "443" }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-Internet, area: r200 }, { text: Internet }, { text: Any }, { text: Deny }]
      - [{ text: "65000" }, { text: AllowVnetOutBound, area: r65000 }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowInternetOutBound, area: r65001 }, { text: Internet }, { text: Any }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllOutBound, area: r65500 }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r200, p2: r65000 }
explanation:
  correct:
    en: Sql.WestEurope only contains the Azure SQL prefixes of West Europe, so a database in North Europe does not match rule 100. The public endpoint is part of the Internet service tag, which includes Azure-owned public addresses, so Deny-Internet (200) blocks the connection. A VM in a peered virtual network is not in the Internet tag; the traffic matches AllowVnetOutBound (65000), because VirtualNetwork includes peered address spaces.
    fr: "Sql.WestEurope ne contient que les préfixes Azure SQL de West Europe : une base de données en North Europe ne correspond pas à la règle 100. Le point de terminaison public fait partie de l'étiquette de service Internet, qui inclut les adresses publiques appartenant à Azure : Deny-Internet (200) bloque la connexion. Une machine virtuelle d'un réseau virtuel appairé n'est pas dans l'étiquette Internet ; le trafic correspond à AllowVnetOutBound (65000), car VirtualNetwork inclut les espaces d'adressage appairés."
  options:
    r100: { en: The regional tag Sql.WestEurope excludes SQL addresses in North Europe., fr: L'étiquette régionale Sql.WestEurope exclut les adresses SQL de North Europe. }
    r65001: { en: "AllowInternetOutBound is never reached for the SQL connection: Deny-Internet (200) matches first.", fr: "AllowInternetOutBound n'est jamais atteinte pour la connexion SQL : Deny-Internet (200) correspond en premier." }
references:
  - title: Azure service tags overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
