id: n2-eff-outbound-order
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A VM named **VM2** is connected to a subnet named **Subnet2**. The network security group **NSG-A** is associated with Subnet2, and **NSG-B** is associated with the network interface of VM2.

    - NSG-A contains an outbound rule with priority 100 that **allows** TCP 443 to the **Internet** service tag.
    - NSG-B contains an outbound rule with priority 300 that **denies** TCP 443 to the **Internet** service tag.

    VM2 initiates an HTTPS connection to a public website. What is the result?
  fr: |
    Une machine virtuelle nommée **VM2** est connectée à un sous-réseau nommé **Subnet2**. Le groupe de sécurité réseau **NSG-A** est associé à Subnet2, et **NSG-B** est associé à l'interface réseau de VM2.

    - NSG-A contient une règle sortante de priorité 100 qui **autorise** TCP 443 vers l'étiquette de service **Internet**.
    - NSG-B contient une règle sortante de priorité 300 qui **refuse** TCP 443 vers l'étiquette de service **Internet**.

    VM2 initie une connexion HTTPS vers un site web public. Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "The connection is denied by NSG-B, and NSG-A never evaluates it.", fr: "La connexion est refusée par NSG-B, et NSG-A ne l'évalue jamais." } }
    - { id: b, text: { en: "The connection is allowed, because the NSG-A rule has the higher priority (100).", fr: "La connexion est autorisée, car la règle de NSG-A a la priorité la plus élevée (100)." } }
    - { id: c, text: { en: "The connection is allowed, because NSG-A is evaluated first and stops the processing.", fr: "La connexion est autorisée, car NSG-A est évalué en premier et arrête le traitement." } }
    - { id: d, text: { en: "The connection is allowed by the default rule AllowInternetOutBound of NSG-B.", fr: "La connexion est autorisée par la règle par défaut AllowInternetOutBound de NSG-B." } }
answer: { optionId: a }
explanation:
  correct:
    en: For outbound traffic, Azure evaluates the NSG of the network interface first, then the NSG of the subnet, and the flow must be allowed by both. The deny rule in NSG-B matches before its default AllowInternetOutBound rule, so the traffic is dropped before it reaches NSG-A.
    fr: "Pour le trafic sortant, Azure évalue d'abord le NSG de l'interface réseau, puis celui du sous-réseau, et le flux doit être autorisé par les deux. La règle de refus de NSG-B correspond avant sa règle par défaut AllowInternetOutBound : le trafic est abandonné avant d'atteindre NSG-A."
  options:
    b: { en: Priorities are compared only within one NSG; each NSG must allow the flow on its own., fr: "Les priorités ne se comparent qu'à l'intérieur d'un même NSG ; chaque NSG doit autoriser le flux." }
    c: { en: "The subnet NSG is evaluated first only for inbound traffic.", fr: "Le NSG du sous-réseau n'est évalué en premier que pour le trafic entrant." }
    d: { en: "The custom deny rule (300) is processed before the default rule (65001).", fr: "La règle de refus personnalisée (300) est traitée avant la règle par défaut (65001)." }
references:
  - title: How Network Security Groups Filter Network Traffic in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
