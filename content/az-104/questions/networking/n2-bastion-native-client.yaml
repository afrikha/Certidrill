id: n2-bastion-native-client
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Bastion host named **Bastion1** that uses the Basic SKU. Administrators want to connect to Windows VMs from the Remote Desktop client installed on their Windows computers by running `az network bastion rdp`, instead of using the Azure portal.

    You need to enable this connection method. The solution must minimize costs.

    What should you do?
  fr: |
    Contoso dispose d'un hôte Azure Bastion nommé **Bastion1** qui utilise la référence SKU Basic. Les administrateurs souhaitent se connecter aux machines virtuelles Windows depuis le client Bureau à distance installé sur leurs ordinateurs Windows en exécutant `az network bastion rdp`, plutôt que par le portail Azure.

    Vous devez activer cette méthode de connexion. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Upgrade Bastion1 to the Standard SKU and enable Native Client Support.", fr: "Mettre à niveau Bastion1 vers la référence SKU Standard et activer Native Client Support." } }
    - { id: b, text: { en: "Upgrade Bastion1 to the Premium SKU and enable Session recording.", fr: "Mettre à niveau Bastion1 vers la référence SKU Premium et activer Session recording." } }
    - { id: c, text: { en: "Keep the Basic SKU and enable Native Client Support.", fr: "Conserver la référence SKU Basic et activer Native Client Support." } }
    - { id: d, text: { en: "Redeploy Bastion1 with the Developer SKU.", fr: "Redéployer Bastion1 avec la référence SKU Developer." } }
answer: { optionId: a }
explanation:
  correct:
    en: Native client connections through the Azure CLI require the Standard SKU or higher, with the Native Client Support setting enabled on the Bastion configuration. Standard is the cheapest SKU that offers the feature, and an upgrade from Basic is done in place.
    fr: "Les connexions par client natif via Azure CLI exigent la référence SKU Standard ou supérieure, avec le paramètre Native Client Support activé dans la configuration de Bastion. Standard est la référence SKU la moins chère qui propose la fonctionnalité, et la mise à niveau depuis Basic se fait sur place."
  options:
    b: { en: Premium also supports the native client but costs more; session recording is not needed., fr: "Premium prend aussi en charge le client natif mais coûte plus cher ; l'enregistrement de session n'est pas demandé." }
    c: { en: "The Basic SKU does not support native client connections.", fr: "La référence SKU Basic ne prend pas en charge les connexions par client natif." }
    d: { en: "The Developer SKU only supports portal connections, one VM at a time, and you cannot downgrade a SKU.", fr: "La référence SKU Developer ne prend en charge que les connexions par le portail, une machine à la fois, et une référence SKU ne peut pas être rétrogradée." }
references:
  - title: Configure Bastion for native client connections
    url: https://learn.microsoft.com/en-us/azure/bastion/native-client
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
