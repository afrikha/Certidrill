status: draft
stem:
  en: |
    You deploy Azure Bastion to a subnet named AzureBastionSubnet.
  fr: |
    Vous déployez Azure Bastion dans un sous-réseau nommé AzureBastionSubnet.
body:
  solution:
    en: |
      You create a **/26** subnet named **AzureBastionSubnet** in VNet1 and deploy an Azure Bastion host of the **Basic** SKU to it, with a Standard static public IP address for the bastion host. Administrators connect from the **Connect** > **Bastion** page of each virtual machine in the Azure portal.
    fr: |
      Vous créez dans VNet1 un sous-réseau **/26** nommé **AzureBastionSubnet** et y déployez un hôte Azure Bastion de la référence SKU **Basic**, avec une adresse IP publique statique Standard pour l'hôte bastion. Les administrateurs se connectent depuis la page **Connect** > **Bastion** de chaque machine virtuelle dans le portail Azure.
answer: { value: true }
explanation:
  correct:
    en: |
      Azure Bastion provides RDP and SSH over TLS directly in the browser from the Azure portal. Only the bastion host has a public IP address; it reaches the virtual machines on their private IP addresses, so the virtual machines need no public IP address and their port 3389 isn't exposed to the internet. The subnet name and its /26 size meet the Bastion requirements, so the goal is met.
    fr: |
      Azure Bastion fournit RDP et SSH via TLS directement dans le navigateur, depuis le portail Azure. Seul l'hôte bastion possède une adresse IP publique ; il atteint les machines virtuelles par leurs adresses IP privées : les machines virtuelles n'ont besoin d'aucune adresse IP publique et leur port 3389 n'est pas exposé à Internet. Le nom du sous-réseau et sa taille /26 respectent les exigences de Bastion : l'objectif est atteint.
references:
