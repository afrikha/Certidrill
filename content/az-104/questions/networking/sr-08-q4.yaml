id: sr-08-q4
objective: "4.2.3"
type: series_yesno
series: sr-08-bastion-rdp
seriesOrder: 4
difficulty: 2
status: draft
stem:
  en: |
    You assign a public IP address to each virtual machine and restrict RDP with an NSG.
  fr: |
    Vous attribuez une adresse IP publique à chaque machine virtuelle et limitez RDP avec un NSG.
body:
  solution:
    en: |
      You assign a Standard public IP address to each virtual machine and add an inbound security rule to the network security group of the Workload subnet that allows TCP **3389** only from the public IP range of the administrators' office.
    fr: |
      Vous attribuez une adresse IP publique Standard à chaque machine virtuelle et ajoutez au groupe de sécurité réseau du sous-réseau Workload une règle de sécurité entrante qui autorise le port TCP **3389** uniquement à partir de la plage d'adresses IP publiques du bureau des administrateurs.
answer: { value: false }
explanation:
  correct:
    en: |
      The goal explicitly forbids public IP addresses on the virtual machines, and port 3389 would still be reachable from part of the internet. Administrators would also need an RDP client rather than only the Azure portal. The goal isn't met.
    fr: |
      L'objectif interdit explicitement les adresses IP publiques sur les machines virtuelles, et le port 3389 resterait accessible depuis une partie d'Internet. Les administrateurs auraient en outre besoin d'un client RDP plutôt que du seul portail Azure. L'objectif n'est pas atteint.
references:
  - title: "What is Azure Bastion?"
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
