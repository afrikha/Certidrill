# DP-900 objectives — official study guide, skills measured as of 2026-07-21 (en-us page, checked on 2026-11-16).
# The fr-fr page was still at the 2024-11-01 outline: French comes from it where the English bullet is unchanged;
# 1.2.2, 1.2.3, 3.1.1, 3.1.2 and 3.1.3 are our translations (Learn terminology) — re-sync when the fr-fr page is updated.
# One typo of the fr-fr page corrected in the title of group 4.2 ("l'analytique données" -> "l'analytique des données").
# `code` is the stable key referenced by question files and course sections.
concepts:
- group:
    en: Describe ways to represent data
    fr: Décrire les façons de représenter des données
  objectives:
  - code: 1.1.1
    en: Describe the features of structured data
    fr: Décrire les caractéristiques des données structurées
  - code: 1.1.2
    en: Describe the features of semi-structured data
    fr: Décrire les caractéristiques des données semi-structurées
  - code: 1.1.3
    en: Describe the features of unstructured data
    fr: Décrire les caractéristiques des données non structurées
- group:
    en: Identify options for data storage
    fr: Identifier les options de stockage de données
  objectives:
  - code: 1.2.1
    en: Describe common formats for data files
    fr: Décrire les formats courants des fichiers de données
  - code: 1.2.2
    en: Describe features of common data stores including databases
    fr: Décrire les caractéristiques des magasins de données courants, notamment les bases de données
  - code: 1.2.3
    en: Identify Azure datastores for common use cases
    fr: Identifier les magasins de données Azure pour les cas d'usage courants
- group:
    en: Describe common data workloads
    fr: Décrire les charges de travail de données courantes
  objectives:
  - code: 1.3.1
    en: Describe features of transactional workloads
    fr: Décrire les caractéristiques des charges de travail transactionnelles
  - code: 1.3.2
    en: Describe features of analytical workloads
    fr: Décrire les caractéristiques des charges de travail analytiques
- group:
    en: Identify roles and responsibilities for data workloads
    fr: Identifier les rôles et les responsabilités pour les charges de travail de données
  objectives:
  - code: 1.4.1
    en: Describe responsibilities for database administrators
    fr: Décrire les responsabilités des administrateurs de base de données
  - code: 1.4.2
    en: Describe responsibilities for data engineers
    fr: Décrire les responsabilités des ingénieurs de données
  - code: 1.4.3
    en: Describe responsibilities for data analysts
    fr: Décrire les responsabilités des analystes de données
relational:
- group:
    en: Describe relational concepts
    fr: Décrire les concepts relationnels
  objectives:
  - code: 2.1.1
    en: Identify features of relational data
    fr: Identifier les caractéristiques des données relationnelles
  - code: 2.1.2
    en: Describe normalization and why it is used
    fr: Décrire la normalisation et pourquoi elle est utilisée
  - code: 2.1.3
    en: Identify common structured query language (SQL) statements
    fr: Identifier les instructions courantes en langage SQL
  - code: 2.1.4
    en: Identify common database objects
    fr: Identifier les objets de base de données courants
- group:
    en: Describe relational Azure data services
    fr: Décrire les services de données Azure relationnels
  objectives:
  - code: 2.2.1
    en: Describe the Azure SQL family of products, including Azure SQL Database, Azure SQL Managed Instance, and SQL Server on Azure Virtual Machines
    fr: Décrire la famille de produits Azure SQL, notamment Azure SQL Database, Azure SQL Managed Instance et SQL Server sur Machines Virtuelles Azure
  - code: 2.2.2
    en: Identify Azure database services for open-source database systems
    fr: Identifier les services de base de données Azure pour les systèmes de base de données open source
non-relational:
- group:
    en: Describe the capabilities of Azure storage
    fr: Décrire les fonctionnalités du stockage Azure
  objectives:
  - code: 3.1.1
    en: Describe features of Azure Blob storage
    fr: Décrire les caractéristiques du Stockage Blob Azure
  - code: 3.1.2
    en: Describe features of Azure Files
    fr: Décrire les caractéristiques d'Azure Files
  - code: 3.1.3
    en: Describe features of Azure Table storage
    fr: Décrire les caractéristiques du Stockage Table Azure
- group:
    en: Describe the capabilities and features of Azure Cosmos DB
    fr: Décrire les fonctions et fonctionnalités d'Azure Cosmos DB
  objectives:
  - code: 3.2.1
    en: Identify use cases for Azure Cosmos DB
    fr: Identifier les cas d'usage d'Azure Cosmos DB
  - code: 3.2.2
    en: Describe Azure Cosmos DB APIs
    fr: Décrire les API Azure Cosmos DB
analytics:
- group:
    en: Describe common elements of large-scale analytics
    fr: Décrire les éléments courants de l'analytique à grande échelle
  objectives:
  - code: 4.1.1
    en: Describe considerations for data ingestion and processing
    fr: Décrire les points à prendre en compte pour l'ingestion et le traitement des données
  - code: 4.1.2
    en: Describe options for analytical data stores
    fr: Décrire les options des magasins de données analytiques
  - code: 4.1.3
    en: Describe Microsoft cloud services for large-scale analytics, including Azure Databricks and Microsoft Fabric
    fr: Décrire les services cloud Microsoft pour l'analyse à grande échelle, notamment Azure Databricks et Microsoft Fabric
- group:
    en: Describe considerations for real-time data analytics
    fr: Décrire les points à prendre en compte pour l'analytique des données en temps réel
  objectives:
  - code: 4.2.1
    en: Describe the difference between batch and streaming data
    fr: Décrire la différence entre les données en lot et en streaming
  - code: 4.2.2
    en: Identify Microsoft cloud services for real-time analytics
    fr: Identifier les services cloud Microsoft pour les analyses en temps réel
- group:
    en: Describe data visualization in Microsoft Power BI
    fr: Décrire la visualisation des données dans Microsoft Power BI
  objectives:
  - code: 4.3.1
    en: Identify the capabilities of Power BI
    fr: Identifier les fonctionnalités de Power BI
  - code: 4.3.2
    en: Describe features of data models in Power BI
    fr: Décrire les fonctionnalités des modèles de données dans Power BI
  - code: 4.3.3
    en: Identify appropriate visualizations for data
    fr: Identifier les visualisations appropriées pour les données
