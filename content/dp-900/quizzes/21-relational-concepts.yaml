chapter: 21-relational-concepts
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A relational database at Contoso contains a table named **Employee** with the columns EmployeeID, Name and HireDate. Contoso hires a new employee and records the employee in the table.

        Which element is added to the Employee table?
      fr: |
        Une base de données relationnelle de Contoso contient une table nommée **Employee** avec les colonnes EmployeeID, Name et HireDate. Contoso embauche un nouvel employé et l'enregistre dans la table.

        Quel élément est ajouté à la table Employee ?
    body:
      options:
        - { id: a, text: { en: "A column", fr: "Une colonne" } }
        - { id: b, text: { en: "A row", fr: "Une ligne" } }
        - { id: c, text: { en: "A data type", fr: "Un type de données" } }
        - { id: d, text: { en: "A foreign key", fr: "Une clé étrangère" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A table models a collection of entities, and each row represents a single instance of the entity. Recording one more employee therefore adds one row, which has the same columns as the other rows of the table.
        fr: |
          Une table modélise une collection d'entités, et chaque ligne représente une seule instance de l'entité. Enregistrer un employé de plus ajoute donc une ligne, qui a les mêmes colonnes que les autres lignes de la table.
      options:
        a: { en: "A column stores one attribute for every employee; it is added only when a new kind of information must be recorded.", fr: "Une colonne stocke un attribut pour chaque employé ; on n'en ajoute une que pour enregistrer un nouveau type d'information." }
        c: { en: "Data types are defined for the columns when the table is designed; recording an employee doesn't create one.", fr: "Les types de données sont définis pour les colonnes lors de la conception de la table ; enregistrer un employé n'en crée aucun." }
        d: { en: "A foreign key is a column that links the table to another table; adding an employee doesn't change the structure of the table.", fr: "Une clé étrangère est une colonne qui lie la table à une autre table ; ajouter un employé ne modifie pas la structure de la table." }
    references:
      - title: "Understand relational data"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Which two SQL statements belong to the Data Definition Language (DDL)?

        NOTE: Each correct selection is worth one point.
      fr: |
        Quelles sont les deux instructions SQL qui appartiennent au langage de définition de données (DDL) ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "ALTER" }
        - { id: b, text: "DELETE" }
        - { id: c, text: "DENY" }
        - { id: d, text: "DROP" }
        - { id: e, text: "UPDATE" }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          DDL statements create, modify and remove database objects such as tables and views: `CREATE`, `ALTER`, `DROP` and `RENAME`. `ALTER` modifies the definition of an object, for example by adding a column to a table, and `DROP` removes the object itself.
        fr: |
          Les instructions DDL créent, modifient et suppriment des objets de base de données comme les tables et les vues : `CREATE`, `ALTER`, `DROP` et `RENAME`. `ALTER` modifie la définition d'un objet, par exemple en ajoutant une colonne à une table, et `DROP` supprime l'objet lui-même.
      options:
        b: { en: "DELETE is a DML statement: it removes rows from a table but keeps the table.", fr: "DELETE est une instruction DML : elle supprime des lignes d'une table mais conserve la table." }
        c: { en: "DENY is a DCL statement: it refuses a permission to a user or a role.", fr: "DENY est une instruction DCL : elle refuse une autorisation à un utilisateur ou à un rôle." }
        e: { en: "UPDATE is a DML statement: it changes the values stored in existing rows, not the definition of the table.", fr: "UPDATE est une instruction DML : elle modifie les valeurs stockées dans les lignes existantes, pas la définition de la table." }
    references:
      - title: "Explore SQL"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A normalized database at Fabrikam contains the tables **Customer** and **SalesOrder**. The CustomerID column of SalesOrder is a foreign key to Customer, and the database enforces referential integrity. The Customer table contains the customers 1 to 200.

        An application tries to add an order whose CustomerID is 250. What happens?
      fr: |
        Une base de données normalisée de Fabrikam contient les tables **Customer** et **SalesOrder**. La colonne CustomerID de SalesOrder est une clé étrangère vers Customer, et la base de données impose l'intégrité référentielle. La table Customer contient les clients 1 à 200.

        Une application tente d'ajouter une commande dont le CustomerID est 250. Que se passe-t-il ?
    body:
      options:
        - { id: a, text: { en: "The database accepts the order and stores NULL in its CustomerID column.", fr: "La base de données accepte la commande et stocke NULL dans sa colonne CustomerID." } }
        - { id: b, text: { en: "The database accepts the order and adds a customer 250 to the Customer table.", fr: "La base de données accepte la commande et ajoute un client 250 à la table Customer." } }
        - { id: c, text: { en: "The database rejects the order because no row of Customer has the ID 250.", fr: "La base de données rejette la commande, car aucune ligne de Customer n'a l'ID 250." } }
        - { id: d, text: { en: "The database rejects the order because CustomerID values must be unique in SalesOrder.", fr: "La base de données rejette la commande, car les valeurs de CustomerID doivent être uniques dans SalesOrder." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Referential integrity ensures that a value entered in a foreign key column has a matching primary key in the related table. An order for a customer that doesn't exist is therefore refused, which keeps every order linked to a real customer.
        fr: |
          L'intégrité référentielle garantit qu'une valeur saisie dans une colonne de clé étrangère a une clé primaire correspondante dans la table associée. Une commande pour un client qui n'existe pas est donc refusée, ce qui garde chaque commande liée à un client réel.
      options:
        a: { en: "The database doesn't replace an invalid foreign key value with NULL: the insert fails.", fr: "La base de données ne remplace pas une valeur de clé étrangère invalide par NULL : l'insertion échoue." }
        b: { en: "A foreign key never creates rows in the related table; the customer must be added first, with its own data.", fr: "Une clé étrangère ne crée jamais de lignes dans la table associée ; le client doit d'abord être ajouté, avec ses propres données." }
        d: { en: "The order is rejected, but not for this reason: a foreign key isn't unique, and several orders can contain the same CustomerID.", fr: "La commande est bien rejetée, mais pas pour cette raison : une clé étrangère n'est pas unique, et plusieurs commandes peuvent contenir le même CustomerID." }
    references:
      - title: "Understand normalization"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A table named **Product** contains 300 rows. A developer wants to raise the price of the product whose ID is 42 by 10 percent, and runs the following statement.

        ```text
        UPDATE Product
        SET Price = Price * 1.1;
        ```

        What is the result?
      fr: |
        Une table nommée **Product** contient 300 lignes. Un développeur veut augmenter de 10 % le prix du produit dont l'ID est 42, et exécute l'instruction suivante.

        ```text
        UPDATE Product
        SET Price = Price * 1.1;
        ```

        Quel est le résultat ?
    body:
      options:
        - { id: a, text: { en: "Only the first row of the table gets a new price.", fr: "Seule la première ligne de la table reçoit un nouveau prix." } }
        - { id: b, text: { en: "The statement fails because it has no WHERE clause.", fr: "L'instruction échoue, car elle n'a pas de clause WHERE." } }
        - { id: c, text: { en: "A new row with the higher price is added for each product.", fr: "Une nouvelle ligne avec le prix augmenté est ajoutée pour chaque produit." } }
        - { id: d, text: { en: "The price of all 300 products is raised by 10 percent.", fr: "Le prix des 300 produits est augmenté de 10 %." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The WHERE clause determines which rows an UPDATE statement modifies. Without it, the statement modifies every row of the table, and SQL doesn't ask for a confirmation. The developer should have added `WHERE ID = 42`.
        fr: |
          La clause WHERE détermine les lignes que modifie une instruction UPDATE. Sans elle, l'instruction modifie toutes les lignes de la table, et SQL ne demande aucune confirmation. Le développeur aurait dû ajouter `WHERE ID = 42`.
      options:
        a: { en: "UPDATE has no notion of a first row: without a filter, it applies to all the rows.", fr: "UPDATE n'a pas de notion de première ligne : sans filtre, il s'applique à toutes les lignes." }
        b: { en: "WHERE is optional in UPDATE; the statement runs and modifies every row.", fr: "WHERE est facultatif dans UPDATE ; l'instruction s'exécute et modifie toutes les lignes." }
        c: { en: "UPDATE changes the values of existing rows; adding rows is the role of INSERT.", fr: "UPDATE modifie les valeurs des lignes existantes ; ajouter des lignes est le rôle d'INSERT." }
    references:
      - title: "Explore SQL"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-21-05
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A table named **Product** contains 800 rows. You run the following statement.

        ```text
        ALTER TABLE Product
        ADD Weight DECIMAL(6,2) NULL;
        ```

        Which value does the Weight column contain in the 800 existing rows?
      fr: |
        Une table nommée **Product** contient 800 lignes. Vous exécutez l'instruction suivante.

        ```text
        ALTER TABLE Product
        ADD Weight DECIMAL(6,2) NULL;
        ```

        Quelle valeur la colonne Weight contient-elle dans les 800 lignes existantes ?
    body:
      options:
        - { id: a, text: { en: "The value 0, because the column stores decimal numbers", fr: "La valeur 0, car la colonne stocke des nombres décimaux" } }
        - { id: b, text: { en: "No value, because only new rows receive the Weight column", fr: "Aucune valeur, car seules les nouvelles lignes reçoivent la colonne Weight" } }
        - { id: c, text: { en: "NULL, because no weight has been recorded for these rows", fr: "NULL, car aucun poids n'a été enregistré pour ces lignes" } }
        - { id: d, text: { en: "None, because the statement fails when the table has rows", fr: "Aucune, car l'instruction échoue quand la table contient des lignes" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Every row of a table has the same columns, so the new column exists in the 800 existing rows too. The column allows NULL and no value has been recorded yet, so these rows contain NULL, which means that the weight is unknown, not that it's zero.
        fr: |
          Toutes les lignes d'une table ont les mêmes colonnes ; la nouvelle colonne existe donc aussi dans les 800 lignes existantes. La colonne autorise NULL et aucune valeur n'a encore été enregistrée : ces lignes contiennent donc NULL, ce qui signifie que le poids est inconnu, et non qu'il vaut zéro.
      options:
        a: { en: "NULL isn't 0: the database doesn't invent a value for a column whose content is unknown.", fr: "NULL n'est pas 0 : la base de données n'invente pas de valeur pour une colonne dont le contenu est inconnu." }
        b: { en: "All the rows of a relational table have the same columns; a column can't exist in some rows only.", fr: "Toutes les lignes d'une table relationnelle ont les mêmes colonnes ; une colonne ne peut pas exister dans certaines lignes seulement." }
        d: { en: "ALTER TABLE can add a column to a table that already contains rows; the existing rows are kept.", fr: "ALTER TABLE peut ajouter une colonne à une table qui contient déjà des lignes ; les lignes existantes sont conservées." }
    references:
      - title: "Understand relational data"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-21-06
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has a database that contains the tables **SalesOrder**, **LineItem** and **StagingSales**. The company has the following requirements:

        - The mobile app records a product return by running the same UPDATE and INSERT statements every time; it passes the order number and the quantity returned.
        - The finance team queries the monthly sales total of each customer as if it were a table. The result must always reflect the current rows, and no data may be copied.
        - Every night, a job loads five million rows into StagingSales, reads all of them once without any filter, and then empties the table. The load must be as fast as possible.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une base de données qui contient les tables **SalesOrder**, **LineItem** et **StagingSales**. L'entreprise a les exigences suivantes :

        - L'application mobile enregistre un retour de produit en exécutant chaque fois les mêmes instructions UPDATE et INSERT ; elle transmet le numéro de commande et la quantité retournée.
        - L'équipe financière interroge le total mensuel des ventes de chaque client comme s'il s'agissait d'une table. Le résultat doit toujours refléter les lignes actuelles, et aucune donnée ne doit être copiée.
        - Chaque nuit, un travail charge cinq millions de lignes dans StagingSales, les lit toutes une seule fois sans aucun filtre, puis vide la table. Le chargement doit être aussi rapide que possible.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          For the product returns of the mobile app, create [[ret]].

          For the monthly totals of the finance team, create [[fin]].

          For the StagingSales table, [[stg]].
        fr: |
          Pour les retours de produits de l'application mobile, créez [[ret]].

          Pour les totaux mensuels de l'équipe financière, créez [[fin]].

          Pour la table StagingSales, [[stg]].
      slots:
        - id: ret
          options:
            - { id: r_proc, text: { en: "a stored procedure", fr: "une procédure stockée" } }
            - { id: r_view, text: { en: "a view", fr: "une vue" } }
            - { id: r_index, text: { en: "an index", fr: "un index" } }
            - { id: r_table, text: { en: "a second table", fr: "une deuxième table" } }
        - id: fin
          options:
            - { id: f_proc, text: { en: "a stored procedure", fr: "une procédure stockée" } }
            - { id: f_view, text: { en: "a view", fr: "une vue" } }
            - { id: f_index, text: { en: "an index", fr: "un index" } }
            - { id: f_table, text: { en: "a second table", fr: "une deuxième table" } }
        - id: stg
          options:
            - { id: s_all, text: { en: "create an index on every column", fr: "créez un index sur chaque colonne" } }
            - { id: s_one, text: { en: "create an index on the LoadDate column", fr: "créez un index sur la colonne LoadDate" } }
            - { id: s_none, text: { en: "create no index", fr: "ne créez aucun index" } }
            - { id: s_view, text: { en: "create a view of the table", fr: "créez une vue de la table" } }
    answer:
      values: { ret: r_proc, fin: f_view, stg: s_none }
    explanation:
      correct:
        en: |
          A stored procedure saves the UPDATE and INSERT statements in the database and runs them on command with parameters, here the order number and the quantity. A view is a virtual table based on a SELECT query: it stores no data and always returns the current rows. An index speeds up queries that filter on its column, but it must be maintained at every insert; the nightly job reads every row without a filter, so an index would only slow down the load.
        fr: |
          Une procédure stockée enregistre les instructions UPDATE et INSERT dans la base de données et les exécute à la demande avec des paramètres, ici le numéro de commande et la quantité. Une vue est une table virtuelle basée sur une requête SELECT : elle ne stocke aucune donnée et renvoie toujours les lignes actuelles. Un index accélère les requêtes qui filtrent sur sa colonne, mais il doit être tenu à jour à chaque insertion ; le travail de nuit lit toutes les lignes sans filtre, donc un index ne ferait que ralentir le chargement.
      options:
        r_view: { en: "A view returns the result of a query; it doesn't run UPDATE and INSERT statements with parameters.", fr: "Une vue renvoie le résultat d'une requête ; elle n'exécute pas d'instructions UPDATE et INSERT avec des paramètres." }
        f_table: { en: "A second table copies the data, which is forbidden, and its content becomes outdated when the orders change.", fr: "Une deuxième table copie les données, ce qui est interdit, et son contenu devient obsolète quand les commandes changent." }
        f_proc: { en: "The finance team must query the result as if it were a table, which is what a view provides.", fr: "L'équipe financière doit interroger le résultat comme s'il s'agissait d'une table, ce que fournit une vue." }
        s_all: { en: "Each index must be updated for each of the five million inserted rows, and a read without a filter doesn't use them.", fr: "Chaque index doit être mis à jour pour chacune des cinq millions de lignes insérées, et une lecture sans filtre ne les utilise pas." }
        s_one: { en: "No query filters on LoadDate; the index would slow down the load without speeding up the read.", fr: "Aucune requête ne filtre sur LoadDate ; l'index ralentirait le chargement sans accélérer la lecture." }
    references:
      - title: Describe database objects
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys normalizes its sales data into four tables: **Customer**, **Product**, **SalesOrder** (one row per order) and **LineItem** (one row per product of an order). The company must now record the information below, each fact stored only once.

        In which table should each piece of information be stored? To answer, drag the appropriate table to each piece of information. Each table may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys normalise ses données de ventes en quatre tables : **Customer**, **Product**, **SalesOrder** (une ligne par commande) et **LineItem** (une ligne par produit d'une commande). L'entreprise doit maintenant enregistrer les informations ci-dessous, chaque fait n'étant stocké qu'une seule fois.

        Dans quelle table chaque information doit-elle être stockée ? Pour répondre, faites glisser la table appropriée vers chaque information. Chaque table peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: customer, text: Customer }
        - { id: product, text: Product }
        - { id: order, text: SalesOrder }
        - { id: line, text: LineItem }
      targets:
        - { id: t1, text: { en: "The phone number of a customer", fr: "Le numéro de téléphone d'un client" } }
        - { id: t2, text: { en: "The weight of a product", fr: "Le poids d'un produit" } }
        - { id: t3, text: { en: "The delivery address that a customer chooses for one specific order", fr: "L'adresse de livraison qu'un client choisit pour une commande précise" } }
        - { id: t4, text: { en: "The discount granted on one product within one order", fr: "La remise accordée sur un produit dans une commande" } }
        - { id: t5, text: { en: "The date on which an order was placed", fr: "La date à laquelle une commande a été passée" } }
    answer:
      mapping: { t1: customer, t2: product, t3: order, t4: line, t5: order }
    explanation:
      correct:
        en: |
          Each attribute belongs to the entity that it describes. The phone number describes the customer and the weight describes the product. An address chosen for each order and the order date describe the order, so they belong in SalesOrder even though the address looks like a customer attribute. A discount granted on one product of one order describes that line, so it belongs in LineItem.
        fr: |
          Chaque attribut appartient à l'entité qu'il décrit. Le numéro de téléphone décrit le client et le poids décrit le produit. Une adresse choisie pour chaque commande et la date de commande décrivent la commande ; elles vont donc dans SalesOrder, même si l'adresse ressemble à un attribut du client. Une remise accordée sur un produit d'une commande décrit cette ligne ; elle va donc dans LineItem.
      options:
        t3: { en: "Storing the delivery address in Customer would keep only one address per customer, while it can change from one order to the next.", fr: "Stocker l'adresse de livraison dans Customer ne conserverait qu'une adresse par client, alors qu'elle peut changer d'une commande à l'autre." }
        t4: { en: "Product would apply the same discount to every order, and SalesOrder to every product of the order: only LineItem stores one value per product and per order.", fr: "Product appliquerait la même remise à toutes les commandes, et SalesOrder à tous les produits de la commande : seule LineItem stocke une valeur par produit et par commande." }
    references:
      - title: "Understand normalization"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A database contains the following tables.

        **Customer**

        | CustomerID | Email | City |
        | --- | --- | --- |
        | 1 | ana@contoso.com | Lyon |
        | 2 | ken@contoso.com | Osaka |
        | 3 | lea@contoso.com | Lyon |

        **SalesOrder**

        | OrderNo | CustomerID | OrderDate |
        | --- | --- | --- |
        | 501 | 1 | 2026-03-02 |
        | 502 | 2 | 2026-03-04 |
        | 503 | 1 | 2026-03-05 |
        | 504 | 3 | 2026-03-09 |

        You run the following query.

        ```text
        SELECT c.Email, o.OrderDate
        FROM SalesOrder AS o
        JOIN Customer AS c
            ON o.CustomerID = c.CustomerID
        WHERE c.City = 'Lyon'
        ORDER BY o.OrderDate;
        ```

        Which result does the query return?
      fr: |
        Une base de données contient les tables suivantes.

        **Customer**

        | CustomerID | Email | City |
        | --- | --- | --- |
        | 1 | ana@contoso.com | Lyon |
        | 2 | ken@contoso.com | Osaka |
        | 3 | lea@contoso.com | Lyon |

        **SalesOrder**

        | OrderNo | CustomerID | OrderDate |
        | --- | --- | --- |
        | 501 | 1 | 2026-03-02 |
        | 502 | 2 | 2026-03-04 |
        | 503 | 1 | 2026-03-05 |
        | 504 | 3 | 2026-03-09 |

        Vous exécutez la requête suivante.

        ```text
        SELECT c.Email, o.OrderDate
        FROM SalesOrder AS o
        JOIN Customer AS c
            ON o.CustomerID = c.CustomerID
        WHERE c.City = 'Lyon'
        ORDER BY o.OrderDate;
        ```

        Quel résultat la requête renvoie-t-elle ?
    shuffle: false
    body:
      options:
        - { id: a, text: { en: "Two rows: ana (2026-03-02), lea (2026-03-09)", fr: "Deux lignes : ana (2026-03-02), lea (2026-03-09)" } }
        - { id: b, text: { en: "Three rows: ana (2026-03-02), ana (2026-03-05), lea (2026-03-09)", fr: "Trois lignes : ana (2026-03-02), ana (2026-03-05), lea (2026-03-09)" } }
        - { id: c, text: { en: "Three rows: lea (2026-03-09), ana (2026-03-05), ana (2026-03-02)", fr: "Trois lignes : lea (2026-03-09), ana (2026-03-05), ana (2026-03-02)" } }
        - { id: d, text: { en: "Four rows: ana (2026-03-02), ken (2026-03-04), ana (2026-03-05), lea (2026-03-09)", fr: "Quatre lignes : ana (2026-03-02), ken (2026-03-04), ana (2026-03-05), lea (2026-03-09)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The JOIN matches each order with its customer through the foreign key, so the query produces one row per order, not one row per customer. The WHERE clause keeps the orders of the customers in Lyon (501, 503 and 504), and ORDER BY sorts them by ascending order date. Customer 1 placed two orders, so ana@contoso.com appears twice.
        fr: |
          Le JOIN fait correspondre chaque commande avec son client par la clé étrangère ; la requête produit donc une ligne par commande, et non une ligne par client. La clause WHERE conserve les commandes des clients de Lyon (501, 503 et 504), et ORDER BY les trie par date de commande croissante. Le client 1 a passé deux commandes : ana@contoso.com apparaît donc deux fois.
      options:
        a: { en: "The query returns one row per matching order, not one per customer: the second order of customer 1 is also returned.", fr: "La requête renvoie une ligne par commande correspondante, et non une par client : la deuxième commande du client 1 est aussi renvoyée." }
        c: { en: "ORDER BY sorts in ascending order by default, so the oldest order comes first.", fr: "ORDER BY trie par ordre croissant par défaut ; la commande la plus ancienne vient donc en premier." }
        d: { en: "The WHERE clause removes order 502, whose customer lives in Osaka.", fr: "La clause WHERE supprime du résultat la commande 502, dont le client habite à Osaka." }
    references:
      - title: "Explore SQL"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-21-09
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys tracked its sales in one spreadsheet with a line per product sold; each line repeated the name and the address of the customer. Wingtip Toys normalizes the data into the tables **Customer**, **Product**, **SalesOrder** and **LineItem**, linked by foreign keys.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys suivait ses ventes dans une seule feuille de calcul, avec une ligne par produit vendu ; chaque ligne répétait le nom et l'adresse du client. Wingtip Toys normalise les données dans les tables **Customer**, **Product**, **SalesOrder** et **LineItem**, liées par des clés étrangères.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A report that lists each product sold with the name of its customer reads fewer tables than before the normalization.", fr: "Un rapport qui liste chaque produit vendu avec le nom de son client lit moins de tables qu'avant la normalisation." }
        - id: s2
          text: { en: "The new schema can record a customer who hasn't placed any order yet.", fr: "Le nouveau schéma peut enregistrer un client qui n'a encore passé aucune commande." }
        - id: s3
          text: { en: "If the data is copied to an analytical store for reporting, that store can keep it in a denormalized form to simplify read queries.", fr: "Si les données sont copiées dans un magasin analytique pour les rapports, ce magasin peut les conserver sous une forme dénormalisée pour simplifier les requêtes de lecture." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Normalization reduces duplication and enforces integrity, but reading related data then requires joins: the report must combine LineItem, SalesOrder, Customer and Product, while the spreadsheet was a single table. Because each entity has its own table, a customer can now exist without any order. Analytical stores often denormalize data to simplify and speed up read queries.
        fr: |
          La normalisation réduit la duplication et impose l'intégrité, mais la lecture de données associées exige alors des jointures : le rapport doit combiner LineItem, SalesOrder, Customer et Product, alors que la feuille de calcul était une seule table. Comme chaque entité a sa propre table, un client peut désormais exister sans aucune commande. Les magasins analytiques dénormalisent souvent les données pour simplifier et accélérer les requêtes de lecture.
      options:
        s1: { en: "Before normalization, everything was in one table; the report now joins four tables. Normalization doesn't make read queries simpler.", fr: "Avant la normalisation, tout était dans une seule table ; le rapport joint maintenant quatre tables. La normalisation ne simplifie pas les requêtes de lecture." }
        s2: { en: "In the spreadsheet, a customer existed only on the lines of an order; the Customer table stores customers independently of their orders.", fr: "Dans la feuille de calcul, un client n'existait que sur les lignes d'une commande ; la table Customer stocke les clients indépendamment de leurs commandes." }
    references:
      - title: "Understand normalization"
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-21-10
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        At Woodgrove Bank, a table named **SalesOrder** contains 40 million rows and receives thousands of new orders every hour. Analysts regularly look for the large orders, and their searches take a long time. To help them, a database administrator runs the following statements.

        ```text
        CREATE VIEW BigOrders
        AS
        SELECT OrderNo, CustomerID, Total
        FROM SalesOrder
        WHERE Total > 1000;

        CREATE INDEX idx_SalesOrder_Total
        ON SalesOrder(Total);
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Woodgrove Bank, une table nommée **SalesOrder** contient 40 millions de lignes et reçoit des milliers de nouvelles commandes chaque heure. Les analystes recherchent régulièrement les commandes importantes, et leurs recherches prennent beaucoup de temps. Pour les aider, un administrateur de base de données exécute les instructions suivantes.

        ```text
        CREATE VIEW BigOrders
        AS
        SELECT OrderNo, CustomerID, Total
        FROM SalesOrder
        WHERE Total > 1000;

        CREATE INDEX idx_SalesOrder_Total
        ON SalesOrder(Total);
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A query on BigOrders can use idx_SalesOrder_Total to find the orders above 1,000 faster.", fr: "Une requête sur BigOrders peut utiliser idx_SalesOrder_Total pour trouver plus vite les commandes supérieures à 1 000." }
        - id: s2
          text: { en: "The statements store a second copy of the orders above 1,000 in the database.", fr: "Les instructions stockent une deuxième copie des commandes supérieures à 1 000 dans la base de données." }
        - id: s3
          text: { en: "Adding a new order to SalesOrder now requires more work from the database than before the statements ran.", fr: "Ajouter une nouvelle commande à SalesOrder demande désormais plus de travail à la base de données qu'avant l'exécution des instructions." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A view is a virtual table: querying BigOrders runs its SELECT query, whose WHERE clause filters on Total, so the index on Total can help the database find those rows in a large table. The view itself stores no data. The index, however, is a sorted copy of the Total values that must be maintained at every insert, update and delete, which makes adding orders slower.
        fr: |
          Une vue est une table virtuelle : interroger BigOrders exécute sa requête SELECT, dont la clause WHERE filtre sur Total ; l'index sur Total peut donc aider la base de données à trouver ces lignes dans une grande table. La vue elle-même ne stocke aucune donnée. L'index, en revanche, est une copie triée des valeurs de Total qui doit être tenue à jour à chaque insertion, mise à jour et suppression, ce qui ralentit l'ajout de commandes.
      options:
        s2: { en: "A view stores only its query, not rows. The index stores the Total values with pointers to the rows, not a second copy of the orders.", fr: "Une vue ne stocke que sa requête, pas de lignes. L'index stocke les valeurs de Total avec des pointeurs vers les lignes, pas une deuxième copie des commandes." }
        s3: { en: "Each new order must also be added to the index, which consumes time and storage: indexes speed up searches at the cost of writes.", fr: "Chaque nouvelle commande doit aussi être ajoutée à l'index, ce qui consomme du temps et du stockage : les index accélèrent les recherches au détriment des écritures." }
    references:
      - title: Describe database objects
        url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
