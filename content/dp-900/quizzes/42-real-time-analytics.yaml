chapter: 42-real-time-analytics
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In a stream processing solution, some logic runs continuously on the incoming events. It selects the events of certain types, projects some of their values, and aggregates them over periods of time.

        What is this logic called?
      fr: |
        Dans une solution de traitement de flux, une logique s'exécute en continu sur les événements entrants. Elle sélectionne les événements de certains types, projette certaines de leurs valeurs et les agrège sur des périodes de temps.

        Comment appelle-t-on cette logique ?
    body:
      options:
        - { id: a, text: { en: "A batch job", fr: "Un travail par lots" } }
        - { id: b, text: { en: "A sink", fr: "Un récepteur (sink)" } }
        - { id: c, text: { en: "A stored procedure", fr: "Une procédure stockée" } }
        - { id: d, text: { en: "A perpetual query", fr: "Une requête perpétuelle" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A perpetual query operates on the event data as it arrives: it selects data for specific event types, projects values, and aggregates them over time-based windows, for example the number of readings per minute. Its results are then written to a sink.
        fr: |
          Une requête perpétuelle s'exécute sur les données d'événements à mesure qu'elles arrivent : elle sélectionne les données de certains types d'événements, projette des valeurs et les agrège sur des fenêtres temporelles, par exemple le nombre de relevés par minute. Ses résultats sont ensuite écrits dans un récepteur.
      options:
        a: { en: "A batch job processes a stored group of records together, once; it doesn't run continuously on each new event.", fr: "Un travail par lots traite ensemble, en une fois, un groupe d'enregistrements stockés ; il ne s'exécute pas en continu sur chaque nouvel événement." }
        b: { en: "The sink is the output that receives the results of the query, such as a file, a table, a dashboard, or a queue.", fr: "Le récepteur est la sortie qui reçoit les résultats de la requête, comme un fichier, une table, un tableau de bord ou une file d'attente." }
        c: { en: "A stored procedure is SQL code of a database that runs when it is called, not a continuous query on a stream.", fr: "Une procédure stockée est du code SQL d'une base de données qui s'exécute quand on l'appelle, pas une requête continue sur un flux." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which Azure service is often used for batch processing, but can also be used as the source of a stream processing solution?
      fr: |
        Quel service Azure est souvent utilisé pour le traitement par lots, mais peut aussi servir de source à une solution de traitement de flux ?
    body:
      options:
        - { id: a, text: Azure Data Lake Storage Gen2 }
        - { id: b, text: Azure Stream Analytics }
        - { id: c, text: Azure IoT Hub }
        - { id: d, text: Power BI }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Data Lake Storage Gen2 is scalable storage that usually holds data for batch processing. A stream processing solution can also read new data from it as a streaming source, next to the more common sources Azure Event Hubs, Azure IoT Hub, and Apache Kafka.
        fr: |
          Azure Data Lake Storage Gen2 est un stockage scalable qui contient généralement des données destinées au traitement par lots. Une solution de traitement de flux peut aussi y lire de nouvelles données comme source de streaming, à côté des sources plus courantes Azure Event Hubs, Azure IoT Hub et Apache Kafka.
      options:
        b: { en: "Azure Stream Analytics processes streams with a perpetual query; it is a processing service, not a source.", fr: "Azure Stream Analytics traite des flux avec une requête perpétuelle ; c'est un service de traitement, pas une source." }
        c: { en: "Azure IoT Hub is a streaming source, optimized for IoT devices; it isn't a store that is used for batch processing.", fr: "Azure IoT Hub est une source de streaming, optimisée pour les appareils IoT ; ce n'est pas un magasin utilisé pour le traitement par lots." }
        d: { en: "Power BI is a sink of stream processing, which shows the results in real time; it isn't a source.", fr: "Power BI est un récepteur du traitement de flux, qui affiche les résultats en temps réel ; ce n'est pas une source." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-42-03
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys computes the average temperature of its cold rooms every minute with a stream processing solution. The averages must be sent to three different outputs.

        How should you complete the sentences? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys calcule chaque minute la température moyenne de ses chambres froides avec une solution de traitement de flux. Les moyennes doivent être envoyées vers trois sorties différentes.

        Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To queue the averages so that another streaming query can process them, write them to [[queue]].

          To keep the averages as files for later analysis, write them to [[files]].

          To show the averages to the operators in real time, send them to [[live]].
        fr: |
          Pour mettre les moyennes en file d'attente afin qu'une autre requête de streaming les traite, écrivez-les dans [[queue]].

          Pour conserver les moyennes sous forme de fichiers en vue d'une analyse ultérieure, écrivez-les dans [[files]].

          Pour afficher les moyennes aux opérateurs en temps réel, envoyez-les vers [[live]].
      slots:
        - id: queue
          options:
            - { id: pbi, text: Power BI }
            - { id: evh, text: Azure Event Hubs }
            - { id: sql, text: Azure SQL Database }
            - { id: onelake, text: OneLake }
        - id: files
          options:
            - { id: iot, text: Azure IoT Hub }
            - { id: evh, text: Azure Event Hubs }
            - { id: onelake, text: OneLake }
            - { id: pbi, text: Power BI }
        - id: live
          options:
            - { id: adls, text: Azure Data Lake Storage Gen2 }
            - { id: evh, text: Azure Event Hubs }
            - { id: iot, text: Azure IoT Hub }
            - { id: pbi, text: Power BI }
    answer:
      values: { queue: evh, files: onelake, live: pbi }
    explanation:
      correct:
        en: |
          Azure Event Hubs is a common source, but it can also be a sink that queues processed data for a downstream query. OneLake, like Azure Data Lake Storage Gen2 or Azure Blob storage, keeps the results as files. Power BI is the sink that shows the results in real-time reports and dashboards.
        fr: |
          Azure Event Hubs est une source courante, mais il peut aussi être un récepteur qui met les données traitées en file d'attente pour une requête en aval. OneLake, comme Azure Data Lake Storage Gen2 ou le Stockage Blob Azure, conserve les résultats sous forme de fichiers. Power BI est le récepteur qui affiche les résultats dans des rapports et des tableaux de bord en temps réel.
      options:
        sql: { en: "Azure SQL Database keeps the results in tables for querying; it isn't a queue that feeds another streaming query.", fr: "Azure SQL Database conserve les résultats dans des tables pour les interroger ; ce n'est pas une file d'attente qui alimente une autre requête de streaming." }
        iot: { en: "Azure IoT Hub ingests telemetry from IoT devices; it isn't used to keep results as files.", fr: "Azure IoT Hub ingère la télémétrie des appareils IoT ; il ne sert pas à conserver des résultats sous forme de fichiers." }
        adls: { en: "Azure Data Lake Storage Gen2 keeps results as files; it doesn't display them to operators.", fr: "Azure Data Lake Storage Gen2 conserve les résultats sous forme de fichiers ; il ne les affiche pas aux opérateurs." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-42-04
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Every night at 02:00, a job at Northwind Traders processes all the orders of the previous day together. One night, the job stops at 02:40 because a single order contains an invalid date, and no result is produced for any of the orders.

        Which characteristic of batch processing does this incident illustrate?
      fr: |
        Chaque nuit à 2 h, un travail de Northwind Traders traite ensemble toutes les commandes de la veille. Une nuit, le travail s'arrête à 2 h 40 parce qu'une seule commande contient une date non valide, et aucun résultat n'est produit pour aucune des commandes.

        Quelle caractéristique du traitement par lots cet incident illustre-t-il ?
    body:
      options:
        - { id: a, text: { en: "A batch can only process the most recent data, such as the last 30 seconds.", fr: "Un lot ne peut traiter que les données les plus récentes, comme les 30 dernières secondes." } }
        - { id: b, text: { en: "A batch must be started when a certain amount of data has arrived.", fr: "Un lot doit être démarré quand une certaine quantité de données est arrivée." } }
        - { id: c, text: { en: "A data error in a single record can stop the processing of the whole batch.", fr: "Une erreur de données dans un seul enregistrement peut arrêter le traitement de tout le lot." } }
        - { id: d, text: { en: "A batch processes each record individually, as soon as it arrives.", fr: "Un lot traite chaque enregistrement individuellement, dès son arrivée." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Because all the records of a batch are processed together, a data error, a crash, or a program failure can stop the entire batch, and even a small error can prevent the whole job from succeeding. The input data must then be checked before the job is run again.
        fr: |
          Comme tous les enregistrements d'un lot sont traités ensemble, une erreur de données, un plantage ou une défaillance du programme peut arrêter tout le lot, et même une petite erreur peut empêcher la réussite de tout le travail. Les données d'entrée doivent alors être vérifiées avant que le travail ne soit réexécuté.
      options:
        a: { en: "Access limited to the most recent data or a rolling window describes stream processing; a batch can process the entire dataset.", fr: "Un accès limité aux données les plus récentes ou à une fenêtre glissante décrit le traitement de flux ; un lot peut traiter tout le jeu de données." }
        b: { en: "An amount of data is only one possible trigger, next to a schedule or another event; this job starts on a schedule.", fr: "Une quantité de données n'est qu'un déclencheur possible, à côté d'une planification ou d'un autre événement ; ce travail démarre selon une planification." }
        d: { en: "Processing each record as it arrives is stream processing; the job groups all the orders of the day.", fr: "Traiter chaque enregistrement à son arrivée, c'est le traitement de flux ; le travail regroupe toutes les commandes de la journée." }
    references:
      - title: Understand batch and stream processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-42-05
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam is designing a streaming solution. Its web applications send click events to Azure Event Hubs. A first job aggregates the clicks per minute, and a second job uses these aggregates to detect unusual traffic. Part of the solution will be built in Microsoft Fabric.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam conçoit une solution de streaming. Ses applications web envoient des événements de clic à Azure Event Hubs. Un premier travail agrège les clics par minute, et un second travail utilise ces agrégats pour détecter un trafic inhabituel. Une partie de la solution sera créée dans Microsoft Fabric.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Azure Event Hubs can be both the source of the first job and the sink that queues its results for the second job.", fr: "Azure Event Hubs peut être à la fois la source du premier travail et le récepteur qui met ses résultats en file d'attente pour le second travail." } }
        - { id: s2, text: { en: "In Microsoft Fabric, an eventstream is the item that stores the clicks so that analysts can query them with KQL.", fr: "Dans Microsoft Fabric, un eventstream est l'élément qui stocke les clics pour que les analystes les interrogent en KQL." } }
        - { id: s3, text: { en: "Azure Stream Analytics is one of the components of Real-Time Intelligence in Microsoft Fabric.", fr: "Azure Stream Analytics est l'un des composants de Real-Time Intelligence dans Microsoft Fabric." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Azure Event Hubs appears on both sides of stream processing: as a source that ingests events, and as a sink that queues processed data for a downstream query. In Fabric, an eventstream ingests, transforms, and routes events, while an eventhouse stores them in KQL databases. Azure Stream Analytics is a separate platform as a service (PaaS) offering, used for standalone or hybrid solutions outside Fabric.
        fr: |
          Azure Event Hubs figure des deux côtés du traitement de flux : comme source qui ingère des événements, et comme récepteur qui met des données traitées en file d'attente pour une requête en aval. Dans Fabric, un eventstream ingère, transforme et route les événements, tandis qu'un eventhouse les stocke dans des bases de données KQL. Azure Stream Analytics est une offre de plateforme en tant que service (PaaS) distincte, utilisée pour des solutions autonomes ou hybrides en dehors de Fabric.
      options:
        s2: { en: "The eventstream routes the events to destinations; the eventhouse stores them for KQL queries.", fr: "L'eventstream route les événements vers des destinations ; l'eventhouse les stocke pour les requêtes KQL." }
        s3: { en: "Real-Time Intelligence consists of items such as the Real-Time hub, eventstreams, eventhouses, Real-Time Dashboards, and Activator; Azure Stream Analytics is a separate Azure service.", fr: "Real-Time Intelligence se compose d'éléments comme le Real-Time hub, les eventstreams, les eventhouses, les Real-Time Dashboards et Activator ; Azure Stream Analytics est un service Azure distinct." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
      - title: What is Real-Time Intelligence?
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-42-06
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The delivery vans of Contoso send their position and engine temperature to Azure Event Hubs. In Microsoft Fabric, Contoso must:

        1. Bring the events into Fabric and route them, without writing code.
        2. Keep the events for several months and analyze them as time-series data with Kusto Query Language (KQL).
        3. Send a Microsoft Teams message to the fleet manager when the engine temperature of a van exceeds 110 °C.

        Which Real-Time Intelligence items should Contoso use, in the order of the requirements?
      fr: |
        Les camionnettes de livraison de Contoso envoient leur position et la température de leur moteur à Azure Event Hubs. Dans Microsoft Fabric, Contoso doit :

        1. Faire entrer les événements dans Fabric et les router, sans écrire de code.
        2. Conserver les événements pendant plusieurs mois et les analyser comme des séries chronologiques en Kusto Query Language (KQL).
        3. Envoyer un message Microsoft Teams au responsable de la flotte quand la température du moteur d'une camionnette dépasse 110 °C.

        Quels éléments de Real-Time Intelligence Contoso doit-il utiliser, dans l'ordre des exigences ?
    body:
      options:
        - { id: a, text: { en: "Eventstream, then KQL queryset, then Activator", fr: "Eventstream, puis KQL queryset, puis Activator" } }
        - { id: b, text: { en: "Eventstream, then Eventhouse, then Real-Time Dashboard", fr: "Eventstream, puis Eventhouse, puis Real-Time Dashboard" } }
        - { id: c, text: { en: "Eventstream, then Eventhouse, then Activator", fr: "Eventstream, puis Eventhouse, puis Activator" } }
        - { id: d, text: { en: "KQL queryset, then Eventhouse, then Activator", fr: "KQL queryset, puis Eventhouse, puis Activator" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An eventstream ingests events from sources such as Azure Event Hubs and transforms and routes them without code. An eventhouse stores event and time-series data in KQL databases, queried with KQL. Activator monitors the data and triggers an action, such as a Teams message or an email, when a condition is met.
        fr: |
          Un eventstream ingère des événements de sources comme Azure Event Hubs, puis les transforme et les route sans code. Un eventhouse stocke des données d'événements et de séries chronologiques dans des bases de données KQL, interrogées en KQL. Activator surveille les données et déclenche une action, comme un message Teams ou un e-mail, quand une condition est remplie.
      options:
        a: { en: "A KQL queryset writes and runs queries on the data of an eventhouse; it doesn't store the events itself.", fr: "Un KQL queryset écrit et exécute des requêtes sur les données d'un eventhouse ; il ne stocke pas lui-même les événements." }
        b: { en: "A Real-Time Dashboard visualizes live data; sending the Teams message when the condition is met is the role of Activator.", fr: "Un Real-Time Dashboard visualise les données en direct ; envoyer le message Teams quand la condition est remplie est le rôle d'Activator." }
        d: { en: "A KQL queryset only queries the data that is already in an eventhouse; it doesn't ingest or route events.", fr: "Un KQL queryset ne fait qu'interroger les données déjà présentes dans un eventhouse ; il n'ingère ni ne route d'événements." }
    references:
      - title: What is Real-Time Intelligence?
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
      - title: What is Fabric Activator?
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-42-07
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware reviews three data jobs:

        - **Job A** reads the new payment events every second, in micro-batches of a few events, and updates a fraud score within two seconds.
        - **Job B** starts as soon as a partner uploads its daily file of two million rows, and processes all the rows of the file together.
        - **Job C** runs once a month. It combines the fraud scores that job A has stored in a data lake with five years of payment history.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware examine trois travaux de données :

        - **Le travail A** lit les nouveaux événements de paiement chaque seconde, en micro-lots de quelques événements, et met à jour un score de fraude en moins de deux secondes.
        - **Le travail B** démarre dès qu'un partenaire charge son fichier quotidien de deux millions de lignes, et traite ensemble toutes les lignes du fichier.
        - **Le travail C** s'exécute une fois par mois. Il combine les scores de fraude que le travail A a stockés dans un lac de données avec cinq ans d'historique des paiements.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Job A is stream processing, even though it handles the events in micro-batches.", fr: "Le travail A est un traitement de flux, même s'il traite les événements en micro-lots." } }
        - { id: s2, text: { en: "Job B is stream processing, because an event, the upload of the file, starts it.", fr: "Le travail B est un traitement de flux, car un événement, le chargement du fichier, le démarre." } }
        - { id: s3, text: { en: "Job C is batch processing, although part of its input comes from a stream processing job.", fr: "Le travail C est un traitement par lots, bien qu'une partie de ses données d'entrée provienne d'un travail de traitement de flux." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Stream processing handles individual records or micro-batches of a few records as they arrive, with a latency of seconds: job A is a stream. A batch can be started by a schedule, an amount of data, or another event, such as a file upload; job B still waits for the whole file and processes it together, so it is a batch. Stream results are often stored and then batch processed with historical data, which is what job C does.
        fr: |
          Le traitement de flux traite des enregistrements individuels ou des micro-lots de quelques enregistrements à leur arrivée, avec une latence de quelques secondes : le travail A est un flux. Un lot peut être démarré par une planification, une quantité de données ou un autre événement, comme le chargement d'un fichier ; le travail B attend quand même le fichier entier et le traite d'un bloc : c'est un lot. Les résultats d'un flux sont souvent stockés, puis traités par lots avec des données historiques, ce que fait le travail C.
      options:
        s2: { en: "What decides is how the data is processed: job B collects the whole file and processes it in one operation, which is a batch started by an event.", fr: "Ce qui décide, c'est la façon dont les données sont traitées : le travail B rassemble le fichier entier et le traite en une seule opération : c'est un lot démarré par un événement." }
    references:
      - title: Understand batch and stream processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Three teams at Adatum must each add stream processing to their work:

        - **Team 1** already processes batches with PySpark in Azure Databricks notebooks, and wants to compute rolling averages on a stream with the same skills.
        - **Team 2** runs a standalone solution outside Microsoft Fabric and has no Spark skills. It needs a platform as a service (PaaS) offering that reads telemetry from Azure IoT Hub, calculates five-minute averages, and writes them to Azure SQL Database.
        - **Team 3** works in Microsoft Fabric. It must filter clickstream events and route them to a lakehouse and an eventhouse without writing code.

        Which technology should each team use to process its stream? To answer, drag the appropriate technology to each team. Each technology may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Trois équipes d'Adatum doivent chacune ajouter du traitement de flux à leur travail :

        - **L'équipe 1** traite déjà des lots en PySpark dans des notebooks Azure Databricks, et veut calculer des moyennes mobiles sur un flux avec les mêmes compétences.
        - **L'équipe 2** exploite une solution autonome en dehors de Microsoft Fabric et n'a pas de compétences Spark. Elle a besoin d'une offre de plateforme en tant que service (PaaS) qui lit la télémétrie d'Azure IoT Hub, calcule des moyennes sur cinq minutes et les écrit dans Azure SQL Database.
        - **L'équipe 3** travaille dans Microsoft Fabric. Elle doit filtrer des événements de clics et les router vers un lakehouse et un eventhouse sans écrire de code.

        Quelle technologie chaque équipe doit-elle utiliser pour traiter son flux ? Pour répondre, faites glisser la technologie appropriée vers chaque équipe. Chaque technologie peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: evh, text: Azure Event Hubs }
        - { id: sss, text: Spark Structured Streaming }
        - { id: iot, text: Azure IoT Hub }
        - { id: es, text: Eventstream }
        - { id: asa, text: Azure Stream Analytics }
        - { id: qs, text: KQL queryset }
      targets:
        - { id: t1, text: { en: "Team 1", fr: "Équipe 1" } }
        - { id: t2, text: { en: "Team 2", fr: "Équipe 2" } }
        - { id: t3, text: { en: "Team 3", fr: "Équipe 3" } }
    answer:
      mapping: { t1: sss, t2: asa, t3: es }
    explanation:
      correct:
        en: |
          Spark Structured Streaming is the Spark library for streams, available in Azure Databricks: a good choice when a team already uses Spark and code. Azure Stream Analytics is the PaaS offering in which a streaming job reads a source, applies a perpetual query, and writes to an output, for standalone or hybrid solutions outside Fabric. In Fabric, an eventstream ingests, transforms, and routes events to destinations without code.
        fr: |
          Spark Structured Streaming est la bibliothèque Spark pour les flux, disponible dans Azure Databricks : un bon choix quand une équipe utilise déjà Spark et du code. Azure Stream Analytics est l'offre PaaS dans laquelle un travail de streaming lit une source, applique une requête perpétuelle et écrit dans une sortie, pour des solutions autonomes ou hybrides en dehors de Fabric. Dans Fabric, un eventstream ingère, transforme et route des événements vers des destinations sans code.
      options:
        evh: { en: "Azure Event Hubs ingests and queues events; it doesn't run the processing.", fr: "Azure Event Hubs ingère et met en file d'attente les événements ; il n'exécute pas le traitement." }
        iot: { en: "Azure IoT Hub is the source of team 2's telemetry, not the technology that calculates the averages.", fr: "Azure IoT Hub est la source de la télémétrie de l'équipe 2, pas la technologie qui calcule les moyennes." }
        qs: { en: "A KQL queryset queries data already stored in an eventhouse; it doesn't filter and route incoming events.", fr: "Un KQL queryset interroge des données déjà stockées dans un eventhouse ; il ne filtre ni ne route les événements entrants." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
      - title: Explore Apache Spark structured streaming
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/5-spark-streaming

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-42-09
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys lists five requirements for the data of its online store.

        Which two requirements require stream processing?

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys liste cinq exigences pour les données de sa boutique en ligne.

        Quelles sont les deux exigences qui nécessitent un traitement de flux ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Block a payment within one second when its fraud score is too high", fr: "Bloquer un paiement en moins d'une seconde quand son score de fraude est trop élevé" } }
        - { id: b, text: { en: "Capture every click as it arrives, so that analysts can study last month's clicks", fr: "Capturer chaque clic à son arrivée, pour que les analystes étudient les clics du mois dernier" } }
        - { id: c, text: { en: "Show the number of visitors of the last 30 seconds, updated continuously", fr: "Afficher le nombre de visiteurs des 30 dernières secondes, mis à jour en continu" } }
        - { id: d, text: { en: "Calculate every hour the average basket value of the previous hour", fr: "Calculer toutes les heures la valeur moyenne du panier de l'heure précédente" } }
        - { id: e, text: { en: "Rebuild the recommendation model every week from five years of orders", fr: "Reconstruire chaque semaine le modèle de recommandation à partir de cinq ans de commandes" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Stream processing is needed when each event must be processed as it arrives, with a latency of seconds or less. Blocking a payment within one second is a time-critical response, and a continuously updated count over the last 30 seconds is an aggregate over a rolling time window.
        fr: |
          Le traitement de flux est nécessaire quand chaque événement doit être traité à son arrivée, avec une latence de quelques secondes ou moins. Bloquer un paiement en moins d'une seconde est une réaction critique dans le temps, et un comptage mis à jour en continu sur les 30 dernières secondes est un agrégat sur une fenêtre temporelle glissante.
      options:
        b: { en: "Streaming technology can capture the clicks, but they are analyzed later as a batch: no real-time processing is required.", fr: "Une technologie de streaming peut capturer les clics, mais ils sont analysés plus tard par lots : aucun traitement en temps réel n'est exigé." }
        d: { en: "An hourly calculation on the data of the previous hour is a batch started on a schedule.", fr: "Un calcul horaire sur les données de l'heure précédente est un lot démarré selon une planification." }
        e: { en: "Complex analytics on five years of data is typical of batch processing, which can process the entire dataset.", fr: "Une analytique complexe sur cinq ans de données est typique du traitement par lots, qui peut traiter tout le jeu de données." }
    references:
      - title: Understand batch and stream processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-42-10
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Proseware reviews the proposed design of a real-time analytics solution for its web applications. Each row of the following table shows a requirement and the component that is proposed to meet it.

        Answer each prompt by selecting the appropriate component.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware examine la conception proposée d'une solution d'analytique en temps réel pour ses applications web. Chaque ligne du tableau suivant présente une exigence et le composant proposé pour y répondre.

        Répondez à chaque consigne en sélectionnant le composant approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "The proposed component that doesn't meet its requirement", fr: "Le composant proposé qui ne répond pas à son exigence" } }
        - { id: p2, text: { en: "The component that is the streaming source of the solution", fr: "Le composant qui est la source de streaming de la solution" } }
      grid:
        header:
          - { en: "Requirement", fr: "Exigence" }
          - { en: "Proposed component", fr: "Composant proposé" }
        rows:
          - - { text: { en: "Ingest millions of click events per hour from the web applications", fr: "Ingérer des millions d'événements de clic par heure provenant des applications web" } }
            - { text: Azure Event Hubs, area: c1 }
          - - { text: { en: "Route the events to a lakehouse and an eventhouse, without code", fr: "Router les événements vers un lakehouse et un eventhouse, sans code" } }
            - { text: Eventstream, area: c2 }
          - - { text: { en: "Calculate the number of clicks per page over one-minute windows", fr: "Calculer le nombre de clics par page sur des fenêtres d'une minute" } }
            - { text: Apache Kafka, area: c3 }
          - - { text: { en: "Email the product manager when a page receives more than 10,000 clicks in a minute", fr: "Envoyer un e-mail au responsable produit quand une page reçoit plus de 10 000 clics en une minute" } }
            - { text: Activator, area: c4 }
          - - { text: { en: "Let other departments discover and reuse the click stream", fr: "Permettre aux autres services de découvrir et de réutiliser le flux de clics" } }
            - { text: Real-Time hub, area: c5 }
    answer:
      values: { p1: c3, p2: c1 }
    explanation:
      correct:
        en: |
          Apache Kafka, like Azure Event Hubs and Azure IoT Hub, ingests events; it doesn't run the perpetual query that aggregates them over windows, which is the role of a processing technology such as an eventhouse, Spark Structured Streaming, or Azure Stream Analytics. Azure Event Hubs, which ingests high volumes of events from the applications, is the streaming source. The other components fit: an eventstream routes events without code, Activator triggers actions such as an email, and the Real-Time hub is the catalog in which the organization discovers and shares its streams.
        fr: |
          Apache Kafka, comme Azure Event Hubs et Azure IoT Hub, ingère des événements ; il n'exécute pas la requête perpétuelle qui les agrège sur des fenêtres, rôle d'une technologie de traitement comme un eventhouse, Spark Structured Streaming ou Azure Stream Analytics. Azure Event Hubs, qui ingère de gros volumes d'événements provenant des applications, est la source de streaming. Les autres composants conviennent : un eventstream route les événements sans code, Activator déclenche des actions comme un e-mail, et le Real-Time hub est le catalogue où l'organisation découvre et partage ses flux.
      options:
        c2: { en: "An eventstream can send the same events to several destinations, such as a lakehouse and an eventhouse, without code.", fr: "Un eventstream peut envoyer les mêmes événements vers plusieurs destinations, comme un lakehouse et un eventhouse, sans code." }
        c5: { en: "The Real-Time hub is a catalog for discovering and sharing streams; it is neither the source nor a processing step.", fr: "Le Real-Time hub est un catalogue pour découvrir et partager des flux ; ce n'est ni la source ni une étape de traitement." }
    references:
      - title: Explore common elements of stream processing architecture
        url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
      - title: Overview of Microsoft Fabric eventstreams
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
