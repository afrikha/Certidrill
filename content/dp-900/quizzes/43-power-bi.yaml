chapter: 43-power-bi
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum's policy requires that its Power BI reports be hosted on servers in its own datacenter, not in the cloud. Employees view the reports in a web browser.

        Which Power BI component should Adatum use to host the reports?
      fr: |
        La politique d'Adatum exige que ses rapports Power BI soient hébergés sur des serveurs de son propre centre de données, et non dans le cloud. Les employés consultent les rapports dans un navigateur web.

        Quel composant Power BI Adatum doit-il utiliser pour héberger les rapports ?
    body:
      options:
        - { id: a, text: { en: "The Power BI service", fr: "Le service Power BI" } }
        - { id: b, text: "Power BI Report Server" }
        - { id: c, text: "Power BI Report Builder" }
        - { id: d, text: { en: "The Power BI mobile apps", fr: "Les applications mobiles Power BI" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Power BI Report Server is an on-premises report server with a web portal on which reports are displayed and managed. It keeps the reports in the organization's own infrastructure, and users still view them in a browser or on a mobile device.
        fr: |
          Power BI Report Server est un serveur de rapports local doté d'un portail web sur lequel les rapports sont affichés et gérés. Il conserve les rapports dans l'infrastructure de l'organisation, et les utilisateurs les consultent toujours dans un navigateur ou sur un appareil mobile.
      options:
        a: { en: "The Power BI service is a cloud service: hosting the reports there contradicts the policy.", fr: "Le service Power BI est un service cloud : y héberger les rapports contredit la politique." }
        c: { en: "Power BI Report Builder is an authoring tool for paginated reports; it creates reports but doesn't host them.", fr: "Power BI Report Builder est un outil de création de rapports paginés ; il crée des rapports mais ne les héberge pas." }
        d: { en: "The mobile apps are used to view reports and dashboards on phones and tablets; they don't host reports.", fr: "Les applications mobiles servent à consulter les rapports et les tableaux de bord sur des téléphones et des tablettes ; elles n'hébergent pas de rapports." }
    references:
      - title: What Is Power BI Report Server?
        url: https://learn.microsoft.com/en-us/power-bi/report-server/get-started

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-43-02
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Power BI semantic model in Microsoft Fabric uses the Direct Lake storage mode.

        How does the model get the data that its reports display?
      fr: |
        Un modèle sémantique Power BI de Microsoft Fabric utilise le mode de stockage Direct Lake.

        Comment le modèle obtient-il les données qu'affichent ses rapports ?
    body:
      options:
        - { id: a, text: { en: "It loads Delta tables from OneLake into memory when they are queried.", fr: "Il charge en mémoire les tables Delta de OneLake quand elles sont interrogées." } }
        - { id: b, text: { en: "It stores a copy of the source rows, which is updated at each scheduled refresh.", fr: "Il stocke une copie des lignes de la source, mise à jour à chaque actualisation planifiée." } }
        - { id: c, text: { en: "It sends a query to the source database each time a visual is displayed.", fr: "Il envoie une requête à la base de données source chaque fois qu'un visuel est affiché." } }
        - { id: d, text: { en: "It reads the tiles that are pinned to the dashboards of its workspace.", fr: "Il lit les vignettes épinglées aux tableaux de bord de son espace de travail." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Direct Lake reads Delta tables stored in OneLake and loads the columns into memory as queries need them. Reports get in-memory performance without the data being imported into the model: a Direct Lake refresh only copies metadata.
        fr: |
          Direct Lake lit des tables Delta stockées dans OneLake et charge les colonnes en mémoire à mesure que les requêtes en ont besoin. Les rapports bénéficient des performances de la mémoire sans que les données soient importées dans le modèle : une actualisation Direct Lake ne copie que des métadonnées.
      options:
        b: { en: "Storing a copy of the rows that is updated by scheduled refreshes describes the Import mode.", fr: "Stocker une copie des lignes mise à jour par des actualisations planifiées décrit le mode Import." }
        c: { en: "Sending queries to the source for each visual describes the DirectQuery mode.", fr: "Envoyer des requêtes à la source pour chaque visuel décrit le mode DirectQuery." }
        d: { en: "Dashboard tiles are visuals pinned from reports; they are not a data source of a semantic model.", fr: "Les vignettes des tableaux de bord sont des visuels épinglés depuis des rapports ; elles ne sont pas une source de données d'un modèle sémantique." }
    references:
      - title: Direct Lake overview
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-43-03
    objective: "4.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's operating profit was $4 million in 2025 and $5 million in 2026. A report must show how higher sales (+), higher costs (−) and lower taxes (+) explain the change from the 2025 profit to the 2026 profit.

        Which visual should you use?
      fr: |
        Le résultat d'exploitation de Fabrikam était de 4 millions de dollars en 2025 et de 5 millions de dollars en 2026. Un rapport doit montrer comment la hausse des ventes (+), la hausse des coûts (−) et la baisse des impôts (+) expliquent le passage du résultat de 2025 à celui de 2026.

        Quel visuel devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Funnel chart", fr: "Graphique en entonnoir" } }
        - { id: b, text: "Treemap" }
        - { id: c, text: { en: "Waterfall chart", fr: "Graphique en cascade" } }
        - { id: d, text: { en: "Line chart", fr: "Graphique en courbes" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A waterfall chart shows a running total as values are added or subtracted. It starts from an initial value (the 2025 profit), shows each positive or negative contribution, and ends with the total (the 2026 profit).
        fr: |
          Un graphique en cascade montre un total cumulé à mesure que des valeurs sont ajoutées ou soustraites. Il part d'une valeur initiale (le résultat de 2025), montre chaque contribution positive ou négative et se termine par le total (le résultat de 2026).
      options:
        a: { en: "A funnel chart follows the successive stages of a process, such as a sales pipeline, not additions and subtractions.", fr: "Un graphique en entonnoir suit les étapes successives d'un processus, comme un pipeline de ventes, pas des ajouts et des soustractions." }
        b: { en: "A treemap shows the proportions of hierarchical data as nested rectangles; it can't show negative contributions to a total.", fr: "Un treemap montre les proportions de données hiérarchiques sous forme de rectangles imbriqués ; il ne peut pas montrer de contributions négatives à un total." }
        d: { en: "A line chart shows a trend over time; it doesn't break down a change into its positive and negative causes.", fr: "Un graphique en courbes montre une tendance dans le temps ; il ne décompose pas une variation en ses causes positives et négatives." }
    references:
      - title: Overview of visualizations in Power BI
        url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-43-04
    objective: "4.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An analyst at Contoso has finished a report in Power BI Desktop. The members of the marketing team must open the report in a web browser and interact with it, without installing any software.

        What should the analyst do?
      fr: |
        Un analyste de Contoso a terminé un rapport dans Power BI Desktop. Les membres de l'équipe marketing doivent ouvrir le rapport dans un navigateur web et interagir avec lui, sans installer de logiciel.

        Que doit faire l'analyste ?
    body:
      options:
        - { id: a, text: { en: "Send the .pbix file of the report to the team by email.", fr: "Envoyer le fichier .pbix du rapport à l'équipe par e-mail." } }
        - { id: b, text: { en: "Pin the visuals of the report to a dashboard in Power BI Desktop.", fr: "Épingler les visuels du rapport à un tableau de bord dans Power BI Desktop." } }
        - { id: c, text: { en: "Rebuild the report as a paginated report in Power BI Report Builder.", fr: "Recréer le rapport sous forme de rapport paginé dans Power BI Report Builder." } }
        - { id: d, text: { en: "Publish the report to a workspace in the Power BI service and share it.", fr: "Publier le rapport dans un espace de travail du service Power BI et le partager." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Publishing uploads the report and its semantic model to a workspace of the Power BI service, a cloud service used in a web browser. From there, the report can be shared with colleagues, who open and interact with it without installing anything.
        fr: |
          La publication charge le rapport et son modèle sémantique dans un espace de travail du service Power BI, un service cloud utilisé dans un navigateur web. Le rapport peut alors être partagé avec des collègues, qui l'ouvrent et interagissent avec lui sans rien installer.
      options:
        a: { en: "A .pbix file opens in Power BI Desktop, a Windows application: the team would have to install it.", fr: "Un fichier .pbix s'ouvre dans Power BI Desktop, une application Windows : l'équipe devrait l'installer." }
        b: { en: "Dashboards are created in the Power BI service only; Power BI Desktop has no dashboards.", fr: "Les tableaux de bord se créent uniquement dans le service Power BI ; Power BI Desktop n'a pas de tableaux de bord." }
        c: { en: "Paginated reports are formatted, printable documents; rebuilding the report doesn't make it available to the team.", fr: "Les rapports paginés sont des documents mis en forme et imprimables ; recréer le rapport ne le met pas à la disposition de l'équipe." }
    references:
      - title: Publish from Power BI Desktop
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-upload-desktop-files
      - title: Intro to dashboards for Power BI designers
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-43-05
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Proseware sells through three channels: stores, website and partners. One report page must show how the total revenue changed month by month in 2026, and the share of each channel in the 2026 revenue.

        Which two visuals should you add to the page? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware vend par trois canaux : magasins, site web et partenaires. Une page de rapport doit montrer comment le chiffre d'affaires total a évolué mois par mois en 2026, ainsi que la part de chaque canal dans le chiffre d'affaires 2026.

        Quels sont les deux visuels que vous devez ajouter à la page ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Scatter chart", fr: "Nuage de points" } }
        - { id: b, text: { en: "Line chart", fr: "Graphique en courbes" } }
        - { id: c, text: { en: "Funnel chart", fr: "Graphique en entonnoir" } }
        - { id: d, text: { en: "Doughnut chart", fr: "Graphique en anneau" } }
        - { id: e, text: { en: "Card", fr: "Carte (card)" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A line chart shows a trend, usually over time, so it shows the month-by-month change of the revenue. A doughnut chart, like a pie chart, compares the parts of a total when there are few categories, which fits the three channels.
        fr: |
          Un graphique en courbes montre une tendance, en général dans le temps : il montre donc l'évolution mensuelle du chiffre d'affaires. Un graphique en anneau, comme un graphique en secteurs, compare les parts d'un total quand les catégories sont peu nombreuses, ce qui convient aux trois canaux.
      options:
        a: { en: "A scatter chart looks for a relationship between two numeric measures; neither requirement compares two measures.", fr: "Un nuage de points cherche une relation entre deux mesures numériques ; aucun des besoins ne compare deux mesures." }
        c: { en: "A funnel chart follows the stages of a process; the channels are parallel, not successive stages.", fr: "Un graphique en entonnoir suit les étapes d'un processus ; les canaux sont parallèles, pas des étapes successives." }
        e: { en: "A card highlights one figure, such as the total revenue; it shows neither the monthly trend nor the share of each channel.", fr: "Une carte (card) met en avant un seul chiffre, comme le chiffre d'affaires total ; elle ne montre ni la tendance mensuelle ni la part de chaque canal." }
    references:
      - title: Overview of visualizations in Power BI
        url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-43-06
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware records about 50,000 orders per hour in an Azure SQL database that contains several billion rows. A Power BI report must show the orders recorded a few seconds earlier, without waiting for a refresh. The rows must not be copied out of the Azure SQL database.

        Which storage mode should the semantic model use?
      fr: |
        Litware enregistre environ 50 000 commandes par heure dans une base de données Azure SQL qui contient plusieurs milliards de lignes. Un rapport Power BI doit montrer les commandes enregistrées quelques secondes plus tôt, sans attendre une actualisation. Les lignes ne doivent pas être copiées hors de la base de données Azure SQL.

        Quel mode de stockage le modèle sémantique doit-il utiliser ?
    body:
      options:
        - { id: a, text: "Import" }
        - { id: b, text: "DirectQuery" }
        - { id: c, text: "Direct Lake" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In DirectQuery mode, no data is imported: each visual sends its queries to the Azure SQL database, so reports show the current data without a scheduled refresh. DirectQuery also suits volumes that are too large to import.
        fr: |
          En mode DirectQuery, aucune donnée n'est importée : chaque visuel envoie ses requêtes à la base de données Azure SQL, donc les rapports montrent les données actuelles sans actualisation planifiée. DirectQuery convient aussi aux volumes trop gros pour être importés.
      options:
        a: { en: "Import copies the rows into the model, and the reports are only as current as the last refresh: both requirements fail.", fr: "Import copie les lignes dans le modèle, et les rapports ne sont pas plus récents que la dernière actualisation : les deux exigences échouent." }
        c: { en: "Direct Lake reads Delta tables in OneLake; the orders are in an Azure SQL database, and bringing them into OneLake would copy them.", fr: "Direct Lake lit des tables Delta dans OneLake ; les commandes sont dans une base de données Azure SQL, et les amener dans OneLake les copierait." }
    references:
      - title: "DirectQuery in Power BI: When to Use, Limitations, Alternatives"
        url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
      - title: Direct Lake overview
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-43-07
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove is designing the pages of a management report for its executive committee. Each of the four requirements below must be met by a single visual of the report.

        Which visual should you use for each requirement? To answer, drag the appropriate visual to each requirement. Each visual may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove conçoit les pages d'un rapport de direction destiné à son comité exécutif. Chacun des quatre besoins ci-dessous doit être satisfait par un seul visuel du rapport.

        Quel visuel devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser le visuel approprié vers chaque besoin. Chaque visuel peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: column, text: { en: "Column chart", fr: "Histogramme" } }
        - { id: gauge, text: { en: "Gauge", fr: "Jauge" } }
        - { id: scatter, text: { en: "Scatter chart", fr: "Nuage de points" } }
        - { id: line, text: { en: "Line chart", fr: "Graphique en courbes" } }
        - { id: card, text: { en: "Card", fr: "Carte (card)" } }
        - { id: pie, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
      targets:
        - id: t1
          text: { en: "Compare the actual revenue and the budgeted revenue of each of the 12 departments.", fr: "Comparer le chiffre d'affaires réel et le chiffre d'affaires budgété de chacun des 12 services." }
        - id: t2
          text: { en: "Show how close the revenue of the quarter is to the quarterly target of $2 million.", fr: "Montrer à quel point le chiffre d'affaires du trimestre est proche de l'objectif trimestriel de 2 millions de dollars." }
        - id: t3
          text: { en: "For each day of 2025, find out whether the maximum temperature is related to the number of umbrellas sold.", fr: "Pour chaque jour de 2025, déterminer si la température maximale est liée au nombre de parapluies vendus." }
        - id: t4
          text: { en: "Display the number of open customer complaints as one large figure, with no target.", fr: "Afficher le nombre de réclamations clients ouvertes sous la forme d'un seul grand chiffre, sans objectif." }
    answer:
      mapping: { t1: column, t2: gauge, t3: scatter, t4: card }
    explanation:
      correct:
        en: |
          Twelve departments are discrete categories, so a column chart compares their actual and budgeted values side by side; a gauge shows a single value. A gauge shows the progress of one value toward a target. The temperature and the umbrella sales are two numeric measures, so a scatter chart shows whether they are correlated, even though the data is daily. A card highlights one important figure.
        fr: |
          Douze services sont des catégories discrètes : un histogramme compare donc côte à côte leurs valeurs réelles et budgétées ; une jauge ne montre qu'une seule valeur. Une jauge montre la progression d'une valeur vers un objectif. La température et les ventes de parapluies sont deux mesures numériques : un nuage de points montre donc si elles sont corrélées, même si les données sont journalières. Une carte (card) met en avant un chiffre important.
      options:
        line: { en: "A line chart shows a trend over time; plotting the two measures by day doesn't show whether they are correlated.", fr: "Un graphique en courbes montre une tendance dans le temps ; tracer les deux mesures par jour ne montre pas si elles sont corrélées." }
        pie: { en: "A pie chart compares the parts of one total; budget and actual for 12 departments are not parts of a total.", fr: "Un graphique en secteurs compare les parts d'un même total ; le budget et le réel de 12 services ne sont pas les parts d'un total." }
    references:
      - title: Overview of visualizations in Power BI
        url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-43-08
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        An analyst at Northwind Traders builds an Import mode semantic model and a sales report in Power BI Desktop, from tables of an Azure SQL database. The analyst then publishes the .pbix file to a workspace in the Power BI service. The imported sales data must be updated every night, and the sales managers read the report in a web browser.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un analyste de Northwind Traders construit un modèle sémantique en mode Import et un rapport des ventes dans Power BI Desktop, à partir de tables d'une base de données Azure SQL. L'analyste publie ensuite le fichier .pbix dans un espace de travail du service Power BI. Les données de ventes importées doivent être mises à jour chaque nuit, et les responsables des ventes consultent le rapport dans un navigateur web.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Only the report is uploaded to the workspace; its semantic model stays in Power BI Desktop.
            fr: Seul le rapport est chargé dans l'espace de travail ; son modèle sémantique reste dans Power BI Desktop.
        - id: s2
          text:
            en: To update the data every night, the analyst must open the file in Power BI Desktop and publish it again each night.
            fr: Pour mettre à jour les données chaque nuit, l'analyste doit ouvrir le fichier dans Power BI Desktop et le republier chaque nuit.
        - id: s3
          text:
            en: A colleague can build a second report on the published semantic model without importing the data again.
            fr: Un collègue peut construire un second rapport sur le modèle sémantique publié sans importer de nouveau les données.
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Publishing uploads both the report and its semantic model, which appears in the workspace with the same name. The nightly update is a scheduled refresh configured on the semantic model in the Power BI service, with no new publication. Because one semantic model can serve several reports, a colleague can build another report on the published model.
        fr: |
          La publication charge à la fois le rapport et son modèle sémantique, qui apparaît dans l'espace de travail sous le même nom. La mise à jour nocturne est une actualisation planifiée configurée sur le modèle sémantique dans le service Power BI, sans nouvelle publication. Comme un même modèle sémantique peut servir plusieurs rapports, un collègue peut construire un autre rapport sur le modèle publié.
      options:
        s1: { en: "The semantic model is published with the report; the reports in the service are built on it.", fr: "Le modèle sémantique est publié avec le rapport ; les rapports du service sont construits sur lui." }
        s2: { en: "Scheduled refresh belongs to the Power BI service: it updates the imported data without republishing.", fr: "L'actualisation planifiée relève du service Power BI : elle met à jour les données importées sans republication." }
    references:
      - title: Publish from Power BI Desktop
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-upload-desktop-files
      - title: Configure scheduled refresh
        url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-scheduled-refresh

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-43-09
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has two reports in a workspace of the Power BI service: a Sales report built on the Sales semantic model, and a Stock report built on the Inventory semantic model. Managers want a single page that shows the key visuals of both reports, without a new semantic model being created. They also want an email when the stock value falls below $50,000.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose de deux rapports dans un espace de travail du service Power BI : un rapport Ventes construit sur le modèle sémantique Sales, et un rapport Stock construit sur le modèle sémantique Inventory. Les responsables veulent une seule page qui montre les visuels clés des deux rapports, sans qu'un nouveau modèle sémantique soit créé. Ils veulent aussi recevoir un e-mail quand la valeur du stock passe sous 50 000 $.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Create [[item]] that combines the visuals of both reports.

          On the card that shows the stock value, set [[notify]].
        fr: |
          Créez [[item]] qui réunit les visuels des deux rapports.

          Sur la carte (card) qui affiche la valeur du stock, définissez [[notify]].
      slots:
        - id: item
          options:
            - { id: report, text: { en: "a report page", fr: "une page de rapport" } }
            - { id: dashboard, text: { en: "a dashboard", fr: "un tableau de bord" } }
            - { id: paginated, text: { en: "a paginated report", fr: "un rapport paginé" } }
            - { id: app, text: { en: "an app", fr: "une application" } }
        - id: notify
          options:
            - { id: alert, text: { en: "a data alert", fr: "une alerte de données" } }
            - { id: subscription, text: { en: "an email subscription", fr: "un abonnement par e-mail" } }
            - { id: refresh, text: { en: "a scheduled refresh", fr: "une actualisation planifiée" } }
            - { id: slicer, text: { en: "a slicer", fr: "un segment" } }
    answer:
      values: { item: dashboard, notify: alert }
    explanation:
      correct:
        en: |
          A report is built on a single semantic model, whereas a dashboard is a single page whose tiles can be pinned from several reports built on different semantic models. Data alerts are set on dashboard tiles, such as a card, and notify users, also by email, when the value goes beyond the limit that they set.
        fr: |
          Un rapport est construit sur un seul modèle sémantique, alors qu'un tableau de bord est une page unique dont les vignettes peuvent être épinglées depuis plusieurs rapports construits sur des modèles sémantiques différents. Les alertes de données se définissent sur les vignettes d'un tableau de bord, comme une carte (card), et préviennent les utilisateurs, y compris par e-mail, quand la valeur dépasse la limite qu'ils ont fixée.
      options:
        report: { en: "A report page uses the single semantic model of its report; combining both models would require a new model.", fr: "Une page de rapport utilise le seul modèle sémantique de son rapport ; réunir les deux modèles exigerait un nouveau modèle." }
        app: { en: "An app groups reports and dashboards to distribute them; it is not a page that combines visuals.", fr: "Une application regroupe des rapports et des tableaux de bord pour les distribuer ; ce n'est pas une page qui réunit des visuels." }
        subscription: { en: "A subscription sends the content on a schedule, whatever the value; it doesn't react to a limit.", fr: "Un abonnement envoie le contenu selon une planification, quelle que soit la valeur ; il ne réagit pas à une limite." }
    references:
      - title: Intro to dashboards for Power BI designers
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards
      - title: Set data alerts in the Power BI service
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-set-data-alerts

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-43-10
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A Power BI semantic model contains the following tables. Relationships link the key columns of the tables.

        | Table | Columns |
        | --- | --- |
        | Sales | DateKey, ProductKey, StoreKey, Quantity, Revenue |
        | Date | DateKey, Day, Month, Year |
        | Store | StoreKey, City, Country |
        | Product | ProductKey, ProductName, SubcategoryKey |
        | Subcategory | SubcategoryKey, SubcategoryName, CategoryKey |
        | Category | CategoryKey, CategoryName |

        Relationships: Sales–Date, Sales–Store, Sales–Product, Product–Subcategory, Subcategory–Category.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un modèle sémantique Power BI contient les tables suivantes. Des relations lient les colonnes clés des tables.

        | Table | Colonnes |
        | --- | --- |
        | Sales | DateKey, ProductKey, StoreKey, Quantity, Revenue |
        | Date | DateKey, Day, Month, Year |
        | Store | StoreKey, City, Country |
        | Product | ProductKey, ProductName, SubcategoryKey |
        | Subcategory | SubcategoryKey, SubcategoryName, CategoryKey |
        | Category | CategoryKey, CategoryName |

        Relations : Sales–Date, Sales–Store, Sales–Product, Product–Subcategory, Subcategory–Category.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The model is a snowflake schema.
            fr: Le modèle est un schéma en flocon de neige.
        - id: s2
          text:
            en: To show the total revenue by CategoryName, a CategoryKey column must first be added to the Sales table.
            fr: Pour afficher le chiffre d'affaires total par CategoryName, une colonne CategoryKey doit d'abord être ajoutée à la table Sales.
        - id: s3
          text:
            en: The Subcategory table is a fact table, because it isn't related directly to Sales.
            fr: La table Subcategory est une table de faits, car elle n'est pas liée directement à Sales.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Sales is the fact table and Date, Store and Product are its dimensions; because the Product dimension is itself related to Subcategory, which is related to Category, the model is a snowflake. Relationships let a filter flow from Category through Subcategory and Product to Sales, so revenue can be aggregated by category without changing the Sales table. Subcategory describes an entity with a unique key and a name: it is part of the product dimension, not a fact table.
        fr: |
          Sales est la table de faits, et Date, Store et Product sont ses dimensions ; comme la dimension Product est elle-même liée à Subcategory, elle-même liée à Category, le modèle est en flocon de neige. Les relations laissent un filtre passer de Category à Sales en traversant Subcategory et Product : le chiffre d'affaires peut donc être agrégé par catégorie sans modifier la table Sales. Subcategory décrit une entité avec une clé unique et un nom : elle fait partie de la dimension produit, ce n'est pas une table de faits.
      options:
        s2: { en: "The chain of relationships Category → Subcategory → Product → Sales already lets CategoryName filter the revenue.", fr: "La chaîne de relations Category → Subcategory → Product → Sales permet déjà à CategoryName de filtrer le chiffre d'affaires." }
        s3: { en: "A fact table holds one row per recorded event with numeric values; Subcategory holds one row per subcategory.", fr: "Une table de faits contient une ligne par événement enregistré avec des valeurs numériques ; Subcategory contient une ligne par sous-catégorie." }
    references:
      - title: Understand star schema and the importance for Power BI
        url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
