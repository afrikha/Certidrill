chapter: 14-data-roles
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso deploys Azure Database for PostgreSQL to store the transactional data of a new booking application.

        Which role typically provisions and manages this database?
      fr: |
        Contoso déploie Azure Database pour PostgreSQL pour stocker les données transactionnelles d'une nouvelle application de réservation.

        Quel rôle provisionne et gère généralement cette base de données ?
    body:
      options:
        - { id: a, text: { en: "Data analyst", fr: "Analyste de données" } }
        - { id: b, text: { en: "Data engineer", fr: "Ingénieur de données" } }
        - { id: c, text: { en: "AI engineer", fr: "Ingénieur IA" } }
        - { id: d, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Database administrators manage the open-source relational database services of Azure, such as Azure Database for PostgreSQL and Azure Database for MySQL, to support transactional applications. Provisioning and managing the databases of line-of-business applications is the administrator's job.
        fr: |
          Les administrateurs de base de données gèrent les services de bases de données relationnelles open source d'Azure, comme Azure Database pour PostgreSQL et Azure Database pour MySQL, pour soutenir les applications transactionnelles. Provisionner et gérer les bases de données des applications métier est le travail de l'administrateur.
      options:
        a: { en: "A data analyst can use the database as a source for reports, but doesn't provision or manage it.", fr: "Un analyste de données peut utiliser la base comme source de rapports, mais ne la provisionne pas et ne la gère pas." }
        b: { en: "A data engineer uses the database as a source for the pipelines of an analytical solution; managing it is the administrator's role.", fr: "Un ingénieur de données utilise la base comme source des pipelines d'une solution analytique ; la gérer est le rôle de l'administrateur." }
        c: { en: "An AI engineer builds AI-powered features into applications; that role doesn't manage transactional databases.", fr: "Un ingénieur IA crée des fonctionnalités d'IA dans les applications ; ce rôle ne gère pas les bases de données transactionnelles." }
    references:
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-14-02
    objective: "1.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The sales managers of Fabrikam want an interactive dashboard in which they can filter the revenue by region and by product.

        Which role is responsible for designing this dashboard?
      fr: |
        Les responsables commerciaux de Fabrikam veulent un tableau de bord interactif dans lequel ils peuvent filtrer le chiffre d'affaires par région et par produit.

        Quel rôle est chargé de concevoir ce tableau de bord ?
    body:
      options:
        - { id: a, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
        - { id: b, text: { en: "Data analyst", fr: "Analyste de données" } }
        - { id: c, text: { en: "Data engineer", fr: "Ingénieur de données" } }
        - { id: d, text: { en: "AI engineer", fr: "Ingénieur IA" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Data analysts create the reports and visualizations that turn data into insights for decision-makers. Building interactive dashboards, usually with Power BI, is a typical deliverable of the data analyst.
        fr: |
          Les analystes de données créent les rapports et les visualisations qui transforment les données en informations utiles pour les décideurs. Créer des tableaux de bord interactifs, le plus souvent avec Power BI, est un livrable type de l'analyste de données.
      options:
        a: { en: "The database administrator manages the availability, performance, backups and security of databases, not reports.", fr: "L'administrateur de base de données gère la disponibilité, les performances, les sauvegardes et la sécurité des bases de données, pas les rapports." }
        c: { en: "The data engineer builds the pipelines and analytical data stores that the dashboard reads, not the dashboard itself.", fr: "L'ingénieur de données crée les pipelines et les magasins de données analytiques que lit le tableau de bord, pas le tableau de bord lui-même." }
        d: { en: "The AI engineer builds AI-powered features such as chat over data; designing business dashboards is the analyst's work.", fr: "L'ingénieur IA crée des fonctionnalités d'IA comme la conversation sur les données ; concevoir des tableaux de bord métier est le travail de l'analyste." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-14-03
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Every night, the 40 stores of Wingtip Toys send their sales files in different formats, and some files contain duplicate rows. Before the data is loaded into the data warehouse, it must be converted to a common format and the duplicates must be removed.

        Which role is responsible for this work?
      fr: |
        Chaque nuit, les 40 magasins de Wingtip Toys envoient leurs fichiers de ventes dans des formats différents, et certains fichiers contiennent des lignes en double. Avant leur chargement dans l'entrepôt de données, les données doivent être converties dans un format commun et les doublons doivent être supprimés.

        Quel rôle est responsable de ce travail ?
    body:
      options:
        - { id: a, text: { en: "Data engineer", fr: "Ingénieur de données" } }
        - { id: b, text: { en: "Data analyst", fr: "Analyste de données" } }
        - { id: c, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
        - { id: d, text: { en: "AI engineer", fr: "Ingénieur IA" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Cleansing and transforming data while it is ingested into an analytical data store is a data engineering activity. The data engineer applies data cleaning routines and implements the pipelines that transfer and transform data between systems.
        fr: |
          Nettoyer et transformer les données pendant leur ingestion dans un magasin de données analytique est une activité d'ingénierie des données. L'ingénieur de données applique des routines de nettoyage des données et implémente les pipelines qui transfèrent et transforment les données entre les systèmes.
      options:
        b: { en: "The data analyst works with the data after it is loaded, to model it and build reports; preparing it for the load is the engineer's job.", fr: "L'analyste de données travaille sur les données après leur chargement, pour les modéliser et créer des rapports ; les préparer au chargement est le travail de l'ingénieur." }
        c: { en: "The database administrator manages databases (availability, backups, access), not the cleansing of incoming files.", fr: "L'administrateur de base de données gère les bases de données (disponibilité, sauvegardes, accès), pas le nettoyage des fichiers entrants." }
        d: { en: "The AI engineer builds AI-powered features; cleansing the data for a warehouse remains a data engineering task.", fr: "L'ingénieur IA crée des fonctionnalités d'IA ; nettoyer les données pour un entrepôt reste une tâche d'ingénierie des données." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-14-04
    objective: "1.4.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        The database administrator of Adatum performs three activities on the order database during the same week. You classify each activity by the responsibility of the administrator that it belongs to.

        Select the answer that correctly completes each sentence.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'administrateur de base de données d'Adatum effectue trois activités sur la base de données des commandes au cours de la même semaine. Vous classez chaque activité selon la responsabilité de l'administrateur dont elle relève.

        Sélectionnez la réponse qui complète correctement chaque phrase.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Removing the access of an employee who left the company is part of managing [[a1]].

          Keeping the database online while its server is patched is part of managing [[a2]].

          Tracking the response times of queries and tuning the database when they increase is part of managing [[a3]].
        fr: |
          Supprimer l'accès d'un employé qui a quitté l'entreprise relève de la gestion [[a1]].

          Maintenir la base de données en ligne pendant la mise à jour de son serveur relève de la gestion [[a2]].

          Suivre les temps de réponse des requêtes et ajuster la base de données quand ils augmentent relève de la gestion [[a3]].
      slots:
        - id: a1
          options:
            - { id: avail, text: { en: "availability", fr: "de la disponibilité" } }
            - { id: perf, text: { en: "performance", fr: "des performances" } }
            - { id: sec, text: { en: "data security", fr: "de la sécurité des données" } }
            - { id: backup, text: { en: "backup and recovery", fr: "de la sauvegarde et de la récupération" } }
        - id: a2
          options:
            - { id: avail, text: { en: "availability", fr: "de la disponibilité" } }
            - { id: perf, text: { en: "performance", fr: "des performances" } }
            - { id: sec, text: { en: "data security", fr: "de la sécurité des données" } }
            - { id: backup, text: { en: "backup and recovery", fr: "de la sauvegarde et de la récupération" } }
        - id: a3
          options:
            - { id: avail, text: { en: "availability", fr: "de la disponibilité" } }
            - { id: perf, text: { en: "performance", fr: "des performances" } }
            - { id: sec, text: { en: "data security", fr: "de la sécurité des données" } }
            - { id: backup, text: { en: "backup and recovery", fr: "de la sauvegarde et de la récupération" } }
    answer:
      values: { a1: sec, a2: avail, a3: perf }
    explanation:
      correct:
        en: |
          Granting or denying users access to the data, including removing the access of a former employee, is part of managing the security of the data in the database. Keeping the database online during maintenance concerns its overall availability. Tracking response times and tuning the database keeps its performance consistent, another responsibility of the administrator.
        fr: |
          Accorder ou refuser aux utilisateurs l'accès aux données, y compris supprimer l'accès d'un ancien employé, relève de la gestion de la sécurité des données dans la base. Maintenir la base en ligne pendant une maintenance concerne sa disponibilité globale. Suivre les temps de réponse et ajuster la base de données garantit des performances constantes, autre responsabilité de l'administrateur.
      options:
        backup: { en: "Backup and recovery plans restore the data after a disaster or a human error; none of the three activities restores data.", fr: "Les plans de sauvegarde et de récupération restaurent les données après un sinistre ou une erreur humaine ; aucune des trois activités ne restaure de données." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-14-05
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The machines of Litware's factory send their temperature readings continuously. The readings must be captured as they arrive and ingested into an analytical data store. They will then be queried to find which machines overheat most often.

        For each of the following statements about the work on these readings, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les machines de l'usine de Litware envoient leurs relevés de température en continu. Les relevés doivent être capturés à leur arrivée et ingérés dans un magasin de données analytique. Ils seront ensuite interrogés pour trouver les machines qui surchauffent le plus souvent.

        Pour chacune des affirmations suivantes sur le travail lié à ces relevés, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Capturing the stream of readings and ingesting it into the analytical data store is a responsibility of the data engineer.
            fr: Capturer le flux de relevés et l'ingérer dans le magasin de données analytique relève de la responsabilité de l'ingénieur de données.
        - id: s2
          text:
            en: Querying the stored readings to find which machines overheat most often is a responsibility of the data engineer.
            fr: Interroger les relevés stockés pour trouver les machines qui surchauffent le plus souvent relève de la responsabilité de l'ingénieur de données.
        - id: s3
          text:
            en: Before the data engineer can ingest the readings, they must first be stored in a relational database.
            fr: Avant que l'ingénieur de données puisse ingérer les relevés, ils doivent d'abord être stockés dans une base de données relationnelle.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Data engineers implement the ingestion of data into analytical stores, and they work with data streams as well as with relational and non-relational databases and file stores, so the stream doesn't need to go through a relational database first. Exploring the stored data to identify trends, such as the machines that overheat most often, is the work of the data analyst.
        fr: |
          Les ingénieurs de données implémentent l'ingestion des données dans les magasins analytiques, et ils travaillent avec des flux de données comme avec des bases de données relationnelles et non relationnelles et des magasins de fichiers : le flux n'a donc pas besoin de passer d'abord par une base de données relationnelle. Explorer les données stockées pour identifier des tendances, comme les machines qui surchauffent le plus souvent, est le travail de l'analyste de données.
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-14-06
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders loads raw sales records into its data warehouse. Two pieces of work are planned:

        - Work A: while the records are loaded, convert all the amounts to euros and remove the invalid rows.
        - Work B: on the loaded tables, define the relationships and the measures, such as the gross margin, that managers will use in self-service reports.

        Which roles are typically responsible for work A and for work B?
      fr: |
        Northwind Traders charge des enregistrements de ventes bruts dans son entrepôt de données. Deux travaux sont prévus :

        - Travail A : pendant le chargement des enregistrements, convertir tous les montants en euros et supprimer les lignes non valides.
        - Travail B : sur les tables chargées, définir les relations et les mesures, comme la marge brute, que les responsables utiliseront dans des rapports en libre-service.

        Quels rôles sont généralement responsables du travail A et du travail B ?
    body:
      options:
        - { id: a, text: { en: "Work A: data analyst. Work B: data engineer.", fr: "Travail A : analyste de données. Travail B : ingénieur de données." } }
        - { id: b, text: { en: "Work A: data engineer. Work B: data engineer.", fr: "Travail A : ingénieur de données. Travail B : ingénieur de données." } }
        - { id: c, text: { en: "Work A: data engineer. Work B: data analyst.", fr: "Travail A : ingénieur de données. Travail B : analyste de données." } }
        - { id: d, text: { en: "Work A: database administrator. Work B: data analyst.", fr: "Travail A : administrateur de base de données. Travail B : analyste de données." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Both roles transform and model data, but for different purposes. The data engineer cleanses and transforms the data while it is loaded into the analytical store (work A). The data analyst then designs and builds the analytical model, with its relationships and measures, on which the self-service reports are built (work B).
        fr: |
          Les deux rôles transforment et modélisent des données, mais dans des buts différents. L'ingénieur de données nettoie et transforme les données pendant leur chargement dans le magasin analytique (travail A). L'analyste de données conçoit et crée ensuite le modèle analytique, avec ses relations et ses mesures, sur lequel reposent les rapports en libre-service (travail B).
      options:
        a: { en: "The roles are swapped: cleansing data during the load is data engineering, and building the analytical model for reports is the analyst's work.", fr: "Les rôles sont inversés : nettoyer les données pendant le chargement relève de l'ingénierie des données, et créer le modèle analytique des rapports est le travail de l'analyste." }
        b: { en: "The engineer prepares and loads the data, but designing and building analytical models for reporting is a responsibility of the data analyst.", fr: "L'ingénieur prépare et charge les données, mais concevoir et créer des modèles analytiques pour les rapports est une responsabilité de l'analyste de données." }
        d: { en: "The database administrator manages databases (availability, backups, access); cleansing and transforming data for analytics is the engineer's work.", fr: "L'administrateur de base de données gère les bases de données (disponibilité, sauvegardes, accès) ; nettoyer et transformer les données pour l'analytique est le travail de l'ingénieur." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-14-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank stores its payroll data in a database in Azure SQL Database. The data is also copied every night to a data warehouse. You are reviewing how the work on this data is shared among the data roles.

        For each of the following statements about this split, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke ses données de paie dans une base de données Azure SQL Database. Les données sont aussi copiées chaque nuit dans un entrepôt de données. Vous examinez la façon dont le travail sur ces données est réparti entre les rôles de données.

        Pour chacune des affirmations suivantes sur cette répartition, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Deciding which employees can read the Payroll table of the database is a responsibility of the data engineer, because the table contains private data.
            fr: Décider quels employés peuvent lire la table Payroll de la base de données est une responsabilité de l'ingénieur de données, car la table contient des données privées.
        - id: s2
          text:
            en: An employee who provisioned the payroll database and then creates the pipeline that copies its data to the warehouse acts as a data engineer when creating the pipeline.
            fr: Un employé qui a provisionné la base de données de paie, puis crée le pipeline qui copie ses données vers l'entrepôt, agit en tant qu'ingénieur de données quand il crée le pipeline.
        - id: s3
          text:
            en: Planning with the stakeholders how the payroll data will be recovered after a natural disaster is a responsibility of the database administrator.
            fr: Planifier avec les parties prenantes la façon dont les données de paie seront récupérées après une catastrophe naturelle est une responsabilité de l'administrateur de base de données.
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Managing the security of the data in a database, granting or denying users access to it, is a responsibility of the database administrator; the data engineer ensures privacy while data moves between data stores, not who can read a table. One person can hold several roles: provisioning the database is administration, and creating the pipeline is data engineering. The administrator works with stakeholders on the backup and recovery plans that recover data after a natural disaster or a human error.
        fr: |
          Gérer la sécurité des données d'une base, en accordant ou en refusant l'accès aux utilisateurs, est une responsabilité de l'administrateur de base de données ; l'ingénieur de données préserve la confidentialité pendant que les données circulent entre les magasins de données, il ne décide pas qui peut lire une table. Une même personne peut tenir plusieurs rôles : provisionner la base relève de l'administration, créer le pipeline relève de l'ingénierie des données. L'administrateur travaille avec les parties prenantes sur les plans de sauvegarde et de récupération qui restaurent les données après une catastrophe naturelle ou une erreur humaine.
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-14-08
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A data analyst at Proseware has two tasks. First, the analyst must query large volumes of time-stamped telemetry that the company's IoT devices have sent. Second, the analyst must publish interactive dashboards that the managers can explore and share.

        Which two services should the analyst use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un analyste de données de Proseware a deux tâches. D'abord, il doit interroger de grands volumes de données de télémétrie horodatées envoyées par les appareils IoT de l'entreprise. Ensuite, il doit publier des tableaux de bord interactifs que les responsables peuvent explorer et partager.

        Quels sont les deux services que l'analyste doit utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Azure Data Factory" }
        - { id: b, text: "Azure Data Explorer" }
        - { id: c, text: "Azure Stream Analytics" }
        - { id: d, text: "Microsoft Purview" }
        - { id: e, text: "Power BI" }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Azure Data Explorer is designed for high-performance analysis of log and telemetry data: data analysts use it to query time-stamped data such as IoT telemetry. Power BI is the analyst's tool to connect to data, build interactive reports and dashboards, and share them across the organization.
        fr: |
          Azure Data Explorer est conçu pour l'analyse hautes performances des données de journaux et de télémétrie : les analystes de données l'utilisent pour interroger des données horodatées comme la télémétrie IoT. Power BI est l'outil de l'analyste pour se connecter aux données, créer des rapports et des tableaux de bord interactifs, et les partager dans l'organisation.
      options:
        a: { en: "Azure Data Factory lets data engineers define and schedule pipelines that transfer and transform data; it doesn't query telemetry or build dashboards.", fr: "Azure Data Factory permet aux ingénieurs de données de définir et de planifier des pipelines qui transfèrent et transforment les données ; il n'interroge pas la télémétrie et ne crée pas de tableaux de bord." }
        c: { en: "Azure Stream Analytics is used by data engineers to process streams in real time as they are captured, not to query the stored history of telemetry.", fr: "Azure Stream Analytics sert aux ingénieurs de données à traiter des flux en temps réel au moment de leur capture, pas à interroger l'historique stocké de la télémétrie." }
        d: { en: "Microsoft Purview provides data governance and lineage; it is a data engineering tool, not an analysis or reporting tool.", fr: "Microsoft Purview fournit la gouvernance et la traçabilité des données ; c'est un outil d'ingénierie des données, pas un outil d'analyse ou de rapports." }
    references:
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-14-09
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        At Tailspin Toys, a developer runs an UPDATE statement without a WHERE clause on the production order database, and every row of the Orders table is overwritten. The database stays online and keeps answering queries quickly. The Orders table must be brought back to its state of one hour earlier.

        Which responsibility of the database administrator covers this requirement?
      fr: |
        Chez Tailspin Toys, un développeur exécute une instruction UPDATE sans clause WHERE sur la base de données de production des commandes, et toutes les lignes de la table Orders sont écrasées. La base de données reste en ligne et continue de répondre rapidement aux requêtes. La table Orders doit être ramenée à son état d'une heure plus tôt.

        Quelle responsabilité de l'administrateur de base de données couvre cette exigence ?
    body:
      options:
        - { id: a, text: { en: "Ensuring the availability of the database", fr: "Garantir la disponibilité de la base de données" } }
        - { id: b, text: { en: "Optimizing the performance of the database", fr: "Optimiser les performances de la base de données" } }
        - { id: c, text: { en: "Managing the security of the database data", fr: "Gérer la sécurité des données de la base" } }
        - { id: d, text: { en: "Planning the backup and recovery of the data", fr: "Planifier la sauvegarde et la récupération des données" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Bringing data back to an earlier state after a human-made error is the purpose of the backup and recovery plans that the database administrator implements with the stakeholders. The database never went offline and stayed fast, so the problem is lost data, not availability or performance.
        fr: |
          Ramener des données à un état antérieur après une erreur humaine est le but des plans de sauvegarde et de récupération que l'administrateur de base de données met en œuvre avec les parties prenantes. La base n'a jamais été hors ligne et est restée rapide : le problème est la perte de données, pas la disponibilité ni les performances.
      options:
        a: { en: "Availability keeps the database online and reachable; the database stayed online, and an available database still holds the overwritten rows.", fr: "La disponibilité maintient la base en ligne et accessible ; la base est restée en ligne, et une base disponible contient toujours les lignes écrasées." }
        b: { en: "Performance work keeps response times consistent; the queries still run quickly, and tuning doesn't bring back the old values.", fr: "Le travail sur les performances maintient des temps de réponse constants ; les requêtes restent rapides, et l'optimisation ne ramène pas les anciennes valeurs." }
        c: { en: "Reviewing who may update the table can prevent a repeat, but managing access doesn't restore the data that was overwritten.", fr: "Revoir qui peut mettre à jour la table peut éviter que l'erreur se répète, mais gérer les accès ne restaure pas les données écrasées." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-14-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders starts a customer analytics project. Customer data is copied from an on-premises CRM system to cloud data stores, loaded every night, and used in reports. The HR database of the company is also involved.

        Match each task to the role that is responsible for it. To answer, drag the appropriate role to each task. Each role may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders lance un projet d'analytique client. Les données client sont copiées d'un système CRM local vers des magasins de données cloud, chargées chaque nuit et utilisées dans des rapports. La base de données RH de l'entreprise est aussi concernée.

        Associez chaque tâche au rôle qui en est responsable. Pour répondre, faites glisser le rôle approprié vers chaque tâche. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: dba, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
        - { id: eng, text: { en: "Data engineer", fr: "Ingénieur de données" } }
        - { id: ana, text: { en: "Data analyst", fr: "Analyste de données" } }
        - { id: ai, text: { en: "AI engineer", fr: "Ingénieur IA" } }
      targets:
        - id: t1
          text: { en: "Make sure the customer data stays private while it is copied from the on-premises CRM system to the cloud data stores", fr: "Veiller à ce que les données client restent confidentielles pendant leur copie du système CRM local vers les magasins de données cloud" }
        - id: t2
          text: { en: "Prevent the temporary staff from reading the Contracts table of the HR database", fr: "Empêcher le personnel temporaire de lire la table Contracts de la base de données RH" }
        - id: t3
          text: { en: "Explore the customer data to find which segments buy more after a promotion", fr: "Explorer les données client pour trouver les segments qui achètent davantage après une promotion" }
        - id: t4
          text: { en: "Check each morning that the overnight loads completed, and rerun the ones that failed", fr: "Vérifier chaque matin que les chargements de la nuit se sont terminés, et relancer ceux qui ont échoué" }
    answer:
      mapping: { t1: eng, t2: dba, t3: ana, t4: eng }
    explanation:
      correct:
        en: |
          The data engineer ensures that data privacy is maintained from on-premises to cloud data stores, and owns the management and monitoring of the data pipelines so that data loads perform as expected. Granting or denying users access to the data of a database is part of the database administrator's management of data security. Exploring data to identify trends and relationships is the data analyst's work. No task here builds an AI-powered feature, so the AI engineer isn't used.
        fr: |
          L'ingénieur de données veille à préserver la confidentialité des données des magasins locaux jusqu'aux magasins cloud, et il est responsable de la gestion et de la surveillance des pipelines de données, pour que les chargements se déroulent comme prévu. Accorder ou refuser aux utilisateurs l'accès aux données d'une base relève de la gestion de la sécurité des données par l'administrateur de base de données. Explorer les données pour identifier des tendances et des relations est le travail de l'analyste de données. Aucune tâche ne crée ici de fonctionnalité d'IA : l'ingénieur IA n'est donc pas utilisé.
      options:
        dba: { en: "The administrator controls access to the data inside a database (t2), but privacy across the data movement and the monitoring of the loads belong to the data engineer.", fr: "L'administrateur contrôle l'accès aux données dans une base (t2), mais la confidentialité pendant le déplacement des données et la surveillance des chargements reviennent à l'ingénieur de données." }
    references:
      - title: Explore job roles in the world of data
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
