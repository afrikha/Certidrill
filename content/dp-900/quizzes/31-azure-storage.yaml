chapter: 31-azure-storage
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys uploads temporary blobs to a general-purpose v2 storage account, and an application deletes them a few days later. Deleting these blobs must never lead to an early deletion charge.

        In which access tier of Azure Blob Storage should the blobs be stored?
      fr: |
        Tailspin Toys charge des objets blob temporaires dans un compte de stockage v2 à usage général, et une application les supprime quelques jours plus tard. La suppression de ces objets blob ne doit jamais entraîner de frais de suppression anticipée.

        Dans quel niveau d'accès du Stockage Blob Azure les objets blob doivent-ils être stockés ?
    body:
      options:
        - { id: a, text: { en: "Hot", fr: "Chaud (Hot)" } }
        - { id: b, text: { en: "Cool", fr: "Froid (Cool)" } }
        - { id: c, text: { en: "Cold", fr: "Froid (Cold)" } }
        - { id: d, text: { en: "Archive", fr: "Archive" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The hot tier has no minimum storage period, so a blob can be deleted at any time without an early deletion charge. The cool, cold and archive tiers have minimum periods of 30, 90 and 180 days, and removing a blob before the end of that period is billed as an early deletion.
        fr: |
          Le niveau chaud (Hot) n'a pas de durée minimale de stockage : un objet blob peut donc être supprimé à tout moment sans frais de suppression anticipée. Les niveaux froid (Cool), froid (Cold) et archive (Archive) ont des durées minimales de 30, 90 et 180 jours, et supprimer un objet blob avant la fin de cette durée est facturé comme une suppression anticipée.
      options:
        b: { en: "The cool tier has a 30-day minimum: a blob deleted after a few days incurs an early deletion charge.", fr: "Le niveau froid (Cool) a une durée minimale de 30 jours : un objet blob supprimé après quelques jours entraîne des frais de suppression anticipée." }
        c: { en: "The cold tier has a 90-day minimum: a blob deleted after a few days incurs an early deletion charge.", fr: "Le niveau froid (Cold) a une durée minimale de 90 jours : un objet blob supprimé après quelques jours entraîne des frais de suppression anticipée." }
        d: { en: "The archive tier has a 180-day minimum, and its blobs are offline: it suits data kept for years, not temporary blobs.", fr: "Le niveau archive (Archive) a une durée minimale de 180 jours, et ses objets blob sont hors connexion : il convient aux données conservées des années, pas aux objets blob temporaires." }
    references:
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-31-02
    objective: "3.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An application reads customer rows from a table in Azure Table storage.

        Which query returns a single row with the fastest lookup?
      fr: |
        Une application lit des lignes de clients dans une table du Stockage Table Azure.

        Quelle requête retourne une seule ligne avec la recherche la plus rapide ?
    body:
      options:
        - { id: a, text: { en: "A query that gives the partition key and a range of row keys", fr: "Une requête qui fournit la clé de partition et une plage de clés de ligne" } }
        - { id: b, text: { en: "A query that gives only the partition key of the row", fr: "Une requête qui fournit uniquement la clé de partition de la ligne" } }
        - { id: c, text: { en: "A query that gives both the partition key and the row key", fr: "Une requête qui fournit à la fois la clé de partition et la clé de ligne" } }
        - { id: d, text: { en: "A query that gives the Timestamp value of the row", fr: "Une requête qui fournit la valeur Timestamp de la ligne" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A query that gives both parts of the key is a point query: the partition key locates the partition, and the row key identifies the row inside it. It returns exactly one row and is the fastest lookup that Azure Table storage offers.
        fr: |
          Une requête qui fournit les deux parties de la clé est une requête de point : la clé de partition localise la partition, et la clé de ligne identifie la ligne à l'intérieur. Elle retourne exactement une ligne et c'est la recherche la plus rapide qu'offre le Stockage Table Azure.
      options:
        a: { en: "This is a range query: it reads a contiguous block of rows in one partition, so it is slower than a point query for a single row.", fr: "C'est une requête de plage : elle lit un bloc contigu de lignes dans une partition ; elle est donc plus lente qu'une requête de point pour une seule ligne." }
        b: { en: "The partition key alone narrows the search to one partition, but the service must still read the rows of that partition.", fr: "La clé de partition seule limite la recherche à une partition, mais le service doit encore lire les lignes de cette partition." }
        d: { en: "Timestamp only records when the row was last modified; it isn't part of the key, so the search reads every partition.", fr: "Timestamp enregistre seulement la date de dernière modification de la ligne ; il ne fait pas partie de la clé, et la recherche lit donc toutes les partitions." }
    references:
      - title: Explore Azure Tables
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
      - title: Design for querying
        url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-design-for-query

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An administrator at Wingtip Toys must add three documents to an existing Azure file share, once. The administrator works from a web browser and isn't allowed to install any software on the computer.

        What should the administrator use?
      fr: |
        Un administrateur de Wingtip Toys doit ajouter trois documents à un partage de fichiers Azure existant, une seule fois. L'administrateur travaille depuis un navigateur web et n'a pas le droit d'installer de logiciel sur l'ordinateur.

        Que doit utiliser l'administrateur ?
    body:
      options:
        - { id: a, text: "AzCopy" }
        - { id: b, text: "Azure File Sync" }
        - { id: c, text: { en: "The Azure portal", fr: "Le portail Azure" } }
        - { id: d, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Azure portal lets you upload files directly to an Azure file share from a browser, which suits a one-time upload of a few documents. Nothing has to be installed on the computer.
        fr: |
          Le portail Azure permet de charger des fichiers directement dans un partage de fichiers Azure depuis un navigateur, ce qui convient au chargement ponctuel de quelques documents. Rien n'est à installer sur l'ordinateur.
      options:
        a: { en: "AzCopy is a command-line utility that runs on the computer; it suits scripted or bulk copies, not a browser-only upload.", fr: "AzCopy est un utilitaire en ligne de commande qui s'exécute sur l'ordinateur ; il convient aux copies scriptées ou en masse, pas à un chargement depuis un simple navigateur." }
        b: { en: "Azure File Sync keeps locally cached copies of shared files synchronized with the share; it isn't a tool for a one-time upload from a browser.", fr: "Azure File Sync synchronise des copies de fichiers partagés mises en cache localement avec le partage ; ce n'est pas un outil de chargement ponctuel depuis un navigateur." }
        d: { en: "Lifecycle management policies move or delete blobs in Blob Storage; they don't upload files to a file share.", fr: "Les stratégies de gestion du cycle de vie déplacent ou suppriment des objets blob du Stockage Blob ; elles ne chargent pas de fichiers dans un partage." }
    references:
      - title: Explore Azure Files
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-31-04
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware keeps two kinds of blobs in one Azure Storage account: large backup files that are written once, and the disks of its virtual machines. In a container, the backups are named like `2026/11/db-full.bak`, so the portal shows them in folders. The hierarchical namespace isn't enabled on the account.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware conserve deux types d'objets blob dans un même compte de Stockage Azure : des fichiers de sauvegarde volumineux écrits une seule fois, et les disques de ses machines virtuelles. Dans un conteneur, les sauvegardes sont nommées comme `2026/11/db-full.bak` : le portail les présente donc dans des dossiers. L'espace de noms hiérarchique n'est pas activé sur le compte.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A block blob that holds a backup can be made up of as many as 50,000 blocks.", fr: "Un objet blob de blocs qui contient une sauvegarde peut être composé de 50 000 blocs au plus." }
        - id: s2
          text: { en: "A page blob that holds a virtual machine disk is organized in fixed-size pages of 512 bytes.", fr: "Un objet blob de pages qui contient un disque de machine virtuelle est organisé en pages de taille fixe de 512 octets." }
        - id: s3
          text: { en: "Litware can delete a virtual folder of a container, with all the blobs that it shows, in a single operation on the folder.", fr: "Litware peut supprimer un dossier virtuel d'un conteneur, avec tous les objets blob qu'il présente, en une seule opération sur le dossier." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A block blob is a set of blocks of up to 4,000 MiB each, with a maximum of 50,000 blocks, which gives about 190.7 TiB. A page blob is a collection of fixed-size 512-byte pages, optimized for the random reads and writes of virtual machine disks. Without the hierarchical namespace, folders are only a view built from the `/` in blob names, so you can't run bulk operations on a folder.
        fr: |
          Un objet blob de blocs est un ensemble de blocs de 4 000 Mio au plus chacun, avec un maximum de 50 000 blocs, soit environ 190,7 Tio. Un objet blob de pages est une collection de pages de taille fixe de 512 octets, optimisée pour les lectures et écritures aléatoires des disques de machines virtuelles. Sans espace de noms hiérarchique, les dossiers ne sont qu'une présentation construite à partir des `/` des noms d'objets blob : on ne peut donc pas lancer d'opération en masse sur un dossier.
      options:
        s3: { en: "Virtual folders don't really exist: each blob must be deleted on its own unless the hierarchical namespace provides real directories.", fr: "Les dossiers virtuels n'existent pas vraiment : chaque objet blob doit être supprimé séparément, sauf si l'espace de noms hiérarchique fournit de vrais répertoires." }
    references:
      - title: Explore Azure blob storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-31-05
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders stores parcel tracking events in a table of Azure Table storage. The partition key is the parcel number. The tracking page of a parcel must read all the events of that parcel as one contiguous block of rows, in chronological order.

        Which value should Northwind Traders use as the row key?
      fr: |
        Northwind Traders stocke les événements de suivi des colis dans une table du Stockage Table Azure. La clé de partition est le numéro du colis. La page de suivi d'un colis doit lire tous les événements de ce colis sous la forme d'un bloc contigu de lignes, dans l'ordre chronologique.

        Quelle valeur Northwind Traders doit-elle utiliser comme clé de ligne ?
    body:
      options:
        - { id: a, text: { en: "A new random GUID that is generated for each event", fr: "Un nouveau GUID aléatoire généré pour chaque événement" } }
        - { id: b, text: { en: "The date and time of the event, such as 2026-11-24T08:15:00Z", fr: "La date et l'heure de l'événement, par exemple 2026-11-24T08:15:00Z" } }
        - { id: c, text: { en: "The parcel number, the same value as the partition key", fr: "Le numéro du colis, la même valeur que la clé de partition" } }
        - { id: d, text: { en: "No value, because the Timestamp column already sorts the rows", fr: "Aucune valeur, car la colonne Timestamp trie déjà les lignes" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Rows that share a partition key are stored together, sorted by row key. With the event date and time as the row key, the events of a parcel are stored in chronological order, so a range query on that partition returns them as one contiguous block. The value is also unique within the partition for each event.
        fr: |
          Les lignes qui partagent une clé de partition sont stockées ensemble, triées par clé de ligne. Avec la date et l'heure de l'événement comme clé de ligne, les événements d'un colis sont stockés dans l'ordre chronologique : une requête de plage sur cette partition les retourne donc en un bloc contigu. La valeur est aussi unique dans la partition pour chaque événement.
      options:
        a: { en: "A random GUID is unique, but the rows are then sorted in a random order, not in the order of the events.", fr: "Un GUID aléatoire est unique, mais les lignes sont alors triées dans un ordre aléatoire, pas dans l'ordre des événements." }
        c: { en: "The row key must be unique within the partition: every event of a parcel would have the same key, so only one row could exist per parcel.", fr: "La clé de ligne doit être unique dans la partition : tous les événements d'un colis auraient la même clé, et une seule ligne pourrait exister par colis." }
        d: { en: "Every row needs a row key, and Timestamp only records the last modification: rows are stored in row key order, not Timestamp order.", fr: "Chaque ligne a besoin d'une clé de ligne, et Timestamp enregistre seulement la dernière modification : les lignes sont stockées dans l'ordre de la clé de ligne, pas de Timestamp." }
    references:
      - title: Explore Azure Tables
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
      - title: Design for querying
        url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-design-for-query

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum's engineering team works on Windows and Linux workstations. All the workstations must mount the same storage as a network drive. The largest design file is 3 TiB, and the storage must offer the highest throughput available.

        What should Adatum create?
      fr: |
        L'équipe d'ingénierie d'Adatum travaille sur des stations de travail Windows et Linux. Toutes les stations de travail doivent monter le même stockage comme lecteur réseau. Le plus gros fichier de conception fait 3 Tio, et le stockage doit offrir le débit le plus élevé disponible.

        Que doit créer Adatum ?
    body:
      options:
        - { id: a, text: { en: "An NFS file share in Azure Files, in the SSD media tier", fr: "Un partage de fichiers NFS dans Azure Files, au niveau de support SSD" } }
        - { id: b, text: { en: "An SMB file share in Azure Files, in the HDD media tier", fr: "Un partage de fichiers SMB dans Azure Files, au niveau de support HDD" } }
        - { id: c, text: { en: "A blob container in Azure Blob Storage, in the hot access tier", fr: "Un conteneur d'objets blob dans le Stockage Blob Azure, au niveau d'accès chaud (Hot)" } }
        - { id: d, text: { en: "An SMB file share in Azure Files, in the SSD media tier", fr: "Un partage de fichiers SMB dans Azure Files, au niveau de support SSD" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A network drive mounted by many computers is an Azure file share, and a 3 TiB file fits under the 4 TiB maximum file size of Azure Files. SMB is used by Windows, Linux and macOS, so both kinds of workstations can mount the share. The SSD media tier offers greater throughput than the HDD tier.
        fr: |
          Un lecteur réseau monté par de nombreux ordinateurs est un partage de fichiers Azure, et un fichier de 3 Tio tient sous la taille maximale de 4 Tio d'un fichier dans Azure Files. SMB est utilisé par Windows, Linux et macOS : les deux types de stations de travail peuvent donc monter le partage. Le niveau de support SSD offre un débit plus élevé que le niveau HDD.
      options:
        a: { en: "NFS shares aren't supported on Windows, so the Windows workstations couldn't mount this share.", fr: "Les partages NFS ne sont pas pris en charge sous Windows : les stations de travail Windows ne pourraient pas monter ce partage." }
        b: { en: "SMB suits both operating systems, but the HDD tier is the lower-cost option with less throughput than SSD.", fr: "SMB convient aux deux systèmes d'exploitation, mais le niveau HDD est l'option la moins chère, avec un débit inférieur au SSD." }
        c: { en: "Blob Storage is accessed through an API or a URL; it isn't mounted on Windows as a network drive over SMB.", fr: "On accède au Stockage Blob par une API ou une URL ; il ne se monte pas sous Windows comme un lecteur réseau en SMB." }
    references:
      - title: Explore Azure Files
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-31-07
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a general-purpose v2 storage account named **stcontosoraw**, with locally redundant storage (LRS), that holds the raw files processed by Azure Databricks. The hierarchical namespace isn't enabled. Contoso has the following requirements:

        - Data engineers must set permissions on individual directories and files.
        - Files that haven't been modified for one year must move automatically to the tier with the lowest storage cost. Retrieving these files can take several hours.

        Which two actions should Contoso perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un compte de stockage v2 à usage général nommé **stcontosoraw**, avec stockage localement redondant (LRS), qui contient les fichiers bruts traités par Azure Databricks. L'espace de noms hiérarchique n'est pas activé. Contoso a les exigences suivantes :

        - Les ingénieurs de données doivent définir des autorisations sur des répertoires et des fichiers individuels.
        - Les fichiers qui n'ont pas été modifiés depuis un an doivent passer automatiquement au niveau dont le coût de stockage est le plus bas. La récupération de ces fichiers peut prendre plusieurs heures.

        Quelles sont les deux actions que Contoso doit effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Create a lifecycle management policy that moves blobs to the cold tier 365 days after their last modification.", fr: "Créer une stratégie de gestion du cycle de vie qui déplace les objets blob vers le niveau froid (Cold) 365 jours après leur dernière modification." } }
        - { id: b, text: { en: "Upgrade stcontosoraw to enable the hierarchical namespace of Azure Data Lake Storage Gen2.", fr: "Mettre à niveau stcontosoraw pour activer l'espace de noms hiérarchique d'Azure Data Lake Storage Gen2." } }
        - { id: c, text: { en: "Assign Azure RBAC roles to the data engineers on each virtual folder of the container.", fr: "Attribuer des rôles Azure RBAC aux ingénieurs de données sur chaque dossier virtuel du conteneur." } }
        - { id: d, text: { en: "Create a lifecycle management policy that moves blobs to the archive tier 365 days after their last modification.", fr: "Créer une stratégie de gestion du cycle de vie qui déplace les objets blob vers le niveau archive (Archive) 365 jours après leur dernière modification." } }
        - { id: e, text: { en: "Change the default access tier of stcontosoraw from hot to cool, so that older files cost less.", fr: "Changer le niveau d'accès par défaut de stcontosoraw de chaud (Hot) à froid (Cool), pour que les anciens fichiers coûtent moins cher." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Enabling the hierarchical namespace turns the account into Azure Data Lake Storage Gen2: blobs are organized in real directories, and POSIX-compliant access control lists set permissions on individual directories and files. A lifecycle management policy then moves blobs automatically according to the days since their last modification, and the archive tier has the lowest storage cost, with retrieval in hours accepted here.
        fr: |
          Activer l'espace de noms hiérarchique transforme le compte en Azure Data Lake Storage Gen2 : les objets blob sont organisés dans de vrais répertoires, et des listes de contrôle d'accès conformes à POSIX définissent les autorisations sur des répertoires et des fichiers individuels. Une stratégie de gestion du cycle de vie déplace ensuite automatiquement les objets blob selon le nombre de jours écoulés depuis leur dernière modification, et le niveau archive (Archive) a le coût de stockage le plus bas, avec une récupération en plusieurs heures acceptée ici.
      options:
        a: { en: "The cold tier keeps blobs immediately readable, but its storage cost is higher than the archive tier's: it isn't the lowest.", fr: "Le niveau froid (Cold) garde les objets blob lisibles immédiatement, mais son coût de stockage est plus élevé que celui du niveau archive (Archive) : ce n'est pas le plus bas." }
        c: { en: "Without the hierarchical namespace, folders are virtual: you can't set permissions on them, and access is controlled at the container level.", fr: "Sans espace de noms hiérarchique, les dossiers sont virtuels : on ne peut pas y définir d'autorisations, et l'accès se contrôle au niveau du conteneur." }
        e: { en: "The default tier applies to all blobs from day one and doesn't move year-old files to the cheapest tier; it sets no permissions either.", fr: "Le niveau par défaut s'applique à tous les objets blob dès le premier jour et ne déplace pas les fichiers d'un an vers le niveau le moins cher ; il ne définit pas non plus d'autorisations." }
    references:
      - title: Explore Azure Data Lake Storage Gen2
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/3-azure-data-lake-gen2
      - title: Azure Blob Storage lifecycle management overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware moves its order data from a relational database to Azure Table storage. In the relational database, a Customers table and an Orders table are linked by a foreign key, and a view joins them for the reports.

        In Table storage, Proseware creates one table named **Orders**. The partition key is the customer ID, the row key is the order ID, and each row also stores the name and the city of the customer.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware déplace ses données de commandes d'une base de données relationnelle vers le Stockage Table Azure. Dans la base de données relationnelle, une table Customers et une table Orders sont liées par une clé étrangère, et une vue les joint pour les rapports.

        Dans le Stockage Table, Proseware crée une seule table nommée **Orders**. La clé de partition est l'ID du client, la clé de ligne est l'ID de la commande, et chaque ligne stocke aussi le nom et la ville du client.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a customer moves to another city, the application must update the city in every order row of that customer.", fr: "Quand un client déménage dans une autre ville, l'application doit mettre à jour la ville dans chaque ligne de commande de ce client." }
        - id: s2
          text: { en: "Proseware can create a view on the Orders table so that the reports keep the same join.", fr: "Proseware peut créer une vue sur la table Orders pour que les rapports conservent la même jointure." }
        - id: s3
          text: { en: "A query that returns all the orders of the customers who live in Lyon reads a single partition.", fr: "Une requête qui retourne toutes les commandes des clients qui habitent à Lyon lit une seule partition." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Table storage data is denormalized: each order row repeats the customer's name and city, so a change of city must be written to every row of that customer. Table storage has no foreign keys, joins, stored procedures or views. Only the partition key decides which partition holds a row; the city is an ordinary column, so a search on the city must read every partition.
        fr: |
          Les données du Stockage Table sont dénormalisées : chaque ligne de commande répète le nom et la ville du client, et un changement de ville doit donc être écrit dans toutes les lignes de ce client. Le Stockage Table n'a ni clé étrangère, ni jointure, ni procédure stockée, ni vue. Seule la clé de partition décide de la partition qui contient une ligne ; la ville est une colonne ordinaire, et une recherche sur la ville doit donc lire toutes les partitions.
      options:
        s2: { en: "Views and joins are relational objects; Table storage doesn't offer them.", fr: "Les vues et les jointures sont des objets relationnels ; le Stockage Table ne les propose pas." }
        s3: { en: "The customers of Lyon have different customer IDs, so their rows are spread over many partitions.", fr: "Les clients de Lyon ont des ID de client différents : leurs lignes sont donc réparties dans de nombreuses partitions." }
    references:
      - title: Explore Azure Tables
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
      - title: Design for querying
        url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-design-for-query

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-31-09
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam is choosing where to store four kinds of data.

        Which storage option should Fabrikam use for each kind of data? To answer, drag the appropriate option to each kind of data. Each option may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam choisit où stocker quatre types de données.

        Quelle option de stockage Fabrikam doit-elle utiliser pour chaque type de données ? Pour répondre, faites glisser l'option appropriée vers chaque type de données. Chaque option peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: block, text: { en: "Block blobs in Azure Blob Storage", fr: "Objets blob de blocs du Stockage Blob Azure" } }
        - { id: append, text: { en: "Append blobs in Azure Blob Storage", fr: "Objets blob d'ajout du Stockage Blob Azure" } }
        - { id: adls, text: "Azure Data Lake Storage Gen2" }
        - { id: files, text: "Azure Files" }
        - { id: table, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
        - { id: cosmostable, text: "Azure Cosmos DB for Table" }
      targets:
        - id: logs
          text: { en: "Web server logs to which each server adds new lines all day long", fr: "Des journaux de serveurs web auxquels chaque serveur ajoute de nouvelles lignes toute la journée" }
        - id: lake
          text: { en: "Raw sales files that Azure Databricks processes, with permissions set on each directory", fr: "Des fichiers de ventes bruts traités par Azure Databricks, avec des autorisations définies sur chaque répertoire" }
        - id: settings
          text: { en: "Device settings looked up by site and device ID, in a single region, at low cost, in the storage account that already holds the logs", fr: "Des paramètres d'appareils recherchés par site et par ID d'appareil, dans une seule région, à faible coût, dans le compte de stockage qui contient déjà les journaux" }
        - id: drive
          text: { en: "Spreadsheets that employees open from a drive mapped on their Windows computers", fr: "Des feuilles de calcul que les employés ouvrent depuis un lecteur mappé sur leurs ordinateurs Windows" }
    answer:
      mapping: { logs: append, lake: adls, settings: table, drive: files }
    explanation:
      correct:
        en: |
          An append blob only adds blocks at its end, which suits logs that keep growing. Azure Data Lake Storage Gen2 adds real directories with POSIX access control lists to Blob Storage, and analytics platforms such as Azure Databricks work with it. Azure Table storage keeps key/value rows in a storage account at low cost, with the site as partition key and the device ID as row key. A mapped drive is an Azure file share.
        fr: |
          Un objet blob d'ajout n'ajoute des blocs qu'à sa fin, ce qui convient aux journaux qui ne cessent de croître. Azure Data Lake Storage Gen2 ajoute au Stockage Blob de vrais répertoires avec des listes de contrôle d'accès POSIX, et les plateformes d'analytique comme Azure Databricks fonctionnent avec lui. Le Stockage Table Azure conserve des lignes clé/valeur dans un compte de stockage à faible coût, avec le site comme clé de partition et l'ID d'appareil comme clé de ligne. Un lecteur mappé est un partage de fichiers Azure.
      options:
        block: { en: "Block blobs suit large objects that change infrequently, not files that receive new lines all day.", fr: "Les objets blob de blocs conviennent aux objets volumineux qui changent rarement, pas aux fichiers qui reçoivent de nouvelles lignes toute la journée." }
        cosmostable: { en: "Azure Cosmos DB for Table uses the same model, but it is a separate service built for global distribution and higher performance, not low-cost storage inside the storage account.", fr: "Azure Cosmos DB for Table utilise le même modèle, mais c'est un service distinct conçu pour la distribution mondiale et des performances supérieures, pas pour un stockage à faible coût dans le compte de stockage." }
    references:
      - title: Explore Azure blob storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
      - title: Explore Azure Tables
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-31-10
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank stores invoices as block blobs in the hot tier of a general-purpose v2 storage account that uses locally redundant storage (LRS). A lifecycle management policy contains one rule with two actions:

        - Move blobs to the archive tier 30 days after their last modification.
        - Delete blobs 120 days after their last modification.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke des factures sous forme d'objets blob de blocs au niveau chaud (Hot) d'un compte de stockage v2 à usage général qui utilise le stockage localement redondant (LRS). Une stratégie de gestion du cycle de vie contient une règle avec deux actions :

        - Déplacer les objets blob vers le niveau archive (Archive) 30 jours après leur dernière modification.
        - Supprimer les objets blob 120 jours après leur dernière modification.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An invoice that was last modified 45 days ago can be read within milliseconds when a customer requests it.", fr: "Une facture dont la dernière modification remonte à 45 jours peut être lue en quelques millisecondes quand un client la demande." }
        - id: s2
          text: { en: "When the policy deletes an invoice, Woodgrove Bank is billed an early deletion charge for that invoice.", fr: "Quand la stratégie supprime une facture, Woodgrove Bank se voit facturer des frais de suppression anticipée pour cette facture." }
        - id: s3
          text: { en: "An invoice that is corrected 20 days after its upload moves to the archive tier about 50 days after its upload.", fr: "Une facture corrigée 20 jours après son chargement passe au niveau archive (Archive) environ 50 jours après son chargement." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          After 30 days without modification, the invoice is in the archive tier, where blobs are offline: it must first be rehydrated to the hot, cool or cold tier, which can take up to 15 hours. The policy deletes the invoice 90 days after moving it to archive, before the 180-day minimum of that tier, so an early deletion charge applies. The days are counted from the last modification: a correction on day 20 restarts the count, so the move happens about 50 days after the upload.
        fr: |
          Après 30 jours sans modification, la facture est au niveau archive (Archive), où les objets blob sont hors connexion : elle doit d'abord être réhydratée vers le niveau chaud (Hot), froid (Cool) ou froid (Cold), ce qui peut prendre jusqu'à 15 heures. La stratégie supprime la facture 90 jours après l'avoir déplacée vers l'archive, avant la durée minimale de 180 jours de ce niveau : des frais de suppression anticipée s'appliquent donc. Les jours se comptent depuis la dernière modification : une correction au jour 20 relance le décompte, et le déplacement a donc lieu environ 50 jours après le chargement.
      options:
        s1: { en: "Only blobs in the hot, cool and cold tiers are read in milliseconds; an archived blob needs rehydration first.", fr: "Seuls les objets blob des niveaux chaud (Hot), froid (Cool) et froid (Cold) se lisent en quelques millisecondes ; un objet blob archivé doit d'abord être réhydraté." }
    references:
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
      - title: Azure Blob Storage lifecycle management overview
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
