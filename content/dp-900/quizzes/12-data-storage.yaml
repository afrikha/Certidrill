chapter: 12-data-storage
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-12-01
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam keeps part of its data as files on a network share and the rest in a database.

        Which statement describes the database rather than the file store?
      fr: |
        Fabrikam conserve une partie de ses données sous forme de fichiers sur un partage réseau et le reste dans une base de données.

        Quelle affirmation décrit la base de données plutôt que le magasin de fichiers ?
    body:
      options:
        - { id: a, text: { en: "It keeps whole files on a local disk, on a network share or in the cloud.", fr: "Elle conserve des fichiers entiers sur un disque local, sur un partage réseau ou dans le cloud." } }
        - { id: b, text: { en: "It is a dedicated system that manages data records that applications query.", fr: "C'est un système dédié qui gère des enregistrements de données que les applications interrogent." } }
        - { id: c, text: { en: "It keeps each data set as a file in a format such as CSV, JSON or Parquet.", fr: "Elle conserve chaque jeu de données dans un fichier d'un format comme CSV, JSON ou Parquet." } }
        - { id: d, text: { en: "It keeps raw binary files, such as images and videos, organized in folders.", fr: "Elle conserve des fichiers binaires bruts, comme des images et des vidéos, organisés en dossiers." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A database is a central, dedicated system in which data is stored as records and queried by applications. A file store, by contrast, keeps data as files, whatever their format, on a disk, a share or in cloud storage.
        fr: |
          Une base de données est un système central et dédié dans lequel les données sont stockées sous forme d'enregistrements et interrogées par les applications. Un magasin de fichiers, à l'inverse, conserve les données sous forme de fichiers, quel que soit leur format, sur un disque, un partage ou dans un stockage cloud.
      options:
        a: { en: "Keeping files on a local disk, a network share or in the cloud is the definition of a file store.", fr: "Conserver des fichiers sur un disque local, un partage réseau ou dans le cloud est la définition d'un magasin de fichiers." }
        c: { en: "CSV, JSON and Parquet are file formats: data kept as files of these formats is in a file store.", fr: "CSV, JSON et Parquet sont des formats de fichiers : des données conservées dans des fichiers de ces formats sont dans un magasin de fichiers." }
        d: { en: "Binary files organized in folders are typical content of a file store, not records managed by a database.", fr: "Des fichiers binaires organisés en dossiers sont le contenu type d'un magasin de fichiers, pas des enregistrements gérés par une base de données." }
    references:
      - title: Explore file storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
      - title: Explore databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-12-02
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A legacy system exchanges data in a text format in which tags enclosed in angle brackets define elements and attributes. The team wants to replace it with the less verbose text format that has largely superseded it and that can also represent hierarchical data.

        Which format should the team adopt?
      fr: |
        Un système hérité échange des données dans un format texte dans lequel des balises entre chevrons définissent des éléments et des attributs. L'équipe veut le remplacer par le format texte moins verbeux qui l'a largement supplanté et qui peut aussi représenter des données hiérarchiques.

        Quel format l'équipe doit-elle adopter ?
    body:
      options:
        - { id: a, text: Avro }
        - { id: b, text: TSV }
        - { id: c, text: JSON }
        - { id: d, text: Parquet }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The legacy format is XML, which was popular in the 1990s and 2000s. It has largely been superseded by JSON, a less verbose text format that represents objects and collections hierarchically.
        fr: |
          Le format hérité est XML, populaire dans les années 1990 et 2000. Il a été largement supplanté par JSON, un format texte moins verbeux qui représente des objets et des collections de façon hiérarchique.
      options:
        a: { en: "Avro stores its records as binary data; it isn't a text format that replaces XML.", fr: "Avro stocke ses enregistrements sous forme de données binaires ; ce n'est pas un format texte qui remplace XML." }
        b: { en: "TSV is delimited text: flat rows of fields separated by tabs, with no hierarchy.", fr: "TSV est du texte délimité : des lignes plates de champs séparés par des tabulations, sans hiérarchie." }
        d: { en: "Parquet is a binary columnar format for analytics, not a text format.", fr: "Parquet est un format binaire en colonnes pour l'analytique, pas un format texte." }
    references:
      - title: Explore file storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-12-03
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's devices send their readings to a central service as files, over a network link with limited bandwidth. Each file must describe the structure of its records, the records must be stored in a compact binary form, and the service always reads complete records, one after another.

        Which file format should Litware use?
      fr: |
        Les appareils de Litware envoient leurs relevés à un service central sous forme de fichiers, sur une liaison réseau à bande passante limitée. Chaque fichier doit décrire la structure de ses enregistrements, les enregistrements doivent être stockés sous une forme binaire compacte, et le service lit toujours des enregistrements complets, l'un après l'autre.

        Quel format de fichier Litware doit-elle utiliser ?
    body:
      options:
        - { id: a, text: CSV }
        - { id: b, text: JSON }
        - { id: c, text: Parquet }
        - { id: d, text: Avro }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Avro is a row-based format: each file has a header, stored as JSON, that describes the structure of the data, and the records are stored as binary data. It compresses data well and minimizes storage and network bandwidth requirements, and its row-based layout suits a service that reads whole records.
        fr: |
          Avro est un format orienté ligne : chaque fichier a un en-tête, stocké en JSON, qui décrit la structure des données, et les enregistrements sont stockés en binaire. Il compresse bien les données et réduit les besoins en stockage et en bande passante réseau, et sa disposition par ligne convient à un service qui lit des enregistrements entiers.
      options:
        a: { en: "CSV is human-readable text, not a compact binary form.", fr: "CSV est du texte lisible par l'homme, pas une forme binaire compacte." }
        b: { en: "JSON is a text format; it doesn't store the records in binary form.", fr: "JSON est un format texte ; il ne stocke pas les enregistrements sous forme binaire." }
        c: { en: "Parquet is columnar: it is optimized for reading selected columns of large files, not for reading complete records one after another.", fr: "Parquet est en colonnes : il est optimisé pour lire certaines colonnes de gros fichiers, pas pour lire des enregistrements complets l'un après l'autre." }
    references:
      - title: Explore file storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys uses Microsoft Fabric for data engineering, data warehousing and Power BI reports. Nobody at Wingtip Toys has provisioned a storage account or a database for these workloads.

        Where is the data of these workloads stored?
      fr: |
        Wingtip Toys utilise Microsoft Fabric pour l'ingénierie des données, l'entreposage de données et les rapports Power BI. Personne chez Wingtip Toys n'a provisionné de compte de stockage ni de base de données pour ces charges de travail.

        Où les données de ces charges de travail sont-elles stockées ?
    body:
      options:
        - { id: a, text: { en: "In OneLake, a data lake that is provided automatically", fr: "Dans OneLake, un lac de données fourni automatiquement" } }
        - { id: b, text: { en: "In an Azure Files share that each workspace mounts", fr: "Dans un partage Azure Files que chaque espace de travail monte" } }
        - { id: c, text: { en: "In Azure Table storage, as key-value entities", fr: "Dans le Stockage Table Azure, sous forme d'entités clé-valeur" } }
        - { id: d, text: { en: "In Azure Cosmos DB, as JSON documents", fr: "Dans Azure Cosmos DB, sous forme de documents JSON" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft Fabric is a software as a service (SaaS) analytics platform: its workloads run on top of one shared storage layer called OneLake. Microsoft runs the infrastructure, so the customer creates workspaces and items without provisioning any storage.
        fr: |
          Microsoft Fabric est une plateforme d'analytique fournie sous forme de logiciel en tant que service (SaaS) : ses charges de travail reposent sur une couche de stockage partagée unique appelée OneLake. Microsoft gère l'infrastructure : le client crée des espaces de travail et des éléments sans provisionner de stockage.
      options:
        b: { en: "Azure Files provides network file shares in an Azure Storage account, which someone would have to provision; Fabric doesn't store its data there.", fr: "Azure Files fournit des partages de fichiers réseau dans un compte de Stockage Azure, qu'il faudrait provisionner ; Fabric n'y stocke pas ses données." }
        c: { en: "Azure Table storage is key-value storage of an Azure Storage account for applications, not the storage layer of Fabric.", fr: "Le Stockage Table Azure est un stockage clé-valeur d'un compte de Stockage Azure pour les applications, pas la couche de stockage de Fabric." }
        d: { en: "Azure Cosmos DB is a separate global-scale NoSQL database service that must be provisioned; it isn't where Fabric keeps its data.", fr: "Azure Cosmos DB est un service de base de données NoSQL distinct, à l'échelle mondiale, qu'il faut provisionner ; ce n'est pas là que Fabric conserve ses données." }
    references:
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-12-05
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has an Azure Storage account named **stadatum**. A new application must store scanned documents, provide a file share that Windows users map as a network drive, and store small records that each consist of a key and a value, which the application reads and writes quickly.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un compte de Stockage Azure nommé **stadatum**. Une nouvelle application doit stocker des documents numérisés, fournir un partage de fichiers que les utilisateurs Windows mappent comme lecteur réseau, et stocker de petits enregistrements composés chacun d'une clé et d'une valeur, que l'application lit et écrit rapidement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The three requirements can be met by services of stadatum.", fr: "Les trois exigences peuvent être satisfaites par des services de stadatum." }
        - id: s2
          text: { en: "The scanned documents should be stored in the tables of stadatum.", fr: "Les documents numérisés doivent être stockés dans les tables de stadatum." }
        - id: s3
          text: { en: "The key-value records require Azure Cosmos DB, because an Azure Storage account stores only files.", fr: "Les enregistrements clé-valeur exigent Azure Cosmos DB, car un compte de Stockage Azure ne stocke que des fichiers." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          One Azure Storage account provides blob containers, file shares and tables. Scanned documents are binary files, which go to blob containers; Azure Files provides the network file share; and the tables provide key-value storage for applications that read and write values quickly.
        fr: |
          Un même compte de Stockage Azure fournit des conteneurs d'objets blob, des partages de fichiers et des tables. Les documents numérisés sont des fichiers binaires, qui vont dans des conteneurs d'objets blob ; Azure Files fournit le partage de fichiers réseau ; et les tables offrent un stockage clé-valeur aux applications qui lisent et écrivent rapidement des valeurs.
      options:
        s2: { en: "Tables store key-value data; scalable, cost-effective storage of binary files is the role of blob containers.", fr: "Les tables stockent des données clé-valeur ; le stockage scalable et économique de fichiers binaires est le rôle des conteneurs d'objets blob." }
        s3: { en: "An Azure Storage account also provides tables for key-value data, so no other service is needed.", fr: "Un compte de Stockage Azure fournit aussi des tables pour les données clé-valeur : aucun autre service n'est nécessaire." }
    references:
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The data platform of Fabrikam uses several file formats:

        - A legacy billing system exports invoices as XML files.
        - Devices send telemetry as Avro files.
        - The data lake stores the sales history as Parquet files, which contain nested data such as the lines of each order.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        La plateforme de données de Fabrikam utilise plusieurs formats de fichiers :

        - Un système de facturation hérité exporte les factures sous forme de fichiers XML.
        - Des appareils envoient leur télémétrie sous forme de fichiers Avro.
        - Le lac de données stocke l'historique des ventes sous forme de fichiers Parquet, qui contiennent des données imbriquées comme les lignes de chaque commande.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Parquet can store the nested order lines efficiently and compress them.", fr: "Parquet peut stocker efficacement les lignes de commande imbriquées et les compresser." }
        - id: s2
          text: { en: "Exporting the invoices as JSON instead of XML would make the files more verbose.", fr: "Exporter les factures en JSON plutôt qu'en XML rendrait les fichiers plus verbeux." }
        - id: s3
          text: { en: "An engineer can read the telemetry records of an Avro file in a text editor, because the header of the file is stored as JSON.", fr: "Un ingénieur peut lire les enregistrements de télémétrie d'un fichier Avro dans un éditeur de texte, car l'en-tête du fichier est stocké en JSON." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Parquet specializes in storing and processing nested data types efficiently and supports efficient compression and encoding. XML has largely been superseded by JSON precisely because JSON is less verbose. In an Avro file only the header, which describes the structure, is JSON; the records themselves are stored as binary data.
        fr: |
          Parquet est spécialisé dans le stockage et le traitement efficaces des types de données imbriqués et prend en charge des schémas de compression et d'encodage efficaces. XML a été largement supplanté par JSON justement parce que JSON est moins verbeux. Dans un fichier Avro, seul l'en-tête, qui décrit la structure, est en JSON ; les enregistrements eux-mêmes sont stockés en binaire.
      options:
        s2: { en: "JSON is the less verbose of the two formats: moving from XML to JSON usually makes the files shorter, not longer.", fr: "JSON est le moins verbeux des deux formats : passer de XML à JSON raccourcit en général les fichiers au lieu de les allonger." }
        s3: { en: "The JSON header only describes the structure; the records are binary blocks that an application must decode.", fr: "L'en-tête JSON ne fait que décrire la structure ; les enregistrements sont des blocs binaires qu'une application doit décoder." }
    references:
      - title: Explore file storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso is designing data stores for the three requirements shown in the answer area. Each store must use the simplest type of database that meets its requirement.

        Which type of database should Contoso use for each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso conçoit des magasins de données pour les trois besoins présentés dans la zone de réponse. Chaque magasin doit utiliser le type de base de données le plus simple qui réponde à son besoin.

        Quel type de base de données Contoso doit-elle utiliser pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Invoices and their lines, in which each invoice references a customer whose details are stored only once, queried with SQL: [[inv]]

          Sensor readings in very wide tables, in which each row fills only some groups of logically related columns: [[wide]]

          User preferences, each read and written as a whole by using the user's ID, with no need to look inside a value: [[pref]]
        fr: |
          Factures et leurs lignes, où chaque facture référence un client dont les informations ne sont stockées qu'une fois, interrogées en SQL : [[inv]]

          Relevés de capteurs dans des tables très larges, où chaque ligne ne remplit que certains groupes de colonnes logiquement liées : [[wide]]

          Préférences d'utilisateur, chacune lue et écrite en entier à l'aide de l'ID de l'utilisateur, sans besoin de regarder à l'intérieur d'une valeur : [[pref]]
      slots:
        - id: inv
          options:
            - { id: rel, text: { en: "Relational database", fr: "Base de données relationnelle" } }
            - { id: kv, text: { en: "Key-value database", fr: "Base de données clé-valeur" } }
            - { id: doc, text: { en: "Document database", fr: "Base de données de documents" } }
            - { id: cf, text: { en: "Column family database", fr: "Base de données de familles de colonnes" } }
            - { id: graph, text: { en: "Graph database", fr: "Base de données de graphes" } }
        - id: wide
          options:
            - { id: rel, text: { en: "Relational database", fr: "Base de données relationnelle" } }
            - { id: kv, text: { en: "Key-value database", fr: "Base de données clé-valeur" } }
            - { id: doc, text: { en: "Document database", fr: "Base de données de documents" } }
            - { id: cf, text: { en: "Column family database", fr: "Base de données de familles de colonnes" } }
            - { id: graph, text: { en: "Graph database", fr: "Base de données de graphes" } }
        - id: pref
          options:
            - { id: rel, text: { en: "Relational database", fr: "Base de données relationnelle" } }
            - { id: kv, text: { en: "Key-value database", fr: "Base de données clé-valeur" } }
            - { id: doc, text: { en: "Document database", fr: "Base de données de documents" } }
            - { id: cf, text: { en: "Column family database", fr: "Base de données de familles de colonnes" } }
            - { id: graph, text: { en: "Graph database", fr: "Base de données de graphes" } }
    answer:
      values: { inv: rel, wide: cf, pref: kv }
    explanation:
      correct:
        en: |
          Tables whose rows reference other rows through keys, with each customer stored once (normalization) and SQL queries, describe a relational database. Rows and columns in which the columns are divided into groups of related columns describe a column family database. A unique key with a value that is always read and written as a whole is the simplest case: a key-value database.
        fr: |
          Des tables dont les lignes en référencent d'autres par des clés, chaque client n'étant stocké qu'une fois (normalisation), avec des requêtes SQL, décrivent une base de données relationnelle. Des lignes et des colonnes dont les colonnes sont réparties en groupes de colonnes liées décrivent une base de données de familles de colonnes. Une clé unique associée à une valeur toujours lue et écrite en entier est le cas le plus simple : une base de données clé-valeur.
      options:
        doc: { en: "A document database parses and queries the JSON inside each value; the preferences never need that, so a key-value database is simpler.", fr: "Une base de données de documents analyse et interroge le JSON de chaque valeur ; les préférences n'en ont jamais besoin, une base de données clé-valeur est donc plus simple." }
        graph: { en: "A graph database stores nodes and the links between them; none of the requirements is about following relationships.", fr: "Une base de données de graphes stocke des nœuds et les liens entre eux ; aucun des besoins ne consiste à suivre des relations." }
    references:
      - title: Explore databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-12-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys uses two databases:

        - A document database that stores the product catalog as JSON documents. The products of different categories have different attributes.
        - A normalized relational database that stores the customers and their orders.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise deux bases de données :

        - Une base de données de documents qui stocke le catalogue de produits sous forme de documents JSON. Les produits des différentes catégories ont des attributs différents.
        - Une base de données relationnelle normalisée qui stocke les clients et leurs commandes.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The catalog database can filter the products on a field inside their documents.", fr: "La base de données du catalogue peut filtrer les produits sur un champ de leurs documents." } }
        - { id: b, text: { en: "The catalog database is called NoSQL because non-relational databases forbid every variant of SQL.", fr: "La base de données du catalogue est dite NoSQL parce que les bases de données non relationnelles interdisent toute variante de SQL." } }
        - { id: c, text: { en: "The catalog database requires every product document to contain the same set of fields.", fr: "La base de données du catalogue exige que chaque document de produit contienne le même jeu de champs." } }
        - { id: d, text: { en: "The SQL written for the orders database is similar to the SQL of other relational systems.", fr: "Le SQL écrit pour la base de données des commandes ressemble au SQL des autres systèmes relationnels." } }
        - { id: e, text: { en: "The orders database stores a copy of the customer's details in each order of that customer.", fr: "La base de données des commandes stocke une copie des informations du client dans chaque commande de ce client." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A document database is a form of key-value database in which the value is a JSON document that the system is optimized to parse and query, so it can filter on fields inside the documents. SQL is based on an ANSI standard, so the SQL of one relational database system is similar to that of the others.
        fr: |
          Une base de données de documents est une forme de base de données clé-valeur dans laquelle la valeur est un document JSON que le système est optimisé pour analyser et interroger : elle peut donc filtrer sur des champs des documents. SQL est fondé sur une norme ANSI : le SQL d'un système de base de données relationnelle ressemble donc à celui des autres.
      options:
        b: { en: "NoSQL only means that the data isn't organized in a relational schema; some non-relational databases support a variant of SQL.", fr: "NoSQL signifie seulement que les données ne sont pas organisées selon un schéma relationnel ; certaines bases de données non relationnelles prennent en charge une variante de SQL." }
        c: { en: "A document database applies no relational schema, so documents of the same collection can have different fields.", fr: "Une base de données de documents n'applique pas de schéma relationnel : les documents d'une même collection peuvent avoir des champs différents." }
        e: { en: "In a normalized database, the customer's details are stored once and each order references the customer through its primary key.", fr: "Dans une base de données normalisée, les informations du client sont stockées une seule fois et chaque commande référence le client par sa clé primaire." }
    references:
      - title: Explore databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-12-09
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam is building a recommendation feature for its online store. Customers and products must be stored with relationships such as *bought* and *viewed*, and the feature must follow these relationships from a customer to products and then to other customers. The data store must be a managed Azure service that operates at global scale.

        To complete the sentence, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam développe une fonctionnalité de recommandation pour sa boutique en ligne. Les clients et les produits doivent être stockés avec des relations comme *bought* et *viewed*, et la fonctionnalité doit suivre ces relations d'un client vers des produits, puis vers d'autres clients. Le magasin de données doit être un service Azure managé qui fonctionne à l'échelle mondiale.

        Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Fabrikam should store the data in a [[kind]] hosted in [[svc]].
        fr: |
          Fabrikam doit stocker les données dans une [[kind]] hébergée dans [[svc]].
      slots:
        - id: kind
          options:
            - { id: rel, text: { en: "relational database", fr: "base de données relationnelle" } }
            - { id: kv, text: { en: "key-value database", fr: "base de données clé-valeur" } }
            - { id: cf, text: { en: "column family database", fr: "base de données de familles de colonnes" } }
            - { id: graph, text: { en: "graph database", fr: "base de données de graphes" } }
        - id: svc
          options:
            - { id: files, text: Azure Files }
            - { id: table, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
            - { id: cosmos, text: Azure Cosmos DB }
            - { id: adls, text: Azure Data Lake Storage }
    answer:
      values: { kind: graph, svc: cosmos }
    explanation:
      correct:
        en: |
          A graph database stores entities as nodes with links that define the relationships between them, which suits following *bought* and *viewed* links from node to node. Azure Cosmos DB is the global-scale non-relational database service of Azure, and it supports graphs as well as JSON documents, key-value pairs and column families.
        fr: |
          Une base de données de graphes stocke les entités sous forme de nœuds reliés par des liens qui définissent leurs relations, ce qui convient pour suivre les liens *bought* et *viewed* de nœud en nœud. Azure Cosmos DB est le service Azure de base de données non relationnelle à l'échelle mondiale, et il prend en charge les graphes ainsi que les documents JSON, les paires clé-valeur et les familles de colonnes.
      options:
        rel: { en: "Relational tables can store relationships through keys, but a graph database is the type designed for following links between entities.", fr: "Des tables relationnelles peuvent stocker des relations par des clés, mais la base de données de graphes est le type conçu pour suivre les liens entre entités." }
        table: { en: "Azure Table storage provides key-value storage in an Azure Storage account; it doesn't store nodes and links.", fr: "Le Stockage Table Azure fournit un stockage clé-valeur dans un compte de Stockage Azure ; il ne stocke pas de nœuds ni de liens." }
        adls: { en: "Azure Data Lake Storage stores files in folders for analytics; it isn't a database that follows relationships.", fr: "Azure Data Lake Storage stocke des fichiers dans des dossiers pour l'analytique ; ce n'est pas une base de données qui suit des relations." }
    references:
      - title: Explore databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso is moving four workloads to Azure. Their requirements are listed in the answer area.

        Which Azure data store should Contoso use for each workload? To answer, drag the appropriate data stores to the correct workloads. Each data store may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso migre quatre charges de travail vers Azure. Leurs exigences sont listées dans la zone de réponse.

        Quel magasin de données Azure Contoso doit-elle utiliser pour chaque charge de travail ? Pour répondre, faites glisser les magasins de données appropriés vers les charges de travail correspondantes. Chaque magasin de données peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sqldb, text: Azure SQL Database }
        - { id: mysql, text: { en: "Azure Database for MySQL", fr: "Azure Database pour MySQL" } }
        - { id: cosmos, text: Azure Cosmos DB }
        - { id: table, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
        - { id: files, text: Azure Files }
        - { id: adls, text: Azure Data Lake Storage }
      targets:
        - id: t1
          text: { en: "Order processing: transactional data in relational tables, on the SQL Server database engine, as a fully managed PaaS database", fr: "Traitement des commandes : données transactionnelles dans des tables relationnelles, sur le moteur de base de données SQL Server, en base de données PaaS entièrement managée" }
        - id: t2
          text: { en: "Community website: relational data of an application built on an open-source database engine that runs MySQL today", fr: "Site communautaire : données relationnelles d'une application construite sur un moteur de base de données open source qui exécute MySQL aujourd'hui" }
        - id: t3
          text: { en: "Mobile game: player profiles stored as JSON documents in a non-relational database that operates at global scale", fr: "Jeu mobile : profils de joueurs stockés sous forme de documents JSON dans une base de données non relationnelle qui fonctionne à l'échelle mondiale" }
        - id: t4
          text: { en: "Analytics: raw data files organized in folders of a distributed file system, processed by large-scale analytics", fr: "Analytique : fichiers de données brutes organisés dans les dossiers d'un système de fichiers distribué, traités par une analytique à grande échelle" }
    answer:
      mapping: { t1: sqldb, t2: mysql, t3: cosmos, t4: adls }
    explanation:
      correct:
        en: |
          Azure SQL Database is the fully managed PaaS database of the Azure SQL family, based on the SQL Server engine. Azure Database for MySQL hosts relational databases on the open-source MySQL engine. Azure Cosmos DB is the global-scale non-relational database for JSON documents and other models. A data lake on Azure is Blob Storage with a hierarchical namespace, Azure Data Lake Storage, which organizes files in folders of a distributed file system.
        fr: |
          Azure SQL Database est la base de données PaaS entièrement managée de la famille Azure SQL, fondée sur le moteur SQL Server. Azure Database pour MySQL héberge des bases de données relationnelles sur le moteur open source MySQL. Azure Cosmos DB est la base de données non relationnelle à l'échelle mondiale pour les documents JSON et d'autres modèles. Un lac de données sur Azure est un Stockage Blob avec un espace de noms hiérarchique, Azure Data Lake Storage, qui organise les fichiers dans les dossiers d'un système de fichiers distribué.
      options:
        table: { en: "Azure Table storage is key-value storage inside an Azure Storage account; it isn't the global-scale document database that the game requires.", fr: "Le Stockage Table Azure est un stockage clé-valeur dans un compte de Stockage Azure ; ce n'est pas la base de données de documents à l'échelle mondiale dont le jeu a besoin." }
        files: { en: "Azure Files has folders too, but it provides network file shares for users and applications, not the distributed file system of a data lake for analytics.", fr: "Azure Files a aussi des dossiers, mais il fournit des partages de fichiers réseau aux utilisateurs et aux applications, pas le système de fichiers distribué d'un lac de données pour l'analytique." }
    references:
      - title: Identify data services
        url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
      - title: Introduction to Azure Data Lake Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
