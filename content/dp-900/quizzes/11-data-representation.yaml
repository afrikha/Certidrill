chapter: 11-data-representation
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso stores its sales in a table in which every sale has the same columns. Reports filter, sort and total the sales by using SQL.

        Which characteristic of structured data makes these operations straightforward?
      fr: |
        Contoso stocke ses ventes dans une table où toutes les ventes ont les mêmes colonnes. Des rapports filtrent, trient et totalisent les ventes en SQL.

        Quelle caractéristique des données structurées rend ces opérations simples ?
    body:
      options:
        - { id: a, text: { en: "Every record has the same fields, so the shape of the data is known in advance.", fr: "Tous les enregistrements ont les mêmes champs : la forme des données est donc connue à l'avance." } }
        - { id: b, text: { en: "Every record carries the names of its fields together with their values.", fr: "Chaque enregistrement porte les noms de ses champs avec leurs valeurs." } }
        - { id: c, text: { en: "Every record is stored as raw binary data that the reports interpret.", fr: "Chaque enregistrement est stocké sous forme de données binaires brutes que les rapports interprètent." } }
        - { id: d, text: { en: "Every record is a numerical representation of the meaning of a sale.", fr: "Chaque enregistrement est une représentation numérique du sens d'une vente." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Structured data adheres to a fixed schema: all the records have the same fields, most often as the columns of a table. Because the shape of the data is known in advance, a query can name the columns to filter on, sort by or aggregate.
        fr: |
          Les données structurées respectent un schéma fixe : tous les enregistrements ont les mêmes champs, le plus souvent sous forme de colonnes d'une table. Comme la forme des données est connue à l'avance, une requête peut nommer les colonnes sur lesquelles filtrer, trier ou agréger.
      options:
        b: { en: "Carrying the field names in each item is how semi-structured data such as JSON lets items differ; in a table, the names are defined once by the schema.", fr: "Porter les noms de champ dans chaque élément est la façon dont les données semi-structurées comme JSON permettent aux éléments de différer ; dans une table, les noms sont définis une seule fois par le schéma." }
        c: { en: "Raw binary data that an application must interpret describes unstructured files such as images, not the rows of a table.", fr: "Des données binaires brutes qu'une application doit interpréter décrivent des fichiers non structurés comme des images, pas les lignes d'une table." }
        d: { en: "A numerical representation of the meaning of content is vector data (embeddings), which AI applications use to find similar content.", fr: "Une représentation numérique du sens d'un contenu, ce sont des données vectorielles (incorporations), que les applications d'IA utilisent pour trouver des contenus proches." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-11-02
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders keeps thousands of supplier invoices as scanned images. The finance team wants to total the amounts of the invoices.

        What must happen before the amounts can be totaled?
      fr: |
        Northwind Traders conserve des milliers de factures de fournisseurs sous forme d'images numérisées. L'équipe financière veut totaliser les montants des factures.

        Que faut-il faire avant de pouvoir totaliser les montants ?
    body:
      options:
        - { id: a, text: { en: "Each invoice must be given a primary key that other tables can reference.", fr: "Chaque facture doit recevoir une clé primaire que d'autres tables peuvent référencer." } }
        - { id: b, text: { en: "The images must be stored in a relational database before they are queried.", fr: "Les images doivent être stockées dans une base de données relationnelle avant d'être interrogées." } }
        - { id: c, text: { en: "The content of each image must be analyzed to extract the amount it shows.", fr: "Le contenu de chaque image doit être analysé pour en extraire le montant indiqué." } }
        - { id: d, text: { en: "The application must read the field names that each image stores with its values.", fr: "L'application doit lire les noms de champ que chaque image stocke avec ses valeurs." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A scanned image is unstructured data: it contains no fields that a program can read without interpreting the content. The amount must first be extracted by analyzing each image, and only the extracted values can then be filtered or aggregated.
        fr: |
          Une image numérisée est une donnée non structurée : elle ne contient aucun champ qu'un programme pourrait lire sans interpréter le contenu. Il faut d'abord extraire le montant en analysant chaque image ; seules les valeurs extraites peuvent ensuite être filtrées ou agrégées.
      options:
        a: { en: "A key identifies an item, but it doesn't make the amount inside the image readable.", fr: "Une clé identifie un élément, mais elle ne rend pas lisible le montant contenu dans l'image." }
        b: { en: "Moving a file into a database doesn't change its content: the image still has no fields to total.", fr: "Déplacer un fichier dans une base de données ne change pas son contenu : l'image n'a toujours aucun champ à totaliser." }
        d: { en: "Named fields stored with their values are a feature of semi-structured data such as JSON; an image has no fields.", fr: "Des champs nommés stockés avec leurs valeurs sont une caractéristique des données semi-structurées comme JSON ; une image n'a pas de champs." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum records sales orders. Each order has a header (number, date, customer) and a list of order lines, and the number of lines differs from one order to another. Each order must be kept as a single item from which an application can read every value, including the quantity of each line, without interpreting free text.

        Which representation meets these requirements?
      fr: |
        Adatum enregistre des commandes. Chaque commande a un en-tête (numéro, date, client) et une liste de lignes de commande, et le nombre de lignes diffère d'une commande à l'autre. Chaque commande doit être conservée comme un seul élément dont une application peut lire chaque valeur, y compris la quantité de chaque ligne, sans interpréter de texte libre.

        Quelle représentation répond à ces exigences ?
    body:
      options:
        - { id: a, text: { en: "A table row that has a fixed number of columns for the lines", fr: "Une ligne de table qui a un nombre fixe de colonnes pour les lignes de commande" } }
        - { id: b, text: { en: "A JSON document in which a field holds a collection of line objects", fr: "Un document JSON dans lequel un champ contient une collection d'objets ligne" } }
        - { id: c, text: { en: "A text document that describes each order line in a sentence", fr: "Un document texte qui décrit chaque ligne de commande par une phrase" } }
        - { id: d, text: { en: "An image of the printed order, named after the order number", fr: "Une image de la commande imprimée, nommée d'après le numéro de commande" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In semi-structured data such as JSON, a field can contain another object or a collection of values, which a single row of a table can't do. The order document holds its header fields and a collection of lines, each with named fields such as the quantity, whatever the number of lines.
        fr: |
          Dans des données semi-structurées comme JSON, un champ peut contenir un autre objet ou une collection de valeurs, ce qu'une seule ligne de table ne peut pas faire. Le document de commande contient les champs de l'en-tête et une collection de lignes, chacune avec des champs nommés comme la quantité, quel que soit le nombre de lignes.
      options:
        a: { en: "A fixed number of columns can't fit a number of lines that differs from one order to another.", fr: "Un nombre fixe de colonnes ne peut pas convenir à un nombre de lignes qui diffère d'une commande à l'autre." }
        c: { en: "A text document is unstructured: the application would have to interpret the sentences to find each quantity.", fr: "Un document texte est non structuré : l'application devrait interpréter les phrases pour trouver chaque quantité." }
        d: { en: "An image is unstructured data; reading the quantities would require analyzing its content.", fr: "Une image est une donnée non structurée ; lire les quantités exigerait d'analyser son contenu." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-11-04
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso stores its customers in a table of a relational database. Every customer row has the columns CustomerID, Name and City. Contoso stores its suppliers as JSON documents, and some suppliers have fields that the other suppliers don't have.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso stocke ses clients dans une table d'une base de données relationnelle. Chaque ligne de client a les colonnes CustomerID, Name et City. Contoso stocke ses fournisseurs sous forme de documents JSON, et certains fournisseurs ont des champs que les autres n'ont pas.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          In the customer table, the names of the fields are defined [[tbl]]. In the supplier documents, the names of the fields are stored [[doc]].
        fr: |
          Dans la table des clients, les noms des champs sont définis [[tbl]]. Dans les documents des fournisseurs, les noms des champs sont stockés [[doc]].
      slots:
        - id: tbl
          options:
            - { id: row, text: { en: "in each row, next to each value", fr: "dans chaque ligne, à côté de chaque valeur" } }
            - { id: schema, text: { en: "once, in the schema that all the rows share", fr: "une seule fois, dans le schéma commun à toutes les lignes" } }
            - { id: file, text: { en: "in a separate document for each row", fr: "dans un document distinct pour chaque ligne" } }
        - id: doc
          options:
            - { id: shared, text: { en: "once, in a schema that all the documents share", fr: "une seule fois, dans un schéma commun à tous les documents" } }
            - { id: table, text: { en: "in a column of the customer table", fr: "dans une colonne de la table des clients" } }
            - { id: each, text: { en: "in each document, together with the values", fr: "dans chaque document, avec les valeurs" } }
    answer:
      values: { tbl: schema, doc: each }
    explanation:
      correct:
        en: |
          Structured data adheres to a fixed schema: the columns of the table are defined once and every row has them. In semi-structured data such as JSON, each item carries the names of its fields with their values, which is why two documents of the same collection can have different fields.
        fr: |
          Les données structurées respectent un schéma fixe : les colonnes de la table sont définies une seule fois et toutes les lignes les ont. Dans des données semi-structurées comme JSON, chaque élément porte les noms de ses champs avec leurs valeurs ; c'est pourquoi deux documents de la même collection peuvent avoir des champs différents.
      options:
        row: { en: "A row holds only values; the column names belong to the schema of the table.", fr: "Une ligne ne contient que des valeurs ; les noms de colonnes appartiennent au schéma de la table." }
        shared: { en: "A shared schema would force every supplier to have the same fields, which semi-structured data doesn't require.", fr: "Un schéma commun obligerait tous les fournisseurs à avoir les mêmes champs, ce que les données semi-structurées n'exigent pas." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-11-05
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam stores the profiles of its online shoppers as JSON documents. Some profiles contain a loyalty number, others list several delivery addresses or a preferred language, and the marketing team adds new kinds of fields to recent profiles every month.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam stocke les profils de ses acheteurs en ligne sous forme de documents JSON. Certains profils contiennent un numéro de fidélité, d'autres listent plusieurs adresses de livraison ou une langue préférée, et l'équipe marketing ajoute chaque mois de nouveaux types de champs aux profils récents.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The profiles can be kept in files or in a non-relational database that stores documents.", fr: "Les profils peuvent être conservés dans des fichiers ou dans une base de données non relationnelle qui stocke des documents." }
        - id: s2
          text: { en: "Before the profiles can be stored, they must be given a fixed schema that every profile follows.", fr: "Avant de pouvoir être stockés, les profils doivent recevoir un schéma fixe que tous les profils respectent." }
        - id: s3
          text: { en: "The profiles are unstructured data, because no table defines their fields.", fr: "Les profils sont des données non structurées, car aucune table ne définit leurs champs." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The profiles are semi-structured data: they have named fields, but the fields vary from one profile to another. Such data is typically kept in files or in a non-relational database that stores documents, with no fixed schema to define first.
        fr: |
          Les profils sont des données semi-structurées : ils ont des champs nommés, mais ces champs varient d'un profil à l'autre. Ce type de données est en général conservé dans des fichiers ou dans une base de données non relationnelle qui stocke des documents, sans schéma fixe à définir au préalable.
      options:
        s2: { en: "Semi-structured data allows variation between items; imposing a fixed schema would make it structured data and remove that flexibility.", fr: "Les données semi-structurées autorisent des variations entre éléments ; imposer un schéma fixe en ferait des données structurées et supprimerait cette souplesse." }
        s3: { en: "Unstructured data has no fields at all; JSON profiles have named fields, so they are semi-structured.", fr: "Les données non structurées n'ont aucun champ ; les profils JSON ont des champs nommés, ce sont donc des données semi-structurées." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-11-06
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware receives product catalogs from its suppliers as XML files. The following extract shows one product from each of two suppliers.

        ```text
        <Product sku="A100">
          <Name>Desk lamp</Name>
          <Wattage>9</Wattage>
        </Product>
        <Product sku="B200">
          <Name>Office chair</Name>
          <Material>Mesh</Material>
          <Warranty years="5"/>
        </Product>
        ```

        Each supplier uses its own set of elements to describe its products. How should the catalog data be classified?
      fr: |
        Proseware reçoit de ses fournisseurs des catalogues de produits sous forme de fichiers XML. L'extrait suivant montre un produit de chacun de deux fournisseurs.

        ```text
        <Product sku="A100">
          <Name>Desk lamp</Name>
          <Wattage>9</Wattage>
        </Product>
        <Product sku="B200">
          <Name>Office chair</Name>
          <Material>Mesh</Material>
          <Warranty years="5"/>
        </Product>
        ```

        Chaque fournisseur utilise son propre jeu d'éléments pour décrire ses produits. Comment les données des catalogues doivent-elles être classées ?
    body:
      options:
        - { id: a, text: { en: "Structured data, because a tag names every element of every product", fr: "Données structurées, car une balise nomme chaque élément de chaque produit" } }
        - { id: b, text: { en: "Unstructured data, because the file is a text document, not a table", fr: "Données non structurées, car le fichier est un document texte, pas une table" } }
        - { id: c, text: { en: "Unstructured data, because only JSON can represent semi-structured data", fr: "Données non structurées, car seul JSON peut représenter des données semi-structurées" } }
        - { id: d, text: { en: "Semi-structured data, because named elements vary between the products", fr: "Données semi-structurées, car les éléments nommés varient d'un produit à l'autre" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The category depends on the structure of the data, not on its format. Each product has named elements, so the data has a structure, but the set of elements differs from one product to another: that is semi-structured data. JSON is only the most common way to represent it; XML elements can vary in the same way.
        fr: |
          La catégorie dépend de la structure des données, pas de leur format. Chaque produit a des éléments nommés : les données ont donc une structure, mais le jeu d'éléments diffère d'un produit à l'autre, ce qui correspond à des données semi-structurées. JSON n'est que la façon la plus courante de les représenter ; des éléments XML peuvent varier de la même manière.
      options:
        a: { en: "Named elements aren't enough for structured data: all the products would also need the same fields, which they don't have.", fr: "Des éléments nommés ne suffisent pas pour des données structurées : tous les produits devraient aussi avoir les mêmes champs, ce qui n'est pas le cas." }
        b: { en: "Being text doesn't make data unstructured; these files contain named elements that a program can read.", fr: "Être du texte ne rend pas des données non structurées ; ces fichiers contiennent des éléments nommés qu'un programme peut lire." }
        c: { en: "JSON is only one of many ways to represent semi-structured data; the category is defined by the flexible structure.", fr: "JSON n'est qu'une des nombreuses façons de représenter des données semi-structurées ; la catégorie se définit par la structure souple." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
      - title: Explore file storage
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-11-07
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The warehouse application of Northwind Traders stores three kinds of data:

        - A table named **Shipments** with the same columns for every shipment, including a **Notes** column in which employees type free-text remarks.
        - A photo of each pallet, saved as a JPEG file.
        - Tracking events that carriers send as JSON messages. Each carrier sends its own set of fields.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'application d'entrepôt de Northwind Traders stocke trois types de données :

        - Une table nommée **Shipments** avec les mêmes colonnes pour chaque expédition, dont une colonne **Notes** dans laquelle les employés saisissent des remarques en texte libre.
        - Une photo de chaque palette, enregistrée sous forme de fichier JPEG.
        - Des événements de suivi que les transporteurs envoient sous forme de messages JSON. Chaque transporteur envoie son propre jeu de champs.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Shipments is semi-structured data, because the content of the Notes column differs from one shipment to another.", fr: "Shipments contient des données semi-structurées, car le contenu de la colonne Notes diffère d'une expédition à l'autre." }
        - id: s2
          text: { en: "An application can read the fields of a tracking event by their names, whereas a pallet photo must be analyzed to extract information from it.", fr: "Une application peut lire les champs d'un événement de suivi par leurs noms, alors qu'une photo de palette doit être analysée pour en extraire des informations." }
        - id: s3
          text: { en: "If all the carriers agreed on the same set of fields, the tracking events could be stored as rows of a table with a fixed set of columns.", fr: "Si tous les transporteurs adoptaient le même jeu de champs, les événements de suivi pourraient être stockés comme lignes d'une table avec un jeu fixe de colonnes." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          What classifies data is whether its fields are the same for every item, not whether the values differ. Shipments has a fixed schema, so it stays structured even if its Notes values are free text. The tracking events have named fields that vary by carrier (semi-structured), while a photo has no fields and must be analyzed (unstructured). With one agreed set of fields, the events would follow a fixed schema and could become rows of a table.
        fr: |
          Ce qui classe des données, c'est le fait que leurs champs soient les mêmes pour tous les éléments, pas le fait que les valeurs diffèrent. Shipments a un schéma fixe : elle reste structurée même si ses valeurs Notes sont du texte libre. Les événements de suivi ont des champs nommés qui varient selon le transporteur (semi-structurées), alors qu'une photo n'a aucun champ et doit être analysée (non structurées). Avec un jeu de champs commun, les événements suivraient un schéma fixe et pourraient devenir des lignes d'une table.
      options:
        s1: { en: "Every shipment has the same columns: different values in one column don't change the schema, so the table is structured data.", fr: "Toutes les expéditions ont les mêmes colonnes : des valeurs différentes dans une colonne ne changent pas le schéma ; la table contient donc des données structurées." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys has four data requirements, listed in the answer area.

        Which representation should Tailspin Toys use for each requirement? To answer, drag the appropriate representations to the correct requirements. Each representation may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys a quatre besoins de données, listés dans la zone de réponse.

        Quelle représentation Tailspin Toys doit-elle utiliser pour chaque besoin ? Pour répondre, faites glisser les représentations appropriées vers les besoins correspondants. Chaque représentation peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: tbl, text: { en: "A table with a fixed set of columns", fr: "Une table avec un jeu fixe de colonnes" } }
        - { id: json, text: { en: "JSON documents whose fields can vary", fr: "Des documents JSON dont les champs peuvent varier" } }
        - { id: img, text: { en: "Image files", fr: "Des fichiers image" } }
        - { id: vec, text: { en: "Vector embeddings", fr: "Des incorporations vectorielles (embeddings)" } }
        - { id: txt, text: { en: "Free-text documents", fr: "Des documents en texte libre" } }
      targets:
        - id: t1
          text: { en: "Exchange rates: every rate has the same fields (currency pair, date and value), and every record must follow one schema defined in advance", fr: "Taux de change : chaque taux a les mêmes champs (paire de devises, date et valeur), et chaque enregistrement doit suivre un schéma unique défini à l'avance" }
        - id: t2
          text: { en: "Device settings: each device model has its own settings, and new settings must be added without changing a schema", fr: "Paramètres des appareils : chaque modèle d'appareil a ses propres paramètres, et de nouveaux paramètres doivent pouvoir être ajoutés sans modifier de schéma" }
        - id: t3
          text: { en: "Support articles: an AI assistant must find the articles whose meaning is closest to a customer's question", fr: "Articles de support : un assistant d'IA doit trouver les articles dont le sens est le plus proche de la question d'un client" }
        - id: t4
          text: { en: "Delivery receipts: the signed paper receipts must be kept as scanned copies for evidence", fr: "Bons de livraison : les bons papier signés doivent être conservés sous forme de copies numérisées comme preuves" }
    answer:
      mapping: { t1: tbl, t2: json, t3: vec, t4: img }
    explanation:
      correct:
        en: |
          A fixed schema defined in advance is structured data, in a table. Settings that vary by model and grow without a schema change are semi-structured data, such as JSON. To find content with a similar meaning, AI applications use vector data (embeddings), a numerical representation of the content. Scanned copies of paper documents are images, which are unstructured data.
        fr: |
          Un schéma fixe défini à l'avance correspond à des données structurées, dans une table. Des paramètres qui varient selon le modèle et s'enrichissent sans modification de schéma sont des données semi-structurées, comme JSON. Pour trouver des contenus de sens proche, les applications d'IA utilisent des données vectorielles (incorporations), une représentation numérique du contenu. Les copies numérisées de documents papier sont des images, donc des données non structurées.
      options:
        txt: { en: "Free-text documents would keep the articles readable, but finding meaning-based matches relies on embeddings, and a scan produces images, not text.", fr: "Des documents en texte libre garderaient les articles lisibles, mais la recherche par le sens repose sur les incorporations, et une numérisation produit des images, pas du texte." }
        json: { en: "JSON documents don't enforce a schema defined in advance, which the exchange rates require.", fr: "Les documents JSON n'imposent pas de schéma défini à l'avance, ce qu'exigent les taux de change." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-11-09
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank processes the calls to its support center in three stages:

        1. Each call is recorded as an audio file.
        2. A speech service writes the transcript of each call to a text file.
        3. A language service reads each transcript and adds a row to a table named **CallSummary**, which has the columns CallID, CallDate, Duration and Sentiment.

        How should the data of each stage be classified? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank traite les appels de son centre de support en trois étapes :

        1. Chaque appel est enregistré dans un fichier audio.
        2. Un service vocal écrit la transcription de chaque appel dans un fichier texte.
        3. Un service de langage lit chaque transcription et ajoute une ligne à une table nommée **CallSummary**, qui a les colonnes CallID, CallDate, Duration et Sentiment.

        Comment les données de chaque étape doivent-elles être classées ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Stage 1, the audio files: [[rec]]

          Stage 2, the transcripts: [[txt]]

          Stage 3, the rows of CallSummary: [[row]]
        fr: |
          Étape 1, les fichiers audio : [[rec]]

          Étape 2, les transcriptions : [[txt]]

          Étape 3, les lignes de CallSummary : [[row]]
      slots:
        - id: rec
          options:
            - { id: st, text: { en: "Structured data", fr: "Données structurées" } }
            - { id: semi, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
            - { id: un, text: { en: "Unstructured data", fr: "Données non structurées" } }
        - id: txt
          options:
            - { id: st, text: { en: "Structured data", fr: "Données structurées" } }
            - { id: semi, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
            - { id: un, text: { en: "Unstructured data", fr: "Données non structurées" } }
        - id: row
          options:
            - { id: st, text: { en: "Structured data", fr: "Données structurées" } }
            - { id: semi, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
            - { id: un, text: { en: "Unstructured data", fr: "Données non structurées" } }
    answer:
      values: { rec: un, txt: un, row: st }
    explanation:
      correct:
        en: |
          Audio recordings have no specific structure: they are unstructured data. A transcript contains readable words, yet nothing splits its content into fields that are the same for every call, so it stays unstructured. Only the analysis in stage 3 produces data with a fixed schema: rows that all have the same four columns, which is structured data.
        fr: |
          Les enregistrements audio n'ont pas de structure spécifique : ce sont des données non structurées. Une transcription contient des mots lisibles, mais rien ne découpe son contenu en champs identiques pour tous les appels : elle reste non structurée. Seule l'analyse de l'étape 3 produit des données à schéma fixe, des lignes qui ont toutes les quatre mêmes colonnes, c'est-à-dire des données structurées.
      options:
        st: { en: "For the transcripts, readable text isn't structured data: there are no fields shared by every transcript.", fr: "Pour les transcriptions, du texte lisible n'est pas une donnée structurée : aucun champ n'est commun à toutes les transcriptions." }
        semi: { en: "Semi-structured data has named fields that vary between items; neither the audio files nor the transcripts have named fields, and the CallSummary rows all have the same ones.", fr: "Les données semi-structurées ont des champs nommés qui varient d'un élément à l'autre ; ni les fichiers audio ni les transcriptions n'ont de champs nommés, et les lignes de CallSummary ont toutes les mêmes." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-11-10
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The legal department of Litware keeps its signed contracts as PDF files in a blob container. Every contract uses the same headings in the same order.

        An extraction tool reads each contract and writes a JSON document that has the fields contractId, parties and clauses. The clauses field holds a list of clause objects; the number of clauses and the fields of each clause differ from one contract to another. The JSON documents are saved in the same blob container as the PDF files.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le service juridique de Litware conserve ses contrats signés sous forme de fichiers PDF dans un conteneur d'objets blob. Tous les contrats utilisent les mêmes titres dans le même ordre.

        Un outil d'extraction lit chaque contrat et écrit un document JSON qui a les champs contractId, parties et clauses. Le champ clauses contient une liste d'objets clause ; le nombre de clauses et les champs de chaque clause diffèrent d'un contrat à l'autre. Les documents JSON sont enregistrés dans le même conteneur d'objets blob que les fichiers PDF.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The PDF contracts are semi-structured data, because every contract uses the same headings in the same order.", fr: "Les contrats PDF sont des données semi-structurées, car tous les contrats utilisent les mêmes titres dans le même ordre." }
        - id: s2
          text: { en: "The JSON documents are semi-structured data, even though every document has the fields contractId, parties and clauses.", fr: "Les documents JSON sont des données semi-structurées, même si tous les documents ont les champs contractId, parties et clauses." }
        - id: s3
          text: { en: "The JSON documents are unstructured data, because they are saved in the same blob container as the PDF files.", fr: "Les documents JSON sont des données non structurées, car ils sont enregistrés dans le même conteneur d'objets blob que les fichiers PDF." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Headings in a document are part of its content, not fields that a program can read, so the PDF contracts remain unstructured data. The JSON documents share three top-level fields, but the content of clauses varies in size and in fields from one contract to another: the structure varies between instances, which is semi-structured data. The category depends on the data itself, not on where it is stored.
        fr: |
          Les titres d'un document font partie de son contenu ; ce ne sont pas des champs qu'un programme peut lire : les contrats PDF restent donc des données non structurées. Les documents JSON partagent trois champs de premier niveau, mais le contenu de clauses varie en taille et en champs d'un contrat à l'autre : la structure varie d'une instance à l'autre, ce qui correspond à des données semi-structurées. La catégorie dépend des données elles-mêmes, pas de l'endroit où elles sont stockées.
      options:
        s1: { en: "A common layout of headings doesn't give a document fields; reading the contracts still requires interpreting their content.", fr: "Une disposition commune des titres ne donne pas de champs à un document ; lire les contrats exige toujours d'interpréter leur contenu." }
        s3: { en: "Storing files in a blob container doesn't change their category: the JSON documents still have named fields.", fr: "Stocker des fichiers dans un conteneur d'objets blob ne change pas leur catégorie : les documents JSON ont toujours des champs nommés." }
    references:
      - title: Identify data formats
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
