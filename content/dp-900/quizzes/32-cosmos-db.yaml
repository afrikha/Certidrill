chapter: 32-cosmos-db
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A developer at Contoso wants to change which properties Azure Cosmos DB indexes for the items of an order-management application.

        At which level of the Azure Cosmos DB resource model is the indexing policy defined?
      fr: |
        Un développeur de Contoso veut modifier les propriétés qu'Azure Cosmos DB indexe pour les éléments d'une application de gestion des commandes.

        À quel niveau du modèle de ressources d'Azure Cosmos DB la stratégie d'indexation est-elle définie ?
    body:
      options:
        - { id: a, text: { en: "The account", fr: "Le compte" } }
        - { id: b, text: { en: "The database", fr: "La base de données" } }
        - { id: c, text: { en: "The container", fr: "Le conteneur" } }
        - { id: d, text: { en: "The item", fr: "L'élément" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The container is the unit of storage and scaling of Azure Cosmos DB: it carries the partition key, the throughput and the indexing policy. By default, the indexing policy of a container indexes every property of its items automatically.
        fr: |
          Le conteneur est l'unité de stockage et de mise à l'échelle d'Azure Cosmos DB : il porte la clé de partition, le débit et la stratégie d'indexation. Par défaut, la stratégie d'indexation d'un conteneur indexe automatiquement toutes les propriétés de ses éléments.
      options:
        a: { en: "The account is where you choose the API and the Azure regions, not how the items are indexed.", fr: "Le compte est l'endroit où l'on choisit l'API et les régions Azure, pas la façon dont les éléments sont indexés." }
        b: { en: "A database is a logical namespace that groups containers; it can share throughput, but it doesn't hold an indexing policy.", fr: "Une base de données est un espace de noms logique qui regroupe des conteneurs ; elle peut partager du débit, mais elle ne porte pas de stratégie d'indexation." }
        d: { en: "An item is one entity stored in a container; it follows the indexing policy of its container.", fr: "Un élément est une entité stockée dans un conteneur ; il suit la stratégie d'indexation de son conteneur." }
    references:
      - title: "Databases, containers, and items in Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-32-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank wants to detect fraud rings by following the links between accounts, cards, devices and transactions, through several hops.

        Which Azure Cosmos DB API fits this data?
      fr: |
        Woodgrove Bank veut détecter des réseaux de fraude en suivant les liens entre des comptes, des cartes, des appareils et des transactions, sur plusieurs niveaux.

        Quelle API Azure Cosmos DB convient à ces données ?
    body:
      options:
        - { id: a, text: "Azure Cosmos DB for Table" }
        - { id: b, text: "Azure Cosmos DB for Apache Gremlin" }
        - { id: c, text: "Azure Cosmos DB for Apache Cassandra" }
        - { id: d, text: "Azure Cosmos DB for MongoDB" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Cosmos DB for Apache Gremlin stores a graph: entities are vertices (nodes), and the relationships between them are edges. It suits data where relationships matter as much as the data itself, such as fraud detection, recommendations and social networks.
        fr: |
          Azure Cosmos DB for Apache Gremlin stocke un graphe : les entités sont des sommets (nœuds), et les relations entre elles sont des arêtes. Il convient aux données dont les relations comptent autant que les données elles-mêmes, comme la détection des fraudes, les recommandations et les réseaux sociaux.
      options:
        a: { en: "Azure Cosmos DB for Table stores key-value rows found by PartitionKey and RowKey; it has no relationships to traverse.", fr: "Azure Cosmos DB for Table stocke des lignes clé-valeur retrouvées par PartitionKey et RowKey ; il n'a pas de relations à parcourir." }
        c: { en: "Azure Cosmos DB for Apache Cassandra uses a column-family model queried with CQL, not a graph of linked entities.", fr: "Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes interrogé en CQL, pas un graphe d'entités liées." }
        d: { en: "Azure Cosmos DB for MongoDB stores BSON documents; following links across several hops isn't its data model.", fr: "Azure Cosmos DB for MongoDB stocke des documents BSON ; suivre des liens sur plusieurs niveaux n'est pas son modèle de données." }
    references:
      - title: "Identify Azure Cosmos DB APIs"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-32-03
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure Cosmos DB account for a collaborative planning application. The data is replicated to West Europe and Southeast Asia, but every write goes to West Europe, and users in Asia find that saving their changes is slow.

        Each user's writes must be handled by the closest of the two regions. What should Fabrikam configure on the account?
      fr: |
        Fabrikam dispose d'un compte Azure Cosmos DB pour une application de planification collaborative. Les données sont répliquées dans West Europe et Southeast Asia, mais toutes les écritures vont vers West Europe, et les utilisateurs d'Asie trouvent que l'enregistrement de leurs modifications est lent.

        Les écritures de chaque utilisateur doivent être traitées par la plus proche des deux régions. Que doit configurer Fabrikam sur le compte ?
    body:
      options:
        - { id: a, text: { en: "Multi-region writes", fr: "Les écritures multirégions" } }
        - { id: b, text: { en: "Strong as the default consistency level", fr: "Fort (Strong) comme niveau de cohérence par défaut" } }
        - { id: c, text: { en: "The serverless capacity mode", fr: "Le mode de capacité serverless" } }
        - { id: d, text: { en: "A third region that serves reads", fr: "Une troisième région qui sert les lectures" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With global distribution alone, users read from the nearest replica, but writes still go to one region. Enabling multi-region writes makes every region of the account support both writes and reads, so users in Asia also write to their local replica in Southeast Asia, with low latency.
        fr: |
          Avec la seule distribution mondiale, les utilisateurs lisent le réplica le plus proche, mais les écritures vont toujours vers une seule région. Activer les écritures multirégions fait prendre en charge les écritures et les lectures par chaque région du compte : les utilisateurs d'Asie écrivent donc aussi dans leur réplica local de Southeast Asia, avec une faible latence.
      options:
        b: { en: "Strong consistency makes every read return the most recent write; it doesn't move writes closer to the users and tends to increase their latency.", fr: "La cohérence Fort (Strong) fait renvoyer à chaque lecture l'écriture la plus récente ; elle ne rapproche pas les écritures des utilisateurs et tend à augmenter leur latence." }
        c: { en: "A serverless account runs in a single region, so it couldn't even keep a replica in Asia, let alone accept writes there.", fr: "Un compte serverless s'exécute dans une seule région : il ne pourrait même pas conserver un réplica en Asie, et encore moins y accepter des écritures." }
        d: { en: "Another read region only adds a replica to read from; writes would still be sent to West Europe.", fr: "Une autre région de lecture ajoute seulement un réplica à lire ; les écritures seraient toujours envoyées vers West Europe." }
    references:
      - title: "Distribute your data globally with Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-32-04
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        In the resource model of Azure Cosmos DB, an entity that is stored in a container is an item. Each API gives the item the name used by the database it is compatible with.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le modèle de ressources d'Azure Cosmos DB, une entité stockée dans un conteneur est un élément. Chaque API donne à l'élément le nom employé par la base de données avec laquelle elle est compatible.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          In Azure Cosmos DB for MongoDB, an item is [[mongo]].

          In Azure Cosmos DB for Apache Cassandra, an item is [[cass]].

          In Azure Cosmos DB for Apache Gremlin, an item is [[grem]].
        fr: |
          Dans Azure Cosmos DB for MongoDB, un élément est [[mongo]].

          Dans Azure Cosmos DB for Apache Cassandra, un élément est [[cass]].

          Dans Azure Cosmos DB for Apache Gremlin, un élément est [[grem]].
      slots:
        - id: mongo
          options:
            - { id: m-doc, text: { en: "a document", fr: "un document" } }
            - { id: m-row, text: { en: "a row", fr: "une ligne" } }
            - { id: m-node, text: { en: "a node or an edge", fr: "un nœud ou une arête" } }
        - id: cass
          options:
            - { id: c-doc, text: { en: "a document", fr: "un document" } }
            - { id: c-row, text: { en: "a row", fr: "une ligne" } }
            - { id: c-node, text: { en: "a node or an edge", fr: "un nœud ou une arête" } }
        - id: grem
          options:
            - { id: g-doc, text: { en: "a document", fr: "un document" } }
            - { id: g-row, text: { en: "a row", fr: "une ligne" } }
            - { id: g-node, text: { en: "a node or an edge", fr: "un nœud ou une arête" } }
    answer:
      values: { mongo: m-doc, cass: c-row, grem: g-node }
    explanation:
      correct:
        en: |
          Azure Cosmos DB for MongoDB stores documents in BSON. Azure Cosmos DB for Apache Cassandra uses a column-family model in which an item is a row of a table. Azure Cosmos DB for Apache Gremlin stores a graph, so an item is either a node (vertex) or an edge.
        fr: |
          Azure Cosmos DB for MongoDB stocke des documents au format BSON. Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes dans lequel un élément est une ligne d'une table. Azure Cosmos DB for Apache Gremlin stocke un graphe : un élément y est donc soit un nœud (sommet), soit une arête.
    references:
      - title: "Databases, containers, and items in Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-32-05
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware stores about 2 TB of orders in an Azure Cosmos DB container. Most queries read the orders of one customer. Litware compares four properties of the orders:

        | Property | Distinct values | Largest group of orders |
        | --- | --- | --- |
        | `customerId` | About 1,000,000 | A few MB |
        | `country` | 25 | About 200 GB |
        | `status` | 4 | About 900 GB |
        | `currency` | 3 | About 1.2 TB |

        Which property should Litware use as the partition key?
      fr: |
        Litware stocke environ 2 To de commandes dans un conteneur Azure Cosmos DB. La plupart des requêtes lisent les commandes d'un seul client. Litware compare quatre propriétés des commandes :

        | Propriété | Valeurs distinctes | Plus grand groupe de commandes |
        | --- | --- | --- |
        | `customerId` | Environ 1 000 000 | Quelques Mo |
        | `country` | 25 | Environ 200 Go |
        | `status` | 4 | Environ 900 Go |
        | `currency` | 3 | Environ 1,2 To |

        Quelle propriété Litware doit-elle utiliser comme clé de partition ?
    body:
      options:
        - { id: a, text: "`country`" }
        - { id: b, text: "`status`" }
        - { id: c, text: "`customerId`" }
        - { id: d, text: "`currency`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The items that share a partition key value form a logical partition, which holds up to 20 GB. `customerId` has many distinct values and only a few MB per value, so the orders spread across many small logical partitions, and the queries for one customer stay in a single partition.
        fr: |
          Les éléments qui partagent une valeur de clé de partition forment une partition logique, qui contient jusqu'à 20 Go. `customerId` a beaucoup de valeurs distinctes et seulement quelques Mo par valeur : les commandes se répartissent donc entre de nombreuses petites partitions logiques, et les requêtes d'un client restent dans une seule partition.
      options:
        a: { en: "With only 25 values, a country would hold about 200 GB in one logical partition, far above the 20 GB limit.", fr: "Avec seulement 25 valeurs, un pays regrouperait environ 200 Go dans une partition logique, bien au-delà de la limite de 20 Go." }
        b: { en: "Four values create four huge logical partitions that exceed 20 GB; a good key has many distinct values.", fr: "Quatre valeurs créent quatre énormes partitions logiques qui dépassent 20 Go ; une bonne clé a beaucoup de valeurs distinctes." }
        d: { en: "Three values put most of the 2 TB in very few logical partitions, each far above the 20 GB limit.", fr: "Trois valeurs placent l'essentiel des 2 To dans très peu de partitions logiques, chacune bien au-delà de la limite de 20 Go." }
    references:
      - title: "Describe Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys stores the player profiles of a mobile game in an Azure Cosmos DB for NoSQL account. The account uses the serverless capacity mode in the West Europe region, and its default consistency level is Session. A player changes their nickname in the game.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys stocke les profils des joueurs d'un jeu mobile dans un compte Azure Cosmos DB for NoSQL. Le compte utilise le mode de capacité serverless dans la région West Europe, et son niveau de cohérence par défaut est Session. Un joueur modifie son pseudo dans le jeu.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Tailspin Toys can add the East US region to this account so that players in America read from a nearby replica.", fr: "Tailspin Toys peut ajouter la région East US à ce compte pour que les joueurs d'Amérique lisent un réplica proche." }
        - id: s2
          text: { en: "In the same session, the player reads the new nickname right after the change.", fr: "Dans la même session, le joueur lit le nouveau pseudo juste après la modification." }
        - id: s3
          text: { en: "In a different session, another player is guaranteed to read the new nickname right after the change.", fr: "Dans une autre session, un autre joueur a la garantie de lire le nouveau pseudo juste après la modification." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A serverless account runs in a single Azure region, so no other region can be added to it. Session consistency guarantees that a client reads its own writes inside its session, which is why it is the most widely used level. Other sessions get no such guarantee: they may read the old nickname for a short time.
        fr: |
          Un compte serverless s'exécute dans une seule région Azure : aucune autre région ne peut donc y être ajoutée. La cohérence Session garantit qu'un client lit ses propres écritures dans sa session, ce qui en fait le niveau le plus utilisé. Les autres sessions n'ont pas cette garantie : elles peuvent lire l'ancien pseudo pendant un court moment.
      options:
        s1: { en: "Adding regions is a feature of provisioned and autoscale throughput; the serverless mode is limited to one region.", fr: "L'ajout de régions est une fonctionnalité du débit provisionné et de la mise à l'échelle automatique ; le mode serverless est limité à une région." }
        s3: { en: "Only Strong consistency guarantees that every read returns the most recent write for all clients.", fr: "Seule la cohérence Fort (Strong) garantit que chaque lecture renvoie l'écriture la plus récente pour tous les clients." }
    references:
      - title: "Azure Cosmos DB serverless account type"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
      - title: "Consistency levels in Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-32-07
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has an Azure Cosmos DB database that contains 20 containers for internal applications. Each container has low traffic that stays steady all day. The account replicates the data to two Azure regions.

        Northwind Traders needs to reserve as few request units per second (RU/s) as possible for the 20 containers. What should Northwind Traders configure?
      fr: |
        Northwind Traders dispose d'une base de données Azure Cosmos DB qui contient 20 conteneurs pour des applications internes. Chaque conteneur a un trafic faible qui reste régulier toute la journée. Le compte réplique les données dans deux régions Azure.

        Northwind Traders doit réserver le moins d'unités de requête par seconde (RU/s) possible pour les 20 conteneurs. Que doit configurer Northwind Traders ?
    body:
      options:
        - { id: a, text: { en: "The serverless capacity mode for the account", fr: "Le mode de capacité serverless pour le compte" } }
        - { id: b, text: { en: "Provisioned throughput shared at the database level", fr: "Un débit provisionné partagé au niveau de la base de données" } }
        - { id: c, text: { en: "Provisioned throughput dedicated to each container", fr: "Un débit provisionné dédié à chaque conteneur" } }
        - { id: d, text: { en: "Autoscale throughput configured on each container", fr: "Un débit avec mise à l'échelle automatique configuré sur chaque conteneur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Provisioned throughput suits steady, predictable traffic. When it is set on the database, the containers of that database share one amount of RU/s, so 20 low-traffic containers don't each need their own reservation.
        fr: |
          Le débit provisionné convient à un trafic régulier et prévisible. Quand il est défini sur la base de données, les conteneurs de cette base partagent une même quantité de RU/s : 20 conteneurs à faible trafic n'ont donc pas besoin chacun de leur propre réservation.
      options:
        a: { en: "Serverless reserves nothing, but a serverless account runs in a single region and can't replicate to two regions.", fr: "Le mode serverless ne réserve rien, mais un compte serverless s'exécute dans une seule région et ne peut pas répliquer vers deux régions." }
        c: { en: "Dedicated throughput reserves RU/s for every container separately, so the total reserved for 20 containers is higher.", fr: "Le débit dédié réserve des RU/s séparément pour chaque conteneur : le total réservé pour 20 conteneurs est donc plus élevé." }
        d: { en: "Autoscale suits variable traffic; the traffic here is steady, and each container would still have its own maximum to reserve.", fr: "La mise à l'échelle automatique convient à un trafic variable ; ici le trafic est régulier, et chaque conteneur aurait encore son propre maximum à réserver." }
    references:
      - title: "Describe Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
      - title: "Azure Cosmos DB serverless account type"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-32-08
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank creates three Azure Cosmos DB accounts, one for each application below. Each account replicates its data to several Azure regions. For each account, Woodgrove Bank wants the weakest consistency level that meets the requirement of the application, to get the highest availability.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank crée trois comptes Azure Cosmos DB, un pour chacune des applications ci-dessous. Chaque compte réplique ses données dans plusieurs régions Azure. Pour chaque compte, Woodgrove Bank veut le niveau de cohérence le plus faible qui respecte l'exigence de l'application, afin d'obtenir la disponibilité la plus élevée.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The account-balance application, in which every read must return the most recent write, uses [[bal]].

          The fraud dashboard, whose reads may lag behind the writes by at most five minutes, uses [[dash]].

          The news feed of the bank's app, whose reads may be stale and out of order until the replicas converge, uses [[feed]].
        fr: |
          L'application des soldes de comptes, dans laquelle chaque lecture doit renvoyer l'écriture la plus récente, utilise [[bal]].

          Le tableau de bord antifraude, dont les lectures peuvent être en retard sur les écritures de cinq minutes au plus, utilise [[dash]].

          Le fil d'actualités de l'application de la banque, dont les lectures peuvent être périmées et dans le désordre jusqu'à ce que les réplicas convergent, utilise [[feed]].
      slots:
        - id: bal
          options:
            - { id: b-strong, text: { en: "Strong", fr: "Fort (Strong)" } }
            - { id: b-bounded, text: { en: "Bounded staleness", fr: "Obsolescence limitée (Bounded staleness)" } }
            - { id: b-session, text: "Session" }
            - { id: b-prefix, text: { en: "Consistent prefix", fr: "Préfixe cohérent (Consistent prefix)" } }
            - { id: b-eventual, text: { en: "Eventual", fr: "Éventuel (Eventual)" } }
        - id: dash
          options:
            - { id: d-strong, text: { en: "Strong", fr: "Fort (Strong)" } }
            - { id: d-bounded, text: { en: "Bounded staleness", fr: "Obsolescence limitée (Bounded staleness)" } }
            - { id: d-session, text: "Session" }
            - { id: d-prefix, text: { en: "Consistent prefix", fr: "Préfixe cohérent (Consistent prefix)" } }
            - { id: d-eventual, text: { en: "Eventual", fr: "Éventuel (Eventual)" } }
        - id: feed
          options:
            - { id: f-strong, text: { en: "Strong", fr: "Fort (Strong)" } }
            - { id: f-bounded, text: { en: "Bounded staleness", fr: "Obsolescence limitée (Bounded staleness)" } }
            - { id: f-session, text: "Session" }
            - { id: f-prefix, text: { en: "Consistent prefix", fr: "Préfixe cohérent (Consistent prefix)" } }
            - { id: f-eventual, text: { en: "Eventual", fr: "Éventuel (Eventual)" } }
    answer:
      values: { bal: b-strong, dash: d-bounded, feed: f-eventual }
    explanation:
      correct:
        en: |
          Only Strong guarantees that every read returns the most recent write. Bounded staleness lets reads lag behind writes by at most a configured interval, such as five minutes, which is exactly the dashboard's requirement. When neither freshness nor order matters, Eventual is the weakest level and offers the highest availability.
        fr: |
          Seul Fort (Strong) garantit que chaque lecture renvoie l'écriture la plus récente. Obsolescence limitée (Bounded staleness) laisse les lectures en retard sur les écritures d'un intervalle configuré au plus, par exemple cinq minutes, ce qui correspond exactement à l'exigence du tableau de bord. Quand ni la fraîcheur ni l'ordre ne comptent, Éventuel (Eventual) est le niveau le plus faible et offre la disponibilité la plus élevée.
      options:
        d-session: { en: "Session only guarantees that a client reads its own writes; it sets no maximum lag for the dashboard's readers.", fr: "Session garantit seulement qu'un client lit ses propres écritures ; il ne fixe aucun retard maximal pour les lecteurs du tableau de bord." }
        f-prefix: { en: "Consistent prefix keeps the order of the writes, which the news feed doesn't need: Eventual is weaker and more available.", fr: "Préfixe cohérent préserve l'ordre des écritures, ce dont le fil d'actualités n'a pas besoin : Éventuel est plus faible et plus disponible." }
    references:
      - title: "Consistency levels in Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-32-09
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum is moving four workloads of its retail division to Azure. Some of them already run on a database engine, and Adatum wants each one on the Azure data service that fits its data model, its reach and its budget.

        Which service should Adatum use for each workload? To answer, drag the appropriate service to each workload. Each service may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum déplace vers Azure quatre charges de travail de sa division de vente au détail. Certaines s'exécutent déjà sur un moteur de base de données, et Adatum veut placer chacune sur le service de données Azure qui convient à son modèle de données, à sa portée et à son budget.

        Quel service Adatum doit-elle utiliser pour chaque charge de travail ? Pour répondre, faites glisser le service approprié vers chaque charge de travail. Chaque service peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: nosql, text: "Azure Cosmos DB for NoSQL" }
        - { id: mongo, text: "Azure Cosmos DB for MongoDB" }
        - { id: cosmostable, text: "Azure Cosmos DB for Table" }
        - { id: cassandra, text: "Azure Cosmos DB for Apache Cassandra" }
        - { id: tablestorage, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
        - { id: sqldb, text: "Azure SQL Database" }
      targets:
        - id: w-sensors
          text: { en: "Sensor tables of an on-premises Apache Cassandra cluster move to a fully managed service, and the CQL queries must keep working.", fr: "Les tables de capteurs d'un cluster Apache Cassandra local passent à un service entièrement managé, et les requêtes CQL doivent continuer de fonctionner." }
        - id: w-global
          text: { en: "An application written for Azure Table storage must now serve users on three continents and index every property automatically.", fr: "Une application écrite pour le Stockage Table Azure doit désormais servir des utilisateurs sur trois continents et indexer automatiquement toutes les propriétés." }
        - id: w-config
          text: { en: "Configuration rows looked up by PartitionKey and RowKey, in one region, at the lowest cost, next to the blobs of an existing storage account.", fr: "Des lignes de configuration recherchées par PartitionKey et RowKey, dans une seule région, au coût le plus bas, à côté des objets blob d'un compte de stockage existant." }
        - id: w-billing
          text: { en: "A billing system with a fixed schema of related tables, foreign keys and queries that join many tables.", fr: "Un système de facturation avec un schéma fixe de tables liées, des clés étrangères et des requêtes qui joignent de nombreuses tables." }
    answer:
      mapping: { w-sensors: cassandra, w-global: cosmostable, w-config: tablestorage, w-billing: sqldb }
    explanation:
      correct:
        en: |
          Azure Cosmos DB for Apache Cassandra fits teams that migrate a Cassandra workload to a fully managed database and keep CQL. Azure Cosmos DB for Table uses the programming model of Azure Table storage and adds global distribution and automatic indexing of all properties. Plain key-value lookups in one region at low cost stay in Azure Table storage, a service of the storage account. A fixed relational schema with joins points to the Azure SQL family.
        fr: |
          Azure Cosmos DB for Apache Cassandra convient aux équipes qui migrent une charge de travail Cassandra vers une base de données entièrement managée et conservent CQL. Azure Cosmos DB for Table utilise le modèle de programmation du Stockage Table Azure et ajoute la distribution mondiale et l'indexation automatique de toutes les propriétés. Les recherches clé-valeur simples dans une seule région à faible coût restent dans le Stockage Table Azure, un service du compte de stockage. Un schéma relationnel fixe avec des jointures désigne la famille Azure SQL.
      options:
        nosql: { en: "Azure Cosmos DB for NoSQL stores JSON documents queried with a SQL-like syntax; it keeps neither CQL nor the Table storage programming model.", fr: "Azure Cosmos DB for NoSQL stocke des documents JSON interrogés avec une syntaxe proche de SQL ; il ne conserve ni CQL ni le modèle de programmation du Stockage Table." }
        mongo: { en: "Azure Cosmos DB for MongoDB stores BSON documents queried with MQL; none of these workloads uses MongoDB.", fr: "Azure Cosmos DB for MongoDB stocke des documents BSON interrogés en MQL ; aucune de ces charges de travail n'utilise MongoDB." }
    references:
      - title: "Identify Azure Cosmos DB APIs"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
      - title: "Describe Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-32-10
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso is building a retail platform on Azure Cosmos DB with two workloads:

        - A product catalog stored as JSON documents. The developers know SQL and want a SQL-like query syntax.
        - A recommendation engine that traverses the relationships between customers, products and purchases.

        Contoso wants to deploy as few Azure Cosmos DB accounts as possible. What should Contoso deploy?
      fr: |
        Contoso construit une plateforme de vente au détail sur Azure Cosmos DB avec deux charges de travail :

        - Un catalogue de produits stocké sous forme de documents JSON. Les développeurs connaissent SQL et veulent une syntaxe de requête proche de SQL.
        - Un moteur de recommandation qui parcourt les relations entre les clients, les produits et les achats.

        Contoso veut déployer le moins de comptes Azure Cosmos DB possible. Que doit déployer Contoso ?
    body:
      options:
        - { id: a, text: { en: "One account for Azure Cosmos DB for NoSQL, with one container for the catalog and one for the recommendations", fr: "Un compte Azure Cosmos DB for NoSQL, avec un conteneur pour le catalogue et un autre pour les recommandations" } }
        - { id: b, text: { en: "One account for Azure Cosmos DB for Apache Gremlin, with one database for the catalog and one for the recommendations", fr: "Un compte Azure Cosmos DB for Apache Gremlin, avec une base de données pour le catalogue et une autre pour les recommandations" } }
        - { id: c, text: { en: "Two accounts, one for Azure Cosmos DB for MongoDB and one for Azure Cosmos DB for Apache Cassandra", fr: "Deux comptes, l'un pour Azure Cosmos DB for MongoDB et l'autre pour Azure Cosmos DB for Apache Cassandra" } }
        - { id: d, text: { en: "Two accounts, one for Azure Cosmos DB for NoSQL and one for Azure Cosmos DB for Apache Gremlin", fr: "Deux comptes, l'un pour Azure Cosmos DB for NoSQL et l'autre pour Azure Cosmos DB for Apache Gremlin" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The API is chosen when the account is created, and it decides the data model and the query language of the whole account. JSON documents queried with a SQL-like syntax need Azure Cosmos DB for NoSQL, and traversing relationships needs the graph model of Azure Cosmos DB for Apache Gremlin. Two different APIs therefore require two accounts.
        fr: |
          L'API se choisit à la création du compte, et elle décide du modèle de données et du langage de requête de tout le compte. Des documents JSON interrogés avec une syntaxe proche de SQL exigent Azure Cosmos DB for NoSQL, et le parcours de relations exige le modèle de graphe d'Azure Cosmos DB for Apache Gremlin. Deux API différentes exigent donc deux comptes.
      options:
        a: { en: "A NoSQL account stores JSON documents only: it doesn't give the recommendation engine a graph of vertices and edges to traverse.", fr: "Un compte NoSQL ne stocke que des documents JSON : il ne fournit pas au moteur de recommandation un graphe de sommets et d'arêtes à parcourir." }
        b: { en: "A Gremlin account stores a graph queried with Gremlin, so the catalog wouldn't get JSON documents with a SQL-like syntax.", fr: "Un compte Gremlin stocke un graphe interrogé en Gremlin : le catalogue n'aurait donc pas de documents JSON avec une syntaxe proche de SQL." }
        c: { en: "Two accounts are needed, but MongoDB uses MQL, not a SQL-like syntax, and Cassandra's column-family model isn't a graph.", fr: "Deux comptes sont bien nécessaires, mais MongoDB utilise MQL, pas une syntaxe proche de SQL, et le modèle de famille de colonnes de Cassandra n'est pas un graphe." }
    references:
      - title: "Identify Azure Cosmos DB APIs"
        url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
      - title: "Databases, containers, and items in Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model
