chapter: 13-data-workloads
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-13-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        On what is the analysis of an analytical workload typically based?
      fr: |
        Sur quoi l'analyse d'une charge de travail analytique s'appuie-t-elle généralement ?
    body:
      options:
        - { id: a, text: { en: "The row that an application is updating right now", fr: "La ligne qu'une application est en train de mettre à jour" } }
        - { id: b, text: { en: "The changes not yet committed in an OLTP database", fr: "Les modifications pas encore validées dans une base de données OLTP" } }
        - { id: c, text: { en: "Snapshots of the data taken at points in time", fr: "Des instantanés des données pris à des moments donnés" } }
        - { id: d, text: { en: "The values that a user types into an order form", fr: "Les valeurs qu'un utilisateur saisit dans un formulaire de commande" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Analytical processing works on large volumes of historical data in read-only or read-mostly systems. The analysis is based on a snapshot of the data at a given point in time, or on a series of snapshots, to answer questions such as how sales changed over several years.
        fr: |
          Le traitement analytique travaille sur de grands volumes de données historiques, dans des systèmes en lecture seule ou principalement en lecture. L'analyse s'appuie sur un instantané des données à un moment donné, ou sur une série d'instantanés, pour répondre à des questions comme l'évolution des ventes sur plusieurs années.
      options:
        a: { en: "Updating a row as a business event happens is the work of a transactional system, not of an analytical workload.", fr: "Mettre à jour une ligne au moment où un événement métier se produit est le travail d'un système transactionnel, pas d'une charge de travail analytique." }
        b: { en: "Uncommitted changes belong to transactions in progress in the OLTP system; analytics reads a copy of recorded data.", fr: "Les modifications non validées appartiennent aux transactions en cours du système OLTP ; l'analytique lit une copie des données enregistrées." }
        d: { en: "Data entered in a form is captured by a line-of-business application, which a transactional system supports.", fr: "Les données saisies dans un formulaire sont capturées par une application métier, que soutient un système transactionnel." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-13-02
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum's banking database moves 300 from a savings account to a checking account in one transaction. After each completed transfer, the database must be in a valid state: the sum of the two balances is unchanged, so no money has appeared or vanished.

        Which ACID property does this requirement describe?
      fr: |
        La base de données bancaire d'Adatum déplace 300 d'un compte d'épargne vers un compte courant en une seule transaction. Après chaque virement terminé, la base de données doit être dans un état valide : la somme des deux soldes est inchangée, aucun argent n'est donc apparu ni n'a disparu.

        Quelle propriété ACID cette exigence décrit-elle ?
    body:
      options:
        - { id: a, text: { en: "Atomicity", fr: "Atomicité" } }
        - { id: b, text: { en: "Consistency", fr: "Cohérence" } }
        - { id: c, text: { en: "Isolation", fr: "Isolation" } }
        - { id: d, text: { en: "Durability", fr: "Durabilité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Consistency means that a transaction can only take the data from one valid state to another valid state. In a transfer, the completed state must reflect the movement of the funds from one account to the other, with the same total as before.
        fr: |
          La cohérence signifie qu'une transaction ne peut faire passer les données que d'un état valide à un autre état valide. Dans un virement, l'état final doit refléter le déplacement des fonds d'un compte à l'autre, avec le même total qu'avant.
      options:
        a: { en: "Atomicity makes the debit and the credit succeed or fail together; it describes all or nothing, not the validity of the resulting state.", fr: "L'atomicité fait réussir ou échouer ensemble le débit et le crédit ; elle décrit le « tout ou rien », pas la validité de l'état obtenu." }
        c: { en: "Isolation prevents concurrent transactions from interfering with one another, for example a read during the transfer.", fr: "L'isolation empêche les transactions simultanées d'interférer entre elles, par exemple une lecture pendant le virement." }
        d: { en: "Durability keeps a committed transaction committed, even after the database system restarts.", fr: "La durabilité garantit qu'une transaction validée le reste, même après un redémarrage du système de base de données." }
    references:
      - title: Explore transactional data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-13-03
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Fabrikam, the files exported from the sales system are already collected in a data lake. A scheduled process now reads these files and loads their data into the tables of a data warehouse.

        Which step of a typical analytical solution does this process perform?
      fr: |
        Chez Fabrikam, les fichiers exportés du système de ventes sont déjà collectés dans un lac de données. Un traitement planifié lit maintenant ces fichiers et charge leurs données dans les tables d'un entrepôt de données.

        Quelle étape d'une solution analytique type ce traitement effectue-t-il ?
    body:
      options:
        - { id: a, text: { en: "Ingest", fr: "Ingérer" } }
        - { id: b, text: { en: "Structure", fr: "Structurer" } }
        - { id: c, text: { en: "Aggregate", fr: "Agréger" } }
        - { id: d, text: { en: "Consume", fr: "Consommer" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In the structure step, the data of the data lake is loaded into a schema of tables, in a data lakehouse or, as here, in a data warehouse. The data was already ingested into the lake, so loading it into tables is the next step.
        fr: |
          À l'étape de structuration, les données du lac de données sont chargées dans un schéma de tables, dans un data lakehouse ou, comme ici, dans un entrepôt de données. Les données ont déjà été ingérées dans le lac : les charger dans des tables est donc l'étape suivante.
      options:
        a: { en: "Ingestion extracts the data from the operational systems into the data lake (ETL or ELT); here the files are already in the lake.", fr: "L'ingestion extrait les données des systèmes opérationnels vers le lac de données (ETL ou ELT) ; ici, les fichiers sont déjà dans le lac." }
        c: { en: "Aggregation calculates measures across dimensions in a semantic model, from the data that is already in tables.", fr: "L'agrégation calcule des mesures selon des dimensions dans un modèle sémantique, à partir des données déjà en tables." }
        d: { en: "Consumption queries the lake, the warehouse or the model to produce reports and dashboards; it doesn't load data.", fr: "La consommation interroge le lac, l'entrepôt ou le modèle pour produire des rapports et des tableaux de bord ; elle ne charge pas de données." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-13-04
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys uses an order-entry application. All day long, the sales staff create, look up, change and cancel orders, and each order must be saved as soon as it is placed.

        For each of the following statements about the database of this application, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise une application de saisie de commandes. Toute la journée, les commerciaux créent, consultent, modifient et annulent des commandes, et chaque commande doit être enregistrée dès qu'elle est passée.

        Pour chacune des affirmations suivantes sur la base de données de cette application, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Each order is stored as a detailed record at the moment it is placed.
            fr: Chaque commande est stockée sous forme d'enregistrement détaillé au moment où elle est passée.
        - id: s2
          text:
            en: To speed up the writes, the database keeps only the yearly order totals.
            fr: Pour accélérer les écritures, la base de données ne conserve que les totaux annuels des commandes.
        - id: s3
          text:
            en: The database must process a high volume of small units of work, each of them quickly.
            fr: La base de données doit traiter un volume élevé de petites unités de travail, chacune rapidement.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The application is a transactional workload: it records each business event as it happens, as current and detailed data, one record per order. Yearly totals are aggregated, historical data, which belongs to an analytical store; the OLTP database must keep each order to create, retrieve, update and delete it. Transactional systems are often high-volume, and each transaction is a small, discrete unit of work that must be processed quickly.
        fr: |
          L'application est une charge de travail transactionnelle : elle enregistre chaque événement métier au moment où il se produit, sous forme de données actuelles et détaillées, un enregistrement par commande. Des totaux annuels sont des données historiques agrégées, qui relèvent d'un magasin analytique ; la base OLTP doit conserver chaque commande pour la créer, la récupérer, la mettre à jour et la supprimer. Les systèmes transactionnels traitent souvent de gros volumes, et chaque transaction est une petite unité de travail distincte qui doit être traitée rapidement.
    references:
      - title: Explore transactional data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-13-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Contoso is designing its first analytical solution and is evaluating a data lake as one of its data stores.

        Which two statements describe a data lake?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso conçoit sa première solution analytique et évalue un lac de données comme l'un de ses magasins de données.

        Quelles sont les deux affirmations qui décrivent un lac de données ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "It holds pre-aggregated measures that users drill up and down.", fr: "Il contient des mesures préagrégées que les utilisateurs explorent vers le haut et vers le bas." } }
        - { id: b, text: { en: "It collects very large volumes of file-based data for analysis.", fr: "Il collecte de très grands volumes de données sous forme de fichiers pour l'analyse." } }
        - { id: c, text: { en: "It stores the data in a fully relational schema with a SQL engine.", fr: "Il stocke les données dans un schéma entièrement relationnel avec un moteur SQL." } }
        - { id: d, text: { en: "It records each business event with ACID transactions as it happens.", fr: "Il enregistre chaque événement métier avec des transactions ACID au moment où il se produit." } }
        - { id: e, text: { en: "It is where ETL or ELT processes land the data of operational systems.", fr: "C'est là que les processus ETL ou ELT déposent les données des systèmes opérationnels." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A data lake is file-based storage, used when a large volume of file-based data must be collected and analyzed. In a typical analytical solution, the data of the operational systems is extracted and loaded into the data lake, with the transformations applied before (ETL) or after (ELT) the load.
        fr: |
          Un lac de données est un stockage à base de fichiers, utilisé quand un grand volume de données sous forme de fichiers doit être collecté et analysé. Dans une solution analytique type, les données des systèmes opérationnels sont extraites et chargées dans le lac de données, les transformations étant appliquées avant (ETL) ou après (ELT) le chargement.
      options:
        a: { en: "Pre-aggregated data that users drill up and down through describes a semantic model (OLAP model).", fr: "Des données préagrégées que les utilisateurs explorent par niveaux décrivent un modèle sémantique (modèle OLAP)." }
        c: { en: "A fully relational schema with a SQL engine, optimized for reads, describes a data warehouse.", fr: "Un schéma entièrement relationnel avec un moteur SQL, optimisé pour les lectures, décrit un entrepôt de données." }
        d: { en: "Recording each business event with ACID guarantees is the work of a transactional (OLTP) system.", fr: "Enregistrer chaque événement métier avec les garanties ACID est le travail d'un système transactionnel (OLTP)." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-13-06
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys runs a booking application on a database system that supports ACID semantics. A customer books the last seat of a workshop: the database commits the transaction and the application displays the confirmation. One second later, the database server loses power. When the server restarts, the booking is still recorded.

        Which ACID property guarantees this outcome?
      fr: |
        Wingtip Toys exécute une application de réservation sur un système de base de données qui prend en charge la sémantique ACID. Un client réserve la dernière place d'un atelier : la base de données valide la transaction et l'application affiche la confirmation. Une seconde plus tard, le serveur de base de données subit une coupure de courant. Au redémarrage du serveur, la réservation est toujours enregistrée.

        Quelle propriété ACID garantit ce résultat ?
    body:
      options:
        - { id: a, text: { en: "Atomicity", fr: "Atomicité" } }
        - { id: b, text: { en: "Consistency", fr: "Cohérence" } }
        - { id: c, text: { en: "Isolation", fr: "Isolation" } }
        - { id: d, text: { en: "Durability", fr: "Durabilité" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Durability means that once a transaction has been committed, it remains committed: its changes are persisted and are still there when the database system is switched on again. The power loss happened after the commit, so the property at stake is durability.
        fr: |
          La durabilité signifie qu'une fois validée, une transaction le reste : ses modifications sont conservées et sont toujours là quand le système de base de données redémarre. La coupure de courant a eu lieu après la validation : la propriété en jeu est donc la durabilité.
      options:
        a: { en: "Atomicity matters when a failure happens before the commit: all the changes of the transaction are applied or none is. Here the transaction was already committed.", fr: "L'atomicité compte quand une panne survient avant la validation : toutes les modifications de la transaction sont appliquées ou aucune. Ici, la transaction était déjà validée." }
        b: { en: "Consistency ensures that the transaction moves the data from one valid state to another; it doesn't keep committed changes across a restart.", fr: "La cohérence garantit que la transaction fait passer les données d'un état valide à un autre ; elle ne conserve pas les modifications validées après un redémarrage." }
        c: { en: "Isolation keeps concurrent transactions from interfering, for example two customers booking the same seat; it doesn't protect against a power loss.", fr: "L'isolation empêche les transactions simultanées d'interférer, par exemple deux clients qui réservent la même place ; elle ne protège pas contre une coupure de courant." }
    references:
      - title: Explore transactional data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-13-07
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders runs an online store. You list the data activities of the company.

        Which two activities are part of an analytical workload?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exploite une boutique en ligne. Vous listez les activités liées aux données de l'entreprise.

        Quelles sont les deux activités qui font partie d'une charge de travail analytique ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "When a customer places an order, the website lowers the stock level of each ordered product.", fr: "Quand un client passe une commande, le site web diminue le niveau de stock de chaque produit commandé." } }
        - { id: b, text: { en: "Each night, a process copies the day's orders from the order database into a data warehouse.", fr: "Chaque nuit, un traitement copie les commandes du jour de la base de données des commandes vers un entrepôt de données." } }
        - { id: c, text: { en: "A loyalty application adds points to a member's account each time a purchase is recorded.", fr: "Une application de fidélité ajoute des points au compte d'un membre chaque fois qu'un achat est enregistré." } }
        - { id: d, text: { en: "A data scientist explores three years of clickstream files in a data lake to model customer churn.", fr: "Un scientifique des données explore trois ans de fichiers de parcours de navigation dans un lac de données pour modéliser l'attrition des clients." } }
        - { id: e, text: { en: "A customer cancels an order, and the website refunds the payment and updates the order status.", fr: "Un client annule une commande, et le site web rembourse le paiement et met à jour le statut de la commande." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Copying recorded orders into a data warehouse is the ingestion step of an analytical solution: the analytical system receives a copy of the data that the transactional system produced, even though the source is the order database. Data scientists who explore and model historical files in a data lake also work in the analytical part of the architecture.
        fr: |
          Copier les commandes enregistrées dans un entrepôt de données est l'étape d'ingestion d'une solution analytique : le système analytique reçoit une copie des données produites par le système transactionnel, même si la source est la base de données des commandes. Les scientifiques des données qui explorent et modélisent des fichiers historiques dans un lac de données travaillent aussi dans la partie analytique de l'architecture.
      options:
        a: { en: "Updating the stock level when an order is placed records a business event as it happens: a transactional (OLTP) workload.", fr: "Mettre à jour le niveau de stock quand une commande est passée enregistre un événement métier au moment où il se produit : une charge de travail transactionnelle (OLTP)." }
        c: { en: "Adding points to an account for each purchase is a small, discrete update of current data, typical of a transactional workload.", fr: "Ajouter des points à un compte à chaque achat est une petite mise à jour distincte de données actuelles, typique d'une charge de travail transactionnelle." }
        e: { en: "Refunding a payment and updating an order are write operations of a line-of-business application: a transactional workload.", fr: "Rembourser un paiement et mettre à jour une commande sont des opérations d'écriture d'une application métier : une charge de travail transactionnelle." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
      - title: Explore transactional data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-13-08
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        In the order database of Proseware, a single transaction inserts an order row and lowers the stock level of the ordered product. Reports and other clerks can use the same tables while the transaction runs. The database system supports ACID semantics.

        For each of the following statements about the guarantees that apply, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans la base de données des commandes de Proseware, une seule transaction insère une ligne de commande et diminue le niveau de stock du produit commandé. Des rapports et d'autres employés peuvent utiliser les mêmes tables pendant l'exécution de la transaction. Le système de base de données prend en charge la sémantique ACID.

        Pour chacune des affirmations suivantes sur les garanties qui s'appliquent, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The guarantee that the order row and the new stock level are both saved, or that neither is, is called durability.
            fr: La garantie que la ligne de commande et le nouveau niveau de stock sont enregistrés tous les deux, ou qu'aucun ne l'est, s'appelle la durabilité.
        - id: s2
          text:
            en: The guarantee that a report running during the transaction can't see the new order row together with the old stock level is called isolation.
            fr: La garantie qu'un rapport exécuté pendant la transaction ne peut pas voir la nouvelle ligne de commande avec l'ancien niveau de stock s'appelle l'isolation.
        - id: s3
          text:
            en: The guarantee that two clerks who update the stock of the same product at the same time don't interfere with each other is called consistency.
            fr: La garantie que deux employés qui mettent à jour le stock du même produit au même moment n'interfèrent pas l'un avec l'autre s'appelle la cohérence.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          "Both or neither" is atomicity: the transaction is a single unit that succeeds completely or fails completely; durability only keeps a committed transaction committed. Isolation means concurrent transactions can't interfere, so a concurrent reader never sees a mix of the state before and after the transaction. Two clerks updating the same stock at the same time is also a matter of isolation; consistency is about moving the data from one valid state to another.
        fr: |
          « Les deux ou aucun », c'est l'atomicité : la transaction est une unité unique qui réussit entièrement ou échoue entièrement ; la durabilité garantit seulement qu'une transaction validée le reste. L'isolation signifie que les transactions simultanées ne peuvent pas interférer : un lecteur simultané ne voit donc jamais un mélange de l'état d'avant et d'après la transaction. Deux employés qui mettent à jour le même stock au même moment relèvent aussi de l'isolation ; la cohérence concerne le passage des données d'un état valide à un autre.
    references:
      - title: Explore transactional data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-13-09
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Every night, Litware extracts the data of its order database and loads it unchanged into a data lake. Spark jobs then clean and reshape the data into tables that are defined over the files of the lake, and analysts query these tables with SQL. Finally, the revenue is totaled in advance by product and by month, so that the dashboards of the business users return the totals quickly.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chaque nuit, Litware extrait les données de sa base de données des commandes et les charge telles quelles dans un lac de données. Des travaux Spark nettoient et remodèlent ensuite les données en tables définies sur les fichiers du lac, et les analystes interrogent ces tables en SQL. Enfin, le chiffre d'affaires est totalisé à l'avance par produit et par mois, pour que les tableaux de bord des utilisateurs professionnels renvoient rapidement les totaux.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Litware ingests its data by using [[proc]].

          The tables defined over the files of the lake form [[store]].

          The revenue totaled in advance is stored in [[agg]].
        fr: |
          Litware ingère ses données à l'aide d'un processus [[proc]].

          Les tables définies sur les fichiers du lac forment [[store]].

          Le chiffre d'affaires totalisé à l'avance est stocké dans [[agg]].
      slots:
        - id: proc
          options:
            - { id: etl, text: "ETL" }
            - { id: elt, text: "ELT" }
            - { id: oltp, text: "OLTP" }
            - { id: crud, text: "CRUD" }
        - id: store
          options:
            - { id: dw, text: { en: "a data warehouse", fr: "un entrepôt de données" } }
            - { id: lh, text: { en: "a data lakehouse", fr: "un data lakehouse" } }
            - { id: sm, text: { en: "a semantic model", fr: "un modèle sémantique" } }
            - { id: oltpdb, text: { en: "an OLTP database", fr: "une base de données OLTP" } }
        - id: agg
          options:
            - { id: dl, text: { en: "a data lake", fr: "un lac de données" } }
            - { id: dw, text: { en: "a data warehouse", fr: "un entrepôt de données" } }
            - { id: lh, text: { en: "a data lakehouse", fr: "un data lakehouse" } }
            - { id: sm, text: { en: "a semantic model", fr: "un modèle sémantique" } }
    answer:
      values: { proc: elt, store: lh, agg: sm }
    explanation:
      correct:
        en: |
          The data is loaded unchanged and transformed afterward, in the lake: that is ELT, whereas ETL transforms the data before loading it. Tables defined as abstractions over the files of a data lake and queried with SQL form a data lakehouse; a data warehouse uses its own fully relational SQL engine. Revenue totaled in advance by product and month is aggregated data, measures calculated across dimensions, which is stored in a semantic model.
        fr: |
          Les données sont chargées telles quelles puis transformées ensuite, dans le lac : c'est de l'ELT, alors que l'ETL transforme les données avant de les charger. Des tables définies comme des abstractions sur les fichiers d'un lac de données et interrogées en SQL forment un data lakehouse ; un entrepôt de données utilise son propre moteur SQL entièrement relationnel. Le chiffre d'affaires totalisé à l'avance par produit et par mois est une donnée agrégée, des mesures calculées selon des dimensions, qui est stockée dans un modèle sémantique.
      options:
        etl: { en: "ETL applies the transformations before the load; Litware loads the data unchanged and transforms it afterward.", fr: "L'ETL applique les transformations avant le chargement ; Litware charge les données telles quelles et les transforme ensuite." }
        dw: { en: "A data warehouse is a fully relational SQL engine with its own tables, not tables defined over the files of the lake.", fr: "Un entrepôt de données est un moteur SQL entièrement relationnel avec ses propres tables, pas des tables définies sur les fichiers du lac." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-13-10
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank records card payments in a normalized OLTP database. Analysts need reports on five years of payments by customer segment and by merchant category. An architect proposes to copy the payment data every night into analytical tables in which the customer segment and the merchant category are repeated in every payment row.

        Which statement about this design is correct?
      fr: |
        Woodgrove Bank enregistre les paiements par carte dans une base de données OLTP normalisée. Les analystes ont besoin de rapports sur cinq ans de paiements par segment de clientèle et par catégorie de commerçant. Un architecte propose de copier chaque nuit les données de paiement dans des tables analytiques où le segment de clientèle et la catégorie de commerçant sont répétés dans chaque ligne de paiement.

        Quelle affirmation sur cette conception est correcte ?
    body:
      options:
        - { id: a, text: { en: "The repetition must be removed, because analytical tables must be as normalized as their OLTP source.", fr: "La répétition doit être supprimée, car les tables analytiques doivent être aussi normalisées que leur source OLTP." } }
        - { id: b, text: { en: "The copy is unnecessary, because an OLTP database is read-mostly and can serve these reports itself.", fr: "La copie est inutile, car une base de données OLTP est principalement en lecture et peut servir elle-même ces rapports." } }
        - { id: c, text: { en: "The analytical tables should record new payments directly, so that they never depend on a copy.", fr: "Les tables analytiques devraient enregistrer directement les nouveaux paiements, pour ne jamais dépendre d'une copie." } }
        - { id: d, text: { en: "The repetition is acceptable, because the tables are read-mostly and the duplication makes queries faster.", fr: "La répétition est acceptable, car les tables sont principalement en lecture et la duplication accélère les requêtes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Analytical schemas may denormalize the data that comes from an OLTP source: some duplication is accepted so that the queries run faster. This is acceptable because the analytical tables are read-only or read-mostly, while the OLTP database, which handles the writes, keeps its normalized design.
        fr: |
          Les schémas analytiques peuvent dénormaliser les données issues d'une source OLTP : on accepte une certaine duplication pour que les requêtes s'exécutent plus vite. C'est acceptable parce que les tables analytiques sont en lecture seule ou principalement en lecture, tandis que la base OLTP, qui traite les écritures, garde sa conception normalisée.
      options:
        a: { en: "Analytical tables don't have to follow the normalization of the OLTP source; some denormalization is a common choice for faster queries.", fr: "Les tables analytiques n'ont pas à suivre la normalisation de la source OLTP ; une certaine dénormalisation est un choix courant pour accélérer les requêtes." }
        b: { en: "An OLTP database is optimized for both reads and writes of individual records; read-mostly describes analytical systems, and long reports there would compete with the payments.", fr: "Une base OLTP est optimisée pour les lectures et les écritures d'enregistrements individuels ; « principalement en lecture » décrit les systèmes analytiques, et de longs rapports y concurrenceraient les paiements." }
        c: { en: "An analytical system doesn't record transactions: it receives a copy of the data that the transactional system produced.", fr: "Un système analytique n'enregistre pas les transactions : il reçoit une copie des données produites par le système transactionnel." }
    references:
      - title: Explore analytical data processing
        url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
