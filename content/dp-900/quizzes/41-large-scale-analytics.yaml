chapter: 41-large-scale-analytics
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The sales managers of Fabrikam use reports and data in Microsoft Fabric. They don't write SQL or DAX. They want to describe what they need in natural language and get help to generate queries, summarize reports, and answer questions about the data.

        What should they use?
      fr: |
        Les responsables commerciaux de Fabrikam utilisent des rapports et des données dans Microsoft Fabric. Ils n'écrivent ni SQL ni DAX. Ils veulent décrire leur besoin en langage naturel et obtenir de l'aide pour générer des requêtes, résumer des rapports et répondre à des questions sur les données.

        Que doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "Genie in Azure Databricks", fr: "Genie dans Azure Databricks" } }
        - { id: b, text: { en: "Copilot in Microsoft Fabric", fr: "Copilot dans Microsoft Fabric" } }
        - { id: c, text: { en: "Dataflows Gen2 in Microsoft Fabric", fr: "Dataflows Gen2 dans Microsoft Fabric" } }
        - { id: d, text: { en: "Unity Catalog in Azure Databricks", fr: "Unity Catalog dans Azure Databricks" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Copilot in Microsoft Fabric is the natural-language assistant of the Fabric platform: users describe what they want, and Copilot helps generate queries, summarize reports, and answer questions about the data. It extends self-service analytics to users who don't write queries.
        fr: |
          Copilot dans Microsoft Fabric est l'assistant en langage naturel de la plateforme Fabric : les utilisateurs décrivent ce qu'ils veulent, et Copilot aide à générer des requêtes, à résumer des rapports et à répondre à des questions sur les données. Il ouvre l'analytique en libre-service aux utilisateurs qui n'écrivent pas de requêtes.
      options:
        a: { en: "Genie offers a similar experience, but in Azure Databricks, over data registered in Unity Catalog; the managers work in Microsoft Fabric.", fr: "Genie offre une expérience semblable, mais dans Azure Databricks, sur des données inscrites dans Unity Catalog ; les responsables travaillent dans Microsoft Fabric." }
        c: { en: "Dataflows Gen2 build low-code Power Query transformations for ingestion; they don't answer questions asked in natural language.", fr: "Les Dataflows Gen2 créent des transformations Power Query avec peu de code pour l'ingestion ; ils ne répondent pas à des questions posées en langage naturel." }
        d: { en: "Unity Catalog governs data and AI assets in Azure Databricks (access control, lineage, discovery); it isn't a natural-language assistant.", fr: "Unity Catalog gouverne les données et les ressources d'IA dans Azure Databricks (contrôle d'accès, traçabilité, découverte) ; ce n'est pas un assistant en langage naturel." }
    references:
      - title: Describe data warehousing architecture
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys designs a star schema for the data warehouse that stores the sales of its shops and of its online store.

        Which two tables are dimension tables?

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys conçoit un schéma en étoile pour l'entrepôt de données qui stocke les ventes de ses magasins et de sa boutique en ligne.

        Quelles sont les deux tables de dimension ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A Date table with one row for each calendar day, and its month, quarter, and year", fr: "Une table Date avec une ligne par jour du calendrier, et son mois, son trimestre et son année" } }
        - { id: b, text: { en: "A SalesLine table with one row for each item sold, and its quantity and revenue", fr: "Une table SalesLine avec une ligne par article vendu, et sa quantité et son chiffre d'affaires" } }
        - { id: c, text: { en: "A Store table with one row for each shop, and its city and region", fr: "Une table Store avec une ligne par magasin, et sa ville et sa région" } }
        - { id: d, text: { en: "A Returns table with one row for each returned item, and its refund amount", fr: "Une table Returns avec une ligne par article retourné, et son montant remboursé" } }
        - { id: e, text: { en: "A WebVisits table with one row for each visit, and its duration in seconds", fr: "Une table WebVisits avec une ligne par visite, et sa durée en secondes" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Dimension tables hold the entities by which values are aggregated, such as customer, product, store, and time. The Date table lets analysts total the sales by month, quarter, or year, and the Store table lets them total the sales by shop, city, or region. Time is a dimension, not a value to aggregate.
        fr: |
          Les tables de dimension contiennent les entités selon lesquelles on agrège les valeurs, comme le client, le produit, le magasin et le temps. La table Date permet de totaliser les ventes par mois, trimestre ou année, et la table Store par magasin, ville ou région. Le temps est une dimension, pas une valeur à agréger.
      options:
        b: { en: "One row per event with numeric values to aggregate (quantity, revenue) is a fact table.", fr: "Une ligne par événement avec des valeurs numériques à agréger (quantité, chiffre d'affaires), c'est une table de faits." }
        d: { en: "Each return is an event with a refund amount to aggregate: it is a fact table.", fr: "Chaque retour est un événement avec un montant remboursé à agréger : c'est une table de faits." }
        e: { en: "Each visit is an event with a numeric duration to aggregate: it is a fact table.", fr: "Chaque visite est un événement avec une durée numérique à agréger : c'est une table de faits." }
    references:
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-41-03
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso builds a large-scale analytics solution in Microsoft Fabric. The solution contains the components listed in the answer area.

        Match each component to the element of the analytics architecture to which it belongs. To answer, drag the appropriate element to each component. Each element may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso crée une solution d'analytique à grande échelle dans Microsoft Fabric. La solution contient les composants listés dans la zone de réponse.

        Associez chaque composant à l'élément de l'architecture d'analytique auquel il appartient. Pour répondre, faites glisser l'élément approprié vers chaque composant. Chaque élément peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: ingest, text: { en: "Data ingestion and processing", fr: "Ingestion et traitement des données" } }
        - { id: store, text: { en: "Analytical data store", fr: "Magasin de données analytique" } }
        - { id: model, text: { en: "Analytical data model", fr: "Modèle de données analytique" } }
        - { id: viz, text: { en: "Data visualization", fr: "Visualisation des données" } }
      targets:
        - { id: t1, text: { en: "A pipeline that copies order rows from Azure SQL Database into OneLake", fr: "Un pipeline qui copie des lignes de commande d'Azure SQL Database vers OneLake" } }
        - { id: t2, text: { en: "A Warehouse whose fact and dimension tables hold the prepared sales data", fr: "Un Warehouse dont les tables de faits et de dimension contiennent les données de ventes préparées" } }
        - { id: t3, text: { en: "A semantic model that defines a Total revenue measure and a Year, Quarter, Month hierarchy", fr: "Un modèle sémantique qui définit une mesure Chiffre d'affaires total et une hiérarchie Année, Trimestre, Mois" } }
        - { id: t4, text: { en: "A report page that shows revenue KPIs and trends by region", fr: "Une page de rapport qui affiche des KPI et des tendances du chiffre d'affaires par région" } }
        - { id: t5, text: { en: "A Spark notebook that removes duplicate rows and restructures the data for analysis", fr: "Un notebook Spark qui supprime les lignes en double et restructure les données pour l'analyse" } }
    answer:
      mapping: { t1: ingest, t2: store, t3: model, t4: viz, t5: ingest }
    explanation:
      correct:
        en: |
          Copying data from operational sources and cleaning or restructuring it both belong to data ingestion and processing, so the pipeline and the notebook share that element. The Warehouse keeps the prepared data: it is the analytical data store. The semantic model, with its measures and hierarchies, is the analytical data model, and the report page that shows KPIs and trends is data visualization.
        fr: |
          Copier des données depuis des sources opérationnelles et les nettoyer ou les restructurer relèvent tous deux de l'ingestion et du traitement des données : le pipeline et le notebook partagent cet élément. Le Warehouse conserve les données préparées : c'est le magasin de données analytique. Le modèle sémantique, avec ses mesures et ses hiérarchies, est le modèle de données analytique, et la page de rapport qui affiche des KPI et des tendances relève de la visualisation des données.
      options:
        t5: { en: "Removing duplicates and restructuring data is processing, even when it runs after the data has landed in OneLake.", fr: "Supprimer des doublons et restructurer des données, c'est du traitement, même quand il s'exécute après l'arrivée des données dans OneLake." }
        t3: { en: "Measures and hierarchies are defined in the analytical data model, on top of the store, not in the store itself.", fr: "Les mesures et les hiérarchies se définissent dans le modèle de données analytique, au-dessus du magasin, pas dans le magasin lui-même." }
    references:
      - title: Describe data warehousing architecture
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-41-04
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The data engineers of Litware use Azure Databricks and keep the curated data in Delta tables. Business analysts must connect Power BI to these tables and run SQL queries on compute that is optimized for BI tools and many concurrent queries. The solution must stay within Azure Databricks.

        What should the analysts connect Power BI to?
      fr: |
        Les ingénieurs de données de Litware utilisent Azure Databricks et conservent les données préparées dans des tables Delta. Les analystes métier doivent connecter Power BI à ces tables et exécuter des requêtes SQL sur une capacité de calcul optimisée pour les outils décisionnels et pour de nombreuses requêtes simultanées. La solution doit rester dans Azure Databricks.

        À quoi les analystes doivent-ils connecter Power BI ?
    body:
      options:
        - { id: a, text: { en: "A Lakeflow pipeline", fr: "Un pipeline Lakeflow" } }
        - { id: b, text: { en: "The Unity Catalog metastore", fr: "Le metastore Unity Catalog" } }
        - { id: c, text: { en: "A SQL warehouse in Databricks SQL", fr: "Un entrepôt SQL de Databricks SQL" } }
        - { id: d, text: { en: "A Warehouse in Microsoft Fabric", fr: "Un Warehouse de Microsoft Fabric" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Databricks SQL provides SQL warehouses that run analytical queries directly on Delta tables. They are the SQL endpoint of Azure Databricks that is optimized for BI tools such as Power BI and for concurrent query workloads, so the data stays in Azure Databricks.
        fr: |
          Databricks SQL fournit des entrepôts SQL qui exécutent des requêtes analytiques directement sur les tables Delta. C'est le point de terminaison SQL d'Azure Databricks optimisé pour les outils décisionnels comme Power BI et pour les charges de requêtes simultanées : les données restent dans Azure Databricks.
      options:
        a: { en: "Lakeflow pipelines load and update Delta tables declaratively; they are an ingestion tool, not a query endpoint for BI.", fr: "Les pipelines Lakeflow chargent et mettent à jour des tables Delta de manière déclarative ; c'est un outil d'ingestion, pas un point de terminaison de requêtes pour la BI." }
        b: { en: "Unity Catalog governs access, lineage, and discovery of the data; it doesn't run the analysts' queries.", fr: "Unity Catalog gouverne l'accès, la traçabilité et la découverte des données ; il n'exécute pas les requêtes des analystes." }
        d: { en: "A Fabric Warehouse is a store of another platform, Microsoft Fabric; the solution must stay within Azure Databricks.", fr: "Un Warehouse Fabric est un magasin d'une autre plateforme, Microsoft Fabric ; la solution doit rester dans Azure Databricks." }
    references:
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
      - title: What is Azure Databricks?
        url: https://learn.microsoft.com/en-us/azure/databricks/introduction/

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-41-05
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware is choosing the analytical data store of a new solution. Its sources produce CSV exports of orders, semi-structured JSON logs whose fields vary between applications, and product images that the marketing team wants to keep in their original format.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware choisit le magasin de données analytique d'une nouvelle solution. Ses sources produisent des exportations CSV des commandes, des journaux JSON semi-structurés dont les champs varient d'une application à l'autre, et des images de produits que l'équipe marketing veut conserver dans leur format d'origine.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "If the JSON logs are kept in a data lake, two analysts can apply different tabular schemas to the same files when they read them.", fr: "Si les journaux JSON sont conservés dans un lac de données, deux analystes peuvent appliquer des schémas tabulaires différents aux mêmes fichiers quand ils les lisent." } }
        - { id: s2, text: { en: "A data warehouse is a suitable store to keep the product images in their native format.", fr: "Un entrepôt de données est un magasin adapté pour conserver les images de produits dans leur format natif." } }
        - { id: s3, text: { en: "A data lakehouse can keep the product images as files next to tables that enforce a schema.", fr: "Un data lakehouse peut conserver les images de produits sous forme de fichiers à côté de tables qui imposent un schéma." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A data lake applies its schema when the data is read (schema-on-read): nothing is enforced when the files are stored, so each reader can define the tabular structure it needs. A data warehouse is a relational database for structured data, not a store for images. A lakehouse keeps files of all types in the data lake and exposes the structured part as tables whose schema is enforced by a format such as Delta Lake.
        fr: |
          Un lac de données applique son schéma à la lecture des données (schéma sur lecture) : rien n'est imposé quand les fichiers sont stockés, chaque lecteur peut donc définir la structure tabulaire dont il a besoin. Un entrepôt de données est une base de données relationnelle pour des données structurées, pas un magasin d'images. Un lakehouse conserve des fichiers de tous types dans le lac de données et expose la partie structurée sous forme de tables dont le schéma est imposé par un format comme Delta Lake.
      options:
        s2: { en: "A data warehouse holds structured data in relational tables; images are unstructured data that belong in a data lake or a lakehouse.", fr: "Un entrepôt de données contient des données structurées dans des tables relationnelles ; les images sont des données non structurées, à leur place dans un lac de données ou un lakehouse." }
    references:
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware receives JSON files from about 200 partners. The structure of the files differs from one partner to the next and changes without notice. Every file must be stored as it arrives, even when its structure is new. Each analysis team then defines the structure that it needs at the moment it queries the files.

        Which analytical data store meets the requirements, and why?
      fr: |
        Litware reçoit des fichiers JSON d'environ 200 partenaires. La structure des fichiers diffère d'un partenaire à l'autre et change sans préavis. Chaque fichier doit être stocké tel qu'il arrive, même quand sa structure est nouvelle. Chaque équipe d'analyse définit ensuite la structure dont elle a besoin au moment où elle interroge les fichiers.

        Quel magasin de données analytique répond aux exigences, et pourquoi ?
    body:
      options:
        - { id: a, text: { en: "A data lake, because a tabular schema is applied to the files only when they are read", fr: "Un lac de données, car un schéma tabulaire n'est appliqué aux fichiers qu'au moment de leur lecture" } }
        - { id: b, text: { en: "A data warehouse, because its schema is defined and enforced before the data is loaded", fr: "Un entrepôt de données, car son schéma est défini et imposé avant le chargement des données" } }
        - { id: c, text: { en: "A data lakehouse, because its Delta tables enforce a schema when the data is written", fr: "Un data lakehouse, car ses tables Delta imposent un schéma au moment de l'écriture des données" } }
        - { id: d, text: { en: "A data warehouse, because a snowflake schema adds tables when the structure changes", fr: "Un entrepôt de données, car un schéma en flocon de neige ajoute des tables quand la structure change" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A data lake stores files of any format without applying constraints when they are written. The tabular schema is defined at the point where the data is read for analysis (schema-on-read), so a file with an unknown structure is still accepted, and each team can apply its own structure at query time.
        fr: |
          Un lac de données stocke des fichiers de tout format sans appliquer de contrainte à leur écriture. Le schéma tabulaire est défini au moment où les données sont lues pour l'analyse (schéma sur lecture) : un fichier de structure inconnue est donc quand même accepté, et chaque équipe peut appliquer sa propre structure au moment de la requête.
      options:
        b: { en: "A schema defined and enforced before loading is exactly what the requirements exclude: files with a new structure would not fit it.", fr: "Un schéma défini et imposé avant le chargement est justement ce que les exigences excluent : les fichiers de structure nouvelle n'y entreraient pas." }
        c: { en: "Schema enforcement on write is true of Delta tables, but it would reject the files whose structure doesn't match, and the teams want to define the structure when they read.", fr: "L'application du schéma à l'écriture est vraie des tables Delta, mais elle rejetterait les fichiers dont la structure ne correspond pas, et les équipes veulent définir la structure à la lecture." }
        d: { en: "A snowflake schema only splits dimension tables to represent hierarchies; it doesn't adapt to files whose structure changes.", fr: "Un schéma en flocon de neige ne fait que scinder des tables de dimension pour représenter des hiérarchies ; il ne s'adapte pas à des fichiers dont la structure change." }
    references:
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank loads customer transactions from Azure SQL Database into a lakehouse in Microsoft Fabric. A compliance rule states that the national identification numbers of the customers must never be written to the analytical store, not even temporarily. Analysts need all the other columns.

        Which approach meets the requirements?
      fr: |
        Woodgrove Bank charge les transactions de ses clients depuis Azure SQL Database dans un lakehouse de Microsoft Fabric. Une règle de conformité exige que les numéros d'identification nationaux des clients ne soient jamais écrits dans le magasin analytique, même temporairement. Les analystes ont besoin de toutes les autres colonnes.

        Quelle approche répond aux exigences ?
    body:
      options:
        - { id: a, text: { en: "Use ELT: copy the rows to the lakehouse, and then drop the column with a Spark notebook.", fr: "Utiliser ELT : copier les lignes dans le lakehouse, puis supprimer la colonne avec un notebook Spark." } }
        - { id: b, text: { en: "Use ETL: remove the column in the pipeline, and then load the rows into the lakehouse.", fr: "Utiliser ETL : retirer la colonne dans le pipeline, puis charger les lignes dans le lakehouse." } }
        - { id: c, text: { en: "Use mirroring to replicate the database into OneLake, and then hide the column in the semantic model.", fr: "Utiliser la mise en miroir pour répliquer la base de données dans OneLake, puis masquer la colonne dans le modèle sémantique." } }
        - { id: d, text: { en: "Use ELT: copy the rows to a Warehouse, and then drop the column with a T-SQL statement.", fr: "Utiliser ELT : copier les lignes dans un Warehouse, puis supprimer la colonne avec une instruction T-SQL." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With ETL, the data is transformed before it is loaded into the analytical store: the transformation runs in the pipeline. Removing the column there means that the identification numbers never reach the lakehouse, while every other column is loaded for the analysts.
        fr: |
          Avec ETL, les données sont transformées avant d'être chargées dans le magasin analytique : la transformation s'exécute dans le pipeline. Retirer la colonne à cette étape garantit que les numéros d'identification n'atteignent jamais le lakehouse, tandis que toutes les autres colonnes sont chargées pour les analystes.
      options:
        a: { en: "With ELT, the raw rows land in the store first, so the numbers are written to the lakehouse before the notebook removes them.", fr: "Avec ELT, les lignes brutes arrivent d'abord dans le magasin : les numéros sont donc écrits dans le lakehouse avant que le notebook ne les supprime." }
        c: { en: "Mirroring replicates the database into OneLake, numbers included; hiding a column in the semantic model doesn't remove it from the store.", fr: "La mise en miroir réplique la base de données dans OneLake, numéros compris ; masquer une colonne dans le modèle sémantique ne la retire pas du magasin." }
        d: { en: "A Warehouse is also an analytical store: with ELT, the numbers are written to it before the T-SQL statement drops them.", fr: "Un Warehouse est aussi un magasin analytique : avec ELT, les numéros y sont écrits avant que l'instruction T-SQL ne les supprime." }
    references:
      - title: Describe data warehousing architecture
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
      - title: Explore data ingestion pipelines
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam plans its analytics platform. Three teams have the following requirements:

        - **Data engineering**: the team already has Databricks skills and writes code-first Apache Spark workloads that must stay portable to the platforms of other cloud providers.
        - **Finance**: the team works in Microsoft Fabric, only with structured data. It writes SQL and needs strong schema enforcement for many concurrent users.
        - **Marketing**: the team works in Microsoft Fabric with a mix of semi-structured files and tables, which its data scientists process in Spark notebooks to train machine learning models.

        What should each team use? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prépare sa plateforme d'analytique. Trois équipes ont les exigences suivantes :

        - **Ingénierie des données** : l'équipe possède déjà des compétences Databricks et écrit des charges de travail Apache Spark orientées code qui doivent rester portables vers les plateformes d'autres fournisseurs cloud.
        - **Finance** : l'équipe travaille dans Microsoft Fabric, uniquement avec des données structurées. Elle écrit du SQL et a besoin d'une application stricte du schéma pour de nombreux utilisateurs simultanés.
        - **Marketing** : l'équipe travaille dans Microsoft Fabric avec un mélange de fichiers semi-structurés et de tables, que ses scientifiques des données traitent dans des notebooks Spark pour entraîner des modèles de machine learning.

        Que doit utiliser chaque équipe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Data engineering: [[eng]]

          Finance: [[fin]]

          Marketing: [[mkt]]
        fr: |
          Ingénierie des données : [[eng]]

          Finance : [[fin]]

          Marketing : [[mkt]]
      slots:
        - id: eng
          options:
            - { id: adf, text: Azure Data Factory }
            - { id: dbx, text: Azure Databricks }
            - { id: sqldb, text: Azure SQL Database }
            - { id: fabric, text: { en: "A Lakehouse in Microsoft Fabric", fr: "Un Lakehouse dans Microsoft Fabric" } }
        - id: fin
          options:
            - { id: lh, text: { en: "A Lakehouse", fr: "Un Lakehouse" } }
            - { id: eh, text: { en: "An Eventhouse", fr: "Un Eventhouse" } }
            - { id: wh, text: { en: "A Warehouse", fr: "Un Warehouse" } }
            - { id: sm, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
        - id: mkt
          options:
            - { id: wh, text: { en: "A Warehouse", fr: "Un Warehouse" } }
            - { id: sm, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
            - { id: lh, text: { en: "A Lakehouse", fr: "Un Lakehouse" } }
            - { id: eh, text: { en: "An Eventhouse", fr: "Un Eventhouse" } }
    answer:
      values: { eng: dbx, fin: wh, mkt: lh }
    explanation:
      correct:
        en: |
          Azure Databricks is the usual choice for code-first Spark workflows, multicloud portability, and existing Databricks expertise. A Fabric Warehouse is a fully managed relational data warehouse queried with T-SQL, suited to structured data, SQL developers, strong schema enforcement, and many concurrent users. A Fabric Lakehouse stores Delta tables and files in OneLake and supports Spark notebooks, which fits mixed or semi-structured data and machine learning.
        fr: |
          Azure Databricks est le choix habituel pour des flux de travail Spark orientés code, la portabilité multicloud et une expertise Databricks existante. Un Warehouse Fabric est un entrepôt de données relationnel entièrement managé, interrogé en T-SQL, adapté aux données structurées, aux développeurs SQL, à une application stricte du schéma et à de nombreux utilisateurs simultanés. Un Lakehouse Fabric stocke des tables Delta et des fichiers dans OneLake et prend en charge les notebooks Spark, ce qui convient aux données mixtes ou semi-structurées et au machine learning.
      options:
        fabric: { en: "A Fabric Lakehouse runs Spark too, but the team wants portability to other clouds and already has Databricks skills.", fr: "Un Lakehouse Fabric exécute aussi Spark, mais l'équipe veut la portabilité vers d'autres clouds et possède déjà des compétences Databricks." }
        adf: { en: "Azure Data Factory orchestrates pipelines; it isn't a Spark platform for code-first workloads.", fr: "Azure Data Factory orchestre des pipelines ; ce n'est pas une plateforme Spark pour des charges de travail orientées code." }
        lh: { en: "For finance, a Lakehouse targets mixed data processed with Spark; structured data written in SQL for many users points to a Warehouse.", fr: "Pour la finance, un Lakehouse vise des données mixtes traitées avec Spark ; des données structurées, du SQL et de nombreux utilisateurs désignent un Warehouse." }
        wh: { en: "For marketing, a Warehouse holds only structured data; semi-structured files processed in Spark notebooks point to a Lakehouse.", fr: "Pour le marketing, un Warehouse ne contient que des données structurées ; des fichiers semi-structurés traités dans des notebooks Spark désignent un Lakehouse." }
        eh: { en: "An Eventhouse stores streaming event and time-series data in KQL databases; neither team describes real-time data.", fr: "Un Eventhouse stocke des événements de streaming et des séries chronologiques dans des bases de données KQL ; aucune des deux équipes ne décrit des données en temps réel." }
    references:
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
      - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse

  # ------------------------------------------------------------------ 9
  - id: dp900-qz-41-09
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A consultant prepares a comparison of Microsoft Fabric and Azure Databricks for the architecture board of Adatum.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Un consultant prépare une comparaison de Microsoft Fabric et d'Azure Databricks pour le comité d'architecture d'Adatum.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Both platforms store their lakehouse tables in the open-source Delta Lake format.", fr: "Les deux plateformes stockent leurs tables de lakehouse au format open source Delta Lake." } }
        - { id: b, text: { en: "Both platforms are delivered as SaaS, so Adatum deploys nothing in its Azure subscription.", fr: "Les deux plateformes sont fournies en SaaS : Adatum ne déploie donc rien dans son abonnement Azure." } }
        - { id: c, text: { en: "Fabric is delivered as SaaS; Azure Databricks runs as a managed service in Adatum's subscription.", fr: "Fabric est fourni en SaaS ; Azure Databricks s'exécute comme un service managé dans l'abonnement d'Adatum." } }
        - { id: d, text: { en: "In both platforms, lakehouse tables can be queried only with Spark code, not with SQL.", fr: "Dans les deux plateformes, les tables de lakehouse ne peuvent être interrogées qu'avec du code Spark, pas en SQL." } }
        - { id: e, text: { en: "Only Azure Databricks offers an assistant that generates queries from natural language.", fr: "Seul Azure Databricks propose un assistant qui génère des requêtes à partir du langage naturel." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Delta Lake is the standard open-source lakehouse format of both Microsoft Fabric and Azure Databricks. Fabric is a unified software as a service (SaaS) platform built on OneLake, whereas Azure Databricks runs as a managed service inside the customer's Azure subscription.
        fr: |
          Delta Lake est le format open source standard de lakehouse de Microsoft Fabric comme d'Azure Databricks. Fabric est une plateforme unifiée fournie en tant que logiciel en tant que service (SaaS) sur OneLake, alors qu'Azure Databricks s'exécute comme un service managé dans l'abonnement Azure du client.
      options:
        b: { en: "Only Fabric is SaaS; Azure Databricks is a managed service that runs in the customer's Azure subscription.", fr: "Seul Fabric est un SaaS ; Azure Databricks est un service managé qui s'exécute dans l'abonnement Azure du client." }
        d: { en: "Both expose lakehouse tables to SQL: the SQL analytics endpoint in Fabric, SQL warehouses of Databricks SQL in Azure Databricks.", fr: "Les deux exposent les tables de lakehouse en SQL : le point de terminaison d'analytique SQL dans Fabric, les entrepôts SQL de Databricks SQL dans Azure Databricks." }
        e: { en: "Both have one: Copilot in Microsoft Fabric and Genie in Azure Databricks.", fr: "Les deux en ont un : Copilot dans Microsoft Fabric et Genie dans Azure Databricks." }
    references:
      - title: Describe data warehousing architecture
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
      - title: Explore analytical data stores
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-41-10
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Every hour, a pipeline in Microsoft Fabric at Adatum copies the new order rows, unchanged, from Azure SQL Database to files in a lakehouse. The pipeline then runs a Spark notebook that removes duplicate rows and writes the result to Delta tables of the same lakehouse. A semantic model reads the Delta tables for the sales reports.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Toutes les heures, un pipeline de Microsoft Fabric chez Adatum copie les nouvelles lignes de commande, sans les modifier, d'Azure SQL Database vers des fichiers d'un lakehouse. Le pipeline exécute ensuite un notebook Spark qui supprime les lignes en double et écrit le résultat dans des tables Delta du même lakehouse. Un modèle sémantique lit les tables Delta pour les rapports de ventes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The solution uses an ETL process, because the data is transformed before the semantic model reads it.", fr: "La solution utilise un processus ETL, car les données sont transformées avant que le modèle sémantique ne les lise." } }
        - { id: s2, text: { en: "Because the pipeline runs every hour, the solution processes the orders as a real-time stream.", fr: "Comme le pipeline s'exécute toutes les heures, la solution traite les commandes comme un flux en temps réel." } }
        - { id: s3, text: { en: "Removing the duplicates in the pipeline, before the rows reach the lakehouse, would make the process ETL.", fr: "Supprimer les doublons dans le pipeline, avant que les lignes n'atteignent le lakehouse, ferait du processus un ETL." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          What distinguishes ETL from ELT is whether the data is transformed before or after it is loaded into the analytical store. Here the rows land unchanged in the lakehouse and are transformed there by Spark: it is ELT. Moving the transformation into the pipeline, before the load, would make it ETL. An hourly schedule groups the rows into batches; it isn't stream processing.
        fr: |
          Ce qui distingue ETL d'ELT, c'est le moment de la transformation : avant ou après le chargement dans le magasin analytique. Ici, les lignes arrivent sans modification dans le lakehouse et y sont transformées par Spark : c'est un ELT. Déplacer la transformation dans le pipeline, avant le chargement, en ferait un ETL. Une planification horaire regroupe les lignes en lots ; ce n'est pas un traitement de flux.
      options:
        s1: { en: "The semantic model isn't the analytical store: the rows are loaded into the lakehouse before they are transformed, which is ELT.", fr: "Le modèle sémantique n'est pas le magasin analytique : les lignes sont chargées dans le lakehouse avant d'être transformées, ce qui est un ELT." }
        s2: { en: "Data collected and then processed together on a schedule is batch processing of static data, even when the schedule is short.", fr: "Des données collectées puis traitées ensemble selon une planification, c'est un traitement par lots de données statiques, même quand la planification est rapprochée." }
    references:
      - title: Describe data warehousing architecture
        url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
