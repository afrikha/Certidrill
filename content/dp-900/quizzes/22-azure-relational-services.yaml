chapter: 22-azure-relational-services
questions:
  # ------------------------------------------------------------------ 1
  - id: dp900-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys creates its first database in Azure SQL Database.

        Which version of the database engine does the database run?
      fr: |
        Tailspin Toys crée sa première base de données dans Azure SQL Database.

        Quelle version du moteur de base de données la base de données exécute-t-elle ?
    body:
      options:
        - { id: a, text: { en: "The version that Tailspin Toys selects, upgraded only when the company decides", fr: "La version que Tailspin Toys sélectionne, mise à niveau uniquement quand l'entreprise le décide" } }
        - { id: b, text: { en: "The latest stable version, which Azure updates and patches automatically", fr: "La dernière version stable, qu'Azure met à jour et corrige automatiquement" } }
        - { id: c, text: { en: "The version that Tailspin Toys installs on the logical server of the database", fr: "La version que Tailspin Toys installe sur le serveur logique de la base de données" } }
        - { id: d, text: { en: "The version of the SQL Server that Tailspin Toys runs in its own datacenter", fr: "La version du SQL Server que Tailspin Toys exécute dans son propre centre de données" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure SQL Database is a PaaS service: Azure automatically updates and patches the SQL Server software, so the databases always run the latest stable and most secure version of the engine.
        fr: |
          Azure SQL Database est un service PaaS : Azure met à jour et corrige automatiquement le logiciel SQL Server, si bien que les bases de données exécutent toujours la version stable la plus récente et la plus sécurisée du moteur.
      options:
        a: { en: "Choosing the version and the time of the upgrades is possible with SQL Server on Azure Virtual Machines, not with Azure SQL Database.", fr: "Choisir la version et le moment des mises à niveau est possible avec SQL Server sur Machines Virtuelles Azure, pas avec Azure SQL Database." }
        c: { en: "A logical server is a central administrative point for logins and firewall rules, not a machine on which you install software.", fr: "Un serveur logique est un point d'administration central pour les connexions et les règles de pare-feu, pas une machine sur laquelle vous installez des logiciels." }
        d: { en: "Azure SQL Database doesn't depend on any on-premises server: Azure provides and maintains the engine.", fr: "Azure SQL Database ne dépend d'aucun serveur local : Azure fournit et maintient le moteur." }
    references:
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql

  # ------------------------------------------------------------------ 2
  - id: dp900-qz-22-02
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A development team designs a new application. Its database must support custom data types that have their own nonrelational properties, and the team wants to add code modules to the database that queries can run. The database must use a platform as a service (PaaS) offering in Azure.

        Which service should the team use?
      fr: |
        Une équipe de développement conçoit une nouvelle application. Sa base de données doit prendre en charge des types de données personnalisés qui ont leurs propres propriétés non relationnelles, et l'équipe veut ajouter à la base de données des modules de code que les requêtes peuvent exécuter. La base de données doit utiliser une offre PaaS (platform as a service) dans Azure.

        Quel service l'équipe doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Azure Database for MySQL", fr: "Azure Database pour MySQL" } }
        - { id: b, text: Azure SQL Database }
        - { id: c, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
        - { id: d, text: Azure Table storage }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          PostgreSQL is an object-relational database: it stores data in relational tables but also supports custom data types with their own nonrelational properties, and it's extensible with code modules that queries can run. Azure Database for PostgreSQL is the PaaS service for this engine.
        fr: |
          PostgreSQL est une base de données objet-relationnelle : elle stocke les données dans des tables relationnelles, mais prend aussi en charge des types de données personnalisés avec leurs propres propriétés non relationnelles, et elle est extensible avec des modules de code que les requêtes peuvent exécuter. Azure Database pour PostgreSQL est le service PaaS de ce moteur.
      options:
        a: { en: "MySQL is known as a simple-to-use relational database for LAMP applications, not as an object-relational engine.", fr: "MySQL est connu comme une base de données relationnelle simple à utiliser pour les applications LAMP, pas comme un moteur objet-relationnel." }
        b: { en: "Azure SQL Database runs the SQL Server engine, which isn't object-relational, and it doesn't support CLR code modules.", fr: "Azure SQL Database exécute le moteur SQL Server, qui n'est pas objet-relationnel, et il ne prend pas en charge les modules de code CLR." }
        d: { en: "Table storage is a NoSQL key-value store; it doesn't run queries over custom types or code modules.", fr: "Le stockage Table est un magasin clé-valeur NoSQL ; il n'exécute pas de requêtes sur des types personnalisés ni de modules de code." }
    references:
      - title: Describe Azure services for open-source databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source

  # ------------------------------------------------------------------ 3
  - id: dp900-qz-22-03
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam compares Azure SQL Database and Azure SQL Managed Instance for the databases of its order system.

        Which two capabilities are available in both services?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam compare Azure SQL Database et Azure SQL Managed Instance pour les bases de données de son système de commandes.

        Quelles sont les deux fonctionnalités disponibles dans les deux services ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Sending email from the database with Database Mail", fr: "L'envoi d'e-mails depuis la base de données avec Database Mail" } }
        - { id: b, text: { en: "Restoring a database to an earlier point in time", fr: "La restauration d'une base de données à un point antérieur dans le temps" } }
        - { id: c, text: { en: "Running common language runtime (CLR) modules", fr: "L'exécution de modules CLR (Common Language Runtime)" } }
        - { id: d, text: { en: "Taking database backups automatically", fr: "La sauvegarde automatique des bases de données" } }
        - { id: e, text: { en: "Signing in to the operating system of the server", fr: "La connexion au système d'exploitation du serveur" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Both PaaS services fully automate backups, and both support point-in-time restore. The difference lies in instance-level features: Azure SQL Managed Instance offers near-100% compatibility with SQL Server, while Azure SQL Database supports most core database-level capabilities only.
        fr: |
          Les deux services PaaS automatisent entièrement les sauvegardes, et tous deux prennent en charge la restauration à un point dans le temps. La différence porte sur les fonctionnalités de niveau instance : Azure SQL Managed Instance offre une compatibilité proche de 100 % avec SQL Server, tandis qu'Azure SQL Database ne prend en charge que la plupart des fonctionnalités de base au niveau de la base de données.
      options:
        a: { en: "Database Mail is an instance-level feature available in Azure SQL Managed Instance but not in Azure SQL Database.", fr: "Database Mail est une fonctionnalité de niveau instance disponible dans Azure SQL Managed Instance, mais pas dans Azure SQL Database." }
        c: { en: "CLR is supported in Azure SQL Managed Instance but not in Azure SQL Database.", fr: "Le CLR est pris en charge dans Azure SQL Managed Instance, mais pas dans Azure SQL Database." }
        e: { en: "Both are PaaS services in which Azure manages the operating system; only SQL Server on Azure Virtual Machines gives access to it.", fr: "Les deux sont des services PaaS dans lesquels Azure gère le système d'exploitation ; seul SQL Server sur Machines Virtuelles Azure y donne accès." }
    references:
      - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison

  # ------------------------------------------------------------------ 4
  - id: dp900-qz-22-04
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank stores customer data in Azure SQL Database. For compliance reasons, the events that occur on the database must be recorded in a log, for example in an Azure storage account, so that investigators can review them later.

        Which capability should Woodgrove Bank use?
      fr: |
        Woodgrove Bank stocke des données de clients dans Azure SQL Database. Pour des raisons de conformité, les événements qui se produisent sur la base de données doivent être enregistrés dans un journal, par exemple dans un compte de stockage Azure, afin que des enquêteurs puissent les examiner plus tard.

        Quelle fonctionnalité Woodgrove Bank doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Defender for SQL", fr: "Microsoft Defender pour SQL" } }
        - { id: b, text: { en: "Point-in-time restore", fr: "Restauration à un point dans le temps" } }
        - { id: c, text: { en: "Auditing", fr: "Audit" } }
        - { id: d, text: { en: "Cross-region replication", fr: "Réplication entre régions" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Auditing tracks the events of the database and writes them to an audit log, for example in an Azure storage account. It helps to maintain regulatory compliance, to understand the activity on the database and to investigate anomalies.
        fr: |
          L'audit suit les événements de la base de données et les écrit dans un journal d'audit, par exemple dans un compte de stockage Azure. Il aide à respecter la conformité réglementaire, à comprendre l'activité de la base de données et à examiner les anomalies.
      options:
        a: { en: "Defender for SQL assesses vulnerabilities and detects suspicious activities such as SQL injection; it doesn't keep a log of all the database events.", fr: "Defender pour SQL évalue les vulnérabilités et détecte les activités suspectes comme l'injection SQL ; il ne conserve pas un journal de tous les événements de la base de données." }
        b: { en: "Point-in-time restore brings a database back to an earlier state; it doesn't record who did what.", fr: "La restauration à un point dans le temps ramène une base de données à un état antérieur ; elle n'enregistre pas qui a fait quoi." }
        d: { en: "Replicating a database to another region protects against a regional outage; it doesn't produce an audit log.", fr: "Répliquer une base de données vers une autre région protège contre une panne régionale ; cela ne produit pas de journal d'audit." }
    references:
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql

  # ------------------------------------------------------------------ 5
  - id: dp900-qz-22-05
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware runs two applications in its own datacenter: an online catalog whose data is in MySQL, and a billing application whose data is in PostgreSQL. To stop managing the database servers, Proseware moves the MySQL database to Azure Database for MySQL and the PostgreSQL database to Azure Database for PostgreSQL.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exécute deux applications dans son propre centre de données : un catalogue en ligne dont les données sont dans MySQL, et une application de facturation dont les données sont dans PostgreSQL. Pour ne plus gérer les serveurs de base de données, Proseware déplace la base de données MySQL vers Azure Database pour MySQL et la base de données PostgreSQL vers Azure Database pour PostgreSQL.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The administrators of Proseware keep using the server backup and restore functions of PostgreSQL that they run on-premises.", fr: "Les administrateurs de Proseware continuent d'utiliser les fonctions de sauvegarde et de restauration du serveur PostgreSQL qu'ils exécutent en local." }
        - id: s2
          text: { en: "Proseware pays for Azure Database for MySQL on a pay-as-you-go basis, for what it uses.", fr: "Proseware paie Azure Database pour MySQL selon un modèle de paiement à l'utilisation, pour ce qu'elle utilise." }
        - id: s3
          text: { en: "The data stored in Azure Database for PostgreSQL is protected at rest and in transit.", fr: "Les données stockées dans Azure Database pour PostgreSQL sont protégées au repos et en transit." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Both services are PaaS: Microsoft manages and maintains the server, so server-focused functions such as server backup and restore aren't available; backups are taken automatically instead. Azure Database for MySQL uses pay-as-you-go pricing, and Azure Database for PostgreSQL offers the same security benefits, with data protected at rest and in motion.
        fr: |
          Les deux services sont PaaS : Microsoft gère et maintient le serveur ; les fonctions orientées serveur comme la sauvegarde et la restauration du serveur ne sont donc pas disponibles, et les sauvegardes sont prises automatiquement à la place. Azure Database pour MySQL utilise une tarification de paiement à l'utilisation, et Azure Database pour PostgreSQL offre les mêmes avantages de sécurité, avec des données protégées au repos et en transit.
      options:
        s1: { en: "These operations are among those that the service doesn't expose, because Azure performs them: point-in-time restore of the automatic backups replaces them.", fr: "Ces opérations font partie de celles que le service n'expose pas, car Azure les effectue : la restauration à un point dans le temps des sauvegardes automatiques les remplace." }
    references:
      - title: Describe Azure services for open-source databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source

  # ------------------------------------------------------------------ 6
  - id: dp900-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware runs an order-processing application on an on-premises SQL Server instance. The databases use Service Broker queues to process orders asynchronously, and they send notifications to the warehouse with Database Mail. Litware wants to move the databases to Azure without changing how the application uses these two features.

        Which two services can host the databases? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute une application de traitement des commandes sur une instance SQL Server locale. Les bases de données utilisent des files d'attente Service Broker pour traiter les commandes de façon asynchrone, et elles envoient des notifications à l'entrepôt avec Database Mail. Litware veut déplacer les bases de données vers Azure sans changer la façon dont l'application utilise ces deux fonctionnalités.

        Quels sont les deux services qui peuvent héberger les bases de données ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Azure SQL Database single databases", fr: "Bases de données uniques Azure SQL Database" } }
        - { id: b, text: Azure SQL Managed Instance }
        - { id: c, text: { en: "Azure SQL Database elastic pool", fr: "Pool élastique Azure SQL Database" } }
        - { id: d, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines Virtuelles Azure" } }
        - { id: e, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Service Broker and Database Mail are instance-level features of SQL Server. SQL Server on Azure Virtual Machines runs the full SQL Server product, and Azure SQL Managed Instance offers near-100% compatibility, including these two features. Managed Instance requires less administration, but both options meet the stated requirement.
        fr: |
          Service Broker et Database Mail sont des fonctionnalités de niveau instance de SQL Server. SQL Server sur Machines Virtuelles Azure exécute le produit SQL Server complet, et Azure SQL Managed Instance offre une compatibilité proche de 100 %, ces deux fonctionnalités comprises. Managed Instance demande moins d'administration, mais les deux options répondent à l'exigence énoncée.
      options:
        a: { en: "Azure SQL Database supports neither Service Broker nor Database Mail; the application would have to change.", fr: "Azure SQL Database ne prend en charge ni Service Broker ni Database Mail ; l'application devrait changer." }
        c: { en: "An elastic pool only shares resources among databases of Azure SQL Database, which lack the same instance-level features.", fr: "Un pool élastique ne fait que partager des ressources entre des bases de données Azure SQL Database, auxquelles manquent les mêmes fonctionnalités de niveau instance." }
        e: { en: "Azure Database for PostgreSQL runs another engine and another SQL dialect: the application would have to be rewritten.", fr: "Azure Database pour PostgreSQL exécute un autre moteur et un autre dialecte SQL : l'application devrait être réécrite." }
    references:
      - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql

  # ------------------------------------------------------------------ 7
  - id: dp900-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum plans to move four workloads to Azure. Each database must use a platform as a service (PaaS) offering, with the fewest changes to the application and the least administrative effort.

        Which service should you use for each workload? To answer, drag the appropriate service to each workload. Each service may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum prévoit de déplacer quatre charges de travail vers Azure. Chaque base de données doit utiliser une offre PaaS (platform as a service), avec le moins de modifications possible de l'application et le moins d'effort d'administration.

        Quel service devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser le service approprié vers chaque charge de travail. Chaque service peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: mysql, text: { en: "Azure Database for MySQL", fr: "Azure Database pour MySQL" } }
        - { id: pg, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
        - { id: sqldb, text: Azure SQL Database }
        - { id: mi, text: Azure SQL Managed Instance }
        - { id: vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines Virtuelles Azure" } }
      targets:
        - { id: t1, text: { en: "A route-planning application on PostgreSQL that stores delivery zones as polygons", fr: "Une application de planification d'itinéraires sur PostgreSQL qui stocke les zones de livraison sous forme de polygones" } }
        - { id: t2, text: { en: "A PHP web shop that runs on MySQL Community Edition", fr: "Une boutique web PHP qui s'exécute sur MySQL Community Edition" } }
        - { id: t3, text: { en: "A SQL Server instance whose databases run scheduled SQL Server Agent jobs", fr: "Une instance SQL Server dont les bases de données exécutent des travaux SQL Server Agent planifiés" } }
        - { id: t4, text: { en: "A new Transact-SQL application that will create one database for each customer", fr: "Une nouvelle application Transact-SQL qui créera une base de données par client" } }
    answer:
      mapping: { t1: pg, t2: mysql, t3: mi, t4: sqldb }
    explanation:
      correct:
        en: |
          An application keeps working without major changes on the Azure Database service of its own engine: PostgreSQL, which handles geometric data such as polygons, goes to Azure Database for PostgreSQL, and the MySQL web shop to Azure Database for MySQL, which is based on the Community Edition. SQL Server Agent jobs are an instance-level feature that Azure SQL Managed Instance supports as PaaS. A new cloud application with no instance-level dependency fits Azure SQL Database, the option with the least administration.
        fr: |
          Une application continue de fonctionner sans modification majeure sur le service Azure Database de son propre moteur : PostgreSQL, qui gère des données géométriques comme les polygones, va vers Azure Database pour PostgreSQL, et la boutique web MySQL vers Azure Database pour MySQL, qui est basé sur Community Edition. Les travaux SQL Server Agent sont une fonctionnalité de niveau instance qu'Azure SQL Managed Instance prend en charge en PaaS. Une nouvelle application cloud sans dépendance de niveau instance correspond à Azure SQL Database, l'option qui demande le moins d'administration.
      options:
        vm: { en: "SQL Server on Azure Virtual Machines is IaaS: it doesn't meet the PaaS requirement, and you manage the operating system.", fr: "SQL Server sur Machines Virtuelles Azure est IaaS : il ne répond pas à l'exigence PaaS, et vous gérez le système d'exploitation." }
        t3: { en: "Azure SQL Database doesn't support SQL Server Agent, so the jobs would have to be rebuilt.", fr: "Azure SQL Database ne prend pas en charge SQL Server Agent : les travaux devraient donc être recréés." }
    references:
      - title: Describe Azure services for open-source databases
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql

  # ------------------------------------------------------------------ 8
  - id: dp900-qz-22-08
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Contoso consolidates the databases of four departments. The company plans to host the four workloads described in the following table in Azure SQL Database, and you review which option each workload needs.

        Answer each prompt by selecting the appropriate workload.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso regroupe les bases de données de quatre départements. L'entreprise prévoit d'héberger dans Azure SQL Database les quatre charges de travail décrites dans le tableau suivant, et vous examinez l'option dont chaque charge de travail a besoin.

        Répondez à chaque consigne en sélectionnant la charge de travail appropriée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text:
            en: The workload whose databases must be changed before they can move to Azure SQL Database
            fr: La charge de travail dont les bases de données doivent être modifiées avant de pouvoir passer à Azure SQL Database
        - id: p2
          text:
            en: The workload that should use the serverless compute tier
            fr: La charge de travail qui doit utiliser le niveau de calcul serverless
      grid:
        header:
          - en: Workload
            fr: Charge de travail
          - en: Databases
            fr: Bases de données
          - en: Usage and requirements
            fr: Utilisation et exigences
        rows:
          - - text: W1
              area: w1
            - text:
                en: One database of 80 TB that keeps growing
                fr: Une base de données de 80 To qui ne cesse de croître
            - text:
                en: Backups and restores must stay fast as the data grows
                fr: Les sauvegardes et les restaurations doivent rester rapides à mesure que les données augmentent
          - - text: W2
              area: w2
            - text:
                en: 30 databases, one for each franchise
                fr: 30 bases de données, une par franchise
            - text:
                en: Low average use, with peaks at different times; one shared budget
                fr: Utilisation moyenne faible, avec des pics à des moments différents ; un seul budget partagé
          - - text: W3
              area: w3
            - text:
                en: One test database
                fr: Une base de données de test
            - text:
                en: Used about two hours a day at unpredictable times; pay only for the compute used
                fr: Utilisée environ deux heures par jour à des moments imprévisibles ; ne payer que le calcul utilisé
          - - text: W4
              area: w4
            - text:
                en: Eight databases of one SQL Server instance
                fr: Huit bases de données d'une instance SQL Server
            - text:
                en: The databases query each other with three-part names
                fr: Les bases de données s'interrogent mutuellement avec des noms en trois parties
    answer:
      values: { p1: w4, p2: w3 }
    explanation:
      correct:
        en: |
          Azure SQL Database supports most core database-level capabilities, but not cross-database queries with three-part names: W4 must be changed first, or move to Azure SQL Managed Instance instead. W3 is a single database with intermittent, unpredictable use: the serverless compute tier scales automatically, bills the compute used and can pause the database. W1 fits the Hyperscale service tier (up to 128 TB) and W2 an elastic pool.
        fr: |
          Azure SQL Database prend en charge la plupart des fonctionnalités de base au niveau de la base de données, mais pas les requêtes entre bases de données avec des noms en trois parties : W4 doit d'abord être modifiée, ou passer plutôt à Azure SQL Managed Instance. W3 est une base de données unique à l'usage intermittent et imprévisible : le niveau de calcul serverless se met à l'échelle automatiquement, facture le calcul utilisé et peut mettre la base de données en pause. W1 correspond au niveau de service Hyperscale (jusqu'à 128 To) et W2 à un pool élastique.
      options:
        w2: { en: "Several databases with peaks at different times share the resources of an elastic pool; serverless applies to one database whose own use is intermittent.", fr: "Plusieurs bases de données aux pics décalés partagent les ressources d'un pool élastique ; le serverless s'applique à une base de données dont l'usage propre est intermittent." }
        w1: { en: "80 TB is within the limit of the Hyperscale service tier, so W1 moves without changes to its database.", fr: "80 To restent dans la limite du niveau de service Hyperscale : W1 passe donc sans modification de sa base de données." }
    references:
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
      - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
