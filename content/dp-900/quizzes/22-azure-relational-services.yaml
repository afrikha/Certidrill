  # ------------------------------------------------------------------ 9
  - id: dp900-qz-22-09
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders sells a software service to restaurants and keeps the data of each restaurant in its own database in Azure SQL Database. Twenty of these databases are in an elastic pool, three large ones are single databases, and all of them are attached to one logical server named **sql-northwind**. The operations team reviews the configuration before a contract renewal.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders vend un service logiciel aux restaurants et conserve les données de chaque restaurant dans sa propre base de données dans Azure SQL Database. Vingt de ces bases de données sont dans un pool élastique, trois grandes bases sont des bases de données uniques, et toutes sont rattachées à un serveur logique nommé **sql-northwind**. L'équipe des opérations examine la configuration avant un renouvellement de contrat.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The firewall rules of sql-northwind apply to the pooled databases and to the single databases.", fr: "Les règles de pare-feu de sql-northwind s'appliquent aux bases de données en pool et aux bases de données uniques." }
        - id: s2
          text: { en: "The twenty pooled databases share the resources of the pool with databases of other Azure customers.", fr: "Les vingt bases de données en pool partagent les ressources du pool avec des bases de données d'autres clients Azure." }
        - id: s3
          text: { en: "Enabling zone redundancy for one of the single databases raises its availability SLA.", fr: "Activer la redondance de zone pour l'une des bases de données uniques augmente son contrat SLA de disponibilité." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A logical server is the central administrative point for multiple single or pooled databases, with their logins, firewall rules and auditing rules. An elastic pool shares memory, storage and processing power among databases through multi-tenancy, but only the customer's own databases use the pool. The availability SLA of Azure SQL Database increases with zone redundancy.
        fr: |
          Un serveur logique est le point d'administration central de plusieurs bases de données uniques ou en pool, avec leurs connexions, leurs règles de pare-feu et leurs règles d'audit. Un pool élastique partage la mémoire, le stockage et la puissance de traitement entre des bases de données par mutualisation, mais seules les bases de données du client utilisent le pool. Le contrat SLA de disponibilité d'Azure SQL Database augmente avec la redondance de zone.
      options:
        s2: { en: "The multi-tenancy of a pool is among the databases of the same customer: databases of other customers can't use it.", fr: "La mutualisation d'un pool se fait entre les bases de données d'un même client : les bases de données d'autres clients ne peuvent pas l'utiliser." }
    references:
      - title: Describe Azure SQL services and capabilities
        url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql

  # ------------------------------------------------------------------ 10
  - id: dp900-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso runs an on-premises SQL Server instance that hosts six databases. The databases query each other by using three-part names, and nightly SQL Server Agent jobs maintain them. Contoso plans to migrate the instance to Azure SQL Managed Instance. A consultant suggests Azure SQL Database or SQL Server on Azure Virtual Machines as alternatives.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute une instance SQL Server locale qui héberge six bases de données. Les bases de données s'interrogent mutuellement en utilisant des noms en trois parties, et des travaux SQL Server Agent nocturnes les maintiennent. Contoso prévoit de migrer l'instance vers Azure SQL Managed Instance. Un consultant suggère Azure SQL Database ou SQL Server sur Machines Virtuelles Azure comme alternatives.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If the six databases are attached to the same logical server in Azure SQL Database, their cross-database queries keep working.", fr: "Si les six bases de données sont rattachées au même serveur logique dans Azure SQL Database, leurs requêtes entre bases de données continuent de fonctionner." }
        - id: s2
          text: { en: "After the migration to Azure SQL Managed Instance, applications can reach the instance through a private IP address in a virtual network of Contoso.", fr: "Après la migration vers Azure SQL Managed Instance, les applications peuvent atteindre l'instance par une adresse IP privée dans un réseau virtuel de Contoso." }
        - id: s3
          text: { en: "With SQL Server on Azure Virtual Machines, the Agent jobs keep working, and Azure installs the operating system updates of the virtual machines.", fr: "Avec SQL Server sur Machines Virtuelles Azure, les travaux Agent continuent de fonctionner, et Azure installe les mises à jour du système d'exploitation des machines virtuelles." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A logical server is only an administrative point for logins, firewall and auditing rules; it isn't a SQL Server instance, and Azure SQL Database doesn't support cross-database queries with three-part names. Azure SQL Managed Instance is deployed inside the customer's virtual network, and by default its endpoint is exposed only through a private IP address. SQL Server on Azure Virtual Machines is IaaS: it keeps every SQL Server feature, including Agent, but the customer manages the operating system updates.
        fr: |
          Un serveur logique n'est qu'un point d'administration pour les connexions et les règles de pare-feu et d'audit ; ce n'est pas une instance SQL Server, et Azure SQL Database ne prend pas en charge les requêtes entre bases de données avec des noms en trois parties. Azure SQL Managed Instance est déployé dans le réseau virtuel du client, et par défaut son point de terminaison n'est exposé que par une adresse IP privée. SQL Server sur Machines Virtuelles Azure est IaaS : il conserve toutes les fonctionnalités de SQL Server, SQL Server Agent compris, mais c'est le client qui gère les mises à jour du système d'exploitation.
      options:
        s1: { en: "Grouping databases on one logical server doesn't turn them into an instance: three-part-name queries remain unsupported in Azure SQL Database.", fr: "Regrouper des bases de données sur un serveur logique n'en fait pas une instance : les requêtes avec des noms en trois parties restent non prises en charge dans Azure SQL Database." }
        s3: { en: "The Agent jobs do keep working, but in IaaS Contoso manages the operating system, its updates, the backups and the configuration.", fr: "Les travaux Agent continuent bien de fonctionner, mais en IaaS c'est Contoso qui gère le système d'exploitation, ses mises à jour, les sauvegardes et la configuration." }
    references:
      - title: What is Azure SQL Managed Instance?
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview
      - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
