id: dp900-2a-rel-drag-library-terms
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A library designs a relational database to track the books that it owns.

    Match each element of the design to the correct term. To answer, drag the appropriate term to each element. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une bibliothèque conçoit une base de données relationnelle pour suivre les livres qu'elle possède.

    Associez chaque élément de la conception au terme correct. Pour répondre, faites glisser le terme approprié vers chaque élément. Chaque terme peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: attribute, text: { en: "Attribute", fr: "Attribut" } }
    - { id: fk, text: { en: "Foreign key", fr: "Clé étrangère" } }
    - { id: entity, text: { en: "Entity", fr: "Entité" } }
    - { id: pk, text: { en: "Primary key", fr: "Clé primaire" } }
    - { id: instance, text: { en: "Instance of an entity", fr: "Instance d'une entité" } }
  targets:
    - { id: t1, text: { en: "The books, about which the library records information", fr: "Les livres, à propos desquels la bibliothèque enregistre des informations" } }
    - { id: t2, text: { en: "The title that is recorded for every book", fr: "Le titre enregistré pour chaque livre" } }
    - { id: t3, text: { en: "The copy of a novel that one row of the table describes", fr: "L'exemplaire d'un roman qu'une ligne de la table décrit" } }
    - { id: t4, text: { en: "The number that designates one book only and differs for every book", fr: "Le numéro qui désigne un seul livre et qui diffère pour chaque livre" } }
answer:
  mapping: { t1: entity, t2: attribute, t3: instance, t4: pk }
explanation:
  correct:
    en: |
      Books are the entity: the thing about which information is recorded, modeled as a table. The title is an attribute, stored in a column. One particular copy is an instance of the entity, stored as a row, and the number that identifies that row only is the primary key. A foreign key would refer to another table, which no element here does.
    fr: |
      Les livres sont l'entité : ce sur quoi des informations sont enregistrées, modélisé sous forme de table. Le titre est un attribut, stocké dans une colonne. Un exemplaire particulier est une instance de l'entité, stockée sous forme de ligne, et le numéro qui identifie cette seule ligne est la clé primaire. Une clé étrangère ferait référence à une autre table, ce qu'aucun élément ne fait ici.
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
