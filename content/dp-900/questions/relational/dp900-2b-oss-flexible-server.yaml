id: dp900-2b-oss-flexible-server
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which deployment option of Azure Database for MySQL and Azure Database for PostgreSQL provides a fully managed database server with granular control of its configuration and with cost optimization controls?
  fr: |
    Quelle option de déploiement d'Azure Database pour MySQL et d'Azure Database pour PostgreSQL fournit un serveur de base de données entièrement managé, avec un contrôle précis de sa configuration et des contrôles d'optimisation des coûts ?
body:
  options:
    - id: a
      text:
        en: Elastic pool
        fr: Pool élastique
    - id: b
      text:
        en: Managed instance
        fr: Instance managée
    - id: c
      text:
        en: Flexible Server
        fr: Serveur flexible
    - id: d
      text:
        en: Hyperscale
        fr: Hyperscale
answer: {optionId: c}
explanation:
  correct:
    en: Flexible Server is the deployment option of both services. It's a fully managed database server that gives granular control over the management and configuration settings and includes cost optimization controls.
    fr: Serveur flexible (Flexible Server) est l'option de déploiement des deux services. C'est un serveur de base de données entièrement managé qui offre un contrôle précis des paramètres de gestion et de configuration et inclut des contrôles d'optimisation des coûts.
  options:
    a:
      en: An elastic pool is an option of Azure SQL Database in which several databases share resources.
      fr: Un pool élastique est une option d'Azure SQL Database dans laquelle plusieurs bases de données partagent des ressources.
    b:
      en: A managed instance belongs to Azure SQL Managed Instance, a service of the Azure SQL family.
      fr: Une instance managée relève d'Azure SQL Managed Instance, un service de la famille Azure SQL.
    d:
      en: Hyperscale is a service tier of Azure SQL Database for very large databases.
      fr: Hyperscale est un niveau de service d'Azure SQL Database pour les très grandes bases de données.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
