id: dp900-2a-rel-yn-entities
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "An event, such as a sales order, can be modeled as an entity that has its own table.", fr: "Un événement, comme une commande client, peut être modélisé comme une entité qui a sa propre table." } }
    - { id: s2, text: { en: "Each column of a table stores data of a specific data type.", fr: "Chaque colonne d'une table stocke des données d'un type de données spécifique." } }
    - { id: s3, text: { en: "A relational database stores all its entities in a single table.", fr: "Une base de données relationnelle stocke toutes ses entités dans une seule table." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      An entity is anything about which you record information, typically an object or an event, so a sales order gets its own table. Each column of a table stores data of one data type. A relational database has one table per entity, for example customers, products and orders, not a single table for everything.
    fr: |
      Une entité est tout ce sur quoi vous enregistrez des informations, généralement un objet ou un événement : une commande client a donc sa propre table. Chaque colonne d'une table stocke des données d'un seul type de données. Une base de données relationnelle comporte une table par entité, par exemple les clients, les produits et les commandes, et non une table unique pour tout.
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
