id: dp900-2a-rel-order-customer-link
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A relational database contains a table named **Customer** and a table named **SalesOrder**. Each order is placed by one customer.

    What should each row of SalesOrder store to indicate which customer placed the order?
  fr: |
    Une base de données relationnelle contient une table nommée **Customer** et une table nommée **SalesOrder**. Chaque commande est passée par un seul client.

    Que doit stocker chaque ligne de SalesOrder pour indiquer quel client a passé la commande ?
body:
  options:
    - { id: a, text: { en: "A copy of the name and the address of the customer", fr: "Une copie du nom et de l'adresse du client" } }
    - { id: b, text: { en: "The position of the customer's row in the Customer table", fr: "La position de la ligne du client dans la table Customer" } }
    - { id: c, text: { en: "The data type of the key column of the Customer table", fr: "Le type de données de la colonne clé de la table Customer" } }
    - { id: d, text: { en: "The primary key value of the customer's row", fr: "La valeur de clé primaire de la ligne du client" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each instance of an entity has a primary key that identifies it, and other tables refer to the instance by storing that key value. The order row therefore contains the key of the customer, and the details of the customer stay in the Customer table only.
    fr: |
      Chaque instance d'une entité possède une clé primaire qui l'identifie, et les autres tables font référence à l'instance en stockant cette valeur de clé. La ligne de SalesOrder contient donc la clé du client, et les détails du client restent uniquement dans la table Customer.
  options:
    a: { en: "Copying the details duplicates data in every order, and a name doesn't identify a customer reliably.", fr: "Copier les détails duplique les données dans chaque commande, et un nom n'identifie pas un client de façon fiable." }
    b: { en: "Rows have no fixed position in a table; a row is found by its key value.", fr: "Les lignes n'ont pas de position fixe dans une table ; une ligne se retrouve par sa valeur de clé." }
    c: { en: "A data type describes the kind of value in a column; it doesn't designate a particular customer.", fr: "Un type de données décrit la nature des valeurs d'une colonne ; il ne désigne pas un client en particulier." }
references:
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
