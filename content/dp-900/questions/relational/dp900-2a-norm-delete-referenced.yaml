id: dp900-2a-norm-delete-referenced
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A database contains a table named **Customer** and a table named **SalesOrder**. The CustomerID column of SalesOrder is a foreign key to Customer, the database enforces referential integrity, and no cascading action is defined. Customer 17 exists and has three orders.

    Which operation does the database reject?
  fr: |
    Une base de données contient une table nommée **Customer** et une table nommée **SalesOrder**. La colonne CustomerID de SalesOrder est une clé étrangère vers Customer, la base de données applique l'intégrité référentielle et aucune action en cascade n'est définie. Le client 17 existe et a trois commandes.

    Quelle opération la base de données rejette-t-elle ?
body:
  options:
    - { id: a, text: { en: "Adding a fourth order of customer 17 to the SalesOrder table", fr: "L'ajout d'une quatrième commande du client 17 dans la table SalesOrder" } }
    - { id: b, text: { en: "Changing the address of customer 17 in the Customer table", fr: "La modification de l'adresse du client 17 dans la table Customer" } }
    - { id: c, text: { en: "Deleting one order of customer 17 from the SalesOrder table", fr: "La suppression d'une commande du client 17 dans la table SalesOrder" } }
    - { id: d, text: { en: "Deleting the row of customer 17 from the Customer table", fr: "La suppression de la ligne du client 17 dans la table Customer" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Referential integrity guarantees that every foreign key value has a matching primary key in the related table. Deleting customer 17 would leave three orders that refer to a customer that no longer exists, so the deletion fails. The other operations keep every order linked to an existing customer.
    fr: |
      L'intégrité référentielle garantit que chaque valeur de clé étrangère a une clé primaire correspondante dans la table associée. Supprimer le client 17 laisserait trois commandes qui font référence à un client qui n'existe plus : la suppression échoue donc. Les autres opérations laissent chaque commande liée à un client existant.
  options:
    a: { en: "Customer 17 exists, so a new order that refers to it respects the foreign key.", fr: "Le client 17 existe : une nouvelle commande qui y fait référence respecte donc la clé étrangère." }
    b: { en: "The address isn't a key; changing it doesn't affect the link between the orders and the customer.", fr: "L'adresse n'est pas une clé ; la modifier n'affecte pas le lien entre les commandes et le client." }
    c: { en: "No row refers to the order that is removed, and the remaining orders still refer to an existing customer.", fr: "Aucune ligne ne fait référence à la commande supprimée, et les commandes restantes font toujours référence à un client existant." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Primary and foreign key constraints"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
