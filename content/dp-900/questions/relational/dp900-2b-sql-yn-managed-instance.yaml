id: dp900-2b-sql-yn-managed-instance
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure SQL Managed Instance, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure SQL Managed Instance, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure SQL Managed Instance gives you administrative access to the operating system that hosts the instance.
        fr: Azure SQL Managed Instance vous donne un accès d'administration au système d'exploitation qui héberge l'instance.
    - id: s2
      text:
        en: An instance of Azure SQL Managed Instance hosts only one database.
        fr: Une instance d'Azure SQL Managed Instance n'héberge qu'une seule base de données.
    - id: s3
      text:
        en: Azure SQL Managed Instance is more compatible with an on-premises SQL Server than Azure SQL Database is.
        fr: Azure SQL Managed Instance est plus compatible avec un SQL Server local que ne l'est Azure SQL Database.
answer:
  values: {s1: false, s2: false, s3: true}
explanation:
  correct:
    en: 'Azure SQL Managed Instance is a PaaS service: Azure manages the operating system, to which you have no access. Each managed instance supports several databases, with near-100% compatibility with an on-premises SQL Server, which is higher than the compatibility of Azure SQL Database.'
    fr: 'Azure SQL Managed Instance est un service PaaS : Azure gère le système d''exploitation, auquel vous n''avez pas accès. Chaque instance managée prend en charge plusieurs bases de données, avec une compatibilité proche de 100 % avec un SQL Server local, supérieure à celle d''Azure SQL Database.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL Managed Instance?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview
