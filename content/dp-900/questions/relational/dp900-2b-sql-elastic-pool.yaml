id: dp900-2b-sql-elastic-pool
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum hosts 60 databases in Azure SQL Database, one for each customer. Each database is used little on average, with peaks of activity that occur at different times.

    You need to let the databases share the same compute and storage resources for a set price.

    What should you use?
  fr: |
    Adatum héberge 60 bases de données dans Azure SQL Database, une par client. Chaque base de données est peu utilisée en moyenne, avec des pics d'activité qui surviennent à des moments différents.

    Vous devez permettre aux bases de données de partager les mêmes ressources de calcul et de stockage pour un prix fixe.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: The Hyperscale service tier
        fr: Le niveau de service Hyperscale
    - id: b
      text:
        en: An instance pool
        fr: Un pool d'instances
    - id: c
      text:
        en: A single database for each customer, sized for its peak
        fr: Une base de données unique par client, dimensionnée pour son pic
    - id: d
      text:
        en: An elastic pool
        fr: Un pool élastique
answer: {optionId: d}
explanation:
  correct:
    en: 'An elastic pool is a set of compute and storage resources, at a set price, that several databases of Azure SQL Database share. It suits many databases with low average use and peaks at different times: each database takes resources from the pool when it needs them, which costs less than sizing every database for its peak.'
    fr: 'Un pool élastique est un ensemble de ressources de calcul et de stockage, à prix fixe, que plusieurs bases de données Azure SQL Database partagent. Il convient à de nombreuses bases de données peu utilisées en moyenne dont les pics surviennent à des moments différents : chaque base de données puise dans le pool quand elle en a besoin, ce qui coûte moins cher que de dimensionner chaque base de données pour son pic.'
  options:
    a:
      en: Hyperscale is a service tier for very large databases, up to 128 TB; it doesn't make databases share resources.
      fr: Hyperscale est un niveau de service pour les très grandes bases de données, jusqu'à 128 To ; il ne fait pas partager de ressources entre des bases de données.
    b:
      en: An instance pool shares resources among instances of Azure SQL Managed Instance, not among databases of Azure SQL Database.
      fr: Un pool d'instances partage des ressources entre des instances Azure SQL Managed Instance, pas entre des bases de données Azure SQL Database.
    c:
      en: 'Single databases each have their own resources: nothing is shared, and each one is paid for at its peak size.'
      fr: 'Les bases de données uniques ont chacune leurs propres ressources : rien n''est partagé, et chacune est payée à sa taille de pic.'
references:
  - title: Elastic pools help you manage and scale multiple databases in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
