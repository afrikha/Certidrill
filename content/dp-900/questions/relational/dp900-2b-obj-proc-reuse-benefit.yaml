id: dp900-2b-obj-proc-reuse-benefit
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three applications of Northwind Traders send the same series of SQL statements to the database to record a customer return.

    You move these statements into a stored procedure that each application calls.

    What is a benefit of this change?
  fr: |
    Trois applications de Northwind Traders envoient la même série d'instructions SQL à la base de données pour enregistrer un retour client.

    Vous déplacez ces instructions dans une procédure stockée que chaque application appelle.

    Quel est un avantage de ce changement ?
body:
  options:
    - id: a
      text:
        en: The rows that the statements modify are stored a second time in the procedure.
        fr: Les lignes que les instructions modifient sont stockées une seconde fois dans la procédure.
    - id: b
      text:
        en: The logic is defined once in the database and reused by every application.
        fr: La logique est définie une seule fois dans la base de données et réutilisée par chaque application.
    - id: c
      text:
        en: The tables that the statements use are read faster by all the other queries.
        fr: Les tables que les instructions utilisent sont lues plus vite par toutes les autres requêtes.
    - id: d
      text:
        en: The statements run automatically each time that a row of a table is read.
        fr: Les instructions s'exécutent automatiquement chaque fois qu'une ligne d'une table est lue.
answer: {optionId: b}
explanation:
  correct:
    en: A stored procedure encapsulates the logic of an action inside the database. The applications only call the procedure, so the statements are written and maintained in one place instead of in each application.
    fr: 'Une procédure stockée encapsule la logique d''une action dans la base de données. Les applications se contentent d''appeler la procédure : les instructions sont écrites et maintenues à un seul endroit, et non dans chaque application.'
  options:
    a:
      en: A stored procedure stores statements, not rows of data.
      fr: Une procédure stockée stocke des instructions, pas des lignes de données.
    c:
      en: Making the reading of a table faster is the role of an index.
      fr: Accélérer la lecture d'une table est le rôle d'un index.
    d:
      en: A stored procedure runs on command, when an application calls it.
      fr: Une procédure stockée s'exécute à la demande, lorsqu'une application l'appelle.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Stored procedures (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/stored-procedures-database-engine
