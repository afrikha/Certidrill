id: dp900-2b-oss-dnd-engines
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the database system that it describes.

    To answer, drag the appropriate database system to each description. Each database system may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au système de base de données qu'elle décrit.

    Pour répondre, faites glisser le système de base de données approprié vers chaque description. Chaque système de base de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: mysql
      text: MySQL
    - id: pg
      text: PostgreSQL
    - id: sqlserver
      text: SQL Server
    - id: cassandra
      text: Apache Cassandra
  targets:
    - id: t1
      text:
        en: Open-source database available in a free Community edition and in commercial Standard and Enterprise editions
        fr: Base de données open source disponible dans une édition Community gratuite et dans des éditions commerciales Standard et Enterprise
    - id: t2
      text:
        en: Open-source object-relational database that can store geometric data such as lines, circles and polygons
        fr: Base de données objet-relationnelle open source capable de stocker des données géométriques comme des lignes, des cercles et des polygones
    - id: t3
      text:
        en: Database engine on which the services of the Azure SQL family are built
        fr: Moteur de base de données sur lequel reposent les services de la famille Azure SQL
answer:
  mapping: {t1: mysql, t2: pg, t3: sqlserver}
explanation:
  correct:
    en: 'MySQL comes in three editions: Community, which is free, and Standard and Enterprise, which are commercial. PostgreSQL is an object-relational database: it stores data in relational tables, supports custom data types and can handle geometric data. The Azure SQL services are based on the SQL Server database engine. Apache Cassandra is a non-relational database.'
    fr: 'MySQL existe en trois éditions : Community, qui est gratuite, et Standard et Enterprise, qui sont commerciales. PostgreSQL est une base de données objet-relationnelle : elle stocke les données dans des tables relationnelles, prend en charge des types de données personnalisés et sait traiter des données géométriques. Les services Azure SQL sont basés sur le moteur de base de données SQL Server. Apache Cassandra est une base de données non relationnelle.'
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
