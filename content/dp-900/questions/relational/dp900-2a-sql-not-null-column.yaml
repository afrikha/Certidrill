id: dp900-2a-sql-not-null-column
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing a CREATE TABLE statement for a table named **Product**. Every product must have a name, and two products can have the same name.

    How should you define the Name column?
  fr: |
    Vous écrivez une instruction CREATE TABLE pour une table nommée **Product**. Chaque produit doit avoir un nom, et deux produits peuvent avoir le même nom.

    Comment devez-vous définir la colonne Name ?
body:
  options:
    - { id: a, text: "Name VARCHAR(20) NULL" }
    - { id: b, text: "Name VARCHAR(20) PRIMARY KEY" }
    - { id: c, text: "Name INT NOT NULL" }
    - { id: d, text: "Name VARCHAR(20) NOT NULL" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NOT NULL makes a column mandatory: a row can't be stored without a value in it, while the same value can appear in several rows. A variable-length character type such as VARCHAR suits a name.
    fr: |
      NOT NULL rend une colonne obligatoire : une ligne ne peut pas être stockée sans valeur dans cette colonne, tandis que la même valeur peut apparaître dans plusieurs lignes. Un type caractère de longueur variable comme VARCHAR convient à un nom.
  options:
    a: { en: "NULL lets a product be stored without a name.", fr: "NULL permet de stocker un produit sans nom." }
    b: { en: "A primary key must be unique, so two products couldn't have the same name.", fr: "Une clé primaire doit être unique : deux produits ne pourraient donc pas avoir le même nom." }
    c: { en: "INT stores whole numbers, not the text of a name.", fr: "INT stocke des nombres entiers, pas le texte d'un nom." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
