id: dp900-2b-obj-proc-encapsulate-logic
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several applications of Contoso must apply a discount to a product. Each application will pass the product ID and the discount percentage, and the database must then run the same `UPDATE` logic.

    Which database object should you create?
  fr: |
    Plusieurs applications de Contoso doivent appliquer une remise à un produit. Chaque application transmettra l'ID du produit et le pourcentage de remise, et la base de données devra alors exécuter la même logique `UPDATE`.

    Quel objet de base de données devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: A stored procedure
        fr: Une procédure stockée
    - id: b
      text:
        en: A view
        fr: Une vue
    - id: c
      text:
        en: An index
        fr: Un index
    - id: d
      text:
        en: A table
        fr: Une table
answer: {optionId: a}
explanation:
  correct:
    en: A stored procedure is a set of SQL statements saved in the database and run on command. It can define parameters, here the product ID and the discount percentage, so every application runs the same logic by calling it.
    fr: 'Une procédure stockée est un ensemble d''instructions SQL enregistrées dans la base de données et exécutées à la demande. Elle peut définir des paramètres, ici l''ID du produit et le pourcentage de remise : chaque application exécute donc la même logique en l''appelant.'
  options:
    b:
      en: A view is a virtual table defined by a SELECT query. It's read like a table; it isn't the object that runs update logic with parameters.
      fr: Une vue est une table virtuelle définie par une requête SELECT. Elle se lit comme une table ; ce n'est pas l'objet qui exécute une logique de mise à jour avec des paramètres.
    c:
      en: An index speeds up the search of rows; it doesn't contain any logic.
      fr: Un index accélère la recherche des lignes ; il ne contient aucune logique.
    d:
      en: A table stores rows of data, not statements to run.
      fr: Une table stocke des lignes de données, pas des instructions à exécuter.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Stored procedures (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/stored-procedures-database-engine
