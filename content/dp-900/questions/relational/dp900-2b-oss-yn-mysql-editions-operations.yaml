id: dp900-2b-oss-yn-mysql-editions-operations
objective: "2.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about MySQL and Azure Database for MySQL, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur MySQL et Azure Database pour MySQL, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Every administration operation of an on-premises MySQL server is also available in Azure Database for MySQL.
        fr: Toutes les opérations d'administration d'un serveur MySQL local sont également disponibles dans Azure Database pour MySQL.
    - id: s2
      text:
        en: The Standard and Enterprise editions of MySQL are free of charge.
        fr: Les éditions Standard et Enterprise de MySQL sont gratuites.
    - id: s3
      text:
        en: In Azure Database for MySQL, you can set server parameters such as the maximum number of connections.
        fr: Dans Azure Database pour MySQL, vous pouvez définir des paramètres de serveur comme le nombre maximal de connexions.
answer:
  values: {s1: false, s2: false, s3: true}
explanation:
  correct:
    en: Because Azure manages the database server, certain operations, mainly related to security and administration, aren't available in Azure Database for MySQL. Only the Community edition of MySQL is free; Standard and Enterprise are commercial editions. The service still exposes many server parameters, such as the lock modes, the maximum number of connections and the timeouts.
    fr: Comme Azure gère le serveur de base de données, certaines opérations, surtout liées à la sécurité et à l'administration, ne sont pas disponibles dans Azure Database pour MySQL. Seule l'édition Community de MySQL est gratuite ; Standard et Enterprise sont des éditions commerciales. Le service expose néanmoins de nombreux paramètres de serveur, comme les modes de verrouillage, le nombre maximal de connexions et les délais d'expiration.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
