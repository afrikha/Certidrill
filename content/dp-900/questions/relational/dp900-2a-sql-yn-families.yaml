id: dp900-2a-sql-yn-families
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "CREATE TABLE is a Data Definition Language (DDL) statement.", fr: "CREATE TABLE est une instruction du langage de définition de données (DDL)." } }
    - { id: s2, text: { en: "DELETE is a Data Definition Language (DDL) statement.", fr: "DELETE est une instruction du langage de définition de données (DDL)." } }
    - { id: s3, text: { en: "DENY is a Data Control Language (DCL) statement.", fr: "DENY est une instruction du langage de contrôle des données (DCL)." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      DDL statements (CREATE, ALTER, DROP, RENAME) create, modify and remove objects such as tables. DELETE removes rows from a table, so it belongs to the DML with SELECT, INSERT and UPDATE. DENY manages permissions with GRANT and REVOKE, which makes it a DCL statement.
    fr: |
      Les instructions DDL (CREATE, ALTER, DROP, RENAME) créent, modifient et suppriment des objets comme les tables. DELETE supprime des lignes d'une table : elle appartient donc au DML, avec SELECT, INSERT et UPDATE. DENY gère les autorisations avec GRANT et REVOKE, ce qui en fait une instruction DCL.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
