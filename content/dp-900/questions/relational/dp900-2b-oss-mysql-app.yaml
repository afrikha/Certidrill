id: dp900-2b-oss-mysql-app
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a web application that stores its data in an on-premises MySQL database.

    Contoso wants to move the database to a platform as a service (PaaS) offering in Azure without significant changes to the application.

    Which service should you recommend?
  fr: |
    Contoso exécute une application web qui stocke ses données dans une base de données MySQL locale.

    Contoso veut déplacer la base de données vers une offre de plateforme en tant que service (PaaS) dans Azure sans modification importante de l'application.

    Quel service devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure SQL Database
    - id: b
      text:
        en: Azure Database for PostgreSQL
        fr: Azure Database pour PostgreSQL
    - id: c
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
    - id: d
      text:
        en: Azure Database for MySQL
        fr: Azure Database pour MySQL
answer: {optionId: d}
explanation:
  correct:
    en: Azure Database for MySQL is a PaaS implementation of MySQL in Azure, based on the MySQL Community Edition. An application written for MySQL keeps working with it, so the database can move to Azure without significant application changes.
    fr: 'Azure Database pour MySQL est une implémentation PaaS de MySQL dans Azure, basée sur MySQL Community Edition. Une application écrite pour MySQL continue de fonctionner avec ce service : la base de données peut donc être déplacée vers Azure sans modification importante de l''application.'
  options:
    a:
      en: 'Azure SQL Database runs the SQL Server engine and uses Transact-SQL: the application would have to be changed.'
      fr: 'Azure SQL Database exécute le moteur SQL Server et utilise Transact-SQL : il faudrait modifier l''application.'
    b:
      en: 'Azure Database for PostgreSQL runs the PostgreSQL engine: an application written for MySQL would have to be adapted.'
      fr: 'Azure Database pour PostgreSQL exécute le moteur PostgreSQL : une application écrite pour MySQL devrait être adaptée.'
    c:
      en: SQL Server on Azure Virtual Machines is IaaS and runs SQL Server, not MySQL.
      fr: SQL Server sur Machines Virtuelles Azure est un service IaaS et exécute SQL Server, pas MySQL.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
