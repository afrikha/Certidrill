id: dp900-2b-sql-serverless
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a single test database in Azure SQL Database. The database is used a few hours a day, at unpredictable times.

    You need compute resources that scale automatically with the workload, that are billed for the compute used, and that let the database pause while it's inactive.

    What should you use?
  fr: |
    Litware possède une seule base de données de test dans Azure SQL Database. La base de données est utilisée quelques heures par jour, à des moments imprévisibles.

    Vous avez besoin de ressources de calcul qui se mettent à l'échelle automatiquement selon la charge de travail, qui sont facturées selon le calcul utilisé et qui permettent à la base de données de se mettre en pause quand elle est inactive.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: The serverless compute tier
        fr: Le niveau de calcul serverless
    - id: b
      text:
        en: The provisioned compute tier
        fr: Le niveau de calcul provisionné
    - id: c
      text:
        en: An elastic pool
        fr: Un pool élastique
    - id: d
      text:
        en: The Hyperscale service tier
        fr: Le niveau de service Hyperscale
answer: {optionId: a}
explanation:
  correct:
    en: With the serverless compute tier, the compute of a single database scales automatically within a configured range and is billed for the amount used. The database can pause automatically when it's inactive, and only the storage is then billed, which suits intermittent and unpredictable use.
    fr: Avec le niveau de calcul serverless, le calcul d'une base de données unique se met à l'échelle automatiquement dans une plage configurée et est facturé selon la quantité utilisée. La base de données peut se mettre en pause automatiquement quand elle est inactive, et seul le stockage est alors facturé, ce qui convient à un usage intermittent et imprévisible.
  options:
    b:
      en: With provisioned compute, a fixed amount of resources is allocated in advance and billed per hour, whether the database is used or not.
      fr: Avec le calcul provisionné, une quantité fixe de ressources est allouée à l'avance et facturée à l'heure, que la base de données soit utilisée ou non.
    c:
      en: An elastic pool shares resources among several databases and is billed for as long as it exists; here there's a single database.
      fr: Un pool élastique partage des ressources entre plusieurs bases de données et est facturé tant qu'il existe ; ici, il n'y a qu'une seule base de données.
    d:
      en: Hyperscale is a service tier for very large databases; by itself, it neither bills the compute by use nor pauses the database.
      fr: Hyperscale est un niveau de service pour les très grandes bases de données ; à lui seul, il ne facture pas le calcul à l'usage et ne met pas la base de données en pause.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
