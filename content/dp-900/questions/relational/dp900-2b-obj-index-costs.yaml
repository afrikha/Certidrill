id: dp900-2b-obj-index-costs
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to add several indexes to a table that receives many `INSERT`, `UPDATE` and `DELETE` operations.

    Which two effects should you expect?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'ajouter plusieurs index à une table qui reçoit de nombreuses opérations `INSERT`, `UPDATE` et `DELETE`.

    À quels deux effets devez-vous vous attendre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: The duplicate rows of the table are removed.
        fr: Les lignes en double de la table sont supprimées.
    - id: b
      text:
        en: The indexes consume additional storage space.
        fr: Les index consomment de l'espace de stockage supplémentaire.
    - id: c
      text:
        en: Every query on the table uses at least one of the indexes.
        fr: Chaque requête sur la table utilise au moins un des index.
    - id: d
      text:
        en: The operations that modify the rows become slower.
        fr: Les opérations qui modifient les lignes deviennent plus lentes.
answer: {optionIds: [b, d]}
explanation:
  correct:
    en: Indexes aren't free. Each index is an additional structure that consumes storage, and it must be maintained each time a row is inserted, updated or deleted, which slows down those operations. You balance faster searches against this cost.
    fr: Les index ne sont pas gratuits. Chaque index est une structure supplémentaire qui consomme du stockage, et il doit être tenu à jour à chaque insertion, mise à jour ou suppression de ligne, ce qui ralentit ces opérations. Il faut mettre en balance des recherches plus rapides et ce coût.
  options:
    a:
      en: An index doesn't change the data of the table; it only helps to find the rows.
      fr: Un index ne modifie pas les données de la table ; il aide seulement à trouver les lignes.
    c:
      en: 'An index is used only when it helps: a query that filters on a column without an index reads the table.'
      fr: 'Un index n''est utilisé que s''il est utile : une requête qui filtre sur une colonne sans index lit la table.'
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
