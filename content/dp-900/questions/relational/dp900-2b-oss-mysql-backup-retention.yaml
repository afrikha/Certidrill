id: dp900-2b-oss-mysql-backup-retention
objective: "2.2.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You create a server in Azure Database for MySQL. The service takes automatic backups that allow a point-in-time restore.

    What is the maximum period for which you can configure the backups to be retained?
  fr: |
    Vous créez un serveur dans Azure Database pour MySQL. Le service effectue des sauvegardes automatiques qui permettent une restauration à un point dans le temps.

    Quelle est la durée maximale de conservation que vous pouvez configurer pour les sauvegardes ?
body:
  options:
    - id: a
      text:
        en: 7 days
        fr: 7 jours
    - id: b
      text:
        en: 14 days
        fr: 14 jours
    - id: c
      text:
        en: 35 days
        fr: 35 jours
    - id: d
      text:
        en: 90 days
        fr: 90 jours
answer: {optionId: c}
explanation:
  correct:
    en: Azure Database for MySQL takes automatic backups and supports point-in-time restore. The backups are retained for 7 days by default, and the retention can be configured up to 35 days.
    fr: Azure Database pour MySQL effectue des sauvegardes automatiques et prend en charge la restauration à un point dans le temps. Les sauvegardes sont conservées 7 jours par défaut, et la conservation peut être configurée jusqu'à 35 jours.
  options:
    a:
      en: Seven days is the default retention period, not the maximum.
      fr: Sept jours est la durée de conservation par défaut, pas le maximum.
    b:
      en: Fourteen days is a possible setting, but the retention can go up to 35 days.
      fr: Quatorze jours est un réglage possible, mais la conservation peut aller jusqu'à 35 jours.
    d:
      en: The retention period of the automatic backups is limited to 35 days.
      fr: La durée de conservation des sauvegardes automatiques est limitée à 35 jours.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
