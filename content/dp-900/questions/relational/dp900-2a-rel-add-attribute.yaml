id: dp900-2a-rel-add-attribute
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A relational database contains a table named **Customer** that has one row per customer. You need to start recording the date of birth of each customer.

    What should you add to the table?
  fr: |
    Une base de données relationnelle contient une table nommée **Customer** qui comporte une ligne par client. Vous devez commencer à enregistrer la date de naissance de chaque client.

    Que devez-vous ajouter à la table ?
body:
  options:
    - { id: a, text: { en: "A column", fr: "Une colonne" } }
    - { id: b, text: { en: "A row", fr: "Une ligne" } }
    - { id: c, text: { en: "A primary key", fr: "Une clé primaire" } }
    - { id: d, text: { en: "A foreign key", fr: "Une clé étrangère" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The date of birth is an attribute of the customer entity, and each attribute of an entity is stored in a column of the table. The new column gets a data type suited to dates, and every existing row then has that column.
    fr: |
      La date de naissance est un attribut de l'entité client, et chaque attribut d'une entité est stocké dans une colonne de la table. La nouvelle colonne reçoit un type de données adapté aux dates, et chaque ligne existante possède alors cette colonne.
  options:
    b: { en: "A new row would add one more customer; it wouldn't add a piece of information to the existing customers.", fr: "Une nouvelle ligne ajouterait un client de plus ; elle n'ajouterait pas une information aux clients existants." }
    c: { en: "A primary key identifies each row uniquely; a date of birth describes a customer and can be shared by several customers.", fr: "Une clé primaire identifie chaque ligne de façon unique ; une date de naissance décrit un client et peut être commune à plusieurs clients." }
    d: { en: "A foreign key refers to a row of another table; a date of birth is a plain value of the customer.", fr: "Une clé étrangère fait référence à une ligne d'une autre table ; une date de naissance est une simple valeur du client." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
