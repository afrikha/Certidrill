id: dp900-2a-rel-suitable-dataset
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has four sets of data to store.

    Which set is best suited to the tables of a relational database?
  fr: |
    Litware doit stocker quatre ensembles de données.

    Quel ensemble convient le mieux aux tables d'une base de données relationnelle ?
body:
  options:
    - { id: a, text: { en: "Product descriptions saved as JSON documents whose fields differ from one product to another", fr: "Des descriptions de produits enregistrées sous forme de documents JSON dont les champs diffèrent d'un produit à l'autre" } }
    - { id: b, text: { en: "Video recordings of the training sessions that Litware delivers to its customers", fr: "Des enregistrements vidéo des sessions de formation que Litware dispense à ses clients" } }
    - { id: c, text: { en: "Customer and order records that all have the same fields, each order referring to one customer", fr: "Des enregistrements de clients et de commandes qui ont tous les mêmes champs, chaque commande faisant référence à un client" } }
    - { id: d, text: { en: "Scanned images of the paper contracts that the customers of Litware have signed", fr: "Des images numérisées des contrats papier que les clients de Litware ont signés" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Relational tables hold structured data: every record of an entity has the same fields, and records refer to one another through key values, as orders refer to customers. The other sets are semi-structured or unstructured.
    fr: |
      Les tables relationnelles contiennent des données structurées : tous les enregistrements d'une entité ont les mêmes champs, et les enregistrements se référencent par des valeurs de clé, comme les commandes référencent les clients. Les autres ensembles sont semi-structurés ou non structurés.
  options:
    a: { en: "JSON documents whose fields vary are semi-structured data, which suits a document database.", fr: "Des documents JSON dont les champs varient sont des données semi-structurées, adaptées à une base de données de documents." }
    b: { en: "Video files are unstructured data, which belongs in a file or object store.", fr: "Les fichiers vidéo sont des données non structurées, qui relèvent d'un magasin de fichiers ou d'objets." }
    d: { en: "Scanned images are unstructured data; they have no fields to store in columns.", fr: "Les images numérisées sont des données non structurées ; elles n'ont pas de champs à stocker dans des colonnes." }
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore databases"
