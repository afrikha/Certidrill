id: dp900-2b-obj-yn-procedures
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about stored procedures, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les procédures stockées, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A stored procedure is a virtual table that you read by using a `SELECT ... FROM` query.
        fr: Une procédure stockée est une table virtuelle que vous lisez avec une requête `SELECT ... FROM`.
    - id: s2
      text:
        en: A stored procedure can receive parameters, such as a product ID.
        fr: Une procédure stockée peut recevoir des paramètres, par exemple un ID de produit.
    - id: s3
      text:
        en: A stored procedure runs automatically each time a row is inserted into a table.
        fr: Une procédure stockée s'exécute automatiquement chaque fois qu'une ligne est insérée dans une table.
answer:
  values: {s1: false, s2: true, s3: false}
explanation:
  correct:
    en: A stored procedure is a set of SQL statements saved in the database. It's run on command, for example with the EXEC statement in Transact-SQL, and it can define parameters whose values the caller supplies. The virtual table that is read with SELECT is a view.
    fr: Une procédure stockée est un ensemble d'instructions SQL enregistrées dans la base de données. Elle s'exécute à la demande, par exemple avec l'instruction EXEC en Transact-SQL, et elle peut définir des paramètres dont l'appelant fournit les valeurs. La table virtuelle qui se lit avec SELECT est une vue.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Stored procedures (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/stored-procedures-database-engine
