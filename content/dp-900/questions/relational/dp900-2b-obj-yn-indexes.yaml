id: dp900-2b-obj-yn-indexes
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about indexes, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les index, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A table can have more than one index.
        fr: Une table peut avoir plusieurs index.
    - id: s2
      text:
        en: An index changes the rows that a query returns.
        fr: Un index modifie les lignes qu'une requête renvoie.
    - id: s3
      text:
        en: An index can be created on a column that isn't the primary key.
        fr: Un index peut être créé sur une colonne qui n'est pas la clé primaire.
answer:
  values: {s1: true, s2: false, s3: true}
explanation:
  correct:
    en: 'You can create many indexes on a table, each on the column or columns that queries search, whether or not they belong to the primary key. An index only helps the database locate rows faster: a query returns the same rows with or without it.'
    fr: 'Vous pouvez créer de nombreux index sur une table, chacun sur la ou les colonnes que les requêtes recherchent, qu''elles fassent partie de la clé primaire ou non. Un index aide seulement la base de données à localiser les lignes plus vite : une requête renvoie les mêmes lignes avec ou sans lui.'
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Clustered and nonclustered indexes
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described
