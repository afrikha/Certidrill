id: dp900-2b-sql-dd-protection-features
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To detect anomalous activities, such as potential SQL injection attacks, against a database in Azure SQL Database, you use [[f1]].

      To bring a database back to the state that it had at an earlier time, you use [[f2]].
    fr: |
      Pour détecter les activités anormales, par exemple de possibles attaques par injection de code SQL, contre une base de données Azure SQL Database, vous utilisez [[f1]].

      Pour ramener une base de données à l'état qu'elle avait à un moment antérieur, vous utilisez [[f2]].
  slots:
    - id: f1
      options:
        - id: pool
          text:
            en: an elastic pool
            fr: un pool élastique
        - id: enc
          text:
            en: data encryption at rest
            fr: le chiffrement des données au repos
        - id: defender
          text:
            en: Microsoft Defender for SQL
            fr: Microsoft Defender pour SQL
        - id: sless
          text:
            en: the serverless compute tier
            fr: le niveau de calcul serverless
    - id: f2
      options:
        - id: audit
          text:
            en: auditing
            fr: l'audit
        - id: pitr
          text:
            en: point-in-time restore
            fr: la restauration à un point dans le temps
        - id: repl
          text:
            en: replication to another region
            fr: la réplication vers une autre région
        - id: hs
          text:
            en: the Hyperscale service tier
            fr: le niveau de service Hyperscale
answer:
  values: {f1: defender, f2: pitr}
explanation:
  correct:
    en: Microsoft Defender for SQL includes Advanced Threat Protection, which detects anomalous activities such as SQL injection attacks and unusual access patterns. Point-in-time restore uses the automated backups to recover a database to a state that it had in the past.
    fr: Microsoft Defender pour SQL inclut Advanced Threat Protection, qui détecte les activités anormales comme les attaques par injection de code SQL et les modes d'accès inhabituels. La restauration à un point dans le temps utilise les sauvegardes automatisées pour récupérer une base de données dans un état qu'elle avait dans le passé.
  options:
    enc:
      en: Encryption protects the stored data from being read; it doesn't detect attacks.
      fr: Le chiffrement empêche la lecture des données stockées ; il ne détecte pas les attaques.
    audit:
      en: Auditing records the events of the database in a destination such as a storage account; it doesn't restore data.
      fr: L'audit enregistre les événements de la base de données dans une destination telle qu'un compte de stockage ; il ne restaure pas de données.
    repl:
      en: Replication keeps a current copy of the database in another region for disaster recovery, not an earlier state.
      fr: La réplication conserve une copie à jour de la base de données dans une autre région pour la récupération d'urgence, pas un état antérieur.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
