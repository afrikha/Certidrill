id: dp900-2a-rel-primary-key-traits
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe the primary key of a table in a relational database?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent la clé primaire d'une table dans une base de données relationnelle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It has a different value in every row of the table.", fr: "Elle a une valeur différente dans chaque ligne de la table." } }
    - { id: b, text: { en: "It must consist of a single column of the table.", fr: "Elle doit être constituée d'une seule colonne de la table." } }
    - { id: c, text: { en: "It must store numeric values, such as an ID.", fr: "Elle doit stocker des valeurs numériques, comme un ID." } }
    - { id: d, text: { en: "It has a value in every row of the table.", fr: "Elle a une valeur dans chaque ligne de la table." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A primary key identifies each row of a table uniquely: no two rows can have the same key value, and no row can be left without one. The key can be a number or any other value, and it can be based on one column or on a combination of columns.
    fr: |
      Une clé primaire identifie de façon unique chaque ligne d'une table : deux lignes ne peuvent pas avoir la même valeur de clé, et aucune ligne ne peut en être dépourvue. La clé peut être un nombre ou toute autre valeur, et elle peut reposer sur une colonne ou sur une combinaison de colonnes.
  options:
    b: { en: "A key can be composite, that is, based on a unique combination of several columns.", fr: "Une clé peut être composite, c'est-à-dire basée sur une combinaison unique de plusieurs colonnes." }
    c: { en: "A key is often a numeric ID, but any value that identifies the row uniquely can be used.", fr: "Une clé est souvent un ID numérique, mais toute valeur qui identifie la ligne de façon unique peut convenir." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Primary and foreign key constraints"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
