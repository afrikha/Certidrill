id: dp900-2b-sql-mi-automated-tasks
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company moves its databases to Azure SQL Managed Instance.

    Which two tasks does the service perform automatically?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déplace ses bases de données vers Azure SQL Managed Instance.

    Quelles sont les deux tâches que le service effectue automatiquement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Deciding which users can access the databases
        fr: Décider quels utilisateurs peuvent accéder aux bases de données
    - id: b
      text:
        en: Backing up the databases
        fr: Sauvegarder les bases de données
    - id: c
      text:
        en: Installing the patches of the database software
        fr: Installer les correctifs du logiciel de base de données
    - id: d
      text:
        en: Deciding how much compute and storage the instance gets
        fr: Décider de la quantité de calcul et de stockage attribuée à l'instance
answer: {optionIds: [b, c]}
explanation:
  correct:
    en: Azure SQL Managed Instance automates backups, software patching, database monitoring and other general tasks. The customer keeps control of security, including who can access the databases, and of the resources allocated to the instance.
    fr: Azure SQL Managed Instance automatise les sauvegardes, l'application des correctifs logiciels, la surveillance des bases de données et d'autres tâches générales. Le client garde le contrôle de la sécurité, notamment de qui peut accéder aux bases de données, et des ressources allouées à l'instance.
  options:
    a:
      en: 'Security stays under the customer''s control: the customer decides who can access the data.'
      fr: 'La sécurité reste sous le contrôle du client : c''est lui qui décide qui peut accéder aux données.'
    d:
      en: The allocation of resources stays under the customer's control.
      fr: L'allocation des ressources reste sous le contrôle du client.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL Managed Instance?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview
