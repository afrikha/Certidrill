id: dp900-2a-norm-yn-goals
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Normalization minimizes the duplication of data.", fr: "La normalisation réduit au minimum la duplication des données." } }
    - { id: s2, text: { en: "In a normalized database, the address of a customer is stored in each order of the customer.", fr: "Dans une base de données normalisée, l'adresse d'un client est stockée dans chacune de ses commandes." } }
    - { id: s3, text: { en: "Normalization helps to enforce the integrity of the data.", fr: "La normalisation aide à appliquer l'intégrité des données." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Normalization is defined by its two goals: it minimizes the duplication of data and it enforces data integrity. In a normalized database the address of a customer is stored once, in the row of the customer, and each order only refers to that row.
    fr: |
      La normalisation se définit par ses deux objectifs : elle réduit au minimum la duplication des données et elle applique l'intégrité des données. Dans une base de données normalisée, l'adresse d'un client est stockée une seule fois, dans la ligne du client, et chaque commande fait seulement référence à cette ligne.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
