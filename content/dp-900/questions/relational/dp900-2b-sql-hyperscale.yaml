id: dp900-2b-sql-hyperscale
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new application of Proseware will store its data in Azure SQL Database. The database is expected to reach 60 TB, and backups and restores must remain fast as the data grows.

    Which option should you choose?
  fr: |
    Une nouvelle application de Proseware stockera ses données dans Azure SQL Database. La base de données devrait atteindre 60 To, et les sauvegardes et les restaurations doivent rester rapides à mesure que les données augmentent.

    Quelle option devez-vous choisir ?
body:
  options:
    - id: a
      text:
        en: An elastic pool
        fr: Un pool élastique
    - id: b
      text:
        en: The Hyperscale service tier
        fr: Le niveau de service Hyperscale
    - id: c
      text:
        en: The serverless compute tier
        fr: Le niveau de calcul serverless
    - id: d
      text:
        en: An instance pool
        fr: Un pool d'instances
answer: {optionId: b}
explanation:
  correct:
    en: The Hyperscale service tier of Azure SQL Database supports very large databases, up to 128 TB, with fast scaling and with backups and restores that stay fast regardless of the size of the data. It's the option for databases that outgrow the other service tiers.
    fr: Le niveau de service Hyperscale d'Azure SQL Database prend en charge les très grandes bases de données, jusqu'à 128 To, avec une mise à l'échelle rapide et des sauvegardes et des restaurations qui restent rapides quelle que soit la taille des données. C'est l'option pour les bases de données trop grandes pour les autres niveaux de service.
  options:
    a:
      en: An elastic pool shares resources among several databases to reduce costs; it isn't the option designed for a very large database.
      fr: Un pool élastique partage des ressources entre plusieurs bases de données pour réduire les coûts ; ce n'est pas l'option conçue pour une très grande base de données.
    c:
      en: The serverless compute tier scales and bills the compute according to use; it doesn't address the size of the database.
      fr: Le niveau de calcul serverless met à l'échelle et facture le calcul selon l'usage ; il ne répond pas à la question de la taille de la base de données.
    d:
      en: An instance pool shares resources among instances of Azure SQL Managed Instance; it isn't an option of Azure SQL Database.
      fr: Un pool d'instances partage des ressources entre des instances Azure SQL Managed Instance ; ce n'est pas une option d'Azure SQL Database.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
