id: dp900-2a-sql-dialect-azure-sql
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which dialect of SQL do Microsoft SQL Server and Azure SQL Database use?
  fr: |
    Quel dialecte de SQL Microsoft SQL Server et Azure SQL Database utilisent-ils ?
body:
  options:
    - { id: a, text: "PL/pgSQL" }
    - { id: b, text: "Transact-SQL (T-SQL)" }
    - { id: c, text: "PL/SQL" }
    - { id: d, text: "Kusto Query Language (KQL)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SQL is a standard, and each vendor adds its own extensions, which creates dialects. Transact-SQL (T-SQL) is the dialect of Microsoft SQL Server and of the Azure SQL services.
    fr: |
      SQL est une norme, et chaque éditeur y ajoute ses propres extensions, ce qui crée des dialectes. Transact-SQL (T-SQL) est le dialecte de Microsoft SQL Server et des services Azure SQL.
  options:
    a: { en: "PL/pgSQL is the procedural dialect of PostgreSQL.", fr: "PL/pgSQL est le dialecte procédural de PostgreSQL." }
    c: { en: "PL/SQL is the dialect of Oracle.", fr: "PL/SQL est le dialecte d'Oracle." }
    d: { en: "KQL is a separate query language; it isn't a dialect of SQL.", fr: "KQL est un langage de requête distinct ; ce n'est pas un dialecte de SQL." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
