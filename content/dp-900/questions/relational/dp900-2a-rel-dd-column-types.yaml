id: dp900-2a-rel-dd-column-types
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are defining a table that stores the products of Tailspin Toys. The **Name** column stores text of variable length, the **Price** column stores amounts such as 24.99, and the **Stock** column stores whole numbers of units.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez une table qui stocke les produits de Tailspin Toys. La colonne **Name** stocke du texte de longueur variable, la colonne **Price** stocke des montants comme 24,99 et la colonne **Stock** stocke des nombres entiers d'unités.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    CREATE TABLE Product
    (
        ID INT PRIMARY KEY,
        Name [[name]] NOT NULL,
        Price [[price]] NULL,
        Stock [[stock]] NOT NULL
    );
  slots:
    - id: name
      options:
        - { id: n_int, text: "INT" }
        - { id: n_varchar, text: "VARCHAR(50)" }
        - { id: n_date, text: "DATE" }
        - { id: n_dec, text: "DECIMAL(10,2)" }
    - id: price
      options:
        - { id: p_dec, text: "DECIMAL(10,2)" }
        - { id: p_date, text: "DATE" }
        - { id: p_int, text: "INT" }
        - { id: p_varchar, text: "VARCHAR(50)" }
    - id: stock
      options:
        - { id: s_date, text: "DATE" }
        - { id: s_varchar, text: "VARCHAR(50)" }
        - { id: s_dec, text: "DECIMAL(10,2)" }
        - { id: s_int, text: "INT" }
answer:
  values: { name: n_varchar, price: p_dec, stock: s_int }
explanation:
  correct:
    en: |
      Each column is defined with the data type that matches its values: a character type of variable length (VARCHAR) for the name, a decimal numeric type (DECIMAL) for the price, and an integer type (INT) for the number of units. DATE stores dates, which none of these columns contains.
    fr: |
      Chaque colonne est définie avec le type de données qui correspond à ses valeurs : un type caractère de longueur variable (VARCHAR) pour le nom, un type numérique décimal (DECIMAL) pour le prix et un type entier (INT) pour le nombre d'unités. DATE stocke des dates, qu'aucune de ces colonnes ne contient.
  options:
    p_int: { en: "An integer type can't keep the cents of an amount such as 24.99.", fr: "Un type entier ne peut pas conserver les centimes d'un montant comme 24,99." }
    p_varchar: { en: "Storing amounts as text prevents the database from treating them as numbers.", fr: "Stocker des montants sous forme de texte empêche la base de données de les traiter comme des nombres." }
    s_dec: { en: "Units are whole numbers, so an integer type constrains the values better than a decimal type.", fr: "Les unités sont des nombres entiers : un type entier limite donc mieux les valeurs qu'un type décimal." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
