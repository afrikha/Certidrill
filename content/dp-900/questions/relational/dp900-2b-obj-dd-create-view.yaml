id: dp900-2b-obj-dd-create-view
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A database contains a table named **Customer**. You need a virtual table named **ParisCustomers** that returns the ID and the email address of the customers located in Paris. No data must be copied.

    How should you complete the SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données contient une table nommée **Customer**. Vous avez besoin d'une table virtuelle nommée **ParisCustomers** qui renvoie l'ID et l'adresse e-mail des clients situés à Paris. Aucune donnée ne doit être copiée.

    Comment devez-vous compléter l'instruction SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[obj]] ParisCustomers
    AS
    [[kw]] CustomerID, Email
    FROM Customer
    WHERE City = 'Paris';
  slots:
    - id: obj
      options:
        - {id: index, text: INDEX}
        - {id: proc, text: PROCEDURE}
        - {id: table, text: TABLE}
        - {id: view, text: VIEW}
    - id: kw
      options:
        - {id: exec, text: EXEC}
        - {id: insert, text: INSERT}
        - {id: select, text: SELECT}
        - {id: update, text: UPDATE}
answer:
  values: {obj: view, kw: select}
explanation:
  correct:
    en: 'A view is a virtual table defined by a SELECT query. CREATE VIEW ParisCustomers AS SELECT ... only saves the query: the rows are read from Customer each time the view is queried, so nothing is copied.'
    fr: 'Une vue est une table virtuelle définie par une requête SELECT. CREATE VIEW ParisCustomers AS SELECT ... ne fait qu''enregistrer la requête : les lignes sont lues dans Customer à chaque interrogation de la vue, et rien n''est copié.'
  options:
    index:
      en: An index is created on a column of a table (CREATE INDEX ... ON table(column)); it isn't a virtual table.
      fr: Un index se crée sur une colonne d'une table (CREATE INDEX ... ON table(colonne)) ; ce n'est pas une table virtuelle.
    proc:
      en: A stored procedure is run on command; it isn't a virtual table that is queried with SELECT.
      fr: Une procédure stockée s'exécute à la demande ; ce n'est pas une table virtuelle qui s'interroge avec SELECT.
    table:
      en: 'A table stores its own rows: it would hold a copy of the data.'
      fr: 'Une table stocke ses propres lignes : elle contiendrait une copie des données.'
    exec:
      en: EXEC runs a stored procedure; a view is defined by a SELECT query.
      fr: EXEC exécute une procédure stockée ; une vue est définie par une requête SELECT.
    update:
      en: UPDATE modifies rows; it doesn't return the columns of a query.
      fr: UPDATE modifie des lignes ; elle ne renvoie pas les colonnes d'une requête.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
