id: dp900-2a-rel-yn-model
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A relational database stores each record as a JSON document whose fields can differ from one record to the next.", fr: "Une base de données relationnelle stocke chaque enregistrement sous la forme d'un document JSON dont les champs peuvent différer d'un enregistrement à l'autre." } }
    - { id: s2, text: { en: "The tables of a relational database can reference one another by using key values.", fr: "Les tables d'une base de données relationnelle peuvent se référencer les unes les autres à l'aide de valeurs de clé." } }
    - { id: s3, text: { en: "The tables of a relational database are managed and queried by using SQL.", fr: "Les tables d'une base de données relationnelle sont gérées et interrogées à l'aide de SQL." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In the relational model, a table refers to a row of another table by storing its key value. Records are rows that all have the same columns, not JSON documents with varying fields, which describe a document database. Relational tables are managed and queried with SQL.
    fr: |
      Dans le modèle relationnel, une table fait référence à une ligne d'une autre table en stockant sa valeur de clé. Les enregistrements sont des lignes qui ont toutes les mêmes colonnes, et non des documents JSON aux champs variables, qui décrivent une base de données de documents. Les tables relationnelles sont gérées et interrogées avec SQL.
references:
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
