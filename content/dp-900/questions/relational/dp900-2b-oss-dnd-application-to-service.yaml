id: dp900-2b-oss-dnd-application-to-service
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to move three applications to Azure. Each database must run on a platform as a service (PaaS) offering, with as few changes to the application as possible.

    Which service should you use for each application? To answer, drag the appropriate service to each application. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de déplacer trois applications vers Azure. Chaque base de données doit s'exécuter sur une offre de plateforme en tant que service (PaaS), avec le moins de modifications possible de l'application.

    Quel service devez-vous utiliser pour chaque application ? Pour répondre, faites glisser le service approprié vers chaque application. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: mysql
      text:
        en: Azure Database for MySQL
        fr: Azure Database pour MySQL
    - id: pg
      text:
        en: Azure Database for PostgreSQL
        fr: Azure Database pour PostgreSQL
    - id: sqldb
      text: Azure SQL Database
    - id: cosmos
      text: Azure Cosmos DB for NoSQL
  targets:
    - id: t1
      text:
        en: An application whose stored procedures are written in PL/pgSQL
        fr: Une application dont les procédures stockées sont écrites en PL/pgSQL
    - id: t2
      text:
        en: A new application whose queries are written in Transact-SQL
        fr: Une nouvelle application dont les requêtes sont écrites en Transact-SQL
    - id: t3
      text:
        en: A PHP web application written for a MySQL database
        fr: Une application web PHP écrite pour une base de données MySQL
answer:
  mapping: {t1: pg, t2: sqldb, t3: mysql}
explanation:
  correct:
    en: The service that requires the fewest changes is the managed service of the engine for which the application was written. PL/pgSQL is the procedural language of PostgreSQL, so that application goes to Azure Database for PostgreSQL. Transact-SQL is the dialect of the Azure SQL services, here Azure SQL Database. The MySQL application goes to Azure Database for MySQL.
    fr: 'Le service qui exige le moins de modifications est le service managé du moteur pour lequel l''application a été écrite. PL/pgSQL est le langage procédural de PostgreSQL : cette application va donc vers Azure Database pour PostgreSQL. Transact-SQL est le dialecte des services Azure SQL, ici Azure SQL Database. L''application MySQL va vers Azure Database pour MySQL.'
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: Explore SQL
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
