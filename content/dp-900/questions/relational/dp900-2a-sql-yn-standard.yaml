id: dp900-2a-sql-yn-standard
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Every relational database system implements the same SQL, without vendor-specific extensions.", fr: "Tous les systèmes de base de données relationnelle implémentent le même SQL, sans extensions propres à chaque éditeur." } }
    - { id: s2, text: { en: "SQL is a standard of both ANSI and ISO.", fr: "SQL est une norme à la fois de l'ANSI et de l'ISO." } }
    - { id: s3, text: { en: "PL/SQL is the dialect of SQL that Oracle uses.", fr: "PL/SQL est le dialecte de SQL utilisé par Oracle." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      SQL was standardized by ANSI in 1986 and by ISO in 1987. Database vendors nevertheless add their own extensions to the standard, which creates dialects that differ in details. PL/SQL is the dialect of Oracle, as Transact-SQL is the dialect of Microsoft SQL Server.
    fr: |
      SQL a été normalisé par l'ANSI en 1986 et par l'ISO en 1987. Les éditeurs de bases de données ajoutent néanmoins leurs propres extensions à la norme, ce qui crée des dialectes qui diffèrent dans les détails. PL/SQL est le dialecte d'Oracle, comme Transact-SQL est celui de Microsoft SQL Server.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
