id: dp900-2b-obj-dd-definitions
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A stored procedure [[sp]].

      An index [[ix]].
    fr: |
      Une procédure stockée [[sp]].

      Un index [[ix]].
  slots:
    - id: sp
      options:
        - id: vt
          text:
            en: is a virtual table based on the result of a query
            fr: est une table virtuelle basée sur le résultat d'une requête
        - id: run
          text:
            en: contains SQL statements that are run on command
            fr: contient des instructions SQL exécutées à la demande
        - id: fast
          text:
            en: helps the database find the rows of a table faster
            fr: aide la base de données à trouver plus vite les lignes d'une table
        - id: link
          text:
            en: links each row of a table to a row of another table
            fr: lie chaque ligne d'une table à une ligne d'une autre table
    - id: ix
      options:
        - id: vt
          text:
            en: is a virtual table based on the result of a query
            fr: est une table virtuelle basée sur le résultat d'une requête
        - id: run
          text:
            en: contains SQL statements that are run on command
            fr: contient des instructions SQL exécutées à la demande
        - id: fast
          text:
            en: helps the database find the rows of a table faster
            fr: aide la base de données à trouver plus vite les lignes d'une table
        - id: link
          text:
            en: links each row of a table to a row of another table
            fr: lie chaque ligne d'une table à une ligne d'une autre table
answer:
  values: {sp: run, ix: fast}
explanation:
  correct:
    en: A stored procedure encapsulates SQL statements in the database so that they can be run on command, with parameters if needed. An index is a structure that the database uses to find the rows of a table faster, like the index of a book.
    fr: Une procédure stockée encapsule des instructions SQL dans la base de données pour qu'elles soient exécutées à la demande, avec des paramètres si nécessaire. Un index est une structure que la base de données utilise pour trouver plus vite les lignes d'une table, comme l'index d'un livre.
  options:
    vt:
      en: A virtual table based on the result of a query is a view.
      fr: Une table virtuelle basée sur le résultat d'une requête est une vue.
    link:
      en: Linking a row to a row of another table is the role of a foreign key.
      fr: Lier une ligne à une ligne d'une autre table est le rôle d'une clé étrangère.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
