id: dp900-2a-rel-hot-order-keys
objective: "2.1.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A relational database contains a table named **Customer**, in which a numeric ID identifies each customer, and a table named **SalesOrder**. The SalesOrder table is shown below.

    Answer each prompt by selecting the appropriate column name.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données relationnelle contient une table nommée **Customer**, dans laquelle un ID numérique identifie chaque client, et une table nommée **SalesOrder**. La table SalesOrder est présentée ci-dessous.

    Répondez à chaque consigne en sélectionnant le nom de colonne approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The column that can be the primary key of the SalesOrder table", fr: "La colonne qui peut être la clé primaire de la table SalesOrder" } }
    - { id: p2, text: { en: "The column that is a foreign key to the Customer table", fr: "La colonne qui est une clé étrangère vers la table Customer" } }
  grid:
    caption: "SalesOrder"
    rows:
      - [{ text: "OrderNo", area: c1 }, { text: "OrderDate", area: c2 }, { text: "Buyer", area: c3 }, { text: "Total", area: c4 }]
      - [{ text: "1001" }, { text: "2026-03-02" }, { text: "17" }, { text: "49.00" }]
      - [{ text: "1002" }, { text: "2026-03-02" }, { text: "42" }, { text: "120.50" }]
      - [{ text: "1003" }, { text: "2026-03-05" }, { text: "17" }, { text: "49.00" }]
      - [{ text: "1004" }, { text: "2026-03-09" }, { text: "8" }, { text: "15.75" }]
answer:
  values: { p1: c1, p2: c3 }
explanation:
  correct:
    en: |
      A primary key needs a different value in every row: only OrderNo qualifies, because the dates, the buyers and the totals repeat. The Buyer column contains customer IDs, so it is the foreign key that links each order to a row of the Customer table; a foreign key value can repeat, since one customer can place several orders.
    fr: |
      Une clé primaire exige une valeur différente dans chaque ligne : seul OrderNo convient, car les dates, les acheteurs et les totaux se répètent. La colonne Buyer contient des ID de clients : c'est donc la clé étrangère qui lie chaque commande à une ligne de la table Customer ; une valeur de clé étrangère peut se répéter, puisqu'un client peut passer plusieurs commandes.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
