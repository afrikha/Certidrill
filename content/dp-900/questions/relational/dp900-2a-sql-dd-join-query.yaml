id: dp900-2a-sql-dd-join-query
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A database contains a table named **SalesOrder** and a table named **Customer**. The Customer column of SalesOrder contains the ID of the customer who placed the order.

    You need a query that returns each order with the city of its customer. How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données contient une table nommée **SalesOrder** et une table nommée **Customer**. La colonne Customer de SalesOrder contient l'ID du client qui a passé la commande.

    Vous avez besoin d'une requête qui retourne chaque commande avec la ville de son client. Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    SELECT o.OrderNo, o.OrderDate, c.City
    [[source]] SalesOrder AS o
    [[link]] Customer AS c
    [[match]] o.Customer = c.ID;
  slots:
    - id: source
      options:
        - { id: f_into, text: "INTO" }
        - { id: f_from, text: "FROM" }
        - { id: f_set, text: "SET" }
    - id: link
      options:
        - { id: l_join, text: "JOIN" }
        - { id: l_where, text: "WHERE" }
        - { id: l_order, text: "ORDER BY" }
    - id: match
      options:
        - { id: m_values, text: "VALUES" }
        - { id: m_set, text: "SET" }
        - { id: m_on, text: "ON" }
answer:
  values: { source: f_from, link: l_join, match: m_on }
explanation:
  correct:
    en: |
      FROM names the first table to read, JOIN adds the second table, and ON gives the join condition, which matches the foreign key of SalesOrder with the primary key of Customer. The aliases `o` and `c` shorten the table names.
    fr: |
      FROM nomme la première table à lire, JOIN ajoute la deuxième table et ON donne la condition de jointure, qui fait correspondre la clé étrangère de SalesOrder avec la clé primaire de Customer. Les alias `o` et `c` abrègent les noms des tables.
  options:
    l_where: { en: "WHERE introduces a condition on rows; it can't introduce a second table.", fr: "WHERE introduit une condition sur les lignes ; elle ne peut pas introduire une deuxième table." }
    l_order: { en: "ORDER BY sorts the result by columns; it doesn't add a table.", fr: "ORDER BY trie le résultat selon des colonnes ; elle n'ajoute pas de table." }
    m_values: { en: "VALUES belongs to the INSERT statement.", fr: "VALUES appartient à l'instruction INSERT." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
