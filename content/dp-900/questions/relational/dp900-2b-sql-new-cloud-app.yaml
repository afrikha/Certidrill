id: dp900-2b-sql-new-cloud-app
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is building a new cloud application that uses Transact-SQL and needs a single relational database. The database must be a fully managed platform as a service (PaaS) offering that requires the least administration at the lowest cost.

    Which service should you recommend?
  fr: |
    Tailspin Toys développe une nouvelle application cloud qui utilise Transact-SQL et a besoin d'une seule base de données relationnelle. La base de données doit être une offre de plateforme en tant que service (PaaS) entièrement managée, qui demande le moins d'administration possible au coût le plus bas.

    Quel service devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure SQL Managed Instance
    - id: b
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
    - id: c
      text: Azure SQL Database
    - id: d
      text:
        en: Azure Table storage
        fr: Stockage Table Azure
answer: {optionId: c}
explanation:
  correct:
    en: 'Azure SQL Database is a fully managed PaaS database service designed for the cloud: Azure handles the updates, the backups and the recovery. It''s the low-cost option with minimal administration, typically chosen for new cloud applications.'
    fr: 'Azure SQL Database est un service de base de données PaaS entièrement managé, conçu pour le cloud : Azure prend en charge les mises à jour, les sauvegardes et la récupération. C''est l''option à faible coût qui demande un minimum d''administration, généralement choisie pour les nouvelles applications cloud.'
  options:
    a:
      en: Azure SQL Managed Instance is also PaaS, but it provides a whole SQL Server instance, intended for migrations that need instance-level features; it isn't the lowest-cost choice for one new database.
      fr: Azure SQL Managed Instance est aussi un service PaaS, mais il fournit une instance SQL Server complète, destinée aux migrations qui ont besoin de fonctionnalités de niveau instance ; ce n'est pas le choix le moins coûteux pour une seule nouvelle base de données.
    b:
      en: 'SQL Server on Azure Virtual Machines is IaaS: you manage the operating system, the updates and the backups yourself.'
      fr: 'SQL Server sur Machines Virtuelles Azure est un service IaaS : vous gérez vous-même le système d''exploitation, les mises à jour et les sauvegardes.'
    d:
      en: Azure Table storage is a NoSQL key-value store, not a relational database that uses Transact-SQL.
      fr: Stockage Table Azure est un magasin NoSQL clé-valeur, pas une base de données relationnelle qui utilise Transact-SQL.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
