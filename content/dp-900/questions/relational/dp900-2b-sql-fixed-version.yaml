id: dp900-2b-sql-fixed-version
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys uses an application that its vendor supports only on SQL Server 2019. The vendor requires that no update of the database engine be installed without its approval.

    Wingtip Toys wants to move the database to Azure.

    Which service should you recommend?
  fr: |
    Wingtip Toys utilise une application que son éditeur ne prend en charge que sur SQL Server 2019. L'éditeur exige qu'aucune mise à jour du moteur de base de données ne soit installée sans son accord.

    Wingtip Toys veut déplacer la base de données vers Azure.

    Quel service devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure SQL Database
    - id: b
      text:
        en: An Azure SQL Database elastic pool
        fr: Un pool élastique Azure SQL Database
    - id: c
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
    - id: d
      text: Azure SQL Managed Instance
answer: {optionId: c}
explanation:
  correct:
    en: Azure SQL Database always runs the latest stable version of the database engine. Azure SQL Managed Instance follows the engine of its update policy (Always-up-to-date, SQL Server 2022 or SQL Server 2025). In both services, Azure installs the updates automatically. Only SQL Server on Azure Virtual Machines lets you choose the version of SQL Server and decide when updates are installed.
    fr: Azure SQL Database exécute toujours la dernière version stable du moteur de base de données. Azure SQL Managed Instance suit le moteur de sa stratégie de mise à jour (Always-up-to-date, SQL Server 2022 ou SQL Server 2025). Dans les deux services, Azure installe les mises à jour automatiquement. Seul SQL Server sur Machines Virtuelles Azure vous permet de choisir la version de SQL Server et de décider du moment où les mises à jour sont installées.
  options:
    a:
      en: Azure SQL Database runs the latest stable version of the engine, and Azure applies the updates automatically.
      fr: Azure SQL Database exécute la dernière version stable du moteur, et Azure applique les mises à jour automatiquement.
    b:
      en: 'An elastic pool is a deployment option of Azure SQL Database: the engine is updated automatically in the same way.'
      fr: 'Un pool élastique est une option de déploiement d''Azure SQL Database : le moteur y est mis à jour automatiquement de la même façon.'
    d:
      en: Azure SQL Managed Instance is highly compatible with SQL Server, but Azure patches the engine automatically, and its update policies follow SQL Server 2022, SQL Server 2025 or the always-up-to-date engine, not SQL Server 2019.
      fr: Azure SQL Managed Instance est très compatible avec SQL Server, mais Azure corrige le moteur automatiquement, et ses stratégies de mise à jour suivent SQL Server 2022, SQL Server 2025 ou le moteur toujours à jour (Always-up-to-date), pas SQL Server 2019.
references:
