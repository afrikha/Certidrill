id: dp900-2b-sql-fixed-version
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys uses an application that its vendor supports only on SQL Server 2019. The vendor requires that no update of the database engine be installed without its approval.

    Wingtip Toys wants to move the database to Azure.

    Which service should you recommend?
  fr: |
    Wingtip Toys utilise une application que son éditeur ne prend en charge que sur SQL Server 2019. L'éditeur exige qu'aucune mise à jour du moteur de base de données ne soit installée sans son accord.

    Wingtip Toys veut déplacer la base de données vers Azure.

    Quel service devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure SQL Database
    - id: b
      text:
        en: An Azure SQL Database elastic pool
        fr: Un pool élastique Azure SQL Database
    - id: c
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
    - id: d
      text: Azure SQL Managed Instance
answer: {optionId: c}
explanation:
  correct:
    en: Azure SQL Database and Azure SQL Managed Instance always run the latest stable version of the database engine, which Azure updates and patches automatically. Only SQL Server on Azure Virtual Machines lets you choose the version of SQL Server and decide when updates are installed.
    fr: Azure SQL Database et Azure SQL Managed Instance exécutent toujours la dernière version stable du moteur de base de données, qu'Azure met à jour et corrige automatiquement. Seul SQL Server sur Machines Virtuelles Azure vous permet de choisir la version de SQL Server et de décider du moment où les mises à jour sont installées.
  options:
    a:
      en: Azure SQL Database runs the latest stable version of the engine, and Azure applies the updates automatically.
      fr: Azure SQL Database exécute la dernière version stable du moteur, et Azure applique les mises à jour automatiquement.
    b:
      en: 'An elastic pool is a deployment option of Azure SQL Database: the engine is updated automatically in the same way.'
      fr: 'Un pool élastique est une option de déploiement d''Azure SQL Database : le moteur y est mis à jour automatiquement de la même façon.'
    d:
      en: Azure SQL Managed Instance is highly compatible with SQL Server, but Azure patches and upgrades the engine automatically.
      fr: Azure SQL Managed Instance est très compatible avec SQL Server, mais Azure corrige et met à niveau le moteur automatiquement.
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: What is SQL Server on Azure Windows Virtual Machines?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-on-azure-vm-iaas-what-is-overview
