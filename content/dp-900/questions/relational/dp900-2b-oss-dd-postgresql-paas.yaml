id: dp900-2b-oss-dd-postgresql-paas
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Database for PostgreSQL is [[type]] offering.

      The patches of the database software are applied by [[who]].
    fr: |
      Azure Database pour PostgreSQL est une offre [[type]].

      Les correctifs du logiciel de base de données sont appliqués par [[who]].
  slots:
    - id: type
      options:
        - id: iaas
          text:
            en: an infrastructure as a service (IaaS)
            fr: d'infrastructure en tant que service (IaaS)
        - id: paas
          text:
            en: a platform as a service (PaaS)
            fr: de plateforme en tant que service (PaaS)
        - id: saas
          text:
            en: a software as a service (SaaS)
            fr: de logiciel en tant que service (SaaS)
    - id: who
      options:
        - id: customer
          text:
            en: the administrators of the customer
            fr: les administrateurs du client
        - id: vendor
          text:
            en: the vendor of the application
            fr: l'éditeur de l'application
        - {id: microsoft, text: Microsoft}
answer:
  values: {type: paas, who: microsoft}
explanation:
  correct:
    en: 'Azure Database for PostgreSQL is a PaaS implementation of PostgreSQL in Azure. Microsoft manages and maintains the server: the hardware, the virtual servers and the software patches aren''t the customer''s responsibility.'
    fr: 'Azure Database pour PostgreSQL est une implémentation PaaS de PostgreSQL dans Azure. Microsoft gère et maintient le serveur : le matériel, les serveurs virtuels et les correctifs logiciels ne relèvent pas du client.'
  options:
    iaas:
      en: In an IaaS service, the customer would manage a virtual machine and patch the software itself.
      fr: Dans un service IaaS, le client gérerait une machine virtuelle et appliquerait lui-même les correctifs.
    saas:
      en: A SaaS service is a complete application delivered to its users; here the customer still creates and manages its own databases.
      fr: Un service SaaS est une application complète fournie à ses utilisateurs ; ici, le client crée et gère toujours ses propres bases de données.
    customer:
      en: Patching by the customer corresponds to a server that the customer manages, on-premises or in a virtual machine.
      fr: L'application des correctifs par le client correspond à un serveur qu'il gère lui-même, en local ou dans une machine virtuelle.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/overview
