id: dp900-2b-obj-yn-objects-usage
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about database objects, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les objets de base de données, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An index is run on command by using the `EXEC` statement.
        fr: Un index s'exécute à la demande avec l'instruction `EXEC`.
    - id: s2
      text:
        en: A stored procedure can contain an `UPDATE` statement that modifies the rows of a table.
        fr: Une procédure stockée peut contenir une instruction `UPDATE` qui modifie les lignes d'une table.
    - id: s3
      text:
        en: A query that reads a view can filter the rows with a `WHERE` clause.
        fr: Une requête qui lit une vue peut filtrer les lignes avec une clause `WHERE`.
answer:
  values: {s1: false, s2: true, s3: true}
explanation:
  correct:
    en: 'EXEC runs a stored procedure. An index isn''t run: the database uses it by itself when it helps a query. A stored procedure can contain statements that act on data, including UPDATE. A view is queried like a table, so the query can filter its rows with WHERE.'
    fr: 'EXEC exécute une procédure stockée. Un index ne s''exécute pas : la base de données l''utilise d''elle-même quand il est utile à une requête. Une procédure stockée peut contenir des instructions qui agissent sur les données, dont UPDATE. Une vue s''interroge comme une table : la requête peut donc filtrer ses lignes avec WHERE.'
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
