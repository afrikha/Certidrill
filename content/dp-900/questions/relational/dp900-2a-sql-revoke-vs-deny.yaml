id: dp900-2a-sql-revoke-vs-deny
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A user named **user1** received the INSERT permission on a table named **Product** through a GRANT statement. You need to remove that permission. If user1 later joins a role that has the INSERT permission on the table, user1 must obtain the permission through the role.

    Which statement should you use?
  fr: |
    Un utilisateur nommé **user1** a reçu l'autorisation INSERT sur une table nommée **Product** par une instruction GRANT. Vous devez supprimer cette autorisation. Si user1 rejoint plus tard un rôle qui dispose de l'autorisation INSERT sur la table, user1 doit obtenir l'autorisation par le rôle.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "DENY" }
    - { id: b, text: "DELETE" }
    - { id: c, text: "REVOKE" }
    - { id: d, text: "DROP" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      REVOKE removes a permission that was previously granted and leaves nothing in its place, so user1 can still receive the permission later through a role. DENY also takes the permission away, but it blocks the permissions that the user would inherit from roles.
    fr: |
      REVOKE supprime une autorisation précédemment accordée et ne laisse rien à sa place : user1 peut donc encore recevoir l'autorisation plus tard par un rôle. DENY retire aussi l'autorisation, mais elle bloque les autorisations que l'utilisateur hériterait de rôles.
  options:
    a: { en: "DENY refuses the permission explicitly and prevents user1 from inheriting it through a role.", fr: "DENY refuse explicitement l'autorisation et empêche user1 d'en hériter par un rôle." }
    b: { en: "DELETE removes rows from a table; it doesn't manage permissions.", fr: "DELETE supprime des lignes d'une table ; elle ne gère pas les autorisations." }
    d: { en: "DROP removes an object such as a table; it doesn't remove a permission from a user.", fr: "DROP supprime un objet, comme une table ; elle ne retire pas une autorisation à un utilisateur." }
references:
  - title: "REVOKE (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/revoke-transact-sql
  - title: "DENY (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-transact-sql
