id: dp900-2a-norm-department-split
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **Employee** has the columns EmployeeID, Name, DepartmentName and DepartmentPhone. The name and the phone number of a department are repeated in the row of every employee of that department.

    You need to normalize the design. What should you do?
  fr: |
    Une table nommée **Employee** comporte les colonnes EmployeeID, Name, DepartmentName et DepartmentPhone. Le nom et le numéro de téléphone d'un service sont répétés dans la ligne de chaque employé de ce service.

    Vous devez normaliser la conception. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Merge DepartmentName and DepartmentPhone into a single column of the Employee table.", fr: "Fusionner DepartmentName et DepartmentPhone dans une seule colonne de la table Employee." } }
    - { id: b, text: { en: "Move the department columns to a Department table, and keep a foreign key to it in Employee.", fr: "Déplacer les colonnes du service vers une table Department et conserver dans Employee une clé étrangère vers celle-ci." } }
    - { id: c, text: { en: "Add DepartmentName and DepartmentPhone to the primary key of the Employee table.", fr: "Ajouter DepartmentName et DepartmentPhone à la clé primaire de la table Employee." } }
    - { id: d, text: { en: "Copy the Name column to a Department table, and keep the department columns in Employee.", fr: "Copier la colonne Name vers une table Department et conserver les colonnes du service dans Employee." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The department is a separate entity, so it gets its own table in which each department is one row with a primary key. Each employee row then stores that key as a foreign key, and the name and the phone number of a department exist only once.
    fr: |
      Le service est une entité à part : il reçoit donc sa propre table, dans laquelle chaque service est une ligne dotée d'une clé primaire. Chaque ligne d'employé stocke alors cette clé comme clé étrangère, et le nom et le numéro de téléphone d'un service n'existent qu'une seule fois.
  options:
    a: { en: "Merging two attributes into one column goes against normalization and keeps the repetition.", fr: "Fusionner deux attributs dans une colonne va à l'encontre de la normalisation et conserve la répétition." }
    c: { en: "Changing the key doesn't remove the repeated department details from the employee rows.", fr: "Modifier la clé ne retire pas des lignes d'employé les détails de service répétés." }
    d: { en: "The department details would stay repeated in Employee, and employee names would be duplicated too.", fr: "Les détails du service resteraient répétés dans Employee, et les noms des employés seraient dupliqués à leur tour." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
