id: dp900-2a-sql-query-result
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A table named **Product** contains the following rows.

    | ID | Name | Price |
    | --- | --- | --- |
    | 1 | Toaster | 31.00 |
    | 2 | Lamp | 18.00 |
    | 3 | Mixer | 55.00 |
    | 4 | Kettle | 24.50 |

    You run the following query.

    ```text
    SELECT Name
    FROM Product
    WHERE Price > 20
    ORDER BY Name;
    ```

    Which result does the query return, in this order?
  fr: |
    Une table nommée **Product** contient les lignes suivantes.

    | ID | Name | Price |
    | --- | --- | --- |
    | 1 | Toaster | 31.00 |
    | 2 | Lamp | 18.00 |
    | 3 | Mixer | 55.00 |
    | 4 | Kettle | 24.50 |

    Vous exécutez la requête suivante.

    ```text
    SELECT Name
    FROM Product
    WHERE Price > 20
    ORDER BY Name;
    ```

    Quel résultat la requête retourne-t-elle, dans cet ordre ?
body:
  options:
    - { id: a, text: "Toaster, Mixer, Kettle" }
    - { id: b, text: "Kettle, Toaster, Mixer" }
    - { id: c, text: "Kettle, Lamp, Mixer, Toaster" }
    - { id: d, text: "Kettle, Mixer, Toaster" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The WHERE clause keeps only the rows whose price is greater than 20, which excludes Lamp (18.00). The ORDER BY clause then sorts the remaining rows by the Name column, which gives Kettle, Mixer and Toaster.
    fr: |
      La clause WHERE ne conserve que les lignes dont le prix est supérieur à 20, ce qui exclut Lamp (18.00). La clause ORDER BY trie ensuite les lignes restantes selon la colonne Name, ce qui donne Kettle, Mixer et Toaster.
  options:
    a: { en: "This is the order of the IDs; ORDER BY Name sorts the result by name.", fr: "C'est l'ordre des ID ; ORDER BY Name trie le résultat par nom." }
    b: { en: "This is the order of the prices; the query sorts by the Name column.", fr: "C'est l'ordre des prix ; la requête trie selon la colonne Name." }
    c: { en: "Lamp costs 18.00, so the WHERE clause removes it from the result.", fr: "Lamp coûte 18.00 : la clause WHERE l'écarte donc du résultat." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "SELECT (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
