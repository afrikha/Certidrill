id: dp900-2a-sql-insert-new-row
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A table named **Product** stores the products that Northwind Traders sells. The company starts to sell a new product.

    Which SQL statement should you use to add the product to the table?
  fr: |
    Une table nommée **Product** stocke les produits vendus par Northwind Traders. L'entreprise commence à vendre un nouveau produit.

    Quelle instruction SQL devez-vous utiliser pour ajouter le produit à la table ?
body:
  options:
    - { id: a, text: "ALTER" }
    - { id: b, text: "CREATE" }
    - { id: c, text: "INSERT" }
    - { id: d, text: "UPDATE" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A new product is a new row of the Product table, and INSERT is the statement that adds rows to a table. It names the table and its columns in an INTO clause and lists the values of the new row.
    fr: |
      Un nouveau produit est une nouvelle ligne de la table Product, et INSERT est l'instruction qui ajoute des lignes à une table. Elle nomme la table et ses colonnes dans une clause INTO et liste les valeurs de la nouvelle ligne.
  options:
    a: { en: "ALTER changes the structure of an object, for example by adding a column; it doesn't add rows.", fr: "ALTER modifie la structure d'un objet, par exemple en ajoutant une colonne ; elle n'ajoute pas de lignes." }
    b: { en: "CREATE creates a new object such as a table; the Product table already exists.", fr: "CREATE crée un nouvel objet, comme une table ; la table Product existe déjà." }
    d: { en: "UPDATE modifies the values of rows that already exist.", fr: "UPDATE modifie les valeurs de lignes qui existent déjà." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
