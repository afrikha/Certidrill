id: dp900-2a-rel-yn-data-types
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The data types that you can use when you define a table depend on the database system.", fr: "Les types de données que vous pouvez utiliser pour définir une table dépendent du système de base de données." } }
    - { id: s2, text: { en: "A column that is defined to store date and time values can store an email address in some rows.", fr: "Une colonne définie pour stocker des valeurs de date et d'heure peut stocker une adresse e-mail dans certaines lignes." } }
    - { id: s3, text: { en: "Most database systems support standard data types defined by the American National Standards Institute (ANSI).", fr: "La plupart des systèmes de base de données prennent en charge des types de données standard définis par l'ANSI (American National Standards Institute)." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The data types that you can give to columns depend on the database system, but most systems support the standard types defined by ANSI. A column accepts only values of its data type, so a date and time column can't hold an email address, which is text.
    fr: |
      Les types de données que vous pouvez donner aux colonnes dépendent du système de base de données, mais la plupart des systèmes prennent en charge les types standard définis par l'ANSI. Une colonne n'accepte que des valeurs de son type de données : une colonne de date et d'heure ne peut donc pas contenir une adresse e-mail, qui est du texte.
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
