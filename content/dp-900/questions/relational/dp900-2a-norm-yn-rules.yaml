id: dp900-2a-norm-yn-rules
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A normalized schema stores each entity in its own table.", fr: "Un schéma normalisé stocke chaque entité dans sa propre table." } }
    - { id: s2, text: { en: "Normalization groups the discrete attributes of an entity in a single column.", fr: "La normalisation regroupe les attributs distincts d'une entité dans une seule colonne." } }
    - { id: s3, text: { en: "In a normalized table, a primary key identifies each row uniquely.", fr: "Dans une table normalisée, une clé primaire identifie chaque ligne de façon unique." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The practical rules of normalization are to separate each entity into its own table, to separate each discrete attribute into its own column, to identify each row uniquely with a primary key, and to link related entities with foreign keys. Grouping several attributes in one column goes against the second rule.
    fr: |
      Les règles pratiques de la normalisation consistent à séparer chaque entité dans sa propre table, à séparer chaque attribut distinct dans sa propre colonne, à identifier chaque ligne de façon unique par une clé primaire et à lier les entités associées par des clés étrangères. Regrouper plusieurs attributs dans une colonne va à l'encontre de la deuxième règle.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
