id: dp900-2a-rel-primary-key-choice
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A school creates a table named **Student** that has the following columns.

    | Column | Content |
    | --- | --- |
    | StudentNo | A number that the school assigns to one student only |
    | LastName | The family name of the student |
    | BirthDate | The date of birth of the student |
    | Phone | An optional phone number, which siblings can share |

    Which column should the school use as the primary key of the table?
  fr: |
    Une école crée une table nommée **Student** qui comporte les colonnes suivantes.

    | Colonne | Contenu |
    | --- | --- |
    | StudentNo | Un numéro que l'école attribue à un seul élève |
    | LastName | Le nom de famille de l'élève |
    | BirthDate | La date de naissance de l'élève |
    | Phone | Un numéro de téléphone facultatif, que des frères et sœurs peuvent partager |

    Quelle colonne l'école doit-elle utiliser comme clé primaire de la table ?
body:
  options:
    - { id: a, text: "LastName" }
    - { id: b, text: "StudentNo" }
    - { id: c, text: "BirthDate" }
    - { id: d, text: "Phone" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A primary key must identify each row uniquely, so its value must exist in every row and never repeat. Only StudentNo is assigned to a single student; the other columns can hold the same value for several students.
    fr: |
      Une clé primaire doit identifier chaque ligne de façon unique : sa valeur doit exister dans chaque ligne et ne jamais se répéter. Seul StudentNo est attribué à un seul élève ; les autres colonnes peuvent contenir la même valeur pour plusieurs élèves.
  options:
    a: { en: "Several students can have the same family name, so LastName doesn't identify one row.", fr: "Plusieurs élèves peuvent porter le même nom de famille : LastName n'identifie donc pas une seule ligne." }
    c: { en: "Several students can be born on the same day, so BirthDate isn't unique.", fr: "Plusieurs élèves peuvent être nés le même jour : BirthDate n'est donc pas unique." }
    d: { en: "Phone is optional and can be shared, so it can be empty or repeated.", fr: "Phone est facultatif et peut être partagé : il peut donc être vide ou répété." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Primary and foreign key constraints"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
