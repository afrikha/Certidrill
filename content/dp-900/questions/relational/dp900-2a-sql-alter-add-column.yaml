id: dp900-2a-sql-alter-add-column
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **Customer** contains 5,000 rows. You need to add a column named **Email** to the table and keep the existing rows.

    Which statement should you use?
  fr: |
    Une table nommée **Customer** contient 5 000 lignes. Vous devez ajouter une colonne nommée **Email** à la table et conserver les lignes existantes.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "ALTER TABLE" }
    - { id: b, text: "UPDATE" }
    - { id: c, text: "INSERT INTO" }
    - { id: d, text: "CREATE TABLE" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Adding a column changes the structure of the table, which is the role of the ALTER statement of the Data Definition Language. ALTER TABLE modifies the definition of an existing table and keeps its rows.
    fr: |
      Ajouter une colonne modifie la structure de la table, ce qui est le rôle de l'instruction ALTER du langage de définition de données. ALTER TABLE modifie la définition d'une table existante et conserve ses lignes.
  options:
    b: { en: "UPDATE changes values in columns that already exist; it can't create a column.", fr: "UPDATE modifie des valeurs dans des colonnes qui existent déjà ; elle ne peut pas créer une colonne." }
    c: { en: "INSERT INTO adds rows to the table, not columns.", fr: "INSERT INTO ajoute des lignes à la table, pas des colonnes." }
    d: { en: "CREATE TABLE creates a new, empty table; the Customer table already exists with its rows.", fr: "CREATE TABLE crée une nouvelle table vide ; la table Customer existe déjà avec ses lignes." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "ALTER TABLE (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
