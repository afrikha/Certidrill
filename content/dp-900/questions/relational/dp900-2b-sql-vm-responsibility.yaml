id: dp900-2b-sql-vm-responsibility
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs its databases on SQL Server on Azure Virtual Machines.

    Who is responsible for installing the operating system updates and for configuring the database backups?
  fr: |
    Fabrikam exécute ses bases de données sur SQL Server sur Machines Virtuelles Azure.

    Qui est responsable de l'installation des mises à jour du système d'exploitation et de la configuration des sauvegardes des bases de données ?
body:
  options:
    - id: a
      text:
        en: Microsoft, for both tasks
        fr: Microsoft, pour les deux tâches
    - id: b
      text:
        en: Fabrikam, for both tasks
        fr: Fabrikam, pour les deux tâches
    - id: c
      text:
        en: Fabrikam for the operating system updates, and Microsoft for the backups
        fr: Fabrikam pour les mises à jour du système d'exploitation, et Microsoft pour les sauvegardes
    - id: d
      text:
        en: Microsoft for the operating system updates, and Fabrikam for the backups
        fr: Microsoft pour les mises à jour du système d'exploitation, et Fabrikam pour les sauvegardes
answer: {optionId: b}
explanation:
  correct:
    en: SQL Server on Azure Virtual Machines is an IaaS offering. Microsoft runs the physical infrastructure, and the customer manages everything inside the virtual machine, including the operating system and SQL Server updates, the configuration and the backups.
    fr: SQL Server sur Machines Virtuelles Azure est une offre IaaS. Microsoft exploite l'infrastructure physique, et le client gère tout ce qui se trouve dans la machine virtuelle, notamment les mises à jour du système d'exploitation et de SQL Server, la configuration et les sauvegardes.
  options:
    a:
      en: Fully automated updates and backups are a characteristic of the PaaS services, Azure SQL Database and Azure SQL Managed Instance.
      fr: Les mises à jour et les sauvegardes entièrement automatisées caractérisent les services PaaS, Azure SQL Database et Azure SQL Managed Instance.
    c:
      en: The backups are also the customer's responsibility in an IaaS deployment.
      fr: Les sauvegardes relèvent elles aussi du client dans un déploiement IaaS.
    d:
      en: The operating system of the virtual machine is also the customer's responsibility in an IaaS deployment.
      fr: Le système d'exploitation de la machine virtuelle relève lui aussi du client dans un déploiement IaaS.
references:
