id: dp900-2b-obj-order-table-view-query
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an empty database. You need to store sales orders in a table named **SalesOrder**, give analysts a virtual table named **BigOrders** that returns only the orders above 1,000, and then display the rows that BigOrders returns.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données vide. Vous devez stocker des commandes dans une table nommée **SalesOrder**, fournir aux analystes une table virtuelle nommée **BigOrders** qui ne renvoie que les commandes supérieures à 1 000, puis afficher les lignes que BigOrders renvoie.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: exec
      text:
        en: Run an `EXEC BigOrders` statement.
        fr: Exécuter une instruction `EXEC BigOrders`.
    - id: view
      text:
        en: Run a `CREATE VIEW BigOrders AS SELECT ... FROM SalesOrder WHERE Amount > 1000` statement.
        fr: Exécuter une instruction `CREATE VIEW BigOrders AS SELECT ... FROM SalesOrder WHERE Amount > 1000`.
    - id: idx
      text:
        en: Run a `CREATE INDEX BigOrders ON SalesOrder(Amount)` statement.
        fr: Exécuter une instruction `CREATE INDEX BigOrders ON SalesOrder(Amount)`.
    - id: sel
      text:
        en: Run a `SELECT * FROM BigOrders` statement.
        fr: Exécuter une instruction `SELECT * FROM BigOrders`.
    - id: tbl
      text:
        en: Run a `CREATE TABLE SalesOrder` statement.
        fr: Exécuter une instruction `CREATE TABLE SalesOrder`.
    - id: drop
      text:
        en: Run a `DROP TABLE SalesOrder` statement.
        fr: Exécuter une instruction `DROP TABLE SalesOrder`.
answer:
  sequence: [tbl, view, sel]
explanation:
  correct:
    en: A view is a virtual table based on a SELECT query on underlying tables, so the SalesOrder table is created first, and the BigOrders view is then defined on it. A view is read like a table, with a SELECT statement.
    fr: 'Une vue est une table virtuelle basée sur une requête SELECT portant sur des tables sous-jacentes : la table SalesOrder est donc créée en premier, puis la vue BigOrders est définie sur elle. Une vue se lit comme une table, avec une instruction SELECT.'
  options:
    exec:
      en: EXEC runs a stored procedure; a view is read with SELECT.
      fr: EXEC exécute une procédure stockée ; une vue se lit avec SELECT.
    idx:
      en: An index speeds up searches on the Amount column, but it isn't a virtual table that analysts can query.
      fr: Un index accélère les recherches sur la colonne Amount, mais ce n'est pas une table virtuelle que les analystes peuvent interroger.
    drop:
      en: DROP TABLE removes the table and its rows.
      fr: DROP TABLE supprime la table et ses lignes.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Views
    url: https://learn.microsoft.com/en-us/sql/relational-databases/views/views
