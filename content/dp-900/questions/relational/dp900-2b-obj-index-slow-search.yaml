id: dp900-2b-obj-index-slow-search
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A table named **Customer** contains 25 million rows. Queries that filter the rows on the **PostalCode** column take a long time to complete.

    Which database object should you create to find the rows faster?
  fr: |
    Une table nommée **Customer** contient 25 millions de lignes. Les requêtes qui filtrent les lignes sur la colonne **PostalCode** mettent longtemps à s'exécuter.

    Quel objet de base de données devez-vous créer pour trouver les lignes plus vite ?
body:
  options:
    - id: a
      text:
        en: A view
        fr: Une vue
    - id: b
      text:
        en: A stored procedure
        fr: Une procédure stockée
    - id: c
      text:
        en: An index
        fr: Un index
    - id: d
      text:
        en: A foreign key
        fr: Une clé étrangère
answer: {optionId: c}
explanation:
  correct:
    en: An index on the PostalCode column stores a sorted copy of its values with pointers to the rows. The database looks up the value in the index and goes straight to the matching rows instead of reading the 25 million rows.
    fr: Un index sur la colonne PostalCode stocke une copie triée de ses valeurs avec des pointeurs vers les lignes. La base de données recherche la valeur dans l'index et accède directement aux lignes correspondantes au lieu de lire les 25 millions de lignes.
  options:
    a:
      en: 'A view only saves the query: reading it still searches the Customer table in the same way.'
      fr: 'Une vue ne fait qu''enregistrer la requête : sa lecture parcourt toujours la table Customer de la même façon.'
    b:
      en: A stored procedure lets the query be run on command, but the query inside it still has to search the table.
      fr: Une procédure stockée permet d'exécuter la requête à la demande, mais la requête qu'elle contient doit toujours parcourir la table.
    d:
      en: A foreign key links the rows of a table to the rows of another table; it isn't designed to locate rows by postal code.
      fr: Une clé étrangère lie les lignes d'une table à celles d'une autre table ; elle n'est pas conçue pour retrouver des lignes par code postal.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
