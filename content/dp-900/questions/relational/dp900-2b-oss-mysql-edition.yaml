id: dp900-2b-oss-mysql-edition
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On which edition of MySQL is Azure Database for MySQL based?
  fr: |
    Sur quelle édition de MySQL Azure Database pour MySQL est-il basé ?
body:
  options:
    - id: a
      text: Community
    - id: b
      text: Standard
    - id: c
      text: Enterprise
answer: {optionId: a}
explanation:
  correct:
    en: Azure Database for MySQL is a PaaS implementation of MySQL based on the MySQL Community Edition, the edition that is free of charge. Standard and Enterprise are the commercial editions of MySQL.
    fr: Azure Database pour MySQL est une implémentation PaaS de MySQL basée sur MySQL Community Edition, l'édition gratuite. Standard et Enterprise sont les éditions commerciales de MySQL.
  options:
    b:
      en: Standard is a commercial edition of MySQL; the Azure service is based on the Community edition.
      fr: Standard est une édition commerciale de MySQL ; le service Azure est basé sur l'édition Community.
    c:
      en: Enterprise is the commercial edition with the most comprehensive tools and features; the Azure service is based on the Community edition.
      fr: Enterprise est l'édition commerciale qui offre les outils et fonctionnalités les plus complets ; le service Azure est basé sur l'édition Community.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
