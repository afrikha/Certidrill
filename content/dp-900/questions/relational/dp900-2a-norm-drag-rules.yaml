id: dp900-2a-norm-drag-rules
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company stores its sales in a single spreadsheet and decides to normalize the data.

    Match each problem to the normalization rule that solves it. To answer, drag the appropriate rule to each problem. Each rule may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke ses ventes dans une seule feuille de calcul et décide de normaliser les données.

    Associez chaque problème à la règle de normalisation qui le résout. Pour répondre, faites glisser la règle appropriée vers chaque problème. Chaque règle peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: r_pk, text: { en: "Identify each row by using a primary key.", fr: "Identifier chaque ligne à l'aide d'une clé primaire." } }
    - { id: r_entity, text: { en: "Separate each entity into its own table.", fr: "Séparer chaque entité dans sa propre table." } }
    - { id: r_sort, text: { en: "Sort the rows by order number.", fr: "Trier les lignes par numéro de commande." } }
    - { id: r_fk, text: { en: "Link related entities by using a foreign key column.", fr: "Lier les entités associées à l'aide d'une colonne de clé étrangère." } }
    - { id: r_attr, text: { en: "Separate each discrete attribute into its own column.", fr: "Séparer chaque attribut distinct dans sa propre colonne." } }
  targets:
    - { id: t1, text: { en: "The details of a customer are repeated on every line of the customer's orders.", fr: "Les détails d'un client sont répétés sur chaque ligne de ses commandes." } }
    - { id: t2, text: { en: "The name and the address of a customer are in the same cell.", fr: "Le nom et l'adresse d'un client se trouvent dans la même cellule." } }
    - { id: t3, text: { en: "Nothing distinguishes two customers who have the same name.", fr: "Rien ne distingue deux clients qui portent le même nom." } }
    - { id: t4, text: { en: "An order must indicate which customer placed it without containing the customer's details.", fr: "Une commande doit indiquer quel client l'a passée sans contenir les détails du client." } }
answer:
  mapping: { t1: r_entity, t2: r_attr, t3: r_pk, t4: r_fk }
explanation:
  correct:
    en: |
      Repeated customer details disappear when the customer entity has its own table. Two attributes in one cell are separated into two columns. A primary key distinguishes two rows whose other values are identical. A foreign key lets an order refer to its customer without copying the details. Sorting rows isn't a rule of normalization.
    fr: |
      Les détails de client répétés disparaissent lorsque l'entité client a sa propre table. Deux attributs dans une cellule sont séparés en deux colonnes. Une clé primaire distingue deux lignes dont les autres valeurs sont identiques. Une clé étrangère permet à une commande de faire référence à son client sans copier les détails. Trier les lignes n'est pas une règle de normalisation.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
