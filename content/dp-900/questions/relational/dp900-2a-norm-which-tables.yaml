id: dp900-2a-norm-which-tables
objective: "2.1.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys tracks its sales in a spreadsheet that has the following columns: OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice and Qty. An order can include several products, each with its own quantity, and the details of the customer and of the product are repeated on every line.

    You normalize the data so that each entity is stored in its own table and each order is stored as a single row. Which tables should the database contain?
  fr: |
    Wingtip Toys suit ses ventes dans une feuille de calcul qui comporte les colonnes suivantes : OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice et Qty. Une commande peut inclure plusieurs produits, chacun avec sa quantité, et les détails du client et du produit sont répétés sur chaque ligne.

    Vous normalisez les données pour que chaque entité soit stockée dans sa propre table et que chaque commande soit stockée sur une seule ligne. Quelles tables la base de données doit-elle contenir ?
body:
  options:
    - { id: a, text: { en: "Customer and SalesOrder", fr: "Customer et SalesOrder" } }
    - { id: b, text: { en: "Customer, Product and SalesOrder", fr: "Customer, Product et SalesOrder" } }
    - { id: c, text: { en: "Customer, Product, SalesOrder and LineItem", fr: "Customer, Product, SalesOrder et LineItem" } }
    - { id: d, text: { en: "OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice and Qty", fr: "OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice et Qty" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The spreadsheet mixes four entities: the customer, the product, the order and each line of an order. Because an order contains several products, the quantity of each product belongs to a line item that refers to its order and to its product; without that table, the order would need one row per product.
    fr: |
      La feuille de calcul mélange quatre entités : le client, le produit, la commande et chaque ligne d'une commande. Comme une commande contient plusieurs produits, la quantité de chaque produit appartient à une ligne d'article (LineItem) qui fait référence à sa commande et à son produit ; sans cette table, la commande aurait besoin d'une ligne par produit.
  options:
    a: { en: "The name and the price of each product would still be repeated in the orders.", fr: "Le nom et le prix de chaque produit seraient encore répétés dans les commandes." }
    b: { en: "With several products per order, SalesOrder would need one row per product, so an order wouldn't be a single row.", fr: "Avec plusieurs produits par commande, SalesOrder aurait besoin d'une ligne par produit : une commande ne tiendrait donc pas sur une seule ligne." }
    d: { en: "These are attributes, which become columns; a table is created for each entity, not for each attribute.", fr: "Ce sont des attributs, qui deviennent des colonnes ; une table est créée pour chaque entité, pas pour chaque attribut." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
