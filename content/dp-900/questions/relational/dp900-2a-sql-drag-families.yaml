id: dp900-2a-sql-drag-families
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each family of SQL statements to the statement that belongs to it. To answer, drag the appropriate keyword to each family. Each keyword may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque famille d'instructions SQL à l'instruction qui lui appartient. Pour répondre, faites glisser le mot clé approprié vers chaque famille. Chaque mot clé peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: insert, text: "INSERT" }
    - { id: join, text: "JOIN" }
    - { id: alter, text: "ALTER" }
    - { id: revoke, text: "REVOKE" }
  targets:
    - { id: ddl, text: { en: "Data Definition Language (DDL)", fr: "Langage de définition de données (DDL)" } }
    - { id: dcl, text: { en: "Data Control Language (DCL)", fr: "Langage de contrôle des données (DCL)" } }
    - { id: dml, text: { en: "Data Manipulation Language (DML)", fr: "Langage de manipulation de données (DML)" } }
answer:
  mapping: { ddl: alter, dcl: revoke, dml: insert }
explanation:
  correct:
    en: |
      ALTER modifies the structure of an object, so it is a DDL statement. REVOKE removes a permission that was granted, so it is a DCL statement. INSERT adds rows to a table, so it is a DML statement. JOIN isn't a statement: it is a clause of a query that combines two tables.
    fr: |
      ALTER modifie la structure d'un objet : c'est donc une instruction DDL. REVOKE supprime une autorisation accordée : c'est donc une instruction DCL. INSERT ajoute des lignes à une table : c'est donc une instruction DML. JOIN n'est pas une instruction : c'est une clause d'une requête qui combine deux tables.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
