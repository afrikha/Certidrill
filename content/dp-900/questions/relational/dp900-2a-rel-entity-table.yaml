id: dp900-2a-rel-entity-table
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans a relational database to record information about its customers, its products and the orders that customers place.

    What should Contoso create in the database for each of these entities?
  fr: |
    Contoso prévoit une base de données relationnelle pour enregistrer des informations sur ses clients, ses produits et les commandes passées par les clients.

    Que doit créer Contoso dans la base de données pour chacune de ces entités ?
body:
  options:
    - { id: a, text: { en: "A table", fr: "Une table" } }
    - { id: b, text: { en: "A column", fr: "Une colonne" } }
    - { id: c, text: { en: "A row", fr: "Une ligne" } }
    - { id: d, text: { en: "A data type", fr: "Un type de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a relational database, each collection of real-world entities, such as customers, products or orders, is modeled as a table. The rows of the table then hold the individual customers, products or orders, and the columns hold their attributes.
    fr: |
      Dans une base de données relationnelle, chaque collection d'entités du monde réel, comme les clients, les produits ou les commandes, est modélisée sous forme de table. Les lignes de la table contiennent ensuite chaque client, produit ou commande, et les colonnes contiennent leurs attributs.
  options:
    b: { en: "A column stores one attribute of an entity, such as the email address of a customer, not the entity as a whole.", fr: "Une colonne stocke un attribut d'une entité, comme l'adresse e-mail d'un client, et non l'entité dans son ensemble." }
    c: { en: "A row holds a single instance of an entity, such as one customer; the collection of customers is the table.", fr: "Une ligne contient une seule instance d'une entité, par exemple un client ; la collection des clients est la table." }
    d: { en: "A data type restricts the values that a column accepts; it doesn't hold entities.", fr: "Un type de données limite les valeurs qu'une colonne accepte ; il ne contient pas d'entités." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
