id: dp900-2a-sql-drag-tasks
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage a table named **Product**.

    Match each task to the SQL statement that performs it. To answer, drag the appropriate statement to each task. Each statement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une table nommée **Product**.

    Associez chaque tâche à l'instruction SQL qui l'effectue. Pour répondre, faites glisser l'instruction appropriée vers chaque tâche. Chaque instruction peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alter, text: "ALTER" }
    - { id: delete, text: "DELETE" }
    - { id: deny, text: "DENY" }
    - { id: drop, text: "DROP" }
    - { id: revoke, text: "REVOKE" }
    - { id: update, text: "UPDATE" }
  targets:
    - { id: t1, text: { en: "Remove the row of one product and keep the other rows.", fr: "Supprimer la ligne d'un produit et conserver les autres lignes." } }
    - { id: t2, text: { en: "Remove the Product table and all its rows.", fr: "Supprimer la table Product et toutes ses lignes." } }
    - { id: t3, text: { en: "Change the price in the row of an existing product.", fr: "Modifier le prix dans la ligne d'un produit existant." } }
    - { id: t4, text: { en: "Refuse the SELECT permission to a user, even if a role of the user has it.", fr: "Refuser l'autorisation SELECT à un utilisateur, même si l'un de ses rôles la possède." } }
answer:
  mapping: { t1: delete, t2: drop, t3: update, t4: deny }
explanation:
  correct:
    en: |
      DELETE removes the rows that its WHERE clause selects and leaves the table in place, whereas DROP removes the table itself with all its rows. UPDATE changes values in existing rows. DENY refuses a permission and takes precedence over a permission that the user would inherit from a role; REVOKE would only remove a permission granted to the user.
    fr: |
      DELETE supprime les lignes que sa clause WHERE sélectionne et laisse la table en place, alors que DROP supprime la table elle-même avec toutes ses lignes. UPDATE modifie des valeurs dans des lignes existantes. DENY refuse une autorisation et l'emporte sur une autorisation que l'utilisateur hériterait d'un rôle ; REVOKE se contenterait de supprimer une autorisation accordée à l'utilisateur.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "DENY (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-transact-sql
