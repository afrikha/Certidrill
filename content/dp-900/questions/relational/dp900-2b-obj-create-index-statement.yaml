id: dp900-2b-obj-create-index-statement
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run the following SQL statement in a database:

    ```
    CREATE INDEX idx_Product_Name
    ON Product(Name);
    ```

    What does the statement do?
  fr: |
    Vous exécutez l'instruction SQL suivante dans une base de données :

    ```
    CREATE INDEX idx_Product_Name
    ON Product(Name);
    ```

    Que fait cette instruction ?
body:
  options:
    - id: a
      text:
        en: It creates a virtual table that returns the Name column of the Product table.
        fr: Elle crée une table virtuelle qui renvoie la colonne Name de la table Product.
    - id: b
      text:
        en: It sorts by name the rows that the next query on the Product table returns.
        fr: Elle trie par nom les lignes renvoyées par la prochaine requête sur la table Product.
    - id: c
      text:
        en: It creates a structure that speeds up searches on the Name column of the Product table.
        fr: Elle crée une structure qui accélère les recherches sur la colonne Name de la table Product.
    - id: d
      text:
        en: It saves statements that rename a product when an application runs them.
        fr: Elle enregistre des instructions qui renomment un produit lorsqu'une application les exécute.
answer: {optionId: c}
explanation:
  correct:
    en: CREATE INDEX creates an index, here named idx_Product_Name, on the Name column of the Product table. Queries that filter on Name can then use the index to find the rows faster.
    fr: CREATE INDEX crée un index, ici nommé idx_Product_Name, sur la colonne Name de la table Product. Les requêtes qui filtrent sur Name peuvent alors utiliser l'index pour trouver les lignes plus vite.
  options:
    a:
      en: A virtual table is a view, which is created with CREATE VIEW ... AS SELECT.
      fr: Une table virtuelle est une vue, qui se crée avec CREATE VIEW ... AS SELECT.
    b:
      en: The order of a result is set by the ORDER BY clause of the query, not by creating an index.
      fr: L'ordre d'un résultat est fixé par la clause ORDER BY de la requête, pas par la création d'un index.
    d:
      en: Statements that are saved to be run on command form a stored procedure, which is created with CREATE PROCEDURE.
      fr: Des instructions enregistrées pour être exécutées à la demande forment une procédure stockée, qui se crée avec CREATE PROCEDURE.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
