id: dp900-2b-oss-main-reason
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the main reason for which Azure offers managed database services for MySQL and PostgreSQL?
  fr: |
    Pour quelle raison principale Azure propose-t-il des services de base de données managés pour MySQL et PostgreSQL ?
body:
  options:
    - id: a
      text:
        en: To convert the databases of these engines to Azure SQL Database in the course of a migration
        fr: Pour convertir les bases de données de ces moteurs vers Azure SQL Database au cours d'une migration
    - id: b
      text:
        en: To let organizations run their Transact-SQL stored procedures on open-source database engines
        fr: Pour permettre aux organisations d'exécuter leurs procédures stockées Transact-SQL sur des moteurs open source
    - id: c
      text:
        en: To let organizations move applications built on these engines to Azure without major changes
        fr: Pour permettre de déplacer vers Azure, sans modification importante, les applications construites sur ces moteurs
    - id: d
      text:
        en: To store the relational data of these engines in the form of documents in Azure Cosmos DB
        fr: Pour stocker les données relationnelles de ces moteurs sous forme de documents dans Azure Cosmos DB
answer: {optionId: c}
explanation:
  correct:
    en: Many organizations run on-premises applications built on MySQL or PostgreSQL. The Azure Database services for these engines let them move to Azure quickly, without making significant changes to their applications.
    fr: De nombreuses organisations exécutent en local des applications construites sur MySQL ou PostgreSQL. Les services Azure Database de ces moteurs leur permettent de passer rapidement à Azure, sans apporter de modification importante à leurs applications.
  options:
    a:
      en: The services keep the original engine; converting to Azure SQL Database would require changing the applications.
      fr: Ces services conservent le moteur d'origine ; une conversion vers Azure SQL Database obligerait à modifier les applications.
    b:
      en: Transact-SQL is the dialect of SQL Server and the Azure SQL services; MySQL and PostgreSQL keep their own dialects.
      fr: Transact-SQL est le dialecte de SQL Server et des services Azure SQL ; MySQL et PostgreSQL gardent leurs propres dialectes.
    d:
      en: These services are relational database services; they don't turn the data into documents.
      fr: Ces services sont des services de base de données relationnelle ; ils ne transforment pas les données en documents.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
