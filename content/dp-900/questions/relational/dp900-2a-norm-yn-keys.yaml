id: dp900-2a-norm-yn-keys
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A foreign key always consists of a single column.", fr: "Une clé étrangère est toujours constituée d'une seule colonne." } }
    - { id: s2, text: { en: "A composite key is based on a unique combination of several columns.", fr: "Une clé composite est basée sur une combinaison unique de plusieurs colonnes." } }
    - { id: s3, text: { en: "A foreign key stores the primary key value of a related entity.", fr: "Une clé étrangère stocke la valeur de clé primaire d'une entité associée." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A composite key is a key based on a unique combination of several columns, and both primary keys and foreign keys can be composite. A foreign key stores the primary key value of the related entity, which is how one table refers to another.
    fr: |
      Une clé composite est une clé basée sur une combinaison unique de plusieurs colonnes, et les clés primaires comme les clés étrangères peuvent être composites. Une clé étrangère stocke la valeur de clé primaire de l'entité associée : c'est ainsi qu'une table fait référence à une autre.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
