id: dp900-2b-obj-dd-create-procedure
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a database in Azure SQL Database. Applications must be able to change the list price of a product by passing a product ID and a price to an object named **SetListPrice**. You then test the object with product 310.

    How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données dans Azure SQL Database. Les applications doivent pouvoir modifier le prix catalogue d'un produit en transmettant un ID de produit et un prix à un objet nommé **SetListPrice**. Vous testez ensuite l'objet avec le produit 310.

    Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[obj]] SetListPrice
        @ProductID INT,
        @Price DECIMAL(8,2)
    AS
    [[dml]] Product
    SET ListPrice = @Price
    WHERE ProductID = @ProductID;

    [[run]] SetListPrice 310, 24.90;
  slots:
    - id: obj
      options:
        - {id: index, text: INDEX}
        - {id: proc, text: PROCEDURE}
        - {id: view, text: VIEW}
    - id: dml
      options:
        - {id: delete, text: DELETE FROM}
        - {id: insert, text: INSERT INTO}
        - {id: select, text: SELECT}
        - {id: update, text: UPDATE}
    - id: run
      options:
        - {id: alter, text: ALTER}
        - {id: exec, text: EXEC}
        - {id: grant, text: GRANT}
        - {id: sel, text: SELECT}
answer:
  values: {obj: proc, dml: update, run: exec}
explanation:
  correct:
    en: CREATE PROCEDURE defines a stored procedure with its parameters (@ProductID and @Price), followed by the statements that it encapsulates. UPDATE ... SET ... WHERE changes the price of the product whose ID is received. EXEC runs the procedure and passes the values of the parameters.
    fr: CREATE PROCEDURE définit une procédure stockée avec ses paramètres (@ProductID et @Price), suivis des instructions qu'elle encapsule. UPDATE ... SET ... WHERE modifie le prix du produit dont l'ID est reçu. EXEC exécute la procédure et lui transmet les valeurs des paramètres.
  options:
    view:
      en: A view is defined by a SELECT query and has no parameters.
      fr: Une vue est définie par une requête SELECT et n'a pas de paramètres.
    index:
      en: An index is created on a column of a table; it doesn't contain statements.
      fr: Un index se crée sur une colonne d'une table ; il ne contient pas d'instructions.
    select:
      en: SELECT reads rows; the SET clause that follows belongs to UPDATE.
      fr: SELECT lit des lignes ; la clause SET qui suit appartient à UPDATE.
    sel:
      en: SELECT queries a table or a view; a stored procedure is run with EXEC.
      fr: SELECT interroge une table ou une vue ; une procédure stockée s'exécute avec EXEC.
    alter:
      en: ALTER modifies the definition of an object; it doesn't run it.
      fr: ALTER modifie la définition d'un objet ; elle ne l'exécute pas.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Stored procedures (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/stored-procedures-database-engine
