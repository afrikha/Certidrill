id: dp900-2b-sql-yn-vm-details
objective: "2.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about SQL Server on Azure Virtual Machines, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur SQL Server sur Machines Virtuelles Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The availability SLA of SQL Server on Azure Virtual Machines covers the virtual machines, not the SQL Server processes.
        fr: Le contrat SLA de disponibilité de SQL Server sur Machines Virtuelles Azure couvre les machines virtuelles, et non les processus SQL Server.
    - id: s2
      text:
        en: Moving a database from an on-premises SQL Server to SQL Server on Azure Virtual Machines requires adapting the application to another SQL dialect.
        fr: Déplacer une base de données d'un SQL Server local vers SQL Server sur Machines Virtuelles Azure exige d'adapter l'application à un autre dialecte SQL.
    - id: s3
      text:
        en: SQL Server on Azure Virtual Machines can be used in a hybrid deployment in which part of the system stays on-premises.
        fr: SQL Server sur Machines Virtuelles Azure peut servir dans un déploiement hybride où une partie du système reste en local.
answer:
  values: {s1: true, s2: false, s3: true}
explanation:
  correct:
    en: With SQL Server on Azure Virtual Machines, the SLA applies to the virtual machines; the availability of the SQL Server processes is for you to configure. It's the same SQL Server product as on-premises, with the same Transact-SQL, so databases and applications can be moved without change (lift and shift). It also suits hybrid deployments that extend an on-premises system to the cloud.
    fr: 'Avec SQL Server sur Machines Virtuelles Azure, le contrat SLA s''applique aux machines virtuelles ; la disponibilité des processus SQL Server est à configurer par vous. C''est le même produit SQL Server qu''en local, avec le même Transact-SQL : les bases de données et les applications peuvent donc être déplacées sans modification (lift-and-shift). Cette option convient aussi aux déploiements hybrides qui étendent un système local vers le cloud.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
