id: dp900-2b-oss-yn-mysql
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Database for MySQL, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Database pour MySQL, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: By default, the automatic backups are retained for seven days.
        fr: Par défaut, les sauvegardes automatiques sont conservées sept jours.
    - id: s2
      text:
        en: The server can be configured to require TLS connections.
        fr: Le serveur peut être configuré pour exiger des connexions TLS.
    - id: s3
      text:
        en: You manage the network components and the virtual servers that host the databases.
        fr: Vous gérez les composants réseau et les serveurs virtuels qui hébergent les bases de données.
answer:
  values: {s1: true, s2: true, s3: false}
explanation:
  correct:
    en: Azure Database for MySQL retains its automatic backups for seven days by default, and for up to 35 days. The server enforces firewall rules and can optionally require TLS connections. As a PaaS service, it frees you from managing the hardware, the network components, the virtual servers and the software patches.
    fr: Azure Database pour MySQL conserve ses sauvegardes automatiques sept jours par défaut, et jusqu'à 35 jours. Le serveur applique des règles de pare-feu et peut, en option, exiger des connexions TLS. En tant que service PaaS, il vous dispense de gérer le matériel, les composants réseau, les serveurs virtuels et les correctifs logiciels.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
