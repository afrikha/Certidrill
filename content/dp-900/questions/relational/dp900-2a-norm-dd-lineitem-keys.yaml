id: dp900-2a-norm-dd-lineitem-keys
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A normalized database contains a table named **LineItem**. Item numbers restart at 1 for each order, so the table identifies each row by the OrderNo and ItemNo columns together. The ProductID column contains the ID of a row of the **Product** table.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données normalisée contient une table nommée **LineItem**. Les numéros d'article repartent de 1 pour chaque commande : la table identifie donc chaque ligne par les colonnes OrderNo et ItemNo réunies. La colonne ProductID contient l'ID d'une ligne de la table **Product**.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The combination of OrderNo and ItemNo is [[key]].

      The ProductID column is [[ref]].

      The guarantee that every ProductID value of LineItem exists in the Product table is called [[rule]].
    fr: |
      La combinaison d'OrderNo et d'ItemNo est [[key]].

      La colonne ProductID est [[ref]].

      La garantie que chaque valeur de ProductID de LineItem existe dans la table Product s'appelle [[rule]].
  slots:
    - id: key
      options:
        - { id: k_fk, text: { en: "a foreign key", fr: "une clé étrangère" } }
        - { id: k_comp, text: { en: "a composite key", fr: "une clé composite" } }
        - { id: k_type, text: { en: "a data type", fr: "un type de données" } }
    - id: ref
      options:
        - { id: r_pk, text: { en: "a primary key", fr: "une clé primaire" } }
        - { id: r_comp, text: { en: "a composite key", fr: "une clé composite" } }
        - { id: r_fk, text: { en: "a foreign key", fr: "une clé étrangère" } }
    - id: rule
      options:
        - { id: u_ri, text: { en: "referential integrity", fr: "l'intégrité référentielle" } }
        - { id: u_norm, text: { en: "normalization", fr: "la normalisation" } }
        - { id: u_dup, text: { en: "data duplication", fr: "la duplication des données" } }
answer:
  values: { key: k_comp, ref: r_fk, rule: u_ri }
explanation:
  correct:
    en: |
      A key based on a unique combination of several columns is a composite key. A column that stores the primary key of a row of another table is a foreign key. The guarantee that each foreign key value has a matching primary key in the related table is referential integrity, which the database system can enforce.
    fr: |
      Une clé basée sur une combinaison unique de plusieurs colonnes est une clé composite. Une colonne qui stocke la clé primaire d'une ligne d'une autre table est une clé étrangère. La garantie que chaque valeur de clé étrangère a une clé primaire correspondante dans la table associée est l'intégrité référentielle, que le système de base de données peut appliquer.
  options:
    r_pk: { en: "ProductID is the primary key of the Product table; in LineItem it only refers to that table.", fr: "ProductID est la clé primaire de la table Product ; dans LineItem, elle fait seulement référence à cette table." }
    u_norm: { en: "Normalization is the design process as a whole, not the check of foreign key values.", fr: "La normalisation est le processus de conception dans son ensemble, pas la vérification des valeurs de clé étrangère." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
