id: dp900-2b-oss-postgresql-true-statement
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which statement about Azure Database for PostgreSQL is true?
  fr: |
    Quelle affirmation sur Azure Database pour PostgreSQL est vraie ?
body:
  options:
    - id: a
      text:
        en: Its administrators install the patches of the PostgreSQL software themselves.
        fr: Ses administrateurs installent eux-mêmes les correctifs du logiciel PostgreSQL.
    - id: b
      text:
        en: It accepts any extension that runs on an on-premises PostgreSQL server.
        fr: Il accepte toute extension qui fonctionne sur un serveur PostgreSQL local.
    - id: c
      text:
        en: It detects failures and fails over by using mechanisms that are built into the service.
        fr: Il détecte les défaillances et bascule grâce à des mécanismes intégrés au service.
    - id: d
      text:
        en: It replaces the PostgreSQL engine with the SQL Server engine and accepts the PL/pgSQL language.
        fr: Il remplace le moteur PostgreSQL par le moteur SQL Server et accepte le langage PL/pgSQL.
answer: {optionId: c}
explanation:
  correct:
    en: Azure Database for PostgreSQL is a highly available PaaS service, with built-in failure detection and failover mechanisms. Microsoft manages and maintains the server, including its patches, and the service supports only a defined set of extensions. The engine is PostgreSQL itself.
    fr: Azure Database pour PostgreSQL est un service PaaS hautement disponible, avec des mécanismes intégrés de détection des défaillances et de basculement. Microsoft gère et maintient le serveur, correctifs compris, et le service ne prend en charge qu'un ensemble défini d'extensions. Le moteur est PostgreSQL lui-même.
  options:
    a:
      en: 'It''s a PaaS service: Azure applies the patches of the database software.'
      fr: 'C''est un service PaaS : Azure applique les correctifs du logiciel de base de données.'
    b:
      en: 'Some features of an on-premises PostgreSQL aren''t available, mostly extensions: the service supports a defined list of them.'
      fr: 'Certaines fonctionnalités d''un PostgreSQL local ne sont pas disponibles, surtout des extensions : le service en prend en charge une liste définie.'
    d:
      en: The service runs the PostgreSQL engine; SQL Server is the engine of the Azure SQL family.
      fr: Le service exécute le moteur PostgreSQL ; SQL Server est le moteur de la famille Azure SQL.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/overview
