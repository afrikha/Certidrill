id: dp900-2b-obj-view-virtual-table
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which database object is a virtual table whose rows come from the result of a `SELECT` query?
  fr: |
    Quel objet de base de données est une table virtuelle dont les lignes proviennent du résultat d'une requête `SELECT` ?
body:
  options:
    - id: a
      text:
        en: An index
        fr: Un index
    - id: b
      text:
        en: A view
        fr: Une vue
    - id: c
      text:
        en: A stored procedure
        fr: Une procédure stockée
    - id: d
      text:
        en: A primary key
        fr: Une clé primaire
answer: {optionId: b}
explanation:
  correct:
    en: A view is a virtual table based on the result of a SELECT query. You query it like a table, but its rows come from the underlying tables each time it's read.
    fr: Une vue est une table virtuelle basée sur le résultat d'une requête SELECT. Elle s'interroge comme une table, mais ses lignes proviennent des tables sous-jacentes à chaque lecture.
  options:
    a:
      en: An index is a structure that helps the database find rows faster; it isn't queried as a table.
      fr: Un index est une structure qui aide la base de données à trouver les lignes plus vite ; il ne s'interroge pas comme une table.
    c:
      en: A stored procedure is a set of SQL statements that are run on command, not a table.
      fr: Une procédure stockée est un ensemble d'instructions SQL exécutées à la demande, pas une table.
    d:
      en: A primary key is the column, or the columns, that uniquely identify each row of a table.
      fr: Une clé primaire est la colonne, ou les colonnes, qui identifie chaque ligne d'une table de façon unique.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Views
    url: https://learn.microsoft.com/en-us/sql/relational-databases/views/views
