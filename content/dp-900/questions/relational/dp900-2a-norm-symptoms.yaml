id: dp900-2a-norm-symptoms
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware tracks its sales in the following table.

    | OrderNo | Customer | Product | Qty |
    | --- | --- | --- | --- |
    | 1001 | Ana Ruiz, 4 Harbor St, Lisbon | Kettle (24.50) | 1 |
    | 1001 | Ana Ruiz, 4 Harbor St, Lisbon | Toaster (31.00) | 2 |
    | 1002 | Kenji Sato, 9 Hill Rd, Osaka | Kettle (24.50) | 3 |

    Which two characteristics show that the table isn't normalized?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware suit ses ventes dans la table suivante.

    | OrderNo | Customer | Product | Qty |
    | --- | --- | --- | --- |
    | 1001 | Ana Ruiz, 4 Harbor St, Lisbon | Kettle (24.50) | 1 |
    | 1001 | Ana Ruiz, 4 Harbor St, Lisbon | Toaster (31.00) | 2 |
    | 1002 | Kenji Sato, 9 Hill Rd, Osaka | Kettle (24.50) | 3 |

    Quelles sont les deux caractéristiques qui montrent que la table n'est pas normalisée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Qty column contains a different value on each row.", fr: "La colonne Qty contient une valeur différente sur chaque ligne." } }
    - { id: b, text: { en: "The details of a customer are repeated on several rows.", fr: "Les détails d'un client sont répétés sur plusieurs lignes." } }
    - { id: c, text: { en: "The name and the price of a product are combined in one column.", fr: "Le nom et le prix d'un produit sont combinés dans une seule colonne." } }
    - { id: d, text: { en: "The OrderNo column contains numeric values.", fr: "La colonne OrderNo contient des valeurs numériques." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A normalized design stores each entity in its own table and each attribute in its own column. Here the details of Ana Ruiz are repeated on two rows, which is duplicated data, and one column combines two attributes of the product, its name and its price.
    fr: |
      Une conception normalisée stocke chaque entité dans sa propre table et chaque attribut dans sa propre colonne. Ici, les détails d'Ana Ruiz sont répétés sur deux lignes, ce qui est de la duplication de données, et une colonne combine deux attributs du produit, son nom et son prix.
  options:
    a: { en: "A quantity is a single attribute of each sales line; different values are normal.", fr: "Une quantité est un attribut unique de chaque ligne de vente ; des valeurs différentes sont normales." }
    d: { en: "A column that holds values of one data type is what a relational table expects.", fr: "Une colonne qui contient des valeurs d'un seul type de données est ce qu'attend une table relationnelle." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
