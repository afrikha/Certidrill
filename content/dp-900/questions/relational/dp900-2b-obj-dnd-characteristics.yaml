id: dp900-2b-obj-dnd-characteristics
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each characteristic to the database object that it describes.

    To answer, drag the appropriate object to each characteristic. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque caractéristique à l'objet de base de données qu'elle décrit.

    Pour répondre, faites glisser l'objet approprié vers chaque caractéristique. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: view
      text:
        en: View
        fr: Vue
    - id: index
      text:
        en: Index
        fr: Index
    - id: proc
      text:
        en: Stored procedure
        fr: Procédure stockée
    - id: table
      text:
        en: Table
        fr: Table
    - id: pk
      text:
        en: Primary key
        fr: Clé primaire
  targets:
    - id: t1
      text:
        en: It holds a sorted copy of the values of a column, with pointers to the rows.
        fr: Il contient une copie triée des valeurs d'une colonne, avec des pointeurs vers les lignes.
    - id: t2
      text:
        en: It returns the current rows of the underlying tables each time it's queried, without storing them itself.
        fr: Il renvoie les lignes actuelles des tables sous-jacentes à chaque interrogation, sans les stocker lui-même.
    - id: t3
      text:
        en: It accepts input values that change what its statements do when it's run.
        fr: Il accepte des valeurs d'entrée qui changent ce que font ses instructions quand il est exécuté.
answer:
  mapping: {t1: index, t2: view, t3: proc}
explanation:
  correct:
    en: 'An index is a sorted copy of the values of a column with pointers to the corresponding rows. A view is a virtual table: it stores a query, and its rows come from the underlying tables at each read. A stored procedure can define parameters, and the values passed by the caller drive its statements. A table stores the rows themselves, and a primary key identifies each row.'
    fr: 'Un index est une copie triée des valeurs d''une colonne avec des pointeurs vers les lignes correspondantes. Une vue est une table virtuelle : elle enregistre une requête, et ses lignes proviennent des tables sous-jacentes à chaque lecture. Une procédure stockée peut définir des paramètres, et les valeurs transmises par l''appelant pilotent ses instructions. Une table stocke les lignes elles-mêmes, et une clé primaire identifie chaque ligne.'
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
