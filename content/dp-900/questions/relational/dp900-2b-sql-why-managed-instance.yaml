id: dp900-2b-sql-why-managed-instance
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to migrate an on-premises SQL Server instance to a platform as a service (PaaS) offering. The databases of the instance use SQL Server Agent jobs and cross-database queries.

    Why should Northwind Traders choose Azure SQL Managed Instance rather than Azure SQL Database?
  fr: |
    Northwind Traders prévoit de migrer une instance SQL Server locale vers une offre de plateforme en tant que service (PaaS). Les bases de données de l'instance utilisent des travaux SQL Server Agent et des requêtes entre bases de données.

    Pourquoi Northwind Traders doit-elle choisir Azure SQL Managed Instance plutôt qu'Azure SQL Database ?
body:
  options:
    - id: a
      text:
        en: Azure SQL Managed Instance gives access to the operating system of the server.
        fr: Azure SQL Managed Instance donne accès au système d'exploitation du serveur.
    - id: b
      text:
        en: Azure SQL Managed Instance is the only one of the two that takes automated backups.
        fr: Azure SQL Managed Instance est le seul des deux à effectuer des sauvegardes automatisées.
    - id: c
      text:
        en: Azure SQL Managed Instance supports these instance-level features of SQL Server.
        fr: Azure SQL Managed Instance prend en charge ces fonctionnalités de niveau instance de SQL Server.
    - id: d
      text:
        en: Azure SQL Managed Instance is the only one of the two that Azure patches automatically.
        fr: Azure SQL Managed Instance est le seul des deux auquel Azure applique automatiquement les correctifs.
answer: {optionId: c}
explanation:
  correct:
    en: Azure SQL Managed Instance offers near-100% compatibility with an on-premises SQL Server and keeps instance-level features such as SQL Server Agent and cross-database queries, which Azure SQL Database doesn't provide. Both services are PaaS, with automated updates and backups.
    fr: Azure SQL Managed Instance offre une compatibilité proche de 100 % avec un SQL Server local et conserve des fonctionnalités de niveau instance comme SQL Server Agent et les requêtes entre bases de données, qu'Azure SQL Database ne fournit pas. Les deux services sont PaaS, avec des mises à jour et des sauvegardes automatisées.
  options:
    a:
      en: 'Neither service gives access to the operating system: both are PaaS.'
      fr: 'Aucun des deux services ne donne accès au système d''exploitation : les deux sont PaaS.'
    b:
      en: Both services take automated backups.
      fr: Les deux services effectuent des sauvegardes automatisées.
    d:
      en: Azure applies patches automatically to both services.
      fr: Azure applique automatiquement les correctifs aux deux services.
references:
  - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
