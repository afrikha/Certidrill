id: dp900-2b-sql-yn-sql-database
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure SQL Database, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure SQL Database, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure SQL Database lets you restore a database to an earlier point in time.
        fr: Azure SQL Database vous permet de restaurer une base de données à un point antérieur dans le temps.
    - id: s2
      text:
        en: Azure SQL Database can replicate a database to another region.
        fr: Azure SQL Database peut répliquer une base de données vers une autre région.
    - id: s3
      text:
        en: Every feature of an on-premises SQL Server instance is available in Azure SQL Database.
        fr: Toutes les fonctionnalités d'une instance SQL Server locale sont disponibles dans Azure SQL Database.
answer:
  values: {s1: true, s2: true, s3: false}
explanation:
  correct:
    en: 'Azure SQL Database takes automated backups and supports point-in-time restore, and it can replicate databases to other regions for resiliency and disaster recovery. It supports most core database-level capabilities of SQL Server, but it isn''t fully compatible with an on-premises installation: some features, such as SQL Server Agent, aren''t available.'
    fr: 'Azure SQL Database effectue des sauvegardes automatisées et prend en charge la restauration à un point dans le temps, et il peut répliquer des bases de données vers d''autres régions pour la résilience et la récupération d''urgence. Il prend en charge la plupart des fonctionnalités de base de SQL Server au niveau de la base de données, mais il n''est pas entièrement compatible avec une installation locale : certaines fonctionnalités, comme SQL Server Agent, ne sont pas disponibles.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
