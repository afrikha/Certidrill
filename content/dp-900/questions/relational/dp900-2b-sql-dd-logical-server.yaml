id: dp900-2b-sql-dd-logical-server
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure SQL Database, databases are attached to [[what]], which is [[role]].
    fr: |
      Dans Azure SQL Database, les bases de données sont rattachées à [[what]], qui est [[role]].
  slots:
    - id: what
      options:
        - id: vm
          text:
            en: a virtual machine that you manage
            fr: une machine virtuelle que vous gérez
        - id: logical
          text:
            en: a logical server
            fr: un serveur logique
        - id: mi
          text:
            en: a managed instance
            fr: une instance managée
    - id: role
      options:
        - id: admin
          text:
            en: the central point for administering logins and firewall rules
            fr: le point central d'administration des connexions et des règles de pare-feu
        - id: os
          text:
            en: the computer on which you install operating system updates
            fr: l'ordinateur sur lequel vous installez les mises à jour du système d'exploitation
        - id: pause
          text:
            en: the pool whose compute pauses when no database is active
            fr: le pool dont le calcul se met en pause quand aucune base de données n'est active
answer:
  values: {what: logical, role: admin}
explanation:
  correct:
    en: 'A server of Azure SQL Database is a logical construct, not a machine that you manage: it''s a central administrative point for the single and pooled databases attached to it, their logins, firewall rules and auditing rules. Microsoft manages the underlying infrastructure and operating system.'
    fr: 'Un serveur Azure SQL Database est une construction logique, et non une machine que vous gérez : c''est un point d''administration central pour les bases de données uniques et en pool qui lui sont rattachées, leurs connexions, leurs règles de pare-feu et leurs règles d''audit. Microsoft gère l''infrastructure et le système d''exploitation sous-jacents.'
  options:
    vm:
      en: A virtual machine that you manage corresponds to SQL Server on Azure Virtual Machines.
      fr: Une machine virtuelle que vous gérez correspond à SQL Server sur Machines Virtuelles Azure.
    mi:
      en: A managed instance is another service of the family, Azure SQL Managed Instance.
      fr: Une instance managée est un autre service de la famille, Azure SQL Managed Instance.
    os:
      en: 'Azure SQL Database is PaaS: you don''t install operating system updates.'
      fr: 'Azure SQL Database est un service PaaS : vous n''installez pas de mises à jour du système d''exploitation.'
    pause:
      en: Automatic pausing is a feature of the serverless compute tier of a database, not the role of the server.
      fr: La mise en pause automatique est une fonctionnalité du niveau de calcul serverless d'une base de données, pas le rôle du serveur.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
