id: dp900-2a-sql-delete-no-where
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **Product** contains 200 rows. No other table refers to it. You run the following statement.

    ```text
    DELETE FROM Product;
    ```

    What is the result?
  fr: |
    Une table nommée **Product** contient 200 lignes. Aucune autre table n'y fait référence. Vous exécutez l'instruction suivante.

    ```text
    DELETE FROM Product;
    ```

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "The table and its 200 rows are removed from the database.", fr: "La table et ses 200 lignes sont supprimées de la base de données." } }
    - { id: b, text: { en: "The table remains in the database and contains no rows.", fr: "La table reste dans la base de données et ne contient plus aucune ligne." } }
    - { id: c, text: { en: "The statement fails because it has no WHERE clause.", fr: "L'instruction échoue, car elle n'a pas de clause WHERE." } }
    - { id: d, text: { en: "The table remains in the database and loses its first row only.", fr: "La table reste dans la base de données et perd uniquement sa première ligne." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DELETE removes rows, and its WHERE clause selects the rows to remove. Without a WHERE clause, the statement applies to every row: the 200 rows are deleted, but the table itself remains, because only DROP removes a table.
    fr: |
      DELETE supprime des lignes, et sa clause WHERE sélectionne les lignes à supprimer. Sans clause WHERE, l'instruction s'applique à toutes les lignes : les 200 lignes sont supprimées, mais la table elle-même subsiste, car seule DROP supprime une table.
  options:
    a: { en: "Removing the table itself requires DROP TABLE; DELETE only removes rows.", fr: "Supprimer la table elle-même exige DROP TABLE ; DELETE ne supprime que des lignes." }
    c: { en: "The WHERE clause is optional, and SQL asks for no confirmation.", fr: "La clause WHERE est facultative, et SQL ne demande aucune confirmation." }
    d: { en: "Without a filter, the statement applies to all the rows, not to one row.", fr: "Sans filtre, l'instruction s'applique à toutes les lignes, pas à une seule." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "DELETE (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/delete-transact-sql
