id: dp900-2b-oss-paas-services
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two Azure services are platform as a service (PaaS) offerings for open-source relational database engines?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux services Azure qui sont des offres de plateforme en tant que service (PaaS) pour des moteurs de base de données relationnelle open source ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Azure Database for MySQL
        fr: Azure Database pour MySQL
    - id: b
      text: Azure SQL Managed Instance
    - id: c
      text: Azure Cosmos DB for NoSQL
    - id: d
      text:
        en: Azure Database for PostgreSQL
        fr: Azure Database pour PostgreSQL
    - id: e
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
answer: {optionIds: [a, d]}
explanation:
  correct:
    en: Azure Database for MySQL and Azure Database for PostgreSQL are the PaaS implementations of these two open-source relational engines. In both services, Azure manages the servers, the patches, the backups and the high availability.
    fr: Azure Database pour MySQL et Azure Database pour PostgreSQL sont les implémentations PaaS de ces deux moteurs relationnels open source. Dans les deux services, Azure gère les serveurs, les correctifs, les sauvegardes et la haute disponibilité.
  options:
    b:
      en: Azure SQL Managed Instance is PaaS, but it runs SQL Server, which isn't an open-source engine.
      fr: Azure SQL Managed Instance est un service PaaS, mais il exécute SQL Server, qui n'est pas un moteur open source.
    c:
      en: Azure Cosmos DB for NoSQL is a non-relational database service.
      fr: Azure Cosmos DB for NoSQL est un service de base de données non relationnelle.
    e:
      en: SQL Server on Azure Virtual Machines is IaaS, and it runs SQL Server.
      fr: SQL Server sur Machines Virtuelles Azure est un service IaaS, et il exécute SQL Server.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
