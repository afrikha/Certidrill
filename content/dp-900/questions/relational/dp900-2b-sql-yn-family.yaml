id: dp900-2b-sql-yn-family
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Azure SQL family, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la famille Azure SQL, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure SQL Managed Instance is an infrastructure as a service (IaaS) offering.
        fr: Azure SQL Managed Instance est une offre d'infrastructure en tant que service (IaaS).
    - id: s2
      text:
        en: Azure SQL Database, Azure SQL Managed Instance and SQL Server on Azure Virtual Machines are all based on the SQL Server database engine.
        fr: Azure SQL Database, Azure SQL Managed Instance et SQL Server sur Machines Virtuelles Azure reposent tous sur le moteur de base de données SQL Server.
    - id: s3
      text:
        en: With Azure SQL Database, you install the updates of the database engine yourself.
        fr: Avec Azure SQL Database, vous installez vous-même les mises à jour du moteur de base de données.
answer:
  values: {s1: false, s2: true, s3: false}
explanation:
  correct:
    en: 'Azure SQL is a family of services based on the SQL Server database engine. Azure SQL Database and Azure SQL Managed Instance are PaaS: Azure updates and patches the engine automatically. Only SQL Server on Azure Virtual Machines is IaaS.'
    fr: 'Azure SQL est une famille de services basés sur le moteur de base de données SQL Server. Azure SQL Database et Azure SQL Managed Instance sont des services PaaS : Azure met à jour et corrige le moteur automatiquement. Seul SQL Server sur Machines Virtuelles Azure est un service IaaS.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
