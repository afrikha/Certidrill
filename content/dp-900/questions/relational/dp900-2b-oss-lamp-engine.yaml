id: dp900-2b-oss-lamp-engine
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which open-source relational database is commonly used in LAMP stack applications?
  fr: |
    Quelle base de données relationnelle open source est couramment utilisée dans les applications de la pile LAMP ?
body:
  options:
    - id: a
      text: PostgreSQL
    - id: b
      text: SQL Server
    - id: c
      text: MySQL
    - id: d
      text: Apache Cassandra
answer: {optionId: c}
explanation:
  correct:
    en: 'LAMP stands for Linux, Apache, MySQL and PHP: MySQL is the database of this stack. It started as a simple-to-use open-source database management system and is widely used by web applications.'
    fr: 'LAMP signifie Linux, Apache, MySQL et PHP : MySQL est la base de données de cette pile. C''était à l''origine un système de gestion de base de données open source simple à utiliser, et il est très répandu dans les applications web.'
  options:
    a:
      en: PostgreSQL is an open-source object-relational database, but it isn't the database of the LAMP stack.
      fr: PostgreSQL est une base de données objet-relationnelle open source, mais ce n'est pas la base de données de la pile LAMP.
    b:
      en: SQL Server is Microsoft's database engine; it isn't an open-source system.
      fr: SQL Server est le moteur de base de données de Microsoft ; ce n'est pas un système open source.
    d:
      en: Apache Cassandra is an open-source database, but it's non-relational.
      fr: Apache Cassandra est une base de données open source, mais elle est non relationnelle.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
