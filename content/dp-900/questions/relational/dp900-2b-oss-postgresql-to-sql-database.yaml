id: dp900-2b-oss-postgresql-to-sql-database
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an application that was written for a PostgreSQL database. A manager suggests moving the database to Azure SQL Database.

    Why does this move require changes to the application?
  fr: |
    Adatum possède une application écrite pour une base de données PostgreSQL. Un responsable suggère de déplacer la base de données vers Azure SQL Database.

    Pourquoi ce déplacement exige-t-il de modifier l'application ?
body:
  options:
    - id: a
      text:
        en: Azure SQL Database is an IaaS service in which Adatum must manage a virtual machine.
        fr: Azure SQL Database est un service IaaS dans lequel Adatum doit gérer une machine virtuelle.
    - id: b
      text:
        en: Azure SQL Database uses another database engine and another SQL dialect than PostgreSQL.
        fr: Azure SQL Database utilise un autre moteur de base de données et un autre dialecte SQL que PostgreSQL.
    - id: c
      text:
        en: Azure SQL Database stores semi-structured documents instead of relational tables.
        fr: Azure SQL Database stocke des documents semi-structurés au lieu de tables relationnelles.
    - id: d
      text:
        en: Azure SQL Database has no automated backups, so the application must create them.
        fr: 'Azure SQL Database n''a pas de sauvegardes automatisées : l''application doit donc les créer.'
answer: {optionId: b}
explanation:
  correct:
    en: Azure SQL Database is built on the SQL Server engine and uses Transact-SQL, whereas PostgreSQL is another engine, with its own procedural language, PL/pgSQL. To move without significant application changes, the target should be Azure Database for PostgreSQL, the managed service of the same engine.
    fr: Azure SQL Database repose sur le moteur SQL Server et utilise Transact-SQL, alors que PostgreSQL est un autre moteur, avec son propre langage procédural, PL/pgSQL. Pour un déplacement sans modification importante de l'application, la cible doit être Azure Database pour PostgreSQL, le service managé du même moteur.
  options:
    a:
      en: 'Azure SQL Database is a PaaS service: there''s no virtual machine to manage.'
      fr: 'Azure SQL Database est un service PaaS : il n''y a aucune machine virtuelle à gérer.'
    c:
      en: Azure SQL Database is a relational database service that stores data in tables.
      fr: Azure SQL Database est un service de base de données relationnelle qui stocke les données dans des tables.
    d:
      en: Azure SQL Database takes automated backups and supports point-in-time restore.
      fr: Azure SQL Database effectue des sauvegardes automatisées et prend en charge la restauration à un point dans le temps.
