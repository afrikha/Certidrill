id: dp900-2a-norm-inconsistent-price
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam records its sales in one table that repeats the name and the price of the product on every sales line. After a price change, the same product appears with two different prices.

    Which schema design process avoids this problem by storing each product only once?
  fr: |
    Fabrikam enregistre ses ventes dans une seule table qui répète le nom et le prix du produit sur chaque ligne de vente. Après un changement de prix, le même produit apparaît avec deux prix différents.

    Quel processus de conception de schéma évite ce problème en stockant chaque produit une seule fois ?
body:
  options:
    - { id: a, text: { en: "Normalization", fr: "La normalisation" } }
    - { id: b, text: { en: "Denormalization", fr: "La dénormalisation" } }
    - { id: c, text: { en: "Indexing", fr: "L'indexation" } }
    - { id: d, text: { en: "Aggregation", fr: "L'agrégation" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Normalization is the schema design process that minimizes the duplication of data and enforces data integrity. Each product is stored as one row of its own table, so its price exists in one place and can't differ from one sales line to another.
    fr: |
      La normalisation est le processus de conception de schéma qui réduit au minimum la duplication des données et applique l'intégrité des données. Chaque produit est stocké dans une seule ligne de sa propre table : son prix existe donc à un seul endroit et ne peut pas différer d'une ligne de vente à l'autre.
  options:
    b: { en: "Denormalization is the opposite choice: it introduces some duplication of data, generally to make queries faster.", fr: "La dénormalisation est le choix inverse : elle introduit une certaine duplication des données, en général pour accélérer les requêtes." }
    c: { en: "An index helps the database to find rows faster; the duplicated prices remain.", fr: "Un index aide la base de données à trouver les lignes plus vite ; les prix dupliqués subsistent." }
    d: { en: "Aggregation summarizes values, for example a total of sales; it doesn't remove repeated product details.", fr: "L'agrégation résume des valeurs, par exemple un total des ventes ; elle ne supprime pas les détails de produit répétés." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Explore analytical data processing"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
