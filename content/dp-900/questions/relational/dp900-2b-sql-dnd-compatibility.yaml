id: dp900-2b-sql-dnd-compatibility
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the service that it describes.

    To answer, drag the appropriate service to each description. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au service qu'elle décrit.

    Pour répondre, faites glisser le service approprié vers chaque description. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: sqldb
      text: Azure SQL Database
    - id: mi
      text: Azure SQL Managed Instance
    - id: vm
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
    - id: mysql
      text:
        en: Azure Database for MySQL
        fr: Azure Database pour MySQL
  targets:
    - id: t1
      text:
        en: Fully compatible with an on-premises SQL Server; you manage the operating system, the updates and the backups.
        fr: Entièrement compatible avec un SQL Server local ; vous gérez le système d'exploitation, les mises à jour et les sauvegardes.
    - id: t2
      text:
        en: Near-100% compatibility with an on-premises SQL Server; the updates and the backups are automated.
        fr: Compatibilité proche de 100 % avec un SQL Server local ; les mises à jour et les sauvegardes sont automatisées.
    - id: t3
      text:
        en: Supports most core database-level capabilities of SQL Server; the usual choice for new cloud applications.
        fr: Prend en charge la plupart des fonctionnalités de base de SQL Server au niveau de la base de données ; le choix habituel pour les nouvelles applications cloud.
answer:
  mapping: {t1: vm, t2: mi, t3: sqldb}
explanation:
  correct:
    en: SQL Server on Azure Virtual Machines is the same product as on-premises, so it's fully compatible, and you manage everything. Azure SQL Managed Instance is PaaS with near-100% compatibility, for most migrations. Azure SQL Database is PaaS with most core database-level capabilities, for new cloud solutions. Azure Database for MySQL runs the MySQL engine, not SQL Server.
    fr: 'SQL Server sur Machines Virtuelles Azure est le même produit qu''en local : il est donc entièrement compatible, et vous gérez tout. Azure SQL Managed Instance est un service PaaS à la compatibilité proche de 100 %, pour la plupart des migrations. Azure SQL Database est un service PaaS qui offre la plupart des fonctionnalités de base au niveau de la base de données, pour les nouvelles solutions cloud. Azure Database pour MySQL exécute le moteur MySQL, pas SQL Server.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
