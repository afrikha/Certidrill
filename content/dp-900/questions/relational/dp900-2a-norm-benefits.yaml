id: dp900-2a-norm-benefits
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two results does normalizing a database produce?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux résultats produits par la normalisation d'une base de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The details of a customer are copied into each order of the customer.", fr: "Les détails d'un client sont copiés dans chacune de ses commandes." } }
    - { id: b, text: { en: "Each fact, such as the price of a product, is stored in one place.", fr: "Chaque fait, comme le prix d'un produit, est stocké à un seul endroit." } }
    - { id: c, text: { en: "A query that reads several entities no longer needs to combine tables.", fr: "Une requête qui lit plusieurs entités n'a plus besoin de combiner des tables." } }
    - { id: d, text: { en: "Each value is constrained to the data type of its own column.", fr: "Chaque valeur est limitée au type de données de sa propre colonne." } }
    - { id: e, text: { en: "All the entities of the database are stored in a single table.", fr: "Toutes les entités de la base de données sont stockées dans une seule table." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Normalization records each instance of an entity as one row of its own table, which removes duplication: a fact such as a price exists in one place. It also places each attribute in its own column, so that each value is constrained to an appropriate data type.
    fr: |
      La normalisation enregistre chaque instance d'une entité dans une ligne de sa propre table, ce qui supprime la duplication : un fait comme un prix existe à un seul endroit. Elle place aussi chaque attribut dans sa propre colonne, de sorte que chaque valeur est limitée à un type de données approprié.
  options:
    a: { en: "Normalization removes such copies: an order only contains the key of the customer.", fr: "La normalisation supprime ces copies : une commande contient uniquement la clé du client." }
    c: { en: "It is the opposite: entities are in separate tables, so reading several of them requires joins.", fr: "C'est l'inverse : les entités sont dans des tables distinctes, et en lire plusieurs exige donc des jointures." }
    e: { en: "Normalization separates each entity into its own table.", fr: "La normalisation sépare chaque entité dans sa propre table." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
