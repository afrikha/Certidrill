id: dp900-2a-rel-table-shape
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes how a table of a relational database stores data?
  fr: |
    Quelle affirmation décrit la façon dont une table d'une base de données relationnelle stocke les données ?
body:
  options:
    - { id: a, text: { en: "Each record is a document that can define its own fields.", fr: "Chaque enregistrement est un document qui peut définir ses propres champs." } }
    - { id: b, text: { en: "Each record is a key that is associated with a value in any format.", fr: "Chaque enregistrement est une clé associée à une valeur de n'importe quel format." } }
    - { id: c, text: { en: "Each record is a node that is linked to other nodes.", fr: "Chaque enregistrement est un nœud lié à d'autres nœuds." } }
    - { id: d, text: { en: "Each record is a row that has the same columns as the other rows.", fr: "Chaque enregistrement est une ligne qui a les mêmes colonnes que les autres lignes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Relational tables are a format for structured data: all the rows of a table have the same columns, and each column stores data of a specific data type. The other statements describe non-relational stores.
    fr: |
      Les tables relationnelles sont un format pour les données structurées : toutes les lignes d'une table ont les mêmes colonnes, et chaque colonne stocke des données d'un type de données spécifique. Les autres affirmations décrivent des magasins non relationnels.
  options:
    a: { en: "Documents whose fields can differ belong to a document database.", fr: "Des documents dont les champs peuvent différer relèvent d'une base de données de documents." }
    b: { en: "A key associated with a value of any format describes a key-value database.", fr: "Une clé associée à une valeur de n'importe quel format décrit une base de données clé-valeur." }
    c: { en: "Nodes linked to one another describe a graph database.", fr: "Des nœuds liés les uns aux autres décrivent une base de données de graphe." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
