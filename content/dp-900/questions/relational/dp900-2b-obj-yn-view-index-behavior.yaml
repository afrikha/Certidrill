id: dp900-2b-obj-yn-view-index-behavior
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A database contains a table named **Customer** with the columns CustomerID, Email and City. An index exists on the City column. A view named **LyonCustomers** returns the CustomerID and Email columns of the customers whose city is Lyon.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données contient une table nommée **Customer** avec les colonnes CustomerID, Email et City. Un index existe sur la colonne City. Une vue nommée **LyonCustomers** renvoie les colonnes CustomerID et Email des clients dont la ville est Lyon.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the email address of a customer in Lyon is updated in Customer, a query on LyonCustomers returns the new address.
        fr: Après la mise à jour de l'adresse e-mail d'un client de Lyon dans Customer, une requête sur LyonCustomers renvoie la nouvelle adresse.
    - id: s2
      text:
        en: The index on the City column speeds up a query that filters only on the Email column.
        fr: L'index sur la colonne City accélère une requête qui filtre uniquement sur la colonne Email.
    - id: s3
      text:
        en: Removing the LyonCustomers view deletes the customers in Lyon from the Customer table.
        fr: La suppression de la vue LyonCustomers supprime les clients de Lyon de la table Customer.
answer:
  values: {s1: true, s2: false, s3: false}
explanation:
  correct:
    en: 'A view doesn''t store rows: it reads the underlying table each time it''s queried, so it returns the updated address, and removing the view removes only its definition. An index helps the queries that search the indexed column; a filter on Email alone can''t use the sorted copy of the City values.'
    fr: 'Une vue ne stocke pas de lignes : elle lit la table sous-jacente à chaque interrogation. Elle renvoie donc l''adresse mise à jour, et supprimer la vue ne supprime que sa définition. Un index aide les requêtes qui recherchent dans la colonne indexée ; un filtre sur Email seul ne peut pas utiliser la copie triée des valeurs de City.'
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Views
    url: https://learn.microsoft.com/en-us/sql/relational-databases/views/views
