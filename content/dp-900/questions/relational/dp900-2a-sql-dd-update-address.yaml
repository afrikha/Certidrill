id: dp900-2a-sql-dd-update-address
objective: "2.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    The customer whose ID is 1 moves to 123 High St.

    You need to record the new address in the **Customer** table without changing the other customers. How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le client dont l'ID est 1 déménage au 123 High St.

    Vous devez enregistrer la nouvelle adresse dans la table **Customer** sans modifier les autres clients. Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    [[verb]] Customer
    [[assign]] Address = '123 High St.'
    [[filter]] ID = 1;
  slots:
    - id: verb
      options:
        - { id: v_alter, text: "ALTER TABLE" }
        - { id: v_insert, text: "INSERT INTO" }
        - { id: v_update, text: "UPDATE" }
    - id: assign
      options:
        - { id: a_set, text: "SET" }
        - { id: a_values, text: "VALUES" }
        - { id: a_select, text: "SELECT" }
    - id: filter
      options:
        - { id: w_order, text: "ORDER BY" }
        - { id: w_where, text: "WHERE" }
        - { id: w_on, text: "ON" }
answer:
  values: { verb: v_update, assign: a_set, filter: w_where }
explanation:
  correct:
    en: |
      UPDATE modifies existing rows, its SET clause assigns the new value to a column, and its WHERE clause limits the change to the rows that meet the condition. Without the WHERE clause, the address of every customer would be replaced.
    fr: |
      UPDATE modifie des lignes existantes, sa clause SET attribue la nouvelle valeur à une colonne et sa clause WHERE limite la modification aux lignes qui respectent la condition. Sans la clause WHERE, l'adresse de tous les clients serait remplacée.
  options:
    v_alter: { en: "ALTER TABLE changes the structure of the table, not the values of a row.", fr: "ALTER TABLE modifie la structure de la table, pas les valeurs d'une ligne." }
    v_insert: { en: "INSERT INTO would add a new row instead of changing the row of customer 1.", fr: "INSERT INTO ajouterait une nouvelle ligne au lieu de modifier la ligne du client 1." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
