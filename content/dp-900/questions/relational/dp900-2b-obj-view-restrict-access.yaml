id: dp900-2b-obj-view-restrict-access
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A table named **Employee** contains the name, department, salary and bank details of each employee of Woodgrove Bank.

    The reception team must be able to look up the name and department of the employees of the Paris office only. The team must not be able to read the other columns or the other rows, and the data must not be duplicated.

    What should you do?
  fr: |
    Une table nommée **Employee** contient le nom, le service, le salaire et les coordonnées bancaires de chaque employé de Woodgrove Bank.

    L'équipe d'accueil doit pouvoir consulter le nom et le service des employés du bureau de Paris uniquement. L'équipe ne doit pas pouvoir lire les autres colonnes ni les autres lignes, et les données ne doivent pas être dupliquées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Create a view that returns only those columns and rows, and let the team query the view.
        fr: Créer une vue qui ne renvoie que ces colonnes et ces lignes, et laisser l'équipe interroger la vue.
    - id: b
      text:
        en: Create an index on the name and department columns, and let the team query the table.
        fr: Créer un index sur les colonnes du nom et du service, et laisser l'équipe interroger la table.
    - id: c
      text:
        en: Create a second table with those columns and rows, and let the team query that table.
        fr: Créer une seconde table avec ces colonnes et ces lignes, et laisser l'équipe interroger cette table.
    - id: d
      text:
        en: Create a stored procedure that updates those columns, and let the team run the procedure.
        fr: Créer une procédure stockée qui met à jour ces colonnes, et laisser l'équipe exécuter la procédure.
answer: {optionId: a}
explanation:
  correct:
    en: 'A view acts as a window on chosen rows and columns of the underlying table: here the name and department of the Paris employees. Users can be given access through the view without any permission on the table itself, so the salary and bank details stay hidden, and no data is copied.'
    fr: 'Une vue agit comme une fenêtre sur des lignes et des colonnes choisies de la table sous-jacente : ici le nom et le service des employés de Paris. Les utilisateurs peuvent recevoir un accès par la vue sans aucune autorisation sur la table elle-même : le salaire et les coordonnées bancaires restent masqués, et aucune donnée n''est copiée.'
  options:
    b:
      en: 'An index doesn''t restrict what users read: a team that queries the table can read every column and every row.'
      fr: 'Un index ne limite pas ce que les utilisateurs lisent : une équipe qui interroge la table peut lire toutes les colonnes et toutes les lignes.'
    c:
      en: A second table duplicates the data, which the requirement forbids, and it must be kept in sync with the original.
      fr: Une seconde table duplique les données, ce que l'exigence interdit, et elle doit rester synchronisée avec la table d'origine.
    d:
      en: A procedure that updates the columns lets the team change data; it doesn't give the read-only lookup that is required.
      fr: Une procédure qui met à jour les colonnes permet à l'équipe de modifier des données ; elle n'offre pas la consultation en lecture seule demandée.
references:
