id: dp900-2a-norm-update-address
objective: "2.1.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A normalized database contains the tables **Customer**, **SalesOrder** and **LineItem**. A customer who has placed 40 orders moves to a new address.

    How many rows must you modify to record the new address?
  fr: |
    Une base de données normalisée contient les tables **Customer**, **SalesOrder** et **LineItem**. Un client qui a passé 40 commandes change d'adresse.

    Combien de lignes devez-vous modifier pour enregistrer la nouvelle adresse ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "40" }
    - { id: d, text: "41" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a normalized database, each customer is recorded as a single row of the Customer table, and the orders only refer to that row through its key. Changing the address therefore modifies the value in one row, whatever the number of orders.
    fr: |
      Dans une base de données normalisée, chaque client est enregistré dans une seule ligne de la table Customer, et les commandes font seulement référence à cette ligne par sa clé. Changer l'adresse modifie donc la valeur dans une seule ligne, quel que soit le nombre de commandes.
  options:
    b: { en: "The address is an attribute of the customer only; no second table stores it.", fr: "L'adresse est un attribut du client uniquement ; aucune deuxième table ne la stocke." }
    c: { en: "The orders contain the key of the customer, not a copy of the address.", fr: "Les commandes contiennent la clé du client, pas une copie de l'adresse." }
    d: { en: "Only the customer row changes; the 40 order rows keep the same customer key.", fr: "Seule la ligne du client change ; les 40 lignes de SalesOrder conservent la même clé de client." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
