id: dp900-2a-norm-design-stage
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At which point does a database professional apply normalization?
  fr: |
    À quel moment un professionnel des bases de données applique-t-il la normalisation ?
body:
  options:
    - { id: a, text: { en: "When backing up the database", fr: "Lors de la sauvegarde de la base de données" } }
    - { id: b, text: { en: "When designing the schema of the database", fr: "Lors de la conception du schéma de la base de données" } }
    - { id: c, text: { en: "When granting permissions to the users", fr: "Lors de l'octroi d'autorisations aux utilisateurs" } }
    - { id: d, text: { en: "When sorting the results of a query", fr: "Lors du tri des résultats d'une requête" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Normalization is a schema design process: it decides which tables exist, which columns they contain and which keys link them. It is therefore applied when the schema of the database is designed.
    fr: |
      La normalisation est un processus de conception de schéma : elle détermine quelles tables existent, quelles colonnes elles contiennent et quelles clés les lient. Elle s'applique donc lors de la conception du schéma de la base de données.
  options:
    a: { en: "A backup copies the database as it is; it doesn't change the structure of the tables.", fr: "Une sauvegarde copie la base de données telle qu'elle est ; elle ne modifie pas la structure des tables." }
    c: { en: "Permissions control who can use the objects; they don't shape the tables.", fr: "Les autorisations contrôlent qui peut utiliser les objets ; elles ne façonnent pas les tables." }
    d: { en: "Sorting concerns the result of one query, not the design of the tables.", fr: "Le tri concerne le résultat d'une requête, pas la conception des tables." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
