id: dp900-2b-obj-view-reuse-join
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts at Fabrikam often write the same query, which joins the **SalesOrder** and **Customer** tables to list delivery addresses.

    You need to let the analysts get this result by querying a single object as if it were a table. The solution must not store a second copy of the data.

    What should you create?
  fr: |
    Les analystes de Fabrikam écrivent souvent la même requête, qui joint les tables **SalesOrder** et **Customer** pour lister les adresses de livraison.

    Vous devez permettre aux analystes d'obtenir ce résultat en interrogeant un seul objet comme s'il s'agissait d'une table. La solution ne doit pas stocker de seconde copie des données.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: An index on the columns that the join uses
        fr: Un index sur les colonnes utilisées par la jointure
    - id: b
      text:
        en: A table that is loaded with the result of the join
        fr: Une table chargée avec le résultat de la jointure
    - id: c
      text:
        en: A foreign key between the two tables
        fr: Une clé étrangère entre les deux tables
    - id: d
      text:
        en: A view based on the query that contains the join
        fr: Une vue basée sur la requête qui contient la jointure
answer: {optionId: d}
explanation:
  correct:
    en: A view is a virtual table based on a SELECT query, which can join several tables. The analysts query the view like a table, and the rows are read from SalesOrder and Customer each time, so no data is copied.
    fr: 'Une vue est une table virtuelle basée sur une requête SELECT, qui peut joindre plusieurs tables. Les analystes interrogent la vue comme une table, et les lignes sont lues dans SalesOrder et Customer à chaque fois : aucune donnée n''est copiée.'
  options:
    a:
      en: An index can make the join faster, but the analysts would still have to write the join themselves.
      fr: Un index peut accélérer la jointure, mais les analystes devraient toujours écrire la jointure eux-mêmes.
    b:
      en: A table loaded with the result stores a second copy of the data, which must also be kept up to date.
      fr: Une table chargée avec le résultat stocke une seconde copie des données, qu'il faut en plus tenir à jour.
    c:
      en: A foreign key enforces the relationship between the two tables; the analysts would still have to write the join.
      fr: Une clé étrangère impose la relation entre les deux tables ; les analystes devraient toujours écrire la jointure.
references:
