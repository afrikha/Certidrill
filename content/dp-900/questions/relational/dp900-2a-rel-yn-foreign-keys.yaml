id: dp900-2a-rel-yn-foreign-keys
objective: "2.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A relational database contains the tables **Customer**, **Product**, **SalesOrder** and **LineItem**. Foreign keys link the tables.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données relationnelle contient les tables **Customer**, **Product**, **SalesOrder** et **LineItem**. Des clés étrangères lient les tables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Several rows of SalesOrder can contain the same foreign key value.", fr: "Plusieurs lignes de SalesOrder peuvent contenir la même valeur de clé étrangère." } }
    - { id: s2, text: { en: "A foreign key column must have the same name as the primary key column to which it refers.", fr: "Une colonne de clé étrangère doit porter le même nom que la colonne de clé primaire à laquelle elle fait référence." } }
    - { id: s3, text: { en: "LineItem can contain one foreign key that refers to SalesOrder and another that refers to Product.", fr: "LineItem peut contenir une clé étrangère qui fait référence à SalesOrder et une autre qui fait référence à Product." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A customer can place several orders, so the same customer key appears as a foreign key in several rows of SalesOrder. A table can hold several foreign keys: each line item refers to its order and to its product. A foreign key only has to contain the key value of the related row; its column name is free, for example a Customer column that refers to the ID column of the Customer table.
    fr: |
      Un client peut passer plusieurs commandes : la même clé de client apparaît donc comme clé étrangère dans plusieurs lignes de SalesOrder. Une table peut contenir plusieurs clés étrangères : chaque ligne de LineItem fait référence à sa commande et à son produit. Une clé étrangère doit seulement contenir la valeur de clé de la ligne associée ; le nom de sa colonne est libre, par exemple une colonne Customer qui fait référence à la colonne ID de la table Customer.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
