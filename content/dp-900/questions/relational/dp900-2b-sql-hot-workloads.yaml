id: dp900-2b-sql-hot-workloads
objective: "2.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to move the four workloads described in the following table to Azure. Each workload must use the service that meets its requirement with the least administrative effort.

    Answer each prompt by selecting the appropriate workload.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déplacer vers Azure les quatre charges de travail décrites dans le tableau suivant. Chaque charge de travail doit utiliser le service qui répond à son exigence avec le moins d'effort d'administration.

    Répondez à chaque consigne en sélectionnant la charge de travail appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: The workload that you should deploy to Azure SQL Managed Instance
        fr: La charge de travail à déployer sur Azure SQL Managed Instance
    - id: p2
      text:
        en: The workload that requires SQL Server on Azure Virtual Machines
        fr: La charge de travail qui exige SQL Server sur Machines Virtuelles Azure
  grid:
    header:
      - en: Workload
        fr: Charge de travail
      - en: Database today
        fr: Base de données actuelle
      - en: Requirement
        fr: Exigence
    rows:
      - - text: App1
          area: app1
        - text:
            en: New application that uses Transact-SQL; no existing database
            fr: Nouvelle application qui utilise Transact-SQL ; aucune base de données existante
        - text:
            en: One database, at the lowest cost
            fr: Une seule base de données, au coût le plus bas
      - - text: App2
          area: app2
        - text:
            en: SQL Server database; a monitoring agent of the application vendor runs on the same operating system
            fr: Base de données SQL Server ; un agent de supervision de l'éditeur de l'application s'exécute sur le même système d'exploitation
        - text:
            en: Keep the vendor's agent installed next to SQL Server
            fr: Conserver l'agent de l'éditeur installé à côté de SQL Server
      - - text: App3
          area: app3
        - text:
            en: PostgreSQL database
            fr: Base de données PostgreSQL
        - text:
            en: No change to the application code
            fr: Aucune modification du code de l'application
      - - text: App4
          area: app4
        - text:
            en: SQL Server instance with five databases that use cross-database queries and SQL Server Agent jobs
            fr: Instance SQL Server avec cinq bases de données qui utilisent des requêtes entre bases de données et des travaux SQL Server Agent
        - text:
            en: No operating system to manage; minimal changes to the databases
            fr: Aucun système d'exploitation à gérer ; un minimum de modifications des bases de données
answer:
  values: {p1: app4, p2: app2}
explanation:
  correct:
    en: 'App4 depends on instance-level features (cross-database queries and SQL Server Agent) and must not require any operating system management: Azure SQL Managed Instance provides these features as PaaS. App2 needs software installed on the operating system next to SQL Server, which only an IaaS virtual machine allows. App1 fits Azure SQL Database, and App3 fits Azure Database for PostgreSQL.'
    fr: 'App4 dépend de fonctionnalités de niveau instance (requêtes entre bases de données et SQL Server Agent) et ne doit exiger aucune gestion de système d''exploitation : Azure SQL Managed Instance fournit ces fonctionnalités en PaaS. App2 a besoin d''un logiciel installé sur le système d''exploitation à côté de SQL Server, ce que seule une machine virtuelle IaaS permet. App1 correspond à Azure SQL Database, et App3 à Azure Database pour PostgreSQL.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: 'Features comparison: Azure SQL Database and Azure SQL Managed Instance'
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
