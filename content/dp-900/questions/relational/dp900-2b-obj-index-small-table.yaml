id: dp900-2b-obj-index-small-table
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A table named **Country** contains 40 rows. A table named **Reading** contains 300 million rows. You create an index on the column used in the `WHERE` clause of the most frequent query of each table.

    Which result should you expect?
  fr: |
    Une table nommée **Country** contient 40 lignes. Une table nommée **Reading** contient 300 millions de lignes. Vous créez un index sur la colonne utilisée dans la clause `WHERE` de la requête la plus fréquente de chaque table.

    À quel résultat devez-vous vous attendre ?
body:
  options:
    - id: a
      text:
        en: Both queries become much faster, because an index always replaces the reading of the table.
        fr: Les deux requêtes deviennent beaucoup plus rapides, car un index remplace toujours la lecture de la table.
    - id: b
      text:
        en: The query on Country becomes much faster; for Reading, the table is too large for an index to be used.
        fr: La requête sur Country devient beaucoup plus rapide ; pour Reading, la table est trop grande pour qu'un index soit utilisé.
    - id: c
      text:
        en: The query on Reading becomes much faster; for Country, the database may ignore the index and read the whole table.
        fr: La requête sur Reading devient beaucoup plus rapide ; pour Country, la base de données peut ignorer l'index et lire toute la table.
    - id: d
      text:
        en: Neither query changes, because an index only speeds up INSERT, UPDATE and DELETE operations.
        fr: Aucune des deux requêtes ne change, car un index n'accélère que les opérations INSERT, UPDATE et DELETE.
answer: {optionId: c}
explanation:
  correct:
    en: An index lets the database locate values in a sorted structure instead of reading every row, which greatly improves performance on a table with many rows. For a table with few rows, reading the whole table is about as efficient, so the query optimizer may ignore the index.
    fr: 'Un index permet à la base de données de localiser les valeurs dans une structure triée au lieu de lire chaque ligne, ce qui améliore fortement les performances sur une table qui compte beaucoup de lignes. Pour une table de quelques lignes, lire toute la table est à peu près aussi efficace : l''optimiseur de requête peut donc ignorer l''index.'
  options:
    a:
      en: 'An index isn''t always used: the query optimizer chooses the most efficient way to read the data, which can be to read the whole table.'
      fr: 'Un index n''est pas toujours utilisé : l''optimiseur de requête choisit la façon la plus efficace de lire les données, qui peut être de lire toute la table.'
    b:
      en: 'It''s the opposite: the more rows a table has, the more an index helps.'
      fr: 'C''est l''inverse : plus une table compte de lignes, plus un index est utile.'
    d:
      en: Indexes speed up searches. They add work to INSERT, UPDATE and DELETE operations, because each index must be maintained.
      fr: Les index accélèrent les recherches. Ils ajoutent du travail aux opérations INSERT, UPDATE et DELETE, car chaque index doit être tenu à jour.
references:
