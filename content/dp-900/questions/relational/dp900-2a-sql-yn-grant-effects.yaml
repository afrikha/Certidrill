id: dp900-2a-sql-yn-grant-effects
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A database administrator runs the following statement. The user named **user1** has no other permission on the Product table and belongs to no role.

    ```text
    GRANT SELECT, INSERT
    ON Product
    TO user1;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur de base de données exécute l'instruction suivante. L'utilisateur nommé **user1** n'a aucune autre autorisation sur la table Product et n'appartient à aucun rôle.

    ```text
    GRANT SELECT, INSERT
    ON Product
    TO user1;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "user1 can read the rows of the Product table.", fr: "user1 peut lire les lignes de la table Product." } }
    - { id: s2, text: { en: "user1 can change the price of an existing product.", fr: "user1 peut modifier le prix d'un produit existant." } }
    - { id: s3, text: { en: "The statement is a Data Manipulation Language (DML) statement because it contains SELECT and INSERT.", fr: "L'instruction est une instruction du langage de manipulation de données (DML), car elle contient SELECT et INSERT." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      GRANT gives user1 the permission to run SELECT and INSERT on the Product table, so user1 can read its rows and add rows. Changing a price requires an UPDATE statement, for which user1 has no permission. The statement itself is a DCL statement: SELECT and INSERT are only the names of the permissions that it grants.
    fr: |
      GRANT donne à user1 l'autorisation d'exécuter SELECT et INSERT sur la table Product : user1 peut donc lire ses lignes et en ajouter. Modifier un prix exige une instruction UPDATE, pour laquelle user1 n'a aucune autorisation. L'instruction elle-même est une instruction DCL : SELECT et INSERT ne sont que les noms des autorisations qu'elle accorde.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "GRANT (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-transact-sql
