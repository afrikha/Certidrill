id: dp900-2b-oss-yn-services
objective: "2.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Azure services for open-source databases, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les services Azure pour les bases de données open source, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An application written for MySQL must be rewritten before it can use Azure Database for MySQL.
        fr: Une application écrite pour MySQL doit être réécrite avant de pouvoir utiliser Azure Database pour MySQL.
    - id: s2
      text:
        en: Azure Database for MySQL provides high availability with automatic failover.
        fr: Azure Database pour MySQL fournit une haute disponibilité avec basculement automatique.
    - id: s3
      text:
        en: Azure Database for PostgreSQL takes backups automatically.
        fr: Azure Database pour PostgreSQL effectue des sauvegardes automatiquement.
answer:
  values: {s1: false, s2: true, s3: true}
explanation:
  correct:
    en: These services exist so that applications built on MySQL or PostgreSQL can move to Azure without significant changes. Both are PaaS services with built-in high availability and automatic failover, and with automatic backups that allow a point-in-time restore.
    fr: Ces services existent pour que les applications construites sur MySQL ou PostgreSQL puissent passer à Azure sans modification importante. Ce sont tous deux des services PaaS avec une haute disponibilité intégrée et un basculement automatique, et avec des sauvegardes automatiques qui permettent une restauration à un point dans le temps.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
