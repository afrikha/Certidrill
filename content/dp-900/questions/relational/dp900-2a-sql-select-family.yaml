id: dp900-2a-sql-select-family
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run the following statement.

    ```text
    SELECT FirstName, LastName
    FROM Customer
    WHERE City = 'Seattle';
    ```

    To which family of SQL statements does this statement belong?
  fr: |
    Vous exécutez l'instruction suivante.

    ```text
    SELECT FirstName, LastName
    FROM Customer
    WHERE City = 'Seattle';
    ```

    À quelle famille d'instructions SQL cette instruction appartient-elle ?
body:
  options:
    - { id: a, text: { en: "Data Control Language (DCL)", fr: "Langage de contrôle des données (DCL)" } }
    - { id: b, text: { en: "Data Definition Language (DDL)", fr: "Langage de définition de données (DDL)" } }
    - { id: c, text: { en: "Data Manipulation Language (DML)", fr: "Langage de manipulation de données (DML)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Data Manipulation Language groups the statements that work on the rows of tables: SELECT reads rows, INSERT adds them, UPDATE modifies them and DELETE removes them. A query that only reads data is therefore a DML statement.
    fr: |
      Le langage de manipulation de données regroupe les instructions qui travaillent sur les lignes des tables : SELECT lit des lignes, INSERT en ajoute, UPDATE les modifie et DELETE les supprime. Une requête qui se contente de lire des données est donc une instruction DML.
  options:
    a: { en: "DCL statements (GRANT, DENY, REVOKE) manage permissions; they don't return rows.", fr: "Les instructions DCL (GRANT, DENY, REVOKE) gèrent les autorisations ; elles ne retournent pas de lignes." }
    b: { en: "DDL statements (CREATE, ALTER, DROP, RENAME) define objects such as tables; they don't read their rows.", fr: "Les instructions DDL (CREATE, ALTER, DROP, RENAME) définissent des objets comme les tables ; elles ne lisent pas leurs lignes." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "Transact-SQL statements"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements
