id: dp900-2a-norm-split-address
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **Customer** has a column named **Address** that stores values such as `42 Oak St, Seattle`. Users often need to list the customers of one city, and the current design makes this filter unreliable.

    Which change applies a rule of normalization to solve the problem?
  fr: |
    Une table nommée **Customer** comporte une colonne nommée **Address** qui stocke des valeurs comme `42 Oak St, Seattle`. Les utilisateurs doivent souvent lister les clients d'une ville, et la conception actuelle rend ce filtre peu fiable.

    Quelle modification applique une règle de normalisation pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Store the street and the city in two separate columns.", fr: "Stocker la rue et la ville dans deux colonnes distinctes." } }
    - { id: b, text: { en: "Store a copy of the Address column in the SalesOrder table.", fr: "Stocker une copie de la colonne Address dans la table SalesOrder." } }
    - { id: c, text: { en: "Define the Address column as the primary key of the table.", fr: "Définir la colonne Address comme clé primaire de la table." } }
    - { id: d, text: { en: "Create one Customer table for each city.", fr: "Créer une table Customer pour chaque ville." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      One rule of normalization is to separate each discrete attribute into its own column. With the city in its own column, a query can filter the customers of a specific city directly instead of searching inside a longer text.
    fr: |
      Une règle de la normalisation consiste à séparer chaque attribut distinct dans sa propre colonne. Avec la ville dans sa propre colonne, une requête peut filtrer directement les clients d'une ville donnée au lieu de chercher à l'intérieur d'un texte plus long.
  options:
    b: { en: "A copy in another table adds duplication and leaves the city mixed with the street.", fr: "Une copie dans une autre table ajoute de la duplication et laisse la ville mélangée à la rue." }
    c: { en: "A key identifies rows; two customers can share an address, and the city would still be part of a longer text.", fr: "Une clé identifie les lignes ; deux clients peuvent partager une adresse, et la ville resterait une partie d'un texte plus long." }
    d: { en: "Customers are one entity and belong in one table; the city is an attribute, not a reason to multiply tables.", fr: "Les clients forment une seule entité et vont dans une seule table ; la ville est un attribut, pas une raison de multiplier les tables." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
