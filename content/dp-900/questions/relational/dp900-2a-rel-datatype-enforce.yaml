id: dp900-2a-rel-datatype-enforce
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **LineItem** contains a column named **Quantity**. Every value in the column must be a whole number: a value such as the text `two` must be refused.

    Which feature of a relational table provides this guarantee?
  fr: |
    Une table nommée **LineItem** contient une colonne nommée **Quantity**. Chaque valeur de la colonne doit être un nombre entier : une valeur comme le texte `two` doit être refusée.

    Quelle caractéristique d'une table relationnelle apporte cette garantie ?
body:
  options:
    - { id: a, text: { en: "The primary key of the table", fr: "La clé primaire de la table" } }
    - { id: b, text: { en: "The data type of the column", fr: "Le type de données de la colonne" } }
    - { id: c, text: { en: "A NULL value in the column", fr: "Une valeur NULL dans la colonne" } }
    - { id: d, text: { en: "A foreign key on the column", fr: "Une clé étrangère sur la colonne" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each column of a relational table is defined with a data type, and the database accepts only values of that type in the column. A Quantity column defined with an integer type therefore can't store text.
    fr: |
      Chaque colonne d'une table relationnelle est définie avec un type de données, et la base de données n'accepte dans la colonne que des valeurs de ce type. Une colonne Quantity définie avec un type entier ne peut donc pas stocker de texte.
  options:
    a: { en: "The primary key identifies each row uniquely; it doesn't control the kind of value stored in the Quantity column.", fr: "La clé primaire identifie chaque ligne de façon unique ; elle ne contrôle pas la nature des valeurs stockées dans la colonne Quantity." }
    c: { en: "NULL marks an absent value; it doesn't restrict the values that are present.", fr: "NULL indique une valeur absente ; il ne limite pas les valeurs présentes." }
    d: { en: "A foreign key links a row to a row of another table; a quantity doesn't refer to another table.", fr: "Une clé étrangère lie une ligne à une ligne d'une autre table ; une quantité ne fait référence à aucune autre table." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
