id: dp900-2b-oss-dd-languages
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The procedural language of PostgreSQL, used to write stored procedures, is [[pg]].

      The SQL dialect of SQL Server and of the Azure SQL services is [[ms]].
    fr: |
      Le langage procédural de PostgreSQL, utilisé pour écrire des procédures stockées, est [[pg]].

      Le dialecte SQL de SQL Server et des services Azure SQL est [[ms]].
  slots:
    - id: pg
      options:
        - {id: plpgsql, text: PL/pgSQL}
        - {id: plsql, text: PL/SQL}
        - {id: tsql, text: Transact-SQL}
    - id: ms
      options:
        - {id: plpgsql, text: PL/pgSQL}
        - {id: plsql, text: PL/SQL}
        - {id: tsql, text: Transact-SQL}
answer:
  values: {pg: plpgsql, ms: tsql}
explanation:
  correct:
    en: PostgreSQL has its own procedural language, PL/pgSQL, which extends SQL with features for writing stored procedures that run inside the database. SQL Server, Azure SQL Database, Azure SQL Managed Instance and SQL Server on Azure Virtual Machines use Transact-SQL (T-SQL).
    fr: PostgreSQL possède son propre langage procédural, PL/pgSQL, qui étend SQL avec des fonctionnalités d'écriture de procédures stockées exécutées dans la base de données. SQL Server, Azure SQL Database, Azure SQL Managed Instance et SQL Server sur Machines Virtuelles Azure utilisent Transact-SQL (T-SQL).
  options:
    plsql:
      en: PL/SQL is the dialect used by Oracle.
      fr: PL/SQL est le dialecte utilisé par Oracle.
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: Explore SQL
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
