id: dp900-2a-sql-dd-grant
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A user named **user1** has no permission on the **Product** table. The user must be able to read the rows of the table and to add rows to it, and nothing more.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un utilisateur nommé **user1** n'a aucune autorisation sur la table **Product**. L'utilisateur doit pouvoir lire les lignes de la table et y ajouter des lignes, et rien de plus.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    [[verb]] SELECT, [[perm]]
    ON Product
    TO user1;
  slots:
    - id: verb
      options:
        - { id: g_deny, text: "DENY" }
        - { id: g_revoke, text: "REVOKE" }
        - { id: g_grant, text: "GRANT" }
    - id: perm
      options:
        - { id: p_insert, text: "INSERT" }
        - { id: p_update, text: "UPDATE" }
        - { id: p_delete, text: "DELETE" }
        - { id: p_alter, text: "ALTER" }
answer:
  values: { verb: g_grant, perm: p_insert }
explanation:
  correct:
    en: |
      GRANT is the DCL statement that gives permissions to a user. Reading rows requires the SELECT permission, which the statement already lists, and adding rows requires the INSERT permission.
    fr: |
      GRANT est l'instruction DCL qui accorde des autorisations à un utilisateur. Lire des lignes exige l'autorisation SELECT, que l'instruction liste déjà, et ajouter des lignes exige l'autorisation INSERT.
  options:
    g_deny: { en: "DENY refuses the permissions to the user.", fr: "DENY refuse les autorisations à l'utilisateur." }
    g_revoke: { en: "REVOKE removes permissions that were granted before; user1 has none.", fr: "REVOKE supprime des autorisations accordées auparavant ; user1 n'en a aucune." }
    p_update: { en: "UPDATE allows changes to existing rows, which isn't required.", fr: "UPDATE permet de modifier des lignes existantes, ce qui n'est pas demandé." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "GRANT (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-transact-sql
