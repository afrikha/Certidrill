id: dp900-2b-oss-postgresql-extensions
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to migrate an on-premises PostgreSQL database to Azure Database for PostgreSQL.

    What should Fabrikam check before the migration?
  fr: |
    Fabrikam prévoit de migrer une base de données PostgreSQL locale vers Azure Database pour PostgreSQL.

    Que doit vérifier Fabrikam avant la migration ?
body:
  options:
    - id: a
      text:
        en: That the extensions that the database uses are among those that the service supports
        fr: Que les extensions utilisées par la base de données font partie de celles que le service prend en charge
    - id: b
      text:
        en: That the stored procedures have been rewritten from PL/pgSQL to Transact-SQL
        fr: Que les procédures stockées ont été réécrites de PL/pgSQL vers Transact-SQL
    - id: c
      text:
        en: That a virtual machine has been sized to host the PostgreSQL software
        fr: Qu'une machine virtuelle a été dimensionnée pour héberger le logiciel PostgreSQL
    - id: d
      text:
        en: That the tables have been converted to the document model of the service
        fr: Que les tables ont été converties vers le modèle de documents du service
answer: {optionId: a}
explanation:
  correct:
    en: 'PostgreSQL can be extended with code modules called extensions. Azure Database for PostgreSQL supports a defined set of extensions, so some features of an on-premises server may be unavailable: Fabrikam must check that the extensions it relies on are in the supported list.'
    fr: 'PostgreSQL peut être étendu par des modules de code appelés extensions. Azure Database pour PostgreSQL prend en charge un ensemble défini d''extensions : certaines fonctionnalités d''un serveur local peuvent donc être indisponibles. Fabrikam doit vérifier que les extensions dont elle dépend figurent dans la liste prise en charge.'
  options:
    b:
      en: 'The service runs the PostgreSQL engine: procedures written in PL/pgSQL keep working. Transact-SQL belongs to the Azure SQL services.'
      fr: 'Le service exécute le moteur PostgreSQL : les procédures écrites en PL/pgSQL continuent de fonctionner. Transact-SQL relève des services Azure SQL.'
    c:
      en: 'The service is PaaS: Azure manages the virtual servers, and there''s no virtual machine for the customer to size.'
      fr: 'Le service est PaaS : Azure gère les serveurs virtuels, et le client n''a aucune machine virtuelle à dimensionner.'
    d:
      en: 'The service is a relational database service: the tables stay relational tables.'
      fr: 'Le service est un service de base de données relationnelle : les tables restent des tables relationnelles.'
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: Extensions and modules in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/concepts-extensions
