id: dp900-2a-sql-order-first-table
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A new database contains no tables. You need to store the products of Adatum: a table must exist, then contain a first product, and finally the price of that product must be corrected.

    Which three statements should you run in sequence? To answer, move the appropriate statements from the list of statements to the answer area and arrange them in the correct order.
  fr: |
    Une nouvelle base de données ne contient aucune table. Vous devez stocker les produits d'Adatum : une table doit exister, puis contenir un premier produit, et enfin le prix de ce produit doit être corrigé.

    Quelles sont les trois instructions à exécuter dans l'ordre ? Pour répondre, déplacez les instructions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: select, text: { en: "Run a SELECT statement on the Product table.", fr: "Exécuter une instruction SELECT sur la table Product." } }
    - { id: update, text: { en: "Run an UPDATE statement on the Product table.", fr: "Exécuter une instruction UPDATE sur la table Product." } }
    - { id: create, text: { en: "Run a CREATE TABLE statement for the Product table.", fr: "Exécuter une instruction CREATE TABLE pour la table Product." } }
    - { id: drop, text: { en: "Run a DROP TABLE statement for the Product table.", fr: "Exécuter une instruction DROP TABLE pour la table Product." } }
    - { id: insert, text: { en: "Run an INSERT statement on the Product table.", fr: "Exécuter une instruction INSERT sur la table Product." } }
    - { id: alter, text: { en: "Run an ALTER TABLE statement for the Product table.", fr: "Exécuter une instruction ALTER TABLE pour la table Product." } }
answer:
  sequence: [ create, insert, update ]
explanation:
  correct:
    en: |
      CREATE TABLE first defines the table, because rows can't be stored in a table that doesn't exist. INSERT then adds the row of the first product, and UPDATE modifies the price in that existing row. ALTER TABLE would change the structure of the table, DROP TABLE would remove it, and SELECT only reads rows.
    fr: |
      CREATE TABLE définit d'abord la table, car des lignes ne peuvent pas être stockées dans une table qui n'existe pas. INSERT ajoute ensuite la ligne du premier produit, et UPDATE modifie le prix dans cette ligne existante. ALTER TABLE modifierait la structure de la table, DROP TABLE la supprimerait et SELECT se contente de lire des lignes.
  options:
    select: { en: "SELECT reads rows; it neither creates the table nor changes its content.", fr: "SELECT lit des lignes ; elle ne crée pas la table et ne modifie pas son contenu." }
    drop: { en: "DROP TABLE would remove the table and its rows.", fr: "DROP TABLE supprimerait la table et ses lignes." }
    alter: { en: "ALTER TABLE changes the columns of the table, not the price stored in a row.", fr: "ALTER TABLE modifie les colonnes de la table, pas le prix stocké dans une ligne." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
