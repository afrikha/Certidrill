id: dp900-2a-rel-dd-count
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A relational database contains a table named **Product**, shown below.

    | ProductID | Name | Price | Color |
    | --- | --- | --- | --- |
    | 1 | Kettle | 24.50 | NULL |
    | 2 | Toaster | 31.00 | Red |
    | 3 | Mixer | 55.00 | NULL |

    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données relationnelle contient une table nommée **Product**, présentée ci-dessous.

    | ProductID | Name | Price | Color |
    | --- | --- | --- | --- |
    | 1 | Kettle | 24.50 | NULL |
    | 2 | Toaster | 31.00 | Red |
    | 3 | Mixer | 55.00 | NULL |

    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The Product table models one entity. It contains [[inst]] instances of that entity, and every instance has the same [[cols]] columns.
    fr: |
      La table Product modélise une entité. Elle contient [[inst]] instances de cette entité, et chaque instance a les mêmes [[cols]] colonnes.
  slots:
    - id: inst
      options:
        - { id: i3, text: "3" }
        - { id: i4, text: "4" }
        - { id: i12, text: "12" }
    - id: cols
      options:
        - { id: c2, text: "2" }
        - { id: c3, text: "3" }
        - { id: c4, text: "4" }
answer:
  values: { inst: i3, cols: c4 }
explanation:
  correct:
    en: |
      Each row of a table is one instance of the entity, so the three rows are three products. Every row has the same four columns, ProductID, Name, Price and Color, even when the value of a column is NULL.
    fr: |
      Chaque ligne d'une table est une instance de l'entité : les trois lignes sont donc trois produits. Chaque ligne a les quatre mêmes colonnes, ProductID, Name, Price et Color, même lorsque la valeur d'une colonne est NULL.
  options:
    i4: { en: "Four is the number of columns, not the number of products.", fr: "Quatre est le nombre de colonnes, pas le nombre de produits." }
    i12: { en: "Twelve is the number of cells; an instance is a whole row.", fr: "Douze est le nombre de cellules ; une instance est une ligne entière." }
    c3: { en: "A row that contains NULL in Color still has the Color column.", fr: "Une ligne qui contient NULL dans Color possède toujours la colonne Color." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
