id: dp900-2a-rel-yn-null
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A table named **Product** has a mandatory column named **Name** and a column named **Price** that allows NULL.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Product** comporte une colonne obligatoire nommée **Name** et une colonne nommée **Price** qui autorise NULL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A product whose price isn't known yet can be stored as a row of the table.", fr: "Un produit dont le prix n'est pas encore connu peut être stocké comme une ligne de la table." } }
    - { id: s2, text: { en: "A row in which Price is NULL has a price of 0.", fr: "Une ligne dans laquelle Price vaut NULL a un prix de 0." } }
    - { id: s3, text: { en: "A row in which Price is NULL has the same columns as the other rows of the table.", fr: "Une ligne dans laquelle Price vaut NULL a les mêmes colonnes que les autres lignes de la table." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Because Price allows NULL, a product can be stored before its price is known. NULL means that the value is absent or unknown; it isn't the number 0. The row still has every column of the table: only the value of one column is missing.
    fr: |
      Comme Price autorise NULL, un produit peut être stocké avant que son prix soit connu. NULL signifie que la valeur est absente ou inconnue ; ce n'est pas le nombre 0. La ligne possède toujours toutes les colonnes de la table : seule la valeur d'une colonne manque.
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
