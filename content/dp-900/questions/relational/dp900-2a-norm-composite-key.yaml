id: dp900-2a-norm-composite-key
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A training company stores enrollments in a table named **Enrollment**, shown below. A student can enroll in several courses, a course accepts several students, and a student can enroll in a given course only once.

    | StudentID | CourseID | EnrollDate |
    | --- | --- | --- |
    | 17 | C1 | 2026-09-01 |
    | 17 | C2 | 2026-09-01 |
    | 42 | C1 | 2026-09-03 |

    What should the primary key of the table be?
  fr: |
    Un organisme de formation stocke les inscriptions dans une table nommée **Enrollment**, présentée ci-dessous. Un étudiant peut s'inscrire à plusieurs cours, un cours accepte plusieurs étudiants et un étudiant ne peut s'inscrire qu'une seule fois à un cours donné.

    | StudentID | CourseID | EnrollDate |
    | --- | --- | --- |
    | 17 | C1 | 2026-09-01 |
    | 17 | C2 | 2026-09-01 |
    | 42 | C1 | 2026-09-03 |

    Quelle doit être la clé primaire de la table ?
body:
  options:
    - { id: a, text: { en: "StudentID only", fr: "StudentID seul" } }
    - { id: b, text: { en: "CourseID only", fr: "CourseID seul" } }
    - { id: c, text: { en: "The combination of StudentID and CourseID", fr: "La combinaison de StudentID et CourseID" } }
    - { id: d, text: { en: "The combination of StudentID and EnrollDate", fr: "La combinaison de StudentID et EnrollDate" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      No single column identifies an enrollment: a student and a course both appear on several rows. Because a student enrolls in a given course only once, the pair StudentID and CourseID is unique, so the table uses a composite key based on that combination of columns.
    fr: |
      Aucune colonne ne suffit à identifier une inscription : un étudiant et un cours apparaissent chacun sur plusieurs lignes. Comme un étudiant ne s'inscrit qu'une seule fois à un cours donné, la paire StudentID et CourseID est unique : la table utilise donc une clé composite basée sur cette combinaison de colonnes.
  options:
    a: { en: "Student 17 appears on two rows, so StudentID alone isn't unique.", fr: "L'étudiant 17 apparaît sur deux lignes : StudentID seul n'est donc pas unique." }
    b: { en: "Course C1 appears on two rows, so CourseID alone isn't unique.", fr: "Le cours C1 apparaît sur deux lignes : CourseID seul n'est donc pas unique." }
    d: { en: "Student 17 enrolled in two courses on the same date, so this pair is repeated.", fr: "L'étudiant 17 s'est inscrit à deux cours à la même date : cette paire est donc répétée." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Primary and foreign key constraints"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
