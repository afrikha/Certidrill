id: dp900-2b-sql-database-deployment-options
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two options can you use to deploy a database in Azure SQL Database? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux options que vous pouvez utiliser pour déployer une base de données dans Azure SQL Database ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: A single database
        fr: Une base de données unique
    - id: b
      text:
        en: An instance pool
        fr: Un pool d'instances
    - id: c
      text:
        en: A Flexible Server
        fr: Un Serveur flexible
    - id: d
      text:
        en: An elastic pool
        fr: Un pool élastique
    - id: e
      text:
        en: A virtual machine
        fr: Une machine virtuelle
answer: {optionIds: [a, d]}
explanation:
  correct:
    en: Azure SQL Database is available as a single database, which has its own resources, or as an elastic pool, in which several databases share a pool of resources. In both cases the databases are attached to a logical server.
    fr: Azure SQL Database est disponible sous forme de base de données unique, qui possède ses propres ressources, ou de pool élastique, dans lequel plusieurs bases de données partagent un pool de ressources. Dans les deux cas, les bases de données sont rattachées à un serveur logique.
  options:
    b:
      en: 'An instance pool belongs to Azure SQL Managed Instance: it shares resources among instances.'
      fr: 'Un pool d''instances relève d''Azure SQL Managed Instance : il partage des ressources entre des instances.'
    c:
      en: Flexible Server is the deployment option of Azure Database for MySQL and Azure Database for PostgreSQL.
      fr: Serveur flexible (Flexible Server) est l'option de déploiement d'Azure Database pour MySQL et d'Azure Database pour PostgreSQL.
    e:
      en: A virtual machine hosts SQL Server on Azure Virtual Machines, the IaaS member of the family.
      fr: Une machine virtuelle héberge SQL Server sur Machines Virtuelles Azure, le membre IaaS de la famille.
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
