id: dp900-2b-oss-yn-postgresql
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Database for PostgreSQL, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Database pour PostgreSQL, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can use the pgAdmin tool to connect to the databases and manage them.
        fr: Vous pouvez utiliser l'outil pgAdmin pour vous connecter aux bases de données et les gérer.
    - id: s2
      text:
        en: Your administrators must schedule the backups of the server themselves.
        fr: Vos administrateurs doivent planifier eux-mêmes les sauvegardes du serveur.
    - id: s3
      text:
        en: Azure Database for PostgreSQL is built on the SQL Server database engine.
        fr: Azure Database pour PostgreSQL repose sur le moteur de base de données SQL Server.
answer:
  values: {s1: true, s2: false, s3: false}
explanation:
  correct:
    en: Azure Database for PostgreSQL runs the PostgreSQL engine itself, so tools written for PostgreSQL, such as pgAdmin, work with it; SQL Server is the engine of the Azure SQL family. Microsoft manages the server, and the backups are taken automatically.
    fr: 'Azure Database pour PostgreSQL exécute le moteur PostgreSQL lui-même : les outils écrits pour PostgreSQL, comme pgAdmin, fonctionnent donc avec ce service ; SQL Server est le moteur de la famille Azure SQL. Microsoft gère le serveur, et les sauvegardes sont effectuées automatiquement.'
references:
  - title: Describe Azure services for open-source databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/3-azure-database-open-source
  - title: What is Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/overview
