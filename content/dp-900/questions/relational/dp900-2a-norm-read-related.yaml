id: dp900-2a-norm-read-related
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a normalized database, the address of each customer is stored only in the **Customer** table, and each row of the **SalesOrder** table contains the ID of a customer.

    You need a query that returns each order number together with the address of the customer. What must the query do?
  fr: |
    Dans une base de données normalisée, l'adresse de chaque client est stockée uniquement dans la table **Customer**, et chaque ligne de la table **SalesOrder** contient l'ID d'un client.

    Vous avez besoin d'une requête qui retourne chaque numéro de commande avec l'adresse du client. Que doit faire la requête ?
body:
  options:
    - { id: a, text: { en: "Join the SalesOrder table and the Customer table on the customer ID.", fr: "Joindre la table SalesOrder et la table Customer sur l'ID du client." } }
    - { id: b, text: { en: "Read the SalesOrder table only, because it contains a copy of each address.", fr: "Lire uniquement la table SalesOrder, car elle contient une copie de chaque adresse." } }
    - { id: c, text: { en: "Update the SalesOrder table with the addresses before reading it.", fr: "Mettre à jour la table SalesOrder avec les adresses avant de la lire." } }
    - { id: d, text: { en: "Sort the Customer table by address before reading the SalesOrder table.", fr: "Trier la table Customer par adresse avant de lire la table SalesOrder." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Because normalization stores the address once, in the Customer table, the query must look it up for each order by matching the foreign key of SalesOrder with the primary key of Customer. Combining the rows of two tables in this way is a join.
    fr: |
      Comme la normalisation stocke l'adresse une seule fois, dans la table Customer, la requête doit la retrouver pour chaque commande en faisant correspondre la clé étrangère de SalesOrder avec la clé primaire de Customer. Combiner ainsi les lignes de deux tables est une jointure.
  options:
    b: { en: "SalesOrder contains only the ID of the customer; the address isn't copied into it.", fr: "SalesOrder contient uniquement l'ID du client ; l'adresse n'y est pas copiée." }
    c: { en: "Copying the addresses into SalesOrder would duplicate data and undo the normalization.", fr: "Copier les adresses dans SalesOrder dupliquerait les données et annulerait la normalisation." }
    d: { en: "Sorting changes the order of rows; it doesn't associate an order with its customer.", fr: "Le tri change l'ordre des lignes ; il n'associe pas une commande à son client." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
