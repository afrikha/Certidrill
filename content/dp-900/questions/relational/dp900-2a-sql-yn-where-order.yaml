id: dp900-2a-sql-yn-where-order
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Without an ORDER BY clause, a query is guaranteed to return rows in the order in which they were inserted.", fr: "Sans clause ORDER BY, une requête retourne de façon garantie les lignes dans l'ordre où elles ont été insérées." } }
    - { id: s2, text: { en: "The WHERE clause of an UPDATE statement determines which rows are modified.", fr: "La clause WHERE d'une instruction UPDATE détermine quelles lignes sont modifiées." } }
    - { id: s3, text: { en: "The WHERE clause is available in SELECT statements only.", fr: "La clause WHERE est disponible uniquement dans les instructions SELECT." } }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Without an ORDER BY clause, the rows of a result don't come back in any guaranteed sequence. In an UPDATE statement, the WHERE clause selects the rows to modify; without it, every row is modified. WHERE isn't reserved for queries: SELECT, UPDATE and DELETE all accept it.
    fr: |
      Sans clause ORDER BY, les lignes d'un résultat ne reviennent dans aucun ordre garanti. Dans une instruction UPDATE, la clause WHERE sélectionne les lignes à modifier ; sans elle, toutes les lignes sont modifiées. WHERE n'est pas réservée aux requêtes : SELECT, UPDATE et DELETE l'acceptent toutes.
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
