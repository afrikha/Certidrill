id: dp900-2a-norm-yn-spreadsheet
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A spreadsheet has the columns OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice and Qty, with one line per product sold. You normalize the data into the tables **Customer**, **Product**, **SalesOrder** and **LineItem**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une feuille de calcul comporte les colonnes OrderNo, CustomerName, CustomerAddress, ProductName, UnitPrice et Qty, avec une ligne par produit vendu. Vous normalisez les données dans les tables **Customer**, **Product**, **SalesOrder** et **LineItem**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The quantity sold on each line (Qty) is stored in the Product table.", fr: "La quantité vendue sur chaque ligne (Qty) est stockée dans la table Product." } }
    - { id: s2, text: { en: "The unit price of a product is stored once, in a row of the Product table.", fr: "Le prix unitaire d'un produit est stocké une seule fois, dans une ligne de la table Product." } }
    - { id: s3, text: { en: "Each row of the LineItem table refers to one order and to one product.", fr: "Chaque ligne de la table LineItem fait référence à une commande et à un produit." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The unit price is an attribute of the product, so it is stored once in the row of that product. The quantity depends on one product within one order: it is an attribute of the line item, not of the product. Each LineItem row therefore refers to its order and to its product through foreign keys.
    fr: |
      Le prix unitaire est un attribut du produit : il est donc stocké une seule fois, dans la ligne de ce produit. La quantité dépend d'un produit au sein d'une commande : c'est un attribut de la ligne d'article (LineItem), pas du produit. Chaque ligne de LineItem fait donc référence à sa commande et à son produit par des clés étrangères.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
