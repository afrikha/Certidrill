  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Normalization is a schema design process that minimizes data [[less]] and enforces data [[more]].
    fr: |
      La normalisation est un processus de conception de schéma qui réduit au minimum [[less]] des données et applique [[more]] des données.
  slots:
    - id: less
      options:
        - { id: retention, text: { en: "retention", fr: "la rétention" } }
        - { id: duplication, text: { en: "duplication", fr: "la duplication" } }
        - { id: encryption, text: { en: "encryption", fr: "le chiffrement" } }
    - id: more
      options:
        - { id: integrity, text: { en: "integrity", fr: "l'intégrité" } }
        - { id: redundancy, text: { en: "redundancy", fr: "la redondance" } }
        - { id: availability, text: { en: "availability", fr: "la disponibilité" } }
answer:
  values: { less: duplication, more: integrity }
explanation:
  correct:
    en: |
      Normalization is the schema design process that minimizes data duplication and enforces data integrity. Each fact is stored once, and keys guarantee that the tables refer to one another consistently.
    fr: |
      La normalisation est le processus de conception de schéma qui réduit au minimum la duplication des données et applique l'intégrité des données. Chaque fait est stocké une seule fois, et les clés garantissent que les tables se référencent de façon cohérente.
  options:
    redundancy: { en: "Redundancy is duplicated data, which normalization reduces instead of enforcing.", fr: "La redondance est de la donnée dupliquée, que la normalisation réduit au lieu de l'appliquer." }
    availability: { en: "Availability depends on how the database is hosted, not on the design of its tables.", fr: "La disponibilité dépend de l'hébergement de la base de données, pas de la conception de ses tables." }
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
