id: dp900-2a-rel-null-middle-name
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A table named **Customer** in a relational database contains a column named **MiddleName**, which isn't a mandatory column. Some customers have no middle name.

    How does the table represent these customers?
  fr: |
    Une table nommée **Customer** d'une base de données relationnelle contient une colonne nommée **MiddleName**, qui n'est pas une colonne obligatoire. Certains clients n'ont pas de deuxième prénom.

    Comment la table représente-t-elle ces clients ?
body:
  options:
    - { id: a, text: { en: "Their rows are stored without the MiddleName column.", fr: "Leurs lignes sont stockées sans la colonne MiddleName." } }
    - { id: b, text: { en: "Their rows contain NULL in the MiddleName column.", fr: "Leurs lignes contiennent NULL dans la colonne MiddleName." } }
    - { id: c, text: { en: "Their rows are moved to a separate table that has no MiddleName column.", fr: "Leurs lignes sont déplacées vers une table distincte qui n'a pas de colonne MiddleName." } }
    - { id: d, text: { en: "Their rows are rejected because every column requires a value.", fr: "Leurs lignes sont rejetées, car chaque colonne exige une valeur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Every row of a relational table has the same columns, but a column that isn't mandatory can be left empty. The empty value is called NULL, and it means that the value is absent or unknown.
    fr: |
      Toutes les lignes d'une table relationnelle ont les mêmes colonnes, mais une colonne qui n'est pas obligatoire peut rester vide. La valeur vide s'appelle NULL et signifie que la valeur est absente ou inconnue.
  options:
    a: { en: "All the rows of a table have the same columns; a row can't drop a column.", fr: "Toutes les lignes d'une table ont les mêmes colonnes ; une ligne ne peut pas se passer d'une colonne." }
    c: { en: "All customers stay in the Customer table; a missing value doesn't require another table.", fr: "Tous les clients restent dans la table Customer ; une valeur manquante n'exige pas une autre table." }
    d: { en: "Only mandatory columns require a value, and MiddleName isn't mandatory.", fr: "Seules les colonnes obligatoires exigent une valeur, et MiddleName n'est pas obligatoire." }
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
