id: dp900-2a-rel-insert-outcome
objective: "2.1.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You create a table by running the following statement.

    ```text
    CREATE TABLE Product
    (
        ID INT PRIMARY KEY,
        Name VARCHAR(20) NOT NULL,
        Price DECIMAL(10,2) NULL
    );
    ```

    The table contains one row, in which ID is 99.

    Which new row can you add to the table?
  fr: |
    Vous créez une table en exécutant l'instruction suivante.

    ```text
    CREATE TABLE Product
    (
        ID INT PRIMARY KEY,
        Name VARCHAR(20) NOT NULL,
        Price DECIMAL(10,2) NULL
    );
    ```

    La table contient une seule ligne, dans laquelle ID vaut 99.

    Quelle nouvelle ligne pouvez-vous ajouter à la table ?
body:
  options:
    - { id: a, text: "ID = 99, Name = 'Saw', Price = 12.50" }
    - { id: b, text: "ID = 100, Name = NULL, Price = 12.50" }
    - { id: c, text: "ID = 101, Name = 'Saw', Price = NULL" }
    - { id: d, text: "ID = NULL, Name = 'Saw', Price = 12.50" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The primary key ID must have a value that no other row uses, and Name is declared NOT NULL, so it is mandatory. Price is declared NULL, so a row can be stored without a price. Only the row with ID 101, a name and no price respects the three rules.
    fr: |
      La clé primaire ID doit avoir une valeur qu'aucune autre ligne n'utilise, et Name est déclaré NOT NULL : il est donc obligatoire. Price est déclaré NULL : une ligne peut donc être stockée sans prix. Seule la ligne avec l'ID 101, un nom et pas de prix respecte les trois règles.
  options:
    a: { en: "The value 99 is already used by the existing row, and a primary key value can't be repeated.", fr: "La valeur 99 est déjà utilisée par la ligne existante, et une valeur de clé primaire ne peut pas être répétée." }
    b: { en: "Name is declared NOT NULL, so a row without a name is refused.", fr: "Name est déclaré NOT NULL : une ligne sans nom est donc refusée." }
    d: { en: "A primary key column never accepts NULL, because every row must be identified.", fr: "Une colonne de clé primaire n'accepte jamais NULL, car chaque ligne doit être identifiée." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "Primary and foreign key constraints"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
