id: dp900-2a-sql-select-clauses
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have the following query.

    ```text
    SELECT FirstName, LastName
    FROM Customer;
    ```

    You need to return only the customers who live in Seattle, sorted by last name.

    Which two clauses should you add to the query? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de la requête suivante.

    ```text
    SELECT FirstName, LastName
    FROM Customer;
    ```

    Vous devez retourner uniquement les clients qui habitent à Seattle, triés par nom de famille.

    Quelles sont les deux clauses que vous devez ajouter à la requête ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "JOIN" }
    - { id: b, text: "ORDER BY" }
    - { id: c, text: "SET" }
    - { id: d, text: "VALUES" }
    - { id: e, text: "WHERE" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A WHERE clause specifies the criteria that rows must meet, here `City = 'Seattle'`. An ORDER BY clause sorts the result by a column, here LastName; without it, the order of the rows isn't guaranteed.
    fr: |
      Une clause WHERE spécifie les critères que les lignes doivent respecter, ici `City = 'Seattle'`. Une clause ORDER BY trie le résultat selon une colonne, ici LastName ; sans elle, l'ordre des lignes n'est pas garanti.
  options:
    a: { en: "JOIN combines the rows of two tables; this query reads the Customer table only.", fr: "JOIN combine les lignes de deux tables ; cette requête lit uniquement la table Customer." }
    c: { en: "SET assigns new values in an UPDATE statement.", fr: "SET attribue de nouvelles valeurs dans une instruction UPDATE." }
    d: { en: "VALUES lists the values of a new row in an INSERT statement.", fr: "VALUES liste les valeurs d'une nouvelle ligne dans une instruction INSERT." }
references:
  - title: "Explore SQL"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: "SELECT (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
