id: dp900-2a-norm-yn-design-review
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You review the design of a database that contains the following tables.

    | Table | Columns |
    | --- | --- |
    | Customer | CustomerID (primary key), Name, City |
    | SalesOrder | OrderNo (primary key), OrderDate, CustomerID (foreign key to Customer), CustomerCity |

    The CustomerCity column contains the city of the customer who placed the order.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la conception d'une base de données qui contient les tables suivantes.

    | Table | Colonnes |
    | --- | --- |
    | Customer | CustomerID (clé primaire), Name, City |
    | SalesOrder | OrderNo (clé primaire), OrderDate, CustomerID (clé étrangère vers Customer), CustomerCity |

    La colonne CustomerCity contient la ville du client qui a passé la commande.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The CustomerCity column duplicates data that the Customer table already stores.", fr: "La colonne CustomerCity duplique des données que la table Customer stocke déjà." } }
    - { id: s2, text: { en: "Removing the CustomerCity column loses the information about the city of each customer.", fr: "La suppression de la colonne CustomerCity fait perdre l'information sur la ville de chaque client." } }
    - { id: s3, text: { en: "Adding the name of the customer to the SalesOrder table brings the design closer to a normalized schema.", fr: "L'ajout du nom du client à la table SalesOrder rapproche la conception d'un schéma normalisé." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The city of each customer is already in the City column of the Customer table, so CustomerCity repeats it in every order: this is duplicated data. Removing CustomerCity loses nothing, because the foreign key CustomerID leads to the customer row and its city. Adding the name of the customer to SalesOrder would add duplication, which is the opposite of normalization.
    fr: |
      La ville de chaque client se trouve déjà dans la colonne City de la table Customer : CustomerCity la répète donc dans chaque commande, ce qui est de la duplication de données. Supprimer CustomerCity ne fait rien perdre, car la clé étrangère CustomerID mène à la ligne du client et à sa ville. Ajouter le nom du client à SalesOrder ajouterait de la duplication, soit l'inverse de la normalisation.
references:
  - title: "Understand normalization"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/3-normalization
