id: dp900-2b-sql-which-iaas
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which service of the Azure SQL family is an infrastructure as a service (IaaS) offering?
  fr: |
    Quel service de la famille Azure SQL est une offre d'infrastructure en tant que service (IaaS) ?
body:
  options:
    - id: a
      text: Azure SQL Database
    - id: b
      text:
        en: An Azure SQL Database elastic pool
        fr: Un pool élastique Azure SQL Database
    - id: c
      text: Azure SQL Managed Instance
    - id: d
      text:
        en: SQL Server on Azure Virtual Machines
        fr: SQL Server sur Machines Virtuelles Azure
answer: {optionId: d}
explanation:
  correct:
    en: 'SQL Server on Azure Virtual Machines is SQL Server installed in a virtual machine: an IaaS offering in which you manage the operating system and the database software. Azure SQL Database, including its elastic pools, and Azure SQL Managed Instance are PaaS offerings.'
    fr: 'SQL Server sur Machines Virtuelles Azure est SQL Server installé dans une machine virtuelle : une offre IaaS dans laquelle vous gérez le système d''exploitation et le logiciel de base de données. Azure SQL Database, y compris ses pools élastiques, et Azure SQL Managed Instance sont des offres PaaS.'
  options:
    a:
      en: Azure SQL Database is a fully managed PaaS database service.
      fr: Azure SQL Database est un service de base de données PaaS entièrement managé.
    b:
      en: An elastic pool is a deployment option of Azure SQL Database, which is PaaS.
      fr: Un pool élastique est une option de déploiement d'Azure SQL Database, qui est un service PaaS.
    c:
      en: 'Azure SQL Managed Instance provides a SQL Server instance, but as PaaS: you have no access to the operating system.'
      fr: 'Azure SQL Managed Instance fournit une instance SQL Server, mais en PaaS : vous n''avez pas accès au système d''exploitation.'
references:
  - title: Describe Azure SQL services and capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/2-azure-sql
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
