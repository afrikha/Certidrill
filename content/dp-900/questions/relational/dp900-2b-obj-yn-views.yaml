id: dp900-2b-obj-yn-views
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about views, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les vues, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A view can return columns that come from more than one table.
        fr: Une vue peut renvoyer des colonnes qui proviennent de plusieurs tables.
    - id: s2
      text:
        en: You read the rows of a view by using a `SELECT` statement, as you do for a table.
        fr: Vous lisez les lignes d'une vue avec une instruction `SELECT`, comme pour une table.
    - id: s3
      text:
        en: A view must contain every column of the table on which it's based.
        fr: Une vue doit contenir toutes les colonnes de la table sur laquelle elle est basée.
answer:
  values: {s1: true, s2: true, s3: false}
explanation:
  correct:
    en: A view is defined by a SELECT query. That query can join several tables and return only some of their columns and rows. Once the view is created, you query it with SELECT exactly like a table.
    fr: Une vue est définie par une requête SELECT. Cette requête peut joindre plusieurs tables et ne renvoyer que certaines de leurs colonnes et de leurs lignes. Une fois la vue créée, vous l'interrogez avec SELECT exactement comme une table.
references:
  - title: Describe database objects
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/5-database-objects
  - title: Views
    url: https://learn.microsoft.com/en-us/sql/relational-databases/views/views
