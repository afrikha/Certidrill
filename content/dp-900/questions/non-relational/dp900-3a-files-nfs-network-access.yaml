id: dp900-3a-files-nfs-network-access
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam creates an NFS file share in Azure Files, in the SSD tier, for the Linux servers of a finance application.

    How must Fabrikam control access to the share?
  fr: |
    Fabrikam crée un partage de fichiers NFS dans Azure Files, dans le niveau SSD, pour les serveurs Linux d'une application financière.

    Comment Fabrikam doit-elle contrôler l'accès au partage ?
body:
  options:
    - id: a
      text: { en: "Through the hierarchical namespace of the storage account", fr: "Par l'espace de noms hiérarchique du compte de stockage" }
    - id: b
      text: { en: "Through a private endpoint or a service endpoint in a virtual network", fr: "Par un point de terminaison privé ou un point de terminaison de service dans un réseau virtuel" }
    - id: c
      text: { en: "Through a lifecycle management policy of the storage account", fr: "Par une stratégie de gestion du cycle de vie du compte de stockage" }
    - id: d
      text: { en: "Through anonymous access that is enabled on the storage account", fr: "Par un accès anonyme activé sur le compte de stockage" }
answer: { optionId: b }
explanation:
  correct:
    en: An NFS share in Azure Files has two requirements. It must be created in the SSD tier, and access to it is controlled at the network level, through a private endpoint or a service endpoint in a virtual network.
    fr: "Un partage NFS dans Azure Files a deux exigences. Il doit être créé dans le niveau SSD, et son accès se contrôle au niveau du réseau, par un point de terminaison privé ou un point de terminaison de service dans un réseau virtuel."
  options:
    a:
      en: The hierarchical namespace belongs to Blob Storage (Azure Data Lake Storage Gen2); it doesn't apply to file shares.
      fr: L'espace de noms hiérarchique appartient au Stockage Blob (Azure Data Lake Storage Gen2) ; il ne s'applique pas aux partages de fichiers.
    c:
      en: Lifecycle management policies move or delete blobs; they don't control who reaches a file share.
      fr: Les stratégies de gestion du cycle de vie déplacent ou suppriment des objets blob ; elles ne contrôlent pas qui atteint un partage de fichiers.
    d:
      en: Anonymous access concerns blobs in containers, and it would not restrict access to the data of a finance application.
      fr: L'accès anonyme concerne les objets blob des conteneurs, et il ne restreindrait pas l'accès aux données d'une application financière.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
