id: dp900-3b-yn-api-cassandra
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Cosmos DB for Apache Cassandra, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Cosmos DB for Apache Cassandra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You deploy and patch the Cassandra nodes that host the data yourself.
        fr: Vous déployez et corrigez vous-même les nœuds Cassandra qui hébergent les données.
    - id: s2
      text:
        en: The rows of the same table can contain different columns.
        fr: Les lignes d'une même table peuvent contenir des colonnes différentes.
    - id: s3
      text:
        en: The data is queried with CQL, a language whose syntax is similar to SQL.
        fr: Les données s'interrogent avec CQL, un langage dont la syntaxe est proche de celle de SQL.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Azure Cosmos DB for Apache Cassandra is a fully managed service; Azure handles the infrastructure, patching, scaling and backups, and there are no Cassandra nodes to administer. It uses a column-family model in which the rows of a table do not need the same columns. Queries use the Cassandra Query Language (CQL), whose statements look like SQL.
    fr: Azure Cosmos DB for Apache Cassandra est un service entièrement managé ; Azure gère l'infrastructure, les correctifs, la mise à l'échelle et les sauvegardes, et il n'y a aucun nœud Cassandra à administrer. Il utilise un modèle de famille de colonnes dans lequel les lignes d'une table n'ont pas besoin des mêmes colonnes. Les requêtes utilisent le langage de requête Cassandra (CQL), dont les instructions ressemblent à celles de SQL.
references:
  - title: "What is Azure Cosmos DB for Apache Cassandra?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/cassandra/introduction
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
