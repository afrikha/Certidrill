id: dp900-3b-schema-agnostic
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores its product catalog in one Azure Cosmos DB container. Bikes, helmets and clothes have different attributes, and new attributes appear every month.

    Which characteristic of Azure Cosmos DB allows these items to be stored in the same container?
  fr: |
    Contoso stocke son catalogue de produits dans un seul conteneur Azure Cosmos DB. Les vélos, les casques et les vêtements ont des attributs différents, et de nouveaux attributs apparaissent chaque mois.

    Quelle caractéristique d'Azure Cosmos DB permet de stocker ces éléments dans le même conteneur ?
body:
  options:
    - id: a
      text: { en: "Schema-agnostic storage", fr: "Le stockage indépendant du schéma" }
    - id: b
      text: { en: "Multi-region writes", fr: "Les écritures multirégions" }
    - id: c
      text: { en: "Autoscale throughput", fr: "Le débit avec mise à l'échelle automatique (autoscale)" }
    - id: d
      text: { en: "Strong consistency", fr: "La cohérence forte (Strong)" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Cosmos DB is schema-agnostic. Two items of the same container do not need the same properties, so each product can carry its own attributes and new ones can be added without changing a schema.
    fr: Azure Cosmos DB est indépendant du schéma. Deux éléments d'un même conteneur n'ont pas besoin des mêmes propriétés ; chaque produit peut donc porter ses propres attributs et de nouveaux attributs peuvent être ajoutés sans modifier de schéma.
  options:
    b:
      en: Multi-region writes let applications write in several Azure regions; they say nothing about the structure of the items.
      fr: Les écritures multirégions permettent aux applications d'écrire dans plusieurs régions Azure ; elles ne concernent pas la structure des éléments.
    c:
      en: Autoscale adjusts the throughput to the demand; it does not affect the properties an item can have.
      fr: La mise à l'échelle automatique ajuste le débit à la demande ; elle n'a pas d'effet sur les propriétés qu'un élément peut avoir.
    d:
      en: Strong consistency guarantees that every read returns the most recent write; it is unrelated to the shape of the data.
      fr: La cohérence forte garantit que chaque lecture renvoie l'écriture la plus récente ; elle est sans rapport avec la forme des données.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Databases, containers, and items in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model
