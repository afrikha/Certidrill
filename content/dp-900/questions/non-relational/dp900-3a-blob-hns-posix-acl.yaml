id: dp900-3a-blob-hns-posix-acl
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores analytics data as blobs in an Azure Storage account. The data engineers need real directories, and they must set read, write and execute permissions on individual folders and files by using POSIX-compliant access control lists (ACLs).

    What should Adatum enable on the storage account?
  fr: |
    Adatum stocke des données d'analytique sous forme d'objets blob dans un compte de Stockage Azure. Les ingénieurs de données ont besoin de vrais répertoires, et ils doivent définir des autorisations de lecture, d'écriture et d'exécution sur des dossiers et des fichiers individuels au moyen de listes de contrôle d'accès (ACL) conformes à POSIX.

    Que doit activer Adatum sur le compte de stockage ?
body:
  options:
    - { id: a, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
    - { id: b, text: { en: "Geo-redundant storage (GRS)", fr: "Le stockage géoredondant (GRS)" } }
    - { id: c, text: { en: "The hierarchical namespace", fr: "L'espace de noms hiérarchique" } }
    - { id: d, text: { en: "The cold access tier", fr: "Le niveau d'accès froid (Cold)" } }
answer: { optionId: c }
explanation:
  correct:
    en: Enabling the hierarchical namespace turns Blob Storage into Azure Data Lake Storage Gen2. Blobs are then organized in real directories, and POSIX-compliant ACLs can set permissions on individual files and folders.
    fr: Activer l'espace de noms hiérarchique transforme le Stockage Blob en Azure Data Lake Storage Gen2. Les objets blob sont alors organisés dans de vrais répertoires, et des ACL conformes à POSIX peuvent définir des autorisations sur des fichiers et des dossiers individuels.
  options:
    a:
      en: A lifecycle management policy moves or deletes blobs as they age; it doesn't create directories or permissions.
      fr: Une stratégie de gestion du cycle de vie déplace ou supprime les objets blob à mesure qu'ils vieillissent ; elle ne crée ni répertoires ni autorisations.
    b:
      en: GRS replicates the data to a secondary region; it has no effect on how blobs are organized or secured.
      fr: Le stockage géoredondant (GRS) réplique les données vers une région secondaire ; il n'a aucun effet sur l'organisation ni sur la sécurisation des objets blob.
    d:
      en: An access tier changes the storage and access costs of blobs, not the folder structure or the permissions.
      fr: Un niveau d'accès modifie les coûts de stockage et d'accès des objets blob, pas la structure des dossiers ni les autorisations.
references:
  - title: Explore Azure Data Lake Storage Gen2
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/3-azure-data-lake-gen2
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
