id: dp900-3b-mongodb-format
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Cosmos DB for MongoDB stores documents in [[fmt]] format. Developers query the data with [[lang]].
    fr: |
      Azure Cosmos DB for MongoDB stocke les documents au format [[fmt]]. Les développeurs interrogent les données avec [[lang]].
  slots:
    - id: fmt
      options:
        - { id: parquet, text: Parquet }
        - { id: bson, text: BSON }
        - { id: csv, text: CSV }
    - id: lang
      options:
        - { id: cql, text: CQL }
        - { id: gremlin, text: Gremlin }
        - { id: mql, text: MQL }
answer:
  values: { fmt: bson, lang: mql }
explanation:
  correct:
    en: Azure Cosmos DB for MongoDB stores data as documents in BSON, a binary form of JSON, and is queried with the MongoDB Query Language (MQL). This lets teams reuse their MongoDB drivers and skills.
    fr: Azure Cosmos DB for MongoDB stocke les données sous forme de documents au format BSON, une forme binaire de JSON, et s'interroge avec le langage de requête MongoDB (MQL). Les équipes réutilisent ainsi leurs pilotes et leurs compétences MongoDB.
  options:
    parquet:
      en: Parquet is a columnar file format used for analytical data, not the storage format of a document API.
      fr: Parquet est un format de fichier en colonnes utilisé pour les données analytiques, pas le format de stockage d'une API de documents.
    csv:
      en: CSV is a delimited text file format; it cannot represent nested documents.
      fr: CSV est un format de fichier texte délimité ; il ne peut pas représenter des documents imbriqués.
    cql:
      en: CQL is the query language of Azure Cosmos DB for Apache Cassandra.
      fr: CQL est le langage de requête d'Azure Cosmos DB for Apache Cassandra.
    gremlin:
      en: Gremlin is the graph traversal language of Azure Cosmos DB for Apache Gremlin.
      fr: Gremlin est le langage de parcours de graphe d'Azure Cosmos DB for Apache Gremlin.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
