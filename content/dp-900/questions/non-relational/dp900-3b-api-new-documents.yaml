id: dp900-3b-api-new-documents
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing a new order-management application on Azure Cosmos DB. There is no existing code to reuse. Orders must be stored as JSON documents, and the developers, who have no MongoDB experience, want to query them with a SQL-like syntax.

    Which Azure Cosmos DB API should you use?
  fr: |
    Litware conçoit une nouvelle application de gestion des commandes sur Azure Cosmos DB. Il n'y a aucun code existant à réutiliser. Les commandes doivent être stockées sous forme de documents JSON, et les développeurs, qui n'ont aucune expérience de MongoDB, veulent les interroger avec une syntaxe proche de SQL.

    Quelle API Azure Cosmos DB devez-vous utiliser ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for NoSQL
    - id: b
      text: Azure Cosmos DB for MongoDB
    - id: c
      text: Azure Cosmos DB for Apache Cassandra
    - id: d
      text: Azure Cosmos DB for Table
answer: { optionId: a }
explanation:
  correct:
    en: Azure Cosmos DB for NoSQL is the native API of the service. It stores data as JSON documents and queries them with a SQL-like syntax, which makes it the usual choice for a new application with no existing code to keep.
    fr: Azure Cosmos DB for NoSQL est l'API native du service. Elle stocke les données sous forme de documents JSON et les interroge avec une syntaxe proche de SQL, ce qui en fait le choix habituel pour une nouvelle application sans code existant à conserver.
  options:
    b:
      en: Azure Cosmos DB for MongoDB also stores documents, but in BSON format and with the MongoDB query language; it suits teams that already use MongoDB drivers.
      fr: Azure Cosmos DB for MongoDB stocke aussi des documents, mais au format BSON et avec le langage de requête MongoDB ; il convient aux équipes qui utilisent déjà les pilotes MongoDB.
    c:
      en: CQL resembles SQL, but Azure Cosmos DB for Apache Cassandra stores column-family tables, not JSON documents.
      fr: Le langage CQL ressemble à SQL, mais Azure Cosmos DB for Apache Cassandra stocke des tables de famille de colonnes, pas des documents JSON.
    d:
      en: Azure Cosmos DB for Table stores key-value pairs found by a partition key and a row key, without a SQL-like query language.
      fr: Azure Cosmos DB for Table stocke des paires clé-valeur retrouvées par une clé de partition et une clé de ligne, sans langage de requête proche de SQL.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
