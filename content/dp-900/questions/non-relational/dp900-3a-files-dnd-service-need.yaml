id: dp900-3a-files-dnd-service-need
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the Azure service that meets it.

    To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence au service Azure qui y répond.

    Pour répondre, faites glisser le service approprié vers chaque exigence. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: blob, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: files, text: "Azure Files" }
    - { id: table, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: sql, text: "Azure SQL Database" }
  targets:
    - id: t1
      text: { en: "An application that runs on several virtual machines reads its shared settings from a drive mounted over SMB.", fr: "Une application exécutée sur plusieurs machines virtuelles lit ses paramètres partagés sur un lecteur monté en SMB." }
    - id: t2
      text: { en: "A website streams video files that are stored as objects and reached by a URL.", fr: "Un site web diffuse en streaming des fichiers vidéo stockés comme objets et accessibles par une URL." }
    - id: t3
      text: { en: "Device information is stored as key/value items and retrieved by a partition key and a row key.", fr: "Des informations sur des appareils sont stockées comme éléments clé/valeur et récupérées par une clé de partition et une clé de ligne." }
answer:
  mapping: { t1: files, t2: blob, t3: table }
explanation:
  correct:
    en: Azure Files provides SMB shares that several virtual machines mount at the same time, which suits applications that expect shared file storage. Blob Storage stores unstructured objects such as videos and serves them over HTTPS. Table storage is the key/value store whose rows are identified by a partition key and a row key.
    fr: Azure Files fournit des partages SMB que plusieurs machines virtuelles montent en même temps, ce qui convient aux applications qui attendent un stockage de fichiers partagé. Le Stockage Blob stocke des objets non structurés comme des vidéos et les diffuse en HTTPS. Le Stockage Table est le magasin clé/valeur dont les lignes sont identifiées par une clé de partition et une clé de ligne.
  options:
    sql:
      en: Azure SQL Database is a relational database for structured data in related tables; none of the three requirements calls for it.
      fr: Azure SQL Database est une base de données relationnelle pour des données structurées dans des tables liées ; aucune des trois exigences ne la demande.
references:
  - title: Introduction to Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
