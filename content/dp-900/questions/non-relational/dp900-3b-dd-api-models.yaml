id: dp900-3b-dd-api-models
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each data model to the Azure Cosmos DB API that uses it.

    To answer, drag the appropriate API to each data model. Each API may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque modèle de données à l'API Azure Cosmos DB qui l'utilise.

    Pour répondre, faites glisser l'API appropriée vers chaque modèle de données. Chaque API peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: nosql, text: Azure Cosmos DB for NoSQL }
    - { id: mongo, text: Azure Cosmos DB for MongoDB }
    - { id: table, text: Azure Cosmos DB for Table }
    - { id: cass, text: Azure Cosmos DB for Apache Cassandra }
    - { id: grem, text: Azure Cosmos DB for Apache Gremlin }
  targets:
    - id: colfam
      text: { en: "Column-family", fr: "Famille de colonnes" }
    - id: graph
      text: { en: "Graph", fr: "Graphe" }
    - id: keyval
      text: { en: "Key-value pairs", fr: "Paires clé-valeur" }
answer:
  mapping: { colfam: cass, graph: grem, keyval: table }
explanation:
  correct:
    en: Azure Cosmos DB for Apache Cassandra uses a column-family model, Azure Cosmos DB for Apache Gremlin a graph of vertices and edges, and Azure Cosmos DB for Table key-value pairs stored in tables. The two remaining APIs, NoSQL and MongoDB, both use a document model.
    fr: Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes, Azure Cosmos DB for Apache Gremlin un graphe de sommets et d'arêtes, et Azure Cosmos DB for Table des paires clé-valeur stockées dans des tables. Les deux API restantes, NoSQL et MongoDB, utilisent toutes deux un modèle de documents.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
