id: dp900-3b-api-table-global
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an application that stores key-value data in Azure Table storage, in a storage account in West Europe. Users in Asia and America complain about slow responses.

    Fabrikam needs to replicate the data to Azure regions on three continents and to index all the properties automatically. Changes to the application code must be minimized.

    What should you recommend?
  fr: |
    Fabrikam possède une application qui stocke des données clé-valeur dans le Stockage Table Azure, dans un compte de stockage de la région West Europe. Des utilisateurs d'Asie et d'Amérique se plaignent de la lenteur des réponses.

    Fabrikam doit répliquer les données dans des régions Azure de trois continents et indexer automatiquement toutes les propriétés. Les modifications du code de l'application doivent être réduites au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Migrate the data to Azure Cosmos DB for NoSQL", fr: "Migrer les données vers Azure Cosmos DB for NoSQL" }
    - id: b
      text: { en: "Migrate the data to Azure Cosmos DB for Table", fr: "Migrer les données vers Azure Cosmos DB for Table" }
    - id: c
      text: { en: "Change the redundancy of the storage account to RA-GRS", fr: "Remplacer la redondance du compte de stockage par RA-GRS" }
    - id: d
      text: { en: "Migrate the data to Azure Cosmos DB for Apache Cassandra", fr: "Migrer les données vers Azure Cosmos DB for Apache Cassandra" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Cosmos DB for Table is compatible with the Azure Table storage SDKs and tools, so the application moves with little or no code change. It adds what Azure Table storage lacks here, namely global distribution to the regions you choose and automatic indexing of all properties.
    fr: Azure Cosmos DB for Table est compatible avec les kits SDK et les outils du Stockage Table Azure ; l'application migre donc avec peu ou pas de modifications du code. Il apporte ce qui manque ici au Stockage Table Azure, à savoir la distribution mondiale dans les régions de votre choix et l'indexation automatique de toutes les propriétés.
  options:
    a:
      en: Azure Cosmos DB for NoSQL also offers global distribution and automatic indexing, but the application would have to be rewritten for JSON documents and another SDK.
      fr: Azure Cosmos DB for NoSQL offre aussi la distribution mondiale et l'indexation automatique, mais l'application devrait être réécrite pour des documents JSON et un autre kit SDK.
    c:
      en: RA-GRS adds one readable copy in the single paired region; it neither places data on three continents nor indexes all the properties.
      fr: RA-GRS ajoute une copie lisible dans la seule région jumelée ; il ne place pas les données sur trois continents et n'indexe pas toutes les propriétés.
    d:
      en: Azure Cosmos DB for Apache Cassandra uses a column-family model and CQL; the data access code would have to be rewritten.
      fr: Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes et le langage CQL ; le code d'accès aux données devrait être réécrit.
references:
  - title: "What is Azure Cosmos DB for Table?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/introduction
  - title: "What is Azure Table storage?"
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
