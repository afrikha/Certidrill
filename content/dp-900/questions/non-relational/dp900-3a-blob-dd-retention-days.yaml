id: dp900-3a-blob-dd-retention-days
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To avoid an early deletion charge, a blob should stay at least [[cold]] days in the cold tier and at least [[arch]] days in the archive tier.
    fr: |
      Pour éviter des frais de suppression anticipée, un objet blob doit rester au moins [[cold]] jours dans le niveau froid (Cold) et au moins [[arch]] jours dans le niveau archive (Archive).
  slots:
    - id: cold
      options:
        - { id: d30, text: "30" }
        - { id: d90, text: "90" }
        - { id: d180, text: "180" }
    - id: arch
      options:
        - { id: d30, text: "30" }
        - { id: d90, text: "90" }
        - { id: d180, text: "180" }
answer:
  values: { cold: d90, arch: d180 }
explanation:
  correct:
    en: Each tier other than hot has a minimum storage period. It is 30 days for cool, 90 days for cold and 180 days for archive. A blob that is deleted or moved to another tier before the end of the period incurs an early deletion charge.
    fr: "Chaque niveau autre que le niveau chaud (Hot) a une durée minimale de stockage. Elle est de 30 jours pour Cool, de 90 jours pour Cold et de 180 jours pour Archive. Un objet blob supprimé ou déplacé vers un autre niveau avant la fin de cette durée entraîne des frais de suppression anticipée."
  options:
    d30:
      en: 30 days is the minimum period of the cool tier.
      fr: 30 jours est la durée minimale du niveau froid (Cool).
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Access tiers for blob data
