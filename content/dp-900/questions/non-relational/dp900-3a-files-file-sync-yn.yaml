id: dp900-3a-files-file-sync-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Azure File Sync. The file servers of its three offices are registered and synchronize with the same Azure file share.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Azure File Sync. Les serveurs de fichiers de ses trois bureaux sont inscrits et se synchronisent avec le même partage de fichiers Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure File Sync agent is installed on servers that run Windows Server.
        fr: L'agent Azure File Sync s'installe sur des serveurs qui exécutent Windows Server.
    - id: s2
      text:
        en: A change that is made on the server of one office is synchronized to the servers of the other offices.
        fr: Une modification effectuée sur le serveur d'un bureau est synchronisée vers les serveurs des autres bureaux.
    - id: s3
      text:
        en: Once Azure File Sync is deployed, the Azure file share no longer contains the files.
        fr: Une fois Azure File Sync déployé, le partage de fichiers Azure ne contient plus les fichiers.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Azure File Sync centralizes file shares in Azure Files while Windows file servers keep local cached copies. The agent is installed on Windows servers, each registered server syncs with the central Azure file share, and a change on one server reaches the other servers through that share.
    fr: Azure File Sync centralise les partages de fichiers dans Azure Files tandis que des serveurs de fichiers Windows conservent des copies locales en cache. L'agent s'installe sur des serveurs Windows, chaque serveur inscrit se synchronise avec le partage de fichiers Azure central, et une modification sur un serveur atteint les autres serveurs par ce partage.
  options:
    s3:
      en: The Azure file share remains the central copy of the data; the servers hold cached copies of it.
      fr: Le partage de fichiers Azure reste la copie centrale des données ; les serveurs en détiennent des copies en cache.
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
