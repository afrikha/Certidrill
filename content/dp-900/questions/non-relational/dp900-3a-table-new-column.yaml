id: dp900-3a-table-new-column
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table in Azure Table storage contains one row per customer. A developer wants to record a loyalty level, but only in the rows of new customers.

    What must the developer do before inserting the rows of the new customers?
  fr: |
    Une table du Stockage Table Azure contient une ligne par client. Un développeur veut enregistrer un niveau de fidélité, mais seulement dans les lignes des nouveaux clients.

    Que doit faire le développeur avant d'insérer les lignes des nouveaux clients ?
body:
  options:
    - id: a
      text: { en: "Run an ALTER TABLE statement that adds the column to the table.", fr: "Exécuter une instruction ALTER TABLE qui ajoute la colonne à la table." }
    - id: b
      text: { en: "Add the column with an empty value to all the existing rows.", fr: "Ajouter la colonne avec une valeur vide à toutes les lignes existantes." }
    - id: c
      text: { en: "Create a second table and link it to the first with a foreign key.", fr: "Créer une seconde table et la lier à la première par une clé étrangère." }
    - id: d
      text: { en: "Nothing: the new rows can simply include the additional column.", fr: "Rien : les nouvelles lignes peuvent simplement inclure la colonne supplémentaire." }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Table storage stores semi-structured data. Apart from the key and the timestamp, the columns of each row can vary, so new rows can carry a column that the existing rows don't have, without any change to the table.
    fr: "Le Stockage Table Azure stocke des données semi-structurées. Hormis la clé et l'horodatage, les colonnes de chaque ligne peuvent varier : de nouvelles lignes peuvent donc porter une colonne absente des lignes existantes, sans aucune modification de la table."
  options:
    a:
      en: ALTER TABLE is a SQL statement for relational tables with a fixed schema; a table in Table storage has no schema to alter.
      fr: ALTER TABLE est une instruction SQL pour des tables relationnelles à schéma fixe ; une table du Stockage Table n'a pas de schéma à modifier.
    b:
      en: Rows don't need to have the same columns, so the existing rows can stay as they are.
      fr: Les lignes n'ont pas besoin d'avoir les mêmes colonnes, les lignes existantes peuvent donc rester telles quelles.
    c:
      en: Table storage has no foreign keys or relationships, and the data of an entity is usually kept in a single row.
      fr: Le Stockage Table n'a ni clés étrangères ni relations, et les données d'une entité sont généralement conservées dans une seule ligne.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
