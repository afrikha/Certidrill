id: dp900-3a-blob-store-media
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a web application that must store millions of product photos and videos. The application reads and writes each file through an API over HTTPS.

    Which Azure service should Litware use to store the files?
  fr: |
    Litware possède une application web qui doit stocker des millions de photos et de vidéos de produits. L'application lit et écrit chaque fichier par une API en HTTPS.

    Quel service Azure Litware doit-elle utiliser pour stocker les fichiers ?
body:
  options:
    - { id: a, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: b, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: c, text: "Azure SQL Database" }
    - { id: d, text: "Azure Files" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Blob Storage is designed for massive amounts of unstructured data such as images and videos, stored as blobs that applications read and write through an API. Photos and videos have no schema, so an object store is the natural fit.
    fr: Le Stockage Blob Azure est conçu pour d'énormes quantités de données non structurées, comme des images et des vidéos, stockées sous forme d'objets blob que les applications lisent et écrivent par une API. Les photos et les vidéos n'ont pas de schéma, un magasin d'objets est donc le choix naturel.
  options:
    a:
      en: Azure Table storage holds key/value items made of data fields, not large binary files.
      fr: Le Stockage Table Azure contient des éléments clé/valeur composés de champs de données, pas de gros fichiers binaires.
    c:
      en: Azure SQL Database is a relational database for structured data in tables; it is not meant to hold millions of media files.
      fr: Azure SQL Database est une base de données relationnelle pour des données structurées en tables ; elle n'est pas destinée à contenir des millions de fichiers multimédias.
    d:
      en: Azure Files provides network file shares that computers mount; the application here calls a storage API, which is the model of Blob Storage.
      fr: Azure Files fournit des partages de fichiers réseau que des ordinateurs montent ; ici, l'application appelle une API de stockage, ce qui correspond au modèle du Stockage Blob.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
