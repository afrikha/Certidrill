id: dp900-3b-gremlin-elements
objective: "3.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Cosmos DB for Apache Gremlin, entities such as people or products are represented by [[ent]], and the relationships between them are represented by [[rel]].
    fr: |
      Dans Azure Cosmos DB for Apache Gremlin, les entités telles que des personnes ou des produits sont représentées par des [[ent]], et les relations entre elles par des [[rel]].
  slots:
    - id: ent
      options:
        - { id: e-edges, text: { en: "edges", fr: "arêtes" } }
        - { id: e-docs, text: { en: "documents", fr: "documents" } }
        - { id: e-vertices, text: { en: "vertices", fr: "sommets" } }
    - id: rel
      options:
        - { id: r-vertices, text: { en: "vertices", fr: "sommets" } }
        - { id: r-edges, text: { en: "edges", fr: "arêtes" } }
        - { id: r-keys, text: { en: "partition keys", fr: "clés de partition" } }
answer:
  values: { ent: e-vertices, rel: r-edges }
explanation:
  correct:
    en: Azure Cosmos DB for Apache Gremlin uses a graph data model. The entities are vertices (also called nodes) and the relationships that connect them are edges; both can carry properties.
    fr: Azure Cosmos DB for Apache Gremlin utilise un modèle de données de graphe. Les entités sont des sommets (aussi appelés nœuds) et les relations qui les relient sont des arêtes ; les uns comme les autres peuvent porter des propriétés.
  options:
    e-docs:
      en: Documents are the data model of Azure Cosmos DB for NoSQL and Azure Cosmos DB for MongoDB.
      fr: Les documents sont le modèle de données d'Azure Cosmos DB for NoSQL et d'Azure Cosmos DB for MongoDB.
    r-keys:
      en: A partition key spreads the data of a container across partitions; it does not describe a relationship between two entities.
      fr: Une clé de partition répartit les données d'un conteneur entre des partitions ; elle ne décrit pas une relation entre deux entités.
references:
  - title: "What is Azure Cosmos DB for Apache Gremlin?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gremlin/introduction
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
