id: dp900-3b-yn-api-nosql
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Cosmos DB for NoSQL, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Cosmos DB for NoSQL, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Cosmos DB for NoSQL stores data as JSON documents.
        fr: Azure Cosmos DB for NoSQL stocke les données sous forme de documents JSON.
    - id: s2
      text:
        en: All the documents of a container must have the same properties.
        fr: Tous les documents d'un conteneur doivent avoir les mêmes propriétés.
    - id: s3
      text:
        en: Queries are written in a SQL-like syntax.
        fr: Les requêtes s'écrivent dans une syntaxe proche de SQL.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Cosmos DB for NoSQL, the native API of the service, stores JSON documents and queries them with a SQL-like syntax. Like the whole service, it is schema-agnostic, so two documents of the same container can have different properties.
    fr: Azure Cosmos DB for NoSQL, l'API native du service, stocke des documents JSON et les interroge avec une syntaxe proche de SQL. Comme tout le service, elle est indépendante du schéma ; deux documents d'un même conteneur peuvent donc avoir des propriétés différentes.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
