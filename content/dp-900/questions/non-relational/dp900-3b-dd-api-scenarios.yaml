id: dp900-3b-dd-api-scenarios
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Three teams at Contoso are each building an application on Azure Cosmos DB.

    Which API should each team use? To answer, drag the appropriate API to each application. Each API may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trois équipes de Contoso créent chacune une application sur Azure Cosmos DB.

    Quelle API chaque équipe doit-elle utiliser ? Pour répondre, faites glisser l'API appropriée vers chaque application. Chaque API peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: nosql, text: Azure Cosmos DB for NoSQL }
    - { id: mongo, text: Azure Cosmos DB for MongoDB }
    - { id: table, text: Azure Cosmos DB for Table }
    - { id: cass, text: Azure Cosmos DB for Apache Cassandra }
    - { id: grem, text: Azure Cosmos DB for Apache Gremlin }
  targets:
    - id: registry
      text: { en: "A device registry in which each configuration is looked up by its partition key and row key", fr: "Un registre d'appareils dans lequel chaque configuration est retrouvée par sa clé de partition et sa clé de ligne" }
    - id: reco
      text: { en: "A recommendation engine that explores the links between customers, products and purchases", fr: "Un moteur de recommandation qui explore les liens entre les clients, les produits et les achats" }
    - id: sensors
      text: { en: "A sensor history kept in column-family tables and queried with CQL", fr: "Un historique de capteurs conservé dans des tables de famille de colonnes et interrogé avec CQL" }
answer:
  mapping: { registry: table, reco: grem, sensors: cass }
explanation:
  correct:
    en: Lookups by partition key and row key are the key-value model of Azure Cosmos DB for Table. A recommendation engine follows relationships between entities, which is the purpose of the graph model of Azure Cosmos DB for Apache Gremlin. Column-family tables queried with CQL are the model of Azure Cosmos DB for Apache Cassandra.
    fr: Les recherches par clé de partition et clé de ligne correspondent au modèle clé-valeur d'Azure Cosmos DB for Table. Un moteur de recommandation suit les relations entre des entités, ce qui est la vocation du modèle de graphe d'Azure Cosmos DB for Apache Gremlin. Les tables de famille de colonnes interrogées avec CQL sont le modèle d'Azure Cosmos DB for Apache Cassandra.
  options:
    nosql:
      en: Azure Cosmos DB for NoSQL stores JSON documents queried with a SQL-like syntax; none of the three applications describes this model.
      fr: Azure Cosmos DB for NoSQL stocke des documents JSON interrogés avec une syntaxe proche de SQL ; aucune des trois applications ne décrit ce modèle.
    mongo:
      en: Azure Cosmos DB for MongoDB stores BSON documents for teams that use MongoDB drivers; no application mentions them.
      fr: Azure Cosmos DB for MongoDB stocke des documents BSON pour les équipes qui utilisent les pilotes MongoDB ; aucune application ne les mentionne.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "What is Azure Cosmos DB for Table?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/introduction
