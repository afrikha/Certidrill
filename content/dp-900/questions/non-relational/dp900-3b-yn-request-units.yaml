id: dp900-3b-yn-request-units
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about throughput in Azure Cosmos DB, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le débit dans Azure Cosmos DB, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Only write operations consume request units; read operations are free.
        fr: Seules les opérations d'écriture consomment des unités de requête ; les opérations de lecture sont gratuites.
    - id: s2
      text:
        en: Reading a 1-KB item by its ID and partition key costs about one request unit.
        fr: Lire un élément de 1 Ko par son ID et sa clé de partition coûte environ une unité de requête.
    - id: s3
      text:
        en: Throughput provisioned on a database can be shared by the containers of that database.
        fr: Le débit provisionné sur une base de données peut être partagé par les conteneurs de cette base de données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The request unit normalizes the cost of every database operation, so reads, writes, queries and deletes all consume RUs. A point read of a 1-KB item by its ID and partition key costs about one RU. Throughput can be dedicated to one container or provisioned on a database and shared by its containers.
    fr: L'unité de requête normalise le coût de toutes les opérations de base de données ; les lectures, les écritures, les requêtes et les suppressions consomment donc toutes des RU. La lecture ponctuelle d'un élément de 1 Ko par son ID et sa clé de partition coûte environ une RU. Le débit peut être dédié à un conteneur ou provisionné sur une base de données et partagé par ses conteneurs.
references:
  - title: "Request Units in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
