id: dp900-3a-table-hot-device-rows
objective: "3.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A table in Azure Table storage contains the five rows shown in the following table.

    Answer each prompt by selecting the appropriate row.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table du Stockage Table Azure contient les cinq lignes figurant dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la ligne appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The row that is returned by a point query on the partition key Paris and the row key D-001", fr: "La ligne renvoyée par une requête de point sur la clé de partition Paris et la clé de ligne D-001" }
    - id: p2
      text: { en: "The last row that is returned by a range query on the partition Lyon for the row keys D-002 to D-004", fr: "La dernière ligne renvoyée par une requête de plage sur la partition Lyon pour les clés de ligne D-002 à D-004" }
  grid:
    header: [{ en: "Row", fr: "Ligne" }, PartitionKey, RowKey, { en: "Model", fr: "Modèle" }, Firmware]
    rows:
      - [{ text: { en: "Row 1", fr: "Ligne 1" }, area: r1 }, { text: Lyon }, { text: D-001 }, { text: T100 }, { text: "2.1" }]
      - [{ text: { en: "Row 2", fr: "Ligne 2" }, area: r2 }, { text: Lyon }, { text: D-002 }, { text: T200 }, { text: "2.0" }]
      - [{ text: { en: "Row 3", fr: "Ligne 3" }, area: r3 }, { text: Lyon }, { text: D-004 }, { text: T100 }, { text: "2.0" }]
      - [{ text: { en: "Row 4", fr: "Ligne 4" }, area: r4 }, { text: Paris }, { text: D-001 }, { text: T300 }, { text: "1.4" }]
      - [{ text: { en: "Row 5", fr: "Ligne 5" }, area: r5 }, { text: Paris }, { text: D-002 }, { text: T100 }, { text: "2.1" }]
answer:
  values: { p1: r4, p2: r3 }
explanation:
  correct:
    en: A point query gives a partition key and a row key and identifies a single row. The row key D-001 exists in two partitions, and only row 4 is in the partition Paris. A range query fetches a contiguous block of rows inside one partition, in row key order. In the partition Lyon, the keys D-002 to D-004 cover rows 2 and 3, so row 3 is the last.
    fr: "Une requête de point fournit une clé de partition et une clé de ligne et identifie une seule ligne. La clé de ligne D-001 existe dans deux partitions, et seule la ligne 4 se trouve dans la partition Paris. Une requête de plage lit un bloc contigu de lignes dans une seule partition, dans l'ordre des clés de ligne. Dans la partition Lyon, les clés D-002 à D-004 couvrent les lignes 2 et 3 : la ligne 3 est donc la dernière."
  options:
    r1:
      en: Row 1 has the row key D-001, but in the partition Lyon.
      fr: La ligne 1 a la clé de ligne D-001, mais dans la partition Lyon.
    r5:
      en: Row 5 belongs to the partition Paris; a range query on the partition Lyon doesn't read it.
      fr: La ligne 5 appartient à la partition Paris ; une requête de plage sur la partition Lyon ne la lit pas.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
