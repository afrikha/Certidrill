id: dp900-3a-files-file-sync-branch
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders moves its shared documents to an Azure file share. In each branch office, a Windows Server computer must keep a locally cached copy of the files, and the copy must stay synchronized with the share.

    What should Northwind Traders use?
  fr: |
    Northwind Traders déplace ses documents partagés vers un partage de fichiers Azure. Dans chaque succursale, un ordinateur Windows Server doit conserver une copie des fichiers mise en cache localement, et cette copie doit rester synchronisée avec le partage.

    Que doit utiliser Northwind Traders ?
body:
  options:
    - { id: a, text: "AzCopy" }
    - { id: b, text: "Azure File Sync" }
    - { id: c, text: "Azure Data Lake Storage Gen2" }
    - { id: d, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Azure File Sync service synchronizes locally cached copies of shared files with the data in Azure Files. Each registered Windows server syncs with the central Azure file share, so every office works on a local copy of the same data.
    fr: "Le service Azure File Sync synchronise des copies de fichiers partagés mises en cache localement avec les données d'Azure Files. Chaque serveur Windows inscrit se synchronise avec le partage de fichiers Azure central : chaque bureau travaille ainsi sur une copie locale des mêmes données."
  options:
    a:
      en: AzCopy copies files when you run the command; it doesn't keep a server and a share synchronized.
      fr: AzCopy copie des fichiers quand vous lancez la commande ; il ne maintient pas un serveur et un partage synchronisés.
    c:
      en: Data Lake Storage Gen2 is Blob Storage with a hierarchical namespace for analytics, not a synchronization service.
      fr: Data Lake Storage Gen2 est le Stockage Blob avec un espace de noms hiérarchique pour l'analytique, pas un service de synchronisation.
    d:
      en: A lifecycle management policy moves or deletes blobs according to their age; it doesn't concern file shares on servers.
      fr: Une stratégie de gestion du cycle de vie déplace ou supprime des objets blob selon leur âge ; elle ne concerne pas des partages de fichiers sur des serveurs.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
