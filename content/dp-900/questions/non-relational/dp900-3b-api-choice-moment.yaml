id: dp900-3b-api-choice-moment
objective: "3.2.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    At which point do you choose the API that an application uses to work with Azure Cosmos DB data?
  fr: |
    À quel moment choisissez-vous l'API qu'une application utilise pour manipuler les données Azure Cosmos DB ?
body:
  options:
    - id: a
      text: { en: "When you create the Azure Cosmos DB account", fr: "Lorsque vous créez le compte Azure Cosmos DB" }
    - id: b
      text: { en: "When you create a database in the account", fr: "Lorsque vous créez une base de données dans le compte" }
    - id: c
      text: { en: "When you create a container in a database", fr: "Lorsque vous créez un conteneur dans une base de données" }
    - id: d
      text: { en: "When you insert the first item in a container", fr: "Lorsque vous insérez le premier élément dans un conteneur" }
answer: { optionId: a }
explanation:
  correct:
    en: The API is chosen when the Azure Cosmos DB account is created. This choice determines the data format the application sends, the query language it uses and the client libraries it works with.
    fr: L'API se choisit à la création du compte Azure Cosmos DB. Ce choix détermine le format des données que l'application envoie, le langage de requête qu'elle utilise et les bibliothèques clientes avec lesquelles elle fonctionne.
  options:
    b:
      en: A database is a namespace that groups containers; it inherits the API of its account.
      fr: Une base de données est un espace de noms qui regroupe des conteneurs ; elle hérite de l'API de son compte.
    c:
      en: On a container you choose the partition key and the throughput, not the API.
      fr: Sur un conteneur, vous choisissez la clé de partition et le débit, pas l'API.
    d:
      en: Items are written through the API that the account already exposes; inserting data does not select an API.
      fr: Les éléments sont écrits au moyen de l'API que le compte expose déjà ; insérer des données ne sélectionne pas d'API.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
