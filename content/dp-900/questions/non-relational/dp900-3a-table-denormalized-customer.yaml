id: dp900-3a-table-denormalized-customer
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores its customers in Azure Table storage. Each customer has a name, one or more telephone numbers and one or more addresses.

    How is this data usually stored?
  fr: |
    Proseware stocke ses clients dans le Stockage Table Azure. Chaque client a un nom, un ou plusieurs numéros de téléphone et une ou plusieurs adresses.

    Comment ces données sont-elles généralement stockées ?
body:
  options:
    - id: a
      text: { en: "In one row per customer that holds all the data of the customer", fr: "Dans une ligne par client qui contient toutes les données du client" }
    - id: b
      text: { en: "In three tables that are linked to each other by foreign keys", fr: "Dans trois tables liées entre elles par des clés étrangères" }
    - id: c
      text: { en: "In one row per customer and a view that joins the addresses", fr: "Dans une ligne par client et une vue qui joint les adresses" }
    - id: d
      text: { en: "In one partition per customer, phone number and address", fr: "Dans une partition par client, par numéro de téléphone et par adresse" }
answer: { optionId: a }
explanation:
  correct:
    en: Data in Azure Table storage is usually denormalized. Each row holds the entire data of a logical entity, here the name, the telephone numbers and the addresses of a customer, and the number of fields can differ from one row to another. A relational database would split this information across several tables.
    fr: "Les données du Stockage Table Azure sont généralement dénormalisées. Chaque ligne contient toutes les données d'une entité logique, ici le nom, les numéros de téléphone et les adresses d'un client, et le nombre de champs peut différer d'une ligne à l'autre. Une base de données relationnelle répartirait ces informations entre plusieurs tables."
  options:
    b:
      en: This is the normalized design of a relational database; Table storage has no foreign keys.
      fr: C'est la conception normalisée d'une base de données relationnelle ; le Stockage Table n'a pas de clés étrangères.
    c:
      en: Table storage has no views and no joins.
      fr: Le Stockage Table n'a ni vues ni jointures.
    d:
      en: A partition groups related rows; it doesn't replace the row that holds the data of a customer.
      fr: Une partition regroupe des lignes associées ; elle ne remplace pas la ligne qui contient les données d'un client.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
