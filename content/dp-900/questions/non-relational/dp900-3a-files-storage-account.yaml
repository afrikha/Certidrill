id: dp900-3a-files-storage-account
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to create an Azure file share for the documents of a project team.

    In which Azure resource do you create the file share?
  fr: |
    Vous prévoyez de créer un partage de fichiers Azure pour les documents d'une équipe projet.

    Dans quelle ressource Azure créez-vous le partage de fichiers ?
body:
  options:
    - { id: a, text: { en: "A storage account", fr: "Un compte de stockage" } }
    - { id: b, text: { en: "A blob container", fr: "Un conteneur d'objets blob" } }
    - { id: c, text: { en: "A virtual machine", fr: "Une machine virtuelle" } }
    - { id: d, text: { en: "A virtual network", fr: "Un réseau virtuel" } }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Files storage is created in a storage account. The data of the account can be distributed across any number of file shares.
    fr: Le stockage Azure Files se crée dans un compte de stockage. Les données du compte peuvent être réparties entre un nombre quelconque de partages de fichiers.
  options:
    b:
      en: A container groups blobs in Blob Storage; a file share is a separate resource of the storage account.
      fr: Un conteneur regroupe des objets blob dans le Stockage Blob ; un partage de fichiers est une ressource distincte du compte de stockage.
    c:
      en: Azure Files is a managed service; no virtual machine hosts the share.
      fr: Azure Files est un service managé ; aucune machine virtuelle n'héberge le partage.
    d:
      en: A virtual network can restrict access to a share, but it doesn't contain it.
      fr: Un réseau virtuel peut restreindre l'accès à un partage, mais il ne le contient pas.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
