id: dp900-3b-yn-partition-key
objective: "3.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about partitioning in Azure Cosmos DB, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le partitionnement dans Azure Cosmos DB, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Items that have the same partition key value belong to the same logical partition.
        fr: Les éléments qui ont la même valeur de clé de partition appartiennent à la même partition logique.
    - id: s2
      text:
        en: A property that has only a few distinct values is a good partition key.
        fr: Une propriété qui n'a que quelques valeurs distinctes est une bonne clé de partition.
    - id: s3
      text:
        en: A logical partition can store up to 20 GB of data.
        fr: Une partition logique peut stocker jusqu'à 20 Go de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The partition key is a property that spreads the items of a container across logical partitions; all items with the same key value form one logical partition. A good key has many distinct values so that data and requests are spread evenly, which a key with few values does not achieve. Each logical partition holds up to 20 GB.
    fr: La clé de partition est une propriété qui répartit les éléments d'un conteneur entre des partitions logiques ; tous les éléments de même valeur de clé forment une partition logique. Une bonne clé a beaucoup de valeurs distinctes pour répartir uniformément les données et les requêtes, ce qu'une clé à quelques valeurs ne permet pas. Chaque partition logique contient jusqu'à 20 Go.
references:
  - title: "Partitioning and horizontal scaling in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
