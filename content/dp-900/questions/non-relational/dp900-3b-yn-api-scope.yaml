id: dp900-3b-yn-api-scope
objective: "3.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the Azure Cosmos DB APIs, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les API Azure Cosmos DB, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The API of an Azure Cosmos DB account determines the query language and the client libraries that the application uses.
        fr: L'API d'un compte Azure Cosmos DB détermine le langage de requête et les bibliothèques clientes que l'application utilise.
    - id: s2
      text:
        en: Azure Cosmos DB for PostgreSQL stores data in a non-relational key-value model.
        fr: Azure Cosmos DB for PostgreSQL stocke les données dans un modèle clé-valeur non relationnel.
    - id: s3
      text:
        en: Among the Azure Cosmos DB APIs, only Azure Cosmos DB for NoSQL supports the replication of data to several Azure regions.
        fr: Parmi les API Azure Cosmos DB, seule Azure Cosmos DB for NoSQL prend en charge la réplication des données dans plusieurs régions Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The API chosen for an account decides the data format, the query language and the client libraries of the application. Azure Cosmos DB for PostgreSQL is a separate relational offering, not one of the five NoSQL APIs, and it has no key-value model. Global distribution is a capability of the Azure Cosmos DB service; the Table, Apache Cassandra and Apache Gremlin APIs also distribute data to the Azure regions you choose.
    fr: L'API choisie pour un compte décide du format des données, du langage de requête et des bibliothèques clientes de l'application. Azure Cosmos DB for PostgreSQL est une offre relationnelle distincte, qui ne fait pas partie des cinq API NoSQL et n'a pas de modèle clé-valeur. La distribution mondiale est une capacité du service Azure Cosmos DB ; les API Table, Apache Cassandra et Apache Gremlin distribuent elles aussi les données dans les régions Azure de votre choix.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "What is Azure Cosmos DB for Table?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/introduction
