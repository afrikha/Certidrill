id: dp900-3a-table-partitions-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the partitions of a table in Azure Table storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les partitions d'une table du Stockage Table Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Rows that have the same partition key are stored together.
        fr: Les lignes qui ont la même clé de partition sont stockées ensemble.
    - id: s2
      text:
        en: The number of partitions of a table is fixed when the table is created.
        fr: Le nombre de partitions d'une table est fixé à la création de la table.
    - id: s3
      text:
        en: A partition grows as rows are added to it, independently of the other partitions.
        fr: Une partition grandit à mesure que des lignes y sont ajoutées, indépendamment des autres partitions.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Table storage splits a table into partitions to keep access fast. Rows that share a partition key are stored together. Partitions are independent of each other, they grow or shrink as rows are added or removed, and a table can contain any number of them.
    fr: Le Stockage Table Azure divise une table en partitions pour garantir un accès rapide. Les lignes qui partagent une clé de partition sont stockées ensemble. Les partitions sont indépendantes les unes des autres, elles grandissent ou rétrécissent à mesure que des lignes sont ajoutées ou supprimées, et une table peut en contenir un nombre quelconque.
  options:
    s2:
      en: A table can contain any number of partitions; a new partition key value simply creates a new partition.
      fr: Une table peut contenir un nombre quelconque de partitions ; une nouvelle valeur de clé de partition crée simplement une nouvelle partition.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
