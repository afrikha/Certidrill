id: dp900-3a-table-characteristics
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe a table in Azure Table storage?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent une table du Stockage Table Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The columns can differ from one row to another.", fr: "Les colonnes peuvent différer d'une ligne à l'autre." } }
    - { id: b, text: { en: "The columns must be defined before rows are inserted.", fr: "Les colonnes doivent être définies avant l'insertion de lignes." } }
    - { id: c, text: { en: "The table can be combined with another table by a join.", fr: "La table peut être combinée à une autre table par une jointure." } }
    - { id: d, text: { en: "A timestamp column records when a row was last modified.", fr: "Une colonne d'horodatage enregistre la dernière modification d'une ligne." } }
    - { id: e, text: { en: "The table is mounted as a network drive by using SMB.", fr: "La table est montée comme un lecteur réseau en SMB." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A table in Azure Table storage holds semi-structured data. Every row has a key and a timestamp column that records the date and time of its last modification; all the other columns can vary from one row to another.
    fr: "Une table du Stockage Table Azure contient des données semi-structurées. Chaque ligne a une clé et une colonne d'horodatage qui enregistre la date et l'heure de sa dernière modification ; toutes les autres colonnes peuvent varier d'une ligne à l'autre."
  options:
    b:
      en: A fixed list of columns defined in advance is a feature of relational tables.
      fr: Une liste fixe de colonnes définie à l'avance est une caractéristique des tables relationnelles.
    c:
      en: Table storage has no relationships and no joins between tables.
      fr: Le Stockage Table n'a ni relations ni jointures entre les tables.
    e:
      en: Shares mounted over SMB are provided by Azure Files; a table is reached through the Table storage API.
      fr: Les partages montés en SMB sont fournis par Azure Files ; une table s'utilise par l'API du Stockage Table.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
