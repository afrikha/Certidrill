id: dp900-3a-files-dd-limits
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Files, the maximum size of a single file is [[size]].

      Azure Files supports up to [[handles]] concurrent handles per file or directory.
    fr: |
      Dans Azure Files, la taille maximale d'un fichier est de [[size]].

      Azure Files prend en charge jusqu'à [[handles]] handles simultanés par fichier ou répertoire.
  slots:
    - id: size
      options:
        - { id: g195, text: { en: "195 GiB", fr: "195 Gio" } }
        - { id: t4, text: { en: "4 TiB", fr: "4 Tio" } }
        - { id: t8, text: { en: "8 TiB", fr: "8 Tio" } }
        - { id: t190, text: { en: "190.7 TiB", fr: "190,7 Tio" } }
    - id: handles
      options:
        - { id: h200, text: "200" }
        - { id: h2000, text: { en: "2,000", fr: "2 000" } }
        - { id: h20000, text: { en: "20,000", fr: "20 000" } }
answer:
  values: { size: t4, handles: h2000 }
explanation:
  correct:
    en: A single file in an Azure file share can be up to 4 TiB, and Azure Files currently supports up to 2,000 concurrent handles per file or directory. The other sizes are limits of blobs.
    fr: Un fichier d'un partage de fichiers Azure peut atteindre 4 Tio, et Azure Files prend actuellement en charge jusqu'à 2 000 handles simultanés par fichier ou répertoire. Les autres tailles sont des limites d'objets blob.
  options:
    g195:
      en: Just over 195 GiB is the maximum size of an append blob.
      fr: Un peu plus de 195 Gio est la taille maximale d'un objet blob d'ajout.
    t8:
      en: 8 TiB is the maximum size of a page blob.
      fr: 8 Tio est la taille maximale d'un objet blob de pages.
    t190:
      en: About 190.7 TiB is the maximum size of a block blob.
      fr: Environ 190,7 Tio est la taille maximale d'un objet blob de blocs.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
