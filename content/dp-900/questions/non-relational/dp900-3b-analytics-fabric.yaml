id: dp900-3b-analytics-fabric
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank needs to run a large-scale analytical workload: aggregate ten years of transaction history from several systems to produce reports.

    Which Azure service should you recommend?
  fr: |
    Woodgrove Bank doit exécuter une charge de travail analytique à grande échelle : agréger dix ans d'historique de transactions provenant de plusieurs systèmes pour produire des rapports.

    Quel service Azure devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure Cosmos DB
    - id: b
      text: { en: "Azure Table storage", fr: "Stockage Table Azure" }
    - id: c
      text: Azure Files
    - id: d
      text: Microsoft Fabric
answer: { optionId: d }
explanation:
  correct:
    en: Aggregating years of history for reporting is an analytical workload. Microsoft Fabric is the analytics platform of this list, and Microsoft points to it rather than to Azure Cosmos DB for large-scale analytics.
    fr: Agréger des années d'historique pour produire des rapports est une charge de travail analytique. Microsoft Fabric est la plateforme d'analytique de cette liste, et Microsoft la désigne plutôt qu'Azure Cosmos DB pour l'analytique à grande échelle.
  options:
    a:
      en: Azure Cosmos DB is designed for operational applications that need fast reads and writes, not for large-scale analytical workloads.
      fr: Azure Cosmos DB est conçu pour les applications opérationnelles qui ont besoin de lectures et d'écritures rapides, pas pour les charges de travail analytiques à grande échelle.
    b:
      en: Azure Table storage is a simple key-value store for operational data; it offers no analytical engine.
      fr: Le Stockage Table Azure est un simple magasin clé-valeur pour des données opérationnelles ; il n'offre aucun moteur analytique.
    c:
      en: Azure Files provides file shares; it does not analyze data.
      fr: Azure Files fournit des partages de fichiers ; il n'analyse pas les données.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Azure Cosmos DB - Database for the AI Era"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/introduction
