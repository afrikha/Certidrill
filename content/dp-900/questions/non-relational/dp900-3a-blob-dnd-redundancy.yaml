id: dp900-3a-blob-dnd-redundancy
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the redundancy option of Azure Storage that it describes.

    To answer, drag the appropriate redundancy option to each description. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'option de redondance du Stockage Azure qu'elle décrit.

    Pour répondre, faites glisser l'option de redondance appropriée vers chaque description. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
    - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
    - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
    - { id: ragrs, text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" } }
  targets:
    - id: t1
      text: { en: "The copies of the data are spread across three availability zones of the primary region.", fr: "Les copies des données sont réparties entre trois zones de disponibilité de la région primaire." }
    - id: t2
      text: { en: "The data is replicated to a secondary region, where applications can read it even before a failover.", fr: "Les données sont répliquées vers une région secondaire, où les applications peuvent les lire avant même un basculement." }
    - id: t3
      text: { en: "Three copies of the data are kept in a single datacenter, and nowhere else.", fr: "Trois copies des données sont conservées dans un seul centre de données, et nulle part ailleurs." }
answer:
  mapping: { t1: zrs, t2: ragrs, t3: lrs }
explanation:
  correct:
    en: LRS keeps three copies in one datacenter. ZRS spreads the copies across three availability zones of the primary region, so the data stays accessible if a zone goes down. GRS replicates the data asynchronously to a distant secondary region, and RA-GRS adds read access to that region before any failover.
    fr: "Le stockage LRS conserve trois copies dans un seul centre de données. Le stockage ZRS répartit les copies entre trois zones de disponibilité de la région primaire : les données restent accessibles si une zone tombe en panne. Le stockage GRS réplique les données de façon asynchrone vers une région secondaire éloignée, et RA-GRS ajoute l'accès en lecture à cette région avant tout basculement."
  options:
    grs:
      en: With GRS, the copy in the secondary region can't be read by applications until a failover occurs.
      fr: Avec GRS, la copie de la région secondaire ne peut pas être lue par les applications tant qu'un basculement n'a pas eu lieu.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
