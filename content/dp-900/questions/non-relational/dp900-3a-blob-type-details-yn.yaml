id: dp900-3a-blob-type-details-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the types of blobs in Azure Blob Storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les types d'objets blob du Stockage Blob Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A page blob can hold up to about 190.7 TiB of data.
        fr: Un objet blob de pages peut contenir jusqu'à environ 190,7 Tio de données.
    - id: s2
      text:
        en: An application can update a block that was already written to an append blob.
        fr: Une application peut mettre à jour un bloc déjà écrit dans un objet blob d'ajout.
    - id: s3
      text:
        en: A block blob suits large binary objects that change infrequently.
        fr: Un objet blob de blocs convient aux objets binaires volumineux qui changent rarement.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: A block blob, made of up to 50,000 blocks of 4,000 MiB, can reach about 190.7 TiB and is best for discrete, large binary objects that change infrequently. A page blob is limited to 8 TiB. An append blob only accepts new blocks at its end.
    fr: Un objet blob de blocs, composé d'au plus 50 000 blocs de 4 000 Mio, peut atteindre environ 190,7 Tio et convient surtout aux objets binaires distincts et volumineux qui changent rarement. Un objet blob de pages est limité à 8 Tio. Un objet blob d'ajout n'accepte de nouveaux blocs qu'à sa fin.
  options:
    s1:
      en: 190.7 TiB is the limit of a block blob; a page blob can hold up to 8 TiB.
      fr: 190,7 Tio est la limite d'un objet blob de blocs ; un objet blob de pages peut contenir jusqu'à 8 Tio.
    s2:
      en: In an append blob, blocks can only be added to the end; updating or deleting existing blocks isn't supported.
      fr: Dans un objet blob d'ajout, les blocs ne peuvent être ajoutés qu'à la fin ; la mise à jour ou la suppression de blocs existants n'est pas prise en charge.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
