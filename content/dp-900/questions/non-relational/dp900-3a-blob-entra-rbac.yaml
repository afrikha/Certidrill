id: dp900-3a-blob-entra-rbac
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores design documents in Azure Blob Storage. Employees must sign in with their own identity, and each team must receive only the permissions that it needs.

    Which method does Microsoft recommend to authorize access to the blobs?
  fr: |
    Proseware stocke des documents de conception dans le Stockage Blob Azure. Les employés doivent se connecter avec leur propre identité, et chaque équipe ne doit recevoir que les autorisations dont elle a besoin.

    Quelle méthode Microsoft recommande-t-il pour autoriser l'accès aux objets blob ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra ID with Azure RBAC", fr: "Microsoft Entra ID avec Azure RBAC" } }
    - { id: b, text: { en: "The access key of the storage account", fr: "La clé d'accès du compte de stockage" } }
    - { id: c, text: { en: "Anonymous access to the containers", fr: "L'accès anonyme aux conteneurs" } }
    - { id: d, text: { en: "A shared access signature (SAS)", fr: "Une signature d'accès partagé (SAS)" } }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft Entra ID is the recommended way to sign in to Blob Storage. Each user is identified individually, and Azure role-based access control (RBAC) assigns precise permissions to users and groups.
    fr: Microsoft Entra ID est la méthode de connexion recommandée pour le Stockage Blob. Chaque utilisateur est identifié individuellement, et le contrôle d'accès en fonction du rôle Azure (RBAC) attribue des autorisations précises aux utilisateurs et aux groupes.
  options:
    b:
      en: The account key gives full access to the whole storage account and doesn't identify the person who uses it.
      fr: La clé du compte donne un accès complet à tout le compte de stockage et n'identifie pas la personne qui l'utilise.
    c:
      en: Anonymous access lets anyone read the blobs without signing in, which is the opposite of the requirement.
      fr: L'accès anonyme permet à n'importe qui de lire les objets blob sans se connecter, ce qui est le contraire de l'exigence.
    d:
      en: A SAS is a token that grants access to whoever holds it; employees would not sign in with their own identity.
      fr: Une SAS est un jeton qui donne accès à quiconque le détient ; les employés ne se connecteraient pas avec leur propre identité.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
