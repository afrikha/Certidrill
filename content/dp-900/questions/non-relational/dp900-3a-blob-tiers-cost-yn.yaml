id: dp900-3a-blob-tiers-cost-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the access tiers of Azure Blob Storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les niveaux d'accès du Stockage Blob Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Hot is the default access tier.
        fr: Le niveau chaud (Hot) est le niveau d'accès par défaut.
    - id: s2
      text:
        en: Storing data costs more in the cool tier than in the hot tier.
        fr: Le stockage des données coûte plus cher dans le niveau froid (Cool) que dans le niveau chaud (Hot).
    - id: s3
      text:
        en: A blob in the archive tier is read within a few milliseconds.
        fr: Un objet blob du niveau archive (Archive) se lit en quelques millisecondes.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Hot is the default tier, for blobs that are accessed frequently. The cooler the tier, the lower the storage cost and the higher the access cost. Hot, cool and cold blobs are read in milliseconds, but an archived blob is offline and can take hours to become available.
    fr: Le niveau chaud (Hot) est le niveau par défaut, pour les objets blob consultés fréquemment. Plus le niveau est froid, plus le coût de stockage est bas et plus le coût d'accès est élevé. Les objets blob des niveaux Hot, Cool et Cold se lisent en quelques millisecondes, mais un objet blob archivé est hors connexion et peut mettre des heures à devenir disponible.
  options:
    s2:
      en: The cool tier has a lower storage cost than the hot tier; it is the access cost that is higher.
      fr: Le niveau froid (Cool) a un coût de stockage inférieur à celui du niveau chaud (Hot) ; c'est le coût d'accès qui est plus élevé.
    s3:
      en: An archived blob must first be rehydrated to an online tier, which can take up to 15 hours.
      fr: Un objet blob archivé doit d'abord être réhydraté vers un niveau en ligne, ce qui peut prendre jusqu'à 15 heures.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
