id: dp900-3b-api-document-pair
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two Azure Cosmos DB APIs use a document data model?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux API Azure Cosmos DB qui utilisent un modèle de données de documents ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: Azure Cosmos DB for Table
    - id: b
      text: Azure Cosmos DB for MongoDB
    - id: c
      text: Azure Cosmos DB for Apache Gremlin
    - id: d
      text: Azure Cosmos DB for NoSQL
    - id: e
      text: Azure Cosmos DB for Apache Cassandra
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure Cosmos DB for NoSQL stores data as JSON documents, and Azure Cosmos DB for MongoDB stores documents in BSON, a binary form of JSON. They differ in their query language, namely a SQL-like syntax for the first and the MongoDB query language for the second.
    fr: Azure Cosmos DB for NoSQL stocke les données sous forme de documents JSON, et Azure Cosmos DB for MongoDB stocke des documents au format BSON, une forme binaire de JSON. Elles diffèrent par leur langage de requête, à savoir une syntaxe proche de SQL pour la première et le langage de requête MongoDB pour la seconde.
  options:
    a:
      en: Azure Cosmos DB for Table uses a key-value model; rows are found by a partition key and a row key.
      fr: Azure Cosmos DB for Table utilise un modèle clé-valeur ; les lignes sont retrouvées par une clé de partition et une clé de ligne.
    c:
      en: Azure Cosmos DB for Apache Gremlin uses a graph model made of vertices and edges.
      fr: Azure Cosmos DB for Apache Gremlin utilise un modèle de graphe composé de sommets et d'arêtes.
    e:
      en: Azure Cosmos DB for Apache Cassandra uses a column-family model.
      fr: Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
