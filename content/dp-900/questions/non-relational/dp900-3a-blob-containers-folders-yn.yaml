id: dp900-3a-blob-containers-folders-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You store blobs in a container of an Azure Storage account. The hierarchical namespace is not enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous stockez des objets blob dans un conteneur d'un compte de Stockage Azure. L'espace de noms hiérarchique n'est pas activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can assign access permissions to one of the folders shown in the container.
        fr: Vous pouvez attribuer des autorisations d'accès à l'un des dossiers affichés dans le conteneur.
    - id: s2
      text:
        en: A `/` character in the names of the blobs displays them as a hierarchy of folders.
        fr: Un caractère `/` dans les noms des objets blob les présente comme une hiérarchie de dossiers.
    - id: s3
      text:
        en: Access to the blobs can be controlled at the level of the container.
        fr: L'accès aux objets blob peut être contrôlé au niveau du conteneur.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Without the hierarchical namespace, folders are only virtual. They result from the `/` character in blob names, so no folder-level operation, such as setting permissions, is possible. Access is controlled at the container level.
    fr: "Sans l'espace de noms hiérarchique, les dossiers ne sont que virtuels. Ils résultent du caractère `/` dans les noms des objets blob : aucune opération au niveau d'un dossier, comme la définition d'autorisations, n'est possible. L'accès se contrôle au niveau du conteneur."
  options:
    s1:
      en: The folders don't really exist. Permissions on folders require the hierarchical namespace of Azure Data Lake Storage Gen2.
      fr: Les dossiers n'existent pas vraiment. Des autorisations sur des dossiers exigent l'espace de noms hiérarchique d'Azure Data Lake Storage Gen2.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
