id: dp900-3a-files-replace-file-server
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to retire an on-premises file server. Employees must continue to open the shared folders from their Windows computers as mapped network drives.

    Which Azure service should Contoso use?
  fr: |
    Contoso prévoit de mettre hors service un serveur de fichiers local. Les employés doivent continuer à ouvrir les dossiers partagés depuis leurs ordinateurs Windows sous forme de lecteurs réseau mappés.

    Quel service Azure Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: b, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: c, text: "Azure Cosmos DB" }
    - { id: d, text: "Azure Files" }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Files creates cloud-based network shares like those of an on-premises file server. Windows computers mount a share over the SMB protocol and see it as a network drive, with no server hardware to maintain.
    fr: Azure Files crée des partages réseau dans le cloud, comme ceux d'un serveur de fichiers local. Les ordinateurs Windows montent un partage avec le protocole SMB et le voient comme un lecteur réseau, sans matériel serveur à entretenir.
  options:
    a:
      en: Blob Storage holds objects that applications reach through an API or a URL; it doesn't offer SMB shares that are mapped as network drives.
      fr: Le Stockage Blob contient des objets que les applications atteignent par une API ou une URL ; il n'offre pas de partages SMB mappés comme lecteurs réseau.
    b:
      en: Table storage holds key/value items in tables, not files and folders.
      fr: Le Stockage Table contient des éléments clé/valeur dans des tables, pas des fichiers ni des dossiers.
    c:
      en: Azure Cosmos DB is a NoSQL database for application data, not a file share.
      fr: Azure Cosmos DB est une base de données NoSQL pour des données d'application, pas un partage de fichiers.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: What is Azure Files?
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
