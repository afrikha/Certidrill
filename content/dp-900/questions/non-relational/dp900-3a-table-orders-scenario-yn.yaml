id: dp900-3a-table-orders-scenario-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys stores its orders in a table of Azure Table storage. The partition key is the customer ID, and the row key is the order ID. The other columns include the amount of the order.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke ses commandes dans une table du Stockage Table Azure. La clé de partition est l'ID du client, et la clé de ligne est l'ID de la commande. Les autres colonnes incluent le montant de la commande.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The orders of a customer are stored in the order of their timestamps.
        fr: Les commandes d'un client sont stockées dans l'ordre de leurs horodatages.
    - id: s2
      text:
        en: All the orders of a customer are stored in the same partition.
        fr: Toutes les commandes d'un client sont stockées dans la même partition.
    - id: s3
      text:
        en: A search that specifies a customer ID examines less data than a search that specifies only an amount.
        fr: Une recherche qui précise un ID de client examine moins de données qu'une recherche qui ne précise qu'un montant.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Rows with the same partition key, here the customer ID, are stored together in one partition, in row key order, that is, by order ID. Including the partition key in the search criteria narrows the volume of data to examine to one partition, whereas a search on the amount alone can't be limited to a partition.
    fr: Les lignes de même clé de partition, ici l'ID du client, sont stockées ensemble dans une partition, dans l'ordre des clés de ligne, c'est-à-dire par ID de commande. Inclure la clé de partition dans les critères de recherche réduit le volume de données à examiner à une seule partition, alors qu'une recherche sur le seul montant ne peut pas être limitée à une partition.
  options:
    s1:
      en: Inside a partition, rows are stored in row key order, here the order ID; the timestamp plays no role.
      fr: Dans une partition, les lignes sont stockées dans l'ordre des clés de ligne, ici l'ID de commande ; l'horodatage ne joue aucun rôle.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
