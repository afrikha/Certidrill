id: dp900-3a-blob-adls-gen2-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to use Azure Data Lake Storage Gen2 as the data lake of its analytics platform.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'utiliser Azure Data Lake Storage Gen2 comme lac de données de sa plateforme d'analytique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Contoso can upgrade an existing Azure Storage account to support Azure Data Lake Storage Gen2.
        fr: Contoso peut mettre à niveau un compte de Stockage Azure existant pour prendre en charge Azure Data Lake Storage Gen2.
    - id: s2
      text:
        en: After an upgrade, Contoso can revert the storage account to a flat namespace.
        fr: Après une mise à niveau, Contoso peut rétablir un espace de noms plat sur le compte de stockage.
    - id: s3
      text:
        en: Azure Databricks can mount a file system that is hosted in Azure Data Lake Storage Gen2.
        fr: Azure Databricks peut monter un système de fichiers hébergé dans Azure Data Lake Storage Gen2.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Data Lake Storage Gen2 is Blob Storage with the hierarchical namespace option enabled. The option is selected when the storage account is created, or an existing account is upgraded; the upgrade is a one-way process. Azure Databricks can mount such a file system and process huge volumes of data in it.
    fr: "Azure Data Lake Storage Gen2 est le Stockage Blob avec l'option d'espace de noms hiérarchique activée. L'option se choisit à la création du compte de stockage, ou bien un compte existant est mis à niveau ; la mise à niveau est un processus à sens unique. Azure Databricks peut monter un tel système de fichiers et y traiter d'énormes volumes de données."
  options:
    s2:
      en: The upgrade can't be undone; an upgraded account can't go back to a flat namespace.
      fr: La mise à niveau est irréversible ; un compte mis à niveau ne peut pas revenir à un espace de noms plat.
references:
  - title: Explore Azure Data Lake Storage Gen2
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/3-azure-data-lake-gen2
