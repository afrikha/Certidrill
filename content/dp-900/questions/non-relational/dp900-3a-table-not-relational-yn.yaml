id: dp900-3a-table-not-relational-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Table storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Stockage Table Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can define a foreign key between two tables.
        fr: Vous pouvez définir une clé étrangère entre deux tables.
    - id: s2
      text:
        en: A table is created in an Azure Storage account.
        fr: Une table se crée dans un compte de Stockage Azure.
    - id: s3
      text:
        en: You can create stored procedures that run in the service.
        fr: Vous pouvez créer des procédures stockées qui s'exécutent dans le service.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure Table storage is one of the data services of a storage account, and a storage account can contain any number of tables. A table there is not a relational table, because the service has no concept of foreign keys, relationships, stored procedures or views.
    fr: "Le Stockage Table Azure est l'un des services de données d'un compte de stockage, et un compte de stockage peut contenir un nombre quelconque de tables. Une telle table n'est pas une table relationnelle : le service ne connaît ni clés étrangères, ni relations, ni procédures stockées, ni vues."
  options:
    s1:
      en: Table storage has no foreign keys and no relationships between tables.
      fr: Le Stockage Table n'a ni clés étrangères ni relations entre les tables.
    s3:
      en: Stored procedures are objects of relational databases; Table storage doesn't offer them.
      fr: Les procédures stockées sont des objets de bases de données relationnelles ; le Stockage Table n'en propose pas.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
