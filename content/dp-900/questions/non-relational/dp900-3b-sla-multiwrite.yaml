id: dp900-3b-sla-multiwrite
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a critical application on Azure Cosmos DB. The company requires the 99.999% availability SLA for both reads and writes.

    What should you configure on the Azure Cosmos DB account?
  fr: |
    Litware exécute une application critique sur Azure Cosmos DB. L'entreprise exige le contrat SLA de disponibilité de 99,999 % pour les lectures comme pour les écritures.

    Que devez-vous configurer sur le compte Azure Cosmos DB ?
body:
  options:
    - id: a
      text: { en: "Multi-region writes across several Azure regions", fr: "Les écritures multirégions dans plusieurs régions Azure" }
    - id: b
      text: { en: "The serverless capacity mode", fr: "Le mode de capacité sans serveur (serverless)" }
    - id: c
      text: { en: "Strong as the default consistency level", fr: "Fort (Strong) comme niveau de cohérence par défaut" }
    - id: d
      text: { en: "Throughput shared at the database level", fr: "Un débit partagé au niveau de la base de données" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Cosmos DB accounts configured with multi-region writes get a 99.999% availability SLA. Each region accepts reads and writes, so the other regions keep serving requests if one region becomes unavailable.
    fr: Les comptes Azure Cosmos DB configurés avec des écritures multirégions bénéficient d'un contrat SLA de disponibilité de 99,999 %. Chaque région accepte les lectures et les écritures ; les autres régions continuent donc de répondre si une région devient indisponible.
  options:
    b:
      en: A serverless account runs in a single Azure region, so it does not reach the availability of a multi-region account.
      fr: Un compte sans serveur s'exécute dans une seule région Azure ; il n'atteint donc pas la disponibilité d'un compte multirégion.
    c:
      en: The consistency level decides how recent the data that is read must be; Strong favors consistency over availability.
      fr: Le niveau de cohérence décide de la fraîcheur des données lues ; le niveau Fort (Strong) privilégie la cohérence au détriment de la disponibilité.
    d:
      en: Sharing throughput between containers is a capacity choice; it does not change the availability SLA.
      fr: Partager le débit entre des conteneurs est un choix de capacité ; cela ne modifie pas le contrat SLA de disponibilité.
references:
  - title: "Distribute your data globally with Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
