id: dp900-3b-yn-api-table
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Cosmos DB for Table, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Cosmos DB for Table, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A row is identified by the combination of its partition key and its row key.
        fr: Une ligne est identifiée par la combinaison de sa clé de partition et de sa clé de ligne.
    - id: s2
      text:
        en: An application written for Azure Table storage must be completely rewritten to use Azure Cosmos DB for Table.
        fr: Une application écrite pour le Stockage Table Azure doit être entièrement réécrite pour utiliser Azure Cosmos DB for Table.
    - id: s3
      text:
        en: By default, Azure Cosmos DB for Table indexes only the partition key and the row key.
        fr: Par défaut, Azure Cosmos DB for Table indexe uniquement la clé de partition et la clé de ligne.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Azure Cosmos DB for Table stores key-value data in tables whose rows are identified by a unique combination of `PartitionKey` and `RowKey`. The API is compatible with the Azure Table storage SDKs and tools, so existing applications move with little or no code change. Unlike Azure Table storage, it indexes all the properties by default.
    fr: Azure Cosmos DB for Table stocke des données clé-valeur dans des tables dont les lignes sont identifiées par une combinaison unique de `PartitionKey` et de `RowKey`. L'API est compatible avec les kits SDK et les outils du Stockage Table Azure ; les applications existantes migrent donc avec peu ou pas de modifications du code. Contrairement au Stockage Table Azure, elle indexe toutes les propriétés par défaut.
references:
  - title: "What is Azure Cosmos DB for Table?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/introduction
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
