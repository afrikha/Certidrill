id: dp900-3b-api-social-graph
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is building a social network on Azure Cosmos DB. The application must store the members and the "follows" relationships between them, and answer questions such as "which members follow the friends of a given member?".

    Which Azure Cosmos DB API should you use?
  fr: |
    Wingtip Toys crée un réseau social sur Azure Cosmos DB. L'application doit stocker les membres et les relations « suit » entre eux, et répondre à des questions telles que « quels membres suivent les amis d'un membre donné ? ».

    Quelle API Azure Cosmos DB devez-vous utiliser ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for NoSQL
    - id: b
      text: Azure Cosmos DB for Table
    - id: c
      text: Azure Cosmos DB for Apache Cassandra
    - id: d
      text: Azure Cosmos DB for Apache Gremlin
answer: { optionId: d }
explanation:
  correct:
    en: Azure Cosmos DB for Apache Gremlin uses a graph model in which entities are vertices and relationships are edges. It is the API intended for data where the relationships matter as much as the entities, such as social networks, and its Gremlin language traverses those relationships.
    fr: Azure Cosmos DB for Apache Gremlin utilise un modèle de graphe dans lequel les entités sont des sommets et les relations des arêtes. C'est l'API prévue pour les données où les relations comptent autant que les entités, comme les réseaux sociaux, et son langage Gremlin parcourt ces relations.
  options:
    a:
      en: Azure Cosmos DB for NoSQL stores JSON documents; it has no graph model for traversing relationships between members.
      fr: Azure Cosmos DB for NoSQL stocke des documents JSON ; il n'a pas de modèle de graphe pour parcourir les relations entre les membres.
    b:
      en: Azure Cosmos DB for Table stores key-value pairs that are looked up by keys, not relationships to traverse.
      fr: Azure Cosmos DB for Table stocke des paires clé-valeur retrouvées par leurs clés, pas des relations à parcourir.
    c:
      en: Azure Cosmos DB for Apache Cassandra uses a column-family model, which does not represent relationships between entities.
      fr: Azure Cosmos DB for Apache Cassandra utilise un modèle de famille de colonnes, qui ne représente pas les relations entre des entités.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "What is Azure Cosmos DB for Apache Gremlin?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gremlin/introduction
