id: dp900-3a-table-dnd-terms
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the element of an Azure Table storage row that it describes.

    To answer, drag the appropriate element to each description. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'élément d'une ligne du Stockage Table Azure qu'elle décrit.

    Pour répondre, faites glisser l'élément approprié vers chaque description. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pk, text: { en: "Partition key", fr: "Clé de partition" } }
    - { id: rk, text: { en: "Row key", fr: "Clé de ligne" } }
    - { id: ts, text: { en: "Timestamp", fr: "Horodatage" } }
    - { id: fk, text: { en: "Foreign key", fr: "Clé étrangère" } }
  targets:
    - id: t1
      text: { en: "Records the date and time at which the row was last modified", fr: "Enregistre la date et l'heure de la dernière modification de la ligne" }
    - id: t2
      text: { en: "Identifies the group of related rows with which the row is stored", fr: "Identifie le groupe de lignes associées avec lequel la ligne est stockée" }
    - id: t3
      text: { en: "Distinguishes the row from the other rows of the same group", fr: "Distingue la ligne des autres lignes du même groupe" }
answer:
  mapping: { t1: ts, t2: pk, t3: rk }
explanation:
  correct:
    en: The partition key identifies the partition, that is, the group of related rows that are stored together. The row key is unique to each row in that partition. The timestamp column records when the row was last modified.
    fr: La clé de partition identifie la partition, c'est-à-dire le groupe de lignes associées stockées ensemble. La clé de ligne est propre à chaque ligne de cette partition. La colonne d'horodatage enregistre la dernière modification de la ligne.
  options:
    fk:
      en: A foreign key links a row to another table in a relational database; Table storage has none.
      fr: Une clé étrangère lie une ligne à une autre table dans une base de données relationnelle ; le Stockage Table n'en a pas.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
