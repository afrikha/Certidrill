id: dp900-3b-session-consistency
objective: "3.2.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys has a globally distributed application that uses Azure Cosmos DB. A user who posts a comment must see that comment immediately during the same session. Other users can see it a little later.

    You need to choose the weakest consistency level that meets this requirement. Which level should you choose?
  fr: |
    Wingtip Toys possède une application distribuée à l'échelle mondiale qui utilise Azure Cosmos DB. Un utilisateur qui publie un commentaire doit voir ce commentaire immédiatement au cours de la même session. Les autres utilisateurs peuvent le voir un peu plus tard.

    Vous devez choisir le niveau de cohérence le plus faible qui répond à cette exigence. Quel niveau devez-vous choisir ?
body:
  options:
    - id: a
      text: { en: "Strong", fr: "Fort (Strong)" }
    - id: b
      text: { en: "Bounded staleness", fr: "Obsolescence limitée (Bounded staleness)" }
    - id: c
      text: Session
    - id: d
      text: { en: "Eventual", fr: "Éventuel (Eventual)" }
answer: { optionId: c }
explanation:
  correct:
    en: Session consistency guarantees that, within one client session, a user reads their own writes, while other sessions may receive the data a little later. It is the most widely used level and it is weaker than Strong and Bounded staleness.
    fr: La cohérence Session garantit que, dans une même session cliente, un utilisateur lit ses propres écritures, tandis que les autres sessions peuvent recevoir les données un peu plus tard. C'est le niveau le plus utilisé, et il est plus faible que les niveaux Fort (Strong) et Obsolescence limitée (Bounded staleness).
  options:
    a:
      en: Strong makes every read return the most recent write for all users; it meets the need but it is the strongest level, not the weakest one that fits.
      fr: Le niveau Fort (Strong) fait renvoyer à chaque lecture l'écriture la plus récente pour tous les utilisateurs ; il répond au besoin, mais c'est le niveau le plus fort et non le plus faible qui convienne.
    b:
      en: Bounded staleness limits how far reads can lag behind writes for everyone; it is a stronger level than Session.
      fr: Le niveau Obsolescence limitée (Bounded staleness) limite le retard des lectures sur les écritures pour tout le monde ; c'est un niveau plus fort que Session.
    d:
      en: Eventual gives no guarantee that a user immediately reads what they have just written.
      fr: Le niveau Éventuel (Eventual) ne garantit pas qu'un utilisateur lise immédiatement ce qu'il vient d'écrire.
references:
  - title: "Consistency levels in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: "Describe Azure Cosmos DB"
