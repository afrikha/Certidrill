id: dp900-3a-table-dd-point-range
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application reads data from a table in Azure Table storage.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application lit des données dans une table du Stockage Table Azure.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When the application gives the partition key and the row key to identify a single row, it performs [[q1]].

      When the application fetches a contiguous block of rows in a partition, it performs [[q2]].
    fr: |
      Quand l'application fournit la clé de partition et la clé de ligne pour identifier une seule ligne, elle effectue [[q1]].

      Quand l'application lit un bloc contigu de lignes dans une partition, elle effectue [[q2]].
  slots:
    - id: q1
      options:
        - { id: range, text: { en: "a range query", fr: "une requête de plage" } }
        - { id: point, text: { en: "a point query", fr: "une requête de point" } }
        - { id: join, text: { en: "a join query", fr: "une requête de jointure" } }
    - id: q2
      options:
        - { id: range, text: { en: "a range query", fr: "une requête de plage" } }
        - { id: point, text: { en: "a point query", fr: "une requête de point" } }
        - { id: join, text: { en: "a join query", fr: "une requête de jointure" } }
answer:
  values: { q1: point, q2: range }
explanation:
  correct:
    en: The key scheme of Table storage allows two fast kinds of queries. A point query identifies a single row by its partition key and its row key. A range query fetches a contiguous block of rows in a partition, which is efficient because the rows of a partition are stored in row key order.
    fr: Le schéma de clés du Stockage Table permet deux types de requêtes rapides. Une requête de point identifie une seule ligne par sa clé de partition et sa clé de ligne. Une requête de plage lit un bloc contigu de lignes dans une partition, ce qui est efficace car les lignes d'une partition sont stockées dans l'ordre des clés de ligne.
  options:
    join:
      en: A join combines rows of several tables in a relational database; Table storage has no joins.
      fr: Une jointure combine des lignes de plusieurs tables dans une base de données relationnelle ; le Stockage Table n'a pas de jointures.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
