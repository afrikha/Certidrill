id: dp900-3b-yn-service-basics
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Cosmos DB, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Cosmos DB, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Cosmos DB is a platform as a service (PaaS) offering in which Microsoft manages the servers, the patching and the backups.
        fr: Azure Cosmos DB est une offre de plateforme en tant que service (PaaS) dans laquelle Microsoft gère les serveurs, les correctifs et les sauvegardes.
    - id: s2
      text:
        en: Azure Cosmos DB is a relational database service because Azure Cosmos DB for NoSQL is queried with a SQL-like language.
        fr: Azure Cosmos DB est un service de base de données relationnelle, car Azure Cosmos DB for NoSQL s'interroge avec un langage proche de SQL.
    - id: s3
      text:
        en: By default, Azure Cosmos DB automatically indexes every property of the items in a container.
        fr: Par défaut, Azure Cosmos DB indexe automatiquement toutes les propriétés des éléments d'un conteneur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Cosmos DB is a fully managed PaaS service; Microsoft handles server provisioning, patching, updates and backups. It is a NoSQL service, even though its native API uses a SQL-like syntax to query JSON documents. By default, every property of every item is indexed automatically, with no schema or index to declare.
    fr: Azure Cosmos DB est un service PaaS entièrement managé ; Microsoft se charge du provisionnement des serveurs, des correctifs, des mises à jour et des sauvegardes. C'est un service NoSQL, même si son API native utilise une syntaxe proche de SQL pour interroger des documents JSON. Par défaut, toutes les propriétés de tous les éléments sont indexées automatiquement, sans schéma ni index à déclarer.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Overview of indexing in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-overview
