id: dp900-3b-api-compat-benefit
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Azure Cosmos DB offers APIs for MongoDB, Apache Cassandra and Apache Gremlin in addition to its native API.

    What is the main benefit of these APIs?
  fr: |
    Azure Cosmos DB propose des API pour MongoDB, Apache Cassandra et Apache Gremlin en plus de son API native.

    Quel est le principal avantage de ces API ?
body:
  options:
    - id: a
      text: { en: "The data is stored in relational tables that support joins", fr: "Les données sont stockées dans des tables relationnelles qui prennent en charge les jointures" }
    - id: b
      text: { en: "Each open-source engine runs on virtual machines that you manage", fr: "Chaque moteur open source s'exécute sur des machines virtuelles que vous gérez" }
    - id: c
      text: { en: "Applications keep the drivers, tools and skills of those databases", fr: "Les applications conservent les pilotes, les outils et les compétences de ces bases de données" }
    - id: d
      text: { en: "The throughput no longer has to be expressed in request units", fr: "Le débit n'a plus besoin d'être exprimé en unités de requête" }
answer: { optionId: c }
explanation:
  correct:
    en: These APIs are compatible with the wire protocol of well-known databases. Existing drivers, tools and skills therefore keep working, often with nothing more than a new connection string, while the data benefits from the managed, globally distributed Azure Cosmos DB service.
    fr: Ces API sont compatibles avec le protocole filaire de bases de données connues. Les pilotes, les outils et les compétences existants continuent donc de servir, souvent avec une simple nouvelle chaîne de connexion, tandis que les données profitent du service Azure Cosmos DB managé et distribué à l'échelle mondiale.
  options:
    a:
      en: All these APIs remain NoSQL; none of them turns Azure Cosmos DB into a relational database.
      fr: Toutes ces API restent NoSQL ; aucune ne transforme Azure Cosmos DB en base de données relationnelle.
    b:
      en: Azure Cosmos DB is a fully managed service; it exposes compatible APIs and you manage no virtual machine or database engine.
      fr: Azure Cosmos DB est un service entièrement managé ; il expose des API compatibles et vous ne gérez ni machine virtuelle ni moteur de base de données.
    d:
      en: Whatever the API, the capacity of Azure Cosmos DB is expressed in request units per second.
      fr: Quelle que soit l'API, la capacité d'Azure Cosmos DB s'exprime en unités de requête par seconde.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "What is Azure Cosmos DB for MongoDB?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/mongodb/introduction
