id: dp900-3a-blob-order-tier-cost
objective: "3.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You compare the cost of storing a blob in different access tiers of Azure Blob Storage. The following list contains four access tiers.

    Which four tiers should you select, from the highest storage cost to the lowest? To answer, move the appropriate tiers from the list of tiers to the answer area and arrange them in the correct order.
  fr: |
    Vous comparez le coût du stockage d'un objet blob dans différents niveaux d'accès du Stockage Blob Azure. La liste suivante contient quatre niveaux d'accès.

    Quels sont les quatre niveaux à sélectionner, du coût de stockage le plus élevé au plus bas ? Pour répondre, déplacez les niveaux appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cold, text: { en: "Cold", fr: "Froid (Cold)" } }
    - { id: ssd, text: "SSD" }
    - { id: archive, text: "Archive" }
    - { id: hot, text: { en: "Hot", fr: "Chaud (Hot)" } }
    - { id: hdd, text: "HDD" }
    - { id: cool, text: { en: "Cool", fr: "Froid (Cool)" } }
answer:
  sequence: [ hot, cool, cold, archive ]
explanation:
  correct:
    en: |
      The hot, cool, cold and archive tiers are the access tiers in the list. The storage cost decreases from hot to cool, then cold, then archive, while the cost of access increases in the same order. Hot suits frequently accessed data, and archive suits data that is almost never read.
    fr: |
      Les niveaux Hot, Cool, Cold et Archive sont les niveaux d'accès de la liste. Le coût de stockage diminue du niveau chaud (Hot) au niveau froid (Cool), puis froid (Cold), puis archive (Archive), tandis que le coût d'accès augmente dans le même ordre. Le niveau chaud (Hot) convient aux données consultées fréquemment, et le niveau archive (Archive) aux données presque jamais lues.
  options:
    ssd: { en: "SSD is a media tier of Azure Files, not an access tier of a blob.", fr: "SSD est un niveau de support d'Azure Files, pas un niveau d'accès d'un objet blob." }
    hdd: { en: "HDD is a media tier of Azure Files, not an access tier of a blob.", fr: "HDD est un niveau de support d'Azure Files, pas un niveau d'accès d'un objet blob." }
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
