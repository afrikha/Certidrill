id: dp900-3b-global-catalog
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs an online store for customers in America, Europe and Asia. The product catalog is stored as JSON items whose attributes differ from one product to another. The application must read and write data in a few milliseconds in the region nearest to each customer.

    Which Azure service should you recommend?
  fr: |
    Tailspin Toys exploite une boutique en ligne pour des clients d'Amérique, d'Europe et d'Asie. Le catalogue de produits est stocké sous forme d'éléments JSON dont les attributs diffèrent d'un produit à l'autre. L'application doit lire et écrire les données en quelques millisecondes dans la région la plus proche de chaque client.

    Quel service Azure devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure SQL Database
    - id: b
      text: { en: "Azure Blob storage", fr: "Stockage Blob Azure" }
    - id: c
      text: Azure Cosmos DB
    - id: d
      text: Azure Files
answer: { optionId: c }
explanation:
  correct:
    en: Azure Cosmos DB is a fully managed NoSQL database that stores JSON items without imposing a schema. It replicates the data to the Azure regions you choose and, with multi-region writes, lets the application read and write in the nearest region with a latency of a few milliseconds.
    fr: Azure Cosmos DB est une base de données NoSQL entièrement managée qui stocke des éléments JSON sans imposer de schéma. Elle réplique les données dans les régions Azure de votre choix et, avec les écritures multirégions, permet à l'application de lire et d'écrire dans la région la plus proche avec une latence de quelques millisecondes.
  options:
    a:
      en: Azure SQL Database is a relational service with a fixed schema of tables and columns; it does not fit items whose attributes vary and is not built for writes in every region.
      fr: Azure SQL Database est un service relationnel au schéma fixe de tables et de colonnes ; il ne convient pas à des éléments dont les attributs varient et n'est pas conçu pour des écritures dans chaque région.
    b:
      en: Azure Blob storage stores unstructured objects such as images or documents; it is not a database that queries items by their properties.
      fr: Le Stockage Blob Azure stocke des objets non structurés tels que des images ou des documents ; ce n'est pas une base de données qui interroge des éléments selon leurs propriétés.
    d:
      en: Azure Files provides file shares for applications and virtual machines, not a database for JSON items.
      fr: Azure Files fournit des partages de fichiers aux applications et aux machines virtuelles, pas une base de données pour des éléments JSON.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Common Azure Cosmos DB use cases"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/use-cases
