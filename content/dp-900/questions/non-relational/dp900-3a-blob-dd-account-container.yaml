id: dp900-3a-blob-dd-account-container
objective: "3.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Blob Storage, related blobs are grouped together in [[grp]].

      To use Azure Blob Storage, you first create [[acct]].
    fr: |
      Dans le Stockage Blob Azure, les objets blob associés sont regroupés dans [[grp]].

      Pour utiliser le Stockage Blob Azure, vous créez d'abord [[acct]].
  slots:
    - id: grp
      options:
        - { id: share, text: { en: "a file share", fr: "un partage de fichiers" } }
        - { id: part, text: { en: "a partition", fr: "une partition" } }
        - { id: cont, text: { en: "a container", fr: "un conteneur" } }
        - { id: tbl, text: { en: "a table", fr: "une table" } }
    - id: acct
      options:
        - { id: sa, text: { en: "a storage account", fr: "un compte de stockage" } }
        - { id: cosmos, text: { en: "an Azure Cosmos DB account", fr: "un compte Azure Cosmos DB" } }
        - { id: sqlsrv, text: { en: "an Azure SQL logical server", fr: "un serveur logique Azure SQL" } }
answer:
  values: { grp: cont, acct: sa }
explanation:
  correct:
    en: Blob Storage has three levels. A storage account provides the namespace, containers in the account group related blobs, and each blob belongs to a container. File shares and tables are other services of a storage account.
    fr: "Le Stockage Blob comporte trois niveaux. Un compte de stockage fournit l'espace de noms, des conteneurs du compte regroupent les objets blob associés, et chaque objet blob appartient à un conteneur. Les partages de fichiers et les tables sont d'autres services d'un compte de stockage."
  options:
    part:
      en: Partitions group the rows of a table in Azure Table storage, not blobs.
      fr: Les partitions regroupent les lignes d'une table du Stockage Table Azure, pas des objets blob.
references:
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
