id: dp900-3b-serverless-idle
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an internal application that uses Azure Cosmos DB in a single Azure region. The application is used a few hours each month, at unpredictable times. The company wants to pay only for the request units that the operations consume, without reserving any capacity.

    Which throughput option should you choose?
  fr: |
    Northwind Traders possède une application interne qui utilise Azure Cosmos DB dans une seule région Azure. L'application sert quelques heures par mois, à des moments imprévisibles. L'entreprise veut payer uniquement les unités de requête consommées par les opérations, sans réserver de capacité.

    Quelle option de débit devez-vous choisir ?
body:
  options:
    - id: a
      text: { en: "Provisioned throughput dedicated to the container", fr: "Débit provisionné dédié au conteneur" }
    - id: b
      text: { en: "Provisioned throughput shared at the database level", fr: "Débit provisionné partagé au niveau de la base de données" }
    - id: c
      text: { en: "Serverless", fr: "Sans serveur (serverless)" }
    - id: d
      text: { en: "Autoscale provisioned throughput", fr: "Débit provisionné avec mise à l'échelle automatique (autoscale)" }
answer: { optionId: c }
explanation:
  correct:
    en: With serverless, you provision nothing and you are billed for the request units that the operations consume. It is the option intended for intermittent, unpredictable traffic with long idle periods, and its single-region limit is not a problem here.
    fr: Avec le mode sans serveur, vous ne provisionnez rien et vous êtes facturé pour les unités de requête consommées par les opérations. C'est l'option prévue pour un trafic intermittent et imprévisible avec de longues périodes d'inactivité, et sa limite à une seule région n'est pas gênante ici.
  options:
    a:
      en: Dedicated provisioned throughput reserves RU/s for the container and is billed whether or not the application uses it.
      fr: Le débit provisionné dédié réserve des RU/s pour le conteneur et est facturé que l'application l'utilise ou non.
    b:
      en: Shared throughput is still reserved capacity, set on the database and shared by its containers.
      fr: Le débit partagé reste une capacité réservée, définie sur la base de données et partagée par ses conteneurs.
    d:
      en: Autoscale follows the demand below a maximum, but it is provisioned throughput; capacity is still reserved and billed during idle periods.
      fr: La mise à l'échelle automatique suit la demande sous un maximum, mais c'est un débit provisionné ; une capacité reste réservée et facturée pendant les périodes d'inactivité.
references:
  - title: "Azure Cosmos DB serverless account type"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
