id: dp900-3a-files-share-access-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso creates an SMB file share named **share1** in Azure Files. Contoso has two offices and several virtual machines in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un partage de fichiers SMB nommé **share1** dans Azure Files. Contoso possède deux bureaux et plusieurs machines virtuelles dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Employees in the two offices can mount share1 at the same time.
        fr: Les employés des deux bureaux peuvent monter share1 en même temps.
    - id: s2
      text:
        en: Only the virtual machines that run in Azure can mount share1.
        fr: Seules les machines virtuelles exécutées dans Azure peuvent monter share1.
    - id: s3
      text:
        en: Contoso must deploy Azure File Sync on a Windows server before employees can mount share1.
        fr: Contoso doit déployer Azure File Sync sur un serveur Windows avant que les employés puissent monter share1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: An Azure file share can be mounted concurrently by clients in the cloud and on-premises, so the employees of both offices and the virtual machines can all use share1. No additional software is required to mount a share.
    fr: "Un partage de fichiers Azure peut être monté simultanément par des clients dans le cloud et en local : les employés des deux bureaux et les machines virtuelles peuvent donc tous utiliser share1. Aucun logiciel supplémentaire n'est nécessaire pour monter un partage."
  options:
    s2:
      en: On-premises computers can mount the share too, not only Azure virtual machines.
      fr: Les ordinateurs locaux peuvent aussi monter le partage, pas seulement les machines virtuelles Azure.
    s3:
      en: Azure File Sync is optional. It caches a share on Windows servers, but a share can be mounted directly.
      fr: Azure File Sync est facultatif. Il met un partage en cache sur des serveurs Windows, mais un partage peut être monté directement.
references:
  - title: What is Azure Files?
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
