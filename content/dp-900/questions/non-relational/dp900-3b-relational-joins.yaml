id: dp900-3b-relational-joins
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is building an inventory application. The data follows a fixed schema of about forty tables linked by foreign keys, and most queries join many of these tables.

    Which Azure service should you recommend?
  fr: |
    Adatum crée une application de gestion des stocks. Les données suivent un schéma fixe d'une quarantaine de tables reliées par des clés étrangères, et la plupart des requêtes joignent un grand nombre de ces tables.

    Quel service Azure devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure Cosmos DB
    - id: b
      text: Azure SQL Database
    - id: c
      text: { en: "Azure Table storage", fr: "Stockage Table Azure" }
    - id: d
      text: { en: "Azure Blob storage", fr: "Stockage Blob Azure" }
answer: { optionId: b }
explanation:
  correct:
    en: A fixed schema, foreign keys and queries that join many tables describe a relational workload. Azure SQL Database is the relational service of this list; Microsoft recommends the Azure SQL family rather than Azure Cosmos DB for applications that depend on complex multi-table joins.
    fr: Un schéma fixe, des clés étrangères et des requêtes qui joignent de nombreuses tables décrivent une charge de travail relationnelle. Azure SQL Database est le service relationnel de cette liste ; Microsoft recommande la famille Azure SQL plutôt qu'Azure Cosmos DB pour les applications qui reposent sur des jointures complexes entre plusieurs tables.
  options:
    a:
      en: Azure Cosmos DB is a NoSQL service designed for flexible schemas and low latency at scale; it is a poor fit for applications built on complex joins between many tables.
      fr: Azure Cosmos DB est un service NoSQL conçu pour les schémas souples et la faible latence à grande échelle ; il convient mal aux applications bâties sur des jointures complexes entre de nombreuses tables.
    c:
      en: Azure Table storage is a key-value store without foreign keys or joins.
      fr: Le Stockage Table Azure est un magasin clé-valeur sans clés étrangères ni jointures.
    d:
      en: Azure Blob storage stores unstructured objects; it has no tables and no query engine for joins.
      fr: Le Stockage Blob Azure stocke des objets non structurés ; il n'a ni tables ni moteur de requête pour les jointures.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Azure Cosmos DB - Database for the AI Era"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/introduction
