id: dp900-3a-blob-lifecycle-cold-reports
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores monthly reports as block blobs in the hot tier. A report is read every day during its first month. After that, it is read about once a year, but it must open immediately when a user requests it. Reports are kept for seven years.

    You need to minimize the storage cost without any manual operation.

    What should you create?
  fr: |
    Fabrikam stocke des rapports mensuels sous forme d'objets blob de blocs dans le niveau chaud (Hot). Un rapport est lu chaque jour pendant son premier mois. Ensuite, il est lu environ une fois par an, mais il doit s'ouvrir immédiatement quand un utilisateur le demande. Les rapports sont conservés sept ans.

    Vous devez réduire au minimum le coût de stockage, sans aucune opération manuelle.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "A lifecycle management policy that moves blobs to the cool tier 30 days after their last modification", fr: "Une stratégie de gestion du cycle de vie qui déplace les objets blob vers le niveau froid (Cool) 30 jours après leur dernière modification" }
    - id: b
      text: { en: "A lifecycle management policy that moves blobs to the archive tier 30 days after their last modification", fr: "Une stratégie de gestion du cycle de vie qui déplace les objets blob vers le niveau archive (Archive) 30 jours après leur dernière modification" }
    - id: c
      text: { en: "A lifecycle management policy that moves blobs to the cold tier 30 days after their last modification", fr: "Une stratégie de gestion du cycle de vie qui déplace les objets blob vers le niveau froid (Cold) 30 jours après leur dernière modification" }
    - id: d
      text: { en: "A lifecycle management policy that deletes blobs 30 days after their last modification", fr: "Une stratégie de gestion du cycle de vie qui supprime les objets blob 30 jours après leur dernière modification" }
answer: { optionId: c }
explanation:
  correct:
    en: The cold tier is meant for rarely accessed data that must still be retrieved immediately, and its storage cost is lower than that of the cool tier. A lifecycle management policy moves the blobs automatically according to the number of days since their last modification, so no manual operation is needed.
    fr: "Le niveau froid (Cold) est destiné aux données rarement consultées qui doivent rester récupérables immédiatement, et son coût de stockage est inférieur à celui du niveau froid (Cool). Une stratégie de gestion du cycle de vie déplace automatiquement les objets blob selon le nombre de jours écoulés depuis leur dernière modification : aucune opération manuelle n'est nécessaire."
  options:
    a:
      en: The cool tier keeps the reports immediately readable, but its storage cost is higher than that of the cold tier.
      fr: Le niveau froid (Cool) garde les rapports lisibles immédiatement, mais son coût de stockage est supérieur à celui du niveau froid (Cold).
    b:
      en: Archived blobs are offline and must be rehydrated, which can take hours; the reports would not open immediately.
      fr: Les objets blob archivés sont hors connexion et doivent être réhydratés, ce qui peut prendre des heures ; les rapports ne s'ouvriraient pas immédiatement.
    d:
      en: The reports must be kept for seven years, so they can't be deleted after 30 days.
      fr: Les rapports doivent être conservés sept ans, ils ne peuvent donc pas être supprimés au bout de 30 jours.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
