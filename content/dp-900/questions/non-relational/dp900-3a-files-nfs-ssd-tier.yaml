id: dp900-3a-files-nfs-ssd-tier
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs Linux servers that must mount an Azure file share by using the NFS protocol.

    Which media tier can Tailspin Toys choose when it creates the share?
  fr: |
    Tailspin Toys exécute des serveurs Linux qui doivent monter un partage de fichiers Azure avec le protocole NFS.

    Quel niveau de support Tailspin Toys peut-elle choisir quand elle crée le partage ?
body:
  options:
    - { id: a, text: { en: "The HDD tier only", fr: "Le niveau HDD uniquement" } }
    - { id: b, text: { en: "The SSD tier only", fr: "Le niveau SSD uniquement" } }
    - { id: c, text: { en: "Either the HDD tier or the SSD tier", fr: "Le niveau HDD ou le niveau SSD, au choix" } }
answer: { optionId: b }
explanation:
  correct:
    en: To create an NFS share in Azure Files, you must use the SSD tier. Access to the share is then controlled through a private endpoint or a service endpoint in a virtual network.
    fr: Pour créer un partage NFS dans Azure Files, vous devez utiliser le niveau SSD. L'accès au partage se contrôle ensuite par un point de terminaison privé ou un point de terminaison de service dans un réseau virtuel.
  options:
    a:
      en: The HDD tier is available for SMB shares; it doesn't support NFS shares.
      fr: Le niveau HDD est disponible pour les partages SMB ; il ne prend pas en charge les partages NFS.
    c:
      en: The choice between HDD and SSD exists for SMB shares only; NFS requires SSD.
      fr: Le choix entre HDD et SSD n'existe que pour les partages SMB ; NFS exige SSD.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
