id: dp900-3a-files-reason-vs-blob
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team must choose between Azure Files and Azure Blob Storage to store the files of an application.

    Which requirement leads the team to choose Azure Files?
  fr: |
    Une équipe doit choisir entre Azure Files et le Stockage Blob Azure pour stocker les fichiers d'une application.

    Quelle exigence conduit l'équipe à choisir Azure Files ?
body:
  options:
    - id: a
      text: { en: "Files that are rarely read must move to an offline tier at the lowest storage cost.", fr: "Les fichiers rarement lus doivent passer dans un niveau hors connexion au coût de stockage le plus bas." }
    - id: b
      text: { en: "Folders must carry POSIX permissions for an analytics platform such as Azure Databricks.", fr: "Les dossiers doivent porter des autorisations POSIX pour une plateforme d'analytique comme Azure Databricks." }
    - id: c
      text: { en: "Log files must accept new entries at their end only, without any other change.", fr: "Les fichiers journaux ne doivent accepter de nouvelles entrées qu'à leur fin, sans aucune autre modification." }
    - id: d
      text: { en: "Windows and Linux computers must mount the storage as a network share over SMB.", fr: "Des ordinateurs Windows et Linux doivent monter le stockage comme un partage réseau en SMB." }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Files exposes file shares over the SMB protocol, which Windows, Linux and macOS use to mount a share like any network share. An application that expects shared file storage therefore works without being rewritten.
    fr: Azure Files expose des partages de fichiers avec le protocole SMB, que Windows, Linux et macOS utilisent pour monter un partage comme n'importe quel partage réseau. Une application qui attend un stockage de fichiers partagé fonctionne donc sans être réécrite.
  options:
    a:
      en: The offline archive tier is an access tier of Blob Storage.
      fr: Le niveau archive (Archive), hors connexion, est un niveau d'accès du Stockage Blob.
    b:
      en: Directories with POSIX-compliant ACLs for analytics come from the hierarchical namespace of Blob Storage (Azure Data Lake Storage Gen2).
      fr: Les répertoires dotés d'ACL conformes à POSIX pour l'analytique proviennent de l'espace de noms hiérarchique du Stockage Blob (Azure Data Lake Storage Gen2).
    c:
      en: Append-only data is the purpose of append blobs in Blob Storage.
      fr: Les données en ajout seul sont l'objet des objets blob d'ajout du Stockage Blob.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: What is Azure Files?
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
