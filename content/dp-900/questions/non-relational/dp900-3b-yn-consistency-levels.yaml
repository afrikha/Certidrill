id: dp900-3b-yn-consistency-levels
objective: "3.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum replicates the data of an Azure Cosmos DB account to several regions and must choose a consistency level.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum réplique les données d'un compte Azure Cosmos DB dans plusieurs régions et doit choisir un niveau de cohérence.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the Eventual level, a read can return data that is not the most recent.
        fr: Avec le niveau Éventuel (Eventual), une lecture peut renvoyer des données qui ne sont pas les plus récentes.
    - id: s2
      text:
        en: Of the five consistency levels, Strong offers the highest availability.
        fr: Parmi les cinq niveaux de cohérence, le niveau Fort (Strong) offre la disponibilité la plus élevée.
    - id: s3
      text:
        en: With the Bounded staleness level, Adatum configures the maximum lag of reads behind writes.
        fr: Avec le niveau Obsolescence limitée (Bounded staleness), Adatum configure le retard maximal des lectures sur les écritures.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Eventual is the weakest level; replicas converge over time, so a read can return stale data, in exchange for the highest availability. Strong guarantees that every read returns the most recent write, at the price of higher write latency and lower availability during failures. Bounded staleness keeps reads behind writes by at most a configured interval, expressed as a number of versions or a time.
    fr: Le niveau Éventuel (Eventual) est le plus faible ; les réplicas convergent avec le temps, si bien qu'une lecture peut renvoyer des données périmées, en échange de la disponibilité la plus élevée. Le niveau Fort (Strong) garantit que chaque lecture renvoie l'écriture la plus récente, au prix d'une latence d'écriture plus élevée et d'une disponibilité moindre en cas de panne. Le niveau Obsolescence limitée (Bounded staleness) maintient les lectures en retard sur les écritures d'un intervalle configuré au plus, exprimé en nombre de versions ou en durée.
references:
  - title: "Consistency levels in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
