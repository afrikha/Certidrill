id: dp900-3a-files-dd-protocols
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Azure Files supports two network file sharing protocols.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Azure Files prend en charge deux protocoles de partage de fichiers réseau.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[p1]] is commonly used across Windows, Linux and macOS.

      [[p2]] is used by Linux clients and isn't supported on Windows.
    fr: |
      [[p1]] est couramment utilisé sous Windows, Linux et macOS.

      [[p2]] est utilisé par les clients Linux et n'est pas pris en charge sous Windows.
  slots:
    - id: p1
      options:
        - { id: nfs, text: "NFS" }
        - { id: sftp, text: "SFTP" }
        - { id: smb, text: "SMB" }
    - id: p2
      options:
        - { id: nfs, text: "NFS" }
        - { id: sftp, text: "SFTP" }
        - { id: smb, text: "SMB" }
answer:
  values: { p1: smb, p2: nfs }
explanation:
  correct:
    en: Server Message Block (SMB) file shares are commonly used across multiple operating systems, namely Windows, Linux and macOS. Network File System (NFS) shares are used by Linux clients and aren't supported on Windows.
    fr: Les partages de fichiers SMB (Server Message Block) sont couramment utilisés sur plusieurs systèmes d'exploitation, à savoir Windows, Linux et macOS. Les partages NFS (Network File System) sont utilisés par les clients Linux et ne sont pas pris en charge sous Windows.
  options:
    sftp:
      en: SFTP is a file transfer protocol that Azure Blob Storage supports; it is not one of the two protocols of Azure Files.
      fr: SFTP est un protocole de transfert de fichiers pris en charge par le Stockage Blob Azure ; il ne fait pas partie des deux protocoles d'Azure Files.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: What is Azure Files?
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
