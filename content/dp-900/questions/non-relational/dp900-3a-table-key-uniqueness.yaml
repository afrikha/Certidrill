id: dp900-3a-table-key-uniqueness
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A table in Azure Table storage contains a row whose partition key is `Lyon` and whose row key is `D-001`.

    Which statement about the rows that can be added to the table is true?
  fr: |
    Une table du Stockage Table Azure contient une ligne dont la clé de partition est `Lyon` et dont la clé de ligne est `D-001`.

    Quelle affirmation sur les lignes qui peuvent être ajoutées à la table est vraie ?
body:
  options:
    - id: a
      text: { en: "No other row of the table can have the partition key `Lyon`.", fr: "Aucune autre ligne de la table ne peut avoir la clé de partition `Lyon`." }
    - id: b
      text: { en: "No other row of the table can have the row key `D-001`.", fr: "Aucune autre ligne de la table ne peut avoir la clé de ligne `D-001`." }
    - id: c
      text: { en: "A row with the partition key `Paris` can have the row key `D-001`.", fr: "Une ligne de clé de partition `Paris` peut avoir la clé de ligne `D-001`." }
    - id: d
      text: { en: "A second row `Lyon` / `D-001` is accepted if its other columns differ.", fr: "Une seconde ligne `Lyon` / `D-001` est acceptée si ses autres colonnes diffèrent." }
answer: { optionId: c }
explanation:
  correct:
    en: The unique key of a row is the combination of its partition key and its row key. A row key only has to be unique inside its partition, so the same row key can exist in the partition `Paris`. Many rows can share the partition key `Lyon`, since that is how related rows are grouped.
    fr: "La clé unique d'une ligne est la combinaison de sa clé de partition et de sa clé de ligne. Une clé de ligne ne doit être unique que dans sa partition : la même clé de ligne peut donc exister dans la partition `Paris`. De nombreuses lignes peuvent partager la clé de partition `Lyon`, puisque c'est ainsi que les lignes associées sont regroupées."
  options:
    a:
      en: Rows that share a partition key are stored together in the same partition; the value is not unique to one row.
      fr: Les lignes qui partagent une clé de partition sont stockées ensemble dans la même partition ; la valeur n'est pas propre à une seule ligne.
    b:
      en: The row key must be unique in its partition only, not in the whole table.
      fr: La clé de ligne ne doit être unique que dans sa partition, pas dans toute la table.
    d:
      en: Two rows can't have the same partition key and the same row key, whatever their other columns contain.
      fr: Deux lignes ne peuvent pas avoir la même clé de partition et la même clé de ligne, quel que soit le contenu de leurs autres colonnes.
references:
