id: dp900-3a-blob-lifecycle-actions
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a lifecycle management policy for the blobs of a storage account.

    Which two actions can the policy perform automatically?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer une stratégie de gestion du cycle de vie pour les objets blob d'un compte de stockage.

    Quelles sont les deux actions que la stratégie peut effectuer automatiquement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Rehydrate a blob from the archive tier when an application tries to read it", fr: "Réhydrater un objet blob du niveau archive (Archive) quand une application tente de le lire" }
    - id: b
      text: { en: "Move a blob to a cooler tier a set number of days after its last modification", fr: "Déplacer un objet blob vers un niveau plus froid un nombre de jours défini après sa dernière modification" }
    - id: c
      text: { en: "Replicate a blob to a secondary region as soon as it is modified", fr: "Répliquer un objet blob vers une région secondaire dès qu'il est modifié" }
    - id: d
      text: { en: "Delete a blob that has not been modified for a set number of days", fr: "Supprimer un objet blob qui n'a pas été modifié depuis un nombre de jours défini" }
    - id: e
      text: { en: "Set POSIX permissions on a folder when a blob is added to it", fr: "Définir des autorisations POSIX sur un dossier quand un objet blob y est ajouté" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A lifecycle management policy contains rules based on the age of the blobs, such as the number of days since the last modification. Its actions move blobs from hot to cool, cold and archive as they are used less, and delete outdated blobs.
    fr: Une stratégie de gestion du cycle de vie contient des règles fondées sur l'âge des objets blob, par exemple le nombre de jours écoulés depuis la dernière modification. Ses actions déplacent les objets blob du niveau chaud (Hot) vers les niveaux froid (Cool), froid (Cold) et archive (Archive) à mesure qu'ils sont moins utilisés, et suppriment les objets blob obsolètes.
  options:
    a:
      en: A policy can't rehydrate an archived blob; you change the tier of the blob yourself, then wait for the rehydration.
      fr: Une stratégie ne peut pas réhydrater un objet blob archivé ; vous changez vous-même le niveau de l'objet blob, puis vous attendez la réhydratation.
    c:
      en: Replication to a secondary region comes from the redundancy option of the storage account (GRS or GZRS), not from a lifecycle policy.
      fr: La réplication vers une région secondaire dépend de l'option de redondance du compte de stockage (GRS ou GZRS), pas d'une stratégie de cycle de vie.
    e:
      en: Folder permissions come from the ACLs of a hierarchical namespace; lifecycle rules only change tiers and delete blobs.
      fr: Les autorisations sur les dossiers proviennent des ACL d'un espace de noms hiérarchique ; les règles de cycle de vie ne font que changer de niveau et supprimer des objets blob.
references:
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
