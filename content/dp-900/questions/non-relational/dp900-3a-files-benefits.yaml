id: dp900-3a-files-benefits
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware replaces the file shares of its on-premises servers with Azure Files.

    Which two benefits does Litware obtain?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware remplace les partages de fichiers de ses serveurs locaux par Azure Files.

    Quels sont les deux avantages obtenus par Litware ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The hardware costs and the maintenance of file servers are eliminated.", fr: "Les coûts de matériel et la maintenance des serveurs de fichiers sont éliminés." }
    - id: b
      text: { en: "The content of the files can be combined by using SQL join queries.", fr: "Le contenu des fichiers peut être combiné par des requêtes SQL avec jointures." }
    - id: c
      text: { en: "Each file is stored as a row that is identified by a partition key.", fr: "Chaque fichier est stocké comme une ligne identifiée par une clé de partition." }
    - id: d
      text: { en: "The storage of the files is highly available and scales in the cloud.", fr: "Le stockage des fichiers est hautement disponible et évolue dans le cloud." }
    - id: e
      text: { en: "Each share is reserved for one connected computer at a time.", fr: "Chaque partage est réservé à un seul ordinateur connecté à la fois." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Hosting file shares in Azure removes the hardware costs and the maintenance overhead of file servers, and it provides highly available and scalable cloud storage for the files.
    fr: Héberger des partages de fichiers dans Azure supprime les coûts de matériel et la charge de maintenance des serveurs de fichiers, et fournit un stockage cloud hautement disponible et évolutif pour les fichiers.
  options:
    b:
      en: Azure Files stores files; SQL queries with joins belong to relational databases.
      fr: Azure Files stocke des fichiers ; les requêtes SQL avec jointures relèvent des bases de données relationnelles.
    c:
      en: Rows identified by a partition key and a row key describe Azure Table storage.
      fr: Des lignes identifiées par une clé de partition et une clé de ligne décrivent le Stockage Table Azure.
    e:
      en: A share is made to be used by many users and applications at the same time.
      fr: Un partage est fait pour être utilisé par de nombreux utilisateurs et applications en même temps.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
