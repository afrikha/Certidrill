id: dp900-3b-autoscale-regions
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has an application whose Azure Cosmos DB data must be replicated to West Europe, East US and Southeast Asia. Traffic is low at night and very high during the day. The capacity must follow the demand without manual intervention, up to a maximum that Proseware sets.

    Which throughput option should you choose?
  fr: |
    Proseware possède une application dont les données Azure Cosmos DB doivent être répliquées dans les régions West Europe, East US et Southeast Asia. Le trafic est faible la nuit et très élevé le jour. La capacité doit suivre la demande sans intervention manuelle, jusqu'à un maximum fixé par Proseware.

    Quelle option de débit devez-vous choisir ?
body:
  options:
    - id: a
      text: { en: "Serverless", fr: "Sans serveur (serverless)" }
    - id: b
      text: { en: "Autoscale provisioned throughput", fr: "Débit provisionné avec mise à l'échelle automatique (autoscale)" }
    - id: c
      text: { en: "Manual provisioned throughput dedicated to each container", fr: "Débit provisionné manuel dédié à chaque conteneur" }
    - id: d
      text: { en: "Manual provisioned throughput shared at the database level", fr: "Débit provisionné manuel partagé au niveau de la base de données" }
answer: { optionId: b }
explanation:
  correct:
    en: With autoscale, you set a maximum number of RU/s and Azure Cosmos DB adjusts the capacity below it according to the demand. Autoscale is provisioned throughput, so the account can replicate its data to several regions.
    fr: Avec la mise à l'échelle automatique, vous fixez un nombre maximal de RU/s et Azure Cosmos DB ajuste la capacité en dessous selon la demande. C'est un débit provisionné ; le compte peut donc répliquer ses données dans plusieurs régions.
  options:
    a:
      en: Serverless also follows the demand, but a serverless account runs in a single Azure region; it does not meet the three-region requirement.
      fr: Le mode sans serveur suit lui aussi la demande, mais un compte sans serveur s'exécute dans une seule région Azure ; il ne répond pas à l'exigence des trois régions.
    c:
      en: Manual throughput keeps a fixed number of RU/s until someone changes it; it does not follow the demand by itself.
      fr: Le débit manuel conserve un nombre fixe de RU/s jusqu'à ce que quelqu'un le modifie ; il ne suit pas la demande de lui-même.
    d:
      en: Sharing a fixed throughput between the containers of a database does not make it vary with the traffic.
      fr: Partager un débit fixe entre les conteneurs d'une base de données ne le fait pas varier avec le trafic.
references:
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
  - title: "Azure Cosmos DB serverless account type"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
