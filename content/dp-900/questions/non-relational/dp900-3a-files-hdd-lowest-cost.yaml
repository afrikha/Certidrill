id: dp900-3a-files-hdd-lowest-cost
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys creates an Azure file share for documents that are opened occasionally. High throughput is not required, and the cost must be as low as possible.

    Which media tier should Wingtip Toys choose for the share?
  fr: |
    Wingtip Toys crée un partage de fichiers Azure pour des documents ouverts occasionnellement. Un débit élevé n'est pas nécessaire, et le coût doit être le plus bas possible.

    Quel niveau de support Wingtip Toys doit-elle choisir pour le partage ?
body:
  options:
    - { id: a, text: "SSD" }
    - { id: b, text: "HDD" }
    - { id: c, text: "Archive" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Files offers two media tiers. The HDD tier uses hard disk-based hardware and costs less; the SSD tier uses solid-state disks, offers greater throughput and is charged at a higher rate. Without a throughput requirement, HDD is the economical choice.
    fr: "Azure Files propose deux niveaux de support. Le niveau HDD utilise du matériel à base de disques durs et coûte moins cher ; le niveau SSD utilise des disques SSD, offre un débit plus élevé et est facturé à un tarif plus élevé. Sans exigence de débit, HDD est le choix économique."
  options:
    a:
      en: SSD gives greater throughput, which isn't needed here, at a higher rate.
      fr: SSD offre un débit plus élevé, inutile ici, à un tarif plus élevé.
    c:
      en: Archive is an access tier of Azure Blob Storage, not a media tier of Azure Files.
      fr: Archive est un niveau d'accès du Stockage Blob Azure, pas un niveau de support d'Azure Files.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
