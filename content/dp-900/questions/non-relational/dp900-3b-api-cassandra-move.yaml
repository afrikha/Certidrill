id: dp900-3b-api-cassandra-move
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs an application on an Apache Cassandra cluster in its own datacenter. The company wants to move the data to a fully managed Azure Cosmos DB account and keep the Cassandra drivers that the application uses, with minimal code changes.

    Which Azure Cosmos DB API should you use?
  fr: |
    Northwind Traders exécute une application sur un cluster Apache Cassandra dans son propre centre de données. L'entreprise veut déplacer les données vers un compte Azure Cosmos DB entièrement managé et conserver les pilotes Cassandra que l'application utilise, avec un minimum de modifications du code.

    Quelle API Azure Cosmos DB devez-vous utiliser ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for Table
    - id: b
      text: Azure Cosmos DB for MongoDB
    - id: c
      text: Azure Cosmos DB for Apache Cassandra
    - id: d
      text: Azure Cosmos DB for NoSQL
answer: { optionId: c }
explanation:
  correct:
    en: Azure Cosmos DB for Apache Cassandra is compatible with the Cassandra wire protocol and with CQL. Existing Cassandra drivers and tools keep working, often with only a new connection string, and Azure manages the infrastructure, patching and backups.
    fr: Azure Cosmos DB for Apache Cassandra est compatible avec le protocole filaire Cassandra et avec le langage CQL. Les pilotes et les outils Cassandra existants continuent de fonctionner, souvent avec une simple nouvelle chaîne de connexion, et Azure gère l'infrastructure, les correctifs et les sauvegardes.
  options:
    a:
      en: Azure Cosmos DB for Table is compatible with Azure Table storage applications, not with Cassandra drivers.
      fr: Azure Cosmos DB for Table est compatible avec les applications du Stockage Table Azure, pas avec les pilotes Cassandra.
    b:
      en: Azure Cosmos DB for MongoDB speaks the MongoDB wire protocol; the application would have to be rewritten.
      fr: Azure Cosmos DB for MongoDB utilise le protocole filaire MongoDB ; l'application devrait être réécrite.
    d:
      en: Azure Cosmos DB for NoSQL uses its own SDKs and JSON documents; the Cassandra drivers do not work with it.
      fr: Azure Cosmos DB for NoSQL utilise ses propres kits SDK et des documents JSON ; les pilotes Cassandra ne fonctionnent pas avec lui.
references:
  - title: "What is Azure Cosmos DB for Apache Cassandra?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/cassandra/introduction
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
