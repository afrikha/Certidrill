id: dp900-3a-blob-uses-access-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Blob Storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Stockage Blob Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Blob Storage is optimized for storing massive amounts of unstructured data.
        fr: Le Stockage Blob Azure est optimisé pour stocker d'énormes quantités de données non structurées.
    - id: s2
      text:
        en: Applications can read blobs over HTTP or HTTPS.
        fr: Les applications peuvent lire des objets blob en HTTP ou en HTTPS.
    - id: s3
      text:
        en: You must define the columns of a container before you upload blobs to it.
        fr: Vous devez définir les colonnes d'un conteneur avant d'y charger des objets blob.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Blob Storage is an object store for unstructured data, that is, data that doesn't follow a particular model, such as text or binary files. Blobs are reached over HTTP or HTTPS through the storage API. A container only groups related blobs.
    fr: Le Stockage Blob est un magasin d'objets pour les données non structurées, c'est-à-dire des données qui ne suivent pas de modèle particulier, comme des fichiers texte ou binaires. Les objets blob sont accessibles en HTTP ou en HTTPS par l'API de stockage. Un conteneur ne fait que regrouper des objets blob associés.
  options:
    s3:
      en: A container has no schema and no columns; it accepts blobs of any content.
      fr: Un conteneur n'a ni schéma ni colonnes ; il accepte des objets blob de tout contenu.
references:
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
