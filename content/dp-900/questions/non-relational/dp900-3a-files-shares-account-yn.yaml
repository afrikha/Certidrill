id: dp900-3a-files-shares-account-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Files, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Files, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A storage account can contain only one file share.
        fr: Un compte de stockage ne peut contenir qu'un seul partage de fichiers.
    - id: s2
      text:
        en: You can set a quota to limit the size of a file share.
        fr: Vous pouvez définir un quota pour limiter la taille d'un partage de fichiers.
    - id: s3
      text:
        en: A general-purpose v2 storage account can contain both file shares and blob containers.
        fr: Un compte de stockage à usage général v2 peut contenir à la fois des partages de fichiers et des conteneurs d'objets blob.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Azure Files storage is created in a storage account, and the data of the account can be distributed across any number of file shares. A quota limits the size of each share. A general-purpose v2 account is the standard account type for blobs, file shares, queues and tables.
    fr: Le stockage Azure Files se crée dans un compte de stockage, et les données du compte peuvent être réparties entre un nombre quelconque de partages de fichiers. Un quota limite la taille de chaque partage. Un compte à usage général v2 est le type de compte standard pour les objets blob, les partages de fichiers, les files d'attente et les tables.
  options:
    s1:
      en: A storage account can hold any number of file shares, within its capacity.
      fr: Un compte de stockage peut contenir un nombre quelconque de partages de fichiers, dans la limite de sa capacité.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
