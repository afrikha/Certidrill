id: dp900-3a-table-device-data-service
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a web application that must store information about millions of devices in a storage account. The devices don't all have the same data fields, no joins are needed, and the application retrieves each device by its key. The cost must be low.

    Which Azure service should Adatum use?
  fr: |
    Adatum possède une application web qui doit stocker des informations sur des millions d'appareils dans un compte de stockage. Les appareils n'ont pas tous les mêmes champs de données, aucune jointure n'est nécessaire, et l'application récupère chaque appareil par sa clé. Le coût doit être faible.

    Quel service Azure Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: b, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: c, text: "Azure Files" }
    - { id: d, text: "Azure SQL Database" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Table storage is a NoSQL service of a storage account that stores key/value items in tables. The columns can vary from one row to another, and a row is found quickly by its key, which suits flexible datasets such as device information.
    fr: Le Stockage Table Azure est un service NoSQL d'un compte de stockage qui stocke des éléments clé/valeur dans des tables. Les colonnes peuvent varier d'une ligne à l'autre, et une ligne se retrouve rapidement par sa clé, ce qui convient à des jeux de données flexibles comme des informations sur des appareils.
  options:
    b:
      en: Blob Storage holds unstructured objects such as images or documents; it doesn't look up items made of data fields by a key.
      fr: Le Stockage Blob contient des objets non structurés comme des images ou des documents ; il ne recherche pas par clé des éléments composés de champs de données.
    c:
      en: Azure Files provides file shares, not a store of items with data fields.
      fr: Azure Files fournit des partages de fichiers, pas un magasin d'éléments dotés de champs de données.
    d:
      en: Azure SQL Database is relational, with the same columns for every row of a table, and it isn't a service of a storage account.
      fr: "Azure SQL Database est relationnelle, avec les mêmes colonnes pour toutes les lignes d'une table, et ce n'est pas un service d'un compte de stockage."
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
