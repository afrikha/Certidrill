id: dp900-3a-blob-dnd-blob-types
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each piece of data to the type of blob that suits it.

    To answer, drag the appropriate blob type to each piece of data. Each blob type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque donnée au type d'objet blob qui lui convient.

    Pour répondre, faites glisser le type d'objet blob approprié vers chaque donnée. Chaque type d'objet blob peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: block, text: { en: "Block blob", fr: "Objet blob de blocs" } }
    - { id: page, text: { en: "Page blob", fr: "Objet blob de pages" } }
    - { id: append, text: { en: "Append blob", fr: "Objet blob d'ajout" } }
  targets:
    - id: t1
      text: { en: "An audit log to which an application continually adds new entries", fr: "Un journal d'audit auquel une application ajoute sans cesse de nouvelles entrées" }
    - id: t2
      text: { en: "The virtual disk of a virtual machine, with random read and write operations", fr: "Le disque virtuel d'une machine virtuelle, avec des opérations de lecture et d'écriture aléatoires" }
    - id: t3
      text: { en: "A video file that is uploaded once, then streamed to viewers", fr: "Un fichier vidéo chargé une seule fois, puis diffusé en streaming aux spectateurs" }
answer:
  mapping: { t1: append, t2: page, t3: block }
explanation:
  correct:
    en: An append blob is optimized for append operations, because blocks are only added to its end, which suits logs. A page blob is made of fixed-size pages for random reads and writes, and Azure uses page blobs for virtual machine disks. A block blob is best for discrete, large binary objects that change infrequently, such as a video.
    fr: "Un objet blob d'ajout est optimisé pour les opérations d'ajout, car les blocs ne s'ajoutent qu'à sa fin, ce qui convient aux journaux. Un objet blob de pages est composé de pages de taille fixe pour des lectures et écritures aléatoires, et Azure utilise des objets blob de pages pour les disques des machines virtuelles. Un objet blob de blocs convient surtout aux objets binaires distincts et volumineux qui changent rarement, comme une vidéo."
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
