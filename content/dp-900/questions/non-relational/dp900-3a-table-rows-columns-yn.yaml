id: dp900-3a-table-rows-columns-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Table storage, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Stockage Table Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each item is a row whose columns hold the data fields of the item.
        fr: Chaque élément est une ligne dont les colonnes contiennent les champs de données de l'élément.
    - id: s2
      text:
        en: A storage account can contain several tables.
        fr: Un compte de stockage peut contenir plusieurs tables.
    - id: s3
      text:
        en: Azure Table storage is designed to store large video files.
        fr: Le Stockage Table Azure est conçu pour stocker de gros fichiers vidéo.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Azure Table storage uses tables of key/value data items; each item is a row that contains columns for its data fields. A storage account can contain any number of tables, up to its capacity. Large binary files such as videos belong in Blob Storage.
    fr: Le Stockage Table Azure utilise des tables d'éléments de données clé/valeur ; chaque élément est une ligne qui contient des colonnes pour ses champs de données. Un compte de stockage peut contenir un nombre quelconque de tables, dans la limite de sa capacité. Les gros fichiers binaires comme les vidéos relèvent du Stockage Blob.
  options:
    s3:
      en: Videos are unstructured data, stored as block blobs in Azure Blob Storage.
      fr: Les vidéos sont des données non structurées, stockées sous forme d'objets blob de blocs dans le Stockage Blob Azure.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
