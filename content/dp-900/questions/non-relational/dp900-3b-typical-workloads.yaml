id: dp900-3b-typical-workloads
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two workloads are typical use cases for Azure Cosmos DB?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux charges de travail qui constituent des cas d'usage typiques d'Azure Cosmos DB ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Ingesting high-frequency telemetry from IoT devices for near-real-time processing", fr: "Ingérer la télémétrie à haute fréquence d'appareils IoT pour un traitement en quasi temps réel" }
    - id: b
      text: { en: "Storing the video files that a website streams to its customers", fr: "Stocker les fichiers vidéo qu'un site web diffuse en continu à ses clients" }
    - id: c
      text: { en: "Serving the player profiles and leaderboards of an online game with low latency", fr: "Servir à faible latence les profils de joueurs et les classements d'un jeu en ligne" }
    - id: d
      text: { en: "Aggregating ten years of sales history in a data warehouse for reporting", fr: "Agréger dix ans d'historique des ventes dans un entrepôt de données pour des rapports" }
    - id: e
      text: { en: "Sharing files between virtual machines over the SMB protocol", fr: "Partager des fichiers entre des machines virtuelles avec le protocole SMB" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: IoT telemetry and gaming are two of the scenarios Microsoft lists for Azure Cosmos DB. The service ingests high-frequency device data quickly, and it gives games the low-latency reads and writes that player profiles, leaderboards and in-game statistics need.
    fr: La télémétrie IoT et les jeux font partie des scénarios que Microsoft cite pour Azure Cosmos DB. Le service ingère rapidement des données d'appareils à haute fréquence, et il apporte aux jeux les lectures et les écritures à faible latence dont ont besoin les profils de joueurs, les classements et les statistiques de jeu.
  options:
    b:
      en: Video files are unstructured data; Azure Blob storage is the service designed to store them.
      fr: Les fichiers vidéo sont des données non structurées ; le Stockage Blob Azure est le service conçu pour les stocker.
    d:
      en: A data warehouse is an analytical workload, for which Microsoft recommends Microsoft Fabric rather than Azure Cosmos DB.
      fr: Un entrepôt de données est une charge de travail analytique, pour laquelle Microsoft recommande Microsoft Fabric plutôt qu'Azure Cosmos DB.
    e:
      en: SMB file shares are provided by Azure Files.
      fr: Les partages de fichiers SMB sont fournis par Azure Files.
references:
  - title: "Common Azure Cosmos DB use cases"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/use-cases
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
