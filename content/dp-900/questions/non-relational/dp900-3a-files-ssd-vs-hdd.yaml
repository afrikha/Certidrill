id: dp900-3a-files-ssd-vs-hdd
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You compare the SSD tier of Azure Files with the HDD tier.

    Which two statements about the SSD tier are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez le niveau SSD d'Azure Files au niveau HDD.

    Quelles sont les deux affirmations vraies concernant le niveau SSD ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It is required for every SMB file share.", fr: "Il est obligatoire pour tout partage de fichiers SMB." } }
    - { id: b, text: { en: "It is charged at a higher rate than the HDD tier.", fr: "Il est facturé à un tarif plus élevé que le niveau HDD." } }
    - { id: c, text: { en: "It limits the size of a file to 1 TiB.", fr: "Il limite la taille d'un fichier à 1 Tio." } }
    - { id: d, text: { en: "It requires the hierarchical namespace to be enabled.", fr: "Il exige l'activation de l'espace de noms hiérarchique." } }
    - { id: e, text: { en: "It offers greater throughput than the HDD tier.", fr: "Il offre un débit plus élevé que le niveau HDD." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: The SSD tier stores shares on solid-state disks. It offers greater throughput than the HDD tier, which uses hard disks, and it is charged at a higher rate.
    fr: Le niveau SSD stocke les partages sur des disques SSD. Il offre un débit plus élevé que le niveau HDD, qui utilise des disques durs, et il est facturé à un tarif plus élevé.
  options:
    a:
      en: SMB shares can be created in the HDD tier; it is NFS shares that require the SSD tier.
      fr: Les partages SMB peuvent être créés dans le niveau HDD ; ce sont les partages NFS qui exigent le niveau SSD.
    c:
      en: The maximum size of a single file in Azure Files is 4 TiB.
      fr: La taille maximale d'un fichier dans Azure Files est de 4 Tio.
    d:
      en: The hierarchical namespace is an option of Blob Storage for Azure Data Lake Storage Gen2; it has nothing to do with file shares.
      fr: L'espace de noms hiérarchique est une option du Stockage Blob pour Azure Data Lake Storage Gen2 ; il n'a aucun rapport avec les partages de fichiers.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
