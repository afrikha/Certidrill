id: dp900-3b-yn-global-distribution
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to distribute the data of an Azure Cosmos DB account that uses provisioned throughput to several Azure regions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de distribuer dans plusieurs régions Azure les données d'un compte Azure Cosmos DB qui utilise un débit provisionné.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Fabrikam can add an Azure region to the existing account while the application is running.
        fr: Fabrikam peut ajouter une région Azure au compte existant pendant que l'application fonctionne.
    - id: s2
      text:
        en: To replicate the data to another region, Fabrikam must create a second account and copy the data to it.
        fr: Pour répliquer les données dans une autre région, Fabrikam doit créer un deuxième compte et y copier les données.
    - id: s3
      text:
        en: With multi-region writes, the application can write data in the region nearest to its users.
        fr: Avec les écritures multirégions, l'application peut écrire les données dans la région la plus proche de ses utilisateurs.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Regions can be added to or removed from an Azure Cosmos DB account at any time, without pausing or redeploying the application. The service itself replicates the data to every region of the account, so no second account or copy is needed. With multi-region writes, every region accepts writes as well as reads, so users write to the nearest region.
    fr: Des régions peuvent être ajoutées à un compte Azure Cosmos DB ou en être retirées à tout moment, sans suspendre ni redéployer l'application. Le service réplique lui-même les données dans chaque région du compte ; aucun deuxième compte ni aucune copie ne sont nécessaires. Avec les écritures multirégions, chaque région accepte les écritures en plus des lectures ; les utilisateurs écrivent donc dans la région la plus proche.
references:
  - title: "Distribute your data globally with Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally
