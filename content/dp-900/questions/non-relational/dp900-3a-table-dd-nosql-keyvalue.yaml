id: dp900-3a-table-dd-nosql-keyvalue
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Table storage is a [[type]] storage solution.

      Its tables contain [[model]] data items.
    fr: |
      Le Stockage Table Azure est une solution de stockage [[type]].

      Ses tables contiennent des éléments de données [[model]].
  slots:
    - id: type
      options:
        - { id: rel, text: { en: "relational", fr: "relationnel" } }
        - { id: nosql, text: "NoSQL" }
        - { id: file, text: { en: "file", fr: "de fichiers" } }
    - id: model
      options:
        - { id: graph, text: { en: "graph", fr: "de graphe" } }
        - { id: blob, text: { en: "unstructured binary", fr: "binaires non structurés" } }
        - { id: kv, text: { en: "key/value", fr: "clé/valeur" } }
answer:
  values: { type: nosql, model: kv }
explanation:
  correct:
    en: Azure Table storage is a NoSQL storage solution that uses tables containing key/value data items. Each item is a row that is found by its key and whose columns hold the values.
    fr: Le Stockage Table Azure est une solution de stockage NoSQL qui utilise des tables contenant des éléments de données clé/valeur. Chaque élément est une ligne que l'on retrouve par sa clé et dont les colonnes contiennent les valeurs.
  options:
    rel:
      en: A table in Table storage is not a relational table; it has no fixed schema and no relationships.
      fr: Une table du Stockage Table n'est pas une table relationnelle ; elle n'a ni schéma fixe ni relations.
    blob:
      en: Unstructured binary data is stored as blobs in Azure Blob Storage.
      fr: Les données binaires non structurées sont stockées sous forme d'objets blob dans le Stockage Blob Azure.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
