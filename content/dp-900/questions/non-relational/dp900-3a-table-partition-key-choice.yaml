id: dp900-3a-table-partition-key-choice
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware stores sensor readings in Azure Table storage. Each reading has a device ID, a reading number, a temperature and a humidity level. The application always retrieves the readings of one device at a time.

    Which value should Litware use as the partition key so that the rows that are read together are stored together?
  fr: |
    Litware stocke des relevés de capteurs dans le Stockage Table Azure. Chaque relevé comporte un ID d'appareil, un numéro de relevé, une température et un taux d'humidité. L'application récupère toujours les relevés d'un seul appareil à la fois.

    Quelle valeur Litware doit-elle utiliser comme clé de partition pour que les lignes lues ensemble soient stockées ensemble ?
body:
  options:
    - { id: a, text: { en: "The reading number", fr: "Le numéro de relevé" } }
    - { id: b, text: { en: "The device ID", fr: "L'ID d'appareil" } }
    - { id: c, text: { en: "The temperature", fr: "La température" } }
    - { id: d, text: { en: "The humidity level", fr: "Le taux d'humidité" } }
answer: { optionId: b }
explanation:
  correct:
    en: Partitioning groups related rows according to the partition key, a value chosen to reflect a property that these rows share. With the device ID as the partition key, all the readings of a device are stored together, and a search that includes this key examines only that partition.
    fr: Le partitionnement regroupe les lignes associées selon la clé de partition, une valeur choisie pour refléter une propriété que ces lignes partagent. Avec l'ID d'appareil comme clé de partition, tous les relevés d'un appareil sont stockés ensemble, et une recherche qui inclut cette clé n'examine que cette partition.
  options:
    a:
      en: The reading number distinguishes the readings of a device; it suits the row key, not the partition key.
      fr: Le numéro de relevé distingue les relevés d'un appareil ; il convient à la clé de ligne, pas à la clé de partition.
    c:
      en: Grouping rows by temperature would scatter the readings of a device across many partitions.
      fr: Regrouper les lignes par température disperserait les relevés d'un appareil dans de nombreuses partitions.
    d:
      en: Grouping rows by humidity level would scatter the readings of a device across many partitions.
      fr: Regrouper les lignes par taux d'humidité disperserait les relevés d'un appareil dans de nombreuses partitions.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
