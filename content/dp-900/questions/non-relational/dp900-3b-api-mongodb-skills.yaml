id: dp900-3b-api-mongodb-skills
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The developers of Adatum build their applications with MongoDB drivers and tools. For a new globally distributed application on Azure Cosmos DB, they want to keep using these drivers and their existing skills.

    Which Azure Cosmos DB API should you use?
  fr: |
    Les développeurs d'Adatum créent leurs applications avec les pilotes et les outils MongoDB. Pour une nouvelle application distribuée à l'échelle mondiale sur Azure Cosmos DB, ils veulent continuer à utiliser ces pilotes et leurs compétences existantes.

    Quelle API Azure Cosmos DB devez-vous utiliser ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for NoSQL
    - id: b
      text: Azure Cosmos DB for Apache Cassandra
    - id: c
      text: Azure Cosmos DB for Apache Gremlin
    - id: d
      text: Azure Cosmos DB for MongoDB
answer: { optionId: d }
explanation:
  correct:
    en: Azure Cosmos DB for MongoDB supports the MongoDB wire protocol, so existing MongoDB drivers and tools work with it. The team keeps its skills and gains the globally distributed, request-unit-based model of Azure Cosmos DB.
    fr: Azure Cosmos DB for MongoDB prend en charge le protocole filaire MongoDB ; les pilotes et les outils MongoDB existants fonctionnent donc avec lui. L'équipe conserve ses compétences et gagne le modèle d'Azure Cosmos DB, distribué à l'échelle mondiale et fondé sur les unités de requête.
  options:
    a:
      en: Azure Cosmos DB for NoSQL also stores documents, but it uses its own SDKs and a SQL-like syntax; the MongoDB drivers do not work with it.
      fr: Azure Cosmos DB for NoSQL stocke aussi des documents, mais il utilise ses propres kits SDK et une syntaxe proche de SQL ; les pilotes MongoDB ne fonctionnent pas avec lui.
    b:
      en: Azure Cosmos DB for Apache Cassandra is compatible with Cassandra drivers and CQL, not with MongoDB drivers.
      fr: Azure Cosmos DB for Apache Cassandra est compatible avec les pilotes Cassandra et le langage CQL, pas avec les pilotes MongoDB.
    c:
      en: Azure Cosmos DB for Apache Gremlin is a graph API that is queried with the Gremlin language.
      fr: Azure Cosmos DB for Apache Gremlin est une API de graphe qui s'interroge avec le langage Gremlin.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
  - title: "What is Azure Cosmos DB for MongoDB?"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/mongodb/introduction
