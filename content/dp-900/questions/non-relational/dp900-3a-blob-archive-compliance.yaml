id: dp900-3a-blob-archive-compliance
objective: "3.1.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank must keep scanned contracts for 10 years to meet a legal obligation. The contracts are almost never read, and waiting several hours before a contract can be opened is acceptable.

    Which access tier of Azure Blob Storage gives the lowest storage cost?
  fr: |
    Woodgrove Bank doit conserver des contrats numérisés pendant 10 ans pour respecter une obligation légale. Les contrats ne sont presque jamais lus, et il est acceptable d'attendre plusieurs heures avant de pouvoir ouvrir un contrat.

    Quel niveau d'accès du Stockage Blob Azure offre le coût de stockage le plus bas ?
body:
  options:
    - { id: a, text: { en: "Hot", fr: "Chaud (Hot)" } }
    - { id: b, text: { en: "Cool", fr: "Froid (Cool)" } }
    - { id: c, text: { en: "Cold", fr: "Froid (Cold)" } }
    - { id: d, text: "Archive" }
answer: { optionId: d }
explanation:
  correct:
    en: The archive tier has the lowest storage cost and is intended for historical data that must be kept but is rarely needed. Its drawback, a blob that is offline and takes hours to become readable, is accepted in this scenario.
    fr: Le niveau archive (Archive) a le coût de stockage le plus bas et s'adresse aux données d'historique qu'il faut conserver mais dont on a rarement besoin. Son inconvénient, un objet blob hors connexion qui met des heures à devenir lisible, est accepté dans ce scénario.
  options:
    a:
      en: Hot is for frequently accessed data and has the highest storage cost.
      fr: Le niveau chaud (Hot) s'adresse aux données consultées fréquemment et a le coût de stockage le plus élevé.
    b:
      en: Cool costs less than hot to store, but more than cold and archive.
      fr: Le niveau froid (Cool) coûte moins cher en stockage que le niveau chaud (Hot), mais plus que les niveaux froid (Cold) et archive (Archive).
    c:
      en: Cold keeps the data immediately readable, which is not required here, and its storage cost is higher than that of archive.
      fr: Le niveau froid (Cold) garde les données lisibles immédiatement, ce qui n'est pas demandé ici, et son coût de stockage est supérieur à celui du niveau archive (Archive).
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
