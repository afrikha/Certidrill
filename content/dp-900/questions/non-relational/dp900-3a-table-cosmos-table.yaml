id: dp900-3a-table-cosmos-table
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an application that stores key/value data in Azure Table storage. The bank now needs global distribution and automatic secondary indexes, and the data must keep the same key/value format.

    Which service should Woodgrove Bank use?
  fr: |
    Woodgrove Bank possède une application qui stocke des données clé/valeur dans le Stockage Table Azure. La banque a désormais besoin d'une distribution mondiale et d'index secondaires automatiques, et les données doivent conserver le même format clé/valeur.

    Quel service Woodgrove Bank doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Cosmos DB for MongoDB" }
    - { id: b, text: "Azure Cosmos DB for Table" }
    - { id: c, text: "Azure Data Lake Storage Gen2" }
    - { id: d, text: "Azure Files" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Cosmos DB for Table is a newer service that stores data in the same key/value format as Azure Table storage. It adds higher performance and availability, global distribution and automatic secondary indexes.
    fr: Azure Cosmos DB for Table est un service plus récent qui stocke les données dans le même format clé/valeur que le Stockage Table Azure. Il y ajoute des performances et une disponibilité supérieures, une distribution mondiale et des index secondaires automatiques.
  options:
    a:
      en: Azure Cosmos DB for MongoDB stores documents in the MongoDB format, not the key/value format of tables.
      fr: Azure Cosmos DB for MongoDB stocke des documents au format MongoDB, pas le format clé/valeur des tables.
    c:
      en: Data Lake Storage Gen2 stores files in a hierarchical namespace for analytics; it isn't a key/value store.
      fr: Data Lake Storage Gen2 stocke des fichiers dans un espace de noms hiérarchique pour l'analytique ; ce n'est pas un magasin clé/valeur.
    d:
      en: Azure Files provides file shares, with no key/value model and no secondary indexes.
      fr: Azure Files fournit des partages de fichiers, sans modèle clé/valeur ni index secondaires.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
