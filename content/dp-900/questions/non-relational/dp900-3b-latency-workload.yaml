id: dp900-3b-latency-workload
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Cosmos DB guarantees that reads and writes complete in less than [[latency]] at the 99th percentile. This makes the service a good fit for [[workload]].
    fr: |
      Azure Cosmos DB garantit que les lectures et les écritures se terminent en moins de [[latency]] au 99e centile. Le service convient donc bien [[workload]].
  slots:
    - id: latency
      options:
        - { id: ms10, text: { en: "10 milliseconds", fr: "10 millisecondes" } }
        - { id: ms100, text: { en: "100 milliseconds", fr: "100 millisecondes" } }
        - { id: s1, text: { en: "1 second", fr: "1 seconde" } }
    - id: workload
      options:
        - { id: analytic, text: { en: "large-scale analytical workloads such as data warehouses", fr: "aux charges de travail analytiques à grande échelle telles que les entrepôts de données" } }
        - { id: oper, text: { en: "operational applications such as web, mobile, gaming and IoT", fr: "aux applications opérationnelles telles que le web, le mobile, les jeux et l'IoT" } }
        - { id: files, text: { en: "file shares that replace on-premises file servers", fr: "aux partages de fichiers qui remplacent des serveurs de fichiers locaux" } }
answer:
  values: { latency: ms10, workload: oper }
explanation:
  correct:
    en: Azure Cosmos DB guarantees reads and writes in less than 10 milliseconds at the 99th percentile. This low latency at any scale serves operational applications such as web and mobile applications, games and IoT solutions.
    fr: Azure Cosmos DB garantit des lectures et des écritures en moins de 10 millisecondes au 99e centile. Cette faible latence à n'importe quelle échelle sert les applications opérationnelles telles que les applications web et mobiles, les jeux et les solutions IoT.
  options:
    analytic:
      en: Large-scale analytical workloads are not a target of Azure Cosmos DB; Microsoft recommends Microsoft Fabric for them.
      fr: Les charges de travail analytiques à grande échelle ne sont pas une cible d'Azure Cosmos DB ; Microsoft recommande Microsoft Fabric pour celles-ci.
    files:
      en: File shares are provided by Azure Files; Azure Cosmos DB is a database.
      fr: Les partages de fichiers sont fournis par Azure Files ; Azure Cosmos DB est une base de données.
references:
  - title: "Distribute your data globally with Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
