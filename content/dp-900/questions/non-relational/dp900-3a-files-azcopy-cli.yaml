id: dp900-3a-files-azcopy-cli
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to copy a folder of 20,000 documents from a local computer to an Azure file share. The copy must be started from a script by a command-line utility.

    What should you use?
  fr: |
    Vous devez copier un dossier de 20 000 documents d'un ordinateur local vers un partage de fichiers Azure. La copie doit être lancée depuis un script par un utilitaire en ligne de commande.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
    - { id: b, text: "Azure File Sync" }
    - { id: c, text: "AzCopy" }
    - { id: d, text: { en: "The Azure portal", fr: "Le portail Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: AzCopy is a command-line utility that copies files to and from Azure Storage, including Azure Files. Because it is a command, it can be called from a script.
    fr: AzCopy est un utilitaire en ligne de commande qui copie des fichiers depuis et vers le Stockage Azure, y compris Azure Files. Comme il s'agit d'une commande, un script peut l'appeler.
  options:
    a:
      en: Azure Storage Explorer is a graphical application for working with storage data, not a command-line utility.
      fr: L'Explorateur Stockage Azure est une application graphique pour manipuler les données de stockage, pas un utilitaire en ligne de commande.
    b:
      en: Azure File Sync is a service that keeps a Windows file server synchronized with a share; it isn't a copy command.
      fr: Azure File Sync est un service qui maintient un serveur de fichiers Windows synchronisé avec un partage ; ce n'est pas une commande de copie.
    d:
      en: The portal uploads files interactively in a browser; it can't be run from a script.
      fr: Le portail charge des fichiers de façon interactive dans un navigateur ; il ne peut pas être exécuté depuis un script.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: Introduction to Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
