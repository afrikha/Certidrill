id: dp900-3b-hierarchy-levels
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Cosmos DB, you add Azure regions at the level of the [[region]]. You define the partition key at the level of the [[pk]].
    fr: |
      Dans Azure Cosmos DB, vous ajoutez des régions Azure au niveau [[region]]. Vous définissez la clé de partition au niveau [[pk]].
  slots:
    - id: region
      options:
        - { id: r-account, text: { en: "account", fr: "du compte" } }
        - { id: r-database, text: { en: "database", fr: "de la base de données" } }
        - { id: r-container, text: { en: "container", fr: "du conteneur" } }
        - { id: r-item, text: { en: "item", fr: "de l'élément" } }
    - id: pk
      options:
        - { id: p-account, text: { en: "account", fr: "du compte" } }
        - { id: p-database, text: { en: "database", fr: "de la base de données" } }
        - { id: p-container, text: { en: "container", fr: "du conteneur" } }
        - { id: p-item, text: { en: "item", fr: "de l'élément" } }
answer:
  values: { region: r-account, pk: p-container }
explanation:
  correct:
    en: The account is the top-level Azure resource; regions are added to or removed from the account, and the data of all its databases is replicated to them. The container is the unit of storage and scaling; the partition key, the throughput and the indexing policy are configured on the container.
    fr: Le compte est la ressource Azure de plus haut niveau ; les régions sont ajoutées au compte ou en sont retirées, et les données de toutes ses bases de données y sont répliquées. Le conteneur est l'unité de stockage et de mise à l'échelle ; la clé de partition, le débit et la stratégie d'indexation se configurent sur le conteneur.
  options:
    p-database:
      en: A database is a logical namespace that groups containers; it has no partition key.
      fr: Une base de données est un espace de noms logique qui regroupe des conteneurs ; elle n'a pas de clé de partition.
    p-item:
      en: Each item carries a value for the partition key, but the key itself is chosen for the whole container.
      fr: Chaque élément porte une valeur pour la clé de partition, mais la clé elle-même est choisie pour tout le conteneur.
references:
  - title: "Databases, containers, and items in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model
  - title: "Describe Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/2-describe-azure-cosmos-db
