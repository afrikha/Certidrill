id: dp900-3a-blob-archive-rehydrate
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor asks for a document that is stored as a blob in the archive tier.

    What must you do before the content of the blob can be read?
  fr: |
    Un auditeur demande un document stocké sous forme d'objet blob dans le niveau archive (Archive).

    Que devez-vous faire avant que le contenu de l'objet blob puisse être lu ?
body:
  options:
    - id: a
      text: { en: "Create a lifecycle management policy that moves the blob to the hot tier", fr: "Créer une stratégie de gestion du cycle de vie qui déplace l'objet blob vers le niveau chaud (Hot)" }
    - id: b
      text: { en: "Change the access tier of the blob to hot, cool, or cold", fr: "Changer le niveau d'accès de l'objet blob en Hot, Cool ou Cold" }
    - id: c
      text: { en: "Enable the hierarchical namespace on the storage account", fr: "Activer l'espace de noms hiérarchique sur le compte de stockage" }
    - id: d
      text: { en: "Change the redundancy of the storage account to RA-GRS", fr: "Changer la redondance du compte de stockage en RA-GRS" }
answer: { optionId: b }
explanation:
  correct:
    en: A blob in the archive tier is offline. To retrieve it, you change its access tier to hot, cool, or cold; the blob is then rehydrated, and it can be read only when the rehydration is complete, which can take hours.
    fr: "Un objet blob du niveau archive (Archive) est hors connexion. Pour le récupérer, vous changez son niveau d'accès en Hot, Cool ou Cold ; l'objet blob est alors réhydraté, et il ne peut être lu qu'une fois la réhydratation terminée, ce qui peut prendre des heures."
  options:
    a:
      en: Lifecycle management policies move blobs to cooler tiers or delete them; they can't rehydrate an archived blob to an online tier.
      fr: Les stratégies de gestion du cycle de vie déplacent les objets blob vers des niveaux plus froids ou les suppriment ; elles ne peuvent pas réhydrater un objet blob archivé vers un niveau en ligne.
    c:
      en: The hierarchical namespace organizes blobs in real directories for Azure Data Lake Storage Gen2; it doesn't bring an archived blob online.
      fr: L'espace de noms hiérarchique organise les objets blob dans de vrais répertoires pour Azure Data Lake Storage Gen2 ; il ne remet pas en ligne un objet blob archivé.
    d:
      en: Read access to the secondary region concerns replication between regions; an archived blob stays offline in both regions.
      fr: L'accès en lecture à la région secondaire concerne la réplication entre régions ; un objet blob archivé reste hors connexion dans les deux régions.
references:
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
