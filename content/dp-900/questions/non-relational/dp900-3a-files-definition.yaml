id: dp900-3a-files-definition
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does Azure Files provide?
  fr: |
    Que fournit Azure Files ?
body:
  options:
    - id: a
      text: { en: "Object storage for unstructured data that is read through an API", fr: "Un stockage d'objets pour des données non structurées lues par une API" }
    - id: b
      text: { en: "A NoSQL store of key/value items that are grouped in partitions", fr: "Un magasin NoSQL d'éléments clé/valeur regroupés en partitions" }
    - id: c
      text: { en: "Network file shares in the cloud that many users can access", fr: "Des partages de fichiers réseau dans le cloud accessibles à de nombreux utilisateurs" }
    - id: d
      text: { en: "Block-level storage volumes that are attached to virtual machines", fr: "Des volumes de stockage de niveau bloc attachés à des machines virtuelles" }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Files is a way to create cloud-based network shares, like those found in on-premises organizations, so that documents and other files are available to multiple users and applications at the same time.
    fr: "Azure Files permet de créer des partages réseau dans le cloud, comme ceux que l'on trouve dans les organisations locales : les documents et autres fichiers sont ainsi disponibles pour plusieurs utilisateurs et applications en même temps."
  options:
    a:
      en: This describes Azure Blob Storage.
      fr: Cette description correspond au Stockage Blob Azure.
    b:
      en: This describes Azure Table storage.
      fr: Cette description correspond au Stockage Table Azure.
    d:
      en: This describes Azure managed disks.
      fr: Cette description correspond aux disques managés Azure.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
  - title: Introduction to Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
