id: dp900-3a-files-nfs-upload-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Files, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Files, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Windows clients can mount NFS Azure file shares.
        fr: Les clients Windows peuvent monter des partages de fichiers Azure NFS.
    - id: s2
      text:
        en: You can upload files to an Azure file share by using the Azure portal.
        fr: Vous pouvez charger des fichiers dans un partage de fichiers Azure à l'aide du portail Azure.
    - id: s3
      text:
        en: NFS is the only protocol that Linux clients can use to mount an Azure file share.
        fr: NFS est le seul protocole que les clients Linux peuvent utiliser pour monter un partage de fichiers Azure.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure Files supports two protocols. SMB is commonly used across Windows, Linux and macOS. NFS is used by Linux clients, and NFS Azure file shares aren't supported on Windows. Files can be uploaded with the Azure portal or with the AzCopy utility.
    fr: Azure Files prend en charge deux protocoles. SMB est couramment utilisé sous Windows, Linux et macOS. NFS est utilisé par les clients Linux, et les partages de fichiers Azure NFS ne sont pas pris en charge sous Windows. Les fichiers peuvent être chargés avec le portail Azure ou avec l'utilitaire AzCopy.
  options:
    s1:
      en: NFS shares are for Linux clients; Windows clients use SMB shares.
      fr: Les partages NFS sont destinés aux clients Linux ; les clients Windows utilisent des partages SMB.
    s3:
      en: Linux clients can also mount SMB shares.
      fr: Les clients Linux peuvent aussi monter des partages SMB.
references:
  - title: Explore Azure Files
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/4-azure-files
