id: dp900-3a-table-key-parts
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What makes up the unique key of a row in Azure Table storage?
  fr: |
    De quoi se compose la clé unique d'une ligne dans le Stockage Table Azure ?
body:
  options:
    - { id: a, text: { en: "A primary key and a foreign key", fr: "Une clé primaire et une clé étrangère" } }
    - { id: b, text: { en: "A row key and a timestamp", fr: "Une clé de ligne et un horodatage" } }
    - { id: c, text: { en: "A partition key and a row key", fr: "Une clé de partition et une clé de ligne" } }
    - { id: d, text: { en: "A container name and a blob name", fr: "Un nom de conteneur et un nom d'objet blob" } }
answer: { optionId: c }
explanation:
  correct:
    en: Every row of a table must have a unique key made of two elements. The partition key identifies the partition that contains the row, and the row key is unique to each row in that partition.
    fr: "Chaque ligne d'une table doit avoir une clé unique composée de deux éléments. La clé de partition identifie la partition qui contient la ligne, et la clé de ligne est propre à chaque ligne de cette partition."
  options:
    a:
      en: Primary and foreign keys belong to relational databases; Table storage has no foreign keys.
      fr: Les clés primaires et étrangères relèvent des bases de données relationnelles ; le Stockage Table n'a pas de clés étrangères.
    b:
      en: The timestamp records the last modification of a row; it isn't part of the key.
      fr: L'horodatage enregistre la dernière modification d'une ligne ; il ne fait pas partie de la clé.
    d:
      en: A container and a blob name locate an object in Blob Storage, not a row in a table.
      fr: Un conteneur et un nom d'objet blob localisent un objet dans le Stockage Blob, pas une ligne dans une table.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
