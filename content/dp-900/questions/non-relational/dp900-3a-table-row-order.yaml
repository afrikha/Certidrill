id: dp900-3a-table-row-order
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Azure Table storage, in which order are the rows of the same partition stored?
  fr: |
    Dans le Stockage Table Azure, dans quel ordre les lignes d'une même partition sont-elles stockées ?
body:
  options:
    - { id: a, text: { en: "In the order in which the rows were inserted", fr: "Dans l'ordre d'insertion des lignes" } }
    - { id: b, text: { en: "In the order of the Timestamp values", fr: "Dans l'ordre des valeurs de Timestamp" } }
    - { id: c, text: { en: "In the order of the first data column", fr: "Dans l'ordre de la première colonne de données" } }
    - { id: d, text: { en: "In the order of the row keys", fr: "Dans l'ordre des clés de ligne" } }
answer: { optionId: d }
explanation:
  correct:
    en: Items in the same partition are stored in row key order. When an application adds a row, Azure places it at the correct position, which is what makes it fast to read a contiguous block of rows in a partition.
    fr: "Les éléments d'une même partition sont stockés dans l'ordre des clés de ligne. Quand une application ajoute une ligne, Azure la place à la bonne position ; c'est ce qui rend rapide la lecture d'un bloc contigu de lignes dans une partition."
  options:
    a:
      en: A new row is placed according to its row key, not at the end of the partition.
      fr: Une nouvelle ligne est placée selon sa clé de ligne, pas à la fin de la partition.
    b:
      en: The timestamp only records the last modification; it doesn't order the rows.
      fr: L'horodatage ne fait qu'enregistrer la dernière modification ; il n'ordonne pas les lignes.
    c:
      en: Data columns can vary from one row to another and play no role in the storage order.
      fr: Les colonnes de données peuvent varier d'une ligne à l'autre et ne jouent aucun rôle dans l'ordre de stockage.
references:
  - title: Explore Azure Tables
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/5-azure-tables
