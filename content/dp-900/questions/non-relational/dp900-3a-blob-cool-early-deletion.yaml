id: dp900-3a-blob-cool-early-deletion
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum moves a block blob from the hot tier to the cool tier in a general-purpose v2 storage account. Ten days later, an application deletes the blob.

    What is the consequence?
  fr: |
    Adatum déplace un objet blob de blocs du niveau chaud (Hot) vers le niveau froid (Cool) dans un compte de stockage à usage général v2. Dix jours plus tard, une application supprime l'objet blob.

    Quelle en est la conséquence ?
body:
  options:
    - id: a
      text: { en: "The deletion is refused until the blob has spent 30 days in the cool tier.", fr: "La suppression est refusée tant que l'objet blob n'a pas passé 30 jours dans le niveau froid (Cool)." }
    - id: b
      text: { en: "The blob is moved back to the hot tier before it is deleted.", fr: "L'objet blob est replacé dans le niveau chaud (Hot) avant d'être supprimé." }
    - id: c
      text: { en: "The blob is deleted at no extra cost, as in the hot tier.", fr: "L'objet blob est supprimé sans coût supplémentaire, comme dans le niveau chaud (Hot)." }
    - id: d
      text: { en: "An early deletion charge is billed for the remaining 20 days.", fr: "Des frais de suppression anticipée sont facturés pour les 20 jours restants." }
answer: { optionId: d }
explanation:
  correct:
    en: Data in the cool tier should stay there for at least 30 days. A blob that is deleted or moved earlier is subject to an early deletion charge, prorated to the days that remain, here 30 minus 10.
    fr: "Les données du niveau froid (Cool) doivent y rester au moins 30 jours. Un objet blob supprimé ou déplacé plus tôt est soumis à des frais de suppression anticipée, calculés au prorata des jours restants, ici 30 moins 10."
  options:
    a:
      en: The minimum period is a billing rule; Azure doesn't block the deletion.
      fr: La durée minimale est une règle de facturation ; Azure ne bloque pas la suppression.
    b:
      en: A deletion doesn't change the tier of the blob; only the charge applies.
      fr: Une suppression ne change pas le niveau de l'objet blob ; seuls les frais s'appliquent.
    c:
      en: Only the hot tier has no minimum storage period; cool has 30 days, cold 90 days and archive 180 days.
      fr: "Seul le niveau chaud (Hot) n'a pas de durée minimale de stockage ; elle est de 30 jours pour Cool, 90 jours pour Cold et 180 jours pour Archive."
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Explore Azure blob storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-non-relational-data-services-azure/2-azure-blob-storage
