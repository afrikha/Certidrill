id: dp900-3b-api-sql-rename
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer reads an old article that refers to the "SQL API" of Azure Cosmos DB.

    What is the current name of this API?
  fr: |
    Un développeur lit un ancien article qui mentionne l'« API SQL » d'Azure Cosmos DB.

    Quel est le nom actuel de cette API ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for PostgreSQL
    - id: b
      text: Azure Cosmos DB for NoSQL
    - id: c
      text: Azure Cosmos DB for Table
    - id: d
      text: Azure Cosmos DB for Apache Cassandra
answer: { optionId: b }
explanation:
  correct:
    en: Azure Cosmos DB for NoSQL was previously called the SQL API. The name came from its SQL-like query syntax, but the API stores JSON documents and is not relational.
    fr: Azure Cosmos DB for NoSQL s'appelait auparavant l'API SQL. Ce nom venait de sa syntaxe de requête proche de SQL, mais l'API stocke des documents JSON et n'est pas relationnelle.
  options:
    a:
      en: Azure Cosmos DB for PostgreSQL is a separate relational offering; it is not the former SQL API.
      fr: Azure Cosmos DB for PostgreSQL est une offre relationnelle distincte ; ce n'est pas l'ancienne API SQL.
    c:
      en: Azure Cosmos DB for Table is the key-value API that is compatible with Azure Table storage.
      fr: Azure Cosmos DB for Table est l'API clé-valeur compatible avec le Stockage Table Azure.
    d:
      en: Azure Cosmos DB for Apache Cassandra uses CQL, which resembles SQL, but it was never named the SQL API.
      fr: Azure Cosmos DB for Apache Cassandra utilise le langage CQL, qui ressemble à SQL, mais il ne s'est jamais appelé API SQL.
references:
  - title: "Identify Azure Cosmos DB APIs"
    url: https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/3-cosmos-db-apis
