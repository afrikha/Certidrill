id: dp900-3b-throughput-unit
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which unit do you express the throughput of an Azure Cosmos DB container?
  fr: |
    Dans quelle unité exprimez-vous le débit d'un conteneur Azure Cosmos DB ?
body:
  options:
    - id: a
      text: { en: "Database transaction units (DTUs)", fr: "Unités de transaction de base de données (DTU)" }
    - id: b
      text: { en: "Virtual cores (vCores)", fr: "Cœurs virtuels (vCores)" }
    - id: c
      text: { en: "Input/output operations per second (IOPS)", fr: "Opérations d'entrée/sortie par seconde (IOPS)" }
    - id: d
      text: { en: "Request units per second (RU/s)", fr: "Unités de requête par seconde (RU/s)" }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Cosmos DB expresses throughput in request units per second (RU/s). A request unit is a single measure of the resources an operation needs; reading one 1-KB item by its ID and partition key costs about one RU.
    fr: Azure Cosmos DB exprime le débit en unités de requête par seconde (RU/s). Une unité de requête est une mesure unique des ressources nécessaires à une opération ; lire un élément de 1 Ko par son ID et sa clé de partition coûte environ une RU.
  options:
    a:
      en: DTUs are a purchasing model of Azure SQL Database, not a unit of Azure Cosmos DB.
      fr: Les DTU sont un modèle d'achat d'Azure SQL Database, pas une unité d'Azure Cosmos DB.
    b:
      en: vCores size the compute of services such as Azure SQL Database; the throughput of a container is not expressed in vCores.
      fr: Les vCores dimensionnent le calcul de services tels qu'Azure SQL Database ; le débit d'un conteneur ne s'exprime pas en vCores.
    c:
      en: IOPS measure disk performance. A request unit already combines the processing, memory and I/O that an operation uses.
      fr: Les IOPS mesurent les performances d'un disque. Une unité de requête regroupe déjà le traitement, la mémoire et les E/S utilisés par une opération.
references:
  - title: "Request Units in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
