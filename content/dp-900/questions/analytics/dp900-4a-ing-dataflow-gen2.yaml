id: dp900-4a-ing-dataflow-gen2
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Business analysts at Northwind Traders must build reusable data transformations in Microsoft Fabric through a visual, low-code experience that is based on Power Query. They don't write code.

    What should they use?
  fr: |
    Des analystes métier de Northwind Traders doivent créer des transformations de données réutilisables dans Microsoft Fabric au moyen d'une expérience visuelle, avec peu de code, basée sur Power Query. Ils n'écrivent pas de code.

    Que doivent-ils utiliser ?
body:
  options:
    - { id: a, text: { en: "Dataflows Gen2", fr: "Dataflows Gen2" } }
    - { id: b, text: { en: "Notebooks", fr: "Des notebooks" } }
    - { id: c, text: { en: "OneLake shortcuts", fr: "Des raccourcis OneLake" } }
    - { id: d, text: { en: "Eventstream", fr: "Eventstream" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Dataflows Gen2 in Fabric Data Factory provide a low-code, visual way to define reusable transformation logic with Power Query, without writing code. The result can be loaded into a destination such as a Lakehouse or a Warehouse.
    fr: |
      Les Dataflows Gen2 de Fabric Data Factory offrent un moyen visuel, avec peu de code, de définir une logique de transformation réutilisable avec Power Query, sans écrire de code. Le résultat peut être chargé dans une destination comme un Lakehouse ou un Warehouse.
  options:
    b: { en: "Notebooks are the code-first option: you write PySpark, Python, Scala, R or SQL.", fr: "Les notebooks sont l'option orientée code : vous y écrivez du PySpark, du Python, du Scala, du R ou du SQL." }
    c: { en: "A shortcut references external data without copying it; it doesn't transform data.", fr: "Un raccourci référence des données externes sans les copier ; il ne transforme pas les données." }
    d: { en: "Eventstream ingests and routes real-time streaming events; it isn't the Power Query experience.", fr: "Eventstream ingère et achemine des événements de streaming en temps réel ; ce n'est pas l'expérience Power Query." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Dataflow Gen2?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-overview
