id: dp900-4a-ing-pipeline-statements
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe pipelines in Fabric Data Factory?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent les pipelines de Fabric Data Factory ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A pipeline defines the measures and hierarchies that reports use.", fr: "Un pipeline définit les mesures et les hiérarchies utilisées par les rapports." } }
    - { id: b, text: { en: "A pipeline uses connections to reach its sources and destinations.", fr: "Un pipeline utilise des connexions pour atteindre ses sources et ses destinations." } }
    - { id: c, text: { en: "A pipeline is a live reference to files that stay in external storage.", fr: "Un pipeline est une référence active à des fichiers qui restent dans un stockage externe." } }
    - { id: d, text: { en: "A pipeline is the tenant-wide data lake in which Fabric stores data.", fr: "Un pipeline est le lac de données à l'échelle du locataire dans lequel Fabric stocke les données." } }
    - { id: e, text: { en: "A pipeline can load data, run a stored procedure, and invoke a notebook in one workflow.", fr: "Un pipeline peut charger des données, exécuter une procédure stockée et appeler un notebook dans un même flux de travail." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A pipeline consists of activities that operate on data and uses connections to reach its sources and destinations. Within one workflow it can load data, run stored procedures, invoke notebooks and apply custom logic.
    fr: |
      Un pipeline se compose d'activités qui opèrent sur des données et utilise des connexions pour atteindre ses sources et ses destinations. Dans un même flux de travail, il peut charger des données, exécuter des procédures stockées, appeler des notebooks et appliquer une logique personnalisée.
  options:
    a: { en: "Measures and hierarchies are defined in a semantic model, not in a pipeline.", fr: "Les mesures et les hiérarchies sont définies dans un modèle sémantique, pas dans un pipeline." }
    c: { en: "This describes a OneLake shortcut.", fr: "Cette affirmation décrit un raccourci OneLake." }
    d: { en: "This describes OneLake; a pipeline moves and transforms data but doesn't store it.", fr: "Cette affirmation décrit OneLake ; un pipeline déplace et transforme des données, mais ne les stocke pas." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Data Factory in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-factory-overview
