id: dp900-4a-svc-databricks-scenario
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The data engineers of Wingtip Toys build code-first Apache Spark workloads that must remain portable across several cloud providers. They want an analytics platform that is built on Apache Spark and runs as a managed service in the company's Azure subscription.

    Which service should they use?
  fr: |
    Les ingénieurs de données de Wingtip Toys créent des charges de travail Apache Spark orientées code qui doivent rester portables entre plusieurs fournisseurs de cloud. Ils veulent une plateforme d'analytique bâtie sur Apache Spark qui s'exécute comme un service managé dans l'abonnement Azure de l'entreprise.

    Quel service doivent-ils utiliser ?
body:
  options:
    - { id: a, text: Azure Databricks }
    - { id: b, text: Microsoft Fabric }
    - { id: c, text: Azure Data Factory }
    - { id: d, text: Azure SQL Database }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Databricks is a cloud analytics platform built on Apache Spark for large-scale data engineering, data science and SQL analytics. It runs as a managed service inside your Azure subscription, and it is the choice for code-first Spark workflows and multicloud portability.
    fr: |
      Azure Databricks est une plateforme d'analytique cloud bâtie sur Apache Spark pour l'ingénierie des données, la science des données et l'analytique SQL à grande échelle. Elle s'exécute comme un service managé dans votre abonnement Azure, et c'est le choix adapté aux flux de travail Spark orientés code et à la portabilité entre clouds.
  options:
    b: { en: "Microsoft Fabric is a unified SaaS platform organized around OneLake; it isn't the platform built on Apache Spark that is chosen for code-first workflows and multicloud portability.", fr: "Microsoft Fabric est une plateforme SaaS unifiée organisée autour de OneLake ; ce n'est pas la plateforme bâtie sur Apache Spark que l'on choisit pour des flux de travail orientés code et la portabilité entre clouds." }
    c: { en: "Azure Data Factory orchestrates data integration pipelines; it isn't a Spark development platform.", fr: "Azure Data Factory orchestre des pipelines d'intégration de données ; ce n'est pas une plateforme de développement Spark." }
    d: { en: "Azure SQL Database is a relational database service, not an Apache Spark platform.", fr: "Azure SQL Database est un service de base de données relationnelle, pas une plateforme Apache Spark." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/introduction/
