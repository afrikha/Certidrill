id: dp900-4c-viz-map-geography
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report must let users compare the total sales of each city according to where the city is located.

    Which visual should you use?
  fr: |
    Un rapport doit permettre aux utilisateurs de comparer le total des ventes de chaque ville selon l'endroit où elle se trouve.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Map", fr: "Carte géographique (map)" } }
    - { id: b, text: { en: "Treemap", fr: "Treemap" } }
    - { id: c, text: { en: "Gauge", fr: "Jauge" } }
    - { id: d, text: { en: "Line chart", fr: "Graphique en courbes" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A map displays values at their geographic location, which lets users compare the measure for different areas or places, such as cities or countries/regions."
    fr: "Une carte géographique affiche les valeurs à leur emplacement géographique, ce qui permet de comparer la mesure entre différentes zones ou différents lieux, comme des villes ou des pays/régions."
  options:
    b:
      en: "A treemap shows proportions as nested rectangles; the position of a rectangle has no geographic meaning."
      fr: "Un treemap montre des proportions sous forme de rectangles imbriqués ; la position d'un rectangle n'a aucune signification géographique."
    c:
      en: "A gauge shows the progress of a single value toward a target, not a value for each city."
      fr: "Une jauge montre la progression d'une seule valeur vers un objectif, pas une valeur par ville."
    d:
      en: "A line chart shows a trend, usually over time; it does not place the values on a territory."
      fr: "Un graphique en courbes montre une tendance, en général dans le temps ; il ne situe pas les valeurs sur un territoire."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
