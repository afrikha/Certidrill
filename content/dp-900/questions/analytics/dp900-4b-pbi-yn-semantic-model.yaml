id: dp900-4b-pbi-yn-semantic-model
objective: "4.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Power BI, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Power BI, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single report takes its visuals from several semantic models.
        fr: Un même rapport tire ses visuels de plusieurs modèles sémantiques.
    - id: s2
      text:
        en: Several reports can be built on the same semantic model.
        fr: Plusieurs rapports peuvent être construits sur le même modèle sémantique.
    - id: s3
      text:
        en: In Microsoft Fabric, Power BI reports are stored in workspaces together with other Fabric items, such as lakehouses.
        fr: Dans Microsoft Fabric, les rapports Power BI sont stockés dans des espaces de travail avec d'autres éléments Fabric, comme des lakehouses.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Each report is based on a single semantic model, so all its visuals use that model. In the other direction, a semantic model can be shared by several reports, which then use the same measures and relationships. In Microsoft Fabric, Power BI content lives in shared workspaces, next to the other data engineering and analytics items such as lakehouses and notebooks.
    fr: |
      Chaque rapport repose sur un seul modèle sémantique : tous ses visuels utilisent donc ce modèle. Dans l'autre sens, un modèle sémantique peut être partagé par plusieurs rapports, qui utilisent alors les mêmes mesures et les mêmes relations. Dans Microsoft Fabric, le contenu Power BI réside dans des espaces de travail partagés, à côté des autres éléments d'ingénierie et d'analytique des données comme les lakehouses et les notebooks.
references:
  - title: Power BI service basics
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/service-basic-concepts
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
