id: dp900-4a-store-snowflake-hotarea
objective: "4.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A data warehouse of Wingtip Toys contains the five tables described in the following table.

    Answer each prompt by selecting the appropriate table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un entrepôt de données de Wingtip Toys contient les cinq tables décrites dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la table appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The fact table", fr: "La table de faits" }
    - id: p2
      text: { en: "The table that makes the model a snowflake schema instead of a star schema", fr: "La table qui fait du modèle un schéma en flocon de neige plutôt qu'un schéma en étoile" }
  grid:
    header: [Table, { en: "One row per", fr: "Une ligne par" }, { en: "Columns", fr: "Colonnes" }]
    rows:
      - [{ text: Store, area: store }, { text: { en: "Store", fr: "Magasin" } }, { text: "StoreKey, StoreName, City" }]
      - [{ text: Product, area: product }, { text: { en: "Product", fr: "Produit" } }, { text: "ProductKey, ProductName, CategoryKey" }]
      - [{ text: Sales, area: sales }, { text: { en: "Order line", fr: "Ligne de commande" } }, { text: "DateKey, ProductKey, StoreKey, Quantity, Revenue" }]
      - [{ text: Date, area: date }, { text: { en: "Day", fr: "Jour" } }, { text: "DateKey, Month, Year" }]
      - [{ text: ProductCategory, area: category }, { text: { en: "Product category", fr: "Catégorie de produits" } }, { text: "CategoryKey, CategoryName" }]
answer:
  values: { p1: sales, p2: category }
explanation:
  correct:
    en: |
      Sales holds the numeric values to aggregate (Quantity, Revenue) and the keys of the dimensions, so it is the fact table. Store, Product and Date are dimension tables related directly to Sales, which would form a star schema. ProductCategory is related to the Product dimension table, not to the fact table, in order to represent the product hierarchy: this additional table is what makes the model a snowflake schema.
    fr: |
      Sales contient les valeurs numériques à agréger (Quantity, Revenue) et les clés des dimensions : c'est donc la table de faits. Store, Product et Date sont des tables de dimension liées directement à Sales, ce qui formerait un schéma en étoile. ProductCategory est liée à la table de dimension Product, et non à la table de faits, afin de représenter la hiérarchie des produits : c'est cette table supplémentaire qui fait du modèle un schéma en flocon de neige.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
