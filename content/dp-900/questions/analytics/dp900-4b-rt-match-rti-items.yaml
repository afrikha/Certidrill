id: dp900-4b-rt-match-rti-items
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each requirement to the item of Real-Time Intelligence in Microsoft Fabric that meets it. To answer, drag the appropriate item to each requirement. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence à l'élément de Real-Time Intelligence dans Microsoft Fabric qui y répond. Pour répondre, faites glisser l'élément approprié vers chaque exigence. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: es, text: "Eventstream" }
    - { id: act, text: "Activator" }
    - { id: hub, text: "Real-Time hub" }
    - { id: qs, text: "KQL queryset" }
    - { id: eh, text: "Eventhouse" }
  targets:
    - id: t1
      text:
        en: Discover the data streams of the organization in a central catalog
        fr: Découvrir les flux de données de l'organisation dans un catalogue central
    - id: t2
      text:
        en: Store event and time-series data in KQL databases
        fr: Stocker des données d'événements et de séries chronologiques dans des bases de données KQL
    - id: t3
      text:
        en: Send a notification automatically when a value crosses a threshold
        fr: Envoyer automatiquement une notification quand une valeur franchit un seuil
answer:
  mapping: { t1: hub, t2: eh, t3: act }
explanation:
  correct:
    en: |
      The Real-Time hub is the central catalog in which users find, explore and share the data streams of the organization. An eventhouse stores and analyzes time-based event data in KQL databases. Activator monitors changing data and automatically takes an action, such as sending an email or a Teams message, when a condition is detected. An eventstream ingests and routes events, and a KQL queryset is used to run queries.
    fr: |
      Le Real-Time hub est le catalogue central dans lequel les utilisateurs trouvent, explorent et partagent les flux de données de l'organisation. Un eventhouse stocke et analyse des données d'événements temporelles dans des bases de données KQL. Activator surveille des données qui changent et exécute automatiquement une action, comme l'envoi d'un e-mail ou d'un message Teams, quand une condition est détectée. Un eventstream ingère et route des événements, et un KQL queryset sert à exécuter des requêtes.
references:
  - title: What is Real-Time Intelligence?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
  - title: Introduction to Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/real-time-hub-overview
