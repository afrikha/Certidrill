id: dp900-4b-bs-yn-scope
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Stream processing typically has access only to the most recent data or to a rolling time window.
        fr: Le traitement de flux n'a généralement accès qu'aux données les plus récentes ou à une fenêtre temporelle glissante.
    - id: s2
      text:
        en: A batch job is limited to the data that was received during the last 30 seconds.
        fr: Un travail par lots est limité aux données reçues pendant les 30 dernières secondes.
    - id: s3
      text:
        en: Calculating the total sales of each of the last ten years is a typical task for stream processing.
        fr: Calculer le total des ventes de chacune des dix dernières années est une tâche typique du traitement de flux.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The two approaches differ in data scope. Stream processing usually sees only the most recent data received, or the data of a rolling time window such as the last 30 seconds. A batch job can process all the data of the dataset. An aggregate over ten years of history is therefore a batch task, which also suits complex analytics; stream processing is used for simple responses, aggregates and rolling averages.
    fr: |
      Les deux approches diffèrent par l'étendue des données. Le traitement de flux ne voit en général que les données reçues le plus récemment, ou celles d'une fenêtre temporelle glissante comme les 30 dernières secondes. Un travail par lots peut traiter toutes les données du jeu de données. Un agrégat sur dix ans d'historique est donc une tâche par lots, qui convient aussi à l'analytique complexe ; le traitement de flux sert aux réponses simples, aux agrégats et aux moyennes mobiles.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
