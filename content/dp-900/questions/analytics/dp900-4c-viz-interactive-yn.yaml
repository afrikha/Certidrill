id: dp900-4c-viz-interactive-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A page of a Power BI report contains a column chart of sales by city, a pie chart of sales by product category and a table of sales by product. The report author kept the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une page d'un rapport Power BI contient un histogramme des ventes par ville, un graphique en secteurs des ventes par catégorie de produit et une table des ventes par produit. L'auteur du rapport a conservé les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a user selects the Seattle column in the column chart, the pie chart and the table reflect the Seattle sales.
        fr: Quand un utilisateur sélectionne la colonne Seattle dans l'histogramme, le graphique en secteurs et la table reflètent les ventes de Seattle.
    - id: s2
      text:
        en: The author had to write a DAX formula to link the three visuals to one another.
        fr: L'auteur a dû écrire une formule DAX pour lier les trois visuels entre eux.
    - id: s3
      text:
        en: The author can add a custom visual to the page in addition to the built-in visuals of Power BI.
        fr: L'auteur peut ajouter à la page un visuel personnalisé en plus des visuels intégrés de Power BI.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "In a Power BI report, the visuals of a page that show related data are linked automatically: selecting a category in one visual filters or highlights that category in the others, with no formula to write. Power BI also has an extensive set of built-in visuals that can be extended with custom and third-party visuals."
    fr: "Dans un rapport Power BI, les visuels d'une page qui affichent des données liées sont liés automatiquement : sélectionner une catégorie dans un visuel filtre ou met en surbrillance cette catégorie dans les autres, sans formule à écrire. Power BI dispose aussi d'un vaste ensemble de visuels intégrés qui peut être étendu avec des visuels personnalisés et tiers."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Change How Visuals Interact in a Report
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-reports-visual-interactions
