id: dp900-4a-store-warehouse-scenario
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders wants to analyze sales data that comes from its transactional systems. The data fits a structured schema of tables, and the analysts query it only with SQL.

    Which type of analytical data store should the company use?
  fr: |
    Northwind Traders veut analyser des données de ventes issues de ses systèmes transactionnels. Les données entrent dans un schéma structuré de tables, et les analystes les interrogent uniquement en SQL.

    Quel type de magasin de données analytique l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A data warehouse", fr: "Un entrepôt de données" } }
    - { id: b, text: { en: "A data lake", fr: "Un lac de données" } }
    - { id: c, text: { en: "A key-value store", fr: "Un magasin clé-valeur" } }
    - { id: d, text: { en: "A file share", fr: "Un partage de fichiers" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A data warehouse is a relational database whose schema is optimized for analytics. It is a good choice when transactional data can be organized into a structured schema of tables and queried with SQL.
    fr: |
      Un entrepôt de données est une base de données relationnelle dont le schéma est optimisé pour l'analytique. C'est un bon choix lorsque des données transactionnelles peuvent être organisées dans un schéma structuré de tables et interrogées en SQL.
  options:
    b: { en: "A data lake is a file store queried with engines such as Apache Spark; it suits varied raw data on which no schema is enforced at write time.", fr: "Un lac de données est un magasin de fichiers interrogé avec des moteurs comme Apache Spark ; il convient à des données brutes variées auxquelles aucun schéma n'est imposé à l'écriture." }
    c: { en: "A key-value store retrieves a value from its key; it isn't designed for SQL queries that aggregate tables.", fr: "Un magasin clé-valeur retrouve une valeur à partir de sa clé ; il n'est pas conçu pour des requêtes SQL qui agrègent des tables." }
    d: { en: "A file share stores files for users and applications; it provides no relational tables and no SQL engine.", fr: "Un partage de fichiers stocke des fichiers pour des utilisateurs et des applications ; il n'offre ni tables relationnelles ni moteur SQL." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
