id: dp900-4b-pbi-dd-workspace-model
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Power BI service, [[area]] is a collaborative area in which designers store and manage collections of dashboards and reports.

      Each report is built on [[data]], which defines the measures and relationships that the report uses.
    fr: |
      Dans le service Power BI, [[area]] est une zone de collaboration dans laquelle les concepteurs stockent et gèrent des collections de tableaux de bord et de rapports.

      Chaque rapport est construit sur [[data]], qui définit les mesures et les relations que le rapport utilise.
  slots:
    - id: area
      options:
        - { id: tile, text: { en: "a tile", fr: "une vignette" } }
        - { id: ws, text: { en: "a workspace", fr: "un espace de travail" } }
        - { id: app, text: { en: "an app", fr: "une application" } }
    - id: data
      options:
        - { id: sm, text: { en: "a semantic model", fr: "un modèle sémantique" } }
        - { id: dash, text: { en: "a dashboard", fr: "un tableau de bord" } }
        - { id: pag, text: { en: "a paginated report", fr: "un rapport paginé" } }
answer:
  values: { area: ws, data: sm }
explanation:
  correct:
    en: |
      A workspace is the collaborative area of the Power BI service in which designers store and manage dashboards, reports and, in Microsoft Fabric, other items. A semantic model contains the data of a report and defines the measures, relationships and hierarchies on which the report is built. An app is published from a workspace to distribute content, a dashboard is a page of tiles pinned from reports, and a tile is one pinned visual.
    fr: |
      Un espace de travail est la zone de collaboration du service Power BI dans laquelle les concepteurs stockent et gèrent des tableaux de bord, des rapports et, dans Microsoft Fabric, d'autres éléments. Un modèle sémantique contient les données d'un rapport et définit les mesures, les relations et les hiérarchies sur lesquelles le rapport est construit. Une application se publie à partir d'un espace de travail pour distribuer du contenu, un tableau de bord est une page de vignettes épinglées depuis des rapports, et une vignette est un visuel épinglé.
references:
  - title: Power BI service basics
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/service-basic-concepts
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
