id: dp900-4a-ing-shortcut-s3
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores sales files in Amazon S3. For compliance reasons, the files must stay in Amazon S3 and must not be duplicated. Analysts need to query the files from a lakehouse in Microsoft Fabric.

    What should Adatum use?
  fr: |
    Adatum stocke des fichiers de ventes dans Amazon S3. Pour des raisons de conformité, les fichiers doivent rester dans Amazon S3 et ne doivent pas être dupliqués. Des analystes doivent interroger ces fichiers depuis un lakehouse dans Microsoft Fabric.

    Que doit utiliser Adatum ?
body:
  options:
    - { id: a, text: { en: "Mirroring", fr: "La mise en miroir" } }
    - { id: b, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
    - { id: c, text: { en: "A pipeline with a copy activity", fr: "Un pipeline avec une activité de copie" } }
    - { id: d, text: { en: "A Dataflow Gen2 that loads the lakehouse", fr: "Un Dataflow Gen2 qui charge le lakehouse" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A shortcut is a live reference to data in external storage such as Amazon S3, Azure Data Lake Storage Gen2 or Google Cloud Storage. The data appears in the lakehouse as if it were stored there, with no movement and no duplication, which suits data that must stay in its original location.
    fr: |
      Un raccourci est une référence active à des données situées dans un stockage externe comme Amazon S3, Azure Data Lake Storage Gen2 ou Google Cloud Storage. Les données apparaissent dans le lakehouse comme si elles y étaient stockées, sans déplacement ni duplication, ce qui convient à des données qui doivent rester à leur emplacement d'origine.
  options:
    a: { en: "Mirroring replicates an operational database into OneLake, which creates a second copy of the data.", fr: "La mise en miroir réplique une base de données opérationnelle dans OneLake, ce qui crée une deuxième copie des données." }
    c: { en: "A copy activity writes a copy of the files to the destination, which the requirement forbids.", fr: "Une activité de copie écrit une copie des fichiers dans la destination, ce que l'exigence interdit." }
    d: { en: "A dataflow loads its output into the lakehouse, so the data is duplicated.", fr: "Un dataflow charge son résultat dans le lakehouse : les données sont donc dupliquées." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
