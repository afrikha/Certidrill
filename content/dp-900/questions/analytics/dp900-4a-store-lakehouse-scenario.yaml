id: dp900-4a-store-lakehouse-scenario
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum keeps raw Parquet files in a data lake. Data engineers process the files with Apache Spark. Analysts want to query the same copy of the data as tables by using SQL, with schemas enforced on the tables.

    Which type of analytical data store meets these requirements?
  fr: |
    Adatum conserve des fichiers Parquet bruts dans un lac de données. Des ingénieurs de données traitent les fichiers avec Apache Spark. Des analystes veulent interroger la même copie des données sous forme de tables en SQL, avec des schémas imposés sur les tables.

    Quel type de magasin de données analytique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A data warehouse", fr: "Un entrepôt de données" } }
    - { id: b, text: { en: "A data lakehouse", fr: "Un data lakehouse" } }
    - { id: c, text: { en: "A data lake", fr: "Un lac de données" } }
    - { id: d, text: { en: "A transactional database", fr: "Une base de données transactionnelle" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A data lakehouse combines features of a data lake and of a data warehouse. The data stays as files in the lake, a format such as Delta Lake adds tables that enforce schemas, and a SQL analytics endpoint lets analysts query those tables with SQL while Spark works on the same copy.
    fr: |
      Un data lakehouse combine des fonctionnalités d'un lac de données et d'un entrepôt de données. Les données restent sous forme de fichiers dans le lac, un format comme Delta Lake ajoute des tables qui imposent des schémas, et un point de terminaison d'analytique SQL permet aux analystes d'interroger ces tables en SQL pendant que Spark travaille sur la même copie.
  options:
    a: { en: "A data warehouse is a separate relational database: the data would have to be loaded into it, which creates a second copy.", fr: "Un entrepôt de données est une base de données relationnelle distincte : il faudrait y charger les données, ce qui crée une deuxième copie." }
    c: { en: "A data lake alone applies schemas when the data is read and doesn't enforce them on tables.", fr: "Un lac de données seul applique les schémas à la lecture des données et ne les impose pas sur des tables." }
    d: { en: "A transactional database serves the operations of an application, not Spark processing of Parquet files.", fr: "Une base de données transactionnelle sert les opérations d'une application, pas le traitement de fichiers Parquet par Spark." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
