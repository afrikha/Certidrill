id: dp900-4c-viz-ai-visuals
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the AI-driven visuals of Power BI, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les visuels de Power BI pilotés par l'IA, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The [[s1]] visual identifies the factors that most strongly drive a selected metric.

      The [[s2]] visual generates a written summary of what the visuals of a report show, and updates it when the data changes.
    fr: |
      Le visuel [[s1]] identifie les facteurs qui influencent le plus une métrique sélectionnée.

      Le visuel [[s2]] génère un résumé écrit de ce que montrent les visuels d'un rapport, et le met à jour quand les données changent.
  slots:
    - id: s1
      options:
        - { id: tree, text: { en: "decomposition tree", fr: "Arborescence de décomposition" } }
        - { id: ki, text: { en: "key influencers", fr: "Influenceurs clés" } }
        - { id: sn, text: { en: "smart narrative", fr: "Narration intelligente" } }
        - { id: slicer, text: { en: "slicer", fr: "Segment (slicer)" } }
    - id: s2
      options:
        - { id: tree, text: { en: "decomposition tree", fr: "Arborescence de décomposition" } }
        - { id: ki, text: { en: "key influencers", fr: "Influenceurs clés" } }
        - { id: sn, text: { en: "smart narrative", fr: "Narration intelligente" } }
        - { id: slicer, text: { en: "slicer", fr: "Segment (slicer)" } }
answer:
  values: { s1: ki, s2: sn }
explanation:
  correct:
    en: "The key influencers visual analyzes the data and displays the factors that contribute most to a selected result. A smart narrative adds text that summarizes trends and key takeaways of the visuals, and the text is regenerated as the data changes."
    fr: "Le visuel Influenceurs clés analyse les données et affiche les facteurs qui contribuent le plus à un résultat sélectionné. Une narration intelligente ajoute un texte qui résume les tendances et les points à retenir des visuels, et ce texte est régénéré quand les données changent."
  options:
    tree:
      en: "A decomposition tree lets users drill down into a value across several dimensions; it neither ranks influencing factors nor writes a summary."
      fr: "Une arborescence de décomposition permet d'explorer une valeur selon plusieurs dimensions ; elle ne classe pas les facteurs d'influence et ne rédige pas de résumé."
    slicer:
      en: "A slicer is a filtering control on the report canvas; it does not analyze the data."
      fr: "Un segment est un contrôle de filtrage sur le canevas du rapport ; il n'analyse pas les données."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
