id: dp900-4a-store-fact-dimension-terms
objective: "4.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In a star schema, the numeric values to aggregate, such as quantity and revenue, are stored in a [[t1]] table.

      The entities by which the values are aggregated, such as product and store, are stored in [[t2]] tables.
    fr: |
      Dans un schéma en étoile, les valeurs numériques à agréger, comme la quantité et le chiffre d'affaires, sont stockées dans une table [[t1]].

      Les entités selon lesquelles les valeurs sont agrégées, comme le produit et le magasin, sont stockées dans des tables [[t2]].
  slots:
    - id: t1
      options:
        - { id: dim, text: { en: "dimension", fr: "de dimension" } }
        - { id: fact, text: { en: "fact", fr: "de faits" } }
        - { id: temp, text: { en: "temporary", fr: "temporaire" } }
    - id: t2
      options:
        - { id: dim, text: { en: "dimension", fr: "de dimension" } }
        - { id: fact, text: { en: "fact", fr: "de faits" } }
        - { id: temp, text: { en: "temporary", fr: "temporaires" } }
answer:
  values: { t1: fact, t2: dim }
explanation:
  correct:
    en: |
      In a data warehouse, numeric values are stored in central fact tables. The fact tables are related to dimension tables, which represent the entities by which the data can be aggregated, such as customer, product, store and time.
    fr: |
      Dans un entrepôt de données, les valeurs numériques sont stockées dans des tables de faits centrales. Les tables de faits sont liées à des tables de dimension, qui représentent les entités selon lesquelles les données peuvent être agrégées, comme le client, le produit, le magasin et le temps.
  options:
    temp: { en: "A temporary table holds intermediate results for a session; it isn't a role in a star schema.", fr: "Une table temporaire contient des résultats intermédiaires pour une session ; ce n'est pas un rôle dans un schéma en étoile." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
