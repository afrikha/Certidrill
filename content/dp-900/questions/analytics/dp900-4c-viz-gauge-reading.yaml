id: dp900-4c-viz-gauge-reading
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A Power BI report contains a radial gauge that displays the sales of the quarter on an arc that goes from a minimum value to a maximum value.

    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un rapport Power BI contient une jauge radiale qui affiche les ventes du trimestre sur un arc allant d'une valeur minimale à une valeur maximale.

    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The shaded part of the arc represents [[s1]], and the needle represents [[s2]].
    fr: |
      La partie ombrée de l'arc représente [[s1]], et l'aiguille représente [[s2]].
  slots:
    - id: s1
      options:
        - { id: target, text: { en: "the target value", fr: "la valeur cible" } }
        - { id: progress, text: { en: "the progress toward the goal", fr: "la progression vers l'objectif" } }
        - { id: trend, text: { en: "the trend over time", fr: "la tendance dans le temps" } }
    - id: s2
      options:
        - { id: target, text: { en: "the target value", fr: "la valeur cible" } }
        - { id: progress, text: { en: "the progress toward the goal", fr: "la progression vers l'objectif" } }
        - { id: trend, text: { en: "the trend over time", fr: "la tendance dans le temps" } }
answer:
  values: { s1: progress, s2: target }
explanation:
  correct:
    en: "A radial gauge shows how far a single value has progressed toward a goal. The shading shows the progress made, the value inside the arc is the current value, and the needle marks the target."
    fr: "Une jauge radiale montre où en est une seule valeur par rapport à un objectif. La partie ombrée montre la progression réalisée, la valeur à l'intérieur de l'arc est la valeur actuelle, et l'aiguille marque la cible."
  options:
    trend:
      en: "A gauge shows one value at one moment; a trend over time is shown by a line chart or by the trend axis of a KPI visual."
      fr: "Une jauge montre une valeur à un instant donné ; une tendance dans le temps se montre avec un graphique en courbes ou avec l'axe de tendance d'un visuel KPI."
references:
  - title: Radial Gauge Charts in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-radial-gauge-charts
