id: dp900-4c-model-elements-match
objective: "4.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the element of a Power BI semantic model that it describes.

    To answer, drag the appropriate element to each description. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'élément d'un modèle sémantique Power BI qu'elle décrit.

    Pour répondre, faites glisser l'élément approprié vers chaque description. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fact, text: { en: "Fact table", fr: "Table de faits" } }
    - { id: dim, text: { en: "Dimension table", fr: "Table de dimension" } }
    - { id: meas, text: { en: "Measure", fr: "Mesure" } }
    - { id: hier, text: { en: "Hierarchy", fr: "Hiérarchie" } }
    - { id: rel, text: { en: "Relationship", fr: "Relation" } }
  targets:
    - id: t1
      text: { en: "Links the key of the Customer table to the matching column of the Sales table.", fr: "Lie la clé de la table Customer à la colonne correspondante de la table Sales." }
    - id: t2
      text: { en: "Groups days into months and months into years, so that users can drill up or drill down.", fr: "Regroupe les jours en mois et les mois en années, pour que les utilisateurs puissent explorer vers le haut ou vers le bas." }
    - id: t3
      text: { en: "A DAX formula, such as an average order amount, whose result is calculated when a report queries the model.", fr: "Une formule DAX, comme un montant moyen de commande, dont le résultat est calculé quand un rapport interroge le modèle." }
answer:
  mapping: { t1: rel, t2: hier, t3: meas }
explanation:
  correct:
    en: "A relationship links the unique key of a dimension table to the matching column of a fact table, so that the values can be filtered and grouped by the attributes of the dimension. A hierarchy defines the levels of a dimension, such as day, month and year, for drilling up and down. A measure is a calculation written in DAX; its result is not stored but calculated at query time. Fact and dimension tables are tables of data, not links, levels or formulas."
    fr: "Une relation lie la clé unique d'une table de dimension à la colonne correspondante d'une table de faits, pour que les valeurs puissent être filtrées et regroupées selon les attributs de la dimension. Une hiérarchie définit les niveaux d'une dimension, comme le jour, le mois et l'année, pour explorer vers le haut ou vers le bas. Une mesure est un calcul écrit en DAX ; son résultat n'est pas stocké mais calculé au moment de la requête. Les tables de faits et de dimension sont des tables de données, pas des liens, des niveaux ou des formules."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
