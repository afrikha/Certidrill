id: dp900-4c-model-hierarchy-drill
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A column chart in a Power BI report shows the total sales by year. Users must be able to drill down from a year to its quarters, and then to its months, in the same visual.

    What should the semantic model contain?
  fr: |
    Un histogramme d'un rapport Power BI affiche le total des ventes par année. Les utilisateurs doivent pouvoir explorer vers le bas, d'une année à ses trimestres, puis à ses mois, dans le même visuel.

    Que doit contenir le modèle sémantique ?
body:
  options:
    - { id: a, text: { en: "A measure for each quarter and for each month", fr: "Une mesure pour chaque trimestre et pour chaque mois" } }
    - { id: b, text: { en: "A relationship between two fact tables", fr: "Une relation entre deux tables de faits" } }
    - { id: c, text: { en: "A hierarchy in the time dimension", fr: "Une hiérarchie dans la dimension de temps" } }
    - { id: d, text: { en: "A fact table that stores the totals of each month", fr: "Une table de faits qui stocke les totaux de chaque mois" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A hierarchy defines the levels of a dimension, here year, quarter and month. It lets users drill up or drill down through the aggregated values, and the model calculates the total of each level when the report asks for it."
    fr: "Une hiérarchie définit les niveaux d'une dimension, ici l'année, le trimestre et le mois. Elle permet aux utilisateurs d'explorer vers le haut ou vers le bas les valeurs agrégées, et le modèle calcule le total de chaque niveau quand le rapport le demande."
  options:
    a:
      en: "One sales measure is enough: it is aggregated at each level of the hierarchy, so no measure per period is needed."
      fr: "Une seule mesure de ventes suffit : elle est agrégée à chaque niveau de la hiérarchie, sans mesure par période."
    b:
      en: "Relationships link dimension tables to a fact table; a link between two fact tables does not create drill-down levels."
      fr: "Les relations lient les tables de dimension à une table de faits ; un lien entre deux tables de faits ne crée pas de niveaux d'exploration."
    d:
      en: "Totals are not stored per level: the model aggregates the rows of the existing fact table at query time."
      fr: "Les totaux ne sont pas stockés par niveau : le modèle agrège les lignes de la table de faits existante au moment de la requête."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
