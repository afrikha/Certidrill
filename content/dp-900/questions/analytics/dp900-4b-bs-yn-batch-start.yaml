id: dp900-4b-bs-yn-batch-start
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about batch processing, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le traitement par lots, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A batch can be started when a certain amount of data has arrived.
        fr: Un lot peut être démarré quand une certaine quantité de données est arrivée.
    - id: s2
      text:
        en: All the input data must be ready before a batch can be processed.
        fr: Toutes les données d'entrée doivent être prêtes avant qu'un lot puisse être traité.
    - id: s3
      text:
        en: A batch is started each time a single new record arrives.
        fr: Un lot est démarré chaque fois qu'un nouvel enregistrement arrive.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A batch can be processed at a scheduled interval, such as every hour, when a certain amount of data has arrived, or as the result of another event. One of its constraints is that all the input data must be ready before the batch can be processed. Processing every record as soon as it arrives isn't a batch; it is stream processing.
    fr: |
      Un lot peut être traité à intervalle planifié, par exemple toutes les heures, quand une certaine quantité de données est arrivée, ou à la suite d'un autre événement. L'une de ses contraintes est que toutes les données d'entrée doivent être prêtes avant que le lot puisse être traité. Traiter chaque enregistrement dès son arrivée n'est pas un lot : c'est du traitement de flux.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
