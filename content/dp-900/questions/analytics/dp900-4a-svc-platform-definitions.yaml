id: dp900-4a-svc-platform-definitions
objective: "4.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Fabric is a unified analytics platform that is delivered as [[model]].

      Azure Databricks is a cloud analytics platform that is built on [[engine]].
    fr: |
      Microsoft Fabric est une plateforme d'analytique unifiée fournie sous forme de [[model]].

      Azure Databricks est une plateforme d'analytique cloud bâtie sur [[engine]].
  slots:
    - id: model
      options:
        - { id: iaas, text: { en: "infrastructure as a service (IaaS)", fr: "infrastructure en tant que service (IaaS)" } }
        - { id: paas, text: { en: "platform as a service (PaaS)", fr: "plateforme en tant que service (PaaS)" } }
        - { id: saas, text: { en: "software as a service (SaaS)", fr: "logiciel en tant que service (SaaS)" } }
    - id: engine
      options:
        - { id: sqlserver, text: SQL Server }
        - { id: spark, text: Apache Spark }
        - { id: pq, text: Power Query }
        - { id: kafka, text: Apache Kafka }
answer:
  values: { model: saas, engine: spark }
explanation:
  correct:
    en: |
      Microsoft Fabric organizes all the layers of the analytics architecture in a single unified SaaS workspace, with no infrastructure to manage. Azure Databricks is a cloud analytics platform built on Apache Spark, optimized for large-scale data engineering, data science and SQL analytics.
    fr: |
      Microsoft Fabric organise toutes les couches de l'architecture analytique dans un seul espace de travail SaaS unifié, sans infrastructure à gérer. Azure Databricks est une plateforme d'analytique cloud bâtie sur Apache Spark, optimisée pour l'ingénierie des données, la science des données et l'analytique SQL à grande échelle.
  options:
    iaas: { en: "With IaaS you manage virtual machines yourself, which Fabric doesn't require.", fr: "Avec l'IaaS, vous gérez vous-même des machines virtuelles, ce que Fabric n'exige pas." }
    pq: { en: "Power Query is the transformation experience of Dataflows Gen2 in Fabric.", fr: "Power Query est l'expérience de transformation des Dataflows Gen2 dans Fabric." }
    kafka: { en: "Apache Kafka is a source of streaming events, not the processing engine of Azure Databricks.", fr: "Apache Kafka est une source d'événements de streaming, pas le moteur de traitement d'Azure Databricks." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
