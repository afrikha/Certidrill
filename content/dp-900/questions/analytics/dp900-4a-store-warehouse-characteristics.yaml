id: dp900-4a-store-warehouse-characteristics
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two characteristics describe a data warehouse?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux caractéristiques qui décrivent un entrepôt de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data is stored in relational tables.", fr: "Les données sont stockées dans des tables relationnelles." } }
    - { id: b, text: { en: "A schema is applied only when a file is read for analysis.", fr: "Un schéma n'est appliqué qu'au moment où un fichier est lu pour l'analyse." } }
    - { id: c, text: { en: "Images and video files are stored in their native format.", fr: "Les images et les fichiers vidéo sont stockés dans leur format natif." } }
    - { id: d, text: { en: "The schema is optimized for analytics rather than for transactions.", fr: "Le schéma est optimisé pour l'analytique plutôt que pour les transactions." } }
    - { id: e, text: { en: "The store is designed for many small insert and update operations.", fr: "Le magasin est conçu pour de nombreuses petites opérations d'insertion et de mise à jour." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A data warehouse is a relational database in which the data is stored in a schema optimized for analytics rather than for transactional workloads, typically as fact and dimension tables.
    fr: |
      Un entrepôt de données est une base de données relationnelle dans laquelle les données sont stockées dans un schéma optimisé pour l'analytique plutôt que pour les charges de travail transactionnelles, généralement sous forme de tables de faits et de dimension.
  options:
    b: { en: "Applying the schema at read time is the schema-on-read approach of a data lake.", fr: "Appliquer le schéma à la lecture est l'approche de schéma sur lecture d'un lac de données." }
    c: { en: "Unstructured files in their native format are kept in a data lake.", fr: "Les fichiers non structurés dans leur format natif sont conservés dans un lac de données." }
    e: { en: "Many small insert and update operations characterize a transactional (OLTP) database.", fr: "De nombreuses petites opérations d'insertion et de mise à jour caractérisent une base de données transactionnelle (OLTP)." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
