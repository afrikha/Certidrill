id: dp900-4b-pbi-yn-pages
objective: "4.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Power BI report is limited to a single page.
        fr: Un rapport Power BI est limité à une seule page.
    - id: s2
      text:
        en: A Power BI dashboard is limited to a single page.
        fr: Un tableau de bord Power BI est limité à une seule page.
    - id: s3
      text:
        en: Dashboards and reports can both be viewed in the Power BI mobile apps.
        fr: Les tableaux de bord et les rapports peuvent tous être consultés dans les applications mobiles Power BI.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A report has one or more pages, whereas a dashboard is always a single page, often called a canvas, that shows only the highlights. The Power BI mobile apps let users view and interact with both dashboards and reports on phones and tablets.
    fr: |
      Un rapport comporte une ou plusieurs pages, alors qu'un tableau de bord est toujours une page unique, souvent appelée canevas, qui ne montre que l'essentiel. Les applications mobiles Power BI permettent de consulter les tableaux de bord comme les rapports, et d'interagir avec eux, sur téléphone et sur tablette.
references:
  - title: Introduction to dashboards for Power BI designers
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards
  - title: What are the Power BI mobile apps?
    url: https://learn.microsoft.com/en-us/power-bi/consumer/mobile/mobile-apps-for-mobile-devices
