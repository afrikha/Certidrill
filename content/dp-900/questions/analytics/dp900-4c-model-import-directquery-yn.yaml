id: dp900-4c-model-import-directquery-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You compare the Import and DirectQuery storage modes of a Power BI semantic model that uses an Azure SQL database as its data source.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les modes de stockage Import et DirectQuery d'un modèle sémantique Power BI dont la source de données est une base de données Azure SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In Import mode, a change made in the database appears in the reports only after the semantic model is refreshed.
        fr: En mode Import, une modification effectuée dans la base de données n'apparaît dans les rapports qu'après l'actualisation du modèle sémantique.
    - id: s2
      text:
        en: In DirectQuery mode, the semantic model stores a copy of the rows of the database.
        fr: En mode DirectQuery, le modèle sémantique stocke une copie des lignes de la base de données.
    - id: s3
      text:
        en: Visuals usually load faster with a table in Import mode than with the same table in DirectQuery mode.
        fr: Les visuels se chargent en général plus vite avec une table en mode Import qu'avec la même table en mode DirectQuery.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Import mode loads a snapshot of the data into the in-memory store of the model: visuals query that copy, so they are fast, but they show the data of the last refresh. In DirectQuery mode no data is imported: the model keeps only the schema, and each visual sends queries to the source. The results are current, but the response time depends on the source and is usually longer than with imported data."
    fr: "Le mode Import charge un instantané des données dans le stockage en mémoire du modèle : les visuels interrogent cette copie, ils sont donc rapides, mais ils affichent les données de la dernière actualisation. En mode DirectQuery, aucune donnée n'est importée : le modèle ne conserve que le schéma, et chaque visuel envoie des requêtes à la source. Les résultats sont à jour, mais le temps de réponse dépend de la source et est en général plus long qu'avec des données importées."
references:
  - title: "DirectQuery in Power BI: When to Use, Limitations, Alternatives"
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
  - title: Table Storage Mode in Power BI Semantic Models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
