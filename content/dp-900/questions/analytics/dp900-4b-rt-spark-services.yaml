id: dp900-4b-rt-spark-services
objective: "4.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two Microsoft cloud services include Apache Spark, and therefore let you process streaming data with Spark Structured Streaming? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux services cloud Microsoft qui incluent Apache Spark et permettent donc de traiter des données de streaming avec Spark Structured Streaming ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure Databricks" }
    - { id: b, text: "Azure Stream Analytics" }
    - { id: c, text: "Microsoft Fabric" }
    - { id: d, text: "Azure Event Hubs" }
    - { id: e, text: "Azure IoT Hub" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Spark Structured Streaming is a library of Apache Spark, so it is available wherever Spark runs. On the Microsoft cloud, Spark is offered by Azure Databricks and by Microsoft Fabric, and both runtimes also support Delta Lake.
    fr: |
      Spark Structured Streaming est une bibliothèque d'Apache Spark : elle est donc disponible partout où Spark s'exécute. Dans le cloud Microsoft, Spark est proposé par Azure Databricks et par Microsoft Fabric, et les deux runtimes prennent aussi en charge Delta Lake.
  options:
    b:
      en: Azure Stream Analytics processes streams with its own engine and a SQL-based query language, not with Apache Spark.
      fr: Azure Stream Analytics traite les flux avec son propre moteur et un langage de requête basé sur SQL, pas avec Apache Spark.
    d:
      en: Azure Event Hubs ingests events. It can be a source for Spark Structured Streaming, but it doesn't run Spark.
      fr: Azure Event Hubs ingère des événements. Il peut être une source pour Spark Structured Streaming, mais il n'exécute pas Spark.
    e:
      en: Azure IoT Hub ingests telemetry from IoT devices; it doesn't run Spark.
      fr: "Azure IoT Hub ingère la télémétrie d'appareils IoT ; il n'exécute pas Spark."
references:
  - title: Explore Apache Spark structured streaming
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/5-spark-streaming
