id: dp900-4a-svc-both-platforms-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A consultant compares Microsoft Fabric with Azure Databricks for a large-scale analytics project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un consultant compare Microsoft Fabric et Azure Databricks pour un projet d'analytique à grande échelle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Unity Catalog is the tenant-wide data lake of Microsoft Fabric.
        fr: Unity Catalog est le lac de données à l'échelle du locataire de Microsoft Fabric.
    - id: s2
      text:
        en: Both platforms can ingest data, store it in a lakehouse, and run SQL analytics on it.
        fr: Les deux plateformes peuvent ingérer des données, les stocker dans un lakehouse et y exécuter de l'analytique SQL.
    - id: s3
      text:
        en: Each platform includes an assistant that generates queries from questions asked in natural language.
        fr: Chaque plateforme comprend un assistant qui génère des requêtes à partir de questions posées en langage naturel.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The tenant-wide data lake of Fabric is OneLake; Unity Catalog is the governance layer of Azure Databricks. Microsoft Fabric and Azure Databricks both support the full analytics architecture, from ingestion to a lakehouse based on Delta Lake and SQL analytics. For natural-language questions, Fabric offers Copilot and Azure Databricks offers Genie.
    fr: |
      Le lac de données à l'échelle du locataire de Fabric est OneLake ; Unity Catalog est la couche de gouvernance d'Azure Databricks. Microsoft Fabric et Azure Databricks prennent tous deux en charge toute l'architecture analytique, de l'ingestion à un lakehouse fondé sur Delta Lake et à l'analytique SQL. Pour les questions en langage naturel, Fabric propose Copilot et Azure Databricks propose Genie.
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
