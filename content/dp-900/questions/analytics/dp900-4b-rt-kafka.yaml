id: dp900-4b-rt-kafka
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which open-source technology is an event ingestion solution that is commonly used with Apache Spark as a source of streaming data?
  fr: |
    Quelle technologie open source est une solution d'ingestion d'événements couramment utilisée avec Apache Spark comme source de données de streaming ?
body:
  options:
    - { id: a, text: "Apache Parquet" }
    - { id: b, text: "Apache Cassandra" }
    - { id: c, text: "PostgreSQL" }
    - { id: d, text: "Apache Kafka" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Apache Kafka is an open-source data ingestion solution that is commonly used together with Apache Spark. Like Azure Event Hubs and Azure IoT Hub, it is a source that receives events; the processing is done by another technology, such as Spark Structured Streaming.
    fr: |
      Apache Kafka est une solution open source d'ingestion de données couramment utilisée avec Apache Spark. Comme Azure Event Hubs et Azure IoT Hub, c'est une source qui reçoit les événements ; le traitement est assuré par une autre technologie, comme Spark Structured Streaming.
  options:
    a:
      en: Apache Parquet is a columnar file format for storing data, not a service that ingests events.
      fr: Apache Parquet est un format de fichier en colonnes pour stocker des données, pas un service qui ingère des événements.
    b:
      en: Apache Cassandra is an open-source column-family database, not an event ingestion solution.
      fr: Apache Cassandra est une base de données open source de type famille de colonnes, pas une solution d'ingestion d'événements.
    c:
      en: PostgreSQL is an open-source relational database management system.
      fr: PostgreSQL est un système de gestion de base de données relationnelle open source.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
