id: dp900-4a-store-star-schema-name
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data warehouse contains a central table of sales values that is directly related to the Customer, Product, Store, and Date tables. No other table is related to those four tables.

    Which type of schema does the data warehouse use?
  fr: |
    Un entrepôt de données contient une table centrale de valeurs de ventes directement liée aux tables Customer, Product, Store et Date. Aucune autre table n'est liée à ces quatre tables.

    Quel type de schéma l'entrepôt de données utilise-t-il ?
body:
  options:
    - { id: a, text: { en: "A snowflake schema", fr: "Un schéma en flocon de neige" } }
    - { id: b, text: { en: "A normalized transactional schema", fr: "Un schéma transactionnel normalisé" } }
    - { id: c, text: { en: "Schema-on-read", fr: "Un schéma sur lecture (schema-on-read)" } }
    - { id: d, text: { en: "A star schema", fr: "Un schéma en étoile" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A central fact table that holds numeric values and is related to dimension tables, such as customer, product, store and time, forms a star schema.
    fr: |
      Une table de faits centrale qui contient des valeurs numériques et qui est liée à des tables de dimension, comme le client, le produit, le magasin et le temps, forme un schéma en étoile.
  options:
    a: { en: "A snowflake schema adds tables related to the dimension tables to represent hierarchies; here no such table exists.", fr: "Un schéma en flocon de neige ajoute des tables liées aux tables de dimension pour représenter des hiérarchies ; ici, aucune table de ce type n'existe." }
    b: { en: "A normalized transactional schema is designed for the operations of an application, not around a central table of values to aggregate.", fr: "Un schéma transactionnel normalisé est conçu pour les opérations d'une application, pas autour d'une table centrale de valeurs à agréger." }
    c: { en: "Schema-on-read is the way a data lake applies a schema to files when they are read.", fr: "Le schéma sur lecture est la façon dont un lac de données applique un schéma aux fichiers lors de leur lecture." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
