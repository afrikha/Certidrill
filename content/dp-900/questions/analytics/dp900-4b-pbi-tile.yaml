id: dp900-4b-pbi-tile
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Power BI service, you pin a chart from a report to a dashboard.

    What is the pinned visual called on the dashboard?
  fr: |
    Dans le service Power BI, vous épinglez un graphique d'un rapport à un tableau de bord.

    Comment s'appelle le visuel épinglé sur le tableau de bord ?
body:
  options:
    - { id: a, text: { en: "A tile", fr: "Une vignette" } }
    - { id: b, text: { en: "A slicer", fr: "Un segment" } }
    - { id: c, text: { en: "A bookmark", fr: "Un signet" } }
    - { id: d, text: { en: "A page", fr: "Une page" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The visualizations on a dashboard are called tiles. Report designers pin them to the dashboard from reports, and selecting a tile usually opens the report page on which the visual was created.
    fr: |
      Les visualisations d'un tableau de bord s'appellent des vignettes. Les concepteurs de rapports les épinglent au tableau de bord à partir de rapports, et la sélection d'une vignette ouvre généralement la page de rapport sur laquelle le visuel a été créé.
  options:
    b:
      en: A slicer is a visual of a report page that filters the other visuals of the page.
      fr: Un segment est un visuel d'une page de rapport qui filtre les autres visuels de la page.
    c:
      en: Bookmarks are a feature of reports; a bookmark isn't a visual on a dashboard.
      fr: "Les signets sont une fonctionnalité des rapports ; un signet n'est pas un visuel de tableau de bord."
    d:
      en: Pages belong to reports; a dashboard has a single page, on which the pinned visuals are placed.
      fr: "Les pages appartiennent aux rapports ; un tableau de bord a une seule page, sur laquelle les visuels épinglés sont placés."
references:
  - title: Dashboards for business users of the Power BI service
    url: https://learn.microsoft.com/en-us/power-bi/consumer/end-user-dashboards
