id: dp900-4c-model-measure-identify
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report must show the total revenue by product category and by month.

    In the analytical model, what is the total revenue?
  fr: |
    Un rapport doit afficher le chiffre d'affaires total par catégorie de produit et par mois.

    Dans le modèle analytique, qu'est-ce que le chiffre d'affaires total ?
body:
  options:
    - { id: a, text: { en: "A dimension", fr: "Une dimension" } }
    - { id: b, text: { en: "A measure", fr: "Une mesure" } }
    - { id: c, text: { en: "A hierarchy", fr: "Une hiérarchie" } }
    - { id: d, text: { en: "A relationship", fr: "Une relation" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A measure is a numeric value that you want to analyze or report, such as revenue or quantity sold. It is aggregated by the dimensions of the model, here the product category and the month."
    fr: "Une mesure est une valeur numérique à analyser ou à présenter, comme le chiffre d'affaires ou la quantité vendue. Elle est agrégée selon les dimensions du modèle, ici la catégorie de produit et le mois."
  options:
    a:
      en: "A dimension is an entity by which measures are aggregated: here the product and the time, not the revenue."
      fr: "Une dimension est une entité selon laquelle les mesures sont agrégées : ici le produit et le temps, pas le chiffre d'affaires."
    c:
      en: "A hierarchy organizes the levels of a dimension, such as year, month and day, to drill up or down."
      fr: "Une hiérarchie organise les niveaux d'une dimension, comme l'année, le mois et le jour, pour explorer vers le haut ou vers le bas."
    d:
      en: "A relationship links a dimension table to a fact table; it is not a value to aggregate."
      fr: "Une relation lie une table de dimension à une table de faits ; ce n'est pas une valeur à agréger."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
