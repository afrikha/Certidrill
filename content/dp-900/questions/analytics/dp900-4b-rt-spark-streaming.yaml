id: dp900-4b-rt-spark-streaming
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The data engineers of Litware use notebooks in Azure Databricks to process data in batches with Apache Spark. They need to process a stream of events on the same platform and with the same coding skills.

    Which technology should they use?
  fr: |
    Les ingénieurs de données de Litware utilisent des notebooks dans Azure Databricks pour traiter des données par lots avec Apache Spark. Ils doivent traiter un flux d'événements sur la même plateforme et avec les mêmes compétences en programmation.

    Quelle technologie doivent-ils utiliser ?
body:
  options:
    - { id: a, text: "Azure Stream Analytics" }
    - { id: b, text: "Spark Structured Streaming" }
    - { id: c, text: "Eventstream" }
    - { id: d, text: "Azure IoT Hub" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Spark Structured Streaming is the library of Apache Spark for streaming data. It is available in Azure Databricks and uses the same Spark APIs as batch processing: the stream is read into a dataframe that keeps receiving new rows, a query is applied, and the results are written to a sink. It is the natural choice for a team that already processes data with Spark.
    fr: |
      Spark Structured Streaming est la bibliothèque d'Apache Spark pour les données de streaming. Elle est disponible dans Azure Databricks et utilise les mêmes API Spark que le traitement par lots : le flux est lu dans un dataframe qui reçoit sans cesse de nouvelles lignes, une requête est appliquée, et les résultats sont écrits dans un récepteur (sink). C'est le choix naturel pour une équipe qui traite déjà ses données avec Spark.
  options:
    a:
      en: Azure Stream Analytics is a separate Azure service with its own jobs and query language; it doesn't run in Azure Databricks notebooks.
      fr: "Azure Stream Analytics est un service Azure distinct, avec ses propres travaux et son propre langage de requête ; il ne s'exécute pas dans les notebooks Azure Databricks."
    c:
      en: An eventstream is a no-code item of Microsoft Fabric Real-Time Intelligence, not a feature of Azure Databricks.
      fr: Un eventstream est un élément sans code de Real-Time Intelligence dans Microsoft Fabric, pas une fonctionnalité d'Azure Databricks.
    d:
      en: Azure IoT Hub ingests telemetry from IoT devices; it doesn't process the stream.
      fr: "Azure IoT Hub ingère la télémétrie d'appareils IoT ; il ne traite pas le flux."
references:
  - title: Explore Apache Spark structured streaming
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/5-spark-streaming
  - title: Structured Streaming concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/concepts
