id: dp900-4a-store-type-match
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the type of data store that it describes.

    To answer, drag the appropriate type of data store to each description. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au type de magasin de données qu'elle décrit.

    Pour répondre, faites glisser le type de magasin de données approprié vers chaque description. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dw, text: { en: "Data warehouse", fr: "Entrepôt de données" } }
    - { id: oltp, text: { en: "Transactional database", fr: "Base de données transactionnelle" } }
    - { id: lh, text: { en: "Data lakehouse", fr: "Data lakehouse" } }
    - { id: dl, text: { en: "Data lake", fr: "Lac de données" } }
    - { id: sm, text: { en: "Semantic model", fr: "Modèle sémantique" } }
  targets:
    - id: t1
      text: { en: "A file store on a distributed file system in which no schema is enforced when data is written", fr: "Un magasin de fichiers sur un système de fichiers distribué dans lequel aucun schéma n'est imposé à l'écriture des données" }
    - id: t2
      text: { en: "A relational database whose tables are usually organized as fact tables and dimension tables", fr: "Une base de données relationnelle dont les tables sont généralement organisées en tables de faits et en tables de dimension" }
    - id: t3
      text: { en: "Files in a data lake on which a table layer enforces schemas and supports SQL queries", fr: "Des fichiers dans un lac de données sur lesquels une couche de tables impose des schémas et prend en charge les requêtes SQL" }
answer:
  mapping: { t1: dl, t2: dw, t3: lh }
explanation:
  correct:
    en: |
      A data lake is a file store, usually on a distributed file system, that applies a schema when the data is read. A data warehouse is a relational database whose schema is optimized for analytics, typically with fact and dimension tables. A data lakehouse keeps the data as files in a lake and adds tables, with a format such as Delta Lake, that enforce schemas and can be queried with SQL.
    fr: |
      Un lac de données est un magasin de fichiers, généralement sur un système de fichiers distribué, qui applique un schéma à la lecture des données. Un entrepôt de données est une base de données relationnelle dont le schéma est optimisé pour l'analytique, généralement avec des tables de faits et de dimension. Un data lakehouse conserve les données sous forme de fichiers dans un lac et y ajoute des tables, avec un format comme Delta Lake, qui imposent des schémas et sont interrogeables en SQL.
  options:
    oltp: { en: "A transactional database is relational too, but its schema serves the operations of an application, not fact and dimension tables.", fr: "Une base de données transactionnelle est relationnelle elle aussi, mais son schéma sert les opérations d'une application, pas des tables de faits et de dimension." }
    sm: { en: "A semantic model is an analytical data model built on top of a store; it isn't a data store.", fr: "Un modèle sémantique est un modèle de données analytique construit au-dessus d'un magasin ; ce n'est pas un magasin de données." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
