id: dp900-4a-ing-fabric-ingestion-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware is evaluating the options for bringing data into OneLake in Microsoft Fabric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware évalue les options permettant d'amener des données dans OneLake dans Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a OneLake shortcut to an Azure Data Lake Storage Gen2 folder is created, the files of the folder are copied into OneLake.
        fr: Lorsqu'un raccourci OneLake vers un dossier Azure Data Lake Storage Gen2 est créé, les fichiers du dossier sont copiés dans OneLake.
    - id: s2
      text:
        en: Mirroring can replicate an Azure Cosmos DB database into OneLake without a pipeline being authored.
        fr: La mise en miroir peut répliquer une base de données Azure Cosmos DB dans OneLake sans qu'un pipeline soit créé.
    - id: s3
      text:
        en: A notebook can be scheduled as part of a pipeline.
        fr: Un notebook peut être planifié dans le cadre d'un pipeline.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A shortcut is a live reference: the data stays in its original location and is neither moved nor duplicated. Mirroring continuously replicates external databases such as Azure SQL Database, Snowflake and Azure Cosmos DB into OneLake, and Fabric handles the replication without pipeline authoring. A notebook can run interactively or be scheduled as an activity of a pipeline.
    fr: |
      Un raccourci est une référence active : les données restent à leur emplacement d'origine et ne sont ni déplacées ni dupliquées. La mise en miroir réplique en continu dans OneLake des bases de données externes comme Azure SQL Database, Snowflake et Azure Cosmos DB, et Fabric gère la réplication sans création de pipeline. Un notebook peut s'exécuter de manière interactive ou être planifié comme activité d'un pipeline.
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
