id: dp900-4c-viz-slicer-filter
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The readers of a Power BI report often filter a page by year and by region. The filters must stay visible on the page next to the charts, and readers must see at a glance which values are selected.

    What should you add to the page?
  fr: |
    Les lecteurs d'un rapport Power BI filtrent souvent une page par année et par région. Les filtres doivent rester visibles sur la page à côté des graphiques, et les lecteurs doivent voir d'un coup d'œil quelles valeurs sont sélectionnées.

    Que devez-vous ajouter à la page ?
body:
  options:
    - { id: a, text: { en: "A card for each field", fr: "Une carte (card) pour chaque champ" } }
    - { id: b, text: { en: "A gauge for each field", fr: "Une jauge pour chaque champ" } }
    - { id: c, text: { en: "A matrix for each field", fr: "Une matrice pour chaque champ" } }
    - { id: d, text: { en: "A slicer for each field", fr: "Un segment (slicer) pour chaque champ" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A slicer is a filtering control placed on the report canvas. It is always visible, shows the current selection and, by default, filters all the other visuals of the page, so readers do not need to open the Filters pane."
    fr: "Un segment est un contrôle de filtrage placé sur le canevas du rapport. Il est toujours visible, affiche la sélection en cours et, par défaut, filtre tous les autres visuels de la page : les lecteurs n'ont pas besoin d'ouvrir le volet Filtres."
  options:
    a:
      en: "A card displays one figure; it is not a control in which readers choose filter values."
      fr: "Une carte affiche un seul chiffre ; ce n'est pas un contrôle dans lequel les lecteurs choisissent des valeurs de filtre."
    b:
      en: "A gauge shows the progress of one value toward a target; it does not filter the page."
      fr: "Une jauge montre la progression d'une valeur vers un objectif ; elle ne filtre pas la page."
    c:
      en: "A matrix summarizes values in rows and columns; it is not designed to keep a filter selection visible."
      fr: "Une matrice résume des valeurs en lignes et en colonnes ; elle n'est pas conçue pour garder visible une sélection de filtre."
references:
  - title: Overview of slicers in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-slicers
