id: dp900-4b-bs-hot-workloads
objective: "4.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation runs the four data workloads shown in the following table.

    Answer each prompt by selecting the appropriate workload.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation exécute les quatre charges de travail de données présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la charge de travail appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The workload that uses stream processing", fr: "La charge de travail qui utilise le traitement de flux" }
    - id: p2
      text: { en: "The batch workload that is started by an amount of data instead of a schedule", fr: "La charge de travail par lots démarrée par une quantité de données et non par une planification" }
  grid:
    header:
      - { en: "Workload", fr: "Charge de travail" }
      - { en: "Arrival of the data", fr: "Arrivée des données" }
      - { en: "Processing", fr: "Traitement" }
    rows:
      - - { text: { en: "Payroll", fr: "Paie" }, area: w1 }
        - { text: { en: "Timesheets are entered during the month.", fr: "Les feuilles de temps sont saisies pendant le mois." } }
        - { text: { en: "On the last day of the month, all the timesheets are processed together.", fr: "Le dernier jour du mois, toutes les feuilles de temps sont traitées ensemble." } }
      - - { text: { en: "Click archive", fr: "Archive des clics" }, area: w2 }
        - { text: { en: "Clicks arrive continuously.", fr: "Les clics arrivent en continu." } }
        - { text: { en: "A job runs each time 1 GB of clicks has accumulated in storage.", fr: "Un travail s'exécute chaque fois que 1 Go de clics s'est accumulé dans le stockage." } }
      - - { text: { en: "Machine monitoring", fr: "Surveillance des machines" }, area: w3 }
        - { text: { en: "Sensor readings arrive continuously.", fr: "Les relevés de capteurs arrivent en continu." } }
        - { text: { en: "Each reading is checked on arrival, and an alarm is raised within seconds.", fr: "Chaque relevé est vérifié à son arrivée, et une alarme est déclenchée en quelques secondes." } }
      - - { text: { en: "Sales reporting", fr: "Rapports de ventes" }, area: w4 }
        - { text: { en: "Sales arrive continuously.", fr: "Les ventes arrivent en continu." } }
        - { text: { en: "Every night, the sales of the day are loaded into a data warehouse.", fr: "Chaque nuit, les ventes du jour sont chargées dans un entrepôt de données." } }
answer:
  values: { p1: w3, p2: w2 }
explanation:
  correct:
    en: |
      Only machine monitoring processes each piece of data as it arrives and responds within seconds, which is stream processing. The three other workloads group the data before processing it, so they are batches, even when the data arrives continuously. A batch can be started on a schedule, when a certain amount of data has arrived, or on another event: the click archive starts when 1 GB of data has accumulated.
    fr: |
      Seule la surveillance des machines traite chaque donnée à son arrivée et réagit en quelques secondes : c'est un traitement de flux. Les trois autres charges de travail regroupent les données avant de les traiter : ce sont des lots, même quand les données arrivent en continu. Un lot peut être démarré selon une planification, quand une certaine quantité de données est arrivée, ou sur un autre événement : l'archive des clics démarre quand 1 Go de données s'est accumulé.
  options:
    w1:
      en: Payroll is a batch started by a schedule, the last day of the month.
      fr: "La paie est un lot démarré par une planification : le dernier jour du mois."
    w4:
      en: Sales reporting is a batch started by a schedule, every night, although the sales arrive continuously.
      fr: "Les rapports de ventes sont un lot démarré par une planification, chaque nuit, bien que les ventes arrivent en continu."
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
