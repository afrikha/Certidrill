id: dp900-4a-svc-onelake
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Microsoft Fabric, what is the single data lake that all the workloads of a tenant share?
  fr: |
    Dans Microsoft Fabric, quel est le lac de données unique que partagent toutes les charges de travail d'un locataire ?
body:
  options:
    - { id: a, text: { en: "A Lakehouse", fr: "Un Lakehouse" } }
    - { id: b, text: OneLake }
    - { id: c, text: { en: "A Warehouse", fr: "Un Warehouse" } }
    - { id: d, text: { en: "An Eventhouse", fr: "Un Eventhouse" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OneLake is the tenant-wide data lake of Microsoft Fabric. Every Fabric workload reads from and writes to it directly, so data isn't copied between storage silos. Each tenant has exactly one OneLake, provisioned automatically.
    fr: |
      OneLake est le lac de données à l'échelle du locataire de Microsoft Fabric. Chaque charge de travail Fabric y lit et y écrit directement : les données ne sont donc pas copiées entre des silos de stockage. Chaque locataire dispose d'un seul OneLake, approvisionné automatiquement.
  options:
    a: { en: "A Lakehouse is an item that you create in a workspace; it stores its Delta tables and files in OneLake, and a tenant can contain many of them.", fr: "Un Lakehouse est un élément que vous créez dans un espace de travail ; il stocke ses tables Delta et ses fichiers dans OneLake, et un locataire peut en contenir beaucoup." }
    c: { en: "A Warehouse is a relational data warehouse item whose data is also stored in OneLake.", fr: "Un Warehouse est un élément d'entrepôt de données relationnel dont les données sont elles aussi stockées dans OneLake." }
    d: { en: "An Eventhouse hosts KQL databases for real-time data; it isn't the shared data lake.", fr: "Un Eventhouse héberge des bases de données KQL pour des données en temps réel ; ce n'est pas le lac de données partagé." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is OneLake?
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview
