id: dp900-4c-model-relationship-cardinality
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Power BI semantic model contains two tables:

    - **Product** has one row per product, identified by a unique ProductKey value.
    - **Sales** has one row per item sold and contains the ProductKey of the product sold.

    You create a relationship between the two tables on the ProductKey columns.

    Which statement describes the relationship?
  fr: |
    Un modèle sémantique Power BI contient deux tables :

    - **Product** contient une ligne par produit, identifiée par une valeur unique de ProductKey.
    - **Sales** contient une ligne par article vendu, avec la valeur ProductKey du produit vendu.

    Vous créez une relation entre les deux tables sur les colonnes ProductKey.

    Quelle affirmation décrit la relation ?
body:
  options:
    - { id: a, text: { en: "One-to-one: each row of Product matches one row of Sales.", fr: "Un-à-un : chaque ligne de Product correspond à une ligne de Sales." } }
    - { id: b, text: { en: "One-to-many: Sales is on the one side and Product is on the many side.", fr: "Un-à-plusieurs : Sales est du côté « un » et Product du côté « plusieurs »." } }
    - { id: c, text: { en: "One-to-many: Product is on the one side and Sales is on the many side.", fr: "Un-à-plusieurs : Product est du côté « un » et Sales du côté « plusieurs »." } }
    - { id: d, text: { en: "Many-to-many: neither table has unique ProductKey values.", fr: "Plusieurs-à-plusieurs : aucune des deux tables n'a de valeurs ProductKey uniques." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Each ProductKey value appears once in Product and can appear in many rows of Sales, because a product is sold many times. The relationship is therefore one-to-many, with the dimension table on the one side and the fact table on the many side, which is the usual pattern of a star schema."
    fr: "Chaque valeur de ProductKey apparaît une seule fois dans Product et peut apparaître dans de nombreuses lignes de Sales, puisqu'un produit est vendu plusieurs fois. La relation est donc de type un-à-plusieurs, avec la table de dimension du côté « un » et la table de faits du côté « plusieurs », ce qui est le cas habituel d'un schéma en étoile."
  options:
    a:
      en: "One-to-one would mean that each product appears in a single row of Sales, which is false for a product sold several times."
      fr: "Un-à-un signifierait que chaque produit n'apparaît que dans une seule ligne de Sales, ce qui est faux pour un produit vendu plusieurs fois."
    b:
      en: "The one side is the table whose key values are unique: that is Product, not Sales."
      fr: "Le côté « un » est la table dont les valeurs de clé sont uniques : c'est Product, pas Sales."
    d:
      en: "ProductKey is unique in Product, so the relationship is not many-to-many."
      fr: "ProductKey est unique dans Product, la relation n'est donc pas de type plusieurs-à-plusieurs."
references:
  - title: Create and Manage Relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-create-and-manage-relationships
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
