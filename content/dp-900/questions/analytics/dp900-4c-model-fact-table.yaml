id: dp900-4c-model-fact-table
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Power BI semantic model contains the following tables.

    | Table | Content |
    | --- | --- |
    | Product | One row per product: product key, name, category |
    | Store | One row per store: store key, city, country/region |
    | Date | One row per day: date, month, year |
    | Sales | One row per item sold: date, product key, store key, quantity, revenue |

    Which table is the fact table?
  fr: |
    Un modèle sémantique Power BI contient les tables suivantes.

    | Table | Contenu |
    | --- | --- |
    | Product | Une ligne par produit : clé du produit, nom, catégorie |
    | Store | Une ligne par magasin : clé du magasin, ville, pays/région |
    | Date | Une ligne par jour : date, mois, année |
    | Sales | Une ligne par article vendu : date, clé du produit, clé du magasin, quantité, chiffre d'affaires |

    Quelle table est la table de faits ?
body:
  options:
    - { id: a, text: Product }
    - { id: b, text: Store }
    - { id: c, text: Date }
    - { id: d, text: Sales }
answer: { optionId: d }
explanation:
  correct:
    en: "A fact table has one row for each recorded event and stores the numeric values to analyze. Sales records each item sold with its quantity and revenue, and its key columns relate each row to the Product, Store and Date tables."
    fr: "Une table de faits contient une ligne par événement enregistré et stocke les valeurs numériques à analyser. Sales enregistre chaque article vendu avec sa quantité et son chiffre d'affaires, et ses colonnes de clé relient chaque ligne aux tables Product, Store et Date."
  options:
    a:
      en: "Product has one row per entity, with a unique key and descriptive attributes: it is a dimension table."
      fr: "Product contient une ligne par entité, avec une clé unique et des attributs descriptifs : c'est une table de dimension."
    b:
      en: "Store describes the stores by which sales are grouped or filtered: it is a dimension table."
      fr: "Store décrit les magasins selon lesquels les ventes sont regroupées ou filtrées : c'est une table de dimension."
    c:
      en: "Date is the time dimension table: it is used to aggregate the measures by day, month or year."
      fr: "Date est la table de dimension de temps : elle sert à agréger les mesures par jour, par mois ou par année."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
