id: dp900-4b-bs-latency-definition
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    When batch processing and stream processing are compared, what does the term latency describe?
  fr: |
    Lorsque l'on compare le traitement par lots et le traitement de flux, que désigne le terme « latence » ?
body:
  options:
    - id: a
      text:
        en: The time taken for the data to be received and processed
        fr: Le temps nécessaire pour que les données soient reçues et traitées
    - id: b
      text:
        en: The amount of data that is processed in one operation
        fr: La quantité de données traitée en une seule opération
    - id: c
      text:
        en: The number of events that arrive every second
        fr: Le nombre d'événements qui arrivent chaque seconde
    - id: d
      text:
        en: The period over which a streaming query aggregates values
        fr: La période sur laquelle une requête de streaming agrège des valeurs
answer: { optionId: a }
explanation:
  correct:
    en: |
      Latency is the time taken for the data to be received and processed, that is, the delay before the result is available. It is typically a few hours for batch processing, and seconds or milliseconds for stream processing.
    fr: |
      La latence est le temps nécessaire pour que les données soient reçues et traitées, c'est-à-dire le délai avant que le résultat soit disponible. Elle est généralement de quelques heures pour le traitement par lots, et de quelques secondes ou millisecondes pour le traitement de flux.
  options:
    b:
      en: This is the data size, another point of comparison. Batch handles large datasets, stream handles individual records or micro-batches.
      fr: "C'est la taille des données, un autre point de comparaison : les lots traitent de gros jeux de données, le flux des enregistrements individuels ou des micro-lots."
    c:
      en: The arrival rate of the events describes the volume of the stream, not the delay before a result is available.
      fr: Le rythme d'arrivée des événements décrit le volume du flux, pas le délai avant qu'un résultat soit disponible.
    d:
      en: This period is called a window.
      fr: Cette période s'appelle une fenêtre.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
