id: dp900-4a-svc-genie
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Sales managers at Fabrikam don't write SQL. They want to ask questions in natural language about the data that is registered in Unity Catalog in Azure Databricks, and receive the results.

    What should they use?
  fr: |
    Les responsables commerciaux de Fabrikam n'écrivent pas de SQL. Ils veulent poser des questions en langage naturel sur les données inscrites dans Unity Catalog dans Azure Databricks, et recevoir les résultats.

    Que doivent-ils utiliser ?
body:
  options:
    - { id: a, text: { en: "Lakeflow pipelines", fr: "Des pipelines Lakeflow" } }
    - { id: b, text: { en: "A SQL warehouse in Databricks SQL", fr: "Un entrepôt SQL de Databricks SQL" } }
    - { id: c, text: { en: "A Databricks notebook", fr: "Un notebook Databricks" } }
    - { id: d, text: Genie }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Genie is the conversational interface of Azure Databricks. Users ask questions in natural language about data registered in Unity Catalog, and Genie generates and runs the SQL, then returns the results.
    fr: |
      Genie est l'interface conversationnelle d'Azure Databricks. Les utilisateurs posent des questions en langage naturel sur des données inscrites dans Unity Catalog, et Genie génère et exécute le SQL, puis renvoie les résultats.
  options:
    a: { en: "Lakeflow pipelines load and update Delta tables; they don't answer questions.", fr: "Les pipelines Lakeflow chargent et mettent à jour des tables Delta ; ils ne répondent pas à des questions." }
    b: { en: "A SQL warehouse is the compute that runs queries, but someone still has to write the SQL.", fr: "Un entrepôt SQL est la ressource de calcul qui exécute les requêtes, mais quelqu'un doit quand même écrire le SQL." }
    c: { en: "A notebook is a code environment for Python, SQL, Scala and R.", fr: "Un notebook est un environnement de code pour Python, SQL, Scala et R." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
