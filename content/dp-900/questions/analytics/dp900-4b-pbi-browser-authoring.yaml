id: dp900-4b-pbi-browser-authoring
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An analyst at Litware uses a computer that doesn't run Windows. The analyst must create a simple report from a semantic model that is already published to a workspace.

    What should the analyst use?
  fr: |
    Une analyste de Litware utilise un ordinateur qui n'exécute pas Windows. Elle doit créer un rapport simple à partir d'un modèle sémantique déjà publié dans un espace de travail.

    Que doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Power BI Desktop" }
    - { id: b, text: { en: "The Power BI service in a web browser", fr: "Le service Power BI dans un navigateur web" } }
    - { id: c, text: { en: "The Power BI mobile app", fr: "L'application mobile Power BI" } }
    - { id: d, text: "Power BI Report Server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Power BI Desktop is the main authoring tool, but it is a Windows application. The Power BI service also supports report editing in a web browser, with fewer features than Power BI Desktop: an analyst can create a report on a published semantic model without installing any desktop software.
    fr: |
      Power BI Desktop est le principal outil de création, mais c'est une application Windows. Le service Power BI permet aussi de modifier des rapports dans un navigateur web, avec moins de fonctionnalités que Power BI Desktop : un analyste peut créer un rapport sur un modèle sémantique publié sans installer de logiciel de bureau.
  options:
    a:
      en: Power BI Desktop is a Windows application, so it isn't available on this computer.
      fr: "Power BI Desktop est une application Windows : il n'est donc pas disponible sur cet ordinateur."
    c:
      en: The mobile apps are for viewing and interacting with reports and dashboards; reports aren't created in them.
      fr: "Les applications mobiles servent à consulter les rapports et les tableaux de bord et à interagir avec eux ; on n'y crée pas de rapports."
    d:
      en: Power BI Report Server is an on-premises server that hosts reports; it isn't the tool for building a report on a model of a workspace in the cloud.
      fr: "Power BI Report Server est un serveur local qui héberge des rapports ; ce n'est pas l'outil pour créer un rapport sur un modèle d'un espace de travail dans le cloud."
references:
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
  - title: What are the Power BI mobile apps?
    url: https://learn.microsoft.com/en-us/power-bi/consumer/mobile/mobile-apps-for-mobile-devices
