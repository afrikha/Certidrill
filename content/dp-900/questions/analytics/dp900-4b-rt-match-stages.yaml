id: dp900-4b-rt-match-stages
objective: "4.2.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders monitors refrigerated trucks. You review the components of its streaming solution.

    Match each component to its role in the solution. To answer, drag the appropriate role to each component. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders surveille des camions frigorifiques. Vous examinez les composants de sa solution de streaming.

    Associez chaque composant à son rôle dans la solution. Pour répondre, faites glisser le rôle approprié vers chaque composant. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: event, text: { en: "Event generation", fr: "Génération des événements" } }
    - { id: source, text: { en: "Source", fr: "Source" } }
    - { id: processing, text: { en: "Stream processing", fr: "Traitement de flux" } }
    - { id: sink, text: { en: "Sink", fr: "Récepteur (sink)" } }
  targets:
    - id: t1
      text:
        en: Azure IoT Hub, which receives the temperatures sent by the trucks
        fr: Azure IoT Hub, qui reçoit les températures envoyées par les camions
    - id: t2
      text:
        en: A Spark Structured Streaming query, which calculates the average temperature per minute
        fr: Une requête Spark Structured Streaming, qui calcule la température moyenne par minute
    - id: t3
      text:
        en: Azure Event Hubs, which queues the calculated averages for another application
        fr: Azure Event Hubs, qui met en file d'attente les moyennes calculées pour une autre application
    - id: t4
      text:
        en: A Power BI report, which shows the calculated averages in real time
        fr: Un rapport Power BI, qui affiche les moyennes calculées en temps réel
answer:
  mapping: { t1: source, t2: processing, t3: sink, t4: sink }
explanation:
  correct:
    en: |
      Azure IoT Hub ingests the telemetry of the devices: it is the source. The Spark Structured Streaming query does the processing, by aggregating the events over one-minute windows. The results go to sinks: Power BI visualizes them in real time, and Azure Event Hubs, although it is often a source, is a sink here because it queues the processed data for further downstream processing. The events themselves are generated by the sensors of the trucks.
    fr: |
      Azure IoT Hub ingère la télémétrie des appareils : c'est la source. La requête Spark Structured Streaming assure le traitement, en agrégeant les événements sur des fenêtres d'une minute. Les résultats vont vers des récepteurs (sinks) : Power BI les visualise en temps réel, et Azure Event Hubs, bien qu'il soit souvent une source, est ici un récepteur, car il met en file d'attente les données traitées pour un traitement en aval. Les événements eux-mêmes sont générés par les capteurs des camions.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
