id: dp900-4a-ing-realtime-batch-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are describing the data ingestion and processing element of a large-scale analytics solution.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous décrivez l'élément d'ingestion et de traitement des données d'une solution d'analytique à grande échelle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Data can be ingested from real-time streams as well as from transactional data stores and files.
        fr: Les données peuvent être ingérées à partir de flux en temps réel, ainsi que de magasins de données transactionnels et de fichiers.
    - id: s2
      text:
        en: A pipeline that loads static files once every night is an example of real-time processing.
        fr: Un pipeline qui charge des fichiers statiques une fois par nuit est un exemple de traitement en temps réel.
    - id: s3
      text:
        en: Data processing for large-scale analytics is usually performed on a single server so that the data stays consistent.
        fr: Le traitement des données pour l'analytique à grande échelle est généralement effectué sur un seul serveur afin que les données restent cohérentes.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Data from transactional data stores, files, real-time streams and other sources is loaded into a data lake or a data warehouse. Loading static files on a schedule is batch processing; real-time processing handles streaming data as it arrives. The processing is usually performed by distributed systems that handle high volumes of data in parallel on multi-node clusters, not by a single server.
    fr: |
      Les données de magasins de données transactionnels, de fichiers, de flux en temps réel et d'autres sources sont chargées dans un lac de données ou un entrepôt de données. Charger des fichiers statiques selon une planification est un traitement par lots ; le traitement en temps réel traite des données de streaming à mesure qu'elles arrivent. Le traitement est généralement confié à des systèmes distribués qui traitent de gros volumes de données en parallèle sur des clusters à plusieurs nœuds, et non à un seul serveur.
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
