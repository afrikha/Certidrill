id: dp900-4b-pbi-yn-tools
objective: "4.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Power BI Desktop is a Windows application.
        fr: Power BI Desktop est une application Windows.
    - id: s2
      text:
        en: The Power BI mobile apps are used to create reports.
        fr: Les applications mobiles Power BI servent à créer des rapports.
    - id: s3
      text:
        en: Power BI Report Builder is the tool used to create dashboards.
        fr: Power BI Report Builder est l'outil utilisé pour créer des tableaux de bord.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Power BI Desktop is a free application for Windows in which data models and reports are created. The mobile apps are for viewing and interacting with content that already exists; reports aren't created in them. Power BI Report Builder creates paginated reports, and dashboards are created in the Power BI service by pinning visuals.
    fr: |
      Power BI Desktop est une application gratuite pour Windows dans laquelle on crée des modèles de données et des rapports. Les applications mobiles servent à consulter du contenu existant et à interagir avec lui ; on n'y crée pas de rapports. Power BI Report Builder crée des rapports paginés, et les tableaux de bord se créent dans le service Power BI en épinglant des visuels.
references:
  - title: What is Power BI?
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/power-bi-overview
  - title: What are the Power BI mobile apps?
    url: https://learn.microsoft.com/en-us/power-bi/consumer/mobile/mobile-apps-for-mobile-devices
