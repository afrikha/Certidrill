id: dp900-4a-store-star-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A retailer models its data warehouse as a star schema that contains a Sales fact table and the Product, Store, and Date dimension tables.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un détaillant modélise son entrepôt de données sous la forme d'un schéma en étoile qui contient une table de faits Sales et les tables de dimension Product, Store et Date.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Product table usually contains many more rows than the Sales table.
        fr: La table Product contient généralement beaucoup plus de lignes que la table Sales.
    - id: s2
      text:
        en: Each row of the Sales table contains keys that relate it to rows of the dimension tables.
        fr: Chaque ligne de la table Sales contient des clés qui la relient à des lignes des tables de dimension.
    - id: s3
      text:
        en: Adding a ProductCategory table that is related to the Product table extends the model into a snowflake schema.
        fr: L'ajout d'une table ProductCategory liée à la table Product étend le modèle en schéma en flocon de neige.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Fact tables record events, so they can contain a very large number of rows and keep growing, whereas a dimension table such as Product holds one row per entity and stays comparatively small. A fact table holds numeric values together with the dimension keys that relate each row to the dimension tables. Adding tables related to a dimension table to represent a hierarchy, such as product categories, turns a star schema into a snowflake schema.
    fr: |
      Les tables de faits enregistrent des événements : elles peuvent contenir un très grand nombre de lignes et continuent de croître, alors qu'une table de dimension comme Product contient une ligne par entité et reste relativement petite. Une table de faits contient des valeurs numériques ainsi que les clés de dimension qui relient chaque ligne aux tables de dimension. Ajouter des tables liées à une table de dimension pour représenter une hiérarchie, comme les catégories de produits, transforme un schéma en étoile en schéma en flocon de neige.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
