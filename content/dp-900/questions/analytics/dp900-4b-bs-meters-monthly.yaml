id: dp900-4b-bs-meters-monthly
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The smart meters of Contoso Energy send a reading every 15 minutes. The readings are stored as they arrive. On the first day of each month, a job calculates the invoices of all customers from the readings of the previous month.

    Which statement describes how the readings are processed to produce the invoices?
  fr: |
    Les compteurs intelligents de Contoso Energy envoient un relevé toutes les 15 minutes. Les relevés sont stockés à leur arrivée. Le premier jour de chaque mois, un travail calcule les factures de tous les clients à partir des relevés du mois précédent.

    Quelle affirmation décrit la façon dont les relevés sont traités pour produire les factures ?
body:
  options:
    - id: a
      text:
        en: It is stream processing, because the meters send data continuously.
        fr: C'est un traitement de flux, car les compteurs envoient des données en continu.
    - id: b
      text:
        en: It is batch processing, because all the readings have the same structure.
        fr: C'est un traitement par lots, car tous les relevés ont la même structure.
    - id: c
      text:
        en: It is stream processing, because the readings are stored as they arrive.
        fr: C'est un traitement de flux, car les relevés sont stockés à leur arrivée.
    - id: d
      text:
        en: It is batch processing, because the stored readings are processed together.
        fr: C'est un traitement par lots, car les relevés stockés sont traités ensemble.
answer: { optionId: d }
explanation:
  correct:
    en: |
      What decides is when the data is processed, not how it arrives. Here the readings are accumulated for a month and then processed together by a scheduled job, which is batch processing. Monthly billing is a classic example of a batch.
    fr: |
      Ce qui décide, c'est le moment où les données sont traitées, pas la façon dont elles arrivent. Ici, les relevés sont accumulés pendant un mois, puis traités ensemble par un travail planifié : c'est un traitement par lots. La facturation mensuelle est un exemple classique de lot.
  options:
    a:
      en: Data that arrives continuously isn't necessarily processed as a stream; these readings wait up to a month before they are used.
      fr: Des données qui arrivent en continu ne sont pas forcément traitées en flux ; ces relevés attendent jusqu'à un mois avant d'être utilisés.
    b:
      en: It is batch processing, but the reason is the grouped processing; the structure of the data doesn't determine the type of processing.
      fr: "C'est bien un traitement par lots, mais la raison est le traitement groupé ; la structure des données ne détermine pas le type de traitement."
    c:
      en: Storing data on arrival is only capture; in stream processing each reading would also be processed when it arrives.
      fr: Stocker les données à l'arrivée n'est que de la capture ; dans un traitement de flux, chaque relevé serait aussi traité à son arrivée.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
