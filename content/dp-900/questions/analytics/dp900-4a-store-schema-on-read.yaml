id: dp900-4a-store-schema-on-read
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a data lake, a tabular schema is applied to the files at the moment the data is read for analysis, and no constraint is enforced when the files are stored.

    What is this approach called?
  fr: |
    Dans un lac de données, un schéma tabulaire est appliqué aux fichiers au moment où les données sont lues pour l'analyse, et aucune contrainte n'est imposée lorsque les fichiers sont stockés.

    Comment s'appelle cette approche ?
body:
  options:
    - { id: a, text: { en: "Normalization", fr: "La normalisation" } }
    - { id: b, text: { en: "Schema-on-write", fr: "Le schéma sur écriture (schema-on-write)" } }
    - { id: c, text: { en: "Schema-on-read", fr: "Le schéma sur lecture (schema-on-read)" } }
    - { id: d, text: { en: "A star schema", fr: "Un schéma en étoile" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Data lakes often use a schema-on-read approach: the tabular schema is defined on semi-structured files when the data is read for analysis, and nothing is enforced when the data is stored.
    fr: |
      Les lacs de données utilisent souvent une approche de schéma sur lecture : le schéma tabulaire est défini sur des fichiers semi-structurés au moment où les données sont lues pour l'analyse, et rien n'est imposé lorsque les données sont stockées.
  options:
    a: { en: "Normalization splits relational data into related tables to reduce duplication.", fr: "La normalisation répartit des données relationnelles dans des tables liées afin de réduire la duplication." }
    b: { en: "Schema-on-write is the opposite: the structure is enforced when the data is written, as in a data warehouse.", fr: "Le schéma sur écriture est l'inverse : la structure est imposée à l'écriture des données, comme dans un entrepôt de données." }
    d: { en: "A star schema is a design of fact and dimension tables in a data warehouse.", fr: "Un schéma en étoile est une organisation en tables de faits et de dimension dans un entrepôt de données." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is a data lake?
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/scenarios/data-lake
