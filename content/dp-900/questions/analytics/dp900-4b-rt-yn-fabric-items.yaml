id: dp900-4b-rt-yn-fabric-items
objective: "4.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Real-Time Intelligence in Microsoft Fabric, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Real-Time Intelligence dans Microsoft Fabric, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Activator can monitor the data of a Power BI report as well as the data of an eventstream.
        fr: Activator peut surveiller les données d'un rapport Power BI aussi bien que celles d'un eventstream.
    - id: s2
      text:
        en: An eventstream can send the same events to several destinations, such as an eventhouse and a lakehouse.
        fr: Un eventstream peut envoyer les mêmes événements vers plusieurs destinations, comme un eventhouse et un lakehouse.
    - id: s3
      text:
        en: A KQL queryset is the item that ingests events from Azure Event Hubs into Microsoft Fabric.
        fr: Un KQL queryset est l'élément qui ingère dans Microsoft Fabric les événements provenant d'Azure Event Hubs.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Activator detects conditions in changing data and triggers actions; it can watch eventstreams, Power BI reports and Real-Time Dashboards. An eventstream can have several destinations at the same time, for example an eventhouse for KQL queries and a lakehouse that stores the events in Delta tables. A KQL queryset only runs queries on data that is already in an eventhouse; ingesting events from sources such as Azure Event Hubs is the role of an eventstream.
    fr: |
      Activator détecte des conditions dans des données qui changent et déclenche des actions ; il peut surveiller des eventstreams, des rapports Power BI et des Real-Time Dashboards. Un eventstream peut avoir plusieurs destinations en même temps, par exemple un eventhouse pour des requêtes KQL et un lakehouse qui stocke les événements dans des tables Delta. Un KQL queryset ne fait qu'exécuter des requêtes sur des données déjà présentes dans un eventhouse ; ingérer des événements depuis des sources comme Azure Event Hubs est le rôle d'un eventstream.
references:
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
  - title: Overview of Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
