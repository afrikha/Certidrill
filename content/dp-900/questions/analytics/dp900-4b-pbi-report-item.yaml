id: dp900-4b-pbi-report-item
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Power BI item contains one or more pages of interactive visuals that readers can filter and slice, and is based on a single semantic model?
  fr: |
    Quel élément Power BI contient une ou plusieurs pages de visuels interactifs que les lecteurs peuvent filtrer et découper, et repose sur un seul modèle sémantique ?
body:
  options:
    - { id: a, text: { en: "A dashboard", fr: "Un tableau de bord" } }
    - { id: b, text: { en: "An app", fr: "Une application" } }
    - { id: c, text: { en: "A report", fr: "Un rapport" } }
    - { id: d, text: { en: "A tile", fr: "Une vignette" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Power BI report is made of one or more pages of interactive visuals, and it is based on a single semantic model. Readers have many ways to filter, highlight and slice its data.
    fr: |
      Un rapport Power BI est composé d'une ou de plusieurs pages de visuels interactifs, et il repose sur un seul modèle sémantique. Les lecteurs disposent de nombreux moyens de filtrer, mettre en surbrillance et découper ses données.
  options:
    a:
      en: A dashboard is a single page of tiles, which can come from several reports, and its readers can't filter or slice it.
      fr: Un tableau de bord est une page unique de vignettes, qui peuvent provenir de plusieurs rapports, et ses lecteurs ne peuvent ni le filtrer ni le découper.
    b:
      en: An app is a collection of dashboards and reports that is packaged for distribution to an audience.
      fr: Une application est un ensemble de tableaux de bord et de rapports regroupés pour être distribués à une audience.
    d:
      en: A tile is a single visual that is pinned to a dashboard.
      fr: Une vignette est un visuel unique épinglé à un tableau de bord.
references:
  - title: Reports in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/consumer/end-user-reports
  - title: Power BI service basics
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/service-basic-concepts
