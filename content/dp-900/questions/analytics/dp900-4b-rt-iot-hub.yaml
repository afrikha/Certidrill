id: dp900-4b-rt-iot-hub
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to connect 50,000 sensors to Azure. Each sensor must have its own identity in the service that receives the telemetry, and the solution must be able to send commands back to the sensors.

    Which service should ingest the telemetry?
  fr: |
    Proseware prévoit de connecter 50 000 capteurs à Azure. Chaque capteur doit avoir sa propre identité dans le service qui reçoit la télémétrie, et la solution doit pouvoir renvoyer des commandes aux capteurs.

    Quel service doit ingérer la télémétrie ?
body:
  options:
    - { id: a, text: "Azure Event Hubs" }
    - { id: b, text: "Azure Stream Analytics" }
    - { id: c, text: "Azure Data Lake Storage Gen2" }
    - { id: d, text: "Azure IoT Hub" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure IoT Hub is a data ingestion service similar to Azure Event Hubs, but optimized for IoT devices. It keeps an identity registry in which every device has an entry, receives device-to-cloud telemetry, and supports communication from the cloud to the devices, for example to send a command.
    fr: |
      Azure IoT Hub est un service d'ingestion de données semblable à Azure Event Hubs, mais optimisé pour les appareils IoT. Il tient un registre des identités dans lequel chaque appareil possède une entrée, reçoit la télémétrie envoyée par les appareils vers le cloud, et prend en charge la communication du cloud vers les appareils, par exemple pour envoyer une commande.
  options:
    a:
      en: "Azure Event Hubs ingests high volumes of events, but it isn't the service optimized for IoT devices: device identities and commands sent to devices are features of Azure IoT Hub."
      fr: "Azure Event Hubs ingère de gros volumes d'événements, mais ce n'est pas le service optimisé pour les appareils IoT : les identités d'appareils et les commandes envoyées aux appareils sont des fonctionnalités d'Azure IoT Hub."
    b:
      en: Azure Stream Analytics processes the telemetry after it has been ingested; it reads it from a source such as Azure IoT Hub.
      fr: "Azure Stream Analytics traite la télémétrie une fois qu'elle a été ingérée ; il la lit dans une source comme Azure IoT Hub."
    c:
      en: Azure Data Lake Storage Gen2 stores files. It doesn't manage devices or communicate with them.
      fr: Azure Data Lake Storage Gen2 stocke des fichiers. Il ne gère pas les appareils et ne communique pas avec eux.
references:
  - title: What is Azure IoT Hub?
    url: https://learn.microsoft.com/en-us/azure/iot-hub/iot-concepts-and-iot-hub
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
