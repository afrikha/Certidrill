id: dp900-4b-rt-fabric-workload
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft Fabric workload is designed to analyze data as it arrives, such as readings from IoT devices, application logs and clickstreams?
  fr: |
    Quelle charge de travail de Microsoft Fabric est conçue pour analyser les données dès leur arrivée, comme les relevés d'appareils IoT, les journaux d'applications et les flux de clics ?
body:
  options:
    - { id: a, text: "Data Factory" }
    - { id: b, text: "Real-Time Intelligence" }
    - { id: c, text: "Data Science" }
    - { id: d, text: "Data Warehouse" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Real-Time Intelligence is the Fabric workload for data in motion. It covers the ingestion of streaming events, their storage and querying, live dashboards and automated actions, for solutions that react to events as they happen instead of on a schedule.
    fr: |
      Real-Time Intelligence est la charge de travail de Fabric pour les données en mouvement. Elle couvre l'ingestion des événements de streaming, leur stockage et leur interrogation, les tableaux de bord en direct et les actions automatisées, pour des solutions qui réagissent aux événements au moment où ils se produisent plutôt que selon une planification.
  options:
    a:
      en: Data Factory provides data integration, with pipelines and dataflows that ingest, prepare and transform data, typically in batches.
      fr: Data Factory assure l'intégration des données, avec des pipelines et des dataflows qui ingèrent, préparent et transforment les données, en général par lots.
    c:
      en: Data Science is used to build, deploy and operationalize machine learning models.
      fr: Data Science sert à créer, déployer et mettre en production des modèles de machine learning.
    d:
      en: Data Warehouse provides SQL-based relational data warehousing for analytical queries on stored data.
      fr: Data Warehouse fournit un entrepôt de données relationnel basé sur SQL, pour des requêtes analytiques sur des données stockées.
references:
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
  - title: What is Real-Time Intelligence?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
