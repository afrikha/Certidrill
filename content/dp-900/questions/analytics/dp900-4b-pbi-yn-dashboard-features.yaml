id: dp900-4b-pbi-yn-dashboard-features
objective: "4.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about dashboards in the Power BI service, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les tableaux de bord du service Power BI, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can set a data alert on a card tile, to be notified when its value passes a limit.
        fr: Vous pouvez définir une alerte de données sur une vignette de carte, pour être averti quand sa valeur dépasse une limite.
    - id: s2
      text:
        en: Selecting a tile usually opens the report from which the visual was pinned.
        fr: La sélection d'une vignette ouvre généralement le rapport à partir duquel le visuel a été épinglé.
    - id: s3
      text:
        en: The readers of a dashboard filter its tiles with slicers, as they do on a report page.
        fr: Les lecteurs d'un tableau de bord filtrent ses vignettes avec des segments, comme sur une page de rapport.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Data alerts can be set on dashboard tiles that show a single value, such as cards, KPIs and gauges; Power BI then notifies you when the data passes the limit you set. A tile is an entry point: in most cases, selecting it opens the report page on which the visual was created. Filtering and slicing belong to reports; a dashboard can't be filtered or sliced by its readers.
    fr: |
      Les alertes de données se définissent sur les vignettes de tableau de bord qui affichent une seule valeur, comme les cartes, les indicateurs de performance clés (KPI) et les jauges ; Power BI vous avertit alors quand les données dépassent la limite fixée. Une vignette est un point d'entrée : dans la plupart des cas, la sélectionner ouvre la page de rapport sur laquelle le visuel a été créé. Le filtrage et le découpage relèvent des rapports ; les lecteurs d'un tableau de bord ne peuvent ni le filtrer ni le découper.
references:
  - title: Data alerts in the Power BI service
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-set-data-alerts
  - title: Dashboards for business users of the Power BI service
    url: https://learn.microsoft.com/en-us/power-bi/consumer/end-user-dashboards
