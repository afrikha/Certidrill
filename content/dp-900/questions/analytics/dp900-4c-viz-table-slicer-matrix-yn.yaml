id: dp900-4c-viz-table-slicer-matrix-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A page of a Power BI report contains a slicer on the Year field, a matrix whose rows contain the Category and Product fields, and a table. The report author kept the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une page d'un rapport Power BI contient un segment (slicer) sur le champ Year, une matrice dont les lignes contiennent les champs Category et Product, et une table. L'auteur du rapport a conservé les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A selection in the slicer filters the matrix but leaves the table unfiltered.
        fr: Une sélection dans le segment filtre la matrice, mais laisse la table non filtrée.
    - id: s2
      text:
        en: In the matrix, a user can expand a row header to display the next level of a hierarchy.
        fr: Dans la matrice, un utilisateur peut développer un en-tête de ligne pour afficher le niveau suivant d'une hiérarchie.
    - id: s3
      text:
        en: The table presents related values in rows and columns, which lets users read exact values.
        fr: La table présente des valeurs liées en lignes et en colonnes, ce qui permet aux utilisateurs de lire des valeurs exactes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "By default, a slicer filters all the other visuals of its page, so both the matrix and the table show only the selected year. A matrix supports hierarchies: when a row or column header contains several fields, users expand or collapse its levels. A table is a grid of rows and columns that is used to see exact values and to compare many values."
    fr: "Par défaut, un segment filtre tous les autres visuels de sa page : la matrice et la table n'affichent donc que l'année sélectionnée. Une matrice prend en charge les hiérarchies : quand un en-tête de ligne ou de colonne contient plusieurs champs, les utilisateurs en développent ou en réduisent les niveaux. Une table est une grille de lignes et de colonnes qui sert à voir des valeurs exactes et à comparer de nombreuses valeurs."
references:
  - title: Overview of slicers in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-slicers
  - title: Create a Matrix Visual in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-matrix-visual
