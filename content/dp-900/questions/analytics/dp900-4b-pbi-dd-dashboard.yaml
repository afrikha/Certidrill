id: dp900-4b-pbi-dd-dashboard
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Power BI dashboards, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les tableaux de bord Power BI, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A dashboard is created in [[where]].

      A dashboard contains [[what]].
    fr: |
      Un tableau de bord se crée dans [[where]].

      Un tableau de bord contient [[what]].
  slots:
    - id: where
      options:
        - { id: desktop, text: "Power BI Desktop" }
        - { id: builder, text: "Power BI Report Builder" }
        - { id: service, text: { en: "the Power BI service", fr: "le service Power BI" } }
    - id: what
      options:
        - { id: pages, text: { en: "the pages of a single report", fr: "les pages d'un seul rapport" } }
        - { id: tiles, text: { en: "tiles pinned from one or more reports", fr: "des vignettes épinglées depuis un ou plusieurs rapports" } }
        - { id: table, text: { en: "a table that continues over several printed pages", fr: "une table qui se poursuit sur plusieurs pages imprimées" } }
answer:
  values: { where: service, what: tiles }
explanation:
  correct:
    en: |
      Dashboards are a feature of the Power BI service: they aren't available in Power BI Desktop, and Power BI Report Builder creates paginated reports. A dashboard is a single page of tiles, which are visuals pinned from one or more reports. A table that runs over several printed pages is the mark of a paginated report.
    fr: |
      Les tableaux de bord sont une fonctionnalité du service Power BI : ils ne sont pas disponibles dans Power BI Desktop, et Power BI Report Builder crée des rapports paginés. Un tableau de bord est une page unique de vignettes, c'est-à-dire de visuels épinglés depuis un ou plusieurs rapports. Une table qui s'étend sur plusieurs pages imprimées est la marque d'un rapport paginé.
references:
  - title: Introduction to dashboards for Power BI designers
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards
