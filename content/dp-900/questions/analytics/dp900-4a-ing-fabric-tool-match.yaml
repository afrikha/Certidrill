id: dp900-4a-ing-fabric-tool-match
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each ingestion need to the Microsoft Fabric tool that meets it.

    To answer, drag the appropriate tool to each need. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin d'ingestion à l'outil Microsoft Fabric qui y répond.

    Pour répondre, faites glisser l'outil approprié vers chaque besoin. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pipe, text: Pipeline }
    - { id: df, text: Dataflow Gen2 }
    - { id: mir, text: { en: "Mirroring", fr: "Mise en miroir" } }
    - { id: es, text: Eventstream }
    - { id: nb, text: Notebook }
  targets:
    - id: t1
      text: { en: "Ingest events from Azure Event Hubs as they arrive, and filter them before they land in a lakehouse.", fr: "Ingérer les événements d'Azure Event Hubs à mesure qu'ils arrivent et les filtrer avant qu'ils n'atteignent un lakehouse." }
    - id: t2
      text: { en: "Write PySpark code that reads a REST API for which no built-in connector exists.", fr: "Écrire du code PySpark qui lit une API REST pour laquelle il n'existe aucun connecteur intégré." }
    - id: t3
      text: { en: "Run a copy activity, then a stored procedure, then a notebook as one scheduled workflow.", fr: "Exécuter une activité de copie, puis une procédure stockée, puis un notebook dans un seul flux de travail planifié." }
answer:
  mapping: { t1: es, t2: nb, t3: pipe }
explanation:
  correct:
    en: |
      Eventstream connects to streaming sources such as Azure Event Hubs and routes, filters and transforms the events before they land in a Lakehouse or an Eventhouse. A notebook, powered by Apache Spark, is the code-first option when no built-in connector exists. A pipeline chains activities, such as a copy, a stored procedure and a notebook, in one orchestrated workflow.
    fr: |
      Eventstream se connecte à des sources de streaming comme Azure Event Hubs et achemine, filtre et transforme les événements avant qu'ils n'arrivent dans un Lakehouse ou un Eventhouse. Un notebook, qui repose sur Apache Spark, est l'option orientée code quand aucun connecteur intégré n'existe. Un pipeline enchaîne des activités, comme une copie, une procédure stockée et un notebook, dans un seul flux de travail orchestré.
  options:
    df: { en: "A Dataflow Gen2 is the low-code Power Query experience; it involves no PySpark code and doesn't orchestrate other activities.", fr: "Un Dataflow Gen2 est l'expérience Power Query avec peu de code ; il ne comporte pas de code PySpark et n'orchestre pas d'autres activités." }
    mir: { en: "Mirroring continuously replicates an operational database into OneLake; none of the three needs is a database replication.", fr: "La mise en miroir réplique en continu une base de données opérationnelle dans OneLake ; aucun des trois besoins n'est une réplication de base de données." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
