id: dp900-4a-svc-warehouse-tsql
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which language is the primary language for developing and querying a Warehouse in Microsoft Fabric?
  fr: |
    Quel est le langage principal pour développer et interroger un Warehouse dans Microsoft Fabric ?
body:
  options:
    - { id: a, text: "Transact-SQL (T-SQL)" }
    - { id: b, text: "Kusto Query Language (KQL)" }
    - { id: c, text: "Data Analysis Expressions (DAX)" }
    - { id: d, text: PySpark }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Fabric Warehouse is a fully managed relational data warehouse that you query with T-SQL. It is developed primarily with T-SQL, with support for transactions, views, functions and stored procedures.
    fr: |
      Un Warehouse Fabric est un entrepôt de données relationnel entièrement managé que vous interrogez en T-SQL. Il se développe principalement en T-SQL, avec la prise en charge des transactions, des vues, des fonctions et des procédures stockées.
  options:
    b: { en: "KQL is the language of the KQL databases of an Eventhouse, used for real-time data.", fr: "KQL est le langage des bases de données KQL d'un Eventhouse, utilisées pour les données en temps réel." }
    c: { en: "DAX is the formula language for the measures of a semantic model.", fr: "DAX est le langage de formules des mesures d'un modèle sémantique." }
    d: { en: "PySpark is used in Spark notebooks, the main development tool of a Lakehouse.", fr: "PySpark s'utilise dans les notebooks Spark, le principal outil de développement d'un Lakehouse." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Fabric Data Warehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
