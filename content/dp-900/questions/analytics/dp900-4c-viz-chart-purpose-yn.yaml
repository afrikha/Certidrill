id: dp900-4c-viz-chart-purpose-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Power BI visuals, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les visuels Power BI, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A line chart is the appropriate visual to compare the shares of four regions in the total sales of one year.
        fr: Un graphique en courbes est le visuel approprié pour comparer les parts de quatre régions dans le total des ventes d'une année.
    - id: s2
      text:
        en: In a scatter chart, each data point is positioned by two numeric values.
        fr: Dans un nuage de points, chaque point de données est positionné par deux valeurs numériques.
    - id: s3
      text:
        en: A card is the appropriate visual to compare the sales of twelve product categories.
        fr: Une carte (card) est le visuel approprié pour comparer les ventes de douze catégories de produit.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "The shares of a few categories in one total are shown with a pie chart; a line chart is used to examine a trend, usually over time. A scatter chart places each point at the intersection of a value on the horizontal axis and a value on the vertical axis, both numeric. A card displays a single important figure; comparing numeric values across categories calls for a bar chart or a column chart."
    fr: "Les parts de quelques catégories dans un total se montrent avec un graphique en secteurs ; un graphique en courbes sert à examiner une tendance, en général dans le temps. Un nuage de points place chaque point à l'intersection d'une valeur de l'axe horizontal et d'une valeur de l'axe vertical, toutes deux numériques. Une carte affiche un seul chiffre important ; comparer des valeurs numériques entre des catégories demande un graphique à barres ou un histogramme."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Scatter, Bubble, and Dot Plot Charts in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-scatter
