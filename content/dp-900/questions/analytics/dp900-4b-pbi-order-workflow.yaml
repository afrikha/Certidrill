id: dp900-4b-pbi-order-workflow
objective: "4.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An analyst at Woodgrove Bank has sales data in an Excel workbook and in Azure SQL Database. The analyst must give managers a Power BI dashboard that shows the key sales figures.

    Which four actions should the analyst perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une analyste de Woodgrove Bank dispose de données de ventes dans un classeur Excel et dans Azure SQL Database. Elle doit fournir aux responsables un tableau de bord Power BI qui affiche les chiffres clés des ventes.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: pinservice
      text:
        en: In the Power BI service, pin visuals of the report to a dashboard and share the dashboard.
        fr: Dans le service Power BI, épingler des visuels du rapport à un tableau de bord et partager le tableau de bord.
    - id: mobile
      text:
        en: In the Power BI mobile app, create the data model.
        fr: Dans l'application mobile Power BI, créer le modèle de données.
    - id: report
      text:
        en: In Power BI Desktop, create a report from the data model.
        fr: Dans Power BI Desktop, créer un rapport à partir du modèle de données.
    - id: import
      text:
        en: In Power BI Desktop, import the data from both sources and build a data model.
        fr: Dans Power BI Desktop, importer les données des deux sources et construire un modèle de données.
    - id: pindesktop
      text:
        en: In Power BI Desktop, pin visuals of the report to a dashboard.
        fr: Dans Power BI Desktop, épingler des visuels du rapport à un tableau de bord.
    - id: publish
      text:
        en: Publish the report from Power BI Desktop to the Power BI service.
        fr: Publier le rapport depuis Power BI Desktop dans le service Power BI.
answer:
  sequence: [ import, report, publish, pinservice ]
explanation:
  correct:
    en: |
      In the typical Power BI workflow, the analyst first imports data from the sources into Power BI Desktop and organizes it in a data model, then creates a report on that model. The report and its model are published to the Power BI service. Dashboards exist only in the service: there, the analyst pins visuals of the published report to a dashboard and shares it.
    fr: |
      Dans le flux de travail Power BI habituel, l'analyste importe d'abord les données des sources dans Power BI Desktop et les organise dans un modèle de données, puis crée un rapport sur ce modèle. Le rapport et son modèle sont publiés dans le service Power BI. Les tableaux de bord n'existent que dans le service : l'analyste y épingle des visuels du rapport publié à un tableau de bord, puis le partage.
  options:
    mobile:
      en: The mobile apps are for viewing and interacting with content; data models and reports aren't created in them.
      fr: "Les applications mobiles servent à consulter du contenu et à interagir avec lui ; on n'y crée ni modèles de données ni rapports."
    pindesktop:
      en: Dashboards aren't available in Power BI Desktop; visuals are pinned in the Power BI service, after the report has been published.
      fr: "Les tableaux de bord ne sont pas disponibles dans Power BI Desktop ; les visuels s'épinglent dans le service Power BI, une fois le rapport publié."
references:
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
  - title: Introduction to dashboards for Power BI designers
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards
