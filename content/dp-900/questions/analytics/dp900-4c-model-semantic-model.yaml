id: dp900-4c-model-semantic-model
objective: "4.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Power BI and Microsoft Fabric, an analytical model made of related tables is called a [[s1]]. Its numeric values are aggregated by [[s2]], which are entities such as products, customers and time.
    fr: |
      Dans Power BI et Microsoft Fabric, un modèle analytique composé de tables liées est appelé [[s1]]. Ses valeurs numériques sont agrégées selon des [[s2]], qui sont des entités comme les produits, les clients et le temps.
  slots:
    - id: s1
      options:
        - { id: dash, text: { en: "dashboard", fr: "tableau de bord" } }
        - { id: pag, text: { en: "paginated report", fr: "rapport paginé" } }
        - { id: sem, text: { en: "semantic model", fr: "modèle sémantique" } }
        - { id: ws, text: { en: "workspace", fr: "espace de travail" } }
    - id: s2
      options:
        - { id: dim, text: { en: "dimensions", fr: "dimensions" } }
        - { id: meas, text: { en: "measures", fr: "mesures" } }
        - { id: mode, text: { en: "storage modes", fr: "modes de stockage" } }
answer:
  values: { s1: sem, s2: dim }
explanation:
  correct:
    en: "Analytical models are called semantic models in Power BI and Microsoft Fabric. A semantic model defines measures, the numeric values to analyze, and dimensions, the entities by which the measures are aggregated, such as product, customer and time."
    fr: "Les modèles analytiques sont appelés modèles sémantiques dans Power BI et Microsoft Fabric. Un modèle sémantique définit des mesures, les valeurs numériques à analyser, et des dimensions, les entités selon lesquelles les mesures sont agrégées, comme le produit, le client et le temps."
  options:
    dash:
      en: "A dashboard is a single page of tiles pinned from reports; it is a way to present data, not a model."
      fr: "Un tableau de bord est une page unique de vignettes épinglées depuis des rapports ; c'est une façon de présenter les données, pas un modèle."
    pag:
      en: "A paginated report is a precisely formatted, printable document built on data; it is not the model."
      fr: "Un rapport paginé est un document à la mise en forme précise, imprimable, construit sur des données ; ce n'est pas le modèle."
    ws:
      en: "A workspace is the place where semantic models, reports and dashboards are stored and shared."
      fr: "Un espace de travail est l'endroit où les modèles sémantiques, les rapports et les tableaux de bord sont stockés et partagés."
    meas:
      en: "Measures are the numeric values themselves, not the entities by which they are aggregated."
      fr: "Les mesures sont les valeurs numériques elles-mêmes, pas les entités selon lesquelles elles sont agrégées."
    mode:
      en: "A storage mode (Import, DirectQuery, Direct Lake) defines where the data of a table is kept, not how values are grouped."
      fr: "Un mode de stockage (Import, DirectQuery, Direct Lake) définit où les données d'une table sont conservées, pas la façon de regrouper les valeurs."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
