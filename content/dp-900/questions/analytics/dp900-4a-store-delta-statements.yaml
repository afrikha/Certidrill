id: dp900-4a-store-delta-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys plans to store the tables of its lakehouse in the Delta Lake format.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de stocker les tables de son lakehouse au format Delta Lake.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Delta Lake table stores its data in Parquet files.
        fr: Une table Delta Lake stocke ses données dans des fichiers Parquet.
    - id: s2
      text:
        en: The same Delta Lake table can be loaded from batch sources and from streaming sources.
        fr: Une même table Delta Lake peut être chargée à partir de sources par lots et de sources de streaming.
    - id: s3
      text:
        en: Because a lakehouse is based on files, a Delta Lake table applies its schema only when the data is read.
        fr: Comme un lakehouse repose sur des fichiers, une table Delta Lake n'applique son schéma qu'à la lecture des données.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Delta Lake adds relational capabilities on top of Parquet data files, which it extends with a transaction log. It supports both batch-loaded and streaming sources on a single copy of the data. Its tables enforce their schema: data written to a table is validated against it, unlike the schema-on-read approach of a plain data lake.
    fr: |
      Delta Lake ajoute des capacités relationnelles à des fichiers de données Parquet, qu'il complète par un journal des transactions. Il prend en charge des sources chargées par lots et des sources de streaming sur une seule copie des données. Ses tables imposent leur schéma : les données écrites dans une table sont validées par rapport à celui-ci, contrairement à l'approche de schéma sur lecture d'un simple lac de données.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is Delta Lake in Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/
