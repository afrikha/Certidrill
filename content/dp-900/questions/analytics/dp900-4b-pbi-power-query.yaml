id: dp900-4b-pbi-power-query
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Power BI Desktop, you connect to a CSV file. Before the data is loaded into the model, you need to remove unneeded columns, filter rows and change data types.

    What should you use?
  fr: |
    Dans Power BI Desktop, vous vous connectez à un fichier CSV. Avant le chargement des données dans le modèle, vous devez supprimer des colonnes inutiles, filtrer des lignes et modifier des types de données.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The report canvas", fr: "Le canevas du rapport" } }
    - { id: b, text: "Power BI Report Builder" }
    - { id: c, text: { en: "The Visualizations pane", fr: "Le volet Visualisations" } }
    - { id: d, text: { en: "Power Query Editor", fr: "L'Éditeur Power Query" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Power Query Editor is the part of Power BI Desktop in which you clean and shape data, with operations such as removing columns, filtering rows and changing data types. The transformed data is then loaded into the model.
    fr: |
      L'Éditeur Power Query est la partie de Power BI Desktop dans laquelle vous nettoyez et mettez en forme les données, avec des opérations comme la suppression de colonnes, le filtrage de lignes et la modification de types de données. Les données transformées sont ensuite chargées dans le modèle.
  options:
    a:
      en: The report canvas is the area in which you build and arrange the visuals of a report page.
      fr: Le canevas du rapport est la zone dans laquelle vous créez et disposez les visuels d'une page de rapport.
    b:
      en: Power BI Report Builder is a separate tool for creating paginated reports.
      fr: Power BI Report Builder est un outil distinct, qui sert à créer des rapports paginés.
    c:
      en: The Visualizations pane is used to choose and format the visuals of a report, not to transform the data.
      fr: Le volet Visualisations sert à choisir et à mettre en forme les visuels d'un rapport, pas à transformer les données.
references:
  - title: Get started with Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/desktop-getting-started
  - title: What is Power BI?
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/power-bi-overview
