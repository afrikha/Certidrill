id: dp900-4a-ing-adf-vs-fabric-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso is comparing Azure Data Factory with Data Factory in Microsoft Fabric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso compare Azure Data Factory avec Data Factory dans Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To create an Azure Data Factory pipeline, you need a Microsoft Fabric workspace.
        fr: Pour créer un pipeline Azure Data Factory, vous avez besoin d'un espace de travail Microsoft Fabric.
    - id: s2
      text:
        en: Azure Data Factory can connect to on-premises data sources in a hybrid environment.
        fr: Azure Data Factory peut se connecter à des sources de données locales dans un environnement hybride.
    - id: s3
      text:
        en: Azure Data Factory uses linked services where Fabric pipelines use connections.
        fr: Azure Data Factory utilise des services liés là où les pipelines Fabric utilisent des connexions.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Azure Data Factory is the standalone Azure service for data integration pipelines outside Fabric, so it needs no Fabric workspace. It is used, for example, to connect to on-premises sources in a hybrid environment. Both services follow the same pipeline model: Azure Data Factory defines its connection information in linked services, where Fabric uses connections.
    fr: |
      Azure Data Factory est le service Azure autonome pour les pipelines d'intégration de données en dehors de Fabric : il ne nécessite donc aucun espace de travail Fabric. Il sert par exemple à se connecter à des sources locales dans un environnement hybride. Les deux services suivent le même modèle de pipeline : Azure Data Factory définit ses informations de connexion dans des services liés, là où Fabric utilise des connexions.
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Azure Data Factory?
    url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
