id: dp900-4a-svc-fabric-onelake-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders adopts Microsoft Fabric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders adopte Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Power BI semantic model in Direct Lake mode loads data directly from Delta tables in OneLake, without importing a separate copy of the data into the model.
        fr: Un modèle sémantique Power BI en mode Direct Lake charge les données directement à partir des tables Delta de OneLake, sans importer de copie distincte des données dans le modèle.
    - id: s2
      text:
        en: Northwind Traders must create an Azure storage account to host OneLake before the first workspace is used.
        fr: Northwind Traders doit créer un compte de stockage Azure pour héberger OneLake avant d'utiliser le premier espace de travail.
    - id: s3
      text:
        en: Each workspace that the company creates in its tenant has its own separate OneLake.
        fr: Chaque espace de travail que l'entreprise crée dans son locataire dispose de son propre OneLake distinct.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      In Direct Lake mode, a semantic model loads data straight from the Delta tables in OneLake instead of importing a copy. OneLake comes with every Fabric tenant automatically: there is no storage account or other infrastructure to provision. A tenant has a single OneLake, which can't be duplicated: every workspace created in the tenant stores its items in that same OneLake.
    fr: |
      En mode Direct Lake, un modèle sémantique charge les données directement à partir des tables Delta de OneLake au lieu d'en importer une copie. OneLake est fourni automatiquement avec chaque locataire Fabric : il n'y a ni compte de stockage ni autre infrastructure à approvisionner. Un locataire dispose d'un seul OneLake, qui ne peut pas être dupliqué : chaque espace de travail créé dans le locataire stocke ses éléments dans ce même OneLake.
references:
  - title: What is OneLake?
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
