id: dp900-4b-bs-combine-both
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys captures the sales of its web store as a stream of events. The company has the following requirements:

    - A dashboard must show the sales of the last minute.
    - Analysts must compare the weekly sales of the last five years, including the week that just ended.

    Which approach meets both requirements?
  fr: |
    Tailspin Toys capture les ventes de sa boutique en ligne sous la forme d'un flux d'événements. L'entreprise a les exigences suivantes :

    - Un tableau de bord doit afficher les ventes de la dernière minute.
    - Les analystes doivent comparer les ventes hebdomadaires des cinq dernières années, y compris la semaine qui vient de se terminer.

    Quelle approche répond aux deux exigences ?
body:
  options:
    - id: a
      text:
        en: Process the events as a stream only, and show a five-year rolling window on the dashboard.
        fr: Traiter les événements uniquement en flux, et afficher une fenêtre glissante de cinq ans sur le tableau de bord.
    - id: b
      text:
        en: Process the events as a stream for the dashboard, and also store them for batch processing with the historical data.
        fr: Traiter les événements en flux pour le tableau de bord, et les stocker aussi pour un traitement par lots avec les données historiques.
    - id: c
      text:
        en: Load the events in a nightly batch only, and refresh the dashboard after each load.
        fr: Charger les événements uniquement par un lot nocturne, et actualiser le tableau de bord après chaque chargement.
    - id: d
      text:
        en: Process the events as a stream for the dashboard, and discard them once they have been displayed.
        fr: Traiter les événements en flux pour le tableau de bord, et les supprimer une fois qu'ils ont été affichés.
answer: { optionId: b }
explanation:
  correct:
    en: |
      Large-scale solutions usually combine both approaches. Stream processing feeds the real-time dashboard, and the same data is also stored so that a batch process can combine it with the historical data for complex analysis over long periods.
    fr: |
      Les solutions à grande échelle combinent généralement les deux approches. Le traitement de flux alimente le tableau de bord en temps réel, et les mêmes données sont aussi stockées pour qu'un traitement par lots les combine aux données historiques, en vue d'analyses complexes sur de longues périodes.
  options:
    a:
      en: Stream processing works on recent data or a short rolling window and suits simple aggregates; it isn't the tool for an analysis of five years of history.
      fr: "Le traitement de flux travaille sur des données récentes ou une courte fenêtre glissante et convient aux agrégats simples ; ce n'est pas l'outil pour analyser cinq ans d'historique."
    c:
      en: A nightly batch serves the historical analysis, but the dashboard would show data that is up to a day old instead of the last minute.
      fr: Un lot nocturne sert l'analyse historique, mais le tableau de bord afficherait des données vieilles d'une journée au lieu de la dernière minute.
    d:
      en: The dashboard requirement is met, but discarded events can never join the five-year history that the analysts need.
      fr: L'exigence du tableau de bord est satisfaite, mais des événements supprimés ne pourront jamais rejoindre l'historique de cinq ans dont les analystes ont besoin.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
