id: dp900-4c-viz-scatter-correlation
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing analyst wants to find out whether the advertising spend of 200 stores is related to their sales revenue.

    Which visual should the analyst use?
  fr: |
    Une analyste marketing veut savoir si les dépenses publicitaires de 200 magasins sont liées à leur chiffre d'affaires.

    Quel visuel l'analyste doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Column chart", fr: "Histogramme" } }
    - { id: b, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
    - { id: c, text: { en: "Funnel chart", fr: "Graphique en entonnoir" } }
    - { id: d, text: { en: "Scatter chart", fr: "Nuage de points" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A scatter chart places each store at the intersection of two numeric values, here the advertising spend and the revenue. The shape of the cloud of points reveals whether the two measures are correlated."
    fr: "Un nuage de points place chaque magasin à l'intersection de deux valeurs numériques, ici les dépenses publicitaires et le chiffre d'affaires. La forme du nuage révèle si les deux mesures sont corrélées."
  options:
    a:
      en: "A column chart compares a numeric value across discrete categories; it does not reveal the relationship between two measures."
      fr: "Un histogramme compare une valeur numérique entre des catégories discrètes ; il ne révèle pas la relation entre deux mesures."
    b:
      en: "A pie chart shows the parts of a total for a few categories, not a correlation."
      fr: "Un graphique en secteurs montre les parts d'un total pour quelques catégories, pas une corrélation."
    c:
      en: "A funnel chart follows the stages of a sequential process, such as a sales pipeline."
      fr: "Un graphique en entonnoir suit les étapes d'un processus séquentiel, comme un pipeline de ventes."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Scatter, Bubble, and Dot Plot Charts in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-scatter
