id: dp900-4b-rt-yn-sinks
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about a stream processing solution, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur une solution de traitement de flux, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Power BI can be the sink of the solution, to show the results in real time.
        fr: Power BI peut être le récepteur (sink) de la solution, pour afficher les résultats en temps réel.
    - id: s2
      text:
        en: Azure IoT Hub runs the queries that aggregate device telemetry over time windows.
        fr: Azure IoT Hub exécute les requêtes qui agrègent la télémétrie des appareils sur des fenêtres de temps.
    - id: s3
      text:
        en: The results can be kept as files in a data lake, such as OneLake or Azure Data Lake Storage Gen2.
        fr: Les résultats peuvent être conservés sous forme de fichiers dans un lac de données, comme OneLake ou Azure Data Lake Storage Gen2.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The results of stream processing are written to a sink. Power BI is a sink for real-time visualizations in reports and dashboards, and Azure Data Lake Storage Gen2, OneLake or Azure Blob storage keep the results as files. Azure IoT Hub is a source: it ingests the telemetry of IoT devices, and the aggregation is done by a processing technology such as Azure Stream Analytics, Spark Structured Streaming or Fabric Real-Time Intelligence.
    fr: |
      Les résultats d'un traitement de flux sont écrits dans un récepteur (sink). Power BI est un récepteur pour des visualisations en temps réel dans des rapports et des tableaux de bord, et Azure Data Lake Storage Gen2, OneLake ou le Stockage Blob Azure conservent les résultats sous forme de fichiers. Azure IoT Hub est une source : il ingère la télémétrie d'appareils IoT, et l'agrégation est assurée par une technologie de traitement comme Azure Stream Analytics, Spark Structured Streaming ou Real-Time Intelligence dans Fabric.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
