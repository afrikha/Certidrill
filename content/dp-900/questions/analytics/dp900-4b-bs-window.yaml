id: dp900-4b-bs-window
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming query on sensor data continuously calculates the number of readings received during each one-minute period.

    In stream processing, what is each of these time periods called?
  fr: |
    Une requête de streaming sur des données de capteurs calcule en continu le nombre de relevés reçus pendant chaque période d'une minute.

    Dans le traitement de flux, comment appelle-t-on chacune de ces périodes ?
body:
  options:
    - id: a
      text: { en: "A sink", fr: "Un récepteur (sink)" }
    - id: b
      text: { en: "A source", fr: "Une source" }
    - id: c
      text: { en: "A window", fr: "Une fenêtre" }
    - id: d
      text: { en: "A schedule", fr: "Une planification" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The query of a stream processing solution aggregates values over time-based periods called windows, for example the number of sensor readings per minute. Because a stream never ends, an aggregate only makes sense over such a period.
    fr: |
      La requête d'une solution de traitement de flux agrège des valeurs sur des périodes temporelles appelées fenêtres, par exemple le nombre de relevés de capteurs par minute. Comme un flux ne se termine jamais, un agrégat n'a de sens que sur une telle période.
  options:
    a:
      en: A sink is the output to which the results of the query are written, such as a file, a table or a dashboard.
      fr: Un récepteur (sink) est la sortie dans laquelle les résultats de la requête sont écrits, par exemple un fichier, une table ou un tableau de bord.
    b:
      en: A source is where the events are captured before they are processed, for example a queue.
      fr: Une source est l'endroit où les événements sont capturés avant d'être traités, par exemple une file d'attente.
    d:
      en: A schedule starts a batch job at fixed times; it isn't the period over which a streaming query aggregates.
      fr: Une planification démarre un travail par lots à heures fixes ; ce n'est pas la période sur laquelle une requête de streaming agrège.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
