id: dp900-4b-bs-dd-latency
objective: "4.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In batch processing, the latency is typically [[batch]].

      In stream processing, the latency is typically [[stream]].
    fr: |
      Dans le traitement par lots, la latence est généralement [[batch]].

      Dans le traitement de flux, la latence est généralement [[stream]].
  slots:
    - id: batch
      options:
        - { id: ms, text: { en: "a few milliseconds", fr: "de quelques millisecondes" } }
        - { id: sec, text: { en: "a few seconds", fr: "de quelques secondes" } }
        - { id: hours, text: { en: "a few hours", fr: "de quelques heures" } }
    - id: stream
      options:
        - { id: day, text: { en: "about one day", fr: "d'environ une journée" } }
        - { id: secms, text: { en: "a few seconds or milliseconds", fr: "de quelques secondes ou millisecondes" } }
        - { id: hours, text: { en: "a few hours", fr: "de quelques heures" } }
answer:
  values: { batch: hours, stream: secms }
explanation:
  correct:
    en: |
      Latency is the time taken for the data to be received and processed. A batch waits for the data to be collected and is then processed as a whole, so its latency is typically a few hours. Stream processing handles each piece of data on arrival, with a latency in the order of seconds or milliseconds.
    fr: |
      La latence est le temps nécessaire pour que les données soient reçues et traitées. Un lot attend que les données soient collectées, puis il est traité en bloc : sa latence est généralement de quelques heures. Le traitement de flux traite chaque donnée à son arrivée, avec une latence de l'ordre de quelques secondes ou millisecondes.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
