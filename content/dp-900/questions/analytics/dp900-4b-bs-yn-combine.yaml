id: dp900-4b-bs-yn-combine
objective: "4.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single analytics solution can combine batch processing and stream processing.
        fr: Une même solution d'analytique peut combiner le traitement par lots et le traitement de flux.
    - id: s2
      text:
        en: Sensor data that is loaded every night into a data warehouse and analyzed the next morning is processed as a stream.
        fr: Des données de capteurs chargées chaque nuit dans un entrepôt de données et analysées le lendemain matin sont traitées en flux.
    - id: s3
      text:
        en: Data captured by a streaming technology can be stored and processed later as a batch.
        fr: Des données capturées par une technologie de streaming peuvent être stockées et traitées plus tard par lots.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Many large-scale solutions include a mix of batch and stream processing, for historical and for real-time analysis. Sensor data that waits for a nightly load is processed as a batch, even though the sensors emit it continuously: what counts is when the data is processed. Streaming technologies are also commonly used only to capture real-time data and store it for later batch processing.
    fr: |
      De nombreuses solutions à grande échelle mêlent traitement par lots et traitement de flux, pour l'analyse historique et pour l'analyse en temps réel. Des données de capteurs qui attendent un chargement nocturne sont traitées par lots, même si les capteurs les émettent en continu : ce qui compte, c'est le moment où les données sont traitées. Il est aussi courant d'utiliser les technologies de streaming uniquement pour capturer des données en temps réel et les stocker en vue d'un traitement par lots ultérieur.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
