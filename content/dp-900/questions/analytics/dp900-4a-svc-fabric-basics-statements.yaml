id: dp900-4a-svc-fabric-basics-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are describing Microsoft Fabric to a project team.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous décrivez Microsoft Fabric à une équipe de projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Lakehouse and a Warehouse in Fabric both store their data in OneLake.
        fr: Dans Fabric, un Lakehouse et un Warehouse stockent tous deux leurs données dans OneLake.
    - id: s2
      text:
        en: Before you can use Fabric, you must deploy and manage the virtual machines that run its workloads.
        fr: Avant de pouvoir utiliser Fabric, vous devez déployer et gérer les machines virtuelles qui exécutent ses charges de travail.
    - id: s3
      text:
        en: Power BI is one of the workloads of Microsoft Fabric.
        fr: Power BI est l'une des charges de travail de Microsoft Fabric.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      All Fabric workloads share OneLake: the data of a Lakehouse and the data of a Warehouse are both stored there. Fabric is delivered as software as a service, so there is no infrastructure for you to deploy or manage. Power BI is the Fabric workload that delivers semantic models, reports and dashboards.
    fr: |
      Toutes les charges de travail de Fabric partagent OneLake : les données d'un Lakehouse comme celles d'un Warehouse y sont stockées. Fabric est fourni en tant que logiciel en tant que service : vous n'avez aucune infrastructure à déployer ni à gérer. Power BI est la charge de travail de Fabric qui fournit les modèles sémantiques, les rapports et les tableaux de bord.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
