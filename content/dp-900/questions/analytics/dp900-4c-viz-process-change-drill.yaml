id: dp900-4c-viz-process-change-drill
objective: "4.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the Power BI visual that meets it.

    To answer, drag the appropriate visual to each requirement. Each visual may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin au visuel Power BI qui y répond.

    Pour répondre, faites glisser le visuel approprié vers chaque besoin. Chaque visuel peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: funnel, text: { en: "Funnel chart", fr: "Graphique en entonnoir" } }
    - { id: waterfall, text: { en: "Waterfall chart", fr: "Graphique en cascade" } }
    - { id: tree, text: { en: "Decomposition tree", fr: "Arborescence de décomposition" } }
    - { id: treemap, text: { en: "Treemap", fr: "Treemap" } }
    - { id: scatter, text: { en: "Scatter chart", fr: "Nuage de points" } }
  targets:
    - id: t1
      text: { en: "Show how many opportunities remain at each stage of a sales pipeline, from the first contact to the signed contract.", fr: "Montrer combien d'opportunités restent à chaque étape d'un pipeline de ventes, du premier contact au contrat signé." }
    - id: t2
      text: { en: "Explain how the gains and losses of each month lead from the opening balance to the closing balance of the year.", fr: "Expliquer comment les gains et les pertes de chaque mois mènent du solde d'ouverture au solde de clôture de l'année." }
    - id: t3
      text: { en: "Let users drill down into total sales across several dimensions, in the order that they choose, to see what contributes to the total.", fr: "Permettre aux utilisateurs d'explorer le total des ventes selon plusieurs dimensions, dans l'ordre de leur choix, pour voir ce qui contribue au total." }
answer:
  mapping: { t1: funnel, t2: waterfall, t3: tree }
explanation:
  correct:
    en: "A funnel chart visualizes a sequential process whose stages flow from one to the next, such as a sales pipeline. A waterfall chart shows a running total as values are added or subtracted, which explains how positive and negative changes affect an initial value. A decomposition tree lets users drill into a value across multiple dimensions in any order. A treemap shows the proportions of hierarchical data as nested rectangles, and a scatter chart shows the relationship between two numeric measures."
    fr: "Un graphique en entonnoir représente un processus séquentiel dont les étapes s'enchaînent, comme un pipeline de ventes. Un graphique en cascade montre un total cumulé à mesure que des valeurs sont ajoutées ou soustraites, ce qui explique comment des variations positives et négatives modifient une valeur initiale. Une arborescence de décomposition permet d'explorer une valeur selon plusieurs dimensions, dans n'importe quel ordre. Un treemap montre les proportions de données hiérarchiques sous forme de rectangles imbriqués, et un nuage de points montre la relation entre deux mesures numériques."
references:
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
