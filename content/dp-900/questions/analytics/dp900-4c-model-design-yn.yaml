id: dp900-4c-model-design-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You build a semantic model in Power BI Desktop. The model uses Import mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous construisez un modèle sémantique dans Power BI Desktop. Le modèle utilise le mode Import.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The model can contain tables imported from more than one data source.
        fr: Le modèle peut contenir des tables importées depuis plusieurs sources de données.
    - id: s2
      text:
        en: In the Model view, you can set the data type and the display format of a column.
        fr: Dans la vue Modèle, vous pouvez définir le type de données et le format d'affichage d'une colonne.
    - id: s3
      text:
        en: The totals of every level of a hierarchy are calculated during the data refresh and stored in the model.
        fr: Les totaux de chaque niveau d'une hiérarchie sont calculés pendant l'actualisation des données et stockés dans le modèle.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A Power BI semantic model is defined from tables imported from one or more data sources. The Model view is where you create relationships and hierarchies and set data types and display formats. In Import mode the rows are kept in an in-memory columnar store, but the aggregations are calculated at query time: the totals of the levels of a hierarchy are not stored in advance."
    fr: "Un modèle sémantique Power BI se définit à partir de tables importées depuis une ou plusieurs sources de données. La vue Modèle est l'endroit où vous créez les relations et les hiérarchies et où vous définissez les types de données et les formats d'affichage. En mode Import, les lignes sont conservées dans un stockage en mémoire orienté colonnes, mais les agrégations sont calculées au moment de la requête : les totaux des niveaux d'une hiérarchie ne sont pas stockés à l'avance."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
