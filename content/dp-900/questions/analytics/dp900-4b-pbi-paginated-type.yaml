id: dp900-4b-pbi-paginated-type
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys must print 2,000 invoices each month. Each invoice must have an exact page layout, and a long table of invoice lines must continue on the following pages with all its rows.

    Which type of Power BI content should you create?
  fr: |
    Wingtip Toys doit imprimer 2 000 factures chaque mois. Chaque facture doit avoir une mise en page exacte, et une longue table de lignes de facture doit se poursuivre sur les pages suivantes avec toutes ses lignes.

    Quel type de contenu Power BI devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A dashboard", fr: "Un tableau de bord" } }
    - { id: b, text: { en: "An app", fr: "Une application" } }
    - { id: c, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
    - { id: d, text: { en: "A paginated report", fr: "Un rapport paginé" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Paginated reports are designed to be printed or shared as documents: the page layout is controlled exactly, and a table shows all its data even when it runs over several pages. They are the answer for invoices and similar documents, and they are created with Power BI Report Builder.
    fr: |
      Les rapports paginés sont conçus pour être imprimés ou partagés comme des documents : la mise en page est contrôlée avec précision, et une table affiche toutes ses données même quand elle s'étend sur plusieurs pages. Ils répondent au besoin pour des factures et des documents similaires, et se créent avec Power BI Report Builder.
  options:
    a:
      en: A dashboard is a single page of tiles for monitoring key figures on screen, not a printable multi-page document.
      fr: Un tableau de bord est une page unique de vignettes pour suivre des chiffres clés à l'écran, pas un document imprimable de plusieurs pages.
    b:
      en: An app groups dashboards and reports to distribute them; it isn't a type of report.
      fr: "Une application regroupe des tableaux de bord et des rapports pour les distribuer ; ce n'est pas un type de rapport."
    c:
      en: A semantic model holds the data on which reports are built; it has no page layout.
      fr: "Un modèle sémantique contient les données sur lesquelles les rapports sont construits ; il n'a pas de mise en page."
references:
  - title: What are paginated reports in Power BI?
    url: https://learn.microsoft.com/en-us/power-bi/paginated-reports/paginated-reports-report-builder-power-bi
