id: dp900-4a-ing-spark-distributed
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team must process several terabytes of log files in parallel by spreading the work across the nodes of a cluster.

    Which technology is designed for this type of processing?
  fr: |
    Une équipe d'ingénierie des données doit traiter plusieurs téraoctets de fichiers journaux en parallèle en répartissant le travail entre les nœuds d'un cluster.

    Quelle technologie est conçue pour ce type de traitement ?
body:
  options:
    - { id: a, text: { en: "Data Analysis Expressions (DAX)", fr: "Data Analysis Expressions (DAX)" } }
    - { id: b, text: { en: "Power Query", fr: "Power Query" } }
    - { id: c, text: { en: "A stored procedure in a transactional database", fr: "Une procédure stockée dans une base de données transactionnelle" } }
    - { id: d, text: { en: "Apache Spark", fr: "Apache Spark" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Large-scale data processing is usually performed by distributed systems that handle high volumes of data in parallel on multi-node clusters. Apache Spark is such an engine, and both Microsoft Fabric and Azure Databricks use it.
    fr: |
      Le traitement de données à grande échelle est généralement confié à des systèmes distribués qui traitent de gros volumes en parallèle sur des clusters à plusieurs nœuds. Apache Spark est un moteur de ce type, utilisé par Microsoft Fabric comme par Azure Databricks.
  options:
    a: { en: "DAX is a formula language for the calculations of a semantic model, not a processing engine for files.", fr: "DAX est un langage de formules pour les calculs d'un modèle sémantique, pas un moteur de traitement de fichiers." }
    b: { en: "Power Query is the low-code experience for defining transformations, for example in Dataflows Gen2; it isn't a cluster engine.", fr: "Power Query est l'expérience avec peu de code qui sert à définir des transformations, par exemple dans Dataflows Gen2 ; ce n'est pas un moteur de cluster." }
    c: { en: "A stored procedure runs inside one database engine and doesn't spread file processing across a cluster.", fr: "Une procédure stockée s'exécute dans un seul moteur de base de données et ne répartit pas le traitement de fichiers sur un cluster." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
