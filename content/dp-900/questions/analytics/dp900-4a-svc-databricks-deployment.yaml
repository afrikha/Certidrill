id: dp900-4a-svc-databricks-deployment
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Databricks runs as a managed service in [[where]] and uses [[fmt]] as its native storage format.
    fr: |
      Azure Databricks s'exécute comme un service managé dans [[where]] et utilise [[fmt]] comme format de stockage natif.
  slots:
    - id: where
      options:
        - { id: fabric, text: { en: "a Microsoft Fabric capacity", fr: "une capacité Microsoft Fabric" } }
        - { id: sub, text: { en: "your Azure subscription", fr: "votre abonnement Azure" } }
        - { id: onprem, text: { en: "your on-premises datacenter", fr: "votre centre de données local" } }
        - { id: pbi, text: { en: "a Power BI workspace", fr: "un espace de travail Power BI" } }
    - id: fmt
      options:
        - { id: avro, text: Avro }
        - { id: xml, text: XML }
        - { id: csv, text: CSV }
        - { id: delta, text: Delta Lake }
answer:
  values: { where: sub, fmt: delta }
explanation:
  correct:
    en: |
      Azure Databricks runs as a managed service inside your Azure subscription. It uses Delta Lake as its native open storage format, which gives every table transaction support, schema enforcement and versioning.
    fr: |
      Azure Databricks s'exécute comme un service managé dans votre abonnement Azure. Il utilise Delta Lake comme format de stockage ouvert natif, ce qui apporte à chaque table la prise en charge des transactions, l'application du schéma et la gestion des versions.
  options:
    fabric: { en: "A Fabric capacity runs Microsoft Fabric workloads; Azure Databricks is a separate Azure service.", fr: "Une capacité Fabric exécute les charges de travail de Microsoft Fabric ; Azure Databricks est un service Azure distinct." }
    csv: { en: "CSV files can be ingested, but tables are stored in Delta Lake unless you specify otherwise.", fr: "Des fichiers CSV peuvent être ingérés, mais les tables sont stockées en Delta Lake, sauf indication contraire." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Delta Lake in Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/
