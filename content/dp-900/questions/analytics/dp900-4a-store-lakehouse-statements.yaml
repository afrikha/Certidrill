id: dp900-4a-store-lakehouse-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is evaluating a data lakehouse as its analytical data store.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam évalue un data lakehouse comme magasin de données analytique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In a lakehouse, the same copy of the data can be processed with Apache Spark and queried with SQL.
        fr: Dans un lakehouse, la même copie des données peut être traitée avec Apache Spark et interrogée en SQL.
    - id: s2
      text:
        en: A lakehouse keeps its data in a relational database engine instead of in files.
        fr: Un lakehouse conserve ses données dans un moteur de base de données relationnelle plutôt que dans des fichiers.
    - id: s3
      text:
        en: To query the data of a lakehouse with SQL, the data must first be loaded into a separate data warehouse.
        fr: Pour interroger les données d'un lakehouse en SQL, il faut d'abord les charger dans un entrepôt de données distinct.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A data lakehouse is a hybrid store that combines features of a data lake and of a data warehouse: the raw data stays as files in a data lake, and a SQL analytics endpoint exposes those files as tables that can be queried with SQL. One copy of the data therefore serves Spark processing and SQL analysis, with no separate relational database or data warehouse to load.
    fr: |
      Un data lakehouse est un magasin hybride qui combine des fonctionnalités d'un lac de données et d'un entrepôt de données : les données brutes restent sous forme de fichiers dans un lac de données, et un point de terminaison d'analytique SQL expose ces fichiers sous forme de tables interrogeables en SQL. Une seule copie des données sert donc au traitement Spark et à l'analyse SQL, sans base de données relationnelle ni entrepôt de données distinct à charger.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is a lakehouse in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview
