id: dp900-4a-ing-adf-standalone
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys doesn't use Microsoft Fabric. The company needs an Azure service in which to build pipelines that copy data from on-premises SQL Server databases to Azure SQL Database.

    Which service should the company use?
  fr: |
    Tailspin Toys n'utilise pas Microsoft Fabric. L'entreprise a besoin d'un service Azure dans lequel créer des pipelines qui copient des données de bases de données SQL Server locales vers Azure SQL Database.

    Quel service l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Dataflows Gen2 in Fabric Data Factory", fr: "Les Dataflows Gen2 de Fabric Data Factory" } }
    - { id: b, text: { en: "OneLake shortcuts", fr: "Les raccourcis OneLake" } }
    - { id: c, text: { en: "Power BI", fr: "Power BI" } }
    - { id: d, text: { en: "Azure Data Factory", fr: "Azure Data Factory" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Data Factory is the standalone Azure service for building data integration pipelines outside Fabric. It suits scenarios such as loading Azure SQL Database or connecting to on-premises sources in a hybrid environment.
    fr: |
      Azure Data Factory est le service Azure autonome qui sert à créer des pipelines d'intégration de données en dehors de Fabric. Il convient à des scénarios comme le chargement d'Azure SQL Database ou la connexion à des sources locales dans un environnement hybride.
  options:
    a: { en: "Dataflows Gen2 are part of Microsoft Fabric, which the company doesn't use.", fr: "Les Dataflows Gen2 font partie de Microsoft Fabric, que l'entreprise n'utilise pas." }
    b: { en: "Shortcuts are a OneLake feature of Fabric, and they reference data instead of copying it.", fr: "Les raccourcis sont une fonctionnalité OneLake de Fabric, et ils référencent des données au lieu de les copier." }
    c: { en: "Power BI builds semantic models, reports and dashboards; it isn't a pipeline service.", fr: "Power BI sert à créer des modèles sémantiques, des rapports et des tableaux de bord ; ce n'est pas un service de pipelines." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Azure Data Factory?
    url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
