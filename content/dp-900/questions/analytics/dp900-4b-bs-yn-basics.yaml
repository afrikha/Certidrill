id: dp900-4b-bs-yn-basics
objective: "4.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Batch processing handles each record individually at the moment it is produced.
        fr: Le traitement par lots traite chaque enregistrement individuellement au moment où il est produit.
    - id: s2
      text:
        en: Stream processing suits time-critical tasks, such as raising an alarm when a sensor detects smoke.
        fr: Le traitement de flux convient aux tâches urgentes, comme déclencher une alarme quand un capteur détecte de la fumée.
    - id: s3
      text:
        en: Batch processing typically has a higher latency than stream processing.
        fr: Le traitement par lots a généralement une latence plus élevée que le traitement de flux.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Batch processing collects and stores records, then processes them together; handling each record when it is produced is stream processing. Stream processing is ideal for time-critical operations that need an instant response, such as a system that monitors a building for smoke and heat. The latency of a batch is typically a few hours, whereas a stream is processed within seconds or milliseconds.
    fr: |
      Le traitement par lots collecte et stocke les enregistrements, puis les traite ensemble ; traiter chaque enregistrement dès qu'il est produit, c'est le traitement de flux. Le traitement de flux est idéal pour les opérations urgentes qui exigent une réponse instantanée, comme un système qui surveille la fumée et la chaleur dans un bâtiment. La latence d'un lot est généralement de quelques heures, alors qu'un flux est traité en quelques secondes ou millisecondes.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
