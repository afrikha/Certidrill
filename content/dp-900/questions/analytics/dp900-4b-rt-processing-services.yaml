id: dp900-4b-rt-processing-services
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You design a streaming solution. You need to choose the technology that runs the query that aggregates the events as they arrive.

    Which two technologies can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez une solution de streaming. Vous devez choisir la technologie qui exécute la requête agrégeant les événements à mesure qu'ils arrivent.

    Quelles sont les deux technologies que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure Event Hubs" }
    - { id: b, text: "Azure Stream Analytics" }
    - { id: c, text: "Azure IoT Hub" }
    - { id: d, text: "Spark Structured Streaming" }
    - { id: e, text: "Azure Data Lake Storage Gen2" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Ingestion and processing are separate stages. Azure Stream Analytics runs a perpetual query in a streaming job, and Spark Structured Streaming runs a query on a dataframe that keeps receiving the incoming data; both can aggregate events over time windows.
    fr: |
      L'ingestion et le traitement sont des étapes distinctes. Azure Stream Analytics exécute une requête perpétuelle dans un travail de streaming, et Spark Structured Streaming exécute une requête sur un dataframe qui reçoit sans cesse les données entrantes ; les deux peuvent agréger des événements sur des fenêtres de temps.
  options:
    a:
      en: Azure Event Hubs receives and queues the events; it is a source, or a sink, for the technology that runs the query.
      fr: "Azure Event Hubs reçoit les événements et les met en file d'attente ; c'est une source, ou un récepteur (sink), pour la technologie qui exécute la requête."
    c:
      en: Azure IoT Hub receives the telemetry of IoT devices; it is a source and doesn't aggregate the events.
      fr: "Azure IoT Hub reçoit la télémétrie d'appareils IoT ; c'est une source, qui n'agrège pas les événements."
    e:
      en: Azure Data Lake Storage Gen2 stores files. It can be a source or a sink of the solution, not the query engine.
      fr: Azure Data Lake Storage Gen2 stocke des fichiers. Il peut être une source ou un récepteur (sink) de la solution, pas le moteur de requête.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
