id: dp900-4c-viz-kpi-target-trend
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A single visual of a report page must show the revenue of the current year, the distance between this revenue and the revenue target and, in the background, the trend of the revenue by month.

    Which visual should you use?
  fr: |
    Un seul visuel d'une page de rapport doit afficher le chiffre d'affaires de l'année en cours, l'écart entre ce chiffre d'affaires et l'objectif de chiffre d'affaires et, en arrière-plan, la tendance du chiffre d'affaires par mois.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Gauge", fr: "Jauge" } }
    - { id: b, text: { en: "KPI", fr: "Indicateur de performance clé (KPI)" } }
    - { id: c, text: { en: "Card", fr: "Carte (card)" } }
    - { id: d, text: { en: "Line chart", fr: "Graphique en courbes" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A KPI visual combines three fields: a value (the indicator), a target and a trend axis such as the month. It displays the indicator, the distance to the goal and the trend of the indicator in the background."
    fr: "Un visuel KPI combine trois champs : une valeur (l'indicateur), une cible et un axe de tendance comme le mois. Il affiche l'indicateur, l'écart par rapport à l'objectif et, en arrière-plan, la tendance de l'indicateur."
  options:
    a:
      en: "A gauge shows a value and its target on an arc, but it has no trend over time."
      fr: "Une jauge montre une valeur et sa cible sur un arc, mais elle n'affiche pas de tendance dans le temps."
    c:
      en: "A card highlights a single figure; it does not show the trend of that figure by month."
      fr: "Une carte met en avant un seul chiffre ; elle ne montre pas la tendance de ce chiffre par mois."
    d:
      en: "A line chart shows the trend by month, but not the distance between the yearly total and its target."
      fr: "Un graphique en courbes montre la tendance par mois, mais pas l'écart entre le total annuel et son objectif."
references:
  - title: Key Performance Indicator (KPI) visuals
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-kpi
  - title: Radial Gauge Charts in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-radial-gauge-charts
