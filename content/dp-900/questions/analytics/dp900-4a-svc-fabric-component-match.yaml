id: dp900-4a-svc-fabric-component-match
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each task to the Microsoft Fabric component that performs it.

    To answer, drag the appropriate component to each task. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque tâche au composant de Microsoft Fabric qui l'effectue.

    Pour répondre, faites glisser le composant approprié vers chaque tâche. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lh, text: Lakehouse }
    - { id: rti, text: Real-Time Intelligence }
    - { id: wh, text: Warehouse }
    - { id: pbi, text: Power BI }
    - { id: df, text: Data Factory }
  targets:
    - id: t1
      text: { en: "Build and schedule pipelines and low-code transformations that ingest data.", fr: "Créer et planifier des pipelines et des transformations avec peu de code qui ingèrent des données." }
    - id: t2
      text: { en: "Analyze streaming data, logs, and telemetry.", fr: "Analyser des données de streaming, des journaux et de la télémétrie." }
    - id: t3
      text: { en: "Deliver semantic models, reports, and dashboards.", fr: "Fournir des modèles sémantiques, des rapports et des tableaux de bord." }
answer:
  mapping: { t1: df, t2: rti, t3: pbi }
explanation:
  correct:
    en: |
      Fabric Data Factory builds and schedules pipelines and low-code transformations (Dataflows Gen2) for data ingestion and movement. Real-Time Intelligence is the Fabric workload for analytics on streaming data, logs and telemetry. Power BI delivers semantic models, reports and dashboards.
    fr: |
      Fabric Data Factory crée et planifie des pipelines et des transformations avec peu de code (Dataflows Gen2) pour l'ingestion et le déplacement des données. Real-Time Intelligence est la charge de travail de Fabric pour l'analytique sur les données de streaming, les journaux et la télémétrie. Power BI fournit des modèles sémantiques, des rapports et des tableaux de bord.
  options:
    lh: { en: "A Lakehouse stores Delta Lake tables and files in OneLake; it is a data store.", fr: "Un Lakehouse stocke des tables Delta Lake et des fichiers dans OneLake ; c'est un magasin de données." }
    wh: { en: "A Warehouse is the relational data warehouse queried with T-SQL; it is a data store.", fr: "Un Warehouse est l'entrepôt de données relationnel interrogé en T-SQL ; c'est un magasin de données." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
