id: dp900-4a-svc-fabric-lakehouse
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Data scientists at Proseware use Spark notebooks in Microsoft Fabric to work with a mix of semi-structured files and Delta Lake tables for machine learning. Analysts must also read the tables through SQL.

    Which Fabric item should Proseware use to store the data?
  fr: |
    Des scientifiques des données de Proseware utilisent des notebooks Spark dans Microsoft Fabric pour travailler sur un mélange de fichiers semi-structurés et de tables Delta Lake à des fins de machine learning. Des analystes doivent aussi lire les tables en SQL.

    Quel élément Fabric Proseware doit-elle utiliser pour stocker les données ?
body:
  options:
    - { id: a, text: { en: "A Warehouse", fr: "Un Warehouse" } }
    - { id: b, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
    - { id: c, text: { en: "A Lakehouse", fr: "Un Lakehouse" } }
    - { id: d, text: { en: "A pipeline", fr: "Un pipeline" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Fabric Lakehouse stores data in Delta Lake format on OneLake, supports notebooks and Spark for data science, and exposes a SQL analytics endpoint. It is the choice for mixed or semi-structured data and for machine-learning workflows.
    fr: |
      Un Lakehouse Fabric stocke les données au format Delta Lake sur OneLake, prend en charge les notebooks et Spark pour la science des données, et expose un point de terminaison d'analytique SQL. C'est le choix adapté aux données mixtes ou semi-structurées et aux flux de travail de machine learning.
  options:
    a: { en: "A Warehouse is the relational store developed with T-SQL for structured data; Spark notebooks and files are the domain of the Lakehouse.", fr: "Un Warehouse est le magasin relationnel développé en T-SQL pour des données structurées ; les notebooks Spark et les fichiers sont le domaine du Lakehouse." }
    b: { en: "A semantic model defines tables, relationships and measures for reports on top of a store.", fr: "Un modèle sémantique définit des tables, des relations et des mesures pour les rapports au-dessus d'un magasin." }
    d: { en: "A pipeline orchestrates data movement and transformation; it stores nothing.", fr: "Un pipeline orchestre le déplacement et la transformation des données ; il ne stocke rien." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is a lakehouse in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview
