id: dp900-4a-ing-elt-raw-lake
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank wants to keep an unchanged copy of its source data in its analytical platform for future analyses. The data must be cleaned and restructured by the Apache Spark engine of that platform, not by the pipeline that copies the data.

    Which approach meets the requirements?
  fr: |
    Woodgrove Bank veut conserver une copie inchangée de ses données sources dans sa plateforme analytique pour de futures analyses. Les données doivent être nettoyées et restructurées par le moteur Apache Spark de cette plateforme, et non par le pipeline qui copie les données.

    Quelle approche répond aux exigences ?
body:
  options:
    - { id: a, text: { en: "An ETL process that loads the data into a data warehouse", fr: "Un processus ETL qui charge les données dans un entrepôt de données" } }
    - { id: b, text: { en: "An ETL process that loads the data into a data lake", fr: "Un processus ETL qui charge les données dans un lac de données" } }
    - { id: c, text: { en: "An ELT process that loads the data into a data lake", fr: "Un processus ELT qui charge les données dans un lac de données" } }
    - { id: d, text: { en: "An ELT process that loads the data into a transactional database", fr: "Un processus ELT qui charge les données dans une base de données transactionnelle" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In an ELT process the data is copied to the analytical store first and transformed afterward by the engine of that store, so the raw copy remains available. A data lake keeps files in their original form and lets a distributed engine such as Apache Spark process them, which matches both requirements.
    fr: |
      Dans un processus ELT, les données sont d'abord copiées dans le magasin analytique, puis transformées par le moteur de ce magasin : la copie brute reste donc disponible. Un lac de données conserve les fichiers dans leur forme d'origine et laisse un moteur distribué comme Apache Spark les traiter, ce qui répond aux deux exigences.
  options:
    a: { en: "ETL transforms the data in the pipeline before loading, so no unchanged copy reaches the platform.", fr: "ETL transforme les données dans le pipeline avant le chargement : aucune copie inchangée n'arrive dans la plateforme." }
    b: { en: "The store is suitable, but with ETL the transformation still runs in the pipeline, before the data lake receives the data.", fr: "Le magasin convient, mais avec ETL la transformation s'exécute quand même dans le pipeline, avant que le lac de données ne reçoive les données." }
    d: { en: "A transactional database is designed for the operations of an application, not for keeping raw analytical data that Spark processes.", fr: "Une base de données transactionnelle est conçue pour les opérations d'une application, pas pour conserver des données analytiques brutes traitées par Spark." }
references:
