id: dp900-4a-store-choice-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A data architect is choosing an analytical data store.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un architecte de données choisit un magasin de données analytique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A data warehouse is a good choice when transactional data can be organized into a structured schema of tables and queried with SQL.
        fr: Un entrepôt de données est un bon choix lorsque des données transactionnelles peuvent être organisées dans un schéma structuré de tables et interrogées en SQL.
    - id: s2
      text:
        en: A data lake is the appropriate store when every file must match a predefined schema at the time it is written.
        fr: Un lac de données est le magasin approprié lorsque chaque fichier doit respecter un schéma prédéfini au moment de son écriture.
    - id: s3
      text:
        en: A data lake can hold structured, semi-structured, and unstructured data together.
        fr: Un lac de données peut contenir à la fois des données structurées, semi-structurées et non structurées.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A data warehouse suits transactional data that fits a structured schema of tables queried with SQL. A data lake does the opposite of enforcing a schema at write time: files are stored as they are and a schema is applied when they are read. This is why a data lake can mix structured, semi-structured and unstructured data.
    fr: |
      Un entrepôt de données convient à des données transactionnelles qui entrent dans un schéma structuré de tables interrogées en SQL. Un lac de données fait l'inverse d'imposer un schéma à l'écriture : les fichiers sont stockés tels quels et un schéma est appliqué à leur lecture. C'est pourquoi un lac de données peut mélanger des données structurées, semi-structurées et non structurées.
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
