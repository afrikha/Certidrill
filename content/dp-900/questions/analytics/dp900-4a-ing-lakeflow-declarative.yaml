id: dp900-4a-ing-lakeflow-declarative
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team that uses Azure Databricks wants to define what its Delta Lake tables should contain and let the platform manage the execution order, the dependencies between tables, and incremental processing.

    What should the team use?
  fr: |
    Une équipe qui utilise Azure Databricks veut définir ce que ses tables Delta Lake doivent contenir et laisser la plateforme gérer l'ordre d'exécution, les dépendances entre les tables et le traitement incrémentiel.

    Que doit utiliser l'équipe ?
body:
  options:
    - { id: a, text: { en: "Lakeflow pipelines", fr: "Des pipelines Lakeflow" } }
    - { id: b, text: { en: "Unity Catalog", fr: "Unity Catalog" } }
    - { id: c, text: { en: "A SQL warehouse in Databricks SQL", fr: "Un entrepôt SQL de Databricks SQL" } }
    - { id: d, text: { en: "Genie", fr: "Genie" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lakeflow pipelines are a declarative framework for reliable, incrementally updated pipelines on Delta Lake. You declare the content of the output tables, and Azure Databricks handles execution ordering, dependency tracking and incremental processing, for batch and for streaming ingestion.
    fr: |
      Les pipelines Lakeflow sont une infrastructure déclarative pour des pipelines fiables, mis à jour de manière incrémentielle sur Delta Lake. Vous déclarez le contenu des tables de sortie, et Azure Databricks gère l'ordre d'exécution, le suivi des dépendances et le traitement incrémentiel, pour l'ingestion par lots comme en streaming.
  options:
    b: { en: "Unity Catalog governs data and AI assets (access control, lineage, discovery); it doesn't load tables.", fr: "Unity Catalog gouverne les données et les ressources d'IA (contrôle d'accès, traçabilité, découverte) ; il ne charge pas les tables." }
    c: { en: "A SQL warehouse is compute that runs analytical queries on Delta tables.", fr: "Un entrepôt SQL est une ressource de calcul qui exécute des requêtes analytiques sur des tables Delta." }
    d: { en: "Genie answers natural-language questions by generating and running SQL.", fr: "Genie répond à des questions en langage naturel en générant et en exécutant du SQL." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: Spark Declarative Pipelines on Lakeflow
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/
