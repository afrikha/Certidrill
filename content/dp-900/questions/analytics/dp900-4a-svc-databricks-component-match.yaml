id: dp900-4a-svc-databricks-component-match
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each task to the Azure Databricks component that performs it.

    To answer, drag the appropriate component to each task. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque tâche au composant d'Azure Databricks qui l'effectue.

    Pour répondre, faites glisser le composant approprié vers chaque tâche. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: uc, text: Unity Catalog }
    - { id: lf, text: { en: "Lakeflow pipelines", fr: "Pipelines Lakeflow" } }
    - { id: nb, text: Notebooks }
    - { id: genie, text: Genie }
    - { id: dbsql, text: Databricks SQL }
  targets:
    - id: t1
      text: { en: "Write collaborative code for data engineering, exploratory analysis, and machine learning.", fr: "Écrire du code collaboratif pour l'ingénierie des données, l'analyse exploratoire et le machine learning." }
    - id: t2
      text: { en: "Run analytical queries on Delta tables from SQL warehouses for reports and BI tools.", fr: "Exécuter des requêtes analytiques sur des tables Delta à partir d'entrepôts SQL pour des rapports et des outils décisionnels." }
    - id: t3
      text: { en: "Control access to data and AI assets, and track their lineage.", fr: "Contrôler l'accès aux données et aux ressources d'IA, et suivre leur traçabilité." }
answer:
  mapping: { t1: nb, t2: dbsql, t3: uc }
explanation:
  correct:
    en: |
      Databricks notebooks are collaborative Python, SQL, Scala and R notebooks for data engineering pipelines, exploratory analysis and machine learning. Databricks SQL provides SQL warehouses that run analytical queries directly against Delta tables. Unity Catalog is the unified governance layer: fine-grained access control, data lineage and discovery for data and AI assets.
    fr: |
      Les notebooks Databricks sont des notebooks collaboratifs en Python, SQL, Scala et R pour les pipelines d'ingénierie des données, l'analyse exploratoire et le machine learning. Databricks SQL fournit des entrepôts SQL qui exécutent des requêtes analytiques directement sur des tables Delta. Unity Catalog est la couche de gouvernance unifiée : contrôle d'accès précis, traçabilité des données et découverte pour les données et les ressources d'IA.
  options:
    lf: { en: "Lakeflow pipelines are declarative pipelines that load Delta tables incrementally.", fr: "Les pipelines Lakeflow sont des pipelines déclaratifs qui chargent des tables Delta de manière incrémentielle." }
    genie: { en: "Genie answers natural-language questions by generating and running SQL.", fr: "Genie répond à des questions en langage naturel en générant et en exécutant du SQL." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Unity Catalog?
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/
