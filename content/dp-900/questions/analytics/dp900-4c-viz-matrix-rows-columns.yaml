id: dp900-4c-viz-matrix-rows-columns
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need a visual that shows the total sales with the product categories in rows and the years in columns. Users must be able to expand a category to see the products that it contains.

    Which visual should you use?
  fr: |
    Vous avez besoin d'un visuel qui affiche le total des ventes avec les catégories de produit en lignes et les années en colonnes. Les utilisateurs doivent pouvoir développer une catégorie pour voir les produits qu'elle contient.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Matrix", fr: "Matrice" } }
    - { id: b, text: { en: "Table", fr: "Table" } }
    - { id: c, text: { en: "Card", fr: "Carte (card)" } }
    - { id: d, text: { en: "Treemap", fr: "Treemap" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A matrix works like a pivot table: fields placed in rows and fields placed in columns define cells in which the values are aggregated. When a row header contains several fields, users can expand and collapse its levels, here from the category to the products."
    fr: "Une matrice fonctionne comme un tableau croisé dynamique : des champs placés en lignes et des champs placés en colonnes définissent des cellules dans lesquelles les valeurs sont agrégées. Quand un en-tête de ligne contient plusieurs champs, les utilisateurs peuvent en développer et en réduire les niveaux, ici de la catégorie aux produits."
  options:
    b:
      en: "A table shows each field as a column of a flat grid; it cannot spread the years across column headers."
      fr: "Une table affiche chaque champ comme une colonne d'une grille plate ; elle ne peut pas répartir les années dans des en-têtes de colonne."
    c:
      en: "A card displays one figure, such as the total sales, without rows or columns."
      fr: "Une carte affiche un seul chiffre, comme le total des ventes, sans lignes ni colonnes."
    d:
      en: "A treemap shows proportions as nested rectangles; it has no rows and columns in which to read the totals per year."
      fr: "Un treemap montre des proportions sous forme de rectangles imbriqués ; il n'a ni lignes ni colonnes où lire les totaux par année."
references:
  - title: Create a Matrix Visual in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-matrix-visual
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
