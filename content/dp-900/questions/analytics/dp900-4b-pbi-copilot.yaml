id: dp900-4b-pbi-copilot
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report author wants to describe a report page in natural language and have Power BI create the page with suitable visuals.

    Which capability should the author use?
  fr: |
    L'auteur d'un rapport veut décrire une page de rapport en langage naturel et laisser Power BI créer la page avec des visuels adaptés.

    Quelle fonctionnalité l'auteur doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Copilot in Power BI", fr: "Copilot dans Power BI" } }
    - { id: b, text: { en: "Power Query Editor", fr: "L'Éditeur Power Query" } }
    - { id: c, text: "Power BI Report Builder" }
    - { id: d, text: { en: "Data alerts", fr: "Les alertes de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Copilot in Power BI is available in Power BI Desktop and in the Power BI service. From a prompt in natural language, it can create report pages with appropriate chart types, summarize what a report shows, and write DAX.
    fr: |
      Copilot dans Power BI est disponible dans Power BI Desktop et dans le service Power BI. À partir d'une demande en langage naturel, il peut créer des pages de rapport avec des types de graphiques appropriés, résumer ce que montre un rapport et écrire du DAX.
  options:
    b:
      en: Power Query Editor is used to clean and shape data before it is loaded into the model.
      fr: L'Éditeur Power Query sert à nettoyer et mettre en forme les données avant leur chargement dans le modèle.
    c:
      en: Power BI Report Builder is the tool in which you design paginated reports yourself.
      fr: Power BI Report Builder est l'outil dans lequel vous concevez vous-même des rapports paginés.
    d:
      en: Data alerts notify you when the value of a dashboard tile passes a limit.
      fr: Les alertes de données vous avertissent quand la valeur d'une vignette de tableau de bord dépasse une limite.
references:
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
