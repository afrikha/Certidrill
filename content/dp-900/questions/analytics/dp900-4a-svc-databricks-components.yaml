id: dp900-4a-svc-databricks-components
objective: "4.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two components are part of Azure Databricks?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux composants qui font partie d'Azure Databricks ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: OneLake }
    - { id: b, text: Unity Catalog }
    - { id: c, text: Dataflows Gen2 }
    - { id: d, text: Genie }
    - { id: e, text: Eventstream }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Unity Catalog is the governance layer of Azure Databricks for data and AI assets, and Genie is its conversational interface that answers natural-language questions by generating SQL. The three other components belong to Microsoft Fabric.
    fr: |
      Unity Catalog est la couche de gouvernance d'Azure Databricks pour les données et les ressources d'IA, et Genie est son interface conversationnelle qui répond à des questions en langage naturel en générant du SQL. Les trois autres composants appartiennent à Microsoft Fabric.
  options:
    a: { en: "OneLake is the tenant-wide data lake of Microsoft Fabric.", fr: "OneLake est le lac de données à l'échelle du locataire de Microsoft Fabric." }
    c: { en: "Dataflows Gen2 are the low-code transformation tool of Fabric Data Factory.", fr: "Les Dataflows Gen2 sont l'outil de transformation avec peu de code de Fabric Data Factory." }
    e: { en: "Eventstream is the Microsoft Fabric tool that ingests real-time streams.", fr: "Eventstream est l'outil de Microsoft Fabric qui ingère des flux en temps réel." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Unity Catalog?
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/
