id: dp900-4b-bs-match-architecture
objective: "4.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A factory monitors the temperature of its machines with a stream processing solution.

    Match each part of the solution to the element of a stream processing architecture that it represents. To answer, drag the appropriate element to each part. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une usine surveille la température de ses machines avec une solution de traitement de flux.

    Associez chaque partie de la solution à l'élément d'une architecture de traitement de flux qu'elle représente. Pour répondre, faites glisser l'élément approprié vers chaque partie. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sink, text: { en: "Sink", fr: "Récepteur (sink)" } }
    - { id: event, text: { en: "Event", fr: "Événement" } }
    - { id: schedule, text: { en: "Schedule", fr: "Planification" } }
    - { id: query, text: { en: "Perpetual query", fr: "Requête perpétuelle" } }
    - { id: source, text: { en: "Source", fr: "Source" } }
  targets:
    - id: t1
      text: { en: "A machine emits a temperature reading.", fr: "Une machine émet un relevé de température." }
    - id: t2
      text: { en: "A queue captures the readings and keeps them in order.", fr: "Une file d'attente capture les relevés et conserve leur ordre." }
    - id: t3
      text: { en: "Logic that continuously calculates the average temperature per minute.", fr: "Une logique qui calcule en continu la température moyenne par minute." }
    - id: t4
      text: { en: "A real-time dashboard receives the calculated averages.", fr: "Un tableau de bord en temps réel reçoit les moyennes calculées." }
answer:
  mapping: { t1: event, t2: source, t3: query, t4: sink }
explanation:
  correct:
    en: |
      A stream processing solution has four elements. An event generates data, here a sensor reading. The data is captured in a streaming source, which in robust solutions is a queue that keeps the events in order. A perpetual query runs on the incoming events and aggregates values over time windows, such as an average per minute. The results are written to an output called a sink, for example a real-time dashboard. A schedule is what starts a batch job; it isn't an element of this architecture.
    fr: |
      Une solution de traitement de flux comporte quatre éléments. Un événement génère des données, ici le relevé d'un capteur. Les données sont capturées dans une source de streaming qui, dans les solutions robustes, est une file d'attente conservant l'ordre des événements. Une requête perpétuelle s'exécute sur les événements entrants et agrège des valeurs sur des fenêtres de temps, par exemple une moyenne par minute. Les résultats sont écrits dans une sortie appelée récepteur (sink), par exemple un tableau de bord en temps réel. Une planification sert à démarrer un travail par lots ; ce n'est pas un élément de cette architecture.
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
