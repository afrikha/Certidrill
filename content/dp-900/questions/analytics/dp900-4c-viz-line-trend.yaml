id: dp900-4c-viz-line-trend
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to show how the monthly revenue of Contoso changed over the last three years, so that users can see the trend.

    Which visual should you use?
  fr: |
    Vous devez montrer comment le chiffre d'affaires mensuel de Contoso a évolué au cours des trois dernières années, pour que les utilisateurs voient la tendance.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
    - { id: b, text: { en: "Line chart", fr: "Graphique en courbes" } }
    - { id: c, text: { en: "Scatter chart", fr: "Nuage de points" } }
    - { id: d, text: { en: "Treemap", fr: "Treemap" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A line chart emphasizes the overall shape of a series of values, usually over time. With the months on the horizontal axis, the line makes rises, falls and seasonal patterns of the revenue visible."
    fr: "Un graphique en courbes met en évidence la forme générale d'une série de valeurs, en général dans le temps. Avec les mois sur l'axe horizontal, la courbe rend visibles les hausses, les baisses et les motifs saisonniers du chiffre d'affaires."
  options:
    a:
      en: "A pie chart compares the parts of a total at one moment; it does not show an evolution over 36 months."
      fr: "Un graphique en secteurs compare les parts d'un total à un instant donné ; il ne montre pas une évolution sur 36 mois."
    c:
      en: "A scatter chart shows the relationship between two numeric measures, not the change of one measure over time."
      fr: "Un nuage de points montre la relation entre deux mesures numériques, pas l'évolution d'une mesure dans le temps."
    d:
      en: "A treemap shows the proportions of hierarchical data as nested rectangles; it has no time axis."
      fr: "Un treemap montre les proportions de données hiérarchiques sous forme de rectangles imbriqués ; il n'a pas d'axe de temps."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
