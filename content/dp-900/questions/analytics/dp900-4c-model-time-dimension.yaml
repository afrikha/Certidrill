id: dp900-4c-model-time-dimension
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analytical model contains a Sales fact table. Analysts must compare the total sales by month, by quarter and by year.

    Which table must be related to the Sales table to meet this need?
  fr: |
    Un modèle analytique contient une table de faits Sales. Les analystes doivent comparer le total des ventes par mois, par trimestre et par année.

    Quelle table doit être liée à la table Sales pour répondre à ce besoin ?
body:
  options:
    - { id: a, text: { en: "A time dimension table", fr: "Une table de dimension de temps" } }
    - { id: b, text: { en: "A product dimension table", fr: "Une table de dimension des produits" } }
    - { id: c, text: { en: "A customer dimension table", fr: "Une table de dimension des clients" } }
    - { id: d, text: { en: "A second sales fact table", fr: "Une seconde table de faits des ventes" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Most analytical models include a time dimension, which makes it possible to aggregate the measures of the fact table over periods such as days, months, quarters and years. Its levels can be organized in a hierarchy to drill from years down to months."
    fr: "La plupart des modèles analytiques comprennent une dimension de temps, qui permet d'agréger les mesures de la table de faits sur des périodes comme les jours, les mois, les trimestres et les années. Ses niveaux peuvent être organisés en hiérarchie pour descendre des années aux mois."
  options:
    b:
      en: "A product dimension groups sales by product or by category, not by period."
      fr: "Une dimension des produits regroupe les ventes par produit ou par catégorie, pas par période."
    c:
      en: "A customer dimension groups sales by customer or by city, not by period."
      fr: "Une dimension des clients regroupe les ventes par client ou par ville, pas par période."
    d:
      en: "A fact table holds the values to aggregate; grouping them by period requires a dimension, not more facts."
      fr: "Une table de faits contient les valeurs à agréger ; les regrouper par période demande une dimension, pas d'autres faits."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
