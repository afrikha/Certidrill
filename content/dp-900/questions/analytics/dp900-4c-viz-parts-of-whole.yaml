id: dp900-4c-viz-parts-of-whole
objective: "4.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam sells its products through four sales channels. A report must show the share of each channel in the total revenue of the year.

    Which two visuals can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam vend ses produits par quatre canaux de vente. Un rapport doit montrer la part de chaque canal dans le chiffre d'affaires total de l'année.

    Quels sont les deux visuels que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Line chart", fr: "Graphique en courbes" } }
    - { id: b, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
    - { id: c, text: { en: "Scatter chart", fr: "Nuage de points" } }
    - { id: d, text: { en: "Doughnut chart", fr: "Graphique en anneau" } }
    - { id: e, text: { en: "Card", fr: "Carte (card)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Pie charts and doughnut charts show the relationship of parts to a whole, and they work well with a small number of categories such as four channels. A doughnut chart is a pie chart with an open center."
    fr: "Les graphiques en secteurs et les graphiques en anneau montrent la relation entre des parties et un tout, et ils conviennent à un petit nombre de catégories, comme quatre canaux. Un graphique en anneau est un graphique en secteurs dont le centre est vide."
  options:
    a:
      en: "A line chart shows a trend, usually over time, not the split of one yearly total."
      fr: "Un graphique en courbes montre une tendance, en général dans le temps, pas la répartition d'un total annuel."
    c:
      en: "A scatter chart needs two numeric measures and shows their relationship, not the shares of a total."
      fr: "Un nuage de points demande deux mesures numériques et montre leur relation, pas les parts d'un total."
    e:
      en: "A card displays a single figure, such as the total revenue, without comparing the channels."
      fr: "Une carte affiche un seul chiffre, comme le chiffre d'affaires total, sans comparer les canaux."
references:
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
