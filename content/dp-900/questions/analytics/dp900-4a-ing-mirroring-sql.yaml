id: dp900-4a-ing-mirroring-sql
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs its order application on Azure SQL Database. The data must be replicated continuously, in near real time, into OneLake for analytics. Fabrikam doesn't want to build or schedule pipelines.

    Which Microsoft Fabric feature should Fabrikam use?
  fr: |
    Fabrikam exécute son application de commandes sur Azure SQL Database. Les données doivent être répliquées en continu, en quasi-temps réel, dans OneLake à des fins d'analytique. Fabrikam ne veut ni créer ni planifier de pipelines.

    Quelle fonctionnalité de Microsoft Fabric Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
    - { id: b, text: { en: "A Dataflow Gen2", fr: "Un Dataflow Gen2" } }
    - { id: c, text: { en: "Mirroring", fr: "La mise en miroir" } }
    - { id: d, text: { en: "A notebook", fr: "Un notebook" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mirroring continuously replicates an external database, such as Azure SQL Database, into OneLake in near real time. You configure the source connection once, and Fabric handles change tracking and replication without any pipeline to author.
    fr: |
      La mise en miroir réplique en continu une base de données externe, comme Azure SQL Database, dans OneLake en quasi-temps réel. Vous configurez une seule fois la connexion à la source, et Fabric gère le suivi des modifications et la réplication sans aucun pipeline à créer.
  options:
    a: { en: "A shortcut references files in storage such as Azure Data Lake Storage Gen2 or Amazon S3; it doesn't replicate an operational database.", fr: "Un raccourci référence des fichiers dans un stockage comme Azure Data Lake Storage Gen2 ou Amazon S3 ; il ne réplique pas une base de données opérationnelle." }
    b: { en: "A dataflow loads data each time it runs, on demand or on a schedule; that isn't continuous replication.", fr: "Un dataflow charge des données à chaque exécution, à la demande ou selon une planification ; ce n'est pas une réplication continue." }
    d: { en: "A notebook requires code to be written and scheduled, which is what Fabrikam wants to avoid.", fr: "Un notebook exige d'écrire du code et de le planifier, ce que Fabrikam veut éviter." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
