id: dp900-4b-pbi-desktop-tasks
objective: "4.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two tasks is Power BI Desktop primarily used for?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches pour lesquelles Power BI Desktop est principalement utilisé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Combining data from several sources in a data model
        fr: Combiner des données de plusieurs sources dans un modèle de données
    - id: b
      text:
        en: Scheduling the refresh of a published semantic model
        fr: Planifier l'actualisation d'un modèle sémantique publié
    - id: c
      text:
        en: Creating reports with interactive visualizations
        fr: Créer des rapports avec des visualisations interactives
    - id: d
      text:
        en: Distributing an app to the users of the organization
        fr: Distribuer une application aux utilisateurs de l'organisation
    - id: e
      text:
        en: Viewing dashboards on a phone
        fr: Consulter des tableaux de bord sur un téléphone
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Power BI Desktop is the Windows application in which analysts import data from a wide range of sources, combine and organize it in an analytical data model, and create reports with interactive visualizations. The reports are then published to the Power BI service.
    fr: |
      Power BI Desktop est l'application Windows dans laquelle les analystes importent des données depuis un large éventail de sources, les combinent et les organisent dans un modèle de données analytique, et créent des rapports avec des visualisations interactives. Les rapports sont ensuite publiés dans le service Power BI.
  options:
    b:
      en: Refreshes of published semantic models are scheduled in the Power BI service.
      fr: L'actualisation des modèles sémantiques publiés se planifie dans le service Power BI.
    d:
      en: Apps are defined and distributed in the Power BI service.
      fr: Les applications sont définies et distribuées dans le service Power BI.
    e:
      en: Dashboards are viewed on phones with the Power BI mobile apps; dashboards aren't even available in Power BI Desktop.
      fr: "Les tableaux de bord se consultent sur téléphone avec les applications mobiles Power BI ; ils ne sont même pas disponibles dans Power BI Desktop."
references:
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
