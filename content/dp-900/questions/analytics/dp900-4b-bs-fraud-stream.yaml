id: dp900-4b-bs-fraud-stream
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must evaluate each card payment for fraud at the moment the payment is submitted, and return a decision in less than one second.

    How should the payments be processed?
  fr: |
    Woodgrove Bank doit évaluer le risque de fraude de chaque paiement par carte au moment où le paiement est soumis, et renvoyer une décision en moins d'une seconde.

    Comment les paiements doivent-ils être traités ?
body:
  options:
    - id: a
      text: { en: "By batch processing that runs every night", fr: "Par un traitement par lots exécuté chaque nuit" }
    - id: b
      text: { en: "By batch processing that runs every hour", fr: "Par un traitement par lots exécuté toutes les heures" }
    - id: c
      text: { en: "By stream processing of each payment as it arrives", fr: "Par un traitement de flux de chaque paiement à son arrivée" }
    - id: d
      text: { en: "By batch processing that starts after 1,000 payments", fr: "Par un traitement par lots démarré après 1 000 paiements" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Stream processing handles each new piece of data when it arrives, with a latency of seconds or milliseconds. It is the approach for time-critical responses such as fraud detection, where the result is needed before the payment is accepted.
    fr: |
      Le traitement de flux traite chaque nouvelle donnée à son arrivée, avec une latence de quelques secondes ou millisecondes. C'est l'approche adaptée aux réponses urgentes comme la détection des fraudes, où le résultat est nécessaire avant que le paiement soit accepté.
  options:
    a:
      en: A nightly batch gives its results hours after the payments were made, far too late to block a payment.
      fr: Un lot nocturne donne ses résultats des heures après les paiements, bien trop tard pour bloquer un paiement.
    b:
      en: An hourly batch still makes a payment wait up to an hour for its decision.
      fr: Un lot exécuté toutes les heures fait encore attendre un paiement jusqu'à une heure avant sa décision.
    d:
      en: A batch that waits for 1,000 payments delays the first payments of the group until the last one has arrived.
      fr: Un lot qui attend 1 000 paiements retarde les premiers paiements du groupe jusqu'à l'arrivée du dernier.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
