id: dp900-4b-pbi-app
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The sales department of Fabrikam has several related dashboards and reports in a workspace of the Power BI service. You need to distribute them together, in a single place, to 300 sales representatives who must not have access to the workspace.

    What should you publish?
  fr: |
    Le service commercial de Fabrikam possède plusieurs tableaux de bord et rapports associés dans un espace de travail du service Power BI. Vous devez les distribuer ensemble, en un seul endroit, à 300 commerciaux qui ne doivent pas avoir accès à l'espace de travail.

    Que devez-vous publier ?
body:
  options:
    - { id: a, text: { en: "A dashboard", fr: "Un tableau de bord" } }
    - { id: b, text: { en: "An app", fr: "Une application" } }
    - { id: c, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
    - { id: d, text: { en: "A paginated report", fr: "Un rapport paginé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An app packages related dashboards and reports of a workspace and publishes them to individuals, groups or the whole organization. The audience finds all the content in one place, and the app can have permissions that differ from those of the workspace.
    fr: |
      Une application regroupe des tableaux de bord et des rapports associés d'un espace de travail et les publie pour des personnes, des groupes ou toute l'organisation. L'audience trouve tout le contenu en un seul endroit, et l'application peut avoir des autorisations différentes de celles de l'espace de travail.
  options:
    a:
      en: A dashboard is a single page of tiles; it doesn't package several dashboards and reports for distribution.
      fr: "Un tableau de bord est une page unique de vignettes ; il ne regroupe pas plusieurs tableaux de bord et rapports pour les distribuer."
    c:
      en: A semantic model is the data on which reports are built, not a way to deliver finished content to business users.
      fr: Un modèle sémantique est l'ensemble des données sur lesquelles les rapports sont construits, pas un moyen de livrer du contenu fini à des utilisateurs professionnels.
    d:
      en: A paginated report is one printable document; it doesn't group the existing dashboards and reports.
      fr: "Un rapport paginé est un document imprimable ; il ne regroupe pas les tableaux de bord et les rapports existants."
references:
  - title: Workspace apps in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/consumer/end-user-apps
  - title: Power BI service basics
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/service-basic-concepts
