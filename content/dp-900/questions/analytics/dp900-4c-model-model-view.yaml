id: dp900-4c-model-model-view
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Power BI Desktop, which view displays the tables of the semantic model as a diagram, in which you create relationships between fact tables and dimension tables and define hierarchies?
  fr: |
    Dans Power BI Desktop, quelle vue affiche les tables du modèle sémantique sous forme de diagramme, dans lequel vous créez les relations entre les tables de faits et les tables de dimension et définissez les hiérarchies ?
body:
  options:
    - { id: a, text: { en: "Report view", fr: "La vue Rapport" } }
    - { id: b, text: { en: "Model view", fr: "La vue Modèle" } }
    - { id: c, text: { en: "Table view", fr: "La vue Table" } }
    - { id: d, text: { en: "DAX query view", fr: "La vue de requête DAX" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Model view of Power BI Desktop shows the tables and the lines that relate them. You use it to create relationships, for example by dragging a column of one table onto a column of another, to define hierarchies and to set data types and display formats."
    fr: "La vue Modèle de Power BI Desktop affiche les tables et les lignes qui les relient. Vous l'utilisez pour créer des relations, par exemple en faisant glisser une colonne d'une table sur une colonne d'une autre, pour définir des hiérarchies et pour régler les types de données et les formats d'affichage."
  options:
    a:
      en: "The Report view is the canvas on which you place and format the visuals of the report pages."
      fr: "La vue Rapport est le canevas sur lequel vous placez et mettez en forme les visuels des pages du rapport."
    c:
      en: "The Table view shows the rows of one table of the model, not a diagram of all the tables."
      fr: "La vue Table affiche les lignes d'une table du modèle, pas un diagramme de toutes les tables."
    d:
      en: "The DAX query view is used to write and run DAX queries on the model."
      fr: "La vue de requête DAX sert à écrire et à exécuter des requêtes DAX sur le modèle."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
  - title: Create and Manage Relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-create-and-manage-relationships
