id: dp900-4b-rt-delta-lake
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In Azure Databricks, a Spark Structured Streaming query ingests telemetry in real time. The same data must be available at the same time to batch queries for historical analysis, in a store that only accepts records that match a defined schema.

    Where should the streaming query write the data?
  fr: |
    Dans Azure Databricks, une requête Spark Structured Streaming ingère de la télémétrie en temps réel. Les mêmes données doivent être disponibles en même temps pour des requêtes par lots d'analyse historique, dans un magasin qui n'accepte que les enregistrements conformes à un schéma défini.

    Où la requête de streaming doit-elle écrire les données ?
body:
  options:
    - id: a
      text: { en: "In a Delta Lake table", fr: "Dans une table Delta Lake" }
    - id: b
      text: { en: "In CSV files in a data lake", fr: "Dans des fichiers CSV d'un lac de données" }
    - id: c
      text: { en: "In an event hub in Azure Event Hubs", fr: "Dans un hub d'événements d'Azure Event Hubs" }
    - id: d
      text: { en: "In a Power BI dashboard", fr: "Dans un tableau de bord Power BI" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Delta Lake is an open-source storage format that adds reliability and schema enforcement to data lake storage, and it unifies batch and streaming: one Delta table can be the sink of a streaming query and, at the same time, a source for batch queries. The Spark runtimes of Azure Databricks and Microsoft Fabric support Delta Lake natively.
    fr: |
      Delta Lake est un format de stockage open source qui ajoute la fiabilité et l'application du schéma au stockage d'un lac de données, et il unifie les lots et le streaming : une même table Delta peut être le récepteur (sink) d'une requête de streaming et, en même temps, une source pour des requêtes par lots. Les runtimes Spark d'Azure Databricks et de Microsoft Fabric prennent en charge Delta Lake en mode natif.
  options:
    b:
      en: Plain files in a data lake can keep the results, but they give no guarantee about structure; nothing rejects a record that doesn't match a schema.
      fr: "De simples fichiers dans un lac de données peuvent conserver les résultats, mais ils ne garantissent rien sur la structure ; rien ne rejette un enregistrement non conforme à un schéma."
    c:
      en: An event hub queues events for further processing downstream; it isn't a store for historical batch analysis.
      fr: "Un hub d'événements met des événements en file d'attente pour un traitement en aval ; ce n'est pas un magasin pour l'analyse historique par lots."
    d:
      en: Power BI visualizes the results in real time; it isn't a schema-enforcing store that batch queries read.
      fr: "Power BI visualise les résultats en temps réel ; ce n'est pas un magasin qui applique un schéma et que des requêtes par lots interrogent."
references:
  - title: Explore Apache Spark structured streaming
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/5-spark-streaming
