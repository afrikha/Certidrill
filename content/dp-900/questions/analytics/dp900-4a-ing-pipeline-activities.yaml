id: dp900-4a-ing-pipeline-activities
objective: "4.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Fabric Data Factory, [[item]] orchestrates a workflow that moves and transforms data, by chaining [[part]] that run in sequence or in parallel.
    fr: |
      Dans Fabric Data Factory, [[item]] orchestre un flux de travail qui déplace et transforme des données, en enchaînant [[part]] qui s'exécutent en séquence ou en parallèle.
  slots:
    - id: item
      options:
        - { id: shortcut, text: { en: "a shortcut", fr: "un raccourci" } }
        - { id: model, text: { en: "a semantic model", fr: "un modèle sémantique" } }
        - { id: pipeline, text: { en: "a pipeline", fr: "un pipeline" } }
        - { id: mirror, text: { en: "a mirrored database", fr: "une base de données mise en miroir" } }
    - id: part
      options:
        - { id: measures, text: { en: "one or more measures", fr: "une ou plusieurs mesures" } }
        - { id: activities, text: { en: "one or more activities", fr: "une ou plusieurs activités" } }
        - { id: dims, text: { en: "one or more dimension tables", fr: "une ou plusieurs tables de dimension" } }
        - { id: shortcuts, text: { en: "one or more shortcuts", fr: "un ou plusieurs raccourcis" } }
answer:
  values: { item: pipeline, part: activities }
explanation:
  correct:
    en: |
      A pipeline orchestrates multi-step data movement and transformation. It consists of one or more activities, such as copying data, running a stored procedure or invoking a notebook, and the activities can run one after another or at the same time.
    fr: |
      Un pipeline orchestre des déplacements et des transformations de données en plusieurs étapes. Il se compose d'une ou plusieurs activités, comme copier des données, exécuter une procédure stockée ou appeler un notebook, et ces activités peuvent s'exécuter l'une après l'autre ou en même temps.
  options:
    shortcut: { en: "A shortcut is a reference to data that stays in another storage location; it doesn't orchestrate anything.", fr: "Un raccourci est une référence à des données qui restent dans un autre emplacement de stockage ; il n'orchestre rien." }
    model: { en: "A semantic model defines tables, relationships and measures for reports.", fr: "Un modèle sémantique définit des tables, des relations et des mesures pour les rapports." }
    mirror: { en: "A mirrored database is the replica that mirroring maintains in OneLake, with no workflow to author.", fr: "Une base de données mise en miroir est le réplica que la mise en miroir maintient dans OneLake, sans flux de travail à créer." }
    measures: { en: "Measures are calculations of a semantic model, not steps of a pipeline.", fr: "Les mesures sont des calculs d'un modèle sémantique, pas des étapes d'un pipeline." }
references:
  - title: Explore data ingestion pipelines
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/3-data-ingestion-pipelines
  - title: What is Data Factory in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-factory-overview
