id: dp900-4a-store-lake-scenario
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research institute must keep images, audio recordings, JSON logs, and CSV files in their native format. No schema is defined when the files are written, and data scientists will explore them later with Apache Spark.

    Which type of data store should the institute use?
  fr: |
    Un institut de recherche doit conserver des images, des enregistrements audio, des journaux JSON et des fichiers CSV dans leur format natif. Aucun schéma n'est défini lors de l'écriture des fichiers, et des scientifiques des données les exploreront plus tard avec Apache Spark.

    Quel type de magasin de données l'institut doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "A data warehouse", fr: "Un entrepôt de données" } }
    - { id: b, text: { en: "A relational transactional database", fr: "Une base de données relationnelle transactionnelle" } }
    - { id: c, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
    - { id: d, text: { en: "A data lake", fr: "Un lac de données" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A data lake is a file store that holds structured, semi-structured and unstructured data in its native format, with no schema enforced when the data is written. Distributed engines such as Apache Spark then process the files for analysis.
    fr: |
      Un lac de données est un magasin de fichiers qui contient des données structurées, semi-structurées et non structurées dans leur format natif, sans qu'aucun schéma ne soit imposé à l'écriture. Des moteurs distribués comme Apache Spark traitent ensuite les fichiers pour l'analyse.
  options:
    a: { en: "A data warehouse stores structured data in relational tables whose schema is defined before loading.", fr: "Un entrepôt de données stocke des données structurées dans des tables relationnelles dont le schéma est défini avant le chargement." }
    b: { en: "A transactional database records the operations of an application in tables with a fixed schema.", fr: "Une base de données transactionnelle enregistre les opérations d'une application dans des tables au schéma fixe." }
    c: { en: "A semantic model defines tables, relationships and measures for reports; it isn't a store for raw files.", fr: "Un modèle sémantique définit des tables, des relations et des mesures pour les rapports ; ce n'est pas un magasin de fichiers bruts." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is a data lake?
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/scenarios/data-lake
