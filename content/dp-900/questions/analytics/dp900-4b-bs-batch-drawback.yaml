id: dp900-4b-bs-batch-drawback
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What is a disadvantage of batch processing compared with stream processing?
  fr: |
    Quel est un inconvénient du traitement par lots par rapport au traitement de flux ?
body:
  options:
    - id: a
      text:
        en: The results are available only some time after the data was produced.
        fr: Les résultats ne sont disponibles qu'un certain temps après la production des données.
    - id: b
      text:
        en: Large volumes of data are processed less efficiently.
        fr: Les gros volumes de données sont traités moins efficacement.
    - id: c
      text:
        en: The processing has to run at the busiest time of the day.
        fr: Le traitement doit s'exécuter au moment le plus chargé de la journée.
    - id: d
      text:
        en: Only the most recent records can be analyzed.
        fr: Seuls les enregistrements les plus récents peuvent être analysés.
answer: { optionId: a }
explanation:
  correct:
    en: |
      A batch waits until the data has been collected, so there is a delay between the ingestion of the data and the results: the latency is typically a few hours. Stream processing gives its results within seconds or milliseconds.
    fr: |
      Un lot attend que les données aient été collectées : il y a donc un délai entre l'ingestion des données et les résultats, et la latence est généralement de quelques heures. Le traitement de flux donne ses résultats en quelques secondes ou millisecondes.
  options:
    b:
      en: It is the opposite. Processing large volumes of data efficiently is an advantage of batch processing.
      fr: "C'est l'inverse : traiter efficacement de gros volumes de données est un avantage du traitement par lots."
    c:
      en: A batch can be scheduled at a convenient time, such as overnight, when resources are less used.
      fr: Un lot peut être planifié à un moment opportun, par exemple la nuit, quand les ressources sont moins utilisées.
    d:
      en: This limit applies to stream processing, which usually sees recent data or a rolling time window; a batch can process the whole dataset.
      fr: Cette limite concerne le traitement de flux, qui voit en général les données récentes ou une fenêtre temporelle glissante ; un lot peut traiter tout le jeu de données.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
