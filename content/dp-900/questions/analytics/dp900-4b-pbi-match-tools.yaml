id: dp900-4b-pbi-match-tools
objective: "4.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each requirement to the Power BI tool that meets it. To answer, drag the appropriate tool to each requirement. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence à l'outil Power BI qui y répond. Pour répondre, faites glisser l'outil approprié vers chaque exigence. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: desktop, text: "Power BI Desktop" }
    - { id: service, text: { en: "Power BI service", fr: "Service Power BI" } }
    - { id: mobile, text: { en: "Power BI mobile apps", fr: "Applications mobiles Power BI" } }
    - { id: builder, text: "Power BI Report Builder" }
    - { id: server, text: "Power BI Report Server" }
  targets:
    - id: t1
      text:
        en: Share reports with colleagues and collaborate in workspaces in the cloud
        fr: Partager des rapports avec des collègues et collaborer dans des espaces de travail dans le cloud
    - id: t2
      text:
        en: View and interact with dashboards and reports on a phone or a tablet
        fr: Consulter des tableaux de bord et des rapports sur un téléphone ou une tablette, et interagir avec eux
    - id: t3
      text:
        en: Create paginated reports
        fr: Créer des rapports paginés
    - id: t4
      text:
        en: Host reports on the organization's own servers, on-premises
        fr: Héberger des rapports sur les propres serveurs de l'organisation, en local
answer:
  mapping: { t1: service, t2: mobile, t3: builder, t4: server }
explanation:
  correct:
    en: |
      The Power BI service is the cloud platform in which reports are published, shared and worked on in workspaces. The Power BI mobile apps let users view and interact with dashboards and reports on phones and tablets. Power BI Report Builder creates paginated reports, the printable documents such as invoices. Power BI Report Server keeps reports on-premises. Power BI Desktop, which isn't used here, is the Windows application for data modeling and report creation.
    fr: |
      Le service Power BI est la plateforme cloud dans laquelle les rapports sont publiés, partagés et travaillés dans des espaces de travail. Les applications mobiles Power BI permettent de consulter des tableaux de bord et des rapports sur téléphone et sur tablette, et d'interagir avec eux. Power BI Report Builder crée des rapports paginés, des documents imprimables comme des factures. Power BI Report Server conserve les rapports en local. Power BI Desktop, qui n'est pas utilisé ici, est l'application Windows de modélisation des données et de création de rapports.
references:
  - title: What is Power BI?
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/power-bi-overview
  - title: What is Power BI Report Server?
    url: https://learn.microsoft.com/en-us/power-bi/report-server/get-started
