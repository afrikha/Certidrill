id: dp900-4b-rt-eventstream
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use Microsoft Fabric. You need to capture events from Azure Event Hubs, filter them, and route them to several destinations, without writing code.

    Which Real-Time Intelligence item should you use?
  fr: |
    Vous utilisez Microsoft Fabric. Vous devez capturer des événements provenant d'Azure Event Hubs, les filtrer et les router vers plusieurs destinations, sans écrire de code.

    Quel élément de Real-Time Intelligence devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Eventhouse" }
    - { id: b, text: "KQL queryset" }
    - { id: c, text: "Eventstream" }
    - { id: d, text: "Activator" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An eventstream brings real-time events into Fabric, transforms them and sends them to destinations, without code: you add sources, optional transformations such as a filter, and one or more destinations in a visual editor. Azure Event Hubs is one of the supported sources.
    fr: |
      Un eventstream fait entrer des événements en temps réel dans Fabric, les transforme et les envoie vers des destinations, sans code : vous ajoutez des sources, des transformations facultatives comme un filtre, et une ou plusieurs destinations dans un éditeur visuel. Azure Event Hubs fait partie des sources prises en charge.
  options:
    a:
      en: An eventhouse stores and analyzes event data in KQL databases; it is a possible destination of an eventstream, not the item that routes the events.
      fr: "Un eventhouse stocke et analyse des données d'événements dans des bases de données KQL ; c'est une destination possible d'un eventstream, pas l'élément qui route les événements."
    b:
      en: A KQL queryset is used to write and run queries on data that is already stored in an eventhouse.
      fr: Un KQL queryset sert à écrire et exécuter des requêtes sur des données déjà stockées dans un eventhouse.
    d:
      en: Activator watches data and triggers an action when a condition is met; it doesn't ingest and route the events.
      fr: "Activator surveille des données et déclenche une action quand une condition est remplie ; il n'ingère pas et ne route pas les événements."
references:
  - title: Overview of Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
  - title: What is Real-Time Intelligence?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
