id: dp900-4a-ing-analytical-model
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a large-scale analytics architecture, which element defines tables, relationships, hierarchies, and measures so that reports are easier to build?
  fr: |
    Dans une architecture d'analytique à grande échelle, quel élément définit des tables, des relations, des hiérarchies et des mesures afin de faciliter la création de rapports ?
body:
  options:
    - { id: a, text: { en: "Data ingestion and processing", fr: "L'ingestion et le traitement des données" } }
    - { id: b, text: { en: "The analytical data store", fr: "Le magasin de données analytique" } }
    - { id: c, text: { en: "The analytical data model", fr: "Le modèle de données analytique" } }
    - { id: d, text: { en: "Data visualization", fr: "La visualisation des données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Analysts can work directly with the analytical data store, but it is common to add a data model on top of it. Today this is a semantic model, which defines tables, relationships, hierarchies and measures and makes reports and dashboards easier to produce.
    fr: |
      Les analystes peuvent travailler directement avec le magasin de données analytique, mais il est courant d'y ajouter un modèle de données. Aujourd'hui, il s'agit d'un modèle sémantique, qui définit des tables, des relations, des hiérarchies et des mesures et facilite la production de rapports et de tableaux de bord.
  options:
    a: { en: "Ingestion and processing loads the data from the sources and prepares it for analysis.", fr: "L'ingestion et le traitement chargent les données depuis les sources et les préparent pour l'analyse." }
    b: { en: "The analytical data store, a data warehouse, a data lake or a lakehouse, keeps the prepared data.", fr: "Le magasin de données analytique, un entrepôt de données, un lac de données ou un lakehouse, conserve les données préparées." }
    d: { en: "Data visualization consumes the model to produce reports and dashboards; it doesn't define the model.", fr: "La visualisation des données consomme le modèle pour produire des rapports et des tableaux de bord ; elle ne définit pas le modèle." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
