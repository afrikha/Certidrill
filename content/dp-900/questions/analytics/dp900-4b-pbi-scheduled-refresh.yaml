id: dp900-4b-pbi-scheduled-refresh
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A report in the Power BI service is based on a semantic model that imports its data from Azure SQL Database. Every morning, the report must show the sales of the previous day, without any manual action.

    What should you configure?
  fr: |
    Un rapport du service Power BI repose sur un modèle sémantique qui importe ses données depuis Azure SQL Database. Chaque matin, le rapport doit afficher les ventes de la veille, sans aucune action manuelle.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A data alert on a dashboard tile", fr: "Une alerte de données sur une vignette de tableau de bord" }
    - id: b
      text: { en: "A subscription to the report", fr: "Un abonnement au rapport" }
    - id: c
      text: { en: "A scheduled refresh of the semantic model", fr: "Une actualisation planifiée du modèle sémantique" }
    - id: d
      text: { en: "A slicer on the report page", fr: "Un segment sur la page du rapport" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An imported semantic model holds a copy of the source data as it was at the last refresh. In the Power BI service, you schedule the refresh of the semantic model so that the data is copied again from the source at the times you choose, and the reports built on the model show the new data.
    fr: |
      Un modèle sémantique importé contient une copie des données sources telles qu'elles étaient à la dernière actualisation. Dans le service Power BI, vous planifiez l'actualisation du modèle sémantique pour que les données soient de nouveau copiées depuis la source aux heures choisies, et les rapports construits sur le modèle affichent les nouvelles données.
  options:
    a:
      en: A data alert notifies you when the value of a tile passes a limit; it doesn't bring new data into the model.
      fr: "Une alerte de données vous avertit quand la valeur d'une vignette dépasse une limite ; elle ne fait pas entrer de nouvelles données dans le modèle."
    b:
      en: A subscription sends the report by email, with the data that the model already contains; it doesn't refresh the model.
      fr: "Un abonnement envoie le rapport par e-mail, avec les données que le modèle contient déjà ; il n'actualise pas le modèle."
    d:
      en: A slicer filters the data that is already in the model; it doesn't update it.
      fr: "Un segment filtre les données déjà présentes dans le modèle ; il ne les met pas à jour."
references:
  - title: Data refresh in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-data
  - title: Describe Power BI tools and workflow
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/2-power-bi
