id: dp900-4b-bs-dd-size-analysis
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Stream processing is intended for [[size]].

      Stream processing is typically used for [[analysis]].
    fr: |
      Le traitement de flux est destiné à [[size]].

      Le traitement de flux sert généralement à [[analysis]].
  slots:
    - id: size
      options:
        - { id: whole, text: { en: "the whole dataset in one operation", fr: "tout le jeu de données en une seule opération" } }
        - { id: micro, text: { en: "individual records or micro-batches of a few records", fr: "des enregistrements individuels ou des micro-lots de quelques enregistrements" } }
        - { id: monthly, text: { en: "one large file of data per month", fr: "un gros fichier de données par mois" } }
    - id: analysis
      options:
        - { id: simple, text: { en: "simple response functions, aggregates and rolling averages", fr: "des fonctions de réponse simples, des agrégats et des moyennes mobiles" } }
        - { id: complex, text: { en: "complex analytics on the whole history of the data", fr: "une analytique complexe sur tout l'historique des données" } }
        - { id: load, text: { en: "the nightly load of a data warehouse", fr: "le chargement nocturne d'un entrepôt de données" } }
answer:
  values: { size: micro, analysis: simple }
explanation:
  correct:
    en: |
      Stream processing is intended for individual records or micro-batches made of a few records, whereas batch processing handles large datasets efficiently. Because each piece of data must be handled within seconds or milliseconds, stream processing is used for simple response functions, aggregates and calculations such as rolling averages. Complex analytics on the full history and nightly loads are batch tasks.
    fr: |
      Le traitement de flux est destiné à des enregistrements individuels ou à des micro-lots de quelques enregistrements, alors que le traitement par lots traite efficacement de gros jeux de données. Comme chaque donnée doit être traitée en quelques secondes ou millisecondes, le traitement de flux sert aux fonctions de réponse simples, aux agrégats et aux calculs comme les moyennes mobiles. L'analytique complexe sur tout l'historique et les chargements nocturnes sont des tâches par lots.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
