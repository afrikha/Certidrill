id: dp900-4c-model-fact-columns
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You design the Sales fact table of a star schema that also contains Product, Customer and Date dimension tables.

    Which two types of columns should the Sales table contain? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la table de faits Sales d'un schéma en étoile qui contient aussi les tables de dimension Product, Customer et Date.

    Quels sont les deux types de colonnes que la table Sales doit contenir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The name and the color of each product", fr: "Le nom et la couleur de chaque produit" } }
    - { id: b, text: { en: "The quantity and the revenue of each sale", fr: "La quantité et le chiffre d'affaires de chaque vente" } }
    - { id: c, text: { en: "The city and the country/region of each customer", fr: "La ville et le pays/région de chaque client" } }
    - { id: d, text: { en: "The keys of the product, the customer and the date of each sale", fr: "Les clés du produit, du client et de la date de chaque vente" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A fact table contains the numeric values to summarize, here the quantity and the revenue, and the dimension key columns that relate each row to the dimension tables. The descriptive attributes are stored once in the dimension tables, where they are used to filter and group the facts."
    fr: "Une table de faits contient les valeurs numériques à synthétiser, ici la quantité et le chiffre d'affaires, et les colonnes de clé de dimension qui relient chaque ligne aux tables de dimension. Les attributs descriptifs sont stockés une seule fois dans les tables de dimension, où ils servent à filtrer et à regrouper les faits."
  options:
    a:
      en: "The name and the color are attributes of a product: they belong to the Product dimension table."
      fr: "Le nom et la couleur sont des attributs d'un produit : ils appartiennent à la table de dimension Product."
    c:
      en: "The city and the country/region are attributes of a customer: they belong to the Customer dimension table."
      fr: "La ville et le pays/région sont des attributs d'un client : ils appartiennent à la table de dimension Customer."
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
