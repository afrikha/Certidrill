id: dp900-4b-rt-yn-rti-basics
objective: "4.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Real-Time Intelligence in Microsoft Fabric, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Real-Time Intelligence dans Microsoft Fabric, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Real-Time Intelligence is intended for solutions that react to events as they happen instead of on a schedule.
        fr: Real-Time Intelligence est destiné aux solutions qui réagissent aux événements au moment où ils se produisent plutôt que selon une planification.
    - id: s2
      text:
        en: An eventhouse is designed for time-based data, such as device telemetry and logs.
        fr: Un eventhouse est conçu pour les données temporelles, comme la télémétrie d'appareils et les journaux.
    - id: s3
      text:
        en: To use Real-Time Intelligence, you must first create an Azure Stream Analytics job.
        fr: Pour utiliser Real-Time Intelligence, vous devez d'abord créer un travail Azure Stream Analytics.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Real-Time Intelligence is the Fabric workload for data in motion: it is meant for solutions that respond to events when they occur. Its eventhouse stores and analyzes time-based streaming events such as telemetry, logs and time series. The workload has its own items for ingestion, storage, visualization and actions; Azure Stream Analytics is a separate Azure service and isn't required.
    fr: |
      Real-Time Intelligence est la charge de travail de Fabric pour les données en mouvement : elle est destinée aux solutions qui réagissent aux événements quand ils se produisent. Son eventhouse stocke et analyse des événements de streaming temporels comme la télémétrie, les journaux et les séries chronologiques. La charge de travail a ses propres éléments pour l'ingestion, le stockage, la visualisation et les actions ; Azure Stream Analytics est un service Azure distinct, qui n'est pas requis.
references:
  - title: What is Real-Time Intelligence?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
  - title: Eventhouse overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/eventhouse
