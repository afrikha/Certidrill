id: dp900-4a-svc-databricks-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum is evaluating Azure Databricks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue Azure Databricks.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An Azure Databricks notebook can contain code written in Python, SQL, Scala, or R.
        fr: Un notebook Azure Databricks peut contenir du code écrit en Python, SQL, Scala ou R.
    - id: s2
      text:
        en: SQL analytics and machine learning workloads can use the same lakehouse data in Azure Databricks.
        fr: Dans Azure Databricks, les charges de travail d'analytique SQL et de machine learning peuvent utiliser les mêmes données de lakehouse.
    - id: s3
      text:
        en: Unity Catalog provides the SQL warehouses that run analytical queries on Delta tables.
        fr: Unity Catalog fournit les entrepôts SQL qui exécutent les requêtes analytiques sur les tables Delta.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Databricks notebooks are collaborative notebooks in Python, SQL, Scala and R. The Databricks lakehouse is a unified storage layer built on Delta Lake that supports SQL analytics and machine learning in the same environment. SQL warehouses belong to Databricks SQL; Unity Catalog is the governance layer that provides access control, lineage and discovery for data and AI assets.
    fr: |
      Les notebooks Databricks sont des notebooks collaboratifs en Python, SQL, Scala et R. Le lakehouse Databricks est une couche de stockage unifiée, bâtie sur Delta Lake, qui prend en charge l'analytique SQL et le machine learning dans le même environnement. Les entrepôts SQL relèvent de Databricks SQL ; Unity Catalog est la couche de gouvernance qui assure le contrôle d'accès, la traçabilité et la découverte des données et des ressources d'IA.
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Unity Catalog?
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/
