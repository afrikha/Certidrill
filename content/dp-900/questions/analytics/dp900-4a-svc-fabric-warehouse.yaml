id: dp900-4a-svc-fabric-warehouse
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The finance team of Litware works only with structured data and writes SQL. The team needs a fully managed relational store in Microsoft Fabric in which it can insert and update rows in transactions that span several tables.

    Which Fabric item should the team use?
  fr: |
    L'équipe financière de Litware ne travaille qu'avec des données structurées et écrit du SQL. L'équipe a besoin, dans Microsoft Fabric, d'un magasin relationnel entièrement managé dans lequel elle peut insérer et mettre à jour des lignes au sein de transactions portant sur plusieurs tables.

    Quel élément Fabric l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A Lakehouse", fr: "Un Lakehouse" } }
    - { id: b, text: { en: "An Eventhouse", fr: "Un Eventhouse" } }
    - { id: c, text: { en: "A Dataflow Gen2", fr: "Un Dataflow Gen2" } }
    - { id: d, text: { en: "A Warehouse", fr: "Un Warehouse" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Fabric Warehouse is a fully managed relational data warehouse that is queried with T-SQL. It is the choice when the data is structured, the team writes SQL and strong schema enforcement is needed, and it supports transactions that span several tables.
    fr: |
      Un Warehouse Fabric est un entrepôt de données relationnel entièrement managé, interrogé en T-SQL. C'est le choix adapté lorsque les données sont structurées, que l'équipe écrit du SQL et qu'une application stricte du schéma est nécessaire, et il prend en charge les transactions portant sur plusieurs tables.
  options:
    a: { en: "A Lakehouse is developed mainly with Apache Spark; its SQL analytics endpoint only reads the tables, and multi-table transactions aren't supported.", fr: "Un Lakehouse se développe principalement avec Apache Spark ; son point de terminaison d'analytique SQL ne fait que lire les tables, et les transactions portant sur plusieurs tables ne sont pas prises en charge." }
    b: { en: "An Eventhouse hosts KQL databases optimized for time-series and streaming data, queried with Kusto Query Language.", fr: "Un Eventhouse héberge des bases de données KQL optimisées pour les séries chronologiques et les données de streaming, interrogées avec le langage de requête Kusto." }
    c: { en: "A Dataflow Gen2 transforms and loads data; it isn't a data store.", fr: "Un Dataflow Gen2 transforme et charge des données ; ce n'est pas un magasin de données." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
