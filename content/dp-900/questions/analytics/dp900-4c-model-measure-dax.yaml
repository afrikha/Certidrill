id: dp900-4c-model-measure-dax
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a measure named **Total Revenue** in a Power BI semantic model.

    Which language do you use to write the formula of the measure?
  fr: |
    Vous créez une mesure nommée **Total Revenue** dans un modèle sémantique Power BI.

    Quel langage utilisez-vous pour écrire la formule de la mesure ?
body:
  options:
    - { id: a, text: "DAX (Data Analysis Expressions)" }
    - { id: b, text: "Power Query M" }
    - { id: c, text: "Transact-SQL" }
    - { id: d, text: "KQL (Kusto Query Language)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Measures of a Power BI semantic model are written in DAX (Data Analysis Expressions), a formula language whose functions resemble those of Excel. The result of a measure is calculated when a report queries the model."
    fr: "Les mesures d'un modèle sémantique Power BI s'écrivent en DAX (Data Analysis Expressions), un langage de formules dont les fonctions ressemblent à celles d'Excel. Le résultat d'une mesure est calculé quand un rapport interroge le modèle."
  options:
    b:
      en: "M is the language of Power Query: it transforms the data before it is loaded into the model, it does not define measures."
      fr: "M est le langage de Power Query : il transforme les données avant leur chargement dans le modèle, il ne définit pas de mesures."
    c:
      en: "Transact-SQL queries relational databases such as Azure SQL Database; measures of a semantic model are not written in SQL."
      fr: "Transact-SQL interroge des bases de données relationnelles comme Azure SQL Database ; les mesures d'un modèle sémantique ne s'écrivent pas en SQL."
    d:
      en: "KQL queries log and event data, for example in Azure Data Explorer; it is not the formula language of Power BI models."
      fr: "KQL interroge des données de journaux et d'événements, par exemple dans Azure Data Explorer ; ce n'est pas le langage de formules des modèles Power BI."
references:
  - title: Measures in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-measures
