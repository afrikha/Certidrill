id: dp900-4a-svc-fabric-scenario
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants a single software as a service (SaaS) platform that covers data ingestion, a lakehouse, a data warehouse, real-time analytics, and Power BI reports. All these workloads must share one data lake.

    Which service should Contoso use?
  fr: |
    Contoso veut une seule plateforme de type logiciel en tant que service (SaaS) qui couvre l'ingestion des données, un lakehouse, un entrepôt de données, l'analytique en temps réel et les rapports Power BI. Toutes ces charges de travail doivent partager un même lac de données.

    Quel service Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: Azure Databricks }
    - { id: b, text: Azure Data Factory }
    - { id: c, text: Microsoft Fabric }
    - { id: d, text: Azure SQL Managed Instance }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Fabric is a unified analytics platform delivered as SaaS. Its workloads, including Data Factory, Lakehouse, Warehouse, Real-Time Intelligence and Power BI, all read from and write to OneLake, a single data lake for the whole tenant.
    fr: |
      Microsoft Fabric est une plateforme d'analytique unifiée fournie en tant que SaaS. Ses charges de travail, dont Data Factory, Lakehouse, Warehouse, Real-Time Intelligence et Power BI, lisent et écrivent toutes dans OneLake, un lac de données unique pour tout le locataire.
  options:
    a: { en: "Azure Databricks is an analytics platform built on Apache Spark that runs as a managed service in your Azure subscription; Power BI isn't one of its components.", fr: "Azure Databricks est une plateforme d'analytique bâtie sur Apache Spark qui s'exécute comme un service managé dans votre abonnement Azure ; Power BI n'en est pas un composant." }
    b: { en: "Azure Data Factory only builds data integration pipelines; it provides no lakehouse, warehouse or reports.", fr: "Azure Data Factory sert uniquement à créer des pipelines d'intégration de données ; il ne fournit ni lakehouse, ni entrepôt, ni rapports." }
    d: { en: "Azure SQL Managed Instance is a relational database service for transactional workloads.", fr: "Azure SQL Managed Instance est un service de base de données relationnelle pour des charges de travail transactionnelles." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
