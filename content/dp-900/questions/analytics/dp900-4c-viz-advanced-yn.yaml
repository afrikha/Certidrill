id: dp900-4c-viz-advanced-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Power BI visuals, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les visuels Power BI, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In a bubble chart, the size of each bubble represents a third numeric value.
        fr: Dans un graphique en bulles, la taille de chaque bulle représente une troisième valeur numérique.
    - id: s2
      text:
        en: A combo chart combines a column chart and a line chart in a single visual.
        fr: Un graphique combiné associe un histogramme et un graphique en courbes dans un même visuel.
    - id: s3
      text:
        en: A pie chart is a great choice when the data contains a large number of categories.
        fr: Un graphique en secteurs est un excellent choix quand les données contiennent un grand nombre de catégories.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A bubble chart is a scatter chart in which the size of the points adds a third data dimension to the two numeric axes. A combo chart combines a column chart and a line chart, with one or two vertical axes, which helps to compare measures that have different value ranges. Pie charts show the parts of a whole and work well only with a small number of categories."
    fr: "Un graphique en bulles est un nuage de points dans lequel la taille des points ajoute une troisième dimension de données aux deux axes numériques. Un graphique combiné associe un histogramme et un graphique en courbes, avec un ou deux axes verticaux, ce qui aide à comparer des mesures dont les plages de valeurs diffèrent. Les graphiques en secteurs montrent les parts d'un tout et ne conviennent qu'à un petit nombre de catégories."
references:
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
  - title: Combo Chart in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-combo-chart
