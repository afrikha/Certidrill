id: dp900-4a-ing-architecture-elements
objective: "4.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In a large-scale analytics architecture, loading data from transactional data stores, files, and real-time streams is the role of the [[e1]] element.

      Reports and dashboards that show trends and key performance indicators (KPIs) are produced in the [[e2]] element.
    fr: |
      Dans une architecture d'analytique à grande échelle, le chargement des données issues de magasins de données transactionnels, de fichiers et de flux en temps réel est le rôle de l'élément [[e1]].

      Les rapports et les tableaux de bord qui montrent des tendances et des indicateurs de performance clés (KPI) sont produits dans l'élément [[e2]].
  slots:
    - id: e1
      options:
        - { id: store, text: { en: "analytical data store", fr: "magasin de données analytique" } }
        - { id: model, text: { en: "analytical data model", fr: "modèle de données analytique" } }
        - { id: ingest, text: { en: "data ingestion and processing", fr: "ingestion et traitement des données" } }
        - { id: viz, text: { en: "data visualization", fr: "visualisation des données" } }
    - id: e2
      options:
        - { id: store, text: { en: "analytical data store", fr: "magasin de données analytique" } }
        - { id: model, text: { en: "analytical data model", fr: "modèle de données analytique" } }
        - { id: ingest, text: { en: "data ingestion and processing", fr: "ingestion et traitement des données" } }
        - { id: viz, text: { en: "data visualization", fr: "visualisation des données" } }
answer:
  values: { e1: ingest, e2: viz }
explanation:
  correct:
    en: |
      Data ingestion and processing loads data from transactional data stores, files and real-time streams into a data lake or a data warehouse and prepares it for analysis. Data visualization is where analysts create the reports and dashboards that show trends, comparisons and KPIs.
    fr: |
      L'ingestion et le traitement des données chargent les données de magasins de données transactionnels, de fichiers et de flux en temps réel dans un lac de données ou un entrepôt de données et les préparent pour l'analyse. La visualisation des données est l'élément où les analystes créent les rapports et les tableaux de bord qui montrent des tendances, des comparaisons et des KPI.
  options:
    store: { en: "The analytical data store keeps the prepared data in a data warehouse, a data lake or a lakehouse.", fr: "Le magasin de données analytique conserve les données préparées dans un entrepôt de données, un lac de données ou un lakehouse." }
    model: { en: "The analytical data model defines tables, relationships, hierarchies and measures on top of the store.", fr: "Le modèle de données analytique définit des tables, des relations, des hiérarchies et des mesures au-dessus du magasin." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
