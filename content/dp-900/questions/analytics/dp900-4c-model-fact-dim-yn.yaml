id: dp900-4c-model-fact-dim-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    An analytical model contains a fact table named Sales and dimension tables named Customer, Product and Date.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle analytique contient une table de faits nommée Sales et des tables de dimension nommées Customer, Product et Date.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each row of the Customer table is identified by a unique key value.
        fr: Chaque ligne de la table Customer est identifiée par une valeur de clé unique.
    - id: s2
      text:
        en: The Sales table usually contains fewer rows than the Product table.
        fr: La table Sales contient en général moins de lignes que la table Product.
    - id: s3
      text:
        en: The name and the city of each customer are stored in the Sales table.
        fr: Le nom et la ville de chaque client sont stockés dans la table Sales.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A dimension table has one row per entity, with a unique key and attribute columns such as the name and the city of a customer. A fact table has one row per recorded event: it holds the keys of the related dimensions and the numeric values, and it generally has many more rows than the dimension tables because it keeps growing with each sale. Descriptive attributes stay in the dimension tables, not in the fact table."
    fr: "Une table de dimension contient une ligne par entité, avec une clé unique et des colonnes d'attributs comme le nom et la ville d'un client. Une table de faits contient une ligne par événement enregistré : elle porte les clés des dimensions liées et les valeurs numériques, et elle compte en général beaucoup plus de lignes que les tables de dimension, car elle grossit à chaque vente. Les attributs descriptifs restent dans les tables de dimension, pas dans la table de faits."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
