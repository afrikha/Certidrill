id: dp900-4b-rt-yn-spark
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Queries for Spark Structured Streaming must be written in Kusto Query Language (KQL).
        fr: Les requêtes de Spark Structured Streaming doivent être écrites en Kusto Query Language (KQL).
    - id: s2
      text:
        en: Spark Structured Streaming reads a stream into a dataframe that continuously receives new rows.
        fr: Spark Structured Streaming lit un flux dans un dataframe qui reçoit de nouvelles lignes en continu.
    - id: s3
      text:
        en: Apache Spark supports both batch processing and stream processing.
        fr: Apache Spark prend en charge à la fois le traitement par lots et le traitement de flux.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Spark is programmed in languages such as Python, Scala, Java, R and SQL; KQL is the language of eventhouses in Microsoft Fabric, not of Spark. Spark Structured Streaming treats a live stream like a table that keeps growing: the incoming data is read into a dataframe that continuously fills with new rows, on which you run a query. The same Spark engine handles batch processing and stream processing.
    fr: |
      Spark se programme dans des langages comme Python, Scala, Java, R et SQL ; KQL est le langage des eventhouses de Microsoft Fabric, pas celui de Spark. Spark Structured Streaming traite un flux en direct comme une table qui grandit sans cesse : les données entrantes sont lues dans un dataframe qui se remplit en continu de nouvelles lignes, sur lequel vous exécutez une requête. Le même moteur Spark assure le traitement par lots et le traitement de flux.
references:
  - title: Explore Apache Spark structured streaming
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/5-spark-streaming
