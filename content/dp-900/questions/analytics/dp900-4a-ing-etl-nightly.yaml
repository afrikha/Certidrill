id: dp900-4a-ing-etl-nightly
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, a process reads the day's orders from an operational database, removes the invalid rows and aggregates the data in the pipeline, and then writes the result to a data warehouse.

    Which type of process is this?
  fr: |
    Chaque nuit, un processus lit les commandes du jour dans une base de données opérationnelle, supprime les lignes non valides et agrège les données dans le pipeline, puis écrit le résultat dans un entrepôt de données.

    De quel type de processus s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Extract, load, and transform (ELT)", fr: "Extraction, chargement et transformation (ELT)" } }
    - { id: b, text: { en: "Extract, transform, and load (ETL)", fr: "Extraction, transformation et chargement (ETL)" } }
    - { id: c, text: { en: "Online transaction processing (OLTP)", fr: "Traitement transactionnel en ligne (OLTP)" } }
    - { id: d, text: { en: "Real-time stream processing", fr: "Traitement de flux en temps réel" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The data is extracted from the source, cleaned and aggregated in the pipeline, and only then loaded into the data warehouse. Transforming the data before it reaches the analytical data store is what defines an ETL process.
    fr: |
      Les données sont extraites de la source, nettoyées et agrégées dans le pipeline, et seulement ensuite chargées dans l'entrepôt de données. Transformer les données avant qu'elles n'atteignent le magasin de données analytique est ce qui définit un processus ETL.
  options:
    a: { en: "With ELT, the data is copied to the analytical data store as it is and transformed there afterward.", fr: "Avec ELT, les données sont copiées telles quelles dans le magasin de données analytique, puis transformées sur place." }
    c: { en: "OLTP describes the workload of the operational database that records the orders, not the loading of an analytical store.", fr: "OLTP décrit la charge de travail de la base de données opérationnelle qui enregistre les commandes, pas le chargement d'un magasin analytique." }
    d: { en: "The process handles a day of stored data once per night, which is batch processing, not the processing of events as they arrive.", fr: "Le processus traite une journée de données stockées une fois par nuit : c'est un traitement par lots, pas le traitement d'événements à mesure qu'ils arrivent." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
  - title: Extract, transform, and load (ETL)
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
