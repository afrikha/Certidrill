id: dp900-4b-rt-event-hubs
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application of Adatum Corporation produces millions of click events per hour. You need an Azure service that ingests the events and queues them so that a stream processing solution can read them.

    Which service should you use?
  fr: |
    Une application web d'Adatum Corporation produit des millions d'événements de clic par heure. Vous avez besoin d'un service Azure qui ingère les événements et les met en file d'attente pour qu'une solution de traitement de flux puisse les lire.

    Quel service devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Azure Event Hubs" }
    - { id: b, text: "Azure Stream Analytics" }
    - { id: c, text: "Azure SQL Database" }
    - { id: d, text: "Power BI" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Event Hubs is a data ingestion service built to receive high volumes of events, up to millions per second, and to keep them in order in partitions so that consumers can read them. It is a typical streaming source for clickstreams and application logs.
    fr: |
      Azure Event Hubs est un service d'ingestion de données conçu pour recevoir de gros volumes d'événements, jusqu'à des millions par seconde, et pour les conserver dans l'ordre dans des partitions afin que des consommateurs puissent les lire. C'est une source de streaming typique pour les flux de clics et les journaux d'applications.
  options:
    b:
      en: Azure Stream Analytics processes a stream with a query; it reads the events from a source such as Azure Event Hubs.
      fr: "Azure Stream Analytics traite un flux avec une requête ; il lit les événements dans une source comme Azure Event Hubs."
    c:
      en: Azure SQL Database is a relational database. It can keep the results of stream processing in tables, but it isn't an event ingestion queue.
      fr: Azure SQL Database est une base de données relationnelle. Elle peut conserver les résultats d'un traitement de flux dans des tables, mais ce n'est pas une file d'attente d'ingestion d'événements.
    d:
      en: Power BI visualizes data; in a streaming solution it is a sink that shows the results in real time.
      fr: "Power BI visualise des données ; dans une solution de streaming, c'est un récepteur (sink) qui affiche les résultats en temps réel."
references:
  - title: What is Azure Event Hubs?
    url: https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-about
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
