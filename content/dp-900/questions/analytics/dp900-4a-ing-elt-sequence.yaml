id: dp900-4a-ing-elt-sequence
objective: "4.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware plans an extract, load, and transform (ELT) process that brings order data from an operational database into a data lake.

    Which three actions should the process perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware prévoit un processus d'extraction, de chargement et de transformation (ELT) qui amène des données de commandes d'une base de données opérationnelle vers un lac de données.

    Quelles sont les trois actions que le processus doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pre, text: { en: "Clean and restructure the data in the pipeline before it reaches the data lake.", fr: "Nettoyer et restructurer les données dans le pipeline avant qu'elles n'atteignent le lac de données." } }
    - { id: load, text: { en: "Copy the data as it is to the data lake.", fr: "Copier les données telles quelles dans le lac de données." } }
    - { id: rep, text: { en: "Create a report that shows the orders by month.", fr: "Créer un rapport qui présente les commandes par mois." } }
    - { id: ext, text: { en: "Read the order data from the operational database.", fr: "Lire les données de commandes dans la base de données opérationnelle." } }
    - { id: tr, text: { en: "Clean and restructure the data by using the Spark engine of the analytical platform.", fr: "Nettoyer et restructurer les données avec le moteur Spark de la plateforme analytique." } }
    - { id: norm, text: { en: "Normalize the tables of the operational database.", fr: "Normaliser les tables de la base de données opérationnelle." } }
answer:
  sequence: [ ext, load, tr ]
explanation:
  correct:
    en: |
      ELT means extract, load, then transform. The process reads the data from the source, copies it unchanged to the data lake, and only then transforms it with the processing engine of the analytical platform.
    fr: |
      ELT signifie extraire, charger, puis transformer. Le processus lit les données dans la source, les copie sans modification dans le lac de données, et seulement ensuite les transforme avec le moteur de traitement de la plateforme analytique.
  options:
    pre: { en: "Transforming the data in the pipeline before loading is the ETL order, not ELT.", fr: "Transformer les données dans le pipeline avant le chargement correspond à l'ordre ETL, pas ELT." }
    rep: { en: "A report belongs to data visualization, which comes after the ELT process and isn't one of its steps.", fr: "Un rapport relève de la visualisation des données, qui vient après le processus ELT et n'en est pas une étape." }
    norm: { en: "The process reads the operational database; it doesn't redesign its tables.", fr: "Le processus lit la base de données opérationnelle ; il n'en redéfinit pas les tables." }
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
