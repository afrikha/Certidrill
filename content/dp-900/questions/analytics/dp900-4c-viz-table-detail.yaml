id: dp900-4c-viz-table-detail
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report page must list every order of the current month with its order number, order date, customer name and exact amount.

    Which visual should you use?
  fr: |
    Une page de rapport doit lister toutes les commandes du mois en cours avec leur numéro, leur date, le nom du client et leur montant exact.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Card", fr: "Carte (card)" } }
    - { id: b, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
    - { id: c, text: { en: "Table", fr: "Table" } }
    - { id: d, text: { en: "Scatter chart", fr: "Nuage de points" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A table presents related data in a grid of rows and columns. It is the appropriate visual when numerous related values must be displayed and users need to read the exact values."
    fr: "Une table présente des données liées dans une grille de lignes et de colonnes. C'est le visuel approprié quand de nombreuses valeurs liées doivent être affichées et que les utilisateurs ont besoin de lire les valeurs exactes."
  options:
    a:
      en: "A card highlights a single figure, such as the total amount of the orders, not one line per order."
      fr: "Une carte met en avant un seul chiffre, comme le montant total des commandes, pas une ligne par commande."
    b:
      en: "A pie chart shows the parts of a total for a few categories; it cannot list several fields for each order."
      fr: "Un graphique en secteurs montre les parts d'un total pour quelques catégories ; il ne peut pas lister plusieurs champs pour chaque commande."
    d:
      en: "A scatter chart plots points from two numeric values; it does not display text fields such as a customer name."
      fr: "Un nuage de points trace des points à partir de deux valeurs numériques ; il n'affiche pas des champs de texte comme le nom d'un client."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
