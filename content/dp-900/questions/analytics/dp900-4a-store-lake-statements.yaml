id: dp900-4a-store-lake-statements
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about data lakes are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies concernant les lacs de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Data must be organized into fact and dimension tables before it is stored.", fr: "Les données doivent être organisées en tables de faits et de dimension avant d'être stockées." } }
    - { id: b, text: { en: "A data lake accepts structured data but rejects unstructured files.", fr: "Un lac de données accepte les données structurées, mais rejette les fichiers non structurés." } }
    - { id: c, text: { en: "The files are usually stored on a distributed file system.", fr: "Les fichiers sont généralement stockés sur un système de fichiers distribué." } }
    - { id: d, text: { en: "Queries on the files require a relational engine that enforces constraints.", fr: "Les requêtes sur les fichiers exigent un moteur relationnel qui impose des contraintes." } }
    - { id: e, text: { en: "Distributed engines such as Apache Spark process queries on the stored files.", fr: "Des moteurs distribués comme Apache Spark traitent les requêtes sur les fichiers stockés." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A data lake is a file store, usually on a distributed file system for high-performance data access. Distributed processing engines such as Apache Spark process queries on the stored files and return data for reporting and analytics.
    fr: |
      Un lac de données est un magasin de fichiers, généralement sur un système de fichiers distribué pour un accès aux données à hautes performances. Des moteurs de traitement distribués comme Apache Spark traitent les requêtes sur les fichiers stockés et renvoient des données pour les rapports et l'analytique.
  options:
    a: { en: "Fact and dimension tables are the schema of a data warehouse; a data lake keeps files as they are.", fr: "Les tables de faits et de dimension sont le schéma d'un entrepôt de données ; un lac de données conserve les fichiers tels quels." }
    b: { en: "A data lake supports a mix of structured, semi-structured and unstructured data.", fr: "Un lac de données prend en charge un mélange de données structurées, semi-structurées et non structurées." }
    d: { en: "No constraint is enforced on the files; a schema is applied when the data is read.", fr: "Aucune contrainte n'est imposée sur les fichiers ; un schéma est appliqué à la lecture des données." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
