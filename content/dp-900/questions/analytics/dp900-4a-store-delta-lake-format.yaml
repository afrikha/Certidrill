id: dp900-4a-store-delta-lake-format
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which open-source format adds relational capabilities, such as tables that enforce a schema and transactional consistency, to Parquet files in a lakehouse?
  fr: |
    Quel format open source ajoute des capacités relationnelles, comme des tables qui imposent un schéma et une cohérence transactionnelle, aux fichiers Parquet d'un lakehouse ?
body:
  options:
    - { id: a, text: Avro }
    - { id: b, text: Delta Lake }
    - { id: c, text: JSON }
    - { id: d, text: { en: "Delimited text (CSV)", fr: "Texte délimité (CSV)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Delta Lake is the open-source lakehouse format used by Microsoft Fabric and Azure Databricks. It adds relational capabilities on top of Parquet files: tables that enforce schemas and transactional consistency, for batch-loaded and streaming data.
    fr: |
      Delta Lake est le format open source de lakehouse utilisé par Microsoft Fabric et Azure Databricks. Il ajoute des capacités relationnelles aux fichiers Parquet : des tables qui imposent des schémas et une cohérence transactionnelle, pour des données chargées par lots et des données de streaming.
  options:
    a: { en: "Avro is a row-based file format; it doesn't add tables or transactions to Parquet files.", fr: "Avro est un format de fichier orienté ligne ; il n'ajoute ni tables ni transactions aux fichiers Parquet." }
    c: { en: "JSON is a semi-structured text format for documents.", fr: "JSON est un format texte semi-structuré pour des documents." }
    d: { en: "Delimited text stores rows of values separated by a delimiter, with no enforced schema and no transactions.", fr: "Le texte délimité stocke des lignes de valeurs séparées par un délimiteur, sans schéma imposé ni transactions." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
  - title: What is Delta Lake in Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/
