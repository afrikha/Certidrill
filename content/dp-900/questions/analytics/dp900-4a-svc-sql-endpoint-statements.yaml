id: dp900-4a-svc-sql-endpoint-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank creates a Lakehouse and a Warehouse in a Microsoft Fabric workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée un Lakehouse et un Warehouse dans un espace de travail Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A SQL analytics endpoint is created automatically for the Lakehouse.
        fr: Un point de terminaison d'analytique SQL est créé automatiquement pour le Lakehouse.
    - id: s2
      text:
        en: Analysts can update rows of the Lakehouse tables by running T-SQL statements against the SQL analytics endpoint.
        fr: Les analystes peuvent mettre à jour des lignes des tables du Lakehouse en exécutant des instructions T-SQL sur le point de terminaison d'analytique SQL.
    - id: s3
      text:
        en: The Warehouse supports transactions that span several tables.
        fr: Le Warehouse prend en charge les transactions portant sur plusieurs tables.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When you create a Fabric Lakehouse, a SQL analytics endpoint is created automatically. That endpoint is read-only: T-SQL can query the Delta tables but can't insert, update or delete their data, which is done with Spark or with ingestion tools. The Warehouse provides full T-SQL data modification with multi-table transactions.
    fr: |
      Lorsque vous créez un Lakehouse Fabric, un point de terminaison d'analytique SQL est créé automatiquement. Ce point de terminaison est en lecture seule : T-SQL peut interroger les tables Delta, mais ne peut ni insérer, ni mettre à jour, ni supprimer leurs données, ce qui se fait avec Spark ou avec les outils d'ingestion. Le Warehouse offre toutes les modifications de données en T-SQL, avec des transactions portant sur plusieurs tables.
references:
  - title: What is a lakehouse in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
