id: dp900-4a-store-lakehouse-internals
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In a data lakehouse, the raw data is stored as [[s1]].

      [[s2]] exposes the data as tables that can be queried with SQL.
    fr: |
      Dans un data lakehouse, les données brutes sont stockées sous forme de [[s1]].

      [[s2]] expose les données sous forme de tables interrogeables en SQL.
  slots:
    - id: s1
      options:
        - { id: rows, text: { en: "rows in a transactional database", fr: "lignes dans une base de données transactionnelle" } }
        - { id: cubes, text: { en: "cubes of pre-aggregated values", fr: "cubes de valeurs préagrégées" } }
        - { id: files, text: { en: "files in a data lake", fr: "fichiers dans un lac de données" } }
    - id: s2
      options:
        - { id: endpoint, text: { en: "A SQL analytics endpoint", fr: "Un point de terminaison d'analytique SQL" } }
        - { id: activity, text: { en: "A pipeline activity", fr: "Une activité de pipeline" } }
        - { id: dimtable, text: { en: "A dimension table", fr: "Une table de dimension" } }
        - { id: linked, text: { en: "A linked service", fr: "Un service lié" } }
answer:
  values: { s1: files, s2: endpoint }
explanation:
  correct:
    en: |
      A data lakehouse stores the raw data as files in a data lake. A SQL analytics endpoint then exposes those files as tables, so that analysts can query them with SQL. In Microsoft Fabric, this endpoint is created automatically with each Lakehouse.
    fr: |
      Un data lakehouse stocke les données brutes sous forme de fichiers dans un lac de données. Un point de terminaison d'analytique SQL expose ensuite ces fichiers sous forme de tables, afin que les analystes puissent les interroger en SQL. Dans Microsoft Fabric, ce point de terminaison est créé automatiquement avec chaque Lakehouse.
  options:
    cubes: { en: "Cubes of pre-aggregated values are an older form of analytical data model, not the storage of a lakehouse.", fr: "Les cubes de valeurs préagrégées sont une forme plus ancienne de modèle de données analytique, pas le stockage d'un lakehouse." }
    activity: { en: "An activity is a step of a pipeline that moves or transforms data.", fr: "Une activité est une étape d'un pipeline qui déplace ou transforme des données." }
    linked: { en: "A linked service holds the connection information of an Azure Data Factory pipeline.", fr: "Un service lié contient les informations de connexion d'un pipeline Azure Data Factory." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
