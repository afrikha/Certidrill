id: dp900-4b-bs-queue-source
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a robust stream processing solution, the events are captured in a queue before they are processed.

    What is the main purpose of the queue?
  fr: |
    Dans une solution robuste de traitement de flux, les événements sont capturés dans une file d'attente avant d'être traités.

    Quel est le rôle principal de la file d'attente ?
body:
  options:
    - id: a
      text:
        en: To aggregate the values of the events over periods of time
        fr: Agréger les valeurs des événements sur des périodes de temps
    - id: b
      text:
        en: To display the results of the processing in real time
        fr: Afficher les résultats du traitement en temps réel
    - id: c
      text:
        en: To keep the results of the processing for historical analysis
        fr: Conserver les résultats du traitement pour l'analyse historique
    - id: d
      text:
        en: To make sure that the events are processed in order, and only once each
        fr: Garantir que les événements sont traités dans l'ordre, et une seule fois chacun
answer: { optionId: d }
explanation:
  correct:
    en: |
      The streaming source captures the events so that they can be processed. In simple cases it can be a folder or a table, but robust solutions use a queue whose logic makes sure that the events are processed in order and that each event is processed only once.
    fr: |
      La source de streaming capture les événements pour qu'ils puissent être traités. Dans les cas simples, ce peut être un dossier ou une table, mais les solutions robustes utilisent une file d'attente dont la logique garantit que les événements sont traités dans l'ordre et que chaque événement n'est traité qu'une fois.
  options:
    a:
      en: Aggregating values over time windows is the work of the perpetual query that reads the events from the source.
      fr: Agréger des valeurs sur des fenêtres de temps est le travail de la requête perpétuelle qui lit les événements dans la source.
    b:
      en: Displaying results is done by a sink, such as a real-time dashboard, at the end of the solution.
      fr: L'affichage des résultats est assuré par un récepteur (sink), comme un tableau de bord en temps réel, à la fin de la solution.
    c:
      en: Results are kept by a sink such as a file or a database table; the queue is at the entry of the solution, before the processing.
      fr: "Les résultats sont conservés par un récepteur (sink) comme un fichier ou une table de base de données ; la file d'attente se trouve à l'entrée de la solution, avant le traitement."
references:
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
