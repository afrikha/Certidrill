id: dp900-4c-viz-card-bar
objective: "4.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You create a report page for the sales managers of Woodgrove.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une page de rapport pour les responsables des ventes de Woodgrove.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To display the total revenue of the year as one prominent number, add [[s1]].

      To compare the total revenue of the eight product categories, add [[s2]].
    fr: |
      Pour afficher le chiffre d'affaires total de l'année sous la forme d'un seul nombre bien visible, ajoutez [[s1]].

      Pour comparer le chiffre d'affaires total des huit catégories de produit, ajoutez [[s2]].
  slots:
    - id: s1
      options:
        - { id: map, text: { en: "a map", fr: "une carte géographique (map)" } }
        - { id: slicer, text: { en: "a slicer", fr: "un segment (slicer)" } }
        - { id: card, text: { en: "a card", fr: "une carte (card)" } }
    - id: s2
      options:
        - { id: bar, text: { en: "a bar chart", fr: "un graphique à barres" } }
        - { id: scatter, text: { en: "a scatter chart", fr: "un nuage de points" } }
        - { id: gauge, text: { en: "a gauge", fr: "une jauge" } }
answer:
  values: { s1: card, s2: bar }
explanation:
  correct:
    en: "A card displays a single fact or data point prominently, which suits one important figure such as the total revenue. Bar charts and column charts compare numeric values for discrete categories, here the eight product categories."
    fr: "Une carte affiche un seul fait ou point de données de façon bien visible, ce qui convient à un chiffre important comme le chiffre d'affaires total. Les graphiques à barres et les histogrammes comparent des valeurs numériques pour des catégories discrètes, ici les huit catégories de produit."
  options:
    map:
      en: "A map compares values for geographic locations; it does not highlight one total."
      fr: "Une carte géographique compare des valeurs entre des lieux ; elle ne met pas en avant un total."
    slicer:
      en: "A slicer is a filtering control on the canvas; it does not display a measure."
      fr: "Un segment est un contrôle de filtrage sur le canevas ; il n'affiche pas de mesure."
    scatter:
      en: "A scatter chart shows the relationship between two numeric measures, not one measure per category."
      fr: "Un nuage de points montre la relation entre deux mesures numériques, pas une mesure par catégorie."
    gauge:
      en: "A gauge shows the progress of a single value toward a target, not eight values side by side."
      fr: "Une jauge montre la progression d'une seule valeur vers un objectif, pas huit valeurs côte à côte."
references:
  - title: Describe considerations for data visualization
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/4-data-visualizations
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
