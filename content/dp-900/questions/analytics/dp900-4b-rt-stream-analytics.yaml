id: dp900-4b-rt-stream-analytics
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to implement stream processing outside Microsoft Fabric and without Apache Spark. The solution must be a platform as a service (PaaS) offering in which a job reads events from an input, applies a perpetual query written in a SQL-based language, and writes the results to an output.

    Which service should you use?
  fr: |
    Vous devez mettre en place un traitement de flux en dehors de Microsoft Fabric et sans Apache Spark. La solution doit être une offre de plateforme en tant que service (PaaS) dans laquelle un travail lit des événements dans une entrée, applique une requête perpétuelle écrite dans un langage basé sur SQL, et écrit les résultats dans une sortie.

    Quel service devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Azure Event Hubs" }
    - { id: b, text: "Azure Databricks" }
    - { id: c, text: "Azure Stream Analytics" }
    - { id: d, text: "Azure IoT Hub" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Stream Analytics is a fully managed PaaS stream processing engine. You define a streaming job that ingests data from an input such as Azure Event Hubs or Azure IoT Hub, applies a perpetual query written in a SQL-based language, and writes the results to an output such as Azure SQL Database, a data lake or Power BI.
    fr: |
      Azure Stream Analytics est un moteur de traitement de flux PaaS entièrement managé. Vous définissez un travail de streaming qui ingère des données depuis une entrée comme Azure Event Hubs ou Azure IoT Hub, applique une requête perpétuelle écrite dans un langage basé sur SQL, et écrit les résultats dans une sortie comme Azure SQL Database, un lac de données ou Power BI.
  options:
    a:
      en: Azure Event Hubs ingests and queues events. It can be the input or the output of the job, but it doesn't run the query.
      fr: Azure Event Hubs ingère les événements et les met en file d'attente. Il peut être l'entrée ou la sortie du travail, mais il n'exécute pas la requête.
    b:
      en: Azure Databricks is built on Apache Spark; streams are processed there with Spark Structured Streaming, which the requirement excludes.
      fr: "Azure Databricks repose sur Apache Spark ; les flux y sont traités avec Spark Structured Streaming, ce que l'exigence exclut."
    d:
      en: Azure IoT Hub ingests telemetry from IoT devices; it is a source for the job, not the processing engine.
      fr: "Azure IoT Hub ingère la télémétrie d'appareils IoT ; c'est une source pour le travail, pas le moteur de traitement."
references:
  - title: Welcome to Azure Stream Analytics
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-introduction
  - title: Explore common elements of stream processing architecture
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/3-explore-common-elements
