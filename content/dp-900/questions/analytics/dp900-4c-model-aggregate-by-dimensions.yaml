id: dp900-4c-model-aggregate-by-dimensions
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A semantic model contains a Sales fact table (quantity, revenue) that is related to three dimension tables only:

    - Product (name, category)
    - Customer (name, city)
    - Date (day, month, year)

    Which analysis can a report produce from this model without adding data to it?
  fr: |
    Un modèle sémantique contient une table de faits Sales (quantité, chiffre d'affaires) liée à trois tables de dimension uniquement :

    - Product (nom, catégorie)
    - Customer (nom, ville)
    - Date (jour, mois, année)

    Quelle analyse un rapport peut-il produire à partir de ce modèle sans y ajouter de données ?
body:
  options:
    - { id: a, text: { en: "Total revenue by salesperson and by year", fr: "Le chiffre d'affaires total par vendeur et par année" } }
    - { id: b, text: { en: "Total revenue by customer city and by month", fr: "Le chiffre d'affaires total par ville du client et par mois" } }
    - { id: c, text: { en: "Total quantity by store and by product category", fr: "La quantité totale par magasin et par catégorie de produit" } }
    - { id: d, text: { en: "Total quantity by supplier and by product", fr: "La quantité totale par fournisseur et par produit" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A measure can be aggregated only by the dimensions that the model contains. The city is an attribute of the Customer dimension and the month is a level of the Date dimension, so the revenue can be totaled by city and by month."
    fr: "Une mesure ne peut être agrégée que selon les dimensions que le modèle contient. La ville est un attribut de la dimension Customer et le mois est un niveau de la dimension Date : le chiffre d'affaires peut donc être totalisé par ville et par mois."
  options:
    a:
      en: "The model has no salesperson dimension, so the revenue cannot be grouped by salesperson."
      fr: "Le modèle n'a pas de dimension des vendeurs : le chiffre d'affaires ne peut pas être regroupé par vendeur."
    c:
      en: "The product category exists, but the model has no store dimension."
      fr: "La catégorie de produit existe, mais le modèle n'a pas de dimension des magasins."
    d:
      en: "The product exists, but the model has no supplier dimension or supplier attribute."
      fr: "Le produit existe, mais le modèle n'a ni dimension ni attribut des fournisseurs."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
