id: dp900-4c-model-measures-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Power BI semantic model contains a measure named **Total Revenue** that sums the revenue of a Sales fact table.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle sémantique Power BI contient une mesure nommée **Total Revenue** qui additionne le chiffre d'affaires d'une table de faits Sales.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The measure stores a precomputed result in each row of the Sales table.
        fr: La mesure stocke un résultat précalculé dans chaque ligne de la table Sales.
    - id: s2
      text:
        en: The result of the measure changes when a user filters the report on one product category.
        fr: Le résultat de la mesure change quand un utilisateur filtre le rapport sur une catégorie de produit.
    - id: s3
      text:
        en: The same measure can be aggregated by product and by month in a single visual.
        fr: La même mesure peut être agrégée par produit et par mois dans un même visuel.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The values of a measure are not stored in the model: the DAX formula is evaluated at query time and returns one value for the context of each visual. The result therefore changes as users filter or interact with the report. A measure can be aggregated across one or more dimensions at once, for example total revenue by product per month."
    fr: "Les valeurs d'une mesure ne sont pas stockées dans le modèle : la formule DAX est évaluée au moment de la requête et renvoie une valeur pour le contexte de chaque visuel. Le résultat change donc quand les utilisateurs filtrent le rapport ou interagissent avec lui. Une mesure peut être agrégée selon une ou plusieurs dimensions à la fois, par exemple le chiffre d'affaires total par produit et par mois."
references:
  - title: Measures in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-measures
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
