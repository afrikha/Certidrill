id: dp900-4a-store-why-star
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Why is data from a transactional store usually reorganized into fact and dimension tables when it is loaded into a data warehouse?
  fr: |
    Pourquoi les données d'un magasin transactionnel sont-elles généralement réorganisées en tables de faits et de dimension lorsqu'elles sont chargées dans un entrepôt de données ?
body:
  options:
    - { id: a, text: { en: "To optimize the schema for analytical queries that aggregate values", fr: "Pour optimiser le schéma pour des requêtes analytiques qui agrègent des valeurs" } }
    - { id: b, text: { en: "To speed up the individual insert and update operations of the application", fr: "Pour accélérer les opérations individuelles d'insertion et de mise à jour de l'application" } }
    - { id: c, text: { en: "To store files of any format without defining a schema", fr: "Pour stocker des fichiers de tout format sans définir de schéma" } }
    - { id: d, text: { en: "To remove the need for SQL when the data is queried", fr: "Pour supprimer le besoin de SQL lors de l'interrogation des données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A data warehouse stores data in a schema that is optimized for analytics rather than for transactional workloads. Numeric values go to fact tables and are aggregated by the entities of the dimension tables, which makes queries such as total revenue by product and month easy to write.
    fr: |
      Un entrepôt de données stocke les données dans un schéma optimisé pour l'analytique plutôt que pour les charges de travail transactionnelles. Les valeurs numériques vont dans des tables de faits et sont agrégées selon les entités des tables de dimension, ce qui facilite des requêtes comme le chiffre d'affaires total par produit et par mois.
  options:
    b: { en: "Fast individual inserts and updates are the goal of the transactional schema, not of the warehouse schema.", fr: "Des insertions et des mises à jour individuelles rapides sont l'objectif du schéma transactionnel, pas du schéma de l'entrepôt." }
    c: { en: "Storing files of any format without a schema describes a data lake.", fr: "Stocker des fichiers de tout format sans schéma décrit un lac de données." }
    d: { en: "A data warehouse is relational, and SQL is the usual way to query it.", fr: "Un entrepôt de données est relationnel, et SQL est le moyen habituel de l'interroger." }
references:
  - title: Explore analytical data stores
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/4-analytical-data-stores
