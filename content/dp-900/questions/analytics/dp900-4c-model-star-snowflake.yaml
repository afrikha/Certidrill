id: dp900-4c-model-star-snowflake
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A fact table that is related to one or more dimension tables forms [[s1]]. When a dimension table is itself related to an additional table, such as Product to Category, the model becomes [[s2]].
    fr: |
      Une table de faits liée à une ou plusieurs tables de dimension forme [[s1]]. Quand une table de dimension est elle-même liée à une table supplémentaire, par exemple Product à Category, le modèle devient [[s2]].
  slots:
    - id: s1
      options:
        - { id: snow, text: { en: "a snowflake schema", fr: "un schéma en flocon de neige" } }
        - { id: star, text: { en: "a star schema", fr: "un schéma en étoile" } }
        - { id: hier, text: { en: "a hierarchy", fr: "une hiérarchie" } }
    - id: s2
      options:
        - { id: snow, text: { en: "a snowflake schema", fr: "un schéma en flocon de neige" } }
        - { id: star, text: { en: "a star schema", fr: "un schéma en étoile" } }
        - { id: hier, text: { en: "a hierarchy", fr: "une hiérarchie" } }
answer:
  values: { s1: star, s2: snow }
explanation:
  correct:
    en: "In a star schema, the fact table is at the center and each dimension table is related directly to it. When dimension tables are related to additional tables that hold more detail, such as a Category table for the Product table, the design is called a snowflake schema."
    fr: "Dans un schéma en étoile, la table de faits est au centre et chaque table de dimension lui est directement liée. Quand des tables de dimension sont liées à des tables supplémentaires qui apportent plus de détails, comme une table Category pour la table Product, on parle de schéma en flocon de neige."
  options:
    hier:
      en: "A hierarchy is a set of levels inside a dimension, such as year, month and day; it is not a layout of tables."
      fr: "Une hiérarchie est un ensemble de niveaux à l'intérieur d'une dimension, comme l'année, le mois et le jour ; ce n'est pas une disposition de tables."
references:
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
