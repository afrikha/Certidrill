id: dp900-4b-bs-batch-definition
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which type of data processing are records collected and stored, and then processed together in a single operation?
  fr: |
    Dans quel type de traitement de données les enregistrements sont-ils collectés et stockés, puis traités ensemble en une seule opération ?
body:
  options:
    - id: a
      text: { en: "Stream processing", fr: "Le traitement de flux" }
    - id: b
      text: { en: "Batch processing", fr: "Le traitement par lots" }
    - id: c
      text: { en: "Online transaction processing (OLTP)", fr: "Le traitement transactionnel en ligne (OLTP)" }
    - id: d
      text: { en: "Online analytical processing (OLAP)", fr: "Le traitement analytique en ligne (OLAP)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In batch processing, the data elements are first collected and stored, and the whole group is then processed in one operation. The batch can start on a schedule, when a certain amount of data has arrived, or on another event.
    fr: |
      Dans le traitement par lots, les données sont d'abord collectées et stockées, puis tout le groupe est traité en une seule opération. Le lot peut démarrer selon une planification, quand une certaine quantité de données est arrivée, ou sur un autre événement.
  options:
    a:
      en: Stream processing handles each new piece of data as it arrives, without waiting for a group to be complete.
      fr: Le traitement de flux traite chaque nouvelle donnée à son arrivée, sans attendre qu'un groupe soit complet.
    c:
      en: OLTP describes a transactional workload that records individual business operations, not the grouped processing of stored records.
      fr: OLTP désigne une charge de travail transactionnelle qui enregistre des opérations métier individuelles, pas le traitement groupé d'enregistrements stockés.
    d:
      en: OLAP describes analytical queries on aggregated data; it doesn't say when or how the records are processed.
      fr: OLAP désigne des requêtes analytiques sur des données agrégées ; le terme ne dit pas quand ni comment les enregistrements sont traités.
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
