id: dp900-4c-viz-treemap-hierarchy
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin sells 60 products that are grouped into 6 categories. A single visual must show the share of each category in the total revenue and, inside each category, the share of each product.

    Which visual should you use?
  fr: |
    Tailspin vend 60 produits regroupés en 6 catégories. Un seul visuel doit montrer la part de chaque catégorie dans le chiffre d'affaires total et, à l'intérieur de chaque catégorie, la part de chaque produit.

    Quel visuel devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Pie chart", fr: "Graphique en secteurs" } }
    - { id: b, text: { en: "Waterfall chart", fr: "Graphique en cascade" } }
    - { id: c, text: { en: "Treemap", fr: "Treemap" } }
    - { id: d, text: { en: "Scatter chart", fr: "Nuage de points" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A treemap displays hierarchical data as nested rectangles whose size represents the value: one rectangle per category, divided into one rectangle per product. It suits large amounts of hierarchical data when the proportions between each part and the whole matter."
    fr: "Un treemap affiche des données hiérarchiques sous forme de rectangles imbriqués dont la taille représente la valeur : un rectangle par catégorie, divisé en un rectangle par produit. Il convient à de grandes quantités de données hiérarchiques quand les proportions entre chaque partie et le tout comptent."
  options:
    a:
      en: "A pie chart shows the parts of a whole, but only for a small number of categories and on a single level: 60 slices would be unreadable."
      fr: "Un graphique en secteurs montre les parts d'un tout, mais seulement pour un petit nombre de catégories et sur un seul niveau : 60 secteurs seraient illisibles."
    b:
      en: "A waterfall chart shows how values added or subtracted change a running total; it does not show nested proportions."
      fr: "Un graphique en cascade montre comment des valeurs ajoutées ou soustraites font évoluer un total cumulé ; il ne montre pas de proportions imbriquées."
    d:
      en: "A scatter chart shows the relationship between two numeric measures, not the parts of a total."
      fr: "Un nuage de points montre la relation entre deux mesures numériques, pas les parts d'un total."
references:
  - title: Overview of visualizations in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
