id: dp900-4b-rt-dd-query-visualize
objective: "4.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You store streaming events in an eventhouse in Microsoft Fabric.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous stockez des événements de streaming dans un eventhouse de Microsoft Fabric.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To write and run queries on the data of the eventhouse, you use [[query]].

      To show the live data as a collection of visual tiles, you use [[visual]].
    fr: |
      Pour écrire et exécuter des requêtes sur les données de l'eventhouse, vous utilisez [[query]].

      Pour afficher les données en direct sous la forme d'un ensemble de vignettes visuelles, vous utilisez [[visual]].
  slots:
    - id: query
      options:
        - { id: es, text: { en: "an eventstream", fr: "un eventstream" } }
        - { id: qs, text: { en: "a KQL queryset", fr: "un KQL queryset" } }
        - { id: act, text: "Activator" }
    - id: visual
      options:
        - { id: hub, text: { en: "the Real-Time hub", fr: "le Real-Time hub" } }
        - { id: es, text: { en: "an eventstream", fr: "un eventstream" } }
        - { id: dash, text: { en: "a Real-Time Dashboard", fr: "un Real-Time Dashboard" } }
answer:
  values: { query: qs, visual: dash }
explanation:
  correct:
    en: |
      A KQL queryset is the item in which you write and run Kusto Query Language (KQL) queries on the data of an eventhouse. A Real-Time Dashboard is a collection of tiles, each built from a KQL query, that shows the streaming data as it changes. An eventstream ingests and routes events, Activator triggers actions on conditions, and the Real-Time hub is the catalog in which the data streams of the organization are discovered.
    fr: |
      Un KQL queryset est l'élément dans lequel vous écrivez et exécutez des requêtes Kusto Query Language (KQL) sur les données d'un eventhouse. Un Real-Time Dashboard est un ensemble de vignettes, chacune construite à partir d'une requête KQL, qui affiche les données de streaming à mesure qu'elles changent. Un eventstream ingère et route des événements, Activator déclenche des actions sur des conditions, et le Real-Time hub est le catalogue dans lequel on découvre les flux de données de l'organisation.
references:
  - title: What is Real-Time Intelligence?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
  - title: Create a Real-Time Dashboard
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/dashboard-real-time-create
