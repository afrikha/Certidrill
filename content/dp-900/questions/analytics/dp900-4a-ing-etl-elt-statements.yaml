id: dp900-4a-ing-etl-elt-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A data engineer compares the ETL and ELT processes for loading an analytical data store.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur de données compare les processus ETL et ELT pour charger un magasin de données analytique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An ETL process loads the source data into the analytical data store without modifying it.
        fr: Un processus ETL charge les données sources dans le magasin de données analytique sans les modifier.
    - id: s2
      text:
        en: In an ELT process, the data is copied to the analytical data store before it is transformed.
        fr: Dans un processus ELT, les données sont copiées dans le magasin de données analytique avant d'être transformées.
    - id: s3
      text:
        en: With both ETL and ELT, the resulting data structure is optimized for analytical queries.
        fr: Avec ETL comme avec ELT, la structure de données obtenue est optimisée pour les requêtes analytiques.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In an ETL process the data is cleaned, filtered and restructured before it is loaded, so the store never receives the unmodified source data. ELT does the opposite: it copies the data to the store and transforms it there. The two processes differ only in the order of the steps; in both cases the result is a structure designed for analytical queries.
    fr: |
      Dans un processus ETL, les données sont nettoyées, filtrées et restructurées avant d'être chargées, si bien que le magasin ne reçoit jamais les données sources non modifiées. ELT fait l'inverse : il copie les données dans le magasin et les y transforme. Les deux processus ne diffèrent que par l'ordre des étapes ; dans les deux cas, le résultat est une structure conçue pour les requêtes analytiques.
references:
  - title: Describe data warehousing architecture
    url: https://learn.microsoft.com/en-us/training/modules/examine-components-of-modern-data-warehouse/2-describe-warehousing
