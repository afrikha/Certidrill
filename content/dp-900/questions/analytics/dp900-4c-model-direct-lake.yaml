id: dp900-4c-model-direct-lake
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores several billion rows of sales data in Delta tables in a Microsoft Fabric lakehouse, in OneLake. You create a Power BI semantic model on these tables.

    Reports must get in-memory query performance, and the data must not be copied into the semantic model.

    Which storage mode should you use?
  fr: |
    Fabrikam stocke plusieurs milliards de lignes de ventes dans des tables Delta d'un lakehouse Microsoft Fabric, dans OneLake. Vous créez un modèle sémantique Power BI sur ces tables.

    Les rapports doivent bénéficier de performances de requête en mémoire, et les données ne doivent pas être copiées dans le modèle sémantique.

    Quel mode de stockage devez-vous utiliser ?
body:
  options:
    - { id: a, text: Import }
    - { id: b, text: Dual }
    - { id: c, text: DirectQuery }
    - { id: d, text: Direct Lake }
answer: { optionId: d }
explanation:
  correct:
    en: "Direct Lake loads the Delta tables of OneLake directly into the memory of the semantic model. It gives in-memory query performance, comparable to Import mode, without replicating the data into the model."
    fr: "Direct Lake charge les tables Delta de OneLake directement dans la mémoire du modèle sémantique. Il offre des performances de requête en mémoire, comparables à celles du mode Import, sans répliquer les données dans le modèle."
  options:
    a:
      en: "Import mode is fast, but it stores a copy of the data in the model, and that copy must be refreshed."
      fr: "Le mode Import est rapide, mais il stocke une copie des données dans le modèle, et cette copie doit être actualisée."
    b:
      en: "A Dual table keeps a cached copy of the data in the model and can also behave as a DirectQuery table."
      fr: "Une table en mode Dual conserve dans le modèle une copie en cache des données et peut aussi se comporter comme une table DirectQuery."
    c:
      en: "DirectQuery copies nothing, but it sends each query to the source, which is usually slower than an in-memory query."
      fr: "DirectQuery ne copie rien, mais il envoie chaque requête à la source, ce qui est en général plus lent qu'une requête en mémoire."
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: Describe core concepts of data modeling
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-data-visualization/3-data-modeling
