id: dp900-4b-bs-batch-benefits
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two statements describe advantages of batch processing?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent des avantages du traitement par lots ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Large volumes of data can be processed efficiently.
        fr: De gros volumes de données peuvent être traités efficacement.
    - id: b
      text:
        en: Each record is processed at the moment it arrives.
        fr: Chaque enregistrement est traité au moment où il arrive.
    - id: c
      text:
        en: A job can be scheduled for a time when resources are less busy, such as overnight.
        fr: Un travail peut être planifié à un moment où les ressources sont moins sollicitées, par exemple la nuit.
    - id: d
      text:
        en: The results are available within milliseconds of an event.
        fr: Les résultats sont disponibles quelques millisecondes après un événement.
    - id: e
      text:
        en: A job can start before all of its input data is ready.
        fr: Un travail peut démarrer avant que toutes ses données d'entrée soient prêtes.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Batch processing handles large volumes of data efficiently, and a batch can be scheduled to run when computers or systems would otherwise be idle, such as overnight or during off-peak hours.
    fr: |
      Le traitement par lots traite efficacement de gros volumes de données, et un lot peut être planifié pour s'exécuter quand les ordinateurs ou les systèmes seraient sinon inactifs, par exemple la nuit ou pendant les heures creuses.
  options:
    b:
      en: Processing each record on arrival is the definition of stream processing.
      fr: Traiter chaque enregistrement à son arrivée est la définition du traitement de flux.
    d:
      en: A latency of milliseconds belongs to stream processing; the latency of a batch is typically a few hours.
      fr: "Une latence de quelques millisecondes relève du traitement de flux ; la latence d'un lot est généralement de quelques heures."
    e:
      en: It is a disadvantage of batch processing that all the input data must be ready before the batch can be processed.
      fr: "C'est un inconvénient du traitement par lots : toutes les données d'entrée doivent être prêtes avant que le lot puisse être traité."
references:
  - title: Understand batch and stream processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-fundamentals-stream-processing/2-batch-stream
