id: dp900-1a-semi-sentence
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[type]] data has some structure, but allows for some variation between entity instances. One common format for this kind of data is [[fmt]].
    fr: |
      Les données [[type]] ont une certaine structure, mais autorisent des variations entre les instances d'une entité. Un format courant pour ce genre de données est [[fmt]].
  slots:
    - id: type
      options:
        - { id: st, text: { en: "Structured", fr: "structurées" } }
        - { id: semi, text: { en: "Semi-structured", fr: "semi-structurées" } }
        - { id: un, text: { en: "Unstructured", fr: "non structurées" } }
    - id: fmt
      options:
        - { id: blob, text: "BLOB" }
        - { id: tsv, text: "TSV" }
        - { id: json, text: "JSON" }
answer:
  values: { type: semi, fmt: json }
explanation:
  correct:
    en: "Semi-structured data has some structure, but the fields can vary between the instances of an entity. JavaScript Object Notation (JSON) is one common format for it, because each document carries its own fields."
    fr: "Les données semi-structurées ont une certaine structure, mais les champs peuvent varier entre les instances d'une entité. JavaScript Object Notation (JSON) est un format courant pour ces données, car chaque document porte ses propres champs."
  options:
    st:
      en: "Structured data adheres to a fixed schema, without variation between instances."
      fr: "Les données structurées respectent un schéma fixe, sans variation entre les instances."
    blob:
      en: "A BLOB is raw binary data, such as an image or a video, which is unstructured."
      fr: "Un BLOB est constitué de données binaires brutes, comme une image ou une vidéo, qui sont non structurées."
    tsv:
      en: "In a tab-separated file every line has the same fields, which suits structured data."
      fr: "Dans un fichier de valeurs séparées par des tabulations, toutes les lignes ont les mêmes champs, ce qui convient aux données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
