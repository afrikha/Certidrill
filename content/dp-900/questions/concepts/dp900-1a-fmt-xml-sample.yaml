id: dp900-1a-fmt-xml-sample
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data file contains the following text.

    ```text
    <Orders>
      <Order id="1001" customer="Ana Ruiz">
        <Item product="Helmet" quantity="2"/>
      </Order>
    </Orders>
    ```

    Which file format is used?
  fr: |
    Un fichier de données contient le texte suivant.

    ```text
    <Orders>
      <Order id="1001" customer="Ana Ruiz">
        <Item product="Helmet" quantity="2"/>
      </Order>
    </Orders>
    ```

    Quel format de fichier est utilisé ?
body:
  options:
    - { id: a, text: "JSON" }
    - { id: b, text: "Parquet" }
    - { id: c, text: { en: "Delimited text", fr: "Texte délimité" } }
    - { id: d, text: "XML" }
answer: { optionId: d }
explanation:
  correct:
    en: "Extensible Markup Language (XML) is a human-readable format that uses tags in angle brackets to define elements and attributes, as this file does. It was popular in the 1990s and 2000s and has largely been superseded by JSON, which is less verbose."
    fr: "XML (Extensible Markup Language) est un format lisible par l'homme qui utilise des balises entre chevrons pour définir des éléments et des attributs, comme dans ce fichier. Populaire dans les années 1990 et 2000, il a été largement remplacé par JSON, moins verbeux."
  options:
    a:
      en: "JSON uses braces, square brackets and name-value pairs, not tags."
      fr: "JSON utilise des accolades, des crochets et des paires nom-valeur, pas des balises."
    b:
      en: "Parquet is an optimized columnar format; it isn't readable text."
      fr: "Parquet est un format optimisé en colonnes ; ce n'est pas du texte lisible."
    c:
      en: "Delimited text puts one record on each line, with a delimiter such as a comma between the fields."
      fr: "Le texte délimité place un enregistrement par ligne, avec un délimiteur tel qu'une virgule entre les champs."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
