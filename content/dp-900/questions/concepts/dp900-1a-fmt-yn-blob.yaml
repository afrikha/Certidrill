id: dp900-1a-fmt-yn-blob
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "All files are ultimately stored as binary data."
        fr: "Tous les fichiers sont, en fin de compte, stockés sous forme de données binaires."
    - id: s2
      text:
        en: "A BLOB is a text file in which each line is one record."
        fr: "Un BLOB est un fichier texte dont chaque ligne est un enregistrement."
    - id: s3
      text:
        en: "Video files are usually stored as delimited text."
        fr: "Les fichiers vidéo sont généralement stockés sous forme de texte délimité."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Every file is ultimately binary (1s and 0s); in a text file, the bytes are mapped to printable characters through an encoding such as ASCII or Unicode. A BLOB (binary large object) is raw binary data that an application must interpret, and images, video and audio are commonly stored this way, not as delimited text."
    fr: "Tout fichier est en fin de compte binaire (des 1 et des 0) ; dans un fichier texte, les octets sont associés à des caractères imprimables au moyen d'un encodage tel qu'ASCII ou Unicode. Un BLOB (objet binaire de grande taille) est constitué de données binaires brutes qu'une application doit interpréter ; les images, la vidéo et l'audio sont couramment stockés ainsi, et non sous forme de texte délimité."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
