id: dp900-1b-tx-acid-transfer-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A bank transfers 40 from account A, which holds 100, to account B, which holds 50. The transfer runs as a single transaction in a database system that supports ACID semantics.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une banque vire 40 du compte A, qui contient 100, vers le compte B, qui contient 50. Le virement s'exécute comme une seule transaction dans un système de base de données qui prend en charge la sémantique ACID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the credit to account B fails, the debit from account A fails too.
        fr: Si le crédit du compte B échoue, le débit du compte A échoue aussi.
    - id: s2
      text:
        en: A transaction that reads both balances during the transfer can return 60 for account A and 50 for account B.
        fr: Une transaction qui lit les deux soldes pendant le virement peut renvoyer 60 pour le compte A et 50 pour le compte B.
    - id: s3
      text:
        en: After the transfer is committed, the balances return to 100 and 50 if the database system is switched off and on again.
        fr: Une fois le virement validé, les soldes reviennent à 100 et 50 si le système de base de données est arrêté puis redémarré.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Atomicity makes the transfer a single unit: if either the debit or the credit can't be completed, the other must fail. Isolation prevents a concurrent transaction from seeing one balance after the transfer (60) and the other before it (50); it sees 100 and 50, or 60 and 90. Durability means that once the transfer is committed, the balances of 60 and 90 are persisted and survive a restart of the database system."
    fr: "L'atomicité fait du virement une unité unique : si le débit ou le crédit ne peut pas aboutir, l'autre doit échouer. L'isolation empêche une transaction simultanée de voir un solde d'après le virement (60) et l'autre d'avant (50) ; elle voit 100 et 50, ou 60 et 90. La durabilité signifie qu'une fois le virement validé, les soldes de 60 et 90 sont conservés et survivent à un redémarrage du système de base de données."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
