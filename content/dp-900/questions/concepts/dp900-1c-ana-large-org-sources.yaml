id: dp900-1c-ana-large-org-sources
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso is a large organization. Its business applications store their data in Azure SQL Database, and other systems of the organization hold additional data that the reports must include.

    Which statement describes how the data analysts of Contoso typically obtain the data for their reports?
  fr: |
    Contoso est une grande organisation. Ses applications métier stockent leurs données dans Azure SQL Database, et d'autres systèmes de l'organisation détiennent des données supplémentaires que les rapports doivent inclure.

    Quelle affirmation décrit la façon dont les analystes de données de Contoso obtiennent généralement les données de leurs rapports ?
body:
  options:
    - id: a
      text: { en: "They query each Azure SQL database directly, which gives them the data of all the systems.", fr: "Ils interrogent directement chaque base de données Azure SQL, ce qui leur donne les données de tous les systèmes." }
    - id: b
      text: { en: "They provision a copy of each Azure SQL database and manage the backups of the copy.", fr: "Ils provisionnent une copie de chaque base de données Azure SQL et gèrent les sauvegardes de cette copie." }
    - id: c
      text: { en: "They query an analytical data store in which the Azure SQL data is combined with the other sources.", fr: "Ils interrogent un magasin de données analytique dans lequel les données Azure SQL sont combinées aux autres sources." }
    - id: d
      text: { en: "They build and monitor the pipelines that extract the data from each Azure SQL database.", fr: "Ils créent et surveillent les pipelines qui extraient les données de chaque base de données Azure SQL." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data analyst might query an Azure SQL database directly, but that only returns the data of that database. In large organizations, the data is generally combined with data from other sources in an analytical data store, which data engineers populate, and the analysts build their models and reports on that store.
    fr: |
      Un analyste de données peut interroger directement une base de données Azure SQL, mais il n'obtient ainsi que les données de cette base. Dans les grandes organisations, les données sont généralement combinées à celles d'autres sources dans un magasin de données analytique, qu'alimentent les ingénieurs de données, et les analystes créent leurs modèles et leurs rapports sur ce magasin.
  options:
    a: { en: "A direct query is possible, but an Azure SQL database only contains the data of its own applications, not the data held in the other systems.", fr: "Une requête directe est possible, mais une base de données Azure SQL ne contient que les données de ses propres applications, pas celles que détiennent les autres systèmes." }
    b: { en: "Provisioning databases and managing their backups is the work of a database administrator.", fr: "Le provisionnement des bases de données et la gestion de leurs sauvegardes sont le travail d'un administrateur de base de données." }
    d: { en: "Building and monitoring pipelines is the work of a data engineer; the analysts use the data that the pipelines deliver.", fr: "La création et la surveillance des pipelines sont le travail d'un ingénieur de données ; les analystes utilisent les données que livrent les pipelines." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
