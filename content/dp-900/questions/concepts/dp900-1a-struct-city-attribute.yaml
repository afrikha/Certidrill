id: dp900-1a-struct-city-attribute
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A table named **Customer** has the columns **CustomerID**, **Name** and **City**.

    What does the City column represent?
  fr: |
    Une table nommée **Customer** comporte les colonnes **CustomerID**, **Name** et **City**.

    Que représente la colonne City ?
body:
  options:
    - { id: a, text: { en: "The schema of the customer entity", fr: "Le schéma de l'entité client" } }
    - { id: b, text: { en: "An instance of the customer entity", fr: "Une instance de l'entité client" } }
    - { id: c, text: { en: "An attribute of the customer entity", fr: "Un attribut de l'entité client" } }
    - { id: d, text: { en: "The primary key of the customer entity", fr: "La clé primaire de l'entité client" } }
answer: { optionId: c }
explanation:
  correct:
    en: "In a tabular schema, the columns represent the attributes of the entity and the rows represent its instances. City is a characteristic of a customer, so it is an attribute."
    fr: "Dans un schéma tabulaire, les colonnes représentent les attributs de l'entité et les lignes représentent ses instances. City est une caractéristique d'un client : c'est donc un attribut."
  options:
    a:
      en: "The schema is the definition of all the fields of the table, not one of its columns."
      fr: "Le schéma est la définition de tous les champs de la table, pas l'une de ses colonnes."
    b:
      en: "An instance of the entity, that is, one customer, is represented by a row."
      fr: "Une instance de l'entité, c'est-à-dire un client, est représentée par une ligne."
    d:
      en: "A primary key identifies each customer uniquely; several customers can live in the same city, so City can't play that role."
      fr: "Une clé primaire identifie chaque client de façon unique ; plusieurs clients peuvent habiter la même ville : City ne peut donc pas jouer ce rôle."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
