id: dp900-1a-unstr-yn-marketing
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    The marketing department of Northwind Traders stores product photos, promotional videos and a price list. The price list is a table in which every product has the same columns.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service marketing de Northwind Traders stocke des photos de produits, des vidéos promotionnelles et une liste de prix. La liste de prix est une table dans laquelle tous les produits ont les mêmes colonnes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The promotional videos are unstructured data."
        fr: "Les vidéos promotionnelles sont des données non structurées."
    - id: s2
      text:
        en: "The price list is unstructured data."
        fr: "La liste de prix constitue des données non structurées."
    - id: s3
      text:
        en: "The product photos are semi-structured data, because all the photos have the same file format."
        fr: "Les photos de produits sont des données semi-structurées, car toutes les photos ont le même format de fichier."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Videos and images have no specific structure: they are unstructured data, whatever their file format. The price list has a fixed schema, with the same columns for every product, so it is structured data."
    fr: "Les vidéos et les images n'ont pas de structure spécifique : ce sont des données non structurées, quel que soit leur format de fichier. La liste de prix a un schéma fixe, avec les mêmes colonnes pour tous les produits : ce sont donc des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
