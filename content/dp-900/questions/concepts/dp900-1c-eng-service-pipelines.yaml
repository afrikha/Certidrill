id: dp900-1c-eng-service-pipelines
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer at Litware needs to define and schedule pipelines that transfer data from transactional systems and transform it for an analytical data store.

    Which service should the data engineer use?
  fr: |
    Un ingénieur de données de Litware doit définir et planifier des pipelines qui transfèrent les données de systèmes transactionnels et les transforment pour un magasin de données analytique.

    Quel service l'ingénieur de données doit-il utiliser ?
body:
  options:
    - id: a
      text: Microsoft Purview
    - id: b
      text: Azure Data Factory
    - id: c
      text: Azure Cosmos DB
    - id: d
      text: Azure SQL Database
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Data Factory lets you define and schedule data pipelines that transfer and transform data. Data engineers use it to build extract, transform, and load (ETL) solutions that populate analytical data stores with data from the transactional systems of the organization.
    fr: |
      Azure Data Factory permet de définir et de planifier des pipelines de données qui transfèrent et transforment les données. Les ingénieurs de données l'utilisent pour créer des solutions d'extraction, de transformation et de chargement (ETL) qui alimentent les magasins de données analytiques avec les données des systèmes transactionnels de l'organisation.
  options:
    a: { en: "Microsoft Purview is a data governance and discoverability solution; it does not run the pipelines that move data.", fr: "Microsoft Purview est une solution de gouvernance et de découverte des données ; il n'exécute pas les pipelines qui déplacent les données." }
    c: { en: "Azure Cosmos DB is a NoSQL database: it can be a source or a destination of a pipeline, not the tool that schedules it.", fr: "Azure Cosmos DB est une base de données NoSQL : elle peut être la source ou la destination d'un pipeline, pas l'outil qui le planifie." }
    d: { en: "Azure SQL Database is a relational database, typically a source of the pipelines rather than the service that defines them.", fr: "Azure SQL Database est une base de données relationnelle, le plus souvent une source des pipelines et non le service qui les définit." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
