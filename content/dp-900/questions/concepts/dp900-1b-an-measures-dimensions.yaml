id: dp900-1b-an-measures-dimensions
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Data in a data warehouse can be aggregated and loaded into an OLAP model, historically called a [[name]]. In this model, aggregated numeric values called [[num]] are calculated for intersections of [[by]]. For example, the sales revenue is totaled by date, customer and product.
    fr: |
      Les données d'un entrepôt de données peuvent être agrégées et chargées dans un modèle OLAP, historiquement appelé [[name]]. Dans ce modèle, des valeurs numériques agrégées appelées [[num]] sont calculées aux intersections de [[by]]. Par exemple, le chiffre d'affaires est totalisé par date, client et produit.
  slots:
    - id: name
      options:
        - { id: lake, text: { en: "lake", fr: "lac" } }
        - { id: cube, text: { en: "cube", fr: "cube" } }
        - { id: graph, text: { en: "graph", fr: "graphe" } }
    - id: num
      options:
        - { id: dimensions, text: { en: "dimensions", fr: "dimensions" } }
        - { id: keys, text: { en: "primary keys", fr: "clés primaires" } }
        - { id: measures, text: { en: "measures", fr: "mesures" } }
    - id: by
      options:
        - { id: dimensions, text: { en: "dimensions", fr: "dimensions" } }
        - { id: measures, text: { en: "measures", fr: "mesures" } }
        - { id: transactions, text: { en: "transactions", fr: "transactions" } }
answer:
  values: { name: cube, num: measures, by: dimensions }
explanation:
  correct:
    en: "An OLAP model, today more commonly called a semantic model, was historically called a cube. Its measures are the aggregated numeric values, such as the sales revenue; they are calculated for intersections of dimensions, such as date, customer and product."
    fr: "Un modèle OLAP, aujourd'hui plus souvent appelé modèle sémantique, était historiquement appelé cube. Ses mesures sont les valeurs numériques agrégées, comme le chiffre d'affaires ; elles sont calculées aux intersections de dimensions, comme la date, le client et le produit."
  options:
    lake:
      en: "A data lake is file-based storage in which data is collected before it is modeled."
      fr: "Un lac de données est un stockage à base de fichiers dans lequel les données sont collectées avant d'être modélisées."
    keys:
      en: "Primary keys identify the rows of relational tables; they aren't aggregated values."
      fr: "Les clés primaires identifient les lignes des tables relationnelles ; ce ne sont pas des valeurs agrégées."
    transactions:
      en: "Transactions are the events recorded by OLTP systems, not the axes along which values are aggregated."
      fr: "Les transactions sont les événements enregistrés par les systèmes OLTP, pas les axes selon lesquels les valeurs sont agrégées."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
