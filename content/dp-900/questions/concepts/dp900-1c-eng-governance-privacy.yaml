id: dp900-1c-eng-governance-privacy
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys copies customer data from on-premises systems to cloud data stores. The data governance rules that apply must be identified, and the privacy of the data must be maintained while it moves between the systems.

    Which role is responsible for this work?
  fr: |
    Tailspin Toys copie des données clients de systèmes locaux vers des magasins de données cloud. Les règles de gouvernance des données applicables doivent être identifiées, et la confidentialité des données doit être préservée pendant leur déplacement entre les systèmes.

    Quel rôle est responsable de ce travail ?
body:
  options:
    - id: a
      text: { en: "Data engineer", fr: "Ingénieur de données" }
    - id: b
      text: { en: "Database administrator", fr: "Administrateur de base de données" }
    - id: c
      text: { en: "Data analyst", fr: "Analyste de données" }
    - id: d
      text: { en: "AI engineer", fr: "Ingénieur IA" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Data engineers identify data governance rules as part of data integration. They are also responsible for ensuring that the privacy of data is maintained within the cloud and between on-premises and cloud data stores.
    fr: |
      Les ingénieurs de données identifient les règles de gouvernance des données dans le cadre de l'intégration des données. Ils veillent aussi à ce que la confidentialité des données soit préservée dans le cloud et entre les magasins de données locaux et cloud.
  options:
    b: { en: "A database administrator manages the security of the data inside a database (privileges, access), not the governance of data that moves between systems.", fr: "Un administrateur de base de données gère la sécurité des données à l'intérieur d'une base de données (privilèges, accès), pas la gouvernance des données qui circulent entre les systèmes." }
    c: { en: "A data analyst explores data and creates reports; the role does not move data between systems.", fr: "Un analyste de données explore les données et crée des rapports ; ce rôle ne déplace pas les données entre les systèmes." }
    d: { en: "An AI engineer builds AI-powered features on top of the data that data engineers prepare.", fr: "Un ingénieur IA crée des fonctionnalités d'IA à partir des données que préparent les ingénieurs de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
