id: dp900-1c-dba-permission-statements
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A database administrator at Northwind Traders manages the access of users to a table named **Product**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur de base de données de Northwind Traders gère l'accès des utilisateurs à une table nommée **Product**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To give a user permission to read the rows of the table, the administrator can use the GRANT statement.
        fr: Pour donner à un utilisateur l'autorisation de lire les lignes de la table, l'administrateur peut utiliser l'instruction GRANT.
    - id: s2
      text:
        en: To remove a permission that was granted earlier, the administrator can use the REVOKE statement.
        fr: Pour retirer une autorisation accordée précédemment, l'administrateur peut utiliser l'instruction REVOKE.
    - id: s3
      text:
        en: To block a user from reading the table, the administrator should use the DROP statement.
        fr: Pour empêcher un utilisateur de lire la table, l'administrateur doit utiliser l'instruction DROP.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Database administrators generally use the data control statements to manage access: `GRANT` gives a permission, `DENY` blocks a permission, and `REVOKE` removes a permission that was granted earlier. `DROP` is a data definition statement that removes the object itself, so it would delete the table for everyone.
    fr: |
      Les administrateurs de base de données utilisent généralement les instructions de contrôle des données pour gérer les accès : `GRANT` accorde une autorisation, `DENY` bloque une autorisation et `REVOKE` retire une autorisation accordée précédemment. `DROP` est une instruction de définition de données qui supprime l'objet lui-même : elle supprimerait donc la table pour tout le monde.
  options:
    s3: { en: "DROP removes the table; the statement that blocks a permission is DENY.", fr: "DROP supprime la table ; l'instruction qui bloque une autorisation est DENY." }
references:
  - title: Explore SQL
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
  - title: Explore job roles in the world of data
