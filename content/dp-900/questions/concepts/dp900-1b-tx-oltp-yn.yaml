id: dp900-1b-tx-oltp-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about transactional systems, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les systèmes transactionnels, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An OLTP system receives its data as periodic copies from an analytical data store.
        fr: Un système OLTP reçoit ses données sous forme de copies périodiques provenant d'un magasin de données analytique.
    - id: s2
      text:
        en: A transactional system can process millions of transactions in a single day.
        fr: Un système transactionnel peut traiter des millions de transactions en une seule journée.
    - id: s3
      text:
        en: A payment for goods and a transfer of money between two accounts are both examples of transactions.
        fr: Le paiement d'une marchandise et un virement entre deux comptes sont tous deux des exemples de transactions.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "An OLTP system records business events as they occur; the copies flow the other way, from transactional systems to analytical data stores. Transactional systems are often high-volume and sometimes handle many millions of transactions in a day. A transaction can be financial, such as moving money between accounts, or retail, such as a customer's payment for goods."
    fr: "Un système OLTP enregistre les événements métier au moment où ils se produisent ; les copies circulent dans l'autre sens, des systèmes transactionnels vers les magasins de données analytiques. Les systèmes transactionnels ont souvent un volume élevé et traitent parfois plusieurs millions de transactions par jour. Une transaction peut être financière, comme un mouvement d'argent entre des comptes, ou commerciale, comme le paiement d'une marchandise par un client."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
  - title: Online transaction processing (OLTP)
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-transaction-processing
