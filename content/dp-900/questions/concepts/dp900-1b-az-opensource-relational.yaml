id: dp900-1b-az-opensource-relational
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware needs a managed Azure service to host the relational database of an application. The database must run on an open-source database engine.

    Which service should Litware use?
  fr: |
    Litware a besoin d'un service Azure managé pour héberger la base de données relationnelle d'une application. La base de données doit s'exécuter sur un moteur de base de données open source.

    Quel service Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure SQL Managed Instance" }
    - { id: b, text: "Azure Cosmos DB" }
    - { id: c, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: d, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure provides managed services for popular open-source relational database systems, including Azure Database for MySQL and Azure Database for PostgreSQL. Azure Database for PostgreSQL is a fully managed service that runs the community version of PostgreSQL and stores data in relational tables."
    fr: "Azure fournit des services managés pour des systèmes de base de données relationnelle open source répandus, notamment Azure Database pour MySQL et Azure Database pour PostgreSQL. Azure Database pour PostgreSQL est un service entièrement managé qui exécute la version communautaire de PostgreSQL et stocke les données dans des tables relationnelles."
  options:
    a:
      en: "Azure SQL Managed Instance is a managed relational service, but it is based on the Microsoft SQL Server engine, which isn't open source."
      fr: "Azure SQL Managed Instance est un service relationnel managé, mais il repose sur le moteur Microsoft SQL Server, qui n'est pas open source."
    b:
      en: "Azure Cosmos DB is a non-relational (NoSQL) database."
      fr: "Azure Cosmos DB est une base de données non relationnelle (NoSQL)."
    c:
      en: "Azure Table storage is a non-relational key-value store."
      fr: "Le Stockage Table Azure est un magasin clé-valeur non relationnel."
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
  - title: What is Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/overview
