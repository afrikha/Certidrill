id: dp900-1b-an-olap-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about analytical processing, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le traitement analytique, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An OLAP model is optimized for creating, updating and deleting individual records at high volume.
        fr: Un modèle OLAP est optimisé pour créer, mettre à jour et supprimer des enregistrements individuels à grand volume.
    - id: s2
      text:
        en: The data in an analytical data store is typically copied from the systems that record the transactions.
        fr: Les données d'un magasin de données analytique sont généralement copiées à partir des systèmes qui enregistrent les transactions.
    - id: s3
      text:
        en: An OLAP cube stores the data without aggregation, as one record for each transaction.
        fr: Un cube OLAP stocke les données sans agrégation, sous forme d'un enregistrement par transaction.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Creating, updating and deleting individual records at high volume is what an OLTP database is optimized for; an OLAP model is optimized for analytical, read-heavy workloads. Analytical stores are fed with operational data that is extracted from the transactional systems and loaded by ETL or ELT processes. An OLAP model, historically called a cube, is an aggregated type of data storage: because the data is pre-aggregated, queries that return summaries run quickly."
    fr: "Créer, mettre à jour et supprimer des enregistrements individuels à grand volume, c'est ce pour quoi une base de données OLTP est optimisée ; un modèle OLAP est optimisé pour des charges de travail analytiques, dominées par les lectures. Les magasins analytiques sont alimentés par des données opérationnelles extraites des systèmes transactionnels et chargées par des processus ETL ou ELT. Un modèle OLAP, historiquement appelé cube, est un type de stockage de données agrégé : comme les données sont préagrégées, les requêtes qui renvoient des synthèses s'exécutent rapidement."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
  - title: Online analytical processing
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-analytical-processing
