id: dp900-1c-eng-task-pipeline
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is the responsibility of a data engineer?
  fr: |
    Quelle tâche relève de la responsabilité d'un ingénieur de données ?
body:
  options:
    - id: a
      text: { en: "Storing backup copies of a database and restoring them after a failure", fr: "Stocker des copies de sauvegarde d'une base de données et les restaurer après une défaillance" }
    - id: b
      text: { en: "Creating charts that help managers make informed decisions", fr: "Créer des graphiques qui aident les responsables à prendre des décisions éclairées" }
    - id: c
      text: { en: "Implementing pipelines that transfer and transform data between systems", fr: "Implémenter des pipelines qui transfèrent et transforment les données entre les systèmes" }
    - id: d
      text: { en: "Granting users privileges over the data that a database contains", fr: "Accorder aux utilisateurs des privilèges sur les données que contient une base de données" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data engineer manages the infrastructure and the processes for data integration across the organization. Implementing pipelines that transfer and transform data between systems is the core of that work.
    fr: |
      Un ingénieur de données gère l'infrastructure et les processus d'intégration des données dans toute l'organisation. L'implémentation de pipelines qui transfèrent et transforment les données entre les systèmes est le cœur de ce travail.
  options:
    a: { en: "Backing up and restoring databases is the work of a database administrator.", fr: "La sauvegarde et la restauration des bases de données sont le travail d'un administrateur de base de données." }
    b: { en: "Creating charts and visualizations for decision-making is the work of a data analyst.", fr: "La création de graphiques et de visualisations pour la prise de décision est le travail d'un analyste de données." }
    d: { en: "Granting privileges over the data is part of the security work of a database administrator.", fr: "L'octroi de privilèges sur les données fait partie du travail de sécurité d'un administrateur de base de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
