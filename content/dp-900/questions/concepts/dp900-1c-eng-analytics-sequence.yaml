id: dp900-1c-eng-analytics-sequence
objective: "1.4.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is building its first analytics solution for a new sales application. The database administrator, the data engineer and the data analyst each contribute.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys crée sa première solution analytique pour une nouvelle application de vente. L'administrateur de base de données, l'ingénieur de données et l'analyste de données y contribuent chacun.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: model, text: { en: "Build an analytical model on the tables of the data warehouse.", fr: "Créer un modèle analytique sur les tables de l'entrepôt de données." } }
    - { id: restore, text: { en: "Restore the transactional database from its most recent backup.", fr: "Restaurer la base de données transactionnelle à partir de sa sauvegarde la plus récente." } }
    - { id: pipe, text: { en: "Implement a pipeline that ingests the sales data into a data warehouse.", fr: "Implémenter un pipeline qui ingère les données de ventes dans un entrepôt de données." } }
    - { id: report, text: { en: "Create reports and visualizations based on the analytical model.", fr: "Créer des rapports et des visualisations basés sur le modèle analytique." } }
    - { id: db, text: { en: "Provision the transactional database in which the sales application stores its data.", fr: "Provisionner la base de données transactionnelle dans laquelle l'application de vente stocke ses données." } }
    - { id: revoke, text: { en: "Revoke the permissions of the sales team on the transactional database.", fr: "Révoquer les autorisations de l'équipe commerciale sur la base de données transactionnelle." } }
answer:
  sequence: [ db, pipe, model, report ]
explanation:
  correct:
    en: |
      The database administrator first provisions the transactional database that the application writes to. The data engineer then implements the pipeline that ingests this data into the data warehouse. The data analyst comes last: an analytical model is built on the warehouse tables, and the reports and visualizations are created from that model.
    fr: |
      L'administrateur de base de données provisionne d'abord la base de données transactionnelle dans laquelle l'application écrit. L'ingénieur de données implémente ensuite le pipeline qui ingère ces données dans l'entrepôt de données. L'analyste de données intervient en dernier : un modèle analytique est créé sur les tables de l'entrepôt, puis les rapports et les visualisations sont créés à partir de ce modèle.
  options:
    restore: { en: "Nothing failed: a restore is a recovery operation, not a step of building the solution.", fr: "Rien n'a échoué : une restauration est une opération de récupération, pas une étape de la création de la solution." }
    revoke: { en: "Removing permissions from the sales team is not needed to build the solution and would stop the team from using its application data.", fr: "Retirer des autorisations à l'équipe commerciale n'est pas nécessaire pour créer la solution et empêcherait l'équipe d'utiliser les données de son application." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
