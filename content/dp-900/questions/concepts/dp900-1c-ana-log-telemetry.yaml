id: dp900-1c-ana-log-telemetry
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data analyst at Proseware needs to query and analyze large volumes of time-stamped data from log files and Internet of Things (IoT) telemetry.

    Which Azure service is designed for this type of analysis?
  fr: |
    Un analyste de données de Proseware doit interroger et analyser de grands volumes de données horodatées issues de fichiers journaux et de la télémétrie de l'Internet des objets (IoT).

    Quel service Azure est conçu pour ce type d'analyse ?
body:
  options:
    - id: a
      text: Azure Data Factory
    - id: b
      text: Microsoft Purview
    - id: c
      text: Azure Data Explorer
    - id: d
      text: { en: "Azure Database for MySQL", fr: "Azure Database pour MySQL" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Data Explorer is a managed big data analytics platform for high-performance querying of log and telemetry data. Data analysts use it to query and analyze data that includes a timestamp, such as log files and IoT telemetry.
    fr: |
      Azure Data Explorer est une plateforme managée d'analytique du Big Data, conçue pour interroger avec de hautes performances des données de journaux et de télémétrie. Les analystes de données l'utilisent pour interroger et analyser des données horodatées, comme des fichiers journaux et de la télémétrie IoT.
  options:
    a: { en: "Azure Data Factory defines and schedules pipelines that transfer and transform data; it is not a query and analysis platform.", fr: "Azure Data Factory définit et planifie des pipelines qui transfèrent et transforment les données ; ce n'est pas une plateforme d'interrogation et d'analyse." }
    b: { en: "Microsoft Purview is a data governance solution that tracks data lineage; it does not analyze logs or telemetry.", fr: "Microsoft Purview est une solution de gouvernance des données qui suit leur traçabilité ; il n'analyse ni journaux ni télémétrie." }
    d: { en: "Azure Database for MySQL is a managed relational database for transactional applications, not a platform for large volumes of log and telemetry data.", fr: "Azure Database pour MySQL est une base de données relationnelle managée pour des applications transactionnelles, pas une plateforme pour de grands volumes de données de journaux et de télémétrie." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
