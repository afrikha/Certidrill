id: dp900-1c-eng-databricks-roles
objective: "1.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Azure Databricks. Data engineers and data analysts work in the same workspace.

    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Azure Databricks. Des ingénieurs de données et des analystes de données travaillent dans le même espace de travail.

    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Databricks, a data engineer typically [[e]], and a data analyst typically [[a]].
    fr: |
      Dans Azure Databricks, le plus souvent, un ingénieur de données [[e]], tandis qu'un analyste de données [[a]].
  slots:
    - id: e
      options:
        - { id: notebook, text: { en: "uses notebooks to query and visualize data", fr: "utilise des notebooks pour interroger et visualiser les données" } }
        - { id: backup, text: { en: "stores backup copies of transactional databases", fr: "stocke des copies de sauvegarde de bases de données transactionnelles" } }
        - { id: spark, text: { en: "uses Spark skills to create analytical data stores", fr: "utilise ses compétences Spark pour créer des magasins de données analytiques" } }
        - { id: provision, text: { en: "provisions transactional databases for business applications", fr: "provisionne des bases de données transactionnelles pour des applications métier" } }
    - id: a
      options:
        - { id: notebook, text: { en: "uses notebooks to query and visualize data", fr: "utilise des notebooks pour interroger et visualiser les données" } }
        - { id: backup, text: { en: "stores backup copies of transactional databases", fr: "stocke des copies de sauvegarde de bases de données transactionnelles" } }
        - { id: spark, text: { en: "uses Spark skills to create analytical data stores", fr: "utilise ses compétences Spark pour créer des magasins de données analytiques" } }
        - { id: provision, text: { en: "provisions transactional databases for business applications", fr: "provisionne des bases de données transactionnelles pour des applications métier" } }
answer:
  values: { e: spark, a: notebook }
explanation:
  correct:
    en: |
      Azure Databricks is an analytics platform based on Apache Spark. Data engineers use their Databricks and Spark skills to create analytical data stores, while data analysts use the notebook support of the platform to query and visualize data in a web-based interface.
    fr: |
      Azure Databricks est une plateforme analytique basée sur Apache Spark. Les ingénieurs de données utilisent leurs compétences Databricks et Spark pour créer des magasins de données analytiques, tandis que les analystes de données utilisent les notebooks de la plateforme pour interroger et visualiser les données dans une interface web.
  options:
    backup: { en: "Storing backup copies of databases is a database administrator task, and Azure Databricks is not a backup service.", fr: "Le stockage de copies de sauvegarde des bases de données est une tâche d'administrateur de base de données, et Azure Databricks n'est pas un service de sauvegarde." }
    provision: { en: "Provisioning transactional databases is a database administrator task; Azure Databricks is an analytics platform, not a transactional database service.", fr: "Le provisionnement de bases de données transactionnelles est une tâche d'administrateur de base de données ; Azure Databricks est une plateforme analytique, pas un service de base de données transactionnelle." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
