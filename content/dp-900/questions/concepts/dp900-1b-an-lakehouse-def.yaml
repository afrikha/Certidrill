id: dp900-1b-an-lakehouse-def
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which type of analytical data store combines the flexible, scalable storage of a data lake with the relational querying semantics of a data warehouse?
  fr: |
    Quel type de magasin de données analytique combine le stockage souple et scalable d'un lac de données avec la sémantique de requête relationnelle d'un entrepôt de données ?
body:
  options:
    - { id: a, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
    - { id: b, text: { en: "A data lakehouse", fr: "Un data lakehouse" } }
    - { id: c, text: { en: "An OLTP database", fr: "Une base de données OLTP" } }
    - { id: d, text: { en: "A key-value database", fr: "Une base de données clé-valeur" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A data lakehouse is a more recent kind of analytical store that keeps the data as files in a data lake and adds tabular abstractions over those files. It therefore offers the flexible, scalable storage of a lake and the relational querying of a warehouse."
    fr: "Un data lakehouse est un type de magasin analytique plus récent qui conserve les données sous forme de fichiers dans un lac de données et ajoute des abstractions tabulaires sur ces fichiers. Il offre donc le stockage souple et scalable d'un lac et l'interrogation relationnelle d'un entrepôt."
  options:
    a:
      en: "A semantic model holds data that is aggregated in advance across dimensions; it isn't a combination of a lake and a warehouse."
      fr: "Un modèle sémantique contient des données agrégées à l'avance selon des dimensions ; ce n'est pas la combinaison d'un lac et d'un entrepôt."
    c:
      en: "An OLTP database records transactions; it is a transactional store, not an analytical one."
      fr: "Une base de données OLTP enregistre des transactions ; c'est un magasin transactionnel, pas analytique."
    d:
      en: "A key-value database is a non-relational store used by applications; it offers no relational querying."
      fr: "Une base de données clé-valeur est un magasin non relationnel utilisé par des applications ; elle n'offre pas d'interrogation relationnelle."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
