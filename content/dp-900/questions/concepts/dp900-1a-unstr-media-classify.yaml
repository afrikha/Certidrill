id: dp900-1a-unstr-media-classify
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys keeps recordings of the calls to its support center and photos of damaged parcels.

    Which type of data is this?
  fr: |
    Tailspin Toys conserve les enregistrements des appels à son centre de support et des photos de colis endommagés.

    De quel type de données s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Unstructured data", fr: "Des données non structurées" } }
    - { id: b, text: { en: "Structured data", fr: "Des données structurées" } }
    - { id: c, text: { en: "Semi-structured data", fr: "Des données semi-structurées" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Audio recordings and images don't have a specific structure: there are no fields that are the same for every item. This kind of data is unstructured data."
    fr: "Les enregistrements audio et les images n'ont pas de structure spécifique : il n'y a pas de champs identiques pour tous les éléments. Ce genre de données correspond aux données non structurées."
  options:
    b:
      en: "Structured data adheres to a fixed schema, typically rows and columns, which recordings and photos don't have."
      fr: "Les données structurées respectent un schéma fixe, en général des lignes et des colonnes, que les enregistrements et les photos n'ont pas."
    c:
      en: "Semi-structured data has named fields that vary between items, as in JSON documents; recordings and photos have no fields."
      fr: "Les données semi-structurées ont des champs nommés qui varient d'un élément à l'autre, comme dans des documents JSON ; les enregistrements et les photos n'ont pas de champs."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
