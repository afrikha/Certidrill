id: dp900-1b-ds-stores-yn
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about data stores, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les magasins de données, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In a key-value database, every value must be a JSON document.
        fr: Dans une base de données clé-valeur, chaque valeur doit être un document JSON.
    - id: s2
      text:
        en: A document database is a form of key-value database that can parse and query the values that it stores.
        fr: Une base de données de documents est une forme de base de données clé-valeur capable d'analyser et d'interroger les valeurs qu'elle stocke.
    - id: s3
      text:
        en: A shared file store can hold both delimited text files and binary files such as images.
        fr: Un magasin de fichiers partagé peut contenir à la fois des fichiers texte délimités et des fichiers binaires comme des images.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "In a key-value database, the value associated with a key can be in any format. A document database is the specific form of key-value database in which the value is a JSON document that the system is optimized to parse and query. A file store keeps files of any format, from human-readable delimited text to binary large objects (BLOBs) such as images, video and audio."
    fr: "Dans une base de données clé-valeur, la valeur associée à une clé peut avoir n'importe quel format. Une base de données de documents est la forme particulière de base de données clé-valeur dans laquelle la valeur est un document JSON que le système est optimisé pour analyser et interroger. Un magasin de fichiers conserve des fichiers de tout format, du texte délimité lisible par des personnes aux objets binaires de grande taille (BLOB) comme les images, la vidéo et l'audio."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
  - title: Explore file storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
