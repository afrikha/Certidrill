id: dp900-1b-az-datalake-files
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The data engineers of Adatum must store very large volumes of raw data files for big data analytics. The files must be organized in a hierarchy of directories, and Apache Spark must read them through a Hadoop-compatible file system.

    Which Azure data store should Adatum use?
  fr: |
    Les ingénieurs de données d'Adatum doivent stocker de très grands volumes de fichiers de données brutes pour l'analytique du Big Data. Les fichiers doivent être organisés dans une hiérarchie de répertoires, et Apache Spark doit les lire à travers un système de fichiers compatible avec Hadoop.

    Quel magasin de données Azure Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Data Lake Storage" }
    - { id: b, text: "Azure Files" }
    - { id: c, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: d, text: "Azure SQL Managed Instance" }
answer: { optionId: a }
explanation:
  correct:
    en: "Data engineers host data lakes in Azure Storage: Azure Data Lake Storage is Blob Storage with a hierarchical namespace, which organizes the files in directories and subdirectories. It is built for big data analytics and works with Hadoop and the frameworks that use it, such as Apache Spark."
    fr: "Les ingénieurs de données hébergent les lacs de données dans Stockage Azure : Azure Data Lake Storage est le Stockage Blob doté d'un espace de noms hiérarchique, qui organise les fichiers en répertoires et sous-répertoires. Il est conçu pour l'analytique du Big Data et fonctionne avec Hadoop et les frameworks qui l'utilisent, comme Apache Spark."
  options:
    b:
      en: "Azure Files provides SMB and NFS file shares for users and applications; it isn't the store built for big data analytics frameworks."
      fr: "Azure Files fournit des partages de fichiers SMB et NFS pour des utilisateurs et des applications ; ce n'est pas le magasin conçu pour les frameworks d'analytique du Big Data."
    c:
      en: "Azure Table storage holds key-value entities, not data files."
      fr: "Le Stockage Table Azure contient des entités clé-valeur, pas des fichiers de données."
    d:
      en: "Azure SQL Managed Instance is a relational database for structured data, not a store of raw files."
      fr: "Azure SQL Managed Instance est une base de données relationnelle pour des données structurées, pas un magasin de fichiers bruts."
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
