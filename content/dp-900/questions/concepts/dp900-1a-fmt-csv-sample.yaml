id: dp900-1a-fmt-csv-sample
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data file contains the following text.

    ```text
    ProductID,Name,Price
    1,Mountain bike,899.00
    2,Helmet,39.50
    ```

    Which file format is used?
  fr: |
    Un fichier de données contient le texte suivant.

    ```text
    ProductID,Name,Price
    1,Mountain bike,899.00
    2,Helmet,39.50
    ```

    Quel format de fichier est utilisé ?
body:
  options:
    - { id: a, text: "XML" }
    - { id: b, text: "JSON" }
    - { id: c, text: { en: "Delimited text", fr: "Texte délimité" } }
    - { id: d, text: "Avro" }
answer: { optionId: c }
explanation:
  correct:
    en: "The file is plain text in which a delimiter, here a comma, separates the fields and each row ends with a new line; the first line holds the field names. This is delimited text, in its most common form: comma-separated values (CSV)."
    fr: "Le fichier est du texte brut dans lequel un délimiteur, ici une virgule, sépare les champs et où chaque ligne se termine par un saut de ligne ; la première ligne contient les noms des champs. Il s'agit de texte délimité, sous sa forme la plus courante : les valeurs séparées par des virgules (CSV)."
  options:
    a:
      en: "XML defines elements and attributes with tags in angle brackets; the file has none."
      fr: "XML définit des éléments et des attributs au moyen de balises entre chevrons ; le fichier n'en contient pas."
    b:
      en: "JSON encloses objects in braces and writes attributes as name-value pairs; here the names appear once, on the first line."
      fr: "JSON place les objets entre accolades et écrit les attributs en paires nom-valeur ; ici, les noms n'apparaissent qu'une fois, sur la première ligne."
    d:
      en: "Avro stores the records as binary data after a header; the file couldn't be read as lines of text."
      fr: "Avro stocke les enregistrements sous forme binaire après un en-tête ; le fichier ne pourrait pas se lire comme des lignes de texte."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
