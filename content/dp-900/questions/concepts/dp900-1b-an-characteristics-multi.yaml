id: dp900-1b-an-characteristics-multi
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two characteristics describe an analytical workload?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux caractéristiques qui décrivent une charge de travail analytique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The system is read-only or read-mostly.", fr: "Le système est en lecture seule ou principalement en lecture." } }
    - { id: b, text: { en: "Each operation records one business event as it happens.", fr: "Chaque opération enregistre un événement métier au moment où il se produit." } }
    - { id: c, text: { en: "The system holds large volumes of historical data.", fr: "Le système contient de grands volumes de données historiques." } }
    - { id: d, text: { en: "The storage is optimized equally for reads and for writes.", fr: "Le stockage est optimisé autant pour les lectures que pour les écritures." } }
    - { id: e, text: { en: "A line-of-business application updates and deletes the records.", fr: "Une application métier met à jour et supprime les enregistrements." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Analytical data processing typically uses read-only (or read-mostly) systems that store vast volumes of historical data or business metrics. The analysis is based on a snapshot of the data at a point in time, or on a series of snapshots."
    fr: "Le traitement analytique des données utilise généralement des systèmes en lecture seule (ou principalement en lecture) qui stockent de vastes volumes de données historiques ou de métriques métier. L'analyse s'appuie sur un instantané des données à un moment donné, ou sur une série d'instantanés."
  options:
    b:
      en: "Recording business events as they happen is the role of a transactional system."
      fr: "Enregistrer les événements métier au moment où ils se produisent est le rôle d'un système transactionnel."
    d:
      en: "Storage optimized for both read and write operations describes the database of an OLTP system."
      fr: "Un stockage optimisé à la fois pour les lectures et pour les écritures décrit la base de données d'un système OLTP."
    e:
      en: "Line-of-business applications that update and delete records are supported by OLTP systems."
      fr: "Les applications métier qui mettent à jour et suppriment des enregistrements sont prises en charge par les systèmes OLTP."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
