id: dp900-1a-struct-entities
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso keeps data about its customers, its products and its sales orders.

    In data terminology, what are customers, products and sales orders?
  fr: |
    Contoso conserve des données sur ses clients, ses produits et ses commandes.

    Dans la terminologie des données, que sont les clients, les produits et les commandes ?
body:
  options:
    - { id: a, text: { en: "Attributes", fr: "Des attributs" } }
    - { id: b, text: { en: "Schemas", fr: "Des schémas" } }
    - { id: c, text: { en: "Entities", fr: "Des entités" } }
    - { id: d, text: { en: "Keys", fr: "Des clés" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Entities are the things that are important to an organization and that its data structures represent, such as customers, products and sales orders. Each entity has one or more attributes, for example the name and the address of a customer."
    fr: "Les entités sont ce qui est important pour une organisation et que ses structures de données représentent, par exemple les clients, les produits et les commandes. Chaque entité a un ou plusieurs attributs, par exemple le nom et l'adresse d'un client."
  options:
    a:
      en: "An attribute is a characteristic of an entity, such as the name of a customer, not the customer itself."
      fr: "Un attribut est une caractéristique d'une entité, comme le nom d'un client, et non le client lui-même."
    b:
      en: "A schema defines the fields of the data; it is not the thing that the data describes."
      fr: "Un schéma définit les champs des données ; ce n'est pas ce que les données décrivent."
    d:
      en: "A key is a value that identifies one instance of an entity so that other tables can reference it."
      fr: "Une clé est une valeur qui identifie une instance d'une entité afin que d'autres tables puissent la référencer."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
