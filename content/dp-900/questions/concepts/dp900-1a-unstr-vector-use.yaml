id: dp900-1a-unstr-vector-use
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An organization generates vector data, also called embeddings, from its documents and images.

    What do AI applications use the vector data for?
  fr: |
    Une organisation génère des données vectorielles, aussi appelées incorporations (embeddings), à partir de ses documents et de ses images.

    À quoi les applications d'IA utilisent-elles les données vectorielles ?
body:
  options:
    - { id: a, text: { en: "To enforce a fixed schema on the documents", fr: "À imposer un schéma fixe aux documents" } }
    - { id: b, text: { en: "To find content that is semantically similar", fr: "À trouver du contenu sémantiquement similaire" } }
    - { id: c, text: { en: "To reference rows in other tables by key", fr: "À référencer par clé des lignes d'autres tables" } }
    - { id: d, text: { en: "To store the images as delimited text", fr: "À stocker les images sous forme de texte délimité" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Vector data is a numerical representation of content such as text or images. AI applications compare these representations to find content whose meaning is close, that is, semantically similar content."
    fr: "Les données vectorielles sont une représentation numérique d'un contenu tel qu'un texte ou une image. Les applications d'IA comparent ces représentations pour trouver du contenu de sens proche, c'est-à-dire sémantiquement similaire."
  options:
    a:
      en: "A fixed schema is the property of structured data; embeddings don't give documents fields."
      fr: "Un schéma fixe est la propriété des données structurées ; les incorporations ne donnent pas de champs aux documents."
    c:
      en: "Referencing rows by key values is how the tables of a relational database relate to one another."
      fr: "Référencer des lignes par des valeurs de clé est la façon dont les tables d'une base de données relationnelle sont reliées."
    d:
      en: "Delimited text is a file format for structured records; it has nothing to do with embeddings."
      fr: "Le texte délimité est un format de fichier pour des enregistrements structurés ; il n'a rien à voir avec les incorporations."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
