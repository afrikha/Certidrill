id: dp900-1b-az-sql-lob-paas
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is developing a new line-of-business application that stores transactional data in relational tables. The database must use the Microsoft SQL Server database engine and must be a fully managed platform as a service (PaaS) offering.

    Which Azure data store should Contoso use?
  fr: |
    Contoso développe une nouvelle application métier qui stocke des données transactionnelles dans des tables relationnelles. La base de données doit utiliser le moteur de base de données Microsoft SQL Server et doit être une offre PaaS (platform as a service) entièrement managée.

    Quel magasin de données Azure Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
    - { id: b, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines Virtuelles Azure" } }
    - { id: c, text: "Azure SQL Database" }
    - { id: d, text: "Azure Cosmos DB" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure SQL is the family of relational database services based on the SQL Server database engine, used for the transactional data of line-of-business applications. Azure SQL Database is its fully managed PaaS database, designed for new cloud applications."
    fr: "Azure SQL est la famille de services de base de données relationnelle fondés sur le moteur de base de données SQL Server, utilisée pour les données transactionnelles des applications métier. Azure SQL Database en est la base de données PaaS entièrement managée, conçue pour les nouvelles applications cloud."
  options:
    a:
      en: "Azure Database for PostgreSQL is a managed relational service, but it runs the open-source PostgreSQL engine, not SQL Server."
      fr: "Azure Database pour PostgreSQL est un service relationnel managé, mais il exécute le moteur open source PostgreSQL, pas SQL Server."
    b:
      en: "SQL Server on Azure Virtual Machines uses the SQL Server engine, but it is infrastructure as a service (IaaS): you keep the responsibility of managing the server."
      fr: "SQL Server sur Machines Virtuelles Azure utilise le moteur SQL Server, mais c'est une offre IaaS (infrastructure as a service) : vous gardez la responsabilité de gérer le serveur."
    d:
      en: "Azure Cosmos DB is a non-relational database; it doesn't run the SQL Server database engine."
      fr: "Azure Cosmos DB est une base de données non relationnelle ; elle n'exécute pas le moteur de base de données SQL Server."
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
