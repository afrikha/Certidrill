id: dp900-1b-tx-crud-acid-terms
objective: "1.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Transactional workloads create, retrieve, update and delete data records. These operations are often called [[ops]] operations. To protect the integrity of the data, OLTP systems enforce transactions that support [[sem]] semantics.
    fr: |
      Les charges de travail transactionnelles créent, récupèrent, mettent à jour et suppriment des enregistrements de données. Ces opérations sont souvent appelées opérations [[ops]]. Pour protéger l'intégrité des données, les systèmes OLTP imposent des transactions qui prennent en charge la sémantique [[sem]].
  slots:
    - id: ops
      options:
        - { id: acid, text: "ACID" }
        - { id: olap, text: "OLAP" }
        - { id: crud, text: "CRUD" }
        - { id: etl, text: "ETL" }
    - id: sem
      options:
        - { id: ansi, text: "ANSI" }
        - { id: acid, text: "ACID" }
        - { id: crud, text: "CRUD" }
        - { id: elt, text: "ELT" }
answer:
  values: { ops: crud, sem: acid }
explanation:
  correct:
    en: "CRUD stands for create, retrieve, update and delete, the four operations that transactional workloads apply to data records. ACID stands for atomicity, consistency, isolation and durability, the four properties of the transactions that OLTP systems enforce to ensure the integrity of the data."
    fr: "CRUD désigne la création, la récupération, la mise à jour et la suppression (create, retrieve, update, delete), les quatre opérations que les charges de travail transactionnelles appliquent aux enregistrements de données. ACID désigne l'atomicité, la cohérence, l'isolation et la durabilité, les quatre propriétés des transactions que les systèmes OLTP imposent pour garantir l'intégrité des données."
  options:
    olap:
      en: "OLAP is online analytical processing, which aggregates data for analysis."
      fr: "OLAP est le traitement analytique en ligne, qui agrège les données pour l'analyse."
    etl:
      en: "ETL (extract, transform and load) is a process that feeds analytical data stores."
      fr: "ETL (extraire, transformer et charger) est un processus qui alimente les magasins de données analytiques."
    ansi:
      en: "ANSI is the organization behind the standard on which the SQL language is based."
      fr: "ANSI est l'organisme à l'origine de la norme sur laquelle repose le langage SQL."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
