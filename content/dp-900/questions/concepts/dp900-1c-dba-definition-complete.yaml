id: dp900-1c-dba-definition-complete
objective: "1.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A database administrator is responsible for the overall [[s1]] of databases, and implements the policies, tools, and processes for [[s2]].
    fr: |
      Un administrateur de base de données est responsable [[s1]] des bases de données dans leur ensemble, et met en œuvre les stratégies, les outils et les processus [[s2]].
  slots:
    - id: s1
      options:
        - { id: viz, text: { en: "visualization and reporting", fr: "de la visualisation et des rapports" } }
        - { id: avail, text: { en: "availability and performance", fr: "de la disponibilité et des performances" } }
        - { id: ingest, text: { en: "ingestion and transformation", fr: "de l'ingestion et de la transformation" } }
    - id: s2
      options:
        - { id: backup, text: { en: "backup and recovery", fr: "de sauvegarde et de récupération" } }
        - { id: cleanse, text: { en: "data cleansing", fr: "de nettoyage des données" } }
        - { id: explore, text: { en: "data exploration", fr: "d'exploration des données" } }
answer:
  values: { s1: avail, s2: backup }
explanation:
  correct:
    en: |
      The database administrator is responsible for the overall availability of databases and for their consistent performance. The role also works with stakeholders to implement the policies, tools, and processes of the backup and recovery plans.
    fr: |
      L'administrateur de base de données est responsable de la disponibilité globale des bases de données et de la constance de leurs performances. Ce rôle travaille aussi avec les parties prenantes pour mettre en œuvre les stratégies, les outils et les processus des plans de sauvegarde et de récupération.
  options:
    viz: { en: "Visualizations and reports are produced by data analysts.", fr: "Les visualisations et les rapports sont produits par les analystes de données." }
    ingest: { en: "Ingesting and transforming data is the work of data engineers.", fr: "L'ingestion et la transformation des données sont le travail des ingénieurs de données." }
    cleanse: { en: "Data cleansing is part of the pipelines that data engineers implement.", fr: "Le nettoyage des données fait partie des pipelines qu'implémentent les ingénieurs de données." }
    explore: { en: "Exploring data to find trends is the work of data analysts.", fr: "L'exploration des données à la recherche de tendances est le travail des analystes de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
