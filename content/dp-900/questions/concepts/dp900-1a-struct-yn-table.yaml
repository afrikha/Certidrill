id: dp900-1a-struct-yn-table
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A relational database contains a table named **Customer**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une base de données relationnelle contient une table nommée **Customer**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Each column of the table stores data of a specific data type."
        fr: "Chaque colonne de la table stocke des données d'un type de données précis."
    - id: s2
      text:
        en: "Each row of the table represents a single instance of the customer entity."
        fr: "Chaque ligne de la table représente une seule instance de l'entité client."
    - id: s3
      text:
        en: "Each row of the table can define additional columns that the other rows don't have."
        fr: "Chaque ligne de la table peut définir des colonnes supplémentaires que les autres lignes n'ont pas."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A relational table is a format for structured data: each row represents one instance of the entity and has the same columns as every other row. Each column is defined with a specific data type, such as text, decimal numbers or dates. A row can't bring its own columns; that flexibility belongs to semi-structured data."
    fr: "Une table relationnelle est un format de données structurées : chaque ligne représente une instance de l'entité et a les mêmes colonnes que toutes les autres lignes. Chaque colonne est définie avec un type de données précis, par exemple du texte, des nombres décimaux ou des dates. Une ligne ne peut pas apporter ses propres colonnes ; cette souplesse appartient aux données semi-structurées."
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
