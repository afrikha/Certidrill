id: dp900-1c-eng-sources-statements
objective: "1.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses several Azure data services. You are describing how the data engineers of Contoso work with these services.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise plusieurs services de données Azure. Vous décrivez la façon dont les ingénieurs de données de Contoso travaillent avec ces services.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A data engineer uses Azure SQL databases as sources for the pipelines that ingest transactional data into an analytical system.
        fr: Un ingénieur de données utilise les bases de données Azure SQL comme sources des pipelines qui ingèrent les données transactionnelles dans un système analytique.
    - id: s2
      text:
        en: A data engineer uses Azure Data Explorer to define and schedule the pipelines that populate a data warehouse.
        fr: Un ingénieur de données utilise Azure Data Explorer pour définir et planifier les pipelines qui alimentent un entrepôt de données.
    - id: s3
      text:
        en: A data engineer integrates Azure Cosmos DB data sources into enterprise analytical solutions.
        fr: Un ingénieur de données intègre des sources de données Azure Cosmos DB dans les solutions analytiques de l'entreprise.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For a data engineer, operational stores such as Azure SQL databases and Azure Cosmos DB are data sources: the engineer builds the pipelines that bring their data into analytical solutions. Those pipelines are defined and scheduled in Azure Data Factory. Azure Data Explorer is a platform for querying large volumes of log and telemetry data, not a pipeline service.
    fr: |
      Pour un ingénieur de données, les magasins opérationnels comme les bases de données Azure SQL et Azure Cosmos DB sont des sources de données : l'ingénieur crée les pipelines qui amènent leurs données dans les solutions analytiques. Ces pipelines sont définis et planifiés dans Azure Data Factory. Azure Data Explorer est une plateforme d'interrogation de grands volumes de données de journaux et de télémétrie, pas un service de pipelines.
  options:
    s2: { en: "Pipelines are defined and scheduled in Azure Data Factory; Azure Data Explorer is used to query log and telemetry data.", fr: "Les pipelines sont définis et planifiés dans Azure Data Factory ; Azure Data Explorer sert à interroger des données de journaux et de télémétrie." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
