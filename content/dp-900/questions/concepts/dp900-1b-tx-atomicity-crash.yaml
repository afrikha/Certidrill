id: dp900-1b-tx-atomicity-crash
objective: "1.3.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A banking application transfers money by debiting one account and crediting another account in a single transaction. The database system loses power after the debit is written but before the transaction is committed. When the system restarts, neither the debit nor the credit is applied.

    Which ACID property does this behavior demonstrate?
  fr: |
    Une application bancaire effectue un virement en débitant un compte et en créditant un autre compte dans une seule transaction. Le système de base de données subit une coupure de courant après l'écriture du débit, mais avant la validation de la transaction. Au redémarrage du système, ni le débit ni le crédit ne sont appliqués.

    Quelle propriété ACID ce comportement illustre-t-il ?
body:
  options:
    - { id: a, text: { en: "Atomicity", fr: "Atomicité" } }
    - { id: b, text: { en: "Consistency", fr: "Cohérence" } }
    - { id: c, text: { en: "Isolation", fr: "Isolation" } }
    - { id: d, text: { en: "Durability", fr: "Durabilité" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Atomicity means that a transaction is a single unit that succeeds completely or fails completely. The debit and the credit must both complete; because the transaction was interrupted before it was committed, the debit that had been written is undone as well."
    fr: "L'atomicité signifie qu'une transaction est une unité unique qui réussit entièrement ou échoue entièrement. Le débit et le crédit doivent aboutir tous les deux ; comme la transaction a été interrompue avant sa validation, le débit déjà écrit est lui aussi annulé."
  options:
    b:
      en: "Consistency means that a transaction takes the data from one valid state to another; the scenario is about a transaction that was only partly executed."
      fr: "La cohérence signifie qu'une transaction fait passer les données d'un état valide à un autre ; le scénario porte sur une transaction exécutée en partie seulement."
    c:
      en: "Isolation concerns concurrent transactions that must not interfere with one another; only one transaction is involved here."
      fr: "L'isolation concerne des transactions simultanées qui ne doivent pas interférer entre elles ; une seule transaction est en jeu ici."
    d:
      en: "Durability guarantees that a committed transaction stays committed after a restart. Here the transaction was never committed, so there is nothing to preserve."
      fr: "La durabilité garantit qu'une transaction validée le reste après un redémarrage. Ici, la transaction n'a jamais été validée : il n'y a donc rien à conserver."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
