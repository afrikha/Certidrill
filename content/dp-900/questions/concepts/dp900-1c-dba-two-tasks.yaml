id: dp900-1c-dba-two-tasks
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks are the responsibility of a database administrator?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches qui relèvent de la responsabilité d'un administrateur de base de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Applying data cleaning routines before data is loaded into an analytical data store", fr: "Appliquer des routines de nettoyage avant le chargement des données dans un magasin de données analytique" }
    - id: b
      text: { en: "Planning how a database stays available during a maintenance operation", fr: "Planifier la disponibilité d'une base de données pendant une opération de maintenance" }
    - id: c
      text: { en: "Exploring data to identify trends and relationships for the business", fr: "Explorer les données pour identifier des tendances et des relations pour l'entreprise" }
    - id: d
      text: { en: "Monitoring pipelines so that the nightly data loads complete as expected", fr: "Surveiller les pipelines pour que les chargements de données nocturnes se terminent comme prévu" }
    - id: e
      text: { en: "Granting or denying users access to the data that a database contains", fr: "Accorder ou refuser aux utilisateurs l'accès aux données que contient une base de données" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The database administrator is responsible for the overall availability of databases, which includes keeping them available while they are maintained. The role also manages the security of the data: it grants privileges and grants or denies access to users.
    fr: |
      L'administrateur de base de données est responsable de la disponibilité globale des bases de données, ce qui inclut leur disponibilité pendant la maintenance. Ce rôle gère aussi la sécurité des données : il accorde des privilèges et accorde ou refuse l'accès aux utilisateurs.
  options:
    a: { en: "Cleansing data on its way to an analytical data store is the work of a data engineer.", fr: "Le nettoyage des données sur le chemin d'un magasin de données analytique est le travail d'un ingénieur de données." }
    c: { en: "Exploring data to find trends and relationships is the work of a data analyst.", fr: "L'exploration des données à la recherche de tendances et de relations est le travail d'un analyste de données." }
    d: { en: "The data engineer owns the management and monitoring of data pipelines.", fr: "C'est l'ingénieur de données qui est responsable de la gestion et de la surveillance des pipelines de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
