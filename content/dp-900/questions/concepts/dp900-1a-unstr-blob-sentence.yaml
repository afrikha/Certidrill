id: dp900-1a-unstr-blob-sentence
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Data such as documents, images, audio and video that doesn't have a specific structure is [[type]] data. Files of this kind contain raw binary data that applications must interpret, and data professionals often call them [[name]].
    fr: |
      Les données telles que les documents, les images, l'audio et la vidéo, qui n'ont pas de structure spécifique, sont des données [[type]]. Les fichiers de ce genre contiennent des données binaires brutes que les applications doivent interpréter, et les professionnels des données les appellent souvent des [[name]].
  slots:
    - id: type
      options:
        - { id: st, text: { en: "structured", fr: "structurées" } }
        - { id: semi, text: { en: "semi-structured", fr: "semi-structurées" } }
        - { id: un, text: { en: "unstructured", fr: "non structurées" } }
    - id: name
      options:
        - { id: blob, text: { en: "BLOBs", fr: "BLOB" } }
        - { id: tbl, text: { en: "tables", fr: "tables" } }
        - { id: delim, text: { en: "delimited files", fr: "fichiers délimités" } }
answer:
  values: { type: un, name: blob }
explanation:
  correct:
    en: "Documents, images, audio and video have no specific structure: they are unstructured data. They are stored as raw binary data that an application must interpret and render, and such files are often called BLOBs (binary large objects)."
    fr: "Les documents, les images, l'audio et la vidéo n'ont pas de structure spécifique : ce sont des données non structurées. Ils sont stockés sous forme de données binaires brutes qu'une application doit interpréter et afficher, et ces fichiers sont souvent appelés BLOB (objets binaires de grande taille)."
  options:
    tbl:
      en: "Tables of rows and columns are the usual form of structured data."
      fr: "Les tables de lignes et de colonnes sont la forme habituelle des données structurées."
    delim:
      en: "A delimited file is plain text in which a delimiter separates the fields of each record."
      fr: "Un fichier délimité est du texte brut dans lequel un délimiteur sépare les champs de chaque enregistrement."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
