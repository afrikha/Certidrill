id: dp900-1a-semi-emails-classify
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware records the contact details of its customers. Most customers have one email address, some have several, and some have none. Each customer record contains only the contact details that exist for that customer.

    Which type of data is this?
  fr: |
    Litware enregistre les coordonnées de ses clients. La plupart des clients ont une adresse e-mail, certains en ont plusieurs et d'autres n'en ont aucune. Chaque enregistrement de client ne contient que les coordonnées qui existent pour ce client.

    De quel type de données s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Unstructured data", fr: "Des données non structurées" } }
    - { id: b, text: { en: "Structured data", fr: "Des données structurées" } }
    - { id: c, text: { en: "Semi-structured data", fr: "Des données semi-structurées" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The records have a structure (contact details with identifiable fields), but it varies from one customer to another. Data that has some structure and allows variation between entity instances is semi-structured data."
    fr: "Les enregistrements ont une structure (des coordonnées aux champs identifiables), mais elle varie d'un client à l'autre. Des données qui ont une certaine structure et autorisent des variations entre les instances d'une entité sont des données semi-structurées."
  options:
    a:
      en: "Unstructured data has no fields at all; here each record has identifiable contact fields."
      fr: "Les données non structurées n'ont aucun champ ; ici, chaque enregistrement a des champs de coordonnées identifiables."
    b:
      en: "In structured data every record has the same fields; here the number of email addresses differs for each customer."
      fr: "Dans des données structurées, tous les enregistrements ont les mêmes champs ; ici, le nombre d'adresses e-mail diffère selon le client."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
