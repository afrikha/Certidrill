id: dp900-1c-dba-task-performance
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is the responsibility of a database administrator?
  fr: |
    Quelle tâche relève de la responsabilité d'un administrateur de base de données ?
body:
  options:
    - id: a
      text: { en: "Implementing a pipeline that loads sales files into a data warehouse", fr: "Implémenter un pipeline qui charge des fichiers de ventes dans un entrepôt de données" }
    - id: b
      text: { en: "Building an analytical model for self-service reporting", fr: "Créer un modèle analytique pour des rapports en libre-service" }
    - id: c
      text: { en: "Integrating a large language model into a support application", fr: "Intégrer un grand modèle de langage dans une application de support" }
    - id: d
      text: { en: "Optimizing a database so that its performance stays consistent", fr: "Optimiser une base de données pour que ses performances restent constantes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The database administrator is responsible for the overall availability of databases and for their consistent performance and optimization. Tuning a database is therefore part of the operational work of this role.
    fr: |
      L'administrateur de base de données est responsable de la disponibilité globale des bases de données, ainsi que de la constance de leurs performances et de leur optimisation. L'ajustement d'une base de données fait donc partie du travail d'exploitation de ce rôle.
  options:
    a: { en: "Implementing pipelines that transfer and transform data between systems is the work of a data engineer.", fr: "L'implémentation de pipelines qui transfèrent et transforment les données entre les systèmes est le travail d'un ingénieur de données." }
    b: { en: "Designing and building analytical models is the work of a data analyst.", fr: "La conception et la création de modèles analytiques sont le travail d'un analyste de données." }
    c: { en: "Integrating AI-powered features into applications is the work of an AI engineer.", fr: "L'intégration de fonctionnalités d'IA dans les applications est le travail d'un ingénieur IA." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
