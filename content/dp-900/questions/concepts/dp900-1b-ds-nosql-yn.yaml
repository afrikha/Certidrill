id: dp900-1b-ds-nosql-yn
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about non-relational databases, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les bases de données non relationnelles, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Some non-relational databases support a variant of the SQL language.
        fr: Certaines bases de données non relationnelles prennent en charge une variante du langage SQL.
    - id: s2
      text:
        en: A column family database stores data in rows and columns.
        fr: Une base de données de familles de colonnes stocke les données en lignes et en colonnes.
    - id: s3
      text:
        en: A graph database stores entities as rows of a table and relationships as key columns.
        fr: Une base de données de graphes stocke les entités sous forme de lignes d'une table et les relations sous forme de colonnes clés.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Non-relational databases are often called NoSQL databases, even though some of them support a variant of SQL. A column family database stores tabular data made of rows and columns, in which the columns are divided into column families. A graph database stores entities as nodes and relationships as links between the nodes; rows and key columns describe a relational database."
    fr: "Les bases de données non relationnelles sont souvent appelées bases de données NoSQL, même si certaines prennent en charge une variante de SQL. Une base de données de familles de colonnes stocke des données tabulaires faites de lignes et de colonnes, dans lesquelles les colonnes sont réparties en familles de colonnes. Une base de données de graphes stocke les entités sous forme de nœuds et les relations sous forme de liens entre les nœuds ; les lignes et les colonnes clés décrivent une base de données relationnelle."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
