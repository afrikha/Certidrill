id: dp900-1a-fmt-yn-delimited
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In a TSV file, the fields are separated by tabs."
        fr: "Dans un fichier TSV, les champs sont séparés par des tabulations."
    - id: s2
      text:
        en: "The first line of a CSV file must contain the names of the fields."
        fr: "La première ligne d'un fichier CSV doit contenir les noms des champs."
    - id: s3
      text:
        en: "In fixed-width data, each field is allocated a fixed number of characters."
        fr: "Dans des données à largeur fixe, chaque champ se voit allouer un nombre fixe de caractères."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Delimited text separates fields with a specific character: a comma in CSV files, a tab in tab-separated values (TSV) files. In a CSV file, the first line may contain the field names, but this is optional. Fixed-width data uses no delimiter: each field has a fixed number of characters."
    fr: "Le texte délimité sépare les champs par un caractère précis : une virgule dans les fichiers CSV, une tabulation dans les fichiers de valeurs séparées par des tabulations (TSV). Dans un fichier CSV, la première ligne peut contenir les noms des champs, mais c'est facultatif. Les données à largeur fixe n'utilisent pas de délimiteur : chaque champ a un nombre fixe de caractères."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
