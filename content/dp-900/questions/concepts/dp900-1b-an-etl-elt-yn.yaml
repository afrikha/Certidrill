id: dp900-1b-an-etl-elt-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to copy the data of its operational systems into an analytical data store.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de copier les données de ses systèmes opérationnels dans un magasin de données analytique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In an ETL process, the data is transformed before it is loaded into the analytical data store.
        fr: Dans un processus ETL, les données sont transformées avant d'être chargées dans le magasin de données analytique.
    - id: s2
      text:
        en: In an ELT process, the data is loaded first and the transformations are applied afterward.
        fr: Dans un processus ELT, les données sont d'abord chargées et les transformations sont appliquées ensuite.
    - id: s3
      text:
        en: ETL and ELT processes move the data from the analytical data store to the operational systems.
        fr: Les processus ETL et ELT déplacent les données du magasin de données analytique vers les systèmes opérationnels.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "ETL stands for extract, transform and load: operational data is transformed on its way to the analytical store. In ELT (extract, load and transform), a pattern that is common in modern lakehouses, the data is loaded first and transformed afterward. In both cases the data flows from the operational systems to the analytical store, not the other way."
    fr: "ETL signifie extraire, transformer et charger : les données opérationnelles sont transformées sur le chemin du magasin analytique. Dans ELT (extraire, charger et transformer), un modèle courant dans les lakehouses modernes, les données sont d'abord chargées, puis transformées. Dans les deux cas, les données circulent des systèmes opérationnels vers le magasin analytique, et non l'inverse."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
