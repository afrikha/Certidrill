id: dp900-1a-fmt-json-syntax
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In a JSON document, objects are enclosed in [[obj]], collections are enclosed in [[col]], and attributes are represented by [[attr]].
    fr: |
      Dans un document JSON, les objets sont placés entre [[obj]], les collections sont placées entre [[col]] et les attributs sont représentés par [[attr]].
  slots:
    - id: obj
      options:
        - { id: ang, text: { en: "angle brackets", fr: "chevrons" } }
        - { id: brace, text: { en: "braces", fr: "accolades" } }
        - { id: sq, text: { en: "square brackets", fr: "crochets" } }
    - id: col
      options:
        - { id: ang, text: { en: "angle brackets", fr: "chevrons" } }
        - { id: brace, text: { en: "braces", fr: "accolades" } }
        - { id: sq, text: { en: "square brackets", fr: "crochets" } }
    - id: attr
      options:
        - { id: nv, text: { en: "name-value pairs", fr: "des paires nom-valeur" } }
        - { id: tags, text: { en: "tags", fr: "des balises" } }
        - { id: fw, text: { en: "fixed-width fields", fr: "des champs à largeur fixe" } }
answer:
  values: { obj: brace, col: sq, attr: nv }
explanation:
  correct:
    en: "JSON encloses each object in braces and each collection in square brackets. Inside an object, the attributes are name-value pairs separated by commas."
    fr: "JSON place chaque objet entre accolades et chaque collection entre crochets. Dans un objet, les attributs sont des paires nom-valeur séparées par des virgules."
  options:
    ang:
      en: "Angle brackets enclose the tags of XML, not the objects or collections of JSON."
      fr: "Les chevrons entourent les balises de XML, pas les objets ni les collections de JSON."
    tags:
      en: "Tags define the elements and attributes of an XML file."
      fr: "Les balises définissent les éléments et les attributs d'un fichier XML."
    fw:
      en: "Fixed-width fields belong to a kind of text file in which each field has a fixed number of characters."
      fr: "Les champs à largeur fixe appartiennent à un type de fichier texte dans lequel chaque champ a un nombre fixe de caractères."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
