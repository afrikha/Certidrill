id: dp900-1b-an-stores-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about analytical data stores, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les magasins de données analytiques, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In a data lakehouse, tables are abstractions over files that are stored in a data lake.
        fr: Dans un data lakehouse, les tables sont des abstractions sur des fichiers stockés dans un lac de données.
    - id: s2
      text:
        en: Data must be loaded into relational tables before it can be stored in a data lake.
        fr: Les données doivent être chargées dans des tables relationnelles avant de pouvoir être stockées dans un lac de données.
    - id: s3
      text:
        en: An analytical table schema may duplicate some data from an OLTP source so that queries run faster.
        fr: Un schéma de tables analytique peut dupliquer certaines données d'une source OLTP pour que les requêtes s'exécutent plus vite.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A data lakehouse provides tabular abstractions over the files of a data lake, whereas a data warehouse is a fully relational SQL engine. A data lake is file-based storage: data is collected there as files, before any schema of tables is applied. The table schema of an analytical store may require denormalizing the data of an OLTP source, which introduces some duplication to make queries perform faster."
    fr: "Un data lakehouse fournit des abstractions tabulaires sur les fichiers d'un lac de données, alors qu'un entrepôt de données est un moteur SQL entièrement relationnel. Un lac de données est un stockage à base de fichiers : les données y sont collectées sous forme de fichiers, avant l'application de tout schéma de tables. Le schéma de tables d'un magasin analytique peut exiger de dénormaliser les données d'une source OLTP, ce qui introduit une certaine duplication pour accélérer les requêtes."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
