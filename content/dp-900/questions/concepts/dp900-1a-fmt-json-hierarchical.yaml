id: dp900-1a-fmt-json-hierarchical
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team needs a human-readable file format that uses a hierarchical document schema, in which an attribute of an object can itself be an object or a collection. The format must suit both structured and semi-structured data.

    Which file format should the team use?
  fr: |
    Une équipe de développement a besoin d'un format de fichier lisible par l'homme, qui utilise un schéma de document hiérarchique dans lequel un attribut d'un objet peut lui-même être un objet ou une collection. Le format doit convenir aux données structurées comme aux données semi-structurées.

    Quel format de fichier l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: "JSON" }
    - { id: b, text: "CSV" }
    - { id: c, text: "TSV" }
    - { id: d, text: "BLOB" }
answer: { optionId: a }
explanation:
  correct:
    en: "JSON uses a hierarchical document schema to define objects that have several attributes, and an attribute can be an object or a collection. This flexibility makes it suitable for both structured and semi-structured data, and the file remains readable text."
    fr: "JSON utilise un schéma de document hiérarchique pour définir des objets dotés de plusieurs attributs, et un attribut peut être un objet ou une collection. Cette souplesse le rend adapté aux données structurées comme aux données semi-structurées, et le fichier reste du texte lisible."
  options:
    b:
      en: "A CSV file is flat: each line is a record whose fields are separated by commas, with no nested object or collection."
      fr: "Un fichier CSV est plat : chaque ligne est un enregistrement dont les champs sont séparés par des virgules, sans objet ni collection imbriqués."
    c:
      en: "A TSV file is flat delimited text too; only the delimiter, a tab, differs from CSV."
      fr: "Un fichier TSV est lui aussi du texte délimité plat ; seul le délimiteur, une tabulation, diffère du CSV."
    d:
      en: "A BLOB is raw binary data that an application must interpret; it isn't human-readable."
      fr: "Un BLOB est constitué de données binaires brutes qu'une application doit interpréter ; il n'est pas lisible par l'homme."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
