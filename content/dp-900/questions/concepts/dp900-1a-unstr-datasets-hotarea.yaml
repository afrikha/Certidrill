id: dp900-1a-unstr-datasets-hotarea
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has the data sets shown in the following table.

    Answer each prompt by selecting the appropriate data set.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des jeux de données présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le jeu de données approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The data set that is unstructured data", fr: "Le jeu de données qui constitue des données non structurées" }
    - id: p2
      text: { en: "The data set that is semi-structured data", fr: "Le jeu de données qui constitue des données semi-structurées" }
  grid:
    header: [{ en: "Name", fr: "Nom" }, { en: "Content", fr: "Contenu" }, { en: "Form", fr: "Forme" }]
    rows:
      - [{ text: "DS1", area: ds1 }, { text: { en: "Sales orders", fr: "Commandes" } }, { text: { en: "A table with the same six columns for every order", fr: "Une table avec les mêmes six colonnes pour chaque commande" } }]
      - [{ text: "DS2", area: ds2 }, { text: { en: "Customer feedback", fr: "Avis de clients" } }, { text: { en: "Free-text comments saved as Word documents", fr: "Des commentaires en texte libre enregistrés dans des documents Word" } }]
      - [{ text: "DS3", area: ds3 }, { text: { en: "Device events", fr: "Événements d'appareils" } }, { text: { en: "JSON documents whose properties depend on the device", fr: "Des documents JSON dont les propriétés dépendent de l'appareil" } }]
      - [{ text: "DS4", area: ds4 }, { text: { en: "Price list", fr: "Liste de prix" } }, { text: { en: "A CSV file with the same three fields on every line", fr: "Un fichier CSV avec les mêmes trois champs sur chaque ligne" } }]
answer:
  values: { p1: ds2, p2: ds3 }
explanation:
  correct:
    en: "Word documents contain text but no fields: DS2 is unstructured data. The JSON documents of DS3 have named properties that vary from one device to another: this is semi-structured data. DS1 and DS4 have the same fields for every record, so both are structured data."
    fr: "Les documents Word contiennent du texte mais pas de champs : DS2 constitue des données non structurées. Les documents JSON de DS3 ont des propriétés nommées qui varient d'un appareil à l'autre : ce sont des données semi-structurées. DS1 et DS4 ont les mêmes champs pour tous les enregistrements : ce sont dans les deux cas des données structurées."
  options:
    ds1:
      en: "A table with the same columns for every order follows a fixed schema: structured data."
      fr: "Une table avec les mêmes colonnes pour chaque commande suit un schéma fixe : données structurées."
    ds4:
      en: "A CSV file with the same fields on every line is delimited text that holds structured data."
      fr: "Un fichier CSV avec les mêmes champs sur chaque ligne est du texte délimité qui contient des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
