id: dp900-1c-dba-one-person-roles
objective: "1.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    At a small company named Wingtip Toys, one employee performs several data roles.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans une petite entreprise nommée Wingtip Toys, un même employé tient plusieurs rôles de données.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When the employee creates a pipeline that transfers data from the order database to a data warehouse, the employee acts as a [[r1]].

      When the employee provisions the transactional database of a new application, the employee acts as a [[r2]].

      When the employee builds charts from the data warehouse to help managers make decisions, the employee acts as a [[r3]].
    fr: |
      Lorsque l'employé crée un pipeline qui transfère les données de la base de données des commandes vers un entrepôt de données, il agit en tant qu'[[r1]].

      Lorsque l'employé provisionne la base de données transactionnelle d'une nouvelle application, il agit en tant qu'[[r2]].

      Lorsque l'employé crée des graphiques à partir de l'entrepôt de données pour aider les responsables à décider, il agit en tant qu'[[r3]].
  slots:
    - id: r1
      options:
        - { id: dba, text: { en: "database administrator", fr: "administrateur de base de données" } }
        - { id: eng, text: { en: "data engineer", fr: "ingénieur de données" } }
        - { id: ana, text: { en: "data analyst", fr: "analyste de données" } }
    - id: r2
      options:
        - { id: dba, text: { en: "database administrator", fr: "administrateur de base de données" } }
        - { id: eng, text: { en: "data engineer", fr: "ingénieur de données" } }
        - { id: ana, text: { en: "data analyst", fr: "analyste de données" } }
    - id: r3
      options:
        - { id: dba, text: { en: "database administrator", fr: "administrateur de base de données" } }
        - { id: eng, text: { en: "data engineer", fr: "ingénieur de données" } }
        - { id: ana, text: { en: "data analyst", fr: "analyste de données" } }
answer:
  values: { r1: eng, r2: dba, r3: ana }
explanation:
  correct:
    en: |
      Roles define tasks and responsibilities, and the same person can perform several of them. Creating a pipeline that transfers data to a data warehouse is a data engineer task, provisioning a transactional database is a database administrator task, and creating charts that support decisions is a data analyst task.
    fr: |
      Les rôles définissent des tâches et des responsabilités, et une même personne peut en tenir plusieurs. Créer un pipeline qui transfère des données vers un entrepôt de données est une tâche d'ingénieur de données, provisionner une base de données transactionnelle est une tâche d'administrateur de base de données, et créer des graphiques qui aident à décider est une tâche d'analyste de données.
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
