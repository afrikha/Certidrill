id: dp900-1b-ds-document-catalog
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware sells products whose attributes differ from one product to another. Each product is stored as a JSON item, and the application must filter the products on the fields inside the items.

    Which type of data store should Litware use?
  fr: |
    Litware vend des produits dont les attributs diffèrent d'un produit à l'autre. Chaque produit est stocké sous forme d'élément JSON, et l'application doit filtrer les produits sur les champs contenus dans les éléments.

    Quel type de magasin de données Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A graph database", fr: "Une base de données de graphes" } }
    - { id: b, text: { en: "A document database", fr: "Une base de données de documents" } }
    - { id: c, text: { en: "A relational database", fr: "Une base de données relationnelle" } }
    - { id: d, text: { en: "A key-value database", fr: "Une base de données clé-valeur" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A document database is a form of key-value database in which the value is a JSON document that the system is optimized to parse and query. Each product can have its own attributes, and the application can still filter on the fields of the documents."
    fr: "Une base de données de documents est une forme de base de données clé-valeur dans laquelle la valeur est un document JSON que le système est optimisé pour analyser et interroger. Chaque produit peut avoir ses propres attributs, et l'application peut tout de même filtrer sur les champs des documents."
  options:
    a:
      en: "A graph database stores nodes and the links between them; the requirement is about items with varying fields, not about relationships."
      fr: "Une base de données de graphes stocke des nœuds et les liens entre eux ; le besoin porte sur des éléments aux champs variables, pas sur des relations."
    c:
      en: "A relational database applies the same schema of columns to every row of a table, which doesn't suit JSON items whose attributes differ."
      fr: "Une base de données relationnelle applique le même schéma de colonnes à toutes les lignes d'une table, ce qui ne convient pas à des éléments JSON dont les attributs diffèrent."
    d:
      en: "A key-value database returns a value from its key, but the value can be in any format and the store isn't built to query the fields inside it."
      fr: "Une base de données clé-valeur renvoie une valeur à partir de sa clé, mais la valeur peut avoir n'importe quel format et le magasin n'est pas conçu pour interroger les champs qu'elle contient."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
