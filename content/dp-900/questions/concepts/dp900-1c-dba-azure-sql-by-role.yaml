id: dp900-1c-dba-azure-sql-by-role
objective: "1.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores the transactional data of its business applications in Azure SQL Database. Several data roles work with these databases.

    Match each role to what it does with the databases. To answer, drag the appropriate role to each task. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke les données transactionnelles de ses applications métier dans Azure SQL Database. Plusieurs rôles de données travaillent avec ces bases de données.

    Associez chaque rôle à ce qu'il fait des bases de données. Pour répondre, faites glisser le rôle approprié vers chaque tâche. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ana, text: { en: "Data analyst", fr: "Analyste de données" } }
    - { id: ai, text: { en: "AI engineer", fr: "Ingénieur IA" } }
    - { id: dba, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
    - { id: eng, text: { en: "Data engineer", fr: "Ingénieur de données" } }
  targets:
    - id: t1
      text: { en: "Uses the databases as a source for pipelines that ingest the transactional data into an analytical system", fr: "Utilise les bases de données comme source de pipelines qui ingèrent les données transactionnelles dans un système analytique" }
    - id: t2
      text: { en: "Provisions and manages the databases that support the business applications", fr: "Provisionne et gère les bases de données sur lesquelles reposent les applications métier" }
    - id: t3
      text: { en: "Queries the databases to create reports", fr: "Interroge les bases de données pour créer des rapports" }
answer:
  mapping: { t1: eng, t2: dba, t3: ana }
explanation:
  correct:
    en: |
      Each role sees the same service differently. The database administrator provisions and manages the Azure SQL databases, the data engineer uses them as sources for the pipelines that feed analytical systems, and the data analyst queries them to create reports. The AI engineer builds AI-powered features and matches none of these tasks.
    fr: |
      Chaque rôle voit le même service différemment. L'administrateur de base de données provisionne et gère les bases de données Azure SQL, l'ingénieur de données les utilise comme sources des pipelines qui alimentent les systèmes analytiques, et l'analyste de données les interroge pour créer des rapports. L'ingénieur IA crée des fonctionnalités d'IA et ne correspond à aucune de ces tâches.
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
