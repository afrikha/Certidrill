id: dp900-1c-ana-sources-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores its transactional data in Azure SQL Database and loads a data warehouse every night.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke ses données transactionnelles dans Azure SQL Database et charge un entrepôt de données chaque nuit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A data analyst can query an Azure SQL database directly to create a report.
        fr: Un analyste de données peut interroger directement une base de données Azure SQL pour créer un rapport.
    - id: s2
      text:
        en: A data analyst owns the monitoring of the pipelines that load the data warehouse.
        fr: Un analyste de données est responsable de la surveillance des pipelines qui chargent l'entrepôt de données.
    - id: s3
      text:
        en: A data analyst provisions the Azure SQL databases that support the business applications.
        fr: Un analyste de données provisionne les bases de données Azure SQL sur lesquelles reposent les applications métier.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Data analysts might query Azure SQL databases directly to create reports, even if in large organizations the data is generally combined with other sources in an analytical data store first. The monitoring of data pipelines belongs to the data engineer, and provisioning the databases belongs to the database administrator.
    fr: |
      Les analystes de données peuvent interroger directement les bases de données Azure SQL pour créer des rapports, même si, dans les grandes organisations, les données sont généralement d'abord combinées à d'autres sources dans un magasin de données analytique. La surveillance des pipelines de données revient à l'ingénieur de données, et le provisionnement des bases de données revient à l'administrateur de base de données.
  options:
    s2: { en: "Data engineers own the management and monitoring of data pipelines.", fr: "Ce sont les ingénieurs de données qui sont responsables de la gestion et de la surveillance des pipelines de données." }
    s3: { en: "Database administrators provision and manage Azure SQL databases.", fr: "Ce sont les administrateurs de base de données qui provisionnent et gèrent les bases de données Azure SQL." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
