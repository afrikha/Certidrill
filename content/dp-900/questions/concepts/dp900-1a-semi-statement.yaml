id: dp900-1a-semi-statement
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes semi-structured data?
  fr: |
    Quelle affirmation décrit les données semi-structurées ?
body:
  options:
    - { id: a, text: { en: "All the data has the same fields, most commonly in a tabular schema.", fr: "Toutes les données ont les mêmes champs, le plus souvent dans un schéma tabulaire." } }
    - { id: b, text: { en: "The data has no specific structure, as in images and audio recordings.", fr: "Les données n'ont pas de structure spécifique, comme les images et les enregistrements audio." } }
    - { id: c, text: { en: "The data has some structure, which can vary between entity instances.", fr: "Les données ont une certaine structure, qui peut varier entre les instances d'une entité." } }
    - { id: d, text: { en: "The data is a numerical representation of content such as text.", fr: "Les données sont une représentation numérique d'un contenu tel qu'un texte." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Semi-structured data has some structure, but that structure allows for variation between the instances of an entity: one customer can have several email addresses and another none. It sits between structured data, whose schema is fixed, and unstructured data, which has no fields."
    fr: "Les données semi-structurées ont une certaine structure, mais cette structure autorise des variations entre les instances d'une entité : un client peut avoir plusieurs adresses e-mail et un autre aucune. Elles se situent entre les données structurées, dont le schéma est fixe, et les données non structurées, qui n'ont pas de champs."
  options:
    a:
      en: "The same fields for all the data, in a fixed schema, describes structured data."
      fr: "Les mêmes champs pour toutes les données, dans un schéma fixe, décrivent les données structurées."
    b:
      en: "Data without a specific structure is unstructured data."
      fr: "Des données sans structure spécifique sont des données non structurées."
    d:
      en: "A numerical representation of content describes vector data, also called embeddings."
      fr: "Une représentation numérique d'un contenu décrit les données vectorielles, aussi appelées incorporations (embeddings)."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
