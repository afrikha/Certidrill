id: dp900-1a-unstr-post-items
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A photo-sharing application stores three items for each post: the photo itself, a JSON document that holds the caption and optional properties such as the location, and a row in a table named **Engagement** that has the same four columns for every post.

    How should the three items be classified?
  fr: |
    Une application de partage de photos stocke trois éléments pour chaque publication : la photo elle-même, un document JSON qui contient la légende et des propriétés facultatives telles que le lieu, et une ligne dans une table nommée **Engagement** qui a les mêmes quatre colonnes pour toutes les publications.

    Comment ces trois éléments doivent-ils être classés ?
body:
  options:
    - { id: a, text: { en: "Photo: unstructured. JSON document: structured. Table row: structured.", fr: "Photo : non structurée. Document JSON : structuré. Ligne de table : structurée." } }
    - { id: b, text: { en: "Photo: semi-structured. JSON document: semi-structured. Table row: structured.", fr: "Photo : semi-structurée. Document JSON : semi-structuré. Ligne de table : structurée." } }
    - { id: c, text: { en: "Photo: unstructured. JSON document: unstructured. Table row: semi-structured.", fr: "Photo : non structurée. Document JSON : non structuré. Ligne de table : semi-structurée." } }
    - { id: d, text: { en: "Photo: unstructured. JSON document: semi-structured. Table row: structured.", fr: "Photo : non structurée. Document JSON : semi-structuré. Ligne de table : structurée." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An image has no specific structure: unstructured data. The JSON documents have named properties, but the optional ones exist for some posts only, so the structure varies between posts: semi-structured data. The table has the same columns for every post, a fixed schema: structured data."
    fr: "Une image n'a pas de structure spécifique : données non structurées. Les documents JSON ont des propriétés nommées, mais les propriétés facultatives n'existent que pour certaines publications : la structure varie d'une publication à l'autre, ce sont des données semi-structurées. La table a les mêmes colonnes pour toutes les publications, soit un schéma fixe : données structurées."
  options:
    a:
      en: "Optional properties make the fields vary between documents, which a fixed schema doesn't allow: the JSON documents are semi-structured."
      fr: "Les propriétés facultatives font varier les champs d'un document à l'autre, ce qu'un schéma fixe n'autorise pas : les documents JSON sont semi-structurés."
    b:
      en: "A photo has no named fields at all: it is unstructured, not semi-structured."
      fr: "Une photo n'a aucun champ nommé : elle est non structurée, pas semi-structurée."
    c:
      en: "A JSON document has named properties, so it isn't unstructured, and a table with the same columns for every row is structured."
      fr: "Un document JSON a des propriétés nommées : il n'est donc pas non structuré, et une table avec les mêmes colonnes pour chaque ligne est structurée."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
