id: dp900-1c-ana-tools-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are describing the tools that the data analysts of Litware use.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous décrivez les outils qu'utilisent les analystes de données de Litware.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In Azure Databricks, a data analyst can use notebooks to query and visualize data.
        fr: Dans Azure Databricks, un analyste de données peut utiliser des notebooks pour interroger et visualiser les données.
    - id: s2
      text:
        en: A data analyst uses Azure Data Factory to create the dashboards that decision-makers read.
        fr: Un analyste de données utilise Azure Data Factory pour créer les tableaux de bord que lisent les décideurs.
    - id: s3
      text:
        en: The AI features of Power BI can help a data analyst by suggesting visualizations and summarizing reports.
        fr: Les fonctionnalités d'IA de Power BI peuvent aider un analyste de données en suggérant des visualisations et en résumant des rapports.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Data analysts can use the notebook support of Azure Databricks to query and visualize data in a web-based interface. Dashboards are built in Power BI, whose AI features can summarize reports and suggest visualizations. Azure Data Factory defines and schedules data pipelines and is used by data engineers.
    fr: |
      Les analystes de données peuvent utiliser les notebooks d'Azure Databricks pour interroger et visualiser les données dans une interface web. Les tableaux de bord sont créés dans Power BI, dont les fonctionnalités d'IA peuvent résumer des rapports et suggérer des visualisations. Azure Data Factory définit et planifie des pipelines de données et est utilisé par les ingénieurs de données.
  options:
    s2: { en: "Dashboards are created in Power BI; Azure Data Factory is a pipeline service for data engineers.", fr: "Les tableaux de bord sont créés dans Power BI ; Azure Data Factory est un service de pipelines pour les ingénieurs de données." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
