id: dp900-1b-ds-nonrelational-common
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What do all non-relational (NoSQL) databases have in common?
  fr: |
    Qu'ont en commun toutes les bases de données non relationnelles (NoSQL) ?
body:
  options:
    - { id: a, text: { en: "They store each record as a JSON document.", fr: "Elles stockent chaque enregistrement sous forme de document JSON." } }
    - { id: b, text: { en: "They reject every variant of the SQL language.", fr: "Elles refusent toute variante du langage SQL." } }
    - { id: c, text: { en: "They don't apply a relational schema to the data.", fr: "Elles n'appliquent pas de schéma relationnel aux données." } }
    - { id: d, text: { en: "They store entities as nodes connected by links.", fr: "Elles stockent les entités sous forme de nœuds reliés par des liens." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Non-relational databases are data management systems that don't apply a relational schema to the data. Beyond that, they differ widely: key-value, document, column family and graph databases each store data in their own way."
    fr: "Les bases de données non relationnelles sont des systèmes de gestion de données qui n'appliquent pas de schéma relationnel aux données. Pour le reste, elles sont très différentes : les bases de données clé-valeur, de documents, de familles de colonnes et de graphes stockent chacune les données à leur manière."
  options:
    a:
      en: "Storing JSON documents is specific to document databases, which are only one kind of non-relational database."
      fr: "Le stockage de documents JSON est propre aux bases de données de documents, qui ne sont qu'un type de base de données non relationnelle."
    b:
      en: "Although they are called NoSQL databases, some non-relational databases support a variant of the SQL language."
      fr: "Bien qu'on les appelle bases de données NoSQL, certaines bases de données non relationnelles prennent en charge une variante du langage SQL."
    d:
      en: "Nodes and links are specific to graph databases, which are only one kind of non-relational database."
      fr: "Les nœuds et les liens sont propres aux bases de données de graphes, qui ne sont qu'un type de base de données non relationnelle."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
