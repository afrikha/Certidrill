id: dp900-1a-unstr-yn-basics
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A photo that is stored as a JPEG file is unstructured data."
        fr: "Une photo stockée dans un fichier JPEG constitue des données non structurées."
    - id: s2
      text:
        en: "Unstructured data is organized in rows and columns."
        fr: "Les données non structurées sont organisées en lignes et en colonnes."
    - id: s3
      text:
        en: "Word-processing documents are examples of unstructured data."
        fr: "Les documents de traitement de texte sont des exemples de données non structurées."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Documents, images, audio and video data, and binary files don't have a specific structure: they are unstructured data. Rows and columns are the tabular schema of structured data."
    fr: "Les documents, les images, les données audio et vidéo et les fichiers binaires n'ont pas de structure spécifique : ce sont des données non structurées. Les lignes et les colonnes forment le schéma tabulaire des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
