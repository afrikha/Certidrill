id: dp900-1a-fmt-optimized-dd
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each file format to its description. To answer, drag the appropriate formats to the correct descriptions. Each format may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque format de fichier à sa description. Pour répondre, faites glisser les formats appropriés vers les descriptions correspondantes. Chaque format peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: json, text: "JSON" }
    - { id: parquet, text: "Parquet" }
    - { id: xml, text: "XML" }
    - { id: avro, text: "Avro" }
    - { id: delta, text: "Delta Lake" }
  targets:
    - id: t1
      text: { en: "A row-based format in which each file has a header, stored as JSON, that describes the structure of the data", fr: "Un format orienté ligne dans lequel chaque fichier a un en-tête, stocké en JSON, qui décrit la structure des données" }
    - id: t2
      text: { en: "A columnar format in which a file contains row groups", fr: "Un format en colonnes dans lequel un fichier contient des groupes de lignes" }
    - id: t3
      text: { en: "An open-source format that adds a transaction log to files in a data lake", fr: "Un format open source qui ajoute un journal des transactions aux fichiers d'un lac de données" }
answer:
  mapping: { t1: avro, t2: parquet, t3: delta }
explanation:
  correct:
    en: "Avro is row-based: a JSON header describes the structure and the records are stored as binary. Parquet is columnar: each row group stores the data of each column together. Delta Lake builds on Parquet and adds a transaction log, which enables ACID transactions, data versioning and reliable updates."
    fr: "Avro est orienté ligne : un en-tête JSON décrit la structure et les enregistrements sont stockés en binaire. Parquet est en colonnes : chaque groupe de lignes stocke ensemble les données de chaque colonne. Delta Lake s'appuie sur Parquet et ajoute un journal des transactions, qui permet les transactions ACID, la gestion des versions des données et des mises à jour fiables."
  options:
    json:
      en: "JSON is a text format on its own, made of objects and name-value pairs; in an Avro file only the header is JSON."
      fr: "JSON est un format texte à part entière, fait d'objets et de paires nom-valeur ; dans un fichier Avro, seul l'en-tête est en JSON."
    xml:
      en: "XML is a human-readable text format based on tags in angle brackets."
      fr: "XML est un format texte lisible par l'homme, fondé sur des balises entre chevrons."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
