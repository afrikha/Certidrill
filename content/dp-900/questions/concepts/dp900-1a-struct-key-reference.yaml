id: dp900-1a-struct-key-reference
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind stores its customers and its sales orders in two tables of a relational database.

    How does a sales order indicate which customer placed it?
  fr: |
    Northwind stocke ses clients et ses commandes dans deux tables d'une base de données relationnelle.

    Comment une commande indique-t-elle le client qui l'a passée ?
body:
  options:
    - { id: a, text: { en: "It contains the key value of the customer.", fr: "Elle contient la valeur de clé du client." } }
    - { id: b, text: { en: "It contains a copy of every column of the customer.", fr: "Elle contient une copie de toutes les colonnes du client." } }
    - { id: c, text: { en: "It is nested inside the row of the customer.", fr: "Elle est imbriquée dans la ligne du client." } }
    - { id: d, text: { en: "It is stored in the same file as the customer.", fr: "Elle est stockée dans le même fichier que le client." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In a relational model, tables reference one another by using key values. Each customer has a primary key that identifies it, and the row of a sales order stores that key to show which customer placed the order."
    fr: "Dans un modèle relationnel, les tables se référencent par des valeurs de clé. Chaque client a une clé primaire qui l'identifie, et la ligne d'une commande stocke cette clé pour indiquer quel client a passé la commande."
  options:
    b:
      en: "Referencing the customer by its key is what avoids repeating the details of the customer in every order."
      fr: "Référencer le client par sa clé est justement ce qui évite de répéter les informations du client dans chaque commande."
    c:
      en: "Nesting one object inside another belongs to hierarchical formats such as JSON; a row of a table holds one value per column."
      fr: "L'imbrication d'un objet dans un autre relève des formats hiérarchiques comme JSON ; une ligne de table contient une valeur par colonne."
    d:
      en: "The relationship between two tables is defined by key values, not by the file in which the data is kept."
      fr: "La relation entre deux tables est définie par des valeurs de clé, pas par le fichier où les données sont conservées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore databases"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
