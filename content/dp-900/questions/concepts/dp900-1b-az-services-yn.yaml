id: dp900-1b-az-services-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure data stores, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les magasins de données Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Table storage stores relational tables that are joined by using foreign keys.
        fr: Le Stockage Table Azure stocke des tables relationnelles jointes à l'aide de clés étrangères.
    - id: s2
      text:
        en: Azure Cosmos DB can store data as JSON documents, key-value pairs, column families and graphs.
        fr: Azure Cosmos DB peut stocker des données sous forme de documents JSON, de paires clé-valeur, de familles de colonnes et de graphes.
    - id: s3
      text:
        en: Azure SQL is the collective name of relational database services that are based on the SQL Server database engine.
        fr: Azure SQL est le nom collectif de services de base de données relationnelle fondés sur le moteur de base de données SQL Server.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure Table storage is a key-value store for non-relational structured data: it suits datasets that don't require complex joins or foreign keys. Azure Cosmos DB is a non-relational database that supports multiple APIs and several data models. Azure SQL groups Azure SQL Database, Azure SQL Managed Instance and SQL Server on Azure Virtual Machines, all based on the SQL Server engine."
    fr: "Le Stockage Table Azure est un magasin clé-valeur pour des données structurées non relationnelles : il convient aux jeux de données qui ne nécessitent ni jointures complexes ni clés étrangères. Azure Cosmos DB est une base de données non relationnelle qui prend en charge plusieurs API et plusieurs modèles de données. Azure SQL regroupe Azure SQL Database, Azure SQL Managed Instance et SQL Server sur Machines Virtuelles Azure, tous fondés sur le moteur SQL Server."
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
