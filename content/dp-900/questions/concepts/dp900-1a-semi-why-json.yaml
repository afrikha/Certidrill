id: dp900-1a-semi-why-json
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application stores the following two customer documents.

    ```json
    { "name": "Ana Ruiz", "email": "ana@contoso.com", "phones": ["555-0101", "555-0102"] }
    { "name": "Kenji Sato", "company": "Fabrikam", "email": "kenji@fabrikam.com" }
    ```

    Why is this data classified as semi-structured data?
  fr: |
    Une application stocke les deux documents de clients suivants.

    ```json
    { "name": "Ana Ruiz", "email": "ana@contoso.com", "phones": ["555-0101", "555-0102"] }
    { "name": "Kenji Sato", "company": "Fabrikam", "email": "kenji@fabrikam.com" }
    ```

    Pourquoi ces données sont-elles classées comme données semi-structurées ?
body:
  options:
    - { id: a, text: { en: "The values are stored in binary form.", fr: "Les valeurs sont stockées sous forme binaire." } }
    - { id: b, text: { en: "The two customers have the same fields.", fr: "Les deux clients ont les mêmes champs." } }
    - { id: c, text: { en: "The documents contain no named fields.", fr: "Les documents ne contiennent aucun champ nommé." } }
    - { id: d, text: { en: "The fields vary between the two customers.", fr: "Les champs varient entre les deux clients." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Both documents have a structure made of named fields, but not the same one: the first customer has a list of phone numbers and the second has a company. Structure that varies between the instances of an entity is what defines semi-structured data."
    fr: "Les deux documents ont une structure faite de champs nommés, mais pas la même : le premier client a une liste de numéros de téléphone et le second a une société. Une structure qui varie entre les instances d'une entité est ce qui définit les données semi-structurées."
  options:
    a:
      en: "JSON is readable text, and the way the values are encoded doesn't determine the category of the data."
      fr: "JSON est du texte lisible, et la façon dont les valeurs sont encodées ne détermine pas la catégorie des données."
    b:
      en: "The fields differ: only the first document has phones and only the second has company. Identical fields would describe structured data."
      fr: "Les champs diffèrent : seul le premier document a phones et seul le second a company. Des champs identiques décriraient des données structurées."
    c:
      en: "Every value has a name (name, email, phones, company); data without fields would be unstructured."
      fr: "Chaque valeur a un nom (name, email, phones, company) ; des données sans champs seraient non structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
