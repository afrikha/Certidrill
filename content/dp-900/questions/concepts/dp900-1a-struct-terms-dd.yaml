id: dp900-1a-struct-terms-dd
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each term to its description. To answer, drag the appropriate terms to the correct descriptions. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque terme à sa description. Pour répondre, faites glisser les termes appropriés vers les descriptions correspondantes. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: entity, text: { en: "Entity", fr: "Entité" } }
    - { id: attr, text: { en: "Attribute", fr: "Attribut" } }
    - { id: row, text: { en: "Row", fr: "Ligne" } }
    - { id: schema, text: { en: "Schema", fr: "Schéma" } }
    - { id: key, text: { en: "Key", fr: "Clé" } }
  targets:
    - id: t1
      text: { en: "Something that is important to an organization and about which data is recorded, such as a product", fr: "Ce qui est important pour une organisation et sur quoi des données sont enregistrées, par exemple un produit" }
    - id: t2
      text: { en: "The representation of one instance of a data entity in a table", fr: "La représentation d'une instance d'une entité de données dans une table" }
    - id: t3
      text: { en: "The definition of the fields that all the data of a structured data set shares", fr: "La définition des champs que partagent toutes les données d'un jeu de données structurées" }
answer:
  mapping: { t1: entity, t2: row, t3: schema }
explanation:
  correct:
    en: "An entity is something that matters to the organization, such as a customer or a product. In a tabular schema, each row represents one instance of the entity. The schema is the definition of the fields; in structured data it is fixed, so all the data has the same fields."
    fr: "Une entité est ce qui compte pour l'organisation, par exemple un client ou un produit. Dans un schéma tabulaire, chaque ligne représente une instance de l'entité. Le schéma est la définition des champs ; dans des données structurées, il est fixe : toutes les données ont donc les mêmes champs."
  options:
    attr:
      en: "An attribute is one characteristic of an entity, such as the price of a product; a column of the table represents it."
      fr: "Un attribut est une caractéristique d'une entité, comme le prix d'un produit ; une colonne de la table le représente."
    key:
      en: "A key is a value that identifies an instance so that other tables can reference it."
      fr: "Une clé est une valeur qui identifie une instance afin que d'autres tables puissent la référencer."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
