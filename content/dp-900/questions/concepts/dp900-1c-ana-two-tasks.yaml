id: dp900-1c-ana-two-tasks
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks are the responsibility of a data analyst?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches qui relèvent de la responsabilité d'un analyste de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Designing data stores for analytical workloads", fr: "Concevoir des magasins de données pour les charges de travail analytiques" }
    - id: b
      text: { en: "Designing and building analytical models", fr: "Concevoir et créer des modèles analytiques" }
    - id: c
      text: { en: "Implementing data ingestion pipelines", fr: "Implémenter des pipelines d'ingestion de données" }
    - id: d
      text: { en: "Processing raw data into insights for the business", fr: "Transformer des données brutes en informations pour l'entreprise" }
    - id: e
      text: { en: "Implementing backup and recovery policies", fr: "Mettre en œuvre des stratégies de sauvegarde et de récupération" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A data analyst designs and builds analytical models, and processes raw data into relevant insights based on the business requirements. The data stores and the pipelines that feed them come earlier in the chain and belong to another role.
    fr: |
      Un analyste de données conçoit et crée des modèles analytiques, et transforme les données brutes en informations pertinentes d'après les exigences métier. Les magasins de données et les pipelines qui les alimentent se situent plus tôt dans la chaîne et relèvent d'un autre rôle.
  options:
    a: { en: "The data stores for analytical workloads are designed and implemented by data engineers; the analyst builds models on top of them.", fr: "Les magasins de données des charges de travail analytiques sont conçus et implémentés par les ingénieurs de données ; l'analyste crée des modèles par-dessus." }
    c: { en: "Data ingestion pipelines are implemented by data engineers.", fr: "Les pipelines d'ingestion de données sont implémentés par les ingénieurs de données." }
    e: { en: "Backup and recovery policies are implemented by database administrators.", fr: "Les stratégies de sauvegarde et de récupération sont mises en œuvre par les administrateurs de base de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
