id: dp900-1c-ana-roles-match
objective: "1.4.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each data role to its description. To answer, drag the appropriate role to each description. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque rôle de données à sa description. Pour répondre, faites glisser le rôle approprié vers chaque description. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: eng, text: { en: "Data engineer", fr: "Ingénieur de données" } }
    - { id: ana, text: { en: "Data analyst", fr: "Analyste de données" } }
    - { id: ai, text: { en: "AI engineer", fr: "Ingénieur IA" } }
    - { id: dba, text: { en: "Database administrator", fr: "Administrateur de base de données" } }
  targets:
    - id: t1
      text: { en: "Explores and analyzes data to create visualizations and charts for decision-making", fr: "Explore et analyse les données pour créer des visualisations et des graphiques d'aide à la décision" }
    - id: t2
      text: { en: "Assigns permissions to users and stores backup copies of data", fr: "Attribue des autorisations aux utilisateurs et stocke des copies de sauvegarde des données" }
    - id: t3
      text: { en: "Applies data cleaning routines and implements pipelines between systems", fr: "Applique des routines de nettoyage des données et implémente des pipelines entre les systèmes" }
answer:
  mapping: { t1: ana, t2: dba, t3: eng }
explanation:
  correct:
    en: |
      Data analysts explore and analyze data to create the visualizations that support decisions. Database administrators manage databases: permissions, backup copies, and restores after a failure. Data engineers manage data integration: cleaning routines and pipelines that transfer and transform data between systems. The AI engineer, who builds AI-powered features, matches none of the descriptions.
    fr: |
      Les analystes de données explorent et analysent les données pour créer les visualisations qui aident à décider. Les administrateurs de base de données gèrent les bases de données : autorisations, copies de sauvegarde et restaurations après une défaillance. Les ingénieurs de données gèrent l'intégration des données : routines de nettoyage et pipelines qui transfèrent et transforment les données entre les systèmes. L'ingénieur IA, qui crée des fonctionnalités d'IA, ne correspond à aucune des descriptions.
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
