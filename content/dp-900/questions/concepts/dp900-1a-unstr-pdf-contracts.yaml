id: dp900-1a-unstr-pdf-contracts
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores thousands of signed contracts as PDF files. Each contract contains several pages of readable text.

    How should the contracts be classified?
  fr: |
    Proseware stocke des milliers de contrats signés sous forme de fichiers PDF. Chaque contrat contient plusieurs pages de texte lisible.

    Comment les contrats doivent-ils être classés ?
body:
  options:
    - { id: a, text: { en: "As structured data, because every contract is stored in the same file format", fr: "Comme données structurées, car tous les contrats sont stockés dans le même format de fichier" } }
    - { id: b, text: { en: "As semi-structured data, because the text of the contracts is readable", fr: "Comme données semi-structurées, car le texte des contrats est lisible" } }
    - { id: c, text: { en: "As unstructured data, because the content has no specific structure", fr: "Comme données non structurées, car le contenu n'a pas de structure spécifique" } }
    - { id: d, text: { en: "As semi-structured data, because each contract has a different content", fr: "Comme données semi-structurées, car chaque contrat a un contenu différent" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Documents are unstructured data: their content, even when it is readable text, isn't divided into fields that are the same for every item. Neither the file format nor the readability of the text gives the data a schema."
    fr: "Les documents sont des données non structurées : leur contenu, même s'il s'agit de texte lisible, n'est pas découpé en champs identiques pour tous les éléments. Ni le format de fichier ni la lisibilité du texte ne donnent un schéma aux données."
  options:
    a:
      en: "A common file format isn't a schema: the contracts have no fields shared by every record."
      fr: "Un format de fichier commun n'est pas un schéma : les contrats n'ont pas de champs partagés par tous les enregistrements."
    b:
      en: "Readable text isn't a structure; semi-structured data has named fields, as in a JSON document."
      fr: "Du texte lisible n'est pas une structure ; les données semi-structurées ont des champs nommés, comme dans un document JSON."
    d:
      en: "In semi-structured data the fields vary, but fields exist; the pages of a contract have none."
      fr: "Dans des données semi-structurées, les champs varient, mais ils existent ; les pages d'un contrat n'en ont pas."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
