id: dp900-1b-ds-nosql-match
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the type of database that it describes.

    To answer, drag the appropriate type of database to each description. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au type de base de données qu'elle décrit.

    Pour répondre, faites glisser le type de base de données approprié vers chaque description. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rel, text: { en: "Relational database", fr: "Base de données relationnelle" } }
    - { id: kv, text: { en: "Key-value database", fr: "Base de données clé-valeur" } }
    - { id: doc, text: { en: "Document database", fr: "Base de données de documents" } }
    - { id: cf, text: { en: "Column family database", fr: "Base de données de familles de colonnes" } }
    - { id: graph, text: { en: "Graph database", fr: "Base de données de graphes" } }
  targets:
    - id: t1
      text: { en: "Each record is a unique key and an associated value, which can be in any format.", fr: "Chaque enregistrement est une clé unique et une valeur associée, de n'importe quel format." }
    - id: t2
      text: { en: "Entities are stored as nodes, with links that define the relationships between them.", fr: "Les entités sont stockées sous forme de nœuds, avec des liens qui définissent les relations entre elles." }
    - id: t3
      text: { en: "Each value is a JSON document that the system is optimized to parse and query.", fr: "Chaque valeur est un document JSON que le système est optimisé pour analyser et interroger." }
answer:
  mapping: { t1: kv, t2: graph, t3: doc }
explanation:
  correct:
    en: "A key-value database stores a unique key with a value in any format. A graph database stores entities as nodes and the relationships between them as links. A document database is a form of key-value database whose values are JSON documents that it can parse and query."
    fr: "Une base de données clé-valeur stocke une clé unique avec une valeur de n'importe quel format. Une base de données de graphes stocke les entités sous forme de nœuds et les relations entre elles sous forme de liens. Une base de données de documents est une forme de base de données clé-valeur dont les valeurs sont des documents JSON qu'elle sait analyser et interroger."
  options:
    rel:
      en: "A relational database stores structured data in tables whose rows are identified by primary keys."
      fr: "Une base de données relationnelle stocke des données structurées dans des tables dont les lignes sont identifiées par des clés primaires."
    cf:
      en: "A column family database stores rows and columns in which the columns are divided into groups of related columns."
      fr: "Une base de données de familles de colonnes stocke des lignes et des colonnes dans lesquelles les colonnes sont réparties en groupes de colonnes liées."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
