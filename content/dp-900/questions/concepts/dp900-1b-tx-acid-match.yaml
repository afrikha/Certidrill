id: dp900-1b-tx-acid-match
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the property of transactions that it describes.

    To answer, drag the appropriate property to each description. Each property may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la propriété des transactions qu'elle décrit.

    Pour répondre, faites glisser la propriété appropriée vers chaque description. Chaque propriété peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: atom, text: { en: "Atomicity", fr: "Atomicité" } }
    - { id: cons, text: { en: "Consistency", fr: "Cohérence" } }
    - { id: isol, text: { en: "Isolation", fr: "Isolation" } }
    - { id: dura, text: { en: "Durability", fr: "Durabilité" } }
    - { id: norm, text: { en: "Normalization", fr: "Normalisation" } }
  targets:
    - id: t1
      text: { en: "A committed transaction stays committed, even if the database system is switched off and on again.", fr: "Une transaction validée reste validée, même si le système de base de données est arrêté puis redémarré." }
    - id: t2
      text: { en: "A transaction can only take the data from one valid state to another valid state.", fr: "Une transaction ne peut faire passer les données que d'un état valide à un autre état valide." }
    - id: t3
      text: { en: "Transactions that run at the same time don't interfere with one another.", fr: "Les transactions qui s'exécutent en même temps n'interfèrent pas les unes avec les autres." }
answer:
  mapping: { t1: dura, t2: cons, t3: isol }
explanation:
  correct:
    en: "Durability: once a transaction is committed, it remains committed. Consistency: transactions can only move the data from one valid state to another. Isolation: concurrent transactions can't interfere with one another."
    fr: "Durabilité : une fois validée, une transaction reste validée. Cohérence : les transactions ne peuvent faire passer les données que d'un état valide à un autre. Isolation : les transactions simultanées ne peuvent pas interférer les unes avec les autres."
  options:
    atom:
      en: "Atomicity means that a transaction is a single unit that succeeds completely or fails completely; none of the three descriptions says this."
      fr: "L'atomicité signifie qu'une transaction est une unité unique qui réussit entièrement ou échoue entièrement ; aucune des trois descriptions ne dit cela."
    norm:
      en: "Normalization is a way of designing relational tables that eliminates duplicate data values; it isn't a property of transactions."
      fr: "La normalisation est une façon de concevoir des tables relationnelles qui élimine les valeurs en double ; ce n'est pas une propriété des transactions."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
