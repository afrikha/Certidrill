id: dp900-1a-struct-new-attribute
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores its 2,000 employees in a table of a relational database. The company must now record a badge number, but only for the 150 employees who work in the warehouse.

    What is the effect of adding this attribute to the table?
  fr: |
    Fabrikam stocke ses 2 000 employés dans une table d'une base de données relationnelle. L'entreprise doit désormais enregistrer un numéro de badge, mais seulement pour les 150 employés qui travaillent à l'entrepôt.

    Quel est l'effet de l'ajout de cet attribut à la table ?
body:
  options:
    - { id: a, text: { en: "Only the 150 rows of the warehouse employees get a new column.", fr: "Seules les 150 lignes des employés de l'entrepôt reçoivent une nouvelle colonne." } }
    - { id: b, text: { en: "The table gets one new column, which is empty (NULL) in 1,850 rows.", fr: "La table reçoit une nouvelle colonne, vide (NULL) dans 1 850 lignes." } }
    - { id: c, text: { en: "The 150 rows of the warehouse employees move to a JSON file.", fr: "Les 150 lignes des employés de l'entrepôt sont déplacées dans un fichier JSON." } }
    - { id: d, text: { en: "The table gets 150 new columns, one for each warehouse employee.", fr: "La table reçoit 150 nouvelles colonnes, une par employé de l'entrepôt." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A table is structured data with a fixed schema: an attribute is a column, and every row has the same columns. Adding the badge number therefore adds one column to all 2,000 rows; it holds a value for the 150 warehouse employees and is empty (NULL) for the 1,850 others."
    fr: "Une table contient des données structurées dont le schéma est fixe : un attribut est une colonne, et toutes les lignes ont les mêmes colonnes. Ajouter le numéro de badge ajoute donc une colonne aux 2 000 lignes ; elle contient une valeur pour les 150 employés de l'entrepôt et reste vide (NULL) pour les 1 850 autres."
  options:
    a:
      en: "A column belongs to the table, not to some of its rows: all the rows share the same columns."
      fr: "Une colonne appartient à la table, pas à certaines de ses lignes : toutes les lignes partagent les mêmes colonnes."
    c:
      en: "A column that is empty for some rows is allowed, so nothing forces these employees out of the table."
      fr: "Une colonne vide pour certaines lignes est autorisée : rien n'oblige donc à sortir ces employés de la table."
    d:
      en: "A column represents an attribute, not an instance: one attribute means one column, whatever the number of employees."
      fr: "Une colonne représente un attribut, pas une instance : un attribut correspond à une colonne, quel que soit le nombre d'employés."
references:
