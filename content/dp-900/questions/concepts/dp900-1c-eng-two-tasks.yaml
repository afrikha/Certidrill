id: dp900-1c-eng-two-tasks
objective: "1.4.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two tasks are the responsibility of a data engineer?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches qui relèvent de la responsabilité d'un ingénieur de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Applying data cleaning routines to incoming data", fr: "Appliquer des routines de nettoyage aux données entrantes" }
    - id: b
      text: { en: "Storing backup copies of the data of a database", fr: "Stocker des copies de sauvegarde des données d'une base de données" }
    - id: c
      text: { en: "Designing data stores for analytical workloads", fr: "Concevoir des magasins de données pour les charges de travail analytiques" }
    - id: d
      text: { en: "Creating visualizations for decision-makers", fr: "Créer des visualisations pour les décideurs" }
    - id: e
      text: { en: "Assigning permissions to the users of a database", fr: "Attribuer des autorisations aux utilisateurs d'une base de données" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A data engineer designs and implements data workloads: data ingestion pipelines, cleansing and transformation activities, and the data stores for analytical workloads. Cleaning incoming data and designing analytical data stores both belong to this role.
    fr: |
      Un ingénieur de données conçoit et implémente les charges de travail de données : pipelines d'ingestion de données, activités de nettoyage et de transformation, et magasins de données pour les charges de travail analytiques. Le nettoyage des données entrantes et la conception des magasins de données analytiques relèvent tous deux de ce rôle.
  options:
    b: { en: "Storing backup copies of data is the work of a database administrator.", fr: "Le stockage de copies de sauvegarde des données est le travail d'un administrateur de base de données." }
    d: { en: "Creating visualizations that support decisions is the work of a data analyst.", fr: "La création de visualisations qui aident à décider est le travail d'un analyste de données." }
    e: { en: "Assigning permissions to database users is the work of a database administrator.", fr: "L'attribution d'autorisations aux utilisateurs d'une base de données est le travail d'un administrateur de base de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
