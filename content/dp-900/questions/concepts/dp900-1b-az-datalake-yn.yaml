id: dp900-1b-az-datalake-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to host a data lake in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'héberger un lac de données dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Enabling the hierarchical namespace organizes the blobs of a storage account into directories and subdirectories.
        fr: L'activation de l'espace de noms hiérarchique organise les objets blob d'un compte de stockage en répertoires et sous-répertoires.
    - id: s2
      text:
        en: To create the data lake, Contoso must provision a dedicated service that is separate from Azure Storage.
        fr: Pour créer le lac de données, Contoso doit provisionner un service dédié, distinct de Stockage Azure.
    - id: s3
      text:
        en: The data lake can store structured data and unstructured data in their native format.
        fr: Le lac de données peut stocker des données structurées et des données non structurées dans leur format natif.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Azure Data Lake Storage is a set of capabilities built on Azure Blob Storage, not a separate service or account type: you get it by enabling the hierarchical namespace on a storage account. That setting organizes the objects into a hierarchy of directories, like a file system. The resulting data lake holds structured and unstructured data in raw or native format."
    fr: "Azure Data Lake Storage est un ensemble de fonctionnalités bâties sur le Stockage Blob Azure, et non un service ou un type de compte distinct : vous l'obtenez en activant l'espace de noms hiérarchique sur un compte de stockage. Ce paramètre organise les objets dans une hiérarchie de répertoires, comme un système de fichiers. Le lac de données obtenu contient des données structurées et non structurées au format brut ou natif."
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
