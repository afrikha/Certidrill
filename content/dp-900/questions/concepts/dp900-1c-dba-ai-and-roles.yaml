id: dp900-1c-dba-ai-and-roles
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Integrating large language models into applications is a core responsibility of the database administrator.
        fr: L'intégration de grands modèles de langage dans des applications est une responsabilité essentielle de l'administrateur de base de données.
    - id: s2
      text:
        en: AI tools can help a database administrator troubleshoot performance issues and draft queries from natural language.
        fr: Les outils d'IA peuvent aider un administrateur de base de données à résoudre des problèmes de performances et à rédiger des requêtes en langage naturel.
    - id: s3
      text:
        en: In an organization, the same person can act as a database administrator and as a data engineer.
        fr: Dans une organisation, la même personne peut agir en tant qu'administrateur de base de données et en tant qu'ingénieur de données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Building and integrating AI-powered features with large language models is the work of an AI engineer. Database administrators increasingly use AI tools to troubleshoot performance and draft queries, alongside their own judgment and expertise. Roles describe tasks and responsibilities, so one person can perform more than one of them.
    fr: |
      Créer et intégrer des fonctionnalités d'IA avec de grands modèles de langage est le travail d'un ingénieur IA. Les administrateurs de base de données utilisent de plus en plus les outils d'IA pour résoudre les problèmes de performances et rédiger des requêtes, en complément de leur jugement et de leur expertise. Les rôles décrivent des tâches et des responsabilités : une même personne peut donc en tenir plusieurs.
  options:
    s1: { en: "This describes the AI engineer, who works with large language models and machine learning pipelines.", fr: "Cette description correspond à l'ingénieur IA, qui travaille avec de grands modèles de langage et des pipelines d'apprentissage automatique." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
