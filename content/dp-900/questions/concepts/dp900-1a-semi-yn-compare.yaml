id: dp900-1a-semi-yn-compare
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Semi-structured data is more flexible than structured data in the fields that each item contains."
        fr: "Les données semi-structurées offrent plus de souplesse que les données structurées quant aux champs que contient chaque élément."
    - id: s2
      text:
        en: "An image file is an example of semi-structured data."
        fr: "Un fichier image est un exemple de données semi-structurées."
    - id: s3
      text:
        en: "In a JSON document, each attribute is written as a name and a value."
        fr: "Dans un document JSON, chaque attribut s'écrit sous la forme d'un nom et d'une valeur."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Structured data imposes the same fields on every record, whereas semi-structured data lets the fields vary between items. An image has no fields: it is unstructured data. JSON represents attributes as name-value pairs, which is why each document can carry its own fields."
    fr: "Les données structurées imposent les mêmes champs à tous les enregistrements, alors que les données semi-structurées laissent les champs varier d'un élément à l'autre. Une image n'a pas de champs : ce sont des données non structurées. JSON représente les attributs par des paires nom-valeur, ce qui permet à chaque document de porter ses propres champs."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
