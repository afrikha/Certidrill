id: dp900-1b-az-service-kind-match
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each Azure service to the kind of data store that it provides.

    To answer, drag the appropriate kind of data store to each service. Each kind may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque service Azure au type de magasin de données qu'il fournit.

    Pour répondre, faites glisser le type de magasin de données approprié vers chaque service. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rel, text: { en: "Relational database", fr: "Base de données relationnelle" } }
    - { id: nosql, text: { en: "Non-relational (NoSQL) database", fr: "Base de données non relationnelle (NoSQL)" } }
    - { id: share, text: { en: "Network file shares", fr: "Partages de fichiers réseau" } }
    - { id: lake, text: { en: "Data lake", fr: "Lac de données" } }
  targets:
    - { id: t1, text: "Azure Files" }
    - { id: t2, text: { en: "Azure Blob Storage with a hierarchical namespace", fr: "Stockage Blob Azure avec un espace de noms hiérarchique" } }
    - { id: t3, text: "Azure Cosmos DB" }
answer:
  mapping: { t1: share, t2: lake, t3: nosql }
explanation:
  correct:
    en: "Azure Files provides network file shares like those of a corporate network. Blob storage with a hierarchical namespace, which organizes files in folders, is how data lakes are hosted in Azure Storage. Azure Cosmos DB is a global-scale non-relational (NoSQL) database system."
    fr: "Azure Files fournit des partages de fichiers réseau comme ceux d'un réseau d'entreprise. Le stockage Blob doté d'un espace de noms hiérarchique, qui organise les fichiers en dossiers, est la façon d'héberger des lacs de données dans Stockage Azure. Azure Cosmos DB est un système de base de données non relationnelle (NoSQL) à l'échelle mondiale."
  options:
    rel:
      en: "Relational databases in Azure are provided by Azure SQL and by the services for open-source engines, such as Azure Database for MySQL and Azure Database for PostgreSQL."
      fr: "Dans Azure, les bases de données relationnelles sont fournies par Azure SQL et par les services pour moteurs open source, comme Azure Database pour MySQL et Azure Database pour PostgreSQL."
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
