id: dp900-1b-ds-column-family
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys stores customer data in rows and columns. The columns are divided into two groups of logically related columns: one group holds the identity details and the other holds the contact details.

    Which type of data store is described?
  fr: |
    Wingtip Toys stocke les données de ses clients en lignes et en colonnes. Les colonnes sont réparties en deux groupes de colonnes logiquement liées : un groupe contient les informations d'identité et l'autre les coordonnées.

    Quel type de magasin de données est décrit ?
body:
  options:
    - { id: a, text: { en: "A column family database", fr: "Une base de données de familles de colonnes" } }
    - { id: b, text: { en: "A relational database", fr: "Une base de données relationnelle" } }
    - { id: c, text: { en: "A document database", fr: "Une base de données de documents" } }
    - { id: d, text: { en: "A key-value database", fr: "Une base de données clé-valeur" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A column family database stores tabular data made of rows and columns, but the columns can be divided into groups called column families. Each column family holds a set of columns that are logically related, such as the identity details or the contact details of a customer."
    fr: "Une base de données de familles de colonnes stocke des données tabulaires faites de lignes et de colonnes, mais les colonnes peuvent être réparties en groupes appelés familles de colonnes. Chaque famille de colonnes contient un ensemble de colonnes logiquement liées, comme les informations d'identité ou les coordonnées d'un client."
  options:
    b:
      en: "A relational database also uses rows and columns, but it organizes data in tables linked by keys, not in groups of columns inside a row."
      fr: "Une base de données relationnelle utilise aussi des lignes et des colonnes, mais elle organise les données en tables reliées par des clés, pas en groupes de colonnes à l'intérieur d'une ligne."
    c:
      en: "A document database stores each record as a JSON document, not as a row of grouped columns."
      fr: "Une base de données de documents stocke chaque enregistrement sous forme de document JSON, pas sous forme de ligne dont les colonnes sont regroupées."
    d:
      en: "A key-value database stores a unique key and a single associated value, with no column structure."
      fr: "Une base de données clé-valeur stocke une clé unique et une seule valeur associée, sans structure en colonnes."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
