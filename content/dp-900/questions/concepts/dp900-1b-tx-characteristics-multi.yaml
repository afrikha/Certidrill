id: dp900-1b-tx-characteristics-multi
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two characteristics describe a transactional workload?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux caractéristiques qui décrivent une charge de travail transactionnelle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data is loaded periodically from other systems.", fr: "Les données sont chargées périodiquement à partir d'autres systèmes." } }
    - { id: b, text: { en: "Many small units of work must be processed quickly.", fr: "De nombreuses petites unités de travail doivent être traitées rapidement." } }
    - { id: c, text: { en: "The system is read-only or read-mostly.", fr: "Le système est en lecture seule ou principalement en lecture." } }
    - { id: d, text: { en: "Operations are applied in a way that protects data integrity.", fr: "Les opérations sont appliquées d'une façon qui protège l'intégrité des données." } }
    - { id: e, text: { en: "The data is aggregated in advance for summary queries.", fr: "Les données sont agrégées à l'avance pour les requêtes de synthèse." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Transactional systems are often high-volume: they handle very large numbers of small, discrete units of work, and the data must be accessible quickly. The create, retrieve, update and delete operations are applied transactionally, in a way that ensures the integrity of the stored data (ACID semantics)."
    fr: "Les systèmes transactionnels ont souvent un volume élevé : ils traitent un très grand nombre de petites unités de travail distinctes, et les données doivent être accessibles rapidement. Les opérations de création, de récupération, de mise à jour et de suppression sont appliquées de façon transactionnelle, d'une manière qui garantit l'intégrité des données stockées (sémantique ACID)."
  options:
    a:
      en: "Periodic loading from other systems describes an analytical data store, which receives copies of the data that transactional systems produce."
      fr: "Le chargement périodique à partir d'autres systèmes décrit un magasin de données analytique, qui reçoit des copies des données produites par les systèmes transactionnels."
    c:
      en: "Read-only or read-mostly systems are used for analytical processing; a transactional system writes as much as it reads."
      fr: "Les systèmes en lecture seule ou principalement en lecture servent au traitement analytique ; un système transactionnel écrit autant qu'il lit."
    e:
      en: "Data aggregated in advance describes a semantic model, which is an analytical data store."
      fr: "Des données agrégées à l'avance décrivent un modèle sémantique, qui est un magasin de données analytique."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
