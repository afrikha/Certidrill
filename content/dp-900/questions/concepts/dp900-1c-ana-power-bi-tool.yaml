id: dp900-1c-ana-power-bi-tool
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data analyst at Contoso needs to connect to several data sources, build interactive reports and dashboards, and share them across the organization.

    Which tool should the data analyst use?
  fr: |
    Un analyste de données de Contoso doit se connecter à plusieurs sources de données, créer des rapports et des tableaux de bord interactifs, et les partager dans toute l'organisation.

    Quel outil l'analyste de données doit-il utiliser ?
body:
  options:
    - id: a
      text: Azure Data Factory
    - id: b
      text: Power BI
    - id: c
      text: Microsoft Purview
    - id: d
      text: Azure Stream Analytics
answer: { optionId: b }
explanation:
  correct:
    en: |
      Power BI is the business intelligence and data visualization platform of Microsoft. Data analysts use it to connect to data sources, build interactive reports and dashboards, and share insights across the organization.
    fr: |
      Power BI est la plateforme de décisionnel et de visualisation des données de Microsoft. Les analystes de données l'utilisent pour se connecter aux sources de données, créer des rapports et des tableaux de bord interactifs, et partager leurs analyses dans toute l'organisation.
  options:
    a: { en: "Azure Data Factory defines and schedules data pipelines; it is a data engineer tool and creates no reports.", fr: "Azure Data Factory définit et planifie des pipelines de données ; c'est un outil d'ingénieur de données, qui ne crée aucun rapport." }
    c: { en: "Microsoft Purview is a data governance solution, used to map data and track its lineage.", fr: "Microsoft Purview est une solution de gouvernance des données, qui sert à cartographier les données et à suivre leur traçabilité." }
    d: { en: "Azure Stream Analytics processes streams of data in real time; it does not build reports and dashboards.", fr: "Azure Stream Analytics traite des flux de données en temps réel ; il ne crée ni rapports ni tableaux de bord." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
  - title: What is Power BI?
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/power-bi-overview
