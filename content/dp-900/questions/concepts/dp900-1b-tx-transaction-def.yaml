id: dp900-1b-tx-transaction-def
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a transactional system, what is a transaction?
  fr: |
    Dans un système transactionnel, qu'est-ce qu'une transaction ?
body:
  options:
    - { id: a, text: { en: "A snapshot of the data at a given point in time", fr: "Un instantané des données à un moment donné" } }
    - { id: b, text: { en: "A numeric value aggregated across several dimensions", fr: "Une valeur numérique agrégée selon plusieurs dimensions" } }
    - { id: c, text: { en: "A scheduled process that loads data into a data warehouse", fr: "Un processus planifié qui charge des données dans un entrepôt de données" } }
    - { id: d, text: { en: "A small, discrete unit of work that records a specific event", fr: "Une petite unité de travail distincte qui enregistre un événement précis" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A transaction is a small, discrete unit of work that captures a specific event the organization wants to track, such as a payment for goods or a transfer of money between two accounts. Transactional systems record very large numbers of these events."
    fr: "Une transaction est une petite unité de travail distincte qui consigne un événement précis que l'organisation veut suivre, comme le paiement d'une marchandise ou un virement entre deux comptes. Les systèmes transactionnels enregistrent ces événements en très grand nombre."
  options:
    a:
      en: "Snapshots of data at a point in time are what analytical processing is based on."
      fr: "Les instantanés des données à un moment donné sont ce sur quoi s'appuie le traitement analytique."
    b:
      en: "A numeric value aggregated across dimensions is a measure in an analytical model."
      fr: "Une valeur numérique agrégée selon des dimensions est une mesure dans un modèle analytique."
    c:
      en: "A process that loads data into a data warehouse is an ETL or ELT process, which belongs to analytical solutions."
      fr: "Un processus qui charge des données dans un entrepôt de données est un processus ETL ou ELT, qui relève des solutions analytiques."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
