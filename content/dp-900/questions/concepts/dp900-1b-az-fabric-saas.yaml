id: dp900-1b-az-fabric-saas
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys wants a single analytics platform that is delivered as software as a service (SaaS). All the analytics data of the organization must be kept in one shared data lake that is provided automatically, with no storage infrastructure to manage.

    What should Wingtip Toys use?
  fr: |
    Wingtip Toys veut une plateforme d'analytique unique, fournie sous forme de logiciel en tant que service (SaaS). Toutes les données analytiques de l'organisation doivent être conservées dans un lac de données partagé, fourni automatiquement, sans infrastructure de stockage à gérer.

    Que doit utiliser Wingtip Toys ?
body:
  options:
    - { id: a, text: "Azure Databricks" }
    - { id: b, text: "Microsoft Fabric" }
    - { id: c, text: "Azure Data Lake Storage" }
    - { id: d, text: "Azure Cosmos DB" }
answer: { optionId: b }
explanation:
  correct:
    en: "Microsoft Fabric is Microsoft's unified SaaS analytics platform: it brings data engineering, data warehousing, real-time analytics, data science and Power BI together on a shared storage layer called OneLake. Every Fabric tenant automatically includes one OneLake, with no infrastructure to provision or manage."
    fr: "Microsoft Fabric est la plateforme d'analytique SaaS unifiée de Microsoft : elle réunit l'ingénierie des données, l'entreposage de données, l'analytique en temps réel, la science des données et Power BI sur une couche de stockage partagée appelée OneLake. Chaque locataire Fabric comprend automatiquement un OneLake, sans infrastructure à provisionner ni à gérer."
  options:
    a:
      en: "Azure Databricks is an analytics platform built on Apache Spark that runs as a managed service in your Azure subscription; it doesn't come with an automatically provided, organization-wide data lake."
      fr: "Azure Databricks est une plateforme d'analytique fondée sur Apache Spark qui s'exécute comme service managé dans votre abonnement Azure ; elle n'est pas fournie avec un lac de données automatique pour toute l'organisation."
    c:
      en: "Azure Data Lake Storage is a data lake that you create in a storage account; it is a store, not an analytics platform delivered as SaaS."
      fr: "Azure Data Lake Storage est un lac de données que vous créez dans un compte de stockage ; c'est un magasin, pas une plateforme d'analytique fournie en SaaS."
    d:
      en: "Azure Cosmos DB is a non-relational database for operational data, not an analytics platform."
      fr: "Azure Cosmos DB est une base de données non relationnelle pour des données opérationnelles, pas une plateforme d'analytique."
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
  - title: What is OneLake?
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview
