id: dp900-1a-fmt-yn-delta
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Delta Lake builds on the Parquet format."
        fr: "Delta Lake s'appuie sur le format Parquet."
    - id: s2
      text:
        en: "Delta Lake is a proprietary format that only Microsoft services can read."
        fr: "Delta Lake est un format propriétaire que seuls les services Microsoft peuvent lire."
    - id: s3
      text:
        en: "Delta Lake enables data versioning."
        fr: "Delta Lake permet la gestion des versions des données."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Delta Lake is an open-source storage format that builds on Parquet. It adds a transaction log to the files of a data lake, which enables ACID transactions, data versioning and reliable updates."
    fr: "Delta Lake est un format de stockage open source qui s'appuie sur Parquet. Il ajoute un journal des transactions aux fichiers d'un lac de données, ce qui permet les transactions ACID, la gestion des versions des données et des mises à jour fiables."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
  - title: "What is Delta Lake in Azure Databricks?"
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/
