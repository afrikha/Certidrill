id: dp900-1b-an-steps-ordering
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans an enterprise analytics solution that uses a data lake, a data warehouse and a semantic model to analyze the data of its operational systems.

    Which four stages occur in sequence? To answer, move the appropriate stages from the list of stages to the answer area and arrange them in the correct order.
  fr: |
    Contoso prévoit une solution d'analytique d'entreprise qui utilise un lac de données, un entrepôt de données et un modèle sémantique pour analyser les données de ses systèmes opérationnels.

    Quelles sont les quatre étapes qui se déroulent dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: report, text: { en: "Query the semantic model to produce reports and dashboards.", fr: "Interroger le modèle sémantique pour produire des rapports et des tableaux de bord." } }
    - { id: writeback, text: { en: "Write the aggregated values back to the operational systems.", fr: "Réécrire les valeurs agrégées dans les systèmes opérationnels." } }
    - { id: ingest, text: { en: "Extract the data from the operational systems and load it into the data lake.", fr: "Extraire les données des systèmes opérationnels et les charger dans le lac de données." } }
    - { id: aggregate, text: { en: "Aggregate the data of the data warehouse and load it into the semantic model.", fr: "Agréger les données de l'entrepôt de données et les charger dans le modèle sémantique." } }
    - { id: purge, text: { en: "Delete the extracted data from the operational systems.", fr: "Supprimer des systèmes opérationnels les données extraites." } }
    - { id: structure, text: { en: "Load the data of the data lake into a schema of tables in the data warehouse.", fr: "Charger les données du lac de données dans un schéma de tables de l'entrepôt de données." } }
answer:
  sequence: [ ingest, structure, aggregate, report ]
explanation:
  correct:
    en: |
      Operational data is first extracted, transformed and loaded (ETL, or ELT) into a data lake. It is then loaded into a schema of tables, here in a data warehouse. The data of the warehouse is aggregated and loaded into a semantic model, and finally the model is queried to produce reports, visualizations and dashboards.
    fr: |
      Les données opérationnelles sont d'abord extraites, transformées et chargées (ETL, ou ELT) dans un lac de données. Elles sont ensuite chargées dans un schéma de tables, ici dans un entrepôt de données. Les données de l'entrepôt sont agrégées et chargées dans un modèle sémantique, et enfin le modèle est interrogé pour produire des rapports, des visualisations et des tableaux de bord.
  options:
    writeback: { en: "An analytical solution reads a copy of the operational data; it doesn't write its aggregations back to the systems that record the transactions.", fr: "Une solution analytique lit une copie des données opérationnelles ; elle ne réécrit pas ses agrégations dans les systèmes qui enregistrent les transactions." }
    purge: { en: "Extraction copies the data: the operational systems keep the records that the line-of-business applications need.", fr: "L'extraction copie les données : les systèmes opérationnels conservent les enregistrements dont les applications métier ont besoin." }
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
