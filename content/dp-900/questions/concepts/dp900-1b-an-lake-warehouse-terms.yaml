id: dp900-1b-an-lake-warehouse-terms
objective: "1.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A [[files]] is used when a large volume of file-based data must be collected and analyzed. A [[tables]] stores data in a relational schema that is optimized for read operations, mainly the queries that support reporting and data visualization.
    fr: |
      Un [[files]] est utilisé lorsqu'un grand volume de données sous forme de fichiers doit être collecté et analysé. Un [[tables]] stocke les données dans un schéma relationnel optimisé pour les opérations de lecture, principalement les requêtes qui alimentent les rapports et la visualisation des données.
  slots:
    - id: files
      options:
        - { id: dw, text: { en: "data warehouse", fr: "entrepôt de données" } }
        - { id: dl, text: { en: "data lake", fr: "lac de données" } }
        - { id: sm, text: { en: "semantic model", fr: "modèle sémantique" } }
        - { id: tx, text: { en: "transactional system", fr: "système transactionnel" } }
    - id: tables
      options:
        - { id: dw, text: { en: "data warehouse", fr: "entrepôt de données" } }
        - { id: dl, text: { en: "data lake", fr: "lac de données" } }
        - { id: sm, text: { en: "semantic model", fr: "modèle sémantique" } }
        - { id: tx, text: { en: "transactional system", fr: "système transactionnel" } }
answer:
  values: { files: dl, tables: dw }
explanation:
  correct:
    en: "Data lakes are common in large-scale analytical processing, where a large volume of file-based data must be collected and analyzed. Data warehouses are an established way to store data in a relational schema optimized for read operations, primarily queries that support reporting and data visualization."
    fr: "Les lacs de données sont courants dans le traitement analytique à grande échelle, où un grand volume de données sous forme de fichiers doit être collecté et analysé. Les entrepôts de données sont un moyen éprouvé de stocker des données dans un schéma relationnel optimisé pour les opérations de lecture, principalement les requêtes qui alimentent les rapports et la visualisation des données."
  options:
    sm:
      en: "A semantic model holds data that is aggregated in advance across dimensions; it is neither file-based storage nor a relational schema of tables."
      fr: "Un modèle sémantique contient des données agrégées à l'avance selon des dimensions ; ce n'est ni un stockage à base de fichiers ni un schéma relationnel de tables."
    tx:
      en: "A transactional system records business events and is optimized for both reads and writes, not for analysis."
      fr: "Un système transactionnel enregistre des événements métier et est optimisé pour les lectures comme pour les écritures, pas pour l'analyse."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
