id: dp900-1b-az-cosmos-global
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is building a game whose players are located all over the world. The player profiles are JSON documents. The data must be replicated to several Azure regions, and each region must accept writes.

    Which Azure data store should Proseware use?
  fr: |
    Proseware crée un jeu dont les joueurs sont répartis dans le monde entier. Les profils des joueurs sont des documents JSON. Les données doivent être répliquées dans plusieurs régions Azure, et chaque région doit accepter les écritures.

    Quel magasin de données Azure Proseware doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure SQL Database" }
    - { id: b, text: "Azure Cosmos DB" }
    - { id: c, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: d, text: "Azure Files" }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Cosmos DB is a global-scale non-relational (NoSQL) database that can store data as JSON documents, key-value pairs, column families and graphs. It can distribute the data to any Azure region and supports multi-region writes, which suits latency-sensitive, globally distributed workloads such as games."
    fr: "Azure Cosmos DB est une base de données non relationnelle (NoSQL) à l'échelle mondiale, capable de stocker des données sous forme de documents JSON, de paires clé-valeur, de familles de colonnes et de graphes. Elle peut distribuer les données dans n'importe quelle région Azure et prend en charge les écritures multirégions, ce qui convient aux charges de travail distribuées mondialement et sensibles à la latence, comme les jeux."
  options:
    a:
      en: "Azure SQL Database is a relational database; it isn't the store designed for JSON documents written in several regions."
      fr: "Azure SQL Database est une base de données relationnelle ; ce n'est pas le magasin conçu pour des documents JSON écrits dans plusieurs régions."
    c:
      en: "Azure Table storage is a key-value store of a storage account; it doesn't offer global distribution with writes in several regions."
      fr: "Le Stockage Table Azure est un magasin clé-valeur d'un compte de stockage ; il n'offre pas de distribution mondiale avec des écritures dans plusieurs régions."
    d:
      en: "Azure Files provides network file shares, not a database of JSON documents."
      fr: "Azure Files fournit des partages de fichiers réseau, pas une base de données de documents JSON."
references:
  - title: Azure Cosmos DB - Database for the AI Era
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/introduction
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
