id: dp900-1a-fmt-delta-scenario
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores sales data as files in a data lake. Queries read only a few columns of very large files. The data engineering team must also apply reliable updates by using ACID transactions and keep versions of the data.

    Which file format meets these requirements?
  fr: |
    Fabrikam stocke des données de ventes sous forme de fichiers dans un lac de données. Les requêtes ne lisent que quelques colonnes de fichiers très volumineux. L'équipe d'ingénierie des données doit en outre appliquer des mises à jour fiables au moyen de transactions ACID et conserver les versions des données.

    Quel format de fichier répond à ces besoins ?
body:
  options:
    - { id: a, text: "Delta Lake" }
    - { id: b, text: "Parquet" }
    - { id: c, text: "Avro" }
    - { id: d, text: "CSV" }
answer: { optionId: a }
explanation:
  correct:
    en: "Delta Lake builds on Parquet, so the data keeps a columnar layout that suits queries on a few columns. It adds a transaction log to the files of the data lake, which enables ACID transactions, data versioning and reliable updates."
    fr: "Delta Lake s'appuie sur Parquet : les données conservent donc une organisation en colonnes adaptée aux requêtes sur quelques colonnes. Il ajoute un journal des transactions aux fichiers du lac de données, ce qui permet les transactions ACID, la gestion des versions des données et des mises à jour fiables."
  options:
    b:
      en: "Parquet alone gives the columnar layout, but it has no transaction log for ACID transactions and data versioning."
      fr: "Parquet seul apporte l'organisation en colonnes, mais il n'a pas de journal des transactions pour les transactions ACID et la gestion des versions des données."
    c:
      en: "Avro is row-based and has no transaction log: it meets neither requirement."
      fr: "Avro est orienté ligne et n'a pas de journal des transactions : il ne répond à aucun des deux besoins."
    d:
      en: "CSV is delimited text read line by line; it offers neither columnar access nor transactions."
      fr: "Le CSV est du texte délimité lu ligne par ligne ; il n'offre ni accès par colonne ni transactions."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
  - title: "What is Delta Lake in Azure Databricks?"
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/
