id: dp900-1b-tx-scenario-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following workloads, select **Yes** if the workload is transactional. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des charges de travail suivantes, sélectionnez **Oui** si la charge de travail est transactionnelle. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An airline website reserves a seat when a customer books a flight.
        fr: Le site web d'une compagnie aérienne réserve un siège lorsqu'un client achète un vol.
    - id: s2
      text:
        en: An ATM records a cash withdrawal and updates the balance of the account.
        fr: Un distributeur automatique de billets enregistre un retrait d'espèces et met à jour le solde du compte.
    - id: s3
      text:
        en: A report compares the total sales of each region over the last three years.
        fr: Un rapport compare le total des ventes de chaque région sur les trois dernières années.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Reserving a seat and recording a withdrawal are small, discrete units of work that record a business event and change the stored data as it happens: they are transactional. Comparing three years of sales by region only reads and aggregates historical data, which is an analytical workload."
    fr: "Réserver un siège et enregistrer un retrait sont de petites unités de travail distinctes qui consignent un événement métier et modifient les données stockées au moment où il se produit : elles sont transactionnelles. Comparer trois ans de ventes par région ne fait que lire et agréger des données historiques : c'est une charge de travail analytique."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
