id: dp900-1a-fmt-delimited-choice
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso must share a list of structured customer records with many partners. A wide range of applications and services must be able to read the file, and people must be able to read it in a text editor.

    Which file format should Contoso use?
  fr: |
    Contoso doit partager une liste d'enregistrements structurés de clients avec de nombreux partenaires. Un large éventail d'applications et de services doit pouvoir lire le fichier, et des personnes doivent pouvoir le lire dans un éditeur de texte.

    Quel format de fichier Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Avro" }
    - { id: b, text: { en: "Delimited text", fr: "Texte délimité" } }
    - { id: c, text: "Parquet" }
    - { id: d, text: "Delta Lake" }
answer: { optionId: b }
explanation:
  correct:
    en: "Delimited text, such as a CSV file, is a good choice for structured data that a wide range of applications and services must access in a human-readable format. It is plain text: each line is a record, and a delimiter separates the fields."
    fr: "Le texte délimité, par exemple un fichier CSV, est un bon choix pour des données structurées auxquelles un large éventail d'applications et de services doit accéder dans un format lisible par l'homme. C'est du texte brut : chaque ligne est un enregistrement, et un délimiteur sépare les champs."
  options:
    a:
      en: "Avro stores the records as binary data, which a person can't read in a text editor."
      fr: "Avro stocke les enregistrements sous forme binaire, qu'une personne ne peut pas lire dans un éditeur de texte."
    c:
      en: "Parquet is an optimized columnar format meant for efficient storage and processing, not for reading by people."
      fr: "Parquet est un format optimisé en colonnes, conçu pour un stockage et un traitement efficaces, pas pour être lu par des personnes."
    d:
      en: "Delta Lake builds on Parquet files and adds a transaction log; it is an optimized format too."
      fr: "Delta Lake s'appuie sur des fichiers Parquet et y ajoute un journal des transactions ; c'est aussi un format optimisé."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
