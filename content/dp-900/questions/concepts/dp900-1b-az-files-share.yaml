id: dp900-1b-az-files-share
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders wants to replace an on-premises file server. Users must be able to map the new storage as a network drive by using the SMB protocol.

    Which Azure data store should Northwind Traders use?
  fr: |
    Northwind Traders veut remplacer un serveur de fichiers local. Les utilisateurs doivent pouvoir mapper le nouveau stockage comme lecteur réseau à l'aide du protocole SMB.

    Quel magasin de données Azure Northwind Traders doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: b, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: c, text: "Azure Files" }
    - { id: d, text: "Azure Cosmos DB" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Files provides fully managed file shares in the cloud, like the network file shares of a corporate network. The shares are accessed through the SMB protocol (or NFS), so they can replace or supplement an on-premises file server."
    fr: "Azure Files fournit des partages de fichiers entièrement managés dans le cloud, comme les partages de fichiers réseau d'un réseau d'entreprise. On y accède par le protocole SMB (ou NFS) : ils peuvent donc remplacer ou compléter un serveur de fichiers local."
  options:
    a:
      en: "Azure Blob Storage stores binary objects in containers; it isn't the service that offers SMB file shares."
      fr: "Le Stockage Blob Azure stocke des objets binaires dans des conteneurs ; ce n'est pas le service qui propose des partages de fichiers SMB."
    b:
      en: "Azure Table storage is a key-value store for application data, not a file share."
      fr: "Le Stockage Table Azure est un magasin clé-valeur pour des données d'application, pas un partage de fichiers."
    d:
      en: "Azure Cosmos DB is a non-relational database for application data, not a file share."
      fr: "Azure Cosmos DB est une base de données non relationnelle pour des données d'application, pas un partage de fichiers."
references:
  - title: What is Azure Files?
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
