id: dp900-1a-struct-yn-basics
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A table of products in which every product has the same columns is structured data."
        fr: "Une table de produits dans laquelle tous les produits ont les mêmes colonnes constitue des données structurées."
    - id: s2
      text:
        en: "In structured data, the fields can vary from one record to another."
        fr: "Dans des données structurées, les champs peuvent varier d'un enregistrement à l'autre."
    - id: s3
      text:
        en: "Structured data is often stored in a relational database."
        fr: "Les données structurées sont souvent stockées dans une base de données relationnelle."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Structured data adheres to a fixed schema, so every record has the same fields, as in a table where all the products have the same columns. Fields that vary between records are the mark of semi-structured data. Structured data is often stored in a database in which tables reference one another through key values, that is, a relational database."
    fr: "Les données structurées respectent un schéma fixe : tous les enregistrements ont les mêmes champs, comme dans une table où tous les produits ont les mêmes colonnes. Des champs qui varient d'un enregistrement à l'autre caractérisent les données semi-structurées. Les données structurées sont souvent stockées dans une base de données où les tables se référencent par des valeurs de clé, c'est-à-dire une base de données relationnelle."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
