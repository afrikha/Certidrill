id: dp900-1c-ana-role-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A data analyst assigns permissions to the users of a database.
        fr: Un analyste de données attribue des autorisations aux utilisateurs d'une base de données.
    - id: s2
      text:
        en: A data analyst creates visualizations and charts that enable an organization to make informed decisions.
        fr: Un analyste de données crée des visualisations et des graphiques qui permettent à une organisation de prendre des décisions éclairées.
    - id: s3
      text:
        en: A data analyst implements the pipelines that transfer data between systems.
        fr: Un analyste de données implémente les pipelines qui transfèrent les données entre les systèmes.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A data analyst explores and analyzes data to create visualizations and charts that enable organizations to make informed decisions. Assigning permissions to users is the work of a database administrator, and implementing pipelines between systems is the work of a data engineer.
    fr: |
      Un analyste de données explore et analyse les données pour créer des visualisations et des graphiques qui permettent aux organisations de prendre des décisions éclairées. L'attribution d'autorisations aux utilisateurs est le travail d'un administrateur de base de données, et l'implémentation de pipelines entre les systèmes est le travail d'un ingénieur de données.
  options:
    s1: { en: "Assigning permissions to users is a database administrator task.", fr: "L'attribution d'autorisations aux utilisateurs est une tâche d'administrateur de base de données." }
    s3: { en: "Implementing pipelines that transfer and transform data is a data engineer task.", fr: "L'implémentation de pipelines qui transfèrent et transforment les données est une tâche d'ingénieur de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
