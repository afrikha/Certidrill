id: dp900-1a-semi-classify-dd
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Which type of data is each data set? To answer, drag the appropriate types to the correct data sets. Each type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    De quel type de données chaque jeu de données relève-t-il ? Pour répondre, faites glisser les types appropriés vers les jeux de données correspondants. Chaque type peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: st, text: { en: "Structured data", fr: "Données structurées" } }
    - { id: semi, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
    - { id: un, text: { en: "Unstructured data", fr: "Données non structurées" } }
    - { id: vec, text: { en: "Vector data", fr: "Données vectorielles" } }
  targets:
    - id: t1
      text: { en: "An inventory table in which every product has the same columns", fr: "Une table d'inventaire où tous les produits ont les mêmes colonnes" }
    - id: t2
      text: { en: "JSON order documents in which the fields vary between orders", fr: "Des documents JSON de commandes dont les champs varient d'une commande à l'autre" }
    - id: t3
      text: { en: "Recordings of the calls to a support center", fr: "Des enregistrements des appels à un centre de support" }
    - id: t4
      text: { en: "JSON device messages whose properties depend on the device model", fr: "Des messages JSON d'appareils dont les propriétés dépendent du modèle d'appareil" }
answer:
  mapping: { t1: st, t2: semi, t3: un, t4: semi }
explanation:
  correct:
    en: "The table has a fixed schema: it is structured data. The order documents and the device messages have named fields that vary from one item to another: both are semi-structured data. Audio recordings have no specific structure: they are unstructured data."
    fr: "La table a un schéma fixe : ce sont des données structurées. Les documents de commandes et les messages d'appareils ont des champs nommés qui varient d'un élément à l'autre : ce sont dans les deux cas des données semi-structurées. Les enregistrements audio n'ont pas de structure spécifique : ce sont des données non structurées."
  options:
    vec:
      en: "Vector data, or embeddings, is a numerical representation of content that AI applications use; none of the data sets is one."
      fr: "Les données vectorielles, ou incorporations (embeddings), sont une représentation numérique d'un contenu utilisée par les applications d'IA ; aucun des jeux de données n'en est."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
