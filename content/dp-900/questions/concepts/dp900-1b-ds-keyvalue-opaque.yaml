id: dp900-1b-ds-keyvalue-opaque
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum stores the shopping cart of each visitor to its website as a JSON string. The application always reads or writes a whole cart by using the visitor's session ID, and it never searches inside the carts.

    Adatum wants the simplest type of data store that meets these requirements. Which type of data store should Adatum use?
  fr: |
    Adatum stocke le panier de chaque visiteur de son site web sous forme de chaîne JSON. L'application lit ou écrit toujours un panier entier à partir de l'ID de session du visiteur, et elle ne fait jamais de recherche à l'intérieur des paniers.

    Adatum veut le type de magasin de données le plus simple qui réponde à ces besoins. Quel type de magasin de données Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A document database", fr: "Une base de données de documents" } }
    - { id: b, text: { en: "A graph database", fr: "Une base de données de graphes" } }
    - { id: c, text: { en: "A key-value database", fr: "Une base de données clé-valeur" } }
    - { id: d, text: { en: "A column family database", fr: "Une base de données de familles de colonnes" } }
answer: { optionId: c }
explanation:
  correct:
    en: "In a key-value database, each record is a unique key and an associated value that can be in any format. The session ID is the key and the cart is the value: because the application never searches inside the carts, the store doesn't need to understand that the value is JSON."
    fr: "Dans une base de données clé-valeur, chaque enregistrement est une clé unique et une valeur associée, de n'importe quel format. L'ID de session est la clé et le panier est la valeur : comme l'application ne fait jamais de recherche à l'intérieur des paniers, le magasin n'a pas besoin de savoir que la valeur est du JSON."
  options:
    a:
      en: "A document database could store the carts, but its ability to parse and query the JSON documents isn't needed here, so it isn't the simplest store."
      fr: "Une base de données de documents pourrait stocker les paniers, mais sa capacité à analyser et interroger les documents JSON est inutile ici : ce n'est donc pas le magasin le plus simple."
    b:
      en: "A graph database is designed for entities and the relationships between them; the carts are independent of one another."
      fr: "Une base de données de graphes est conçue pour des entités et les relations entre elles ; les paniers sont indépendants les uns des autres."
    d:
      en: "A column family database organizes data in rows whose columns are divided into groups; a cart that is read as a whole needs no column structure."
      fr: "Une base de données de familles de colonnes organise les données en lignes dont les colonnes sont réparties en groupes ; un panier lu en entier n'a besoin d'aucune structure en colonnes."
references:
