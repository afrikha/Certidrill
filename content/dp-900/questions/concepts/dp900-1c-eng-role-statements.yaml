id: dp900-1c-eng-role-statements
objective: "1.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A data engineer is responsible for restoring a transactional database after a failure.
        fr: Un ingénieur de données est responsable de la restauration d'une base de données transactionnelle après une défaillance.
    - id: s2
      text:
        en: A data engineer manages the infrastructure and the processes for data integration across the organization.
        fr: Un ingénieur de données gère l'infrastructure et les processus d'intégration des données dans toute l'organisation.
    - id: s3
      text:
        en: A data engineer works with file stores and data streams as well as with relational databases.
        fr: Un ingénieur de données travaille avec des magasins de fichiers et des flux de données aussi bien qu'avec des bases de données relationnelles.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Data engineers manage the infrastructure and processes for data integration, and they use a wide range of data platform technologies: relational and non-relational databases, file stores, and data streams. Restoring a database after a failure is part of the backup and recovery work of the database administrator.
    fr: |
      Les ingénieurs de données gèrent l'infrastructure et les processus d'intégration des données, et ils utilisent un large éventail de technologies de plateforme de données : bases de données relationnelles et non relationnelles, magasins de fichiers et flux de données. La restauration d'une base de données après une défaillance fait partie du travail de sauvegarde et de récupération de l'administrateur de base de données.
  options:
    s1: { en: "Backup and recovery of databases is a responsibility of the database administrator.", fr: "La sauvegarde et la récupération des bases de données sont une responsabilité de l'administrateur de base de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
