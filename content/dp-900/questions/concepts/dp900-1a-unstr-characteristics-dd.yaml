id: dp900-1a-unstr-characteristics-dd
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each type of data to its description. To answer, drag the appropriate types to the correct descriptions. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque type de données à sa description. Pour répondre, faites glisser les types appropriés vers les descriptions correspondantes. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: st, text: { en: "Structured data", fr: "Données structurées" } }
    - { id: semi, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
    - { id: un, text: { en: "Unstructured data", fr: "Données non structurées" } }
    - { id: vec, text: { en: "Vector data", fr: "Données vectorielles" } }
  targets:
    - id: t1
      text: { en: "Has no specific structure, as in documents, images, audio and video", fr: "N'ont pas de structure spécifique, comme les documents, les images, l'audio et la vidéo" }
    - id: t2
      text: { en: "Adheres to a fixed schema, so all of the data has the same fields", fr: "Respectent un schéma fixe : toutes les données ont donc les mêmes champs" }
    - id: t3
      text: { en: "Has some structure, which can vary between entity instances", fr: "Ont une certaine structure, qui peut varier entre les instances d'une entité" }
answer:
  mapping: { t1: un, t2: st, t3: semi }
explanation:
  correct:
    en: "Unstructured data, such as documents, images, audio, video and binary files, has no specific structure. Structured data follows a fixed schema with the same fields for all the data. Semi-structured data has some structure but allows variation between the instances of an entity."
    fr: "Les données non structurées, comme les documents, les images, l'audio, la vidéo et les fichiers binaires, n'ont pas de structure spécifique. Les données structurées suivent un schéma fixe avec les mêmes champs pour toutes les données. Les données semi-structurées ont une certaine structure, mais autorisent des variations entre les instances d'une entité."
  options:
    vec:
      en: "Vector data, also called embeddings, is a numerical representation of content such as text or images."
      fr: "Les données vectorielles, aussi appelées incorporations (embeddings), sont une représentation numérique d'un contenu tel qu'un texte ou une image."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
