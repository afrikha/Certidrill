id: dp900-1a-struct-yn-subtle
objective: "1.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Data is structured only if it is stored in a relational database."
        fr: "Des données ne sont structurées que si elles sont stockées dans une base de données relationnelle."
    - id: s2
      text:
        en: "A delimited text file in which every line has the same fields can hold structured data."
        fr: "Un fichier texte délimité dont toutes les lignes ont les mêmes champs peut contenir des données structurées."
    - id: s3
      text:
        en: "A JSON file in which every object has the same fields can represent structured data."
        fr: "Un fichier JSON dont tous les objets ont les mêmes champs peut représenter des données structurées."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "What makes data structured is its fixed schema, not the place where it is stored: structured data is often, but not necessarily, kept in a relational database. Delimited text is a good choice for structured data that many applications must read, and JSON suits both structured and semi-structured data."
    fr: "Ce qui rend des données structurées, c'est leur schéma fixe, pas l'endroit où elles sont stockées : les données structurées sont souvent, mais pas nécessairement, conservées dans une base de données relationnelle. Le texte délimité est un bon choix pour des données structurées que de nombreuses applications doivent lire, et JSON convient aux données structurées comme aux données semi-structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
