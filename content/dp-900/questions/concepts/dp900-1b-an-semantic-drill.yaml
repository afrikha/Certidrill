id: dp900-1b-an-semantic-drill
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The business users of Northwind Traders view the total sales of each region, then drill down to the totals of each city. The summaries must be returned quickly, from data that is aggregated in advance across dimensions.

    Which type of data store meets these requirements?
  fr: |
    Les utilisateurs professionnels de Northwind Traders consultent le total des ventes de chaque région, puis descendent dans la hiérarchie jusqu'aux totaux de chaque ville. Les synthèses doivent être renvoyées rapidement, à partir de données agrégées à l'avance selon des dimensions.

    Quel type de magasin de données répond à ces besoins ?
body:
  options:
    - { id: a, text: { en: "A data lake", fr: "Un lac de données" } }
    - { id: b, text: { en: "A data warehouse", fr: "Un entrepôt de données" } }
    - { id: c, text: { en: "An OLTP database", fr: "Une base de données OLTP" } }
    - { id: d, text: { en: "A semantic model", fr: "Un modèle sémantique" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A semantic model (an OLAP model, historically called a cube) is an aggregated type of data storage: the data is aggregated across dimensions at different levels, so users can drill up and down, for example from region to city. Because the data is pre-aggregated, queries that return summaries run quickly."
    fr: "Un modèle sémantique (un modèle OLAP, historiquement appelé cube) est un type de stockage de données agrégé : les données sont agrégées selon des dimensions à différents niveaux, ce qui permet aux utilisateurs de monter et de descendre dans la hiérarchie, par exemple de la région à la ville. Comme les données sont préagrégées, les requêtes qui renvoient des synthèses s'exécutent rapidement."
  options:
    a:
      en: "A data lake stores large volumes of data files; it doesn't hold aggregations calculated in advance."
      fr: "Un lac de données stocke de grands volumes de fichiers de données ; il ne contient pas d'agrégations calculées à l'avance."
    b:
      en: "A data warehouse stores the data in a relational schema of tables that queries read; the aggregation across dimensions at several levels is done in the model built from it."
      fr: "Un entrepôt de données stocke les données dans un schéma relationnel de tables que les requêtes lisent ; l'agrégation selon des dimensions à plusieurs niveaux se fait dans le modèle construit à partir de celui-ci."
    c:
      en: "An OLTP database records individual transactions and is optimized for reading and writing them, not for pre-aggregated summaries."
      fr: "Une base de données OLTP enregistre des transactions individuelles et est optimisée pour les lire et les écrire, pas pour des synthèses préagrégées."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
