id: dp900-1c-ana-explore-trends
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The managers of Northwind Traders want to understand why sales dropped last quarter. Someone must explore the sales data to identify trends and relationships.

    Which role should perform this task?
  fr: |
    Les responsables de Northwind Traders veulent comprendre pourquoi les ventes ont baissé au dernier trimestre. Quelqu'un doit explorer les données de ventes pour identifier des tendances et des relations.

    Quel rôle doit effectuer cette tâche ?
body:
  options:
    - id: a
      text: { en: "Database administrator", fr: "Administrateur de base de données" }
    - id: b
      text: { en: "AI engineer", fr: "Ingénieur IA" }
    - id: c
      text: { en: "Data analyst", fr: "Analyste de données" }
    - id: d
      text: { en: "Data engineer", fr: "Ingénieur de données" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data analyst explores and analyzes data to identify trends and relationships, and turns the findings into insights that the business can act on. Explaining a drop in sales from the data is typical work for this role.
    fr: |
      Un analyste de données explore et analyse les données pour identifier des tendances et des relations, et transforme ses constats en informations exploitables par l'entreprise. Expliquer une baisse des ventes à partir des données est un travail typique de ce rôle.
  options:
    a: { en: "A database administrator keeps the sales database available, secure and backed up, but does not analyze the business data.", fr: "Un administrateur de base de données maintient la base de données des ventes disponible, sécurisée et sauvegardée, mais n'analyse pas les données métier." }
    b: { en: "An AI engineer builds AI-powered features and workflows, not business analyses.", fr: "Un ingénieur IA crée des fonctionnalités et des flux de travail d'IA, pas des analyses métier." }
    d: { en: "A data engineer makes the data available through pipelines and analytical data stores; exploring it for trends is the analyst's work.", fr: "Un ingénieur de données met les données à disposition grâce à des pipelines et à des magasins de données analytiques ; les explorer à la recherche de tendances est le travail de l'analyste." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
