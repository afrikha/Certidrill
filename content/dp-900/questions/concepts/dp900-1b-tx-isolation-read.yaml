id: dp900-1b-tx-isolation-read
objective: "1.3.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    While a transfer between two bank accounts is in progress, another transaction reads the balances of both accounts. The second transaction must not return the balance of one account as it was before the transfer and the balance of the other account as it is after the transfer.

    Which ACID property provides this guarantee?
  fr: |
    Pendant qu'un virement entre deux comptes bancaires est en cours, une autre transaction lit les soldes des deux comptes. La seconde transaction ne doit pas renvoyer le solde d'un compte tel qu'il était avant le virement et le solde de l'autre compte tel qu'il est après le virement.

    Quelle propriété ACID apporte cette garantie ?
body:
  options:
    - { id: a, text: { en: "Atomicity", fr: "Atomicité" } }
    - { id: b, text: { en: "Consistency", fr: "Cohérence" } }
    - { id: c, text: { en: "Isolation", fr: "Isolation" } }
    - { id: d, text: { en: "Durability", fr: "Durabilité" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Isolation means that concurrent transactions don't interfere with one another and must result in a consistent database state. A transaction that checks the balances while the transfer runs sees both balances before the transfer or both after it, never a mix."
    fr: "L'isolation signifie que des transactions simultanées n'interfèrent pas les unes avec les autres et doivent aboutir à un état cohérent de la base de données. Une transaction qui consulte les soldes pendant le virement voit les deux soldes d'avant le virement ou les deux soldes d'après, jamais un mélange."
  options:
    a:
      en: "Atomicity ensures that the debit and the credit of the transfer both succeed or both fail; it says nothing about what another transaction sees meanwhile."
      fr: "L'atomicité garantit que le débit et le crédit du virement réussissent tous les deux ou échouent tous les deux ; elle ne dit rien de ce qu'une autre transaction voit entre-temps."
    b:
      en: "Consistency ensures that the completed transfer leaves the data in a valid state; the question is about a second transaction that runs at the same time."
      fr: "La cohérence garantit que le virement terminé laisse les données dans un état valide ; la question porte sur une seconde transaction exécutée au même moment."
    d:
      en: "Durability ensures that the committed transfer is preserved, for example after the database system is restarted."
      fr: "La durabilité garantit que le virement validé est conservé, par exemple après un redémarrage du système de base de données."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
