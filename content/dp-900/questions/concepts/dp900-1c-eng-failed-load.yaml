id: dp900-1c-eng-failed-load
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The nightly pipeline that loads sales data into the data warehouse of Proseware failed, and the morning reports show outdated figures.

    Which role owns the monitoring of this data load and should fix it?
  fr: |
    Le pipeline nocturne qui charge les données de ventes dans l'entrepôt de données de Proseware a échoué, et les rapports du matin affichent des chiffres périmés.

    Quel rôle est responsable de la surveillance de ce chargement de données et doit le corriger ?
body:
  options:
    - id: a
      text: { en: "Database administrator", fr: "Administrateur de base de données" }
    - id: b
      text: { en: "Data analyst", fr: "Analyste de données" }
    - id: c
      text: { en: "AI engineer", fr: "Ingénieur IA" }
    - id: d
      text: { en: "Data engineer", fr: "Ingénieur de données" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Data engineers own the management and monitoring of data pipelines, so that data loads perform as expected. A failed load into the data warehouse is therefore theirs to investigate and fix.
    fr: |
      Les ingénieurs de données sont responsables de la gestion et de la surveillance des pipelines de données, pour que les chargements de données se déroulent comme prévu. C'est donc à eux d'examiner et de corriger un chargement en échec vers l'entrepôt de données.
  options:
    a: { en: "A database administrator keeps databases available, backed up and secure, but does not own the pipelines that move data between systems.", fr: "Un administrateur de base de données maintient les bases de données disponibles, sauvegardées et sécurisées, mais n'est pas responsable des pipelines qui déplacent les données entre les systèmes." }
    b: { en: "A data analyst uses the loaded data to build reports; the role does not operate the pipelines.", fr: "Un analyste de données utilise les données chargées pour créer des rapports ; ce rôle n'exploite pas les pipelines." }
    c: { en: "An AI engineer builds AI-powered features; data loads into a data warehouse are not part of that role.", fr: "Un ingénieur IA crée des fonctionnalités d'IA ; les chargements de données dans un entrepôt de données ne font pas partie de ce rôle." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
