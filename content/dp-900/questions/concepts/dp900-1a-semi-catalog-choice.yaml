id: dp900-1a-semi-catalog-choice
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys sells thousands of kinds of products. Each kind of product has its own attributes, and new attributes appear every week. Each product record must contain only the attributes that apply to that product, and adding an attribute must not require a change to a schema.

    How should the product data be represented?
  fr: |
    Wingtip Toys vend des milliers de sortes de produits. Chaque sorte de produit a ses propres attributs, et de nouveaux attributs apparaissent chaque semaine. Chaque enregistrement de produit ne doit contenir que les attributs qui s'appliquent à ce produit, et l'ajout d'un attribut ne doit pas exiger la modification d'un schéma.

    Comment les données des produits doivent-elles être représentées ?
body:
  options:
    - { id: a, text: { en: "As structured data, in a table that has a fixed set of columns", fr: "Sous forme de données structurées, dans une table dotée d'un ensemble fixe de colonnes" } }
    - { id: b, text: { en: "As semi-structured data, in JSON documents whose fields can vary", fr: "Sous forme de données semi-structurées, dans des documents JSON dont les champs peuvent varier" } }
    - { id: c, text: { en: "As unstructured data, in image files of the product sheets", fr: "Sous forme de données non structurées, dans des fichiers image des fiches produit" } }
    - { id: d, text: { en: "As unstructured data, in free-text documents without fields", fr: "Sous forme de données non structurées, dans des documents en texte libre sans champs" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Semi-structured data keeps named fields but lets them vary from one item to another. Each product document lists only its own attributes, and a new attribute simply appears in the documents that need it, with no schema to change."
    fr: "Les données semi-structurées conservent des champs nommés, mais les laissent varier d'un élément à l'autre. Chaque document de produit ne liste que ses propres attributs, et un nouvel attribut apparaît simplement dans les documents qui en ont besoin, sans schéma à modifier."
  options:
    a:
      en: "With a fixed schema, each new attribute is a new column for every product, empty for most of them, and the schema changes every week."
      fr: "Avec un schéma fixe, chaque nouvel attribut est une nouvelle colonne pour tous les produits, vide pour la plupart, et le schéma change chaque semaine."
    c:
      en: "Images have no fields: the attributes could no longer be read as attributes."
      fr: "Les images n'ont pas de champs : les attributs ne pourraient plus être lus comme des attributs."
    d:
      en: "Free text has no fields either, so the record would no longer contain attributes at all."
      fr: "Le texte libre n'a pas de champs non plus : l'enregistrement ne contiendrait plus du tout d'attributs."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
