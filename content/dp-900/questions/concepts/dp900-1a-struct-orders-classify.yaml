id: dp900-1a-struct-orders-classify
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer records its sales orders in a table. Every order has the same columns: order number, customer number, order date and total amount.

    Which type of data is this?
  fr: |
    Un détaillant enregistre ses commandes dans une table. Chaque commande a les mêmes colonnes : numéro de commande, numéro de client, date de commande et montant total.

    De quel type de données s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Semi-structured data", fr: "Des données semi-structurées" } }
    - { id: b, text: { en: "Structured data", fr: "Des données structurées" } }
    - { id: c, text: { en: "Unstructured data", fr: "Des données non structurées" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Structured data adheres to a fixed schema, so all the data has the same fields. The schema is most often tabular: each row is one order and each column is one attribute of the order, which is exactly what the retailer has."
    fr: "Les données structurées respectent un schéma fixe : toutes les données ont donc les mêmes champs. Le schéma est le plus souvent tabulaire : chaque ligne est une commande et chaque colonne est un attribut de la commande, ce qui correspond exactement aux données du détaillant."
  options:
    a:
      en: "Semi-structured data allows the fields to vary between orders; here every order has the same columns."
      fr: "Les données semi-structurées autorisent des champs qui varient d'une commande à l'autre ; ici, toutes les commandes ont les mêmes colonnes."
    c:
      en: "Unstructured data has no specific structure, as in documents, images or recordings; a table of rows and columns has one."
      fr: "Les données non structurées n'ont pas de structure spécifique, comme les documents, les images ou les enregistrements ; une table de lignes et de colonnes en a une."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
