id: dp900-1b-tx-oltp-name
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company uses a system that records each sale at the moment it happens.

    Which term describes the work that this system performs?
  fr: |
    Une entreprise de vente au détail utilise un système qui enregistre chaque vente au moment où elle a lieu.

    Quel terme désigne le travail effectué par ce système ?
body:
  options:
    - { id: a, text: "OLAP" }
    - { id: b, text: "OLTP" }
    - { id: c, text: "ETL" }
    - { id: d, text: "ELT" }
answer: { optionId: b }
explanation:
  correct:
    en: "A system that records transactions, such as the payments of customers, is a transactional system. The work that it performs is called online transactional processing (OLTP)."
    fr: "Un système qui enregistre des transactions, comme les paiements des clients, est un système transactionnel. Le travail qu'il effectue s'appelle le traitement transactionnel en ligne (OLTP)."
  options:
    a:
      en: "OLAP is online analytical processing: it aggregates recorded data for analysis instead of recording the sales."
      fr: "OLAP est le traitement analytique en ligne : il agrège les données enregistrées pour les analyser au lieu d'enregistrer les ventes."
    c:
      en: "ETL (extract, transform and load) is a process that copies data from operational systems into an analytical data store."
      fr: "ETL (extraire, transformer et charger) est un processus qui copie les données des systèmes opérationnels dans un magasin de données analytique."
    d:
      en: "ELT (extract, load and transform) is a variant of ETL in which the data is transformed after it is loaded."
      fr: "ELT (extraire, charger et transformer) est une variante d'ETL dans laquelle les données sont transformées après leur chargement."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
