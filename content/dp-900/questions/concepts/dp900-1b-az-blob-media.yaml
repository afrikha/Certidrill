id: dp900-1b-az-blob-media
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys must store millions of product images and videos and serve them directly to web browsers. The storage must be scalable and cost-effective.

    Which Azure data store should Tailspin Toys use?
  fr: |
    Tailspin Toys doit stocker des millions d'images et de vidéos de produits et les servir directement aux navigateurs web. Le stockage doit être scalable et économique.

    Quel magasin de données Azure Tailspin Toys doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: b, text: "Azure Files" }
    - { id: c, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: d, text: "Azure SQL Database" }
answer: { optionId: a }
explanation:
  correct:
    en: "Blob containers in Azure Storage provide scalable, cost-effective storage for binary files such as images and videos. Blob Storage is designed, among other uses, to serve images or documents directly to a browser and to stream video and audio."
    fr: "Les conteneurs d'objets blob de Stockage Azure offrent un stockage scalable et économique pour les fichiers binaires comme les images et les vidéos. Le Stockage Blob est conçu, entre autres usages, pour servir des images ou des documents directement à un navigateur et pour diffuser de la vidéo et de l'audio en continu."
  options:
    b:
      en: "Azure Files provides network file shares that computers mount, like the shares of a corporate network; it isn't the store designed to serve media to browsers."
      fr: "Azure Files fournit des partages de fichiers réseau que des ordinateurs montent, comme les partages d'un réseau d'entreprise ; ce n'est pas le magasin conçu pour servir des médias à des navigateurs."
    c:
      en: "Azure Table storage is a key-value store for structured non-relational data, not for image and video files."
      fr: "Le Stockage Table Azure est un magasin clé-valeur pour des données structurées non relationnelles, pas pour des fichiers image et vidéo."
    d:
      en: "Azure SQL Database is a relational database for structured, transactional data, not a scalable store for large binary files."
      fr: "Azure SQL Database est une base de données relationnelle pour des données structurées et transactionnelles, pas un magasin scalable pour de gros fichiers binaires."
references:
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
