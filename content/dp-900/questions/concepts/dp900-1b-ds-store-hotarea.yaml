id: dp900-1b-ds-store-hotarea
objective: "1.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to use the data stores shown in the following table.

    Answer each prompt by selecting the appropriate data store.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser les magasins de données qui figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le magasin de données approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The store for scanned contracts in PDF format and for product photos", fr: "Le magasin destiné aux contrats numérisés au format PDF et aux photos de produits" }
    - id: p2
      text: { en: "The store for accounting entries that all have the same structure and that each reference an account described only once", fr: "Le magasin destiné aux écritures comptables qui ont toutes la même structure et qui font chacune référence à un compte décrit une seule fois" }
  grid:
    header: [{ en: "Data store", fr: "Magasin de données" }, { en: "How the data is stored", fr: "Mode de stockage des données" }]
    rows:
      - [{ text: Store1, area: store1 }, { text: { en: "Tables whose rows reference the rows of other tables through keys", fr: "Tables dont les lignes font référence aux lignes d'autres tables par des clés" } }]
      - [{ text: Store2, area: store2 }, { text: { en: "Unique keys, each with a value that the store doesn't interpret", fr: "Clés uniques, chacune associée à une valeur que le magasin n'interprète pas" } }]
      - [{ text: Store3, area: store3 }, { text: { en: "JSON documents that can be queried on their fields", fr: "Documents JSON interrogeables sur leurs champs" } }]
      - [{ text: Store4, area: store4 }, { text: { en: "Nodes and the links between them", fr: "Nœuds et liens entre eux" } }]
      - [{ text: Store5, area: store5 }, { text: { en: "Files in folders on a shared file system", fr: "Fichiers dans des dossiers d'un système de fichiers partagé" } }]
answer:
  values: { p1: store5, p2: store1 }
explanation:
  correct:
    en: "Scanned contracts and photos are binary files that an application must interpret, so they belong in a file store (Store5). Accounting entries with a fixed structure that reference accounts stored once are structured, normalized data: this is what the tables and keys of a relational database (Store1) are for."
    fr: "Les contrats numérisés et les photos sont des fichiers binaires qu'une application doit interpréter : leur place est dans un magasin de fichiers (Store5). Des écritures comptables de structure fixe qui font référence à des comptes stockés une seule fois sont des données structurées et normalisées : c'est le rôle des tables et des clés d'une base de données relationnelle (Store1)."
  options:
    store2:
      en: "Store2 is a key-value database: it returns a value from a key, but it doesn't relate entries to accounts."
      fr: "Store2 est une base de données clé-valeur : elle renvoie une valeur à partir d'une clé, mais ne relie pas les écritures aux comptes."
    store3:
      en: "Store3 is a document database, suited to JSON items whose fields vary, not to binary files or to entries that all share one structure."
      fr: "Store3 est une base de données de documents, adaptée à des éléments JSON dont les champs varient, pas à des fichiers binaires ni à des écritures qui ont toutes la même structure."
    store4:
      en: "Store4 is a graph database, designed to traverse relationships between entities."
      fr: "Store4 est une base de données de graphes, conçue pour parcourir les relations entre des entités."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
  - title: Explore file storage
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
