id: dp900-1a-struct-examples-multi
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two data sets are examples of structured data?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux jeux de données qui sont des exemples de données structurées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A set of JSON documents in which each product has its own attributes", fr: "Un ensemble de documents JSON où chaque produit a ses propres attributs" } }
    - { id: b, text: { en: "An inventory table in which every product has the same five columns", fr: "Une table d'inventaire où tous les produits ont les mêmes cinq colonnes" } }
    - { id: c, text: { en: "A folder of Word documents that are all based on the same template", fr: "Un dossier de documents Word tous basés sur le même modèle" } }
    - { id: d, text: { en: "A CSV file in which every line has the same four fields", fr: "Un fichier CSV dont toutes les lignes ont les mêmes quatre champs" } }
    - { id: e, text: { en: "A collection of product photos that are saved as JPEG files", fr: "Une collection de photos de produits enregistrées en fichiers JPEG" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Structured data adheres to a fixed schema: every record has the same fields. That is the case of the inventory table and of the CSV file, since delimited text is a common way to keep structured data outside a database."
    fr: "Les données structurées respectent un schéma fixe : tous les enregistrements ont les mêmes champs. C'est le cas de la table d'inventaire et du fichier CSV, le texte délimité étant une façon courante de conserver des données structurées en dehors d'une base de données."
  options:
    a:
      en: "Documents whose attributes differ from one product to another are semi-structured data."
      fr: "Des documents dont les attributs diffèrent d'un produit à l'autre sont des données semi-structurées."
    c:
      en: "Documents are unstructured data, even when they share a template: their content isn't divided into fields that are the same for every record."
      fr: "Les documents sont des données non structurées, même s'ils partagent un modèle : leur contenu n'est pas découpé en champs identiques pour tous les enregistrements."
    e:
      en: "Images have no specific structure: they are unstructured data."
      fr: "Les images n'ont pas de structure spécifique : ce sont des données non structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
