id: dp900-1a-semi-yn-hard
objective: "1.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A set of JSON documents in which one document has a field that the other documents lack is semi-structured data."
        fr: "Un ensemble de documents JSON dans lequel un document a un champ que les autres n'ont pas constitue des données semi-structurées."
    - id: s2
      text:
        en: "Semi-structured data can represent a customer who has several email addresses and a customer who has none."
        fr: "Des données semi-structurées peuvent représenter un client qui a plusieurs adresses e-mail et un client qui n'en a aucune."
    - id: s3
      text:
        en: "JSON can represent semi-structured data only; it is unsuitable for structured data."
        fr: "JSON ne peut représenter que des données semi-structurées ; il ne convient pas aux données structurées."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Variation between items, such as a field that only one document has or a different number of email addresses, is exactly what semi-structured data allows. JSON is a file format, not a category of data: it suits both structured data, when every object has the same fields, and semi-structured data."
    fr: "Les variations entre éléments, comme un champ présent dans un seul document ou un nombre différent d'adresses e-mail, sont précisément ce qu'autorisent les données semi-structurées. JSON est un format de fichier, pas une catégorie de données : il convient aux données structurées, quand tous les objets ont les mêmes champs, comme aux données semi-structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
