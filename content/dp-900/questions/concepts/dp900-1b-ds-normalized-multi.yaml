id: dp900-1b-ds-normalized-multi
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores its sales data in a normalized relational database.

    Which two statements describe this database?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke ses données de vente dans une base de données relationnelle normalisée.

    Quelles sont les deux affirmations qui décrivent cette base de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each row of a table can hold a different set of columns.", fr: "Chaque ligne d'une table peut contenir un ensemble de colonnes différent." } }
    - { id: b, text: { en: "The details of a customer are stored once, not in each of the customer's orders.", fr: "Les informations d'un client sont stockées une seule fois, et non dans chacune de ses commandes." } }
    - { id: c, text: { en: "The sales totals of each region are stored in advance for every month.", fr: "Les totaux des ventes de chaque région sont stockés à l'avance pour chaque mois." } }
    - { id: d, text: { en: "Each order references its customer through the customer's primary key value.", fr: "Chaque commande fait référence à son client par la valeur de la clé primaire du client." } }
    - { id: e, text: { en: "Each record is a key with a value that the database doesn't interpret.", fr: "Chaque enregistrement est une clé associée à une valeur que la base de données n'interprète pas." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "In a relational database, each instance of an entity has a primary key, and other tables reference the instance by storing that key. This is what allows normalization: duplicate data values are eliminated, so the details of a customer are stored only once instead of being repeated in every order."
    fr: "Dans une base de données relationnelle, chaque instance d'une entité a une clé primaire, et les autres tables font référence à cette instance en stockant cette clé. C'est ce qui permet la normalisation : les valeurs en double sont éliminées, de sorte que les informations d'un client ne sont stockées qu'une fois au lieu d'être répétées dans chaque commande."
  options:
    a:
      en: "All the rows of a relational table share the same columns; records with varying fields are typical of non-relational stores such as document databases."
      fr: "Toutes les lignes d'une table relationnelle ont les mêmes colonnes ; les enregistrements aux champs variables sont typiques des magasins non relationnels comme les bases de données de documents."
    c:
      en: "Pre-aggregated totals describe an analytical model, not the normalized tables of a relational database."
      fr: "Des totaux préagrégés décrivent un modèle analytique, pas les tables normalisées d'une base de données relationnelle."
    e:
      en: "A key with a value in any format describes a key-value database, which is non-relational."
      fr: "Une clé associée à une valeur de n'importe quel format décrit une base de données clé-valeur, qui est non relationnelle."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
