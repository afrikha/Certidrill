id: dp900-1c-dba-paas-responsibility
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum moves a database from an on-premises server to Azure SQL Database, a platform as a service (PaaS) offering.

    Which statement describes the role of the database administrator after the move?
  fr: |
    Adatum déplace une base de données d'un serveur local vers Azure SQL Database, une offre PaaS (platform as a service).

    Quelle affirmation décrit le rôle de l'administrateur de base de données après le déplacement ?
body:
  options:
    - id: a
      text: { en: "The administrator patches the operating system of the server that hosts the database.", fr: "L'administrateur applique les correctifs du système d'exploitation du serveur qui héberge la base de données." }
    - id: b
      text: { en: "The administrator hands the management of the database over to the data engineer.", fr: "L'administrateur transmet la gestion de la base de données à l'ingénieur de données." }
    - id: c
      text: { en: "The administrator still manages which users can access the data in the database.", fr: "L'administrateur continue de gérer quels utilisateurs peuvent accéder aux données de la base de données." }
    - id: d
      text: { en: "The administrator becomes responsible for the pipelines that read from the database.", fr: "L'administrateur devient responsable des pipelines qui lisent la base de données." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The role of the database administrator covers cloud-based database systems as well as on-premises ones. With a PaaS service, Microsoft manages the underlying infrastructure, such as the servers and their patching, but the administrator keeps managing the security of the data: granting privileges and granting or denying access to users.
    fr: |
      Le rôle de l'administrateur de base de données couvre les systèmes de base de données cloud aussi bien que locaux. Avec un service PaaS, Microsoft gère l'infrastructure sous-jacente, comme les serveurs et leurs correctifs, mais l'administrateur continue de gérer la sécurité des données : il accorde des privilèges et accorde ou refuse l'accès aux utilisateurs.
  options:
    a: { en: "In a PaaS service, Microsoft manages the servers and their patching; the administrator has no access to the operating system.", fr: "Dans un service PaaS, Microsoft gère les serveurs et leurs correctifs ; l'administrateur n'a pas accès au système d'exploitation." }
    b: { en: "Database administrators provision and manage Azure SQL databases; data engineers use them as sources for pipelines.", fr: "Les administrateurs de base de données provisionnent et gèrent les bases de données Azure SQL ; les ingénieurs de données les utilisent comme sources de pipelines." }
    d: { en: "The data engineer owns the pipelines, whether the source database is on-premises or in the cloud.", fr: "C'est l'ingénieur de données qui est responsable des pipelines, que la base de données source soit locale ou dans le cloud." }
