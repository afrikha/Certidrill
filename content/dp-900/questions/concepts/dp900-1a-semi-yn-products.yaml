id: dp900-1a-semi-yn-products
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A product catalog contains the following two JSON documents.

    ```json
    { "id": 1, "name": "T-shirt", "sizes": ["S", "M", "L"] }
    { "id": 2, "name": "Television", "screen": { "inches": 55, "type": "OLED" } }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un catalogue de produits contient les deux documents JSON suivants.

    ```json
    { "id": 1, "name": "T-shirt", "sizes": ["S", "M", "L"] }
    { "id": 2, "name": "Television", "screen": { "inches": 55, "type": "OLED" } }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The two documents must contain the same fields before the catalog can be called semi-structured data."
        fr: "Les deux documents doivent contenir les mêmes champs pour que le catalogue puisse être qualifié de données semi-structurées."
    - id: s2
      text:
        en: "The `sizes` attribute of the first document contains a collection of values."
        fr: "L'attribut `sizes` du premier document contient une collection de valeurs."
    - id: s3
      text:
        en: "The catalog is unstructured data, because the two documents have different attributes."
        fr: "Le catalogue constitue des données non structurées, car les deux documents ont des attributs différents."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Semi-structured data allows the fields to vary between items, so the two documents don't need the same fields. In JSON, square brackets enclose a collection: `sizes` holds three values. Different attributes don't make the data unstructured: each document still has named fields, so the catalog is semi-structured."
    fr: "Les données semi-structurées autorisent des champs qui varient d'un élément à l'autre : les deux documents n'ont donc pas besoin des mêmes champs. En JSON, les crochets délimitent une collection : `sizes` contient trois valeurs. Des attributs différents ne rendent pas les données non structurées : chaque document a toujours des champs nommés, et le catalogue est donc semi-structuré."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
