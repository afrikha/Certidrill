id: dp900-1a-semi-sources-pick
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank receives data from four sources.

    Which source provides semi-structured data?
  fr: |
    Woodgrove Bank reçoit des données de quatre sources.

    Quelle source fournit des données semi-structurées ?
body:
  options:
    - { id: a, text: { en: "JSON messages whose properties differ for each partner", fr: "Des messages JSON dont les propriétés diffèrent selon le partenaire" } }
    - { id: b, text: { en: "A CSV export in which every line has the same 12 fields", fr: "Un export CSV dont toutes les lignes ont les mêmes 12 champs" } }
    - { id: c, text: { en: "Meeting minutes that are written as Word documents", fr: "Des comptes rendus de réunion rédigés sous forme de documents Word" } }
    - { id: d, text: { en: "A table in which the Comments column is empty for most rows", fr: "Une table dont la colonne Comments est vide pour la plupart des lignes" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The JSON messages have named properties, but the set of properties varies with the partner: some structure, with variation between items, is semi-structured data. The three other sources either have the same fields for every record or have no fields at all."
    fr: "Les messages JSON ont des propriétés nommées, mais l'ensemble des propriétés varie selon le partenaire : une certaine structure, avec des variations d'un élément à l'autre, correspond à des données semi-structurées. Les trois autres sources ont soit les mêmes champs pour tous les enregistrements, soit aucun champ."
  options:
    b:
      en: "The same fields on every line is a fixed schema: the CSV export is structured data."
      fr: "Les mêmes champs sur chaque ligne constituent un schéma fixe : l'export CSV contient des données structurées."
    c:
      en: "Documents contain readable text but no fields: they are unstructured data."
      fr: "Les documents contiennent du texte lisible mais pas de champs : ce sont des données non structurées."
    d:
      en: "An empty (NULL) column doesn't change the schema: every row still has the same columns, so the table is structured data."
      fr: "Une colonne vide (NULL) ne change pas le schéma : toutes les lignes ont toujours les mêmes colonnes, et la table contient donc des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
