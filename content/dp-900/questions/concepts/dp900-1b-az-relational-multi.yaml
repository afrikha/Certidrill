id: dp900-1b-az-relational-multi
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to move several applications to Azure. Each application stores its data in relational tables.

    Which two Azure services are relational database services?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déplacer plusieurs applications vers Azure. Chaque application stocke ses données dans des tables relationnelles.

    Quels sont les deux services Azure qui sont des services de base de données relationnelle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure Cosmos DB" }
    - { id: b, text: "Azure SQL Managed Instance" }
    - { id: c, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
    - { id: d, text: { en: "Azure Database for MySQL", fr: "Azure Database pour MySQL" } }
    - { id: e, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Azure SQL Managed Instance belongs to Azure SQL, the family of relational database services based on the SQL Server database engine. Azure Database for MySQL is one of the managed services that Azure provides for open-source relational database systems."
    fr: "Azure SQL Managed Instance appartient à Azure SQL, la famille de services de base de données relationnelle fondés sur le moteur de base de données SQL Server. Azure Database pour MySQL est l'un des services managés qu'Azure fournit pour les systèmes de base de données relationnelle open source."
  options:
    a:
      en: "Azure Cosmos DB is a non-relational (NoSQL) database that stores documents, key-value pairs, column families and graphs."
      fr: "Azure Cosmos DB est une base de données non relationnelle (NoSQL) qui stocke des documents, des paires clé-valeur, des familles de colonnes et des graphes."
    c:
      en: "Despite its name, Azure Table storage is a non-relational key-value store: its tables have no relational schema."
      fr: "Malgré son nom, le Stockage Table Azure est un magasin clé-valeur non relationnel : ses tables n'ont pas de schéma relationnel."
    e:
      en: "Azure Blob Storage stores binary files and other unstructured data; it isn't a database."
      fr: "Le Stockage Blob Azure stocke des fichiers binaires et d'autres données non structurées ; ce n'est pas une base de données."
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
