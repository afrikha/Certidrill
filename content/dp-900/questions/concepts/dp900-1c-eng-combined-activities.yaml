id: dp900-1c-eng-combined-activities
objective: "1.4.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum plans three activities for a new Internet of Things (IoT) project:

    1. Ingest the stream of sensor readings into a data lake.
    2. Remove the invalid readings while the data is loaded.
    3. Design a dashboard that shows the average temperature of each site.

    Which activities are the responsibility of the data engineer?
  fr: |
    Adatum prévoit trois activités pour un nouveau projet Internet des objets (IoT) :

    1. Ingérer le flux des relevés de capteurs dans un lac de données.
    2. Supprimer les relevés non valides pendant le chargement des données.
    3. Concevoir un tableau de bord qui affiche la température moyenne de chaque site.

    Quelles activités relèvent de la responsabilité de l'ingénieur de données ?
body:
  options:
    - id: a
      text: { en: "1 only", fr: "1 uniquement" }
    - id: b
      text: { en: "3 only", fr: "3 uniquement" }
    - id: c
      text: { en: "1 and 2 only", fr: "1 et 2 uniquement" }
    - id: d
      text: { en: "1, 2, and 3", fr: "1, 2 et 3" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data engineer designs and implements data ingestion pipelines, including for data streams (activity 1), and the cleansing activities that are applied to the data (activity 2). Designing a dashboard (activity 3) is the work of a data analyst, who turns the data into visualizations.
    fr: |
      Un ingénieur de données conçoit et implémente les pipelines d'ingestion de données, y compris pour les flux de données (activité 1), ainsi que les activités de nettoyage appliquées aux données (activité 2). La conception d'un tableau de bord (activité 3) est le travail d'un analyste de données, qui transforme les données en visualisations.
  options:
    a: { en: "Cleansing the data while it is loaded (activity 2) is also a data engineer task.", fr: "Le nettoyage des données pendant leur chargement (activité 2) est aussi une tâche d'ingénieur de données." }
    b: { en: "A dashboard is a visualization, which a data analyst creates; activities 1 and 2 are the engineer's.", fr: "Un tableau de bord est une visualisation, que crée un analyste de données ; les activités 1 et 2 reviennent à l'ingénieur." }
    d: { en: "Activity 3 is the work of a data analyst, not of a data engineer.", fr: "L'activité 3 est le travail d'un analyste de données, pas d'un ingénieur de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
