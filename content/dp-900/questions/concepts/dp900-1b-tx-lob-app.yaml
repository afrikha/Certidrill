id: dp900-1b-tx-lob-app
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which type of solution is an OLTP system typically used to support?
  fr: |
    Quel type de solution un système OLTP sert-il généralement à prendre en charge ?
body:
  options:
    - { id: a, text: { en: "A line-of-business application that processes live business data", fr: "Une application métier qui traite des données d'entreprise en direct" } }
    - { id: b, text: { en: "A dashboard that displays the sales trends of the last five years", fr: "Un tableau de bord qui affiche les tendances des ventes des cinq dernières années" } }
    - { id: c, text: { en: "A notebook in which data scientists explore raw data files", fr: "Un notebook dans lequel des scientifiques des données explorent des fichiers de données brutes" } }
    - { id: d, text: { en: "A report that summarizes the revenue by region and by quarter", fr: "Un rapport qui synthétise le chiffre d'affaires par région et par trimestre" } }
answer: { optionId: a }
explanation:
  correct:
    en: "OLTP systems typically support live applications that process business data, often called line-of-business (LOB) applications, such as point-of-sale, banking or order-entry applications. These applications create, retrieve, update and delete records as the business operates."
    fr: "Les systèmes OLTP prennent généralement en charge des applications en production qui traitent des données d'entreprise, souvent appelées applications métier (LOB), comme les applications de point de vente, de banque ou de saisie de commandes. Ces applications créent, récupèrent, mettent à jour et suppriment des enregistrements au fil de l'activité."
  options:
    b:
      en: "A dashboard of trends over five years reads historical data: it is an analytical workload."
      fr: "Un tableau de bord de tendances sur cinq ans lit des données historiques : c'est une charge de travail analytique."
    c:
      en: "Exploring raw data files in a data lake is an analytical activity of data scientists."
      fr: "L'exploration de fichiers de données brutes dans un lac de données est une activité analytique des scientifiques des données."
    d:
      en: "A report that summarizes revenue aggregates recorded data: it is an analytical workload."
      fr: "Un rapport qui synthétise le chiffre d'affaires agrège des données enregistrées : c'est une charge de travail analytique."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
