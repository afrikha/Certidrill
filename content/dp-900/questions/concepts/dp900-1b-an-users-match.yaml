id: dp900-1b-an-users-match
objective: "1.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Different people use different parts of an analytical solution. Match each activity to the people who typically perform it.

    To answer, drag the appropriate group of people to each activity. Each group may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Des publics différents utilisent des parties différentes d'une solution analytique. Associez chaque activité aux personnes qui l'effectuent généralement.

    Pour répondre, faites glisser le groupe de personnes approprié vers chaque activité. Chaque groupe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dba, text: { en: "Database administrators", fr: "Administrateurs de base de données" } }
    - { id: ds, text: { en: "Data scientists", fr: "Scientifiques des données" } }
    - { id: da, text: { en: "Data analysts", fr: "Analystes de données" } }
    - { id: bu, text: { en: "Business users", fr: "Utilisateurs professionnels" } }
  targets:
    - id: t1
      text: { en: "Consume pre-aggregated data from an analytical model in the form of reports or dashboards.", fr: "Consommer les données préagrégées d'un modèle analytique sous forme de rapports ou de tableaux de bord." }
    - id: t2
      text: { en: "Work directly with the data files in a data lake to explore and model the data.", fr: "Travailler directement avec les fichiers de données d'un lac de données pour explorer et modéliser les données." }
    - id: t3
      text: { en: "Query the tables of the data warehouse to produce complex reports and visualizations.", fr: "Interroger les tables de l'entrepôt de données pour produire des rapports et des visualisations complexes." }
answer:
  mapping: { t1: bu, t2: ds, t3: da }
explanation:
  correct:
    en: "Business users consume pre-aggregated data from an analytical model as reports or dashboards. Data scientists might work directly with the data files of a data lake to explore and model data. Data analysts might query tables directly in the data warehouse to produce complex reports and visualizations."
    fr: "Les utilisateurs professionnels consomment les données préagrégées d'un modèle analytique sous forme de rapports ou de tableaux de bord. Les scientifiques des données peuvent travailler directement avec les fichiers de données d'un lac de données pour explorer et modéliser les données. Les analystes de données peuvent interroger directement les tables de l'entrepôt de données pour produire des rapports et des visualisations complexes."
  options:
    dba:
      en: "Database administrators provision and manage database systems; they aren't the typical consumers of the analytical layers."
      fr: "Les administrateurs de base de données provisionnent et gèrent les systèmes de base de données ; ils ne sont pas les consommateurs habituels des couches analytiques."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
