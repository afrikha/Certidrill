id: dp900-1a-unstr-source-pick
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Relecloud collects data from four systems.

    Which system produces unstructured data?
  fr: |
    Relecloud collecte des données auprès de quatre systèmes.

    Quel système produit des données non structurées ?
body:
  options:
    - { id: a, text: { en: "A point-of-sale system that writes each sale as a row of a table", fr: "Un système de point de vente qui écrit chaque vente sous forme de ligne d'une table" } }
    - { id: b, text: { en: "A web application that writes each user profile as a JSON document", fr: "Une application web qui écrit chaque profil d'utilisateur sous forme de document JSON" } }
    - { id: c, text: { en: "A payroll system that exports a CSV file with the same fields on every line", fr: "Un système de paie qui exporte un fichier CSV avec les mêmes champs sur chaque ligne" } }
    - { id: d, text: { en: "A security system that records the video footage of the cameras", fr: "Un système de sécurité qui enregistre les images vidéo des caméras" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Video data has no specific structure: it is unstructured data. The three other systems produce records made of fields."
    fr: "Les données vidéo n'ont pas de structure spécifique : ce sont des données non structurées. Les trois autres systèmes produisent des enregistrements composés de champs."
  options:
    a:
      en: "Rows of a table follow a fixed schema: structured data."
      fr: "Les lignes d'une table suivent un schéma fixe : données structurées."
    b:
      en: "A JSON document has named fields: it is structured or semi-structured data, never unstructured."
      fr: "Un document JSON a des champs nommés : ce sont des données structurées ou semi-structurées, jamais non structurées."
    c:
      en: "A CSV file with the same fields on every line holds structured data."
      fr: "Un fichier CSV avec les mêmes champs sur chaque ligne contient des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
