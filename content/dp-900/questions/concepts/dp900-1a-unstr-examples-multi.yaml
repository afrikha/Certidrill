id: dp900-1a-unstr-examples-multi
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two data sets are examples of unstructured data?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux jeux de données qui sont des exemples de données non structurées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A table of exam results with the same columns for every student", fr: "Une table de résultats d'examen avec les mêmes colonnes pour chaque étudiant" } }
    - { id: b, text: { en: "Video recordings of training sessions", fr: "Des enregistrements vidéo de sessions de formation" } }
    - { id: c, text: { en: "JSON documents in which the fields differ between customers", fr: "Des documents JSON dont les champs diffèrent d'un client à l'autre" } }
    - { id: d, text: { en: "A CSV file of daily exchange rates", fr: "Un fichier CSV de taux de change quotidiens" } }
    - { id: e, text: { en: "Audio recordings of telephone interviews", fr: "Des enregistrements audio d'entretiens téléphoniques" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Video and audio recordings have no specific structure: nothing divides their content into fields. They are unstructured data."
    fr: "Les enregistrements vidéo et audio n'ont pas de structure spécifique : rien ne découpe leur contenu en champs. Ce sont des données non structurées."
  options:
    a:
      en: "A table with the same columns for every row is structured data."
      fr: "Une table avec les mêmes colonnes pour chaque ligne contient des données structurées."
    c:
      en: "JSON documents whose fields vary are semi-structured data."
      fr: "Des documents JSON dont les champs varient sont des données semi-structurées."
    d:
      en: "A CSV file has the same fields on every line: it holds structured data."
      fr: "Un fichier CSV a les mêmes champs sur chaque ligne : il contient des données structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
