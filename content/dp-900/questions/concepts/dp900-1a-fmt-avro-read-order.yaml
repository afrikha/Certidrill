id: dp900-1a-fmt-avro-read-order
objective: "1.2.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An application must extract the fields of the records that are stored in an Avro file.

    Which three actions does the application perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application doit extraire les champs des enregistrements stockés dans un fichier Avro.

    Quelles sont les trois actions que l'application effectue dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rg, text: { en: "Read the metadata of the row groups to locate the chunks of the requested columns.", fr: "Lire les métadonnées des groupes de lignes pour localiser les blocs des colonnes demandées." } }
    - { id: parse, text: { en: "Parse the binary data of the records to extract the fields.", fr: "Analyser les données binaires des enregistrements pour en extraire les champs." } }
    - { id: hdr, text: { en: "Read the header of the file.", fr: "Lire l'en-tête du fichier." } }
    - { id: log, text: { en: "Read the transaction log to find the current version of the data.", fr: "Lire le journal des transactions pour trouver la version actuelle des données." } }
    - { id: json, text: { en: "Get the structure of the data from the JSON that the header contains.", fr: "Obtenir la structure des données à partir du JSON que contient l'en-tête." } }
    - { id: split, text: { en: "Split each line of text at the field delimiter.", fr: "Découper chaque ligne de texte au niveau du délimiteur de champs." } }
answer:
  sequence: [ hdr, json, parse ]
explanation:
  correct:
    en: "Avro is a row-based format in which each file starts with a header, stored as JSON, that describes the structure of the data; the records themselves are stored as binary. An application therefore reads the header, takes the structure from its JSON, and uses that structure to parse the binary data and extract the fields."
    fr: "Avro est un format orienté ligne dans lequel chaque fichier commence par un en-tête, stocké en JSON, qui décrit la structure des données ; les enregistrements eux-mêmes sont stockés en binaire. Une application lit donc l'en-tête, tire la structure de son JSON, puis utilise cette structure pour analyser les données binaires et en extraire les champs."
  options:
    rg:
      en: "Row groups, column chunks and their metadata belong to the Parquet format."
      fr: "Les groupes de lignes, les blocs de colonnes et leurs métadonnées appartiennent au format Parquet."
    log:
      en: "The transaction log is what Delta Lake adds to Parquet files; an Avro file has none."
      fr: "Le journal des transactions est ce que Delta Lake ajoute aux fichiers Parquet ; un fichier Avro n'en a pas."
    split:
      en: "Splitting lines at a delimiter is how delimited text such as CSV is read; Avro records are binary."
      fr: "Découper des lignes au niveau d'un délimiteur est la façon de lire du texte délimité comme le CSV ; les enregistrements Avro sont binaires."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
