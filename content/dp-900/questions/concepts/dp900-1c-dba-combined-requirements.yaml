id: dp900-1c-dba-combined-requirements
objective: "1.4.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys lists three requirements for its order database:

    1. The database must be restorable to its state before an accidental deletion.
    2. Each night, the orders must be copied to a data warehouse and reformatted for analysis.
    3. Only the members of the finance team must be able to read the Payments table.

    Which requirements are the responsibility of the database administrator?
  fr: |
    Tailspin Toys énumère trois exigences pour sa base de données de commandes :

    1. La base de données doit pouvoir être restaurée dans son état antérieur à une suppression accidentelle.
    2. Chaque nuit, les commandes doivent être copiées vers un entrepôt de données et remises en forme pour l'analyse.
    3. Seuls les membres de l'équipe financière doivent pouvoir lire la table Payments.

    Quelles exigences relèvent de la responsabilité de l'administrateur de base de données ?
body:
  options:
    - id: a
      text: { en: "1 only", fr: "1 uniquement" }
    - id: b
      text: { en: "1 and 3 only", fr: "1 et 3 uniquement" }
    - id: c
      text: { en: "2 and 3 only", fr: "2 et 3 uniquement" }
    - id: d
      text: { en: "1, 2, and 3", fr: "1, 2 et 3" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Backup and recovery (requirement 1) and the security of the data, including who can read a table (requirement 3), are responsibilities of the database administrator. Copying data to a data warehouse and transforming it on the way (requirement 2) is a pipeline, which a data engineer implements.
    fr: |
      La sauvegarde et la récupération (exigence 1) et la sécurité des données, y compris qui peut lire une table (exigence 3), sont des responsabilités de l'administrateur de base de données. Copier des données vers un entrepôt de données en les transformant au passage (exigence 2) est un pipeline, qu'implémente un ingénieur de données.
  options:
    a: { en: "Requirement 3 is also the administrator's: the role grants or denies access to the data.", fr: "L'exigence 3 revient aussi à l'administrateur : ce rôle accorde ou refuse l'accès aux données." }
    c: { en: "Requirement 2 is a data engineer task, and requirement 1 (recovery) is missing.", fr: "L'exigence 2 est une tâche d'ingénieur de données, et l'exigence 1 (récupération) manque." }
    d: { en: "Requirement 2 describes a pipeline that transfers and transforms data, which is the work of a data engineer.", fr: "L'exigence 2 décrit un pipeline qui transfère et transforme des données, ce qui est le travail d'un ingénieur de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
