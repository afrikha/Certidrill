id: dp900-1c-eng-vs-analyst-purpose
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A data engineer and a data analyst both work on the sales data of Fabrikam.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur de données et un analyste de données travaillent tous deux sur les données de ventes de Fabrikam.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The data engineer cleanses and transforms the data in order to [[e]].

      The data analyst then works with the data in order to [[a]].
    fr: |
      L'ingénieur de données nettoie et transforme les données afin de [[e]].

      L'analyste de données travaille ensuite sur les données afin de [[a]].
  slots:
    - id: e
      options:
        - { id: report, text: { en: "create reports and visualizations that inform decisions", fr: "créer des rapports et des visualisations qui éclairent les décisions" } }
        - { id: recover, text: { en: "recover it after a disaster or a human error", fr: "les récupérer après un sinistre ou une erreur humaine" } }
        - { id: load, text: { en: "load it into the data stores of analytical workloads", fr: "les charger dans les magasins de données des charges de travail analytiques" } }
        - { id: access, text: { en: "control which users are allowed to access it", fr: "contrôler quels utilisateurs sont autorisés à y accéder" } }
    - id: a
      options:
        - { id: report, text: { en: "create reports and visualizations that inform decisions", fr: "créer des rapports et des visualisations qui éclairent les décisions" } }
        - { id: recover, text: { en: "recover it after a disaster or a human error", fr: "les récupérer après un sinistre ou une erreur humaine" } }
        - { id: load, text: { en: "load it into the data stores of analytical workloads", fr: "les charger dans les magasins de données des charges de travail analytiques" } }
        - { id: access, text: { en: "control which users are allowed to access it", fr: "contrôler quels utilisateurs sont autorisés à y accéder" } }
answer:
  values: { e: load, a: report }
explanation:
  correct:
    en: |
      Both roles work on the data, but for different purposes. The data engineer implements the cleansing and transformation activities of the pipelines that feed the data stores for analytical workloads. The data analyst then explores that data and builds the reports and visualizations that enable informed decisions.
    fr: |
      Les deux rôles travaillent sur les données, mais dans des buts différents. L'ingénieur de données implémente les activités de nettoyage et de transformation des pipelines qui alimentent les magasins de données des charges de travail analytiques. L'analyste de données explore ensuite ces données et crée les rapports et les visualisations qui permettent des décisions éclairées.
  options:
    recover: { en: "Recovering data after a disaster or an error is the purpose of the backup and recovery plans of the database administrator.", fr: "La récupération des données après un sinistre ou une erreur est le but des plans de sauvegarde et de récupération de l'administrateur de base de données." }
    access: { en: "Granting or denying access to data is the security work of the database administrator.", fr: "Accorder ou refuser l'accès aux données est le travail de sécurité de l'administrateur de base de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
