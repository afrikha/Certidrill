id: dp900-1a-struct-rows-columns-count
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A table named **Employee** has the columns **EmployeeID**, **Name** and **HireDate**. The table stores the data of 500 employees.

    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Employee** comporte les colonnes **EmployeeID**, **Name** et **HireDate**. La table stocke les données de 500 employés.

    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The table contains [[rows]], each of which represents one instance of the entity, and [[cols]], each of which represents one attribute.
    fr: |
      La table contient [[rows]], dont chacune représente une instance de l'entité, et [[cols]], dont chacune représente un attribut.
  slots:
    - id: rows
      options:
        - { id: r3, text: { en: "3 rows", fr: "3 lignes" } }
        - { id: r500, text: { en: "500 rows", fr: "500 lignes" } }
        - { id: r1500, text: { en: "1,500 rows", fr: "1 500 lignes" } }
    - id: cols
      options:
        - { id: c3, text: { en: "3 columns", fr: "3 colonnes" } }
        - { id: c500, text: { en: "500 columns", fr: "500 colonnes" } }
        - { id: c1500, text: { en: "1,500 columns", fr: "1 500 colonnes" } }
answer:
  values: { rows: r500, cols: c3 }
explanation:
  correct:
    en: "In a tabular schema, a row represents one instance of the entity and a column represents one attribute. The table therefore has one row for each of the 500 employees and one column for each of the three attributes."
    fr: "Dans un schéma tabulaire, une ligne représente une instance de l'entité et une colonne représente un attribut. La table a donc une ligne pour chacun des 500 employés et une colonne pour chacun des trois attributs."
  options:
    r1500:
      en: "1,500 is the number of values (500 employees times 3 attributes), not the number of rows."
      fr: "1 500 est le nombre de valeurs (500 employés fois 3 attributs), pas le nombre de lignes."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
