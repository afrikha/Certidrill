id: dp900-1c-dba-scope-statements
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The responsibilities of a database administrator cover cloud-based database systems as well as on-premises ones.
        fr: Les responsabilités d'un administrateur de base de données couvrent les systèmes de base de données cloud aussi bien que locaux.
    - id: s2
      text:
        en: Building the pipelines that load a data warehouse is one of the main responsibilities of a database administrator.
        fr: La création des pipelines qui chargent un entrepôt de données est l'une des principales responsabilités d'un administrateur de base de données.
    - id: s3
      text:
        en: A database administrator is responsible for the design and implementation of database systems.
        fr: Un administrateur de base de données est responsable de la conception et de l'implémentation des systèmes de base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A database administrator is responsible for the design, implementation, maintenance, and operational aspects of database systems, whether they run on-premises or in the cloud. Pipelines that transfer data into a data warehouse are implemented by data engineers, not by database administrators.
    fr: |
      Un administrateur de base de données est responsable de la conception, de l'implémentation, de la maintenance et de l'exploitation des systèmes de base de données, qu'ils soient locaux ou dans le cloud. Les pipelines qui transfèrent des données vers un entrepôt de données sont implémentés par les ingénieurs de données, pas par les administrateurs de base de données.
  options:
    s2: { en: "Data ingestion pipelines are designed and implemented by data engineers.", fr: "Les pipelines d'ingestion de données sont conçus et implémentés par les ingénieurs de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
