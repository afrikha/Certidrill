id: dp900-1b-ds-primary-key
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a relational database, a table named Customers stores one row for each customer.

    What uniquely identifies each row, so that the rows of other tables can reference it?
  fr: |
    Dans une base de données relationnelle, une table nommée Customers stocke une ligne par client.

    Qu'est-ce qui identifie chaque ligne de façon unique, de sorte que les lignes d'autres tables puissent y faire référence ?
body:
  options:
    - { id: a, text: { en: "A column family", fr: "Une famille de colonnes" } }
    - { id: b, text: { en: "A primary key", fr: "Une clé primaire" } }
    - { id: c, text: { en: "A row group", fr: "Un groupe de lignes" } }
    - { id: d, text: { en: "A node", fr: "Un nœud" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Each instance of an entity in a relational table is assigned a primary key that uniquely identifies it. Other tables store that key value to reference the row: a sales order, for example, stores the primary key of the customer who placed it."
    fr: "Chaque instance d'une entité dans une table relationnelle reçoit une clé primaire qui l'identifie de façon unique. Les autres tables stockent la valeur de cette clé pour faire référence à la ligne : une commande, par exemple, stocke la clé primaire du client qui l'a passée."
  options:
    a:
      en: "A column family is a group of logically related columns in a column family database; it doesn't identify a row."
      fr: "Une famille de colonnes est un groupe de colonnes logiquement liées dans une base de données de familles de colonnes ; elle n'identifie pas une ligne."
    c:
      en: "A row group is part of the structure of a Parquet file, not a way to identify a row of a relational table."
      fr: "Un groupe de lignes fait partie de la structure d'un fichier Parquet ; ce n'est pas un moyen d'identifier une ligne d'une table relationnelle."
    d:
      en: "A node represents an entity in a graph database, not a row in a relational table."
      fr: "Un nœud représente une entité dans une base de données de graphes, pas une ligne d'une table relationnelle."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
