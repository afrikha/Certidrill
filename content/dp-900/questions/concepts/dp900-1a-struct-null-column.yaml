id: dp900-1a-struct-null-column
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A table named **Customer** has a column named **MiddleName**. Some customers have no middle name.

    How does the table represent these customers?
  fr: |
    Une table nommée **Customer** comporte une colonne nommée **MiddleName**. Certains clients n'ont pas de deuxième prénom.

    Comment la table représente-t-elle ces clients ?
body:
  options:
    - { id: a, text: { en: "Their rows are stored in a second table that has no MiddleName column.", fr: "Leurs lignes sont stockées dans une seconde table sans colonne MiddleName." } }
    - { id: b, text: { en: "Their rows omit the MiddleName column.", fr: "Leurs lignes ne comportent pas la colonne MiddleName." } }
    - { id: c, text: { en: "Their rows are converted to JSON documents.", fr: "Leurs lignes sont converties en documents JSON." } }
    - { id: d, text: { en: "Their rows have an empty (NULL) MiddleName column.", fr: "Leurs lignes ont une colonne MiddleName vide (NULL)." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Every row of a table has the same columns, but a column doesn't need a value in every row. For a customer without a middle name, the MiddleName column is simply empty (NULL), and the data stays structured."
    fr: "Toutes les lignes d'une table ont les mêmes colonnes, mais une colonne n'a pas besoin d'une valeur dans chaque ligne. Pour un client sans deuxième prénom, la colonne MiddleName est simplement vide (NULL), et les données restent structurées."
  options:
    a:
      en: "The Customer table holds all the customers; a missing value doesn't require another table."
      fr: "La table Customer contient tous les clients ; une valeur manquante n'exige pas une autre table."
    b:
      en: "A row can't drop a column: all the rows of a table share the same columns."
      fr: "Une ligne ne peut pas abandonner une colonne : toutes les lignes d'une table partagent les mêmes colonnes."
    c:
      en: "A missing value doesn't change the format of the data; the row stays in the table."
      fr: "Une valeur manquante ne change pas le format des données ; la ligne reste dans la table."
references:
  - title: "Understand relational data"
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/2-understand-relational-data
