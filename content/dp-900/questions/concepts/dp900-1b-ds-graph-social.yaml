id: dp900-1b-ds-graph-social
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is building a social networking app. The app must store the members and the connections between them, and it must find the friends of a member's friends.

    Which type of data store should Fabrikam use?
  fr: |
    Fabrikam crée une application de réseau social. L'application doit stocker les membres et les liens entre eux, et elle doit retrouver les amis des amis d'un membre.

    Quel type de magasin de données Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A key-value database", fr: "Une base de données clé-valeur" } }
    - { id: b, text: { en: "A column family database", fr: "Une base de données de familles de colonnes" } }
    - { id: c, text: { en: "A document database", fr: "Une base de données de documents" } }
    - { id: d, text: { en: "A graph database", fr: "Une base de données de graphes" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A graph database stores entities as nodes and connects them with links that define the relationships between them. Following a chain of relationships, such as the friends of a member's friends, is the kind of query that this type of store is built for."
    fr: "Une base de données de graphes stocke les entités sous forme de nœuds et les relie par des liens qui définissent les relations entre elles. Suivre une chaîne de relations, comme les amis des amis d'un membre, est le type de requête pour lequel ce magasin est conçu."
  options:
    a:
      en: "A key-value database returns a value from its key; it doesn't store or follow relationships between records."
      fr: "Une base de données clé-valeur renvoie une valeur à partir de sa clé ; elle ne stocke pas les relations entre les enregistrements et ne permet pas de les suivre."
    b:
      en: "A column family database stores rows whose columns are divided into groups of related columns; it doesn't model the links between entities."
      fr: "Une base de données de familles de colonnes stocke des lignes dont les colonnes sont réparties en groupes de colonnes liées ; elle ne modélise pas les liens entre les entités."
    c:
      en: "A document database stores each member as a JSON document, but it isn't designed to traverse the relationships between documents."
      fr: "Une base de données de documents stocke chaque membre sous forme de document JSON, mais elle n'est pas conçue pour parcourir les relations entre les documents."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
