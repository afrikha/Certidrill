id: dp900-1a-semi-extra-fields
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application stores each customer as a JSON document. A new customer has a field named **company** that no existing customer has.

    How does semi-structured data accommodate the new customer?
  fr: |
    Une application stocke chaque client sous forme de document JSON. Un nouveau client a un champ nommé **company** qu'aucun client existant ne possède.

    Comment les données semi-structurées prennent-elles en charge ce nouveau client ?
body:
  options:
    - { id: a, text: { en: "The company field appears only in the document of the new customer.", fr: "Le champ company figure uniquement dans le document du nouveau client." } }
    - { id: b, text: { en: "The company field is added, empty, to all the existing documents.", fr: "Le champ company est ajouté, vide, à tous les documents existants." } }
    - { id: c, text: { en: "The company field is moved to a separate table and referenced by a key.", fr: "Le champ company est déplacé dans une table distincte et référencé par une clé." } }
    - { id: d, text: { en: "The company field is removed because the schema doesn't define it.", fr: "Le champ company est supprimé, car le schéma ne le définit pas." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Semi-structured data allows variation between the instances of an entity. Each JSON document carries its own fields, so the new document simply contains company and the existing documents stay as they are."
    fr: "Les données semi-structurées autorisent des variations entre les instances d'une entité. Chaque document JSON porte ses propres champs : le nouveau document contient simplement company, et les documents existants restent tels quels."
  options:
    b:
      en: "Adding the field to every record, empty where it has no value, is how a table with a fixed schema behaves."
      fr: "Ajouter le champ à tous les enregistrements, vide là où il n'a pas de valeur, est le comportement d'une table à schéma fixe."
    c:
      en: "Separate tables linked by keys belong to the relational model of structured data."
      fr: "Des tables distinctes reliées par des clés relèvent du modèle relationnel des données structurées."
    d:
      en: "No fixed schema restricts the fields of a document, so nothing removes the field."
      fr: "Aucun schéma fixe ne restreint les champs d'un document : rien ne supprime donc le champ."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
