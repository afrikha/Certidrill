id: dp900-1c-dba-restore-after-error
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An employee of Contoso accidentally deletes the rows of an order table in a production database.

    Which role is responsible for restoring the data from a backup copy?
  fr: |
    Un employé de Contoso supprime par erreur les lignes d'une table de commandes dans une base de données de production.

    Quel rôle est responsable de la restauration des données à partir d'une copie de sauvegarde ?
body:
  options:
    - id: a
      text: { en: "Data analyst", fr: "Analyste de données" }
    - id: b
      text: { en: "Database administrator", fr: "Administrateur de base de données" }
    - id: c
      text: { en: "Data engineer", fr: "Ingénieur de données" }
    - id: d
      text: { en: "AI engineer", fr: "Ingénieur IA" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The database administrator stores backup copies of the data and restores the data after a failure. The role implements the backup and recovery policies that make it possible to recover from a disaster or from a human error such as this one.
    fr: |
      L'administrateur de base de données stocke des copies de sauvegarde des données et restaure les données après une défaillance. Ce rôle met en œuvre les stratégies de sauvegarde et de récupération qui permettent de se relever d'un sinistre ou d'une erreur humaine comme celle-ci.
  options:
    a: { en: "A data analyst explores and analyzes data to create reports and visualizations; the role does not restore databases.", fr: "Un analyste de données explore et analyse les données pour créer des rapports et des visualisations ; ce rôle ne restaure pas les bases de données." }
    c: { en: "A data engineer builds the pipelines that transfer and transform data between systems; backup and recovery of a database belong to the administrator.", fr: "Un ingénieur de données crée les pipelines qui transfèrent et transforment les données entre les systèmes ; la sauvegarde et la récupération d'une base de données relèvent de l'administrateur." }
    d: { en: "An AI engineer builds AI-powered features and workflows; the role does not operate the databases.", fr: "Un ingénieur IA crée des fonctionnalités et des flux de travail d'IA ; ce rôle n'exploite pas les bases de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
