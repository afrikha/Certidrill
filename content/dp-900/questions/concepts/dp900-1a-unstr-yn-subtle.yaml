id: dp900-1a-unstr-yn-subtle
objective: "1.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A scanned letter that is attached to an email as an image is unstructured data."
        fr: "Une lettre numérisée jointe à un e-mail sous forme d'image constitue des données non structurées."
    - id: s2
      text:
        en: "A text document is structured data, because it consists of readable characters."
        fr: "Un document texte constitue des données structurées, car il est composé de caractères lisibles."
    - id: s3
      text:
        en: "Every binary file contains unstructured data."
        fr: "Tout fichier binaire contient des données non structurées."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "An image of a letter has no fields: it is unstructured data. A text document is unstructured too, because readable characters don't divide the content into fields with a fixed schema. Binary doesn't mean unstructured: formats such as Avro and Parquet store records with a defined structure in binary files."
    fr: "L'image d'une lettre n'a pas de champs : ce sont des données non structurées. Un document texte est lui aussi non structuré, car des caractères lisibles ne découpent pas le contenu en champs selon un schéma fixe. Binaire ne veut pas dire non structuré : des formats comme Avro et Parquet stockent dans des fichiers binaires des enregistrements dont la structure est définie."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
