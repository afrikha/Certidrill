id: dp900-1c-dba-deny-statement
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A database administrator at Fabrikam runs the statement `DENY SELECT ON Salaries TO Interns;` in the human resources database.

    Which responsibility of the database administrator does this statement illustrate?
  fr: |
    Un administrateur de base de données de Fabrikam exécute l'instruction `DENY SELECT ON Salaries TO Interns;` dans la base de données des ressources humaines.

    Quelle responsabilité de l'administrateur de base de données cette instruction illustre-t-elle ?
body:
  options:
    - id: a
      text: { en: "Managing the security of the data", fr: "Gérer la sécurité des données" }
    - id: b
      text: { en: "Planning backup and recovery", fr: "Planifier la sauvegarde et la récupération" }
    - id: c
      text: { en: "Optimizing database performance", fr: "Optimiser les performances de la base de données" }
    - id: d
      text: { en: "Ensuring database availability", fr: "Assurer la disponibilité de la base de données" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `DENY` blocks a permission: here, the Interns principal can no longer read the Salaries table. Granting or denying users access to data is how the database administrator manages the security of the data in the database.
    fr: |
      `DENY` bloque une autorisation : ici, le principal Interns ne peut plus lire la table Salaries. Accorder ou refuser l'accès aux données, c'est ainsi que l'administrateur de base de données gère la sécurité des données dans la base de données.
  options:
    b: { en: "Backup and recovery is a responsibility of the administrator, but a permission statement does not create or restore a backup.", fr: "La sauvegarde et la récupération sont une responsabilité de l'administrateur, mais une instruction d'autorisation ne crée ni ne restaure aucune sauvegarde." }
    c: { en: "The statement changes who can read a table; it has no effect on how fast queries run.", fr: "L'instruction modifie qui peut lire une table ; elle n'a aucun effet sur la rapidité des requêtes." }
    d: { en: "Availability is about keeping the database online; the statement only restricts access for one group.", fr: "La disponibilité consiste à maintenir la base de données en ligne ; l'instruction restreint seulement l'accès d'un groupe." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
  - title: Explore SQL
    url: https://learn.microsoft.com/en-us/training/modules/explore-relational-data-offerings/4-query-with-sql
