id: dp900-1b-ds-relational-yn
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about relational databases, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les bases de données relationnelles, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The tables of a relational database represent entities, such as customers, products or sales orders.
        fr: Les tables d'une base de données relationnelle représentent des entités, comme des clients, des produits ou des commandes.
    - id: s2
      text:
        en: The SQL language is used only by Microsoft database systems.
        fr: Le langage SQL est utilisé uniquement par les systèmes de base de données de Microsoft.
    - id: s3
      text:
        en: A row of a table can reference a row of another table by storing its primary key value.
        fr: Une ligne d'une table peut faire référence à une ligne d'une autre table en stockant la valeur de sa clé primaire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A relational database stores data in tables that represent entities, and each instance of an entity has a primary key that other tables can store to reference it. SQL is based on an ANSI standard, so it is similar across many database systems, not only those of Microsoft."
    fr: "Une base de données relationnelle stocke les données dans des tables qui représentent des entités, et chaque instance d'une entité a une clé primaire que les autres tables peuvent stocker pour y faire référence. SQL repose sur une norme ANSI : il est donc similaire dans de nombreux systèmes de base de données, pas seulement ceux de Microsoft."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
