id: dp900-1c-ana-task-plan
objective: "1.4.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Litware plans a project around its sales data. The planned tasks are shown in the following table.

    Answer each prompt by selecting the appropriate task.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware planifie un projet autour de ses données de ventes. Les tâches prévues figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la tâche appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The task to assign to the data analyst", fr: "La tâche à attribuer à l'analyste de données" }
    - id: p2
      text: { en: "The task to assign to the data engineer", fr: "La tâche à attribuer à l'ingénieur de données" }
  grid:
    header: [{ en: "Task", fr: "Tâche" }, { en: "Description", fr: "Description" }]
    rows:
      - [{ text: "1" }, { text: { en: "Schedule the backups of the sales database and test a restore", fr: "Planifier les sauvegardes de la base de données des ventes et tester une restauration" }, area: t1 }]
      - [{ text: "2" }, { text: { en: "Transform the raw sales files into clean tables while they are loaded into the data warehouse", fr: "Transformer les fichiers de ventes bruts en tables propres pendant leur chargement dans l'entrepôt de données" }, area: t2 }]
      - [{ text: "3" }, { text: { en: "Build a model of the data warehouse tables and a report on sales trends", fr: "Créer un modèle des tables de l'entrepôt de données et un rapport sur les tendances des ventes" }, area: t3 }]
      - [{ text: "4" }, { text: { en: "Integrate a large language model so that users can chat over the sales data", fr: "Intégrer un grand modèle de langage pour que les utilisateurs puissent converser avec les données de ventes" }, area: t4 }]
answer:
  values: { p1: t3, p2: t2 }
explanation:
  correct:
    en: |
      Both roles transform data, at different stages. The data engineer cleanses and transforms the raw data while it is loaded into the analytical data store (task 2). The data analyst then builds the analytical model and the reports on top of that store (task 3).
    fr: |
      Les deux rôles transforment des données, à des étapes différentes. L'ingénieur de données nettoie et transforme les données brutes pendant leur chargement dans le magasin de données analytique (tâche 2). L'analyste de données crée ensuite le modèle analytique et les rapports par-dessus ce magasin (tâche 3).
  options:
    t1: { en: "Backups and restores are the responsibility of the database administrator.", fr: "Les sauvegardes et les restaurations relèvent de la responsabilité de l'administrateur de base de données." }
    t4: { en: "Integrating a large language model into a solution is the work of an AI engineer.", fr: "L'intégration d'un grand modèle de langage dans une solution est le travail d'un ingénieur IA." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
