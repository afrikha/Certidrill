id: dp900-1b-tx-storage-optimized
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is choosing a database system for an order-entry application. All day long, the application creates, retrieves, updates and deletes order records.

    For which operations should the storage of the database system be optimized?
  fr: |
    Fabrikam choisit un système de base de données pour une application de saisie de commandes. Toute la journée, l'application crée, récupère, met à jour et supprime des enregistrements de commande.

    Pour quelles opérations le stockage du système de base de données doit-il être optimisé ?
body:
  options:
    - { id: a, text: { en: "Read operations over large volumes of historical data", fr: "Les opérations de lecture sur de grands volumes de données historiques" } }
    - { id: b, text: { en: "Both read operations and write operations", fr: "Les opérations de lecture comme les opérations d'écriture" } }
    - { id: c, text: { en: "Write operations on records that are rarely read afterward", fr: "Les opérations d'écriture sur des enregistrements rarement lus ensuite" } }
    - { id: d, text: { en: "Queries that return summaries aggregated in advance", fr: "Les requêtes qui renvoient des synthèses agrégées à l'avance" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An order-entry application is a transactional (OLTP) workload: it creates, retrieves, updates and deletes records, which are the CRUD operations. OLTP solutions rely on a database system whose storage is optimized for both read and write operations."
    fr: "Une application de saisie de commandes est une charge de travail transactionnelle (OLTP) : elle crée, récupère, met à jour et supprime des enregistrements, ce sont les opérations CRUD. Les solutions OLTP s'appuient sur un système de base de données dont le stockage est optimisé à la fois pour les lectures et pour les écritures."
  options:
    a:
      en: "Reading large volumes of historical data describes an analytical data store, such as a data warehouse."
      fr: "La lecture de grands volumes de données historiques décrit un magasin de données analytique, comme un entrepôt de données."
    c:
      en: "The application also retrieves the orders, so the storage must serve reads as well as writes."
      fr: "L'application récupère aussi les commandes : le stockage doit donc servir les lectures autant que les écritures."
    d:
      en: "Summaries aggregated in advance describe a semantic model used for analysis, not a transactional database."
      fr: "Des synthèses agrégées à l'avance décrivent un modèle sémantique utilisé pour l'analyse, pas une base de données transactionnelle."
references:
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
