id: dp900-1b-an-offload-reports
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank processes transfers in an OLTP database. In the same database, analysts run long queries that aggregate five years of transfers, and these queries slow down the processing of new transfers.

    The bank wants to keep the reports without affecting the transactional system. What should the bank do?
  fr: |
    Woodgrove Bank traite des virements dans une base de données OLTP. Dans la même base de données, des analystes exécutent de longues requêtes qui agrègent cinq ans de virements, et ces requêtes ralentissent le traitement des nouveaux virements.

    La banque veut conserver les rapports sans perturber le système transactionnel. Que doit faire la banque ?
body:
  options:
    - { id: a, text: { en: "Run each report as a single transaction in the OLTP database.", fr: "Exécuter chaque rapport comme une seule transaction dans la base de données OLTP." } }
    - { id: b, text: { en: "Process the new transfers in a semantic model instead of the OLTP database.", fr: "Traiter les nouveaux virements dans un modèle sémantique plutôt que dans la base de données OLTP." } }
    - { id: c, text: { en: "Load a copy of the data into a data warehouse and run the reports there.", fr: "Charger une copie des données dans un entrepôt de données et y exécuter les rapports." } }
    - { id: d, text: { en: "Store the new transfers as files in a data lake instead of the OLTP database.", fr: "Stocker les nouveaux virements sous forme de fichiers dans un lac de données plutôt que dans la base de données OLTP." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Aggregating millions of transactions in an OLTP database is resource-intensive and can slow down or block the transactions. The usual answer is to keep the two workloads apart: operational data is extracted and loaded into an analytical data store, such as a data warehouse with a schema optimized for read operations, and the reports query that copy without disturbing the transactional system."
    fr: "Agréger des millions de transactions dans une base de données OLTP consomme beaucoup de ressources et peut ralentir ou bloquer les transactions. La réponse habituelle est de séparer les deux charges de travail : les données opérationnelles sont extraites et chargées dans un magasin de données analytique, comme un entrepôt de données dont le schéma est optimisé pour les lectures, et les rapports interrogent cette copie sans perturber le système transactionnel."
  options:
    a:
      en: "Running a report as one transaction still reads five years of data in the OLTP database, so it keeps competing with the transfers."
      fr: "Exécuter un rapport comme une seule transaction lit toujours cinq ans de données dans la base de données OLTP : le rapport reste en concurrence avec les virements."
    b:
      en: "A semantic model holds pre-aggregated data for analysis; it isn't designed to record transactions with ACID guarantees."
      fr: "Un modèle sémantique contient des données préagrégées pour l'analyse ; il n'est pas conçu pour enregistrer des transactions avec des garanties ACID."
    d:
      en: "A data lake stores files for analytics; transfers need a transactional database that is optimized for reads and writes and enforces ACID transactions."
      fr: "Un lac de données stocke des fichiers pour l'analytique ; les virements ont besoin d'une base de données transactionnelle optimisée pour les lectures et les écritures, qui impose des transactions ACID."
references:
  - title: Online transaction processing (OLTP)
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-transaction-processing
  - title: Explore analytical data processing
