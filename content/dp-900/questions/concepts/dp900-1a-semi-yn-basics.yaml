id: dp900-1a-semi-yn-basics
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Semi-structured data has no structure."
        fr: "Les données semi-structurées n'ont aucune structure."
    - id: s2
      text:
        en: "In semi-structured data, the fields can vary from one entity instance to another."
        fr: "Dans des données semi-structurées, les champs peuvent varier d'une instance d'entité à l'autre."
    - id: s3
      text:
        en: "JSON is the only format that can represent semi-structured data."
        fr: "JSON est le seul format capable de représenter des données semi-structurées."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Semi-structured data does have a structure, made of named fields, but that structure can vary between the instances of an entity. JSON is a common format for it, yet it is only one of many ways to represent semi-structured data."
    fr: "Les données semi-structurées ont bien une structure, faite de champs nommés, mais cette structure peut varier entre les instances d'une entité. JSON est un format courant pour ces données, mais ce n'est qu'une façon parmi d'autres de représenter des données semi-structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
