id: dp900-1a-struct-fixed-tabular
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Structured data adheres to a [[kind]] schema, so all of the data has the same fields or properties. Most commonly, the schema is [[shape]]: the data is represented in one or more tables.
    fr: |
      Les données structurées respectent un schéma [[kind]] : toutes les données ont donc les mêmes champs ou propriétés. Le plus souvent, le schéma est [[shape]] : les données sont représentées dans une ou plusieurs tables.
  slots:
    - id: kind
      options:
        - { id: flex, text: { en: "flexible", fr: "souple" } }
        - { id: fixed, text: { en: "fixed", fr: "fixe" } }
        - { id: hier, text: { en: "hierarchical", fr: "hiérarchique" } }
    - id: shape
      options:
        - { id: tab, text: { en: "tabular", fr: "tabulaire" } }
        - { id: nest, text: { en: "nested", fr: "imbriqué" } }
        - { id: bin, text: { en: "binary", fr: "binaire" } }
answer:
  values: { kind: fixed, shape: tab }
explanation:
  correct:
    en: "Structured data follows a fixed schema: every record has the same fields. That schema is most commonly tabular, with rows for the instances of an entity and columns for its attributes."
    fr: "Les données structurées suivent un schéma fixe : tous les enregistrements ont les mêmes champs. Ce schéma est le plus souvent tabulaire, avec des lignes pour les instances d'une entité et des colonnes pour ses attributs."
  options:
    flex:
      en: "A structure that can vary between instances is the mark of semi-structured data."
      fr: "Une structure qui peut varier d'une instance à l'autre caractérise les données semi-structurées."
    nest:
      en: "Nesting objects inside other objects is typical of hierarchical formats such as JSON, not of tables."
      fr: "L'imbrication d'objets dans d'autres objets est typique des formats hiérarchiques comme JSON, pas des tables."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
