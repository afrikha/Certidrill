id: dp900-1a-fmt-parquet-columns
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware stores billions of sales records in a data lake. Analysts run queries that read only 3 of the 60 columns. The company needs a file format in which the values of each column are stored together, so that an application can retrieve only the requested columns.

    Which file format should Litware use?
  fr: |
    Litware stocke des milliards d'enregistrements de ventes dans un lac de données. Les analystes exécutent des requêtes qui ne lisent que 3 des 60 colonnes. L'entreprise a besoin d'un format de fichier dans lequel les valeurs de chaque colonne sont stockées ensemble, afin qu'une application puisse récupérer uniquement les colonnes demandées.

    Quel format de fichier Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Avro" }
    - { id: b, text: "CSV" }
    - { id: c, text: "Parquet" }
    - { id: d, text: "JSON" }
answer: { optionId: c }
explanation:
  correct:
    en: "Parquet is a columnar format: a file contains row groups in which the data of each column is stored together, and metadata lets an application locate the right chunks and retrieve only the requested columns. It also supports efficient compression and is widely used in data lakes and lakehouses."
    fr: "Parquet est un format en colonnes : un fichier contient des groupes de lignes dans lesquels les données de chaque colonne sont stockées ensemble, et des métadonnées permettent à une application de localiser les bons blocs et de ne récupérer que les colonnes demandées. Il prend aussi en charge une compression efficace et est très utilisé dans les lacs de données et les lakehouses."
  options:
    a:
      en: "Avro is a row-based format: reading 3 columns means reading whole records."
      fr: "Avro est un format orienté ligne : lire 3 colonnes revient à lire des enregistrements entiers."
    b:
      en: "A CSV file stores whole records line by line, as text; the values of a column aren't kept together."
      fr: "Un fichier CSV stocke des enregistrements entiers ligne par ligne, en texte ; les valeurs d'une colonne ne sont pas regroupées."
    d:
      en: "JSON stores each object with all its attributes, as text; it isn't a columnar format."
      fr: "JSON stocke chaque objet avec tous ses attributs, en texte ; ce n'est pas un format en colonnes."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
