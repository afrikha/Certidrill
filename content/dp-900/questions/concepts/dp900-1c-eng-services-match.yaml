id: dp900-1c-eng-services-match
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at Woodgrove Bank is choosing the services of a new analytics architecture.

    Match each requirement to the service that meets it. To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur de données de Woodgrove Bank choisit les services d'une nouvelle architecture analytique.

    Associez chaque besoin au service qui y répond. Pour répondre, faites glisser le service approprié vers chaque besoin. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: adf, text: Azure Data Factory }
    - { id: purview, text: Microsoft Purview }
    - { id: pbi, text: Power BI }
    - { id: storage, text: { en: "Azure Storage", fr: "Stockage Azure" } }
    - { id: asa, text: Azure Stream Analytics }
  targets:
    - id: t1
      text: { en: "Process streaming data in real time as it is captured for ingestion into an analytical store", fr: "Traiter des données de streaming en temps réel lors de leur capture, en vue de leur ingestion dans un magasin analytique" }
    - id: t2
      text: { en: "Host the data lake of the solution", fr: "Héberger le lac de données de la solution" }
    - id: t3
      text: { en: "Enforce data governance across the enterprise and track data lineage", fr: "Appliquer la gouvernance des données dans toute l'entreprise et suivre la traçabilité des données" }
answer:
  mapping: { t1: asa, t2: storage, t3: purview }
explanation:
  correct:
    en: |
      Azure Stream Analytics is a real-time stream processing engine: data engineers place it in architectures that capture streaming data for ingestion into an analytical store. Data engineers use Azure Storage to host data lakes, and Microsoft Purview to enforce data governance and track data lineage.
    fr: |
      Azure Stream Analytics est un moteur de traitement de flux en temps réel : les ingénieurs de données le placent dans les architectures qui capturent des données de streaming pour les ingérer dans un magasin analytique. Les ingénieurs de données utilisent le Stockage Azure pour héberger des lacs de données, et Microsoft Purview pour appliquer la gouvernance des données et suivre leur traçabilité.
  options:
    adf: { en: "Azure Data Factory defines and schedules pipelines that transfer and transform data; it is not a stream processing engine, a data lake or a governance solution.", fr: "Azure Data Factory définit et planifie des pipelines qui transfèrent et transforment les données ; ce n'est ni un moteur de traitement de flux, ni un lac de données, ni une solution de gouvernance." }
    pbi: { en: "Power BI is the reporting and visualization tool of data analysts.", fr: "Power BI est l'outil de création de rapports et de visualisation des analystes de données." }
references:
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
