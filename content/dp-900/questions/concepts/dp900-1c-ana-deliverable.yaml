id: dp900-1c-ana-deliverable
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which deliverable would you expect from a data analyst?
  fr: |
    Quel livrable attendez-vous d'un analyste de données ?
body:
  options:
    - id: a
      text: { en: "A report that visualizes sales trends for managers", fr: "Un rapport qui visualise les tendances des ventes pour les responsables" }
    - id: b
      text: { en: "A recovery plan for the sales database", fr: "Un plan de récupération de la base de données des ventes" }
    - id: c
      text: { en: "A pipeline that loads sales data into a data warehouse", fr: "Un pipeline qui charge les données de ventes dans un entrepôt de données" }
    - id: d
      text: { en: "A chat application that answers questions about sales", fr: "Une application de conversation qui répond aux questions sur les ventes" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Data analysts create the reports, visualizations and charts that enable an organization to make informed decisions. A report on sales trends is a typical result of their work.
    fr: |
      Les analystes de données créent les rapports, les visualisations et les graphiques qui permettent à une organisation de prendre des décisions éclairées. Un rapport sur les tendances des ventes est un résultat typique de leur travail.
  options:
    b: { en: "Backup and recovery plans are implemented by the database administrator.", fr: "Les plans de sauvegarde et de récupération sont mis en œuvre par l'administrateur de base de données." }
    c: { en: "Pipelines that transfer data into a data warehouse are implemented by a data engineer.", fr: "Les pipelines qui transfèrent des données vers un entrepôt de données sont implémentés par un ingénieur de données." }
    d: { en: "AI-powered features such as chat over your data are built by an AI engineer.", fr: "Les fonctionnalités d'IA comme la conversation avec vos données sont créées par un ingénieur IA." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
