id: dp900-1a-unstr-hospital-mix
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital stores the following data:

    - A table of patients, in which every patient has the same columns
    - Lab results as JSON documents, in which the fields depend on the test
    - X-ray images
    - Audio notes that the doctors dictate

    Which data is unstructured?
  fr: |
    Un hôpital stocke les données suivantes :

    - Une table de patients, où tous les patients ont les mêmes colonnes
    - Des résultats de laboratoire sous forme de documents JSON, dont les champs dépendent de l'analyse
    - Des radiographies
    - Des notes audio dictées par les médecins

    Quelles données sont non structurées ?
body:
  options:
    - { id: a, text: { en: "The X-ray images only", fr: "Les radiographies uniquement" } }
    - { id: b, text: { en: "The X-ray images and the audio notes", fr: "Les radiographies et les notes audio" } }
    - { id: c, text: { en: "The lab results and the audio notes", fr: "Les résultats de laboratoire et les notes audio" } }
    - { id: d, text: { en: "The lab results, the X-ray images and the audio notes", fr: "Les résultats de laboratoire, les radiographies et les notes audio" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Images and audio recordings have no specific structure: both are unstructured data. The table of patients is structured data, and the JSON lab results, whose named fields vary with the test, are semi-structured data."
    fr: "Les images et les enregistrements audio n'ont pas de structure spécifique : ce sont dans les deux cas des données non structurées. La table de patients contient des données structurées, et les résultats de laboratoire en JSON, dont les champs nommés varient selon l'analyse, sont des données semi-structurées."
  options:
    a:
      en: "Audio recordings are unstructured as well, like images and video."
      fr: "Les enregistrements audio sont eux aussi non structurés, comme les images et la vidéo."
    c:
      en: "The lab results have named fields that vary: they are semi-structured, and the X-ray images are missing from this answer."
      fr: "Les résultats de laboratoire ont des champs nommés qui varient : ils sont semi-structurés, et les radiographies manquent dans cette réponse."
    d:
      en: "JSON documents whose fields vary are semi-structured data, not unstructured data."
      fr: "Des documents JSON dont les champs varient sont des données semi-structurées, et non des données non structurées."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
