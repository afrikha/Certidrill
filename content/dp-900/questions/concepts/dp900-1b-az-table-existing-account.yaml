id: dp900-1b-az-table-existing-account
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs an application in a single Azure region. The application stores its files in an Azure Storage account.

    The application must also store device settings as entities that each have a key and a set of named properties, with no fixed schema. The solution must use the existing storage account and must not require another Azure service to be provisioned.

    Which data store should Woodgrove Bank use?
  fr: |
    Woodgrove Bank exécute une application dans une seule région Azure. L'application stocke ses fichiers dans un compte de Stockage Azure.

    L'application doit aussi stocker des paramètres d'appareils sous forme d'entités qui ont chacune une clé et un ensemble de propriétés nommées, sans schéma fixe. La solution doit utiliser le compte de stockage existant et ne doit pas nécessiter le provisionnement d'un autre service Azure.

    Quel magasin de données Woodgrove Bank doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Cosmos DB for Table" }
    - { id: b, text: "Azure Files" }
    - { id: c, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: d, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Table storage is the key-value service of an Azure Storage account: a table holds entities made of a key and a set of properties, and it doesn't enforce a schema. Because tables are created in the same storage account as blob containers and file shares, no other service has to be provisioned."
    fr: "Le Stockage Table Azure est le service clé-valeur d'un compte de Stockage Azure : une table contient des entités faites d'une clé et d'un ensemble de propriétés, et elle n'impose pas de schéma. Comme les tables sont créées dans le même compte de stockage que les conteneurs d'objets blob et les partages de fichiers, aucun autre service n'est à provisionner."
  options:
    a:
      en: "Azure Cosmos DB for Table stores the same kind of entities and adds global distribution, but it is a separate service with its own account, which the requirements exclude."
      fr: "Azure Cosmos DB for Table stocke le même type d'entités et ajoute la distribution mondiale, mais c'est un service distinct avec son propre compte, ce que les exigences excluent."
    b:
      en: "Azure Files is part of the storage account, but it provides file shares, not a store of entities with keys and properties."
      fr: "Azure Files fait partie du compte de stockage, mais il fournit des partages de fichiers, pas un magasin d'entités dotées de clés et de propriétés."
    c:
      en: "Azure Blob Storage is part of the storage account, but it stores files as binary objects, not entities with named properties."
      fr: "Le Stockage Blob Azure fait partie du compte de stockage, mais il stocke des fichiers sous forme d'objets binaires, pas des entités dotées de propriétés nommées."
references:
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
  - title: Identify data services
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/3-data-services
