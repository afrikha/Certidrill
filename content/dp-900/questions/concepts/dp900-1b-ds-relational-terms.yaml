id: dp900-1b-ds-relational-terms
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A relational database stores data in [[struct]] that represent entities. When duplicate data values are eliminated, so that the details of a customer are stored only once, the database is said to be [[norm]]. The data is managed and queried by using [[lang]].
    fr: |
      Une base de données relationnelle stocke les données dans des [[struct]] qui représentent des entités. Lorsque les valeurs en double sont éliminées, de sorte que les informations d'un client ne sont stockées qu'une fois, on dit que la base de données est [[norm]]. Les données sont gérées et interrogées en [[lang]].
  slots:
    - id: struct
      options:
        - { id: docs, text: { en: "documents", fr: "documents" } }
        - { id: nodes, text: { en: "nodes", fr: "nœuds" } }
        - { id: tables, text: { en: "tables", fr: "tables" } }
        - { id: cf, text: { en: "column families", fr: "familles de colonnes" } }
    - id: norm
      options:
        - { id: normalized, text: { en: "normalized", fr: "normalisée" } }
        - { id: aggregated, text: { en: "aggregated", fr: "agrégée" } }
        - { id: delimited, text: { en: "delimited", fr: "délimitée" } }
    - id: lang
      options:
        - { id: json, text: "JSON" }
        - { id: sql, text: "SQL" }
        - { id: xml, text: "XML" }
answer:
  values: { struct: tables, norm: normalized, lang: sql }
explanation:
  correct:
    en: "Relational databases store data in tables that represent entities such as customers or sales orders. Using keys to reference entities allows the database to be normalized, which in part means that duplicate data values are eliminated. The tables are managed and queried with SQL, a language based on an ANSI standard."
    fr: "Les bases de données relationnelles stockent les données dans des tables qui représentent des entités comme des clients ou des commandes. L'utilisation de clés pour faire référence aux entités permet de normaliser la base de données, ce qui signifie notamment que les valeurs en double sont éliminées. Les tables sont gérées et interrogées en SQL, un langage fondé sur une norme ANSI."
  options:
    docs:
      en: "Documents are the records of a document database."
      fr: "Les documents sont les enregistrements d'une base de données de documents."
    nodes:
      en: "Nodes represent entities in a graph database."
      fr: "Les nœuds représentent les entités dans une base de données de graphes."
    aggregated:
      en: "Aggregated data is summarized for analysis; it isn't the term for eliminating duplicate values."
      fr: "Des données agrégées sont résumées pour l'analyse ; ce n'est pas le terme qui désigne l'élimination des valeurs en double."
    json:
      en: "JSON is a data format, not a language for managing and querying tables."
      fr: "JSON est un format de données, pas un langage de gestion et d'interrogation de tables."
references:
  - title: Explore databases
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/4-databases
