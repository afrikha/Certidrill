id: dp900-1a-fmt-readable-multi
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two file formats store data as human-readable text?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux formats de fichier qui stockent les données sous forme de texte lisible par l'homme ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "TSV" }
    - { id: b, text: "Avro" }
    - { id: c, text: "Parquet" }
    - { id: d, text: "Delta Lake" }
    - { id: e, text: "XML" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "A tab-separated values (TSV) file is delimited text: plain text in which tabs separate the fields. XML is a human-readable format that defines elements and attributes with tags."
    fr: "Un fichier de valeurs séparées par des tabulations (TSV) est du texte délimité : du texte brut dans lequel des tabulations séparent les champs. XML est un format lisible par l'homme qui définit des éléments et des attributs au moyen de balises."
  options:
    b:
      en: "In an Avro file only the header is JSON; the records are stored as binary data."
      fr: "Dans un fichier Avro, seul l'en-tête est en JSON ; les enregistrements sont stockés sous forme binaire."
    c:
      en: "Parquet is an optimized columnar format built for compression and fast processing, not for reading by people."
      fr: "Parquet est un format optimisé en colonnes, conçu pour la compression et un traitement rapide, pas pour être lu par des personnes."
    d:
      en: "Delta Lake stores its data in Parquet files, so the data isn't human-readable text."
      fr: "Delta Lake stocke ses données dans des fichiers Parquet : les données ne sont donc pas du texte lisible par l'homme."
references:
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
