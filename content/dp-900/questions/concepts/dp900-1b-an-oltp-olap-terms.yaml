id: dp900-1b-an-oltp-olap-terms
objective: "1.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The business events of an organization are recorded by [[rec]] systems; the recorded data can then be aggregated into an [[agg]] model, which is optimized for analytical workloads.
    fr: |
      Les événements métier d'une organisation sont enregistrés par des systèmes [[rec]] ; les données enregistrées peuvent ensuite être agrégées dans un modèle [[agg]], optimisé pour les charges de travail analytiques.
  slots:
    - id: rec
      options:
        - { id: olap, text: "OLAP" }
        - { id: etl, text: "ETL" }
        - { id: oltp, text: "OLTP" }
    - id: agg
      options:
        - { id: olap, text: "OLAP" }
        - { id: oltp, text: "OLTP" }
        - { id: crud, text: "CRUD" }
answer:
  values: { rec: oltp, agg: olap }
explanation:
  correct:
    en: "OLTP (online transactional processing) systems record transactions as they occur. An OLAP (online analytical processing) model, today more commonly called a semantic model, is an aggregated type of data storage optimized for analytical workloads; it is built from a copy of the data that the transactional systems produced."
    fr: "Les systèmes OLTP (traitement transactionnel en ligne) enregistrent les transactions au moment où elles se produisent. Un modèle OLAP (traitement analytique en ligne), aujourd'hui plus souvent appelé modèle sémantique, est un type de stockage de données agrégé, optimisé pour les charges de travail analytiques ; il est construit à partir d'une copie des données produites par les systèmes transactionnels."
  options:
    etl:
      en: "ETL (extract, transform and load) is the process that copies data from operational systems to an analytical store."
      fr: "ETL (extraire, transformer et charger) est le processus qui copie les données des systèmes opérationnels vers un magasin analytique."
    crud:
      en: "CRUD names the create, retrieve, update and delete operations of transactional workloads."
      fr: "CRUD désigne les opérations de création, de récupération, de mise à jour et de suppression des charges de travail transactionnelles."
references:
  - title: Explore analytical data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/6-analytical-processing
  - title: Explore transactional data processing
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/5-transactional-data-processing
