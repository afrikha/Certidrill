id: dp900-1a-semi-json-multi
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application stores its customers as JSON documents.

    Which two statements about these documents are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application stocke ses clients sous forme de documents JSON.

    Quelles sont les deux affirmations vraies à propos de ces documents ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A document must contain every attribute that exists in another document.", fr: "Un document doit contenir tous les attributs présents dans un autre document." } }
    - { id: b, text: { en: "A document includes the names of its attributes, which can differ between customers.", fr: "Un document inclut les noms de ses attributs, qui peuvent différer d'un client à l'autre." } }
    - { id: c, text: { en: "The values of an attribute are stored together for all customers in row groups.", fr: "Les valeurs d'un attribut sont stockées ensemble pour tous les clients dans des groupes de lignes." } }
    - { id: d, text: { en: "An attribute of a document can contain an object or a collection of values.", fr: "Un attribut d'un document peut contenir un objet ou une collection de valeurs." } }
    - { id: e, text: { en: "A document is raw binary data that only the application can interpret.", fr: "Un document est constitué de données binaires brutes que seule l'application peut interpréter." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "In JSON, each attribute is written as a name and a value, so every document carries its own attributes, and these can differ from one customer to another. An attribute can itself be an object or a collection, for example a list of phone numbers. These two properties are what make JSON suitable for semi-structured data."
    fr: "En JSON, chaque attribut s'écrit sous la forme d'un nom et d'une valeur : chaque document porte donc ses propres attributs, qui peuvent différer d'un client à l'autre. Un attribut peut lui-même être un objet ou une collection, par exemple une liste de numéros de téléphone. Ces deux propriétés rendent JSON adapté aux données semi-structurées."
  options:
    a:
      en: "Nothing forces two documents to have the same attributes; that constraint belongs to a fixed schema."
      fr: "Rien n'oblige deux documents à avoir les mêmes attributs ; cette contrainte relève d'un schéma fixe."
    c:
      en: "Storing the values of a column together in row groups describes the Parquet format, not JSON."
      fr: "Stocker ensemble les valeurs d'une colonne dans des groupes de lignes décrit le format Parquet, pas JSON."
    e:
      en: "JSON is human-readable text; raw binary data that an application must interpret describes a BLOB."
      fr: "JSON est du texte lisible par l'homme ; des données binaires brutes qu'une application doit interpréter décrivent un BLOB."
references:
  - title: "Identify data formats"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/2-data-formats
  - title: "Explore file storage"
    url: https://learn.microsoft.com/en-us/training/modules/explore-core-data-concepts/3-file-storage
