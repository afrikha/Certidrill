id: dp900-1c-ana-after-load
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at Woodgrove Bank has loaded cleansed transaction data into a data warehouse. Business users now want to explore this data in self-service reports.

    What should the data analyst do?
  fr: |
    Un ingénieur de données de Woodgrove Bank a chargé des données de transactions nettoyées dans un entrepôt de données. Les utilisateurs professionnels veulent maintenant explorer ces données dans des rapports en libre-service.

    Que doit faire l'analyste de données ?
body:
  options:
    - id: a
      text: { en: "Define and schedule the pipelines that refresh the data warehouse", fr: "Définir et planifier les pipelines qui actualisent l'entrepôt de données" }
    - id: b
      text: { en: "Design and build an analytical model on the data of the warehouse", fr: "Concevoir et créer un modèle analytique sur les données de l'entrepôt" }
    - id: c
      text: { en: "Grant each business user privileges over the tables of the warehouse", fr: "Accorder à chaque utilisateur professionnel des privilèges sur les tables de l'entrepôt" }
    - id: d
      text: { en: "Identify the data governance rules that apply to the warehouse data", fr: "Identifier les règles de gouvernance des données applicables aux données de l'entrepôt" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Designing and building analytical models is a responsibility of the data analyst. The model sits between the data that the engineer loaded and the reports: it is what lets business users explore the data and create their own visualizations.
    fr: |
      La conception et la création de modèles analytiques sont une responsabilité de l'analyste de données. Le modèle se situe entre les données chargées par l'ingénieur et les rapports : c'est lui qui permet aux utilisateurs professionnels d'explorer les données et de créer leurs propres visualisations.
  options:
    a: { en: "Defining, scheduling and monitoring pipelines is the work of the data engineer.", fr: "La définition, la planification et la surveillance des pipelines sont le travail de l'ingénieur de données." }
    c: { en: "Granting privileges over data is the security work of a database administrator.", fr: "L'octroi de privilèges sur les données est le travail de sécurité d'un administrateur de base de données." }
    d: { en: "Identifying data governance rules is part of the data engineer's role.", fr: "L'identification des règles de gouvernance des données fait partie du rôle de l'ingénieur de données." }
references:
  - title: Explore job roles in the world of data
    url: https://learn.microsoft.com/en-us/training/modules/explore-roles-responsibilities-world-of-data/2-explore-job-roles
