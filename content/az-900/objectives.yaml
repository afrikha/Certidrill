# AZ-900 objectives — official study guide, skills measured as of 2026-07-20 (en-us and fr-fr pages).
# `code` is the stable key referenced by question files and course sections.
concepts:
- group:
    en: Describe cloud computing
    fr: Décrire le cloud computing
  objectives:
  - code: 1.1.1
    en: Define cloud computing
    fr: Définir le cloud computing
  - code: 1.1.2
    en: Describe the shared responsibility model
    fr: Décrire le modèle de responsabilité partagée
  - code: 1.1.3
    en: Define cloud models, including public, private, and hybrid
    fr: Définir les modèles cloud, notamment les modèles publics, privés et hybrides
  - code: 1.1.4
    en: Identify appropriate use cases for each cloud model
    fr: Identifier les cas d'usage appropriés pour chaque modèle cloud
  - code: 1.1.5
    en: Describe the consumption-based model
    fr: Décrire le modèle basé sur la consommation
  - code: 1.1.6
    en: Compare cloud pricing models
    fr: Comparer les modèles tarifaires liés au cloud
  - code: 1.1.7
    en: Describe serverless
    fr: Définir le modèle serverless
- group:
    en: Describe the benefits of using cloud services
    fr: Décrire les avantages de l'utilisation des services cloud
  objectives:
  - code: 1.2.1
    en: Describe the benefits of high availability and scalability in the cloud
    fr: Décrire les avantages de la haute disponibilité et de la scalabilité dans le cloud
  - code: 1.2.2
    en: Describe the benefits of reliability and predictability in the cloud
    fr: Décrire les avantages de la fiabilité et de la prévisibilité dans le cloud
  - code: 1.2.3
    en: Describe the benefits of security and governance in the cloud
    fr: Décrire les avantages de la sécurité et de la gouvernance dans le cloud
  - code: 1.2.4
    en: Describe the benefits of manageability in the cloud
    fr: Décrire les avantages de la facilité de gestion dans le cloud
- group:
    en: Describe cloud service types
    fr: Décrire les types de services cloud
  objectives:
  - code: 1.3.1
    en: Describe infrastructure as a service (IaaS)
    fr: Décrire IaaS (infrastructure as a service)
  - code: 1.3.2
    en: Describe platform as a service (PaaS)
    fr: Décrire PaaS (platform as a service)
  - code: 1.3.3
    en: Describe software as a service (SaaS)
    fr: Décrire SaaS (software as a service)
  - code: 1.3.4
    en: Identify appropriate use cases for each cloud service type (IaaS, PaaS, and SaaS)
    fr: Identifier les cas d'usage appropriés pour chaque type de service cloud (IaaS, PaaS et SaaS)
architecture:
- group:
    en: Describe the core architectural components of Azure
    fr: Décrire les principaux composants architecturaux d'Azure
  objectives:
  - code: 2.1.1
    en: Describe Azure regions, region pairs, and sovereign regions
    fr: Décrire les régions, les paires de régions et les régions souveraines Azure
  - code: 2.1.2
    en: Describe availability zones
    fr: Décrire les zones de disponibilité
  - code: 2.1.3
    en: Describe Azure datacenters
    fr: Décrire les centres de données Azure
  - code: 2.1.4
    en: Describe Azure resources and resource groups
    fr: Décrire les ressources et les groupes de ressources Azure
  - code: 2.1.5
    en: Describe subscriptions
    fr: Décrire les abonnements
  - code: 2.1.6
    en: Describe management groups
    fr: Décrire les groupes d'administration
  - code: 2.1.7
    en: Describe the hierarchy of resource groups, subscriptions, and management groups
    fr: Décrire la hiérarchie des groupes de ressources, des abonnements et des groupes d'administration
- group:
    en: Describe Azure compute and networking services
    fr: Décrire les services de calcul et réseau Azure
  objectives:
  - code: 2.2.1
    en: Compare compute types, including containers, virtual machines, and functions
    fr: Comparer les types de calcul, notamment les conteneurs, les machines virtuelles et les fonctions
  - code: 2.2.2
    en: Describe virtual machine options, including Azure virtual machines, Azure Virtual Machine Scale Sets, availability sets, and Azure Virtual Desktop
    fr: Décrire les options de machine virtuelle, notamment les machines virtuelles Azure, Groupes de machines virtuelles identiques Azure, les groupes à haute disponibilité et Azure Virtual Desktop
  - code: 2.2.3
    en: Describe the resources required for virtual machines
    fr: Décrire les ressources nécessaires aux machines virtuelles
  - code: 2.2.4
    en: Describe application hosting options, including web apps, containers, and virtual machines
    fr: Décrire les options d'hébergement d'applications, notamment les applications web, les conteneurs et les machines virtuelles
  - code: 2.2.5
    en: Describe virtual networking, including the purpose of Azure virtual networks, subnets, peering, Azure DNS, Azure VPN Gateway, and ExpressRoute
    fr: Décrire la mise en réseau virtuelle, y compris l'objectif des réseaux virtuels Azure, les sous-réseaux, l'appairage, Azure DNS, Passerelle VPN Azure et ExpressRoute
  - code: 2.2.6
    en: Define public and private endpoints
    fr: Définir des points de terminaison publics et privés
- group:
    en: Describe Azure storage services
    fr: Décrire les services de stockage Azure
  objectives:
  - code: 2.3.1
    en: Compare Azure Storage services
    fr: Comparer les services de stockage Azure
  - code: 2.3.2
    en: Describe storage tiers
    fr: Décrire les différents niveaux de stockage disponibles dans Azure
  - code: 2.3.3
    en: Describe redundancy options
    fr: Décrire les options de redondance
  - code: 2.3.4
    en: Describe storage account options and storage types
    fr: Identifier les options de compte de stockage et les types de stockage disponibles
  - code: 2.3.5
    en: Identify options for moving files, including AzCopy, Azure Storage Explorer, and Azure File Sync
    fr: Identifier les options permettant de déplacer des fichiers, notamment AzCopy, l'Explorateur Stockage Azure et Azure File Sync
  - code: 2.3.6
    en: Describe migration options, including Azure Migrate and Azure Data Box
    fr: Décrire les options de migration, notamment Azure Migrate et Azure Data Box
- group:
    en: Describe Azure identity, access, and security
    fr: Décrire l'identité, l'accès et la sécurité Azure
  objectives:
  - code: 2.4.1
    en: Describe directory services in Azure, including Microsoft Entra ID and Microsoft Entra Domain Services
    fr: Décrire les services d'annuaire dans Azure, notamment Microsoft Entra ID et Microsoft Entra Domain Services
  - code: 2.4.2
    en: Describe authentication methods in Azure, including single sign-on (SSO), multifactor authentication (MFA), and passwordless
    fr: Décrire les méthodes d'authentification dans Azure, notamment authentification unique (SSO), authentification multifacteur (MFA) et sans mot de passe
  - code: 2.4.3
    en: Describe external identities in Azure
    fr: Décrire les identités externes dans Azure
  - code: 2.4.4
    en: Describe Microsoft Entra Conditional Access
    fr: Décrire l'accès conditionnel Microsoft Entra
  - code: 2.4.5
    en: Describe Azure role-based access control (RBAC)
    fr: Décrire le contrôle d'accès en fonction du rôle Azure (RBAC)
  - code: 2.4.6
    en: Describe the concept of Zero Trust
    fr: Décrire le concept de Confiance Zéro
  - code: 2.4.7
    en: Describe the purpose of the defense-in-depth model
    fr: Décrire l'objectif du modèle de défense en profondeur
  - code: 2.4.8
    en: Describe the purpose of Microsoft Defender for Cloud
    fr: Décrire l'objectif de Microsoft Defender pour le cloud
management:
- group:
    en: Describe cost management in Azure
    fr: Décrire la gestion des coûts dans Azure
  objectives:
  - code: 3.1.1
    en: Describe factors that can affect costs in Azure
    fr: Décrire les facteurs qui peuvent affecter les coûts dans Azure
  - code: 3.1.2
    en: Explore the pricing calculator
    fr: Explorer la calculatrice de prix
  - code: 3.1.3
    en: Describe cost management capabilities in Azure
    fr: Décrire les fonctionnalités de gestion des coûts dans Azure
  - code: 3.1.4
    en: Describe the purpose of tags
    fr: Décrire l'objectif des étiquettes
- group:
    en: Describe features and tools in Azure for governance and compliance
    fr: Décrire les fonctionnalités et les outils dans Azure pour la gouvernance et la conformité
  objectives:
  - code: 3.2.1
    en: Describe the purpose of Microsoft Purview in Azure
    fr: Décrire l'objectif de Microsoft Purview dans Azure
  - code: 3.2.2
    en: Describe the purpose of Azure Policy
    fr: Décrire la finalité d'Azure Policy
  - code: 3.2.3
    en: Describe the purpose of resource locks
    fr: Décrire la finalité des verrous de ressources
- group:
    en: Describe features and tools for managing and deploying Azure resources
    fr: Décrire les fonctionnalités et outils de gestion et de déploiement des ressources Azure
  objectives:
  - code: 3.3.1
    en: Describe the Azure portal
    fr: Décrire le portail Azure
  - code: 3.3.2
    en: Describe Azure Cloud Shell, Azure CLI, and Azure PowerShell
    fr: Décrire Azure Cloud Shell, Azure CLI et Azure PowerShell
  - code: 3.3.3
    en: Describe the purpose of Azure Arc
    fr: Décrire l'objectif d'Azure Arc
  - code: 3.3.4
    en: Describe infrastructure as code (IaC)
    fr: Décrire l'infrastructure en tant que code (IaC)
  - code: 3.3.5
    en: Describe Azure Resource Manager (ARM) and ARM templates
    fr: Décrire Azure Resource Manager (ARM) et les modèles ARM
- group:
    en: Describe monitoring tools in Azure
    fr: Décrire les outils de monitoring dans Azure
  objectives:
  - code: 3.4.1
    en: Describe the purpose of Azure Advisor
    fr: Décrire l'objectif d'Azure Advisor
  - code: 3.4.2
    en: Describe Azure Service Health
    fr: Décrire Azure Service Health
  - code: 3.4.3
    en: Describe Azure Monitor, including Log Analytics, Azure Monitor alerts, and Azure Monitor Application Insights
    fr: Décrire Azure Monitor, notamment Log Analytics, Azure Monitor alerts et Azure Monitor Application Insights
