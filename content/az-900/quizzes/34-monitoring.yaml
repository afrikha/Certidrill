chapter: 34-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-34-01
    objective: "3.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Two weeks ago, an incident affected Azure SQL Database in a region that Fabrikam uses. The incident is now resolved. The IT manager wants to review the details of this past event, including the actions taken to resolve it.

        Which Azure service should the IT manager use?
      fr: |
        Il y a deux semaines, un incident a touché Azure SQL Database dans une région qu'utilise Fabrikam. L'incident est maintenant résolu. Le responsable informatique veut consulter le détail de cet événement passé, y compris les actions menées pour le résoudre.

        Quel service Azure le responsable informatique doit-il utiliser ?
    body:
      options:
        - { id: a, text: Azure Advisor }
        - { id: b, text: Application Insights }
        - { id: c, text: Azure Service Health }
        - { id: d, text: Log Analytics }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Service Health keeps past events in its **Health history** pane: service issues, planned maintenance and advisories that are no longer active. Selecting an event opens its full details, including the actions taken to resolve it.
        fr: |
          Azure Service Health conserve les événements passés dans son volet **Health history** : problèmes de service, maintenances planifiées et avis qui ne sont plus actifs. Sélectionner un événement ouvre son détail complet, y compris les actions menées pour le résoudre.
      options:
        a: { en: "Azure Advisor gives recommendations to improve your resources; it doesn't record the incidents of the Azure platform.", fr: "Azure Advisor donne des recommandations pour améliorer vos ressources ; il n'enregistre pas les incidents de la plateforme Azure." }
        b: { en: "Application Insights monitors the performance of your own web applications, not the service issues of the Azure platform.", fr: "Application Insights surveille les performances de vos propres applications web, pas les problèmes de service de la plateforme Azure." }
        d: { en: "Log Analytics runs queries on the logs collected from your resources; it isn't where Microsoft publishes the events that affect Azure services.", fr: "Log Analytics exécute des requêtes sur les journaux collectés depuis vos ressources ; ce n'est pas là que Microsoft publie les événements qui touchent les services Azure." }
    references:
      - title: Health history
        url: https://learn.microsoft.com/en-us/azure/service-health/health-history-overview
      - title: Azure Service Health portal
        url: https://learn.microsoft.com/en-us/azure/service-health/service-health-portal-update

  # ------------------------------------------------------------------ 2
  - id: az900-qz-34-02
    objective: "3.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An administrator uses Log Analytics in the Azure portal to analyze the log data that Azure Monitor collects.

        In which language does the administrator write the log queries?
      fr: |
        Un administrateur utilise Log Analytics dans le portail Azure pour analyser les données de journal que collecte Azure Monitor.

        Dans quel langage l'administrateur écrit-il les requêtes de journal ?
    body:
      options:
        - { id: a, text: Transact-SQL (T-SQL) }
        - { id: b, text: Kusto Query Language (KQL) }
        - { id: c, text: Azure PowerShell }
        - { id: d, text: Bicep }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Log Analytics is the Azure portal tool in which you edit and run log queries on the data of Azure Monitor Logs. The queries are written in the Kusto Query Language (KQL), from simple filters to advanced analysis.
        fr: |
          Log Analytics est l'outil du portail Azure dans lequel vous modifiez et exécutez des requêtes de journal sur les données des journaux Azure Monitor. Les requêtes s'écrivent en langage de requête Kusto (KQL), du simple filtre à l'analyse avancée.
      options:
        a: { en: "Transact-SQL is the query language of SQL Server and Azure SQL Database, not of Log Analytics.", fr: "Transact-SQL est le langage de requête de SQL Server et d'Azure SQL Database, pas de Log Analytics." }
        c: { en: "Azure PowerShell is a command-line tool to manage Azure resources, not the language of log queries.", fr: "Azure PowerShell est un outil en ligne de commande pour gérer les ressources Azure, pas le langage des requêtes de journal." }
        d: { en: "Bicep is a language to declare the Azure resources to deploy (infrastructure as code), not to query logs.", fr: "Bicep est un langage pour déclarer les ressources Azure à déployer (infrastructure en tant que code), pas pour interroger des journaux." }
    references:
      - title: Overview of Log Analytics in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview

  # ------------------------------------------------------------------ 3
  - id: az900-qz-34-03
    objective: "3.4.1"
    difficulty: 1
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind's cloud team is preparing its first review of Azure Advisor. Before the meeting, the team lead checks what the service does and how the team will read its results.

        Select **Yes** for each statement that is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe cloud de Northwind prépare sa première revue d'Azure Advisor. Avant la réunion, le chef d'équipe vérifie ce que fait le service et comment l'équipe lira ses résultats.

        Sélectionnez **Oui** pour chaque affirmation vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Azure Advisor blocks the deployment of resources that don't follow its recommendations.", fr: "Azure Advisor bloque le déploiement des ressources qui ne suivent pas ses recommandations." }
        - id: s2
          text: { en: "You can retrieve Azure Advisor recommendations through a REST API as well as in the Azure portal.", fr: "Vous pouvez récupérer les recommandations d'Azure Advisor par une API REST aussi bien que dans le portail Azure." }
        - id: s3
          text: { en: "Azure Advisor can recommend changes that make an application respond faster.", fr: "Azure Advisor peut recommander des modifications qui font répondre une application plus vite." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Advisor only recommends: it analyzes your resources and suggests actions that you choose to take, postpone or dismiss, so it never blocks a deployment (enforcing rules at deployment is the role of Azure Policy). Its recommendations are available in the portal and through the Azure Advisor REST API. The Performance category groups the recommendations that improve the speed of applications.
        fr: |
          Advisor ne fait que recommander : il analyse vos ressources et propose des actions que vous choisissez d'appliquer, de reporter ou d'ignorer ; il ne bloque donc jamais un déploiement (imposer des règles au déploiement est le rôle d'Azure Policy). Ses recommandations sont disponibles dans le portail et par l'API REST d'Azure Advisor. La catégorie Performances regroupe les recommandations qui améliorent la vitesse des applications.
    references:
      - title: Introduction to Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview

  # ------------------------------------------------------------------ 4
  - id: az900-qz-34-04
    objective: "3.4.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso uses Azure Monitor. Managers want to open, in the Azure portal, an interactive report that combines metrics and log queries about the company's resources. The operations team wants a virtual machine scale set to add instances automatically when the average CPU usage of its virtual machines exceeds 70%.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Azure Monitor. Les responsables veulent ouvrir, dans le portail Azure, un rapport interactif qui combine des métriques et des requêtes de journal sur les ressources de l'entreprise. L'équipe d'exploitation veut qu'un groupe de machines virtuelles identiques ajoute automatiquement des instances quand l'utilisation moyenne du processeur de ses machines virtuelles dépasse 70 %.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          For the managers' report, create [[viz]].

          For the scale set, configure [[resp]].
        fr: |
          Pour le rapport des responsables, créez [[viz]].

          Pour le groupe identique, configurez [[resp]].
      slots:
        - id: viz
          options:
            - { id: ag, text: { en: "an action group", fr: "un groupe d'actions" } }
            - { id: wb, text: { en: "a workbook", fr: "un classeur" } }
            - { id: sha, text: { en: "a Service Health alert", fr: "une alerte Service Health" } }
            - { id: adv, text: { en: "an Azure Advisor recommendation", fr: "une recommandation Azure Advisor" } }
        - id: resp
          options:
            - { id: rh, text: Resource Health }
            - { id: la, text: Log Analytics }
            - { id: auto, text: { en: "autoscale", fr: "la mise à l'échelle automatique" } }
            - { id: ai, text: Application Insights }
    answer:
      values: { viz: wb, resp: auto }
    explanation:
      correct:
        en: |
          Workbooks are the Azure Monitor tool for rich interactive reports in the Azure portal: one workbook combines text, metrics and log queries. Autoscale, also part of Azure Monitor, automatically adds or removes instances of a scale set according to rules on metrics such as the average CPU usage.
        fr: |
          Les classeurs sont l'outil d'Azure Monitor pour créer des rapports interactifs dans le portail Azure : un classeur combine du texte, des métriques et des requêtes de journal. La mise à l'échelle automatique, qui fait aussi partie d'Azure Monitor, ajoute ou retire automatiquement des instances d'un groupe identique selon des règles sur des métriques comme l'utilisation moyenne du processeur.
      options:
        ag: { en: "An action group says who is notified and what runs when an alert fires; it doesn't display data.", fr: "Un groupe d'actions dit qui est notifié et ce qui s'exécute quand une alerte se déclenche ; il n'affiche pas de données." }
        la: { en: "Log Analytics runs log queries; it doesn't add instances to a scale set.", fr: "Log Analytics exécute des requêtes de journal ; il n'ajoute pas d'instances à un groupe identique." }
        ai: { en: "Application Insights monitors web applications; it doesn't change the number of instances.", fr: "Application Insights surveille des applications web ; il ne modifie pas le nombre d'instances." }
    references:
      - title: Azure Workbooks
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-overview
      - title: Overview of autoscale in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-34-05
    objective: "3.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Azure Advisor recommends resizing a virtual machine named **VM-Lab** to a smaller size. VM-Lab runs licensed software whose vendor requires the current size, so the team will not act on this recommendation, now or later.

        What should the team do with the recommendation?
      fr: |
        Azure Advisor recommande de redimensionner une machine virtuelle nommée **VM-Lab** vers une taille plus petite. VM-Lab exécute un logiciel sous licence dont l'éditeur exige la taille actuelle ; l'équipe n'appliquera donc pas cette recommandation, ni maintenant ni plus tard.

        Que doit faire l'équipe de la recommandation ?
    body:
      options:
        - { id: a, text: { en: "Postpone it", fr: "La reporter" } }
        - { id: b, text: { en: "Create an Advisor alert for it", fr: "Créer une alerte Advisor pour elle" } }
        - { id: c, text: { en: "Apply it to VM-Lab", fr: "L'appliquer à VM-Lab" } }
        - { id: d, text: { en: "Dismiss it", fr: "L'ignorer" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          For each recommendation, you choose to act on it, postpone it or dismiss it. Dismissing marks the recommendation as not relevant, which fits a change that the team will never make.
        fr: |
          Pour chaque recommandation, vous choisissez de l'appliquer, de la reporter ou de l'ignorer. L'ignorer (Dismiss) la marque comme non pertinente, ce qui convient à une modification que l'équipe ne fera jamais.
      options:
        a: { en: "Postponing hides the recommendation only for a while, for a later review; it suits a change planned for later, not one that will never be made.", fr: "La reporter ne la masque que pour un temps, en vue d'un examen ultérieur ; cela convient à une modification prévue plus tard, pas à une modification qui ne sera jamais faite." }
        b: { en: "An Advisor alert notifies you of new recommendations; it doesn't remove an existing one.", fr: "Une alerte Advisor vous notifie des nouvelles recommandations ; elle ne retire pas une recommandation existante." }
        c: { en: "Applying the recommendation would resize VM-Lab, which the vendor's requirement forbids.", fr: "Appliquer la recommandation redimensionnerait VM-Lab, ce que l'exigence de l'éditeur interdit." }
    references:
      - title: Introduction to Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
      - title: Describe the purpose of Azure Advisor
        url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/2-describe-purpose-of-azure-advisor

  # ------------------------------------------------------------------ 6
  - id: az900-qz-34-06
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware runs an online store and 30 virtual machines in Azure. Its operations team lists four needs and wants to know which monitoring tool covers each of them.

        Drag one tool onto each need. A tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exploite une boutique en ligne et 30 machines virtuelles dans Azure. Son équipe d'exploitation liste quatre besoins et veut savoir quel outil de monitoring couvre chacun d'eux.

        Faites glisser un outil vers chaque besoin. Un outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: adv, text: Azure Advisor }
        - { id: sh, text: Service Health }
        - { id: rh, text: Resource Health }
        - { id: la, text: Log Analytics }
        - { id: ai, text: Application Insights }
        - { id: alerts, text: { en: "Azure Monitor alerts", fr: "Azure Monitor alerts (alertes)" } }
      targets:
        - id: t1
          text: { en: "Find the pages of the online store that take the longest to load in the users' browsers.", fr: "Trouver les pages de la boutique en ligne qui mettent le plus de temps à se charger dans le navigateur des utilisateurs." }
        - id: t2
          text: { en: "Count, hour by hour, the errors recorded over the last week in the collected logs of the 30 virtual machines.", fr: "Compter, heure par heure, les erreurs enregistrées sur la dernière semaine dans les journaux collectés des 30 machines virtuelles." }
        - id: t3
          text: { en: "Run an Automation runbook automatically when the free disk space of a virtual machine falls below 10%.", fr: "Exécuter automatiquement un runbook Automation quand l'espace disque libre d'une machine virtuelle passe sous 10 %." }
        - id: t4
          text: { en: "Find out whether a virtual machine that was down last night was stopped by a user or affected by an Azure platform event.", fr: "Savoir si une machine virtuelle indisponible la nuit dernière a été arrêtée par un utilisateur ou touchée par un événement de la plateforme Azure." }
    answer:
      mapping: { t1: ai, t2: la, t3: alerts, t4: rh }
    explanation:
      correct:
        en: |
          Application Insights tracks page views and load performance of web applications. Log Analytics runs log queries, from simple filters to aggregations over time, on the data collected from many resources. An Azure Monitor alert fires on a condition and its action group can start an automated action such as a runbook. Resource Health shows the health history of one resource and tells platform events apart from user actions such as stopping a virtual machine.
        fr: |
          Application Insights suit les vues de pages et les performances de chargement des applications web. Log Analytics exécute des requêtes de journal, du simple filtre aux agrégations dans le temps, sur les données collectées depuis de nombreuses ressources. Une alerte Azure Monitor se déclenche sur une condition, et son groupe d'actions peut lancer une action automatisée comme un runbook. Resource Health montre l'historique d'intégrité d'une ressource et distingue les événements de la plateforme des actions d'un utilisateur, comme l'arrêt d'une machine virtuelle.
      options:
        adv: { en: "Azure Advisor gives recommendations; it doesn't analyze page loads, query logs, run actions or report the cause of an outage.", fr: "Azure Advisor donne des recommandations ; il n'analyse pas le chargement des pages, n'interroge pas les journaux, n'exécute pas d'actions et n'indique pas la cause d'une indisponibilité." }
        sh: { en: "Service Health reports service issues of the Azure services and regions that you use, not the history of one specific virtual machine.", fr: "Service Health signale les problèmes de service des services et régions Azure que vous utilisez, pas l'historique d'une machine virtuelle précise." }
    references:
      - title: Describe Azure Monitor
        url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
      - title: Resource Health overview
        url: https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview

  # ------------------------------------------------------------------ 7
  - id: az900-qz-34-07
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware's web application runs in Azure App Service. Some users receive errors. Service Health shows no service issue for App Service in the region, and Resource Health reports the app as Available.

        The developers need to find which operations fail and whether the failures come from the calls that the application makes to an external payment service. What should they use?
      fr: |
        L'application web de Proseware s'exécute dans Azure App Service. Certains utilisateurs reçoivent des erreurs. Service Health n'affiche aucun problème de service pour App Service dans la région, et Resource Health indique que l'application est Available.

        Les développeurs doivent trouver quelles opérations échouent et si les échecs viennent des appels que l'application fait à un service de paiement externe. Que doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "The Health history pane of Service Health", fr: "Le volet Health history de Service Health" } }
        - { id: b, text: { en: "The Performance recommendations of Azure Advisor", fr: "Les recommandations Performances d'Azure Advisor" } }
        - { id: c, text: { en: "The incident list of the Azure status page", fr: "La liste des incidents de la page État d'Azure" } }
        - { id: d, text: { en: "The telemetry of Application Insights", fr: "La télémétrie d'Application Insights" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The platform tools show that Azure and the app's resource are healthy, so the problem is inside the application. Application Insights tracks the failure rates of requests and the dependency calls that the application makes to external services, with their failures, which answers both questions.
        fr: |
          Les outils de la plateforme montrent qu'Azure et la ressource de l'application sont en bonne santé : le problème est donc dans l'application. Application Insights suit les taux d'échec des requêtes et les appels de dépendances que l'application fait vers des services externes, avec leurs échecs, ce qui répond aux deux questions.
      options:
        a: { en: "Health history lists past events of the Azure platform; it doesn't trace the requests or the external calls of an application.", fr: "Health history liste les événements passés de la plateforme Azure ; il ne trace ni les requêtes ni les appels externes d'une application." }
        b: { en: "Advisor gives improvement recommendations; it doesn't show which operations of the application fail.", fr: "Advisor donne des recommandations d'amélioration ; il n'indique pas quelles opérations de l'application échouent." }
        c: { en: "The Azure status page shows widespread outages of Azure services, which Service Health already rules out here; it knows nothing of the application's calls.", fr: "La page État d'Azure montre les pannes étendues des services Azure, que Service Health écarte déjà ici ; elle ignore tout des appels de l'application." }
    references:
      - title: Describe Azure Monitor
        url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
      - title: Resource Health overview
        url: https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview

  # ------------------------------------------------------------------ 8
  - id: az900-qz-34-08
    objective: "3.4.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam deploys its Azure resources only in the Canada Central region. Fabrikam has not created any alert. Its administrators want to understand what Azure will tell them about the platform without further setup.

        Select **Yes** if the statement is true for Fabrikam. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déploie ses ressources Azure uniquement dans la région Canada Central. Fabrikam n'a créé aucune alerte. Ses administrateurs veulent comprendre ce qu'Azure leur indiquera sur la plateforme sans autre configuration.

        Sélectionnez **Oui** si l'affirmation est vraie pour Fabrikam. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Service Health can inform Fabrikam that an Azure feature it uses will be deprecated and that Fabrikam must take action.", fr: "Service Health peut informer Fabrikam qu'une fonctionnalité Azure qu'elle utilise sera dépréciée et que Fabrikam doit agir." }
        - id: s2
          text: { en: "Fabrikam must create a Service Health alert before the planned maintenance of its services appears in Service Health.", fr: "Fabrikam doit créer une alerte Service Health avant que la maintenance planifiée de ses services apparaisse dans Service Health." }
        - id: s3
          text: { en: "The Azure status page shows Fabrikam the health advisories about the Azure features that Fabrikam uses.", fr: "La page État d'Azure montre à Fabrikam les avis d'intégrité sur les fonctionnalités Azure que Fabrikam utilise." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Health advisories in Service Health announce changes that require your action, such as the deprecation of a feature or a required upgrade. Service issues, planned maintenance and advisories appear in Service Health for the services and regions you use whether or not you created alerts: an alert only sends you a notification. The Azure status page is a public, global view of widespread outages; it isn't personalized and doesn't show advisories about the features that one customer uses.
        fr: |
          Les avis d'intégrité de Service Health annoncent des changements qui exigent une action de votre part, comme la dépréciation d'une fonctionnalité ou une mise à niveau obligatoire. Les problèmes de service, la maintenance planifiée et les avis apparaissent dans Service Health pour les services et régions que vous utilisez, que vous ayez créé des alertes ou non : une alerte ne fait que vous envoyer une notification. La page État d'Azure est une vue publique et mondiale des pannes étendues ; elle n'est pas personnalisée et ne montre pas d'avis sur les fonctionnalités qu'utilise un client.
    references:
      - title: Azure Service Health portal
        url: https://learn.microsoft.com/en-us/azure/service-health/service-health-portal-update
      - title: What is Azure Service Health?
        url: https://learn.microsoft.com/en-us/azure/service-health/overview

  # ------------------------------------------------------------------ 9
  - id: az900-qz-34-09
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        An administrator at Adatum plans the monitoring of the company's virtual machines and on-premises servers, and reviews how Azure Monitor alerts and action groups work.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Un administrateur d'Adatum planifie le monitoring des machines virtuelles et des serveurs locaux de l'entreprise, et passe en revue le fonctionnement des alertes Azure Monitor et des groupes d'actions.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Alert rules evaluate metrics only; log data is used only by the queries that you run in Log Analytics.", fr: "Les règles d'alerte n'évaluent que des métriques ; les données de journal ne servent qu'aux requêtes exécutées dans Log Analytics." } }
        - { id: b, text: { en: "Through its action group, an alert can start an automated action, such as an Automation runbook.", fr: "Par son groupe d'actions, une alerte peut lancer une action automatisée, comme un runbook Automation." } }
        - { id: c, text: { en: "An alert can be created only on a resource for which Application Insights is enabled.", fr: "Une alerte ne peut être créée que sur une ressource pour laquelle Application Insights est activé." } }
        - { id: d, text: { en: "The same action group can be used by Service Health alerts and Azure Advisor alerts.", fr: "Un même groupe d'actions peut servir à des alertes Service Health et à des alertes Azure Advisor." } }
        - { id: e, text: { en: "Alerts can watch only resources that run in Azure, not servers in an on-premises datacenter.", fr: "Les alertes ne peuvent surveiller que des ressources qui s'exécutent dans Azure, pas des serveurs d'un centre de données local." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          An action group defines the notifications (email, SMS, push) and the automated actions (Automation runbook, Azure Functions, Logic Apps, webhook) that run when an alert fires. Action groups are reusable: Azure Monitor alerts, Service Health alerts and Advisor alerts can all use the same one.
        fr: |
          Un groupe d'actions définit les notifications (e-mail, SMS, notification push) et les actions automatisées (runbook Automation, Azure Functions, Logic Apps, webhook) qui s'exécutent quand une alerte se déclenche. Les groupes d'actions sont réutilisables : les alertes Azure Monitor, les alertes Service Health et les alertes Advisor peuvent toutes utiliser le même.
      options:
        a: { en: "Alerts can be based on metrics or on logs: a log search alert runs a query on the log data at regular intervals.", fr: "Les alertes peuvent se fonder sur des métriques ou sur des journaux : une alerte de recherche dans les journaux exécute une requête sur les données de journal à intervalles réguliers." }
        c: { en: "Application Insights is needed only for application telemetry; alerts work on any metric or log data in Azure Monitor, for example the CPU of a virtual machine.", fr: "Application Insights n'est nécessaire que pour la télémétrie des applications ; les alertes fonctionnent sur toute métrique ou donnée de journal d'Azure Monitor, par exemple le processeur d'une machine virtuelle." }
        e: { en: "Azure Monitor collects data from Azure, on-premises and other clouds, and alerts can use any of the data it collects.", fr: "Azure Monitor collecte des données depuis Azure, depuis l'environnement local et depuis d'autres clouds, et les alertes peuvent utiliser toutes les données qu'il collecte." }
    references:
      - title: What are Azure Monitor alerts?
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
      - title: Describe Azure Monitor
        url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor

  # ------------------------------------------------------------------ 10
  - id: az900-qz-34-10
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        The production subscription of Woodgrove Bank receives four new Azure Advisor recommendations. The cloud lead wants to know under which heading of the Advisor dashboard each of them will appear.

        Drag one category onto each recommendation. A category may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'abonnement de production de Woodgrove Bank reçoit quatre nouvelles recommandations d'Azure Advisor. Le responsable cloud veut savoir sous quelle rubrique du tableau de bord Advisor chacune d'elles apparaîtra.

        Faites glisser une catégorie vers chaque recommandation. Une catégorie peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: rel, text: { en: "Reliability", fr: "Fiabilité" } }
        - { id: sec, text: { en: "Security", fr: "Sécurité" } }
        - { id: perf, text: { en: "Performance", fr: "Performances" } }
        - { id: opex, text: { en: "Operational excellence", fr: "Excellence opérationnelle" } }
        - { id: cost, text: { en: "Cost", fr: "Coût" } }
      targets:
        - id: t1
          text: { en: "Enable Accelerated Networking on virtual machines to reduce network latency.", fr: "Activer la mise en réseau accélérée sur des machines virtuelles pour réduire la latence réseau." }
        - id: t2
          text: { en: "Consider virtual machine reserved instances to pay less than with on-demand prices.", fr: "Envisager des instances réservées de machines virtuelles pour payer moins qu'avec les prix à la demande." }
        - id: t3
          text: { en: "Use zone-redundant public IP addresses so that the addresses stay reachable if one zone fails.", fr: "Utiliser des adresses IP publiques redondantes interzones pour que les adresses restent joignables si une zone tombe en panne." }
        - id: t4
          text: { en: "Create a Service Health alert to stay informed of service issues and planned maintenance.", fr: "Créer une alerte Service Health pour rester informé des problèmes de service et de la maintenance planifiée." }
    answer:
      mapping: { t1: perf, t2: cost, t3: rel, t4: opex }
    explanation:
      correct:
        en: |
          Accelerated Networking speeds up network traffic: Performance. Reserved instances lower spending: Cost. Zone-redundant addresses keep a business-critical application reachable during a zone failure: Reliability. Creating a Service Health alert doesn't change any resource; it improves the way the team runs its environment (being informed and able to react), so Advisor lists it under Operational excellence.
        fr: |
          La mise en réseau accélérée rend le trafic réseau plus rapide : Performances. Les instances réservées réduisent les dépenses : Coût. Des adresses redondantes interzones gardent une application critique joignable pendant la panne d'une zone : Fiabilité. Créer une alerte Service Health ne modifie aucune ressource ; cela améliore la façon dont l'équipe exploite son environnement (être informée et pouvoir réagir), et Advisor la classe donc dans Excellence opérationnelle.
      options:
        sec: { en: "Security recommendations detect threats and vulnerabilities that might lead to breaches; none of these four recommendations protects against an attack.", fr: "Les recommandations de sécurité détectent les menaces et les vulnérabilités qui pourraient mener à des violations ; aucune de ces quatre recommandations ne protège contre une attaque." }
        rel: { en: "The Service Health alert is a trap: it doesn't make the application more resilient by itself, and Advisor classifies it under Operational excellence.", fr: "L'alerte Service Health est un piège : elle ne rend pas l'application plus résiliente par elle-même, et Advisor la classe dans Excellence opérationnelle." }
    references:
      - title: Operational Excellence recommendations
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-reference-operational-excellence-recommendations
      - title: Introduction to Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
