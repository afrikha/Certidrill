chapter: 12-cloud-benefits
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        After a migration to Azure, Contoso notices that one of its virtual machines never uses more than 10 percent of its CPU. Contoso changes the virtual machine to a size with fewer CPUs and less memory.

        Which scaling operation did Contoso perform?
      fr: |
        Après une migration vers Azure, Contoso constate que l'une de ses machines virtuelles n'utilise jamais plus de 10 % de son processeur. Contoso passe la machine virtuelle à une taille avec moins de processeurs et moins de mémoire.

        Quelle opération de mise à l'échelle Contoso a-t-il effectuée ?
    body:
      options:
        - { id: a, text: { en: "Scale out", fr: "Un scale-out" } }
        - { id: b, text: { en: "Scale in", fr: "Un scale-in" } }
        - { id: c, text: { en: "Scale down", fr: "Un scale-down" } }
        - { id: d, text: { en: "Scale up", fr: "Un scale-up" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Changing the CPUs or memory of an existing resource is vertical scaling. Lowering them on an over-specified virtual machine is scaling down, which also lowers its cost.
        fr: |
          Modifier les processeurs ou la mémoire d'une ressource existante relève de la mise à l'échelle verticale. Les réduire sur une machine virtuelle surdimensionnée est un scale-down, qui réduit aussi son coût.
      options:
        a: { en: "Scaling out adds resources, such as virtual machines; Contoso kept one virtual machine.", fr: "Un scale-out ajoute des ressources, comme des machines virtuelles ; Contoso a gardé une seule machine virtuelle." }
        b: { en: "Scaling in removes resources from a group; the number of virtual machines didn't change.", fr: "Un scale-in retire des ressources d'un groupe ; le nombre de machines virtuelles n'a pas changé." }
        d: { en: "Scaling up adds CPUs or memory to a resource, which is the opposite of what Contoso did.", fr: "Un scale-up ajoute des processeurs ou de la mémoire à une ressource, soit l'inverse de ce qu'a fait Contoso." }
    references:
      - title: Describe the benefits of high availability and scalability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud

  # ------------------------------------------------------------------ 2
  - id: az900-qz-12-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The operations team of Litware describes the resources of a project environment once, in a reusable definition, and then deploys identical copies of that environment for each new project, with no manual configuration.

        Which kind of manageability does this illustrate?
      fr: |
        L'équipe d'exploitation de Litware décrit une seule fois les ressources d'un environnement de projet, dans une définition réutilisable, puis déploie des copies identiques de cet environnement pour chaque nouveau projet, sans configuration manuelle.

        Quelle sorte de facilité de gestion cela illustre-t-il ?
    body:
      options:
        - { id: a, text: { en: "Management in the cloud, through a command-line interface", fr: "La gestion dans le cloud, par une interface en ligne de commande" } }
        - { id: b, text: { en: "Management of the cloud, through automatic alerts on metrics", fr: "La gestion du cloud, par des alertes automatiques sur des métriques" } }
        - { id: c, text: { en: "Management in the cloud, through a web portal", fr: "La gestion dans le cloud, par un portail web" } }
        - { id: d, text: { en: "Management of the cloud, through preconfigured templates", fr: "La gestion du cloud, par des modèles préconfigurés" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Deploying resources from a preconfigured template is one of the capabilities of management of the cloud, which is about managing the resources themselves. The template removes the need for manual configuration, so every project gets the same resources.
        fr: |
          Déployer des ressources à partir d'un modèle préconfiguré est l'une des capacités de la gestion du cloud, qui porte sur la gestion des ressources elles-mêmes. Le modèle supprime le besoin de configuration manuelle : chaque projet obtient donc les mêmes ressources.
      options:
        a: { en: "A command-line interface is a way to manage the environment (management in the cloud), not a reusable definition of the resources.", fr: "Une interface en ligne de commande est une façon de gérer l'environnement (gestion dans le cloud), pas une définition réutilisable des ressources." }
        b: { en: "Alerts are part of management of the cloud, but they report on performance; they don't deploy resources.", fr: "Les alertes font partie de la gestion du cloud, mais elles informent sur les performances ; elles ne déploient pas de ressources." }
        c: { en: "A web portal is a way to manage the environment (management in the cloud), and creating each copy in it is manual configuration.", fr: "Un portail web est une façon de gérer l'environnement (gestion dans le cloud), et y créer chaque copie est une configuration manuelle." }
    references:
      - title: Describe the benefits of manageability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud

  # ------------------------------------------------------------------ 3
  - id: az900-qz-12-03
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The CTO of Proseware says that the cloud is "reliable by design".

        Which characteristic of the cloud supports this claim?
      fr: |
        Le directeur technique de Proseware affirme que le cloud est « fiable par conception ».

        Quelle caractéristique du cloud appuie cette affirmation ?
    body:
      options:
        - { id: a, text: { en: "Each customer gets its own datacenter, so no other tenant can affect it.", fr: "Chaque client obtient son propre centre de données : aucun autre locataire ne peut donc l'affecter." } }
        - { id: b, text: { en: "Resources can run in several regions, so one region failing doesn't stop the rest.", fr: "Les ressources peuvent tourner dans plusieurs régions : la panne d'une région n'arrête donc pas les autres." } }
        - { id: c, text: { en: "Resources are billed per use, so failed resources cost nothing to replace.", fr: "Les ressources sont facturées à l'usage : remplacer des ressources défaillantes ne coûte donc rien." } }
        - { id: d, text: { en: "Resources are deployed from templates, so they all meet the same standards.", fr: "Les ressources sont déployées à partir de modèles : elles respectent donc toutes les mêmes normes." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Reliability is the ability to recover from failures and continue to function. The decentralized design of the cloud supports it: resources can be deployed in regions around the world, so a catastrophic event in one region doesn't take down the others.
        fr: |
          La fiabilité est la capacité à se remettre des défaillances et à continuer de fonctionner. La conception décentralisée du cloud la favorise : les ressources peuvent être déployées dans des régions du monde entier, de sorte qu'un événement catastrophique dans une région n'arrête pas les autres.
      options:
        a: { en: "A public cloud doesn't give each customer its own datacenter; its design is decentralized across many regions.", fr: "Un cloud public ne donne pas à chaque client son propre centre de données ; sa conception est décentralisée sur de nombreuses régions." }
        c: { en: "Per-use billing is the consumption-based model; it says nothing about recovering from failures.", fr: "La facturation à l'usage relève du modèle basé sur la consommation ; elle ne dit rien de la reprise après une défaillance." }
        d: { en: "Templates support governance: they keep resources compliant, not running after a failure.", fr: "Les modèles servent la gouvernance : ils gardent les ressources conformes, pas en fonctionnement après une défaillance." }
    references:
      - title: Describe the benefits of reliability and predictability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud

  # ------------------------------------------------------------------ 4
  - id: az900-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The two-person IT team of Tailspin Toys spends most of its time installing operating system and software patches on the virtual machines that host the company's applications in Azure. Tailspin Toys wants patching and maintenance to be handled automatically.

        What should Tailspin Toys do?
      fr: |
        L'équipe informatique de deux personnes de Tailspin Toys passe l'essentiel de son temps à installer les correctifs du système d'exploitation et des logiciels sur les machines virtuelles qui hébergent les applications de l'entreprise dans Azure. Tailspin Toys veut que les correctifs et la maintenance soient pris en charge automatiquement.

        Que doit faire Tailspin Toys ?
    body:
      options:
        - { id: a, text: { en: "Keep the virtual machines, and deploy new ones from templates", fr: "Garder les machines virtuelles, et déployer les nouvelles à partir de modèles" } }
        - { id: b, text: { en: "Keep the virtual machines, and audit them against a baseline", fr: "Garder les machines virtuelles, et les auditer par rapport à une référence" } }
        - { id: c, text: { en: "Move the applications to PaaS or SaaS offerings", fr: "Déplacer les applications vers des offres PaaS ou SaaS" } }
        - { id: d, text: { en: "Move the virtual machines to a private cloud", fr: "Déplacer les machines virtuelles vers un cloud privé" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With IaaS, the customer manages the operating systems and installed software, including patches and maintenance, in exchange for maximum control. With PaaS or SaaS, the provider handles patching and maintenance, which is what Tailspin Toys wants.
        fr: |
          Avec l'IaaS, le client gère les systèmes d'exploitation et les logiciels installés, correctifs et maintenance compris, en échange d'un contrôle maximal. Avec le PaaS ou le SaaS, le fournisseur prend en charge les correctifs et la maintenance, ce que veut Tailspin Toys.
      options:
        a: { en: "Templates make new resources meet the standards, but the virtual machines stay IaaS, and the team still patches them.", fr: "Les modèles font respecter les normes aux nouvelles ressources, mais les machines virtuelles restent de l'IaaS, et l'équipe continue d'y appliquer les correctifs." }
        b: { en: "Auditing flags the resources that are out of compliance and suggests fixes, but it doesn't take patching off the team.", fr: "L'audit signale les ressources non conformes et propose des corrections, mais il ne retire pas les correctifs à l'équipe." }
        d: { en: "In a private cloud, the organization also maintains the hardware: the team would have more work, not less.", fr: "Dans un cloud privé, l'organisation entretient aussi le matériel : l'équipe aurait plus de travail, pas moins." }
    references:
      - title: Describe the benefits of security and governance in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud

  # ------------------------------------------------------------------ 5
  - id: az900-qz-12-05
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys runs its online store on four virtual machines behind a load balancer. For a two-day sale, Wingtip Toys adds two virtual machines, and it removes them when the sale ends.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys exécute sa boutique en ligne sur quatre machines virtuelles derrière un équilibreur de charge. Pour une vente de deux jours, Wingtip Toys ajoute deux machines virtuelles, puis les retire à la fin de la vente.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Adding the two virtual machines for the sale is a [[add]].
          Removing them when the sale ends is a [[remove]].
          The uptime that Azure guarantees for each service is stated in its [[doc]].
        fr: |
          L'ajout des deux machines virtuelles pour la vente est un [[add]].
          Leur retrait à la fin de la vente est un [[remove]].
          Le temps de fonctionnement qu'Azure garantit pour chaque service est indiqué dans son [[doc]].
      slots:
        - id: add
          options:
            - { id: up, text: "scale-up" }
            - { id: out, text: "scale-out" }
            - { id: down, text: "scale-down" }
            - { id: in, text: "scale-in" }
        - id: remove
          options:
            - { id: up, text: "scale-up" }
            - { id: out, text: "scale-out" }
            - { id: down, text: "scale-down" }
            - { id: in, text: "scale-in" }
        - id: doc
          options:
            - { id: sla, text: { en: "service-level agreement (SLA)", fr: "contrat de niveau de service (SLA)" } }
            - { id: calc, text: { en: "pricing calculator estimate", fr: "estimation de la calculatrice de prix" } }
            - { id: policy, text: { en: "Azure Policy definition", fr: "définition Azure Policy" } }
    answer:
      values: { add: out, remove: in, doc: sla }
    explanation:
      correct:
        en: |
          Adding virtual machines changes the number of resources: it's horizontal scaling, a scale-out; removing them afterwards is a scale-in, and Wingtip Toys stops paying for them. Changing the CPUs or memory of a virtual machine would be vertical scaling (scale-up or scale-down). Azure states its uptime guarantees, which depend on the service, in service-level agreements.
        fr: |
          Ajouter des machines virtuelles change le nombre de ressources : c'est une mise à l'échelle horizontale, un scale-out ; les retirer ensuite est un scale-in, et Wingtip Toys cesse de les payer. Modifier les processeurs ou la mémoire d'une machine virtuelle serait une mise à l'échelle verticale (scale-up ou scale-down). Azure indique ses garanties de temps de fonctionnement, qui dépendent du service, dans des contrats de niveau de service.
      options:
        doc: { en: "The pricing calculator estimates costs, and an Azure Policy definition sets rules for resources; neither states an uptime guarantee.", fr: "La calculatrice de prix estime des coûts, et une définition Azure Policy fixe des règles pour les ressources ; ni l'une ni l'autre n'indique de garantie de temps de fonctionnement." }
    references:
      - title: Describe the benefits of high availability and scalability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud

  # ------------------------------------------------------------------ 6
  - id: az900-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware runs its web application on one large virtual machine. Litware plans to replace it with three smaller virtual machines in the same region that run the same application behind a load balancer. Together, the three virtual machines have the same number of CPUs and the same memory as the large one.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute son application web sur une seule grande machine virtuelle. Litware prévoit de la remplacer par trois machines virtuelles plus petites, dans la même région, qui exécutent la même application derrière un équilibreur de charge. Ensemble, les trois machines virtuelles ont le même nombre de processeurs et la même mémoire que la grande.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "After the change, Litware can absorb more load by adding a fourth virtual machine.", fr: "Après le changement, Litware peut absorber plus de charge en ajoutant une quatrième machine virtuelle." } }
        - { id: s2, text: { en: "After the change, the failure of one virtual machine no longer stops the whole application.", fr: "Après le changement, la panne d'une machine virtuelle n'arrête plus toute l'application." } }
        - { id: s3, text: { en: "The change by itself increases the computing power available to the application.", fr: "Le changement augmente à lui seul la puissance de calcul disponible pour l'application." } }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Yes: with several virtual machines behind a load balancer, Litware can scale out by adding virtual machines. Yes: if one virtual machine fails, the two others keep serving requests, so the change improves availability. No: the total CPUs and memory stay the same, so the change doesn't add capacity by itself; availability and scalability are different benefits.
        fr: |
          Oui : avec plusieurs machines virtuelles derrière un équilibreur de charge, Litware peut effectuer un scale-out en ajoutant des machines virtuelles. Oui : si une machine virtuelle tombe en panne, les deux autres continuent de traiter les requêtes ; le changement améliore donc la disponibilité. Non : le total des processeurs et de la mémoire reste le même ; le changement n'ajoute donc pas de capacité à lui seul. Disponibilité et scalabilité sont deux avantages différents.
    references:
      - title: Describe the benefits of high availability and scalability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud

  # ------------------------------------------------------------------ 7
  - id: az900-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs its order application on two virtual machines in a single Azure region. Northwind has two requirements:

        - Response times must stay stable while the number of customers varies during the day, without paying for unused capacity.
        - The application must keep running if a natural disaster takes the whole region offline.

        Which solution meets both requirements?
      fr: |
        Northwind Traders exécute son application de commandes sur deux machines virtuelles dans une seule région Azure. Northwind a deux exigences :

        - Les temps de réponse doivent rester stables pendant que le nombre de clients varie au cours de la journée, sans payer de capacité inutilisée.
        - L'application doit continuer de fonctionner si une catastrophe naturelle met toute la région hors service.

        Quelle solution répond aux deux exigences ?
    body:
      options:
        - { id: a, text: { en: "Use autoscaling with load balancing, and add virtual machines in the same region", fr: "Utiliser la mise à l'échelle automatique avec l'équilibrage de charge, et ajouter des machines virtuelles dans la même région" } }
        - { id: b, text: { en: "Use larger virtual machines, and deploy the application in a second region", fr: "Utiliser des machines virtuelles plus grandes, et déployer l'application dans une seconde région" } }
        - { id: c, text: { en: "Use autoscaling with load balancing, and deploy the application in a second region", fr: "Utiliser la mise à l'échelle automatique avec l'équilibrage de charge, et déployer l'application dans une seconde région" } }
        - { id: d, text: { en: "Use larger virtual machines, and add virtual machines in the same region", fr: "Utiliser des machines virtuelles plus grandes, et ajouter des machines virtuelles dans la même région" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Autoscaling adds resources when demand rises and removes them when it drops, and load balancing spreads the load: together they support performance predictability without paying for idle capacity. Deploying the application in a second region supports reliability: a catastrophic event in one region doesn't stop the other.
        fr: |
          La mise à l'échelle automatique ajoute des ressources quand la demande augmente et les retire quand elle baisse, et l'équilibrage de charge répartit la charge : ensemble, ils favorisent la prévisibilité des performances sans payer de capacité inactive. Déployer l'application dans une seconde région favorise la fiabilité : un événement catastrophique dans une région n'arrête pas l'autre.
      options:
        a: { en: "The first part is right, but virtual machines in the same region go down with the region.", fr: "La première partie est juste, mais des machines virtuelles dans la même région tombent avec la région." }
        b: { en: "The second region is right, but larger virtual machines sized for the peak are paid for even when few customers are connected.", fr: "La seconde région est juste, mais des machines virtuelles plus grandes dimensionnées pour le pic sont payées même quand peu de clients sont connectés." }
        d: { en: "Both parts fail: larger virtual machines are paid for even when demand is low, and virtual machines in the same region go down with the region.", fr: "Les deux parties échouent : des machines virtuelles plus grandes sont payées même quand la demande est faible, et des machines virtuelles dans la même région tombent avec la région." }
    references:
      - title: Describe the benefits of reliability and predictability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud

  # ------------------------------------------------------------------ 8
  - id: az900-qz-12-08
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        The operations team of Adatum lists four activities from its daily work.

        Which kind of manageability does each activity illustrate? To answer, drag the appropriate kind of manageability to each activity. Each kind of manageability may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe d'exploitation d'Adatum liste quatre activités de son travail quotidien.

        Quelle sorte de facilité de gestion chaque activité illustre-t-elle ? Pour répondre, faites glisser la sorte de facilité de gestion appropriée vers chaque activité. Chaque sorte de facilité de gestion peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: of, text: { en: "Management of the cloud", fr: "Gestion du cloud" } }
        - { id: in, text: { en: "Management in the cloud", fr: "Gestion dans le cloud" } }
      targets:
        - { id: t1, text: { en: "An engineer restarts a virtual machine by typing a command in a terminal.", fr: "Un ingénieur redémarre une machine virtuelle en tapant une commande dans un terminal." } }
        - { id: t2, text: { en: "Virtual machines are added automatically when the CPU load exceeds 70 percent.", fr: "Des machines virtuelles sont ajoutées automatiquement quand la charge du processeur dépasse 70 %." } }
        - { id: t3, text: { en: "A custom inventory application creates storage accounts by calling REST APIs.", fr: "Une application d'inventaire personnalisée crée des comptes de stockage en appelant des API REST." } }
        - { id: t4, text: { en: "A virtual machine that stops responding is detected and replaced without human action.", fr: "Une machine virtuelle qui ne répond plus est détectée et remplacée sans intervention humaine." } }
    answer:
      mapping: { t1: in, t2: of, t3: in, t4: of }
    explanation:
      correct:
        en: |
          Management in the cloud is about how you manage the environment: a web portal, a command-line interface, APIs or PowerShell, so the terminal command and the REST API calls belong there. Management of the cloud is about what the cloud does with your resources: scaling deployments automatically based on need, deploying from templates, monitoring health and replacing failing resources, and alerting on metrics.
        fr: |
          La gestion dans le cloud porte sur la façon de gérer l'environnement : un portail web, une interface en ligne de commande, des API ou PowerShell ; la commande dans le terminal et les appels d'API REST en relèvent donc. La gestion du cloud porte sur ce que le cloud fait de vos ressources : mettre automatiquement à l'échelle les déploiements selon le besoin, déployer à partir de modèles, surveiller l'intégrité et remplacer les ressources défaillantes, et alerter selon des métriques.
    references:
      - title: Describe the benefits of manageability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud

  # ------------------------------------------------------------------ 9
  - id: az900-qz-12-09
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam replaces an HR application that its IT team installed, patched and secured on its own servers with a software as a service (SaaS) HR application, used through a browser. For its other workloads, Fabrikam keeps Azure virtual machines and deploys each of them from templates that contain its corporate standards for security and naming.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam remplace une application RH que son équipe informatique installait, corrigeait et sécurisait sur ses propres serveurs par une application RH SaaS (software as a service), utilisée depuis un navigateur. Pour ses autres charges de travail, Fabrikam garde des machines virtuelles Azure et déploie chacune d'elles à partir de modèles qui contiennent ses normes d'entreprise de sécurité et de nommage.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "After the change, Fabrikam no longer installs the patches of the HR application.", fr: "Après le changement, Fabrikam n'installe plus les correctifs de l'application RH." } }
        - { id: s2, text: { en: "After the change, Fabrikam has more control over the security settings of the servers that run the HR application.", fr: "Après le changement, Fabrikam a plus de contrôle sur les paramètres de sécurité des serveurs qui exécutent l'application RH." } }
        - { id: s3, text: { en: "When a corporate standard changes, Fabrikam must reconfigure each deployed virtual machine by hand to apply it.", fr: "Quand une norme d'entreprise change, Fabrikam doit reconfigurer à la main chaque machine virtuelle déployée pour l'appliquer." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Yes: with SaaS, the provider handles the patching and maintenance of the application. No: the more the provider manages, the less control the customer has; maximum control over servers comes with IaaS, not SaaS. No: because resources are deployed from templates, Fabrikam updates the standard and can update the deployed resources at scale, instead of one by one.
        fr: |
          Oui : en SaaS, le fournisseur prend en charge les correctifs et la maintenance de l'application. Non : plus le fournisseur gère, moins le client a de contrôle ; le contrôle maximal sur les serveurs va avec l'IaaS, pas avec le SaaS. Non : comme les ressources sont déployées à partir de modèles, Fabrikam met à jour la norme et peut mettre à jour les ressources déployées à grande échelle, plutôt qu'une par une.
    references:
      - title: Describe the benefits of security and governance in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud

  # ------------------------------------------------------------------ 10
  - id: az900-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank presents the results of its first year in Azure to its board. The report describes four situations.

        Which cloud benefit does each situation illustrate? To answer, drag the appropriate benefit to each situation. Each benefit may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank présente à son conseil d'administration le bilan de sa première année dans Azure. Le rapport décrit quatre situations.

        Quel avantage du cloud chaque situation illustre-t-elle ? Pour répondre, faites glisser l'avantage approprié vers chaque situation. Chaque avantage peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: gov, text: { en: "Governance", fr: "Gouvernance" } }
        - { id: sec, text: { en: "Security", fr: "Sécurité" } }
        - { id: mgmt, text: { en: "Manageability", fr: "Facilité de gestion" } }
        - { id: rel, text: { en: "Reliability", fr: "Fiabilité" } }
        - { id: scal, text: { en: "Scalability", fr: "Scalabilité" } }
        - { id: pred, text: { en: "Predictability", fr: "Prévisibilité" } }
      targets:
        - { id: t1, text: { en: "Resources deployed without the tags that the bank's baseline requires are flagged, with a suggested fix.", fr: "Les ressources déployées sans les étiquettes qu'exige la référence de la banque sont signalées, avec une correction proposée." } }
        - { id: t2, text: { en: "A flood of malicious traffic aimed at the public website was absorbed by the provider's network.", fr: "Un afflux de trafic malveillant visant le site web public a été absorbé par le réseau du fournisseur." } }
        - { id: t3, text: { en: "Operators were notified automatically each time the response time of an application exceeded a configured value.", fr: "Les opérateurs ont été avertis automatiquement chaque fois que le temps de réponse d'une application a dépassé une valeur configurée." } }
        - { id: t4, text: { en: "Resource use was tracked in real time and analyzed to forecast next year's cloud spending.", fr: "L'utilisation des ressources a été suivie en temps réel et analysée pour prévoir les dépenses cloud de l'année suivante." } }
    answer:
      mapping: { t1: gov, t2: sec, t3: mgmt, t4: pred }
    explanation:
      correct:
        en: |
          Flagging resources that are out of compliance with a baseline and suggesting mitigation is cloud-based auditing, a governance feature. Absorbing distributed denial-of-service (DDoS) traffic is a security benefit of the provider's network. Automatic alerts based on configured metrics are listed under management of the cloud, so they illustrate manageability. Tracking use in real time and analyzing trends to forecast spending is cost predictability.
        fr: |
          Signaler les ressources non conformes à une référence et proposer des mesures correctives relève de l'audit dans le cloud, une fonctionnalité de gouvernance. Absorber un trafic de déni de service distribué (DDoS) est un avantage de sécurité du réseau du fournisseur. Les alertes automatiques fondées sur des métriques configurées font partie de la gestion du cloud : elles illustrent la facilité de gestion. Suivre l'utilisation en temps réel et analyser les tendances pour prévoir les dépenses relève de la prévisibilité des coûts.
      options:
        rel: { en: "Reliability is about recovering from failures, for example with resources in several regions; no situation describes a failure.", fr: "La fiabilité consiste à se remettre des défaillances, par exemple grâce à des ressources dans plusieurs régions ; aucune situation ne décrit de défaillance." }
        scal: { en: "Scalability is about adding or removing resources to meet demand; no situation changes the resources.", fr: "La scalabilité consiste à ajouter ou à retirer des ressources selon la demande ; aucune situation ne modifie les ressources." }
    references:
      - title: Describe the benefits of security and governance in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
      - title: Describe the benefits of manageability in the cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
