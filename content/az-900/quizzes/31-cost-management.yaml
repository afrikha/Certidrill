chapter: 31-cost-management
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-31-01
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys adds the tag `AutoShutdown = 19:00` to its test virtual machines. Every evening, a scheduled script reads the tag and stops the virtual machines that carry it.

        Which purpose of tags does this illustrate?
      fr: |
        Tailspin Toys ajoute l'étiquette `AutoShutdown = 19:00` à ses machines virtuelles de test. Chaque soir, un script planifié lit l'étiquette et arrête les machines virtuelles qui la portent.

        Quel objectif des étiquettes cet usage illustre-t-il ?
    body:
      options:
        - { id: a, text: { en: "Operations management", fr: "Gestion des opérations" } }
        - { id: b, text: { en: "Workload optimization and automation", fr: "Optimisation et automatisation des charges de travail" } }
        - { id: c, text: { en: "Security", fr: "Sécurité" } }
        - { id: d, text: { en: "Governance and regulatory compliance", fr: "Gouvernance et conformité réglementaire" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Workload optimization and automation is the purpose of tags that identifies the resources of a deployment so that software can perform automated tasks on them. Here the tag tells the script which virtual machines to stop each evening, which also lowers their cost.
        fr: |
          L'optimisation et l'automatisation des charges de travail est l'objectif des étiquettes qui identifie les ressources d'un déploiement pour qu'un logiciel puisse effectuer des tâches automatisées sur elles. Ici, l'étiquette indique au script quelles machines virtuelles arrêter chaque soir, ce qui réduit aussi leur coût.
      options:
        a: { en: "Operations management groups resources by how critical their availability is, to formulate service-level agreements.", fr: "La gestion des opérations regroupe les ressources selon la criticité de leur disponibilité, pour formuler des contrats de niveau de service." }
        c: { en: "Security tags classify data by security level, such as public or confidential.", fr: "Les étiquettes de sécurité classent les données par niveau de sécurité, comme public ou confidentiel." }
        d: { en: "Governance and regulatory compliance tags identify resources subject to a standard such as ISO 27001.", fr: "Les étiquettes de gouvernance et de conformité réglementaire identifient les ressources soumises à une norme comme ISO 27001." }
    references:
      - title: Describe the purpose of tags
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags

  # ------------------------------------------------------------------ 2
  - id: az900-qz-31-02
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam compares two virtual machines in the same region, with the same size and the same disks. One runs Windows Server and the other runs Linux. The Windows Server virtual machine has a higher hourly price.

        Which cost factor explains this difference?
      fr: |
        Fabrikam compare deux machines virtuelles dans la même région, avec la même taille et les mêmes disques. L'une exécute Windows Server et l'autre Linux. La machine virtuelle Windows Server a un prix horaire plus élevé.

        Quel facteur de coût explique cette différence ?
    body:
      options:
        - { id: a, text: { en: "Geography", fr: "Zone géographique" } }
        - { id: b, text: { en: "Network traffic", fr: "Trafic réseau" } }
        - { id: c, text: { en: "Resource type", fr: "Type de ressource" } }
        - { id: d, text: { en: "Subscription type", fr: "Type d'abonnement" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The cost of a resource depends on its type and its settings; for a virtual machine, they include the license of the operating system. The price of a Windows Server virtual machine includes the Windows Server license, while its base compute rate equals the Linux rate.
        fr: |
          Le coût d'une ressource dépend de son type et de ses réglages ; pour une machine virtuelle, ils incluent la licence du système d'exploitation. Le prix d'une machine virtuelle Windows Server inclut la licence Windows Server, tandis que son tarif de calcul de base est égal au tarif Linux.
      options:
        a: { en: "Both virtual machines are in the same region, so geography can't explain the difference.", fr: "Les deux machines virtuelles sont dans la même région : la zone géographique ne peut donc pas expliquer la différence." }
        b: { en: "Network traffic is billed according to the data transferred, not according to the operating system.", fr: "Le trafic réseau est facturé selon les données transférées, pas selon le système d'exploitation." }
        d: { en: "The subscription type affects usage allowances, such as free credits, not the price difference between two operating systems.", fr: "Le type d'abonnement influe sur les quotas d'utilisation, comme les crédits gratuits, pas sur l'écart de prix entre deux systèmes d'exploitation." }
    references:
      - title: Describe factors that can affect costs in Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
      - title: Azure Hybrid Benefit for Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/get-started/azure-hybrid-benefit

  # ------------------------------------------------------------------ 3
  - id: az900-qz-31-03
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Wingtip Toys has a subscription named **Sub1** in a management group named **MG-Shop**, which also contains two other subscriptions. Sub1 contains five resource groups, and all its resources are in West Europe.

        The finance team must receive an email when the monthly spending on virtual machines in Sub1, across all its resource groups, reaches 4,000 euros. Spending on other services must not count.

        Select the answers that correctly complete the sentences.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys dispose d'un abonnement nommé **Sub1** dans un groupe d'administration nommé **MG-Shop**, qui contient aussi deux autres abonnements. Sub1 contient cinq groupes de ressources, et toutes ses ressources se trouvent en Europe Ouest.

        L'équipe financière doit recevoir un e-mail quand la dépense mensuelle consacrée aux machines virtuelles de Sub1, tous groupes de ressources confondus, atteint 4 000 euros. La dépense des autres services ne doit pas compter.

        Sélectionnez les réponses qui complètent correctement les phrases.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          In Cost Management, create a budget of 4,000 euros per month at the scope of [[scope]].

          Add a filter on [[filter]], and set the alert condition to [[threshold]] of the budget, with the finance team as recipients.
        fr: |
          Dans Cost Management, créez un budget de 4 000 euros par mois à l'étendue [[scope]].

          Ajoutez un filtre sur [[filter]], et définissez la condition d'alerte à [[threshold]] du budget, avec l'équipe financière comme destinataire.
      slots:
        - id: scope
          options:
            - { id: mg, text: { en: "the MG-Shop management group", fr: "du groupe d'administration MG-Shop" } }
            - { id: rg, text: { en: "each resource group of Sub1", fr: "de chaque groupe de ressources de Sub1" } }
            - { id: sub, text: { en: "the Sub1 subscription", fr: "de l'abonnement Sub1" } }
        - id: filter
          options:
            - { id: vm, text: { en: "the Virtual Machines service", fr: "le service Virtual Machines" } }
            - { id: region, text: { en: "the West Europe region", fr: "la région Europe Ouest" } }
            - { id: owner, text: { en: "the owner of each resource group", fr: "le propriétaire de chaque groupe de ressources" } }
        - id: threshold
          options:
            - { id: p80, text: { en: "80%", fr: "80 %" } }
            - { id: p100, text: { en: "100%", fr: "100 %" } }
            - { id: p125, text: { en: "125%", fr: "125 %" } }
    answer:
      values: { scope: sub, filter: vm, threshold: p100 }
    explanation:
      correct:
        en: |
          A budget at the Sub1 scope covers the costs of all its resource groups, and a filter on a service such as virtual machines limits it to those costs. Alert thresholds are percentages of the budget amount, so 100% of a 4,000-euro budget fires when the virtual machines reach 4,000 euros. The budget only notifies: it doesn't stop the virtual machines.
        fr: |
          Un budget à l'étendue de Sub1 couvre les coûts de tous ses groupes de ressources, et un filtre sur un service comme les machines virtuelles le limite à ces coûts. Les seuils d'alerte sont des pourcentages du montant du budget : 100 % d'un budget de 4 000 euros se déclenche quand les machines virtuelles atteignent 4 000 euros. Le budget ne fait qu'avertir : il n'arrête pas les machines virtuelles.
      options:
        mg: { en: "MG-Shop also contains two other subscriptions, whose virtual machines would count.", fr: "MG-Shop contient aussi deux autres abonnements, dont les machines virtuelles compteraient." }
        rg: { en: "One budget per resource group evaluates each group separately; none of them follows the total of Sub1.", fr: "Un budget par groupe de ressources évalue chaque groupe séparément ; aucun ne suit le total de Sub1." }
        region: { en: "All the resources of Sub1 are in West Europe, so this filter keeps the other services.", fr: "Toutes les ressources de Sub1 sont en Europe Ouest : ce filtre conserve donc les autres services." }
        p80: { en: "80% of the budget fires at 3,200 euros, before the required amount.", fr: "80 % du budget se déclenche à 3 200 euros, avant le montant demandé." }
    references:
      - title: Tutorial - Create and manage budgets - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets

  # ------------------------------------------------------------------ 4
  - id: az900-qz-31-04
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware must classify each of its Azure resources both by environment (Production or Test) and by cost center. The administrators must be able to filter the resources, and their costs, on either classification.

        What should Litware do?
      fr: |
        Litware doit classer chacune de ses ressources Azure à la fois par environnement (Production ou Test) et par centre de coûts. Les administrateurs doivent pouvoir filtrer les ressources, et leurs coûts, sur l'une ou l'autre classification.

        Que doit faire Litware ?
    body:
      options:
        - { id: a, text: { en: "Place each resource in two resource groups, one for each classification.", fr: "Placer chaque ressource dans deux groupes de ressources, un pour chaque classification." } }
        - { id: b, text: { en: "Apply two tags to each resource, one for each classification.", fr: "Appliquer deux étiquettes à chaque ressource, une pour chaque classification." } }
        - { id: c, text: { en: "Nest the environment resource groups inside cost center resource groups.", fr: "Imbriquer les groupes de ressources d'environnement dans des groupes de ressources de centre de coûts." } }
        - { id: d, text: { en: "Move the resources into one management group for each cost center.", fr: "Déplacer les ressources dans un groupe d'administration par centre de coûts." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A tag is a name and a value, and a resource can carry one or more tags, for example `Environment = Prod` and `CostCenter = 4410`. Tags add classifications that the resource group structure can't carry, and they can be used to filter resources and to report costs.
        fr: |
          Une étiquette est un nom et une valeur, et une ressource peut porter une ou plusieurs étiquettes, par exemple `Environment = Prod` et `CostCenter = 4410`. Les étiquettes ajoutent des classifications que la structure des groupes de ressources ne peut pas porter, et elles servent à filtrer les ressources et à rendre compte des coûts.
      options:
        a: { en: "A resource belongs to exactly one resource group at a time.", fr: "Une ressource appartient à exactement un groupe de ressources à la fois." }
        c: { en: "Resource groups can't be nested inside other resource groups.", fr: "Les groupes de ressources ne peuvent pas être imbriqués dans d'autres groupes de ressources." }
        d: { en: "Management groups contain subscriptions and other management groups, not individual resources.", fr: "Les groupes d'administration contiennent des abonnements et d'autres groupes d'administration, pas des ressources individuelles." }
    references:
      - title: Describe the purpose of tags
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags

  # ------------------------------------------------------------------ 5
  - id: az900-qz-31-05
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders estimated a solution in the pricing calculator: two virtual machines and a storage account in West Europe, running 730 hours per month. The solution streams training videos to employees over the internet.

        After the deployment, the first invoice is higher than the estimate, although the virtual machines, the storage account, the region and the hours all match the estimate. What is the most likely cause of the difference?
      fr: |
        Northwind Traders a estimé une solution dans la calculatrice de prix : deux machines virtuelles et un compte de stockage en Europe Ouest, qui fonctionnent 730 heures par mois. La solution diffuse des vidéos de formation aux employés via Internet.

        Après le déploiement, la première facture est plus élevée que l'estimation, bien que les machines virtuelles, le compte de stockage, la région et les heures correspondent tous à l'estimation. Quelle est la cause la plus probable de la différence ?
    body:
      options:
        - { id: a, text: { en: "The pricing calculator adds a fee for each estimate that is saved.", fr: "La calculatrice de prix ajoute des frais pour chaque estimation enregistrée." } }
        - { id: b, text: { en: "The estimate leaves out the license of the virtual machines' operating system.", fr: "L'estimation omet la licence du système d'exploitation des machines virtuelles." } }
        - { id: c, text: { en: "The upload of the videos to the storage account is billed as inbound data.", fr: "Le chargement des vidéos dans le compte de stockage est facturé comme données entrantes." } }
        - { id: d, text: { en: "The estimate leaves out the data that the solution sends out of Azure.", fr: "L'estimation omet les données que la solution envoie hors d'Azure." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The pricing calculator estimates only the products and options that you add to the estimate. Streaming videos over the internet sends data out of Azure datacenters, and outbound data transfers are billed; without a bandwidth line in the estimate, this cost appears only on the invoice.
        fr: |
          La calculatrice de prix n'estime que les produits et les options que vous ajoutez à l'estimation. Diffuser des vidéos via Internet envoie des données hors des centres de données Azure, et les transferts de données sortants sont facturés ; sans ligne de bande passante dans l'estimation, ce coût n'apparaît que sur la facture.
      options:
        a: { en: "Using the pricing calculator is free: nothing is provisioned or charged when you build or save an estimate.", fr: "L'utilisation de la calculatrice de prix est gratuite : rien n'est provisionné ni facturé quand vous créez ou enregistrez une estimation." }
        b: { en: "The operating system is an option of the virtual machine in the calculator, and its price is part of the estimated hourly rate.", fr: "Le système d'exploitation est une option de la machine virtuelle dans la calculatrice, et son prix fait partie du tarif horaire estimé." }
        c: { en: "Inbound data transfers into Azure datacenters are generally free.", fr: "Les transferts de données entrants vers les centres de données Azure sont en général gratuits." }
    references:
      - title: Estimate costs with the Azure pricing calculator - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
      - title: Describe factors that can affect costs in Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure

  # ------------------------------------------------------------------ 6
  - id: az900-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso runs a production application in Azure on virtual machines and a storage account that uses geo-redundant storage (GRS). Management wants to know the monthly cost of the application if the storage account used locally redundant storage (LRS) and if two more virtual machines were added next quarter.

        Nothing can be changed or deployed before management decides. What should you use to answer?
      fr: |
        Contoso exécute une application de production dans Azure sur des machines virtuelles et un compte de stockage qui utilise le stockage géoredondant (GRS). La direction veut connaître le coût mensuel de l'application si le compte de stockage utilisait le stockage localement redondant (LRS) et si deux machines virtuelles de plus étaient ajoutées le trimestre prochain.

        Rien ne peut être modifié ni déployé avant la décision de la direction. Que devez-vous utiliser pour répondre ?
    body:
      options:
        - { id: a, text: { en: "Cost analysis in Cost Management, with the forecast of the subscription", fr: "L'analyse des coûts dans Cost Management, avec la prévision de l'abonnement" } }
        - { id: b, text: { en: "Azure Advisor, with the cost recommendations of the subscription", fr: "Azure Advisor, avec les recommandations de coût de l'abonnement" } }
        - { id: c, text: { en: "The pricing calculator, with an estimate of the planned configuration", fr: "La calculatrice de prix, avec une estimation de la configuration prévue" } }
        - { id: d, text: { en: "A budget in Cost Management, with an alert at the planned amount", fr: "Un budget dans Cost Management, avec une alerte au montant prévu" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The question is about a configuration that doesn't exist yet, so it needs an estimate, even though the application is already deployed. In the pricing calculator you add the virtual machines and the storage account with the planned redundancy and count, and you get a monthly estimate without provisioning or changing anything.
        fr: |
          La question porte sur une configuration qui n'existe pas encore : elle exige donc une estimation, même si l'application est déjà déployée. Dans la calculatrice de prix, vous ajoutez les machines virtuelles et le compte de stockage avec la redondance et le nombre prévus, et vous obtenez une estimation mensuelle sans rien provisionner ni modifier.
      options:
        a: { en: "The forecast of cost analysis projects the current resources and usage; it can't price a configuration that isn't deployed.", fr: "La prévision de l'analyse des coûts projette les ressources et l'usage actuels ; elle ne peut pas chiffrer une configuration qui n'est pas déployée." }
        b: { en: "Advisor recommends resizing or shutting down underused resources from their usage; it doesn't price a change chosen by management.", fr: "Advisor recommande de redimensionner ou d'arrêter des ressources sous-utilisées d'après leur usage ; il ne chiffre pas une modification choisie par la direction." }
        d: { en: "A budget alerts on actual spending against an amount; it doesn't calculate what a new configuration would cost.", fr: "Un budget alerte sur la dépense réelle par rapport à un montant ; il ne calcule pas ce que coûterait une nouvelle configuration." }
    references:
      - title: Explore the pricing calculator
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
      - title: Quickstart - Start using Cost Analysis - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/quick-acm-cost-analysis

  # ------------------------------------------------------------------ 7
  - id: az900-qz-31-07
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum has an Enterprise Agreement. Its FinOps team lists four needs, shown in the answer area.

        Which capability should the team use for each need? To answer, drag the appropriate capabilities to the correct needs. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un contrat Entreprise. Son équipe FinOps liste quatre besoins, présentés dans la zone de réponse.

        Quelle fonctionnalité l'équipe doit-elle utiliser pour chaque besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les besoins correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: analysis, text: { en: "Cost analysis", fr: "Analyse des coûts" } }
        - { id: budgets, text: { en: "Budgets", fr: "Budgets" } }
        - { id: alerts, text: { en: "Cost alerts", fr: "Alertes de coût" } }
        - { id: advisor, text: { en: "Azure Advisor recommendations", fr: "Recommandations d'Azure Advisor" } }
        - { id: calc, text: { en: "Pricing calculator", fr: "Calculatrice de prix" } }
        - { id: tags, text: { en: "Tags", fr: "Étiquettes" } }
      targets:
        - { id: t1, text: { en: "Display a forecast of the subscription's cost at the end of the month, based on its spending so far.", fr: "Afficher une prévision du coût de l'abonnement à la fin du mois, d'après sa dépense jusqu'ici." } }
        - { id: t2, text: { en: "Deallocate the test virtual machines automatically when their spending reaches the monthly limit.", fr: "Libérer automatiquement les machines virtuelles de test quand leur dépense atteint la limite mensuelle." } }
        - { id: t3, text: { en: "Review in one place the budget, credit and department spending quota alerts of the company.", fr: "Consulter en un seul endroit les alertes de budget, de crédit et de quota de dépense de service de l'entreprise." } }
        - { id: t4, text: { en: "Find the virtual machines that weren't used during the last seven days, with the savings of shutting them down.", fr: "Trouver les machines virtuelles inutilisées pendant les sept derniers jours, avec l'économie que procurerait leur arrêt." } }
    answer:
      mapping: { t1: analysis, t2: budgets, t3: alerts, t4: advisor }
    explanation:
      correct:
        en: |
          Cost analysis shows accumulated costs and a forecast, a projection of the estimated costs for the period. A budget sets a spending limit and can trigger automation that suspends or modifies resources at a threshold. Cost alerts gather in one place the budget alerts, the credit alerts and the department spending quota alerts of Enterprise Agreement customers. Azure Advisor identifies virtual machines unused over the last seven days, recommends shutting them down and shows the estimated savings.
        fr: |
          L'analyse des coûts montre les coûts cumulés et une prévision, c'est-à-dire une projection des coûts estimés pour la période. Un budget fixe une limite de dépense et peut déclencher, à un seuil, une automatisation qui suspend ou modifie des ressources. Les alertes de coût réunissent en un seul endroit les alertes de budget, les alertes de crédit et les alertes de quota de dépense de service des clients sous contrat Entreprise. Azure Advisor repère les machines virtuelles inutilisées depuis sept jours, recommande de les arrêter et affiche l'économie estimée.
      options:
        calc: { en: "The pricing calculator estimates resources that you plan to deploy; it doesn't read the actual spending or usage of a subscription.", fr: "La calculatrice de prix estime les ressources que vous prévoyez de déployer ; elle ne lit ni la dépense réelle ni l'usage d'un abonnement." }
        tags: { en: "Tags group resources for reporting and automation, but they don't forecast, alert or recommend anything by themselves.", fr: "Les étiquettes regroupent les ressources pour les rapports et l'automatisation, mais elles ne prévoient, n'alertent et ne recommandent rien par elles-mêmes." }
    references:
      - title: Describe the Microsoft Cost Management tool
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
      - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances - Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations

  # ------------------------------------------------------------------ 8
  - id: az900-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has a monthly budget of 2,000 euros on a resource group named **RG-Dev**. RG-Dev contains virtual machines with managed disks, and a storage account. The budget has two alert conditions:

        - At 90% of the actual cost, an email is sent to the finance team.
        - At 100% of the actual cost, an action group starts an automation that deallocates all the virtual machines of RG-Dev.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un budget mensuel de 2 000 euros sur un groupe de ressources nommé **RG-Dev**. RG-Dev contient des machines virtuelles avec des disques managés, et un compte de stockage. Le budget a deux conditions d'alerte :

        - À 90 % du coût réel, un e-mail est envoyé à l'équipe financière.
        - À 100 % du coût réel, un groupe d'actions lance une automatisation qui libère toutes les machines virtuelles de RG-Dev.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When the actual cost reaches 1,800 euros, the finance team receives an email and the virtual machines keep running.", fr: "Quand le coût réel atteint 1 800 euros, l'équipe financière reçoit un e-mail et les machines virtuelles continuent de fonctionner." } }
        - { id: s2, text: { en: "After the automation deallocates the virtual machines, RG-Dev generates no more charges until the end of the month.", fr: "Une fois que l'automatisation a libéré les machines virtuelles, RG-Dev ne génère plus aucun frais jusqu'à la fin du mois." } }
        - { id: s3, text: { en: "Once the actual cost exceeds 2,000 euros, the budget stops users from creating new resources in RG-Dev.", fr: "Dès que le coût réel dépasse 2 000 euros, le budget empêche les utilisateurs de créer de nouvelles ressources dans RG-Dev." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A budget alert only notifies: at 90% (1,800 euros) the email is sent and nothing else changes. Deallocating a virtual machine stops its compute charges, but its managed disks and the storage account keep being billed. Reaching or exceeding a budget doesn't affect resources or stop consumption; only the automation that you configure acts, and here it only deallocates the virtual machines.
        fr: |
          Une alerte budgétaire ne fait qu'avertir : à 90 % (1 800 euros), l'e-mail est envoyé et rien d'autre ne change. Libérer une machine virtuelle arrête ses frais de calcul, mais ses disques managés et le compte de stockage restent facturés. Atteindre ou dépasser un budget n'affecte pas les ressources et n'arrête pas la consommation ; seule l'automatisation que vous configurez agit, et ici elle ne fait que libérer les machines virtuelles.
      options:
        s2: { en: "Disks, networking and the storage account continue to incur charges while the virtual machines are deallocated.", fr: "Les disques, le réseau et le compte de stockage continuent d'être facturés pendant que les machines virtuelles sont libérées." }
        s3: { en: "A budget doesn't block deployments; preventing the creation of resources would require another mechanism, such as Azure Policy.", fr: "Un budget ne bloque pas les déploiements ; empêcher la création de ressources exigerait un autre mécanisme, comme Azure Policy." }
    references:
      - title: Tutorial - Create and manage budgets - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
      - title: States and billing status - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing

  # ------------------------------------------------------------------ 9
  - id: az900-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A subscription named **Sub1** has one Azure Policy assignment: it denies the creation of any virtual machine that doesn't have a `CostCenter` tag. Sub1 contains a resource group named **RG-App**, which has the tags `CostCenter = 4410` and `Environment = Prod`. No other policy is assigned.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un abonnement nommé **Sub1** a une seule attribution Azure Policy : elle refuse la création de toute machine virtuelle qui n'a pas d'étiquette `CostCenter`. Sub1 contient un groupe de ressources nommé **RG-App**, qui porte les étiquettes `CostCenter = 4410` et `Environment = Prod`. Aucune autre stratégie n'est attribuée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "An administrator can create a virtual machine without any tag in RG-App, because RG-App already has a CostCenter tag.", fr: "Un administrateur peut créer une machine virtuelle sans aucune étiquette dans RG-App, car RG-App porte déjà une étiquette CostCenter." } }
        - { id: s2, text: { en: "A virtual machine created in RG-App with only the tag `CostCenter = 5120` keeps this single tag, without the Environment tag of RG-App.", fr: "Une machine virtuelle créée dans RG-App avec la seule étiquette `CostCenter = 5120` garde cette unique étiquette, sans l'étiquette Environment de RG-App." } }
        - { id: s3, text: { en: "The policy assignment denies the creation of a storage account without any tag in RG-App.", fr: "L'attribution de stratégie refuse la création d'un compte de stockage sans aucune étiquette dans RG-App." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Resources don't inherit the tags of their resource group, so a virtual machine created without tags has no CostCenter tag and the policy denies it. A virtual machine created with its own CostCenter value is compliant and carries only that tag; copying Environment would require a policy that applies the resource group's tags. The assignment only covers virtual machines, so it doesn't evaluate a storage account.
        fr: |
          Les ressources n'héritent pas des étiquettes de leur groupe de ressources : une machine virtuelle créée sans étiquette n'a donc pas d'étiquette CostCenter, et la stratégie la refuse. Une machine virtuelle créée avec sa propre valeur CostCenter est conforme et ne porte que cette étiquette ; copier Environment exigerait une stratégie qui applique les étiquettes du groupe de ressources. L'attribution ne couvre que les machines virtuelles : elle n'évalue donc pas un compte de stockage.
      options:
        s1: { en: "The tag of RG-App doesn't appear on the virtual machine, which therefore has no CostCenter tag and is denied.", fr: "L'étiquette de RG-App n'apparaît pas sur la machine virtuelle, qui n'a donc pas d'étiquette CostCenter et est refusée." }
        s3: { en: "The rule of the assignment targets virtual machines only; a storage account without tags is allowed.", fr: "La règle de l'attribution ne cible que les machines virtuelles ; un compte de stockage sans étiquette est autorisé." }
    references:
      - title: Describe the purpose of tags
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
      - title: Policy definitions for tagging resources - Azure Resource Manager
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies

  # ------------------------------------------------------------------ 10
  - id: az900-qz-31-10
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso runs two workloads in Azure:

        - Ten Windows Server virtual machines run a production application 24 hours a day. Their size and region won't change for three years, and they must never be interrupted. Contoso owns no Windows Server licenses with Software Assurance.
        - A storage account holds 40 TB of audit reports in the Hot tier. The reports are read a few times per year and must be readable immediately when an auditor asks for them.

        You need to reduce the cost of both workloads. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute deux charges de travail dans Azure :

        - Dix machines virtuelles Windows Server exécutent une application de production 24 heures sur 24. Leur taille et leur région ne changeront pas pendant trois ans, et elles ne doivent jamais être interrompues. Contoso ne possède aucune licence Windows Server avec Software Assurance.
        - Un compte de stockage contient 40 To de rapports d'audit au niveau chaud (Hot). Les rapports sont lus quelques fois par an et doivent être lisibles immédiatement quand un auditeur les demande.

        Vous devez réduire le coût des deux charges de travail. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Enable Azure Hybrid Benefit on the production virtual machines.", fr: "Activer Azure Hybrid Benefit sur les machines virtuelles de production." } }
        - { id: b, text: { en: "Buy three-year reservations for the production virtual machines.", fr: "Acheter des réservations de trois ans pour les machines virtuelles de production." } }
        - { id: c, text: { en: "Replace the production virtual machines with Spot virtual machines.", fr: "Remplacer les machines virtuelles de production par des machines virtuelles Spot." } }
        - { id: d, text: { en: "Move the audit reports to the Archive tier.", fr: "Déplacer les rapports d'audit vers le niveau archive (Archive)." } }
        - { id: e, text: { en: "Move the audit reports to the Cold tier.", fr: "Déplacer les rapports d'audit vers le niveau froid (Cold)." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A reservation commits to the same resources for one or three years in exchange for a lower price, which suits virtual machines that run permanently with a fixed size and region. The Cold tier is an online tier for data that is rarely accessed but still needs fast retrieval: its storage cost is lower than Hot, and the reports stay readable at once.
        fr: |
          Une réservation engage sur les mêmes ressources pour un ou trois ans en échange d'un prix plus bas, ce qui convient à des machines virtuelles qui fonctionnent en permanence avec une taille et une région fixes. Le niveau froid (Cold) est un niveau en ligne pour des données rarement consultées qui doivent pourtant être récupérées rapidement : son coût de stockage est inférieur à celui du niveau chaud (Hot), et les rapports restent lisibles immédiatement.
      options:
        a: { en: "Azure Hybrid Benefit requires Windows Server licenses with active Software Assurance or qualifying subscription licenses, which Contoso doesn't have.", fr: "Azure Hybrid Benefit exige des licences Windows Server avec Software Assurance active ou des licences d'abonnement admissibles, ce que Contoso n'a pas." }
        c: { en: "Spot virtual machines can be evicted when Azure needs the capacity back, which the production application can't accept.", fr: "Les machines virtuelles Spot peuvent être évincées quand Azure a besoin de récupérer la capacité, ce que l'application de production ne peut pas accepter." }
        d: { en: "The Archive tier is offline: a blob must be rehydrated first, which can take up to 15 hours, so the reports wouldn't be readable immediately.", fr: "Le niveau archive (Archive) est hors ligne : un objet blob doit d'abord être réalimenté, ce qui peut prendre jusqu'à 15 heures ; les rapports ne seraient donc pas lisibles immédiatement." }
    references:
      - title: Describe factors that can affect costs in Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
      - title: Access tiers for blob data - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
