chapter: 32-governance-compliance
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-32-01
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which statement describes the difference between Azure Policy and Azure role-based access control (Azure RBAC)?
      fr: |
        Quelle affirmation décrit la différence entre Azure Policy et le contrôle d'accès en fonction du rôle Azure (Azure RBAC) ?
    body:
      options:
        - { id: a, text: { en: "Azure Policy grants permissions to groups of users; Azure RBAC grants them to individual user accounts only.", fr: "Azure Policy accorde des autorisations à des groupes d'utilisateurs ; Azure RBAC les accorde uniquement à des comptes d'utilisateurs individuels." } }
        - { id: b, text: { en: "Azure Policy applies only to resources created after its assignment; Azure RBAC also applies to existing resources.", fr: "Azure Policy ne s'applique qu'aux ressources créées après son attribution ; Azure RBAC s'applique aussi aux ressources existantes." } }
        - { id: c, text: { en: "Azure Policy checks the properties of resources against rules, whoever deploys them; Azure RBAC controls what each user can do.", fr: "Azure Policy vérifie les propriétés des ressources par rapport à des règles, quel que soit l'auteur du déploiement ; Azure RBAC contrôle ce que chaque utilisateur peut faire." } }
        - { id: d, text: { en: "Azure Policy rules apply to every user except the owners; Azure RBAC role assignments apply to the owners as well.", fr: "Les règles Azure Policy s'appliquent à tous les utilisateurs sauf aux propriétaires ; les attributions de rôles Azure RBAC s'appliquent aussi aux propriétaires." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Policy compares the configuration of resources with business rules and keeps them compliant without regard to who made the change. Azure RBAC decides which actions a user, group or application is allowed to perform. The two are complementary: RBAC controls who acts, Policy controls what the result may look like.
        fr: |
          Azure Policy compare la configuration des ressources à des règles métier et les maintient conformes sans tenir compte de qui a fait la modification. Azure RBAC décide quelles actions un utilisateur, un groupe ou une application a le droit d'effectuer. Les deux se complètent : RBAC contrôle qui agit, Policy contrôle à quoi le résultat peut ressembler.
      options:
        a: { en: "Azure Policy doesn't grant permissions at all, and Azure RBAC roles can be assigned to groups as well as to users.", fr: "Azure Policy n'accorde aucune autorisation, et les rôles Azure RBAC peuvent être attribués à des groupes comme à des utilisateurs." }
        b: { en: "Azure Policy also evaluates existing resources and flags those that are non-compliant.", fr: "Azure Policy évalue aussi les ressources existantes et signale celles qui ne sont pas conformes." }
        d: { en: "Policies apply to everyone, owners included; holding a role doesn't exempt a user from a policy.", fr: "Les stratégies s'appliquent à tout le monde, propriétaires compris ; détenir un rôle n'exempte pas un utilisateur d'une stratégie." }
    references:
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview

  # ------------------------------------------------------------------ 2
  - id: az900-qz-32-02
    objective: "3.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Azure role-based access control (Azure RBAC) so that only a few administrators can delete its production resources. The company now also wants to apply resource locks to these resources.

        What do the locks add to the protection?
      fr: |
        Contoso utilise le contrôle d'accès en fonction du rôle Azure (Azure RBAC) pour que seuls quelques administrateurs puissent supprimer ses ressources de production. L'entreprise veut maintenant appliquer aussi des verrous de ressources à ces ressources.

        Qu'apportent les verrous à la protection ?
    body:
      options:
        - { id: a, text: { en: "They block deletions made from the Azure CLI, which Azure RBAC doesn't control.", fr: "Ils bloquent les suppressions faites depuis Azure CLI, qu'Azure RBAC ne contrôle pas." } }
        - { id: b, text: { en: "They hide the resources from users who have no role assignment on them.", fr: "Ils masquent les ressources aux utilisateurs qui n'ont aucune attribution de rôle sur elles." } }
        - { id: c, text: { en: "They replace the role assignments, which no longer need to be reviewed.", fr: "Ils remplacent les attributions de rôles, qui n'ont plus besoin d'être revues." } }
        - { id: d, text: { en: "They block a deletion even by an administrator who holds the required role.", fr: "Ils bloquent une suppression même par un administrateur qui détient le rôle requis." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A lock applies to all users, whatever their Azure RBAC role, owners included. Azure RBAC alone doesn't stop a mistake made by someone who has the rights; the lock does, until an authorized user deliberately removes it.
        fr: |
          Un verrou s'applique à tous les utilisateurs, quel que soit leur rôle Azure RBAC, propriétaires compris. Azure RBAC seul n'empêche pas l'erreur de quelqu'un qui a les droits ; le verrou, si, jusqu'à ce qu'un utilisateur autorisé le retire volontairement.
      options:
        a: { en: "Azure RBAC applies to every request, whether it comes from the portal, the Azure CLI or Azure PowerShell.", fr: "Azure RBAC s'applique à toutes les requêtes, qu'elles viennent du portail, d'Azure CLI ou d'Azure PowerShell." }
        b: { en: "A lock doesn't change who can see a resource; a Read-only lock still allows reading.", fr: "Un verrou ne change pas qui peut voir une ressource ; un verrou Lecture seule permet toujours la lecture." }
        c: { en: "Locks and role assignments work together; a lock grants no permission and doesn't remove any assignment.", fr: "Les verrous et les attributions de rôles fonctionnent ensemble ; un verrou n'accorde aucune autorisation et ne supprime aucune attribution." }
    references:
      - title: Describe the purpose of resource locks
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks

  # ------------------------------------------------------------------ 3
  - id: az900-qz-32-03
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has started to use Microsoft Purview. Its data office wants to know which data the company holds in Azure SQL Database, in its own datacenter and in Amazon S3, to see how this data moves between systems, and to find the stores that contain sensitive data.

        Which Microsoft Purview solution area should the data office use?
      fr: |
        Litware a commencé à utiliser Microsoft Purview. Son service des données veut savoir quelles données l'entreprise détient dans Azure SQL Database, dans son propre centre de données et dans Amazon S3, voir comment ces données circulent entre les systèmes et trouver les magasins qui contiennent des données sensibles.

        Quel domaine de solutions de Microsoft Purview le service des données doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "Unified data governance", fr: "Gouvernance unifiée des données" } }
        - { id: b, text: { en: "Risk and compliance", fr: "Risques et conformité" } }
        - { id: c, text: { en: "Regulatory compliance in Azure Policy", fr: "Conformité réglementaire dans Azure Policy" } }
        - { id: d, text: { en: "Recommendations in Microsoft Defender for Cloud", fr: "Recommandations de Microsoft Defender pour le cloud" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The unified data governance solutions build an up-to-date map of the whole data estate, with classification and end-to-end lineage, and show where sensitive data is stored. They cover Azure, SQL and Hive databases, on-premises data and other clouds such as Amazon S3.
        fr: |
          Les solutions de gouvernance unifiée des données construisent une carte à jour de tout le patrimoine de données, avec classification et traçabilité de bout en bout, et montrent où sont stockées les données sensibles. Elles couvrent Azure, les bases SQL et Hive, les données locales et d'autres clouds comme Amazon S3.
      options:
        b: { en: "The risk and compliance solutions protect sensitive data and manage regulatory compliance, with Microsoft 365 services such as Teams and Exchange; mapping the data estate and its lineage is unified data governance.", fr: "Les solutions de risques et de conformité protègent les données sensibles et gèrent la conformité réglementaire, avec des services Microsoft 365 comme Teams et Exchange ; cartographier le patrimoine de données et sa traçabilité relève de la gouvernance unifiée des données." }
        c: { en: "Azure Policy evaluates the configuration of Azure resources; it doesn't map data or trace its lineage, and it isn't a Purview solution area.", fr: "Azure Policy évalue la configuration des ressources Azure ; il ne cartographie pas les données et ne trace pas leur parcours, et ce n'est pas un domaine de solutions Purview." }
        d: { en: "Defender for Cloud recommendations improve the security of workloads; they don't build a map of the data estate, and they aren't a Purview solution area.", fr: "Les recommandations de Defender pour le cloud améliorent la sécurité des charges de travail ; elles ne construisent pas de carte du patrimoine de données, et ce n'est pas un domaine de solutions Purview." }
    references:
      - title: Describe the purpose of Microsoft Purview
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview

  # ------------------------------------------------------------------ 4
  - id: az900-qz-32-04
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam starts to use Azure Policy in a subscription that contains several resource groups, including one named **RG1**. The company releases its applications through Azure DevOps pipelines. The compliance team has listed the company rules to enforce on resource configuration, and a few of these rules have no matching built-in policy definition.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam commence à utiliser Azure Policy dans un abonnement qui contient plusieurs groupes de ressources, dont un nommé **RG1**. L'entreprise met ses applications en production par des pipelines Azure DevOps. L'équipe de conformité a listé les règles de l'entreprise à imposer à la configuration des ressources, et quelques-unes de ces règles n'ont aucune définition de stratégie intégrée correspondante.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Azure Policy can check compliance in the pre-deployment and post-deployment phases of an Azure DevOps release pipeline.", fr: "Azure Policy peut vérifier la conformité dans les phases de prédéploiement et de post-déploiement d'un pipeline de mise en production Azure DevOps." } }
        - { id: s2, text: { en: "When no built-in policy definition matches a company rule, Fabrikam can write its own policy definition.", fr: "Quand aucune définition de stratégie intégrée ne correspond à une règle de l'entreprise, Fabrikam peut écrire sa propre définition de stratégie." } }
        - { id: s3, text: { en: "A policy assigned to RG1 also applies to the other resource groups of the subscription.", fr: "Une stratégie attribuée à RG1 s'applique aussi aux autres groupes de ressources de l'abonnement." } }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Azure Policy integrates with Azure DevOps to apply compliance checks before and after deployments. Many built-in definitions exist, and you can also create custom ones. Inheritance goes from a scope down to its children only: a policy assigned to RG1 applies to the resources of RG1, not to its sibling resource groups.
        fr: |
          Azure Policy s'intègre à Azure DevOps pour appliquer des vérifications de conformité avant et après les déploiements. Il existe de nombreuses définitions intégrées, et vous pouvez aussi créer les vôtres. L'héritage va d'une étendue vers ses enfants uniquement : une stratégie attribuée à RG1 s'applique aux ressources de RG1, pas aux autres groupes de ressources.
      options:
        s3: { en: "To cover every resource group, assign the policy to the subscription; an assignment never flows sideways to sibling scopes.", fr: "Pour couvrir tous les groupes de ressources, attribuez la stratégie à l'abonnement ; une attribution ne se propage jamais latéralement à des étendues sœurs." }
    references:
      - title: Describe the purpose of Azure Policy
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a subscription named **Sub1** that contains 40 resource groups, and new resource groups are added every month. No resource of Sub1 may be deleted by mistake, but the administrators must keep changing the configuration of the resources. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Adatum dispose d'un abonnement nommé **Sub1** qui contient 40 groupes de ressources, et de nouveaux groupes de ressources sont ajoutés chaque mois. Aucune ressource de Sub1 ne doit pouvoir être supprimée par erreur, mais les administrateurs doivent pouvoir continuer à modifier la configuration des ressources. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Apply a Delete lock to each of the 40 resource groups.", fr: "Appliquer un verrou Suppression à chacun des 40 groupes de ressources." } }
        - { id: b, text: { en: "Apply a Delete lock to Sub1.", fr: "Appliquer un verrou Suppression à Sub1." } }
        - { id: c, text: { en: "Apply a Read-only lock to Sub1.", fr: "Appliquer un verrou Lecture seule à Sub1." } }
        - { id: d, text: { en: "Apply a Delete lock to the management group of Sub1.", fr: "Appliquer un verrou Suppression au groupe d'administration de Sub1." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A lock can be applied to a subscription, and it is inherited by every resource group and resource in it, including those added later. A Delete lock lets authorized users read and modify the resources but not delete them, so one lock on Sub1 meets the requirement.
        fr: |
          Un verrou peut être appliqué à un abonnement, et il est hérité par tous les groupes de ressources et toutes les ressources qu'il contient, y compris ceux ajoutés plus tard. Un verrou Suppression permet aux utilisateurs autorisés de lire et de modifier les ressources, mais pas de les supprimer : un seul verrou sur Sub1 répond donc à l'exigence.
      options:
        a: { en: "40 locks are more work than one, and each new resource group would need its own lock.", fr: "40 verrous demandent plus de travail qu'un seul, et chaque nouveau groupe de ressources aurait besoin de son propre verrou." }
        c: { en: "A Read-only lock also blocks every configuration change, which the administrators must keep making.", fr: "Un verrou Lecture seule bloque aussi toute modification de configuration, que les administrateurs doivent pouvoir continuer à faire." }
        d: { en: "Locks are applied to subscriptions, resource groups or resources; you can't add a lock to a management group.", fr: "Les verrous s'appliquent aux abonnements, aux groupes de ressources ou aux ressources ; on ne peut pas ajouter de verrou à un groupe d'administration." }
    references:
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources

  # ------------------------------------------------------------------ 6
  - id: az900-qz-32-06
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank has a subscription named **Sub-Prod** and must meet the requirements listed in the answer area.

        Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un abonnement nommé **Sub-Prod** et doit satisfaire aux exigences listées dans la zone de réponse.

        Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: ro, text: { en: "Read-only lock", fr: "Verrou Lecture seule" } }
        - { id: del, text: { en: "Delete lock", fr: "Verrou Suppression" } }
        - { id: policy, text: Azure Policy }
        - { id: rbac, text: Azure RBAC }
        - { id: purview, text: Microsoft Purview }
      targets:
        - id: t1
          text: { en: "During a two-week audit, nobody, including the owners, may change the configuration of a virtual network named vnet-hub; everyone keeps viewing it.", fr: "Pendant un audit de deux semaines, personne, propriétaires compris, ne doit pouvoir modifier la configuration d'un réseau virtuel nommé vnet-hub ; tout le monde continue de le consulter." }
        - id: t2
          text: { en: "The members of a group named G-Audit may view all the resources of Sub-Prod without changing them, while the other teams keep changing them.", fr: "Les membres d'un groupe nommé G-Audit peuvent consulter toutes les ressources de Sub-Prod sans les modifier, tandis que les autres équipes continuent de les modifier." }
        - id: t3
          text: { en: "Resources that are created without a CostCenter tag receive the tag automatically.", fr: "Les ressources créées sans étiquette CostCenter reçoivent automatiquement cette étiquette." }
        - id: t4
          text: { en: "The bank must see how customer data moves from an on-premises SQL Server database to its reports in Azure.", fr: "La banque doit voir comment les données des clients circulent d'une base de données SQL Server locale jusqu'à ses rapports dans Azure." }
    answer:
      mapping: { t1: ro, t2: rbac, t3: policy, t4: purview }
    explanation:
      correct:
        en: |
          A Read-only lock stops every user, owners included, from changing vnet-hub while reading stays possible. Limiting one group to viewing while other teams keep their rights depends on who the user is, so it is a role assignment (Reader for G-Audit) in Azure RBAC; a lock would block everyone. Azure Policy can add a missing tag automatically, and the end-to-end data lineage of Microsoft Purview shows how data moves from its source to its reports.
        fr: |
          Un verrou Lecture seule empêche tous les utilisateurs, propriétaires compris, de modifier vnet-hub tout en laissant la lecture possible. Limiter un seul groupe à la consultation pendant que les autres équipes gardent leurs droits dépend de qui est l'utilisateur : c'est une attribution de rôle (Reader pour G-Audit) dans Azure RBAC ; un verrou bloquerait tout le monde. Azure Policy peut ajouter automatiquement une étiquette manquante, et la traçabilité des données de bout en bout de Microsoft Purview montre comment les données circulent de leur source jusqu'aux rapports.
      options:
        del: { en: "A Delete lock still allows changes, so it doesn't freeze vnet-hub; it doesn't restrict a single group either.", fr: "Un verrou Suppression autorise toujours les modifications : il ne fige donc pas vnet-hub ; il ne restreint pas non plus un seul groupe." }
    references:
      - title: Describe the purpose of resource locks
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
      - title: Describe the purpose of Microsoft Purview
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview

  # ------------------------------------------------------------------ 7
  - id: az900-qz-32-07
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a subscription named **Sub1** that contains 300 resources, and many of them have no `CostCenter` tag. Every resource of Sub1, existing or new, must carry a `CostCenter` tag, and a missing tag must be added without manual work. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un abonnement nommé **Sub1** qui contient 300 ressources, dont beaucoup n'ont pas d'étiquette `CostCenter`. Chaque ressource de Sub1, existante ou nouvelle, doit porter une étiquette `CostCenter`, et une étiquette manquante doit être ajoutée sans travail manuel. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Apply the CostCenter tag to Sub1 so that all the resources of Sub1 inherit it.", fr: "Appliquer l'étiquette CostCenter à Sub1 pour que toutes les ressources de Sub1 en héritent." } }
        - { id: b, text: { en: "Assign to Sub1 a policy that denies the creation of resources without the tag.", fr: "Attribuer à Sub1 une stratégie qui refuse la création de ressources sans l'étiquette." } }
        - { id: c, text: { en: "Scan the resources of Sub1 with Microsoft Purview so that it labels them with the tag.", fr: "Analyser les ressources de Sub1 avec Microsoft Purview pour qu'il leur attribue l'étiquette." } }
        - { id: d, text: { en: "Assign to Sub1 a policy that adds the tag when it is missing, and remediate the existing resources.", fr: "Attribuer à Sub1 une stratégie qui ajoute l'étiquette quand elle manque, puis corriger les ressources existantes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Some Azure Policy definitions remediate non-compliant resources automatically, for example by adding a missing tag. Assigned to Sub1, the policy is inherited by all its resource groups and resources: new resources receive the tag when they are created, and a remediation brings the existing resources into compliance without manual tagging.
        fr: |
          Certaines définitions Azure Policy corrigent automatiquement les ressources non conformes, par exemple en ajoutant une étiquette manquante. Attribuée à Sub1, la stratégie est héritée par tous ses groupes de ressources et toutes ses ressources : les nouvelles ressources reçoivent l'étiquette à leur création, et une correction met les ressources existantes en conformité sans étiquetage manuel.
      options:
        a: { en: "Tags aren't inherited: a tag applied to a subscription or a resource group isn't copied to the resources in it.", fr: "Les étiquettes ne sont pas héritées : une étiquette appliquée à un abonnement ou à un groupe de ressources n'est pas copiée sur les ressources qu'il contient." }
        b: { en: "A deny policy blocks new resources without the tag instead of adding it, and it only flags the existing resources as non-compliant.", fr: "Une stratégie de refus bloque les nouvelles ressources sans l'étiquette au lieu de l'ajouter, et elle se contente de signaler les ressources existantes comme non conformes." }
        c: { en: "Microsoft Purview classifies data, not the configuration of Azure resources; it doesn't apply Azure tags.", fr: "Microsoft Purview classifie des données, pas la configuration des ressources Azure ; il n'applique pas d'étiquettes Azure." }
    references:
      - title: Describe the purpose of Azure Policy
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
      - title: Use tags to organize your Azure resources and management hierarchy
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources

  # ------------------------------------------------------------------ 8
  - id: az900-qz-32-08
    objective: "3.2.2"
    difficulty: 3
    status: draft
    shuffle: false
    type: dropdown
    stem:
      en: |
        Contoso has a management group named **MG1** that contains four subscriptions: **Sub-A**, **Sub-B**, **Sub-C** and **Sub-Lab**. The security team has selected 12 related built-in policy definitions.

        The 12 definitions must apply to all the current and future resources of Sub-A, Sub-B and Sub-C, but not to Sub-Lab. The team wants to track the 12 definitions as a single compliance goal and to create as few assignments as possible.

        How should you complete the sentences? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un groupe d'administration nommé **MG1** qui contient quatre abonnements : **Sub-A**, **Sub-B**, **Sub-C** et **Sub-Lab**. L'équipe de sécurité a sélectionné 12 définitions de stratégie intégrées liées entre elles.

        Les 12 définitions doivent s'appliquer à toutes les ressources actuelles et futures de Sub-A, Sub-B et Sub-C, mais pas à Sub-Lab. L'équipe veut suivre les 12 définitions comme un seul objectif de conformité et créer le moins d'attributions possible.

        Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Group the 12 definitions in [[obj]].

          Assign it to [[scope]].

          The number of assignments that you create is [[count]].
        fr: |
          Regroupez les 12 définitions dans [[obj]].

          Attribuez-la à [[scope]].

          Le nombre d'attributions que vous créez est de [[count]].
      slots:
        - id: obj
          options:
            - { id: custrole, text: { en: "a custom role definition", fr: "une définition de rôle personnalisé" } }
            - { id: init, text: { en: "an initiative", fr: "une initiative" } }
            - { id: mg, text: { en: "a new management group", fr: "un nouveau groupe d'administration" } }
        - id: scope
          options:
            - { id: eachsub, text: { en: "each of Sub-A, Sub-B and Sub-C", fr: "chacun des abonnements Sub-A, Sub-B et Sub-C" } }
            - { id: mgnoexcl, text: { en: "MG1, with no exclusion", fr: "MG1, sans exclusion" } }
            - { id: mgexcl, text: { en: "MG1, with Sub-Lab excluded", fr: "MG1, en excluant Sub-Lab" } }
            - { id: eachrg, text: { en: "each resource group of Sub-A, Sub-B and Sub-C", fr: "chaque groupe de ressources de Sub-A, Sub-B et Sub-C" } }
        - id: count
          options:
            - { id: n1, text: "1" }
            - { id: n3, text: "3" }
            - { id: n12, text: "12" }
            - { id: n36, text: "36" }
    answer:
      values: { obj: init, scope: mgexcl, count: n1 }
    explanation:
      correct:
        en: |
          An initiative groups related policy definitions so that they are assigned and tracked together as one larger goal. One assignment on MG1 is inherited by every subscription of MG1, including resources created later, and a child scope such as Sub-Lab can be excluded from the assignment. The result is a single assignment instead of 3, 12 or 36.
        fr: |
          Une initiative regroupe des définitions de stratégie liées pour qu'elles soient attribuées et suivies ensemble comme un objectif plus large. Une seule attribution sur MG1 est héritée par tous les abonnements de MG1, y compris les ressources créées plus tard, et une étendue enfant comme Sub-Lab peut être exclue de l'attribution. Le résultat est une seule attribution au lieu de 3, 12 ou 36.
      options:
        custrole: { en: "A role definition lists permissions for Azure RBAC; it can't contain policy definitions.", fr: "Une définition de rôle liste des autorisations pour Azure RBAC ; elle ne peut pas contenir de définitions de stratégie." }
        mg: { en: "A management group organizes subscriptions; it doesn't group policy definitions.", fr: "Un groupe d'administration organise des abonnements ; il ne regroupe pas des définitions de stratégie." }
        eachsub: { en: "Three assignments work, but one assignment on MG1 with an exclusion needs fewer.", fr: "Trois attributions fonctionnent, mais une seule attribution sur MG1 avec une exclusion en demande moins." }
        mgnoexcl: { en: "Without an exclusion, the assignment is also inherited by Sub-Lab.", fr: "Sans exclusion, l'attribution est aussi héritée par Sub-Lab." }
        eachrg: { en: "Assigning per resource group multiplies the assignments and misses the resource groups created later.", fr: "Attribuer par groupe de ressources multiplie les attributions et ne couvre pas les groupes de ressources créés plus tard." }
    references:
      - title: Describe the purpose of Azure Policy
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview

  # ------------------------------------------------------------------ 9
  - id: az900-qz-32-09
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a subscription that contains the following resources.

        | Resource | Type | Lock applied directly to the resource |
        | --- | --- | --- |
        | RG-Prod | Resource group | Read-only |
        | VM-A | Virtual machine in RG-Prod | Delete |
        | RG-Test | Resource group | None |
        | VM-B | Virtual machine in RG-Test | Delete |

        A user named Ines has the Owner role for the subscription. No other lock applies.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un abonnement qui contient les ressources suivantes.

        | Ressource | Type | Verrou appliqué directement à la ressource |
        | --- | --- | --- |
        | RG-Prod | Groupe de ressources | Lecture seule |
        | VM-A | Machine virtuelle dans RG-Prod | Suppression |
        | RG-Test | Groupe de ressources | Aucun |
        | VM-B | Machine virtuelle dans RG-Test | Suppression |

        Une utilisatrice nommée Ines dispose du rôle Owner sur l'abonnement. Aucun autre verrou ne s'applique.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "To change the size of VM-A, Ines only needs to remove the Delete lock of VM-A.", fr: "Pour changer la taille de VM-A, Ines doit seulement retirer le verrou Suppression de VM-A." } }
        - { id: s2, text: { en: "Ines can add a tag to VM-B without removing any lock first.", fr: "Ines peut ajouter une étiquette à VM-B sans retirer d'abord aucun verrou." } }
        - { id: s3, text: { en: "Ines can delete RG-Test without removing any lock first.", fr: "Ines peut supprimer RG-Test sans retirer d'abord aucun verrou." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          VM-A inherits the Read-only lock of RG-Prod. Its own Delete lock doesn't block a resize; the inherited Read-only lock does, and it stays in place until it is removed from RG-Prod. A Delete lock allows modifications, so Ines can tag VM-B. Deleting RG-Test would delete VM-B, which its Delete lock protects, so the whole deletion is blocked until that lock is removed.
        fr: |
          VM-A hérite du verrou Lecture seule de RG-Prod. Son propre verrou Suppression ne bloque pas un changement de taille ; c'est le verrou Lecture seule hérité qui le bloque, et il reste en place tant qu'il n'est pas retiré de RG-Prod. Un verrou Suppression autorise les modifications : Ines peut donc ajouter une étiquette à VM-B. Supprimer RG-Test supprimerait VM-B, que son verrou Suppression protège : toute la suppression est donc bloquée tant que ce verrou n'est pas retiré.
      options:
        s1: { en: "Removing the Delete lock changes nothing here: the most restrictive lock in the inheritance chain, the Read-only lock of RG-Prod, still blocks the change.", fr: "Retirer le verrou Suppression ne change rien ici : le verrou le plus restrictif de la chaîne d'héritage, le verrou Lecture seule de RG-Prod, bloque toujours la modification." }
        s3: { en: "A Delete lock on a resource blocks the deletion of its resource group; Azure doesn't delete a resource group partially.", fr: "Un verrou Suppression sur une ressource bloque la suppression de son groupe de ressources ; Azure ne supprime pas un groupe de ressources partiellement." }
    references:
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources

  # ------------------------------------------------------------------ 10
  - id: az900-qz-32-10
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a subscription named **Sub1**. An Azure Policy assignment on Sub1 allows resources to be created only in the West Europe region. Sub1 contains:

        - **RG1**, with a Delete lock. RG1 contains a virtual machine named **VM1**.
        - **RG2**, with a Read-only lock. RG2 contains a storage account named **st2**.

        A user named Ana has the Owner role for Sub1. Ana doesn't remove or change any lock, and no other lock or policy applies.

        Which two actions can Ana perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un abonnement nommé **Sub1**. Une attribution Azure Policy sur Sub1 n'autorise la création de ressources que dans la région Europe Ouest. Sub1 contient :

        - **RG1**, avec un verrou Suppression. RG1 contient une machine virtuelle nommée **VM1**.
        - **RG2**, avec un verrou Lecture seule. RG2 contient un compte de stockage nommé **st2**.

        Une utilisatrice nommée Ana dispose du rôle Owner sur Sub1. Ana ne retire ni ne modifie aucun verrou, et aucun autre verrou ni aucune autre stratégie ne s'applique.

        Quelles sont les deux actions qu'Ana peut effectuer ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a virtual network in RG1 in the North Europe region.", fr: "Créer un réseau virtuel dans RG1 dans la région Europe Nord." } }
        - { id: b, text: { en: "Add a tag to VM1.", fr: "Ajouter une étiquette à VM1." } }
        - { id: c, text: { en: "Change the redundancy of st2.", fr: "Modifier la redondance de st2." } }
        - { id: d, text: { en: "Create a storage account in RG1 in the West Europe region.", fr: "Créer un compte de stockage dans RG1 dans la région Europe Ouest." } }
        - { id: e, text: { en: "Delete VM1.", fr: "Supprimer VM1." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The Delete lock of RG1 is inherited by VM1 and blocks only deletions: Ana can still modify VM1, for example tag it, and create a new resource in RG1. The storage account is in West Europe, so it also complies with the policy. Each control is checked separately: having the Owner role doesn't bypass a lock or a policy.
        fr: |
          Le verrou Suppression de RG1 est hérité par VM1 et ne bloque que les suppressions : Ana peut toujours modifier VM1, par exemple lui ajouter une étiquette, et créer une nouvelle ressource dans RG1. Le compte de stockage est en Europe Ouest : il est donc aussi conforme à la stratégie. Chaque contrôle est vérifié séparément : détenir le rôle Owner ne permet de contourner ni un verrou ni une stratégie.
      options:
        a: { en: "The Delete lock allows the creation, but the policy denies a resource in North Europe, even for an owner.", fr: "Le verrou Suppression autorise la création, mais la stratégie refuse une ressource en Europe Nord, même pour une propriétaire." }
        c: { en: "st2 inherits the Read-only lock of RG2, which blocks every modification.", fr: "st2 hérite du verrou Lecture seule de RG2, qui bloque toute modification." }
        e: { en: "VM1 inherits the Delete lock of RG1; the lock must be removed before VM1 can be deleted.", fr: "VM1 hérite du verrou Suppression de RG1 ; le verrou doit être retiré avant de pouvoir supprimer VM1." }
    references:
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
      - title: Overview of Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
