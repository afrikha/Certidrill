chapter: 23-storage
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An application of Adatum keeps an address book of its suppliers. Each entry is identified by a key and has a set of attributes that can differ from one entry to another. The application needs no joins and no relational schema.

        Which Azure Storage service is designed for this kind of data?
      fr: |
        Une application d'Adatum tient un carnet d'adresses de ses fournisseurs. Chaque entrée est identifiée par une clé et possède un ensemble d'attributs qui peut varier d'une entrée à l'autre. L'application n'a besoin ni de jointures ni de schéma relationnel.

        Quel service de Stockage Azure est conçu pour ce type de données ?
    body:
      options:
        - { id: a, text: Azure Queues }
        - { id: b, text: Azure Files }
        - { id: c, text: Azure Tables }
        - { id: d, text: Azure Disks }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Tables stores structured, non-relational (NoSQL) data as entities made of a key and attributes, without a fixed schema. It suits flexible datasets such as address books or device metadata.
        fr: |
          Azure Tables stocke des données structurées non relationnelles (NoSQL) sous forme d'entités composées d'une clé et d'attributs, sans schéma fixe. Il convient aux jeux de données flexibles comme les carnets d'adresses ou les métadonnées d'appareils.
      options:
        a: { en: "Azure Queues stores messages that components exchange for asynchronous processing, not records that are looked up by key.", fr: "Azure Queues stocke des messages que des composants échangent pour un traitement asynchrone, pas des enregistrements recherchés par clé." }
        b: { en: "Azure Files provides file shares accessed over SMB or NFS; it doesn't store entities with keys and attributes.", fr: "Azure Files fournit des partages de fichiers accessibles par SMB ou NFS ; il ne stocke pas d'entités avec des clés et des attributs." }
        d: { en: "Azure Disks provides block-level volumes for virtual machines, not a key-attribute data store.", fr: "Azure Disks fournit des volumes de niveau bloc pour les machines virtuelles, pas un magasin de données clé-attributs." }
    references:
      - title: Introduction to Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction

  # ------------------------------------------------------------------ 2
  - id: az900-qz-23-02
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which redundancy option keeps copies of a storage account's data in three availability zones of the primary region and also copies the data to the paired region?
      fr: |
        Quelle option de redondance conserve des copies des données d'un compte de stockage dans trois zones de disponibilité de la région primaire et copie aussi les données dans la région jumelée ?
    body:
      options:
        - { id: a, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
        - { id: b, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
        - { id: c, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
        - { id: d, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          GZRS combines ZRS in the primary region, with copies in three availability zones, and replication to a secondary region, which is the paired region. It protects against the failure of a zone and of a whole region.
        fr: |
          GZRS combine ZRS dans la région primaire, avec des copies dans trois zones de disponibilité, et la réplication vers une région secondaire, qui est la région jumelée. Il protège contre la panne d'une zone et d'une région entière.
      options:
        a: { en: "ZRS uses three availability zones but keeps every copy in the primary region.", fr: "ZRS utilise trois zones de disponibilité, mais conserve toutes les copies dans la région primaire." }
        b: { en: "GRS copies the data to the paired region, but in the primary region it keeps the copies in a single datacenter (LRS), not in three zones.", fr: "GRS copie les données dans la région jumelée, mais dans la région primaire il conserve les copies dans un seul centre de données (LRS), pas dans trois zones." }
        c: { en: "LRS keeps three copies in a single datacenter of the primary region, with no zone or regional protection.", fr: "LRS conserve trois copies dans un seul centre de données de la région primaire, sans protection de zone ni de région." }
    references:
      - title: Azure Storage redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ------------------------------------------------------------------ 3
  - id: az900-qz-23-03
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders creates a standard general-purpose v2 storage account named **northwindanalytics**. The analytics team plans to store raw sales data files in the account and analyze them with big data tools, and the developers plan to add message queues for their order services to the same account. The data must be protected against the loss of a zone and of a region.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders crée un compte de stockage usage général v2 Standard nommé **northwindanalytics**. L'équipe d'analyse prévoit d'y stocker des fichiers bruts de données de ventes et de les analyser avec des outils de big data, et les développeurs prévoient d'ajouter des files d'attente de messages pour leurs services de commandes dans le même compte. Les données doivent être protégées contre la perte d'une zone et d'une région.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "northwindanalytics can be used for Azure Data Lake Storage.", fr: "northwindanalytics peut être utilisé pour Azure Data Lake Storage." }
        - id: s2
          text: { en: "The applications reach the queues and the blobs of northwindanalytics through the same endpoint URL.", fr: "Les applications atteignent les files d'attente et les objets blob de northwindanalytics par la même URL de point de terminaison." }
        - id: s3
          text: { en: "northwindanalytics can use geo-zone-redundant storage (GZRS).", fr: "northwindanalytics peut utiliser le stockage géoredondant interzone (GZRS)." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A standard general-purpose v2 account supports Blob Storage, including Data Lake Storage, as well as Queue Storage, Table Storage and Azure Files, with every redundancy option, GZRS included. Each service of the account has its own endpoint: blobs at `blob.core.windows.net` and queues at `queue.core.windows.net`.
        fr: |
          Un compte usage général v2 Standard prend en charge le Stockage Blob, y compris Data Lake Storage, ainsi que le Stockage File d'attente, le Stockage Table et Azure Files, avec toutes les options de redondance, GZRS compris. Chaque service du compte a son propre point de terminaison : les objets blob sur `blob.core.windows.net` et les files d'attente sur `queue.core.windows.net`.
      options:
        s2: { en: "The account name is shared, but the service part of the URL differs: blob, dfs, file, queue or table.", fr: "Le nom du compte est commun, mais la partie service de l'URL diffère : blob, dfs, file, queue ou table." }
    references:
      - title: Overview of storage accounts
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview

  # ------------------------------------------------------------------ 4
  - id: az900-qz-23-04
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A branch office of Contoso has a Windows Server file server whose disk can hold 2 TB. The branch's files, now 10 TB, will be centralized in an Azure file share. Users must keep opening the files from the branch server over SMB, and the server must keep locally only the files that are used often.

        What should Contoso use?
      fr: |
        Une agence de Contoso dispose d'un serveur de fichiers Windows Server dont le disque peut contenir 2 To. Les fichiers de l'agence, qui atteignent 10 To, seront centralisés dans un partage de fichiers Azure. Les utilisateurs doivent continuer à ouvrir les fichiers depuis le serveur de l'agence par SMB, et le serveur ne doit conserver localement que les fichiers souvent utilisés.

        Que doit utiliser Contoso ?
    body:
      options:
        - { id: a, text: { en: "AzCopy, run by a scheduled task on the server", fr: "AzCopy, exécuté par une tâche planifiée sur le serveur" } }
        - { id: b, text: { en: "Azure Storage Explorer, installed on the server", fr: "L'Explorateur Stockage Azure, installé sur le serveur" } }
        - { id: c, text: { en: "Azure Data Box, shipped to the branch every month", fr: "Azure Data Box, expédié à l'agence chaque mois" } }
        - { id: d, text: { en: "Azure File Sync, with cloud tiering on the server", fr: "Azure File Sync, avec la hiérarchisation cloud sur le serveur" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Azure File Sync centralizes the files in Azure Files and turns the Windows file server into a cache that users keep opening over SMB. Cloud tiering keeps the frequently used files on the local disk and leaves the others in the cloud, so 10 TB of files fit behind a 2-TB disk.
        fr: |
          Azure File Sync centralise les fichiers dans Azure Files et fait du serveur de fichiers Windows un cache que les utilisateurs continuent d'ouvrir par SMB. La hiérarchisation cloud conserve sur le disque local les fichiers souvent utilisés et laisse les autres dans le cloud : 10 To de fichiers tiennent ainsi derrière un disque de 2 To.
      options:
        a: { en: "AzCopy copies data in one direction; it doesn't keep a local cache that frees the disk of rarely used files.", fr: "AzCopy copie les données dans un seul sens ; il ne maintient pas de cache local qui libère le disque des fichiers peu utilisés." }
        b: { en: "Storage Explorer is a graphical tool for manual uploads and downloads; it doesn't synchronize or tier a file server.", fr: "L'Explorateur Stockage Azure est un outil graphique pour des chargements et téléchargements manuels ; il ne synchronise ni ne hiérarchise un serveur de fichiers." }
        c: { en: "Data Box moves large amounts of data offline; it doesn't keep a file server synchronized with Azure Files.", fr: "Data Box déplace hors connexion de grandes quantités de données ; il ne maintient pas un serveur de fichiers synchronisé avec Azure Files." }
    references:
      - title: Azure File Sync cloud tiering overview
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-23-05
    objective: "2.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam must move 60 TB of existing project files from its datacenter to a storage account. Over the datacenter's internet connection, the upload would take about three months, but the files must be in Azure within three weeks. After this initial move, about 20 GB of new files per day must reach the same account.

        Which approach should Fabrikam use?
      fr: |
        Fabrikam doit déplacer 60 To de fichiers de projet existants de son centre de données vers un compte de stockage. Par la connexion internet du centre de données, le chargement prendrait environ trois mois, mais les fichiers doivent être dans Azure sous trois semaines. Après ce déplacement initial, environ 20 Go de nouveaux fichiers par jour doivent rejoindre le même compte.

        Quelle approche Fabrikam doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "AzCopy over the network for the existing files, then Azure Data Box for the new files", fr: "AzCopy par le réseau pour les fichiers existants, puis Azure Data Box pour les nouveaux fichiers" } }
        - { id: b, text: { en: "Azure Migrate for the existing files, then Azure Data Box for the new files", fr: "Azure Migrate pour les fichiers existants, puis Azure Data Box pour les nouveaux fichiers" } }
        - { id: c, text: { en: "Azure Data Box for the existing files, then AzCopy over the network for the new files", fr: "Azure Data Box pour les fichiers existants, puis AzCopy par le réseau pour les nouveaux fichiers" } }
        - { id: d, text: { en: "Azure Data Box for the existing files, then a new Data Box for each day's new files", fr: "Azure Data Box pour les fichiers existants, puis un nouveau Data Box pour les nouveaux fichiers de chaque jour" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An initial bulk transfer followed by incremental transfers over the network is a typical Data Box scenario. The device moves the 60 TB that the network can't carry in time, and the daily 20 GB is small enough for the internet connection, where AzCopy can copy it.
        fr: |
          Un transfert initial en bloc suivi de transferts incrémentiels par le réseau est un scénario typique de Data Box. L'appareil déplace les 60 To que le réseau ne peut pas acheminer à temps, et les 20 Go quotidiens sont assez faibles pour la connexion internet, où AzCopy peut les copier.
      options:
        a: { en: "Uploading the 60 TB over the network would take about three months instead of three weeks, and shipping a device for small daily increments is slow and impractical.", fr: "Charger les 60 To par le réseau prendrait environ trois mois au lieu de trois semaines, et expédier un appareil pour de petits incréments quotidiens est lent et peu pratique." }
        b: { en: "Azure Migrate discovers, assesses and migrates servers, databases and applications; it isn't the tool that moves files, and Data Box doesn't suit small daily increments.", fr: "Azure Migrate découvre, évalue et migre des serveurs, des bases de données et des applications ; ce n'est pas l'outil qui déplace des fichiers, et Data Box ne convient pas à de petits incréments quotidiens." }
        d: { en: "Each Data Box round trip takes days of shipping, so it can't deliver each day's files; 20 GB per day fits the existing connection.", fr: "Chaque aller-retour d'un Data Box demande des jours d'expédition : il ne peut pas livrer les fichiers de chaque jour ; 20 Go par jour passent par la connexion existante." }
    references:
      - title: What is Azure Data Box?
        url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview

  # ------------------------------------------------------------------ 6
  - id: az900-qz-23-06
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware needs Azure file shares for a department application. Standard performance on hard disk drives is enough. The shares must stay available if one availability zone of the primary region fails, and a copy of the data must survive the loss of the whole primary region. All the shares must be in a single storage account. The primary region has availability zones and a paired region.

        Which storage account configuration should you use?
      fr: |
        Litware a besoin de partages de fichiers Azure pour une application de service. Des performances standard sur disques durs suffisent. Les partages doivent rester disponibles si une zone de disponibilité de la région primaire tombe en panne, et une copie des données doit survivre à la perte de toute la région primaire. Tous les partages doivent se trouver dans un seul compte de stockage. La région primaire dispose de zones de disponibilité et d'une région jumelée.

        Quelle configuration de compte de stockage devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Premium file shares with geo-zone-redundant storage (GZRS)", fr: "Partages de fichiers Premium avec stockage géoredondant interzone (GZRS)" } }
        - { id: b, text: { en: "Standard general-purpose v2 with zone-redundant storage (ZRS)", fr: "Usage général v2 Standard avec stockage redondant interzone (ZRS)" } }
        - { id: c, text: { en: "Premium file shares with zone-redundant storage (ZRS)", fr: "Partages de fichiers Premium avec stockage redondant interzone (ZRS)" } }
        - { id: d, text: { en: "Standard general-purpose v2 with geo-zone-redundant storage (GZRS)", fr: "Usage général v2 Standard avec stockage géoredondant interzone (GZRS)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Surviving a zone failure and a regional loss together requires GZRS. A standard general-purpose v2 account supports Azure Files with GZRS, and standard performance is enough here. Premium accounts offer only LRS and ZRS: they have no geo-redundancy.
        fr: |
          Survivre à la fois à la panne d'une zone et à la perte d'une région demande GZRS. Un compte usage général v2 Standard prend en charge Azure Files avec GZRS, et les performances standard suffisent ici. Les comptes premium ne proposent que LRS et ZRS : ils n'offrent aucune géoredondance.
      options:
        a: { en: "Premium file shares accounts support only LRS and ZRS; GZRS isn't available for them.", fr: "Les comptes Partages de fichiers Premium ne prennent en charge que LRS et ZRS ; GZRS n'y est pas disponible." }
        b: { en: "ZRS survives the failure of a zone but keeps every copy in the primary region, so the data is lost with the region.", fr: "ZRS survit à la panne d'une zone mais conserve toutes les copies dans la région primaire : les données sont perdues avec la région." }
        c: { en: "Premium ZRS survives a zone failure but has no copy outside the primary region, and premium performance isn't required.", fr: "Premium avec ZRS survit à la panne d'une zone mais n'a aucune copie hors de la région primaire, et les performances premium ne sont pas requises." }
    references:
      - title: Overview of storage accounts
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
      - title: Azure Files data redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/files/files-redundancy

  # ------------------------------------------------------------------ 7
  - id: az900-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys is designing an order application that uses Azure Storage:

        - The website hands each new order to a back-end component that processes orders at its own pace. An order is a JSON document of about 2 KB, and some customers attach a scanned contract of up to 5 MB.
        - Each product of the catalog has its own set of attributes, and new attributes are added often.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys conçoit une application de commandes qui utilise Stockage Azure :

        - Le site web transmet chaque nouvelle commande à un composant back-end qui traite les commandes à son propre rythme. Une commande est un document JSON d'environ 2 Ko, et certains clients y joignent un contrat numérisé allant jusqu'à 5 Mo.
        - Chaque produit du catalogue a son propre ensemble d'attributs, et de nouveaux attributs sont souvent ajoutés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Each order, including its attached contract, can be placed in Azure Queues as a single message.", fr: "Chaque commande, y compris son contrat joint, peut être placée dans Azure Queues sous forme d'un seul message." }
        - id: s2
          text: { en: "Azure Tables suits the catalog, even though the products don't share the same set of attributes.", fr: "Azure Tables convient au catalogue, même si les produits ne partagent pas le même ensemble d'attributs." }
        - id: s3
          text: { en: "If the website places orders in a queue, an order is lost when the back-end component isn't running at the moment the order is sent.", fr: "Si le site web place les commandes dans une file d'attente, une commande est perdue quand le composant back-end n'est pas en cours d'exécution au moment où elle est envoyée." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A queue message is limited to 64 KB: a 2-KB order fits, but a 5-MB contract doesn't, so the contract would go to Blob Storage. Azure Tables stores non-relational entities without a fixed schema, so each product can have its own attributes. A queue keeps the messages until the back-end component reads them: that backlog is what decouples the two components.
        fr: |
          Un message de file d'attente est limité à 64 Ko : une commande de 2 Ko y tient, mais pas un contrat de 5 Mo, qui irait donc dans le Stockage Blob. Azure Tables stocke des entités non relationnelles sans schéma fixe : chaque produit peut donc avoir ses propres attributs. Une file d'attente conserve les messages jusqu'à ce que le composant back-end les lise : c'est ce backlog qui découple les deux composants.
      options:
        s1: { en: "Queue messages can be up to 64 KB; a large attachment is stored elsewhere, for example as a blob.", fr: "Les messages de file d'attente font au plus 64 Ko ; une pièce jointe volumineuse se stocke ailleurs, par exemple comme objet blob." }
        s3: { en: "The queue stores the messages until they are processed, so the website and the back end don't need to run at the same time.", fr: "La file d'attente stocke les messages jusqu'à leur traitement : le site web et le back-end n'ont pas besoin de s'exécuter en même temps." }
    references:
      - title: What is Azure Queue Storage?
        url: https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
      - title: Introduction to Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction

  # ------------------------------------------------------------------ 8
  - id: az900-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso is choosing the redundancy of two storage accounts:

        - **stcontosoorders**: during an outage of the primary region, the ordering application must keep reading the data from the secondary region without waiting for a failover. The data must also stay available if one availability zone of the primary region fails.
        - **stcontosobackup**: the backup copies must survive the loss of the primary region. Reading them only after a failover is acceptable, zone failures don't need to be covered, and the cost must be as low as possible.

        Select the answers that correctly complete the sentences.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso choisit la redondance de deux comptes de stockage :

        - **stcontosoorders** : pendant une panne de la région primaire, l'application de commandes doit continuer à lire les données depuis la région secondaire sans attendre de basculement. Les données doivent aussi rester disponibles si une zone de disponibilité de la région primaire tombe en panne.
        - **stcontosobackup** : les copies de sauvegarde doivent survivre à la perte de la région primaire. Ne pouvoir les lire qu'après un basculement est acceptable, les pannes de zone n'ont pas à être couvertes, et le coût doit être le plus faible possible.

        Sélectionnez les réponses qui complètent correctement les phrases.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          For stcontosoorders, use [[orders]].

          For stcontosobackup, use [[backup]].
        fr: |
          Pour stcontosoorders, utilisez [[orders]].

          Pour stcontosobackup, utilisez [[backup]].
      slots:
        - id: orders
          options:
            - { id: zrs, text: ZRS }
            - { id: grs, text: GRS }
            - { id: ragrs, text: RA-GRS }
            - { id: gzrs, text: GZRS }
            - { id: ragzrs, text: RA-GZRS }
        - id: backup
          options:
            - { id: zrs, text: ZRS }
            - { id: grs, text: GRS }
            - { id: ragrs, text: RA-GRS }
            - { id: gzrs, text: GZRS }
            - { id: ragzrs, text: RA-GZRS }
    shuffle: false
    answer:
      values: { orders: ragzrs, backup: grs }
    explanation:
      correct:
        en: |
          stcontosoorders needs zone protection in the primary region and read access to the secondary region at any time: only RA-GZRS combines both. stcontosobackup only needs a copy in another region, readable after a failover: GRS is the cheapest option that meets this, because zone redundancy and read access to the secondary region both add cost.
        fr: |
          stcontosoorders a besoin d'une protection de zone dans la région primaire et d'un accès en lecture à la région secondaire à tout moment : seul RA-GZRS combine les deux. stcontosobackup n'a besoin que d'une copie dans une autre région, lisible après un basculement : GRS est l'option la moins chère qui y répond, car la redondance de zone et l'accès en lecture à la région secondaire ajoutent chacun un coût.
      options:
        ragrs: { en: "RA-GRS gives read access to the secondary region but keeps the primary copies in one datacenter (no zone protection), and for the backups that read access is an unneeded cost.", fr: "RA-GRS donne un accès en lecture à la région secondaire mais conserve les copies primaires dans un seul centre de données (pas de protection de zone), et pour les sauvegardes cet accès en lecture est un coût inutile." }
        gzrs: { en: "GZRS covers zones and the region, but the secondary copy is readable only after a failover, and zone coverage isn't needed for the backups.", fr: "GZRS couvre les zones et la région, mais la copie secondaire n'est lisible qu'après un basculement, et la couverture de zone n'est pas nécessaire pour les sauvegardes." }
        zrs: { en: "ZRS keeps all the copies in the primary region, so it doesn't survive the loss of the region.", fr: "ZRS conserve toutes les copies dans la région primaire : il ne survit pas à la perte de la région." }
    references:
      - title: Azure Storage redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ------------------------------------------------------------------ 9
  - id: az900-qz-23-09
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank stores daily transaction exports in a storage account named **stwgexports** that uses geo-zone-redundant storage (GZRS). The primary region of stwgexports is West Europe. Read access to the secondary region isn't enabled. The risk team asks what happens to the exports during a zone failure and during a regional outage.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke ses exports quotidiens de transactions dans un compte de stockage nommé **stwgexports** qui utilise le stockage géoredondant interzone (GZRS). La région primaire de stwgexports est Europe Ouest. L'accès en lecture à la région secondaire n'est pas activé. L'équipe des risques demande ce qu'il advient des exports pendant une panne de zone et pendant une panne régionale.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A blob that was written to stwgexports a few seconds before an outage of West Europe is guaranteed to be present in the secondary region.", fr: "Un objet blob écrit dans stwgexports quelques secondes avant une panne d'Europe Ouest est forcément présent dans la région secondaire." }
        - id: s2
          text: { en: "If one availability zone of West Europe fails, the data of stwgexports stays available in West Europe.", fr: "Si une zone de disponibilité d'Europe Ouest tombe en panne, les données de stwgexports restent disponibles en Europe Ouest." }
        - id: s3
          text: { en: "During an outage of West Europe, Woodgrove can make the data of stwgexports readable by failing over the account to the secondary region.", fr: "Pendant une panne d'Europe Ouest, Woodgrove peut rendre les données de stwgexports lisibles en basculant le compte vers la région secondaire." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          GZRS keeps copies in three availability zones of the primary region, so the loss of one zone doesn't interrupt access. The copy to the secondary region is asynchronous: the most recent writes may not have reached it when the primary region fails. Without read access (RA-GZRS), the secondary copy becomes readable after a failover makes the secondary region the primary one.
        fr: |
          GZRS conserve des copies dans trois zones de disponibilité de la région primaire : la perte d'une zone n'interrompt donc pas l'accès. La copie vers la région secondaire est asynchrone : les écritures les plus récentes peuvent ne pas l'avoir atteinte quand la région primaire tombe en panne. Sans accès en lecture (RA-GZRS), la copie secondaire devient lisible après un basculement qui fait de la région secondaire la région primaire.
      options:
        s1: { en: "Replication to the secondary region is asynchronous, so writes made just before the outage can be missing there.", fr: "La réplication vers la région secondaire est asynchrone : des écritures faites juste avant la panne peuvent y manquer." }
    references:
      - title: Azure Storage redundancy
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ------------------------------------------------------------------ 10
  - id: az900-qz-23-10
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a standard general-purpose v2 storage account named **stcontosomedia** whose default access tier is Cool. The account contains three blobs:

        - **clip1** was uploaded without specifying an access tier.
        - **clip2** was explicitly set to the Archive tier.
        - **clip3** was explicitly set to the Cold tier.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un compte de stockage usage général v2 Standard nommé **stcontosomedia** dont le niveau d'accès par défaut est le niveau froid (Cool). Le compte contient trois objets blob :

        - **clip1** a été chargé sans préciser de niveau d'accès.
        - **clip2** a été explicitement placé dans le niveau archive (Archive).
        - **clip3** a été explicitement placé dans le niveau froid (Cold).

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "clip1 is stored in the Cool tier and can be read immediately.", fr: "clip1 est stocké dans le niveau froid (Cool) et peut être lu immédiatement." }
        - id: s2
          text: { en: "clip3 costs less to store than clip1, but reading clip3 costs more than reading clip1.", fr: "clip3 coûte moins cher à stocker que clip1, mais lire clip3 coûte plus cher que lire clip1." }
        - id: s3
          text: { en: "Changing the default access tier of stcontosomedia to Hot makes clip2 readable within seconds.", fr: "Passer le niveau d'accès par défaut de stcontosomedia au niveau chaud (Hot) rend clip2 lisible en quelques secondes." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A blob uploaded without a tier takes the default access tier of the account, here Cool, an online tier. Cold stores data for less than Cool but charges more to read it. The default tier only applies to blobs whose tier isn't explicitly set, and an archived blob is offline: it must be rehydrated to an online tier, which takes hours.
        fr: |
          Un objet blob chargé sans niveau prend le niveau d'accès par défaut du compte, ici le niveau froid (Cool), un niveau en ligne. Le niveau froid (Cold) stocke les données moins cher que le niveau froid (Cool) mais facture davantage leur lecture. Le niveau par défaut ne s'applique qu'aux objets blob dont le niveau n'est pas défini explicitement, et un objet blob archivé est hors connexion : il doit être réhydraté vers un niveau en ligne, ce qui prend des heures.
      options:
        s3: { en: "clip2 has an explicit tier, so the account default doesn't apply to it, and reading it requires a rehydration that takes hours.", fr: "clip2 a un niveau explicite : le niveau par défaut du compte ne s'y applique pas, et le lire exige une réhydratation qui prend des heures." }
    references:
      - title: Access tiers for blob data
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
