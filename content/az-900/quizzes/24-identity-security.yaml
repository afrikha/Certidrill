chapter: 24-identity-security
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam notices that attackers keep trying to guess the passwords of its users in Microsoft Entra ID. Fabrikam wants these attempts to be stopped automatically, while the legitimate users can keep signing in.

        Which Microsoft Entra ID capability provides this protection?
      fr: |
        Fabrikam constate que des attaquants tentent sans cesse de deviner les mots de passe de ses utilisateurs dans Microsoft Entra ID. Fabrikam veut que ces tentatives soient arrêtées automatiquement, tandis que les utilisateurs légitimes peuvent continuer à se connecter.

        Quelle fonctionnalité de Microsoft Entra ID offre cette protection ?
    body:
      options:
        - { id: a, text: { en: "Single sign-on", fr: "Authentification unique" } }
        - { id: b, text: { en: "Smart lockout", fr: "Verrouillage intelligent" } }
        - { id: c, text: { en: "Self-service password reset", fr: "Réinitialisation de mot de passe en libre-service" } }
        - { id: d, text: { en: "Device registration", fr: "Inscription des appareils" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Smart lockout is part of the authentication services of Microsoft Entra ID. It locks out attackers who try to guess passwords or use brute force, and it recognizes the sign-ins of valid users so that they can keep signing in. It is always on for all Microsoft Entra customers.
        fr: |
          Le verrouillage intelligent fait partie des services d'authentification de Microsoft Entra ID. Il bloque les attaquants qui tentent de deviner des mots de passe ou de forcer l'accès, et il reconnaît les connexions des utilisateurs légitimes pour qu'ils puissent continuer à se connecter. Il est toujours activé pour tous les clients Microsoft Entra.
      options:
        a: { en: "Single sign-on lets a user reach many applications after one sign-in; it doesn't block password guessing.", fr: "L'authentification unique permet d'accéder à de nombreuses applications après une seule connexion ; elle ne bloque pas les tentatives de deviner les mots de passe." }
        c: { en: "Self-service password reset lets users set a new password themselves; it doesn't stop the attempts of attackers.", fr: "La réinitialisation de mot de passe en libre-service permet aux utilisateurs de définir eux-mêmes un nouveau mot de passe ; elle n'arrête pas les tentatives des attaquants." }
        d: { en: "Device registration makes devices known to the directory so that access can depend on the device; it doesn't lock out attackers.", fr: "L'inscription des appareils fait connaître les appareils à l'annuaire pour que l'accès puisse dépendre de l'appareil ; elle ne bloque pas les attaquants." }
    references:
      - title: Prevent Attacks Using Smart Lockout - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout

  # ------------------------------------------------------------------ 2
  - id: az900-qz-24-02
    objective: "2.4.2"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys wants its users to sign in to Microsoft Entra ID without typing any password.

        Which two methods should Tailspin Toys use? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys veut que ses utilisateurs se connectent à Microsoft Entra ID sans saisir aucun mot de passe.

        Quelles sont les deux méthodes que Tailspin Toys doit utiliser ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A password, followed by a code sent by text message", fr: "Un mot de passe, suivi d'un code envoyé par SMS" } }
        - { id: b, text: { en: "A FIDO2 security key, selected at the sign-in screen", fr: "Une clé de sécurité FIDO2, sélectionnée sur l'écran de connexion" } }
        - { id: c, text: { en: "A password, followed by the answers to security questions", fr: "Un mot de passe, suivi des réponses à des questions de sécurité" } }
        - { id: d, text: { en: "The Microsoft Authenticator app on a phone", fr: "L'application Microsoft Authenticator sur un téléphone" } }
        - { id: e, text: { en: "Self-service password reset, with a code sent to the phone", fr: "La réinitialisation de mot de passe en libre-service, avec un code envoyé au téléphone" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Passwordless methods replace the password with something the user has, combined with something the user is or knows. A FIDO2 security key is a hardware device that handles authentication without a user name or password. With the Microsoft Authenticator app, the user matches a number shown on screen and confirms with a fingerprint, a face or a PIN on the phone.
        fr: |
          Les méthodes sans mot de passe remplacent le mot de passe par quelque chose que l'utilisateur possède, combiné à quelque chose qu'il est ou qu'il sait. Une clé de sécurité FIDO2 est un appareil matériel qui gère l'authentification sans nom d'utilisateur ni mot de passe. Avec l'application Microsoft Authenticator, l'utilisateur fait correspondre un nombre affiché à l'écran et confirme avec une empreinte, son visage ou un code PIN sur le téléphone.
      options:
        a: { en: "This is multifactor authentication: the user still types a password before the text message code.", fr: "Il s'agit d'authentification multifacteur : l'utilisateur saisit toujours un mot de passe avant le code reçu par SMS." }
        c: { en: "The user still types a password, and security questions are something the user knows, like the password.", fr: "L'utilisateur saisit toujours un mot de passe, et les questions de sécurité sont quelque chose qu'il sait, comme le mot de passe." }
        e: { en: "Self-service password reset sets a new password; the user then signs in with that password.", fr: "La réinitialisation de mot de passe en libre-service définit un nouveau mot de passe ; l'utilisateur se connecte ensuite avec ce mot de passe." }
    references:
      - title: Describe Azure authentication methods
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods

  # ------------------------------------------------------------------ 3
  - id: az900-qz-24-03
    objective: "2.4.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware uses Microsoft Defender for Cloud to assess the security posture of its Azure subscriptions. Litware also runs workloads in Google Cloud, and these workloads must stay there.

        The security team wants the security recommendations for the Google Cloud resources to appear in Defender for Cloud, next to those of the Azure resources. What should Litware do?
      fr: |
        Litware utilise Microsoft Defender pour le cloud pour évaluer la posture de sécurité de ses abonnements Azure. Litware exécute aussi des charges de travail dans Google Cloud, et ces charges doivent y rester.

        L'équipe de sécurité veut que les recommandations de sécurité des ressources Google Cloud apparaissent dans Defender pour le cloud, à côté de celles des ressources Azure. Que doit faire Litware ?
    body:
      options:
        - { id: a, text: { en: "Migrate the Google Cloud workloads to Azure by using Azure Migrate.", fr: "Migrer les charges de travail Google Cloud vers Azure avec Azure Migrate." } }
        - { id: b, text: { en: "Move the Google Cloud resources to a resource group of a protected subscription.", fr: "Déplacer les ressources Google Cloud vers un groupe de ressources d'un abonnement protégé." } }
        - { id: c, text: { en: "Connect the Google Cloud projects to Defender for Cloud.", fr: "Connecter les projets Google Cloud à Defender pour le cloud." } }
        - { id: d, text: { en: "Enable Azure Advisor recommendations for the Google Cloud projects.", fr: "Activer les recommandations d'Azure Advisor pour les projets Google Cloud." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender for Cloud protects multicloud environments: you connect your Amazon Web Services accounts and Google Cloud projects to it, and their resources are assessed without leaving their cloud. Their recommendations then appear in the same posture view as those of the Azure resources.
        fr: |
          Defender pour le cloud protège les environnements multiclouds : vous y connectez vos comptes Amazon Web Services et vos projets Google Cloud, et leurs ressources sont évaluées sans quitter leur cloud. Leurs recommandations apparaissent alors dans la même vue de la posture que celles des ressources Azure.
      options:
        a: { en: "Migrating would move the workloads out of Google Cloud, which the scenario forbids.", fr: "Une migration ferait sortir les charges de travail de Google Cloud, ce que le scénario interdit." }
        b: { en: "Resources hosted in Google Cloud can't be moved into an Azure resource group; resource groups only contain Azure resources.", fr: "Des ressources hébergées dans Google Cloud ne peuvent pas être déplacées dans un groupe de ressources Azure ; les groupes de ressources ne contiennent que des ressources Azure." }
        d: { en: "Azure Advisor gives recommendations for Azure resources only, and it isn't the security posture tool of the scenario.", fr: "Azure Advisor ne donne des recommandations que pour les ressources Azure, et ce n'est pas l'outil de posture de sécurité du scénario." }
    references:
      - title: Microsoft Defender for Cloud Overview - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction

  # ------------------------------------------------------------------ 4
  - id: az900-qz-24-04
    objective: "2.4.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The developers of Contoso stored the connection strings of a database in the source code of a web application. They move these secrets to Azure Key Vault, and the application now retrieves them at run time.

        Which layer of the defense-in-depth model does this change strengthen?
      fr: |
        Les développeurs de Contoso stockaient les chaînes de connexion d'une base de données dans le code source d'une application web. Ils déplacent ces secrets dans Azure Key Vault, et l'application les récupère désormais à l'exécution.

        Quelle couche du modèle de défense en profondeur cette modification renforce-t-elle ?
    body:
      options:
        - { id: a, text: { en: "Data", fr: "Données" } }
        - { id: b, text: { en: "Compute", fr: "Calcul" } }
        - { id: c, text: { en: "Application", fr: "Application" } }
        - { id: d, text: { en: "Identity and access", fr: "Identité et accès" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The application layer covers applications that are free of vulnerabilities and whose sensitive secrets are kept in a secure storage medium such as Azure Key Vault. Removing secrets from the source code is an application control: a leak of the code no longer reveals how to reach the database.
        fr: |
          La couche application couvre des applications sans vulnérabilités, dont les secrets sensibles sont conservés dans un support de stockage sûr comme Azure Key Vault. Retirer les secrets du code source est un contrôle de l'application : une fuite du code ne révèle plus comment atteindre la base de données.
      options:
        a: { en: "The data layer protects the data itself, for example with encryption at rest and in transit; the change here concerns how the application keeps its secrets.", fr: "La couche données protège les données elles-mêmes, par exemple par le chiffrement au repos et en transit ; la modification concerne ici la façon dont l'application conserve ses secrets." }
        b: { en: "The compute layer secures access to virtual machines, endpoint protection and patching, not the secrets of an application.", fr: "La couche calcul sécurise l'accès aux machines virtuelles, la protection des points de terminaison et les correctifs, pas les secrets d'une application." }
        d: { en: "The identity and access layer covers sign-in, single sign-on, multifactor authentication and auditing of access, not where an application stores its secrets.", fr: "La couche identité et accès couvre la connexion, l'authentification unique, l'authentification multifacteur et l'audit des accès, pas l'endroit où une application stocke ses secrets." }
    references:
      - title: Describe defense-in-depth
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth

  # ------------------------------------------------------------------ 5
  - id: az900-qz-24-05
    objective: "2.4.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys replaces its perimeter-based security, in which every device connected to the corporate network was trusted, with the Zero Trust model. Its employees work from the office, from home and from customer sites, with laptops and phones.

        For each of the following practices, select **Yes** if the practice follows the Zero Trust model. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys remplace sa sécurité fondée sur le périmètre, dans laquelle tout appareil connecté au réseau de l'entreprise était approuvé, par le modèle Confiance Zéro. Ses employés travaillent au bureau, à domicile et chez les clients, avec des ordinateurs portables et des téléphones.

        Pour chacune des pratiques suivantes, sélectionnez **Oui** si la pratique suit le modèle Confiance Zéro. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "An employee who signed in at the office in the morning opens the payroll application from a hotel in the afternoon, without any new verification.", fr: "Un employé qui s'est connecté au bureau le matin ouvre l'application de paie depuis un hôtel l'après-midi, sans aucune nouvelle vérification." } }
        - { id: s2, text: { en: "The IT administrators keep permanent Owner permissions on every subscription, so that they can react quickly to incidents.", fr: "Les administrateurs informatiques conservent en permanence des autorisations Owner sur chaque abonnement, pour pouvoir réagir vite aux incidents." } }
        - { id: s3, text: { en: "Wingtip Toys continuously analyzes its sign-in and network logs to detect intrusions and limit their impact.", fr: "Wingtip Toys analyse en continu ses journaux de connexion et de réseau pour détecter les intrusions et limiter leur impact." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Zero Trust grants access based on authentication rather than location, and it verifies each access explicitly with all available data points, such as the new location. Least privilege access limits permissions with just-in-time and just-enough access, which rules out permanent broad rights. Assume breach uses analytics to get visibility and detect threats, and segments access to limit the impact of an intrusion.
        fr: |
          La Confiance Zéro accorde l'accès en fonction de l'authentification plutôt que de l'emplacement, et vérifie explicitement chaque accès à partir de toutes les données disponibles, comme le nouvel emplacement. L'accès selon le moindre privilège limite les autorisations au juste-à-temps et au juste nécessaire, ce qui exclut des droits larges et permanents. Supposer une violation consiste à utiliser l'analyse pour obtenir de la visibilité et détecter les menaces, et à segmenter l'accès pour limiter l'impact d'une intrusion.
      options:
        s1: { en: "A sign-in earlier in the day doesn't make later requests trusted: each access, here from a new location, is verified explicitly.", fr: "Une connexion plus tôt dans la journée ne rend pas les demandes suivantes approuvées : chaque accès, ici depuis un nouvel emplacement, est vérifié explicitement." }
        s2: { en: "Permanent Owner rights on every subscription contradict least privilege; administrators receive elevated rights just in time, for the task only.", fr: "Des droits Owner permanents sur chaque abonnement contredisent le moindre privilège ; les administrateurs reçoivent des droits élevés juste-à-temps, pour la seule tâche." }
    references:
      - title: Describe Zero Trust model
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model

  # ------------------------------------------------------------------ 6
  - id: az900-qz-24-06
    objective: "2.4.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a management group named **MG-Retail** that contains three subscriptions. A new subscription is added to MG-Retail every quarter. The other subscriptions of the bank are in a management group named **MG-Corporate**. Both management groups are directly under the root management group.

        A group of internal auditors must be able to view all the resources of the current and future subscriptions of MG-Retail, without changing anything and without any access to MG-Corporate. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un groupe d'administration nommé **MG-Retail** qui contient trois abonnements. Un nouvel abonnement est ajouté à MG-Retail chaque trimestre. Les autres abonnements de la banque se trouvent dans un groupe d'administration nommé **MG-Corporate**. Les deux groupes d'administration sont directement sous le groupe d'administration racine.

        Un groupe d'auditeurs internes doit pouvoir consulter toutes les ressources des abonnements actuels et futurs de MG-Retail, sans rien modifier et sans aucun accès à MG-Corporate. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Reader role to the group of auditors on each subscription of MG-Retail.", fr: "Attribuer le rôle Reader au groupe d'auditeurs sur chaque abonnement de MG-Retail." } }
        - { id: b, text: { en: "Assign the Reader role to the group of auditors at the scope of the root management group.", fr: "Attribuer le rôle Reader au groupe d'auditeurs à l'étendue du groupe d'administration racine." } }
        - { id: c, text: { en: "Create a Conditional Access policy that grants the group of auditors read access to MG-Retail.", fr: "Créer une stratégie d'accès conditionnel qui accorde au groupe d'auditeurs un accès en lecture à MG-Retail." } }
        - { id: d, text: { en: "Assign the Reader role to the group of auditors at the scope of the MG-Retail management group.", fr: "Attribuer le rôle Reader au groupe d'auditeurs à l'étendue du groupe d'administration MG-Retail." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A role assigned at a management group applies to the subscriptions it contains, and child scopes inherit it, including the subscriptions added later. One Reader assignment on MG-Retail therefore gives view-only access to every current and future Retail subscription, and nothing in MG-Corporate, which sits next to MG-Retail and not below it.
        fr: |
          Un rôle attribué sur un groupe d'administration s'applique aux abonnements qu'il contient, et les étendues enfants en héritent, y compris les abonnements ajoutés plus tard. Une seule attribution Reader sur MG-Retail donne donc un accès en consultation à tous les abonnements Retail actuels et futurs, et aucun accès à MG-Corporate, qui est au même niveau que MG-Retail et non sous lui.
      options:
        a: { en: "This works for the three current subscriptions, but each new subscription needs a new assignment every quarter, which adds administrative effort.", fr: "Cela fonctionne pour les trois abonnements actuels, mais chaque nouvel abonnement exige une nouvelle attribution chaque trimestre, ce qui ajoute de l'effort administratif." }
        b: { en: "The root management group is the parent of MG-Corporate too, so the auditors would also see the resources of MG-Corporate.", fr: "Le groupe d'administration racine est aussi le parent de MG-Corporate : les auditeurs verraient donc aussi les ressources de MG-Corporate." }
        c: { en: "Conditional Access decides whether a sign-in is allowed; it doesn't grant permissions on Azure resources, which is the role of Azure RBAC.", fr: "L'accès conditionnel décide si une connexion est autorisée ; il n'accorde pas d'autorisations sur les ressources Azure, ce qui est le rôle d'Azure RBAC." }
    references:
      - title: Understand scope for Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview

  # ------------------------------------------------------------------ 7
  - id: az900-qz-24-07
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware is moving its employees to passwordless sign-in with Microsoft Entra ID. Three groups of employees use different devices, as described in the answer area.

        Which method should each group use? To answer, drag the appropriate methods to the correct groups. Each method may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware fait passer ses employés à la connexion sans mot de passe avec Microsoft Entra ID. Trois groupes d'employés utilisent des appareils différents, comme décrit dans la zone de réponse.

        Quelle méthode chaque groupe doit-il utiliser ? Pour répondre, faites glisser les méthodes appropriées vers les groupes correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: fido, text: { en: "FIDO2 security keys", fr: "Clés de sécurité FIDO2" } }
        - { id: authapp, text: { en: "Microsoft Authenticator app", fr: "Application Microsoft Authenticator" } }
        - { id: sspr, text: { en: "Self-service password reset", fr: "Réinitialisation de mot de passe en libre-service" } }
        - { id: sso, text: { en: "Single sign-on", fr: "Authentification unique" } }
      targets:
        - { id: office, text: { en: "Office staff: each person has an assigned Windows laptop with a camera, used by nobody else.", fr: "Personnel de bureau : chaque personne a un ordinateur portable Windows attribué, avec une caméra, que personne d'autre n'utilise." } }
        - { id: workshop, text: { en: "Workshop technicians: they share the Windows PCs of the workshop, and phones aren't allowed in the workshop.", fr: "Techniciens d'atelier : ils partagent les PC Windows de l'atelier, et les téléphones y sont interdits." } }
        - { id: field, text: { en: "Field sales representatives: each has a company iPhone, and no additional hardware can be distributed to them.", fr: "Commerciaux itinérants : chacun a un iPhone de l'entreprise, et aucun matériel supplémentaire ne peut leur être distribué." } }
    answer:
      mapping: { office: whfb, workshop: fido, field: authapp }
    explanation:
      correct:
        en: |
          Windows Hello for Business suits users who have their own designated Windows PC: the biometric and PIN credentials are tied to that PC. A FIDO2 security key is a portable hardware device, typically USB, that each technician can bring to any shared PC without a phone. The Microsoft Authenticator app turns an iOS or Android phone into a passwordless credential, with no extra hardware.
        fr: |
          Windows Hello Entreprise convient aux utilisateurs qui ont leur propre PC Windows attribué : les informations d'identification biométriques et le code PIN sont liés à ce PC. Une clé de sécurité FIDO2 est un appareil matériel portable, en général USB, que chaque technicien peut utiliser sur n'importe quel PC partagé, sans téléphone. L'application Microsoft Authenticator transforme un téléphone iOS ou Android en information d'identification sans mot de passe, sans matériel supplémentaire.
      options:
        sspr: { en: "Self-service password reset sets a new password: it is not a passwordless method.", fr: "La réinitialisation de mot de passe en libre-service définit un nouveau mot de passe : ce n'est pas une méthode sans mot de passe." }
        sso: { en: "Single sign-on reduces the number of sign-ins, but the initial sign-in still needs a method, which is the question here.", fr: "L'authentification unique réduit le nombre de connexions, mais la connexion initiale exige toujours une méthode, ce qui est la question posée ici." }
    references:
      - title: Describe Azure authentication methods
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods

  # ------------------------------------------------------------------ 8
  - id: az900-qz-24-08
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an on-premises Active Directory domain that contains all its user accounts. Adatum plans to move a legacy application to Azure virtual machines. The application requires its servers to be domain-joined, and it authenticates users with Kerberos.

        The users must sign in to the application with their existing on-premises credentials. Adatum doesn't want to deploy or patch domain controllers in Azure, and the application must keep working if the connection to the on-premises datacenter fails.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un domaine Active Directory local qui contient tous ses comptes d'utilisateurs. Adatum prévoit de déplacer une application ancienne vers des machines virtuelles Azure. L'application exige que ses serveurs soient joints à un domaine, et elle authentifie les utilisateurs avec Kerberos.

        Les utilisateurs doivent se connecter à l'application avec leurs informations d'identification locales existantes. Adatum ne veut ni déployer ni corriger de contrôleurs de domaine dans Azure, et l'application doit continuer à fonctionner si la connexion au centre de données local tombe en panne.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Synchronize the on-premises identities to Microsoft Entra ID by using Microsoft Entra Connect.", fr: "Synchroniser les identités locales vers Microsoft Entra ID avec Microsoft Entra Connect." } }
        - { id: b, text: { en: "Invite the on-premises users as guest users by using B2B collaboration.", fr: "Inviter les utilisateurs locaux comme utilisateurs invités avec la collaboration B2B." } }
        - { id: c, text: { en: "Create a Microsoft Entra Domain Services managed domain and join the virtual machines to it.", fr: "Créer un domaine managé Microsoft Entra Domain Services et y joindre les machines virtuelles." } }
        - { id: d, text: { en: "Deploy two Windows Server domain controllers on Azure virtual machines.", fr: "Déployer deux contrôleurs de domaine Windows Server sur des machines virtuelles Azure." } }
        - { id: e, text: { en: "Join the virtual machines to the on-premises domain through an Azure VPN Gateway connection.", fr: "Joindre les machines virtuelles au domaine local via une connexion Azure VPN Gateway." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A Microsoft Entra Domain Services managed domain provides domain join and Kerberos authentication without domain controllers to deploy or patch. It gets its identities from Microsoft Entra ID through a one-way synchronization, so in a hybrid organization Microsoft Entra Connect must first synchronize the on-premises identities to Microsoft Entra ID. The managed domain is a stand-alone domain, not an extension of the on-premises one, so it keeps working if the on-premises connection fails.
        fr: |
          Un domaine managé Microsoft Entra Domain Services fournit la jonction de domaine et l'authentification Kerberos sans contrôleur de domaine à déployer ni à corriger. Il tire ses identités de Microsoft Entra ID par une synchronisation à sens unique : dans une organisation hybride, Microsoft Entra Connect doit donc d'abord synchroniser les identités locales vers Microsoft Entra ID. Le domaine managé est un domaine autonome, et non une extension du domaine local : il continue donc à fonctionner si la connexion locale tombe en panne.
      options:
        b: { en: "B2B collaboration is for users outside the organization; the employees already have identities that only need to be synchronized.", fr: "La collaboration B2B est destinée aux utilisateurs extérieurs à l'organisation ; les employés ont déjà des identités qu'il suffit de synchroniser." }
        d: { en: "Domain controllers on Azure virtual machines must be deployed and patched by Adatum, which the scenario rules out.", fr: "Des contrôleurs de domaine sur des machines virtuelles Azure doivent être déployés et corrigés par Adatum, ce que le scénario exclut." }
        e: { en: "Virtual machines joined to the on-premises domain depend on its domain controllers, so the application would stop if the connection failed.", fr: "Des machines virtuelles jointes au domaine local dépendent de ses contrôleurs de domaine : l'application s'arrêterait si la connexion tombait en panne." }
    references:
      - title: Overview of Microsoft Entra Domain Services - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview

  # ------------------------------------------------------------------ 9
  - id: az900-qz-24-09
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso works with three kinds of external users:

        - Auditors from Northwind Traders are invited through B2B collaboration. Contoso adds them to a group named **G-Audit**, which has the Reader role on a subscription named **Sub-Fin**.
        - Engineers from Fabrikam work with Contoso employees in a Microsoft Teams shared channel through B2B direct connect.
        - The customers of a Contoso shopping app sign up with an email address or a social account in an external tenant.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso travaille avec trois types d'utilisateurs externes :

        - Des auditeurs de Northwind Traders sont invités via la collaboration B2B. Contoso les ajoute à un groupe nommé **G-Audit**, qui dispose du rôle Reader sur un abonnement nommé **Sub-Fin**.
        - Des ingénieurs de Fabrikam travaillent avec des employés de Contoso dans un canal partagé Microsoft Teams via la connexion directe B2B.
        - Les clients d'une application de vente de Contoso s'inscrivent avec une adresse e-mail ou un compte de réseau social dans un locataire externe.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The Northwind auditors can view the resources of Sub-Fin after they sign in with their Northwind work accounts.", fr: "Les auditeurs de Northwind peuvent consulter les ressources de Sub-Fin après s'être connectés avec leurs comptes professionnels Northwind." } }
        - { id: s2, text: { en: "Contoso can give a Fabrikam engineer access to Sub-Fin by assigning an Azure role to the engineer's account in the Contoso directory.", fr: "Contoso peut donner à un ingénieur de Fabrikam l'accès à Sub-Fin en attribuant un rôle Azure au compte de l'ingénieur dans l'annuaire Contoso." } }
        - { id: s3, text: { en: "The customers who sign up for the shopping app appear as guest users in the directory of the Contoso employees.", fr: "Les clients qui s'inscrivent à l'application de vente apparaissent comme utilisateurs invités dans l'annuaire des employés de Contoso." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          B2B collaboration users sign in with their own identity and are represented in the Contoso directory as guest users, so Azure RBAC can grant them roles, here through the G-Audit group. B2B direct connect users aren't added to the Contoso directory: their access is limited to the Teams shared channel. Customers of an app published through an external tenant live in that tenant, which is separate from the employee directory.
        fr: |
          Les utilisateurs de la collaboration B2B se connectent avec leur propre identité et sont représentés dans l'annuaire Contoso comme utilisateurs invités : Azure RBAC peut donc leur attribuer des rôles, ici via le groupe G-Audit. Les utilisateurs de la connexion directe B2B ne sont pas ajoutés à l'annuaire Contoso : leur accès se limite au canal partagé Teams. Les clients d'une application publiée avec un locataire externe se trouvent dans ce locataire, distinct de l'annuaire des employés.
      options:
        s2: { en: "A B2B direct connect user has no account in the Contoso directory to assign a role to, and no access outside the shared channel, such as the Azure portal.", fr: "Un utilisateur de la connexion directe B2B n'a aucun compte dans l'annuaire Contoso auquel attribuer un rôle, ni aucun accès en dehors du canal partagé, comme le portail Azure." }
        s3: { en: "The external tenant holds the customer accounts and is separate from the workforce directory of the employees.", fr: "Le locataire externe contient les comptes des clients et il est distinct de l'annuaire des employés." }
    references:
      - title: Microsoft Entra External ID Overview - Microsoft Entra External ID
        url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
      - title: Assign Azure roles to external users using the Azure portal - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-external-users

  # ------------------------------------------------------------------ 10
  - id: az900-qz-24-10
    objective: "2.4.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has one Microsoft Entra Conditional Access policy. The policy applies to all the users of the Litware directory, except the members of a group named **IT-Emergency**. It targets only an application named **Payroll**, and it requires multifactor authentication when the sign-in doesn't come from the network of the Paris head office.

        The following users sign in today.

        | User | Account | Member of IT-Emergency | Signs in from | Application |
        | --- | --- | --- | --- | --- |
        | Ana | Litware employee | No | Paris head office | Payroll |
        | Ben | Litware employee | No | Home | Payroll |
        | Chloé | Litware employee | Yes | Hotel | Payroll |
        | David | Fabrikam consultant, invited as a guest user through B2B collaboration | No | Fabrikam office | Payroll |
        | Eva | Litware employee | No | Home | Intranet |

        Which two users must complete multifactor authentication?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une seule stratégie d'accès conditionnel Microsoft Entra. La stratégie s'applique à tous les utilisateurs de l'annuaire Litware, sauf aux membres d'un groupe nommé **IT-Emergency**. Elle cible uniquement une application nommée **Payroll**, et elle exige l'authentification multifacteur quand la connexion ne provient pas du réseau du siège de Paris.

        Les utilisateurs suivants se connectent aujourd'hui.

        | Utilisateur | Compte | Membre d'IT-Emergency | Se connecte depuis | Application |
        | --- | --- | --- | --- | --- |
        | Ana | Employée de Litware | Non | Siège de Paris | Payroll |
        | Ben | Employé de Litware | Non | Domicile | Payroll |
        | Chloé | Employée de Litware | Oui | Hôtel | Payroll |
        | David | Consultant de Fabrikam, utilisateur invité via la collaboration B2B | Non | Bureau de Fabrikam | Payroll |
        | Eva | Employée de Litware | Non | Domicile | Intranet |

        Quels sont les deux utilisateurs qui doivent effectuer une authentification multifacteur ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: Ana }
        - { id: b, text: Ben }
        - { id: c, text: Chloé }
        - { id: d, text: David }
        - { id: e, text: Eva }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Conditional Access combines signals, here group membership, application and location, before it takes a decision. Ben opens Payroll from outside the head office, so the policy requires multifactor authentication. David is a B2B collaboration guest, represented as a user in the Litware directory: a policy that targets all the users of the directory includes guests, so he is challenged too.
        fr: |
          L'accès conditionnel combine des signaux, ici l'appartenance à un groupe, l'application et l'emplacement, avant de prendre une décision. Ben ouvre Payroll depuis l'extérieur du siège : la stratégie exige donc l'authentification multifacteur. David est un invité de la collaboration B2B, représenté comme utilisateur dans l'annuaire Litware : une stratégie qui cible tous les utilisateurs de l'annuaire inclut les invités, il doit donc aussi s'authentifier.
      options:
        a: { en: "Ana signs in from the head office network, so the location condition of the policy isn't met.", fr: "Ana se connecte depuis le réseau du siège : la condition d'emplacement de la stratégie n'est pas remplie." }
        c: { en: "Chloé is a member of IT-Emergency; an exclusion overrides the inclusion, so the policy doesn't apply to her.", fr: "Chloé est membre d'IT-Emergency ; une exclusion l'emporte sur l'inclusion : la stratégie ne s'applique donc pas à elle." }
        e: { en: "Eva opens the Intranet application, which the policy doesn't target, whatever her location.", fr: "Eva ouvre l'application Intranet, que la stratégie ne cible pas, quel que soit son emplacement." }
    references:
      - title: "Conditional Access Setup: Users, Groups, Agents, and Workload Identities - Microsoft Entra ID"
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-users-groups
      - title: What is Microsoft Entra B2B collaboration? - Microsoft Entra External ID
        url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
