chapter: 11-cloud-computing
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum moves its applications from its own datacenter to cloud computing.

        What changes in the way that Adatum plans its IT capacity?
      fr: |
        Adatum déplace ses applications de son propre centre de données vers le cloud computing.

        Qu'est-ce qui change dans la façon dont Adatum planifie sa capacité informatique ?
    body:
      options:
        - { id: a, text: { en: "Capacity is bought upfront for the next five years.", fr: "La capacité est achetée d'avance pour les cinq années à venir." } }
        - { id: b, text: { en: "Capacity is provisioned on demand, without a purchasing cycle.", fr: "La capacité est provisionnée à la demande, sans cycle d'achat." } }
        - { id: c, text: { en: "Capacity is limited to the servers in its own server room.", fr: "La capacité est limitée aux serveurs de sa propre salle serveurs." } }
        - { id: d, text: { en: "Capacity is chosen by the provider, which ships the servers.", fr: "La capacité est choisie par le fournisseur, qui livre les serveurs." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Cloud computing delivers computing services over the internet from infrastructure that the provider already runs. Planning therefore moves from long procurement cycles to on-demand provisioning: Adatum adds capacity when it needs it and releases it afterwards.
        fr: |
          Le cloud computing fournit des services informatiques par internet, à partir d'une infrastructure que le fournisseur exploite déjà. La planification passe donc de longs cycles d'achat à un provisionnement à la demande : Adatum ajoute de la capacité quand il en a besoin et la libère ensuite.
      options:
        a: { en: "Buying capacity upfront for years is the traditional datacenter approach that the cloud removes.", fr: "Acheter de la capacité d'avance pour plusieurs années est l'approche du centre de données traditionnel que le cloud supprime." }
        c: { en: "The cloud isn't limited by the physical capacity of a datacenter that the customer owns.", fr: "Le cloud n'est pas limité par la capacité physique d'un centre de données qui appartient au client." }
        d: { en: "The customer chooses the capacity it consumes, and no server is shipped to its premises.", fr: "Le client choisit la capacité qu'il consomme, et aucun serveur n'est livré dans ses locaux." }
    references:
      - title: What is cloud computing
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute

  # ------------------------------------------------------------------ 2
  - id: az900-qz-11-02
    objective: "1.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware uses Azure virtual machines (IaaS), Azure App Service (PaaS) and Microsoft 365 (SaaS).

        For which of the following is Microsoft responsible in all three cases?
      fr: |
        Proseware utilise des machines virtuelles Azure (IaaS), Azure App Service (PaaS) et Microsoft 365 (SaaS).

        De quel élément suivant Microsoft est-il responsable dans les trois cas ?
    body:
      options:
        - { id: a, text: { en: "The operating systems", fr: "Les systèmes d'exploitation" } }
        - { id: b, text: { en: "The network controls", fr: "Les contrôles réseau" } }
        - { id: c, text: { en: "The applications", fr: "Les applications" } }
        - { id: d, text: { en: "The physical network", fr: "Le réseau physique" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The physical datacenter, the physical network and the physical hosts are always the provider's responsibility, from IaaS to SaaS. The other areas depend on the service type and stay, at least in part, with Proseware for its IaaS virtual machines.
        fr: |
          Le centre de données physique, le réseau physique et les hôtes physiques relèvent toujours du fournisseur, de l'IaaS au SaaS. Les autres domaines dépendent du type de service et restent, au moins en partie, à Proseware pour ses machines virtuelles IaaS.
      options:
        a: { en: "Proseware patches the operating systems of its IaaS virtual machines; Microsoft takes them over only in PaaS and SaaS.", fr: "Proseware applique les correctifs des systèmes d'exploitation de ses machines virtuelles IaaS ; Microsoft ne les prend en charge qu'en PaaS et en SaaS." }
        b: { en: "Network controls are the customer's in IaaS and shared in PaaS; only in SaaS does the provider handle them.", fr: "Les contrôles réseau reviennent au client en IaaS et sont partagés en PaaS ; ce n'est qu'en SaaS que le fournisseur s'en charge." }
        c: { en: "The applications that run on IaaS virtual machines are the customer's responsibility.", fr: "Les applications qui s'exécutent sur des machines virtuelles IaaS relèvent de la responsabilité du client." }
    references:
      - title: Describe the shared responsibility model
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
      - title: Shared responsibility in the cloud
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility

  # ------------------------------------------------------------------ 3
  - id: az900-qz-11-03
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs an image-processing job every night on Azure virtual machines. If the job is interrupted, it resumes later from where it stopped, with no impact on the business.

        Fabrikam wants the lowest compute price for this job. Which pricing option should Fabrikam use?
      fr: |
        Fabrikam exécute chaque nuit un traitement d'images sur des machines virtuelles Azure. Si le traitement est interrompu, il reprend plus tard là où il s'est arrêté, sans impact sur l'activité.

        Fabrikam veut le prix de calcul le plus bas pour ce traitement. Quelle option tarifaire Fabrikam doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "Pay-as-you-go", fr: "Le paiement à l'utilisation" } }
        - { id: b, text: { en: "Azure Reservations", fr: "Les réservations Azure" } }
        - { id: c, text: { en: "Azure savings plan for compute", fr: "Le plan d'économies Azure pour le calcul" } }
        - { id: d, text: { en: "Azure Spot Virtual Machines", fr: "Les machines virtuelles Azure Spot" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Spot Virtual Machines use Azure's unused capacity at a deep discount, and Azure can evict them when it needs the capacity back. A job that tolerates interruption and resumes later is exactly the workload that fits this trade-off.
        fr: |
          Les machines virtuelles Spot utilisent la capacité inutilisée d'Azure avec une forte remise, et Azure peut les évincer quand il a besoin de récupérer la capacité. Un traitement qui tolère l'interruption et reprend plus tard est exactement la charge de travail qui convient à ce compromis.
      options:
        a: { en: "Pay-as-you-go has no commitment but no discount either: it costs more than Spot for the same job.", fr: "Le paiement à l'utilisation n'impose aucun engagement, mais n'offre aucune remise : il coûte plus cher que Spot pour le même traitement." }
        b: { en: "A reservation is a one-year or three-year commitment that fits continuous workloads; a job that runs only at night would leave the reserved capacity unused during the day.", fr: "Une réservation est un engagement d'un ou trois ans adapté aux charges continues ; un traitement qui ne tourne que la nuit laisserait la capacité réservée inutilisée pendant la journée." }
        c: { en: "A savings plan commits to an hourly spend for one or three years; the commitment is billed even during the hours when the job doesn't run.", fr: "Un plan d'économies engage une dépense horaire pendant un ou trois ans ; l'engagement est facturé même pendant les heures où le traitement ne tourne pas." }
    references:
      - title: About Azure Spot Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms

  # ------------------------------------------------------------------ 4
  - id: az900-qz-11-04
    objective: "1.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum hosts a small web API on an Azure virtual machine that runs all the time. The API receives requests only a few minutes each day.

        Adatum wants to stop paying for the time when no request arrives and to stop managing the server. What should Adatum do?
      fr: |
        Adatum héberge une petite API web sur une machine virtuelle Azure qui tourne en permanence. L'API ne reçoit des requêtes que quelques minutes par jour.

        Adatum veut cesser de payer le temps pendant lequel aucune requête n'arrive et cesser de gérer le serveur. Que doit faire Adatum ?
    body:
      options:
        - { id: a, text: { en: "Buy a three-year reservation for the virtual machine", fr: "Acheter une réservation de trois ans pour la machine virtuelle" } }
        - { id: b, text: { en: "Resize the virtual machine to a smaller size", fr: "Redimensionner la machine virtuelle vers une taille plus petite" } }
        - { id: c, text: { en: "Move the code of the API to Azure Functions", fr: "Déplacer le code de l'API vers Azure Functions" } }
        - { id: d, text: { en: "Redeploy the API on a Spot virtual machine", fr: "Redéployer l'API sur une machine virtuelle Spot" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Functions is a serverless service: Adatum supplies the code, the platform runs it when a request arrives and scales it back afterwards. Adatum no longer manages a server, and on a serverless plan it pays for executions instead of for idle time.
        fr: |
          Azure Functions est un service serverless : Adatum fournit le code, la plateforme l'exécute quand une requête arrive puis réduit les ressources ensuite. Adatum ne gère plus de serveur et, avec un plan serverless, paie les exécutions et non le temps d'inactivité.
      options:
        a: { en: "A reservation lowers the price of the virtual machine, but Adatum still pays for every hour and still manages the server.", fr: "Une réservation réduit le prix de la machine virtuelle, mais Adatum paie toujours chaque heure et gère toujours le serveur." }
        b: { en: "A smaller size costs less per hour, but the virtual machine is still billed while idle and still managed by Adatum.", fr: "Une taille plus petite coûte moins cher à l'heure, mais la machine virtuelle est toujours facturée pendant son inactivité et toujours gérée par Adatum." }
        d: { en: "A Spot virtual machine is cheaper but can be evicted, is still billed while it runs idle and remains a server that Adatum manages.", fr: "Une machine virtuelle Spot coûte moins cher mais peut être évincée, reste facturée quand elle tourne à vide et reste un serveur qu'Adatum gère." }
    references:
      - title: Azure Functions Overview
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-11-05
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys reviews its IT spending for the year.

        Which category does each expense belong to? To answer, drag the appropriate category to each expense. Each category may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys passe en revue ses dépenses informatiques de l'année.

        À quelle catégorie chaque dépense appartient-elle ? Pour répondre, faites glisser la catégorie appropriée vers chaque dépense. Chaque catégorie peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: capex, text: { en: "Capital expenditure (CapEx)", fr: "Dépenses d'investissement (CapEx)" } }
        - { id: opex, text: { en: "Operational expenditure (OpEx)", fr: "Dépenses d'exploitation (OpEx)" } }
      targets:
        - { id: t1, text: { en: "The purchase of servers for a new room of the company's datacenter", fr: "L'achat de serveurs pour une nouvelle salle du centre de données de l'entreprise" } }
        - { id: t2, text: { en: "The monthly invoice for the Azure virtual machines that ran during the month", fr: "La facture mensuelle des machines virtuelles Azure qui ont tourné pendant le mois" } }
        - { id: t3, text: { en: "The installation of a new cooling system in the company's datacenter", fr: "L'installation d'un nouveau système de refroidissement dans le centre de données de l'entreprise" } }
        - { id: t4, text: { en: "The per-gigabyte charge for the cloud storage used by backups", fr: "La facturation au gigaoctet du stockage cloud utilisé par les sauvegardes" } }
    answer:
      mapping: { t1: capex, t2: opex, t3: capex, t4: opex }
    explanation:
      correct:
        en: |
          Capital expenditure is upfront spending on physical infrastructure, such as servers and datacenter equipment like cooling. Operational expenditure is spending on services over time: cloud services paid for as they're consumed, such as virtual machine hours and storage gigabytes, are OpEx.
        fr: |
          Les dépenses d'investissement sont des dépenses initiales en infrastructure physique, comme des serveurs ou des équipements de centre de données tels que le refroidissement. Les dépenses d'exploitation sont des dépenses en services au fil du temps : les services cloud payés à mesure de leur consommation, comme les heures de machines virtuelles et les gigaoctets de stockage, relèvent de l'OpEx.
    references:
      - title: Describe the consumption-based model
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model

  # ------------------------------------------------------------------ 6
  - id: az900-qz-11-06
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The board of Northwind Traders is choosing between three cloud models for the next five years: moving every workload to a public cloud, keeping a private cloud only, or combining the two in a hybrid cloud. The CFO asks you to check some assumptions about hardware ownership, data placement and maintenance.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le conseil d'administration de Northwind Traders choisit entre trois modèles de cloud pour les cinq prochaines années : déplacer toutes les charges de travail vers un cloud public, ne garder qu'un cloud privé, ou combiner les deux dans un cloud hybride. Le directeur financier vous demande de vérifier quelques hypothèses sur la propriété du matériel, l'emplacement des données et la maintenance.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "If Northwind moves every workload to a public cloud, it no longer has to buy hardware to scale up.", fr: "Si Northwind déplace toutes ses charges de travail vers un cloud public, il n'a plus à acheter de matériel pour monter en charge." } }
        - { id: s2, text: { en: "In a public cloud, the data of Northwind would be stored on hardware that is dedicated to Northwind.", fr: "Dans un cloud public, les données de Northwind seraient stockées sur du matériel dédié à Northwind." } }
        - { id: s3, text: { en: "With a hybrid cloud, Northwind would remain responsible for maintaining the hardware of its private cloud.", fr: "Avec un cloud hybride, Northwind resterait responsable de la maintenance du matériel de son cloud privé." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Yes: a public cloud requires no capital expenditure to scale up, because the provider owns the hardware. No: a public cloud is open to anyone who buys its services, and the customers share the provider's infrastructure; keeping data apart from other tenants' data is a trait of a private cloud. Yes: a hybrid cloud keeps a private cloud, whose hardware the organization still maintains and updates.
        fr: |
          Oui : un cloud public n'exige aucune dépense d'investissement pour monter en charge, car le matériel appartient au fournisseur. Non : un cloud public est ouvert à quiconque achète ses services, et les clients partagent l'infrastructure du fournisseur ; garder les données à l'écart de celles des autres locataires est une caractéristique du cloud privé. Oui : un cloud hybride conserve un cloud privé, dont l'organisation continue d'assurer la maintenance et les mises à jour du matériel.
    references:
      - title: Define cloud models
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models

  # ------------------------------------------------------------------ 7
  - id: az900-qz-11-07
    objective: "1.1.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso moves a piece of code that resizes product images from an always-on virtual machine to Azure Functions. Each time a photographer uploads a picture, the code creates three smaller copies for the online catalog. Contoso uses a serverless plan, in which instances are created only when pictures arrive.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso déplace un code qui redimensionne des images de produits d'une machine virtuelle allumée en permanence vers Azure Functions. Chaque fois qu'un photographe charge une image, le code en crée trois copies plus petites pour le catalogue en ligne. Contoso utilise un plan serverless, dans lequel des instances ne sont créées que lorsque des images arrivent.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Contoso must provision and size the virtual machines that run the code.", fr: "Contoso doit provisionner et dimensionner les machines virtuelles qui exécutent le code." } }
        - { id: s2, text: { en: "Contoso remains responsible for the code that resizes the images.", fr: "Contoso reste responsable du code qui redimensionne les images." } }
        - { id: s3, text: { en: "Contoso is billed for the executions of the code and the resources that they consume.", fr: "Contoso est facturé pour les exécutions du code et les ressources qu'elles consomment." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          No: in a serverless model the platform provisions and scales the servers; Contoso never sees them. Yes: serverless removes the infrastructure, not the application: Contoso still supplies and maintains its own code. Yes: serverless is pay per use, so Contoso is billed for the executions and the resources that they consume, not for idle time.
        fr: |
          Non : dans un modèle serverless, la plateforme provisionne et dimensionne les serveurs ; Contoso ne les voit jamais. Oui : le serverless supprime l'infrastructure, pas l'application : Contoso fournit et maintient toujours son propre code. Oui : le serverless est un paiement à l'usage, Contoso est donc facturé pour les exécutions et les ressources qu'elles consomment, pas pour le temps d'inactivité.
    references:
      - title: Azure Functions Overview
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview

  # ------------------------------------------------------------------ 8
  - id: az900-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam hosts a custom expense-reporting web application on Azure App Service, a platform as a service (PaaS) offering. Fabrikam developers deploy the code, and Fabrikam employees sign in to the application with their own accounts to submit their expenses.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam héberge une application web personnalisée de notes de frais sur Azure App Service, une offre PaaS (platform as a service). Les développeurs de Fabrikam déploient le code, et les employés de Fabrikam se connectent à l'application avec leurs propres comptes pour soumettre leurs notes de frais.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The operating system that runs the application is the responsibility of [[os]].
          The network controls of the application are the responsibility of [[net]].
          The accounts of the employees who sign in are the responsibility of [[acct]].
        fr: |
          Le système d'exploitation qui exécute l'application relève de la responsabilité de [[os]].
          Les contrôles réseau de l'application relèvent de la responsabilité de [[net]].
          Les comptes des employés qui se connectent relèvent de la responsabilité de [[acct]].
      slots:
        - id: os
          options:
            - { id: fab, text: "Fabrikam" }
            - { id: ms, text: "Microsoft" }
            - { id: both, text: { en: "Fabrikam and Microsoft, shared", fr: "Fabrikam et Microsoft, de façon partagée" } }
        - id: net
          options:
            - { id: fab, text: "Fabrikam" }
            - { id: ms, text: "Microsoft" }
            - { id: both, text: { en: "Fabrikam and Microsoft, shared", fr: "Fabrikam et Microsoft, de façon partagée" } }
        - id: acct
          options:
            - { id: fab, text: "Fabrikam" }
            - { id: ms, text: "Microsoft" }
            - { id: both, text: { en: "Fabrikam and Microsoft, shared", fr: "Fabrikam et Microsoft, de façon partagée" } }
    answer:
      values: { os: ms, net: both, acct: fab }
    explanation:
      correct:
        en: |
          In PaaS, the provider manages the operating system, so Microsoft patches the OS that runs the App Service application. Network controls are shared in PaaS: Microsoft runs the platform network, and Fabrikam configures the controls that the service exposes for its application. Accounts and identities always remain the customer's responsibility, whatever the service type.
        fr: |
          En PaaS, le fournisseur gère le système d'exploitation : Microsoft applique donc les correctifs du système qui exécute l'application App Service. Les contrôles réseau sont partagés en PaaS : Microsoft exploite le réseau de la plateforme, et Fabrikam configure les contrôles que le service propose pour son application. Les comptes et les identités restent toujours de la responsabilité du client, quel que soit le type de service.
      options:
        os: { en: "Fabrikam would patch the operating system only in IaaS, for example on an Azure virtual machine.", fr: "Fabrikam n'appliquerait les correctifs du système d'exploitation qu'en IaaS, par exemple sur une machine virtuelle Azure." }
        net: { en: "Network controls are the customer's alone in IaaS and the provider's alone in SaaS; PaaS is between the two.", fr: "Les contrôles réseau reviennent au seul client en IaaS et au seul fournisseur en SaaS ; le PaaS se situe entre les deux." }
        acct: { en: "Identity infrastructure can be shared in PaaS, but the accounts themselves always stay with the customer.", fr: "L'infrastructure d'identité peut être partagée en PaaS, mais les comptes eux-mêmes restent toujours au client." }
    references:
      - title: Shared responsibility in the cloud
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
      - title: Describe the shared responsibility model
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model

  # ------------------------------------------------------------------ 9
  - id: az900-qz-11-09
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank must keep its customer account data in a private cloud, on servers that the bank owns in its own datacenter. The bank will host a new mobile banking front end in Azure, connected to that datacenter. The bank will also keep using an analytics service from another public cloud provider.

        How should you describe the environment of Woodgrove Bank after the change?
      fr: |
        Woodgrove Bank doit conserver les données des comptes de ses clients dans un cloud privé, sur des serveurs qui appartiennent à la banque, dans son propre centre de données. La banque va héberger dans Azure un nouveau frontal de banque mobile, connecté à ce centre de données. La banque va aussi continuer d'utiliser un service d'analytique d'un autre fournisseur de cloud public.

        Comment devez-vous décrire l'environnement de Woodgrove Bank après ce changement ?
    body:
      options:
        - { id: a, text: { en: "A private cloud, because the account data stays on servers that the bank owns", fr: "Un cloud privé, car les données des comptes restent sur des serveurs qui appartiennent à la banque" } }
        - { id: b, text: { en: "A hybrid and multicloud environment, because it mixes a private cloud and two public clouds", fr: "Un environnement hybride et multicloud, car il associe un cloud privé et deux clouds publics" } }
        - { id: c, text: { en: "A hybrid cloud only, because the bank interconnects its private cloud with Azure", fr: "Un cloud hybride uniquement, car la banque interconnecte son cloud privé avec Azure" } }
        - { id: d, text: { en: "A multicloud environment only, because the bank uses two public cloud providers", fr: "Un environnement multicloud uniquement, car la banque utilise deux fournisseurs de cloud public" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The private cloud in the bank's datacenter is interconnected with Azure, which makes a hybrid cloud. The bank also uses two public cloud providers, Azure and another one, which makes a multicloud environment. The two terms aren't exclusive: one environment can be both, and Azure Arc, for example, is designed to manage hybrid and multicloud environments together.
        fr: |
          Le cloud privé du centre de données de la banque est interconnecté avec Azure, ce qui forme un cloud hybride. La banque utilise aussi deux fournisseurs de cloud public, Azure et un autre, ce qui forme un environnement multicloud. Les deux notions ne s'excluent pas : un même environnement peut être les deux, et Azure Arc, par exemple, est conçu pour gérer ensemble des environnements hybrides et multiclouds.
      options:
        a: { en: "The front end runs in Azure and the analytics service in another public cloud: the bank doesn't use only a private cloud.", fr: "Le frontal s'exécute dans Azure et le service d'analytique dans un autre cloud public : la banque n'utilise pas seulement un cloud privé." }
        c: { en: "This ignores the second public cloud provider: using several public providers is what defines multicloud.", fr: "Cette réponse ignore le second fournisseur de cloud public : utiliser plusieurs fournisseurs publics est ce qui définit le multicloud." }
        d: { en: "This ignores the private cloud that is interconnected with Azure, which also makes the environment hybrid.", fr: "Cette réponse ignore le cloud privé interconnecté avec Azure, qui rend aussi l'environnement hybride." }
    references:
      - title: Define cloud models
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models

  # ------------------------------------------------------------------ 10
  - id: az900-qz-11-10
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware will migrate 40 Windows Server virtual machines to Azure. The virtual machines will run continuously at a fixed size, in one region, for at least three years, and they must not be interrupted. Litware owns Windows Server licenses that are covered by active Software Assurance.

        Litware needs to minimize the cost of the virtual machines. Which two options should Litware use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware va migrer 40 machines virtuelles Windows Server vers Azure. Les machines virtuelles tourneront en continu avec une taille fixe, dans une seule région, pendant au moins trois ans, et elles ne doivent pas être interrompues. Litware possède des licences Windows Server couvertes par une Software Assurance active.

        Litware doit réduire au minimum le coût des machines virtuelles. Quelles sont les deux options que Litware doit utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Azure Spot Virtual Machines", fr: "Les machines virtuelles Azure Spot" } }
        - { id: b, text: { en: "Azure Reservations", fr: "Les réservations Azure" } }
        - { id: c, text: { en: "Pay-as-you-go pricing", fr: "Le paiement à l'utilisation" } }
        - { id: d, text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" } }
        - { id: e, text: { en: "An Azure free account", fr: "Un compte gratuit Azure" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A three-year reservation gives a significant discount on the compute of virtual machines that run continuously at a fixed size, but it doesn't cover the Windows software cost. Azure Hybrid Benefit covers that licensing cost by reusing the Windows Server licenses with Software Assurance, so Litware pays only the base compute rate. The two levers apply to different parts of the price and can be combined.
        fr: |
          Une réservation de trois ans apporte une remise importante sur le calcul de machines virtuelles qui tournent en continu avec une taille fixe, mais elle ne couvre pas le coût du logiciel Windows. Azure Hybrid Benefit couvre ce coût de licence en réutilisant les licences Windows Server avec Software Assurance : Litware ne paie alors que le tarif de calcul de base. Les deux leviers portent sur des parties différentes du prix et se combinent.
      options:
        a: { en: "Spot capacity can be evicted at any time, which breaks the requirement that the virtual machines must not be interrupted.", fr: "La capacité Spot peut être reprise à tout moment, ce qui enfreint l'exigence selon laquelle les machines virtuelles ne doivent pas être interrompues." }
        c: { en: "Pay-as-you-go suits unpredictable or short workloads; for three years of continuous use it costs more than a reservation.", fr: "Le paiement à l'utilisation convient aux charges imprévisibles ou courtes ; pour trois ans d'utilisation continue, il coûte plus cher qu'une réservation." }
        e: { en: "The free account is meant for learning and prototypes, with limited free quantities; it doesn't cover 40 production virtual machines for three years.", fr: "Le compte gratuit est destiné à l'apprentissage et aux prototypes, avec des quantités gratuites limitées ; il ne couvre pas 40 machines virtuelles de production pendant trois ans." }
    references:
      - title: What are Azure Reservations?
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
      - title: Azure Hybrid Benefit for Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/get-started/azure-hybrid-benefit
