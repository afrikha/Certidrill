chapter: 22-compute-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The developers of Contoso want to package an application together with its dependencies, so that the same package runs unchanged on their laptops and in Azure and starts in a few seconds.

        Which compute type should they use?
      fr: |
        Les développeurs de Contoso veulent empaqueter une application avec ses dépendances, afin que le même paquet s'exécute sans modification sur leurs ordinateurs portables et dans Azure, et démarre en quelques secondes.

        Quel type de calcul doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "A virtual machine", fr: "Une machine virtuelle" } }
        - { id: b, text: { en: "A container", fr: "Un conteneur" } }
        - { id: c, text: { en: "A function", fr: "Une fonction" } }
        - { id: d, text: { en: "A virtual machine scale set", fr: "Un groupe de machines virtuelles identiques" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A container packages an application and its dependencies into a lightweight, portable unit that runs the same way wherever a container host exists. Because containers share the operating system of their host instead of carrying a full one, they start in seconds.
        fr: |
          Un conteneur empaquette une application et ses dépendances dans une unité légère et portable, qui s'exécute de la même façon partout où se trouve un hôte de conteneurs. Comme les conteneurs partagent le système d'exploitation de leur hôte au lieu d'en embarquer un complet, ils démarrent en quelques secondes.
      options:
        a: { en: "A virtual machine carries a full operating system: it is much larger than a container and takes longer to start.", fr: "Une machine virtuelle embarque un système d'exploitation complet : elle est bien plus volumineuse qu'un conteneur et met plus de temps à démarrer." }
        c: { en: "A function is a piece of code run in response to an event; it isn't a package of an application with its dependencies that runs on a laptop.", fr: "Une fonction est un morceau de code exécuté en réponse à un événement ; ce n'est pas un paquet d'application avec ses dépendances qui s'exécute sur un ordinateur portable." }
        d: { en: "A scale set is a group of identical virtual machines, each with its own full operating system.", fr: "Un groupe identique est un ensemble de machines virtuelles identiques, chacune avec son propre système d'exploitation complet." }
    references:
      - title: Describe Azure containers
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers

  # ------------------------------------------------------------------ 2
  - id: az900-qz-22-02
    objective: "2.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which Azure resource uses rules to allow or deny the network traffic that reaches the resources of a subnet in a virtual network?
      fr: |
        Quelle ressource Azure utilise des règles pour autoriser ou refuser le trafic réseau qui atteint les ressources d'un sous-réseau d'un réseau virtuel ?
    body:
      options:
        - { id: a, text: "Azure DNS" }
        - { id: b, text: { en: "Virtual network peering", fr: "Le peering de réseaux virtuels" } }
        - { id: c, text: { en: "A network security group", fr: "Un groupe de sécurité réseau" } }
        - { id: d, text: { en: "A NAT gateway", fr: "Une passerelle NAT" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A network security group contains security rules that allow or deny inbound and outbound traffic. You associate it with a subnet or a network interface to filter the traffic of the resources behind it.
        fr: |
          Un groupe de sécurité réseau contient des règles de sécurité qui autorisent ou refusent le trafic entrant et sortant. Vous l'associez à un sous-réseau ou à une interface réseau pour filtrer le trafic des ressources qui s'y trouvent.
      options:
        a: { en: "Azure DNS hosts DNS domains and resolves names; it doesn't filter traffic.", fr: "Azure DNS héberge des domaines DNS et résout des noms ; il ne filtre pas le trafic." }
        b: { en: "Peering connects two virtual networks so that they communicate; it doesn't allow or deny traffic with rules.", fr: "Le peering connecte deux réseaux virtuels pour qu'ils communiquent ; il n'autorise ni ne refuse le trafic avec des règles." }
        d: { en: "A NAT gateway gives the resources of a subnet outbound connectivity to the internet; it doesn't filter traffic with allow or deny rules.", fr: "Une passerelle NAT donne aux ressources d'un sous-réseau une connectivité sortante vers internet ; elle ne filtre pas le trafic avec des règles d'autorisation ou de refus." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 3
  - id: az900-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam plans to move its line-of-business servers to Azure virtual machines and to give its office staff Windows desktops hosted in Azure. The IT team is reviewing the virtual machine options of Azure before it chooses a design.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prévoit de déplacer ses serveurs métier vers des machines virtuelles Azure et de fournir à son personnel de bureau des bureaux Windows hébergés dans Azure. L'équipe informatique étudie les options de machine virtuelle d'Azure avant de choisir une conception.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Fabrikam can create Azure virtual machines from an image that it built itself, with its own software already installed.", fr: "Fabrikam peut créer des machines virtuelles Azure à partir d'une image qu'elle a créée elle-même, avec ses propres logiciels déjà installés." }
        - id: s2
          text: { en: "Azure Virtual Desktop can deliver individual applications to users, and not only complete Windows desktops.", fr: "Azure Virtual Desktop peut fournir des applications individuelles aux utilisateurs, et pas seulement des bureaux Windows complets." }
        - id: s3
          text: { en: "A virtual machine that is the only machine of its availability set stays available during planned maintenance of the Azure platform.", fr: "Une machine virtuelle qui est la seule machine de son groupe à haute disponibilité reste disponible pendant une maintenance planifiée de la plateforme Azure." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Azure virtual machines are created from an image, which can be a Marketplace image or a custom image of your own. Azure Virtual Desktop virtualizes both desktops and individual applications. An availability set keeps an application available by spreading several machines across update and fault domains: with a single machine, there is no other machine to keep running while it restarts.
        fr: |
          Les machines virtuelles Azure sont créées à partir d'une image, qui peut être une image de la Place de marché ou une image personnalisée. Azure Virtual Desktop virtualise à la fois des bureaux et des applications individuelles. Un groupe à haute disponibilité maintient une application disponible en répartissant plusieurs machines sur des domaines de mise à jour et d'erreur : avec une seule machine, aucune autre machine ne reste en service pendant son redémarrage.
      options:
        s3: { en: "The protection comes from having at least two machines in different update domains; a lone machine is restarted like any other.", fr: "La protection vient du fait d'avoir au moins deux machines dans des domaines de mise à jour différents ; une machine seule est redémarrée comme n'importe quelle autre." }
    references:
      - title: Availability sets overview
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
      - title: What is Azure Virtual Desktop?
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/overview

  # ------------------------------------------------------------------ 4
  - id: az900-qz-22-04
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a virtual network named **VNet-EU** in the West Europe region and a virtual network named **VNet-US** in the East US region. The virtual machines of the two networks must communicate by using private IP addresses, and their traffic must not cross the public internet.

        You need to minimize cost and setup effort. What should you use?
      fr: |
        Contoso dispose d'un réseau virtuel nommé **VNet-EU** dans la région Europe Ouest et d'un réseau virtuel nommé **VNet-US** dans la région USA Est. Les machines virtuelles des deux réseaux doivent communiquer en utilisant des adresses IP privées, et leur trafic ne doit pas traverser l'internet public.

        Vous devez réduire au minimum le coût et l'effort de mise en place. Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An ExpressRoute circuit linked to VNet-EU and VNet-US", fr: "Un circuit ExpressRoute relié à VNet-EU et à VNet-US" } }
        - { id: b, text: { en: "A VPN gateway in VNet-EU and in VNet-US, with a network-to-network connection", fr: "Une passerelle VPN dans VNet-EU et dans VNet-US, avec une connexion de réseau à réseau" } }
        - { id: c, text: { en: "Public IP addresses for the virtual machines of VNet-EU and VNet-US", fr: "Des adresses IP publiques pour les machines virtuelles de VNet-EU et de VNet-US" } }
        - { id: d, text: { en: "A virtual network peering between VNet-EU and VNet-US", fr: "Un peering de réseaux virtuels entre VNet-EU et VNet-US" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Peering connects two virtual networks so that their resources communicate with private IP addresses over the Microsoft backbone, never over the public internet. Global virtual network peering works between regions, and it requires no gateway to deploy.
        fr: |
          Le peering connecte deux réseaux virtuels pour que leurs ressources communiquent avec des adresses IP privées sur le réseau principal de Microsoft, jamais sur l'internet public. Le peering de réseaux virtuels mondial fonctionne entre régions et ne demande le déploiement d'aucune passerelle.
      options:
        a: { en: "ExpressRoute is a private connection from an on-premises network through a connectivity provider; a circuit costs far more and takes longer to set up than a peering.", fr: "ExpressRoute est une connexion privée depuis un réseau local par un fournisseur de connectivité ; un circuit coûte bien plus cher et se met en place plus lentement qu'un peering." }
        b: { en: "A network-to-network VPN can link the two networks, but it requires deploying and paying for a gateway in each of them.", fr: "Un VPN de réseau à réseau peut relier les deux réseaux, mais il demande de déployer et de payer une passerelle dans chacun d'eux." }
        c: { en: "Public IP addresses make the machines communicate over the public internet, which the requirement forbids.", fr: "Des adresses IP publiques font communiquer les machines sur l'internet public, ce que l'exigence interdit." }
    references:
      - title: Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-22-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a resource group named **RG1** in the France Central region and a virtual network named **VNet1** in the West Europe region. You plan to create a virtual machine named **VM1** in RG1 and connect VM1 to VNet1.

        In which region must you create VM1?
      fr: |
        Adatum dispose d'un groupe de ressources nommé **RG1** dans la région France Centre et d'un réseau virtuel nommé **VNet1** dans la région Europe Ouest. Vous prévoyez de créer une machine virtuelle nommée **VM1** dans RG1 et de connecter VM1 à VNet1.

        Dans quelle région devez-vous créer VM1 ?
    body:
      options:
        - { id: a, text: { en: "France Central, the region of RG1", fr: "France Centre, la région de RG1" } }
        - { id: b, text: { en: "West Europe, the region of VNet1", fr: "Europe Ouest, la région de VNet1" } }
        - { id: c, text: { en: "France South, the region paired with France Central", fr: "France Sud, la région jumelée à France Centre" } }
        - { id: d, text: { en: "Any region, since a virtual network spans regions", fr: "N'importe quelle région, car un réseau virtuel couvre plusieurs régions" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A virtual network belongs to one region, and a virtual machine connects to it through a network interface that must be in the same region as the network. VM1 must therefore be created in West Europe. The region of the resource group doesn't constrain the region of the resources it contains.
        fr: |
          Un réseau virtuel appartient à une seule région, et une machine virtuelle s'y connecte par une interface réseau qui doit être dans la même région que le réseau. VM1 doit donc être créée en Europe Ouest. La région du groupe de ressources n'impose pas la région des ressources qu'il contient.
      options:
        a: { en: "The resource group only stores metadata; its resources can be in other regions, and VM1 can't join a network of another region.", fr: "Le groupe de ressources ne stocke que des métadonnées ; ses ressources peuvent être dans d'autres régions, et VM1 ne peut pas rejoindre un réseau d'une autre région." }
        c: { en: "Region pairs don't let a virtual machine join a virtual network of another region.", fr: "Les paires de régions ne permettent pas à une machine virtuelle de rejoindre un réseau virtuel d'une autre région." }
        d: { en: "A virtual network is scoped to a single region; to link networks of different regions, you use global peering.", fr: "Un réseau virtuel est limité à une seule région ; pour relier des réseaux de régions différentes, on utilise le peering mondial." }
    references:
      - title: Virtual networks and virtual machines in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-overview

  # ------------------------------------------------------------------ 6
  - id: az900-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware is moving an order application to Azure. The application has two parts:

        - An inventory component that requires changes to the operating system of its server: a third-party driver and custom system settings.
        - A pricing step that runs for a few seconds each time an order is placed, a few hundred times a day.

        Litware wants to minimize the infrastructure that it manages and to pay for the pricing step only while it runs.

        Which compute types should Litware use?
      fr: |
        Litware migre une application de commandes vers Azure. L'application comporte deux parties :

        - Un composant d'inventaire qui exige des modifications du système d'exploitation de son serveur : un pilote tiers et des paramètres système personnalisés.
        - Une étape de tarification qui s'exécute pendant quelques secondes à chaque commande passée, quelques centaines de fois par jour.

        Litware veut réduire au minimum l'infrastructure qu'elle gère et ne payer l'étape de tarification que pendant son exécution.

        Quels types de calcul Litware doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "A container for the inventory component, and a function for the pricing step", fr: "Un conteneur pour le composant d'inventaire, et une fonction pour l'étape de tarification" } }
        - { id: b, text: { en: "A container for the inventory component, and a virtual machine for the pricing step", fr: "Un conteneur pour le composant d'inventaire, et une machine virtuelle pour l'étape de tarification" } }
        - { id: c, text: { en: "A virtual machine for the inventory component, and a function for the pricing step", fr: "Une machine virtuelle pour le composant d'inventaire, et une fonction pour l'étape de tarification" } }
        - { id: d, text: { en: "A virtual machine for the inventory component, and a container for the pricing step", fr: "Une machine virtuelle pour le composant d'inventaire, et un conteneur pour l'étape de tarification" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Only a virtual machine gives you control of its own operating system, where you can install a driver and change system settings. The pricing step is short and event-driven: a function runs only when an order triggers it, scales automatically and is billed per execution, with no infrastructure to manage.
        fr: |
          Seule une machine virtuelle vous donne le contrôle de son propre système d'exploitation, où vous pouvez installer un pilote et modifier les paramètres système. L'étape de tarification est courte et déclenchée par un événement : une fonction ne s'exécute que lorsqu'une commande la déclenche, se met à l'échelle automatiquement et est facturée à l'exécution, sans infrastructure à gérer.
      options:
        a: { en: "Containers share the operating system of their host, so the inventory component can't get its own driver and system settings in a container.", fr: "Les conteneurs partagent le système d'exploitation de leur hôte : le composant d'inventaire ne peut donc pas obtenir son propre pilote et ses paramètres système dans un conteneur." }
        b: { en: "A container can't receive the operating system changes, and a virtual machine for the pricing step is billed even when no order arrives.", fr: "Un conteneur ne peut pas recevoir les modifications du système d'exploitation, et une machine virtuelle pour l'étape de tarification est facturée même quand aucune commande n'arrive." }
        d: { en: "The virtual machine fits the inventory component, but a container for the pricing step means more to manage than a function and isn't billed only per execution.", fr: "La machine virtuelle convient au composant d'inventaire, mais un conteneur pour l'étape de tarification demande plus de gestion qu'une fonction et n'est pas facturé uniquement à l'exécution." }
    references:
      - title: Describe Azure virtual machines
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
      - title: Describe Azure functions
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions

  # ------------------------------------------------------------------ 7
  - id: az900-qz-22-07
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys plans to create a virtual machine named **VM-Render** in a virtual network named **VNet1**. VM-Render will run a rendering job that uses a lot of processor power and little memory. The project files of the job must be kept on a disk separate from the operating system. VM-Render must be reachable only from the other virtual machines of VNet1, never from the internet.

        Select the answers that correctly complete the sentence.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys prévoit de créer une machine virtuelle nommée **VM-Render** dans un réseau virtuel nommé **VNet1**. VM-Render exécutera une tâche de rendu qui consomme beaucoup de puissance de processeur et peu de mémoire. Les fichiers de projet de la tâche doivent être conservés sur un disque distinct du système d'exploitation. VM-Render doit être joignable uniquement depuis les autres machines virtuelles de VNet1, jamais depuis internet.

        Sélectionnez les réponses qui complètent correctement la phrase.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          For VM-Render, choose a [[size]] size, add [[disk]], and [[ip]].
        fr: |
          Pour VM-Render, choisissez une taille [[size]], ajoutez [[disk]], et [[ip]].
      slots:
        - id: size
          options:
            - { id: general, text: { en: "general purpose", fr: "à usage général" } }
            - { id: compute, text: { en: "compute optimized", fr: "optimisée pour le calcul" } }
            - { id: memory, text: { en: "memory optimized", fr: "optimisée pour la mémoire" } }
            - { id: storage, text: { en: "storage optimized", fr: "optimisée pour le stockage" } }
        - id: disk
          options:
            - { id: datadisk, text: { en: "a data disk", fr: "un disque de données" } }
            - { id: osdisk, text: { en: "a second operating system disk", fr: "un second disque de système d'exploitation" } }
            - { id: image, text: { en: "a second image", fr: "une seconde image" } }
        - id: ip
          options:
            - { id: nopip, text: { en: "assign no public IP address", fr: "n'attribuez aucune adresse IP publique" } }
            - { id: pip, text: { en: "assign a public IP address", fr: "attribuez une adresse IP publique" } }
            - { id: p2s, text: { en: "add a point-to-site VPN connection", fr: "ajoutez une connexion VPN de point à site" } }
    answer:
      values: { size: compute, disk: datadisk, ip: nopip }
    explanation:
      correct:
        en: |
          Compute optimized sizes have a high ratio of processor to memory, which fits a processor-intensive job. A virtual machine has one operating system disk; data that must be kept apart goes on a data disk. The network interface in VNet1 is enough for the other machines of VNet1 to reach VM-Render with its private IP address, and without a public IP address it can't be reached from the internet.
        fr: |
          Les tailles optimisées pour le calcul ont un rapport processeur/mémoire élevé, adapté à une tâche gourmande en processeur. Une machine virtuelle a un seul disque de système d'exploitation ; les données à conserver à part vont sur un disque de données. L'interface réseau dans VNet1 suffit pour que les autres machines de VNet1 joignent VM-Render par son adresse IP privée, et sans adresse IP publique elle n'est pas joignable depuis internet.
      options:
        memory: { en: "Memory optimized sizes have a high ratio of memory to processor, the opposite of this job's need.", fr: "Les tailles optimisées pour la mémoire ont un rapport mémoire/processeur élevé, l'inverse du besoin de cette tâche." }
        general: { en: "General purpose sizes balance processor and memory; they aren't the best fit for a processor-intensive job.", fr: "Les tailles à usage général équilibrent processeur et mémoire ; elles ne sont pas les mieux adaptées à une tâche gourmande en processeur." }
        osdisk: { en: "A virtual machine has a single operating system disk; additional storage is added as data disks.", fr: "Une machine virtuelle a un seul disque de système d'exploitation ; le stockage supplémentaire s'ajoute sous forme de disques de données." }
        pip: { en: "A public IP address would make VM-Render reachable from the internet, and it isn't needed for traffic inside VNet1.", fr: "Une adresse IP publique rendrait VM-Render joignable depuis internet, et elle n'est pas nécessaire pour le trafic interne à VNet1." }
        p2s: { en: "A point-to-site VPN connects one remote computer to a virtual network; the machines of VNet1 don't need it.", fr: "Un VPN de point à site connecte un ordinateur distant à un réseau virtuel ; les machines de VNet1 n'en ont pas besoin." }
    references:
      - title: Sizes for virtual machines in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
      - title: Virtual networks and virtual machines in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-overview

  # ------------------------------------------------------------------ 8
  - id: az900-qz-22-08
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware is choosing how to host four workloads in Azure. For each workload, the company wants to minimize the infrastructure that it manages while meeting the stated need.

        Which service should you use for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware choisit comment héberger quatre charges de travail dans Azure. Pour chaque charge de travail, l'entreprise veut réduire au minimum l'infrastructure qu'elle gère tout en répondant au besoin indiqué.

        Quel service devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: appsvc, text: Azure App Service }
        - { id: aci, text: Azure Container Instances }
        - { id: aca, text: Azure Container Apps }
        - { id: aks, text: Azure Kubernetes Service }
        - { id: vm, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
      targets:
        - id: t1
          text: { en: "A PHP web application and its background jobs, deployed as code from Azure DevOps", fr: "Une application web PHP et ses tâches d'arrière-plan, déployées sous forme de code depuis Azure DevOps" }
        - id: t2
          text: { en: "Twelve containerized microservices that must scale automatically behind built-in load balancing, for a team that doesn't want to run a Kubernetes cluster", fr: "Douze microservices en conteneurs qui doivent se mettre à l'échelle automatiquement derrière un équilibrage de charge intégré, pour une équipe qui ne veut pas exploiter de cluster Kubernetes" }
        - id: t3
          text: { en: "Hundreds of containers whose platform team must use the Kubernetes tools and APIs to orchestrate them", fr: "Des centaines de conteneurs dont l'équipe plateforme doit utiliser les outils et les API Kubernetes pour les orchestrer" }
        - id: t4
          text: { en: "A vendor application that is supported only on a Windows Server whose operating system settings Proseware controls", fr: "Une application d'éditeur prise en charge uniquement sur un Windows Server dont Proseware contrôle les paramètres du système d'exploitation" }
    answer:
      mapping: { t1: appsvc, t2: aca, t3: aks, t4: vm }
    explanation:
      correct:
        en: |
          App Service is the PaaS for web applications, APIs and background jobs deployed as code. Container Apps runs containers serverless, with built-in autoscaling and load balancing, so the team never operates a Kubernetes cluster. When the team needs the Kubernetes APIs themselves, Azure Kubernetes Service is the choice, because Container Apps gives no direct access to them. Only a virtual machine gives control of the operating system.
        fr: |
          App Service est le PaaS des applications web, des API et des tâches d'arrière-plan déployées sous forme de code. Container Apps exécute des conteneurs en mode serverless, avec mise à l'échelle automatique et équilibrage de charge intégrés : l'équipe n'exploite jamais de cluster Kubernetes. Quand l'équipe a besoin des API Kubernetes elles-mêmes, Azure Kubernetes Service s'impose, car Container Apps n'y donne pas d'accès direct. Seule une machine virtuelle donne le contrôle du système d'exploitation.
      options:
        aci: { en: "Container Instances is the simplest way to run individual containers, but it provides no scaling or load balancing: each extra instance is a separate container instance that you create.", fr: "Container Instances est le moyen le plus simple d'exécuter des conteneurs isolés, mais il ne fournit ni mise à l'échelle ni équilibrage de charge : chaque instance supplémentaire est une instance de conteneur distincte que vous créez." }
    references:
      - title: Comparing Container Apps with other Azure container options
        url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
      - title: Describe Azure containers
        url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers

  # ------------------------------------------------------------------ 9
  - id: az900-qz-22-09
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a storage account named **stfabdocs**. A private endpoint for stfabdocs is in a subnet of a virtual network named **VNet-Hub** in West Europe, and public network access to stfabdocs is disabled. Name resolution for the private endpoint is configured in every virtual network of Fabrikam.

        Fabrikam has the following virtual machines:

        - **VM1** is in another subnet of VNet-Hub.
        - **VM2** is in **VNet-Spoke** in North Europe. VNet-Spoke is peered with VNet-Hub.
        - **VM3** is in **VNet-Dev**, which has no connection to VNet-Hub. VM3 has a public IP address.
        - **VM4** is in VNet-Dev and has no public IP address.

        Which two virtual machines can reach stfabdocs?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un compte de stockage nommé **stfabdocs**. Un point de terminaison privé pour stfabdocs se trouve dans un sous-réseau d'un réseau virtuel nommé **VNet-Hub** en Europe Ouest, et l'accès au réseau public de stfabdocs est désactivé. La résolution de noms du point de terminaison privé est configurée dans tous les réseaux virtuels de Fabrikam.

        Fabrikam dispose des machines virtuelles suivantes :

        - **VM1** se trouve dans un autre sous-réseau de VNet-Hub.
        - **VM2** se trouve dans **VNet-Spoke** en Europe Nord. VNet-Spoke est relié à VNet-Hub par peering.
        - **VM3** se trouve dans **VNet-Dev**, qui n'a aucune connexion avec VNet-Hub. VM3 a une adresse IP publique.
        - **VM4** se trouve dans VNet-Dev et n'a pas d'adresse IP publique.

        Quelles sont les deux machines virtuelles qui peuvent joindre stfabdocs ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: VM1 }
        - { id: b, text: VM2 }
        - { id: c, text: VM3 }
        - { id: d, text: VM4 }
    shuffle: false
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          The private endpoint gives stfabdocs a private IP address in VNet-Hub. Every subnet of VNet-Hub can reach it, and so can a peered virtual network, even in another region, because peering lets the two networks communicate with private IP addresses. With public network access disabled, the account can't be reached through its public endpoint at all.
        fr: |
          Le point de terminaison privé donne à stfabdocs une adresse IP privée dans VNet-Hub. Tous les sous-réseaux de VNet-Hub peuvent la joindre, de même qu'un réseau virtuel relié par peering, même dans une autre région, car le peering permet aux deux réseaux de communiquer par adresses IP privées. Avec l'accès au réseau public désactivé, le compte n'est plus joignable du tout par son point de terminaison public.
      options:
        c: { en: "A public IP address only gives VM3 a path to the public endpoint, which is disabled; VNet-Dev has no private path to the private endpoint.", fr: "Une adresse IP publique ne donne à VM3 qu'un chemin vers le point de terminaison public, qui est désactivé ; VNet-Dev n'a aucun chemin privé vers le point de terminaison privé." }
        d: { en: "VNet-Dev isn't peered or otherwise connected with VNet-Hub, so VM4 has no route to the private IP address of the endpoint.", fr: "VNet-Dev n'est ni relié par peering ni connecté d'une autre manière à VNet-Hub : VM4 n'a donc aucun itinéraire vers l'adresse IP privée du point de terminaison." }
    references:
      - title: What is a private endpoint?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview

  # ------------------------------------------------------------------ 10
  - id: az900-qz-22-10
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a datacenter in Paris that is connected to Azure through an ExpressRoute circuit. Woodgrove has a virtual network named **VNet-Prod** in the France Central region. The virtual machines of VNet-Prod run internal banking applications and must not be exposed to the internet, and the bank is planning to extend its Azure footprint to other European regions.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un centre de données à Paris, relié à Azure par un circuit ExpressRoute. Woodgrove dispose d'un réseau virtuel nommé **VNet-Prod** dans la région France Centre. Les machines virtuelles de VNet-Prod exécutent des applications bancaires internes et ne doivent pas être exposées sur internet, et la banque prévoit d'étendre sa présence Azure à d'autres régions européennes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Woodgrove can add a subnet in the West Europe region to VNet-Prod, so that virtual machines in both regions share one address space.", fr: "Woodgrove peut ajouter à VNet-Prod un sous-réseau dans la région Europe Ouest, afin que des machines virtuelles des deux régions partagent un même espace d'adressage." }
        - id: s2
          text: { en: "Azure DNS can host a private zone that resolves the names of the virtual machines of VNet-Prod from within the virtual network, without a custom DNS server to deploy.", fr: "Azure DNS peut héberger une zone privée qui résout les noms des machines virtuelles de VNet-Prod depuis le réseau virtuel, sans serveur DNS personnalisé à déployer." }
        - id: s3
          text: { en: "Through its ExpressRoute connection, the Paris datacenter can reach Azure regions of the same geography other than France Central.", fr: "Par sa connexion ExpressRoute, le centre de données de Paris peut joindre des régions Azure de la même zone géographique autres que France Centre." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          A virtual network and its subnets belong to a single region; resources in another region need their own virtual network, linked for example by global peering. Azure DNS supports private zones, which resolve names inside the virtual networks linked to them without a custom DNS solution. An ExpressRoute connection gives access to all the Azure regions of the geography where it is located.
        fr: |
          Un réseau virtuel et ses sous-réseaux appartiennent à une seule région ; les ressources d'une autre région ont besoin de leur propre réseau virtuel, relié par exemple par peering mondial. Azure DNS prend en charge les zones privées, qui résolvent les noms à l'intérieur des réseaux virtuels qui leur sont liés sans solution DNS personnalisée. Une connexion ExpressRoute donne accès à toutes les régions Azure de la zone géographique où elle se trouve.
      options:
        s1: { en: "All the subnets of a virtual network are in the region of the network; West Europe needs another virtual network.", fr: "Tous les sous-réseaux d'un réseau virtuel sont dans la région du réseau ; Europe Ouest demande un autre réseau virtuel." }
    references:
      - title: What is Azure Private DNS?
        url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
      - title: What is Azure ExpressRoute?
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-introduction
