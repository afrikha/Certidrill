chapter: 33-management-tools
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-33-01
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which statement about where Azure Cloud Shell runs is true?
      fr: |
        Quelle affirmation sur l'endroit où s'exécute Azure Cloud Shell est vraie ?
    body:
      options:
        - { id: a, text: { en: "It runs on your computer after you install the Azure CLI and Azure PowerShell.", fr: "Il s'exécute sur votre ordinateur après l'installation d'Azure CLI et d'Azure PowerShell." } }
        - { id: b, text: { en: "It runs on a virtual machine that you must first deploy in your subscription.", fr: "Il s'exécute sur une machine virtuelle que vous devez d'abord déployer dans votre abonnement." } }
        - { id: c, text: { en: "It runs in a web browser, opened from the Azure portal or at shell.azure.com.", fr: "Il s'exécute dans un navigateur web, ouvert depuis le portail Azure ou sur shell.azure.com." } }
        - { id: d, text: { en: "It runs only in the Azure mobile app, on a phone or a tablet.", fr: "Il s'exécute uniquement dans l'application mobile Azure, sur un téléphone ou une tablette." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Cloud Shell is a browser-based shell that you open from the Azure portal or at shell.azure.com. The Azure CLI and Azure PowerShell are already installed in it, so nothing has to be installed or configured on your computer.
        fr: |
          Azure Cloud Shell est un shell dans le navigateur, que vous ouvrez depuis le portail Azure ou sur shell.azure.com. Azure CLI et Azure PowerShell y sont déjà installés : rien n'est à installer ni à configurer sur votre ordinateur.
      options:
        a: { en: "Installing the tools locally is the alternative to Cloud Shell; Cloud Shell itself needs no local installation.", fr: "Installer les outils en local est l'alternative à Cloud Shell ; Cloud Shell lui-même ne demande aucune installation locale." }
        b: { en: "Cloud Shell is provided by Azure; you don't deploy a virtual machine to use it.", fr: "Cloud Shell est fourni par Azure ; vous ne déployez aucune machine virtuelle pour l'utiliser." }
        d: { en: "The mobile app is one way to reach a command line, but Cloud Shell mainly runs in a web browser.", fr: "L'application mobile est un moyen d'accéder à une ligne de commande, mais Cloud Shell s'exécute principalement dans un navigateur web." }
    references:
      - title: What is Azure Cloud Shell?
        url: https://learn.microsoft.com/en-us/azure/cloud-shell/overview

  # ------------------------------------------------------------------ 2
  - id: az900-qz-33-02
    objective: "3.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The infrastructure of Contoso is defined in ARM templates written in JSON. A developer suggests that the team switch to Bicep.

        Which statement about Bicep is true?
      fr: |
        L'infrastructure de Contoso est définie dans des modèles ARM écrits en JSON. Un développeur propose que l'équipe passe à Bicep.

        Quelle affirmation sur Bicep est vraie ?
    body:
      options:
        - { id: a, text: { en: "It lists the commands to run in order, like an Azure CLI script.", fr: "Il liste les commandes à exécuter dans l'ordre, comme un script Azure CLI." } }
        - { id: b, text: { en: "It describes resources declaratively, with a more concise syntax than JSON.", fr: "Il décrit les ressources de façon déclarative, avec une syntaxe plus concise que le JSON." } }
        - { id: c, text: { en: "It supports fewer resource types than JSON templates, mainly virtual machines.", fr: "Il prend en charge moins de types de ressources que les modèles JSON, surtout des machines virtuelles." } }
        - { id: d, text: { en: "It sends resources directly to each Azure service, without Azure Resource Manager.", fr: "Il envoie les ressources directement à chaque service Azure, sans Azure Resource Manager." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Bicep is a declarative language for Azure resources, like JSON ARM templates, but with a simpler and more concise syntax. It supports all resource types, and a Bicep file is converted to an ARM template when it is deployed.
        fr: |
          Bicep est un langage déclaratif pour les ressources Azure, comme les modèles ARM JSON, mais avec une syntaxe plus simple et plus concise. Il prend en charge tous les types de ressources, et un fichier Bicep est converti en modèle ARM au déploiement.
      options:
        a: { en: "A list of commands run in order is an imperative script; Bicep describes the final state.", fr: "Une liste de commandes exécutées dans l'ordre est un script impératif ; Bicep décrit l'état final." }
        c: { en: "Bicep supports all the resource types that ARM templates support.", fr: "Bicep prend en charge tous les types de ressources que prennent en charge les modèles ARM." }
        d: { en: "A Bicep file is converted to an ARM template, which Azure Resource Manager processes like any other request.", fr: "Un fichier Bicep est converti en modèle ARM, qu'Azure Resource Manager traite comme toute autre requête." }
    references:
      - title: What is Bicep?
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview

  # ------------------------------------------------------------------ 3
  - id: az900-qz-33-03
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Windows administrators of Proseware already automate their on-premises servers with PowerShell scripts. The same scripts must now also create and configure Azure resources, and the administrators prefer commands that follow the PowerShell conventions they know. The scripts run on the administrators' own computers.

        What should the administrators use?
      fr: |
        Les administrateurs Windows de Proseware automatisent déjà leurs serveurs locaux avec des scripts PowerShell. Ces mêmes scripts doivent maintenant aussi créer et configurer des ressources Azure, et les administrateurs préfèrent des commandes qui suivent les conventions PowerShell qu'ils connaissent. Les scripts s'exécutent sur les propres ordinateurs des administrateurs.

        Que doivent utiliser les administrateurs ?
    body:
      options:
        - { id: a, text: Azure PowerShell }
        - { id: b, text: Azure CLI }
        - { id: c, text: Azure Cloud Shell }
        - { id: d, text: Bicep }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure PowerShell is a module of PowerShell commands that you install on Windows, Linux or macOS. Its commands follow the PowerShell conventions, so the administrators can add Azure tasks to their existing scripts with little new learning.
        fr: |
          Azure PowerShell est un module de commandes PowerShell que vous installez sous Windows, Linux ou macOS. Ses commandes suivent les conventions PowerShell : les administrateurs peuvent donc ajouter des tâches Azure à leurs scripts existants sans beaucoup d'apprentissage.
      options:
        b: { en: "The Azure CLI does the same tasks, but with Bash-style commands rather than PowerShell conventions.", fr: "Azure CLI réalise les mêmes tâches, mais avec des commandes de style Bash plutôt qu'avec les conventions PowerShell." }
        c: { en: "Cloud Shell runs in the browser, while these scripts must run on the administrators' own computers.", fr: "Cloud Shell s'exécute dans le navigateur, alors que ces scripts doivent s'exécuter sur les propres ordinateurs des administrateurs." }
        d: { en: "Bicep is a language for describing resources declaratively; it doesn't add commands to PowerShell scripts.", fr: "Bicep est un langage qui décrit des ressources de façon déclarative ; il n'ajoute pas de commandes aux scripts PowerShell." }
    references:
      - title: What is Azure PowerShell?
        url: https://learn.microsoft.com/en-us/powershell/azure/what-is-azure-powershell

  # ------------------------------------------------------------------ 4
  - id: az900-qz-33-04
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum runs Windows and Linux servers in its datacenter and a Kubernetes cluster at another cloud provider. The operations team wants to govern, secure and monitor all of them from Azure, alongside the virtual machines that Adatum already runs in Azure, and plans to use Azure Arc.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum exécute des serveurs Windows et Linux dans son centre de données ainsi qu'un cluster Kubernetes chez un autre fournisseur de cloud. L'équipe des opérations veut les gouverner, les sécuriser et les surveiller tous depuis Azure, aux côtés des machines virtuelles qu'Adatum exécute déjà dans Azure, et prévoit d'utiliser Azure Arc.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Once the servers are connected to Azure Arc, Adatum can use Microsoft Defender for Cloud with them.", fr: "Une fois les serveurs connectés à Azure Arc, Adatum peut utiliser Microsoft Defender pour le cloud avec eux." } }
        - { id: s2, text: { en: "Before Azure Arc can manage the Kubernetes cluster, the cluster must be moved to Azure Kubernetes Service (AKS).", fr: "Avant qu'Azure Arc puisse gérer le cluster Kubernetes, le cluster doit être déplacé vers Azure Kubernetes Service (AKS)." } }
        - { id: s3, text: { en: "With Azure Arc, Adatum can run Azure data services in its own datacenter and manage them from Azure.", fr: "Avec Azure Arc, Adatum peut exécuter des services de données Azure dans son propre centre de données et les gérer depuis Azure." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Azure Arc projects resources that run outside Azure into Azure Resource Manager, so familiar Azure services such as Azure Policy, Azure Monitor and Microsoft Defender for Cloud can be used with them. Kubernetes clusters are managed where they run, in any cloud or datacenter, and Azure data services can also run outside Azure and be managed through Azure Arc.
        fr: |
          Azure Arc projette dans Azure Resource Manager les ressources qui s'exécutent hors d'Azure : les services Azure habituels comme Azure Policy, Azure Monitor et Microsoft Defender pour le cloud peuvent donc être utilisés avec elles. Les clusters Kubernetes sont gérés là où ils s'exécutent, dans n'importe quel cloud ou centre de données, et des services de données Azure peuvent aussi s'exécuter hors d'Azure et être gérés via Azure Arc.
      options:
        s2: { en: "Azure Arc manages Kubernetes clusters where they are; nothing is moved to Azure.", fr: "Azure Arc gère les clusters Kubernetes là où ils se trouvent ; rien n'est déplacé vers Azure." }
    references:
      - title: Azure Arc overview
        url: https://learn.microsoft.com/en-us/azure/azure-arc/overview

  # ------------------------------------------------------------------ 5
  - id: az900-qz-33-05
    objective: "3.3.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        The administrators of Litware use several Azure management tools and want to pick the most suitable one for each of their tasks.

        How should you complete the sentences? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les administrateurs de Litware utilisent plusieurs outils de gestion Azure et veulent choisir le plus adapté à chacune de leurs tâches.

        Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To discover the settings of a new Azure service through guided forms before automating anything, use [[explore]].

          To deploy the same 40 resources every week to three environments, use [[repeat]].

          To stop a virtual machine from a phone while away from the office, use [[phone]].
        fr: |
          Pour découvrir les paramètres d'un nouveau service Azure par des formulaires guidés avant de rien automatiser, utilisez [[explore]].

          Pour déployer chaque semaine les mêmes 40 ressources dans trois environnements, utilisez [[repeat]].

          Pour arrêter une machine virtuelle depuis un téléphone en dehors du bureau, utilisez [[phone]].
      slots:
        - id: explore
          options:
            - { id: arm, text: { en: "an ARM template", fr: "un modèle ARM" } }
            - { id: portal, text: { en: "the Azure portal", fr: "le portail Azure" } }
            - { id: arc, text: Azure Arc }
        - id: repeat
          options:
            - { id: portal, text: { en: "the Azure portal", fr: "le portail Azure" } }
            - { id: mobile, text: { en: "the Azure mobile app", fr: "l'application mobile Azure" } }
            - { id: arm, text: { en: "an ARM template", fr: "un modèle ARM" } }
        - id: phone
          options:
            - { id: mobile, text: { en: "the Azure mobile app", fr: "l'application mobile Azure" } }
            - { id: arm, text: { en: "an ARM template", fr: "un modèle ARM" } }
            - { id: arc, text: Azure Arc }
    answer:
      values: { explore: portal, repeat: arm, phone: mobile }
    explanation:
      correct:
        en: |
          The Azure portal is a graphical web console with guided forms, well suited to exploring and to occasional tasks. Repetitive or large-scale deployments are faster and less error-prone with templates, which give the same result each time. The Azure mobile app gives access to resources, alerts and a command line from a phone, including common operations such as stopping a virtual machine.
        fr: |
          Le portail Azure est une console web graphique avec des formulaires guidés, bien adaptée à l'exploration et aux tâches occasionnelles. Les déploiements répétitifs ou à grande échelle sont plus rapides et moins sujets aux erreurs avec des modèles, qui donnent le même résultat à chaque fois. L'application mobile Azure donne accès aux ressources, aux alertes et à une ligne de commande depuis un téléphone, y compris à des opérations courantes comme l'arrêt d'une machine virtuelle.
      options:
        arc: { en: "Azure Arc extends Azure management to resources outside Azure; it isn't a tool for exploring a service or for working from a phone.", fr: "Azure Arc étend la gestion d'Azure aux ressources hors d'Azure ; ce n'est pas un outil pour explorer un service ni pour travailler depuis un téléphone." }
    references:
      - title: Describe tools for interacting with Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
      - title: What is the Azure mobile app?
        url: https://learn.microsoft.com/en-us/azure/azure-portal/mobile-app/overview

  # ------------------------------------------------------------------ 6
  - id: az900-qz-33-06
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso manages its Azure resources from the portal, the Azure CLI, Azure PowerShell and ARM templates. All the requests go through Azure Resource Manager. The requirements are listed in the answer area.

        Which Azure Resource Manager capability meets each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso gère ses ressources Azure depuis le portail, Azure CLI, Azure PowerShell et des modèles ARM. Toutes les requêtes passent par Azure Resource Manager. Les exigences figurent dans la zone de réponse.

        Quelle capacité d'Azure Resource Manager répond à chaque exigence ? Pour répondre, faites glisser les capacités appropriées vers les exigences correspondantes. Chaque capacité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: dep, text: { en: "Dependencies declared in a template", fr: "Dépendances déclarées dans un modèle" } }
        - { id: rbac, text: Azure RBAC }
        - { id: lock, text: { en: "Resource locks", fr: "Verrous de ressources" } }
        - { id: tags, text: { en: "Tags", fr: "Étiquettes" } }
        - { id: ext, text: { en: "Deployment scripts in a template", fr: "Scripts de déploiement dans un modèle" } }
      targets:
        - id: t1
          text: { en: "In one deployment, a virtual machine must be created only after the virtual network that it uses.", fr: "Dans un même déploiement, une machine virtuelle ne doit être créée qu'après le réseau virtuel qu'elle utilise." }
        - id: t2
          text: { en: "The members of G-Support may only view the resources of RG-App, whatever tool they use; the other administrators keep full access.", fr: "Les membres de G-Support peuvent seulement consulter les ressources de RG-App, quel que soit l'outil utilisé ; les autres administrateurs gardent un accès complet." }
        - id: t3
          text: { en: "Nobody, including the administrators, may delete the production SQL server by accident, whatever tool they use.", fr: "Personne, administrateurs compris, ne doit pouvoir supprimer par accident le serveur SQL de production, quel que soit l'outil utilisé." }
        - id: t4
          text: { en: "The finance team must follow the costs of project Atlas, whose resources are spread across three resource groups.", fr: "L'équipe financière doit suivre les coûts du projet Atlas, dont les ressources sont réparties dans trois groupes de ressources." }
    answer:
      mapping: { t1: dep, t2: rbac, t3: lock, t4: tags }
    explanation:
      correct:
        en: |
          A template declares dependencies so that Azure Resource Manager deploys the resources in the right order. Because every request goes through Azure Resource Manager, Azure RBAC (here, Reader for G-Support) and resource locks apply whatever the tool: RBAC depends on who the user is, while a lock applies to everyone. Tags let you follow billing for resources that share a tag, even across resource groups.
        fr: |
          Un modèle déclare des dépendances pour qu'Azure Resource Manager déploie les ressources dans le bon ordre. Comme toutes les requêtes passent par Azure Resource Manager, Azure RBAC (ici, Reader pour G-Support) et les verrous de ressources s'appliquent quel que soit l'outil : RBAC dépend de qui est l'utilisateur, alors qu'un verrou s'applique à tout le monde. Les étiquettes permettent de suivre la facturation des ressources qui partagent une étiquette, même réparties dans plusieurs groupes de ressources.
      options:
        ext: { en: "Deployment scripts add PowerShell or Bash steps to a template; they don't order resources, restrict users or group costs.", fr: "Les scripts de déploiement ajoutent des étapes PowerShell ou Bash à un modèle ; ils n'ordonnent pas les ressources, ne restreignent pas les utilisateurs et ne regroupent pas les coûts." }
    references:
      - title: What is Azure Resource Manager?
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview

  # ------------------------------------------------------------------ 7
  - id: az900-qz-33-07
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank wants to apply Azure Policy and Azure RBAC to the following resources:

        - **VM1**, a virtual machine in the West Europe Azure region
        - **SQL1**, a SQL Server instance installed on a server in the bank's datacenter
        - **DB1**, a database in Azure SQL Database
        - **K8S1**, a Kubernetes cluster that runs at another cloud provider
        - **AKS1**, an Azure Kubernetes Service (AKS) cluster in the North Europe Azure region

        Which two resources must first be connected to Azure Arc? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank veut appliquer Azure Policy et Azure RBAC aux ressources suivantes :

        - **VM1**, une machine virtuelle dans la région Azure Europe Ouest
        - **SQL1**, une instance SQL Server installée sur un serveur du centre de données de la banque
        - **DB1**, une base de données Azure SQL Database
        - **K8S1**, un cluster Kubernetes qui s'exécute chez un autre fournisseur de cloud
        - **AKS1**, un cluster Azure Kubernetes Service (AKS) dans la région Azure Europe Nord

        Quelles sont les deux ressources qui doivent d'abord être connectées à Azure Arc ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: VM1 }
        - { id: b, text: SQL1 }
        - { id: c, text: DB1 }
        - { id: d, text: K8S1 }
        - { id: e, text: AKS1 }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Azure Arc is needed only for resources that run outside Azure. SQL Server in the bank's datacenter and a Kubernetes cluster at another cloud provider are such resources: once connected, they are projected into Azure Resource Manager and Azure Policy and Azure RBAC apply to them.
        fr: |
          Azure Arc n'est nécessaire que pour les ressources qui s'exécutent hors d'Azure. SQL Server dans le centre de données de la banque et un cluster Kubernetes chez un autre fournisseur de cloud sont de telles ressources : une fois connectées, elles sont projetées dans Azure Resource Manager, et Azure Policy et Azure RBAC s'y appliquent.
      options:
        a: { en: "VM1 is already an Azure resource managed by Azure Resource Manager; Azure Arc adds nothing.", fr: "VM1 est déjà une ressource Azure gérée par Azure Resource Manager ; Azure Arc n'apporte rien." }
        c: { en: "Azure SQL Database is an Azure service; unlike SQL Server installed outside Azure, it doesn't need Azure Arc.", fr: "Azure SQL Database est un service Azure ; contrairement à SQL Server installé hors d'Azure, il n'a pas besoin d'Azure Arc." }
        e: { en: "AKS1 is a Kubernetes cluster that already runs in Azure; Azure Arc is for clusters that run outside Azure.", fr: "AKS1 est un cluster Kubernetes qui s'exécute déjà dans Azure ; Azure Arc concerne les clusters qui s'exécutent hors d'Azure." }
    references:
      - title: Azure Arc overview
        url: https://learn.microsoft.com/en-us/azure/azure-arc/overview

  # ------------------------------------------------------------------ 8
  - id: az900-qz-33-08
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a resource group named **RG-App** that contains a virtual machine named **VM1**. A user named Lea has only the Reader role for RG-App. Lea signs in to the Azure portal with her own account, opens Azure Cloud Shell from the portal toolbar and tries several tasks on RG-App.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un groupe de ressources nommé **RG-App** qui contient une machine virtuelle nommée **VM1**. Une utilisatrice nommée Lea dispose uniquement du rôle Reader sur RG-App. Lea se connecte au portail Azure avec son propre compte, ouvre Azure Cloud Shell depuis la barre d'outils du portail et essaie plusieurs tâches sur RG-App.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "In Cloud Shell, Lea can delete VM1 with an Azure CLI command, because Cloud Shell commands run with administrative rights.", fr: "Dans Cloud Shell, Lea peut supprimer VM1 avec une commande Azure CLI, car les commandes de Cloud Shell s'exécutent avec des droits d'administration." } }
        - { id: s2, text: { en: "If Lea deploys a Bicep file that creates a storage account in RG-App, the deployment fails.", fr: "Si Lea déploie un fichier Bicep qui crée un compte de stockage dans RG-App, le déploiement échoue." } }
        - { id: s3, text: { en: "Lea can view the properties of VM1 both in the portal and with Azure PowerShell in Cloud Shell.", fr: "Lea peut consulter les propriétés de VM1 à la fois dans le portail et avec Azure PowerShell dans Cloud Shell." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Cloud Shell is authenticated with the account that Lea used to sign in to the portal, so her commands carry her own permissions. Every request, from the portal, a command line or a Bicep deployment, goes through Azure Resource Manager, which authorizes it with Azure RBAC: Reader allows viewing VM1 with any tool, but no creation or deletion.
        fr: |
          Cloud Shell est authentifié avec le compte que Lea a utilisé pour se connecter au portail : ses commandes portent donc ses propres autorisations. Chaque requête, qu'elle vienne du portail, d'une ligne de commande ou d'un déploiement Bicep, passe par Azure Resource Manager, qui l'autorise avec Azure RBAC : Reader permet de consulter VM1 avec n'importe quel outil, mais aucune création ni suppression.
      options:
        s1: { en: "Cloud Shell runs with the signed-in account, and Azure Resource Manager denies a deletion that the Reader role doesn't allow.", fr: "Cloud Shell s'exécute avec le compte connecté, et Azure Resource Manager refuse une suppression que le rôle Reader n'autorise pas." }
    references:
      - title: What is Azure Resource Manager?
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
      - title: Describe tools for interacting with Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure

  # ------------------------------------------------------------------ 9
  - id: az900-qz-33-09
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The main ARM template of Fabrikam deploys a virtual network named **VNet1**, two virtual machines that connect to VNet1, and a storage account that doesn't depend on any other resource. The network part is stored in a separate template file that other projects also use.

        How should you complete the sentences? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le modèle ARM principal de Fabrikam déploie un réseau virtuel nommé **VNet1**, deux machines virtuelles qui se connectent à VNet1 et un compte de stockage qui ne dépend d'aucune autre ressource. La partie réseau est stockée dans un fichier de modèle distinct que d'autres projets utilisent aussi.

        Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Azure Resource Manager deploys [[order]].

          The order is decided by [[dep]].

          Using the same network template file in other projects relies on the benefit of ARM templates called [[benefit]].
        fr: |
          Azure Resource Manager déploie [[order]].

          L'ordre est déterminé par [[dep]].

          L'utilisation du même fichier de modèle réseau dans d'autres projets repose sur l'avantage des modèles ARM appelé [[benefit]].
      slots:
        - id: order
          options:
            - { id: seq, text: { en: "the four resources one at a time, in the order in which they appear in the file", fr: "les quatre ressources une par une, dans l'ordre où elles figurent dans le fichier" } }
            - { id: all, text: { en: "the four resources at the same time, whatever their dependencies", fr: "les quatre ressources en même temps, quelles que soient leurs dépendances" } }
            - { id: par, text: { en: "VNet1 and the storage account in parallel, then the two virtual machines after VNet1", fr: "VNet1 et le compte de stockage en parallèle, puis les deux machines virtuelles après VNet1" } }
        - id: dep
          options:
            - { id: file, text: { en: "the position of each resource in the file", fr: "la position de chaque ressource dans le fichier" } }
            - { id: declared, text: { en: "the dependencies declared in the template", fr: "les dépendances déclarées dans le modèle" } }
            - { id: portal, text: { en: "the Azure portal, when the deployment starts", fr: "le portail Azure, au démarrage du déploiement" } }
        - id: benefit
          options:
            - { id: ext, text: { en: "extensibility", fr: "l'extensibilité" } }
            - { id: orch, text: { en: "orchestration", fr: "l'orchestration" } }
            - { id: mod, text: { en: "modular files", fr: "les fichiers modulaires" } }
            - { id: decl, text: { en: "declarative syntax", fr: "la syntaxe déclarative" } }
    answer:
      values: { order: par, dep: declared, benefit: mod }
    explanation:
      correct:
        en: |
          With orchestration, Azure Resource Manager orders interdependent resources and deploys the others in parallel when possible: VNet1 and the independent storage account can start together, and the virtual machines wait for VNet1. That order comes from the dependencies defined in the template, not from the position of the resources. Splitting a template into smaller, reusable files is the modular files benefit.
        fr: |
          Avec l'orchestration, Azure Resource Manager ordonne les ressources interdépendantes et déploie les autres en parallèle quand c'est possible : VNet1 et le compte de stockage indépendant peuvent démarrer ensemble, et les machines virtuelles attendent VNet1. Cet ordre vient des dépendances définies dans le modèle, pas de la position des ressources. Découper un modèle en fichiers plus petits et réutilisables est l'avantage des fichiers modulaires.
      options:
        seq: { en: "ARM doesn't deploy one resource at a time in file order; it deploys in parallel when dependencies allow it.", fr: "ARM ne déploie pas une ressource à la fois dans l'ordre du fichier ; il déploie en parallèle quand les dépendances le permettent." }
        all: { en: "The virtual machines depend on VNet1, so they can't start before VNet1 exists.", fr: "Les machines virtuelles dépendent de VNet1 : elles ne peuvent donc pas démarrer avant que VNet1 existe." }
        orch: { en: "Orchestration is how ARM orders and parallelizes the deployment; reusing a file in other projects is modularity.", fr: "L'orchestration est la façon dont ARM ordonne et parallélise le déploiement ; réutiliser un fichier dans d'autres projets relève de la modularité." }
    references:
      - title: What are ARM templates?
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview

  # ------------------------------------------------------------------ 10
  - id: az900-qz-33-10
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware deploys all its environments from Bicep files through a pipeline. During an incident, an engineer changes the redundancy of a storage account named **stprod** from LRS to GRS in the Azure portal. The Bicep file still declares LRS for stprod. The next night, the pipeline deploys the unchanged Bicep file again.

        What happens, and what should the engineer have done?
      fr: |
        Proseware déploie tous ses environnements à partir de fichiers Bicep par un pipeline. Pendant un incident, un ingénieur fait passer la redondance d'un compte de stockage nommé **stprod** de LRS à GRS dans le portail Azure. Le fichier Bicep déclare toujours LRS pour stprod. La nuit suivante, le pipeline déploie de nouveau le fichier Bicep inchangé.

        Que se passe-t-il, et qu'aurait dû faire l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "stprod keeps GRS, because a deployment only creates missing resources; no other action was needed.", fr: "stprod garde GRS, car un déploiement ne crée que les ressources manquantes ; aucune autre action n'était nécessaire." } }
        - { id: b, text: { en: "The deployment fails because stprod differs from the file; stprod should have been deleted and recreated.", fr: "Le déploiement échoue car stprod diffère du fichier ; stprod aurait dû être supprimé puis recréé." } }
        - { id: c, text: { en: "A second storage account is created with LRS; a Delete lock should have been applied to stprod.", fr: "Un second compte de stockage est créé avec LRS ; un verrou Suppression aurait dû être appliqué à stprod." } }
        - { id: d, text: { en: "stprod goes back to LRS; the change should have been made in the Bicep file and deployed by the pipeline.", fr: "stprod repasse en LRS ; la modification aurait dû être faite dans le fichier Bicep et déployée par le pipeline." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Bicep file is declarative: it describes the desired state, and each deployment applies that state again. The redeployment therefore sets stprod back to the LRS that the file declares, and the manual fix is lost. With infrastructure as code, changes are made in the versioned files and deployed through the pipeline, so that the code and the environments stay consistent.
        fr: |
          Un fichier Bicep est déclaratif : il décrit l'état voulu, et chaque déploiement applique de nouveau cet état. Le redéploiement repasse donc stprod au LRS que déclare le fichier, et la correction manuelle est perdue. Avec l'infrastructure en tant que code, les modifications se font dans les fichiers versionnés et sont déployées par le pipeline, pour que le code et les environnements restent cohérents.
      options:
        a: { en: "A declarative deployment also updates existing resources to the declared state, not only missing ones.", fr: "Un déploiement déclaratif met aussi les ressources existantes dans l'état déclaré, pas seulement les ressources manquantes." }
        b: { en: "Redeploying to an existing resource doesn't fail; Azure Resource Manager updates it to match the file.", fr: "Redéployer sur une ressource existante n'échoue pas ; Azure Resource Manager la met à jour pour qu'elle corresponde au fichier." }
        c: { en: "Deployments are repeatable: the same file updates stprod instead of creating a copy, and a Delete lock doesn't block a configuration change.", fr: "Les déploiements sont reproductibles : le même fichier met à jour stprod au lieu d'en créer une copie, et un verrou Suppression ne bloque pas une modification de configuration." }
    references:
      - title: What is infrastructure as code (IaC)?
        url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
      - title: Azure Resource Manager deployment modes
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
