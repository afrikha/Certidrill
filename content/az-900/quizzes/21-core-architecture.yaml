chapter: 21-core-architecture
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A law requires Adatum to keep the data of a new application inside one country. Adatum deploys the application to Azure.

        What determines where Azure stores the data of the application's resources?
      fr: |
        Une loi impose à Adatum de conserver les données d'une nouvelle application dans un seul pays. Adatum déploie l'application dans Azure.

        Qu'est-ce qui détermine où Azure stocke les données des ressources de l'application ?
    body:
      options:
        - { id: a, text: { en: "The location of the resource group that holds the resources", fr: "L'emplacement du groupe de ressources qui contient les ressources" } }
        - { id: b, text: { en: "The billing address of the subscription that pays for them", fr: "L'adresse de facturation de l'abonnement qui les paie" } }
        - { id: c, text: { en: "The region that Adatum selects for each of the resources", fr: "La région qu'Adatum sélectionne pour chacune des ressources" } }
        - { id: d, text: { en: "The management group that contains the subscription", fr: "Le groupe d'administration qui contient l'abonnement" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When you create a resource, you choose its region, a geographical area that contains one or more datacenters. This choice decides where the resource and its data are hosted, which is why it matters for data residency as well as for latency, price and service availability.
        fr: |
          Quand vous créez une ressource, vous choisissez sa région, une zone géographique qui contient un ou plusieurs centres de données. Ce choix décide où la ressource et ses données sont hébergées : il compte donc pour la résidence des données, comme pour la latence, le prix et la disponibilité des services.
      options:
        a: { en: "The location of a resource group only says where its metadata is stored; its resources can be in other regions.", fr: "L'emplacement d'un groupe de ressources indique seulement où sont stockées ses métadonnées ; ses ressources peuvent être dans d'autres régions." }
        b: { en: "A subscription is a billing and access boundary; its billing details don't place the resources anywhere.", fr: "Un abonnement est une limite de facturation et d'accès ; ses informations de facturation ne placent les ressources nulle part." }
        d: { en: "A management group organizes subscriptions for governance; it has no physical location for the data.", fr: "Un groupe d'administration organise des abonnements pour la gouvernance ; il n'a pas d'emplacement physique pour les données." }
    references:
      - title: Describe Azure physical infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure

  # ------------------------------------------------------------------ 2
  - id: az900-qz-21-02
    objective: "2.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which items can be placed directly inside an Azure management group?
      fr: |
        Quels éléments peuvent être placés directement dans un groupe d'administration Azure ?
    body:
      options:
        - { id: a, text: { en: "Subscriptions and resource groups", fr: "Des abonnements et des groupes de ressources" } }
        - { id: b, text: { en: "Resource groups and resources", fr: "Des groupes de ressources et des ressources" } }
        - { id: c, text: { en: "Other management groups and subscriptions", fr: "D'autres groupes d'administration et des abonnements" } }
        - { id: d, text: { en: "Subscriptions and Microsoft Entra tenants", fr: "Des abonnements et des locataires Microsoft Entra" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Management groups are containers above subscriptions. Their children are other management groups, nested up to six levels deep, and subscriptions. Resource groups always sit inside a subscription, and resources inside a resource group.
        fr: |
          Les groupes d'administration sont des conteneurs situés au-dessus des abonnements. Leurs enfants sont d'autres groupes d'administration, imbriqués sur six niveaux au plus, et des abonnements. Les groupes de ressources se trouvent toujours dans un abonnement, et les ressources dans un groupe de ressources.
      options:
        a: { en: "A resource group can't be a direct child of a management group: it is always created in a subscription.", fr: "Un groupe de ressources ne peut pas être un enfant direct d'un groupe d'administration : il est toujours créé dans un abonnement." }
        b: { en: "Resource groups and resources are two levels below management groups, under the subscriptions.", fr: "Les groupes de ressources et les ressources se situent deux niveaux sous les groupes d'administration, sous les abonnements." }
        d: { en: "The tenant is the directory that holds the whole hierarchy, with a single root management group at its top; it isn't placed in a management group.", fr: "Le locataire est l'annuaire qui contient toute la hiérarchie, avec un unique groupe d'administration racine à son sommet ; il n'est pas placé dans un groupe d'administration." }
    references:
      - title: What are Azure management groups?
        url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview

  # ------------------------------------------------------------------ 3
  - id: az900-qz-21-03
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam creates a resource group named **RG-Web** and sets its location to East US. RG-Web then receives a web app in West Europe and a database in North Europe.

        What does the East US location of RG-Web determine?
      fr: |
        Fabrikam crée un groupe de ressources nommé **RG-Web** et définit son emplacement sur East US. RG-Web reçoit ensuite une application web dans Europe Ouest et une base de données dans Europe Nord.

        Que détermine l'emplacement East US de RG-Web ?
    body:
      options:
        - { id: a, text: { en: "The region in which the resources of RG-Web are billed", fr: "La région dans laquelle les ressources de RG-Web sont facturées" } }
        - { id: b, text: { en: "The region in which the metadata of RG-Web is stored", fr: "La région dans laquelle les métadonnées de RG-Web sont stockées" } }
        - { id: c, text: { en: "The region to which the data of RG-Web is replicated", fr: "La région vers laquelle les données de RG-Web sont répliquées" } }
        - { id: d, text: { en: "The region in which new resources of RG-Web must run", fr: "La région dans laquelle les nouvelles ressources de RG-Web doivent s'exécuter" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A resource group has a location, which is where its metadata is stored. It is a logical container, so it can hold resources from different regions: the web app runs in West Europe and the database in North Europe, whatever the location of RG-Web.
        fr: |
          Un groupe de ressources a un emplacement, où sont stockées ses métadonnées. C'est un conteneur logique : il peut donc contenir des ressources de régions différentes. L'application web s'exécute dans Europe Ouest et la base de données dans Europe Nord, quel que soit l'emplacement de RG-Web.
      options:
        a: { en: "Billing is organized per subscription, the billing boundary; the location of a resource group plays no role in it.", fr: "La facturation s'organise par abonnement, la limite de facturation ; l'emplacement d'un groupe de ressources n'y joue aucun rôle." }
        c: { en: "A resource group doesn't replicate data; replication depends on each resource, for example the redundancy of a storage account.", fr: "Un groupe de ressources ne réplique pas de données ; la réplication dépend de chaque ressource, par exemple de la redondance d'un compte de stockage." }
        d: { en: "Resources of a resource group can run in any region, as the web app and the database of RG-Web already do.", fr: "Les ressources d'un groupe de ressources peuvent s'exécuter dans n'importe quelle région, comme le font déjà l'application web et la base de données de RG-Web." }
    references:
      - title: Describe Azure management infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure

  # ------------------------------------------------------------------ 4
  - id: az900-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank deploys all its workloads in one Azure subscription. The cloud team reports that the subscription has reached a limit that Azure sets per subscription, and new workloads must still be deployed.

        What should Woodgrove Bank do?
      fr: |
        Woodgrove Bank déploie toutes ses charges de travail dans un seul abonnement Azure. L'équipe cloud signale que l'abonnement a atteint une limite qu'Azure fixe par abonnement, et de nouvelles charges de travail doivent encore être déployées.

        Que doit faire Woodgrove Bank ?
    body:
      options:
        - { id: a, text: { en: "Create a management group and deploy the new workloads in it", fr: "Créer un groupe d'administration et y déployer les nouvelles charges" } }
        - { id: b, text: { en: "Create a resource group and deploy the new workloads in it", fr: "Créer un groupe de ressources et y déployer les nouvelles charges" } }
        - { id: c, text: { en: "Move the subscription to a different management group", fr: "Déplacer l'abonnement vers un autre groupe d'administration" } }
        - { id: d, text: { en: "Create an additional subscription for the new workloads", fr: "Créer un abonnement supplémentaire pour les nouvelles charges" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A subscription is a unit of management, billing and scale. Working around the limits that apply per subscription is one of the reasons to create additional subscriptions; the new subscription can trust the same Microsoft Entra tenant as the first one.
        fr: |
          Un abonnement est une unité de gestion, de facturation et de mise à l'échelle. Contourner les limites qui s'appliquent par abonnement est l'une des raisons de créer des abonnements supplémentaires ; le nouvel abonnement peut approuver le même locataire Microsoft Entra que le premier.
      options:
        a: { en: "A management group organizes subscriptions for governance; resources are never deployed directly in it.", fr: "Un groupe d'administration organise des abonnements pour la gouvernance ; on n'y déploie jamais directement de ressources." }
        b: { en: "A new resource group stays inside the same subscription, so the subscription limit still applies to it.", fr: "Un nouveau groupe de ressources reste dans le même abonnement : la limite de l'abonnement s'applique donc toujours." }
        c: { en: "Moving the subscription in the hierarchy changes the policies and roles it inherits, not the limits that apply to it.", fr: "Déplacer l'abonnement dans la hiérarchie change les stratégies et les rôles dont il hérite, pas les limites qui s'appliquent à lui." }
    references:
      - title: Describe Azure management infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure

  # ------------------------------------------------------------------ 5
  - id: az900-qz-21-05
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys creates a public IP address for an application and pins the address to zone 1 of a region that supports availability zones. Tailspin Toys deploys no other copy of the address.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys crée une adresse IP publique pour une application et épingle l'adresse à la zone 1 d'une région qui prend en charge les zones de disponibilité. Tailspin Toys ne déploie aucune autre copie de l'adresse.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The public IP address is a [[cat]] resource.

          If zone 1 fails, [[fail]].
        fr: |
          L'adresse IP publique est une ressource [[cat]].

          Si la zone 1 tombe en panne, [[fail]].
      slots:
        - id: cat
          options:
            - { id: zonal, text: { en: "zonal", fr: "zonale" } }
            - { id: zr, text: { en: "zone-redundant", fr: "redondante interzone" } }
            - { id: nonreg, text: { en: "non-regional", fr: "non régionale" } }
        - id: fail
          options:
            - { id: down, text: { en: "the address is unavailable until zone 1 recovers", fr: "l'adresse est indisponible jusqu'au rétablissement de la zone 1" } }
            - { id: move, text: { en: "Azure moves the address to zone 2 automatically", fr: "Azure déplace automatiquement l'adresse vers la zone 2" } }
            - { id: pair, text: { en: "the address fails over to the paired region", fr: "l'adresse bascule vers la région jumelée" } }
    answer:
      values: { cat: zonal, fail: down }
    explanation:
      correct:
        en: |
          IP addresses, like virtual machines and managed disks, are zonal: you pin the resource to one zone that you choose. A zonal resource depends on its zone, so if zone 1 fails the address is unavailable; to survive the loss of a zone you deploy copies in several zones or use a zone-redundant service, which the platform replicates across zones.
        fr: |
          Les adresses IP, comme les machines virtuelles et les disques managés, sont zonales : vous épinglez la ressource à une zone de votre choix. Une ressource zonale dépend de sa zone : si la zone 1 tombe en panne, l'adresse est indisponible. Pour résister à la perte d'une zone, on déploie des copies dans plusieurs zones ou on utilise un service redondant interzone, que la plateforme réplique entre les zones.
      options:
        cat: { en: "Zone-redundant services are replicated across zones by the platform; non-regional services are always available from Azure geographies. A resource pinned to one zone is neither.", fr: "Les services redondants interzone sont répliqués entre les zones par la plateforme ; les services non régionaux sont toujours disponibles depuis les zones géographiques Azure. Une ressource épinglée à une zone n'est ni l'un ni l'autre." }
        fail: { en: "Azure doesn't move a zonal resource to another zone, and nothing is copied to the paired region unless the customer configures it.", fr: "Azure ne déplace pas une ressource zonale vers une autre zone, et rien n'est copié vers la région jumelée sans configuration par le client." }
    references:
      - title: Describe Azure physical infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure

  # ------------------------------------------------------------------ 6
  - id: az900-qz-21-06
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has two management groups named **MG-Prod** and **MG-Dev**, both directly under the Tenant Root Group. An allowed-locations policy and a Reader role assignment for the audit team are assigned to MG-Prod. A subscription named **Sub1** is in MG-Prod, and a user named User2 has the Contributor role assigned directly on Sub1.

        Contoso moves Sub1 from MG-Prod to MG-Dev.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux groupes d'administration nommés **MG-Prod** et **MG-Dev**, tous deux directement sous le Groupe racine du locataire. Une stratégie d'emplacements autorisés et une attribution du rôle Reader pour l'équipe d'audit sont attribuées à MG-Prod. Un abonnement nommé **Sub1** se trouve dans MG-Prod, et un utilisateur nommé User2 a le rôle Contributor attribué directement sur Sub1.

        Contoso déplace Sub1 de MG-Prod vers MG-Dev.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "After the move, the allowed-locations policy assigned to MG-Prod no longer applies to the resources of Sub1."
            fr: "Après le déplacement, la stratégie d'emplacements autorisés attribuée à MG-Prod ne s'applique plus aux ressources de Sub1."
        - id: s2
          text:
            en: "After the move, the audit team keeps the Reader role on Sub1 that it inherited from MG-Prod."
            fr: "Après le déplacement, l'équipe d'audit conserve le rôle Reader sur Sub1 qu'elle héritait de MG-Prod."
        - id: s3
          text:
            en: "After the move, User2 still has the Contributor role on Sub1."
            fr: "Après le déplacement, User2 a toujours le rôle Contributor sur Sub1."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Policies and role assignments made on a management group are inherited by the subscriptions below it, and each subscription has only one parent. Once Sub1 is under MG-Dev, it inherits from MG-Dev and the Tenant Root Group, and no longer from MG-Prod: the policy and the audit team's Reader role stop applying. The Contributor role assigned on Sub1 itself belongs to the subscription and stays.
        fr: |
          Les stratégies et les attributions de rôles faites sur un groupe d'administration sont héritées par les abonnements situés en dessous, et chaque abonnement n'a qu'un seul parent. Une fois sous MG-Dev, Sub1 hérite de MG-Dev et du Groupe racine du locataire, et plus de MG-Prod : la stratégie et le rôle Reader de l'équipe d'audit cessent de s'appliquer. Le rôle Contributor attribué sur Sub1 elle-même appartient à l'abonnement et reste en place.
      options:
        s2: { en: "Inherited access comes from the current parent: the Reader role assigned to MG-Prod no longer reaches Sub1 once Sub1 is under MG-Dev.", fr: "Un accès hérité vient du parent actuel : le rôle Reader attribué à MG-Prod n'atteint plus Sub1 une fois Sub1 sous MG-Dev." }
    references:
      - title: What are Azure management groups?
        url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview

  # ------------------------------------------------------------------ 7
  - id: az900-qz-21-07
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware deploys a virtual machine named VM1 to zone 1 of an Azure region and a virtual machine named VM2 to zone 2 of the same region.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware déploie une machine virtuelle nommée VM1 dans la zone 1 d'une région Azure et une machine virtuelle nommée VM2 dans la zone 2 de la même région.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "VM1 and VM2 run in physically separate datacenters.", fr: "VM1 et VM2 s'exécutent dans des centres de données physiquement séparés." } }
        - { id: b, text: { en: "Litware chooses which datacenter of zone 1 hosts VM1.", fr: "Litware choisit quel centre de données de la zone 1 héberge VM1." } }
        - { id: c, text: { en: "A cooling failure in the datacenter of VM1 doesn't stop VM2.", fr: "Une panne de refroidissement dans le centre de données de VM1 n'arrête pas VM2." } }
        - { id: d, text: { en: "VM1 and VM2 share one datacenter, in two separate server rooms.", fr: "VM1 et VM2 partagent un centre de données, dans deux salles serveurs séparées." } }
        - { id: e, text: { en: "Zone 1 and zone 2 are the two regions of a region pair.", fr: "La zone 1 et la zone 2 sont les deux régions d'une paire de régions." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Availability zones are physically separate datacenters within one region; each zone is made of one or more datacenters with independent power, cooling and networking. VM1 and VM2 therefore run in different datacenters, and a cooling failure in one zone doesn't stop the virtual machine in the other zone.
        fr: |
          Les zones de disponibilité sont des centres de données physiquement séparés au sein d'une même région ; chaque zone se compose d'un ou de plusieurs centres de données dotés d'une alimentation, d'un refroidissement et d'un réseau indépendants. VM1 et VM2 s'exécutent donc dans des centres de données différents, et une panne de refroidissement dans une zone n'arrête pas la machine virtuelle de l'autre zone.
      options:
        b: { en: "Customers never choose a datacenter: they select a region and, when it supports them, a zone.", fr: "Les clients ne choisissent jamais un centre de données : ils sélectionnent une région et, si elle les prend en charge, une zone." }
        d: { en: "Two zones of a region are never in the same datacenter: each zone is an isolation boundary with its own facilities.", fr: "Deux zones d'une région ne sont jamais dans le même centre de données : chaque zone est une limite d'isolation avec ses propres installations." }
        e: { en: "Zones are inside a single region; a region pair is made of two different regions of the same geography.", fr: "Les zones se trouvent dans une seule région ; une paire de régions est formée de deux régions différentes de la même zone géographique." }
    references:
      - title: Describe Azure physical infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure

  # ------------------------------------------------------------------ 8
  - id: az900-qz-21-08
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware, a consulting firm, deploys solutions for three customers. Each solution has a requirement on where it runs and who operates the datacenters.

        Which Azure region should Proseware use for each solution? To answer, drag a region to each solution. Each region may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, une société de conseil, déploie des solutions pour trois clients. Chaque solution a une exigence sur l'endroit où elle s'exécute et sur qui exploite les centres de données.

        Quelle région Azure Proseware doit-elle utiliser pour chaque solution ? Pour répondre, faites glisser une région vers chaque solution. Chaque région peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: usgov, text: "US Gov Virginia" }
        - { id: china, text: "China East" }
        - { id: fr, text: "France Central" }
        - { id: we, text: "West Europe" }
      targets:
        - id: t1
          text: { en: "A workload of a US government agency that requires datacenters operated by screened US personnel", fr: "Une charge de travail d'une agence gouvernementale américaine qui exige des centres de données exploités par du personnel américain habilité" }
        - id: t2
          text: { en: "An application for users in mainland China, hosted in datacenters that a local partner of Microsoft operates", fr: "Une application pour des utilisateurs en Chine continentale, hébergée dans des centres de données qu'exploite un partenaire local de Microsoft" }
        - id: t3
          text: { en: "A website whose data must stay in France, in datacenters operated by Microsoft", fr: "Un site web dont les données doivent rester en France, dans des centres de données exploités par Microsoft" }
    answer:
      mapping: { t1: usgov, t2: china, t3: fr }
    explanation:
      correct:
        en: |
          US Gov Virginia belongs to Azure Government, a sovereign instance of Azure, isolated from the main instance and operated by screened US personnel for US government agencies and their partners. China East is operated by 21Vianet under a partnership with Microsoft, which doesn't maintain those datacenters directly. France Central is a region of the France geography in the main instance of Azure, operated by Microsoft.
        fr: |
          US Gov Virginia appartient à Azure Government, une instance souveraine d'Azure, isolée de l'instance principale et exploitée par du personnel américain habilité pour les agences gouvernementales américaines et leurs partenaires. China East est exploitée par 21Vianet dans le cadre d'un partenariat avec Microsoft, qui n'entretient pas directement ces centres de données. France Central est une région de la zone géographique France dans l'instance principale d'Azure, exploitée par Microsoft.
      options:
        we: { en: "West Europe is a region of the Europe geography but not in France: it doesn't keep the data in France.", fr: "West Europe est une région de la zone géographique Europe, mais pas en France : elle ne garde pas les données en France." }
    references:
      - title: Describe Azure physical infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
      - title: Azure region pairs and nonpaired regions
        url: https://learn.microsoft.com/en-us/azure/reliability/regions-paired

  # ------------------------------------------------------------------ 9
  - id: az900-qz-21-09
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has the following management group hierarchy: the Tenant Root Group contains **MG-IT**, and MG-IT contains **MG-IT-Dev**. A subscription named **Sub-Dev** is in MG-IT-Dev. A policy that denies the creation of resources outside Europe is assigned to MG-IT. Fabrikam also has a management group named **MG-Finance** under the Tenant Root Group.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de la hiérarchie de groupes d'administration suivante : le Groupe racine du locataire contient **MG-IT**, et MG-IT contient **MG-IT-Dev**. Un abonnement nommé **Sub-Dev** se trouve dans MG-IT-Dev. Une stratégie qui refuse la création de ressources hors d'Europe est attribuée à MG-IT. Fabrikam dispose aussi d'un groupe d'administration nommé **MG-Finance** sous le Groupe racine du locataire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The policy assigned to MG-IT applies to the resources of Sub-Dev, even though Sub-Dev isn't a direct child of MG-IT."
            fr: "La stratégie attribuée à MG-IT s'applique aux ressources de Sub-Dev, même si Sub-Dev n'est pas un enfant direct de MG-IT."
        - id: s2
          text:
            en: "Fabrikam can also make MG-IT-Dev a child of MG-Finance, so that the policies of MG-IT and of MG-Finance both apply to Sub-Dev."
            fr: "Fabrikam peut aussi faire de MG-IT-Dev un enfant de MG-Finance, afin que les stratégies de MG-IT et de MG-Finance s'appliquent toutes deux à Sub-Dev."
        - id: s3
          text:
            en: "A role assigned to a user on the Tenant Root Group gives that user the same role on Sub-Dev."
            fr: "Un rôle attribué à un utilisateur sur le Groupe racine du locataire donne à cet utilisateur le même rôle sur Sub-Dev."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Governance conditions applied to a management group are inherited by everything below it, through all the nested levels: the policy of MG-IT reaches Sub-Dev through MG-IT-Dev, and a role on the Tenant Root Group, the single root of the directory, reaches every subscription. Each management group can have only one parent, so MG-IT-Dev can't sit under MG-IT and MG-Finance at the same time.
        fr: |
          Les conditions de gouvernance appliquées à un groupe d'administration sont héritées par tout ce qui se trouve en dessous, à travers tous les niveaux imbriqués : la stratégie de MG-IT atteint Sub-Dev via MG-IT-Dev, et un rôle sur le Groupe racine du locataire, l'unique racine de l'annuaire, atteint tous les abonnements. Chaque groupe d'administration n'a qu'un seul parent : MG-IT-Dev ne peut donc pas se trouver à la fois sous MG-IT et sous MG-Finance.
      options:
        s2: { en: "A management group has a single parent; moving MG-IT-Dev under MG-Finance would remove it from MG-IT instead of adding a second parent.", fr: "Un groupe d'administration n'a qu'un seul parent ; déplacer MG-IT-Dev sous MG-Finance le retirerait de MG-IT au lieu de lui ajouter un second parent." }
    references:
      - title: What are Azure management groups?
        url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
      - title: Describe Azure management infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure

  # ------------------------------------------------------------------ 10
  - id: az900-qz-21-10
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A subscription contains two resource groups named **RG1** and **RG2**. User1 has the Contributor role on RG1 only, and User2 has the Contributor role on RG2 only. No other role is assigned to them.

        An administrator moves a virtual machine named VM1 from RG1 to RG2.

        Which users can manage VM1 after the move?
      fr: |
        Un abonnement contient deux groupes de ressources nommés **RG1** et **RG2**. User1 a le rôle Contributor sur RG1 uniquement, et User2 a le rôle Contributor sur RG2 uniquement. Aucun autre rôle ne leur est attribué.

        Un administrateur déplace une machine virtuelle nommée VM1 de RG1 vers RG2.

        Quels utilisateurs peuvent gérer VM1 après le déplacement ?
    body:
      options:
        - { id: a, text: { en: "User1 only, because the access to VM1 moves with the virtual machine", fr: "User1 uniquement, car l'accès à VM1 suit la machine virtuelle" } }
        - { id: b, text: { en: "User2 only, because VM1 now gets the access granted on its new group", fr: "User2 uniquement, car VM1 reçoit désormais l'accès accordé sur son nouveau groupe" } }
        - { id: c, text: { en: "User1 and User2, because VM1 now belongs to both resource groups", fr: "User1 et User2, car VM1 appartient désormais aux deux groupes de ressources" } }
        - { id: d, text: { en: "Neither user, until a role is assigned again directly on VM1", fr: "Aucun des deux, tant qu'un rôle n'est pas de nouveau attribué directement sur VM1" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Access granted on a resource group applies to all the resources that the group contains at that moment. A resource belongs to exactly one resource group: once VM1 is in RG2, User2's Contributor role on RG2 covers it, and User1's role on RG1 no longer does.
        fr: |
          Un accès accordé sur un groupe de ressources s'applique à toutes les ressources que le groupe contient à ce moment-là. Une ressource appartient à un seul groupe de ressources : une fois VM1 dans RG2, le rôle Contributor de User2 sur RG2 la couvre, et le rôle de User1 sur RG1 ne la couvre plus.
      options:
        a: { en: "User1's role is assigned on RG1, not on VM1: it covers only what RG1 contains, and VM1 has left RG1.", fr: "Le rôle de User1 est attribué sur RG1, pas sur VM1 : il ne couvre que ce que contient RG1, et VM1 a quitté RG1." }
        c: { en: "A resource is in exactly one resource group at a time; moving it removes it from RG1.", fr: "Une ressource n'est que dans un seul groupe de ressources à la fois ; la déplacer la retire de RG1." }
        d: { en: "No direct assignment is needed: the role assigned on RG2 is inherited by every resource that RG2 contains.", fr: "Aucune attribution directe n'est nécessaire : le rôle attribué sur RG2 est hérité par toutes les ressources que contient RG2." }
    references:
      - title: Describe Azure management infrastructure
        url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
