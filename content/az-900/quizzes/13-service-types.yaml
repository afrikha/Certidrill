chapter: 13-service-types
questions:
  # ------------------------------------------------------------------ 1
  - id: az900-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which cloud service type is the most flexible and gives you the maximum amount of control over your cloud resources?
      fr: |
        Quel type de service cloud est le plus souple et vous donne le plus de contrôle sur vos ressources cloud ?
    body:
      options:
        - { id: a, text: "Software as a service (SaaS)" }
        - { id: b, text: "Infrastructure as a service (IaaS)" }
        - { id: c, text: "Platform as a service (PaaS)" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          IaaS is the most flexible cloud service category: the provider maintains the hardware, the network connectivity and the physical security, and you decide everything else, from the operating system to the applications. This control comes with the most management work.
        fr: |
          IaaS est la catégorie de service cloud la plus souple : le fournisseur entretient le matériel, la connectivité réseau et la sécurité physique, et vous décidez de tout le reste, du système d'exploitation aux applications. Ce contrôle s'accompagne du plus grand travail de gestion.
      options:
        a: { en: "SaaS is the least flexible model: you use a finished application and control only your data, devices and accounts.", fr: "SaaS est le modèle le moins souple : vous utilisez une application finie et ne contrôlez que vos données, vos appareils et vos comptes." }
        c: { en: "PaaS sits in the middle: the provider manages the operating system and the middleware, so you control less than with IaaS.", fr: "PaaS se situe au milieu : le fournisseur gère le système d'exploitation et les intergiciels, vous contrôlez donc moins qu'avec IaaS." }
    references:
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service

  # ------------------------------------------------------------------ 2
  - id: az900-qz-13-02
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Which two of the following offerings are software as a service (SaaS)?

        NOTE: Each correct selection is worth one point.
      fr: |
        Parmi les offres suivantes, quelles sont les deux qui relèvent de SaaS (software as a service) ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Azure Container Apps" }
        - { id: b, text: "Dynamics 365" }
        - { id: c, text: "Azure Disk Storage" }
        - { id: d, text: { en: "Outlook email", fr: "La messagerie Outlook" } }
        - { id: e, text: "Azure Functions" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Dynamics 365 and Outlook email are complete applications that you use as they are: the provider manages everything from the datacenter to the application. They are SaaS offerings, like Microsoft 365.
        fr: |
          Dynamics 365 et la messagerie Outlook sont des applications complètes que vous utilisez telles quelles : le fournisseur gère tout, du centre de données à l'application. Ce sont des offres SaaS, comme Microsoft 365.
      options:
        a: { en: "Azure Container Apps runs your own containerized code on a managed platform: it is PaaS.", fr: "Azure Container Apps exécute votre propre code en conteneurs sur une plateforme managée : c'est du PaaS." }
        c: { en: "Azure Disk Storage provides disks for virtual machines that you manage: it is IaaS.", fr: "Le Stockage sur disque Azure fournit des disques à des machines virtuelles que vous gérez : c'est de l'IaaS." }
        e: { en: "Azure Functions runs code that you write, without servers to manage: it is classified as PaaS.", fr: "Azure Functions exécute du code que vous écrivez, sans serveur à gérer : il est classé dans PaaS." }
    references:
      - title: Describe Software as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service

  # ------------------------------------------------------------------ 3
  - id: az900-qz-13-03
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso's developers build a new application on Azure App Service and Azure SQL Database. Before the launch, a security review lists the tasks that Contoso must keep doing itself.

        Which task belongs on this list?
      fr: |
        Les développeurs de Contoso créent une nouvelle application sur Azure App Service et Azure SQL Database. Avant le lancement, une revue de sécurité liste les tâches que Contoso doit continuer à assurer elle-même.

        Quelle tâche fait partie de cette liste ?
    body:
      options:
        - { id: a, text: { en: "Applying the security patches of the database engine", fr: "Appliquer les correctifs de sécurité du moteur de base de données" } }
        - { id: b, text: { en: "Controlling which users can access the application and its data", fr: "Contrôler quels utilisateurs peuvent accéder à l'application et à ses données" } }
        - { id: c, text: { en: "Updating the operating system of the servers that run the app", fr: "Mettre à jour le système d'exploitation des serveurs qui exécutent l'application" } }
        - { id: d, text: { en: "Maintaining the middleware and the runtime that the app uses", fr: "Entretenir les intergiciels et le runtime qu'utilise l'application" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          App Service and SQL Database are PaaS services. In PaaS, the provider manages the physical infrastructure and the platform components (operating systems, middleware, managed runtimes), and the customer focuses on its application code, its data and the access controls. Deciding who can access the application and its data therefore stays with Contoso.
        fr: |
          App Service et SQL Database sont des services PaaS. En PaaS, le fournisseur gère l'infrastructure physique et les composants de la plateforme (systèmes d'exploitation, intergiciels, runtimes managés), et le client se concentre sur le code de son application, ses données et les contrôles d'accès. Décider qui peut accéder à l'application et à ses données reste donc à la charge de Contoso.
      options:
        a: { en: "With a PaaS database, you don't have to worry about patching the database software: Microsoft handles it.", fr: "Avec une base de données PaaS, vous n'avez pas à vous soucier des correctifs du logiciel de base de données : Microsoft s'en charge." }
        c: { en: "The operating system is a platform component that the provider maintains in PaaS.", fr: "Le système d'exploitation est un composant de la plateforme que le fournisseur entretient en PaaS." }
        d: { en: "Middleware and managed runtimes are also maintained by the provider in PaaS.", fr: "Les intergiciels et les runtimes managés sont eux aussi entretenus par le fournisseur en PaaS." }
    references:
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service

  # ------------------------------------------------------------------ 4
  - id: az900-qz-13-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has two new needs. Its developers must run a small piece of code each time an order is placed, without managing any server and with billing per execution. Its sales team wants a customer relationship management (CRM) application that works in a web browser, with nothing to install or maintain.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a deux nouveaux besoins. Ses développeurs doivent exécuter un petit morceau de code à chaque commande passée, sans gérer aucun serveur et avec une facturation à l'exécution. Son équipe commerciale veut une application de gestion de la relation client (CRM) qui fonctionne dans un navigateur web, sans rien à installer ni à entretenir.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The order-processing code is a [[code]] scenario.

          The CRM application is a [[crm]] scenario.
        fr: |
          Le code de traitement des commandes est un scénario [[code]].

          L'application CRM est un scénario [[crm]].
      slots:
        - id: code
          options:
            - { id: iaas, text: "IaaS" }
            - { id: paas, text: "PaaS" }
            - { id: saas, text: "SaaS" }
        - id: crm
          options:
            - { id: iaas, text: "IaaS" }
            - { id: paas, text: "PaaS" }
            - { id: saas, text: "SaaS" }
    answer:
      values: { code: paas, crm: saas }
    explanation:
      correct:
        en: |
          Running your own code without managing servers and paying per execution is a serverless offering such as Azure Functions, which is classified as PaaS: Fabrikam still writes and owns the code. A ready-to-use CRM application that the provider runs and maintains is SaaS, like Dynamics 365.
        fr: |
          Exécuter son propre code sans gérer de serveurs, avec une facturation à l'exécution, correspond à une offre serverless comme Azure Functions, classée dans PaaS : Fabrikam écrit toujours le code et en reste propriétaire. Une application CRM prête à l'emploi que le fournisseur exécute et entretient relève de SaaS, comme Dynamics 365.
      options:
        code: { en: "SaaS is wrong for the code: SaaS delivers a finished application, not a platform that runs Fabrikam's own code. IaaS would require managing virtual machines.", fr: "SaaS ne convient pas pour le code : SaaS fournit une application finie, pas une plateforme qui exécute le code de Fabrikam. IaaS imposerait de gérer des machines virtuelles." }
        crm: { en: "PaaS would mean developing or deploying the CRM application yourself; IaaS would add servers to install and maintain.", fr: "PaaS impliquerait de développer ou de déployer soi-même l'application CRM ; IaaS ajouterait des serveurs à installer et à entretenir." }
    references:
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
      - title: Describe Software as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service

  # ------------------------------------------------------------------ 5
  - id: az900-qz-13-05
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum builds its development and test environments on Azure virtual machines connected to an Azure virtual network. The team installs its own tools and database software on the virtual machines, starts the environments every morning and shuts them down every evening.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum crée ses environnements de développement et de test sur des machines virtuelles Azure connectées à un réseau virtuel Azure. L'équipe installe ses propres outils et son logiciel de base de données sur les machines virtuelles, démarre les environnements chaque matin et les arrête chaque soir.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "Adatum is responsible for configuring the network settings of the virtual machines and of the virtual network."
            fr: "Adatum est responsable de la configuration réseau des machines virtuelles et du réseau virtuel."
        - id: s2
          text:
            en: "Microsoft configures the database software that Adatum installs on the virtual machines."
            fr: "Microsoft configure le logiciel de base de données qu'Adatum installe sur les machines virtuelles."
        - id: s3
          text:
            en: "Adatum keeps complete control over the configuration of each environment, including its operating system."
            fr: "Adatum garde un contrôle complet sur la configuration de chaque environnement, système d'exploitation compris."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Virtual machines and virtual networks are IaaS. In IaaS, the provider maintains the hardware, the connectivity to the internet and the physical security; the customer handles the operating system, the network configuration and the database and storage configuration. Test and development environments that start and stop quickly while the team keeps complete control are a typical IaaS scenario.
        fr: |
          Les machines virtuelles et les réseaux virtuels relèvent d'IaaS. En IaaS, le fournisseur entretient le matériel, la connexion à internet et la sécurité physique ; le client gère le système d'exploitation, la configuration réseau et la configuration des bases de données et du stockage. Des environnements de test et de développement qu'on démarre et arrête rapidement en gardant un contrôle complet sont un scénario IaaS typique.
      options:
        s2: { en: "Software that Adatum installs on its own virtual machines stays Adatum's to configure and maintain.", fr: "Un logiciel qu'Adatum installe sur ses propres machines virtuelles reste à configurer et à entretenir par Adatum." }
    references:
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service

  # ------------------------------------------------------------------ 6
  - id: az900-qz-13-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs an inventory application on Azure virtual machines. A reporting component of the application depends on a third-party program that the team installs with administrator rights in the operating system of each server.

        To stop patching servers, the team proposes to move the application to Azure App Service.

        What is the main drawback of this proposal?
      fr: |
        Northwind Traders exécute une application de gestion des stocks sur des machines virtuelles Azure. Un composant de reporting de l'application dépend d'un programme tiers que l'équipe installe avec des droits d'administrateur dans le système d'exploitation de chaque serveur.

        Pour ne plus appliquer de correctifs aux serveurs, l'équipe propose de déplacer l'application vers Azure App Service.

        Quel est le principal inconvénient de cette proposition ?
    body:
      options:
        - { id: a, text: { en: "Northwind would lose the operating system access that the third-party program needs.", fr: "Northwind perdrait l'accès au système d'exploitation dont le programme tiers a besoin." } }
        - { id: b, text: { en: "Northwind would still patch the operating system of the App Service servers.", fr: "Northwind appliquerait toujours les correctifs du système d'exploitation des serveurs App Service." } }
        - { id: c, text: { en: "Northwind would hand the responsibility for the inventory data to Microsoft.", fr: "Northwind transférerait à Microsoft la responsabilité des données de stock." } }
        - { id: d, text: { en: "Northwind would have to replace the application with a SaaS inventory product.", fr: "Northwind devrait remplacer l'application par un produit de gestion des stocks SaaS." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          App Service is PaaS: the provider manages the operating system, so Northwind would no longer patch it, but it would also no longer control it. Software that must be installed with administrator rights in the operating system needs IaaS, which is why the trade-off of PaaS is less control in exchange for less maintenance.
        fr: |
          App Service relève de PaaS : le fournisseur gère le système d'exploitation, Northwind n'y appliquerait donc plus de correctifs, mais ne le contrôlerait plus non plus. Un logiciel qui doit être installé avec des droits d'administrateur dans le système d'exploitation exige IaaS : le compromis de PaaS est moins de contrôle en échange de moins de maintenance.
      options:
        b: { en: "Patching the operating system is exactly what the provider takes over in PaaS; it is the benefit of the proposal, not a drawback.", fr: "Les correctifs du système d'exploitation sont justement ce que le fournisseur prend en charge en PaaS : c'est l'avantage de la proposition, pas un inconvénient." }
        c: { en: "The customer stays responsible for its data in every service type, PaaS included.", fr: "Le client reste responsable de ses données dans tous les types de service, PaaS compris." }
        d: { en: "App Service hosts Northwind's own application code; moving to PaaS doesn't require buying a ready-made SaaS product.", fr: "App Service héberge le code de l'application de Northwind ; passer à PaaS n'impose pas d'acheter un produit SaaS tout fait." }
    references:
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service

  # ------------------------------------------------------------------ 7
  - id: az900-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys replaces the email servers of its own datacenter with Outlook email in Microsoft 365. The existing mailboxes of the 300 employees are moved to the new service, and the IT team that used to run the email servers is assigned to other projects.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys remplace les serveurs de messagerie de son propre centre de données par la messagerie Outlook de Microsoft 365. Les boîtes aux lettres existantes des 300 employés sont déplacées vers le nouveau service, et l'équipe informatique qui exploitait les serveurs de messagerie est affectée à d'autres projets.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "After the move, Wingtip Toys no longer installs the updates of the email application."
            fr: "Après le déplacement, Wingtip Toys n'installe plus les mises à jour de l'application de messagerie."
        - id: s2
          text:
            en: "Wingtip Toys can choose the operating system version of the servers that host its mailboxes."
            fr: "Wingtip Toys peut choisir la version du système d'exploitation des serveurs qui hébergent ses boîtes aux lettres."
        - id: s3
          text:
            en: "Microsoft becomes responsible for governing the email content that the employees store, such as deciding which messages are sensitive."
            fr: "Microsoft devient responsable de la gouvernance du contenu des e-mails que les employés stockent, par exemple pour décider quels messages sont sensibles."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Microsoft 365 is SaaS: the provider manages almost the whole stack, including the infrastructure, the platform and the application updates, so Wingtip Toys no longer updates the email application and has no say on the servers or their operating system. The customer still manages its data, identities and access, and device posture: governing the email content stays with Wingtip Toys.
        fr: |
          Microsoft 365 relève de SaaS : le fournisseur gère presque toute la pile, y compris l'infrastructure, la plateforme et les mises à jour de l'application ; Wingtip Toys ne met donc plus à jour l'application de messagerie et n'a pas la main sur les serveurs ni sur leur système d'exploitation. Le client gère toujours ses données, ses identités et accès et la sécurité de ses appareils : la gouvernance du contenu des e-mails reste à la charge de Wingtip Toys.
      options:
        s2: { en: "In SaaS, the servers and their operating system are part of what the provider manages; the customer doesn't choose them.", fr: "En SaaS, les serveurs et leur système d'exploitation font partie de ce que gère le fournisseur ; le client ne les choisit pas." }
        s3: { en: "Data stays the customer's responsibility in every service type; in SaaS the customer focuses on data governance, onboarding and access controls.", fr: "Les données restent de la responsabilité du client dans tous les types de service ; en SaaS, le client se concentre sur la gouvernance des données, l'intégration des utilisateurs et les contrôles d'accès." }
    references:
      - title: Describe Software as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
      - title: Shared responsibility in the cloud
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility

  # ------------------------------------------------------------------ 8
  - id: az900-qz-13-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware plans four workloads. For each workload, Litware wants the service type that meets the requirement with the least administrative effort.

        Which service type should Litware choose for each workload? To answer, drag a service type to each workload. A service type may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware prévoit quatre charges de travail. Pour chacune, Litware veut le type de service qui répond au besoin avec un minimum d'effort administratif.

        Quel type de service Litware doit-elle choisir pour chaque charge de travail ? Pour répondre, faites glisser un type de service vers chaque charge de travail. Un type de service peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: iaas, text: "IaaS" }
        - { id: paas, text: "PaaS" }
        - { id: saas, text: "SaaS" }
      targets:
        - id: t1
          text: { en: "An order-tracking API written by Litware's developers, who deploy a new version every week", fr: "Une API de suivi des commandes écrite par les développeurs de Litware, qui en déploient une nouvelle version chaque semaine" }
        - id: t2
          text: { en: "A purchased accounting program whose vendor supports it only on a Windows Server version and settings that Litware configures", fr: "Un logiciel de comptabilité acheté, que l'éditeur ne prend en charge que sur une version et des paramètres de Windows Server configurés par Litware" }
        - id: t3
          text: { en: "Team chat and online meetings for all employees, available next week", fr: "Une messagerie d'équipe et des réunions en ligne pour tous les employés, disponibles la semaine prochaine" }
        - id: t4
          text: { en: "A nightly job that resizes uploaded images, billed only while it runs", fr: "Un traitement nocturne qui redimensionne les images chargées, facturé uniquement pendant son exécution" }
    answer:
      mapping: { t1: paas, t2: iaas, t3: saas, t4: paas }
    explanation:
      correct:
        en: |
          Code that Litware writes and deploys belongs on PaaS: the provider runs the platform and Litware only brings the code, which is less work than IaaS. A program that needs a specific operating system configuration requires IaaS, the only type that gives control of the operating system. A ready-made collaboration application is SaaS. A job billed only while it runs is a serverless offering such as Azure Functions, classified as PaaS.
        fr: |
          Du code que Litware écrit et déploie relève de PaaS : le fournisseur exploite la plateforme et Litware n'apporte que le code, ce qui demande moins de travail qu'IaaS. Un logiciel qui exige une configuration précise du système d'exploitation impose IaaS, seul type qui donne le contrôle du système d'exploitation. Une application de collaboration toute faite relève de SaaS. Un traitement facturé uniquement pendant son exécution est une offre serverless comme Azure Functions, classée dans PaaS.
      options:
        t1: { en: "SaaS needs the least effort in general, but it delivers someone else's finished application: it can't host Litware's own API.", fr: "SaaS demande en général le moins d'effort, mais il fournit l'application finie d'un autre : il ne peut pas héberger l'API de Litware." }
        t2: { en: "PaaS manages the operating system for you, so it can't meet a requirement on the Windows Server version and settings.", fr: "PaaS gère le système d'exploitation à votre place : il ne peut donc pas répondre à une exigence sur la version et les paramètres de Windows Server." }
        t4: { en: "Serverless isn't a fourth service type: offerings billed per execution, such as Azure Functions, are classified as PaaS.", fr: "Le serverless n'est pas un quatrième type de service : les offres facturées à l'exécution, comme Azure Functions, sont classées dans PaaS." }
    references:
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service

  # ------------------------------------------------------------------ 9
  - id: az900-qz-13-09
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys hesitates between IaaS and PaaS to host its applications in Azure.

        Which two requirements can be met with IaaS but not with PaaS?

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys hésite entre IaaS et PaaS pour héberger ses applications dans Azure.

        Quelles sont les deux exigences qui peuvent être satisfaites avec IaaS, mais pas avec PaaS ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Install software that requires administrator access to the operating system", fr: "Installer un logiciel qui exige un accès administrateur au système d'exploitation" } }
        - { id: b, text: { en: "Stop managing the licenses and the patches of the operating system", fr: "Ne plus gérer les licences et les correctifs du système d'exploitation" } }
        - { id: c, text: { en: "Move existing servers to Azure without changing their configuration", fr: "Déplacer des serveurs existants vers Azure sans modifier leur configuration" } }
        - { id: d, text: { en: "Keep control of who can access the data that the applications store", fr: "Garder le contrôle de qui accède aux données que stockent les applications" } }
        - { id: e, text: { en: "Scale the resources up or down and pay only for what is used", fr: "Augmenter ou réduire les ressources et ne payer que ce qui est utilisé" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Only IaaS gives the customer control of the operating system, which software installed with administrator rights requires. A lift-and-shift migration, which rebuilds the same servers in the cloud and moves the workloads as they are, is also an IaaS scenario: PaaS runs your code on a platform that the provider manages, not your existing servers.
        fr: |
          Seul IaaS donne au client le contrôle du système d'exploitation, qu'exige un logiciel installé avec des droits d'administrateur. Une migration lift-and-shift, qui reconstruit les mêmes serveurs dans le cloud et y déplace les charges telles quelles, est aussi un scénario IaaS : PaaS exécute votre code sur une plateforme gérée par le fournisseur, pas vos serveurs existants.
      options:
        b: { en: "This is the opposite: PaaS removes the operating system licensing and patching, while IaaS leaves them to the customer.", fr: "C'est l'inverse : PaaS supprime la gestion des licences et des correctifs du système d'exploitation, alors qu'IaaS la laisse au client." }
        d: { en: "Both models meet it: the customer keeps the responsibility for data and access in every service type.", fr: "Les deux modèles y répondent : le client garde la responsabilité des données et des accès dans tous les types de service." }
        e: { en: "Both models meet it: elastic scaling and consumption-based billing are cloud benefits common to IaaS and PaaS.", fr: "Les deux modèles y répondent : la mise à l'échelle élastique et la facturation à la consommation sont des avantages du cloud communs à IaaS et PaaS." }
    references:
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service

  # ------------------------------------------------------------------ 10
  - id: az900-qz-13-10
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware runs App1, a web application developed in-house, on servers in its own datacenter. Proseware plans two phases:

        - Phase 1: move App1 to Azure within one month, without changing its code or the configuration of its servers.
        - Phase 2: keep App1, but stop managing operating systems and middleware, while the developers keep deploying new versions of App1.

        Which cloud service type should Proseware use in each phase?
      fr: |
        Proseware exécute App1, une application web développée en interne, sur des serveurs de son propre centre de données. Proseware prévoit deux phases :

        - Phase 1 : déplacer App1 vers Azure en un mois, sans modifier son code ni la configuration de ses serveurs.
        - Phase 2 : conserver App1, mais ne plus gérer de systèmes d'exploitation ni d'intergiciels, tandis que les développeurs continuent de déployer de nouvelles versions d'App1.

        Quel type de service cloud Proseware doit-elle utiliser à chaque phase ?
    body:
      options:
        - { id: a, text: { en: "Phase 1: PaaS; phase 2: SaaS", fr: "Phase 1 : PaaS ; phase 2 : SaaS" } }
        - { id: b, text: { en: "Phase 1: IaaS; phase 2: SaaS", fr: "Phase 1 : IaaS ; phase 2 : SaaS" } }
        - { id: c, text: { en: "Phase 1: IaaS; phase 2: PaaS", fr: "Phase 1 : IaaS ; phase 2 : PaaS" } }
        - { id: d, text: { en: "Phase 1: PaaS; phase 2: IaaS", fr: "Phase 1 : PaaS ; phase 2 : IaaS" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Moving servers as they are, without code or configuration changes, is a lift-and-shift migration: IaaS. Keeping a custom application while the provider manages the operating systems and middleware, and the developers keep deploying their code, is PaaS. SaaS also removes the operating system work, but it replaces App1 with someone else's finished application instead of hosting App1.
        fr: |
          Déplacer des serveurs tels quels, sans modification du code ni de la configuration, est une migration lift-and-shift : IaaS. Conserver une application personnalisée pendant que le fournisseur gère les systèmes d'exploitation et les intergiciels, et que les développeurs continuent de déployer leur code, relève de PaaS. SaaS supprime aussi le travail sur le système d'exploitation, mais il remplace App1 par l'application finie d'un autre au lieu d'héberger App1.
      options:
        a: { en: "PaaS can't take the servers as they are in phase 1, and SaaS can't host App1, which Proseware keeps in phase 2.", fr: "PaaS ne peut pas reprendre les serveurs tels quels en phase 1, et SaaS ne peut pas héberger App1, que Proseware conserve en phase 2." }
        b: { en: "Phase 1 is right, but SaaS would replace App1 with a finished application, while Proseware keeps App1 and deploys new versions.", fr: "La phase 1 est juste, mais SaaS remplacerait App1 par une application finie, alors que Proseware conserve App1 et en déploie de nouvelles versions." }
        d: { en: "The phases are reversed: PaaS requires the application to be deployed to the platform, and IaaS keeps the operating system work.", fr: "Les phases sont inversées : PaaS exige de déployer l'application sur la plateforme, et IaaS conserve le travail sur le système d'exploitation." }
    references:
      - title: Describe Infrastructure as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
      - title: Describe Platform as a Service
        url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
