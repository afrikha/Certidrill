id: az900-3c-mon-webapp-alert
objective: "3.4.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys runs a web application on servers in its own datacenter. The company wants to follow the response times and the failed requests of the application from Azure. The support team must receive an email when the number of failed requests exceeds a threshold.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute une application web sur des serveurs de son propre centre de données. L'entreprise veut suivre depuis Azure les temps de réponse et les requêtes en échec de l'application. L'équipe de support doit recevoir un e-mail quand le nombre de requêtes en échec dépasse un seuil.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To collect the telemetry of the application, use [[collect]].

      To notify the support team, create [[notify]].
    fr: |
      Pour collecter la télémétrie de l'application, utilisez [[collect]].

      Pour notifier l'équipe de support, créez [[notify]].
  slots:
    - id: collect
      options:
        - { id: rh, text: Resource Health }
        - { id: adv, text: Azure Advisor }
        - { id: ai, text: Application Insights }
        - { id: sh, text: Azure Service Health }
    - id: notify
      options:
        - { id: sha, text: { en: "a Service Health alert", fr: "une alerte Service Health" } }
        - { id: ama, text: { en: "an Azure Monitor alert", fr: "une alerte Azure Monitor" } }
        - { id: rec, text: { en: "an Azure Advisor recommendation", fr: "une recommandation Azure Advisor" } }
answer:
  values: { collect: ai, notify: ama }
explanation:
  correct:
    en: "Application Insights monitors web applications wherever they run, including on-premises, and tracks response times and failure rates. An Azure Monitor alert fires when a condition that you define on the collected data is met, and its action group sends the email to the support team."
    fr: "Application Insights surveille les applications web où qu'elles s'exécutent, y compris en local, et suit les temps de réponse et les taux d'échec. Une alerte Azure Monitor se déclenche quand une condition que vous définissez sur les données collectées est remplie, et son groupe d'actions envoie l'e-mail à l'équipe de support."
  options:
    rh:
      en: "Resource Health reports the availability of Azure resources; it does not collect the telemetry of an application."
      fr: "Resource Health rend compte de la disponibilité des ressources Azure ; il ne collecte pas la télémétrie d'une application."
    sha:
      en: "A Service Health alert concerns issues and maintenance of the Azure platform, not the failed requests of your application."
      fr: "Une alerte Service Health concerne les problèmes et la maintenance de la plateforme Azure, pas les requêtes en échec de votre application."
    rec:
      en: "An Advisor recommendation proposes an improvement; it is not a notification based on a threshold."
      fr: "Une recommandation Advisor propose une amélioration ; ce n'est pas une notification fondée sur un seuil."
references:
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
  - title: What are Azure Monitor alerts?
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
