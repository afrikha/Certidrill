id: az900-3b-arc-tags-scope
objective: "3.3.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum has the machines shown in the following table.

    | Name | Location | Azure Arc |
    | --- | --- | --- |
    | VM1 | West Europe Azure region | Not applicable |
    | Server1 | On-premises datacenter | Connected |
    | Server2 | On-premises datacenter | Not connected |

    Adatum wants to place its machines in Azure resource groups and to apply Azure tags to them.

    Which machines can Adatum organize this way?
  fr: |
    Adatum possède les machines indiquées dans le tableau suivant.

    | Nom | Emplacement | Azure Arc |
    | --- | --- | --- |
    | VM1 | Région Azure West Europe | Sans objet |
    | Server1 | Centre de données local | Connecté |
    | Server2 | Centre de données local | Non connecté |

    Adatum souhaite placer ses machines dans des groupes de ressources Azure et leur appliquer des étiquettes Azure.

    Quelles machines Adatum peut-elle organiser ainsi ?
body:
  options:
    - { id: a, text: { en: "VM1 only", fr: "VM1 uniquement" } }
    - { id: b, text: { en: "Server1 only", fr: "Server1 uniquement" } }
    - { id: c, text: { en: "VM1 and Server1 only", fr: "VM1 et Server1 uniquement" } }
    - { id: d, text: { en: "VM1, Server1, and Server2", fr: "VM1, Server1 et Server2" } }
answer: { optionId: c }
explanation:
  correct:
    en: "VM1 is a native Azure resource. Server1 is connected through Azure Arc, so it is projected into Azure Resource Manager: it has a resource ID, belongs to a resource group and accepts tags like any Azure resource. Server2 is not connected, so Azure does not know it and cannot organize it."
    fr: "VM1 est une ressource Azure native. Server1 est connecté par Azure Arc : il est donc projeté dans Azure Resource Manager, possède un ID de ressource, appartient à un groupe de ressources et accepte des étiquettes comme toute ressource Azure. Server2 n'est pas connecté : Azure ne le connaît pas et ne peut pas l'organiser."
  options:
    a:
      en: "Server1 is also eligible: a machine connected through Azure Arc is represented as a resource in a resource group."
      fr: "Server1 est aussi concerné : une machine connectée par Azure Arc est représentée comme une ressource dans un groupe de ressources."
    b:
      en: "VM1 is an Azure virtual machine: it is in a resource group and accepts tags without Azure Arc."
      fr: "VM1 est une machine virtuelle Azure : elle se trouve dans un groupe de ressources et accepte des étiquettes sans Azure Arc."
    d:
      en: "Server2 is not connected to Azure Arc, so it has no representation in Azure."
      fr: "Server2 n'est pas connecté à Azure Arc : il n'a donc aucune représentation dans Azure."
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
