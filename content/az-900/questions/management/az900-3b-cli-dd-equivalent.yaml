id: az900-3b-cli-dd-equivalent
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure PowerShell and the Azure CLI [[equiv]].

      To choose between them, a team mainly considers [[crit]].
    fr: |
      Azure PowerShell et Azure CLI [[equiv]].

      Pour choisir entre les deux, une équipe considère surtout [[crit]].
  slots:
    - id: equiv
      options:
        - { id: types, text: { en: "manage different types of Azure resources", fr: "gèrent des types de ressources Azure différents" } }
        - { id: os, text: { en: "run on different operating systems", fr: "fonctionnent sur des systèmes d'exploitation différents" } }
        - { id: same, text: { en: "offer equivalent capabilities with a different command syntax", fr: "offrent des capacités équivalentes avec une syntaxe de commande différente" } }
    - id: crit
      options:
        - { id: lang, text: { en: "the command language that it knows best", fr: "le langage de commande qu'elle connaît le mieux" } }
        - { id: region, text: { en: "the Azure region of its resources", fr: "la région Azure de ses ressources" } }
        - { id: offer, text: { en: "the type of its Azure subscription", fr: "le type de son abonnement Azure" } }
answer:
  values: { equiv: same, crit: lang }
explanation:
  correct:
    en: "The Azure CLI is functionally equivalent to Azure PowerShell; the primary difference is the syntax of the commands (PowerShell cmdlets on one side, Bash-style commands on the other). Both install on Windows, Linux and macOS and are available in Cloud Shell, so the choice comes down to the language that the team is most familiar with."
    fr: "Azure CLI est fonctionnellement équivalent à Azure PowerShell ; la principale différence est la syntaxe des commandes (cmdlets PowerShell d'un côté, commandes de style Bash de l'autre). Tous deux s'installent sous Windows, Linux et macOS et sont disponibles dans Cloud Shell : le choix revient donc au langage que l'équipe maîtrise le mieux."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
