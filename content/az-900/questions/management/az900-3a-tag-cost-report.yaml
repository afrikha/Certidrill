id: az900-3a-tag-cost-report
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The resources of the marketing department of Litware are spread across several resource groups and subscriptions. Litware wants to group these resources in cost reports without moving them.

    What should Litware use?
  fr: |
    Les ressources du service marketing de Litware sont réparties dans plusieurs groupes de ressources et abonnements. Litware veut regrouper ces ressources dans les rapports de coûts sans les déplacer.

    Que doit utiliser Litware ?
body:
  options:
    - id: a
      text: { en: "Tags", fr: "Des étiquettes" }
    - id: b
      text: { en: "Resource locks", fr: "Des verrous de ressources" }
    - id: c
      text: { en: "Management groups", fr: "Des groupes d'administration" }
    - id: d
      text: { en: "Budgets", fr: "Des budgets" }
answer: { optionId: a }
explanation:
  correct:
    en: Tags are metadata attached to resources, independent of the resource group and subscription structure. A tag such as Department = Marketing on each resource lets Litware group the resources to report on costs, wherever they are.
    fr: "Les étiquettes sont des métadonnées attachées aux ressources, indépendantes de la structure des groupes de ressources et des abonnements. Une étiquette comme Department = Marketing sur chaque ressource permet à Litware de regrouper les ressources pour rendre compte des coûts, où qu'elles se trouvent."
  options:
    b:
      en: Resource locks protect against accidental deletion or modification; they don't classify resources.
      fr: "Les verrous de ressources protègent contre la suppression ou la modification accidentelle ; ils ne classent pas les ressources."
    c:
      en: Management groups organize whole subscriptions; they can't isolate the marketing resources that share a subscription with other departments.
      fr: "Les groupes d'administration organisent des abonnements entiers ; ils ne peuvent pas isoler les ressources du marketing qui partagent un abonnement avec d'autres services."
    d:
      en: A budget follows spending against a limit for a scope; it doesn't identify which resources belong to a department.
      fr: "Un budget suit les dépenses par rapport à une limite pour une étendue ; il n'indique pas quelles ressources appartiennent à un service."
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
