id: az900-3c-adv-sentence
objective: "3.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Advisor evaluates your Azure resources and provides [[what]]. They are grouped into five categories: reliability, security, performance, operational excellence and [[cat]].
    fr: |
      Azure Advisor évalue vos ressources Azure et fournit [[what]]. Elles sont regroupées en cinq catégories : fiabilité, sécurité, performances, excellence opérationnelle et [[cat]].
  slots:
    - id: what
      options:
        - { id: out, text: { en: "service outage notifications", fr: "des notifications de pannes de service" } }
        - { id: rec, text: { en: "personalized recommendations", fr: "des recommandations personnalisées" } }
        - { id: log, text: { en: "log query results", fr: "des réponses à vos requêtes de journal" } }
    - id: cat
      options:
        - { id: comp, text: { en: "compliance", fr: "conformité" } }
        - { id: ident, text: { en: "identity", fr: "identité" } }
        - { id: net, text: { en: "networking", fr: "mise en réseau" } }
        - { id: cost, text: { en: "cost", fr: "coût" } }
answer:
  values: { what: rec, cat: cost }
explanation:
  correct:
    en: "Azure Advisor makes personalized recommendations based on the configuration and usage of your resources. Its five categories are reliability, security, performance, operational excellence and cost."
    fr: "Azure Advisor formule des recommandations personnalisées à partir de la configuration et de l'utilisation de vos ressources. Ses cinq catégories sont la fiabilité, la sécurité, les performances, l'excellence opérationnelle et le coût."
  options:
    out:
      en: "Notifications about service outages come from Azure Service Health."
      fr: "Les notifications de pannes de service proviennent d'Azure Service Health."
    log:
      en: "Log queries are run in Log Analytics, a tool of Azure Monitor."
      fr: "Les requêtes de journal s'exécutent dans Log Analytics, un outil d'Azure Monitor."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
