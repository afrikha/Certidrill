id: az900-3a-cost-vm-states-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A company wants to reduce the cost of Azure virtual machines that are used only occasionally.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise veut réduire le coût de machines virtuelles Azure qui ne sont utilisées qu'occasionnellement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Shutting down a virtual machine from inside its operating system, without deallocating it, stops the compute charges for the virtual machine.
        fr: Arrêter une machine virtuelle depuis son système d'exploitation, sans la libérer, met fin aux frais de calcul de la machine virtuelle.
    - id: s2
      text:
        en: A deallocated virtual machine continues to incur charges for its disks.
        fr: Une machine virtuelle libérée continue de générer des frais pour ses disques.
    - id: s3
      text:
        en: After a virtual machine is deleted, disks that were created with it can remain and continue to be billed.
        fr: Après la suppression d'une machine virtuelle, des disques créés avec elle peuvent subsister et rester facturés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A virtual machine that is stopped but still allocated keeps its hardware reserved and is billed for compute; only the deallocated state releases the hardware and ends the compute charges. Disks are separate resources and stay billed while the machine is deallocated. Deleting a virtual machine may not remove the storage and network resources that were provisioned with it, which is why unused resources must be tracked and removed.
    fr: "Une machine virtuelle arrêtée mais toujours allouée garde son matériel réservé et reste facturée pour le calcul ; seul l'état libéré rend le matériel et met fin aux frais de calcul. Les disques sont des ressources distinctes et restent facturés pendant que la machine est libérée. La suppression d'une machine virtuelle peut ne pas supprimer les ressources de stockage et de réseau approvisionnées avec elle : c'est pourquoi il faut repérer et supprimer les ressources inutilisées."
  options:
    s1:
      en: The Stopped (Allocated) state is billed; the virtual machine must be deallocated to end the compute charges.
      fr: "L'état arrêté (alloué) est facturé ; il faut libérer la machine virtuelle pour mettre fin aux frais de calcul."
references:
  - title: States and billing status of Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
