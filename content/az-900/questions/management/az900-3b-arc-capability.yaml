id: az900-3b-arc-capability
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam connects its on-premises servers to Azure by using Azure Arc.

    What can Fabrikam now do with these servers?
  fr: |
    Fabrikam connecte ses serveurs locaux à Azure à l'aide d'Azure Arc.

    Que peut désormais faire Fabrikam avec ces serveurs ?
body:
  options:
    - { id: a, text: { en: "Protect them from a datacenter failure by using availability zones", fr: "Les protéger d'une panne de centre de données grâce aux zones de disponibilité" } }
    - { id: b, text: { en: "Audit their configuration by using Azure Policy", fr: "Auditer leur configuration à l'aide d'Azure Policy" } }
    - { id: c, text: { en: "Reduce the cost of their hardware by using Azure Reservations", fr: "Réduire le coût de leur matériel grâce aux réservations Azure" } }
    - { id: d, text: { en: "Scale them out automatically by using virtual machine scale sets", fr: "Les faire monter en charge automatiquement grâce aux groupes de machines virtuelles identiques" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Arc extends Azure governance and management to machines that run outside Azure. Once connected, a server is represented as an Azure resource, and services such as Azure Policy can audit the settings inside the machine."
    fr: "Azure Arc étend la gouvernance et la gestion d'Azure aux machines qui s'exécutent hors d'Azure. Une fois connecté, un serveur est représenté comme une ressource Azure, et des services comme Azure Policy peuvent auditer les paramètres de la machine."
  options:
    a:
      en: "Availability zones are datacenters of an Azure region; they do not protect hardware located in the datacenter of Fabrikam."
      fr: "Les zones de disponibilité sont des centres de données d'une région Azure ; elles ne protègent pas du matériel situé dans le centre de données de Fabrikam."
    c:
      en: "Reservations give a discount on Azure resources in exchange for a commitment; they do not apply to hardware that Fabrikam owns."
      fr: "Les réservations accordent une remise sur des ressources Azure en échange d'un engagement ; elles ne s'appliquent pas à du matériel que Fabrikam possède."
    d:
      en: "Scale sets create and remove Azure virtual machines; they do not add physical servers on-premises."
      fr: "Les groupes identiques créent et suppriment des machines virtuelles Azure ; ils n'ajoutent pas de serveurs physiques en local."
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
