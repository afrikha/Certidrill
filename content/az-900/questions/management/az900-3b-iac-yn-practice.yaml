id: az900-3b-iac-yn-practice
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "With infrastructure as code, a team can create several identical test environments on demand.", fr: "Avec l'infrastructure en tant que code, une équipe peut créer à la demande plusieurs environnements de test identiques." } }
    - { id: s2, text: { en: "With infrastructure as code, the recommended way to change an environment is to edit the deployed resources by hand and leave the code unchanged.", fr: "Avec l'infrastructure en tant que code, la façon recommandée de modifier un environnement est de modifier à la main les ressources déployées en laissant le code inchangé." } }
    - { id: s3, text: { en: "Infrastructure as code definitions can be validated and tested before they are deployed.", fr: "Les définitions d'infrastructure en tant que code peuvent être validées et testées avant d'être déployées." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "With infrastructure as code, the team edits the source, not the target: a manual change to deployed resources recreates the drift that the approach is meant to remove. Because a definition always produces the same environment, several test environments can be provisioned reliably on demand, then torn down. Infrastructure code can itself be validated and tested to prevent common deployment issues."
    fr: "Avec l'infrastructure en tant que code, l'équipe modifie la source, pas la cible : un changement manuel des ressources déployées recrée la dérive que l'approche doit supprimer. Comme une définition produit toujours le même environnement, plusieurs environnements de test peuvent être provisionnés de façon fiable à la demande, puis supprimés. Le code d'infrastructure peut lui-même être validé et testé pour éviter les problèmes de déploiement courants."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
