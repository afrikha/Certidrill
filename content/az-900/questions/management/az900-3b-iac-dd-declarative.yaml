id: az900-3b-iac-dd-declarative
objective: "3.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The approach of a Bicep file is [[bicep]].

      The approach of a script of Azure PowerShell cmdlets that creates the same resources is [[script]].

      Where possible, infrastructure as code should use [[rec]] definitions.
    fr: |
      L'approche d'un fichier Bicep est [[bicep]].

      L'approche d'un script de cmdlets Azure PowerShell qui crée les mêmes ressources est [[script]].

      Dans la mesure du possible, l'infrastructure en tant que code doit utiliser des définitions [[rec]].
  slots:
    - id: bicep
      options:
        - { id: imp, text: { en: "imperative", fr: "impérative" } }
        - { id: decl, text: { en: "declarative", fr: "déclarative" } }
        - { id: man, text: { en: "manual", fr: "manuelle" } }
    - id: script
      options:
        - { id: imp, text: { en: "imperative", fr: "impérative" } }
        - { id: decl, text: { en: "declarative", fr: "déclarative" } }
        - { id: man, text: { en: "manual", fr: "manuelle" } }
    - id: rec
      options:
        - { id: imp, text: { en: "imperative", fr: "impératives" } }
        - { id: decl, text: { en: "declarative", fr: "déclaratives" } }
        - { id: man, text: { en: "manual", fr: "manuelles" } }
answer:
  values: { bicep: decl, script: imp, rec: decl }
explanation:
  correct:
    en: "A Bicep file is declarative: it declares the resources and their properties, without a sequence of commands, and Azure Resource Manager works out how to reach that state. A script is imperative: it lists the commands to run, in order. Infrastructure as code should use declarative definitions where possible, because they describe what an environment requires rather than how to obtain it and avoid the upkeep of deployment scripts."
    fr: "Un fichier Bicep est déclaratif : il déclare les ressources et leurs propriétés, sans suite de commandes, et Azure Resource Manager détermine comment atteindre cet état. Un script est impératif : il énumère les commandes à exécuter, dans l'ordre. L'infrastructure en tant que code doit utiliser des définitions déclaratives quand c'est possible, car elles décrivent ce qu'un environnement exige plutôt que la manière de l'obtenir et évitent l'entretien de scripts de déploiement."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
  - title: What is Bicep?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
