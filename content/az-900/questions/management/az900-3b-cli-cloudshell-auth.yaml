id: az900-3b-cli-cloudshell-auth
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You sign in to the Azure portal and open Azure Cloud Shell.

    How is the Cloud Shell session authenticated?
  fr: |
    Vous vous connectez au portail Azure et ouvrez Azure Cloud Shell.

    Comment la session Cloud Shell est-elle authentifiée ?
body:
  options:
    - { id: a, text: { en: "With the access key of a storage account", fr: "Avec la clé d'accès d'un compte de stockage" } }
    - { id: b, text: { en: "Automatically, with the account that you signed in with", fr: "Automatiquement, avec le compte avec lequel vous êtes connecté" } }
    - { id: c, text: { en: "With a password that is specific to Cloud Shell", fr: "Avec un mot de passe propre à Cloud Shell" } }
    - { id: d, text: { en: "With a certificate that you must upload first", fr: "Avec un certificat que vous devez d'abord charger" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Cloud Shell is authenticated automatically with your Azure credentials: it knows who you are and which permissions you have. You can run Azure CLI commands or Azure PowerShell cmdlets immediately, without signing in again."
    fr: "Cloud Shell est authentifié automatiquement avec vos informations d'identification Azure : il sait qui vous êtes et quelles autorisations vous avez. Vous pouvez exécuter tout de suite des commandes Azure CLI ou des cmdlets Azure PowerShell, sans vous reconnecter."
  options:
    a:
      en: "Cloud Shell uses a file share in a storage account to keep your files, but that does not authenticate the session."
      fr: "Cloud Shell utilise un partage de fichiers d'un compte de stockage pour conserver vos fichiers, mais cela n'authentifie pas la session."
    c:
      en: "Cloud Shell has no password of its own; it reuses your Azure sign-in."
      fr: "Cloud Shell n'a pas de mot de passe propre ; il réutilise votre connexion Azure."
    d:
      en: "No certificate is required to open a Cloud Shell session."
      fr: "Aucun certificat n'est nécessaire pour ouvrir une session Cloud Shell."
references:
  - title: What is Azure Cloud Shell?
    url: https://learn.microsoft.com/en-us/azure/cloud-shell/overview
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
