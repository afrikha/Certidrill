id: az900-3a-purview-governance-dd
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answer that correctly completes the sentence about the unified data governance of Microsoft Purview.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement la phrase sur la gouvernance unifiée des données de Microsoft Purview.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      With the unified data governance of Microsoft Purview, you can create an up-to-date map of your [[map]], identify where [[find]] is stored, and manage [[manage]] securely and at scale.
    fr: |
      Avec la gouvernance unifiée des données de Microsoft Purview, vous pouvez créer une carte à jour de [[map]], repérer où sont stockées [[find]] et gérer [[manage]] de façon sécurisée et à grande échelle.
  slots:
    - id: map
      options:
        - { id: network, text: { en: "virtual network topology", fr: "la topologie de vos réseaux virtuels" } }
        - { id: subs, text: { en: "subscription hierarchy", fr: "la hiérarchie de vos abonnements" } }
        - { id: estate, text: { en: "entire data estate", fr: "l'ensemble de votre patrimoine de données" } }
    - id: find
      options:
        - { id: sensitive, text: { en: "sensitive data", fr: "les données sensibles" } }
        - { id: backup, text: { en: "backup data", fr: "les données de sauvegarde" } }
        - { id: billing, text: { en: "billing data", fr: "les données de facturation" } }
    - id: manage
      options:
        - { id: locks, text: { en: "resource locks", fr: "les verrous de ressources" } }
        - { id: access, text: { en: "access to the data", fr: "l'accès aux données" } }
        - { id: resv, text: { en: "reservations", fr: "les réservations" } }
answer:
  values: { map: estate, find: sensitive, manage: access }
explanation:
  correct:
    en: The unified data governance of Microsoft Purview helps a team to create an up-to-date map of its entire data estate, with data classification and end-to-end lineage, to identify where sensitive data is stored, and to manage access to the data of the estate securely and at scale.
    fr: La gouvernance unifiée des données de Microsoft Purview aide une équipe à créer une carte à jour de l'ensemble de son patrimoine de données, avec la classification des données et la traçabilité de bout en bout, à repérer où sont stockées les données sensibles et à gérer l'accès aux données du patrimoine de façon sécurisée et à grande échelle.
  options:
    subs:
      en: The hierarchy of subscriptions is organized with management groups; Purview maps data, not subscriptions.
      fr: "La hiérarchie des abonnements s'organise avec les groupes d'administration ; Purview cartographie des données, pas des abonnements."
    locks:
      en: Resource locks protect Azure resources against accidental changes and are unrelated to Purview.
      fr: Les verrous de ressources protègent les ressources Azure contre les changements accidentels et sont sans rapport avec Purview.
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
