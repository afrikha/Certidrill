id: az900-3b-iac-yn-basics
objective: "3.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Infrastructure as code reduces the errors that are caused by manual configuration steps.", fr: "L'infrastructure en tant que code réduit les erreurs dues aux étapes de configuration manuelles." } }
    - { id: s2, text: { en: "After each infrastructure as code deployment, the resources must be configured by hand in the Azure portal.", fr: "Après chaque déploiement d'infrastructure en tant que code, les ressources doivent être configurées à la main dans le portail Azure." } }
    - { id: s3, text: { en: "Infrastructure as code can describe only virtual machines; networks must be created by hand.", fr: "L'infrastructure en tant que code ne peut décrire que des machines virtuelles ; les réseaux doivent être créés à la main." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Manual processes are error-prone and hard to track; describing the infrastructure in code removes forgotten or mistyped steps. The code contains the configuration of the resources, so nothing has to be finished by hand after a deployment. A definition can describe any kind of infrastructure: networks, virtual machines, load balancers and the way they are connected."
    fr: "Les processus manuels sont sujets aux erreurs et difficiles à suivre ; décrire l'infrastructure dans du code supprime les étapes oubliées ou mal saisies. Le code contient la configuration des ressources : rien n'est donc à terminer à la main après un déploiement. Une définition peut décrire tout type d'infrastructure : réseaux, machines virtuelles, équilibreurs de charge et la façon dont ils sont reliés."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
