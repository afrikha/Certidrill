id: az900-3a-purview-tools-drag
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the tool that meets it.

    To answer, drag the appropriate tool to each requirement. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence à l'outil qui y répond.

    Pour répondre, faites glisser l'outil approprié vers chaque exigence. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: "Azure Policy" }
    - { id: purview, text: "Microsoft Purview" }
    - { id: rbac, text: { en: "Azure role-based access control (RBAC)", fr: "Contrôle d'accès en fonction du rôle Azure (RBAC)" } }
    - { id: defender, text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" } }
    - { id: lock, text: { en: "Resource locks", fr: "Verrous de ressources" } }
  targets:
    - id: t1
      text: { en: "Know which data the company holds on-premises, in several clouds and in SaaS applications, and how sensitive it is.", fr: "Savoir quelles données l'entreprise détient en local, dans plusieurs clouds et dans des applications SaaS, et à quel point elles sont sensibles." }
    - id: t2
      text: { en: "Make sure that nobody deletes the production database by mistake, even an owner.", fr: "Garantir que personne ne supprime par erreur la base de données de production, pas même un propriétaire." }
    - id: t3
      text: { en: "Make sure that only the network team can modify virtual networks.", fr: "Garantir que seule l'équipe réseau peut modifier les réseaux virtuels." }
answer:
  mapping: { t1: purview, t2: lock, t3: rbac }
explanation:
  correct:
    en: Microsoft Purview governs data. It discovers and classifies it wherever it lives and gives a unified view of it. A resource lock prevents accidental deletion or modification whatever the permissions of the user. Azure RBAC grants permissions according to who the user is, which is what restricting changes to one team requires.
    fr: "Microsoft Purview gouverne les données : il les découvre et les classifie où qu'elles se trouvent et en donne une vue unifiée. Un verrou de ressource empêche la suppression ou la modification accidentelle quelles que soient les autorisations de l'utilisateur. Azure RBAC accorde des autorisations selon l'identité de l'utilisateur, ce qu'exige le fait de réserver les modifications à une équipe."
  options:
    policy:
      en: Azure Policy enforces rules on the configuration of resources for everyone, for example allowed regions; none of the requirements is such a rule.
      fr: "Azure Policy impose à tous des règles sur la configuration des ressources, par exemple les régions autorisées ; aucune des exigences n'est une règle de ce type."
    defender:
      en: Defender for Cloud assesses the security posture of workloads and protects them against threats.
      fr: Defender pour le cloud évalue la posture de sécurité des charges de travail et les protège contre les menaces.
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
