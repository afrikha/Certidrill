id: az900-3a-tag-effects-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An administrator applies the tag `Environment = Production` to a virtual machine.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur applique l'étiquette `Environment = Production` à une machine virtuelle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The tag prevents users from deleting the virtual machine.
        fr: L'étiquette empêche les utilisateurs de supprimer la machine virtuelle.
    - id: s2
      text:
        en: An automation tool can use the tag to find the virtual machine among the resources of a workload.
        fr: Un outil d'automatisation peut utiliser l'étiquette pour retrouver la machine virtuelle parmi les ressources d'une charge de travail.
    - id: s3
      text:
        en: If someone removes the tag, an Azure Policy rule can reapply it.
        fr: Si quelqu'un retire l'étiquette, une règle Azure Policy peut la réappliquer.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A tag is only descriptive metadata. It gives no protection, and blocking deletions is the role of a resource lock. Tags are used for workload optimization and automation, where tools act on the resources that carry a given tag. Azure Policy can enforce tagging rules, for example require tags on new resources or reapply tags that were removed.
    fr: "Une étiquette n'est qu'une métadonnée descriptive. Elle ne protège rien, et bloquer les suppressions est le rôle d'un verrou de ressource. Les étiquettes servent à l'optimisation et à l'automatisation des charges de travail : des outils agissent sur les ressources qui portent une étiquette donnée. Azure Policy peut imposer des règles d'étiquetage, par exemple exiger des étiquettes sur les nouvelles ressources ou réappliquer des étiquettes retirées."
  options:
    s1:
      en: Only a resource lock, or the absence of permission, prevents a deletion; a tag never does.
      fr: "Seul un verrou de ressource, ou l'absence d'autorisation, empêche une suppression ; une étiquette ne le fait jamais."
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
