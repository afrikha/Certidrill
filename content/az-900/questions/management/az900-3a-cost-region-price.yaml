id: az900-3a-cost-region-price
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company compares the price of the same virtual machine size in two Azure regions and finds that the hourly price is different.

    Which cost factor explains the difference?
  fr: |
    Une entreprise compare le prix d'une même taille de machine virtuelle dans deux régions Azure et constate que le prix horaire diffère.

    Quel facteur de coût explique cette différence ?
body:
  options:
    - id: a
      text: { en: "Geography", fr: "La zone géographique" }
    - id: b
      text: { en: "Subscription type", fr: "Le type d'abonnement" }
    - id: c
      text: { en: "Azure Marketplace", fr: "La Place de marché Azure" }
    - id: d
      text: { en: "Maintenance", fr: "La maintenance" }
answer: { optionId: a }
explanation:
  correct:
    en: The cost of power, labor, taxes and fees differs from one location to another, so the same resource can have a different price depending on the region where it is deployed. This factor is geography.
    fr: "Le coût de l'énergie, de la main-d'œuvre, des taxes et des frais varie d'un lieu à l'autre : une même ressource peut donc avoir un prix différent selon la région où elle est déployée. Ce facteur est la zone géographique."
  options:
    b:
      en: The subscription type determines usage allowances such as the credit of a free trial, not the regional price of a virtual machine size.
      fr: Le type d'abonnement détermine des quotas d'utilisation comme le crédit d'un essai gratuit, pas le prix régional d'une taille de machine virtuelle.
    c:
      en: Azure Marketplace concerns third-party solutions billed with the vendor's conditions; the scenario compares the same Azure virtual machine size.
      fr: "La Place de marché Azure concerne les solutions tierces facturées aux conditions du fournisseur ; le scénario compare la même taille de machine virtuelle Azure."
    d:
      en: Maintenance is about resources that are left behind and keep costing, not about the price list of a region.
      fr: La maintenance concerne les ressources oubliées qui continuent de coûter, pas la grille de prix d'une région.
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
