id: az900-3b-cli-nightly-automation
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, Tailspin Toys must create a set of test virtual machines and delete them the next morning, without any manual action.

    What should Tailspin Toys use?
  fr: |
    Chaque nuit, Tailspin Toys doit créer un ensemble de machines virtuelles de test et les supprimer le lendemain matin, sans aucune action manuelle.

    Que doit utiliser Tailspin Toys ?
body:
  options:
    - { id: a, text: { en: "A script of Azure CLI commands", fr: "Un script de commandes Azure CLI" } }
    - { id: b, text: { en: "A dashboard in the Azure portal", fr: "Un tableau de bord du portail Azure" } }
    - { id: c, text: { en: "The Azure mobile app", fr: "L'application mobile Azure" } }
    - { id: d, text: { en: "The guided forms of the Azure portal", fr: "Les formulaires guidés du portail Azure" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure CLI commands, like Azure PowerShell cmdlets, can be captured in a script. The script makes the process repeatable and automatable: it can run every night without anyone clicking in a graphical interface."
    fr: "Les commandes Azure CLI, comme les cmdlets Azure PowerShell, peuvent être regroupées dans un script. Le script rend le processus reproductible et automatisable : il peut s'exécuter chaque nuit sans que personne ne clique dans une interface graphique."
  options:
    b:
      en: "A dashboard displays information about resources; it does not create or delete them on a schedule."
      fr: "Un tableau de bord affiche des informations sur les ressources ; il ne les crée ni ne les supprime selon un horaire."
    c:
      en: "The mobile app is an interactive tool for monitoring and common operations; someone would have to act every night."
      fr: "L'application mobile est un outil interactif de surveillance et d'opérations courantes ; il faudrait que quelqu'un intervienne chaque nuit."
    d:
      en: "The forms of the portal require a person to fill them in for each virtual machine, which is a manual action."
      fr: "Les formulaires du portail demandent qu'une personne les remplisse pour chaque machine virtuelle, ce qui est une action manuelle."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is the Azure CLI?
    url: https://learn.microsoft.com/en-us/cli/azure/what-is-azure-cli
