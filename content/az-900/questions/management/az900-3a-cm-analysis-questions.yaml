id: az900-3a-cm-analysis-questions
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two questions can cost analysis in Cost Management answer?

    NOTE: Each correct selection is worth one point.
  fr: |
    À quelles deux questions l'analyse des coûts de Cost Management peut-elle répondre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Which service cost the most during the last billing cycle?", fr: "Quel service a coûté le plus cher pendant le dernier cycle de facturation ?" } }
    - { id: b, text: { en: "How much would a service cost in a subscription where nothing is deployed yet?", fr: "Combien coûterait un service dans un abonnement où rien n'est encore déployé ?" } }
    - { id: c, text: { en: "Which user deleted a virtual machine last week?", fr: "Quel utilisateur a supprimé une machine virtuelle la semaine dernière ?" } }
    - { id: d, text: { en: "Is the spending accumulated this month in line with the budget?", fr: "Les dépenses cumulées ce mois-ci sont-elles en phase avec le budget ?" } }
    - { id: e, text: { en: "Is an Azure region currently affected by an outage?", fr: "Une région Azure est-elle actuellement touchée par une panne ?" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Cost analysis shows actual costs in different ways, for example by billing cycle, region, resource or service, which identifies what costs the most. It also shows accumulated costs over time, so that you can compare the trend with a budget.
    fr: "L'analyse des coûts présente les coûts réels sous différents angles, par exemple par cycle de facturation, région, ressource ou service, ce qui fait ressortir ce qui coûte le plus cher. Elle montre aussi les coûts cumulés dans le temps, ce qui permet de comparer la tendance à un budget."
  options:
    b:
      en: Estimating the cost of something that isn't deployed is the role of the pricing calculator.
      fr: Estimer le coût de ce qui n'est pas déployé est le rôle de la calculatrice de prix.
    c:
      en: Who performed an operation on a resource is recorded in the activity log of Azure Monitor, not in cost data.
      fr: L'auteur d'une opération sur une ressource est enregistré dans le journal d'activité d'Azure Monitor, pas dans les données de coût.
    e:
      en: Outages of Azure services are reported by Azure Service Health.
      fr: Les pannes des services Azure sont signalées par Azure Service Health.
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
  - title: "Quickstart: Start using Cost Analysis"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/quick-acm-cost-analysis
