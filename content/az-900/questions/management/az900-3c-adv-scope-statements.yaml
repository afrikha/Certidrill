id: az900-3c-adv-scope-statements
objective: "3.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Advisor, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Advisor, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Azure Advisor dashboard can show the recommendations for all your subscriptions."
        fr: "Le tableau de bord d'Azure Advisor peut afficher les recommandations de tous vos abonnements."
    - id: s2
      text:
        en: "Azure Advisor informs you of the maintenance that Microsoft plans on the Azure platform."
        fr: "Azure Advisor vous informe de la maintenance que Microsoft planifie sur la plateforme Azure."
    - id: s3
      text:
        en: "Azure Advisor is the tool in which you write queries on the logs collected from your virtual machines."
        fr: "Azure Advisor est l'outil dans lequel vous écrivez des requêtes sur les journaux collectés depuis vos machines virtuelles."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "The Advisor dashboard displays the recommendations for all your subscriptions, and you can filter them, for example by subscription. Planned maintenance of the platform is communicated by Azure Service Health, not by Advisor. Log queries are written in Log Analytics, a tool of Azure Monitor."
    fr: "Le tableau de bord d'Advisor affiche les recommandations de tous vos abonnements, et vous pouvez les filtrer, par exemple par abonnement. La maintenance planifiée de la plateforme est communiquée par Azure Service Health, pas par Advisor. Les requêtes de journal s'écrivent dans Log Analytics, un outil d'Azure Monitor."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
