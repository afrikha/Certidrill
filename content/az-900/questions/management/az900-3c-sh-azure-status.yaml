id: az900-3c-sh-azure-status
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consultant who has no Azure subscription hears about a major Azure outage. The consultant wants a global view of the health of all Azure services in all regions.

    What should the consultant use?
  fr: |
    Un consultant qui n'a pas d'abonnement Azure entend parler d'une panne majeure d'Azure. Il souhaite une vue mondiale de l'état de santé de tous les services Azure dans toutes les régions.

    Que doit-il utiliser ?
body:
  options:
    - { id: a, text: Service Health }
    - { id: b, text: Resource Health }
    - { id: c, text: Azure Monitor }
    - { id: d, text: { en: "Azure status", fr: "État d'Azure (Azure status)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure status is a public page that gives a global view of the health of Azure services across all regions. Anyone can consult it, and it is a good reference for incidents with widespread effect."
    fr: "État d'Azure (Azure status) est une page publique qui donne une vue mondiale de l'état de santé des services Azure dans toutes les régions. Tout le monde peut la consulter, et c'est une bonne référence pour les incidents de grande ampleur."
  options:
    a:
      en: "Service Health is personalized: it shows only the services and regions used by the subscriptions of the signed-in user."
      fr: "Service Health est personnalisé : il ne montre que les services et les régions utilisés par les abonnements de l'utilisateur connecté."
    b:
      en: "Resource Health reports on your individual resources, such as one virtual machine."
      fr: "Resource Health rend compte de vos ressources individuelles, par exemple une machine virtuelle."
    c:
      en: "Azure Monitor collects metrics and logs from your own resources; it does not give the global state of the Azure platform."
      fr: "Azure Monitor collecte des métriques et des journaux depuis vos propres ressources ; il ne donne pas l'état mondial de la plateforme Azure."
references:
  - title: Azure status overview
    url: https://learn.microsoft.com/en-us/azure/service-health/azure-status-overview
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
