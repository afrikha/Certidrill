id: az900-3a-calc-limits-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The pricing calculator shows the costs that a subscription has accumulated during the current billing cycle.
        fr: La calculatrice de prix affiche les coûts qu'un abonnement a cumulés pendant le cycle de facturation en cours.
    - id: s2
      text:
        en: An estimate in the pricing calculator can include the cost of a support plan.
        fr: Une estimation de la calculatrice de prix peut inclure le coût d'un plan de support.
    - id: s3
      text:
        en: The total of an estimate is a price that Microsoft guarantees, whatever the actual usage.
        fr: Le total d'une estimation est un prix que Microsoft garantit, quelle que soit l'utilisation réelle.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The pricing calculator works on what you plan to deploy, not on what a subscription consumed; accumulated costs are shown by cost analysis in Cost Management. A support plan is one of the options that you can add to an estimate. The prices are estimates for information purposes, and the invoice depends on what is really deployed and used.
    fr: "La calculatrice de prix travaille sur ce que vous prévoyez de déployer, pas sur ce qu'un abonnement a consommé ; les coûts cumulés sont affichés par l'analyse des coûts de Cost Management. Un plan de support fait partie des options que vous pouvez ajouter à une estimation. Les prix sont des estimations données à titre d'information, et la facture dépend de ce qui est réellement déployé et utilisé."
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
