id: az900-3c-mon-alerts-statements
objective: "3.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Monitor alerts, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les alertes Azure Monitor, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The notifications of an action group are limited to email messages."
        fr: "Les notifications d'un groupe d'actions se limitent aux e-mails."
    - id: s2
      text:
        en: "The same action group can be used by several alert rules."
        fr: "Le même groupe d'actions peut être utilisé par plusieurs règles d'alerte."
    - id: s3
      text:
        en: "An alert rule can be based on log data as well as on metrics."
        fr: "Une règle d'alerte peut reposer sur des données de journal aussi bien que sur des métriques."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "An action group can notify by email, SMS, push notification or voice call, and it can also start automated actions, which makes a corrective response possible. An action group is reusable: several alert rules can point to it. Alerts can be based on metrics or on logs: a log alert runs a query at regular intervals and checks its result."
    fr: "Un groupe d'actions peut notifier par e-mail, SMS, notification push ou appel vocal, et il peut aussi lancer des actions automatisées, ce qui permet une réponse corrective. Un groupe d'actions est réutilisable : plusieurs règles d'alerte peuvent y faire appel. Les alertes peuvent reposer sur des métriques ou sur des journaux : une alerte de journal exécute une requête à intervalles réguliers et en vérifie le résultat."
references:
  - title: What are Azure Monitor alerts?
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
  - title: Action groups
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
