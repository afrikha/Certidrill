id: az900-3a-cm-budget-scope
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has one subscription that hosts several projects. All the resources of a project named Phoenix are in a resource group named **RG-Phoenix**, which contains nothing else.

    Adatum wants a monthly spending limit with alerts that covers only the Phoenix project. At which scope should Adatum create the budget?
  fr: |
    Adatum dispose d'un abonnement qui héberge plusieurs projets. Toutes les ressources d'un projet nommé Phoenix se trouvent dans un groupe de ressources nommé **RG-Phoenix**, qui ne contient rien d'autre.

    Adatum veut une limite de dépense mensuelle avec des alertes qui ne couvre que le projet Phoenix. À quelle étendue Adatum doit-elle créer le budget ?
body:
  options:
    - id: a
      text: { en: "The subscription", fr: "L'abonnement" }
    - id: b
      text: { en: "The resource group", fr: "Le groupe de ressources" }
    - id: c
      text: { en: "The management group", fr: "Le groupe d'administration" }
    - id: d
      text: { en: "The billing account", fr: "Le compte de facturation" }
answer: { optionId: b }
explanation:
  correct:
    en: A budget can be scoped to a subscription, a resource group or other criteria. Because RG-Phoenix contains all the resources of the project and nothing else, a budget at the resource group scope measures exactly the spending of Phoenix.
    fr: "Un budget peut porter sur un abonnement, un groupe de ressources ou d'autres critères. Comme RG-Phoenix contient toutes les ressources du projet et rien d'autre, un budget à l'étendue du groupe de ressources mesure exactement les dépenses de Phoenix."
  options:
    a:
      en: A budget for the whole subscription would also count the spending of the other projects.
      fr: Un budget pour tout l'abonnement compterait aussi les dépenses des autres projets.
    c:
      en: A management group contains subscriptions, so this scope is even wider than the subscription.
      fr: "Un groupe d'administration contient des abonnements : cette étendue est donc encore plus large que l'abonnement."
    d:
      en: The billing account covers everything that is invoiced to the company, far more than one project.
      fr: Le compte de facturation couvre tout ce qui est facturé à l'entreprise, bien plus qu'un seul projet.
references:
  - title: "Tutorial: Create and manage budgets"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
