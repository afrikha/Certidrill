id: az900-3b-policy-yn-scope
objective: "3.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A policy assigned to a management group is inherited by the resource groups of the subscriptions in that management group.", fr: "Une stratégie attribuée à un groupe d'administration est héritée par les groupes de ressources des abonnements de ce groupe d'administration." } }
    - { id: s2, text: { en: "A user who has the Owner role for a subscription is exempt from the policies assigned to the subscription.", fr: "Un utilisateur qui dispose du rôle Owner sur un abonnement est dispensé des stratégies attribuées à cet abonnement." } }
    - { id: s3, text: { en: "The policy definitions of an initiative must each be assigned separately.", fr: "Les définitions de stratégie d'une initiative doivent être attribuées séparément, une par une." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Inheritance goes down the whole hierarchy: a policy assigned to a management group applies to its subscriptions, to their resource groups and to their resources. Azure Policy looks at the state of resources, not at the identity of the user, so it applies to owners too. An initiative exists precisely to assign a group of policy definitions in one assignment."
    fr: "L'héritage descend toute la hiérarchie : une stratégie attribuée à un groupe d'administration s'applique à ses abonnements, à leurs groupes de ressources et à leurs ressources. Azure Policy s'intéresse à l'état des ressources, pas à l'identité de l'utilisateur : il s'applique donc aussi aux propriétaires. Une initiative existe précisément pour attribuer un groupe de définitions de stratégie en une seule attribution."
references:
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
