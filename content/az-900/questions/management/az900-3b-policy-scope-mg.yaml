id: az900-3b-policy-scope-mg
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has 12 Azure subscriptions that all belong to a management group named **MG1**. A policy must require a CostCenter tag on the resources of every subscription. The solution must minimize administrative effort.

    To which scope should you assign the policy?
  fr: |
    Litware possède 12 abonnements Azure qui appartiennent tous à un groupe d'administration nommé **MG1**. Une stratégie doit exiger une étiquette CostCenter sur les ressources de tous les abonnements. La solution doit réduire au minimum l'effort d'administration.

    À quelle étendue devez-vous attribuer la stratégie ?
body:
  options:
    - { id: a, text: { en: "Each resource group of the subscriptions", fr: "Chaque groupe de ressources des abonnements" } }
    - { id: b, text: { en: "The MG1 management group", fr: "Le groupe d'administration MG1" } }
    - { id: c, text: { en: "Each of the 12 subscriptions", fr: "Chacun des 12 abonnements" } }
    - { id: d, text: { en: "Each resource of the subscriptions", fr: "Chaque ressource des abonnements" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A policy can be assigned to a management group, and the assignment is inherited by every subscription, resource group and resource below it. A single assignment to MG1 therefore covers the 12 subscriptions, and any subscription added to MG1 later."
    fr: "Une stratégie peut être attribuée à un groupe d'administration, et l'attribution est héritée par tous les abonnements, groupes de ressources et ressources situés en dessous. Une seule attribution à MG1 couvre donc les 12 abonnements, ainsi que tout abonnement ajouté plus tard à MG1."
  options:
    a:
      en: "Assigning the policy to each resource group works, but it requires many assignments and one more for every new resource group."
      fr: "Attribuer la stratégie à chaque groupe de ressources fonctionne, mais exige de nombreuses attributions, plus une pour chaque nouveau groupe de ressources."
    c:
      en: "Twelve assignments would be needed, plus one for each new subscription; a single assignment to MG1 requires less effort."
      fr: "Il faudrait douze attributions, plus une pour chaque nouvel abonnement ; une seule attribution à MG1 demande moins d'effort."
    d:
      en: "Assigning the policy resource by resource is the most laborious option and does not cover resources created later."
      fr: "Attribuer la stratégie ressource par ressource est l'option la plus laborieuse et ne couvre pas les ressources créées plus tard."
references:
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
