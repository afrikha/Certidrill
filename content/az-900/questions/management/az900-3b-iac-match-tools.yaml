id: az900-3b-iac-match-tools
objective: "3.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the infrastructure as code tool that it describes. To answer, drag the appropriate tool to each description. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'outil d'infrastructure en tant que code qu'elle décrit. Pour répondre, faites glisser l'outil approprié vers chaque description. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: arm, text: { en: "ARM template", fr: "Modèle ARM" } }
    - { id: bicep, text: "Bicep" }
    - { id: tf, text: "Terraform" }
    - { id: ps, text: "Azure PowerShell" }
    - { id: shell, text: "Azure Cloud Shell" }
  targets:
    - id: t1
      text: { en: "An open-source tool from HashiCorp that can also deploy infrastructure to other clouds", fr: "Un outil open source de HashiCorp qui peut aussi déployer de l'infrastructure dans d'autres clouds" }
    - id: t2
      text: { en: "A JSON file that declares the Azure resources to deploy", fr: "Un fichier JSON qui déclare les ressources Azure à déployer" }
    - id: t3
      text: { en: "A declarative language for Azure with a more concise syntax than JSON", fr: "Un langage déclaratif pour Azure, à la syntaxe plus concise que le JSON" }
answer:
  mapping: { t1: tf, t2: arm, t3: bicep }
explanation:
  correct:
    en: "Terraform is an open-source infrastructure as code tool from HashiCorp that manages public clouds, private clouds and SaaS services through providers, Azure included. An ARM template is a JSON file that declares what to deploy to Azure. Bicep is a declarative language specific to Azure whose files are more concise and easier to read than the equivalent JSON. Azure PowerShell runs cmdlets, and Cloud Shell is a browser-based shell."
    fr: "Terraform est un outil d'infrastructure en tant que code open source de HashiCorp qui gère des clouds publics, des clouds privés et des services SaaS au moyen de fournisseurs, Azure compris. Un modèle ARM est un fichier JSON qui déclare ce qu'il faut déployer dans Azure. Bicep est un langage déclaratif propre à Azure dont les fichiers sont plus concis et plus lisibles que le JSON équivalent. Azure PowerShell exécute des cmdlets, et Cloud Shell est un shell dans le navigateur."
references:
  - title: Overview of Terraform on Azure - What is Terraform?
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/overview
  - title: What is Bicep?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
