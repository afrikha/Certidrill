id: az900-3a-cost-spot
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs batch rendering jobs on Azure virtual machines every night. A job that is interrupted can restart later without any impact.

    Tailspin Toys wants the lowest possible compute price for these jobs. What should the company use?
  fr: |
    Tailspin Toys exécute chaque nuit des travaux de rendu par lots sur des machines virtuelles Azure. Un travail interrompu peut redémarrer plus tard sans aucune conséquence.

    Tailspin Toys veut le prix de calcul le plus bas possible pour ces travaux. Que doit utiliser l'entreprise ?
body:
  options:
    - id: a
      text: { en: "An Azure reservation", fr: "Une réservation Azure" }
    - id: b
      text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" }
    - id: c
      text: { en: "An Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul" }
    - id: d
      text: { en: "Azure Spot Virtual Machines", fr: "Des machines virtuelles Azure Spot" }
answer: { optionId: d }
explanation:
  correct:
    en: Spot virtual machines use unused Azure capacity at a reduced price. Azure can take the capacity back at any time, so they suit interruptible workloads such as batch jobs that can restart, where the lowest cost is the priority.
    fr: "Les machines virtuelles Spot utilisent la capacité Azure inutilisée à un prix réduit. Azure peut reprendre cette capacité à tout moment : elles conviennent donc aux charges de travail qui tolèrent les interruptions, comme des travaux par lots qui peuvent redémarrer, quand le coût le plus bas est la priorité."
  options:
    a:
      en: A reservation targets workloads that run permanently with stable needs; jobs that run only at night and tolerate interruptions get a lower price with Spot.
      fr: "Une réservation vise les charges de travail qui s'exécutent en permanence avec des besoins stables ; des travaux nocturnes qui tolèrent les interruptions obtiennent un prix plus bas avec Spot."
    b:
      en: Azure Hybrid Benefit reduces costs by reusing existing Windows Server or SQL Server licenses, which the scenario doesn't mention.
      fr: Azure Hybrid Benefit réduit les coûts en réutilisant des licences Windows Server ou SQL Server existantes, ce que le scénario ne mentionne pas.
    c:
      en: A savings plan is a commitment to an hourly spend for one or three years, suited to steady usage; it doesn't give the lowest price for interruptible jobs.
      fr: "Un plan d'économies est un engagement sur un montant horaire pendant un ou trois ans, adapté à un usage régulier ; il ne donne pas le prix le plus bas pour des travaux qui tolèrent les interruptions."
references:
  - title: Describe cost optimization options in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7a-describe-cost-optimization-options
  - title: Azure Spot Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
