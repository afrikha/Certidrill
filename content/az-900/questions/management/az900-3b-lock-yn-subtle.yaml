id: az900-3b-lock-yn-subtle
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A user who has the Owner role for a resource can delete the resource while a Delete lock is applied to it.", fr: "Un utilisateur qui dispose du rôle Owner sur une ressource peut la supprimer alors qu'un verrou Suppression lui est appliqué." } }
    - { id: s2, text: { en: "After a Delete lock is removed from a resource, a user who has sufficient permissions can delete the resource.", fr: "Une fois le verrou Suppression retiré d'une ressource, un utilisateur qui dispose des autorisations suffisantes peut supprimer la ressource." } }
    - { id: s3, text: { en: "While a Read-only lock is applied to a resource group, authorized users can create new resources in the resource group.", fr: "Tant qu'un verrou Lecture seule est appliqué à un groupe de ressources, les utilisateurs autorisés peuvent créer de nouvelles ressources dans ce groupe." } }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Locks apply regardless of Azure RBAC permissions: even an owner must first remove the lock before deleting the resource. A lock is not permanent, so once it is removed the usual permissions decide who can delete the resource. A Read-only lock limits authorized users to read operations, as with the Reader role, so nothing can be created in the locked resource group."
    fr: "Les verrous s'appliquent quelles que soient les autorisations Azure RBAC : même un propriétaire doit d'abord retirer le verrou avant de supprimer la ressource. Un verrou n'est pas définitif : une fois retiré, ce sont les autorisations habituelles qui décident de qui peut supprimer la ressource. Un verrou Lecture seule limite les utilisateurs autorisés aux opérations de lecture, comme avec le rôle Reader : rien ne peut donc être créé dans le groupe de ressources verrouillé."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
