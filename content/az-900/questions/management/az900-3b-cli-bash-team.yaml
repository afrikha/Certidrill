id: az900-3b-cli-bash-team
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The administrators of Woodgrove Bank work on Linux and macOS workstations and maintain Bash scripts. They want to install a tool on their workstations and add Azure management commands to their existing scripts with the least learning effort.

    Which tool should they install?
  fr: |
    Les administrateurs de Woodgrove Bank travaillent sur des postes Linux et macOS et maintiennent des scripts Bash. Ils veulent installer un outil sur leurs postes et ajouter des commandes de gestion Azure à leurs scripts existants avec le moins d'apprentissage possible.

    Quel outil doivent-ils installer ?
body:
  options:
    - { id: a, text: "Azure Cloud Shell" }
    - { id: b, text: { en: "Azure Storage Explorer", fr: "L'Explorateur Stockage Azure" } }
    - { id: c, text: "Azure PowerShell" }
    - { id: d, text: "Azure CLI" }
answer: { optionId: d }
explanation:
  correct:
    en: "The Azure CLI installs on Linux, macOS and Windows and uses Bash-style commands, so they fit naturally into existing Bash scripts. Azure PowerShell offers equivalent capabilities; the choice between the two mainly depends on the command language that the team already knows."
    fr: "Azure CLI s'installe sous Linux, macOS et Windows et utilise des commandes de style Bash, qui s'intègrent donc naturellement à des scripts Bash existants. Azure PowerShell offre des capacités équivalentes ; le choix entre les deux dépend surtout du langage de commande que l'équipe connaît déjà."
  options:
    a:
      en: "Cloud Shell runs in the browser and is not installed on a workstation."
      fr: "Cloud Shell s'exécute dans le navigateur et ne s'installe pas sur un poste de travail."
    b:
      en: "Azure Storage Explorer is a graphical application limited to storage data; it adds no commands to scripts."
      fr: "L'Explorateur Stockage Azure est une application graphique limitée aux données de stockage ; il n'ajoute pas de commandes à des scripts."
    c:
      en: "Azure PowerShell also runs on Linux and macOS, but its cmdlets use the PowerShell syntax, which the team would have to learn."
      fr: "Azure PowerShell fonctionne aussi sous Linux et macOS, mais ses cmdlets utilisent la syntaxe PowerShell, que l'équipe devrait apprendre."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is the Azure CLI?
    url: https://learn.microsoft.com/en-us/cli/azure/what-is-azure-cli
