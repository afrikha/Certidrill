id: az900-3a-calc-estimate-order
objective: "3.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You need to estimate the monthly cost of a web application that will use Azure App Service and Azure SQL Database, and then send the estimate to the finance department. Nothing is deployed yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez estimer le coût mensuel d'une application web qui utilisera Azure App Service et Azure SQL Database, puis envoyer l'estimation au service financier. Rien n'est encore déployé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: analysis, text: { en: "Open cost analysis in Cost Management and group the costs by service.", fr: "Ouvrir l'analyse des coûts de Cost Management et regrouper les coûts par service." } }
    - { id: export, text: { en: "Export the estimate from the pricing calculator to an Excel file.", fr: "Exporter l'estimation de la calculatrice de prix dans un fichier Excel." } }
    - { id: add, text: { en: "Add App Service and Azure SQL Database to an estimate in the pricing calculator.", fr: "Ajouter App Service et Azure SQL Database à une estimation dans la calculatrice de prix." } }
    - { id: budget, text: { en: "Create a budget in Cost Management for the subscription.", fr: "Créer un budget dans Cost Management pour l'abonnement." } }
    - { id: config, text: { en: "Set the region, the tier and the expected usage of each product.", fr: "Régler la région, le niveau et l'utilisation prévue de chaque produit." } }
    - { id: deploy, text: { en: "Deploy the web application to a test resource group.", fr: "Déployer l'application web dans un groupe de ressources de test." } }
answer:
  sequence: [ add, config, export ]
explanation:
  correct:
    en: |
      In the pricing calculator, you first add the products of the solution to an estimate, then set the options of each product, such as the region, the tier and the usage, so that the estimate matches the planned architecture. The finished estimate can then be exported to an Excel file and sent. Nothing has to be deployed.
    fr: |
      Dans la calculatrice de prix, vous ajoutez d'abord les produits de la solution à une estimation, puis vous réglez les options de chaque produit, comme la région, le niveau et l'utilisation, pour que l'estimation corresponde à l'architecture prévue. L'estimation terminée peut ensuite être exportée dans un fichier Excel et envoyée. Il n'y a rien à déployer.
  options:
    analysis: { en: "Cost analysis shows the costs of deployed resources; nothing is deployed yet.", fr: "L'analyse des coûts montre les coûts de ressources déployées ; rien n'est encore déployé." }
    budget: { en: "A budget follows actual spending and sends alerts; it doesn't produce an estimate.", fr: "Un budget suit les dépenses réelles et envoie des alertes ; il ne produit pas d'estimation." }
    deploy: { en: "Deploying resources to measure their cost generates charges and isn't needed to obtain an estimate.", fr: "Déployer des ressources pour mesurer leur coût génère des frais et n'est pas nécessaire pour obtenir une estimation." }
references:
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
