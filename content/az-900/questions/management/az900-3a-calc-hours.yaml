id: az900-3a-calc-hours
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the pricing calculator, you add a virtual machine to an estimate. The virtual machine will run only 200 hours per month instead of the whole month.

    Which setting should you change so that the estimate reflects this usage?
  fr: |
    Dans la calculatrice de prix, vous ajoutez une machine virtuelle à une estimation. La machine virtuelle ne fonctionnera que 200 heures par mois au lieu du mois entier.

    Quel réglage devez-vous modifier pour que l'estimation reflète cette utilisation ?
body:
  options:
    - id: a
      text: { en: "The number of hours", fr: "Le nombre d'heures" }
    - id: b
      text: { en: "The region", fr: "La région" }
    - id: c
      text: { en: "The support plan", fr: "Le plan de support" }
    - id: d
      text: { en: "The currency", fr: "La devise" }
answer: { optionId: a }
explanation:
  correct:
    en: Each product of an estimate has usage quantities. A virtual machine is estimated for a full month by default, and lowering the number of hours to 200 recalculates the estimate for that usage.
    fr: "Chaque produit d'une estimation possède des quantités d'utilisation. Une machine virtuelle est estimée par défaut pour un mois complet, et ramener le nombre d'heures à 200 recalcule l'estimation pour cette utilisation."
  options:
    b:
      en: The region changes the unit price of the virtual machine, not the time during which it runs.
      fr: La région change le prix unitaire de la machine virtuelle, pas la durée pendant laquelle elle fonctionne.
    c:
      en: The support plan adds the price of technical support to the estimate; it is unrelated to the usage of a virtual machine.
      fr: "Le plan de support ajoute le prix du support technique à l'estimation ; il est sans rapport avec l'utilisation d'une machine virtuelle."
    d:
      en: The currency only converts the amounts that are displayed.
      fr: La devise ne fait que convertir les montants affichés.
references:
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
