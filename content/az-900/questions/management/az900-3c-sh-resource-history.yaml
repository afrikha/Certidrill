id: az900-3c-sh-resource-history
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Last night, an application of Tailspin Toys that runs on a virtual machine named **VM-WEB1** was unreachable for 20 minutes.

    Management asks whether Azure reported VM-WEB1 itself as unavailable during that period, and whether an event on the Azure platform was the cause.

    What should you check?
  fr: |
    La nuit dernière, une application de Tailspin Toys qui s'exécute sur une machine virtuelle nommée **VM-WEB1** a été injoignable pendant 20 minutes.

    La direction demande si Azure a signalé VM-WEB1 elle-même comme indisponible pendant cette période, et si un événement de la plateforme Azure en était la cause.

    Que devez-vous vérifier ?
body:
  options:
    - { id: a, text: { en: "The health history of VM-WEB1 in Resource Health", fr: "L'historique d'intégrité de VM-WEB1 dans Resource Health" } }
    - { id: b, text: { en: "The history of incidents on the Azure status page", fr: "L'historique des incidents sur la page État d'Azure" } }
    - { id: c, text: { en: "The recommendations for VM-WEB1 in Azure Advisor", fr: "Les recommandations pour VM-WEB1 dans Azure Advisor" } }
    - { id: d, text: { en: "The health advisories of the region in Service Health", fr: "Les avis d'intégrité de la région dans Service Health" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Resource Health reports on the current and past health of an individual resource. It shows when the resource was unavailable and whether the cause was a platform event, which also helps to check whether a service-level agreement was respected."
    fr: "Resource Health rend compte de l'état de santé actuel et passé d'une ressource individuelle. Il montre quand la ressource a été indisponible et si la cause était un événement de la plateforme, ce qui aide aussi à vérifier le respect d'un contrat de niveau de service."
  options:
    b:
      en: "The Azure status page lists widespread incidents of the platform; it knows nothing about one particular virtual machine."
      fr: "La page État d'Azure recense les incidents étendus de la plateforme ; elle ne sait rien d'une machine virtuelle en particulier."
    c:
      en: "Advisor recommends improvements; it does not record when a resource was unavailable."
      fr: "Advisor recommande des améliorations ; il n'enregistre pas les périodes d'indisponibilité d'une ressource."
    d:
      en: "Health advisories announce changes in Azure services that need your attention; they do not give the availability of one resource."
      fr: "Les avis d'intégrité annoncent des changements des services Azure qui demandent votre attention ; ils ne donnent pas la disponibilité d'une ressource."
references:
  - title: Resource Health overview
    url: https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview
