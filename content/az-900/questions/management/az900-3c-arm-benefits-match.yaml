id: az900-3c-arm-benefits-match
objective: "3.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each benefit of ARM templates to its description.

    To answer, drag the appropriate benefit to each description. Each benefit may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque avantage des modèles ARM à sa description.

    Pour répondre, faites glisser l'avantage approprié vers chaque description. Chaque avantage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: decl, text: { en: "Declarative syntax", fr: "Syntaxe déclarative" } }
    - { id: rep, text: { en: "Repeatable results", fr: "Résultats reproductibles" } }
    - { id: orch, text: { en: "Orchestration", fr: "Orchestration" } }
    - { id: mod, text: { en: "Modular files", fr: "Fichiers modulaires" } }
    - { id: ext, text: { en: "Extensibility", fr: "Extensibilité" } }
  targets:
    - id: t1
      text: { en: "Azure Resource Manager works out the order of interdependent resources and deploys them in parallel when possible.", fr: "Azure Resource Manager détermine l'ordre des ressources interdépendantes et les déploie en parallèle quand c'est possible." }
    - id: t2
      text: { en: "Deploying the same template again gives the same resources in the same state.", fr: "Redéployer le même modèle donne les mêmes ressources dans le même état." }
    - id: t3
      text: { en: "PowerShell or Bash scripts can be added to the template to complete the setup of the environment.", fr: "Des scripts PowerShell ou Bash peuvent être ajoutés au modèle pour terminer la configuration de l'environnement." }
    - id: t4
      text: { en: "You state what to deploy without writing the commands that deploy it.", fr: "Vous indiquez ce qu'il faut déployer sans écrire les commandes qui le déploient." }
answer:
  mapping: { t1: orch, t2: rep, t3: ext, t4: decl }
explanation:
  correct:
    en: "Orchestration means that Azure Resource Manager handles the ordering of operations and parallel deployment. Repeatable results means that the same template always gives the same resources (idempotence). Extensibility is the ability to add deployment scripts in PowerShell or Bash. Declarative syntax means describing the result instead of the commands."
    fr: "L'orchestration signifie qu'Azure Resource Manager gère l'ordre des opérations et le déploiement en parallèle. Les résultats reproductibles signifient que le même modèle donne toujours les mêmes ressources (idempotence). L'extensibilité est la possibilité d'ajouter des scripts de déploiement en PowerShell ou en Bash. La syntaxe déclarative consiste à décrire le résultat plutôt que les commandes."
  options:
    mod:
      en: "Modular files means that a template can be split into smaller reusable templates; no description refers to it."
      fr: "Les fichiers modulaires signifient qu'un modèle peut être découpé en modèles plus petits et réutilisables ; aucune description n'y correspond."
references:
  - title: What are ARM templates?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
