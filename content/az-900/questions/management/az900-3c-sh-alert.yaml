id: az900-3c-sh-alert
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Azure SQL Database and Azure App Service in the North Europe region. The on-call team must receive an SMS when Azure has a service issue that affects these services in this region.

    What should you create?
  fr: |
    Northwind Traders utilise Azure SQL Database et Azure App Service dans la région North Europe. L'équipe d'astreinte doit recevoir un SMS quand Azure rencontre un problème de service qui touche ces services dans cette région.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An Advisor alert", fr: "Une alerte Advisor" } }
    - { id: b, text: { en: "A Service Health alert", fr: "Une alerte Service Health" } }
    - { id: c, text: { en: "A budget alert", fr: "Une alerte de budget" } }
    - { id: d, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In Service Health, you can create alerts that notify you, through an action group, when a service issue, planned maintenance or a health advisory concerns the services and regions that you select. The action group can send an SMS, an email or a push notification."
    fr: "Dans Service Health, vous pouvez créer des alertes qui vous notifient, par un groupe d'actions, quand un problème de service, une maintenance planifiée ou un avis d'intégrité concerne les services et les régions que vous sélectionnez. Le groupe d'actions peut envoyer un SMS, un e-mail ou une notification push."
  options:
    a:
      en: "An Advisor alert notifies you of new Advisor recommendations, not of issues of the Azure platform."
      fr: "Une alerte Advisor vous notifie des nouvelles recommandations d'Advisor, pas des problèmes de la plateforme Azure."
    c:
      en: "A budget alert warns you when spending reaches a threshold."
      fr: "Une alerte de budget vous avertit quand les dépenses atteignent un seuil."
    d:
      en: "A lock prevents the deletion or modification of a resource; it notifies nobody."
      fr: "Un verrou empêche la suppression ou la modification d'une ressource ; il ne notifie personne."
references:
  - title: Create Service Health alerts
    url: https://learn.microsoft.com/en-us/azure/service-health/alerts-activity-log-service-notifications-portal
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
