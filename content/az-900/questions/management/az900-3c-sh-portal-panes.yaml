id: az900-3c-sh-portal-panes
objective: "3.4.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You open **Service Health** in the Azure portal. Its menu contains the panes shown in the following table.

    Answer each prompt by selecting the pane that you should open.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez **Service Health** dans le portail Azure. Son menu contient les volets du tableau suivant.

    Répondez à chaque consigne en sélectionnant le volet à ouvrir.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Microsoft will update the hosts of your virtual machines next week, and the virtual machines might restart.", fr: "Microsoft mettra à jour les hôtes de vos machines virtuelles la semaine prochaine, et les machines virtuelles pourraient redémarrer." }
    - id: p2
      text: { en: "You want to know whether one specific virtual machine is currently available.", fr: "Vous voulez savoir si une machine virtuelle précise est actuellement disponible." }
  grid:
    header: [{ en: "Service Health menu", fr: "Menu de Service Health" }]
    rows:
      - [{ text: Service issues, area: issues }]
      - [{ text: Planned maintenance, area: maint }]
      - [{ text: Health advisories, area: advis }]
      - [{ text: Resource health, area: reshealth }]
answer:
  values: { p1: maint, p2: reshealth }
explanation:
  correct:
    en: "Planned maintenance lists the upcoming maintenance that can affect the availability of your services, such as an update of the hosts of virtual machines. Resource health shows whether an individual resource, such as one virtual machine, is running as expected."
    fr: "Planned maintenance (maintenance planifiée) recense la maintenance à venir qui peut toucher la disponibilité de vos services, par exemple une mise à jour des hôtes de machines virtuelles. Resource health indique si une ressource individuelle, par exemple une machine virtuelle, fonctionne comme prévu."
  options:
    issues:
      en: "Service issues shows the problems of Azure services that affect you right now, not future maintenance."
      fr: "Service issues (problèmes de service) affiche les problèmes des services Azure qui vous touchent en ce moment, pas une maintenance future."
    advis:
      en: "Health advisories announces changes in Azure services that require your attention, such as the retirement of a feature."
      fr: "Health advisories (avis d'intégrité) annonce des changements des services Azure qui demandent votre attention, par exemple le retrait d'une fonctionnalité."
references:
  - title: Azure Service Health portal
    url: https://learn.microsoft.com/en-us/azure/service-health/service-health-portal-update
