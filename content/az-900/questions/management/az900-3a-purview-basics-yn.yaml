id: az900-3a-purview-basics-yn
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Purview provides a unified view of on-premises, multicloud and SaaS data.
        fr: Microsoft Purview fournit une vue unifiée des données locales, multiclouds et SaaS.
    - id: s2
      text:
        en: Microsoft Purview is used to deny the deployment of Azure resources that don't comply with company rules.
        fr: Microsoft Purview sert à refuser le déploiement de ressources Azure qui ne respectent pas les règles de l'entreprise.
    - id: s3
      text:
        en: Microsoft Purview can classify sensitive data.
        fr: Microsoft Purview peut classifier les données sensibles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Microsoft Purview is a family of data governance, risk and compliance solutions that gives a single, unified view of data, whether it is on-premises, in several clouds or in SaaS applications. Sensitive data classification is one of the capabilities it provides, with automated data discovery and end-to-end data lineage. Denying noncompliant deployments is the role of Azure Policy.
    fr: Microsoft Purview est une famille de solutions de gouvernance des données, de gestion des risques et de conformité qui donne une vue unique et unifiée des données, qu'elles soient en local, dans plusieurs clouds ou dans des applications SaaS. La classification des données sensibles fait partie de ce qu'il apporte, avec la découverte automatisée des données et la traçabilité des données de bout en bout. Refuser les déploiements non conformes est le rôle d'Azure Policy.
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
