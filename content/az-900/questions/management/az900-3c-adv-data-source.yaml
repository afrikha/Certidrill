id: az900-3c-adv-data-source
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On what does Azure Advisor base the recommendations that it makes for a subscription?
  fr: |
    Sur quoi Azure Advisor fonde-t-il les recommandations qu'il formule pour un abonnement ?
body:
  options:
    - { id: a, text: { en: "The estimates that you saved in the Azure pricing calculator", fr: "Les estimations que vous avez enregistrées dans la calculatrice de prix Azure" } }
    - { id: b, text: { en: "The log queries that you saved in Log Analytics", fr: "Les requêtes de journal que vous avez enregistrées dans Log Analytics" } }
    - { id: c, text: { en: "The configuration and usage of the resources that you deployed", fr: "La configuration et l'utilisation des ressources que vous avez déployées" } }
    - { id: d, text: { en: "The incidents that Microsoft published on the Azure status page", fr: "Les incidents que Microsoft a publiés sur la page État d'Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Advisor analyzes the configuration of your resources and their usage telemetry, and then recommends solutions that follow best practices. That is why its recommendations are personalized for your environment."
    fr: "Azure Advisor analyse la configuration de vos ressources et leur télémétrie d'utilisation, puis recommande des solutions conformes aux bonnes pratiques. C'est pourquoi ses recommandations sont personnalisées pour votre environnement."
  options:
    a:
      en: "The pricing calculator estimates the cost of resources before deployment; Advisor works on resources that already exist."
      fr: "La calculatrice de prix estime le coût de ressources avant leur déploiement ; Advisor travaille sur des ressources qui existent déjà."
    b:
      en: "Log Analytics is the Azure Monitor tool for querying logs; Advisor does not depend on the queries that you write."
      fr: "Log Analytics est l'outil d'Azure Monitor pour interroger les journaux ; Advisor ne dépend pas des requêtes que vous écrivez."
    d:
      en: "The Azure status page reports widespread outages of the platform; it is not the source of Advisor recommendations."
      fr: "La page État d'Azure signale les pannes étendues de la plateforme ; ce n'est pas la source des recommandations d'Advisor."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
