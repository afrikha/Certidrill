id: az900-3c-arm-template-statements
objective: "3.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about ARM templates, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les modèles ARM, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Deploying the same ARM template several times to the same resource group creates a new copy of the resources each time."
        fr: "Déployer plusieurs fois le même modèle ARM dans le même groupe de ressources crée à chaque fois une nouvelle copie des ressources."
    - id: s2
      text:
        en: "A single ARM template can deploy several resources of different types, such as a virtual network and a storage account."
        fr: "Un seul modèle ARM peut déployer plusieurs ressources de types différents, par exemple un réseau virtuel et un compte de stockage."
    - id: s3
      text:
        en: "The resources of an ARM template are always deployed one at a time, in the order in which they appear in the file."
        fr: "Les ressources d'un modèle ARM sont toujours déployées une par une, dans l'ordre où elles apparaissent dans le fichier."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "ARM templates are idempotent: deploying the same template again gives the same resources in the same state, not copies. One template can define a whole infrastructure made of resources of different types. Azure Resource Manager orchestrates the deployment: it works out the order of interdependent resources and deploys in parallel when possible."
    fr: "Les modèles ARM sont idempotents : redéployer le même modèle donne les mêmes ressources dans le même état, pas des copies. Un même modèle peut définir toute une infrastructure composée de ressources de types différents. Azure Resource Manager orchestre le déploiement : il détermine l'ordre des ressources interdépendantes et déploie en parallèle quand c'est possible."
references:
  - title: What are ARM templates?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
