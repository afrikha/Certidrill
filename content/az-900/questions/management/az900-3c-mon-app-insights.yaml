id: az900-3c-mon-app-insights
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts a web application in Azure App Service. Users report that some pages are slow.

    The developers need the request rates, the response times and the failure rates of the application, and the performance of the calls that it makes to external services.

    What should the developers use?
  fr: |
    Proseware héberge une application web dans Azure App Service. Des utilisateurs signalent que certaines pages sont lentes.

    Les développeurs ont besoin des taux de requêtes, des temps de réponse et des taux d'échec de l'application, ainsi que des performances des appels qu'elle effectue vers des services externes.

    Que doivent utiliser les développeurs ?
body:
  options:
    - { id: a, text: Azure Service Health }
    - { id: b, text: Azure Advisor }
    - { id: c, text: Application Insights }
    - { id: d, text: Resource Health }
answer: { optionId: c }
explanation:
  correct:
    en: "Application Insights is the Azure Monitor feature that monitors the performance and usage of web applications. It tracks request rates, response times and failure rates, as well as dependency calls and their performance."
    fr: "Application Insights est la fonctionnalité d'Azure Monitor qui surveille les performances et l'usage des applications web. Il suit les taux de requêtes, les temps de réponse et les taux d'échec, ainsi que les appels de dépendances et leurs performances."
  options:
    a:
      en: "Azure Service Health reports the issues of the Azure platform, not the behavior of your application."
      fr: "Azure Service Health signale les problèmes de la plateforme Azure, pas le comportement de votre application."
    b:
      en: "Azure Advisor gives recommendations about resources; it does not measure the requests of an application."
      fr: "Azure Advisor donne des recommandations sur les ressources ; il ne mesure pas les requêtes d'une application."
    d:
      en: "Resource Health tells whether a resource is available; it gives no detail about requests and dependencies."
      fr: "Resource Health indique si une ressource est disponible ; il ne donne aucun détail sur les requêtes et les dépendances."
references:
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
  - title: Introduction to Application Insights - OpenTelemetry observability
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
