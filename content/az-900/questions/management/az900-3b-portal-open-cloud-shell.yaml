id: az900-3b-portal-open-cloud-shell
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator is signed in to the Azure portal and wants to run an Azure CLI command without leaving the browser.

    What should the administrator open from the portal?
  fr: |
    Un administrateur est connecté au portail Azure et souhaite exécuter une commande Azure CLI sans quitter le navigateur.

    Que doit-il ouvrir depuis le portail ?
body:
  options:
    - { id: a, text: { en: "A dashboard", fr: "Un tableau de bord" } }
    - { id: b, text: "Azure Advisor" }
    - { id: c, text: "Azure Marketplace" }
    - { id: d, text: "Azure Cloud Shell" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Cloud Shell is a browser-based shell that opens from the Cloud Shell icon in the header of the Azure portal. It includes the Azure CLI and Azure PowerShell, so commands run without any local installation."
    fr: "Azure Cloud Shell est un shell dans le navigateur qui s'ouvre depuis l'icône Cloud Shell de l'en-tête du portail Azure. Il inclut Azure CLI et Azure PowerShell : les commandes s'exécutent sans aucune installation locale."
  options:
    a:
      en: "A dashboard displays tiles about resources; it does not run commands."
      fr: "Un tableau de bord affiche des vignettes sur les ressources ; il n'exécute pas de commandes."
    b:
      en: "Azure Advisor gives recommendations to improve resources; it is not a command line."
      fr: "Azure Advisor fournit des recommandations pour améliorer les ressources ; ce n'est pas une ligne de commande."
    c:
      en: "Azure Marketplace is a catalog of services and applications to deploy; it does not run commands."
      fr: "Azure Marketplace est un catalogue de services et d'applications à déployer ; il n'exécute pas de commandes."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
