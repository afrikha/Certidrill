id: az900-3b-lock-readonly-owner
objective: "3.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A resource group named **RG1** has a Read-only lock. A user has the Owner role for RG1.

    What can the user do with the virtual machines in RG1 while the lock is in place?
  fr: |
    Un groupe de ressources nommé **RG1** possède un verrou Lecture seule. Un utilisateur dispose du rôle Owner sur RG1.

    Que peut faire cet utilisateur avec les machines virtuelles de RG1 tant que le verrou est en place ?
body:
  options:
    - { id: a, text: { en: "View them, modify them, and delete them", fr: "Les consulter, les modifier et les supprimer" } }
    - { id: b, text: { en: "View them and modify them, but not delete them", fr: "Les consulter et les modifier, mais pas les supprimer" } }
    - { id: c, text: { en: "View them only", fr: "Les consulter uniquement" } }
    - { id: d, text: { en: "Nothing: they are hidden from the user", fr: "Rien : elles lui sont masquées" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Read-only lock lets authorized users read a resource but neither update nor delete it, as if everyone had only the Reader role. The lock on RG1 is inherited by its virtual machines and applies whatever the role of the user, even Owner."
    fr: "Un verrou Lecture seule permet aux utilisateurs autorisés de lire une ressource, mais ni de la mettre à jour ni de la supprimer, comme si tout le monde n'avait que le rôle Reader. Le verrou de RG1 est hérité par ses machines virtuelles et s'applique quel que soit le rôle de l'utilisateur, même Owner."
  options:
    a:
      en: "The Owner role does not override a lock: the lock must be removed before any change or deletion."
      fr: "Le rôle Owner ne l'emporte pas sur un verrou : il faut retirer le verrou avant toute modification ou suppression."
    b:
      en: "This describes a Delete lock. A Read-only lock also blocks modifications."
      fr: "Cela décrit un verrou Suppression. Un verrou Lecture seule bloque aussi les modifications."
    d:
      en: "A lock never hides resources; reading stays possible."
      fr: "Un verrou ne masque jamais les ressources ; la lecture reste possible."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
