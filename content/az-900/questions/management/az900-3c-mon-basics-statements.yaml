id: az900-3c-mon-basics-statements
objective: "3.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Monitor can collect data from resources that run on-premises or in other clouds."
        fr: "Azure Monitor peut collecter des données depuis des ressources qui s'exécutent en local ou dans d'autres clouds."
    - id: s2
      text:
        en: "Azure Monitor alerts can notify you when a metric exceeds a threshold that you define."
        fr: "Les alertes Azure Monitor peuvent vous notifier quand une métrique dépasse un seuil que vous définissez."
    - id: s3
      text:
        en: "Log Analytics is the tool that gives you personalized recommendations for your resources."
        fr: "Log Analytics est l'outil qui vous donne des recommandations personnalisées pour vos ressources."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Azure Monitor works with Azure, on-premises and multicloud environments. Its alerts notify you when a condition that you defined is met, for example a metric above a threshold. Log Analytics is the tool for writing and running log queries; personalized recommendations come from Azure Advisor."
    fr: "Azure Monitor fonctionne avec les environnements Azure, locaux et multicloud. Ses alertes vous notifient quand une condition que vous avez définie est remplie, par exemple une métrique au-dessus d'un seuil. Log Analytics est l'outil qui sert à écrire et exécuter des requêtes de journal ; les recommandations personnalisées proviennent d'Azure Advisor."
references:
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
