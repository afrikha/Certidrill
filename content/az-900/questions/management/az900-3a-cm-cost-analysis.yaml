id: az900-3a-cm-cost-analysis
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank wants to see which resource groups generated the highest costs during the last billing cycle.

    What should Woodgrove Bank use?
  fr: |
    Woodgrove Bank veut voir quels groupes de ressources ont généré les coûts les plus élevés pendant le dernier cycle de facturation.

    Que doit utiliser Woodgrove Bank ?
body:
  options:
    - id: a
      text: { en: "The pricing calculator", fr: "La calculatrice de prix" }
    - id: b
      text: { en: "Azure Service Health", fr: "Azure Service Health" }
    - id: c
      text: { en: "Azure Policy", fr: "Azure Policy" }
    - id: d
      text: { en: "Cost analysis in Cost Management", fr: "L'analyse des coûts de Cost Management" }
answer: { optionId: d }
explanation:
  correct:
    en: Cost analysis is the part of Cost Management that explores and visualizes actual costs. It can aggregate them by subscription, resource group or service for a period such as a billing cycle, which shows where the costs accrue.
    fr: L'analyse des coûts est la partie de Cost Management qui explore et visualise les coûts réels. Elle peut les agréger par abonnement, groupe de ressources ou service sur une période comme un cycle de facturation, ce qui montre où les coûts s'accumulent.
  options:
    a:
      en: The pricing calculator estimates the cost of planned resources; it doesn't know what a subscription actually spent.
      fr: "La calculatrice de prix estime le coût de ressources prévues ; elle ignore ce qu'un abonnement a réellement dépensé."
    b:
      en: Azure Service Health reports incidents and planned maintenance of Azure services, not costs.
      fr: Azure Service Health signale les incidents et les maintenances planifiées des services Azure, pas les coûts.
    c:
      en: Azure Policy enforces and audits rules on the configuration of resources; it doesn't report spending.
      fr: "Azure Policy applique et audite des règles sur la configuration des ressources ; il ne rend pas compte des dépenses."
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
