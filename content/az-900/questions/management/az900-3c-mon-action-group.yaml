id: az900-3c-mon-action-group
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You create an Azure Monitor alert rule that fires when the CPU usage of a virtual machine exceeds 90%.

    What do you associate with the alert rule to define who is notified and which actions run when the alert fires?
  fr: |
    Vous créez une règle d'alerte Azure Monitor qui se déclenche quand l'utilisation du processeur d'une machine virtuelle dépasse 90 %.

    Qu'associez-vous à la règle d'alerte pour définir qui est notifié et quelles actions s'exécutent quand l'alerte se déclenche ?
body:
  options:
    - { id: a, text: { en: "An action group", fr: "Un groupe d'actions" } }
    - { id: b, text: { en: "A resource group", fr: "Un groupe de ressources" } }
    - { id: c, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: d, text: { en: "A network security group", fr: "Un groupe de sécurité réseau" } }
answer: { optionId: a }
explanation:
  correct:
    en: "An action group is a collection of notification preferences and automated actions. The alert rule defines the condition; the action group defines who is notified, for example by email or SMS, and what happens next."
    fr: "Un groupe d'actions est un ensemble de préférences de notification et d'actions automatisées. La règle d'alerte définit la condition ; le groupe d'actions définit qui est notifié, par exemple par e-mail ou par SMS, et ce qui se passe ensuite."
  options:
    b:
      en: "A resource group is a container that holds related resources."
      fr: "Un groupe de ressources est un conteneur qui regroupe des ressources liées."
    c:
      en: "A management group organizes subscriptions to apply governance to them."
      fr: "Un groupe d'administration organise des abonnements pour leur appliquer une gouvernance."
    d:
      en: "A network security group filters network traffic."
      fr: "Un groupe de sécurité réseau filtre le trafic réseau."
references:
  - title: Action groups
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
  - title: What are Azure Monitor alerts?
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
