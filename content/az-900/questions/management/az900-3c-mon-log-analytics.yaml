id: az900-3c-mon-log-analytics
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Azure Monitor tool do you use in the Azure portal to write and run queries on the log data that Azure Monitor collects?
  fr: |
    Quel outil d'Azure Monitor utilisez-vous dans le portail Azure pour écrire et exécuter des requêtes sur les données de journal collectées par Azure Monitor ?
body:
  options:
    - { id: a, text: Application Insights }
    - { id: b, text: Log Analytics }
    - { id: c, text: { en: "Azure Monitor alerts", fr: "Alertes Azure Monitor" } }
    - { id: d, text: { en: "Autoscale", fr: "Mise à l'échelle automatique" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Log Analytics is the tool in the Azure portal in which you edit and run log queries against the data stored by Azure Monitor, from a simple filter to an advanced analysis."
    fr: "Log Analytics est l'outil du portail Azure dans lequel vous modifiez et exécutez des requêtes de journal sur les données stockées par Azure Monitor, du simple filtre à l'analyse avancée."
  options:
    a:
      en: "Application Insights monitors the performance and usage of web applications."
      fr: "Application Insights surveille les performances et l'usage des applications web."
    c:
      en: "Alerts notify you when a condition is met; they are not a query tool."
      fr: "Les alertes vous notifient quand une condition est remplie ; ce n'est pas un outil de requête."
    d:
      en: "Autoscale adds or removes resources according to metrics or a schedule."
      fr: "La mise à l'échelle automatique ajoute ou retire des ressources selon des métriques ou une planification."
references:
  - title: Overview of Log Analytics in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview
