id: az900-3b-portal-yn-basics
objective: "3.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "You can use the Azure portal to monitor resources as well as to create and manage them.", fr: "Vous pouvez utiliser le portail Azure pour surveiller des ressources aussi bien que pour les créer et les gérer." } }
    - { id: s2, text: { en: "To use the Azure portal, you must install a desktop application on your computer.", fr: "Pour utiliser le portail Azure, vous devez installer une application de bureau sur votre ordinateur." } }
    - { id: s3, text: { en: "From the Azure portal, you can manage resources that are located in different Azure regions.", fr: "Depuis le portail Azure, vous pouvez gérer des ressources situées dans des régions Azure différentes." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The Azure portal is a web-based console: a supported browser is enough, with nothing to install. You can build, manage and monitor everything in it, from a simple web app to a complex deployment. It is a single, unified console for all the resources of your subscriptions, whatever their region."
    fr: "Le portail Azure est une console web : un navigateur pris en charge suffit, sans rien installer. Vous pouvez tout y créer, gérer et surveiller, d'une simple application web à un déploiement complexe. C'est une console unique et unifiée pour toutes les ressources de vos abonnements, quelle que soit leur région."
references:
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
