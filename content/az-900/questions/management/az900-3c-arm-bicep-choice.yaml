id: az900-3c-arm-bicep-choice
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware wants to describe its Azure resources in files, by using a declarative language that is designed for Azure and whose syntax is more concise than JSON.

    What should Litware use?
  fr: |
    Litware souhaite décrire ses ressources Azure dans des fichiers, à l'aide d'un langage déclaratif conçu pour Azure et dont la syntaxe est plus concise que le JSON.

    Que doit utiliser Litware ?
body:
  options:
    - { id: a, text: Bicep }
    - { id: b, text: Azure CLI }
    - { id: c, text: Azure PowerShell }
    - { id: d, text: Azure Cloud Shell }
answer: { optionId: a }
explanation:
  correct:
    en: "Bicep is a language that uses declarative syntax to deploy Azure resources. Its files are more concise and easier to read than the equivalent JSON templates."
    fr: "Bicep est un langage à syntaxe déclarative qui sert à déployer des ressources Azure. Ses fichiers sont plus concis et plus lisibles que les modèles JSON équivalents."
  options:
    b:
      en: "The Azure CLI runs commands one after the other: this is an imperative approach, not a declarative language."
      fr: "Azure CLI exécute des commandes les unes après les autres : c'est une approche impérative, pas un langage déclaratif."
    c:
      en: "Azure PowerShell is a set of cmdlets that you run or script: this is an imperative approach, not a declarative language."
      fr: "Azure PowerShell est un ensemble de cmdlets que vous exécutez ou scriptez : c'est une approche impérative, pas un langage déclaratif."
    d:
      en: "Cloud Shell is a browser-based shell that hosts the Azure CLI and Azure PowerShell; it is not a language."
      fr: "Cloud Shell est un interpréteur de commandes dans le navigateur qui héberge Azure CLI et Azure PowerShell ; ce n'est pas un langage."
references:
  - title: What is Bicep?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
