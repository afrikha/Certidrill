id: az900-3a-cm-budget-automation
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a monthly budget in Cost Management for the resource group of its test environment. When spending reaches 100% of the budget, the test virtual machines must be shut down without human intervention.

    What should Fabrikam do?
  fr: |
    Fabrikam dispose d'un budget mensuel dans Cost Management pour le groupe de ressources de son environnement de test. Quand les dépenses atteignent 100 % du budget, les machines virtuelles de test doivent être arrêtées sans intervention humaine.

    Que doit faire Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Add the finance team to the alert recipients of the budget.", fr: "Ajouter l'équipe financière aux destinataires des alertes du budget." }
    - id: b
      text: { en: "Apply a Read-only lock to the resource group of the test environment.", fr: "Appliquer un verrou Lecture seule au groupe de ressources de l'environnement de test." }
    - id: c
      text: { en: "Assign an Azure Policy that denies the creation of virtual machines.", fr: "Attribuer une stratégie Azure Policy qui refuse la création de machines virtuelles." }
    - id: d
      text: { en: "Configure the budget to trigger automation when the threshold is reached.", fr: "Configurer le budget pour qu'il déclenche une automatisation quand le seuil est atteint." }
answer: { optionId: d }
explanation:
  correct:
    en: By itself, a budget only notifies; it doesn't stop consumption. A budget can however trigger automation when a threshold is reached, for example through an action group, and this automation can shut down nonproduction resources such as the test virtual machines.
    fr: "Par lui-même, un budget ne fait qu'avertir ; il n'arrête pas la consommation. Un budget peut toutefois déclencher une automatisation quand un seuil est atteint, par exemple au moyen d'un groupe d'actions, et cette automatisation peut arrêter des ressources hors production comme les machines virtuelles de test."
  options:
    a:
      en: More recipients means more people are notified, but somebody still has to shut down the virtual machines manually.
      fr: Plus de destinataires, c'est plus de personnes averties, mais quelqu'un doit toujours arrêter les machines virtuelles à la main.
    b:
      en: A Read-only lock blocks modifications of the resources all the time, whatever the spending; it doesn't shut down virtual machines when a budget is reached.
      fr: "Un verrou Lecture seule bloque en permanence les modifications des ressources, quelles que soient les dépenses ; il n'arrête pas les machines virtuelles quand un budget est atteint."
    c:
      en: Such a policy prevents new virtual machines from being created; it doesn't react to spending and doesn't stop the machines that are running.
      fr: "Une telle stratégie empêche la création de nouvelles machines virtuelles ; elle ne réagit pas aux dépenses et n'arrête pas les machines en cours d'exécution."
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
  - title: "Tutorial: Create and manage budgets"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
