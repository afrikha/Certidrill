id: az900-3a-cm-pillars-dd
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answer that correctly completes each sentence about Cost Management.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement chaque phrase sur Cost Management.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[explore]] lets you explore and visualize costs, for example by region or by resource.

      [[limit]] sets a spending limit for a scope such as a subscription.

      [[notify]] notifies you when spending reaches a threshold.
    fr: |
      [[explore]] permet d'explorer et de visualiser les coûts, par exemple par région ou par ressource.

      [[limit]] fixe une limite de dépense pour une étendue comme un abonnement.

      [[notify]] vous avertit quand les dépenses atteignent un seuil.
  slots:
    - id: explore
      options:
        - { id: calc, text: { en: "The pricing calculator", fr: "La calculatrice de prix" } }
        - { id: analysis, text: { en: "Cost analysis", fr: "L'analyse des coûts" } }
        - { id: advisor, text: "Azure Advisor" }
    - id: limit
      options:
        - { id: budget, text: { en: "A budget", fr: "Un budget" } }
        - { id: resv, text: { en: "A reservation", fr: "Une réservation" } }
        - { id: lock, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
    - id: notify
      options:
        - { id: tag, text: { en: "A tag", fr: "Une étiquette" } }
        - { id: initiative, text: { en: "An initiative", fr: "Une initiative" } }
        - { id: alert, text: { en: "A cost alert", fr: "Une alerte de coût" } }
answer:
  values: { explore: analysis, limit: budget, notify: alert }
explanation:
  correct:
    en: Cost Management rests on three capabilities. Cost analysis gives a visual view of costs that you can break down in different ways, a budget sets a spending limit for a scope, and cost alerts tell you when spending reaches a threshold.
    fr: "Cost Management repose sur trois fonctionnalités. L'analyse des coûts donne une vue visuelle des coûts que vous pouvez ventiler de différentes façons, un budget fixe une limite de dépense pour une étendue, et les alertes de coût vous préviennent quand les dépenses atteignent un seuil."
  options:
    calc:
      en: The pricing calculator estimates the cost of planned resources; it doesn't show actual costs.
      fr: "La calculatrice de prix estime le coût de ressources prévues ; elle ne montre pas les coûts réels."
    resv:
      en: A reservation is a commitment that gives a discount, not a spending limit.
      fr: Une réservation est un engagement qui donne une remise, pas une limite de dépense.
    initiative:
      en: An initiative is a group of Azure Policy definitions.
      fr: Une initiative est un groupe de définitions Azure Policy.
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
