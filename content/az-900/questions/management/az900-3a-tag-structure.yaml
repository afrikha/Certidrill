id: az900-3a-tag-structure
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does a resource tag consist of?
  fr: |
    De quoi une étiquette de ressource se compose-t-elle ?
body:
  options:
    - id: a
      text: { en: "A name and a value", fr: "D'un nom et d'une valeur" }
    - id: b
      text: { en: "A role and a scope", fr: "D'un rôle et d'une étendue" }
    - id: c
      text: { en: "A rule and an effect", fr: "D'une règle et d'un effet" }
    - id: d
      text: { en: "A lock type and a note", fr: "D'un type de verrou et d'une note" }
answer: { optionId: a }
explanation:
  correct:
    en: A tag is a piece of metadata made of a name and a value, for example Environment = Production. A resource can carry one or more tags.
    fr: Une étiquette est une métadonnée composée d'un nom et d'une valeur, par exemple Environment = Production. Une ressource peut porter une ou plusieurs étiquettes.
  options:
    b:
      en: A role and a scope, with a security principal, describe an Azure RBAC role assignment.
      fr: Un rôle et une étendue, avec un principal de sécurité, décrivent une attribution de rôle Azure RBAC.
    c:
      en: A rule and an effect describe an Azure Policy definition.
      fr: Une règle et un effet décrivent une définition Azure Policy.
    d:
      en: A lock type, with an optional note, describes a resource lock.
      fr: Un type de verrou, avec une note facultative, décrit un verrou de ressource.
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
