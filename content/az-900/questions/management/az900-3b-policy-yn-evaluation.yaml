id: az900-3b-policy-yn-evaluation
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Policy evaluates only the resources that are created after a policy is assigned.", fr: "Azure Policy n'évalue que les ressources créées après l'attribution d'une stratégie." } }
    - { id: s2, text: { en: "Azure Policy can automatically remediate some noncompliant resources, for example by adding a missing tag.", fr: "Azure Policy peut corriger automatiquement certaines ressources non conformes, par exemple en ajoutant une étiquette manquante." } }
    - { id: s3, text: { en: "An initiative can be assigned to a resource group.", fr: "Une initiative peut être attribuée à un groupe de ressources." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure Policy also evaluates the resources that existed before the assignment and reports those that do not comply. Some policies can remediate noncompliant resources automatically, for example by adding a required tag that is missing. Like a single policy, an initiative is assigned to a scope: a management group, a subscription, a resource group or a resource."
    fr: "Azure Policy évalue aussi les ressources qui existaient avant l'attribution et signale celles qui ne sont pas conformes. Certaines stratégies peuvent corriger automatiquement des ressources non conformes, par exemple en ajoutant une étiquette obligatoire manquante. Comme une stratégie seule, une initiative s'attribue à une étendue : un groupe d'administration, un abonnement, un groupe de ressources ou une ressource."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
