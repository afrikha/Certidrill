id: az900-3b-arc-dd-sentence
objective: "3.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Arc extends Azure management to resources that run [[where]].

      To do so, it projects these resources into [[arm]].
    fr: |
      Azure Arc étend la gestion Azure aux ressources qui s'exécutent [[where]].

      Pour cela, il projette ces ressources dans [[arm]].
  slots:
    - id: where
      options:
        - { id: regions, text: { en: "only in Azure regions", fr: "uniquement dans des régions Azure" } }
        - { id: outside, text: { en: "outside Azure, on-premises or in other clouds", fr: "hors d'Azure, en local ou dans d'autres clouds" } }
        - { id: m365, text: { en: "only in Microsoft 365", fr: "uniquement dans Microsoft 365" } }
    - id: arm
      options:
        - { id: entra, text: "Microsoft Entra ID" }
        - { id: advisor, text: "Azure Advisor" }
        - { id: storage, text: { en: "Azure Storage", fr: "Stockage Azure" } }
        - { id: arm, text: "Azure Resource Manager" }
answer:
  values: { where: outside, arm: arm }
explanation:
  correct:
    en: "Azure Arc delivers a consistent management platform for on-premises and multicloud environments. It works with Azure Resource Manager: non-Azure resources are projected into it, which lets you manage them with the same tools as Azure resources."
    fr: "Azure Arc fournit une plateforme de gestion cohérente pour les environnements locaux et multiclouds. Il fonctionne avec Azure Resource Manager : les ressources non Azure y sont projetées, ce qui permet de les gérer avec les mêmes outils que les ressources Azure."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
