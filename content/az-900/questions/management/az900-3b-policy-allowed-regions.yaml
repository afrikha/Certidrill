id: az900-3b-policy-allowed-regions
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso must make sure that Azure resources are created only in the France Central and West Europe regions, whoever deploys them.

    Which Azure feature should Contoso use?
  fr: |
    Contoso doit s'assurer que les ressources Azure ne sont créées que dans les régions France Central et West Europe, quel que soit l'utilisateur qui les déploie.

    Quelle fonctionnalité Azure Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Policy" }
    - { id: b, text: { en: "Azure role-based access control (Azure RBAC)", fr: "Le contrôle d'accès en fonction du rôle Azure (Azure RBAC)" } }
    - { id: c, text: { en: "Resource locks", fr: "Les verrous de ressources" } }
    - { id: d, text: "Microsoft Purview" }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Policy enforces rules on the configuration of resources, such as the regions in which they can be created. A policy that allows only certain locations denies any deployment to another region, whatever the permissions of the user."
    fr: "Azure Policy applique des règles à la configuration des ressources, par exemple les régions dans lesquelles elles peuvent être créées. Une stratégie qui n'autorise que certains emplacements refuse tout déploiement dans une autre région, quelles que soient les autorisations de l'utilisateur."
  options:
    b:
      en: "Azure RBAC controls who can perform which actions at a scope; it does not restrict the regions of the resources that an authorized user creates."
      fr: "Azure RBAC contrôle qui peut effectuer quelles actions sur une étendue ; il ne limite pas les régions des ressources créées par un utilisateur autorisé."
    c:
      en: "A resource lock protects existing resources against deletion or modification; it does not control where new resources are created."
      fr: "Un verrou de ressource protège des ressources existantes contre la suppression ou la modification ; il ne contrôle pas l'endroit où de nouvelles ressources sont créées."
    d:
      en: "Microsoft Purview governs data (discovery, classification, lineage); it does not control the deployment of Azure resources."
      fr: "Microsoft Purview gouverne les données (découverte, classification, traçabilité) ; il ne contrôle pas le déploiement des ressources Azure."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
