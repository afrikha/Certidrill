id: az900-3b-lock-match-config
objective: "3.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A resource group named **RG1** contains a virtual machine named **VM1** and a storage account named **st1**.

    Match each requirement to the lock configuration that meets it. To answer, drag the appropriate configuration to each requirement. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de ressources nommé **RG1** contient une machine virtuelle nommée **VM1** et un compte de stockage nommé **st1**.

    Associez chaque exigence à la configuration de verrou qui y répond. Pour répondre, faites glisser la configuration appropriée vers chaque exigence. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: del-rg, text: { en: "Delete lock on RG1", fr: "Verrou Suppression sur RG1" } }
    - { id: ro-rg, text: { en: "Read-only lock on RG1", fr: "Verrou Lecture seule sur RG1" } }
    - { id: del-vm, text: { en: "Delete lock on VM1 only", fr: "Verrou Suppression sur VM1 uniquement" } }
    - { id: ro-vm, text: { en: "Read-only lock on VM1 only", fr: "Verrou Lecture seule sur VM1 uniquement" } }
  targets:
    - id: t1
      text: { en: "Authorized users can modify VM1 and st1, and neither of them can be deleted.", fr: "Les utilisateurs autorisés peuvent modifier VM1 et st1, et aucune des deux ressources ne peut être supprimée." }
    - id: t2
      text: { en: "Authorized users can view VM1 and st1, and neither of them can be modified.", fr: "Les utilisateurs autorisés peuvent consulter VM1 et st1, et aucune des deux ressources ne peut être modifiée." }
    - id: t3
      text: { en: "Authorized users can modify VM1 and can delete st1, and VM1 cannot be deleted.", fr: "Les utilisateurs autorisés peuvent modifier VM1 et supprimer st1, et VM1 ne peut pas être supprimée." }
answer:
  mapping: { t1: del-rg, t2: ro-rg, t3: del-vm }
explanation:
  correct:
    en: "A lock on a resource group is inherited by all its resources: a Delete lock on RG1 lets VM1 and st1 be modified but not deleted, and a Read-only lock on RG1 leaves them readable only. A Delete lock placed on VM1 alone protects only VM1 against deletion, so st1 can still be deleted. A Read-only lock on VM1 would block the modification of VM1."
    fr: "Un verrou sur un groupe de ressources est hérité par toutes ses ressources : un verrou Suppression sur RG1 permet de modifier VM1 et st1 mais pas de les supprimer, et un verrou Lecture seule sur RG1 ne les laisse accessibles qu'en lecture. Un verrou Suppression posé sur VM1 seule ne protège que VM1 contre la suppression : st1 peut donc toujours être supprimé. Un verrou Lecture seule sur VM1 bloquerait la modification de VM1."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
