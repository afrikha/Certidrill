id: az900-3a-calc-usage-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A project manager prepares the cost estimate of a new application with the pricing calculator.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un chef de projet prépare l'estimation du coût d'une nouvelle application avec la calculatrice de prix.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the application is deployed, the pricing calculator sends an alert when the actual costs exceed the estimate.
        fr: Une fois l'application déployée, la calculatrice de prix envoie une alerte quand les coûts réels dépassent l'estimation.
    - id: s2
      text:
        en: The project manager can save the estimate and modify it later.
        fr: Le chef de projet peut enregistrer l'estimation et la modifier plus tard.
    - id: s3
      text:
        en: For a storage account, the estimate takes into account options such as the access tier and the redundancy.
        fr: Pour un compte de stockage, l'estimation tient compte d'options comme le niveau d'accès et la redondance.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The pricing calculator has no link with deployed resources and never monitors spending; alerts on actual costs come from budgets in Cost Management. An estimate can be saved and reopened, which is useful when architecture decisions change. For storage, the calculator accounts for options such as the storage type, the access tier and the redundancy.
    fr: "La calculatrice de prix n'a aucun lien avec les ressources déployées et ne surveille jamais les dépenses ; les alertes sur les coûts réels viennent des budgets de Cost Management. Une estimation peut être enregistrée et rouverte, ce qui est utile quand les décisions d'architecture évoluent. Pour le stockage, la calculatrice tient compte d'options comme le type de stockage, le niveau d'accès et la redondance."
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
