id: az900-3b-lock-yn-basics
objective: "3.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A lock applied to a resource group also applies to the resources in the resource group.", fr: "Un verrou appliqué à un groupe de ressources s'applique aussi aux ressources de ce groupe." } }
    - { id: s2, text: { en: "Resource locks can be managed from the Azure portal, Azure PowerShell, and the Azure CLI.", fr: "Les verrous de ressources peuvent être gérés depuis le portail Azure, Azure PowerShell et Azure CLI." } }
    - { id: s3, text: { en: "A Delete lock prevents authorized users from modifying a resource.", fr: "Un verrou Suppression empêche les utilisateurs autorisés de modifier une ressource." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Locks are inherited from a resource group by its resources. A Delete lock blocks only deletion; authorized users can still read and modify the resource (it is the Read-only lock that blocks modifications). Locks can be managed from the Azure portal, Azure PowerShell, the Azure CLI or an Azure Resource Manager template."
    fr: "Les verrous d'un groupe de ressources sont hérités par ses ressources. Un verrou Suppression ne bloque que la suppression ; les utilisateurs autorisés peuvent toujours lire et modifier la ressource (c'est le verrou Lecture seule qui bloque les modifications). Les verrous se gèrent depuis le portail Azure, Azure PowerShell, Azure CLI ou un modèle Azure Resource Manager."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
