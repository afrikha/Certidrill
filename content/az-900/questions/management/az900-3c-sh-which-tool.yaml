id: az900-3c-sh-which-tool
objective: "3.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An administrator asks two questions about virtual machines that run in the France Central region.

    Which tool answers each question? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur se pose deux questions sur des machines virtuelles qui s'exécutent dans la région France Central.

    Quel outil répond à chaque question ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      "Does Azure currently have an outage in the region where my virtual machines run?": [[q1]]

      "What was the CPU usage of my virtual machines over the last hour?": [[q2]]
    fr: |
      « Azure subit-il en ce moment une panne dans la région où s'exécutent mes machines virtuelles ? » : [[q1]]

      « Quelle a été l'utilisation du processeur de mes machines virtuelles pendant la dernière heure ? » : [[q2]]
  slots:
    - id: q1
      options:
        - { id: adv, text: Azure Advisor }
        - { id: mon, text: Azure Monitor }
        - { id: sh, text: Azure Service Health }
        - { id: arm, text: Azure Resource Manager }
    - id: q2
      options:
        - { id: adv, text: Azure Advisor }
        - { id: mon, text: Azure Monitor }
        - { id: sh, text: Azure Service Health }
        - { id: arm, text: Azure Resource Manager }
answer:
  values: { q1: sh, q2: mon }
explanation:
  correct:
    en: "Azure Service Health tells you about the health of the Azure platform for the services and regions that you use, including outages in progress. The CPU usage of a virtual machine is a metric of your own resource: metrics are collected and displayed by Azure Monitor."
    fr: "Azure Service Health vous informe de l'état de santé de la plateforme Azure pour les services et les régions que vous utilisez, y compris les pannes en cours. L'utilisation du processeur d'une machine virtuelle est une métrique de votre propre ressource : les métriques sont collectées et affichées par Azure Monitor."
  options:
    adv:
      en: "Azure Advisor recommends improvements; it reports neither platform outages nor the metrics of a resource over time."
      fr: "Azure Advisor recommande des améliorations ; il ne signale pas les pannes de la plateforme et n'affiche pas les métriques d'une ressource dans le temps."
    arm:
      en: "Azure Resource Manager is the deployment and management layer of Azure, not a monitoring tool."
      fr: "Azure Resource Manager est la couche de déploiement et de gestion d'Azure, pas un outil de surveillance."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
  - title: Azure Monitor overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview
