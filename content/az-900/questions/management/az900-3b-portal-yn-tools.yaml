id: az900-3b-portal-yn-tools
objective: "3.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A policy that denies the creation of resources in a region applies to a deployment made from the Azure portal as it does to a deployment made with the Azure CLI.", fr: "Une stratégie qui refuse la création de ressources dans une région s'applique à un déploiement effectué depuis le portail Azure comme à un déploiement effectué avec Azure CLI." } }
    - { id: s2, text: { en: "A Delete lock that was created in the Azure portal also blocks a deletion attempted with Azure PowerShell.", fr: "Un verrou Suppression créé dans le portail Azure bloque aussi une suppression tentée avec Azure PowerShell." } }
    - { id: s3, text: { en: "To deploy the same set of 50 resources every week, the Azure portal is less error-prone than a script or a template.", fr: "Pour déployer chaque semaine le même ensemble de 50 ressources, le portail Azure est moins sujet aux erreurs qu'un script ou un modèle." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The portal, the Azure CLI and Azure PowerShell all send their requests to Azure Resource Manager, which is where policies and locks are enforced: the tool used makes no difference. For repetitive deployments, a script or a template runs the same steps every time, whereas repeating manual steps in the portal is slower and invites mistakes."
    fr: "Le portail, Azure CLI et Azure PowerShell envoient tous leurs requêtes à Azure Resource Manager, et c'est là que les stratégies et les verrous sont appliqués : l'outil utilisé ne change rien. Pour des déploiements répétitifs, un script ou un modèle exécute les mêmes étapes à chaque fois, alors que répéter des étapes manuelles dans le portail est plus lent et favorise les erreurs."
references:
  - title: Describe Azure Resource Manager and Azure ARM templates
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
