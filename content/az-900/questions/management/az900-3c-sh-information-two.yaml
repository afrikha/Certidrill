id: az900-3c-sh-information-two
objective: "3.4.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two types of information does Azure Service Health provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux types d'informations fournis par Azure Service Health ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The service issues that currently affect the Azure services that you use", fr: "Les problèmes de service qui touchent actuellement les services Azure que vous utilisez" } }
    - { id: b, text: { en: "The recommendations that would reduce the cost of your resources", fr: "Les recommandations qui réduiraient le coût de vos ressources" } }
    - { id: c, text: { en: "The planned maintenance that might affect the Azure services that you use", fr: "La maintenance planifiée susceptible de toucher les services Azure que vous utilisez" } }
    - { id: d, text: { en: "The response times of the pages of your web application", fr: "Les temps de réponse des pages de votre application web" } }
    - { id: e, text: { en: "The compliance of your resources with the rules of your organization", fr: "La conformité de vos ressources aux règles de votre organisation" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Service Health provides a personalized view of the Azure services and regions that you use, with communications about outages (service issues), planned maintenance and health advisories."
    fr: "Service Health fournit une vue personnalisée des services et des régions Azure que vous utilisez, avec des communications sur les pannes (problèmes de service), la maintenance planifiée et les avis d'intégrité."
  options:
    b:
      en: "Cost recommendations are made by Azure Advisor."
      fr: "Les recommandations de coût sont formulées par Azure Advisor."
    d:
      en: "The response times of a web application are measured by Application Insights."
      fr: "Les temps de réponse d'une application web sont mesurés par Application Insights."
    e:
      en: "The compliance of resources with organizational rules is evaluated by Azure Policy."
      fr: "La conformité des ressources aux règles de l'organisation est évaluée par Azure Policy."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
