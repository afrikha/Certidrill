id: az900-3b-portal-mobile-app
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An on-call engineer wants to receive push notifications about alerts and to check the health of Azure resources from a smartphone.

    What should the engineer use?
  fr: |
    Un ingénieur d'astreinte souhaite recevoir des notifications push sur les alertes et vérifier l'intégrité de ressources Azure depuis un smartphone.

    Que doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Storage Explorer", fr: "L'Explorateur Stockage Azure" } }
    - { id: b, text: { en: "The Azure mobile app", fr: "L'application mobile Azure" } }
    - { id: c, text: "Azure Arc" }
    - { id: d, text: "Azure Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Azure mobile app, available for iOS and Android, lets you monitor the status and health of resources, receive push notifications and alerts, and perform common operations such as starting or stopping a virtual machine."
    fr: "L'application mobile Azure, disponible pour iOS et Android, permet de surveiller l'état et l'intégrité des ressources, de recevoir des notifications push et des alertes, et d'effectuer des opérations courantes comme démarrer ou arrêter une machine virtuelle."
  options:
    a:
      en: "Azure Storage Explorer is a desktop application for managing the data of storage accounts."
      fr: "L'Explorateur Stockage Azure est une application de bureau qui sert à gérer les données des comptes de stockage."
    c:
      en: "Azure Arc extends Azure management to resources located outside Azure; it is not a mobile application."
      fr: "Azure Arc étend la gestion Azure aux ressources situées hors d'Azure ; ce n'est pas une application mobile."
    d:
      en: "Azure Advisor gives recommendations about reliability, security, performance and cost; it is not an application for following resources from a phone."
      fr: "Azure Advisor fournit des recommandations de fiabilité, de sécurité, de performances et de coût ; ce n'est pas une application de suivi des ressources depuis un téléphone."
references:
  - title: What is the Azure mobile app?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/mobile-app/overview
