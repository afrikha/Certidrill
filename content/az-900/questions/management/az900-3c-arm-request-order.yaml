id: az900-3c-arm-request-order
objective: "3.3.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    An administrator runs an Azure CLI command to create a storage account.

    Which three events occur in sequence? To answer, move the appropriate events from the list of events to the answer area and arrange them in the correct order.
  fr: |
    Un administrateur exécute une commande Azure CLI pour créer un compte de stockage.

    Quels sont les trois événements qui se produisent, dans l'ordre ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: direct, text: { en: "The Azure CLI sends the request directly to the Azure Storage service.", fr: "Azure CLI envoie la requête directement au service Stockage Azure." } }
    - { id: fwd, text: { en: "Azure Resource Manager sends the request to the Azure Storage service, which creates the account.", fr: "Azure Resource Manager envoie la requête au service Stockage Azure, qui crée le compte." } }
    - { id: send, text: { en: "The Azure CLI sends the request to Azure Resource Manager.", fr: "Azure CLI envoie la requête à Azure Resource Manager." } }
    - { id: portal, text: { en: "The Azure portal converts the command to an ARM template.", fr: "Le portail Azure convertit la commande en modèle ARM." } }
    - { id: auth, text: { en: "Azure Resource Manager authenticates and authorizes the request.", fr: "Azure Resource Manager authentifie et autorise la requête." } }
answer:
  sequence: [ send, auth, fwd ]
explanation:
  correct:
    en: |
      Every request from an Azure tool, API or SDK is received by Azure Resource Manager. Resource Manager authenticates and authorizes the request, and then forwards it to the Azure service that performs the action. Because all tools use this same path, they give consistent results.
    fr: |
      Toute requête émise par un outil, une API ou un SDK Azure est reçue par Azure Resource Manager. Resource Manager authentifie et autorise la requête, puis la transmet au service Azure qui effectue l'action. Comme tous les outils empruntent ce même chemin, ils donnent des résultats cohérents.
  options:
    direct: { en: "Management tools do not call the Azure service directly; the request goes through Azure Resource Manager.", fr: "Les outils de gestion n'appellent pas directement le service Azure ; la requête passe par Azure Resource Manager." }
    portal: { en: "The portal is another tool that talks to Azure Resource Manager; it plays no part in an Azure CLI command.", fr: "Le portail est un autre outil qui s'adresse à Azure Resource Manager ; il n'intervient pas dans une commande Azure CLI." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
