id: az900-3a-cm-alert-types-drag
objective: "3.1.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Match each situation to the type of alert that it generates.

    To answer, drag the appropriate alert type to each situation. Each alert type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque situation au type d'alerte qu'elle génère.

    Pour répondre, faites glisser le type d'alerte approprié vers chaque situation. Chaque type d'alerte peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: budget, text: { en: "Budget alert", fr: "Alerte de budget" } }
    - { id: credit, text: { en: "Credit alert", fr: "Alerte de crédit" } }
    - { id: quota, text: { en: "Department spending quota alert", fr: "Alerte de quota de dépense de service" } }
    - { id: health, text: { en: "Service Health alert", fr: "Alerte Service Health" } }
    - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
  targets:
    - id: t1
      text: { en: "The spending of a resource group reaches 80% of the monthly limit that an administrator defined in Cost Management.", fr: "Les dépenses d'un groupe de ressources atteignent 80 % de la limite mensuelle qu'un administrateur a définie dans Cost Management." }
    - id: t2
      text: { en: "An organization with an Enterprise Agreement has consumed 90% of its Azure Prepayment.", fr: "Une organisation sous Contrat Entreprise a consommé 90 % de son Paiement anticipé Azure (Azure Prepayment)." }
    - id: t3
      text: { en: "In an organization with an Enterprise Agreement, the spending of one business unit reaches a fixed threshold of the amount allotted to it.", fr: "Dans une organisation sous Contrat Entreprise, les dépenses d'une entité atteignent un seuil fixe du montant qui lui est alloué." }
answer:
  mapping: { t1: budget, t2: credit, t3: quota }
explanation:
  correct:
    en: Cost alerts group three alert types. A budget alert fires when spending reaches a threshold of a budget that you defined. A credit alert is generated automatically at 90% and at 100% of the Azure Prepayment balance of an organization with an Enterprise Agreement. A department spending quota alert, also specific to Enterprise Agreements, fires when the spending of a department reaches a fixed threshold of its quota.
    fr: "Les alertes de coût regroupent trois types d'alertes. Une alerte de budget se déclenche quand les dépenses atteignent un seuil d'un budget que vous avez défini. Une alerte de crédit est générée automatiquement à 90 % et à 100 % du solde du Paiement anticipé Azure d'une organisation sous Contrat Entreprise. Une alerte de quota de dépense de service, elle aussi propre aux Contrats Entreprise, se déclenche quand les dépenses d'un service (department) atteignent un seuil fixe de son quota."
  options:
    health:
      en: A Service Health alert concerns incidents and maintenance of Azure services, not spending.
      fr: Une alerte Service Health concerne les incidents et les maintenances des services Azure, pas les dépenses.
    metric:
      en: A metric alert of Azure Monitor fires on a performance value such as CPU usage, not on costs.
      fr: Une alerte de métrique d'Azure Monitor se déclenche sur une valeur de performance comme l'utilisation du processeur, pas sur les coûts.
references:
  - title: Use cost alerts to monitor usage and spending
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
