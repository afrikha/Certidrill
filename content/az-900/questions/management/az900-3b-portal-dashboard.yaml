id: az900-3b-portal-dashboard
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manager wants to see, on a single page of the Azure portal, charts and tiles for the resources of her project, arranged as she chooses.

    What should she create?
  fr: |
    Une responsable souhaite voir, sur une seule page du portail Azure, des graphiques et des vignettes concernant les ressources de son projet, disposés à sa convenance.

    Que doit-elle créer ?
body:
  options:
    - { id: a, text: { en: "A dashboard", fr: "Un tableau de bord" } }
    - { id: b, text: { en: "A resource group", fr: "Un groupe de ressources" } }
    - { id: c, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: d, text: { en: "A budget", fr: "Un budget" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A dashboard is a customizable page of the Azure portal made of tiles. It gives a focused, organized view of the resources that matter most to a user, a project or a team."
    fr: "Un tableau de bord est une page personnalisable du portail Azure, composée de vignettes. Il donne une vue ciblée et organisée des ressources qui comptent le plus pour un utilisateur, un projet ou une équipe."
  options:
    b:
      en: "A resource group is a container for resources; it is not a customizable view with charts."
      fr: "Un groupe de ressources est un conteneur de ressources ; ce n'est pas une vue personnalisable avec des graphiques."
    c:
      en: "A management group organizes subscriptions to apply governance; it displays nothing."
      fr: "Un groupe d'administration organise des abonnements pour y appliquer la gouvernance ; il n'affiche rien."
    d:
      en: "A budget tracks spending against a threshold; it is not a page that gathers charts and tiles."
      fr: "Un budget suit les dépenses par rapport à un seuil ; ce n'est pas une page qui réunit graphiques et vignettes."
references:
  - title: Create a dashboard in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-dashboards
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
