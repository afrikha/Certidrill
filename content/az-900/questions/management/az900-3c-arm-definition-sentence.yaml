id: az900-3c-arm-definition-sentence
objective: "3.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[svc]] is the deployment and management service for Azure. It lets you manage your infrastructure through [[kind]] templates rather than scripts.
    fr: |
      [[svc]] est le service de déploiement et de gestion d'Azure. Il permet de gérer votre infrastructure au moyen de modèles [[kind]] plutôt que de scripts.
  slots:
    - id: svc
      options:
        - { id: arc, text: Azure Arc }
        - { id: arm, text: Azure Resource Manager }
        - { id: adv, text: Azure Advisor }
        - { id: pol, text: Azure Policy }
    - id: kind
      options:
        - { id: imp, text: { en: "imperative", fr: "impératifs" } }
        - { id: int, text: { en: "interactive", fr: "interactifs" } }
        - { id: dec, text: { en: "declarative", fr: "déclaratifs" } }
answer:
  values: { svc: arm, kind: dec }
explanation:
  correct:
    en: "Azure Resource Manager is the deployment and management service for Azure: it provides the management layer used to create, update and delete resources. One of its benefits is that infrastructure can be managed through declarative templates, which state what to deploy, rather than through scripts, which list the commands to run."
    fr: "Azure Resource Manager est le service de déploiement et de gestion d'Azure : il fournit la couche de gestion qui sert à créer, mettre à jour et supprimer les ressources. L'un de ses avantages est de gérer l'infrastructure par des modèles déclaratifs, qui indiquent ce qu'il faut déployer, plutôt que par des scripts, qui énumèrent les commandes à exécuter."
  options:
    arc:
      en: "Azure Arc extends Azure management to resources outside Azure; it is not the deployment service of Azure."
      fr: "Azure Arc étend la gestion Azure aux ressources situées hors d'Azure ; ce n'est pas le service de déploiement d'Azure."
    imp:
      en: "Imperative describes scripts: a list of commands to run in order."
      fr: "Impératif qualifie les scripts : une liste de commandes à exécuter dans l'ordre."
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
