id: az900-3a-tag-table-hotarea
objective: "3.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A subscription contains two resource groups. **RG1** has the tag `Department = Finance` and **RG2** has the tag `Department = HR`. No Azure Policy is assigned. The resources and the tags that were applied directly to them are shown in the following table.

    Answer each prompt by selecting the appropriate resource.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un abonnement contient deux groupes de ressources. **RG1** porte l'étiquette `Department = Finance` et **RG2** porte l'étiquette `Department = HR`. Aucune stratégie Azure Policy n'est attribuée. Les ressources et les étiquettes qui leur ont été appliquées directement figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la ressource appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The resource that is returned when you filter the resources on the tag Department = Finance", fr: "La ressource renvoyée quand vous filtrez les ressources sur l'étiquette Department = Finance" }
    - id: p2
      text: { en: "The resource that is returned when you filter the resources on the tag Department = HR", fr: "La ressource renvoyée quand vous filtrez les ressources sur l'étiquette Department = HR" }
  grid:
    header: [{ en: "Resource", fr: "Ressource" }, { en: "Resource group", fr: "Groupe de ressources" }, { en: "Tags of the resource", fr: "Étiquettes de la ressource" }]
    rows:
      - [{ text: vm1, area: vm1 }, { text: RG1 }, { text: "Department = HR" }]
      - [{ text: st1, area: st1 }, { text: RG1 }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: sql1, area: sql1 }, { text: RG2 }, { text: "Department = Finance" }]
      - [{ text: app1, area: app1 }, { text: RG2 }, { text: "Environment = Prod" }]
answer:
  values: { p1: sql1, p2: vm1 }
explanation:
  correct:
    en: Resources don't inherit the tags of their resource group, so only the tags applied directly to a resource count. The only resource tagged Department = Finance is sql1, although it is in RG2, and the only resource tagged Department = HR is vm1, although it is in RG1. To make resources take the tag of their resource group, an Azure Policy would have to be assigned.
    fr: "Les ressources n'héritent pas des étiquettes de leur groupe de ressources : seules comptent les étiquettes appliquées directement à une ressource. La seule ressource étiquetée Department = Finance est sql1, bien qu'elle se trouve dans RG2, et la seule ressource étiquetée Department = HR est vm1, bien qu'elle se trouve dans RG1. Pour que les ressources reprennent l'étiquette de leur groupe de ressources, il faudrait attribuer une stratégie Azure Policy."
  options:
    st1:
      en: st1 is in RG1 but has no tag of its own, and it doesn't receive Department = Finance from RG1.
      fr: st1 se trouve dans RG1 mais n'a aucune étiquette propre, et il ne reçoit pas Department = Finance de RG1.
    app1:
      en: app1 is in RG2 but carries only Environment = Prod; it doesn't receive Department = HR from RG2.
      fr: "app1 se trouve dans RG2 mais ne porte que Environment = Prod ; il ne reçoit pas Department = HR de RG2."
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
