id: az900-3c-arm-bicep-conversion
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at Contoso writes a Bicep file that declares a virtual network, and then deploys the file to Azure.

    What happens to the Bicep file during the deployment?
  fr: |
    Un développeur de Contoso écrit un fichier Bicep qui déclare un réseau virtuel, puis déploie ce fichier dans Azure.

    Qu'advient-il du fichier Bicep pendant le déploiement ?
body:
  options:
    - { id: a, text: { en: "It is converted to Azure CLI commands that run one after the other.", fr: "Il est converti en commandes Azure CLI exécutées l'une après l'autre." } }
    - { id: b, text: { en: "It is converted to an Azure PowerShell script that runs in Cloud Shell.", fr: "Il est converti en script Azure PowerShell exécuté dans Cloud Shell." } }
    - { id: c, text: { en: "It is converted to an ARM template that Azure Resource Manager processes.", fr: "Il est converti en modèle ARM traité par Azure Resource Manager." } }
    - { id: d, text: { en: "It is sent to the networking service without going through Azure Resource Manager.", fr: "Il est envoyé au service réseau sans passer par Azure Resource Manager." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Bicep is an abstraction over ARM templates. During deployment, the Bicep file is converted to an ARM template in JSON, and Azure Resource Manager deploys the resources that it describes."
    fr: "Bicep est une abstraction des modèles ARM. Pendant le déploiement, le fichier Bicep est converti en modèle ARM au format JSON, et Azure Resource Manager déploie les ressources qu'il décrit."
  options:
    a:
      en: "A Bicep file is declarative; it is not translated to a sequence of Azure CLI commands."
      fr: "Un fichier Bicep est déclaratif ; il n'est pas traduit en une suite de commandes Azure CLI."
    b:
      en: "A Bicep file is not translated to a PowerShell script, and its deployment does not depend on Cloud Shell."
      fr: "Un fichier Bicep n'est pas traduit en script PowerShell, et son déploiement ne dépend pas de Cloud Shell."
    d:
      en: "Every deployment request goes through Azure Resource Manager, which then calls the Azure service."
      fr: "Toute requête de déploiement passe par Azure Resource Manager, qui appelle ensuite le service Azure."
references:
  - title: What is Bicep?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
