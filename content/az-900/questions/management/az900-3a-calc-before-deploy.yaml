id: az900-3a-calc-before-deploy
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to deploy ten virtual machines and an Azure SQL database. Before deploying anything, the company needs an estimate of the monthly cost.

    Which tool should Northwind Traders use?
  fr: |
    Northwind Traders prévoit de déployer dix machines virtuelles et une base de données Azure SQL. Avant tout déploiement, l'entreprise a besoin d'une estimation du coût mensuel.

    Quel outil Northwind Traders doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Cost analysis in Cost Management", fr: "L'analyse des coûts de Cost Management" }
    - id: b
      text: { en: "Azure Advisor", fr: "Azure Advisor" }
    - id: c
      text: { en: "The pricing calculator", fr: "La calculatrice de prix" }
    - id: d
      text: { en: "Azure Monitor", fr: "Azure Monitor" }
answer: { optionId: c }
explanation:
  correct:
    en: The pricing calculator estimates the cost of resources that you plan to provision. You add the products, set their options and obtain an estimated monthly cost, without deploying anything.
    fr: La calculatrice de prix estime le coût des ressources que vous prévoyez d'approvisionner. Vous ajoutez les produits, vous réglez leurs options et vous obtenez un coût mensuel estimé, sans rien déployer.
  options:
    a:
      en: Cost analysis shows the costs of resources that are already deployed; here nothing is deployed yet.
      fr: "L'analyse des coûts montre les coûts des ressources déjà déployées ; ici, rien n'est encore déployé."
    b:
      en: Azure Advisor gives recommendations based on the usage of existing resources.
      fr: Azure Advisor donne des recommandations fondées sur l'utilisation de ressources existantes.
    d:
      en: Azure Monitor collects metrics and logs from resources; it doesn't estimate prices.
      fr: "Azure Monitor collecte les métriques et les journaux des ressources ; il n'estime pas de prix."
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
