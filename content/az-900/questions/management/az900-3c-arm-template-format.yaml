id: az900-3c-arm-template-format
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company plans to describe its Azure infrastructure in Azure Resource Manager (ARM) templates that are stored in a source code repository.

    In which format is an ARM template written?
  fr: |
    Votre entreprise prévoit de décrire son infrastructure Azure dans des modèles Azure Resource Manager (ARM) stockés dans un référentiel de code source.

    Dans quel format un modèle ARM est-il écrit ?
body:
  options:
    - { id: a, text: YAML }
    - { id: b, text: XML }
    - { id: c, text: JSON }
    - { id: d, text: HCL }
answer: { optionId: c }
explanation:
  correct:
    en: "An ARM template is a JavaScript Object Notation (JSON) file that defines the resources to deploy and their properties. Because it is a text file, it can be stored and versioned in a source repository like application code."
    fr: "Un modèle ARM est un fichier JSON (JavaScript Object Notation) qui définit les ressources à déployer et leurs propriétés. Comme il s'agit d'un fichier texte, il peut être stocké et versionné dans un référentiel de code source, comme le code de l'application."
  options:
    a:
      en: "YAML is used by other tools, such as pipeline definitions, but not by ARM templates."
      fr: "YAML est utilisé par d'autres outils, par exemple pour définir des pipelines, mais pas par les modèles ARM."
    b:
      en: "ARM templates are not XML documents."
      fr: "Les modèles ARM ne sont pas des documents XML."
    d:
      en: "HCL is the configuration language of Terraform, a third-party infrastructure as code tool."
      fr: "HCL est le langage de configuration de Terraform, un outil tiers d'infrastructure en tant que code."
references:
  - title: What are ARM templates?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
