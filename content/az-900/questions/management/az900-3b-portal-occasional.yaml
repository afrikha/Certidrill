id: az900-3b-portal-occasional
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A support technician who has no scripting experience must occasionally create a virtual machine by following guided forms.

    Which tool should the technician use?
  fr: |
    Un technicien du support, sans expérience des scripts, doit créer de temps en temps une machine virtuelle en suivant des formulaires guidés.

    Quel outil ce technicien doit-il utiliser ?
body:
  options:
    - { id: a, text: "Azure CLI" }
    - { id: b, text: { en: "The Azure portal", fr: "Le portail Azure" } }
    - { id: c, text: "Azure PowerShell" }
    - { id: d, text: { en: "ARM templates", fr: "Les modèles ARM" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Azure portal is a web-based console with a graphical interface and guided forms for creating resources. It suits occasional tasks performed by someone who does not write commands or scripts."
    fr: "Le portail Azure est une console web dotée d'une interface graphique et de formulaires guidés pour créer des ressources. Il convient aux tâches occasionnelles effectuées par une personne qui n'écrit ni commandes ni scripts."
  options:
    a:
      en: "The Azure CLI is a command-line tool: the technician would have to learn its commands."
      fr: "Azure CLI est un outil en ligne de commande : le technicien devrait en apprendre les commandes."
    c:
      en: "Azure PowerShell runs cmdlets in a shell; it offers no guided forms."
      fr: "Azure PowerShell exécute des cmdlets dans un shell ; il n'offre pas de formulaires guidés."
    d:
      en: "An ARM template is a JSON file that describes resources; writing one requires more skills than an occasional task justifies."
      fr: "Un modèle ARM est un fichier JSON qui décrit des ressources ; en écrire un demande plus de compétences que ne le justifie une tâche occasionnelle."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
