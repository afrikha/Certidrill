id: az900-3b-lock-dd-behavior
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A resource lock applies [[who]].

      Once applied, a lock is [[perm]].
    fr: |
      Un verrou de ressource s'applique [[who]].

      Une fois appliqué, un verrou est [[perm]].
  slots:
    - id: who
      options:
        - { id: readers, text: { en: "only to users who have the Reader role", fr: "uniquement aux utilisateurs qui ont le rôle Reader" } }
        - { id: all, text: { en: "to all users, whatever their Azure RBAC role", fr: "à tous les utilisateurs, quel que soit leur rôle Azure RBAC" } }
        - { id: nonowners, text: { en: "only to users who are not owners of the resource", fr: "uniquement aux utilisateurs qui ne sont pas propriétaires de la ressource" } }
    - id: perm
      options:
        - { id: auto, text: { en: "removed automatically after 30 days", fr: "retiré automatiquement au bout de 30 jours" } }
        - { id: forever, text: { en: "permanent and can never be removed", fr: "définitif et ne peut plus jamais être retiré" } }
        - { id: until, text: { en: "kept until an authorized user removes it", fr: "conservé jusqu'à ce qu'un utilisateur autorisé le retire" } }
answer:
  values: { who: all, perm: until }
explanation:
  correct:
    en: "A lock applies across all users and roles: even the owner of a resource is blocked while the lock exists. A lock has no expiration and is not permanent either: a user who has the required permissions, such as an owner, removes it and can then perform the operation that was blocked."
    fr: "Un verrou s'applique à tous les utilisateurs et à tous les rôles : même le propriétaire d'une ressource est bloqué tant que le verrou existe. Un verrou n'expire pas et n'est pas non plus définitif : un utilisateur qui a les autorisations requises, par exemple un propriétaire, le retire et peut ensuite effectuer l'opération qui était bloquée."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
