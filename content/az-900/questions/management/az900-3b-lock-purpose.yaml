id: az900-3b-lock-purpose
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the purpose of a resource lock in Azure?
  fr: |
    Quel est le but d'un verrou de ressource dans Azure ?
body:
  options:
    - { id: a, text: { en: "To restrict the regions in which resources can be created", fr: "Limiter les régions dans lesquelles des ressources peuvent être créées" } }
    - { id: b, text: { en: "To encrypt the data that resources store at rest", fr: "Chiffrer au repos les données stockées par les ressources" } }
    - { id: c, text: { en: "To limit the amount that resources can cost each month", fr: "Plafonner le coût mensuel des ressources" } }
    - { id: d, text: { en: "To prevent resources from being deleted or changed by accident", fr: "Empêcher la suppression ou la modification accidentelle de ressources" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A resource lock prevents resources from being accidentally deleted or changed. Azure RBAC alone does not stop a user who has sufficient rights from deleting a critical resource by mistake; a lock adds that protection."
    fr: "Un verrou de ressource empêche la suppression ou la modification accidentelle de ressources. Azure RBAC seul n'empêche pas un utilisateur qui a les droits suffisants de supprimer par erreur une ressource critique ; un verrou ajoute cette protection."
  options:
    a:
      en: "Restricting the allowed regions is done with Azure Policy."
      fr: "Limiter les régions autorisées se fait avec Azure Policy."
    b:
      en: "A lock has no effect on encryption; it only blocks deletion or modification operations."
      fr: "Un verrou n'a aucun effet sur le chiffrement ; il bloque seulement des opérations de suppression ou de modification."
    c:
      en: "A lock does not control spending; costs are followed with Cost Management and budgets."
      fr: "Un verrou ne contrôle pas les dépenses ; les coûts se suivent avec Cost Management et les budgets."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
