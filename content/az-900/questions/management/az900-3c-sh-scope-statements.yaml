id: az900-3c-sh-scope-statements
objective: "3.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Azure status page shows only the incidents that affect the services used in your subscriptions."
        fr: "La page État d'Azure n'affiche que les incidents qui touchent les services utilisés dans vos abonnements."
    - id: s2
      text:
        en: "In Service Health, you can configure alerts to be notified of service issues."
        fr: "Dans Service Health, vous pouvez configurer des alertes pour être notifié des problèmes de service."
    - id: s3
      text:
        en: "Resource Health reports on the health of an individual resource, such as one virtual machine."
        fr: "Resource Health rend compte de l'état de santé d'une ressource individuelle, par exemple une machine virtuelle."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure status is a global, public view of the health of Azure services in all regions; it is not personalized. Service Health is the personalized view, and it lets you set up alerts on service issues, planned maintenance and health advisories. Resource Health works at the level of your individual resources."
    fr: "État d'Azure est une vue mondiale et publique de l'état de santé des services Azure dans toutes les régions ; elle n'est pas personnalisée. Service Health est la vue personnalisée, et il permet de configurer des alertes sur les problèmes de service, la maintenance planifiée et les avis d'intégrité. Resource Health travaille au niveau de vos ressources individuelles."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
