id: az900-3b-arc-yn-not
objective: "3.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Arc provides a private network connection between an on-premises datacenter and Azure.", fr: "Azure Arc fournit une connexion réseau privée entre un centre de données local et Azure." } }
    - { id: s2, text: { en: "Azure Monitor can collect data from servers that are connected through Azure Arc.", fr: "Azure Monitor peut collecter des données de serveurs connectés par Azure Arc." } }
    - { id: s3, text: { en: "Resources that are connected through Azure Arc appear in the Azure portal alongside Azure resources.", fr: "Les ressources connectées par Azure Arc apparaissent dans le portail Azure aux côtés des ressources Azure." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure Arc is a management service, not a connectivity service: connections between a datacenter and Azure are provided by ExpressRoute or a VPN gateway. Once a server is connected through Azure Arc, familiar Azure services such as Azure Monitor can be used on it. Because the resources are projected into Azure Resource Manager, they are visible and manageable in the portal, the Azure CLI and Azure PowerShell like Azure resources."
    fr: "Azure Arc est un service de gestion, pas un service de connectivité : les connexions entre un centre de données et Azure sont fournies par ExpressRoute ou une passerelle VPN. Une fois un serveur connecté par Azure Arc, les services Azure habituels, comme Azure Monitor, peuvent y être utilisés. Comme les ressources sont projetées dans Azure Resource Manager, elles sont visibles et gérables dans le portail, Azure CLI et Azure PowerShell comme des ressources Azure."
references:
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
