id: az900-3a-purview-capabilities-drag
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the Microsoft Purview capability that it describes.

    To answer, drag the appropriate capability to each description. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la fonctionnalité de Microsoft Purview qu'elle décrit.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque description. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lineage, text: { en: "End-to-end data lineage", fr: "Traçabilité des données de bout en bout" } }
    - { id: georep, text: { en: "Geo-redundant replication", fr: "Réplication géoredondante" } }
    - { id: discovery, text: { en: "Automated data discovery", fr: "Découverte automatisée des données" } }
    - { id: softdelete, text: { en: "Soft delete", fr: "Suppression réversible" } }
    - { id: classification, text: { en: "Sensitive data classification", fr: "Classification des données sensibles" } }
  targets:
    - id: t1
      text: { en: "Scans the data sources to build a map of the data that the organization holds.", fr: "Analyse les sources de données pour construire une carte des données que détient l'organisation." }
    - id: t2
      text: { en: "Recognizes information such as credit card numbers and labels it.", fr: "Reconnaît des informations comme des numéros de carte de crédit et les étiquette." }
    - id: t3
      text: { en: "Shows where data comes from and how it moves from one system to another.", fr: "Montre d'où viennent les données et comment elles passent d'un système à un autre." }
answer:
  mapping: { t1: discovery, t2: classification, t3: lineage }
explanation:
  correct:
    en: Microsoft Purview keeps you up to date on your data landscape with three capabilities. Automated data discovery scans the sources and maps the data estate, sensitive data classification recognizes and labels sensitive information, and end-to-end data lineage shows the origin of data and its path across systems.
    fr: "Microsoft Purview vous tient informé de votre paysage de données grâce à trois fonctionnalités. La découverte automatisée des données analyse les sources et cartographie le patrimoine de données, la classification des données sensibles reconnaît et étiquette les informations sensibles, et la traçabilité des données de bout en bout montre l'origine des données et leur parcours entre les systèmes."
  options:
    georep:
      en: Geo-redundant replication is a redundancy option of Azure Storage that copies data to a second region; it isn't a Purview capability.
      fr: "La réplication géoredondante est une option de redondance de Stockage Azure qui copie les données dans une seconde région ; ce n'est pas une fonctionnalité de Purview."
    softdelete:
      en: Soft delete keeps deleted data recoverable for a retention period in services such as Azure Storage; it isn't a Purview capability.
      fr: "La suppression réversible garde les données supprimées récupérables pendant une période de rétention dans des services comme Stockage Azure ; ce n'est pas une fonctionnalité de Purview."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
