id: az900-3b-iac-source-control
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team wants to review every change to its infrastructure definitions and to keep the history of these changes.

    Where should the team store its infrastructure as code files?
  fr: |
    Une équipe souhaite relire chaque modification de ses définitions d'infrastructure et conserver l'historique de ces modifications.

    Où l'équipe doit-elle stocker ses fichiers d'infrastructure en tant que code ?
body:
  options:
    - { id: a, text: { en: "In the tags of each deployed resource", fr: "Dans les étiquettes de chaque ressource déployée" } }
    - { id: b, text: { en: "In a dashboard of the Azure portal", fr: "Dans un tableau de bord du portail Azure" } }
    - { id: c, text: { en: "In the notes of a resource lock", fr: "Dans les notes d'un verrou de ressource" } }
    - { id: d, text: { en: "In a source control repository", fr: "Dans un référentiel de contrôle de code source" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Infrastructure as code applies versioning to infrastructure: the definition files are kept in source control like application code. Every change is recorded, can be reviewed before it is applied, and the team changes the environment by editing the source."
    fr: "L'infrastructure en tant que code applique le contrôle de version à l'infrastructure : les fichiers de définition sont conservés dans le contrôle de code source, comme le code applicatif. Chaque modification est enregistrée et peut être relue avant d'être appliquée, et l'équipe change l'environnement en modifiant la source."
  options:
    a:
      en: "Tags are name-value pairs used to organize resources; they do not store files or their history."
      fr: "Les étiquettes sont des paires nom-valeur qui servent à organiser les ressources ; elles ne stockent ni fichiers ni historique."
    b:
      en: "A dashboard displays tiles about resources; it is not a place to version files."
      fr: "Un tableau de bord affiche des vignettes sur les ressources ; ce n'est pas un endroit où versionner des fichiers."
    c:
      en: "The notes of a lock are a short free text that explains the lock; they keep no history of definitions."
      fr: "Les notes d'un verrou sont un court texte libre qui explique le verrou ; elles ne conservent aucun historique de définitions."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
