id: az900-3b-portal-resilience
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes the availability of the Azure portal?
  fr: |
    Quelle affirmation décrit la disponibilité du portail Azure ?
body:
  options:
    - { id: a, text: { en: "It is present in every Azure datacenter and is updated without downtime.", fr: "Il est présent dans chaque centre de données Azure et se met à jour sans interruption." } }
    - { id: b, text: { en: "It is hosted in the region that you select when you create a subscription.", fr: "Il est hébergé dans la région que vous choisissez à la création d'un abonnement." } }
    - { id: c, text: { en: "It is taken offline for a maintenance window once a month.", fr: "Il est mis hors ligne une fois par mois pour une fenêtre de maintenance." } }
    - { id: d, text: { en: "It is replicated only between the two regions of a region pair.", fr: "Il n'est répliqué qu'entre les deux régions d'une paire de régions." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Azure portal is designed for continuous availability: it maintains a presence in every Azure datacenter, which makes it resilient to the failure of an individual datacenter. It is updated continuously and requires no downtime for maintenance."
    fr: "Le portail Azure est conçu pour une disponibilité continue : il est présent dans chaque centre de données Azure, ce qui lui permet de résister à la panne d'un centre de données. Il est mis à jour en continu et ne demande aucune interruption pour maintenance."
  options:
    b:
      en: "The portal is not tied to a region chosen by the customer; a subscription has no region."
      fr: "Le portail n'est pas lié à une région choisie par le client ; un abonnement n'a pas de région."
    c:
      en: "The portal needs no maintenance downtime: its updates are continuous."
      fr: "Le portail ne demande aucune interruption de maintenance : ses mises à jour sont continues."
    d:
      en: "Region pairs concern the replication of some services and data; the portal is present in all datacenters."
      fr: "Les paires de régions concernent la réplication de certains services et données ; le portail est présent dans tous les centres de données."
references:
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
