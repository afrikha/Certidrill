id: az900-3a-calc-other-tool
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cloud architect uses the pricing calculator for most cost questions.

    Which task requires a different tool?
  fr: |
    Un architecte cloud utilise la calculatrice de prix pour la plupart des questions de coût.

    Quelle tâche nécessite un autre outil ?
body:
  options:
    - id: a
      text: { en: "Estimating the monthly cost of a virtual machine that is planned for next quarter", fr: "Estimer le coût mensuel d'une machine virtuelle prévue pour le trimestre prochain" }
    - id: b
      text: { en: "Comparing the estimated cost of a storage account in two regions", fr: "Comparer le coût estimé d'un compte de stockage dans deux régions" }
    - id: c
      text: { en: "Adding the price of a support plan to the estimate of a solution", fr: "Ajouter le prix d'un plan de support à l'estimation d'une solution" }
    - id: d
      text: { en: "Viewing what each resource group of a subscription cost last month", fr: "Consulter ce que chaque groupe de ressources d'un abonnement a coûté le mois dernier" }
answer: { optionId: d }
explanation:
  correct:
    en: The pricing calculator only estimates the cost of resources that you describe to it; it has no access to what a subscription really consumed. Actual costs, for example by resource group for the last billing cycle, are shown by cost analysis in Cost Management.
    fr: "La calculatrice de prix ne fait qu'estimer le coût des ressources que vous lui décrivez ; elle n'a pas accès à ce qu'un abonnement a réellement consommé. Les coûts réels, par exemple par groupe de ressources pour le dernier cycle de facturation, sont affichés par l'analyse des coûts de Cost Management."
  options:
    a:
      en: Estimating the cost of a planned resource is exactly what the pricing calculator does.
      fr: Estimer le coût d'une ressource prévue est précisément le rôle de la calculatrice de prix.
    b:
      en: The region is an option of each product in the calculator, so the same configuration can be estimated in several regions.
      fr: "La région est une option de chaque produit dans la calculatrice : une même configuration peut donc être estimée dans plusieurs régions."
    c:
      en: An estimate can include a support plan.
      fr: Une estimation peut inclure un plan de support.
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
