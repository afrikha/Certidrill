id: az900-3b-iac-definition
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does infrastructure as code (IaC) mean?
  fr: |
    Que signifie l'infrastructure en tant que code (IaC) ?
body:
  options:
    - { id: a, text: { en: "Hosting the source code of applications on Azure virtual machines", fr: "Héberger le code source des applications sur des machines virtuelles Azure" } }
    - { id: b, text: { en: "Managing infrastructure through code and templates instead of manual configuration", fr: "Gérer l'infrastructure par du code et des modèles plutôt que par une configuration manuelle" } }
    - { id: c, text: { en: "Converting applications into containers before they are deployed to Azure", fr: "Convertir les applications en conteneurs avant leur déploiement dans Azure" } }
    - { id: d, text: { en: "Running application code without managing any underlying infrastructure", fr: "Exécuter le code des applications sans gérer aucune infrastructure sous-jacente" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Infrastructure as code means managing infrastructure through code and templates rather than through manual configuration. Files describe the networks, virtual machines and other resources to deploy, and a tool creates them."
    fr: "L'infrastructure en tant que code consiste à gérer l'infrastructure par du code et des modèles plutôt que par une configuration manuelle. Des fichiers décrivent les réseaux, les machines virtuelles et les autres ressources à déployer, et un outil les crée."
  options:
    a:
      en: "Where the application source code is hosted has nothing to do with how the infrastructure is defined."
      fr: "L'endroit où le code source des applications est hébergé n'a aucun rapport avec la façon dont l'infrastructure est définie."
    c:
      en: "This describes containerization, a way of packaging applications, not a way of managing infrastructure."
      fr: "Cela décrit la conteneurisation, une façon d'empaqueter les applications, pas une façon de gérer l'infrastructure."
    d:
      en: "This describes serverless computing. With infrastructure as code, the infrastructure still exists; it is described in files."
      fr: "Cela décrit l'informatique serverless. Avec l'infrastructure en tant que code, l'infrastructure existe toujours ; elle est décrite dans des fichiers."
references:
  - title: Describe Azure Resource Manager and Azure ARM templates
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
