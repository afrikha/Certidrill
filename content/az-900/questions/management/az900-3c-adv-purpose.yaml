id: az900-3c-adv-purpose
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company runs several workloads in Azure. You need personalized recommendations, based on best practices, to improve the reliability, security and performance of the resources and to reduce costs.

    Which Azure service should you use?
  fr: |
    Votre entreprise exécute plusieurs charges de travail dans Azure. Vous avez besoin de recommandations personnalisées, fondées sur les bonnes pratiques, pour améliorer la fiabilité, la sécurité et les performances des ressources et pour réduire les coûts.

    Quel service Azure devez-vous utiliser ?
body:
  options:
    - { id: a, text: Azure Monitor }
    - { id: b, text: Azure Advisor }
    - { id: c, text: Azure Service Health }
    - { id: d, text: Azure Policy }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Advisor evaluates your resources and makes personalized recommendations, with proposed actions, in five categories: reliability, security, performance, operational excellence and cost."
    fr: "Azure Advisor évalue vos ressources et formule des recommandations personnalisées, avec les actions proposées, dans cinq catégories : fiabilité, sécurité, performances, excellence opérationnelle et coût."
  options:
    a:
      en: "Azure Monitor collects and analyzes metrics and logs; it shows what resources are doing, but does not issue best-practice recommendations."
      fr: "Azure Monitor collecte et analyse des métriques et des journaux ; il montre ce que font les ressources, mais ne formule pas de recommandations de bonnes pratiques."
    c:
      en: "Azure Service Health informs you of the health of the Azure platform: service issues, planned maintenance and health advisories."
      fr: "Azure Service Health vous informe de l'état de santé de la plateforme Azure : problèmes de service, maintenance planifiée et avis d'intégrité."
    d:
      en: "Azure Policy enforces rules on resources and reports their compliance; it does not recommend improvements."
      fr: "Azure Policy applique des règles aux ressources et rend compte de leur conformité ; il ne recommande pas d'améliorations."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
