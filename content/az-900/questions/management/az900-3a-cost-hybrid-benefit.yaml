id: az900-3a-cost-hybrid-benefit
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam owns Windows Server and SQL Server licenses with active Software Assurance. The company plans to migrate its servers to Azure virtual machines and wants to reuse these licenses to reduce costs.

    What should Fabrikam use?
  fr: |
    Fabrikam possède des licences Windows Server et SQL Server avec une Software Assurance active. L'entreprise prévoit de migrer ses serveurs vers des machines virtuelles Azure et veut réutiliser ces licences pour réduire les coûts.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Azure Spot Virtual Machines", fr: "Des machines virtuelles Azure Spot" }
    - id: b
      text: { en: "An Azure reservation", fr: "Une réservation Azure" }
    - id: c
      text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" }
    - id: d
      text: { en: "An Azure free account", fr: "Un compte gratuit Azure" }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Hybrid Benefit lets a company use its on-premises Windows Server and SQL Server licenses that have Software Assurance, or qualifying subscription licenses, in Azure. The license part of the price is then covered, which reduces the cost of the virtual machines.
    fr: Azure Hybrid Benefit permet à une entreprise d'utiliser dans Azure ses licences locales Windows Server et SQL Server couvertes par la Software Assurance, ou des licences par abonnement éligibles. La part du prix liée à la licence est alors couverte, ce qui réduit le coût des machines virtuelles.
  options:
    a:
      en: Spot virtual machines use unused Azure capacity at a lower price and can be evicted; they have nothing to do with existing licenses.
      fr: "Les machines virtuelles Spot utilisent la capacité Azure inutilisée à un prix réduit et peuvent être évincées ; elles n'ont aucun rapport avec des licences existantes."
    b:
      en: A reservation is a one-year or three-year commitment that lowers compute costs; it doesn't reuse licenses and doesn't cover Windows software costs.
      fr: "Une réservation est un engagement d'un ou trois ans qui réduit le coût du calcul ; elle ne réutilise pas de licences et ne couvre pas le coût des logiciels Windows."
    d:
      en: A free account gives a credit and free services for a limited time; it isn't a way to reuse licenses that the company already owns.
      fr: "Un compte gratuit donne un crédit et des services gratuits pendant une durée limitée ; ce n'est pas un moyen de réutiliser des licences que l'entreprise possède déjà."
references:
  - title: Azure Hybrid Benefit for Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/get-started/azure-hybrid-benefit
  - title: What are Azure Reservations?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
