id: az900-3b-arc-yn-subtle
objective: "3.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure RBAC can be used to control who manages a server that is connected through Azure Arc.", fr: "Azure RBAC peut servir à contrôler qui gère un serveur connecté par Azure Arc." } }
    - { id: s2, text: { en: "With Azure Arc, databases that are hosted at another cloud provider can be managed as if they ran in Azure.", fr: "Avec Azure Arc, des bases de données hébergées chez un autre fournisseur de cloud peuvent être gérées comme si elles s'exécutaient dans Azure." } }
    - { id: s3, text: { en: "Azure Arc is required to manage, from one place, Azure virtual machines that are located in several Azure regions.", fr: "Azure Arc est nécessaire pour gérer, depuis un seul endroit, des machines virtuelles Azure situées dans plusieurs régions Azure." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A resource connected through Azure Arc is projected into Azure Resource Manager, so the usual management capabilities apply to it, including access control with Azure RBAC. Azure Arc lets you manage multicloud and hybrid virtual machines, Kubernetes clusters and databases as if they ran in Azure. Azure virtual machines are already Azure resources: whatever their region, they are managed through Azure Resource Manager without Azure Arc, which targets resources outside Azure."
    fr: "Une ressource connectée par Azure Arc est projetée dans Azure Resource Manager : les capacités de gestion habituelles s'y appliquent donc, y compris le contrôle d'accès avec Azure RBAC. Azure Arc permet de gérer des machines virtuelles, des clusters Kubernetes et des bases de données multiclouds et hybrides comme s'ils s'exécutaient dans Azure. Les machines virtuelles Azure sont déjà des ressources Azure : quelle que soit leur région, elles se gèrent par Azure Resource Manager sans Azure Arc, qui vise les ressources hors d'Azure."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
