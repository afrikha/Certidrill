id: az900-3b-iac-drift
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Proseware, the development, test, and production environments were configured by hand and have drifted apart: a defect appears only in production.

    What should Proseware do to keep the three environments consistent?
  fr: |
    Chez Proseware, les environnements de développement, de test et de production ont été configurés à la main et ont fini par diverger : un défaut n'apparaît qu'en production.

    Que doit faire Proseware pour garder les trois environnements cohérents ?
body:
  options:
    - { id: a, text: { en: "Apply a Read-only lock to each environment", fr: "Appliquer un verrou Lecture seule à chaque environnement" } }
    - { id: b, text: { en: "Create a shared dashboard for each environment", fr: "Créer un tableau de bord partagé pour chaque environnement" } }
    - { id: c, text: { en: "Deploy each environment from the same definition files", fr: "Déployer chaque environnement à partir des mêmes fichiers de définition" } }
    - { id: d, text: { en: "Assign the Reader role to all the developers", fr: "Attribuer le rôle Reader à tous les développeurs" } }
answer: { optionId: c }
explanation:
  correct:
    en: "This is infrastructure as code, which was designed to solve environment drift: the same definition produces the same environment every time it is deployed. Deploying development, test and production from the same files keeps them consistent and avoids defects caused by configuration differences."
    fr: "C'est l'infrastructure en tant que code, conçue pour résoudre la dérive des environnements : la même définition produit le même environnement à chaque déploiement. Déployer le développement, le test et la production à partir des mêmes fichiers les garde cohérents et évite les défauts dus à des différences de configuration."
  options:
    a:
      en: "A lock freezes an environment in its current state, differences included, and prevents the changes needed to realign it."
      fr: "Un verrou fige un environnement dans son état actuel, différences comprises, et empêche les changements nécessaires pour le réaligner."
    b:
      en: "A dashboard displays the resources; it does not make their configurations identical."
      fr: "Un tableau de bord affiche les ressources ; il ne rend pas leurs configurations identiques."
    d:
      en: "Limiting the developers to read access does not correct the existing differences and does not make future deployments identical."
      fr: "Limiter les développeurs à la lecture ne corrige pas les différences existantes et ne rend pas identiques les déploiements futurs."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
