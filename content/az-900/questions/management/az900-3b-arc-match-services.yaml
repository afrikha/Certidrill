id: az900-3b-arc-match-services
objective: "3.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an on-premises datacenter. Match each requirement to the Azure service that meets it. To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders possède un centre de données local. Associez chaque exigence au service Azure qui y répond. Pour répondre, faites glisser le service approprié vers chaque exigence. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: arc, text: "Azure Arc" }
    - { id: migrate, text: "Azure Migrate" }
    - { id: er, text: "Azure ExpressRoute" }
    - { id: databox, text: "Azure Data Box" }
    - { id: filesync, text: "Azure File Sync" }
  targets:
    - id: t1
      text: { en: "Assess the on-premises servers, then move them to Azure virtual machines", fr: "Évaluer les serveurs locaux, puis les déplacer vers des machines virtuelles Azure" }
    - id: t2
      text: { en: "Apply Azure governance to servers that must remain in the datacenter", fr: "Appliquer la gouvernance Azure à des serveurs qui doivent rester dans le centre de données" }
    - id: t3
      text: { en: "Connect the datacenter to Azure over a private connection that does not use the internet", fr: "Relier le centre de données à Azure par une connexion privée qui n'emprunte pas Internet" }
answer:
  mapping: { t1: migrate, t2: arc, t3: er }
explanation:
  correct:
    en: "Azure Migrate assesses on-premises workloads and migrates them to Azure. Azure Arc leaves the servers where they are and extends Azure management and governance to them. ExpressRoute provides a private connection between a datacenter and Azure that does not go over the public internet. Azure Data Box ships large volumes of data on a physical device, and Azure File Sync synchronizes file shares."
    fr: "Azure Migrate évalue des charges de travail locales et les migre vers Azure. Azure Arc laisse les serveurs là où ils sont et leur étend la gestion et la gouvernance d'Azure. ExpressRoute fournit une connexion privée entre un centre de données et Azure qui ne passe pas par l'Internet public. Azure Data Box transporte de gros volumes de données sur un appareil physique, et Azure File Sync synchronise des partages de fichiers."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
