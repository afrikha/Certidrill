id: az900-3a-purview-sources
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores data in Azure SQL Database, in on-premises SQL Server databases and in Amazon S3.

    Which of these data sources can the unified data governance of Microsoft Purview cover?
  fr: |
    Fabrikam stocke des données dans Azure SQL Database, dans des bases de données SQL Server locales et dans Amazon S3.

    Lesquelles de ces sources de données la gouvernance unifiée des données de Microsoft Purview peut-elle couvrir ?
body:
  options:
    - id: a
      text: { en: "Only the data stored in Azure", fr: "Uniquement les données stockées dans Azure" }
    - id: b
      text: { en: "Only the data stored in Azure and on-premises", fr: "Uniquement les données stockées dans Azure et en local" }
    - id: c
      text: { en: "Only the data stored in Azure and in Amazon S3", fr: "Uniquement les données stockées dans Azure et dans Amazon S3" }
    - id: d
      text: { en: "The data stored in all three locations", fr: "Les données stockées dans les trois emplacements" }
answer: { optionId: d }
explanation:
  correct:
    en: Microsoft Purview brings together insights about on-premises, multicloud and SaaS data. Its unified data governance manages data in Azure, in SQL and Hive databases, on-premises and in other clouds such as Amazon S3, so all three locations can be covered.
    fr: "Microsoft Purview rassemble des informations sur les données locales, multiclouds et SaaS. Sa gouvernance unifiée des données gère les données dans Azure, dans des bases SQL et Hive, en local et dans d'autres clouds comme Amazon S3 : les trois emplacements peuvent donc être couverts."
  options:
    a:
      en: Purview isn't limited to Azure; it is designed for data that lives in many places.
      fr: "Purview ne se limite pas à Azure ; il est conçu pour des données qui se trouvent à de nombreux endroits."
    b:
      en: Other clouds, such as Amazon S3, are covered too.
      fr: Les autres clouds, comme Amazon S3, sont couverts eux aussi.
    c:
      en: On-premises data is covered too.
      fr: Les données locales sont couvertes elles aussi.
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
