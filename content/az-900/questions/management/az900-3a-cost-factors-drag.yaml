id: az900-3a-cost-factors-drag
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each situation to the cost factor that it illustrates.

    To answer, drag the appropriate cost factor to each situation. Each cost factor may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque situation au facteur de coût qu'elle illustre.

    Pour répondre, faites glisser le facteur de coût approprié vers chaque situation. Chaque facteur de coût peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: restype, text: { en: "Resource type", fr: "Type de ressource" } }
    - { id: consumption, text: { en: "Consumption", fr: "Consommation" } }
    - { id: maintenance, text: { en: "Maintenance", fr: "Maintenance" } }
    - { id: geography, text: { en: "Geography", fr: "Zone géographique" } }
    - { id: subtype, text: { en: "Subscription type", fr: "Type d'abonnement" } }
    - { id: marketplace, text: { en: "Azure Marketplace", fr: "Place de marché Azure" } }
  targets:
    - id: t1
      text: { en: "A disk left behind by a deleted virtual machine is still billed.", fr: "Un disque laissé par une machine virtuelle supprimée est toujours facturé." }
    - id: t2
      text: { en: "A new customer receives a credit to spend during the first 30 days.", fr: "Un nouveau client reçoit un crédit à dépenser pendant les 30 premiers jours." }
    - id: t3
      text: { en: "A preconfigured firewall appliance from a third-party vendor is billed with the vendor's own fees.", fr: "Une appliance de pare-feu préconfigurée d'un fournisseur tiers est facturée avec les frais propres à ce fournisseur." }
    - id: t4
      text: { en: "Changing the redundancy option of a storage account changes its price.", fr: "Changer l'option de redondance d'un compte de stockage change son prix." }
answer:
  mapping: { t1: maintenance, t2: subtype, t3: marketplace, t4: restype }
explanation:
  correct:
    en: Maintenance covers the resources that remain after a virtual machine is deleted and keep costing until someone removes them. The free trial is a subscription type that includes a credit for the first 30 days. Azure Marketplace solutions come from third-party vendors who set their own billing structure. The settings of a resource, such as the redundancy of a storage account, belong to the resource type factor.
    fr: "La maintenance couvre les ressources qui subsistent après la suppression d'une machine virtuelle et continuent de coûter tant que personne ne les supprime. L'essai gratuit est un type d'abonnement qui inclut un crédit pour les 30 premiers jours. Les solutions de la Place de marché Azure viennent de fournisseurs tiers qui fixent leur propre mode de facturation. Les réglages d'une ressource, comme la redondance d'un compte de stockage, relèvent du facteur type de ressource."
  options:
    geography:
      en: Geography explains price differences between regions, which none of the situations describes.
      fr: La zone géographique explique les écarts de prix entre régions, ce qu'aucune des situations ne décrit.
    consumption:
      en: Consumption concerns how you pay for usage, pay-as-you-go or with a commitment, which none of the situations describes.
      fr: La consommation concerne la façon de payer l'utilisation, à l'utilisation ou avec un engagement, ce qu'aucune des situations ne décrit.
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
