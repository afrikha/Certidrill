id: az900-3c-adv-tasks-two
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks can you perform by using Azure Advisor?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches que vous pouvez effectuer à l'aide d'Azure Advisor ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "View the maintenance that Microsoft plans in the regions that you use.", fr: "Consulter la maintenance que Microsoft planifie dans les régions que vous utilisez." } }
    - { id: b, text: { en: "Identify underused virtual machines that could be resized to reduce costs.", fr: "Identifier les machines virtuelles sous-utilisées qui pourraient être redimensionnées pour réduire les coûts." } }
    - { id: c, text: { en: "Run queries on the logs that are collected from your resources.", fr: "Exécuter des requêtes sur les journaux collectés depuis vos ressources." } }
    - { id: d, text: { en: "Estimate the monthly cost of resources before you deploy them.", fr: "Estimer le coût mensuel de ressources avant de les déployer." } }
    - { id: e, text: { en: "Get recommendations that improve the security of your resources.", fr: "Obtenir des recommandations qui améliorent la sécurité de vos ressources." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Advisor analyzes the usage of your resources and recommends, in its cost category, resizing or shutting down underused virtual machines. Its security category lists recommendations about threats and vulnerabilities that might lead to breaches."
    fr: "Advisor analyse l'utilisation de vos ressources et recommande, dans sa catégorie Coût, de redimensionner ou d'arrêter les machines virtuelles sous-utilisées. Sa catégorie Sécurité regroupe les recommandations sur les menaces et les vulnérabilités qui pourraient mener à des violations."
  options:
    a:
      en: "Planned maintenance is shown by Azure Service Health."
      fr: "La maintenance planifiée est affichée par Azure Service Health."
    c:
      en: "Log queries are run in Log Analytics, a tool of Azure Monitor."
      fr: "Les requêtes de journal s'exécutent dans Log Analytics, un outil d'Azure Monitor."
    d:
      en: "Estimating the cost of resources that are not yet deployed is the role of the pricing calculator."
      fr: "Estimer le coût de ressources qui ne sont pas encore déployées est le rôle de la calculatrice de prix."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
