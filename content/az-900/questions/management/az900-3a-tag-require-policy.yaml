id: az900-3a-tag-require-policy
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants Azure to refuse the creation of any resource that has no CostCenter tag.

    What should Northwind Traders use?
  fr: |
    Northwind Traders veut qu'Azure refuse la création de toute ressource dépourvue d'étiquette CostCenter.

    Que doit utiliser Northwind Traders ?
body:
  options:
    - id: a
      text: { en: "Azure role-based access control (RBAC)", fr: "Le contrôle d'accès en fonction du rôle Azure (RBAC)" }
    - id: b
      text: { en: "A resource lock", fr: "Un verrou de ressource" }
    - id: c
      text: { en: "Azure Policy", fr: "Azure Policy" }
    - id: d
      text: { en: "Microsoft Purview", fr: "Microsoft Purview" }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Policy can enforce tagging rules and conventions. A policy that requires a tag on resources denies the deployment of any resource created without that tag, whoever creates it.
    fr: Azure Policy peut imposer des règles et des conventions d'étiquetage. Une stratégie qui exige une étiquette sur les ressources refuse le déploiement de toute ressource créée sans cette étiquette, quel que soit son auteur.
  options:
    a:
      en: Azure RBAC decides who can perform which actions; it doesn't check the properties of the resources being created, such as their tags.
      fr: "Azure RBAC décide qui peut effectuer quelles actions ; il ne vérifie pas les propriétés des ressources créées, comme leurs étiquettes."
    b:
      en: A resource lock prevents the deletion or modification of existing resources; it doesn't validate new resources.
      fr: "Un verrou de ressource empêche la suppression ou la modification de ressources existantes ; il ne valide pas les nouvelles ressources."
    d:
      en: Microsoft Purview governs data, with discovery, classification and lineage; it doesn't control resource deployments.
      fr: "Microsoft Purview gouverne les données, avec la découverte, la classification et la traçabilité ; il ne contrôle pas les déploiements de ressources."
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
