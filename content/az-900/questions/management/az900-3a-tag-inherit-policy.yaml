id: az900-3a-tag-inherit-policy
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Each resource group of Tailspin Toys has a Department tag. The resources inside the resource groups don't have this tag. Tailspin Toys wants the resources to receive the Department tag of their resource group automatically, including the resources that are created later.

    What should Tailspin Toys do?
  fr: |
    Chaque groupe de ressources de Tailspin Toys porte une étiquette Department. Les ressources que contiennent ces groupes ne portent pas cette étiquette. Tailspin Toys veut que les ressources reçoivent automatiquement l'étiquette Department de leur groupe de ressources, y compris les ressources créées plus tard.

    Que doit faire Tailspin Toys ?
body:
  options:
    - id: a
      text: { en: "Apply the Department tag again to each resource group so that the resources pick it up.", fr: "Appliquer de nouveau l'étiquette Department à chaque groupe de ressources pour que les ressources la reprennent." }
    - id: b
      text: { en: "Assign an Azure Policy definition that makes resources inherit the tag from their resource group.", fr: "Attribuer une définition Azure Policy qui fait hériter les ressources de l'étiquette de leur groupe de ressources." }
    - id: c
      text: { en: "Create a budget in Cost Management that is filtered on the Department tag of each resource group.", fr: "Créer dans Cost Management un budget filtré sur l'étiquette Department de chaque groupe de ressources." }
    - id: d
      text: { en: "Assign the Tag Contributor role to the owners of each resource group so that they can tag resources.", fr: "Attribuer le rôle Tag Contributor aux propriétaires de chaque groupe de ressources pour qu'ils puissent étiqueter les ressources." }
answer: { optionId: b }
explanation:
  correct:
    en: Resources don't inherit the tags of their resource group or subscription. To copy a tag from a parent scope to the resources, you assign an Azure Policy definition such as the built-in policy that inherits a tag from the resource group. It applies to new resources, and existing resources can be remediated.
    fr: "Les ressources n'héritent pas des étiquettes de leur groupe de ressources ni de leur abonnement. Pour copier une étiquette d'une étendue parente vers les ressources, vous attribuez une définition Azure Policy, par exemple la stratégie intégrée qui hérite une étiquette du groupe de ressources. Elle s'applique aux nouvelles ressources, et les ressources existantes peuvent être corrigées."
  options:
    a:
      en: Tags of a resource group never flow down by themselves, however many times they are applied.
      fr: Les étiquettes d'un groupe de ressources ne descendent jamais d'elles-mêmes, quel que soit le nombre de fois où elles sont appliquées.
    c:
      en: A budget follows spending and sends alerts; it doesn't write tags on resources.
      fr: "Un budget suit les dépenses et envoie des alertes ; il n'écrit pas d'étiquettes sur les ressources."
    d:
      en: The role lets people manage tags, but they would still have to tag every resource manually, now and for each future resource.
      fr: Ce rôle permet de gérer les étiquettes, mais il faudrait encore étiqueter chaque ressource à la main, aujourd'hui et pour chaque ressource future.
references:
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
