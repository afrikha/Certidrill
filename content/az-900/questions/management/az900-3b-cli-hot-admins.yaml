id: az900-3b-cli-hot-admins
objective: "3.3.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Four administrators of Adatum manage Azure from the computers described in the following table. Each computer has a web browser, and no additional software can be installed on any of them.

    Answer each prompt by selecting the appropriate administrator.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quatre administrateurs d'Adatum gèrent Azure depuis les ordinateurs décrits dans le tableau suivant. Chaque ordinateur dispose d'un navigateur web, et aucun logiciel supplémentaire ne peut y être installé.

    Répondez à chaque consigne en sélectionnant l'administrateur approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The administrator who can run, on the local computer, a Bash script that contains az commands", fr: "L'administrateur qui peut exécuter, sur l'ordinateur local, un script Bash contenant des commandes az" }
    - id: p2
      text: { en: "The administrator for whom Azure Cloud Shell is the only way to use a command line for Azure", fr: "L'administrateur pour qui Azure Cloud Shell est le seul moyen d'utiliser une ligne de commande pour Azure" }
  grid:
    header: [{ en: "Administrator", fr: "Administrateur" }, { en: "Operating system", fr: "Système d'exploitation" }, { en: "Azure tool installed locally", fr: "Outil Azure installé localement" }]
    rows:
      - [{ text: Admin1, area: admin1 }, { text: Windows }, { text: "Azure PowerShell" }]
      - [{ text: Admin2, area: admin2 }, { text: Linux }, { text: "Azure CLI" }]
      - [{ text: Admin3, area: admin3 }, { text: macOS }, { text: "Azure PowerShell" }]
      - [{ text: Admin4, area: admin4 }, { text: Windows }, { text: { en: "None", fr: "Aucun" } }]
answer:
  values: { p1: admin2, p2: admin4 }
explanation:
  correct:
    en: "Commands that begin with az belong to the Azure CLI, which only Admin2 has installed; Admin1 and Admin3 have Azure PowerShell, which runs cmdlets on Windows as well as on macOS. Admin4 has no Azure tool installed and cannot install one, so the browser-based Cloud Shell, which needs no local installation, is the only command line available."
    fr: "Les commandes qui commencent par az appartiennent à Azure CLI, que seul Admin2 a installé ; Admin1 et Admin3 disposent d'Azure PowerShell, qui exécute des cmdlets sous Windows comme sous macOS. Admin4 n'a aucun outil Azure installé et ne peut pas en installer : Cloud Shell, qui s'exécute dans le navigateur sans installation locale, est donc la seule ligne de commande disponible."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is Azure Cloud Shell?
    url: https://learn.microsoft.com/en-us/azure/cloud-shell/overview
