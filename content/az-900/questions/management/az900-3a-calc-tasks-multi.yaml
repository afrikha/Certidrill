id: az900-3a-calc-tasks-multi
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks can you perform with the pricing calculator?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches que vous pouvez effectuer avec la calculatrice de prix ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Estimate the monthly cost of a solution before you deploy it.", fr: "Estimer le coût mensuel d'une solution avant de la déployer." } }
    - { id: b, text: { en: "Receive an email when the spending of a subscription exceeds a threshold.", fr: "Recevoir un e-mail quand les dépenses d'un abonnement dépassent un seuil." } }
    - { id: c, text: { en: "Export an estimate to a file that you share with other people.", fr: "Exporter une estimation dans un fichier que vous partagez avec d'autres personnes." } }
    - { id: d, text: { en: "Identify the idle virtual machines of a subscription.", fr: "Repérer les machines virtuelles inactives d'un abonnement." } }
    - { id: e, text: { en: "Download the invoices of a subscription.", fr: "Télécharger les factures d'un abonnement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The pricing calculator builds an estimate of the cost of resources that you plan to deploy, and the estimate can be saved, exported to an Excel file or shared. The calculator doesn't know anything about what a subscription contains or spends.
    fr: La calculatrice de prix construit une estimation du coût des ressources que vous prévoyez de déployer, et l'estimation peut être enregistrée, exportée dans un fichier Excel ou partagée. La calculatrice ne sait rien de ce qu'un abonnement contient ou dépense.
  options:
    b:
      en: Alerts on spending come from budgets in Cost Management.
      fr: Les alertes sur les dépenses viennent des budgets de Cost Management.
    d:
      en: Finding underused resources is the role of Azure Advisor recommendations.
      fr: Trouver les ressources sous-utilisées est le rôle des recommandations d'Azure Advisor.
    e:
      en: Invoices are available in Cost Management + Billing in the Azure portal, not in the calculator.
      fr: Les factures sont disponibles dans Cost Management + Billing dans le portail Azure, pas dans la calculatrice.
references:
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
