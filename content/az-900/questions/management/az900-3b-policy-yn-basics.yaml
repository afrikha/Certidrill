id: az900-3b-policy-yn-basics
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Policy can prevent the creation of resources that do not comply with a rule.", fr: "Azure Policy peut empêcher la création de ressources qui ne respectent pas une règle." } }
    - { id: s2, text: { en: "Azure Policy is used to grant users permissions to manage resources.", fr: "Azure Policy sert à accorder aux utilisateurs des autorisations de gestion des ressources." } }
    - { id: s3, text: { en: "A policy assigned to a subscription is inherited by the resource groups in the subscription.", fr: "Une stratégie attribuée à un abonnement est héritée par les groupes de ressources de cet abonnement." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Azure Policy can deny the creation of resources that break a rule, and it also evaluates existing resources. Granting permissions to users is the job of Azure RBAC, not of Azure Policy. Policy assignments are inherited: a policy set on a subscription applies to its resource groups and to their resources."
    fr: "Azure Policy peut refuser la création de ressources qui enfreignent une règle, et il évalue aussi les ressources existantes. Accorder des autorisations aux utilisateurs est le rôle d'Azure RBAC, pas d'Azure Policy. Les attributions de stratégie sont héritées : une stratégie définie sur un abonnement s'applique à ses groupes de ressources et à leurs ressources."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
