id: az900-3b-iac-idempotent
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An infrastructure as code deployment is described as idempotent.

    What does this mean?
  fr: |
    Un déploiement d'infrastructure en tant que code est qualifié d'idempotent.

    Qu'est-ce que cela signifie ?
body:
  options:
    - { id: a, text: { en: "Each deployment creates a new copy of every resource.", fr: "Chaque déploiement crée une nouvelle copie de chaque ressource." } }
    - { id: b, text: { en: "Deploying the same definition again produces the same environment.", fr: "Redéployer la même définition produit le même environnement." } }
    - { id: c, text: { en: "The definition can be deployed only once per subscription.", fr: "La définition ne peut être déployée qu'une seule fois par abonnement." } }
    - { id: d, text: { en: "The deployment needs no permission on the target subscription.", fr: "Le déploiement ne demande aucune autorisation sur l'abonnement cible." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Idempotence is the ability of an operation to always produce the same result. An idempotent deployment always sets the target environment to the same configuration, whatever its starting state, so the same definition can be deployed many times."
    fr: "L'idempotence est la capacité d'une opération à produire toujours le même résultat. Un déploiement idempotent amène toujours l'environnement cible à la même configuration, quel que soit son état de départ : la même définition peut donc être déployée de nombreuses fois."
  options:
    a:
      en: "It is the opposite: a new deployment of the same definition does not duplicate the resources that already match it."
      fr: "C'est l'inverse : un nouveau déploiement de la même définition ne duplique pas les ressources qui lui correspondent déjà."
    c:
      en: "An idempotent definition is precisely one that can be deployed repeatedly with the same result."
      fr: "Une définition idempotente est justement une définition qui peut être déployée de façon répétée avec le même résultat."
    d:
      en: "Idempotence concerns the result of a deployment, not permissions: the deployment still requires the appropriate rights."
      fr: "L'idempotence concerne le résultat d'un déploiement, pas les autorisations : le déploiement exige toujours les droits appropriés."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
  - title: What is Bicep?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
