id: az900-3c-sh-subtle-statements
objective: "3.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs all its Azure resources in the Sweden Central region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute toutes ses ressources Azure dans la région Sweden Central.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A service issue that affects Adatum can appear in Service Health while the Azure status page reports no incident."
        fr: "Un problème de service qui touche Adatum peut apparaître dans Service Health alors que la page État d'Azure ne signale aucun incident."
    - id: s2
      text:
        en: "Resource Health can indicate whether the unavailability of one of Adatum's virtual machines is caused by an event on the Azure platform."
        fr: "Resource Health peut indiquer si l'indisponibilité d'une machine virtuelle d'Adatum est due à un événement de la plateforme Azure."
    - id: s3
      text:
        en: "Service Health is designed to show Adatum the service issues of every Azure region, including the regions in which Adatum has no resources."
        fr: "Service Health est conçu pour montrer à Adatum les problèmes de service de toutes les régions Azure, y compris celles où Adatum n'a aucune ressource."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The Azure status page only reports incidents with widespread effect; most issues are communicated directly to the affected customers in Service Health, so an issue can be visible there and not on the status page. Resource Health tells whether a resource is available and whether a platform event is the cause. Service Health is a personalized view limited to the services and regions that you use; the view of all regions is Azure status."
    fr: "La page État d'Azure ne signale que les incidents de grande ampleur ; la plupart des problèmes sont communiqués directement aux clients touchés dans Service Health : un problème peut donc y être visible sans figurer sur la page d'état. Resource Health indique si une ressource est disponible et si un événement de la plateforme en est la cause. Service Health est une vue personnalisée, limitée aux services et aux régions que vous utilisez ; la vue de toutes les régions est État d'Azure."
references:
  - title: Azure status overview
    url: https://learn.microsoft.com/en-us/azure/service-health/azure-status-overview
  - title: Resource Health overview
    url: https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview
