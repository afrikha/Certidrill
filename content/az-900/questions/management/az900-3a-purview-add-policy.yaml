id: az900-3a-purview-add-policy
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview to identify where its sensitive data is stored. The company now also wants to block the creation of storage accounts outside the France Central region.

    What should Northwind Traders do?
  fr: |
    Northwind Traders utilise Microsoft Purview pour repérer où sont stockées ses données sensibles. L'entreprise veut maintenant aussi bloquer la création de comptes de stockage en dehors de la région France Central.

    Que doit faire Northwind Traders ?
body:
  options:
    - id: a
      text: { en: "Add a data classification to Microsoft Purview.", fr: "Ajouter une classification de données dans Microsoft Purview." }
    - id: b
      text: { en: "Assign an Azure Policy definition.", fr: "Attribuer une définition Azure Policy." }
    - id: c
      text: { en: "Apply a Read-only lock to the subscription.", fr: "Appliquer un verrou Lecture seule à l'abonnement." }
    - id: d
      text: { en: "Review the data lineage in Microsoft Purview.", fr: "Consulter la traçabilité des données dans Microsoft Purview." }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft Purview is about data. It tells you what data you have, where it is and how sensitive it is, but it doesn't control which Azure resources can be created. Restricting the regions where resources are deployed is a rule on resources, which Azure Policy enforces.
    fr: "Microsoft Purview concerne les données. Il indique quelles données vous avez, où elles se trouvent et à quel point elles sont sensibles, mais il ne contrôle pas quelles ressources Azure peuvent être créées. Restreindre les régions de déploiement est une règle sur les ressources, qu'Azure Policy impose."
  options:
    a:
      en: A classification labels data that Purview discovers; it has no effect on the deployment of resources.
      fr: "Une classification étiquette les données que Purview découvre ; elle n'a aucun effet sur le déploiement de ressources."
    c:
      en: A Read-only lock would block every modification in the subscription, in every region, including in France Central.
      fr: Un verrou Lecture seule bloquerait toute modification dans l'abonnement, dans toutes les régions, y compris France Central.
    d:
      en: Lineage shows where data comes from and where it goes; it doesn't restrict deployments.
      fr: "La traçabilité montre d'où viennent les données et où elles vont ; elle ne restreint pas les déploiements."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
