id: az900-3a-cm-basics-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Cost Management shows the costs of resources that are already deployed.
        fr: Cost Management montre les coûts des ressources déjà déployées.
    - id: s2
      text:
        en: Creating a budget lowers the price of the resources in its scope.
        fr: Créer un budget fait baisser le prix des ressources de son étendue.
    - id: s3
      text:
        en: In Cost Management, you can create alerts that are based on spending.
        fr: Dans Cost Management, vous pouvez créer des alertes fondées sur les dépenses.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Cost Management is a set of tools to analyze, monitor and manage the costs of Azure resources, so it works on actual usage. A budget is a spending limit that you follow, with alerts at thresholds; it changes nothing in the price of resources. Alerts based on spend are one of the capabilities of Cost Management.
    fr: "Cost Management est un ensemble d'outils pour analyser, surveiller et gérer les coûts des ressources Azure : il travaille donc sur l'utilisation réelle. Un budget est une limite de dépense que vous suivez, avec des alertes à des seuils ; il ne change rien au prix des ressources. Les alertes fondées sur les dépenses font partie des fonctionnalités de Cost Management."
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
