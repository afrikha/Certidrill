id: az900-3b-portal-dd-arm
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A request that you make in the Azure portal is sent to [[arm]].

      As a result, a resource that was created in the portal [[after]].
    fr: |
      Une requête que vous effectuez dans le portail Azure est envoyée à [[arm]].

      Par conséquent, une ressource créée dans le portail [[after]].
  slots:
    - id: arm
      options:
        - { id: advisor, text: "Azure Advisor" }
        - { id: arc, text: "Azure Arc" }
        - { id: arm, text: "Azure Resource Manager" }
        - { id: purview, text: "Microsoft Purview" }
    - id: after
      options:
        - { id: any, text: { en: "can also be managed with the Azure CLI or Azure PowerShell", fr: "peut aussi être gérée avec Azure CLI ou Azure PowerShell" } }
        - { id: only, text: { en: "can be managed afterwards only from the portal", fr: "ne peut ensuite être gérée que depuis le portail" } }
        - { id: export, text: { en: "must be exported before a script can manage it", fr: "doit être exportée avant qu'un script puisse la gérer" } }
answer:
  values: { arm: arm, after: any }
explanation:
  correct:
    en: "Azure Resource Manager is the management layer of Azure: it receives the requests of every tool (portal, Azure CLI, Azure PowerShell, SDKs), authenticates and authorizes them, then forwards them to the service. Because all tools use the same layer, a resource created with one tool can be managed with any other."
    fr: "Azure Resource Manager est la couche de gestion d'Azure : il reçoit les requêtes de tous les outils (portail, Azure CLI, Azure PowerShell, SDK), les authentifie et les autorise, puis les transmet au service. Comme tous les outils utilisent la même couche, une ressource créée avec un outil peut être gérée avec n'importe quel autre."
references:
  - title: Describe Azure Resource Manager and Azure ARM templates
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates
