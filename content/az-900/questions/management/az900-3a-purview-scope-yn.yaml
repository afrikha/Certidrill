id: az900-3a-purview-scope-yn
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A company evaluates Microsoft Purview.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise évalue Microsoft Purview.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Purview helps to identify data risks and to manage regulatory compliance requirements.
        fr: Microsoft Purview aide à identifier les risques liés aux données et à gérer les exigences de conformité réglementaire.
    - id: s2
      text:
        en: Data lineage in Microsoft Purview keeps a backup copy of the data that it tracks.
        fr: La traçabilité des données de Microsoft Purview conserve une copie de sauvegarde des données qu'elle suit.
    - id: s3
      text:
        en: Microsoft Purview prevents the accidental deletion of the Azure resources that store sensitive data.
        fr: Microsoft Purview empêche la suppression accidentelle des ressources Azure qui stockent des données sensibles.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The risk and compliance solutions of Microsoft Purview help to protect sensitive data, identify data risks and manage regulatory compliance requirements. Data lineage describes where data comes from and where it goes; it is information about the data, not a copy of it. Purview governs data and doesn't protect Azure resources against deletion, which is the role of resource locks.
    fr: "Les solutions de risques et conformité de Microsoft Purview aident à protéger les données sensibles, à identifier les risques liés aux données et à gérer les exigences de conformité réglementaire. La traçabilité des données décrit d'où viennent les données et où elles vont ; c'est une information sur les données, pas une copie. Purview gouverne les données et ne protège pas les ressources Azure contre la suppression, ce qui est le rôle des verrous de ressources."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
