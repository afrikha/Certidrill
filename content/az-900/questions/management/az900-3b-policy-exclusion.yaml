id: az900-3b-policy-exclusion
objective: "3.2.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A management group named **MG1** contains a subscription named **Sub1**. Sub1 contains two resource groups named **RG1** and **RG2**.

    You assign to MG1 a policy that allows resources to be created only in the West Europe region. RG2 is excluded from the assignment.

    A user who has the Owner role for Sub1 tries to create a storage account in the East US region in each resource group.

    In which resource groups is the storage account created?
  fr: |
    Un groupe d'administration nommé **MG1** contient un abonnement nommé **Sub1**. Sub1 contient deux groupes de ressources nommés **RG1** et **RG2**.

    Vous attribuez à MG1 une stratégie qui n'autorise la création de ressources que dans la région West Europe. RG2 est exclu de l'attribution.

    Un utilisateur qui dispose du rôle Owner sur Sub1 tente de créer un compte de stockage dans la région East US dans chacun des groupes de ressources.

    Dans quels groupes de ressources le compte de stockage est-il créé ?
body:
  options:
    - { id: a, text: { en: "RG1 only", fr: "RG1 uniquement" } }
    - { id: b, text: { en: "RG2 only", fr: "RG2 uniquement" } }
    - { id: c, text: { en: "RG1 and RG2", fr: "RG1 et RG2" } }
    - { id: d, text: { en: "Neither RG1 nor RG2", fr: "Ni RG1 ni RG2" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A policy assigned to a management group is inherited by its subscriptions and their resource groups, so the creation in RG1 is denied. Azure Policy applies whatever the role of the user, even Owner. RG2 is excluded from the assignment, so the policy is not evaluated there and the storage account is created."
    fr: "Une stratégie attribuée à un groupe d'administration est héritée par ses abonnements et leurs groupes de ressources : la création dans RG1 est donc refusée. Azure Policy s'applique quel que soit le rôle de l'utilisateur, même Owner. RG2 est exclu de l'attribution : la stratégie n'y est pas évaluée et le compte de stockage est créé."
  options:
    a:
      en: "It is the opposite: RG1 inherits the policy and the deployment to East US is denied there, while RG2 is excluded."
      fr: "C'est l'inverse : RG1 hérite de la stratégie et le déploiement dans East US y est refusé, alors que RG2 est exclu."
    c:
      en: "The Owner role does not exempt a user from Azure Policy; the creation in RG1 is denied."
      fr: "Le rôle Owner ne dispense pas un utilisateur d'Azure Policy ; la création dans RG1 est refusée."
    d:
      en: "RG2 is excluded from the assignment, so nothing prevents the creation of the storage account in East US there."
      fr: "RG2 est exclu de l'attribution : rien n'y empêche la création du compte de stockage dans East US."
references:
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
