id: az900-3c-arm-template-true-two
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about ARM templates are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies à propos des modèles ARM ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A template is written in the PowerShell scripting language.", fr: "Un modèle est écrit dans le langage de script PowerShell." } }
    - { id: b, text: { en: "A template states the resources that you want, not the commands that create them.", fr: "Un modèle indique les ressources souhaitées, pas les commandes qui les créent." } }
    - { id: c, text: { en: "A template creates duplicate resources each time it is deployed again.", fr: "Un modèle crée des ressources en double à chaque nouveau déploiement." } }
    - { id: d, text: { en: "A template can be divided into smaller files that are reused.", fr: "Un modèle peut être découpé en fichiers plus petits et réutilisés." } }
    - { id: e, text: { en: "A template is processed by the Azure portal instead of Azure Resource Manager.", fr: "Un modèle est traité par le portail Azure à la place d'Azure Resource Manager." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ARM templates use declarative syntax: you state what to deploy without writing the sequence of commands. They are also modular: a template can be broken into smaller, reusable components that are linked together at deployment time."
    fr: "Les modèles ARM utilisent une syntaxe déclarative : vous indiquez ce qu'il faut déployer sans écrire la suite de commandes. Ils sont aussi modulaires : un modèle peut être découpé en composants plus petits et réutilisables, liés entre eux au moment du déploiement."
  options:
    a:
      en: "An ARM template is a JSON file; PowerShell or Bash scripts can only be added to it as deployment scripts."
      fr: "Un modèle ARM est un fichier JSON ; des scripts PowerShell ou Bash peuvent seulement y être ajoutés comme scripts de déploiement."
    c:
      en: "Templates are idempotent: deploying the same template again gives the same resources in the same state, not duplicates."
      fr: "Les modèles sont idempotents : redéployer le même modèle donne les mêmes ressources dans le même état, pas des doublons."
    e:
      en: "Azure Resource Manager processes the template, whatever the tool used to submit it; the portal is only one of these tools."
      fr: "C'est Azure Resource Manager qui traite le modèle, quel que soit l'outil qui le soumet ; le portail n'est que l'un de ces outils."
references:
  - title: What are ARM templates?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
