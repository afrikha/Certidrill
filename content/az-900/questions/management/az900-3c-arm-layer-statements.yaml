id: az900-3c-arm-layer-statements
objective: "3.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Resource Manager, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Resource Manager, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A request to create a virtual machine from the Azure CLI is processed by Azure Resource Manager."
        fr: "Une requête de création de machine virtuelle émise depuis Azure CLI est traitée par Azure Resource Manager."
    - id: s2
      text:
        en: "Azure role-based access control (Azure RBAC) applies to operations performed in the Azure portal, but not to operations performed from Azure PowerShell."
        fr: "Le contrôle d'accès en fonction du rôle Azure (Azure RBAC) s'applique aux opérations effectuées dans le portail Azure, mais pas à celles effectuées depuis Azure PowerShell."
    - id: s3
      text:
        en: "Azure Resource Manager lets you deploy, manage and monitor all the resources of a solution as a group."
        fr: "Azure Resource Manager permet de déployer, de gérer et de surveiller toutes les ressources d'une solution comme un groupe."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Azure Resource Manager receives the requests of every Azure tool, API and SDK, authenticates and authorizes them, and then sends them to the Azure service. Because Azure RBAC is built into this management layer, access control applies in the same way whatever the tool. Resource Manager also lets you handle the resources of a solution as a group instead of one by one."
    fr: "Azure Resource Manager reçoit les requêtes de tous les outils, API et SDK Azure, les authentifie et les autorise, puis les envoie au service Azure. Comme Azure RBAC est intégré à cette couche de gestion, le contrôle d'accès s'applique de la même façon quel que soit l'outil. Resource Manager permet aussi de traiter les ressources d'une solution comme un groupe plutôt qu'une par une."
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
