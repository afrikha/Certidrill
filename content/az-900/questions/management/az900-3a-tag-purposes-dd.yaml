id: az900-3a-tag-purposes-dd
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Select the answer that correctly completes each sentence about the purposes of tags.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement chaque phrase sur les usages des étiquettes.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Marking data as public or confidential with a tag is a use of tags for [[p1]].

      Identifying the resources that must align with a standard such as ISO 27001 is a use of tags for [[p2]].

      Tagging resources with the name of the team that pays for them, to track budgets, is a use of tags for [[p3]].
    fr: |
      Marquer des données comme publiques ou confidentielles avec une étiquette relève de [[p1]].

      Repérer les ressources qui doivent respecter une norme comme ISO 27001 relève de [[p2]].

      Étiqueter les ressources avec le nom de l'équipe qui les paie, pour suivre des budgets, relève de [[p3]].
  slots:
    - id: p1
      options:
        - { id: ops, text: { en: "operations management", fr: "la gestion des opérations" } }
        - { id: sec, text: { en: "security", fr: "la sécurité" } }
        - { id: gov, text: { en: "governance and regulatory compliance", fr: "la gouvernance et la conformité réglementaire" } }
        - { id: cost, text: { en: "cost management and optimization", fr: "la gestion et l'optimisation des coûts" } }
    - id: p2
      options:
        - { id: ops, text: { en: "operations management", fr: "la gestion des opérations" } }
        - { id: sec, text: { en: "security", fr: "la sécurité" } }
        - { id: gov, text: { en: "governance and regulatory compliance", fr: "la gouvernance et la conformité réglementaire" } }
        - { id: cost, text: { en: "cost management and optimization", fr: "la gestion et l'optimisation des coûts" } }
    - id: p3
      options:
        - { id: ops, text: { en: "operations management", fr: "la gestion des opérations" } }
        - { id: sec, text: { en: "security", fr: "la sécurité" } }
        - { id: gov, text: { en: "governance and regulatory compliance", fr: "la gouvernance et la conformité réglementaire" } }
        - { id: cost, text: { en: "cost management and optimization", fr: "la gestion et l'optimisation des coûts" } }
answer:
  values: { p1: sec, p2: gov, p3: cost }
explanation:
  correct:
    en: Classifying data by its security level, such as public or confidential, is the security purpose of tags. Identifying the resources that align with governance or regulatory requirements, such as ISO 27001, is the governance and regulatory compliance purpose. Grouping resources to report on costs, allocate internal cost centers and track budgets is the cost management and optimization purpose.
    fr: "Classer les données selon leur niveau de sécurité, comme public ou confidentiel, est l'usage de sécurité des étiquettes. Repérer les ressources soumises à des exigences de gouvernance ou réglementaires, comme ISO 27001, est l'usage de gouvernance et de conformité réglementaire. Regrouper les ressources pour rendre compte des coûts, alimenter des centres de coûts internes et suivre des budgets est l'usage de gestion et d'optimisation des coûts."
  options:
    ops:
      en: Operations management groups resources by how critical their availability is, to formulate service-level agreements.
      fr: La gestion des opérations regroupe les ressources selon le caractère critique de leur disponibilité, pour formuler des contrats de niveau de service.
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
