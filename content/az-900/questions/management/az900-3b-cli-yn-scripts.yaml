id: az900-3b-cli-yn-scripts
objective: "3.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure CLI commands can be run only in Azure Cloud Shell.", fr: "Les commandes Azure CLI ne peuvent être exécutées que dans Azure Cloud Shell." } }
    - { id: s2, text: { en: "Azure PowerShell cmdlets call the Azure REST API to perform management tasks.", fr: "Les cmdlets Azure PowerShell appellent l'API REST Azure pour effectuer les tâches de gestion." } }
    - { id: s3, text: { en: "A resource that was created with the Azure CLI can later be modified with Azure PowerShell.", fr: "Une ressource créée avec Azure CLI peut ensuite être modifiée avec Azure PowerShell." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The Azure CLI is available in Cloud Shell, but it can also be installed on Windows, Linux and macOS. Azure PowerShell cmdlets call the Azure REST API to carry out management tasks. Both tools address the same management layer, Azure Resource Manager, so a resource created with one can be managed with the other."
    fr: "Azure CLI est disponible dans Cloud Shell, mais il peut aussi être installé sous Windows, Linux et macOS. Les cmdlets Azure PowerShell appellent l'API REST Azure pour réaliser les tâches de gestion. Les deux outils s'adressent à la même couche de gestion, Azure Resource Manager : une ressource créée avec l'un peut donc être gérée avec l'autre."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is Azure PowerShell
    url: https://learn.microsoft.com/en-us/powershell/azure/what-is-azure-powershell
