id: az900-3a-tag-tools-multi
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You need to add a tag to an existing storage account.

    Which two tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez ajouter une étiquette à un compte de stockage existant.

    Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The pricing calculator", fr: "La calculatrice de prix" } }
    - { id: b, text: { en: "The Azure portal", fr: "Le portail Azure" } }
    - { id: c, text: "Azure Advisor" }
    - { id: d, text: "Azure Service Health" }
    - { id: e, text: "Azure CLI" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Tags can be added, modified or deleted through the Azure portal, Azure PowerShell, the Azure CLI, Azure Resource Manager templates or the REST API. The portal and the Azure CLI are two of these tools.
    fr: Les étiquettes peuvent être ajoutées, modifiées ou supprimées avec le portail Azure, Azure PowerShell, Azure CLI, des modèles Azure Resource Manager ou l'API REST. Le portail et Azure CLI font partie de ces outils.
  options:
    a:
      en: The pricing calculator estimates costs and has no access to the resources of a subscription.
      fr: La calculatrice de prix estime des coûts et n'a aucun accès aux ressources d'un abonnement.
    c:
      en: Azure Advisor provides recommendations; it isn't a tool to edit the tags of a resource.
      fr: "Azure Advisor fournit des recommandations ; ce n'est pas un outil pour modifier les étiquettes d'une ressource."
    d:
      en: Azure Service Health informs about the health of Azure services; it doesn't manage resources.
      fr: "Azure Service Health informe sur l'état des services Azure ; il ne gère pas les ressources."
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
