id: az900-3b-lock-scopes
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At which two levels can you apply a resource lock? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    À quels deux niveaux pouvez-vous appliquer un verrou de ressource ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: b, text: { en: "A subscription", fr: "Un abonnement" } }
    - { id: c, text: { en: "A Microsoft Entra tenant", fr: "Un locataire Microsoft Entra" } }
    - { id: d, text: { en: "A resource group", fr: "Un groupe de ressources" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A lock can be applied to a subscription, to a resource group or to an individual resource. A lock set on a subscription or a resource group is inherited by everything below it."
    fr: "Un verrou peut être appliqué à un abonnement, à un groupe de ressources ou à une ressource individuelle. Un verrou posé sur un abonnement ou un groupe de ressources est hérité par tout ce qui se trouve en dessous."
  options:
    a:
      en: "Locks cannot be added to management groups; the highest level that accepts a lock is the subscription."
      fr: "Il n'est pas possible d'ajouter des verrous aux groupes d'administration ; le niveau le plus élevé qui accepte un verrou est l'abonnement."
    c:
      en: "A Microsoft Entra tenant is an identity directory, not a level of the resource hierarchy that accepts locks."
      fr: "Un locataire Microsoft Entra est un annuaire d'identités, pas un niveau de la hiérarchie des ressources qui accepte des verrous."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
