id: az900-3c-adv-reliability-zones
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Azure Advisor recommends that Woodgrove Bank use availability zones for the virtual machines of a business-critical application, so that the application keeps running if one zone fails.

    In which Advisor category does this recommendation appear?
  fr: |
    Azure Advisor recommande à Woodgrove Bank d'utiliser des zones de disponibilité pour les machines virtuelles d'une application critique, afin que l'application continue de fonctionner si une zone tombe en panne.

    Dans quelle catégorie d'Advisor cette recommandation apparaît-elle ?
body:
  options:
    - { id: a, text: { en: "Performance", fr: "Performances" } }
    - { id: b, text: { en: "Reliability", fr: "Fiabilité" } }
    - { id: c, text: { en: "Security", fr: "Sécurité" } }
    - { id: d, text: { en: "Operational excellence", fr: "Excellence opérationnelle" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The reliability category contains the recommendations that ensure and improve the continuity of business-critical applications. Using availability zones so that an application survives the failure of a zone is a reliability recommendation."
    fr: "La catégorie Fiabilité contient les recommandations qui assurent et améliorent la continuité des applications critiques. Utiliser des zones de disponibilité pour qu'une application survive à la panne d'une zone est une recommandation de fiabilité."
  options:
    a:
      en: "Performance recommendations improve the speed of applications, not their continuity."
      fr: "Les recommandations de performances améliorent la vitesse des applications, pas leur continuité."
    c:
      en: "Security recommendations concern threats and vulnerabilities that might lead to breaches."
      fr: "Les recommandations de sécurité concernent les menaces et les vulnérabilités qui pourraient mener à des violations."
    d:
      en: "Operational excellence concerns process and workflow efficiency, resource manageability and deployment practices."
      fr: "L'excellence opérationnelle concerne l'efficacité des processus et des flux de travail, la facilité de gestion des ressources et les pratiques de déploiement."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
  - title: Reliability recommendations
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-reference-reliability-recommendations
