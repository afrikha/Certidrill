id: az900-3a-cost-reduce-actions
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    The Azure invoice of Wingtip Toys increases every month although no new project has started.

    Which two actions reduce the costs? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La facture Azure de Wingtip Toys augmente chaque mois alors qu'aucun nouveau projet n'a démarré.

    Quelles sont les deux actions qui réduisent les coûts ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a Department tag to every resource.", fr: "Appliquer une étiquette Department à chaque ressource." } }
    - { id: b, text: { en: "Delete the disks that remain from deleted virtual machines.", fr: "Supprimer les disques qui subsistent après la suppression de machines virtuelles." } }
    - { id: c, text: { en: "Move all the resources into a single resource group.", fr: "Déplacer toutes les ressources dans un seul groupe de ressources." } }
    - { id: d, text: { en: "Deallocate the test virtual machines outside working hours.", fr: "Libérer les machines virtuelles de test en dehors des heures de travail." } }
    - { id: e, text: { en: "Apply a Delete lock to every resource group.", fr: "Appliquer un verrou Suppression à chaque groupe de ressources." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Resources that are left behind, such as the disks of deleted virtual machines, keep being billed until they are removed. A deallocated virtual machine no longer incurs compute charges, so deallocating test machines when nobody uses them lowers the invoice.
    fr: "Les ressources oubliées, comme les disques de machines virtuelles supprimées, restent facturées tant qu'elles ne sont pas supprimées. Une machine virtuelle libérée ne génère plus de frais de calcul : libérer les machines de test quand personne ne les utilise fait donc baisser la facture."
  options:
    a:
      en: Tags help to report and allocate costs, but applying a tag doesn't change what a resource costs.
      fr: Les étiquettes aident à suivre et à répartir les coûts, mais appliquer une étiquette ne change pas ce que coûte une ressource.
    c:
      en: A resource group is a logical container; moving resources into another group doesn't change their price.
      fr: "Un groupe de ressources est un conteneur logique ; déplacer des ressources dans un autre groupe ne change pas leur prix."
    e:
      en: A Delete lock protects resources against accidental deletion; it has no effect on costs.
      fr: "Un verrou Suppression protège les ressources contre une suppression accidentelle ; il n'a aucun effet sur les coûts."
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
  - title: States and billing status of Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
