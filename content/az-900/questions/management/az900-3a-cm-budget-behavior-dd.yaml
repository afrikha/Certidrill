id: az900-3a-cm-budget-behavior-dd
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A company creates a budget in Cost Management for a subscription. No automation is configured.

    Select the answer that correctly completes each sentence.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée un budget dans Cost Management pour un abonnement. Aucune automatisation n'est configurée.

    Sélectionnez la réponse qui complète correctement chaque phrase.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The budget defines [[what]] for the subscription.

      When spending reaches a threshold of the budget, [[event]].

      When spending exceeds the budget, the resources of the subscription [[state]].
    fr: |
      Le budget définit [[what]] pour l'abonnement.

      Quand les dépenses atteignent un seuil du budget, [[event]].

      Quand les dépenses dépassent le budget, les ressources de l'abonnement [[state]].
  slots:
    - id: what
      options:
        - { id: price, text: { en: "a guaranteed price", fr: "un prix garanti" } }
        - { id: discount, text: { en: "a discount rate", fr: "un taux de remise" } }
        - { id: limit, text: { en: "a spending limit", fr: "une limite de dépense" } }
    - id: event
      options:
        - { id: alert, text: { en: "a budget alert is generated", fr: "une alerte de budget est générée" } }
        - { id: disabled, text: { en: "the subscription is disabled", fr: "l'abonnement est désactivé" } }
        - { id: resv, text: { en: "a reservation is purchased", fr: "une réservation est achetée" } }
    - id: state
      options:
        - { id: dealloc, text: { en: "are deallocated", fr: "sont libérées" } }
        - { id: run, text: { en: "continue to run", fr: "continuent de fonctionner" } }
        - { id: deleted, text: { en: "are deleted", fr: "sont supprimées" } }
answer:
  values: { what: limit, event: alert, state: run }
explanation:
  correct:
    en: A budget sets a spending limit for a scope and comes with alert thresholds. Reaching a threshold generates a budget alert, shown in cost alerts and sent by email to the recipients. Budgets don't affect resources and don't stop consumption, so without automation everything continues to run and to be billed.
    fr: "Un budget fixe une limite de dépense pour une étendue et s'accompagne de seuils d'alerte. L'atteinte d'un seuil génère une alerte de budget, affichée dans les alertes de coût et envoyée par e-mail aux destinataires. Les budgets n'ont pas d'effet sur les ressources et n'arrêtent pas la consommation : sans automatisation, tout continue de fonctionner et d'être facturé."
  options:
    disabled:
      en: Crossing a budget threshold only sends notifications; it doesn't disable the subscription.
      fr: "Le franchissement d'un seuil de budget n'envoie que des notifications ; il ne désactive pas l'abonnement."
    dealloc:
      en: Resources are stopped only if the budget is configured to trigger automation that does it.
      fr: Les ressources ne sont arrêtées que si le budget est configuré pour déclencher une automatisation qui le fait.
references:
  - title: "Tutorial: Create and manage budgets"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
