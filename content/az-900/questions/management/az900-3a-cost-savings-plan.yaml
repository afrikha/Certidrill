id: az900-3a-cost-savings-plan
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware spends a steady amount on compute every hour, but its workloads regularly move between Azure Virtual Machines, Azure App Service and Azure Container Instances, and from one region to another.

    Litware accepts a three-year commitment to reduce costs. The discount must keep applying when the workloads move. What should Litware use?
  fr: |
    Litware dépense chaque heure un montant régulier en calcul, mais ses charges de travail passent souvent d'Azure Virtual Machines à Azure App Service ou à Azure Container Instances, et d'une région à une autre.

    Litware accepte un engagement de trois ans pour réduire les coûts. La remise doit continuer de s'appliquer quand les charges de travail se déplacent. Que doit utiliser Litware ?
body:
  options:
    - id: a
      text: { en: "Azure reservations for the virtual machines", fr: "Des réservations Azure pour les machines virtuelles" }
    - id: b
      text: { en: "An Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul" }
    - id: c
      text: { en: "Azure Spot Virtual Machines", fr: "Des machines virtuelles Azure Spot" }
    - id: d
      text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" }
answer: { optionId: b }
explanation:
  correct:
    en: With an Azure savings plan for compute, you commit to an hourly spend for one or three years instead of a specific virtual machine type. Azure applies the discount automatically to eligible compute usage across services and regions, which fits steady spending on workloads that move.
    fr: Avec un plan d'économies Azure pour le calcul, vous vous engagez sur un montant horaire pendant un ou trois ans plutôt que sur un type précis de machine virtuelle. Azure applique automatiquement la remise à l'utilisation de calcul éligible, quels que soient le service et la région, ce qui correspond à une dépense régulière sur des charges de travail qui se déplacent.
  options:
    a:
      en: A reservation is tied to specific resources, such as a virtual machine size in a region; the discount would be lost when a workload moves to another service or region.
      fr: "Une réservation est liée à des ressources précises, par exemple une taille de machine virtuelle dans une région ; la remise serait perdue quand une charge de travail change de service ou de région."
    c:
      en: Spot pricing isn't a commitment, and Azure can evict the virtual machines at any time; it suits only interruptible workloads.
      fr: "La tarification Spot n'est pas un engagement, et Azure peut évincer les machines virtuelles à tout moment ; elle ne convient qu'aux charges de travail qui tolèrent les interruptions."
    d:
      en: Azure Hybrid Benefit depends on existing Windows Server or SQL Server licenses, not on a commitment over time.
      fr: Azure Hybrid Benefit dépend de licences Windows Server ou SQL Server existantes, pas d'un engagement dans la durée.
references:
  - title: What are savings plans?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
  - title: Describe cost optimization options in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7a-describe-cost-optimization-options
