id: az900-3a-tag-purpose-operations
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator applies the tag `Impact = Mission-critical` to the resources whose availability matters most to the business, so that service-level agreements (SLAs) can be formulated for them.

    Which purpose of tags does this illustrate?
  fr: |
    Un administrateur applique l'étiquette `Impact = Mission-critical` aux ressources dont la disponibilité compte le plus pour l'activité, afin de pouvoir formuler des contrats de niveau de service (SLA) pour elles.

    Quel usage des étiquettes cela illustre-t-il ?
body:
  options:
    - id: a
      text: { en: "Security", fr: "La sécurité" }
    - id: b
      text: { en: "Cost management and optimization", fr: "La gestion et l'optimisation des coûts" }
    - id: c
      text: { en: "Governance and regulatory compliance", fr: "La gouvernance et la conformité réglementaire" }
    - id: d
      text: { en: "Operations management", fr: "La gestion des opérations" }
answer: { optionId: d }
explanation:
  correct:
    en: Operations management is the use of tags to group resources according to how critical their availability is for the business. This grouping helps to formulate service-level agreements, the uptime or performance guarantees given to users.
    fr: La gestion des opérations est l'usage des étiquettes qui consiste à regrouper les ressources selon le caractère critique de leur disponibilité pour l'activité. Ce regroupement aide à formuler des contrats de niveau de service, c'est-à-dire les garanties de disponibilité ou de performance données aux utilisateurs.
  options:
    a:
      en: Security tags classify data by its security level, such as public or confidential.
      fr: Les étiquettes de sécurité classent les données selon leur niveau de sécurité, comme public ou confidentiel.
    b:
      en: Cost tags group resources to report on costs, allocate cost centers and track budgets.
      fr: Les étiquettes de coût regroupent les ressources pour rendre compte des coûts, alimenter des centres de coûts et suivre des budgets.
    c:
      en: Governance tags identify the resources that align with a requirement such as ISO 27001.
      fr: Les étiquettes de gouvernance repèrent les ressources soumises à une exigence comme ISO 27001.
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
