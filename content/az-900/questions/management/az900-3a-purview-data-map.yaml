id: az900-3a-purview-data-map
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regulator asks Woodgrove Bank to keep an up-to-date map of all its data stores and to indicate which ones hold personal data of customers. The data stores include Azure SQL databases, an on-premises Hive database and Amazon S3 buckets.

    Which service should Woodgrove Bank use?
  fr: |
    Un régulateur demande à Woodgrove Bank de tenir à jour une carte de tous ses magasins de données et d'indiquer lesquels contiennent des données personnelles de clients. Ces magasins de données comprennent des bases de données Azure SQL, une base de données Hive locale et des compartiments Amazon S3.

    Quel service Woodgrove Bank doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Arc", fr: "Azure Arc" }
    - id: b
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
    - id: c
      text: { en: "Azure Policy", fr: "Azure Policy" }
    - id: d
      text: { en: "Microsoft Purview", fr: "Microsoft Purview" }
answer: { optionId: d }
explanation:
  correct:
    en: The unified data governance of Microsoft Purview creates an up-to-date map of the entire data estate, including data classification and end-to-end lineage, and identifies where sensitive data is stored. It covers Azure, SQL and Hive databases, on-premises data and other clouds such as Amazon S3.
    fr: La gouvernance unifiée des données de Microsoft Purview crée une carte à jour de l'ensemble du patrimoine de données, avec la classification des données et la traçabilité de bout en bout, et repère où sont stockées les données sensibles. Elle couvre Azure, les bases SQL et Hive, les données locales et d'autres clouds comme Amazon S3.
  options:
    a:
      en: Azure Arc extends the management of Azure to servers and other resources that run on-premises or in other clouds; it manages resources and doesn't classify the data they hold.
      fr: "Azure Arc étend la gestion d'Azure aux serveurs et autres ressources exécutés en local ou dans d'autres clouds ; il gère des ressources et ne classe pas les données qu'elles contiennent."
    b:
      en: Defender for Cloud also works across clouds, but its purpose is to assess the security posture of workloads and protect them against threats, not to map and govern a data estate.
      fr: Defender pour le cloud fonctionne lui aussi sur plusieurs clouds, mais son but est d'évaluer la posture de sécurité des charges de travail et de les protéger contre les menaces, pas de cartographier et de gouverner un patrimoine de données.
    c:
      en: Azure Policy audits and enforces the configuration of resources; it doesn't look at the data stored in them.
      fr: "Azure Policy audite et impose la configuration des ressources ; il n'examine pas les données qui y sont stockées."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
