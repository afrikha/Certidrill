id: az900-3a-purview-purpose
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the purpose of Microsoft Purview?
  fr: |
    Quelle affirmation décrit l'objectif de Microsoft Purview ?
body:
  options:
    - id: a
      text: { en: "Assess the security posture of cloud workloads and protect them against threats.", fr: "Évaluer la posture de sécurité des charges de travail cloud et les protéger contre les menaces." }
    - id: b
      text: { en: "Enforce the standards of the organization on the configuration of Azure resources.", fr: "Imposer les normes de l'organisation à la configuration des ressources Azure." }
    - id: c
      text: { en: "Govern, protect and manage data across on-premises, multicloud and SaaS environments.", fr: "Gouverner, protéger et gérer les données dans les environnements locaux, multiclouds et SaaS." }
    - id: d
      text: { en: "Collect and analyze the metrics and logs of Azure resources and applications.", fr: "Collecter et analyser les métriques et les journaux des ressources et applications Azure." }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft Purview is a family of data governance, risk and compliance solutions. It gives a single, unified view of the data of an organization, wherever the data lives, on-premises, in several clouds or in software as a service (SaaS) applications.
    fr: "Microsoft Purview est une famille de solutions de gouvernance des données, de gestion des risques et de conformité. Il donne une vue unique et unifiée des données d'une organisation, où qu'elles se trouvent : en local, dans plusieurs clouds ou dans des applications SaaS (software as a service)."
  options:
    a:
      en: This describes Microsoft Defender for Cloud.
      fr: Cette description est celle de Microsoft Defender pour le cloud.
    b:
      en: This describes Azure Policy, which deals with resources rather than with data.
      fr: Cette description est celle d'Azure Policy, qui s'occupe des ressources plutôt que des données.
    d:
      en: This describes Azure Monitor.
      fr: Cette description est celle d'Azure Monitor.
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
  - title: Learn about Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/purview
