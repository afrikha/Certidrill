id: az900-3b-portal-dd-sentence
objective: "3.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The Azure portal is a [[kind]] that you open from [[access]].
    fr: |
      Le portail Azure est [[kind]] que vous ouvrez depuis [[access]].
  slots:
    - id: kind
      options:
        - { id: shell, text: { en: "command-line shell", fr: "un shell en ligne de commande" } }
        - { id: web, text: { en: "web-based graphical console", fr: "une console web graphique" } }
        - { id: desktop, text: { en: "locally installed desktop application", fr: "une application de bureau installée localement" } }
    - id: access
      options:
        - { id: browser, text: { en: "a web browser", fr: "un navigateur web" } }
        - { id: ps, text: { en: "a PowerShell session", fr: "une session PowerShell" } }
        - { id: rdp, text: { en: "a Remote Desktop connection", fr: "une connexion Bureau à distance" } }
answer:
  values: { kind: web, access: browser }
explanation:
  correct:
    en: "The Azure portal is a web-based, unified console that provides a graphical user interface for managing Azure. It is accessed with any supported web browser: there is no application to install and no remote session to open."
    fr: "Le portail Azure est une console web unifiée qui fournit une interface graphique pour gérer Azure. On y accède avec n'importe quel navigateur web pris en charge : il n'y a ni application à installer ni session à distance à ouvrir."
references:
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
