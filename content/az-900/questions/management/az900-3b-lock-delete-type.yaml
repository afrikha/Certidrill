id: az900-3b-lock-delete-type
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Administrators must be able to change the configuration of a production storage account, but nobody must be able to delete it by mistake.

    What should you apply to the storage account?
  fr: |
    Les administrateurs doivent pouvoir modifier la configuration d'un compte de stockage de production, mais personne ne doit pouvoir le supprimer par erreur.

    Que devez-vous appliquer au compte de stockage ?
body:
  options:
    - { id: a, text: { en: "A Read-only lock", fr: "Un verrou Lecture seule" } }
    - { id: b, text: { en: "A Reader role assignment", fr: "Une attribution du rôle Reader" } }
    - { id: c, text: { en: "A Delete lock", fr: "Un verrou Suppression" } }
    - { id: d, text: { en: "A policy initiative", fr: "Une initiative de stratégie" } }
answer: { optionId: c }
explanation:
  correct:
    en: "With a Delete lock (CanNotDelete), authorized users can still read and modify the resource, but nobody can delete it until the lock is removed. This protects the storage account against accidental deletion without blocking configuration changes."
    fr: "Avec un verrou Suppression (CanNotDelete), les utilisateurs autorisés peuvent toujours lire et modifier la ressource, mais personne ne peut la supprimer tant que le verrou n'est pas retiré. Le compte de stockage est ainsi protégé contre la suppression accidentelle sans que les changements de configuration soient bloqués."
  options:
    a:
      en: "A Read-only lock also blocks modifications, so administrators could no longer change the configuration."
      fr: "Un verrou Lecture seule bloque aussi les modifications : les administrateurs ne pourraient plus changer la configuration."
    b:
      en: "The Reader role only lets a user view resources; it does not let administrators change the configuration, and it protects nothing against users who have broader roles."
      fr: "Le rôle Reader permet seulement de consulter les ressources ; il ne permet pas aux administrateurs de modifier la configuration et ne protège en rien contre les utilisateurs qui ont des rôles plus étendus."
    d:
      en: "An initiative groups policy definitions that control or audit configurations; it is not the feature designed to protect one resource against accidental deletion."
      fr: "Une initiative regroupe des définitions de stratégie qui contrôlent ou auditent des configurations ; ce n'est pas la fonctionnalité prévue pour protéger une ressource contre la suppression accidentelle."
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
