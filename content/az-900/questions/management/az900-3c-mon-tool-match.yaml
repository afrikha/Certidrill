id: az900-3c-mon-tool-match
objective: "3.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each need to the tool that meets it.

    To answer, drag the appropriate tool to each need. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin à l'outil qui y répond.

    Pour répondre, faites glisser l'outil approprié vers chaque besoin. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: adv, text: Azure Advisor }
    - { id: sh, text: Azure Service Health }
    - { id: alerts, text: { en: "Azure Monitor alerts", fr: "Alertes Azure Monitor" } }
    - { id: la, text: Log Analytics }
    - { id: ai, text: Application Insights }
  targets:
    - id: t1
      text: { en: "Be informed that Azure has an outage in a region that you use.", fr: "Être informé qu'Azure subit une panne dans une région que vous utilisez." }
    - id: t2
      text: { en: "Receive an email when the CPU usage of a virtual machine exceeds 80%.", fr: "Recevoir un e-mail quand l'utilisation du processeur d'une machine virtuelle dépasse 80 %." }
    - id: t3
      text: { en: "Obtain a list of the virtual machines that are underused and could cost less.", fr: "Obtenir la liste des machines virtuelles sous-utilisées qui pourraient coûter moins cher." }
answer:
  mapping: { t1: sh, t2: alerts, t3: adv }
explanation:
  correct:
    en: "Azure Service Health informs you of the health of the Azure platform for the services and regions that you use. An Azure Monitor alert notifies you when a metric of one of your resources, such as CPU usage, crosses a threshold. Azure Advisor analyzes the usage of your resources and recommends resizing or shutting down underused virtual machines."
    fr: "Azure Service Health vous informe de l'état de santé de la plateforme Azure pour les services et les régions que vous utilisez. Une alerte Azure Monitor vous notifie quand une métrique de l'une de vos ressources, par exemple l'utilisation du processeur, franchit un seuil. Azure Advisor analyse l'utilisation de vos ressources et recommande de redimensionner ou d'arrêter les machines virtuelles sous-utilisées."
  options:
    la:
      en: "Log Analytics is used to write and run queries on collected logs."
      fr: "Log Analytics sert à écrire et exécuter des requêtes sur les journaux collectés."
    ai:
      en: "Application Insights monitors the performance and usage of web applications."
      fr: "Application Insights surveille les performances et l'usage des applications web."
references:
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
