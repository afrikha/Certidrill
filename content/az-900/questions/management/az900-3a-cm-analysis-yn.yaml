id: az900-3a-cm-analysis-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A finance team starts using Cost Management to follow the costs of a subscription.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe financière commence à utiliser Cost Management pour suivre les coûts d'un abonnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Cost analysis can break down costs by tag.
        fr: L'analyse des coûts peut ventiler les coûts par étiquette.
    - id: s2
      text:
        en: Cost analysis can display a forecast of future costs that is based on past usage.
        fr: L'analyse des coûts peut afficher une prévision des coûts futurs fondée sur l'utilisation passée.
    - id: s3
      text:
        en: A budget alert is generated only after the full amount of the budget is spent.
        fr: Une alerte de budget n'est générée qu'une fois le montant total du budget dépensé.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Cost analysis groups and filters costs by pivots such as service, location, resource group or tag, and it can project a forecast from historical usage. A budget alert fires when spending reaches the threshold that you define for the budget, for example 80%, so the warning can arrive before the budget is used up.
    fr: "L'analyse des coûts regroupe et filtre les coûts selon des axes comme le service, l'emplacement, le groupe de ressources ou l'étiquette, et elle peut projeter une prévision à partir de l'historique d'utilisation. Une alerte de budget se déclenche quand les dépenses atteignent le seuil que vous définissez pour le budget, par exemple 80 % : l'avertissement peut donc arriver avant que le budget soit épuisé."
  options:
    s3:
      en: The threshold is a percentage of the budget that you choose; it doesn't have to be 100%.
      fr: "Le seuil est un pourcentage du budget que vous choisissez ; il n'est pas forcément de 100 %."
references:
  - title: "Quickstart: Start using Cost Analysis"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/quick-acm-cost-analysis
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
