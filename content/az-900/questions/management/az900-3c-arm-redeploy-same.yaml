id: az900-3c-arm-redeploy-same
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys an ARM template that defines one storage account to a resource group. The deployment succeeds.

    Every night, a pipeline deploys the same unchanged template to the same resource group. Nobody modifies the storage account between two deployments.

    What is the result of each nightly deployment?
  fr: |
    Fabrikam déploie dans un groupe de ressources un modèle ARM qui définit un compte de stockage. Le déploiement réussit.

    Chaque nuit, un pipeline déploie le même modèle, inchangé, dans le même groupe de ressources. Personne ne modifie le compte de stockage entre deux déploiements.

    Quel est le résultat de chaque déploiement nocturne ?
body:
  options:
    - { id: a, text: { en: "The deployment fails because the storage account already exists.", fr: "Le déploiement échoue, car le compte de stockage existe déjà." } }
    - { id: b, text: { en: "A second storage account is created with a generated name.", fr: "Un second compte de stockage est créé avec un nom généré." } }
    - { id: c, text: { en: "The storage account is deleted and then created again.", fr: "Le compte de stockage est supprimé, puis créé de nouveau." } }
    - { id: d, text: { en: "The deployment succeeds and the storage account is unchanged.", fr: "Le déploiement réussit et le compte de stockage reste inchangé." } }
answer: { optionId: d }
explanation:
  correct:
    en: "ARM templates give repeatable results: they are idempotent. Deploying the same template again produces the same resources in the same state, so when the storage account already exists with the specified properties, no change is made."
    fr: "Les modèles ARM donnent des résultats reproductibles : ils sont idempotents. Redéployer le même modèle produit les mêmes ressources dans le même état ; si le compte de stockage existe déjà avec les propriétés indiquées, aucune modification n'est apportée."
  options:
    a:
      en: "An existing resource that matches the template is not an error; the template describes a desired state, not a creation command."
      fr: "Une ressource existante conforme au modèle n'est pas une erreur ; le modèle décrit un état souhaité, pas une commande de création."
    b:
      en: "The template names the storage account; Azure Resource Manager does not create a copy under another name."
      fr: "Le modèle nomme le compte de stockage ; Azure Resource Manager ne crée pas de copie sous un autre nom."
    c:
      en: "A resource that already matches the template is left as it is; it is not deleted and re-created."
      fr: "Une ressource déjà conforme au modèle est laissée telle quelle ; elle n'est ni supprimée ni recréée."
references:
  - title: What are ARM templates?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
