id: az900-3b-policy-match-tools
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the Azure feature that meets it. To answer, drag the appropriate feature to each requirement. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence à la fonctionnalité Azure qui y répond. Pour répondre, faites glisser la fonctionnalité appropriée vers chaque exigence. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: "Azure Policy" }
    - { id: rbac, text: "Azure RBAC" }
    - { id: lock, text: { en: "Resource lock", fr: "Verrou de ressource" } }
    - { id: purview, text: "Microsoft Purview" }
  targets:
    - id: t1
      text: { en: "Allow only approved virtual machine sizes to be deployed in a subscription", fr: "N'autoriser que le déploiement de tailles de machines virtuelles approuvées dans un abonnement" }
    - id: t2
      text: { en: "Allow only the database team to manage the SQL databases of a resource group", fr: "N'autoriser que l'équipe des bases de données à gérer les bases de données SQL d'un groupe de ressources" }
    - id: t3
      text: { en: "Protect a production virtual network against accidental deletion, including by users who have the Owner role", fr: "Protéger un réseau virtuel de production contre la suppression accidentelle, y compris par des utilisateurs qui disposent du rôle Owner" }
answer:
  mapping: { t1: policy, t2: rbac, t3: lock }
explanation:
  correct:
    en: "Azure Policy sets rules on the configuration of resources, such as the allowed sizes, for everyone. Azure RBAC decides who can do what: it grants the database team the right to manage the databases. A resource lock blocks deletion for all users, owners included, until the lock is removed. Microsoft Purview governs data and meets none of these requirements."
    fr: "Azure Policy fixe des règles sur la configuration des ressources, comme les tailles autorisées, pour tout le monde. Azure RBAC décide qui peut faire quoi : il accorde à l'équipe des bases de données le droit de gérer les bases. Un verrou de ressource bloque la suppression pour tous les utilisateurs, propriétaires compris, tant qu'il n'est pas retiré. Microsoft Purview gouverne les données et ne répond à aucune de ces exigences."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
