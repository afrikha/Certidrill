id: az900-3c-mon-appinsights-statements
objective: "3.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Application Insights, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Application Insights, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Application Insights can check at regular intervals that a web application responds, even when no user is visiting it."
        fr: "Application Insights peut vérifier à intervalles réguliers qu'une application web répond, même quand aucun utilisateur ne la consulte."
    - id: s2
      text:
        en: "Adding an SDK to the application code is the only way to enable Application Insights for a web application."
        fr: "Ajouter un SDK au code de l'application est le seul moyen d'activer Application Insights pour une application web."
    - id: s3
      text:
        en: "Application Insights can monitor a web application that runs on servers in your own datacenter."
        fr: "Application Insights peut surveiller une application web qui s'exécute sur des serveurs de votre propre centre de données."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Availability tests send synthetic requests to the application, so you know that it responds even during periods without traffic. Application Insights is enabled either with an SDK added to the code or with an agent that needs no code change. It monitors web applications wherever they run: in Azure, on-premises or in another cloud."
    fr: "Les tests de disponibilité envoient des requêtes synthétiques à l'application : vous savez ainsi qu'elle répond, même pendant les périodes sans trafic. Application Insights s'active soit avec un SDK ajouté au code, soit avec un agent qui ne demande aucune modification du code. Il surveille les applications web où qu'elles s'exécutent : dans Azure, en local ou dans un autre cloud."
references:
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
  - title: Introduction to Application Insights - OpenTelemetry observability
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
