id: az900-3c-adv-new-reco-alert
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys reviews its Azure Advisor recommendations once a quarter. The finance team wants to receive an email each time Advisor issues a new cost recommendation for the production subscription.

    What should you create?
  fr: |
    Tailspin Toys examine ses recommandations Azure Advisor une fois par trimestre. L'équipe financière souhaite recevoir un e-mail chaque fois qu'Advisor émet une nouvelle recommandation de coût pour l'abonnement de production.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A Service Health alert with an action group", fr: "Une alerte Service Health avec un groupe d'actions" } }
    - { id: b, text: { en: "A metric alert with an action group", fr: "Une alerte de métrique avec un groupe d'actions" } }
    - { id: c, text: { en: "An Advisor alert with an action group", fr: "Une alerte Advisor avec un groupe d'actions" } }
    - { id: d, text: { en: "A budget with an alert threshold", fr: "Un budget avec un seuil d'alerte" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Advisor can notify you of new recommendations: you create an Advisor alert for a subscription and, for example, a recommendation category such as cost. The alert uses an action group, which defines who is notified, here by email."
    fr: "Advisor peut vous notifier des nouvelles recommandations : vous créez une alerte Advisor pour un abonnement et, par exemple, une catégorie de recommandations comme le coût. L'alerte utilise un groupe d'actions, qui définit qui est notifié, ici par e-mail."
  options:
    a:
      en: "A Service Health alert notifies you of service issues, planned maintenance and health advisories of the Azure platform, not of Advisor recommendations."
      fr: "Une alerte Service Health vous notifie des problèmes de service, de la maintenance planifiée et des avis d'intégrité de la plateforme Azure, pas des recommandations d'Advisor."
    b:
      en: "A metric alert fires when a metric of a resource, such as CPU usage, crosses a threshold; it does not watch Advisor recommendations."
      fr: "Une alerte de métrique se déclenche quand une métrique d'une ressource, par exemple l'utilisation du processeur, franchit un seuil ; elle ne surveille pas les recommandations d'Advisor."
    d:
      en: "A budget warns you when spending reaches a threshold; it does not report new recommendations."
      fr: "Un budget vous avertit quand les dépenses atteignent un seuil ; il ne signale pas les nouvelles recommandations."
references:
  - title: Create Azure Advisor alerts on new recommendations by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-alerts-portal
  - title: Describe the purpose of Azure Advisor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/2-describe-purpose-of-azure-advisor
