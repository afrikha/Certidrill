id: az900-3c-mon-data-types
objective: "3.4.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Monitor collects two main types of data: [[num]], which are numeric values measured at regular intervals, and [[rec]], which are records of events.
    fr: |
      Azure Monitor collecte deux grands types de données : les [[num]], des valeurs numériques mesurées à intervalles réguliers, et les [[rec]], des enregistrements d'événements.
  slots:
    - id: num
      options:
        - { id: logs, text: { en: "logs", fr: "journaux" } }
        - { id: alerts, text: { en: "alerts", fr: "alertes" } }
        - { id: metrics, text: { en: "metrics", fr: "métriques" } }
        - { id: dash, text: { en: "dashboards", fr: "tableaux de bord" } }
    - id: rec
      options:
        - { id: logs, text: { en: "logs", fr: "journaux" } }
        - { id: alerts, text: { en: "alerts", fr: "alertes" } }
        - { id: metrics, text: { en: "metrics", fr: "métriques" } }
        - { id: dash, text: { en: "dashboards", fr: "tableaux de bord" } }
answer:
  values: { num: metrics, rec: logs }
explanation:
  correct:
    en: "Metrics are numerical values collected at regular intervals that describe an aspect of a system at a given time, such as CPU usage. Logs are records of events, which you analyze with queries. Alerts and dashboards are not data: they use these data to notify and to visualize."
    fr: "Les métriques sont des valeurs numériques collectées à intervalles réguliers qui décrivent un aspect d'un système à un instant donné, par exemple l'utilisation du processeur. Les journaux sont des enregistrements d'événements, que vous analysez avec des requêtes. Les alertes et les tableaux de bord ne sont pas des données : ils exploitent ces données pour notifier et pour visualiser."
references:
  - title: Azure Monitor Metrics overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
  - title: Azure Monitor overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview
