id: az900-3b-arc-hybrid-multicloud
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs servers in its own datacenter and virtual machines at another cloud provider. Contoso wants to manage all of them from Azure, with the same tools as its Azure resources, without moving them.

    Which service should Contoso use?
  fr: |
    Contoso exploite des serveurs dans son propre centre de données et des machines virtuelles chez un autre fournisseur de cloud. Contoso souhaite les gérer tous depuis Azure, avec les mêmes outils que ses ressources Azure, sans les déplacer.

    Quel service Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Migrate" }
    - { id: b, text: "Azure ExpressRoute" }
    - { id: c, text: "Azure Arc" }
    - { id: d, text: "Azure VPN Gateway" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Arc provides a consistent management platform for multicloud and on-premises environments. It projects resources that run outside Azure into Azure Resource Manager, so that they are managed as if they ran in Azure, without being moved."
    fr: "Azure Arc fournit une plateforme de gestion cohérente pour les environnements multiclouds et locaux. Il projette dans Azure Resource Manager les ressources qui s'exécutent hors d'Azure, de sorte qu'elles se gèrent comme si elles s'exécutaient dans Azure, sans être déplacées."
  options:
    a:
      en: "Azure Migrate assesses and moves workloads to Azure; Contoso wants to manage its machines where they are."
      fr: "Azure Migrate évalue et déplace des charges de travail vers Azure ; Contoso veut gérer ses machines là où elles se trouvent."
    b:
      en: "ExpressRoute is a private network connection to Azure; it provides connectivity, not management of the servers."
      fr: "ExpressRoute est une connexion réseau privée vers Azure ; il fournit de la connectivité, pas la gestion des serveurs."
    d:
      en: "A VPN gateway connects networks through encrypted tunnels; it does not manage servers."
      fr: "Une passerelle VPN relie des réseaux par des tunnels chiffrés ; elle ne gère pas de serveurs."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
