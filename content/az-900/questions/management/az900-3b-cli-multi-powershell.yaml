id: az900-3b-cli-multi-powershell
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Azure PowerShell are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies à propos d'Azure PowerShell ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It can be installed on Windows, Linux, and macOS.", fr: "Il peut être installé sous Windows, Linux et macOS." } }
    - { id: b, text: { en: "It can manage only virtual machines that run Windows.", fr: "Il ne peut gérer que des machines virtuelles qui exécutent Windows." } }
    - { id: c, text: { en: "Its cmdlets can be combined in scripts to deploy an entire infrastructure.", fr: "Ses cmdlets peuvent être combinées dans des scripts pour déployer toute une infrastructure." } }
    - { id: d, text: { en: "It is available only in Azure Cloud Shell.", fr: "Il n'est disponible que dans Azure Cloud Shell." } }
    - { id: e, text: { en: "Its commands all begin with the keyword az.", fr: "Ses commandes commencent toutes par le mot clé az." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Azure PowerShell can be installed on Windows, Linux and macOS, and it is also available in Cloud Shell. Its cmdlets can be run one at a time or combined in scripts that set up, tear down or maintain anything from one resource to an entire infrastructure."
    fr: "Azure PowerShell peut être installé sous Windows, Linux et macOS, et il est aussi disponible dans Cloud Shell. Ses cmdlets peuvent être exécutées une à une ou combinées dans des scripts qui mettent en place, suppriment ou entretiennent aussi bien une ressource que toute une infrastructure."
  options:
    b:
      en: "Azure PowerShell manages Azure resources of all kinds, whatever the operating system of the virtual machines."
      fr: "Azure PowerShell gère des ressources Azure de toutes sortes, quel que soit le système d'exploitation des machines virtuelles."
    d:
      en: "Cloud Shell includes Azure PowerShell, but the module can also be installed locally."
      fr: "Cloud Shell inclut Azure PowerShell, mais le module peut aussi être installé localement."
    e:
      en: "Commands that begin with az belong to the Azure CLI; Azure PowerShell uses cmdlets such as New-AzResourceGroup."
      fr: "Les commandes qui commencent par az appartiennent à Azure CLI ; Azure PowerShell utilise des cmdlets comme New-AzResourceGroup."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is Azure PowerShell
    url: https://learn.microsoft.com/en-us/powershell/azure/what-is-azure-powershell
