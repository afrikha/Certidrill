id: az900-3c-sh-planned-maintenance
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs virtual machines in the West Europe region. The operations team wants to know in advance when Microsoft plans maintenance that might affect these virtual machines.

    Which Azure service should the team use?
  fr: |
    Contoso exécute des machines virtuelles dans la région West Europe. L'équipe d'exploitation veut savoir à l'avance quand Microsoft planifie une maintenance susceptible de toucher ces machines virtuelles.

    Quel service Azure l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: Azure Service Health }
    - { id: b, text: Log Analytics }
    - { id: c, text: Azure Advisor }
    - { id: d, text: Microsoft Defender for Cloud }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Service Health gives a personalized view of the health of the Azure services and regions that you use. It communicates service issues, upcoming planned maintenance and health advisories."
    fr: "Azure Service Health donne une vue personnalisée de l'état de santé des services et des régions Azure que vous utilisez. Il communique les problèmes de service, la maintenance planifiée à venir et les avis d'intégrité."
  options:
    c:
      en: "Azure Advisor recommends improvements to your own resources; it does not announce maintenance of the platform."
      fr: "Azure Advisor recommande des améliorations de vos propres ressources ; il n'annonce pas la maintenance de la plateforme."
    b:
      en: "Log Analytics is used to query the logs that Azure Monitor collects from your resources."
      fr: "Log Analytics sert à interroger les journaux qu'Azure Monitor collecte depuis vos ressources."
    d:
      en: "Microsoft Defender for Cloud assesses and protects the security of your resources; it does not announce maintenance."
      fr: "Microsoft Defender for Cloud évalue et protège la sécurité de vos ressources ; il n'annonce pas la maintenance."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
