id: az900-3c-sh-purpose-statements
objective: "3.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Service Health recommends resizing the virtual machines that are underused."
        fr: "Azure Service Health recommande de redimensionner les machines virtuelles sous-utilisées."
    - id: s2
      text:
        en: "Resource Health provides a global view of all Azure services in all regions."
        fr: "Resource Health fournit une vue mondiale de tous les services Azure dans toutes les régions."
    - id: s3
      text:
        en: "Service Health can inform you of planned maintenance that might affect your resources."
        fr: "Service Health peut vous informer d'une maintenance planifiée susceptible de toucher vos ressources."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Recommendations such as resizing underused virtual machines come from Azure Advisor. The global view of all services and regions is Azure status; Resource Health concerns your individual resources. Service Health communicates service issues, planned maintenance and health advisories for the services and regions that you use."
    fr: "Les recommandations comme le redimensionnement de machines virtuelles sous-utilisées proviennent d'Azure Advisor. La vue mondiale de tous les services et régions est État d'Azure ; Resource Health concerne vos ressources individuelles. Service Health communique les problèmes de service, la maintenance planifiée et les avis d'intégrité pour les services et les régions que vous utilisez."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
