id: az900-3b-iac-multi-benefits
objective: "3.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two benefits does infrastructure as code provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux avantages qu'apporte l'infrastructure en tant que code ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The same environment can be deployed repeatedly with consistent results.", fr: "Le même environnement peut être déployé de façon répétée avec des résultats cohérents." } }
    - { id: b, text: { en: "Resources that are deployed from code are billed at a reduced rate.", fr: "Les ressources déployées à partir de code sont facturées à un tarif réduit." } }
    - { id: c, text: { en: "Infrastructure changes can be versioned and reviewed like application code.", fr: "Les modifications de l'infrastructure peuvent être versionnées et relues comme du code applicatif." } }
    - { id: d, text: { en: "Resources that are deployed from code are exempt from Azure Policy.", fr: "Les ressources déployées à partir de code sont dispensées d'Azure Policy." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "An infrastructure as code definition generates the same environment every time it is deployed, which makes deployments repeatable and consistent. Because the infrastructure is described in files, it can be versioned in source control and reviewed like application code."
    fr: "Une définition d'infrastructure en tant que code génère le même environnement à chaque déploiement, ce qui rend les déploiements reproductibles et cohérents. Comme l'infrastructure est décrite dans des fichiers, elle peut être versionnée dans le contrôle de code source et relue comme du code applicatif."
  options:
    b:
      en: "The price of a resource does not depend on the tool that deployed it."
      fr: "Le prix d'une ressource ne dépend pas de l'outil qui l'a déployée."
    d:
      en: "Azure Policy applies to every deployment, whatever the tool: a deployment from code that breaks a policy is denied or reported like any other."
      fr: "Azure Policy s'applique à tous les déploiements, quel que soit l'outil : un déploiement à partir de code qui enfreint une stratégie est refusé ou signalé comme les autres."
references:
  - title: What is infrastructure as code (IaC)?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code
