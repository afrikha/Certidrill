id: az900-3a-purview-definition-dd
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answer that correctly completes each sentence.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement chaque phrase.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Purview is a family of [[family]] solutions.

      It gives you [[view]] of your data, whether the data is on-premises, in several clouds or in software as a service (SaaS) applications.
    fr: |
      Microsoft Purview est une famille de solutions de [[family]].

      Il vous donne [[view]] de vos données, qu'elles se trouvent en local, dans plusieurs clouds ou dans des applications SaaS (software as a service).
  slots:
    - id: family
      options:
        - { id: cost, text: { en: "cost management and billing", fr: "gestion des coûts et de facturation" } }
        - { id: gov, text: { en: "data governance, risk and compliance", fr: "gouvernance des données, de gestion des risques et de conformité" } }
        - { id: net, text: { en: "network security and connectivity", fr: "sécurité et de connectivité réseau" } }
        - { id: iam, text: { en: "identity and access management", fr: "gestion des identités et des accès" } }
    - id: view
      options:
        - { id: view, text: { en: "a single, unified view", fr: "une vue unique et unifiée" } }
        - { id: copy, text: { en: "a geo-redundant copy", fr: "une copie géoredondante" } }
        - { id: estimate, text: { en: "a monthly cost estimate", fr: "une estimation mensuelle du coût" } }
answer:
  values: { family: gov, view: view }
explanation:
  correct:
    en: Microsoft Purview is a family of data governance, risk and compliance solutions. It brings together insights about on-premises, multicloud and SaaS data to give a single, unified view of the data of the organization.
    fr: Microsoft Purview est une famille de solutions de gouvernance des données, de gestion des risques et de conformité. Il rassemble des informations sur les données locales, multiclouds et SaaS pour donner une vue unique et unifiée des données de l'organisation.
  options:
    cost:
      en: Cost management and billing are the domain of Microsoft Cost Management.
      fr: La gestion des coûts et la facturation sont le domaine de Microsoft Cost Management.
    iam:
      en: Identity and access management is the domain of Microsoft Entra ID.
      fr: La gestion des identités et des accès est le domaine de Microsoft Entra ID.
    copy:
      en: Purview describes and governs data; it doesn't replicate it. Geo-redundant copies are a redundancy option of Azure Storage.
      fr: "Purview décrit et gouverne les données ; il ne les réplique pas. Les copies géoredondantes sont une option de redondance de Stockage Azure."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
