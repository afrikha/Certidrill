id: az900-3b-cli-cloudshell-choice
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which shell experiences does Azure Cloud Shell let you choose between?
  fr: |
    Entre quelles expériences de shell Azure Cloud Shell vous laisse-t-il choisir ?
body:
  options:
    - { id: a, text: { en: "Command Prompt or PowerShell", fr: "Invite de commandes ou PowerShell" } }
    - { id: b, text: { en: "Bash or Python", fr: "Bash ou Python" } }
    - { id: c, text: { en: "Bash or PowerShell", fr: "Bash ou PowerShell" } }
    - { id: d, text: { en: "Command Prompt or Bash", fr: "Invite de commandes ou Bash" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Cloud Shell is a browser-accessible terminal in which you choose between Bash and PowerShell. Both the Azure CLI and Azure PowerShell are available in it, so you work with the shell that you know best."
    fr: "Azure Cloud Shell est un terminal accessible depuis le navigateur dans lequel vous choisissez entre Bash et PowerShell. Azure CLI et Azure PowerShell y sont tous deux disponibles : vous travaillez avec le shell que vous connaissez le mieux."
  options:
    a:
      en: "The Windows Command Prompt is not one of the Cloud Shell experiences."
      fr: "L'invite de commandes Windows ne fait pas partie des expériences de Cloud Shell."
    b:
      en: "Bash is offered, but the second experience is PowerShell, not a Python shell."
      fr: "Bash est bien proposé, mais la seconde expérience est PowerShell, pas un shell Python."
    d:
      en: "Bash is offered, but the Windows Command Prompt is not."
      fr: "Bash est bien proposé, mais pas l'invite de commandes Windows."
references:
  - title: What is Azure Cloud Shell?
    url: https://learn.microsoft.com/en-us/azure/cloud-shell/overview
