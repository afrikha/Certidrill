id: az900-3a-cm-advisor-recos
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Cost Management displays recommendations to reduce spending, for example for virtual machines whose usage is low.

    Which service generates these recommendations?
  fr: |
    Cost Management affiche des recommandations pour réduire les dépenses, par exemple pour des machines virtuelles peu utilisées.

    Quel service génère ces recommandations ?
body:
  options:
    - id: a
      text: { en: "Azure Policy", fr: "Azure Policy" }
    - id: b
      text: { en: "Azure Advisor", fr: "Azure Advisor" }
    - id: c
      text: { en: "Microsoft Purview", fr: "Microsoft Purview" }
    - id: d
      text: { en: "Azure Service Health", fr: "Azure Service Health" }
answer: { optionId: b }
explanation:
  correct:
    en: The cost recommendations shown in Cost Management come from Azure Advisor. Advisor analyzes usage patterns, identifies resources with low usage and proposes actions to reduce spending.
    fr: Les recommandations de coût affichées dans Cost Management viennent d'Azure Advisor. Advisor analyse les habitudes d'utilisation, repère les ressources peu utilisées et propose des actions pour réduire les dépenses.
  options:
    a:
      en: Azure Policy checks that resources comply with rules; it doesn't analyze usage to suggest savings.
      fr: "Azure Policy vérifie que les ressources respectent des règles ; il n'analyse pas l'utilisation pour suggérer des économies."
    c:
      en: Microsoft Purview governs data, with discovery, classification and lineage; it isn't a cost tool.
      fr: "Microsoft Purview gouverne les données, avec la découverte, la classification et la traçabilité ; ce n'est pas un outil de coût."
    d:
      en: Azure Service Health informs about incidents and maintenance that affect Azure services.
      fr: Azure Service Health informe sur les incidents et les maintenances qui touchent les services Azure.
references:
  - title: What is Microsoft Cost Management
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
  - title: Plan to manage Azure costs
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/understand/plan-manage-costs
