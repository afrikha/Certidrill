id: az900-3c-mon-purpose
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum needs a platform that collects metrics and logs from its Azure resources and from its on-premises servers, and that then lets the company analyze the data, visualize it and act on it.

    Which Azure service should Adatum use?
  fr: |
    Adatum a besoin d'une plateforme qui collecte des métriques et des journaux depuis ses ressources Azure et ses serveurs locaux, puis qui lui permette d'analyser ces données, de les visualiser et d'agir.

    Quel service Azure Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: Azure Advisor }
    - { id: b, text: Azure Service Health }
    - { id: c, text: Azure Arc }
    - { id: d, text: Azure Monitor }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Monitor is the platform for collecting, analyzing and acting on data from your resources and applications. It gathers metrics and logs, and it works with Azure, on-premises and multicloud environments."
    fr: "Azure Monitor est la plateforme qui sert à collecter des données sur vos ressources et vos applications, à les analyser et à agir. Il rassemble des métriques et des journaux, et il fonctionne avec les environnements Azure, locaux et multicloud."
  options:
    a:
      en: "Azure Advisor makes best-practice recommendations; it is not a platform for collecting and analyzing metrics and logs."
      fr: "Azure Advisor formule des recommandations de bonnes pratiques ; ce n'est pas une plateforme de collecte et d'analyse de métriques et de journaux."
    b:
      en: "Azure Service Health reports on the health of the Azure platform itself, not on the data of your resources."
      fr: "Azure Service Health rend compte de l'état de santé de la plateforme Azure elle-même, pas des données de vos ressources."
    c:
      en: "Azure Arc extends Azure management to resources outside Azure; the collection and analysis of monitoring data is the role of Azure Monitor."
      fr: "Azure Arc étend la gestion Azure aux ressources situées hors d'Azure ; la collecte et l'analyse des données de surveillance sont le rôle d'Azure Monitor."
references:
  - title: Azure Monitor overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview
  - title: Describe Azure Monitor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor
