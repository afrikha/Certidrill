id: az900-3c-adv-behavior-statements
objective: "3.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Advisor, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Advisor, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Advisor recommendations are personalized for the resources that you deployed."
        fr: "Les recommandations d'Azure Advisor sont personnalisées pour les ressources que vous avez déployées."
    - id: s2
      text:
        en: "Azure Advisor automatically applies each of its recommendations to your resources."
        fr: "Azure Advisor applique automatiquement chacune de ses recommandations à vos ressources."
    - id: s3
      text:
        en: "You can postpone or dismiss an Azure Advisor recommendation."
        fr: "Vous pouvez reporter ou ignorer une recommandation d'Azure Advisor."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Advisor analyzes the configuration and usage of your own resources, so its recommendations are personalized. It only recommends: each recommendation comes with a proposed action that you decide to take right away, to postpone or to dismiss. Nothing is changed on your resources without your action."
    fr: "Advisor analyse la configuration et l'utilisation de vos propres ressources : ses recommandations sont donc personnalisées. Il se contente de recommander : chaque recommandation est accompagnée d'une action proposée, que vous décidez d'appliquer tout de suite, de reporter ou d'ignorer. Rien n'est modifié sur vos ressources sans action de votre part."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
  - title: Describe the purpose of Azure Advisor
    url: https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/2-describe-purpose-of-azure-advisor
