id: az900-3a-calc-sentence-dd
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answer that correctly completes each sentence.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement chaque phrase.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Before a deployment, the pricing calculator provides [[what]] of the cost of the resources.

      Adding a resource to the pricing calculator [[effect]].

      To follow the actual cost of deployed resources, use [[tool]].
    fr: |
      Avant un déploiement, la calculatrice de prix fournit [[what]] du coût des ressources.

      Ajouter une ressource dans la calculatrice de prix [[effect]].

      Pour suivre le coût réel des ressources déployées, utilisez [[tool]].
  slots:
    - id: what
      options:
        - { id: invoice, text: { en: "an invoice", fr: "une facture" } }
        - { id: estimate, text: { en: "an estimate", fr: "une estimation" } }
        - { id: guarantee, text: { en: "a guarantee", fr: "une garantie" } }
    - id: effect
      options:
        - { id: nothing, text: { en: "provisions nothing in Azure", fr: "n'approvisionne rien dans Azure" } }
        - { id: stopped, text: { en: "provisions it in a stopped state", fr: "l'approvisionne à l'état arrêté" } }
        - { id: reserve, text: { en: "reserves its capacity for 30 days", fr: "réserve sa capacité pendant 30 jours" } }
    - id: tool
      options:
        - { id: policy, text: "Azure Policy" }
        - { id: health, text: "Azure Service Health" }
        - { id: cm, text: "Cost Management" }
answer:
  values: { what: estimate, effect: nothing, tool: cm }
explanation:
  correct:
    en: The pricing calculator gives an estimate, for information purposes only, of what planned resources would cost. Nothing is provisioned and nothing is charged when you add resources to it. Once resources are deployed, Cost Management shows what they really cost.
    fr: "La calculatrice de prix donne une estimation, à titre d'information uniquement, de ce que coûteraient les ressources prévues. Rien n'est approvisionné et rien n'est facturé quand vous y ajoutez des ressources. Une fois les ressources déployées, Cost Management montre ce qu'elles coûtent réellement."
  options:
    policy:
      en: Azure Policy controls and audits the configuration of resources, not their cost.
      fr: Azure Policy contrôle et audite la configuration des ressources, pas leur coût.
    health:
      en: Azure Service Health informs about incidents and maintenance of Azure services.
      fr: Azure Service Health informe sur les incidents et les maintenances des services Azure.
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
