id: az900-3a-tag-basics-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A resource can have several tags.
        fr: Une ressource peut porter plusieurs étiquettes.
    - id: s2
      text:
        en: A given tag name and value can be applied to only one resource of a subscription.
        fr: Un nom et une valeur d'étiquette donnés ne peuvent être appliqués qu'à une seule ressource d'un abonnement.
    - id: s3
      text:
        en: Tags can be used to group resources in cost reports.
        fr: Les étiquettes peuvent servir à regrouper des ressources dans les rapports de coûts.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: You can assign one or more tags to each resource. The value of tags comes from applying the same name and value, such as Environment = Production, to many resources so that they can be found and grouped together. One of the main uses of this grouping is to report on costs, allocate them to cost centers and track budgets.
    fr: "Vous pouvez attribuer une ou plusieurs étiquettes à chaque ressource. L'intérêt des étiquettes vient justement du fait d'appliquer le même nom et la même valeur, comme Environment = Production, à de nombreuses ressources pour pouvoir les retrouver et les regrouper. L'un des principaux usages de ce regroupement est de rendre compte des coûts, de les affecter à des centres de coûts et de suivre des budgets."
references:
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
