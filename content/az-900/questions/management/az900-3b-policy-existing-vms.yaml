id: az900-3b-policy-existing-vms
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure subscription contains 20 virtual machines. You assign to the subscription a policy that allows only two virtual machine sizes. Five of the existing virtual machines use a size that is not allowed.

    What happens to these five virtual machines?
  fr: |
    Un abonnement Azure contient 20 machines virtuelles. Vous attribuez à l'abonnement une stratégie qui n'autorise que deux tailles de machines virtuelles. Cinq des machines virtuelles existantes utilisent une taille non autorisée.

    Qu'advient-il de ces cinq machines virtuelles ?
body:
  options:
    - { id: a, text: { en: "They are deleted from the subscription.", fr: "Elles sont supprimées de l'abonnement." } }
    - { id: b, text: { en: "They are stopped until their size is changed.", fr: "Elles sont arrêtées jusqu'à ce que leur taille soit modifiée." } }
    - { id: c, text: { en: "They are resized automatically to an allowed size.", fr: "Elles sont redimensionnées automatiquement vers une taille autorisée." } }
    - { id: d, text: { en: "They keep running and are flagged as noncompliant.", fr: "Elles continuent de fonctionner et sont signalées comme non conformes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Policy also evaluates the resources that existed before the assignment and highlights those that do not comply. A policy that restricts sizes blocks the creation or the resizing of a virtual machine to a forbidden size, but it leaves existing machines in place."
    fr: "Azure Policy évalue aussi les ressources qui existaient avant l'attribution et met en évidence celles qui ne sont pas conformes. Une stratégie qui limite les tailles bloque la création ou le redimensionnement d'une machine virtuelle vers une taille interdite, mais elle laisse en place les machines existantes."
  options:
    a:
      en: "Azure Policy never deletes existing resources because they are noncompliant; it reports them."
      fr: "Azure Policy ne supprime jamais des ressources existantes parce qu'elles sont non conformes ; il les signale."
    b:
      en: "Assigning a policy does not stop running virtual machines; their state is unchanged."
      fr: "L'attribution d'une stratégie n'arrête pas les machines virtuelles en cours d'exécution ; leur état ne change pas."
    c:
      en: "A policy that allows only certain sizes does not resize existing machines; an administrator decides what to do with the noncompliant ones."
      fr: "Une stratégie qui n'autorise que certaines tailles ne redimensionne pas les machines existantes ; c'est un administrateur qui décide du sort des machines non conformes."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
