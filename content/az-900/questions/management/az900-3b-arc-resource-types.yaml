id: az900-3b-arc-resource-types
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which resource can you manage from Azure by using Azure Arc?
  fr: |
    Quelle ressource pouvez-vous gérer depuis Azure à l'aide d'Azure Arc ?
body:
  options:
    - { id: a, text: { en: "A Kubernetes cluster that runs at another cloud provider", fr: "Un cluster Kubernetes qui s'exécute chez un autre fournisseur de cloud" } }
    - { id: b, text: { en: "A mailbox that is hosted in Microsoft 365", fr: "Une boîte aux lettres hébergée dans Microsoft 365" } }
    - { id: c, text: { en: "A network switch that is installed in a branch office", fr: "Un commutateur réseau installé dans une succursale" } }
    - { id: d, text: { en: "A user account that is stored in an on-premises directory", fr: "Un compte d'utilisateur stocké dans un annuaire local" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Arc manages servers, Kubernetes clusters, Azure data services and SQL Server instances that run outside Azure, on-premises or in other clouds. A Kubernetes cluster hosted at another cloud provider can therefore be attached to Azure and managed from it."
    fr: "Azure Arc gère des serveurs, des clusters Kubernetes, des services de données Azure et des instances SQL Server qui s'exécutent hors d'Azure, en local ou dans d'autres clouds. Un cluster Kubernetes hébergé chez un autre fournisseur de cloud peut donc être rattaché à Azure et géré depuis Azure."
  options:
    b:
      en: "Mailboxes are managed in Microsoft 365; they are not a resource type of Azure Arc."
      fr: "Les boîtes aux lettres se gèrent dans Microsoft 365 ; ce n'est pas un type de ressource d'Azure Arc."
    c:
      en: "Network equipment is not among the resource types that Azure Arc manages."
      fr: "Les équipements réseau ne font pas partie des types de ressources gérés par Azure Arc."
    d:
      en: "User accounts are an identity matter, handled with Microsoft Entra services, not with Azure Arc."
      fr: "Les comptes d'utilisateurs relèvent de l'identité, traitée par les services Microsoft Entra, pas par Azure Arc."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
