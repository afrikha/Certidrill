id: az900-3b-lock-order-change
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A resource group named **RG1** has a Read-only lock and contains an App Service plan named **Plan1**. You have the Owner role for RG1.

    You need to change the pricing tier of Plan1. RG1 must be protected again as soon as the change is made.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un groupe de ressources nommé **RG1** possède un verrou Lecture seule et contient un plan App Service nommé **Plan1**. Vous disposez du rôle Owner sur RG1.

    Vous devez modifier le niveau tarifaire de Plan1. RG1 doit être de nouveau protégé dès que la modification est faite.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: uaa, text: { en: "Assign yourself the User Access Administrator role for RG1.", fr: "Vous attribuer le rôle User Access Administrator sur RG1." } }
    - { id: chg, text: { en: "Change the pricing tier of Plan1.", fr: "Modifier le niveau tarifaire de Plan1." } }
    - { id: add, text: { en: "Apply a Read-only lock to RG1.", fr: "Appliquer un verrou Lecture seule à RG1." } }
    - { id: dl, text: { en: "Apply a Delete lock to Plan1.", fr: "Appliquer un verrou Suppression à Plan1." } }
    - { id: rm, text: { en: "Remove the Read-only lock from RG1.", fr: "Retirer le verrou Lecture seule de RG1." } }
    - { id: mv, text: { en: "Move Plan1 to another resource group.", fr: "Déplacer Plan1 vers un autre groupe de ressources." } }
answer:
  sequence: [ rm, chg, add ]
explanation:
  correct:
    en: "Plan1 inherits the Read-only lock of RG1, and a lock applies even to an owner. Changing a locked resource is therefore a two-step process: remove the lock, then make the change. Applying the Read-only lock to RG1 again restores the protection."
    fr: "Plan1 hérite du verrou Lecture seule de RG1, et un verrou s'applique même à un propriétaire. Modifier une ressource verrouillée se fait donc en deux temps : retirer le verrou, puis effectuer la modification. Appliquer de nouveau le verrou Lecture seule à RG1 rétablit la protection."
  options:
    uaa: { en: "The Owner role already allows you to manage locks; an extra role does not lift the lock.", fr: "Le rôle Owner permet déjà de gérer les verrous ; un rôle supplémentaire ne lève pas le verrou." }
    dl: { en: "Adding a Delete lock to Plan1 does not remove the inherited Read-only lock, which keeps blocking the change.", fr: "Ajouter un verrou Suppression à Plan1 ne retire pas le verrou Lecture seule hérité, qui continue de bloquer la modification." }
    mv: { en: "A Read-only lock on a resource group prevents resources from being moved out of it, and a move is not needed to change a pricing tier.", fr: "Un verrou Lecture seule sur un groupe de ressources empêche d'en sortir des ressources, et un déplacement n'est pas nécessaire pour changer un niveau tarifaire." }
references:
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
