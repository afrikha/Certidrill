id: az900-3b-policy-dd-sentence
objective: "3.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To audit whether the storage accounts of a subscription accept only HTTPS connections, you use [[svc]].

      A policy definition takes effect on a scope, such as a subscription, when you create [[asg]] for that scope.
    fr: |
      Pour auditer si les comptes de stockage d'un abonnement n'acceptent que les connexions HTTPS, vous utilisez [[svc]].

      Une définition de stratégie prend effet sur une étendue, par exemple un abonnement, lorsque vous créez [[asg]] pour cette étendue.
  slots:
    - id: svc
      options:
        - { id: rbac, text: "Azure RBAC" }
        - { id: policy, text: "Azure Policy" }
        - { id: locks, text: { en: "resource locks", fr: "les verrous de ressources" } }
        - { id: purview, text: "Microsoft Purview" }
    - id: asg
      options:
        - { id: initiative, text: { en: "an initiative", fr: "une initiative" } }
        - { id: exemption, text: { en: "an exemption", fr: "une exemption" } }
        - { id: assignment, text: { en: "an assignment", fr: "une attribution" } }
answer:
  values: { svc: policy, asg: assignment }
explanation:
  correct:
    en: "Azure Policy audits or controls the configuration of resources, for example whether storage accounts require HTTPS. A definition only describes the rule: it takes effect when it is assigned to a scope (management group, subscription, resource group or resource). An initiative is a group of definitions, and an exemption removes a resource from the evaluation."
    fr: "Azure Policy audite ou contrôle la configuration des ressources, par exemple le fait que les comptes de stockage exigent HTTPS. Une définition ne fait que décrire la règle : elle prend effet lorsqu'elle est attribuée à une étendue (groupe d'administration, abonnement, groupe de ressources ou ressource). Une initiative est un groupe de définitions, et une exemption retire une ressource de l'évaluation."
references:
  - title: Overview of Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
