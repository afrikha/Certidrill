id: az900-3b-arc-yn-basics
objective: "3.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Arc lets you manage servers that run outside Azure by using Azure management tools.", fr: "Azure Arc permet de gérer avec les outils de gestion Azure des serveurs qui s'exécutent hors d'Azure." } }
    - { id: s2, text: { en: "Azure Arc supports only resources that are located in an on-premises datacenter.", fr: "Azure Arc ne prend en charge que les ressources situées dans un centre de données local." } }
    - { id: s3, text: { en: "Azure Arc can extend Azure management to SQL Server instances that are hosted outside Azure.", fr: "Azure Arc peut étendre la gestion Azure à des instances SQL Server hébergées hors d'Azure." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Azure Arc extends Azure management to resources that run outside Azure. These resources can be on-premises, but also at the edge or in other public clouds: Azure Arc targets hybrid and multicloud environments. Servers, Kubernetes clusters, Azure data services and SQL Server are among the resource types that it manages."
    fr: "Azure Arc étend la gestion Azure aux ressources qui s'exécutent hors d'Azure. Ces ressources peuvent être locales, mais aussi en périphérie ou dans d'autres clouds publics : Azure Arc vise les environnements hybrides et multiclouds. Les serveurs, les clusters Kubernetes, les services de données Azure et SQL Server font partie des types de ressources qu'il gère."
references:
  - title: Describe the purpose of Azure Arc
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
