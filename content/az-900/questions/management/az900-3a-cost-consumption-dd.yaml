id: az900-3a-cost-consumption-dd
objective: "3.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answer that correctly completes each sentence.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez la réponse qui complète correctement chaque phrase.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      With [[m1]], you pay only for the resources that you use during the billing cycle, without any commitment.

      For a workload with stable and predictable needs, you can reduce costs by buying [[m2]] for a term of [[m3]].
    fr: |
      Avec [[m1]], vous ne payez que les ressources que vous utilisez pendant le cycle de facturation, sans aucun engagement.

      Pour une charge de travail aux besoins stables et prévisibles, vous pouvez réduire les coûts en achetant [[m2]] pour une durée [[m3]].
  slots:
    - id: m1
      options:
        - { id: payg, text: { en: "pay-as-you-go pricing", fr: "le paiement à l'utilisation" } }
        - { id: resv, text: { en: "an Azure reservation", fr: "une réservation Azure" } }
        - { id: plan, text: { en: "an Azure savings plan for compute", fr: "un plan d'économies Azure pour le calcul" } }
    - id: m2
      options:
        - { id: support, text: { en: "a support plan", fr: "un plan de support" } }
        - { id: resv, text: { en: "a reservation", fr: "une réservation" } }
        - { id: spot, text: { en: "a Spot virtual machine", fr: "une machine virtuelle Spot" } }
    - id: m3
      options:
        - { id: months, text: { en: "one or three months", fr: "d'un ou trois mois" } }
        - { id: five, text: { en: "five years", fr: "de cinq ans" } }
        - { id: years, text: { en: "one or three years", fr: "d'un ou trois ans" } }
answer:
  values: { m1: payg, m2: resv, m3: years }
explanation:
  correct:
    en: Pay-as-you-go follows consumption. You pay for what you use during the billing cycle and nothing binds you. A reservation is a commitment to specific resources for one or three years in exchange for a discount, which suits workloads whose needs are stable and predictable.
    fr: "Le paiement à l'utilisation suit la consommation : vous payez ce que vous utilisez pendant le cycle de facturation et rien ne vous engage. Une réservation est un engagement sur des ressources précises pendant un ou trois ans en échange d'une remise, ce qui convient aux charges de travail dont les besoins sont stables et prévisibles."
  options:
    plan:
      en: A savings plan is a commitment to an hourly spend for one or three years.
      fr: Un plan d'économies est un engagement sur un montant horaire pendant un ou trois ans.
    spot:
      en: Spot virtual machines can be evicted, so they suit interruptible workloads rather than stable ones.
      fr: "Les machines virtuelles Spot peuvent être évincées : elles conviennent aux charges de travail qui tolèrent les interruptions plutôt qu'aux charges stables."
    support:
      en: A support plan gives access to technical support; it doesn't reduce the price of resources.
      fr: "Un plan de support donne accès au support technique ; il ne réduit pas le prix des ressources."
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
