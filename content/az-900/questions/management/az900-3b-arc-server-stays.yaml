id: az900-3b-arc-server-stays
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What happens to an on-premises server when you connect it to Azure Arc?
  fr: |
    Qu'advient-il d'un serveur local lorsque vous le connectez à Azure Arc ?
body:
  options:
    - { id: a, text: { en: "It is migrated to an Azure virtual machine.", fr: "Il est migré vers une machine virtuelle Azure." } }
    - { id: b, text: { en: "It is replicated to an Azure region for disaster recovery.", fr: "Il est répliqué dans une région Azure pour la récupération d'urgence." } }
    - { id: c, text: { en: "Its disks are copied to an Azure Storage account.", fr: "Ses disques sont copiés dans un compte Stockage Azure." } }
    - { id: d, text: { en: "It stays on-premises and is represented in Azure as a resource.", fr: "Il reste en local et est représenté dans Azure comme une ressource." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Arc does not move anything: the server keeps running where it is. It receives a representation in Azure, with a resource ID, and can be placed in a resource group and managed alongside native Azure resources."
    fr: "Azure Arc ne déplace rien : le serveur continue de fonctionner là où il se trouve. Il reçoit une représentation dans Azure, avec un ID de ressource, et peut être placé dans un groupe de ressources et géré aux côtés des ressources Azure natives."
  options:
    a:
      en: "Migrating servers to Azure virtual machines is the purpose of Azure Migrate, not of Azure Arc."
      fr: "Migrer des serveurs vers des machines virtuelles Azure est le rôle d'Azure Migrate, pas d'Azure Arc."
    b:
      en: "Azure Arc is a management service; connecting a server does not replicate it to an Azure region."
      fr: "Azure Arc est un service de gestion ; connecter un serveur ne le réplique pas dans une région Azure."
    c:
      en: "Connecting a server to Azure Arc copies no disk and no data to Azure Storage."
      fr: "Connecter un serveur à Azure Arc ne copie aucun disque ni aucune donnée dans Stockage Azure."
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
