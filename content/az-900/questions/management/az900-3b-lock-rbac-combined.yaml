id: az900-3b-lock-rbac-combined
objective: "3.2.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A resource group named **RG1** contains a virtual machine named **VM1**. User1 has the Reader role for RG1. User2 has the Owner role for RG1.

    You apply a Delete lock to RG1.

    Who can change the size of VM1?
  fr: |
    Un groupe de ressources nommé **RG1** contient une machine virtuelle nommée **VM1**. User1 dispose du rôle Reader sur RG1. User2 dispose du rôle Owner sur RG1.

    Vous appliquez un verrou Suppression à RG1.

    Qui peut modifier la taille de VM1 ?
body:
  options:
    - { id: a, text: { en: "Neither User1 nor User2", fr: "Ni User1 ni User2" } }
    - { id: b, text: { en: "User1 only", fr: "User1 uniquement" } }
    - { id: c, text: { en: "User1 and User2", fr: "User1 et User2" } }
    - { id: d, text: { en: "User2 only", fr: "User2 uniquement" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A Delete lock blocks only deletion: authorized users can still read and modify the resources. User2 is authorized to modify VM1 through the Owner role, so the change succeeds. A lock grants no permission: User1 has only the Reader role and could not modify VM1 even without the lock."
    fr: "Un verrou Suppression ne bloque que la suppression : les utilisateurs autorisés peuvent toujours lire et modifier les ressources. User2 est autorisé à modifier VM1 par le rôle Owner : le changement aboutit. Un verrou n'accorde aucune autorisation : User1 n'a que le rôle Reader et ne pourrait pas modifier VM1, même sans le verrou."
  options:
    a:
      en: "This would be the result of a Read-only lock. A Delete lock leaves modifications possible for authorized users."
      fr: "Ce serait le résultat d'un verrou Lecture seule. Un verrou Suppression laisse les modifications possibles aux utilisateurs autorisés."
    b:
      en: "The Reader role only allows viewing, and nothing prevents User2 from modifying VM1."
      fr: "Le rôle Reader ne permet que la consultation, et rien n'empêche User2 de modifier VM1."
    c:
      en: "A lock restricts operations; it does not give User1 more rights than the Reader role."
      fr: "Un verrou restreint des opérations ; il ne donne pas à User1 plus de droits que le rôle Reader."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: Describe the purpose of resource locks
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-of-resource-locks
