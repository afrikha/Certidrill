id: az900-3b-cli-match-tools
objective: "3.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the tool that it describes. To answer, drag the appropriate tool to each description. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'outil qu'elle décrit. Pour répondre, faites glisser l'outil approprié vers chaque description. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: portal, text: { en: "Azure portal", fr: "Portail Azure" } }
    - { id: shell, text: "Azure Cloud Shell" }
    - { id: cli, text: "Azure CLI" }
    - { id: ps, text: "Azure PowerShell" }
    - { id: mobile, text: { en: "Azure mobile app", fr: "Application mobile Azure" } }
  targets:
    - id: t1
      text: { en: "A browser-based shell that needs no local installation", fr: "Un shell dans le navigateur qui ne demande aucune installation locale" }
    - id: t2
      text: { en: "A set of cmdlets that you run in PowerShell", fr: "Un ensemble de cmdlets que vous exécutez dans PowerShell" }
    - id: t3
      text: { en: "A command-line tool whose commands use a Bash-style syntax", fr: "Un outil en ligne de commande dont les commandes utilisent une syntaxe de style Bash" }
answer:
  mapping: { t1: shell, t2: ps, t3: cli }
explanation:
  correct:
    en: "Azure Cloud Shell is a browser-based shell: nothing is installed locally. Azure PowerShell is a collection of cmdlets that run in PowerShell. The Azure CLI is a command-line tool whose commands follow a Bash-style syntax. The portal and the mobile app are graphical tools, not command lines."
    fr: "Azure Cloud Shell est un shell dans le navigateur : rien n'est installé localement. Azure PowerShell est une collection de cmdlets qui s'exécutent dans PowerShell. Azure CLI est un outil en ligne de commande dont les commandes suivent une syntaxe de style Bash. Le portail et l'application mobile sont des outils graphiques, pas des lignes de commande."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
