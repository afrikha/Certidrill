id: az900-3a-cost-network-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A company evaluates how network traffic affects its Azure costs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise évalue l'effet du trafic réseau sur ses coûts Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A billing zone is a geographic grouping of Azure regions that is used to price data transfers.
        fr: Une zone de facturation est un regroupement géographique de régions Azure qui sert à tarifer les transferts de données.
    - id: s2
      text:
        en: Transferring data between two regions in Europe generally costs less than transferring it from Europe to Asia.
        fr: Transférer des données entre deux régions d'Europe coûte en général moins cher que les transférer d'Europe vers l'Asie.
    - id: s3
      text:
        en: Data that enters Azure datacenters is generally billed at a higher rate than data that leaves them.
        fr: Les données qui entrent dans les centres de données Azure sont en général facturées à un tarif plus élevé que celles qui en sortent.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Bandwidth is the data that moves in and out of Azure datacenters. Outbound transfers are priced by billing zone, a geographic grouping of regions that is different from an availability zone, and moving data within one geography is less expensive than moving it to another continent. Inbound transfers are generally free, so it is the outbound data that drives the cost.
    fr: "La bande passante désigne les données qui entrent dans les centres de données Azure et qui en sortent. Les transferts sortants sont tarifés par zone de facturation, un regroupement géographique de régions différent d'une zone de disponibilité, et déplacer des données à l'intérieur d'une même zone géographique coûte moins cher que les envoyer vers un autre continent. Les transferts entrants sont en général gratuits : ce sont donc les données sortantes qui pèsent sur le coût."
  options:
    s3:
      en: It is the opposite. Inbound data is generally free and outbound data is billed.
      fr: "C'est l'inverse : les données entrantes sont en général gratuites et les données sortantes sont facturées."
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
