id: az900-3a-cm-budget-notify
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants its finance team to receive an email when the monthly spending of a subscription reaches 80% of 5,000 euros.

    What should Contoso create?
  fr: |
    Contoso veut que son équipe financière reçoive un e-mail quand les dépenses mensuelles d'un abonnement atteignent 80 % de 5 000 euros.

    Que doit créer Contoso ?
body:
  options:
    - id: a
      text: { en: "A budget in Cost Management", fr: "Un budget dans Cost Management" }
    - id: b
      text: { en: "A resource lock on the subscription", fr: "Un verrou de ressource sur l'abonnement" }
    - id: c
      text: { en: "An estimate in the pricing calculator", fr: "Une estimation dans la calculatrice de prix" }
    - id: d
      text: { en: "A tag on the subscription", fr: "Une étiquette sur l'abonnement" }
answer: { optionId: a }
explanation:
  correct:
    en: A budget sets a spending limit for a scope such as a subscription, here 5,000 euros per month, together with alert thresholds. When spending reaches the threshold of 80%, a budget alert is generated and an email is sent to the recipients of the budget.
    fr: "Un budget fixe une limite de dépense pour une étendue comme un abonnement, ici 5 000 euros par mois, avec des seuils d'alerte. Quand les dépenses atteignent le seuil de 80 %, une alerte de budget est générée et un e-mail est envoyé aux destinataires du budget."
  options:
    b:
      en: A resource lock prevents accidental deletion or modification; it doesn't follow spending.
      fr: "Un verrou de ressource empêche la suppression ou la modification accidentelle ; il ne suit pas les dépenses."
    c:
      en: An estimate describes the expected cost of planned resources and never sends notifications.
      fr: Une estimation décrit le coût attendu de ressources prévues et n'envoie jamais de notification.
    d:
      en: A tag is metadata used to organize resources and group costs; it doesn't trigger alerts.
      fr: "Une étiquette est une métadonnée qui sert à organiser les ressources et à regrouper les coûts ; elle ne déclenche pas d'alerte."
references:
  - title: Describe the Microsoft Cost Management tool
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool
  - title: "Tutorial: Create and manage budgets"
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
