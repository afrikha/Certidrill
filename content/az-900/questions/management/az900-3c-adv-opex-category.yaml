id: az900-3c-adv-opex-category
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Azure Advisor groups its recommendations into categories.

    Which category contains the recommendations that help with process and workflow efficiency, resource manageability and deployment practices?
  fr: |
    Azure Advisor regroupe ses recommandations en catégories.

    Quelle catégorie contient les recommandations qui portent sur l'efficacité des processus et des flux de travail, la facilité de gestion des ressources et les pratiques de déploiement ?
body:
  options:
    - { id: a, text: { en: "Cost", fr: "Coût" } }
    - { id: b, text: { en: "Reliability", fr: "Fiabilité" } }
    - { id: c, text: { en: "Performance", fr: "Performances" } }
    - { id: d, text: { en: "Operational excellence", fr: "Excellence opérationnelle" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The operational excellence category helps you achieve process and workflow efficiency, resource manageability and deployment best practices."
    fr: "La catégorie Excellence opérationnelle vous aide à améliorer l'efficacité des processus et des flux de travail, la facilité de gestion des ressources et les pratiques de déploiement."
  options:
    a:
      en: "Cost recommendations optimize and reduce your overall Azure spending."
      fr: "Les recommandations de coût optimisent et réduisent vos dépenses Azure globales."
    b:
      en: "Reliability recommendations ensure and improve the continuity of business-critical applications."
      fr: "Les recommandations de fiabilité assurent et améliorent la continuité des applications critiques."
    c:
      en: "Performance recommendations improve the speed of your applications."
      fr: "Les recommandations de performances améliorent la vitesse de vos applications."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
