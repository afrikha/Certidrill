id: az900-3c-adv-category-match
objective: "3.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each Azure Advisor recommendation to its category.

    To answer, drag the appropriate category to each recommendation. Each category may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque recommandation d'Azure Advisor à sa catégorie.

    Pour répondre, faites glisser la catégorie appropriée vers chaque recommandation. Chaque catégorie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rel, text: { en: "Reliability", fr: "Fiabilité" } }
    - { id: sec, text: { en: "Security", fr: "Sécurité" } }
    - { id: perf, text: { en: "Performance", fr: "Performances" } }
    - { id: cost, text: { en: "Cost", fr: "Coût" } }
    - { id: opex, text: { en: "Operational excellence", fr: "Excellence opérationnelle" } }
  targets:
    - id: t1
      text: { en: "Change a configuration so that an application responds faster.", fr: "Modifier une configuration pour qu'une application réponde plus vite." }
    - id: t2
      text: { en: "Resize or shut down a virtual machine that is underused.", fr: "Redimensionner ou arrêter une machine virtuelle sous-utilisée." }
    - id: t3
      text: { en: "Enable multifactor authentication for the accounts that have owner permissions.", fr: "Activer l'authentification multifacteur pour les comptes qui disposent d'autorisations de propriétaire." }
answer:
  mapping: { t1: perf, t2: cost, t3: sec }
explanation:
  correct:
    en: "Performance recommendations improve the speed of applications. Resizing or shutting down underused virtual machines reduces spending, so it is a cost recommendation. Enabling multifactor authentication protects accounts against threats, so it is a security recommendation."
    fr: "Les recommandations de performances améliorent la vitesse des applications. Redimensionner ou arrêter des machines virtuelles sous-utilisées réduit les dépenses : c'est une recommandation de coût. Activer l'authentification multifacteur protège les comptes contre les menaces : c'est une recommandation de sécurité."
  options:
    rel:
      en: "Reliability concerns the continuity of business-critical applications, for example using availability zones."
      fr: "La fiabilité concerne la continuité des applications critiques, par exemple l'utilisation de zones de disponibilité."
    opex:
      en: "Operational excellence concerns process and workflow efficiency, resource manageability and deployment practices."
      fr: "L'excellence opérationnelle concerne l'efficacité des processus et des flux de travail, la facilité de gestion des ressources et les pratiques de déploiement."
references:
  - title: Introduction to Azure Advisor
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
