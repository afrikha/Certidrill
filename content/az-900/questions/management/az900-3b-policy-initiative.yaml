id: az900-3b-policy-initiative
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Azure Policy, what is a group of related policy definitions that is assigned as a single unit to track a larger compliance goal?
  fr: |
    Dans Azure Policy, comment appelle-t-on un groupe de définitions de stratégie liées, attribué en une seule fois pour suivre un objectif de conformité plus large ?
body:
  options:
    - { id: a, text: { en: "An initiative", fr: "Une initiative" } }
    - { id: b, text: { en: "An assignment", fr: "Une attribution" } }
    - { id: c, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: d, text: { en: "A role definition", fr: "Une définition de rôle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "An initiative groups related policy definitions so that they can be assigned and tracked together toward one goal. For example, a single initiative can gather all the policies that monitor security recommendations."
    fr: "Une initiative regroupe des définitions de stratégie liées afin de les attribuer et de les suivre ensemble pour un même objectif. Par exemple, une seule initiative peut réunir toutes les stratégies qui surveillent les recommandations de sécurité."
  options:
    b:
      en: "An assignment applies a policy or an initiative to a scope; it is not the group of definitions itself."
      fr: "Une attribution applique une stratégie ou une initiative à une étendue ; ce n'est pas le groupe de définitions lui-même."
    c:
      en: "A management group organizes subscriptions; it is a scope to which policies can be assigned, not a group of policies."
      fr: "Un groupe d'administration organise des abonnements ; c'est une étendue à laquelle des stratégies peuvent être attribuées, pas un groupe de stratégies."
    d:
      en: "A role definition is a set of permissions in Azure RBAC; it has nothing to do with policy definitions."
      fr: "Une définition de rôle est un ensemble d'autorisations d'Azure RBAC ; elle n'a aucun rapport avec les définitions de stratégie."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
