id: az900-3a-cost-reservation
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a database on Azure virtual machines 24 hours a day. The virtual machines must never be interrupted, and their size and region will not change during the next three years.

    Contoso wants to reduce the compute cost of these virtual machines as much as possible. What should Contoso use?
  fr: |
    Contoso exécute une base de données sur des machines virtuelles Azure 24 heures sur 24. Les machines virtuelles ne doivent jamais être interrompues, et leur taille et leur région ne changeront pas pendant les trois prochaines années.

    Contoso veut réduire autant que possible le coût de calcul de ces machines virtuelles. Que doit utiliser Contoso ?
body:
  options:
    - id: a
      text: { en: "A three-year Azure reservation", fr: "Une réservation Azure de trois ans" }
    - id: b
      text: { en: "Azure Spot Virtual Machines", fr: "Des machines virtuelles Azure Spot" }
    - id: c
      text: { en: "Pay-as-you-go pricing", fr: "Le paiement à l'utilisation" }
    - id: d
      text: { en: "A three-year Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul de trois ans" }
answer: { optionId: a }
explanation:
  correct:
    en: A reservation is a commitment to specific resources for one or three years in exchange for a discount. It is the option designed for a stable, predictable workload that runs all the time with the same size in the same region, and it gives the deepest discount in that case.
    fr: "Une réservation est un engagement sur des ressources précises pendant un ou trois ans en échange d'une remise. C'est l'option conçue pour une charge de travail stable et prévisible, qui s'exécute en permanence avec la même taille dans la même région, et c'est elle qui donne la remise la plus forte dans ce cas."
  options:
    b:
      en: Spot virtual machines are cheap, but Azure can evict them when it needs the capacity back, which a database that must never be interrupted can't accept.
      fr: Les machines virtuelles Spot sont bon marché, mais Azure peut les évincer quand il a besoin de récupérer la capacité, ce qu'une base de données qui ne doit jamais être interrompue ne peut pas accepter.
    c:
      en: Pay-as-you-go offers flexibility without commitment, but no discount for a workload that runs permanently.
      fr: Le paiement à l'utilisation offre de la souplesse sans engagement, mais aucune remise pour une charge de travail qui s'exécute en permanence.
    d:
      en: A savings plan trades part of the discount for the flexibility to change compute service, size or region. Contoso doesn't need this flexibility, so a reservation saves more.
      fr: "Un plan d'économies échange une partie de la remise contre la liberté de changer de service de calcul, de taille ou de région. Contoso n'a pas besoin de cette liberté : une réservation fait donc économiser davantage."
references:
  - title: Describe cost optimization options in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7a-describe-cost-optimization-options
  - title: What are savings plans?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
