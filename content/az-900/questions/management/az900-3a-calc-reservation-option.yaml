id: az900-3a-calc-reservation-option
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to deploy virtual machines that will run permanently. Nothing is deployed yet.

    Proseware wants to know how much these virtual machines would cost with a three-year commitment instead of pay-as-you-go pricing. What should Proseware do?
  fr: |
    Proseware prévoit de déployer des machines virtuelles qui fonctionneront en permanence. Rien n'est encore déployé.

    Proseware veut savoir combien coûteraient ces machines virtuelles avec un engagement de trois ans plutôt qu'avec le paiement à l'utilisation. Que doit faire Proseware ?
body:
  options:
    - id: a
      text: { en: "Review the reservation recommendations of Azure Advisor.", fr: "Consulter les recommandations de réservation d'Azure Advisor." }
    - id: b
      text: { en: "Create a three-year budget for the virtual machines in Cost Management.", fr: "Créer un budget de trois ans pour les machines virtuelles dans Cost Management." }
    - id: c
      text: { en: "Select the three-year reservation option for the virtual machines in the pricing calculator.", fr: "Sélectionner l'option de réservation de trois ans pour les machines virtuelles dans la calculatrice de prix." }
    - id: d
      text: { en: "Filter cost analysis on reservations for the virtual machines in Cost Management.", fr: "Filtrer l'analyse des coûts sur les réservations pour les machines virtuelles dans Cost Management." }
answer: { optionId: c }
explanation:
  correct:
    en: In the pricing calculator, each product offers savings options such as pay-as-you-go or a one-year or three-year reservation, and the estimate changes with the option selected. Proseware can therefore compare both prices before deploying anything.
    fr: "Dans la calculatrice de prix, chaque produit propose des options d'économies comme le paiement à l'utilisation ou une réservation d'un ou trois ans, et l'estimation change selon l'option choisie. Proseware peut donc comparer les deux prix avant tout déploiement."
  options:
    a:
      en: Azure Advisor bases its recommendations on the usage of existing resources, and nothing is deployed yet.
      fr: Azure Advisor fonde ses recommandations sur l'utilisation de ressources existantes, et rien n'est encore déployé.
    b:
      en: A budget follows spending against a limit and sends alerts; it doesn't give the price of a commitment.
      fr: "Un budget suit les dépenses par rapport à une limite et envoie des alertes ; il ne donne pas le prix d'un engagement."
    d:
      en: Cost analysis shows costs that were actually incurred; without deployed resources or reservations, it has nothing to show.
      fr: "L'analyse des coûts montre des coûts réellement engagés ; sans ressources déployées ni réservations, elle n'a rien à montrer."
references:
  - title: Estimate costs with the Azure pricing calculator
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
