id: az900-3a-tag-scope-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A company defines its tagging strategy. No Azure Policy is assigned.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise définit sa stratégie d'étiquetage. Aucune stratégie Azure Policy n'est attribuée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A tag that is applied to a subscription automatically appears on the resource groups of the subscription.
        fr: Une étiquette appliquée à un abonnement apparaît automatiquement sur les groupes de ressources de l'abonnement.
    - id: s2
      text:
        en: Tags can be defined in an Azure Resource Manager template when a resource is deployed.
        fr: Les étiquettes peuvent être définies dans un modèle Azure Resource Manager au moment du déploiement d'une ressource.
    - id: s3
      text:
        en: A tag is an appropriate place to store the password of a database.
        fr: Une étiquette est un endroit approprié pour stocker le mot de passe d'une base de données.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Tags applied at one level don't appear at another level, so resource groups don't receive the tags of their subscription, and resources don't receive those of their resource group. Tags can be managed with the Azure portal, Azure PowerShell, the Azure CLI, Azure Resource Manager templates and the REST API. Tags are stored as plain text and are visible in many places, such as cost reports, so they must not contain sensitive values.
    fr: "Les étiquettes appliquées à un niveau n'apparaissent pas à un autre : les groupes de ressources ne reçoivent pas les étiquettes de leur abonnement, ni les ressources celles de leur groupe de ressources. Les étiquettes se gèrent avec le portail Azure, Azure PowerShell, Azure CLI, les modèles Azure Resource Manager et l'API REST. Elles sont stockées en texte clair et visibles à de nombreux endroits, comme les rapports de coûts : elles ne doivent donc pas contenir de valeurs sensibles."
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
  - title: Describe the purpose of tags
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags
