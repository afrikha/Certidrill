id: az900-3b-cli-yn-platforms
objective: "3.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The Azure CLI can be installed on computers that run Windows, Linux, or macOS.", fr: "Azure CLI peut être installé sur des ordinateurs qui exécutent Windows, Linux ou macOS." } }
    - { id: s2, text: { en: "Azure Cloud Shell runs in a web browser.", fr: "Azure Cloud Shell s'exécute dans un navigateur web." } }
    - { id: s3, text: { en: "Azure Cloud Shell requires the Azure CLI to be installed on the local computer.", fr: "Azure Cloud Shell exige qu'Azure CLI soit installé sur l'ordinateur local." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The Azure CLI is a cross-platform tool that installs on Windows, Linux and macOS. Azure Cloud Shell is a browser-based shell that requires no local installation or configuration: the Azure CLI and Azure PowerShell are already available in it."
    fr: "Azure CLI est un outil multiplateforme qui s'installe sous Windows, Linux et macOS. Azure Cloud Shell est un shell dans le navigateur qui ne demande ni installation ni configuration locale : Azure CLI et Azure PowerShell y sont déjà disponibles."
references:
  - title: Describe tools for interacting with Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure
  - title: What is the Azure CLI?
    url: https://learn.microsoft.com/en-us/cli/azure/what-is-azure-cli
