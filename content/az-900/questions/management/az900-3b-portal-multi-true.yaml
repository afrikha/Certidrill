id: az900-3b-portal-multi-true
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about the Azure portal are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies à propos du portail Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It provides a graphical interface as an alternative to command-line tools.", fr: "Il fournit une interface graphique qui constitue une alternative aux outils en ligne de commande." } }
    - { id: b, text: { en: "It can be used only by users who have the Owner role for a subscription.", fr: "Il ne peut être utilisé que par les utilisateurs qui ont le rôle Owner sur un abonnement." } }
    - { id: c, text: { en: "Dashboards that you create in it can be shared with other users.", fr: "Les tableaux de bord que vous y créez peuvent être partagés avec d'autres utilisateurs." } }
    - { id: d, text: { en: "It sends its requests directly to each service, without Azure Resource Manager.", fr: "Il envoie ses requêtes directement à chaque service, sans passer par Azure Resource Manager." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The Azure portal is a web-based, unified console that offers a graphical user interface as an alternative to command-line tools. You can create custom dashboards in it, then publish and share them with other people in your organization."
    fr: "Le portail Azure est une console web unifiée qui offre une interface graphique comme alternative aux outils en ligne de commande. Vous pouvez y créer des tableaux de bord personnalisés, puis les publier et les partager avec d'autres personnes de votre organisation."
  options:
    b:
      en: "Any user who has an account can sign in to the portal; the role only determines what the user can see and do there."
      fr: "Tout utilisateur qui possède un compte peut se connecter au portail ; le rôle détermine seulement ce qu'il peut y voir et y faire."
    d:
      en: "Like every Azure tool, the portal sends its requests to Azure Resource Manager, which authenticates and authorizes them before passing them to the service."
      fr: "Comme tous les outils Azure, le portail envoie ses requêtes à Azure Resource Manager, qui les authentifie et les autorise avant de les transmettre au service."
references:
  - title: What is the Azure portal?
    url: https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-overview
  - title: Describe Azure Resource Manager and Azure ARM templates
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates
