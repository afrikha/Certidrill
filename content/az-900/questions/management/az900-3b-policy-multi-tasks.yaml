id: az900-3b-policy-multi-tasks
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks can you perform by using Azure Policy? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches que vous pouvez effectuer avec Azure Policy ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant a user the permission to manage virtual networks.", fr: "Accorder à un utilisateur l'autorisation de gérer des réseaux virtuels." } }
    - { id: b, text: { en: "Restrict the virtual machine sizes that can be deployed in a subscription.", fr: "Limiter les tailles de machines virtuelles qui peuvent être déployées dans un abonnement." } }
    - { id: c, text: { en: "Classify the sensitive data stored in on-premises databases.", fr: "Classifier les données sensibles stockées dans des bases de données locales." } }
    - { id: d, text: { en: "Identify the existing storage accounts that do not comply with a configuration rule.", fr: "Identifier les comptes de stockage existants qui ne respectent pas une règle de configuration." } }
    - { id: e, text: { en: "Receive a notification about planned maintenance that affects your resources.", fr: "Recevoir une notification sur une maintenance planifiée qui touche vos ressources." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Azure Policy controls the configuration of resources, for example by allowing only certain virtual machine sizes. It also evaluates existing resources and highlights those that do not comply with an assigned rule."
    fr: "Azure Policy contrôle la configuration des ressources, par exemple en n'autorisant que certaines tailles de machines virtuelles. Il évalue aussi les ressources existantes et met en évidence celles qui ne respectent pas une règle attribuée."
  options:
    a:
      en: "Permissions are granted with Azure RBAC role assignments, not with Azure Policy."
      fr: "Les autorisations s'accordent par des attributions de rôles Azure RBAC, pas avec Azure Policy."
    c:
      en: "Discovering and classifying sensitive data, including on-premises, is the purpose of Microsoft Purview."
      fr: "Découvrir et classifier les données sensibles, y compris en local, est le rôle de Microsoft Purview."
    e:
      en: "Notifications about planned maintenance come from Azure Service Health."
      fr: "Les notifications de maintenance planifiée proviennent d'Azure Service Health."
references:
  - title: Describe the purpose of Azure Policy
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-of-azure-policy
