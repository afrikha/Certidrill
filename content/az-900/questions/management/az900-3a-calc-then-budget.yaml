id: az900-3a-calc-then-budget
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum prepares a migration to Azure. The company has two needs:

    - before the migration, estimate the monthly cost of the target architecture;
    - after the migration, be notified when actual spending reaches 80% of that amount.

    Which tools should Adatum use, in this order?
  fr: |
    Adatum prépare une migration vers Azure. L'entreprise a deux besoins :

    - avant la migration, estimer le coût mensuel de l'architecture cible ;
    - après la migration, être avertie quand les dépenses réelles atteignent 80 % de ce montant.

    Quels outils Adatum doit-elle utiliser, dans cet ordre ?
body:
  options:
    - id: a
      text: { en: "Cost analysis in Cost Management, then the pricing calculator", fr: "L'analyse des coûts de Cost Management, puis la calculatrice de prix" }
    - id: b
      text: { en: "The pricing calculator, then a budget in Cost Management", fr: "La calculatrice de prix, puis un budget dans Cost Management" }
    - id: c
      text: { en: "The pricing calculator, then an Azure Policy assignment", fr: "La calculatrice de prix, puis une attribution Azure Policy" }
    - id: d
      text: { en: "Azure Advisor, then a budget in Cost Management", fr: "Azure Advisor, puis un budget dans Cost Management" }
answer: { optionId: b }
explanation:
  correct:
    en: The pricing calculator estimates the cost of an architecture before anything is deployed, and the estimate often serves as a baseline for budget approval. Once the resources run, a budget in Cost Management with an alert threshold at 80% notifies the recipients when actual spending reaches that level.
    fr: "La calculatrice de prix estime le coût d'une architecture avant tout déploiement, et l'estimation sert souvent de base à l'approbation budgétaire. Une fois les ressources en service, un budget dans Cost Management avec un seuil d'alerte à 80 % avertit les destinataires quand les dépenses réelles atteignent ce niveau."
  options:
    a:
      en: The order is reversed. Cost analysis needs deployed resources, and the pricing calculator never sends notifications.
      fr: "L'ordre est inversé : l'analyse des coûts a besoin de ressources déployées, et la calculatrice de prix n'envoie jamais de notification."
    c:
      en: Azure Policy controls the configuration of resources; it doesn't follow spending or send cost alerts.
      fr: "Azure Policy contrôle la configuration des ressources ; il ne suit pas les dépenses et n'envoie pas d'alerte de coût."
    d:
      en: Azure Advisor recommends optimizations for existing resources; it can't estimate an architecture that isn't deployed.
      fr: "Azure Advisor recommande des optimisations pour des ressources existantes ; il ne peut pas estimer une architecture qui n'est pas déployée."
references:
