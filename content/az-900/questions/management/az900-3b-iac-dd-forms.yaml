id: az900-3b-iac-dd-forms
objective: "3.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      At an introductory level, infrastructure as code can start with [[simple]].

      It can then grow into repeatable deployments of whole environments by using [[full]].
    fr: |
      À un niveau d'initiation, l'infrastructure en tant que code peut commencer par [[simple]].

      Elle peut ensuite évoluer vers des déploiements reproductibles d'environnements entiers à l'aide [[full]].
  slots:
    - id: simple
      options:
        - { id: dash, text: { en: "dashboards in the Azure portal", fr: "des tableaux de bord du portail Azure" } }
        - { id: scripts, text: { en: "Azure CLI or Azure PowerShell scripts", fr: "des scripts Azure CLI ou Azure PowerShell" } }
        - { id: locks, text: { en: "resource locks on a subscription", fr: "des verrous de ressources sur un abonnement" } }
    - id: full
      options:
        - { id: advisor, text: { en: "Azure Advisor recommendations", fr: "de recommandations Azure Advisor" } }
        - { id: mg, text: { en: "management groups", fr: "de groupes d'administration" } }
        - { id: templates, text: { en: "ARM templates or Bicep files", fr: "de modèles ARM ou de fichiers Bicep" } }
answer:
  values: { simple: scripts, full: templates }
explanation:
  correct:
    en: "Infrastructure as code means managing infrastructure through code rather than manual configuration. It can begin with scripts of Azure CLI commands or Azure PowerShell cmdlets, then move to ARM templates and Bicep files, which describe a whole environment and deploy it repeatedly with the same result. Dashboards, locks, recommendations and management groups do not describe resources to deploy."
    fr: "L'infrastructure en tant que code consiste à gérer l'infrastructure par du code plutôt que par une configuration manuelle. Elle peut commencer par des scripts de commandes Azure CLI ou de cmdlets Azure PowerShell, puis passer aux modèles ARM et aux fichiers Bicep, qui décrivent tout un environnement et le déploient de façon répétée avec le même résultat. Les tableaux de bord, les verrous, les recommandations et les groupes d'administration ne décrivent pas des ressources à déployer."
references:
  - title: Describe Azure Resource Manager and Azure ARM templates
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates
