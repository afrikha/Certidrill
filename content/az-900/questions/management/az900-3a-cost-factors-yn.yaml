id: az900-3a-cost-factors-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The price of the same Azure service can differ from one region to another.
        fr: Le prix d'un même service Azure peut différer d'une région à l'autre.
    - id: s2
      text:
        en: With pay-as-you-go pricing, you pay a fixed monthly amount whatever your usage.
        fr: Avec le paiement à l'utilisation, vous payez un montant mensuel fixe quelle que soit votre utilisation.
    - id: s3
      text:
        en: A solution bought from Azure Marketplace can add vendor charges to the cost of the Azure resources that it uses.
        fr: Une solution achetée sur la Place de marché Azure peut ajouter des frais du fournisseur au coût des ressources Azure qu'elle utilise.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Prices vary by region because power, labor, taxes and fees differ. With pay-as-you-go, the bill follows what you use during the billing cycle, so it goes up and down with consumption. Azure Marketplace solutions come from third-party vendors who set their own billing structure, in addition to the Azure services that the solution consumes.
    fr: "Les prix varient selon la région, car l'énergie, la main-d'œuvre, les taxes et les frais diffèrent. Avec le paiement à l'utilisation, la facture suit ce que vous utilisez pendant le cycle de facturation : elle monte et descend avec la consommation. Les solutions de la Place de marché Azure viennent de fournisseurs tiers qui fixent leur propre mode de facturation, en plus des services Azure que la solution consomme."
  options:
    s2:
      en: A fixed amount whatever the usage is the opposite of the consumption-based model.
      fr: Un montant fixe quelle que soit l'utilisation est le contraire du modèle basé sur la consommation.
references:
  - title: Describe factors that can affect costs in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
