id: az900-3b-lock-inherited-new-vm
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You apply a Delete lock to a resource group named **RG1**. One week later, a virtual machine named **VM1** is created in RG1.

    A user who has the Contributor role for RG1 tries to delete VM1. What is the result?
  fr: |
    Vous appliquez un verrou Suppression à un groupe de ressources nommé **RG1**. Une semaine plus tard, une machine virtuelle nommée **VM1** est créée dans RG1.

    Un utilisateur qui dispose du rôle Contributor sur RG1 tente de supprimer VM1. Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "VM1 is deleted, because it was created after the lock.", fr: "VM1 est supprimée, car elle a été créée après le verrou." } }
    - { id: b, text: { en: "VM1 is deleted, because the lock protects only the resource group itself.", fr: "VM1 est supprimée, car le verrou ne protège que le groupe de ressources lui-même." } }
    - { id: c, text: { en: "The deletion fails, because VM1 inherits the lock of RG1.", fr: "La suppression échoue, car VM1 hérite du verrou de RG1." } }
    - { id: d, text: { en: "The deletion fails, because the Contributor role cannot delete virtual machines.", fr: "La suppression échoue, car le rôle Contributor ne permet pas de supprimer des machines virtuelles." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Locks are inherited: a lock on a resource group applies to all the resources in the group, including those that are added after the lock was created. VM1 can be deleted only after the lock is removed."
    fr: "Les verrous sont hérités : un verrou sur un groupe de ressources s'applique à toutes les ressources du groupe, y compris celles qui sont ajoutées après la création du verrou. VM1 ne peut être supprimée qu'après le retrait du verrou."
  options:
    a:
      en: "The creation date does not matter: resources added later inherit the lock of their resource group."
      fr: "La date de création ne compte pas : les ressources ajoutées plus tard héritent du verrou de leur groupe de ressources."
    b:
      en: "A lock on a resource group is inherited by every resource in the group; it does not protect only the group object."
      fr: "Un verrou sur un groupe de ressources est hérité par toutes les ressources du groupe ; il ne protège pas seulement l'objet groupe."
    d:
      en: "The Contributor role does allow the deletion of resources; here it is the inherited lock that blocks it."
      fr: "Le rôle Contributor permet bien de supprimer des ressources ; ici, c'est le verrou hérité qui bloque la suppression."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
