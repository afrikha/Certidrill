id: az900-3a-calc-basics-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A company starts using the pricing calculator.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise commence à utiliser la calculatrice de prix.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The pricing calculator can estimate the cost of compute, storage and associated network resources.
        fr: La calculatrice de prix peut estimer le coût de ressources de calcul, de stockage et de réseau associées.
    - id: s2
      text:
        en: You are charged for the services that you add to an estimate.
        fr: Les services que vous ajoutez à une estimation vous sont facturés.
    - id: s3
      text:
        en: You can use the pricing calculator to compare the estimated cost of a solution in different regions.
        fr: Vous pouvez utiliser la calculatrice de prix pour comparer le coût estimé d'une solution dans différentes régions.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The pricing calculator estimates the cost of provisioned resources, including compute, storage and the associated network costs. It is for information only, so nothing is provisioned and nothing is charged when you add services. Because the region is an option of each product, the same solution can be estimated in several regions and compared.
    fr: "La calculatrice de prix estime le coût de ressources approvisionnées, notamment le calcul, le stockage et les coûts réseau associés. Elle n'a qu'une valeur d'information : rien n'est approvisionné et rien n'est facturé quand vous ajoutez des services. Comme la région est une option de chaque produit, une même solution peut être estimée dans plusieurs régions puis comparée."
references:
  - title: Explore the pricing calculator
    url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators
