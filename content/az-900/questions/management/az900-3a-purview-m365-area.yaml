id: az900-3a-purview-m365-area
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The compliance team of Proseware must protect sensitive data in Microsoft Teams, OneDrive and Exchange, and manage regulatory compliance requirements.

    What should the team use?
  fr: |
    L'équipe conformité de Proseware doit protéger les données sensibles dans Microsoft Teams, OneDrive et Exchange, et gérer les exigences de conformité réglementaire.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "The unified data governance solutions of Microsoft Purview", fr: "Les solutions de gouvernance unifiée des données de Microsoft Purview" }
    - id: b
      text: { en: "The risk and compliance solutions of Microsoft Purview", fr: "Les solutions de risques et conformité de Microsoft Purview" }
    - id: c
      text: { en: "The regulatory compliance initiatives of Azure Policy", fr: "Les initiatives de conformité réglementaire d'Azure Policy" }
    - id: d
      text: { en: "The security recommendations of Microsoft Defender for Cloud", fr: "Les recommandations de sécurité de Microsoft Defender pour le cloud" }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft 365 is a core component of the risk and compliance solutions of Microsoft Purview, which rely on services such as Teams, OneDrive and Exchange. These solutions help to protect sensitive data across clouds, apps and devices, to identify data risks and to manage regulatory compliance requirements.
    fr: Microsoft 365 est un composant central des solutions de risques et conformité de Microsoft Purview, qui s'appuient sur des services comme Teams, OneDrive et Exchange. Ces solutions aident à protéger les données sensibles dans les clouds, les applications et les appareils, à identifier les risques liés aux données et à gérer les exigences de conformité réglementaire.
  options:
    a:
      en: Unified data governance maps the data estate, for example Azure, SQL and Hive databases or Amazon S3, with classification and lineage; it isn't the area built around Microsoft 365 services.
      fr: "La gouvernance unifiée des données cartographie le patrimoine de données, par exemple Azure, les bases SQL et Hive ou Amazon S3, avec classification et traçabilité ; ce n'est pas le domaine construit autour des services Microsoft 365."
    c:
      en: Azure Policy initiatives evaluate the configuration of Azure resources against a standard; they don't protect the content of Teams, OneDrive or Exchange.
      fr: "Les initiatives Azure Policy évaluent la configuration des ressources Azure par rapport à une norme ; elles ne protègent pas le contenu de Teams, OneDrive ou Exchange."
    d:
      en: Defender for Cloud assesses and strengthens the security of cloud workloads; it doesn't manage the compliance of Microsoft 365 data.
      fr: "Defender pour le cloud évalue et renforce la sécurité des charges de travail cloud ; il ne gère pas la conformité des données Microsoft 365."
references:
  - title: Describe the purpose of Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview
