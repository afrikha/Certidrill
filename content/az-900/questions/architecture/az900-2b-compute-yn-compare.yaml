id: az900-2b-compute-yn-compare
objective: "2.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A function that uses Durable Functions can keep its state from one execution to the next.", fr: "Une fonction qui utilise Durable Functions peut conserver son état d'une exécution à la suivante." } }
    - { id: s2, text: { en: "Containers remove the need for an operating system on the host that runs them.", fr: "Les conteneurs suppriment le besoin d'un système d'exploitation sur l'hôte qui les exécute." } }
    - { id: s3, text: { en: "On an Azure virtual machine, Microsoft maintains the physical hardware and you maintain the operating system.", fr: "Sur une machine virtuelle Azure, Microsoft maintient le matériel physique et vous maintenez le système d'exploitation." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Functions are stateless by default, but stateful functions, called Durable Functions, track prior activity between executions. Containers still depend on a host operating system: they share it instead of each carrying their own. A virtual machine is infrastructure as a service: Azure removes the hardware to buy and maintain, but patching, updates and configuration inside the machine remain yours."
    fr: "Les fonctions sont sans état par défaut, mais les fonctions avec état, appelées Durable Functions, suivent l'activité antérieure entre les exécutions. Les conteneurs dépendent toujours du système d'exploitation d'un hôte : ils le partagent au lieu d'embarquer chacun le leur. Une machine virtuelle relève de l'infrastructure as a service : Azure supprime le matériel à acheter et à entretenir, mais les correctifs, les mises à jour et la configuration à l'intérieur de la machine restent à votre charge."
references:
  - title: "Describe Azure functions"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
