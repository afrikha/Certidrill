id: az900-2c-move-azcopy-one-way
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Each night, a script at Proseware uses AzCopy to synchronize a local folder (the source) to a blob container (the destination). During the day, a colleague uploads a new report directly to the container.

    You need the report to be copied to the local folder. What should you do?
  fr: |
    Chaque nuit, un script de Proseware utilise AzCopy pour synchroniser un dossier local (la source) vers un conteneur d'objets blob (la destination). Dans la journée, une collègue charge un nouveau rapport directement dans le conteneur.

    Le rapport doit être copié dans le dossier local. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Wait for the next nightly run of the script, which copies the report to the folder.", fr: "Attendre la prochaine exécution nocturne du script, qui copie le rapport dans le dossier." }
    - id: b
      text: { en: "Install the Azure File Sync agent on the computer that runs the script.", fr: "Installer l'agent Azure File Sync sur l'ordinateur qui exécute le script." }
    - id: c
      text: { en: "Change the redundancy of the storage account to geo-redundant storage (GRS).", fr: "Changer la redondance du compte de stockage en stockage géoredondant (GRS)." }
    - id: d
      text: { en: "Run AzCopy with the container as the source and the folder as the destination.", fr: "Exécuter AzCopy avec le conteneur comme source et le dossier comme destination." }
answer: { optionId: d }
explanation:
  correct:
    en: AzCopy synchronizes in one direction only, from the source that you designate to the destination. The nightly run sends the content of the folder to the container and never brings back what exists only in the container. To copy the report to the folder, you run AzCopy in the other direction, with the container as the source.
    fr: AzCopy ne synchronise que dans un seul sens, de la source que vous désignez vers la destination. L'exécution nocturne envoie le contenu du dossier vers le conteneur et ne ramène jamais ce qui n'existe que dans le conteneur. Pour copier le rapport dans le dossier, vous exécutez AzCopy dans l'autre sens, avec le conteneur comme source.
  options:
    a:
      en: The nightly run goes from the folder to the container. It doesn't copy to the folder a file that exists only in the container.
      fr: L'exécution nocturne va du dossier vers le conteneur. Elle ne copie pas dans le dossier un fichier qui n'existe que dans le conteneur.
    b:
      en: Azure File Sync synchronizes a Windows file server with an Azure file share. It doesn't work with blob containers.
      fr: Azure File Sync synchronise un serveur de fichiers Windows avec un partage de fichiers Azure. Il ne fonctionne pas avec les conteneurs d'objets blob.
    c:
      en: Redundancy copies the data inside Azure, to another region in this case. It never copies data to a local folder.
      fr: La redondance copie les données à l'intérieur d'Azure, ici vers une autre région. Elle ne copie jamais de données vers un dossier local.
references:
  - title: Identify Azure file movement options
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options
  - title: Get started with AzCopy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
