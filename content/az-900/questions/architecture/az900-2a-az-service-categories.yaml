id: az900-2a-az-service-categories
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Azure services that support availability zones fall into several categories.

    Match each description to the correct category. To answer, drag the appropriate category to each description. Each category may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les services Azure qui prennent en charge les zones de disponibilité se répartissent en plusieurs catégories.

    Associez chaque description à la catégorie correcte. Pour répondre, faites glisser la catégorie appropriée vers chaque description. Chaque catégorie peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: zonal, text: { en: "Zonal services", fr: "Services zonaux" } }
    - { id: zr, text: { en: "Zone-redundant services", fr: "Services redondants interzone" } }
    - { id: nonreg, text: { en: "Non-regional services", fr: "Services non régionaux" } }
    - { id: geo, text: { en: "Geo-redundant services", fr: "Services géoredondants" } }
  targets:
    - id: t1
      text: { en: "The platform replicates the resource automatically across zones, as for Azure SQL Database", fr: "La plateforme réplique automatiquement la ressource entre les zones, comme pour Azure SQL Database" }
    - id: t2
      text: { en: "You pin the resource to a specific zone, as for a virtual machine or a managed disk", fr: "Vous épinglez la ressource à une zone précise, comme pour une machine virtuelle ou un disque managé" }
    - id: t3
      text: { en: "The service is always available from Azure geographies and is resilient to zone-wide and region-wide outages", fr: "Le service est toujours disponible depuis les zones géographiques Azure et résiste aux pannes de zone et de région" }
answer:
  mapping: { t1: zr, t2: zonal, t3: nonreg }
explanation:
  correct:
    en: |
      Zonal services are pinned to the zone you choose (virtual machines, managed disks, IP addresses). Zone-redundant services are replicated across zones by the platform (zone-redundant storage, SQL Database). Non-regional services are not tied to a zone or a region and stay available during zone-wide and region-wide outages. Geo-redundancy is about copying data to another region, not about zones.
    fr: |
      Les services zonaux sont épinglés à la zone que vous choisissez (machines virtuelles, disques managés, adresses IP). Les services redondants interzone sont répliqués entre les zones par la plateforme (stockage redondant interzone, SQL Database). Les services non régionaux ne sont liés ni à une zone ni à une région et restent disponibles pendant les pannes de zone et de région. La géoredondance consiste à copier les données vers une autre région ; elle ne concerne pas les zones.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
