id: az900-2d-rbac-inheritance
objective: "2.4.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure subscription named **Sub1** contains a resource group named **RG1**.

    For each of the following statements about Azure role-based access control (Azure RBAC), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un abonnement Azure nommé **Sub1** contient un groupe de ressources nommé **RG1**.

    Pour chacune des affirmations suivantes sur le contrôle d'accès en fonction du rôle Azure (Azure RBAC), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A role that is assigned to a user on Sub1 also applies to the resources of RG1."
        fr: "Un rôle attribué à un utilisateur sur Sub1 s'applique aussi aux ressources de RG1."
    - id: s2
      text:
        en: "A role can be assigned at the scope of a single resource of RG1."
        fr: "Un rôle peut être attribué à l'étendue d'une seule ressource de RG1."
    - id: s3
      text:
        en: "A user who has the Reader role on Sub1 and the Contributor role on RG1 is limited to read access on the resources of RG1."
        fr: "Un utilisateur qui a le rôle Reader sur Sub1 et le rôle Contributor sur RG1 est limité à un accès en lecture sur les ressources de RG1."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Role assignments are inherited by child scopes: a role on a subscription applies to its resource groups and their resources. Azure RBAC is an allow model in which permissions add up, so Reader on Sub1 plus Contributor on RG1 gives the user full management of the resources of RG1. A scope can be a management group, a subscription, a resource group or a single resource."
    fr: "Les attributions de rôles sont héritées par les étendues enfants : un rôle sur un abonnement s'applique à ses groupes de ressources et à leurs ressources. Azure RBAC est un modèle d'autorisation dans lequel les autorisations s'additionnent : Reader sur Sub1 plus Contributor sur RG1 donne à l'utilisateur la gestion complète des ressources de RG1. Une étendue peut être un groupe d'administration, un abonnement, un groupe de ressources ou une seule ressource."
  options:
    s3:
      en: "The less permissive role inherited from the subscription does not restrict the role assigned on RG1: the effective permissions are the sum of both."
      fr: "Le rôle le moins permissif, hérité de l'abonnement, ne restreint pas le rôle attribué sur RG1 : les autorisations effectives sont la somme des deux."
references:
  - title: Describe Azure role-based access control
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
