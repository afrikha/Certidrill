id: az900-2b-net-vpn-branch-office
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum wants to connect the network of a small branch office to an Azure virtual network. The connection must be encrypted, must use the existing internet access of the office, and must be set up quickly at a low cost.

    Which service should Adatum use?
  fr: |
    Adatum veut connecter le réseau d'une petite succursale à un réseau virtuel Azure. La connexion doit être chiffrée, utiliser l'accès internet existant de la succursale, et être mise en place rapidement à faible coût.

    Quel service Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure ExpressRoute" }
    - { id: b, text: { en: "Azure VPN Gateway", fr: "Passerelle VPN Azure" } }
    - { id: c, text: { en: "Virtual network peering", fr: "Peering de réseaux virtuels" } }
    - { id: d, text: "Azure DNS" }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure VPN Gateway sends encrypted traffic between an on-premises location and a virtual network over the public internet. A site-to-site connection links the VPN device of the office to the gateway, so the existing internet access is enough."
    fr: "La Passerelle VPN Azure envoie du trafic chiffré entre un site local et un réseau virtuel en passant par l'internet public. Une connexion de site à site relie le périphérique VPN de la succursale à la passerelle : l'accès internet existant suffit."
  options:
    a: { en: "ExpressRoute is a private connection that doesn't use the internet and depends on a connectivity provider, which costs more and takes longer.", fr: "ExpressRoute est une connexion privée qui n'utilise pas internet et dépend d'un fournisseur de connectivité, ce qui coûte plus cher et prend plus de temps." }
    c: { en: "Peering connects Azure virtual networks to each other, not an office network to Azure.", fr: "Le peering connecte des réseaux virtuels Azure entre eux, pas le réseau d'une succursale à Azure." }
    d: { en: "Azure DNS provides name resolution, not network connectivity.", fr: "Azure DNS fournit la résolution de noms, pas la connectivité réseau." }
references:
  - title: "Describe Azure virtual private networks"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/3-virtual-private-networks
  - title: "What is Azure VPN Gateway?"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways
