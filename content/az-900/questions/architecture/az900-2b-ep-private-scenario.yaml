id: az900-2b-ep-private-scenario
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Virtual machines in a virtual network named **VNet1** must reach an Azure SQL database through an IP address taken from the address space of VNet1. The traffic must never cross the public internet.

    What should you create for the database?
  fr: |
    Les machines virtuelles d'un réseau virtuel nommé **VNet1** doivent atteindre une base de données Azure SQL par une adresse IP prise dans l'espace d'adressage de VNet1. Le trafic ne doit jamais traverser l'internet public.

    Que devez-vous créer pour la base de données ?
body:
  options:
    - { id: a, text: { en: "A public endpoint", fr: "Un point de terminaison public" } }
    - { id: b, text: { en: "A private endpoint", fr: "Un point de terminaison privé" } }
    - { id: c, text: { en: "A public IP address", fr: "Une adresse IP publique" } }
    - { id: d, text: { en: "A VPN gateway", fr: "Une passerelle VPN" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A private endpoint exists within a virtual network and has a private IP address from the address space of that virtual network. The virtual machines connect to the database through this address, and the traffic stays on the Microsoft backbone network."
    fr: "Un point de terminaison privé existe dans un réseau virtuel et possède une adresse IP privée issue de l'espace d'adressage de ce réseau virtuel. Les machines virtuelles se connectent à la base de données par cette adresse, et le trafic reste sur le réseau principal de Microsoft."
  options:
    a: { en: "A public endpoint has a public IP address that is reachable from the internet, not an address of VNet1.", fr: "Un point de terminaison public a une adresse IP publique joignable depuis internet, pas une adresse de VNet1." }
    c: { en: "A public IP address exposes a resource to the internet; it doesn't give the database an address in VNet1.", fr: "Une adresse IP publique expose une ressource à internet ; elle ne donne pas à la base de données une adresse dans VNet1." }
    d: { en: "A VPN gateway connects on-premises networks or other virtual networks to VNet1; it doesn't bring the database into VNet1.", fr: "Une passerelle VPN connecte des réseaux locaux ou d'autres réseaux virtuels à VNet1 ; elle n'amène pas la base de données dans VNet1." }
references:
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
  - title: "What is a private endpoint?"
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
