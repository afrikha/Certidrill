id: az900-2c-auth-yn-passwordless
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about passwordless authentication in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'authentification sans mot de passe dans Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With Windows Hello for Business, the biometric or PIN credential is tied to a specific device.
        fr: Avec Windows Hello Entreprise, les informations d'identification biométriques ou le code PIN sont liés à un appareil précis.
    - id: s2
      text:
        en: A FIDO2 security key stores the password of the user and enters it automatically at sign-in.
        fr: Une clé de sécurité FIDO2 stocke le mot de passe de l'utilisateur et le saisit automatiquement à la connexion.
    - id: s3
      text:
        en: The Microsoft Authenticator app can be used to sign in without typing a password.
        fr: L'application Microsoft Authenticator peut servir à se connecter sans saisir de mot de passe.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Microsoft Entra ID offers three passwordless options. Windows Hello for Business ties a biometric or PIN credential to the user's PC. The Microsoft Authenticator app turns a phone into a sign-in method, confirmed with a biometric or a PIN. A FIDO2 security key is a hardware device that signs the user in without any password.
    fr: Microsoft Entra ID propose trois options sans mot de passe. Windows Hello Entreprise lie des informations d'identification biométriques ou un code PIN au PC de l'utilisateur. L'application Microsoft Authenticator transforme un téléphone en méthode de connexion, confirmée par une donnée biométrique ou un code PIN. Une clé de sécurité FIDO2 est un appareil matériel qui connecte l'utilisateur sans aucun mot de passe.
  options:
    s2:
      en: A FIDO2 security key doesn't hold a password. The hardware itself authenticates the user, so there is no password to expose or to guess.
      fr: Une clé de sécurité FIDO2 ne contient pas de mot de passe. C'est le matériel lui-même qui authentifie l'utilisateur, il n'y a donc aucun mot de passe à exposer ou à deviner.
references:
  - title: Describe Azure authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods
