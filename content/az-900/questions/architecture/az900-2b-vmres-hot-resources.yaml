id: az900-2b-vmres-hot-resources
objective: "2.2.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You create a virtual machine named **VM1**. The resources of VM1 are shown in the following table.

    Answer each prompt by selecting the appropriate resource in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une machine virtuelle nommée **VM1**. Les ressources de VM1 figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la ressource appropriée dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The resource that connects VM1 to a subnet", fr: "La ressource qui connecte VM1 à un sous-réseau" } }
    - { id: p2, text: { en: "The resource that stores application data separately from the operating system", fr: "La ressource qui stocke les données d'application séparément du système d'exploitation" } }
  grid:
    header: [{ en: "Resource", fr: "Ressource" }, { en: "Name", fr: "Nom" }]
    rows:
      - [{ text: { en: "Operating system disk", fr: "Disque de système d'exploitation" }, area: osdisk }, { text: "VM1-osdisk" }]
      - [{ text: { en: "Data disk", fr: "Disque de données" }, area: datadisk }, { text: "VM1-data1" }]
      - [{ text: { en: "Network interface", fr: "Interface réseau" }, area: nic }, { text: "VM1-nic" }]
      - [{ text: { en: "Public IP address", fr: "Adresse IP publique" }, area: pip }, { text: "VM1-ip" }]
      - [{ text: { en: "Virtual network", fr: "Réseau virtuel" }, area: vnet }, { text: "VNet1" }]
      - [{ text: { en: "Resource group", fr: "Groupe de ressources" }, area: rg }, { text: "RG1" }]
answer:
  values: { p1: nic, p2: datadisk }
explanation:
  correct:
    en: "The network interface connects the virtual machine to a subnet of its virtual network. A data disk stores applications and data apart from the operating system disk, so that the data can be attached to another machine if needed."
    fr: "L'interface réseau connecte la machine virtuelle à un sous-réseau de son réseau virtuel. Un disque de données stocke les applications et les données à part du disque de système d'exploitation, ce qui permet de rattacher les données à une autre machine si nécessaire."
  options:
    pip: { en: "The public IP address makes VM1 reachable from the internet; it doesn't attach VM1 to a subnet.", fr: "L'adresse IP publique rend VM1 joignable depuis internet ; elle ne rattache pas VM1 à un sous-réseau." }
    osdisk: { en: "The operating system disk holds the operating system and the boot volume.", fr: "Le disque de système d'exploitation contient le système d'exploitation et le volume de démarrage." }
references:
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
