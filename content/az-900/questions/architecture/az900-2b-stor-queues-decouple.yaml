id: az900-2b-stor-queues-decouple
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application of Tailspin Toys receives orders. A separate component must process each order later, at its own pace. You need a storage service through which the web application hands the orders over to that component.

    Which Azure Storage service should you use?
  fr: |
    Une application web de Tailspin Toys reçoit des commandes. Un composant distinct doit traiter chaque commande plus tard, à son propre rythme. Il vous faut un service de stockage par lequel l'application web transmet les commandes à ce composant.

    Quel service du Stockage Azure devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Tables", fr: "Tables Azure" } }
    - { id: b, text: { en: "Azure Disks", fr: "Disques Azure" } }
    - { id: c, text: { en: "Azure Queues", fr: "Files d'attente Azure" } }
    - { id: d, text: "Azure Files" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Queues is a messaging store for reliable messaging between application components. The web application writes one message per order, and the other component reads the messages when it is ready: this builds a backlog of work that is processed asynchronously."
    fr: "Files d'attente Azure est un magasin de messages pour une messagerie fiable entre des composants d'application. L'application web écrit un message par commande, et l'autre composant lit les messages lorsqu'il est prêt : cela constitue une file de travaux en attente, traités de façon asynchrone."
  options:
    a: { en: "Azure Tables stores structured data for queries; it isn't designed to pass work from one component to another.", fr: "Tables Azure stocke des données structurées à interroger ; il n'est pas conçu pour transmettre du travail d'un composant à un autre." }
    b: { en: "Azure Disks provides volumes for virtual machines, not messaging between components.", fr: "Disques Azure fournit des volumes pour les machines virtuelles, pas une messagerie entre composants." }
    d: { en: "Azure Files provides file shares; it has no message mechanism for asynchronous processing.", fr: "Azure Files fournit des partages de fichiers ; il n'a pas de mécanisme de messages pour le traitement asynchrone." }
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "What is Azure Queue Storage?"
    url: https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
