id: az900-2a-az-vs-regions
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To keep an application running if a single datacenter of a region fails, deploy the application across [[dc]].

      To keep an application running if an entire region fails, deploy the application to [[region]].
    fr: |
      Pour qu'une application continue de fonctionner si un seul centre de données d'une région tombe en panne, déployez l'application dans [[dc]].

      Pour qu'une application continue de fonctionner si une région entière tombe en panne, déployez l'application dans [[region]].
  slots:
    - id: dc
      options:
        - { id: rg, text: { en: "several resource groups of the region", fr: "plusieurs groupes de ressources de la région" } }
        - { id: zones, text: { en: "several availability zones of the region", fr: "plusieurs zones de disponibilité de la région" } }
        - { id: subs, text: { en: "several subscriptions of the same tenant", fr: "plusieurs abonnements du même locataire" } }
        - { id: mg, text: { en: "several management groups of the same tenant", fr: "plusieurs groupes d'administration du même locataire" } }
    - id: region
      options:
        - { id: twozones, text: { en: "two availability zones of the same region", fr: "deux zones de disponibilité de la même région" } }
        - { id: tworg, text: { en: "two resource groups of the same region", fr: "deux groupes de ressources de la même région" } }
        - { id: twosubs, text: { en: "two subscriptions of the same tenant", fr: "deux abonnements du même locataire" } }
        - { id: tworegions, text: { en: "two regions, for example a region pair", fr: "deux régions, par exemple une paire de régions" } }
answer:
  values: { dc: zones, region: tworegions }
explanation:
  correct:
    en: |
      Availability zones are separate datacenters inside a region: spreading an application across zones protects it from the loss of a datacenter. Zones do not protect against an event that takes down the whole region; for that, the application must also run in a second region, such as the paired region. Resource groups, subscriptions and management groups are management containers and add no physical redundancy.
    fr: |
      Les zones de disponibilité sont des centres de données distincts à l'intérieur d'une région : répartir une application entre plusieurs zones la protège contre la perte d'un centre de données. Les zones ne protègent pas contre un événement qui met hors service toute la région ; pour cela, l'application doit aussi s'exécuter dans une deuxième région, comme la région jumelée. Les groupes de ressources, les abonnements et les groupes d'administration sont des conteneurs de gestion et n'ajoutent aucune redondance physique.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
