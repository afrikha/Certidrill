id: az900-2a-dc-definition
objective: "2.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An Azure datacenter is [[what]].

      Customers do not select an individual datacenter: Azure datacenters are grouped into [[group]].
    fr: |
      Un centre de données Azure est [[what]].

      Les clients ne sélectionnent pas un centre de données en particulier : les centres de données Azure sont regroupés en [[group]].
  slots:
    - id: what
      options:
        - { id: container, text: { en: "a logical container that holds resources sharing the same lifecycle", fr: "un conteneur logique qui contient des ressources partageant le même cycle de vie" } }
        - { id: billing, text: { en: "a unit of management, billing and scale linked to an Azure account", fr: "une unité de gestion, de facturation et de mise à l'échelle liée à un compte Azure" } }
        - { id: facility, text: { en: "a facility that houses racks of servers with dedicated power, cooling and networking", fr: "un bâtiment qui abrite des racks de serveurs avec une alimentation, un refroidissement et un réseau dédiés" } }
    - id: group
      options:
        - { id: physical, text: { en: "regions and availability zones", fr: "régions et zones de disponibilité" } }
        - { id: mgmt, text: { en: "resource groups and subscriptions", fr: "groupes de ressources et abonnements" } }
        - { id: gov, text: { en: "management groups and tenants", fr: "groupes d'administration et locataires" } }
answer:
  values: { what: facility, group: physical }
explanation:
  correct:
    en: |
      Datacenters are the base of the physical infrastructure of Azure: buildings with servers arranged in racks and dedicated power, cooling and networking. You never work with one datacenter directly; they are grouped into regions and availability zones. Resource groups, subscriptions and management groups belong to the management infrastructure.
    fr: |
      Les centres de données sont la base de l'infrastructure physique d'Azure : des bâtiments où des serveurs sont disposés en racks, avec une alimentation, un refroidissement et un réseau dédiés. Vous ne travaillez jamais directement avec un centre de données ; ils sont regroupés en régions et en zones de disponibilité. Les groupes de ressources, les abonnements et les groupes d'administration relèvent de l'infrastructure de gestion.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
