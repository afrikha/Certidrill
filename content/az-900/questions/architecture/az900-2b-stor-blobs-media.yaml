id: az900-2b-stor-blobs-media
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam must store millions of images and videos, and serve them directly to web browsers.

    Which Azure Storage service should Fabrikam use?
  fr: |
    Fabrikam doit stocker des millions d'images et de vidéos, et les servir directement aux navigateurs web.

    Quel service du Stockage Azure Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Files" }
    - { id: b, text: { en: "Azure Queues", fr: "Files d'attente Azure" } }
    - { id: c, text: { en: "Azure Tables", fr: "Tables Azure" } }
    - { id: d, text: { en: "Azure Blobs", fr: "Objets blob Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Blobs is a massively scalable object store for unstructured data, such as text and binary data. It is ideal for serving images or documents directly to a browser and for streaming video and audio."
    fr: "Objets blob Azure est un magasin d'objets massivement scalable pour les données non structurées, comme les données texte et binaires. Il est idéal pour servir des images ou des documents directement à un navigateur et pour diffuser de la vidéo et de l'audio."
  options:
    a: { en: "Azure Files provides file shares mounted over SMB or NFS; it isn't meant to serve media to browsers.", fr: "Azure Files fournit des partages de fichiers montés en SMB ou NFS ; il n'est pas destiné à servir des médias aux navigateurs." }
    b: { en: "Azure Queues stores small messages exchanged between application components.", fr: "Files d'attente Azure stocke de petits messages échangés entre des composants d'application." }
    c: { en: "Azure Tables stores structured, non-relational data as keys and attributes, not media files.", fr: "Tables Azure stocke des données structurées non relationnelles sous forme de clés et d'attributs, pas des fichiers multimédias." }
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "Introduction to Azure Blob Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
