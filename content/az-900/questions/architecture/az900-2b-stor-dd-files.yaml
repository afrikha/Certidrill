id: az900-2b-stor-dd-files
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Files provides fully managed file shares that are accessed over the [[s1]] protocols. A file share can be mounted [[s2]].
    fr: |
      Azure Files fournit des partages de fichiers entièrement managés, accessibles par les protocoles [[s1]]. Un partage de fichiers peut être monté [[s2]].
  slots:
    - id: s1
      options:
        - { id: ftp, text: { en: "FTP or SFTP", fr: "FTP ou SFTP" } }
        - { id: smb, text: { en: "SMB or NFS", fr: "SMB ou NFS" } }
        - { id: iscsi, text: { en: "iSCSI or Fibre Channel", fr: "iSCSI ou Fibre Channel" } }
    - id: s2
      options:
        - { id: both, text: { en: "at the same time from the cloud and from on-premises computers", fr: "en même temps depuis le cloud et depuis des ordinateurs locaux" } }
        - { id: azure, text: { en: "only from Azure virtual machines", fr: "uniquement depuis des machines virtuelles Azure" } }
        - { id: one, text: { en: "by only one computer at a time", fr: "par un seul ordinateur à la fois" } }
answer:
  values: { s1: smb, s2: both }
explanation:
  correct:
    en: "Azure Files offers fully managed file shares that are accessible through the industry-standard SMB and NFS protocols. The shares can be mounted concurrently by cloud and on-premises deployments."
    fr: "Azure Files propose des partages de fichiers entièrement managés, accessibles par les protocoles standard SMB et NFS. Les partages peuvent être montés simultanément par des déploiements cloud et locaux."
  options:
    iscsi: { en: "iSCSI and Fibre Channel are block storage protocols used by storage area networks, not by Azure Files shares.", fr: "iSCSI et Fibre Channel sont des protocoles de stockage en mode bloc utilisés par les réseaux de stockage (SAN), pas par les partages Azure Files." }
    one: { en: "A volume attached to a single machine describes a disk; a file share is meant for shared, concurrent access.", fr: "Un volume attaché à une seule machine décrit un disque ; un partage de fichiers est fait pour un accès partagé et simultané." }
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "What is Azure Files?"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
