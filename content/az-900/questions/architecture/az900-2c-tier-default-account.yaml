id: az900-2c-tier-default-account
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application uploads block blobs to a standard general-purpose v2 storage account. The application doesn't specify an access tier for the blobs.

    What determines the access tier in which the blobs are stored?
  fr: |
    Une application charge des objets blob de blocs dans un compte de stockage à usage général v2 Standard. L'application ne précise aucun niveau d'accès pour les objets blob.

    Qu'est-ce qui détermine le niveau d'accès dans lequel les objets blob sont stockés ?
body:
  options:
    - id: a
      text: { en: "The redundancy option of the storage account", fr: "L'option de redondance du compte de stockage" }
    - id: b
      text: { en: "The region of the storage account", fr: "La région du compte de stockage" }
    - id: c
      text: { en: "The default access tier of the storage account", fr: "Le niveau d'accès par défaut du compte de stockage" }
    - id: d
      text: { en: "The size of each blob", fr: "La taille de chaque objet blob" }
answer: { optionId: c }
explanation:
  correct:
    en: A storage account has a default access tier, which can be hot, cool or cold. A blob that is uploaded without an explicit tier takes the default tier of the account. The tier can still be changed later for each blob.
    fr: Un compte de stockage possède un niveau d'accès par défaut, qui peut être chaud (Hot), froid (Cool) ou froid (Cold). Un objet blob chargé sans niveau explicite prend le niveau par défaut du compte. Le niveau peut ensuite être modifié pour chaque objet blob.
  options:
    a:
      en: Redundancy decides where the copies of the data are kept (datacenter, zones, regions), not how the data is priced for storage and access.
      fr: La redondance décide de l'emplacement des copies des données (centre de données, zones, régions), pas de la tarification du stockage et de l'accès.
    b:
      en: The region decides where the data is located. It doesn't assign an access tier to a blob.
      fr: La région décide de l'emplacement des données. Elle n'attribue pas de niveau d'accès à un objet blob.
    d:
      en: The size of a blob doesn't select its access tier. Without an explicit tier, the blob uses the default tier of the account.
      fr: La taille d'un objet blob ne sélectionne pas son niveau d'accès. Sans niveau explicite, l'objet blob utilise le niveau par défaut du compte.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
