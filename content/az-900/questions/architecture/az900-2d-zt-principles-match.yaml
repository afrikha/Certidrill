id: az900-2d-zt-principles-match
objective: "2.4.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders adopts the Zero Trust model and reviews three of its security practices.

    Which concept does each practice apply? To answer, drag the appropriate concepts to the correct practices. Each concept may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders adopte le modèle Confiance Zéro et passe en revue trois de ses pratiques de sécurité.

    Quel concept chaque pratique applique-t-elle ? Pour répondre, faites glisser les concepts appropriés vers les pratiques correspondantes. Chaque concept peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: breach, text: { en: "Assume breach", fr: "Supposer une violation (Assume breach)" } }
    - { id: shared, text: { en: "Shared responsibility", fr: "Responsabilité partagée (Shared responsibility)" } }
    - { id: verify, text: { en: "Verify explicitly", fr: "Vérifier explicitement (Verify explicitly)" } }
    - { id: least, text: { en: "Use least privilege access", fr: "Utiliser l'accès selon le moindre privilège (Use least privilege access)" } }
  targets:
    - id: t1
      text: { en: "Administrators receive elevated permissions just in time, and only the permissions that the task needs.", fr: "Les administrateurs reçoivent des autorisations élevées juste-à-temps, et seulement celles que la tâche exige." }
    - id: t2
      text: { en: "Access is segmented and traffic is encrypted end to end, to limit the impact of an intrusion.", fr: "L'accès est segmenté et le trafic est chiffré de bout en bout, pour limiter l'impact d'une intrusion." }
    - id: t3
      text: { en: "Every request is authenticated and authorized by using all the available data points.", fr: "Chaque requête est authentifiée et autorisée à partir de toutes les données disponibles." }
answer:
  mapping: { t1: least, t2: breach, t3: verify }
explanation:
  correct:
    en: "The three guiding principles of Zero Trust are: verify explicitly (always authenticate and authorize based on all available data points), use least privilege access (limit access with just-in-time and just-enough access), and assume breach (limit the potential impact by segmenting access, verifying end-to-end encryption and using analytics to detect threats)."
    fr: "Les trois principes directeurs de la Confiance Zéro sont : vérifier explicitement (toujours authentifier et autoriser à partir de toutes les données disponibles), utiliser l'accès selon le moindre privilège (limiter l'accès au juste-à-temps et au juste nécessaire) et supposer une violation (limiter l'impact potentiel en segmentant l'accès, en vérifiant le chiffrement de bout en bout et en utilisant l'analyse pour détecter les menaces)."
  options:
    shared:
      en: "Shared responsibility is not a Zero Trust principle: it describes how security tasks are split between the cloud provider and the customer."
      fr: "La responsabilité partagée n'est pas un principe de la Confiance Zéro : elle décrit la répartition des tâches de sécurité entre le fournisseur de cloud et le client."
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
