id: az900-2a-dc-zones-subtle
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the datacenters of an Azure region, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les centres de données d'une région Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A region that supports availability zones contains at least three physically separate datacenters."
        fr: "Une région qui prend en charge les zones de disponibilité contient au moins trois centres de données physiquement séparés."
    - id: s2
      text:
        en: "Two availability zones of the same region can be hosted in the same datacenter."
        fr: "Deux zones de disponibilité d'une même région peuvent être hébergées dans le même centre de données."
    - id: s3
      text:
        en: "A region that has no availability zones can consist of a single datacenter."
        fr: "Une région sans zones de disponibilité peut se composer d'un seul centre de données."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A zone-enabled region has a minimum of three zones, and every zone is one or more physically separate datacenters, so such a region has at least three datacenters and two zones never share one. A region is defined as an area that contains at least one datacenter, so a region without zones may consist of only one.
    fr: |
      Une région qui prend en charge les zones en compte au minimum trois, et chaque zone correspond à un ou plusieurs centres de données physiquement séparés : une telle région compte donc au moins trois centres de données, et deux zones n'en partagent jamais un. Une région se définit comme un secteur qui contient au moins un centre de données : une région sans zones peut donc n'en compter qu'un seul.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
