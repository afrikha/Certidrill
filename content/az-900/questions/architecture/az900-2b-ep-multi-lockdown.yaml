id: az900-2b-ep-multi-lockdown
objective: "2.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores documents in an Azure storage account. Virtual machines in a virtual network named **VNet1** read the documents through the public endpoint of the account.

    Fabrikam requires that the virtual machines reach the account through a private IP address, and that the account is no longer reachable from the internet.

    Which two actions should Fabrikam perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke des documents dans un compte de stockage Azure. Les machines virtuelles d'un réseau virtuel nommé **VNet1** lisent les documents par le point de terminaison public du compte.

    Fabrikam exige que les machines virtuelles atteignent le compte par une adresse IP privée, et que le compte ne soit plus joignable depuis internet.

    Quelles sont les deux actions que Fabrikam doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign a public IP address to each virtual machine.", fr: "Attribuer une adresse IP publique à chaque machine virtuelle." } }
    - { id: b, text: { en: "Create a private endpoint for the storage account in VNet1.", fr: "Créer un point de terminaison privé pour le compte de stockage dans VNet1." } }
    - { id: c, text: { en: "Create a VPN gateway in VNet1.", fr: "Créer une passerelle VPN dans VNet1." } }
    - { id: d, text: { en: "Peer VNet1 with a second virtual network.", fr: "Relier VNet1 à un deuxième réseau virtuel par peering." } }
    - { id: e, text: { en: "Disable access to the storage account through its public endpoint.", fr: "Désactiver l'accès au compte de stockage par son point de terminaison public." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The private endpoint gives the storage account a private IP address in VNet1, so the virtual machines reach it without leaving the Microsoft network. Creating a private endpoint doesn't close the public endpoint by itself: access through the public endpoint must be denied separately, and traffic that arrives through the private endpoint stays allowed."
    fr: "Le point de terminaison privé donne au compte de stockage une adresse IP privée dans VNet1 : les machines virtuelles l'atteignent sans quitter le réseau de Microsoft. La création d'un point de terminaison privé ne ferme pas à elle seule le point de terminaison public : l'accès par le point de terminaison public doit être refusé séparément, et le trafic qui arrive par le point de terminaison privé reste autorisé."
  options:
    a: { en: "Public IP addresses expose the virtual machines to the internet; they don't make the access to the account private.", fr: "Des adresses IP publiques exposent les machines virtuelles à internet ; elles ne rendent pas privé l'accès au compte." }
    c: { en: "A VPN gateway connects on-premises networks to VNet1; it doesn't give the storage account a private address.", fr: "Une passerelle VPN connecte des réseaux locaux à VNet1 ; elle ne donne pas d'adresse privée au compte de stockage." }
    d: { en: "Peering connects two virtual networks; the storage account still answers on its public endpoint.", fr: "Le peering connecte deux réseaux virtuels ; le compte de stockage répond toujours sur son point de terminaison public." }
references:
  - title: "Use private endpoints for Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: "What is a private endpoint?"
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
