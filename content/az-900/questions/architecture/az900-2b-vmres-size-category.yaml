id: az900-2b-vmres-size-category
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to run a large in-memory database on an Azure virtual machine.

    Which category of virtual machine sizes should Wingtip Toys choose?
  fr: |
    Wingtip Toys prévoit d'exécuter une grande base de données en mémoire sur une machine virtuelle Azure.

    Quelle catégorie de tailles de machine virtuelle Wingtip Toys doit-elle choisir ?
body:
  options:
    - { id: a, text: { en: "General purpose", fr: "Usage général" } }
    - { id: b, text: { en: "Compute optimized", fr: "Optimisée pour le calcul" } }
    - { id: c, text: { en: "Memory optimized", fr: "Optimisée pour la mémoire" } }
    - { id: d, text: { en: "Storage optimized", fr: "Optimisée pour le stockage" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Virtual machine sizes are grouped into families by purpose. Memory optimized sizes offer a large amount of memory per processor core, which is what in-memory databases and analytics need."
    fr: "Les tailles de machines virtuelles sont regroupées en familles selon leur usage. Les tailles optimisées pour la mémoire offrent une grande quantité de mémoire par cœur de processeur, ce dont ont besoin les bases de données en mémoire et l'analytique."
  options:
    a: { en: "General purpose sizes suit web servers and small to medium application servers, not a memory-intensive database.", fr: "Les tailles à usage général conviennent aux serveurs web et aux serveurs d'applications petits à moyens, pas à une base de données gourmande en mémoire." }
    b: { en: "Compute optimized sizes target processor-intensive application tiers.", fr: "Les tailles optimisées pour le calcul visent les niveaux applicatifs gourmands en processeur." }
    d: { en: "Storage optimized sizes target high disk throughput, not data kept in memory.", fr: "Les tailles optimisées pour le stockage visent un débit de disque élevé, pas des données conservées en mémoire." }
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
