id: az900-2c-dir-yn-managed-domain
objective: "2.4.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso synchronizes its on-premises Active Directory to Microsoft Entra ID and creates a Microsoft Entra Domain Services managed domain.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso synchronise son annuaire Active Directory local vers Microsoft Entra ID et crée un domaine managé Microsoft Entra Domain Services.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who is created directly in the managed domain is synchronized back to Microsoft Entra ID.
        fr: Un utilisateur créé directement dans le domaine managé est synchronisé en retour vers Microsoft Entra ID.
    - id: s2
      text:
        en: The users of Microsoft Entra ID can sign in to the managed domain with their existing credentials.
        fr: Les utilisateurs de Microsoft Entra ID peuvent se connecter au domaine managé avec leurs informations d'identification existantes.
    - id: s3
      text:
        en: The managed domain receives the on-premises users directly from the on-premises domain controllers.
        fr: Le domaine managé reçoit les utilisateurs locaux directement des contrôleurs de domaine locaux.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: A managed domain takes its users and groups from Microsoft Entra ID through a one-way synchronization, so users sign in with their existing credentials. Objects created in the managed domain aren't written back to Microsoft Entra ID. On-premises identities first reach Microsoft Entra ID, through Microsoft Entra Connect, and Microsoft Entra ID then synchronizes them to the managed domain.
    fr: Un domaine managé tire ses utilisateurs et ses groupes de Microsoft Entra ID par une synchronisation à sens unique, les utilisateurs se connectent donc avec leurs informations d'identification existantes. Les objets créés dans le domaine managé ne sont pas réécrits dans Microsoft Entra ID. Les identités locales arrivent d'abord dans Microsoft Entra ID, grâce à Microsoft Entra Connect, puis Microsoft Entra ID les synchronise vers le domaine managé.
  options:
    s1:
      en: The synchronization goes in one direction only, from Microsoft Entra ID to the managed domain.
      fr: La synchronisation ne va que dans un seul sens, de Microsoft Entra ID vers le domaine managé.
    s3:
      en: The managed domain synchronizes only with Microsoft Entra ID. It is a separate domain, not an extension of the on-premises domain.
      fr: Le domaine managé ne se synchronise qu'avec Microsoft Entra ID. C'est un domaine distinct, pas une extension du domaine local.
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
  - title: Describe Azure directory services
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services
