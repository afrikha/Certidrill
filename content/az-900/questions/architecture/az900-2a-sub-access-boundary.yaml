id: az900-2a-sub-access-boundary
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has two subscriptions named **Sub1** and **Sub2** that trust the same Microsoft Entra tenant.

    A user named User1 is assigned the Owner role on Sub1. No other role is assigned to User1.

    Which resources can User1 manage?
  fr: |
    Woodgrove Bank dispose de deux abonnements nommés **Sub1** et **Sub2** qui approuvent le même locataire Microsoft Entra.

    Le rôle Owner est attribué à un utilisateur nommé User1 sur Sub1. Aucun autre rôle n'est attribué à User1.

    Quelles ressources User1 peut-il gérer ?
body:
  options:
    - id: a
      text: { en: "The resources of Sub1 and Sub2, because both subscriptions trust the same tenant", fr: "Les ressources de Sub1 et de Sub2, car les deux abonnements approuvent le même locataire" }
    - id: b
      text: { en: "The resources of all the resource groups of Sub1, and nothing in Sub2", fr: "Les ressources de tous les groupes de ressources de Sub1, et rien dans Sub2" }
    - id: c
      text: { en: "The resources of the resource groups that User1 created in Sub1, and nothing else", fr: "Les ressources des groupes de ressources que User1 a créés dans Sub1, et rien d'autre" }
    - id: d
      text: { en: "The resources of every subscription that has the same parent as Sub1", fr: "Les ressources de tous les abonnements qui ont le même parent que Sub1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A subscription is an access control boundary. A role assigned on Sub1 is inherited by all the resource groups and resources of Sub1, and it stops there: it gives no rights in another subscription, even one that uses the same tenant.
    fr: |
      Un abonnement est une limite de contrôle d'accès. Un rôle attribué sur Sub1 est hérité par tous les groupes de ressources et toutes les ressources de Sub1, et s'arrête là : il ne donne aucun droit dans un autre abonnement, même si celui-ci utilise le même locataire.
  options:
    a: { en: "Sharing a tenant means sharing the directory of identities, not the role assignments of each subscription.", fr: "Partager un locataire revient à partager l'annuaire des identités, pas les attributions de rôles de chaque abonnement." }
    c: { en: "A role assigned on a subscription covers every resource group in it, whoever created it.", fr: "Un rôle attribué sur un abonnement couvre tous ses groupes de ressources, quel qu'en soit le créateur." }
    d: { en: "Access is inherited downward from a scope; it does not spread to sibling subscriptions.", fr: "L'accès s'hérite vers le bas à partir d'une étendue ; il ne se propage pas aux abonnements voisins." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: Associate or add an Azure subscription to your Microsoft Entra tenant
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptions-associated-directory
