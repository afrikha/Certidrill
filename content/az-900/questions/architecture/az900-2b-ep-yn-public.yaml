id: az900-2b-ep-yn-public
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A service that has a public endpoint is reachable only from Azure virtual networks.", fr: "Un service doté d'un point de terminaison public n'est joignable que depuis des réseaux virtuels Azure." } }
    - { id: s2, text: { en: "A virtual machine needs a public IP address to connect to a service through a private endpoint.", fr: "Une machine virtuelle a besoin d'une adresse IP publique pour se connecter à un service par un point de terminaison privé." } }
    - { id: s3, text: { en: "A storage account is created with a public endpoint.", fr: "Un compte de stockage est créé avec un point de terminaison public." } }
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "A public endpoint has a public IP address and can be accessed from anywhere in the world. A private endpoint has a private IP address inside a virtual network, so a virtual machine reaches it with its own private address. A storage account has public endpoints for its services from its creation; a private endpoint is something that you add."
    fr: "Un point de terminaison public a une adresse IP publique et est accessible de partout dans le monde. Un point de terminaison privé a une adresse IP privée dans un réseau virtuel : une machine virtuelle l'atteint avec sa propre adresse privée. Un compte de stockage dispose de points de terminaison publics pour ses services dès sa création ; un point de terminaison privé est un ajout de votre part."
references:
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
  - title: "Use private endpoints for Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
