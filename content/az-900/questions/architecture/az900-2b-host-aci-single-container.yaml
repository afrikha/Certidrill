id: az900-2b-host-aci-single-container
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to run a single container in Azure as quickly and as simply as possible. You don't want to manage virtual machines or adopt an orchestration service.

    Which service should you use?
  fr: |
    Vous devez exécuter un seul conteneur dans Azure, aussi rapidement et aussi simplement que possible. Vous ne voulez ni gérer de machines virtuelles ni adopter un service d'orchestration.

    Quel service devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Azure Container Instances" }
    - { id: b, text: "Azure Kubernetes Service" }
    - { id: c, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - { id: d, text: { en: "Azure Virtual Machine Scale Sets", fr: "Groupes de machines virtuelles identiques Azure" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Container Instances is the fastest and simplest way to run a container in Azure: you provide the container and the service runs it. There is no virtual machine to manage and no higher-level orchestrator to adopt."
    fr: "Azure Container Instances est le moyen le plus rapide et le plus simple d'exécuter un conteneur dans Azure : vous fournissez le conteneur et le service l'exécute. Il n'y a ni machine virtuelle à gérer ni orchestrateur de plus haut niveau à adopter."
  options:
    b: { en: "Azure Kubernetes Service is an orchestration service, intended for fleets of containers.", fr: "Azure Kubernetes Service est un service d'orchestration, destiné aux flottes de conteneurs." }
    c: { en: "You would have to create a virtual machine, install a container engine on it and maintain it.", fr: "Vous devriez créer une machine virtuelle, y installer un moteur de conteneurs et la maintenir." }
    d: { en: "A scale set is a group of virtual machines to manage, which is more than a single container needs.", fr: "Un groupe identique est un ensemble de machines virtuelles à gérer, bien plus que ce que demande un seul conteneur." }
references:
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
  - title: "What is Azure Container Instances?"
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
