id: az900-2d-ext-b2b-statements
objective: "2.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses Microsoft Entra ID and plans to work with a partner company by using B2B collaboration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise Microsoft Entra ID et prévoit de travailler avec une entreprise partenaire grâce à la collaboration B2B.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The partner company must have its own Microsoft Entra tenant before its users can be invited."
        fr: "L'entreprise partenaire doit posséder son propre locataire Microsoft Entra avant que ses utilisateurs puissent être invités."
    - id: s2
      text:
        en: "An administrator of your organization can invite a user of the partner company as a guest user."
        fr: "Un administrateur de votre organisation peut inviter un utilisateur de l'entreprise partenaire en tant qu'utilisateur invité."
    - id: s3
      text:
        en: "Your organization can apply its own access policies, such as a multifactor authentication requirement, to guest users."
        fr: "Votre organisation peut appliquer ses propres stratégies d'accès, par exemple l'exigence d'une authentification multifacteur, aux utilisateurs invités."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A partner does not need Microsoft Entra ID: guests can sign in with other work, school or social identities. Administrators, or users you authorize, invite the external users, who become guest users in your directory. Authentication stays with the guest's identity provider, but your organization controls authorization and can enforce its policies, including multifactor authentication, on guests."
    fr: "Un partenaire n'a pas besoin de Microsoft Entra ID : les invités peuvent se connecter avec d'autres identités professionnelles, scolaires ou de réseaux sociaux. Les administrateurs, ou les utilisateurs que vous y autorisez, invitent les utilisateurs externes, qui deviennent des utilisateurs invités de votre annuaire. L'authentification reste chez le fournisseur d'identité de l'invité, mais votre organisation contrôle l'autorisation et peut imposer ses stratégies, dont l'authentification multifacteur, aux invités."
  options:
    s1:
      en: "B2B collaboration works with partners that have no Microsoft Entra tenant, for example with a Microsoft account or another identity provider."
      fr: "La collaboration B2B fonctionne avec des partenaires sans locataire Microsoft Entra, par exemple avec un compte Microsoft ou un autre fournisseur d'identité."
references:
  - title: What is Microsoft Entra B2B collaboration?
    url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
  - title: Describe Azure external identities
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities
