id: az900-2b-host-multi-no-os
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two services let you host an application without managing the operating system of a server? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux services qui permettent d'héberger une application sans gérer le système d'exploitation d'un serveur ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure App Service" }
    - { id: b, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - { id: c, text: "Azure Container Instances" }
    - { id: d, text: { en: "Azure Virtual Machine Scale Sets", fr: "Groupes de machines virtuelles identiques Azure" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "App Service hosts web applications and APIs without any infrastructure for you to manage. Azure Container Instances runs your containers for you, without virtual machines to manage. In both cases Microsoft maintains the servers and their operating system."
    fr: "App Service héberge des applications web et des API sans aucune infrastructure à gérer de votre côté. Azure Container Instances exécute vos conteneurs pour vous, sans machines virtuelles à gérer. Dans les deux cas, Microsoft maintient les serveurs et leur système d'exploitation."
  options:
    b: { en: "On a virtual machine, you patch, update and configure the operating system yourself.", fr: "Sur une machine virtuelle, vous appliquez vous-même les correctifs, les mises à jour et la configuration du système d'exploitation." }
    d: { en: "A scale set is made of virtual machines, whose operating system remains your responsibility.", fr: "Un groupe identique est constitué de machines virtuelles, dont le système d'exploitation reste sous votre responsabilité." }
references:
  - title: "Describe application hosting options"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
