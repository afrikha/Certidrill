id: az900-2d-ext-customer-app
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys develops a shopping web app for the general public. Customers must be able to sign up by themselves with an email address or a social account. Customer accounts must be kept separate from the directory of the Tailspin Toys employees.

    What should Tailspin Toys use?
  fr: |
    Tailspin Toys développe une application web d'achat destinée au grand public. Les clients doivent pouvoir s'inscrire eux-mêmes avec une adresse e-mail ou un compte de réseau social. Les comptes des clients doivent rester séparés de l'annuaire des employés de Tailspin Toys.

    Que doit utiliser Tailspin Toys ?
body:
  options:
    - id: a
      text: { en: "B2B direct connect with the organization of each customer", fr: "La connexion directe B2B avec l'organisation de chaque client" }
    - id: b
      text: { en: "A managed domain in Microsoft Entra Domain Services", fr: "Un domaine managé dans Microsoft Entra Domain Services" }
    - id: c
      text: { en: "An external tenant in Microsoft Entra External ID", fr: "Un locataire externe dans Microsoft Entra External ID" }
    - id: d
      text: { en: "Customer accounts synchronized by Microsoft Entra Connect", fr: "Des comptes clients synchronisés par Microsoft Entra Connect" }
answer: { optionId: c }
explanation:
  correct:
    en: "An external tenant of Microsoft Entra External ID is designed for the customers of an application that you publish. It is separate from the workforce directory, and customers register themselves and sign in with an email address or a social account."
    fr: "Un locataire externe de Microsoft Entra External ID est conçu pour les clients d'une application que vous publiez. Il est séparé de l'annuaire des employés, et les clients s'y inscrivent eux-mêmes puis se connectent avec une adresse e-mail ou un compte de réseau social."
  options:
    a:
      en: "B2B direct connect is a mutual trust between two Microsoft Entra organizations, used for Teams shared channels; consumers have no organization to trust."
      fr: "La connexion directe B2B est une approbation mutuelle entre deux organisations Microsoft Entra, utilisée pour les canaux partagés Teams ; des consommateurs n'ont pas d'organisation à approuver."
    b:
      en: "Microsoft Entra Domain Services provides domain join, Group Policy, LDAP and Kerberos to legacy applications; it does not offer customer sign-up."
      fr: "Microsoft Entra Domain Services fournit la jonction de domaine, la stratégie de groupe, LDAP et Kerberos aux applications anciennes ; il ne propose pas d'inscription des clients."
    d:
      en: "Microsoft Entra Connect synchronizes on-premises identities to Microsoft Entra ID; it neither lets customers sign up nor keeps them out of the employee directory."
      fr: "Microsoft Entra Connect synchronise des identités locales vers Microsoft Entra ID ; il ne permet pas aux clients de s'inscrire et ne les sépare pas de l'annuaire des employés."
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
