id: az900-2b-host-app-service-code
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The developers of Tailspin Toys want to publish a Node.js web application. They want to deploy only their code and let the platform provide load balancing and automatic scaling.

    Which service should they use?
  fr: |
    Les développeurs de Tailspin Toys veulent publier une application web Node.js. Ils veulent déployer uniquement leur code et laisser la plateforme fournir l'équilibrage de charge et la mise à l'échelle automatique.

    Quel service doivent-ils utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - { id: b, text: "Azure App Service" }
    - { id: c, text: "Azure Virtual Desktop" }
    - { id: d, text: { en: "Azure Virtual Machine Scale Sets", fr: "Groupes de machines virtuelles identiques Azure" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure App Service lets you build and host web applications in the language of your choice, including Node.js, without managing infrastructure. It provides built-in load balancing, automatic scaling and high availability."
    fr: "Azure App Service permet de créer et d'héberger des applications web dans le langage de votre choix, dont Node.js, sans gérer d'infrastructure. Il fournit l'équilibrage de charge, la mise à l'échelle automatique et la haute disponibilité intégrés."
  options:
    a: { en: "On virtual machines, the developers would have to install, update and manage the servers themselves.", fr: "Sur des machines virtuelles, les développeurs devraient installer, mettre à jour et gérer eux-mêmes les serveurs." }
    c: { en: "Azure Virtual Desktop delivers Windows desktops and applications to users; it doesn't host websites.", fr: "Azure Virtual Desktop fournit des bureaux et des applications Windows aux utilisateurs ; il n'héberge pas de sites web." }
    d: { en: "A scale set adds virtual machines automatically, but the machines and their operating system remain to be managed.", fr: "Un groupe identique ajoute automatiquement des machines virtuelles, mais les machines et leur système d'exploitation restent à gérer." }
references:
  - title: "Describe application hosting options"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options
  - title: "App Service overview"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview
