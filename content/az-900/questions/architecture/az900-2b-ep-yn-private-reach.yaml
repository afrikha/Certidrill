id: az900-2b-ep-yn-private-reach
objective: "2.2.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Private endpoints are available only for Azure Storage accounts.", fr: "Les points de terminaison privés sont disponibles uniquement pour les comptes de stockage Azure." } }
    - { id: s2, text: { en: "Computers of an on-premises network that is connected to a virtual network through a VPN or ExpressRoute can reach a private endpoint of that virtual network.", fr: "Les ordinateurs d'un réseau local connecté à un réseau virtuel par un VPN ou ExpressRoute peuvent atteindre un point de terminaison privé de ce réseau virtuel." } }
    - { id: s3, text: { en: "A public endpoint takes its IP address from the address space of your virtual network.", fr: "Un point de terminaison public prend son adresse IP dans l'espace d'adressage de votre réseau virtuel." } }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Private endpoints connect to many services, such as Azure Storage, Azure SQL Database and Azure Cosmos DB. A private endpoint can be reached from its virtual network, from peered virtual networks and from on-premises networks connected through a VPN or ExpressRoute. The address taken from the virtual network belongs to the private endpoint; a public endpoint has a public IP address."
    fr: "Les points de terminaison privés se connectent à de nombreux services, comme Stockage Azure, Azure SQL Database et Azure Cosmos DB. Un point de terminaison privé est joignable depuis son réseau virtuel, depuis des réseaux virtuels reliés par peering et depuis des réseaux locaux connectés par un VPN ou ExpressRoute. L'adresse prise dans le réseau virtuel est celle du point de terminaison privé ; un point de terminaison public a une adresse IP publique."
references:
  - title: "What is a private endpoint?"
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
