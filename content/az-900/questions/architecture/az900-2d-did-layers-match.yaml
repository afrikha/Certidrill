id: az900-2d-did-layers-match
objective: "2.4.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each security measure to the layer of the defense-in-depth model that it belongs to.

    To answer, drag the appropriate layers to the correct measures. Each layer may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque mesure de sécurité à la couche du modèle de défense en profondeur dont elle relève.

    Pour répondre, faites glisser les couches appropriées vers les mesures correspondantes. Chaque couche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: physical, text: { en: "Physical security", fr: "Sécurité physique" } }
    - { id: identity, text: { en: "Identity and access", fr: "Identité et accès" } }
    - { id: perimeter, text: { en: "Perimeter", fr: "Périmètre" } }
    - { id: network, text: { en: "Network", fr: "Réseau" } }
    - { id: compute, text: { en: "Compute", fr: "Calcul" } }
    - { id: application, text: { en: "Application", fr: "Application" } }
  targets:
    - id: t1
      text: { en: "Keep virtual machines patched and install endpoint protection on them.", fr: "Maintenir les machines virtuelles à jour de leurs correctifs et y installer une protection des points de terminaison." }
    - id: t2
      text: { en: "Use DDoS protection to filter large-scale attacks before they affect the availability of a service.", fr: "Utiliser une protection DDoS pour filtrer les attaques à grande échelle avant qu'elles n'affectent la disponibilité d'un service." }
    - id: t3
      text: { en: "Integrate security into the development lifecycle to reduce the vulnerabilities in code.", fr: "Intégrer la sécurité au cycle de vie du développement pour réduire les vulnérabilités dans le code." }
    - id: t4
      text: { en: "Use single sign-on and multifactor authentication, and audit sign-in events.", fr: "Utiliser l'authentification unique et l'authentification multifacteur, et auditer les événements de connexion." }
answer:
  mapping: { t1: compute, t2: perimeter, t3: application, t4: identity }
explanation:
  correct:
    en: "The compute layer secures access to virtual machines, with endpoint protection and systems kept patched. The perimeter layer protects against network-based attacks from outside, with DDoS protection and perimeter firewalls. The application layer makes applications secure and free of vulnerabilities, with security built into development. The identity and access layer secures identities with single sign-on, multifactor authentication and the audit of events."
    fr: "La couche calcul sécurise l'accès aux machines virtuelles, avec la protection des points de terminaison et des systèmes maintenus à jour. La couche périmètre protège contre les attaques réseau venues de l'extérieur, avec la protection DDoS et les pare-feux de périmètre. La couche application rend les applications sûres et sans vulnérabilités, avec une sécurité intégrée au développement. La couche identité et accès sécurise les identités avec l'authentification unique, l'authentification multifacteur et l'audit des événements."
  options:
    physical:
      en: "Physical security covers access to the datacenter buildings and to the computing hardware; none of the four measures is physical."
      fr: "La sécurité physique couvre l'accès aux bâtiments des centres de données et au matériel informatique ; aucune des quatre mesures n'est physique."
    network:
      en: "The network layer limits connectivity between resources (segmentation, deny by default); DDoS protection sits one layer out, at the perimeter."
      fr: "La couche réseau limite la connectivité entre les ressources (segmentation, refus par défaut) ; la protection DDoS se situe une couche plus à l'extérieur, au périmètre."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
