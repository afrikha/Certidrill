id: az900-2c-auth-sso-risk
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum enables single sign-on (SSO) for 40 applications. The security team notes that one stolen password now opens all 40 applications. Users must keep signing in only once.

    What should you add to reduce this risk?
  fr: |
    Adatum active l'authentification unique (SSO) pour 40 applications. L'équipe de sécurité remarque qu'un seul mot de passe volé ouvre désormais les 40 applications. Les utilisateurs doivent continuer de ne se connecter qu'une seule fois.

    Que devez-vous ajouter pour réduire ce risque ?
body:
  options:
    - id: a
      text: { en: "A different password for each application", fr: "Un mot de passe différent pour chaque application" }
    - id: b
      text: { en: "Multifactor authentication for the initial sign-in", fr: "L'authentification multifacteur pour la connexion initiale" }
    - id: c
      text: { en: "Self-service password reset for all the users", fr: "La réinitialisation de mot de passe en libre-service pour tous les utilisateurs" }
    - id: d
      text: { en: "Microsoft Entra Domain Services for the applications", fr: "Microsoft Entra Domain Services pour les applications" }
answer: { optionId: b }
explanation:
  correct:
    en: SSO is only as secure as the initial sign-in, because every later access depends on it. Multifactor authentication strengthens that sign-in. A stolen password alone no longer gives access, and users still sign in one time.
    fr: L'authentification unique n'est sûre qu'autant que la connexion initiale, car tous les accès suivants en dépendent. L'authentification multifacteur renforce cette connexion. Un mot de passe volé ne donne plus accès à lui seul, et les utilisateurs se connectent toujours une seule fois.
  options:
    a:
      en: One password per application means one sign-in per application. That removes SSO, which users must keep.
      fr: Un mot de passe par application signifie une connexion par application. Cela supprime l'authentification unique, que les utilisateurs doivent conserver.
    c:
      en: Self-service password reset helps a user who forgot the password. It doesn't stop an attacker who knows the password.
      fr: La réinitialisation de mot de passe en libre-service aide un utilisateur qui a oublié son mot de passe. Elle n'arrête pas un attaquant qui connaît le mot de passe.
    d:
      en: Microsoft Entra Domain Services provides managed domain services for legacy applications. It doesn't strengthen the sign-in.
      fr: Microsoft Entra Domain Services fournit des services de domaine managés pour des applications anciennes. Il ne renforce pas la connexion.
references:
  - title: Describe Azure authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods
