id: az900-2b-stor-yn-services
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Queues is designed to store large binary files, such as videos.", fr: "Files d'attente Azure est conçu pour stocker de gros fichiers binaires, comme des vidéos." } }
    - { id: s2, text: { en: "Azure Tables is a relational database service.", fr: "Tables Azure est un service de base de données relationnelle." } }
    - { id: s3, text: { en: "Azure Storage encrypts all the data that is written to a storage account.", fr: "Le Stockage Azure chiffre toutes les données écrites dans un compte de stockage." } }
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Azure Queues stores messages of up to 64 KB exchanged between application components; large binary objects belong in Azure Blobs. Azure Tables is a NoSQL store for structured, non-relational data. All the data written to a storage account is encrypted by the service."
    fr: "Files d'attente Azure stocke des messages de 64 Ko au plus échangés entre des composants d'application ; les gros objets binaires relèvent d'Objets blob Azure. Tables Azure est un magasin NoSQL pour des données structurées non relationnelles. Toutes les données écrites dans un compte de stockage sont chiffrées par le service."
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "Introduction to Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
