id: az900-2c-move-filesync-offices
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Windows file server in each of its three offices. The company wants to centralize the files in Azure Files. Users must keep opening the files from the server of their office, and a change made in one office must appear in the other offices.

    Which service should you use?
  fr: |
    Litware possède un serveur de fichiers Windows dans chacun de ses trois bureaux. L'entreprise veut centraliser les fichiers dans Azure Files. Les utilisateurs doivent continuer d'ouvrir les fichiers depuis le serveur de leur bureau, et une modification effectuée dans un bureau doit apparaître dans les autres bureaux.

    Quel service devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure File Sync", fr: "Azure File Sync" }
    - id: b
      text: { en: "Azure Migrate", fr: "Azure Migrate" }
    - id: c
      text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" }
    - id: d
      text: { en: "AzCopy", fr: "AzCopy" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure File Sync centralizes file shares in Azure Files and keeps Windows file servers synchronized with them in both directions. Each office keeps a local server, and the changes made on one server reach the others through the Azure file share.
    fr: Azure File Sync centralise les partages de fichiers dans Azure Files et garde des serveurs de fichiers Windows synchronisés avec eux dans les deux sens. Chaque bureau conserve un serveur local, et les modifications effectuées sur un serveur atteignent les autres par l'intermédiaire du partage de fichiers Azure.
  options:
    b:
      en: Azure Migrate is used to discover, assess and migrate servers, databases and web applications. It doesn't keep file servers synchronized.
      fr: Azure Migrate sert à découvrir, évaluer et migrer des serveurs, des bases de données et des applications web. Il ne garde pas des serveurs de fichiers synchronisés.
    c:
      en: Azure Storage Explorer is a graphical application for managing data manually. It doesn't synchronize servers continuously.
      fr: L'Explorateur Stockage Azure est une application graphique pour gérer des données manuellement. Il ne synchronise pas des serveurs en continu.
    d:
      en: AzCopy copies or synchronizes data in one direction, from a source to a destination, each time it is run. It doesn't keep several servers continuously synchronized.
      fr: AzCopy copie ou synchronise des données dans un seul sens, d'une source vers une destination, à chaque exécution. Il ne garde pas plusieurs serveurs synchronisés en continu.
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
