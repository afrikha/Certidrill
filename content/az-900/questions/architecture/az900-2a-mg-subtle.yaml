id: az900-2a-mg-subtle
objective: "2.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum organizes the subscriptions of its Microsoft Entra tenant by using management groups.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum organise les abonnements de son locataire Microsoft Entra à l'aide de groupes d'administration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A resource group can be placed directly in a management group, without a subscription."
        fr: "Un groupe de ressources peut être placé directement dans un groupe d'administration, sans abonnement."
    - id: s2
      text:
        en: "A new subscription is placed in the root management group by default."
        fr: "Un nouvel abonnement est placé par défaut dans le groupe d'administration racine."
    - id: s3
      text:
        en: "The tenant can have two separate management group hierarchies, each with its own root."
        fr: "Le locataire peut avoir deux hiérarchies de groupes d'administration distinctes, chacune avec sa propre racine."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A management group contains only subscriptions and other management groups; a resource group always belongs to a subscription. When a subscription is created, it is attached to the root management group until it is moved. All the management groups and subscriptions of a directory form a single hierarchy under one root.
    fr: |
      Un groupe d'administration ne contient que des abonnements et d'autres groupes d'administration ; un groupe de ressources appartient toujours à un abonnement. Lorsqu'un abonnement est créé, il est rattaché au groupe d'administration racine jusqu'à ce qu'il soit déplacé. Tous les groupes d'administration et abonnements d'un annuaire forment une seule hiérarchie sous une racine unique.
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
