id: az900-2b-vmopt-update-domains
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deploy the three virtual machines of an application to an availability set.

    What ensures that planned maintenance of the Azure platform doesn't restart the three virtual machines at the same time?
  fr: |
    Vous déployez les trois machines virtuelles d'une application dans un groupe à haute disponibilité.

    Qu'est-ce qui garantit qu'une maintenance planifiée de la plateforme Azure ne redémarre pas les trois machines virtuelles en même temps ?
body:
  options:
    - { id: a, text: { en: "Fault domains", fr: "Les domaines d'erreur" } }
    - { id: b, text: { en: "Update domains", fr: "Les domaines de mise à jour" } }
    - { id: c, text: { en: "Availability zones", fr: "Les zones de disponibilité" } }
    - { id: d, text: { en: "Region pairs", fr: "Les paires de régions" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An availability set spreads its virtual machines across update domains, which are groups of machines that can be restarted together during planned maintenance. Only one update domain is restarted at a time, so the machines placed in the other update domains keep running."
    fr: "Un groupe à haute disponibilité répartit ses machines virtuelles sur des domaines de mise à jour, c'est-à-dire des groupes de machines qui peuvent être redémarrées ensemble pendant une maintenance planifiée. Un seul domaine de mise à jour est redémarré à la fois : les machines placées dans les autres domaines de mise à jour restent en service."
  options:
    a: { en: "Fault domains group the machines that share a power source and a network switch; they protect against hardware failures, not against maintenance restarts.", fr: "Les domaines d'erreur regroupent les machines qui partagent une alimentation et un commutateur réseau ; ils protègent des pannes matérielles, pas des redémarrages de maintenance." }
    c: { en: "Availability zones are separate locations inside a region; they aren't a component of an availability set.", fr: "Les zones de disponibilité sont des emplacements distincts dans une région ; elles ne sont pas un composant d'un groupe à haute disponibilité." }
    d: { en: "Region pairs concern disasters and updates at the scale of regions, not the machines of an availability set.", fr: "Les paires de régions concernent les sinistres et les mises à jour à l'échelle des régions, pas les machines d'un groupe à haute disponibilité." }
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
  - title: "Availability sets overview"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
