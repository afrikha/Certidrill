id: az900-2b-compute-yn-functions
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Azure Functions scales automatically based on demand.", fr: "Azure Functions se met à l'échelle automatiquement en fonction de la demande." } }
    - { id: s2, text: { en: "A function can be triggered by an event such as a REST request, a timer or a message from another Azure service.", fr: "Une fonction peut être déclenchée par un événement tel qu'une requête REST, un minuteur ou un message provenant d'un autre service Azure." } }
    - { id: s3, text: { en: "Before you run a function, you must deploy a virtual machine to host it.", fr: "Avant d'exécuter une fonction, vous devez déployer une machine virtuelle pour l'héberger." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Azure Functions is an event-driven, serverless compute option: a REST request, a timer or a message from another service wakes the function, and the platform scales automatically with demand. There is no virtual machine or container for you to deploy or maintain."
    fr: "Azure Functions est une option de calcul serverless pilotée par les événements : une requête REST, un minuteur ou un message d'un autre service réveille la fonction, et la plateforme se met à l'échelle automatiquement selon la demande. Vous n'avez aucune machine virtuelle ni aucun conteneur à déployer ou à maintenir."
references:
  - title: "Describe Azure functions"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
  - title: "What is Azure Functions?"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
