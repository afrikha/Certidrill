id: az900-2d-zt-model
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which security model assumes a breach at the outset and verifies each request as though it came from an uncontrolled network?
  fr: |
    Quel modèle de sécurité suppose d'emblée une violation et vérifie chaque requête comme si elle provenait d'un réseau non contrôlé ?
body:
  options:
    - id: a
      text: { en: "Defense in depth", fr: "La défense en profondeur" }
    - id: b
      text: { en: "Zero Trust", fr: "La Confiance Zéro" }
    - id: c
      text: { en: "Shared responsibility", fr: "La responsabilité partagée" }
    - id: d
      text: { en: "Perimeter-based security", fr: "La sécurité fondée sur le périmètre" }
answer: { optionId: b }
explanation:
  correct:
    en: "Zero Trust is a security model that assumes the worst case and protects resources accordingly. It assumes a breach from the start and verifies every request as if it originated from an uncontrolled network, wherever the request really comes from."
    fr: "La Confiance Zéro est un modèle de sécurité qui suppose le pire scénario et protège les ressources en conséquence. Elle suppose une violation dès le départ et vérifie chaque requête comme si elle provenait d'un réseau non contrôlé, d'où qu'elle vienne réellement."
  options:
    a:
      en: "Defense in depth stacks several layers of protection around data so that a breached layer is backed by the next; it does not define how each request is verified."
      fr: "La défense en profondeur empile plusieurs couches de protection autour des données pour qu'une couche franchie soit relayée par la suivante ; elle ne définit pas la façon de vérifier chaque requête."
    c:
      en: "Shared responsibility describes which security tasks belong to the cloud provider and which belong to the customer."
      fr: "La responsabilité partagée décrit quelles tâches de sécurité reviennent au fournisseur de cloud et lesquelles reviennent au client."
    d:
      en: "Perimeter-based security is the traditional model that Zero Trust replaces: what is inside the corporate network is assumed to be safe."
      fr: "La sécurité fondée sur le périmètre est le modèle traditionnel que la Confiance Zéro remplace : ce qui se trouve dans le réseau de l'entreprise est supposé sûr."
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
