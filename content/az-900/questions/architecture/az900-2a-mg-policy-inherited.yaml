id: az900-2a-mg-policy-inherited
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders assigns to a management group named **MG-Prod** an Azure Policy that denies the creation of virtual machines outside the West Europe region. A subscription named **Sub1** is in MG-Prod.

    A user who has the Owner role on Sub1 tries to create a virtual machine in the East US region in Sub1.

    What is the result?
  fr: |
    Northwind Traders attribue à un groupe d'administration nommé **MG-Prod** une stratégie Azure Policy qui refuse la création de machines virtuelles en dehors de la région West Europe. Un abonnement nommé **Sub1** se trouve dans MG-Prod.

    Un utilisateur qui a le rôle Owner sur Sub1 tente de créer dans Sub1 une machine virtuelle dans la région East US.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "The creation succeeds, because the owner of a subscription can override the policies of a management group", fr: "La création réussit, car le propriétaire d'un abonnement peut passer outre les stratégies d'un groupe d'administration" }
    - id: b
      text: { en: "The creation succeeds, because a policy assigned to a management group does not apply to subscriptions", fr: "La création réussit, car une stratégie attribuée à un groupe d'administration ne s'applique pas aux abonnements" }
    - id: c
      text: { en: "The creation is denied, because Sub1 inherits the policy that is assigned to MG-Prod", fr: "La création est refusée, car Sub1 hérite de la stratégie attribuée à MG-Prod" }
    - id: d
      text: { en: "The creation is denied only if the same policy is also assigned directly to Sub1", fr: "La création n'est refusée que si la même stratégie est aussi attribuée directement à Sub1" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A policy assigned to a management group is inherited by all the subscriptions under it and applies to their resources. The owner of a resource or of a subscription cannot alter it, so the virtual machine cannot be created outside West Europe.
    fr: |
      Une stratégie attribuée à un groupe d'administration est héritée par tous les abonnements situés en dessous et s'applique à leurs ressources. Le propriétaire d'une ressource ou d'un abonnement ne peut pas la modifier : la machine virtuelle ne peut donc pas être créée en dehors de West Europe.
  options:
    a: { en: "The Owner role on a subscription does not allow a user to bypass a policy inherited from a higher scope.", fr: "Le rôle Owner sur un abonnement ne permet pas à un utilisateur de contourner une stratégie héritée d'une étendue supérieure." }
    b: { en: "The purpose of assigning a policy to a management group is precisely to have its subscriptions inherit it.", fr: "Attribuer une stratégie à un groupe d'administration sert précisément à ce que ses abonnements en héritent." }
    d: { en: "Inheritance makes a second assignment on the subscription unnecessary.", fr: "L'héritage rend inutile une deuxième attribution sur l'abonnement." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
