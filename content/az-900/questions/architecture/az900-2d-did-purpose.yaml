id: az900-2d-did-purpose
objective: "2.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the defense-in-depth model?
  fr: |
    Quelle affirmation décrit le modèle de défense en profondeur ?
body:
  options:
    - id: a
      text: { en: "A division of the security tasks between the cloud provider and the customer", fr: "Une répartition des tâches de sécurité entre le fournisseur de cloud et le client" }
    - id: b
      text: { en: "A single perimeter firewall that inspects all the traffic of the organization", fr: "Un pare-feu de périmètre unique qui inspecte tout le trafic de l'organisation" }
    - id: c
      text: { en: "A series of protection layers, so that an attack that breaches one layer is slowed by the next", fr: "Une série de couches de protection, de sorte qu'une attaque qui franchit une couche soit ralentie par la suivante" }
    - id: d
      text: { en: "A rule that denies every access request until an administrator approves it manually", fr: "Une règle qui refuse toute demande d'accès tant qu'un administrateur ne l'a pas approuvée manuellement" }
answer: { optionId: c }
explanation:
  correct:
    en: "Defense in depth uses a series of mechanisms, arranged in layers around the data, to slow down an attack that aims at unauthorized access to information. Each layer protects the one inside it, so the model never relies on a single protection."
    fr: "La défense en profondeur utilise une série de mécanismes, disposés en couches autour des données, pour ralentir une attaque qui vise un accès non autorisé à l'information. Chaque couche protège celle qui se trouve à l'intérieur : le modèle ne repose jamais sur une protection unique."
  options:
    a:
      en: "This is the shared responsibility model, which says who secures what in the cloud."
      fr: "Il s'agit du modèle de responsabilité partagée, qui indique qui sécurise quoi dans le cloud."
    b:
      en: "A single protection is the opposite of defense in depth, which removes the reliance on any one layer."
      fr: "Une protection unique est l'inverse de la défense en profondeur, qui supprime la dépendance à une seule couche."
    d:
      en: "Manual approval of every request is not a security model of Azure, and it is not what defense in depth means."
      fr: "L'approbation manuelle de chaque demande n'est pas un modèle de sécurité d'Azure, et ce n'est pas le sens de la défense en profondeur."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
