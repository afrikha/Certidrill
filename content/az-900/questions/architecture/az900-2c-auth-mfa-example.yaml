id: az900-2c-auth-mfa-example
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which sign-in is an example of multifactor authentication?
  fr: |
    Quelle connexion est un exemple d'authentification multifacteur ?
body:
  options:
    - id: a
      text: { en: "A password, followed by the answer to a security question", fr: "Un mot de passe, suivi de la réponse à une question de sécurité" }
    - id: b
      text: { en: "A password, followed by a second password", fr: "Un mot de passe, suivi d'un deuxième mot de passe" }
    - id: c
      text: { en: "A user name, followed by a password", fr: "Un nom d'utilisateur, suivi d'un mot de passe" }
    - id: d
      text: { en: "A password, followed by a notification approved on a phone", fr: "Un mot de passe, suivi d'une notification approuvée sur un téléphone" }
answer: { optionId: d }
explanation:
  correct:
    en: Multifactor authentication requires proofs from at least two different categories. A password is something the user knows, and the phone that receives the notification is something the user has. A stolen password alone is then not enough to sign in.
    fr: L'authentification multifacteur exige des preuves d'au moins deux catégories différentes. Un mot de passe est quelque chose que l'utilisateur sait, et le téléphone qui reçoit la notification est quelque chose qu'il possède. Un mot de passe volé ne suffit alors plus pour se connecter.
  options:
    a:
      en: A password and the answer to a security question are both things the user knows. They belong to the same category.
      fr: Un mot de passe et la réponse à une question de sécurité sont tous deux des choses que l'utilisateur sait. Ils appartiennent à la même catégorie.
    b:
      en: Two passwords are two proofs of the same category, something the user knows.
      fr: Deux mots de passe sont deux preuves de la même catégorie, quelque chose que l'utilisateur sait.
    c:
      en: A user name identifies the account but proves nothing. The password is then the only factor.
      fr: Un nom d'utilisateur identifie le compte mais ne prouve rien. Le mot de passe est alors le seul facteur.
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
