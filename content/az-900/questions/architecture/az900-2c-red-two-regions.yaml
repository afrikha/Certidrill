id: az900-2c-red-two-regions
objective: "2.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two redundancy options copy the data of a storage account to a second Azure region?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux options de redondance qui copient les données d'un compte de stockage dans une deuxième région Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
    - { id: b, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
    - { id: c, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
    - { id: d, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: GRS and GZRS both replicate the data to a secondary region, which protects it against a regional outage. They differ in the primary region, where GRS keeps the copies in one datacenter and GZRS spreads them across availability zones.
    fr: GRS et GZRS répliquent tous deux les données dans une région secondaire, ce qui les protège contre une panne régionale. Ils diffèrent dans la région primaire, où GRS conserve les copies dans un seul centre de données et GZRS les répartit entre des zones de disponibilité.
  options:
    b: { en: "LRS keeps all the copies in a single datacenter of the primary region.", fr: "LRS conserve toutes les copies dans un seul centre de données de la région primaire." }
    c: { en: "ZRS keeps the copies in several availability zones, all in the primary region.", fr: "ZRS conserve les copies dans plusieurs zones de disponibilité, toutes dans la région primaire." }
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
