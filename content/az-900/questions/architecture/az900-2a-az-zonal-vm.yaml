id: az900-2a-az-zonal-vm
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs an application on a single virtual machine that is pinned to zone 1 of the East US region.

    Woodgrove Bank needs the application to stay available if zone 1 fails.

    What should Woodgrove Bank do?
  fr: |
    Woodgrove Bank exécute une application sur une seule machine virtuelle, épinglée à la zone 1 de la région East US.

    Woodgrove Bank a besoin que l'application reste disponible si la zone 1 tombe en panne.

    Que doit faire Woodgrove Bank ?
body:
  options:
    - id: a
      text: { en: "Deploy a second virtual machine to zone 1 of East US", fr: "Déployer une deuxième machine virtuelle dans la zone 1 de East US" }
    - id: b
      text: { en: "Move the virtual machine to another resource group", fr: "Déplacer la machine virtuelle vers un autre groupe de ressources" }
    - id: c
      text: { en: "Deploy a second virtual machine to another zone of East US", fr: "Déployer une deuxième machine virtuelle dans une autre zone de East US" }
    - id: d
      text: { en: "Resize the virtual machine to a larger size in zone 1", fr: "Redimensionner la machine virtuelle vers une taille supérieure dans la zone 1" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A virtual machine is a zonal resource: it runs in the single zone it is pinned to, and Azure does not replicate it to the other zones. To survive the loss of a zone, you run instances of the application in at least two zones of the region.
    fr: |
      Une machine virtuelle est une ressource zonale : elle s'exécute dans la seule zone à laquelle elle est épinglée, et Azure ne la réplique pas dans les autres zones. Pour résister à la perte d'une zone, vous exécutez des instances de l'application dans au moins deux zones de la région.
  options:
    a: { en: "Two virtual machines in the same zone are both lost if that zone fails.", fr: "Deux machines virtuelles situées dans la même zone sont toutes deux perdues si cette zone tombe en panne." }
    b: { en: "A resource group is a logical container; moving the virtual machine to another one does not change where it runs.", fr: "Un groupe de ressources est un conteneur logique ; y déplacer la machine virtuelle ne change pas l'endroit où elle s'exécute." }
    d: { en: "A larger size adds capacity (vertical scaling) but the virtual machine still depends on zone 1.", fr: "Une taille supérieure ajoute de la capacité (mise à l'échelle verticale), mais la machine virtuelle dépend toujours de la zone 1." }
references:
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
