id: az900-2c-auth-sso
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The employees of Tailspin Toys use twelve cloud applications from different vendors. The company wants employees to sign in once and then open all the applications without entering credentials again.

    What should the company implement?
  fr: |
    Les employés de Tailspin Toys utilisent douze applications cloud de fournisseurs différents. L'entreprise veut que les employés se connectent une seule fois, puis ouvrent toutes les applications sans saisir de nouveau leurs informations d'identification.

    Que doit mettre en place l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Multifactor authentication (MFA)", fr: "L'authentification multifacteur (MFA)" }
    - id: b
      text: { en: "Single sign-on (SSO)", fr: "L'authentification unique (SSO)" }
    - id: c
      text: { en: "Passwordless authentication", fr: "L'authentification sans mot de passe" }
    - id: d
      text: { en: "Self-service password reset (SSPR)", fr: "La réinitialisation de mot de passe en libre-service (SSPR)" }
answer: { optionId: b }
explanation:
  correct:
    en: Single sign-on lets a user sign in one time and then access several applications, even from different providers, with the same identity. Users have fewer passwords to remember, and access is granted or removed in one place.
    fr: L'authentification unique permet à un utilisateur de se connecter une fois, puis d'accéder à plusieurs applications, même de fournisseurs différents, avec la même identité. Les utilisateurs ont moins de mots de passe à retenir, et l'accès s'accorde ou se retire à un seul endroit.
  options:
    a:
      en: Multifactor authentication asks for an additional proof of identity at sign-in. It doesn't remove the repeated sign-ins to each application.
      fr: L'authentification multifacteur demande une preuve d'identité supplémentaire à la connexion. Elle ne supprime pas les connexions répétées à chaque application.
    c:
      en: Passwordless authentication replaces the password with another method. On its own, it doesn't carry one sign-in over to several applications.
      fr: L'authentification sans mot de passe remplace le mot de passe par une autre méthode. À elle seule, elle ne propage pas une connexion à plusieurs applications.
    d:
      en: Self-service password reset lets users reset a forgotten password. It doesn't reduce the number of sign-ins.
      fr: La réinitialisation de mot de passe en libre-service permet aux utilisateurs de réinitialiser un mot de passe oublié. Elle ne réduit pas le nombre de connexions.
references:
  - title: What is single sign-on in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on
  - title: Describe Azure authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods
