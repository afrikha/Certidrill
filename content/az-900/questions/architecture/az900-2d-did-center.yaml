id: az900-2d-did-center
objective: "2.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the defense-in-depth model, the layers are arranged around a central layer that all the other layers protect.

    Which layer is at the center of the model?
  fr: |
    Dans le modèle de défense en profondeur, les couches sont disposées autour d'une couche centrale que toutes les autres protègent.

    Quelle couche se trouve au centre du modèle ?
body:
  options:
    - id: a
      text: { en: "Physical security", fr: "Sécurité physique" }
    - id: b
      text: { en: "Perimeter", fr: "Périmètre" }
    - id: c
      text: { en: "Application", fr: "Application" }
    - id: d
      text: { en: "Data", fr: "Données" }
answer: { optionId: d }
explanation:
  correct:
    en: "The data to secure is at the center of defense in depth, because data is what attackers are after in almost every case. From the outside in, the layers are physical security, identity and access, perimeter, network, compute, application and data."
    fr: "Les données à sécuriser sont au centre de la défense en profondeur, car ce sont elles que les attaquants recherchent dans presque tous les cas. De l'extérieur vers l'intérieur, les couches sont : sécurité physique, identité et accès, périmètre, réseau, calcul, application et données."
  options:
    a:
      en: "Physical security is the outermost layer, the first line of defense."
      fr: "La sécurité physique est la couche la plus externe, la première ligne de défense."
    b:
      en: "The perimeter is an outer layer that stops network-based attacks before they reach the internal network."
      fr: "Le périmètre est une couche externe qui arrête les attaques réseau avant qu'elles n'atteignent le réseau interne."
    c:
      en: "The application layer is the last layer before the data, not the center itself."
      fr: "La couche application est la dernière couche avant les données, pas le centre lui-même."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
