id: az900-2a-hier-move-subscription
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has two management groups named **MG-Dev** and **MG-Prod**. A policy named Policy1 is assigned to MG-Prod only.

    Proseware moves a subscription named **Sub1** from MG-Dev to MG-Prod.

    What is the effect on Sub1?
  fr: |
    Proseware dispose de deux groupes d'administration nommés **MG-Dev** et **MG-Prod**. Une stratégie nommée Policy1 est attribuée à MG-Prod uniquement.

    Proseware déplace un abonnement nommé **Sub1** de MG-Dev vers MG-Prod.

    Quel est l'effet sur Sub1 ?
body:
  options:
    - id: a
      text: { en: "Policy1 applies to Sub1 only after it is also assigned to Sub1", fr: "Policy1 ne s'applique à Sub1 qu'après avoir aussi été attribuée à Sub1" }
    - id: b
      text: { en: "Policy1 applies only to the resource groups created in Sub1 after the move", fr: "Policy1 ne s'applique qu'aux groupes de ressources créés dans Sub1 après le déplacement" }
    - id: c
      text: { en: "Sub1 keeps MG-Dev as a second parent and Policy1 does not apply to it", fr: "Sub1 conserve MG-Dev comme deuxième parent et Policy1 ne s'y applique pas" }
    - id: d
      text: { en: "Policy1 applies to Sub1 and to all its resource groups and resources", fr: "Policy1 s'applique à Sub1 ainsi qu'à tous ses groupes de ressources et ressources" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A subscription has a single parent and inherits what is assigned to it. Once Sub1 is under MG-Prod, Policy1 is inherited by Sub1 and flows down to every resource group and resource of Sub1, with no further assignment.
    fr: |
      Un abonnement a un seul parent et hérite de ce qui est attribué à celui-ci. Une fois Sub1 placé sous MG-Prod, Policy1 est héritée par Sub1 et descend vers tous les groupes de ressources et toutes les ressources de Sub1, sans autre attribution.
  options:
    a: { en: "Inheritance from the management group makes a direct assignment on Sub1 unnecessary.", fr: "L'héritage depuis le groupe d'administration rend inutile une attribution directe sur Sub1." }
    b: { en: "Inheritance covers everything under the subscription, including the resource groups that already existed.", fr: "L'héritage couvre tout ce qui se trouve sous l'abonnement, y compris les groupes de ressources qui existaient déjà." }
    c: { en: "A subscription has only one parent: after the move, its parent is MG-Prod.", fr: "Un abonnement n'a qu'un seul parent : après le déplacement, son parent est MG-Prod." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
