id: az900-2a-dc-basics
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure datacenters, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les centres de données Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An Azure region can contain more than one datacenter."
        fr: "Une région Azure peut contenir plusieurs centres de données."
    - id: s2
      text:
        en: "An availability zone is made up of one or more datacenters."
        fr: "Une zone de disponibilité se compose d'un ou plusieurs centres de données."
    - id: s3
      text:
        en: "When you create a virtual machine, you select the datacenter that hosts it."
        fr: "Lorsque vous créez une machine virtuelle, vous sélectionnez le centre de données qui l'héberge."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A region contains at least one datacenter and often several, close to each other. An availability zone groups one or more of these datacenters. When you deploy a resource you choose a region, and for some resources a zone, but never an individual datacenter.
    fr: |
      Une région contient au moins un centre de données et souvent plusieurs, proches les uns des autres. Une zone de disponibilité regroupe un ou plusieurs de ces centres de données. Lorsque vous déployez une ressource, vous choisissez une région et, pour certaines ressources, une zone, mais jamais un centre de données en particulier.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
