id: az900-2a-dc-region-network
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How are the datacenters of one Azure region connected to each other?
  fr: |
    Comment les centres de données d'une même région Azure sont-ils reliés entre eux ?
body:
  options:
    - id: a
      text: { en: "By a low-latency network that is part of the region", fr: "Par un réseau à faible latence qui fait partie de la région" }
    - id: b
      text: { en: "By VPN gateways that customers deploy in each datacenter", fr: "Par des passerelles VPN que les clients déploient dans chaque centre de données" }
    - id: c
      text: { en: "By ExpressRoute circuits that customers order for the region", fr: "Par des circuits ExpressRoute que les clients commandent pour la région" }
    - id: d
      text: { en: "By the public internet, over encrypted connections", fr: "Par l'Internet public, au moyen de connexions chiffrées" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A region is a set of nearby datacenters that are networked together with a low-latency network. This network belongs to the Azure infrastructure: customers have nothing to deploy to link the datacenters of a region.
    fr: |
      Une région est un ensemble de centres de données proches, interconnectés par un réseau à faible latence. Ce réseau appartient à l'infrastructure Azure : les clients n'ont rien à déployer pour relier les centres de données d'une région.
  options:
    b: { en: "A VPN gateway connects a customer's network to an Azure virtual network; it does not link Azure datacenters.", fr: "Une passerelle VPN relie le réseau d'un client à un réseau virtuel Azure ; elle ne relie pas les centres de données Azure." }
    c: { en: "ExpressRoute is a private connection between a customer's site and Azure, not between Azure datacenters.", fr: "ExpressRoute est une connexion privée entre le site d'un client et Azure, pas entre les centres de données Azure." }
    d: { en: "Traffic between the datacenters of a region uses Microsoft's own network, not the public internet.", fr: "Le trafic entre les centres de données d'une région emprunte le réseau de Microsoft, pas l'Internet public." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are Azure regions?
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-overview
