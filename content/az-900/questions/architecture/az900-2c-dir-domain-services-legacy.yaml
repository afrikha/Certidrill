id: az900-2c-dir-domain-services-legacy
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank moves a legacy application to Azure virtual machines. The application authenticates users with LDAP and Kerberos and can't be changed. The bank doesn't want to deploy or patch domain controllers.

    Which service should you use?
  fr: |
    Woodgrove Bank déplace une application ancienne vers des machines virtuelles Azure. L'application authentifie les utilisateurs avec LDAP et Kerberos et ne peut pas être modifiée. La banque ne veut ni déployer ni corriger de contrôleurs de domaine.

    Quel service devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra Connect", fr: "Microsoft Entra Connect" }
    - id: b
      text: { en: "Microsoft Entra Domain Services", fr: "Microsoft Entra Domain Services" }
    - id: c
      text: { en: "Microsoft Entra External ID", fr: "Microsoft Entra External ID" }
    - id: d
      text: { en: "Microsoft Entra Conditional Access", fr: "Accès conditionnel Microsoft Entra" }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft Entra Domain Services provides managed domain services, namely domain join, Group Policy, LDAP and Kerberos or NTLM authentication. Microsoft deploys and maintains the domain controllers, so a legacy application can move to Azure without being rewritten.
    fr: Microsoft Entra Domain Services fournit des services de domaine managés, à savoir la jonction de domaine, la stratégie de groupe, LDAP et l'authentification Kerberos ou NTLM. Microsoft déploie et maintient les contrôleurs de domaine, une application ancienne peut donc passer dans Azure sans être réécrite.
  options:
    a:
      en: Microsoft Entra Connect synchronizes on-premises identities with Microsoft Entra ID. It doesn't offer LDAP or Kerberos to applications.
      fr: Microsoft Entra Connect synchronise les identités locales avec Microsoft Entra ID. Il n'offre ni LDAP ni Kerberos aux applications.
    c:
      en: Microsoft Entra External ID gives access to partners, guests and customers. It isn't a domain service.
      fr: Microsoft Entra External ID donne accès à des partenaires, des invités et des clients. Ce n'est pas un service de domaine.
    d:
      en: Conditional Access allows or blocks a sign-in according to signals such as the user, the location or the device. It doesn't provide domain services.
      fr: L'accès conditionnel autorise ou bloque une connexion selon des signaux tels que l'utilisateur, l'emplacement ou l'appareil. Il ne fournit pas de services de domaine.
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
