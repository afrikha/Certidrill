id: az900-2a-mg-root
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is at the top of the management group hierarchy of a Microsoft Entra tenant?
  fr: |
    Que trouve-t-on au sommet de la hiérarchie des groupes d'administration d'un locataire Microsoft Entra ?
body:
  options:
    - id: a
      text: { en: "The first subscription that was created in the tenant", fr: "Le premier abonnement créé dans le locataire" }
    - id: b
      text: { en: "One root management group for each subscription", fr: "Un groupe d'administration racine pour chaque abonnement" }
    - id: c
      text: { en: "A single root management group for the whole tenant", fr: "Un seul groupe d'administration racine pour tout le locataire" }
    - id: d
      text: { en: "One root management group for each Azure region", fr: "Un groupe d'administration racine pour chaque région Azure" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each tenant has one top-level management group, the root management group, displayed by default as Tenant Root Group. All the other management groups and all the subscriptions of the tenant fold up to it, which makes it possible to apply a rule to the whole tenant.
    fr: |
      Chaque locataire possède un seul groupe d'administration de niveau supérieur, le groupe d'administration racine, affiché par défaut sous le nom Tenant Root Group (Groupe racine du locataire). Tous les autres groupes d'administration et tous les abonnements du locataire s'y rattachent, ce qui permet d'appliquer une règle à l'ensemble du locataire.
  options:
    a: { en: "A subscription is always below a management group in the hierarchy.", fr: "Un abonnement se trouve toujours sous un groupe d'administration dans la hiérarchie." }
    b: { en: "There is one root for the tenant, shared by all its subscriptions.", fr: "Il existe une seule racine pour le locataire, commune à tous ses abonnements." }
    d: { en: "Management groups are not tied to regions.", fr: "Les groupes d'administration ne sont pas liés aux régions." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
