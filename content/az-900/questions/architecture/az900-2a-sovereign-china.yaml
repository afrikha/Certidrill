id: az900-2a-sovereign-china
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to deploy resources to the China North region.

    Who operates the Azure datacenters of this region?
  fr: |
    Fabrikam prévoit de déployer des ressources dans la région China North.

    Qui exploite les centres de données Azure de cette région ?
body:
  options:
    - id: a
      text: { en: "Microsoft, as in the other Azure regions", fr: "Microsoft, comme dans les autres régions Azure" }
    - id: b
      text: { en: "Screened US personnel of Azure Government", fr: "Le personnel américain habilité d'Azure Government" }
    - id: c
      text: { en: "A local hosting provider that Fabrikam selects", fr: "Un hébergeur local que Fabrikam sélectionne" }
    - id: d
      text: { en: "21Vianet, under a partnership with Microsoft", fr: "21Vianet, dans le cadre d'un partenariat avec Microsoft" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Azure regions in China, such as China East and China North, are sovereign regions: a physically separated instance of Azure located in China. They are available through a partnership between Microsoft and 21Vianet, and 21Vianet operates the datacenters.
    fr: |
      Les régions Azure en Chine, comme China East et China North, sont des régions souveraines : une instance d'Azure physiquement séparée et située en Chine. Elles sont proposées dans le cadre d'un partenariat entre Microsoft et 21Vianet, et c'est 21Vianet qui exploite les centres de données.
  options:
    a: { en: "Microsoft does not directly maintain the datacenters of the China regions.", fr: "Microsoft ne gère pas directement les centres de données des régions de Chine." }
    b: { en: "Screened US personnel operate the US government regions, not the China regions.", fr: "Le personnel américain habilité exploite les régions du gouvernement américain, pas les régions de Chine." }
    c: { en: "Customers never choose the operator of an Azure region.", fr: "Les clients ne choisissent jamais l'exploitant d'une région Azure." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: Microsoft Azure operated by 21Vianet
    url: https://learn.microsoft.com/en-us/azure/china/overview-operations
