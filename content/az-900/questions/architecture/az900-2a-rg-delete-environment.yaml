id: az900-2a-rg-delete-environment
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso creates a test environment made of virtual machines, a virtual network and a storage account. All these resources are in a resource group named **RG-Test**, which contains nothing else. The same subscription also hosts production resources in other resource groups.

    When the tests are over, Contoso needs to remove all the test resources in a single operation.

    What should Contoso do?
  fr: |
    Contoso crée un environnement de test composé de machines virtuelles, d'un réseau virtuel et d'un compte de stockage. Toutes ces ressources se trouvent dans un groupe de ressources nommé **RG-Test**, qui ne contient rien d'autre. Le même abonnement héberge aussi des ressources de production dans d'autres groupes de ressources.

    À la fin des tests, Contoso doit supprimer toutes les ressources de test en une seule opération.

    Que doit faire Contoso ?
body:
  options:
    - id: a
      text: { en: "Remove the tags applied to RG-Test", fr: "Retirer les étiquettes appliquées à RG-Test" }
    - id: b
      text: { en: "Delete the resource group RG-Test", fr: "Supprimer le groupe de ressources RG-Test" }
    - id: c
      text: { en: "Move the test resources to another resource group", fr: "Déplacer les ressources de test vers un autre groupe de ressources" }
    - id: d
      text: { en: "Cancel the subscription that contains RG-Test", fr: "Annuler l'abonnement qui contient RG-Test" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An action applied to a resource group applies to everything it contains: deleting the group deletes all its resources. Because RG-Test holds only the test environment, one deletion removes it without touching the production resource groups.
    fr: |
      Une action appliquée à un groupe de ressources s'applique à tout ce qu'il contient : supprimer le groupe supprime toutes ses ressources. Comme RG-Test ne contient que l'environnement de test, une seule suppression le retire sans toucher aux groupes de ressources de production.
  options:
    a: { en: "Tags are metadata; removing them deletes nothing.", fr: "Les étiquettes sont des métadonnées ; les retirer ne supprime rien." }
    c: { en: "Moving resources changes their resource group but keeps them running.", fr: "Déplacer des ressources change leur groupe de ressources, mais elles continuent de fonctionner." }
    d: { en: "Canceling the subscription would also affect the production resources that it hosts.", fr: "Annuler l'abonnement toucherait aussi les ressources de production qu'il héberge." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
