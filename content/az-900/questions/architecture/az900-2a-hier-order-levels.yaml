id: az900-2a-hier-order-levels
objective: "2.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are documenting how Azure organizes resources for access and policy management.

    Which four levels form the hierarchy, from the broadest scope to the narrowest? To answer, move the appropriate levels from the list of levels to the answer area and arrange them in the correct order.
  fr: |
    Vous documentez la façon dont Azure organise les ressources pour la gestion des accès et des stratégies.

    Quels sont les quatre niveaux qui forment la hiérarchie, de l'étendue la plus large à la plus étroite ? Pour répondre, déplacez les niveaux appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rg, text: { en: "Resource groups", fr: "Groupes de ressources" } }
    - { id: region, text: { en: "Regions", fr: "Régions" } }
    - { id: mg, text: { en: "Management groups", fr: "Groupes d'administration" } }
    - { id: res, text: { en: "Resources", fr: "Ressources" } }
    - { id: az, text: { en: "Availability zones", fr: "Zones de disponibilité" } }
    - { id: sub, text: { en: "Subscriptions", fr: "Abonnements" } }
answer:
  sequence: [ mg, sub, rg, res ]
explanation:
  correct:
    en: |
      Azure has four levels of management scope. Management groups contain subscriptions, subscriptions contain resource groups, and resource groups contain resources. A setting applied at one level is inherited by the levels below it.
    fr: |
      Azure compte quatre niveaux d'étendue de gestion. Les groupes d'administration contiennent des abonnements, les abonnements contiennent des groupes de ressources, et les groupes de ressources contiennent des ressources. Un paramètre appliqué à un niveau est hérité par les niveaux situés en dessous.
  options:
    region: { en: "A region is part of the physical infrastructure (where a resource runs), not a level of the management hierarchy.", fr: "Une région fait partie de l'infrastructure physique (l'endroit où une ressource s'exécute) ; ce n'est pas un niveau de la hiérarchie de gestion." }
    az: { en: "Availability zones are groups of datacenters inside a region; they are not a management scope.", fr: "Les zones de disponibilité sont des groupes de centres de données à l'intérieur d'une région ; ce ne sont pas des étendues de gestion." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
