id: az900-2a-sub-boundaries
objective: "2.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure generates a separate invoice for each subscription. In this respect, a subscription is [[billing]].

      Access-management policies are applied at the subscription level. In this respect, a subscription is [[access]].
    fr: |
      Azure génère une facture distincte pour chaque abonnement. À ce titre, un abonnement est [[billing]].

      Les stratégies de gestion des accès s'appliquent au niveau de l'abonnement. À ce titre, un abonnement est [[access]].
  slots:
    - id: billing
      options:
        - { id: acc, text: { en: "an access control boundary", fr: "une limite de contrôle d'accès" } }
        - { id: bill, text: { en: "a billing boundary", fr: "une limite de facturation" } }
        - { id: resid, text: { en: "a data residency boundary", fr: "une limite de résidence des données" } }
    - id: access
      options:
        - { id: acc, text: { en: "an access control boundary", fr: "une limite de contrôle d'accès" } }
        - { id: bill, text: { en: "a billing boundary", fr: "une limite de facturation" } }
        - { id: resid, text: { en: "a data residency boundary", fr: "une limite de résidence des données" } }
answer:
  values: { billing: bill, access: acc }
explanation:
  correct:
    en: |
      A subscription has two boundaries. As a billing boundary, it gets its own billing report and invoice. As an access control boundary, it receives access-management policies of its own, so two subscriptions can follow different rules. A data residency boundary is a geography, which belongs to the physical infrastructure.
    fr: |
      Un abonnement présente deux limites. En tant que limite de facturation, il reçoit son propre rapport de facturation et sa propre facture. En tant que limite de contrôle d'accès, il reçoit ses propres stratégies de gestion des accès : deux abonnements peuvent donc suivre des règles différentes. Une limite de résidence des données est une zone géographique, qui relève de l'infrastructure physique.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
