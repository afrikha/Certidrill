id: az900-2b-vmres-multi-internet
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a virtual machine that will host a public website. Users on the internet must reach the website over HTTPS.

    Which two items should you include when you create the virtual machine? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer une machine virtuelle qui hébergera un site web public. Les utilisateurs sur internet doivent atteindre le site en HTTPS.

    Quels sont les deux éléments à inclure lorsque vous créez la machine virtuelle ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A data disk", fr: "Un disque de données" } }
    - { id: b, text: { en: "A public IP address", fr: "Une adresse IP publique" } }
    - { id: c, text: { en: "An ExpressRoute circuit", fr: "Un circuit ExpressRoute" } }
    - { id: d, text: { en: "An inbound port rule that allows HTTPS", fr: "Une règle de port d'entrée qui autorise HTTPS" } }
    - { id: e, text: { en: "A point-to-site VPN connection", fr: "Une connexion VPN de point à site" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The networking of a virtual machine consists of a virtual network, an optional public IP address and the port configuration. To accept connections from the internet, the machine needs a public IP address, and the HTTPS port must be opened for inbound traffic."
    fr: "Le réseau d'une machine virtuelle comprend un réseau virtuel, une adresse IP publique facultative et la configuration des ports. Pour accepter des connexions venant d'internet, la machine a besoin d'une adresse IP publique, et le port HTTPS doit être ouvert au trafic entrant."
  options:
    a: { en: "A data disk stores applications and data; it plays no role in making the website reachable.", fr: "Un disque de données stocke des applications et des données ; il ne joue aucun rôle pour rendre le site joignable." }
    c: { en: "ExpressRoute is a private connection between an on-premises network and Azure, not a way for internet users to reach a website.", fr: "ExpressRoute est une connexion privée entre un réseau local et Azure, pas un moyen pour les internautes d'atteindre un site web." }
    e: { en: "A point-to-site VPN connects one computer to the virtual network through a tunnel; public visitors don't use a VPN.", fr: "Un VPN de point à site connecte un ordinateur au réseau virtuel par un tunnel ; les visiteurs publics n'utilisent pas de VPN." }
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
