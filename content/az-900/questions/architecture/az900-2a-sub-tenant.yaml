id: az900-2a-sub-tenant
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure subscriptions, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les abonnements Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An Azure account can have several subscriptions."
        fr: "Un compte Azure peut avoir plusieurs abonnements."
    - id: s2
      text:
        en: "A subscription can trust several Microsoft Entra tenants at the same time."
        fr: "Un abonnement peut approuver plusieurs locataires Microsoft Entra en même temps."
    - id: s3
      text:
        en: "Several subscriptions can trust the same Microsoft Entra tenant."
        fr: "Plusieurs abonnements peuvent approuver le même locataire Microsoft Entra."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An account needs only one subscription but can have many. Every subscription relies on a single Microsoft Entra tenant to authenticate and authorize users, whereas one tenant can be trusted by any number of subscriptions.
    fr: |
      Un compte n'a besoin que d'un abonnement, mais peut en avoir beaucoup. Chaque abonnement s'appuie sur un seul locataire Microsoft Entra pour authentifier et autoriser les utilisateurs, tandis qu'un même locataire peut être approuvé par un nombre quelconque d'abonnements.
references:
  - title: Associate or add an Azure subscription to your Microsoft Entra tenant
    url: https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptions-associated-directory
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
