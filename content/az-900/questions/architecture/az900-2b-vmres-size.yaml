id: az900-2b-vmres-size
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    When you create an Azure virtual machine, which setting determines its number of processor cores and its amount of memory?
  fr: |
    Lorsque vous créez une machine virtuelle Azure, quel paramètre détermine son nombre de cœurs de processeur et sa quantité de mémoire ?
body:
  options:
    - { id: a, text: { en: "The image", fr: "L'image" } }
    - { id: b, text: { en: "The size", fr: "La taille" } }
    - { id: c, text: { en: "The region", fr: "La région" } }
    - { id: d, text: { en: "The resource group", fr: "Le groupe de ressources" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The size of a virtual machine determines its purpose, its number of processor cores and its amount of memory. You choose the size that matches the workload when you provision the machine."
    fr: "La taille d'une machine virtuelle détermine son usage, son nombre de cœurs de processeur et sa quantité de mémoire. Vous choisissez la taille adaptée à la charge de travail au moment de provisionner la machine."
  options:
    a: { en: "The image is a template that provides the operating system and preinstalled tools, not the processing power.", fr: "L'image est un modèle qui fournit le système d'exploitation et des outils préinstallés, pas la puissance de calcul." }
    c: { en: "The region is the location where the machine and its disks are hosted.", fr: "La région est l'emplacement où la machine et ses disques sont hébergés." }
    d: { en: "The resource group is the logical container of the machine and of its related resources.", fr: "Le groupe de ressources est le conteneur logique de la machine et de ses ressources associées." }
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
