id: az900-2d-dfc-coverage
objective: "2.4.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Cloud, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour le cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Defender for Cloud can monitor many Azure services without any additional deployment."
        fr: "Defender pour le cloud peut surveiller de nombreux services Azure sans aucun déploiement supplémentaire."
    - id: s2
      text:
        en: "Defender for Cloud can assess resources that are hosted in Amazon Web Services (AWS)."
        fr: "Defender pour le cloud peut évaluer des ressources hébergées dans Amazon Web Services (AWS)."
    - id: s3
      text:
        en: "The security recommendations of Defender for Cloud apply to virtual machines only."
        fr: "Les recommandations de sécurité de Defender pour le cloud ne concernent que les machines virtuelles."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Defender for Cloud is native to Azure, so many Azure services are monitored and protected without deploying anything. Its recommendations and protections cover far more than virtual machines: PaaS services such as App Service, Azure SQL and storage accounts, containers and networks. It also extends to other clouds, including AWS and Google Cloud."
    fr: "Defender pour le cloud est natif d'Azure : de nombreux services Azure sont surveillés et protégés sans rien déployer. Ses recommandations et ses protections couvrent bien plus que les machines virtuelles : des services PaaS tels qu'App Service, Azure SQL et les comptes de stockage, les conteneurs et les réseaux. Il s'étend aussi à d'autres clouds, dont AWS et Google Cloud."
  options:
    s3:
      en: "Recommendations are issued for many resource types, such as databases, storage accounts, containers and networks, not for virtual machines only."
      fr: "Des recommandations sont émises pour de nombreux types de ressources, comme les bases de données, les comptes de stockage, les conteneurs et les réseaux, pas seulement pour les machines virtuelles."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
