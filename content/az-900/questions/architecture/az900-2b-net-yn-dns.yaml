id: az900-2b-net-yn-dns
objective: "2.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "With Azure DNS, you manage DNS records by using the same credentials and billing as your other Azure services.", fr: "Avec Azure DNS, vous gérez les enregistrements DNS avec les mêmes informations d'identification et la même facturation que vos autres services Azure." } }
    - { id: s2, text: { en: "You can buy a domain name by using Azure DNS.", fr: "Vous pouvez acheter un nom de domaine à l'aide d'Azure DNS." } }
    - { id: s3, text: { en: "Azure DNS hosts only private domains that are used inside virtual networks.", fr: "Azure DNS héberge uniquement des domaines privés utilisés à l'intérieur de réseaux virtuels." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Azure DNS is a hosting service for DNS domains that resolves names by using Azure infrastructure; records are managed with the same credentials, tools and billing as other Azure services. It doesn't sell domain names: you buy one from App Service domains or a third-party registrar, then host it in Azure DNS. It hosts internet-facing domains and also supports private DNS domains."
    fr: "Azure DNS est un service d'hébergement de domaines DNS qui résout les noms à l'aide de l'infrastructure Azure ; les enregistrements se gèrent avec les mêmes informations d'identification, outils et facturation que les autres services Azure. Il ne vend pas de noms de domaine : vous en achetez un auprès des domaines App Service ou d'un bureau d'enregistrement tiers, puis vous l'hébergez dans Azure DNS. Il héberge des domaines exposés sur internet et prend aussi en charge les domaines DNS privés."
references:
  - title: "Describe Azure DNS"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system
  - title: "Azure DNS overview"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-overview
