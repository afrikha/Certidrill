id: az900-2a-rg-per-application
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts two applications named App1 and App2 in one subscription. Each application consists of a web app and a database.

    App1 will be deleted in three months, and App2 is permanent. The developers of App1 must be able to manage only the resources of App1.

    How should Fabrikam organize the resources?
  fr: |
    Fabrikam héberge deux applications nommées App1 et App2 dans un même abonnement. Chaque application se compose d'une application web et d'une base de données.

    App1 sera supprimée dans trois mois, et App2 est permanente. Les développeurs d'App1 doivent pouvoir gérer uniquement les ressources d'App1.

    Comment Fabrikam doit-il organiser les ressources ?
body:
  options:
    - id: a
      text: { en: "Create one resource group for the web apps and one resource group for the databases", fr: "Créer un groupe de ressources pour les applications web et un groupe de ressources pour les bases de données" }
    - id: b
      text: { en: "Place all the resources in one resource group and tag the resources of App1", fr: "Placer toutes les ressources dans un seul groupe de ressources et étiqueter les ressources d'App1" }
    - id: c
      text: { en: "Create a resource group for App2 and nest a resource group for App1 inside it", fr: "Créer un groupe de ressources pour App2 et y imbriquer un groupe de ressources pour App1" }
    - id: d
      text: { en: "Create one resource group for App1 and one resource group for App2", fr: "Créer un groupe de ressources pour App1 et un groupe de ressources pour App2" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resources that share the same lifecycle and the same access rules belong in the same resource group. With one group per application, Fabrikam grants the developers access to the App1 group only and later deletes that group to remove App1 in one operation, leaving App2 untouched.
    fr: |
      Les ressources qui partagent le même cycle de vie et les mêmes règles d'accès ont leur place dans le même groupe de ressources. Avec un groupe par application, Fabrikam donne aux développeurs un accès au seul groupe d'App1, puis supprime ce groupe pour retirer App1 en une seule opération, sans toucher à App2.
  options:
    a: { en: "Grouping by resource type mixes App1 and App2 in each group: access and deletion can no longer be handled per application.", fr: "Regrouper par type de ressource mélange App1 et App2 dans chaque groupe : l'accès et la suppression ne peuvent plus être gérés par application." }
    b: { en: "Tags help to find and report on resources, but they neither limit access nor allow a group deletion of App1 only.", fr: "Les étiquettes aident à retrouver les ressources et à produire des rapports, mais elles ne limitent pas l'accès et ne permettent pas de supprimer App1 seule en bloc." }
    c: { en: "Resource groups cannot be nested.", fr: "Les groupes de ressources ne peuvent pas être imbriqués." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
