id: az900-2c-red-lrs-lowest-cost
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys creates a storage account for test data that can be generated again at any time.

    Which redundancy option has the lowest cost?
  fr: |
    Tailspin Toys crée un compte de stockage pour des données de test qui peuvent être régénérées à tout moment.

    Quelle option de redondance a le coût le plus bas ?
body:
  options:
    - id: a
      text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" }
    - id: b
      text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" }
    - id: c
      text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" }
    - id: d
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
answer: { optionId: b }
explanation:
  correct:
    en: LRS keeps three copies of the data in a single datacenter of the primary region. It is the least expensive redundancy option and also the least durable one, which is acceptable for data that can be recreated.
    fr: LRS conserve trois copies des données dans un seul centre de données de la région primaire. C'est l'option de redondance la moins chère et aussi la moins durable, ce qui est acceptable pour des données qui peuvent être recréées.
  options:
    a:
      en: GRS also copies the data to a secondary region. This extra protection costs more than LRS.
      fr: GRS copie aussi les données dans une région secondaire. Cette protection supplémentaire coûte plus cher que LRS.
    c:
      en: RA-GRS is GRS with read access to the secondary region. It costs more than LRS.
      fr: RA-GRS correspond à GRS avec un accès en lecture à la région secondaire. Il coûte plus cher que LRS.
    d:
      en: ZRS spreads the copies across availability zones. It costs more than LRS.
      fr: ZRS répartit les copies entre des zones de disponibilité. Il coûte plus cher que LRS.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
