id: az900-2a-dc-failure-zones
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs an application on three virtual machines in one Azure region. Each virtual machine is in a different availability zone.

    A power failure takes down the datacenters of one of the zones.

    What happens to the application?
  fr: |
    Litware exécute une application sur trois machines virtuelles dans une même région Azure. Chaque machine virtuelle se trouve dans une zone de disponibilité différente.

    Une panne d'alimentation met hors service les centres de données de l'une des zones.

    Qu'arrive-t-il à l'application ?
body:
  options:
    - id: a
      text: { en: "It stops until Microsoft restores power to the failed datacenters", fr: "Elle s'arrête jusqu'à ce que Microsoft rétablisse l'alimentation des centres de données en panne" }
    - id: b
      text: { en: "It fails over automatically to the paired region", fr: "Elle bascule automatiquement vers la région jumelée" }
    - id: c
      text: { en: "It stops because the zones of a region share the same power supply", fr: "Elle s'arrête, car les zones d'une région partagent la même alimentation" }
    - id: d
      text: { en: "It keeps running on the virtual machines in the two other zones", fr: "Elle continue de fonctionner sur les machines virtuelles des deux autres zones" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The datacenters of each availability zone have independent power, cooling and networking. A power failure in one zone leaves the two other zones untouched, so the virtual machines there keep serving the application.
    fr: |
      Les centres de données de chaque zone de disponibilité disposent d'une alimentation, d'un refroidissement et d'un réseau indépendants. Une panne d'alimentation dans une zone n'atteint pas les deux autres : les machines virtuelles qui s'y trouvent continuent donc de servir l'application.
  options:
    a: { en: "Only one of the three virtual machines is affected; the two others are in zones that still work.", fr: "Une seule des trois machines virtuelles est touchée ; les deux autres sont dans des zones qui fonctionnent toujours." }
    b: { en: "The application is deployed in a single region, and virtual machines are not failed over to another region unless you set that up.", fr: "L'application est déployée dans une seule région, et les machines virtuelles ne basculent pas vers une autre région sans que vous le mettiez en place." }
    c: { en: "Zones are built so that they do not share power, cooling or networking.", fr: "Les zones sont conçues pour ne partager ni alimentation, ni refroidissement, ni réseau." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
