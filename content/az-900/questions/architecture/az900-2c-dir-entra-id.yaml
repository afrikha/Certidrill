id: az900-2c-dir-entra-id
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The employees of Northwind Traders sign in to the Azure portal and to Microsoft 365 with the same work account.

    Which service verifies the identity of the employees when they sign in?
  fr: |
    Les employés de Northwind Traders se connectent au portail Azure et à Microsoft 365 avec le même compte professionnel.

    Quel service vérifie l'identité des employés lorsqu'ils se connectent ?
body:
  options:
    - id: a
      text: { en: "Azure role-based access control (Azure RBAC)", fr: "Contrôle d'accès en fonction du rôle Azure (Azure RBAC)" }
    - id: b
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
    - id: c
      text: { en: "Microsoft Entra ID", fr: "Microsoft Entra ID" }
    - id: d
      text: { en: "Microsoft Entra Domain Services", fr: "Microsoft Entra Domain Services" }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft Entra ID is Microsoft's cloud-based identity and access management service. Azure and Microsoft 365 both rely on it to authenticate users, which is why one account gives access to both.
    fr: Microsoft Entra ID est le service cloud de gestion des identités et des accès de Microsoft. Azure et Microsoft 365 s'appuient tous deux sur lui pour authentifier les utilisateurs, c'est pourquoi un seul compte donne accès aux deux.
  options:
    a:
      en: Azure RBAC decides what a user who is already authenticated is allowed to do on Azure resources. It doesn't verify identities.
      fr: Azure RBAC décide de ce qu'un utilisateur déjà authentifié a le droit de faire sur les ressources Azure. Il ne vérifie pas les identités.
    b:
      en: Microsoft Defender for Cloud assesses the security posture of resources and protects workloads. It doesn't sign users in.
      fr: Microsoft Defender pour le cloud évalue la posture de sécurité des ressources et protège les charges de travail. Il ne connecte pas les utilisateurs.
    d:
      en: Microsoft Entra Domain Services provides managed domain services, such as domain join and Group Policy, for virtual machines and legacy applications.
      fr: Microsoft Entra Domain Services fournit des services de domaine managés, comme la jonction de domaine et la stratégie de groupe, pour des machines virtuelles et des applications anciennes.
references:
  - title: Describe Azure directory services
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services
  - title: What is Microsoft Entra?
    url: https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
