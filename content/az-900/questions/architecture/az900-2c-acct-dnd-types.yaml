id: az900-2c-acct-dnd-types
objective: "2.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the type of storage account that meets it. To answer, drag the appropriate account types to the correct requirements. Each account type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence au type de compte de stockage qui y répond. Pour répondre, faites glisser les types de comptes appropriés vers les exigences correspondantes. Chaque type de compte peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gpv2, text: { en: "Standard general-purpose v2", fr: "Usage général v2 Standard" } }
    - { id: pbb, text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" } }
    - { id: pfs, text: { en: "Premium file shares", fr: "Partages de fichiers Premium" } }
    - { id: ppb, text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" } }
  targets:
    - id: t1
      text: { en: "File shares for an enterprise application that needs high performance", fr: "Des partages de fichiers pour une application d'entreprise qui exige de hautes performances" }
    - id: t2
      text: { en: "Blobs that are replicated to a secondary region", fr: "Des objets blob répliqués dans une région secondaire" }
    - id: t3
      text: { en: "Page blobs only, on solid-state drives", fr: "Des objets blob de pages uniquement, sur des disques SSD" }
answer:
  mapping: { t1: pfs, t2: gpv2, t3: ppb }
explanation:
  correct:
    en: Premium file shares accounts are dedicated to Azure Files and are recommended for enterprise or high-performance file shares. Only standard general-purpose v2 accounts offer geo-redundant options. The premium accounts are limited to LRS and ZRS. Premium page blobs accounts store page blobs only.
    fr: Les comptes de partages de fichiers Premium sont dédiés à Azure Files et recommandés pour les partages de fichiers d'entreprise ou à hautes performances. Seuls les comptes à usage général v2 Standard proposent des options géoredondantes. Les comptes Premium sont limités à LRS et ZRS. Les comptes d'objets blob de pages Premium ne stockent que des objets blob de pages.
  options:
    pbb:
      en: Premium block blobs accounts store block blobs and append blobs with LRS or ZRS. They hold neither file shares nor page blobs, and they can't replicate data to a secondary region.
      fr: Les comptes d'objets blob de blocs Premium stockent des objets blob de blocs et d'ajout avec LRS ou ZRS. Ils ne contiennent ni partages de fichiers ni objets blob de pages, et ils ne peuvent pas répliquer les données dans une région secondaire.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
