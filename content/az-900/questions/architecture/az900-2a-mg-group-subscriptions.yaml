id: az900-2a-mg-group-subscriptions
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 12 Azure subscriptions.

    Contoso needs to apply the same compliance rules to all the subscriptions while minimizing administrative effort.

    What should Contoso use to group the subscriptions?
  fr: |
    Contoso dispose de 12 abonnements Azure.

    Contoso doit appliquer les mêmes règles de conformité à tous les abonnements tout en réduisant au minimum l'effort d'administration.

    Que doit utiliser Contoso pour regrouper les abonnements ?
body:
  options:
    - id: a
      text: { en: "A resource group", fr: "Un groupe de ressources" }
    - id: b
      text: { en: "A Microsoft Entra group", fr: "Un groupe Microsoft Entra" }
    - id: c
      text: { en: "A resource tag", fr: "Une étiquette de ressource" }
    - id: d
      text: { en: "A management group", fr: "Un groupe d'administration" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Management groups are containers placed above subscriptions. Governance conditions, such as policies or access rules, applied to a management group are inherited by every subscription in it, so one assignment covers the 12 subscriptions.
    fr: |
      Les groupes d'administration sont des conteneurs placés au-dessus des abonnements. Les conditions de gouvernance, comme les stratégies ou les règles d'accès, appliquées à un groupe d'administration sont héritées par tous les abonnements qu'il contient : une seule attribution couvre donc les 12 abonnements.
  options:
    a: { en: "A resource group contains resources inside one subscription; it does not contain subscriptions.", fr: "Un groupe de ressources contient des ressources à l'intérieur d'un abonnement ; il ne contient pas d'abonnements." }
    b: { en: "A Microsoft Entra group contains identities such as users, not subscriptions.", fr: "Un groupe Microsoft Entra contient des identités, comme des utilisateurs, pas des abonnements." }
    c: { en: "A tag is a label used to organize and report on resources; it does not group subscriptions for governance.", fr: "Une étiquette est un libellé qui sert à organiser les ressources et à produire des rapports ; elle ne regroupe pas des abonnements à des fins de gouvernance." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
