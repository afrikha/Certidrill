id: az900-2b-compute-dd-functions
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Functions is [[s1]] compute option: you provide only the code. Azure charges you [[s2]].
    fr: |
      Azure Functions est une option de calcul [[s1]] : vous ne fournissez que le code. Azure vous facture [[s2]].
  slots:
    - id: s1
      options:
        - { id: sls, text: { en: "a serverless", fr: "serverless" } }
        - { id: iaas, text: { en: "an infrastructure as a service (IaaS)", fr: "de type infrastructure as a service (IaaS)" } }
        - { id: vdi, text: { en: "a desktop virtualization", fr: "de virtualisation de postes de travail" } }
    - id: s2
      options:
        - { id: hour, text: { en: "for every hour of the month, whether or not the code runs", fr: "chaque heure du mois, que le code s'exécute ou non" } }
        - { id: fixed, text: { en: "a fixed monthly price for each function", fr: "un prix mensuel fixe par fonction" } }
        - { id: run, text: { en: "only for the time during which the code runs", fr: "uniquement le temps pendant lequel le code s'exécute" } }
answer:
  values: { s1: sls, s2: run }
explanation:
  correct:
    en: "Azure Functions is a serverless, event-driven compute option: it needs no virtual machine or container to maintain. The platform runs the code when it is triggered, releases the resources when it finishes, and charges only for the processor time used while the function runs."
    fr: "Azure Functions est une option de calcul serverless pilotée par les événements : elle ne demande aucune machine virtuelle ni aucun conteneur à maintenir. La plateforme exécute le code lorsqu'il est déclenché, libère les ressources à la fin, et ne facture que le temps processeur utilisé pendant l'exécution de la fonction."
  options:
    iaas: { en: "Infrastructure as a service describes virtual machines, where you manage the operating system.", fr: "L'infrastructure as a service décrit les machines virtuelles, dont vous gérez le système d'exploitation." }
    hour: { en: "Paying for every hour that a resource is provisioned describes a virtual machine that is left running.", fr: "Payer chaque heure pendant laquelle une ressource est provisionnée décrit une machine virtuelle laissée en service." }
references:
  - title: "Describe Azure functions"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
