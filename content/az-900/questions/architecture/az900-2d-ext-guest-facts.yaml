id: az900-2d-ext-guest-facts
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses B2B collaboration to invite guest users from partner companies.

    Which two statements about these guest users are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise la collaboration B2B pour inviter des utilisateurs de sociétés partenaires.

    Quelles sont les deux affirmations vraies au sujet de ces utilisateurs invités ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A guest user receives the same access as the employee who sent the invitation.", fr: "Un utilisateur invité reçoit le même accès que l'employé qui a envoyé l'invitation." }
    - id: b
      text: { en: "The identity provider of the guest user authenticates the guest user.", fr: "Le fournisseur d'identité de l'utilisateur invité authentifie l'utilisateur invité." }
    - id: c
      text: { en: "A Contoso administrator must create and reset the password of each guest user.", fr: "Un administrateur de Contoso doit créer et réinitialiser le mot de passe de chaque utilisateur invité." }
    - id: d
      text: { en: "An access review can be used to confirm that a guest user still needs access.", fr: "Une révision d'accès permet de confirmer qu'un utilisateur invité a toujours besoin de son accès." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "External users bring their own identity: their identity provider authenticates them, while Contoso decides what they are authorized to access. Access reviews ask the guests themselves or a decision maker to confirm the need for continued access, so that access no longer needed can be removed."
    fr: "Les utilisateurs externes apportent leur propre identité : leur fournisseur d'identité les authentifie, tandis que Contoso décide de ce à quoi ils sont autorisés à accéder. Les révisions d'accès demandent aux invités eux-mêmes ou à un décideur de confirmer que l'accès reste nécessaire, afin de retirer celui qui ne l'est plus."
  options:
    a:
      en: "A guest user gets no access from the inviter; access comes from the groups, applications and roles that Contoso assigns to the guest."
      fr: "Un utilisateur invité n'hérite d'aucun accès de la personne qui l'invite ; l'accès vient des groupes, des applications et des rôles que Contoso lui attribue."
    c:
      en: "Contoso does not manage the credentials of guest users; the home organization or identity provider of each guest does."
      fr: "Contoso ne gère pas les informations d'identification des utilisateurs invités ; c'est l'organisation d'origine ou le fournisseur d'identité de chaque invité qui s'en charge."
references:
  - title: Describe Azure external identities
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities
  - title: What is Microsoft Entra B2B collaboration?
    url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
