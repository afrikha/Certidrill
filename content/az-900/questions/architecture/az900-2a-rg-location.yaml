id: az900-2a-rg-location
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a resource group named **RG1** whose location is West Europe.

    You plan to create a virtual machine in the East US region.

    In which resource group can you create the virtual machine?
  fr: |
    Vous disposez d'un groupe de ressources nommé **RG1** dont l'emplacement est West Europe.

    Vous prévoyez de créer une machine virtuelle dans la région East US.

    Dans quel groupe de ressources pouvez-vous créer la machine virtuelle ?
body:
  options:
    - id: a
      text: { en: "In RG1, but only after you change its location to East US", fr: "Dans RG1, mais seulement après avoir changé son emplacement en East US" }
    - id: b
      text: { en: "Only in a resource group whose location is East US", fr: "Uniquement dans un groupe de ressources dont l'emplacement est East US" }
    - id: c
      text: { en: "In RG1, without changing anything in RG1", fr: "Dans RG1, sans rien modifier dans RG1" }
    - id: d
      text: { en: "Only in a resource group of a subscription dedicated to East US", fr: "Uniquement dans un groupe de ressources d'un abonnement dédié à East US" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The location of a resource group is where the metadata of the group is stored. It does not restrict the regions of the resources in the group, so a resource group located in West Europe can contain a virtual machine that runs in East US.
    fr: |
      L'emplacement d'un groupe de ressources est l'endroit où les métadonnées du groupe sont stockées. Il ne limite pas les régions des ressources du groupe : un groupe de ressources situé dans West Europe peut donc contenir une machine virtuelle qui s'exécute dans East US.
  options:
    a: { en: "No change is needed: resources and their resource group may be in different regions.", fr: "Aucun changement n'est nécessaire : les ressources et leur groupe de ressources peuvent être dans des régions différentes." }
    b: { en: "A resource does not have to be in the same region as its resource group.", fr: "Une ressource n'a pas à se trouver dans la même région que son groupe de ressources." }
    d: { en: "A subscription is not tied to a region; one subscription can deploy resources to many regions.", fr: "Un abonnement n'est pas lié à une région ; un même abonnement peut déployer des ressources dans de nombreuses régions." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - title: Use the Azure portal and Azure Resource Manager to manage resource groups
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
