id: az900-2d-ca-block-countries
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has employees in France and Belgium only. The company wants to block sign-ins to its cloud applications when they come from any other country or region.

    What should Litware use?
  fr: |
    Litware n'a des employés qu'en France et en Belgique. L'entreprise veut bloquer les connexions à ses applications cloud lorsqu'elles proviennent d'un autre pays ou d'une autre région.

    Que doit utiliser Litware ?
body:
  options:
    - id: a
      text: { en: "Azure Policy", fr: "Azure Policy" }
    - id: b
      text: { en: "Azure role-based access control (Azure RBAC)", fr: "Le contrôle d'accès en fonction du rôle Azure (Azure RBAC)" }
    - id: c
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
    - id: d
      text: { en: "Microsoft Entra Conditional Access", fr: "L'accès conditionnel Microsoft Entra" }
answer: { optionId: d }
explanation:
  correct:
    en: "Conditional Access allows or denies access to resources based on signals collected at sign-in, including where the user is. A policy can block every sign-in that comes from a location the organization does not expect."
    fr: "L'accès conditionnel autorise ou refuse l'accès aux ressources en fonction de signaux recueillis à la connexion, dont l'endroit où se trouve l'utilisateur. Une stratégie peut bloquer toute connexion provenant d'un emplacement que l'organisation n'attend pas."
  options:
    a:
      en: "Azure Policy can restrict the regions in which resources are deployed; it does not evaluate the location from which a user signs in."
      fr: "Azure Policy peut restreindre les régions dans lesquelles les ressources sont déployées ; il n'évalue pas l'emplacement depuis lequel un utilisateur se connecte."
    b:
      en: "Azure RBAC defines what an identity may do on Azure resources at a scope; it takes no account of the user's location."
      fr: "Azure RBAC définit ce qu'une identité peut faire sur des ressources Azure à une étendue ; il ne tient pas compte de l'emplacement de l'utilisateur."
    c:
      en: "Defender for Cloud assesses the security posture of resources and raises security alerts; it does not decide whether a sign-in is allowed."
      fr: "Defender pour le cloud évalue la posture de sécurité des ressources et émet des alertes de sécurité ; il ne décide pas si une connexion est autorisée."
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
