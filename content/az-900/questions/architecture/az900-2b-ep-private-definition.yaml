id: az900-2b-ep-private-definition
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What does a private endpoint add to your virtual network?
  fr: |
    Qu'est-ce qu'un point de terminaison privé ajoute à votre réseau virtuel ?
body:
  options:
    - { id: a, text: { en: "A network interface that has a private IP address from the virtual network", fr: "Une interface réseau dotée d'une adresse IP privée du réseau virtuel" } }
    - { id: b, text: { en: "A VPN gateway that encrypts the traffic sent to the service", fr: "Une passerelle VPN qui chiffre le trafic envoyé au service" } }
    - { id: c, text: { en: "A public IP address that is reserved for the service", fr: "Une adresse IP publique réservée au service" } }
    - { id: d, text: { en: "A load balancer that distributes the traffic sent to the service", fr: "Un équilibreur de charge qui répartit le trafic envoyé au service" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A private endpoint is a network interface that uses a private IP address from your virtual network. This interface connects you privately to a service powered by Azure Private Link, which in effect brings the service into the virtual network."
    fr: "Un point de terminaison privé est une interface réseau qui utilise une adresse IP privée de votre réseau virtuel. Cette interface vous connecte de façon privée à un service qui s'appuie sur Azure Private Link, ce qui revient à amener le service dans le réseau virtuel."
  options:
    b: { en: "A VPN gateway connects networks through encrypted tunnels; a private endpoint doesn't deploy one.", fr: "Une passerelle VPN connecte des réseaux par des tunnels chiffrés ; un point de terminaison privé n'en déploie pas." }
    c: { en: "A private endpoint uses a private address of the virtual network, not a public IP address.", fr: "Un point de terminaison privé utilise une adresse privée du réseau virtuel, pas une adresse IP publique." }
    d: { en: "A load balancer distributes traffic between several back-end resources; it isn't what a private endpoint creates.", fr: "Un équilibreur de charge répartit le trafic entre plusieurs ressources back-end ; ce n'est pas ce que crée un point de terminaison privé." }
references:
  - title: "What is a private endpoint?"
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
