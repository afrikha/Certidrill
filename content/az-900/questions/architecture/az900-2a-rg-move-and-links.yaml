id: az900-2a-rg-move-and-links
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A subscription contains two resource groups named **RG1** and **RG2**. RG1 contains a virtual machine and a web app. RG2 contains a database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un abonnement contient deux groupes de ressources nommés **RG1** et **RG2**. RG1 contient une machine virtuelle et une application web. RG2 contient une base de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Moving the virtual machine from RG1 to RG2 changes the region in which the virtual machine runs."
        fr: "Déplacer la machine virtuelle de RG1 vers RG2 change la région dans laquelle la machine virtuelle s'exécute."
    - id: s2
      text:
        en: "The web app in RG1 can connect to the database in RG2."
        fr: "L'application web de RG1 peut se connecter à la base de données de RG2."
    - id: s3
      text:
        en: "If you delete RG1, the virtual machine and the web app are moved to RG2."
        fr: "Si vous supprimez RG1, la machine virtuelle et l'application web sont déplacées vers RG2."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Moving a resource to another resource group only changes the group it is associated with; the resource stays in its region. A resource group is a management container, not a network boundary, so resources in different groups can work together. Deleting a resource group deletes every resource it contains.
    fr: |
      Déplacer une ressource vers un autre groupe de ressources change seulement le groupe auquel elle est associée ; la ressource reste dans sa région. Un groupe de ressources est un conteneur de gestion, pas une limite réseau : des ressources de groupes différents peuvent donc fonctionner ensemble. Supprimer un groupe de ressources supprime toutes les ressources qu'il contient.
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
