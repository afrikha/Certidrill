id: az900-2b-host-aks-fleet
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs an application made of dozens of containers. The company needs a service that deploys, scales and manages the lifecycle of this fleet of containers as a whole.

    Which service should Northwind Traders use?
  fr: |
    Northwind Traders exécute une application composée de dizaines de conteneurs. L'entreprise a besoin d'un service qui déploie, met à l'échelle et gère le cycle de vie de cette flotte de conteneurs dans son ensemble.

    Quel service Northwind Traders doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Container Instances" }
    - { id: b, text: "Azure App Service" }
    - { id: c, text: "Azure Functions" }
    - { id: d, text: "Azure Kubernetes Service" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Kubernetes Service is a container orchestration service: it manages the lifecycle of containers. When you deploy a fleet of containers, it makes the management of the fleet simpler and more efficient."
    fr: "Azure Kubernetes Service est un service d'orchestration de conteneurs : il gère le cycle de vie des conteneurs. Lorsque vous déployez une flotte de conteneurs, il rend la gestion de cette flotte plus simple et plus efficace."
  options:
    a: { en: "Container Instances runs containers simply, without an orchestrator; it isn't designed to manage a whole fleet.", fr: "Container Instances exécute des conteneurs simplement, sans orchestrateur ; il n'est pas conçu pour gérer toute une flotte." }
    b: { en: "App Service hosts web applications and APIs; it isn't an orchestrator for dozens of containers.", fr: "App Service héberge des applications web et des API ; ce n'est pas un orchestrateur pour des dizaines de conteneurs." }
    c: { en: "Azure Functions runs event-driven code, not a fleet of containers.", fr: "Azure Functions exécute du code déclenché par des événements, pas une flotte de conteneurs." }
references:
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
