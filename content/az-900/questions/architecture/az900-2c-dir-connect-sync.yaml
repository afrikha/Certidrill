id: az900-2c-dir-connect-sync
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam manages its users in an on-premises Active Directory. The company wants each user to have a single identity for on-premises resources and for cloud services, without maintaining two sets of accounts.

    What should you use?
  fr: |
    Fabrikam gère ses utilisateurs dans un annuaire Active Directory local. L'entreprise veut que chaque utilisateur ait une seule identité pour les ressources locales et pour les services cloud, sans tenir à jour deux ensembles de comptes.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra Connect", fr: "Microsoft Entra Connect" }
    - id: b
      text: { en: "Microsoft Entra Domain Services", fr: "Microsoft Entra Domain Services" }
    - id: c
      text: { en: "Azure VPN Gateway", fr: "Passerelle VPN Azure" }
    - id: d
      text: { en: "Microsoft Entra multifactor authentication", fr: "Authentification multifacteur Microsoft Entra" }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft Entra Connect synchronizes user identities between on-premises Active Directory and Microsoft Entra ID. Users keep one identity for both environments, and administrators don't maintain two separate sets of accounts.
    fr: Microsoft Entra Connect synchronise les identités des utilisateurs entre l'annuaire Active Directory local et Microsoft Entra ID. Les utilisateurs gardent une seule identité pour les deux environnements, et les administrateurs ne tiennent pas à jour deux ensembles de comptes distincts.
  options:
    b:
      en: Microsoft Entra Domain Services provides a managed domain in Azure for legacy applications. It doesn't synchronize an on-premises directory with Microsoft Entra ID.
      fr: Microsoft Entra Domain Services fournit un domaine managé dans Azure pour des applications anciennes. Il ne synchronise pas un annuaire local avec Microsoft Entra ID.
    c:
      en: Azure VPN Gateway connects networks through encrypted tunnels. It carries traffic, not identities.
      fr: Passerelle VPN Azure connecte des réseaux par des tunnels chiffrés. Elle transporte du trafic, pas des identités.
    d:
      en: Multifactor authentication adds a second proof at sign-in. It doesn't synchronize accounts between directories.
      fr: L'authentification multifacteur ajoute une deuxième preuve à la connexion. Elle ne synchronise pas de comptes entre des annuaires.
references:
  - title: Describe Azure directory services
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services
