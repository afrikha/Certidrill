id: az900-2a-region-pair-benefit
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys an application to two Azure regions that form a region pair.

    Which benefit does the region pair provide?
  fr: |
    Contoso déploie une application dans deux régions Azure qui forment une paire de régions.

    Quel avantage la paire de régions apporte-t-elle ?
body:
  options:
    - id: a
      text: { en: "Every resource created in one region is automatically copied to the other region", fr: "Chaque ressource créée dans une région est automatiquement copiée dans l'autre région" }
    - id: b
      text: { en: "Resources deployed to the two regions are billed at a reduced price", fr: "Les ressources déployées dans les deux régions sont facturées à un prix réduit" }
    - id: c
      text: { en: "Planned Azure updates are rolled out to one region of the pair at a time", fr: "Les mises à jour planifiées d'Azure sont déployées dans une seule région de la paire à la fois" }
    - id: d
      text: { en: "The two regions share the same datacenters to reduce latency", fr: "Les deux régions partagent les mêmes centres de données pour réduire la latence" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure staggers its planned updates across a region pair, one region at a time, so that a faulty update cannot affect both regions together. In addition, if a broad outage occurs, one region of each pair is prioritized for recovery.
    fr: |
      Azure échelonne ses mises à jour planifiées au sein d'une paire de régions, une région à la fois, afin qu'une mise à jour défectueuse ne touche pas les deux régions en même temps. De plus, en cas de panne étendue, une région de chaque paire est rétablie en priorité.
  options:
    a: { en: "Not every service replicates to the paired region by itself; for many services you must configure replication and recovery.", fr: "Tous les services ne se répliquent pas d'eux-mêmes vers la région jumelée ; pour beaucoup d'entre eux, vous devez configurer la réplication et la reprise." }
    b: { en: "A region pair has no effect on prices; each region keeps its own rates.", fr: "Une paire de régions n'a aucun effet sur les prix ; chaque région conserve ses propres tarifs." }
    d: { en: "Paired regions are separate regions, far apart from each other, each with its own datacenters.", fr: "Les régions jumelées sont des régions distinctes, éloignées l'une de l'autre, chacune avec ses propres centres de données." }
references:
  - title: Azure region pairs and nonpaired regions
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-paired
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
