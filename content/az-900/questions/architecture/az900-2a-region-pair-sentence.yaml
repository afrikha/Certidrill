id: az900-2a-region-pair-sentence
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When an Azure region has a pair, the paired region is usually located in [[scope]].

      Planned Azure updates are rolled out to [[update]].
    fr: |
      Quand une région Azure a une paire, la région jumelée se trouve généralement dans [[scope]].

      Les mises à jour planifiées d'Azure sont déployées dans [[update]].
  slots:
    - id: scope
      options:
        - { id: az, text: { en: "the same availability zone", fr: "la même zone de disponibilité" } }
        - { id: dc, text: { en: "the same datacenter", fr: "le même centre de données" } }
        - { id: geo, text: { en: "the same geography", fr: "la même zone géographique" } }
        - { id: sub, text: { en: "the same subscription", fr: "le même abonnement" } }
    - id: update
      options:
        - { id: both, text: { en: "both regions of a pair at the same time", fr: "les deux régions d'une paire en même temps" } }
        - { id: one, text: { en: "one region of a pair at a time", fr: "une seule région d'une paire à la fois" } }
        - { id: chosen, text: { en: "only the region that the customer selects", fr: "la seule région que le client sélectionne" } }
answer:
  values: { scope: geo, update: one }
explanation:
  correct:
    en: |
      A region pair associates two regions of the same geography (for example West Europe and North Europe), which keeps replicated data inside the same data residency boundary. Azure rolls out its planned updates to one region of a pair at a time, to limit the impact of a faulty update.
    fr: |
      Une paire de régions associe deux régions de la même zone géographique (par exemple West Europe et North Europe), ce qui maintient les données répliquées dans la même limite de résidence des données. Azure déploie ses mises à jour planifiées dans une seule région d'une paire à la fois, afin de limiter l'effet d'une mise à jour défectueuse.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: Azure region pairs and nonpaired regions
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-paired
