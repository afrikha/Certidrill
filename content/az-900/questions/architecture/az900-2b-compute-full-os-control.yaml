id: az900-2b-compute-full-os-control
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to move an on-premises application to Azure without redesigning it. The application needs custom software and specific settings in the operating system of the server.

    Which compute type should Contoso use?
  fr: |
    Contoso prévoit de déplacer une application locale vers Azure sans la reconcevoir. L'application a besoin de logiciels spécifiques et de réglages particuliers dans le système d'exploitation du serveur.

    Quel type de calcul Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A virtual machine", fr: "Une machine virtuelle" } }
    - { id: b, text: { en: "A container", fr: "Un conteneur" } }
    - { id: c, text: { en: "A function", fr: "Une fonction" } }
    - { id: d, text: { en: "A web app", fr: "Une application web" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A virtual machine is infrastructure as a service: like a physical server, it gives you total control of the operating system and of the software installed on it. This is why it suits a lift-and-shift migration, which moves a server workload with minimal redesign."
    fr: "Une machine virtuelle relève de l'infrastructure as a service : comme un serveur physique, elle vous donne le contrôle total du système d'exploitation et des logiciels qui y sont installés. C'est pourquoi elle convient à une migration lift-and-shift, qui déplace une charge de travail serveur avec un minimum de reconception."
  options:
    b: { en: "With a container, you manage the packaged application, not the operating system of the host.", fr: "Avec un conteneur, vous gérez l'application empaquetée, pas le système d'exploitation de l'hôte." }
    c: { en: "A function runs only your code; you have no access to the operating system that runs it.", fr: "Une fonction n'exécute que votre code ; vous n'avez aucun accès au système d'exploitation qui l'exécute." }
    d: { en: "A web app runs on a managed platform: the operating system is maintained by Microsoft and can't be customized freely.", fr: "Une application web s'exécute sur une plateforme managée : le système d'exploitation est maintenu par Microsoft et ne se personnalise pas librement." }
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
