id: az900-2a-dc-microsoft-responsibility
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum migrates its virtual machines from an on-premises server room to Azure.

    Which task is Microsoft responsible for after the migration?
  fr: |
    Adatum migre ses machines virtuelles d'une salle de serveurs locale vers Azure.

    De quelle tâche Microsoft est-il responsable après la migration ?
body:
  options:
    - id: a
      text: { en: "Assigning roles to the users who manage the virtual machines", fr: "Attribuer des rôles aux utilisateurs qui gèrent les machines virtuelles" }
    - id: b
      text: { en: "Securing physical access to the datacenters of the region", fr: "Sécuriser l'accès physique aux centres de données de la région" }
    - id: c
      text: { en: "Selecting the region to which the virtual machines are deployed", fr: "Sélectionner la région dans laquelle les machines virtuelles sont déployées" }
    - id: d
      text: { en: "Installing the applications that run on the virtual machines", fr: "Installer les applications qui s'exécutent sur les machines virtuelles" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft designs, builds and operates the Azure datacenters, and protects them with several layers of physical security (perimeter, building entrance, datacenter floor). Customers have no access to the facilities and no physical security task to perform.
    fr: |
      Microsoft conçoit, construit et exploite les centres de données Azure, et les protège par plusieurs couches de sécurité physique (périmètre, entrée du bâtiment, salle des serveurs). Les clients n'ont pas accès aux installations et n'ont aucune tâche de sécurité physique à accomplir.
  options:
    a: { en: "Access to the resources of a subscription is managed by the customer.", fr: "L'accès aux ressources d'un abonnement est géré par le client." }
    c: { en: "The customer chooses the region when it deploys a resource.", fr: "Le client choisit la région lorsqu'il déploie une ressource." }
    d: { en: "On a virtual machine, the customer installs and maintains its own applications.", fr: "Sur une machine virtuelle, le client installe et maintient ses propres applications." }
references:
  - title: Azure facilities, premises, and physical security
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/physical-security
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
