id: az900-2a-region-pair-limits
objective: "2.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Azure region pairs, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les paires de régions Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Every Azure region has a paired region."
        fr: "Chaque région Azure possède une région jumelée."
    - id: s2
      text:
        en: "When you create a virtual machine in a region that has a pair, Azure automatically replicates the virtual machine to the paired region."
        fr: "Lorsque vous créez une machine virtuelle dans une région qui a une paire, Azure réplique automatiquement la machine virtuelle vers la région jumelée."
    - id: s3
      text:
        en: "If a broad outage affects both regions of a pair, the recovery of one of the two regions is prioritized."
        fr: "Si une panne étendue touche les deux régions d'une paire, le rétablissement de l'une des deux régions est prioritaire."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Many regions, especially newer ones, have no pair and rely on availability zones instead. A pair does not make resources resilient by itself: many services, including virtual machines, are replicated to another region only if you configure it. When an outage covers several regions, one region of each pair is restored first.
    fr: |
      De nombreuses régions, surtout les plus récentes, n'ont pas de paire et s'appuient plutôt sur les zones de disponibilité. Une paire ne rend pas les ressources résilientes à elle seule : de nombreux services, dont les machines virtuelles, ne sont répliqués vers une autre région que si vous le configurez. Quand une panne couvre plusieurs régions, une région de chaque paire est rétablie en premier.
references:
  - title: Azure region pairs and nonpaired regions
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-paired
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
