id: az900-2d-rbac-assignments-table
objective: "2.4.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A subscription named **Sub1** contains two resource groups named **RG1** and **RG2**. RG1 contains a virtual machine named **VM1**. The role assignments of Sub1 are shown in the following table. There is no other role assignment.

    Answer each prompt by selecting the appropriate user in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un abonnement nommé **Sub1** contient deux groupes de ressources nommés **RG1** et **RG2**. RG1 contient une machine virtuelle nommée **VM1**. Les attributions de rôles de Sub1 figurent dans le tableau suivant. Il n'existe aucune autre attribution de rôle.

    Répondez à chaque consigne en sélectionnant l'utilisateur approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The user who can create a storage account in RG1, but cannot assign roles to other users", fr: "L'utilisateur qui peut créer un compte de stockage dans RG1, mais ne peut pas attribuer de rôles à d'autres utilisateurs" }
    - id: p2
      text: { en: "The user who can view the resources of RG2, but cannot change any resource of Sub1", fr: "L'utilisateur qui peut consulter les ressources de RG2, mais ne peut modifier aucune ressource de Sub1" }
  grid:
    header: [{ en: "User", fr: "Utilisateur" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: User1, area: u1 }, { text: Owner }, { text: Sub1 }]
      - [{ text: User2, area: u2 }, { text: Contributor }, { text: VM1 }]
      - [{ text: User3, area: u3 }, { text: Reader }, { text: Sub1 }]
      - [{ text: User4, area: u4 }, { text: Contributor }, { text: RG1 }]
answer:
  values: { p1: u4, p2: u3 }
explanation:
  correct:
    en: "Contributor on RG1 lets User4 create and manage any resource in RG1, but Contributor does not include role assignment. User1 can also create the storage account, since Owner on Sub1 is inherited by RG1, but Owner can assign roles. User2 is a Contributor on VM1 only, which gives nothing on the rest of RG1. Reader on Sub1 is inherited by RG1 and RG2, so User3 can view everything and change nothing."
    fr: "Contributor sur RG1 permet à User4 de créer et de gérer n'importe quelle ressource de RG1, mais Contributor n'inclut pas l'attribution de rôles. User1 peut aussi créer le compte de stockage, puisque Owner sur Sub1 est hérité par RG1, mais Owner peut attribuer des rôles. User2 n'est Contributor que sur VM1, ce qui ne donne rien sur le reste de RG1. Reader sur Sub1 est hérité par RG1 et RG2 : User3 peut tout consulter et ne rien modifier."
  options:
    u1:
      en: "Owner on Sub1 can do everything in RG1 and RG2, including assigning roles and changing resources, so User1 matches neither prompt."
      fr: "Owner sur Sub1 peut tout faire dans RG1 et RG2, y compris attribuer des rôles et modifier des ressources : User1 ne correspond à aucune des deux consignes."
    u2:
      en: "The scope of User2 is the single resource VM1: no right to create resources in RG1 and no access to RG2."
      fr: "L'étendue de User2 est la seule ressource VM1 : aucun droit de créer des ressources dans RG1 et aucun accès à RG2."
references:
  - title: Describe Azure role-based access control
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
