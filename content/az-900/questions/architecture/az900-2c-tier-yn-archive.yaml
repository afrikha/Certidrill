id: az900-2c-tier-yn-archive
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the archive access tier, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le niveau d'accès archive (Archive), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can select the archive tier as the default access tier of a storage account.
        fr: Vous pouvez sélectionner le niveau archive (Archive) comme niveau d'accès par défaut d'un compte de stockage.
    - id: s2
      text:
        en: A blob in the archive tier must be rehydrated to an online tier before it can be read.
        fr: Un objet blob du niveau archive (Archive) doit être réhydraté vers un niveau en ligne avant de pouvoir être lu.
    - id: s3
      text:
        en: A blob in the archive tier can be read within milliseconds, like a blob in the cool tier.
        fr: Un objet blob du niveau archive (Archive) peut être lu en quelques millisecondes, comme un objet blob du niveau froid (Cool).
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Only the hot, cool and cold tiers can be the default tier of an account. The archive tier is set blob by blob. Archive is an offline tier, so a blob must first be rehydrated to the hot, cool or cold tier, and rehydration takes hours, not milliseconds.
    fr: Seuls les niveaux chaud (Hot), froid (Cool) et froid (Cold) peuvent être le niveau par défaut d'un compte. Le niveau archive (Archive) se règle objet blob par objet blob. C'est un niveau hors connexion, un objet blob doit donc d'abord être réhydraté vers le niveau chaud (Hot), froid (Cool) ou froid (Cold), et la réhydratation prend des heures, pas des millisecondes.
  options:
    s1:
      en: The archive tier isn't available as a default account tier. It is applied to individual blobs.
      fr: Le niveau archive (Archive) n'est pas proposé comme niveau par défaut d'un compte. Il s'applique à des objets blob individuels.
    s3:
      en: Data in the archive tier is offline. The time needed before the first byte can be read is counted in hours.
      fr: Les données du niveau archive (Archive) sont hors connexion. Le délai avant de pouvoir lire le premier octet se compte en heures.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Blob rehydration from the archive tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
