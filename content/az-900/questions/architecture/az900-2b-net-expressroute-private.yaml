id: az900-2b-net-expressroute-private
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must connect its datacenter to Azure. For compliance reasons, the traffic must not travel over the public internet.

    Which service should Woodgrove Bank use?
  fr: |
    Woodgrove Bank doit connecter son centre de données à Azure. Pour des raisons de conformité, le trafic ne doit pas passer par l'internet public.

    Quel service Woodgrove Bank doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure VPN Gateway", fr: "Passerelle VPN Azure" } }
    - { id: b, text: "Azure DNS" }
    - { id: c, text: "Azure ExpressRoute" }
    - { id: d, text: { en: "Virtual network peering", fr: "Peering de réseaux virtuels" } }
answer: { optionId: c }
explanation:
  correct:
    en: "ExpressRoute extends an on-premises network into the Microsoft cloud over a private connection, with the help of a connectivity provider. Its connections don't go over the public internet, which suits strict compliance requirements."
    fr: "ExpressRoute étend un réseau local dans le cloud Microsoft par une connexion privée, avec l'aide d'un fournisseur de connectivité. Ses connexions ne passent pas par l'internet public, ce qui convient à des exigences de conformité strictes."
  options:
    a: { en: "A VPN gateway encrypts the traffic, but the tunnel still crosses the public internet.", fr: "Une passerelle VPN chiffre le trafic, mais le tunnel traverse tout de même l'internet public." }
    b: { en: "Azure DNS hosts domains and resolves names; it doesn't connect networks.", fr: "Azure DNS héberge des domaines et résout des noms ; il ne connecte pas de réseaux." }
    d: { en: "Peering connects two Azure virtual networks to each other, not a datacenter to Azure.", fr: "Le peering connecte deux réseaux virtuels Azure entre eux, pas un centre de données à Azure." }
references:
  - title: "Describe Azure ExpressRoute"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/4-expressroute
  - title: "What is Azure ExpressRoute?"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-introduction
