id: az900-2a-hier-combined-roles
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a management group named **MG1** that contains a subscription named **Sub1**. Sub1 contains two resource groups named **RG1** and **RG2**.

    A user named User1 is assigned the Reader role on MG1 and the Contributor role on RG1. No other role is assigned to User1.

    What can User1 do?
  fr: |
    Contoso dispose d'un groupe d'administration nommé **MG1** qui contient un abonnement nommé **Sub1**. Sub1 contient deux groupes de ressources nommés **RG1** et **RG2**.

    Le rôle Reader sur MG1 et le rôle Contributor sur RG1 sont attribués à un utilisateur nommé User1. Aucun autre rôle n'est attribué à User1.

    Que peut faire User1 ?
body:
  options:
    - id: a
      text: { en: "View the resources of RG1 and RG2, and modify the resources of RG1 only", fr: "Consulter les ressources de RG1 et de RG2, et modifier uniquement les ressources de RG1" }
    - id: b
      text: { en: "View and modify the resources of RG1 and RG2", fr: "Consulter et modifier les ressources de RG1 et de RG2" }
    - id: c
      text: { en: "View and modify the resources of RG1, and see nothing in RG2", fr: "Consulter et modifier les ressources de RG1, et ne rien voir dans RG2" }
    - id: d
      text: { en: "View the resources of RG1 and RG2, without modifying any of them", fr: "Consulter les ressources de RG1 et de RG2, sans en modifier aucune" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Reader role assigned on MG1 is inherited by Sub1, RG1, RG2 and their resources, so User1 can view everything. The Contributor role assigned on RG1 is inherited only by the resources of RG1, where it adds the right to modify. RG2 receives nothing more than the inherited Reader role.
    fr: |
      Le rôle Reader attribué sur MG1 est hérité par Sub1, RG1, RG2 et leurs ressources : User1 peut donc tout consulter. Le rôle Contributor attribué sur RG1 n'est hérité que par les ressources de RG1, où il ajoute le droit de modifier. RG2 ne reçoit rien de plus que le rôle Reader hérité.
  options:
    b: { en: "The Contributor role is assigned on RG1; it does not reach RG2, which is at the same level.", fr: "Le rôle Contributor est attribué sur RG1 ; il n'atteint pas RG2, situé au même niveau." }
    c: { en: "The Reader role assigned on MG1 flows down to RG2 as well.", fr: "Le rôle Reader attribué sur MG1 descend aussi jusqu'à RG2." }
    d: { en: "The role inherited from MG1 does not cancel the Contributor role assigned lower in the hierarchy; the permissions add up.", fr: "Le rôle hérité de MG1 n'annule pas le rôle Contributor attribué plus bas dans la hiérarchie ; les autorisations se cumulent." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
