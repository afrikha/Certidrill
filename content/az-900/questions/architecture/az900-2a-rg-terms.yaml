id: az900-2a-rg-terms
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the correct term. To answer, drag the appropriate term to each description. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au terme correct. Pour répondre, faites glisser le terme approprié vers chaque description. Chaque terme peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: res, text: { en: "Resource", fr: "Ressource" } }
    - { id: rg, text: { en: "Resource group", fr: "Groupe de ressources" } }
    - { id: sub, text: { en: "Subscription", fr: "Abonnement" } }
    - { id: mg, text: { en: "Management group", fr: "Groupe d'administration" } }
    - { id: region, text: { en: "Region", fr: "Région" } }
  targets:
    - id: t1
      text: { en: "A logical container that holds items that are deployed, managed and deleted together", fr: "Un conteneur logique qui contient des éléments déployés, gérés et supprimés ensemble" }
    - id: t2
      text: { en: "An item that you create and manage in Azure, such as a virtual machine, a virtual network or a database", fr: "Un élément que vous créez et gérez dans Azure, comme une machine virtuelle, un réseau virtuel ou une base de données" }
    - id: t3
      text: { en: "A unit of management, billing and scale that is linked to an Azure account", fr: "Une unité de gestion, de facturation et de mise à l'échelle liée à un compte Azure" }
answer:
  mapping: { t1: rg, t2: res, t3: sub }
explanation:
  correct:
    en: |
      A resource is the basic building block of Azure: anything you create, provision or deploy. A resource group is the logical container in which resources that share a lifecycle are placed. A subscription is a unit of management, billing and scale linked to an Azure account. A management group organizes subscriptions, and a region is part of the physical infrastructure.
    fr: |
      Une ressource est l'élément de base d'Azure : tout ce que vous créez, approvisionnez ou déployez. Un groupe de ressources est le conteneur logique dans lequel sont placées les ressources qui partagent un cycle de vie. Un abonnement est une unité de gestion, de facturation et de mise à l'échelle liée à un compte Azure. Un groupe d'administration organise des abonnements, et une région fait partie de l'infrastructure physique.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
