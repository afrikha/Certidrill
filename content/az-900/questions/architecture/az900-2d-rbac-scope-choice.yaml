id: az900-2d-rbac-scope-choice
objective: "2.4.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A subscription named **Sub1** contains ten resource groups. You plan to assign the Virtual Machine Contributor role to a support team. The team must manage all the current and future virtual machines of a resource group named **RG-Prod**, and it must have no access to the virtual machines of the other resource groups.

    At which scope should you assign the role?
  fr: |
    Un abonnement nommé **Sub1** contient dix groupes de ressources. Vous prévoyez d'attribuer le rôle Virtual Machine Contributor à une équipe de support. L'équipe doit gérer toutes les machines virtuelles actuelles et futures d'un groupe de ressources nommé **RG-Prod**, et ne doit avoir aucun accès aux machines virtuelles des autres groupes de ressources.

    À quelle étendue devez-vous attribuer le rôle ?
body:
  options:
    - id: a
      text: { en: "The management group that contains Sub1", fr: "Le groupe d'administration qui contient Sub1" }
    - id: b
      text: { en: "The subscription Sub1", fr: "L'abonnement Sub1" }
    - id: c
      text: { en: "The resource group RG-Prod", fr: "Le groupe de ressources RG-Prod" }
    - id: d
      text: { en: "Each existing virtual machine of RG-Prod", fr: "Chaque machine virtuelle existante de RG-Prod" }
answer: { optionId: c }
explanation:
  correct:
    en: "A role assigned on a resource group is inherited by all the resources of that group, including those created later, and by nothing outside it. Assigning the role on RG-Prod therefore covers current and future virtual machines of RG-Prod only."
    fr: "Un rôle attribué sur un groupe de ressources est hérité par toutes les ressources de ce groupe, y compris celles créées plus tard, et par rien d'autre. Attribuer le rôle sur RG-Prod couvre donc les machines virtuelles actuelles et futures de RG-Prod, et elles seules."
  options:
    a:
      en: "A management group is the broadest scope: the role would apply to every subscription in it, including all ten resource groups of Sub1."
      fr: "Un groupe d'administration est l'étendue la plus large : le rôle s'appliquerait à tous les abonnements qu'il contient, donc aux dix groupes de ressources de Sub1."
    b:
      en: "A role on the subscription is inherited by its ten resource groups, which gives the team access to virtual machines outside RG-Prod."
      fr: "Un rôle sur l'abonnement est hérité par ses dix groupes de ressources, ce qui donne à l'équipe l'accès à des machines virtuelles hors de RG-Prod."
    d:
      en: "An assignment on each existing virtual machine does not cover the virtual machines created later in RG-Prod."
      fr: "Une attribution sur chaque machine virtuelle existante ne couvre pas les machines virtuelles créées plus tard dans RG-Prod."
references:
  - title: Understand scope for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - title: Describe Azure role-based access control
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control
