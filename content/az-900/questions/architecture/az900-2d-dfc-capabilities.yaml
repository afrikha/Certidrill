id: az900-2d-dfc-capabilities
objective: "2.4.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two capabilities does Microsoft Defender for Cloud provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux capacités fournies par Microsoft Defender pour le cloud ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "It sends notifications about the planned maintenance of Azure services.", fr: "Il envoie des notifications sur les maintenances planifiées des services Azure." }
    - id: b
      text: { en: "It gives recommendations to harden the configuration of resources.", fr: "Il donne des recommandations pour renforcer la configuration des ressources." }
    - id: c
      text: { en: "It raises security alerts when it detects a threat on a resource.", fr: "Il émet des alertes de sécurité lorsqu'il détecte une menace sur une ressource." }
    - id: d
      text: { en: "It forecasts the cost of a subscription and alerts when a budget is exceeded.", fr: "Il prévoit le coût d'un abonnement et alerte lorsqu'un budget est dépassé." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Defender for Cloud combines security posture management and threat protection. It evaluates resources against security best practices and gives prioritized recommendations to harden them, and it generates security alerts, with remediation steps, when a threat is detected."
    fr: "Defender pour le cloud associe la gestion de la posture de sécurité et la protection contre les menaces. Il évalue les ressources par rapport aux bonnes pratiques de sécurité et donne des recommandations hiérarchisées pour les renforcer, et il génère des alertes de sécurité, avec des étapes de correction, lorsqu'une menace est détectée."
  options:
    a:
      en: "Notifications about planned maintenance and service incidents come from Azure Service Health."
      fr: "Les notifications sur les maintenances planifiées et les incidents de service viennent d'Azure Service Health."
    d:
      en: "Cost forecasts and budget alerts are features of Cost Management."
      fr: "Les prévisions de coût et les alertes de budget sont des fonctionnalités de Cost Management."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
