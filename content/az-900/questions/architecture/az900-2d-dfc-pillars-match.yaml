id: az900-2d-dfc-pillars-match
objective: "2.4.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Defender for Cloud meets three needs of security management: continuously assess, secure, and defend.

    Match each description to the appropriate term. To answer, drag the appropriate terms to the correct descriptions. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Microsoft Defender pour le cloud répond à trois besoins de la gestion de la sécurité : évaluer en continu, sécuriser et défendre.

    Associez chaque description au terme approprié. Pour répondre, faites glisser les termes appropriés vers les descriptions correspondantes. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: secure, text: { en: "Secure", fr: "Sécuriser" } }
    - { id: verify, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
    - { id: defend, text: { en: "Defend", fr: "Défendre" } }
    - { id: assess, text: { en: "Continuously assess", fr: "Évaluer en continu" } }
  targets:
    - id: t1
      text: { en: "Detect threats to resources and workloads, and raise security alerts.", fr: "Détecter les menaces qui pèsent sur les ressources et les charges de travail, et émettre des alertes de sécurité." }
    - id: t2
      text: { en: "Know your security posture, and identify and track vulnerabilities.", fr: "Connaître votre posture de sécurité, et identifier et suivre les vulnérabilités." }
    - id: t3
      text: { en: "Harden resources by following recommendations aligned with the Microsoft cloud security benchmark.", fr: "Renforcer les ressources en suivant des recommandations alignées sur le benchmark de sécurité cloud Microsoft." }
answer:
  mapping: { t1: defend, t2: assess, t3: secure }
explanation:
  correct:
    en: "Continuously assess means knowing your security posture and identifying and tracking vulnerabilities. Secure means hardening resources and services with recommendations based on the Microsoft cloud security benchmark, which Defender for Cloud applies through Azure Policy. Defend means detecting and resolving threats, which are reported as security alerts."
    fr: "Évaluer en continu, c'est connaître votre posture de sécurité et identifier et suivre les vulnérabilités. Sécuriser, c'est renforcer les ressources et les services grâce à des recommandations fondées sur le benchmark de sécurité cloud Microsoft, que Defender pour le cloud applique au moyen d'Azure Policy. Défendre, c'est détecter et résoudre les menaces, qui sont signalées sous forme d'alertes de sécurité."
  options:
    verify:
      en: "Verify explicitly is a guiding principle of the Zero Trust model, not one of the three needs covered by Defender for Cloud."
      fr: "Vérifier explicitement est un principe directeur du modèle Confiance Zéro, pas l'un des trois besoins couverts par Defender pour le cloud."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
