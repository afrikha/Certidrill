id: az900-2b-vmopt-multi-avd
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe Azure Virtual Desktop?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent Azure Virtual Desktop ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It delivers Windows desktops and applications that users reach from many types of devices.", fr: "Il fournit des bureaux et des applications Windows auxquels les utilisateurs accèdent depuis de nombreux types d'appareils." } }
    - { id: b, text: { en: "It spreads the virtual machines of an application across update domains and fault domains.", fr: "Il répartit les machines virtuelles d'une application sur des domaines de mise à jour et des domaines d'erreur." } }
    - { id: c, text: { en: "It hosts web applications and REST APIs without any virtual machine in your subscription.", fr: "Il héberge des applications web et des API REST sans aucune machine virtuelle dans votre abonnement." } }
    - { id: d, text: { en: "It supports multi-session Windows, in which several users share one virtual machine.", fr: "Il prend en charge Windows multisession, où plusieurs utilisateurs partagent une même machine virtuelle." } }
    - { id: e, text: { en: "It adds identical virtual machines behind a load balancer when the load of an application grows.", fr: "Il ajoute des machines virtuelles identiques derrière un équilibreur de charge lorsque la charge d'une application augmente." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Azure Virtual Desktop is a desktop and application virtualization service: users securely reach Windows desktops and applications from many device types and locations. It supports single-session and multi-session Windows; with multi-session, many users share one virtual machine, which reduces the number of machines needed."
    fr: "Azure Virtual Desktop est un service de virtualisation de postes de travail et d'applications : les utilisateurs accèdent de façon sécurisée à des bureaux et à des applications Windows depuis de nombreux types d'appareils et de lieux. Il prend en charge Windows en session unique et en multisession ; en multisession, de nombreux utilisateurs partagent une même machine virtuelle, ce qui réduit le nombre de machines nécessaires."
  options:
    b: { en: "Spreading machines across update and fault domains is the role of an availability set.", fr: "Répartir des machines sur des domaines de mise à jour et d'erreur est le rôle d'un groupe à haute disponibilité." }
    c: { en: "Hosting web applications and APIs on a managed platform describes Azure App Service.", fr: "Héberger des applications web et des API sur une plateforme managée décrit Azure App Service." }
    e: { en: "Adding identical, load-balanced machines with the load describes a virtual machine scale set.", fr: "Ajouter des machines identiques à charge équilibrée selon la charge décrit un groupe de machines virtuelles identiques." }
references:
  - title: "Describe Azure virtual desktop"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/4-virtual-desktop
  - title: "What is Azure Virtual Desktop?"
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/overview
