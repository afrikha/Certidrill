id: az900-2d-dfc-secure-score
objective: "2.4.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender for Cloud calculates [[score]] that summarizes your security posture.

      A higher score indicates [[meaning]].

      To raise the score, you [[how]].
    fr: |
      Microsoft Defender pour le cloud calcule [[score]] qui résume votre posture de sécurité.

      Un score plus élevé indique [[meaning]].

      Pour augmenter le score, vous [[how]].
  slots:
    - id: score
      options:
        - { id: advisor, text: { en: "an Advisor score", fr: "un score Advisor" } }
        - { id: secure, text: { en: "a secure score", fr: "un score de sécurité (secure score)" } }
        - { id: compliance, text: { en: "a compliance score", fr: "un score de conformité (compliance score)" } }
    - id: meaning
      options:
        - { id: lowrisk, text: { en: "a lower identified risk level", fr: "un niveau de risque identifié plus faible" } }
        - { id: alerts, text: { en: "a larger number of open security alerts", fr: "un plus grand nombre d'alertes de sécurité ouvertes" } }
        - { id: cost, text: { en: "a higher monthly cost of security", fr: "un coût mensuel de sécurité plus élevé" } }
    - id: how
      options:
        - { id: regions, text: { en: "deploy the resources to more regions", fr: "déployez les ressources dans davantage de régions" } }
        - { id: dismiss, text: { en: "dismiss the open security alerts", fr: "ignorez les alertes de sécurité ouvertes" } }
        - { id: remediate, text: { en: "remediate the security recommendations", fr: "appliquez les recommandations de sécurité" } }
answer:
  values: { score: secure, meaning: lowrisk, how: remediate }
explanation:
  correct:
    en: "Defender for Cloud aggregates its security findings into a single secure score, so that you can read your security posture at a glance. The higher the score, the lower the identified risk level. The score rises when you remediate the security recommendations that Defender for Cloud issues for your resources."
    fr: "Defender pour le cloud agrège ses constats de sécurité en un seul score de sécurité, pour que vous puissiez lire votre posture de sécurité d'un coup d'œil. Plus le score est élevé, plus le niveau de risque identifié est faible. Le score augmente lorsque vous appliquez les recommandations de sécurité que Defender pour le cloud émet pour vos ressources."
  options:
    advisor: { en: "The Advisor score belongs to Azure Advisor and measures how well you follow its best-practice recommendations.", fr: "Le score Advisor appartient à Azure Advisor et mesure à quel point vous suivez ses recommandations de bonnes pratiques." }
    compliance: { en: "A compliance score measures progress toward regulatory requirements in Microsoft Purview Compliance Manager; it is not the posture score of Defender for Cloud.", fr: "Un score de conformité mesure la progression vers des exigences réglementaires dans le Gestionnaire de conformité Microsoft Purview ; ce n'est pas le score de posture de Defender pour le cloud." }
    dismiss: { en: "The score is driven by recommendations, not by alerts: dismissing alerts does not harden any resource.", fr: "Le score dépend des recommandations, pas des alertes : ignorer des alertes ne renforce aucune ressource." }
references:
  - title: Secure score in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
