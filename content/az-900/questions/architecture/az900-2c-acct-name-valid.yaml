id: az900-2c-acct-name-valid
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to create a storage account for Contoso.

    Which name is valid for the storage account?
  fr: |
    Vous prévoyez de créer un compte de stockage pour Contoso.

    Quel nom est valide pour le compte de stockage ?
body:
  options:
    - { id: a, text: "Contoso-Storage" }
    - { id: b, text: "contoso_storage_2026" }
    - { id: c, text: "contosostorage2026" }
    - { id: d, text: "cs" }
answer: { optionId: c }
explanation:
  correct:
    en: A storage account name has 3 to 24 characters and contains only lowercase letters and digits. The name must also be unique across Azure, because it is part of the address of the data.
    fr: Le nom d'un compte de stockage compte de 3 à 24 caractères et ne contient que des lettres minuscules et des chiffres. Il doit aussi être unique dans tout Azure, car il fait partie de l'adresse des données.
  options:
    a:
      en: Uppercase letters and hyphens aren't allowed in a storage account name.
      fr: Les lettres majuscules et les traits d'union ne sont pas autorisés dans le nom d'un compte de stockage.
    b:
      en: Underscores aren't allowed. Only lowercase letters and digits are accepted.
      fr: Les traits de soulignement ne sont pas autorisés. Seuls les lettres minuscules et les chiffres sont acceptés.
    d:
      en: The name is too short. A storage account name needs at least three characters.
      fr: Le nom est trop court. Le nom d'un compte de stockage doit compter au moins trois caractères.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
