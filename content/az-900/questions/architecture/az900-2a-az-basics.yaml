id: az900-2a-az-basics
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about availability zones, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les zones de disponibilité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Every Azure region supports availability zones."
        fr: "Toutes les régions Azure prennent en charge les zones de disponibilité."
    - id: s2
      text:
        en: "A region that supports availability zones has at least three zones."
        fr: "Une région qui prend en charge les zones de disponibilité compte au moins trois zones."
    - id: s3
      text:
        en: "Each availability zone has its own power, cooling and networking."
        fr: "Chaque zone de disponibilité dispose de sa propre alimentation, de son propre refroidissement et de son propre réseau."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Only some regions are enabled for availability zones. Every region that is enabled has a minimum of three separate zones, and each zone consists of one or more datacenters equipped with independent power, cooling and networking.
    fr: |
      Seules certaines régions prennent en charge les zones de disponibilité. Chaque région qui les prend en charge compte au minimum trois zones distinctes, et chaque zone se compose d'un ou plusieurs centres de données dotés d'une alimentation, d'un refroidissement et d'un réseau indépendants.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
