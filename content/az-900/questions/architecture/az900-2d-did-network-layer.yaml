id: az900-2d-did-network-layer
objective: "2.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum limits the communication between its Azure resources to what is required, and denies all other traffic by default.

    Which layer of the defense-in-depth model does this practice belong to?
  fr: |
    Adatum limite la communication entre ses ressources Azure à ce qui est nécessaire, et refuse par défaut tout autre trafic.

    De quelle couche du modèle de défense en profondeur cette pratique relève-t-elle ?
body:
  options:
    - id: a
      text: { en: "Perimeter", fr: "Périmètre" }
    - id: b
      text: { en: "Network", fr: "Réseau" }
    - id: c
      text: { en: "Compute", fr: "Calcul" }
    - id: d
      text: { en: "Identity and access", fr: "Identité et accès" }
answer: { optionId: b }
explanation:
  correct:
    en: "The network layer limits the connectivity across resources to only what is required, which reduces the risk that an attack spreads. Its measures are to limit communication between resources, deny by default, and restrict inbound and outbound access."
    fr: "La couche réseau limite la connectivité entre les ressources à ce qui est strictement nécessaire, ce qui réduit le risque de propagation d'une attaque. Ses mesures : limiter la communication entre les ressources, refuser par défaut, et restreindre les accès entrants et sortants."
  options:
    a:
      en: "The perimeter layer faces the outside: DDoS protection and perimeter firewalls against network-based attacks, not the traffic between your own resources."
      fr: "La couche périmètre est tournée vers l'extérieur : protection DDoS et pare-feux de périmètre contre les attaques réseau, pas le trafic entre vos propres ressources."
    c:
      en: "The compute layer secures the virtual machines themselves: secured access, endpoint protection and patching."
      fr: "La couche calcul sécurise les machines virtuelles elles-mêmes : accès sécurisé, protection des points de terminaison et correctifs."
    d:
      en: "The identity and access layer controls who signs in and what they may access, not the network traffic between resources."
      fr: "La couche identité et accès contrôle qui se connecte et à quoi il peut accéder, pas le trafic réseau entre les ressources."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
