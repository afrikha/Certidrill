id: az900-2b-stor-files-share
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware wants to replace an on-premises file server. Windows, Linux and macOS computers must mount the shared folders by using the SMB protocol.

    Which Azure Storage service should Litware use?
  fr: |
    Litware veut remplacer un serveur de fichiers local. Des ordinateurs Windows, Linux et macOS doivent monter les dossiers partagés à l'aide du protocole SMB.

    Quel service du Stockage Azure Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Azure Files" }
    - { id: b, text: { en: "Azure Blobs", fr: "Objets blob Azure" } }
    - { id: c, text: { en: "Azure Disks", fr: "Disques Azure" } }
    - { id: d, text: { en: "Azure Tables", fr: "Tables Azure" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Files offers fully managed file shares in the cloud, accessed over the SMB or NFS protocols. SMB shares can be mounted from Windows, Linux and macOS clients, which makes the service a replacement or a supplement for on-premises file servers."
    fr: "Azure Files propose des partages de fichiers entièrement managés dans le cloud, accessibles par les protocoles SMB ou NFS. Les partages SMB peuvent être montés depuis des clients Windows, Linux et macOS, ce qui fait du service un remplacement ou un complément des serveurs de fichiers locaux."
  options:
    b: { en: "Azure Blobs stores objects in containers, reached over HTTP or HTTPS; it doesn't provide SMB shares.", fr: "Objets blob Azure stocke des objets dans des conteneurs, accessibles en HTTP ou HTTPS ; il ne fournit pas de partages SMB." }
    c: { en: "Azure Disks provides volumes attached to Azure virtual machines, not shares for many computers.", fr: "Disques Azure fournit des volumes attachés à des machines virtuelles Azure, pas des partages pour de nombreux ordinateurs." }
    d: { en: "Azure Tables stores structured, non-relational data, not files.", fr: "Tables Azure stocke des données structurées non relationnelles, pas des fichiers." }
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "What is Azure Files?"
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
