id: az900-2d-zt-workforce
objective: "2.4.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the Zero Trust model, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le modèle Confiance Zéro, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Zero Trust model protects user identities, but it does not apply to devices and applications."
        fr: "Le modèle Confiance Zéro protège les identités des utilisateurs, mais ne s'applique pas aux appareils ni aux applications."
    - id: s2
      text:
        en: "The Zero Trust model is suited to a mobile workforce that connects from any location."
        fr: "Le modèle Confiance Zéro convient à des employés mobiles qui se connectent depuis n'importe quel endroit."
    - id: s3
      text:
        en: "The Zero Trust model requires all users to work from managed computers that are connected to the corporate network."
        fr: "Le modèle Confiance Zéro exige que tous les utilisateurs travaillent depuis des ordinateurs gérés connectés au réseau de l'entreprise."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Zero Trust is recommended for modern environments because it embraces the mobile workforce and protects people, devices, applications and data wherever they are located. It does not confine work to managed computers on the corporate network, which is how the traditional perimeter model operated: a request from any device and any network is evaluated, and access depends on that evaluation."
    fr: "La Confiance Zéro est recommandée pour les environnements modernes parce qu'elle s'adapte aux employés mobiles et protège les personnes, les appareils, les applications et les données où qu'ils se trouvent. Elle ne cantonne pas le travail aux ordinateurs gérés du réseau de l'entreprise, ce qui était le fonctionnement du modèle traditionnel fondé sur le périmètre : une requête venant de n'importe quel appareil et de n'importe quel réseau est évaluée, et l'accès dépend de cette évaluation."
  options:
    s1:
      en: "The model covers people, devices, applications and data, not identities alone."
      fr: "Le modèle couvre les personnes, les appareils, les applications et les données, pas seulement les identités."
    s3:
      en: "Restricting the network to managed computers and tightly controlled VPN access describes the traditional model, not Zero Trust."
      fr: "Restreindre le réseau aux ordinateurs gérés et à un accès VPN étroitement contrôlé décrit le modèle traditionnel, pas la Confiance Zéro."
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
