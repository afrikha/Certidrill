id: az900-2c-mig-yn-migrate
objective: "2.3.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Migrate, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Migrate, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Migrate can assess servers that run on Hyper-V and servers that run on physical hardware.
        fr: Azure Migrate peut évaluer des serveurs qui s'exécutent sur Hyper-V et des serveurs qui s'exécutent sur du matériel physique.
    - id: s2
      text:
        en: Azure Migrate provides a single portal to track the discovery, the assessment and the migration.
        fr: Azure Migrate fournit un portail unique pour suivre la découverte, l'évaluation et la migration.
    - id: s3
      text:
        en: Azure Migrate handles virtual machines only. It includes no tool for databases or web applications.
        fr: Azure Migrate ne traite que les machines virtuelles. Il n'inclut aucun outil pour les bases de données ni pour les applications web.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Azure Migrate is a hub that offers one portal to discover, assess and migrate an on-premises environment. It covers VMware and Hyper-V virtual machines and physical servers. It also brings together tools for databases and for web applications.
    fr: Azure Migrate est un hub qui offre un portail unique pour découvrir, évaluer et migrer un environnement local. Il couvre les machines virtuelles VMware et Hyper-V ainsi que les serveurs physiques. Il réunit aussi des outils pour les bases de données et pour les applications web.
  options:
    s3:
      en: The hub also covers databases, with Azure Database Migration Service, and web applications, which can be moved to Azure App Service.
      fr: Le hub couvre aussi les bases de données, avec Azure Database Migration Service, et les applications web, qui peuvent être déplacées vers Azure App Service.
references:
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
