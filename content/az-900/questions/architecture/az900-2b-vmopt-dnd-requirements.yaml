id: az900-2b-vmopt-dnd-requirements
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each requirement to the virtual machine option that meets it. To answer, drag the appropriate option to the correct requirement. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin à l'option de machine virtuelle qui y répond. Pour répondre, faites glisser l'option appropriée vers le besoin correspondant. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vmss, text: { en: "A virtual machine scale set", fr: "Un groupe de machines virtuelles identiques" } }
    - { id: avset, text: { en: "An availability set", fr: "Un groupe à haute disponibilité" } }
    - { id: avd, text: "Azure Virtual Desktop" }
    - { id: vm, text: { en: "A single virtual machine", fr: "Une machine virtuelle unique" } }
  targets:
    - { id: t1, text: { en: "Keep at least one virtual machine of an application running during a hardware failure or planned maintenance", fr: "Garder au moins une machine virtuelle d'une application en service pendant une panne matérielle ou une maintenance planifiée" } }
    - { id: t2, text: { en: "Test a new operating system configuration quickly, then delete the environment", fr: "Tester rapidement une nouvelle configuration de système d'exploitation, puis supprimer l'environnement" } }
    - { id: t3, text: { en: "Automatically add identical virtual machines when the load of an application increases", fr: "Ajouter automatiquement des machines virtuelles identiques lorsque la charge d'une application augmente" } }
answer:
  mapping: { t1: avset, t2: vm, t3: vmss }
explanation:
  correct:
    en: "An availability set groups virtual machines by update domain and fault domain, so that one maintenance event or hardware failure doesn't affect them all. A single virtual machine is enough for testing and development: you create a configuration quickly and remove it when the test is finished. A scale set manages identical, load-balanced virtual machines and scales out automatically with demand."
    fr: "Un groupe à haute disponibilité regroupe les machines virtuelles par domaine de mise à jour et par domaine d'erreur, afin qu'une opération de maintenance ou une panne matérielle ne les touche pas toutes. Une machine virtuelle unique suffit pour les tests et le développement : vous créez rapidement une configuration et vous la supprimez à la fin du test. Un groupe identique gère des machines virtuelles identiques à charge équilibrée et augmente automatiquement leur nombre selon la demande."
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
