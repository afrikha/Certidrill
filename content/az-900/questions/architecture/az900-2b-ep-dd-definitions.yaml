id: az900-2b-ep-dd-definitions
objective: "2.2.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A public endpoint has [[s1]].

      A private endpoint has [[s2]].
    fr: |
      Un point de terminaison public a [[s1]].

      Un point de terminaison privé a [[s2]].
  slots:
    - id: s1
      options:
        - { id: pub, text: { en: "a public IP address and can be accessed from anywhere in the world", fr: "une adresse IP publique et est accessible de partout dans le monde" } }
        - { id: none, text: { en: "no IP address and can be accessed only by its name", fr: "aucune adresse IP et n'est accessible que par son nom" } }
        - { id: priv, text: { en: "a private IP address from the address space of a virtual network", fr: "une adresse IP privée issue de l'espace d'adressage d'un réseau virtuel" } }
    - id: s2
      options:
        - { id: none, text: { en: "no IP address and can be accessed only by its name", fr: "aucune adresse IP et n'est accessible que par son nom" } }
        - { id: priv, text: { en: "a private IP address from the address space of a virtual network", fr: "une adresse IP privée issue de l'espace d'adressage d'un réseau virtuel" } }
        - { id: pub, text: { en: "a public IP address and can be accessed from anywhere in the world", fr: "une adresse IP publique et est accessible de partout dans le monde" } }
answer:
  values: { s1: pub, s2: priv }
explanation:
  correct:
    en: "Azure virtual networking supports both kinds of endpoints. A public endpoint has a public IP address and can be accessed from anywhere in the world. A private endpoint exists within a virtual network and has a private IP address from the address space of that virtual network."
    fr: "La mise en réseau virtuelle Azure prend en charge les deux types de points de terminaison. Un point de terminaison public a une adresse IP publique et est accessible de partout dans le monde. Un point de terminaison privé existe dans un réseau virtuel et a une adresse IP privée issue de l'espace d'adressage de ce réseau virtuel."
  options:
    none: { en: "Every endpoint has an IP address: public for a public endpoint, private for a private endpoint.", fr: "Tout point de terminaison a une adresse IP : publique pour un point de terminaison public, privée pour un point de terminaison privé." }
references:
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
