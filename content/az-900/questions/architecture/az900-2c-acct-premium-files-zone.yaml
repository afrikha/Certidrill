id: az900-2c-acct-premium-files-zone
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam needs Azure file shares on solid-state drives for a latency-sensitive application. The shares must remain available if one availability zone of the region fails.

    Which storage account configuration should you use?
  fr: |
    Fabrikam a besoin de partages de fichiers Azure sur des disques SSD pour une application sensible à la latence. Les partages doivent rester disponibles si une zone de disponibilité de la région tombe en panne.

    Quelle configuration de compte de stockage devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Premium file shares with zone-redundant storage (ZRS)", fr: "Partages de fichiers Premium avec le stockage redondant interzone (ZRS)" }
    - id: b
      text: { en: "Premium file shares with geo-redundant storage (GRS)", fr: "Partages de fichiers Premium avec le stockage géoredondant (GRS)" }
    - id: c
      text: { en: "Premium block blobs with zone-redundant storage (ZRS)", fr: "Objets blob de blocs Premium avec le stockage redondant interzone (ZRS)" }
    - id: d
      text: { en: "Standard general-purpose v2 with zone-redundant storage (ZRS)", fr: "Usage général v2 Standard avec le stockage redondant interzone (ZRS)" }
answer: { optionId: a }
explanation:
  correct:
    en: File shares on solid-state drives require a premium file shares account. Premium accounts support LRS and ZRS, and ZRS keeps the data available when one availability zone fails.
    fr: Des partages de fichiers sur des disques SSD exigent un compte de partages de fichiers Premium. Les comptes Premium prennent en charge LRS et ZRS, et ZRS garde les données disponibles lorsqu'une zone de disponibilité tombe en panne.
  options:
    b:
      en: Premium accounts don't offer geo-redundant storage. Only LRS and ZRS are available for them.
      fr: Les comptes Premium ne proposent pas le stockage géoredondant. Seuls LRS et ZRS sont disponibles pour eux.
    c:
      en: A premium block blobs account stores block blobs and append blobs. It can't host Azure file shares.
      fr: Un compte d'objets blob de blocs Premium stocke des objets blob de blocs et d'ajout. Il ne peut pas héberger de partages de fichiers Azure.
    d:
      en: A standard general-purpose v2 account supports file shares and ZRS, but it isn't a premium account that stores data on solid-state drives.
      fr: Un compte à usage général v2 Standard prend en charge les partages de fichiers et ZRS, mais ce n'est pas un compte Premium qui stocke les données sur des disques SSD.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
