id: az900-2c-tier-archive-compliance
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must keep scanned account statements for eight years to meet a compliance requirement. The scans are almost never read, and waiting several hours before a scan can be read is acceptable.

    Which access tier minimizes the storage cost?
  fr: |
    Woodgrove Bank doit conserver des relevés de compte numérisés pendant huit ans pour répondre à une exigence de conformité. Ces fichiers ne sont presque jamais lus, et un délai de plusieurs heures avant de pouvoir en lire un est acceptable.

    Quel niveau d'accès réduit au minimum le coût de stockage ?
body:
  options:
    - id: a
      text: { en: "Archive", fr: "Archive" }
    - id: b
      text: { en: "Cold", fr: "Froid (Cold)" }
    - id: c
      text: { en: "Cool", fr: "Froid (Cool)" }
    - id: d
      text: { en: "Hot", fr: "Chaud (Hot)" }
answer: { optionId: a }
explanation:
  correct:
    en: The archive tier has the lowest storage cost. It is an offline tier intended for data that is rarely accessed and that tolerates a retrieval delay of several hours, which is the case here.
    fr: Le niveau archive (Archive) a le coût de stockage le plus bas. C'est un niveau hors connexion destiné aux données rarement consultées et qui tolèrent un délai de récupération de plusieurs heures, ce qui est le cas ici.
  options:
    b:
      en: The cold tier is an online tier for rarely accessed data that must stay immediately readable. Its storage cost is higher than that of the archive tier.
      fr: Le niveau froid (Cold) est un niveau en ligne pour des données rarement consultées qui doivent rester lisibles immédiatement. Son coût de stockage est plus élevé que celui du niveau archive (Archive).
    c:
      en: The cool tier is an online tier for infrequently accessed data. It costs more to store data in it than in the cold and archive tiers.
      fr: Le niveau froid (Cool) est un niveau en ligne pour des données consultées peu fréquemment. Le stockage y coûte plus cher que dans les niveaux froid (Cold) et archive (Archive).
    d:
      en: The hot tier is intended for frequently accessed data. It has the highest storage cost.
      fr: Le niveau chaud (Hot) est destiné aux données consultées fréquemment. Il a le coût de stockage le plus élevé.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
