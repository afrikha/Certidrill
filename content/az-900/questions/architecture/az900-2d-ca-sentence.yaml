id: az900-2d-ca-sentence
objective: "2.4.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Conditional Access is a tool of [[service]].

      It evaluates signals such as [[signal]], and then allows access, blocks access or [[action]].
    fr: |
      L'accès conditionnel est un outil du service [[service]].

      Il évalue des signaux tels que [[signal]], puis autorise l'accès, le bloque ou [[action]].
  slots:
    - id: service
      options:
        - { id: policy, text: "Azure Policy" }
        - { id: entra, text: "Microsoft Entra ID" }
        - { id: dfc, text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" } }
    - id: signal
      options:
        - { id: userdev, text: { en: "the location and the device of the user", fr: "l'emplacement et l'appareil de l'utilisateur" } }
        - { id: tags, text: { en: "the tags and the region of the resource", fr: "les étiquettes et la région de la ressource" } }
        - { id: budget, text: { en: "the budget and the spending of the subscription", fr: "le budget et les dépenses de l'abonnement" } }
    - id: action
      options:
        - { id: lock, text: { en: "applies a resource lock", fr: "applique un verrou de ressource" } }
        - { id: reader, text: { en: "assigns the Reader role", fr: "attribue le rôle Reader" } }
        - { id: mfa, text: { en: "requires multifactor authentication", fr: "exige l'authentification multifacteur" } }
answer:
  values: { service: entra, signal: userdev, action: mfa }
explanation:
  correct:
    en: "Conditional Access is the Microsoft Entra ID tool that allows or denies access to resources based on identity signals: who the user is, where the user is and which device is used. Once it has decided, it enforces the decision by allowing the request, blocking it or challenging the user for multifactor authentication."
    fr: "L'accès conditionnel est l'outil de Microsoft Entra ID qui autorise ou refuse l'accès aux ressources en fonction de signaux d'identité : qui est l'utilisateur, où il se trouve et quel appareil il utilise. Une fois la décision prise, il l'applique en autorisant la demande, en la bloquant ou en demandant à l'utilisateur une authentification multifacteur."
  options:
    policy: { en: "Azure Policy enforces rules on the configuration of resources; it does not process sign-ins.", fr: "Azure Policy applique des règles à la configuration des ressources ; il ne traite pas les connexions." }
    tags: { en: "Tags and regions describe resources; Conditional Access looks at the sign-in, not at resource metadata.", fr: "Les étiquettes et les régions décrivent des ressources ; l'accès conditionnel examine la connexion, pas les métadonnées des ressources." }
    reader: { en: "Role assignments are made with Azure RBAC, not by a Conditional Access decision.", fr: "Les attributions de rôles se font avec Azure RBAC, pas par une décision de l'accès conditionnel." }
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
