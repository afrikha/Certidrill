id: az900-2b-host-dd-app-service
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure App Service is [[s1]] offering for hosting web applications and REST APIs. Compared with hosting on virtual machines, App Service gives you [[s2]].
    fr: |
      Azure App Service est une offre [[s1]] pour héberger des applications web et des API REST. Par rapport à un hébergement sur des machines virtuelles, App Service vous donne [[s2]].
  slots:
    - id: s1
      options:
        - { id: iaas, text: { en: "an infrastructure as a service (IaaS)", fr: "IaaS (infrastructure as a service)" } }
        - { id: paas, text: { en: "a platform as a service (PaaS)", fr: "PaaS (platform as a service)" } }
        - { id: saas, text: { en: "a software as a service (SaaS)", fr: "SaaS (software as a service)" } }
    - id: s2
      options:
        - { id: more, text: { en: "more control of the hosting environment and more infrastructure to manage", fr: "plus de contrôle de l'environnement d'hébergement et plus d'infrastructure à gérer" } }
        - { id: same, text: { en: "the same control of the operating system and less infrastructure to manage", fr: "le même contrôle du système d'exploitation et moins d'infrastructure à gérer" } }
        - { id: less, text: { en: "less control of the hosting environment and less infrastructure to manage", fr: "moins de contrôle de l'environnement d'hébergement et moins d'infrastructure à gérer" } }
answer:
  values: { s1: paas, s2: less }
explanation:
  correct:
    en: "App Service is a managed platform: you deploy web applications, mobile back ends and REST APIs without managing the underlying infrastructure. Virtual machines sit at the other end of the hosting spectrum: they give maximum control of the hosting environment, at the price of managing the servers yourself."
    fr: "App Service est une plateforme managée : vous déployez des applications web, des back-ends mobiles et des API REST sans gérer l'infrastructure sous-jacente. Les machines virtuelles se situent à l'autre extrémité du spectre d'hébergement : elles donnent un contrôle maximal de l'environnement d'hébergement, au prix de la gestion des serveurs par vos soins."
  options:
    iaas: { en: "IaaS describes virtual machines, on which you manage the operating system.", fr: "IaaS décrit les machines virtuelles, dont vous gérez le système d'exploitation." }
    saas: { en: "SaaS is finished software that you only use; with App Service you still deploy your own application.", fr: "SaaS désigne un logiciel fini que vous vous contentez d'utiliser ; avec App Service, vous déployez toujours votre propre application." }
references:
  - title: "Describe application hosting options"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options
  - title: "App Service overview"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview
