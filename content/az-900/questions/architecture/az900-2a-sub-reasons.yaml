id: az900-2a-sub-reasons
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has one Azure subscription and considers creating a second one.

    Which two needs justify an additional subscription?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un abonnement Azure et envisage d'en créer un deuxième.

    Quels sont les deux besoins qui justifient un abonnement supplémentaire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Isolating the development environment from the production environment", fr: "Isoler l'environnement de développement de l'environnement de production" } }
    - { id: b, text: { en: "Deploying resources to a second Azure region", fr: "Déployer des ressources dans une deuxième région Azure" } }
    - { id: c, text: { en: "Managing and tracking the costs of a project team separately", fr: "Gérer et suivre séparément les coûts d'une équipe projet" } }
    - { id: d, text: { en: "Placing the same resource in two resource groups", fr: "Placer la même ressource dans deux groupes de ressources" } }
    - { id: e, text: { en: "Spreading virtual machines across availability zones", fr: "Répartir des machines virtuelles entre des zones de disponibilité" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Additional subscriptions are typically created to separate environments (development, test, production), because access control is applied per subscription, and to give a team or a workload its own boundary with its own billing report and invoice.
    fr: |
      Les abonnements supplémentaires servent en général à séparer les environnements (développement, test, production), car le contrôle d'accès s'applique par abonnement, et à donner à une équipe ou à une charge de travail sa propre limite, avec son propre rapport de facturation et sa propre facture.
  options:
    b: { en: "One subscription can deploy resources to any number of regions.", fr: "Un seul abonnement peut déployer des ressources dans un nombre quelconque de régions." }
    d: { en: "A resource belongs to exactly one resource group, whatever the number of subscriptions.", fr: "Une ressource appartient à un seul groupe de ressources, quel que soit le nombre d'abonnements." }
    e: { en: "Availability zones are selected inside a region and do not depend on the number of subscriptions.", fr: "Les zones de disponibilité se sélectionnent à l'intérieur d'une région et ne dépendent pas du nombre d'abonnements." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
