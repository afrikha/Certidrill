id: az900-2b-vmopt-zones-scale-set
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum hosts an application on virtual machines in an Azure region that has availability zones. The number of virtual machines must follow demand automatically, and the application must stay available if one datacenter fails.

    What should Adatum deploy?
  fr: |
    Adatum héberge une application sur des machines virtuelles dans une région Azure dotée de zones de disponibilité. Le nombre de machines virtuelles doit suivre automatiquement la demande, et l'application doit rester disponible si un centre de données tombe en panne.

    Que doit déployer Adatum ?
body:
  options:
    - { id: a, text: { en: "An availability set that has three fault domains", fr: "Un groupe à haute disponibilité doté de trois domaines d'erreur" } }
    - { id: b, text: { en: "A virtual machine scale set in a single availability zone", fr: "Un groupe de machines virtuelles identiques dans une seule zone de disponibilité" } }
    - { id: c, text: { en: "A virtual machine scale set that spans availability zones", fr: "Un groupe de machines virtuelles identiques réparti sur plusieurs zones de disponibilité" } }
    - { id: d, text: { en: "An availability set that has five update domains", fr: "Un groupe à haute disponibilité doté de cinq domaines de mise à jour" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A scale set increases or decreases the number of virtual machines automatically with demand. Distributing its instances across the availability zones of the region protects the application against the failure of a datacenter."
    fr: "Un groupe identique augmente ou réduit automatiquement le nombre de machines virtuelles selon la demande. La répartition de ses instances sur les zones de disponibilité de la région protège l'application contre la panne d'un centre de données."
  options:
    a: { en: "An availability set doesn't change the number of machines, and its fault domains don't protect against a datacenter-level failure.", fr: "Un groupe à haute disponibilité ne modifie pas le nombre de machines, et ses domaines d'erreur ne protègent pas d'une panne à l'échelle du centre de données." }
    b: { en: "The scale set follows demand, but all its machines are in one zone and can be lost together with a datacenter.", fr: "Le groupe identique suit la demande, mais toutes ses machines sont dans une seule zone et peuvent être perdues ensemble avec un centre de données." }
    d: { en: "Update domains only limit the restarts during planned maintenance; an availability set neither scales automatically nor survives the loss of a datacenter.", fr: "Les domaines de mise à jour limitent seulement les redémarrages pendant une maintenance planifiée ; un groupe à haute disponibilité ne se met pas à l'échelle automatiquement et ne survit pas à la perte d'un centre de données." }
references:
  - title: "What are Virtual Machine Scale Sets?"
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
  - title: "Availability sets overview"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
