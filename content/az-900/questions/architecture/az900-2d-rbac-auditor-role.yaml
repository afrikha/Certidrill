id: az900-2d-rbac-auditor-role
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor must be able to view every resource of an Azure subscription. The auditor must not be able to change anything.

    Which built-in role should you assign to the auditor at the subscription scope?
  fr: |
    Un auditeur externe doit pouvoir consulter toutes les ressources d'un abonnement Azure. Il ne doit rien pouvoir modifier.

    Quel rôle intégré devez-vous attribuer à l'auditeur à l'étendue de l'abonnement ?
body:
  options:
    - { id: a, text: Reader }
    - { id: b, text: Contributor }
    - { id: c, text: Owner }
    - { id: d, text: Virtual Machine Contributor }
answer: { optionId: a }
explanation:
  correct:
    en: "The Reader role lets a user view all the resources of the scope without making any change. Assigned at the subscription scope, it is inherited by every resource group and resource of the subscription."
    fr: "Le rôle Reader permet de consulter toutes les ressources de l'étendue sans y apporter aucune modification. Attribué à l'étendue de l'abonnement, il est hérité par tous les groupes de ressources et toutes les ressources de l'abonnement."
  options:
    b:
      en: "Contributor grants full access to manage all resources, so the auditor could create, change and delete them."
      fr: "Contributor accorde un accès complet pour gérer toutes les ressources : l'auditeur pourrait en créer, en modifier et en supprimer."
    c:
      en: "Owner grants full access to all resources and, in addition, the ability to assign roles to others."
      fr: "Owner accorde un accès complet à toutes les ressources et, en plus, la possibilité d'attribuer des rôles à d'autres."
    d:
      en: "Virtual Machine Contributor lets a user create and manage virtual machines; it is neither read-only nor a view of every resource."
      fr: "Virtual Machine Contributor permet de créer et de gérer des machines virtuelles ; ce n'est ni un rôle en lecture seule ni une vue de toutes les ressources."
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - title: Describe Azure role-based access control
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control
