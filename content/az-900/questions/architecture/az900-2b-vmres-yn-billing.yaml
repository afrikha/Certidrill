id: az900-2b-vmres-yn-billing
objective: "2.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that has a public IP address.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** dotée d'une adresse IP publique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "While VM1 is stopped (deallocated), you continue to pay for its disks.", fr: "Tant que VM1 est arrêtée (libérée), vous continuez de payer ses disques." } }
    - { id: s2, text: { en: "The price of the public IP address is included in the compute price of VM1.", fr: "Le prix de l'adresse IP publique est compris dans le prix de calcul de VM1." } }
    - { id: s3, text: { en: "While VM1 is stopped (deallocated), you are not charged for its compute time.", fr: "Tant que VM1 est arrêtée (libérée), le temps de calcul ne vous est pas facturé." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A deallocated virtual machine has released its hardware, so its instance usage is no longer billed. Other resources, such as the disks, continue to incur charges. Storage and public IP addresses are billed separately from the compute price of the machine."
    fr: "Une machine virtuelle libérée a rendu son matériel : l'utilisation de l'instance n'est plus facturée. D'autres ressources, comme les disques, continuent d'être facturées. Le stockage et les adresses IP publiques sont facturés séparément du prix de calcul de la machine."
references:
  - title: "States and billing status of Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
