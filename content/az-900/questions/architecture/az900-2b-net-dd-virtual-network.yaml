id: az900-2b-net-dd-virtual-network
objective: "2.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An Azure virtual network is scoped to [[s1]]. To segment a virtual network, you divide its address space into [[s2]].
    fr: |
      Un réseau virtuel Azure a pour étendue [[s1]]. Pour segmenter un réseau virtuel, vous divisez son espace d'adressage en [[s2]].
  slots:
    - id: s1
      options:
        - { id: geo, text: { en: "all the regions of a geography", fr: "toutes les régions d'une zone géographique" } }
        - { id: one, text: { en: "a single region", fr: "une seule région" } }
        - { id: all, text: { en: "all Azure regions", fr: "toutes les régions Azure" } }
    - id: s2
      options:
        - { id: rg, text: { en: "resource groups", fr: "groupes de ressources" } }
        - { id: az, text: { en: "availability zones", fr: "zones de disponibilité" } }
        - { id: sub, text: { en: "subnets", fr: "sous-réseaux" } }
answer:
  values: { s1: one, s2: sub }
explanation:
  correct:
    en: "A virtual network is scoped to a single region and a single subscription; virtual networks in different regions are connected with peering. Inside a virtual network, the private address space is divided into subnets, each of which receives a part of the address space."
    fr: "Un réseau virtuel a pour étendue une seule région et un seul abonnement ; les réseaux virtuels de régions différentes se connectent par peering. Dans un réseau virtuel, l'espace d'adressage privé est divisé en sous-réseaux, chacun recevant une partie de l'espace d'adressage."
  options:
    rg: { en: "Resource groups are logical containers of resources; they don't segment an address space.", fr: "Les groupes de ressources sont des conteneurs logiques de ressources ; ils ne segmentent pas un espace d'adressage." }
    az: { en: "Availability zones are physical locations in a region; a virtual network and its subnets span all of them.", fr: "Les zones de disponibilité sont des emplacements physiques d'une région ; un réseau virtuel et ses sous-réseaux les couvrent toutes." }
references:
  - title: "Azure Virtual Network concepts and best practices"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/concepts-and-best-practices
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
