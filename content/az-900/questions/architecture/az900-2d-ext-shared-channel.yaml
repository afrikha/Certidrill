id: az900-2d-ext-shared-channel
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso and Fabrikam each have a Microsoft Entra tenant. Engineers of both companies must work together in a Microsoft Teams shared channel that Contoso hosts. The Fabrikam engineers must reach the channel from their own Teams environment, and they must not be added to the Contoso directory.

    Which capability of Microsoft Entra External ID should Contoso use?
  fr: |
    Contoso et Fabrikam possèdent chacune un locataire Microsoft Entra. Des ingénieurs des deux entreprises doivent travailler ensemble dans un canal partagé Microsoft Teams hébergé par Contoso. Les ingénieurs de Fabrikam doivent accéder au canal depuis leur propre environnement Teams, et ils ne doivent pas être ajoutés à l'annuaire de Contoso.

    Quelle capacité de Microsoft Entra External ID Contoso doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "B2B collaboration", fr: "La collaboration B2B" }
    - id: b
      text: { en: "An external tenant", fr: "Un locataire externe" }
    - id: c
      text: { en: "Self-service sign-up", fr: "L'inscription en libre-service" }
    - id: d
      text: { en: "B2B direct connect", fr: "La connexion directe B2B" }
answer: { optionId: d }
explanation:
  correct:
    en: "B2B direct connect sets up a mutual trust between two Microsoft Entra organizations and is the capability behind Teams shared channels. The external users authenticate in their home organization, work from their own instance of Teams, and are not added to the directory of the organization that hosts the channel."
    fr: "La connexion directe B2B établit une approbation mutuelle entre deux organisations Microsoft Entra, et c'est la capacité sur laquelle reposent les canaux partagés Teams. Les utilisateurs externes s'authentifient dans leur organisation d'origine, travaillent depuis leur propre instance de Teams et ne sont pas ajoutés à l'annuaire de l'organisation qui héberge le canal."
  options:
    a:
      en: "B2B collaboration creates a guest user object in the Contoso directory for each external user, which the requirement rules out."
      fr: "La collaboration B2B crée dans l'annuaire de Contoso un objet utilisateur invité pour chaque utilisateur externe, ce que l'exigence exclut."
    b:
      en: "An external tenant manages the customers of an application that you publish, not the employees of a partner organization in Teams."
      fr: "Un locataire externe gère les clients d'une application que vous publiez, pas les employés d'une organisation partenaire dans Teams."
    c:
      en: "Self-service sign-up lets external users register for an application by themselves; the users it creates are added to the directory."
      fr: "L'inscription en libre-service permet à des utilisateurs externes de s'inscrire eux-mêmes à une application ; les utilisateurs ainsi créés sont ajoutés à l'annuaire."
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
  - title: Describe Azure external identities
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities
