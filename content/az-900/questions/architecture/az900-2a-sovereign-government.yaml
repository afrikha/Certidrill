id: az900-2a-sovereign-government
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your organization evaluates the Azure Government regions, such as US Gov Virginia.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation évalue les régions Azure Government, comme US Gov Virginia.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Government is an instance of Azure that is physically isolated from the main instance of Azure."
        fr: "Azure Government est une instance d'Azure physiquement isolée de l'instance principale d'Azure."
    - id: s2
      text:
        en: "The Azure Government datacenters are located only in the United States."
        fr: "Les centres de données Azure Government se trouvent uniquement aux États-Unis."
    - id: s3
      text:
        en: "Any company that has an office in the United States can deploy resources to US Gov Virginia."
        fr: "Toute entreprise qui possède un bureau aux États-Unis peut déployer des ressources dans US Gov Virginia."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Azure Government is a sovereign cloud: it uses physically isolated datacenters and networks, all located in the United States, and access to the systems is limited to screened US persons. It is reserved for US federal, state and local government entities and their partners, and eligibility is validated, so having an office in the United States is not enough.
    fr: |
      Azure Government est un cloud souverain : il utilise des centres de données et des réseaux physiquement isolés, tous situés aux États-Unis, et l'accès aux systèmes est limité à du personnel américain habilité. Il est réservé aux entités gouvernementales américaines (fédérales, des États et locales) et à leurs partenaires, et l'éligibilité est vérifiée : posséder un bureau aux États-Unis ne suffit donc pas.
references:
  - title: What is Azure Government?
    url: https://learn.microsoft.com/en-us/azure/azure-government/documentation-government-welcome
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
