id: az900-2c-tier-dnd-descriptions
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each blob access tier to its description. To answer, drag the appropriate tiers to the correct descriptions. Each tier may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque niveau d'accès des objets blob à sa description. Pour répondre, faites glisser les niveaux appropriés vers les descriptions correspondantes. Chaque niveau peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hot, text: { en: "Hot", fr: "Chaud (Hot)" } }
    - { id: cool, text: { en: "Cool", fr: "Froid (Cool)" } }
    - { id: cold, text: { en: "Cold", fr: "Froid (Cold)" } }
    - { id: archive, text: { en: "Archive", fr: "Archive" } }
  targets:
    - id: t1
      text: { en: "Offline tier for rarely accessed data that is stored for at least 180 days", fr: "Niveau hors connexion pour des données rarement consultées et stockées au moins 180 jours" }
    - id: t2
      text: { en: "Online tier for infrequently accessed data that is stored for at least 30 days", fr: "Niveau en ligne pour des données consultées peu fréquemment et stockées au moins 30 jours" }
    - id: t3
      text: { en: "Online tier for rarely accessed data that is stored for at least 90 days", fr: "Niveau en ligne pour des données rarement consultées et stockées au moins 90 jours" }
answer:
  mapping: { t1: archive, t2: cool, t3: cold }
explanation:
  correct:
    en: The cool tier is meant for data kept at least 30 days, the cold tier for data kept at least 90 days, and the archive tier for data kept at least 180 days. Cool and cold are online tiers, whereas archive is offline. The hot tier is for frequently accessed data and has no minimum storage duration.
    fr: Le niveau froid (Cool) est prévu pour des données conservées au moins 30 jours, le niveau froid (Cold) pour des données conservées au moins 90 jours et le niveau archive (Archive) pour des données conservées au moins 180 jours. Les niveaux froid (Cool) et froid (Cold) sont en ligne, alors que le niveau archive (Archive) est hors connexion. Le niveau chaud (Hot) concerne les données consultées fréquemment et n'a pas de durée minimale de stockage.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
