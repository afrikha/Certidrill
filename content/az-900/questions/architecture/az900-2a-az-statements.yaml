id: az900-2a-az-statements
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about availability zones are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies concernant les zones de disponibilité ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The zones of a region are located in different geographies.", fr: "Les zones d'une région sont situées dans des zones géographiques différentes." } }
    - { id: b, text: { en: "The zones of a region are connected by high-speed private fiber-optic networks.", fr: "Les zones d'une région sont reliées par des réseaux privés en fibre optique à haut débit." } }
    - { id: c, text: { en: "An availability zone always consists of exactly one datacenter.", fr: "Une zone de disponibilité se compose toujours d'un seul centre de données." } }
    - { id: d, text: { en: "If one zone of a region goes down, the other zones continue working.", fr: "Si une zone d'une région tombe en panne, les autres zones continuent de fonctionner." } }
    - { id: e, text: { en: "You need a separate subscription for each zone that you use.", fr: "Vous avez besoin d'un abonnement distinct pour chaque zone que vous utilisez." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Each availability zone is an isolation boundary: when one zone has an outage, the others keep running. The zones of a region are linked by private high-speed fiber-optic networks, which allows resources to be replicated between them.
    fr: |
      Chaque zone de disponibilité est une limite d'isolation : quand une zone subit une panne, les autres continuent de fonctionner. Les zones d'une région sont reliées par des réseaux privés en fibre optique à haut débit, ce qui permet de répliquer les ressources entre elles.
  options:
    a: { en: "All the zones of a region are inside that region, and a region belongs to a single geography.", fr: "Toutes les zones d'une région se trouvent dans cette région, et une région appartient à une seule zone géographique." }
    c: { en: "A zone is made up of one or more datacenters.", fr: "Une zone se compose d'un ou plusieurs centres de données." }
    e: { en: "A single subscription can deploy resources to every zone of a region.", fr: "Un seul abonnement peut déployer des ressources dans toutes les zones d'une région." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
