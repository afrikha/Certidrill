id: az900-2c-move-explorer-gui
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A designer at Fabrikam uses a macOS laptop. The designer wants a graphical application to browse blob containers and to upload and download files.

    Which tool should the designer use?
  fr: |
    Une graphiste de Fabrikam utilise un ordinateur portable macOS. Elle souhaite une application graphique pour parcourir des conteneurs d'objets blob, charger des fichiers et en télécharger.

    Quel outil doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AzCopy", fr: "AzCopy" }
    - id: b
      text: { en: "Azure Data Box", fr: "Azure Data Box" }
    - id: c
      text: { en: "Azure File Sync", fr: "Azure File Sync" }
    - id: d
      text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Storage Explorer is a standalone application with a graphical interface that runs on Windows, macOS and Linux. It lets you browse the blobs and files of a storage account, and upload or download them.
    fr: L'Explorateur Stockage Azure est une application autonome dotée d'une interface graphique, qui fonctionne sous Windows, macOS et Linux. Il permet de parcourir les objets blob et les fichiers d'un compte de stockage, de les charger et de les télécharger.
  options:
    a:
      en: AzCopy also runs on macOS and copies blobs, but it is a command-line utility without a graphical interface.
      fr: AzCopy fonctionne aussi sous macOS et copie des objets blob, mais c'est un utilitaire en ligne de commande sans interface graphique.
    b:
      en: Azure Data Box is a physical device that is shipped to transfer large amounts of data offline.
      fr: Azure Data Box est un appareil physique expédié pour transférer de grandes quantités de données hors connexion.
    c:
      en: Azure File Sync synchronizes a Windows file server with Azure file shares. It isn't a tool for browsing blob containers.
      fr: Azure File Sync synchronise un serveur de fichiers Windows avec des partages de fichiers Azure. Ce n'est pas un outil pour parcourir des conteneurs d'objets blob.
references:
  - title: Get started with Storage Explorer
    url: https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
  - title: Identify Azure file movement options
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options
