id: az900-2a-hier-policy-rg-scope
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A subscription named **Sub1** contains two resource groups named **RG1** and **RG2**.

    You assign an Azure Policy to RG1.

    To which resources does the policy apply?
  fr: |
    Un abonnement nommé **Sub1** contient deux groupes de ressources nommés **RG1** et **RG2**.

    Vous attribuez une stratégie Azure Policy à RG1.

    À quelles ressources la stratégie s'applique-t-elle ?
body:
  options:
    - id: a
      text: { en: "To the resources of RG1 and RG2", fr: "Aux ressources de RG1 et de RG2" }
    - id: b
      text: { en: "To the resources of RG1 only", fr: "Aux ressources de RG1 uniquement" }
    - id: c
      text: { en: "To the resources of all the subscriptions that have the same parent as Sub1", fr: "Aux ressources de tous les abonnements qui ont le même parent que Sub1" }
    - id: d
      text: { en: "To no resource until the policy is also assigned to Sub1", fr: "À aucune ressource tant que la stratégie n'est pas aussi attribuée à Sub1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A setting applied at one level is inherited by the lower levels only. A policy assigned to RG1 applies to RG1 and the resources in it; RG2, which is at the same level, does not receive it.
    fr: |
      Un paramètre appliqué à un niveau n'est hérité que par les niveaux inférieurs. Une stratégie attribuée à RG1 s'applique à RG1 et aux ressources qu'il contient ; RG2, situé au même niveau, ne la reçoit pas.
  options:
    a: { en: "To cover RG1 and RG2, the policy would have to be assigned to Sub1 or to a higher scope.", fr: "Pour couvrir RG1 et RG2, la stratégie devrait être attribuée à Sub1 ou à une étendue supérieure." }
    c: { en: "Inheritance goes downward, never up to the subscription or across to other subscriptions.", fr: "L'héritage se fait vers le bas, jamais en remontant vers l'abonnement ni vers d'autres abonnements." }
    d: { en: "An assignment on a resource group is effective by itself; no assignment on the subscription is required.", fr: "Une attribution sur un groupe de ressources produit ses effets seule ; aucune attribution sur l'abonnement n'est requise." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
