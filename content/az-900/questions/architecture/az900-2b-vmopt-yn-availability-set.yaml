id: az900-2b-vmopt-yn-availability-set
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "An availability set protects virtual machines against the failure of an entire datacenter.", fr: "Un groupe à haute disponibilité protège les machines virtuelles contre la panne d'un centre de données entier." } }
    - { id: s2, text: { en: "An availability set has no cost of its own: you pay only for the virtual machines that it contains.", fr: "Un groupe à haute disponibilité n'a pas de coût propre : vous ne payez que les machines virtuelles qu'il contient." } }
    - { id: s3, text: { en: "The virtual machines of the same fault domain share a power source and a network switch.", fr: "Les machines virtuelles d'un même domaine d'erreur partagent une alimentation et un commutateur réseau." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "An availability set improves resiliency against hardware failures and maintenance events, but it doesn't protect against a failure at the level of the datacenter; availability zones do. The availability set itself adds no cost, only the virtual machine instances are billed. A fault domain groups the machines that share a common power source and network switch."
    fr: "Un groupe à haute disponibilité améliore la résilience face aux pannes matérielles et aux opérations de maintenance, mais il ne protège pas d'une panne à l'échelle du centre de données ; ce sont les zones de disponibilité qui le font. Le groupe lui-même n'ajoute aucun coût, seules les instances de machines virtuelles sont facturées. Un domaine d'erreur regroupe les machines qui partagent une même alimentation et un même commutateur réseau."
references:
  - title: "Availability sets overview"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
