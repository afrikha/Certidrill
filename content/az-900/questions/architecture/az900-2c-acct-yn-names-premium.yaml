id: az900-2c-acct-yn-names-premium
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about storage accounts, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les comptes de stockage, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Two storage accounts that are in different Azure subscriptions can have the same name.
        fr: Deux comptes de stockage situés dans des abonnements Azure différents peuvent porter le même nom.
    - id: s2
      text:
        en: Premium storage accounts store data on solid-state drives (SSDs).
        fr: Les comptes de stockage Premium stockent les données sur des disques SSD.
    - id: s3
      text:
        en: The name of a storage account is part of the URL that is used to reach the data in the account.
        fr: Le nom d'un compte de stockage fait partie de l'URL utilisée pour atteindre les données du compte.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Premium accounts use solid-state drives to deliver low latency. A storage account name must be unique across all of Azure, not only within a subscription, because it forms the address of the data. For example, the blobs of an account are reached at `https://<account>.blob.core.windows.net`.
    fr: Les comptes Premium utilisent des disques SSD pour offrir une faible latence. Le nom d'un compte de stockage doit être unique dans tout Azure, et pas seulement dans un abonnement, car il forme l'adresse des données. Par exemple, les objets blob d'un compte sont accessibles à l'adresse `https://<account>.blob.core.windows.net`.
  options:
    s1:
      en: The name is unique in Azure as a whole. No two storage accounts can share a name, whatever their subscription.
      fr: Le nom est unique dans l'ensemble d'Azure. Deux comptes de stockage ne peuvent pas partager un nom, quel que soit leur abonnement.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
