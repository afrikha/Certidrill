id: az900-2a-az-definition
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes Azure availability zones?
  fr: |
    Quelle affirmation décrit les zones de disponibilité Azure ?
body:
  options:
    - id: a
      text: { en: "Physically separate datacenters within the same Azure region", fr: "Des centres de données physiquement séparés au sein d'une même région Azure" }
    - id: b
      text: { en: "Two regions of the same geography that are far apart from each other", fr: "Deux régions d'une même zone géographique, éloignées l'une de l'autre" }
    - id: c
      text: { en: "Isolated instances of Azure reserved for government customers", fr: "Des instances isolées d'Azure réservées aux clients gouvernementaux" }
    - id: d
      text: { en: "Logical containers for resources that share the same lifecycle", fr: "Des conteneurs logiques pour des ressources qui partagent le même cycle de vie" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Availability zones are physically separate datacenters inside one region. Each zone has independent power, cooling and networking, so the failure of one zone does not stop the others.
    fr: |
      Les zones de disponibilité sont des centres de données physiquement séparés à l'intérieur d'une même région. Chaque zone dispose d'une alimentation, d'un refroidissement et d'un réseau indépendants : la défaillance d'une zone n'arrête donc pas les autres.
  options:
    b: { en: "This describes a region pair, which protects against the loss of a whole region.", fr: "Cette description correspond à une paire de régions, qui protège contre la perte d'une région entière." }
    c: { en: "This describes sovereign regions, such as the US government regions.", fr: "Cette description correspond aux régions souveraines, comme les régions du gouvernement américain." }
    d: { en: "This describes resource groups, which belong to the management infrastructure, not to the physical one.", fr: "Cette description correspond aux groupes de ressources, qui relèvent de l'infrastructure de gestion et non de l'infrastructure physique." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
