id: az900-2a-sub-subtle
objective: "2.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware has one Azure account with two subscriptions that trust the same Microsoft Entra tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un compte Azure avec deux abonnements qui approuvent le même locataire Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single resource group can contain resources from both subscriptions."
        fr: "Un même groupe de ressources peut contenir des ressources des deux abonnements."
    - id: s2
      text:
        en: "A resource can be moved from one of the subscriptions to the other."
        fr: "Une ressource peut être déplacée de l'un des abonnements vers l'autre."
    - id: s3
      text:
        en: "The two subscriptions can have different billing models and different access-management policies."
        fr: "Les deux abonnements peuvent avoir des modèles de facturation différents et des stratégies de gestion des accès différentes."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A resource group is created inside one subscription and holds only resources of that subscription. Resources can however be moved to a resource group of another subscription when both subscriptions are in the same Microsoft Entra tenant. In an account with several subscriptions, each subscription can be given its own billing model and its own access-management policies.
    fr: |
      Un groupe de ressources est créé dans un seul abonnement et ne contient que des ressources de cet abonnement. Des ressources peuvent toutefois être déplacées vers un groupe de ressources d'un autre abonnement lorsque les deux abonnements relèvent du même locataire Microsoft Entra. Dans un compte comptant plusieurs abonnements, chaque abonnement peut recevoir son propre modèle de facturation et ses propres stratégies de gestion des accès.
references:
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
