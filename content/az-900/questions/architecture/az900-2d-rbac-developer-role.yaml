id: az900-2d-rbac-developer-role
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer must create and manage all types of resources in a resource group named **RG1**. The developer must not be able to grant access to RG1 to other users. The solution must follow the principle of least privilege.

    Which built-in role should you assign to the developer on RG1?
  fr: |
    Une développeuse doit créer et gérer tous les types de ressources d'un groupe de ressources nommé **RG1**. Elle ne doit pas pouvoir accorder à d'autres utilisateurs l'accès à RG1. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer à la développeuse sur RG1 ?
body:
  options:
    - { id: a, text: Owner }
    - { id: b, text: User Access Administrator }
    - { id: c, text: Contributor }
    - { id: d, text: Reader }
answer: { optionId: c }
explanation:
  correct:
    en: "Contributor grants full access to manage all the resources of the scope, but it does not allow assigning roles in Azure RBAC. The developer can therefore create and manage anything in RG1 without being able to give access to someone else."
    fr: "Contributor accorde un accès complet pour gérer toutes les ressources de l'étendue, mais ne permet pas d'attribuer des rôles dans Azure RBAC. La développeuse peut donc tout créer et tout gérer dans RG1 sans pouvoir donner l'accès à quelqu'un d'autre."
  options:
    a:
      en: "Owner also manages all resources, but it includes the ability to assign roles, which the requirement forbids."
      fr: "Owner gère aussi toutes les ressources, mais il inclut la possibilité d'attribuer des rôles, ce que l'exigence interdit."
    b:
      en: "User Access Administrator manages user access to Azure resources; it is the opposite of what is required and does not let the developer manage the resources."
      fr: "User Access Administrator gère l'accès des utilisateurs aux ressources Azure ; c'est l'inverse de ce qui est demandé, et il ne permet pas à la développeuse de gérer les ressources."
    d:
      en: "Reader only lets a user view resources; the developer could not create or manage anything."
      fr: "Reader permet seulement de consulter les ressources ; la développeuse ne pourrait rien créer ni gérer."
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
