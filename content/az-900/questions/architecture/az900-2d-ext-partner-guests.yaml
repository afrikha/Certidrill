id: az900-2d-ext-partner-guests
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hires consultants from Fabrikam for six months. The consultants must access a Contoso application by signing in with their existing Fabrikam work accounts. Contoso does not want to manage passwords for them.

    What should Contoso do?
  fr: |
    Contoso fait appel à des consultants de Fabrikam pendant six mois. Les consultants doivent accéder à une application de Contoso en se connectant avec leurs comptes professionnels Fabrikam existants. Contoso ne veut pas gérer de mots de passe pour eux.

    Que doit faire Contoso ?
body:
  options:
    - id: a
      text: { en: "Create a user account with a new password in the Contoso tenant for each consultant", fr: "Créer pour chaque consultant un compte d'utilisateur avec un nouveau mot de passe dans le locataire Contoso" }
    - id: b
      text: { en: "Invite the consultants as guest users through B2B collaboration", fr: "Inviter les consultants comme utilisateurs invités par la collaboration B2B" }
    - id: c
      text: { en: "Synchronize the Fabrikam directory to the Contoso tenant by using Microsoft Entra Connect", fr: "Synchroniser l'annuaire de Fabrikam vers le locataire Contoso avec Microsoft Entra Connect" }
    - id: d
      text: { en: "Join the consultants' computers to a Microsoft Entra Domain Services managed domain", fr: "Joindre les ordinateurs des consultants à un domaine managé Microsoft Entra Domain Services" }
answer: { optionId: b }
explanation:
  correct:
    en: "B2B collaboration, a capability of Microsoft Entra External ID, lets external users sign in to your applications with their own identity. They appear in your directory as guest users, and their home organization keeps managing their credentials, so Contoso has no password to manage."
    fr: "La collaboration B2B, une capacité de Microsoft Entra External ID, permet à des utilisateurs externes de se connecter à vos applications avec leur propre identité. Ils apparaissent dans votre annuaire comme utilisateurs invités, et leur organisation d'origine continue de gérer leurs informations d'identification : Contoso n'a aucun mot de passe à gérer."
  options:
    a:
      en: "A new account in the Contoso tenant comes with a password that Contoso must manage, and the consultants would not use their Fabrikam accounts."
      fr: "Un nouveau compte dans le locataire Contoso s'accompagne d'un mot de passe que Contoso doit gérer, et les consultants n'utiliseraient pas leurs comptes Fabrikam."
    c:
      en: "Microsoft Entra Connect synchronizes an organization's own on-premises identities to its Microsoft Entra tenant; it is not a way to give access to a partner's users."
      fr: "Microsoft Entra Connect synchronise les identités locales d'une organisation vers son propre locataire Microsoft Entra ; ce n'est pas un moyen de donner accès aux utilisateurs d'un partenaire."
    d:
      en: "Microsoft Entra Domain Services provides domain join, Group Policy, LDAP and Kerberos for legacy applications; it does not let external users sign in with their own accounts."
      fr: "Microsoft Entra Domain Services fournit la jonction de domaine, la stratégie de groupe, LDAP et Kerberos aux applications anciennes ; il ne permet pas à des utilisateurs externes de se connecter avec leurs propres comptes."
references:
  - title: Describe Azure external identities
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities
  - title: What is Microsoft Entra B2B collaboration?
    url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
