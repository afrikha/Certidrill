id: az900-2c-tier-dd-cost-trend
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answers that correctly complete the sentence.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez les réponses qui complètent correctement la phrase.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When you move a blob from the hot tier to the cool tier, the cost to store the blob [[store]] and the cost to read the blob [[access]].
    fr: |
      Lorsque vous déplacez un objet blob du niveau chaud (Hot) vers le niveau froid (Cool), le coût de stockage de l'objet blob [[store]] et le coût de lecture de l'objet blob [[access]].
  slots:
    - id: store
      options:
        - { id: up, text: { en: "increases", fr: "augmente" } }
        - { id: down, text: { en: "decreases", fr: "diminue" } }
        - { id: same, text: { en: "stays the same", fr: "reste le même" } }
    - id: access
      options:
        - { id: up, text: { en: "increases", fr: "augmente" } }
        - { id: down, text: { en: "decreases", fr: "diminue" } }
        - { id: same, text: { en: "stays the same", fr: "reste le même" } }
answer:
  values: { store: down, access: up }
explanation:
  correct:
    en: Access tiers trade storage cost against access cost. A cooler tier is cheaper for storing data and more expensive for reading it, which is why cooler tiers suit data that is read less often.
    fr: Les niveaux d'accès échangent du coût de stockage contre du coût d'accès. Un niveau plus froid est moins cher pour stocker les données et plus cher pour les lire, c'est pourquoi les niveaux plus froids conviennent aux données lues moins souvent.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
