id: az900-2c-red-zrs-in-region
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware stores customer contracts in a storage account. The data must remain available if one datacenter of the region fails, and it must never be copied outside the region.

    Which redundancy option should you use?
  fr: |
    Litware stocke des contrats clients dans un compte de stockage. Les données doivent rester disponibles si un centre de données de la région tombe en panne, et elles ne doivent jamais être copiées en dehors de la région.

    Quelle option de redondance devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" }
    - id: b
      text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" }
    - id: c
      text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
    - id: d
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
answer: { optionId: d }
explanation:
  correct:
    en: ZRS copies the data across three availability zones of the primary region. The data stays available when one zone, and therefore one datacenter, is lost, and no copy leaves the region.
    fr: ZRS copie les données dans trois zones de disponibilité de la région primaire. Les données restent disponibles en cas de perte d'une zone, donc d'un centre de données, et aucune copie ne quitte la région.
  options:
    a:
      en: LRS keeps all the copies in one datacenter. The data is unavailable, or even lost, if that datacenter fails.
      fr: LRS conserve toutes les copies dans un seul centre de données. Les données sont indisponibles, voire perdues, si ce centre de données tombe en panne.
    b:
      en: GRS copies the data to a secondary region, which the requirement forbids. Its copies in the primary region are also all in one datacenter.
      fr: GRS copie les données dans une région secondaire, ce que l'exigence interdit. Ses copies de la région primaire se trouvent en outre toutes dans un seul centre de données.
    c:
      en: GZRS uses availability zones in the primary region, but it also copies the data to a secondary region, which the requirement forbids.
      fr: GZRS utilise des zones de disponibilité dans la région primaire, mais il copie aussi les données dans une région secondaire, ce que l'exigence interdit.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Describe Azure storage redundancy
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/3-redundancy
