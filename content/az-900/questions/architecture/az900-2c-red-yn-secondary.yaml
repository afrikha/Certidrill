id: az900-2c-red-yn-secondary
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Storage redundancy, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la redondance du Stockage Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With geo-redundant storage (GRS), the secondary region is the region that Azure pairs with the primary region.
        fr: Avec le stockage géoredondant (GRS), la région secondaire est la région qu'Azure jumelle à la région primaire.
    - id: s2
      text:
        en: With geo-redundant storage (GRS), applications can read the data in the secondary region at any time.
        fr: Avec le stockage géoredondant (GRS), les applications peuvent lire les données de la région secondaire à tout moment.
    - id: s3
      text:
        en: Locally redundant storage (LRS) keeps three copies of the data.
        fr: Le stockage localement redondant (LRS) conserve trois copies des données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: You choose the primary region, and Azure assigns the secondary region according to region pairs. With GRS, the data in the secondary region becomes readable only after a failover. Reading it at any time requires RA-GRS. Even LRS, the simplest option, replicates the data three times within one datacenter.
    fr: Vous choisissez la région primaire, et Azure attribue la région secondaire selon les régions jumelées. Avec GRS, les données de la région secondaire ne deviennent lisibles qu'après un basculement. Pour les lire à tout moment, il faut RA-GRS. Même LRS, l'option la plus simple, réplique les données trois fois dans un seul centre de données.
  options:
    s2:
      en: GRS gives no read access to the secondary region before a failover. Read-access geo-redundant storage (RA-GRS) adds that access.
      fr: GRS ne donne aucun accès en lecture à la région secondaire avant un basculement. Le stockage géoredondant avec accès en lecture (RA-GRS) ajoute cet accès.
references:
  - title: Describe Azure storage redundancy
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/3-redundancy
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
