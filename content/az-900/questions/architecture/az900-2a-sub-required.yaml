id: az900-2a-sub-required
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has just created an Azure account.

    What does Tailspin Toys need before it can create its first virtual machine?
  fr: |
    Tailspin Toys vient de créer un compte Azure.

    De quoi Tailspin Toys a-t-il besoin avant de pouvoir créer sa première machine virtuelle ?
body:
  options:
    - id: a
      text: { en: "A management group", fr: "Un groupe d'administration" }
    - id: b
      text: { en: "A paid Azure support plan", fr: "Un plan de support Azure payant" }
    - id: c
      text: { en: "An Azure subscription", fr: "Un abonnement Azure" }
    - id: d
      text: { en: "A second Microsoft Entra tenant", fr: "Un deuxième locataire Microsoft Entra" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Using Azure requires a subscription. The subscription links the account to the resources it creates, gives access to Azure products and services, and is the unit to which the consumption of the virtual machine is billed.
    fr: |
      L'utilisation d'Azure nécessite un abonnement. L'abonnement relie le compte aux ressources qu'il crée, donne accès aux produits et services Azure et constitue l'unité à laquelle la consommation de la machine virtuelle est facturée.
  options:
    a: { en: "Management groups are an optional way to organize several subscriptions.", fr: "Les groupes d'administration sont un moyen facultatif d'organiser plusieurs abonnements." }
    b: { en: "A support plan is optional and is not required to deploy resources.", fr: "Un plan de support est facultatif et n'est pas nécessaire pour déployer des ressources." }
    d: { en: "The account already belongs to a tenant; a second tenant is not needed to deploy resources.", fr: "Le compte appartient déjà à un locataire ; un deuxième locataire n'est pas nécessaire pour déployer des ressources." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
