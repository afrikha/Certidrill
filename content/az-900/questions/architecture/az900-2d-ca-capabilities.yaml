id: az900-2d-ca-capabilities
objective: "2.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra Conditional Access, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'accès conditionnel Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Conditional Access policy can require multifactor authentication for administrators without requiring it for the other users."
        fr: "Une stratégie d'accès conditionnel peut exiger l'authentification multifacteur pour les administrateurs sans l'exiger pour les autres utilisateurs."
    - id: s2
      text:
        en: "Conditional Access assigns Azure roles, such as Contributor, to the users who meet the conditions of a policy."
        fr: "L'accès conditionnel attribue des rôles Azure, tels que Contributor, aux utilisateurs qui remplissent les conditions d'une stratégie."
    - id: s3
      text:
        en: "The application that a user tries to access can be used as a signal by Conditional Access."
        fr: "L'application à laquelle un utilisateur tente d'accéder peut servir de signal à l'accès conditionnel."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Conditional Access evaluates signals such as who the user is, where the user is, which device is used and which application is requested, so a policy can target administrators only or one application only. Its outcome is an access decision (allow, block, or allow with a requirement such as multifactor authentication). Granting permissions on Azure resources is the job of Azure RBAC role assignments."
    fr: "L'accès conditionnel évalue des signaux tels que l'identité de l'utilisateur, l'endroit où il se trouve, l'appareil utilisé et l'application demandée : une stratégie peut donc ne viser que les administrateurs ou qu'une application. Son résultat est une décision d'accès (autoriser, bloquer, ou autoriser sous condition, par exemple l'authentification multifacteur). Accorder des autorisations sur les ressources Azure est le rôle des attributions de rôles Azure RBAC."
  options:
    s2:
      en: "Conditional Access decides whether a sign-in is allowed; it never assigns roles. Roles are assigned with Azure RBAC."
      fr: "L'accès conditionnel décide si une connexion est autorisée ; il n'attribue jamais de rôles. Les rôles s'attribuent avec Azure RBAC."
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
