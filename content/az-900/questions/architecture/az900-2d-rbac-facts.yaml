id: az900-2d-rbac-facts
objective: "2.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Azure role-based access control (Azure RBAC) are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies au sujet du contrôle d'accès en fonction du rôle Azure (Azure RBAC) ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "It is enforced on actions made from the Azure portal, the Azure CLI and Azure PowerShell alike.", fr: "Il s'applique de la même façon aux actions faites depuis le portail Azure, Azure CLI et Azure PowerShell." }
    - id: b
      text: { en: "It controls the permissions of users inside an application that runs on a virtual machine.", fr: "Il contrôle les autorisations des utilisateurs à l'intérieur d'une application qui s'exécute sur une machine virtuelle." }
    - id: c
      text: { en: "A role that is assigned on a resource group applies to the other resource groups of the subscription.", fr: "Un rôle attribué sur un groupe de ressources s'applique aux autres groupes de ressources de l'abonnement." }
    - id: d
      text: { en: "A role that is assigned to a group grants its permissions to the members of the group.", fr: "Un rôle attribué à un groupe accorde ses autorisations aux membres du groupe." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Azure RBAC is enforced by Azure Resource Manager on every action that reaches an Azure resource, whichever tool sends it: the portal, Cloud Shell, the Azure CLI or Azure PowerShell. A role can be assigned to a user or to a group; with a group, every member, including a member added later, receives the permissions of the role."
    fr: "Azure RBAC est appliqué par Azure Resource Manager à chaque action qui atteint une ressource Azure, quel que soit l'outil qui l'envoie : le portail, Cloud Shell, Azure CLI ou Azure PowerShell. Un rôle peut être attribué à un utilisateur ou à un groupe ; avec un groupe, chaque membre, y compris un membre ajouté plus tard, reçoit les autorisations du rôle."
  options:
    b:
      en: "Azure RBAC does not enforce permissions at the application or data level; the application must handle its own security."
      fr: "Azure RBAC n'applique pas d'autorisations au niveau de l'application ou des données ; l'application doit gérer sa propre sécurité."
    c:
      en: "Inheritance goes from a parent scope to its child scopes only; a resource group passes its assignments to its resources, not to sibling resource groups."
      fr: "L'héritage va seulement d'une étendue parente vers ses étendues enfants ; un groupe de ressources transmet ses attributions à ses ressources, pas aux groupes de ressources voisins."
references:
  - title: Describe Azure role-based access control
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control
