id: az900-2d-dfc-onprem-arc
objective: "2.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders protects its Azure virtual machines with Microsoft Defender for Cloud. The company also has Windows and Linux servers in its own datacenter, and it does not plan to migrate them.

    What should Northwind Traders use to extend the protection of Defender for Cloud to these servers?
  fr: |
    Northwind Traders protège ses machines virtuelles Azure avec Microsoft Defender pour le cloud. L'entreprise possède aussi des serveurs Windows et Linux dans son propre centre de données, qu'elle ne prévoit pas de migrer.

    Que doit utiliser Northwind Traders pour étendre à ces serveurs la protection de Defender pour le cloud ?
body:
  options:
    - id: a
      text: { en: "Azure ExpressRoute", fr: "Azure ExpressRoute" }
    - id: b
      text: { en: "Azure Migrate", fr: "Azure Migrate" }
    - id: c
      text: { en: "Azure Bastion", fr: "Azure Bastion" }
    - id: d
      text: { en: "Azure Arc", fr: "Azure Arc" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Arc connects machines that run outside Azure so that they can be managed like Azure resources. To protect on-premises servers, you deploy Azure Arc on them and enable the Defender for Cloud protections; the servers stay where they are."
    fr: "Azure Arc connecte des machines qui s'exécutent hors d'Azure afin qu'elles soient gérées comme des ressources Azure. Pour protéger des serveurs locaux, vous y déployez Azure Arc et activez les protections de Defender pour le cloud ; les serveurs restent où ils sont."
  options:
    a:
      en: "ExpressRoute is a private connection between an on-premises network and Azure; it carries traffic but does not make the servers visible to Defender for Cloud."
      fr: "ExpressRoute est une connexion privée entre un réseau local et Azure ; elle transporte du trafic, mais ne rend pas les serveurs visibles par Defender pour le cloud."
    b:
      en: "Azure Migrate assesses and migrates servers to Azure, which the company does not want to do."
      fr: "Azure Migrate évalue et migre des serveurs vers Azure, ce que l'entreprise ne veut pas faire."
    c:
      en: "Azure Bastion provides secure RDP and SSH access to virtual machines in a virtual network; it does not onboard on-premises servers."
      fr: "Azure Bastion fournit un accès RDP et SSH sécurisé aux machines virtuelles d'un réseau virtuel ; il n'intègre pas de serveurs locaux."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
