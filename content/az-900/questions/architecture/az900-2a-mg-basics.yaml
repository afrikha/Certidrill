id: az900-2a-mg-basics
objective: "2.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about management groups, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les groupes d'administration, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A management group can contain other management groups."
        fr: "Un groupe d'administration peut contenir d'autres groupes d'administration."
    - id: s2
      text:
        en: "An Azure role assigned on a management group is inherited by the subscriptions below it."
        fr: "Un rôle Azure attribué sur un groupe d'administration est hérité par les abonnements situés en dessous."
    - id: s3
      text:
        en: "A subscription can be a direct child of two management groups at the same time."
        fr: "Un abonnement peut être l'enfant direct de deux groupes d'administration en même temps."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Management groups can be nested, and what is assigned to a management group (roles, policies) flows down to the management groups, subscriptions, resource groups and resources under it. A subscription, like a management group, has one parent only.
    fr: |
      Les groupes d'administration peuvent être imbriqués, et ce qui est attribué à un groupe d'administration (rôles, stratégies) descend vers les groupes d'administration, les abonnements, les groupes de ressources et les ressources situés en dessous. Un abonnement, comme un groupe d'administration, n'a qu'un seul parent.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
