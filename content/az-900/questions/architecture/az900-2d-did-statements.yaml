id: az900-2d-did-statements
objective: "2.4.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the defense-in-depth model, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le modèle de défense en profondeur, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The physical security of the datacenter buildings is the first line of defense of the model."
        fr: "La sécurité physique des bâtiments des centres de données est la première ligne de défense du modèle."
    - id: s2
      text:
        en: "When the network layer is secured, the controls of the compute and application layers are no longer needed."
        fr: "Lorsque la couche réseau est sécurisée, les contrôles des couches calcul et application ne sont plus nécessaires."
    - id: s3
      text:
        en: "The objective of the model is to protect information from being stolen by people who are not authorized to access it."
        fr: "L'objectif du modèle est d'empêcher que l'information soit volée par des personnes non autorisées à y accéder."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Defense in depth aims to protect information and to prevent its theft by unauthorized people. Physical security, which controls access to the buildings and to the hardware, is the outermost layer and the first line of defense. No layer makes the others optional: the point of the model is that if one layer is breached, the next one is already in place."
    fr: "La défense en profondeur vise à protéger l'information et à empêcher son vol par des personnes non autorisées. La sécurité physique, qui contrôle l'accès aux bâtiments et au matériel, est la couche la plus externe et la première ligne de défense. Aucune couche ne rend les autres facultatives : tout l'intérêt du modèle est que, si une couche est franchie, la suivante est déjà en place."
  options:
    s2:
      en: "The model removes the reliance on any single layer; a secured network does not protect an unpatched virtual machine or a vulnerable application."
      fr: "Le modèle supprime la dépendance à une seule couche ; un réseau sécurisé ne protège pas une machine virtuelle non corrigée ni une application vulnérable."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
