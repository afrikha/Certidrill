id: az900-2c-move-explorer-facts
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Azure Storage Explorer are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies au sujet de l'Explorateur Stockage Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It keeps a Windows file server synchronized with Azure Files.", fr: "Il garde un serveur de fichiers Windows synchronisé avec Azure Files." } }
    - { id: b, text: { en: "It uses AzCopy to carry out its data transfers.", fr: "Il utilise AzCopy pour effectuer ses transferts de données." } }
    - { id: c, text: { en: "It is a physical device that Microsoft ships to your datacenter.", fr: "C'est un appareil physique que Microsoft expédie à votre centre de données." } }
    - { id: d, text: { en: "It runs on Windows, macOS and Linux.", fr: "Il fonctionne sous Windows, macOS et Linux." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure Storage Explorer is a standalone graphical application available for Windows, macOS and Linux. Behind its interface, it relies on AzCopy to upload, download and move blobs and files.
    fr: L'Explorateur Stockage Azure est une application graphique autonome disponible pour Windows, macOS et Linux. Derrière son interface, il s'appuie sur AzCopy pour charger, télécharger et déplacer des objets blob et des fichiers.
  options:
    a: { en: "Keeping a Windows file server synchronized with Azure Files is the role of Azure File Sync.", fr: "Garder un serveur de fichiers Windows synchronisé avec Azure Files est le rôle d'Azure File Sync." }
    c: { en: "The physical device that is shipped to a datacenter is Azure Data Box.", fr: "L'appareil physique expédié à un centre de données est Azure Data Box." }
references:
  - title: Identify Azure file movement options
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options
  - title: Get started with Storage Explorer
    url: https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
