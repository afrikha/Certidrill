id: az900-2c-mig-databox-scenarios
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    For which two scenarios is Azure Data Box an appropriate solution?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux scénarios pour lesquels Azure Data Box est une solution appropriée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Checking whether on-premises servers are ready to run in Azure", fr: "Vérifier que des serveurs locaux sont prêts à fonctionner dans Azure" } }
    - { id: b, text: { en: "Moving a 60-TB media library to Azure from a site that has a slow internet connection", fr: "Déplacer vers Azure une médiathèque de 60 To depuis un site dont la connexion Internet est lente" } }
    - { id: c, text: { en: "Keeping a Windows file server continuously synchronized with an Azure file share", fr: "Garder un serveur de fichiers Windows synchronisé en continu avec un partage de fichiers Azure" } }
    - { id: d, text: { en: "Sending large volumes of video to Azure every month from a remote site that has limited connectivity", fr: "Envoyer chaque mois de gros volumes de vidéo vers Azure depuis un site distant à la connectivité limitée" } }
    - { id: e, text: { en: "Copying a 2-GB folder from a laptop to a blob container", fr: "Copier un dossier de 2 Go d'un ordinateur portable vers un conteneur d'objets blob" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure Data Box is a physical device that Microsoft ships to you so that large amounts of data travel offline. It suits a one-time migration and periodic uploads alike, whenever the volume is large and the network is limited or too slow.
    fr: Azure Data Box est un appareil physique que Microsoft vous expédie pour que de grandes quantités de données voyagent hors connexion. Il convient aussi bien à une migration ponctuelle qu'à des envois périodiques, dès que le volume est important et que le réseau est limité ou trop lent.
  options:
    a: { en: "Discovering and assessing on-premises servers is the role of Azure Migrate.", fr: "Découvrir et évaluer des serveurs locaux est le rôle d'Azure Migrate." }
    c: { en: "Continuous synchronization of a Windows file server with Azure Files is the role of Azure File Sync.", fr: "La synchronisation continue d'un serveur de fichiers Windows avec Azure Files est le rôle d'Azure File Sync." }
    e: { en: "A few gigabytes are transferred over the network in little time, with AzCopy or Azure Storage Explorer. Shipping a device isn't justified.", fr: "Quelques gigaoctets se transfèrent par le réseau en peu de temps, avec AzCopy ou l'Explorateur Stockage Azure. Expédier un appareil ne se justifie pas." }
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
