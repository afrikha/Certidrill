id: az900-2c-tier-cold-immediate
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware stores inspection reports as blobs. Each report is kept for five years and is read about once a year. When an inspector requests a report, it must open within seconds.

    You need to minimize the storage cost. Which access tier should you use?
  fr: |
    Proseware stocke des rapports d'inspection sous forme d'objets blob. Chaque rapport est conservé cinq ans et lu environ une fois par an. Lorsqu'un inspecteur demande un rapport, celui-ci doit s'ouvrir en quelques secondes.

    Vous devez réduire au minimum le coût de stockage. Quel niveau d'accès devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Hot", fr: "Chaud (Hot)" }
    - id: b
      text: { en: "Cool", fr: "Froid (Cool)" }
    - id: c
      text: { en: "Cold", fr: "Froid (Cold)" }
    - id: d
      text: { en: "Archive", fr: "Archive" }
answer: { optionId: c }
explanation:
  correct:
    en: The report must open within seconds, so it must stay in an online tier. Among the online tiers, the cold tier has the lowest storage cost and is intended for rarely accessed data that is kept for at least 90 days.
    fr: Le rapport doit s'ouvrir en quelques secondes, il doit donc rester dans un niveau en ligne. Parmi les niveaux en ligne, le niveau froid (Cold) a le coût de stockage le plus bas et il est destiné aux données rarement consultées et conservées au moins 90 jours.
  options:
    a:
      en: The hot tier is immediately readable, but it has the highest storage cost. It suits data that is read frequently.
      fr: Le niveau chaud (Hot) est lisible immédiatement, mais il a le coût de stockage le plus élevé. Il convient aux données lues fréquemment.
    b:
      en: The cool tier is immediately readable, but its storage cost is higher than that of the cold tier.
      fr: Le niveau froid (Cool) est lisible immédiatement, mais son coût de stockage est plus élevé que celui du niveau froid (Cold).
    d:
      en: The archive tier has the lowest storage cost, but it is offline. A blob must be rehydrated before it is read, which takes hours.
      fr: Le niveau archive (Archive) a le coût de stockage le plus bas, mais il est hors connexion. Un objet blob doit être réhydraté avant d'être lu, ce qui prend des heures.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
