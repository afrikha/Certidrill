id: az900-2c-move-yn-tools
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To use Azure File Sync, an organization must replace its Windows file servers with Azure virtual machines.
        fr: Pour utiliser Azure File Sync, une organisation doit remplacer ses serveurs de fichiers Windows par des machines virtuelles Azure.
    - id: s2
      text:
        en: AzCopy can copy data from Amazon S3 to Azure Storage.
        fr: AzCopy peut copier des données d'Amazon S3 vers le Stockage Azure.
    - id: s3
      text:
        en: With Azure File Sync, users can keep using the SMB protocol to open files on the local server.
        fr: Avec Azure File Sync, les utilisateurs peuvent continuer d'utiliser le protocole SMB pour ouvrir les fichiers sur le serveur local.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Azure File Sync is installed on the existing Windows file servers, which stay in place as a local cache of the Azure file share. Users reach the local data with any protocol available on Windows Server, such as SMB, NFS or FTPS. AzCopy copies data to, from and between storage accounts, and it can also take other cloud providers such as Amazon S3 as a source.
    fr: Azure File Sync s'installe sur les serveurs de fichiers Windows existants, qui restent en place comme cache local du partage de fichiers Azure. Les utilisateurs accèdent aux données locales avec n'importe quel protocole disponible sur Windows Server, comme SMB, NFS ou FTPS. AzCopy copie des données vers, depuis et entre des comptes de stockage, et il peut aussi prendre comme source d'autres fournisseurs de cloud tels qu'Amazon S3.
  options:
    s1:
      en: The local Windows file servers are kept. The Azure File Sync agent is installed on them and synchronizes them with Azure Files.
      fr: Les serveurs de fichiers Windows locaux sont conservés. L'agent Azure File Sync y est installé et les synchronise avec Azure Files.
references:
  - title: Identify Azure file movement options
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options
  - title: Get started with AzCopy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
