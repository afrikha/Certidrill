id: az900-2d-zt-from-perimeter
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso replaces its perimeter-based security model with the Zero Trust model.

    Which change results from this decision?
  fr: |
    Contoso remplace son modèle de sécurité fondé sur le périmètre par le modèle Confiance Zéro.

    Quel changement découle de cette décision ?
body:
  options:
    - id: a
      text: { en: "Requests from the internal network are verified in the same way as requests from the internet.", fr: "Les requêtes venant du réseau interne sont vérifiées de la même façon que celles venant d'Internet." }
    - id: b
      text: { en: "Devices on the internal network are trusted, and only the VPN connections are verified.", fr: "Les appareils du réseau interne sont approuvés, et seules les connexions VPN sont vérifiées." }
    - id: c
      text: { en: "Access is granted according to the network segment from which the request is sent.", fr: "L'accès est accordé en fonction du segment réseau depuis lequel la requête est envoyée." }
    - id: d
      text: { en: "Personal devices are blocked, so that only the managed computers need to be verified.", fr: "Les appareils personnels sont bloqués, de sorte que seuls les ordinateurs gérés doivent être vérifiés." }
answer: { optionId: a }
explanation:
  correct:
    en: "Zero Trust does not assume that a device is safe because it is inside the corporate network. Everyone must authenticate, and access is granted based on authentication rather than on location, so an internal request is checked like any other."
    fr: "La Confiance Zéro ne suppose pas qu'un appareil est sûr parce qu'il se trouve dans le réseau de l'entreprise. Tout le monde doit s'authentifier, et l'accès est accordé en fonction de l'authentification plutôt que de l'emplacement : une requête interne est contrôlée comme n'importe quelle autre."
  options:
    b:
      en: "Trusting whatever is on the internal network is exactly the assumption of the perimeter model that Zero Trust drops."
      fr: "Approuver tout ce qui se trouve sur le réseau interne est précisément l'hypothèse du modèle fondé sur le périmètre que la Confiance Zéro abandonne."
    c:
      en: "Zero Trust grants access based on authentication and context, not on the network location of the request."
      fr: "La Confiance Zéro accorde l'accès en fonction de l'authentification et du contexte, pas de l'emplacement réseau de la requête."
    d:
      en: "Blocking personal devices is a habit of the traditional model; Zero Trust evaluates every device, managed or not, on each request."
      fr: "Bloquer les appareils personnels est une habitude du modèle traditionnel ; la Confiance Zéro évalue chaque appareil, géré ou non, à chaque requête."
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
