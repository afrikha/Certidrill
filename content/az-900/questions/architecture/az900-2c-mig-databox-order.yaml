id: az900-2c-mig-databox-order
objective: "2.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to use Azure Data Box to import 70 TB of files from its datacenter into a storage account.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys prévoit d'utiliser Azure Data Box pour importer 70 To de fichiers de son centre de données dans un compte de stockage.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: vpn, text: { en: "Create a site-to-site VPN connection between the datacenter and Azure.", fr: "Créer une connexion VPN site à site entre le centre de données et Azure." } }
    - { id: ship, text: { en: "Ship the device back to the Azure datacenter.", fr: "Renvoyer l'appareil au centre de données Azure." } }
    - { id: order, text: { en: "Order the device in the Azure portal.", fr: "Commander l'appareil dans le portail Azure." } }
    - { id: erase, text: { en: "Erase the disks of the device.", fr: "Effacer les disques de l'appareil." } }
    - { id: copy, text: { en: "Connect the device to the local network and copy the files to it.", fr: "Connecter l'appareil au réseau local et y copier les fichiers." } }
    - { id: azcopy, text: { en: "Upload the files from the device to the storage account by using AzCopy.", fr: "Charger les fichiers de l'appareil vers le compte de stockage à l'aide d'AzCopy." } }
answer:
  sequence: [ order, copy, ship ]
explanation:
  correct:
    en: |
      You order the device in the Azure portal, and Microsoft ships it to you. You connect it to your network, copy the data to it, and then ship it back. When the device arrives at the Azure datacenter, Microsoft uploads the data to your storage account and then wipes the disks.
    fr: |
      Vous commandez l'appareil dans le portail Azure, et Microsoft vous l'expédie. Vous le connectez à votre réseau, vous y copiez les données, puis vous le renvoyez. Lorsque l'appareil arrive au centre de données Azure, Microsoft charge les données dans votre compte de stockage, puis efface les disques.
  options:
    vpn: { en: "The data travels on the device, not over the network. No VPN connection is needed for the transfer.", fr: "Les données voyagent sur l'appareil, pas par le réseau. Aucune connexion VPN n'est nécessaire au transfert." }
    erase: { en: "Microsoft wipes the disks after the data is uploaded. If you erased them, the data would never reach Azure.", fr: "Microsoft efface les disques après le chargement des données. Si vous les effaciez, les données n'arriveraient jamais dans Azure." }
    azcopy: { en: "Microsoft uploads the data to the storage account automatically when it receives the device.", fr: "Microsoft charge automatiquement les données dans le compte de stockage à la réception de l'appareil." }
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
  - title: Identify Azure data migration options
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/6-identify-azure-data-migration-options
