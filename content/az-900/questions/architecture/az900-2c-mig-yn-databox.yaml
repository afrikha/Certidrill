id: az900-2c-mig-yn-databox
objective: "2.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Data Box, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Data Box, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Data Box can be used to bring data from Azure to an on-premises datacenter.
        fr: Azure Data Box peut servir à rapatrier des données d'Azure vers un centre de données local.
    - id: s2
      text:
        en: After the data of an import is uploaded to Azure, Microsoft wipes the disks of the device.
        fr: Une fois les données d'une importation chargées dans Azure, Microsoft efface les disques de l'appareil.
    - id: s3
      text:
        en: An import with Azure Data Box sends the data to Azure over the internet connection of the datacenter.
        fr: Une importation avec Azure Data Box envoie les données vers Azure par la connexion Internet du centre de données.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Azure Data Box works in both directions. It imports data into Azure, and it exports data from Azure, for example for disaster recovery or to move back on-premises. The data travels on the device, which a carrier transports, so the internet connection isn't used for the transfer. After an import, the disks are wiped once the upload is complete.
    fr: Azure Data Box fonctionne dans les deux sens. Il importe des données dans Azure et il en exporte depuis Azure, par exemple pour une reprise d'activité ou un retour en local. Les données voyagent sur l'appareil, qu'un transporteur achemine, la connexion Internet n'est donc pas utilisée pour le transfert. Après une importation, les disques sont effacés une fois le chargement terminé.
  options:
    s3:
      en: The device is connected to the local network only to receive the files. It is then shipped to an Azure datacenter, where the data is uploaded.
      fr: L'appareil n'est connecté au réseau local que pour recevoir les fichiers. Il est ensuite expédié à un centre de données Azure, où les données sont chargées.
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
