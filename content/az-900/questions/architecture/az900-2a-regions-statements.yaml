id: az900-2a-regions-statements
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Azure regions are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies concernant les régions Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Every Azure region contains exactly three datacenters.", fr: "Chaque région Azure contient exactement trois centres de données." } }
    - { id: b, text: { en: "Some Azure services are available only in certain regions.", fr: "Certains services Azure ne sont disponibles que dans certaines régions." } }
    - { id: c, text: { en: "An Azure region can belong to several geographies.", fr: "Une région Azure peut appartenir à plusieurs zones géographiques." } }
    - { id: d, text: { en: "Every Azure region is open to all Azure customers.", fr: "Chaque région Azure est ouverte à tous les clients Azure." } }
    - { id: e, text: { en: "A few services, such as Azure DNS, do not require you to select a region.", fr: "Quelques services, comme Azure DNS, ne vous demandent pas de sélectionner une région." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Service availability differs from one region to another: some services, virtual machine sizes or storage types exist only in certain regions. A few global services, such as Microsoft Entra ID, Azure Traffic Manager and Azure DNS, are not tied to a region, so you do not select one when you create them.
    fr: |
      La disponibilité des services varie d'une région à l'autre : certains services, certaines tailles de machines virtuelles ou certains types de stockage n'existent que dans certaines régions. Quelques services mondiaux, comme Microsoft Entra ID, Azure Traffic Manager et Azure DNS, ne sont pas liés à une région : vous n'en sélectionnez donc pas lors de leur création.
  options:
    a: { en: "A region contains at least one datacenter and possibly several; there is no fixed number.", fr: "Une région contient au moins un centre de données, voire plusieurs ; il n'existe pas de nombre fixe." }
    c: { en: "Each region belongs to exactly one geography, which is its data residency boundary.", fr: "Chaque région appartient à une seule zone géographique, qui constitue sa limite de résidence des données." }
    d: { en: "Sovereign regions, such as the US government regions, are reserved for specific customers.", fr: "Les régions souveraines, comme les régions du gouvernement américain, sont réservées à des clients précis." }
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are Azure regions?
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-overview
