id: az900-2b-compute-container-vs-vm
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes a difference between containers and virtual machines?
  fr: |
    Quelle affirmation décrit une différence entre les conteneurs et les machines virtuelles ?
body:
  options:
    - { id: a, text: { en: "A container includes its own full operating system, whereas a virtual machine shares the operating system of its host.", fr: "Un conteneur embarque son propre système d'exploitation complet, alors qu'une machine virtuelle partage celui de son hôte." } }
    - { id: b, text: { en: "A container shares the operating system of its host, whereas a virtual machine runs its own operating system.", fr: "Un conteneur partage le système d'exploitation de son hôte, alors qu'une machine virtuelle exécute son propre système d'exploitation." } }
    - { id: c, text: { en: "A container requires you to update its operating system, whereas a virtual machine is updated entirely by Microsoft.", fr: "Un conteneur vous oblige à mettre à jour son système d'exploitation, alors qu'une machine virtuelle est entièrement mise à jour par Microsoft." } }
    - { id: d, text: { en: "A container runs only when an event triggers it, whereas a virtual machine runs only on a schedule.", fr: "Un conteneur ne s'exécute que lorsqu'un événement le déclenche, alors qu'une machine virtuelle ne s'exécute que selon un calendrier." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Each virtual machine runs its own operating system, which you connect to and manage. Containers on a host share the operating system of that host, which makes them lightweight and quick to create, scale out and stop."
    fr: "Chaque machine virtuelle exécute son propre système d'exploitation, auquel vous vous connectez et que vous gérez. Les conteneurs d'un hôte partagent le système d'exploitation de cet hôte, ce qui les rend légers et rapides à créer, à mettre à l'échelle et à arrêter."
  options:
    a: { en: "This is the reverse: the virtual machine carries a full operating system, and the container shares the one of its host.", fr: "C'est l'inverse : la machine virtuelle embarque un système d'exploitation complet, et le conteneur partage celui de son hôte." }
    c: { en: "You don't manage an operating system for a container, and on a virtual machine the updates of the operating system are your responsibility.", fr: "Vous ne gérez pas de système d'exploitation pour un conteneur, et sur une machine virtuelle les mises à jour du système d'exploitation sont de votre responsabilité." }
    d: { en: "Running in response to an event describes a function; containers and virtual machines run for as long as you keep them started.", fr: "L'exécution en réponse à un événement décrit une fonction ; les conteneurs et les machines virtuelles fonctionnent tant que vous les laissez démarrés." }
references:
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
