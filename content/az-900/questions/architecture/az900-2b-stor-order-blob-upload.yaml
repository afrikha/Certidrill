id: az900-2b-stor-order-blob-upload
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum wants to store backup files in Azure Blob Storage. The subscription of Adatum doesn't contain any storage resource yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum veut stocker des fichiers de sauvegarde dans le Stockage Blob Azure. L'abonnement d'Adatum ne contient encore aucune ressource de stockage.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: share, text: { en: "Create a file share.", fr: "Créer un partage de fichiers." } }
    - { id: upload, text: { en: "Upload the backup files as blobs.", fr: "Charger les fichiers de sauvegarde en tant qu'objets blob." } }
    - { id: acct, text: { en: "Create a storage account.", fr: "Créer un compte de stockage." } }
    - { id: queue, text: { en: "Create a queue.", fr: "Créer une file d'attente." } }
    - { id: cont, text: { en: "Create a container.", fr: "Créer un conteneur." } }
    - { id: table, text: { en: "Create a table.", fr: "Créer une table." } }
answer:
  sequence: [ acct, cont, upload ]
explanation:
  correct:
    en: "Blob Storage has three levels of resources: the storage account, the containers of the account and the blobs of each container. You therefore create the storage account, then a container, and finally upload the files as blobs into the container."
    fr: "Le Stockage Blob comporte trois niveaux de ressources : le compte de stockage, les conteneurs du compte et les objets blob de chaque conteneur. Vous créez donc le compte de stockage, puis un conteneur, et vous chargez enfin les fichiers en tant qu'objets blob dans le conteneur."
  options:
    share: { en: "A file share belongs to Azure Files; blobs are stored in containers.", fr: "Un partage de fichiers relève d'Azure Files ; les objets blob sont stockés dans des conteneurs." }
    queue: { en: "A queue stores messages between application components, not backup files.", fr: "Une file d'attente stocke des messages entre composants d'application, pas des fichiers de sauvegarde." }
    table: { en: "A table stores structured, non-relational data, not files.", fr: "Une table stocke des données structurées non relationnelles, pas des fichiers." }
references:
  - title: "Introduction to Azure Blob Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
