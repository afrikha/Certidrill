id: az900-2d-ca-signin-flow
objective: "2.4.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A user signs in to an application that is protected by Microsoft Entra Conditional Access.

    Which three actions does Conditional Access perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un utilisateur se connecte à une application protégée par l'accès conditionnel Microsoft Entra.

    Quelles sont les trois actions que l'accès conditionnel effectue dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: role, text: { en: "Assign an Azure role to the user at the scope of the application.", fr: "Attribuer un rôle Azure à l'utilisateur à l'étendue de l'application." } }
    - { id: dec, text: { en: "Make a decision based on the signals.", fr: "Prendre une décision à partir des signaux." } }
    - { id: sync, text: { en: "Synchronize the password of the user by using Microsoft Entra Connect.", fr: "Synchroniser le mot de passe de l'utilisateur avec Microsoft Entra Connect." } }
    - { id: sig, text: { en: "Collect signals such as the user, the location and the device.", fr: "Collecter des signaux tels que l'utilisateur, l'emplacement et l'appareil." } }
    - { id: pol, text: { en: "Evaluate the compliance of the application's resources with Azure Policy.", fr: "Évaluer la conformité des ressources de l'application avec Azure Policy." } }
    - { id: enf, text: { en: "Enforce the decision: allow access, block access or require multifactor authentication.", fr: "Appliquer la décision : autoriser l'accès, le bloquer ou exiger l'authentification multifacteur." } }
answer:
  sequence: [ sig, dec, enf ]
explanation:
  correct:
    en: "During a sign-in, Conditional Access first collects signals (who the user is, where the user is, which device and application are involved). It then makes a decision from these signals, and finally enforces it by allowing the request, denying it or challenging the user for multifactor authentication."
    fr: "Pendant une connexion, l'accès conditionnel collecte d'abord des signaux (qui est l'utilisateur, où il se trouve, quels appareil et application sont concernés). Il prend ensuite une décision à partir de ces signaux, puis l'applique en autorisant la demande, en la refusant ou en demandant à l'utilisateur une authentification multifacteur."
  options:
    role: { en: "Role assignments belong to Azure RBAC and are created by administrators, not by Conditional Access during a sign-in.", fr: "Les attributions de rôles relèvent d'Azure RBAC et sont créées par des administrateurs, pas par l'accès conditionnel pendant une connexion." }
    sync: { en: "Password synchronization is done by Microsoft Entra Connect between an on-premises directory and Microsoft Entra ID; it is not a step of Conditional Access.", fr: "La synchronisation des mots de passe est assurée par Microsoft Entra Connect entre un annuaire local et Microsoft Entra ID ; ce n'est pas une étape de l'accès conditionnel." }
    pol: { en: "Azure Policy evaluates the configuration of resources against rules; it plays no part in a sign-in.", fr: "Azure Policy évalue la configuration des ressources par rapport à des règles ; il n'intervient pas dans une connexion." }
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
