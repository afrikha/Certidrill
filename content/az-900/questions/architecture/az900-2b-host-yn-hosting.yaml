id: az900-2b-host-yn-hosting
objective: "2.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "To distribute traffic between the instances of a web app in Azure App Service, you must deploy a separate load balancer.", fr: "Pour répartir le trafic entre les instances d'une application web dans Azure App Service, vous devez déployer un équilibreur de charge distinct." } }
    - { id: s2, text: { en: "Azure App Service can host web apps on Windows and on Linux.", fr: "Azure App Service peut héberger des applications web sous Windows et sous Linux." } }
    - { id: s3, text: { en: "To run a container in Azure Container Instances, you must first create a Kubernetes cluster.", fr: "Pour exécuter un conteneur dans Azure Container Instances, vous devez d'abord créer un cluster Kubernetes." } }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "App Service includes built-in load balancing, so no separate load balancer is needed, and it supports both Windows and Linux. Azure Container Instances runs containers without any virtual machine to manage and without a higher-level orchestrator such as Kubernetes."
    fr: "App Service comprend un équilibrage de charge intégré : aucun équilibreur de charge distinct n'est nécessaire, et il prend en charge Windows comme Linux. Azure Container Instances exécute des conteneurs sans aucune machine virtuelle à gérer et sans orchestrateur de plus haut niveau comme Kubernetes."
references:
  - title: "Describe application hosting options"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options
  - title: "What is Azure Container Instances?"
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
