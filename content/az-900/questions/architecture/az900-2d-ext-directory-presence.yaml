id: az900-2d-ext-directory-presence
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      External users who are invited through B2B collaboration are typically represented in your directory as [[collab]].

      External users who work with you through B2B direct connect [[direct]].
    fr: |
      Les utilisateurs externes invités par la collaboration B2B sont en général représentés dans votre annuaire comme [[collab]].

      Les utilisateurs externes qui travaillent avec vous par la connexion directe B2B [[direct]].
  slots:
    - id: collab
      options:
        - { id: sp, text: { en: "service principals", fr: "principaux de service" } }
        - { id: guest, text: { en: "guest users", fr: "utilisateurs invités" } }
        - { id: mi, text: { en: "managed identities", fr: "identités managées" } }
    - id: direct
      options:
        - { id: asguest, text: { en: "are represented in your directory as guest users", fr: "sont représentés dans votre annuaire comme utilisateurs invités" } }
        - { id: asmember, text: { en: "are represented in your directory as member users", fr: "sont représentés dans votre annuaire comme utilisateurs membres" } }
        - { id: none, text: { en: "are not represented in your directory", fr: "ne sont pas représentés dans votre annuaire" } }
answer:
  values: { collab: guest, direct: none }
explanation:
  correct:
    en: "With B2B collaboration, a user object is created in your directory for each external user, typically as a guest user that you can add to groups and give access to. B2B direct connect relies on a mutual trust between two Microsoft Entra organizations: the users stay in their home organization and are not added to your directory."
    fr: "Avec la collaboration B2B, un objet utilisateur est créé dans votre annuaire pour chaque utilisateur externe, en général comme utilisateur invité que vous pouvez ajouter à des groupes et auquel vous donnez accès. La connexion directe B2B repose sur une approbation mutuelle entre deux organisations Microsoft Entra : les utilisateurs restent dans leur organisation d'origine et ne sont pas ajoutés à votre annuaire."
  options:
    sp:
      en: "A service principal is the identity of an application, not of an invited person."
      fr: "Un principal de service est l'identité d'une application, pas celle d'une personne invitée."
    mi:
      en: "A managed identity is an identity that Azure manages for an Azure resource, not for an external person."
      fr: "Une identité managée est une identité qu'Azure gère pour une ressource Azure, pas pour une personne externe."
references:
  - title: Describe Azure external identities
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
