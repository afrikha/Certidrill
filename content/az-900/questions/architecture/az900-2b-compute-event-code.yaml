id: az900-2b-compute-event-code
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company needs to run a short piece of code each time a message arrives in a queue. The company wants no infrastructure to manage and wants to pay only while the code runs.

    Which compute type should you use?
  fr: |
    Votre entreprise doit exécuter un court morceau de code chaque fois qu'un message arrive dans une file d'attente. Elle ne veut gérer aucune infrastructure et veut payer uniquement pendant l'exécution du code.

    Quel type de calcul devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A virtual machine", fr: "Une machine virtuelle" } }
    - { id: b, text: { en: "A container", fr: "Un conteneur" } }
    - { id: c, text: { en: "A function", fr: "Une fonction" } }
    - { id: d, text: { en: "A virtual machine scale set", fr: "Un groupe de machines virtuelles identiques" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A function is serverless, event-driven code: an event such as a queue message wakes it up, and there is no virtual machine or container to maintain. Azure Functions releases the resources when the code finishes and charges only for the time during which the code runs."
    fr: "Une fonction est du code serverless déclenché par des événements : un événement, comme un message dans une file d'attente, la réveille, et il n'y a ni machine virtuelle ni conteneur à maintenir. Azure Functions libère les ressources à la fin du code et ne facture que le temps pendant lequel le code s'exécute."
  options:
    a: { en: "A virtual machine must stay running to wait for messages, is billed while it runs, and you manage its operating system.", fr: "Une machine virtuelle doit rester en service pour attendre les messages, est facturée tant qu'elle fonctionne, et vous gérez son système d'exploitation." }
    b: { en: "A container must be deployed and kept running to wait for messages; it isn't started and billed per event.", fr: "Un conteneur doit être déployé et rester en service pour attendre les messages ; il n'est pas démarré ni facturé à chaque événement." }
    d: { en: "A scale set is a group of virtual machines: there is still infrastructure to manage and to pay for while it runs.", fr: "Un groupe identique est un ensemble de machines virtuelles : il reste une infrastructure à gérer et à payer tant qu'elle fonctionne." }
references:
  - title: "Describe Azure functions"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
  - title: "What is Azure Functions?"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
