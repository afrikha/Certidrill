id: az900-2a-az-limits
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to make an application highly available by using availability zones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de rendre une application hautement disponible à l'aide des zones de disponibilité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A zone-redundant service is replicated across availability zones by the Azure platform."
        fr: "Un service redondant interzone est répliqué entre les zones de disponibilité par la plateforme Azure."
    - id: s2
      text:
        en: "An application deployed across three availability zones of one region stays available if the entire region fails."
        fr: "Une application déployée dans trois zones de disponibilité d'une même région reste disponible si la région entière tombe en panne."
    - id: s3
      text:
        en: "To use availability zones, Litware must deploy the application to the two regions of a region pair."
        fr: "Pour utiliser les zones de disponibilité, Litware doit déployer l'application dans les deux régions d'une paire de régions."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      For zone-redundant services, such as zone-redundant storage, the platform itself replicates the resource across zones. Availability zones all belong to one region: they protect against the loss of a zone, not against an event that affects the whole region, and using them does not require a second region. Protection against a regional failure needs a deployment in another region.
    fr: |
      Pour les services redondants interzone, comme le stockage redondant interzone, c'est la plateforme qui réplique la ressource entre les zones. Les zones de disponibilité appartiennent toutes à une seule région : elles protègent contre la perte d'une zone, pas contre un événement qui touche toute la région, et leur utilisation n'exige pas de deuxième région. La protection contre une panne régionale nécessite un déploiement dans une autre région.
references:
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
  - title: What are availability zones?
    url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
