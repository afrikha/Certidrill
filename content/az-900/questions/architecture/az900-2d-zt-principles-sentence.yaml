id: az900-2d-zt-principles-sentence
objective: "2.4.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The three guiding principles of the Zero Trust model are verify explicitly, [[p2]] and [[p3]].
    fr: |
      Les trois principes directeurs du modèle Confiance Zéro sont vérifier explicitement, [[p2]] et [[p3]].
  slots:
    - id: p2
      options:
        - { id: internal, text: { en: "trust the internal network", fr: "approuver le réseau interne" } }
        - { id: least, text: { en: "use least privilege access", fr: "utiliser l'accès selon le moindre privilège" } }
        - { id: perimeter, text: { en: "rely on the network perimeter", fr: "s'appuyer sur le périmètre du réseau" } }
    - id: p3
      options:
        - { id: did, text: { en: "apply defense in depth", fr: "appliquer la défense en profondeur" } }
        - { id: shared, text: { en: "share responsibility", fr: "partager la responsabilité" } }
        - { id: breach, text: { en: "assume breach", fr: "supposer une violation" } }
answer:
  values: { p2: least, p3: breach }
explanation:
  correct:
    en: "Zero Trust rests on three guiding principles: verify explicitly, use least privilege access, and assume breach. Together they replace the trust that the traditional model placed in the corporate network."
    fr: "La Confiance Zéro repose sur trois principes directeurs : vérifier explicitement, utiliser l'accès selon le moindre privilège et supposer une violation. Ensemble, ils remplacent la confiance que le modèle traditionnel accordait au réseau de l'entreprise."
  options:
    internal: { en: "Trusting the internal network is the assumption of the traditional model, which Zero Trust rejects.", fr: "Approuver le réseau interne est l'hypothèse du modèle traditionnel, que la Confiance Zéro rejette." }
    perimeter: { en: "Relying on the perimeter is the traditional approach; Zero Trust grants access based on authentication, not on location.", fr: "S'appuyer sur le périmètre est l'approche traditionnelle ; la Confiance Zéro accorde l'accès selon l'authentification, pas selon l'emplacement." }
    did: { en: "Defense in depth is a separate model made of layers of protection; it is not one of the three Zero Trust principles.", fr: "La défense en profondeur est un modèle distinct, fait de couches de protection ; ce n'est pas l'un des trois principes de la Confiance Zéro." }
    shared: { en: "Shared responsibility splits security tasks between the cloud provider and the customer; it is not a Zero Trust principle.", fr: "La responsabilité partagée répartit les tâches de sécurité entre le fournisseur de cloud et le client ; ce n'est pas un principe de la Confiance Zéro." }
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
