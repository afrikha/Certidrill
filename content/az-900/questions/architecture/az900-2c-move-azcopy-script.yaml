id: az900-2c-move-azcopy-script
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Linux server of Contoso has no graphical interface. Each night, a script on the server must copy new blobs from one storage account to another storage account.

    Which tool should the script use?
  fr: |
    Un serveur Linux de Contoso ne dispose d'aucune interface graphique. Chaque nuit, un script du serveur doit copier les nouveaux objets blob d'un compte de stockage vers un autre compte de stockage.

    Quel outil le script doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" }
    - id: b
      text: { en: "Azure File Sync", fr: "Azure File Sync" }
    - id: c
      text: { en: "AzCopy", fr: "AzCopy" }
    - id: d
      text: { en: "Azure Data Box", fr: "Azure Data Box" }
answer: { optionId: c }
explanation:
  correct:
    en: AzCopy is a command-line utility that copies blobs and files to, from and between storage accounts. Because it runs from the command line on Windows, Linux and macOS, it can be called from a script.
    fr: AzCopy est un utilitaire en ligne de commande qui copie des objets blob et des fichiers vers, depuis et entre des comptes de stockage. Comme il s'exécute en ligne de commande sous Windows, Linux et macOS, il peut être appelé depuis un script.
  options:
    a:
      en: Azure Storage Explorer is a graphical application. It needs a desktop and a person who operates it.
      fr: L'Explorateur Stockage Azure est une application graphique. Il lui faut un bureau et une personne qui l'utilise.
    b:
      en: Azure File Sync runs on Windows Server and synchronizes file servers with Azure file shares, not blobs between storage accounts.
      fr: Azure File Sync s'exécute sur Windows Server et synchronise des serveurs de fichiers avec des partages de fichiers Azure, pas des objets blob entre comptes de stockage.
    d:
      en: Azure Data Box is a physical device for offline transfers between a datacenter and Azure.
      fr: Azure Data Box est un appareil physique destiné aux transferts hors connexion entre un centre de données et Azure.
references:
  - title: Get started with AzCopy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
