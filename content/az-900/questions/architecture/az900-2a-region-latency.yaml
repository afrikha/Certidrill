id: az900-2a-region-latency
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy a web application to Azure. All the users of the application are in Japan.

    Tailspin Toys needs to minimize network latency for the users.

    What should Tailspin Toys do?
  fr: |
    Tailspin Toys prévoit de déployer une application web dans Azure. Tous les utilisateurs de l'application se trouvent au Japon.

    Tailspin Toys doit réduire au minimum la latence réseau pour les utilisateurs.

    Que doit faire Tailspin Toys ?
body:
  options:
    - id: a
      text: { en: "Deploy the application to the region that has the most availability zones", fr: "Déployer l'application dans la région qui compte le plus de zones de disponibilité" }
    - id: b
      text: { en: "Deploy the application to a region that is close to the users", fr: "Déployer l'application dans une région proche des utilisateurs" }
    - id: c
      text: { en: "Create a dedicated subscription for the application", fr: "Créer un abonnement dédié à l'application" }
    - id: d
      text: { en: "Set the location of the application's resource group to a region close to the users", fr: "Définir une région proche des utilisateurs comme emplacement du groupe de ressources de l'application" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Latency depends on the distance between the users and the region where the resource runs. Choosing a region close to the users, here a region in Japan, keeps the network path short.
    fr: |
      La latence dépend de la distance entre les utilisateurs et la région où la ressource s'exécute. Choisir une région proche des utilisateurs, ici une région située au Japon, raccourcit le chemin réseau.
  options:
    a: { en: "Availability zones improve resiliency inside a region; they do not bring the application closer to the users.", fr: "Les zones de disponibilité améliorent la résilience au sein d'une région ; elles ne rapprochent pas l'application des utilisateurs." }
    c: { en: "A subscription is a unit of management and billing; it has no geographic location that affects latency.", fr: "Un abonnement est une unité de gestion et de facturation ; il n'a pas d'emplacement géographique qui influence la latence." }
    d: { en: "The location of a resource group only determines where its metadata is stored; the application runs in the region chosen for the application itself.", fr: "L'emplacement d'un groupe de ressources détermine seulement où ses métadonnées sont stockées ; l'application s'exécute dans la région choisie pour l'application elle-même." }
references:
  - title: What are Azure regions?
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-overview
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
