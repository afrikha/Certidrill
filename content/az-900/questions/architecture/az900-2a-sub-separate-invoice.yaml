id: az900-2a-sub-separate-invoice
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has one subscription that contains two resource groups named **RG-Dev** and **RG-Prod**.

    The finance department requires a separate invoice for the production resources.

    What should Litware do?
  fr: |
    Litware dispose d'un abonnement qui contient deux groupes de ressources nommés **RG-Dev** et **RG-Prod**.

    Le service financier exige une facture distincte pour les ressources de production.

    Que doit faire Litware ?
body:
  options:
    - id: a
      text: { en: "Create a second subscription and move the production resources to it", fr: "Créer un deuxième abonnement et y déplacer les ressources de production" }
    - id: b
      text: { en: "Create a management group and move the resource group RG-Prod into it", fr: "Créer un groupe d'administration et y déplacer le groupe de ressources RG-Prod" }
    - id: c
      text: { en: "Apply a tag named Environment to all the resources of RG-Prod", fr: "Appliquer une étiquette nommée Environment à toutes les ressources de RG-Prod" }
    - id: d
      text: { en: "Create a budget that is scoped to the resource group RG-Prod", fr: "Créer un budget dont l'étendue est le groupe de ressources RG-Prod" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The subscription is the billing boundary: Azure produces one billing report and one invoice per subscription. Hosting the production resources in their own subscription is what gives them their own invoice.
    fr: |
      L'abonnement est la limite de facturation : Azure produit un rapport de facturation et une facture par abonnement. C'est l'hébergement des ressources de production dans leur propre abonnement qui leur donne leur propre facture.
  options:
    b: { en: "A management group contains subscriptions and other management groups, not resource groups, and it does not split an invoice.", fr: "Un groupe d'administration contient des abonnements et d'autres groupes d'administration, pas des groupes de ressources, et il ne scinde pas une facture." }
    c: { en: "Tags let you filter costs in reports, but the subscription still receives a single invoice.", fr: "Les étiquettes permettent de filtrer les coûts dans les rapports, mais l'abonnement reçoit toujours une seule facture." }
    d: { en: "A budget tracks spending against a threshold and sends alerts; it does not produce an invoice.", fr: "Un budget suit les dépenses par rapport à un seuil et envoie des alertes ; il ne produit pas de facture." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: Move Azure resources to a new resource group or subscription
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription
