id: az900-2c-mig-migrate-assess
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to move 200 VMware virtual machines from its datacenter to Azure. Before the move, the company wants to discover the servers and check whether they are ready to run in Azure.

    Which service should you use?
  fr: |
    Contoso prévoit de déplacer 200 machines virtuelles VMware de son centre de données vers Azure. Avant le déplacement, l'entreprise veut découvrir les serveurs et vérifier qu'ils sont prêts à fonctionner dans Azure.

    Quel service devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Data Box", fr: "Azure Data Box" }
    - id: b
      text: { en: "Azure Migrate", fr: "Azure Migrate" }
    - id: c
      text: { en: "Azure File Sync", fr: "Azure File Sync" }
    - id: d
      text: { en: "Azure Advisor", fr: "Azure Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Migrate is the hub for moving an on-premises environment to Azure. Its discovery and assessment tool finds the on-premises servers, including VMware virtual machines, and assesses their readiness for Azure before the migration starts.
    fr: Azure Migrate est le hub qui sert à déplacer un environnement local vers Azure. Son outil de découverte et d'évaluation trouve les serveurs locaux, dont les machines virtuelles VMware, et évalue s'ils sont prêts pour Azure avant le début de la migration.
  options:
    a:
      en: Azure Data Box transfers large amounts of data offline on a physical device. It doesn't discover or assess servers.
      fr: Azure Data Box transfère de grandes quantités de données hors connexion sur un appareil physique. Il ne découvre pas et n'évalue pas de serveurs.
    c:
      en: Azure File Sync synchronizes Windows file servers with Azure file shares. It doesn't assess virtual machines.
      fr: Azure File Sync synchronise des serveurs de fichiers Windows avec des partages de fichiers Azure. Il n'évalue pas de machines virtuelles.
    d:
      en: Azure Advisor gives recommendations about resources that are already deployed in Azure. It doesn't examine on-premises servers.
      fr: Azure Advisor donne des recommandations sur des ressources déjà déployées dans Azure. Il n'examine pas les serveurs locaux.
references:
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
