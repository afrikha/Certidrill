id: az900-2c-acct-premium-block-blobs
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application of Wingtip Toys writes millions of small block blobs with a very high transaction rate. The application requires consistently low latency.

    Which type of storage account should you use?
  fr: |
    Une application de Wingtip Toys écrit des millions de petits objets blob de blocs avec un taux de transactions très élevé. L'application exige une latence faible et constante.

    Quel type de compte de stockage devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Standard general-purpose v2", fr: "Usage général v2 Standard" }
    - id: b
      text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" }
    - id: c
      text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" }
    - id: d
      text: { en: "Premium file shares", fr: "Partages de fichiers Premium" }
answer: { optionId: b }
explanation:
  correct:
    en: Premium block blobs accounts are designed for block blobs and append blobs with high transaction rates, small objects or a need for consistently low latency. Like the other premium accounts, they store data on solid-state drives.
    fr: Les comptes d'objets blob de blocs Premium sont conçus pour les objets blob de blocs et d'ajout avec des taux de transactions élevés, de petits objets ou un besoin de latence faible et constante. Comme les autres comptes Premium, ils stockent les données sur des disques SSD.
  options:
    a:
      en: A standard general-purpose v2 account can store block blobs, but it doesn't offer the consistently low latency of premium storage.
      fr: Un compte à usage général v2 Standard peut stocker des objets blob de blocs, mais il n'offre pas la latence faible et constante du stockage Premium.
    c:
      en: A premium page blobs account stores only page blobs, not block blobs.
      fr: Un compte d'objets blob de pages Premium ne stocke que des objets blob de pages, pas des objets blob de blocs.
    d:
      en: A premium file shares account stores only Azure Files shares, not blobs.
      fr: Un compte de partages de fichiers Premium ne stocke que des partages Azure Files, pas des objets blob.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
