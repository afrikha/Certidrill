id: az900-2a-hier-cardinality
objective: "2.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A resource group belongs to [[rg]].

      A subscription can contain [[sub]].
    fr: |
      Un groupe de ressources appartient à [[rg]].

      Un abonnement peut contenir [[sub]].
  slots:
    - id: rg
      options:
        - { id: many, text: { en: "one or more subscriptions", fr: "un ou plusieurs abonnements" } }
        - { id: perregion, text: { en: "one subscription for each region that it uses", fr: "un abonnement pour chaque région qu'il utilise" } }
        - { id: one, text: { en: "exactly one subscription", fr: "un seul abonnement" } }
    - id: sub
      options:
        - { id: manyrg, text: { en: "many resource groups", fr: "de nombreux groupes de ressources" } }
        - { id: onerg, text: { en: "only one resource group", fr: "un seul groupe de ressources" } }
        - { id: mgs, text: { en: "several management groups", fr: "plusieurs groupes d'administration" } }
answer:
  values: { rg: one, sub: manyrg }
explanation:
  correct:
    en: |
      The hierarchy is a tree. A subscription organizes many resource groups, and each resource group is created in one subscription only. Management groups are above subscriptions: a subscription is contained in a management group, not the reverse.
    fr: |
      La hiérarchie est une arborescence. Un abonnement organise de nombreux groupes de ressources, et chaque groupe de ressources est créé dans un seul abonnement. Les groupes d'administration se trouvent au-dessus des abonnements : un abonnement est contenu dans un groupe d'administration, et non l'inverse.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
