id: az900-2a-mg-role-scope
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has 30 subscriptions. Twenty of them are in a management group named **MG-Corp**, and the others are in a management group named **MG-Lab**.

    The audit team needs the Reader role on all the resources of the MG-Corp subscriptions, including the subscriptions that will be added to MG-Corp later. The audit team must have no access to the MG-Lab subscriptions. The solution must minimize administrative effort.

    At which scope should Fabrikam assign the Reader role?
  fr: |
    Fabrikam dispose de 30 abonnements. Vingt d'entre eux se trouvent dans un groupe d'administration nommé **MG-Corp**, et les autres dans un groupe d'administration nommé **MG-Lab**.

    L'équipe d'audit a besoin du rôle Reader sur toutes les ressources des abonnements de MG-Corp, y compris les abonnements qui seront ajoutés à MG-Corp plus tard. L'équipe d'audit ne doit avoir aucun accès aux abonnements de MG-Lab. La solution doit réduire au minimum l'effort d'administration.

    À quelle étendue Fabrikam doit-il attribuer le rôle Reader ?
body:
  options:
    - id: a
      text: { en: "The management group MG-Corp", fr: "Le groupe d'administration MG-Corp" }
    - id: b
      text: { en: "The root management group of the tenant", fr: "Le groupe d'administration racine du locataire" }
    - id: c
      text: { en: "Each subscription of MG-Corp", fr: "Chaque abonnement de MG-Corp" }
    - id: d
      text: { en: "Each resource group of the MG-Corp subscriptions", fr: "Chaque groupe de ressources des abonnements de MG-Corp" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A single role assignment on MG-Corp is inherited by every subscription, resource group and resource under MG-Corp, and automatically by any subscription moved or created there later. MG-Lab is outside that scope, so the audit team gets nothing there.
    fr: |
      Une seule attribution de rôle sur MG-Corp est héritée par tous les abonnements, groupes de ressources et ressources situés sous MG-Corp, et automatiquement par tout abonnement qui y sera déplacé ou créé plus tard. MG-Lab se trouve en dehors de cette étendue : l'équipe d'audit n'y obtient donc rien.
  options:
    b: { en: "The root management group is above MG-Lab too, so the audit team would also read the MG-Lab subscriptions.", fr: "Le groupe d'administration racine se trouve aussi au-dessus de MG-Lab : l'équipe d'audit lirait donc aussi les abonnements de MG-Lab." }
    c: { en: "Twenty assignments are needed, and each future subscription requires a new one.", fr: "Vingt attributions sont nécessaires, et chaque futur abonnement en exige une nouvelle." }
    d: { en: "This requires the largest number of assignments and misses every resource group created later.", fr: "Cette solution exige le plus grand nombre d'attributions et ne couvre pas les groupes de ressources créés plus tard." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
