id: az900-2b-vmopt-avd-desktops
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The employees of Litware work from home on personal computers and tablets. They must use a Windows desktop and applications that run in Azure, so that company data stays off their devices.

    Which service should Litware use?
  fr: |
    Les employés de Litware travaillent à domicile sur des ordinateurs personnels et des tablettes. Ils doivent utiliser un bureau Windows et des applications exécutés dans Azure, afin que les données de l'entreprise restent hors de leurs appareils.

    Quel service Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Virtual Machine Scale Sets", fr: "Groupes de machines virtuelles identiques Azure" } }
    - { id: b, text: "Azure App Service" }
    - { id: c, text: "Azure Container Instances" }
    - { id: d, text: "Azure Virtual Desktop" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Virtual Desktop is a desktop and application virtualization service that runs in Azure. Users reach a Windows desktop and applications from many types of devices and locations, while the applications and the data remain in sessions hosted in Azure."
    fr: "Azure Virtual Desktop est un service de virtualisation de postes de travail et d'applications exécuté dans Azure. Les utilisateurs accèdent à un bureau Windows et à des applications depuis de nombreux types d'appareils et de lieux, tandis que les applications et les données restent dans des sessions hébergées dans Azure."
  options:
    a: { en: "A scale set manages a group of load-balanced virtual machines for an application; it doesn't deliver desktops to users.", fr: "Un groupe identique gère un ensemble de machines virtuelles à charge équilibrée pour une application ; il ne fournit pas de bureaux aux utilisateurs." }
    b: { en: "App Service hosts web applications and APIs, not Windows desktops.", fr: "App Service héberge des applications web et des API, pas des bureaux Windows." }
    c: { en: "Container Instances runs containers; it doesn't provide a Windows desktop to users.", fr: "Container Instances exécute des conteneurs ; il ne fournit pas de bureau Windows aux utilisateurs." }
references:
  - title: "Describe Azure virtual desktop"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/4-virtual-desktop
  - title: "What is Azure Virtual Desktop?"
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/overview
