id: az900-2c-red-archive-region
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum must keep legal records as blobs for ten years. The records aren't expected to be read, and a retrieval delay of several hours is acceptable. The records must survive the loss of an entire Azure region.

    You need to minimize the storage cost. Which configuration should you use?
  fr: |
    Adatum doit conserver des documents juridiques sous forme d'objets blob pendant dix ans. Ces documents ne devraient pas être lus, et un délai de récupération de plusieurs heures est acceptable. Les documents doivent survivre à la perte d'une région Azure entière.

    Vous devez réduire au minimum le coût de stockage. Quelle configuration devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The archive tier with locally redundant storage (LRS)", fr: "Le niveau archive (Archive) avec le stockage localement redondant (LRS)" }
    - id: b
      text: { en: "The hot tier with zone-redundant storage (ZRS)", fr: "Le niveau chaud (Hot) avec le stockage redondant interzone (ZRS)" }
    - id: c
      text: { en: "The archive tier with geo-redundant storage (GRS)", fr: "Le niveau archive (Archive) avec le stockage géoredondant (GRS)" }
    - id: d
      text: { en: "The cool tier with geo-zone-redundant storage (GZRS)", fr: "Le niveau froid (Cool) avec le stockage géoredondant interzone (GZRS)" }
answer: { optionId: c }
explanation:
  correct:
    en: Two decisions are combined. The access tier sets the price of storage, and the archive tier is the cheapest tier for data that tolerates hours of delay. The redundancy option sets where the copies are, and only a geo-redundant option such as GRS keeps a copy in a second region.
    fr: Deux décisions sont combinées. Le niveau d'accès fixe le prix du stockage, et le niveau archive (Archive) est le moins cher pour des données qui tolèrent des heures de délai. L'option de redondance fixe l'emplacement des copies, et seule une option géoredondante telle que GRS conserve une copie dans une deuxième région.
  options:
    a:
      en: The archive tier gives the lowest storage cost, but LRS keeps every copy in one datacenter. The records would not survive the loss of the region.
      fr: Le niveau archive (Archive) donne le coût de stockage le plus bas, mais LRS conserve toutes les copies dans un seul centre de données. Les documents ne survivraient pas à la perte de la région.
    b:
      en: ZRS protects against the loss of a zone, not of the whole region, and the hot tier has the highest storage cost.
      fr: ZRS protège contre la perte d'une zone, pas de la région entière, et le niveau chaud (Hot) a le coût de stockage le plus élevé.
    d:
      en: GZRS survives the loss of a region, but storing data in the cool tier costs much more than in the archive tier.
      fr: GZRS survit à la perte d'une région, mais le stockage dans le niveau froid (Cool) coûte bien plus cher que dans le niveau archive (Archive).
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
