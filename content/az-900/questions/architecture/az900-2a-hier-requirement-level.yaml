id: az900-2a-hier-requirement-level
objective: "2.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the level of the Azure hierarchy that meets it. To answer, drag the appropriate level to each requirement. Each level may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin au niveau de la hiérarchie Azure qui y répond. Pour répondre, faites glisser le niveau approprié vers chaque besoin. Chaque niveau peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mg, text: { en: "Management group", fr: "Groupe d'administration" } }
    - { id: sub, text: { en: "Subscription", fr: "Abonnement" } }
    - { id: rg, text: { en: "Resource group", fr: "Groupe de ressources" } }
    - { id: res, text: { en: "Resource", fr: "Ressource" } }
  targets:
    - id: t1
      text: { en: "Receive a separate invoice for the Azure costs of a department", fr: "Recevoir une facture distincte pour les coûts Azure d'un service" }
    - id: t2
      text: { en: "Delete all the components of one application in a single operation, without affecting the other applications that are billed on the same invoice", fr: "Supprimer tous les composants d'une application en une seule opération, sans toucher aux autres applications facturées sur la même facture" }
    - id: t3
      text: { en: "Apply the same governance rules to several departments that are invoiced separately, with a single assignment", fr: "Appliquer les mêmes règles de gouvernance à plusieurs services facturés séparément, avec une seule attribution" }
answer:
  mapping: { t1: sub, t2: rg, t3: mg }
explanation:
  correct:
    en: |
      A subscription is the billing boundary: each one has its own invoice. A resource group holds the resources of one application inside a subscription, and deleting the group deletes them all. A management group sits above subscriptions, so one assignment made on it is inherited by several subscriptions. A single resource is the narrowest scope and groups nothing.
    fr: |
      Un abonnement est la limite de facturation : chacun a sa propre facture. Un groupe de ressources contient les ressources d'une application à l'intérieur d'un abonnement, et supprimer le groupe les supprime toutes. Un groupe d'administration se trouve au-dessus des abonnements : une seule attribution effectuée à ce niveau est héritée par plusieurs abonnements. Une ressource isolée est l'étendue la plus étroite et ne regroupe rien.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
