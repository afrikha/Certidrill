id: az900-2d-dfc-identify
objective: "2.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has resources in Azure, in its own datacenter and in Amazon Web Services (AWS). The security team wants a single tool that assesses the security posture of all these resources and raises alerts when it detects a threat.

    Which service should Proseware use?
  fr: |
    Proseware possède des ressources dans Azure, dans son propre centre de données et dans Amazon Web Services (AWS). L'équipe de sécurité veut un outil unique qui évalue la posture de sécurité de toutes ces ressources et émet des alertes lorsqu'il détecte une menace.

    Quel service Proseware doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Advisor", fr: "Azure Advisor" }
    - id: b
      text: { en: "Azure Service Health", fr: "Azure Service Health" }
    - id: c
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
    - id: d
      text: { en: "Azure Monitor", fr: "Azure Monitor" }
answer: { optionId: c }
explanation:
  correct:
    en: "Defender for Cloud is a security posture management and threat protection tool. It monitors cloud, on-premises, hybrid and multicloud environments, gives recommendations to harden them, and generates security alerts when it detects a threat."
    fr: "Defender pour le cloud est un outil de gestion de la posture de sécurité et de protection contre les menaces. Il surveille les environnements cloud, locaux, hybrides et multiclouds, donne des recommandations pour les renforcer et génère des alertes de sécurité lorsqu'il détecte une menace."
  options:
    a:
      en: "Azure Advisor gives best-practice recommendations for Azure resources (cost, reliability, performance, security, operational excellence); it does not detect threats or cover AWS and on-premises servers."
      fr: "Azure Advisor donne des recommandations de bonnes pratiques pour les ressources Azure (coût, fiabilité, performances, sécurité, excellence opérationnelle) ; il ne détecte pas les menaces et ne couvre ni AWS ni les serveurs locaux."
    b:
      en: "Azure Service Health informs you about incidents and planned maintenance of the Azure services that you use; it is not a security tool."
      fr: "Azure Service Health vous informe des incidents et des maintenances planifiées des services Azure que vous utilisez ; ce n'est pas un outil de sécurité."
    d:
      en: "Azure Monitor collects and analyzes metrics and logs to follow performance and availability; it does not assess a security posture."
      fr: "Azure Monitor collecte et analyse des métriques et des journaux pour suivre les performances et la disponibilité ; il n'évalue pas une posture de sécurité."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
