id: az900-2c-auth-yn-sso-mfa
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With single sign-on (SSO), a user enters the same password separately in each application.
        fr: Avec l'authentification unique (SSO), un utilisateur saisit le même mot de passe séparément dans chaque application.
    - id: s2
      text:
        en: Single sign-on (SSO) reduces the number of passwords that users must remember.
        fr: L'authentification unique (SSO) réduit le nombre de mots de passe que les utilisateurs doivent retenir.
    - id: s3
      text:
        en: With multifactor authentication (MFA), an attacker who steals only the password of a user can still sign in.
        fr: Avec l'authentification multifacteur (MFA), un attaquant qui ne vole que le mot de passe d'un utilisateur peut tout de même se connecter.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: With SSO, the user signs in once, and that sign-in gives access to the other applications. One identity replaces many, so there are fewer passwords to remember. MFA asks for an additional proof at sign-in, such as a code on a phone or a fingerprint, so a stolen password alone isn't enough.
    fr: Avec l'authentification unique, l'utilisateur se connecte une seule fois, et cette connexion donne accès aux autres applications. Une identité en remplace plusieurs, il y a donc moins de mots de passe à retenir. L'authentification multifacteur demande une preuve supplémentaire à la connexion, comme un code sur un téléphone ou une empreinte digitale, un mot de passe volé ne suffit donc pas à lui seul.
  options:
    s1:
      en: Entering the same password in each application is not SSO. With SSO, one sign-in is reused by all the applications.
      fr: Saisir le même mot de passe dans chaque application n'est pas de l'authentification unique. Avec elle, une seule connexion est réutilisée par toutes les applications.
    s3:
      en: The attacker would also need the second factor, for example the phone of the user. The password alone doesn't open the account.
      fr: L'attaquant aurait aussi besoin du deuxième facteur, par exemple le téléphone de l'utilisateur. Le mot de passe seul n'ouvre pas le compte.
references:
  - title: Describe Azure authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods
