id: az900-2c-mig-dd-vms-files
objective: "2.3.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to close its datacenter, which hosts 300 Hyper-V virtual machines and 60 TB of archived files. With the internet connection of the datacenter, uploading the files would take about two months. The files must be in Azure within two weeks.

    Select the answers that correctly complete the sentences.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de fermer son centre de données, qui héberge 300 machines virtuelles Hyper-V et 60 To de fichiers archivés. Avec la connexion Internet du centre de données, le chargement des fichiers prendrait environ deux mois. Les fichiers doivent être dans Azure d'ici deux semaines.

    Sélectionnez les réponses qui complètent correctement les phrases.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To assess the virtual machines and move them to Azure, use [[vms]].

      To transfer the archived files, use [[files]].
    fr: |
      Pour évaluer les machines virtuelles et les déplacer vers Azure, utilisez [[vms]].

      Pour transférer les fichiers archivés, utilisez [[files]].
  slots:
    - id: vms
      options:
        - { id: azcopy, text: "AzCopy" }
        - { id: databox, text: "Azure Data Box" }
        - { id: filesync, text: "Azure File Sync" }
        - { id: migrate, text: "Azure Migrate" }
    - id: files
      options:
        - { id: azcopy, text: "AzCopy" }
        - { id: databox, text: "Azure Data Box" }
        - { id: filesync, text: "Azure File Sync" }
        - { id: migrate, text: "Azure Migrate" }
answer:
  values: { vms: migrate, files: databox }
explanation:
  correct:
    en: Azure Migrate discovers, assesses and migrates servers, including Hyper-V virtual machines. For the files, the network is the obstacle. Azure Data Box carries the data on a physical device, so the transfer doesn't depend on the internet connection.
    fr: Azure Migrate découvre, évalue et migre des serveurs, dont les machines virtuelles Hyper-V. Pour les fichiers, c'est le réseau qui fait obstacle. Azure Data Box transporte les données sur un appareil physique, le transfert ne dépend donc pas de la connexion Internet.
  options:
    azcopy: { en: "AzCopy copies files over the network, which would take about two months here. It doesn't assess or migrate virtual machines.", fr: "AzCopy copie les fichiers par le réseau, ce qui prendrait ici environ deux mois. Il n'évalue pas et ne migre pas de machines virtuelles." }
    filesync: { en: "Azure File Sync also transfers data over the network, and it is meant to keep a Windows file server in service, not to empty a datacenter.", fr: "Azure File Sync transfère lui aussi les données par le réseau, et il sert à garder un serveur de fichiers Windows en service, pas à vider un centre de données." }
references:
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
