id: az900-2c-acct-dd-endpoints
objective: "2.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A storage account named **woodgrovedata** contains blob containers and file shares.

    Select the answers that correctly complete the service endpoints.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **woodgrovedata** contient des conteneurs d'objets blob et des partages de fichiers.

    Sélectionnez les réponses qui complètent correctement les points de terminaison des services.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Blob Storage: https://woodgrovedata.[[blob]].core.windows.net

      Azure Files: https://woodgrovedata.[[files]].core.windows.net
    fr: |
      Stockage Blob : https://woodgrovedata.[[blob]].core.windows.net

      Azure Files : https://woodgrovedata.[[files]].core.windows.net
  slots:
    - id: blob
      options:
        - { id: blob, text: "blob" }
        - { id: file, text: "file" }
        - { id: queue, text: "queue" }
        - { id: table, text: "table" }
    - id: files
      options:
        - { id: blob, text: "blob" }
        - { id: file, text: "file" }
        - { id: queue, text: "queue" }
        - { id: table, text: "table" }
answer:
  values: { blob: blob, files: file }
explanation:
  correct:
    en: Each data service of a storage account has its own endpoint, built from the account name and the name of the service. Blob Storage uses `blob.core.windows.net` and Azure Files uses `file.core.windows.net`. The `queue` and `table` endpoints belong to Queue Storage and Table Storage.
    fr: Chaque service de données d'un compte de stockage a son propre point de terminaison, formé du nom du compte et du nom du service. Le Stockage Blob utilise `blob.core.windows.net` et Azure Files utilise `file.core.windows.net`. Les points de terminaison `queue` et `table` appartiennent au Stockage File d'attente et au Stockage Table.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
