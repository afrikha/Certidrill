id: az900-2c-acct-gpv2-default
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders needs a single storage account that holds blobs, file shares, queues and tables.

    Which type of storage account should you create?
  fr: |
    Northwind Traders a besoin d'un seul compte de stockage qui contienne des objets blob, des partages de fichiers, des files d'attente et des tables.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" }
    - id: b
      text: { en: "Premium file shares", fr: "Partages de fichiers Premium" }
    - id: c
      text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" }
    - id: d
      text: { en: "Standard general-purpose v2", fr: "Usage général v2 Standard" }
answer: { optionId: d }
explanation:
  correct:
    en: A standard general-purpose v2 account supports Blob Storage, Azure Files, Queue Storage and Table Storage in the same account. It is the account type that Microsoft recommends for most scenarios.
    fr: Un compte à usage général v2 Standard prend en charge le Stockage Blob, Azure Files, le Stockage File d'attente et le Stockage Table dans le même compte. C'est le type de compte que Microsoft recommande pour la plupart des scénarios.
  options:
    a:
      en: A premium block blobs account stores only block blobs and append blobs.
      fr: Un compte d'objets blob de blocs Premium ne stocke que des objets blob de blocs et des objets blob d'ajout.
    b:
      en: A premium file shares account stores only Azure Files shares.
      fr: Un compte de partages de fichiers Premium ne stocke que des partages Azure Files.
    c:
      en: A premium page blobs account stores only page blobs.
      fr: Un compte d'objets blob de pages Premium ne stocke que des objets blob de pages.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
