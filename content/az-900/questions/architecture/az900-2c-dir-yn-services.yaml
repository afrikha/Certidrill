id: az900-2c-dir-yn-services
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An organization that subscribes to Microsoft 365 already uses Microsoft Entra ID to authenticate its users.
        fr: Une organisation abonnée à Microsoft 365 utilise déjà Microsoft Entra ID pour authentifier ses utilisateurs.
    - id: s2
      text:
        en: Microsoft Entra ID can manage access to cloud applications and to on-premises applications.
        fr: Microsoft Entra ID peut gérer l'accès aux applications cloud et aux applications locales.
    - id: s3
      text:
        en: To use Microsoft Entra Domain Services, you deploy domain controllers on Azure virtual machines and keep them patched.
        fr: Pour utiliser Microsoft Entra Domain Services, vous déployez des contrôleurs de domaine sur des machines virtuelles Azure et vous les maintenez à jour.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Subscribers to Microsoft 365, Azure and Dynamics CRM Online already authenticate with Microsoft Entra ID. Its application management covers cloud applications and on-premises applications. With Microsoft Entra Domain Services, Microsoft deploys and maintains the domain controllers of the managed domain for you.
    fr: Les abonnés à Microsoft 365, Azure et Dynamics CRM Online s'authentifient déjà avec Microsoft Entra ID. Sa gestion des applications couvre les applications cloud et les applications locales. Avec Microsoft Entra Domain Services, Microsoft déploie et maintient pour vous les contrôleurs de domaine du domaine managé.
  options:
    s3:
      en: The domain controllers of a managed domain are deployed, patched and backed up by Microsoft. You don't manage them.
      fr: Les contrôleurs de domaine d'un domaine managé sont déployés, corrigés et sauvegardés par Microsoft. Vous ne les gérez pas.
references:
  - title: Describe Azure directory services
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
