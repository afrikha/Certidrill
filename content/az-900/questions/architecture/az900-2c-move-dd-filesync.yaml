id: az900-2c-move-dd-filesync
objective: "2.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Select the answers that correctly complete the sentences.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez les réponses qui complètent correctement les phrases.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The Azure File Sync agent is installed on a server that runs [[os]].

      The [[feature]] feature keeps only the most frequently accessed files on the local server.
    fr: |
      L'agent Azure File Sync s'installe sur un serveur qui exécute [[os]].

      La fonctionnalité [[feature]] ne garde sur le serveur local que les fichiers les plus souvent consultés.
  slots:
    - id: os
      options:
        - { id: linux, text: "Linux" }
        - { id: macos, text: "macOS" }
        - { id: windows, text: "Windows Server" }
    - id: feature
      options:
        - { id: tiering, text: { en: "cloud tiering", fr: "de hiérarchisation cloud" } }
        - { id: lifecycle, text: { en: "lifecycle management", fr: "de gestion du cycle de vie" } }
        - { id: georep, text: { en: "geo-redundant storage", fr: "de stockage géoredondant" } }
answer:
  values: { os: windows, feature: tiering }
explanation:
  correct:
    en: Azure File Sync turns a Windows Server file server into a local cache of an Azure file share. With cloud tiering, the files that are used most often stay on the server, and the others are kept in Azure until someone requests them.
    fr: Azure File Sync transforme un serveur de fichiers Windows Server en cache local d'un partage de fichiers Azure. Avec la hiérarchisation cloud, les fichiers les plus utilisés restent sur le serveur, et les autres sont conservés dans Azure jusqu'à ce que quelqu'un les demande.
  options:
    lifecycle: { en: "Lifecycle management moves blobs between access tiers in Blob Storage. It doesn't manage the files of a local server.", fr: "La gestion du cycle de vie déplace des objets blob entre des niveaux d'accès dans le Stockage Blob. Elle ne gère pas les fichiers d'un serveur local." }
    georep: { en: "Geo-redundant storage copies the data of a storage account to a secondary region.", fr: "Le stockage géoredondant copie les données d'un compte de stockage dans une région secondaire." }
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
