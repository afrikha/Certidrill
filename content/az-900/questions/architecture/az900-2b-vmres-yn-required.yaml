id: az900-2b-vmres-yn-required
objective: "2.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Every Azure virtual machine requires at least one data disk in addition to its operating system disk.", fr: "Chaque machine virtuelle Azure exige au moins un disque de données en plus de son disque de système d'exploitation." } }
    - { id: s2, text: { en: "The image that you select for a virtual machine provides its operating system.", fr: "L'image que vous sélectionnez pour une machine virtuelle fournit son système d'exploitation." } }
    - { id: s3, text: { en: "The size that you select for a virtual machine affects its price.", fr: "La taille que vous sélectionnez pour une machine virtuelle influe sur son prix." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Data disks are optional: every virtual machine has an operating system disk, and you add data disks only to keep applications and data apart from the operating system. An image is a template that already contains an operating system. The price of the machine depends on its size and on its operating system."
    fr: "Les disques de données sont facultatifs : chaque machine virtuelle a un disque de système d'exploitation, et vous n'ajoutez des disques de données que pour séparer les applications et les données du système d'exploitation. Une image est un modèle qui contient déjà un système d'exploitation. Le prix de la machine dépend de sa taille et de son système d'exploitation."
references:
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
