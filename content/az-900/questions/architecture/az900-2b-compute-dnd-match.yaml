id: az900-2b-compute-dnd-match
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each compute type to its description. To answer, drag the appropriate compute type to the correct description. Each compute type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque type de calcul à sa description. Pour répondre, faites glisser le type de calcul approprié vers la description correspondante. Chaque type de calcul peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vm, text: { en: "Virtual machine", fr: "Machine virtuelle" } }
    - { id: ct, text: { en: "Container", fr: "Conteneur" } }
    - { id: fn, text: { en: "Function", fr: "Fonction" } }
    - { id: avset, text: { en: "Availability set", fr: "Groupe à haute disponibilité" } }
  targets:
    - { id: t1, text: { en: "Code that runs in response to an event, with no infrastructure to manage", fr: "Du code exécuté en réponse à un événement, sans infrastructure à gérer" } }
    - { id: t2, text: { en: "A virtualized server whose operating system and installed software you control", fr: "Un serveur virtualisé dont vous contrôlez le système d'exploitation et les logiciels installés" } }
    - { id: t3, text: { en: "A lightweight package of an application and its dependencies, designed to be created, scaled out and stopped quickly", fr: "Un paquet léger contenant une application et ses dépendances, conçu pour être créé, mis à l'échelle et arrêté rapidement" } }
answer:
  mapping: { t1: fn, t2: vm, t3: ct }
explanation:
  correct:
    en: "A function is serverless code woken up by an event. A virtual machine is a virtualized server on which you control the operating system and the software. A container packages an application with its dependencies and is lightweight, so it can be created, scaled out and stopped dynamically. An availability set isn't a compute type: it groups virtual machines to improve their availability."
    fr: "Une fonction est du code serverless réveillé par un événement. Une machine virtuelle est un serveur virtualisé sur lequel vous contrôlez le système d'exploitation et les logiciels. Un conteneur empaquette une application avec ses dépendances et il est léger : il peut être créé, mis à l'échelle et arrêté de façon dynamique. Un groupe à haute disponibilité n'est pas un type de calcul : il regroupe des machines virtuelles pour améliorer leur disponibilité."
references:
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
  - title: "Describe Azure functions"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
