id: az900-2d-ca-subtle
objective: "2.4.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum protects its applications with Microsoft Entra Conditional Access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum protège ses applications avec l'accès conditionnel Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When the signals of a sign-in are trusted, Conditional Access lets the user reach the application without authenticating."
        fr: "Lorsque les signaux d'une connexion sont jugés fiables, l'accès conditionnel laisse l'utilisateur atteindre l'application sans s'authentifier."
    - id: s2
      text:
        en: "The same user can be allowed without a second factor from a known location, and be challenged for multifactor authentication from an unexpected location."
        fr: "Un même utilisateur peut être autorisé sans second facteur depuis un emplacement connu, et se voir demander l'authentification multifacteur depuis un emplacement inattendu."
    - id: s3
      text:
        en: "A Conditional Access policy can limit the client applications, such as email apps, that are allowed to connect to a service."
        fr: "Une stratégie d'accès conditionnel peut limiter les applications clientes, par exemple de messagerie, autorisées à se connecter à un service."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Conditional Access makes multifactor authentication granular: a second factor is requested only when the signals call for it, for example an unexpected location. It never replaces authentication: policies are enforced after the user has completed first-factor authentication, and the best outcome is that no additional requirement is added. A policy can also require approved client applications, for example to restrict which email apps connect to an email service."
    fr: "L'accès conditionnel rend l'authentification multifacteur granulaire : un second facteur n'est demandé que lorsque les signaux le justifient, par exemple un emplacement inattendu. Il ne remplace jamais l'authentification : les stratégies s'appliquent après que l'utilisateur a terminé l'authentification du premier facteur, et le meilleur résultat possible est qu'aucune exigence supplémentaire ne s'ajoute. Une stratégie peut aussi exiger des applications clientes approuvées, par exemple pour restreindre les applications de messagerie qui se connectent à un service de messagerie."
  options:
    s1:
      en: "Trusted signals can spare the user a second factor, never the sign-in itself: Conditional Access is evaluated after first-factor authentication."
      fr: "Des signaux jugés fiables peuvent dispenser l'utilisateur d'un second facteur, jamais de la connexion elle-même : l'accès conditionnel est évalué après l'authentification du premier facteur."
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
