id: az900-2d-ca-managed-device
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants its finance application to be accessible only from computers that meet the security and compliance standards of the organization.

    What should Woodgrove Bank use?
  fr: |
    Woodgrove Bank veut que son application financière ne soit accessible que depuis des ordinateurs qui respectent les normes de sécurité et de conformité de l'organisation.

    Que doit utiliser Woodgrove Bank ?
body:
  options:
    - id: a
      text: { en: "An Azure Policy assignment that audits the compliance of the application's resources", fr: "Une affectation Azure Policy qui audite la conformité des ressources de l'application" }
    - id: b
      text: { en: "An Azure RBAC role assignment at the scope of the application's resource group", fr: "Une attribution de rôle Azure RBAC à l'étendue du groupe de ressources de l'application" }
    - id: c
      text: { en: "A Conditional Access policy that requires a managed device for the application", fr: "Une stratégie d'accès conditionnel qui exige un appareil géré pour l'application" }
    - id: d
      text: { en: "A resource lock that protects the resource group of the application", fr: "Un verrou de ressource qui protège le groupe de ressources de l'application" }
answer: { optionId: c }
explanation:
  correct:
    en: "Conditional Access can use the device as a signal and grant access to an application only from managed devices, that is, devices that meet the organization's security and compliance standards. Sign-ins from other devices are refused."
    fr: "L'accès conditionnel peut utiliser l'appareil comme signal et n'accorder l'accès à une application que depuis des appareils gérés, c'est-à-dire conformes aux normes de sécurité et de conformité de l'organisation. Les connexions depuis d'autres appareils sont refusées."
  options:
    a:
      en: "Azure Policy checks whether Azure resources comply with rules; it does not evaluate the computer from which a user signs in."
      fr: "Azure Policy vérifie que des ressources Azure respectent des règles ; il n'évalue pas l'ordinateur depuis lequel un utilisateur se connecte."
    b:
      en: "A role assignment defines what an identity may do on resources; the permissions are the same whatever device is used."
      fr: "Une attribution de rôle définit ce qu'une identité peut faire sur des ressources ; les autorisations sont les mêmes quel que soit l'appareil utilisé."
    d:
      en: "A resource lock prevents the deletion or modification of resources; it does not control who signs in or from which device."
      fr: "Un verrou de ressource empêche la suppression ou la modification de ressources ; il ne contrôle ni qui se connecte ni depuis quel appareil."
references:
  - title: Describe Azure conditional access
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access
