id: az900-2c-red-dd-lrs-zrs
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Select the answers that correctly complete the sentences.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sélectionnez les réponses qui complètent correctement les phrases.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[one]] replicates your data three times within a single datacenter.

      [[zones]] replicates your data across three availability zones of the same region.
    fr: |
      [[one]] réplique vos données trois fois dans un seul centre de données.

      [[zones]] réplique vos données dans trois zones de disponibilité de la même région.
  slots:
    - id: one
      options:
        - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Le stockage géoredondant (GRS)" } }
        - { id: gzrs, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Le stockage géoredondant interzone (GZRS)" } }
        - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Le stockage localement redondant (LRS)" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Le stockage redondant interzone (ZRS)" } }
    - id: zones
      options:
        - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Le stockage géoredondant (GRS)" } }
        - { id: gzrs, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Le stockage géoredondant interzone (GZRS)" } }
        - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Le stockage localement redondant (LRS)" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Le stockage redondant interzone (ZRS)" } }
answer:
  values: { one: lrs, zones: zrs }
explanation:
  correct:
    en: LRS keeps its three copies in one datacenter of the primary region. ZRS places a copy in each of three availability zones of the primary region. GRS and GZRS go further and also replicate the data to a secondary region.
    fr: LRS conserve ses trois copies dans un seul centre de données de la région primaire. ZRS place une copie dans chacune des trois zones de disponibilité de la région primaire. GRS et GZRS vont plus loin et répliquent aussi les données dans une région secondaire.
references:
  - title: Describe Azure storage redundancy
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/3-redundancy
