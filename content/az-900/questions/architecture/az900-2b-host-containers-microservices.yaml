id: az900-2b-host-containers-microservices
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware splits an application into small independent parts: a front end, a back end and a storage component. Each part must be packaged with its dependencies, then updated and scaled separately from the others.

    Which hosting option should Proseware use?
  fr: |
    Proseware découpe une application en petites parties indépendantes : un front-end, un back-end et un composant de stockage. Chaque partie doit être empaquetée avec ses dépendances, puis mise à jour et mise à l'échelle séparément des autres.

    Quelle option d'hébergement Proseware doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A single virtual machine", fr: "Une machine virtuelle unique" } }
    - { id: b, text: { en: "An availability set", fr: "Un groupe à haute disponibilité" } }
    - { id: c, text: { en: "Containers", fr: "Des conteneurs" } }
    - { id: d, text: "Azure Virtual Desktop" }
answer: { optionId: c }
explanation:
  correct:
    en: "Containers are often used for microservice architectures, in which a solution is broken into smaller, independent pieces. Each piece runs in its own container, so you can maintain, update or scale one part without affecting the others."
    fr: "Les conteneurs sont souvent utilisés pour les architectures de microservices, dans lesquelles une solution est découpée en éléments plus petits et indépendants. Chaque élément s'exécute dans son propre conteneur : vous pouvez maintenir, mettre à jour ou mettre à l'échelle une partie sans toucher aux autres."
  options:
    a: { en: "On a single virtual machine, all the parts share one server and can't be scaled separately.", fr: "Sur une machine virtuelle unique, toutes les parties partagent un même serveur et ne peuvent pas être mises à l'échelle séparément." }
    b: { en: "An availability set improves the availability of virtual machines; it doesn't package or scale application parts.", fr: "Un groupe à haute disponibilité améliore la disponibilité de machines virtuelles ; il n'empaquette pas et ne met pas à l'échelle des parties d'application." }
    d: { en: "Azure Virtual Desktop delivers desktops to users, not application components.", fr: "Azure Virtual Desktop fournit des bureaux aux utilisateurs, pas des composants d'application." }
references:
  - title: "Describe Azure containers"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers
