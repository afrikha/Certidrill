id: az900-2c-red-hot-accounts
objective: "2.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the storage accounts shown in the following table.

    Answer each prompt by selecting the appropriate storage account.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des comptes de stockage présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le compte de stockage approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The account whose secondary region can be read while the primary region is still available", fr: "Le compte dont la région secondaire peut être lue alors que la région primaire est toujours disponible" }
    - id: p2
      text: { en: "The account whose data is copied to a secondary region but can be read there only after a failover", fr: "Le compte dont les données sont copiées dans une région secondaire mais n'y sont lisibles qu'après un basculement" }
  grid:
    header: [{ en: "Storage account", fr: "Compte de stockage" }, { en: "Redundancy", fr: "Redondance" }]
    rows:
      - [{ text: stfabrikam1, area: st1 }, { text: ZRS }]
      - [{ text: stfabrikam2, area: st2 }, { text: RA-GRS }]
      - [{ text: stfabrikam3, area: st3 }, { text: LRS }]
      - [{ text: stfabrikam4, area: st4 }, { text: GRS }]
answer:
  values: { p1: st2, p2: st4 }
explanation:
  correct:
    en: GRS and RA-GRS both copy the data to a secondary region. With GRS, that copy is readable only after a failover to the secondary region. RA-GRS adds read access to the secondary region at any time. ZRS and LRS keep all their copies in the primary region.
    fr: GRS et RA-GRS copient tous deux les données dans une région secondaire. Avec GRS, cette copie n'est lisible qu'après un basculement vers la région secondaire. RA-GRS ajoute un accès en lecture à la région secondaire à tout moment. ZRS et LRS conservent toutes leurs copies dans la région primaire.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
