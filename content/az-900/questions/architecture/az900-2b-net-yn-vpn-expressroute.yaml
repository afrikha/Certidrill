id: az900-2b-net-yn-vpn-expressroute
objective: "2.2.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A VPN gateway can serve as a failover path for an ExpressRoute connection.", fr: "Une passerelle VPN peut servir de chemin de secours à une connexion ExpressRoute." } }
    - { id: s2, text: { en: "The traffic of an ExpressRoute connection travels over the public internet inside an encrypted tunnel.", fr: "Le trafic d'une connexion ExpressRoute circule sur l'internet public dans un tunnel chiffré." } }
    - { id: s3, text: { en: "You can deploy several VPN gateways in the same virtual network.", fr: "Vous pouvez déployer plusieurs passerelles VPN dans le même réseau virtuel." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A VPN gateway, which uses the internet, can be configured as a secure failover path for ExpressRoute. ExpressRoute itself is a private connection that never goes over the public internet; the encrypted tunnel over the internet describes a VPN. Only one VPN gateway can be deployed in each virtual network, but that gateway can connect to several locations."
    fr: "Une passerelle VPN, qui utilise internet, peut être configurée comme chemin de secours sécurisé pour ExpressRoute. ExpressRoute est une connexion privée qui ne passe jamais par l'internet public ; le tunnel chiffré sur internet décrit un VPN. Une seule passerelle VPN peut être déployée dans chaque réseau virtuel, mais cette passerelle peut se connecter à plusieurs sites."
references:
  - title: "Describe Azure virtual private networks"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/3-virtual-private-networks
  - title: "Describe Azure ExpressRoute"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/4-expressroute
