id: az900-2a-rg-rules
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about resources and resource groups, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes concernant les ressources et les groupes de ressources, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A resource can belong to two resource groups at the same time."
        fr: "Une ressource peut appartenir à deux groupes de ressources en même temps."
    - id: s2
      text:
        en: "A resource group can contain another resource group."
        fr: "Un groupe de ressources peut contenir un autre groupe de ressources."
    - id: s3
      text:
        en: "A resource group can contain resources that are located in different regions."
        fr: "Un groupe de ressources peut contenir des ressources situées dans des régions différentes."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Every resource is in exactly one resource group at a time, and resource groups are not nestable. The location of a resource group only says where its metadata is stored, so the group may hold resources deployed to other regions.
    fr: |
      Chaque ressource se trouve dans un seul groupe de ressources à la fois, et les groupes de ressources ne s'imbriquent pas. L'emplacement d'un groupe de ressources indique seulement où ses métadonnées sont stockées : le groupe peut donc contenir des ressources déployées dans d'autres régions.
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
