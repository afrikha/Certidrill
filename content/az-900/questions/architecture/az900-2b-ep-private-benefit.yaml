id: az900-2b-ep-private-benefit
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The virtual machines of Contoso reach a storage account through its public endpoint. Contoso creates a private endpoint for the storage account in the virtual network of the virtual machines.

    What is a benefit of the private endpoint for the traffic of the virtual machines?
  fr: |
    Les machines virtuelles de Contoso atteignent un compte de stockage par son point de terminaison public. Contoso crée un point de terminaison privé pour le compte de stockage dans le réseau virtuel des machines virtuelles.

    Quel avantage le point de terminaison privé apporte-t-il au trafic des machines virtuelles ?
body:
  options:
    - { id: a, text: { en: "The requests to the storage account no longer need to be authorized.", fr: "Les requêtes adressées au compte de stockage n'ont plus besoin d'être autorisées." } }
    - { id: b, text: { en: "The data of the storage account is replicated to a second region.", fr: "Les données du compte de stockage sont répliquées vers une deuxième région." } }
    - { id: c, text: { en: "The storage account becomes reachable from any computer on the internet.", fr: "Le compte de stockage devient joignable depuis n'importe quel ordinateur sur internet." } }
    - { id: d, text: { en: "The traffic stays on the Microsoft backbone network instead of the public internet.", fr: "Le trafic reste sur le réseau principal de Microsoft au lieu de passer par l'internet public." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With a private endpoint, the traffic between the clients of the virtual network and the storage account travels over the virtual network and the Microsoft backbone network. It is no longer exposed to the public internet."
    fr: "Avec un point de terminaison privé, le trafic entre les clients du réseau virtuel et le compte de stockage circule sur le réseau virtuel et sur le réseau principal de Microsoft. Il n'est plus exposé à l'internet public."
  options:
    a: { en: "Applications keep the same authorization mechanisms; a private endpoint changes the network path, not the access control.", fr: "Les applications conservent les mêmes mécanismes d'autorisation ; un point de terminaison privé change le chemin réseau, pas le contrôle d'accès." }
    b: { en: "Replication to another region depends on the redundancy option of the account, not on its endpoints.", fr: "La réplication vers une autre région dépend de l'option de redondance du compte, pas de ses points de terminaison." }
    c: { en: "Being reachable from anywhere on the internet describes a public endpoint.", fr: "Être joignable de partout sur internet décrit un point de terminaison public." }
references:
  - title: "Use private endpoints for Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: "What is Azure Private Link?"
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-overview
