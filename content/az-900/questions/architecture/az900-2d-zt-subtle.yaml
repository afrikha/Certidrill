id: az900-2d-zt-subtle
objective: "2.4.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam applies the Zero Trust model to the access to its applications.

    For each of the following statements, select **Yes** if the statement is consistent with the Zero Trust model. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam applique le modèle Confiance Zéro à l'accès à ses applications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est cohérente avec le modèle Confiance Zéro. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Multifactor authentication is required before a user on an unmanaged device can open a sensitive application."
        fr: "L'authentification multifacteur est exigée avant qu'un utilisateur sur un appareil non géré puisse ouvrir une application sensible."
    - id: s2
      text:
        en: "A sign-in from an unmanaged device on a public network is blocked in every case."
        fr: "Une connexion depuis un appareil non géré sur un réseau public est bloquée dans tous les cas."
    - id: s3
      text:
        en: "Traffic between internal services is left unencrypted, because every user has already been authenticated."
        fr: "Le trafic entre les services internes n'est pas chiffré, car chaque utilisateur a déjà été authentifié."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Zero Trust evaluates each request with identity, device and risk signals, and the outcome depends on that evaluation: an unmanaged device on a public network can be allowed for a low-risk application, asked for multifactor authentication for a sensitive one, or blocked when the risk is too high. The assume breach principle also requires limiting the impact of an intrusion, which includes end-to-end encryption even between internal services."
    fr: "La Confiance Zéro évalue chaque requête à partir de signaux d'identité, d'appareil et de risque, et le résultat dépend de cette évaluation : un appareil non géré sur un réseau public peut être autorisé pour une application à faible risque, se voir demander l'authentification multifacteur pour une application sensible, ou être bloqué quand le risque est trop élevé. Le principe « supposer une violation » impose aussi de limiter l'impact d'une intrusion, ce qui inclut le chiffrement de bout en bout, même entre services internes."
  options:
    s2:
      en: "Zero Trust does not block by network or device type alone; it decides from the evaluation of the request, and can allow, require more proof or block."
      fr: "La Confiance Zéro ne bloque pas sur le seul critère du réseau ou du type d'appareil ; elle décide d'après l'évaluation de la requête, et peut autoriser, exiger une preuve supplémentaire ou bloquer."
    s3:
      en: "Authenticating users does not remove the need to assume breach: an attacker who is already inside must not be able to read internal traffic."
      fr: "Authentifier les utilisateurs ne dispense pas de supposer une violation : un attaquant déjà présent ne doit pas pouvoir lire le trafic interne."
references:
  - title: Describe Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
