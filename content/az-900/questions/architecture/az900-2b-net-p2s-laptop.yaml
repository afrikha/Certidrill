id: az900-2b-net-p2s-laptop
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consultant who works from home must connect one laptop to an Azure virtual network through an encrypted tunnel.

    Which type of connection should the consultant use?
  fr: |
    Un consultant qui travaille à domicile doit connecter un ordinateur portable à un réseau virtuel Azure par un tunnel chiffré.

    Quel type de connexion le consultant doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "A point-to-site VPN", fr: "Un VPN de point à site" } }
    - { id: b, text: { en: "A site-to-site VPN", fr: "Un VPN de site à site" } }
    - { id: c, text: { en: "An ExpressRoute circuit", fr: "Un circuit ExpressRoute" } }
    - { id: d, text: { en: "A virtual network peering", fr: "Un peering de réseaux virtuels" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A point-to-site VPN connects an individual device to a virtual network: the client computer initiates an encrypted VPN connection to Azure. It is the usual choice for a remote user who connects from home."
    fr: "Un VPN de point à site connecte un appareil individuel à un réseau virtuel : l'ordinateur client établit une connexion VPN chiffrée vers Azure. C'est le choix habituel pour un utilisateur distant qui se connecte depuis son domicile."
  options:
    b: { en: "A site-to-site VPN links a whole on-premises network, through a VPN device, to the virtual network.", fr: "Un VPN de site à site relie tout un réseau local, par un périphérique VPN, au réseau virtuel." }
    c: { en: "An ExpressRoute circuit is a private connection for an office or a datacenter, set up with a connectivity provider.", fr: "Un circuit ExpressRoute est une connexion privée pour un bureau ou un centre de données, mise en place avec un fournisseur de connectivité." }
    d: { en: "Peering connects two Azure virtual networks, not a computer located outside Azure.", fr: "Le peering connecte deux réseaux virtuels Azure, pas un ordinateur situé hors d'Azure." }
references:
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
  - title: "Describe Azure virtual private networks"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/3-virtual-private-networks
