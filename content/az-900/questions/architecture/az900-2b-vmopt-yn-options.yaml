id: az900-2b-vmopt-yn-options
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A virtual machine scale set can add or remove virtual machines according to a schedule.", fr: "Un groupe de machines virtuelles identiques peut ajouter ou supprimer des machines virtuelles selon un calendrier." } }
    - { id: s2, text: { en: "Azure Virtual Desktop integrates with Microsoft Entra ID to control the identity and the access of users.", fr: "Azure Virtual Desktop s'intègre à Microsoft Entra ID pour contrôler l'identité et l'accès des utilisateurs." } }
    - { id: s3, text: { en: "An availability set automatically adds virtual machines when demand increases.", fr: "Un groupe à haute disponibilité ajoute automatiquement des machines virtuelles lorsque la demande augmente." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A scale set scales out or in automatically, based on demand or on a schedule. Azure Virtual Desktop integrates with Microsoft Entra ID for identity and access controls. An availability set only spreads existing virtual machines across update and fault domains: it never changes their number."
    fr: "Un groupe identique augmente ou réduit automatiquement le nombre d'instances, selon la demande ou selon un calendrier. Azure Virtual Desktop s'intègre à Microsoft Entra ID pour les contrôles d'identité et d'accès. Un groupe à haute disponibilité se contente de répartir des machines virtuelles existantes sur des domaines de mise à jour et d'erreur : il ne modifie jamais leur nombre."
references:
  - title: "Describe Azure virtual machines"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines
  - title: "Describe Azure virtual desktop"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/4-virtual-desktop
