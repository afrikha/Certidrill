id: az900-2a-mg-nesting-limits
objective: "2.1.6"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A management group tree supports up to [[levels]] levels of depth, not counting the root level and the subscription level.

      Each management group and each subscription has [[parent]].
    fr: |
      Une arborescence de groupes d'administration prend en charge jusqu'à [[levels]] niveaux de profondeur, sans compter le niveau racine ni le niveau des abonnements.

      Chaque groupe d'administration et chaque abonnement a [[parent]].
  slots:
    - id: levels
      options:
        - { id: l3, text: { en: "three", fr: "trois" } }
        - { id: l6, text: { en: "six", fr: "six" } }
        - { id: l10, text: { en: "ten", fr: "dix" } }
    - id: parent
      options:
        - { id: p1, text: { en: "only one parent", fr: "un seul parent" } }
        - { id: p2, text: { en: "up to two parents", fr: "jusqu'à deux parents" } }
        - { id: pn, text: { en: "as many parents as needed", fr: "autant de parents que nécessaire" } }
answer:
  values: { levels: l6, parent: p1 }
explanation:
  correct:
    en: |
      Management groups can be nested to build a hierarchy of up to six levels below the root, the subscription level not being counted. The hierarchy is a tree: a management group or a subscription has a single parent, while a management group can have many children.
    fr: |
      Les groupes d'administration peuvent être imbriqués pour former une hiérarchie comptant jusqu'à six niveaux sous la racine, le niveau des abonnements n'étant pas compté. La hiérarchie est une arborescence : un groupe d'administration ou un abonnement a un seul parent, alors qu'un groupe d'administration peut avoir de nombreux enfants.
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
