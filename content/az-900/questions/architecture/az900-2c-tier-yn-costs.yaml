id: az900-2c-tier-yn-costs
objective: "2.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about blob access tiers, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les niveaux d'accès des objets blob, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Reading data from the cool tier costs more than reading the same data from the hot tier.
        fr: Lire des données dans le niveau froid (Cool) coûte plus cher que lire les mêmes données dans le niveau chaud (Hot).
    - id: s2
      text:
        en: A blob in the hot tier costs less to store than the same blob in the cool tier.
        fr: Un objet blob du niveau chaud (Hot) coûte moins cher à stocker que le même objet blob dans le niveau froid (Cool).
    - id: s3
      text:
        en: A blob in the cold tier can be read immediately, without being rehydrated.
        fr: Un objet blob du niveau froid (Cold) peut être lu immédiatement, sans être réhydraté.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The cooler the tier, the lower the storage cost and the higher the access cost. The hot tier therefore has the highest storage cost and the lowest access cost. Hot, cool and cold are online tiers, so their data is available immediately. Only the archive tier requires rehydration.
    fr: Plus le niveau est froid, plus le coût de stockage baisse et plus le coût d'accès augmente. Le niveau chaud (Hot) a donc le coût de stockage le plus élevé et le coût d'accès le plus bas. Les niveaux chaud (Hot), froid (Cool) et froid (Cold) sont des niveaux en ligne, leurs données sont donc disponibles immédiatement. Seul le niveau archive (Archive) exige une réhydratation.
  options:
    s2:
      en: The hot tier has the highest storage cost of all the tiers. It is the access cost that is lower in the hot tier.
      fr: Le niveau chaud (Hot) a le coût de stockage le plus élevé de tous les niveaux. C'est le coût d'accès qui est plus bas dans le niveau chaud (Hot).
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
