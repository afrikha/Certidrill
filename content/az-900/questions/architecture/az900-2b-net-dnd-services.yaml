id: az900-2b-net-dnd-services
objective: "2.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each networking service to its description. To answer, drag the appropriate service to the correct description. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque service réseau à sa description. Pour répondre, faites glisser le service approprié vers la description correspondante. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dns, text: "Azure DNS" }
    - { id: er, text: "Azure ExpressRoute" }
    - { id: vpn, text: { en: "Azure VPN Gateway", fr: "Passerelle VPN Azure" } }
    - { id: peer, text: { en: "Virtual network peering", fr: "Peering de réseaux virtuels" } }
  targets:
    - { id: t1, text: { en: "Connects two virtual networks so that their resources communicate over the Microsoft backbone network", fr: "Connecte deux réseaux virtuels afin que leurs ressources communiquent sur le réseau principal de Microsoft" } }
    - { id: t2, text: { en: "Hosts your domains and resolves names by using Azure infrastructure", fr: "Héberge vos domaines et résout les noms à l'aide de l'infrastructure Azure" } }
    - { id: t3, text: { en: "Sends encrypted traffic between an on-premises network and a virtual network over the public internet", fr: "Envoie du trafic chiffré entre un réseau local et un réseau virtuel en passant par l'internet public" } }
answer:
  mapping: { t1: peer, t2: dns, t3: vpn }
explanation:
  correct:
    en: "Peering links two virtual networks directly; the traffic between them is private and stays on the Microsoft backbone network. Azure DNS is a hosting service for DNS domains that provides name resolution with Azure infrastructure. A VPN gateway sends encrypted traffic over the public internet, whereas ExpressRoute is a private connection that doesn't use the internet."
    fr: "Le peering relie directement deux réseaux virtuels ; le trafic entre eux est privé et reste sur le réseau principal de Microsoft. Azure DNS est un service d'hébergement de domaines DNS qui assure la résolution de noms avec l'infrastructure Azure. Une passerelle VPN envoie du trafic chiffré sur l'internet public, alors qu'ExpressRoute est une connexion privée qui n'utilise pas internet."
references:
  - title: "Describe Azure virtual networking"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network
  - title: "What is Azure VPN Gateway?"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways
