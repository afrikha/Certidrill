id: az900-2c-dir-sspr
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The help desk of Litware spends a lot of time on users who forgot their password. Users must be able to set a new password themselves, without calling the help desk.

    Which feature of Microsoft Entra ID should you use?
  fr: |
    Le support technique de Litware passe beaucoup de temps avec des utilisateurs qui ont oublié leur mot de passe. Les utilisateurs doivent pouvoir définir eux-mêmes un nouveau mot de passe, sans appeler le support technique.

    Quelle fonctionnalité de Microsoft Entra ID devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Single sign-on", fr: "L'authentification unique" }
    - id: b
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
    - id: c
      text: { en: "Device registration", fr: "L'inscription des appareils" }
    - id: d
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
answer: { optionId: d }
explanation:
  correct:
    en: Self-service password reset is one of the authentication services of Microsoft Entra ID. It lets users reset their own password, which reduces the number of calls to the help desk.
    fr: La réinitialisation de mot de passe en libre-service fait partie des services d'authentification de Microsoft Entra ID. Elle permet aux utilisateurs de réinitialiser eux-mêmes leur mot de passe, ce qui réduit le nombre d'appels au support technique.
  options:
    a:
      en: Single sign-on lets a user reach several applications with one identity. It doesn't help a user who forgot the password.
      fr: L'authentification unique permet à un utilisateur d'atteindre plusieurs applications avec une seule identité. Elle n'aide pas un utilisateur qui a oublié son mot de passe.
    b:
      en: Smart lockout blocks attackers who try to guess a password. It doesn't let a user choose a new password.
      fr: Le verrouillage intelligent bloque les attaquants qui tentent de deviner un mot de passe. Il ne permet pas à un utilisateur de choisir un nouveau mot de passe.
    c:
      en: Device registration makes devices known to Microsoft Entra ID, so that access can depend on the device. It has no link with passwords.
      fr: L'inscription des appareils fait connaître les appareils à Microsoft Entra ID, pour que l'accès puisse dépendre de l'appareil. Elle n'a aucun lien avec les mots de passe.
references:
  - title: Describe Azure directory services
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services
