id: az900-2a-dc-physical-components
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Azure datacenters are organized into several levels of physical infrastructure.

    Match each description to the correct component. To answer, drag the appropriate component to each description. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les centres de données Azure sont organisés en plusieurs niveaux d'infrastructure physique.

    Associez chaque description au composant correct. Pour répondre, faites glisser le composant approprié vers chaque description. Chaque composant peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dc, text: { en: "Datacenter", fr: "Centre de données" } }
    - { id: az, text: { en: "Availability zone", fr: "Zone de disponibilité" } }
    - { id: region, text: { en: "Region", fr: "Région" } }
    - { id: geo, text: { en: "Geography", fr: "Zone géographique" } }
    - { id: pair, text: { en: "Region pair", fr: "Paire de régions" } }
  targets:
    - id: t1
      text: { en: "A data residency boundary that contains one or more regions", fr: "Une limite de résidence des données qui contient une ou plusieurs régions" }
    - id: t2
      text: { en: "One or more datacenters with independent power, cooling and networking, isolated from the failures of the other datacenters of the same region", fr: "Un ou plusieurs centres de données dotés d'une alimentation, d'un refroidissement et d'un réseau indépendants, isolés des défaillances des autres centres de données de la même région" }
    - id: t3
      text: { en: "An area that contains at least one datacenter, in which nearby datacenters are linked by a low-latency network", fr: "Un secteur qui contient au moins un centre de données et dans lequel les centres de données proches sont reliés par un réseau à faible latence" }
answer:
  mapping: { t1: geo, t2: az, t3: region }
explanation:
  correct:
    en: |
      Datacenters are grouped from the smallest level to the largest: an availability zone is one or more datacenters with independent power, cooling and networking; a region is a set of nearby datacenters linked by a low-latency network; a geography is a data residency boundary that contains one or more regions. A region pair associates two regions; it is not a container of datacenters.
    fr: |
      Les centres de données sont regroupés du plus petit niveau au plus grand : une zone de disponibilité correspond à un ou plusieurs centres de données dotés d'une alimentation, d'un refroidissement et d'un réseau indépendants ; une région est un ensemble de centres de données proches reliés par un réseau à faible latence ; une zone géographique est une limite de résidence des données qui contient une ou plusieurs régions. Une paire de régions associe deux régions ; ce n'est pas un conteneur de centres de données.
references:
  - title: What are Azure regions?
    url: https://learn.microsoft.com/en-us/azure/reliability/regions-overview
  - title: Describe Azure physical infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure
