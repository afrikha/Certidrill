id: az900-2c-mig-dnd-tools
objective: "2.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each migration task to the tool of the Azure Migrate hub that performs it. To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque tâche de migration à l'outil du hub Azure Migrate qui l'effectue. Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: assess, text: { en: "Azure Migrate: Discovery and assessment", fr: "Azure Migrate : découverte et évaluation" } }
    - { id: dms, text: "Azure Database Migration Service" }
    - { id: databox, text: "Azure Data Box" }
    - { id: appsvc, text: "Azure App Service Migration Assistant" }
  targets:
    - id: t1
      text: { en: "Move a large amount of file data to Azure offline", fr: "Déplacer hors connexion une grande quantité de fichiers vers Azure" }
    - id: t2
      text: { en: "Check whether on-premises servers are ready for Azure", fr: "Vérifier que des serveurs locaux sont prêts pour Azure" }
    - id: t3
      text: { en: "Move on-premises SQL Server databases to Azure", fr: "Déplacer des bases de données SQL Server locales vers Azure" }
answer:
  mapping: { t1: databox, t2: assess, t3: dms }
explanation:
  correct:
    en: The Azure Migrate hub brings several tools together. Discovery and assessment finds the on-premises servers and checks their readiness for Azure. Azure Database Migration Service migrates databases. Azure Data Box moves large amounts of data offline, on a device that is shipped.
    fr: Le hub Azure Migrate réunit plusieurs outils. La découverte et l'évaluation trouvent les serveurs locaux et vérifient qu'ils sont prêts pour Azure. Azure Database Migration Service migre les bases de données. Azure Data Box déplace de grandes quantités de données hors connexion, sur un appareil expédié.
  options:
    appsvc:
      en: Azure App Service Migration Assistant assesses web applications and migrates them to Azure App Service. None of the three tasks concerns a web application.
      fr: Azure App Service Migration Assistant évalue des applications web et les migre vers Azure App Service. Aucune des trois tâches ne concerne une application web.
references:
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
