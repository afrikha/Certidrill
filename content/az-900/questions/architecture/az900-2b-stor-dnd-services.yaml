id: az900-2b-stor-dnd-services
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each Azure Storage service to its description. To answer, drag the appropriate service to the correct description. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque service du Stockage Azure à sa description. Pour répondre, faites glisser le service approprié vers la description correspondante. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: blobs, text: { en: "Azure Blobs", fr: "Objets blob Azure" } }
    - { id: files, text: "Azure Files" }
    - { id: queues, text: { en: "Azure Queues", fr: "Files d'attente Azure" } }
    - { id: tables, text: { en: "Azure Tables", fr: "Tables Azure" } }
    - { id: disks, text: { en: "Azure Disks", fr: "Disques Azure" } }
  targets:
    - { id: t1, text: { en: "Block-level storage volumes for Azure virtual machines", fr: "Des volumes de stockage de niveau bloc pour les machines virtuelles Azure" } }
    - { id: t2, text: { en: "A NoSQL store of keys and attributes for structured, non-relational data", fr: "Un magasin NoSQL de clés et d'attributs pour des données structurées non relationnelles" } }
    - { id: t3, text: { en: "A massively scalable object store for text and binary data", fr: "Un magasin d'objets massivement scalable pour des données texte et binaires" } }
answer:
  mapping: { t1: disks, t2: tables, t3: blobs }
explanation:
  correct:
    en: "Azure Disks provides block-level storage volumes, managed by Azure, for virtual machines. Azure Tables is a NoSQL key/attribute store for structured, non-relational data. Azure Blobs is the object store for massive amounts of text and binary data. Azure Files provides file shares, and Azure Queues stores messages."
    fr: "Disques Azure fournit des volumes de stockage de niveau bloc, gérés par Azure, pour les machines virtuelles. Tables Azure est un magasin NoSQL de clés et d'attributs pour des données structurées non relationnelles. Objets blob Azure est le magasin d'objets pour d'énormes quantités de données texte et binaires. Azure Files fournit des partages de fichiers, et Files d'attente Azure stocke des messages."
references:
  - title: "Describe Azure storage services"
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services
  - title: "Introduction to Azure Storage"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
