id: az900-2c-auth-dd-factors
objective: "2.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Multifactor authentication combines proofs of identity from different categories.

    Select the answers that correctly complete the sentences.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'authentification multifacteur combine des preuves d'identité de catégories différentes.

    Sélectionnez les réponses qui complètent correctement les phrases.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A fingerprint is something you [[finger]].

      A password is something you [[password]].

      A phone that receives a verification code is something you [[phone]].
    fr: |
      Une empreinte digitale est quelque chose que vous [[finger]].

      Un mot de passe est quelque chose que vous [[password]].

      Un téléphone qui reçoit un code de vérification est quelque chose que vous [[phone]].
  slots:
    - id: finger
      options:
        - { id: know, text: { en: "know", fr: "savez" } }
        - { id: have, text: { en: "have", fr: "possédez" } }
        - { id: are, text: { en: "are", fr: "êtes" } }
    - id: password
      options:
        - { id: know, text: { en: "know", fr: "savez" } }
        - { id: have, text: { en: "have", fr: "possédez" } }
        - { id: are, text: { en: "are", fr: "êtes" } }
    - id: phone
      options:
        - { id: know, text: { en: "know", fr: "savez" } }
        - { id: have, text: { en: "have", fr: "possédez" } }
        - { id: are, text: { en: "are", fr: "êtes" } }
answer:
  values: { finger: are, password: know, phone: have }
explanation:
  correct:
    en: The factors fall into three categories. Something you know is typically a password. Something you have is a trusted device such as a phone or a hardware key. Something you are is a biometric characteristic such as a fingerprint or a face scan. Multifactor authentication requires proofs from at least two of these categories.
    fr: Les facteurs se répartissent en trois catégories. Quelque chose que vous savez est généralement un mot de passe. Quelque chose que vous possédez est un appareil de confiance, comme un téléphone ou une clé matérielle. Quelque chose que vous êtes est une caractéristique biométrique, comme une empreinte digitale ou un scan du visage. L'authentification multifacteur exige des preuves d'au moins deux de ces catégories.
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
