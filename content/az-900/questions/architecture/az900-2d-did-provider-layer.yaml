id: az900-2d-did-provider-layer
objective: "2.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs its business applications on Azure virtual machines. Fabrikam maps the layers of the defense-in-depth model to the shared responsibility model.

    Which layer is secured entirely by Microsoft?
  fr: |
    Fabrikam exécute ses applications métier sur des machines virtuelles Azure. Fabrikam met en correspondance les couches du modèle de défense en profondeur avec le modèle de responsabilité partagée.

    Quelle couche est entièrement sécurisée par Microsoft ?
body:
  options:
    - id: a
      text: { en: "Physical security", fr: "Sécurité physique" }
    - id: b
      text: { en: "Identity and access", fr: "Identité et accès" }
    - id: c
      text: { en: "Compute", fr: "Calcul" }
    - id: d
      text: { en: "Data", fr: "Données" }
answer: { optionId: a }
explanation:
  correct:
    en: "In every cloud service type, Microsoft is responsible for the physical datacenter, the physical network and the physical hosts. The physical security layer, which controls access to the buildings and to the computing hardware, is therefore handled by Microsoft alone. With virtual machines (IaaS), the customer secures the other layers listed."
    fr: "Quel que soit le type de service cloud, Microsoft est responsable du centre de données physique, du réseau physique et des hôtes physiques. La couche de sécurité physique, qui contrôle l'accès aux bâtiments et au matériel informatique, est donc assurée par Microsoft seul. Avec des machines virtuelles (IaaS), le client sécurise les autres couches citées."
  options:
    b:
      en: "Accounts, identities and access management always remain the responsibility of the customer."
      fr: "Les comptes, les identités et la gestion des accès restent toujours sous la responsabilité du client."
    c:
      en: "With IaaS, the customer is responsible for the operating system of its virtual machines: patching, endpoint protection and secured access."
      fr: "En IaaS, le client est responsable du système d'exploitation de ses machines virtuelles : correctifs, protection des points de terminaison et accès sécurisé."
    d:
      en: "Information and data always remain the responsibility of the customer, whatever the service type."
      fr: "Les informations et les données restent toujours sous la responsabilité du client, quel que soit le type de service."
references:
  - title: Describe defense-in-depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
