id: az900-2a-hier-scope-table
objective: "2.1.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The following table lists all the management groups, subscriptions and resource groups of Contoso.

    Answer each prompt by selecting, in the **Name** column, the scope that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le tableau suivant répertorie tous les groupes d'administration, abonnements et groupes de ressources de Contoso.

    Répondez à chaque consigne en sélectionnant, dans la colonne **Nom**, l'étendue qui répond au besoin.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "One policy assignment must apply to Sub-Web and Sub-Data, but not to Sub-Dev."
        fr: "Une seule attribution de stratégie doit s'appliquer à Sub-Web et à Sub-Data, mais pas à Sub-Dev."
    - id: p2
      text:
        en: "One role assignment must let a team manage the resources of RG-App1 and RG-App2, and nothing in Sub-Data."
        fr: "Une seule attribution de rôle doit permettre à une équipe de gérer les ressources de RG-App1 et de RG-App2, et rien dans Sub-Data."
  grid:
    header: [{ en: "Level", fr: "Niveau" }, { en: "Name", fr: "Nom" }, { en: "Parent", fr: "Parent" }]
    rows:
      - [{ text: { en: "Management group", fr: "Groupe d'administration" } }, { text: "Tenant Root Group", area: root }, { text: "-" }]
      - [{ text: { en: "Management group", fr: "Groupe d'administration" } }, { text: "MG-Prod", area: mgprod }, { text: "Tenant Root Group" }]
      - [{ text: { en: "Subscription", fr: "Abonnement" } }, { text: "Sub-Web", area: subweb }, { text: "MG-Prod" }]
      - [{ text: { en: "Subscription", fr: "Abonnement" } }, { text: "Sub-Data", area: subdata }, { text: "MG-Prod" }]
      - [{ text: { en: "Subscription", fr: "Abonnement" } }, { text: "Sub-Dev", area: subdev }, { text: "Tenant Root Group" }]
      - [{ text: { en: "Resource group", fr: "Groupe de ressources" } }, { text: "RG-App1", area: rgapp1 }, { text: "Sub-Web" }]
      - [{ text: { en: "Resource group", fr: "Groupe de ressources" } }, { text: "RG-App2", area: rgapp2 }, { text: "Sub-Web" }]
      - [{ text: { en: "Resource group", fr: "Groupe de ressources" } }, { text: "RG-Sql", area: rgsql }, { text: "Sub-Data" }]
answer:
  values: { p1: mgprod, p2: subweb }
explanation:
  correct:
    en: |
      Settings are inherited from a scope by everything below it. MG-Prod is the parent of Sub-Web and Sub-Data only, so a policy assigned there reaches both and leaves Sub-Dev out; the Tenant Root Group would include Sub-Dev. Sub-Web contains exactly RG-App1 and RG-App2, so one role assignment on Sub-Web covers both resource groups without giving anything in Sub-Data; a higher scope would also reach Sub-Data, and a single resource group would cover only half of the need.
    fr: |
      Les paramètres d'une étendue sont hérités par tout ce qui se trouve en dessous. MG-Prod est le parent de Sub-Web et de Sub-Data uniquement : une stratégie attribuée à ce niveau atteint les deux et laisse Sub-Dev de côté ; le Tenant Root Group inclurait Sub-Dev. Sub-Web contient exactement RG-App1 et RG-App2 : une seule attribution de rôle sur Sub-Web couvre donc les deux groupes de ressources sans rien donner dans Sub-Data ; une étendue supérieure atteindrait aussi Sub-Data, et un seul groupe de ressources ne couvrirait que la moitié du besoin.
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
