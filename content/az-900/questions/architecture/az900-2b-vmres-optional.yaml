id: az900-2b-vmres-optional
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to create an Azure virtual machine.

    Which resource is optional?
  fr: |
    Vous prévoyez de créer une machine virtuelle Azure.

    Quelle ressource est facultative ?
body:
  options:
    - { id: a, text: { en: "An operating system disk", fr: "Un disque de système d'exploitation" } }
    - { id: b, text: { en: "A virtual network", fr: "Un réseau virtuel" } }
    - { id: c, text: { en: "A network interface", fr: "Une interface réseau" } }
    - { id: d, text: { en: "A public IP address", fr: "Une adresse IP publique" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A virtual machine always has a private IP address in its virtual network; a public IP address is added only when the machine must be reached from the internet, and it is billed separately. The operating system disk, the virtual network and the network interface exist for every virtual machine."
    fr: "Une machine virtuelle a toujours une adresse IP privée dans son réseau virtuel ; une adresse IP publique n'est ajoutée que si la machine doit être joignable depuis internet, et elle est facturée séparément. Le disque de système d'exploitation, le réseau virtuel et l'interface réseau existent pour chaque machine virtuelle."
  options:
    a: { en: "An operating system disk is created with every virtual machine.", fr: "Un disque de système d'exploitation est créé avec chaque machine virtuelle." }
    b: { en: "Every virtual machine is connected to a virtual network to communicate with other resources.", fr: "Chaque machine virtuelle est connectée à un réseau virtuel pour communiquer avec les autres ressources." }
    c: { en: "The network interface is what connects the virtual machine to its virtual network.", fr: "L'interface réseau est ce qui connecte la machine virtuelle à son réseau virtuel." }
references:
  - title: "Virtual machines in Azure"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
