id: az900-2a-rg-statements
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about resource groups are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies concernant les groupes de ressources ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Access granted on a resource group applies to all the resources in the group.", fr: "Un accès accordé sur un groupe de ressources s'applique à toutes les ressources du groupe." } }
    - { id: b, text: { en: "Resources automatically inherit the tags of their resource group.", fr: "Les ressources héritent automatiquement des étiquettes de leur groupe de ressources." } }
    - { id: c, text: { en: "All the resources of a resource group must be of the same type.", fr: "Toutes les ressources d'un groupe de ressources doivent être du même type." } }
    - { id: d, text: { en: "A resource group can be renamed after it is created.", fr: "Un groupe de ressources peut être renommé après sa création." } }
    - { id: e, text: { en: "A resource can be moved from one resource group to another.", fr: "Une ressource peut être déplacée d'un groupe de ressources vers un autre." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Permissions granted or denied on a resource group reach every resource inside it. A resource is in one group at a time, but many resource types can be moved to another resource group later.
    fr: |
      Les autorisations accordées ou refusées sur un groupe de ressources atteignent toutes les ressources qu'il contient. Une ressource se trouve dans un seul groupe à la fois, mais de nombreux types de ressources peuvent être déplacés plus tard vers un autre groupe de ressources.
  options:
    b: { en: "Tags applied to a resource group are not inherited by the resources in it.", fr: "Les étiquettes appliquées à un groupe de ressources ne sont pas héritées par les ressources qu'il contient." }
    c: { en: "A resource group usually mixes types, for example a virtual machine, its disks and its virtual network.", fr: "Un groupe de ressources mélange généralement les types, par exemple une machine virtuelle, ses disques et son réseau virtuel." }
    d: { en: "The name of a resource group is fixed when the group is created.", fr: "Le nom d'un groupe de ressources est fixé à la création du groupe." }
references:
  - title: Describe Azure management infrastructure
    url: https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
