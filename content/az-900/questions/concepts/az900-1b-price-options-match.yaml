id: az900-1b-price-options-match
objective: "1.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each pricing option to its description. To answer, drag the appropriate pricing options to the correct descriptions. Each pricing option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque option de tarification à sa description. Pour répondre, faites glisser les options de tarification appropriées vers les descriptions correspondantes. Chaque option de tarification peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: payg
    text:
      en: Pay-as-you-go
      fr: "Paiement à l'utilisation"
  - id: res
    text:
      en: Azure Reservations
      fr: Réservations Azure
  - id: spot
    text:
      en: Spot pricing
      fr: Tarification Spot
  - id: free
    text:
      en: Azure free account
      fr: Compte gratuit Azure
  - id: ahb
    text: Azure Hybrid Benefit
  targets:
  - id: t1
    text:
      en: Existing on-premises Windows Server licenses are reused to lower the price of Azure virtual machines.
      fr: Des licences Windows Server locales existantes sont réutilisées pour réduire le prix de machines virtuelles Azure.
  - id: t2
    text:
      en: The resources consumed during a billing cycle are billed, without any commitment.
      fr: Les ressources consommées pendant un cycle de facturation sont facturées, sans aucun engagement.
  - id: t3
    text:
      en: Unused Azure capacity is offered at a lower price.
      fr: De la capacité Azure inutilisée est proposée à un prix plus bas.
answer:
  mapping:
    t1: ahb
    t2: payg
    t3: spot
explanation:
  correct:
    en: "Azure Hybrid Benefit lets you use qualifying on-premises Windows Server licenses in Azure, so that you pay only the base compute price of the virtual machine. Pay-as-you-go bills actual consumption with no commitment. Spot pricing sells capacity that Azure isn't using, at a lower price and with the risk of eviction."
    fr: "Azure Hybrid Benefit permet d'utiliser dans Azure des licences Windows Server locales éligibles : vous ne payez alors que le prix de base du calcul de la machine virtuelle. Le paiement à l'utilisation facture la consommation réelle, sans engagement. La tarification Spot vend la capacité qu'Azure n'utilise pas, à un prix plus bas et avec un risque d'éviction."
  options:
    res:
      en: A reservation is a one-year or three-year commitment to specific resources; none of the descriptions mentions a commitment term.
      fr: "Une réservation est un engagement d'un ou trois ans sur des ressources précises ; aucune description ne mentionne de durée d'engagement."
    free:
      en: The free account gives a credit for the first 30 days and limited free quantities of some services.
      fr: Le compte gratuit donne un crédit pour les 30 premiers jours et des quantités gratuites limitées de certains services.
references:
- title: Azure Hybrid Benefit for Windows Server
  url: https://learn.microsoft.com/en-us/windows-server/get-started/azure-hybrid-benefit
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
