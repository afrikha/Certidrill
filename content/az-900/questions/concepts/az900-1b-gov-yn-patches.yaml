id: az900-1b-gov-yn-patches
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Depending on the operating model, software patches and updates can be applied automatically in the cloud.
      fr: "Selon le modèle d'exploitation, les correctifs et les mises à jour des logiciels peuvent être appliqués automatiquement dans le cloud."
  - id: s2
    text:
      en: Moving an application to SaaS transfers the responsibility for user accounts and identities to the cloud provider.
      fr: Déplacer une application vers SaaS transfère au fournisseur de cloud la responsabilité des comptes et des identités des utilisateurs.
  - id: s3
    text:
      en: Cloud-based auditing provides mitigation strategies for the resources that it flags as out of compliance.
      fr: "L'audit basé sur le cloud propose des stratégies d'atténuation pour les ressources qu'il signale comme non conformes."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "In the cloud, patches and updates may be applied automatically depending on the operating model, which helps both governance and security. Cloud-based auditing flags resources that are out of compliance with your standards and provides mitigation strategies. The shared responsibility model still applies: accounts and identities stay with the customer in every service type."
    fr: "Dans le cloud, les correctifs et les mises à jour peuvent être appliqués automatiquement selon le modèle d'exploitation, ce qui sert à la fois la gouvernance et la sécurité. L'audit basé sur le cloud signale les ressources non conformes à vos normes et propose des stratégies d'atténuation. Le modèle de responsabilité partagée s'applique toujours : les comptes et les identités restent au client quel que soit le type de service."
  options:
    s2:
      en: Accounts and identities are always the responsibility of the customer, including with SaaS.
      fr: Les comptes et les identités sont toujours sous la responsabilité du client, y compris avec SaaS.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
