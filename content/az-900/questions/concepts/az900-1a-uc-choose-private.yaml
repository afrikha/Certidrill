id: az900-1a-uc-choose-private
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which requirement leads a company to choose a private cloud rather than a public cloud?
  fr: |
    Quelle exigence conduit une entreprise à choisir un cloud privé plutôt qu'un cloud public ?
body:
  options:
    - id: "a"
      text:
        en: "Avoiding capital expenditure when scaling up"
        fr: "Éviter les dépenses d'investissement lors de la montée en charge"
    - id: "b"
      text:
        en: "Provisioning and deprovisioning applications quickly"
        fr: "Provisionner et déprovisionner rapidement des applications"
    - id: "c"
      text:
        en: "Paying only for the resources that are actually used"
        fr: "Payer uniquement les ressources réellement utilisées"
    - id: "d"
      text:
        en: "Having complete control over resources and security"
        fr: "Avoir un contrôle total sur les ressources et la sécurité"
answer:
  optionId: "d"
explanation:
  correct:
    en: "In a private cloud, the organization has complete control over resources and security, and its data is not collocated with other tenants' data. The three other requirements are strengths of the public cloud."
    fr: "Dans un cloud privé, l'organisation a un contrôle total sur les ressources et la sécurité, et ses données ne sont pas colocalisées avec celles d'autres locataires. Les trois autres exigences sont des points forts du cloud public."
  options:
    a:
      en: "Scaling up without capital expenditure is a public cloud characteristic; a private cloud requires hardware purchases."
      fr: "Monter en charge sans dépense d'investissement caractérise le cloud public ; un cloud privé impose des achats de matériel."
    b:
      en: "Quick provisioning and deprovisioning of applications is a characteristic of the public cloud."
      fr: "Le provisionnement et le déprovisionnement rapides des applications caractérisent le cloud public."
    c:
      en: "Paying only for what you use is a characteristic of the public cloud; private cloud hardware is paid for even when it is idle."
      fr: "Payer uniquement ce que vous utilisez caractérise le cloud public ; le matériel d'un cloud privé est payé même lorsqu'il est inutilisé."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
