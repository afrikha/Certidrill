id: az900-1c-paas-definition
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which cloud service type does the cloud provider maintain the operating systems, the middleware, and the development tools, while you supply the application and its data?
  fr: |
    Dans quel type de service cloud le fournisseur de cloud entretient-il les systèmes d'exploitation, les intergiciels et les outils de développement, tandis que vous apportez l'application et ses données ?
body:
  options:
    - id: a
      text: "Software as a service (SaaS)"
    - id: b
      text: "Infrastructure as a service (IaaS)"
    - id: c
      text: "Platform as a service (PaaS)"
answer: { optionId: c }
explanation:
  correct:
    en: "In a PaaS environment, the provider maintains the physical infrastructure and also the operating systems, middleware, development tools and analytics services. You focus on your application code and your data."
    fr: "Dans un environnement PaaS, le fournisseur entretient l'infrastructure physique, mais aussi les systèmes d'exploitation, les intergiciels, les outils de développement et les services d'analytique. Vous vous concentrez sur le code de votre application et sur vos données."
  options:
    a:
      en: "With SaaS, the provider also supplies and maintains the application itself; you do not bring your own."
      fr: "Avec SaaS, le fournisseur fournit et entretient aussi l'application elle-même ; vous n'apportez pas la vôtre."
    b:
      en: "With IaaS, the provider stops at the hardware; the operating system and the middleware are yours to maintain."
      fr: "Avec IaaS, le fournisseur s'arrête au matériel ; le système d'exploitation et les intergiciels sont à votre charge."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
