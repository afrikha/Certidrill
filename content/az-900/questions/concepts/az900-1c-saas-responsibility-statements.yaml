id: az900-1c-saas-responsibility-statements
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses a SaaS application for finance and expense tracking.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise une application SaaS de gestion financière et de suivi des dépenses.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Proseware is responsible for patching the infrastructure that hosts the application."
        fr: "Proseware est responsable des mises à jour correctives de l'infrastructure qui héberge l'application."
    - id: s2
      text:
        en: "Proseware is responsible for the information and data that its employees enter in the application."
        fr: "Proseware est responsable des informations et des données que ses employés saisissent dans l'application."
    - id: s3
      text:
        en: "Proseware is responsible for the devices that its employees use to connect to the application."
        fr: "Proseware est responsable des appareils que ses employés utilisent pour se connecter à l'application."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "In a SaaS model, the provider handles infrastructure patching, application updates and availability. Whatever the service type, the customer always remains responsible for the information and data stored in the cloud, for the devices allowed to connect, and for its accounts and identities."
    fr: "Dans un modèle SaaS, le fournisseur se charge de la mise à jour corrective de l'infrastructure, des mises à jour de l'application et de la disponibilité. Quel que soit le type de service, le client reste toujours responsable des informations et des données stockées dans le cloud, des appareils autorisés à se connecter, ainsi que de ses comptes et de ses identités."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
