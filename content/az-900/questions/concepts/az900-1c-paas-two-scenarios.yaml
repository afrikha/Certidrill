id: az900-1c-paas-two-scenarios
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two scenarios are common use cases for platform as a service (PaaS)?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux scénarios qui sont des cas d'usage courants de PaaS (platform as a service) ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Moving existing servers to the cloud without changing them", fr: "Déplacer des serveurs existants vers le cloud sans les modifier" } }
    - { id: b, text: { en: "Giving developers a framework on which to build cloud applications", fr: "Donner aux développeurs un framework sur lequel créer des applications cloud" } }
    - { id: c, text: { en: "Providing all employees with an email and messaging service", fr: "Fournir à tous les employés un service d'e-mail et de messagerie" } }
    - { id: d, text: { en: "Analyzing data with analytics tools that the platform provides", fr: "Analyser des données avec des outils d'analytique fournis par la plateforme" } }
    - { id: e, text: { en: "Running software that requires custom operating system settings", fr: "Exécuter un logiciel qui exige des paramètres personnalisés du système d'exploitation" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The two common PaaS scenarios are the development framework, on which developers build or customize cloud applications with built-in components, and analytics or business intelligence, where tools provided with the platform let teams analyze their data."
    fr: "Les deux scénarios courants de PaaS sont le framework de développement, sur lequel les développeurs créent ou personnalisent des applications cloud avec des composants intégrés, et l'analytique ou le décisionnel, où des outils fournis avec la plateforme permettent aux équipes d'analyser leurs données."
  options:
    a:
      en: "Moving servers as they are is a lift-and-shift migration, an IaaS scenario."
      fr: "Déplacer des serveurs tels quels est une migration lift-and-shift, un scénario IaaS."
    c:
      en: "Email and messaging delivered as a ready-to-use service is a SaaS scenario."
      fr: "L'e-mail et la messagerie fournis comme service prêt à l'emploi sont un scénario SaaS."
    e:
      en: "Custom operating system settings require control of the operating system, which only IaaS gives."
      fr: "Des paramètres personnalisés du système d'exploitation exigent le contrôle de ce système, que seul IaaS donne."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
