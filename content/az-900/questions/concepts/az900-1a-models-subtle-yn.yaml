id: az900-1a-models-subtle-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "A company that uses two public cloud providers and no private cloud has a hybrid cloud."
        fr: "Une entreprise qui utilise deux fournisseurs de cloud public et aucun cloud privé dispose d'un cloud hybride."
    - id: "s2"
      text:
        en: "A hybrid cloud can provide an extra layer of security, because the organization chooses which services to deploy to its private cloud."
        fr: "Un cloud hybride peut apporter une couche de sécurité supplémentaire, car l'organisation choisit quels services déployer dans son cloud privé."
    - id: "s3"
      text:
        en: "An organization that runs a private cloud in its own datacenter pays only for the resources that it uses."
        fr: "Une organisation qui exploite un cloud privé dans son propre centre de données paie uniquement les ressources qu'elle utilise."
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: "Using several public cloud providers is a multicloud scenario; a hybrid cloud interconnects a public cloud and a private cloud. A hybrid cloud can add a layer of security, because the organization chooses which services stay in its private cloud. A private cloud in the organization's own datacenter requires hardware to be purchased and maintained, whether or not it is fully used."
    fr: "Utiliser plusieurs fournisseurs de cloud public correspond à un scénario multicloud ; un cloud hybride interconnecte un cloud public et un cloud privé. Un cloud hybride peut ajouter une couche de sécurité, car l'organisation choisit quels services restent dans son cloud privé. Un cloud privé dans le centre de données de l'organisation impose d'acheter et d'entretenir du matériel, qu'il soit pleinement utilisé ou non."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
