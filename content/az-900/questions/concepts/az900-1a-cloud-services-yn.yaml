id: az900-1a-cloud-services-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "Artificial intelligence (AI) and machine learning can be consumed as cloud services."
        fr: "L'intelligence artificielle (IA) et le machine learning peuvent être consommés sous forme de services cloud."
    - id: "s2"
      text:
        en: "A company must build its own datacenter before it can use cloud services."
        fr: "Une entreprise doit construire son propre centre de données avant de pouvoir utiliser des services cloud."
    - id: "s3"
      text:
        en: "Cloud computing services are delivered over the internet."
        fr: "Les services de cloud computing sont fournis sur Internet."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "Cloud computing delivers computing services over the internet. These services cover common IT infrastructure such as virtual machines, storage, databases and networking, and extend to IoT, machine learning and AI. Because the provider runs the infrastructure, a customer does not need a datacenter of its own."
    fr: "Le cloud computing fournit des services informatiques sur Internet. Ces services couvrent l'infrastructure informatique courante, comme les machines virtuelles, le stockage, les bases de données et le réseau, et s'étendent à l'IoT, au machine learning et à l'IA. Comme le fournisseur exploite l'infrastructure, un client n'a pas besoin de son propre centre de données."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
