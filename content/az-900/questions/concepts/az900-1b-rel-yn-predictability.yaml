id: az900-1b-rel-yn-predictability
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Autoscaling and load balancing are capabilities that support performance predictability.
      fr: "La mise à l'échelle automatique et l'équilibrage de charge sont des fonctionnalités qui servent la prévisibilité des performances."
  - id: s2
    text:
      en: In some cases, a cloud environment can shift to another region automatically, with no action from the customer.
      fr: Dans certains cas, un environnement cloud peut basculer automatiquement vers une autre région, sans action du client.
  - id: s3
    text:
      en: Cost predictability means that the monthly cost of a solution stays the same whatever the resources consumed.
      fr: "La prévisibilité des coûts signifie que le coût mensuel d'une solution reste le même quelles que soient les ressources consommées."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: "Performance predictability relies on autoscaling, load balancing and high availability. Reliability can be automatic: in some cases the cloud environment itself shifts to a different region. Cost predictability doesn't freeze costs: it means that you can forecast them, because you can track resource use and analyze trends."
    fr: "La prévisibilité des performances s'appuie sur la mise à l'échelle automatique, l'équilibrage de charge et la haute disponibilité. La fiabilité peut être automatique : dans certains cas, l'environnement cloud bascule de lui-même vers une autre région. La prévisibilité des coûts ne fige pas les coûts : elle signifie que vous pouvez les prévoir, parce que vous pouvez suivre l'utilisation des ressources et analyser les tendances."
  options:
    s3:
      en: Cloud costs follow consumption. Predictability means being able to forecast them, not that they are fixed.
      fr: "Les coûts du cloud suivent la consommation. La prévisibilité signifie pouvoir les prévoir, pas qu'ils sont fixes."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
