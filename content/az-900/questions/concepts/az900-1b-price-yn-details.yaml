id: az900-1b-price-yn-details
objective: "1.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A reservation can reduce the cost of services other than virtual machines, such as databases and storage.
      fr: Une réservation peut réduire le coût de services autres que les machines virtuelles, comme des bases de données et du stockage.
  - id: s2
    text:
      en: After you buy a reservation, you must redeploy the matching virtual machines to receive the discount.
      fr: "Après l'achat d'une réservation, vous devez redéployer les machines virtuelles concernées pour bénéficier de la remise."
  - id: s3
    text:
      en: With an Azure savings plan for compute, eligible usage above the hourly commitment is billed at pay-as-you-go prices.
      fr: "Avec un plan d'économies Azure pour le calcul, l'utilisation éligible qui dépasse l'engagement horaire est facturée au prix du paiement à l'utilisation."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "Reservations exist for several services, including virtual machines, databases and storage. A reservation is a billing discount only: it applies automatically to the usage that matches it and doesn't change the way resources run. A savings plan discounts eligible usage up to the hourly commitment; anything above is billed at pay-as-you-go prices."
    fr: "Les réservations existent pour plusieurs services, dont les machines virtuelles, les bases de données et le stockage. Une réservation n'est qu'une remise de facturation : elle s'applique automatiquement à l'utilisation qui lui correspond et ne change pas la façon dont les ressources s'exécutent. Un plan d'économies réduit le prix de l'utilisation éligible jusqu'à l'engagement horaire ; ce qui dépasse est facturé au prix du paiement à l'utilisation."
  options:
    s2:
      en: "The discount applies automatically to matching usage. A reservation doesn't change the runtime state of resources, so nothing has to be redeployed."
      fr: "La remise s'applique automatiquement à l'utilisation correspondante. Une réservation ne modifie pas l'état d'exécution des ressources : rien n'est à redéployer."
references:
- title: What are Azure Reservations?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
- title: What are savings plans?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
