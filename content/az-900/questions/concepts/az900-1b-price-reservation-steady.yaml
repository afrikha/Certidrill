id: az900-1b-price-reservation-steady
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to run a line-of-business application on Azure virtual machines of a fixed size in a single region. The virtual machines will run 24 hours a day for the next three years, and the application must not be interrupted.

    Contoso needs to minimize the cost of the virtual machines.

    Which pricing option should Contoso use?
  fr: |
    Contoso prévoit d'exécuter une application métier sur des machines virtuelles Azure de taille fixe, dans une seule région. Les machines virtuelles fonctionneront 24 heures sur 24 pendant les trois prochaines années, et l'application ne doit pas être interrompue.

    Contoso doit réduire au minimum le coût des machines virtuelles.

    Quelle option de tarification Contoso doit-elle utiliser ?
body:
  options:
  - id: a
    text:
      en: Pay-as-you-go
      fr: "Le paiement à l'utilisation"
  - id: b
    text:
      en: Azure Spot Virtual Machines
      fr: Les machines virtuelles Azure Spot
  - id: c
    text:
      en: Azure Reservations
      fr: Les réservations Azure
  - id: d
    text:
      en: Azure free account
      fr: Le compte gratuit Azure
answer:
  optionId: c
explanation:
  correct:
    en: A reservation is a commitment to specific resources for one or three years, in exchange for a lower price than pay-as-you-go. It fits a workload whose size, region and continuous use are known for the whole term.
    fr: "Une réservation est un engagement d'un ou trois ans sur des ressources précises, en échange d'un prix inférieur au paiement à l'utilisation. Elle convient à une charge de travail dont la taille, la région et l'utilisation continue sont connues pour toute la durée."
  options:
    a:
      en: Pay-as-you-go requires no commitment, but it gives no discount to a workload that runs continuously for three years.
      fr: "Le paiement à l'utilisation n'impose aucun engagement, mais il n'accorde aucune remise à une charge de travail qui tourne en continu pendant trois ans."
    b:
      en: Spot pricing is lower, but Azure can evict the virtual machines when it needs the capacity back, which would interrupt the application.
      fr: "La tarification Spot est plus basse, mais Azure peut évincer les machines virtuelles lorsqu'il a besoin de récupérer la capacité, ce qui interromprait l'application."
    d:
      en: "The free account gives a credit for the first 30 days and limited free quantities of some services; it doesn't cover production virtual machines for three years."
      fr: Le compte gratuit donne un crédit pour les 30 premiers jours et des quantités gratuites limitées de certains services ; il ne couvre pas des machines virtuelles de production pendant trois ans.
references:
- title: What are Azure Reservations?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
