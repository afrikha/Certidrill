id: az900-1c-iaas-sentence
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In an IaaS model, the cloud provider is responsible for [[provider]], and you are responsible for [[customer]].
    fr: |
      Dans un modèle IaaS, le fournisseur de cloud est responsable [[provider]], et vous êtes responsable [[customer]].
  slots:
    - id: provider
      options:
        - { id: os, text: { en: "the operating system and the middleware", fr: "du système d'exploitation et des intergiciels" } }
        - { id: hw, text: { en: "the hardware and the physical security", fr: "du matériel et de la sécurité physique" } }
        - { id: app, text: { en: "the applications and their data", fr: "des applications et de leurs données" } }
    - id: customer
      options:
        - { id: power, text: { en: "the power and cooling of the servers", fr: "de l'alimentation et du refroidissement des serveurs" } }
        - { id: net, text: { en: "the physical network of the datacenter", fr: "du réseau physique du centre de données" } }
        - { id: osmaint, text: { en: "the installation and maintenance of the operating system", fr: "de l'installation et de la maintenance du système d'exploitation" } }
answer:
  values: { provider: hw, customer: osmaint }
explanation:
  correct:
    en: "With IaaS, the provider maintains the hardware, the network connectivity to the internet and the physical security. Everything above that is yours: operating system installation, configuration and maintenance, network configuration, databases, storage and applications."
    fr: "Avec IaaS, le fournisseur entretient le matériel, la connectivité réseau à Internet et la sécurité physique. Tout ce qui se trouve au-dessus vous revient : installation, configuration et maintenance du système d'exploitation, configuration réseau, bases de données, stockage et applications."
  options:
    os:
      en: "The provider maintains the operating system and the middleware in a PaaS model, not in an IaaS model."
      fr: "Le fournisseur entretient le système d'exploitation et les intergiciels dans un modèle PaaS, pas dans un modèle IaaS."
    power:
      en: "Power, cooling and the physical network always belong to the cloud provider."
      fr: "L'alimentation, le refroidissement et le réseau physique reviennent toujours au fournisseur de cloud."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
