id: az900-1c-mgmt-benefit-tools
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Administrators at Woodgrove Bank can manage the same cloud resources through a web portal, a command-line interface, APIs, or PowerShell, depending on the task.

    Which benefit of cloud computing does this illustrate?
  fr: |
    Les administrateurs de Woodgrove Bank peuvent gérer les mêmes ressources cloud au moyen d'un portail web, d'une interface de ligne de commande, d'API ou de PowerShell, selon la tâche.

    Quel avantage du cloud computing cette situation illustre-t-elle ?
body:
  options:
    - id: a
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: b
      text: { en: "Predictability", fr: "Prévisibilité" }
    - id: c
      text: { en: "Manageability", fr: "Facilité de gestion" }
    - id: d
      text: { en: "Scalability", fr: "Scalabilité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Manageability covers how you interact with your cloud environment: a web portal, a command-line interface, APIs and PowerShell are the four ways Microsoft lists for management in the cloud. Having several tools for the same resources is a manageability benefit."
    fr: "La facilité de gestion couvre la façon dont vous interagissez avec votre environnement cloud : un portail web, une interface de ligne de commande, des API et PowerShell sont les quatre moyens que Microsoft cite pour la gestion dans le cloud. Disposer de plusieurs outils pour les mêmes ressources est un avantage de facilité de gestion."
  options:
    a:
      en: "Reliability is the ability of a system to recover from failures and keep working; it says nothing about the tools used to administer resources."
      fr: "La fiabilité est la capacité d'un système à se remettre des défaillances et à continuer de fonctionner ; elle ne dit rien des outils d'administration."
    b:
      en: "Predictability is about knowing in advance the performance and the cost of a solution, not about the management tools."
      fr: "La prévisibilité consiste à connaître à l'avance les performances et le coût d'une solution, pas les outils de gestion."
    d:
      en: "Scalability is the ability to adjust resources to meet demand; the scenario describes no change in demand."
      fr: "La scalabilité est la capacité d'ajuster les ressources à la demande ; le scénario ne décrit aucune variation de la demande."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
