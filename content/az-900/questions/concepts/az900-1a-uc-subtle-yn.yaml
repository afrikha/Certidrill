id: az900-1a-uc-subtle-yn
objective: "1.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "A company that has legal requirements on where some of its data is stored can meet them with a hybrid cloud."
        fr: "Une entreprise soumise à des exigences légales sur l'emplacement de stockage de certaines de ses données peut y répondre avec un cloud hybride."
    - id: "s2"
      text:
        en: "A company that wants to avoid all hardware maintenance should run a private cloud in its own datacenter."
        fr: "Une entreprise qui veut éviter toute maintenance matérielle doit exécuter un cloud privé dans son propre centre de données."
    - id: "s3"
      text:
        en: "A hybrid cloud removes capital expenditure for the workloads that stay in the company's own datacenter."
        fr: "Un cloud hybride supprime les dépenses d'investissement pour les charges de travail qui restent dans le centre de données de l'entreprise."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: "With a hybrid cloud, the company controls security, compliance or legal requirements: it keeps the data concerned in its private cloud. Running a private cloud in its own datacenter makes the company responsible for hardware maintenance and updates. The private part of a hybrid cloud still relies on hardware that the company buys; only the workloads placed in the public cloud avoid capital expenditure."
    fr: "Avec un cloud hybride, l'entreprise contrôle la sécurité, la conformité ou les exigences légales : elle conserve les données concernées dans son cloud privé. Exécuter un cloud privé dans son propre centre de données rend l'entreprise responsable de la maintenance et des mises à jour du matériel. La partie privée d'un cloud hybride repose toujours sur du matériel que l'entreprise achète ; seules les charges de travail placées dans le cloud public évitent les dépenses d'investissement."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
