id: az900-1a-consumption-options
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware is launching an application whose demand is unknown. The company compares two options:

    - **Option 1**: buy servers that are sized for the estimated peak demand.
    - **Option 2**: run the application on Azure virtual machines under the consumption-based model.

    Which statement is true?
  fr: |
    Litware lance une application dont la demande est inconnue. L'entreprise compare deux options :

    - **Option 1** : acheter des serveurs dimensionnés pour le pic de demande estimé.
    - **Option 2** : exécuter l'application sur des machines virtuelles Azure selon le modèle basé sur la consommation.

    Quelle affirmation est vraie ?
body:
  options:
    - id: "a"
      text:
        en: "Option 1 is an operational expenditure, because the servers are used for several years."
        fr: "L'option 1 est une dépense d'exploitation, car les serveurs sont utilisés pendant plusieurs années."
    - id: "b"
      text:
        en: "Option 1 avoids paying for idle capacity if demand is lower than the estimate."
        fr: "L'option 1 évite de payer une capacité inutilisée si la demande est inférieure à l'estimation."
    - id: "c"
      text:
        en: "Option 2 has no upfront cost, and Litware pays more only if demand grows."
        fr: "L'option 2 n'a aucun coût initial, et Litware ne paie davantage que si la demande augmente."
    - id: "d"
      text:
        en: "Option 2 requires Litware to pay for the estimated peak capacity from the first day."
        fr: "L'option 2 impose à Litware de payer dès le premier jour la capacité de pointe estimée."
answer:
  optionId: "c"
explanation:
  correct:
    en: "Under the consumption-based model there is no upfront cost: Litware adds virtual machines when demand increases, removes them when it drops and pays only for what it uses. Buying servers is a capital expenditure decided on an estimate: if demand is lower, Litware has paid for idle capacity."
    fr: "Avec le modèle basé sur la consommation, il n'y a aucun coût initial : Litware ajoute des machines virtuelles quand la demande augmente, les retire quand elle baisse et paie uniquement ce qu'elle utilise. L'achat de serveurs est une dépense d'investissement décidée sur une estimation : si la demande est plus faible, Litware a payé une capacité inutilisée."
  options:
    a:
      en: "Buying servers is upfront spending on physical infrastructure, which is a capital expenditure, however long the servers are used."
      fr: "L'achat de serveurs est une dépense initiale consacrée à une infrastructure physique, donc une dépense d'investissement, quelle que soit la durée d'utilisation des serveurs."
    b:
      en: "Purchased servers are paid for whether or not they are used: overestimating means paying for idle infrastructure."
      fr: "Des serveurs achetés sont payés qu'ils soient utilisés ou non : surestimer revient à payer une infrastructure inutilisée."
    d:
      en: "The consumption-based model does not require paying for the peak in advance; capacity follows actual demand."
      fr: "Le modèle basé sur la consommation n'impose pas de payer le pic à l'avance ; la capacité suit la demande réelle."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
