id: az900-1c-saas-definition
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    With which cloud service type do you essentially rent or use a fully developed application?
  fr: |
    Avec quel type de service cloud louez-vous ou utilisez-vous essentiellement une application entièrement développée ?
body:
  options:
    - id: a
      text: "Software as a service (SaaS)"
    - id: b
      text: "Platform as a service (PaaS)"
    - id: c
      text: "Infrastructure as a service (IaaS)"
answer: { optionId: a }
explanation:
  correct:
    en: "SaaS is the most complete cloud service model from a product perspective: you rent or use a fully developed application, such as email, financial software or a messaging application. The provider manages everything needed to run it."
    fr: "SaaS est le modèle de service cloud le plus complet du point de vue du produit : vous louez ou utilisez une application entièrement développée, comme l'e-mail, un logiciel de gestion financière ou une application de messagerie. Le fournisseur gère tout ce qui est nécessaire à son fonctionnement."
  options:
    b:
      en: "PaaS provides a platform on which you deploy an application that you develop yourself."
      fr: "PaaS fournit une plateforme sur laquelle vous déployez une application que vous développez vous-même."
    c:
      en: "IaaS provides rented hardware; you install the operating system and the applications."
      fr: "IaaS fournit du matériel loué ; vous installez le système d'exploitation et les applications."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
