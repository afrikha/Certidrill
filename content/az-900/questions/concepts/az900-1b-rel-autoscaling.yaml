id: az900-1b-rel-autoscaling
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which capability supports performance predictability by deploying additional resources when demand increases and by scaling back when demand drops?
  fr: |
    Quelle fonctionnalité sert la prévisibilité des performances en déployant des ressources supplémentaires quand la demande augmente et en les réduisant quand la demande baisse ?
body:
  options:
  - id: a
    text:
      en: Autoscaling
      fr: "La mise à l'échelle automatique"
  - id: b
    text:
      en: Load balancing
      fr: "L'équilibrage de charge"
  - id: c
    text:
      en: Reserved capacity
      fr: La capacité réservée
  - id: d
    text:
      en: Cost analysis
      fr: "L'analyse des coûts"
answer:
  optionId: a
explanation:
  correct:
    en: Autoscaling adds resources automatically when the load increases and removes them when it decreases. The application keeps the resources that it needs to give customers a good experience, without an operator having to watch the load.
    fr: "La mise à l'échelle automatique ajoute automatiquement des ressources quand la charge augmente et les retire quand elle diminue. L'application garde ainsi les ressources nécessaires pour offrir une bonne expérience aux clients, sans qu'un opérateur doive surveiller la charge."
  options:
    b:
      en: "Load balancing distributes the traffic between existing resources; it doesn't add or remove resources."
      fr: "L'équilibrage de charge répartit le trafic entre les ressources existantes ; il n'ajoute ni ne retire de ressources."
    c:
      en: Reserved capacity is a pricing commitment for one or three years, not a way to follow demand.
      fr: "La capacité réservée est un engagement tarifaire d'un ou trois ans, pas un moyen de suivre la demande."
    d:
      en: "Cost analysis shows what resources cost; it serves cost predictability and doesn't change the resources."
      fr: "L'analyse des coûts montre ce que coûtent les ressources ; elle sert la prévisibilité des coûts et ne modifie pas les ressources."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- title: Autoscale in Azure Monitor
  url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-overview
