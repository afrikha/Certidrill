id: az900-1c-iaas-example-service
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Azure service is an example of infrastructure as a service (IaaS)?
  fr: |
    Quel service Azure est un exemple d'IaaS (infrastructure as a service) ?
body:
  options:
    - id: a
      text: "Azure App Service"
    - id: b
      text: "Azure Functions"
    - id: c
      text: "Azure SQL Database"
    - id: d
      text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Virtual Machines is an IaaS service: Microsoft runs the physical hosts, and you maintain the virtual machine by configuring it, patching it and installing the software that runs on it."
    fr: "Machines virtuelles Azure est un service IaaS : Microsoft exploite les hôtes physiques, et vous entretenez la machine virtuelle en la configurant, en y appliquant les correctifs et en y installant les logiciels."
  options:
    a:
      en: "Azure App Service is a PaaS service: you run web applications without managing the underlying infrastructure."
      fr: "Azure App Service est un service PaaS : vous exécutez des applications web sans gérer l'infrastructure sous-jacente."
    b:
      en: "Azure Functions is a serverless service, classified as PaaS: you deploy code without deploying or maintaining servers."
      fr: "Azure Functions est un service serverless, classé dans PaaS : vous déployez du code sans déployer ni entretenir de serveurs."
    c:
      en: "Azure SQL Database is a PaaS database: Azure patches and upgrades the database software for you."
      fr: "Azure SQL Database est une base de données PaaS : Azure applique les correctifs et les mises à niveau du logiciel de base de données à votre place."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
  - title: Virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
