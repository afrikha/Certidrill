id: az900-1c-use-sentence
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A company that wants a managed database on which to build its own application, with patching and backups handled by the provider, should use [[db]].

      A company that wants a ready-made expense tracking application should use [[expense]].
    fr: |
      Une entreprise qui veut une base de données managée sur laquelle bâtir sa propre application, les correctifs et les sauvegardes étant pris en charge par le fournisseur, doit utiliser [[db]].

      Une entreprise qui veut une application de suivi des dépenses toute faite doit utiliser [[expense]].
  slots:
    - id: db
      options:
        - { id: iaas, text: "IaaS" }
        - { id: paas, text: "PaaS" }
        - { id: saas, text: "SaaS" }
    - id: expense
      options:
        - { id: iaas, text: "IaaS" }
        - { id: paas, text: "PaaS" }
        - { id: saas, text: "SaaS" }
answer:
  values: { db: paas, expense: saas }
explanation:
  correct:
    en: "A managed database is PaaS: the provider maintains the database software, and you do not worry about licensing or patching, while you still build your own application on it. A ready-made application for finance and expense tracking is a common SaaS scenario: you just use it."
    fr: "Une base de données managée relève de PaaS : le fournisseur entretient le logiciel de base de données, vous ne vous souciez ni des licences ni des correctifs, et vous bâtissez toujours votre propre application dessus. Une application toute faite de gestion financière et de suivi des dépenses est un scénario courant de SaaS : il suffit de l'utiliser."
  options:
    iaas:
      en: "With IaaS, the company would install the database or the application on virtual machines and patch everything itself."
      fr: "Avec IaaS, l'entreprise installerait la base de données ou l'application sur des machines virtuelles et appliquerait elle-même tous les correctifs."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
