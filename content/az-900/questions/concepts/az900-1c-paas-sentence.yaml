id: az900-1c-paas-sentence
objective: "1.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      PaaS is well suited to provide [[what]] without the need to [[without]].
    fr: |
      PaaS est bien adapté pour fournir [[what]] sans avoir à [[without]].
  slots:
    - id: what
      options:
        - { id: hw, text: { en: "rented hardware in a datacenter", fr: "du matériel loué dans un centre de données" } }
        - { id: dev, text: { en: "a complete development environment", fr: "un environnement de développement complet" } }
        - { id: app, text: { en: "a finished business application", fr: "une application métier finie" } }
    - id: without
      options:
        - { id: infra, text: { en: "maintain the development infrastructure", fr: "entretenir l'infrastructure de développement" } }
        - { id: code, text: { en: "write any application code", fr: "écrire le moindre code d'application" } }
        - { id: access, text: { en: "manage access to your data", fr: "gérer l'accès à vos données" } }
answer:
  values: { what: dev, without: infra }
explanation:
  correct:
    en: "PaaS provides a complete development environment without the burden of maintaining all the development infrastructure: the provider maintains the operating systems, the middleware and the development tools. You still write your application and remain responsible for your data and for who can access it."
    fr: "PaaS fournit un environnement de développement complet sans la charge d'entretenir toute l'infrastructure de développement : le fournisseur entretient les systèmes d'exploitation, les intergiciels et les outils de développement. Vous écrivez toujours votre application et restez responsable de vos données et de leurs accès."
  options:
    hw:
      en: "Renting hardware in a datacenter describes IaaS."
      fr: "Louer du matériel dans un centre de données décrit IaaS."
    app:
      en: "A finished application that you simply use describes SaaS."
      fr: "Une application finie que vous vous contentez d'utiliser décrit SaaS."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
