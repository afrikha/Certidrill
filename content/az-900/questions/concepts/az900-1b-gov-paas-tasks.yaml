id: az900-1b-gov-paas-tasks
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a custom web application on virtual machines (IaaS). Fabrikam plans to move the application to a platform as a service (PaaS) offering.

    Which two tasks that Fabrikam performs today will the cloud provider perform after the move?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute une application web personnalisée sur des machines virtuelles (IaaS). Fabrikam prévoit de déplacer l'application vers une offre PaaS (platform as a service).

    Quelles sont les deux tâches, aujourd'hui effectuées par Fabrikam, que le fournisseur de cloud effectuera après le déplacement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Protecting the data stored by the application
      fr: "Protéger les données stockées par l'application"
  - id: b
    text:
      en: Installing operating system patches
      fr: "Installer les correctifs du système d'exploitation"
  - id: c
    text:
      en: Managing the accounts and identities of the users
      fr: Gérer les comptes et les identités des utilisateurs
  - id: d
    text:
      en: Maintaining the runtime on which the application runs
      fr: "Entretenir le runtime sur lequel l'application s'exécute"
  - id: e
    text:
      en: Securing the devices that connect to the application
      fr: "Sécuriser les appareils qui se connectent à l'application"
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: With IaaS, the customer manages the operating system and the installed software, including patches and maintenance. With PaaS, the provider manages the operating system and the runtime, and patches and maintenance are handled automatically.
    fr: "Avec IaaS, le client gère le système d'exploitation et les logiciels installés, correctifs et maintenance compris. Avec PaaS, le fournisseur gère le système d'exploitation et le runtime, et les correctifs et la maintenance sont pris en charge automatiquement."
  options:
    a:
      en: Information and data always remain the responsibility of the customer.
      fr: Les informations et les données restent toujours sous la responsabilité du client.
    c:
      en: Accounts and identities always remain the responsibility of the customer.
      fr: Les comptes et les identités restent toujours sous la responsabilité du client.
    e:
      en: The devices that connect to the cloud always remain the responsibility of the customer.
      fr: Les appareils qui se connectent au cloud restent toujours sous la responsabilité du client.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
