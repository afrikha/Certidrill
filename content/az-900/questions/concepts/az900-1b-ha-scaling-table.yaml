id: az900-1b-ha-scaling-table
objective: "1.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum records the state of the web tier of an application four times during one day, as shown in the following table. Between two rows, Adatum performs at most one scaling operation.

    For each scaling operation, select the value that results from it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum relève l'état du niveau web d'une application quatre fois au cours d'une journée, comme le montre le tableau suivant. Entre deux lignes, Adatum effectue au plus une opération de mise à l'échelle.

    Pour chaque opération de mise à l'échelle, sélectionnez la valeur qui en résulte.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
  - id: p1
    text:
      en: Scaling out
      fr: Scale-out
  - id: p2
    text:
      en: Scaling up
      fr: Scale-up
  grid:
    header:
    - en: Time
      fr: Heure
    - en: Requests per minute
      fr: Requêtes par minute
    - en: Number of instances
      fr: "Nombre d'instances"
    - en: Size of each instance
      fr: Taille de chaque instance
    rows:
    - - text: '06:00'
      - text: '300'
      - text: '2'
      - text:
          en: 2 vCPUs, 8 GB
          fr: 2 processeurs virtuels, 8 Go
    - - text: '10:00'
      - text: '4000'
      - text: '6'
        area: i10
      - text:
          en: 2 vCPUs, 8 GB
          fr: 2 processeurs virtuels, 8 Go
        area: s10
    - - text: '15:00'
      - text: '7000'
      - text: '6'
        area: i15
      - text:
          en: 4 vCPUs, 16 GB
          fr: 4 processeurs virtuels, 16 Go
        area: s15
    - - text: '23:00'
      - text: '250'
      - text: '2'
        area: i23
      - text:
          en: 4 vCPUs, 16 GB
          fr: 4 processeurs virtuels, 16 Go
        area: s23
answer:
  values:
    p1: i10
    p2: s15
explanation:
  correct:
    en: "Scaling out is horizontal: it adds instances, which happens between 06:00 and 10:00 when the number of instances goes from 2 to 6. Scaling up is vertical: it gives more CPU and memory to each instance, which happens between 10:00 and 15:00 when the size goes from 2 vCPUs and 8 GB to 4 vCPUs and 16 GB."
    fr: "Le scale-out est horizontal : il ajoute des instances, ce qui se produit entre 06:00 et 10:00, quand le nombre d'instances passe de 2 à 6. Le scale-up est vertical : il donne plus de processeur et de mémoire à chaque instance, ce qui se produit entre 10:00 et 15:00, quand la taille passe de 2 processeurs virtuels et 8 Go à 4 processeurs virtuels et 16 Go."
  options:
    i23:
      en: "Going from 6 to 2 instances at 23:00 is scaling in: instances are removed."
      fr: "Passer de 6 à 2 instances à 23:00 est un scale-in : des instances sont retirées."
    i15:
      en: "The number of instances doesn't change between 10:00 and 15:00."
      fr: "Le nombre d'instances ne change pas entre 10:00 et 15:00."
    s10:
      en: "The size of the instances doesn't change between 06:00 and 10:00."
      fr: La taille des instances ne change pas entre 06:00 et 10:00.
    s23:
      en: "The size of the instances doesn't change between 15:00 and 23:00."
      fr: La taille des instances ne change pas entre 15:00 et 23:00.
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- title: Autoscale in Azure Monitor
  url: https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-overview
