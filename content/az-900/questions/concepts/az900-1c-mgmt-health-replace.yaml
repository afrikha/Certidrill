id: az900-1c-mgmt-health-replace
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs an application on several identical cloud servers. When a server stops responding, the platform must detect the failure and replace the server without any action by an administrator.

    Which manageability capability of the cloud does this describe?
  fr: |
    Tailspin Toys exécute une application sur plusieurs serveurs cloud identiques. Lorsqu'un serveur cesse de répondre, la plateforme doit détecter la défaillance et remplacer le serveur sans aucune action d'un administrateur.

    Quelle capacité du cloud, liée à la facilité de gestion, cette situation décrit-elle ?
body:
  options:
    - id: a
      text: { en: "Automatic scaling of resource deployment based on need", fr: "Mise à l'échelle automatique du déploiement des ressources selon les besoins" }
    - id: b
      text: { en: "Health monitoring with automatic replacement of failing resources", fr: "Surveillance de l'intégrité avec remplacement automatique des ressources défaillantes" }
    - id: c
      text: { en: "Resource deployment based on a preconfigured template", fr: "Déploiement de ressources à partir d'un modèle préconfiguré" }
    - id: d
      text: { en: "Automatic alerts based on configured metrics", fr: "Alertes automatiques fondées sur des métriques configurées" }
answer: { optionId: b }
explanation:
  correct:
    en: "Management of the cloud includes monitoring the health of resources and automatically replacing the ones that fail. The scenario is about a failed server that is detected and replaced with no human intervention."
    fr: "La gestion du cloud comprend la surveillance de l'intégrité des ressources et le remplacement automatique de celles qui défaillent. Le scénario porte sur un serveur défaillant, détecté et remplacé sans intervention humaine."
  options:
    a:
      en: "Automatic scaling adds or removes resources when demand changes; here the number of servers stays the same and a failed one is replaced."
      fr: "La mise à l'échelle automatique ajoute ou retire des ressources quand la demande change ; ici le nombre de serveurs reste le même et un serveur défaillant est remplacé."
    c:
      en: "A template removes manual configuration when you deploy resources; it does not detect a failure."
      fr: "Un modèle supprime la configuration manuelle lors du déploiement des ressources ; il ne détecte pas une défaillance."
    d:
      en: "An alert only informs the team; the requirement is that the server is replaced without any action by an administrator."
      fr: "Une alerte se contente d'informer l'équipe ; l'exigence est que le serveur soit remplacé sans action d'un administrateur."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
