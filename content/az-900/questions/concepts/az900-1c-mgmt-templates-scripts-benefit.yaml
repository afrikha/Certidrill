id: az900-1c-mgmt-templates-scripts-benefit
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The operations team at Proseware deploys cloud resources from templates and automates recurring tasks by using scripts.

    What is the main benefit of this approach?
  fr: |
    L'équipe d'exploitation de Proseware déploie les ressources cloud à partir de modèles et automatise les tâches récurrentes au moyen de scripts.

    Quel est le principal avantage de cette approche ?
body:
  options:
    - id: a
      text: { en: "A lower price for each resource that is deployed", fr: "Un prix plus bas pour chaque ressource déployée" }
    - id: b
      text: { en: "A transfer of responsibility for the data to the provider", fr: "Un transfert au fournisseur de la responsabilité des données" }
    - id: c
      text: { en: "Less manual effort and more consistent configurations", fr: "Moins d'effort manuel et des configurations plus cohérentes" }
    - id: d
      text: { en: "A guarantee that deployed resources never fail", fr: "La garantie que les ressources déployées ne défaillent jamais" }
answer: { optionId: c }
explanation:
  correct:
    en: "Deploying from templates removes manual configuration, and scripts automate recurring tasks. Together they reduce manual effort and help keep configurations consistent, which is the manageability benefit of the cloud."
    fr: "Le déploiement à partir de modèles supprime la configuration manuelle, et les scripts automatisent les tâches récurrentes. Ensemble, ils réduisent l'effort manuel et aident à garder des configurations cohérentes : c'est l'avantage de facilité de gestion du cloud."
  options:
    a:
      en: "The way a resource is deployed does not change its price; you pay for what the resource consumes."
      fr: "La façon de déployer une ressource ne change pas son prix ; vous payez ce que la ressource consomme."
    b:
      en: "The customer always remains responsible for its information and data, whatever the tools used."
      fr: "Le client reste toujours responsable de ses informations et de ses données, quels que soient les outils utilisés."
    d:
      en: "Templates and scripts make deployments repeatable; they do not prevent failures."
      fr: "Les modèles et les scripts rendent les déploiements reproductibles ; ils n'empêchent pas les défaillances."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
