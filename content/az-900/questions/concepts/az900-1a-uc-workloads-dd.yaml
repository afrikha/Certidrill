id: az900-1a-uc-workloads-dd
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is choosing a cloud model for three solutions.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware choisit un modèle de cloud pour trois solutions.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: "text"
  template:
    en: "A test environment with unpredictable demand, which must be created without capital expenditure and paid for according to usage, fits a [[w1]] cloud.\n\nAn archive whose data must stay on hardware that is dedicated to Litware, under the complete control of Litware, fits a [[w2]] cloud.\n\nA payroll database that stays in the Litware datacenter and is connected to a web portal hosted by a cloud provider forms a [[w3]] cloud."
    fr: "Un environnement de test à la demande imprévisible, qui doit être créé sans dépense d'investissement et payé à l'utilisation, correspond à un cloud [[w1]].\n\nUne archive dont les données doivent rester sur du matériel dédié à Litware, sous le contrôle total de Litware, correspond à un cloud [[w2]].\n\nUne base de données de paie qui reste dans le centre de données de Litware et qui est connectée à un portail web hébergé chez un fournisseur de cloud forme un cloud [[w3]]."
  slots:
    - id: "w1"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
    - id: "w2"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
    - id: "w3"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
answer:
  values:
    w1: "pub"
    w2: "priv"
    w3: "hyb"
explanation:
  correct:
    en: "A public cloud needs no capital expenditure and is paid for according to usage, which suits an environment with unpredictable demand. A private cloud keeps data on hardware dedicated to the organization, under its complete control. Keeping a database in the datacenter and connecting it to a portal hosted by a cloud provider interconnects private and public resources: this is a hybrid cloud."
    fr: "Un cloud public ne nécessite aucune dépense d'investissement et se paie à l'utilisation, ce qui convient à un environnement dont la demande est imprévisible. Un cloud privé conserve les données sur du matériel dédié à l'organisation, sous son contrôle total. Conserver une base de données dans le centre de données et la connecter à un portail hébergé chez un fournisseur de cloud interconnecte des ressources privées et publiques : c'est un cloud hybride."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
