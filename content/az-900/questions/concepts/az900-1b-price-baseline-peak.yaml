id: az900-1b-price-baseline-peak
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam will run 10 virtual machines of a fixed size continuously in one region for at least the next year. During sales that it cannot plan in advance, Fabrikam adds up to 30 virtual machines for a few days. None of the virtual machines can be interrupted.

    Fabrikam needs to minimize the cost of the virtual machines.

    Which pricing option should Fabrikam use for each group of virtual machines? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam va exécuter en continu 10 machines virtuelles de taille fixe dans une seule région pendant au moins l'année à venir. Lors de ventes qu'elle ne peut pas planifier à l'avance, Fabrikam ajoute jusqu'à 30 machines virtuelles pendant quelques jours. Aucune des machines virtuelles ne peut être interrompue.

    Fabrikam doit réduire au minimum le coût des machines virtuelles.

    Quelle option de tarification Fabrikam doit-elle utiliser pour chaque groupe de machines virtuelles ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The 10 virtual machines that run continuously: [[base]]

      The virtual machines added during sales: [[peak]]
    fr: |
      Les 10 machines virtuelles qui fonctionnent en continu : [[base]]

      Les machines virtuelles ajoutées pendant les ventes : [[peak]]
  slots:
  - id: base
    options:
    - id: payg
      text:
        en: Pay-as-you-go
        fr: "Paiement à l'utilisation"
    - id: res
      text:
        en: A one-year reservation
        fr: "Réservation d'un an"
    - id: spot
      text:
        en: Spot pricing
        fr: Tarification Spot
  - id: peak
    options:
    - id: payg
      text:
        en: Pay-as-you-go
        fr: "Paiement à l'utilisation"
    - id: res
      text:
        en: A one-year reservation
        fr: "Réservation d'un an"
    - id: spot
      text:
        en: Spot pricing
        fr: Tarification Spot
answer:
  values:
    base: res
    peak: payg
explanation:
  correct:
    en: "The 10 virtual machines are a stable, predictable workload: a reservation lowers their price in exchange for a one-year commitment. The additional virtual machines exist for a few days at unpredictable dates, so a commitment would be paid mostly for nothing: pay-as-you-go bills them only while they exist. Spot pricing is excluded for both groups because Azure can evict Spot virtual machines."
    fr: "Les 10 machines virtuelles forment une charge de travail stable et prévisible : une réservation réduit leur prix en échange d'un engagement d'un an. Les machines virtuelles supplémentaires n'existent que quelques jours, à des dates imprévisibles : un engagement serait payé en grande partie pour rien, alors que le paiement à l'utilisation ne les facture que pendant leur existence. La tarification Spot est exclue pour les deux groupes, car Azure peut évincer les machines virtuelles Spot."
references:
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
- title: What are Azure Reservations?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
