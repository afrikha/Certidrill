id: az900-1a-models-traits-dd
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: "text"
  template:
    en: "With a [[m1]] cloud, all the hardware must be purchased and maintained by the single organization that uses it.\n\nA [[m2]] cloud provides the most flexibility, because you determine where to run each application.\n\nWith a [[m3]] cloud, you own no hardware, and no capital expenditure is needed to scale up."
    fr: "Avec un cloud [[m1]], tout le matériel doit être acheté et entretenu par la seule organisation qui l'utilise.\n\nUn cloud [[m2]] offre la plus grande flexibilité, car vous déterminez où exécuter chaque application.\n\nAvec un cloud [[m3]], vous ne possédez aucun matériel, et aucune dépense d'investissement n'est nécessaire pour monter en charge."
  slots:
    - id: "m1"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
    - id: "m2"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
    - id: "m3"
      options:
        - id: "pub"
          text: "public"
        - id: "priv"
          text:
            en: "private"
            fr: "privé"
        - id: "hyb"
          text:
            en: "hybrid"
            fr: "hybride"
answer:
  values:
    m1: "priv"
    m2: "hyb"
    m3: "pub"
explanation:
  correct:
    en: "A private cloud is dedicated to one organization, which must purchase the hardware and maintain it. A hybrid cloud interconnects public and private clouds, so each application runs where it fits best. In a public cloud, the provider owns the infrastructure: you scale up without capital expenditure and pay only for what you use."
    fr: "Un cloud privé est dédié à une seule organisation, qui doit acheter le matériel et l'entretenir. Un cloud hybride interconnecte des clouds public et privé : chaque application s'exécute là où elle convient le mieux. Dans un cloud public, le fournisseur possède l'infrastructure : vous montez en charge sans dépense d'investissement et vous payez uniquement ce que vous utilisez."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
