id: az900-1b-sls-execution-order
objective: "1.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys a function to Azure Functions in a serverless model. The function creates a thumbnail each time an image is uploaded to a storage account.

    Which three events occur in sequence when a user uploads an image? To answer, move the appropriate events from the list of events to the answer area and arrange them in the correct order.
  fr: |
    Contoso déploie une fonction dans Azure Functions selon un modèle serverless. La fonction crée une miniature chaque fois qu'une image est chargée dans un compte de stockage.

    Quels sont les trois événements qui se produisent dans l'ordre lorsqu'un utilisateur charge une image ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
  - id: os
    text:
      en: An administrator installs operating system updates on the server that hosts the function.
      fr: "Un administrateur installe les mises à jour du système d'exploitation sur le serveur qui héberge la fonction."
  - id: run
    text:
      en: The platform allocates compute resources and runs the code of the function.
      fr: La plateforme alloue des ressources de calcul et exécute le code de la fonction.
  - id: vm
    text:
      en: An administrator starts a virtual machine to host the function.
      fr: Un administrateur démarre une machine virtuelle pour héberger la fonction.
  - id: ev
    text:
      en: The upload of the image raises an event that triggers the function.
      fr: "Le chargement de l'image produit un événement qui déclenche la fonction."
  - id: rel
    text:
      en: The platform releases the compute resources when the function finishes.
      fr: La plateforme libère les ressources de calcul lorsque la fonction se termine.
  - id: size
    text:
      en: An administrator increases the size of the server to absorb the upload.
      fr: Un administrateur augmente la taille du serveur pour absorber le chargement.
answer:
  sequence:
  - ev
  - run
  - rel
explanation:
  correct:
    en: "Azure Functions is event-driven: an event, here the upload, wakes the function. The platform then allocates resources and runs the code, and it deallocates the resources automatically when the function finishes, which is why only the execution is billed."
    fr: "Azure Functions est piloté par les événements : un événement, ici le chargement, réveille la fonction. La plateforme alloue alors des ressources et exécute le code, puis elle libère automatiquement les ressources quand la fonction se termine ; c'est pourquoi seule l'exécution est facturée."
  options:
    os:
      en: In a serverless model, the cloud provider maintains the servers and their operating system.
      fr: "Dans un modèle serverless, le fournisseur de cloud entretient les serveurs et leur système d'exploitation."
    vm:
      en: "No virtual machine has to be started: the platform supplies the resources when the event occurs."
      fr: "Aucune machine virtuelle n'est à démarrer : la plateforme fournit les ressources lorsque l'événement se produit."
    size:
      en: Scaling is automatic in a serverless model; nobody resizes a server.
      fr: "La mise à l'échelle est automatique dans un modèle serverless ; personne ne redimensionne de serveur."
references:
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
