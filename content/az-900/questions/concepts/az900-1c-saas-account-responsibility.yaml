id: az900-1c-saas-account-responsibility
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware uses Microsoft 365 for email. An employee left the company six months ago, but the employee's account was never disabled and was later used to read company email.

    According to the shared responsibility model, who was responsible for removing the access of this account?
  fr: |
    Litware utilise Microsoft 365 pour sa messagerie. Un employé a quitté l'entreprise il y a six mois, mais son compte n'a jamais été désactivé et a servi plus tard à lire des e-mails de l'entreprise.

    Selon le modèle de responsabilité partagée, qui était responsable de la suppression de l'accès de ce compte ?
body:
  options:
    - id: a
      text: { en: "Microsoft, because the provider manages the whole application in a SaaS model", fr: "Microsoft, car le fournisseur gère toute l'application dans un modèle SaaS" }
    - id: b
      text: { en: "Litware, because the customer manages its user accounts in every service type", fr: "Litware, car le client gère ses comptes d'utilisateurs dans tous les types de services" }
    - id: c
      text: { en: "Microsoft, because the provider operates the service that authenticates the users", fr: "Microsoft, car le fournisseur exploite le service qui authentifie les utilisateurs" }
    - id: d
      text: { en: "Litware, because Microsoft 365 is an IaaS service that the customer administers", fr: "Litware, car Microsoft 365 est un service IaaS que le client administre" }
answer: { optionId: b }
explanation:
  correct:
    en: "Microsoft 365 is SaaS, the model in which the provider manages the most. Even so, the accounts and identities of the people in your environment always remain your responsibility: creating, managing and removing user access is the customer's job in IaaS, PaaS and SaaS alike."
    fr: "Microsoft 365 relève de SaaS, le modèle où le fournisseur gère le plus de choses. Pourtant, les comptes et les identités des personnes de votre environnement restent toujours sous votre responsabilité : créer, gérer et supprimer les accès des utilisateurs incombe au client, en IaaS comme en PaaS et en SaaS."
  options:
    a:
      en: "The provider maintains the application, but it does not decide which of the customer's users keep their access."
      fr: "Le fournisseur entretient l'application, mais il ne décide pas quels utilisateurs du client conservent leur accès."
    c:
      en: "The provider runs the authentication platform, but the customer manages its own users on it."
      fr: "Le fournisseur fait fonctionner la plateforme d'authentification, mais le client y gère ses propres utilisateurs."
    d:
      en: "Litware is responsible, but not for this reason: Microsoft 365 is a SaaS service, not an IaaS service."
      fr: "Litware est bien responsable, mais pas pour cette raison : Microsoft 365 est un service SaaS, pas un service IaaS."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
