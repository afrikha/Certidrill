id: az900-1a-global-reach
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs its online store from a single datacenter in Canada. The company wants to serve its customers in Europe and Asia from locations close to them, without building datacenters there.

    Which characteristic of cloud computing meets this need?
  fr: |
    Tailspin Toys exploite sa boutique en ligne depuis un seul centre de données au Canada. L'entreprise veut servir ses clients d'Europe et d'Asie depuis des emplacements proches d'eux, sans y construire de centres de données.

    Quelle caractéristique du cloud computing répond à ce besoin ?
body:
  options:
    - id: "a"
      text:
        en: "The shared responsibility model"
        fr: "Le modèle de responsabilité partagée"
    - id: "b"
      text:
        en: "The global reach of cloud platforms"
        fr: "La portée mondiale des plateformes cloud"
    - id: "c"
      text:
        en: "The private cloud model"
        fr: "Le modèle de cloud privé"
    - id: "d"
      text:
        en: "The consumption-based model"
        fr: "Le modèle basé sur la consommation"
answer:
  optionId: "b"
explanation:
  correct:
    en: "Cloud platforms offer global reach: a team can place services closer to its users without building several physical datacenters. Tailspin Toys can deploy its store in the provider's locations in Europe and Asia."
    fr: "Les plateformes cloud offrent une portée mondiale : une équipe peut placer des services plus près de ses utilisateurs sans construire plusieurs centres de données physiques. Tailspin Toys peut déployer sa boutique dans les emplacements du fournisseur en Europe et en Asie."
  options:
    a:
      en: "The shared responsibility model describes which party maintains and secures what; it does not determine where services can be placed."
      fr: "Le modèle de responsabilité partagée décrit quelle partie entretient et sécurise quoi ; il ne détermine pas où les services peuvent être placés."
    c:
      en: "A private cloud is dedicated to a single organization, which would need infrastructure of its own in each geography."
      fr: "Un cloud privé est dédié à une seule organisation, qui aurait besoin de sa propre infrastructure dans chaque zone géographique."
    d:
      en: "The consumption-based model describes how resources are paid for, not where they are located."
      fr: "Le modèle basé sur la consommation décrit la façon de payer les ressources, pas l'endroit où elles se trouvent."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
