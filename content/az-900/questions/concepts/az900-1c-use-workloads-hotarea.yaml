id: az900-1c-use-workloads-hotarea
objective: "1.3.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs the workloads shown in the following table.

    Answer each prompt by selecting the appropriate service in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute les charges de travail présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le service approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The service on which Contoso must install the operating system updates", fr: "Le service sur lequel Contoso doit installer les mises à jour du système d'exploitation" }
    - id: p2
      text: { en: "The service that Contoso consumes as software as a service (SaaS)", fr: "Le service que Contoso consomme en tant que SaaS (software as a service)" }
  grid:
    header: [{ en: "Workload", fr: "Charge de travail" }, { en: "Service", fr: "Service" }]
    rows:
      - [{ text: { en: "Customer website", fr: "Site web client" } }, { text: "Azure App Service", area: app }]
      - [{ text: { en: "Legacy inventory application", fr: "Application héritée de gestion des stocks" } }, { text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" }, area: vm }]
      - [{ text: { en: "Email and calendars", fr: "E-mail et calendriers" } }, { text: "Microsoft 365", area: m365 }]
      - [{ text: { en: "Order-processing code", fr: "Code de traitement des commandes" } }, { text: "Azure Functions", area: func }]
answer:
  values: { p1: vm, p2: m365 }
explanation:
  correct:
    en: "Azure Virtual Machines is IaaS: Contoso maintains each virtual machine, including the operating system updates. Azure App Service and Azure Functions are PaaS services in which Microsoft maintains the operating system. Microsoft 365 is a ready-made application that Contoso only uses: SaaS."
    fr: "Machines virtuelles Azure relève d'IaaS : Contoso entretient chaque machine virtuelle, mises à jour du système d'exploitation comprises. Azure App Service et Azure Functions sont des services PaaS dont Microsoft entretient le système d'exploitation. Microsoft 365 est une application toute faite que Contoso se contente d'utiliser : SaaS."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
  - title: Virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
