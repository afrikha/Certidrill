id: az900-1c-mgmt-tools-match
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Which management option should you use for each task? To answer, drag the appropriate options to the correct tasks. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelle option de gestion devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les options appropriées vers les tâches correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: template, text: { en: "A preconfigured template", fr: "Un modèle préconfiguré" } }
    - { id: portal, text: { en: "A web portal", fr: "Un portail web" } }
    - { id: alert, text: { en: "An automatic alert", fr: "Une alerte automatique" } }
    - { id: api, text: { en: "APIs", fr: "Des API" } }
    - { id: cli, text: { en: "A command-line interface", fr: "Une interface de ligne de commande" } }
  targets:
    - id: t1
      text: { en: "Create a resource by using a graphical interface in a browser", fr: "Créer une ressource au moyen d'une interface graphique dans un navigateur" }
    - id: t2
      text: { en: "Type commands in a terminal to manage resources", fr: "Saisir des commandes dans un terminal pour gérer des ressources" }
    - id: t3
      text: { en: "Let a custom application create and manage resources programmatically", fr: "Permettre à une application personnalisée de créer et de gérer des ressources par programmation" }
    - id: t4
      text: { en: "Deploy the same set of resources repeatedly without manual configuration", fr: "Déployer plusieurs fois le même ensemble de ressources sans configuration manuelle" }
answer:
  mapping: { t1: portal, t2: cli, t3: api, t4: template }
explanation:
  correct:
    en: "A web portal offers a graphical interface in the browser, a command-line interface accepts typed commands, and APIs let applications manage resources programmatically: these are ways of management in the cloud. A preconfigured template deploys resources repeatedly and removes the need for manual configuration."
    fr: "Un portail web offre une interface graphique dans le navigateur, une interface de ligne de commande reçoit des commandes saisies, et les API permettent aux applications de gérer les ressources par programmation : ce sont des moyens de gestion dans le cloud. Un modèle préconfiguré déploie les ressources de façon répétée et supprime le besoin de configuration manuelle."
  options:
    alert:
      en: "An automatic alert informs you when a configured metric reaches a value; it does not create or deploy resources."
      fr: "Une alerte automatique vous informe lorsqu'une métrique configurée atteint une valeur ; elle ne crée ni ne déploie de ressources."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
