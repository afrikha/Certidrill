id: az900-1b-sls-functions-logicapps
objective: "1.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To run a piece of code in response to an event, without managing any server, use [[code]].

      To automate a business workflow in a visual designer, with prebuilt connectors and little or no code, use [[flow]].
    fr: |
      Pour exécuter un morceau de code en réponse à un événement, sans gérer aucun serveur, utilisez [[code]].

      Pour automatiser un flux de travail métier dans un concepteur visuel, avec des connecteurs prédéfinis et peu ou pas de code, utilisez [[flow]].
  slots:
  - id: code
    options:
    - id: fn
      text: Azure Functions
    - id: la
      text: Azure Logic Apps
    - id: vm
      text:
        en: Azure Virtual Machines
        fr: Machines virtuelles Azure
  - id: flow
    options:
    - id: fn
      text: Azure Functions
    - id: la
      text: Azure Logic Apps
    - id: vm
      text:
        en: Azure Virtual Machines
        fr: Machines virtuelles Azure
answer:
  values:
    code: fn
    flow: la
explanation:
  correct:
    en: "Azure Functions is the serverless service for code: you write a function and an event triggers it. Azure Logic Apps automates workflows that you build in a graphical designer with prebuilt connectors, usually without writing code. Virtual machines are servers that you manage yourself, so they match neither sentence."
    fr: "Azure Functions est le service serverless destiné au code : vous écrivez une fonction et un événement la déclenche. Azure Logic Apps automatise des flux de travail que vous construisez dans un concepteur graphique avec des connecteurs prédéfinis, le plus souvent sans écrire de code. Les machines virtuelles sont des serveurs que vous gérez vous-même : elles ne correspondent à aucune des deux phrases."
references:
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
- title: What is Azure Logic Apps?
  url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-overview
