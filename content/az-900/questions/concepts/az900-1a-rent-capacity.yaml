id: az900-1a-rent-capacity
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam needs additional storage capacity for a six-week project.

    In cloud computing, how does Fabrikam obtain this capacity?
  fr: |
    Fabrikam a besoin de capacité de stockage supplémentaire pour un projet de six semaines.

    Dans le cloud computing, comment Fabrikam obtient-elle cette capacité ?
body:
  options:
    - id: "a"
      text:
        en: "It rents the capacity from a provider and releases it when the project ends."
        fr: "Elle loue la capacité à un fournisseur et la libère à la fin du projet."
    - id: "b"
      text:
        en: "It buys storage hardware from a provider and resells it when the project ends."
        fr: "Elle achète du matériel de stockage à un fournisseur et le revend à la fin du projet."
    - id: "c"
      text:
        en: "It asks a provider to install storage hardware in the Fabrikam datacenter."
        fr: "Elle demande à un fournisseur d'installer du matériel de stockage dans le centre de données de Fabrikam."
    - id: "d"
      text:
        en: "It buys a perpetual license for the capacity from a provider."
        fr: "Elle achète à un fournisseur une licence perpétuelle pour cette capacité."
answer:
  optionId: "a"
explanation:
  correct:
    en: "In cloud computing, you rent compute power and storage from a provider instead of buying and maintaining infrastructure, and you release the resources when you no longer need them. Fabrikam uses the storage for six weeks, then releases it."
    fr: "Dans le cloud computing, vous louez de la puissance de calcul et du stockage à un fournisseur au lieu d'acheter et d'entretenir une infrastructure, puis vous libérez les ressources quand vous n'en avez plus besoin. Fabrikam utilise le stockage pendant six semaines, puis le libère."
  options:
    b:
      en: "Buying hardware, even to resell it later, is a purchase of infrastructure and not the use of a cloud service."
      fr: "Acheter du matériel, même pour le revendre ensuite, est un achat d'infrastructure et non l'utilisation d'un service cloud."
    c:
      en: "Hardware installed in the Fabrikam datacenter is on-premises infrastructure that Fabrikam must host and run."
      fr: "Du matériel installé dans le centre de données de Fabrikam est une infrastructure locale que Fabrikam doit héberger et exploiter."
    d:
      en: "Cloud capacity is rented for the time it is used; it is not acquired through a perpetual license."
      fr: "La capacité cloud se loue pour la durée d'utilisation ; elle ne s'acquiert pas par une licence perpétuelle."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
