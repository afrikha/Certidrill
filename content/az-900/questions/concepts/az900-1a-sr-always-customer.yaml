id: az900-1a-sr-always-customer
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the shared responsibility model, which responsibility always remains with the customer, regardless of the cloud service type?
  fr: |
    Dans le modèle de responsabilité partagée, quelle responsabilité incombe toujours au client, quel que soit le type de service cloud ?
body:
  options:
    - id: "a"
      text:
        en: "The physical network"
        fr: "Le réseau physique"
    - id: "b"
      text:
        en: "The information and data"
        fr: "Les informations et les données"
    - id: "c"
      text:
        en: "The operating system"
        fr: "Le système d'exploitation"
    - id: "d"
      text:
        en: "The physical hosts"
        fr: "Les hôtes physiques"
answer:
  optionId: "b"
explanation:
  correct:
    en: "Whatever the service type, the customer is always responsible for the information and data stored in the cloud, for the devices allowed to connect, and for the accounts and identities. The physical layers always belong to the provider, and the operating system depends on the service type."
    fr: "Quel que soit le type de service, le client est toujours responsable des informations et des données stockées dans le cloud, des appareils autorisés à se connecter, ainsi que des comptes et des identités. Les couches physiques relèvent toujours du fournisseur, et le système d'exploitation dépend du type de service."
  options:
    a:
      en: "The physical network is always the cloud provider's responsibility."
      fr: "Le réseau physique relève toujours de la responsabilité du fournisseur de cloud."
    c:
      en: "The operating system is the customer's responsibility in IaaS, but the provider's in PaaS and SaaS."
      fr: "Le système d'exploitation relève du client en IaaS, mais du fournisseur en PaaS et en SaaS."
    d:
      en: "The physical hosts are always the cloud provider's responsibility."
      fr: "Les hôtes physiques relèvent toujours de la responsabilité du fournisseur de cloud."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
