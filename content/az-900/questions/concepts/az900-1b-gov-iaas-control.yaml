id: az900-1b-gov-iaas-control
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum must keep maximum control over the security of the servers of an application, including the choice of the moment at which operating system patches are installed.

    Which cloud service type should Adatum use?
  fr: |
    Adatum doit garder un contrôle maximal sur la sécurité des serveurs d'une application, y compris le choix du moment où les correctifs du système d'exploitation sont installés.

    Quel type de service cloud Adatum doit-elle utiliser ?
body:
  options:
  - id: a
    text:
      en: Software as a service (SaaS)
      fr: SaaS (software as a service)
  - id: b
    text:
      en: Platform as a service (PaaS)
      fr: PaaS (platform as a service)
  - id: c
    text:
      en: Infrastructure as a service (IaaS)
      fr: IaaS (infrastructure as a service)
  - id: d
    text:
      en: A serverless service
      fr: Un service serverless
answer:
  optionId: c
explanation:
  correct:
    en: With IaaS, the cloud provider supplies only the physical resources. You manage the operating systems and the installed software yourself, including patches and maintenance, which gives the maximum control over security.
    fr: "Avec IaaS, le fournisseur de cloud ne fournit que les ressources physiques. Vous gérez vous-même les systèmes d'exploitation et les logiciels installés, correctifs et maintenance compris, ce qui donne le contrôle maximal sur la sécurité."
  options:
    a:
      en: With SaaS, the provider manages everything up to the application; the customer has no access to the servers.
      fr: "Avec SaaS, le fournisseur gère tout jusqu'à l'application ; le client n'a aucun accès aux serveurs."
    b:
      en: With PaaS, the provider manages the operating system and applies its patches automatically.
      fr: "Avec PaaS, le fournisseur gère le système d'exploitation et applique automatiquement ses correctifs."
    d:
      en: With a serverless service, the customer supplies only code; the servers and their patches belong to the provider.
      fr: Avec un service serverless, le client ne fournit que du code ; les serveurs et leurs correctifs relèvent du fournisseur.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
