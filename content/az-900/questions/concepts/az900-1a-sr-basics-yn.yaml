id: az900-1a-sr-basics-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "The cloud provider is responsible for the power and cooling of its datacenters."
        fr: "Le fournisseur de cloud est responsable de l'alimentation électrique et du refroidissement de ses centres de données."
    - id: "s2"
      text:
        en: "A company that uses only software as a service (SaaS) applications has no security responsibility."
        fr: "Une entreprise qui n'utilise que des applications SaaS (software as a service) n'a aucune responsabilité en matière de sécurité."
    - id: "s3"
      text:
        en: "Granting access to cloud data only to the people who need it is the responsibility of the cloud provider."
        fr: "Accorder l'accès aux données dans le cloud aux seules personnes qui en ont besoin relève de la responsabilité du fournisseur de cloud."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: "The provider handles what is tied to its datacenters: physical security, power, cooling and network connectivity. The customer always keeps responsibilities, even with SaaS: its data, and access security, which means giving access only to the people who need it."
    fr: "Le fournisseur prend en charge ce qui est lié à ses centres de données : sécurité physique, alimentation électrique, refroidissement et connectivité réseau. Le client conserve toujours des responsabilités, même en SaaS : ses données, et la sécurité des accès, c'est-à-dire n'accorder l'accès qu'aux personnes qui en ont besoin."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
