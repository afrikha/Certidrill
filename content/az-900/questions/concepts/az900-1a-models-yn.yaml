id: az900-1a-models-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "A public cloud is built, controlled and maintained by a third-party cloud provider."
        fr: "Un cloud public est construit, contrôlé et entretenu par un fournisseur de cloud tiers."
    - id: "s2"
      text:
        en: "In a public cloud, the customer has complete control over resources and security."
        fr: "Dans un cloud public, le client a un contrôle total sur les ressources et la sécurité."
    - id: "s3"
      text:
        en: "In a hybrid cloud, the organization determines where to run each of its applications."
        fr: "Dans un cloud hybride, l'organisation détermine où exécuter chacune de ses applications."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "A public cloud is built, controlled and maintained by a third-party cloud provider; in return, the customer does not have complete control over resources and security, which is a characteristic of the private cloud. A hybrid cloud provides the most flexibility: the organization determines where to run each application."
    fr: "Un cloud public est construit, contrôlé et entretenu par un fournisseur de cloud tiers ; en contrepartie, le client n'a pas un contrôle total sur les ressources et la sécurité, ce qui caractérise le cloud privé. Un cloud hybride offre la plus grande flexibilité : l'organisation détermine où exécuter chaque application."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
