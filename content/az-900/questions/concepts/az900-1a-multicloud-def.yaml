id: az900-1a-multicloud-def
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which term describes an environment in which an organization uses multiple public cloud providers?
  fr: |
    Quel terme désigne un environnement dans lequel une organisation utilise plusieurs fournisseurs de cloud public ?
body:
  options:
    - id: "a"
      text:
        en: "Hybrid cloud"
        fr: "Cloud hybride"
    - id: "b"
      text:
        en: "Private cloud"
        fr: "Cloud privé"
    - id: "c"
      text: "Multicloud"
    - id: "d"
      text:
        en: "On-premises datacenter"
        fr: "Centre de données local"
answer:
  optionId: "c"
explanation:
  correct:
    en: "In a multicloud scenario, an organization uses multiple public cloud providers, for example to use different features from each of them or while it migrates from one provider to another. It then manages resources and security in each of these environments."
    fr: "Dans un scénario multicloud, une organisation utilise plusieurs fournisseurs de cloud public, par exemple pour profiter de fonctionnalités différentes chez chacun ou pendant une migration d'un fournisseur vers un autre. Elle gère alors les ressources et la sécurité dans chacun de ces environnements."
  options:
    a:
      en: "A hybrid cloud interconnects a public cloud and a private cloud; it does not require several public providers."
      fr: "Un cloud hybride interconnecte un cloud public et un cloud privé ; il n'exige pas plusieurs fournisseurs publics."
    b:
      en: "A private cloud is used by a single entity; the term does not describe the use of several public providers."
      fr: "Un cloud privé est utilisé par une seule entité ; le terme ne décrit pas l'utilisation de plusieurs fournisseurs publics."
    d:
      en: "An on-premises datacenter is infrastructure that the organization owns and runs itself."
      fr: "Un centre de données local est une infrastructure que l'organisation possède et exploite elle-même."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
