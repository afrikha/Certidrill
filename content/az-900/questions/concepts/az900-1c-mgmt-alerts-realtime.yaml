id: az900-1c-mgmt-alerts-realtime
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation wants its operations team to be informed in real time when the response time of a cloud application exceeds a defined value. The team will then decide what to do.

    Which cloud capability should Adatum use?
  fr: |
    Adatum Corporation veut que son équipe d'exploitation soit informée en temps réel lorsque le temps de réponse d'une application cloud dépasse une valeur définie. L'équipe décidera ensuite de ce qu'il faut faire.

    Quelle capacité du cloud Adatum doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Deployment based on a preconfigured template", fr: "Le déploiement à partir d'un modèle préconfiguré" }
    - id: b
      text: { en: "Automatic replacement of failing resources", fr: "Le remplacement automatique des ressources défaillantes" }
    - id: c
      text: { en: "Automatic scaling based on need", fr: "La mise à l'échelle automatique selon les besoins" }
    - id: d
      text: { en: "Automatic alerts based on configured metrics", fr: "Les alertes automatiques fondées sur des métriques configurées" }
answer: { optionId: d }
explanation:
  correct:
    en: "In the cloud you can receive automatic alerts based on metrics that you configure, so that you are aware of performance in real time. That is exactly the need: be informed when a metric crosses a value."
    fr: "Dans le cloud, vous pouvez recevoir des alertes automatiques fondées sur des métriques que vous configurez, afin de connaître les performances en temps réel. C'est exactement le besoin : être informé lorsqu'une métrique franchit une valeur."
  options:
    a:
      en: "A template standardizes how resources are deployed; it does not report the performance of a running application."
      fr: "Un modèle standardise le déploiement des ressources ; il ne signale pas les performances d'une application en cours d'exécution."
    b:
      en: "Automatic replacement concerns resources that fail; it does not report that a metric has crossed a value."
      fr: "Le remplacement automatique concerne les ressources défaillantes ; il ne signale pas qu'une métrique a franchi une valeur."
    c:
      en: "Automatic scaling changes the resources by itself; Adatum wants to be informed and to decide afterwards."
      fr: "La mise à l'échelle automatique modifie d'elle-même les ressources ; Adatum veut être informée puis décider."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
