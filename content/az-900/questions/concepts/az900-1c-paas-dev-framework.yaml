id: az900-1c-paas-dev-framework
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team at Litware plans to use PaaS as its development framework.

    Which benefit does PaaS provide to the developers?
  fr: |
    Une équipe de développement de Litware prévoit d'utiliser PaaS comme framework de développement.

    Quel avantage PaaS apporte-t-il aux développeurs ?
body:
  options:
    - id: a
      text: { en: "Built-in components and cloud features reduce the amount of code to write.", fr: "Des composants intégrés et des fonctionnalités cloud réduisent la quantité de code à écrire." }
    - id: b
      text: { en: "Full control of the operating system allows any software to be installed.", fr: "Le contrôle complet du système d'exploitation permet d'installer n'importe quel logiciel." }
    - id: c
      text: { en: "A finished application removes the need for any development work.", fr: "Une application finie supprime le besoin de tout travail de développement." }
    - id: d
      text: { en: "Rented hardware can be configured exactly like the on-premises servers.", fr: "Le matériel loué peut être configuré exactement comme les serveurs locaux." }
answer: { optionId: a }
explanation:
  correct:
    en: "As a development framework, PaaS lets developers build on built-in software components. Cloud features such as scalability, high availability and multitenant capability are included, which reduces the amount of coding."
    fr: "En tant que framework de développement, PaaS permet aux développeurs de s'appuyer sur des composants logiciels intégrés. Des fonctionnalités cloud comme la scalabilité, la haute disponibilité et la multilocation sont incluses, ce qui réduit la quantité de code à écrire."
  options:
    b:
      en: "Full control of the operating system is what IaaS offers; with PaaS the provider maintains the operating system."
      fr: "Le contrôle complet du système d'exploitation est ce qu'offre IaaS ; avec PaaS, le fournisseur entretient le système d'exploitation."
    c:
      en: "A finished, ready-to-use application describes SaaS; with PaaS the team still writes its application."
      fr: "Une application finie et prête à l'emploi décrit SaaS ; avec PaaS, l'équipe écrit toujours son application."
    d:
      en: "Renting hardware and configuring it like on-premises servers describes IaaS."
      fr: "Louer du matériel et le configurer comme des serveurs locaux décrit IaaS."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
