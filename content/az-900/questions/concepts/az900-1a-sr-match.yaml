id: az900-1a-sr-match
objective: "1.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are presenting the shared responsibility model to your team.

    Who is responsible for each area? To answer, drag the appropriate answer to each responsibility area. Each answer may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous présentez le modèle de responsabilité partagée à votre équipe.

    Qui est responsable de chaque domaine ? Pour répondre, faites glisser la réponse appropriée vers chaque domaine de responsabilité. Chaque réponse peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: "cust"
      text:
        en: "Always the customer"
        fr: "Toujours le client"
    - id: "prov"
      text:
        en: "Always the cloud provider"
        fr: "Toujours le fournisseur de cloud"
    - id: "dep"
      text:
        en: "Depends on the service type"
        fr: "Dépend du type de service"
  targets:
    - id: "os"
      text:
        en: "Operating systems"
        fr: "Systèmes d'exploitation"
    - id: "hosts"
      text:
        en: "Physical hosts"
        fr: "Hôtes physiques"
    - id: "acct"
      text:
        en: "Accounts and identities"
        fr: "Comptes et identités"
    - id: "nc"
      text:
        en: "Network controls"
        fr: "Contrôles réseau"
answer:
  mapping:
    os: "dep"
    hosts: "prov"
    acct: "cust"
    nc: "dep"
explanation:
  correct:
    en: "Operating systems and network controls depend on the service type: for example, the customer manages the operating system in IaaS, whereas the provider manages it in PaaS and SaaS. The physical hosts, like the physical network and the physical datacenter, are always the provider's responsibility. The accounts and identities are always the customer's responsibility."
    fr: "Les systèmes d'exploitation et les contrôles réseau dépendent du type de service : par exemple, le client gère le système d'exploitation en IaaS, alors que le fournisseur le gère en PaaS et en SaaS. Les hôtes physiques, comme le réseau physique et le centre de données physique, relèvent toujours du fournisseur. Les comptes et les identités relèvent toujours du client."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
