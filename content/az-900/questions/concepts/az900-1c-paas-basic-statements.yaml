id: az900-1c-paas-basic-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With PaaS, the cloud provider handles the licensing and patching of the operating systems."
        fr: "Avec PaaS, le fournisseur de cloud se charge des licences et des correctifs des systèmes d'exploitation."
    - id: s2
      text:
        en: "PaaS provides a complete development environment that the provider maintains."
        fr: "PaaS fournit un environnement de développement complet que le fournisseur entretient."
    - id: s3
      text:
        en: "With PaaS, the cloud provider is responsible for the data that your application stores."
        fr: "Avec PaaS, le fournisseur de cloud est responsable des données que votre application stocke."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "In a PaaS scenario you do not have to worry about the licensing or patching of operating systems and databases, and you get a complete development environment without maintaining the development infrastructure. The information and data stored in the cloud always remain the customer's responsibility, whatever the service type."
    fr: "Dans un scénario PaaS, vous n'avez pas à vous soucier des licences ni des correctifs des systèmes d'exploitation et des bases de données, et vous disposez d'un environnement de développement complet sans entretenir l'infrastructure de développement. Les informations et les données stockées dans le cloud restent toujours sous la responsabilité du client, quel que soit le type de service."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
