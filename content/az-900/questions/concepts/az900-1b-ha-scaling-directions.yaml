id: az900-1b-ha-scaling-directions
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[v]] changes the capabilities of an existing resource, such as its CPU or memory, whereas [[h]] changes the number of resources.
    fr: |
      [[v]] change les capacités d'une ressource existante, comme son processeur ou sa mémoire, alors que [[h]] change le nombre de ressources.
  slots:
  - id: v
    options:
    - id: ha
      text:
        en: High availability
        fr: La haute disponibilité
    - id: hs
      text:
        en: Horizontal scaling
        fr: "La mise à l'échelle horizontale"
    - id: vs
      text:
        en: Vertical scaling
        fr: "La mise à l'échelle verticale"
  - id: h
    options:
    - id: ha
      text:
        en: High availability
        fr: La haute disponibilité
    - id: hs
      text:
        en: Horizontal scaling
        fr: "La mise à l'échelle horizontale"
    - id: vs
      text:
        en: Vertical scaling
        fr: "La mise à l'échelle verticale"
answer:
  values:
    v: vs
    h: hs
explanation:
  correct:
    en: "Vertical scaling increases or decreases the capabilities of a resource: you scale up by adding CPUs or memory to a virtual machine and scale down by removing some. Horizontal scaling adds or removes resources: you scale out by adding virtual machines or containers and scale in by removing some. High availability isn't a kind of scaling."
    fr: "La mise à l'échelle verticale augmente ou diminue les capacités d'une ressource : le scale-up ajoute des processeurs ou de la mémoire à une machine virtuelle, le scale-down en retire. La mise à l'échelle horizontale ajoute ou retire des ressources : le scale-out ajoute des machines virtuelles ou des conteneurs, le scale-in en retire. La haute disponibilité n'est pas un type de mise à l'échelle."
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
