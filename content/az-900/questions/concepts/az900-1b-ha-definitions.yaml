id: az900-1b-ha-definitions
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each term to its definition. To answer, drag the appropriate terms to the correct definitions. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque terme à sa définition. Pour répondre, faites glisser les termes appropriés vers les définitions correspondantes. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: pred
    text:
      en: Predictability
      fr: Prévisibilité
  - id: sla
    text:
      en: Service-level agreement (SLA)
      fr: Contrat de niveau de service (SLA)
  - id: scal
    text:
      en: Scalability
      fr: Scalabilité
  - id: gov
    text:
      en: Governance
      fr: Gouvernance
  - id: ha
    text:
      en: High availability
      fr: Haute disponibilité
  targets:
  - id: t1
    text:
      en: Resources are available when they are needed, regardless of disruptions.
      fr: Les ressources sont disponibles quand on en a besoin, quelles que soient les perturbations.
  - id: t2
    text:
      en: Resources are adjusted to meet demand.
      fr: Les ressources sont ajustées pour répondre à la demande.
  - id: t3
    text:
      en: A document that states the uptime guaranteed for a service.
      fr: Un document qui énonce le temps de fonctionnement garanti pour un service.
answer:
  mapping:
    t1: ha
    t2: scal
    t3: sla
explanation:
  correct:
    en: High availability focuses on maximum availability whatever the disruptions. Scalability is the ability to adjust resources to meet demand. The uptime guarantees of Azure services are part of their service-level agreements (SLAs).
    fr: La haute disponibilité vise une disponibilité maximale quelles que soient les perturbations. La scalabilité est la capacité à ajuster les ressources à la demande. Les garanties de temps de fonctionnement des services Azure font partie de leurs contrats de niveau de service (SLA).
  options:
    pred:
      en: Predictability is about knowing in advance the performance and the cost of a solution.
      fr: "La prévisibilité consiste à connaître à l'avance les performances et le coût d'une solution."
    gov:
      en: Governance is about complying with corporate standards and regulations.
      fr: "La gouvernance concerne le respect des normes de l'entreprise et de la réglementation."
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
