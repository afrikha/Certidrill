id: az900-1c-iaas-provider-task
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company runs its workloads in an infrastructure as a service (IaaS) model.

    Which task is the cloud provider responsible for?
  fr: |
    Votre entreprise exécute ses charges de travail dans un modèle IaaS (infrastructure as a service).

    De quelle tâche le fournisseur de cloud est-il responsable ?
body:
  options:
    - id: a
      text: { en: "Maintaining the physical hardware in the datacenter", fr: "Entretenir le matériel physique du centre de données" }
    - id: b
      text: { en: "Installing the updates of the operating system", fr: "Installer les mises à jour du système d'exploitation" }
    - id: c
      text: { en: "Configuring the databases used by the workloads", fr: "Configurer les bases de données utilisées par les charges de travail" }
    - id: d
      text: { en: "Configuring the network settings of the workloads", fr: "Configurer les paramètres réseau des charges de travail" }
answer: { optionId: a }
explanation:
  correct:
    en: "In an IaaS model, the cloud provider is responsible for maintaining the hardware, the network connectivity to the internet and the physical security. You essentially rent hardware in a cloud datacenter and manage everything you put on it."
    fr: "Dans un modèle IaaS, le fournisseur de cloud est responsable de l'entretien du matériel, de la connectivité réseau à Internet et de la sécurité physique. Vous louez en quelque sorte du matériel dans un centre de données cloud et gérez tout ce que vous y installez."
  options:
    b:
      en: "Operating system installation, configuration and maintenance are the customer's responsibility with IaaS."
      fr: "L'installation, la configuration et la maintenance du système d'exploitation incombent au client avec IaaS."
    c:
      en: "Database and storage configuration is part of what the customer manages with IaaS."
      fr: "La configuration des bases de données et du stockage fait partie de ce que le client gère avec IaaS."
    d:
      en: "Network configuration of the workloads is also the customer's task; the provider only maintains the physical network."
      fr: "La configuration réseau des charges de travail incombe aussi au client ; le fournisseur n'entretient que le réseau physique."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
