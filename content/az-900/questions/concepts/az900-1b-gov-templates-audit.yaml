id: az900-1b-gov-templates-audit
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[tpl]] help to ensure that all the resources that you deploy meet corporate standards, and [[audit]] flags the resources that are out of compliance with those standards.
    fr: |
      [[tpl]] aident à garantir que toutes les ressources que vous déployez respectent les normes de l'entreprise, et [[audit]] signale les ressources qui ne sont pas conformes à ces normes.
  slots:
  - id: tpl
    options:
    - id: lb
      text:
        en: Load balancers
        fr: Les équilibreurs de charge
    - id: tp
      text:
        en: Templates
        fr: Les modèles
    - id: rs
      text:
        en: Reservations
        fr: Les réservations
  - id: audit
    options:
    - id: as
      text:
        en: autoscaling
        fr: "la mise à l'échelle automatique"
    - id: pc
      text:
        en: the pricing calculator
        fr: la calculatrice de prix
    - id: au
      text:
        en: cloud-based auditing
        fr: "l'audit basé sur le cloud"
answer:
  values:
    tpl: tp
    audit: au
explanation:
  correct:
    en: Governance in the cloud relies on two complementary tools. Set templates make deployed resources meet corporate standards and regulatory requirements from the start. Cloud-based auditing then flags any resource that is out of compliance and provides mitigation strategies.
    fr: "La gouvernance dans le cloud repose sur deux outils complémentaires. Des modèles définis font que les ressources déployées respectent dès le départ les normes de l'entreprise et les exigences réglementaires. L'audit basé sur le cloud signale ensuite toute ressource non conforme et propose des stratégies d'atténuation."
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Overview of Azure Policy
  url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
