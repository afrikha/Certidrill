id: az900-1c-use-web-app-no-servers
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at Fabrikam are building a custom web application. They want to deploy their code and let the cloud provider maintain the operating system and the middleware.

    Which cloud service type should Fabrikam use?
  fr: |
    Les développeurs de Fabrikam créent une application web personnalisée. Ils veulent déployer leur code et laisser le fournisseur de cloud entretenir le système d'exploitation et les intergiciels.

    Quel type de service cloud Fabrikam doit-elle utiliser ?
body:
  options:
    - id: a
      text: "Infrastructure as a service (IaaS)"
    - id: b
      text: "Platform as a service (PaaS)"
    - id: c
      text: "Software as a service (SaaS)"
answer: { optionId: b }
explanation:
  correct:
    en: "With PaaS, the provider maintains the operating systems, the middleware and the development tools, and the customer focuses on its application code and data. That matches a team that writes its own application but does not want to maintain the servers under it."
    fr: "Avec PaaS, le fournisseur entretient les systèmes d'exploitation, les intergiciels et les outils de développement, et le client se concentre sur le code de son application et sur ses données. Cela correspond à une équipe qui écrit sa propre application mais ne veut pas entretenir les serveurs qui la portent."
  options:
    a:
      en: "With IaaS, Fabrikam would have to install, configure and patch the operating system itself."
      fr: "Avec IaaS, Fabrikam devrait installer et configurer elle-même le système d'exploitation, puis y appliquer les correctifs."
    c:
      en: "SaaS delivers a finished application; it does not host an application that the developers write."
      fr: "SaaS livre une application finie ; il n'héberge pas une application écrite par les développeurs."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
