id: az900-1c-saas-provider-task
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses a SaaS collaboration application.

    Which task is the SaaS provider responsible for?
  fr: |
    Wingtip Toys utilise une application de collaboration SaaS.

    De quelle tâche le fournisseur SaaS est-il responsable ?
body:
  options:
    - id: a
      text: { en: "Creating and removing the user accounts of the employees", fr: "Créer et supprimer les comptes d'utilisateurs des employés" }
    - id: b
      text: { en: "Applying updates to the application", fr: "Appliquer les mises à jour de l'application" }
    - id: c
      text: { en: "Classifying the data that the employees store", fr: "Classifier les données que les employés stockent" }
    - id: d
      text: { en: "Protecting the devices that the employees connect with", fr: "Protéger les appareils avec lesquels les employés se connectent" }
answer: { optionId: b }
explanation:
  correct:
    en: "With SaaS, the provider manages almost the entire stack: infrastructure patching, application updates and availability. The customer concentrates on user onboarding, access controls and data governance."
    fr: "Avec SaaS, le fournisseur gère presque toute la pile : mise à jour corrective de l'infrastructure, mises à jour de l'application et disponibilité. Le client se concentre sur l'intégration des utilisateurs, les contrôles d'accès et la gouvernance des données."
  options:
    a:
      en: "Accounts and identities remain the customer's responsibility in every service type."
      fr: "Les comptes et les identités restent sous la responsabilité du client dans tous les types de services."
    c:
      en: "The customer is always responsible for its information and data, including their classification."
      fr: "Le client est toujours responsable de ses informations et de ses données, y compris de leur classification."
    d:
      en: "The devices that connect to the cloud service remain the customer's responsibility."
      fr: "Les appareils qui se connectent au service cloud restent sous la responsabilité du client."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
