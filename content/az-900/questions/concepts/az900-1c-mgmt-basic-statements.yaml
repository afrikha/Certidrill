id: az900-1c-mgmt-basic-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Cloud resources can be managed only through a web portal."
        fr: "Les ressources cloud peuvent être gérées uniquement au moyen d'un portail web."
    - id: s2
      text:
        en: "Deploying resources from a preconfigured template removes the need for manual configuration."
        fr: "Le déploiement de ressources à partir d'un modèle préconfiguré supprime le besoin de configuration manuelle."
    - id: s3
      text:
        en: "When a resource fails in the cloud, an administrator must always replace it manually."
        fr: "Lorsqu'une ressource défaille dans le cloud, un administrateur doit toujours la remplacer manuellement."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "A web portal is one option among several: you can also use a command-line interface, APIs or PowerShell. Deploying from a preconfigured template removes manual configuration. The cloud can monitor the health of resources and automatically replace the ones that fail."
    fr: "Un portail web est une option parmi d'autres : vous pouvez aussi utiliser une interface de ligne de commande, des API ou PowerShell. Le déploiement à partir d'un modèle préconfiguré supprime la configuration manuelle. Le cloud peut surveiller l'intégrité des ressources et remplacer automatiquement celles qui défaillent."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
