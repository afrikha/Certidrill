id: az900-1c-mgmt-in-cloud-sentence
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Management in the cloud refers to [[what]]. An example is [[example]].
    fr: |
      La gestion dans le cloud désigne [[what]]. Un exemple en est [[example]].
  slots:
    - id: what
      options:
        - { id: provider, text: { en: "how the cloud provider secures its datacenters", fr: "la façon dont le fournisseur de cloud sécurise ses centres de données" } }
        - { id: manage, text: { en: "how you manage your cloud environment and resources", fr: "la façon dont vous gérez votre environnement et vos ressources cloud" } }
        - { id: cost, text: { en: "how the cost of your cloud resources is forecast", fr: "la façon dont le coût de vos ressources cloud est prévu" } }
    - id: example
      options:
        - { id: scale, text: { en: "automatic scaling based on need", fr: "la mise à l'échelle automatique selon les besoins" } }
        - { id: replace, text: { en: "the automatic replacement of failing resources", fr: "le remplacement automatique des ressources défaillantes" } }
        - { id: cli, text: { en: "the use of a command-line interface", fr: "l'utilisation d'une interface de ligne de commande" } }
answer:
  values: { what: manage, example: cli }
explanation:
  correct:
    en: "Management in the cloud describes how you are able to manage your cloud environment and resources: through a web portal, a command-line interface, APIs or PowerShell. Automatic scaling and the automatic replacement of failing resources are examples of the other kind of manageability, management of the cloud."
    fr: "La gestion dans le cloud décrit la façon dont vous pouvez gérer votre environnement et vos ressources cloud : au moyen d'un portail web, d'une interface de ligne de commande, d'API ou de PowerShell. La mise à l'échelle automatique et le remplacement automatique des ressources défaillantes sont des exemples de l'autre forme de facilité de gestion, la gestion du cloud."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
