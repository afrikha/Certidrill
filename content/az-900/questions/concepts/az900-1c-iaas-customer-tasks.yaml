id: az900-1c-iaas-customer-tasks
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your company runs a line-of-business application on Azure virtual machines.

    Which two tasks is your company responsible for?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise exécute une application métier sur des machines virtuelles Azure.

    Quelles sont les deux tâches dont votre entreprise est responsable ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replacing failed disks in the physical host servers", fr: "Remplacer les disques défaillants des serveurs hôtes physiques" } }
    - { id: b, text: { en: "Installing operating system updates on the virtual machines", fr: "Installer les mises à jour du système d'exploitation sur les machines virtuelles" } }
    - { id: c, text: { en: "Controlling physical access to the datacenter", fr: "Contrôler l'accès physique au centre de données" } }
    - { id: d, text: { en: "Configuring the database software installed on the virtual machines", fr: "Configurer le logiciel de base de données installé sur les machines virtuelles" } }
    - { id: e, text: { en: "Maintaining the datacenter's connection to the internet", fr: "Entretenir la connexion du centre de données à Internet" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Virtual machines are IaaS: you are responsible for the operating system (installation, configuration, maintenance) and for the database and storage configuration, as well as for the software you install. The provider keeps the hardware, the internet connectivity and the physical security."
    fr: "Les machines virtuelles relèvent d'IaaS : vous êtes responsable du système d'exploitation (installation, configuration, maintenance) et de la configuration des bases de données et du stockage, ainsi que des logiciels que vous installez. Le fournisseur conserve le matériel, la connectivité à Internet et la sécurité physique."
  options:
    a:
      en: "The physical hosts and their components are always maintained by the cloud provider."
      fr: "Les hôtes physiques et leurs composants sont toujours entretenus par le fournisseur de cloud."
    c:
      en: "Physical security of the datacenter is always the cloud provider's responsibility."
      fr: "La sécurité physique du centre de données incombe toujours au fournisseur de cloud."
    e:
      en: "Network connectivity of the datacenter to the internet is maintained by the provider in an IaaS model."
      fr: "La connectivité réseau du centre de données à Internet est entretenue par le fournisseur dans un modèle IaaS."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
