id: az900-1a-sr-database-dd
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores its order data in a SQL database.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke les données de ses commandes dans une base de données SQL.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: "text"
  template:
    en: "If Fabrikam uses a cloud SQL database that the provider manages (PaaS), the provider is responsible for [[paas]], and Fabrikam remains responsible for [[cust]].\n\nIf Fabrikam installs SQL Server on a virtual machine (IaaS), the database patches and updates are the responsibility of [[iaas]]."
    fr: "Si Fabrikam utilise une base de données SQL cloud gérée par le fournisseur (PaaS), le fournisseur est responsable [[paas]], et Fabrikam reste responsable [[cust]].\n\nSi Fabrikam installe SQL Server sur une machine virtuelle (IaaS), les correctifs et les mises à jour de la base de données relèvent de la responsabilité [[iaas]]."
  slots:
    - id: "paas"
      options:
        - id: "data"
          text:
            en: "the data ingested into the database"
            fr: "des données ingérées dans la base de données"
        - id: "acct"
          text:
            en: "the accounts of Fabrikam's employees"
            fr: "des comptes des employés de Fabrikam"
        - id: "dbsw"
          text:
            en: "the maintenance of the database itself"
            fr: "de la maintenance de la base de données elle-même"
    - id: "cust"
      options:
        - id: "data"
          text:
            en: "the data ingested into the database"
            fr: "des données ingérées dans la base de données"
        - id: "hosts"
          text:
            en: "the physical hosts"
            fr: "des hôtes physiques"
        - id: "pnet"
          text:
            en: "the physical network"
            fr: "du réseau physique"
    - id: "iaas"
      options:
        - id: "prov"
          text:
            en: "the cloud provider"
            fr: "du fournisseur de cloud"
        - id: "fab"
          text:
            en: "Fabrikam"
            fr: "de Fabrikam"
        - id: "provreq"
          text:
            en: "the cloud provider, on request"
            fr: "du fournisseur de cloud, sur demande"
answer:
  values:
    paas: "dbsw"
    cust: "data"
    iaas: "fab"
explanation:
  correct:
    en: "With a cloud SQL database managed by the provider, the provider maintains the database itself, but the customer remains responsible for the data ingested into it. If the customer deploys a virtual machine and installs SQL Server on it, the customer is responsible for the database patches and updates, in addition to the data."
    fr: "Avec une base de données SQL cloud gérée par le fournisseur, celui-ci assure la maintenance de la base de données elle-même, mais le client reste responsable des données qu'il y ingère. Si le client déploie une machine virtuelle et y installe SQL Server, il est responsable des correctifs et des mises à jour de la base de données, en plus des données."
  options:
    hosts:
      en: "The physical hosts are always the provider's responsibility."
      fr: "Les hôtes physiques relèvent toujours de la responsabilité du fournisseur."
    pnet:
      en: "The physical network is always the provider's responsibility."
      fr: "Le réseau physique relève toujours de la responsabilité du fournisseur."
    prov:
      en: "On a virtual machine, the provider maintains the physical layers only; the software that the customer installs is the customer's responsibility."
      fr: "Sur une machine virtuelle, le fournisseur n'assure la maintenance que des couches physiques ; les logiciels installés par le client relèvent du client."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
