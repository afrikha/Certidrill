id: az900-1b-ha-yn-scaling
objective: "1.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Horizontal scaling can be done manually as well as automatically.
      fr: "La mise à l'échelle horizontale peut se faire manuellement aussi bien qu'automatiquement."
  - id: s2
    text:
      en: Scaling down means removing virtual machines from a group of virtual machines.
      fr: "Le scale-down consiste à retirer des machines virtuelles d'un groupe de machines virtuelles."
  - id: s3
    text:
      en: An application that scales out during traffic peaks is thereby protected against the failure of its Azure region.
      fr: Une application qui effectue un scale-out pendant les pics de trafic est de ce fait protégée contre la défaillance de sa région Azure.
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: "Horizontal scaling adds or removes resources, such as virtual machines or containers, automatically or manually. Scaling up and down are the two directions of vertical scaling: they change the capabilities of a resource, not the number of resources. Scalability handles demand; it doesn't keep an application running when its region fails."
    fr: "La mise à l'échelle horizontale ajoute ou retire des ressources, comme des machines virtuelles ou des conteneurs, automatiquement ou manuellement. Le scale-up et le scale-down sont les deux sens de la mise à l'échelle verticale : ils changent les capacités d'une ressource, pas le nombre de ressources. La scalabilité absorbe la demande ; elle ne maintient pas une application en service quand sa région défaille."
  options:
    s2:
      en: Removing virtual machines is scaling in (horizontal). Scaling down lowers the CPU or memory of a resource (vertical).
      fr: "Retirer des machines virtuelles est un scale-in (horizontal). Le scale-down réduit le processeur ou la mémoire d'une ressource (vertical)."
    s3:
      en: Adding instances in a region handles more load, but all the instances are lost if the region fails. Surviving that failure requires resources in another region.
      fr: Ajouter des instances dans une région absorbe plus de charge, mais toutes les instances sont perdues si la région défaille. Survivre à cette défaillance demande des ressources dans une autre région.
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
