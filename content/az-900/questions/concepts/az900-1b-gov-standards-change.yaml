id: az900-1b-gov-standards-change
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware deploys all its cloud environments from templates that contain its technical standards. A new regulation changes one of the standards.

    What does this way of working allow Proseware to do?
  fr: |
    Proseware déploie tous ses environnements cloud à partir de modèles qui contiennent ses normes techniques. Une nouvelle réglementation modifie l'une de ces normes.

    Que permet cette façon de travailler à Proseware ?
body:
  options:
  - id: a
    text:
      en: Update the templates, then update the deployed resources at scale
      fr: Mettre à jour les modèles, puis mettre à jour à grande échelle les ressources déployées
  - id: b
    text:
      en: Transfer the responsibility for compliance to the cloud provider
      fr: Transférer la responsabilité de la conformité au fournisseur de cloud
  - id: c
    text:
      en: Keep the deployed resources unchanged until their reservation expires
      fr: "Conserver les ressources déployées en l'état jusqu'à l'expiration de leur réservation"
  - id: d
    text:
      en: Scale out the resources so that the new instances comply
      fr: Effectuer un scale-out des ressources pour que les nouvelles instances soient conformes
answer:
  optionId: a
explanation:
  correct:
    en: "Templates help to make every deployed resource meet corporate standards and regulatory requirements. When a standard changes, you update the template and can update all the deployed resources to the new standard at scale: this is a governance benefit of the cloud."
    fr: "Les modèles aident à faire respecter les normes de l'entreprise et les exigences réglementaires par chaque ressource déployée. Quand une norme change, vous mettez à jour le modèle et pouvez mettre à jour à grande échelle toutes les ressources déployées : c'est un avantage de gouvernance du cloud."
  options:
    b:
      en: The customer stays responsible for the compliance of what it deploys; the cloud only provides tools for it.
      fr: "Le client reste responsable de la conformité de ce qu'il déploie ; le cloud ne lui fournit que des outils pour cela."
    c:
      en: A reservation is a pricing commitment; it has no link with the compliance of resources.
      fr: "Une réservation est un engagement tarifaire ; elle n'a aucun lien avec la conformité des ressources."
    d:
      en: "Scaling out adds instances to handle load; it doesn't bring existing resources into compliance."
      fr: Le scale-out ajoute des instances pour absorber la charge ; il ne met pas en conformité les ressources existantes.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Templates overview
  url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
