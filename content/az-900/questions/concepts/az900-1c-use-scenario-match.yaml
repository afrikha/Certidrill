id: az900-1c-use-scenario-match
objective: "1.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Which cloud service type should you recommend for each scenario? To answer, drag the appropriate service types to the correct scenarios. Each service type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quel type de service cloud devez-vous recommander pour chaque scénario ? Pour répondre, faites glisser les types de services appropriés vers les scénarios correspondants. Chaque type de service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: iaas, text: "IaaS" }
    - { id: paas, text: "PaaS" }
    - { id: saas, text: "SaaS" }
  targets:
    - id: t1
      text: { en: "Quickly replicate established server configurations for test environments while keeping complete control of them", fr: "Répliquer rapidement des configurations de serveurs établies pour des environnements de test, en gardant un contrôle complet" }
    - id: t2
      text: { en: "Give all employees a ready-to-use messaging application", fr: "Donner à tous les employés une application de messagerie prête à l'emploi" }
    - id: t3
      text: { en: "Build a custom application on a development framework that includes scalability and high availability", fr: "Créer une application personnalisée sur un framework de développement qui inclut la scalabilité et la haute disponibilité" }
    - id: t4
      text: { en: "Use a finance and expense tracking application without installing or maintaining it", fr: "Utiliser une application de gestion financière et de suivi des dépenses sans l'installer ni l'entretenir" }
answer:
  mapping: { t1: iaas, t2: saas, t3: paas, t4: saas }
explanation:
  correct:
    en: "Testing and development with rapidly replicated configurations and complete control is an IaaS scenario. A development framework with built-in scalability and high availability is a PaaS scenario. Messaging, and finance and expense tracking, are ready-to-use applications: SaaS in both cases."
    fr: "Le test et le développement avec des configurations répliquées rapidement et un contrôle complet sont un scénario IaaS. Un framework de développement avec scalabilité et haute disponibilité intégrées est un scénario PaaS. La messagerie, comme la gestion financière et le suivi des dépenses, sont des applications prêtes à l'emploi : SaaS dans les deux cas."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
