id: az900-1a-private-traits-multi
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe a private cloud?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent un cloud privé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: "a"
      text:
        en: "Anyone who wants to purchase services can use its resources."
        fr: "Quiconque veut acheter des services peut utiliser ses ressources."
    - id: "b"
      text:
        en: "It can be hosted in a dedicated offsite datacenter that a third party operates."
        fr: "Il peut être hébergé dans un centre de données dédié hors site, exploité par un tiers."
    - id: "c"
      text:
        en: "It must be interconnected with the services of a public cloud provider."
        fr: "Il doit être interconnecté avec les services d'un fournisseur de cloud public."
    - id: "d"
      text:
        en: "It gives the organization less control than a public cloud does."
        fr: "Il donne à l'organisation moins de contrôle qu'un cloud public."
    - id: "e"
      text:
        en: "Its resources stay dedicated to the single organization that uses it."
        fr: "Ses ressources restent dédiées à la seule organisation qui l'utilise."
answer:
  optionIds: ["b", "e"]
explanation:
  correct:
    en: "A private cloud is a cloud environment used by a single entity: its resources stay dedicated to that organization. It can be hosted in the organization's on-site datacenter or in a dedicated offsite datacenter, possibly operated by a third party."
    fr: "Un cloud privé est un environnement cloud utilisé par une seule entité : ses ressources restent dédiées à cette organisation. Il peut être hébergé dans le centre de données de l'organisation ou dans un centre de données dédié hors site, éventuellement exploité par un tiers."
  options:
    a:
      en: "Availability to anyone who wants to purchase services characterizes a public cloud."
      fr: "La disponibilité pour quiconque veut acheter des services caractérise un cloud public."
    c:
      en: "A private cloud can exist on its own; interconnecting it with a public cloud creates a hybrid cloud."
      fr: "Un cloud privé peut exister seul ; son interconnexion avec un cloud public crée un cloud hybride."
    d:
      en: "A private cloud provides much greater control than a public cloud, at a greater cost."
      fr: "Un cloud privé offre un contrôle bien plus grand qu'un cloud public, pour un coût supérieur."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
