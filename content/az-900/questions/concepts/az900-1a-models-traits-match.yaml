id: az900-1a-models-traits-match
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each characteristic to the cloud model that it describes. To answer, drag the appropriate cloud model to each characteristic. Each cloud model may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque caractéristique au modèle de cloud qu'elle décrit. Pour répondre, faites glisser le modèle de cloud approprié vers chaque caractéristique. Chaque modèle de cloud peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: "pub"
      text:
        en: "Public cloud"
        fr: "Cloud public"
    - id: "priv"
      text:
        en: "Private cloud"
        fr: "Cloud privé"
    - id: "hyb"
      text:
        en: "Hybrid cloud"
        fr: "Cloud hybride"
  targets:
    - id: "t1"
      text:
        en: "Your data is not collocated with the data of other tenants."
        fr: "Vos données ne sont pas colocalisées avec les données d'autres locataires."
    - id: "t2"
      text:
        en: "You pay only for what you use."
        fr: "Vous payez uniquement ce que vous utilisez."
    - id: "t3"
      text:
        en: "Public and private clouds are used in an interconnected environment."
        fr: "Des clouds public et privé sont utilisés dans un environnement interconnecté."
    - id: "t4"
      text:
        en: "You do not have complete control over resources and security."
        fr: "Vous n'avez pas un contrôle total sur les ressources et la sécurité."
answer:
  mapping:
    t1: "priv"
    t2: "pub"
    t3: "hyb"
    t4: "pub"
explanation:
  correct:
    en: "A private cloud is used by a single entity, so its data is not collocated with other tenants' data. In a public cloud you pay only for what you use, but the provider controls the infrastructure, so you do not have complete control over resources and security. A hybrid cloud uses public and private clouds in an interconnected environment."
    fr: "Un cloud privé est utilisé par une seule entité : ses données ne sont donc pas colocalisées avec celles d'autres locataires. Dans un cloud public, vous payez uniquement ce que vous utilisez, mais le fournisseur contrôle l'infrastructure : vous n'avez donc pas un contrôle total sur les ressources et la sécurité. Un cloud hybride utilise des clouds public et privé dans un environnement interconnecté."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
