id: az900-1a-sr-order
objective: "1.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You compare four ways to host a workload.

    Arrange the hosting options from the one that places the most responsibility on the customer to the one that places the least. To answer, move all the options from the list to the answer area and arrange them in the correct order.
  fr: |
    Vous comparez quatre façons d'héberger une charge de travail.

    Classez les options d'hébergement de celle qui laisse le plus de responsabilités au client à celle qui lui en laisse le moins. Pour répondre, déplacez toutes les options de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: "saas"
      text:
        en: "Software as a service (SaaS)"
        fr: "SaaS (software as a service)"
    - id: "onprem"
      text:
        en: "On-premises datacenter"
        fr: "Centre de données local"
    - id: "paas"
      text:
        en: "Platform as a service (PaaS)"
        fr: "PaaS (platform as a service)"
    - id: "iaas"
      text:
        en: "Infrastructure as a service (IaaS)"
        fr: "IaaS (infrastructure as a service)"
answer:
  sequence: ["onprem", "iaas", "paas", "saas"]
explanation:
  correct:
    en: "In an on-premises datacenter, the organization is responsible for everything. Among the cloud service types, IaaS places the most responsibility on the customer, because the provider handles only the physical layers. PaaS is a middle ground, and SaaS places most of the responsibility on the provider."
    fr: "Dans un centre de données local, l'organisation est responsable de tout. Parmi les types de services cloud, IaaS laisse le plus de responsabilités au client, car le fournisseur ne prend en charge que les couches physiques. PaaS est un intermédiaire, et SaaS confie l'essentiel des responsabilités au fournisseur."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
