id: az900-1b-sls-model
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The developers of Wingtip Toys want to deploy code without provisioning or patching any server. Wingtip Toys wants to pay only when the code runs.

    Which computing model should Wingtip Toys use?
  fr: |
    Les développeurs de Wingtip Toys veulent déployer du code sans provisionner ni corriger le moindre serveur. Wingtip Toys veut payer uniquement lorsque le code s'exécute.

    Quel modèle de calcul Wingtip Toys doit-elle utiliser ?
body:
  options:
  - id: a
    text:
      en: Infrastructure as a service (IaaS)
      fr: IaaS (infrastructure as a service)
  - id: b
    text:
      en: Software as a service (SaaS)
      fr: SaaS (software as a service)
  - id: c
    text:
      en: A private cloud
      fr: Un cloud privé
  - id: d
    text:
      en: Serverless computing
      fr: Le calcul serverless
answer:
  optionId: d
explanation:
  correct:
    en: "In serverless computing, the cloud provider runs and maintains the servers: you supply only the code. The platform runs the code when it is triggered and bills the resources used during the execution, not idle time."
    fr: "Dans le calcul serverless, le fournisseur de cloud exécute et entretient les serveurs : vous ne fournissez que le code. La plateforme exécute le code lorsqu'il est déclenché et facture les ressources utilisées pendant l'exécution, pas le temps d'inactivité."
  options:
    a:
      en: With IaaS, you provision virtual machines and patch their operating system yourself, and a running virtual machine is billed even when it is idle.
      fr: "Avec IaaS, vous provisionnez des machines virtuelles et corrigez vous-même leur système d'exploitation, et une machine virtuelle en marche est facturée même inactive."
    b:
      en: "SaaS is a finished application that you rent; you don't deploy your own code in it."
      fr: "SaaS est une application terminée que vous louez ; vous n'y déployez pas votre propre code."
    c:
      en: A private cloud is used by a single organization, which buys and maintains the hardware.
      fr: Un cloud privé est utilisé par une seule organisation, qui achète et entretient le matériel.
references:
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
