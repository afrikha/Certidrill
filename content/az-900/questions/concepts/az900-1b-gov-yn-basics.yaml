id: az900-1b-gov-yn-basics
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Cloud features that support governance are available whether you use IaaS or SaaS.
      fr: Les fonctionnalités cloud qui servent la gouvernance sont disponibles que vous utilisiez IaaS ou SaaS.
  - id: s2
    text:
      en: With SaaS, the customer installs the patches of the application.
      fr: "Avec SaaS, le client installe les correctifs de l'application."
  - id: s3
    text:
      en: With IaaS, the cloud provider supplies the physical resources.
      fr: Avec IaaS, le fournisseur de cloud fournit les ressources physiques.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: Whatever you deploy, from infrastructure as a service to software as a service, cloud features support governance and compliance. With IaaS, the provider supplies the physical resources and the customer manages the operating systems and the software. With SaaS, patches and maintenance are handled automatically by the provider.
    fr: "Quel que soit ce que vous déployez, de l'infrastructure as a service au software as a service, les fonctionnalités cloud servent la gouvernance et la conformité. Avec IaaS, le fournisseur fournit les ressources physiques et le client gère les systèmes d'exploitation et les logiciels. Avec SaaS, les correctifs et la maintenance sont pris en charge automatiquement par le fournisseur."
  options:
    s2:
      en: SaaS is a finished application managed by the provider, which applies patches and maintenance itself.
      fr: SaaS est une application terminée gérée par le fournisseur, qui applique lui-même les correctifs et la maintenance.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
