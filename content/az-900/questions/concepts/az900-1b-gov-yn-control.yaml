id: az900-1b-gov-yn-control
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Choosing PaaS rather than IaaS gives the customer more control over the operating system.
      fr: "Choisir PaaS plutôt que IaaS donne au client plus de contrôle sur le système d'exploitation."
  - id: s2
    text:
      en: With IaaS, the customer is responsible for the physical security of the datacenter.
      fr: Avec IaaS, le client est responsable de la sécurité physique du centre de données.
  - id: s3
    text:
      en: A customer that wants patches and maintenance to be handled automatically should prefer PaaS or SaaS to IaaS.
      fr: Un client qui veut que les correctifs et la maintenance soient pris en charge automatiquement doit préférer PaaS ou SaaS à IaaS.
answer:
  values:
    s1: false
    s2: false
    s3: true
explanation:
  correct:
    en: "The cloud lets you choose the level of control that fits your security needs. IaaS gives the maximum control: you manage the operating systems and software, patches included, while the provider keeps the physical resources. With PaaS and SaaS, patches and maintenance are handled automatically, in exchange for less control."
    fr: "Le cloud vous laisse choisir le niveau de contrôle adapté à vos besoins de sécurité. IaaS donne le contrôle maximal : vous gérez les systèmes d'exploitation et les logiciels, correctifs compris, tandis que le fournisseur garde les ressources physiques. Avec PaaS et SaaS, les correctifs et la maintenance sont pris en charge automatiquement, en échange d'un contrôle moindre."
  options:
    s1:
      en: "It is the opposite: with PaaS the provider manages the operating system, so the customer has less control over it than with IaaS."
      fr: "C'est l'inverse : avec PaaS, le fournisseur gère le système d'exploitation ; le client a donc moins de contrôle sur celui-ci qu'avec IaaS."
    s2:
      en: The physical datacenter, network and hosts are always the responsibility of the cloud provider.
      fr: Le centre de données, le réseau et les hôtes physiques sont toujours sous la responsabilité du fournisseur de cloud.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
