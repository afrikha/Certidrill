id: az900-1a-uc-companies-match
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each company to the cloud model that it uses. To answer, drag the appropriate cloud model to each company. Each cloud model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque entreprise au modèle de cloud qu'elle utilise. Pour répondre, faites glisser le modèle de cloud approprié vers chaque entreprise. Chaque modèle de cloud peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: "pub"
      text:
        en: "Public cloud"
        fr: "Cloud public"
    - id: "priv"
      text:
        en: "Private cloud"
        fr: "Cloud privé"
    - id: "hyb"
      text:
        en: "Hybrid cloud"
        fr: "Cloud hybride"
    - id: "multi"
      text: "Multicloud"
  targets:
    - id: "t1"
      text:
        en: "Tailspin Toys owns no hardware and runs all its workloads with a single third-party provider, whose services anyone can purchase."
        fr: "Tailspin Toys ne possède aucun matériel et exécute toutes ses charges de travail chez un seul fournisseur tiers, dont n'importe qui peut acheter les services."
    - id: "t2"
      text:
        en: "Woodgrove Bank runs all its workloads on infrastructure that is dedicated to the bank, in an offsite datacenter operated by a third party."
        fr: "Woodgrove Bank exécute toutes ses charges de travail sur une infrastructure dédiée à la banque, dans un centre de données hors site exploité par un tiers."
    - id: "t3"
      text:
        en: "Northwind Traders is migrating gradually: half of its applications run in Azure and exchange data with the others, which still run in the private cloud of Northwind."
        fr: "Northwind Traders migre progressivement : la moitié de ses applications s'exécutent dans Azure et échangent des données avec les autres, qui s'exécutent encore dans le cloud privé de Northwind."
answer:
  mapping:
    t1: "pub"
    t2: "priv"
    t3: "hyb"
explanation:
  correct:
    en: "Tailspin Toys uses only the resources of a third-party provider that anyone can purchase: a public cloud. The infrastructure of Woodgrove Bank is dedicated to a single organization, which makes it a private cloud even though a third party hosts it offsite. Northwind Traders runs interconnected applications in Azure and in its private cloud: a hybrid cloud. Multicloud would require several public cloud providers."
    fr: "Tailspin Toys n'utilise que les ressources d'un fournisseur tiers dont n'importe qui peut acheter les services : un cloud public. L'infrastructure de Woodgrove Bank est dédiée à une seule organisation, ce qui en fait un cloud privé même si un tiers l'héberge hors site. Northwind Traders exécute des applications interconnectées dans Azure et dans son cloud privé : un cloud hybride. Le multicloud supposerait plusieurs fournisseurs de cloud public."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
