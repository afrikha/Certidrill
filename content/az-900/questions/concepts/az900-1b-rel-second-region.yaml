id: az900-1b-rel-second-region
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts an application in a single Azure region. Fabrikam wants the application to continue to function if a catastrophic event affects that region.

    What should Fabrikam do?
  fr: |
    Fabrikam héberge une application dans une seule région Azure. Fabrikam veut que l'application continue de fonctionner si un événement catastrophique touche cette région.

    Que doit faire Fabrikam ?
body:
  options:
  - id: a
    text:
      en: Increase the size of the virtual machines of the application
      fr: "Augmenter la taille des machines virtuelles de l'application"
  - id: b
    text:
      en: Deploy the resources of the application in a second Azure region
      fr: "Déployer les ressources de l'application dans une deuxième région Azure"
  - id: c
    text:
      en: Add virtual machines to the application in the same region
      fr: "Ajouter des machines virtuelles à l'application dans la même région"
  - id: d
    text:
      en: Buy a three-year reservation for the virtual machines
      fr: Acheter une réservation de trois ans pour les machines virtuelles
answer:
  optionId: b
explanation:
  correct:
    en: "The cloud has a decentralized design: resources can be deployed in regions around the world. If one region suffers a catastrophic event, the resources in the other regions are still up and running, which makes the application reliable."
    fr: "Le cloud a une conception décentralisée : les ressources peuvent être déployées dans des régions du monde entier. Si une région subit un événement catastrophique, les ressources des autres régions restent en service, ce qui rend l'application fiable."
  options:
    a:
      en: A larger virtual machine handles more load, but it is still in the region that fails.
      fr: Une machine virtuelle plus grande absorbe plus de charge, mais elle reste dans la région qui défaille.
    c:
      en: More virtual machines in the same region handle more load, but all of them are affected by an event that hits the region.
      fr: Davantage de machines virtuelles dans la même région absorbent plus de charge, mais toutes sont touchées par un événement qui frappe la région.
    d:
      en: A reservation is a pricing commitment; it has no effect on the ability to recover from a failure.
      fr: "Une réservation est un engagement tarifaire ; elle n'a aucun effet sur la capacité à se remettre d'une défaillance."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- title: What Are Azure Regions?
  url: https://learn.microsoft.com/en-us/azure/reliability/regions-overview
