id: az900-1a-sr-workloads-hot
objective: "1.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs four workloads, as shown in the following table.

    Answer each prompt by selecting the appropriate workload in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute quatre charges de travail, présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la charge de travail appropriée dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: "p1"
      text:
        en: "The workload for which Contoso maintains the physical hosts"
        fr: "La charge de travail dont Contoso assure la maintenance des hôtes physiques"
    - id: "p2"
      text:
        en: "The workload for which Contoso updates the operating system, while Microsoft maintains the physical hosts"
        fr: "La charge de travail dont Contoso met à jour le système d'exploitation, tandis que Microsoft assure la maintenance des hôtes physiques"
  grid:
    header: [{"en": "Workload", "fr": "Charge de travail"}, {"en": "Hosted on", "fr": "Hébergement"}, {"en": "Service type", "fr": "Type de service"}]
    rows:
      - [{"text": "App1", "area": "app1"}, {"text": {"en": "Azure Virtual Machines", "fr": "Machines virtuelles Azure"}}, {"text": "IaaS"}]
      - [{"text": "App2", "area": "app2"}, {"text": "Azure App Service"}, {"text": "PaaS"}]
      - [{"text": "App3", "area": "app3"}, {"text": {"en": "Servers in the Contoso datacenter", "fr": "Serveurs du centre de données de Contoso"}}, {"text": {"en": "On-premises", "fr": "Local"}}]
      - [{"text": "App4", "area": "app4"}, {"text": "Microsoft 365"}, {"text": "SaaS"}]
answer:
  values:
    p1: "app3"
    p2: "app1"
explanation:
  correct:
    en: "App3 runs on servers in the Contoso datacenter, so Contoso maintains everything, including the physical hosts. App1 runs on Azure virtual machines (IaaS): Microsoft maintains the physical hosts, and Contoso updates the operating system. For App2 (PaaS) and App4 (SaaS), Microsoft manages both the physical hosts and the operating system."
    fr: "App3 s'exécute sur des serveurs du centre de données de Contoso : Contoso assure donc toute la maintenance, y compris celle des hôtes physiques. App1 s'exécute sur des machines virtuelles Azure (IaaS) : Microsoft assure la maintenance des hôtes physiques, et Contoso met à jour le système d'exploitation. Pour App2 (PaaS) et App4 (SaaS), Microsoft gère à la fois les hôtes physiques et le système d'exploitation."
references:
  - title: "Shared responsibility in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
