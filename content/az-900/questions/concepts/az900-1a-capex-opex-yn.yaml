id: az900-1a-capex-opex-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "Cloud services that are paid for as they are consumed are an operational expenditure (OpEx)."
        fr: "Les services cloud payés au fur et à mesure de leur consommation sont des dépenses d'exploitation (OpEx)."
    - id: "s2"
      text:
        en: "The consumption-based model requires an upfront payment for the hardware of the provider."
        fr: "Le modèle basé sur la consommation impose un paiement initial pour le matériel du fournisseur."
    - id: "s3"
      text:
        en: "Capital expenditure (CapEx) is ongoing spending on services over time."
        fr: "Les dépenses d'investissement (CapEx) sont des dépenses continues consacrées à des services au fil du temps."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: "Because you pay for cloud services as you consume them, cloud computing is classified as an operational expenditure. The consumption-based model has no upfront cost. Capital expenditure is upfront spending on physical infrastructure; ongoing spending on services over time is the definition of OpEx."
    fr: "Comme vous payez les services cloud au fur et à mesure de leur consommation, le cloud computing est classé dans les dépenses d'exploitation. Le modèle basé sur la consommation ne comporte aucun coût initial. Les dépenses d'investissement sont des dépenses initiales consacrées à une infrastructure physique ; les dépenses continues consacrées à des services au fil du temps définissent l'OpEx."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
