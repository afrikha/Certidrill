id: az900-1a-capacity-planning-dd
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You compare capacity planning in a traditional datacenter and in the cloud.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez la planification de capacité dans un centre de données classique et dans le cloud.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: "text"
  template:
    en: "In a traditional datacenter, overestimating future needs leads to [[over]], and underestimating them leads to [[under]].\n\nWith the consumption-based model, you [[cloud]]."
    fr: "Dans un centre de données classique, surestimer les besoins futurs entraîne [[over]], et les sous-estimer entraîne [[under]].\n\nAvec le modèle basé sur la consommation, vous [[cloud]]."
  slots:
    - id: "over"
      options:
        - id: "perf"
          text:
            en: "degraded application performance"
            fr: "une dégradation des performances des applications"
        - id: "idle"
          text:
            en: "spending on infrastructure that sits idle"
            fr: "des dépenses pour une infrastructure inutilisée"
        - id: "refund"
          text:
            en: "a refund for the unused hardware"
            fr: "un remboursement du matériel inutilisé"
    - id: "under"
      options:
        - id: "perf"
          text:
            en: "degraded application performance"
            fr: "une dégradation des performances des applications"
        - id: "idle"
          text:
            en: "spending on infrastructure that sits idle"
            fr: "des dépenses pour une infrastructure inutilisée"
        - id: "auto"
          text:
            en: "an automatic increase in capacity"
            fr: "une augmentation automatique de la capacité"
    - id: "cloud"
      options:
        - id: "peak"
          text:
            en: "pay in advance for the estimated peak"
            fr: "payez à l'avance le pic estimé"
        - id: "fixed"
          text:
            en: "keep the same capacity all year"
            fr: "conservez la même capacité toute l'année"
        - id: "adjust"
          text:
            en: "adjust resources to actual demand"
            fr: "ajustez les ressources à la demande réelle"
answer:
  values:
    over: "idle"
    under: "perf"
    cloud: "adjust"
explanation:
  correct:
    en: "In a traditional datacenter you estimate needs in advance: if you overestimate, you spend on infrastructure that sits idle, and if you underestimate, application performance degrades until additional hardware is ordered and installed. With the consumption-based model, you adjust resources to actual demand and pay only for what you use."
    fr: "Dans un centre de données classique, vous estimez les besoins à l'avance : si vous surestimez, vous dépensez pour une infrastructure inutilisée, et si vous sous-estimez, les performances des applications se dégradent jusqu'à la commande et l'installation de matériel supplémentaire. Avec le modèle basé sur la consommation, vous ajustez les ressources à la demande réelle et vous payez uniquement ce que vous utilisez."
  options:
    refund:
      en: "Purchased hardware is not refunded when it is unused."
      fr: "Le matériel acheté n'est pas remboursé lorsqu'il est inutilisé."
    auto:
      en: "A traditional datacenter does not add capacity by itself: hardware must be ordered, installed and provisioned."
      fr: "Un centre de données classique n'ajoute pas de capacité tout seul : il faut commander, installer et provisionner du matériel."
    peak:
      en: "Paying in advance for an estimated peak is the traditional approach, not the consumption-based model."
      fr: "Payer à l'avance un pic estimé correspond à l'approche classique, pas au modèle basé sur la consommation."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
