id: az900-1a-sr-saas-accounts
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware uses Microsoft 365, a software as a service (SaaS) offering, for email and document sharing.

    Which task remains the responsibility of Litware?
  fr: |
    Litware utilise Microsoft 365, une offre SaaS (software as a service), pour la messagerie et le partage de documents.

    Quelle tâche reste sous la responsabilité de Litware ?
body:
  options:
    - id: "a"
      text:
        en: "Updating the application to its latest version"
        fr: "Mettre à jour l'application vers sa dernière version"
    - id: "b"
      text:
        en: "Maintaining the servers that run the service"
        fr: "Assurer la maintenance des serveurs qui exécutent le service"
    - id: "c"
      text:
        en: "Securing the datacenters that host the service"
        fr: "Sécuriser les centres de données qui hébergent le service"
    - id: "d"
      text:
        en: "Managing the user accounts of the Litware employees"
        fr: "Gérer les comptes d'utilisateur des employés de Litware"
answer:
  optionId: "d"
explanation:
  correct:
    en: "SaaS places most of the responsibility on the provider, but the customer always remains responsible for the accounts and identities of its users, as well as for its data. Litware creates the accounts, removes them when employees leave and decides who has access to what."
    fr: "Le SaaS confie l'essentiel des responsabilités au fournisseur, mais le client reste toujours responsable des comptes et des identités de ses utilisateurs, ainsi que de ses données. Litware crée les comptes, les supprime au départ des employés et décide qui a accès à quoi."
  options:
    a:
      en: "With SaaS, the provider maintains the application and keeps it up to date."
      fr: "En SaaS, le fournisseur assure la maintenance de l'application et la tient à jour."
    b:
      en: "The servers that run a SaaS service are operated by the provider."
      fr: "Les serveurs qui exécutent un service SaaS sont exploités par le fournisseur."
    c:
      en: "The physical datacenter is always the provider's responsibility."
      fr: "Le centre de données physique relève toujours de la responsabilité du fournisseur."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
  - title: "Shared responsibility in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"
