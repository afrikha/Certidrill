id: az900-1a-uc-public-need
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which need is best met by a public cloud?
  fr: |
    Quel besoin un cloud public satisfait-il le mieux ?
body:
  options:
    - id: "a"
      text:
        en: "Running the website of a short campaign without buying any hardware"
        fr: "Exécuter le site web d'une campagne de courte durée sans acheter de matériel"
    - id: "b"
      text:
        en: "Keeping data on hardware that is not shared with any other tenant"
        fr: "Conserver des données sur du matériel non partagé avec d'autres locataires"
    - id: "c"
      text:
        en: "Having complete control over the physical security of the servers"
        fr: "Avoir un contrôle total sur la sécurité physique des serveurs"
    - id: "d"
      text:
        en: "Reusing the servers that the company already owns in its datacenter"
        fr: "Réutiliser les serveurs que l'entreprise possède déjà dans son centre de données"
answer:
  optionId: "a"
explanation:
  correct:
    en: "A public cloud needs no capital expenditure, applications can be provisioned and deprovisioned quickly, and you pay only for what you use. This fits a website that exists for a short time: the resources are created for the campaign and then released."
    fr: "Un cloud public ne nécessite aucune dépense d'investissement, les applications peuvent être provisionnées et déprovisionnées rapidement, et vous payez uniquement ce que vous utilisez. Cela convient à un site web de courte durée : les ressources sont créées pour la campagne, puis libérées."
  options:
    b:
      en: "Data that must not be collocated with other tenants' data calls for a private cloud."
      fr: "Des données qui ne doivent pas être colocalisées avec celles d'autres locataires relèvent d'un cloud privé."
    c:
      en: "In a public cloud, the provider controls the physical infrastructure; complete control is a private cloud characteristic."
      fr: "Dans un cloud public, le fournisseur contrôle l'infrastructure physique ; le contrôle total caractérise le cloud privé."
    d:
      en: "Servers that the company already owns are on-premises or private cloud infrastructure, not public cloud resources."
      fr: "Les serveurs que l'entreprise possède déjà constituent une infrastructure locale ou de cloud privé, pas des ressources de cloud public."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
