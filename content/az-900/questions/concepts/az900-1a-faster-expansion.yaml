id: az900-1a-faster-expansion
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Compared with a traditional datacenter, why can a company expand its IT infrastructure faster with cloud computing?
  fr: |
    Par rapport à un centre de données classique, pourquoi une entreprise peut-elle étendre plus rapidement son infrastructure informatique avec le cloud computing ?
body:
  options:
    - id: "a"
      text:
        en: "Because the provider ships preconfigured servers to the company's premises"
        fr: "Parce que le fournisseur expédie des serveurs préconfigurés dans les locaux de l'entreprise"
    - id: "b"
      text:
        en: "Because cloud services run without any physical hardware"
        fr: "Parce que les services cloud s'exécutent sans aucun matériel physique"
    - id: "c"
      text:
        en: "Because the provider delivers services over the internet from infrastructure that it already runs"
        fr: "Parce que le fournisseur fournit des services sur Internet depuis une infrastructure qu'il exploite déjà"
    - id: "d"
      text:
        en: "Because the provider remotely upgrades the servers that the company already owns"
        fr: "Parce que le fournisseur met à niveau à distance les serveurs que l'entreprise possède déjà"
answer:
  optionId: "c"
explanation:
  correct:
    en: "Cloud computing uses the internet to deliver services from infrastructure that the provider already runs, so it is not constrained by physical infrastructure in the way a traditional datacenter is. A company that needs more capacity deploys it in the cloud instead of waiting for a datacenter to be built or equipped."
    fr: "Le cloud computing utilise Internet pour fournir des services depuis une infrastructure que le fournisseur exploite déjà : il n'est donc pas contraint par une infrastructure physique comme l'est un centre de données classique. Une entreprise qui a besoin de plus de capacité la déploie dans le cloud au lieu d'attendre la construction ou l'équipement d'un centre de données."
  options:
    a:
      en: "Cloud capacity is not shipped to the customer; it stays in the provider's datacenters and is used over the internet."
      fr: "La capacité cloud n'est pas expédiée chez le client ; elle reste dans les centres de données du fournisseur et s'utilise par Internet."
    b:
      en: "Cloud services do run on physical hardware; it simply belongs to the provider, which maintains it."
      fr: "Les services cloud s'exécutent bien sur du matériel physique ; il appartient simplement au fournisseur, qui l'entretient."
    d:
      en: "A cloud provider does not upgrade hardware that the company owns; it provides capacity from its own infrastructure."
      fr: "Un fournisseur de cloud ne met pas à niveau le matériel de l'entreprise ; il fournit de la capacité depuis sa propre infrastructure."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
