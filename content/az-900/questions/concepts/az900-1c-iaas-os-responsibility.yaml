id: az900-1c-iaas-os-responsibility
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which cloud service type are you responsible for installing, configuring, and maintaining the operating system?
  fr: |
    Dans quel type de service cloud êtes-vous responsable de l'installation, de la configuration et de la maintenance du système d'exploitation ?
body:
  options:
    - id: a
      text: "Platform as a service (PaaS)"
    - id: b
      text: "Infrastructure as a service (IaaS)"
    - id: c
      text: "Software as a service (SaaS)"
answer: { optionId: b }
explanation:
  correct:
    en: "With IaaS, the cloud provider maintains the hardware, the network connectivity to the internet and the physical security. You are responsible for everything else, starting with the installation, configuration and maintenance of the operating system."
    fr: "Avec IaaS, le fournisseur de cloud entretient le matériel, la connectivité réseau à Internet et la sécurité physique. Vous êtes responsable de tout le reste, à commencer par l'installation, la configuration et la maintenance du système d'exploitation."
  options:
    a:
      en: "With PaaS, the provider also maintains the operating systems and the middleware; you bring the application and its data."
      fr: "Avec PaaS, le fournisseur entretient aussi les systèmes d'exploitation et les intergiciels ; vous apportez l'application et ses données."
    c:
      en: "With SaaS, you use a finished application; the provider manages the whole stack, including the operating system."
      fr: "Avec SaaS, vous utilisez une application finie ; le fournisseur gère toute la pile, système d'exploitation compris."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
