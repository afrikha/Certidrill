id: az900-1b-rel-load-balancing
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During a traffic peak, some of the servers of the Woodgrove Bank web application are overloaded while others still have capacity. The number of servers must not change.

    Which capability should Woodgrove Bank use to keep the performance of the application predictable?
  fr: |
    Pendant un pic de trafic, certains serveurs de l'application web de Woodgrove Bank sont surchargés alors que d'autres ont encore de la capacité. Le nombre de serveurs ne doit pas changer.

    Quelle fonctionnalité Woodgrove Bank doit-elle utiliser pour que les performances de l'application restent prévisibles ?
body:
  options:
  - id: a
    text:
      en: Autoscaling
      fr: "La mise à l'échelle automatique"
  - id: b
    text:
      en: Vertical scaling
      fr: "La mise à l'échelle verticale"
  - id: c
    text:
      en: Load balancing
      fr: "L'équilibrage de charge"
  - id: d
    text:
      en: Policy-based auditing
      fr: "L'audit fondé sur des stratégies"
answer:
  optionId: c
explanation:
  correct:
    en: Load balancing redirects part of the traffic from the overloaded servers to the less stressed ones. The existing servers are used evenly, which keeps the response of the application consistent without adding any server.
    fr: "L'équilibrage de charge redirige une partie du trafic des serveurs surchargés vers ceux qui sont moins sollicités. Les serveurs existants sont utilisés de façon homogène, ce qui garde la réponse de l'application constante sans ajouter de serveur."
  options:
    a:
      en: "Autoscaling changes the number of servers, which the scenario excludes; it doesn't spread the traffic between them."
      fr: "La mise à l'échelle automatique change le nombre de serveurs, ce que le scénario exclut ; elle ne répartit pas le trafic entre eux."
    b:
      en: Vertical scaling gives more CPU or memory to a server; the unused capacity of the other servers would stay unused.
      fr: "La mise à l'échelle verticale donne plus de processeur ou de mémoire à un serveur ; la capacité inutilisée des autres serveurs le resterait."
    d:
      en: "Auditing flags resources that don't comply with standards; it has no effect on the distribution of traffic."
      fr: "L'audit signale les ressources qui ne respectent pas les normes ; il n'a aucun effet sur la répartition du trafic."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
