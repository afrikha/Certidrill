id: az900-1a-definition-dd
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: "text"
  template:
    en: "Cloud computing is the delivery of [[what]] over [[how]].\n\nThe physical infrastructure that runs the services is maintained by [[who]]."
    fr: "Le cloud computing consiste à fournir [[what]] par l'intermédiaire [[how]].\n\nL'infrastructure physique qui exécute les services est entretenue par [[who]]."
  slots:
    - id: "what"
      options:
        - id: "hw"
          text:
            en: "physical servers"
            fr: "des serveurs physiques"
        - id: "svc"
          text:
            en: "computing services"
            fr: "des services informatiques"
        - id: "lic"
          text:
            en: "software licenses"
            fr: "des licences logicielles"
    - id: "how"
      options:
        - id: "net"
          text:
            en: "the internet"
            fr: "d'Internet"
        - id: "lan"
          text:
            en: "the customer's local network"
            fr: "du réseau local du client"
        - id: "media"
          text:
            en: "removable storage media"
            fr: "de supports de stockage amovibles"
    - id: "who"
      options:
        - id: "cust"
          text:
            en: "the customer"
            fr: "le client"
        - id: "mfr"
          text:
            en: "the hardware manufacturer"
            fr: "le fabricant du matériel"
        - id: "prov"
          text:
            en: "the cloud provider"
            fr: "le fournisseur de cloud"
answer:
  values:
    what: "svc"
    how: "net"
    who: "prov"
explanation:
  correct:
    en: "Cloud computing is the delivery of computing services over the internet. The provider owns and maintains the physical infrastructure (datacenters, hardware, physical network), and the customer consumes the services without managing that infrastructure."
    fr: "Le cloud computing consiste à fournir des services informatiques sur Internet. Le fournisseur possède et entretient l'infrastructure physique (centres de données, matériel, réseau physique), et le client consomme les services sans gérer cette infrastructure."
  options:
    hw:
      en: "The customer receives services, not physical servers: the hardware stays in the provider's datacenters."
      fr: "Le client reçoit des services, pas des serveurs physiques : le matériel reste dans les centres de données du fournisseur."
    lan:
      en: "Cloud services are delivered over the internet, not from the customer's own local network."
      fr: "Les services cloud sont fournis sur Internet, pas depuis le réseau local du client."
    cust:
      en: "Maintaining the physical infrastructure is always the provider's responsibility."
      fr: "L'entretien de l'infrastructure physique relève toujours du fournisseur."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
