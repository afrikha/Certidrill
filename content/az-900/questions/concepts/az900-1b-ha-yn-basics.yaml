id: az900-1b-ha-yn-basics
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: High availability means that an application can serve an unlimited number of users.
      fr: "La haute disponibilité signifie qu'une application peut servir un nombre illimité d'utilisateurs."
  - id: s2
    text:
      en: The uptime that Azure guarantees depends on the service.
      fr: Le temps de fonctionnement garanti par Azure dépend du service.
  - id: s3
    text:
      en: In the consumption-based model, reducing resources when demand drops reduces what you pay.
      fr: Dans le modèle basé sur la consommation, réduire les ressources quand la demande baisse réduit ce que vous payez.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: High availability is about resources being available when needed, despite disruptions; Azure states its uptime guarantees service by service in service-level agreements (SLAs). Handling more or fewer users is scalability, and because you pay only for what you use, scaling back when demand drops lowers the cost.
    fr: "La haute disponibilité consiste à garder les ressources disponibles quand on en a besoin, malgré les perturbations ; Azure énonce ses garanties de temps de fonctionnement service par service, dans des contrats de niveau de service (SLA). Absorber plus ou moins d'utilisateurs relève de la scalabilité et, comme vous ne payez que ce que vous utilisez, réduire les ressources quand la demande baisse diminue le coût."
  options:
    s1:
      en: Serving more users is a matter of scalability. High availability is about staying accessible despite failures and other disruptions.
      fr: "Servir davantage d'utilisateurs relève de la scalabilité. La haute disponibilité consiste à rester accessible malgré les pannes et autres perturbations."
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- title: Describe the consumption-based model
  url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
