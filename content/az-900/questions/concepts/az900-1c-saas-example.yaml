id: az900-1c-saas-example
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which service is an example of software as a service (SaaS)?
  fr: |
    Quel service est un exemple de SaaS (software as a service) ?
body:
  options:
    - id: a
      text: "Azure SQL Database"
    - id: b
      text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" }
    - id: c
      text: "Microsoft 365"
    - id: d
      text: "Azure App Service"
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft 365 is a set of ready-made applications that you use without deploying or maintaining anything: it is the typical SaaS example, with Dynamics 365. Microsoft manages the infrastructure, the platform and the application."
    fr: "Microsoft 365 est un ensemble d'applications toutes faites que vous utilisez sans rien déployer ni entretenir : c'est l'exemple type de SaaS, avec Dynamics 365. Microsoft gère l'infrastructure, la plateforme et l'application."
  options:
    a:
      en: "Azure SQL Database is a managed database on which you build your own solution: PaaS."
      fr: "Azure SQL Database est une base de données managée sur laquelle vous bâtissez votre propre solution : PaaS."
    b:
      en: "Azure Virtual Machines is IaaS: you manage the operating system and the software."
      fr: "Machines virtuelles Azure relève d'IaaS : vous gérez le système d'exploitation et les logiciels."
    d:
      en: "Azure App Service hosts applications that you write and deploy: PaaS."
      fr: "Azure App Service héberge des applications que vous écrivez et déployez : PaaS."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
