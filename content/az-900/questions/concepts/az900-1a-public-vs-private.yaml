id: az900-1a-public-vs-private
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is a key difference between a public cloud and a private cloud?
  fr: |
    Quelle est une différence essentielle entre un cloud public et un cloud privé ?
body:
  options:
    - id: "a"
      text:
        en: "A public cloud is open to anyone who wants to purchase services, whereas a private cloud is used by a single entity."
        fr: "Un cloud public est ouvert à quiconque veut acheter des services, alors qu'un cloud privé est utilisé par une seule entité."
    - id: "b"
      text:
        en: "A public cloud is free of charge, whereas a private cloud is billed according to the resources that are used."
        fr: "Un cloud public est gratuit, alors qu'un cloud privé est facturé selon les ressources utilisées."
    - id: "c"
      text:
        en: "A public cloud stores only non-confidential data, whereas a private cloud stores only confidential data."
        fr: "Un cloud public ne stocke que des données non confidentielles, alors qu'un cloud privé ne stocke que des données confidentielles."
    - id: "d"
      text:
        en: "A public cloud is reached over the internet, whereas a private cloud is never reachable over the internet."
        fr: "Un cloud public est accessible par Internet, alors qu'un cloud privé n'est jamais accessible par Internet."
answer:
  optionId: "a"
explanation:
  correct:
    en: "A public cloud is built, controlled and maintained by a third-party provider, and anyone who wants to purchase cloud services can use its resources. A private cloud is used by a single entity. This general availability is a key difference between the two models."
    fr: "Un cloud public est construit, contrôlé et entretenu par un fournisseur tiers, et quiconque veut acheter des services cloud peut utiliser ses ressources. Un cloud privé est utilisé par une seule entité. Cette disponibilité générale est une différence essentielle entre les deux modèles."
  options:
    b:
      en: "Public cloud services are not free: you pay for what you use."
      fr: "Les services de cloud public ne sont pas gratuits : vous payez ce que vous utilisez."
    c:
      en: "A cloud model is defined by who can use the resources, not by the confidentiality of the data that is stored."
      fr: "Un modèle de cloud se définit par qui peut utiliser les ressources, pas par la confidentialité des données stockées."
    d:
      en: "A private cloud also delivers IT services over the internet; what distinguishes it is that its resources are dedicated to one organization."
      fr: "Un cloud privé fournit lui aussi des services informatiques par Internet ; ce qui le distingue, c'est que ses ressources sont dédiées à une seule organisation."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
