id: az900-1c-use-lift-shift
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to move 40 servers from its on-premises datacenter to the cloud as quickly as possible. The operating systems and the applications must remain unchanged.

    Which cloud service type should Contoso use?
  fr: |
    Contoso prévoit de déplacer le plus vite possible 40 serveurs de son centre de données local vers le cloud. Les systèmes d'exploitation et les applications doivent rester inchangés.

    Quel type de service cloud Contoso doit-elle utiliser ?
body:
  options:
    - id: a
      text: "Infrastructure as a service (IaaS)"
    - id: b
      text: "Software as a service (SaaS)"
    - id: c
      text: "Platform as a service (PaaS)"
answer: { optionId: a }
explanation:
  correct:
    en: "Moving servers as they are is a lift-and-shift migration, a typical IaaS scenario: you set up cloud resources similar to the on-premises datacenter and move the workloads to them. Only IaaS lets Contoso keep the same operating systems and applications."
    fr: "Déplacer des serveurs tels quels est une migration lift-and-shift, un scénario typique d'IaaS : vous créez des ressources cloud semblables à celles du centre de données local et vous y déplacez les charges de travail. Seul IaaS permet à Contoso de conserver les mêmes systèmes d'exploitation et les mêmes applications."
  options:
    b:
      en: "SaaS would replace the applications with ready-made ones instead of moving the existing servers."
      fr: "SaaS remplacerait les applications par des applications toutes faites au lieu de déplacer les serveurs existants."
    c:
      en: "With PaaS the provider supplies the operating system, so the applications would have to be adapted to the platform."
      fr: "Avec PaaS, le fournisseur fournit le système d'exploitation : il faudrait adapter les applications à la plateforme."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
