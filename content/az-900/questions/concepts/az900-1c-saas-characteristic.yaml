id: az900-1c-saas-characteristic
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes SaaS compared with IaaS and PaaS?
  fr: |
    Quelle affirmation décrit SaaS par rapport à IaaS et à PaaS ?
body:
  options:
    - id: a
      text: { en: "It is the most flexible model and requires the most administration.", fr: "C'est le modèle le plus flexible et celui qui demande le plus d'administration." }
    - id: b
      text: { en: "It provides a platform on which you deploy your own application code.", fr: "Il fournit une plateforme sur laquelle vous déployez le code de votre propre application." }
    - id: c
      text: { en: "It gives you control of the operating system that hosts the application.", fr: "Il vous donne le contrôle du système d'exploitation qui héberge l'application." }
    - id: d
      text: { en: "It is the least flexible model and the easiest to get up and running.", fr: "C'est le modèle le moins flexible et le plus simple à mettre en service." }
answer: { optionId: d }
explanation:
  correct:
    en: "SaaS may be the least flexible model, since you use the application as the provider delivers it, but it is also the easiest to get up and running and it requires the least technical expertise."
    fr: "SaaS est sans doute le modèle le moins flexible, puisque vous utilisez l'application telle que le fournisseur la livre, mais c'est aussi le plus simple à mettre en service et celui qui demande le moins d'expertise technique."
  options:
    a:
      en: "The most flexible model, with the largest operational responsibility, is IaaS."
      fr: "Le modèle le plus flexible, avec la plus grande responsabilité opérationnelle, est IaaS."
    b:
      en: "A platform that runs your own application code describes PaaS."
      fr: "Une plateforme qui exécute le code de votre propre application décrit PaaS."
    c:
      en: "Control of the operating system is specific to IaaS; with SaaS the provider manages it."
      fr: "Le contrôle du système d'exploitation est propre à IaaS ; avec SaaS, c'est le fournisseur qui le gère."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
