id: az900-1a-consumption-benefits-multi
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two are benefits of the consumption-based model?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux avantages du modèle basé sur la consommation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: "a"
      text:
        en: "A fixed monthly cost, whatever the level of usage"
        fr: "Un coût mensuel fixe, quel que soit le niveau d'utilisation"
    - id: "b"
      text:
        en: "Ownership of the hardware at the end of the contract"
        fr: "La propriété du matériel à la fin du contrat"
    - id: "c"
      text:
        en: "No upfront cost for hardware or datacenter infrastructure"
        fr: "Aucun coût initial pour le matériel ou l'infrastructure de centre de données"
    - id: "d"
      text:
        en: "A transfer of responsibility for your data to the provider"
        fr: "Un transfert au fournisseur de la responsabilité de vos données"
    - id: "e"
      text:
        en: "The ability to release resources when demand decreases"
        fr: "La possibilité de libérer des ressources lorsque la demande diminue"
answer:
  optionIds: ["c", "e"]
explanation:
  correct:
    en: "The consumption-based model has no upfront cost for hardware or datacenter infrastructure, and it lets you add resources when demand increases and release them when it decreases. You pay only for what you use."
    fr: "Le modèle basé sur la consommation ne comporte aucun coût initial pour le matériel ou l'infrastructure de centre de données, et il permet d'ajouter des ressources quand la demande augmente et de les libérer quand elle diminue. Vous payez uniquement ce que vous utilisez."
  options:
    a:
      en: "In a consumption-based model, the cost follows usage; it is not fixed."
      fr: "Dans un modèle basé sur la consommation, le coût suit l'utilisation ; il n'est pas fixe."
    b:
      en: "You rent resources; you never become the owner of the provider's hardware."
      fr: "Vous louez des ressources ; vous ne devenez jamais propriétaire du matériel du fournisseur."
    d:
      en: "The way you pay does not change the shared responsibility model: your data always remains your responsibility."
      fr: "La façon de payer ne change pas le modèle de responsabilité partagée : vos données restent toujours sous votre responsabilité."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
