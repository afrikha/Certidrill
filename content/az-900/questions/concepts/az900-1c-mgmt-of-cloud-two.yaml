id: az900-1c-mgmt-of-cloud-two
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two capabilities are examples of management **of** the cloud?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux capacités qui sont des exemples de gestion **du** cloud ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Managing resources through a web portal", fr: "Gérer les ressources au moyen d'un portail web" } }
    - { id: b, text: { en: "Scaling resource deployment automatically based on need", fr: "Mettre automatiquement à l'échelle le déploiement des ressources selon les besoins" } }
    - { id: c, text: { en: "Managing resources by using APIs", fr: "Gérer les ressources au moyen d'API" } }
    - { id: d, text: { en: "Receiving automatic alerts based on configured metrics", fr: "Recevoir des alertes automatiques fondées sur des métriques configurées" } }
    - { id: e, text: { en: "Managing resources by using PowerShell", fr: "Gérer les ressources au moyen de PowerShell" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Management of the cloud is about managing your cloud resources: automatic scaling, deployment from templates, health monitoring with automatic replacement, and automatic alerts based on metrics. Automatic scaling and automatic alerts are two of these four capabilities."
    fr: "La gestion du cloud porte sur la gestion de vos ressources cloud : mise à l'échelle automatique, déploiement à partir de modèles, surveillance de l'intégrité avec remplacement automatique, et alertes automatiques fondées sur des métriques. La mise à l'échelle automatique et les alertes automatiques sont deux de ces quatre capacités."
  options:
    a:
      en: "A web portal is a way to interact with the environment: it is management in the cloud."
      fr: "Un portail web est un moyen d'interagir avec l'environnement : c'est de la gestion dans le cloud."
    c:
      en: "APIs are one of the ways to manage the environment: management in the cloud."
      fr: "Les API sont l'un des moyens de gérer l'environnement : gestion dans le cloud."
    e:
      en: "PowerShell is a management tool, so it belongs to management in the cloud."
      fr: "PowerShell est un outil de gestion ; il relève donc de la gestion dans le cloud."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
