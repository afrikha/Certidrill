id: az900-1c-saas-basic-statements
objective: "1.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With SaaS, the provider is responsible for updating the application."
        fr: "Avec SaaS, le fournisseur est responsable de la mise à jour de l'application."
    - id: s2
      text:
        en: "With SaaS, you install and maintain the application on your own virtual machines."
        fr: "Avec SaaS, vous installez et entretenez l'application sur vos propres machines virtuelles."
    - id: s3
      text:
        en: "Of the three cloud service types, SaaS requires the least technical expertise to use."
        fr: "Des trois types de services cloud, SaaS est celui qui demande le moins d'expertise technique."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "With SaaS, the provider manages the infrastructure, the platform and the maintenance of the application, including its updates; you install nothing and simply use the application. This makes SaaS the easiest model to get up and running and the one that requires the least technical knowledge."
    fr: "Avec SaaS, le fournisseur gère l'infrastructure, la plateforme et la maintenance de l'application, mises à jour comprises ; vous n'installez rien et utilisez simplement l'application. SaaS est ainsi le modèle le plus simple à mettre en service et celui qui demande le moins de connaissances techniques."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
