id: az900-1b-price-free-account
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware wants to learn Azure and build a small prototype. Proseware has no budget for this work and expects to stay within the monthly free quantities of the services that it uses.

    Which option should Proseware use?
  fr: |
    Proseware veut découvrir Azure et construire un petit prototype. Proseware n'a aucun budget pour ce travail et pense rester dans les quantités mensuelles gratuites des services utilisés.

    Quelle option Proseware doit-elle utiliser ?
body:
  options:
  - id: a
    text:
      en: Azure free account
      fr: Le compte gratuit Azure
  - id: b
    text:
      en: Azure Spot Virtual Machines
      fr: Les machines virtuelles Azure Spot
  - id: c
    text:
      en: Azure Reservations
      fr: Les réservations Azure
  - id: d
    text:
      en: Azure savings plan for compute
      fr: "Le plan d'économies Azure pour le calcul"
answer:
  optionId: a
explanation:
  correct:
    en: "The Azure free account gives a credit to spend during the first 30 days, limited free quantities of some services for 12 months and services that are always free within limits. Usage that stays within these quantities isn't charged, which suits learning and prototypes."
    fr: "Le compte gratuit Azure donne un crédit à dépenser pendant les 30 premiers jours, des quantités gratuites limitées de certains services pendant 12 mois et des services toujours gratuits dans certaines limites. L'utilisation qui reste dans ces quantités n'est pas facturée, ce qui convient à l'apprentissage et aux prototypes."
  options:
    b:
      en: Spot virtual machines are cheaper than pay-as-you-go, but they are still billed.
      fr: "Les machines virtuelles Spot coûtent moins cher que le paiement à l'utilisation, mais elles restent facturées."
    c:
      en: A reservation is a paid commitment of one or three years, meant for stable workloads.
      fr: "Une réservation est un engagement payant d'un ou trois ans, destiné aux charges de travail stables."
    d:
      en: A savings plan is a paid commitment to an hourly amount for one or three years.
      fr: "Un plan d'économies est un engagement payant sur un montant horaire pendant un ou trois ans."
references:
- title: Create free services with Azure free account
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/manage/create-free-services
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
