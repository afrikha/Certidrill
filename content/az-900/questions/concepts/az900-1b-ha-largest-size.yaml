id: az900-1b-ha-largest-size
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The web tier of a Litware application runs on a single virtual machine that already uses the largest size available in its region. The load keeps growing. The application is stateless and can run on several virtual machines behind a load balancer.

    How should Litware add capacity?
  fr: |
    Le niveau web d'une application de Litware s'exécute sur une seule machine virtuelle qui utilise déjà la plus grande taille disponible dans sa région. La charge continue d'augmenter. L'application est sans état et peut s'exécuter sur plusieurs machines virtuelles derrière un équilibreur de charge.

    Comment Litware doit-elle ajouter de la capacité ?
body:
  options:
  - id: a
    text:
      en: Scale up the virtual machine
      fr: Effectuer un scale-up de la machine virtuelle
  - id: b
    text:
      en: Scale down the virtual machine
      fr: Effectuer un scale-down de la machine virtuelle
  - id: c
    text:
      en: Scale in the web tier
      fr: Effectuer un scale-in du niveau web
  - id: d
    text:
      en: Scale out the web tier
      fr: Effectuer un scale-out du niveau web
answer:
  optionId: d
explanation:
  correct:
    en: "Scaling out is horizontal scaling: it adds resources, here virtual machines behind the load balancer. Vertical scaling is limited by the largest size available, which the virtual machine has already reached, so adding instances is the only way to add capacity."
    fr: "Le scale-out est une mise à l'échelle horizontale : il ajoute des ressources, ici des machines virtuelles derrière l'équilibreur de charge. La mise à l'échelle verticale est limitée par la plus grande taille disponible, que la machine virtuelle a déjà atteinte : ajouter des instances est donc le seul moyen d'ajouter de la capacité."
  options:
    a:
      en: Scaling up gives more CPU or memory to the virtual machine, which is impossible when it already has the largest size available.
      fr: Le scale-up donne plus de processeur ou de mémoire à la machine virtuelle, ce qui est impossible quand elle a déjà la plus grande taille disponible.
    b:
      en: Scaling down reduces the CPU or memory of the virtual machine, which removes capacity.
      fr: Le scale-down réduit le processeur ou la mémoire de la machine virtuelle, ce qui retire de la capacité.
    c:
      en: Scaling in removes instances, which removes capacity.
      fr: Le scale-in retire des instances, ce qui retire de la capacité.
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
