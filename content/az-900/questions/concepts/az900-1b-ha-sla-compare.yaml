id: az900-1b-ha-sla-compare
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders compares two designs for the same application. Design 1 has a service-level agreement (SLA) of 99.9 %, and design 2 has an SLA of 99.99 %.

    Which statement is true?
  fr: |
    Northwind Traders compare deux conceptions pour la même application. La conception 1 a un contrat de niveau de service (SLA) de 99,9 %, et la conception 2 un SLA de 99,99 %.

    Quelle affirmation est vraie ?
body:
  options:
  - id: a
    text:
      en: Design 1 allows less downtime and generally requires more redundancy.
      fr: "La conception 1 autorise moins de temps d'arrêt et demande en général plus de redondance."
  - id: b
    text:
      en: Design 2 can serve ten times more users than design 1.
      fr: "La conception 2 peut servir dix fois plus d'utilisateurs que la conception 1."
  - id: c
    text:
      en: Design 2 allows less downtime and generally requires more redundancy.
      fr: "La conception 2 autorise moins de temps d'arrêt et demande en général plus de redondance."
  - id: d
    text:
      en: Both designs allow the same downtime, but design 2 responds faster.
      fr: "Les deux conceptions autorisent le même temps d'arrêt, mais la conception 2 répond plus vite."
answer:
  optionId: c
explanation:
  correct:
    en: "An SLA expresses availability as a guaranteed percentage of uptime: the higher the percentage, the less downtime is tolerated. Reaching a higher percentage takes more work, typically more redundant resources, so design 2 is the more demanding one."
    fr: "Un SLA exprime la disponibilité par un pourcentage garanti de temps de fonctionnement : plus le pourcentage est élevé, moins le temps d'arrêt toléré est long. Atteindre un pourcentage plus élevé demande plus de travail, en général davantage de ressources redondantes : la conception 2 est donc la plus exigeante."
  options:
    a:
      en: 99.9 % tolerates more downtime than 99.99 %, not less.
      fr: "99,9 % tolère plus de temps d'arrêt que 99,99 %, et non moins."
    b:
      en: An SLA percentage measures uptime, not the number of users that the application can serve; that is scalability.
      fr: "Le pourcentage d'un SLA mesure le temps de fonctionnement, pas le nombre d'utilisateurs que l'application peut servir ; cela relève de la scalabilité."
    d:
      en: The two percentages allow different amounts of downtime, and an uptime percentage says nothing about response time.
      fr: "Les deux pourcentages autorisent des temps d'arrêt différents, et un pourcentage de temps de fonctionnement ne dit rien du temps de réponse."
references:
