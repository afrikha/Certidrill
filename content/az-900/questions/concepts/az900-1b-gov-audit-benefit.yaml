id: az900-1b-gov-audit-benefit
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the cloud environment of Contoso, a feature audits the deployed resources and flags those that are out of compliance with the corporate standards.

    Which cloud benefit does this feature illustrate?
  fr: |
    Dans l'environnement cloud de Contoso, une fonctionnalité audite les ressources déployées et signale celles qui ne sont pas conformes aux normes de l'entreprise.

    Quel avantage du cloud cette fonctionnalité illustre-t-elle ?
body:
  options:
  - id: a
    text:
      en: Scalability
      fr: La scalabilité
  - id: b
    text:
      en: Governance
      fr: La gouvernance
  - id: c
    text:
      en: Reliability
      fr: La fiabilité
  - id: d
    text:
      en: High availability
      fr: La haute disponibilité
answer:
  optionId: b
explanation:
  correct:
    en: Governance is the set of cloud features that help you comply with corporate standards and regulations. Cloud-based auditing flags any resource that is out of compliance with your standards and provides mitigation strategies.
    fr: "La gouvernance est l'ensemble des fonctionnalités cloud qui vous aident à respecter les normes de l'entreprise et la réglementation. L'audit basé sur le cloud signale toute ressource non conforme à vos normes et propose des stratégies d'atténuation."
  options:
    a:
      en: Scalability is the ability to adjust resources to meet demand.
      fr: La scalabilité est la capacité à ajuster les ressources à la demande.
    c:
      en: Reliability is the ability to recover from failures and continue to function.
      fr: "La fiabilité est la capacité à se remettre d'une défaillance et à continuer de fonctionner."
    d:
      en: High availability is about resources staying accessible despite disruptions.
      fr: La haute disponibilité consiste à garder les ressources accessibles malgré les perturbations.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Overview of Azure Policy
  url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
