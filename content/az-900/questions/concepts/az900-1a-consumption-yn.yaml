id: az900-1a-consumption-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "In a consumption-based model, a company keeps paying for resources after it has released them."
        fr: "Dans un modèle basé sur la consommation, une entreprise continue de payer des ressources après les avoir libérées."
    - id: "s2"
      text:
        en: "The consumption-based model removes the need to purchase capacity that might go underutilized."
        fr: "Le modèle basé sur la consommation évite d'acheter de la capacité qui risque d'être sous-utilisée."
    - id: "s3"
      text:
        en: "To correct a capacity shortfall in a traditional datacenter, a company must order, install and provision additional hardware."
        fr: "Pour corriger un manque de capacité dans un centre de données classique, une entreprise doit commander, installer et provisionner du matériel supplémentaire."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "When you release resources in a consumption-based model, you stop paying for them, and you do not have to purchase capacity that may go underutilized. In a traditional datacenter, fixing a capacity shortfall requires ordering, installing and provisioning additional hardware."
    fr: "Lorsque vous libérez des ressources dans un modèle basé sur la consommation, vous cessez de les payer, et vous n'avez pas à acheter de la capacité qui risque d'être sous-utilisée. Dans un centre de données classique, corriger un manque de capacité impose de commander, d'installer et de provisionner du matériel supplémentaire."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
