id: az900-1a-capex-example
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which expense is an example of capital expenditure (CapEx)?
  fr: |
    Quelle dépense est un exemple de dépense d'investissement (CapEx) ?
body:
  options:
    - id: "a"
      text:
        en: "The monthly invoice for Azure virtual machines"
        fr: "La facture mensuelle des machines virtuelles Azure"
    - id: "b"
      text:
        en: "The purchase of network hardware for a datacenter"
        fr: "L'achat de matériel réseau pour un centre de données"
    - id: "c"
      text:
        en: "The monthly per-user subscription to Microsoft 365"
        fr: "L'abonnement mensuel par utilisateur à Microsoft 365"
    - id: "d"
      text:
        en: "The charge for the storage consumed during a month"
        fr: "Le coût du stockage consommé pendant un mois"
answer:
  optionId: "b"
explanation:
  correct:
    en: "Capital expenditure is upfront spending on physical infrastructure such as servers, network hardware and datacenter space. The three other expenses are ongoing spending on services over time, which is operational expenditure (OpEx)."
    fr: "Les dépenses d'investissement (CapEx) sont des dépenses initiales consacrées à une infrastructure physique : serveurs, matériel réseau, espace de centre de données. Les trois autres dépenses sont des dépenses continues consacrées à des services au fil du temps, c'est-à-dire des dépenses d'exploitation (OpEx)."
  options:
    a:
      en: "A monthly invoice for virtual machines pays for a service as it is consumed: an operational expenditure."
      fr: "Une facture mensuelle de machines virtuelles paie un service au fur et à mesure de sa consommation : c'est une dépense d'exploitation."
    c:
      en: "A monthly subscription is ongoing spending on a service: an operational expenditure."
      fr: "Un abonnement mensuel est une dépense continue consacrée à un service : c'est une dépense d'exploitation."
    d:
      en: "Storage that is billed according to consumption is an operational expenditure."
      fr: "Du stockage facturé selon la consommation est une dépense d'exploitation."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
