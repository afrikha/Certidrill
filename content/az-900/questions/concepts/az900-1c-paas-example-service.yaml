id: az900-1c-paas-example-service
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which service is an example of platform as a service (PaaS)?
  fr: |
    Quel service est un exemple de PaaS (platform as a service) ?
body:
  options:
    - id: a
      text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" }
    - id: b
      text: "Azure App Service"
    - id: c
      text: { en: "Azure Disk Storage", fr: "Stockage sur disque Azure" }
    - id: d
      text: "Microsoft 365"
answer: { optionId: b }
explanation:
  correct:
    en: "Azure App Service is a PaaS service: it runs web applications, mobile back ends and APIs without you managing the underlying infrastructure. You deploy the application; the platform takes care of the servers."
    fr: "Azure App Service est un service PaaS : il exécute des applications web, des back-ends mobiles et des API sans que vous gériez l'infrastructure sous-jacente. Vous déployez l'application ; la plateforme s'occupe des serveurs."
  options:
    a:
      en: "Azure Virtual Machines is IaaS: you manage the operating system and everything installed on it."
      fr: "Machines virtuelles Azure relève d'IaaS : vous gérez le système d'exploitation et tout ce qui y est installé."
    c:
      en: "Azure Disk Storage provides the disks of virtual machines; it is an IaaS building block."
      fr: "Stockage sur disque Azure fournit les disques des machines virtuelles ; c'est une brique IaaS."
    d:
      en: "Microsoft 365 is a ready-made application that you use as it is: SaaS."
      fr: "Microsoft 365 est une application toute faite que vous utilisez telle quelle : SaaS."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
  - title: App Service overview
    url: https://learn.microsoft.com/en-us/azure/app-service/overview
