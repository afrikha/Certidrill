id: az900-1b-price-spot-tradeoff
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs its nightly load tests on Azure Spot Virtual Machines to pay less than the pay-as-you-go price.

    What must Tailspin Toys accept in exchange for the lower price?
  fr: |
    Tailspin Toys exécute ses tests de charge nocturnes sur des machines virtuelles Azure Spot afin de payer moins cher que le prix du paiement à l'utilisation.

    Que doit accepter Tailspin Toys en échange de ce prix plus bas ?
body:
  options:
  - id: a
    text:
      en: A commitment to use the virtual machines for one year
      fr: "Un engagement d'un an sur l'utilisation des machines virtuelles"
  - id: b
    text:
      en: The eviction of the virtual machines when Azure needs the capacity back
      fr: "L'éviction des machines virtuelles lorsque Azure a besoin de récupérer la capacité"
  - id: c
    text:
      en: A fixed amount to spend on compute every hour for three years
      fr: Un montant fixe à dépenser en calcul chaque heure pendant trois ans
  - id: d
    text:
      en: The obligation to bring its own Windows Server licenses
      fr: "L'obligation d'apporter ses propres licences Windows Server"
answer:
  optionId: b
explanation:
  correct:
    en: "Spot pricing sells Azure's unused capacity at a lower price. In return, Azure can take the capacity back at any time and evict the virtual machines, so Spot suits only workloads that tolerate interruptions, such as tests or batch jobs."
    fr: "La tarification Spot vend la capacité inutilisée d'Azure à un prix plus bas. En contrepartie, Azure peut reprendre cette capacité à tout moment et évincer les machines virtuelles : Spot ne convient donc qu'aux charges de travail qui tolèrent les interruptions, comme des tests ou des traitements par lots."
  options:
    a:
      en: A one-year or three-year commitment is what a reservation requires, not Spot pricing.
      fr: "Un engagement d'un ou trois ans est ce qu'exige une réservation, pas la tarification Spot."
    c:
      en: Committing to an hourly amount for one or three years describes an Azure savings plan for compute.
      fr: "S'engager sur un montant horaire pendant un ou trois ans décrit un plan d'économies Azure pour le calcul."
    d:
      en: Reusing existing licenses is Azure Hybrid Benefit, an optional way to lower costs that has no link with Spot pricing.
      fr: Réutiliser des licences existantes correspond à Azure Hybrid Benefit, un moyen facultatif de réduire les coûts, sans rapport avec la tarification Spot.
references:
- title: About Azure Spot Virtual Machines
  url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
