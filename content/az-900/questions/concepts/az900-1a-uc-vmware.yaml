id: az900-1a-uc-vmware
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs its applications on VMware vSphere in a private cloud. Wingtip wants to move these workloads to Azure and keep running them on VMware, without converting the virtual machines.

    Which Azure service should Wingtip use?
  fr: |
    Wingtip Toys exécute ses applications sur VMware vSphere dans un cloud privé. Wingtip veut déplacer ces charges de travail vers Azure et continuer à les exécuter sur VMware, sans convertir les machines virtuelles.

    Quel service Azure Wingtip doit-elle utiliser ?
body:
  options:
    - id: "a"
      text: "Azure Arc"
    - id: "b"
      text:
        en: "Azure Virtual Machines"
        fr: "Machines virtuelles Azure"
    - id: "c"
      text: "Azure VMware Solution"
    - id: "d"
      text: "Azure App Service"
answer:
  optionId: "c"
explanation:
  correct:
    en: "Azure VMware Solution runs VMware workloads in Azure, on VMware vSphere clusters built from dedicated Azure infrastructure. A company that is established with VMware in a private cloud can move its workloads to Azure and keep the same platform."
    fr: "Azure VMware Solution exécute des charges de travail VMware dans Azure, sur des clusters VMware vSphere reposant sur une infrastructure Azure dédiée. Une entreprise déjà équipée de VMware dans un cloud privé peut déplacer ses charges de travail vers Azure en conservant la même plateforme."
  options:
    a:
      en: "Azure Arc manages resources located outside Azure from Azure; it does not host workloads."
      fr: "Azure Arc gère depuis Azure des ressources situées hors d'Azure ; il n'héberge pas de charges de travail."
    b:
      en: "Moving to Azure Virtual Machines means converting the VMware virtual machines to Azure virtual machines, which Wingtip wants to avoid."
      fr: "Passer au service Machines virtuelles Azure suppose de convertir les machines virtuelles VMware en machines virtuelles Azure, ce que Wingtip veut éviter."
    d:
      en: "Azure App Service hosts web applications as a platform service; it does not run VMware virtual machines."
      fr: "Azure App Service héberge des applications web en tant que service de plateforme ; il n'exécute pas de machines virtuelles VMware."
references:
  - title: "What is Azure VMware Solution?"
    url: "https://learn.microsoft.com/en-us/azure/azure-vmware/introduction"
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
