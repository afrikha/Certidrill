id: az900-1a-sr-shift-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "When a company moves a workload from IaaS to PaaS, responsibility for the data of the workload moves to the cloud provider."
        fr: "Lorsqu'une entreprise fait passer une charge de travail d'IaaS à PaaS, la responsabilité des données de cette charge de travail passe au fournisseur de cloud."
    - id: "s2"
      text:
        en: "Network controls are the responsibility of the customer in IaaS and of the cloud provider in SaaS."
        fr: "Les contrôles réseau relèvent de la responsabilité du client en IaaS et de celle du fournisseur de cloud en SaaS."
    - id: "s3"
      text:
        en: "In PaaS, the cloud provider is responsible for the operating system."
        fr: "En PaaS, le fournisseur de cloud est responsable du système d'exploitation."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "The customer is always responsible for its data, in IaaS as in PaaS, so moving to PaaS does not transfer that responsibility. Network controls belong to the customer in IaaS, are shared in PaaS and belong to the provider in SaaS. The operating system is the customer's responsibility in IaaS only: in PaaS and SaaS, the provider manages it."
    fr: "Le client est toujours responsable de ses données, en IaaS comme en PaaS : le passage à PaaS ne transfère donc pas cette responsabilité. Les contrôles réseau relèvent du client en IaaS, sont partagés en PaaS et relèvent du fournisseur en SaaS. Le système d'exploitation n'est à la charge du client qu'en IaaS : en PaaS et en SaaS, c'est le fournisseur qui le gère."
references:
  - title: "Shared responsibility in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
