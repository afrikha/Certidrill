id: az900-1b-sls-yn-scope
objective: "1.1.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A serverless application that receives no event can scale down to zero instances.
      fr: Une application serverless qui ne reçoit aucun événement peut descendre à zéro instance.
  - id: s2
    text:
      en: Moving an application from virtual machines to a serverless service transfers the responsibility for its data to the cloud provider.
      fr: Déplacer une application de machines virtuelles vers un service serverless transfère au fournisseur de cloud la responsabilité de ses données.
  - id: s3
    text:
      en: An Azure function can be triggered by a timer as well as by a message from another Azure service.
      fr: "Une fonction Azure peut être déclenchée par un minuteur aussi bien que par un message provenant d'un autre service Azure."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "Serverless platforms follow the events to process: instances are added when events arrive and removed afterwards, down to zero. A function reacts to an event, which is often a REST request, a timer or a message from another Azure service. Serverless reduces what you manage, but in the shared responsibility model the customer always remains responsible for its information and data."
    fr: "Les plateformes serverless suivent les événements à traiter : des instances sont ajoutées quand des événements arrivent et retirées ensuite, jusqu'à zéro. Une fonction réagit à un événement, souvent une requête REST, un minuteur ou un message d'un autre service Azure. Le serverless réduit ce que vous gérez, mais dans le modèle de responsabilité partagée le client reste toujours responsable de ses informations et de ses données."
  options:
    s2:
      en: Whatever the service type, the customer stays responsible for its data; serverless only removes the management of servers.
      fr: Quel que soit le type de service, le client reste responsable de ses données ; le serverless ne supprime que la gestion des serveurs.
references:
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
