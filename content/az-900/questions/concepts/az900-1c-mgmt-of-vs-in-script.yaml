id: az900-1c-mgmt-of-vs-in-script
objective: "1.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Each morning, the operations team at Litware runs a PowerShell script. The script deploys test environments from a preconfigured template.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chaque matin, l'équipe d'exploitation de Litware exécute un script PowerShell. Le script déploie des environnements de test à partir d'un modèle préconfiguré.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Using PowerShell to manage the resources is an example of management in the cloud."
        fr: "L'utilisation de PowerShell pour gérer les ressources est un exemple de gestion dans le cloud."
    - id: s2
      text:
        en: "Deploying resources from a preconfigured template is an example of management in the cloud."
        fr: "Le déploiement de ressources à partir d'un modèle préconfiguré est un exemple de gestion dans le cloud."
    - id: s3
      text:
        en: "This approach helps keep the configuration of the test environments consistent."
        fr: "Cette approche aide à garder une configuration cohérente des environnements de test."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Management in the cloud is about the way you interact with the environment: a web portal, a command-line interface, APIs or PowerShell. Template-based deployment belongs to management of the cloud, together with automatic scaling, health monitoring and alerts. Combining templates and scripts reduces manual effort and helps maintain consistent configurations."
    fr: "La gestion dans le cloud porte sur la façon dont vous interagissez avec l'environnement : un portail web, une interface de ligne de commande, des API ou PowerShell. Le déploiement à partir d'un modèle relève de la gestion du cloud, avec la mise à l'échelle automatique, la surveillance de l'intégrité et les alertes. Associer modèles et scripts réduit l'effort manuel et aide à maintenir des configurations cohérentes."
  options:
    s2:
      en: "Templates are listed under management of the cloud (managing your cloud resources), not under management in the cloud (the tools you use)."
      fr: "Les modèles figurent dans la gestion du cloud (la gestion de vos ressources cloud), pas dans la gestion dans le cloud (les outils que vous utilisez)."
references:
  - title: Describe the benefits of manageability in the cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
