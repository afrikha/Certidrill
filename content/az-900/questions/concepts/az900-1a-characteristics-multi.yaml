id: az900-1a-characteristics-multi
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe cloud computing?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui décrivent le cloud computing ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: "a"
      text:
        en: "Capacity is limited to the hardware that the customer has purchased."
        fr: "La capacité est limitée au matériel que le client a acheté."
    - id: "b"
      text:
        en: "Computing services are delivered over the internet."
        fr: "Les services informatiques sont fournis sur Internet."
    - id: "c"
      text:
        en: "The customer is responsible for the physical security of the datacenter."
        fr: "Le client est responsable de la sécurité physique du centre de données."
    - id: "d"
      text:
        en: "Capacity can be added without waiting for a datacenter to be built."
        fr: "De la capacité peut être ajoutée sans attendre la construction d'un centre de données."
    - id: "e"
      text:
        en: "Adding capacity requires hardware to be installed on the customer's premises."
        fr: "L'ajout de capacité impose d'installer du matériel dans les locaux du client."
answer:
  optionIds: ["b", "d"]
explanation:
  correct:
    en: "Cloud computing delivers computing services over the internet. Because the provider already runs the infrastructure, a company can expand its IT footprint rapidly without waiting for a datacenter to be built."
    fr: "Le cloud computing fournit des services informatiques sur Internet. Comme le fournisseur exploite déjà l'infrastructure, une entreprise peut étendre rapidement son empreinte informatique sans attendre la construction d'un centre de données."
  options:
    a:
      en: "In the cloud, capacity is not constrained by hardware that the customer owns; more can be added on demand."
      fr: "Dans le cloud, la capacité n'est pas contrainte par du matériel appartenant au client ; il est possible d'en ajouter à la demande."
    c:
      en: "Physical security of the datacenter is the cloud provider's responsibility."
      fr: "La sécurité physique du centre de données relève de la responsabilité du fournisseur de cloud."
    e:
      en: "Installing hardware on the premises describes a traditional datacenter; cloud capacity is provisioned on demand in the provider's infrastructure."
      fr: "Installer du matériel dans les locaux décrit un centre de données classique ; la capacité cloud est provisionnée à la demande dans l'infrastructure du fournisseur."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
