id: az900-1b-ha-peak-benefit
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every December, the traffic of the Wingtip Toys online store is ten times higher than during the rest of the year. Wingtip Toys adds resources for December and removes them in January, so that it pays only for what it uses.

    Which cloud benefit does this scenario illustrate?
  fr: |
    Chaque mois de décembre, le trafic de la boutique en ligne de Wingtip Toys est dix fois plus élevé que le reste de l'année. Wingtip Toys ajoute des ressources pour décembre et les retire en janvier, afin de ne payer que ce qu'elle utilise.

    Quel avantage du cloud ce scénario illustre-t-il ?
body:
  options:
  - id: a
    text:
      en: High availability
      fr: La haute disponibilité
  - id: b
    text:
      en: Scalability
      fr: La scalabilité
  - id: c
    text:
      en: Governance
      fr: La gouvernance
  - id: d
    text:
      en: Reliability
      fr: La fiabilité
answer:
  optionId: b
explanation:
  correct:
    en: "Scalability is the ability to adjust resources to meet demand: you add resources when traffic peaks and remove them when it drops. Because the cloud is billed on consumption, releasing the resources also stops their cost."
    fr: "La scalabilité est la capacité à ajuster les ressources à la demande : vous ajoutez des ressources quand le trafic atteint un pic et vous les retirez quand il retombe. Comme le cloud est facturé à la consommation, libérer les ressources arrête aussi leur coût."
  options:
    a:
      en: High availability is about resources staying accessible despite disruptions, not about following a variation in demand.
      fr: La haute disponibilité consiste à garder les ressources accessibles malgré les perturbations, pas à suivre une variation de la demande.
    c:
      en: Governance is about complying with corporate standards and regulations.
      fr: "La gouvernance concerne le respect des normes de l'entreprise et de la réglementation."
    d:
      en: Reliability is the ability to recover from failures and continue to function; no failure occurs in this scenario.
      fr: "La fiabilité est la capacité à se remettre d'une défaillance et à continuer de fonctionner ; ce scénario ne comporte aucune défaillance."
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- title: Describe the consumption-based model
  url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
