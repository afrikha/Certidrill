id: az900-1a-uc-surge
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs its order system in a private cloud that is sized for normal demand. For two weeks each year, demand exceeds the capacity of the private cloud.

    Northwind wants to absorb this peak without buying hardware and to pay for the additional capacity only during the peak.

    What should Northwind do?
  fr: |
    Northwind Traders exécute son système de commandes dans un cloud privé dimensionné pour la demande normale. Deux semaines par an, la demande dépasse la capacité du cloud privé.

    Northwind veut absorber ce pic sans acheter de matériel et ne payer la capacité supplémentaire que pendant le pic.

    Que doit faire Northwind ?
body:
  options:
    - id: "a"
      text:
        en: "Use public cloud resources to extend the private cloud during the peak."
        fr: "Utiliser des ressources de cloud public pour étendre le cloud privé pendant le pic."
    - id: "b"
      text:
        en: "Add hosts to the private cloud a few weeks before each yearly peak."
        fr: "Ajouter des hôtes au cloud privé quelques semaines avant chaque pic annuel."
    - id: "c"
      text:
        en: "Move the order system to a larger private cloud that a third party hosts."
        fr: "Déplacer le système de commandes vers un cloud privé plus grand hébergé par un tiers."
    - id: "d"
      text:
        en: "Replace the private cloud with a larger datacenter that Northwind owns."
        fr: "Remplacer le cloud privé par un centre de données plus grand appartenant à Northwind."
answer:
  optionId: "a"
explanation:
  correct:
    en: "A hybrid cloud lets a private cloud surge for increased, temporary demand by deploying public cloud resources. Northwind pays for the additional capacity only while it uses it and buys no hardware."
    fr: "Un cloud hybride permet à un cloud privé d'absorber une hausse temporaire de la demande en déployant des ressources de cloud public. Northwind ne paie la capacité supplémentaire que pendant son utilisation et n'achète aucun matériel."
  options:
    b:
      en: "Adding hosts means buying hardware that stays idle for the rest of the year."
      fr: "Ajouter des hôtes revient à acheter du matériel qui reste inutilisé le reste de l'année."
    c:
      en: "A larger private cloud is still dedicated capacity, sized for the peak and paid for all year, even if a third party hosts it."
      fr: "Un cloud privé plus grand reste une capacité dédiée, dimensionnée pour le pic et payée toute l'année, même si un tiers l'héberge."
    d:
      en: "A larger datacenter is a capital expenditure sized for a peak that lasts two weeks."
      fr: "Un centre de données plus grand est une dépense d'investissement dimensionnée pour un pic de deux semaines."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
