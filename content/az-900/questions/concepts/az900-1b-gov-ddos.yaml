id: az900-1b-gov-ddos
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys moves its public website from its own datacenter to the cloud.

    Which security benefit does Tailspin Toys obtain from the move?
  fr: |
    Tailspin Toys déplace son site web public de son propre centre de données vers le cloud.

    Quel avantage de sécurité Tailspin Toys obtient-elle grâce à ce déplacement ?
body:
  options:
  - id: a
    text:
      en: The cloud provider becomes responsible for the data of Tailspin Toys.
      fr: Le fournisseur de cloud devient responsable des données de Tailspin Toys.
  - id: b
    text:
      en: The cloud provider manages the user accounts of Tailspin Toys.
      fr: "Le fournisseur de cloud gère les comptes d'utilisateurs de Tailspin Toys."
  - id: c
    text:
      en: The cloud provider secures the laptops of the employees of Tailspin Toys.
      fr: Le fournisseur de cloud sécurise les ordinateurs portables des employés de Tailspin Toys.
  - id: d
    text:
      en: The cloud provider helps to absorb distributed denial-of-service (DDoS) attacks on the website.
      fr: Le fournisseur de cloud aide à absorber les attaques par déni de service distribué (DDoS) contre le site web.
answer:
  optionId: d
explanation:
  correct:
    en: Cloud providers are typically well suited to handle distributed denial-of-service (DDoS) attacks, which makes the network more robust and secure. The other options describe responsibilities that always stay with the customer in the shared responsibility model.
    fr: Les fournisseurs de cloud sont en général bien armés pour faire face aux attaques par déni de service distribué (DDoS), ce qui rend le réseau plus robuste et plus sûr. Les autres options décrivent des responsabilités qui restent toujours au client dans le modèle de responsabilité partagée.
  options:
    a:
      en: The customer always remains responsible for its information and data, whatever the service type.
      fr: Le client reste toujours responsable de ses informations et de ses données, quel que soit le type de service.
    b:
      en: Accounts and identities always remain the responsibility of the customer.
      fr: Les comptes et les identités restent toujours sous la responsabilité du client.
    c:
      en: The devices that connect to the cloud always remain the responsibility of the customer.
      fr: Les appareils qui se connectent au cloud restent toujours sous la responsabilité du client.
references:
- title: Describe the benefits of security and governance in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- title: Shared responsibility in the cloud
  url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
