id: az900-1a-cloud-definition
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement defines cloud computing?
  fr: |
    Quelle affirmation définit le cloud computing ?
body:
  options:
    - id: "a"
      text:
        en: "The virtualization of servers in a company's own server room"
        fr: "La virtualisation de serveurs dans la salle des serveurs d'une entreprise"
    - id: "b"
      text:
        en: "The leasing of physical servers installed in a company's offices"
        fr: "La location de serveurs physiques installés dans les bureaux d'une entreprise"
    - id: "c"
      text:
        en: "The delivery of computing services over the internet"
        fr: "La fourniture de services informatiques sur Internet"
    - id: "d"
      text:
        en: "The storage of a company's files on its employees' devices"
        fr: "Le stockage des fichiers d'une entreprise sur les appareils de ses employés"
answer:
  optionId: "c"
explanation:
  correct:
    en: "Cloud computing is the delivery of computing services over the internet: virtual machines, storage, databases and networking, as well as services such as IoT, machine learning and AI. The customer uses these services without owning the hardware that runs them."
    fr: "Le cloud computing consiste à fournir des services informatiques sur Internet : machines virtuelles, stockage, bases de données et réseau, ainsi que des services comme l'IoT, le machine learning et l'IA. Le client utilise ces services sans posséder le matériel qui les exécute."
  options:
    a:
      en: "Servers virtualized in a company's own server room remain infrastructure that the company owns and operates; no service is delivered by a provider over the internet."
      fr: "Des serveurs virtualisés dans la salle des serveurs de l'entreprise restent une infrastructure que l'entreprise possède et exploite ; aucun service n'est fourni par un fournisseur sur Internet."
    b:
      en: "Leased servers installed in the company's offices are still physical infrastructure that the company hosts and runs itself."
      fr: "Des serveurs loués installés dans les bureaux de l'entreprise restent une infrastructure physique qu'elle héberge et exploite elle-même."
    d:
      en: "Keeping files on local devices does not involve any computing service delivered over the internet."
      fr: "Conserver des fichiers sur des appareils locaux ne fait appel à aucun service informatique fourni sur Internet."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
