id: az900-1b-rel-pricing-calculator
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans a new solution in Azure. Before deploying anything, Adatum must estimate what the solution will cost each month.

    What should Adatum use?
  fr: |
    Adatum prépare une nouvelle solution dans Azure. Avant de déployer quoi que ce soit, Adatum doit estimer ce que la solution coûtera chaque mois.

    Que doit utiliser Adatum ?
body:
  options:
  - id: a
    text: Azure Service Health
  - id: b
    text:
      en: Cost analysis in Microsoft Cost Management
      fr: "L'analyse des coûts dans Microsoft Cost Management"
  - id: c
    text: Azure Policy
  - id: d
    text:
      en: The Azure pricing calculator
      fr: La calculatrice de prix Azure
answer:
  optionId: d
explanation:
  correct:
    en: The Azure pricing calculator estimates the cost of services that you plan to deploy, which supports cost predictability. You configure the planned resources and obtain an estimate before anything is created.
    fr: La calculatrice de prix Azure estime le coût des services que vous prévoyez de déployer, ce qui sert la prévisibilité des coûts. Vous configurez les ressources prévues et obtenez une estimation avant toute création.
  options:
    a:
      en: Service Health informs you about incidents and planned maintenance of Azure services; it gives no cost estimate.
      fr: Service Health vous informe des incidents et de la maintenance planifiée des services Azure ; il ne donne aucune estimation de coût.
    b:
      en: "Cost analysis explores the costs of resources that already exist in your subscriptions, not of a solution that isn't deployed yet."
      fr: "L'analyse des coûts explore les coûts de ressources qui existent déjà dans vos abonnements, pas ceux d'une solution qui n'est pas encore déployée."
    c:
      en: "Azure Policy enforces organizational standards on resources; it doesn't estimate prices."
      fr: "Azure Policy applique les normes de l'organisation aux ressources ; il n'estime pas de prix."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- title: Overview of Cost Management
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
