id: az900-1c-paas-control-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "PaaS gives you more control over the operating system than IaaS does."
        fr: "PaaS vous donne davantage de contrôle sur le système d'exploitation qu'IaaS."
    - id: s2
      text:
        en: "PaaS is a fully developed application that you rent and use as it is."
        fr: "PaaS est une application entièrement développée que vous louez et utilisez telle quelle."
    - id: s3
      text:
        en: "Azure Functions is an example of a PaaS service."
        fr: "Azure Functions est un exemple de service PaaS."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "IaaS gives the maximum control, including over the operating system; with PaaS the provider maintains the operating system. A fully developed application that you rent describes SaaS, whereas PaaS is a platform on which you deploy your own application. Azure Functions, a serverless service in which you deploy code without managing servers, is one of the PaaS examples that Microsoft gives."
    fr: "IaaS donne le contrôle maximal, y compris sur le système d'exploitation ; avec PaaS, le fournisseur entretient le système d'exploitation. Une application entièrement développée que vous louez décrit SaaS, alors que PaaS est une plateforme sur laquelle vous déployez votre propre application. Azure Functions, service serverless où vous déployez du code sans gérer de serveurs, fait partie des exemples de PaaS que donne Microsoft."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
