id: az900-1b-price-savings-plan
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs compute workloads in Azure continuously and expects to do so for the next three years. During that period, Woodgrove Bank plans to change virtual machine sizes, move workloads to other regions and migrate some of them to Azure Container Apps.

    Woodgrove Bank wants a discount in exchange for a commitment. The discount must continue to apply automatically when these changes occur.

    What should Woodgrove Bank use?
  fr: |
    Woodgrove Bank exécute en continu des charges de travail de calcul dans Azure et prévoit de continuer pendant les trois prochaines années. Sur cette période, Woodgrove Bank compte changer la taille de machines virtuelles, déplacer des charges de travail vers d'autres régions et en migrer certaines vers Azure Container Apps.

    Woodgrove Bank veut une remise en échange d'un engagement. La remise doit continuer à s'appliquer automatiquement lorsque ces changements se produisent.

    Que doit utiliser Woodgrove Bank ?
body:
  options:
  - id: a
    text:
      en: Azure Reservations for virtual machines
      fr: Des réservations Azure pour les machines virtuelles
  - id: b
    text:
      en: Azure Spot Virtual Machines
      fr: Des machines virtuelles Azure Spot
  - id: c
    text: Azure Hybrid Benefit
  - id: d
    text:
      en: An Azure savings plan for compute
      fr: "Un plan d'économies Azure pour le calcul"
answer:
  optionId: d
explanation:
  correct:
    en: With an Azure savings plan for compute, you commit to spend a fixed amount per hour on eligible compute services for one or three years. The lower prices apply automatically across eligible services, such as virtual machines and Azure Container Apps, and across regions, so the discount follows the workloads when they change.
    fr: "Avec un plan d'économies Azure pour le calcul, vous vous engagez à dépenser un montant horaire fixe sur les services de calcul éligibles pendant un ou trois ans. Les prix réduits s'appliquent automatiquement aux services éligibles, comme les machines virtuelles et Azure Container Apps, quelle que soit la région : la remise suit donc les charges de travail quand elles changent."
  options:
    a:
      en: A reservation is a commitment to a specific resource type, size and region. It suits stable usage, not workloads that change size, region and service.
      fr: Une réservation est un engagement sur un type de ressource, une taille et une région précis. Elle convient à une utilisation stable, pas à des charges de travail qui changent de taille, de région et de service.
    b:
      en: "Spot pricing isn't a commitment, and Azure can evict the virtual machines when it needs the capacity back."
      fr: "La tarification Spot n'est pas un engagement, et Azure peut évincer les machines virtuelles lorsqu'il a besoin de récupérer la capacité."
    c:
      en: "Azure Hybrid Benefit reuses existing licenses to lower costs; it isn't a discount given for a commitment."
      fr: "Azure Hybrid Benefit réutilise des licences existantes pour réduire les coûts ; ce n'est pas une remise accordée contre un engagement."
references:
- title: What are savings plans?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
