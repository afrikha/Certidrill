id: az900-1a-costs-follow-activity
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys earns most of its revenue in the last quarter of the year. The CFO wants IT costs to rise and fall with business activity, instead of a large investment every five years.

    Which approach meets this goal?
  fr: |
    Wingtip Toys réalise l'essentiel de son chiffre d'affaires au dernier trimestre de l'année. Le directeur financier veut que les coûts informatiques augmentent et diminuent avec l'activité, au lieu d'un gros investissement tous les cinq ans.

    Quelle approche répond à cet objectif ?
body:
  options:
    - id: "a"
      text:
        en: "Use cloud services that are billed under the consumption-based model."
        fr: "Utiliser des services cloud facturés selon le modèle basé sur la consommation."
    - id: "b"
      text:
        en: "Buy servers for the datacenter and depreciate them over five years."
        fr: "Acheter des serveurs pour le centre de données et les amortir sur cinq ans."
    - id: "c"
      text:
        en: "Rent a fixed amount of space in a hosting facility on an annual contract."
        fr: "Louer une surface fixe chez un hébergeur avec un contrat annuel."
    - id: "d"
      text:
        en: "Build a private cloud in a new datacenter that the company owns."
        fr: "Construire un cloud privé dans un nouveau centre de données appartenant à l'entreprise."
answer:
  optionId: "a"
explanation:
  correct:
    en: "With the consumption-based model, Wingtip adds resources when demand increases and releases them when demand decreases, so the bill follows business activity. Cloud services are an operational expenditure with no upfront cost."
    fr: "Avec le modèle basé sur la consommation, Wingtip ajoute des ressources quand la demande augmente et les libère quand elle diminue : la facture suit donc l'activité. Les services cloud sont une dépense d'exploitation sans coût initial."
  options:
    b:
      en: "Buying servers is a capital expenditure whose cost does not vary with activity."
      fr: "L'achat de serveurs est une dépense d'investissement dont le coût ne varie pas avec l'activité."
    c:
      en: "A fixed annual contract costs the same whatever the level of activity."
      fr: "Un contrat annuel fixe coûte la même chose quel que soit le niveau d'activité."
    d:
      en: "Building a private cloud requires hardware purchases, that is, a large upfront investment."
      fr: "Construire un cloud privé impose des achats de matériel, c'est-à-dire un gros investissement initial."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
