id: az900-1a-consumption-def
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the consumption-based model of cloud computing?
  fr: |
    Quelle affirmation décrit le modèle basé sur la consommation du cloud computing ?
body:
  options:
    - id: "a"
      text:
        en: "You pay a fixed annual fee, whatever resources you use."
        fr: "Vous payez un forfait annuel fixe, quelles que soient les ressources utilisées."
    - id: "b"
      text:
        en: "You pay in advance for the peak capacity that you estimate."
        fr: "Vous payez à l'avance la capacité de pointe que vous estimez."
    - id: "c"
      text:
        en: "You purchase the hardware, and the provider operates it."
        fr: "Vous achetez le matériel, et le fournisseur l'exploite."
    - id: "d"
      text:
        en: "You pay for the IT resources that you use, and nothing more."
        fr: "Vous payez les ressources informatiques que vous utilisez, et rien de plus."
answer:
  optionId: "d"
explanation:
  correct:
    en: "Cloud computing operates on a consumption-based model: you pay for the IT resources you use, and nothing more. Instead of buying and maintaining infrastructure, you rent compute power and storage and release them when you are done."
    fr: "Le cloud computing fonctionne selon un modèle basé sur la consommation : vous payez les ressources informatiques que vous utilisez, et rien de plus. Au lieu d'acheter et d'entretenir une infrastructure, vous louez de la puissance de calcul et du stockage, puis vous les libérez quand vous avez terminé."
  options:
    a:
      en: "A fixed fee that ignores usage is the opposite of a consumption-based model, in which the bill follows what you use."
      fr: "Un forfait fixe indépendant de l'utilisation est l'inverse d'un modèle basé sur la consommation, dans lequel la facture suit ce que vous utilisez."
    b:
      en: "Paying in advance for an estimated peak describes capacity planning in a traditional datacenter."
      fr: "Payer à l'avance un pic estimé décrit la planification de capacité d'un centre de données classique."
    c:
      en: "Purchasing hardware is an upfront cost; the consumption-based model has none."
      fr: "L'achat de matériel est un coût initial ; le modèle basé sur la consommation n'en comporte aucun."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
