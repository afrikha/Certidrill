id: az900-1a-cloud-subtle-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "Workloads that run in the cloud no longer rely on physical servers."
        fr: "Les charges de travail exécutées dans le cloud ne reposent plus sur des serveurs physiques."
    - id: "s2"
      text:
        en: "A company that uses cloud computing can still be responsible for updating operating systems."
        fr: "Une entreprise qui utilise le cloud computing peut rester responsable de la mise à jour de systèmes d'exploitation."
    - id: "s3"
      text:
        en: "Only companies that have no on-premises datacenter can use cloud services."
        fr: "Seules les entreprises sans centre de données local peuvent utiliser des services cloud."
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: "Cloud services still run on physical hosts: they belong to the provider, which maintains them in its datacenters. Depending on the service type, some tasks stay with the customer; on a virtual machine (IaaS), the customer updates the operating system. A company that owns a datacenter can use cloud services as well, which is what a hybrid cloud does."
    fr: "Les services cloud s'exécutent toujours sur des hôtes physiques : ils appartiennent au fournisseur, qui les entretient dans ses centres de données. Selon le type de service, certaines tâches restent à la charge du client ; sur une machine virtuelle (IaaS), le client met à jour le système d'exploitation. Une entreprise qui possède un centre de données peut elle aussi utiliser des services cloud : c'est le principe du cloud hybride."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
