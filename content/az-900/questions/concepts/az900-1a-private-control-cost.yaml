id: az900-1a-private-control-cost
objective: "1.1.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    How does a private cloud compare with a public cloud?
  fr: |
    Comment un cloud privé se compare-t-il à un cloud public ?
body:
  options:
    - id: "a"
      text:
        en: "It provides less control, at a lower cost."
        fr: "Il offre moins de contrôle, pour un coût inférieur."
    - id: "b"
      text:
        en: "It provides less control, at a greater cost."
        fr: "Il offre moins de contrôle, pour un coût supérieur."
    - id: "c"
      text:
        en: "It provides more control, at a lower cost."
        fr: "Il offre plus de contrôle, pour un coût inférieur."
    - id: "d"
      text:
        en: "It provides more control, at a greater cost."
        fr: "Il offre plus de contrôle, pour un coût supérieur."
answer:
  optionId: "d"
explanation:
  correct:
    en: "A private cloud keeps resources dedicated to one organization, which gives its IT team much greater control. That control comes with a greater cost, because hardware must be purchased and maintained, and with fewer of the benefits of a public cloud."
    fr: "Un cloud privé réserve les ressources à une seule organisation, ce qui donne à son équipe informatique un contrôle bien plus grand. Ce contrôle s'accompagne d'un coût supérieur, car le matériel doit être acheté et entretenu, et de moins d'avantages que ceux d'un cloud public."
  options:
    a:
      en: "A private cloud gives more control than a public cloud, and it costs more: hardware must be purchased and maintained."
      fr: "Un cloud privé offre plus de contrôle qu'un cloud public, et il coûte plus cher : le matériel doit être acheté et entretenu."
    b:
      en: "A private cloud does cost more, but it provides more control, because its resources are dedicated to the organization."
      fr: "Un cloud privé coûte effectivement plus cher, mais il offre plus de contrôle, car ses ressources sont dédiées à l'organisation."
    c:
      en: "The additional control has a price: hardware to purchase for startup and then to maintain."
      fr: "Ce contrôle supplémentaire a un prix : du matériel à acheter au démarrage, puis à entretenir."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
