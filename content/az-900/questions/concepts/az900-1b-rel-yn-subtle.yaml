id: az900-1b-rel-yn-subtle
objective: "1.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A reliable system is a system in which no failure ever occurs.
      fr: Un système fiable est un système dans lequel aucune défaillance ne se produit jamais.
  - id: s2
    text:
      en: High availability contributes to performance predictability.
      fr: La haute disponibilité contribue à la prévisibilité des performances.
  - id: s3
    text:
      en: The Azure pricing calculator shows the charges already billed to a subscription.
      fr: La calculatrice de prix Azure affiche les frais déjà facturés à un abonnement.
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: "Reliability doesn't mean the absence of failures: it is the ability to recover from them and continue to function. Performance predictability is supported by autoscaling, load balancing and high availability. The pricing calculator serves cost predictability by estimating the cost of what you plan to deploy."
    fr: "La fiabilité ne signifie pas l'absence de défaillances : c'est la capacité à s'en remettre et à continuer de fonctionner. La prévisibilité des performances s'appuie sur la mise à l'échelle automatique, l'équilibrage de charge et la haute disponibilité. La calculatrice de prix sert la prévisibilité des coûts en estimant le coût de ce que vous prévoyez de déployer."
  options:
    s1:
      en: Failures are expected. A reliable system recovers from them and continues to function.
      fr: "Les défaillances sont attendues. Un système fiable s'en remet et continue de fonctionner."
    s3:
      en: The pricing calculator gives an estimate for planned resources. Actual charges are shown by cost analysis in Microsoft Cost Management.
      fr: "La calculatrice de prix donne une estimation pour des ressources prévues. Les frais réels sont affichés par l'analyse des coûts dans Microsoft Cost Management."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- title: Overview of Cost Management
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
