id: az900-1c-iaas-vm-database-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam plans to move its on-premises servers to Azure virtual machines. One of the virtual machines will run only a database server that Fabrikam installs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déplacer ses serveurs locaux vers des machines virtuelles Azure. L'une des machines virtuelles exécutera uniquement un serveur de base de données installé par Fabrikam.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After the move, Fabrikam no longer has to maintain physical server hardware for these workloads."
        fr: "Après le déplacement, Fabrikam n'a plus à entretenir de matériel serveur physique pour ces charges de travail."
    - id: s2
      text:
        en: "The virtual machine that runs only the database server is a PaaS deployment."
        fr: "La machine virtuelle qui exécute uniquement le serveur de base de données est un déploiement PaaS."
    - id: s3
      text:
        en: "After the move, the cloud provider is responsible for the database patches on that virtual machine."
        fr: "Après le déplacement, le fournisseur de cloud est responsable des correctifs de la base de données sur cette machine virtuelle."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Virtual machines are IaaS: the provider maintains the hardware, so Fabrikam stops maintaining physical servers. What runs on a virtual machine does not change its service type, so a virtual machine that hosts a database is still IaaS. When you install a database on a virtual machine, you remain responsible for the database patches and updates."
    fr: "Les machines virtuelles relèvent d'IaaS : le fournisseur entretient le matériel, et Fabrikam cesse donc d'entretenir des serveurs physiques. Ce qui s'exécute sur une machine virtuelle ne change pas son type de service : une machine virtuelle qui héberge une base de données reste de l'IaaS. Lorsque vous installez une base de données sur une machine virtuelle, vous restez responsable de ses correctifs et de ses mises à jour."
  options:
    s2:
      en: "A managed database service such as Azure SQL Database is PaaS; a database installed on a virtual machine is IaaS."
      fr: "Un service de base de données managé comme Azure SQL Database est du PaaS ; une base de données installée sur une machine virtuelle est de l'IaaS."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
