id: az900-1b-sls-characteristics
objective: "1.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each term to the description of serverless computing that it names. To answer, drag the appropriate terms to the correct descriptions. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque terme à la description du calcul serverless qu'il désigne. Pour répondre, faites glisser les termes appropriés vers les descriptions correspondantes. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: ppu
    text:
      en: Pay per use
      fr: "Paiement à l'usage"
  - id: rc
    text:
      en: Reserved capacity
      fr: Capacité réservée
  - id: nim
    text:
      en: No infrastructure management
      fr: "Aucune gestion d'infrastructure"
  - id: vs
    text:
      en: Vertical scaling
      fr: "Mise à l'échelle verticale"
  - id: eds
    text:
      en: Event-driven scaling
      fr: "Mise à l'échelle pilotée par les événements"
  targets:
  - id: t1
    text:
      en: There is no server to provision or to patch.
      fr: "Il n'y a aucun serveur à provisionner ni à corriger."
  - id: t2
    text:
      en: Instances are added when events arrive and removed afterwards.
      fr: Des instances sont ajoutées quand des événements arrivent, puis retirées.
  - id: t3
    text:
      en: Executions and the resources that they consume are billed, not idle time.
      fr: "Les exécutions et les ressources qu'elles consomment sont facturées, pas le temps d'inactivité."
answer:
  mapping:
    t1: nim
    t2: eds
    t3: ppu
explanation:
  correct:
    en: "Serverless computing has three characteristics: the provider manages the infrastructure, the platform scales with the events to process, and billing follows actual executions. Reserved capacity is a commitment paid whether it is used or not, and vertical scaling changes the size of one resource; neither describes serverless."
    fr: "Le calcul serverless a trois caractéristiques : le fournisseur gère l'infrastructure, la plateforme se met à l'échelle selon les événements à traiter, et la facturation suit les exécutions réelles. La capacité réservée est un engagement payé qu'il soit utilisé ou non, et la mise à l'échelle verticale change la taille d'une ressource ; aucune des deux ne décrit le serverless."
references:
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
