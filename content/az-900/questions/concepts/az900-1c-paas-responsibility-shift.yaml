id: az900-1c-paas-responsibility-shift
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts a web application on Azure virtual machines. The company plans to move the application to Azure App Service, a PaaS service.

    Which responsibility will move from Contoso to Microsoft?
  fr: |
    Contoso héberge une application web sur des machines virtuelles Azure. L'entreprise prévoit de déplacer l'application vers Azure App Service, un service PaaS.

    Quelle responsabilité passera de Contoso à Microsoft ?
body:
  options:
    - id: a
      text: { en: "Maintaining the physical servers that host the application", fr: "Entretenir les serveurs physiques qui hébergent l'application" }
    - id: b
      text: { en: "Protecting the data that the application stores", fr: "Protéger les données que l'application stocke" }
    - id: c
      text: { en: "Managing the user accounts that access the application", fr: "Gérer les comptes d'utilisateurs qui accèdent à l'application" }
    - id: d
      text: { en: "Patching the operating system that runs the application", fr: "Appliquer les correctifs du système d'exploitation qui exécute l'application" }
answer: { optionId: d }
explanation:
  correct:
    en: "On virtual machines (IaaS), Contoso patches the operating system itself. With a PaaS service, the provider maintains the operating systems and the middleware, so this task moves to Microsoft. It is the difference between the two service types."
    fr: "Sur des machines virtuelles (IaaS), Contoso applique elle-même les correctifs du système d'exploitation. Avec un service PaaS, le fournisseur entretient les systèmes d'exploitation et les intergiciels : cette tâche passe donc à Microsoft. C'est ce qui distingue les deux types de services."
  options:
    a:
      en: "Physical servers are already Microsoft's responsibility with virtual machines; nothing moves."
      fr: "Les serveurs physiques relèvent déjà de Microsoft avec les machines virtuelles ; rien ne change."
    b:
      en: "Information and data remain the customer's responsibility in every service type."
      fr: "Les informations et les données restent sous la responsabilité du client dans tous les types de services."
    c:
      en: "Accounts and identities remain the customer's responsibility in every service type."
      fr: "Les comptes et les identités restent sous la responsabilité du client dans tous les types de services."
references:
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
