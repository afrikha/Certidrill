id: az900-1c-paas-service-match
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware wants to use only PaaS services for a new solution, so that the company does not maintain any server.

    Which service should Litware use for each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware veut utiliser uniquement des services PaaS pour une nouvelle solution, afin de n'entretenir aucun serveur.

    Quel service Litware doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vm, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - { id: sql, text: "Azure SQL Database" }
    - { id: func, text: "Azure Functions" }
    - { id: app, text: "Azure App Service" }
  targets:
    - id: t1
      text: { en: "Host the company's web application", fr: "Héberger l'application web de l'entreprise" }
    - id: t2
      text: { en: "Store relational data in a database that Azure patches and backs up automatically", fr: "Stocker des données relationnelles dans une base de données dont Azure applique les correctifs et effectue les sauvegardes automatiquement" }
    - id: t3
      text: { en: "Run small pieces of serverless code", fr: "Exécuter de petits morceaux de code serverless" }
answer:
  mapping: { t1: app, t2: sql, t3: func }
explanation:
  correct:
    en: "Azure App Service runs web applications without you managing the underlying infrastructure. Azure SQL Database is a managed relational database in which Azure patches and upgrades the database software and automates backups. Azure Functions is a serverless solution: you provide code and the cloud provides the servers needed to run it."
    fr: "Azure App Service exécute des applications web sans que vous gériez l'infrastructure sous-jacente. Azure SQL Database est une base de données relationnelle managée dans laquelle Azure applique les correctifs et les mises à niveau du logiciel et automatise les sauvegardes. Azure Functions est une solution serverless : vous fournissez du code et le cloud fournit les serveurs nécessaires à son exécution."
  options:
    vm:
      en: "Azure Virtual Machines is IaaS: Litware would have to configure, patch and maintain each virtual machine."
      fr: "Machines virtuelles Azure relève d'IaaS : Litware devrait configurer et entretenir chaque machine virtuelle, correctifs compris."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
