id: az900-1b-price-commitment-options
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two Azure pricing options give a discount in exchange for a commitment of one year or three years?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux options de tarification Azure qui accordent une remise en échange d'un engagement d'un an ou de trois ans ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Pay-as-you-go
      fr: "Le paiement à l'utilisation"
  - id: b
    text:
      en: Azure Reservations
      fr: Les réservations Azure
  - id: c
    text:
      en: Azure Spot Virtual Machines
      fr: Les machines virtuelles Azure Spot
  - id: d
    text:
      en: Azure savings plan for compute
      fr: "Le plan d'économies Azure pour le calcul"
  - id: e
    text:
      en: Azure free account
      fr: Le compte gratuit Azure
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: Reservations and savings plans are the two commitment-based discounts. A reservation commits you to specific resources for one or three years; a savings plan for compute commits you to an hourly amount spent on eligible compute services for one or three years.
    fr: "Les réservations et les plans d'économies sont les deux remises fondées sur un engagement. Une réservation vous engage sur des ressources précises pendant un ou trois ans ; un plan d'économies pour le calcul vous engage sur un montant horaire dépensé en services de calcul éligibles pendant un ou trois ans."
  options:
    a:
      en: Pay-as-you-go bills what is used during the billing cycle, with no commitment and no discount.
      fr: "Le paiement à l'utilisation facture ce qui est consommé pendant le cycle de facturation, sans engagement ni remise."
    c:
      en: Spot pricing is lower because the capacity can be taken back by Azure, not because of a commitment.
      fr: "La tarification Spot est plus basse parce qu'Azure peut reprendre la capacité, et non en raison d'un engagement."
    e:
      en: The free account gives a credit and limited free quantities; it involves no one-year or three-year commitment.
      fr: "Le compte gratuit donne un crédit et des quantités gratuites limitées ; il ne comporte aucun engagement d'un ou trois ans."
references:
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
- title: What are savings plans?
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
