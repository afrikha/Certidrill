id: az900-1b-sls-yn-basics
objective: "1.1.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A serverless application runs without any server.
      fr: "Une application serverless s'exécute sans aucun serveur."
  - id: s2
    text:
      en: In a serverless model, the cloud provider adds instances automatically when more events arrive.
      fr: "Dans un modèle serverless, le fournisseur de cloud ajoute automatiquement des instances lorsque davantage d'événements arrivent."
  - id: s3
    text:
      en: In a serverless model, the customer installs the operating system updates on the servers that run the code.
      fr: "Dans un modèle serverless, le client installe les mises à jour du système d'exploitation sur les serveurs qui exécutent le code."
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: "Servers still exist in serverless computing, but the cloud provider owns, runs and maintains them: the customer supplies only the code. The platform also scales automatically with demand."
    fr: "Les serveurs existent toujours dans le calcul serverless, mais le fournisseur de cloud les possède, les exploite et les entretient : le client ne fournit que le code. La plateforme se met aussi à l'échelle automatiquement selon la demande."
  options:
    s1:
      en: "The code still runs on servers; \"serverless\" means that you don't see or manage them."
      fr: "Le code s'exécute toujours sur des serveurs ; « serverless » signifie que vous ne les voyez pas et ne les gérez pas."
    s3:
      en: Maintaining the servers, including operating system updates, is done by the cloud provider.
      fr: "L'entretien des serveurs, mises à jour du système d'exploitation comprises, est assuré par le fournisseur de cloud."
references:
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
