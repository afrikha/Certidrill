id: az900-1b-rel-cost-actions
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware wants the cost of its cloud solutions to be predictable.

    Which two actions should Proseware perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware veut que le coût de ses solutions cloud soit prévisible.

    Quelles sont les deux actions que Proseware doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Place a load balancer in front of the virtual machines.
      fr: Placer un équilibreur de charge devant les machines virtuelles.
  - id: b
    text:
      en: Track the use of resources in real time.
      fr: "Suivre l'utilisation des ressources en temps réel."
  - id: c
    text:
      en: Deploy the solutions in a second Azure region.
      fr: Déployer les solutions dans une deuxième région Azure.
  - id: d
    text:
      en: Analyze usage data to identify patterns and trends.
      fr: "Analyser les données d'utilisation pour dégager des schémas récurrents et des tendances."
  - id: e
    text:
      en: Increase the size of the virtual machines.
      fr: Augmenter la taille des machines virtuelles.
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: Cost predictability is the ability to forecast cloud spending. Tracking resource use in real time shows whether resources are used efficiently, and analyzing the data reveals patterns and trends that help to plan deployments and to predict future costs.
    fr: "La prévisibilité des coûts est la capacité à prévoir les dépenses cloud. Suivre l'utilisation des ressources en temps réel montre si elles sont employées efficacement, et l'analyse des données révèle des schémas récurrents et des tendances qui aident à planifier les déploiements et à prévoir les coûts futurs."
  options:
    a:
      en: "A load balancer serves performance predictability: it spreads traffic, but tells nothing about future costs."
      fr: "Un équilibreur de charge sert la prévisibilité des performances : il répartit le trafic, mais ne dit rien des coûts futurs."
    c:
      en: A second region improves reliability, and it adds costs rather than making them predictable.
      fr: Une deuxième région améliore la fiabilité, et elle ajoute des coûts au lieu de les rendre prévisibles.
    e:
      en: "Larger virtual machines add capacity and cost; they don't help to forecast spending."
      fr: "Des machines virtuelles plus grandes ajoutent de la capacité et du coût ; elles n'aident pas à prévoir les dépenses."
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- title: Overview of Cost Management
  url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
