id: az900-1c-use-choice-statements
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A company that needs complete control over the operating system of its servers should choose IaaS."
        fr: "Une entreprise qui a besoin d'un contrôle complet du système d'exploitation de ses serveurs doit choisir IaaS."
    - id: s2
      text:
        en: "A development team that wants to deploy its code while the provider maintains the operating system should choose PaaS."
        fr: "Une équipe de développement qui veut déployer son code pendant que le fournisseur entretient le système d'exploitation doit choisir PaaS."
    - id: s3
      text:
        en: "A company that wants a ready-to-use email service for its employees should choose IaaS."
        fr: "Une entreprise qui veut un service de messagerie prêt à l'emploi pour ses employés doit choisir IaaS."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "IaaS gives the maximum control: the customer installs and maintains the operating system. PaaS suits teams that bring their code and leave the operating system and the middleware to the provider. A ready-to-use email service is a SaaS scenario; with IaaS the company would have to install and run the mail servers itself."
    fr: "IaaS donne le contrôle maximal : le client installe et maintient le système d'exploitation. PaaS convient aux équipes qui apportent leur code et laissent le système d'exploitation et les intergiciels au fournisseur. Un service de messagerie prêt à l'emploi est un scénario SaaS ; avec IaaS, l'entreprise devrait installer et exploiter elle-même les serveurs de messagerie."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
