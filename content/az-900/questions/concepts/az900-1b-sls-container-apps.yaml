id: az900-1b-sls-container-apps
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam packaged the microservices of an application as containers. Fabrikam wants to run the containers without managing servers and without orchestrating the containers itself. The number of instances must follow the events to process and drop to zero when there is nothing to process.

    Which Azure service should Fabrikam use?
  fr: |
    Fabrikam a empaqueté les microservices d'une application sous forme de conteneurs. Fabrikam veut exécuter les conteneurs sans gérer de serveurs et sans orchestrer elle-même les conteneurs. Le nombre d'instances doit suivre les événements à traiter et descendre à zéro lorsqu'il n'y a rien à traiter.

    Quel service Azure Fabrikam doit-elle utiliser ?
body:
  options:
  - id: a
    text: Azure Container Apps
  - id: b
    text: Azure Kubernetes Service (AKS)
  - id: c
    text:
      en: Azure Virtual Machines
      fr: Machines virtuelles Azure
  - id: d
    text:
      en: Azure Virtual Machine Scale Sets
      fr: Groupes de machines virtuelles identiques Azure
answer:
  optionId: a
explanation:
  correct:
    en: "Azure Container Apps is a serverless platform for containerized applications: it takes care of the servers and of container orchestration. It scales on HTTP traffic or events, and most applications can scale to zero."
    fr: "Azure Container Apps est une plateforme serverless pour les applications en conteneurs : elle prend en charge les serveurs et l'orchestration des conteneurs. Elle se met à l'échelle selon le trafic HTTP ou les événements, et la plupart des applications peuvent descendre à zéro instance."
  options:
    b:
      en: With AKS, you orchestrate the containers yourself with Kubernetes and manage a cluster, which Fabrikam wants to avoid.
      fr: Avec AKS, vous orchestrez vous-même les conteneurs avec Kubernetes et gérez un cluster, ce que Fabrikam veut éviter.
    c:
      en: Virtual machines are servers that you manage yourself, operating system included.
      fr: "Les machines virtuelles sont des serveurs que vous gérez vous-même, système d'exploitation compris."
    d:
      en: "A scale set is a group of identical virtual machines: the number varies with demand, but they remain servers to manage."
      fr: "Un groupe identique est un ensemble de machines virtuelles identiques : leur nombre varie avec la demande, mais ce sont toujours des serveurs à gérer."
references:
- title: Azure Container Apps overview
  url: https://learn.microsoft.com/en-us/azure/container-apps/overview
