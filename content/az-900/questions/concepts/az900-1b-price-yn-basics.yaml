id: az900-1b-price-yn-basics
objective: "1.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: With pay-as-you-go pricing, using fewer resources during a billing cycle lowers the bill for that cycle.
      fr: "Avec le paiement à l'utilisation, consommer moins de ressources pendant un cycle de facturation réduit la facture de ce cycle."
  - id: s2
    text:
      en: Pay-as-you-go pricing requires a commitment of at least one year.
      fr: "Le paiement à l'utilisation exige un engagement d'au moins un an."
  - id: s3
    text:
      en: A virtual machine of a given size has the same price in every Azure region.
      fr: "Une machine virtuelle d'une taille donnée a le même prix dans toutes les régions Azure."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: "With pay-as-you-go, you pay for the resources used during the billing cycle: more usage means a higher bill, less usage a lower one. This model has no commitment, which gives the most flexibility. Prices also depend on geography, so the same virtual machine can cost more in one region than in another."
    fr: "Avec le paiement à l'utilisation, vous payez les ressources consommées pendant le cycle de facturation : plus d'utilisation donne une facture plus élevée, moins d'utilisation une facture plus basse. Ce modèle est sans engagement, ce qui offre le plus de souplesse. Les prix dépendent aussi de la géographie : une même machine virtuelle peut coûter plus cher dans une région que dans une autre."
  options:
    s2:
      en: Pay-as-you-go has no commitment. One-year and three-year commitments belong to reservations and savings plans.
      fr: "Le paiement à l'utilisation est sans engagement. Les engagements d'un ou trois ans concernent les réservations et les plans d'économies."
    s3:
      en: Prices vary by region, because the costs of power, labor, taxes and fees differ from one location to another.
      fr: "Les prix varient selon la région, car les coûts de l'énergie, de la main-d'œuvre, des taxes et des frais diffèrent d'un lieu à l'autre."
references:
- title: Describe factors that can affect costs in Azure
  url: https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure
- title: Describe the consumption-based model
  url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
