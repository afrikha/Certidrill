id: az900-1a-uc-clinic-combo
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam Clinics has the following requirements:

    - Patient records must stay on servers that Fabrikam owns in its datacenter.
    - The appointment website must absorb seasonal peaks without any hardware purchase.
    - Administrators must manage the servers in the datacenter and the resources in Azure from Azure.

    Which combination should Fabrikam use?
  fr: |
    Fabrikam Clinics a les exigences suivantes :

    - Les dossiers des patients doivent rester sur des serveurs que Fabrikam possède dans son centre de données.
    - Le site web de prise de rendez-vous doit absorber des pics saisonniers sans aucun achat de matériel.
    - Les administrateurs doivent gérer depuis Azure les serveurs du centre de données et les ressources Azure.

    Quelle combinaison Fabrikam doit-elle utiliser ?
body:
  options:
    - id: "a"
      text:
        en: "A private cloud and Azure VMware Solution"
        fr: "Un cloud privé et Azure VMware Solution"
    - id: "b"
      text:
        en: "A hybrid cloud and Azure Arc"
        fr: "Un cloud hybride et Azure Arc"
    - id: "c"
      text:
        en: "A public cloud and Azure Arc"
        fr: "Un cloud public et Azure Arc"
    - id: "d"
      text:
        en: "A hybrid cloud and Azure VMware Solution"
        fr: "Un cloud hybride et Azure VMware Solution"
answer:
  optionId: "b"
explanation:
  correct:
    en: "Records that stay on Fabrikam's own servers and a website that scales with a cloud provider form a hybrid cloud. Azure Arc extends Azure management to the servers in the datacenter, so administrators manage both environments from Azure."
    fr: "Des dossiers qui restent sur les serveurs de Fabrikam et un site web qui monte en charge chez un fournisseur de cloud forment un cloud hybride. Azure Arc étend la gestion Azure aux serveurs du centre de données : les administrateurs gèrent ainsi les deux environnements depuis Azure."
  options:
    a:
      en: "A private cloud alone cannot absorb the seasonal peaks without hardware purchases, and Azure VMware Solution hosts VMware workloads in Azure rather than managing on-premises servers."
      fr: "Un cloud privé seul ne peut pas absorber les pics saisonniers sans achat de matériel, et Azure VMware Solution héberge des charges de travail VMware dans Azure au lieu de gérer des serveurs locaux."
    c:
      en: "A public cloud alone would move the patient records off the servers that Fabrikam owns."
      fr: "Un cloud public seul ferait sortir les dossiers des patients des serveurs que Fabrikam possède."
    d:
      en: "The cloud model is right, but Azure VMware Solution runs VMware workloads in Azure; it is not the tool that manages on-premises servers from Azure."
      fr: "Le modèle de cloud est le bon, mais Azure VMware Solution exécute des charges de travail VMware dans Azure ; ce n'est pas l'outil qui gère des serveurs locaux depuis Azure."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
  - title: "Azure Arc overview"
    url: "https://learn.microsoft.com/en-us/azure/azure-arc/overview"
