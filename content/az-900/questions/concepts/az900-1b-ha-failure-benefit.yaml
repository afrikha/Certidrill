id: az900-1b-ha-failure-benefit
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso needs its ordering application to remain accessible to customers when one of the servers that host it fails or is under maintenance.

    Which cloud benefit meets this requirement?
  fr: |
    Contoso a besoin que son application de commande reste accessible aux clients lorsqu'un des serveurs qui l'hébergent tombe en panne ou est en maintenance.

    Quel avantage du cloud répond à cette exigence ?
body:
  options:
  - id: a
    text:
      en: High availability
      fr: La haute disponibilité
  - id: b
    text:
      en: Scalability
      fr: La scalabilité
  - id: c
    text:
      en: Cost predictability
      fr: La prévisibilité des coûts
  - id: d
    text:
      en: Governance
      fr: La gouvernance
answer:
  optionId: a
explanation:
  correct:
    en: High availability focuses on keeping resources available when they are needed, regardless of the disruptions or events that occur. Azure commits to it through uptime guarantees in its service-level agreements (SLAs).
    fr: "La haute disponibilité vise à garder les ressources disponibles quand on en a besoin, quels que soient les perturbations ou les événements qui surviennent. Azure s'y engage par des garanties de temps de fonctionnement dans ses contrats de niveau de service (SLA)."
  options:
    b:
      en: Scalability adjusts resources to demand; it answers a traffic peak, not the failure of a server.
      fr: "La scalabilité ajuste les ressources à la demande ; elle répond à un pic de trafic, pas à la panne d'un serveur."
    c:
      en: Cost predictability is the ability to forecast cloud spending.
      fr: La prévisibilité des coûts est la capacité à prévoir les dépenses cloud.
    d:
      en: Governance is about complying with corporate standards and regulations.
      fr: "La gouvernance concerne le respect des normes de l'entreprise et de la réglementation."
references:
- title: Describe the benefits of high availability and scalability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- title: What Are Business Continuity, High Availability, and Disaster Recovery?
  url: https://learn.microsoft.com/en-us/azure/reliability/concept-business-continuity-high-availability-disaster-recovery
