id: az900-1b-sls-functions-fit
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which workload is the best fit for Azure Functions?
  fr: |
    Quelle charge de travail convient le mieux à Azure Functions ?
body:
  options:
  - id: a
    text:
      en: A database server that runs continuously with a custom operating system configuration
      fr: "Un serveur de base de données qui tourne en continu avec une configuration personnalisée du système d'exploitation"
  - id: b
    text:
      en: A legacy application that requires full control over the operating system
      fr: "Une application héritée qui exige un contrôle complet du système d'exploitation"
  - id: c
    text:
      en: The creation of a thumbnail each time an image is uploaded to a storage account
      fr: "La création d'une miniature chaque fois qu'une image est chargée dans un compte de stockage"
  - id: d
    text:
      en: Full Windows desktops provided to employees who work remotely
      fr: Des bureaux Windows complets fournis aux employés qui travaillent à distance
answer:
  optionId: c
explanation:
  correct:
    en: Azure Functions is an event-driven, serverless compute option. It suits work that is done in response to an event, such as an upload, a timer or a message, and that completes quickly; resources are allocated only while the code runs.
    fr: "Azure Functions est une option de calcul serverless pilotée par les événements. Elle convient à un travail effectué en réponse à un événement, comme un chargement, un minuteur ou un message, et qui se termine rapidement ; les ressources ne sont allouées que pendant l'exécution du code."
  options:
    a:
      en: "A server that runs continuously with a custom operating system needs a virtual machine: with Functions you have no access to the operating system."
      fr: "Un serveur qui tourne en continu avec un système d'exploitation personnalisé demande une machine virtuelle : avec Functions, vous n'avez pas accès au système d'exploitation."
    b:
      en: Full control over the operating system is what virtual machines (IaaS) provide, not a serverless service.
      fr: "Le contrôle complet du système d'exploitation est ce qu'offrent les machines virtuelles (IaaS), pas un service serverless."
    d:
      en: Hosted Windows desktops are the purpose of Azure Virtual Desktop.
      fr: "Les bureaux Windows hébergés sont le rôle d'Azure Virtual Desktop."
references:
- title: Describe Azure functions
  url: https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions
- title: Azure Functions Overview
  url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
