id: az900-1a-cloud-scenario
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which scenario is an example of cloud computing?
  fr: |
    Quel scénario est un exemple de cloud computing ?
body:
  options:
    - id: "a"
      text:
        en: "A company buys servers and places them in a space that it rents in a hosting facility."
        fr: "Une entreprise achète des serveurs et les place dans un espace qu'elle loue chez un hébergeur."
    - id: "b"
      text:
        en: "A company leases physical servers for three years and installs them in its server room."
        fr: "Une entreprise loue des serveurs physiques pour trois ans et les installe dans sa salle des serveurs."
    - id: "c"
      text:
        en: "A company installs an accounting application locally on each of its office computers."
        fr: "Une entreprise installe localement une application de comptabilité sur chacun de ses ordinateurs de bureau."
    - id: "d"
      text:
        en: "A company creates virtual machines with a provider over the internet and deletes them after a test."
        fr: "Une entreprise crée des machines virtuelles chez un fournisseur par Internet et les supprime après un test."
answer:
  optionId: "d"
explanation:
  correct:
    en: "Creating virtual machines with a provider over the internet, using them for the duration of a test and then deleting them is cloud computing: the capacity is rented on demand and released afterwards. In the three other scenarios, the company buys, hosts or installs the resources itself."
    fr: "Créer des machines virtuelles chez un fournisseur par Internet, les utiliser le temps d'un test puis les supprimer relève du cloud computing : la capacité est louée à la demande, puis libérée. Dans les trois autres scénarios, l'entreprise achète, héberge ou installe elle-même les ressources."
  options:
    a:
      en: "The company still buys and owns the servers; only the floor space is rented."
      fr: "L'entreprise achète et possède toujours les serveurs ; seul l'espace est loué."
    b:
      en: "Leased servers in the company's server room are infrastructure that the company hosts and operates, with a commitment of several years."
      fr: "Des serveurs loués dans la salle des serveurs de l'entreprise constituent une infrastructure qu'elle héberge et exploite, avec un engagement de plusieurs années."
    c:
      en: "Software installed locally on each computer is not a service delivered over the internet."
      fr: "Un logiciel installé localement sur chaque ordinateur n'est pas un service fourni sur Internet."
references:
  - title: "What is cloud computing"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
