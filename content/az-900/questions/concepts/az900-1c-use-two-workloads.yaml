id: az900-1c-use-two-workloads
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation plans two projects:

    - Move to the cloud a legacy application that requires a custom driver installed in the operating system.
    - Replace an in-house expense tracking tool with a ready-to-use online application.

    Which cloud service types should Adatum use?
  fr: |
    Adatum Corporation prévoit deux projets :

    - Déplacer vers le cloud une application héritée qui exige l'installation d'un pilote personnalisé dans le système d'exploitation.
    - Remplacer un outil interne de suivi des dépenses par une application en ligne prête à l'emploi.

    Quels types de services cloud Adatum doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "PaaS for the legacy application and SaaS for expense tracking", fr: "PaaS pour l'application héritée et SaaS pour le suivi des dépenses" }
    - id: b
      text: { en: "IaaS for the legacy application and PaaS for expense tracking", fr: "IaaS pour l'application héritée et PaaS pour le suivi des dépenses" }
    - id: c
      text: { en: "IaaS for the legacy application and SaaS for expense tracking", fr: "IaaS pour l'application héritée et SaaS pour le suivi des dépenses" }
    - id: d
      text: { en: "SaaS for the legacy application and IaaS for expense tracking", fr: "SaaS pour l'application héritée et IaaS pour le suivi des dépenses" }
answer: { optionId: c }
explanation:
  correct:
    en: "Installing a driver requires control of the operating system, which only IaaS gives: the customer installs, configures and maintains the operating system. A ready-to-use online application for finance and expense tracking is a common SaaS scenario, with nothing to develop or host."
    fr: "L'installation d'un pilote exige le contrôle du système d'exploitation, que seul IaaS donne : le client installe, configure et maintient le système d'exploitation. Une application en ligne prête à l'emploi pour la gestion financière et le suivi des dépenses est un scénario courant de SaaS, sans rien à développer ni à héberger."
  options:
    a:
      en: "With PaaS the provider maintains the operating system, so Adatum has no access to install a custom driver."
      fr: "Avec PaaS, le fournisseur entretient le système d'exploitation : Adatum n'y a pas accès pour installer un pilote personnalisé."
    b:
      en: "PaaS would mean developing and deploying an expense application, whereas Adatum wants a ready-to-use one."
      fr: "PaaS supposerait de développer et de déployer une application de suivi des dépenses, alors qu'Adatum en veut une prête à l'emploi."
    d:
      en: "The two types are inverted: a SaaS product is not a place to run your own legacy application, and IaaS delivers no ready-to-use application."
      fr: "Les deux types sont inversés : un produit SaaS ne sert pas à exécuter votre propre application héritée, et IaaS ne fournit aucune application prête à l'emploi."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
