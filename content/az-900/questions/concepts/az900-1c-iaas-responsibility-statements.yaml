id: az900-1c-iaas-responsibility-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With IaaS, the cloud provider installs the operating system updates on your virtual machines."
        fr: "Avec IaaS, le fournisseur de cloud installe les mises à jour du système d'exploitation sur vos machines virtuelles."
    - id: s2
      text:
        en: "With IaaS, the cloud provider is responsible for the physical security of the datacenter."
        fr: "Avec IaaS, le fournisseur de cloud est responsable de la sécurité physique du centre de données."
    - id: s3
      text:
        en: "IaaS places more responsibility on the customer than PaaS does."
        fr: "IaaS fait porter davantage de responsabilités au client que PaaS."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "With IaaS, the provider is responsible for the hardware, the network connectivity and the physical security, while the customer installs, configures and maintains the operating system, including its updates. Of the three service types, IaaS places the most responsibility on the customer; PaaS sits in the middle and SaaS leaves most of it to the provider."
    fr: "Avec IaaS, le fournisseur est responsable du matériel, de la connectivité réseau et de la sécurité physique, tandis que le client installe, configure et maintient le système d'exploitation, mises à jour comprises. Des trois types de services, IaaS est celui qui fait porter le plus de responsabilités au client ; PaaS se situe au milieu et SaaS en laisse l'essentiel au fournisseur."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
