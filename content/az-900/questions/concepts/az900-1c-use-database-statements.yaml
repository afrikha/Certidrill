id: az900-1c-use-database-statements
objective: "1.3.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank needs a relational database in Azure. The company hesitates between Azure SQL Database and SQL Server installed on an Azure virtual machine.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a besoin d'une base de données relationnelle dans Azure. L'entreprise hésite entre Azure SQL Database et SQL Server installé sur une machine virtuelle Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With SQL Server installed on an Azure virtual machine, the responsibility for the operating system updates moves to Microsoft."
        fr: "Avec SQL Server installé sur une machine virtuelle Azure, la responsabilité des mises à jour du système d'exploitation passe à Microsoft."
    - id: s2
      text:
        en: "With Azure SQL Database, Microsoft patches and upgrades the database software."
        fr: "Avec Azure SQL Database, Microsoft applique les correctifs et les mises à niveau du logiciel de base de données."
    - id: s3
      text:
        en: "With Azure SQL Database, Microsoft becomes responsible for the data that Woodgrove Bank stores in the database."
        fr: "Avec Azure SQL Database, Microsoft devient responsable des données que Woodgrove Bank stocke dans la base de données."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "SQL Server on an Azure virtual machine is IaaS: the customer decides when to update the operating system and the database software. Azure SQL Database is PaaS: Azure automatically configures, patches and upgrades the database software. In both cases the customer remains responsible for the data ingested into the database."
    fr: "SQL Server sur une machine virtuelle Azure relève d'IaaS : le client décide quand mettre à jour le système d'exploitation et le logiciel de base de données. Azure SQL Database relève de PaaS : Azure configure le logiciel de base de données, y applique les correctifs et le met à niveau automatiquement. Dans les deux cas, le client reste responsable des données ingérées dans la base de données."
  options:
    s1:
      en: "A virtual machine is IaaS whatever it runs: the operating system and its updates stay with the customer."
      fr: "Une machine virtuelle relève d'IaaS quoi qu'elle exécute : le système d'exploitation et ses mises à jour restent à la charge du client."
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
