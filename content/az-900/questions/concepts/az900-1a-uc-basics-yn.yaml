id: az900-1a-uc-basics-yn
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "A company must choose a private cloud if it wants to pay only for the resources that it uses."
        fr: "Une entreprise doit choisir un cloud privé si elle veut payer uniquement les ressources qu'elle utilise."
    - id: "s2"
      text:
        en: "A public cloud suits a company that wants to deploy an application quickly without capital expenditure."
        fr: "Un cloud public convient à une entreprise qui veut déployer rapidement une application sans dépense d'investissement."
    - id: "s3"
      text:
        en: "A hybrid cloud suits a company that wants to keep some services in its private cloud and run others in a public cloud."
        fr: "Un cloud hybride convient à une entreprise qui veut conserver certains services dans son cloud privé et en exécuter d'autres dans un cloud public."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "Paying only for what you use is a characteristic of the public cloud; a private cloud requires hardware to be purchased. A public cloud needs no capital expenditure, and applications can be provisioned quickly. A hybrid cloud lets a company choose which services to keep in its private cloud and which to run in the public cloud."
    fr: "Payer uniquement ce que vous utilisez caractérise le cloud public ; un cloud privé impose d'acheter du matériel. Un cloud public ne nécessite aucune dépense d'investissement, et les applications peuvent y être provisionnées rapidement. Un cloud hybride permet à une entreprise de choisir quels services conserver dans son cloud privé et lesquels exécuter dans le cloud public."
references:
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
