id: az900-1b-sls-idle-billing
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders hosts an order-notification function in Azure Functions, on a serverless plan in which instances are created only when events arrive. During one week, no order arrives and the function never runs.

    How is the compute for the function billed for that week?
  fr: |
    Northwind Traders héberge une fonction de notification de commandes dans Azure Functions, sur un plan serverless dans lequel les instances ne sont créées que lorsque des événements arrivent. Pendant une semaine, aucune commande n'arrive et la fonction ne s'exécute jamais.

    Comment le calcul de la fonction est-il facturé pour cette semaine ?
body:
  options:
  - id: a
    text:
      en: One instance is billed for every hour of the week
      fr: Une instance est facturée pour chaque heure de la semaine
  - id: b
    text:
      en: Nothing is billed, because no code was executed
      fr: "Rien n'est facturé, car aucun code n'a été exécuté"
  - id: c
    text:
      en: The capacity reserved for the function is billed in full
      fr: La capacité réservée à la fonction est facturée en totalité
  - id: d
    text:
      en: A fixed weekly fee is billed, whatever the number of executions
      fr: "Un forfait hebdomadaire fixe est facturé, quel que soit le nombre d'exécutions"
answer:
  optionId: b
explanation:
  correct:
    en: In a serverless model, the platform allocates resources when an event triggers the code and releases them when the code finishes. You are charged for the resources used while the code runs, so a function that never runs generates no compute charge.
    fr: "Dans un modèle serverless, la plateforme alloue des ressources lorsqu'un événement déclenche le code et les libère quand le code se termine. Vous payez les ressources utilisées pendant l'exécution du code : une fonction qui ne s'exécute jamais ne génère donc aucun coût de calcul."
  options:
    a:
      en: Paying for an instance hour after hour is how a running virtual machine is billed, not a serverless function.
      fr: "Payer une instance heure après heure est la facturation d'une machine virtuelle en marche, pas d'une fonction serverless."
    c:
      en: "Serverless has no capacity reserved in advance: resources are allocated on demand."
      fr: "Le serverless ne réserve pas de capacité à l'avance : les ressources sont allouées à la demande."
    d:
      en: "This plan has no fixed fee: only executions and the resources that they consume are billed."
      fr: "Ce plan n'a pas de forfait fixe : seules les exécutions et les ressources qu'elles consomment sont facturées."
references:
