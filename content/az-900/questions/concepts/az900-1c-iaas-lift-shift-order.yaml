id: az900-1c-iaas-lift-shift-order
objective: "1.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs a line-of-business application on servers in its on-premises datacenter. The company plans a lift-and-shift migration of the application to IaaS in Azure. The application code must not be modified.

    Which three actions should Wingtip Toys perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys exécute une application métier sur des serveurs de son centre de données local. L'entreprise prévoit une migration lift-and-shift de l'application vers IaaS dans Azure. Le code de l'application ne doit pas être modifié.

    Quelles sont les trois actions que Wingtip Toys doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rewrite, text: { en: "Rewrite the application so that it runs on a PaaS service.", fr: "Réécrire l'application pour qu'elle s'exécute sur un service PaaS." } }
    - { id: move, text: { en: "Move the application and its data to the Azure virtual machines.", fr: "Déplacer l'application et ses données vers les machines virtuelles Azure." } }
    - { id: saas, text: { en: "Replace the application with a SaaS product.", fr: "Remplacer l'application par un produit SaaS." } }
    - { id: infra, text: { en: "Create Azure virtual machines and networks similar to the on-premises servers.", fr: "Créer des machines virtuelles et des réseaux Azure semblables aux serveurs locaux." } }
    - { id: users, text: { en: "Direct the users to the application that runs in Azure.", fr: "Diriger les utilisateurs vers l'application qui s'exécute dans Azure." } }
answer:
  sequence: [ infra, move, users ]
explanation:
  correct:
    en: |
      In a lift-and-shift migration, you first set up cloud resources similar to your on-premises datacenter, and then you move the workloads to that IaaS infrastructure as they are. Users can be directed to the Azure copy only once the application runs there.
    fr: |
      Dans une migration lift-and-shift, vous créez d'abord des ressources cloud semblables à celles de votre centre de données local, puis vous déplacez les charges de travail telles quelles vers cette infrastructure IaaS. Les utilisateurs ne peuvent être dirigés vers la copie Azure qu'une fois l'application en service dans Azure.
  options:
    rewrite: { en: "Rewriting the application for PaaS modifies its code and is no longer a lift-and-shift migration.", fr: "Réécrire l'application pour PaaS modifie son code : ce n'est plus une migration lift-and-shift." }
    saas: { en: "Replacing the application with a SaaS product abandons the existing application instead of migrating it.", fr: "Remplacer l'application par un produit SaaS abandonne l'application existante au lieu de la migrer." }
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
