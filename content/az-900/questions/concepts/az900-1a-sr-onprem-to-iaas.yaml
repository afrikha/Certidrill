id: az900-1a-sr-onprem-to-iaas
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs an application on virtual machines that are hosted on servers in its own datacenter. Adatum migrates the application to Azure virtual machines.

    Which responsibility does this migration transfer from Adatum to Microsoft?
  fr: |
    Adatum exécute une application sur des machines virtuelles hébergées sur des serveurs de son propre centre de données. Adatum migre l'application vers des machines virtuelles Azure.

    Quelle responsabilité cette migration transfère-t-elle d'Adatum à Microsoft ?
body:
  options:
    - id: "a"
      text:
        en: "Updating the operating system of the virtual machines"
        fr: "La mise à jour du système d'exploitation des machines virtuelles"
    - id: "b"
      text:
        en: "Configuring the network controls of the virtual machines"
        fr: "La configuration des contrôles réseau des machines virtuelles"
    - id: "c"
      text:
        en: "Maintaining the physical hosts of the virtual machines"
        fr: "La maintenance des hôtes physiques des machines virtuelles"
    - id: "d"
      text:
        en: "Protecting the data that the application uses"
        fr: "La protection des données utilisées par l'application"
answer:
  optionId: "c"
explanation:
  correct:
    en: "With IaaS, the provider takes over the physical layers: the datacenter, the physical network and the physical hosts. Adatum keeps everything above them: the operating system of the virtual machines, their network controls, the application and its data."
    fr: "En IaaS, le fournisseur prend en charge les couches physiques : le centre de données, le réseau physique et les hôtes physiques. Adatum conserve tout ce qui se trouve au-dessus : le système d'exploitation des machines virtuelles, leurs contrôles réseau, l'application et ses données."
  options:
    a:
      en: "On a virtual machine (IaaS), the customer still updates the operating system."
      fr: "Sur une machine virtuelle (IaaS), le client continue de mettre à jour le système d'exploitation."
    b:
      en: "In IaaS, the customer configures the network controls of its virtual machines."
      fr: "En IaaS, le client configure les contrôles réseau de ses machines virtuelles."
    d:
      en: "The customer is always responsible for its data, whatever the service type."
      fr: "Le client est toujours responsable de ses données, quel que soit le type de service."
references:
  - title: "Describe the shared responsibility model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"
  - title: "Shared responsibility in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"
