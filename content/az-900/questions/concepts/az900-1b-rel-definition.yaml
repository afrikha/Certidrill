id: az900-1b-rel-definition
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which cloud benefit is defined as the ability of a system to recover from failures and continue to function?
  fr: |
    Quel avantage du cloud se définit comme la capacité d'un système à se remettre d'une défaillance et à continuer de fonctionner ?
body:
  options:
  - id: a
    text:
      en: Scalability
      fr: La scalabilité
  - id: b
    text:
      en: Predictability
      fr: La prévisibilité
  - id: c
    text:
      en: Reliability
      fr: La fiabilité
  - id: d
    text:
      en: Manageability
      fr: La facilité de gestion
answer:
  optionId: c
explanation:
  correct:
    en: Reliability is the ability of a system to recover from failures and continue to function. The cloud supports it by design, because resources can be deployed in regions around the world.
    fr: "La fiabilité est la capacité d'un système à se remettre d'une défaillance et à continuer de fonctionner. Le cloud la favorise par conception, car les ressources peuvent être déployées dans des régions du monde entier."
  options:
    a:
      en: Scalability is the ability to adjust resources to meet demand.
      fr: La scalabilité est la capacité à ajuster les ressources à la demande.
    b:
      en: Predictability is about knowing in advance the performance and the cost of a solution.
      fr: "La prévisibilité consiste à connaître à l'avance les performances et le coût d'une solution."
    d:
      en: Manageability covers the way you manage cloud resources and the tools that you use to do it.
      fr: La facilité de gestion couvre la façon de gérer les ressources cloud et les outils employés pour le faire.
references:
- title: Describe the benefits of reliability and predictability in the cloud
  url: https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
