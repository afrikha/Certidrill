answer:
  values:
    perf: perf
    cost: cost
explanation:
  correct:
    en: Predictability has two sides. Performance predictability is about the resources needed for a good customer experience; autoscaling, load balancing and high availability support it. Cost predictability is about forecasting cloud spending, by tracking resource use and estimating costs.
    fr: "La prévisibilité a deux faces. La prévisibilité des performances porte sur les ressources nécessaires à une bonne expérience client ; la mise à l'échelle automatique, l'équilibrage de charge et la haute disponibilité la servent. La prévisibilité des coûts porte sur la prévision des dépenses cloud, par le suivi de l'utilisation des ressources et l'estimation des coûts."
references:
- title: Describe the benefits of reliability and predictability in the cloud
