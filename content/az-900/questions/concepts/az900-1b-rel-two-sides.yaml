body:
  layout: text
  template:
    en: |
      [[perf]] predictability focuses on predicting the resources needed to deliver a positive experience to customers.

      [[cost]] predictability focuses on forecasting what the cloud will cost.
    fr: |
      La prévisibilité [[perf]] consiste à prédire les ressources nécessaires pour offrir une expérience positive aux clients.

      La prévisibilité [[cost]] consiste à prévoir ce que le cloud coûtera.
