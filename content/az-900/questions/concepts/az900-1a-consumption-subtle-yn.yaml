id: az900-1a-consumption-subtle-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: "s1"
      text:
        en: "With the consumption-based model, the cloud costs of a company can vary from one month to the next with its usage."
        fr: "Avec le modèle basé sur la consommation, les coûts cloud d'une entreprise peuvent varier d'un mois à l'autre selon son utilisation."
    - id: "s2"
      text:
        en: "A company that builds a private cloud in its own datacenter avoids capital expenditure."
        fr: "Une entreprise qui construit un cloud privé dans son propre centre de données évite les dépenses d'investissement."
    - id: "s3"
      text:
        en: "With pay-as-you-go pricing, the cloud provider maintains the underlying infrastructure, including power, cooling and hardware."
        fr: "Avec la tarification de paiement à l'utilisation, le fournisseur de cloud entretient l'infrastructure sous-jacente, notamment l'alimentation électrique, le refroidissement et le matériel."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "In the consumption-based model the bill follows usage, so it changes from month to month. A private cloud built in the company's own datacenter requires hardware purchases, which are capital expenditure. With pay-as-you-go pricing, the provider maintains the underlying infrastructure, including power, cooling, hardware and networking, and the customer pays only for the services it consumes."
    fr: "Dans le modèle basé sur la consommation, la facture suit l'utilisation : elle change donc d'un mois à l'autre. Un cloud privé construit dans le centre de données de l'entreprise impose des achats de matériel, qui sont des dépenses d'investissement. Avec la tarification de paiement à l'utilisation, le fournisseur entretient l'infrastructure sous-jacente (alimentation électrique, refroidissement, matériel, réseau), et le client ne paie que les services qu'il consomme."
references:
  - title: "Describe the consumption-based model"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
