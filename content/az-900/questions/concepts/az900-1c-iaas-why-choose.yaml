id: az900-1c-iaas-why-choose
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders hesitates between IaaS and PaaS to host an application.

    Which requirement should lead Northwind Traders to choose IaaS?
  fr: |
    Northwind Traders hésite entre IaaS et PaaS pour héberger une application.

    Quelle exigence doit conduire Northwind Traders à choisir IaaS ?
body:
  options:
    - id: a
      text: { en: "The developers want built-in components that reduce the code to write.", fr: "Les développeurs veulent des composants intégrés qui réduisent le code à écrire." }
    - id: b
      text: { en: "The company wants the provider to patch the operating system.", fr: "L'entreprise veut que le fournisseur applique les correctifs du système d'exploitation." }
    - id: c
      text: { en: "The company needs complete control over the operating system.", fr: "L'entreprise a besoin d'un contrôle complet du système d'exploitation." }
    - id: d
      text: { en: "The company wants to avoid managing operating system licenses.", fr: "L'entreprise veut éviter de gérer les licences du système d'exploitation." }
answer: { optionId: c }
explanation:
  correct:
    en: "IaaS is the most flexible category and gives the maximum amount of control over cloud resources: you install, configure and maintain the operating system yourself. A requirement of complete control over the operating system therefore points to IaaS."
    fr: "IaaS est la catégorie la plus flexible et donne le plus grand contrôle sur les ressources cloud : vous installez, configurez et maintenez vous-même le système d'exploitation. Une exigence de contrôle complet du système d'exploitation désigne donc IaaS."
  options:
    a:
      en: "Built-in software components that reduce coding are a benefit of PaaS used as a development framework."
      fr: "Les composants logiciels intégrés qui réduisent le codage sont un avantage de PaaS utilisé comme framework de développement."
    b:
      en: "With IaaS the customer patches the operating system; the provider does it with PaaS."
      fr: "Avec IaaS, c'est le client qui applique les correctifs du système d'exploitation ; le fournisseur le fait avec PaaS."
    d:
      en: "Not having to worry about operating system licensing is a characteristic of PaaS, not of IaaS."
      fr: "Ne pas avoir à se soucier des licences du système d'exploitation est une caractéristique de PaaS, pas d'IaaS."
references:
  - title: Describe Infrastructure as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
  - title: Describe Platform as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
