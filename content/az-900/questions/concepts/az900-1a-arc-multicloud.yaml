id: az900-1a-arc-multicloud
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs servers in its own datacenter, in Azure and with another public cloud provider. The IT team wants to manage all these servers from Azure.

    What should Proseware use?
  fr: |
    Proseware exploite des serveurs dans son propre centre de données, dans Azure et chez un autre fournisseur de cloud public. L'équipe informatique veut gérer tous ces serveurs depuis Azure.

    Que doit utiliser Proseware ?
body:
  options:
    - id: "a"
      text: "Azure Migrate"
    - id: "b"
      text: "Azure Arc"
    - id: "c"
      text: "Azure ExpressRoute"
    - id: "d"
      text: "Azure VMware Solution"
answer:
  optionId: "b"
explanation:
  correct:
    en: "Azure Arc is a set of technologies that extends Azure management to resources outside Azure: servers in a private datacenter, in a hybrid configuration or with other cloud providers. Proseware can manage all its servers from Azure, wherever they run."
    fr: "Azure Arc est un ensemble de technologies qui étend la gestion Azure à des ressources situées hors d'Azure : des serveurs dans un centre de données privé, dans une configuration hybride ou chez d'autres fournisseurs de cloud. Proseware peut gérer tous ses serveurs depuis Azure, où qu'ils s'exécutent."
  options:
    a:
      en: "Azure Migrate helps assess and move workloads to Azure; it does not manage servers that stay in other environments."
      fr: "Azure Migrate aide à évaluer et à déplacer des charges de travail vers Azure ; il ne gère pas des serveurs qui restent dans d'autres environnements."
    c:
      en: "ExpressRoute provides a private connection between an on-premises network and Azure; it is not a management tool."
      fr: "ExpressRoute fournit une connexion privée entre un réseau local et Azure ; ce n'est pas un outil de gestion."
    d:
      en: "Azure VMware Solution runs VMware workloads in Azure; it does not manage servers that are hosted with another provider."
      fr: "Azure VMware Solution exécute des charges de travail VMware dans Azure ; il ne gère pas des serveurs hébergés chez un autre fournisseur."
references:
  - title: "Azure Arc overview"
    url: "https://learn.microsoft.com/en-us/azure/azure-arc/overview"
  - title: "Define cloud models"
    url: "https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"
