id: az900-1c-saas-sentence
objective: "1.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Email and messaging are common scenarios for [[type]]. In this model, you primarily manage [[what]].
    fr: |
      L'e-mail et la messagerie sont des scénarios courants pour [[type]]. Dans ce modèle, vous gérez principalement [[what]].
  slots:
    - id: type
      options:
        - { id: iaas, text: "IaaS" }
        - { id: paas, text: "PaaS" }
        - { id: saas, text: "SaaS" }
    - id: what
      options:
        - { id: os, text: { en: "the operating system and its updates", fr: "le système d'exploitation et ses mises à jour" } }
        - { id: data, text: { en: "your data and the access of your users", fr: "vos données et les accès de vos utilisateurs" } }
        - { id: runtime, text: { en: "the middleware and the development tools", fr: "les intergiciels et les outils de développement" } }
answer:
  values: { type: saas, what: data }
explanation:
  correct:
    en: "Email and messaging, productivity applications, and finance and expense tracking are the common SaaS scenarios. With SaaS, the provider manages almost the entire application stack, and you primarily manage your data and your identity and access settings."
    fr: "L'e-mail et la messagerie, les applications de productivité, ainsi que la gestion financière et le suivi des dépenses sont les scénarios courants de SaaS. Avec SaaS, le fournisseur gère presque toute la pile applicative, et vous gérez principalement vos données et vos paramètres d'identité et d'accès."
  options:
    os:
      en: "You manage the operating system only with IaaS."
      fr: "Vous ne gérez le système d'exploitation qu'avec IaaS."
    runtime:
      en: "Middleware and development tools are maintained by the provider with both PaaS and SaaS."
      fr: "Les intergiciels et les outils de développement sont entretenus par le fournisseur avec PaaS comme avec SaaS."
references:
  - title: Describe Software as a Service
    url: https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
