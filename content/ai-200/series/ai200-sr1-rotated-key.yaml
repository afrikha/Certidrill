id: ai200-sr1-rotated-key
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Python web app named **app-woodgrove-chat** that runs in Azure App Service and has a system-assigned managed identity. The app calls a search service by using an API key.

    The API key is stored as a secret named **search-api-key** in an Azure key vault named **kv-woodgrove**, which uses the Azure role-based access control permission model. Every 30 days, a rotation function adds a new version of search-api-key and disables the previous version one day later.

    The app uses `SecretClient` from the `azure-keyvault-secrets` package with `DefaultAzureCredential()`, and it reads the secret at startup and then every hour. You need to configure secret retrieval. The solution must meet the following requirements:

    - After each rotation, the app must use the new version within one hour, without any change to its code, its app settings or its deployment.
    - No secret value must be stored in the code or in the app settings.
    - The managed identity must not be able to create, modify or delete secrets.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'une application web Python nommée **app-woodgrove-chat** qui s'exécute dans Azure App Service et possède une identité managée affectée par le système. L'application appelle un service de recherche à l'aide d'une clé API.

    La clé API est stockée sous la forme d'un secret nommé **search-api-key** dans un coffre de clés Azure nommé **kv-woodgrove**, qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure. Tous les 30 jours, une fonction de renouvellement ajoute une nouvelle version de search-api-key et désactive la version précédente un jour plus tard.

    L'application utilise `SecretClient` du package `azure-keyvault-secrets` avec `DefaultAzureCredential()`, et elle lit le secret au démarrage puis toutes les heures. Vous devez configurer la récupération du secret. La solution doit répondre aux exigences suivantes :

    - Après chaque renouvellement, l'application doit utiliser la nouvelle version dans l'heure, sans aucune modification de son code, de ses paramètres d'application ni de son déploiement.
    - Aucune valeur de secret ne doit être stockée dans le code ni dans les paramètres d'application.
    - L'identité managée ne doit pas pouvoir créer, modifier ni supprimer de secrets.
