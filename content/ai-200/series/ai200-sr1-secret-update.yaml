id: ai200-sr1-secret-update
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam runs a Python summarization service as an Azure container app named **ca-summarizer** in the resource group **rg-fabrikam**. ca-summarizer uses the single revision mode, and its active revision is **ca-summarizer--v7**.

    The container reads the key of a translation API from the environment variable `TRANSLATOR_KEY`. The environment variable references a secret of ca-summarizer named **translator-key**. The secret value is stored in the container app, not in Azure Key Vault.

    The translation provider has issued a new key, and the old key will stop working tomorrow. You need to ensure that the running replicas of ca-summarizer use the new key. The change control policy of Fabrikam prohibits any operation that creates a new revision of ca-summarizer.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam exécute un service Python de synthèse de texte sous la forme d'une application conteneur Azure nommée **ca-summarizer** dans le groupe de ressources **rg-fabrikam**. ca-summarizer utilise le mode de révision unique, et sa révision active est **ca-summarizer--v7**.

    Le conteneur lit la clé d'une API de traduction dans la variable d'environnement `TRANSLATOR_KEY`. Cette variable d'environnement référence un secret de ca-summarizer nommé **translator-key**. La valeur du secret est stockée dans l'application conteneur, et non dans Azure Key Vault.

    Le fournisseur de traduction a émis une nouvelle clé, et l'ancienne clé cessera de fonctionner demain. Vous devez faire en sorte que les réplicas en cours d'exécution de ca-summarizer utilisent la nouvelle clé. La stratégie de gestion des modifications de Fabrikam interdit toute opération qui crée une nouvelle révision de ca-summarizer.
