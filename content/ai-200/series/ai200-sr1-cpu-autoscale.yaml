id: ai200-sr1-cpu-autoscale
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure Kubernetes Service (AKS) cluster named **aks-tailspin**. A Python embedding API runs in the **rag** namespace as a Deployment named **embed-api**, which you manage by using manifest files and `kubectl apply`.

    The current manifest of embed-api sets `replicas: 2`. The pod template contains a single container named **embed-api**, and the container has no `resources` section.

    You need to ensure that Kubernetes automatically adjusts the number of embed-api pods between **2** and **8**, based on a target average CPU utilization of **60** percent.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un cluster Azure Kubernetes Service (AKS) nommé **aks-tailspin**. Une API Python de génération d'incorporations s'exécute dans l'espace de noms **rag** sous la forme d'un Deployment nommé **embed-api**, que vous gérez à l'aide de fichiers manifeste et de `kubectl apply`.

    Le manifeste actuel de embed-api définit `replicas: 2`. Le modèle de pod contient un seul conteneur nommé **embed-api**, et ce conteneur n'a pas de section `resources`.

    Vous devez faire en sorte que Kubernetes ajuste automatiquement le nombre de pods de embed-api entre **2** et **8**, en fonction d'une utilisation moyenne cible du processeur de **60** %.
