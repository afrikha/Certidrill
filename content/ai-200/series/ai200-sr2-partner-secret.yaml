id: ai200-sr2-partner-secret
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders runs a Python product-recommendation API as a container app that uses a user-assigned managed identity named **id-nw-reco**. The `AZURE_CLIENT_ID` environment variable of the app contains the client ID of id-nw-reco. The API calls a partner pricing service that requires an API key.

    The key is stored as a secret named **partner-api-key** in a key vault named **kv-nw-reco** that uses the Azure role-based access control (RBAC) permission model. A rotation process adds a new version of the secret every 30 days.

    You need the API to retrieve the value of partner-api-key at run time by using id-nw-reco. The API must use the newest version of the secret after each rotation without being redeployed. The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders exécute une API Python de recommandation de produits dans une application conteneur qui utilise une identité managée affectée par l'utilisateur nommée **id-nw-reco**. La variable d'environnement `AZURE_CLIENT_ID` de l'application contient l'ID client d'id-nw-reco. L'API appelle un service de tarification partenaire qui exige une clé API.

    La clé est stockée sous la forme d'un secret nommé **partner-api-key** dans un coffre de clés nommé **kv-nw-reco** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle (RBAC) Azure. Un processus de rotation ajoute une nouvelle version du secret tous les 30 jours.

    Vous devez faire en sorte que l'API récupère la valeur de partner-api-key au moment de l'exécution à l'aide d'id-nw-reco. L'API doit utiliser la version la plus récente du secret après chaque rotation sans être redéployée. La solution doit respecter le principe du moindre privilège.
