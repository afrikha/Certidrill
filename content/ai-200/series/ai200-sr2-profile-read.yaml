id: ai200-sr2-profile-read
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank develops a Python chat assistant that personalizes answers by using customer profiles. The profiles are stored in the **profiles** container of the **assistant** database in an Azure Cosmos DB for NoSQL account. The partition key of the container is **/customerId**, and the `id` of each profile item equals its `customerId` value.

    The assistant runs with a managed identity that has a data plane role that allows it to read items. Security policy forbids account keys in code and in configuration.

    For each conversation, the assistant knows the `customerId`. You need to retrieve the profile of the customer by using the fewest Request Units (RUs).
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank développe un assistant conversationnel Python qui personnalise ses réponses à l'aide des profils clients. Les profils sont stockés dans le conteneur **profiles** de la base de données **assistant** d'un compte Azure Cosmos DB for NoSQL. La clé de partition du conteneur est **/customerId**, et l'`id` de chaque élément de profil est égal à sa valeur `customerId`.

    L'assistant s'exécute avec une identité managée qui dispose d'un rôle de plan de données lui permettant de lire des éléments. La stratégie de sécurité interdit les clés de compte dans le code et dans la configuration.

    Pour chaque conversation, l'assistant connaît le `customerId`. Vous devez récupérer le profil du client en utilisant le moins d'unités de requête (RU) possible.
