id: ai200-sr2-revision-provisioning
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys runs a Python ranking API as a container app named **ca-tailspin-rank** in a Container Apps environment named **cae-tailspin**. The environment sends its logs to a Log Analytics workspace named **log-tailspin**.

    You deploy a new image tag, which creates the revision **ca-tailspin-rank--v4**. The revision never gets a running replica, and the previous revision still receives all the traffic.

    You need to read the error that the Container Apps service reported while it provisioned ca-tailspin-rank--v4, such as an image pull failure.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys exécute une API de classement Python dans une application conteneur nommée **ca-tailspin-rank**, dans un environnement Container Apps nommé **cae-tailspin**. L'environnement envoie ses journaux à un espace de travail Log Analytics nommé **log-tailspin**.

    Vous déployez une nouvelle balise d'image, ce qui crée la révision **ca-tailspin-rank--v4**. La révision n'obtient jamais de réplica en cours d'exécution, et la révision précédente reçoit toujours tout le trafic.

    Vous devez lire l'erreur que le service Container Apps a signalée pendant l'approvisionnement de ca-tailspin-rank--v4, par exemple un échec de tirage d'image.
