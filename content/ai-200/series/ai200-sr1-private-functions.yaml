id: ai200-sr1-private-functions
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation is developing a Python 3.12 function app named **func-adatum-enrich**. Its functions are triggered by messages from an Azure Service Bus queue. They generate embeddings for new documents and write the results to an Azure Cosmos DB for NoSQL account.

    The Cosmos DB account has public network access disabled and is reachable only through a private endpoint in a virtual network named **vnet-adatum**.

    Messages arrive in bursts during business hours, and no messages arrive at night. You need to choose the hosting for func-adatum-enrich. The solution must meet the following requirements:

    - The functions must reach the Cosmos DB account through vnet-adatum.
    - When no messages arrive, the app must scale to zero instances so that no compute is billed.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation développe une application de fonction Python 3.12 nommée **func-adatum-enrich**. Ses fonctions sont déclenchées par les messages d'une file d'attente Azure Service Bus. Elles génèrent des incorporations pour les nouveaux documents et écrivent les résultats dans un compte Azure Cosmos DB for NoSQL.

    L'accès au réseau public est désactivé sur le compte Cosmos DB, qui n'est accessible que par un point de terminaison privé dans un réseau virtuel nommé **vnet-adatum**.

    Les messages arrivent par rafales pendant les heures ouvrables, et aucun message n'arrive la nuit. Vous devez choisir l'hébergement de func-adatum-enrich. La solution doit répondre aux exigences suivantes :

    - Les fonctions doivent atteindre le compte Cosmos DB par le biais de vnet-adatum.
    - Lorsqu'aucun message n'arrive, l'application doit se mettre à l'échelle jusqu'à zéro instance afin qu'aucun calcul ne soit facturé.
