id: ai200-sr1-slow-requests
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware has a Python API named **api-proseware-rag** that answers questions by using retrieval-augmented generation. The API sends its telemetry to a workspace-based Application Insights resource. The Log Analytics workspace contains the telemetry of api-proseware-rag only.

    Users report slow answers. You need to write a KQL query that returns the five request names, from the `Name` column of the `AppRequests` table, that have the highest 95th percentile duration over the last 24 hours. The query must return one row per request name, sorted from the slowest to the fastest.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware dispose d'une API Python nommée **api-proseware-rag** qui répond aux questions à l'aide de la génération augmentée de récupération. L'API envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail. L'espace de travail Log Analytics contient uniquement la télémétrie de api-proseware-rag.

    Les utilisateurs signalent des réponses lentes. Vous devez écrire une requête KQL qui renvoie les cinq noms de requête, issus de la colonne `Name` de la table `AppRequests`, qui ont la durée au 95e centile la plus élevée sur les dernières 24 heures. La requête doit renvoyer une ligne par nom de requête, triée de la plus lente à la plus rapide.
