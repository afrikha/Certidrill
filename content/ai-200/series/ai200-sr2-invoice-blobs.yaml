id: ai200-sr2-invoice-blobs
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation extracts data from supplier invoices with an AI pipeline. Suppliers upload PDF files to the **invoices** container of a general-purpose v2 storage account named **stadatuminv**.

    You develop a function named **process_invoice** by using the Python v2 programming model. It is deployed to a function app named **func-adatum-inv** that is hosted in a **Flex Consumption** plan. The app setting **InvoiceStorage** defines the connection to stadatuminv, and version 5.x of the Storage extension is used.

    You need process_invoice to run for every new blob in the invoices container and to receive the blob as a `func.InputStream` parameter.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation extrait les données des factures fournisseurs à l'aide d'un pipeline IA. Les fournisseurs chargent des fichiers PDF dans le conteneur **invoices** d'un compte de stockage v2 universel nommé **stadatuminv**.

    Vous développez une fonction nommée **process_invoice** à l'aide du modèle de programmation Python v2. Elle est déployée dans une application de fonction nommée **func-adatum-inv** hébergée dans un plan **Flex Consumption**. Le paramètre d'application **InvoiceStorage** définit la connexion à stadatuminv, et la version 5.x de l'extension Storage est utilisée.

    Vous devez faire en sorte que process_invoice s'exécute pour chaque nouvel objet blob du conteneur invoices et reçoive l'objet blob sous la forme d'un paramètre `func.InputStream`.
