id: ai200-sr1-search-capacity
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure Database for PostgreSQL flexible server named **pg-northwind-rag** in the Memory Optimized tier with 8 vCores. The server stores document chunks and their embeddings in a table that has an HNSW index created by using pgvector.

    Two Python services use pg-northwind-rag:

    - An ingestion service inserts new chunks continuously.
    - A search API runs read-only vector similarity queries. It uses a client-side connection pool of 20 connections.

    Search traffic has tripled. Azure Monitor shows that CPU percent stays above 95 percent, that the vector similarity queries consume most of the CPU, and that Memory percent and Storage IO percent stay below 50 percent.

    You need to increase the query capacity available to the search API. The search API can tolerate replication lag. The ingestion service must keep writing to pg-northwind-rag without any change.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un serveur flexible Azure Database for PostgreSQL nommé **pg-northwind-rag**, du niveau Memory Optimized avec 8 vCores. Le serveur stocke des fragments de documents et leurs incorporations dans une table qui comporte un index HNSW créé à l'aide de pgvector.

    Deux services Python utilisent pg-northwind-rag :

    - Un service d'ingestion insère de nouveaux fragments en continu.
    - Une API de recherche exécute des requêtes de similarité vectorielle en lecture seule. Elle utilise un pool de connexions côté client de 20 connexions.

    Le trafic de recherche a triplé. Azure Monitor montre que le pourcentage de processeur reste au-dessus de 95 %, que les requêtes de similarité vectorielle consomment l'essentiel du processeur, et que le pourcentage de mémoire et le pourcentage d'E/S de stockage restent sous 50 %.

    Vous devez augmenter la capacité de requête disponible pour l'API de recherche. L'API de recherche peut tolérer un décalage de réplication. Le service d'ingestion doit continuer à écrire dans pg-northwind-rag sans aucune modification.
