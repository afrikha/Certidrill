id: ai200-sr2-pg-connections
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam runs a retrieval API written in Python. Each request opens a new psycopg connection to an Azure Database for PostgreSQL flexible server named **pg-fabrikam**, runs one pgvector query, and closes the connection. pg-fabrikam uses the **General Purpose** compute tier, and the app connects to `pg-fabrikam.postgres.database.azure.com` on port **5432**.

    During traffic peaks, the API scales out to many instances. Requests fail with "too many connections" errors, and opening connections adds noticeable latency.

    You need to reuse server connections across requests and instances so that the API stays within the connection limit and spends less time opening connections. The solution must not change the compute tier of pg-fabrikam.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam exécute une API de récupération écrite en Python. Chaque requête ouvre une nouvelle connexion psycopg à un serveur flexible Azure Database for PostgreSQL nommé **pg-fabrikam**, exécute une requête pgvector, puis ferme la connexion. pg-fabrikam utilise le niveau de calcul **General Purpose**, et l'application se connecte à `pg-fabrikam.postgres.database.azure.com` sur le port **5432**.

    Lors des pics de trafic, l'API effectue un scale-out sur de nombreuses instances. Des requêtes échouent avec des erreurs « too many connections », et l'ouverture des connexions ajoute une latence notable.

    Vous devez réutiliser les connexions au serveur entre les requêtes et les instances afin que l'API reste sous la limite de connexions et passe moins de temps à ouvrir des connexions. La solution ne doit pas modifier le niveau de calcul de pg-fabrikam.
