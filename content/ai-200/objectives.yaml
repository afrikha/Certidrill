# AI-200 objectives — official study guide (en-us and fr-fr pages, checked on 2026-11-16; the page has
# no "Skills measured as of" line, page date 2026-04-15). English verbatim (plain hyphens). French
# from the fr-fr page, with its machine-translation slips corrected (word order such as
# "Azure services de gestion des données", imperatives, final periods) and product names kept in
# English (Azure Cosmos DB for NoSQL, Azure Database for PostgreSQL, Azure Managed Redis).
# `code` is the stable key referenced by question files and course sections.
containers:
- group:
    en: Implement container application hosting
    fr: Implémenter l'hébergement d'applications conteneurisées
  objectives:
  - code: 1.1.1
    en: Build, store, version, and manage container images by using Azure Container Registry
    fr: Générer, stocker, versionner et gérer des images conteneur à l'aide d'Azure Container Registry
  - code: 1.1.2
    en: Build and run images by using Azure Container Registry Tasks
    fr: Générer et exécuter des images à l'aide d'Azure Container Registry Tasks
  - code: 1.1.3
    en: Deploy containers to Azure App Service, including configuring App Service to supply environment variables and secrets
    fr: Déployer des conteneurs sur Azure App Service, notamment la configuration d'App Service pour fournir des variables d'environnement et des secrets
- group:
    en: Implement container-orchestrated solutions
    fr: Implémenter des solutions orchestrées par conteneur
  objectives:
  - code: 1.2.1
    en: Deploy applications to Azure Container Apps, including environment configuration and revision management
    fr: Déployer des applications sur Azure Container Apps, y compris la configuration de l'environnement et la gestion des révisions
  - code: 1.2.2
    en: Implement event-driven scaling by using Kubernetes Event-driven Autoscaling (KEDA) in Container Apps
    fr: Implémenter la mise à l'échelle pilotée par les événements à l'aide de Kubernetes Event-driven Autoscaling (KEDA) dans Container Apps
  - code: 1.2.3
    en: Deploy and manage applications to Azure Kubernetes Service (AKS) by using manifest files
    fr: Déployer et gérer des applications sur Azure Kubernetes Service (AKS) à l'aide de fichiers manifeste
  - code: 1.2.4
    en: Monitor and troubleshoot solutions on AKS and Container Apps by inspecting logs, events, and end-to-end connectivity
    fr: Surveiller et dépanner des solutions sur AKS et Container Apps en inspectant les journaux, les événements et la connectivité de bout en bout
data:
- group:
    en: Develop AI solutions by using Azure Cosmos DB for NoSQL
    fr: Développer des solutions IA à l'aide d'Azure Cosmos DB for NoSQL
  objectives:
  - code: 2.1.1
    en: Connect to Azure Cosmos DB for NoSQL by using the SDK and run queries
    fr: Se connecter à Azure Cosmos DB for NoSQL à l'aide du kit de développement logiciel (SDK) et exécuter des requêtes
  - code: 2.1.2
    en: Optimize query performance and Request Units (RUs) consumption by using indexing policies and consistency levels
    fr: Optimiser les performances des requêtes et la consommation d'unités de requête (RU) à l'aide de stratégies d'indexation et de niveaux de cohérence
  - code: 2.1.3
    en: Store and retrieve embeddings and execute vector similarity search for semantic retrieval
    fr: Stocker et récupérer des incorporations et exécuter la recherche de similarité vectorielle pour la récupération sémantique
  - code: 2.1.4
    en: Implement a change feed processor to detect and handle new or updated items
    fr: Implémenter un processeur de flux de modification pour détecter et gérer les éléments nouveaux ou mis à jour
- group:
    en: Develop AI solutions by using Azure Database for PostgreSQL
    fr: Développer des solutions IA à l'aide d'Azure Database for PostgreSQL
  objectives:
  - code: 2.2.1
    en: Connect and query Azure Database for PostgreSQL by using SDKs
    fr: Se connecter à Azure Database for PostgreSQL et l'interroger à l'aide de kits de développement logiciel (SDK)
  - code: 2.2.2
    en: Model schemas and implement indexing strategies, including designing tables and choosing appropriate data types
    fr: Modéliser des schémas et implémenter des stratégies d'indexation, notamment la conception de tables et le choix des types de données appropriés
  - code: 2.2.3
    en: Implement indexing strategies, including optimizing query latency and reducing pgvector compute overhead
    fr: Implémenter des stratégies d'indexation, notamment l'optimisation de la latence des requêtes et la réduction de la surcharge de calcul pgvector
  - code: 2.2.4
    en: Configure compute, memory, and storage resources to support vector workloads
    fr: Configurer les ressources de calcul, de mémoire et de stockage pour prendre en charge les charges de travail vectorielles
  - code: 2.2.5
    en: Run vector similarity search, including storing embeddings, semantic retrieval, and implementing retrieval-augmented generation (RAG) patterns by using metadata filter
    fr: Exécuter la recherche de similarité vectorielle, notamment le stockage d'incorporations, la récupération sémantique et l'implémentation de modèles de génération augmentée de récupération (RAG) à l'aide d'un filtre de métadonnées
  - code: 2.2.6
    en: Implement connection optimization to improve throughput and minimize latency
    fr: Implémenter l'optimisation des connexions pour améliorer le débit et réduire la latence
- group:
    en: Integrate Azure Managed Redis in AI solutions
    fr: Intégrer Azure Managed Redis dans les solutions IA
  objectives:
  - code: 2.3.1
    en: Implement Azure Managed Redis data operations, including caching, expiration, and invalidation
    fr: Implémenter les opérations de données Azure Managed Redis, notamment la mise en cache, l'expiration et l'invalidation
  - code: 2.3.2
    en: Implement vector indexing to enable similarity search
    fr: Implémenter l'indexation vectorielle pour activer la recherche de similarité
integration:
- group:
    en: Develop event- and message-based AI solutions
    fr: Développer des solutions IA basées sur des événements et des messages
  objectives:
  - code: 3.1.1
    en: Queue and process back-end operations by using Azure Service Bus, including dead-letter queue handling, messages, topics, and subscriptions
    fr: Mettre en file d'attente et traiter les opérations back-end à l'aide d'Azure Service Bus, y compris la gestion de la file d'attente de lettres mortes, des messages, des rubriques et des abonnements
  - code: 3.1.2
    en: Implement event-driven workflows by using Azure Event Grid, including filters, custom events, and retries
    fr: Implémenter des flux de travail pilotés par les événements à l'aide d'Azure Event Grid, notamment des filtres, des événements personnalisés et des nouvelles tentatives
- group:
    en: Develop and implement Azure Functions
    fr: Développer et implémenter Azure Functions
  objectives:
  - code: 3.2.1
    en: Build serverless APIs, including implementing triggers and bindings
    fr: Générer des API serverless, notamment l'implémentation de déclencheurs et de liaisons
  - code: 3.2.2
    en: Configure and deploy function apps
    fr: Configurer et déployer des applications de fonction
secure-monitor:
- group:
    en: Implement secure Azure solutions
    fr: Implémenter des solutions Azure sécurisées
  objectives:
  - code: 4.1.1
    en: Secure secrets by using Azure Key Vault, including rotation and retrieval
    fr: Sécuriser les secrets à l'aide d'Azure Key Vault, notamment la rotation et la récupération
  - code: 4.1.2
    en: Store and retrieve app configuration information by using Azure App Configuration
    fr: Stocker et récupérer des informations de configuration d'application à l'aide d'Azure App Configuration
- group:
    en: Monitor and troubleshoot Azure solutions
    fr: Surveiller et résoudre les problèmes liés aux solutions Azure
  objectives:
  - code: 4.2.1
    en: Trace distributed systems by using OpenTelemetry SDKs
    fr: Tracer des systèmes distribués à l'aide des kits SDK OpenTelemetry
  - code: 4.2.2
    en: Write KQL queries to analyze logs and metrics
    fr: Écrire des requêtes KQL pour analyser les journaux et les métriques
