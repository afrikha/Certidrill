id: ai200-3b-app-settings-env
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware deploys a Python function app to Azure. The app setting `SEARCH_ENDPOINT` contains the URL of the vector search service used by the functions. The same code must also work locally, where the value is defined in local.settings.json.

    Which code should the functions use to read the value?
  fr: |
    Litware déploie une application de fonction Python dans Azure. Le paramètre d'application `SEARCH_ENDPOINT` contient l'URL du service de recherche vectorielle utilisé par les fonctions. Le même code doit aussi fonctionner en local, où la valeur est définie dans local.settings.json.

    Quel code les fonctions doivent-elles utiliser pour lire la valeur ?
body:
  options:
    - { id: a, text: "endpoint = json.load(open(\"local.settings.json\"))[\"Values\"][\"SEARCH_ENDPOINT\"]" }
    - { id: b, text: "endpoint = json.load(open(\"host.json\"))[\"SEARCH_ENDPOINT\"]" }
    - { id: c, text: "endpoint = os.getenv(\"SEARCH_ENDPOINT\")" }
    - { id: d, text: "endpoint = \"%SEARCH_ENDPOINT%\"" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      App settings are exposed to the Python worker as environment variables, read with os.environ or os.getenv. Locally, Core Tools loads the Values of local.settings.json as environment variables, so the same code works in both places.
    fr: |
      Les paramètres d'application sont exposés au Worker Python sous forme de variables d'environnement, lues avec os.environ ou os.getenv. En local, Core Tools charge les Values de local.settings.json comme variables d'environnement : le même code fonctionne donc aux deux endroits.
  options:
    a: { en: "local.settings.json is never published, so this code fails in Azure.", fr: "local.settings.json n'est jamais publié : ce code échoue dans Azure." }
    b: { en: "App settings aren't stored in host.json.", fr: "Les paramètres d'application ne sont pas stockés dans host.json." }
    d: { en: "Percent-sign expressions are resolved in binding properties, not in Python strings.", fr: "Les expressions entre signes pourcentage sont résolues dans les propriétés de liaison, pas dans les chaînes Python." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
