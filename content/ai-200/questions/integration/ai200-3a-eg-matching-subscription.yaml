id: ai200-3a-eg-matching-subscription
objective: "3.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso publishes model lifecycle events to an Event Grid custom topic. The topic has the event subscriptions shown in the following table. No other filter is configured, and subject filters use the default case-insensitive comparison.

    Two events are published:

    - Event 1: type `Contoso.Model.Deployed`, subject `/models/speech/v3`, data `{"accuracy": 0.93}`
    - Event 2: type `Contoso.Model.Retired`, subject `/models/vision/v1`, data `{"stage": "staging"}`

    For each event, select the event subscription that delivers it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie des événements de cycle de vie des modèles dans une rubrique personnalisée Event Grid. La rubrique possède les abonnements aux événements présentés dans le tableau suivant. Aucun autre filtre n'est configuré, et les filtres d'objet utilisent la comparaison par défaut, sans respect de la casse.

    Deux événements sont publiés :

    - Événement 1 : type `Contoso.Model.Deployed`, objet `/models/speech/v3`, données `{"accuracy": 0.93}`
    - Événement 2 : type `Contoso.Model.Retired`, objet `/models/vision/v1`, données `{"stage": "staging"}`

    Pour chaque événement, sélectionnez l'abonnement aux événements qui le remet.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Event 1", fr: "Événement 1" }
    - id: p2
      text: { en: "Event 2", fr: "Événement 2" }
  grid:
    header: [{ en: "Event subscription", fr: "Abonnement aux événements" }, { en: "Included event types", fr: "Types d'événements inclus" }, { en: "Subject begins with", fr: "L'objet commence par" }, { en: "Advanced filter", fr: "Filtre avancé" }]
    rows:
      - [{ text: sub-vision, area: a }, { text: Contoso.Model.Deployed }, { text: /models/vision/ }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: sub-prod, area: b }, { text: { en: "All", fr: "Tous" } }, { text: /models/ }, { text: "data.stage StringIn prod" }]
      - [{ text: sub-speech, area: c }, { text: Contoso.Model.Deployed }, { text: /models/speech/ }, { text: "data.accuracy NumberGreaterThanOrEquals 0.9" }]
      - [{ text: sub-retired, area: d }, { text: Contoso.Model.Retired }, { text: /models/ }, { text: { en: "None", fr: "Aucun" } }]
answer:
  values: { p1: c, p2: d }
explanation:
  correct:
    en: |
      Event type, subject and advanced filters are combined with AND. Event 1 matches sub-speech (type, prefix, and 0.93 is at least 0.9); it fails sub-vision on the subject, sub-retired on the type, and sub-prod because the event has no stage key, and a missing key doesn't match StringIn. Event 2 matches sub-retired; it fails sub-prod because staging isn't in the values, and sub-vision and sub-speech on the event type.
    fr: |
      Le type d'événement, l'objet et les filtres avancés se combinent par ET. L'événement 1 correspond à sub-speech (type, préfixe, et 0,93 est au moins égal à 0,9) ; il échoue sur sub-vision à cause de l'objet, sur sub-retired à cause du type, et sur sub-prod car l'événement n'a pas de clé stage, et une clé absente ne correspond pas à StringIn. L'événement 2 correspond à sub-retired ; il échoue sur sub-prod car staging ne fait pas partie des valeurs, et sur sub-vision et sub-speech à cause du type d'événement.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
