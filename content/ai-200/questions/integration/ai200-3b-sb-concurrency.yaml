id: ai200-3b-sb-concurrency
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a Python function app on a Premium plan. A function triggered by the Service Bus queue **translate-jobs** calls an Azure OpenAI deployment for each message. Each instance of the app receives HTTP 429 responses when it runs more than four translations at the same time.

    You need to limit each instance to four concurrent executions of the function. Each execution must still receive one message.

    What should you configure in host.json?
  fr: |
    Litware exécute une application de fonction Python sur un plan Premium. Une fonction déclenchée par la file d'attente Service Bus **translate-jobs** appelle un déploiement Azure OpenAI pour chaque message. Chaque instance de l'application reçoit des réponses HTTP 429 quand elle exécute plus de quatre traductions en même temps.

    Vous devez limiter chaque instance à quatre exécutions simultanées de la fonction. Chaque exécution doit toujours recevoir un seul message.

    Que devez-vous configurer dans host.json ?
body:
  options:
    - { id: a, text: { en: "Set extensions.serviceBus.prefetchCount to 4.", fr: "Définir extensions.serviceBus.prefetchCount sur 4." } }
    - { id: b, text: { en: "Set extensions.serviceBus.maxMessageBatchSize to 4.", fr: "Définir extensions.serviceBus.maxMessageBatchSize sur 4." } }
    - { id: c, text: { en: "Set extensions.serviceBus.maxConcurrentCalls to 4.", fr: "Définir extensions.serviceBus.maxConcurrentCalls sur 4." } }
    - { id: d, text: { en: "Set extensions.serviceBus.maxConcurrentSessions to 4.", fr: "Définir extensions.serviceBus.maxConcurrentSessions sur 4." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      maxConcurrentCalls limits the number of concurrent calls to the function that can be started per scaled instance (16 by default). Setting it to 4 caps each instance at four translations while each call still processes a single message.
    fr: |
      maxConcurrentCalls limite le nombre d'appels simultanés de la fonction qui peuvent démarrer sur chaque instance mise à l'échelle (16 par défaut). Le définir sur 4 plafonne chaque instance à quatre traductions, chaque appel traitant toujours un seul message.
  options:
    a: { en: "prefetchCount sets how many messages the receiver can request in advance (0 by default); it does not limit concurrent executions.", fr: "prefetchCount définit combien de messages le récepteur peut demander à l'avance (0 par défaut) ; il ne limite pas les exécutions simultanées." }
    b: { en: "maxMessageBatchSize applies to batched functions (cardinality MANY) and sets how many messages each call receives.", fr: "maxMessageBatchSize s'applique aux fonctions par lots (cardinalité MANY) et définit combien de messages chaque appel reçoit." }
    d: { en: "maxConcurrentSessions applies to session-enabled queues, which this scenario does not use.", fr: "maxConcurrentSessions s'applique aux files d'attente avec sessions, que ce scénario n'utilise pas." }
references:
  - title: Azure Service Bus bindings for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus
