id: ai200-3a-session-design
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Consolidated Messenger runs an AI assistant that updates support tickets. Each customer's ticket updates must be processed in the order they were sent, while the updates of different customers must be processed in parallel by several worker replicas.

    You are creating a queue named **ticket-updates** in a Standard namespace and updating the producer code that uses the azure-servicebus library.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Consolidated Messenger exploite un assistant IA qui met à jour des tickets de support. Les mises à jour de tickets de chaque client doivent être traitées dans l'ordre d'envoi, tandis que les mises à jour de clients différents doivent être traitées en parallèle par plusieurs réplicas du worker.

    Vous créez une file d'attente nommée **ticket-updates** dans un espace de noms Standard et vous mettez à jour le code du producteur qui utilise la bibliothèque azure-servicebus.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the message ID of each update to the customer ID, and enable duplicate detection on ticket-updates.", fr: "Définir l'ID de message de chaque mise à jour sur l'ID du client, et activer la détection des doublons sur ticket-updates." } }
    - { id: b, text: { en: "Create ticket-updates with sessions enabled.", fr: "Créer ticket-updates avec les sessions activées." } }
    - { id: c, text: { en: "Set the partition key of each update to the customer ID.", fr: "Définir la clé de partition de chaque mise à jour sur l'ID du client." } }
    - { id: d, text: { en: "Set the session ID of each update to the customer ID.", fr: "Définir l'ID de session de chaque mise à jour sur l'ID du client." } }
    - { id: e, text: { en: "Run a single worker replica with prefetch_count set to 1.", fr: "Exécuter un seul réplica du worker avec prefetch_count défini sur 1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Sessions guarantee ordered processing within a session, and a session is locked by one receiver at a time, so different customers' sessions are processed in parallel by different replicas. Sessions are enabled on the queue when it is created, and the producer groups the updates by setting the session ID to the customer ID.
    fr: |
      Les sessions garantissent un traitement ordonné au sein d'une session, et une session n'est verrouillée que par un récepteur à la fois : les sessions de clients différents sont donc traitées en parallèle par des réplicas différents. Les sessions s'activent sur la file d'attente à sa création, et le producteur regroupe les mises à jour en définissant l'ID de session sur l'ID du client.
  options:
    a:
      en: |
        Duplicate detection would drop every update of a customer after the first one sent within the detection window.
      fr: |
        La détection des doublons écarterait chaque mise à jour d'un client après la première envoyée pendant la fenêtre de détection.
    c:
      en: |
        A partition key places messages on a partition of a partitioned entity; it doesn't make receivers process them in order.
      fr: |
        Une clé de partition place les messages sur une partition d'une entité partitionnée ; elle ne fait pas traiter les messages dans l'ordre par les récepteurs.
    e:
      en: |
        A single replica gives order but loses the required parallel processing across customers.
      fr: |
        Un seul réplica donne l'ordre mais perd le traitement parallèle exigé entre clients.
references:
  - title: Azure Service Bus Enable FIFO with Sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
