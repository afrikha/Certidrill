id: ai200-3a-eg-custom-topic
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a model evaluation service written in Python. When an evaluation run finishes, the service must notify three handlers: an Azure function that updates a leaderboard, a webhook of the MLOps portal, and an Azure function that opens a ticket when the score is low.

    The handlers must receive each notification by push, and Contoso wants to pay per event without managing brokers.

    What should the evaluation service publish to?
  fr: |
    Contoso exploite un service d'évaluation de modèles écrit en Python. Quand une exécution d'évaluation se termine, le service doit avertir trois gestionnaires : une fonction Azure qui met à jour un classement, un webhook du portail MLOps et une fonction Azure qui ouvre un ticket quand le score est faible.

    Les gestionnaires doivent recevoir chaque notification par push, et Contoso veut payer par événement sans gérer de répartiteurs.

    Vers quoi le service d'évaluation doit-il publier ?
body:
  options:
    - { id: a, text: { en: "A Service Bus queue that the three handlers read", fr: "Une file d'attente Service Bus lue par les trois gestionnaires" } }
    - { id: b, text: { en: "An event hub with one consumer group per handler", fr: "Un hub d'événements avec un groupe de consommateurs par gestionnaire" } }
    - { id: c, text: { en: "A system topic created on the storage account that stores the results", fr: "Une rubrique système créée sur le compte de stockage qui stocke les résultats" } }
    - { id: d, text: { en: "An Event Grid custom topic with one event subscription per handler", fr: "Une rubrique personnalisée Event Grid avec un abonnement aux événements par gestionnaire" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An application publishes its own events to an Event Grid custom topic. Each event subscription pushes a copy of the matching events to its handler, such as an Azure function or a webhook, and Event Grid bills per operation.
    fr: |
      Une application publie ses propres événements dans une rubrique personnalisée Event Grid. Chaque abonnement aux événements pousse une copie des événements correspondants vers son gestionnaire, par exemple une fonction Azure ou un webhook, et Event Grid facture par opération.
  options:
    a:
      en: |
        A queue delivers each message to one receiver only, and receivers pull messages instead of being pushed to.
      fr: |
        Une file d'attente ne remet chaque message qu'à un seul récepteur, et les récepteurs extraient les messages au lieu de les recevoir par push.
    b:
      en: |
        Event Hubs consumers read the stream themselves; Event Hubs doesn't push to webhooks.
      fr: |
        Les consommateurs Event Hubs lisent eux-mêmes le flux ; Event Hubs ne pousse rien vers des webhooks.
    c:
      en: |
        A system topic publishes the events of an Azure service, such as blob creation; it can't carry the custom "evaluation finished" event and its score.
      fr: |
        Une rubrique système publie les événements d'un service Azure, par exemple la création d'un objet blob ; elle ne peut pas transporter l'événement personnalisé « évaluation terminée » et son score.
references:
  - title: Azure Event Grid client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/eventgrid-readme
  - title: Azure Event Grid Delivery and Retry Explained
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
