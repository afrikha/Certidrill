id: ai200-3b-app-settings-behavior
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware manages the app settings of a Python function app named **func-pro-agent** on a Premium plan. The app setting `FUNCTIONS_EXTENSION_VERSION` is `~4`, and several settings are Key Vault references.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware gère les paramètres d'application d'une application de fonction Python nommée **func-pro-agent** sur un plan Premium. Le paramètre d'application `FUNCTIONS_EXTENSION_VERSION` vaut `~4`, et plusieurs paramètres sont des références Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When a new minor version of the version 4 runtime is available, it is installed in func-pro-agent automatically.
        fr: |
          Quand une nouvelle version mineure du runtime version 4 est disponible, elle est installée automatiquement dans func-pro-agent.
    - id: s2
      text:
        en: |
          Setting both APPINSIGHTS_INSTRUMENTATIONKEY and APPLICATIONINSIGHTS_CONNECTION_STRING is recommended for redundancy.
        fr: |
          Il est recommandé de définir à la fois APPINSIGHTS_INSTRUMENTATIONKEY et APPLICATIONINSIGHTS_CONNECTION_STRING par redondance.
    - id: s3
      text:
        en: |
          Changing any app setting restarts the app, and the Key Vault references are fetched again.
        fr: |
          La modification d'un paramètre d'application redémarre l'application, et les références Key Vault sont récupérées de nouveau.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A tilde with the major version (~4) means the latest version of that major version, and new minor versions are installed automatically. You shouldn't set both Application Insights settings; Learn recommends the connection string in all cases. Any configuration change restarts the app and causes an immediate refetch of all referenced secrets.
    fr: |
      Un tilde suivi de la version majeure (~4) désigne la dernière version de cette version majeure, et les nouvelles versions mineures s'installent automatiquement. Il ne faut pas définir les deux paramètres Application Insights ; Learn recommande la chaîne de connexion dans tous les cas. Toute modification de configuration redémarre l'application et entraîne une nouvelle récupération immédiate de tous les secrets référencés.
references:
  - title: App settings reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-app-settings
  - title: Use Key Vault References as App Settings - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
