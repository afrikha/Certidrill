id: ai200-3b-sync-triggers
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam hosts function apps on a Dedicated (App Service) plan. After some deployments, a new Service Bus triggered function doesn't run until someone restarts the app, because the platform doesn't know about the new trigger.

    After which two deployment methods must you sync triggers manually?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam héberge des applications de fonction sur un plan Dedicated (App Service). Après certains déploiements, une nouvelle fonction déclenchée par Service Bus ne s'exécute pas tant que quelqu'un ne redémarre pas l'application, car la plateforme ne connaît pas le nouveau déclencheur.

    Après quelles deux méthodes de déploiement devez-vous synchroniser les déclencheurs manuellement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Publishing with func azure functionapp publish", fr: "Publication avec func azure functionapp publish" } }
    - { id: b, text: { en: "ZIP deployment with az functionapp deployment source config-zip", fr: "Déploiement ZIP avec az functionapp deployment source config-zip" } }
    - { id: c, text: { en: "Uploading the files over FTPS", fr: "Chargement des fichiers via FTPS" } }
    - { id: d, text: { en: "Setting WEBSITE_RUN_FROM_PACKAGE to the URL of an external package", fr: "Définir WEBSITE_RUN_FROM_PACKAGE sur l'URL d'un package externe" } }
    - { id: e, text: { en: "Publishing from Visual Studio Code", fr: "Publication depuis Visual Studio Code" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Triggers must always be synced manually after deployments that use an external package URL, Local Git or FTPS. You sync them by restarting the app or by sending a POST request to the syncfunctiontriggers API of the app.
    fr: |
      Les déclencheurs doivent toujours être synchronisés manuellement après les déploiements qui utilisent une URL de package externe, Git local ou FTPS. Vous les synchronisez en redémarrant l'application ou en envoyant une requête POST à l'API syncfunctiontriggers de l'application.
  options:
    a: { en: "Core Tools publishing syncs the triggers for you.", fr: "La publication avec Core Tools synchronise les déclencheurs pour vous." }
    b: { en: "ZIP deployment through the platform syncs the triggers as part of the deployment.", fr: "Le déploiement ZIP via la plateforme synchronise les déclencheurs pendant le déploiement." }
    e: { en: "Visual Studio Code publishing syncs the triggers for you.", fr: "La publication depuis Visual Studio Code synchronise les déclencheurs pour vous." }
references:
  - title: Deployment technologies in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-technologies
