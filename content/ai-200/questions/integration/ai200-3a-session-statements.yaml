id: ai200-3a-session-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Bellows College runs an AI tutoring service. A session-enabled Service Bus queue named **tutor-turns** receives the turns of each tutoring conversation, with the session ID set to the conversation ID. Three replicas of a Python worker each create a receiver with `session_id=NEXT_AVAILABLE_SESSION`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Bellows College exploite un service de tutorat par IA. Une file d'attente Service Bus avec sessions activées nommée **tutor-turns** reçoit les tours de chaque conversation de tutorat, l'ID de session étant l'ID de la conversation. Trois réplicas d'un worker Python créent chacun un récepteur avec `session_id=NEXT_AVAILABLE_SESSION`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Each receiver gets messages from several conversations at the same time, in arrival order.
        fr: |
          Chaque récepteur reçoit simultanément des messages de plusieurs conversations, dans l'ordre d'arrivée.
    - id: s2
      text:
        en: |
          Two replicas can process turns of the same conversation at the same time.
        fr: |
          Deux réplicas peuvent traiter en même temps des tours de la même conversation.
    - id: s3
      text:
        en: |
          The session state that a worker sets for a conversation stays in Service Bus after all the turns of the conversation are completed.
        fr: |
          L'état de session qu'un worker définit pour une conversation reste dans Service Bus une fois tous les tours de la conversation terminés.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A receiver created with NEXT_AVAILABLE_SESSION locks one available session and receives only the messages of that session. Only one receiver can hold the lock of a session at a time, so the turns of a conversation are never processed in parallel. Session state persists after all messages are consumed and counts toward the storage quota of the entity, so the worker should clear it when the conversation ends.
    fr: |
      Un récepteur créé avec NEXT_AVAILABLE_SESSION verrouille une session disponible et ne reçoit que les messages de cette session. Un seul récepteur peut détenir le verrou d'une session à la fois : les tours d'une conversation ne sont donc jamais traités en parallèle. L'état de session persiste après la consommation de tous les messages et compte dans le quota de stockage de l'entité : le worker doit l'effacer à la fin de la conversation.
references:
  - title: Azure Service Bus Enable FIFO with Sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - title: azure.servicebus.ServiceBusClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.servicebusclient
