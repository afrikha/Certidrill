id: ai200-3a-eg-missing-key
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fourth Coffee publishes "forecast generated" events to an Event Grid custom topic. Production apps set `data.env` to `prod`; test apps set it to `test`; older apps don't set `data.env` at all.

    An event subscription for the inventory function has a single advanced filter:

    ```json
    { "operatorType": "StringNotIn", "key": "data.env", "values": [ "test" ] }
    ```

    Which events does the subscription deliver?
  fr: |
    Fourth Coffee publie des événements « prévision générée » dans une rubrique personnalisée Event Grid. Les applications de production définissent `data.env` sur `prod` ; les applications de test le définissent sur `test` ; les anciennes applications ne définissent pas `data.env`.

    Un abonnement aux événements de la fonction d'inventaire possède un seul filtre avancé :

    ```json
    { "operatorType": "StringNotIn", "key": "data.env", "values": [ "test" ] }
    ```

    Quels événements l'abonnement remet-il ?
body:
  options:
    - { id: a, text: { en: "Only the events whose data.env is prod", fr: "Uniquement les événements dont data.env vaut prod" } }
    - { id: b, text: { en: "The events whose data.env is prod or that have no data.env key", fr: "Les événements dont data.env vaut prod ou qui n'ont pas de clé data.env" } }
    - { id: c, text: { en: "Only the events that have no data.env key", fr: "Uniquement les événements sans clé data.env" } }
    - { id: d, text: { en: "All the events, because StringNotIn requires at least two values", fr: "Tous les événements, car StringNotIn exige au moins deux valeurs" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the key of an advanced filter is missing from an event, most operators don't match, but NumberNotIn and StringNotIn do. The events from older apps are therefore delivered along with the prod events; only the test events are filtered out. To exclude the events without the key too, add an IsNotNull filter on data.env.
    fr: |
      Quand la clé d'un filtre avancé est absente d'un événement, la plupart des opérateurs ne correspondent pas, mais NumberNotIn et StringNotIn correspondent. Les événements des anciennes applications sont donc remis avec les événements prod ; seuls les événements test sont écartés. Pour exclure aussi les événements sans la clé, ajoutez un filtre IsNotNull sur data.env.
  options:
    a:
      en: |
        StringNotIn matches events where the key is missing, so the events of older apps are delivered too.
      fr: |
        StringNotIn correspond aux événements dont la clé est absente : les événements des anciennes applications sont donc remis eux aussi.
    c:
      en: |
        Events whose data.env is prod also satisfy "not in test" and are delivered.
      fr: |
        Les événements dont data.env vaut prod satisfont aussi « pas dans test » et sont remis.
    d:
      en: |
        An advanced filter can have a single value; the filter is valid and excludes the test events.
      fr: |
        Un filtre avancé peut avoir une seule valeur ; le filtre est valide et exclut les événements test.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
