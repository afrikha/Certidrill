id: ai200-sr1-private-functions-1
objective: "3.2.2"
type: series_yesno
series: ai200-sr1-private-functions
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You host the app in a Premium plan with virtual network integration.
  fr: Vous hébergez l'application dans un plan Premium avec l'intégration au réseau virtuel.
body:
  solution:
    en: |
      You create func-adatum-enrich on Linux in an Elastic Premium **EP1** plan. You configure virtual network integration with a subnet of vnet-adatum.
    fr: |
      Vous créez func-adatum-enrich sur Linux dans un plan Elastic Premium **EP1**. Vous configurez l'intégration au réseau virtuel avec un sous-réseau de vnet-adatum.
answer: { value: false }
explanation:
  correct:
    en: The Premium plan supports virtual network integration, so the functions could reach the private endpoint. However, at least one instance per Premium plan is always kept warm and billed, so the app never scales to zero at night.
    fr: "Le plan Premium prend en charge l'intégration au réseau virtuel : les fonctions pourraient atteindre le point de terminaison privé. Cependant, au moins une instance par plan Premium est toujours maintenue à chaud et facturée : l'application ne se met jamais à l'échelle jusqu'à zéro la nuit."
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
