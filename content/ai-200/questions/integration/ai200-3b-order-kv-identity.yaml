id: ai200-3b-order-kv-identity
objective: "3.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a function app named **func-fab-triage** that has no managed identity. A user-assigned managed identity named **id-fab-secrets** already has the Key Vault Secrets User role on the key vault **kv-fab**.

    The app must read the secret **triage-key** through an app setting that contains a Key Vault reference, and the reference must be resolved with id-fab-secrets.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une application de fonction nommée **func-fab-triage** qui n'a pas d'identité managée. Une identité managée affectée par l'utilisateur nommée **id-fab-secrets** dispose déjà du rôle Key Vault Secrets User sur le coffre de clés **kv-fab**.

    L'application doit lire le secret **triage-key** via un paramètre d'application qui contient une référence Key Vault, et la référence doit être résolue avec id-fab-secrets.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: assign, text: { en: "Assign id-fab-secrets to func-fab-triage.", fr: "Attribuer id-fab-secrets à func-fab-triage." } }
    - { id: refid, text: { en: "Set the keyVaultReferenceIdentity property of func-fab-triage to the resource ID of id-fab-secrets.", fr: "Définir la propriété keyVaultReferenceIdentity de func-fab-triage sur l'ID de ressource de id-fab-secrets." } }
    - { id: setting, text: { en: "Add the app setting TRIAGE_KEY with the value @Microsoft.KeyVault(VaultName=kv-fab;SecretName=triage-key).", fr: "Ajouter le paramètre d'application TRIAGE_KEY avec la valeur @Microsoft.KeyVault(VaultName=kv-fab;SecretName=triage-key)." } }
    - { id: system, text: { en: "Enable the system-assigned managed identity of func-fab-triage.", fr: "Activer l'identité managée affectée par le système de func-fab-triage." } }
    - { id: policy, text: { en: "Add a Get secrets access policy for id-fab-secrets on kv-fab.", fr: "Ajouter une stratégie d'accès Get pour les secrets à id-fab-secrets sur kv-fab." } }
    - { id: local, text: { en: "Copy the secret value to the Values section of local.settings.json.", fr: "Copier la valeur du secret dans la section Values de local.settings.json." } }
answer:
  sequence: [ assign, refid, setting ]
explanation:
  correct:
    en: |
      The user-assigned identity must first be attached to the app. Key Vault references use the system-assigned identity by default, so you then set keyVaultReferenceIdentity to the resource ID of id-fab-secrets; this setting applies to all the references of the app. Finally, the app setting with the reference is resolved by that identity.
    fr: |
      L'identité affectée par l'utilisateur doit d'abord être attachée à l'application. Les références Key Vault utilisent par défaut l'identité affectée par le système : vous définissez donc ensuite keyVaultReferenceIdentity sur l'ID de ressource de id-fab-secrets ; ce paramètre s'applique à toutes les références de l'application. Enfin, le paramètre d'application contenant la référence est résolu par cette identité.
  options:
    system: { en: "The reference must be resolved with id-fab-secrets, not with a system-assigned identity.", fr: "La référence doit être résolue avec id-fab-secrets, pas avec une identité affectée par le système." }
    policy: { en: "The identity already has Key Vault Secrets User through Azure RBAC.", fr: "L'identité dispose déjà de Key Vault Secrets User via Azure RBAC." }
    local: { en: "local.settings.json is only for local runs and is never published.", fr: "local.settings.json ne sert qu'aux exécutions locales et n'est jamais publié." }
references:
  - title: Use Key Vault References as App Settings - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
