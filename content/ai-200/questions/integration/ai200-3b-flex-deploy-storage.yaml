id: ai200-3b-flex-deploy-storage
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is creating a Python function app named **func-fab-ocr** on the Flex Consumption plan by using the Azure CLI. The deployment package must be stored in the **packages** container of a storage account named **stfabdeploy**. The app must access this container by using an existing user-assigned managed identity named **id-fab-deploy**, without storage account keys.

    Which parameters should you add to the `az functionapp create` command, in addition to `--deployment-storage-name stfabdeploy --deployment-storage-container-name packages`?
  fr: |
    Fabrikam crée une application de fonction Python nommée **func-fab-ocr** sur le plan Flex Consumption à l'aide d'Azure CLI. Le package de déploiement doit être stocké dans le conteneur **packages** d'un compte de stockage nommé **stfabdeploy**. L'application doit accéder à ce conteneur avec une identité managée affectée par l'utilisateur existante nommée **id-fab-deploy**, sans clés de compte de stockage.

    Quels paramètres devez-vous ajouter à la commande `az functionapp create`, en plus de `--deployment-storage-name stfabdeploy --deployment-storage-container-name packages` ?
body:
  options:
    - { id: a, text: "--deployment-storage-auth-type SystemAssignedIdentity" }
    - { id: b, text: "--deployment-storage-auth-type UserAssignedIdentity --deployment-storage-auth-value <resource ID of id-fab-deploy>" }
    - { id: c, text: "--deployment-storage-auth-type StorageAccountConnectionString --deployment-storage-auth-value <name of an app setting>" }
    - { id: d, text: "--assign-identity <resource ID of id-fab-deploy>" }
answer: { optionId: b }
explanation:
  correct:
    en: "On Flex Consumption, the app runs from a package stored in a blob container. `--deployment-storage-auth-type` accepts `StorageAccountConnectionString`, `UserAssignedIdentity` or `SystemAssignedIdentity`; with `UserAssignedIdentity`, `--deployment-storage-auth-value` gives the resource ID of the identity."
    fr: "En Flex Consumption, l'application s'exécute à partir d'un package stocké dans un conteneur blob. `--deployment-storage-auth-type` accepte `StorageAccountConnectionString`, `UserAssignedIdentity` ou `SystemAssignedIdentity` ; avec `UserAssignedIdentity`, `--deployment-storage-auth-value` donne l'ID de ressource de l'identité."
  options:
    a: { en: "This uses the app's system-assigned identity, not id-fab-deploy.", fr: "Cette option utilise l'identité affectée par le système de l'application, pas id-fab-deploy." }
    c: { en: "A connection string relies on the storage account key.", fr: "Une chaîne de connexion repose sur la clé du compte de stockage." }
    d: { en: "Assigning the identity to the app doesn't tell the deployment configuration to use it for the package container.", fr: "Attribuer l'identité à l'application n'indique pas à la configuration de déploiement de l'utiliser pour le conteneur du package." }
references:
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
