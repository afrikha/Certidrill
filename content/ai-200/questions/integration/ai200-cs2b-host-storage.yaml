id: ai200-cs2b-host-storage
objective: "3.2.2"
type: multi
caseStudy: ai200-cs2b-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the host storage requirement for func-trey-ingest. stfunctrey uses the standard Azure DNS endpoints. The permissions must be the minimum that the host-required connection needs, including diagnostic events.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative au stockage hôte de func-trey-ingest. stfunctrey utilise les points de terminaison DNS Azure standard. Les autorisations doivent être les autorisations minimales dont la connexion requise par l'hôte a besoin, y compris pour les événements de diagnostic.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Replace the `AzureWebJobsStorage` setting with `AzureWebJobsStorage__accountName` set to `stfunctrey`."
        fr: "Remplacer le paramètre `AzureWebJobsStorage` par `AzureWebJobsStorage__accountName` défini sur `stfunctrey`."
    - id: b
      text:
        en: "Assign the Storage Blob Data Owner role on stfunctrey to the managed identity of func-trey-ingest."
        fr: "Attribuer le rôle Storage Blob Data Owner sur stfunctrey à l'identité managée de func-trey-ingest."
    - id: c
      text:
        en: "Assign the Storage Table Data Contributor role on stfunctrey to the managed identity of func-trey-ingest."
        fr: "Attribuer le rôle Storage Table Data Contributor sur stfunctrey à l'identité managée de func-trey-ingest."
    - id: d
      text:
        en: "Assign the Storage Account Contributor role on stfunctrey to the managed identity of func-trey-ingest."
        fr: "Attribuer le rôle Storage Account Contributor sur stfunctrey à l'identité managée de func-trey-ingest."
    - id: e
      text:
        en: "Store the current connection string in Azure Key Vault and set `AzureWebJobsStorage` to a Key Vault reference."
        fr: "Stocker la chaîne de connexion actuelle dans Azure Key Vault et définir `AzureWebJobsStorage` sur une référence Key Vault."
    - id: f
      text:
        en: "Assign the Storage Blob Data Reader role on stfunctrey to the managed identity of func-trey-ingest."
        fr: "Attribuer le rôle Storage Blob Data Reader sur stfunctrey à l'identité managée de func-trey-ingest."
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: |
      An identity-based host storage connection replaces the connection string with `AzureWebJobsStorage__accountName` when the account uses standard Azure DNS endpoints; the system-assigned identity is used because no client ID is set. Storage Blob Data Owner is the minimum role for the host-required connection, and Storage Table Data Contributor must be added for diagnostic events.
    fr: |
      Une connexion de stockage hôte basée sur l'identité remplace la chaîne de connexion par `AzureWebJobsStorage__accountName` quand le compte utilise les points de terminaison DNS Azure standard ; l'identité affectée par le système est utilisée car aucun ID client n'est défini. Storage Blob Data Owner est le rôle minimal pour la connexion requise par l'hôte, et Storage Table Data Contributor doit être ajouté pour les événements de diagnostic.
  options:
    d:
      en: Storage Account Contributor is a management-plane role; it lets the identity manage the account and its keys, not access blob data with Microsoft Entra ID.
      fr: Storage Account Contributor est un rôle du plan de gestion ; il permet à l'identité de gérer le compte et ses clés, pas d'accéder aux données blob avec Microsoft Entra ID.
    e:
      en: A Key Vault reference hides the connection string, but the app still uses the account key, which the requirement forbids.
      fr: Une référence Key Vault masque la chaîne de connexion, mais l'application utilise toujours la clé de compte, ce que l'exigence interdit.
    f:
      en: The Functions host writes blobs (for example leases and keys), so read-only blob access is not enough.
      fr: |
        L'hôte Functions écrit des objets blob (par exemple des baux et des clés) : un accès en lecture seule aux objets blob ne suffit pas.
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
