id: ai200-3a-filter-on-body
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Margie's Travel publishes the results of a review-moderation model to a Service Bus topic named **moderation**. Each message body is JSON, for example `{"reviewId": "r-1029", "riskScore": 0.92}`. The producer sets no application properties.

    A subscription named **high-risk** must receive only the messages whose risk score is greater than 0.8, so that human moderators read only those reviews.

    What should you do?
  fr: |
    Margie's Travel publie les résultats d'un modèle de modération d'avis dans une rubrique Service Bus nommée **moderation**. Le corps de chaque message est du JSON, par exemple `{"reviewId": "r-1029", "riskScore": 0.92}`. Le producteur ne définit aucune propriété d'application.

    Un abonnement nommé **high-risk** ne doit recevoir que les messages dont le score de risque est supérieur à 0,8, pour que les modérateurs humains ne lisent que ces avis.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a SQL filter riskScore > 0.8 to high-risk, and set the content type of each message to application/json.", fr: "Ajouter un filtre SQL riskScore > 0.8 à high-risk, et définir le type de contenu de chaque message sur application/json." } }
    - { id: b, text: { en: "Add a correlation filter to high-risk on the property riskScore with the value `0.8`.", fr: "Ajouter à high-risk un filtre de corrélation sur la propriété riskScore avec la valeur `0.8`." } }
    - { id: c, text: { en: "Make the producer set an application property riskScore, and add a SQL filter riskScore > 0.8 to high-risk.", fr: "Faire définir par le producteur une propriété d'application riskScore, et ajouter un filtre SQL riskScore > 0.8 à high-risk." } }
    - { id: d, text: { en: "Add a SQL filter with the action SET riskScore = body.riskScore to high-risk.", fr: "Ajouter à high-risk un filtre SQL avec l'action SET riskScore = body.riskScore." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Subscription filters evaluate message properties only and can't read the body. The producer must copy the value it routes on into an application property, and a SQL filter can then compare it with 0.8.
    fr: |
      Les filtres d'abonnement évaluent uniquement les propriétés des messages et ne peuvent pas lire le corps. Le producteur doit copier la valeur servant au routage dans une propriété d'application, puis un filtre SQL peut la comparer à 0,8.
  options:
    a:
      en: |
        The content type is only a descriptor; it doesn't let a filter parse the JSON body.
      fr: |
        Le type de contenu n'est qu'un descripteur ; il ne permet pas à un filtre d'analyser le corps JSON.
    b:
      en: |
        A correlation filter tests equality only, and the property doesn't exist on the messages.
      fr: |
        Un filtre de corrélation teste uniquement l'égalité, et la propriété n'existe pas sur les messages.
    d:
      en: |
        Rule actions change properties with SQL-like expressions over properties; they can't read the body either.
      fr: |
        Les actions de règle modifient des propriétés avec des expressions de type SQL portant sur des propriétés ; elles ne peuvent pas lire le corps non plus.
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
