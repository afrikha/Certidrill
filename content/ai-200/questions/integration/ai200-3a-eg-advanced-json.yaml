id: ai200-3a-eg-advanced-json
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin publishes "inference completed" events to an Event Grid custom topic in the CloudEvents schema. The data of each event looks like this:

    ```json
    { "model": "delay-predictor", "metrics": { "latencyMs": 2350 }, "isTest": false }
    ```

    An event subscription must deliver to the alerting function only the production events (isTest is false) whose latency is 2,000 milliseconds or more.

    How should you complete the advanced filters? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin publie des événements « inférence terminée » dans une rubrique personnalisée Event Grid au schéma CloudEvents. Les données de chaque événement ressemblent à ceci :

    ```json
    { "model": "delay-predictor", "metrics": { "latencyMs": 2350 }, "isTest": false }
    ```

    Un abonnement aux événements ne doit remettre à la fonction d'alerte que les événements de production (isTest vaut false) dont la latence est d'au moins 2 000 millisecondes.

    Comment devez-vous compléter les filtres avancés ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "advancedFilters": [
      {
        "operatorType": "[[op]]",
        "key": "[[key]]",
        "value": 2000
      },
      {
        "operatorType": "[[boolop]]",
        "key": "data.isTest",
        "value": false
      }
    ]
  slots:
    - id: op
      options:
        - { id: gt, text: NumberGreaterThan }
        - { id: gte, text: NumberGreaterThanOrEquals }
        - { id: inrange, text: NumberInRange }
    - id: key
      options:
        - { id: datapath, text: data.metrics.latencyMs }
        - { id: nodata, text: metrics.latencyMs }
        - { id: leaf, text: data.latencyMs }
    - id: boolop
      options:
        - { id: boolequals, text: BoolEquals }
        - { id: isnull, text: IsNullOrUndefined }
        - { id: strin, text: StringIn }
answer:
  values: { op: gte, key: datapath, boolop: boolequals }
explanation:
  correct:
    en: |
      NumberGreaterThanOrEquals with a single value keeps latencies of 2,000 or more. Keys into the event data start with data. and use dot notation for nested properties, so the latency is data.metrics.latencyMs. BoolEquals compares a Boolean key with true or false, and the two filters are combined with AND.
    fr: |
      NumberGreaterThanOrEquals avec une valeur unique conserve les latences supérieures ou égales à 2 000. Les clés dans les données de l'événement commencent par data. et utilisent la notation pointée pour les propriétés imbriquées : la latence est donc data.metrics.latencyMs. BoolEquals compare une clé booléenne à true ou false, et les deux filtres se combinent par ET.
  options:
    gt:
      en: |
        NumberGreaterThan excludes a latency of exactly 2,000 milliseconds.
      fr: |
        NumberGreaterThan exclut une latence d'exactement 2 000 millisecondes.
    inrange:
      en: |
        NumberInRange takes values that are arrays of ranges, such as `[[2000, 10000]]`, not a single value.
      fr: |
        NumberInRange prend des valeurs qui sont des tableaux de plages, par exemple `[[2000, 10000]]`, pas une valeur unique.
    nodata:
      en: |
        Without the data. prefix, the key doesn't point into the event data.
      fr: |
        Sans le préfixe data., la clé ne pointe pas dans les données de l'événement.
    leaf:
      en: |
        latencyMs is nested under metrics; data.latencyMs doesn't exist, and a missing key doesn't match.
      fr: |
        latencyMs est imbriquée sous metrics ; data.latencyMs n'existe pas, et une clé absente ne correspond pas.
    isnull:
      en: |
        IsNullOrUndefined tests whether the key is missing or null; it takes no value and doesn't compare with false.
      fr: |
        IsNullOrUndefined teste si la clé est absente ou null ; il ne prend pas de valeur et ne compare pas avec false.
    strin:
      en: |
        StringIn compares string values; isTest is a Boolean.
      fr: |
        StringIn compare des valeurs de chaîne ; isTest est un booléen.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
