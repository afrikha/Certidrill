id: ai200-3b-deploy-flex
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has created a Python function app named **func-tail-agent** on the Flex Consumption plan. You need to deploy the project code from a build agent by using the Azure CLI.

    Which deployment method should you use?
  fr: |
    Tailspin Toys a créé une application de fonction Python nommée **func-tail-agent** sur le plan Flex Consumption. Vous devez déployer le code du projet depuis un agent de build à l'aide d'Azure CLI.

    Quelle méthode de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Push the code to the Local Git endpoint of the app.", fr: "Envoyer le code vers le point de terminaison Git local de l'application." } }
    - { id: b, text: { en: "Upload the files to the FTPS endpoint of the app.", fr: "Charger les fichiers sur le point de terminaison FTPS de l'application." } }
    - { id: c, text: { en: "Set WEBSITE_RUN_FROM_PACKAGE to the URL of a zip file in Blob Storage.", fr: "Définir WEBSITE_RUN_FROM_PACKAGE sur l'URL d'un fichier zip dans Stockage Blob." } }
    - { id: d, text: { en: "Run az functionapp deployment source config-zip with --build-remote true.", fr: "Exécuter az functionapp deployment source config-zip avec --build-remote true." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Package deployment is the only code deployment technology supported on Flex Consumption. `az functionapp deployment source config-zip` uploads the package, which the platform stores in the deployment container, and a remote build is required for Python.
    fr: |
      Le déploiement par package est la seule technologie de déploiement de code prise en charge en Flex Consumption. `az functionapp deployment source config-zip` charge le package, que la plateforme stocke dans le conteneur de déploiement, et une build distante est requise pour Python.
  options:
    a: { en: "Local Git isn't supported on Flex Consumption.", fr: "Git local n'est pas pris en charge en Flex Consumption." }
    b: { en: "FTPS isn't supported on Flex Consumption.", fr: "FTPS n'est pas pris en charge en Flex Consumption." }
    c: { en: "WEBSITE_RUN_FROM_PACKAGE isn't used for deployments in Flex Consumption.", fr: "WEBSITE_RUN_FROM_PACKAGE n'est pas utilisé pour les déploiements en Flex Consumption." }
references:
  - title: Deployment technologies in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-technologies
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
