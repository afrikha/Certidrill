id: ai200-3b-order-slot-swap
objective: "3.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys hosts a Python function app named **func-wt-assist** on a Premium plan. New versions must be warmed up and validated before they receive production traffic. The app has no deployment slot yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys héberge une application de fonction Python nommée **func-wt-assist** sur un plan Premium. Les nouvelles versions doivent être préchauffées et validées avant de recevoir le trafic de production. L'application n'a pas encore d'emplacement de déploiement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a deployment slot named staging.", fr: "Créer un emplacement de déploiement nommé staging." } }
    - { id: publish, text: { en: "Run func azure functionapp publish func-wt-assist --slot staging.", fr: "Exécuter func azure functionapp publish func-wt-assist --slot staging." } }
    - { id: swap, text: { en: "Swap the staging slot with the production slot.", fr: "Permuter l'emplacement staging avec l'emplacement de production." } }
    - { id: prod, text: { en: "Run func azure functionapp publish func-wt-assist.", fr: "Exécuter func azure functionapp publish func-wt-assist." } }
    - { id: restart, text: { en: "Restart the production slot.", fr: "Redémarrer l'emplacement de production." } }
    - { id: flex, text: { en: "Move the app to a Flex Consumption plan.", fr: "Déplacer l'application vers un plan Flex Consumption." } }
answer:
  sequence: [ create, publish, swap ]
explanation:
  correct:
    en: |
      Deploying to a staging slot and then swapping it into production after verification is the recommended way to release a function app. Core Tools targets a slot with the --slot option, and the swap waits until the instances of the source slot have restarted and are available before switching routing.
    fr: |
      Déployer dans un emplacement de préproduction puis le permuter avec la production après vérification est la méthode recommandée pour publier une application de fonction. Core Tools cible un emplacement avec l'option --slot, et la permutation attend que les instances de l'emplacement source aient redémarré et soient disponibles avant de basculer le routage.
  options:
    prod: { en: "Publishing without --slot deploys straight to production, without validation.", fr: "Publier sans --slot déploie directement en production, sans validation." }
    restart: { en: "A restart isn't part of a slot release; the swap restarts the source slot instances itself.", fr: "Un redémarrage ne fait pas partie d'une publication par emplacement ; la permutation redémarre elle-même les instances de l'emplacement source." }
    flex: { en: "Flex Consumption doesn't support deployment slots.", fr: "Flex Consumption ne prend pas en charge les emplacements de déploiement." }
references:
  - title: Azure Functions deployment slots
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-slots
  - title: Deployment technologies in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-technologies
