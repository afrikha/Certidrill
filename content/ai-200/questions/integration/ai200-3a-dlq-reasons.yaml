id: ai200-3a-dlq-reasons
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum operates several Service Bus queues and topics for an image-captioning pipeline. A support engineer reviews the dead-letter queues and sees messages with different values of the `dead_letter_reason` property.

    Which reason does Service Bus set in each situation? To answer, drag the appropriate reasons to the correct situations. Each reason may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exploite plusieurs files d'attente et rubriques Service Bus pour un pipeline de légendage d'images. Un ingénieur de support examine les files d'attente de lettres mortes et voit des messages dont la propriété `dead_letter_reason` a différentes valeurs.

    Quelle raison Service Bus définit-il dans chaque situation ? Pour répondre, faites glisser les raisons appropriées vers les situations correspondantes. Chaque raison peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: maxdel, text: MaxDeliveryCountExceeded }
    - { id: ttl, text: TTLExpiredException }
    - { id: nosession, text: Session ID is null }
    - { id: hops, text: MaxTransferHopCountExceeded }
    - { id: header, text: HeaderSizeExceeded }
  targets:
    - id: poison
      text: { en: "A worker abandons the same malformed message each time it receives it.", fr: "Un worker abandonne le même message mal formé chaque fois qu'il le reçoit." }
    - id: expired
      text: { en: "A message expires in a queue that has dead-lettering on message expiration enabled.", fr: "Un message expire dans une file d'attente où les lettres mortes à l'expiration des messages sont activées." }
    - id: forwardsession
      text: { en: "A subscription auto-forwards a message that has no session ID to a session-enabled queue.", fr: "Un abonnement transfère automatiquement un message sans ID de session vers une file d'attente avec sessions activées." }
    - id: chain
      text: { en: "A message is auto-forwarded through a chain of more than four queues and topics.", fr: "Un message est transféré automatiquement à travers une chaîne de plus de quatre files d'attente et rubriques." }
answer:
  mapping: { poison: maxdel, expired: ttl, forwardsession: nosession, chain: hops }
explanation:
  correct:
    en: |
      Each abandon increments the delivery count, and the message is dead-lettered with MaxDeliveryCountExceeded once the count exceeds the maximum (10 by default). Expired messages get TTLExpiredException when dead-lettering on expiration is enabled. Forwarding a message without a session ID into a session-enabled entity dead-letters it on the source with Session ID is null, and a message that passes through more than four chained entities gets MaxTransferHopCountExceeded.
    fr: |
      Chaque abandon incrémente le nombre de remises, et le message est placé en lettres mortes avec MaxDeliveryCountExceeded dès que ce nombre dépasse le maximum (10 par défaut). Les messages expirés reçoivent TTLExpiredException quand les lettres mortes à l'expiration sont activées. Le transfert d'un message sans ID de session vers une entité avec sessions activées le place en lettres mortes sur la source avec Session ID is null, et un message qui traverse plus de quatre entités chaînées reçoit MaxTransferHopCountExceeded.
  options:
    header:
      en: |
        HeaderSizeExceeded means that the size quota of the message stream was exceeded; it matches none of the situations.
      fr: |
        HeaderSizeExceeded signifie que le quota de taille du flux du message a été dépassé ; il ne correspond à aucune des situations.
references:
  - title: Service Bus Dead-Letter Queues
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues
  - title: Autoforwarding Azure Service Bus messaging entities
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-auto-forwarding
