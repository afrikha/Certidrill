id: ai200-3b-http-route-prefix
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys publishes an embedding API from a Python function app named **func-tailspin**. A function is declared with `@app.route(route="v1/embed")`. It is currently reached at `https://func-tailspin.azurewebsites.net/api/v1/embed`.

    The API contract requires the URL `https://func-tailspin.azurewebsites.net/v1/embed`. You must not change the route of the function.

    How should you complete the host.json file? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie une API d'incorporations depuis une application de fonction Python nommée **func-tailspin**. Une fonction est déclarée avec `@app.route(route="v1/embed")`. Elle est actuellement accessible à l'adresse `https://func-tailspin.azurewebsites.net/api/v1/embed`.

    Le contrat d'API exige l'URL `https://func-tailspin.azurewebsites.net/v1/embed`. Vous ne devez pas modifier la route de la fonction.

    Comment devez-vous compléter le fichier host.json ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "version": "2.0",
      "extensions": {
        "[[ext]]": {
          "[[prop]]": [[val]]
        }
      }
    }
  slots:
    - id: ext
      options:
        - { id: http, text: "http" }
        - { id: sb, text: "serviceBus" }
        - { id: queues, text: "queues" }
    - id: prop
      options:
        - { id: prefix, text: "routePrefix" }
        - { id: outstanding, text: "maxOutstandingRequests" }
        - { id: throttle, text: "dynamicThrottlesEnabled" }
    - id: val
      options:
        - { id: empty, text: "\"\"" }
        - { id: api, text: "\"api\"" }
        - { id: slash, text: "\"/v1\"" }
        - { id: nul, text: "null" }
answer:
  values: { ext: http, prop: prefix, val: empty }
explanation:
  correct:
    en: |
      By default, every HTTP route is prefixed with `api`. Setting `extensions.http.routePrefix` to an empty string in host.json removes the prefix, so `v1/embed` is served at the root of the app. When you remove the prefix, avoid routes that start with `admin` or `runtime`, which the host reserves.
    fr: |
      Par défaut, chaque route HTTP est préfixée par `api`. Définir `extensions.http.routePrefix` sur une chaîne vide dans host.json supprime le préfixe : `v1/embed` est alors servie à la racine de l'application. Quand vous supprimez le préfixe, évitez les routes qui commencent par `admin` ou `runtime`, réservées par l'hôte.
  options:
    sb: { en: "The serviceBus section configures the Service Bus extension, not HTTP routes.", fr: "La section serviceBus configure l'extension Service Bus, pas les routes HTTP." }
    queues: { en: "The queues section configures the Queue storage extension.", fr: "La section queues configure l'extension Stockage File d'attente." }
    outstanding: { en: "maxOutstandingRequests limits pending HTTP requests; it does not change URLs.", fr: "maxOutstandingRequests limite les requêtes HTTP en attente ; il ne modifie pas les URL." }
    throttle: { en: "dynamicThrottlesEnabled controls HTTP throttling, not the route prefix.", fr: "dynamicThrottlesEnabled contrôle la limitation HTTP, pas le préfixe de route." }
    api: { en: "\"api\" is the default prefix that the contract must remove.", fr: "\"api\" est le préfixe par défaut que le contrat impose de supprimer." }
    slash: { en: "A /v1 prefix combined with the v1/embed route would produce /v1/v1/embed.", fr: "Un préfixe /v1 combiné à la route v1/embed donnerait /v1/v1/embed." }
references:
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
