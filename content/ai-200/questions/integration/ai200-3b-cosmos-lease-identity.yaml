id: ai200-3b-cosmos-lease-identity
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys deploys a Python function app that uses a Cosmos DB trigger on the **orders** container of an Azure Cosmos DB for NoSQL account. The trigger uses an identity-based connection and is declared with `lease_container_name="leases"` and `create_lease_container_if_not_exists=True`. The leases container doesn't exist yet. The app identity has a data-plane role that allows it to read and write items in the account.

    The function fails to start because the lease container can't be created.

    You need to make the trigger work. The solution must not use account keys.

    What should you do?
  fr: |
    Wingtip Toys déploie une application de fonction Python qui utilise un déclencheur Cosmos DB sur le conteneur **orders** d'un compte Azure Cosmos DB for NoSQL. Le déclencheur utilise une connexion basée sur l'identité et est déclaré avec `lease_container_name="leases"` et `create_lease_container_if_not_exists=True`. Le conteneur leases n'existe pas encore. L'identité de l'application dispose d'un rôle de plan de données qui lui permet de lire et d'écrire des éléments dans le compte.

    La fonction ne démarre pas, car le conteneur de baux ne peut pas être créé.

    Vous devez faire fonctionner le déclencheur. La solution ne doit pas utiliser de clés de compte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the leases container ahead of time with a management tool such as the Azure CLI or Bicep.", fr: "Créer le conteneur leases à l'avance avec un outil de gestion comme Azure CLI ou Bicep." } }
    - { id: b, text: { en: "Assign the app identity a second data-plane role at the scope of the orders container.", fr: "Attribuer à l'identité de l'application un second rôle de plan de données au niveau du conteneur orders." } }
    - { id: c, text: { en: "Replace lease_container_name with a lease container prefix so that the trigger reuses the orders container.", fr: "Remplacer lease_container_name par un préfixe de conteneur de baux pour que le déclencheur réutilise le conteneur orders." } }
    - { id: d, text: { en: "Set the connection to the app setting that contains the account endpoint URI instead of the setting prefix.", fr: "Faire pointer connection vers le paramètre d'application qui contient l'URI du point de terminaison du compte, au lieu du préfixe des paramètres." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the trigger uses Microsoft Entra identities, creating containers isn't allowed even if create_lease_container_if_not_exists is true, because container creation is a management operation. Create the leases container beforehand (portal, Azure CLI, Bicep) and keep the identity-based connection for reading the change feed and writing leases.
    fr: |
      Quand le déclencheur utilise des identités Microsoft Entra, la création de conteneurs n'est pas autorisée, même si create_lease_container_if_not_exists vaut true, car créer un conteneur est une opération de gestion. Créez le conteneur leases au préalable (portail, Azure CLI, Bicep) et conservez la connexion basée sur l'identité pour lire le flux de modification et écrire les baux.
  options:
    b: { en: "Data-plane roles cover items, not container creation; a second data role doesn't let the trigger create the leases container.", fr: "Les rôles de plan de données couvrent les éléments, pas la création de conteneurs ; un second rôle de données ne permet pas au déclencheur de créer le conteneur leases." }
    c: { en: "The trigger always needs a separate lease container; a prefix only distinguishes several functions that share one lease container.", fr: "Le déclencheur a toujours besoin d'un conteneur de baux distinct ; un préfixe ne fait que distinguer plusieurs fonctions qui partagent un même conteneur de baux." }
    d: { en: "For identity-based connections, connection must name the setting prefix; the problem is the missing container, not the connection.", fr: "Pour les connexions basées sur l'identité, connection doit désigner le préfixe des paramètres ; le problème est le conteneur manquant, pas la connexion." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
