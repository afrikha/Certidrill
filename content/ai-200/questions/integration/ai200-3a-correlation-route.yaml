id: ai200-3a-correlation-route
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Trey Research publishes model inference results to a Service Bus topic named **inferences** in a Standard namespace. The producer sets an application property named `modelFamily` to `vision`, `speech` or `text` on each message.

    A subscription named **vision-review** must receive only the messages whose `modelFamily` is `vision`. The topic handles thousands of messages per second, and the filter must have the least possible impact on throughput.

    Which rule should you add to vision-review?
  fr: |
    Trey Research publie des résultats d'inférence de modèles dans une rubrique Service Bus nommée **inferences** d'un espace de noms Standard. Le producteur définit sur chaque message une propriété d'application nommée `modelFamily` à `vision`, `speech` ou `text`.

    Un abonnement nommé **vision-review** ne doit recevoir que les messages dont `modelFamily` vaut `vision`. La rubrique traite des milliers de messages par seconde, et le filtre doit avoir le moins d'impact possible sur le débit.

    Quelle règle devez-vous ajouter à vision-review ?
body:
  options:
    - { id: a, text: { en: "A SQL filter with the expression modelFamily LIKE 'vision%'", fr: "Un filtre SQL avec l'expression modelFamily LIKE 'vision%'" } }
    - { id: b, text: { en: "A correlation filter that matches the application property modelFamily = vision", fr: "Un filtre de corrélation sur la propriété d'application modelFamily = vision" } }
    - { id: c, text: { en: "A SQL filter with the expression modelFamily = 'vision' and the action SET reviewed = 'no'", fr: "Un filtre SQL avec l'expression modelFamily = 'vision' et l'action SET reviewed = 'no'" } }
    - { id: d, text: { en: "A TrueFilter rule, with receiver code that dead-letters the messages of other families", fr: "Une règle TrueFilter, avec un code récepteur qui place en lettres mortes les messages des autres familles" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A correlation filter tests equality on system properties or application properties, which is all this requirement needs. Correlation filters are much more efficient than SQL filters, which lower throughput at the subscription, topic and namespace levels.
    fr: |
      Un filtre de corrélation teste l'égalité sur des propriétés système ou des propriétés d'application, ce qui suffit à cette exigence. Les filtres de corrélation sont bien plus efficaces que les filtres SQL, qui réduisent le débit au niveau de l'abonnement, de la rubrique et de l'espace de noms.
  options:
    a:
      en: |
        The SQL filter would select the right messages, but SQL filters cost more processing than correlation filters.
      fr: |
        Le filtre SQL sélectionnerait les bons messages, mais les filtres SQL coûtent plus de traitement que les filtres de corrélation.
    c:
      en: |
        An action adds even more processing to a SQL filter, and nothing in the requirement needs a modified property.
      fr: |
        Une action ajoute encore du traitement à un filtre SQL, et rien dans l'exigence ne demande de modifier une propriété.
    d:
      en: |
        TrueFilter copies every message to the subscription, so the receiver would pay for all of them and fill the dead-letter queue.
      fr: |
        TrueFilter copie chaque message dans l'abonnement : le récepteur les paierait tous et remplirait la file d'attente de lettres mortes.
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
