id: ai200-3b-sampling
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys monitors a busy Python function app with Application Insights. Some executions of the **answer** function don't appear in the Application Insights monitor views, which makes request counts unreliable. Dependency and trace telemetry must keep being sampled to control cost.

    What should you configure in host.json?
  fr: |
    Tailspin Toys surveille une application de fonction Python très sollicitée avec Application Insights. Certaines exécutions de la fonction **answer** n'apparaissent pas dans les vues de surveillance d'Application Insights, ce qui rend le nombre de requêtes peu fiable. La télémétrie des dépendances et des traces doit continuer d'être échantillonnée pour maîtriser les coûts.

    Que devez-vous configurer dans host.json ?
body:
  options:
    - { id: a, text: { en: "Set logging.applicationInsights.samplingSettings.isEnabled to false.", fr: "Définir logging.applicationInsights.samplingSettings.isEnabled sur false." } }
    - { id: b, text: { en: "Set logging.applicationInsights.samplingSettings.excludedTypes to Request.", fr: "Définir logging.applicationInsights.samplingSettings.excludedTypes sur Request." } }
    - { id: c, text: { en: "Set logging.applicationInsights.samplingSettings.maxTelemetryItemsPerSecond to 1.", fr: "Définir logging.applicationInsights.samplingSettings.maxTelemetryItemsPerSecond sur 1." } }
    - { id: d, text: { en: "Set logging.logLevel.default to Trace.", fr: "Définir logging.logLevel.default sur Trace." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sampling is enabled by default and can hide some executions from the monitor views. excludedTypes lists telemetry types that are never sampled, so setting it to Request keeps every request while dependencies and traces are still sampled.
    fr: |
      L'échantillonnage est activé par défaut et peut masquer certaines exécutions dans les vues de surveillance. excludedTypes liste les types de télémétrie jamais échantillonnés : le définir sur Request conserve chaque requête tout en continuant d'échantillonner les dépendances et les traces.
  options:
    a: { en: "Disabling sampling keeps all telemetry types, which doesn't meet the cost requirement.", fr: "Désactiver l'échantillonnage conserve tous les types de télémétrie, ce qui ne respecte pas l'exigence de coût." }
    c: { en: "Lowering the target rate (20 items per second by default) samples more aggressively and hides more requests.", fr: "Abaisser le débit cible (20 éléments par seconde par défaut) échantillonne plus fortement et masque davantage de requêtes." }
    d: { en: "The log level filters log categories; it doesn't stop requests from being sampled.", fr: "Le niveau de journalisation filtre des catégories de journaux ; il n'empêche pas l'échantillonnage des requêtes." }
references:
  - title: host.json reference for Azure Functions 2.x
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-host-json
