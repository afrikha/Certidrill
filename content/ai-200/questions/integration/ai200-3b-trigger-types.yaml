id: ai200-3b-trigger-types
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is reviewing the type annotations of a Python function app (v2 programming model) before enabling strict type checking.

    Which type should annotate the trigger parameter of each function? To answer, drag the appropriate types to the correct decorators. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam revoit les annotations de type d'une application de fonction Python (modèle de programmation v2) avant d'activer une vérification de type stricte.

    Quel type doit annoter le paramètre de déclencheur de chaque fonction ? Pour répondre, faites glisser les types appropriés vers les décorateurs correspondants. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: http, text: "func.HttpRequest" }
    - { id: eg, text: "func.EventGridEvent" }
    - { id: docs, text: "func.DocumentList" }
    - { id: timer, text: "func.TimerRequest" }
    - { id: sb, text: "func.ServiceBusMessage" }
    - { id: stream, text: "func.InputStream" }
  targets:
    - { id: route, text: "@app.route(route=\"ask\")" }
    - { id: grid, text: "@app.event_grid_trigger(arg_name=\"event\")" }
    - { id: cosmos, text: "@app.cosmos_db_trigger(arg_name=\"docs\", ...)" }
    - { id: sched, text: "@app.timer_trigger(schedule=\"0 0 1 * * *\", arg_name=\"timer\")" }
answer:
  mapping: { route: http, grid: eg, cosmos: docs, sched: timer }
explanation:
  correct:
    en: |
      An HTTP trigger passes a func.HttpRequest, an Event Grid trigger a func.EventGridEvent, a Cosmos DB trigger a func.DocumentList of changed items, and a timer trigger a func.TimerRequest, which exposes past_due. func.ServiceBusMessage and func.InputStream belong to Service Bus and blob triggers.
    fr: |
      Un déclencheur HTTP transmet un func.HttpRequest, un déclencheur Event Grid un func.EventGridEvent, un déclencheur Cosmos DB un func.DocumentList des éléments modifiés, et un déclencheur de minuteur un func.TimerRequest, qui expose past_due. func.ServiceBusMessage et func.InputStream appartiennent aux déclencheurs Service Bus et blob.
references:
  - title: Timer trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-timer
  - title: Azure Event Grid trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-event-grid-trigger
