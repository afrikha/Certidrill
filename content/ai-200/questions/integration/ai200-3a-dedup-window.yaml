id: ai200-3a-dedup-window
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Service Bus queue named **invoices** that was created with duplicate detection enabled and all other settings left at their defaults. An ERP connector sets the message ID of each invoice message to the invoice number. After a failure, the connector can resend an invoice up to 30 minutes after the first send.

    Some resent invoices are still processed twice. What should you change?
  fr: |
    Contoso dispose d'une file d'attente Service Bus nommée **invoices**, créée avec la détection des doublons activée et tous les autres paramètres par défaut. Un connecteur ERP définit l'ID de message de chaque facture sur le numéro de facture. Après une défaillance, le connecteur peut renvoyer une facture jusqu'à 30 minutes après le premier envoi.

    Certaines factures renvoyées sont encore traitées deux fois. Que devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "Set the lock duration of invoices to 30 minutes.", fr: "Définir la durée de verrouillage d'invoices sur 30 minutes." } }
    - { id: b, text: { en: "Set the default message time to live of invoices to 30 minutes.", fr: "Définir la durée de vie par défaut des messages d'invoices sur 30 minutes." } }
    - { id: c, text: { en: "Set the maximum delivery count of invoices to 30.", fr: "Définir le nombre maximal de remises d'invoices sur 30." } }
    - { id: d, text: { en: "Set the duplicate detection history time window of invoices to 45 minutes.", fr: "Définir la fenêtre d'historique de détection des doublons d'invoices sur 45 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Duplicate detection only remembers the message IDs sent during its history time window, 10 minutes by default (from 20 seconds to 7 days). A resend after 30 minutes falls outside the default window, so the window must be longer than the resend delay.
    fr: |
      La détection des doublons ne mémorise que les ID de message envoyés pendant sa fenêtre d'historique, 10 minutes par défaut (de 20 secondes à 7 jours). Un renvoi au bout de 30 minutes tombe hors de la fenêtre par défaut : la fenêtre doit donc dépasser le délai de renvoi.
  options:
    a:
      en: |
        The lock duration is 5 minutes at most and only controls how long a receiver holds a message; it has no effect on duplicate sends.
      fr: |
        La durée de verrouillage est de 5 minutes au plus et ne contrôle que la durée pendant laquelle un récepteur détient un message ; elle n'a aucun effet sur les envois en double.
    b:
      en: |
        The time to live controls when unprocessed messages expire; it does not compare message IDs.
      fr: |
        La durée de vie détermine quand les messages non traités expirent ; elle ne compare pas les ID de message.
    c:
      en: |
        The maximum delivery count limits redeliveries of one message before dead-lettering; it does not detect two sends of the same invoice.
      fr: |
        Le nombre maximal de remises limite les nouvelles remises d'un message avant son placement en lettres mortes ; il ne détecte pas deux envois de la même facture.
references:
  - title: Azure Service Bus duplicate message detection
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
  - title: az servicebus queue
    url: https://learn.microsoft.com/en-us/cli/azure/servicebus/queue
