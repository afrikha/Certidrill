id: ai200-3a-settlement-choice
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip runs a Python worker that captions product images. The worker receives messages from a Service Bus queue in peek-lock mode by using a ServiceBusReceiver.

    Which method should the worker call in each situation? To answer, drag the appropriate methods to the correct situations. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip exécute un worker Python qui rédige des légendes d'images de produits. Le worker reçoit les messages d'une file d'attente Service Bus en mode peek-lock à l'aide d'un ServiceBusReceiver.

    Quelle méthode le worker doit-il appeler dans chaque situation ? Pour répondre, faites glisser les méthodes appropriées vers les situations correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: complete, text: complete_message }
    - { id: abandon, text: abandon_message }
    - { id: deadletter, text: dead_letter_message }
    - { id: defer, text: defer_message }
    - { id: renew, text: renew_message_lock }
  targets:
    - id: done
      text: { en: "The caption was generated and saved.", fr: "La légende a été générée et enregistrée." }
    - id: invalid
      text: { en: "The payload isn't valid JSON and can never be processed.", fr: "La charge utile n'est pas un JSON valide et ne pourra jamais être traitée." }
    - id: transient
      text: { en: "The model endpoint returned a transient HTTP 503 error; the message must be retried right away.", fr: "Le point de terminaison du modèle a renvoyé une erreur HTTP 503 transitoire ; le message doit être retenté immédiatement." }
    - id: later
      text: { en: "The image belongs to a product whose catalog entry hasn't arrived yet; the worker will fetch this message later by its sequence number.", fr: "L'image appartient à un produit dont la fiche catalogue n'est pas encore arrivée ; le worker récupérera ce message plus tard par son numéro de séquence." }
answer:
  mapping: { done: complete, invalid: deadletter, transient: abandon, later: defer }
explanation:
  correct:
    en: |
      complete_message removes a processed message. dead_letter_message moves a message that can never succeed to the dead-letter queue, with a reason. abandon_message releases the lock so the message is redelivered at once, with its delivery count increased. defer_message sets the message aside in the queue; only a receive by sequence number returns it.
    fr: |
      complete_message supprime un message traité. dead_letter_message déplace vers la file d'attente de lettres mortes, avec une raison, un message qui ne peut jamais réussir. abandon_message libère le verrou pour que le message soit remis aussitôt, avec un nombre de remises augmenté. defer_message met le message de côté dans la file d'attente ; seule une réception par numéro de séquence le renvoie.
  options:
    renew:
      en: |
        renew_message_lock only extends the lock of a message that is still being processed; it settles nothing.
      fr: |
        renew_message_lock prolonge seulement le verrou d'un message encore en cours de traitement ; il ne règle rien.
references:
  - title: azure.servicebus.ServiceBusReceiver class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.servicebusreceiver
  - title: Message Deferral Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-deferral
