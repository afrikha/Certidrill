id: ai200-3b-retry-support
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is standardizing error handling in its Python function apps. The team plans to add `@app.retry(strategy="fixed_delay", max_retry_count="3", delay_interval="00:00:10")` to functions so that the Functions runtime retries a failed execution.

    For which two triggers does the runtime apply this retry policy?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation standardise la gestion des erreurs de ses applications de fonction Python. L'équipe prévoit d'ajouter `@app.retry(strategy="fixed_delay", max_retry_count="3", delay_interval="00:00:10")` aux fonctions pour que le runtime Functions retente une exécution en échec.

    Pour quels deux déclencheurs le runtime applique-t-il cette stratégie de nouvelle tentative ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Service Bus queue trigger", fr: "Déclencheur de file d'attente Service Bus" } }
    - { id: b, text: { en: "Azure Cosmos DB trigger", fr: "Déclencheur Azure Cosmos DB" } }
    - { id: c, text: { en: "Queue storage trigger", fr: "Déclencheur Stockage File d'attente" } }
    - { id: d, text: { en: "Event Grid trigger", fr: "Déclencheur Event Grid" } }
    - { id: e, text: { en: "Event Hubs trigger", fr: "Déclencheur Event Hubs" } }
    - { id: f, text: { en: "Blob storage trigger", fr: "Déclencheur Stockage Blob" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Runtime retry policies are supported for the Azure Cosmos DB, Event Hubs, Kafka and Timer triggers. With Event Hubs, the checkpoint isn't written until the retry policy finishes, so progress on the partition pauses during retries.
    fr: |
      Les stratégies de nouvelle tentative du runtime sont prises en charge pour les déclencheurs Azure Cosmos DB, Event Hubs, Kafka et Timer. Avec Event Hubs, le point de contrôle n'est écrit qu'à la fin de la stratégie de nouvelle tentative : la progression sur la partition est suspendue pendant les nouvelles tentatives.
  options:
    a: { en: "Service Bus retries through its binding extension and message redelivery, configured in host.json and on the entity.", fr: "Service Bus réessaie via son extension de liaison et la nouvelle remise des messages, configurées dans host.json et sur l'entité." }
    c: { en: "Queue storage retries through the binding extension, with poison messages configured in host.json.", fr: "Stockage File d'attente réessaie via l'extension de liaison, avec des messages incohérents configurés dans host.json." }
    d: { en: "Event Grid retries according to the retry policy of the event subscription.", fr: "Event Grid réessaie selon la stratégie de nouvelle tentative de l'abonnement aux événements." }
    f: { en: "Blob storage retries through the binding extension, with poison blobs configured in host.json.", fr: "Stockage Blob réessaie via l'extension de liaison, avec des objets blob incohérents configurés dans host.json." }
references:
  - title: Azure Functions Error Handling and Retry Guidance
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-error-pages
