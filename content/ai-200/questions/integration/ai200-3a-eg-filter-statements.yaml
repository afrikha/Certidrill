id: ai200-3a-eg-filter-statements
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wide World Importers routes "shipment risk scored" events from an Event Grid custom topic to several Azure functions. You are designing the advanced filters of the event subscriptions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers achemine des événements « risque d'expédition noté » d'une rubrique personnalisée Event Grid vers plusieurs fonctions Azure. Vous concevez les filtres avancés des abonnements aux événements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A StringIn filter on data.carrier with the values Contoso and Fabrikam matches an event whose data.carrier is fabrikam.
        fr: |
          Un filtre StringIn sur data.carrier avec les valeurs Contoso et Fabrikam correspond à un événement dont data.carrier vaut fabrikam.
    - id: s2
      text:
        en: |
          One event subscription can have 30 advanced filters if each filter has a single value.
        fr: |
          Un abonnement aux événements peut avoir 30 filtres avancés si chaque filtre n'a qu'une seule valeur.
    - id: s3
      text:
        en: |
          An advanced filter can use the key data.customer.email to filter on a nested property of the data.
        fr: |
          Un filtre avancé peut utiliser la clé data.customer.email pour filtrer sur une propriété imbriquée des données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      String comparisons in advanced filters aren't case-sensitive, and several values in one filter are combined with OR, so fabrikam matches. A subscription is limited to 25 advanced filters and 25 filter values in total. Nested properties are reached with dot notation, such as data.customer.email; only keys whose own name contains a dot aren't supported.
    fr: |
      Les comparaisons de chaînes des filtres avancés ne respectent pas la casse, et plusieurs valeurs d'un même filtre se combinent par OU : fabrikam correspond donc. Un abonnement est limité à 25 filtres avancés et 25 valeurs de filtre au total. Les propriétés imbriquées s'atteignent avec la notation pointée, comme data.customer.email ; seules les clés dont le nom lui-même contient un point ne sont pas prises en charge.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
