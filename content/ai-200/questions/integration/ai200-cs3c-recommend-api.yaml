id: ai200-cs3c-recommend-api
objective: "3.2.1"
type: dropdown
caseStudy: ai200-cs3c-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You are writing the recommend function of func-vanarsdel. The function must meet the recommendation API requirement.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la fonction recommend de func-vanarsdel. La fonction doit respecter l'exigence relative à l'API de recommandation.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import azure.functions as func

    app = func.FunctionApp()

    @app.[[trigger]](route="recommend", methods=["POST"], auth_level=func.AuthLevel.[[auth]])
    @app.[[output]](arg_name="msg", queue_name="recommendation-requests", connection="[[conn]]")
    def recommend(req: func.HttpRequest, msg: func.Out[str]) -> func.HttpResponse:
        msg.set(req.get_body().decode("utf-8"))
        return func.HttpResponse(status_code=202)
  slots:
    - id: trigger
      options:
        - { id: route, text: "route" }
        - { id: queuetrigger, text: "queue_trigger" }
        - { id: schedule, text: "schedule" }
    - id: auth
      options:
        - { id: function, text: "FUNCTION" }
        - { id: anonymous, text: "ANONYMOUS" }
        - { id: admin, text: "ADMIN" }
    - id: output
      options:
        - { id: queueoutput, text: "queue_output" }
        - { id: queuetrig2, text: "queue_trigger" }
        - { id: bloboutput, text: "blob_output" }
    - id: conn
      options:
        - { id: prefix, text: "RecoQueue" }
        - { id: fullsetting, text: "RecoQueue__queueServiceUri" }
        - { id: uri, text: "https://stvanarsdel.queue.core.windows.net" }
answer:
  values: { trigger: route, auth: function, output: queueoutput, conn: prefix }
explanation:
  correct:
    en: "In the Python v2 programming model, `@app.route` defines an HTTP trigger, and `AuthLevel.FUNCTION` requires a function key. `@app.queue_output` adds a Queue storage output binding whose value is set with `msg.set()`. For an identity-based connection, `connection` names the prefix of the settings, and the runtime reads `RecoQueue__queueServiceUri` and authenticates with the managed identity."
    fr: "Dans le modèle de programmation Python v2, `@app.route` définit un déclencheur HTTP, et `AuthLevel.FUNCTION` exige une clé de fonction. `@app.queue_output` ajoute une liaison de sortie Stockage File d'attente dont la valeur est définie avec `msg.set()`. Pour une connexion basée sur l'identité, `connection` désigne le préfixe des paramètres : le runtime lit `RecoQueue__queueServiceUri` et s'authentifie avec l'identité managée."
  options:
    queuetrigger: { en: "A queue trigger runs the function when a message arrives; it does not expose an HTTP endpoint.", fr: "Un déclencheur de file d'attente exécute la fonction à l'arrivée d'un message ; il n'expose pas de point de terminaison HTTP." }
    schedule: { en: "`schedule` defines a timer trigger.", fr: "`schedule` définit un déclencheur de minuteur." }
    anonymous: { en: "ANONYMOUS accepts calls without any key.", fr: "ANONYMOUS accepte les appels sans aucune clé." }
    admin: { en: "ADMIN requires the master key, not a function key.", fr: "ADMIN exige la clé principale, pas une clé de fonction." }
    queuetrig2: { en: "A function has one trigger; writing a message needs an output binding.", fr: "Une fonction a un seul déclencheur ; écrire un message exige une liaison de sortie." }
    bloboutput: { en: "A blob output binding writes a blob, not a queue message.", fr: "Une liaison de sortie d'objet blob écrit un objet blob, pas un message de file d'attente." }
    fullsetting: { en: "`connection` takes the common prefix; the runtime adds the `__queueServiceUri` suffix itself.", fr: "`connection` prend le préfixe commun ; le runtime ajoute lui-même le suffixe `__queueServiceUri`." }
    uri: { en: "`connection` is the name of an app setting or setting prefix, not a URI.", fr: "`connection` est le nom d'un paramètre d'application ou d'un préfixe de paramètres, pas un URI." }
references:
  - title: Azure Queue storage output binding for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-queue-output
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
