id: ai200-3b-cosmos-trigger
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores its product catalog in the **products** container of an Azure Cosmos DB for NoSQL database named **catalog**. A Python function (v2 programming model) must generate an embedding each time a product is created or updated.

    The function app uses its system-assigned managed identity. The app setting `CosmosCatalog__accountEndpoint` contains the account endpoint. A container named **leases** already exists in the catalog database.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke son catalogue de produits dans le conteneur **products** d'une base de données Azure Cosmos DB for NoSQL nommée **catalog**. Une fonction Python (modèle de programmation v2) doit générer une incorporation chaque fois qu'un produit est créé ou modifié.

    L'application de fonction utilise son identité managée affectée par le système. Le paramètre d'application `CosmosCatalog__accountEndpoint` contient le point de terminaison du compte. Un conteneur nommé **leases** existe déjà dans la base de données catalog.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.cosmos_db_trigger(arg_name="docs", database_name="catalog",
                           container_name="products",
                           connection="[[conn]]",
                           [[lease]]="leases")
    def embed_products(docs: [[dtype]]) -> None:
        for doc in docs:
            save_embedding(doc["id"], embed(doc["description"]))
  slots:
    - id: conn
      options:
        - { id: prefix, text: "CosmosCatalog" }
        - { id: full, text: "CosmosCatalog__accountEndpoint" }
        - { id: endpoint, text: "https://cosmos-contoso.documents.azure.com:443/" }
    - id: lease
      options:
        - { id: container, text: "lease_container_name" }
        - { id: collection, text: "lease_collection_name" }
        - { id: database, text: "lease_database_name" }
    - id: dtype
      options:
        - { id: doclist, text: "func.DocumentList" }
        - { id: doc, text: "func.Document" }
        - { id: str, text: "str" }
answer:
  values: { conn: prefix, lease: container, dtype: doclist }
explanation:
  correct:
    en: "For an identity-based connection, `connection` names the prefix of the settings: `CosmosCatalog` resolves to `CosmosCatalog__accountEndpoint` and the managed identity is used. With extension 4.x, the lease container is set by `lease_container_name`, and the function receives the changed items as a `func.DocumentList`."
    fr: "Pour une connexion basée sur l'identité, `connection` désigne le préfixe des paramètres : `CosmosCatalog` se résout en `CosmosCatalog__accountEndpoint` et l'identité managée est utilisée. Avec l'extension 4.x, le conteneur de baux se définit avec `lease_container_name`, et la fonction reçoit les éléments modifiés sous forme de `func.DocumentList`."
  options:
    full: { en: "connection takes the common prefix; the runtime appends __accountEndpoint itself.", fr: "connection prend le préfixe commun ; le runtime ajoute lui-même __accountEndpoint." }
    endpoint: { en: "connection is the name of an app setting or setting prefix, never an endpoint value.", fr: "connection est le nom d'un paramètre d'application ou d'un préfixe de paramètres, jamais une valeur de point de terminaison." }
    collection: { en: "Collection-based names belong to the older 3.x extension; extension 4.x uses container names.", fr: "Les noms fondés sur les collections appartiennent à l'ancienne extension 3.x ; l'extension 4.x utilise des noms de conteneurs." }
    database: { en: "The lease container is in the monitored database here; the missing parameter is the lease container name.", fr: "Le conteneur de baux est ici dans la base surveillée ; le paramètre manquant est le nom du conteneur de baux." }
    doc: { en: "The trigger passes a list of changed documents, not a single document.", fr: "Le déclencheur transmet une liste de documents modifiés, pas un seul document." }
    str: { en: "The documents are passed as a DocumentList, which the loop iterates.", fr: "Les documents sont transmis sous forme de DocumentList, que la boucle parcourt." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
