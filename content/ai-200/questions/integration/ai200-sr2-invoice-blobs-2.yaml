id: ai200-sr2-invoice-blobs-2
objective: "3.2.1"
type: series_yesno
series: ai200-sr2-invoice-blobs
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You use an Event Grid source and rely on the deployment to create the subscription.
  fr: Vous utilisez une source Event Grid et comptez sur le déploiement pour créer l'abonnement.
body:
  solution:
    en: |
      You define the function as follows and deploy the app. You don't create any event subscription, because you expect the Storage extension to create it at startup.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices", source="EventGrid",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```
    fr: |
      Vous définissez la fonction comme suit et déployez l'application. Vous ne créez aucun abonnement aux événements, car vous vous attendez à ce que l'extension Storage le crée au démarrage.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices", source="EventGrid",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```
answer: { value: false }
explanation:
  correct:
    en: The trigger definition is correct for a Flex Consumption plan, but an event-based blob trigger runs only when Event Grid delivers events to it. You must create an event subscription on stadatuminv whose web hook endpoint is the blobs extension endpoint of the function; deploying the function does not create it.
    fr: "La définition du déclencheur est correcte pour un plan Flex Consumption, mais un déclencheur d'objet blob basé sur les événements ne s'exécute que lorsqu'Event Grid lui remet des événements. Vous devez créer sur stadatuminv un abonnement aux événements dont le point de terminaison webhook est le point de terminaison de l'extension blobs de la fonction ; le déploiement de la fonction ne le crée pas."
references:
  - title: "Tutorial: Trigger Azure Functions on blob containers by using an event subscription"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-event-grid-blob-trigger
