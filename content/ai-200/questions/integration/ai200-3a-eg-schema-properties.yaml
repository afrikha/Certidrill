id: ai200-3a-eg-schema-properties
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware is migrating the publishers of its AI document pipeline from an Event Grid custom topic that uses the Event Grid schema to a new topic that uses the CloudEvents 1.0 schema. A developer maps the properties of the existing events to the new format.

    How should you complete the mapping? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware migre les éditeurs de son pipeline documentaire d'IA d'une rubrique personnalisée Event Grid au schéma Event Grid vers une nouvelle rubrique au schéma CloudEvents 1.0. Un développeur fait correspondre les propriétés des événements existants au nouveau format.

    Comment devez-vous compléter la correspondance ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The `eventType` property of the Event Grid schema corresponds to the CloudEvents attribute [[kind]].

      The `eventTime` property of the Event Grid schema corresponds to the CloudEvents attribute [[when]].

      The CloudEvents attribute that identifies the context in which the event happened, set by the publisher, is [[origin]].
    fr: |
      La propriété `eventType` du schéma Event Grid correspond à l'attribut CloudEvents [[kind]].

      La propriété `eventTime` du schéma Event Grid correspond à l'attribut CloudEvents [[when]].

      L'attribut CloudEvents qui identifie le contexte dans lequel l'événement s'est produit, défini par l'éditeur, est [[origin]].
  slots:
    - id: kind
      options:
        - { id: type, text: type }
        - { id: subject, text: subject }
        - { id: dataschema, text: dataschema }
    - id: when
      options:
        - { id: time, text: time }
        - { id: specversion, text: specversion }
        - { id: id, text: id }
    - id: origin
      options:
        - { id: source, text: source }
        - { id: topic, text: topic }
        - { id: subject2, text: subject }
answer:
  values: { kind: type, when: time, origin: source }
explanation:
  correct:
    en: |
      A CloudEvents 1.0 event carries id, source, type, specversion, time, subject and data. type plays the role of eventType and time the role of eventTime. source identifies the context that produced the event and is set by the publisher, whereas the topic property of the Event Grid schema is filled in by Event Grid.
    fr: |
      Un événement CloudEvents 1.0 porte id, source, type, specversion, time, subject et data. type joue le rôle d'eventType et time celui d'eventTime. source identifie le contexte qui a produit l'événement et est défini par l'éditeur, alors que la propriété topic du schéma Event Grid est renseignée par Event Grid.
  options:
    subject:
      en: |
        subject exists in both schemas with the same meaning, the resource the event is about.
      fr: |
        subject existe dans les deux schémas avec le même sens, la ressource concernée par l'événement.
    dataschema:
      en: |
        dataschema identifies the schema of the data, not the kind of event.
      fr: |
        dataschema identifie le schéma des données, pas le type d'événement.
    specversion:
      en: |
        specversion is the version of the CloudEvents specification, 1.0.
      fr: |
        specversion est la version de la spécification CloudEvents, 1.0.
    id:
      en: |
        id identifies the event in both schemas.
      fr: |
        id identifie l'événement dans les deux schémas.
    topic:
      en: |
        topic is a property of the Event Grid schema, not a CloudEvents attribute.
      fr: |
        topic est une propriété du schéma Event Grid, pas un attribut CloudEvents.
    subject2:
      en: |
        subject describes the resource the event is about, within the context given by source.
      fr: |
        subject décrit la ressource concernée par l'événement, dans le contexte donné par source.
references:
  - title: Validate Webhook Endpoints with Event Grid Schema
    url: https://learn.microsoft.com/en-us/azure/event-grid/end-point-validation-event-grid-events-schema
  - title: Azure Event Grid Pull Delivery Overview
    url: https://learn.microsoft.com/en-us/azure/event-grid/pull-delivery-overview
