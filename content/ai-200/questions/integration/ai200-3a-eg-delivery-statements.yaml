id: ai200-3a-eg-delivery-statements
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Coho Winery publishes "fermentation anomaly detected" events to an Event Grid custom topic. An event subscription delivers them to a webhook hosted on Azure Container Apps.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Coho Winery publie des événements « anomalie de fermentation détectée » dans une rubrique personnalisée Event Grid. Un abonnement aux événements les remet à un webhook hébergé sur Azure Container Apps.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If the webhook doesn't respond within 30 seconds, Event Grid queues the event for a retry.
        fr: |
          Si le webhook ne répond pas dans les 30 secondes, Event Grid place l'événement en attente d'une nouvelle tentative.
    - id: s2
      text:
        en: |
          If the webhook answers an event with HTTP 202 Accepted, Event Grid considers the event delivered.
        fr: |
          Si le webhook répond à un événement par HTTP 202 Accepted, Event Grid considère l'événement comme remis.
    - id: s3
      text:
        en: |
          If the webhook answers an event with HTTP 403 Forbidden, Event Grid retries the event with exponential backoff.
        fr: |
          Si le webhook répond à un événement par HTTP 403 Forbidden, Event Grid retente l'événement avec un backoff exponentiel.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Event Grid waits 30 seconds for a response before it queues the event for retry. Status codes 200 to 204, including 202, mean success. 400, 401, 403 and 413 aren't retried for webhooks, because retrying can't fix them.
    fr: |
      Event Grid attend une réponse pendant 30 secondes avant de placer l'événement en attente d'une nouvelle tentative. Les codes d'état 200 à 204, y compris 202, signifient la réussite. Les codes 400, 401, 403 et 413 ne sont pas retentés pour les webhooks, car une nouvelle tentative ne peut pas les corriger.
references:
  - title: Azure Event Grid Delivery and Retry Explained
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
