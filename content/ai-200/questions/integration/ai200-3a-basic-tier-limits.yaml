id: ai200-3a-basic-tier-limits
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    VanArsdel plans an AI order-processing back end on an existing Service Bus namespace in the Basic tier. The design team lists the Service Bus features that the back end will use.

    Which three features require a namespace in the Standard or Premium tier?

    NOTE: Each correct selection is worth one point.
  fr: |
    VanArsdel prévoit un back-end de traitement des commandes par IA sur un espace de noms Service Bus existant au niveau Basic. L'équipe de conception dresse la liste des fonctionnalités Service Bus que le back-end utilisera.

    Quelles sont les trois fonctionnalités qui exigent un espace de noms au niveau Standard ou Premium ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Topics and subscriptions", fr: "Rubriques et abonnements" } }
    - { id: b, text: { en: "Peek-lock receive mode", fr: "Mode de réception peek-lock" } }
    - { id: c, text: { en: "Message sessions", fr: "Sessions de messages" } }
    - { id: d, text: { en: "A time to live on each message", fr: "Une durée de vie sur chaque message" } }
    - { id: e, text: { en: "Auto-forwarding", fr: "Transfert automatique" } }
    - { id: f, text: { en: "Receive-and-delete receive mode", fr: "Mode de réception receive-and-delete" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      The Basic tier supports queues only. Topics and subscriptions, message sessions and auto-forwarding are not supported in Basic and need Standard or Premium.
    fr: |
      Le niveau Basic ne prend en charge que les files d'attente. Les rubriques et abonnements, les sessions de messages et le transfert automatique ne sont pas pris en charge au niveau Basic et exigent Standard ou Premium.
  options:
    b:
      en: |
        Peek-lock is the default receive mode of every queue, including in Basic.
      fr: |
        Peek-lock est le mode de réception par défaut de toute file d'attente, y compris au niveau Basic.
    d:
      en: |
        Message expiration is a basic queue feature; every message has a time to live.
      fr: |
        L'expiration des messages est une fonctionnalité de base des files d'attente ; chaque message a une durée de vie.
    f:
      en: |
        Receive-and-delete is a receive mode of the client and works on any queue.
      fr: |
        Receive-and-delete est un mode de réception du client et fonctionne sur toute file d'attente.
references:
  - title: Azure Service Bus Premium Messaging Features
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-premium-messaging
  - title: Azure Service Bus Enable FIFO with Sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
