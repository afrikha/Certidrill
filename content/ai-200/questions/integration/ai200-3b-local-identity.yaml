id: ai200-3b-local-identity
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation's Python function app uses identity-based connections for its bindings. In Azure, the app uses a user-assigned managed identity, selected with `__credential` and `__clientId` settings. Developers run the app locally with Core Tools after signing in with the Azure CLI.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application de fonction Python d'Adatum Corporation utilise des connexions basées sur l'identité pour ses liaisons. Dans Azure, l'application utilise une identité managée affectée par l'utilisateur, sélectionnée avec les paramètres `__credential` et `__clientId`. Les développeurs exécutent l'application en local avec Core Tools après s'être connectés avec Azure CLI.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the app runs locally, the identity-based connections authenticate with the developer's own identity.
        fr: |
          Quand l'application s'exécute en local, les connexions basées sur l'identité s'authentifient avec l'identité du développeur.
    - id: s2
      text:
        en: |
          The developers must copy the __credential and __clientId settings to local.settings.json for local runs to succeed.
        fr: |
          Les développeurs doivent copier les paramètres __credential et __clientId dans local.settings.json pour que les exécutions locales réussissent.
    - id: s3
      text:
        en: |
          An HTTP function with func.AuthLevel.FUNCTION rejects local calls that don't include a function key.
        fr: |
          Une fonction HTTP avec func.AuthLevel.FUNCTION refuse les appels locaux qui n'incluent pas de clé de fonction.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Locally, identity-based connections use the developer identity, such as the Azure CLI sign-in, instead of a managed identity, and the credential and clientId properties aren't needed. Authorization levels are disabled when functions run locally and are enforced only after publishing to Azure.
    fr: |
      En local, les connexions basées sur l'identité utilisent l'identité du développeur, comme la connexion Azure CLI, au lieu d'une identité managée, et les propriétés credential et clientId ne sont pas nécessaires. Les niveaux d'autorisation sont désactivés quand les fonctions s'exécutent en local et ne sont appliqués qu'après la publication dans Azure.
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
