id: ai200-3a-eg-topic-schema-cli
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is building a document-classification platform. Its Python services will publish custom events in the CloudEvents 1.0 format to a new Event Grid custom topic named **egt-litware-classify**. A container app that uses the managed identity whose principal ID is stored in `$APP_PRINCIPAL` will publish the events by using Microsoft Entra authentication.

    The solution must follow the principle of least privilege.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware développe une plateforme de classification de documents. Ses services Python publieront des événements personnalisés au format CloudEvents 1.0 dans une nouvelle rubrique personnalisée Event Grid nommée **egt-litware-classify**. Une application conteneur qui utilise l'identité managée dont l'ID de principal est stocké dans `$APP_PRINCIPAL` publiera les événements avec l'authentification Microsoft Entra.

    La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az eventgrid topic create --resource-group rg-litware \
      --name egt-litware-classify --location westeurope \
      --input-schema [[schema]]

    TOPIC_ID=$(az eventgrid topic show --resource-group rg-litware \
      --name egt-litware-classify --query id --output tsv)

    az role assignment create --assignee "$APP_PRINCIPAL" \
      --role "[[role]]" --scope "$TOPIC_ID"
  slots:
    - id: schema
      options:
        - { id: cloud, text: cloudeventschemav1_0 }
        - { id: eg, text: eventgridschema }
        - { id: custom, text: customeventschema }
    - id: role
      options:
        - { id: sender, text: EventGrid Data Sender }
        - { id: contributor, text: EventGrid Contributor }
        - { id: subcontrib, text: EventGrid EventSubscription Contributor }
answer:
  values: { schema: cloud, role: sender }
explanation:
  correct:
    en: |
      The input schema of a custom topic is set at creation and defaults to eventgridschema, so CloudEvents publishers need --input-schema cloudeventschemav1_0. EventGrid Data Sender lets the identity send events to the topic and nothing more.
    fr: |
      Le schéma d'entrée d'une rubrique personnalisée se définit à sa création et vaut eventgridschema par défaut : les éditeurs CloudEvents ont donc besoin de --input-schema cloudeventschemav1_0. EventGrid Data Sender permet à l'identité d'envoyer des événements à la rubrique, et rien de plus.
  options:
    eg:
      en: |
        eventgridschema, the default, accepts events in the Event Grid schema, not CloudEvents.
      fr: |
        eventgridschema, la valeur par défaut, accepte les événements au schéma Event Grid, pas les CloudEvents.
    custom:
      en: |
        customeventschema requires input mappings to translate a custom format; CloudEvents 1.0 has its own value.
      fr: |
        customeventschema exige des mappages d'entrée pour traduire un format personnalisé ; CloudEvents 1.0 a sa propre valeur.
    contributor:
      en: |
        EventGrid Contributor creates and manages Event Grid resources, more than publishing requires.
      fr: |
        EventGrid Contributor crée et gère des ressources Event Grid, plus que la publication ne l'exige.
    subcontrib:
      en: |
        EventGrid EventSubscription Contributor manages event subscriptions and doesn't grant the permission to send events.
      fr: |
        EventGrid EventSubscription Contributor gère les abonnements aux événements et n'accorde pas l'autorisation d'envoyer des événements.
references:
  - title: az eventgrid topic
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/topic
  - title: Event Grid Access Control with Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/event-grid/security-authorization
