id: ai200-3a-session-state
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs a support chatbot. Each turn of a conversation is sent to a session-enabled Service Bus queue named **turns**, with the session ID set to the conversation ID. A Python worker accepts one session at a time and maintains a running summary of the conversation.

    If a worker replica crashes, the replica that accepts the same session next must resume from the latest summary. You must not add a database.

    What should you do?
  fr: |
    Northwind exploite un chatbot de support. Chaque tour d'une conversation est envoyé à une file d'attente Service Bus avec sessions activées nommée **turns**, l'ID de session étant l'ID de la conversation. Un worker Python accepte une session à la fois et tient à jour un résumé de la conversation.

    Si un réplica du worker plante, le réplica qui accepte ensuite la même session doit reprendre à partir du dernier résumé. Vous ne devez pas ajouter de base de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Write the summary into the application properties of each message before calling complete_message.", fr: "Écrire le résumé dans les propriétés d'application de chaque message avant d'appeler complete_message." } }
    - { id: b, text: { en: "Save the summary as the session state after each turn, and read the session state when the session is accepted.", fr: "Enregistrer le résumé comme état de session après chaque tour, et lire l'état de session à l'acceptation de la session." } }
    - { id: c, text: { en: "Defer each processed turn, and receive the deferred turns again when the session is accepted.", fr: "Reporter chaque tour traité, et recevoir de nouveau les tours reportés à l'acceptation de la session." } }
    - { id: d, text: { en: "Abandon each processed turn so that the next replica receives the whole conversation again.", fr: "Abandonner chaque tour traité pour que le réplica suivant reçoive de nouveau toute la conversation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Session state is an opaque value stored by the broker for each session, up to the size of one message. The receiver sets it through the session object (set_state) and the next receiver of the session reads it (get_state), so processing can resume without an external store.
    fr: |
      L'état de session est une valeur opaque que le répartiteur stocke pour chaque session, dans la limite de la taille d'un message. Le récepteur la définit par l'objet session (set_state) et le récepteur suivant de la session la lit (get_state) : le traitement reprend sans magasin externe.
  options:
    a:
      en: |
        Properties added to a received message are not saved by the broker, and a completed message is deleted anyway.
      fr: |
        Les propriétés ajoutées à un message reçu ne sont pas enregistrées par le répartiteur, et un message terminé est de toute façon supprimé.
    c:
      en: |
        Deferral sets a message aside to be received later by its sequence number; it neither stores a summary nor tells the next replica which turns were processed.
      fr: |
        Le report met un message de côté pour le recevoir plus tard par son numéro de séquence ; il ne stocke pas de résumé et n'indique pas au réplica suivant quels tours ont été traités.
    d:
      en: |
        Abandoned turns are redelivered and their delivery count grows until they are dead-lettered after the maximum delivery count.
      fr: |
        Les tours abandonnés sont remis de nouveau et leur nombre de remises augmente jusqu'à leur placement en lettres mortes après le nombre maximal de remises.
references:
  - title: Azure Service Bus Enable FIFO with Sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
