id: ai200-3b-http-route-param
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a serverless API for its document summarization service in Python by using the Azure Functions v2 programming model. The function is declared as follows:

    ```python
    @app.route(route="documents/{doc_id}/summary", methods=["GET"])
    def get_summary(req: func.HttpRequest) -> func.HttpResponse:
        doc_id = ...
    ```

    You need to read the document identifier from the request URL.

    Which code should you use?
  fr: |
    Contoso crée une API serverless pour son service de résumé de documents, en Python, avec le modèle de programmation v2 d'Azure Functions. La fonction est déclarée comme suit :

    ```python
    @app.route(route="documents/{doc_id}/summary", methods=["GET"])
    def get_summary(req: func.HttpRequest) -> func.HttpResponse:
        doc_id = ...
    ```

    Vous devez lire l'identifiant du document dans l'URL de la requête.

    Quel code devez-vous utiliser ?
body:
  options:
    - { id: a, text: "doc_id = req.params.get(\"doc_id\")" }
    - { id: b, text: "doc_id = req.route_params.get(\"doc_id\")" }
    - { id: c, text: "doc_id = req.get_json().get(\"doc_id\")" }
    - { id: d, text: "doc_id = req.headers.get(\"doc_id\")" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the Python v2 model, values captured by the route template are exposed in `req.route_params`. Learn states that route parameters must not be added as extra function arguments; you read them from `req.route_params` instead.
    fr: |
      Dans le modèle Python v2, les valeurs capturées par le modèle de route sont exposées dans `req.route_params`. Learn précise qu'il ne faut pas ajouter les paramètres de route comme arguments supplémentaires de la fonction ; on les lit dans `req.route_params`.
  options:
    a: { en: "`req.params` contains the query string parameters (`?doc_id=...`), not the route segments.", fr: "`req.params` contient les paramètres de la chaîne de requête (`?doc_id=...`), pas les segments de la route." }
    c: { en: "`get_json()` parses the request body; a GET request to this route carries the identifier in the URL path.", fr: "`get_json()` analyse le corps de la requête ; une requête GET sur cette route transporte l'identifiant dans le chemin de l'URL." }
    d: { en: "Route values are not copied to HTTP headers.", fr: "Les valeurs de route ne sont pas copiées dans les en-têtes HTTP." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
