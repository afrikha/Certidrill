id: ai200-3b-blob-eventgrid-flex
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is moving an image-captioning function app to the Flex Consumption plan. A Python function (v2 programming model) currently uses the following decorator:

    ```python
    @app.blob_trigger(arg_name="img", path="uploads/{name}", connection="ImagesStorage")
    ```

    The function must keep running when a new image is uploaded to the **uploads** container.

    What should you do?
  fr: |
    Tailspin Toys migre une application de fonction de légende d'images vers le plan Flex Consumption. Une fonction Python (modèle de programmation v2) utilise actuellement le décorateur suivant :

    ```python
    @app.blob_trigger(arg_name="img", path="uploads/{name}", connection="ImagesStorage")
    ```

    La fonction doit continuer à s'exécuter quand une nouvelle image est chargée dans le conteneur **uploads**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add source=\"EventGrid\" to the decorator and create an Event Grid subscription on the storage account for the function.", fr: "Ajouter source=\"EventGrid\" au décorateur et créer un abonnement Event Grid sur le compte de stockage pour la fonction." } }
    - { id: b, text: { en: "Add source=\"LogsAndContainerScan\" to the decorator and enable storage logging on the storage account.", fr: "Ajouter source=\"LogsAndContainerScan\" au décorateur et activer la journalisation du stockage sur le compte de stockage." } }
    - { id: c, text: { en: "Replace the blob trigger with a timer trigger that lists the container every minute.", fr: "Remplacer le déclencheur blob par un déclencheur de minuteur qui liste le conteneur chaque minute." } }
    - { id: d, text: { en: "Configure one always-ready instance for the blob scale group so that polling never stops.", fr: "Configurer une instance toujours prête pour le groupe de mise à l'échelle blob afin que l'interrogation ne s'arrête jamais." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Flex Consumption, the Blob storage trigger supports only the Event Grid source. You set `source="EventGrid"` on the decorator, which also lowers latency, and the storage account sends BlobCreated events to the function through an Event Grid subscription.
    fr: |
      En Flex Consumption, le déclencheur Stockage Blob ne prend en charge que la source Event Grid. Vous définissez `source="EventGrid"` sur le décorateur, ce qui réduit aussi la latence, et le compte de stockage envoie les événements BlobCreated à la fonction via un abonnement Event Grid.
  options:
    b: { en: "LogsAndContainerScan is the default polling source, which Flex Consumption does not support.", fr: "LogsAndContainerScan est la source par interrogation par défaut, que Flex Consumption ne prend pas en charge." }
    c: { en: "Listing the container on a schedule is custom code with added latency and cost; the blob trigger already supports Flex through Event Grid.", fr: "Lister le conteneur selon une planification est du code personnalisé, avec plus de latence et de coût ; le déclencheur blob prend déjà en charge Flex via Event Grid." }
    d: { en: "Always-ready instances reduce cold starts but do not make the polling source available on Flex Consumption.", fr: "Les instances toujours prêtes réduisent les démarrages à froid mais ne rendent pas la source par interrogation disponible en Flex Consumption." }
references:
  - title: Azure Blob storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-trigger
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
