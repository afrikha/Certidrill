stem:
  en: You host the app in a Flex Consumption plan with virtual network integration.
  fr: Vous hébergez l'application dans un plan Flex Consumption avec l'intégration au réseau virtuel.
body:
  solution:
    en: |
      You create func-adatum-enrich in a **Flex Consumption** plan, with no always ready instances. You configure virtual network integration with a subnet of vnet-adatum that is delegated to `Microsoft.App/environments`.
    fr: |
      Vous créez func-adatum-enrich dans un plan **Flex Consumption**, sans instance toujours prête. Vous configurez l'intégration au réseau virtuel avec un sous-réseau de vnet-adatum délégué à `Microsoft.App/environments`.
answer: { value: true }
explanation:
  correct:
    en: Flex Consumption is a Linux plan that supports Python and adds virtual network integration to the serverless model, through a subnet delegated to `Microsoft.App/environments`. Always ready instances default to zero, so in on demand mode the app scales to zero when idle and is billed only for execution time.
    fr: "Flex Consumption est un plan Linux qui prend en charge Python et ajoute l'intégration au réseau virtuel au modèle serverless, par le biais d'un sous-réseau délégué à `Microsoft.App/environments`. Le nombre d'instances toujours prêtes est de zéro par défaut : en mode à la demande, l'application se met à l'échelle jusqu'à zéro lorsqu'elle est inactive et n'est facturée que pour le temps d'exécution."
references:
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
