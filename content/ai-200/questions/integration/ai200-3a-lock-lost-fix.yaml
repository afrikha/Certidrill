id: ai200-3a-lock-lost-fix
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wide World Importers has a Service Bus queue named **embed-jobs** that uses the default settings. A Python worker receives each job in peek-lock mode, computes embeddings for 3 to 4 minutes, and then calls `complete_message`.

    Monitoring shows that jobs are delivered to a second replica while the first replica is still working on them, and that `complete_message` then fails because the lock was lost. No job can be lost.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers dispose d'une file d'attente Service Bus nommée **embed-jobs** qui utilise les paramètres par défaut. Un worker Python reçoit chaque tâche en mode peek-lock, calcule des incorporations pendant 3 à 4 minutes, puis appelle `complete_message`.

    La supervision montre que des tâches sont remises à un second réplica pendant que le premier y travaille encore, et que `complete_message` échoue ensuite parce que le verrou a été perdu. Aucune tâche ne doit être perdue.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the lock duration of embed-jobs to 5 minutes.", fr: "Définir la durée de verrouillage d'embed-jobs sur 5 minutes." } }
    - { id: b, text: { en: "Receive the jobs in RECEIVE_AND_DELETE mode.", fr: "Recevoir les tâches en mode RECEIVE_AND_DELETE." } }
    - { id: c, text: { en: "Set the maximum delivery count of embed-jobs to 20.", fr: "Définir le nombre maximal de remises d'embed-jobs sur 20." } }
    - { id: d, text: { en: "Register each received job with an AutoLockRenewer.", fr: "Inscrire chaque tâche reçue auprès d'un AutoLockRenewer." } }
    - { id: e, text: { en: "Create embed-jobs again with duplicate detection enabled.", fr: "Recréer embed-jobs avec la détection des doublons activée." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The default lock duration is 1 minute, so the lock expires during the 3 to 4 minutes of work and the job is redelivered. Raising the lock duration to its maximum of 5 minutes covers the processing time, and registering the message with AutoLockRenewer keeps renewing the lock (for 5 minutes by default) in the background; either one solves the problem.
    fr: |
      La durée de verrouillage par défaut est de 1 minute : le verrou expire pendant les 3 à 4 minutes de travail et la tâche est remise de nouveau. Porter la durée de verrouillage à son maximum de 5 minutes couvre le temps de traitement, et inscrire le message auprès d'AutoLockRenewer renouvelle le verrou en arrière-plan (pendant 5 minutes par défaut) ; l'une ou l'autre solution règle le problème.
  options:
    b:
      en: |
        Receive-and-delete removes the job on delivery, so a crashed replica would lose it.
      fr: |
        Le mode receive-and-delete supprime la tâche à la remise : un réplica qui plante la perdrait.
    c:
      en: |
        More deliveries before dead-lettering don't stop the lock from expiring; the duplicate processing continues.
      fr: |
        Davantage de remises avant les lettres mortes n'empêchent pas le verrou d'expirer ; le double traitement continue.
    e:
      en: |
        Duplicate detection drops repeated sends of the same message ID; it doesn't affect redelivery after an expired lock.
      fr: |
        La détection des doublons écarte les envois répétés d'un même ID de message ; elle n'agit pas sur la nouvelle remise après l'expiration d'un verrou.
references:
  - title: Message Transfers, Locks, and Settlement
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement
  - title: azure.servicebus.AutoLockRenewer class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.autolockrenewer
