id: ai200-3b-host-timeout
objective: "3.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a Python function app on a Premium plan. A function generates embeddings for a full document archive. Any execution that is still running after 90 minutes must be stopped by the runtime.

    How should you complete the host.json file? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute une application de fonction Python sur un plan Premium. Une fonction génère des incorporations pour toute une archive de documents. Toute exécution encore en cours au bout de 90 minutes doit être arrêtée par le runtime.

    Comment devez-vous compléter le fichier host.json ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "version": "[[ver]]",
      "[[key]]": "[[val]]"
    }
  slots:
    - id: ver
      options:
        - { id: v2, text: "2.0" }
        - { id: v4, text: "4.0" }
        - { id: tilde, text: "~4" }
    - id: key
      options:
        - { id: ft, text: "functionTimeout" }
        - { id: lock, text: "maxAutoLockRenewalDuration" }
        - { id: idle, text: "sessionIdleTimeout" }
    - id: val
      options:
        - { id: hm, text: "01:30:00" }
        - { id: min, text: "00:90:00" }
        - { id: num, text: "90" }
        - { id: day, text: "1.30:00:00" }
answer:
  values: { ver: v2, key: ft, val: hm }
explanation:
  correct:
    en: "The schema version string \"2.0\" is required for runtime v2 and later, with no schema change since. `functionTimeout` sets the timeout of all executions as a timespan `[d.]hh:mm:ss`, where minutes range from 0 to 59, so 90 minutes is `01:30:00`."
    fr: "La chaîne de version de schéma \"2.0\" est obligatoire pour le runtime v2 et versions ultérieures, sans changement de schéma depuis. `functionTimeout` définit le délai d'expiration de toutes les exécutions sous forme de durée `[d.]hh:mm:ss`, où les minutes vont de 0 à 59 : 90 minutes s'écrivent donc `01:30:00`."
  options:
    v4: { en: "host.json schema versions are not runtime versions; the value stays 2.0 on runtime 4.", fr: "Les versions de schéma host.json ne sont pas des versions du runtime ; la valeur reste 2.0 avec le runtime 4." }
    tilde: { en: "~4 is the format of the FUNCTIONS_EXTENSION_VERSION app setting.", fr: "~4 est le format du paramètre d'application FUNCTIONS_EXTENSION_VERSION." }
    lock: { en: "maxAutoLockRenewalDuration is a Service Bus extension setting.", fr: "maxAutoLockRenewalDuration est un paramètre de l'extension Service Bus." }
    idle: { en: "sessionIdleTimeout is a Service Bus session setting.", fr: "sessionIdleTimeout est un paramètre des sessions Service Bus." }
    min: { en: "Minutes must be between 0 and 59.", fr: "Les minutes doivent être comprises entre 0 et 59." }
    num: { en: "The value is a timespan string, not a number of minutes.", fr: "La valeur est une chaîne de durée, pas un nombre de minutes." }
    day: { en: "This value means one day and 30 hours, which is not valid.", fr: "Cette valeur signifie un jour et 30 heures, ce qui n'est pas valide." }
references:
  - title: host.json reference for Azure Functions 2.x
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-host-json
