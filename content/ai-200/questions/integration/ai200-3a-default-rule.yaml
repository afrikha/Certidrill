id: ai200-3a-default-rule
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Lucerne Publishing has a Service Bus topic named **documents**. Each message carries an application property named `language`. You run the following commands:

    ```bash
    az servicebus topic subscription create --resource-group rg-lucerne \
      --namespace-name sb-lucerne --topic-name documents --name fr-docs

    az servicebus topic subscription rule create --resource-group rg-lucerne \
      --namespace-name sb-lucerne --topic-name documents \
      --subscription-name fr-docs --name french \
      --filter-sql-expression "language = 'fr'"
    ```

    The French translation worker that reads fr-docs still receives the messages of every language. What should you do?
  fr: |
    Lucerne Publishing dispose d'une rubrique Service Bus nommée **documents**. Chaque message porte une propriété d'application nommée `language`. Vous exécutez les commandes suivantes :

    ```bash
    az servicebus topic subscription create --resource-group rg-lucerne \
      --namespace-name sb-lucerne --topic-name documents --name fr-docs

    az servicebus topic subscription rule create --resource-group rg-lucerne \
      --namespace-name sb-lucerne --topic-name documents \
      --subscription-name fr-docs --name french \
      --filter-sql-expression "language = 'fr'"
    ```

    Le worker de traduction française qui lit fr-docs reçoit encore les messages de toutes les langues. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the SQL filter of the french rule with a correlation filter.", fr: "Remplacer le filtre SQL de la règle french par un filtre de corrélation." } }
    - { id: b, text: { en: "Change the expression of the french rule to sys.language = 'fr'.", fr: "Remplacer l'expression de la règle french par sys.language = 'fr'." } }
    - { id: c, text: { en: "Delete the $Default rule of the fr-docs subscription.", fr: "Supprimer la règle $Default de l'abonnement fr-docs." } }
    - { id: d, text: { en: "Enable dead-lettering on filter evaluation exceptions for fr-docs.", fr: "Activer les lettres mortes sur les exceptions d'évaluation de filtre pour fr-docs." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A new subscription gets a default rule, $Default, with a true filter that selects every message. Rules without actions are combined with OR, so the subscription keeps receiving everything until $Default is deleted (`az servicebus topic subscription rule delete --name '$Default'`).
    fr: |
      Un nouvel abonnement reçoit une règle par défaut, $Default, dont le filtre vrai sélectionne tous les messages. Les règles sans action se combinent par OU : l'abonnement continue donc de tout recevoir tant que $Default n'est pas supprimée (`az servicebus topic subscription rule delete --name '$Default'`).
  options:
    a:
      en: |
        A correlation filter is cheaper, but the $Default rule would still select every message.
      fr: |
        Un filtre de corrélation coûte moins cher, mais la règle $Default sélectionnerait toujours tous les messages.
    b:
      en: |
        The sys. prefix designates system properties; language is an application property, so the expression would no longer match the French messages.
      fr: |
        Le préfixe sys. désigne les propriétés système ; language est une propriété d'application : l'expression ne correspondrait plus aux messages en français.
    d:
      en: |
        This option only captures messages whose filter evaluation throws an error; it doesn't stop the true filter from matching.
      fr: |
        Cette option capture seulement les messages dont l'évaluation de filtre lève une erreur ; elle n'empêche pas le filtre vrai de correspondre.
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
  - title: az servicebus topic subscription rule
    url: https://learn.microsoft.com/en-us/cli/azure/servicebus/topic/subscription/rule
