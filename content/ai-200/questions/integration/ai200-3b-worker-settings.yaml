id: ai200-3b-worker-settings
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs a Python function app named **func-tt-ocr** on a Premium plan. Profiling shows that each instance is underused. You need to configure the app so that:

    - each instance runs up to four Python language worker processes;
    - each worker process uses up to eight threads to run invocations.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute une application de fonction Python nommée **func-tt-ocr** sur un plan Premium. Le profilage montre que chaque instance est sous-utilisée. Vous devez configurer l'application pour que :

    - chaque instance exécute jusqu'à quatre processus Worker de langage Python ;
    - chaque processus Worker utilise jusqu'à huit threads pour exécuter les appels.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az functionapp config appsettings set -g rg-tt -n func-tt-ocr --settings \
      [[procs]]=4 [[threads]]=8
  slots:
    - id: procs
      options:
        - { id: wpc, text: "FUNCTIONS_WORKER_PROCESS_COUNT" }
        - { id: scale, text: "WEBSITE_MAX_DYNAMIC_APPLICATION_SCALE_OUT" }
        - { id: http, text: "FUNCTIONS_MAX_HTTP_CONCURRENCY" }
    - id: threads
      options:
        - { id: pool, text: "PYTHON_THREADPOOL_THREAD_COUNT" }
        - { id: isolate, text: "PYTHON_ISOLATE_WORKER_DEPENDENCIES" }
        - { id: dyn, text: "FUNCTIONS_WORKER_DYNAMIC_CONCURRENCY_ENABLED" }
answer:
  values: { procs: wpc, threads: pool }
explanation:
  correct:
    en: |
      FUNCTIONS_WORKER_PROCESS_COUNT sets the maximum number of language worker processes per instance (default 1, maximum 10), and invocations are distributed evenly among them. PYTHON_THREADPOOL_THREAD_COUNT sets the maximum number of threads a Python worker uses to run invocations (maximum 32). Neither setting adds instances.
    fr: |
      FUNCTIONS_WORKER_PROCESS_COUNT définit le nombre maximal de processus Worker de langage par instance (1 par défaut, 10 au maximum), et les appels sont répartis uniformément entre eux. PYTHON_THREADPOOL_THREAD_COUNT définit le nombre maximal de threads qu'un Worker Python utilise pour exécuter les appels (32 au maximum). Aucun des deux paramètres n'ajoute d'instances.
  options:
    scale: { en: "This setting limits the number of instances the app scales out to.", fr: "Ce paramètre limite le nombre d'instances vers lesquelles l'application monte en charge." }
    http: { en: "This setting controls HTTP concurrency, not the number of worker processes.", fr: "Ce paramètre contrôle la concurrence HTTP, pas le nombre de processus Worker." }
    isolate: { en: "This setting isolates the dependencies of the worker from those of the app.", fr: "Ce paramètre isole les dépendances du Worker de celles de l'application." }
    dyn: { en: "This setting enables dynamic concurrency; it doesn't set a thread count.", fr: "Ce paramètre active la concurrence dynamique ; il ne définit pas de nombre de threads." }
references:
  - title: App settings reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-app-settings
