id: ai200-3b-http-key-passing
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware hosts an HTTP-triggered function named **classify** in a function app named **func-litware-ai**. The function uses `func.AuthLevel.FUNCTION`. A partner developer has received a function key for classify.

    You need to tell the partner how to send the key with each request.

    Which two methods can the partner use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge une fonction déclenchée par HTTP nommée **classify** dans une application de fonction nommée **func-litware-ai**. La fonction utilise `func.AuthLevel.FUNCTION`. Un développeur partenaire a reçu une clé de fonction pour classify.

    Vous devez indiquer au partenaire comment envoyer la clé avec chaque requête.

    Quelles sont les deux méthodes que le partenaire peut utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the key to the query string in a parameter named code.", fr: "Ajouter la clé à la chaîne de requête dans un paramètre nommé code." } }
    - { id: b, text: { en: "Send the key in an Authorization header with the Bearer scheme.", fr: "Envoyer la clé dans un en-tête Authorization avec le schéma Bearer." } }
    - { id: c, text: { en: "Send the key in an HTTP header named x-functions-key.", fr: "Envoyer la clé dans un en-tête HTTP nommé x-functions-key." } }
    - { id: d, text: { en: "Send the key in an HTTP header named Ocp-Apim-Subscription-Key.", fr: "Envoyer la clé dans un en-tête HTTP nommé Ocp-Apim-Subscription-Key." } }
    - { id: e, text: { en: "Add the key to the JSON request body in a property named functionKey.", fr: "Ajouter la clé au corps JSON de la requête dans une propriété nommée functionKey." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An access key can be passed in a query string variable named `code` or in an `x-functions-key` HTTP header. The value can be any function key of the function or any host key.
    fr: |
      Une clé d'accès peut être transmise dans une variable de chaîne de requête nommée `code` ou dans un en-tête HTTP `x-functions-key`. La valeur peut être n'importe quelle clé de fonction de la fonction ou n'importe quelle clé d'hôte.
  options:
    b: { en: "Functions keys are not bearer tokens; the Authorization header is used for Microsoft Entra tokens, not function keys.", fr: "Les clés Functions ne sont pas des jetons du porteur ; l'en-tête Authorization sert aux jetons Microsoft Entra, pas aux clés de fonction." }
    d: { en: "Ocp-Apim-Subscription-Key carries an API Management subscription key, not a function key.", fr: "Ocp-Apim-Subscription-Key transporte une clé d'abonnement API Management, pas une clé de fonction." }
    e: { en: "The Functions host does not read keys from the request body.", fr: "L'hôte Functions ne lit pas les clés dans le corps de la requête." }
references:
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
