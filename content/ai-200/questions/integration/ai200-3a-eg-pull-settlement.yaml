id: ai200-3a-eg-pull-settlement
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso consumes CloudEvents from a queue event subscription of an Event Grid namespace topic. A Python worker calls `EventGridConsumerClient.receive()` and gets each event with a lock token. A dead-letter destination is configured on the event subscription.

    Which operation should the worker call with the lock token in each situation? To answer, drag the appropriate operations to the correct situations. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso consomme des CloudEvents à partir d'un abonnement aux événements de type file d'attente d'une rubrique d'espace de noms Event Grid. Un worker Python appelle `EventGridConsumerClient.receive()` et obtient chaque événement avec un jeton de verrou. Une destination de lettres mortes est configurée sur l'abonnement aux événements.

    Quelle opération le worker doit-il appeler avec le jeton de verrou dans chaque situation ? Pour répondre, faites glisser les opérations appropriées vers les situations correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ack, text: acknowledge }
    - { id: release, text: release }
    - { id: reject, text: reject }
    - { id: renew, text: renew_locks }
    - { id: receive, text: receive }
  targets:
    - id: done
      text: { en: "The event was processed and must not be delivered again.", fr: "L'événement a été traité et ne doit plus être remis." }
    - id: downstream
      text: { en: "The vector database is temporarily unavailable; the event must be delivered again later.", fr: "La base de données vectorielle est temporairement indisponible ; l'événement doit être remis plus tard." }
    - id: malformed
      text: { en: "The event data is malformed and can never be processed.", fr: "Les données de l'événement sont mal formées et ne pourront jamais être traitées." }
    - id: long
      text: { en: "The processing of the event will take longer than the remaining lock time.", fr: "Le traitement de l'événement durera plus longtemps que le temps de verrou restant." }
answer:
  mapping: { done: ack, downstream: release, malformed: reject, long: renew }
explanation:
  correct:
    en: |
      Acknowledge marks the event as processed and deletes it. Release makes it available for redelivery, immediately or after a delay. Reject is for events that can't be processed; they are dead-lettered when a dead-letter destination exists, otherwise dropped. renew_locks extends the lock of events that are still being processed.
    fr: |
      Acknowledge marque l'événement comme traité et le supprime. Release le rend disponible pour une nouvelle remise, immédiatement ou après un délai. Reject s'applique aux événements impossibles à traiter ; ils sont placés en lettres mortes si une destination de lettres mortes existe, sinon supprimés. renew_locks prolonge le verrou des événements encore en cours de traitement.
  options:
    receive:
      en: |
        receive gets new events with new lock tokens; it doesn't settle an event already received.
      fr: |
        receive obtient de nouveaux événements avec de nouveaux jetons de verrou ; il ne règle pas un événement déjà reçu.
references:
  - title: Azure Event Grid Pull Delivery Overview
    url: https://learn.microsoft.com/en-us/azure/event-grid/pull-delivery-overview
  - title: Azure Event Grid client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/eventgrid-readme
