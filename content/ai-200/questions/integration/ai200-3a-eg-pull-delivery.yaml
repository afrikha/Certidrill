id: ai200-3a-eg-pull-delivery
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is building an AI fraud-review service that runs in a network that accepts no inbound connections; it can only open outbound HTTPS connections. The service must consume "transaction flagged" events published by a Python app in the CloudEvents format.

    The service must receive the events directly from Event Grid, without adding another messaging service, and must be able to postpone an event for later redelivery when a downstream system is unavailable.

    What should you use?
  fr: |
    Woodgrove Bank développe un service d'examen des fraudes par IA qui s'exécute dans un réseau n'acceptant aucune connexion entrante ; il ne peut ouvrir que des connexions HTTPS sortantes. Le service doit consommer des événements « transaction signalée » publiés par une application Python au format CloudEvents.

    Le service doit recevoir les événements directement d'Event Grid, sans ajouter d'autre service de messagerie, et doit pouvoir différer un événement pour qu'il soit remis plus tard quand un système en aval est indisponible.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A namespace topic with a queue event subscription that the service pulls from", fr: "Une rubrique d'espace de noms avec un abonnement de type file d'attente dont le service extrait les événements" } }
    - { id: b, text: { en: "A custom topic with an event subscription that delivers to a Storage queue read by the service", fr: "Une rubrique personnalisée avec un abonnement aux événements qui remet à une file d'attente Stockage lue par le service" } }
    - { id: c, text: { en: "A custom topic with a webhook event subscription that points to the service", fr: "Une rubrique personnalisée avec un abonnement aux événements webhook qui pointe vers le service" } }
    - { id: d, text: { en: "A system topic with an event subscription that has a dead-letter destination", fr: "Une rubrique système avec un abonnement aux événements doté d'une destination de lettres mortes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Event Grid namespaces support pull delivery for CloudEvents. The consumer connects outbound, receives events from a queue event subscription with lock tokens, acknowledges the processed ones, and can release an event, immediately or after a delay, for redelivery. No public endpoint is required.
    fr: |
      Les espaces de noms Event Grid prennent en charge la remise pull des CloudEvents. Le consommateur se connecte en sortie, reçoit les événements d'un abonnement aux événements de type file d'attente avec des jetons de verrou, acquitte ceux qu'il a traités et peut libérer un événement, immédiatement ou après un délai, pour qu'il soit remis de nouveau. Aucun point de terminaison public n'est nécessaire.
  options:
    c:
      en: |
        Push delivery to a webhook requires an endpoint that Event Grid can reach, which the network doesn't allow.
      fr: |
        La remise push vers un webhook exige un point de terminaison joignable par Event Grid, ce que le réseau n'autorise pas.
    b:
      en: |
        A Storage queue adds another messaging service, which the requirements exclude.
      fr: |
        Une file d'attente Stockage ajoute un autre service de messagerie, ce que les exigences excluent.
    d:
      en: |
        A system topic carries the events of an Azure service, not the app's custom events, and its subscriptions still push to an endpoint.
      fr: |
        Une rubrique système transporte les événements d'un service Azure, pas les événements personnalisés de l'application, et ses abonnements poussent toujours vers un point de terminaison.
references:
  - title: Azure Event Grid Pull Delivery Overview
    url: https://learn.microsoft.com/en-us/azure/event-grid/pull-delivery-overview
