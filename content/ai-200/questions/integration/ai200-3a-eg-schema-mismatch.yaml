id: ai200-3a-eg-schema-mismatch
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Event Grid custom topic named **egt-fabrikam-docs** that was created by running `az eventgrid topic create -g rg-docs -n egt-fabrikam-docs -l westeurope`. Several existing publishers use the topic.

    A new Python service publishes a `CloudEvent` object to the topic by using `EventGridPublisherClient.send()`, and the request is rejected. You must not recreate the topic or change the other publishers.

    What should you do in the new service?
  fr: |
    Fabrikam dispose d'une rubrique personnalisée Event Grid nommée **egt-fabrikam-docs**, créée en exécutant `az eventgrid topic create -g rg-docs -n egt-fabrikam-docs -l westeurope`. Plusieurs éditeurs existants utilisent la rubrique.

    Un nouveau service Python publie un objet `CloudEvent` dans la rubrique avec `EventGridPublisherClient.send()`, et la requête est rejetée. Vous ne devez pas recréer la rubrique ni modifier les autres éditeurs.

    Que devez-vous faire dans le nouveau service ?
body:
  options:
    - { id: a, text: { en: "Publish EventGridEvent objects that set subject, event_type, data and data_version.", fr: "Publier des objets EventGridEvent qui définissent subject, event_type, data et data_version." } }
    - { id: b, text: { en: "Authenticate with AzureKeyCredential instead of DefaultAzureCredential.", fr: "S'authentifier avec AzureKeyCredential au lieu de DefaultAzureCredential." } }
    - { id: c, text: { en: "Set the event delivery schema of each event subscription to cloudeventschemav1_0.", fr: "Définir le schéma de remise des événements de chaque abonnement aux événements sur cloudeventschemav1_0." } }
    - { id: d, text: { en: "Send each CloudEvent in its own call instead of in a list.", fr: "Envoyer chaque CloudEvent dans son propre appel plutôt que dans une liste." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The input schema of a custom topic is chosen at creation and defaults to the Event Grid schema (eventgridschema). Such a topic accepts events in the Event Grid schema, so the service must publish EventGridEvent objects with a subject, an event type, data and a data version.
    fr: |
      Le schéma d'entrée d'une rubrique personnalisée se choisit à sa création et vaut par défaut le schéma Event Grid (eventgridschema). Une telle rubrique accepte les événements au schéma Event Grid : le service doit donc publier des objets EventGridEvent avec un objet (subject), un type d'événement, des données et une version des données.
  options:
    b:
      en: |
        The credential type doesn't change the schema that the topic accepts.
      fr: |
        Le type d'informations d'identification ne change pas le schéma accepté par la rubrique.
    c:
      en: |
        The delivery schema controls how events are delivered to handlers; publishing still has to use the input schema of the topic.
      fr: |
        Le schéma de remise détermine comment les événements sont remis aux gestionnaires ; la publication doit toujours respecter le schéma d'entrée de la rubrique.
    d:
      en: |
        Sending a list is the recommended way to publish; one event per call is still rejected for the same schema reason.
      fr: |
        L'envoi d'une liste est la méthode recommandée ; un événement par appel serait rejeté pour la même raison de schéma.
references:
  - title: az eventgrid topic
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/topic
  - title: Azure Event Grid client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/eventgrid-readme
