id: ai200-cs2c-defect-events
objective: "3.1.2"
type: multi
caseStudy: ai200-cs2c-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You are writing the code of func-byair-defects that publishes the defect events by using the azure-eventgrid library.

    You need to meet the defect events requirement. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le code de func-byair-defects qui publie les événements de défaut à l'aide de la bibliothèque azure-eventgrid.

    Vous devez satisfaire l'exigence relative aux événements de défaut. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Assign the EventGrid Data Sender role on egt-maintenance to the managed identity of func-byair-defects."
        fr: "Attribuer le rôle EventGrid Data Sender sur egt-maintenance à l'identité managée de func-byair-defects."
    - id: b
      text:
        en: "Assign the EventGrid Contributor role on egt-maintenance to the managed identity of func-byair-defects."
        fr: "Attribuer le rôle EventGrid Contributor sur egt-maintenance à l'identité managée de func-byair-defects."
    - id: c
      text:
        en: "Create an `EventGridPublisherClient` with `DefaultAzureCredential` and send `CloudEvent` objects."
        fr: "Créer un `EventGridPublisherClient` avec `DefaultAzureCredential` et envoyer des objets `CloudEvent`."
    - id: d
      text:
        en: "Create an `EventGridPublisherClient` with `DefaultAzureCredential` and send `EventGridEvent` objects."
        fr: "Créer un `EventGridPublisherClient` avec `DefaultAzureCredential` et envoyer des objets `EventGridEvent`."
    - id: e
      text:
        en: "Create an `EventGridPublisherClient` with an `AzureKeyCredential` that reads the topic key from Azure Key Vault."
        fr: "Créer un `EventGridPublisherClient` avec un `AzureKeyCredential` qui lit la clé de la rubrique dans Azure Key Vault."
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      To publish with a Microsoft Entra token credential, the identity needs the EventGrid Data Sender role on the topic. The schema of the events must match the input schema chosen when the topic was created: egt-maintenance expects CloudEvents v1.0, so the code sends `CloudEvent` objects (with `type` set to `BlueYonder.Defect.Reported` and a `source`).
    fr: |
      Pour publier avec des informations d'identification par jeton Microsoft Entra, l'identité a besoin du rôle EventGrid Data Sender sur la rubrique. Le schéma des événements doit correspondre au schéma d'entrée choisi à la création de la rubrique : egt-maintenance attend CloudEvents v1.0, le code envoie donc des objets `CloudEvent` (avec `type` défini sur `BlueYonder.Defect.Reported` et une `source`).
  options:
    b:
      en: EventGrid Contributor manages Event Grid resources (control plane); it does not grant the right to publish events.
      fr: EventGrid Contributor gère les ressources Event Grid (plan de contrôle) ; il n'accorde pas le droit de publier des événements.
    d:
      en: EventGridEvent objects use the Event Grid schema; a topic that requires the CloudEvents schema rejects them with an error.
      fr: Les objets EventGridEvent utilisent le schéma Event Grid ; une rubrique qui exige le schéma CloudEvents les rejette avec une erreur.
    e:
      en: The topic key is an access key, even when it is stored in Key Vault, which the requirement forbids.
      fr: La clé de la rubrique est une clé d'accès, même stockée dans Key Vault, ce que l'exigence interdit.
references:
  - title: Azure Event Grid client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/eventgrid-readme
