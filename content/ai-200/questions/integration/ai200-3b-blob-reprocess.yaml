id: ai200-3b-blob-reprocess
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs a Python function app on a Premium plan. A blob-triggered function that uses the default polling source generates embeddings for the documents in the **manuals** container. After a bug fix in the embedding code, you must process the blob `manuals/pump-x200.pdf` again.

    The blob content, name and metadata must not change, and the other blobs must not be processed again.

    What should you do?
  fr: |
    Contoso exécute une application de fonction Python sur un plan Premium. Une fonction déclenchée par blob qui utilise la source par interrogation par défaut génère des incorporations pour les documents du conteneur **manuals**. Après la correction d'un bogue du code d'incorporation, vous devez traiter à nouveau l'objet blob `manuals/pump-x200.pdf`.

    Le contenu, le nom et les métadonnées de l'objet blob ne doivent pas changer, et les autres objets blob ne doivent pas être traités de nouveau.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the message for the blob from the webjobs-blobtrigger-poison queue.", fr: "Supprimer le message de l'objet blob de la file d'attente webjobs-blobtrigger-poison." } }
    - { id: b, text: { en: "Delete the blob receipt of the blob from the azure-webjobs-hosts container of the app's host storage account.", fr: "Supprimer le reçu d'objet blob (blob receipt) de cet objet blob dans le conteneur azure-webjobs-hosts du compte de stockage de l'hôte." } }
    - { id: c, text: { en: "Restart the function app so that the trigger scans the container again.", fr: "Redémarrer l'application de fonction pour que le déclencheur analyse à nouveau le conteneur." } }
    - { id: d, text: { en: "Rename the blob trigger function so that the runtime treats all blobs as new.", fr: "Renommer la fonction déclenchée par blob pour que le runtime considère tous les objets blob comme nouveaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The runtime stores blob receipts in the azure-webjobs-hosts container of the AzureWebJobsStorage account, keyed by function, container, blob name and ETag, so that a blob is processed only once. Deleting the receipt of one blob forces that blob to be processed again; the reprocessing might not be immediate but is guaranteed to happen.
    fr: |
      Le runtime stocke les reçus d'objets blob dans le conteneur azure-webjobs-hosts du compte AzureWebJobsStorage, par fonction, conteneur, nom d'objet blob et ETag, afin qu'un objet blob ne soit traité qu'une fois. Supprimer le reçu d'un objet blob force un nouveau traitement de cet objet blob ; il peut ne pas être immédiat mais il est garanti.
  options:
    a: { en: "The poison queue only holds blobs that failed five times; this blob was processed successfully.", fr: "La file d'attente des objets incohérents ne contient que les objets blob en échec cinq fois ; cet objet blob a été traité avec succès." }
    c: { en: "Receipts persist in storage, so a restart does not reprocess blobs that already have a receipt.", fr: "Les reçus persistent dans le stockage : un redémarrage ne retraite pas les objets blob qui ont déjà un reçu." }
    d: { en: "Receipts are kept per function, so a renamed function would reprocess every blob, not only this one.", fr: "Les reçus sont conservés par fonction : une fonction renommée retraiterait tous les objets blob, pas seulement celui-ci." }
references:
  - title: Azure Blob storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-trigger
