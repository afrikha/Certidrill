id: ai200-3b-host-uai
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso connects the host of a function app named **func-contoso-ingest** to its storage account with these app settings:

    - `AzureWebJobsStorage__accountName` = `stcontosoingest`
    - `AzureWebJobsStorage__credential` = `managedidentity`

    The app has a system-assigned identity and a user-assigned identity named **id-contoso-host**. The host must use id-contoso-host, which has the required roles.

    Which two app settings can you add? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso connecte l'hôte d'une application de fonction nommée **func-contoso-ingest** à son compte de stockage avec ces paramètres d'application :

    - `AzureWebJobsStorage__accountName` = `stcontosoingest`
    - `AzureWebJobsStorage__credential` = `managedidentity`

    L'application dispose d'une identité affectée par le système et d'une identité affectée par l'utilisateur nommée **id-contoso-host**. L'hôte doit utiliser id-contoso-host, qui dispose des rôles requis.

    Quels sont les deux paramètres d'application que vous pouvez ajouter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "AzureWebJobsStorage__clientId = <client ID of id-contoso-host>" }
    - { id: b, text: "AzureWebJobsStorage__managedIdentityResourceId = <resource ID of id-contoso-host>" }
    - { id: c, text: "AzureWebJobsStorage__blobServiceUri = https://stcontosoingest.blob.core.windows.net" }
    - { id: d, text: "APPLICATIONINSIGHTS_AUTHENTICATION_STRING = ClientId=<client ID of id-contoso-host>;Authorization=AAD" }
    - { id: e, text: "AzureWebJobsStorage = <connection string of stcontosoingest>" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "`AzureWebJobsStorage__clientId` or `AzureWebJobsStorage__managedIdentityResourceId` selects the user-assigned identity used to obtain tokens. When neither is set, the system-assigned identity of the app is used."
    fr: "`AzureWebJobsStorage__clientId` ou `AzureWebJobsStorage__managedIdentityResourceId` sélectionne l'identité affectée par l'utilisateur utilisée pour obtenir les jetons. Quand aucun des deux n'est défini, l'identité affectée par le système de l'application est utilisée."
  options:
    c: { en: "blobServiceUri is required only for sovereign clouds or custom DNS; it doesn't select an identity.", fr: "blobServiceUri n'est requis que pour les clouds souverains ou un DNS personnalisé ; il ne sélectionne pas d'identité." }
    d: { en: "This setting configures Entra authentication to Application Insights, not to host storage.", fr: "Ce paramètre configure l'authentification Entra auprès d'Application Insights, pas auprès du stockage de l'hôte." }
    e: { en: "A connection string uses the account key instead of the identity.", fr: "Une chaîne de connexion utilise la clé du compte au lieu de l'identité." }
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
