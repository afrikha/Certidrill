id: ai200-3a-basic-tier-topic
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin built a prototype of an AI ticket triage service. The prototype uses a Service Bus namespace named **sb-tailspin-dev** in the Basic tier that contains one queue.

    You must now publish each triaged ticket to a topic named **tickets** that has three subscriptions. The command `az servicebus topic create` fails on sb-tailspin-dev. The solution must minimize cost.

    What should you do?
  fr: |
    Tailspin a créé un prototype de service de tri de tickets par IA. Le prototype utilise un espace de noms Service Bus nommé **sb-tailspin-dev** au niveau Basic qui contient une file d'attente.

    Vous devez maintenant publier chaque ticket trié dans une rubrique nommée **tickets** qui possède trois abonnements. La commande `az servicebus topic create` échoue sur sb-tailspin-dev. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the pricing tier of sb-tailspin-dev to Standard.", fr: "Passer le niveau tarifaire de sb-tailspin-dev à Standard." } }
    - { id: b, text: { en: "Change the pricing tier of sb-tailspin-dev to Premium with one messaging unit.", fr: "Passer le niveau tarifaire de sb-tailspin-dev à Premium avec une unité de messagerie." } }
    - { id: c, text: { en: "Create the topic with the --enable-partitioning parameter.", fr: "Créer la rubrique avec le paramètre --enable-partitioning." } }
    - { id: d, text: { en: "Create the topic by using ServiceBusAdministrationClient in Python.", fr: "Créer la rubrique à l'aide de ServiceBusAdministrationClient en Python." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Basic tier supports queues only. Topics and subscriptions require the Standard or Premium tier, and Standard is the cheaper of the two, with pay-as-you-go pricing.
    fr: |
      Le niveau Basic ne prend en charge que les files d'attente. Les rubriques et les abonnements exigent le niveau Standard ou Premium, et Standard est le moins cher des deux, avec une tarification à l'utilisation.
  options:
    b:
      en: |
        Premium supports topics, but its dedicated messaging units cost more than Standard, which also supports topics.
      fr: |
        Premium prend en charge les rubriques, mais ses unités de messagerie dédiées coûtent plus cher que Standard, qui prend lui aussi en charge les rubriques.
    c:
      en: |
        Partitioning spreads an entity over several message brokers; it does not add topic support to a Basic namespace.
      fr: |
        Le partitionnement répartit une entité sur plusieurs répartiteurs de messages ; il n'ajoute pas la prise en charge des rubriques à un espace de noms Basic.
    d:
      en: |
        The tier limits the namespace whatever the tool used to create the entity; the SDK call fails for the same reason.
      fr: |
        Le niveau limite l'espace de noms quel que soit l'outil utilisé pour créer l'entité ; l'appel au SDK échoue pour la même raison.
references:
  - title: Azure Service Bus Premium Messaging Features
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-premium-messaging
