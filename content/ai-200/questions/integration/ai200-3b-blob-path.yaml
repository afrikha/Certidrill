id: ai200-3b-blob-path
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation extracts clauses from signed contracts with a language model. Contracts are uploaded to the **contracts** container of a storage account. The container also receives `.json` metadata files that must not start the function.

    You are writing a blob-triggered Python function (v2 programming model). The function must run only for `.pdf` files and must receive the file name without its extension in a binding expression named `name`.

    Which path should you set in the `@app.blob_trigger` decorator?
  fr: |
    Adatum Corporation extrait des clauses de contrats signés à l'aide d'un modèle de langage. Les contrats sont chargés dans le conteneur **contracts** d'un compte de stockage. Le conteneur reçoit aussi des fichiers de métadonnées `.json` qui ne doivent pas démarrer la fonction.

    Vous écrivez une fonction Python déclenchée par blob (modèle de programmation v2). La fonction ne doit s'exécuter que pour les fichiers `.pdf` et doit recevoir le nom du fichier sans son extension dans une expression de liaison nommée `name`.

    Quel chemin devez-vous définir dans le décorateur `@app.blob_trigger` ?
body:
  options:
    - { id: a, text: "path=\"contracts/*.pdf\"" }
    - { id: b, text: "path=\"contracts/{name}\"" }
    - { id: c, text: "path=\"{container}/{name}.pdf\"" }
    - { id: d, text: "path=\"contracts/{name}.pdf\"" }
answer: { optionId: d }
explanation:
  correct:
    en: "A blob name pattern can filter on the file type: `contracts/{name}.pdf` fires only for blobs whose names end in `.pdf`, and `{name}` captures the part before the extension for use in other bindings and in code."
    fr: "Un modèle de nom d'objet blob peut filtrer sur le type de fichier : `contracts/{name}.pdf` ne se déclenche que pour les objets blob dont le nom se termine par `.pdf`, et `{name}` capture la partie située avant l'extension pour l'utiliser dans d'autres liaisons et dans le code."
  options:
    a: { en: "Blob name patterns use binding expressions in braces, not wildcards.", fr: "Les modèles de nom d'objet blob utilisent des expressions de liaison entre accolades, pas des caractères génériques." }
    b: { en: "This pattern fires for every blob, including the .json files, and name would include the extension.", fr: "Ce modèle se déclenche pour chaque objet blob, y compris les fichiers .json, et name inclurait l'extension." }
    c: { en: "A container name can't contain a resolver in the name pattern.", fr: "Un nom de conteneur ne peut pas contenir d'expression de résolution dans le modèle de nom." }
references:
  - title: Azure Blob storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-trigger
