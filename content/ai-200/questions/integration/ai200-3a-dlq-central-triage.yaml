id: ai200-3a-dlq-central-triage
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has three Service Bus queues named **ocr**, **translate** and **classify** in the same Standard namespace. Each queue is processed by its own worker.

    A single triage function must process the dead-lettered messages of all three queues by reading only from a fourth queue named **triage**. Messages that are processed successfully must never reach triage. The solution must minimize custom code.

    What should you do?
  fr: |
    Adatum dispose de trois files d'attente Service Bus nommées **ocr**, **translate** et **classify** dans le même espace de noms Standard. Chaque file d'attente est traitée par son propre worker.

    Une fonction de tri unique doit traiter les messages de lettres mortes des trois files d'attente en lisant uniquement une quatrième file d'attente nommée **triage**. Les messages traités avec succès ne doivent jamais atteindre triage. La solution doit réduire au minimum le code personnalisé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the forward-to property of ocr, translate and classify to triage.", fr: "Définir la propriété de transfert (forward-to) d'ocr, translate et classify sur triage." } }
    - { id: b, text: { en: "Set the forward-dead-lettered-messages-to property of ocr, translate and classify to triage.", fr: "Définir la propriété de transfert des messages de lettres mortes (forward-dead-lettered-messages-to) d'ocr, translate et classify sur triage." } }
    - { id: c, text: { en: "Open the receiver of the triage function on triage with sub_queue=ServiceBusSubQueue.DEAD_LETTER.", fr: "Ouvrir le récepteur de la fonction de tri sur triage avec sub_queue=ServiceBusSubQueue.DEAD_LETTER." } }
    - { id: d, text: { en: "Enable dead-lettering on message expiration on triage, and set its default message time to live to 1 minute.", fr: "Activer les lettres mortes à l'expiration des messages sur triage, et définir sa durée de vie par défaut des messages sur 1 minute." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The forward-dead-lettered-messages-to property (`--forward-dead-lettered-messages-to` in the CLI, `forward_dead_lettered_messages_to` in the SDK) automatically moves the messages that a queue dead-letters to another queue or topic of the namespace. Setting it on the three source queues gathers all their dead-lettered messages in triage with no code.
    fr: |
      La propriété de transfert des messages de lettres mortes (`--forward-dead-lettered-messages-to` dans la CLI, `forward_dead_lettered_messages_to` dans le SDK) déplace automatiquement les messages qu'une file d'attente place en lettres mortes vers une autre file d'attente ou rubrique de l'espace de noms. La définir sur les trois files sources regroupe tous leurs messages de lettres mortes dans triage, sans code.
  options:
    a:
      en: |
        Forward-to moves every message of the source queue, so triage would receive all messages and the three workers would receive none.
      fr: |
        Le transfert (forward-to) déplace tous les messages de la file source : triage recevrait tous les messages et les trois workers n'en recevraient aucun.
    c:
      en: |
        This receiver reads the dead-letter queue of triage itself, not the dead-letter queues of the three source queues.
      fr: |
        Ce récepteur lit la file d'attente de lettres mortes de triage elle-même, pas celles des trois files sources.
    d:
      en: |
        These settings act on messages already in triage; they do not bring the dead-lettered messages of the other queues into it.
      fr: |
        Ces paramètres agissent sur les messages déjà présents dans triage ; ils n'y amènent pas les messages de lettres mortes des autres files d'attente.
references:
