id: ai200-3b-binding-expr-setting
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation deploys the same Python function app to a test environment and a production environment. A function writes each generated report with a blob output binding. The container name differs per environment and is stored in an app setting named `REPORT_CONTAINER`. Each blob must get a unique name.

    Which path should you set in the `@app.blob_output` decorator?
  fr: |
    Adatum Corporation déploie la même application de fonction Python dans un environnement de test et dans un environnement de production. Une fonction écrit chaque rapport généré avec une liaison de sortie d'objet blob. Le nom du conteneur diffère selon l'environnement et est stocké dans un paramètre d'application nommé `REPORT_CONTAINER`. Chaque objet blob doit recevoir un nom unique.

    Quel chemin devez-vous définir dans le décorateur `@app.blob_output` ?
body:
  options:
    - { id: a, text: "path=\"{REPORT_CONTAINER}/{rand-guid}.json\"" }
    - { id: b, text: "path=\"$(REPORT_CONTAINER)/{rand-guid}.json\"" }
    - { id: c, text: "path=\"%REPORT_CONTAINER%/{rand-guid}.json\"" }
    - { id: d, text: "path=\"%REPORT_CONTAINER%/%rand-guid%.json\"" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Binding expressions that read app settings are wrapped in percent signs, so `%REPORT_CONTAINER%` resolves to the value of the setting. Other binding expressions use braces, and `{rand-guid}` creates a GUID for each blob. Only the connection property resolves app settings without percent signs.
    fr: |
      Les expressions de liaison qui lisent des paramètres d'application sont encadrées de signes pourcentage ; `%REPORT_CONTAINER%` se résout donc en la valeur du paramètre. Les autres expressions de liaison utilisent des accolades, et `{rand-guid}` crée un GUID pour chaque objet blob. Seule la propriété connection résout les paramètres d'application sans signes pourcentage.
  options:
    a: { en: "Braces denote trigger data or built-in expressions; an app setting needs percent signs.", fr: "Les accolades désignent des données du déclencheur ou des expressions intégrées ; un paramètre d'application exige des signes pourcentage." }
    b: { en: "$( ) is not a binding expression syntax in Azure Functions.", fr: "$( ) n'est pas une syntaxe d'expression de liaison dans Azure Functions." }
    d: { en: "rand-guid is a built-in expression in braces; with percent signs the runtime looks for an app setting named rand-guid.", fr: "rand-guid est une expression intégrée entre accolades ; avec des signes pourcentage, le runtime cherche un paramètre d'application nommé rand-guid." }
references:
  - title: Azure Functions Binding Expressions and Patterns
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-expressions-patterns
