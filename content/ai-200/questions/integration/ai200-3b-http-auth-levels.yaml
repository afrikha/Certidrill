id: ai200-3b-http-auth-levels
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam exposes several HTTP-triggered functions of its AI scoring service, written in Python with the v2 programming model. Each function sets the `auth_level` parameter of `@app.route`.

    You need to configure the authorization level of each function to meet the requirement described for it.

    Which authorization level should you use for each function? To answer, drag the appropriate values to the correct functions. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam expose plusieurs fonctions déclenchées par HTTP de son service de scoring IA, écrites en Python avec le modèle de programmation v2. Chaque fonction définit le paramètre `auth_level` de `@app.route`.

    Vous devez configurer le niveau d'autorisation de chaque fonction pour respecter l'exigence décrite.

    Quel niveau d'autorisation devez-vous utiliser pour chaque fonction ? Pour répondre, faites glisser les valeurs appropriées vers les fonctions correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: anon, text: "func.AuthLevel.ANONYMOUS" }
    - { id: func, text: "func.AuthLevel.FUNCTION" }
    - { id: admin, text: "func.AuthLevel.ADMIN" }
  targets:
    - id: health
      text: { en: "health: called by an external uptime monitor that cannot send any key", fr: "health : appelée par un outil externe de surveillance de disponibilité qui ne peut envoyer aucune clé" }
    - id: score
      text: { en: "score: called by partner applications, each with its own key for this function", fr: "score : appelée par des applications partenaires, chacune avec sa propre clé pour cette fonction" }
    - id: purge
      text: { en: "purge-cache: must accept only the master key", fr: "purge-cache : ne doit accepter que la clé principale (master key)" }
    - id: batch
      text: { en: "batch: called by an internal job that sends a host key", fr: "batch : appelée par une tâche interne qui envoie une clé d'hôte" }
answer:
  mapping: { health: anon, score: func, purge: admin, batch: func }
explanation:
  correct:
    en: |
      ANONYMOUS requires no key, so a client that cannot send one can call the function. FUNCTION requires a key, which can be any function key defined for the function or any host key, so it fits both the partner keys and the internal job's host key. ADMIN requires the master key.
    fr: |
      ANONYMOUS n'exige aucune clé ; un client qui ne peut pas en envoyer peut donc appeler la fonction. FUNCTION exige une clé, qui peut être n'importe quelle clé de fonction définie pour la fonction ou n'importe quelle clé d'hôte ; ce niveau convient donc aux clés des partenaires comme à la clé d'hôte de la tâche interne. ADMIN exige la clé principale.
  options:
    admin: { en: "ADMIN rejects function keys and host keys other than the master key.", fr: "ADMIN refuse les clés de fonction et les clés d'hôte autres que la clé principale." }
references:
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
