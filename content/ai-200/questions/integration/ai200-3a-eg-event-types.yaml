id: ai200-3a-eg-event-types
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware stores scanned invoices in a storage account named **stlitwareinv**. An event subscription on the system topic of the account triggers an Azure function that extracts the invoice fields with a document model.

    The function currently also runs when blobs are deleted, and it fails on those events. The function must run only when a new blob is created.

    What should you configure on the event subscription?
  fr: |
    Litware stocke des factures numérisées dans un compte de stockage nommé **stlitwareinv**. Un abonnement aux événements sur la rubrique système du compte déclenche une fonction Azure qui extrait les champs des factures avec un modèle de document.

    Actuellement, la fonction s'exécute aussi quand des objets blob sont supprimés, et elle échoue sur ces événements. La fonction ne doit s'exécuter que lorsqu'un nouvel objet blob est créé.

    Que devez-vous configurer sur l'abonnement aux événements ?
body:
  options:
    - { id: a, text: { en: "A subject filter that ends with BlobCreated", fr: "Un filtre d'objet (subject) qui se termine par BlobCreated" } }
    - { id: b, text: { en: "An event type filter on Microsoft.Storage.BlobCreated", fr: "Un filtre de types d'événements sur Microsoft.Storage.BlobCreated" } }
    - { id: c, text: { en: "A maximum number of delivery attempts of 1", fr: "Un nombre maximal de tentatives de remise de 1" } }
    - { id: d, text: { en: "A dead-letter destination for the failed deletion events", fr: "Une destination de lettres mortes pour les événements de suppression en échec" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default an event subscription receives all the event types of its source. The includedEventTypes filter (`--included-event-types` in the CLI) limits delivery to the listed types, so deletion events are never sent to the function.
    fr: |
      Par défaut, un abonnement aux événements reçoit tous les types d'événements de sa source. Le filtre includedEventTypes (`--included-event-types` dans la CLI) limite la remise aux types listés : les événements de suppression ne sont jamais envoyés à la fonction.
  options:
    a:
      en: |
        The subject of a blob event is the path of the blob, not the event type, so this filter would match nothing.
      fr: |
        L'objet (subject) d'un événement blob est le chemin de l'objet blob, pas le type d'événement : ce filtre ne correspondrait à rien.
    c:
      en: |
        Fewer retries only stop the failing deletion events sooner; they are still delivered once.
      fr: |
        Moins de nouvelles tentatives arrêtent seulement plus tôt les événements de suppression en échec ; ils sont quand même remis une fois.
    d:
      en: |
        A dead-letter destination keeps undeliverable events; the function would still be called for every deletion.
      fr: |
        Une destination de lettres mortes conserve les événements impossibles à remettre ; la fonction serait toujours appelée pour chaque suppression.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
