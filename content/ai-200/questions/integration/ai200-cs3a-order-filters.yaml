id: ai200-cs3a-order-filters
objective: "3.1.1"
type: yesno_statements
caseStudy: ai200-cs3a-coho-vineyard
difficulty: 2
status: draft
stem:
  en: |
    You plan to create the vip subscription on the orders topic. app-coho-pairing will set an application property named `tier` on each order message.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer l'abonnement vip sur la rubrique orders. app-coho-pairing définira une propriété d'application nommée `tier` sur chaque message de commande.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If app-coho-pairing writes `tier` only in the JSON body of the message, a SQL filter `user.tier = 'gold'` on the vip subscription selects the Gold orders."
        fr: "Si app-coho-pairing écrit `tier` uniquement dans le corps JSON du message, un filtre SQL `user.tier = 'gold'` sur l'abonnement vip sélectionne les commandes Gold."
    - id: s2
      text:
        en: "A Gold order message that matches the filter of the vip subscription is delivered to both the fulfilment and vip subscriptions."
        fr: "Un message de commande Gold qui correspond au filtre de l'abonnement vip est remis aux deux abonnements fulfilment et vip."
    - id: s3
      text:
        en: "A correlation filter on the application property `tier` with the value `gold` selects the same messages as the SQL filter `user.tier = 'gold'`."
        fr: "Un filtre de corrélation sur la propriété d'application `tier` avec la valeur `gold` sélectionne les mêmes messages que le filtre SQL `user.tier = 'gold'`."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Service Bus filters evaluate only the system and application properties of a message, never its body, so the tier must be an application property. The fulfilment subscription keeps its default rule, a true filter that selects every message, and each subscription whose rules match receives its own copy, so a Gold order reaches both. A correlation filter tests property values for equality, so it selects the same messages as the SQL equality filter and is more efficient.
    fr: |
      Les filtres Service Bus évaluent uniquement les propriétés système et d'application d'un message, jamais son corps : le niveau doit donc être une propriété d'application. L'abonnement fulfilment conserve sa règle par défaut, un filtre true qui sélectionne tous les messages, et chaque abonnement dont les règles correspondent reçoit sa propre copie : une commande Gold parvient donc aux deux. Un filtre de corrélation teste l'égalité de valeurs de propriétés : il sélectionne les mêmes messages que le filtre SQL d'égalité et il est plus efficace.
references:
  - title: Topic filters and actions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
