id: ai200-3a-eg-filter-json
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Bellows College stores lecture recordings in a storage account. An event subscription on the system topic of the account must trigger a transcription function only when an MP4 file is created in the container **lectures**. Events of other containers and of other file types must not be delivered.

    How should you complete the filter of the event subscription? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Bellows College stocke des enregistrements de cours dans un compte de stockage. Un abonnement aux événements sur la rubrique système du compte doit déclencher une fonction de transcription uniquement quand un fichier MP4 est créé dans le conteneur **lectures**. Les événements des autres conteneurs et des autres types de fichiers ne doivent pas être remis.

    Comment devez-vous compléter le filtre de l'abonnement aux événements ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "filter": {
        "[[types]]": [ "Microsoft.Storage.BlobCreated" ],
        "[[begins]]": "/blobServices/default/containers/lectures/",
        "[[ends]]": ".mp4"
      }
    }
  slots:
    - id: types
      options:
        - { id: included, text: includedEventTypes }
        - { id: eventtype, text: eventType }
        - { id: advanced, text: advancedFilters }
    - id: begins
      options:
        - { id: subjbegins, text: subjectBeginsWith }
        - { id: strbegins, text: StringBeginsWith }
        - { id: subject, text: subject }
    - id: ends
      options:
        - { id: subjends, text: subjectEndsWith }
        - { id: strends, text: StringEndsWith }
        - { id: contains, text: StringContains }
answer:
  values: { types: included, begins: subjbegins, ends: subjends }
explanation:
  correct:
    en: |
      includedEventTypes limits delivery to the listed event types. The subject of a blob event is the blob path (/blobServices/default/containers/<container>/blobs/<name>), so subjectBeginsWith selects the container and subjectEndsWith selects the file extension. The three filters are combined with AND.
    fr: |
      includedEventTypes limite la remise aux types d'événements listés. L'objet (subject) d'un événement blob est le chemin de l'objet blob (/blobServices/default/containers/<container>/blobs/<name>) : subjectBeginsWith sélectionne le conteneur et subjectEndsWith l'extension du fichier. Les trois filtres se combinent par ET.
  options:
    eventtype:
      en: |
        eventType is a property of an event in the Event Grid schema, not a filter setting.
      fr: |
        eventType est une propriété d'un événement au schéma Event Grid, pas un paramètre de filtre.
    advanced:
      en: |
        advancedFilters takes an array of operator objects, not a list of event types.
      fr: |
        advancedFilters prend un tableau d'objets opérateurs, pas une liste de types d'événements.
    strbegins:
      en: |
        StringBeginsWith is an advanced filter operator, used as an operatorType inside advancedFilters.
      fr: |
        StringBeginsWith est un opérateur de filtre avancé, utilisé comme operatorType dans advancedFilters.
    subject:
      en: |
        subject is the property of the event, not the name of a filter.
      fr: |
        subject est la propriété de l'événement, pas le nom d'un filtre.
    strends:
      en: |
        StringEndsWith is an advanced filter operator, not a key of the filter object.
      fr: |
        StringEndsWith est un opérateur de filtre avancé, pas une clé de l'objet filter.
    contains:
      en: |
        StringContains is an advanced filter operator, and it would also match .mp4 in the middle of a name.
      fr: |
        StringContains est un opérateur de filtre avancé, et il correspondrait aussi à .mp4 au milieu d'un nom.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
