id: ai200-3b-sb-settlement
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Python function app with a Service Bus queue trigger that classifies support tickets with a language model. The queue uses peek-lock mode, and host.json does not configure the Service Bus extension.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une application de fonction Python avec un déclencheur de file d'attente Service Bus qui classe des tickets de support à l'aide d'un modèle de langage. La file d'attente utilise le mode peek-lock, et host.json ne configure pas l'extension Service Bus.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the function raises an unhandled exception, the runtime abandons the message so that it can be received again.
        fr: |
          Quand la fonction lève une exception non gérée, le runtime abandonne le message pour qu'il puisse être reçu à nouveau.
    - id: s2
      text:
        en: |
          The clientRetryOptions section of host.json sets how many times a failed function execution is retried.
        fr: |
          La section clientRetryOptions de host.json définit combien de fois une exécution de fonction en échec est retentée.
    - id: s3
      text:
        en: |
          A message that keeps failing is handled as a poison message by Service Bus itself, not by a setting of the Functions runtime.
        fr: |
          Un message qui échoue à répétition est traité comme message incohérent (poison) par Service Bus lui-même, et non par un paramètre du runtime Functions.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In peek-lock mode, the runtime completes the message when the function succeeds and abandons it when the function fails. clientRetryOptions only apply to the extension's interactions with the Service Bus service, not to retries of function executions. Poison message handling can't be configured in Azure Functions - Service Bus handles it, by moving the message to the dead-letter queue when the maximum delivery count is reached.
    fr: "En mode peek-lock, le runtime termine (complete) le message quand la fonction réussit et l'abandonne quand elle échoue. clientRetryOptions ne s'applique qu'aux échanges de l'extension avec le service Service Bus, pas aux nouvelles tentatives d'exécution de la fonction. La gestion des messages incohérents ne se configure pas dans Azure Functions : Service Bus s'en charge, en déplaçant le message vers la file d'attente de lettres mortes quand le nombre maximal de remises est atteint."
references:
  - title: Azure Service Bus trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus-trigger
  - title: Azure Service Bus bindings for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus
