id: ai200-3b-flex-scale-config
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys hosts a chat assistant in a Python function app named **func-chat** on the Flex Consumption plan. The app contains several HTTP functions and one Service Bus triggered function. You need to configure the app to meet the following requirements:

    - Two instances must always be ready to serve the HTTP functions.
    - Each instance must process at most 10 HTTP requests at the same time.

    How should you complete the commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys héberge un assistant conversationnel dans une application de fonction Python nommée **func-chat** sur le plan Flex Consumption. L'application contient plusieurs fonctions HTTP et une fonction déclenchée par Service Bus. Vous devez configurer l'application pour respecter les exigences suivantes :

    - Deux instances doivent toujours être prêtes à servir les fonctions HTTP.
    - Chaque instance doit traiter au plus 10 requêtes HTTP en même temps.

    Comment devez-vous compléter les commandes ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az functionapp scale config always-ready set --resource-group rg-chat \
      --name func-chat --settings [[group]]=2

    az functionapp scale config set --resource-group rg-chat --name func-chat \
      --trigger-type http --trigger-settings [[setting]]=10
  slots:
    - id: group
      options:
        - { id: http, text: "http" }
        - { id: fn, text: "function:chat" }
        - { id: durable, text: "durable" }
    - id: setting
      options:
        - { id: pic, text: "perInstanceConcurrency" }
        - { id: mcr, text: "maxConcurrentRequests" }
        - { id: mcc, text: "maxConcurrentCalls" }
answer:
  values: { group: http, setting: pic }
explanation:
  correct:
    en: "On Flex Consumption, all HTTP functions scale together in the `http` group, so always-ready instances for them are set with `http=2`. The HTTP concurrency of each instance is set with `--trigger-type http --trigger-settings perInstanceConcurrency=10`."
    fr: "En Flex Consumption, toutes les fonctions HTTP se mettent à l'échelle ensemble dans le groupe `http` : les instances toujours prêtes se définissent donc avec `http=2`. La concurrence HTTP de chaque instance se définit avec `--trigger-type http --trigger-settings perInstanceConcurrency=10`."
  options:
    fn: { en: "function:<name> targets a function that scales on its own; HTTP functions share the http group.", fr: "function:<nom> cible une fonction qui se met à l'échelle seule ; les fonctions HTTP partagent le groupe http." }
    durable: { en: "The durable group contains Durable Functions orchestration, activity and entity triggers.", fr: "Le groupe durable contient les déclencheurs d'orchestration, d'activité et d'entité de Durable Functions." }
    mcr: { en: "maxConcurrentRequests is a host.json HTTP setting, not a Flex Consumption trigger setting.", fr: "maxConcurrentRequests est un paramètre HTTP de host.json, pas un paramètre de déclencheur Flex Consumption." }
    mcc: { en: "maxConcurrentCalls is a Service Bus extension setting in host.json.", fr: "maxConcurrentCalls est un paramètre de l'extension Service Bus dans host.json." }
references:
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
