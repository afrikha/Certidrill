id: ai200-3a-receiver-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation is tuning the receivers of its document-classification workers, which read from Service Bus by using the azure-servicebus Python library. Some workers read a plain queue named **classify**, and others read a session-enabled queue named **classify-ordered**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation optimise les récepteurs de ses workers de classification de documents, qui lisent Service Bus à l'aide de la bibliothèque Python azure-servicebus. Certains workers lisent une file d'attente simple nommée **classify**, et d'autres une file d'attente avec sessions activées nommée **classify-ordered**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If a receiver on classify uses RECEIVE_AND_DELETE with prefetch_count set to 50, the prefetched messages that the worker hasn't received yet are lost when the worker exits.
        fr: |
          Si un récepteur sur classify utilise RECEIVE_AND_DELETE avec prefetch_count défini sur 50, les messages prérécupérés que le worker n'a pas encore reçus sont perdus quand le worker s'arrête.
    - id: s2
      text:
        en: |
          Messages returned by peek_messages on classify are locked for the receiver until they are completed.
        fr: |
          Les messages renvoyés par peek_messages sur classify sont verrouillés pour le récepteur jusqu'à ce qu'ils soient terminés.
    - id: s3
      text:
        en: |
          A worker on classify-ordered extends the lock of a long-running message by calling renew_message_lock on that message.
        fr: |
          Un worker sur classify-ordered prolonge le verrou d'un message au traitement long en appelant renew_message_lock sur ce message.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      In receive-and-delete mode, prefetched messages are already removed from the queue and only held in memory, so they are lost if the app exits; the documentation recommends peek-lock when you prefetch. Peeked messages are neither removed nor locked and can't be settled. For a session-enabled entity the lock belongs to the session, so renew_message_lock raises an error on a sessionful message; the worker renews the session lock (session.renew_lock or an AutoLockRenewer registered on the session).
    fr: |
      En mode receive-and-delete, les messages prérécupérés sont déjà retirés de la file d'attente et seulement conservés en mémoire : ils sont perdus si l'application s'arrête ; la documentation recommande peek-lock quand vous utilisez la prérécupération. Les messages lus par peek ne sont ni supprimés ni verrouillés et ne peuvent pas être réglés. Pour une entité avec sessions activées, le verrou appartient à la session : renew_message_lock lève une erreur sur un message de session ; le worker renouvelle le verrou de session (session.renew_lock ou un AutoLockRenewer inscrit sur la session).
references:
  - title: azure.servicebus.ServiceBusReceiver class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.servicebusreceiver
  - title: azure.servicebus.ServiceBusSession class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.servicebussession
