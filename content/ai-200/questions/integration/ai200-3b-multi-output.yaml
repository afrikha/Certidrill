id: ai200-3b-multi-output
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is writing a Python function (v2 programming model) that receives a loan application over HTTP, runs a risk analysis with a language model, and returns the JSON report to the caller.

    Each report must also be saved as a new blob in the **analyses** container, without writing Blob Storage SDK code.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank écrit une fonction Python (modèle de programmation v2) qui reçoit une demande de prêt par HTTP, exécute une analyse de risque avec un modèle de langage et renvoie le rapport JSON à l'appelant.

    Chaque rapport doit aussi être enregistré comme nouvel objet blob dans le conteneur **analyses**, sans écrire de code du SDK Stockage Blob.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.route(route="analyze", methods=["POST"])
    @app.[[dec]](arg_name="report", path="analyses/{rand-guid}.json",
                 connection="StorageConnection")
    def analyze(req: func.HttpRequest, report: [[outtype]]) -> func.HttpResponse:
        result = run_risk_analysis(req.get_body().decode("utf-8"))
        report.[[call]](result)
        return func.HttpResponse(result, status_code=200, mimetype="application/json")
  slots:
    - id: dec
      options:
        - { id: output, text: "blob_output" }
        - { id: input, text: "blob_input" }
        - { id: trigger, text: "blob_trigger" }
    - id: outtype
      options:
        - { id: out, text: "func.Out[str]" }
        - { id: str, text: "str" }
        - { id: stream, text: "func.InputStream" }
    - id: call
      options:
        - { id: set, text: "set" }
        - { id: write, text: "write" }
        - { id: append, text: "append" }
answer:
  values: { dec: output, outtype: out, call: set }
explanation:
  correct:
    en: |
      The HTTP response is the function's return value, so the second output needs a `func.Out[T]` parameter bound by `@app.blob_output` and written with `.set()`. The `{rand-guid}` binding expression gives each blob a unique name.
    fr: |
      La réponse HTTP est la valeur de retour de la fonction ; la seconde sortie a donc besoin d'un paramètre `func.Out[T]` lié par `@app.blob_output` et écrit avec `.set()`. L'expression de liaison `{rand-guid}` donne un nom unique à chaque objet blob.
  options:
    input: { en: "blob_input reads an existing blob; it does not write one.", fr: "blob_input lit un objet blob existant ; il n'en écrit pas." }
    trigger: { en: "The function already has an HTTP trigger, and a function has only one trigger.", fr: "La fonction a déjà un déclencheur HTTP, et une fonction n'a qu'un seul déclencheur." }
    str: { en: "A plain str parameter is an input value; outputs other than the return value use func.Out.", fr: "Un simple paramètre str est une valeur d'entrée ; les sorties autres que la valeur de retour utilisent func.Out." }
    stream: { en: "func.InputStream represents a blob that the function reads.", fr: "func.InputStream représente un objet blob que la fonction lit." }
    write: { en: "func.Out exposes set(), not write().", fr: "func.Out expose set(), pas write()." }
    append: { en: "func.Out exposes set(), not append().", fr: "func.Out expose set(), pas append()." }
references:
  - title: Azure Blob storage output binding for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-output
  - title: Azure Functions Binding Expressions and Patterns
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-expressions-patterns
