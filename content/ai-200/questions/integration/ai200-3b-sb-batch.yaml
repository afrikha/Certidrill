id: ai200-3b-sb-batch
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso generates embeddings for product descriptions. A Python function (v2 programming model) reads jobs from a Service Bus queue named **embed-jobs**. To reduce the number of calls to the embedding model, each invocation must receive several messages and send their texts in one request.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso génère des incorporations pour des descriptions de produits. Une fonction Python (modèle de programmation v2) lit des tâches dans une file d'attente Service Bus nommée **embed-jobs**. Pour réduire le nombre d'appels au modèle d'incorporation, chaque appel de la fonction doit recevoir plusieurs messages et envoyer leurs textes en une seule requête.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import typing
    import azure.functions as func

    app = func.FunctionApp()

    @app.service_bus_queue_trigger(arg_name="msgs", queue_name="embed-jobs",
                                   connection="ServiceBusConnection",
                                   [[card]])
    def embed_batch(msgs: [[mtype]]) -> None:
        texts = [m.get_body().decode("utf-8") for m in msgs]
        store_embeddings(embed(texts))
  slots:
    - id: card
      options:
        - { id: many, text: "cardinality=func.Cardinality.MANY" }
        - { id: one, text: "cardinality=func.Cardinality.ONE" }
        - { id: sessions, text: "is_sessions_enabled=True" }
    - id: mtype
      options:
        - { id: list, text: "typing.List[func.ServiceBusMessage]" }
        - { id: single, text: "func.ServiceBusMessage" }
        - { id: doclist, text: "func.DocumentList" }
answer:
  values: { card: many, mtype: list }
explanation:
  correct:
    en: |
      Setting `cardinality` to `func.Cardinality.MANY` enables batching, so the function receives a list of `func.ServiceBusMessage` objects. When the parameter is omitted or set to ONE, a single message is passed to each invocation.
    fr: |
      Définir `cardinality` sur `func.Cardinality.MANY` active le traitement par lots ; la fonction reçoit alors une liste d'objets `func.ServiceBusMessage`. Quand le paramètre est omis ou défini sur ONE, un seul message est transmis à chaque appel.
  options:
    one: { en: "ONE is the default and passes one message per invocation.", fr: "ONE est la valeur par défaut et transmet un message par appel." }
    sessions: { en: "Sessions guarantee ordered processing of related messages; they do not deliver batches.", fr: "Les sessions garantissent le traitement ordonné de messages liés ; elles ne livrent pas de lots." }
    single: { en: "With batching enabled, the parameter receives a list, not one message.", fr: "Avec le traitement par lots, le paramètre reçoit une liste, pas un seul message." }
    doclist: { en: "func.DocumentList is the type used by Cosmos DB bindings.", fr: "func.DocumentList est le type utilisé par les liaisons Cosmos DB." }
references:
  - title: Azure Service Bus trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus-trigger
