id: ai200-3b-plan-choice
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is choosing hosting options for four new Python function apps. Each app has the requirements described for it.

    Which hosting option should you use for each app? To answer, drag the appropriate hosting options to the correct apps. Each hosting option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware choisit les options d'hébergement de quatre nouvelles applications de fonction Python. Chaque application a les exigences décrites.

    Quelle option d'hébergement devez-vous utiliser pour chaque application ? Pour répondre, faites glisser les options d'hébergement appropriées vers les applications correspondantes. Chaque option d'hébergement peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: flex, text: "Flex Consumption" }
    - { id: premium, text: "Premium" }
    - { id: dedicated, text: { en: "Dedicated (App Service plan)", fr: "Dedicated (plan App Service)" } }
    - { id: aca, text: "Azure Container Apps" }
    - { id: consumption, text: { en: "Consumption (legacy)", fr: "Consumption (hérité)" } }
  targets:
    - id: app1
      text: { en: "App1: code deployment, scale to zero when idle, inbound private endpoint, per-function scaling", fr: "App1 : déploiement de code, mise à l'échelle jusqu'à zéro en cas d'inactivité, point de terminaison privé entrant, mise à l'échelle par fonction" } 
    - id: app2
      text: { en: "App2: custom Linux container image, perpetually warm instances, event-driven scale-out, deployment slots", fr: "App2 : image conteneur Linux personnalisée, instances toujours à chaud, montée en charge pilotée par les événements, emplacements de déploiement" }
    - id: app3
      text: { en: "App3: container image deployed next to other microservices in the same environment, versions managed as revisions", fr: "App3 : image conteneur déployée à côté d'autres microservices dans le même environnement, versions gérées sous forme de révisions" }
    - id: app4
      text: { en: "App4: runs on the spare capacity of an existing App Service plan that hosts web apps", fr: "App4 : s'exécute sur la capacité disponible d'un plan App Service existant qui héberge des applications web" }
answer:
  mapping: { app1: flex, app2: premium, app3: aca, app4: dedicated }
explanation:
  correct:
    en: |
      Flex Consumption scales to zero, scales functions individually or by group, and supports inbound private endpoints, but not containers. Premium keeps at least one instance warm, supports Linux containers and three slots. Container Apps hosts functions as containers in an environment shared with other microservices and uses revisions instead of slots. A Dedicated plan reuses the capacity of an existing App Service plan. The legacy Consumption plan has no private endpoints.
    fr: |
      Flex Consumption se met à l'échelle jusqu'à zéro, met à l'échelle les fonctions individuellement ou par groupe et prend en charge les points de terminaison privés entrants, mais pas les conteneurs. Premium garde au moins une instance à chaud, prend en charge les conteneurs Linux et trois emplacements. Container Apps héberge les fonctions sous forme de conteneurs dans un environnement partagé avec d'autres microservices et utilise des révisions au lieu des emplacements. Un plan Dedicated réutilise la capacité d'un plan App Service existant. Le plan Consumption hérité n'a pas de points de terminaison privés.
references:
  - title: Azure Functions Scale and Hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Azure Functions deployment slots
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-slots
