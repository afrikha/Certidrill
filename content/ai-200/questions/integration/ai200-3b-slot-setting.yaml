id: ai200-3b-slot-setting
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation hosts a Python function app named **func-adatum-qa** on a Premium plan with a slot named **staging**. In staging, the app setting `OPENAI_DEPLOYMENT` must be `gpt-qa-staging`. When staging is swapped into production, this value must stay with the staging slot.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation héberge une application de fonction Python nommée **func-adatum-qa** sur un plan Premium avec un emplacement nommé **staging**. Dans staging, le paramètre d'application `OPENAI_DEPLOYMENT` doit valoir `gpt-qa-staging`. Quand staging est permuté avec la production, cette valeur doit rester attachée à l'emplacement staging.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az functionapp config appsettings set --resource-group rg-adatum \
      --name func-adatum-qa --slot [[slot]] \
      --[[flag]] OPENAI_DEPLOYMENT=gpt-qa-staging
  slots:
    - id: slot
      options:
        - { id: staging, text: "staging" }
        - { id: production, text: "production" }
        - { id: both, text: "staging production" }
    - id: flag
      options:
        - { id: slotsettings, text: "slot-settings" }
        - { id: settings, text: "settings" }
        - { id: names, text: "setting-names" }
answer:
  values: { slot: staging, flag: slotsettings }
explanation:
  correct:
    en: "`--slot staging` targets the staging slot, and `--slot-settings` adds the setting and marks it as a deployment slot setting, so it isn't swapped. App settings added with `--settings` move with the code during a swap."
    fr: "`--slot staging` cible l'emplacement staging, et `--slot-settings` ajoute le paramètre et le marque comme paramètre d'emplacement de déploiement : il n'est donc pas permuté. Les paramètres ajoutés avec `--settings` suivent le code lors d'une permutation."
  options:
    production: { en: "The value is for the staging slot.", fr: "La valeur concerne l'emplacement staging." }
    both: { en: "--slot takes a single slot name.", fr: "--slot prend un seul nom d'emplacement." }
    settings: { en: "A regular app setting is swapped along with the slot content.", fr: "Un paramètre d'application ordinaire est permuté avec le contenu de l'emplacement." }
    names: { en: "--setting-names is a parameter of the delete command.", fr: "--setting-names est un paramètre de la commande delete." }
references:
  - title: az functionapp config appsettings
    url: https://learn.microsoft.com/en-us/cli/azure/functionapp/config/appsettings
  - title: Azure Functions deployment slots
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-slots
