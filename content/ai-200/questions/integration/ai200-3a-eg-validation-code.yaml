id: ai200-3a-eg-validation-code
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Margie's Travel hosts a Python web API on Azure Container Apps that receives "booking anomaly" events from an Event Grid custom topic that uses the Event Grid schema. The API isn't an Azure function. When you create the webhook event subscription, the creation fails because the endpoint isn't validated.

    The API must complete the validation synchronously when Event Grid creates the subscription, and then process the other events.

    How should you complete the handler? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Margie's Travel héberge sur Azure Container Apps une API web Python qui reçoit des événements « anomalie de réservation » d'une rubrique personnalisée Event Grid au schéma Event Grid. L'API n'est pas une fonction Azure. Lors de la création de l'abonnement aux événements webhook, la création échoue parce que le point de terminaison n'est pas validé.

    L'API doit terminer la validation de façon synchrone quand Event Grid crée l'abonnement, puis traiter les autres événements.

    Comment devez-vous compléter le gestionnaire ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.post("/api/events")
    def receive_events():
        for event in request.get_json():
            if event["eventType"] == "[[etype]]":
                code = event["data"]["[[field]]"]
                return jsonify({"[[resp]]": code}), [[status]]
            handle_anomaly(event["data"])
        return "", 200
  slots:
    - id: etype
      options:
        - { id: validation, text: Microsoft.EventGrid.SubscriptionValidationEvent }
        - { id: deleted, text: Microsoft.EventGrid.SubscriptionDeletedEvent }
        - { id: header, text: SubscriptionValidation }
    - id: field
      options:
        - { id: vcode, text: validationCode }
        - { id: vurl, text: validationUrl }
        - { id: id, text: id }
    - id: resp
      options:
        - { id: vresp, text: validationResponse }
        - { id: vcode2, text: validationCode }
        - { id: vurl2, text: validationUrl }
    - id: status
      options:
        - { id: s200, text: "200" }
        - { id: s202, text: "202" }
        - { id: s204, text: "204" }
answer:
  values: { etype: validation, field: vcode, resp: vresp, status: s200 }
explanation:
  correct:
    en: |
      When a webhook subscription is created, Event Grid sends an event of type Microsoft.EventGrid.SubscriptionValidationEvent whose data contains a validationCode. The endpoint proves that it owns the URL by echoing the code in a validationResponse property, with HTTP 200 OK, within 30 seconds.
    fr: |
      À la création d'un abonnement webhook, Event Grid envoie un événement de type Microsoft.EventGrid.SubscriptionValidationEvent dont les données contiennent un validationCode. Le point de terminaison prouve qu'il possède l'URL en renvoyant ce code dans une propriété validationResponse, avec HTTP 200 OK, dans les 30 secondes.
  options:
    deleted:
      en: |
        This event type isn't the one sent for the validation handshake.
      fr: |
        Ce type d'événement n'est pas celui envoyé pour la négociation de validation.
    header:
      en: |
        SubscriptionValidation is the value of the aeg-event-type HTTP header, not the eventType of the event.
      fr: |
        SubscriptionValidation est la valeur de l'en-tête HTTP aeg-event-type, pas l'eventType de l'événement.
    vurl:
      en: |
        validationUrl is used for the asynchronous handshake, by sending a GET request to it within 10 minutes; it isn't echoed back.
      fr: |
        validationUrl sert à la négociation asynchrone, par une requête GET dans les 10 minutes ; on ne la renvoie pas.
    id:
      en: |
        The event ID identifies the validation event; Event Grid expects the validation code.
      fr: |
        L'ID de l'événement identifie l'événement de validation ; Event Grid attend le code de validation.
    vcode2:
      en: |
        The response property is validationResponse; validationCode is the name of the field in the request.
      fr: |
        La propriété de réponse est validationResponse ; validationCode est le nom du champ de la requête.
    vurl2:
      en: |
        validationUrl is a field of the validation event that Event Grid sends, not the property it expects in the response.
      fr: |
        validationUrl est un champ de l'événement de validation envoyé par Event Grid, pas la propriété attendue dans la réponse.
    s202:
      en: |
        202 Accepted isn't recognized as a valid response to the validation handshake.
      fr: |
        202 Accepted n'est pas reconnu comme réponse valide à la négociation de validation.
    s204:
      en: |
        A 204 response has no body, so the validation code can't be returned.
      fr: |
        Une réponse 204 n'a pas de corps : le code de validation ne peut pas être renvoyé.
references:
  - title: Validate Webhook Endpoints with Event Grid Schema
    url: https://learn.microsoft.com/en-us/azure/event-grid/end-point-validation-event-grid-events-schema
