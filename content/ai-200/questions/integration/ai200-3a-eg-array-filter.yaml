id: ai200-3a-eg-array-filter
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Lamna Healthcare publishes "image analyzed" events to an Event Grid custom topic. The data of each event contains an array of strings named `findings`, for example `"findings": ["fracture", "edema"]`.

    An event subscription has the advanced filter `{"operatorType": "StringIn", "key": "data.findings", "values": ["fracture"]}`, but it delivers no event to the radiology alert function, even for events whose findings contain `fracture`.

    What should you do?
  fr: |
    Lamna Healthcare publie des événements « image analysée » dans une rubrique personnalisée Event Grid. Les données de chaque événement contiennent un tableau de chaînes nommé `findings`, par exemple `"findings": ["fracture", "edema"]`.

    Un abonnement aux événements possède le filtre avancé `{"operatorType": "StringIn", "key": "data.findings", "values": ["fracture"]}`, mais il ne remet aucun événement à la fonction d'alerte de radiologie, même pour les événements dont findings contient `fracture`.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set enableAdvancedFilteringOnArrays to true on the event subscription.", fr: "Définir enableAdvancedFilteringOnArrays sur true sur l'abonnement aux événements." } }
    - { id: b, text: { en: "Change the key of the filter to data.findings[0].", fr: "Remplacer la clé du filtre par data.findings[0]." } }
    - { id: c, text: { en: "Change the operator of the filter to StringContains.", fr: "Remplacer l'opérateur du filtre par StringContains." } }
    - { id: d, text: { en: "Set the subject case-sensitive option on the event subscription.", fr: "Définir l'option de respect de la casse de l'objet sur l'abonnement aux événements." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Advanced filters evaluate array keys only when enableAdvancedFilteringOnArrays is true (`--enable-advanced-filtering-on-arrays` in the CLI). Each element of the array is then compared with the filter values, so an event whose findings include fracture matches StringIn.
    fr: |
      Les filtres avancés n'évaluent les clés de type tableau que si enableAdvancedFilteringOnArrays vaut true (`--enable-advanced-filtering-on-arrays` dans la CLI). Chaque élément du tableau est alors comparé aux valeurs du filtre : un événement dont findings contient fracture correspond à StringIn.
  options:
    b:
      en: |
        Keys use dot notation into the data, with no documented index syntax, and the first element wouldn't always be the finding you look for.
      fr: |
        Les clés utilisent la notation pointée dans les données, sans syntaxe d'index documentée, et le premier élément ne serait pas toujours le résultat recherché.
    c:
      en: |
        Any operator fails on an array key until filtering on arrays is enabled.
      fr: |
        Tout opérateur échoue sur une clé de type tableau tant que le filtrage sur les tableaux n'est pas activé.
    d:
      en: |
        The case-sensitive option applies to subject filters only, and advanced filter string comparisons aren't case-sensitive anyway.
      fr: |
        L'option de respect de la casse ne s'applique qu'aux filtres d'objet, et les comparaisons de chaînes des filtres avancés ne respectent de toute façon pas la casse.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
