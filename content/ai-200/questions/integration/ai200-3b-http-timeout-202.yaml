id: ai200-3b-http-timeout-202
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a Python function app on the Flex Consumption plan. An HTTP-triggered function named **summarize** sends long contracts to an Azure OpenAI model and returns the summary in the HTTP response. Summarizing a large contract takes up to six minutes.

    Clients report HTTP 502 errors for large contracts, although the function logs show that the summaries finish. `host.json` does not set `functionTimeout`.

    You need to ensure that clients can obtain the summaries of large contracts.

    What should you do?
  fr: |
    Northwind Traders exécute une application de fonction Python sur le plan Flex Consumption. Une fonction déclenchée par HTTP nommée **summarize** envoie de longs contrats à un modèle Azure OpenAI et renvoie le résumé dans la réponse HTTP. Le résumé d'un gros contrat prend jusqu'à six minutes.

    Les clients signalent des erreurs HTTP 502 pour les gros contrats, alors que les journaux de la fonction montrent que les résumés se terminent. `host.json` ne définit pas `functionTimeout`.

    Vous devez faire en sorte que les clients puissent obtenir les résumés des gros contrats.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set functionTimeout to 00:15:00 in host.json.", fr: "Définir functionTimeout sur 00:15:00 dans host.json." } }
    - { id: b, text: { en: "Change the instance memory size of the app to 4,096 MB.", fr: "Passer la taille de mémoire d'instance de l'application à 4 096 Mo." } }
    - { id: c, text: { en: "Queue the job, return HTTP 202, and process the job in a queue-triggered function.", fr: "Mettre la tâche en file d'attente, renvoyer HTTP 202 et la traiter dans une fonction déclenchée par file d'attente." } }
    - { id: d, text: { en: "Redeploy the app to a Premium plan with one always-ready instance.", fr: "Redéployer l'application sur un plan Premium avec une instance toujours prête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An HTTP-triggered function that does not respond within 230 seconds gets an HTTP 502 from the Azure load balancer, while the function keeps running. This limit applies on every plan, so long work must be made asynchronous - accept the request, queue the job, return 202, and let a queue-triggered function produce the summary.
    fr: "Une fonction déclenchée par HTTP qui ne répond pas en 230 secondes reçoit une erreur HTTP 502 de l'équilibreur de charge Azure, alors que la fonction continue de s'exécuter. Cette limite s'applique à tous les plans : le travail long doit devenir asynchrone (accepter la requête, mettre la tâche en file d'attente, renvoyer 202 et laisser une fonction déclenchée par file d'attente produire le résumé)."
  options:
    a: { en: "The execution timeout already defaults to 30 minutes on Flex Consumption; the 230-second HTTP response limit is separate and cannot be raised.", fr: "Le délai d'exécution est déjà de 30 minutes par défaut en Flex Consumption ; la limite de 230 secondes de la réponse HTTP est distincte et ne peut pas être augmentée." }
    b: { en: "More memory does not change the 230-second limit of the load balancer.", fr: "Plus de mémoire ne change pas la limite de 230 secondes de l'équilibreur de charge." }
    d: { en: "The 230-second HTTP limit applies to the Premium plan as well; always-ready instances only remove cold starts.", fr: "La limite HTTP de 230 secondes s'applique aussi au plan Premium ; les instances toujours prêtes ne font que supprimer les démarrages à froid." }
references:
