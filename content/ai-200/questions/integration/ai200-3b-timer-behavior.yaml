id: ai200-3b-timer-behavior
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a Python function app on the Flex Consumption plan. A timer-triggered function refreshes cached model answers every 10 minutes with the schedule `0 */10 * * * *`. During peak hours, the HTTP functions of the app scale out to several instances.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute une application de fonction Python sur le plan Flex Consumption. Une fonction déclenchée par minuteur actualise des réponses de modèle mises en cache toutes les 10 minutes avec la planification `0 */10 * * * *`. Aux heures de pointe, les fonctions HTTP de l'application montent en charge sur plusieurs instances.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the app runs on several instances, each instance runs the timer function every 10 minutes.
        fr: |
          Quand l'application s'exécute sur plusieurs instances, chaque instance exécute la fonction de minuteur toutes les 10 minutes.
    - id: s2
      text:
        en: |
          The past_due property of the timer object is true when an invocation runs later than scheduled, for example after a restart.
        fr: |
          La propriété past_due de l'objet minuteur vaut true quand un appel s'exécute plus tard que prévu, par exemple après un redémarrage.
    - id: s3
      text:
        en: |
          You can add the WEBSITE_TIME_ZONE app setting to this app so that the schedule follows a local time zone.
        fr: |
          Vous pouvez ajouter le paramètre d'application WEBSITE_TIME_ZONE à cette application pour que la planification suive un fuseau horaire local.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      When an app scales out, only a single instance of a timer-triggered function runs across all instances, thanks to a storage lock. past_due is true when the invocation is later than scheduled. WEBSITE_TIME_ZONE and TZ aren't currently supported on Linux in a Flex Consumption or Consumption plan, so the schedule stays in UTC.
    fr: |
      Quand une application monte en charge, une seule instance d'une fonction déclenchée par minuteur s'exécute sur l'ensemble des instances, grâce à un verrou de stockage. past_due vaut true quand l'appel est plus tardif que prévu. WEBSITE_TIME_ZONE et TZ ne sont pas pris en charge actuellement sous Linux dans un plan Flex Consumption ou Consumption ; la planification reste donc en UTC.
references:
  - title: Timer trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-timer
