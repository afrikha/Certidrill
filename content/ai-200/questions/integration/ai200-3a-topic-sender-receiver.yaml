id: ai200-3a-topic-sender-receiver
objective: "3.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Munson's Pickles runs a quality-inspection model on its production line. The model service publishes each result to a Service Bus topic named **inspections**, and a dashboard reads the results from a subscription named **dashboard** of that topic.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Munson's Pickles exécute un modèle d'inspection qualité sur sa ligne de production. Le service du modèle publie chaque résultat dans une rubrique Service Bus nommée **inspections**, et un tableau de bord lit les résultats dans un abonnement nommé **dashboard** de cette rubrique.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    client = ServiceBusClient("sb-munson.servicebus.windows.net", DefaultAzureCredential())

    # Model service
    with client.[[send]](topic_name="inspections") as sender:
        sender.send_messages(ServiceBusMessage(result_json, subject="inspection"))

    # Dashboard
    with client.[[recv]](topic_name="inspections", [[name]]="dashboard") as receiver:
        for msg in receiver.receive_messages(max_message_count=20, max_wait_time=5):
            show(str(msg))
            receiver.complete_message(msg)
  slots:
    - id: send
      options:
        - { id: topicsender, text: get_topic_sender }
        - { id: queuesender, text: get_queue_sender }
        - { id: subreceiver1, text: get_subscription_receiver }
    - id: recv
      options:
        - { id: subreceiver, text: get_subscription_receiver }
        - { id: queuereceiver, text: get_queue_receiver }
        - { id: topicsender2, text: get_topic_sender }
    - id: name
      options:
        - { id: subname, text: subscription_name }
        - { id: queuename, text: queue_name }
        - { id: sessionid, text: session_id }
answer:
  values: { send: topicsender, recv: subreceiver, name: subname }
explanation:
  correct:
    en: |
      Messages are sent to the topic with a sender from get_topic_sender(topic_name=...). A subscription is read like a queue, with a receiver from get_subscription_receiver, which takes the topic name and the subscription_name.
    fr: |
      Les messages sont envoyés à la rubrique avec un expéditeur obtenu par get_topic_sender(topic_name=...). Un abonnement se lit comme une file d'attente, avec un récepteur obtenu par get_subscription_receiver, qui prend le nom de la rubrique et subscription_name.
  options:
    queuesender:
      en: |
        get_queue_sender takes a queue_name; inspections is a topic.
      fr: |
        get_queue_sender prend un queue_name ; inspections est une rubrique.
    subreceiver1:
      en: |
        A receiver can't send messages.
      fr: |
        Un récepteur ne peut pas envoyer de messages.
    queuereceiver:
      en: |
        get_queue_receiver reads a queue and takes no topic or subscription name.
      fr: |
        get_queue_receiver lit une file d'attente et ne prend ni nom de rubrique ni nom d'abonnement.
    topicsender2:
      en: |
        A sender can't receive messages from a subscription.
      fr: |
        Un expéditeur ne peut pas recevoir de messages d'un abonnement.
    queuename:
      en: |
        The subscription receiver identifies the subscription with subscription_name, not queue_name.
      fr: |
        Le récepteur d'abonnement désigne l'abonnement avec subscription_name, pas queue_name.
    sessionid:
      en: |
        session_id selects a session of a session-enabled entity; it doesn't name the subscription.
      fr: |
        session_id sélectionne une session d'une entité avec sessions activées ; il ne désigne pas l'abonnement.
references:
  - title: azure.servicebus.ServiceBusClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-servicebus/azure.servicebus.servicebusclient
  - title: Get started with Azure Service Bus topics (Python)
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-python-how-to-use-topics-subscriptions
