id: ai200-3b-flex-limits
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to host a new Python function app named **func-lit-summarize** on the Flex Consumption plan. The app will have two always-ready instances for its HTTP functions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'héberger une nouvelle application de fonction Python nommée **func-lit-summarize** sur le plan Flex Consumption. L'application aura deux instances toujours prêtes pour ses fonctions HTTP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can add a staging deployment slot to func-lit-summarize and swap it into production.
        fr: |
          Vous pouvez ajouter un emplacement de déploiement de préproduction à func-lit-summarize et le permuter avec la production.
    - id: s2
      text:
        en: |
          The Flex Consumption plan of func-lit-summarize can host only this one function app.
        fr: |
          Le plan Flex Consumption de func-lit-summarize ne peut héberger que cette seule application de fonction.
    - id: s3
      text:
        en: |
          The two always-ready instances are billed even during periods when no function runs.
        fr: |
          Les deux instances toujours prêtes sont facturées même pendant les périodes où aucune fonction ne s'exécute.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Deployment slots aren't currently supported on Flex Consumption; zero-downtime deployments use site update strategies instead. A Flex Consumption plan holds only one app. Always-ready instances are billed for their provisioned memory (the baseline) whether or not functions run, with no free grant.
    fr: |
      Les emplacements de déploiement ne sont pas pris en charge actuellement en Flex Consumption ; les déploiements sans interruption passent par des stratégies de mise à jour du site. Un plan Flex Consumption ne contient qu'une application. Les instances toujours prêtes sont facturées pour leur mémoire provisionnée (la base de référence), que des fonctions s'exécutent ou non, sans octroi gratuit.
references:
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
