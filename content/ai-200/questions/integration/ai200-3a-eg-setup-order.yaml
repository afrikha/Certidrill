id: ai200-3a-eg-setup-order
objective: "3.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind is adding "menu translated" notifications to its AI translation service. The Python service will publish CloudEvents to a new Event Grid custom topic, and an existing Azure function named **func-menu-sync** must receive every event that the service publishes from its first run. The managed identity of the service already has the EventGrid Data Sender role on the resource group.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind ajoute des notifications « menu traduit » à son service de traduction par IA. Le service Python publiera des CloudEvents dans une nouvelle rubrique personnalisée Event Grid, et une fonction Azure existante nommée **func-menu-sync** doit recevoir chaque événement publié par le service dès sa première exécution. L'identité managée du service dispose déjà du rôle EventGrid Data Sender sur le groupe de ressources.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: topic, text: { en: "Create the custom topic with the input schema cloudeventschemav1_0.", fr: "Créer la rubrique personnalisée avec le schéma d'entrée cloudeventschemav1_0." } }
    - { id: sub, text: { en: "Create an event subscription on the topic with func-menu-sync as its endpoint.", fr: "Créer sur la rubrique un abonnement aux événements avec func-menu-sync comme point de terminaison." } }
    - { id: publish, text: { en: "Deploy the service with the endpoint of the topic, and start publishing.", fr: "Déployer le service avec le point de terminaison de la rubrique, et commencer à publier." } }
    - { id: system, text: { en: "Create a system topic on the storage account of the service.", fr: "Créer une rubrique système sur le compte de stockage du service." } }
    - { id: dltopic, text: { en: "Configure a dead-letter destination on the custom topic.", fr: "Configurer une destination de lettres mortes sur la rubrique personnalisée." } }
    - { id: egschema, text: { en: "Create the custom topic with the default input schema.", fr: "Créer la rubrique personnalisée avec le schéma d'entrée par défaut." } }
answer:
  sequence: [ topic, sub, publish ]
explanation:
  correct:
    en: |
      The topic must accept CloudEvents, so it is created with the cloudeventschemav1_0 input schema; the default is the Event Grid schema. Event Grid delivers events only to the event subscriptions that exist when they are published, so the subscription to func-menu-sync must exist before the service starts publishing.
    fr: |
      La rubrique doit accepter les CloudEvents : elle est donc créée avec le schéma d'entrée cloudeventschemav1_0 ; la valeur par défaut est le schéma Event Grid. Event Grid ne remet les événements qu'aux abonnements aux événements qui existent au moment de leur publication : l'abonnement vers func-menu-sync doit donc exister avant que le service commence à publier.
  options:
    system:
      en: |
        A system topic carries the events of an Azure service, not the custom events of the translation service.
      fr: |
        Une rubrique système transporte les événements d'un service Azure, pas les événements personnalisés du service de traduction.
    dltopic:
      en: |
        Dead-lettering is configured on an event subscription, not on the topic, and it isn't needed to deliver the events.
      fr: |
        Les lettres mortes se configurent sur un abonnement aux événements, pas sur la rubrique, et elles ne sont pas nécessaires pour remettre les événements.
    egschema:
      en: |
        The default input schema is the Event Grid schema, which doesn't accept the CloudEvents published by the service.
      fr: |
        Le schéma d'entrée par défaut est le schéma Event Grid, qui n'accepte pas les CloudEvents publiés par le service.
references:
  - title: az eventgrid topic
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/topic
  - title: az eventgrid event-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/event-subscription
