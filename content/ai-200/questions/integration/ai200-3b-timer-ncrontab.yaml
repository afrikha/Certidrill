id: ai200-3b-timer-ncrontab
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam rebuilds the vector index of its support knowledge base with a timer-triggered Python function (v2 programming model). The function must run at 2:30 AM UTC from Monday to Friday.

    Which schedule should you set in the `@app.timer_trigger` decorator?
  fr: |
    Fabrikam reconstruit l'index vectoriel de sa base de connaissances de support avec une fonction Python déclenchée par minuteur (modèle de programmation v2). La fonction doit s'exécuter à 2 h 30 UTC du lundi au vendredi.

    Quelle planification devez-vous définir dans le décorateur `@app.timer_trigger` ?
body:
  options:
    - { id: a, text: "schedule=\"0 2 30 * * 1-5\"" }
    - { id: b, text: "schedule=\"0 30 2 1-5 * *\"" }
    - { id: c, text: "schedule=\"0 30 2 * * 1-5\"" }
    - { id: d, text: "schedule=\"30 2 * * * 1-5\"" }
answer: { optionId: c }
explanation:
  correct:
    en: "An NCRONTAB expression has six fields: `{second} {minute} {hour} {day} {month} {day-of-week}`. `0 30 2 * * 1-5` fires at second 0, minute 30, hour 2, every day of every month, on days of the week 1 to 5 (Monday to Friday). The default time zone is UTC."
    fr: "Une expression NCRONTAB comporte six champs : `{second} {minute} {hour} {day} {month} {day-of-week}`. `0 30 2 * * 1-5` se déclenche à la seconde 0, à la minute 30, à 2 h, tous les jours de tous les mois, les jours de semaine 1 à 5 (du lundi au vendredi). Le fuseau horaire par défaut est UTC."
  options:
    a: { en: "This expression swaps the minute and hour fields; 30 is not a valid hour.", fr: "Cette expression inverse les champs minute et heure ; 30 n'est pas une heure valide." }
    b: { en: "1-5 in the fourth field means the first five days of the month, not Monday to Friday.", fr: "1-5 dans le quatrième champ désigne les cinq premiers jours du mois, pas du lundi au vendredi." }
    d: { en: "This expression fires at second 30 of minute 2 of every hour on weekdays.", fr: "Cette expression se déclenche à la seconde 30 de la minute 2 de chaque heure, les jours de semaine." }
references:
  - title: Timer trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-timer
