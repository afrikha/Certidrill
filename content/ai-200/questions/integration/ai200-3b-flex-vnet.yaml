id: ai200-3b-flex-vnet
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank hosts a Python function app named **func-wg-kyc** on the Flex Consumption plan. The app must call an Azure OpenAI resource that is reachable only through a private endpoint in the virtual network **vnet-wg**. You will add virtual network integration with `az functionapp vnet-integration add`.

    How should you prepare the subnet that the app will use?
  fr: |
    Woodgrove Bank héberge une application de fonction Python nommée **func-wg-kyc** sur le plan Flex Consumption. L'application doit appeler une ressource Azure OpenAI accessible uniquement via un point de terminaison privé dans le réseau virtuel **vnet-wg**. Vous allez ajouter l'intégration de réseau virtuel avec `az functionapp vnet-integration add`.

    Comment devez-vous préparer le sous-réseau que l'application utilisera ?
body:
  options:
    - { id: a, text: { en: "Create a /29 subnet delegated to Microsoft.Web/serverFarms.", fr: "Créer un sous-réseau /29 délégué à Microsoft.Web/serverFarms." } }
    - { id: b, text: { en: "Create a /27 subnet delegated to Microsoft.App/environments.", fr: "Créer un sous-réseau /27 délégué à Microsoft.App/environments." } }
    - { id: c, text: { en: "Create a /28 subnet delegated to Microsoft.App/environments.", fr: "Créer un sous-réseau /28 délégué à Microsoft.App/environments." } }
    - { id: d, text: { en: "Create a /27 subnet without delegation and enable private endpoint network policies.", fr: "Créer un sous-réseau /27 sans délégation et activer les stratégies réseau des points de terminaison privés." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For Flex Consumption virtual network integration, the subnet must be delegated to Microsoft.App/environments and be at least /27, and the Microsoft.App resource provider must be registered in the subscription.
    fr: |
      Pour l'intégration de réseau virtuel en Flex Consumption, le sous-réseau doit être délégué à Microsoft.App/environments et avoir une taille d'au moins /27, et le fournisseur de ressources Microsoft.App doit être inscrit dans l'abonnement.
  options:
    a: { en: "Microsoft.Web/serverFarms is the delegation used by the other App Service-based plans, and /29 is too small.", fr: "Microsoft.Web/serverFarms est la délégation utilisée par les autres plans basés sur App Service, et /29 est trop petit." }
    c: { en: "The delegation is right, but the subnet must be at least /27.", fr: "La délégation est correcte, mais le sous-réseau doit être au moins un /27." }
    d: { en: "Virtual network integration requires a delegated subnet; private endpoint policies apply to inbound private endpoints.", fr: "L'intégration de réseau virtuel exige un sous-réseau délégué ; les stratégies des points de terminaison privés concernent les points de terminaison privés entrants." }
references:
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
