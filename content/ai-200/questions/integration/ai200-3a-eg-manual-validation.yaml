id: ai200-3a-eg-manual-validation
objective: "3.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip wants to send "fraud alert" events from an Event Grid custom topic in the Event Grid schema to a third-party automation tool through a webhook. The tool can log the requests it receives, but it can't return the validation code in its response.

    You need to complete the endpoint validation of the webhook event subscription.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip veut envoyer des événements « alerte de fraude » d'une rubrique personnalisée Event Grid au schéma Event Grid vers un outil d'automatisation tiers par un webhook. L'outil peut consigner les requêtes qu'il reçoit, mais il ne peut pas renvoyer le code de validation dans sa réponse.

    Vous devez terminer la validation du point de terminaison de l'abonnement aux événements webhook.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create the event subscription with the URL of the tool as the webhook endpoint.", fr: "Créer l'abonnement aux événements avec l'URL de l'outil comme point de terminaison webhook." } }
    - { id: copy, text: { en: "Copy the validationUrl from the SubscriptionValidationEvent logged by the tool.", fr: "Copier la validationUrl de l'événement SubscriptionValidationEvent consigné par l'outil." } }
    - { id: get, text: { en: "Send an HTTP GET request to the validationUrl within 10 minutes.", fr: "Envoyer une requête HTTP GET à la validationUrl dans les 10 minutes." } }
    - { id: check, text: { en: "Check that the provisioning state of the subscription changed from AwaitingManualAction to Succeeded.", fr: "Vérifier que l'état d'approvisionnement de l'abonnement est passé d'AwaitingManualAction à Succeeded." } }
    - { id: post, text: { en: "Post the validationCode to the endpoint of the custom topic.", fr: "Publier le validationCode sur le point de terminaison de la rubrique personnalisée." } }
    - { id: accept, text: { en: "Configure the tool to answer the validation request with HTTP 202 Accepted.", fr: "Configurer l'outil pour qu'il réponde à la requête de validation par HTTP 202 Accepted." } }
answer:
  sequence: [ create, copy, get, check ]
explanation:
  correct:
    en: |
      When the endpoint can't echo the validation code, use the asynchronous handshake. Creating the subscription makes Event Grid send a SubscriptionValidationEvent that includes a validationUrl, and the subscription waits in the AwaitingManualAction state. A GET request to that URL within 10 minutes completes the validation; otherwise the subscription fails and must be created again.
    fr: |
      Quand le point de terminaison ne peut pas renvoyer le code de validation, utilisez la négociation asynchrone. La création de l'abonnement fait envoyer par Event Grid un événement SubscriptionValidationEvent qui contient une validationUrl, et l'abonnement attend dans l'état AwaitingManualAction. Une requête GET vers cette URL dans les 10 minutes termine la validation ; sinon, l'abonnement échoue et doit être recréé.
  options:
    post:
      en: |
        The topic endpoint receives published events; it isn't used to validate a subscription.
      fr: |
        Le point de terminaison de la rubrique reçoit les événements publiés ; il ne sert pas à valider un abonnement.
    accept:
      en: |
        202 Accepted isn't recognized as a valid validation response, and the tool can't return the code anyway.
      fr: |
        202 Accepted n'est pas reconnu comme réponse de validation valide, et l'outil ne peut de toute façon pas renvoyer le code.
references:
  - title: Validate Webhook Endpoints with Event Grid Schema
    url: https://learn.microsoft.com/en-us/azure/event-grid/end-point-validation-event-grid-events-schema
