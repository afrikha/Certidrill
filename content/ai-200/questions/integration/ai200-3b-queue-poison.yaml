id: ai200-3b-queue-poison
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Python function app with a Queue storage trigger on a queue named **ocr-jobs**. The function sends scanned invoices to a document analysis model. host.json does not configure the Queue storage extension.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une application de fonction Python avec un déclencheur Stockage File d'attente sur une file d'attente nommée **ocr-jobs**. La fonction envoie des factures numérisées à un modèle d'analyse de documents. host.json ne configure pas l'extension Stockage File d'attente.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "After five failed attempts for a message, including the first one, the runtime adds the message to a queue named ocr-jobs-poison.", fr: "Après cinq tentatives en échec pour un message, première incluse, le runtime ajoute le message à une file d'attente nommée ocr-jobs-poison." } }
    - { id: b, text: { en: "After the maximum number of attempts, the message is moved to the $DeadLetterQueue subqueue of ocr-jobs.", fr: "Après le nombre maximal de tentatives, le message est déplacé vers la sous-file $DeadLetterQueue de ocr-jobs." } }
    - { id: c, text: { en: "Each instance retrieves messages in batches of 16 and gets a new batch when the number being processed drops to 8.", fr: "Chaque instance récupère les messages par lots de 16 et récupère un nouveau lot quand le nombre de messages en cours de traitement descend à 8." } }
    - { id: d, text: { en: "A message that fails reappears in the queue only after a default visibility timeout of 10 minutes.", fr: "Un message en échec ne réapparaît dans la file d'attente qu'après un délai de visibilité par défaut de 10 minutes." } }
    - { id: e, text: { en: "The trigger expects plain-text messages and rejects base64-encoded messages.", fr: "Le déclencheur attend des messages en texte brut et rejette les messages encodés en base64." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The runtime tries a queue message up to five times, including the first try, and then adds it to a queue named `<originalqueuename>-poison`. By default each instance gets messages in batches of 16 and fetches another batch when the number being processed drops to 8.
    fr: |
      Le runtime essaie un message de file d'attente jusqu'à cinq fois, première tentative incluse, puis l'ajoute à une file d'attente nommée `<nom-file-d'origine>-poison`. Par défaut, chaque instance récupère les messages par lots de 16 et récupère un autre lot quand le nombre de messages en cours de traitement descend à 8.
  options:
    b: { en: "Dead-letter subqueues belong to Service Bus; Queue storage failures go to a separate -poison queue.", fr: "Les sous-files de lettres mortes appartiennent à Service Bus ; les échecs Stockage File d'attente vont dans une file -poison distincte." }
    d: { en: "The default visibility timeout is zero: the message reappears immediately for reprocessing.", fr: "Le délai de visibilité par défaut est de zéro : le message réapparaît immédiatement pour être retraité." }
    e: { en: "Functions expects a base64-encoded string; the sender must encode the messages.", fr: "Functions attend une chaîne encodée en base64 ; l'expéditeur doit encoder les messages." }
references:
  - title: Azure Queue storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-queue-trigger
