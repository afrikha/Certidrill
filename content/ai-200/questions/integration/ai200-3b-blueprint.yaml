id: ai200-3b-blueprint
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware is splitting the functions of its Python function app (v2 programming model) into several files. The ingestion functions move to a file named `ingest.py`, and `function_app.py` must load them.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware répartit les fonctions de son application de fonction Python (modèle de programmation v2) dans plusieurs fichiers. Les fonctions d'ingestion passent dans un fichier nommé `ingest.py`, et `function_app.py` doit les charger.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    # ingest.py
    import azure.functions as func

    bp = func.[[cls]]()

    @bp.blob_trigger(arg_name="doc", path="inbox/{name}", connection="StorageConnection")
    def ingest_document(doc: func.InputStream) -> None:
        index_document(doc.read())

    # function_app.py
    import azure.functions as func
    from ingest import bp

    app = func.FunctionApp()
    app.[[reg]](bp)
  slots:
    - id: cls
      options:
        - { id: blueprint, text: "Blueprint" }
        - { id: functionapp, text: "FunctionApp" }
        - { id: asgi, text: "AsgiFunctionApp" }
    - id: reg
      options:
        - { id: register, text: "register_functions" }
        - { id: regbp, text: "register_blueprint" }
        - { id: router, text: "include_router" }
answer:
  values: { cls: blueprint, reg: register }
explanation:
  correct:
    en: "In the v2 model, functions defined in another file are declared on a `func.Blueprint()` object. The main `FunctionApp` in function_app.py loads them with `app.register_functions(bp)`."
    fr: "Dans le modèle v2, les fonctions définies dans un autre fichier sont déclarées sur un objet `func.Blueprint()`. Le `FunctionApp` principal de function_app.py les charge avec `app.register_functions(bp)`."
  options:
    functionapp: { en: "An app has a single FunctionApp object, in function_app.py; other files use blueprints.", fr: "Une application a un seul objet FunctionApp, dans function_app.py ; les autres fichiers utilisent des blueprints." }
    asgi: { en: "AsgiFunctionApp hosts an ASGI framework app (such as FastAPI); it is not used to group functions.", fr: "AsgiFunctionApp héberge une application de framework ASGI (comme FastAPI) ; il ne sert pas à regrouper des fonctions." }
    regbp: { en: "register_blueprint is the Flask method name, not the Azure Functions one.", fr: "register_blueprint est le nom de la méthode Flask, pas celui d'Azure Functions." }
    router: { en: "include_router is a FastAPI method.", fr: "include_router est une méthode FastAPI." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
