id: ai200-3a-action-copies
objective: "3.1.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Alpine Ski House has a Service Bus topic named **events** with a subscription named **audit**. The $Default rule of audit was deleted, and the subscription has the following rules.

    | Rule | Filter | Action |
    | --- | --- | --- |
    | r1 | SQL filter `region = 'emea'` | None |
    | r2 | Correlation filter on the application property `priority` = `high` | None |
    | r3 | SQL filter `priority = 'high'` | `SET reviewed = 'pending'` |
    | r4 | SQL filter `region = 'apac'` | None |

    A producer sends one message whose application properties are `region` = `emea` and `priority` = `high`.

    How many messages does the audit subscription receive?
  fr: |
    Alpine Ski House dispose d'une rubrique Service Bus nommée **events** avec un abonnement nommé **audit**. La règle $Default d'audit a été supprimée, et l'abonnement possède les règles suivantes.

    | Règle | Filtre | Action |
    | --- | --- | --- |
    | r1 | Filtre SQL `region = 'emea'` | Aucune |
    | r2 | Filtre de corrélation sur la propriété d'application `priority` = `high` | Aucune |
    | r3 | Filtre SQL `priority = 'high'` | `SET reviewed = 'pending'` |
    | r4 | Filtre SQL `region = 'apac'` | Aucune |

    Un producteur envoie un message dont les propriétés d'application sont `region` = `emea` et `priority` = `high`.

    Combien de messages l'abonnement audit reçoit-il ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      r1, r2 and r3 match; r4 doesn't. Matching rules without actions (r1 and r2) share a single message in the subscription, while each matching rule with an action produces its own copy. The subscription therefore receives two messages, one of them annotated by r3.
    fr: |
      r1, r2 et r3 correspondent ; r4 ne correspond pas. Les règles correspondantes sans action (r1 et r2) partagent un seul message dans l'abonnement, tandis que chaque règle correspondante avec action produit sa propre copie. L'abonnement reçoit donc deux messages, dont l'un est annoté par r3.
  options:
    a:
      en: |
        One message would be right if no matching rule had an action; r3 adds its own copy.
      fr: |
        Un message serait juste si aucune règle correspondante n'avait d'action ; r3 ajoute sa propre copie.
    c:
      en: |
        Three counts one message per matching rule, but r1 and r2 have no action and share one message.
      fr: |
        Trois compte un message par règle correspondante, mais r1 et r2 n'ont pas d'action et partagent un seul message.
    d:
      en: |
        r4 doesn't match a message whose region is emea, and rules without actions don't produce separate copies.
      fr: |
        r4 ne correspond pas à un message dont la région est emea, et les règles sans action ne produisent pas de copies distinctes.
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
