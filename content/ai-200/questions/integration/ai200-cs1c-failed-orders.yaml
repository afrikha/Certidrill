id: ai200-cs1c-failed-orders
objective: "3.1.1"
type: dragdrop
caseStudy: ai200-cs1c-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the failed work orders requirement. schedule_crew uses the default host.json settings.

    Which setting should you configure for each part of the requirement? To answer, drag the appropriate settings to the correct parts. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative aux ordres de travail en échec. schedule_crew utilise les paramètres host.json par défaut.

    Quel paramètre devez-vous configurer pour chaque partie de l'exigence ? Pour répondre, faites glisser les paramètres appropriés vers les parties correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: maxdel, text: { en: "Maximum delivery count of the scheduling subscription set to 5", fr: "Nombre maximal de remises de l'abonnement scheduling défini sur 5" } }
    - { id: expiry, text: { en: "Dead-lettering on message expiration enabled on the scheduling subscription", fr: "Mise en file d'attente de lettres mortes à l'expiration des messages activée sur l'abonnement scheduling" } }
    - { id: filtereval, text: { en: "Dead-lettering on filter evaluation exceptions enabled on the scheduling subscription", fr: "Mise en file d'attente de lettres mortes sur les exceptions d'évaluation de filtre activée sur l'abonnement scheduling" } }
    - { id: maxcalls, text: { en: "`maxConcurrentCalls` set to 5 in host.json", fr: "`maxConcurrentCalls` défini sur 5 dans host.json" } }
    - { id: autocomp, text: { en: "`autoCompleteMessages` set to `false` in host.json", fr: "`autoCompleteMessages` défini sur `false` dans host.json" } }
  targets:
    - { id: failing, text: { en: "A work order that makes schedule_crew fail is delivered at most five times, then moved to the dead-letter queue.", fr: "Un ordre de travail qui fait échouer schedule_crew est remis cinq fois au plus, puis déplacé dans la file d'attente de lettres mortes." } }
    - { id: expired, text: { en: "A work order whose time to live expires before it is processed is moved to the dead-letter queue.", fr: "Un ordre de travail dont la durée de vie expire avant son traitement est déplacé dans la file d'attente de lettres mortes." } }
answer:
  mapping: { failing: maxdel, expired: expiry }
explanation:
  correct:
    en: |
      When schedule_crew raises an exception, the Functions runtime abandons the message, and Service Bus increments its delivery count; once the count exceeds the maximum delivery count of the subscription, the message moves to the dead-letter queue. Poison message handling is configured on the Service Bus entity, not in Azure Functions. Expired messages are moved to the dead-letter queue only when dead-lettering on message expiration is enabled on the queue or subscription.
    fr: |
      Quand schedule_crew lève une exception, le runtime Functions abandonne le message et Service Bus incrémente son nombre de remises ; dès que ce nombre dépasse le nombre maximal de remises de l'abonnement, le message passe dans la file d'attente de lettres mortes. La gestion des messages incohérents se configure sur l'entité Service Bus, pas dans Azure Functions. Les messages expirés ne sont déplacés dans la file d'attente de lettres mortes que si la mise en file d'attente de lettres mortes à l'expiration des messages est activée sur la file d'attente ou l'abonnement.
  options:
    filtereval: { en: "This option captures errors raised while a SQL filter rule runs, not failures of the function.", fr: "Cette option capture les erreurs qui surviennent pendant l'exécution d'une règle de filtre SQL, pas les échecs de la fonction." }
    maxcalls: { en: "maxConcurrentCalls limits how many messages are processed concurrently, not how many times a message is delivered.", fr: "maxConcurrentCalls limite le nombre de messages traités simultanément, pas le nombre de remises d'un message." }
    autocomp: { en: "Disabling automatic completion leaves the settlement to the code; it does not limit deliveries or dead-letter expired messages.", fr: "Désactiver la terminaison automatique laisse le règlement au code ; cela ne limite pas les remises et ne déplace pas les messages expirés." }
references:
  - title: Overview of Service Bus dead-letter queues
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues
  - title: Azure Service Bus trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus-trigger?pivots=programming-language-python
