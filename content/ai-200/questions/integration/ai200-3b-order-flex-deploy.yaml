id: ai200-3b-order-flex-deploy
objective: "3.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Python function project on a build agent and an empty resource group named **rg-nw-func**. You need to run the project in Azure on the Flex Consumption plan by using the Azure CLI.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un projet de fonctions Python sur un agent de build et d'un groupe de ressources vide nommé **rg-nw-func**. Vous devez exécuter le projet dans Azure sur le plan Flex Consumption à l'aide d'Azure CLI.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: storage, text: { en: "Create a general-purpose storage account.", fr: "Créer un compte de stockage à usage général." } }
    - { id: app, text: { en: "Run az functionapp create with --flexconsumption-location, --runtime python and --runtime-version 3.11.", fr: "Exécuter az functionapp create avec --flexconsumption-location, --runtime python et --runtime-version 3.11." } }
    - { id: deploy, text: { en: "Run az functionapp deployment source config-zip with --build-remote true.", fr: "Exécuter az functionapp deployment source config-zip avec --build-remote true." } }
    - { id: plan, text: { en: "Run az functionapp plan create with the EP1 SKU.", fr: "Exécuter az functionapp plan create avec la référence SKU EP1." } }
    - { id: runpkg, text: { en: "Set the WEBSITE_RUN_FROM_PACKAGE app setting to 1.", fr: "Définir le paramètre d'application WEBSITE_RUN_FROM_PACKAGE sur 1." } }
    - { id: slot, text: { en: "Create a staging deployment slot.", fr: "Créer un emplacement de déploiement de préproduction." } }
answer:
  sequence: [ storage, app, deploy ]
explanation:
  correct:
    en: |
      az functionapp create needs an existing storage account for the host, and --flexconsumption-location creates the Flex Consumption plan with the app. The code is then deployed as a package with config-zip; a remote build is required for Python.
    fr: |
      az functionapp create a besoin d'un compte de stockage existant pour l'hôte, et --flexconsumption-location crée le plan Flex Consumption avec l'application. Le code est ensuite déployé sous forme de package avec config-zip ; une build distante est requise pour Python.
  options:
    plan: { en: "EP1 is a Premium plan SKU; the Flex Consumption plan is created by az functionapp create.", fr: "EP1 est une référence SKU de plan Premium ; le plan Flex Consumption est créé par az functionapp create." }
    runpkg: { en: "WEBSITE_RUN_FROM_PACKAGE isn't used for deployments in Flex Consumption.", fr: "WEBSITE_RUN_FROM_PACKAGE n'est pas utilisé pour les déploiements en Flex Consumption." }
    slot: { en: "Flex Consumption doesn't support deployment slots.", fr: "Flex Consumption ne prend pas en charge les emplacements de déploiement." }
references:
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
