id: ai200-3b-appinsights-entra
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a function app named **func-contoso-rag** with a system-assigned managed identity. The app sends logs to an Application Insights resource by using the `APPLICATIONINSIGHTS_CONNECTION_STRING` app setting. The security team will disable local authentication on the Application Insights resource, so telemetry must be sent with Microsoft Entra authentication.

    You need to keep receiving the telemetry of the app. The solution must use the least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une application de fonction nommée **func-contoso-rag** avec une identité managée affectée par le système. L'application envoie ses journaux à une ressource Application Insights à l'aide du paramètre d'application `APPLICATIONINSIGHTS_CONNECTION_STRING`. L'équipe de sécurité va désactiver l'authentification locale sur la ressource Application Insights : la télémétrie devra donc être envoyée avec l'authentification Microsoft Entra.

    Vous devez continuer à recevoir la télémétrie de l'application. La solution doit utiliser le privilège minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace APPLICATIONINSIGHTS_CONNECTION_STRING with the APPINSIGHTS_INSTRUMENTATIONKEY app setting.", fr: "Remplacer APPLICATIONINSIGHTS_CONNECTION_STRING par le paramètre d'application APPINSIGHTS_INSTRUMENTATIONKEY." } }
    - { id: b, text: { en: "Assign the Monitoring Contributor role to the app identity on the Application Insights resource.", fr: "Attribuer le rôle Monitoring Contributor à l'identité de l'application sur la ressource Application Insights." } }
    - { id: c, text: { en: "Assign the Monitoring Metrics Publisher role to the app identity on the Application Insights resource.", fr: "Attribuer le rôle Monitoring Metrics Publisher à l'identité de l'application sur la ressource Application Insights." } }
    - { id: d, text: { en: "Add the APPLICATIONINSIGHTS_AUTHENTICATION_STRING app setting with the value Authorization=AAD.", fr: "Ajouter le paramètre d'application APPLICATIONINSIGHTS_AUTHENTICATION_STRING avec la valeur Authorization=AAD." } }
    - { id: e, text: { en: "Store the connection string in Key Vault and replace the app setting with a Key Vault reference.", fr: "Stocker la chaîne de connexion dans Key Vault et remplacer le paramètre d'application par une référence Key Vault." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      APPLICATIONINSIGHTS_AUTHENTICATION_STRING enables Microsoft Entra authentication to Application Insights; Authorization=AAD uses the system-assigned identity (add ClientId=... for a user-assigned one). The Monitoring Metrics Publisher role grants the minimum permissions the host needs to send telemetry.
    fr: |
      APPLICATIONINSIGHTS_AUTHENTICATION_STRING active l'authentification Microsoft Entra auprès d'Application Insights ; Authorization=AAD utilise l'identité affectée par le système (ajoutez ClientId=... pour une identité affectée par l'utilisateur). Le rôle Monitoring Metrics Publisher accorde les autorisations minimales dont l'hôte a besoin pour envoyer la télémétrie.
  options:
    a: { en: "The instrumentation key setting doesn't add Entra authentication; Learn recommends the connection string in all cases.", fr: "Le paramètre de clé d'instrumentation n'ajoute pas l'authentification Entra ; Learn recommande la chaîne de connexion dans tous les cas." }
    b: { en: "Monitoring Contributor grants management permissions beyond publishing telemetry.", fr: "Monitoring Contributor accorde des autorisations de gestion au-delà de la publication de télémétrie." }
    e: { en: "Hiding the connection string doesn't change how the telemetry is authenticated.", fr: "Masquer la chaîne de connexion ne change pas la façon dont la télémétrie est authentifiée." }
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
  - title: App settings reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-app-settings
