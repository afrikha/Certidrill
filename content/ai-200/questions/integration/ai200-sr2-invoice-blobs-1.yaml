seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You use a blob trigger with the default source.
  fr: Vous utilisez un déclencheur d'objet blob avec la source par défaut.
body:
  solution:
    en: |
      You define the function as follows and deploy the app. You don't create any event subscription.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices/{name}",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```
    fr: |
      Vous définissez la fonction comme suit et déployez l'application. Vous ne créez aucun abonnement aux événements.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices/{name}",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```
answer: { value: false }
explanation:
  correct:
    en: Without the source property, the blob trigger uses its default polling implementation (LogsAndContainerScan). The Flex Consumption plan supports only the event-based blob trigger, which requires source set to EventGrid and an event subscription on the storage account.
    fr: "Sans la propriété source, le déclencheur d'objet blob utilise son implémentation par interrogation par défaut (LogsAndContainerScan). Le plan Flex Consumption prend en charge uniquement le déclencheur d'objet blob basé sur les événements, qui nécessite la valeur EventGrid pour source et un abonnement aux événements sur le compte de stockage."
references:
  - title: Azure Blob storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-trigger
