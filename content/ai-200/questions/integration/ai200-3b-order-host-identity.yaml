id: ai200-3b-order-host-identity
objective: "3.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware has a function app named **func-lit-index** on a Premium plan. Its `AzureWebJobsStorage` app setting contains a connection string with the key of the storage account **stlitindex**, which uses the standard Azure DNS endpoints. The app has no managed identity.

    You need the host to connect to stlitindex with a managed identity, with the minimum permissions, and without an outage caused by missing access.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'une application de fonction nommée **func-lit-index** sur un plan Premium. Son paramètre d'application `AzureWebJobsStorage` contient une chaîne de connexion avec la clé du compte de stockage **stlitindex**, qui utilise les points de terminaison DNS Azure standard. L'application n'a pas d'identité managée.

    Vous devez faire en sorte que l'hôte se connecte à stlitindex avec une identité managée, avec les autorisations minimales et sans interruption due à un accès manquant.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: identity, text: { en: "Enable the system-assigned managed identity of func-lit-index.", fr: "Activer l'identité managée affectée par le système de func-lit-index." } }
    - { id: roles, text: { en: "Assign the Storage Blob Data Owner and Storage Table Data Contributor roles to the identity on stlitindex.", fr: "Attribuer les rôles Storage Blob Data Owner et Storage Table Data Contributor à l'identité sur stlitindex." } }
    - { id: add, text: { en: "Add the app setting AzureWebJobsStorage__accountName with the value stlitindex.", fr: "Ajouter le paramètre d'application AzureWebJobsStorage__accountName avec la valeur stlitindex." } }
    - { id: remove, text: { en: "Delete the AzureWebJobsStorage app setting.", fr: "Supprimer le paramètre d'application AzureWebJobsStorage." } }
    - { id: contributor, text: { en: "Assign the Storage Account Contributor role to the identity on stlitindex.", fr: "Attribuer le rôle Storage Account Contributor à l'identité sur stlitindex." } }
    - { id: rotate, text: { en: "Rotate the access keys of stlitindex.", fr: "Faire pivoter les clés d'accès de stlitindex." } }
answer:
  sequence: [ identity, roles, add, remove ]
explanation:
  correct:
    en: |
      The identity must exist before it can receive roles. Storage Blob Data Owner provides the minimum permissions for the host-required connection, and Storage Table Data Contributor is needed for the diagnostic events stored in Table Storage. Adding AzureWebJobsStorage__accountName before deleting the connection string switches the host to the identity without a period where it has no storage connection.
    fr: |
      L'identité doit exister avant de pouvoir recevoir des rôles. Storage Blob Data Owner fournit les autorisations minimales de la connexion requise par l'hôte, et Storage Table Data Contributor est nécessaire pour les événements de diagnostic stockés dans Stockage Table. Ajouter AzureWebJobsStorage__accountName avant de supprimer la chaîne de connexion fait passer l'hôte à l'identité sans période sans connexion de stockage.
  options:
    contributor: { en: "Storage Account Contributor is a management role; it doesn't grant the data access the host needs.", fr: "Storage Account Contributor est un rôle de gestion ; il n'accorde pas l'accès aux données dont l'hôte a besoin." }
    rotate: { en: "Rotating keys isn't required to switch to an identity, and doing it before the switch would break the running app.", fr: "Faire pivoter les clés n'est pas nécessaire pour passer à une identité, et le faire avant la bascule casserait l'application en cours." }
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
