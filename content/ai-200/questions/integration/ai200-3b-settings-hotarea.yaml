id: ai200-3b-settings-hotarea
objective: "3.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a Python function app named **func-contoso-voice** on a Premium plan. The app has a system-assigned managed identity. Its app settings are shown in the following table.

    Answer each prompt by selecting the app setting it describes.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une application de fonction Python nommée **func-contoso-voice** sur un plan Premium. L'application dispose d'une identité managée affectée par le système. Ses paramètres d'application figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre d'application qu'elle décrit.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The setting whose value can be resolved only if the app identity has the Key Vault Secrets User role", fr: "Le paramètre dont la valeur ne peut être résolue que si l'identité de l'application dispose du rôle Key Vault Secrets User" }
    - id: p2
      text: { en: "The setting that the runtime uses for key management, timer trigger locks and Event Hubs checkpoints", fr: "Le paramètre que le runtime utilise pour la gestion des clés, les verrous du déclencheur de minuteur et les points de contrôle Event Hubs" }
  grid:
    header: [{ en: "Name", fr: "Nom" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: "AzureWebJobsStorage__accountName", area: storage }, { text: "stcontosovoice" }]
      - [{ text: "FUNCTIONS_EXTENSION_VERSION", area: ext }, { text: "~4" }]
      - [{ text: "FUNCTIONS_WORKER_RUNTIME", area: worker }, { text: "python" }]
      - [{ text: "APPLICATIONINSIGHTS_CONNECTION_STRING", area: ai }, { text: "InstrumentationKey=...;IngestionEndpoint=..." }]
      - [{ text: "SPEECH_KEY", area: speech }, { text: "@Microsoft.KeyVault(SecretUri=https://kv-contoso.vault.azure.net/secrets/speech-key)" }]
      - [{ text: "SPEECH_REGION", area: region }, { text: "westeurope" }]
answer:
  values: { p1: speech, p2: storage }
explanation:
  correct:
    en: |
      SPEECH_KEY is a Key Vault reference, which the platform resolves with the app identity; with Azure RBAC that identity needs Key Vault Secrets User. AzureWebJobsStorage is the storage connection the Functions runtime uses for normal operations such as key management, timer trigger management and Event Hubs checkpoints; the __accountName form connects to it with the managed identity.
    fr: |
      SPEECH_KEY est une référence Key Vault, que la plateforme résout avec l'identité de l'application ; avec Azure RBAC, cette identité a besoin de Key Vault Secrets User. AzureWebJobsStorage est la connexion de stockage que le runtime Functions utilise pour ses opérations normales, comme la gestion des clés, la gestion du déclencheur de minuteur et les points de contrôle Event Hubs ; la forme __accountName s'y connecte avec l'identité managée.
references:
  - title: App settings reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-app-settings
  - title: Use Key Vault References as App Settings - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
