id: ai200-3a-eg-operator-match
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Lucerne Publishing routes "manuscript analyzed" events from an Event Grid custom topic to several functions. Each event subscription needs one advanced filter.

    Which operator should you use for each filter? To answer, drag the appropriate operators to the correct filters. Each operator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lucerne Publishing achemine des événements « manuscrit analysé » d'une rubrique personnalisée Event Grid vers plusieurs fonctions. Chaque abonnement aux événements a besoin d'un filtre avancé.

    Quel opérateur devez-vous utiliser pour chaque filtre ? Pour répondre, faites glisser les opérateurs appropriés vers les filtres correspondants. Chaque opérateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: strin, text: StringIn }
    - { id: range, text: NumberInRange }
    - { id: begins, text: StringBeginsWith }
    - { id: notnull, text: IsNotNull }
    - { id: bool, text: BoolEquals }
    - { id: numnotin, text: NumberNotIn }
  targets:
    - id: genre
      text: { en: "data.genre is fantasy, thriller or romance.", fr: "data.genre vaut fantasy, thriller ou romance." }
    - id: confidence
      text: { en: "data.confidence is between 0.4 and 0.6, so that a human editor reviews the uncertain results.", fr: "data.confidence est comprise entre 0,4 et 0,6, pour qu'un éditeur humain relise les résultats incertains." }
    - id: path
      text: { en: "data.path starts with /imprints/children/.", fr: "data.path commence par /imprints/children/." }
    - id: reviewer
      text: { en: "data.reviewerId is present and not null.", fr: "data.reviewerId est présente et non null." }
answer:
  mapping: { genre: strin, confidence: range, path: begins, reviewer: notnull }
explanation:
  correct:
    en: |
      StringIn matches one of several string values, NumberInRange matches values inside a range such as [0.4, 0.6], StringBeginsWith tests a prefix, and IsNotNull matches events where the key exists with a non-null value, the inverse of IsNullOrUndefined.
    fr: |
      StringIn correspond à l'une de plusieurs valeurs de chaîne, NumberInRange à des valeurs comprises dans une plage comme [0.4, 0.6], StringBeginsWith teste un préfixe, et IsNotNull correspond aux événements où la clé existe avec une valeur non null, l'inverse d'IsNullOrUndefined.
  options:
    bool:
      en: |
        BoolEquals compares a Boolean key with true or false; none of the filters tests a Boolean.
      fr: |
        BoolEquals compare une clé booléenne à true ou false ; aucun des filtres ne teste un booléen.
    numnotin:
      en: |
        NumberNotIn excludes a list of numbers and matches events where the key is missing; it doesn't express a range.
      fr: |
        NumberNotIn exclut une liste de nombres et correspond aux événements où la clé est absente ; il n'exprime pas une plage.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
