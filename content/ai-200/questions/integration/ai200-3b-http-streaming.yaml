id: ai200-3b-http-streaming
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware is building a chat API in a Python 3.11 function app (v2 programming model). The function **chat** must stream the tokens returned by a language model to the client as they are generated, instead of returning the full answer at the end. All the HTTP functions of the app will be converted to streaming.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée une API de conversation dans une application de fonction Python 3.11 (modèle de programmation v2). La fonction **chat** doit diffuser au client les jetons renvoyés par un modèle de langage au fur et à mesure de leur génération, au lieu de renvoyer la réponse complète à la fin. Toutes les fonctions HTTP de l'application seront converties à la diffusion en continu.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Return a func.HttpResponse whose body is a Python generator.", fr: "Renvoyer un func.HttpResponse dont le corps est un générateur Python." } }
    - { id: b, text: { en: "Set FUNCTIONS_WORKER_PROCESS_COUNT to 1.", fr: "Définir FUNCTIONS_WORKER_PROCESS_COUNT sur 1." } }
    - { id: c, text: { en: "Write chat as an async function that takes a Request and returns a StreamingResponse from azurefunctions.extensions.http.fastapi.", fr: "Écrire chat comme fonction async qui prend un Request et renvoie un StreamingResponse de azurefunctions.extensions.http.fastapi." } }
    - { id: d, text: { en: "Set functionTimeout to -1 in host.json.", fr: "Définir functionTimeout sur -1 dans host.json." } }
    - { id: e, text: { en: "Add the azurefunctions-extensions-http-fastapi package to requirements.txt.", fr: "Ajouter le package azurefunctions-extensions-http-fastapi à requirements.txt." } }
    - { id: f, text: { en: "Add the PYTHON_ENABLE_INIT_INDEXING app setting with the value 1.", fr: "Ajouter le paramètre d'application PYTHON_ENABLE_INIT_INDEXING avec la valeur 1." } }
answer: { optionIds: [ c, e, f ] }
explanation:
  correct:
    en: |
      HTTP streams are supported only in the Python v2 model. You add `azurefunctions-extensions-http-fastapi` to requirements.txt, set the `PYTHON_ENABLE_INIT_INDEXING` app setting to 1 (also in local.settings.json for local runs), and return a `StreamingResponse` from an async function that takes the extension's `Request`. Once streaming is enabled, every HTTP function of the app must use it.
    fr: |
      Les flux HTTP ne sont pris en charge que dans le modèle Python v2. Vous ajoutez `azurefunctions-extensions-http-fastapi` à requirements.txt, définissez le paramètre d'application `PYTHON_ENABLE_INIT_INDEXING` sur 1 (aussi dans local.settings.json pour les exécutions locales) et renvoyez un `StreamingResponse` depuis une fonction async qui prend le `Request` de l'extension. Une fois la diffusion activée, toutes les fonctions HTTP de l'application doivent l'utiliser.
  options:
    a: { en: "The default func.HttpResponse model returns a complete body; streaming needs the extension's StreamingResponse.", fr: "Le modèle func.HttpResponse par défaut renvoie un corps complet ; la diffusion exige le StreamingResponse de l'extension." }
    b: { en: "The number of worker processes has no effect on HTTP streaming, and 1 is already the default.", fr: "Le nombre de processus Worker n'a pas d'effet sur la diffusion HTTP, et 1 est déjà la valeur par défaut." }
    d: { en: "The execution timeout does not enable streaming, and it does not lift the HTTP response limits.", fr: "Le délai d'exécution n'active pas la diffusion en continu et ne lève pas les limites de la réponse HTTP." }
references:
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
