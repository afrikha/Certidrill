id: ai200-3a-duplicate-sends
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a loan API that sends a score command to a Service Bus queue named **scoring** in a Standard namespace. Each command identifies one loan application. When a send times out, the API sends the command again, and the scoring model then scores the same application twice. The API resends within two minutes.

    You need Service Bus to discard the repeated commands. The scoring worker must not change.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'une API de prêts qui envoie une commande de notation à une file d'attente Service Bus nommée **scoring** dans un espace de noms Standard. Chaque commande identifie une demande de prêt. Quand un envoi expire, l'API renvoie la commande, et le modèle de notation note alors deux fois la même demande. L'API renvoie la commande dans les deux minutes.

    Vous devez faire en sorte que Service Bus écarte les commandes répétées. Le worker de notation ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the queue again with sessions enabled, and set the session ID of each command to the loan application ID.", fr: "Recréer la file d'attente avec les sessions activées, et définir l'ID de session de chaque commande sur l'ID de la demande de prêt." } }
    - { id: b, text: { en: "Set the correlation ID of each command to the loan application ID, and add a correlation filter on the queue.", fr: "Définir l'ID de corrélation de chaque commande sur l'ID de la demande de prêt, et ajouter un filtre de corrélation sur la file d'attente." } }
    - { id: c, text: { en: "Create the queue again with duplicate detection enabled, and set the message ID of each command to the loan application ID.", fr: "Recréer la file d'attente avec la détection des doublons activée, et définir l'ID de message de chaque commande sur l'ID de la demande de prêt." } }
    - { id: d, text: { en: "Set the maximum delivery count of the queue to 1, and set the message ID of each command to the loan application ID.", fr: "Définir le nombre maximal de remises de la file d'attente sur 1, et définir l'ID de message de chaque commande sur l'ID de la demande de prêt." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With duplicate detection, Service Bus records the message IDs sent during the detection window (10 minutes by default) and drops a new message whose ID was already recorded, while reporting the send as successful. The message ID must carry the business identifier, here the loan application ID, so that a resend has the same ID.
    fr: |
      Avec la détection des doublons, Service Bus enregistre les ID des messages envoyés pendant la fenêtre de détection (10 minutes par défaut) et écarte un nouveau message dont l'ID est déjà enregistré, tout en signalant l'envoi comme réussi. L'ID de message doit porter l'identifiant métier, ici l'ID de la demande de prêt, pour qu'un renvoi ait le même ID.
  options:
    a:
      en: |
        Sessions group related messages for ordered processing; both copies of the command would still be delivered in the session.
      fr: |
        Les sessions regroupent des messages liés pour un traitement ordonné ; les deux copies de la commande seraient quand même remises dans la session.
    b:
      en: |
        Correlation filters are rules of topic subscriptions, not queues, and they select messages rather than remove duplicates.
      fr: |
        Les filtres de corrélation sont des règles d'abonnements de rubrique, pas de files d'attente, et ils sélectionnent des messages au lieu d'éliminer les doublons.
    d:
      en: |
        The maximum delivery count limits redeliveries of one message; two sent copies are two different messages, each delivered once.
      fr: |
        Le nombre maximal de remises limite les nouvelles remises d'un même message ; deux copies envoyées sont deux messages différents, chacun remis une fois.
references:
  - title: Azure Service Bus duplicate message detection
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
