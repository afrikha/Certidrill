id: ai200-cs1a-long-processing
objective: "3.1.1"
type: single
caseStudy: ai200-cs1a-proseware
difficulty: 2
status: draft
stem:
  en: |
    Monitoring shows that some court decisions are indexed twice by two different replicas of ca-indexer.

    You need to meet the indexer reliability requirement. What should you do?
  fr: |
    La supervision montre que certaines décisions de justice sont indexées deux fois par deux réplicas différents de ca-indexer.

    Vous devez satisfaire l'exigence relative à la fiabilité de l'indexeur. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the lock duration of doc-ingest to 20 minutes.", fr: "Définir la durée de verrouillage de doc-ingest sur 20 minutes." } }
    - { id: b, text: { en: "Receive the messages in receive-and-delete mode.", fr: "Recevoir les messages en mode receive-and-delete." } }
    - { id: c, text: { en: "Use the automatic lock renewal of the client library for up to 20 minutes per message.", fr: "Utiliser le renouvellement automatique du verrou de la bibliothèque cliente pendant 20 minutes au plus par message." } }
    - { id: d, text: { en: "Set the maximum delivery count of doc-ingest to 50.", fr: "Définir le nombre maximal de remises de doc-ingest sur 50." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In peek-lock mode, the lock hides the message from the other receivers only until it expires: one minute by default and five minutes at most. Processing that lasts up to 15 minutes lets the lock expire, so the message goes back to the queue and another replica receives it. Automatic lock renewal keeps the lock for the specified duration, and if the replica fails, the lock expires and the message is redelivered.
    fr: |
      En mode peek-lock, le verrou ne masque le message aux autres récepteurs que jusqu'à son expiration : une minute par défaut et cinq minutes au maximum. Un traitement qui dure jusqu'à 15 minutes laisse le verrou expirer : le message revient dans la file d'attente et un autre réplica le reçoit. Le renouvellement automatique du verrou conserve le verrou pendant la durée indiquée et, si le réplica tombe en panne, le verrou expire et le message est remis à nouveau.
  options:
    a:
      en: "The lock duration cannot exceed five minutes, so processing that lasts up to 15 minutes still needs lock renewal."
      fr: "La durée de verrouillage ne peut pas dépasser cinq minutes : un traitement qui dure jusqu'à 15 minutes nécessite toujours le renouvellement du verrou."
    b:
      en: "In receive-and-delete mode the message is removed as soon as it is delivered, so it is lost if the replica fails."
      fr: "En mode receive-and-delete, le message est supprimé dès sa remise : il est perdu si le réplica tombe en panne."
    d:
      en: "A higher delivery count only delays dead-lettering; the lock still expires and the message is still delivered to another replica."
      fr: "Un nombre de remises plus élevé ne fait que retarder la mise en file d'attente de lettres mortes ; le verrou expire toujours et le message est toujours remis à un autre réplica."
references:
  - title: Message transfers, locks, and settlement
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement
