stem:
  en: You use an Event Grid source and create a web hook event subscription.
  fr: Vous utilisez une source Event Grid et créez un abonnement aux événements webhook.
body:
  solution:
    en: |
      You define the function as follows and deploy the app.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices", source="EventGrid",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```

      You then create an event subscription on stadatuminv for the **Blob Created** event type, filtered to the invoices container. Its endpoint type is **Web Hook**, and its URL is `https://<default host name of func-adatum-inv>/runtime/webhooks/blobs?functionName=Host.Functions.process_invoice&code=<blobs_extension key>`.
    fr: |
      Vous définissez la fonction comme suit et déployez l'application.

      ```python
      @app.blob_trigger(arg_name="invoice", path="invoices", source="EventGrid",
                        connection="InvoiceStorage")
      def process_invoice(invoice: func.InputStream):
          extract_fields(invoice.read())
      ```

      Vous créez ensuite sur stadatuminv un abonnement aux événements pour le type d'événement **Blob Created**, filtré sur le conteneur invoices. Son type de point de terminaison est **Web Hook**, et son URL est `https://<default host name of func-adatum-inv>/runtime/webhooks/blobs?functionName=Host.Functions.process_invoice&code=<blobs_extension key>`.
answer: { value: true }
explanation:
  correct:
    en: Setting source to EventGrid selects the event-based blob trigger, the only implementation that the Flex Consumption plan supports. The event subscription delivers Blob Created events to the blobs extension web hook, authenticated by the blobs_extension system key, and the trigger passes each new blob to process_invoice as a func.InputStream.
    fr: "La valeur EventGrid pour source sélectionne le déclencheur d'objet blob basé sur les événements, la seule implémentation que prend en charge le plan Flex Consumption. L'abonnement aux événements remet les événements Blob Created au webhook de l'extension blobs, authentifié par la clé système blobs_extension, et le déclencheur transmet chaque nouvel objet blob à process_invoice sous la forme d'un func.InputStream."
