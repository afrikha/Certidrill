id: ai200-3a-queue-or-topic
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a document AI back end. When a user uploads a contract, the API sends one message to Azure Service Bus.

    Three independent services must each process every message: an embedding indexer, a compliance auditor and a notification service. Each service runs several replicas, and the replicas of the same service must share the work so that a message is processed only once per service.

    Which Service Bus configuration should you use?
  fr: |
    Fabrikam exploite un back-end d'IA documentaire. Quand un utilisateur charge un contrat, l'API envoie un message à Azure Service Bus.

    Trois services indépendants doivent chacun traiter chaque message : un indexeur d'incorporations, un auditeur de conformité et un service de notification. Chaque service exécute plusieurs réplicas, et les réplicas d'un même service doivent se partager le travail pour qu'un message ne soit traité qu'une fois par service.

    Quelle configuration Service Bus devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "One topic with one subscription per service, shared by its replicas", fr: "Une rubrique avec un abonnement par service, partagé par ses réplicas" } }
    - { id: b, text: { en: "One queue per service, chained to each other by auto-forwarding", fr: "Une file d'attente par service, chaînées entre elles par transfert automatique" } }
    - { id: c, text: { en: "One queue that the replicas of all three services read from", fr: "Une seule file d'attente lue par les réplicas des trois services" } }
    - { id: d, text: { en: "One topic with one subscription per replica of each service", fr: "Une rubrique avec un abonnement par réplica de chaque service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A topic delivers a copy of each message to every subscription, so each service gets every message. A subscription behaves like a queue, so the replicas of one service compete for the messages of their subscription and each message is processed once per service.
    fr: |
      Une rubrique remet une copie de chaque message à chaque abonnement : chaque service reçoit donc tous les messages. Un abonnement se comporte comme une file d'attente, si bien que les réplicas d'un service se disputent les messages de leur abonnement et que chaque message est traité une fois par service.
  options:
    c:
      en: |
        A queue delivers each message to only one receiver, so a message would reach only one of the three services.
      fr: |
        Une file d'attente remet chaque message à un seul récepteur ; un message n'atteindrait donc qu'un seul des trois services.
    b:
      en: |
        Auto-forwarding moves messages from one entity to the next instead of copying them, and you can't create a receiver on a source entity that forwards its messages.
      fr: |
        Le transfert automatique déplace les messages d'une entité à la suivante au lieu de les copier, et vous ne pouvez pas créer de récepteur sur une entité source qui transfère ses messages.
    d:
      en: |
        Each replica would receive its own copy, so every replica of a service would process the same message.
      fr: |
        Chaque réplica recevrait sa propre copie : tous les réplicas d'un service traiteraient le même message.
references:
  - title: Azure Service Bus Queues, Topics, and Subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
