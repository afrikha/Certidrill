id: ai200-3a-eg-subject-prefix
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum publishes "training run completed" events to an Event Grid custom topic. The subject of each event follows the pattern `/models/<model-name>/runs/<run-id>`. Model names include `fraud-v2`, `fraud-v20` and `fraud-v21`.

    An event subscription must deliver to the deployment function only the events of the model `fraud-v2`, without using advanced filters.

    Which subject filter should you set?
  fr: |
    Adatum publie des événements « exécution d'entraînement terminée » dans une rubrique personnalisée Event Grid. L'objet (subject) de chaque événement suit le modèle `/models/<model-name>/runs/<run-id>`. Les noms de modèles incluent `fraud-v2`, `fraud-v20` et `fraud-v21`.

    Un abonnement aux événements ne doit remettre à la fonction de déploiement que les événements du modèle `fraud-v2`, sans utiliser de filtres avancés.

    Quel filtre d'objet devez-vous définir ?
body:
  options:
    - { id: a, text: "subjectBeginsWith: /models/fraud-v2" }
    - { id: b, text: "subjectEndsWith: fraud-v2" }
    - { id: c, text: "subjectBeginsWith: /models/fraud-v2/" }
    - { id: d, text: "subjectBeginsWith: /models/fraud-v2*" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A subject filter compares the beginning or the end of the subject as a plain string. Including the trailing slash makes the prefix match only the runs of fraud-v2, because the subjects of fraud-v20 and fraud-v21 continue with a digit instead of a slash.
    fr: |
      Un filtre d'objet compare le début ou la fin de l'objet comme une simple chaîne. Inclure la barre oblique finale fait correspondre le préfixe aux seules exécutions de fraud-v2, car les objets de fraud-v20 et fraud-v21 se poursuivent par un chiffre et non par une barre oblique.
  options:
    a:
      en: |
        Without the trailing slash, the prefix also matches /models/fraud-v20/... and /models/fraud-v21/....
      fr: |
        Sans la barre oblique finale, le préfixe correspond aussi à /models/fraud-v20/... et /models/fraud-v21/....
    b:
      en: |
        Subjects end with the run ID, not with the model name, so this filter matches nothing.
      fr: |
        Les objets se terminent par l'ID de l'exécution, pas par le nom du modèle : ce filtre ne correspond à rien.
    d:
      en: |
        Subject filters don't support wildcards; the asterisk would be compared literally.
      fr: |
        Les filtres d'objet ne prennent pas en charge les caractères génériques ; l'astérisque serait comparé littéralement.
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
  - title: az eventgrid event-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/event-subscription
