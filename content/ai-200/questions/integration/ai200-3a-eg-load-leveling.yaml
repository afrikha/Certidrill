id: ai200-3a-eg-load-leveling
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware receives an Event Grid event each time a customer uploads a document to Blob Storage. A GPU-based summarization service must process every document, but it can handle only 20 documents per minute, while uploads arrive in bursts of thousands.

    The service must read the work at its own pace, without losing any event during a burst.

    Which endpoint type should the event subscription use?
  fr: |
    Proseware reçoit un événement Event Grid chaque fois qu'un client charge un document dans Stockage Blob. Un service de résumé sur GPU doit traiter chaque document, mais il ne traite que 20 documents par minute, alors que les chargements arrivent par rafales de plusieurs milliers.

    Le service doit lire le travail à son rythme, sans perdre aucun événement pendant une rafale.

    Quel type de point de terminaison l'abonnement aux événements doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "A webhook exposed by the summarization service", fr: "Un webhook exposé par le service de résumé" } }
    - { id: b, text: { en: "A Service Bus queue read by the summarization service", fr: "Une file d'attente Service Bus lue par le service de résumé" } }
    - { id: c, text: { en: "An Azure function that calls the summarization service for each event", fr: "Une fonction Azure qui appelle le service de résumé pour chaque événement" } }
    - { id: d, text: { en: "A relay hybrid connection to the summarization service", fr: "Une connexion hybride Relay vers le service de résumé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Event Grid pushes events and doesn't hold work for a slow consumer. Delivering the events to a Service Bus queue (endpoint type servicebusqueue) stores them durably, and the service receives them at its own pace (load leveling).
    fr: |
      Event Grid pousse les événements et ne conserve pas de travail pour un consommateur lent. Remettre les événements à une file d'attente Service Bus (type de point de terminaison servicebusqueue) les stocke de façon durable, et le service les reçoit à son rythme (nivellement de charge).
  options:
    a:
      en: |
        A webhook receives each event as it is pushed; a saturated service fails the requests, and the events are dropped when the retry policy ends.
      fr: |
        Un webhook reçoit chaque événement au moment où il est poussé ; un service saturé fait échouer les requêtes, et les événements sont supprimés à la fin de la stratégie de nouvelle tentative.
    c:
      en: |
        The function scales out with the burst and would overload the service; it doesn't make the service work at its own pace.
      fr: |
        La fonction monte en charge avec la rafale et surchargerait le service ; elle ne lui permet pas de travailler à son rythme.
    d:
      en: |
        A hybrid connection forwards each event directly to a listener, so the service still receives the burst as it happens.
      fr: |
        Une connexion hybride transmet chaque événement directement à un écouteur : le service reçoit toujours la rafale au moment où elle se produit.
references:
  - title: az eventgrid event-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/event-subscription
  - title: Azure Service Bus Queues, Topics, and Subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
