id: ai200-3b-sdk-type-binding
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a timer-triggered Python function (v2 programming model) that reads a large prompt library from the blob `config/prompts.json`. The developers want to call Blob Storage SDK methods such as `download_blob()` on an object supplied by the binding, instead of receiving the blob content as a string. They must not create a client from a connection string in the function code.

    What should you do?
  fr: |
    Northwind Traders dispose d'une fonction Python déclenchée par minuteur (modèle de programmation v2) qui lit une grande bibliothèque d'invites dans l'objet blob `config/prompts.json`. Les développeurs veulent appeler des méthodes du SDK Stockage Blob comme `download_blob()` sur un objet fourni par la liaison, au lieu de recevoir le contenu de l'objet blob sous forme de chaîne. Ils ne doivent pas créer de client à partir d'une chaîne de connexion dans le code de la fonction.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Type the blob_input parameter as blob.BlobClient from the azurefunctions-extensions-bindings-blob package.", fr: "Typer le paramètre blob_input en blob.BlobClient du package azurefunctions-extensions-bindings-blob." } }
    - { id: b, text: { en: "Type the blob_input parameter as func.InputStream and call its read() method.", fr: "Typer le paramètre blob_input en func.InputStream et appeler sa méthode read()." } }
    - { id: c, text: { en: "Set the dataType of the blob_input binding to stream and type the parameter as bytes.", fr: "Définir le dataType de la liaison blob_input sur stream et typer le paramètre en bytes." } }
    - { id: d, text: { en: "Replace the blob_input binding with a blob_output binding typed as func.Out[str].", fr: "Remplacer la liaison blob_input par une liaison blob_output typée func.Out[str]." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SDK type bindings let the binding pass Azure SDK objects such as `BlobClient` to the function, so the code calls SDK methods like `download_blob()` while the binding manages the connection. For Python they are available only in the v2 programming model, through the `azurefunctions.extensions.bindings.blob` package.
    fr: |
      Les liaisons de type SDK permettent à la liaison de transmettre des objets du SDK Azure comme `BlobClient` à la fonction ; le code appelle alors des méthodes du SDK comme `download_blob()` tandis que la liaison gère la connexion. En Python, elles ne sont disponibles que dans le modèle de programmation v2, via le package `azurefunctions.extensions.bindings.blob`.
  options:
    b: { en: "func.InputStream gives the blob content to read, not an SDK client with methods such as download_blob().", fr: "func.InputStream fournit le contenu de l'objet blob à lire, pas un client SDK avec des méthodes comme download_blob()." }
    c: { en: "dataType only changes how the content is passed; the function still receives data, not an SDK object.", fr: "dataType ne change que la façon dont le contenu est transmis ; la fonction reçoit toujours des données, pas un objet SDK." }
    d: { en: "An output binding writes a blob; the function needs to read one.", fr: "Une liaison de sortie écrit un objet blob ; la fonction doit en lire un." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
