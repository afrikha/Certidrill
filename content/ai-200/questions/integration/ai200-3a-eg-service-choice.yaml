id: ai200-3a-eg-service-choice
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing the messaging of a new AI claims platform. The architects list four requirements.

    Which service should you use for each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit la messagerie d'une nouvelle plateforme de sinistres par IA. Les architectes listent quatre exigences.

    Quel service devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: egcustom, text: { en: "Event Grid custom topic", fr: "Rubrique personnalisée Event Grid" } }
    - { id: sbqueue, text: { en: "Service Bus queue", fr: "File d'attente Service Bus" } }
    - { id: sbtopic, text: { en: "Service Bus topic", fr: "Rubrique Service Bus" } }
    - { id: egtosb, text: { en: "Event Grid system topic with an event subscription that delivers to a Service Bus queue", fr: "Rubrique système Event Grid avec un abonnement aux événements qui remet à une file d'attente Service Bus" } }
    - { id: eventhubs, text: { en: "Event Hubs event hub", fr: "Hub d'événements Event Hubs" } }
  targets:
    - id: notify
      text: { en: "Push a \"model retrained\" notification from the training app to any number of serverless handlers, billed per event.", fr: "Pousser une notification « modèle réentraîné » de l'application d'entraînement vers un nombre quelconque de gestionnaires serverless, facturée par événement." }
    - id: jobs
      text: { en: "Distribute fraud-scoring commands to a pool of workers so that each command is processed by one worker, with dead-lettering of commands that keep failing.", fr: "Répartir des commandes de notation de fraude entre des workers pour que chaque commande soit traitée par un seul worker, avec placement en lettres mortes des commandes qui échouent sans cesse." }
    - id: fanout
      text: { en: "Send each claim message to an indexer and to an auditor, each reading at its own pace and receiving only the claims that match a property filter.", fr: "Envoyer chaque message de sinistre à un indexeur et à un auditeur, chacun lisant à son rythme et ne recevant que les sinistres qui correspondent à un filtre de propriété." }
    - id: uploads
      text: { en: "React to photos uploaded to Blob Storage and process them at the pace of a slow GPU worker.", fr: "Réagir aux photos chargées dans Stockage Blob et les traiter au rythme d'un worker GPU lent." }
answer:
  mapping: { notify: egcustom, jobs: sbqueue, fanout: sbtopic, uploads: egtosb }
explanation:
  correct:
    en: |
      An Event Grid custom topic pushes the application's own events to every subscribed handler and bills per operation. A Service Bus queue gives each command to one competing consumer, with a maximum delivery count and a dead-letter queue. A Service Bus topic copies each message to every subscription whose rule matches, and each subscription is read like a queue. Blob Storage events come from a system topic, and delivering them to a Service Bus queue lets the slow worker level the load.
    fr: |
      Une rubrique personnalisée Event Grid pousse les propres événements de l'application vers chaque gestionnaire abonné et facture par opération. Une file d'attente Service Bus remet chaque commande à un seul consommateur concurrent, avec un nombre maximal de remises et une file d'attente de lettres mortes. Une rubrique Service Bus copie chaque message vers chaque abonnement dont la règle correspond, et chaque abonnement se lit comme une file d'attente. Les événements Stockage Blob proviennent d'une rubrique système, et les remettre à une file d'attente Service Bus permet au worker lent de niveler la charge.
  options:
    eventhubs:
      en: |
        Event Hubs ingests high-volume streams read by consumers with their own offsets; it neither pushes to handlers nor dead-letters individual commands.
      fr: |
        Event Hubs ingère des flux à fort volume lus par des consommateurs avec leurs propres positions ; il ne pousse pas vers des gestionnaires et ne place pas de commandes individuelles en lettres mortes.
references:
  - title: Azure Service Bus Queues, Topics, and Subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
  - title: az eventgrid event-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/event-subscription
