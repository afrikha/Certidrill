id: ai200-3b-flex-max-instances
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts a Python function app named **func-rag** on the Flex Consumption plan. Its HTTP functions query an Azure Database for PostgreSQL server that accepts a limited number of connections. During traffic spikes, the app scales out and the server rejects new connections.

    You need to ensure that func-rag never runs on more than 20 instances.

    Which command should you run?
  fr: |
    Contoso héberge une application de fonction Python nommée **func-rag** sur le plan Flex Consumption. Ses fonctions HTTP interrogent un serveur Azure Database for PostgreSQL qui accepte un nombre limité de connexions. Lors des pics de trafic, l'application monte en charge et le serveur refuse les nouvelles connexions.

    Vous devez faire en sorte que func-rag ne s'exécute jamais sur plus de 20 instances.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az functionapp config appsettings set -g rg-ai -n func-rag --settings WEBSITE_MAX_DYNAMIC_APPLICATION_SCALE_OUT=20" }
    - { id: b, text: "az functionapp scale config always-ready set -g rg-ai -n func-rag --settings http=20" }
    - { id: c, text: "az functionapp scale config set -g rg-ai -n func-rag --trigger-type http --trigger-settings perInstanceConcurrency=20" }
    - { id: d, text: "az functionapp scale config set -g rg-ai -n func-rag --maximum-instance-count 20" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On Flex Consumption, the maximum instance count is part of the scale configuration of the app and is set with `az functionapp scale config set --maximum-instance-count`. The value can range from 1 to 1,000.
    fr: |
      En Flex Consumption, le nombre maximal d'instances fait partie de la configuration de mise à l'échelle de l'application et se définit avec `az functionapp scale config set --maximum-instance-count`. La valeur peut aller de 1 à 1 000.
  options:
    a: { en: "WEBSITE_MAX_DYNAMIC_APPLICATION_SCALE_OUT is deprecated on Flex Consumption, replaced by maximumInstanceCount in the scale configuration.", fr: "WEBSITE_MAX_DYNAMIC_APPLICATION_SCALE_OUT est déconseillé en Flex Consumption, remplacé par maximumInstanceCount dans la configuration de mise à l'échelle." }
    b: { en: "This keeps 20 HTTP instances always ready and billed; it doesn't cap the number of on-demand instances.", fr: "Cette commande garde 20 instances HTTP toujours prêtes et facturées ; elle ne plafonne pas le nombre d'instances à la demande." }
    c: { en: "perInstanceConcurrency sets how many HTTP requests each instance handles, not how many instances run.", fr: "perInstanceConcurrency définit combien de requêtes HTTP chaque instance traite, pas combien d'instances s'exécutent." }
references:
  - title: az functionapp scale config
    url: https://learn.microsoft.com/en-us/cli/azure/functionapp/scale/config
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
