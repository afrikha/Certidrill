id: ai200-3b-two-triggers
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a Python function app that uses the Azure Functions v2 programming model. A helper named `extract_entities()` sends a text to a language model and stores the result.

    The same processing must start in two ways: when a client calls an HTTP endpoint, and when a message arrives in a Service Bus queue named **extract-jobs**.

    What should you do?
  fr: |
    Adatum Corporation dispose d'une application de fonction Python qui utilise le modèle de programmation v2 d'Azure Functions. Une fonction utilitaire nommée `extract_entities()` envoie un texte à un modèle de langage et stocke le résultat.

    Le même traitement doit démarrer de deux façons : quand un client appelle un point de terminaison HTTP et quand un message arrive dans une file d'attente Service Bus nommée **extract-jobs**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add both @app.route and @app.service_bus_queue_trigger to one function that calls extract_entities().", fr: "Ajouter @app.route et @app.service_bus_queue_trigger à une seule fonction qui appelle extract_entities()." } }
    - { id: b, text: { en: "Create an HTTP-triggered function with a Service Bus input binding that calls extract_entities().", fr: "Créer une fonction déclenchée par HTTP avec une liaison d'entrée Service Bus qui appelle extract_entities()." } }
    - { id: c, text: { en: "Create a blueprint that applies both trigger decorators to one function that calls extract_entities().", fr: "Créer un blueprint qui applique les deux décorateurs de déclencheur à une fonction qui appelle extract_entities()." } }
    - { id: d, text: { en: "Create two functions, one per trigger, that each call extract_entities().", fr: "Créer deux fonctions, une par déclencheur, qui appellent chacune extract_entities()." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A function has exactly one trigger. To start the same processing from an HTTP call and from a queue message, you write two functions, each with its own trigger, that share the helper.
    fr: |
      Une fonction a exactement un déclencheur. Pour lancer le même traitement depuis un appel HTTP et depuis un message de file d'attente, vous écrivez deux fonctions, chacune avec son déclencheur, qui partagent la fonction utilitaire.
  options:
    a: { en: "A function cannot have two triggers.", fr: "Une fonction ne peut pas avoir deux déclencheurs." }
    b: { en: "Service Bus has no input binding, and an input binding would never start the function when a message arrives.", fr: "Service Bus n'a pas de liaison d'entrée, et une liaison d'entrée ne démarrerait jamais la fonction à l'arrivée d'un message." }
    c: { en: "A blueprint only groups functions in another file; the one-trigger rule still applies to each function.", fr: "Un blueprint ne fait que regrouper des fonctions dans un autre fichier ; la règle d'un seul déclencheur s'applique toujours à chaque fonction." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
