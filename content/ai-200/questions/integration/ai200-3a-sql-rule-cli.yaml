id: ai200-3a-sql-rule-cli
objective: "3.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Humongous Insurance publishes scored claims to a Service Bus topic named **claims**. The producer sets the `subject` of each message to the claim type (`auto` or `home`) and an application property named `fraudScore` to the score returned by a fraud model.

    A subscription named **fraud-auto** must receive only auto claims whose fraud score is 0.7 or higher. Its $Default rule was already deleted.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Humongous Insurance publie des sinistres notés dans une rubrique Service Bus nommée **claims**. Le producteur définit le `subject` de chaque message sur le type de sinistre (`auto` ou `home`) et une propriété d'application nommée `fraudScore` sur le score renvoyé par un modèle de détection de fraude.

    Un abonnement nommé **fraud-auto** ne doit recevoir que les sinistres auto dont le score de fraude est supérieur ou égal à 0,7. Sa règle $Default a déjà été supprimée.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az servicebus topic subscription rule create --resource-group rg-claims \
      --namespace-name sb-humongous --topic-name claims \
      --subscription-name fraud-auto --name auto-high-risk \
      [[flag]] "[[subj]] = 'auto' AND [[score]] >= 0.7"
  slots:
    - id: flag
      options:
        - { id: filtersql, text: --filter-sql-expression }
        - { id: actionsql, text: --action-sql-expression }
        - { id: label, text: --label }
    - id: subj
      options:
        - { id: syslabel, text: sys.Label }
        - { id: plainlabel, text: Label }
        - { id: userlabel, text: user.Label }
    - id: score
      options:
        - { id: prop, text: fraudScore }
        - { id: sysprop, text: sys.fraudScore }
        - { id: dataprop, text: data.fraudScore }
answer:
  values: { flag: filtersql, subj: syslabel, score: prop }
explanation:
  correct:
    en: |
      The condition combines an equality and a comparison, so it needs a SQL filter, set with `--filter-sql-expression`. In SQL filter expressions, system properties take the `sys.` prefix, and the subject of a message is the Label system property (`sys.Label`). Application properties such as fraudScore are referenced by their name alone.
    fr: |
      La condition combine une égalité et une comparaison : elle exige un filtre SQL, défini avec `--filter-sql-expression`. Dans les expressions de filtre SQL, les propriétés système prennent le préfixe `sys.`, et le subject d'un message est la propriété système Label (`sys.Label`). Les propriétés d'application comme fraudScore se désignent par leur seul nom.
  options:
    actionsql:
      en: |
        An action expression modifies the properties of selected messages; it doesn't select them.
      fr: |
        Une expression d'action modifie les propriétés des messages sélectionnés ; elle ne les sélectionne pas.
    label:
      en: "--label defines a correlation filter on the subject alone; it can't take a SQL expression or express the score comparison."
      fr: "--label définit un filtre de corrélation sur le seul subject ; il ne peut pas prendre d'expression SQL ni exprimer la comparaison du score."
    plainlabel:
      en: |
        Without the sys. prefix, Label designates an application property named Label, which the producer doesn't set.
      fr: |
        Sans le préfixe sys., Label désigne une propriété d'application nommée Label, que le producteur ne définit pas.
    userlabel:
      en: |
        The user. prefix explicitly designates an application property named Label, which the producer doesn't set.
      fr: |
        Le préfixe user. désigne explicitement une propriété d'application nommée Label, que le producteur ne définit pas.
    sysprop:
      en: |
        fraudScore is an application property, not a system property, so it takes no sys. prefix.
      fr: |
        fraudScore est une propriété d'application, pas une propriété système : elle ne prend pas le préfixe sys.
    dataprop:
      en: |
        data. is Event Grid advanced filter syntax; Service Bus filters never read the body of the message.
      fr: |
        data. est une syntaxe des filtres avancés d'Event Grid ; les filtres Service Bus ne lisent jamais le corps du message.
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
  - title: az servicebus topic subscription rule
    url: https://learn.microsoft.com/en-us/cli/azure/servicebus/topic/subscription/rule
