id: ai200-3b-retry-decorator
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Python function (v2 programming model) with an Event Hubs trigger that sends telemetry summaries to a language model. When the model endpoint is throttled, the function raises an exception.

    The runtime must retry a failed execution up to five times. The delay must start at 4 seconds and grow between attempts, up to 2 minutes.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une fonction Python (modèle de programmation v2) avec un déclencheur Event Hubs qui envoie des synthèses de télémétrie à un modèle de langage. Quand le point de terminaison du modèle est limité, la fonction lève une exception.

    Le runtime doit retenter une exécution en échec jusqu'à cinq fois. Le délai doit commencer à 4 secondes et augmenter entre les tentatives, jusqu'à 2 minutes.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.event_hub_message_trigger(arg_name="event", event_hub_name="telemetry",
                                   connection="TelemetryHub")
    @app.retry(strategy="[[strategy]]", max_retry_count="5",
               [[low]]="00:00:04", [[high]]="00:02:00")
    def summarize(event: func.EventHubEvent) -> None:
        call_model(event.get_body().decode("utf-8"))
  slots:
    - id: strategy
      options:
        - { id: expo, text: "exponential_backoff" }
        - { id: fixed, text: "fixed_delay" }
        - { id: linear, text: "linear_backoff" }
    - id: low
      options:
        - { id: min, text: "minimum_interval" }
        - { id: delay, text: "delay_interval" }
        - { id: initial, text: "initial_delay" }
    - id: high
      options:
        - { id: max, text: "maximum_interval" }
        - { id: maxdelay, text: "max_delay" }
        - { id: timeout, text: "retry_timeout" }
answer:
  values: { strategy: expo, low: min, high: max }
explanation:
  correct:
    en: "`@app.retry` accepts two strategies, `fixed_delay` and `exponential_backoff`. A growing delay is `exponential_backoff`, bounded by `minimum_interval` and `maximum_interval` in `HH:mm:ss` format; `delay_interval` is used only with `fixed_delay`. Event Hubs is one of the triggers that support retry policies."
    fr: "`@app.retry` accepte deux stratégies, `fixed_delay` et `exponential_backoff`. Un délai croissant correspond à `exponential_backoff`, borné par `minimum_interval` et `maximum_interval` au format `HH:mm:ss` ; `delay_interval` ne sert qu'avec `fixed_delay`. Event Hubs fait partie des déclencheurs qui prennent en charge les stratégies de nouvelle tentative."
  options:
    fixed: { en: "fixed_delay waits the same delay between every attempt.", fr: "fixed_delay attend le même délai entre chaque tentative." }
    linear: { en: "The only valid strategies are fixed_delay and exponential_backoff.", fr: "Les seules stratégies valides sont fixed_delay et exponential_backoff." }
    delay: { en: "delay_interval is the single delay of the fixed_delay strategy.", fr: "delay_interval est le délai unique de la stratégie fixed_delay." }
    initial: { en: "The minimum delay of the exponential strategy is minimum_interval.", fr: "Le délai minimal de la stratégie exponentielle est minimum_interval." }
    maxdelay: { en: "The maximum delay of the exponential strategy is maximum_interval.", fr: "Le délai maximal de la stratégie exponentielle est maximum_interval." }
    timeout: { en: "The retry policy has no timeout parameter; it is bounded by max_retry_count.", fr: "La stratégie de nouvelle tentative n'a pas de paramètre de délai d'expiration ; elle est bornée par max_retry_count." }
references:
  - title: Azure Functions Error Handling and Retry Guidance
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-error-pages
