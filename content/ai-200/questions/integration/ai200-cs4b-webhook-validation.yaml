id: ai200-cs4b-webhook-validation
objective: "3.1.2"
type: single
caseStudy: ai200-cs4b-southridge
difficulty: 3
status: draft
stem:
  en: |
    You are adding the endpoint `/events/releases` to notify-api. You will then create the event subscription of the release notifications requirement with this endpoint as the webhook.

    You need to ensure that Event Grid validates the endpoint when you create the event subscription. What should the code of notify-api do?
  fr: |
    Vous ajoutez le point de terminaison `/events/releases` à notify-api. Vous créerez ensuite l'abonnement aux événements de l'exigence relative aux notifications de sortie avec ce point de terminaison comme webhook.

    Vous devez vous assurer qu'Event Grid valide le point de terminaison quand vous créez l'abonnement aux événements. Que doit faire le code de notify-api ?
body:
  options:
    - id: a
      text:
        en: "Answer the `POST` request that carries a `Microsoft.EventGrid.SubscriptionValidationEvent` with a body that contains its `validationCode` as `validationResponse`."
        fr: "Répondre à la requête `POST` qui contient un événement `Microsoft.EventGrid.SubscriptionValidationEvent` par un corps qui contient son `validationCode` en tant que `validationResponse`."
    - id: b
      text:
        en: "Answer the `OPTIONS` request with an HTTP 405 status and an `Allow: POST` header, then accept the `POST` requests that carry the events."
        fr: "Répondre à la requête `OPTIONS` par un statut HTTP 405 et un en-tête `Allow: POST`, puis accepter les requêtes `POST` qui contiennent les événements."
    - id: c
      text:
        en: "Answer the `OPTIONS` request with a `WebHook-Allowed-Origin` header set to the value of its `WebHook-Request-Origin` header, and a `WebHook-Allowed-Rate` header."
        fr: "Répondre à la requête `OPTIONS` par un en-tête `WebHook-Allowed-Origin` défini sur la valeur de son en-tête `WebHook-Request-Origin`, et un en-tête `WebHook-Allowed-Rate`."
    - id: d
      text:
        en: "Read the `validationUrl` of the first event that the endpoint receives, and send a `GET` request to that URL within the validation period."
        fr: "Lire la valeur `validationUrl` du premier événement reçu par le point de terminaison et envoyer une requête `GET` à cette URL pendant la période de validation."
answer: { optionId: c }
explanation:
  correct:
    en: "With the CloudEvents v1.0 schema, Event Grid uses the CloudEvents abuse protection handshake instead of its validation event: it sends an HTTP `OPTIONS` request with a `WebHook-Request-Origin` header. The endpoint grants permission by returning `WebHook-Allowed-Origin`, set to that origin or `*`, together with `WebHook-Allowed-Rate`."
    fr: "Avec le schéma CloudEvents v1.0, Event Grid utilise la négociation de protection contre les abus de CloudEvents au lieu de son événement de validation : il envoie une requête HTTP `OPTIONS` avec un en-tête `WebHook-Request-Origin`. Le point de terminaison accorde l'autorisation en renvoyant `WebHook-Allowed-Origin`, défini sur cette origine ou sur `*`, avec `WebHook-Allowed-Rate`."
  options:
    a: { en: "The `SubscriptionValidationEvent` and its `validationResponse` belong to the Event Grid event schema; they aren't used when the subscription delivers CloudEvents v1.0.", fr: "L'événement `SubscriptionValidationEvent` et sa réponse `validationResponse` appartiennent au schéma d'événement Event Grid ; ils ne sont pas utilisés quand l'abonnement remet des événements CloudEvents v1.0." }
    b: { en: "HTTP 405 is the answer of an endpoint that doesn't handle the handshake: it grants no permission, so the validation fails.", fr: "HTTP 405 est la réponse d'un point de terminaison qui ne gère pas la négociation : il n'accorde aucune autorisation, et la validation échoue." }
    d: { en: "The manual `validationUrl` is part of the validation event of the Event Grid event schema; the CloudEvents handshake has no validation URL.", fr: "L'URL `validationUrl` de validation manuelle fait partie de l'événement de validation du schéma d'événement Event Grid ; la négociation CloudEvents n'a pas d'URL de validation." }
references:
  - title: Endpoint Validation Using CloudEvents v1.0 Schema
    url: https://learn.microsoft.com/en-us/azure/event-grid/end-point-validation-cloud-events-schema
