id: ai200-3b-kv-refresh
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a function app whose app setting `MODEL_KEY` is a versionless Key Vault reference to the secret **model-key**. After a security incident, a new version of model-key was created and the old key was revoked at the provider.

    The app must start using the new version as soon as possible. The reference must stay versionless, and you must not change any app setting.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'une application de fonction dont le paramètre d'application `MODEL_KEY` est une référence Key Vault sans version au secret **model-key**. Après un incident de sécurité, une nouvelle version de model-key a été créée et l'ancienne clé a été révoquée chez le fournisseur.

    L'application doit utiliser la nouvelle version le plus tôt possible. La référence doit rester sans version et vous ne devez modifier aucun paramètre d'application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Wait for the next automatic refresh, which occurs within 15 minutes.", fr: "Attendre la prochaine actualisation automatique, qui a lieu dans les 15 minutes." } }
    - { id: b, text: { en: "Disable the previous version of model-key in the key vault.", fr: "Désactiver la version précédente de model-key dans le coffre de clés." } }
    - { id: c, text: { en: "Send a POST request to the configreferences/appsettings/refresh endpoint of the app in Azure Resource Manager.", fr: "Envoyer une requête POST au point de terminaison configreferences/appsettings/refresh de l'application dans Azure Resource Manager." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets Officer role to the app identity.", fr: "Attribuer le rôle Key Vault Secrets Officer à l'identité de l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      App Service caches the values of Key Vault references and refetches them every 24 hours, so a versionless reference picks up a new version within 24 hours. An authenticated POST to the configreferences/appsettings/refresh endpoint forces the references to be resolved again immediately; any configuration change would too, but changing settings isn't allowed here.
    fr: |
      App Service met en cache les valeurs des références Key Vault et les récupère de nouveau toutes les 24 heures ; une référence sans version prend donc une nouvelle version en compte dans les 24 heures. Une requête POST authentifiée au point de terminaison configreferences/appsettings/refresh force une nouvelle résolution immédiate des références ; toute modification de configuration le ferait aussi, mais modifier les paramètres n'est pas autorisé ici.
  options:
    a: { en: "The cache is refreshed every 24 hours, not every 15 minutes.", fr: "Le cache est actualisé toutes les 24 heures, pas toutes les 15 minutes." }
    b: { en: "Disabling the old version in the vault doesn't clear the value cached by the app.", fr: "Désactiver l'ancienne version dans le coffre ne vide pas la valeur mise en cache par l'application." }
    d: { en: "The app already reads the secret; a broader role doesn't trigger a refresh and exceeds least privilege.", fr: "L'application lit déjà le secret ; un rôle plus large ne déclenche pas d'actualisation et dépasse le privilège minimum." }
references:
  - title: Use Key Vault References as App Settings - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
