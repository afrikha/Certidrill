id: ai200-3a-eg-keep-failed-events
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an event subscription that delivers "price recalculated" events from a custom topic to an Azure function. The subscription uses the default retry policy and no other optional setting.

    After a deployment error kept the function down for a full weekend, the events of that period could not be found anywhere. You need to keep every event that Event Grid fails to deliver so that the team can reprocess it later.

    What should you do?
  fr: |
    Wingtip dispose d'un abonnement aux événements qui remet des événements « prix recalculé » d'une rubrique personnalisée à une fonction Azure. L'abonnement utilise la stratégie de nouvelle tentative par défaut et aucun autre paramètre facultatif.

    Après qu'une erreur de déploiement a rendu la fonction indisponible tout un week-end, les événements de cette période étaient introuvables. Vous devez conserver chaque événement qu'Event Grid ne parvient pas à remettre pour que l'équipe puisse le retraiter plus tard.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set a blob container as the dead-letter destination of the subscription.", fr: "Définir un conteneur d'objets blob comme destination de lettres mortes de l'abonnement." } }
    - { id: b, text: { en: "Set the maximum number of delivery attempts of the subscription to 100.", fr: "Définir le nombre maximal de tentatives de remise de l'abonnement sur 100." } }
    - { id: c, text: { en: "Set the event time to live of the subscription to 4,320 minutes.", fr: "Définir la durée de vie des événements de l'abonnement sur 4 320 minutes." } }
    - { id: d, text: { en: "Enable output batching on the subscription with 5,000 events per batch.", fr: "Activer le traitement par lots en sortie sur l'abonnement avec 5 000 événements par lot." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Dead-lettering is off by default, so events that are still undelivered when the retry policy ends (24 hours by default) are dropped. With a blob container set as the dead-letter destination, Event Grid writes those events to the container with their dead-letter reason and delivery attempts, ready for reprocessing.
    fr: |
      Les lettres mortes sont désactivées par défaut : les événements toujours non remis à la fin de la stratégie de nouvelle tentative (24 heures par défaut) sont supprimés. Avec un conteneur d'objets blob comme destination de lettres mortes, Event Grid écrit ces événements dans le conteneur avec leur raison de lettre morte et leurs tentatives de remise, prêts à être retraités.
  options:
    c:
      en: |
        The event time to live ranges from 1 to 1,440 minutes; 24 hours is already the maximum.
      fr: |
        La durée de vie des événements va de 1 à 1 440 minutes ; 24 heures est déjà le maximum.
    b:
      en: |
        The maximum number of delivery attempts ranges from 1 to 30, and more attempts still end with dropped events.
      fr: |
        Le nombre maximal de tentatives de remise va de 1 à 30, et davantage de tentatives se termineraient quand même par des événements supprimés.
    d:
      en: |
        Batching groups events into fewer requests; a batch that can't be delivered is still dropped without a dead-letter destination.
      fr: |
        Le traitement par lots regroupe les événements en moins de requêtes ; un lot impossible à remettre est quand même supprimé sans destination de lettres mortes.
references:
  - title: Azure Event Grid Delivery and Retry Explained
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
