id: ai200-3b-cosmos-deletes
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware keeps a vector index of its knowledge base articles in sync with an Azure Cosmos DB for NoSQL container named **articles**. A Python function with a Cosmos DB trigger updates the index when articles are created or updated.

    When an author deletes an article in the authoring application, the matching entry must also be removed from the vector index. You can change the authoring application.

    What should you do?
  fr: |
    Litware maintient un index vectoriel de ses articles de base de connaissances synchronisé avec un conteneur Azure Cosmos DB for NoSQL nommé **articles**. Une fonction Python avec un déclencheur Cosmos DB met à jour l'index quand des articles sont créés ou modifiés.

    Quand un auteur supprime un article dans l'application de rédaction, l'entrée correspondante doit aussi être retirée de l'index vectoriel. Vous pouvez modifier l'application de rédaction.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set create_lease_container_if_not_exists to true so that the leases record deleted items.", fr: "Définir create_lease_container_if_not_exists sur true pour que les baux enregistrent les éléments supprimés." } }
    - { id: b, text: { en: "Add a second Cosmos DB trigger function that monitors the leases container.", fr: "Ajouter une seconde fonction avec un déclencheur Cosmos DB qui surveille le conteneur de baux." } }
    - { id: c, text: { en: "Add a Cosmos DB input binding to the existing function to read the deleted articles.", fr: "Ajouter une liaison d'entrée Cosmos DB à la fonction existante pour lire les articles supprimés." } }
    - { id: d, text: { en: "Mark articles as deleted with a property update instead of deleting them, and remove them from the index when the function sees the flag.", fr: "Marquer les articles comme supprimés par la mise à jour d'une propriété au lieu de les supprimer, et les retirer de l'index quand la fonction voit l'indicateur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The change feed that drives the Cosmos DB trigger publishes new and updated items, not deletions. A soft delete turns the deletion into an update - the application sets a flag such as isDeleted (and can set a time to live to purge the item later), the trigger receives the updated item, and the function removes the entry from the index.
    fr: "Le flux de modification qui alimente le déclencheur Cosmos DB publie les éléments nouveaux et mis à jour, pas les suppressions. Une suppression réversible transforme la suppression en mise à jour : l'application définit un indicateur comme isDeleted (et peut définir une durée de vie pour purger l'élément plus tard), le déclencheur reçoit l'élément modifié et la fonction retire l'entrée de l'index."
  options:
    a: { en: "This setting only creates the lease container; leases store checkpoints, not deleted items.", fr: "Ce paramètre ne fait que créer le conteneur de baux ; les baux stockent des points de contrôle, pas les éléments supprimés." }
    b: { en: "The leases container holds processing state; monitoring it does not reveal which articles were deleted.", fr: "Le conteneur de baux contient l'état du traitement ; le surveiller ne révèle pas quels articles ont été supprimés." }
    c: { en: "A deleted item no longer exists, so an input binding cannot read it, and the trigger never receives the deletion.", fr: "Un élément supprimé n'existe plus : une liaison d'entrée ne peut pas le lire, et le déclencheur ne reçoit jamais la suppression." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
