id: ai200-3b-http-route-constraint
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is writing a product recommendation API in Python by using the Azure Functions v2 programming model. The function must answer the following URLs:

    - `/api/products/toys` - all recommendations of a category
    - `/api/products/toys/42` - recommendations similar to product 42

    The category must contain only letters, and the product ID, when present, must be an integer.

    Which route should you set in the `@app.route` decorator?
  fr: |
    Wingtip Toys écrit une API de recommandation de produits en Python avec le modèle de programmation v2 d'Azure Functions. La fonction doit répondre aux URL suivantes :

    - `/api/products/toys` : toutes les recommandations d'une catégorie
    - `/api/products/toys/42` : les recommandations proches du produit 42

    La catégorie ne doit contenir que des lettres et l'ID de produit, lorsqu'il est présent, doit être un entier.

    Quelle route devez-vous définir dans le décorateur `@app.route` ?
body:
  options:
    - { id: a, text: "route=\"products/{category:alpha}/{id:int?}\"" }
    - { id: b, text: "route=\"products/{category:alpha}/{id?:int}\"" }
    - { id: c, text: "route=\"products/{alpha:category}/{int:id?}\"" }
    - { id: d, text: "route=\"products/<category:alpha>/<id:int?>\"" }
answer: { optionId: a }
explanation:
  correct:
    en: "Route templates use the `{name:constraint}` syntax, and a trailing `?` after the constraint makes the parameter optional, as in `products/{category:alpha}/{id:int?}`. The function then reads both values from `req.route_params`."
    fr: "Les modèles de route utilisent la syntaxe `{nom:contrainte}`, et un `?` placé après la contrainte rend le paramètre facultatif, comme dans `products/{category:alpha}/{id:int?}`. La fonction lit ensuite les deux valeurs dans `req.route_params`."
  options:
    b: { en: "The optional marker goes after the constraint, not between the name and the constraint.", fr: "Le marqueur facultatif se place après la contrainte, pas entre le nom et la contrainte." }
    c: { en: "The parameter name comes first, then the constraint.", fr: "Le nom du paramètre vient en premier, puis la contrainte." }
    d: { en: "Angle brackets are a Flask route syntax; Functions route templates use braces.", fr: "Les chevrons sont une syntaxe de route Flask ; les modèles de route Functions utilisent des accolades." }
references:
  - title: Azure Functions HTTP trigger
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
