id: ai200-3b-plan-migration
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has several Python function apps hosted on Linux in the Consumption plan. The team is planning their future hosting.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de plusieurs applications de fonction Python hébergées sous Linux dans le plan Consumption. L'équipe planifie leur hébergement futur.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Consumption plan supports virtual network integration for outbound traffic.", fr: "Le plan Consumption prend en charge l'intégration de réseau virtuel pour le trafic sortant." } }
    - { id: b, text: { en: "An existing app can be moved to the Flex Consumption plan in place by changing its plan.", fr: "Une application existante peut être déplacée sur place vers le plan Flex Consumption en changeant son plan." } }
    - { id: c, text: { en: "An app that runs on Python 3.12 can be hosted on the Flex Consumption plan.", fr: "Une application qui s'exécute sur Python 3.12 peut être hébergée sur le plan Flex Consumption." } }
    - { id: d, text: { en: "The Flex Consumption plan can host the apps on Windows instances.", fr: "Le plan Flex Consumption peut héberger les applications sur des instances Windows." } }
    - { id: e, text: { en: "The option to host function apps on Linux in the Consumption plan is retiring on 30 September 2028.", fr: "L'option d'hébergement d'applications de fonction sous Linux dans le plan Consumption sera mise hors service le 30 septembre 2028." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Linux hosting in the Consumption plan retires on 30 September 2028, and Learn recommends Flex Consumption for new serverless apps. Flex Consumption supports Python 3.10 to 3.15.
    fr: |
      L'hébergement Linux dans le plan Consumption sera mis hors service le 30 septembre 2028, et Learn recommande Flex Consumption pour les nouvelles applications serverless. Flex Consumption prend en charge Python 3.10 à 3.15.
  options:
    a: { en: "The Consumption plan doesn't support virtual network integration.", fr: "Le plan Consumption ne prend pas en charge l'intégration de réseau virtuel." }
    b: { en: "In-place migration to Flex Consumption isn't supported; you create a new app and redeploy.", fr: "La migration sur place vers Flex Consumption n'est pas prise en charge ; vous créez une nouvelle application et redéployez." }
    d: { en: "Flex Consumption runs on Linux only.", fr: "Flex Consumption s'exécute uniquement sous Linux." }
references:
  - title: Azure Functions Scale and Hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
