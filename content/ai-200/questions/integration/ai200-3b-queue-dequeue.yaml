id: ai200-3b-queue-dequeue
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware sends audio transcription jobs to a Queue storage queue named **transcribe-jobs**. You are writing the Python function (v2 programming model) that processes the jobs.

    When a message is being processed again after a failed attempt, the function must log a warning before it calls the speech model.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware envoie des tâches de transcription audio dans une file d'attente Stockage nommée **transcribe-jobs**. Vous écrivez la fonction Python (modèle de programmation v2) qui traite les tâches.

    Quand un message est traité de nouveau après une tentative en échec, la fonction doit journaliser un avertissement avant d'appeler le modèle vocal.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.[[dec]](arg_name="msg", queue_name="transcribe-jobs",
                 connection="AudioStorage")
    def transcribe(msg: [[mtype]]) -> None:
        if msg.[[prop]] > 1:
            logging.warning("Retrying job %s", msg.id)
        run_transcription(msg.get_json())
  slots:
    - id: dec
      options:
        - { id: queue, text: "queue_trigger" }
        - { id: sbqueue, text: "service_bus_queue_trigger" }
        - { id: queuein, text: "queue_input" }
    - id: mtype
      options:
        - { id: qmsg, text: "func.QueueMessage" }
        - { id: sbmsg, text: "func.ServiceBusMessage" }
        - { id: http, text: "func.HttpRequest" }
    - id: prop
      options:
        - { id: dequeue, text: "dequeue_count" }
        - { id: delivery, text: "delivery_count" }
        - { id: pop, text: "pop_receipt" }
answer:
  values: { dec: queue, mtype: qmsg, prop: dequeue }
explanation:
  correct:
    en: |
      A Queue storage trigger is declared with `@app.queue_trigger` and passes a `func.QueueMessage`. Its `dequeue_count` metadata is the number of times the message has been dequeued, so a value greater than 1 means a retry. After five failed attempts, the runtime moves the message to the transcribe-jobs-poison queue.
    fr: |
      Un déclencheur Stockage File d'attente se déclare avec `@app.queue_trigger` et transmet un `func.QueueMessage`. Sa métadonnée `dequeue_count` indique combien de fois le message a été retiré de la file : une valeur supérieure à 1 signale une nouvelle tentative. Après cinq tentatives en échec, le runtime déplace le message vers la file transcribe-jobs-poison.
  options:
    sbqueue: { en: "The jobs are in a Queue storage queue, not a Service Bus queue.", fr: "Les tâches sont dans une file d'attente Stockage, pas dans une file Service Bus." }
    queuein: { en: "A function must be started by a trigger; queue_input does not start it.", fr: "Une fonction doit être démarrée par un déclencheur ; queue_input ne la démarre pas." }
    sbmsg: { en: "func.ServiceBusMessage is the type of Service Bus triggers.", fr: "func.ServiceBusMessage est le type des déclencheurs Service Bus." }
    http: { en: "func.HttpRequest is the type of HTTP triggers.", fr: "func.HttpRequest est le type des déclencheurs HTTP." }
    delivery: { en: "delivery_count belongs to Service Bus messages.", fr: "delivery_count appartient aux messages Service Bus." }
    pop: { en: "The pop receipt is needed to delete or update a message; it does not count attempts.", fr: "Le reçu de suppression (pop receipt) sert à supprimer ou mettre à jour un message ; il ne compte pas les tentatives." }
references:
  - title: Azure Queue storage trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-queue-trigger
