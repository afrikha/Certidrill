id: ai200-3b-trigger-choice
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building the back end of a retrieval-augmented generation (RAG) assistant as a Python function app (v2 programming model). Each function must start on the event described for it.

    Which decorator should you use for each function? To answer, drag the appropriate decorators to the correct functions. Each decorator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée le back-end d'un assistant de génération augmentée de récupération (RAG) sous forme d'application de fonction Python (modèle de programmation v2). Chaque fonction doit démarrer sur l'événement décrit pour elle.

    Quel décorateur devez-vous utiliser pour chaque fonction ? Pour répondre, faites glisser les décorateurs appropriés vers les fonctions correspondantes. Chaque décorateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: timer, text: "@app.timer_trigger" }
    - { id: cosmos, text: "@app.cosmos_db_trigger" }
    - { id: queue, text: "@app.queue_trigger" }
    - { id: eg, text: "@app.event_grid_trigger" }
    - { id: blob, text: "@app.blob_input" }
    - { id: route, text: "@app.route" }
  targets:
    - id: reindex
      text: { en: "reindex: runs every night at 1:00 AM UTC", fr: "reindex : s'exécute chaque nuit à 1 h UTC" }
    - id: embed
      text: { en: "embed: runs when a document is inserted or updated in a Cosmos DB for NoSQL container", fr: "embed : s'exécute quand un document est inséré ou modifié dans un conteneur Cosmos DB for NoSQL" }
    - id: ocr
      text: { en: "ocr: runs when a message is added to a Queue storage queue", fr: "ocr : s'exécute quand un message est ajouté à une file d'attente Stockage" }
    - id: policy
      text: { en: "policy: runs when an event subscription delivers an event from a custom topic", fr: "policy : s'exécute quand un abonnement aux événements remet un événement d'une rubrique personnalisée" }
answer:
  mapping: { reindex: timer, embed: cosmos, ocr: queue, policy: eg }
explanation:
  correct:
    en: |
      A schedule is a timer trigger with an NCRONTAB expression, the Cosmos DB trigger reads the change feed of a container, the queue trigger runs for Queue storage messages, and the Event Grid trigger receives events from an event subscription. blob_input is an input binding and cannot start a function; route is an HTTP trigger.
    fr: |
      Une planification est un déclencheur de minuteur avec une expression NCRONTAB, le déclencheur Cosmos DB lit le flux de modification d'un conteneur, le déclencheur de file d'attente s'exécute pour les messages Stockage File d'attente, et le déclencheur Event Grid reçoit les événements d'un abonnement aux événements. blob_input est une liaison d'entrée qui ne peut pas démarrer une fonction ; route est un déclencheur HTTP.
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
