id: ai200-3b-local-settings
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Proseware runs a Python function project locally with Azure Functions Core Tools. The functions read the endpoint of an Azure OpenAI resource and a test API key from environment variables. These values must be available when the app runs on the developer's computer and must never be published to Azure with the project.

    Where should the developer store the values?
  fr: |
    Un développeur de Proseware exécute un projet de fonctions Python en local avec Azure Functions Core Tools. Les fonctions lisent le point de terminaison d'une ressource Azure OpenAI et une clé d'API de test dans des variables d'environnement. Ces valeurs doivent être disponibles quand l'application s'exécute sur l'ordinateur du développeur et ne doivent jamais être publiées dans Azure avec le projet.

    Où le développeur doit-il stocker les valeurs ?
body:
  options:
    - { id: a, text: { en: "In the Values section of local.settings.json", fr: "Dans la section Values de local.settings.json" } }
    - { id: b, text: { en: "In the extensions section of host.json", fr: "Dans la section extensions de host.json" } }
    - { id: c, text: { en: "In requirements.txt, as environment markers", fr: "Dans requirements.txt, comme marqueurs d'environnement" } }
    - { id: d, text: { en: "In function_app.py, as module-level constants", fr: "Dans function_app.py, comme constantes au niveau du module" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      local.settings.json holds the local-only app settings and secrets of the project; its Values are exposed as environment variables when the app runs locally, and the file is never published. In Azure, the same names are defined as app settings of the function app.
    fr: |
      local.settings.json contient les paramètres d'application et secrets propres à l'exécution locale du projet ; ses Values sont exposées comme variables d'environnement quand l'application s'exécute en local, et le fichier n'est jamais publié. Dans Azure, les mêmes noms sont définis comme paramètres d'application de l'application de fonction.
  options:
    b: { en: "host.json is the published runtime configuration of all functions; it isn't meant for secrets.", fr: "host.json est la configuration du runtime, publiée, de toutes les fonctions ; il n'est pas destiné aux secrets." }
    c: { en: "requirements.txt lists the Python packages to install.", fr: "requirements.txt liste les packages Python à installer." }
    d: { en: "Constants in code are published with the project, which exposes the key.", fr: "Les constantes du code sont publiées avec le projet, ce qui expose la clé." }
references:
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
