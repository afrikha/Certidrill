id: ai200-cs4b-partner-plan
objective: "3.2.2"
type: multi
caseStudy: ai200-cs4b-southridge
difficulty: 2
status: draft
stem:
  en: |
    You are creating func-southridge-partners in the resource group rg-southridge by using the Azure CLI. The storage account stsouthridgefn already exists.

    You need to meet the partner API requirement. Which two commands should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez func-southridge-partners dans le groupe de ressources rg-southridge à l'aide d'Azure CLI. Le compte de stockage stsouthridgefn existe déjà.

    Vous devez satisfaire l'exigence relative à l'API partenaires. Quelles sont les deux commandes à exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: "az functionapp create -g rg-southridge -n func-southridge-partners --storage-account stsouthridgefn --consumption-plan-location eastus --runtime python --runtime-version 3.11 --os-type Linux"
    - id: b
      text: "az functionapp create -g rg-southridge -n func-southridge-partners --storage-account stsouthridgefn --flexconsumption-location eastus --runtime python --runtime-version 3.11"
    - id: c
      text: "az functionapp scale config always-ready set -g rg-southridge -n func-southridge-partners --settings http=1"
    - id: d
      text: "az functionapp config set -g rg-southridge -n func-southridge-partners --always-on true"
    - id: e
      text: "az functionapp scale config set -g rg-southridge -n func-southridge-partners --trigger-type http --trigger-settings perInstanceConcurrency=1"
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: "The Flex Consumption plan is serverless, bills on demand, supports virtual network integration, and is created with `--flexconsumption-location`. Its always-ready instances keep a number of instances warm for a group of functions: `--settings http=1` keeps one instance ready for the HTTP functions, and only that warm capacity is billed when idle."
    fr: "Le plan Flex Consumption est serverless, facturé à la demande, prend en charge l'intégration de réseau virtuel et se crée avec `--flexconsumption-location`. Ses instances toujours prêtes maintiennent à chaud un nombre d'instances pour un groupe de fonctions : `--settings http=1` garde une instance prête pour les fonctions HTTP, et seule cette capacité à chaud est facturée en l'absence d'activité."
  options:
    a: { en: "`--consumption-plan-location` creates an app on the legacy Consumption plan, which doesn't support virtual network integration or always-ready instances.", fr: "`--consumption-plan-location` crée une application sur le plan Consommation hérité, qui ne prend en charge ni l'intégration de réseau virtuel ni les instances toujours prêtes." }
    d: { en: "Always On is a setting of apps on a Dedicated (App Service) plan; a Flex Consumption app keeps instances warm with always-ready instances.", fr: "Always On est un paramètre des applications d'un plan Dédié (App Service) ; une application Flex Consumption maintient des instances à chaud avec les instances toujours prêtes." }
    e: { en: "`perInstanceConcurrency` sets how many HTTP requests one instance handles at the same time; it doesn't keep any instance ready.", fr: "`perInstanceConcurrency` définit le nombre de requêtes HTTP qu'une instance traite en même temps ; il ne garde aucune instance prête." }
references:
  - title: Create and Manage Function Apps in a Flex Consumption Plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
