id: ai200-cs3b-event-deadletter
objective: "3.1.2"
type: multi
caseStudy: ai200-cs3b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the event subscription that sends the BlobCreated events of stbellowscourse to the ingest queue so that it meets the event delivery requirement.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer l'abonnement aux événements qui envoie les événements BlobCreated de stbellowscourse à la file d'attente ingest pour qu'il respecte l'exigence de remise des événements.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the maximum number of delivery attempts of the event subscription to 2.", fr: "Définir le nombre maximal de tentatives de remise de l'abonnement aux événements sur 2." } }
    - { id: b, text: { en: "Set the event time to live of the event subscription to 120 minutes.", fr: "Définir la durée de vie des événements de l'abonnement aux événements sur 120 minutes." } }
    - { id: c, text: { en: "Enable dead-lettering on message expiration on the ingest queue.", fr: "Activer la mise en file d'attente de lettres mortes à l'expiration des messages sur la file d'attente ingest." } }
    - { id: d, text: { en: "Set the eg-deadletter container of stbellowsops as the dead-letter location of the event subscription.", fr: "Définir le conteneur eg-deadletter de stbellowsops comme emplacement de lettres mortes de l'abonnement aux événements." } }
    - { id: e, text: { en: "Enable output batching on the event subscription with a maximum of 100 events per batch.", fr: "Activer le traitement par lots de sortie sur l'abonnement aux événements avec 100 événements au maximum par lot." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An event time to live of 120 minutes (the range is 1 to 1,440 minutes) stops Event Grid from delivering an event once two hours have passed since it was published. Dead-lettering is not enabled by default; when a storage container is set as the dead-letter location, Event Grid writes the events whose retries or time to live are exhausted to that container instead of dropping them. Event Grid checks the time to live at the next scheduled attempt, so an event can reach the container a little later.
    fr: |
      Une durée de vie des événements de 120 minutes (la plage va de 1 à 1 440 minutes) empêche Event Grid de remettre un événement une fois que deux heures se sont écoulées depuis sa publication. La mise en lettres mortes n'est pas activée par défaut ; quand un conteneur de stockage est défini comme emplacement de lettres mortes, Event Grid écrit dans ce conteneur les événements dont les tentatives ou la durée de vie sont épuisées au lieu de les abandonner. Event Grid vérifie la durée de vie lors de la tentative planifiée suivante : un événement peut donc arriver dans le conteneur un peu plus tard.
  options:
    a:
      en: |
        With two attempts, Event Grid gives up within the first minute of the retry schedule, long before the two hours that the requirement allows.
      fr: |
        Avec deux tentatives, Event Grid abandonne dès la première minute du calendrier de nouvelles tentatives, bien avant les deux heures permises par l'exigence.
    c:
      en: |
        This setting moves expired Service Bus messages that are already in the queue; it does not affect events that Event Grid fails to deliver to the queue.
      fr: |
        Ce paramètre déplace les messages Service Bus expirés déjà présents dans la file d'attente ; il n'a aucun effet sur les événements qu'Event Grid ne parvient pas à remettre à la file d'attente.
    e:
      en: |
        Batching groups events in each delivery; it changes neither the retry duration nor the handling of undelivered events.
      fr: |
        Le traitement par lots regroupe des événements dans chaque remise ; il ne modifie ni la durée des nouvelles tentatives ni le traitement des événements non remis.
references:
  - title: Event Grid message delivery and retry
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
