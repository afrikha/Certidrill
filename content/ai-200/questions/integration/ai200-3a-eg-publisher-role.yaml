id: ai200-3a-eg-publisher-role
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs a container app that publishes "forecast refreshed" events to an Event Grid custom topic named **egt-northwind-forecast**. The app authenticates by using its managed identity and `DefaultAzureCredential`; no access key may be stored.

    You need to assign a role to the managed identity on the topic. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Northwind exécute une application conteneur qui publie des événements « prévision actualisée » dans une rubrique personnalisée Event Grid nommée **egt-northwind-forecast**. L'application s'authentifie avec son identité managée et `DefaultAzureCredential` ; aucune clé d'accès ne doit être stockée.

    Vous devez attribuer un rôle à l'identité managée sur la rubrique. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: EventGrid Contributor }
    - { id: b, text: EventGrid EventSubscription Contributor }
    - { id: c, text: EventGrid Data Sender }
    - { id: d, text: Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: |
      EventGrid Data Sender lets an identity send events to Event Grid topics and nothing more, which is exactly what a publisher that uses Microsoft Entra authentication needs.
    fr: |
      EventGrid Data Sender permet à une identité d'envoyer des événements aux rubriques Event Grid, et rien de plus, ce qui correspond exactement au besoin d'un éditeur qui utilise l'authentification Microsoft Entra.
  options:
    a:
      en: |
        EventGrid Contributor lets the identity create and manage Event Grid resources, far more than publishing.
      fr: |
        EventGrid Contributor permet à l'identité de créer et de gérer des ressources Event Grid, bien plus que publier.
    b:
      en: |
        EventGrid EventSubscription Contributor manages event subscriptions; it doesn't grant permission to send events.
      fr: |
        EventGrid EventSubscription Contributor gère les abonnements aux événements ; il n'accorde pas l'autorisation d'envoyer des événements.
    d:
      en: |
        Contributor is a broad management role and isn't the least-privileged data role for publishing.
      fr: |
        Contributor est un rôle de gestion étendu et n'est pas le rôle de données de moindre privilège pour publier.
references:
  - title: Event Grid Access Control with Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/event-grid/security-authorization
