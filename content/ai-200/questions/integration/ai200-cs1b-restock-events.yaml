id: ai200-cs1b-restock-events
objective: "3.1.2"
type: multi
caseStudy: ai200-cs1b-wingtip
difficulty: 1
status: draft
stem:
  en: |
    You are creating the Event Grid event subscription that delivers the events of egt-wingtip-stock to the reorder function.

    You need to meet the restocking requirement. Which two settings should you configure on the event subscription? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez l'abonnement aux événements Event Grid qui remet les événements d'egt-wingtip-stock à la fonction reorder.

    Vous devez satisfaire l'exigence relative au réapprovisionnement. Quels sont les deux paramètres à configurer sur l'abonnement aux événements ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Event types filter: `Wingtip.Stock.Low`", fr: "Filtre des types d'événements : `Wingtip.Stock.Low`" } }
    - { id: b, text: { en: "Subject begins with: `/warehouses/eu/`", fr: "Le sujet commence par : `/warehouses/eu/`" } }
    - { id: c, text: { en: "Subject ends with: `/eu`", fr: "Le sujet se termine par : `/eu`" } }
    - { id: d, text: { en: "Dead-lettering to the deadletters container of stwingtipdl", fr: "Mise en file d'attente de lettres mortes vers le conteneur deadletters de stwingtipdl" } }
    - { id: e, text: { en: "Retry policy with a maximum of 1 delivery attempt", fr: "Stratégie de nouvelles tentatives avec 1 tentative de remise au maximum" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The event types filter keeps only `Wingtip.Stock.Low`, and a subject-begins-with filter of `/warehouses/eu/` keeps only the EU warehouses, because the subject format is `/warehouses/<region>/<sku>`. Both filters apply together, so only the events that match the type and the subject prefix are delivered.
    fr: |
      Le filtre des types d'événements ne conserve que `Wingtip.Stock.Low`, et un filtre « le sujet commence par » `/warehouses/eu/` ne conserve que les entrepôts de l'UE, car le sujet a le format `/warehouses/<region>/<sku>`. Les deux filtres s'appliquent ensemble : seuls les événements qui correspondent au type et au préfixe du sujet sont remis.
  options:
    c:
      en: "Subjects end with the SKU, not with the region, so this filter would match no event."
      fr: "Les sujets se terminent par la référence (SKU), pas par la région : ce filtre ne correspondrait à aucun événement."
    d:
      en: "A dead-letter destination stores the events that could not be delivered; it does not filter the events that are delivered."
      fr: "Une destination de lettres mortes stocke les événements qui n'ont pas pu être remis ; elle ne filtre pas les événements remis."
    e:
      en: "The retry policy controls how many times Event Grid tries to deliver an event, not which events are delivered."
      fr: "La stratégie de nouvelles tentatives contrôle le nombre de tentatives de remise d'un événement, pas les événements qui sont remis."
references:
  - title: Event Grid message delivery and retry
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
