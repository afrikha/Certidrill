id: ai200-3a-dlq-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Service Bus queue named **jobs** with a default message time to live of 1 day, and a topic named **results** with three subscriptions. Dead-lettering on message expiration is disabled on jobs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une file d'attente Service Bus nommée **jobs** dont la durée de vie par défaut des messages est de 1 jour, et d'une rubrique nommée **results** avec trois abonnements. Les lettres mortes à l'expiration des messages sont désactivées sur jobs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Messages in the dead-letter queue of jobs are deleted automatically one day after they were dead-lettered.
        fr: |
          Les messages de la file d'attente de lettres mortes de jobs sont supprimés automatiquement un jour après leur placement en lettres mortes.
    - id: s2
      text:
        en: |
          A message that expires in jobs before it is received is dropped instead of being moved to the dead-letter queue.
        fr: |
          Un message qui expire dans jobs avant d'être reçu est supprimé au lieu d'être déplacé vers la file d'attente de lettres mortes.
    - id: s3
      text:
        en: |
          Each of the three subscriptions of results has its own dead-letter queue.
        fr: |
          Chacun des trois abonnements de results possède sa propre file d'attente de lettres mortes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The dead-letter queue doesn't observe the time to live, and nothing cleans it up for you; messages stay there until a receiver receives and completes them. With dead-lettering on message expiration disabled, expired messages are dropped. Every queue and every topic subscription has a dead-letter subqueue, created automatically.
    fr: |
      La file d'attente de lettres mortes ne tient pas compte de la durée de vie, et rien ne la nettoie à votre place ; les messages y restent jusqu'à ce qu'un récepteur les reçoive et les termine. Lorsque les lettres mortes à l'expiration des messages sont désactivées, les messages expirés sont supprimés. Chaque file d'attente et chaque abonnement de rubrique possède une sous-file de lettres mortes, créée automatiquement.
references:
  - title: Service Bus Dead-Letter Queues
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues
  - title: Azure Service Bus Message Expiration and TTL Explained
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-expiration
