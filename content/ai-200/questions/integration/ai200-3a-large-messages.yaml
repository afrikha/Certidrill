id: ai200-3a-large-messages
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Lucerne Publishing digitizes old books. A Python scanner app sends each page to a Service Bus queue named **ocr-pages** as a single message that contains the page image and its raw OCR text, between 4 MB and 8 MB per message. An AI worker refines the text.

    The namespace is in the Standard tier, and the sends fail. The app must keep sending each page as one message through the azure-servicebus library.

    What should you do?
  fr: |
    Lucerne Publishing numérise des livres anciens. Une application de numérisation en Python envoie chaque page à une file d'attente Service Bus nommée **ocr-pages** sous forme d'un message unique contenant l'image de la page et son texte OCR brut, de 4 à 8 Mo par message. Un worker d'IA affine le texte.

    L'espace de noms est au niveau Standard et les envois échouent. L'application doit continuer d'envoyer chaque page en un seul message avec la bibliothèque azure-servicebus.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create ocr-pages again with partitioning enabled.", fr: "Recréer ocr-pages avec le partitionnement activé." } }
    - { id: b, text: { en: "Send each page inside a ServiceBusMessageBatch.", fr: "Envoyer chaque page dans un ServiceBusMessageBatch." } }
    - { id: c, text: { en: "Move to a Premium namespace and keep the default settings of ocr-pages.", fr: "Passer à un espace de noms Premium et conserver les paramètres par défaut d'ocr-pages." } }
    - { id: d, text: { en: "Move to a Premium namespace and set the maximum message size of ocr-pages to 10,240 KB.", fr: "Passer à un espace de noms Premium et définir la taille maximale des messages d'ocr-pages sur 10 240 Ko." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Standard namespace accepts messages up to 256 KB. Premium supports single messages up to 100 MB over AMQP, which the Python library uses, but each entity allows 1 MB by default, so the maximum message size of the queue (`--max-message-size` in the CLI) must be raised above 8 MB.
    fr: |
      Un espace de noms Standard accepte des messages jusqu'à 256 Ko. Premium prend en charge des messages uniques jusqu'à 100 Mo sur AMQP, le protocole utilisé par la bibliothèque Python, mais chaque entité autorise 1 Mo par défaut : la taille maximale des messages de la file d'attente (`--max-message-size` dans la CLI) doit donc dépasser 8 Mo.
  options:
    a:
      en: |
        Partitioning spreads an entity over several message brokers; the message size limit of the tier is unchanged.
      fr: |
        Le partitionnement répartit une entité sur plusieurs répartiteurs de messages ; la taille limite des messages du niveau reste inchangée.
    b:
      en: |
        A batch can't be larger than the maximum message size, and in Premium batches are limited to 1 MB.
      fr: |
        Un lot ne peut pas dépasser la taille maximale d'un message, et en Premium les lots sont limités à 1 Mo.
    c:
      en: |
        With the default settings, a Premium entity still rejects messages larger than 1 MB.
      fr: |
        Avec les paramètres par défaut, une entité Premium rejette encore les messages de plus de 1 Mo.
references:
  - title: Microsoft Azure Service Bus quotas and limits
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-quotas
  - title: az servicebus queue
    url: https://learn.microsoft.com/en-us/cli/azure/servicebus/queue
