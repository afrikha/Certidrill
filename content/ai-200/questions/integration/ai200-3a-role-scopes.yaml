id: ai200-3a-role-scopes
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Trey Research has a function app named **func-trey-embed** that uses a system-assigned managed identity. The function reads text chunks from a queue named **chunks** and sends the computed embeddings to a topic named **embeddings**. Both entities are in the Service Bus namespace **sb-trey**, which also contains other queues.

    You need to grant the identity the permissions it needs, following the principle of least privilege.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trey Research dispose d'une application de fonction nommée **func-trey-embed** qui utilise une identité managée affectée par le système. La fonction lit des segments de texte dans une file d'attente nommée **chunks** et envoie les incorporations calculées à une rubrique nommée **embeddings**. Les deux entités se trouvent dans l'espace de noms Service Bus **sb-trey**, qui contient aussi d'autres files d'attente.

    Vous devez accorder à l'identité les autorisations dont elle a besoin, selon le principe du moindre privilège.

    Quelles sont les deux attributions de rôle à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure Service Bus Data Owner, scoped to sb-trey", fr: "Azure Service Bus Data Owner, avec l'étendue sb-trey" } }
    - { id: b, text: { en: "Azure Service Bus Data Receiver, scoped to the chunks queue", fr: "Azure Service Bus Data Receiver, avec l'étendue de la file d'attente chunks" } }
    - { id: c, text: { en: "Azure Service Bus Data Sender, scoped to the chunks queue", fr: "Azure Service Bus Data Sender, avec l'étendue de la file d'attente chunks" } }
    - { id: d, text: { en: "Azure Service Bus Data Sender, scoped to the embeddings topic", fr: "Azure Service Bus Data Sender, avec l'étendue de la rubrique embeddings" } }
    - { id: e, text: { en: "Contributor, scoped to sb-trey", fr: "Contributor, avec l'étendue sb-trey" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Service Bus Data Receiver grants receive access and Azure Service Bus Data Sender grants send access. Both roles can be assigned at the scope of a single queue or topic, which is narrower than the namespace and gives the function access only to the two entities it uses.
    fr: |
      Azure Service Bus Data Receiver accorde l'accès en réception et Azure Service Bus Data Sender l'accès en envoi. Les deux rôles peuvent être attribués à l'étendue d'une seule file d'attente ou rubrique, plus étroite que l'espace de noms, ce qui limite la fonction aux deux entités qu'elle utilise.
  options:
    a:
      en: |
        Data Owner grants full access to every entity of the namespace, far more than receiving from one queue and sending to one topic.
      fr: |
        Data Owner accorde un accès complet à toutes les entités de l'espace de noms, bien plus que la réception depuis une file et l'envoi vers une rubrique.
    c:
      en: |
        The function only reads from chunks; sending to it isn't required.
      fr: |
        La fonction ne fait que lire chunks ; y envoyer des messages n'est pas nécessaire.
    e:
      en: |
        Contributor is a management role; it doesn't grant the data permissions to send or receive messages with Microsoft Entra ID.
      fr: |
        Contributor est un rôle de gestion ; il n'accorde pas les autorisations sur les données pour envoyer ou recevoir des messages avec Microsoft Entra ID.
references:
  - title: Authenticate an Application to Access Azure Service Bus Entities
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/authenticate-application
