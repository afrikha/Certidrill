id: ai200-3a-dlq-resubmit-order
objective: "3.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Graphic Design Institute runs an image-tagging worker that reads a Service Bus queue named **ingest**. After a bug fix, you write a Python repair job for the messages that the worker dead-lettered.

    The job must use the reason recorded by Service Bus to decide whether each message can be fixed, give the fixable messages a new chance in ingest, and remove the handled messages from the dead-letter queue. No message can be lost if the job stops in the middle of a message.

    Which four actions should the job perform in sequence for the dead-lettered messages? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Graphic Design Institute exécute un worker d'étiquetage d'images qui lit une file d'attente Service Bus nommée **ingest**. Après la correction d'un bogue, vous écrivez en Python une tâche de réparation pour les messages que le worker a placés en lettres mortes.

    La tâche doit utiliser la raison enregistrée par Service Bus pour décider si chaque message est réparable, redonner une chance aux messages réparables dans ingest, et supprimer les messages traités de la file d'attente de lettres mortes. Aucun message ne doit être perdu si la tâche s'arrête au milieu d'un message.

    Quelles sont les quatre actions que la tâche doit effectuer dans l'ordre pour les messages de lettres mortes ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open a receiver on ingest with sub_queue=ServiceBusSubQueue.DEAD_LETTER.", fr: "Ouvrir un récepteur sur ingest avec sub_queue=ServiceBusSubQueue.DEAD_LETTER." } }
    - { id: reason, text: { en: "Read the dead_letter_reason of the message to decide whether it can be fixed.", fr: "Lire la propriété dead_letter_reason du message pour décider s'il est réparable." } }
    - { id: resend, text: { en: "Send a corrected copy of the message to ingest.", fr: "Envoyer une copie corrigée du message à ingest." } }
    - { id: complete, text: { en: "Call complete_message on the message received from the dead-letter queue.", fr: "Appeler complete_message sur le message reçu de la file d'attente de lettres mortes." } }
    - { id: abandon, text: { en: "Call abandon_message on the dead-lettered message so that Service Bus returns it to ingest.", fr: "Appeler abandon_message sur le message en lettres mortes pour que Service Bus le renvoie dans ingest." } }
    - { id: deadletter, text: { en: "Call dead_letter_message on the dead-lettered message to move it back to ingest.", fr: "Appeler dead_letter_message sur le message en lettres mortes pour le replacer dans ingest." } }
answer:
  sequence: [ open, reason, resend, complete ]
explanation:
  correct:
    en: |
      The dead-letter queue is read with a receiver opened on the parent queue with sub_queue=ServiceBusSubQueue.DEAD_LETTER, and each message carries the reason and description recorded when it was dead-lettered. A message only goes back to processing when you send a new copy to ingest. Completing the dead-lettered message after the send means that a crash between the two steps leaves a duplicate rather than a lost message.
    fr: |
      La file d'attente de lettres mortes se lit avec un récepteur ouvert sur la file parente avec sub_queue=ServiceBusSubQueue.DEAD_LETTER, et chaque message porte la raison et la description enregistrées lors de son placement en lettres mortes. Un message ne revient au traitement que si vous envoyez une nouvelle copie dans ingest. Terminer le message de lettres mortes après l'envoi garantit qu'un plantage entre les deux étapes laisse un doublon plutôt qu'un message perdu.
  options:
    abandon:
      en: |
        Abandoning only releases the lock; the message stays in the dead-letter queue, which never retries anything by itself.
      fr: |
        L'abandon ne fait que libérer le verrou ; le message reste dans la file d'attente de lettres mortes, qui ne réessaie jamais rien d'elle-même.
    deadletter:
      en: |
        A message can't be dead-lettered from a dead-letter queue.
      fr: |
        Un message ne peut pas être placé en lettres mortes depuis une file d'attente de lettres mortes.
references:
  - title: Service Bus Dead-Letter Queues
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues
