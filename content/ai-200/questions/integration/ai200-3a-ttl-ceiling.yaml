id: ai200-3a-ttl-ceiling
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fourth Coffee has a Service Bus queue named **alerts** that has a default message time to live of 30 minutes. Dead-lettering on message expiration is disabled.

    A Python producer sends an anomaly alert by using `ServiceBusMessage(body, time_to_live=timedelta(hours=2))`. No receiver is running.

    What happens to the alert?
  fr: |
    Fourth Coffee dispose d'une file d'attente Service Bus nommée **alerts** dont la durée de vie par défaut des messages est de 30 minutes. Les lettres mortes à l'expiration des messages sont désactivées.

    Un producteur Python envoie une alerte d'anomalie avec `ServiceBusMessage(body, time_to_live=timedelta(hours=2))`. Aucun récepteur n'est en cours d'exécution.

    Que devient l'alerte ?
body:
  options:
    - { id: a, text: { en: "It expires 2 hours after it is enqueued and is moved to the dead-letter queue.", fr: "Elle expire 2 heures après sa mise en file d'attente et est déplacée vers la file d'attente de lettres mortes." } }
    - { id: b, text: { en: "It expires 2 hours after it is enqueued and is dropped.", fr: "Elle expire 2 heures après sa mise en file d'attente et est supprimée." } }
    - { id: c, text: { en: "It expires 30 minutes after it is enqueued and is moved to the dead-letter queue.", fr: "Elle expire 30 minutes après sa mise en file d'attente et est déplacée vers la file d'attente de lettres mortes." } }
    - { id: d, text: { en: "It expires 30 minutes after it is enqueued and is dropped.", fr: "Elle expire 30 minutes après sa mise en file d'attente et est supprimée." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default time to live of the entity is also a ceiling. A message whose own time to live is longer is silently reduced to the entity default when it is enqueued, so the alert expires after 30 minutes. Because dead-lettering on message expiration is disabled, the expired message is dropped.
    fr: |
      La durée de vie par défaut de l'entité est aussi un plafond. Un message dont la propre durée de vie est plus longue est ramené silencieusement à la valeur par défaut de l'entité lors de sa mise en file d'attente : l'alerte expire donc au bout de 30 minutes. Comme les lettres mortes à l'expiration des messages sont désactivées, le message expiré est supprimé.
  options:
    a:
      en: |
        The 2-hour value is capped by the 30-minute entity default, and dead-lettering on expiration is disabled.
      fr: |
        La valeur de 2 heures est plafonnée par la valeur par défaut de 30 minutes de l'entité, et les lettres mortes à l'expiration sont désactivées.
    b:
      en: |
        A message time to live longer than the entity default doesn't apply; the entity default wins.
      fr: |
        Une durée de vie de message plus longue que la valeur par défaut de l'entité ne s'applique pas ; c'est la valeur de l'entité qui l'emporte.
    c:
      en: |
        Expired messages go to the dead-letter queue only when dead-lettering on message expiration is enabled on the queue.
      fr: |
        Les messages expirés ne vont dans la file d'attente de lettres mortes que si les lettres mortes à l'expiration des messages sont activées sur la file.
references:
  - title: Azure Service Bus Message Expiration and TTL Explained
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-expiration
