id: ai200-3b-remote-build
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at Adatum Corporation builds a Python function app on a Windows computer. The app runs on a Linux Premium plan. The developer installs the packages listed in requirements.txt into the project folder, zips the folder and runs:

    `az functionapp deployment source config-zip -g rg-adatum -n func-adatum-nlp --src app.zip`

    After deployment, functions fail when they import a package that contains native libraries.

    You need to fix the deployment.

    What should you do?
  fr: |
    Un développeur d'Adatum Corporation crée une application de fonction Python sur un ordinateur Windows. L'application s'exécute sur un plan Premium Linux. Le développeur installe les packages listés dans requirements.txt dans le dossier du projet, compresse le dossier et exécute :

    `az functionapp deployment source config-zip -g rg-adatum -n func-adatum-nlp --src app.zip`

    Après le déploiement, les fonctions échouent quand elles importent un package qui contient des bibliothèques natives.

    Vous devez corriger le déploiement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the WEBSITE_RUN_FROM_PACKAGE app setting to 1 and deploy the same zip file again.", fr: "Définir le paramètre d'application WEBSITE_RUN_FROM_PACKAGE sur 1 et déployer à nouveau le même fichier zip." } }
    - { id: b, text: { en: "Add the packages to the extensionBundle section of host.json and redeploy.", fr: "Ajouter les packages à la section extensionBundle de host.json et redéployer." } }
    - { id: c, text: { en: "Deploy the project without the locally installed packages and add --build-remote true to the command.", fr: "Déployer le projet sans les packages installés localement et ajouter --build-remote true à la commande." } }
    - { id: d, text: { en: "Change the FUNCTIONS_WORKER_RUNTIME app setting to python and restart the app.", fr: "Passer le paramètre d'application FUNCTIONS_WORKER_RUNTIME à python et redémarrer l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a Python app developed on Windows is deployed to Linux, a local build can include libraries built for the wrong platform. Requesting a remote build makes the platform install the dependencies of requirements.txt on Linux during deployment.
    fr: |
      Quand une application Python développée sous Windows est déployée sous Linux, une build locale peut inclure des bibliothèques compilées pour la mauvaise plateforme. Demander une build distante fait installer par la plateforme les dépendances de requirements.txt sous Linux pendant le déploiement.
  options:
    a: { en: "Running from the package doesn't change the libraries it contains, and WEBSITE_RUN_FROM_PACKAGE must not be set with a remote build.", fr: "Exécuter à partir du package ne change pas les bibliothèques qu'il contient, et WEBSITE_RUN_FROM_PACKAGE ne doit pas être défini avec une build distante." }
    b: { en: "Extension bundles provide binding extensions, not Python packages.", fr: "Les bundles d'extensions fournissent des extensions de liaison, pas des packages Python." }
    d: { en: "The functions already run in the Python worker; the problem is the platform of the packaged libraries.", fr: "Les fonctions s'exécutent déjà dans le Worker Python ; le problème est la plateforme des bibliothèques empaquetées." }
references:
  - title: Deployment technologies in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-technologies
  - title: Python developer reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python
