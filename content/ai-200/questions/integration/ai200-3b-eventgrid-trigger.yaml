id: ai200-3b-eventgrid-trigger
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank publishes custom events to an Event Grid topic when a new model deployment becomes available. An event subscription delivers the events, in the Event Grid schema, to a Python function (v2 programming model). The function must read the `deploymentName` property of the event data.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie des événements personnalisés dans une rubrique Event Grid quand un nouveau déploiement de modèle est disponible. Un abonnement aux événements remet les événements, au schéma Event Grid, à une fonction Python (modèle de programmation v2). La fonction doit lire la propriété `deploymentName` des données de l'événement.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    @app.[[dec]](arg_name="event")
    def on_model_event(event: [[etype]]) -> None:
        if event.event_type == "Woodgrove.Models.Deployed":
            data = event.[[method]]()
            refresh_routing(data["deploymentName"])
  slots:
    - id: dec
      options:
        - { id: eg, text: "event_grid_trigger" }
        - { id: eh, text: "event_hub_message_trigger" }
        - { id: route, text: "route" }
    - id: etype
      options:
        - { id: egevent, text: "func.EventGridEvent" }
        - { id: ehevent, text: "func.EventHubEvent" }
        - { id: req, text: "func.HttpRequest" }
    - id: method
      options:
        - { id: json, text: "get_json" }
        - { id: body, text: "get_body" }
        - { id: params, text: "route_params.get" }
answer:
  values: { dec: eg, etype: egevent, method: json }
explanation:
  correct:
    en: "`@app.event_grid_trigger` passes a `func.EventGridEvent` that exposes `id`, `topic`, `subject` and `event_type`, and returns the `data` payload with `get_json()`. Event Grid sends events in an array; the runtime invokes the function once per event."
    fr: "`@app.event_grid_trigger` transmet un `func.EventGridEvent` qui expose `id`, `topic`, `subject` et `event_type`, et renvoie la charge utile `data` avec `get_json()`. Event Grid envoie les événements dans un tableau ; le runtime appelle la fonction une fois par événement."
  options:
    eh: { en: "The events come from an Event Grid topic, not from an event hub.", fr: "Les événements proviennent d'une rubrique Event Grid, pas d'un hub d'événements." }
    route: { en: "An HTTP trigger would receive the raw array of events and would have to handle the subscription itself.", fr: "Un déclencheur HTTP recevrait le tableau brut d'événements et devrait gérer lui-même l'abonnement." }
    ehevent: { en: "func.EventHubEvent is the type of Event Hubs triggers.", fr: "func.EventHubEvent est le type des déclencheurs Event Hubs." }
    req: { en: "func.HttpRequest is the type of HTTP triggers.", fr: "func.HttpRequest est le type des déclencheurs HTTP." }
    body: { en: "The event data of an EventGridEvent is read with get_json().", fr: "Les données d'un EventGridEvent se lisent avec get_json()." }
    params: { en: "route_params belongs to HTTP requests.", fr: "route_params appartient aux requêtes HTTP." }
references:
  - title: Azure Event Grid trigger for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-event-grid-trigger
