id: ai200-sr1-private-functions-2
objective: "3.2.2"
type: series_yesno
series: ai200-sr1-private-functions
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You host the app in a Consumption plan on Linux.
  fr: Vous hébergez l'application dans un plan Consumption sur Linux.
body:
  solution:
    en: |
      You create func-adatum-enrich on Linux in a **Consumption** plan. You allow the outbound IP addresses of the function app in the firewall of the Cosmos DB account.
    fr: |
      Vous créez func-adatum-enrich sur Linux dans un plan **Consumption**. Vous autorisez les adresses IP sortantes de l'application de fonction dans le pare-feu du compte Cosmos DB.
answer: { value: false }
explanation:
  correct:
    en: The Consumption plan scales to zero, but it does not support virtual network integration, so the functions cannot reach the private endpoint in vnet-adatum. Allowing outbound IP addresses has no effect because public network access is disabled on the account. Hosting on Linux in a Consumption plan is also retiring, and new apps should use Flex Consumption.
    fr: "Le plan Consumption se met à l'échelle jusqu'à zéro, mais il ne prend pas en charge l'intégration au réseau virtuel : les fonctions ne peuvent pas atteindre le point de terminaison privé dans vnet-adatum. Autoriser les adresses IP sortantes n'a aucun effet, car l'accès au réseau public est désactivé sur le compte. L'hébergement sur Linux dans un plan Consumption est en outre en cours de mise hors service, et les nouvelles applications doivent utiliser Flex Consumption."
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
