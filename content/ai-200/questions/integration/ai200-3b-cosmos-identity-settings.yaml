id: ai200-3b-cosmos-identity-settings
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Python function app named **func-pro-kb** whose Cosmos DB trigger is declared with `connection="CosmosKb"`. The app must connect to the account **cosmos-pro-kb** by using the user-assigned managed identity **id-pro-kb**, which is attached to the app and has the required data-plane role. No account key may be stored.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une application de fonction Python nommée **func-pro-kb** dont le déclencheur Cosmos DB est déclaré avec `connection="CosmosKb"`. L'application doit se connecter au compte **cosmos-pro-kb** avec l'identité managée affectée par l'utilisateur **id-pro-kb**, qui est attachée à l'application et dispose du rôle de plan de données requis. Aucune clé de compte ne doit être stockée.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az functionapp config appsettings set -g rg-pro -n func-pro-kb --settings \
      "CosmosKb__[[endpoint]]=https://cosmos-pro-kb.documents.azure.com:443/" \
      "CosmosKb__[[cred]]=managedidentity" \
      "CosmosKb__[[id]]=<client ID of id-pro-kb>"
  slots:
    - id: endpoint
      options:
        - { id: account, text: "accountEndpoint" }
        - { id: fqns, text: "fullyQualifiedNamespace" }
        - { id: name, text: "accountName" }
    - id: cred
      options:
        - { id: credential, text: "credential" }
        - { id: type, text: "type" }
        - { id: auth, text: "authentication" }
    - id: id
      options:
        - { id: client, text: "clientId" }
        - { id: principal, text: "principalId" }
        - { id: object, text: "objectId" }
answer:
  values: { endpoint: account, cred: credential, id: client }
explanation:
  correct:
    en: "The `connection` value is a prefix shared by several settings. For Cosmos DB, `CosmosKb__accountEndpoint` gives the account endpoint, `CosmosKb__credential=managedidentity` selects managed identity authentication, and `CosmosKb__clientId` picks the user-assigned identity; without clientId, the system-assigned identity is used."
    fr: "La valeur de `connection` est un préfixe partagé par plusieurs paramètres. Pour Cosmos DB, `CosmosKb__accountEndpoint` donne le point de terminaison du compte, `CosmosKb__credential=managedidentity` sélectionne l'authentification par identité managée, et `CosmosKb__clientId` choisit l'identité affectée par l'utilisateur ; sans clientId, l'identité affectée par le système est utilisée."
  options:
    fqns: { en: "fullyQualifiedNamespace is used for Service Bus and Event Hubs namespaces.", fr: "fullyQualifiedNamespace s'utilise pour les espaces de noms Service Bus et Event Hubs." }
    name: { en: "accountName is the shortcut syntax specific to the AzureWebJobsStorage connection.", fr: "accountName est la syntaxe abrégée propre à la connexion AzureWebJobsStorage." }
    type: { en: "The authentication method is selected by the credential property.", fr: "La méthode d'authentification se choisit avec la propriété credential." }
    auth: { en: "The authentication method is selected by the credential property.", fr: "La méthode d'authentification se choisit avec la propriété credential." }
    principal: { en: "The identity is selected by its client ID, not by its principal ID.", fr: "L'identité se sélectionne par son ID client, pas par son ID de principal." }
    object: { en: "The identity is selected by its client ID, not by its object ID.", fr: "L'identité se sélectionne par son ID client, pas par son ID d'objet." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
