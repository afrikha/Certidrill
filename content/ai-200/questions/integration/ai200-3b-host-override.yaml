id: ai200-3b-host-override
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs a Python function app on a Premium plan with a staging deployment slot. The host.json file in the deployment package sets `"logging": { "logLevel": { "default": "Warning" } }`.

    In the staging slot only, the default log level must be Information. You must not change host.json or redeploy the code.

    Which app setting should you add to the staging slot?
  fr: |
    Fabrikam exécute une application de fonction Python sur un plan Premium avec un emplacement de déploiement de préproduction. Le fichier host.json du package de déploiement définit `"logging": { "logLevel": { "default": "Warning" } }`.

    Dans l'emplacement de préproduction uniquement, le niveau de journalisation par défaut doit être Information. Vous ne devez ni modifier host.json ni redéployer le code.

    Quel paramètre d'application devez-vous ajouter à l'emplacement de préproduction ?
body:
  options:
    - { id: a, text: "AzureFunctionsJobHost__logging__logLevel__default = Information" }
    - { id: b, text: "logging__logLevel__default = Information" }
    - { id: c, text: "AzureWebJobs__logging__logLevel__default = Information" }
    - { id: d, text: "AzureFunctionsJobHost.logging.logLevel.default = Information" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An app setting named `AzureFunctionsJobHost__path__to__setting` overrides the host.json setting at `path.to.setting`, with the dots of the JSON hierarchy replaced by double underscores. Marked as a deployment slot setting, it applies to the staging slot only.
    fr: |
      Un paramètre d'application nommé `AzureFunctionsJobHost__path__to__setting` remplace le paramètre host.json situé à `path.to.setting`, les points de la hiérarchie JSON étant remplacés par des doubles traits de soulignement. Marqué comme paramètre d'emplacement de déploiement, il ne s'applique qu'à l'emplacement de préproduction.
  options:
    b: { en: "Without the AzureFunctionsJobHost prefix, the runtime treats the value as an ordinary app setting.", fr: "Sans le préfixe AzureFunctionsJobHost, le runtime traite la valeur comme un paramètre d'application ordinaire." }
    c: { en: "The override prefix is AzureFunctionsJobHost, not AzureWebJobs.", fr: "Le préfixe de remplacement est AzureFunctionsJobHost, pas AzureWebJobs." }
    d: { en: "In app settings, the JSON hierarchy is expressed with double underscores, not dots.", fr: "Dans les paramètres d'application, la hiérarchie JSON s'exprime avec des doubles traits de soulignement, pas des points." }
references:
  - title: host.json reference for Azure Functions 2.x
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-host-json
  - title: App settings reference for Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-app-settings
