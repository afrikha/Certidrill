id: ai200-3a-eg-advanced-combo
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes "evaluation completed" events to an Event Grid custom topic. The data of each event contains `region` (for example `emea`, `apac` or `amer`) and `score`, a number between 0 and 1.

    An event subscription must deliver to the review function only the events whose region is emea or apac and whose score is strictly lower than 0.8.

    Which two advanced filters should you add to the event subscription? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie des événements « évaluation terminée » dans une rubrique personnalisée Event Grid. Les données de chaque événement contiennent `region` (par exemple `emea`, `apac` ou `amer`) et `score`, un nombre compris entre 0 et 1.

    Un abonnement aux événements ne doit remettre à la fonction de relecture que les événements dont la région est emea ou apac et dont le score est strictement inférieur à 0,8.

    Quels sont les deux filtres avancés à ajouter à l'abonnement aux événements ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "StringIn on data.region with the values emea and apac", fr: "StringIn sur data.region avec les valeurs emea et apac" } }
    - { id: b, text: { en: "StringContains on data.region with the value emea, and a second StringContains on data.region with the value apac", fr: "StringContains sur data.region avec la valeur emea, et un second StringContains sur data.region avec la valeur apac" } }
    - { id: c, text: { en: "NumberLessThan on data.score with the value 0.8", fr: "NumberLessThan sur data.score avec la valeur 0.8" } }
    - { id: d, text: { en: "NumberLessThanOrEquals on data.score with the value 0.8", fr: "NumberLessThanOrEquals sur data.score avec la valeur 0.8" } }
    - { id: e, text: { en: "StringBeginsWith on subject with the values emea and apac", fr: "StringBeginsWith sur subject avec les valeurs emea et apac" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Several values in one advanced filter are combined with OR, so a single StringIn filter with emea and apac accepts either region. Several filters are combined with AND, so adding NumberLessThan 0.8 on data.score keeps only the low scores of those regions.
    fr: |
      Plusieurs valeurs dans un même filtre avancé se combinent par OU : un seul filtre StringIn avec emea et apac accepte l'une ou l'autre région. Plusieurs filtres se combinent par ET : ajouter NumberLessThan 0.8 sur data.score ne conserve que les scores faibles de ces régions.
  options:
    b:
      en: |
        Two separate filters are combined with AND, so an event would need a region that contains both emea and apac.
      fr: |
        Deux filtres distincts se combinent par ET : un événement devrait avoir une région contenant à la fois emea et apac.
    d:
      en: |
        NumberLessThanOrEquals also accepts a score of exactly 0.8, which must be excluded.
      fr: |
        NumberLessThanOrEquals accepte aussi un score d'exactement 0,8, qui doit être exclu.
    e:
      en: |
        The region is in the event data, not at the start of the subject.
      fr: |
        La région se trouve dans les données de l'événement, pas au début de l'objet (subject).
references:
  - title: Event Filtering in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-filtering
