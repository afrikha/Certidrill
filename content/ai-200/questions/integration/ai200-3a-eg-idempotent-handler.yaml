id: ai200-3a-eg-idempotent-handler
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind publishes "stock level changed" events to an Event Grid custom topic. Each event has a unique `id` and its data contains `productId`, `quantity` and `version`, a number that increases with each change of the product. An Azure function writes the latest quantity of each product to a database that an AI demand-planning model reads.

    The database sometimes shows an old quantity, and some changes are applied twice.

    Which two actions should you perform in the function? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind publie des événements « niveau de stock modifié » dans une rubrique personnalisée Event Grid. Chaque événement possède un `id` unique et ses données contiennent `productId`, `quantity` et `version`, un nombre qui augmente à chaque modification du produit. Une fonction Azure écrit la dernière quantité de chaque produit dans une base de données que lit un modèle d'IA de planification de la demande.

    La base de données affiche parfois une ancienne quantité, et certaines modifications sont appliquées deux fois.

    Quelles sont les deux actions à effectuer dans la fonction ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Record the id of each processed event and skip events whose id was already processed.", fr: "Enregistrer l'id de chaque événement traité et ignorer les événements dont l'id a déjà été traité." } }
    - { id: b, text: { en: "Apply the events in the order in which the function receives them.", fr: "Appliquer les événements dans l'ordre où la fonction les reçoit." } }
    - { id: c, text: { en: "Write a quantity only if the version of the event is higher than the version stored for the product.", fr: "N'écrire une quantité que si la version de l'événement est supérieure à la version stockée pour le produit." } }
    - { id: d, text: { en: "Set the maximum number of delivery attempts of the subscription to 1.", fr: "Définir le nombre maximal de tentatives de remise de l'abonnement sur 1." } }
    - { id: e, text: { en: "Set the event time to live of the subscription to 1 minute.", fr: "Définir la durée de vie des événements de l'abonnement sur 1 minute." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Event Grid delivers each event at least once and without ordering guarantees. Skipping already-processed event IDs makes the handler idempotent against duplicates, and comparing the version with the stored one prevents an older event that arrives late from overwriting a newer quantity.
    fr: |
      Event Grid remet chaque événement au moins une fois et sans garantie d'ordre. Ignorer les ID d'événements déjà traités rend le gestionnaire idempotent face aux doublons, et comparer la version à celle stockée empêche un événement plus ancien arrivé en retard d'écraser une quantité plus récente.
  options:
    b:
      en: |
        Event Grid doesn't guarantee delivery order, so the arrival order is exactly what causes old quantities to win.
      fr: |
        Event Grid ne garantit pas l'ordre de remise : l'ordre d'arrivée est précisément ce qui fait gagner les anciennes quantités.
    d:
      en: |
        A single attempt drops events after one failure, and duplicates can still occur because delivery is at least once.
      fr: |
        Une seule tentative supprime les événements après un échec, et des doublons restent possibles puisque la remise est « au moins une fois ».
    e:
      en: |
        A short time to live only makes undelivered events expire sooner; it doesn't prevent duplicates or reordering.
      fr: |
        Une durée de vie courte fait seulement expirer plus tôt les événements non remis ; elle n'empêche ni les doublons ni le désordre.
references:
  - title: Azure Event Grid Delivery and Retry Explained
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
