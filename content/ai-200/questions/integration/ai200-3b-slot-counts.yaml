id: ai200-3b-slot-counts
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is comparing hosting options for several function apps. The release process requires staged deployments with slot swaps.

    How many deployment slots, including production, does each hosting option support? To answer, drag the appropriate values to the correct hosting options. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank compare des options d'hébergement pour plusieurs applications de fonction. Le processus de mise en production exige des déploiements progressifs avec permutation d'emplacements.

    Combien d'emplacements de déploiement, production incluse, chaque option d'hébergement prend-elle en charge ? Pour répondre, faites glisser les valeurs appropriées vers les options d'hébergement correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: none, text: { en: "Not supported", fr: "Non pris en charge" } }
    - { id: two, text: "2" }
    - { id: three, text: "3" }
    - { id: five, text: "5" }
    - { id: twenty, text: { en: "Up to 20", fr: "Jusqu'à 20" } }
  targets:
    - { id: flex, text: "Flex Consumption" }
    - { id: consumption, text: "Consumption" }
    - { id: premium, text: "Premium" }
    - { id: dedicated, text: { en: "Dedicated (App Service plan)", fr: "Dedicated (plan App Service)" } }
answer:
  mapping: { flex: none, consumption: two, premium: three, dedicated: twenty }
explanation:
  correct:
    en: |
      Flex Consumption doesn't currently support deployment slots (it uses site update strategies instead). The Consumption plan allows two slots (production and one staging slot), Premium allows three, and a Dedicated plan allows 1 to 20 depending on its tier. Container Apps hosting uses revisions instead of slots.
    fr: |
      Flex Consumption ne prend pas en charge les emplacements de déploiement actuellement (il utilise des stratégies de mise à jour du site). Le plan Consumption autorise deux emplacements (la production et un emplacement de préproduction), Premium en autorise trois et un plan Dedicated de 1 à 20 selon son niveau. L'hébergement Container Apps utilise des révisions à la place des emplacements.
references:
  - title: Azure Functions deployment slots
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-deployment-slots
