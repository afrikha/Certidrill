id: ai200-cs1c-parts-ordering
objective: "3.1.1"
type: single
caseStudy: ai200-cs1c-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the parts reservation requirement. What should you do?
  fr: |
    Vous devez satisfaire l'exigence relative à la réservation des pièces. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create parts with duplicate detection enabled, and make FieldAssist set the message ID of each work order to the turbine ID.", fr: "Créer parts avec la détection des doublons activée, et faire définir par FieldAssist l'ID de message de chaque ordre de travail sur l'ID de l'éolienne." } }
    - { id: b, text: { en: "Create parts with sessions enabled, and make FieldAssist set the session ID of each work order to the turbine ID.", fr: "Créer parts avec les sessions activées, et faire définir par FieldAssist l'ID de session de chaque ordre de travail sur l'ID de l'éolienne." } }
    - { id: c, text: { en: "Create parts with the default settings, and run a single instance of the parts worker that receives one message at a time.", fr: "Créer parts avec les paramètres par défaut, et exécuter une seule instance du worker des pièces qui reçoit un message à la fois." } }
    - { id: d, text: { en: "Create parts with the default settings, and make the parts worker receive the messages in receive-and-delete mode.", fr: "Créer parts avec les paramètres par défaut, et faire recevoir les messages par le worker des pièces en mode receive-and-delete." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sessions group the messages that share a session ID and deliver them in order. Only one receiver can hold the lock on a session, so the work orders of one turbine are processed one at a time, while other receivers process the sessions of other turbines in parallel. The Standard tier of sb-litware supports sessions, and the sender sets the session ID of each message.
    fr: |
      Les sessions regroupent les messages qui partagent un ID de session et les remettent dans l'ordre. Un seul récepteur peut détenir le verrou d'une session : les ordres de travail d'une éolienne sont traités un par un, tandis que d'autres récepteurs traitent en parallèle les sessions des autres éoliennes. Le niveau Standard de sb-litware prend en charge les sessions, et l'expéditeur définit l'ID de session de chaque message.
  options:
    a:
      en: "Duplicate detection discards a message whose ID was already sent during the detection window, so the later work orders of a turbine would be lost."
      fr: "La détection des doublons ignore un message dont l'ID a déjà été envoyé pendant la fenêtre de détection : les ordres de travail suivants d'une éolienne seraient perdus."
    c:
      en: "A single receiver that handles one message at a time also serializes the work orders of different turbines, which violates the parallelism requirement."
      fr: "Un seul récepteur qui traite un message à la fois sérialise aussi les ordres de travail d'éoliennes différentes, ce qui enfreint l'exigence de parallélisme."
    d:
      en: "Receive-and-delete mode removes each message as soon as it is delivered; it neither groups nor orders the work orders of a turbine."
      fr: "Le mode receive-and-delete supprime chaque message dès sa remise ; il ne regroupe ni n'ordonne les ordres de travail d'une éolienne."
references:
  - title: Message sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
