id: ai200-3a-eg-endpoint-types
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Trey Research is creating event subscriptions on an Event Grid custom topic that carries "dataset refreshed" events. The team wants the events to land in Azure services from which its AI pipelines already read.

    Which two services can you select as the endpoint of an event subscription?

    NOTE: Each correct selection is worth one point.
  fr: |
    Trey Research crée des abonnements aux événements sur une rubrique personnalisée Event Grid qui transporte des événements « jeu de données actualisé ». L'équipe veut que les événements arrivent dans des services Azure que ses pipelines d'IA lisent déjà.

    Quels sont les deux services que vous pouvez sélectionner comme point de terminaison d'un abonnement aux événements ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Azure Cosmos DB for NoSQL container", fr: "Un conteneur Azure Cosmos DB for NoSQL" } }
    - { id: b, text: { en: "A Service Bus topic", fr: "Une rubrique Service Bus" } }
    - { id: c, text: { en: "An Azure Managed Redis database", fr: "Une base de données Azure Managed Redis" } }
    - { id: d, text: { en: "A Storage queue", fr: "Une file d'attente Stockage" } }
    - { id: e, text: { en: "An Azure Database for PostgreSQL table", fr: "Une table Azure Database for PostgreSQL" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Event subscriptions deliver to webhooks, Azure Functions, Event Hubs, Service Bus queues and topics, Storage queues and Relay hybrid connections. Service Bus topics and Storage queues are therefore valid endpoint types (servicebustopic and storagequeue in the CLI).
    fr: |
      Les abonnements aux événements remettent à des webhooks, Azure Functions, Event Hubs, des files d'attente et rubriques Service Bus, des files d'attente Stockage et des connexions hybrides Relay. Les rubriques Service Bus et les files d'attente Stockage sont donc des types de points de terminaison valides (servicebustopic et storagequeue dans la CLI).
  options:
    a:
      en: |
        Cosmos DB isn't an event handler of Event Grid; a function would have to write the events to the container.
      fr: |
        Cosmos DB n'est pas un gestionnaire d'événements d'Event Grid ; une fonction devrait écrire les événements dans le conteneur.
    c:
      en: |
        Azure Managed Redis isn't an event handler of Event Grid.
      fr: |
        Azure Managed Redis n'est pas un gestionnaire d'événements d'Event Grid.
    e:
      en: |
        A database table isn't an event handler of Event Grid; code must insert the events.
      fr: |
        Une table de base de données n'est pas un gestionnaire d'événements d'Event Grid ; du code doit insérer les événements.
references:
  - title: az eventgrid event-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/eventgrid/event-subscription
