id: ai200-3a-forward-chain-order
objective: "3.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Coho Winery collects sensor telemetry from its vineyards for a yield-prediction model. You need a Service Bus topic named **telemetry** with a subscription named **archive** whose messages are moved automatically to a queue named **cold-store** in the same namespace. A batch worker will read cold-store. No Service Bus resource exists yet, and the solution must minimize cost.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Coho Winery collecte la télémétrie des capteurs de ses vignobles pour un modèle de prévision des rendements. Vous avez besoin d'une rubrique Service Bus nommée **telemetry** avec un abonnement nommé **archive** dont les messages sont déplacés automatiquement vers une file d'attente nommée **cold-store** dans le même espace de noms. Un worker par lots lira cold-store. Aucune ressource Service Bus n'existe encore, et la solution doit réduire les coûts au minimum.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: standard, text: { en: "Create a Service Bus namespace in the Standard tier.", fr: "Créer un espace de noms Service Bus au niveau Standard." } }
    - { id: basic, text: { en: "Create a Service Bus namespace in the Basic tier.", fr: "Créer un espace de noms Service Bus au niveau Basic." } }
    - { id: queue, text: { en: "Create the cold-store queue.", fr: "Créer la file d'attente cold-store." } }
    - { id: sub, text: { en: "Create the telemetry topic, then the archive subscription with forward-to set to cold-store.", fr: "Créer la rubrique telemetry, puis l'abonnement archive avec forward-to défini sur cold-store." } }
    - { id: session, text: { en: "Enable sessions on the archive subscription.", fr: "Activer les sessions sur l'abonnement archive." } }
    - { id: receiver, text: { en: "Create a receiver on the archive subscription for the batch worker.", fr: "Créer un récepteur sur l'abonnement archive pour le worker par lots." } }
answer:
  sequence: [ standard, queue, sub ]
explanation:
  correct:
    en: |
      Topics and auto-forwarding aren't available in the Basic tier, so the cheapest option is Standard. The destination of auto-forwarding must exist before the source is created, so cold-store comes before the archive subscription whose forward-to property points to it.
    fr: |
      Les rubriques et le transfert automatique ne sont pas disponibles au niveau Basic : l'option la moins chère est donc Standard. La destination du transfert automatique doit exister avant la création de la source : cold-store vient donc avant l'abonnement archive dont la propriété forward-to pointe vers elle.
  options:
    basic:
      en: |
        The Basic tier supports queues only, without topics or auto-forwarding.
      fr: |
        Le niveau Basic ne prend en charge que les files d'attente, sans rubriques ni transfert automatique.
    session:
      en: |
        A session-enabled queue or subscription can't be an auto-forwarding source.
      fr: |
        Une file d'attente ou un abonnement avec sessions activées ne peut pas être une source de transfert automatique.
    receiver:
      en: |
        Service Bus doesn't allow a receiver on a source entity that has auto-forwarding enabled; the worker reads cold-store.
      fr: |
        Service Bus n'autorise pas de récepteur sur une entité source dont le transfert automatique est activé ; le worker lit cold-store.
references:
  - title: Autoforwarding Azure Service Bus messaging entities
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-auto-forwarding
