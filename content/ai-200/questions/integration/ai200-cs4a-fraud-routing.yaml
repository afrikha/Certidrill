id: ai200-cs4a-fraud-routing
objective: "3.1.1"
type: multi
caseStudy: ai200-cs4a-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    complaint-api sends the complaint messages by using the azure-servicebus library.

    You need to meet the fraud routing requirement. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    complaint-api envoie les messages de réclamation à l'aide de la bibliothèque azure-servicebus.

    Vous devez satisfaire l'exigence relative au routage des fraudes. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In complaint-api, create each `ServiceBusMessage` with `application_properties={\"category\": category}`."
        fr: "Dans complaint-api, créer chaque `ServiceBusMessage` avec `application_properties={\"category\": category}`."
    - id: b
      text:
        en: "On fraud-review, add a rule with the SQL filter `category = 'fraud'` and keep the `$Default` rule."
        fr: "Sur fraud-review, ajouter une règle avec le filtre SQL `category = 'fraud'` et conserver la règle `$Default`."
    - id: c
      text:
        en: "On fraud-review, add a rule with the SQL filter `category = 'fraud'` and delete the `$Default` rule."
        fr: "Sur fraud-review, ajouter une règle avec le filtre SQL `category = 'fraud'` et supprimer la règle `$Default`."
    - id: d
      text:
        en: "On archive, delete the `$Default` rule so that the subscription keeps receiving every complaint."
        fr: "Sur archive, supprimer la règle `$Default` pour que l'abonnement continue à recevoir toutes les réclamations."
    - id: e
      text:
        en: "In complaint-api, create each `ServiceBusMessage` with `session_id=category`, and enable sessions on fraud-review."
        fr: "Dans complaint-api, créer chaque `ServiceBusMessage` avec `session_id=category` et activer les sessions sur fraud-review."
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Subscription filters evaluate the system and application properties of a message, never its body, so complaint-api must copy the category to an application property. On fraud-review, the SQL filter `category = 'fraud'` selects the fraud complaints, but the rules of a subscription are combined with OR: the `$Default` rule, a true filter, must be removed, or fraud-review still receives every message. archive keeps its `$Default` rule and receives everything."
    fr: "Les filtres d'abonnement évaluent les propriétés système et les propriétés d'application d'un message, jamais son corps : complaint-api doit donc copier la catégorie dans une propriété d'application. Sur fraud-review, le filtre SQL `category = 'fraud'` sélectionne les réclamations de fraude, mais les règles d'un abonnement sont combinées avec OR : la règle `$Default`, un filtre vrai, doit être supprimée, sinon fraud-review reçoit toujours tous les messages. archive conserve sa règle `$Default` et reçoit tout."
  options:
    b: { en: "The `$Default` rule accepts every message, and rules are combined with OR, so fraud-review would still receive all the complaints.", fr: "La règle `$Default` accepte tous les messages et les règles sont combinées avec OR : fraud-review recevrait toujours toutes les réclamations." }
    d: { en: "Without any rule, a subscription selects no message: archive would stop receiving complaints.", fr: "Sans aucune règle, un abonnement ne sélectionne aucun message : archive cesserait de recevoir des réclamations." }
    e: { en: "Sessions group related messages for ordered processing by one receiver; they don't filter which messages a subscription receives.", fr: "Les sessions regroupent des messages liés pour un traitement ordonné par un seul récepteur ; elles ne filtrent pas les messages qu'un abonnement reçoit." }
references:
  - title: Azure Service Bus Topic Filters Overview
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
