id: ai200-3a-eg-retry-defaults
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Alpine Ski House creates an event subscription that delivers "snow forecast updated" events to an Azure function. The subscription is created with `az eventgrid event-subscription create` and only the `--name`, `--source-resource-id`, `--endpoint-type` and `--endpoint` parameters.

    Which two statements about the delivery of events to the function are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Alpine Ski House crée un abonnement aux événements qui remet des événements « prévision d'enneigement mise à jour » à une fonction Azure. L'abonnement est créé avec `az eventgrid event-subscription create` et uniquement les paramètres `--name`, `--source-resource-id`, `--endpoint-type` et `--endpoint`.

    Quelles sont les deux affirmations vraies sur la remise des événements à la fonction ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Event Grid makes up to 30 delivery attempts for an event.", fr: "Event Grid effectue jusqu'à 30 tentatives de remise pour un événement." } }
    - { id: b, text: { en: "An event that can't be delivered is written to a dead-letter container of the topic.", fr: "Un événement impossible à remettre est écrit dans un conteneur de lettres mortes de la rubrique." } }
    - { id: c, text: { en: "Event Grid stops retrying an event 1,440 minutes after it was published.", fr: "Event Grid cesse de retenter un événement 1 440 minutes après sa publication." } }
    - { id: d, text: { en: "Event Grid retries an event every 30 seconds until it is delivered.", fr: "Event Grid retente un événement toutes les 30 secondes jusqu'à sa remise." } }
    - { id: e, text: { en: "Events are delivered to the function in the order in which they were published.", fr: "Les événements sont remis à la fonction dans l'ordre de leur publication." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The default retry policy allows 30 delivery attempts and an event time to live of 1,440 minutes (24 hours), and delivery stops at whichever limit comes first.
    fr: |
      La stratégie de nouvelle tentative par défaut autorise 30 tentatives de remise et une durée de vie des événements de 1 440 minutes (24 heures), et la remise s'arrête à la première limite atteinte.
  options:
    b:
      en: |
        Dead-lettering is off by default and requires a blob container configured on the event subscription; without it, undeliverable events are dropped.
      fr: |
        Les lettres mortes sont désactivées par défaut et exigent un conteneur d'objets blob configuré sur l'abonnement aux événements ; sans lui, les événements impossibles à remettre sont supprimés.
    d:
      en: |
        Retries follow an exponential backoff (10 seconds, 30 seconds, 1 minute, 5 minutes and so on), not a fixed interval.
      fr: |
        Les nouvelles tentatives suivent un backoff exponentiel (10 secondes, 30 secondes, 1 minute, 5 minutes, etc.), pas un intervalle fixe.
    e:
      en: |
        Event Grid doesn't guarantee delivery order.
      fr: |
        Event Grid ne garantit pas l'ordre de remise.
references:
  - title: Azure Event Grid Delivery and Retry Explained
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
