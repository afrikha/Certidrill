id: ai200-3b-client-reuse
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Python HTTP-triggered function that answers questions by calling Azure OpenAI with the `openai` SDK. The function code creates a new `AzureOpenAI` client at the start of every invocation. Under load, latency increases and the app runs out of outbound connections.

    You need to fix the issue by changing the function code only.

    What should you do?
  fr: |
    Litware dispose d'une fonction Python déclenchée par HTTP qui répond à des questions en appelant Azure OpenAI avec le SDK `openai`. Le code de la fonction crée un nouveau client `AzureOpenAI` au début de chaque appel. Sous charge, la latence augmente et l'application manque de connexions sortantes.

    Vous devez corriger le problème en modifiant uniquement le code de la fonction.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the client in a with block inside the function so that it is closed after each invocation.", fr: "Créer le client dans un bloc with à l'intérieur de la fonction pour qu'il soit fermé après chaque appel." } }
    - { id: b, text: { en: "Create the client once at module level and reuse it in every invocation.", fr: "Créer le client une seule fois au niveau du module et le réutiliser à chaque appel." } }
    - { id: c, text: { en: "Create the client in a background thread at the start of each invocation.", fr: "Créer le client dans un thread d'arrière-plan au début de chaque appel." } }
    - { id: d, text: { en: "Store the client in a func.Out parameter so that the runtime keeps it between invocations.", fr: "Stocker le client dans un paramètre func.Out pour que le runtime le conserve entre les appels." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Learn's guidance is to never create a new client with every invocation and to create a single, shared client that every invocation reuses. In Python, a client created at module level lives as long as the worker process, so its connection pool is reused across invocations.
    fr: |
      Les recommandations de Learn sont de ne jamais créer un nouveau client à chaque appel et de créer un seul client partagé que chaque appel réutilise. En Python, un client créé au niveau du module vit aussi longtemps que le processus Worker : son pool de connexions est réutilisé d'un appel à l'autre.
  options:
    a: { en: "Closing the client after each call still opens new connections for every invocation.", fr: "Fermer le client après chaque appel ouvre toujours de nouvelles connexions à chaque invocation." }
    c: { en: "A new client is still created for every invocation, with its own connections.", fr: "Un nouveau client est toujours créé à chaque appel, avec ses propres connexions." }
    d: { en: "func.Out is an output binding value written to a service; it does not cache objects.", fr: "func.Out est une valeur de liaison de sortie écrite dans un service ; il ne met pas d'objets en cache." }
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/manage-connections
