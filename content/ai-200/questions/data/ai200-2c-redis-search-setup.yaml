id: ai200-2c-redis-search-setup
objective: "2.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fourth Coffee is adding vector similarity search to a recipe assistant. The assistant runs in Azure Container Apps with a managed identity and must use Microsoft Entra authentication with Azure Managed Redis. Another job will load the recipe embeddings later.

    You need to prepare Azure Managed Redis and create the vector index from the assistant's Python code.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fourth Coffee ajoute la recherche de similarité vectorielle à un assistant de recettes. L'assistant s'exécute dans Azure Container Apps avec une identité managée et doit utiliser l'authentification Microsoft Entra avec Azure Managed Redis. Un autre traitement chargera plus tard les incorporations des recettes.

    Vous devez préparer Azure Managed Redis et créer l'index vectoriel depuis le code Python de l'assistant.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: user
      text:
        en: "Add the managed identity of the assistant as a Redis user of the instance."
        fr: "Ajouter l'identité managée de l'assistant en tant qu'utilisateur Redis de l'instance."
    - id: index
      text:
        en: "Create the index with a VECTOR field by calling `create_index` on `r.ft(\"idx:recipes\")`."
        fr: "Créer l'index avec un champ VECTOR en appelant `create_index` sur `r.ft(\"idx:recipes\")`."
    - id: create
      text:
        en: "Create an Azure Managed Redis instance with the RediSearch module and the Enterprise clustering policy."
        fr: "Créer une instance Azure Managed Redis avec le module RediSearch et la stratégie de clustering Enterprise."
    - id: load
      text:
        en: "Load the RediSearch module into the instance by running `MODULE LOAD`."
        fr: "Charger le module RediSearch dans l'instance en exécutant `MODULE LOAD`."
    - id: connect
      text:
        en: "Connect with `redis.Redis` on port 10000 with TLS and a Microsoft Entra credential provider."
        fr: "Se connecter avec `redis.Redis` sur le port 10000 avec TLS et un fournisseur d'informations d'identification Microsoft Entra."
    - id: oldport
      text:
        en: "Connect with `redis.Redis` on port 6380 with TLS and the access key."
        fr: "Se connecter avec `redis.Redis` sur le port 6380 avec TLS et la clé d'accès."
answer:
  sequence: [ create, user, connect, index ]
explanation:
  correct:
    en: |
      RediSearch must be enabled when the instance is created, with a policy that supports it. Microsoft Entra authentication requires the identity to be added as a Redis user before it can connect. The client then connects on port 10000, the port of Azure Managed Redis, with TLS and the `redis-entraid` credential provider, and creates the index with its VECTOR field.
    fr: |
      RediSearch doit être activé à la création de l'instance, avec une stratégie qui le prend en charge. L'authentification Microsoft Entra exige que l'identité soit ajoutée en tant qu'utilisateur Redis avant de pouvoir se connecter. Le client se connecte ensuite sur le port 10000, le port d'Azure Managed Redis, avec TLS et le fournisseur d'informations d'identification `redis-entraid`, puis crée l'index avec son champ VECTOR.
  options:
    load:
      en: |
        Modules can't be loaded manually into Azure Managed Redis.
      fr: |
        Les modules ne peuvent pas être chargés manuellement dans Azure Managed Redis.
    oldport:
      en: |
        Port 6380 is used by Azure Cache for Redis, and an access key doesn't meet the Microsoft Entra requirement.
      fr: |
        Le port 6380 est utilisé par Azure Cache for Redis, et une clé d'accès ne respecte pas l'exigence Microsoft Entra.
references:
  - title: "Quickstart: Create a Python app with Azure Managed Redis"
    url: https://learn.microsoft.com/en-us/azure/redis/python-get-started
  - title: Using Redis modules with Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/redis-modules
