id: ai200-2c-redis-keepttl
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Coho Winery caches personalized wine recommendations in Azure Managed Redis under keys named `rec:<user ID>`. Each key is created with a two-hour time to live (TTL), after which the recommendations are regenerated by a model.

    When a user rates a wine, a background job replaces the value of the user's key with adjusted recommendations. The replacement must not extend, reset or remove the remaining TTL of the key.

    Which redis-py call should the job use?
  fr: |
    Coho Winery met en cache des recommandations de vins personnalisées dans Azure Managed Redis sous des clés nommées `rec:<ID utilisateur>`. Chaque clé est créée avec une durée de vie (TTL) de deux heures, au terme de laquelle les recommandations sont régénérées par un modèle.

    Quand un utilisateur note un vin, un traitement en arrière-plan remplace la valeur de la clé de l'utilisateur par des recommandations ajustées. Ce remplacement ne doit ni prolonger, ni réinitialiser, ni supprimer la durée de vie restante de la clé.

    Quel appel redis-py le traitement doit-il utiliser ?
body:
  options:
    - { id: a, text: "r.set(key, value, xx=True)" }
    - { id: b, text: "r.getset(key, value)" }
    - { id: c, text: "r.set(key, value, keepttl=True)" }
    - { id: d, text: "r.set(key, value)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A successful SET discards any previous TTL of the key, unless the KEEPTTL option is specified. In redis-py, `keepttl=True` keeps the remaining time to live, so the recommendations are still regenerated at the end of the original two hours.
    fr: |
      Une commande SET réussie supprime toute durée de vie précédente de la clé, sauf si l'option KEEPTTL est spécifiée. Dans redis-py, `keepttl=True` conserve la durée de vie restante : les recommandations sont toujours régénérées à la fin des deux heures initiales.
  options:
    a:
      en: |
        `xx=True` writes only if the key exists, but the SET still discards its TTL.
      fr: |
        `xx=True` n'écrit que si la clé existe, mais la commande SET supprime quand même sa durée de vie.
    b:
      en: |
        GETSET returns the old value and also discards the TTL of the key.
      fr: |
        GETSET renvoie l'ancienne valeur et supprime aussi la durée de vie de la clé.
    d:
      en: |
        A plain SET removes the TTL, so the key would never expire.
      fr: |
        Un SET simple supprime la durée de vie : la clé n'expirerait jamais.
references:
  - title: Best practices for memory management for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-memory-management
