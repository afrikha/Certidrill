id: ai200-2a-cf-processor-lifecycle
objective: "2.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso's .NET indexing worker uses the change feed processor on an Azure Cosmos DB for NoSQL container. A new developer asks you how the processor handles a batch when there are changes to process and the delegate succeeds.

    Which three steps does the processor perform, in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Le worker d'indexation .NET de Contoso utilise le processeur de flux de modification sur un conteneur Azure Cosmos DB for NoSQL. Un nouveau développeur vous demande comment le processeur traite un lot quand il y a des modifications à traiter et que le délégué réussit.

    Quelles sont les trois étapes effectuées par le processeur, dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: read, text: { en: "Read the change feed of the monitored container.", fr: "Lire le flux de modification du conteneur surveillé." } }
    - { id: delegate, text: { en: "Send the batch of changes to the delegate.", fr: "Envoyer le lot de modifications au délégué." } }
    - { id: lease, text: { en: "Update the lease with the latest processed point in time.", fr: "Mettre à jour le bail avec le dernier point traité." } }
    - { id: delete, text: { en: "Delete the processed items from the monitored container.", fr: "Supprimer les éléments traités du conteneur surveillé." } }
    - { id: copy, text: { en: "Copy the processed items into the lease container.", fr: "Copier les éléments traités dans le conteneur de baux." } }
    - { id: rename, text: { en: "Assign a new instance name to the compute instance.", fr: "Attribuer un nouveau nom d'instance à l'instance de calcul." } }
answer:
  sequence: [ read, delegate, lease ]
explanation:
  correct:
    en: "The processor reads the change feed, sends the changes to the delegate, and only when the delegate succeeds updates the lease store with the latest processed point. Because the lease is updated last, a failure in the delegate makes the same batch come back, which gives at-least-once delivery."
    fr: "Le processeur lit le flux de modification, envoie les modifications au délégué et, seulement quand le délégué réussit, met à jour le magasin de baux avec le dernier point traité. Comme le bail est mis à jour en dernier, un échec du délégué fait revenir le même lot, ce qui donne une livraison au moins une fois."
  options:
    delete: { en: "Reading the change feed never removes items from the monitored container.", fr: "Lire le flux de modification ne supprime jamais d'éléments du conteneur surveillé." }
    copy: { en: "The lease container stores the progress state, not the items.", fr: "Le conteneur de baux stocke l'état de progression, pas les éléments." }
    rename: { en: "The instance name is set once when the processor is built.", fr: "Le nom d'instance est défini une seule fois lors de la construction du processeur." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/change-feed-processor
