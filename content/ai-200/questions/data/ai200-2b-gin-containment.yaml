id: ai200-2b-gin-containment
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's catalog assistant stores supplier attributes in a jsonb column named **attributes** of the products table on Azure Database for PostgreSQL. The most frequent filter is `WHERE attributes @> '{"brand": "Contoso"}'`, and it scans the whole table.

    Which index should you create?
  fr: |
    L'assistant de catalogue de Contoso stocke les attributs des fournisseurs dans une colonne jsonb nommée **attributes** de la table products sur Azure Database for PostgreSQL. Le filtre le plus fréquent est `WHERE attributes @> '{"brand": "Contoso"}'`, et il parcourt toute la table.

    Quel index devez-vous créer ?
body:
  options:
    - { id: a, text: "CREATE INDEX ON products (attributes);" }
    - { id: b, text: "CREATE INDEX ON products USING hash (attributes);" }
    - { id: c, text: "CREATE INDEX ON products USING hnsw (attributes);" }
    - { id: d, text: "CREATE INDEX ON products USING gin (attributes);" }
answer: { optionId: d }
explanation:
  correct:
    en: "GIN indexes support the jsonb containment and key operators `@>`, `<@`, `?`, `?|` and `?&`, so a GIN index on attributes serves this filter."
    fr: "Les index GIN prennent en charge les opérateurs jsonb de contenance et de clé `@>`, `<@`, `?`, `?|` et `?&` : un index GIN sur attributes sert ce filtre."
  options:
    a:
      en: "A B-tree index on a jsonb column only helps comparisons of whole documents, not containment of a key-value pair."
      fr: "Un index B-tree sur une colonne jsonb n'aide que les comparaisons de documents entiers, pas la contenance d'une paire clé-valeur."
    b:
      en: "A hash index supports only equality of the whole value."
      fr: "Un index hash ne prend en charge que l'égalité de la valeur entière."
    c:
      en: "HNSW is a vector index for distance operators on vector columns, not for jsonb."
      fr: "HNSW est un index vectoriel pour les opérateurs de distance sur des colonnes vectorielles, pas pour jsonb."
references:
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
