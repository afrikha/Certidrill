id: ai200-2b-entra-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is moving the Python services of its document assistant from password authentication to Microsoft Entra authentication on an Azure Database for PostgreSQL flexible server. Group sync (`pgaadauth.enable_group_sync`) is disabled on the server.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove fait passer les services Python de son assistant documentaire de l'authentification par mot de passe à l'authentification Microsoft Entra sur un serveur flexible Azure Database for PostgreSQL. La synchronisation des groupes (`pgaadauth.enable_group_sync`) est désactivée sur le serveur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Creating one `DefaultAzureCredential` object and reusing it for every new connection lets the service benefit from token caching."
        fr: "Créer un seul objet `DefaultAzureCredential` et le réutiliser pour chaque nouvelle connexion permet au service de profiter de la mise en cache des jetons."
    - id: s2
      text:
        en: "For a Microsoft Entra user, the role name passed to `pgaadauth_create_principal` must be the user principal name of that user."
        fr: "Pour un utilisateur Microsoft Entra, le nom de rôle transmis à `pgaadauth_create_principal` doit être le nom d'utilisateur principal de cet utilisateur."
    - id: s3
      text:
        en: "A member of a Microsoft Entra group that has a database role signs in with the member's own user principal name as the user name."
        fr: "Un membre d'un groupe Microsoft Entra qui dispose d'un rôle de base de données se connecte avec son propre nom d'utilisateur principal comme nom d'utilisateur."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Learn recommends persisting the credential across calls so that tokens are cached and round trips to Microsoft Entra ID are minimized. The role name of a Microsoft Entra user must match the principal, which is the user principal name. With group sync disabled, group members sign in with their access token and the group name as the user name, not their own user principal name."
    fr: "Learn recommande de conserver l'objet credential entre les appels afin que les jetons soient mis en cache et que les allers-retours vers Microsoft Entra ID soient réduits. Le nom de rôle d'un utilisateur Microsoft Entra doit correspondre au principal, c'est-à-dire au nom d'utilisateur principal. Quand la synchronisation des groupes est désactivée, les membres d'un groupe se connectent avec leur jeton d'accès et le nom du groupe comme nom d'utilisateur, pas avec leur propre nom d'utilisateur principal."
references:
  - title: Use Microsoft Entra ID Authentication in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-entra-configure
  - title: Manage Microsoft Entra Roles in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-manage-entra-users
