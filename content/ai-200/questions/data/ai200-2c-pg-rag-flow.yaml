id: ai200-2c-pg-rag-flow
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is implementing a retrieval-augmented generation (RAG) chat API in Python. The document chunks and their embeddings are already stored in Azure Database for PostgreSQL flexible server with a `tenant_id` column. An embedding deployment and a chat model deployment are available in Azure OpenAI.

    You need to implement the processing of each user request so that the answer is grounded only in the documents of the user's tenant and cites its sources.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. implémente une API de conversation par génération augmentée de récupération (RAG) en Python. Les segments de documents et leurs incorporations sont déjà stockés dans Azure Database for PostgreSQL serveur flexible avec une colonne `tenant_id`. Un déploiement d'incorporation et un déploiement de modèle de conversation sont disponibles dans Azure OpenAI.

    Vous devez implémenter le traitement de chaque requête utilisateur pour que la réponse soit ancrée uniquement dans les documents du locataire de l'utilisateur et cite ses sources.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: search
      text:
        en: "Run a SQL query that filters on the user's tenant, sorts by cosine distance to the question embedding, and keeps the top chunks."
        fr: "Exécuter une requête SQL qui filtre sur le locataire de l'utilisateur, trie par distance cosinus à l'incorporation de la question et conserve les meilleurs segments."
    - id: index
      text:
        en: "Create an HNSW index on the question embedding before the query runs."
        fr: "Créer un index HNSW sur l'incorporation de la question avant l'exécution de la requête."
    - id: chat
      text:
        en: "Send the prompt to the chat model deployment, and return its answer with the source titles."
        fr: "Envoyer l'invite au déploiement du modèle de conversation, et renvoyer sa réponse avec les titres des sources."
    - id: embed
      text:
        en: "Generate the embedding of the question with the embedding deployment that produced the stored embeddings."
        fr: "Générer l'incorporation de la question avec le déploiement d'incorporation qui a produit les incorporations stockées."
    - id: reembed
      text:
        en: "Regenerate the embeddings of the stored chunks with the chat model deployment."
        fr: "Régénérer les incorporations des segments stockés avec le déploiement du modèle de conversation."
    - id: prompt
      text:
        en: "Add the returned chunks and the titles of their source documents to the prompt as grounding data."
        fr: "Ajouter à l'invite les segments renvoyés et les titres de leurs documents sources comme données d'ancrage."
answer:
  sequence: [ embed, search, prompt, chat ]
explanation:
  correct:
    en: |
      The question is first embedded with the same deployment as the stored chunks, so that the vectors are comparable. The retrieval query then applies the tenant filter and the distance ordering with a limit. The returned chunks become the grounding data of the prompt, and the chat model generates the answer, which the API returns with the sources.
    fr: |
      La question est d'abord incorporée avec le même déploiement que les segments stockés, pour que les vecteurs soient comparables. La requête de récupération applique ensuite le filtre de locataire et le tri par distance avec une limite. Les segments renvoyés deviennent les données d'ancrage de l'invite, puis le modèle de conversation génère la réponse, que l'API renvoie avec les sources.
  options:
    index:
      en: |
        Indexes are built on stored columns, not on the query vector of one request.
      fr: |
        Les index sont créés sur des colonnes stockées, pas sur le vecteur de requête d'une seule demande.
    reembed:
      en: |
        A chat model doesn't produce embeddings, and the stored embeddings must come from the same model as the question embedding.
      fr: |
        Un modèle de conversation ne produit pas d'incorporations, et les incorporations stockées doivent provenir du même modèle que l'incorporation de la question.
references:
  - title: Generate Vector Embeddings with Azure OpenAI
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/generative-ai-azure-openai
