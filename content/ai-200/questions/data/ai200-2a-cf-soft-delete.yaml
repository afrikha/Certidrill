id: ai200-2a-cf-soft-delete
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders keeps a vector search index of its product catalog up to date with a Python function that uses the Azure Functions trigger for Azure Cosmos DB. When a product is deleted from the container, it stays in the search index, and the chatbot keeps recommending it.

    You need the existing function to remove deleted products from the search index. Deleted products must disappear from the container automatically after seven days.

    What should you do?
  fr: |
    Northwind Traders maintient à jour un index de recherche vectorielle de son catalogue de produits avec une fonction Python qui utilise le déclencheur Azure Functions pour Azure Cosmos DB. Quand un produit est supprimé du conteneur, il reste dans l'index de recherche, et le chatbot continue de le recommander.

    Vous devez faire en sorte que la fonction existante retire les produits supprimés de l'index de recherche. Les produits supprimés doivent disparaître automatiquement du conteneur après sept jours.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set startFromBeginning to true in the trigger configuration so that the function rereads all products.", fr: "Définir startFromBeginning sur true dans la configuration du déclencheur pour relire tous les produits." } }
    - { id: b, text: { en: "Set deleted to true with a seven-day TTL instead of deleting, and remove such items from the index.", fr: "Définir deleted sur true avec une TTL de sept jours au lieu de supprimer, et retirer ces éléments de l'index." } }
    - { id: c, text: { en: "Set a leaseContainerPrefix in the trigger configuration so that a second listener can track deletes.", fr: "Définir un leaseContainerPrefix dans la configuration du déclencheur pour qu'un second écouteur suive les suppressions." } }
    - { id: d, text: { en: "Lower feedPollDelay in the trigger configuration so that deletes are detected faster.", fr: "Réduire feedPollDelay dans la configuration du déclencheur pour détecter les suppressions plus vite." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The trigger reads the change feed in latest version mode, which publishes new and updated items but not deletes. The documented pattern is a soft delete: an update that sets `deleted` to true appears in the change feed, so the function can remove the product, and a TTL on the item deletes it from the container later."
    fr: "Le déclencheur lit le flux de modification en mode dernière version, qui publie les éléments nouveaux et mis à jour, mais pas les suppressions. Le modèle documenté est la suppression logique : une mise à jour qui définit `deleted` sur true apparaît dans le flux de modification, la fonction peut donc retirer le produit, et une TTL sur l'élément le supprime ensuite du conteneur."
  options:
    a: { en: "Reading from the beginning replays past inserts and updates; deletes still aren't in the feed, and the setting has no effect once leases exist.", fr: "Lire depuis le début rejoue les insertions et mises à jour passées ; les suppressions ne sont toujours pas dans le flux, et le paramètre est sans effet une fois les baux créés." }
    c: { en: "A lease prefix lets several functions share a lease container; it doesn't add deletes to the feed.", fr: "Un préfixe de bail permet à plusieurs fonctions de partager un conteneur de baux ; il n'ajoute pas les suppressions au flux." }
    d: { en: "The poll delay only changes how often partitions are polled; deletes never appear in this mode.", fr: "Le délai d'interrogation change seulement la fréquence d'interrogation des partitions ; les suppressions n'apparaissent jamais dans ce mode." }
references:
  - title: Change Feed Design Patterns - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-design-patterns
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
