id: ai200-2c-pgb-prepared
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Lucerne Publishing has a Python service whose database driver uses protocol-level named prepared statements. The service connects to an Azure Database for PostgreSQL flexible server on the General Purpose tier.

    You enable the built-in PgBouncer with its default settings and change the service to connect on port 6432. The service now intermittently fails with errors stating that a prepared statement doesn't exist.

    You need to fix the errors. The solution must keep PgBouncer in transaction mode and must keep the protocol-level prepared statements of the driver.

    What should you do?
  fr: |
    Lucerne Publishing dispose d'un service Python dont le pilote de base de données utilise des instructions préparées nommées au niveau du protocole. Le service se connecte à un serveur flexible Azure Database for PostgreSQL du niveau General Purpose.

    Vous activez le PgBouncer intégré avec ses paramètres par défaut et modifiez le service pour qu'il se connecte sur le port 6432. Le service échoue désormais par intermittence avec des erreurs indiquant qu'une instruction préparée n'existe pas.

    Vous devez corriger les erreurs. La solution doit conserver PgBouncer en mode transaction et conserver les instructions préparées au niveau du protocole du pilote.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set the `pgbouncer.max_prepared_statements` server parameter to a value greater than 0."
        fr: "Définir le paramètre de serveur `pgbouncer.max_prepared_statements` sur une valeur supérieure à 0."
    - id: b
      text:
        en: "Set the `pgbouncer.pool_mode` server parameter to `statement`."
        fr: "Définir le paramètre de serveur `pgbouncer.pool_mode` sur `statement`."
    - id: c
      text:
        en: "Replace the driver's prepared statements with SQL `PREPARE` and `EXECUTE` statements."
        fr: "Remplacer les instructions préparées du pilote par des instructions SQL `PREPARE` et `EXECUTE`."
    - id: d
      text:
        en: "Increase the `pgbouncer.default_pool_size` server parameter to 200."
        fr: "Augmenter le paramètre de serveur `pgbouncer.default_pool_size` à 200."
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, `pgbouncer.max_prepared_statements` is 0, so PgBouncer doesn't track prepared statements and a statement prepared on one server connection is missing when the next transaction runs on another. With a nonzero value, PgBouncer tracks protocol-level named prepared statements and supports them in transaction mode.
    fr: |
      Par défaut, `pgbouncer.max_prepared_statements` vaut 0 : PgBouncer ne suit pas les instructions préparées, et une instruction préparée sur une connexion au serveur est introuvable quand la transaction suivante s'exécute sur une autre. Avec une valeur non nulle, PgBouncer suit les instructions préparées nommées au niveau du protocole et les prend en charge en mode transaction.
  options:
    b:
      en: |
        Statement pool mode can't be used with prepared statements, and the requirements keep transaction mode.
      fr: |
        Le mode de pool instruction ne peut pas être utilisé avec des instructions préparées, et les exigences imposent le mode transaction.
    c:
      en: |
        PgBouncer's prepared statement support covers protocol-level statements, not SQL-level `PREPARE`, and the driver must keep its own prepared statements.
      fr: |
        La prise en charge des instructions préparées par PgBouncer couvre les instructions au niveau du protocole, pas le `PREPARE` SQL, et le pilote doit conserver ses propres instructions préparées.
    d:
      en: |
        A larger pool adds server connections but doesn't make a prepared statement available on the connection that runs the next transaction.
      fr: |
        Un pool plus grand ajoute des connexions au serveur mais ne rend pas l'instruction préparée disponible sur la connexion qui exécute la transaction suivante.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
