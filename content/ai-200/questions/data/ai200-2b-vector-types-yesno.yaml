id: ai200-2b-vector-types-yesno
objective: "2.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is designing a products table on Azure Database for PostgreSQL with two embedding columns, **title_embedding** and **image_embedding**, and an optional sparse keyword vector.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit une table products sur Azure Database for PostgreSQL avec deux colonnes d'incorporations, **title_embedding** et **image_embedding**, et un vecteur creux facultatif de mots clés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A `halfvec(1536)` column uses about half the storage of a `vector(1536)` column."
        fr: "Une colonne `halfvec(1536)` utilise environ la moitié du stockage d'une colonne `vector(1536)`."
    - id: s2
      text:
        en: "A single HNSW index can cover both title_embedding and image_embedding."
        fr: "Un seul index HNSW peut couvrir à la fois title_embedding et image_embedding."
    - id: s3
      text:
        en: "An HNSW index on a `sparsevec` column supports vectors that have up to 1,000 nonzero elements."
        fr: "Un index HNSW sur une colonne `sparsevec` prend en charge les vecteurs qui comptent jusqu'à 1 000 éléments non nuls."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "halfvec stores 16-bit floats instead of 32-bit floats, which halves the storage; Learn advises using it only after a benchmark confirms acceptable quality. Each vector column needs its own index, because one index cannot cover several vector columns. HNSW indexes on sparsevec columns support up to 1,000 nonzero elements."
    fr: "halfvec stocke des nombres à virgule flottante de 16 bits au lieu de 32 bits, ce qui divise le stockage par deux ; Learn conseille de l'utiliser seulement après un banc d'essai qui confirme une qualité acceptable. Chaque colonne vectorielle a besoin de son propre index, car un index ne peut pas couvrir plusieurs colonnes vectorielles. Les index HNSW sur des colonnes sparsevec prennent en charge jusqu'à 1 000 éléments non nuls."
references:
  - title: Store and query embeddings with pgvector
    url: https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/2-store-query-embeddings-pgvector
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
