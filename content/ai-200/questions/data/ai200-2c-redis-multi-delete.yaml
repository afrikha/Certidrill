id: ai200-2c-redis-multi-delete
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys caches catalog data in a non-clustered Azure Managed Redis instance. When the price of product 77 changes, the application updates the database and must then invalidate the following cached entries immediately:

    - `product:77:details`
    - `product:77:summary`
    - `category:12:top`

    Other keys that start with `product:77:` must stay in the cache.

    Which two code segments can you use after the database update? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys met en cache des données de catalogue dans une instance Azure Managed Redis sans cluster. Quand le prix du produit 77 change, l'application met à jour la base de données et doit ensuite invalider immédiatement les entrées mises en cache suivantes :

    - `product:77:details`
    - `product:77:summary`
    - `category:12:top`

    Les autres clés qui commencent par `product:77:` doivent rester dans le cache.

    Quels sont les deux segments de code que vous pouvez utiliser après la mise à jour de la base de données ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "r.unlink(\"product:77:details\", \"product:77:summary\", \"category:12:top\")" }
    - { id: b, text: "r.delete(\"product:77:*\", \"category:12:top\")" }
    - { id: c, text: "r.expire(\"product:77:*\", 0)" }
    - { id: d, text: "r.delete(\"product:77:details\", \"product:77:summary\", \"category:12:top\")" }
    - { id: e, text: "for k in (\"product:77:details\", \"product:77:summary\", \"category:12:top\"): r.persist(k)" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      DEL and UNLINK both accept several key names and remove them in one command; UNLINK frees the memory in the background. After the invalidation, the next read misses the cache and reloads the new price from the database.
    fr: |
      DEL et UNLINK acceptent tous deux plusieurs noms de clés et les suppriment en une seule commande ; UNLINK libère la mémoire en arrière-plan. Après l'invalidation, la lecture suivante manque le cache et recharge le nouveau prix depuis la base de données.
  options:
    b:
      en: |
        DEL doesn't expand patterns: it looks for a key literally named `product:77:*`, and a pattern would also remove the other keys that must stay.
      fr: |
        DEL ne développe pas les modèles : il cherche une clé nommée littéralement `product:77:*`, et un modèle supprimerait aussi les autres clés qui doivent rester.
    c:
      en: |
        EXPIRE takes a single key name, not a pattern, and `category:12:top` isn't invalidated.
      fr: |
        EXPIRE prend un seul nom de clé, pas un modèle, et `category:12:top` n'est pas invalidée.
    e:
      en: |
        PERSIST removes the expiration and keeps the stale values.
      fr: |
        PERSIST supprime l'expiration et conserve les valeurs obsolètes.
references:
  - title: Cache-Aside Pattern
    url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
