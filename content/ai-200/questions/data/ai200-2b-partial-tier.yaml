id: ai200-2b-partial-tier
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind serves vector searches only to premium customers. To keep the index small, a developer created the following index on Azure Database for PostgreSQL:

    `CREATE INDEX idx_premium ON docs USING hnsw (embedding vector_ip_ops) WHERE tier = 'premium';`

    The search query generated by the application contains `WHERE tier LIKE 'premium' ORDER BY embedding <#> %s::vector LIMIT 10`, and EXPLAIN shows a sequential scan.

    What should you do?
  fr: |
    Northwind ne propose les recherches vectorielles qu'aux clients premium. Pour garder l'index petit, un développeur a créé l'index suivant sur Azure Database for PostgreSQL :

    `CREATE INDEX idx_premium ON docs USING hnsw (embedding vector_ip_ops) WHERE tier = 'premium';`

    La requête de recherche générée par l'application contient `WHERE tier LIKE 'premium' ORDER BY embedding <#> %s::vector LIMIT 10`, et EXPLAIN montre une analyse séquentielle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `SET enable_seqscan = off` in the session before the query.", fr: "Exécuter `SET enable_seqscan = off` dans la session avant la requête." } }
    - { id: b, text: { en: "Change the query filter to `WHERE tier = 'premium'`.", fr: "Remplacer le filtre de la requête par `WHERE tier = 'premium'`." } }
    - { id: c, text: { en: "Rebuild idx_premium with the `vector_cosine_ops` operator class.", fr: "Reconstruire idx_premium avec la classe d'opérateurs `vector_cosine_ops`." } }
    - { id: d, text: { en: "Increase `hnsw.ef_search` to 100 before the query.", fr: "Porter `hnsw.ef_search` à 100 avant la requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The planner uses a partial index only when it can prove that the query's WHERE clause matches the index predicate. Learn shows that `tier LIKE 'premium'` does not match an index defined `WHERE tier = 'premium'`, so the query must use the same form as the index."
    fr: "Le planificateur n'utilise un index partiel que s'il peut prouver que la clause WHERE de la requête correspond au prédicat de l'index. Learn montre que `tier LIKE 'premium'` ne correspond pas à un index défini avec `WHERE tier = 'premium'` : la requête doit utiliser la même forme que l'index."
  options:
    a:
      en: "Discouraging sequential scans cannot make the planner use an index whose predicate does not cover the query's rows."
      fr: "Décourager les analyses séquentielles ne peut pas faire utiliser au planificateur un index dont le prédicat ne couvre pas les lignes de la requête."
    c:
      en: "The query uses `<#>`, which matches the existing vector_ip_ops class; cosine would create a real mismatch."
      fr: "La requête utilise `<#>`, qui correspond à la classe vector_ip_ops existante ; cosinus créerait une vraie discordance."
    d:
      en: "ef_search tunes an index scan that is already chosen; the problem is that the index is not chosen at all."
      fr: "ef_search règle une analyse d'index déjà choisie ; le problème est que l'index n'est pas choisi du tout."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
