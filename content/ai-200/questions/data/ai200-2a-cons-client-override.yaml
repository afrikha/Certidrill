id: ai200-2a-cons-client-override
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account whose default consistency level is **Session**. A customer-facing assistant relies on read-your-writes and must keep this behavior.

    A new Python batch job reads usage counters from the same account to compute trends. The job doesn't need any ordering or freshness guarantee and must use the lowest read latency and RU charge.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL dont le niveau de cohérence par défaut est **Session**. Un assistant destiné aux clients s'appuie sur la lecture de ses propres écritures et doit conserver ce comportement.

    Un nouveau travail Python par lots lit des compteurs d'utilisation dans le même compte pour calculer des tendances. Le travail n'a besoin d'aucune garantie d'ordre ni de fraîcheur et doit avoir la latence de lecture et la consommation de RU les plus faibles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the default consistency level of the account to Eventual.", fr: "Changer le niveau de cohérence par défaut du compte en Eventual." } }
    - { id: b, text: { en: "Create the CosmosClient of the batch job with consistency_level=\"Eventual\".", fr: "Créer le CosmosClient du travail par lots avec consistency_level=\"Eventual\"." } }
    - { id: c, text: { en: "Move the counters to a new container and set its consistency level to Eventual.", fr: "Déplacer les compteurs vers un nouveau conteneur et définir son niveau de cohérence sur Eventual." } }
    - { id: d, text: { en: "Pass priority=\"Low\" to the queries of the batch job.", fr: "Passer priority=\"Low\" aux requêtes du travail par lots." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A client can override the account default consistency for its own reads, as long as it relaxes it. Setting Eventual on the job's client gives it the weakest level without changing the Session behavior that the assistant uses."
    fr: "Un client peut remplacer le niveau de cohérence par défaut du compte pour ses propres lectures, à condition de l'assouplir. Définir Eventual sur le client du travail lui donne le niveau le plus faible sans changer le comportement Session utilisé par l'assistant."
  options:
    a: { en: "The account default applies to every client that doesn't override it, so the assistant would lose read-your-writes.", fr: "La valeur par défaut du compte s'applique à tous les clients qui ne la remplacent pas : l'assistant perdrait la lecture de ses propres écritures." }
    c: { en: "Consistency is configured on the account and applies to all its databases and containers; there is no container-level setting.", fr: "La cohérence se configure sur le compte et s'applique à toutes ses bases de données et à tous ses conteneurs ; il n'existe pas de paramètre au niveau du conteneur." }
    d: { en: "Low priority only makes these requests throttled first when throughput is exhausted; it doesn't reduce their cost or latency.", fr: "La priorité basse fait seulement limiter ces requêtes en premier quand le débit est épuisé ; elle ne réduit ni leur coût ni leur latence." }
references:
  - title: Manage Consistency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
