id: ai200-2c-pg-similarity-score
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a retrieval-augmented generation (RAG) API on Azure Database for PostgreSQL flexible server. The `doc_chunks` table stores embeddings in a `vector(1536)` column named `embedding`.

    The API must return a `similarity` value with each retrieved chunk. The value must be the cosine similarity between the chunk and the question: 1 for vectors that point in the same direction, and lower values for less similar chunks.

    Which expression should you add to the `SELECT` list?
  fr: |
    Fabrikam exécute une API de génération augmentée de récupération (RAG) sur Azure Database for PostgreSQL serveur flexible. La table `doc_chunks` stocke les incorporations dans une colonne `vector(1536)` nommée `embedding`.

    L'API doit renvoyer une valeur `similarity` avec chaque segment récupéré. Cette valeur doit être la similarité cosinus entre le segment et la question : 1 pour des vecteurs de même direction, et des valeurs plus faibles pour des segments moins similaires.

    Quelle expression devez-vous ajouter à la liste `SELECT` ?
body:
  options:
    - { id: a, text: "embedding <=> %s::vector AS similarity" }
    - { id: b, text: "1 - (embedding <=> %s::vector) AS similarity" }
    - { id: c, text: "1 - (embedding <-> %s::vector) AS similarity" }
    - { id: d, text: "embedding <#> %s::vector AS similarity" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `<=>` operator of pgvector returns the cosine distance, which is 0 for vectors with the same direction and grows as they diverge. Cosine similarity is 1 minus the cosine distance, so `1 - (embedding <=> ...)` returns 1 for identical directions and lower values for less similar chunks.
    fr: |
      L'opérateur `<=>` de pgvector renvoie la distance cosinus, qui vaut 0 pour des vecteurs de même direction et augmente à mesure qu'ils divergent. La similarité cosinus est égale à 1 moins la distance cosinus : `1 - (embedding <=> ...)` renvoie donc 1 pour des directions identiques et des valeurs plus faibles pour des segments moins similaires.
  options:
    a:
      en: |
        This is the cosine distance itself, which is 0 for the most similar chunks, the opposite of the required scale.
      fr: |
        Il s'agit de la distance cosinus elle-même, qui vaut 0 pour les segments les plus similaires, soit l'inverse de l'échelle demandée.
    c:
      en: "`<->` returns the Euclidean (L2) distance, which is not bounded by 1, so subtracting it from 1 doesn't give the cosine similarity."
      fr: "`<->` renvoie la distance euclidienne (L2), qui n'est pas bornée par 1 : la soustraire de 1 ne donne pas la similarité cosinus."
    d:
      en: "`<#>` returns the negative inner product, so more similar chunks get lower values."
      fr: "`<#>` renvoie le produit scalaire négatif : les segments les plus similaires obtiennent les valeurs les plus faibles."
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/how-to-use-pgvector
