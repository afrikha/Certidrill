id: ai200-cs1b-ru-tuning
objective: "2.1.2"
type: yesno_statements
caseStudy: ai200-cs1b-wingtip
difficulty: 3
status: draft
stem:
  en: |
    You are reviewing options to meet the write cost requirement and to optimize the RU consumption of catalog-api. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous étudiez des options pour satisfaire l'exigence relative au coût des écritures et optimiser la consommation de RU de catalog-api. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Adding `/embedding/*` to the excluded paths of the products indexing policy reduces the RU charge of the price updates without removing the vector index.
        fr: Ajouter `/embedding/*` aux chemins exclus de la stratégie d'indexation de products réduit les frais en RU des mises à jour des prix sans supprimer l'index vectoriel.
    - id: s2
      text:
        en: If catalog-api reads products with the Eventual consistency level instead of Session, each point read consumes fewer RUs.
        fr: Si catalog-api lit les produits avec le niveau de cohérence Eventual au lieu de Session, chaque lecture de point consomme moins de RU.
    - id: s3
      text:
        en: Setting the indexing mode of products to `none` reduces the RU charge of the price updates without affecting the GiftFinder searches.
        fr: Définir le mode d'indexation de products sur `none` réduit les frais en RU des mises à jour des prix sans affecter les recherches GiftFinder.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Excluding the embedding path from the range index stops Cosmos DB from indexing 1,536 numbers per write, while the vector index declared in `vectorIndexes` keeps serving the vector searches. Session, Consistent prefix and Eventual all read from a single replica, so relaxing Session to Eventual does not lower the RU charge of a read. The `none` indexing mode turns off indexing for the container, including the indexes that the GiftFinder filter and vector search rely on, so the searches would become slower and more expensive.
    fr: |
      Exclure le chemin de l'incorporation de l'index de plage évite à Cosmos DB d'indexer 1 536 nombres par écriture, tandis que l'index vectoriel déclaré dans `vectorIndexes` continue de servir les recherches vectorielles. Session, Consistent prefix et Eventual lisent tous à partir d'un seul réplica : assouplir Session en Eventual ne réduit pas les frais en RU d'une lecture. Le mode d'indexation `none` désactive l'indexation du conteneur, y compris les index sur lesquels s'appuient le filtre et la recherche vectorielle de GiftFinder : les recherches deviendraient plus lentes et plus coûteuses.
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Vector search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
