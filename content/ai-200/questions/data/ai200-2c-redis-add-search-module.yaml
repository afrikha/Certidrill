id: ai200-2c-redis-add-search-module
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Managed Redis instance named amr-contoso on the Balanced tier with the Enterprise clustering policy. The instance was created without any module and caches API responses.

    You need to implement vector similarity search over product embeddings in Azure Managed Redis.

    What should you do?
  fr: |
    Contoso dispose d'une instance Azure Managed Redis nommée amr-contoso du niveau Balanced avec la stratégie de clustering Enterprise. L'instance a été créée sans aucun module et met en cache des réponses d'API.

    Vous devez implémenter la recherche de similarité vectorielle sur des incorporations de produits dans Azure Managed Redis.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the RediSearch module to amr-contoso from the Advanced settings of the instance."
        fr: "Ajouter le module RediSearch à amr-contoso depuis les paramètres avancés de l'instance."
    - id: b
      text:
        en: "Load the RediSearch module into amr-contoso by running the `MODULE LOAD` command."
        fr: "Charger le module RediSearch dans amr-contoso en exécutant la commande `MODULE LOAD`."
    - id: c
      text:
        en: "Change the clustering policy of amr-contoso to OSS, and then create the vector index."
        fr: "Changer la stratégie de clustering d'amr-contoso en OSS, puis créer l'index vectoriel."
    - id: d
      text:
        en: "Create a new instance with the RediSearch module enabled, and then load the embeddings into it."
        fr: "Créer une instance avec le module RediSearch activé, puis y charger les incorporations."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Vector search requires the RediSearch module, and modules can be added only when an Azure Managed Redis instance is created. A new instance with RediSearch on an in-memory tier and the Enterprise or non-clustered policy can then index the embeddings.
    fr: |
      La recherche vectorielle exige le module RediSearch, et les modules ne peuvent être ajoutés qu'à la création d'une instance Azure Managed Redis. Une nouvelle instance avec RediSearch sur un niveau en mémoire et la stratégie Enterprise ou sans cluster peut ensuite indexer les incorporations.
  options:
    a:
      en: |
        Modules can't be added to an existing instance.
      fr: |
        Les modules ne peuvent pas être ajoutés à une instance existante.
    b:
      en: |
        You can't manually load modules into Azure Managed Redis.
      fr: |
        Vous ne pouvez pas charger manuellement de modules dans Azure Managed Redis.
    c:
      en: |
        RediSearch doesn't support the OSS clustering policy, and changing the policy doesn't add the module.
      fr: |
        RediSearch ne prend pas en charge la stratégie de clustering OSS, et changer de stratégie n'ajoute pas le module.
references:
  - title: Using Redis modules with Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/redis-modules
