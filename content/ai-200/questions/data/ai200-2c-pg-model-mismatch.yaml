id: ai200-2c-pg-model-mismatch
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores 400,000 manual chunks in Azure Database for PostgreSQL flexible server. The chunk embeddings were generated with the `text-embedding-3-small` model and are stored in a `vector(1536)` column.

    A developer changes the question-answering API to embed user questions with the `text-embedding-3-large` model. The retrieval query now fails with an error about different vector dimensions.

    You need to fix the API so that it retrieves the chunks that are semantically closest to each question. The stored chunk embeddings must not be regenerated.

    What should you do?
  fr: |
    Northwind Traders stocke 400 000 segments de manuels dans Azure Database for PostgreSQL serveur flexible. Les incorporations des segments ont été générées avec le modèle `text-embedding-3-small` et sont stockées dans une colonne `vector(1536)`.

    Un développeur modifie l'API de questions-réponses pour qu'elle incorpore les questions des utilisateurs avec le modèle `text-embedding-3-large`. La requête de récupération échoue désormais avec une erreur concernant des dimensions de vecteur différentes.

    Vous devez corriger l'API pour qu'elle récupère les segments sémantiquement les plus proches de chaque question. Les incorporations des segments stockés ne doivent pas être régénérées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Request 1,536 dimensions from `text-embedding-3-large` when the API embeds the questions."
        fr: "Demander 1 536 dimensions à `text-embedding-3-large` quand l'API incorpore les questions."
    - id: b
      text:
        en: "Cast the question embedding to `vector(1536)` in the retrieval query."
        fr: "Convertir l'incorporation de la question en `vector(1536)` dans la requête de récupération."
    - id: c
      text:
        en: "Replace the `<=>` operator with the `<#>` operator in the retrieval query."
        fr: "Remplacer l'opérateur `<=>` par l'opérateur `<#>` dans la requête de récupération."
    - id: d
      text:
        en: "Embed the questions with the `text-embedding-3-small` model that produced the chunk embeddings."
        fr: "Incorporer les questions avec le modèle `text-embedding-3-small` qui a produit les incorporations des segments."
answer: { optionId: d }
explanation:
  correct:
    en: |
      A similarity search compares vectors only when the question and the stored chunks are embedded by the same model: each model has its own vector space. Embedding the questions with `text-embedding-3-small` produces 1,536-dimension vectors in the same space as the stored chunks, so the distances are meaningful.
    fr: |
      Une recherche de similarité ne compare des vecteurs que si la question et les segments stockés sont incorporés par le même modèle : chaque modèle a son propre espace vectoriel. Incorporer les questions avec `text-embedding-3-small` produit des vecteurs de 1 536 dimensions dans le même espace que les segments stockés, et les distances ont alors un sens.
  options:
    a:
      en: |
        The query would run, but the vectors would come from another model's space, so the distances would not reflect semantic similarity.
      fr: |
        La requête s'exécuterait, mais les vecteurs proviendraient de l'espace d'un autre modèle : les distances ne refléteraient pas la similarité sémantique.
    b:
      en: |
        A cast doesn't change the number of dimensions: converting a 3,072-dimension vector to `vector(1536)` fails.
      fr: |
        Une conversion ne change pas le nombre de dimensions : convertir un vecteur de 3 072 dimensions en `vector(1536)` échoue.
    c:
      en: |
        The negative inner product also requires vectors with the same number of dimensions, so the error remains.
      fr: |
        Le produit scalaire négatif exige lui aussi des vecteurs de même dimension : l'erreur persiste.
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/how-to-use-pgvector
