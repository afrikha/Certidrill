id: ai200-cs3b-vector-index
objective: "2.2.3"
type: single
caseStudy: ai200-cs3b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to create the vector index of course_chunks to meet the vector index requirement. Which statement should you run?
  fr: |
    Vous devez créer l'index vectoriel de course_chunks pour respecter l'exigence relative à l'index vectoriel. Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE INDEX ON course_chunks USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100);" }
    - { id: b, text: "CREATE INDEX ON course_chunks USING hnsw (embedding vector_cosine_ops);" }
    - { id: c, text: "CREATE INDEX ON course_chunks USING hnsw (embedding vector_l2_ops);" }
    - { id: d, text: "CREATE INDEX ON course_chunks USING hnsw (embedding vector_ip_ops);" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      HNSW has a better speed-recall trade-off than IVFFlat and needs no training step, so it can be created on an empty table and stays effective as rows are added. The index is used only when its operator class matches the query operator; cosine distance uses `vector_cosine_ops` and the `<=>` operator.
    fr: |
      HNSW offre un meilleur compromis vitesse-rappel qu'IVFFlat et ne demande pas d'étape d'entraînement : il peut être créé sur une table vide et reste efficace à mesure que des lignes sont ajoutées. L'index n'est utilisé que si sa classe d'opérateurs correspond à l'opérateur de la requête ; la distance cosinus utilise `vector_cosine_ops` et l'opérateur `<=>`.
  options:
    a:
      en: |
        IVFFlat builds its lists with a k-means training step on the existing rows, so it should be created after the data is loaded, and its speed-recall trade-off is lower than HNSW.
      fr: |
        IVFFlat construit ses listes par une étape d'entraînement k-means sur les lignes existantes : il doit être créé après le chargement des données, et son compromis vitesse-rappel est inférieur à celui de HNSW.
    c:
      en: "`vector_l2_ops` serves the Euclidean distance operator `<->`; cosine queries with `<=>` would not use the index."
      fr: "`vector_l2_ops` sert l'opérateur de distance euclidienne `<->` ; les requêtes cosinus avec `<=>` n'utiliseraient pas l'index."
    d:
      en: "`vector_ip_ops` serves the inner product operator `<#>`; cosine queries with `<=>` would not use the index."
      fr: "`vector_ip_ops` sert l'opérateur de produit scalaire `<#>` ; les requêtes cosinus avec `<=>` n'utiliseraient pas l'index."
references:
  - title: Optimize performance when using pgvector in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
