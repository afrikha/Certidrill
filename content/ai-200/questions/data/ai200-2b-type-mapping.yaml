id: ai200-2b-type-mapping
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing the tables of a hybrid search application on Azure Database for PostgreSQL. The vector extension is created in the database.

    Which data type should you use for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit les tables d'une application de recherche hybride sur Azure Database for PostgreSQL. L'extension vector est créée dans la base de données.

    Quel type de données devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correspondantes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vector, text: vector(1536) }
    - { id: halfvec, text: halfvec(1536) }
    - { id: sparse, text: sparsevec(30000) }
    - { id: jsonb, text: jsonb }
    - { id: text, text: text }
    - { id: ts, text: timestamptz }
  targets:
    - id: dense
      text: { en: "Dense embedding from a 1,536-dimension model, stored at full precision", fr: "Incorporation dense issue d'un modèle à 1 536 dimensions, stockée en précision complète" }
    - id: compact
      text: { en: "The same embedding at half the storage, after a benchmark confirmed acceptable quality", fr: "La même incorporation avec la moitié du stockage, après un banc d'essai qui a confirmé une qualité acceptable" }
    - id: keywords
      text: { en: "Keyword weights over 30,000 positions, almost all of them zero", fr: "Poids de mots clés sur 30 000 positions, presque tous nuls" }
    - id: attrs
      text: { en: "Attributes whose names differ from one supplier to another", fr: "Attributs dont les noms diffèrent d'un fournisseur à l'autre" }
answer:
  mapping: { dense: vector, compact: halfvec, keywords: sparse, attrs: jsonb }
explanation:
  correct:
    en: "vector stores 32-bit floats and is the standard type for dense embeddings. halfvec stores 16-bit floats, halving the storage when quality allows. sparsevec stores only the nonzero values and their positions. jsonb holds dynamic attributes whose keys vary."
    fr: "vector stocke des nombres à virgule flottante de 32 bits et constitue le type standard pour les incorporations denses. halfvec stocke des nombres de 16 bits et divise le stockage par deux quand la qualité le permet. sparsevec ne stocke que les valeurs non nulles et leurs positions. jsonb contient les attributs dynamiques dont les clés varient."
references:
  - title: Store and query embeddings with pgvector
    url: https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/2-store-query-embeddings-pgvector
