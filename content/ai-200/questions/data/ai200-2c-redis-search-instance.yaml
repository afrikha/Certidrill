id: ai200-2c-redis-search-instance
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is creating an Azure Managed Redis instance for a retrieval-augmented generation (RAG) application. The instance must meet the following requirements:

    - Run vector similarity search over document embeddings.
    - Use a balanced ratio of memory to vCPU for a standard workload.
    - Accept connections from the `redis.Redis` client class of redis-py, which isn't cluster-aware.

    Which three settings should you choose when you create the instance? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée une instance Azure Managed Redis pour une application de génération augmentée de récupération (RAG). L'instance doit respecter les exigences suivantes :

    - Exécuter la recherche de similarité vectorielle sur des incorporations de documents.
    - Utiliser un ratio équilibré entre mémoire et processeurs virtuels pour une charge de travail standard.
    - Accepter les connexions de la classe cliente `redis.Redis` de redis-py, qui ne gère pas les clusters.

    Quels sont les trois paramètres que vous devez choisir à la création de l'instance ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Tier: Flash Optimized", fr: "Niveau : Flash Optimized" } }
    - { id: b, text: { en: "Clustering policy: Enterprise", fr: "Stratégie de clustering : Enterprise" } }
    - { id: c, text: { en: "Module: RedisTimeSeries", fr: "Module : RedisTimeSeries" } }
    - { id: d, text: { en: "Tier: Balanced", fr: "Niveau : Balanced" } }
    - { id: e, text: { en: "Clustering policy: OSS", fr: "Stratégie de clustering : OSS" } }
    - { id: f, text: { en: "Module: RediSearch", fr: "Module : RediSearch" } }
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |
      Vector search comes from the RediSearch module, which must be enabled at creation. RediSearch is available on the Memory Optimized, Balanced and Compute Optimized tiers, and Balanced offers the balanced memory-to-vCPU ratio. RediSearch supports the Enterprise and non-clustered policies, and the Enterprise policy exposes a single endpoint that a non-cluster-aware client can use.
    fr: |
      La recherche vectorielle est fournie par le module RediSearch, qui doit être activé à la création. RediSearch est disponible sur les niveaux Memory Optimized, Balanced et Compute Optimized, et Balanced offre le ratio équilibré entre mémoire et processeurs virtuels. RediSearch prend en charge les stratégies Enterprise et sans cluster, et la stratégie Enterprise expose un point de terminaison unique qu'un client qui ne gère pas les clusters peut utiliser.
  options:
    a:
      en: |
        RediSearch isn't available on the Flash Optimized tier.
      fr: |
        RediSearch n'est pas disponible sur le niveau Flash Optimized.
    c:
      en: |
        RedisTimeSeries stores time series; it doesn't provide vector search.
      fr: |
        RedisTimeSeries stocke des séries chronologiques ; il ne fournit pas la recherche vectorielle.
    e:
      en: |
        RediSearch doesn't support the OSS clustering policy, which also requires a cluster-aware client.
      fr: |
        RediSearch ne prend pas en charge la stratégie de clustering OSS, qui exige en outre un client qui gère les clusters.
references:
  - title: Using Redis modules with Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/redis-modules
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
