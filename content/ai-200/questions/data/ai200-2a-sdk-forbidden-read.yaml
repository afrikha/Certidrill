id: ai200-2a-sdk-forbidden-read
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Python function app that reads customer preferences from an Azure Cosmos DB for NoSQL account to personalize chatbot answers. The code creates `CosmosClient(endpoint, credential=DefaultAzureCredential())` and calls `read_item()`. Key-based authentication is disabled on the account (`disableLocalAuth` is `true`).

    The managed identity of the function app has the **Contributor** role on the account, but every `read_item()` call returns **403 Forbidden**.

    You need to fix the error. The function app only reads data, and the solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Northwind Traders dispose d'une application de fonction Python qui lit les préférences des clients dans un compte Azure Cosmos DB for NoSQL pour personnaliser les réponses d'un chatbot. Le code crée `CosmosClient(endpoint, credential=DefaultAzureCredential())` et appelle `read_item()`. L'authentification par clé est désactivée sur le compte (`disableLocalAuth` vaut `true`).

    L'identité managée de l'application de fonction a le rôle **Contributor** sur le compte, mais chaque appel à `read_item()` renvoie **403 Forbidden**.

    Vous devez corriger l'erreur. L'application de fonction ne fait que lire des données et la solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Cosmos DB Account Reader Role to the identity on the account by using Access control (IAM).", fr: "Attribuer le rôle Cosmos DB Account Reader Role à l'identité sur le compte à l'aide du contrôle d'accès (IAM)." } }
    - { id: b, text: { en: "Assign the Owner role to the identity on the resource group that contains the account.", fr: "Attribuer le rôle Owner à l'identité sur le groupe de ressources qui contient le compte." } }
    - { id: c, text: { en: "Store the read-only account key in Azure Key Vault and pass it to CosmosClient as the credential.", fr: "Stocker la clé de compte en lecture seule dans Azure Key Vault et la passer à CosmosClient comme informations d'identification." } }
    - { id: d, text: { en: "Assign the Cosmos DB Built-in Data Reader role to the identity by running az cosmosdb sql role assignment create.", fr: "Attribuer le rôle Cosmos DB Built-in Data Reader à l'identité en exécutant az cosmosdb sql role assignment create." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft Entra access to items uses Azure Cosmos DB's own data plane roles, which are assigned with the Azure CLI, PowerShell or Bicep, not in the portal. Contributor is a control plane role that manages the account but grants no data actions; Cosmos DB Built-in Data Reader grants read access to the data only."
    fr: "L'accès Microsoft Entra aux éléments utilise les rôles de plan de données propres à Azure Cosmos DB, qui s'attribuent avec Azure CLI, PowerShell ou Bicep, et non dans le portail. Contributor est un rôle de plan de contrôle qui gère le compte mais n'accorde aucune action sur les données ; Cosmos DB Built-in Data Reader accorde uniquement la lecture des données."
  options:
    a:
      en: "Cosmos DB Account Reader Role is an Azure RBAC (control plane) role; it doesn't authorize data operations with a Microsoft Entra token."
      fr: "Cosmos DB Account Reader Role est un rôle Azure RBAC (plan de contrôle) ; il n'autorise pas les opérations sur les données avec un jeton Microsoft Entra."
    b:
      en: "Owner is a control plane role too, so the 403 remains, and it grants far more than needed."
      fr: "Owner est lui aussi un rôle de plan de contrôle : l'erreur 403 persiste, et il accorde bien plus que nécessaire."
    c:
      en: "Key-based authentication is disabled on the account, so any account key is rejected."
      fr: "L'authentification par clé est désactivée sur le compte : toute clé de compte est refusée."
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/security/how-to-grant-data-plane-role-based-access
