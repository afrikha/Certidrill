id: ai200-cs3b-connection-pooling
objective: "2.2.6"
type: single
caseStudy: ai200-cs3b-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the connections requirement for pg-bellows. What should you do?
  fr: |
    Vous devez respecter l'exigence relative aux connexions de pg-bellows. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set the `pgbouncer.enabled` server parameter to `true`, and keep port 5432 in the connection string of tutor-api."
        fr: "Définir le paramètre de serveur `pgbouncer.enabled` sur `true`, et conserver le port 5432 dans la chaîne de connexion de tutor-api."
    - id: b
      text:
        en: "Set the `pgbouncer.enabled` server parameter to `true`, and change the port in the connection string of tutor-api to 6432."
        fr: "Définir le paramètre de serveur `pgbouncer.enabled` sur `true`, et remplacer le port de la chaîne de connexion de tutor-api par 6432."
    - id: c
      text:
        en: "Move pg-bellows to the Burstable compute tier, and change the port in the connection string of tutor-api to 6432."
        fr: "Déplacer pg-bellows vers le niveau de calcul Burstable, et remplacer le port de la chaîne de connexion de tutor-api par 6432."
    - id: d
      text:
        en: "Set the maximum number of replicas of tutor-api to 10, and keep port 5432 in the connection string of tutor-api."
        fr: "Définir le nombre maximal de réplicas de tutor-api sur 10, et conserver le port 5432 dans la chaîne de connexion de tutor-api."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The built-in PgBouncer of Azure Database for PostgreSQL flexible server pools the client connections in transaction mode by default, so many application connections share a small number of server connections. It is enabled with the `pgbouncer.enabled` parameter, without a restart, on the General Purpose and Memory Optimized tiers, and the clients reach it on port 6432 with the same host name.
    fr: |
      Le PgBouncer intégré d'Azure Database for PostgreSQL serveur flexible regroupe les connexions clientes en mode transaction par défaut : de nombreuses connexions applicatives partagent ainsi un petit nombre de connexions au serveur. Il s'active avec le paramètre `pgbouncer.enabled`, sans redémarrage, sur les niveaux Usage général et Mémoire optimisée, et les clients l'atteignent sur le port 6432 avec le même nom d'hôte.
  options:
    a:
      en: |
        Port 5432 connects directly to PostgreSQL and bypasses PgBouncer, so the number of server connections does not change.
      fr: |
        Le port 5432 se connecte directement à PostgreSQL et contourne PgBouncer : le nombre de connexions au serveur ne change pas.
    c:
      en: |
        Changing the tier changes the compute of pg-bellows, and the built-in PgBouncer is not supported on the Burstable tier.
      fr: |
        Changer de niveau modifie le calcul de pg-bellows, et le PgBouncer intégré n'est pas pris en charge sur le niveau Burstable.
    d:
      en: |
        Limiting tutor-api to 10 replicas breaks the requirement that it can scale to 40 replicas.
      fr: |
        Limiter tutor-api à 10 réplicas enfreint l'exigence selon laquelle il doit pouvoir monter jusqu'à 40 réplicas.
references:
  - title: PgBouncer in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/concepts-pgbouncer
