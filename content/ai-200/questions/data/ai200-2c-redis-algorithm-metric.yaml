id: ai200-2c-redis-algorithm-metric
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wide World Importers is designing vector indexes in Azure Managed Redis for four workloads, shown in the answer area.

    Which vector index setting should you use for each workload? To answer, drag the appropriate settings to the correct workloads. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers conçoit des index vectoriels dans Azure Managed Redis pour quatre charges de travail, indiquées dans la zone de réponse.

    Quel paramètre d'index vectoriel devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les paramètres appropriés vers les charges de travail correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: flat, text: { en: "Algorithm: FLAT", fr: "Algorithme : FLAT" } }
    - { id: hnsw, text: { en: "Algorithm: HNSW", fr: "Algorithme : HNSW" } }
    - { id: cosine, text: { en: "Metric: COSINE", fr: "Métrique : COSINE" } }
    - { id: l2, text: { en: "Metric: L2", fr: "Métrique : L2" } }
    - { id: ip, text: { en: "Metric: IP", fr: "Métrique : IP" } }
  targets:
    - id: faq
      text: { en: "3,000 FAQ embeddings; every search must be exhaustive and exact.", fr: "3 000 incorporations de FAQ ; chaque recherche doit être exhaustive et exacte." }
    - id: catalog
      text: { en: "20 million product embeddings; low latency matters more than exhaustive precision.", fr: "20 millions d'incorporations de produits ; une faible latence compte davantage qu'une précision exhaustive." }
    - id: text
      text: { en: "Text embeddings that aren't normalized, from a model designed for cosine similarity.", fr: "Incorporations de texte non normalisées, issues d'un modèle conçu pour la similarité cosinus." }
    - id: image
      text: { en: "Image embeddings from a model designed to be compared by Euclidean distance.", fr: "Incorporations d'images issues d'un modèle conçu pour être comparé par distance euclidienne." }
answer:
  mapping: { faq: flat, catalog: hnsw, text: cosine, image: l2 }
explanation:
  correct:
    en: |
      FLAT is an exact brute-force index, suited to small datasets or workloads that require exhaustive search. HNSW is an approximate nearest neighbor index for large datasets where latency matters more than exhaustive precision. The distance metric depends on the embedding model: COSINE for a model designed for cosine similarity, L2 for Euclidean distance. IP gives cosine rankings only on normalized vectors.
    fr: |
      FLAT est un index exhaustif exact, adapté aux petits jeux de données ou aux charges de travail qui exigent une recherche exhaustive. HNSW est un index approximatif des plus proches voisins pour les grands jeux de données où la latence compte davantage que la précision exhaustive. La métrique de distance dépend du modèle d'incorporation : COSINE pour un modèle conçu pour la similarité cosinus, L2 pour la distance euclidienne. IP ne donne le même classement que le cosinus que sur des vecteurs normalisés.
references:
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
