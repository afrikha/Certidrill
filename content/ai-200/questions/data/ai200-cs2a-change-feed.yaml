id: ai200-cs2a-change-feed
objective: "2.1.4"
type: yesno_statements
caseStudy: ai200-cs2a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    To meet the notifications requirement, you write a function named **NotifyBroker** in the Python v2 programming model. The function uses the following trigger, which reads the change feed of the declarations container in latest version mode.

    ```python
    @app.cosmos_db_trigger(arg_name="documents",
                           database_name="trade",
                           container_name="declarations",
                           connection="COSMOS_WWI",
                           lease_container_name="leases")
    def notify_broker(documents: func.DocumentList):
        ...
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence relative aux notifications, vous écrivez une fonction nommée **NotifyBroker** dans le modèle de programmation Python v2. La fonction utilise le déclencheur suivant, qui lit le flux de modification du conteneur declarations en mode dernière version.

    ```python
    @app.cosmos_db_trigger(arg_name="documents",
                           database_name="trade",
                           container_name="declarations",
                           connection="COSMOS_WWI",
                           lease_container_name="leases")
    def notify_broker(documents: func.DocumentList):
        ...
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: NotifyBroker is invoked when a declaration is deleted from the declarations container.
        fr: NotifyBroker est appelée quand une déclaration est supprimée du conteneur declarations.
    - id: s2
      text:
        en: If a second function app monitors the declarations container with the same leases container and no lease prefix, only one of the two functions is triggered.
        fr: Si une deuxième application de fonction surveille le conteneur declarations avec le même conteneur leases et sans préfixe de bail, une seule des deux fonctions est déclenchée.
    - id: s3
      text:
        en: NotifyBroker receives the changes to the declarations of a given shipper in the order in which they were modified.
        fr: NotifyBroker reçoit les modifications des déclarations d'un même expéditeur dans l'ordre dans lequel elles ont été effectuées.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In latest version mode, the change feed publishes inserts and updates but not deletes, so a deleted declaration does not invoke the function. The trigger stores its leases in the leases container: two functions on the same container must each use a dedicated lease container or a different lease prefix, otherwise only one of them is triggered. Changes are delivered in modification order within a partition key value, and the partition key here is `/shipperId`.
    fr: |
      En mode dernière version, le flux de modification publie les insertions et les mises à jour, mais pas les suppressions : une déclaration supprimée n'appelle pas la fonction. Le déclencheur stocke ses baux dans le conteneur leases : deux fonctions sur le même conteneur doivent chacune utiliser un conteneur de baux dédié ou un préfixe de bail différent, sinon une seule d'entre elles est déclenchée. Les modifications sont remises dans l'ordre de modification au sein d'une valeur de clé de partition, et la clé de partition est ici `/shipperId`.
references:
