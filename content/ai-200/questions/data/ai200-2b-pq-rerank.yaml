id: ai200-2b-pq-rerank
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware searches 40 million product embeddings through a DiskANN index on Azure Database for PostgreSQL. The sessions keep the default value of `diskann.iterative_search`, and the order of the top results is sometimes slightly wrong.

    You need to retrieve 50 candidates through the index, then return the 10 closest products ranked by their exact distance.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware recherche parmi 40 millions d'incorporations de produits au moyen d'un index DiskANN sur Azure Database for PostgreSQL. Les sessions conservent la valeur par défaut de `diskann.iterative_search`, et l'ordre des premiers résultats est parfois légèrement faux.

    Vous devez récupérer 50 candidats au moyen de l'index, puis renvoyer les 10 produits les plus proches classés selon leur distance exacte.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT id
    FROM (
        SELECT id, embedding <=> %(q)s::vector AS distance
        FROM products
        ORDER BY embedding <=> %(q)s::vector
        LIMIT [[inner]]
    ) AS t
    ORDER BY [[order]]
    LIMIT [[outer]];
  slots:
    - id: inner
      options:
        - { id: i5, text: "5" }
        - { id: i10, text: "10" }
        - { id: i50, text: "50" }
    - id: order
      options:
        - { id: dist, text: t.distance }
        - { id: distdesc, text: t.distance DESC }
        - { id: id, text: t.id }
    - id: outer
      options:
        - { id: o10, text: "10" }
        - { id: o50, text: "50" }
        - { id: o100, text: "100" }
answer:
  values: { inner: i50, order: dist, outer: o10 }
explanation:
  correct:
    en: "The inner query uses the DiskANN index to fetch 50 candidates and computes their distance from the stored vectors. The default `relaxed_order` iterative search might return these rows out of order, so the outer query sorts the candidates by that exact distance in ascending order, because a smaller distance means more similar, and keeps the top 10."
    fr: "La requête interne utilise l'index DiskANN pour récupérer 50 candidats et calcule leur distance à partir des vecteurs stockés. La recherche itérative `relaxed_order` par défaut peut renvoyer ces lignes dans le désordre : la requête externe trie donc ces candidats selon cette distance exacte par ordre croissant, car une distance plus petite signifie plus similaire, et garde les 10 premiers."
  options:
    i10:
      en: "The requirement asks for 50 candidates; with 10, the outer query can only reorder the same 10 rows."
      fr: "L'exigence demande 50 candidats ; avec 10, la requête externe ne peut que réordonner les 10 mêmes lignes."
    distdesc:
      en: "pgvector operators return distances, so a descending sort returns the least similar candidates first."
      fr: "Les opérateurs pgvector renvoient des distances : un tri décroissant renvoie d'abord les candidats les moins similaires."
    id:
      en: "Sorting by id ignores similarity."
      fr: "Trier par id ignore la similarité."
    o50:
      en: "The application needs the 10 closest products, not all the candidates."
      fr: "L'application a besoin des 10 produits les plus proches, pas de tous les candidats."
references:
  - title: Enable and Use DiskANN in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgdiskann
