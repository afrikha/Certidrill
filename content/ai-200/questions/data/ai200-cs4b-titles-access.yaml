id: ai200-cs4b-titles-access
objective: "2.1.1"
type: single
caseStudy: ai200-cs4b-southridge
difficulty: 1
status: draft
stem:
  en: |
    recs-api creates its client with `CosmosClient(url, credential=DefaultAzureCredential())`. Every call to `query_items` on the titles container fails with `403 Forbidden`.

    You need to meet the catalog reads requirement. What should you do?
  fr: |
    recs-api crée son client avec `CosmosClient(url, credential=DefaultAzureCredential())`. Chaque appel de `query_items` sur le conteneur titles échoue avec `403 Forbidden`.

    Vous devez satisfaire l'exigence relative à la lecture du catalogue. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run `az cosmosdb sql role assignment create` to assign Cosmos DB Built-in Data Contributor to the identity of recs-api, scoped to `/dbs/media/colls/titles`."
        fr: "Exécuter `az cosmosdb sql role assignment create` pour attribuer Cosmos DB Built-in Data Contributor à l'identité de recs-api, avec l'étendue `/dbs/media/colls/titles`."
    - id: b
      text:
        en: "Run `az role assignment create` to assign DocumentDB Account Contributor to the identity of recs-api, scoped to cosmos-southridge."
        fr: "Exécuter `az role assignment create` pour attribuer DocumentDB Account Contributor à l'identité de recs-api, avec l'étendue cosmos-southridge."
    - id: c
      text:
        en: "Run `az cosmosdb sql role assignment create` to assign Cosmos DB Built-in Data Reader to the identity of recs-api, scoped to `/dbs/media/colls/titles`."
        fr: "Exécuter `az cosmosdb sql role assignment create` pour attribuer Cosmos DB Built-in Data Reader à l'identité de recs-api, avec l'étendue `/dbs/media/colls/titles`."
    - id: d
      text:
        en: "Run `az role assignment create` to assign Cosmos DB Operator to the identity of recs-api, scoped to cosmos-southridge."
        fr: "Exécuter `az role assignment create` pour attribuer Cosmos DB Operator à l'identité de recs-api, avec l'étendue cosmos-southridge."
answer: { optionId: c }
explanation:
  correct:
    en: "Data operations with Microsoft Entra ID are authorized by the data plane roles of Azure Cosmos DB, not by Azure RBAC roles such as Contributor, which is why recs-api gets 403. Cosmos DB Built-in Data Reader allows reads and queries, and the container scope limits it to titles: it's the least privileged assignment, created with `az cosmosdb sql role assignment create`."
    fr: "Les opérations sur les données avec Microsoft Entra ID sont autorisées par les rôles de plan de données d'Azure Cosmos DB, pas par des rôles Azure RBAC comme Contributor : c'est pourquoi recs-api reçoit 403. Cosmos DB Built-in Data Reader autorise les lectures et les requêtes, et l'étendue du conteneur la limite à titles : c'est l'attribution la moins privilégiée, créée avec `az cosmosdb sql role assignment create`."
  options:
    a: { en: "Data Contributor also allows recs-api to create, replace and delete items, which exceeds the read-only need.", fr: "Data Contributor permet aussi à recs-api de créer, remplacer et supprimer des éléments, ce qui dépasse le besoin en lecture seule." }
    b: { en: "DocumentDB Account Contributor is a control plane role: it manages the account but grants no data access with a Microsoft Entra token.", fr: "DocumentDB Account Contributor est un rôle de plan de contrôle : il gère le compte mais n'accorde aucun accès aux données avec un jeton Microsoft Entra." }
    d: { en: "Cosmos DB Operator manages Azure Cosmos DB accounts but can't access the data in them.", fr: "Cosmos DB Operator gère les comptes Azure Cosmos DB mais ne peut pas accéder à leurs données." }
references:
  - title: Connect using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
