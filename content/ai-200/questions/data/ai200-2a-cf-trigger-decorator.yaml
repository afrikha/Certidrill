id: ai200-2a-cf-trigger-decorator
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware is writing a Python function (v2 programming model) that generates embeddings each time a product is added or updated in the **products** container of the **catalog** database in Azure Cosmos DB for NoSQL. A lease container named **leases** already exists in the same database.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware écrit une fonction Python (modèle de programmation v2) qui génère des incorporations chaque fois qu'un produit est ajouté ou mis à jour dans le conteneur **products** de la base de données **catalog** d'Azure Cosmos DB for NoSQL. Un conteneur de baux nommé **leases** existe déjà dans la même base de données.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import azure.functions as func

    app = func.FunctionApp()

    @app.[[decorator]](arg_name="documents",
                           database_name="catalog",
                           [[monitored]]="products",
                           connection="COSMOS_CONNECTION",
                           [[lease]]="leases")
    def embed_products(documents: func.[[argtype]]):
        for doc in documents:
            upsert_embedding(doc)
  slots:
    - id: decorator
      options:
        - { id: trigger, text: cosmos_db_trigger }
        - { id: input, text: cosmos_db_input }
        - { id: output, text: cosmos_db_output }
    - id: monitored
      options:
        - { id: container, text: container_name }
        - { id: leasename, text: lease_container_name }
        - { id: argname, text: arg_name }
    - id: lease
      options:
        - { id: leasename, text: lease_container_name }
        - { id: container, text: container_name }
        - { id: connection, text: connection }
    - id: argtype
      options:
        - { id: doclist, text: DocumentList }
        - { id: httpreq, text: HttpRequest }
        - { id: stream, text: InputStream }
answer:
  values: { decorator: trigger, monitored: container, lease: leasename, argtype: doclist }
explanation:
  correct:
    en: "`cosmos_db_trigger` runs the function for new and updated items of the monitored container named by `container_name`, and stores its progress in the container named by `lease_container_name` (`leases` by default). The function receives the batch of changed items as a `func.DocumentList`."
    fr: "`cosmos_db_trigger` exécute la fonction pour les éléments nouveaux et mis à jour du conteneur surveillé indiqué par `container_name`, et stocke sa progression dans le conteneur indiqué par `lease_container_name` (`leases` par défaut). La fonction reçoit le lot d'éléments modifiés sous forme de `func.DocumentList`."
  options:
    input: { en: "An input binding reads items when the function runs for another reason; it doesn't react to changes.", fr: "Une liaison d'entrée lit des éléments quand la fonction s'exécute pour une autre raison ; elle ne réagit pas aux modifications." }
    output: { en: "An output binding writes items to a container.", fr: "Une liaison de sortie écrit des éléments dans un conteneur." }
    httpreq: { en: "HttpRequest is the type of an HTTP trigger.", fr: "HttpRequest est le type d'un déclencheur HTTP." }
    stream: { en: "InputStream is used by Blob storage bindings.", fr: "InputStream est utilisé par les liaisons de Stockage Blob." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
