id: ai200-2b-partial-instock
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's shopping assistant runs on Azure Database for PostgreSQL. Ninety-five percent of the searches contain `WHERE in_stock = true AND category_id = %s`, and only a small fraction of the products are in stock at any time.

    You need an index that serves these searches and is as small as possible.

    Which statement should you run?
  fr: |
    L'assistant d'achat d'Adatum s'exécute sur Azure Database for PostgreSQL. Quatre-vingt-quinze pour cent des recherches contiennent `WHERE in_stock = true AND category_id = %s`, et seule une petite partie des produits est en stock à un instant donné.

    Vous avez besoin d'un index qui sert ces recherches et qui soit le plus petit possible.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE INDEX ON products (in_stock, category_id);" }
    - { id: b, text: "CREATE INDEX ON products (category_id) WHERE in_stock = true;" }
    - { id: c, text: "CREATE INDEX ON products (in_stock);" }
    - { id: d, text: "CREATE INDEX ON products USING hash (category_id);" }
answer: { optionId: b }
explanation:
  correct:
    en: "A partial index contains only the rows that match its WHERE predicate. When most queries carry the same condition, such as in-stock products, indexing category_id only for those rows gives a much smaller index that the planner uses for queries with the same predicate."
    fr: "Un index partiel ne contient que les lignes qui correspondent à son prédicat WHERE. Quand la plupart des requêtes portent la même condition, comme les produits en stock, indexer category_id uniquement pour ces lignes donne un index bien plus petit, que le planificateur utilise pour les requêtes ayant le même prédicat."
  options:
    a:
      en: "The composite index serves the query but contains every row, including the products that are out of stock."
      fr: "L'index composite sert la requête, mais il contient toutes les lignes, y compris les produits en rupture de stock."
    c:
      en: "An index on a boolean column alone does not filter on category_id and still covers every row."
      fr: "Un index sur une colonne booléenne seule ne filtre pas sur category_id et couvre toujours toutes les lignes."
    d:
      en: "The hash index covers every row and ignores the in_stock condition."
      fr: "L'index hash couvre toutes les lignes et ignore la condition in_stock."
references:
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
