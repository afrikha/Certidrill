id: ai200-2a-cf-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a Python function with the Azure Cosmos DB trigger to keep an AI shopping assistant synchronized with the **orders** container, which is partitioned on `/customerId`. The change feed uses the latest version mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise une fonction Python avec le déclencheur Azure Cosmos DB pour synchroniser un assistant d'achat IA avec le conteneur **orders**, partitionné sur `/customerId`. Le flux de modification utilise le mode dernière version.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If an order is updated three times between two reads of the change feed, the function receives only the latest version of the order."
        fr: "Si une commande est mise à jour trois fois entre deux lectures du flux de modification, la fonction ne reçoit que la dernière version de la commande."
    - id: s2
      text:
        en: "Changes are delivered in modification order across all customers, not only within each customer."
        fr: "Les modifications sont livrées dans l'ordre de modification pour l'ensemble des clients, et pas seulement au sein de chaque client."
    - id: s3
      text:
        en: "Each document passed to the function indicates whether it was inserted or updated."
        fr: "Chaque document passé à la fonction indique s'il a été inséré ou mis à jour."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "In latest version mode, only the most recent change of an item is included, so intermediate updates can be missed. Order is guaranteed within a partition key value (here, per customer), not across partition key values. The trigger provides only the document itself; to tell inserts from updates, add your own timestamp fields."
    fr: "En mode dernière version, seule la modification la plus récente d'un élément est incluse : des mises à jour intermédiaires peuvent donc manquer. L'ordre est garanti au sein d'une valeur de clé de partition (ici, par client), pas entre les valeurs de clé de partition. Le déclencheur fournit seulement le document lui-même ; pour distinguer les insertions des mises à jour, ajoutez vos propres champs d'horodatage."
references:
  - title: Change Feed Design Patterns - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-design-patterns
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
