id: ai200-2c-redis-vector-bytes
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation indexes knowledge base articles in Azure Managed Redis. The index covers hashes whose keys start with `kb:` and defines a vector field named `embedding` with `TYPE FLOAT32` and `DIM 1536`. The embedding API returns `vec`, a Python list of 1,536 floats, and NumPy is imported as `np`.

    The loader runs the following code.

    ```python
    r.hset(f"kb:{article_id}", mapping={
        "title": title,
        "content": content,
        "embedding": value,
    })
    ```

    You need each article to be searchable by vector similarity.

    Which expression should you assign to `value`?
  fr: |
    Adatum Corporation indexe des articles de base de connaissances dans Azure Managed Redis. L'index couvre les hachages dont les clés commencent par `kb:` et définit un champ vectoriel nommé `embedding` avec `TYPE FLOAT32` et `DIM 1536`. L'API d'incorporation renvoie `vec`, une liste Python de 1 536 nombres à virgule flottante, et NumPy est importé sous le nom `np`.

    Le chargeur exécute le code suivant.

    ```python
    r.hset(f"kb:{article_id}", mapping={
        "title": title,
        "content": content,
        "embedding": value,
    })
    ```

    Chaque article doit pouvoir être trouvé par similarité vectorielle.

    Quelle expression devez-vous affecter à `value` ?
body:
  options:
    - { id: a, text: "np.array(vec).tobytes()" }
    - { id: b, text: "json.dumps(vec)" }
    - { id: c, text: "vec" }
    - { id: d, text: "np.array(vec, dtype=np.float32).tobytes()" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a hash, a vector field is stored as a binary blob whose format matches the `TYPE` of the index. Converting the list to a `float32` NumPy array and calling `tobytes()` produces 1,536 × 4 = 6,144 bytes, exactly what a FLOAT32 field of 1,536 dimensions expects.
    fr: |
      Dans un hachage, un champ vectoriel est stocké sous forme de blob binaire dont le format correspond au `TYPE` de l'index. Convertir la liste en tableau NumPy `float32` et appeler `tobytes()` produit 1 536 × 4 = 6 144 octets, exactement ce qu'attend un champ FLOAT32 de 1 536 dimensions.
  options:
    a:
      en: |
        Without `dtype`, NumPy creates a `float64` array, so the blob is twice too large and doesn't match the FLOAT32 field.
      fr: |
        Sans `dtype`, NumPy crée un tableau `float64` : le blob est deux fois trop grand et ne correspond pas au champ FLOAT32.
    b:
      en: |
        A JSON string is text, not the binary vector format of a hash field.
      fr: |
        Une chaîne JSON est du texte, pas le format vectoriel binaire d'un champ de hachage.
    c:
      en: |
        A hash field value must be a string, bytes or a number; redis-py rejects a Python list.
      fr: |
        La valeur d'un champ de hachage doit être une chaîne, des octets ou un nombre ; redis-py refuse une liste Python.
references:
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
