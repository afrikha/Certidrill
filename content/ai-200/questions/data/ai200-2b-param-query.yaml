id: ai200-2b-param-query
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a support assistant in Python. The assistant reads the tickets of a customer from an Azure Database for PostgreSQL flexible server by using psycopg 3.

    The `customer_email` variable comes directly from the chat request. The query must not be vulnerable to SQL injection.

    Which line of code should you use?
  fr: |
    Contoso développe un assistant de support en Python. L'assistant lit les tickets d'un client dans un serveur flexible Azure Database for PostgreSQL à l'aide de psycopg 3.

    La variable `customer_email` provient directement de la requête de conversation. La requête ne doit pas être vulnérable à l'injection SQL.

    Quelle ligne de code devez-vous utiliser ?
body:
  options:
    - { id: a, text: "cur.execute(f\"SELECT id, subject FROM tickets WHERE email = '{customer_email}'\")" }
    - { id: b, text: "cur.execute(\"SELECT id, subject FROM tickets WHERE email = %s\", (customer_email,))" }
    - { id: c, text: "cur.execute(\"SELECT id, subject FROM tickets WHERE email = ?\", (customer_email,))" }
    - { id: d, text: "cur.execute(\"SELECT id, subject FROM tickets WHERE email = '%s'\" % customer_email)" }
answer: { optionId: b }
explanation:
  correct:
    en: "psycopg uses `%s` placeholders and a separate tuple of parameters, as in the Microsoft Learn Python quickstart. The driver sends the value separately from the SQL text, so a malicious email address cannot change the statement."
    fr: "psycopg utilise des espaces réservés `%s` et un tuple de paramètres distinct, comme dans le guide de démarrage rapide Python de Microsoft Learn. Le pilote envoie la valeur séparément du texte SQL : une adresse e-mail malveillante ne peut pas modifier l'instruction."
  options:
    a:
      en: "The f-string pastes the user input into the SQL text, which is exactly what allows SQL injection."
      fr: "La f-string insère la saisie de l'utilisateur dans le texte SQL, ce qui permet justement l'injection SQL."
    c:
      en: "The `?` placeholder style is not supported by psycopg; the statement fails instead of binding the parameter."
      fr: "Le style d'espace réservé `?` n'est pas pris en charge par psycopg ; l'instruction échoue au lieu de lier le paramètre."
    d:
      en: "The Python `%` operator formats the string before psycopg receives it, so the input is still concatenated into the SQL text."
      fr: "L'opérateur Python `%` formate la chaîne avant que psycopg la reçoive : la saisie est toujours concaténée au texte SQL."
references:
  - title: "Quickstart: Use Python to Connect and Query Data in Azure Database for PostgreSQL Flexible Server"
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/connect-python
