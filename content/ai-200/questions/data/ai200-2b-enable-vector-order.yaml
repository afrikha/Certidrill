id: ai200-2b-enable-vector-order
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has just created an Azure Database for PostgreSQL flexible server with a database named **docs**. You must load two million existing 1,536-dimension embeddings and then serve semantic searches through an HNSW index.

    The solution must minimize the total time of the load and of the index build.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware vient de créer un serveur flexible Azure Database for PostgreSQL avec une base de données nommée **docs**. Vous devez charger deux millions d'incorporations existantes de 1 536 dimensions, puis servir des recherches sémantiques au moyen d'un index HNSW.

    La solution doit réduire au minimum la durée totale du chargement et de la construction de l'index.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: allow, text: { en: "Add `vector` to the `azure.extensions` server parameter.", fr: "Ajouter `vector` au paramètre de serveur `azure.extensions`." } }
    - { id: create, text: { en: "Connect to the docs database and run `CREATE EXTENSION vector;`.", fr: "Se connecter à la base de données docs et exécuter `CREATE EXTENSION vector;`." } }
    - { id: table, text: { en: "Create the chunks table with an `embedding vector(1536)` column.", fr: "Créer la table chunks avec une colonne `embedding vector(1536)`." } }
    - { id: load, text: { en: "Load the existing embeddings into the chunks table.", fr: "Charger les incorporations existantes dans la table chunks." } }
    - { id: index, text: { en: "Create the HNSW index on the embedding column.", fr: "Créer l'index HNSW sur la colonne embedding." } }
    - { id: postgres, text: { en: "Connect to the postgres database and run `CREATE EXTENSION vector;`.", fr: "Se connecter à la base de données postgres et exécuter `CREATE EXTENSION vector;`." } }
    - { id: restart, text: { en: "Restart the server so that the vector types become available.", fr: "Redémarrer le serveur pour que les types vectoriels deviennent disponibles." } }
answer:
  sequence: [ allow, create, table, load, index ]
explanation:
  correct:
    en: "An extension must be on the server allowlist before it can be created, and it is created in each database that uses it, here docs. The `vector(1536)` type then exists for the table definition. Learn recommends loading the data before creating a vector index, which is faster and gives a better index layout than maintaining the index during the load."
    fr: "Une extension doit figurer dans la liste d'autorisation du serveur avant de pouvoir être créée, et elle est créée dans chaque base de données qui l'utilise, ici docs. Le type `vector(1536)` existe alors pour la définition de la table. Learn recommande de charger les données avant de créer un index vectoriel, ce qui est plus rapide et donne une meilleure disposition de l'index que sa mise à jour pendant le chargement."
  options:
    postgres:
      en: "An extension is created per database; creating it in postgres does not make the types available in docs."
      fr: "Une extension se crée par base de données ; la créer dans postgres ne rend pas les types disponibles dans docs."
    restart:
      en: "The vector extension does not need a restart; it is usable as soon as it is created in the database."
      fr: "L'extension vector ne nécessite pas de redémarrage ; elle est utilisable dès sa création dans la base de données."
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgvector
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
