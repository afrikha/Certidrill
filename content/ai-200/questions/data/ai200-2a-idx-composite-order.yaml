id: ai200-2a-idx-composite-order
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a support copilot that lists the open tickets of a customer. The Python code runs the following query with `partition_key` set to the customer ID:

    ```sql
    SELECT c.id, c.title FROM c ORDER BY c.priority DESC, c.updatedAt ASC
    ```

    The query currently fails. You need to update the indexing policy of the container so that the query runs.

    How should you complete the indexing policy? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un copilote de support qui liste les tickets ouverts d'un client. Le code Python exécute la requête suivante avec `partition_key` défini sur l'ID du client :

    ```sql
    SELECT c.id, c.title FROM c ORDER BY c.priority DESC, c.updatedAt ASC
    ```

    La requête échoue actuellement. Vous devez mettre à jour la stratégie d'indexation du conteneur pour que la requête s'exécute.

    Comment devez-vous compléter la stratégie d'indexation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "indexingMode": "consistent",
      "automatic": true,
      "includedPaths": [ { "path": "/*" } ],
      "excludedPaths": [ { "path": "/\"_etag\"/?" } ],
      "[[section]]": [
        [
          { "path": "[[first]]", "order": "descending" },
          [[second]]
        ]
      ]
    }
  slots:
    - id: section
      options:
        - { id: composite, text: compositeIndexes }
        - { id: spatial, text: spatialIndexes }
        - { id: vector, text: vectorIndexes }
    - id: first
      options:
        - { id: priority, text: '/priority' }
        - { id: updated, text: '/updatedAt' }
        - { id: all, text: '/*' }
    - id: second
      options:
        - { id: updasc, text: '{ "path": "/updatedAt", "order": "ascending" }' }
        - { id: upddesc, text: '{ "path": "/updatedAt", "order": "descending" }' }
        - { id: prioasc, text: '{ "path": "/priority", "order": "ascending" }' }
answer:
  values: { section: composite, first: priority, second: updasc }
explanation:
  correct:
    en: "An `ORDER BY` on two or more properties requires a composite index. Its paths must follow the order of the `ORDER BY` clause, and its directions must match the query or be the exact opposite on every path: `/priority` descending then `/updatedAt` ascending."
    fr: "Un `ORDER BY` sur deux propriétés ou plus exige un index composite. Ses chemins doivent suivre l'ordre de la clause `ORDER BY`, et ses directions doivent correspondre à la requête ou être exactement inversées sur tous les chemins : `/priority` décroissant puis `/updatedAt` croissant."
  options:
    spatial: { en: "Spatial indexes serve geospatial functions, not multi-property sorts.", fr: "Les index spatiaux servent aux fonctions géospatiales, pas aux tris sur plusieurs propriétés." }
    vector: { en: "Vector indexes serve VectorDistance queries.", fr: "Les index vectoriels servent aux requêtes VectorDistance." }
    updated: { en: "The first path must be the first property of the ORDER BY clause.", fr: "Le premier chemin doit être la première propriété de la clause ORDER BY." }
    all: { en: "Composite index paths can't use the `/*` wildcard.", fr: "Les chemins d'un index composite ne peuvent pas utiliser le caractère générique `/*`." }
    upddesc: { en: "Descending on both paths matches neither `DESC, ASC` nor its exact opposite `ASC, DESC`.", fr: "Décroissant sur les deux chemins ne correspond ni à `DESC, ASC` ni à son inverse exact `ASC, DESC`." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
