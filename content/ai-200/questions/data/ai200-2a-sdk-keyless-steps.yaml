id: ai200-2a-sdk-keyless-steps
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a container app named **ca-recommend** that runs an older version of a recommendation API. You are releasing a new version that reads and writes items in an Azure Cosmos DB for NoSQL account. The new code creates `CosmosClient(endpoint, credential=DefaultAzureCredential())`.

    No secret may be stored for the connection, and the first request after the new version is deployed must succeed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'une application conteneur nommée **ca-recommend** qui exécute une ancienne version d'une API de recommandation. Vous publiez une nouvelle version qui lit et écrit des éléments dans un compte Azure Cosmos DB for NoSQL. Le nouveau code crée `CosmosClient(endpoint, credential=DefaultAzureCredential())`.

    Aucun secret ne doit être stocké pour la connexion, et la première requête après le déploiement de la nouvelle version doit réussir.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: identity, text: { en: "Enable the system-assigned managed identity of ca-recommend.", fr: "Activer l'identité managée affectée par le système de ca-recommend." } }
    - { id: principal, text: { en: "Retrieve the principal ID (object ID) of the identity.", fr: "Récupérer l'ID du principal (ID d'objet) de l'identité." } }
    - { id: assign, text: { en: "Run az cosmosdb sql role assignment create with the Cosmos DB Built-in Data Contributor role.", fr: "Exécuter az cosmosdb sql role assignment create avec le rôle Cosmos DB Built-in Data Contributor." } }
    - { id: deploy, text: { en: "Deploy the new revision that uses DefaultAzureCredential.", fr: "Déployer la nouvelle révision qui utilise DefaultAzureCredential." } }
    - { id: iam, text: { en: "Assign the Contributor role on the account in Access control (IAM).", fr: "Attribuer le rôle Contributor sur le compte dans le contrôle d'accès (IAM)." } }
    - { id: secret, text: { en: "Store the primary key of the account as a secret of ca-recommend.", fr: "Stocker la clé primaire du compte comme secret de ca-recommend." } }
answer:
  sequence: [ identity, principal, assign, deploy ]
explanation:
  correct:
    en: "The identity must exist before you can read its principal ID, and a Cosmos DB data plane role assignment needs that object ID. The role must be assigned before the new revision starts sending requests, otherwise the first calls fail with 403."
    fr: "L'identité doit exister avant de pouvoir lire son ID de principal, et une attribution de rôle de plan de données Cosmos DB nécessite cet ID d'objet. Le rôle doit être attribué avant que la nouvelle révision envoie des requêtes, sinon les premiers appels échouent avec une erreur 403."
  options:
    iam: { en: "Contributor is a control plane role: it doesn't authorize data operations with a Microsoft Entra token.", fr: "Contributor est un rôle de plan de contrôle : il n'autorise pas les opérations sur les données avec un jeton Microsoft Entra." }
    secret: { en: "An account key is a secret, which the requirements forbid.", fr: "Une clé de compte est un secret, ce que les exigences interdisent." }
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/security/how-to-grant-data-plane-role-based-access
