id: ai200-cs1a-eviction-policy
objective: "2.3.1"
type: single
caseStudy: ai200-cs1a-proseware
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the caching requirement. Which eviction policy should you configure for amr-proseware?
  fr: |
    Vous devez satisfaire l'exigence relative à la mise en cache. Quelle stratégie d'éviction devez-vous configurer pour amr-proseware ?
body:
  options:
    - { id: a, text: volatile-lru }
    - { id: b, text: allkeys-random }
    - { id: c, text: noeviction }
    - { id: d, text: allkeys-lru }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The cached results have no TTL. With `allkeys-lru`, any key can be evicted under memory pressure, starting with the least recently used ones, so new results can always be written.
    fr: |
      Les résultats mis en cache n'ont pas de durée de vie (TTL). Avec `allkeys-lru`, n'importe quelle clé peut être évincée en cas de saturation de la mémoire, en commençant par les moins récemment utilisées : de nouveaux résultats peuvent toujours être écrits.
  options:
    a:
      en: "volatile-lru is the default policy of Azure Managed Redis; it evicts only keys that have a TTL, so keys without an expiration are never evicted."
      fr: "volatile-lru est la stratégie par défaut d'Azure Managed Redis ; elle n'évince que les clés qui ont une durée de vie : les clés sans expiration ne sont jamais évincées."
    b:
      en: "allkeys-random evicts keys at random, not the least recently used ones."
      fr: "allkeys-random évince des clés au hasard, pas les moins récemment utilisées."
    c:
      en: "noeviction evicts nothing, so writes fail when the memory is full."
      fr: "noeviction n'évince rien : les écritures échouent quand la mémoire est pleine."
references:
  - title: Memory management for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-memory-management
