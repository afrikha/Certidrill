id: ai200-sr2-pg-connections-1
objective: "2.2.6"
type: series_yesno
series: ai200-sr2-pg-connections
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You increase the max_connections server parameter.
  fr: Vous augmentez le paramètre de serveur max_connections.
body:
  solution:
    en: You increase the value of the **max_connections** server parameter of pg-fabrikam. The app keeps opening one connection per request on port 5432.
    fr: Vous augmentez la valeur du paramètre de serveur **max_connections** de pg-fabrikam. L'application continue d'ouvrir une connexion par requête sur le port 5432.
answer: { value: false }
explanation:
  correct:
    en: A higher limit can delay the "too many connections" errors, but every request still opens and closes its own server connection. No connection is reused, so the time spent opening connections stays the same.
    fr: "Une limite plus élevée peut retarder les erreurs « too many connections », mais chaque requête ouvre et ferme toujours sa propre connexion au serveur. Aucune connexion n'est réutilisée : le temps passé à ouvrir des connexions reste le même."
references:
  - title: PgBouncer in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
