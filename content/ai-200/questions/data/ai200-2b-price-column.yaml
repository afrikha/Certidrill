id: ai200-2b-price-column
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind is designing the products table of a semantic shopping assistant on Azure Database for PostgreSQL. Almost every search filters on a category and on a price range before ranking by vector distance. Each supplier also provides its own attributes, which differ from one supplier to another.

    The design must keep the category and price filters fast and give the query planner accurate statistics.

    How should you store the data?
  fr: |
    Northwind conçoit la table products d'un assistant d'achat sémantique sur Azure Database for PostgreSQL. Presque toutes les recherches filtrent sur une catégorie et sur une plage de prix avant le classement par distance vectorielle. Chaque fournisseur fournit aussi ses propres attributs, qui diffèrent d'un fournisseur à l'autre.

    La conception doit garder les filtres de catégorie et de prix rapides et donner au planificateur de requêtes des statistiques précises.

    Comment devez-vous stocker les données ?
body:
  options:
    - { id: a, text: { en: "Store the category and price in integer and numeric columns with B-tree indexes, and the rest in jsonb.", fr: "Stocker la catégorie et le prix dans des colonnes integer et numeric avec des index B-tree, et le reste en jsonb." } }
    - { id: b, text: { en: "Store the category and price in text columns, and the supplier attributes in a jsonb column.", fr: "Stocker la catégorie et le prix dans des colonnes text, et les attributs des fournisseurs dans une colonne jsonb." } }
    - { id: c, text: { en: "Store the category, price and supplier attributes in one jsonb column with a GIN index.", fr: "Stocker la catégorie, le prix et les attributs des fournisseurs dans une colonne jsonb avec un index GIN." } }
    - { id: d, text: { en: "Create one products table per category, each with a jsonb column for the price and the attributes.", fr: "Créer une table products par catégorie, chacune avec une colonne jsonb pour le prix et les attributs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Learn recommends a hybrid design. Attributes known at design time and used for filtering go into native typed columns, which support B-tree indexes for equality and range and give the planner reliable statistics. Dynamic attributes go into jsonb."
    fr: "Learn recommande une conception hybride. Les attributs connus à la conception et utilisés pour filtrer vont dans des colonnes natives typées, qui prennent en charge les index B-tree pour l'égalité et les plages et donnent au planificateur des statistiques fiables. Les attributs dynamiques vont dans jsonb."
  options:
    c:
      en: "GIN indexes serve containment queries, not range queries such as a price range, and jsonb gives the planner less reliable estimates."
      fr: "Les index GIN servent les requêtes de contenance, pas les requêtes de plage comme une plage de prix, et jsonb donne au planificateur des estimations moins fiables."
    b:
      en: "Prices stored as text compare as strings, so range filters and sorting do not follow numeric order."
      fr: "Des prix stockés en text se comparent comme des chaînes : les filtres de plage et le tri ne suivent pas l'ordre numérique."
    d:
      en: "One table per category multiplies the schemas and indexes, and the price range filter still cannot use a B-tree index."
      fr: "Une table par catégorie multiplie les schémas et les index, et le filtre de plage de prix ne peut toujours pas utiliser d'index B-tree."
references:
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
