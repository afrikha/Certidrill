id: ai200-2c-redis-filter-syntax
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso's index `idx:docs` in Azure Managed Redis contains a tag field named `category`, a numeric field named `year`, a text field named `content`, and a vector field named `embedding`. The hybrid queries use the form `<filter>=>[KNN 5 @embedding $vec AS score]`.

    Which filter expression should you use for each requirement? To answer, drag the appropriate expressions to the correct requirements. Each expression may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'index `idx:docs` de Contoso dans Azure Managed Redis contient un champ de balise nommé `category`, un champ numérique nommé `year`, un champ texte nommé `content` et un champ vectoriel nommé `embedding`. Les requêtes hybrides utilisent la forme `<filtre>=>[KNN 5 @embedding $vec AS score]`.

    Quelle expression de filtre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les expressions appropriées vers les exigences correspondantes. Chaque expression peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tag, text: "@category:{manuals}" }
    - { id: num, text: "@year:[2024 +inf]" }
    - { id: all, text: "*" }
    - { id: text, text: "@content:firmware" }
    - { id: numtag, text: "@year:{2024}" }
    - { id: tagrange, text: "@category:[manuals]" }
  targets:
    - id: t1
      text: { en: "Only documents in the manuals category", fr: "Uniquement les documents de la catégorie manuals" }
    - id: t2
      text: { en: "Only documents from 2024 or later", fr: "Uniquement les documents de 2024 ou postérieurs" }
    - id: t3
      text: { en: "All the documents of the index", fr: "Tous les documents de l'index" }
    - id: t4
      text: { en: "Only documents whose content contains the word firmware", fr: "Uniquement les documents dont le contenu contient le mot firmware" }
answer:
  mapping: { t1: tag, t2: num, t3: all, t4: text }
explanation:
  correct:
    en: |
      A tag field is matched with braces, `@category:{manuals}`. A numeric field uses a range in square brackets, and `+inf` leaves the upper bound open. `*` considers every document before the KNN clause. A text field is matched with a full-text term, `@content:firmware`.
    fr: |
      Un champ de balise se compare avec des accolades, `@category:{manuals}`. Un champ numérique utilise une plage entre crochets, et `+inf` laisse la borne supérieure ouverte. `*` prend en compte tous les documents avant la clause KNN. Un champ texte se compare avec un terme de recherche en texte intégral, `@content:firmware`.
  options:
    numtag:
      en: |
        Braces are the tag syntax; a numeric field needs a range.
      fr: |
        Les accolades sont la syntaxe des balises ; un champ numérique exige une plage.
    tagrange:
      en: |
        Square brackets are the numeric range syntax; a tag field needs braces.
      fr: |
        Les crochets sont la syntaxe des plages numériques ; un champ de balise exige des accolades.
references:
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
