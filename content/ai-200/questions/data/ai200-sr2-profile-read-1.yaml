stem:
  en: You authenticate with DefaultAzureCredential and call read_item.
  fr: Vous vous authentifiez avec DefaultAzureCredential et appelez read_item.
body:
  solution:
    en: |
      The assistant runs the following code.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=DefaultAzureCredential())
      container = client.get_database_client("assistant").get_container_client("profiles")
      profile = container.read_item(item=customer_id, partition_key=customer_id)
      ```
    fr: |
      L'assistant exécute le code suivant.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=DefaultAzureCredential())
      container = client.get_database_client("assistant").get_container_client("profiles")
      profile = container.read_item(item=customer_id, partition_key=customer_id)
      ```
answer: { value: true }
explanation:
  correct:
    en: read_item with the id and the partition key value is a point read, the cheapest way to read an item in Azure Cosmos DB (about 1 RU for a 1 KB item). DefaultAzureCredential uses the managed identity of the assistant, so no account key is needed.
    fr: "read_item avec l'id et la valeur de clé de partition est une lecture ponctuelle, le moyen le moins cher de lire un élément dans Azure Cosmos DB (environ 1 RU pour un élément de 1 Ko). DefaultAzureCredential utilise l'identité managée de l'assistant : aucune clé de compte n'est nécessaire."
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
  - title: "Quickstart: Use Azure Cosmos DB for NoSQL with Azure SDK for Python"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/quickstart-python
