id: ai200-2a-idx-path-precedence
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores extracted invoices in an Azure Cosmos DB for NoSQL container that has the following indexing policy:

    ```json
    {
      "indexingMode": "consistent",
      "automatic": true,
      "includedPaths": [ { "path": "/*" }, { "path": "/metadata/source/?" } ],
      "excludedPaths": [ { "path": "/metadata/*" } ]
    }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke des factures extraites dans un conteneur Azure Cosmos DB for NoSQL qui a la stratégie d'indexation suivante :

    ```json
    {
      "indexingMode": "consistent",
      "automatic": true,
      "includedPaths": [ { "path": "/*" }, { "path": "/metadata/source/?" } ],
      "excludedPaths": [ { "path": "/metadata/*" } ]
    }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A filter on c.metadata.source can use the index."
        fr: "Un filtre sur c.metadata.source peut utiliser l'index."
    - id: s2
      text:
        en: "A filter on c.metadata.author can use the index."
        fr: "Un filtre sur c.metadata.author peut utiliser l'index."
    - id: s3
      text:
        en: "A new top-level property named currency is indexed without changing the policy."
        fr: "Une nouvelle propriété de premier niveau nommée currency est indexée sans modifier la stratégie."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "When included and excluded paths overlap, the more precise path wins: `/metadata/source/?` is deeper than `/metadata/*`, so `source` stays indexed while the other properties under `metadata` are excluded. Any property outside `metadata` falls under the included `/*`, so new top-level properties are indexed automatically."
    fr: "Quand des chemins inclus et exclus se chevauchent, le chemin le plus précis l'emporte : `/metadata/source/?` est plus profond que `/metadata/*`, donc `source` reste indexé alors que les autres propriétés sous `metadata` sont exclues. Toute propriété hors de `metadata` relève du chemin inclus `/*` : les nouvelles propriétés de premier niveau sont indexées automatiquement."
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
