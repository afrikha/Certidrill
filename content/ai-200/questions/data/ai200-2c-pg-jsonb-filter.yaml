id: ai200-2c-pg-jsonb-filter
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores knowledge base chunks in Azure Database for PostgreSQL flexible server. Each row of the `kb_chunks` table has an `embedding` column of type `vector(1536)` and an `attributes` column of type `jsonb`, such as the following value.

    ```json
    { "region": "emea", "product": "loans", "year": 2025 }
    ```

    You need to add a metadata filter to the vector similarity query so that it retrieves only chunks whose `region` attribute is `emea`. The chunks have other attributes as well.

    Which two conditions can you use in the `WHERE` clause? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank stocke des segments de base de connaissances dans Azure Database for PostgreSQL serveur flexible. Chaque ligne de la table `kb_chunks` possède une colonne `embedding` de type `vector(1536)` et une colonne `attributes` de type `jsonb`, comme la valeur suivante.

    ```json
    { "region": "emea", "product": "loans", "year": 2025 }
    ```

    Vous devez ajouter un filtre de métadonnées à la requête de similarité vectorielle pour qu'elle ne récupère que les segments dont l'attribut `region` vaut `emea`. Les segments possèdent aussi d'autres attributs.

    Quelles sont les deux conditions que vous pouvez utiliser dans la clause `WHERE` ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: |
        attributes ? 'emea'
    - id: b
      text: |
        attributes @> '{"region": "emea"}'
    - id: c
      text: |
        attributes <@ '{"region": "emea"}'
    - id: d
      text: |
        attributes -> 'region' = 'emea'
    - id: e
      text: |
        attributes ->> 'region' = 'emea'
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The containment operator `@>` is true when the `attributes` document contains the pair `"region": "emea"`, whatever its other keys, and a GIN index on the column can serve it. The `->>` operator extracts the `region` value as text, which can be compared with the string `'emea'`.
    fr: |
      L'opérateur d'inclusion `@>` est vrai quand le document `attributes` contient la paire `"region": "emea"`, quelles que soient ses autres clés, et un index GIN sur la colonne peut le servir. L'opérateur `->>` extrait la valeur `region` sous forme de texte, qui peut être comparée à la chaîne `'emea'`.
  options:
    a:
      en: |
        The `?` operator tests whether `emea` exists as a top-level key, not as the value of `region`.
      fr: |
        L'opérateur `?` teste si `emea` existe comme clé de premier niveau, pas comme valeur de `region`.
    c:
      en: |
        `<@` is true when the column is contained in the literal, so rows with other attributes are excluded.
      fr: |
        `<@` est vrai quand la colonne est contenue dans le littéral : les lignes qui ont d'autres attributs sont exclues.
    d:
      en: |
        `->` returns a `jsonb` value; `'emea'` is not valid JSON, so the comparison fails.
      fr: |
        `->` renvoie une valeur `jsonb` ; `'emea'` n'est pas un JSON valide, et la comparaison échoue.
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/how-to-use-pgvector
