id: ai200-cs4b-backfill
objective: "2.1.4"
type: single
caseStudy: ai200-cs4b-southridge
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the backfill requirement. The trigger settings below use their function.json names.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence relative au rattrapage. Les paramètres du déclencheur ci-dessous utilisent leurs noms function.json.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set `startFromBeginning` to `true` on the trigger of embed-titles, keep the leases container, and restart func-southridge-embed."
        fr: "Définir `startFromBeginning` sur `true` sur le déclencheur d'embed-titles, conserver le conteneur leases et redémarrer func-southridge-embed."
    - id: b
      text:
        en: "Set `startFromBeginning` to `true` on the trigger of embed-titles, and change its lease container to a new, empty container."
        fr: "Définir `startFromBeginning` sur `true` sur le déclencheur d'embed-titles et remplacer son conteneur de baux par un nouveau conteneur vide."
    - id: c
      text:
        en: "Set `leaseContainerPrefix` to `backfill` on the trigger of embed-titles, keep the leases container, and keep the default start point."
        fr: "Définir `leaseContainerPrefix` sur `backfill` sur le déclencheur d'embed-titles, conserver le conteneur leases et garder le point de départ par défaut."
    - id: d
      text:
        en: "Set `maxItemsPerInvocation` to `1000` on the trigger of embed-titles, keep the leases container, and restart func-southridge-embed."
        fr: "Définir `maxItemsPerInvocation` sur `1000` sur le déclencheur d'embed-titles, conserver le conteneur leases et redémarrer func-southridge-embed."
answer: { optionId: b }
explanation:
  correct:
    en: "`startFromBeginning` makes the trigger read the change feed from the start of the container's history, but only when the trigger starts for the first time: once leases exist, the stored checkpoints win and the setting has no effect. With a new, empty lease container, embed-titles starts again with no checkpoint, reads every title from the beginning and embeds the 38,000 old titles; titles that are already embedded are skipped, so the second pass is harmless."
    fr: "`startFromBeginning` fait lire au déclencheur le flux de modification depuis le début de l'historique du conteneur, mais uniquement au premier démarrage du déclencheur : dès que des baux existent, les points de contrôle stockés l'emportent et le paramètre n'a aucun effet. Avec un nouveau conteneur de baux vide, embed-titles redémarre sans point de contrôle, lit tous les titres depuis le début et calcule l'incorporation des 38 000 anciens titres ; les titres qui ont déjà une incorporation sont ignorés : ce second passage est sans conséquence."
  options:
    a: { en: "The leases container already holds the checkpoints of two weeks of processing, so `startFromBeginning` has no effect and the old titles are never read.", fr: "Le conteneur leases contient déjà les points de contrôle de deux semaines de traitement : `startFromBeginning` n'a aucun effet et les anciens titres ne sont jamais lus." }
    c: { en: "A new prefix creates new leases, but with the default start point they begin at the current time, so the old titles aren't delivered.", fr: "Un nouveau préfixe crée de nouveaux baux, mais avec le point de départ par défaut ils commencent à l'heure actuelle : les anciens titres ne sont pas remis." }
    d: { en: "`maxItemsPerInvocation` only limits the size of each batch; it doesn't move the position stored in the leases.", fr: "`maxItemsPerInvocation` limite seulement la taille de chaque lot ; il ne déplace pas la position stockée dans les baux." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
