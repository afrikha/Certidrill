id: ai200-2b-sku-memory
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware's product search on Azure Database for PostgreSQL uses an HNSW index whose size, measured with `pg_relation_size`, is 40 GB. Searches are slow because the index does not stay in memory.

    You need to choose a compute size whose memory exceeds the vector index size by at least 50 percent, as Learn recommends. The solution must use the fewest vCores.

    Which compute size should you choose?
  fr: |
    La recherche de produits de Proseware sur Azure Database for PostgreSQL utilise un index HNSW dont la taille, mesurée avec `pg_relation_size`, est de 40 Go. Les recherches sont lentes parce que l'index ne reste pas en mémoire.

    Vous devez choisir une taille de calcul dont la mémoire dépasse d'au moins 50 % la taille de l'index vectoriel, comme le recommande Learn. La solution doit utiliser le moins de vCores possible.

    Quelle taille de calcul devez-vous choisir ?
body:
  options:
    - { id: a, text: { en: "Standard_E4ds_v5 (4 vCores, 32 GiB)", fr: "Standard_E4ds_v5 (4 vCores, 32 Gio)" } }
    - { id: b, text: { en: "Standard_D8ds_v5 (8 vCores, 32 GiB)", fr: "Standard_D8ds_v5 (8 vCores, 32 Gio)" } }
    - { id: c, text: { en: "Standard_E8ds_v5 (8 vCores, 64 GiB)", fr: "Standard_E8ds_v5 (8 vCores, 64 Gio)" } }
    - { id: d, text: { en: "Standard_D16ds_v5 (16 vCores, 64 GiB)", fr: "Standard_D16ds_v5 (16 vCores, 64 Gio)" } }
shuffle: false
answer: { optionId: c }
explanation:
  correct:
    en: "The index needs at least 40 GB x 1.5 = 60 GB of memory. The Memory Optimized E-series provides more memory per vCore than the General Purpose D-series (4 GiB per vCore), so Standard_E8ds_v5 reaches 64 GiB with 8 vCores, while the General Purpose tier needs 16 vCores for the same memory."
    fr: "L'index a besoin d'au moins 40 Go x 1,5 = 60 Go de mémoire. La série E Memory Optimized fournit plus de mémoire par vCore que la série D General Purpose (4 Gio par vCore) : Standard_E8ds_v5 atteint 64 Gio avec 8 vCores, alors que le niveau General Purpose a besoin de 16 vCores pour la même mémoire."
  options:
    a:
      en: "32 GiB is less than the 40 GB index itself."
      fr: "32 Gio est inférieur aux 40 Go de l'index lui-même."
    b:
      en: "32 GiB is less than the index, and the size uses as many vCores as the correct answer."
      fr: "32 Gio est inférieur à l'index, et cette taille utilise autant de vCores que la bonne réponse."
    d:
      en: "64 GiB meets the memory rule, but with twice as many vCores as Standard_E8ds_v5."
      fr: "64 Gio respecte la règle de mémoire, mais avec deux fois plus de vCores que Standard_E8ds_v5."
references:
  - title: Compute Options
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-compute
  - title: Scale for high-volume workloads
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/5-scale-high-volume-workloads
