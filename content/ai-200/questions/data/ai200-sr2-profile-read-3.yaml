id: ai200-sr2-profile-read-3
objective: "2.1.1"
type: series_yesno
series: ai200-sr2-profile-read
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You authenticate with the account key from an app setting and call read_item.
  fr: Vous vous authentifiez avec la clé de compte d'un paramètre d'application et appelez read_item.
body:
  solution:
    en: |
      You store the primary key of the account in an app setting named `COSMOS_KEY`. The assistant runs the following code.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=os.environ["COSMOS_KEY"])
      container = client.get_database_client("assistant").get_container_client("profiles")
      profile = container.read_item(item=customer_id, partition_key=customer_id)
      ```
    fr: |
      Vous stockez la clé primaire du compte dans un paramètre d'application nommé `COSMOS_KEY`. L'assistant exécute le code suivant.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=os.environ["COSMOS_KEY"])
      container = client.get_database_client("assistant").get_container_client("profiles")
      profile = container.read_item(item=customer_id, partition_key=customer_id)
      ```
answer: { value: false }
explanation:
  correct:
    en: The point read uses the fewest RUs, but the account key is stored in the configuration of the app, which the security policy forbids. The assistant should authenticate with its managed identity through a Microsoft Entra credential instead.
    fr: "La lecture ponctuelle utilise le moins de RU, mais la clé de compte est stockée dans la configuration de l'application, ce que la stratégie de sécurité interdit. L'assistant doit plutôt s'authentifier avec son identité managée au moyen d'informations d'identification Microsoft Entra."
references:
  - title: "Quickstart: Use Azure Cosmos DB for NoSQL with Azure SDK for Python"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/quickstart-python
