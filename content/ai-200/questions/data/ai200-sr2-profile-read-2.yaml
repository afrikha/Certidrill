id: ai200-sr2-profile-read-2
objective: "2.1.1"
type: series_yesno
series: ai200-sr2-profile-read
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You run a parameterized query that filters on the id.
  fr: Vous exécutez une requête paramétrable qui filtre sur l'id.
body:
  solution:
    en: |
      The assistant runs the following code.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=DefaultAzureCredential())
      container = client.get_database_client("assistant").get_container_client("profiles")
      items = container.query_items(
          query="SELECT * FROM c WHERE c.id = @id AND c.customerId = @id",
          parameters=[dict(name="@id", value=customer_id)],
          enable_cross_partition_query=False,
      )
      profile = next(iter(items))
      ```
    fr: |
      L'assistant exécute le code suivant.

      ```python
      client = CosmosClient(url=COSMOS_ENDPOINT, credential=DefaultAzureCredential())
      container = client.get_database_client("assistant").get_container_client("profiles")
      items = container.query_items(
          query="SELECT * FROM c WHERE c.id = @id AND c.customerId = @id",
          parameters=[dict(name="@id", value=customer_id)],
          enable_cross_partition_query=False,
      )
      profile = next(iter(items))
      ```
answer: { value: false }
explanation:
  correct:
    en: The query returns the right item from a single partition, but a query that filters on the id and the partition key is not a point read. It goes through the query engine and the index, so it costs more RUs than read_item for the same item.
    fr: "La requête renvoie le bon élément depuis une seule partition, mais une requête qui filtre sur l'id et la clé de partition n'est pas une lecture ponctuelle. Elle passe par le moteur de requête et l'index : elle coûte donc plus de RU que read_item pour le même élément."
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
