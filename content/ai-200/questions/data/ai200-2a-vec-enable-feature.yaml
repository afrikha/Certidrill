id: ai200-2a-vec-enable-feature
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-kb** in a resource group named **rg-kb**. The account uses dedicated throughput per container.

    A Python script calls `create_container()` with a `vector_embedding_policy` and a `diskANN` entry in `vectorIndexes`, but the service rejects the request because vector search isn't available on the account.

    Which command should you run first?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-kb** dans un groupe de ressources nommé **rg-kb**. Le compte utilise un débit dédié par conteneur.

    Un script Python appelle `create_container()` avec une `vector_embedding_policy` et une entrée `diskANN` dans `vectorIndexes`, mais le service refuse la requête, car la recherche vectorielle n'est pas disponible sur le compte.

    Quelle commande devez-vous exécuter d'abord ?
body:
  options:
    - { id: a, text: 'az cosmosdb update --resource-group rg-kb --name cosmos-kb --enable-analytical-storage true' }
    - { id: b, text: 'az cosmosdb update --resource-group rg-kb --name cosmos-kb --default-consistency-level Strong' }
    - { id: c, text: 'az cosmosdb update --resource-group rg-kb --name cosmos-kb --capabilities EnableNoSQLVectorSearch' }
    - { id: d, text: 'az cosmosdb update --resource-group rg-kb --name cosmos-kb --capabilities EnableServerless' }
answer: { optionId: c }
explanation:
  correct:
    en: "Vector search for the NoSQL API is an account feature enabled with the `EnableNoSQLVectorSearch` capability (or **Features** in the portal). The request is auto-approved but can take about 15 minutes to take effect, after which you can create containers with vector policies."
    fr: "La recherche vectorielle de l'API NoSQL est une fonctionnalité du compte, activée avec la capacité `EnableNoSQLVectorSearch` (ou **Features** dans le portail). La demande est approuvée automatiquement mais peut mettre environ 15 minutes à prendre effet ; vous pouvez ensuite créer des conteneurs avec des stratégies vectorielles."
  options:
    a: { en: "Analytical storage enables Azure Synapse Link scenarios, not vector indexes.", fr: "Le stockage analytique sert aux scénarios Azure Synapse Link, pas aux index vectoriels." }
    b: { en: "The consistency level has nothing to do with vector search availability.", fr: "Le niveau de cohérence n'a aucun lien avec la disponibilité de la recherche vectorielle." }
    d: { en: "Serverless is a throughput mode, not the vector search feature.", fr: "Serverless est un mode de débit, pas la fonctionnalité de recherche vectorielle." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
