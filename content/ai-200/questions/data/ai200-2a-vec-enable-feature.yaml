id: ai200-2a-vec-enable-feature
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-kb** in a resource group named **rg-kb**. The account uses dedicated throughput per container, and no setting of the account has been changed since it was created.

    A developer is writing a Python script that creates a container named **articles**. The application will rank the items of articles with `VectorDistance` on their `embedding` property.

    What is required to use vector search on articles?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-kb** dans un groupe de ressources nommé **rg-kb**. Le compte utilise un débit dédié par conteneur, et aucun paramètre du compte n'a été modifié depuis sa création.

    Un développeur écrit un script Python qui crée un conteneur nommé **articles**. L'application classera les éléments d'articles avec `VectorDistance` sur leur propriété `embedding`.

    Qu'est-ce qui est nécessaire pour utiliser la recherche vectorielle sur articles ?
body:
  options:
    - { id: a, text: { en: "Enable analytical storage on cosmos-kb with `az cosmosdb update --enable-analytical-storage true`.", fr: "Activer le stockage analytique sur cosmos-kb avec `az cosmosdb update --enable-analytical-storage true`." } }
    - { id: b, text: { en: "Set the default consistency level of cosmos-kb to Strong with `az cosmosdb update`.", fr: "Définir le niveau de cohérence par défaut de cosmos-kb sur Strong avec `az cosmosdb update`." } }
    - { id: c, text: { en: "Add the `EnableNoSQLVectorSearch` capability to cosmos-kb with `az cosmosdb update --capabilities`.", fr: "Ajouter la capacité `EnableNoSQLVectorSearch` à cosmos-kb avec `az cosmosdb update --capabilities`." } }
    - { id: d, text: { en: "Pass a vector embedding policy that declares `/embedding` when the script creates articles.", fr: "Passer une stratégie d'incorporation vectorielle qui déclare `/embedding` quand le script crée articles." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Cosmos DB enables vector indexing and search by default, so nothing has to be enabled on the account. Vector search requires a container vector policy that gives the path, data type, dimensions and distance function of the vectors; a vector index on the same path is added to the indexing policy for lower latency and RU charge."
    fr: "Azure Cosmos DB active l'indexation et la recherche vectorielles par défaut : rien ne doit être activé sur le compte. La recherche vectorielle exige une stratégie vectorielle de conteneur qui indique le chemin, le type de données, les dimensions et la fonction de distance des vecteurs ; un index vectoriel sur le même chemin est ajouté à la stratégie d'indexation pour réduire la latence et la consommation de RU."
  options:
    a: { en: "Analytical storage enables Azure Synapse Link scenarios, not vector indexes.", fr: "Le stockage analytique sert aux scénarios Azure Synapse Link, pas aux index vectoriels." }
    b: { en: "The consistency level has nothing to do with vector search.", fr: "Le niveau de cohérence n'a aucun lien avec la recherche vectorielle." }
    c: { en: "Vector search no longer needs a feature registration or an account capability: it is enabled by default.", fr: "La recherche vectorielle n'exige plus d'inscription de fonctionnalité ni de capacité de compte : elle est activée par défaut." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Index and Query Vector Data in Python - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-python-vector-index-query
