id: ai200-2b-identity-role
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware hosts a retrieval API in an Azure container app named **ca-ragsearch** that has a system-assigned managed identity. The API connects to an Azure Database for PostgreSQL flexible server named **pg-litware**, where Microsoft Entra authentication is enabled and you are the Microsoft Entra admin.

    You need to create the database role that the API will sign in with. The role must not have administrative privileges.

    Which statement should you run on pg-litware?
  fr: |
    Litware héberge une API de récupération dans une application conteneur Azure nommée **ca-ragsearch** qui dispose d'une identité managée affectée par le système. L'API se connecte à un serveur flexible Azure Database for PostgreSQL nommé **pg-litware**, sur lequel l'authentification Microsoft Entra est activée et dont vous êtes l'administrateur Microsoft Entra.

    Vous devez créer le rôle de base de données avec lequel l'API se connectera. Le rôle ne doit pas disposer de privilèges d'administration.

    Quelle instruction devez-vous exécuter sur pg-litware ?
body:
  options:
    - { id: a, text: "SELECT * FROM pgaadauth_create_principal('ca-ragsearch', true, false);" }
    - { id: b, text: "CREATE ROLE \"ca-ragsearch\" WITH LOGIN PASSWORD 'Strong#Pass2026';" }
    - { id: c, text: "SELECT * FROM pgaadauth_create_principal('ca-ragsearch', false, false);" }
    - { id: d, text: "SELECT * FROM pgaadauth_list_principals(false);" }
answer: { optionId: c }
explanation:
  correct:
    en: "`pgaadauth_create_principal(roleName, isAdmin, isMfa)` creates a role linked to a Microsoft Entra principal; for a managed identity the role name is the display name of its service principal, which is the app name for a system-assigned identity. `isAdmin = false` creates a regular user, to which you then grant only the table privileges the API needs."
    fr: "`pgaadauth_create_principal(roleName, isAdmin, isMfa)` crée un rôle lié à un principal Microsoft Entra ; pour une identité managée, le nom du rôle est le nom d'affichage de son principal de service, c'est-à-dire le nom de l'application pour une identité affectée par le système. `isAdmin = false` crée un utilisateur standard, auquel vous accordez ensuite uniquement les privilèges sur les tables dont l'API a besoin."
  options:
    a:
      en: "With `isAdmin = true`, the role becomes a member of `azure_pg_admin` with CREATEROLE and CREATEDB, which breaks the no-administration requirement."
      fr: "Avec `isAdmin = true`, le rôle devient membre de `azure_pg_admin` avec CREATEROLE et CREATEDB, ce qui enfreint l'exigence d'absence de privilèges d'administration."
    b:
      en: "This creates a password-based PostgreSQL role that is not linked to the managed identity, and it puts a secret in the configuration."
      fr: "Cette instruction crée un rôle PostgreSQL à mot de passe qui n'est pas lié à l'identité managée, et elle place un secret dans la configuration."
    d:
      en: "This function only lists the existing Microsoft Entra roles; it creates nothing."
      fr: "Cette fonction liste seulement les rôles Microsoft Entra existants ; elle ne crée rien."
references:
  - title: Manage Microsoft Entra Roles in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-manage-entra-users
