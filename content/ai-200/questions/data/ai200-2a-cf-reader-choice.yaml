id: ai200-2a-cf-reader-choice
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has four teams that must react to changes in Azure Cosmos DB for NoSQL containers used by AI applications.

    Which option should each team use to read the change feed? To answer, drag the appropriate options to the correct teams. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum compte quatre équipes qui doivent réagir aux modifications de conteneurs Azure Cosmos DB for NoSQL utilisés par des applications IA.

    Quelle option chaque équipe doit-elle utiliser pour lire le flux de modification ? Pour répondre, faites glisser les options appropriées vers les équipes correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: functions, text: { en: "Azure Functions trigger for Azure Cosmos DB", fr: "Déclencheur Azure Functions pour Azure Cosmos DB" } }
    - { id: pull, text: { en: "Pull model with query_items_change_feed() and partition_key", fr: "Modèle d'extraction avec query_items_change_feed() et partition_key" } }
    - { id: processor, text: { en: "Change feed processor", fr: "Processeur de flux de modification" } }
    - { id: avad, text: { en: "All versions and deletes mode", fr: "Mode toutes versions et suppressions" } }
    - { id: timer, text: { en: "Timer-triggered query on the _ts property", fr: "Requête sur la propriété _ts déclenchée par minuteur" } }
  targets:
    - { id: t1, text: { en: "Python team: serverless code that scales with the load, with no checkpoint code to write", fr: "Équipe Python : code serverless qui évolue avec la charge, sans code de point de contrôle à écrire" } }
    - { id: t2, text: { en: "Python team: a worker that reads the changes of a single tenant's partition at its own pace", fr: "Équipe Python : un worker qui lit les modifications de la partition d'un seul locataire à son propre rythme" } }
    - { id: t3, text: { en: "Java team: a service on several instances that share the load, with automatic checkpoints", fr: "Équipe Java : un service sur plusieurs instances qui se partagent la charge, avec des points de contrôle automatiques" } }
    - { id: t4, text: { en: "Audit team: capture every intermediate version and every delete, on an account with continuous backup", fr: "Équipe d'audit : capturer chaque version intermédiaire et chaque suppression, sur un compte doté de la sauvegarde continue" } }
answer:
  mapping: { t1: functions, t2: pull, t3: processor, t4: avad }
explanation:
  correct:
    en: "The Functions trigger reads the change feed and keeps its state in a lease container for you. Only the pull model can read a single partition key, at the pace your code chooses. The change feed processor, available in the .NET and Java SDKs, spreads leases across instances and checkpoints automatically. All versions and deletes mode reports intermediate changes and deletes, and requires continuous backup. A timer query on `_ts` misses deletes and intermediate versions and needs your own bookkeeping."
    fr: "Le déclencheur Functions lit le flux de modification et conserve son état dans un conteneur de baux à votre place. Seul le modèle d'extraction peut lire une seule clé de partition, au rythme choisi par votre code. Le processeur de flux de modification, disponible dans les SDK .NET et Java, répartit les baux entre les instances et enregistre automatiquement les points de contrôle. Le mode toutes versions et suppressions signale les modifications intermédiaires et les suppressions, et exige la sauvegarde continue. Une requête sur `_ts` par minuteur manque les suppressions et les versions intermédiaires, et exige votre propre suivi."
references:
  - title: Work with the Change Feed - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
