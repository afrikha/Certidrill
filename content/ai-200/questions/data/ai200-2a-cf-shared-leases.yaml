id: ai200-2a-cf-shared-leases
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a function app with two functions that use the Azure Cosmos DB trigger on the same **reviews** container: `embed_review` generates embeddings, and `audit_review` writes an audit record. Both functions use the same connection and the lease container **leases**, with the default settings.

    Only one of the two functions runs when a review is added. You need both functions to process every change. The solution must not add a container.

    What should you do?
  fr: |
    Tailspin Toys dispose d'une application de fonction avec deux fonctions qui utilisent le déclencheur Azure Cosmos DB sur le même conteneur **reviews** : `embed_review` génère des incorporations et `audit_review` écrit un enregistrement d'audit. Les deux fonctions utilisent la même connexion et le conteneur de baux **leases**, avec les paramètres par défaut.

    Une seule des deux fonctions s'exécute quand un avis est ajouté. Vous devez faire en sorte que les deux fonctions traitent chaque modification. La solution ne doit pas ajouter de conteneur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set a different leaseContainerPrefix on each function.", fr: "Définir un leaseContainerPrefix différent pour chaque fonction." } }
    - { id: b, text: { en: "Set a different feedPollDelay on each function.", fr: "Définir un feedPollDelay différent pour chaque fonction." } }
    - { id: c, text: { en: "Set maxItemsPerInvocation to 1 on both functions.", fr: "Définir maxItemsPerInvocation sur 1 pour les deux fonctions." } }
    - { id: d, text: { en: "Set startFromBeginning to true on audit_review.", fr: "Définir startFromBeginning sur true pour audit_review." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Two triggers on the same container that share a lease container without a prefix compete for the same leases, so only one of them is triggered. A distinct `leaseContainerPrefix` per function gives each one its own lease documents in the shared container; the alternative, a dedicated lease container per function, would add a container."
    fr: "Deux déclencheurs sur le même conteneur qui partagent un conteneur de baux sans préfixe se disputent les mêmes baux : un seul est déclenché. Un `leaseContainerPrefix` distinct par fonction donne à chacune ses propres documents de bail dans le conteneur partagé ; l'autre solution, un conteneur de baux dédié par fonction, ajouterait un conteneur."
  options:
    b: { en: "The poll delay changes how often partitions are polled, not which function owns the leases.", fr: "Le délai d'interrogation change la fréquence d'interrogation des partitions, pas la fonction propriétaire des baux." }
    c: { en: "The batch size doesn't separate the lease state of the two functions.", fr: "La taille des lots ne sépare pas l'état des baux des deux fonctions." }
    d: { en: "startFromBeginning has no effect once leases exist, and the functions would still share them.", fr: "startFromBeginning est sans effet une fois les baux créés, et les fonctions les partageraient toujours." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
