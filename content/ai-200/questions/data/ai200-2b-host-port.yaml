id: ai200-2b-host-port
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an Azure Database for PostgreSQL flexible server named **pg-wingtip** with public access. Built-in PgBouncer is not enabled on the server.

    A Python service must connect directly to the database server by using psycopg.

    Which host and port should the connection string contain?
  fr: |
    Wingtip dispose d'un serveur flexible Azure Database for PostgreSQL nommé **pg-wingtip** avec un accès public. Le PgBouncer intégré n'est pas activé sur le serveur.

    Un service Python doit se connecter directement au serveur de base de données à l'aide de psycopg.

    Quels hôte et port la chaîne de connexion doit-elle contenir ?
body:
  options:
    - { id: a, text: "host=pg-wingtip.database.windows.net port=1433" }
    - { id: b, text: "host=pg-wingtip.postgres.database.azure.com port=6432" }
    - { id: c, text: "host=pg-wingtip.documents.azure.com port=443" }
    - { id: d, text: "host=pg-wingtip.postgres.database.azure.com port=5432" }
answer: { optionId: d }
explanation:
  correct:
    en: "A flexible server is reached at `<server>.postgres.database.azure.com`, and PostgreSQL listens on port 5432."
    fr: "Un serveur flexible est joint à l'adresse `<serveur>.postgres.database.azure.com`, et PostgreSQL écoute sur le port 5432."
  options:
    a:
      en: "This host suffix and port belong to Azure SQL Database."
      fr: "Ce suffixe d'hôte et ce port appartiennent à Azure SQL Database."
    b:
      en: "Port 6432 is the port of built-in PgBouncer, which is not enabled on this server."
      fr: "Le port 6432 est celui du PgBouncer intégré, qui n'est pas activé sur ce serveur."
    c:
      en: "This host suffix belongs to Azure Cosmos DB accounts."
      fr: "Ce suffixe d'hôte appartient aux comptes Azure Cosmos DB."
references:
  - title: "Quickstart: Use Python to Connect and Query Data in Azure Database for PostgreSQL Flexible Server"
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/connect-python
