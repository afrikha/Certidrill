id: ai200-sr2-pg-connections-2
objective: "2.2.6"
type: series_yesno
series: ai200-sr2-pg-connections
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You enable the built-in PgBouncer and keep the connection string.
  fr: Vous activez le PgBouncer intégré et conservez la chaîne de connexion.
body:
  solution:
    en: You set the **pgbouncer.enabled** server parameter of pg-fabrikam to **true**. The app keeps its connection string, which uses `pg-fabrikam.postgres.database.azure.com` and port 5432.
    fr: Vous définissez le paramètre de serveur **pgbouncer.enabled** de pg-fabrikam sur **true**. L'application conserve sa chaîne de connexion, qui utilise `pg-fabrikam.postgres.database.azure.com` et le port 5432.
answer: { value: false }
explanation:
  correct:
    en: The built-in PgBouncer listens on port 6432 of the same host name. Connections on port 5432 go directly to PostgreSQL and bypass the pool, so nothing changes for the API until its connection string uses port 6432.
    fr: "Le PgBouncer intégré écoute sur le port 6432 du même nom d'hôte. Les connexions sur le port 5432 arrivent directement à PostgreSQL et contournent le pool : rien ne change pour l'API tant que sa chaîne de connexion n'utilise pas le port 6432."
references:
  - title: PgBouncer in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
