id: ai200-2a-sdk-client-reuse
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a Python Flask API in Azure Container Apps. The API answers questions about product manuals and reads the manual chunks from Azure Cosmos DB for NoSQL. Each request handler runs the following code before it queries the container:

    ```python
    client = CosmosClient(os.environ["COSMOS_ENDPOINT"], credential=DefaultAzureCredential())
    container = client.get_database_client("manuals").get_container_client("chunks")
    ```

    Under load, the API shows high latency and high CPU usage, although the container is not throttled. You need to reduce the latency with the least code change.

    What should you do?
  fr: |
    Fabrikam exécute une API Python Flask dans Azure Container Apps. L'API répond à des questions sur les manuels des produits et lit les segments de manuels dans Azure Cosmos DB for NoSQL. Chaque gestionnaire de requêtes exécute le code suivant avant d'interroger le conteneur :

    ```python
    client = CosmosClient(os.environ["COSMOS_ENDPOINT"], credential=DefaultAzureCredential())
    container = client.get_database_client("manuals").get_container_client("chunks")
    ```

    Sous charge, l'API présente une latence et une utilisation du processeur élevées, bien que le conteneur ne soit pas limité. Vous devez réduire la latence avec le moins de modifications de code possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an azure.cosmos.aio CosmosClient in each request handler instead of the synchronous client.", fr: "Créer un CosmosClient azure.cosmos.aio dans chaque gestionnaire de requêtes au lieu du client synchrone." } }
    - { id: b, text: { en: "Pass preferred_locations to the CosmosClient constructor in each request handler.", fr: "Passer preferred_locations au constructeur de CosmosClient dans chaque gestionnaire de requêtes." } }
    - { id: c, text: { en: "Increase the provisioned throughput of the chunks container.", fr: "Augmenter le débit provisionné du conteneur chunks." } }
    - { id: d, text: { en: "Create the CosmosClient once when the application starts, and reuse it in every request handler.", fr: "Créer le CosmosClient une seule fois au démarrage de l'application et le réutiliser dans chaque gestionnaire de requêtes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft recommends one CosmosClient for the lifetime of the application. The client is thread-safe and caches connections and addresses, so creating it on every request repeats an expensive initialization (and token acquisition) for each call."
    fr: "Microsoft recommande un seul CosmosClient pendant toute la durée de vie de l'application. Le client est thread-safe et met en cache les connexions et les adresses ; le créer à chaque requête répète une initialisation coûteuse (et l'obtention d'un jeton) pour chaque appel."
  options:
    a:
      en: "The async client is for async frameworks, and creating one per request keeps the same initialization cost; Flask handlers here are synchronous."
      fr: "Le client asynchrone est destiné aux frameworks asynchrones, et en créer un par requête conserve le même coût d'initialisation ; les gestionnaires Flask sont ici synchrones."
    b:
      en: "Preferred locations route requests to the closest region, but a new client per request still pays the initialization cost each time."
      fr: "Les emplacements préférés dirigent les requêtes vers la région la plus proche, mais un nouveau client par requête paie toujours le coût d'initialisation."
    c:
      en: "The container isn't throttled, so more RU/s don't address the client-side overhead."
      fr: "Le conteneur n'est pas limité : davantage de RU/s ne traitent pas la surcharge côté client."
references:
  - title: Best practices for Python SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/best-practice-python
  - title: Performance Tips for Python SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-python-sdk
