id: ai200-2a-idx-equality-range
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a gift-suggestion API that runs the following query thousands of times per minute against an Azure Cosmos DB for NoSQL container that uses the default indexing policy:

    ```sql
    SELECT c.id, c.name, c.price FROM c
    WHERE c.category = @category AND c.price > @minPrice
    ```

    You need to add an index that lowers the RU charge and latency of this query.

    Which composite index should you add?
  fr: |
    Proseware dispose d'une API de suggestions de cadeaux qui exécute la requête suivante des milliers de fois par minute sur un conteneur Azure Cosmos DB for NoSQL qui utilise la stratégie d'indexation par défaut :

    ```sql
    SELECT c.id, c.name, c.price FROM c
    WHERE c.category = @category AND c.price > @minPrice
    ```

    Vous devez ajouter un index qui réduit la consommation de RU et la latence de cette requête.

    Quel index composite devez-vous ajouter ?
body:
  options:
    - { id: a, text: '[ { "path": "/price", "order": "ascending" }, { "path": "/category", "order": "ascending" } ]' }
    - { id: b, text: '[ { "path": "/category", "order": "ascending" }, { "path": "/price", "order": "ascending" } ]' }
    - { id: c, text: '[ { "path": "/category", "order": "ascending" }, { "path": "/*", "order": "ascending" } ]' }
    - { id: d, text: '[ { "path": "/price/?", "order": "ascending" }, { "path": "/name/?", "order": "ascending" } ]' }
answer: { optionId: b }
explanation:
  correct:
    en: "For a query that combines filters, the equality properties come first in the composite index and the single range property (`price >`) comes last. The sort order of the paths doesn't affect filter results."
    fr: "Pour une requête qui combine des filtres, les propriétés d'égalité viennent en premier dans l'index composite et l'unique propriété de plage (`price >`) en dernier. L'ordre de tri des chemins n'a pas d'incidence sur les résultats des filtres."
  options:
    a: { en: "The range filter must be the last path of the composite index, after the equality filter.", fr: "Le filtre de plage doit être le dernier chemin de l'index composite, après le filtre d'égalité." }
    c: { en: "Composite index paths can't contain the `/*` wildcard.", fr: "Les chemins d'un index composite ne peuvent pas contenir le caractère générique `/*`." }
    d: { en: "`name` isn't filtered, and the equality property `category` is missing from the index.", fr: "`name` n'est pas filtré, et la propriété d'égalité `category` est absente de l'index." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
