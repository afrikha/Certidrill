id: ai200-2b-passwordless-order
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an App Service app named **app-kbsearch** that connects to an Azure Database for PostgreSQL flexible server named **pg-adatum** by using a PostgreSQL password. The server uses PostgreSQL authentication only. A system-assigned managed identity is already enabled on app-kbsearch.

    You need to move app-kbsearch to passwordless authentication. No request must fail because the database is not ready for the new code.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'une application App Service nommée **app-kbsearch** qui se connecte à un serveur flexible Azure Database for PostgreSQL nommé **pg-adatum** à l'aide d'un mot de passe PostgreSQL. Le serveur utilise uniquement l'authentification PostgreSQL. Une identité managée affectée par le système est déjà activée sur app-kbsearch.

    Vous devez faire passer app-kbsearch à l'authentification sans mot de passe. Aucune requête ne doit échouer parce que la base de données n'est pas prête pour le nouveau code.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: entra, text: { en: "Enable Microsoft Entra authentication on pg-adatum and add a Microsoft Entra admin.", fr: "Activer l'authentification Microsoft Entra sur pg-adatum et ajouter un administrateur Microsoft Entra." } }
    - { id: role, text: { en: "Sign in as the Microsoft Entra admin and run `pgaadauth_create_principal` for app-kbsearch.", fr: "Se connecter en tant qu'administrateur Microsoft Entra et exécuter `pgaadauth_create_principal` pour app-kbsearch." } }
    - { id: grant, text: { en: "Grant the new role the privileges it needs on the application tables.", fr: "Accorder au nouveau rôle les privilèges nécessaires sur les tables de l'application." } }
    - { id: code, text: { en: "Deploy code that sends a `DefaultAzureCredential` token as the password.", fr: "Déployer un code qui envoie un jeton `DefaultAzureCredential` comme mot de passe." } }
    - { id: rbac, text: { en: "Assign the Contributor role on pg-adatum to the managed identity.", fr: "Attribuer le rôle Contributor sur pg-adatum à l'identité managée." } }
    - { id: setting, text: { en: "Store the server administrator password in an app setting of app-kbsearch.", fr: "Stocker le mot de passe de l'administrateur du serveur dans un paramètre d'application de app-kbsearch." } }
answer:
  sequence: [ entra, role, grant, code ]
explanation:
  correct:
    en: "Only a Microsoft Entra admin can create roles linked to Microsoft Entra principals, so Entra authentication and an admin come first. The admin then creates the role of the managed identity with `pgaadauth_create_principal`, and grants it table privileges. The new code is deployed last, when the role can already sign in and read the tables."
    fr: "Seul un administrateur Microsoft Entra peut créer des rôles liés à des principaux Microsoft Entra : l'authentification Entra et un administrateur viennent donc en premier. L'administrateur crée ensuite le rôle de l'identité managée avec `pgaadauth_create_principal` et lui accorde des privilèges sur les tables. Le nouveau code est déployé en dernier, quand le rôle peut déjà se connecter et lire les tables."
  options:
    rbac:
      en: "Contributor is an Azure management-plane role; it does not let the identity sign in to the database."
      fr: "Contributor est un rôle du plan de gestion Azure ; il ne permet pas à l'identité de se connecter à la base de données."
    setting:
      en: "Storing a password is the opposite of passwordless authentication."
      fr: "Stocker un mot de passe est le contraire de l'authentification sans mot de passe."
references:
  - title: Use Microsoft Entra ID Authentication in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-entra-configure
  - title: Manage Microsoft Entra Roles in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-manage-entra-users
