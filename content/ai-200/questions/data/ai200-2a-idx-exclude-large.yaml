id: ai200-2a-idx-exclude-large
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores document chunks for a RAG application in an Azure Cosmos DB for NoSQL container that uses the default indexing policy. Each item has a long `text` property, an `embedding` array of 1,536 numbers and a few metadata properties, such as `tenantId` and `docType`. Queries filter only on metadata properties.

    You need to reduce the RU charge of writes. Metadata properties that developers add later must be filterable by using the index without changing the indexing policy.

    Which indexing policy should you use?
  fr: |
    Contoso stocke les segments de documents d'une application RAG dans un conteneur Azure Cosmos DB for NoSQL qui utilise la stratégie d'indexation par défaut. Chaque élément contient une longue propriété `text`, un tableau `embedding` de 1 536 nombres et quelques propriétés de métadonnées, comme `tenantId` et `docType`. Les requêtes filtrent uniquement sur des propriétés de métadonnées.

    Vous devez réduire la consommation de RU des écritures. Les propriétés de métadonnées que les développeurs ajouteront plus tard doivent pouvoir être filtrées à l'aide de l'index sans modifier la stratégie d'indexation.

    Quelle stratégie d'indexation devez-vous utiliser ?
body:
  options:
    - { id: a, text: 'includedPaths: ["/tenantId/?", "/docType/?"], excludedPaths: ["/*"]' }
    - { id: b, text: 'indexingMode: "none", with no included or excluded paths' }
    - { id: c, text: 'includedPaths: ["/*"], excludedPaths: [], plus a composite index on /tenantId and /docType' }
    - { id: d, text: 'includedPaths: ["/*"], excludedPaths: ["/text/?", "/embedding/*"]' }
answer: { optionId: d }
explanation:
  correct:
    en: "Including `/*` and excluding specific paths is the recommended approach: new properties are indexed automatically, and excluding the large `text` value and the `embedding` array removes most of the index entries written with each item, which lowers write RUs."
    fr: "Inclure `/*` et exclure des chemins précis est l'approche recommandée : les nouvelles propriétés sont indexées automatiquement, et exclure la grande valeur `text` et le tableau `embedding` supprime la plupart des entrées d'index écrites avec chaque élément, ce qui réduit les RU des écritures."
  options:
    a: { en: "Excluding `/*` indexes only the listed properties, so a property added later isn't indexed until the policy changes.", fr: "Exclure `/*` n'indexe que les propriétés listées : une propriété ajoutée plus tard n'est pas indexée tant que la stratégie n'est pas modifiée." }
    b: { en: "Mode `none` disables indexing completely, so metadata filters can't use any index.", fr: "Le mode `none` désactive complètement l'indexation : les filtres sur les métadonnées ne peuvent utiliser aucun index." }
    c: { en: "This keeps indexing `text` and `embedding` and adds a composite index, which increases the cost of writes.", fr: "Cela continue d'indexer `text` et `embedding` et ajoute un index composite, ce qui augmente le coût des écritures." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Request Units as a throughput and performance currency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
