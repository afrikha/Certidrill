id: ai200-2a-vec-high-dimensions
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is creating an Azure Cosmos DB for NoSQL container for a legal research assistant. The embedding model returns vectors with **3,072** dimensions. Every search is filtered by the partition key, which limits it to about 20,000 vectors.

    The search must return results as close as possible to an exact search, and its RU charge must be lower than a search that uses no vector index.

    Which vector index type should you configure?
  fr: |
    Adatum crée un conteneur Azure Cosmos DB for NoSQL pour un assistant de recherche juridique. Le modèle d'incorporation renvoie des vecteurs de **3 072** dimensions. Chaque recherche est filtrée par la clé de partition, ce qui la limite à environ 20 000 vecteurs.

    La recherche doit renvoyer des résultats aussi proches que possible d'une recherche exacte, et sa consommation de RU doit être inférieure à celle d'une recherche sans index vectoriel.

    Quel type d'index vectoriel devez-vous configurer ?
body:
  options:
    - { id: a, text: flat }
    - { id: b, text: quantizedFlat }
    - { id: c, text: diskANN }
    - { id: d, text: { en: "No vector index, with VectorDistance called with true as its third argument", fr: "Aucun index vectoriel, avec VectorDistance appelé avec true comme troisième argument" } }
answer: { optionId: b }
explanation:
  correct:
    en: "`flat` would give exact results but supports at most 505 dimensions. `quantizedFlat` supports up to 4,096 dimensions and is still a brute-force search over quantized vectors, so its accuracy is close to 100%; Learn recommends it when the search is scoped to 50,000 vectors or fewer."
    fr: "`flat` donnerait des résultats exacts mais prend en charge au plus 505 dimensions. `quantizedFlat` prend en charge jusqu'à 4 096 dimensions et reste une recherche par force brute sur des vecteurs quantifiés : sa précision est proche de 100 %. Learn le recommande quand la recherche porte sur 50 000 vecteurs ou moins."
  options:
    a: { en: "The flat index is limited to 505 dimensions, so it can't index 3,072-dimension vectors.", fr: "L'index flat est limité à 505 dimensions : il ne peut pas indexer des vecteurs de 3 072 dimensions." }
    c: { en: "diskANN is an approximate index that favors latency over exact recall; it's the most performant choice beyond about 50,000 vectors.", fr: "diskANN est un index approximatif qui privilégie la latence plutôt qu'un rappel exact ; c'est le choix le plus performant au-delà d'environ 50 000 vecteurs." }
    d: { en: "A brute-force search without a vector index is exact but costs more RUs, which the requirement forbids.", fr: "Une recherche par force brute sans index vectoriel est exacte mais coûte plus de RU, ce que l'exigence interdit." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
