id: ai200-2b-index-choice
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs several vector search workloads on Azure Database for PostgreSQL flexible servers.

    Which indexing approach should you use for each workload? To answer, drag the appropriate approaches to the correct workloads. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute plusieurs charges de travail de recherche vectorielle sur des serveurs flexibles Azure Database for PostgreSQL.

    Quelle approche d'indexation devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les approches appropriées vers les charges de travail correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ivfflat, text: IVFFlat }
    - { id: hnsw, text: HNSW }
    - { id: diskann, text: DiskANN }
    - { id: none, text: { en: "No vector index (exact search)", fr: "Aucun index vectoriel (recherche exacte)" } }
    - { id: gin, text: GIN }
    - { id: btree, text: B-tree }
  targets:
    - id: lowmem
      text: { en: "Limited memory, fast builds, 90-95% recall acceptable, frequent bulk reloads", fr: "Mémoire limitée, constructions rapides, rappel de 90 à 95 % acceptable, rechargements en masse fréquents" }
    - id: highrecall
      text: { en: "Mostly reads, ample memory, 99% recall or more required", fr: "Principalement des lectures, mémoire abondante, rappel de 99 % ou plus exigé" }
    - id: huge
      text: { en: "Several hundred million vectors, high recall and fast builds", fr: "Plusieurs centaines de millions de vecteurs, rappel élevé et constructions rapides" }
    - id: tiny
      text: { en: "6,000 rows, results must be exact", fr: "6 000 lignes, les résultats doivent être exacts" }
answer:
  mapping: { lowmem: ivfflat, highrecall: hnsw, huge: diskann, tiny: none }
explanation:
  correct:
    en: "Learn suggests IVFFlat when memory and build time are limited and 90-95% recall is acceptable, HNSW when memory is ample and 99% or more recall is needed on a mostly read workload, and DiskANN, an Azure-specific index, for very large datasets with high recall and fast builds. Under about 10,000 rows, or when results must be exact, a sequential scan without an index is enough. GIN and B-tree indexes do not serve vector distance ordering."
    fr: "Learn suggère IVFFlat quand la mémoire et le temps de construction sont limités et qu'un rappel de 90 à 95 % est acceptable, HNSW quand la mémoire est abondante et qu'un rappel de 99 % ou plus est nécessaire sur une charge principalement en lecture, et DiskANN, un index propre à Azure, pour les très grands jeux de données avec un rappel élevé et des constructions rapides. En dessous d'environ 10 000 lignes, ou quand les résultats doivent être exacts, une analyse séquentielle sans index suffit. Les index GIN et B-tree ne servent pas le tri par distance vectorielle."
references:
  - title: Choose and configure vector indexes
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes
