id: ai200-2b-dimensionless-column
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores product description embeddings in a table created with the column definition `embedding vector`. Every stored embedding comes from a model that returns 1,536 dimensions.

    When you run `CREATE INDEX ON products USING hnsw (embedding vector_cosine_ops);`, the statement fails with the error `column does not have dimensions`.

    What should you do before you create the index?
  fr: |
    Fabrikam stocke les incorporations des descriptions de produits dans une table créée avec la définition de colonne `embedding vector`. Chaque incorporation stockée provient d'un modèle qui renvoie 1 536 dimensions.

    Quand vous exécutez `CREATE INDEX ON products USING hnsw (embedding vector_cosine_ops);`, l'instruction échoue avec l'erreur `column does not have dimensions`.

    Que devez-vous faire avant de créer l'index ?
body:
  options:
    - { id: a, text: "ALTER TABLE products ALTER COLUMN embedding TYPE vector(1536);" }
    - { id: b, text: "ALTER TABLE products ALTER COLUMN embedding TYPE real[];" }
    - { id: c, text: "SET hnsw.ef_search = 1536;" }
    - { id: d, text: "CREATE INDEX ON products USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100);" }
answer: { optionId: a }
explanation:
  correct:
    en: "Vector indexes need a column with a declared dimension; a plain `vector` column can be stored but not indexed. Declaring `vector(1536)`, which matches the model output, lets the HNSW index be created and makes inserts with another dimension fail."
    fr: "Les index vectoriels exigent une colonne dont la dimension est déclarée ; une colonne `vector` simple peut être stockée mais pas indexée. Déclarer `vector(1536)`, qui correspond à la sortie du modèle, permet de créer l'index HNSW et fait échouer les insertions d'une autre dimension."
  options:
    b:
      en: "A PostgreSQL array is not a pgvector type, so no HNSW index or distance operator applies to it."
      fr: "Un tableau PostgreSQL n'est pas un type pgvector : aucun index HNSW ni opérateur de distance ne s'y applique."
    c:
      en: "ef_search is a query-time setting; it does not give the column a dimension."
      fr: "ef_search est un paramètre de requête ; il ne donne pas de dimension à la colonne."
    d:
      en: "IVFFlat has the same requirement and fails with the same error on a column without dimensions."
      fr: "IVFFlat a la même exigence et échoue avec la même erreur sur une colonne sans dimension."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
