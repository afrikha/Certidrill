id: ai200-2c-redis-batch-read
objective: "2.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Trey Research's dashboard displays 40 cached report summaries at once. The summaries are stored as strings in a non-clustered Azure Managed Redis instance, and the `keys` variable contains the list of their 40 key names.

    You need to read all the summaries in a single network round trip.

    Which two code segments can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le tableau de bord de Trey Research affiche 40 résumés de rapports mis en cache en même temps. Les résumés sont stockés sous forme de chaînes dans une instance Azure Managed Redis sans cluster, et la variable `keys` contient la liste de leurs 40 noms de clés.

    Vous devez lire tous les résumés en un seul aller-retour réseau.

    Quels sont les deux segments de code que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "values = [r.get(k) for k in keys]" }
    - { id: b, text: "values = r.mget(keys)" }
    - { id: c, text: "values = r.hgetall(keys)" }
    - { id: d, text: "pipe = r.pipeline(); [pipe.get(k) for k in keys]; values = pipe.execute()" }
    - { id: e, text: "values = list(r.scan_iter(match=\"report:*\"))" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      MGET returns the values of several keys in one command. A pipeline queues the 40 GET commands on the client and sends them together, and `execute()` returns the list of results; Microsoft recommends pipelining for efficient use of the network.
    fr: |
      MGET renvoie les valeurs de plusieurs clés en une seule commande. Un pipeline met en file d'attente les 40 commandes GET côté client et les envoie ensemble, et `execute()` renvoie la liste des résultats ; Microsoft recommande le pipelining pour utiliser efficacement le réseau.
  options:
    a:
      en: |
        Each GET is a separate command, so this makes 40 round trips.
      fr: |
        Chaque GET est une commande distincte : ce code effectue 40 allers-retours.
    c:
      en: |
        HGETALL reads the fields of one hash key, not several string keys.
      fr: |
        HGETALL lit les champs d'une seule clé de hachage, pas plusieurs clés de type chaîne.
    e:
      en: |
        SCAN returns key names, not values, and needs several round trips.
      fr: |
        SCAN renvoie des noms de clés, pas des valeurs, et nécessite plusieurs allers-retours.
references:
  - title: Best practices for development for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-development
