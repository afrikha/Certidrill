id: ai200-2b-create-extension
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso added the pgvector extension to the `azure.extensions` server parameter of an Azure Database for PostgreSQL flexible server. A developer connects to the **kb** database and runs `CREATE EXTENSION pgvector;`, which fails.

    You need to enable vector types and distance operators in the kb database.

    Which statement should you run?
  fr: |
    Contoso a ajouté l'extension pgvector au paramètre de serveur `azure.extensions` d'un serveur flexible Azure Database for PostgreSQL. Un développeur se connecte à la base de données **kb** et exécute `CREATE EXTENSION pgvector;`, qui échoue.

    Vous devez activer les types vectoriels et les opérateurs de distance dans la base de données kb.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE EXTENSION pgvector CASCADE;" }
    - { id: b, text: "CREATE EXTENSION pg_vector;" }
    - { id: c, text: "CREATE EXTENSION vector;" }
    - { id: d, text: "ALTER SYSTEM SET shared_preload_libraries = 'pgvector';" }
answer: { optionId: c }
explanation:
  correct:
    en: "The community calls the extension pgvector, but the name of the extension and its binary is `vector`. After the extension is allowed in `azure.extensions`, you run `CREATE EXTENSION vector;` in each database that needs it."
    fr: "La communauté appelle l'extension pgvector, mais le nom de l'extension et de son binaire est `vector`. Une fois l'extension autorisée dans `azure.extensions`, vous exécutez `CREATE EXTENSION vector;` dans chaque base de données qui en a besoin."
  options:
    a:
      en: "CASCADE also creates the extensions that an extension depends on; it does not fix the wrong extension name."
      fr: "CASCADE crée aussi les extensions dont dépend une extension ; il ne corrige pas le nom d'extension erroné."
    b:
      en: "No extension is named pg_vector; the name is `vector`."
      fr: "Aucune extension ne s'appelle pg_vector ; le nom est `vector`."
    d:
      en: "Server parameters of a flexible server are set through Azure, not ALTER SYSTEM, and creating the extension in the database is still required."
      fr: "Les paramètres d'un serveur flexible se définissent par Azure, pas avec ALTER SYSTEM, et il faut toujours créer l'extension dans la base de données."
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgvector
