id: ai200-2b-storage-type
objective: "2.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso is creating an Azure Database for PostgreSQL flexible server for a RAG application. The embedding volume will grow steadily, and the IOPS needs change with the indexing workload.

    How should you complete the storage plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un serveur flexible Azure Database for PostgreSQL pour une application RAG. Le volume d'incorporations augmentera régulièrement, et les besoins en IOPS varient selon la charge d'indexation.

    Comment devez-vous compléter le plan de stockage ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Choose [[type]] so that IOPS and throughput can be adjusted independently of the disk size.

      Alert before storage usage reaches [[pct]] percent, the level at which the server switches to read-only mode.

      Plan capacity carefully: the storage size can be [[dir]].
    fr: |
      Choisissez [[type]] afin que les IOPS et le débit puissent être ajustés indépendamment de la taille du disque.

      Déclenchez une alerte avant que l'utilisation du stockage atteigne [[pct]] %, le niveau auquel le serveur passe en mode lecture seule.

      Planifiez la capacité avec soin : la taille de stockage peut être [[dir]].
  slots:
    - id: type
      options:
        - { id: v2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
        - { id: premium, text: { en: "Premium SSD", fr: "SSD Premium" } }
        - { id: standard, text: { en: "Standard SSD", fr: "SSD Standard" } }
    - id: pct
      options:
        - { id: p80, text: "80" }
        - { id: p90, text: "90" }
        - { id: p95, text: "95" }
        - { id: p100, text: "100" }
    - id: dir
      options:
        - { id: up, text: { en: "increased only", fr: "augmentée uniquement" } }
        - { id: both, text: { en: "increased or decreased", fr: "augmentée ou réduite" } }
        - { id: restart, text: { en: "decreased after a server restart", fr: "réduite après un redémarrage du serveur" } }
answer:
  values: { type: v2, pct: p95, dir: up }
explanation:
  correct:
    en: "Premium SSD v2 has no fixed sizes and lets you adjust capacity, IOPS and throughput at any time, whereas Premium SSD ties IOPS to the disk size. The server switches to read-only mode when storage usage reaches 95 percent or free space falls below 5 GiB. Storage can only be scaled up, never down."
    fr: "SSD Premium v2 n'a pas de tailles fixes et permet d'ajuster la capacité, les IOPS et le débit à tout moment, alors que SSD Premium lie les IOPS à la taille du disque. Le serveur passe en mode lecture seule quand l'utilisation du stockage atteint 95 % ou que l'espace libre descend sous 5 Gio. Le stockage ne peut qu'être augmenté, jamais réduit."
  options:
    premium:
      en: "With Premium SSD, IOPS scales with the provisioned disk size."
      fr: "Avec SSD Premium, les IOPS évoluent avec la taille de disque provisionnée."
    standard:
      en: "Standard SSD is not a storage option of Azure Database for PostgreSQL flexible server."
      fr: "SSD Standard n'est pas une option de stockage d'Azure Database for PostgreSQL flexible server."
    both:
      en: "Storage cannot be decreased, whatever the storage type."
      fr: "Le stockage ne peut pas être réduit, quel que soit le type de stockage."
references:
  - title: Storage options
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-storage
