id: ai200-2c-pg-pool-max-size
objective: "2.2.6"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Alpine Ski House runs a recommendation API in Azure Container Apps. The app scales out to a maximum of 20 replicas. Each replica creates one psycopg `ConnectionPool` that connects directly on port 5432 to an Azure Database for PostgreSQL flexible server.

    The server has `max_connections` set to 859, and 15 connections are reserved by the `reserved_connections` and `superuser_reserved_connections` parameters. A batch job that can run at any time also uses up to 100 connections.

    You need to set the largest `max_size` value for the pool that never exceeds the available user connections when all the replicas run.

    Which value should you use?
  fr: |
    Alpine Ski House exécute une API de recommandation dans Azure Container Apps. L'application monte en charge jusqu'à 20 réplicas au maximum. Chaque réplica crée un `ConnectionPool` psycopg qui se connecte directement sur le port 5432 à un serveur flexible Azure Database for PostgreSQL.

    Le paramètre `max_connections` du serveur vaut 859, et 15 connexions sont réservées par les paramètres `reserved_connections` et `superuser_reserved_connections`. Un traitement par lots, qui peut s'exécuter à tout moment, utilise aussi jusqu'à 100 connexions.

    Vous devez définir la plus grande valeur de `max_size` pour le pool qui ne dépasse jamais les connexions utilisateur disponibles quand tous les réplicas s'exécutent.

    Quelle valeur devez-vous utiliser ?
body:
  options:
    - { id: a, text: "30" }
    - { id: b, text: "37" }
    - { id: c, text: "42" }
    - { id: d, text: "43" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The available user connections are `max_connections` minus the reserved connections: 859 - 15 = 844. The batch job takes up to 100 of them, which leaves 744 for the API, and 744 / 20 replicas = 37.2, so each pool can hold at most 37 connections.
    fr: |
      Les connexions utilisateur disponibles correspondent à `max_connections` moins les connexions réservées : 859 - 15 = 844. Le traitement par lots en utilise jusqu'à 100, ce qui en laisse 744 pour l'API, et 744 / 20 réplicas = 37,2 : chaque pool peut donc contenir au plus 37 connexions.
  options:
    a:
      en: |
        30 stays within the limit but isn't the largest value that does.
      fr: |
        30 respecte la limite, mais ce n'est pas la plus grande valeur qui la respecte.
    c:
      en: |
        42 ignores the 100 connections of the batch job: 844 / 20 = 42.2.
      fr: |
        42 ne tient pas compte des 100 connexions du traitement par lots : 844 / 20 = 42,2.
    d:
      en: |
        43 ignores both the reserved connections and the batch job: 859 / 20 = 42.95.
      fr: |
        43 ne tient compte ni des connexions réservées ni du traitement par lots : 859 / 20 = 42,95.
references:
  - title: Limits in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-limits
