id: ai200-2c-redis-expiration-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Lamna Healthcare uses an Azure Managed Redis instance with the default eviction policy to cache appointment summaries and user profiles stored as hashes. Some keys are written with a time to live (TTL), and others without.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lamna Healthcare utilise une instance Azure Managed Redis avec la stratégie d'éviction par défaut pour mettre en cache des résumés de rendez-vous et des profils utilisateur stockés sous forme de hachages. Certaines clés sont écrites avec une durée de vie (TTL), d'autres sans.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When memory is full, a key that has no TTL can be evicted."
        fr: "Quand la mémoire est pleine, une clé qui n'a pas de durée de vie peut être évincée."
    - id: s2
      text:
        en: "Calling `r.set(key, value)` on an existing key that has a TTL removes the TTL."
        fr: "Appeler `r.set(key, value)` sur une clé existante qui a une durée de vie supprime cette durée de vie."
    - id: s3
      text:
        en: "Calling `r.expire(\"profile:1001\", 600)` on a hash key sets the expiration of the whole hash."
        fr: "Appeler `r.expire(\"profile:1001\", 600)` sur une clé de hachage définit l'expiration de tout le hachage."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The default eviction policy of Azure Managed Redis is `volatile-lru`: only keys that have a TTL are eligible for eviction, so keys without a TTL stay, and writes can fail when no key is eligible. A plain SET discards the previous TTL of the key. EXPIRE applies to a key whatever its data type, so it sets the TTL of the whole hash.
    fr: |
      La stratégie d'éviction par défaut d'Azure Managed Redis est `volatile-lru` : seules les clés qui ont une durée de vie peuvent être évincées. Les clés sans durée de vie restent donc, et les écritures peuvent échouer quand aucune clé n'est éligible. Un SET simple supprime la durée de vie précédente de la clé. EXPIRE s'applique à une clé quel que soit son type de données : il définit la durée de vie de tout le hachage.
references:
  - title: Best practices for memory management for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-memory-management
