id: ai200-cs2c-excerpt-index
objective: "2.3.2"
type: single
caseStudy: ai200-cs2c-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to create the vector index on redis-byair-search to meet the manual search requirement.

    Which command should you run?
  fr: |
    Vous devez créer l'index vectoriel sur redis-byair-search pour satisfaire l'exigence relative à la recherche dans les manuels.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - id: a
      text: "FT.CREATE idx:excerpts ON HASH PREFIX 1 excerpt: SCHEMA embedding VECTOR HNSW 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE"
    - id: b
      text: "FT.CREATE idx:excerpts ON HASH PREFIX 1 excerpt: SCHEMA embedding VECTOR FLAT 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE"
    - id: c
      text: "FT.CREATE idx:excerpts ON HASH PREFIX 1 excerpt: SCHEMA embedding VECTOR FLAT 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC L2"
    - id: d
      text: "FT.CREATE idx:excerpts ON HASH PREFIX 1 excerpt: SCHEMA embedding VECTOR HNSW 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC IP"
answer: { optionId: b }
explanation:
  correct:
    en: |
      A FLAT vector index performs an exact brute-force search, which meets the exhaustive search rule and is practical for about 6,000 excerpts. The distance metric must match the embedding model, which is designed for cosine similarity, so the field uses `DISTANCE_METRIC COSINE` with the FLOAT32 type and 1,536 dimensions of the stored vectors.
    fr: |
      Un index vectoriel FLAT effectue une recherche exhaustive exacte, ce qui respecte la règle de recherche exhaustive et reste pratique pour environ 6 000 extraits. La métrique de distance doit correspondre au modèle d'incorporation, conçu pour la similarité cosinus : le champ utilise donc `DISTANCE_METRIC COSINE` avec le type FLOAT32 et les 1 536 dimensions des vecteurs stockés.
  options:
    a:
      en: HNSW is an approximate nearest neighbor index; it trades exhaustive precision for latency, which the safety rules do not allow.
      fr: HNSW est un index approximatif des plus proches voisins ; il sacrifie la précision exhaustive au profit de la latence, ce que les règles de sécurité n'autorisent pas.
    c:
      en: The index is exhaustive, but the L2 metric does not match the cosine similarity that the embedding model is designed for.
      fr: L'index est exhaustif, mais la métrique L2 ne correspond pas à la similarité cosinus pour laquelle le modèle d'incorporation est conçu.
    d:
      en: HNSW is approximate, and the IP metric does not match the cosine similarity of the embedding model.
      fr: HNSW est approximatif, et la métrique IP ne correspond pas à la similarité cosinus du modèle d'incorporation.
references:
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
