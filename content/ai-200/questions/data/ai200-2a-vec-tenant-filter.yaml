id: ai200-2a-vec-tenant-filter
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a multi-tenant RAG service. Chunks are stored in one Azure Cosmos DB for NoSQL container partitioned on `/tenantId`, with a `diskANN` index on `/embedding`. Each chunk has a `lang` property. The current retrieval code is:

    ```python
    container.query_items(
        query="SELECT TOP 5 c.text FROM c ORDER BY VectorDistance(c.embedding, @v)",
        parameters=[{"name": "@v", "value": qv}],
        enable_cross_partition_query=True)
    ```

    The service must return only chunks of the user's tenant (`tenant`) in the user's language (`lang`), and the query must consume as few RUs as possible.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un service RAG multilocataire. Les segments sont stockés dans un seul conteneur Azure Cosmos DB for NoSQL partitionné sur `/tenantId`, avec un index `diskANN` sur `/embedding`. Chaque segment a une propriété `lang`. Le code de récupération actuel est :

    ```python
    container.query_items(
        query="SELECT TOP 5 c.text FROM c ORDER BY VectorDistance(c.embedding, @v)",
        parameters=[{"name": "@v", "value": qv}],
        enable_cross_partition_query=True)
    ```

    Le service doit renvoyer uniquement des segments du locataire de l'utilisateur (`tenant`) dans la langue de l'utilisateur (`lang`), et la requête doit consommer le moins de RU possible.

    Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Filter the returned chunks on tenantId and lang in Python.", fr: "Filtrer en Python les segments renvoyés sur tenantId et lang." } }
    - { id: b, text: { en: "Replace enable_cross_partition_query=True with partition_key=tenant.", fr: "Remplacer enable_cross_partition_query=True par partition_key=tenant." } }
    - { id: c, text: { en: "Remove TOP 5 and keep the first five matching chunks in Python.", fr: "Supprimer TOP 5 et conserver en Python les cinq premiers segments correspondants." } }
    - { id: d, text: { en: "Pass true as the third argument of VectorDistance.", fr: "Passer true comme troisième argument de VectorDistance." } }
    - { id: e, text: { en: "Add WHERE c.lang = @lang to the query and pass lang as a parameter.", fr: "Ajouter WHERE c.lang = @lang à la requête et passer lang comme paramètre." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Vector search can be combined with WHERE filters, so the language filter narrows the candidates inside the query. Scoping the query to the tenant's partition key value keeps it in one logical partition instead of searching every tenant's vectors."
    fr: "La recherche vectorielle peut être combinée avec des filtres WHERE : le filtre de langue réduit les candidats dans la requête elle-même. Limiter la requête à la valeur de clé de partition du locataire la maintient dans une seule partition logique au lieu de rechercher parmi les vecteurs de tous les locataires."
  options:
    c: { en: "Without TOP, the vector search returns many more results and costs more RUs.", fr: "Sans TOP, la recherche vectorielle renvoie beaucoup plus de résultats et coûte plus de RU." }
    a: { en: "Filtering after TOP 5 can leave fewer than five results, and the query still searches every tenant.", fr: "Filtrer après TOP 5 peut laisser moins de cinq résultats, et la requête recherche toujours parmi tous les locataires." }
    d: { en: "An exact brute-force search ignores the diskANN index and costs more RUs.", fr: "Une recherche exacte par force brute ignore l'index diskANN et coûte plus de RU." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
