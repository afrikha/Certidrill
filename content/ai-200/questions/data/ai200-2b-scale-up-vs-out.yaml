id: ai200-2b-scale-up-vs-out
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's recommendation API runs vector searches on an Azure Database for PostgreSQL flexible server with 8 vCores in the Memory Optimized tier. Larger sizes are available in the tier. You must decide whether to scale the server up or to add read replicas.

    Which two conditions indicate that you should scale up the server rather than add read replicas?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API de recommandation de Fabrikam exécute des recherches vectorielles sur un serveur flexible Azure Database for PostgreSQL de 8 vCores du niveau Memory Optimized. Des tailles supérieures sont disponibles dans ce niveau. Vous devez décider s'il faut augmenter la taille du serveur ou ajouter des réplicas en lecture.

    Quelles sont les deux conditions qui indiquent qu'il faut augmenter la taille du serveur plutôt qu'ajouter des réplicas en lecture ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each search is too slow even when only a few users are connected.", fr: "Chaque recherche est trop lente même quand seuls quelques utilisateurs sont connectés." } }
    - { id: b, text: { en: "The workload is mostly reads and tolerates a few seconds of staleness.", fr: "La charge de travail est principalement en lecture et tolère quelques secondes de retard." } }
    - { id: c, text: { en: "Memory pressure causes excessive disk I/O during the searches.", fr: "La pression sur la mémoire provoque des E/S disque excessives pendant les recherches." } }
    - { id: d, text: { en: "Total query volume exceeds what the largest size in the tier can handle.", fr: "Le volume total de requêtes dépasse ce que la plus grande taille du niveau peut traiter." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Learn recommends scaling up when single-query latency is too high, when memory pressure causes excessive disk I/O, or when the tier's maximum resources are not reached yet. Replicas copy the same data to other servers, so they do not make one query faster or give it more memory."
    fr: "Learn recommande d'augmenter la taille quand la latence d'une requête unique est trop élevée, quand la pression sur la mémoire provoque des E/S disque excessives, ou quand les ressources maximales du niveau ne sont pas encore atteintes. Les réplicas copient les mêmes données sur d'autres serveurs : ils ne rendent pas une requête plus rapide et ne lui donnent pas plus de mémoire."
  options:
    b:
      en: "A read-heavy workload that tolerates staleness is the typical case for read replicas."
      fr: "Une charge principalement en lecture qui tolère un retard est le cas type des réplicas en lecture."
    d:
      en: "When total volume exceeds the capacity of the largest size, only scaling out can add capacity."
      fr: "Quand le volume total dépasse la capacité de la plus grande taille, seule la mise à l'échelle horizontale peut ajouter de la capacité."
references:
  - title: Scale for high-volume workloads
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/5-scale-high-volume-workloads
