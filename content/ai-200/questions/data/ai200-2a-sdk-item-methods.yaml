id: ai200-2a-sdk-item-methods
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is writing the data layer of an AI customer-service app in Python with the `azure-cosmos` SDK. The data is stored in Azure Cosmos DB for NoSQL.

    Which `ContainerProxy` method should you use for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware écrit la couche de données d'une application de service client IA en Python avec le SDK `azure-cosmos`. Les données sont stockées dans Azure Cosmos DB for NoSQL.

    Quelle méthode de `ContainerProxy` devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: create, text: create_item }
    - { id: upsert, text: upsert_item }
    - { id: patch, text: patch_item }
    - { id: read, text: read_item }
    - { id: replace, text: replace_item }
    - { id: readall, text: read_all_items }
  targets:
    - { id: t1, text: { en: "Save a new support ticket; the call must fail if a ticket with the same ID already exists in the partition", fr: "Enregistrer un nouveau ticket de support ; l'appel doit échouer si un ticket de même ID existe déjà dans la partition" } }
    - { id: t2, text: { en: "Save a cached model answer, creating it or overwriting the existing one", fr: "Enregistrer une réponse de modèle mise en cache, en la créant ou en écrasant celle qui existe" } }
    - { id: t3, text: { en: "Increase the feedback counter of a conversation without sending the whole item", fr: "Augmenter le compteur de commentaires d'une conversation sans envoyer l'élément entier" } }
    - { id: t4, text: { en: "Get one conversation from its ID and partition key value", fr: "Obtenir une conversation à partir de son ID et de la valeur de sa clé de partition" } }
answer:
  mapping: { t1: create, t2: upsert, t3: patch, t4: read }
explanation:
  correct:
    en: "`create_item` raises an error if an item with the same ID exists. `upsert_item` creates the item or replaces it. `patch_item` applies operations such as `incr` to some properties only. `read_item` is a point read by ID and partition key. `replace_item` fails when the item doesn't exist and sends the full body, and `read_all_items` reads the whole container."
    fr: "`create_item` lève une erreur si un élément de même ID existe. `upsert_item` crée l'élément ou le remplace. `patch_item` applique des opérations comme `incr` à certaines propriétés seulement. `read_item` est une lecture ponctuelle par ID et clé de partition. `replace_item` échoue si l'élément n'existe pas et envoie le corps complet, et `read_all_items` lit tout le conteneur."
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy?view=azure-python
