id: ai200-cs2a-vector-policy
objective: "2.1.3"
type: dropdown
caseStudy: ai200-cs2a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    The NoSQL vector search feature is enabled on cosmos-wwi. You plan to re-create the declarations container with a vector embedding policy and a vector index.

    You need to meet the similarity search requirement. How should you complete the policies? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La fonctionnalité de recherche vectorielle NoSQL est activée sur cosmos-wwi. Vous prévoyez de recréer le conteneur declarations avec une stratégie d'incorporation vectorielle et un index vectoriel.

    Vous devez satisfaire l'exigence relative à la recherche de similarité. Comment devez-vous compléter les stratégies ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "vectorEmbeddingPolicy": {
      "vectorEmbeddings": [
        {
          "path": "/descVector",
          "dataType": "float32",
          "distanceFunction": [[distance]],
          "dimensions": [[dims]]
        }
      ]
    },
    "indexingPolicy": {
      "vectorIndexes": [
        { "path": "/descVector", "type": [[index]] }
      ]
    }
  slots:
    - id: distance
      options:
        - { id: cosine, text: "\"cosine\"" }
        - { id: dot, text: "\"dotproduct\"" }
        - { id: euclid, text: "\"euclidean\"" }
    - id: dims
      options:
        - { id: d505, text: "505" }
        - { id: d1536, text: "1536" }
        - { id: d3072, text: "3072" }
    - id: index
      options:
        - { id: flat, text: "\"flat\"" }
        - { id: qflat, text: "\"quantizedFlat\"" }
        - { id: diskann, text: "\"diskANN\"" }
answer:
  values: { distance: cosine, dims: d3072, index: diskann }
explanation:
  correct:
    en: |
      The policy must describe the stored vectors exactly: cosine similarity and 3,072 dimensions (the default of 1,536 does not match). A `diskANN` index performs an approximate nearest neighbor search that offers the lowest latency and RU charge on large collections, which fits 20 million items when approximate results are acceptable. The vector index must be on the path defined in the vector embedding policy.
    fr: |
      La stratégie doit décrire exactement les vecteurs stockés : similarité cosinus et 3 072 dimensions (la valeur par défaut de 1 536 ne correspond pas). Un index `diskANN` effectue une recherche approximative des plus proches voisins qui offre la latence et la consommation de RU les plus faibles sur de grandes collections, ce qui convient à 20 millions d'éléments quand des résultats approximatifs sont acceptables. L'index vectoriel doit porter sur le chemin défini dans la stratégie d'incorporation vectorielle.
  options:
    dot:
      en: The requirement specifies cosine similarity, not the dot product.
      fr: L'exigence impose la similarité cosinus, pas le produit scalaire.
    euclid:
      en: The requirement specifies cosine similarity, not the Euclidean distance.
      fr: L'exigence impose la similarité cosinus, pas la distance euclidienne.
    d505:
      en: 505 is the maximum number of dimensions of a flat index, not the size of the embeddings.
      fr: 505 est le nombre maximal de dimensions d'un index flat, pas la taille des incorporations.
    d1536:
      en: 1,536 is the default number of dimensions; the embeddings have 3,072 dimensions.
      fr: 1 536 est le nombre de dimensions par défaut ; les incorporations ont 3 072 dimensions.
    flat:
      en: A flat index supports at most 505 dimensions and performs an exact brute-force search.
      fr: Un index flat prend en charge au maximum 505 dimensions et effectue une recherche exhaustive exacte.
    qflat:
      en: A quantizedFlat index still performs a brute-force search; it suits queries whose filters narrow the search to a small set of vectors, not searches across 20 million items.
      fr: Un index quantizedFlat effectue toujours une recherche exhaustive ; il convient aux requêtes dont les filtres réduisent la recherche à un petit ensemble de vecteurs, pas aux recherches sur 20 millions d'éléments.
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
