id: ai200-2a-cf-identity-lease
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum deploys a Python function app that uses the Azure Cosmos DB trigger to summarize new support cases. The trigger uses an identity-based connection: the managed identity of the function app has the Cosmos DB Built-in Data Contributor role on the account, and no account key is stored anywhere.

    The trigger is configured with `lease_container_name="leases"` and `create_lease_container_if_not_exists="true"`. The **leases** container doesn't exist yet, and the function doesn't start.

    You need the function to start. No secret may be added to the configuration.

    What should you do?
  fr: |
    Adatum déploie une application de fonction Python qui utilise le déclencheur Azure Cosmos DB pour résumer les nouveaux dossiers de support. Le déclencheur utilise une connexion basée sur l'identité : l'identité managée de l'application de fonction a le rôle Cosmos DB Built-in Data Contributor sur le compte, et aucune clé de compte n'est stockée nulle part.

    Le déclencheur est configuré avec `lease_container_name="leases"` et `create_lease_container_if_not_exists="true"`. Le conteneur **leases** n'existe pas encore, et la fonction ne démarre pas.

    Vous devez faire démarrer la fonction. Aucun secret ne doit être ajouté à la configuration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Also assign the Cosmos DB Built-in Data Reader role to the managed identity.", fr: "Attribuer aussi le rôle Cosmos DB Built-in Data Reader à l'identité managée." } }
    - { id: b, text: { en: "Replace the identity-based connection with a connection string that contains the account key.", fr: "Remplacer la connexion basée sur l'identité par une chaîne de connexion qui contient la clé du compte." } }
    - { id: c, text: { en: "Create the leases container with the Azure CLI, and set create_lease_container_if_not_exists to false.", fr: "Créer le conteneur leases avec Azure CLI et définir create_lease_container_if_not_exists sur false." } }
    - { id: d, text: { en: "Set startFromBeginning to true so that the trigger initializes the leases.", fr: "Définir startFromBeginning sur true pour que le déclencheur initialise les baux." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Creating the lease container automatically isn't allowed when the trigger authenticates with a Microsoft Entra identity, so the function doesn't start. Creating a container is a control plane operation; create the lease container beforehand (for example with `az cosmosdb sql container create`) and turn the option off."
    fr: "La création automatique du conteneur de baux n'est pas autorisée quand le déclencheur s'authentifie avec une identité Microsoft Entra : la fonction ne démarre donc pas. Créer un conteneur est une opération de plan de contrôle ; créez le conteneur de baux au préalable (par exemple avec `az cosmosdb sql container create`) et désactivez l'option."
  options:
    a: { en: "Data Contributor already includes read access; another data role doesn't make lease container creation possible with an identity.", fr: "Data Contributor inclut déjà la lecture ; un autre rôle de données ne rend pas possible la création du conteneur de baux avec une identité." }
    b: { en: "An account key is a secret, which the requirement forbids.", fr: "Une clé de compte est un secret, ce que l'exigence interdit." }
    d: { en: "The start point doesn't create the lease container; the function still fails to start.", fr: "Le point de départ ne crée pas le conteneur de baux ; la fonction ne démarre toujours pas." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
