id: ai200-2b-composite-leftmost
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The products table of Proseware's recommendation service on Azure Database for PostgreSQL has the following index:

    `CREATE INDEX idx_products_category_price ON products (category_id, price);`

    No other index exists on these columns.

    Which two WHERE clauses can use idx_products_category_price efficiently?

    NOTE: Each correct selection is worth one point.
  fr: |
    La table products du service de recommandation de Proseware sur Azure Database for PostgreSQL dispose de l'index suivant :

    `CREATE INDEX idx_products_category_price ON products (category_id, price);`

    Aucun autre index n'existe sur ces colonnes.

    Quelles sont les deux clauses WHERE qui peuvent utiliser efficacement idx_products_category_price ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "WHERE price < 100" }
    - { id: b, text: "WHERE category_id = 5" }
    - { id: c, text: "WHERE category_id = 5 AND price < 100" }
    - { id: d, text: "WHERE attributes @> '{\"color\": \"red\"}'" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A composite B-tree index is most effective when the query filters on its leftmost columns. `(category_id, price)` serves `category_id = 5` and the combination of both columns."
    fr: "Un index B-tree composite est le plus efficace quand la requête filtre sur ses colonnes de gauche. `(category_id, price)` sert `category_id = 5` et la combinaison des deux colonnes."
  options:
    a:
      en: "price is not the leftmost column, so a filter on price alone does not benefit from this index."
      fr: "price n'est pas la colonne de gauche : un filtre sur price seul ne profite pas de cet index."
    d:
      en: "A containment test on a jsonb column needs a GIN index on that column; this B-tree index does not cover it."
      fr: "Un test de contenance sur une colonne jsonb nécessite un index GIN sur cette colonne ; cet index B-tree ne la couvre pas."
references:
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
