id: ai200-2b-index-yesno
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is choosing how to create and tune the vector indexes of a new knowledge base on Azure Database for PostgreSQL. The table is created empty, and the data arrives over several weeks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam choisit comment créer et régler les index vectoriels d'une nouvelle base de connaissances sur Azure Database for PostgreSQL. La table est créée vide, et les données arrivent sur plusieurs semaines.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An IVFFlat index created while the table is empty gives the same recall as one created after the data is loaded."
        fr: "Un index IVFFlat créé quand la table est vide offre le même rappel qu'un index créé après le chargement des données."
    - id: s2
      text:
        en: "An HNSW index can be created while the table is empty, because HNSW has no training step."
        fr: "Un index HNSW peut être créé quand la table est vide, car HNSW n'a pas d'étape d'entraînement."
    - id: s3
      text:
        en: "Increasing `hnsw.ef_search` requires rebuilding the HNSW index."
        fr: "Augmenter `hnsw.ef_search` impose de reconstruire l'index HNSW."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "IVFFlat partitions the data into lists with k-means on the rows present at build time, so it should be created after the data is loaded and rebuilt when the data changes a lot. HNSW builds a graph without training and can be created on an empty table. `hnsw.ef_search` is a query-time setting, changed with SET or SET LOCAL; only the build options `m` and `ef_construction` require a rebuild."
    fr: "IVFFlat partitionne les données en listes par k-means sur les lignes présentes au moment de la construction : il doit être créé après le chargement des données et reconstruit quand les données changent beaucoup. HNSW construit un graphe sans entraînement et peut être créé sur une table vide. `hnsw.ef_search` est un paramètre de requête, modifié avec SET ou SET LOCAL ; seules les options de construction `m` et `ef_construction` imposent une reconstruction."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
