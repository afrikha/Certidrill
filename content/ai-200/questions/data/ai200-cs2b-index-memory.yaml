id: ai200-cs2b-index-memory
objective: "2.2.4"
type: single
caseStudy: ai200-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the search latency requirement for pg-trey. What should you do?
  fr: |
    Vous devez satisfaire l'exigence relative à la latence de recherche de pg-trey. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Increase the storage size of pg-trey to get more IOPS for the index pages."
        fr: "Augmenter la taille de stockage de pg-trey pour obtenir plus d'IOPS pour les pages de l'index."
    - id: c
      text:
        en: "Move pg-trey to the Burstable compute tier with 8 vCores."
        fr: "Passer pg-trey au niveau de calcul Burstable avec 8 vCores."
    - id: b
      text:
        en: "Move pg-trey to the Memory Optimized compute tier with 8 vCores."
        fr: "Passer pg-trey au niveau de calcul Mémoire optimisée avec 8 vCores."
    - id: d
      text:
        en: "Create a read replica of pg-trey in the General Purpose compute tier with 8 vCores."
        fr: "Créer un réplica en lecture de pg-trey au niveau de calcul Usage général avec 8 vCores."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The General Purpose tier provides 4 GiB of memory per vCore, so 8 vCores give 32 GiB, which cannot hold a 40 GB index. The Memory Optimized tier provides 6.75 to 9.5 GiB per vCore, so the same 8 vCores give at least 54 GiB, enough to keep the whole index in memory without changing the number of vCores.
    fr: |
      Le niveau Usage général fournit 4 Gio de mémoire par vCore : 8 vCores donnent 32 Gio, ce qui ne peut pas contenir un index de 40 Go. Le niveau Mémoire optimisée fournit de 6,75 à 9,5 Gio par vCore : les mêmes 8 vCores donnent au moins 54 Gio, assez pour garder l'index entier en mémoire sans changer le nombre de vCores.
  options:
    a:
      en: More IOPS speed up the reads from disk, but the index still does not fit in memory.
      fr: Davantage d'IOPS accélèrent les lectures sur disque, mais l'index ne tient toujours pas en mémoire.
    c:
      en: The Burstable tier is designed for workloads that don't need full CPU continuously and is not recommended for production workloads.
      fr: Le niveau Burstable est conçu pour les charges de travail qui n'ont pas besoin de toute la puissance du processeur en continu et n'est pas recommandé pour la production.
    d:
      en: A replica with the same compute has the same 32 GiB of memory, so the index does not fit in memory on the replica either.
      fr: |
        Un réplica avec le même calcul dispose des mêmes 32 Gio de mémoire : l'index ne tient pas non plus en mémoire sur le réplica.
references:
  - title: Compute Options - Azure Database for PostgreSQL
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-compute
