id: ai200-2b-read-replica
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove's document assistant runs on an Azure Database for PostgreSQL flexible server that is already the largest size the budget allows. Semantic search traffic has grown tenfold, while writes stay low. Search results may be a few seconds out of date, but a user who uploads a document must find it immediately in their own searches.

    What should you do?
  fr: |
    L'assistant documentaire de Woodgrove s'exécute sur un serveur flexible Azure Database for PostgreSQL qui a déjà la plus grande taille autorisée par le budget. Le trafic de recherche sémantique a été multiplié par dix, tandis que les écritures restent faibles. Les résultats de recherche peuvent avoir quelques secondes de retard, mais un utilisateur qui charge un document doit le retrouver immédiatement dans ses propres recherches.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable high availability and send the search queries to the standby server.", fr: "Activer la haute disponibilité et envoyer les requêtes de recherche au serveur de secours." } }
    - { id: b, text: { en: "Add read replicas, send searches to them, and keep the uploader's searches on the primary.", fr: "Ajouter des réplicas en lecture, leur envoyer les recherches et garder les recherches de l'auteur du chargement sur le serveur principal." } }
    - { id: c, text: { en: "Add read replicas, and send every query, including the uploads, to the replica endpoints.", fr: "Ajouter des réplicas en lecture et envoyer toutes les requêtes, y compris les chargements, aux points de terminaison des réplicas." } }
    - { id: d, text: { en: "Increase the storage size of the server so that it gets more IOPS for the searches.", fr: "Augmenter la taille de stockage du serveur afin qu'il obtienne plus d'IOPS pour les recherches." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When query volume exceeds what one server can handle and the workload is read-heavy with acceptable staleness, Learn recommends scaling out with read replicas (up to five per primary). Replication is asynchronous, so queries that need to see a write immediately must go to the primary, and the application routes each query to the right endpoint."
    fr: "Quand le volume de requêtes dépasse ce qu'un serveur peut traiter et que la charge est principalement en lecture avec un retard acceptable, Learn recommande une mise à l'échelle horizontale avec des réplicas en lecture (jusqu'à cinq par serveur principal). La réplication est asynchrone : les requêtes qui doivent voir une écriture immédiatement vont au serveur principal, et l'application dirige chaque requête vers le bon point de terminaison."
  options:
    a:
      en: "The high availability standby is not available for read queries; it exists for failover."
      fr: "Le serveur de secours de la haute disponibilité n'est pas disponible pour les requêtes de lecture ; il sert au basculement."
    c:
      en: "Read replicas are read-only, and their asynchronous lag would hide a document that was just uploaded."
      fr: "Les réplicas en lecture sont en lecture seule, et leur retard asynchrone masquerait un document qui vient d'être chargé."
    d:
      en: "More IOPS does not add the query processing capacity that the tenfold search traffic needs."
      fr: "Plus d'IOPS n'ajoute pas la capacité de traitement des requêtes dont le trafic de recherche multiplié par dix a besoin."
references:
  - title: Scale for high-volume workloads
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/5-scale-high-volume-workloads
  - title: Scaling Resources in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/scale/concepts-scaling-resources
