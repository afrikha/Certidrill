id: ai200-2c-redis-ttl-minus-one
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys stores chat sessions in Azure Managed Redis. While you troubleshoot memory growth, you run the following redis-py code for a session key.

    ```python
    r.ttl("session:4f21")
    ```

    The call returns `-1`.

    What does the result indicate?
  fr: |
    Tailspin Toys stocke des sessions de conversation dans Azure Managed Redis. En analysant la croissance de la mémoire, vous exécutez le code redis-py suivant pour une clé de session.

    ```python
    r.ttl("session:4f21")
    ```

    L'appel renvoie `-1`.

    Qu'indique ce résultat ?
body:
  options:
    - id: a
      text:
        en: "The key doesn't exist."
        fr: "La clé n'existe pas."
    - id: b
      text:
        en: "The key exists and has no expiration."
        fr: "La clé existe et n'a pas d'expiration."
    - id: c
      text:
        en: "The key expires in less than one second."
        fr: "La clé expire dans moins d'une seconde."
    - id: d
      text:
        en: "The key expired and waits for eviction."
        fr: "La clé a expiré et attend son éviction."
answer: { optionId: b }
explanation:
  correct:
    en: |
      TTL returns the remaining time to live in seconds, `-1` when the key exists but has no associated expiration, and `-2` when the key doesn't exist. Session keys without a TTL never leave the cache by themselves, which explains the memory growth; they should be written with an expiration.
    fr: |
      TTL renvoie la durée de vie restante en secondes, `-1` quand la clé existe mais n'a pas d'expiration associée, et `-2` quand la clé n'existe pas. Des clés de session sans durée de vie ne quittent jamais le cache d'elles-mêmes, ce qui explique la croissance de la mémoire ; elles devraient être écrites avec une expiration.
  options:
    a:
      en: |
        A key that doesn't exist returns `-2`.
      fr: |
        Une clé qui n'existe pas renvoie `-2`.
    c:
      en: |
        A key about to expire returns 0 or a positive number of seconds; `pttl` gives the precise value in milliseconds.
      fr: |
        Une clé sur le point d'expirer renvoie 0 ou un nombre positif de secondes ; `pttl` donne la valeur précise en millisecondes.
    d:
      en: |
        An expired key is treated as nonexistent, so TTL returns `-2`.
      fr: |
        Une clé expirée est traitée comme inexistante : TTL renvoie `-2`.
references:
  - title: Best practices for memory management for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-memory-management
