id: ai200-2a-cons-statements
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is choosing the default consistency level of a new Azure Cosmos DB for NoSQL account for an AI knowledge base. The account might later be configured with multiple write regions.

    Which two statements about consistency levels are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum choisit le niveau de cohérence par défaut d'un nouveau compte Azure Cosmos DB for NoSQL pour une base de connaissances IA. Le compte pourra ensuite être configuré avec plusieurs régions d'écriture.

    Quelles sont les deux affirmations vraies concernant les niveaux de cohérence ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Strong consistency can't be used on an account with multiple write regions.", fr: "La cohérence Strong ne peut pas être utilisée sur un compte qui a plusieurs régions d'écriture." } }
    - { id: b, text: { en: "Eventual consistency reads two replicas to compensate for its weaker guarantees.", fr: "La cohérence Eventual lit deux réplicas pour compenser ses garanties plus faibles." } }
    - { id: c, text: { en: "Reads with Strong or Bounded staleness consistency cost about twice the RUs of reads with weaker levels.", fr: "Les lectures en cohérence Strong ou Bounded staleness coûtent environ deux fois plus de RU que les lectures avec des niveaux plus faibles." } }
    - { id: d, text: { en: "Session consistency guarantees that every client in every region reads the latest committed write.", fr: "La cohérence Session garantit que chaque client de chaque région lit la dernière écriture validée." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Strong consistency isn't allowed with multiple write regions. Strong and Bounded staleness reads go to two replicas (a local minority quorum), so they cost about twice the RUs of Session, Consistent prefix and Eventual reads, which use a single replica."
    fr: "La cohérence Strong n'est pas autorisée avec plusieurs régions d'écriture. Les lectures Strong et Bounded staleness interrogent deux réplicas (un quorum minoritaire local) : elles coûtent environ deux fois plus de RU que les lectures Session, Consistent prefix et Eventual, qui utilisent un seul réplica."
  options:
    d: { en: "Session guarantees read-your-writes and write-follows-reads within one client session, not the latest write for every client.", fr: "Session garantit la lecture de ses propres écritures et l'écriture après lecture au sein d'une session client, pas la dernière écriture pour tous les clients." }
    b: { en: "Eventual reads use a single replica, which may be lagging.", fr: "Les lectures Eventual utilisent un seul réplica, qui peut être en retard." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
