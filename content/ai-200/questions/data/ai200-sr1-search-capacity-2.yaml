id: ai200-sr1-search-capacity-2
objective: "2.2.4"
type: series_yesno
series: ai200-sr1-search-capacity
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a read replica and connect the search API to it.
  fr: Vous créez un réplica en lecture et y connectez l'API de recherche.
body:
  solution:
    en: |
      You create a read replica of pg-northwind-rag named **pg-northwind-rag-r1** in the same region, with the same compute tier and number of vCores. You change the host name used by the search API to the host name of pg-northwind-rag-r1.
    fr: |
      Vous créez un réplica en lecture de pg-northwind-rag nommé **pg-northwind-rag-r1** dans la même région, avec le même niveau de calcul et le même nombre de vCores. Vous remplacez le nom d'hôte utilisé par l'API de recherche par le nom d'hôte de pg-northwind-rag-r1.
answer: { value: true }
explanation:
  correct:
    en: A read replica is a separate read-only server with its own compute, updated asynchronously from the primary, and it is designed to scale read-intensive workloads. Moving the read-only vector queries to pg-northwind-rag-r1 adds 8 vCores for searches, the search API tolerates the replication lag, and the ingestion service keeps writing to pg-northwind-rag. Read replicas are supported in the Memory Optimized tier.
    fr: "Un réplica en lecture est un serveur distinct en lecture seule, avec son propre calcul, mis à jour de façon asynchrone à partir du serveur principal, et il est conçu pour mettre à l'échelle les charges de travail intensives en lecture. Le transfert des requêtes vectorielles en lecture seule vers pg-northwind-rag-r1 ajoute 8 vCores pour les recherches, l'API de recherche tolère le décalage de réplication, et le service d'ingestion continue d'écrire dans pg-northwind-rag. Les réplicas en lecture sont pris en charge au niveau Memory Optimized."
references:
  - title: Read replicas in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-read-replicas
