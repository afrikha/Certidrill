id: ai200-2c-pgb-parameters
objective: "2.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Humongous Insurance enables the built-in PgBouncer on an Azure Database for PostgreSQL flexible server that serves a claims assistant. You need to configure PgBouncer to meet the requirements shown in the answer area.

    Which server parameter should you set for each requirement? To answer, drag the appropriate parameters to the correct requirements. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Humongous Insurance active le PgBouncer intégré sur un serveur flexible Azure Database for PostgreSQL qui sert un assistant de gestion des sinistres. Vous devez configurer PgBouncer pour respecter les exigences de la zone de réponse.

    Quel paramètre de serveur devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: maxclient, text: pgbouncer.max_client_conn }
    - { id: poolsize, text: pgbouncer.default_pool_size }
    - { id: minpool, text: pgbouncer.min_pool_size }
    - { id: wait, text: pgbouncer.query_wait_timeout }
    - { id: idle, text: pgbouncer.server_idle_timeout }
    - { id: mode, text: pgbouncer.pool_mode }
  targets:
    - id: t1
      text: { en: "Accept up to 8,000 client connections.", fr: "Accepter jusqu'à 8 000 connexions clientes." }
    - id: t2
      text: { en: "Open up to 80 server connections for each user and database pair.", fr: "Ouvrir jusqu'à 80 connexions au serveur pour chaque paire utilisateur et base de données." }
    - id: t3
      text: { en: "Cancel a query that waits more than 30 seconds for a server connection.", fr: "Annuler une requête qui attend plus de 30 secondes une connexion au serveur." }
    - id: t4
      text: { en: "Close server connections that stay idle for more than 5 minutes.", fr: "Fermer les connexions au serveur inactives depuis plus de 5 minutes." }
answer:
  mapping: { t1: maxclient, t2: poolsize, t3: wait, t4: idle }
explanation:
  correct:
    en: |
      `pgbouncer.max_client_conn` limits the client connections (5,000 by default). `pgbouncer.default_pool_size` sets the server connections per user and database pair (50 by default). `pgbouncer.query_wait_timeout` is the time, in seconds, that a query may wait for a server connection (120 by default). `pgbouncer.server_idle_timeout` drops server connections idle for longer than its value in seconds (600 by default).
    fr: |
      `pgbouncer.max_client_conn` limite les connexions clientes (5 000 par défaut). `pgbouncer.default_pool_size` définit le nombre de connexions au serveur par paire utilisateur et base de données (50 par défaut). `pgbouncer.query_wait_timeout` est la durée, en secondes, pendant laquelle une requête peut attendre une connexion au serveur (120 par défaut). `pgbouncer.server_idle_timeout` ferme les connexions au serveur inactives au-delà de sa valeur en secondes (600 par défaut).
  options:
    minpool:
      en: |
        `min_pool_size` adds server connections when the pool falls below a minimum; it doesn't set a maximum.
      fr: |
        `min_pool_size` ajoute des connexions au serveur quand le pool descend sous un minimum ; il ne fixe pas de maximum.
    mode:
      en: |
        `pool_mode` decides when a server connection is returned to the pool, not a number of connections or a timeout.
      fr: |
        `pool_mode` détermine quand une connexion au serveur est rendue au pool, pas un nombre de connexions ni un délai.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
