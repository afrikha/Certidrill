id: ai200-cs3a-index-consistency
objective: "2.1.2"
type: dragdrop
caseStudy: ai200-cs3a-coho-vineyard
difficulty: 3
status: draft
stem:
  en: |
    You need to configure cosmos-coho and the indexing policy of the wines container to meet the catalog and cart performance requirement.

    Which setting should you use for each configuration item? To answer, drag the appropriate settings to the correct configuration items. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer cosmos-coho et la stratégie d'indexation du conteneur wines pour respecter l'exigence de performances du catalogue et du panier.

    Quel paramètre devez-vous utiliser pour chaque élément de configuration ? Pour répondre, faites glisser les paramètres appropriés vers les éléments de configuration correspondants. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: session, text: Session }
    - { id: strong, text: Strong }
    - { id: eventual, text: Eventual }
    - { id: cdesc, text: "[ /vintage descending, /price ascending ]" }
    - { id: casc, text: "[ /vintage ascending, /price ascending ]" }
    - { id: notes, text: "/tastingNotes/*" }
    - { id: region, text: "/region/?" }
  targets:
    - { id: level, text: { en: "Default consistency level of cosmos-coho", fr: "Niveau de cohérence par défaut de cosmos-coho" } }
    - { id: composite, text: { en: "Entry of compositeIndexes in the wines indexing policy", fr: "Entrée de compositeIndexes dans la stratégie d'indexation de wines" } }
    - { id: excluded, text: { en: "Path to add to excludedPaths in the wines indexing policy", fr: "Chemin à ajouter à excludedPaths dans la stratégie d'indexation de wines" } }
answer:
  mapping: { level: session, composite: cdesc, excluded: notes }
explanation:
  correct:
    en: "Session consistency guarantees that a client session reads its own writes, while other sessions can see the change later; reads at Strong consistency cost more RUs. A query with ORDER BY on two properties requires a composite index whose paths are in the same sequence and the same directions as the ORDER BY clause, or exactly reversed. Excluding `/tastingNotes/*` removes a large property that no query uses from the index, which lowers the RU charge of writes."
    fr: "La cohérence Session garantit qu'une session cliente lit ses propres écritures, alors que les autres sessions peuvent voir la modification plus tard ; les lectures en cohérence Strong consomment plus de RU. Une requête avec ORDER BY sur deux propriétés exige un index composite dont les chemins sont dans le même ordre et les mêmes sens que la clause ORDER BY, ou exactement inversés. Exclure `/tastingNotes/*` retire de l'index une propriété volumineuse qu'aucune requête n'utilise, ce qui réduit la consommation de RU des écritures."
  options:
    strong: { en: "Strong meets the read-your-writes need but charges more RUs per read than Session.", fr: "Strong répond au besoin de lire ses propres écritures mais consomme plus de RU par lecture que Session." }
    eventual: { en: "Eventual does not guarantee that a session reads its own writes.", fr: "Eventual ne garantit pas qu'une session lise ses propres écritures." }
    casc: { en: "Ascending on both paths is neither the same directions as DESC, ASC nor their exact reverse, so it cannot serve the sort.", fr: "L'ordre croissant sur les deux chemins ne correspond ni aux sens DESC, ASC ni à leur inverse exact : il ne peut pas servir le tri." }
    region: { en: "region is the partition key and the filter of every catalog query; removing it from the index would raise the RU charge of those queries; the large property that weighs on the writes is tastingNotes.", fr: "region est la clé de partition et le filtre de toutes les requêtes du catalogue ; la retirer de l'index augmenterait la consommation de RU de ces requêtes ; la propriété volumineuse qui pèse sur les écritures est tastingNotes." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
