id: ai200-2a-vec-limitations
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to add vector search to an existing Azure Cosmos DB for NoSQL account that hosts the data of a game-guide chatbot. Before you start, you review the current limitations of vector search.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit d'ajouter la recherche vectorielle à un compte Azure Cosmos DB for NoSQL existant qui héberge les données d'un chatbot de guides de jeux. Avant de commencer, vous examinez les limitations actuelles de la recherche vectorielle.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A vector embedding policy can target a path inside an array, such as /chunks/[]/embedding.", fr: "Une stratégie d'incorporation vectorielle peut cibler un chemin dans un tableau, comme /chunks/[]/embedding." } }
    - { id: b, text: { en: "A diskANN index serves queries from its index even when the container holds fewer than 1,000 vectors.", fr: "Un index diskANN sert les requêtes à partir de son index même quand le conteneur contient moins de 1 000 vecteurs." } }
    - { id: c, text: { en: "Vector indexing and search aren't supported on accounts with shared throughput.", fr: "L'indexation et la recherche vectorielles ne sont pas prises en charge sur les comptes à débit partagé." } }
    - { id: d, text: { en: "Once vector indexing and search are enabled on a container, they can't be disabled.", fr: "Une fois l'indexation et la recherche vectorielles activées sur un conteneur, elles ne peuvent pas être désactivées." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Learn states that vector indexing and search aren't supported on accounts with shared throughput, and that vector search can't be disabled on a container after it's enabled."
    fr: "Learn indique que l'indexation et la recherche vectorielles ne sont pas prises en charge sur les comptes à débit partagé, et que la recherche vectorielle ne peut pas être désactivée sur un conteneur une fois activée."
  options:
    a: { en: "Wildcards (`*`, `[]`) and vector paths nested inside arrays aren't supported in the vector policy or index.", fr: "Les caractères génériques (`*`, `[]`) et les chemins vectoriels imbriqués dans des tableaux ne sont pas pris en charge dans la stratégie ou l'index vectoriels." }
    b: { en: "quantizedFlat and diskANN need at least 1,000 vectors; with fewer, a full scan runs instead.", fr: "quantizedFlat et diskANN ont besoin d'au moins 1 000 vecteurs ; avec moins, une analyse complète est effectuée." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
