id: ai200-2b-3072-dims
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware stores 3,072-dimension embeddings in a `vector(3072)` column of a 12-million-row table on Azure Database for PostgreSQL. The embeddings are generated in SQL by calling `azure_openai.create_embeddings` with a text-embedding-3-large deployment, and version 1.1.0 of the azure_ai extension is installed.

    `CREATE INDEX ... USING hnsw` fails with the error `column cannot have more than 2000 dimensions for hnsw index`. The search team accepts a one-time re-embedding of the content.

    You need an approximate nearest neighbor index for the embeddings. What should you do?
  fr: |
    Proseware stocke des incorporations de 3 072 dimensions dans une colonne `vector(3072)` d'une table de 12 millions de lignes sur Azure Database for PostgreSQL. Les incorporations sont générées en SQL en appelant `azure_openai.create_embeddings` avec un déploiement text-embedding-3-large, et la version 1.1.0 de l'extension azure_ai est installée.

    `CREATE INDEX ... USING hnsw` échoue avec l'erreur `column cannot have more than 2000 dimensions for hnsw index`. L'équipe de recherche accepte une nouvelle génération ponctuelle des incorporations du contenu.

    Vous avez besoin d'un index de recherche approximative du plus proche voisin pour les incorporations. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the `vector(3072)` column, and create an IVFFlat index on it with `lists = 3500`.", fr: "Conserver la colonne `vector(3072)` et créer sur elle un index IVFFlat avec `lists = 3500`." } }
    - { id: b, text: { en: "Keep the `vector(3072)` column, raise `maintenance_work_mem` to 8 GB, and run the HNSW statement again.", fr: "Conserver la colonne `vector(3072)`, porter `maintenance_work_mem` à 8 Go et exécuter de nouveau l'instruction HNSW." } }
    - { id: c, text: { en: "Re-embed into a `vector(1536)` column by passing `batch_size => 1536`, and create the HNSW index on it.", fr: "Régénérer les incorporations dans une colonne `vector(1536)` en passant `batch_size => 1536`, et créer l'index HNSW sur elle." } }
    - { id: d, text: { en: "Re-embed into a `vector(1536)` column by passing `dimensions => 1536`, and create the HNSW index on it.", fr: "Régénérer les incorporations dans une colonne `vector(1536)` en passant `dimensions => 1536`, et créer l'index HNSW sur elle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "pgvector can store vectors of more than 2,000 dimensions but can't index them with IVFFlat or HNSW; Learn suggests dimensionality reduction to fit within the limit. With azure_ai 1.1.0 or later and a text-embedding-3 model, the `dimensions` argument of `azure_openai.create_embeddings` returns shorter embeddings, which a `vector(1536)` column and an HNSW index accept."
    fr: "pgvector peut stocker des vecteurs de plus de 2 000 dimensions, mais ne peut pas les indexer avec IVFFlat ni HNSW ; Learn suggère une réduction de dimensionnalité pour respecter la limite. Avec azure_ai 1.1.0 ou version ultérieure et un modèle text-embedding-3, l'argument `dimensions` de `azure_openai.create_embeddings` renvoie des incorporations plus courtes, qu'une colonne `vector(1536)` et un index HNSW acceptent."
  options:
    a:
      en: "IVFFlat has the same 2,000-dimension limit and fails with the same kind of error."
      fr: "IVFFlat a la même limite de 2 000 dimensions et échoue avec le même type d'erreur."
    b:
      en: "The failure is a dimension limit, not a lack of memory; more build memory does not lift it."
      fr: "L'échec vient d'une limite de dimensions, pas d'un manque de mémoire ; plus de mémoire de construction ne la lève pas."
    c:
      en: "`batch_size` sets how many texts of a `text[]` input are sent per call; the model still returns 3,072 dimensions, which a `vector(1536)` column rejects."
      fr: "`batch_size` définit le nombre de textes d'une entrée `text[]` envoyés par appel ; le modèle renvoie toujours 3 072 dimensions, qu'une colonne `vector(1536)` refuse."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
  - title: Generate Vector Embeddings with Azure OpenAI - Azure Database for PostgreSQL
    url: https://learn.microsoft.com/en-us/azure/postgresql/azure-ai/generative-ai-azure-openai
