id: ai200-2b-3072-dims
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware stores 3,072-dimension embeddings in a `vector(3072)` column of a 12-million-row table on Azure Database for PostgreSQL. The vectors must stay at their full dimension and precision. Version 0.6 of the pg_diskann extension is allowed and created in the database.

    `CREATE INDEX ... USING hnsw` fails with the error `column cannot have more than 2000 dimensions for hnsw index`.

    You need an approximate nearest neighbor index on the column. What should you do?
  fr: |
    Proseware stocke des incorporations de 3 072 dimensions dans une colonne `vector(3072)` d'une table de 12 millions de lignes sur Azure Database for PostgreSQL. Les vecteurs doivent conserver leur dimension et leur précision complètes. La version 0.6 de l'extension pg_diskann est autorisée et créée dans la base de données.

    `CREATE INDEX ... USING hnsw` échoue avec l'erreur `column cannot have more than 2000 dimensions for hnsw index`.

    Vous avez besoin d'un index de recherche approximative du plus proche voisin sur la colonne. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an IVFFlat index on the column with `lists = 3500`.", fr: "Créer un index IVFFlat sur la colonne avec `lists = 3500`." } }
    - { id: b, text: { en: "Raise `maintenance_work_mem` to 8 GB, and then run the HNSW statement again.", fr: "Porter `maintenance_work_mem` à 8 Go, puis exécuter de nouveau l'instruction HNSW." } }
    - { id: c, text: { en: "Create the HNSW index with `m = 64` and `ef_construction = 256`.", fr: "Créer l'index HNSW avec `m = 64` et `ef_construction = 256`." } }
    - { id: d, text: { en: "Create a DiskANN index on the column with `product_quantized = true`.", fr: "Créer un index DiskANN sur la colonne avec `product_quantized = true`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "pgvector IVFFlat and HNSW indexes support at most 2,000 dimensions. pg_diskann 0.6 and later can index vectors of up to 16,000 dimensions when product quantization is enabled (a preview feature), and Learn recommends product quantization for tables of more than one million rows."
    fr: "Les index IVFFlat et HNSW de pgvector prennent en charge au plus 2 000 dimensions. pg_diskann 0.6 et versions ultérieures peut indexer des vecteurs jusqu'à 16 000 dimensions quand la quantification de produit est activée (une fonctionnalité en préversion), et Learn recommande la quantification de produit pour les tables de plus d'un million de lignes."
  options:
    a:
      en: "IVFFlat has the same 2,000-dimension limit and fails with the same kind of error."
      fr: "IVFFlat a la même limite de 2 000 dimensions et échoue avec le même type d'erreur."
    b:
      en: "The failure is a dimension limit, not a lack of memory; more build memory does not lift it."
      fr: "L'échec vient d'une limite de dimensions, pas d'un manque de mémoire ; plus de mémoire de construction ne la lève pas."
    c:
      en: "Graph parameters do not change the 2,000-dimension limit of HNSW."
      fr: "Les paramètres du graphe ne changent pas la limite de 2 000 dimensions de HNSW."
references:
  - title: Enable and Use DiskANN in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgdiskann
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
