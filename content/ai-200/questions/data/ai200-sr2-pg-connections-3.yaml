series: ai200-sr2-pg-connections
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You enable the built-in PgBouncer and connect on port 6432.
  fr: Vous activez le PgBouncer intégré et vous vous connectez sur le port 6432.
body:
  solution:
    en: You set the **pgbouncer.enabled** server parameter of pg-fabrikam to **true**. You change the connection string of the app to use `pg-fabrikam.postgres.database.azure.com` and port **6432**.
    fr: Vous définissez le paramètre de serveur **pgbouncer.enabled** de pg-fabrikam sur **true**. Vous modifiez la chaîne de connexion de l'application pour utiliser `pg-fabrikam.postgres.database.azure.com` et le port **6432**.
answer: { value: true }
explanation:
  correct:
    en: The built-in PgBouncer is available on the General Purpose and Memory Optimized tiers and runs on the same server, on port 6432. In its default transaction pool mode, it lets the client connections of all instances share a small set of server connections, which keeps the API within the limit and avoids opening a server connection for each request.
    fr: "Le PgBouncer intégré est disponible sur les niveaux General Purpose et Memory Optimized et s'exécute sur le même serveur, sur le port 6432. Dans son mode de pool par défaut (transaction), il permet aux connexions clientes de toutes les instances de partager un petit ensemble de connexions au serveur, ce qui maintient l'API sous la limite et évite d'ouvrir une connexion au serveur pour chaque requête."
references:
  - title: PgBouncer in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
