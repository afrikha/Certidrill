id: ai200-2a-idx-ttl-keyvalue
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys stores chatbot session state in an Azure Cosmos DB for NoSQL container. The app accesses an item only by its ID and partition key value with `read_item()` and `upsert_item()`; it never runs queries against the container.

    Each item must be deleted automatically 24 hours after its last update by using time to live (TTL). You need to configure the indexing policy that minimizes the RU charge of writes.

    Which indexing policy should you use?
  fr: |
    Wingtip Toys stocke l'état des sessions d'un chatbot dans un conteneur Azure Cosmos DB for NoSQL. L'application accède à un élément uniquement par son ID et la valeur de sa clé de partition avec `read_item()` et `upsert_item()` ; elle n'exécute jamais de requêtes sur le conteneur.

    Chaque élément doit être supprimé automatiquement 24 heures après sa dernière mise à jour grâce à la durée de vie (TTL). Vous devez configurer la stratégie d'indexation qui réduit au minimum la consommation de RU des écritures.

    Quelle stratégie d'indexation devez-vous utiliser ?
body:
  options:
    - { id: a, text: '{ "indexingMode": "none" } with defaultTtl set to 86400 on the container' }
    - { id: b, text: '{ "indexingMode": "consistent", "includedPaths": [], "excludedPaths": [ { "path": "/*" } ] }' }
    - { id: c, text: '{ "indexingMode": "lazy", "includedPaths": [ { "path": "/*" } ] }' }
    - { id: d, text: '{ "indexingMode": "consistent", "includedPaths": [ { "path": "/*" } ], "excludedPaths": [ { "path": "/state/*" } ] }' }
answer: { optionId: b }
explanation:
  correct:
    en: "TTL requires indexing, so the mode can't be `none`. For TTL without property indexes, Learn recommends consistent mode with no included paths and `/*` as the only excluded path, which keeps write costs at their lowest while point reads and writes keep working."
    fr: "La TTL exige l'indexation : le mode ne peut donc pas être `none`. Pour une TTL sans index de propriétés, Learn recommande le mode consistent sans chemin inclus et avec `/*` comme seul chemin exclu, ce qui maintient le coût des écritures au plus bas, tandis que les lectures et écritures ponctuelles continuent de fonctionner."
  options:
    a: { en: "You can't enable TTL on a container whose indexing mode is `none`.", fr: "Vous ne pouvez pas activer la TTL sur un conteneur dont le mode d'indexation est `none`." }
    c: { en: "Lazy mode can't be selected without an exemption from Microsoft, and it still indexes every property.", fr: "Le mode lazy ne peut pas être sélectionné sans dérogation de Microsoft, et il indexe toujours toutes les propriétés." }
    d: { en: "Every property except `state` is still indexed, so writes cost more than needed for an app that never queries.", fr: "Toutes les propriétés sauf `state` restent indexées : les écritures coûtent plus que nécessaire pour une application qui n'exécute jamais de requêtes." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
