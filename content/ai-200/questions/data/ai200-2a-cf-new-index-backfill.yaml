id: ai200-2a-cf-new-index-backfill
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a function app in which the function `embed_docs` has used the Azure Cosmos DB trigger with the lease container **leases** for months. You are adding a function named `index_docs` that feeds a new search index from the same monitored container.

    `index_docs` must process every existing item and then every future change, and it must use a dedicated lease container named **leases-search**. Company policy requires that `create_lease_container_if_not_exists` stays false. `embed_docs` must not reprocess any item.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'une application de fonction dans laquelle la fonction `embed_docs` utilise depuis des mois le déclencheur Azure Cosmos DB avec le conteneur de baux **leases**. Vous ajoutez une fonction nommée `index_docs` qui alimente un nouvel index de recherche à partir du même conteneur surveillé.

    `index_docs` doit traiter chaque élément existant puis chaque modification future, et elle doit utiliser un conteneur de baux dédié nommé **leases-search**. La politique de l'entreprise exige que `create_lease_container_if_not_exists` reste à false. `embed_docs` ne doit retraiter aucun élément.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create the leases-search container.", fr: "Créer le conteneur leases-search." } }
    - { id: config, text: { en: "Configure the trigger of index_docs with lease_container_name set to leases-search and startFromBeginning set to true.", fr: "Configurer le déclencheur de index_docs avec lease_container_name défini sur leases-search et startFromBeginning défini sur true." } }
    - { id: deploy, text: { en: "Deploy the function app.", fr: "Déployer l'application de fonction." } }
    - { id: deleteleases, text: { en: "Delete the leases container used by embed_docs.", fr: "Supprimer le conteneur leases utilisé par embed_docs." } }
    - { id: embedstart, text: { en: "Set startFromBeginning to true on the trigger of embed_docs.", fr: "Définir startFromBeginning sur true pour le déclencheur de embed_docs." } }
    - { id: backup, text: { en: "Enable continuous backup on the Azure Cosmos DB account.", fr: "Activer la sauvegarde continue sur le compte Azure Cosmos DB." } }
answer:
  sequence: [ create, config, deploy ]
explanation:
  correct:
    en: "Because the trigger may not create its lease container, leases-search must exist before index_docs starts. `startFromBeginning` reads the whole history only on the first run, when no leases exist, which is the case for a new lease container. Deploying the function app then starts index_docs, while embed_docs keeps its own leases."
    fr: "Comme le déclencheur ne peut pas créer son conteneur de baux, leases-search doit exister avant le démarrage de index_docs. `startFromBeginning` lit tout l'historique uniquement à la première exécution, quand aucun bail n'existe, ce qui est le cas d'un nouveau conteneur de baux. Le déploiement de l'application de fonction démarre ensuite index_docs, tandis que embed_docs conserve ses propres baux."
  options:
    deleteleases: { en: "Deleting the leases of embed_docs would make it lose its progress, against the requirement.", fr: "Supprimer les baux de embed_docs lui ferait perdre sa progression, contrairement à l'exigence." }
    embedstart: { en: "The setting has no effect on embed_docs, whose leases already exist, and that function must not reprocess anything anyway.", fr: "Le paramètre est sans effet sur embed_docs, dont les baux existent déjà, et cette fonction ne doit de toute façon rien retraiter." }
    backup: { en: "Continuous backup is required only for the all versions and deletes mode.", fr: "La sauvegarde continue n'est requise que pour le mode toutes versions et suppressions." }
references:
  - title: Azure Cosmos DB trigger for Functions 2.x and higher
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger
