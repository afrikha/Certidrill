id: ai200-2a-vec-diskann-recall
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a policy assistant that searches 4 million 1,536-dimension vectors in an Azure Cosmos DB for NoSQL container with a `diskANN` index. Auditors found that, for some questions, relevant passages are missing from the top 10 results.

    You need to improve recall for the auditors' queries only. You must not change the container or its policies, and a higher RU charge and latency are acceptable for these queries.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un assistant de politiques internes qui recherche parmi 4 millions de vecteurs de 1 536 dimensions dans un conteneur Azure Cosmos DB for NoSQL doté d'un index `diskANN`. Les auditeurs ont constaté que, pour certaines questions, des passages pertinents manquent dans les 10 premiers résultats.

    Vous devez améliorer le rappel pour les requêtes des auditeurs uniquement. Vous ne devez pas modifier le conteneur ni ses stratégies, et une consommation de RU et une latence plus élevées sont acceptables pour ces requêtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Pass {distanceFunction:'DotProduct'} as the options of VectorDistance in the auditors' queries.", fr: "Passer {distanceFunction:'DotProduct'} comme options de VectorDistance dans les requêtes des auditeurs." } }
    - { id: b, text: { en: "Pass a higher searchListSizeMultiplier in the options of VectorDistance in the auditors' queries.", fr: "Passer un searchListSizeMultiplier plus élevé dans les options de VectorDistance des requêtes des auditeurs." } }
    - { id: c, text: { en: "Create the auditors' CosmosClient with consistency_level=\"Strong\".", fr: "Créer le CosmosClient des auditeurs avec consistency_level=\"Strong\"." } }
    - { id: d, text: { en: "Add max_item_count=1000 to the query_items() call of the auditors' queries.", fr: "Ajouter max_item_count=1000 à l'appel query_items() des requêtes des auditeurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "diskANN favors high recall at low latency rather than guaranteeing 100% recall. Its recall can be tuned per query: a larger `searchListSizeMultiplier` in the VectorDistance options trades higher latency and RU cost for higher recall, without touching the index."
    fr: "diskANN privilégie un rappel élevé à faible latence plutôt qu'un rappel garanti de 100 %. Son rappel se règle par requête : un `searchListSizeMultiplier` plus grand dans les options de VectorDistance échange une latence et un coût en RU plus élevés contre un meilleur rappel, sans toucher à l'index."
  options:
    a: { en: "Overriding the distance function changes how similarity is measured instead of searching more candidates, and it no longer matches the metric of the embeddings.", fr: "Remplacer la fonction de distance change la mesure de la similarité au lieu d'examiner plus de candidats, et ne correspond plus à la métrique des incorporations." }
    c: { en: "Consistency controls how fresh the data is, not how many neighbors the approximate search explores.", fr: "La cohérence contrôle la fraîcheur des données, pas le nombre de voisins explorés par la recherche approximative." }
    d: { en: "max_item_count only sets the page size of the results; the TOP 10 results stay the same.", fr: "max_item_count définit seulement la taille de page des résultats ; les 10 premiers résultats restent les mêmes." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
