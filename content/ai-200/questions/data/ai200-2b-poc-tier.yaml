id: ai200-2b-poc-tier
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is building a proof of concept of a semantic search over 50,000 embeddings on Azure Database for PostgreSQL flexible server. Five testers use it during working hours, and it has no production service-level requirement.

    The solution must minimize cost.

    Which compute tier should you choose?
  fr: |
    Wingtip développe une preuve de concept de recherche sémantique sur 50 000 incorporations dans un serveur flexible Azure Database for PostgreSQL. Cinq testeurs l'utilisent pendant les heures de bureau, et elle n'a aucune exigence de niveau de service de production.

    La solution doit réduire les coûts au minimum.

    Quel niveau de calcul devez-vous choisir ?
body:
  options:
    - { id: a, text: General Purpose }
    - { id: b, text: Memory Optimized }
    - { id: c, text: Burstable }
    - { id: d, text: { en: "General Purpose with a read replica", fr: "General Purpose avec un réplica en lecture" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Burstable tier (B-series) is intended for proofs of concept, development builds and small databases with low or intermittent load. It is the cheapest tier, and it is not recommended for production."
    fr: "Le niveau Burstable (série B) est prévu pour les preuves de concept, les builds de développement et les petites bases de données à charge faible ou intermittente. C'est le niveau le moins cher, et il n'est pas recommandé pour la production."
  options:
    a:
      en: "General Purpose targets most production workloads and costs more than Burstable for this small test load."
      fr: "General Purpose cible la plupart des charges de travail de production et coûte plus cher que Burstable pour cette petite charge de test."
    b:
      en: "Memory Optimized is for large in-memory working sets, such as millions of vectors, and is the most expensive tier."
      fr: "Memory Optimized est destiné aux grands jeux de données en mémoire, comme des millions de vecteurs, et c'est le niveau le plus cher."
    d:
      en: "A replica adds a second server to pay for, and five testers do not need read scale-out."
      fr: "Un réplica ajoute un second serveur à payer, et cinq testeurs n'ont pas besoin de mise à l'échelle horizontale des lectures."
references:
  - title: Compute Options
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-compute
