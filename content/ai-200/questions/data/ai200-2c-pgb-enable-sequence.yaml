id: ai200-2c-pgb-enable-sequence
objective: "2.2.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Munson's Pickles runs a chat API that connects on port 5432 to an Azure Database for PostgreSQL flexible server named pg-munson. The server uses the Burstable B2s compute size.

    You need the API to use the connection pooling of the built-in PgBouncer. The solution must minimize the number of changes.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Munson's Pickles exécute une API de conversation qui se connecte sur le port 5432 à un serveur flexible Azure Database for PostgreSQL nommé pg-munson. Le serveur utilise la taille de calcul Burstable B2s.

    L'API doit utiliser le regroupement de connexions du PgBouncer intégré. La solution doit réduire au minimum le nombre de modifications.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: port
      text:
        en: "Change the port in the connection string of the API to 6432."
        fr: "Remplacer le port de la chaîne de connexion de l'API par 6432."
    - id: scale
      text:
        en: "Scale pg-munson to a General Purpose compute size."
        fr: "Mettre à l'échelle pg-munson vers une taille de calcul General Purpose."
    - id: session
      text:
        en: "Set the `pgbouncer.pool_mode` server parameter to `session`."
        fr: "Définir le paramètre de serveur `pgbouncer.pool_mode` sur `session`."
    - id: enable
      text:
        en: "Set the `pgbouncer.enabled` server parameter to `true`."
        fr: "Définir le paramètre de serveur `pgbouncer.enabled` sur `true`."
    - id: restart
      text:
        en: "Restart pg-munson to start PgBouncer."
        fr: "Redémarrer pg-munson pour démarrer PgBouncer."
    - id: replica
      text:
        en: "Create a read replica of pg-munson for PgBouncer."
        fr: "Créer un réplica en lecture de pg-munson pour PgBouncer."
answer:
  sequence: [ scale, enable, port ]
explanation:
  correct:
    en: |
      The built-in PgBouncer isn't supported on the Burstable tier, so the server must first move to General Purpose (or Memory Optimized). PgBouncer is then enabled with the `pgbouncer.enabled` parameter, which doesn't require a restart. Finally, the API connects to port 6432 with the same host name.
    fr: |
      Le PgBouncer intégré n'est pas pris en charge sur le niveau Burstable : le serveur doit d'abord passer en General Purpose (ou Memory Optimized). PgBouncer est ensuite activé avec le paramètre `pgbouncer.enabled`, qui ne nécessite pas de redémarrage. Enfin, l'API se connecte au port 6432 avec le même nom d'hôte.
  options:
    session:
      en: |
        The default transaction mode is the recommended one; session mode reduces the benefit of pooling.
      fr: |
        Le mode transaction par défaut est le mode recommandé ; le mode session réduit l'intérêt du regroupement.
    restart:
      en: |
        Enabling PgBouncer doesn't require a server restart.
      fr: |
        L'activation de PgBouncer ne nécessite pas de redémarrage du serveur.
    replica:
      en: |
        PgBouncer runs on the server itself; it doesn't need a replica.
      fr: |
        PgBouncer s'exécute sur le serveur lui-même ; il n'a pas besoin de réplica.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
