id: ai200-2c-pg-rag-statements
objective: "2.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Relecloud runs a retrieval-augmented generation (RAG) API on Azure Database for PostgreSQL flexible server. The `doc_chunks` table has a `tenant_id` column and an `embedding` column of type `vector(1536)` with a DiskANN index.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud exécute une API de génération augmentée de récupération (RAG) sur Azure Database for PostgreSQL serveur flexible. La table `doc_chunks` possède une colonne `tenant_id` et une colonne `embedding` de type `vector(1536)` avec un index DiskANN.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A query that combines `WHERE tenant_id = 42` with `ORDER BY embedding <=> %s::vector LIMIT 5` can return chunks of tenant 7 when tenant 42 has fewer than five chunks."
        fr: "Une requête qui combine `WHERE tenant_id = 42` et `ORDER BY embedding <=> %s::vector LIMIT 5` peut renvoyer des segments du locataire 7 quand le locataire 42 a moins de cinq segments."
    - id: s2
      text:
        en: "When `diskann.iterative_search` is `off`, a query can return at most `diskann.l_value_is` rows, even if its `LIMIT` is higher."
        fr: "Quand `diskann.iterative_search` est défini sur `off`, une requête peut renvoyer au plus `diskann.l_value_is` lignes, même si son `LIMIT` est supérieur."
    - id: s3
      text:
        en: "The value returned by `embedding <=> %s::vector` gets smaller as the chunk becomes more similar to the question."
        fr: "La valeur renvoyée par `embedding <=> %s::vector` diminue à mesure que le segment devient plus similaire à la question."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A `WHERE` filter is applied to every returned row, so a tenant with fewer chunks simply gets fewer rows, never rows of another tenant. Non-iterative DiskANN search fetches `diskann.l_value_is` candidates in one step and can't return more, regardless of the `LIMIT`. The `<=>` operator returns the cosine distance, which decreases as vectors become more similar.
    fr: |
      Un filtre `WHERE` s'applique à chaque ligne renvoyée : un locataire qui a moins de segments obtient simplement moins de lignes, jamais celles d'un autre locataire. La recherche DiskANN non itérative récupère `diskann.l_value_is` candidats en une seule étape et ne peut pas en renvoyer davantage, quel que soit le `LIMIT`. L'opérateur `<=>` renvoie la distance cosinus, qui diminue à mesure que les vecteurs deviennent plus similaires.
references:
  - title: Enable and Use DiskANN in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgdiskann
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/how-to-use-pgvector
