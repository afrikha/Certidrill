id: ai200-2c-pgb-waiting-metric
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a RAG API that connects to an Azure Database for PostgreSQL flexible server through the built-in PgBouncer on port 6432. Users report slow answers during peak hours.

    You enable the PgBouncer metrics of the server. You need to monitor how many client connections are queued because no server connection is available in the pool.

    Which metric should you monitor?
  fr: |
    Contoso exécute une API RAG qui se connecte à un serveur flexible Azure Database for PostgreSQL par le PgBouncer intégré sur le port 6432. Les utilisateurs signalent des réponses lentes aux heures de pointe.

    Vous activez les métriques PgBouncer du serveur. Vous devez surveiller le nombre de connexions clientes mises en attente parce qu'aucune connexion au serveur n'est disponible dans le pool.

    Quelle métrique devez-vous surveiller ?
body:
  options:
    - { id: a, text: "server_connections_idle" }
    - { id: b, text: "client_connections_waiting" }
    - { id: c, text: "total_pooled_connections" }
    - { id: d, text: "num_pools" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `client_connections_waiting` counts the client connections that wait for a server connection from the pool. A sustained value above zero during peaks means that the pool size, or the work done in each transaction, limits the throughput.
    fr: |
      `client_connections_waiting` compte les connexions clientes qui attendent une connexion au serveur issue du pool. Une valeur durablement supérieure à zéro pendant les pics indique que la taille du pool, ou le travail effectué dans chaque transaction, limite le débit.
  options:
    a:
      en: |
        This metric counts server connections that are open but unused, the opposite of a shortage.
      fr: |
        Cette métrique compte les connexions au serveur ouvertes mais inutilisées, soit l'inverse d'une pénurie.
    c:
      en: |
        This metric counts the pooled connections, without telling whether clients are waiting.
      fr: |
        Cette métrique compte les connexions regroupées, sans indiquer si des clients attendent.
    d:
      en: |
        This metric counts the connection pools (user and database pairs), not the queued clients.
      fr: |
        Cette métrique compte les pools de connexions (paires utilisateur et base de données), pas les clients en attente.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
