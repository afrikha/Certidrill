id: ai200-2b-storage-yesno
objective: "2.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware stores 30 million embeddings and their HNSW index on an Azure Database for PostgreSQL flexible server. You are planning the storage of the server as the data grows.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke 30 millions d'incorporations et leur index HNSW sur un serveur flexible Azure Database for PostgreSQL. Vous planifiez le stockage du serveur à mesure que les données augmentent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After you increase the storage from 512 GiB to 1 TiB, you can reduce it back to 512 GiB when the old embeddings are deleted."
        fr: "Après avoir porté le stockage de 512 Gio à 1 Tio, vous pouvez le ramener à 512 Gio quand les anciennes incorporations sont supprimées."
    - id: s2
      text:
        en: "The server switches to read-only mode when storage usage reaches 95 percent."
        fr: "Le serveur passe en mode lecture seule quand l'utilisation du stockage atteint 95 %."
    - id: s3
      text:
        en: "With Premium SSD v2 storage, you can change the IOPS of the server without changing its storage size."
        fr: "Avec le stockage SSD Premium v2, vous pouvez modifier les IOPS du serveur sans modifier sa taille de stockage."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Storage can only be scaled up, never down, whatever the storage type. The server becomes read-only when usage reaches 95 percent or when less than 5 GiB remains, so monitor storage and grow it before that point. Premium SSD v2 lets you adjust capacity, IOPS and throughput independently, for example with `az postgres flexible-server update --iops`."
    fr: "Le stockage ne peut qu'être augmenté, jamais réduit, quel que soit le type de stockage. Le serveur passe en lecture seule quand l'utilisation atteint 95 % ou quand il reste moins de 5 Gio : surveillez le stockage et augmentez-le avant ce seuil. SSD Premium v2 permet d'ajuster indépendamment la capacité, les IOPS et le débit, par exemple avec `az postgres flexible-server update --iops`."
references:
  - title: Storage options
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-storage
