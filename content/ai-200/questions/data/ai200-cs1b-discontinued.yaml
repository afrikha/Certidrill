id: ai200-cs1b-discontinued
objective: "2.1.4"
type: single
caseStudy: ai200-cs1b-wingtip
difficulty: 2
status: draft
stem:
  en: |
    The product managers use an internal tool that calls the Azure Cosmos DB Python SDK to discontinue products. sync-search uses the Azure Functions Cosmos DB trigger with its default change feed mode.

    You need to meet the discontinued products requirement. What should you do?
  fr: |
    Les chefs de produit utilisent un outil interne qui appelle le SDK Python d'Azure Cosmos DB pour abandonner des produits. sync-search utilise le déclencheur Cosmos DB d'Azure Functions avec son mode de flux de modification par défaut.

    Vous devez satisfaire l'exigence relative aux produits abandonnés. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Delete the item with `delete_item()`, and make sync-search remove the product when the change feed delivers the deletion."
        fr: "Supprimer l'élément avec `delete_item()` et faire retirer le produit par sync-search quand le flux de modification transmet la suppression."
    - id: b
      text:
        en: "Upsert the item with `\"discontinued\": true` and `\"ttl\": 86400`, and make sync-search remove the products whose `discontinued` property is true."
        fr: "Mettre à jour l'élément par upsert avec `\"discontinued\": true` et `\"ttl\": 86400`, et faire retirer par sync-search les produits dont la propriété `discontinued` est vraie."
    - id: c
      text:
        en: "Set the default time to live of products to 86,400 seconds, and make sync-search remove the product when the change feed reports its expiration."
        fr: "Définir la durée de vie par défaut de products sur 86 400 secondes et faire retirer le produit par sync-search quand le flux de modification signale son expiration."
    - id: d
      text:
        en: "Delete the item with `delete_item()`, and configure the trigger of sync-search to start from the beginning of the change feed."
        fr: "Supprimer l'élément avec `delete_item()` et configurer le déclencheur de sync-search pour démarrer au début du flux de modification."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default latest version mode of the change feed does not log deletes, so the deletion must be expressed as an update: a soft-delete flag that sync-search sees in the change feed. Because time to live is on for the container, the item-level `ttl` of 86,400 seconds then deletes the product automatically after 24 hours.
    fr: |
      Le mode de version la plus récente du flux de modification, utilisé par défaut, ne journalise pas les suppressions : la suppression doit donc être exprimée par une mise à jour, c'est-à-dire un indicateur de suppression réversible que sync-search voit dans le flux de modification. Comme la durée de vie est activée sur le conteneur, la propriété `ttl` de l'élément (86 400 secondes) supprime ensuite automatiquement le produit au bout de 24 heures.
  options:
    a:
      en: "Deletes are not captured in latest version mode: a deleted item is no longer available in the change feed, so sync-search never sees it."
      fr: "Les suppressions ne sont pas capturées en mode de version la plus récente : un élément supprimé n'est plus disponible dans le flux de modification, et sync-search ne le voit jamais."
    c:
      en: "A default TTL would expire every product 24 hours after its last write, and expirations are deletes, which the change feed does not report."
      fr: "Une durée de vie par défaut ferait expirer chaque produit 24 heures après sa dernière écriture, et les expirations sont des suppressions, que le flux de modification ne signale pas."
    d:
      en: "Reading the change feed from the beginning replays the latest version of existing items only; deleted items are not in the feed."
      fr: "Relire le flux de modification depuis le début ne renvoie que la dernière version des éléments existants ; les éléments supprimés ne figurent pas dans le flux."
references:
  - title: Change feed modes in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/change-feed-modes
