id: ai200-2a-sdk-preferred-regions
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account with a single write region in **East US** and a read region in **West Europe**. A Python summarization API is moved to West Europe. The API creates its client as follows:

    ```python
    client = CosmosClient(endpoint, credential=DefaultAzureCredential(),
                          preferred_locations=["West Europe", "East US"])
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL avec une seule région d'écriture, **East US**, et une région de lecture, **West Europe**. Une API Python de synthèse est déplacée vers West Europe. L'API crée son client comme suit :

    ```python
    client = CosmosClient(endpoint, credential=DefaultAzureCredential(),
                          preferred_locations=["West Europe", "East US"])
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The setting makes West Europe the write region of the account for this client.", fr: "Le paramètre fait de West Europe la région d'écriture du compte pour ce client." } }
    - { id: b, text: { en: "Writes from the API are still sent to East US.", fr: "Les écritures de l'API sont toujours envoyées à East US." } }
    - { id: c, text: { en: "The API must create one CosmosClient for each region listed in preferred_locations.", fr: "L'API doit créer un CosmosClient pour chaque région listée dans preferred_locations." } }
    - { id: d, text: { en: "Reads from the API are served by West Europe while that region is available.", fr: "Les lectures de l'API sont servies par West Europe tant que cette région est disponible." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`preferred_locations` orders the regions the SDK uses for reads and failover, so reads go to the colocated West Europe replica first. With a single write region, every write still goes to East US; the client setting doesn't change the account topology."
    fr: "`preferred_locations` ordonne les régions que le SDK utilise pour les lectures et le basculement : les lectures vont d'abord au réplica West Europe, situé dans la même région. Avec une seule région d'écriture, toutes les écritures vont toujours à East US ; le paramètre du client ne change pas la topologie du compte."
  options:
    a: { en: "The write region is an account configuration; a client can't change it.", fr: "La région d'écriture est une configuration du compte ; un client ne peut pas la changer." }
    c: { en: "One client per application handles every region in the list; creating several clients adds overhead.", fr: "Un seul client par application gère toutes les régions de la liste ; créer plusieurs clients ajoute une surcharge." }
references:
  - title: Best practices for Python SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/best-practice-python
  - title: Performance Tips for Python SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-python-sdk
