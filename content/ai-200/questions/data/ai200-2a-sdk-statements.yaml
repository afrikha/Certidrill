id: ai200-2a-sdk-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is building a Python back end for a document question-answering service. The back end uses the `azure-cosmos` package to access an Azure Cosmos DB for NoSQL container partitioned on `/tenantId`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso développe un back-end Python pour un service de questions-réponses sur des documents. Le back-end utilise le package `azure-cosmos` pour accéder à un conteneur Azure Cosmos DB for NoSQL partitionné sur `/tenantId`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To read one item with read_item(), you must provide both the item ID and its partition key value."
        fr: "Pour lire un élément avec read_item(), vous devez fournir à la fois l'ID de l'élément et la valeur de sa clé de partition."
    - id: s2
      text:
        en: "With the azure.cosmos.aio client, a query that doesn't specify a partition key runs as a cross-partition query by default."
        fr: "Avec le client azure.cosmos.aio, une requête qui ne spécifie pas de clé de partition s'exécute par défaut comme une requête entre partitions."
    - id: s3
      text:
        en: "You can configure the Python SDK to use Direct mode over TCP to lower the latency of point reads."
        fr: "Vous pouvez configurer le SDK Python pour utiliser le mode direct sur TCP afin de réduire la latence des lectures ponctuelles."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "An item is identified by its ID within a logical partition, so `read_item()` takes `item` and `partition_key`. The async client has no cross-partition flag: queries without a partition key fan out by default. Direct TCP mode access is listed as a limitation of the Python SDK, so it can't be enabled."
    fr: "Un élément est identifié par son ID au sein d'une partition logique : `read_item()` prend donc `item` et `partition_key`. Le client asynchrone n'a pas d'indicateur entre partitions : les requêtes sans clé de partition sont envoyées à toutes les partitions par défaut. L'accès en mode direct TCP figure parmi les limitations du SDK Python ; il ne peut donc pas être activé."
references:
  - title: Azure Cosmos DB SQL API client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/cosmos-readme?view=azure-python
