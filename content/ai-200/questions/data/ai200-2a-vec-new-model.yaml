id: ai200-2a-vec-new-model
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL container named **docs** whose vector embedding policy declares `/embedding` with 1,536 dimensions and a `diskANN` vector index. The company is moving to an embedding model that returns 3,072-dimension vectors and will re-embed all its documents.

    You need to store and search the new vectors in Azure Cosmos DB for NoSQL by using a supported approach.

    What should you do?
  fr: |
    Litware dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **docs** dont la stratégie d'incorporation vectorielle déclare `/embedding` avec 1 536 dimensions et un index vectoriel `diskANN`. L'entreprise passe à un modèle d'incorporation qui renvoie des vecteurs de 3 072 dimensions et va réincorporer tous ses documents.

    Vous devez stocker et rechercher les nouveaux vecteurs dans Azure Cosmos DB for NoSQL à l'aide d'une approche prise en charge.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call replace_container() on docs with a vector embedding policy that declares 3,072 dimensions.", fr: "Appeler replace_container() sur docs avec une stratégie d'incorporation vectorielle qui déclare 3 072 dimensions." } }
    - { id: b, text: { en: "Keep docs unchanged and pass {dataType:'Float16'} in the VectorDistance options of the queries.", fr: "Conserver docs sans changement et passer {dataType:'Float16'} dans les options de VectorDistance des requêtes." } }
    - { id: c, text: { en: "Create a new container with a 3,072-dimension embedding policy and a diskANN index, and load the new vectors.", fr: "Créer un conteneur avec une stratégie d'incorporation de 3 072 dimensions et un index diskANN, puis y charger les nouveaux vecteurs." } }
    - { id: d, text: { en: "Change the vector index of docs to flat so that it accepts vectors of any length.", fr: "Changer l'index vectoriel de docs en flat pour qu'il accepte des vecteurs de toute longueur." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The settings of a vector embedding policy and of vector indexes can't be changed in place. Creating a new container with the new policy is a supported path; diskANN supports up to 4,096 dimensions, so it can index 3,072-dimension vectors."
    fr: "Les paramètres d'une stratégie d'incorporation vectorielle et des index vectoriels ne peuvent pas être modifiés sur place. Créer un conteneur avec la nouvelle stratégie est une approche prise en charge ; diskANN prend en charge jusqu'à 4 096 dimensions et peut donc indexer des vecteurs de 3 072 dimensions."
  options:
    a: { en: "You can't change the settings of an existing vector embedding policy directly with a container replace.", fr: "Vous ne pouvez pas modifier directement les paramètres d'une stratégie d'incorporation vectorielle existante par un remplacement du conteneur." }
    b: { en: "The dataType option changes how values are interpreted, not the number of dimensions declared for the path.", fr: "L'option dataType change l'interprétation des valeurs, pas le nombre de dimensions déclaré pour le chemin." }
    d: { en: "flat supports at most 505 dimensions, and the vector index can't be edited in place either.", fr: "flat prend en charge au plus 505 dimensions, et l'index vectoriel ne peut pas non plus être modifié sur place." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
