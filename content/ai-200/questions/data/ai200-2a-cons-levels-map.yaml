id: ai200-2a-cons-levels-map
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is designing three AI applications, each with its own Azure Cosmos DB for NoSQL account. Each account will have several regions.

    Which default consistency level should you choose for each account? Each level must meet the requirement at the lowest RU cost. To answer, drag the appropriate consistency levels to the correct accounts. Each level may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit trois applications IA, chacune avec son propre compte Azure Cosmos DB for NoSQL. Chaque compte aura plusieurs régions.

    Quel niveau de cohérence par défaut devez-vous choisir pour chaque compte ? Chaque niveau doit répondre à l'exigence au coût en RU le plus faible. Pour répondre, faites glisser les niveaux de cohérence appropriés vers les comptes correspondants. Chaque niveau peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: strong, text: Strong }
    - { id: bounded, text: Bounded staleness }
    - { id: session, text: Session }
    - { id: prefix, text: Consistent prefix }
    - { id: eventual, text: Eventual }
  targets:
    - { id: chat, text: { en: "Chat history: a user must immediately see the messages they post", fr: "Historique de conversation : un utilisateur doit voir immédiatement les messages qu'il publie" } }
    - { id: prices, text: { en: "Price feed for agents in every region: reads may lag behind writes, but never by more than five minutes", fr: "Flux de prix pour les agents de chaque région : les lectures peuvent être en retard sur les écritures, mais jamais de plus de cinq minutes" } }
    - { id: likes, text: { en: "Like counters on generated images: no ordering or freshness guarantee is needed", fr: "Compteurs de mentions J'aime sur des images générées : aucune garantie d'ordre ni de fraîcheur n'est nécessaire" } }
answer:
  mapping: { chat: session, prices: bounded, likes: eventual }
explanation:
  correct:
    en: "Session guarantees read-your-writes within a client session with single-replica reads. Bounded staleness limits the lag to K versions or T time; in multi-region accounts the minimum T is 300 seconds, so a five-minute bound is allowed. Eventual gives no ordering guarantee and the lowest latency. Strong would cost twice the RUs for reads, and Consistent prefix doesn't bound the lag."
    fr: "Session garantit la lecture de ses propres écritures au sein d'une session client, avec des lectures sur un seul réplica. Bounded staleness limite le retard à K versions ou à une durée T ; dans un compte multirégion, T vaut au minimum 300 secondes : une limite de cinq minutes est donc possible. Eventual n'offre aucune garantie d'ordre et la latence la plus faible. Strong coûterait deux fois plus de RU en lecture, et Consistent prefix ne limite pas le retard."
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
