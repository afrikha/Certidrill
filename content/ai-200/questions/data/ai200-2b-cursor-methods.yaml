id: ai200-2b-cursor-methods
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing the data access layer of a retrieval API for Contoso. The layer uses psycopg 3 to work with an Azure Database for PostgreSQL flexible server.

    Which method should you use for each task? To answer, drag the appropriate methods to the correct tasks. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la couche d'accès aux données d'une API de récupération pour Contoso. Cette couche utilise psycopg 3 pour travailler avec un serveur flexible Azure Database for PostgreSQL.

    Quelle méthode devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les méthodes appropriées vers les tâches correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fetchone, text: cursor.fetchone() }
    - { id: fetchall, text: cursor.fetchall() }
    - { id: executemany, text: cursor.executemany() }
    - { id: commit, text: conn.commit() }
    - { id: rollback, text: conn.rollback() }
    - { id: close, text: cursor.close() }
  targets:
    - id: one
      text: { en: "Read the only row returned by a lookup on the primary key", fr: "Lire l'unique ligne renvoyée par une recherche sur la clé primaire" }
    - id: all
      text: { en: "Read every row returned by a top-10 similarity query", fr: "Lire toutes les lignes renvoyées par une requête de similarité top-10" }
    - id: many
      text: { en: "Run one INSERT statement for a list of 500 parameter tuples", fr: "Exécuter une instruction INSERT pour une liste de 500 tuples de paramètres" }
    - id: save
      text: { en: "Make the changes of the current transaction permanent", fr: "Rendre permanentes les modifications de la transaction en cours" }
answer:
  mapping: { one: fetchone, all: fetchall, many: executemany, save: commit }
explanation:
  correct:
    en: "`fetchone()` returns the next row (or None), `fetchall()` returns all the remaining rows of the result, `executemany()` runs the same statement for each tuple of a sequence, and `conn.commit()` makes the transaction permanent, as the Learn samples do after their INSERT, UPDATE and DELETE statements. `rollback()` would discard the changes and `cursor.close()` only releases the cursor."
    fr: "`fetchone()` renvoie la ligne suivante (ou None), `fetchall()` renvoie toutes les lignes restantes du résultat, `executemany()` exécute la même instruction pour chaque tuple d'une séquence, et `conn.commit()` rend la transaction permanente, comme le font les exemples de Learn après leurs instructions INSERT, UPDATE et DELETE. `rollback()` annulerait les modifications et `cursor.close()` libère seulement le curseur."
references:
  - title: "Quickstart: Use Python to Connect and Query Data in Azure Database for PostgreSQL Flexible Server"
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/connect-python
