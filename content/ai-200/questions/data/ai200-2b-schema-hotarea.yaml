id: ai200-2b-schema-hotarea
objective: "2.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A developer at Northwind created the following table for a semantic product search on Azure Database for PostgreSQL. The application ranks products by cosine distance on an HNSW index and filters and sorts them by price.

    Answer each prompt by selecting the appropriate column.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur de Northwind a créé la table suivante pour une recherche sémantique de produits sur Azure Database for PostgreSQL. L'application classe les produits par distance cosinus au moyen d'un index HNSW, et les filtre et les trie par prix.

    Répondez à chaque consigne en sélectionnant la colonne appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The column whose definition prevents the creation of the HNSW index", fr: "La colonne dont la définition empêche la création de l'index HNSW" }
    - id: p2
      text: { en: "The column whose data type makes price range filters and price sorting follow the wrong order", fr: "La colonne dont le type de données fait suivre un mauvais ordre aux filtres de plage et au tri par prix" }
  grid:
    caption: { en: "Table products", fr: "Table products" }
    header: [{ en: "Column", fr: "Colonne" }, { en: "Data type", fr: "Type de données" }]
    rows:
      - [{ text: id, area: c_id }, { text: "bigint GENERATED ALWAYS AS IDENTITY" }]
      - [{ text: sku, area: c_sku }, { text: text }]
      - [{ text: price, area: c_price }, { text: text }]
      - [{ text: category_id, area: c_cat }, { text: integer }]
      - [{ text: attributes, area: c_attr }, { text: jsonb }]
      - [{ text: embedding, area: c_emb }, { text: vector }]
      - [{ text: created_at, area: c_created }, { text: timestamptz }]
answer:
  values: { p1: c_emb, p2: c_price }
explanation:
  correct:
    en: "A vector column declared without a dimension can store vectors but cannot be indexed; it must be declared as `vector(n)` with the model's dimension. A price stored as text is compared as a string, so '100' sorts before '20'; a numeric type such as `numeric(10,2)` gives correct ranges and sorting and supports a B-tree index."
    fr: "Une colonne vector déclarée sans dimension peut stocker des vecteurs mais ne peut pas être indexée ; elle doit être déclarée `vector(n)` avec la dimension du modèle. Un prix stocké en text est comparé comme une chaîne, donc '100' est trié avant '20' ; un type numérique comme `numeric(10,2)` donne des plages et un tri corrects et prend en charge un index B-tree."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
