id: ai200-2a-idx-write-ru-multi
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores call transcripts for an AI compliance assistant in an Azure Cosmos DB for NoSQL container that uses the default indexing policy. Each item contains:

    - `customerId` (partition key) and `callDate`, used in every filter;
    - `transcript`, a long string that is never filtered or sorted on;
    - `embedding`, an array of 1,536 numbers that is searched only by `VectorDistance` through a `diskANN` vector index.

    Ingestion is throttled because writes consume too many RUs. You need to reduce the RU charge of writes without slowing down the existing queries.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank stocke des transcriptions d'appels pour un assistant de conformité IA dans un conteneur Azure Cosmos DB for NoSQL qui utilise la stratégie d'indexation par défaut. Chaque élément contient :

    - `customerId` (clé de partition) et `callDate`, utilisés dans tous les filtres ;
    - `transcript`, une longue chaîne qui n'est jamais filtrée ni triée ;
    - `embedding`, un tableau de 1 536 nombres interrogé uniquement par `VectorDistance` au moyen d'un index vectoriel `diskANN`.

    L'ingestion est limitée, car les écritures consomment trop de RU. Vous devez réduire la consommation de RU des écritures sans ralentir les requêtes existantes.

    Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add /customerId/? and /callDate/? to the excluded paths.", fr: "Ajouter /customerId/? et /callDate/? aux chemins exclus." } }
    - { id: b, text: { en: "Add a composite index on /customerId and /callDate.", fr: "Ajouter un index composite sur /customerId et /callDate." } }
    - { id: c, text: { en: "Add /embedding/* to the excluded paths.", fr: "Ajouter /embedding/* aux chemins exclus." } }
    - { id: d, text: { en: "Change the default consistency level of the account to Eventual.", fr: "Changer le niveau de cohérence par défaut du compte en Eventual." } }
    - { id: e, text: { en: "Add /transcript/? to the excluded paths.", fr: "Ajouter /transcript/? aux chemins exclus." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Fewer indexed properties mean cheaper writes. The transcript is never filtered, so its range index is useless. The vector is served by the vector index; leaving the array in the range index adds indexing work to every insertion, and Learn recommends excluding vector paths to lower insertion RU and latency."
    fr: "Moins de propriétés indexées signifie des écritures moins coûteuses. La transcription n'est jamais filtrée : son index de plage est inutile. Le vecteur est servi par l'index vectoriel ; laisser le tableau dans l'index de plage ajoute du travail d'indexation à chaque insertion, et Learn recommande d'exclure les chemins vectoriels pour réduire les RU et la latence des insertions."
  options:
    a: { en: "These properties are used in every filter; excluding them would force scans and slow down the queries.", fr: "Ces propriétés servent dans tous les filtres ; les exclure forcerait des analyses complètes et ralentirait les requêtes." }
    b: { en: "A composite index adds index entries to every write, which increases the write cost.", fr: "Un index composite ajoute des entrées d'index à chaque écriture, ce qui augmente le coût des écritures." }
    d: { en: "Consistency changes the cost of reads, not the indexing cost of writes.", fr: "La cohérence modifie le coût des lectures, pas le coût d'indexation des écritures." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Index and Query Vector Data in Python - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-python-vector-index-query
