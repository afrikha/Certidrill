id: ai200-cs4a-complaint-types
objective: "2.2.2"
type: dragdrop
caseStudy: ai200-cs4a-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You are writing the `CREATE TABLE` statement of complaint_history.

    You need to meet the complaint history requirement. Which data type should you use for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez l'instruction `CREATE TABLE` de complaint_history.

    Vous devez satisfaire l'exigence relative à l'historique des réclamations. Quel type de données devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correctes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vec1536, text: "vector(1536)" }
    - { id: vecnodim, text: "vector" }
    - { id: jsonb, text: "jsonb" }
    - { id: json, text: "json" }
    - { id: tstz, text: "timestamptz" }
    - { id: ts, text: "timestamp" }
  targets:
    - { id: embedding, text: "embedding" }
    - { id: attributes, text: "attributes" }
    - { id: received, text: "received_at" }
answer:
  mapping: { embedding: vec1536, attributes: jsonb, received: tstz }
explanation:
  correct:
    en: "`vector(1536)` stores the embedding at full precision with its dimension declared, which pgvector needs to build an IVFFlat or HNSW index. `jsonb` stores the variable product details in a binary form that supports the `@>` operator and GIN indexes. `timestamptz` stores an absolute instant, so the same value is shown correctly whatever the time zone of the session."
    fr: "`vector(1536)` stocke l'incorporation en pleine précision avec sa dimension déclarée, ce dont pgvector a besoin pour générer un index IVFFlat ou HNSW. `jsonb` stocke les détails variables du produit sous une forme binaire qui prend en charge l'opérateur `@>` et les index GIN. `timestamptz` stocke un instant absolu : la même valeur s'affiche correctement quel que soit le fuseau horaire de la session."
  options:
    vecnodim: { en: "A `vector` column without a dimension accepts the data but can't be indexed: the index build fails with `column does not have dimensions`.", fr: "Une colonne `vector` sans dimension accepte les données mais ne peut pas être indexée : la génération de l'index échoue avec `column does not have dimensions`." }
    json: { en: "`json` keeps the text as is and has no default GIN operator class, so it doesn't meet the GIN index requirement.", fr: "`json` conserve le texte tel quel et n'a pas de classe d'opérateurs GIN par défaut : il ne satisfait pas l'exigence d'index GIN." }
    ts: { en: "`timestamp` has no time zone: the same value means different instants for branches in different time zones.", fr: "`timestamp` n'a pas de fuseau horaire : la même valeur désigne des instants différents pour des agences situées dans des fuseaux horaires différents." }
references:
  - title: Vector Search in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgvector
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
