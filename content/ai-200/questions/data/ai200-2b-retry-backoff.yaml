id: ai200-2b-retry-backoff
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's chat API opens connections to an Azure Database for PostgreSQL flexible server from Python. During platform maintenance, attempts to open a connection sometimes fail for a few seconds.

    You need to implement the retry pattern that Microsoft recommends for transient connection errors.

    What should the API do when opening a connection fails?
  fr: |
    L'API de conversation de Fabrikam ouvre des connexions vers un serveur flexible Azure Database for PostgreSQL depuis Python. Pendant la maintenance de la plateforme, les tentatives d'ouverture de connexion échouent parfois pendant quelques secondes.

    Vous devez implémenter le modèle de nouvelles tentatives que Microsoft recommande pour les erreurs de connexion temporaires.

    Que doit faire l'API quand l'ouverture d'une connexion échoue ?
body:
  options:
    - { id: a, text: { en: "Retry at once, then every second, until the connection opens.", fr: "Réessayer immédiatement, puis toutes les secondes, jusqu'à l'ouverture de la connexion." } }
    - { id: b, text: { en: "Wait 60 seconds before each retry, without a maximum number of retries.", fr: "Attendre 60 secondes avant chaque tentative, sans nombre maximal de tentatives." } }
    - { id: c, text: { en: "Wait 5 seconds, then increase the wait exponentially up to 60 seconds, with a retry limit.", fr: "Attendre 5 secondes, puis augmenter l'attente de façon exponentielle jusqu'à 60 secondes, avec une limite de tentatives." } }
    - { id: d, text: { en: "Return an error at once and let the user send the request again.", fr: "Renvoyer immédiatement une erreur et laisser l'utilisateur renvoyer la requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Learn recommends waiting 5 seconds before the first retry, increasing the wait exponentially up to 60 seconds for the following retries, and setting a maximum number of retries after which the operation is considered failed. Most transient events are mitigated in less than 60 seconds."
    fr: "Learn recommande d'attendre 5 secondes avant la première tentative, d'augmenter l'attente de façon exponentielle jusqu'à 60 secondes pour les tentatives suivantes, et de fixer un nombre maximal de tentatives au-delà duquel l'opération est considérée comme ayant échoué. La plupart des événements temporaires sont résolus en moins de 60 secondes."
  options:
    a:
      en: "Retrying without backing off adds load while the system recovers, and never gives up."
      fr: "Réessayer sans temporisation ajoute de la charge pendant la récupération du système, et n'abandonne jamais."
    b:
      en: "A fixed 60-second wait delays every recovery, and the absence of a limit means the operation never fails cleanly."
      fr: "Une attente fixe de 60 secondes retarde chaque récupération, et l'absence de limite signifie que l'opération n'échoue jamais proprement."
    d:
      en: "Transient errors resolve themselves; the application is expected to retry instead of surfacing them to users."
      fr: "Les erreurs temporaires se résolvent d'elles-mêmes ; l'application doit réessayer au lieu de les présenter aux utilisateurs."
references:
  - title: Handle Transient Connectivity Errors
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-connectivity
