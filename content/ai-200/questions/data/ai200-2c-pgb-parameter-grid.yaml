id: ai200-2c-pgb-parameter-grid
objective: "2.2.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Coho Winery's sommelier assistant connects through the built-in PgBouncer to an Azure Database for PostgreSQL flexible server. All the requests use the `rag-api` user and the `kb` database. The PgBouncer server parameters are shown in the following table.

    Answer each prompt by selecting the parameter that causes the behavior.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant sommelier de Coho Winery se connecte par le PgBouncer intégré à un serveur flexible Azure Database for PostgreSQL. Toutes les requêtes utilisent l'utilisateur `rag-api` et la base de données `kb`. Les paramètres de serveur PgBouncer figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre qui provoque le comportement.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "A transaction that runs an `INSERT` and then an `UPDATE` fails through port 6432."
        fr: "Une transaction qui exécute un `INSERT` puis un `UPDATE` échoue par le port 6432."
    - id: p2
      text:
        en: "During peaks, no more than 50 statements run on the server at the same time, and the other clients wait."
        fr: "Pendant les pics, 50 instructions au plus s'exécutent en même temps sur le serveur, et les autres clients attendent."
  grid:
    header: [{ en: Parameter, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: pgbouncer.enabled, area: enabled }, { text: "true" }]
      - [{ text: pgbouncer.pool_mode, area: mode }, { text: statement }]
      - [{ text: pgbouncer.default_pool_size, area: poolsize }, { text: "50" }]
      - [{ text: pgbouncer.max_client_conn, area: maxclient }, { text: "5000" }]
      - [{ text: pgbouncer.max_prepared_statements, area: prepared }, { text: "0" }]
      - [{ text: pgbouncer.query_wait_timeout, area: wait }, { text: "120" }]
answer:
  values: { p1: mode, p2: poolsize }
explanation:
  correct:
    en: |
      In `statement` pool mode, the server connection returns to the pool after each statement, so multi-statement transactions aren't supported; the default `transaction` mode keeps the connection for the whole transaction. `pgbouncer.default_pool_size` limits the server connections of each user and database pair, so with a single pair, at most 50 statements run at once while the other clients queue. `max_client_conn` (5,000) limits the clients, not the server connections.
    fr: |
      En mode de pool `statement`, la connexion au serveur revient au pool après chaque instruction : les transactions à plusieurs instructions ne sont pas prises en charge ; le mode `transaction` par défaut conserve la connexion pendant toute la transaction. `pgbouncer.default_pool_size` limite les connexions au serveur de chaque paire utilisateur et base de données : avec une seule paire, 50 instructions au plus s'exécutent en même temps tandis que les autres clients patientent. `max_client_conn` (5 000) limite les clients, pas les connexions au serveur.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
  - title: Connection Pooling Strategy Using PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-connection-pooling-best-practices
