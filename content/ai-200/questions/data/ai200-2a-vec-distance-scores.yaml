id: ai200-2a-vec-distance-scores
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs vector similarity queries in Azure Cosmos DB for NoSQL with `VectorDistance` and returns the value as `SimilarityScore`. Some containers use the `cosine` distance function, others use `euclidean`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute des requêtes de similarité vectorielle dans Azure Cosmos DB for NoSQL avec `VectorDistance` et renvoie la valeur sous le nom `SimilarityScore`. Certains conteneurs utilisent la fonction de distance `cosine`, d'autres `euclidean`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With the cosine distance function, an item with a SimilarityScore of 0.92 is more similar to the query than an item with 0.35."
        fr: "Avec la fonction de distance cosine, un élément dont le SimilarityScore vaut 0,92 est plus similaire à la requête qu'un élément à 0,35."
    - id: s2
      text:
        en: "With the euclidean distance function, a higher SimilarityScore means a more similar item."
        fr: "Avec la fonction de distance euclidean, un SimilarityScore plus élevé signifie un élément plus similaire."
    - id: s3
      text:
        en: "A search that uses a quantizedFlat index always returns the exact nearest neighbors."
        fr: "Une recherche qui utilise un index quantizedFlat renvoie toujours les plus proches voisins exacts."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Cosine values range from -1 (least similar) to +1 (most similar), so 0.92 is closer. Euclidean distances range from 0 (most similar) upward, so a lower value is better. quantizedFlat is a brute-force search over quantized vectors, so its accuracy can be slightly below 100%; only flat guarantees exact recall."
    fr: "Les valeurs cosine vont de -1 (le moins similaire) à +1 (le plus similaire) : 0,92 est donc plus proche. Les distances euclidean partent de 0 (le plus similaire) vers le haut : une valeur plus faible est meilleure. quantizedFlat est une recherche par force brute sur des vecteurs quantifiés : sa précision peut être légèrement inférieure à 100 % ; seul flat garantit un rappel exact."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
