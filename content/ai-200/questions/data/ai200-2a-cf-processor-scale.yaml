id: ai200-2a-cf-processor-scale
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a .NET service that uses the change feed processor to send new transactions of an Azure Cosmos DB for NoSQL container to a fraud-scoring model. One instance can't keep up, so you deploy the service to four pods in Azure Kubernetes Service (AKS).

    You need the four pods to share the processing of the change feed, with each change handled by one pod.

    Which two configurations should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute un service .NET qui utilise le processeur de flux de modification pour envoyer les nouvelles transactions d'un conteneur Azure Cosmos DB for NoSQL à un modèle d'évaluation de la fraude. Une seule instance ne suit pas, vous déployez donc le service sur quatre pods dans Azure Kubernetes Service (AKS).

    Vous devez faire en sorte que les quatre pods se partagent le traitement du flux de modification, chaque modification étant traitée par un seul pod.

    Quelles sont les deux configurations à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The same processor name and the same lease container on every pod", fr: "Le même nom de processeur et le même conteneur de baux sur chaque pod" } }
    - { id: b, text: { en: "A different instance name on every pod", fr: "Un nom d'instance différent sur chaque pod" } }
    - { id: c, text: { en: "The same instance name on every pod", fr: "Le même nom d'instance sur chaque pod" } }
    - { id: d, text: { en: "A separate lease container for every pod", fr: "Un conteneur de baux distinct pour chaque pod" } }
    - { id: e, text: { en: "A different processor name on every pod", fr: "Un nom de processeur différent sur chaque pod" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Instances that share the processor name and the lease container configuration form one deployment unit, and the processor distributes the leases among them. Each instance of the unit needs a unique instance name. Running more instances than leases leaves some of them idle."
    fr: "Les instances qui partagent le nom de processeur et la configuration du conteneur de baux forment une unité de déploiement, et le processeur répartit les baux entre elles. Chaque instance de l'unité a besoin d'un nom d'instance unique. Exécuter plus d'instances que de baux en laisse certaines inactives."
  options:
    c: { en: "Instance names must be unique within a deployment unit.", fr: "Les noms d'instance doivent être uniques dans une unité de déploiement." }
    d: { en: "Separate lease containers create independent processors: every pod would process every change.", fr: "Des conteneurs de baux distincts créent des processeurs indépendants : chaque pod traiterait chaque modification." }
    e: { en: "Different processor names also create independent deployment units, so each change would be processed four times.", fr: "Des noms de processeur différents créent aussi des unités de déploiement indépendantes : chaque modification serait traitée quatre fois." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/change-feed-processor
