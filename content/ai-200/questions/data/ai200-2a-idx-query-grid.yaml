id: ai200-2a-idx-query-grid
objective: "2.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a container in Azure Cosmos DB for NoSQL that stores support conversations for an AI assistant. Its indexing policy includes `/*`, excludes `/text/?` and defines no composite index. The developers plan the queries shown in the following table.

    Answer each prompt by selecting the appropriate query.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un conteneur Azure Cosmos DB for NoSQL qui stocke les conversations de support d'un assistant IA. Sa stratégie d'indexation inclut `/*`, exclut `/text/?` et ne définit aucun index composite. Les développeurs prévoient les requêtes du tableau suivant.

    Répondez à chaque consigne en sélectionnant la requête appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The query that fails until you add a composite index", fr: "La requête qui échoue tant que vous n'ajoutez pas d'index composite" } }
    - { id: p2, text: { en: "The query whose filter can't be served by the index", fr: "La requête dont le filtre ne peut pas être servi par l'index" } }
  grid:
    header: [ { en: "Name", fr: "Nom" }, { en: "Query", fr: "Requête" } ]
    rows:
      - [ { text: Q1 }, { text: "SELECT * FROM c WHERE c.tenantId = 'contoso' ORDER BY c.updatedAt DESC", area: q1 } ]
      - [ { text: Q2 }, { text: "SELECT * FROM c ORDER BY c.tenantId ASC, c.updatedAt DESC", area: q2 } ]
      - [ { text: Q3 }, { text: "SELECT * FROM c WHERE CONTAINS(c.text, 'refund')", area: q3 } ]
      - [ { text: Q4 }, { text: "SELECT VALUE COUNT(1) FROM c WHERE c.lang = 'fr'", area: q4 } ]
      - [ { text: Q5 }, { text: "SELECT * FROM c WHERE c.id = 'conv-42'", area: q5 } ]
answer:
  values: { p1: q2, p2: q3 }
explanation:
  correct:
    en: "An ORDER BY on two or more properties requires a composite index, so Q2 fails until one is defined; a single-property ORDER BY such as Q1 uses the range index. Q3 filters on `text`, whose path is excluded, so the filter can't use the index and the query scans items at a much higher RU charge."
    fr: "Un ORDER BY sur deux propriétés ou plus exige un index composite : Q2 échoue tant qu'aucun n'est défini ; un ORDER BY sur une seule propriété, comme Q1, utilise l'index de plage. Q3 filtre sur `text`, dont le chemin est exclu : le filtre ne peut pas utiliser l'index et la requête analyse les éléments pour une consommation de RU bien plus élevée."
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
