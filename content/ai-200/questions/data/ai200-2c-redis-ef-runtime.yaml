id: ai200-2c-redis-ef-runtime
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. runs product search on an Azure Managed Redis index that contains 12 million embeddings in an HNSW vector field. The application runs the following query.

    ```python
    Query("*=>[KNN 10 @embedding $vec AS score]").sort_by("score").dialect(2)
    ```

    Testers report that relevant products are sometimes missing from the ten results. You need to improve the accuracy of this query. The index must not be rebuilt.

    What should you do?
  fr: |
    Proseware, Inc. exécute une recherche de produits sur un index Azure Managed Redis qui contient 12 millions d'incorporations dans un champ vectoriel HNSW. L'application exécute la requête suivante.

    ```python
    Query("*=>[KNN 10 @embedding $vec AS score]").sort_by("score").dialect(2)
    ```

    Des testeurs signalent que des produits pertinents manquent parfois dans les dix résultats. Vous devez améliorer la précision de cette requête. L'index ne doit pas être reconstruit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add `.paging(0, 10)` to the query."
        fr: "Ajouter `.paging(0, 10)` à la requête."
    - id: b
      text:
        en: "Re-create the vector field with a higher `M` value."
        fr: "Recréer le champ vectoriel avec une valeur `M` plus élevée."
    - id: c
      text:
        en: "Add `EF_RUNTIME 150` to the KNN clause of the query."
        fr: "Ajouter `EF_RUNTIME 150` à la clause KNN de la requête."
    - id: d
      text:
        en: "Re-create the vector field with the FLAT algorithm."
        fr: "Recréer le champ vectoriel avec l'algorithme FLAT."
answer: { optionId: c }
explanation:
  correct:
    en: |
      HNSW is approximate: `EF_RUNTIME` sets the number of candidates kept during the graph search at query time. A higher value, such as `[KNN 10 @embedding $vec EF_RUNTIME 150 AS score]`, explores more of the graph and improves accuracy at the cost of latency, without changing the index.
    fr: |
      HNSW est approximatif : `EF_RUNTIME` définit le nombre de candidats conservés pendant la recherche dans le graphe, au moment de la requête. Une valeur plus élevée, comme `[KNN 10 @embedding $vec EF_RUNTIME 150 AS score]`, explore une plus grande partie du graphe et améliore la précision au prix de la latence, sans modifier l'index.
  options:
    a:
      en: |
        Paging controls which results are returned, not how many candidates the HNSW search explores.
      fr: |
        La pagination contrôle quels résultats sont renvoyés, pas le nombre de candidats que la recherche HNSW explore.
    b:
      en: |
        `M` is a build-time parameter; changing it means rebuilding the index.
      fr: |
        `M` est un paramètre de construction ; le modifier implique de reconstruire l'index.
    d:
      en: |
        FLAT is exact but requires a new index and is slow on 12 million vectors.
      fr: |
        FLAT est exact mais exige un nouvel index et se montre lent sur 12 millions de vecteurs.
references:
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
