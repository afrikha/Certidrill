id: ai200-2b-partition-range
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware stores 80 million user interaction embeddings in a table on Azure Database for PostgreSQL. Every recommendation query filters on a range of the created_at column that covers the last few months. Each month, a job deletes the interactions that are older than 24 months; the DELETE runs for hours and leaves dead rows that slow down the table.

    You need to redesign the table so that queries read only the relevant data and old data can be removed quickly.

    What should you do?
  fr: |
    Proseware stocke 80 millions d'incorporations d'interactions utilisateur dans une table sur Azure Database for PostgreSQL. Chaque requête de recommandation filtre sur une plage de la colonne created_at qui couvre les derniers mois. Chaque mois, un travail supprime les interactions de plus de 24 mois ; le DELETE dure des heures et laisse des lignes mortes qui ralentissent la table.

    Vous devez revoir la conception de la table pour que les requêtes ne lisent que les données pertinentes et que les anciennes données puissent être supprimées rapidement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Partition the table by hash on user_id, and keep the monthly DELETE job.", fr: "Partitionner la table par hachage sur user_id et conserver le travail DELETE mensuel." } }
    - { id: b, text: { en: "Create one partial vector index per month, and drop the oldest index each month.", fr: "Créer un index vectoriel partiel par mois et supprimer l'index le plus ancien chaque mois." } }
    - { id: c, text: { en: "Partition the table by list on interaction_type, and drop the oldest rows each month.", fr: "Partitionner la table par liste sur interaction_type et supprimer les lignes les plus anciennes chaque mois." } }
    - { id: d, text: { en: "Partition the table by range on created_at with monthly partitions, and drop the oldest partition.", fr: "Partitionner la table par plage sur created_at avec des partitions mensuelles et supprimer la partition la plus ancienne." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Learn recommends partitioning when a table has tens of millions of rows, queries filter on the partition key such as a date, and old data must be dropped efficiently. With monthly range partitions on created_at, partition pruning limits each query to the relevant months, and removing a month is a quick partition drop instead of a long DELETE."
    fr: "Learn recommande le partitionnement quand une table compte des dizaines de millions de lignes, que les requêtes filtrent sur la clé de partition comme une date et que les anciennes données doivent être supprimées efficacement. Avec des partitions mensuelles par plage sur created_at, l'élimination de partitions limite chaque requête aux mois pertinents, et la suppression d'un mois est une suppression rapide de partition au lieu d'un long DELETE."
  options:
    a:
      en: "Hash partitions on user_id do not match the date filter, so every query reads every partition, and the slow DELETE remains."
      fr: "Des partitions par hachage sur user_id ne correspondent pas au filtre de date : chaque requête lit toutes les partitions, et le DELETE lent subsiste."
    b:
      en: "Dropping an index does not delete any rows, so the table keeps growing and the deletion problem is not solved."
      fr: "Supprimer un index ne supprime aucune ligne : la table continue de grossir et le problème de suppression n'est pas résolu."
    c:
      en: "List partitions on interaction_type do not follow the dates, so old rows are spread across all partitions."
      fr: "Des partitions par liste sur interaction_type ne suivent pas les dates : les anciennes lignes sont réparties dans toutes les partitions."
references:
