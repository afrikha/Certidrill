id: ai200-2b-bulk-load
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum loads 50,000 document chunks and their embeddings into an Azure Database for PostgreSQL flexible server from a Python job that uses psycopg. The job currently runs one `INSERT` statement per row and commits after each row, and the load takes too long.

    You need to reduce the number of round trips to the server during the load.

    Which two changes should you make? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum charge 50 000 segments de documents et leurs incorporations dans un serveur flexible Azure Database for PostgreSQL depuis un travail Python qui utilise psycopg. Le travail exécute actuellement une instruction `INSERT` par ligne et valide après chaque ligne, et le chargement est trop long.

    Vous devez réduire le nombre d'allers-retours vers le serveur pendant le chargement.

    Quelles sont les deux modifications à apporter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Open a new connection for each row so that the inserts run in parallel.", fr: "Ouvrir une nouvelle connexion pour chaque ligne afin que les insertions s'exécutent en parallèle." } }
    - { id: b, text: { en: "Send the rows in batches with one multi-row `INSERT ... VALUES (...), (...)` statement per batch.", fr: "Envoyer les lignes par lots avec une instruction `INSERT ... VALUES (...), (...)` multiligne par lot." } }
    - { id: c, text: { en: "Create the HNSW index on the embedding column before the load starts.", fr: "Créer l'index HNSW sur la colonne d'incorporations avant le début du chargement." } }
    - { id: d, text: { en: "Stream the rows with a `COPY ... FROM STDIN` statement through `cursor.copy()`.", fr: "Transmettre les lignes en flux avec une instruction `COPY ... FROM STDIN` via `cursor.copy()`." } }
    - { id: e, text: { en: "Call `cursor.fetchall()` after each insert to release the server resources.", fr: "Appeler `cursor.fetchall()` après chaque insertion pour libérer les ressources du serveur." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Learn recommends multi-row inserts or `COPY` for large loads of embeddings. A multi-row `INSERT` sends many rows per statement, and `COPY ... FROM STDIN` streams all the rows in one operation; both remove the per-row round trip and per-row commit."
    fr: "Learn recommande les insertions multilignes ou `COPY` pour les chargements volumineux d'incorporations. Un `INSERT` multiligne envoie de nombreuses lignes par instruction, et `COPY ... FROM STDIN` transmet toutes les lignes en flux en une seule opération ; les deux suppriment l'aller-retour et la validation par ligne."
  options:
    a:
      en: "Opening a connection per row adds a connection handshake and authentication to every row, which is slower and consumes server connections."
      fr: "Ouvrir une connexion par ligne ajoute une négociation de connexion et une authentification à chaque ligne, ce qui est plus lent et consomme des connexions du serveur."
    c:
      en: "An existing index must be updated for every inserted row; Learn recommends loading the data before creating the vector index."
      fr: "Un index existant doit être mis à jour à chaque ligne insérée ; Learn recommande de charger les données avant de créer l'index vectoriel."
    e:
      en: "INSERT returns no rows; fetching after each statement adds nothing and does not reduce round trips."
      fr: "INSERT ne renvoie aucune ligne ; lire après chaque instruction n'apporte rien et ne réduit pas les allers-retours."
references:
  - title: Store and query embeddings with pgvector
    url: https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/2-store-query-embeddings-pgvector
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
