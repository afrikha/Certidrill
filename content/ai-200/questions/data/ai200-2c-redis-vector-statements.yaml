id: ai200-2c-redis-vector-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure Managed Redis with the RediSearch module for a document search assistant. An index named `idx:docs` covers hashes whose keys start with `doc:` and has an HNSW vector field that uses the COSINE metric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Azure Managed Redis avec le module RediSearch pour un assistant de recherche documentaire. Un index nommé `idx:docs` couvre les hachages dont les clés commencent par `doc:` et possède un champ vectoriel HNSW qui utilise la métrique COSINE.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A hash written under the key `doc:5120` after the index is created is added to `idx:docs` without another command."
        fr: "Un hachage écrit sous la clé `doc:5120` après la création de l'index est ajouté à `idx:docs` sans autre commande."
    - id: s2
      text:
        en: "In the results of a KNN query on the index, a higher `score` means a more similar document."
        fr: "Dans les résultats d'une requête KNN sur l'index, un `score` plus élevé signifie un document plus similaire."
    - id: s3
      text:
        en: "An Azure Managed Redis instance that uses active geo-replication can use the RediSearch module."
        fr: "Une instance Azure Managed Redis qui utilise la géoréplication active peut utiliser le module RediSearch."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An index follows every key whose name starts with one of its prefixes, so new or updated hashes under `doc:` are indexed automatically. With the COSINE metric, the KNN score is a distance where 0 means identical, so lower is more similar. RediSearch and RedisJSON are the only modules that can be used with active geo-replication.
    fr: |
      Un index suit toutes les clés dont le nom commence par l'un de ses préfixes : les hachages nouveaux ou mis à jour sous `doc:` sont indexés automatiquement. Avec la métrique COSINE, le score KNN est une distance où 0 signifie identique : plus il est faible, plus le document est similaire. RediSearch et RedisJSON sont les seuls modules utilisables avec la géoréplication active.
references:
  - title: Using Redis modules with Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/redis-modules
  - title: About Vector Embeddings and Vector Search in Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/overview-vector-similarity
