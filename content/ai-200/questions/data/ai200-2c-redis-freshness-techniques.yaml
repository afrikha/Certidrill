id: ai200-2c-redis-freshness-techniques
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Margie's Travel caches three kinds of data in Azure Managed Redis for a travel assistant. Each kind has a freshness requirement, shown in the answer area.

    Which caching technique should you use for each kind of data? To answer, drag the appropriate techniques to the correct data. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Margie's Travel met en cache trois types de données dans Azure Managed Redis pour un assistant de voyage. Chaque type a une exigence de fraîcheur, indiquée dans la zone de réponse.

    Quelle technique de mise en cache devez-vous utiliser pour chaque type de données ? Pour répondre, faites glisser les techniques appropriées vers les données correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ttl60, text: { en: "Write the entry with a 60-second TTL.", fr: "Écrire l'entrée avec une durée de vie de 60 secondes." } }
    - { id: delete, text: { en: "Delete the entry right after the database write.", fr: "Supprimer l'entrée juste après l'écriture en base de données." } }
    - { id: renew, text: { en: "Renew the TTL with EXPIRE on each request.", fr: "Renouveler la durée de vie avec EXPIRE à chaque requête." } }
    - { id: persist, text: { en: "Remove the TTL with PERSIST.", fr: "Supprimer la durée de vie avec PERSIST." } }
    - { id: ttl24h, text: { en: "Write the entry with a 24-hour TTL.", fr: "Écrire l'entrée avec une durée de vie de 24 heures." } }
  targets:
    - id: rates
      text: { en: "Exchange rates refreshed by a provider every minute; answers may use rates up to one minute old.", fr: "Taux de change actualisés par un fournisseur toutes les minutes ; les réponses peuvent utiliser des taux datant d'une minute au plus." }
    - id: hotels
      text: { en: "Hotel descriptions edited in the catalog database; travelers must see an edit as soon as it is saved.", fr: "Descriptions d'hôtels modifiées dans la base de données du catalogue ; les voyageurs doivent voir une modification dès son enregistrement." }
    - id: sessions
      text: { en: "Chat sessions that must expire after 20 minutes without activity.", fr: "Sessions de conversation qui doivent expirer après 20 minutes d'inactivité." }
answer:
  mapping: { rates: ttl60, hotels: delete, sessions: renew }
explanation:
  correct:
    en: |
      A TTL matched to the tolerated staleness is enough when data may be slightly old, so a 60-second TTL suits the exchange rates. When readers must see a change immediately, the code that writes to the database invalidates the entry right after the write. A sliding expiration renews the TTL on each request, so the session expires only after 20 minutes without activity.
    fr: |
      Une durée de vie adaptée à l'obsolescence tolérée suffit quand les données peuvent être légèrement anciennes : une durée de vie de 60 secondes convient aux taux de change. Quand les lecteurs doivent voir une modification immédiatement, le code qui écrit dans la base de données invalide l'entrée juste après l'écriture. Une expiration glissante renouvelle la durée de vie à chaque requête : la session n'expire qu'après 20 minutes d'inactivité.
  options:
    persist:
      en: |
        Without a TTL, an entry stays until it is deleted, which meets none of the freshness requirements.
      fr: |
        Sans durée de vie, une entrée reste jusqu'à sa suppression, ce qui ne respecte aucune des exigences de fraîcheur.
    ttl24h:
      en: |
        A 24-hour TTL would serve stale rates and descriptions for up to a day.
      fr: |
        Une durée de vie de 24 heures servirait des taux et des descriptions obsolètes pendant une journée au plus.
references:
  - title: Cache-Aside Pattern
    url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
