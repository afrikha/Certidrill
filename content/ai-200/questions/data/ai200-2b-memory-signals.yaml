id: ai200-2b-memory-signals
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs semantic searches on an Azure Database for PostgreSQL flexible server in the General Purpose tier. Search latency has grown as the number of embeddings increased. You review the Azure Monitor metrics and the database statistics.

    Which two observations indicate that the vector working set no longer fits in memory?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute des recherches sémantiques sur un serveur flexible Azure Database for PostgreSQL du niveau General Purpose. La latence de recherche a augmenté avec le nombre d'incorporations. Vous examinez les métriques Azure Monitor et les statistiques de la base de données.

    Quelles sont les deux observations qui indiquent que le jeu de données vectoriel actif ne tient plus en mémoire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Storage IO percent stays high while the searches run.", fr: "Le pourcentage d'E/S de stockage reste élevé pendant les recherches." } }
    - { id: b, text: { en: "Active connections are close to the connection limit.", fr: "Les connexions actives sont proches de la limite de connexions." } }
    - { id: c, text: { en: "The buffer cache hit ratio from `pg_statio_user_tables` is 92 percent.", fr: "Le taux d'accès au cache de tampons calculé avec `pg_statio_user_tables` est de 92 %." } }
    - { id: d, text: { en: "Storage percent has stayed at 40 percent for several weeks.", fr: "Le pourcentage de stockage est resté à 40 % pendant plusieurs semaines." } }
    - { id: e, text: { en: "CPU percent stays below 30 percent during the searches.", fr: "Le pourcentage de processeur reste inférieur à 30 % pendant les recherches." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Learn notes that high Storage IO percent indicates that the data does not fit in the cache, and that a cache hit ratio below 99 percent for vector-heavy workloads suggests that shared buffers, and therefore memory, are too small. Both point to more memory, for example the Memory Optimized tier."
    fr: "Learn indique qu'un pourcentage d'E/S de stockage élevé signale que les données ne tiennent pas dans le cache, et qu'un taux d'accès au cache inférieur à 99 % pour les charges de travail vectorielles suggère que les tampons partagés, donc la mémoire, sont trop petits. Les deux mènent à plus de mémoire, par exemple le niveau Memory Optimized."
  options:
    b:
      en: "Connections close to the limit point to a need for connection pooling, not to a lack of memory for the data."
      fr: "Des connexions proches de la limite indiquent un besoin de regroupement de connexions, pas un manque de mémoire pour les données."
    d:
      en: "Storage percent measures disk capacity; 40 percent says nothing about the cache."
      fr: "Le pourcentage de stockage mesure la capacité du disque ; 40 % ne dit rien du cache."
    e:
      en: "Low CPU shows that the searches are not compute-bound; it does not show memory pressure."
      fr: "Un processeur peu chargé montre que les recherches ne sont pas limitées par le calcul ; il ne montre pas de pression sur la mémoire."
references:
  - title: Tune PostgreSQL for pgvector
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/2-tune-postgresql-pgvector
