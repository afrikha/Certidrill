id: ai200-cs2b-embedding-index
objective: "2.2.3"
type: yesno_statements
caseStudy: ai200-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the indexing plan for the papers table on pg-trey.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le plan d'indexation de la table papers sur pg-trey.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The `embedding_large` column can keep storing the 3,072-dimension embeddings.
        fr: La colonne `embedding_large` peut continuer à stocker les incorporations de 3 072 dimensions.
    - id: s2
      text:
        en: You can create an HNSW index on the `embedding_large` column.
        fr: Vous pouvez créer un index HNSW sur la colonne `embedding_large`.
    - id: s3
      text:
        en: A query that orders the rows by `embedding <-> %s` uses an HNSW index created on `embedding` with `vector_cosine_ops`.
        fr: Une requête qui trie les lignes par `embedding <-> %s` utilise un index HNSW créé sur `embedding` avec `vector_cosine_ops`.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      pgvector can store vectors with more than 2,000 dimensions, so `vector(3072)` remains a valid column type. However, an HNSW or IVFFlat index can only be created on a column that has up to 2,000 dimensions; on `embedding_large`, the index creation fails, which is why the shorter `embedding` column is needed. An index is used only by queries whose distance operator matches its operator class: `vector_cosine_ops` serves `<=>` (cosine distance), while `<->` is the Euclidean distance and needs `vector_l2_ops`.
    fr: |
      pgvector peut stocker des vecteurs de plus de 2 000 dimensions : `vector(3072)` reste un type de colonne valide. En revanche, un index HNSW ou IVFFlat ne peut être créé que sur une colonne d'au plus 2 000 dimensions ; sur `embedding_large`, la création de l'index échoue, d'où le besoin de la colonne plus courte `embedding`. Un index n'est utilisé que par les requêtes dont l'opérateur de distance correspond à sa classe d'opérateurs : `vector_cosine_ops` sert `<=>` (distance cosinus), tandis que `<->` est la distance euclidienne et nécessite `vector_l2_ops`.
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/how-to-optimize-performance-pgvector
