id: ai200-2b-probes-all
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin's FAQ search uses an IVFFlat index created `WITH (lists = 1000)` on Azure Database for PostgreSQL. To get the best possible recall, a developer adds `SET ivfflat.probes = 1000;` before each search query.

    Search latency increases sharply, and EXPLAIN shows that the query no longer uses the index.

    Which statement explains this behavior?
  fr: |
    La recherche de FAQ de Tailspin utilise un index IVFFlat créé `WITH (lists = 1000)` sur Azure Database for PostgreSQL. Pour obtenir le meilleur rappel possible, un développeur ajoute `SET ivfflat.probes = 1000;` avant chaque requête de recherche.

    La latence de recherche augmente fortement, et EXPLAIN montre que la requête n'utilise plus l'index.

    Quelle affirmation explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "Probing every list makes the search exact, so the planner does not use the index.", fr: "Sonder toutes les listes rend la recherche exacte : le planificateur n'utilise pas l'index." } }
    - { id: b, text: { en: "Changing probes invalidates the index until it is rebuilt with the new value.", fr: "Modifier probes invalide l'index jusqu'à sa reconstruction avec la nouvelle valeur." } }
    - { id: c, text: { en: "A probes value above 100 is ignored, so the planner falls back to a scan of the table.", fr: "Une valeur de probes supérieure à 100 est ignorée : le planificateur revient à une analyse de la table." } }
    - { id: d, text: { en: "probes applies to HNSW indexes, so the IVFFlat index stops being used.", fr: "probes s'applique aux index HNSW : l'index IVFFlat n'est plus utilisé." } }
answer: { optionId: a }
explanation:
  correct:
    en: "`ivfflat.probes` sets how many lists are searched. When it equals the number of lists, every list is searched, the search becomes exact, and the planner does not use the index. Learn suggests starting with `lists / 10` probes for tables up to one million rows and adjusting from measured recall."
    fr: "`ivfflat.probes` définit le nombre de listes parcourues. Quand il est égal au nombre de listes, toutes les listes sont parcourues, la recherche devient exacte et le planificateur n'utilise pas l'index. Learn suggère de commencer avec `lists / 10` sondes pour les tables jusqu'à un million de lignes et d'ajuster selon le rappel mesuré."
  options:
    c:
      en: "There is no 100-probe cap; the value is applied, and it is its equality with lists that turns the search exact."
      fr: "Il n'y a pas de plafond de 100 sondes ; la valeur est appliquée, et c'est son égalité avec lists qui rend la recherche exacte."
    b:
      en: "probes is a query-time setting; changing it never requires a rebuild."
      fr: "probes est un paramètre de requête ; le modifier n'impose jamais de reconstruction."
    d:
      en: "ivfflat.probes is the query-time setting of IVFFlat; HNSW uses hnsw.ef_search."
      fr: "ivfflat.probes est le paramètre de requête d'IVFFlat ; HNSW utilise hnsw.ef_search."
references:
  - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
