id: ai200-sr1-search-capacity-3
objective: "2.2.4"
type: series_yesno
series: ai200-sr1-search-capacity
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You increase the storage size of the server.
  fr: Vous augmentez la taille de stockage du serveur.
body:
  solution:
    en: |
      You increase the storage size of pg-northwind-rag from 512 GiB to 2 TiB. You keep the Memory Optimized tier with 8 vCores.
    fr: |
      Vous augmentez la taille de stockage de pg-northwind-rag de 512 Gio à 2 Tio. Vous conservez le niveau Memory Optimized avec 8 vCores.
answer: { value: false }
explanation:
  correct:
    en: Storage IO percent and Memory percent are below 50 percent, so neither storage nor memory limits the searches; the bottleneck is the CPU used by the vector similarity queries. More storage does not add vCores, so the query capacity stays the same.
    fr: "Le pourcentage d'E/S de stockage et le pourcentage de mémoire sont sous 50 % : ni le stockage ni la mémoire ne limitent les recherches, le goulot d'étranglement est le processeur utilisé par les requêtes de similarité vectorielle. Davantage de stockage n'ajoute aucun vCore : la capacité de requête reste la même."
references:
  - title: Read replicas in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-read-replicas
