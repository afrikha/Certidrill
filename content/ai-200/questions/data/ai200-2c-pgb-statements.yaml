id: ai200-2c-pgb-statements
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wide World Importers uses the built-in PgBouncer of an Azure Database for PostgreSQL flexible server on the Memory Optimized tier. The server has zone-redundant high availability, and the application signs in with Microsoft Entra ID.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers utilise le PgBouncer intégré d'un serveur flexible Azure Database for PostgreSQL du niveau Memory Optimized. Le serveur dispose de la haute disponibilité redondante interzone, et l'application se connecte avec Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After a compute scale operation, the application must re-establish its connections to PgBouncer."
        fr: "Après une opération de mise à l'échelle du calcul, l'application doit rétablir ses connexions à PgBouncer."
    - id: s2
      text:
        en: "After a high availability failover, the application must change the host name in its connection string to reach PgBouncer on the new primary."
        fr: "Après un basculement de haute disponibilité, l'application doit modifier le nom d'hôte de sa chaîne de connexion pour atteindre PgBouncer sur le nouveau serveur principal."
    - id: s3
      text:
        en: "The application can keep using Microsoft Entra authentication when it connects through PgBouncer."
        fr: "L'application peut continuer à utiliser l'authentification Microsoft Entra quand elle se connecte par PgBouncer."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A scale operation, a failover or a restart also restarts PgBouncer, so existing connections must be re-established: the application needs retry logic. With zone-redundant high availability, PgBouncer is restarted on the promoted standby and the connection string stays the same. The built-in PgBouncer supports Microsoft Entra authentication.
    fr: |
      Une opération de mise à l'échelle, un basculement ou un redémarrage redémarre aussi PgBouncer : les connexions existantes doivent être rétablies, et l'application a besoin d'une logique de nouvelle tentative. Avec la haute disponibilité redondante interzone, PgBouncer redémarre sur le serveur de secours promu, et la chaîne de connexion reste la même. Le PgBouncer intégré prend en charge l'authentification Microsoft Entra.
references:
  - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-pgbouncer
