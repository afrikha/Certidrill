id: ai200-cs3c-semantic-index
objective: "2.3.2"
type: multi
caseStudy: ai200-cs3c-vanarsdel
difficulty: 3
status: draft
stem:
  en: |
    You need to prepare amr-vanarsdel for the semantic cache requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez préparer amr-vanarsdel pour l'exigence relative au cache sémantique.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create amr-vanarsdel with the RediSearch module and the Enterprise clustering policy.", fr: "Créer amr-vanarsdel avec le module RediSearch et la stratégie de clustering Enterprise." } }
    - { id: b, text: { en: "Create amr-vanarsdel with the RediSearch module and the OSS clustering policy.", fr: "Créer amr-vanarsdel avec le module RediSearch et la stratégie de clustering OSS." } }
    - { id: c, text: { en: "Create amr-vanarsdel with the RedisJSON module only.", fr: "Créer amr-vanarsdel avec uniquement le module RedisJSON." } }
    - { id: d, text: "FT.CREATE idx:answers ON HASH PREFIX 1 answer: SCHEMA question TEXT embedding VECTOR HNSW 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE" }
    - { id: e, text: "FT.CREATE idx:answers ON JSON PREFIX 1 answer: SCHEMA $.question AS question TEXT $.embedding AS embedding VECTOR HNSW 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Vector similarity search in Azure Managed Redis comes from the RediSearch module, which must be added when the instance is created and supports the Enterprise and non-clustered policies, not the OSS policy. The index is then created with FT.CREATE on the hashes whose keys start with `answer:`, with a VECTOR field that declares the FLOAT32 type, the 1,536 dimensions and the COSINE distance metric.
    fr: |
      La recherche de similarité vectorielle dans Azure Managed Redis est fournie par le module RediSearch, qui doit être ajouté à la création de l'instance et qui prend en charge les stratégies Enterprise et sans cluster, pas la stratégie OSS. L'index est ensuite créé avec FT.CREATE sur les hachages dont la clé commence par `answer:`, avec un champ VECTOR qui déclare le type FLOAT32, les 1 536 dimensions et la métrique de distance COSINE.
  options:
    b:
      en: |
        RediSearch does not support the OSS clustering policy.
      fr: |
        RediSearch ne prend pas en charge la stratégie de clustering OSS.
    c:
      en: |
        RedisJSON stores JSON documents but provides no index or vector search; modules cannot be added after creation.
      fr: |
        RedisJSON stocke des documents JSON mais ne fournit ni index ni recherche vectorielle ; les modules ne peuvent pas être ajoutés après la création.
    e:
      en: |
        An index ON JSON covers JSON documents, but the requirement stores the answers as hashes.
      fr: |
        Un index ON JSON couvre des documents JSON, mais l'exigence stocke les réponses sous forme de hachages.
references:
  - title: Use Redis modules with Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/redis-modules
