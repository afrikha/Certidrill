id: ai200-2b-reduce-footprint
objective: "2.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind stores 1,536-dimension embeddings with an HNSW index on an Azure Database for PostgreSQL flexible server. The vector data and the index no longer fit in the server's memory, and the budget does not allow a larger compute size. The search quality team accepts a small loss of recall and a one-time re-embedding of the content.

    Which two actions reduce the memory that the vector workload needs? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind stocke des incorporations de 1 536 dimensions avec un index HNSW sur un serveur flexible Azure Database for PostgreSQL. Les données vectorielles et l'index ne tiennent plus dans la mémoire du serveur, et le budget ne permet pas une taille de calcul supérieure. L'équipe qualité de la recherche accepte une légère perte de rappel et une nouvelle génération ponctuelle des incorporations du contenu.

    Quelles sont les deux actions qui réduisent la mémoire nécessaire à la charge de travail vectorielle ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Rebuild the HNSW index with `m = 32`.", fr: "Reconstruire l'index HNSW avec `m = 32`." } }
    - { id: b, text: { en: "Replace the HNSW index with an IVFFlat index built on the loaded data.", fr: "Remplacer l'index HNSW par un index IVFFlat construit sur les données chargées." } }
    - { id: c, text: { en: "Add a read replica and send half of the searches to it.", fr: "Ajouter un réplica en lecture et lui envoyer la moitié des recherches." } }
    - { id: d, text: { en: "Re-embed the content with a 768-dimension model option, and rebuild the index.", fr: "Générer de nouveau les incorporations du contenu avec une option de modèle à 768 dimensions, puis reconstruire l'index." } }
    - { id: e, text: { en: "Increase the storage size of the server to get more IOPS.", fr: "Augmenter la taille de stockage du serveur pour obtenir plus d'IOPS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An IVFFlat index stores centroids and pointers rather than a graph, so it needs less memory than HNSW, whose graph structure requires significant storage; Learn recommends IVFFlat when HNSW would exceed the available memory and 90-95% recall is acceptable. Lower-dimension embeddings reduce storage and computation proportionally (768 dimensions need about half the space of 1,536), at the cost of some quality."
    fr: "Un index IVFFlat stocke des centroïdes et des pointeurs plutôt qu'un graphe : il demande moins de mémoire que HNSW, dont la structure de graphe occupe un espace important ; Learn recommande IVFFlat quand HNSW dépasserait la mémoire disponible et qu'un rappel de 90 à 95 % est acceptable. Des incorporations de dimension inférieure réduisent proportionnellement le stockage et le calcul (768 dimensions nécessitent environ la moitié de l'espace de 1 536), au prix d'une partie de la qualité."
  options:
    a:
      en: "A larger m adds connections per node, which increases the index memory and build time."
      fr: "Un m plus grand ajoute des connexions par nœud, ce qui augmente la mémoire de l'index et le temps de construction."
    c:
      en: "Each replica holds a full copy of the data and index, so its memory needs are the same as the primary's."
      fr: "Chaque réplica contient une copie complète des données et de l'index : ses besoins en mémoire sont les mêmes que ceux du serveur principal."
    e:
      en: "More IOPS speeds up disk reads but does not reduce the memory needed to keep the index cached."
      fr: "Plus d'IOPS accélère les lectures sur disque, mais ne réduit pas la mémoire nécessaire pour garder l'index en cache."
references:
  - title: Choose and configure vector indexes
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes
  - title: Optimize data layout
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
