id: ai200-2a-vec-model-mismatch
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores 1,536-dimension embeddings of its help articles in Azure Cosmos DB for NoSQL. The embeddings were generated last year with embedding model A. A developer changed the chatbot so that questions are now embedded with a newer model B, which also returns 1,536 dimensions.

    The vector queries still run without errors, but the retrieved articles are no longer related to the questions. You need to restore relevant results.

    What should you do?
  fr: |
    Proseware stocke dans Azure Cosmos DB for NoSQL des incorporations de 1 536 dimensions de ses articles d'aide. Elles ont été générées l'an dernier avec le modèle d'incorporation A. Un développeur a modifié le chatbot pour que les questions soient désormais incorporées avec un modèle B plus récent, qui renvoie lui aussi 1 536 dimensions.

    Les requêtes vectorielles s'exécutent toujours sans erreur, mais les articles récupérés n'ont plus de rapport avec les questions. Vous devez rétablir des résultats pertinents.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Override the distance function to Euclidean in the VectorDistance options.", fr: "Remplacer la fonction de distance par Euclidean dans les options de VectorDistance." } }
    - { id: b, text: { en: "Increase searchListSizeMultiplier in the VectorDistance options.", fr: "Augmenter searchListSizeMultiplier dans les options de VectorDistance." } }
    - { id: c, text: { en: "Regenerate the embeddings of all the articles with model B.", fr: "Régénérer les incorporations de tous les articles avec le modèle B." } }
    - { id: d, text: { en: "Pass true as the third argument of VectorDistance to force an exact search.", fr: "Passer true comme troisième argument de VectorDistance pour forcer une recherche exacte." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Distances are only meaningful between vectors produced by the same embedding model: two models with the same number of dimensions still map text to different vector spaces. Re-embedding the stored articles with model B (or going back to model A for questions) makes the comparison valid again."
    fr: "Les distances n'ont de sens qu'entre des vecteurs produits par le même modèle d'incorporation : deux modèles avec le même nombre de dimensions projettent quand même le texte dans des espaces vectoriels différents. Réincorporer les articles stockés avec le modèle B (ou revenir au modèle A pour les questions) rend la comparaison de nouveau valide."
  options:
    a: { en: "Changing the metric doesn't make vectors from two different models comparable.", fr: "Changer de métrique ne rend pas comparables des vecteurs issus de deux modèles différents." }
    b: { en: "A larger search list improves diskANN recall among comparable vectors; it can't fix incompatible vectors.", fr: "Une liste de recherche plus grande améliore le rappel de diskANN entre vecteurs comparables ; elle ne corrige pas des vecteurs incompatibles." }
    d: { en: "An exact search still compares vectors from different models, so the results stay irrelevant.", fr: "Une recherche exacte compare toujours des vecteurs issus de modèles différents : les résultats restent hors sujet." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
