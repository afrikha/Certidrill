id: ai200-2c-redis-stampede-lock
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation caches product summaries generated by a chat model in Azure Managed Redis. When a popular summary expires, dozens of API instances miss the cache at the same moment and all call the model.

    You decide that an instance must acquire a lock key named `lock:summary:<product ID>` before it regenerates a summary. The solution must meet the following requirements:

    - Only one instance can hold the lock at a time.
    - The lock must disappear automatically after 30 seconds if the instance that holds it crashes.
    - Acquiring the lock must be a single atomic command.

    Which redis-py call should an instance use to acquire the lock?
  fr: |
    Adatum Corporation met en cache dans Azure Managed Redis des résumés de produits générés par un modèle de conversation. Quand un résumé populaire expire, des dizaines d'instances de l'API manquent le cache au même moment et appellent toutes le modèle.

    Vous décidez qu'une instance doit acquérir une clé de verrou nommée `lock:summary:<ID produit>` avant de régénérer un résumé. La solution doit respecter les exigences suivantes :

    - Une seule instance peut détenir le verrou à la fois.
    - Le verrou doit disparaître automatiquement au bout de 30 secondes si l'instance qui le détient s'arrête brutalement.
    - L'acquisition du verrou doit être une seule commande atomique.

    Quel appel redis-py une instance doit-elle utiliser pour acquérir le verrou ?
body:
  options:
    - { id: a, text: "r.set(lock_key, instance_id, nx=True, ex=30)" }
    - { id: b, text: "r.set(lock_key, instance_id, xx=True, ex=30)" }
    - { id: c, text: "r.setnx(lock_key, instance_id) and r.expire(lock_key, 30)" }
    - { id: d, text: "r.set(lock_key, instance_id, ex=30)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With `nx=True`, SET writes the key only if it doesn't exist, so the first instance gets the lock and the others receive `None`. `ex=30` sets the expiration in the same command, so a crashed holder can't leave the lock behind forever.
    fr: |
      Avec `nx=True`, SET n'écrit la clé que si elle n'existe pas : la première instance obtient le verrou et les autres reçoivent `None`. `ex=30` définit l'expiration dans la même commande : un détenteur arrêté brutalement ne peut pas laisser le verrou indéfiniment.
  options:
    b:
      en: |
        `xx=True` writes only if the key already exists, so no instance can acquire a free lock.
      fr: |
        `xx=True` n'écrit que si la clé existe déjà : aucune instance ne peut acquérir un verrou libre.
    c:
      en: |
        These are two commands; if the instance crashes between them, the lock has no expiration and blocks every other instance.
      fr: |
        Il s'agit de deux commandes ; si l'instance s'arrête entre les deux, le verrou n'a pas d'expiration et bloque toutes les autres instances.
    d:
      en: |
        Without `nx`, every instance overwrites the key and believes it holds the lock.
      fr: |
        Sans `nx`, chaque instance écrase la clé et pense détenir le verrou.
references:
  - title: Cache-Aside Pattern
    url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
