id: ai200-2a-vec-settings-map
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is configuring vector search in Azure Cosmos DB for NoSQL for a contract analysis assistant.

    Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum configure la recherche vectorielle dans Azure Cosmos DB for NoSQL pour un assistant d'analyse de contrats.

    Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dims, text: { en: "dimensions in the vector embedding policy", fr: "dimensions dans la stratégie d'incorporation vectorielle" } }
    - { id: dtype, text: { en: "dataType in the vector embedding policy", fr: "dataType dans la stratégie d'incorporation vectorielle" } }
    - { id: dist, text: { en: "distanceFunction in the vector embedding policy", fr: "distanceFunction dans la stratégie d'incorporation vectorielle" } }
    - { id: exact, text: { en: "true as the third argument of VectorDistance", fr: "true comme troisième argument de VectorDistance" } }
    - { id: top, text: { en: "TOP N in the SELECT clause", fr: "TOP N dans la clause SELECT" } }
  targets:
    - { id: t1, text: { en: "Declare the length of the vectors returned by the embedding model", fr: "Déclarer la longueur des vecteurs renvoyés par le modèle d'incorporation" } }
    - { id: t2, text: { en: "Store vectors as int8 values produced by a quantized embedding model", fr: "Stocker les vecteurs sous forme de valeurs int8 produites par un modèle d'incorporation quantifié" } }
    - { id: t3, text: { en: "Run one audit query as an exact brute-force search although a diskANN index exists", fr: "Exécuter une requête d'audit comme une recherche exacte par force brute bien qu'un index diskANN existe" } }
    - { id: t4, text: { en: "Prevent a vector query from returning far more results than needed and consuming extra RUs", fr: "Empêcher une requête vectorielle de renvoyer beaucoup plus de résultats que nécessaire et de consommer des RU supplémentaires" } }
answer:
  mapping: { t1: dims, t2: dtype, t3: exact, t4: top }
explanation:
  correct:
    en: "`dimensions` gives the length of each vector of the path (1,536 by default). `dataType` accepts `float32`, `float16`, `int8` and `uint8`. When the boolean third argument of VectorDistance is true, a brute-force exact search runs instead of using the vector index. Learn requires TOP N in vector queries to avoid returning many more results at a higher RU cost. `distanceFunction` chooses cosine, dot product or euclidean and matches none of the requirements."
    fr: "`dimensions` indique la longueur de chaque vecteur du chemin (1 536 par défaut). `dataType` accepte `float32`, `float16`, `int8` et `uint8`. Quand le troisième argument booléen de VectorDistance vaut true, une recherche exacte par force brute s'exécute au lieu d'utiliser l'index vectoriel. Learn exige TOP N dans les requêtes vectorielles pour éviter de renvoyer beaucoup plus de résultats à un coût en RU plus élevé. `distanceFunction` choisit cosine, dot product ou euclidean et ne correspond à aucune exigence."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
