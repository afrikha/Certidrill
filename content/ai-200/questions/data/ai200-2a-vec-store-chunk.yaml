id: ai200-2a-vec-store-chunk
objective: "2.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container named **chunks**, partitioned on `/tenantId`. Its vector embedding policy declares the path `/embedding`. The function `embed(text)` returns the vector of a text as a list of floats.

    An ingestion job stores each chunk with its vector. When a document is re-ingested, the job must overwrite the chunks that already exist, and create the others.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **chunks**, partitionné sur `/tenantId`. Sa stratégie d'incorporation vectorielle déclare le chemin `/embedding`. La fonction `embed(text)` renvoie le vecteur d'un texte sous forme de liste de nombres à virgule flottante.

    Un travail d'ingestion stocke chaque segment avec son vecteur. Quand un document est réingéré, le travail doit écraser les segments qui existent déjà et créer les autres.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    for n, text in enumerate(split_into_chunks(document)):
        container.[[method]]({
            "id": f"{doc_id}-{n}",
            "tenantId": tenant,
            "text": text,
            [[prop]]: embed(text)
        })
  slots:
    - id: method
      options:
        - { id: upsert, text: upsert_item }
        - { id: create, text: create_item }
        - { id: patch, text: patch_item }
    - id: prop
      options:
        - { id: embedding, text: '"embedding"' }
        - { id: path, text: '"/embedding"' }
        - { id: vectors, text: '"vectorEmbeddings"' }
answer:
  values: { method: upsert, prop: embedding }
explanation:
  correct:
    en: "`upsert_item` creates the item or replaces the existing one with the same ID in the partition, which is what re-ingestion needs. The vector is an ordinary JSON property whose name matches the path declared in the policy: `/embedding` means the top-level property `embedding`."
    fr: "`upsert_item` crée l'élément ou remplace celui qui a le même ID dans la partition, ce dont la réingestion a besoin. Le vecteur est une propriété JSON ordinaire dont le nom correspond au chemin déclaré dans la stratégie : `/embedding` désigne la propriété de premier niveau `embedding`."
  options:
    create: { en: "`create_item` fails when an item with the same ID already exists.", fr: "`create_item` échoue quand un élément de même ID existe déjà." }
    patch: { en: "`patch_item` takes an item ID and a list of operations, and fails if the item doesn't exist.", fr: "`patch_item` prend un ID d'élément et une liste d'opérations, et échoue si l'élément n'existe pas." }
    path: { en: "The leading slash belongs to the policy path syntax, not to the property name in the document.", fr: "La barre oblique initiale appartient à la syntaxe du chemin de la stratégie, pas au nom de la propriété dans le document." }
    vectors: { en: "`vectorEmbeddings` is the list inside the container policy, not a document property.", fr: "`vectorEmbeddings` est la liste contenue dans la stratégie du conteneur, pas une propriété du document." }
references:
  - title: Index and Query Vector Data in Python - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-python-vector-index-query
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy?view=azure-python
