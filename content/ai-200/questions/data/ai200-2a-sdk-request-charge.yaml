id: ai200-2a-sdk-request-charge
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Python service that reads player profiles from an Azure Cosmos DB for NoSQL container by using the `azure-cosmos` SDK. The service calls `container.read_item()` with the item ID and the partition key value.

    You need to log the number of Request Units (RUs) consumed by each read so that the team can size the container's throughput.

    What should you add to the code after each `read_item()` call?
  fr: |
    Tailspin Toys dispose d'un service Python qui lit les profils des joueurs dans un conteneur Azure Cosmos DB for NoSQL à l'aide du SDK `azure-cosmos`. Le service appelle `container.read_item()` avec l'ID de l'élément et la valeur de la clé de partition.

    Vous devez journaliser le nombre d'unités de requête (RU) consommées par chaque lecture pour que l'équipe puisse dimensionner le débit du conteneur.

    Que devez-vous ajouter au code après chaque appel à `read_item()` ?
body:
  options:
    - { id: a, text: 'Pass populate_index_metrics=True to read_item() and log the returned item.' }
    - { id: b, text: 'Read the _ts property of the item returned by read_item().' }
    - { id: c, text: 'Read container.client_connection.last_response_headers["x-ms-session-token"].' }
    - { id: d, text: 'Read container.client_connection.last_response_headers["x-ms-request-charge"].' }
answer: { optionId: d }
explanation:
  correct:
    en: "Every Azure Cosmos DB response carries its RU charge in the `x-ms-request-charge` header. In the Python SDK, `container.client_connection.last_response_headers` exposes the headers of the last operation, so you read that key right after the call."
    fr: "Chaque réponse d'Azure Cosmos DB indique sa consommation de RU dans l'en-tête `x-ms-request-charge`. Dans le SDK Python, `container.client_connection.last_response_headers` expose les en-têtes de la dernière opération : vous lisez cette clé juste après l'appel."
  options:
    a:
      en: "`populate_index_metrics` is a query option that reports index usage; it is not a `read_item()` setting and does not return the RU charge."
      fr: "`populate_index_metrics` est une option de requête qui décrit l'utilisation des index ; ce n'est pas un paramètre de `read_item()` et elle ne renvoie pas la consommation de RU."
    b:
      en: "`_ts` is the last-modified timestamp of the item, not the cost of the operation."
      fr: "`_ts` est l'horodatage de dernière modification de l'élément, pas le coût de l'opération."
    c:
      en: "The session token tracks the version read by the client for Session consistency; it says nothing about RUs."
      fr: "Le jeton de session indique la version lue par le client pour la cohérence Session ; il ne donne aucune information sur les RU."
references:
  - title: Find Request Unit Charge for a SQL Query - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/find-request-unit-charge
