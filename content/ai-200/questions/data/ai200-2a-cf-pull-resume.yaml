id: ai200-2a-cf-pull-resume
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a Python worker that reads the change feed of an Azure Cosmos DB for NoSQL container with `query_items_change_feed()` and refreshes a semantic cache. The worker processes one logical partition at its own pace and is restarted every night for maintenance.

    After each restart, the worker must resume exactly where it stopped: it must not skip the changes made during the restart, and it must not process again the changes it already handled.

    What should you do?
  fr: |
    Wingtip Toys dispose d'un worker Python qui lit le flux de modification d'un conteneur Azure Cosmos DB for NoSQL avec `query_items_change_feed()` et actualise un cache sémantique. Le worker traite une partition logique à son propre rythme et redémarre chaque nuit pour maintenance.

    Après chaque redémarrage, le worker doit reprendre exactement là où il s'est arrêté : il ne doit pas ignorer les modifications effectuées pendant le redémarrage, ni retraiter celles qu'il a déjà traitées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call query_items_change_feed() with start_time=\"Now\" after each restart.", fr: "Appeler query_items_change_feed() avec start_time=\"Now\" après chaque redémarrage." } }
    - { id: b, text: { en: "Call query_items_change_feed() with start_time=\"Beginning\" after each restart.", fr: "Appeler query_items_change_feed() avec start_time=\"Beginning\" après chaque redémarrage." } }
    - { id: c, text: { en: "Persist the continuation token of the last read, and pass it as continuation after each restart.", fr: "Conserver le jeton de continuation de la dernière lecture et le passer comme continuation après chaque redémarrage." } }
    - { id: d, text: { en: "Create a lease container, and let the worker store its leases there automatically.", fr: "Créer un conteneur de baux et laisser le worker y stocker automatiquement ses baux." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In the pull model, your code tracks the position with a continuation token, kept in memory or persisted manually. Saving the token and passing it back as `continuation` resumes the read right after the last processed change; a continuation token takes precedence over the start time."
    fr: "Dans le modèle d'extraction, votre code suit la position avec un jeton de continuation, conservé en mémoire ou enregistré manuellement. Enregistrer le jeton et le repasser comme `continuation` reprend la lecture juste après la dernière modification traitée ; un jeton de continuation est prioritaire sur l'heure de début."
  options:
    a: { en: "Starting from now skips every change made while the worker was stopped.", fr: "Démarrer à partir de maintenant ignore toutes les modifications effectuées pendant l'arrêt du worker." }
    b: { en: "Starting from the beginning reprocesses every change already handled.", fr: "Démarrer depuis le début retraite toutes les modifications déjà traitées." }
    d: { en: "Leases belong to the change feed processor and the Functions trigger; the pull model doesn't use a lease container, and tokens can't be converted into leases.", fr: "Les baux appartiennent au processeur de flux de modification et au déclencheur Functions ; le modèle d'extraction n'utilise pas de conteneur de baux, et les jetons ne se convertissent pas en baux." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy?view=azure-python
