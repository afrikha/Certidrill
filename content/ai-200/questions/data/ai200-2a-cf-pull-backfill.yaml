id: ai200-2a-cf-pull-backfill
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware is migrating the documents of one tenant, **fabrikam**, from an Azure Cosmos DB for NoSQL container partitioned on `/tenantId` to a new vector store. A Python script reads the change feed with the pull model.

    The script must read the current version of every item of that tenant, from the creation of the container.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware migre les documents d'un locataire, **fabrikam**, d'un conteneur Azure Cosmos DB for NoSQL partitionné sur `/tenantId` vers un nouveau magasin vectoriel. Un script Python lit le flux de modification avec le modèle d'extraction.

    Le script doit lire la version actuelle de chaque élément de ce locataire, depuis la création du conteneur.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    changes = container.query_items_change_feed(
        start_time=[[start]],
        partition_key=[[pk]])

    for doc in changes:
        copy_to_vector_store(doc)
  slots:
    - id: start
      options:
        - { id: beginning, text: '"Beginning"' }
        - { id: now, text: '"Now"' }
        - { id: utcnow, text: 'datetime.now(timezone.utc)' }
    - id: pk
      options:
        - { id: value, text: '"fabrikam"' }
        - { id: path, text: '"/tenantId"' }
        - { id: name, text: '"tenantId"' }
answer:
  values: { start: beginning, pk: value }
explanation:
  correct:
    en: "`start_time=\"Beginning\"` reads the change feed from its start, and in the default latest version mode the feed holds the latest version of every item that still exists. `partition_key` takes the partition key value, which scopes the read to one logical partition, something the pull model supports and the change feed processor doesn't."
    fr: "`start_time=\"Beginning\"` lit le flux de modification depuis son début, et dans le mode par défaut, dernière version, le flux contient la dernière version de chaque élément qui existe encore. `partition_key` prend la valeur de la clé de partition, ce qui limite la lecture à une seule partition logique, une possibilité du modèle d'extraction que le processeur de flux de modification n'offre pas."
  options:
    now: { en: "`Now` (the default) returns only changes made from now on.", fr: "`Now` (la valeur par défaut) ne renvoie que les modifications effectuées à partir de maintenant." }
    utcnow: { en: "A datetime of now also skips every existing item.", fr: "Une date et heure correspondant à maintenant ignore aussi tous les éléments existants." }
    path: { en: "The parameter expects a partition key value, not the path.", fr: "Le paramètre attend une valeur de clé de partition, pas le chemin." }
    name: { en: "The parameter expects a partition key value, not the property name.", fr: "Le paramètre attend une valeur de clé de partition, pas le nom de la propriété." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy?view=azure-python
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
