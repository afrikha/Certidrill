id: ai200-2b-metric-actions
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You monitor four Azure Database for PostgreSQL flexible servers that host vector search workloads for Tailspin. Each server shows a different symptom.

    Which action should you take for each symptom? To answer, drag the appropriate actions to the correct symptoms. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous surveillez quatre serveurs flexibles Azure Database for PostgreSQL qui hébergent des charges de travail de recherche vectorielle pour Tailspin. Chaque serveur présente un symptôme différent.

    Quelle action devez-vous effectuer pour chaque symptôme ? Pour répondre, faites glisser les actions appropriées vers les symptômes correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: replica, text: { en: "Add read replicas", fr: "Ajouter des réplicas en lecture" } }
    - { id: memory, text: { en: "Move to a Memory Optimized size with more memory", fr: "Passer à une taille Memory Optimized avec plus de mémoire" } }
    - { id: pooling, text: { en: "Implement connection pooling", fr: "Mettre en œuvre le regroupement de connexions" } }
    - { id: gp, text: { en: "Move from Burstable to General Purpose", fr: "Passer de Burstable à General Purpose" } }
    - { id: storage, text: { en: "Increase the storage size", fr: "Augmenter la taille de stockage" } }
    - { id: efsearch, text: { en: "Lower hnsw.ef_search", fr: "Réduire hnsw.ef_search" } }
  targets:
    - id: volume
      text: { en: "Largest affordable size reached, read-heavy query volume still growing, a few seconds of staleness acceptable", fr: "Plus grande taille abordable atteinte, volume de requêtes en lecture toujours croissant, quelques secondes de retard acceptables" }
    - id: cache
      text: { en: "Storage IO percent high, cache hit ratio below 99%, Memory percent near its limit", fr: "Pourcentage d'E/S de stockage élevé, taux d'accès au cache inférieur à 99 %, pourcentage de mémoire proche de sa limite" }
    - id: conns
      text: { en: "Active connections close to the limit, most of them idle", fr: "Connexions actives proches de la limite, la plupart inactives" }
    - id: credits
      text: { en: "CPU Credits Remaining near zero, severe slowdowns under sustained load", fr: "CPU Credits Remaining proche de zéro, forts ralentissements sous une charge soutenue" }
answer:
  mapping: { volume: replica, cache: memory, conns: pooling, credits: gp }
explanation:
  correct:
    en: "Read replicas scale out read-heavy traffic that tolerates staleness once vertical scaling reaches its limit. High Storage IO with a low cache hit ratio means the working set does not fit in memory. Active connections near the limit point to connection pooling. A Burstable server out of CPU credits is limited to its baseline CPU, and the tier is not meant for sustained production load."
    fr: "Les réplicas en lecture répartissent un trafic principalement en lecture qui tolère un retard, une fois la mise à l'échelle verticale arrivée à sa limite. Des E/S de stockage élevées avec un faible taux d'accès au cache signifient que le jeu de données actif ne tient pas en mémoire. Des connexions actives proches de la limite indiquent le regroupement de connexions. Un serveur Burstable à court de crédits CPU est limité à son processeur de base, et ce niveau n'est pas prévu pour une charge de production soutenue."
references:
  - title: Scale for high-volume workloads
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/5-scale-high-volume-workloads
  - title: Compute Options
    url: https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-compute
