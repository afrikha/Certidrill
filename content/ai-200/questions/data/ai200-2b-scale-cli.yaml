id: ai200-2b-scale-cli
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a vector search workload on an Azure Database for PostgreSQL flexible server named **pg-contoso** in the resource group **rg-search**. The server uses the General Purpose tier. You decided to move it to the Memory Optimized tier with 8 vCores (E-series, version 5).

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une charge de travail de recherche vectorielle sur un serveur flexible Azure Database for PostgreSQL nommé **pg-contoso** dans le groupe de ressources **rg-search**. Le serveur utilise le niveau General Purpose. Vous avez décidé de le faire passer au niveau Memory Optimized avec 8 vCores (série E, version 5).

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az postgres flexible-server [[cmd]] \
      --resource-group rg-search --name pg-contoso \
      --tier [[tier]] --sku-name [[sku]]
  slots:
    - id: cmd
      options:
        - { id: update, text: update }
        - { id: upgrade, text: upgrade }
        - { id: paramset, text: parameter set }
        - { id: restart, text: restart }
    - id: tier
      options:
        - { id: mo, text: MemoryOptimized }
        - { id: gp, text: GeneralPurpose }
        - { id: burst, text: Burstable }
    - id: sku
      options:
        - { id: std_e8, text: Standard_E8ds_v5 }
        - { id: e8, text: E8ds_v5 }
        - { id: std_d8, text: Standard_D8ds_v5 }
        - { id: std_b8, text: Standard_B8ms }
answer:
  values: { cmd: update, tier: mo, sku: std_e8 }
explanation:
  correct:
    en: "`az postgres flexible-server update` changes the compute of an existing server. `--tier` accepts Burstable, GeneralPurpose or MemoryOptimized, and `--sku-name` follows the convention `Standard_{VM name}`, so 8 vCores of the Edsv5 series is `Standard_E8ds_v5`. Changing the compute restarts the server, so plan it off-peak with retry logic."
    fr: "`az postgres flexible-server update` modifie le calcul d'un serveur existant. `--tier` accepte Burstable, GeneralPurpose ou MemoryOptimized, et `--sku-name` suit la convention `Standard_{nom de la VM}` : 8 vCores de la série Edsv5 donnent `Standard_E8ds_v5`. Modifier le calcul redémarre le serveur : planifiez-le en heures creuses avec une logique de nouvelle tentative."
  options:
    upgrade:
      en: "upgrade performs a major version upgrade of PostgreSQL, not a compute change."
      fr: "upgrade effectue une mise à niveau de version majeure de PostgreSQL, pas une modification du calcul."
    paramset:
      en: "parameter set changes a server parameter; it has no tier or SKU arguments and identifies the server with --server-name."
      fr: "parameter set modifie un paramètre de serveur ; il n'a pas d'arguments de niveau ou de SKU et identifie le serveur avec --server-name."
    e8:
      en: "The SKU name must include the Standard_ prefix."
      fr: "Le nom du SKU doit inclure le préfixe Standard_."
    std_d8:
      en: "D-series sizes belong to the General Purpose tier."
      fr: "Les tailles de la série D appartiennent au niveau General Purpose."
    std_b8:
      en: "B-series sizes belong to the Burstable tier."
      fr: "Les tailles de la série B appartiennent au niveau Burstable."
references:
  - title: az postgres flexible-server
    url: https://learn.microsoft.com/en-us/cli/azure/postgres/flexible-server
  - title: Scaling Resources in Azure Database for PostgreSQL Flexible Server
    url: https://learn.microsoft.com/en-us/azure/postgresql/scale/concepts-scaling-resources
