id: ai200-sr1-search-capacity-1
objective: "2.2.4"
type: series_yesno
series: ai200-sr1-search-capacity
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You enable the built-in PgBouncer for the search API.
  fr: Vous activez le PgBouncer intégré pour l'API de recherche.
body:
  solution:
    en: |
      You set the `pgbouncer.enabled` server parameter of pg-northwind-rag to `true`. You change the connection settings of the search API to use port **6432** with the same host name.
    fr: |
      Vous définissez le paramètre de serveur `pgbouncer.enabled` de pg-northwind-rag sur `true`. Vous modifiez les paramètres de connexion de l'API de recherche pour utiliser le port **6432** avec le même nom d'hôte.
answer: { value: false }
explanation:
  correct:
    en: PgBouncer pools connections, which reduces the cost of many idle or short-lived connections on the server. The search API already uses a pool of 20 connections, and the CPU is consumed by the vector similarity queries, which still run on the same 8 vCores through PgBouncer, so the query capacity does not increase.
    fr: "PgBouncer regroupe les connexions, ce qui réduit le coût de nombreuses connexions inactives ou de courte durée sur le serveur. L'API de recherche utilise déjà un pool de 20 connexions, et le processeur est consommé par les requêtes de similarité vectorielle, qui s'exécutent toujours sur les mêmes 8 vCores à travers PgBouncer : la capacité de requête n'augmente pas."
references:
  - title: PgBouncer in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/concepts-pgbouncer
