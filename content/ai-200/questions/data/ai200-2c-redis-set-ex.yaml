id: ai200-2c-redis-set-ex
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's support assistant calls a chat model to summarize long tickets. To reduce cost, the Python code caches each summary in Azure Managed Redis by using redis-py. The `r` variable is a connected `redis.Redis` client, `key` contains the cache key, and `summary` contains the text.

    The summary must be removed from the cache automatically 20 minutes after it is written. The write and the expiration must be set by a single command.

    Which line of code should you use?
  fr: |
    L'assistant de support de Contoso appelle un modèle de conversation pour résumer les tickets longs. Pour réduire les coûts, le code Python met en cache chaque résumé dans Azure Managed Redis à l'aide de redis-py. La variable `r` est un client `redis.Redis` connecté, `key` contient la clé de cache et `summary` contient le texte.

    Le résumé doit être supprimé automatiquement du cache 20 minutes après son écriture. L'écriture et l'expiration doivent être définies par une seule commande.

    Quelle ligne de code devez-vous utiliser ?
body:
  options:
    - { id: a, text: "r.set(key, summary, ex=1200)" }
    - { id: b, text: "r.setex(key, summary, 1200)" }
    - { id: c, text: "r.set(key, summary, ex=20)" }
    - { id: d, text: "r.set(key, summary, px=1200)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `ex` argument of `set` sets the time to live in seconds in the same SET command, so `ex=1200` makes the key expire 20 minutes after the write. Setting the value and the expiration together avoids a key left without a TTL if the process stops between two commands.
    fr: |
      L'argument `ex` de `set` définit la durée de vie en secondes dans la même commande SET : `ex=1200` fait expirer la clé 20 minutes après l'écriture. Définir la valeur et l'expiration ensemble évite qu'une clé reste sans durée de vie si le processus s'arrête entre deux commandes.
  options:
    d:
      en: |
        `px` is in milliseconds, so the key would expire after 1.2 seconds.
      fr: |
        `px` est exprimé en millisecondes : la clé expirerait au bout de 1,2 seconde.
    b:
      en: |
        `setex` takes the name, then the time, then the value; with these arguments the summary is passed as the expiration.
      fr: |
        `setex` prend le nom, puis la durée, puis la valeur ; avec ces arguments, le résumé est passé comme expiration.
    c:
      en: |
        `ex` is in seconds, so the key would expire after 20 seconds.
      fr: |
        `ex` est exprimé en secondes : la clé expirerait au bout de 20 secondes.
references:
  - title: Best practices for memory management for Azure Managed Redis
    url: https://learn.microsoft.com/en-us/azure/redis/best-practices-memory-management
