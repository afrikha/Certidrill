id: ai200-2b-missing-commit
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs a nightly Python job that inserts document chunks into an Azure Database for PostgreSQL flexible server. The job opens a connection with `psycopg.connect()`, runs several `cursor.execute("INSERT ...")` statements, and then calls `cursor.close()` and `conn.close()`.

    The job ends without any error, but the new rows never appear in the table.

    What should you do?
  fr: |
    Northwind exécute chaque nuit un travail Python qui insère des segments de documents dans un serveur flexible Azure Database for PostgreSQL. Le travail ouvre une connexion avec `psycopg.connect()`, exécute plusieurs instructions `cursor.execute("INSERT ...")`, puis appelle `cursor.close()` et `conn.close()`.

    Le travail se termine sans erreur, mais les nouvelles lignes n'apparaissent jamais dans la table.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call `conn.commit()` before closing the connection.", fr: "Appeler `conn.commit()` avant de fermer la connexion." } }
    - { id: b, text: { en: "Add `sslmode=require` to the connection string.", fr: "Ajouter `sslmode=require` à la chaîne de connexion." } }
    - { id: c, text: { en: "Call `cursor.fetchall()` after the last INSERT statement.", fr: "Appeler `cursor.fetchall()` après la dernière instruction INSERT." } }
    - { id: d, text: { en: "Close the connection before closing the cursor.", fr: "Fermer la connexion avant de fermer le curseur." } }
answer: { optionId: a }
explanation:
  correct:
    en: "psycopg starts a transaction with the first statement and does not commit it automatically when the connection is closed outside a `with` block. The Learn samples call `conn.commit()` to save the changes, then close the cursor and the connection."
    fr: "psycopg démarre une transaction à la première instruction et ne la valide pas automatiquement quand la connexion est fermée en dehors d'un bloc `with`. Les exemples de Learn appellent `conn.commit()` pour enregistrer les modifications, puis ferment le curseur et la connexion."
  options:
    c:
      en: "fetchall reads the results of a query; INSERT returns no rows to fetch and nothing is committed."
      fr: "fetchall lit les résultats d'une requête ; INSERT ne renvoie aucune ligne à lire et rien n'est validé."
    b:
      en: "The connection already works; encryption has nothing to do with whether the transaction is committed."
      fr: "La connexion fonctionne déjà ; le chiffrement n'a aucun rapport avec la validation de la transaction."
    d:
      en: "The order in which the objects are closed does not commit anything."
      fr: "L'ordre de fermeture des objets ne valide rien."
references:
  - title: "Quickstart: Use Python to Connect and Query Data in Azure Database for PostgreSQL Flexible Server"
    url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/connect-python
