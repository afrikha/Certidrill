id: ai200-2b-hnsw-recall
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove's compliance assistant uses an HNSW index created with `m = 16` and `ef_construction = 64` on Azure Database for PostgreSQL. Measured recall for the top 10 results is 91 percent, and the target is at least 98 percent. The latency budget allows slower queries, and the server has enough memory for a larger index.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant de conformité de Woodgrove utilise un index HNSW créé avec `m = 16` et `ef_construction = 64` sur Azure Database for PostgreSQL. Le rappel mesuré pour les 10 premiers résultats est de 91 %, et l'objectif est d'au moins 98 %. Le budget de latence autorise des requêtes plus lentes, et le serveur dispose d'assez de mémoire pour un index plus grand.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set `hnsw.ef_search` to 200 for the search queries.", fr: "Définir `hnsw.ef_search` sur 200 pour les requêtes de recherche." } }
    - { id: b, text: { en: "Set `hnsw.ef_search` to 20 for the search queries.", fr: "Définir `hnsw.ef_search` sur 20 pour les requêtes de recherche." } }
    - { id: c, text: { en: "Set `ivfflat.probes` to 50 for the search queries.", fr: "Définir `ivfflat.probes` sur 50 pour les requêtes de recherche." } }
    - { id: d, text: { en: "Rebuild the index with `m = 32` and `ef_construction = 128`.", fr: "Reconstruire l'index avec `m = 32` et `ef_construction = 128`." } }
    - { id: e, text: { en: "Create an additional B-tree index on the embedding column.", fr: "Créer un index B-tree supplémentaire sur la colonne embedding." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A larger `hnsw.ef_search` (default 40) makes each search examine more candidates; Learn suggests 100 to 200 for high accuracy. A graph built with more connections per node (`m = 32`) and a larger `ef_construction` (at least `2 * m`) is of higher quality, at the cost of memory and build time; these options can only be changed by rebuilding the index."
    fr: "Un `hnsw.ef_search` plus élevé (40 par défaut) fait examiner plus de candidats à chaque recherche ; Learn suggère 100 à 200 pour une grande précision. Un graphe construit avec plus de connexions par nœud (`m = 32`) et un `ef_construction` plus grand (au moins `2 * m`) est de meilleure qualité, au prix de la mémoire et du temps de construction ; ces options ne se modifient qu'en reconstruisant l'index."
  options:
    b:
      en: "A value of 20 reduces the candidate list below the default and lowers recall; it is meant for latency-critical searches."
      fr: "Une valeur de 20 réduit la liste de candidats sous la valeur par défaut et diminue le rappel ; elle est prévue pour les recherches où la latence est critique."
    c:
      en: "ivfflat.probes has no effect on an HNSW index."
      fr: "ivfflat.probes n'a aucun effet sur un index HNSW."
    e:
      en: "A B-tree index cannot serve distance ordering on a vector column."
      fr: "Un index B-tree ne peut pas servir le tri par distance sur une colonne vectorielle."
references:
  - title: Choose and configure vector indexes
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes
  - title: Tune PostgreSQL for pgvector
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/2-tune-postgresql-pgvector
