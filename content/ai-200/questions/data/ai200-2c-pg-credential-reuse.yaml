id: ai200-2c-pg-credential-reuse
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Margie's Travel has a Python API that connects to Azure Database for PostgreSQL flexible server with Microsoft Entra authentication. For every request, the API runs the following code before it opens a connection.

    ```python
    credential = DefaultAzureCredential()
    token = credential.get_token("https://ossrdbms-aad.database.windows.net/.default").token
    ```

    Under load, the latency of each request increases, and the calls to Microsoft Entra ID are throttled.

    You need to reduce the latency. The API must keep passwordless authentication.

    What should you do?
  fr: |
    Margie's Travel dispose d'une API Python qui se connecte à Azure Database for PostgreSQL serveur flexible avec l'authentification Microsoft Entra. Pour chaque requête, l'API exécute le code suivant avant d'ouvrir une connexion.

    ```python
    credential = DefaultAzureCredential()
    token = credential.get_token("https://ossrdbms-aad.database.windows.net/.default").token
    ```

    En charge, la latence de chaque requête augmente, et les appels à Microsoft Entra ID sont limités.

    Vous devez réduire la latence. L'API doit conserver l'authentification sans mot de passe.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Request the token for the `https://management.azure.com/.default` scope."
        fr: "Demander le jeton pour l'étendue `https://management.azure.com/.default`."
    - id: b
      text:
        en: "Add `sslmode=disable` to the connection string to skip the TLS handshake."
        fr: "Ajouter `sslmode=disable` à la chaîne de connexion pour éviter la négociation TLS."
    - id: c
      text:
        en: "Create the credential once per process, and reuse it for every token request."
        fr: "Créer les informations d'identification une fois par processus, et les réutiliser pour chaque demande de jeton."
    - id: d
      text:
        en: "Store the token in an app setting at deployment time and read it for every request."
        fr: "Stocker le jeton dans un paramètre d'application au moment du déploiement et le lire pour chaque requête."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Creating `DefaultAzureCredential` for every call defeats its token caching and adds round trips to the identity provider. Microsoft recommends persisting the credential across calls and reusing it; the cached token is refreshed before it expires, and combined with a connection pool, most requests don't need a new token or a new connection.
    fr: |
      Créer `DefaultAzureCredential` à chaque appel empêche la mise en cache des jetons et ajoute des allers-retours vers le fournisseur d'identité. Microsoft recommande de conserver les informations d'identification entre les appels et de les réutiliser ; le jeton mis en cache est actualisé avant son expiration et, avec un pool de connexions, la plupart des requêtes n'ont besoin ni d'un nouveau jeton ni d'une nouvelle connexion.
  options:
    a:
      en: |
        Azure Database for PostgreSQL accepts tokens for the `https://ossrdbms-aad.database.windows.net/.default` scope only.
      fr: |
        Azure Database for PostgreSQL n'accepte que les jetons de l'étendue `https://ossrdbms-aad.database.windows.net/.default`.
    b:
      en: |
        The server requires TLS, and disabling it doesn't address the repeated token requests.
      fr: |
        Le serveur exige TLS, et le désactiver ne règle pas les demandes de jeton répétées.
    d:
      en: |
        Microsoft Entra tokens have a limited lifetime, so a token stored at deployment expires and authentication fails.
      fr: |
        Les jetons Microsoft Entra ont une durée de vie limitée : un jeton stocké au déploiement expire et l'authentification échoue.
references:
  - title: "Quickstart: Use Python to Connect and Query Data in Azure Database for PostgreSQL Flexible Server"
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/connect-python
