id: ai200-2b-index-usage
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin created an HNSW index named **idx_guides_embedding** on Azure Database for PostgreSQL, but search latency did not improve. You suspect that the search queries do not use the index.

    Which two methods confirm whether the search queries use idx_guides_embedding?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin a créé un index HNSW nommé **idx_guides_embedding** sur Azure Database for PostgreSQL, mais la latence de recherche ne s'est pas améliorée. Vous soupçonnez que les requêtes de recherche n'utilisent pas l'index.

    Quelles sont les deux méthodes qui confirment si les requêtes de recherche utilisent idx_guides_embedding ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Query `pg_stat_progress_create_index` while the searches run.", fr: "Interroger `pg_stat_progress_create_index` pendant l'exécution des recherches." } }
    - { id: b, text: { en: "Run `EXPLAIN ANALYZE` on a search query and look for `Index Scan using idx_guides_embedding`.", fr: "Exécuter `EXPLAIN ANALYZE` sur une requête de recherche et rechercher `Index Scan using idx_guides_embedding`." } }
    - { id: c, text: { en: "Run `SHOW azure.extensions;` and check that vector is in the list.", fr: "Exécuter `SHOW azure.extensions;` et vérifier que vector figure dans la liste." } }
    - { id: d, text: { en: "Check whether `idx_scan` of the index increases in `pg_stat_user_indexes`.", fr: "Vérifier si `idx_scan` de l'index augmente dans `pg_stat_user_indexes`." } }
    - { id: e, text: { en: "Query `pg_extension` and check that the vector extension is installed.", fr: "Interroger `pg_extension` et vérifier que l'extension vector est installée." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The query plan shows `Index Scan using <index>` when the index is used and `Seq Scan` when it is not. `pg_stat_user_indexes.idx_scan` counts the scans of each index; a value that does not increase while searches run shows that the index is not used, often because of an operator class mismatch."
    fr: "Le plan de requête affiche `Index Scan using <index>` quand l'index est utilisé et `Seq Scan` quand il ne l'est pas. `pg_stat_user_indexes.idx_scan` compte les analyses de chaque index ; une valeur qui n'augmente pas pendant les recherches montre que l'index n'est pas utilisé, souvent à cause d'une discordance de classe d'opérateurs."
  options:
    a:
      en: "This view reports the progress of index builds, not the use of an index by queries."
      fr: "Cette vue indique la progression des constructions d'index, pas l'utilisation d'un index par les requêtes."
    c:
      en: "The allowlist only shows which extensions can be created; the index already exists."
      fr: "La liste d'autorisation montre seulement quelles extensions peuvent être créées ; l'index existe déjà."
    e:
      en: "The extension is necessarily installed because the index exists; this says nothing about query plans."
      fr: "L'extension est forcément installée puisque l'index existe ; cela ne dit rien des plans de requête."
references:
  - title: Choose and configure vector indexes
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes
  - title: Tune PostgreSQL for pgvector
    url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/2-tune-postgresql-pgvector
