id: ai200-2a-sdk-patch-status
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum ingests contracts into an Azure Cosmos DB for NoSQL container. Each item is about 200 KB because it contains the extracted text. After a worker indexes a contract, a Python function must:

    - set `status` to `indexed`;
    - add 1 to the existing `retryCount` counter;
    - delete the obsolete `draftText` property.

    The function must not send the whole item to the service.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum ingère des contrats dans un conteneur Azure Cosmos DB for NoSQL. Chaque élément fait environ 200 Ko, car il contient le texte extrait. Après l'indexation d'un contrat par un worker, une fonction Python doit :

    - définir `status` sur `indexed` ;
    - ajouter 1 au compteur `retryCount` existant ;
    - supprimer la propriété obsolète `draftText`.

    La fonction ne doit pas envoyer l'élément entier au service.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    container.[[method]](
        item=contract_id,
        partition_key=customer_id,
        patch_operations=[
            {"op": "replace", "path": "/status", "value": "indexed"},
            {"op": [[inc]], "path": "/retryCount", "value": 1},
            {"op": [[rm]], "path": "/draftText"}
        ])
  slots:
    - id: method
      options:
        - { id: patch, text: patch_item }
        - { id: replace, text: replace_item }
        - { id: upsert, text: upsert_item }
    - id: inc
      options:
        - { id: incr, text: '"incr"' }
        - { id: add, text: '"add"' }
        - { id: move, text: '"move"' }
    - id: rm
      options:
        - { id: remove, text: '"remove"' }
        - { id: replace, text: '"replace"' }
        - { id: incr, text: '"incr"' }
answer:
  values: { method: patch, inc: incr, rm: remove }
explanation:
  correct:
    en: "`patch_item` applies a list of operations to an existing item, so only the changes travel to the service. `incr` adds the given value to a number, and `remove` deletes the property at the path; a patch request accepts at most 10 operations."
    fr: "`patch_item` applique une liste d'opérations à un élément existant : seules les modifications sont envoyées au service. `incr` ajoute la valeur indiquée à un nombre et `remove` supprime la propriété du chemin ; une requête de mise à jour partielle accepte au plus 10 opérations."
  options:
    replace: { en: "`replace_item` takes a full item body, which means sending the 200 KB document; as an operation, `replace` needs a value and keeps the property.", fr: "`replace_item` prend le corps complet de l'élément, ce qui revient à envoyer le document de 200 Ko ; comme opération, `replace` exige une valeur et conserve la propriété." }
    upsert: { en: "`upsert_item` also writes the whole item.", fr: "`upsert_item` écrit lui aussi l'élément entier." }
    add: { en: "`add` writes the value 1 at the path instead of adding 1 to the current value.", fr: "`add` écrit la valeur 1 au chemin au lieu d'ajouter 1 à la valeur actuelle." }
    move: { en: "`move` relocates a value from a `from` path to another path; it doesn't increment.", fr: "`move` déplace une valeur d'un chemin `from` vers un autre chemin ; il n'incrémente rien." }
    incr: { en: "`incr` applies to numbers and needs a value; it doesn't delete a property.", fr: "`incr` s'applique aux nombres et exige une valeur ; il ne supprime pas de propriété." }
references:
  - title: Get Started with Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update-getting-started
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy?view=azure-python
