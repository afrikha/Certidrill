id: ai200-4a-flag-selectors
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Relecloud manages the feature flags of its Python travel assistant in App Configuration. Each flag exists twice, with the label `Dev` and with the label `Prod`, and no flag is unlabeled. The production code is:

    `config = load(endpoint=endpoint, credential=cred, feature_flag_enabled=True)`

    `features = FeatureManager(config)`

    In production, `features.is_enabled("SmartRebooking")` always returns `False`, although the Prod flag is enabled. You need the code to evaluate the Prod flags.

    What should you add to the `load()` call?
  fr: |
    Relecloud gère les indicateurs de fonctionnalité de son assistant de voyage Python dans App Configuration. Chaque indicateur existe deux fois, avec l'étiquette `Dev` et avec l'étiquette `Prod`, et aucun indicateur n'est sans étiquette. Le code de production est :

    `config = load(endpoint=endpoint, credential=cred, feature_flag_enabled=True)`

    `features = FeatureManager(config)`

    En production, `features.is_enabled("SmartRebooking")` renvoie toujours `False`, bien que l'indicateur Prod soit activé. Le code doit évaluer les indicateurs Prod.

    Que devez-vous ajouter à l'appel `load()` ?
body:
  options:
    - { id: a, text: "feature_flag_refresh_enabled=True" }
    - { id: b, text: "feature_flag_selectors=[SettingSelector(key_filter=\"*\", label_filter=\"Prod\")]" }
    - { id: c, text: "trim_prefixes=[\"Prod\"]" }
    - { id: d, text: "refresh_on=[WatchKey(\"SmartRebooking\")]" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `feature_flag_enabled=True`, the provider loads by default only the feature flags that have no label. `feature_flag_selectors` takes `SettingSelector` objects that choose which flags to load, so a selector with `label_filter="Prod"` loads the production flags that `FeatureManager` evaluates.
    fr: |
      Avec `feature_flag_enabled=True`, le fournisseur ne charge par défaut que les indicateurs de fonctionnalité sans étiquette. `feature_flag_selectors` reçoit des objets `SettingSelector` qui choisissent les indicateurs à charger : un sélecteur avec `label_filter="Prod"` charge les indicateurs de production qu'évalue `FeatureManager`.
  options:
    a: { en: "Refreshing flags doesn't help when the Prod flags were never loaded.", fr: "Actualiser les indicateurs n'aide pas quand les indicateurs Prod n'ont jamais été chargés." }
    c: { en: "`trim_prefixes` removes a prefix from key names; labels aren't part of the name.", fr: "`trim_prefixes` retire un préfixe des noms de clés ; les étiquettes ne font pas partie du nom." }
    d: { en: "Watching a key controls configuration refresh, not which flags are loaded.", fr: "Surveiller une clé contrôle l'actualisation de la configuration, pas les indicateurs chargés." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
