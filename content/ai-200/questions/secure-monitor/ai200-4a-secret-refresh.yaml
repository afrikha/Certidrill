id: ai200-4a-secret-refresh
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum's Python research assistant loads its settings from an App Configuration store with the following call:

    `config = load(endpoint=endpoint, credential=cred, keyvault_credential=cred, refresh_on=[WatchKey("Sentinel")])`

    The app calls `config.refresh()` in each request. The key-value `Search:ApiKey` is a Key Vault reference to `https://kv-adatum.vault.azure.net/secrets/search-key`, with no version. A function writes a new version of search-key every week, and nobody changes App Configuration when that happens. The app keeps using the old key until it restarts.

    You need the app to pick up new versions of search-key within two hours, without a restart.

    What should you do?
  fr: |
    L'assistant de recherche Python d'Adatum charge ses paramètres depuis un magasin App Configuration avec l'appel suivant :

    `config = load(endpoint=endpoint, credential=cred, keyvault_credential=cred, refresh_on=[WatchKey("Sentinel")])`

    L'application appelle `config.refresh()` à chaque requête. La clé-valeur `Search:ApiKey` est une référence Key Vault vers `https://kv-adatum.vault.azure.net/secrets/search-key`, sans version. Une fonction écrit une nouvelle version de search-key chaque semaine, et personne ne modifie App Configuration à cette occasion. L'application continue d'utiliser l'ancienne clé jusqu'à son redémarrage.

    L'application doit récupérer les nouvelles versions de search-key sous deux heures, sans redémarrage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `WatchKey(\"Search:ApiKey\")` to the `refresh_on` list.", fr: "Ajouter `WatchKey(\"Search:ApiKey\")` à la liste `refresh_on`." } }
    - { id: b, text: { en: "Add `secret_refresh_interval=3600` to the `load()` call.", fr: "Ajouter `secret_refresh_interval=3600` à l'appel `load()`." } }
    - { id: c, text: { en: "Add `refresh_interval=3600` to the `load()` call.", fr: "Ajouter `refresh_interval=3600` à l'appel `load()`." } }
    - { id: d, text: { en: "Add `feature_flag_refresh_enabled=True` to the `load()` call.", fr: "Ajouter `feature_flag_refresh_enabled=True` à l'appel `load()`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `secret_refresh_interval` refreshes resolved Key Vault secrets independently of the configuration: when `refresh()` runs and the interval has elapsed, the provider fetches the secret again even if nothing changed in App Configuration. With 3,600 seconds, a new version is picked up within about an hour.
    fr: |
      `secret_refresh_interval` actualise les secrets Key Vault résolus indépendamment de la configuration : quand `refresh()` s'exécute et que l'intervalle est écoulé, le fournisseur récupère de nouveau le secret même si rien n'a changé dans App Configuration. Avec 3 600 secondes, une nouvelle version est récupérée en une heure environ.
  options:
    a: { en: "The key-value in App Configuration still holds the same URI after a rotation, so watching it never detects a change.", fr: "La clé-valeur d'App Configuration contient toujours le même URI après une rotation : la surveiller ne détecte jamais de changement." }
    c: { en: "`refresh_interval` controls how often the sentinel is checked; the sentinel doesn't change when the secret rotates.", fr: "`refresh_interval` contrôle la fréquence de vérification de la sentinelle, qui ne change pas lors de la rotation du secret." }
    d: { en: "This setting refreshes feature flags, not Key Vault references.", fr: "Ce paramètre actualise les indicateurs de fonctionnalité, pas les références Key Vault." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
