id: ai200-4b-kql-custom-property
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders' multitenant RAG API adds a span attribute named `tenant.id` to every server span. The telemetry is stored in a workspace-based Application Insights resource.

    You need a query that returns the failed requests of the tenant **adatum** during the last hour.

    Which filter should you add after `AppRequests | where TimeGenerated > ago(1h) and Success == false`?
  fr: |
    L'API RAG multilocataire de Northwind Traders ajoute un attribut d'étendue nommé `tenant.id` à chaque étendue serveur. La télémétrie est stockée dans une ressource Application Insights basée sur un espace de travail.

    Vous avez besoin d'une requête qui renvoie les requêtes en échec du locataire **adatum** au cours de la dernière heure.

    Quel filtre devez-vous ajouter après `AppRequests | where TimeGenerated > ago(1h) and Success == false` ?
body:
  options:
    - { id: a, text: '`| where Properties.tenant.id == "adatum"`' }
    - { id: b, text: '`| where tostring(customDimensions["tenant.id"]) == "adatum"`' }
    - { id: c, text: '`| where tostring(Measurements["tenant.id"]) == "adatum"`' }
    - { id: d, text: '`| where tostring(Properties["tenant.id"]) == "adatum"`' }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Span attributes become custom properties, stored in the dynamic `Properties` column of the workspace tables. Because the key contains a dot, you access it with the bracket notation and convert the dynamic value with `tostring()` before comparing it.
    fr: |-
      Les attributs d'étendue deviennent des propriétés personnalisées, stockées dans la colonne dynamique `Properties` des tables de l'espace de travail. Comme la clé contient un point, vous y accédez avec la notation entre crochets et convertissez la valeur dynamique avec `tostring()` avant de la comparer.
  options:
    a:
      en: |-
        The dot notation reads a nested `id` property inside a `tenant` object, not a key named `tenant.id`.
      fr: |-
        La notation pointée lit une propriété `id` imbriquée dans un objet `tenant`, pas une clé nommée `tenant.id`.
    b:
      en: "`customDimensions` is the column name of the classic `requests` table; the workspace table uses `Properties`."
      fr: "`customDimensions` est le nom de colonne de la table classique `requests` ; la table de l'espace de travail utilise `Properties`."
    c:
      en: "`Measurements` holds application-defined numeric measurements, not span attributes."
      fr: "`Measurements` contient des mesures numériques définies par l'application, pas les attributs d'étendue."
references:
  - title: Azure Monitor Logs reference - AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
