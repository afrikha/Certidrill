id: ai200-4b-kql-join-flavors
objective: "4.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam's SRE team correlates failed API requests with failed downstream calls by using the following query:

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1h) and Success == false
    | join (AppDependencies | where TimeGenerated > ago(1h) and Success == false) on OperationId
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe SRE de Fabrikam met en corrélation les requêtes d'API en échec et les appels en aval en échec avec la requête suivante :

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1h) and Success == false
    | join (AppDependencies | where TimeGenerated > ago(1h) and Success == false) on OperationId
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Because no kind is specified, the left side is deduplicated on `OperationId` before the rows are matched.
        fr: |-
          Comme aucun type n'est indiqué, le côté gauche est dédupliqué sur `OperationId` avant la mise en correspondance des lignes.
    - id: s2
      text:
        en: |-
          A failed request that has no failed dependency appears in the results with empty dependency columns.
        fr: |-
          Une requête en échec qui n'a aucune dépendance en échec apparaît dans les résultats avec des colonnes de dépendance vides.
    - id: s3
      text:
        en: |-
          With `join kind=leftanti`, the query returns the failed requests that have no failed dependency.
        fr: |-
          Avec `join kind=leftanti`, la requête renvoie les requêtes en échec qui n'ont aucune dépendance en échec.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The default join kind is `innerunique`, an inner join that deduplicates the left table on the join key. As an inner join, it returns only matching rows, so a request without a failed dependency isn't returned; `leftouter` would keep it with empty columns. `leftanti` returns the left rows that have no match on the right side.
    fr: |-
      Le type de jointure par défaut est `innerunique`, une jointure interne qui déduplique la table de gauche sur la clé de jointure. En tant que jointure interne, elle ne renvoie que les lignes correspondantes : une requête sans dépendance en échec n'est pas renvoyée ; `leftouter` la conserverait avec des colonnes vides. `leftanti` renvoie les lignes de gauche sans correspondance à droite.
references:
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
  - title: leftanti join
    url: https://learn.microsoft.com/en-us/kusto/query/join-leftanti
