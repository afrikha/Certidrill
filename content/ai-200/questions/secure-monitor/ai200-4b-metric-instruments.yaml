id: ai200-4b-metric-instruments
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders adds custom metrics to a Python chat back end instrumented with the Azure Monitor OpenTelemetry Distro. The code records each value synchronously, at the moment the event happens.

    Which OpenTelemetry instrument should you create for each measurement? To answer, drag the appropriate instruments to the correct measurements. Each instrument may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders ajoute des métriques personnalisées à un back-end de conversation Python instrumenté avec la distribution OpenTelemetry Azure Monitor. Le code enregistre chaque valeur de manière synchrone, au moment où l'événement se produit.

    Quel instrument OpenTelemetry devez-vous créer pour chaque mesure ? Pour répondre, faites glisser les instruments appropriés vers les mesures correspondantes. Chaque instrument peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: counter, text: Counter }
    - { id: updown, text: UpDownCounter }
    - { id: histogram, text: Histogram }
    - { id: gauge, text: { en: "Asynchronous gauge", fr: "Jauge asynchrone" } }
  targets:
    - id: tokens
      text: { en: "Total model tokens consumed, added after each completion", fr: "Total des jetons de modèle consommés, ajouté après chaque complétion" }
    - id: sessions
      text: { en: "Open streaming sessions, incremented when a session opens and decremented when it closes", fr: "Sessions de streaming ouvertes, incrémentées à l'ouverture d'une session et décrémentées à sa fermeture" }
    - id: latency
      text: { en: "Retrieval duration of each search, for which you need the minimum, maximum and average per minute", fr: "Durée de récupération de chaque recherche, dont vous avez besoin du minimum, du maximum et de la moyenne par minute" }
answer:
  mapping: { tokens: counter, sessions: updown, latency: histogram }
explanation:
  correct:
    en: |-
      A Counter only adds non-negative increments and Azure Monitor aggregates it as a sum. An UpDownCounter accepts increments and decrements, also aggregated as a sum, which fits a number of open sessions. A Histogram records individual measurements and is aggregated as minimum, maximum, average, sum and count. An asynchronous gauge reads a value in a callback, which doesn't fit synchronous recording.
    fr: |-
      Un Counter n'ajoute que des incréments positifs ou nuls, et Azure Monitor l'agrège sous forme de somme. Un UpDownCounter accepte des incréments et des décréments, agrégés eux aussi en somme, ce qui convient à un nombre de sessions ouvertes. Un Histogram enregistre des mesures individuelles et est agrégé en minimum, maximum, moyenne, somme et nombre. Une jauge asynchrone lit une valeur dans une fonction de rappel, ce qui ne convient pas à un enregistrement synchrone.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
