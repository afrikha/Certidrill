id: ai200-4b-kql-log-tables
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a Python RAG API in Azure Container Apps, with Log Analytics as the logging destination and HTTP logging enabled, and indexing workers in an Azure Kubernetes Service (AKS) cluster monitored by Container insights. All the logs go to the same Log Analytics workspace.

    Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une API RAG Python dans Azure Container Apps, avec Log Analytics comme destination de journalisation et la journalisation HTTP activée, ainsi que des workers d'indexation dans un cluster Azure Kubernetes Service (AKS) supervisé par Container insights. Tous les journaux arrivent dans le même espace de travail Log Analytics.

    Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: console, text: ContainerAppConsoleLogs_CL }
    - { id: system, text: ContainerAppSystemLogs_CL }
    - { id: http, text: ContainerAppHTTPLogs }
    - { id: aks, text: ContainerLogV2 }
    - { id: metrics, text: AzureMetrics }
  targets:
    - id: stdout
      text: { en: "Lines that the API container prints to stdout", fr: "Lignes que le conteneur de l'API écrit sur stdout" }
    - id: platform
      text: { en: "Events of the Container Apps platform about the API revisions and replicas", fr: "Événements de la plateforme Container Apps concernant les révisions et les réplicas de l'API" }
    - id: ingress
      text: { en: "Status code and duration of each request received by the API ingress", fr: "Code d'état et durée de chaque requête reçue par l'entrée de l'API" }
    - id: workers
      text: { en: "Log lines written by the indexing worker pods", fr: "Lignes de journal écrites par les pods des workers d'indexation" }
answer:
  mapping: { stdout: console, platform: system, ingress: http, workers: aks }
explanation:
  correct:
    en: |-
      In Container Apps, `ContainerAppConsoleLogs_CL` holds the stdout and stderr streams of the containers, `ContainerAppSystemLogs_CL` the platform events, and `ContainerAppHTTPLogs` the ingress requests with their status code and duration. Container insights stores AKS container logs in `ContainerLogV2`. `AzureMetrics` holds platform metrics, not log lines.
    fr: |-
      Dans Container Apps, `ContainerAppConsoleLogs_CL` contient les flux stdout et stderr des conteneurs, `ContainerAppSystemLogs_CL` les événements de la plateforme et `ContainerAppHTTPLogs` les requêtes d'entrée avec leur code d'état et leur durée. Container insights stocke les journaux de conteneurs AKS dans `ContainerLogV2`. `AzureMetrics` contient des métriques de plateforme, pas des lignes de journal.
references:
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
  - title: Azure Monitor Logs reference - ContainerLogV2
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/containerlogv2
