id: ai200-4b-sampler-precedence
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam's recommendation API starts the Azure Monitor OpenTelemetry Distro with the following call:

    ```text
    configure_azure_monitor(sampling_ratio=0.5)
    ```

    An operator later adds these environment variables to the container app without changing the image:

    ```text
    OTEL_TRACES_SAMPLER=microsoft.rate_limited
    OTEL_TRACES_SAMPLER_ARG=2
    ```

    Which trace sampling does the API apply after the next revision starts?
  fr: |
    L'API de recommandation de Fabrikam démarre la distribution OpenTelemetry Azure Monitor avec l'appel suivant :

    ```text
    configure_azure_monitor(sampling_ratio=0.5)
    ```

    Un opérateur ajoute ensuite ces variables d'environnement à l'application conteneur sans modifier l'image :

    ```text
    OTEL_TRACES_SAMPLER=microsoft.rate_limited
    OTEL_TRACES_SAMPLER_ARG=2
    ```

    Quel échantillonnage des traces l'API applique-t-elle après le démarrage de la révision suivante ?
body:
  options:
    - id: a
      text: { en: "A fixed percentage: about 50 % of the traces are kept.", fr: "Un pourcentage fixe : environ 50 % des traces sont conservées." }
    - id: b
      text: { en: "Both: about 50 % of the traces are kept, with a maximum of two traces per second.", fr: "Les deux : environ 50 % des traces sont conservées, avec un maximum de deux traces par seconde." }
    - id: c
      text: { en: "The default sampler: at most five traces per second, because the two settings conflict.", fr: "L'échantillonneur par défaut : au plus cinq traces par seconde, car les deux paramètres sont en conflit." }
    - id: d
      text: { en: "Rate-limited: at most about two traces per second are kept.", fr: "Limité par débit : au plus environ deux traces par seconde sont conservées." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The sampling configuration set by environment variables takes precedence over the sampling options passed to the distro in code. `microsoft.rate_limited` selects the rate-limited sampler, and its argument is the maximum number of traces per second, here 2.
    fr: |-
      La configuration d'échantillonnage définie par les variables d'environnement est prioritaire sur les options d'échantillonnage passées à la distribution dans le code. `microsoft.rate_limited` sélectionne l'échantillonneur limité par débit, dont l'argument est le nombre maximal de traces par seconde, ici 2.
  options:
    a:
      en: "`sampling_ratio` would apply only if no sampler were set by environment variables."
      fr: "`sampling_ratio` ne s'appliquerait que si aucun échantillonneur n'était défini par variables d'environnement."
    b:
      en: |-
        Only one sampler is active; the two settings aren't combined.
      fr: |-
        Un seul échantillonneur est actif ; les deux paramètres ne sont pas combinés.
    c:
      en: |-
        The default of five traces per second applies only when no sampler is configured; here the environment variables define one.
      fr: |-
        La valeur par défaut de cinq traces par seconde ne s'applique que si aucun échantillonneur n'est configuré ; ici, les variables d'environnement en définissent un.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
