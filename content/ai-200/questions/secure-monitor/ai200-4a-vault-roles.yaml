id: ai200-4a-vault-roles
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is deploying an AI claims-processing solution. A key vault named kv-claims uses the Azure RBAC permission model. Three identities need access to kv-claims, and each must receive only the permissions it needs.

    Which role should you assign to each identity at the scope of kv-claims? To answer, drag the appropriate roles to the correct identities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind déploie une solution IA de traitement des sinistres. Un coffre de clés nommé kv-claims utilise le modèle d'autorisation Azure RBAC. Trois identités ont besoin d'accéder à kv-claims, et chacune ne doit recevoir que les autorisations dont elle a besoin.

    Quel rôle devez-vous attribuer à chaque identité à l'étendue de kv-claims ? Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: user, text: Key Vault Secrets User }
    - { id: officer, text: Key Vault Secrets Officer }
    - { id: reader, text: Key Vault Reader }
    - { id: admin, text: Key Vault Administrator }
    - { id: contrib, text: Key Vault Contributor }
    - { id: certuser, text: Key Vault Certificate User }
  targets:
    - id: api
      text: { en: "The managed identity of the claims API, which reads the values of three secrets at startup", fr: "L'identité managée de l'API des sinistres, qui lit les valeurs de trois secrets au démarrage" }
    - id: rotator
      text: { en: "The managed identity of a rotation function, which writes new secret versions and updates their tags", fr: "L'identité managée d'une fonction de rotation, qui écrit de nouvelles versions de secrets et met à jour leurs balises" }
    - id: dashboard
      text: { en: "The managed identity of a compliance dashboard, which shows secret names and expiration dates but never values", fr: "L'identité managée d'un tableau de bord de conformité, qui affiche les noms et dates d'expiration des secrets mais jamais leurs valeurs" }
answer:
  mapping: { api: user, rotator: officer, dashboard: reader }
explanation:
  correct:
    en: |
      Key Vault Secrets User reads secret contents, which is all the API needs. Key Vault Secrets Officer performs any action on secrets except managing permissions, so the rotation function can write versions and update properties. Key Vault Reader reads the metadata of secrets, such as names and dates, and can't read values.
    fr: |
      Key Vault Secrets User lit le contenu des secrets, ce dont l'API a uniquement besoin. Key Vault Secrets Officer effectue toute action sur les secrets sauf la gestion des autorisations : la fonction de rotation peut écrire des versions et mettre à jour les propriétés. Key Vault Reader lit les métadonnées des secrets, comme les noms et les dates, et ne peut pas lire les valeurs.
  options:
    admin: { en: "Key Vault Administrator covers every data-plane operation on keys, secrets and certificates, which exceeds every need here.", fr: "Key Vault Administrator couvre toutes les opérations du plan de données sur les clés, secrets et certificats, ce qui dépasse chacun des besoins." }
    contrib: { en: "Key Vault Contributor manages the vault resource and gives no access to secrets.", fr: "Key Vault Contributor gère la ressource coffre et ne donne aucun accès aux secrets." }
    certuser: { en: "Key Vault Certificate User reads certificate contents, not ordinary secrets.", fr: "Key Vault Certificate User lit le contenu des certificats, pas les secrets ordinaires." }
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
