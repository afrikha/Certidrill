id: ai200-4b-kql-logs-by-operation
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's Flask RAG API writes warning logs with Python logging, collected by the Azure Monitor OpenTelemetry Distro. The logs are written while requests are processed.

    You need the number of warning rows in `AppTraces` for each API operation (such as `POST /chat`) during the last day. The query must not join another table.

    Which grouping column should you use in `summarize count() by ...`?
  fr: |
    L'API RAG Flask de Fabrikam écrit des journaux d'avertissement avec la journalisation Python, collectés par la distribution OpenTelemetry Azure Monitor. Les journaux sont écrits pendant le traitement des requêtes.

    Vous avez besoin du nombre de lignes d'avertissement de `AppTraces` pour chaque opération d'API (par exemple `POST /chat`) au cours de la dernière journée. La requête ne doit joindre aucune autre table.

    Quelle colonne de regroupement devez-vous utiliser dans `summarize count() by ...` ?
body:
  options:
    - { id: a, text: OperationId }
    - { id: b, text: AppRoleName }
    - { id: c, text: ParentId }
    - { id: d, text: OperationName }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Telemetry items created during a request inherit the name of the containing operation in `OperationName`, whose values typically match the `Name` values of `AppRequests`. Grouping `AppTraces` by `OperationName` gives the count per API operation without a join.
    fr: |-
      Les éléments de télémétrie créés pendant une requête héritent du nom de l'opération qui les contient dans `OperationName`, dont les valeurs correspondent généralement aux valeurs `Name` de `AppRequests`. Regrouper `AppTraces` par `OperationName` donne le nombre par opération d'API sans jointure.
  options:
    a:
      en: "`OperationId` identifies one distributed operation, so the count would be per request instead of per API operation."
      fr: "`OperationId` identifie une opération distribuée : le nombre serait calculé par requête et non par opération d'API."
    b:
      en: "`AppRoleName` identifies the service, so all the operations of the API would be grouped together."
      fr: "`AppRoleName` identifie le service : toutes les opérations de l'API seraient regroupées."
    c:
      en: "`ParentId` is the ID of the immediate parent span, which differs for every request."
      fr: "`ParentId` est l'ID de l'étendue parente immédiate, différent pour chaque requête."
references:
