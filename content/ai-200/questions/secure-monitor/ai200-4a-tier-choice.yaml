id: ai200-4a-tier-choice
objective: "4.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin needs three App Configuration stores for its Python AI services. For each store, you must choose the lowest-cost tier that meets the requirements.

    Which tier should you choose for each store? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin a besoin de trois magasins App Configuration pour ses services IA Python. Pour chaque magasin, vous devez choisir le niveau le moins coûteux qui respecte les exigences.

    Quel niveau devez-vous choisir pour chaque magasin ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Prototype store, about 300 requests per day, no charge allowed: [[proto]]
      Shared development store, about 4,000 requests per hour, no SLA required: [[dev]]
      Production store, 99.99% SLA with geo-replication, requests must never be limited by a quota: [[prod]]
    fr: |
      Magasin de prototype, environ 300 requêtes par jour, aucun coût autorisé : [[proto]]
      Magasin de développement partagé, environ 4 000 requêtes par heure, aucun SLA requis : [[dev]]
      Magasin de production, SLA de 99,99 % avec géoréplication, les requêtes ne doivent jamais être limitées par un quota : [[prod]]
  slots:
    - id: proto
      options:
        - { id: free, text: Free }
        - { id: developer, text: Developer }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: dev
      options:
        - { id: free, text: Free }
        - { id: developer, text: Developer }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: prod
      options:
        - { id: free, text: Free }
        - { id: developer, text: Developer }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
answer:
  values: { proto: free, dev: developer, prod: premium }
explanation:
  correct:
    en: |
      Free costs nothing and allows 1,000 requests per day. Developer allows 6,000 requests per hour with no SLA, which covers 4,000 requests per hour at a lower cost than Standard (30,000 requests per hour). Only Premium has no request quota and a 99.99% SLA with geo-replication; Standard reaches 99.95% with geo-replication.
    fr: |
      Free ne coûte rien et autorise 1 000 requêtes par jour. Developer autorise 6 000 requêtes par heure sans SLA, ce qui couvre 4 000 requêtes par heure pour un coût inférieur à Standard (30 000 requêtes par heure). Seul Premium n'a aucun quota de requêtes et offre un SLA de 99,99 % avec géoréplication ; Standard atteint 99,95 % avec géoréplication.
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
