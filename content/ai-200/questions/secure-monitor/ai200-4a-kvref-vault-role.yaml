id: ai200-4a-kvref-vault-role
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a Python support chatbot on Azure Container Apps. The chatbot loads its settings from an App Configuration store named appcs-contoso by calling `load()` with `credential=DefaultAzureCredential()` and `keyvault_credential=DefaultAzureCredential()`. The key `Chat:PartnerKey` is a Key Vault reference to a secret in a key vault named kv-contoso.

    The container app's managed identity has the App Configuration Data Reader role on appcs-contoso. Plain key-values load correctly, but resolving Chat:PartnerKey fails with an authorization error from kv-contoso.

    What should you do?
  fr: |
    Contoso exécute un chatbot de support Python sur Azure Container Apps. Le chatbot charge ses paramètres depuis un magasin App Configuration nommé appcs-contoso en appelant `load()` avec `credential=DefaultAzureCredential()` et `keyvault_credential=DefaultAzureCredential()`. La clé `Chat:PartnerKey` est une référence Key Vault vers un secret d'un coffre de clés nommé kv-contoso.

    L'identité managée de l'application conteneur a le rôle App Configuration Data Reader sur appcs-contoso. Les clés-valeurs ordinaires se chargent correctement, mais la résolution de Chat:PartnerKey échoue avec une erreur d'autorisation de kv-contoso.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the App Configuration Data Owner role on appcs-contoso to the container app's managed identity.", fr: "Attribuer le rôle App Configuration Data Owner sur appcs-contoso à l'identité managée de l'application conteneur." } }
    - { id: b, text: { en: "Enable a managed identity on appcs-contoso and assign it the Key Vault Secrets User role on kv-contoso.", fr: "Activer une identité managée sur appcs-contoso et lui attribuer le rôle Key Vault Secrets User sur kv-contoso." } }
    - { id: c, text: { en: "Assign the Key Vault Secrets User role on kv-contoso to the container app's managed identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-contoso à l'identité managée de l'application conteneur." } }
    - { id: d, text: { en: "Assign the Key Vault Reader role on kv-contoso to the container app's managed identity.", fr: "Attribuer le rôle Key Vault Reader sur kv-contoso à l'identité managée de l'application conteneur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Key Vault reference stores only the URI of the secret. App Configuration never accesses the vault: the application reads the secret directly with `keyvault_credential`, so the app's identity needs a role that reads secret contents, Key Vault Secrets User, on kv-contoso.
    fr: |
      Une référence Key Vault ne stocke que l'URI du secret. App Configuration n'accède jamais au coffre : l'application lit directement le secret avec `keyvault_credential`. L'identité de l'application a donc besoin d'un rôle qui lit le contenu des secrets, Key Vault Secrets User, sur kv-contoso.
  options:
    a: { en: "The error comes from kv-contoso; a broader App Configuration role doesn't grant access to the vault.", fr: "L'erreur vient de kv-contoso : un rôle App Configuration plus large ne donne pas accès au coffre." }
    b: { en: "App Configuration and Key Vault don't communicate; the store's identity is never used to read the secret.", fr: "App Configuration et Key Vault ne communiquent pas : l'identité du magasin n'est jamais utilisée pour lire le secret." }
    d: { en: "Key Vault Reader reads metadata only and can't read secret values.", fr: "Key Vault Reader ne lit que les métadonnées et ne peut pas lire les valeurs des secrets." }
references:
  - title: "Tutorial: Use Key Vault references in an ASP.NET Core app"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/use-key-vault-references-dotnet-core
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
