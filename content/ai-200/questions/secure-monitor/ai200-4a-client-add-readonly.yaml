id: ai200-4a-client-add-readonly
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware's deployment pipeline runs a Python script that seeds a new App Configuration store with the `azure-appconfiguration` client library. For the key `Chat:Model` with the label `Prod`, the script must create the key-value only if it doesn't exist yet, without overwriting a value set by an operator, and then make it read-only. The script uses Microsoft Entra authentication.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline de déploiement de Proseware exécute un script Python qui alimente un nouveau magasin App Configuration avec la bibliothèque cliente `azure-appconfiguration`. Pour la clé `Chat:Model` avec l'étiquette `Prod`, le script doit créer la clé-valeur uniquement si elle n'existe pas encore, sans écraser une valeur définie par un opérateur, puis la mettre en lecture seule. Le script utilise l'authentification Microsoft Entra.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.appconfiguration import AzureAppConfigurationClient, ConfigurationSetting
    from azure.identity import DefaultAzureCredential

    client = AzureAppConfigurationClient(
        [[param]]=os.environ["AZURE_APPCONFIG_ENDPOINT"],
        credential=DefaultAzureCredential(),
    )
    setting = ConfigurationSetting(key="Chat:Model", label="Prod", value="gpt-4o-mini")
    created = client.[[create]](setting)
    client.[[protect]](created)
  slots:
    - id: param
      options:
        - { id: baseurl, text: base_url }
        - { id: vaulturl, text: vault_url }
        - { id: connstr, text: connection_string }
    - id: create
      options:
        - { id: add, text: add_configuration_setting }
        - { id: set, text: set_configuration_setting }
        - { id: get, text: get_configuration_setting }
    - id: protect
      options:
        - { id: readonly, text: set_read_only }
        - { id: delete, text: delete_configuration_setting }
        - { id: revisions, text: list_revisions }
answer:
  values: { param: baseurl, create: add, protect: readonly }
explanation:
  correct:
    en: |
      With Microsoft Entra ID, the client is built with `base_url` (the store endpoint) and a credential. `add_configuration_setting` creates a setting only if it doesn't already exist, whereas `set_configuration_setting` creates or overrides it. `set_read_only` then locks the setting.
    fr: |
      Avec Microsoft Entra ID, le client est créé avec `base_url` (le point de terminaison du magasin) et une information d'identification. `add_configuration_setting` ne crée un paramètre que s'il n'existe pas déjà, alors que `set_configuration_setting` le crée ou l'écrase. `set_read_only` verrouille ensuite le paramètre.
  options:
    vaulturl: { en: "`vault_url` belongs to the Key Vault `SecretClient`.", fr: "`vault_url` appartient au `SecretClient` de Key Vault." }
    connstr: { en: "A connection string contains an access key and is passed to `from_connection_string`, not with a credential.", fr: "Une chaîne de connexion contient une clé d'accès et se passe à `from_connection_string`, pas avec une information d'identification." }
    set: { en: "`set_configuration_setting` overwrites an existing value, which the script must not do.", fr: "`set_configuration_setting` écrase une valeur existante, ce que le script ne doit pas faire." }
references:
  - title: Azure App Configuration client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/appconfiguration-readme
