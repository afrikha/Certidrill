id: ai200-4a-dual-rotation-steps
objective: "4.1.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso stores the active access key of a storage account as a secret named `storageKey` in a key vault named kv-contoso. Each version of storageKey has a `CredentialId` tag whose value is `key1` or `key2`, and an expiration date. An Event Grid subscription sends `Microsoft.KeyVault.SecretNearExpiry` events for storageKey to a Python function.

    You need to write the function so that applications that use storageKey keep a valid key during the whole rotation.

    Which three actions should the function perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso stocke la clé d'accès active d'un compte de stockage sous forme de secret nommé `storageKey` dans un coffre de clés nommé kv-contoso. Chaque version de storageKey possède une balise `CredentialId` dont la valeur est `key1` ou `key2`, et une date d'expiration. Un abonnement Event Grid envoie les événements `Microsoft.KeyVault.SecretNearExpiry` de storageKey à une fonction Python.

    Vous devez écrire la fonction de sorte que les applications qui utilisent storageKey conservent une clé valide pendant toute la rotation.

    Quelles sont les trois actions que la fonction doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: readtag, text: { en: "Read the `CredentialId` tag of the current version of storageKey.", fr: "Lire la balise `CredentialId` de la version actuelle de storageKey." } }
    - { id: regenother, text: { en: "Regenerate the storage account key that isn't named in that tag.", fr: "Régénérer la clé du compte de stockage qui n'est pas nommée dans cette balise." } }
    - { id: setnew, text: { en: "Add the regenerated key as a new version of storageKey, with `CredentialId` set to that key and a new expiration date.", fr: "Ajouter la clé régénérée comme nouvelle version de storageKey, avec `CredentialId` défini sur cette clé et une nouvelle date d'expiration." } }
    - { id: regencurrent, text: { en: "Regenerate the storage account key that is named in that tag.", fr: "Régénérer la clé du compte de stockage qui est nommée dans cette balise." } }
    - { id: disable, text: { en: "Disable the current version of storageKey.", fr: "Désactiver la version actuelle de storageKey." } }
    - { id: purge, text: { en: "Delete storageKey and purge it from kv-contoso.", fr: "Supprimer storageKey et le vider de kv-contoso." } }
answer:
  sequence: [ readtag, regenother, setnew ]
explanation:
  correct:
    en: |
      In the dual-credential pattern, the function first finds which key the current version holds, then regenerates the alternate key, and finally stores that key as a new version with updated tags and expiration. The key in use is never regenerated, so applications keep working with it until they read the new version.
    fr: |
      Dans le modèle à double information d'identification, la fonction détermine d'abord quelle clé contient la version actuelle, régénère ensuite l'autre clé et stocke enfin cette clé comme nouvelle version avec des balises et une expiration à jour. La clé en cours d'utilisation n'est jamais régénérée : les applications continuent de l'utiliser jusqu'à ce qu'elles lisent la nouvelle version.
  options:
    regencurrent: { en: "Regenerating the key in use invalidates it at once, so applications fail until they read a new value.", fr: "Régénérer la clé en cours d'utilisation l'invalide immédiatement : les applications échouent jusqu'à ce qu'elles lisent une nouvelle valeur." }
    disable: { en: "Disabling the current version makes reads of the secret fail before a replacement exists.", fr: "Désactiver la version actuelle fait échouer les lectures du secret avant qu'un remplacement existe." }
    purge: { en: "Deleting the secret removes the value that applications use; rotation only adds a version.", fr: "Supprimer le secret retire la valeur qu'utilisent les applications ; la rotation ajoute seulement une version." }
references:
  - title: Automate the rotation of a secret for resources that have two sets of authentication credentials
    url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/tutorial-rotation-dual
