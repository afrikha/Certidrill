id: ai200-sr2-partner-secret-1
objective: "4.1.1"
type: series_yesno
series: ai200-sr2-partner-secret
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You assign the Key Vault Reader role and call get_secret without a version.
  fr: Vous attribuez le rôle Key Vault Reader et appelez get_secret sans version.
body:
  solution:
    en: |
      You assign the **Key Vault Reader** role to id-nw-reco on kv-nw-reco. Each time the API needs the key, it runs the following code.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key").value
      ```
    fr: |
      Vous attribuez le rôle **Key Vault Reader** à id-nw-reco sur kv-nw-reco. Chaque fois que l'API a besoin de la clé, elle exécute le code suivant.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key").value
      ```
answer: { value: false }
explanation:
  correct:
    en: Key Vault Reader allows reading the metadata of the vault and of its secrets, but not secret contents. The get_secret call is denied, so the API cannot obtain the value of partner-api-key.
    fr: "Key Vault Reader permet de lire les métadonnées du coffre et de ses secrets, mais pas le contenu des secrets. L'appel get_secret est refusé : l'API ne peut pas obtenir la valeur de partner-api-key."
references:
  - title: Grant permission to applications to access an Azure key vault using Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
