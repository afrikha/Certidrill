id: ai200-cs1c-turbine-attribute
objective: "4.2.1"
type: single
caseStudy: ai200-cs1c-litware
difficulty: 2
status: draft
stem:
  en: |
    In the FieldAssist request handlers, `turbine_id` contains the ID of the turbine of the request. The OpenTelemetry API is imported with `from opentelemetry import trace`.

    You need to meet the tracing requirement. Which code should you add to each request handler?
  fr: |
    Dans les gestionnaires de requêtes de FieldAssist, `turbine_id` contient l'ID de l'éolienne de la requête. L'API OpenTelemetry est importée avec `from opentelemetry import trace`.

    Vous devez satisfaire l'exigence relative au traçage. Quel code devez-vous ajouter à chaque gestionnaire de requêtes ?
body:
  options:
    - { id: a, text: "with trace.get_tracer(__name__).start_as_current_span(\"turbine\") as span: span.set_attribute(\"turbine.id\", turbine_id)" }
    - { id: b, text: "logging.getLogger(__name__).info(\"turbine\", extra={\"turbine.id\": turbine_id})" }
    - { id: c, text: "trace.get_current_span().set_attribute(\"turbine.id\", turbine_id)" }
    - { id: d, text: "trace.get_current_span().add_event(\"turbine\", {\"turbine.id\": turbine_id})" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Inside a request handler, the current span is the request span created by the web framework instrumentation. Adding an attribute to it exports the turbine ID as a custom property (customDimensions) of the request telemetry, so the requests can be searched by turbine ID and no other telemetry item is created.
    fr: |
      Dans un gestionnaire de requêtes, l'étendue actuelle est l'étendue de requête créée par l'instrumentation du framework web. Lui ajouter un attribut exporte l'ID de l'éolienne comme propriété personnalisée (customDimensions) de la télémétrie de la requête : les requêtes peuvent être recherchées par ID d'éolienne et aucun autre élément de télémétrie n'est créé.
  options:
    a:
      en: "A new span is exported as an additional telemetry item, and the attribute is set on that child span, not on the request."
      fr: "Une nouvelle étendue est exportée comme élément de télémétrie supplémentaire, et l'attribut est défini sur cette étendue enfant, pas sur la requête."
    b:
      en: "A log record becomes a separate trace telemetry item; the request telemetry does not get the turbine ID."
      fr: "Un enregistrement de journal devient un élément de télémétrie de trace distinct ; la télémétrie de la requête ne reçoit pas l'ID de l'éolienne."
    d:
      en: "A span event is recorded as a separate timestamped event of the span, not as a custom property of the request telemetry."
      fr: "Un événement d'étendue est enregistré comme un événement horodaté distinct de l'étendue, pas comme une propriété personnalisée de la télémétrie de la requête."
references:
  - title: Add and modify OpenTelemetry for .NET, Java, Node.js, and Python applications
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
