id: ai200-4b-functions-duplicate-logs
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts a Python document-summarization function app in Azure Functions. The app calls `configure_azure_monitor()` at startup to send OpenTelemetry traces and logs to Application Insights.

    Every log record written by the functions now appears twice in `AppTraces`: once from the Azure Functions worker and once from the distro. You need each record to appear once, and the distro must remain the source of the log telemetry.

    Which two actions achieve this goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso héberge dans Azure Functions une application de fonction Python de synthèse de documents. L'application appelle `configure_azure_monitor()` au démarrage pour envoyer les traces et les journaux OpenTelemetry à Application Insights.

    Chaque enregistrement de journal écrit par les fonctions apparaît désormais deux fois dans `AppTraces` : une fois depuis le worker Azure Functions et une fois depuis la distribution. Chaque enregistrement doit n'apparaître qu'une fois, et la distribution doit rester la source de la télémétrie de journaux.

    Quelles sont les deux actions qui permettent d'atteindre cet objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove all the handlers of the root logger before any logger is created and before `configure_azure_monitor()` is called.
        fr: |-
          Supprimer tous les gestionnaires de l'enregistreur racine avant la création de tout enregistreur et avant l'appel de `configure_azure_monitor()`.
    - id: b
      text:
        en: |-
          Set the `OTEL_LOGS_EXPORTER` application setting to `None`.
        fr: |-
          Définir le paramètre d'application `OTEL_LOGS_EXPORTER` sur `None`.
    - id: c
      text:
        en: |-
          In host.json, set `logging.logLevel.default` to `None`.
        fr: |-
          Dans host.json, définir `logging.logLevel.default` sur `None`.
    - id: d
      text:
        en: |-
          Call `configure_azure_monitor()` inside each function instead of at startup.
        fr: |-
          Appeler `configure_azure_monitor()` dans chaque fonction plutôt qu'au démarrage.
    - id: e
      text:
        en: |-
          Set the `OTEL_TRACES_SAMPLER` application setting to `microsoft.fixed_percentage` with an argument of `0.5`.
        fr: |-
          Définir le paramètre d'application `OTEL_TRACES_SAMPLER` sur `microsoft.fixed_percentage` avec l'argument `0.5`.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The Functions worker sends its own logging telemetry, independently of the distro. Microsoft recommends keeping only the distro, either by clearing the handlers of the root logger before loggers and `configure_azure_monitor()` are set up, or by disabling the worker's logging with a default log level of None in host.json.
    fr: |-
      Le worker Functions envoie sa propre télémétrie de journaux, indépendamment de la distribution. Microsoft recommande de ne conserver que la distribution, soit en vidant les gestionnaires de l'enregistreur racine avant la configuration des enregistreurs et de `configure_azure_monitor()`, soit en désactivant la journalisation du worker avec un niveau de journal par défaut None dans host.json.
  options:
    b:
      en: |-
        This disables the logs exported by the distro and keeps those of the worker, the opposite of the requirement.
      fr: |-
        Ce paramètre désactive les journaux exportés par la distribution et conserve ceux du worker, l'inverse de l'exigence.
    d:
      en: |-
        Initializing the distro on every invocation adds providers and doesn't stop the worker from sending its copy.
      fr: |-
        Initialiser la distribution à chaque appel ajoute des fournisseurs et n'empêche pas le worker d'envoyer sa copie.
    e:
      en: |-
        Trace sampling reduces the number of traces kept; it doesn't remove the duplicate log source.
      fr: |-
        L'échantillonnage des traces réduit le nombre de traces conservées ; il ne supprime pas la source de journaux en double.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
