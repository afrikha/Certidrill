id: ai200-4a-role-propagation
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Lamna Healthcare is moving a Python scheduling API from an App Configuration connection string to Microsoft Entra authentication. Five minutes ago, you assigned the App Configuration Data Reader role on the store to the API's managed identity and deployed code that calls `load()` with the store endpoint and `DefaultAzureCredential()`. The API now receives HTTP 403 responses from App Configuration.

    The API must not use access keys. What should you do?
  fr: |
    Lamna Healthcare fait passer une API de planification Python d'une chaîne de connexion App Configuration à l'authentification Microsoft Entra. Il y a cinq minutes, vous avez attribué le rôle App Configuration Data Reader sur le magasin à l'identité managée de l'API et déployé un code qui appelle `load()` avec le point de terminaison du magasin et `DefaultAzureCredential()`. L'API reçoit maintenant des réponses HTTP 403 d'App Configuration.

    L'API ne doit pas utiliser de clés d'accès. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Wait for the role assignment to propagate, which can take up to 15 minutes, and then retry.", fr: "Attendre la propagation de l'attribution de rôle, qui peut prendre jusqu'à 15 minutes, puis réessayer." } }
    - { id: b, text: { en: "Also assign the App Configuration Reader role on the store to the managed identity.", fr: "Attribuer aussi le rôle App Configuration Reader sur le magasin à l'identité managée." } }
    - { id: c, text: { en: "Assign the Owner role on the store to the managed identity instead.", fr: "Attribuer plutôt le rôle Owner sur le magasin à l'identité managée." } }
    - { id: d, text: { en: "Pass the store's read-only connection string to `load()` until the role works.", fr: "Passer la chaîne de connexion en lecture seule du magasin à `load()` jusqu'à ce que le rôle fonctionne." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      App Configuration Data Reader is the right role to read key-values with Microsoft Entra ID, but Microsoft says to allow up to 15 minutes after a role assignment before the identity can access the data. The 403 responses stop once the assignment has propagated.
    fr: |
      App Configuration Data Reader est le bon rôle pour lire les clés-valeurs avec Microsoft Entra ID, mais Microsoft indique de compter jusqu'à 15 minutes après une attribution de rôle avant que l'identité puisse accéder aux données. Les réponses 403 cessent une fois l'attribution propagée.
  options:
    b: { en: "App Configuration Reader reads the resource but grants no access to key-values.", fr: "App Configuration Reader lit la ressource mais ne donne aucun accès aux clés-valeurs." }
    c: { en: "Owner doesn't grant data access through Microsoft Entra ID; it only allows reading the access keys.", fr: "Owner ne donne pas accès aux données par Microsoft Entra ID ; il permet seulement de lire les clés d'accès." }
    d: { en: "A connection string contains an access key, which the API must not use.", fr: "Une chaîne de connexion contient une clé d'accès, que l'API ne doit pas utiliser." }
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
