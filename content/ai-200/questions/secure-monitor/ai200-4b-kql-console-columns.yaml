id: ai200-4b-kql-console-columns
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware hosts a Python embedding service named **embed-svc** in an Azure Container Apps environment that sends its logs to a Log Analytics workspace. You run the following query to read the lines that the service prints to stdout, and it fails because a column can't be resolved:

    ```kusto
    ContainerAppConsoleLogs_CL
    | where ContainerAppName == "embed-svc"
    | project TimeGenerated, RevisionName, Log
    ```

    What should you do?
  fr: |
    Litware héberge un service Python d'embeddings nommé **embed-svc** dans un environnement Azure Container Apps qui envoie ses journaux à un espace de travail Log Analytics. Vous exécutez la requête suivante pour lire les lignes que le service écrit sur stdout, et elle échoue car une colonne ne peut pas être résolue :

    ```kusto
    ContainerAppConsoleLogs_CL
    | where ContainerAppName == "embed-svc"
    | project TimeGenerated, RevisionName, Log
    ```

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Query the `ContainerAppHTTPLogs` table instead, which has the `ContainerAppName` and `RevisionName` columns.
        fr: |-
          Interroger plutôt la table `ContainerAppHTTPLogs`, qui comporte les colonnes `ContainerAppName` et `RevisionName`.
    - id: b
      text:
        en: |-
          Replace `==` with `=~` so that the comparison ignores the case of the column name.
        fr: |-
          Remplacer `==` par `=~` pour que la comparaison ignore la casse du nom de colonne.
    - id: c
      text:
        en: |-
          Use the `ContainerAppName_s`, `RevisionName_s` and `Log_s` column names.
        fr: |-
          Utiliser les noms de colonnes `ContainerAppName_s`, `RevisionName_s` et `Log_s`.
    - id: d
      text:
        en: |-
          Query the `ContainerLogV2` table instead and filter on the `ContainerName` column.
        fr: |-
          Interroger plutôt la table `ContainerLogV2` et filtrer sur la colonne `ContainerName`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The console and system log tables of Container Apps (`ContainerAppConsoleLogs_CL`, `ContainerAppSystemLogs_CL`) are custom tables whose string columns carry the `_s` suffix, such as `ContainerAppName_s`, `RevisionName_s` and `Log_s`.
    fr: |-
      Les tables de journaux de console et système de Container Apps (`ContainerAppConsoleLogs_CL`, `ContainerAppSystemLogs_CL`) sont des tables personnalisées dont les colonnes de type chaîne portent le suffixe `_s`, comme `ContainerAppName_s`, `RevisionName_s` et `Log_s`.
  options:
    a:
      en: "`ContainerAppHTTPLogs` records ingress HTTP requests, not the lines printed to stdout."
      fr: "`ContainerAppHTTPLogs` enregistre les requêtes HTTP d'entrée, pas les lignes écrites sur stdout."
    b:
      en: "`=~` compares values without regard to case; column names must still exist and are case-sensitive."
      fr: "`=~` compare des valeurs sans tenir compte de la casse ; les noms de colonnes doivent toujours exister et respectent la casse."
    d:
      en: "`ContainerLogV2` holds the container logs of AKS clusters collected by Container insights, not those of Container Apps."
      fr: "`ContainerLogV2` contient les journaux de conteneurs des clusters AKS collectés par Container insights, pas ceux de Container Apps."
references:
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
