id: ai200-4b-kql-extend
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's analysts inspect slow calls to a vector store with the following query in a Log Analytics workspace:

    ```kusto
    AppDependencies
    | where TimeGenerated > ago(1h) and DependencyType == "HTTP"
    ```

    You need to add a column named **DurationSec** that contains the duration in seconds, and every existing column must remain in the results.

    Which line should you append to the query?
  fr: |
    Les analystes de Contoso examinent les appels lents à un magasin de vecteurs avec la requête suivante dans un espace de travail Log Analytics :

    ```kusto
    AppDependencies
    | where TimeGenerated > ago(1h) and DependencyType == "HTTP"
    ```

    Vous devez ajouter une colonne nommée **DurationSec** qui contient la durée en secondes, et toutes les colonnes existantes doivent rester dans les résultats.

    Quelle ligne devez-vous ajouter à la fin de la requête ?
body:
  options:
    - { id: a, text: "`| project DurationSec = DurationMs / 1000`" }
    - { id: b, text: "`| extend DurationSec = DurationMs / 1000`" }
    - { id: c, text: "`| summarize DurationSec = DurationMs / 1000`" }
    - { id: d, text: "`| project-away DurationSec = DurationMs / 1000`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`extend` adds calculated columns and keeps all the columns of the input. `DurationMs` is the duration column of the workspace tables, so dividing it by 1,000 gives seconds."
    fr: "`extend` ajoute des colonnes calculées et conserve toutes les colonnes de l'entrée. `DurationMs` est la colonne de durée des tables de l'espace de travail : la diviser par 1 000 donne des secondes."
  options:
    a:
      en: "`project` returns only the columns it lists, so every other column would be dropped."
      fr: "`project` ne renvoie que les colonnes qu'il liste : toutes les autres colonnes disparaîtraient."
    c:
      en: "`summarize` expects aggregation functions and groups the rows; a plain expression isn't an aggregation."
      fr: "`summarize` attend des fonctions d'agrégation et regroupe les lignes ; une simple expression n'est pas une agrégation."
    d:
      en: "`project-away` removes the named columns; it doesn't accept a calculated column."
      fr: "`project-away` supprime les colonnes nommées ; il n'accepte pas de colonne calculée."
references:
  - title: extend operator
    url: https://learn.microsoft.com/en-us/kusto/query/extend-operator
  - title: Project operator
    url: https://learn.microsoft.com/en-us/kusto/query/project-operator
