id: ai200-sr1-rotated-key-2
objective: "4.1.1"
type: series_yesno
series: ai200-sr1-rotated-key
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign the Key Vault Secrets User role and read the version stored in an app setting.
  fr: Vous attribuez le rôle Key Vault Secrets User et lisez la version stockée dans un paramètre d'application.
body:
  solution:
    en: |
      You assign the **Key Vault Secrets User** role to the managed identity of app-woodgrove-chat at the scope of kv-woodgrove. At each deployment, the pipeline writes the identifier of the current version of search-api-key to an app setting named `SEARCH_KEY_VERSION`. The app reads the key with the following code:

      `api_key = client.get_secret("search-api-key", os.environ["SEARCH_KEY_VERSION"]).value`
    fr: |
      Vous attribuez le rôle **Key Vault Secrets User** à l'identité managée de app-woodgrove-chat à l'étendue de kv-woodgrove. À chaque déploiement, le pipeline écrit l'identificateur de la version actuelle de search-api-key dans un paramètre d'application nommé `SEARCH_KEY_VERSION`. L'application lit la clé avec le code suivant :

      `api_key = client.get_secret("search-api-key", os.environ["SEARCH_KEY_VERSION"]).value`
answer: { value: false }
explanation:
  correct:
    en: When a version is passed to `get_secret`, the client returns that exact version instead of the latest one. After a rotation, the app keeps reading the old version, which is disabled one day later, until `SEARCH_KEY_VERSION` is changed by a new deployment, which the requirements prohibit.
    fr: "Lorsqu'une version est transmise à `get_secret`, le client renvoie exactement cette version au lieu de la plus récente. Après un renouvellement, l'application continue de lire l'ancienne version, désactivée un jour plus tard, jusqu'à ce qu'un nouveau déploiement modifie `SEARCH_KEY_VERSION`, ce que les exigences interdisent."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
