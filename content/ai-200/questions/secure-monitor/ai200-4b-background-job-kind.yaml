id: ai200-4b-background-job-kind
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a Python worker in Azure Container Apps that polls an Azure Database for PostgreSQL table every minute and re-embeds the changed product descriptions. The worker uses no web framework, and no instrumented request starts the polling loop. It uses the Azure Monitor OpenTelemetry Distro.

    Each batch is wrapped in `tracer.start_as_current_span("reembed-batch")`. The batches appear in `AppDependencies` with the dependency type `InProc`. You need each batch to be recorded in `AppRequests` so that its duration and failures appear as an operation.

    What should you do?
  fr: |
    Tailspin Toys exécute dans Azure Container Apps un worker Python qui interroge chaque minute une table Azure Database pour PostgreSQL et recalcule les embeddings des descriptions de produits modifiées. Le worker n'utilise aucune infrastructure web, et aucune requête instrumentée ne démarre la boucle d'interrogation. Il utilise la distribution OpenTelemetry Azure Monitor.

    Chaque lot est encapsulé dans `tracer.start_as_current_span("reembed-batch")`. Les lots apparaissent dans `AppDependencies` avec le type de dépendance `InProc`. Vous devez faire enregistrer chaque lot dans `AppRequests` pour que sa durée et ses échecs apparaissent comme une opération.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Pass `kind=SpanKind.CLIENT` to `start_as_current_span`.
        fr: |-
          Passer `kind=SpanKind.CLIENT` à `start_as_current_span`.
    - id: b
      text:
        en: |-
          Pass `kind=SpanKind.SERVER` to `start_as_current_span`.
        fr: |-
          Passer `kind=SpanKind.SERVER` à `start_as_current_span`.
    - id: c
      text:
        en: |-
          Pass `kind=SpanKind.PRODUCER` to `start_as_current_span`.
        fr: |-
          Passer `kind=SpanKind.PRODUCER` à `start_as_current_span`.
    - id: d
      text:
        en: |-
          Call `span.set_attribute("span.kind", "server")` inside the span.
        fr: |-
          Appeler `span.set_attribute("span.kind", "server")` dans l'étendue.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A span created with the default kind (INTERNAL) is exported as a dependency of type InProc. For a background job that autoinstrumentation doesn't capture, Microsoft recommends `kind=SpanKind.SERVER`, which makes Application Insights store the span in the requests table.
    fr: |-
      Une étendue (span) créée avec le type par défaut (INTERNAL) est exportée comme dépendance de type InProc. Pour un traitement en arrière-plan que l'instrumentation automatique ne capture pas, Microsoft recommande `kind=SpanKind.SERVER`, qui fait stocker l'étendue dans la table des requêtes par Application Insights.
  options:
    a:
      en: |-
        CLIENT spans describe outgoing calls and are exported as dependencies.
      fr: |-
        Les étendues CLIENT décrivent des appels sortants et sont exportées comme dépendances.
    c:
      en: |-
        PRODUCER spans describe sending a message and are exported as dependencies.
      fr: |-
        Les étendues PRODUCER décrivent l'envoi d'un message et sont exportées comme dépendances.
    d:
      en: |-
        The span kind is set when the span starts, through the `kind` argument; an attribute with this name is only exported as a custom property.
      fr: |-
        Le type de l'étendue est fixé à son démarrage, par l'argument `kind` ; un attribut portant ce nom n'est exporté que comme propriété personnalisée.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
