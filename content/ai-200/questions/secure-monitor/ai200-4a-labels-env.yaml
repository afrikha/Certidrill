id: ai200-4a-labels-env
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has one App Configuration store named appcs-fabrikam for its document-search services. The services must read the same key names, such as `Search:IndexName` and `Search:TopK`, in the Dev, Test and Prod environments, but with different values in each environment. Each service selects its environment at startup.

    You need to store the values in appcs-fabrikam.

    What should you use?
  fr: |
    Fabrikam dispose d'un magasin App Configuration nommé appcs-fabrikam pour ses services de recherche de documents. Les services doivent lire les mêmes noms de clés, comme `Search:IndexName` et `Search:TopK`, dans les environnements Dev, Test et Prod, mais avec des valeurs différentes dans chaque environnement. Chaque service choisit son environnement au démarrage.

    Vous devez stocker les valeurs dans appcs-fabrikam.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "One key-value for each key and environment, with the environment name as the label", fr: "Une clé-valeur par clé et par environnement, avec le nom de l'environnement comme étiquette" } }
    - { id: b, text: { en: "One key-value for each key and environment, with the environment name as a tag", fr: "Une clé-valeur par clé et par environnement, avec le nom de l'environnement comme balise" } }
    - { id: c, text: { en: "One key-value for each key and environment, with the environment name as the content type", fr: "Une clé-valeur par clé et par environnement, avec le nom de l'environnement comme type de contenu" } }
    - { id: d, text: { en: "One snapshot for each environment, each containing all the keys", fr: "Un instantané par environnement, chacun contenant toutes les clés" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A key-value is identified by its key and its label, so `Search:TopK` with the labels Dev, Test and Prod forms three separate key-values. Each service then selects its environment with a label filter, which is the usual way to vary a setting by environment.
    fr: |
      Une clé-valeur est identifiée par sa clé et son étiquette : `Search:TopK` avec les étiquettes Dev, Test et Prod forme trois clés-valeurs distinctes. Chaque service sélectionne ensuite son environnement avec un filtre d'étiquette, ce qui est la façon habituelle de faire varier un paramètre selon l'environnement.
  options:
    b: { en: "Tags don't identify a key-value: the same key without a label can exist only once, so three environment values can't be stored this way.", fr: "Les balises n'identifient pas une clé-valeur : une même clé sans étiquette ne peut exister qu'une fois, donc trois valeurs d'environnement ne peuvent pas être stockées ainsi." }
    c: { en: "The content type describes the format of the value and doesn't create variants of a key.", fr: "Le type de contenu décrit le format de la valeur et ne crée pas de variantes d'une clé." }
    d: { en: "A snapshot captures existing key-values; it can't hold different values for the same key and label.", fr: "Un instantané capture des clés-valeurs existantes : il ne peut pas contenir des valeurs différentes pour la même clé et la même étiquette." }
references:
  - title: Keys and values
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
