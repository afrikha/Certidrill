id: ai200-4a-selector-precedence
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind's App Configuration store holds default settings for its Python order-assistant as key-values with no label, such as `Orders:TopK=5`. Some keys also have a production value with the label `Prod`, such as `Orders:TopK=8`. In production, the service must use the Prod value when one exists and the default value otherwise.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le magasin App Configuration de Northwind contient les paramètres par défaut de son assistant de commandes Python sous forme de clés-valeurs sans étiquette, comme `Orders:TopK=5`. Certaines clés ont aussi une valeur de production avec l'étiquette `Prod`, comme `Orders:TopK=8`. En production, le service doit utiliser la valeur Prod quand elle existe et la valeur par défaut sinon.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    config = load(
        endpoint=os.environ["AZURE_APPCONFIG_ENDPOINT"],
        credential=DefaultAzureCredential(),
        selects=[
            SettingSelector(key_filter="Orders:*", label_filter=[[first]]),
            SettingSelector(key_filter="Orders:*", label_filter=[[second]]),
        ],
    )
    top_k = int(config["Orders:TopK"])
  slots:
    - id: first
      options:
        - { id: nolabel, text: "\"\\0\"" }
        - { id: prod, text: "\"Prod\"" }
        - { id: any, text: "\"*\"" }
    - id: second
      options:
        - { id: nolabel, text: "\"\\0\"" }
        - { id: prod, text: "\"Prod\"" }
        - { id: any, text: "\"*\"" }
answer:
  values: { first: nolabel, second: prod }
explanation:
  correct:
    en: |
      Selectors are loaded in the order in which they are listed, and when two selectors return the same key, the value from the last one wins. Loading the unlabeled defaults (`"\0"`) first and the Prod values second makes the Prod value override the default only for the keys that have one.
    fr: |
      Les sélecteurs sont chargés dans l'ordre de la liste, et quand deux sélecteurs renvoient la même clé, la valeur du dernier l'emporte. Charger d'abord les valeurs par défaut sans étiquette (`"\0"`), puis les valeurs Prod, fait remplacer la valeur par défaut par la valeur Prod uniquement pour les clés qui en ont une.
  options:
    any: { en: "`\"*\"` matches every label, including Dev or test labels that production must not load.", fr: "`\"*\"` correspond à toutes les étiquettes, y compris des étiquettes Dev ou de test que la production ne doit pas charger." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
