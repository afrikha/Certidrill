id: ai200-4a-async-client
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Trey Research is building an asynchronous Python API with FastAPI that answers questions over research papers. Each request reads a secret from a key vault named kv-trey. The request handlers are `async def` functions, and reading the secret must not block the event loop. The `aiohttp` package is installed.

    Which two imports should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trey Research développe une API Python asynchrone avec FastAPI qui répond à des questions sur des articles de recherche. Chaque requête lit un secret dans un coffre de clés nommé kv-trey. Les gestionnaires de requêtes sont des fonctions `async def`, et la lecture du secret ne doit pas bloquer la boucle d'événements. Le package `aiohttp` est installé.

    Quelles sont les deux importations à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "from azure.keyvault.secrets import SecretClient" }
    - { id: b, text: "from azure.keyvault.secrets.aio import SecretClient" }
    - { id: c, text: "from azure.identity import DefaultAzureCredential" }
    - { id: d, text: "from azure.identity.aio import DefaultAzureCredential" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The asynchronous Key Vault client is in `azure.keyvault.secrets.aio`, and it needs an asynchronous credential from `azure.identity.aio` plus an async transport such as aiohttp. Calls are then awaited (`await client.get_secret(...)`), and the client and credential should be closed when no longer needed.
    fr: |
      Le client Key Vault asynchrone se trouve dans `azure.keyvault.secrets.aio` et a besoin d'une information d'identification asynchrone de `azure.identity.aio` ainsi que d'un transport asynchrone comme aiohttp. Les appels sont alors attendus (`await client.get_secret(...)`), et le client et l'information d'identification doivent être fermés quand ils ne servent plus.
  options:
    a: { en: "The synchronous client performs blocking calls that stop the event loop during each request.", fr: "Le client synchrone effectue des appels bloquants qui arrêtent la boucle d'événements pendant chaque requête." }
    c: { en: "The asynchronous client needs an asynchronous credential; the synchronous one is for the synchronous client.", fr: "Le client asynchrone a besoin d'une information d'identification asynchrone ; la synchrone est destinée au client synchrone." }
references:
  - title: Azure Key Vault Secrets client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-secrets-readme
