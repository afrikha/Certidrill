id: ai200-sr1-rotated-key-1
objective: "4.1.1"
type: series_yesno
series: ai200-sr1-rotated-key
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You assign the Key Vault Reader role and read the secret by name.
  fr: Vous attribuez le rôle Key Vault Reader et lisez le secret par son nom.
body:
  solution:
    en: |
      You assign the **Key Vault Reader** role to the managed identity of app-woodgrove-chat at the scope of kv-woodgrove. The app reads the key with the following code:

      `api_key = client.get_secret("search-api-key").value`
    fr: |
      Vous attribuez le rôle **Key Vault Reader** à l'identité managée de app-woodgrove-chat à l'étendue de kv-woodgrove. L'application lit la clé avec le code suivant :

      `api_key = client.get_secret("search-api-key").value`
answer: { value: false }
explanation:
  correct:
    en: Key Vault Reader only reads the metadata of the vault and of its secrets, keys and certificates; it cannot read sensitive values such as secret contents. The `get_secret` call is denied, so the app never obtains the API key.
    fr: "Key Vault Reader lit uniquement les métadonnées du coffre et de ses secrets, clés et certificats ; il ne peut pas lire les valeurs sensibles telles que le contenu des secrets. L'appel à `get_secret` est refusé : l'application n'obtient jamais la clé API."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
