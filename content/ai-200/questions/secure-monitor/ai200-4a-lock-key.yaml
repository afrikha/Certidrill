id: ai200-4a-lock-key
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind stores the settings of its pricing assistant in an App Configuration store named appcs-northwind. Several operators have the App Configuration Data Owner role and update many key-values every day. The key-value `Pricing:MaxDiscount` with the label `Prod` must not be modified until the finance team approves a change, after which it must be editable again.

    You need to protect this key-value while the operators keep editing the other key-values.

    What should you do?
  fr: |
    Northwind stocke les paramètres de son assistant de tarification dans un magasin App Configuration nommé appcs-northwind. Plusieurs opérateurs ont le rôle App Configuration Data Owner et mettent à jour de nombreuses clés-valeurs chaque jour. La clé-valeur `Pricing:MaxDiscount` avec l'étiquette `Prod` ne doit pas être modifiée tant que l'équipe financière n'a pas approuvé un changement, après quoi elle doit redevenir modifiable.

    Vous devez protéger cette clé-valeur pendant que les opérateurs continuent de modifier les autres clés-valeurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a snapshot that contains Pricing:MaxDiscount with the label Prod.", fr: "Créer un instantané qui contient Pricing:MaxDiscount avec l'étiquette Prod." } }
    - { id: b, text: "az appconfig kv lock -n appcs-northwind --key Pricing:MaxDiscount --label Prod" }
    - { id: c, text: { en: "Replace the operators' role assignment with App Configuration Data Reader on appcs-northwind.", fr: "Remplacer l'attribution de rôle des opérateurs par App Configuration Data Reader sur appcs-northwind." } }
    - { id: d, text: { en: "Add the tag `readonly=true` to Pricing:MaxDiscount with the label Prod.", fr: "Ajouter la balise `readonly=true` à Pricing:MaxDiscount avec l'étiquette Prod." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `az appconfig kv lock` makes one key-value (key and label) read-only, so updates and deletes fail until someone runs `az appconfig kv unlock`. The SDK equivalent is `set_read_only`. Other key-values stay editable.
    fr: |
      `az appconfig kv lock` rend une clé-valeur (clé et étiquette) en lecture seule : les mises à jour et suppressions échouent jusqu'à ce que quelqu'un exécute `az appconfig kv unlock`. L'équivalent SDK est `set_read_only`. Les autres clés-valeurs restent modifiables.
  options:
    a: { en: "A snapshot keeps an immutable copy, but the key-value in the store can still be changed.", fr: "Un instantané conserve une copie immuable, mais la clé-valeur du magasin peut toujours être modifiée." }
    c: { en: "Data Reader at the store scope blocks every change, not only this key-value.", fr: "Data Reader à l'étendue du magasin bloque toute modification, pas seulement cette clé-valeur." }
    d: { en: "A tag is metadata used for filtering; App Configuration doesn't enforce it.", fr: "Une balise est une métadonnée utilisée pour le filtrage : App Configuration ne l'applique pas." }
references:
  - title: az appconfig kv
    url: https://learn.microsoft.com/en-us/cli/azure/appconfig/kv
  - title: Azure App Configuration client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/appconfiguration-readme
