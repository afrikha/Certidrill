id: ai200-4b-kql-aggregation-functions
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's SRE team writes `summarize` queries on the Application Insights tables of a Python inference API. Sampling is disabled, so every row represents one telemetry item.

    Which aggregation function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe SRE de Fabrikam écrit des requêtes `summarize` sur les tables Application Insights d'une API d'inférence Python. L'échantillonnage est désactivé : chaque ligne représente un élément de télémétrie.

    Quelle fonction d'agrégation devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: countif, text: countif() }
    - { id: argmax, text: arg_max() }
    - { id: makeset, text: make_set() }
    - { id: makelist, text: make_list() }
    - { id: max, text: max() }
  targets:
    - id: slow
      text: { en: "Number of requests per operation that took longer than 2,000 ms", fr: "Nombre de requêtes par opération ayant duré plus de 2 000 ms" }
    - id: latest
      text: { en: "Most recent request of each role instance, with all its columns", fr: "Requête la plus récente de chaque instance de rôle, avec toutes ses colonnes" }
    - id: codes
      text: { en: "Array of the different result codes returned by each operation, without duplicates", fr: "Tableau des différents codes de résultat renvoyés par chaque opération, sans doublons" }
answer:
  mapping: { slow: countif, latest: argmax, codes: makeset }
explanation:
  correct:
    en: "`countif(DurationMs > 2000)` counts the rows that meet the predicate. `arg_max(TimeGenerated, *)` returns the row with the latest timestamp of each group, including all its columns, whereas `max()` returns only the value. `make_set()` builds an array of distinct values; `make_list()` keeps duplicates."
    fr: "`countif(DurationMs > 2000)` compte les lignes qui satisfont le prédicat. `arg_max(TimeGenerated, *)` renvoie la ligne ayant l'horodatage le plus récent de chaque groupe, avec toutes ses colonnes, alors que `max()` ne renvoie que la valeur. `make_set()` construit un tableau de valeurs distinctes ; `make_list()` conserve les doublons."
references:
  - title: arg_max() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/arg-max-aggregation-function
  - title: make_set() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/make-set-aggregation-function
