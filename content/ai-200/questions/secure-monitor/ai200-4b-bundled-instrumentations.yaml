id: ai200-4b-bundled-instrumentations
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's loan-advisor API is a Flask app instrumented with the Azure Monitor OpenTelemetry Distro and its default instrumentations. The API calls a scoring service with the `requests` library and reads customer profiles from Azure Cosmos DB for NoSQL with the `azure-cosmos` client. The scoring service is also instrumented and sends telemetry to the same Application Insights resource.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API de conseil en prêts de Woodgrove Bank est une application Flask instrumentée avec la distribution OpenTelemetry Azure Monitor et ses instrumentations par défaut. L'API appelle un service de scoring avec la bibliothèque `requests` et lit les profils clients dans Azure Cosmos DB for NoSQL avec le client `azure-cosmos`. Le service de scoring est également instrumenté et envoie sa télémétrie à la même ressource Application Insights.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Each incoming HTTP request to the API produces a row in `AppRequests`.
        fr: |-
          Chaque requête HTTP entrante vers l'API produit une ligne dans `AppRequests`.
    - id: s2
      text:
        en: |-
          To link the scoring service's telemetry to the API's traces, you must also call `RequestsInstrumentor().instrument()` in the API.
        fr: |-
          Pour relier la télémétrie du service de scoring aux traces de l'API, vous devez aussi appeler `RequestsInstrumentor().instrument()` dans l'API.
    - id: s3
      text:
        en: |-
          The Cosmos DB reads appear as dependencies of the API requests without additional code.
        fr: |-
          Les lectures Cosmos DB apparaissent comme dépendances des requêtes de l'API sans code supplémentaire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The bundled Flask instrumentation creates a server span for each incoming request, stored as a request. The requests and Azure SDK (`azure_sdk`) instrumentations are bundled and enabled by default; they create client spans and propagate the trace context, so the scoring service continues the same trace. Instrumenting a library that the distro already instruments duplicates telemetry and isn't supported.
    fr: |-
      L'instrumentation Flask intégrée crée une étendue serveur pour chaque requête entrante, stockée comme requête. Les instrumentations requests et Azure SDK (`azure_sdk`) sont intégrées et activées par défaut ; elles créent des étendues clientes et propagent le contexte de trace : le service de scoring poursuit la même trace. Instrumenter une bibliothèque que la distribution instrumente déjà duplique la télémétrie et n'est pas pris en charge.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
