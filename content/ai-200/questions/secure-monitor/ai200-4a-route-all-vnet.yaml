id: ai200-4a-route-all-vnet
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Lamna Healthcare runs a Python triage API as a Linux web app on Azure App Service. The app uses virtual network integration with a virtual network named vnet-lamna. A key vault named kv-lamna has public network access disabled and a private endpoint in vnet-lamna. The app's system-assigned identity has the Key Vault Secrets User role on kv-lamna.

    The app setting `NOTES_KEY` contains a valid Key Vault reference to kv-lamna, but it doesn't resolve. The vault logs show the requests arriving from the app's public outbound IP address.

    What should you do?
  fr: |
    Lamna Healthcare exécute une API de triage Python sous forme d'application web Linux sur Azure App Service. L'application utilise l'intégration au réseau virtuel avec un réseau virtuel nommé vnet-lamna. Un coffre de clés nommé kv-lamna a l'accès réseau public désactivé et un point de terminaison privé dans vnet-lamna. L'identité affectée par le système de l'application a le rôle Key Vault Secrets User sur kv-lamna.

    Le paramètre d'application `NOTES_KEY` contient une référence Key Vault valide vers kv-lamna, mais elle n'est pas résolue. Les journaux du coffre montrent des requêtes provenant de l'adresse IP sortante publique de l'application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the outbound IP addresses of the app to the firewall of kv-lamna.", fr: "Ajouter les adresses IP sortantes de l'application au pare-feu de kv-lamna." } }
    - { id: b, text: { en: "Set `vnetRouteAllEnabled` to `true` in the configuration of the app.", fr: "Définir `vnetRouteAllEnabled` sur `true` dans la configuration de l'application." } }
    - { id: c, text: { en: "Set `keyVaultReferenceIdentity` of the app to `SystemAssigned`.", fr: "Définir `keyVaultReferenceIdentity` de l'application sur `SystemAssigned`." } }
    - { id: d, text: { en: "Assign the Key Vault Contributor role on kv-lamna to the system-assigned identity.", fr: "Attribuer le rôle Key Vault Contributor sur kv-lamna à l'identité affectée par le système." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Linux app that reaches a key vault through a private endpoint must route all its outbound traffic through the virtual network, for example with `az webapp config set --generic-configurations '{"vnetRouteAllEnabled": true}'`. Otherwise the reference is resolved over the public path, which kv-lamna rejects.
    fr: |
      Une application Linux qui atteint un coffre de clés par un point de terminaison privé doit faire passer tout son trafic sortant par le réseau virtuel, par exemple avec `az webapp config set --generic-configurations '{"vnetRouteAllEnabled": true}'`. Sinon, la référence est résolue par le chemin public, que kv-lamna refuse.
  options:
    a: { en: "Public network access is disabled on the vault, and Microsoft advises against relying on the app's public outbound IP addresses.", fr: "L'accès réseau public est désactivé sur le coffre, et Microsoft déconseille de dépendre des adresses IP sortantes publiques de l'application." }
    c: { en: "The system-assigned identity is already the default; the failure is a network path problem, not an identity problem.", fr: "L'identité affectée par le système est déjà la valeur par défaut : l'échec vient du chemin réseau, pas de l'identité." }
    d: { en: "The identity already has a role that reads secrets, and Key Vault Contributor grants no data access.", fr: "L'identité a déjà un rôle qui lit les secrets, et Key Vault Contributor ne donne aucun accès aux données." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
