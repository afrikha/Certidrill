id: ai200-4b-sampling-defaults
objective: "4.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware instruments a Python RAG API with the Azure Monitor OpenTelemetry Distro by calling `configure_azure_monitor()` without sampling options. No `OTEL_TRACES_SAMPLER` environment variable is set. The API records the number of model tokens with an OpenTelemetry counter.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware instrumente une API RAG Python avec la distribution OpenTelemetry Azure Monitor en appelant `configure_azure_monitor()` sans option d'échantillonnage. Aucune variable d'environnement `OTEL_TRACES_SAMPLER` n'est définie. L'API enregistre le nombre de jetons du modèle avec un compteur OpenTelemetry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The token counter values are reduced by the trace sampler in the same proportion as the traces.
        fr: |-
          Les valeurs du compteur de jetons sont réduites par l'échantillonneur de traces dans la même proportion que les traces.
    - id: s2
      text:
        en: |-
          Under heavy load, the distro keeps at most about five traces per second.
        fr: |-
          Sous forte charge, la distribution conserve au plus environ cinq traces par seconde.
    - id: s3
      text:
        en: |-
          Live Metrics is available for the API without any additional setting.
        fr: |-
          Live Metrics est disponible pour l'API sans paramètre supplémentaire.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Metrics aren't sampled, so counters keep their exact values and are a reliable basis for alerts. When no sampler is configured, the default sampler is the rate-limited sampler at five traces per second. Live Metrics is enabled by default (`enable_live_metrics` defaults to True).
    fr: |-
      Les métriques ne sont pas échantillonnées : les compteurs conservent leurs valeurs exactes et constituent une base fiable pour les alertes. Quand aucun échantillonneur n'est configuré, l'échantillonneur par défaut est l'échantillonneur limité par débit à cinq traces par seconde. Live Metrics est activé par défaut (`enable_live_metrics` vaut True par défaut).
references:
  - title: Sampling in Azure Application Insights with OpenTelemetry
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-sampling
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
