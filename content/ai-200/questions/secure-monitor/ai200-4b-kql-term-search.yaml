id: ai200-4b-kql-term-search
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso's ingestion worker logs messages such as `Request throttled by embedding endpoint` and `THROTTLED: retry in 5 s` to `AppTraces`. Depending on the code path, the word appears in lowercase, uppercase or capitalized form, and always as a separate word.

    You need a filter that returns every log row that contains the word throttled.

    Which two filters can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le worker d'ingestion de Contoso écrit dans `AppTraces` des messages comme `Request throttled by embedding endpoint` et `THROTTLED: retry in 5 s`. Selon le chemin de code, le mot apparaît en minuscules, en majuscules ou avec une majuscule initiale, et toujours comme un mot distinct.

    Vous avez besoin d'un filtre qui renvoie chaque ligne de journal contenant le mot throttled.

    Quels sont les deux filtres que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: '`| where Message has "throttled"`' }
    - { id: b, text: '`| where Message has_cs "throttled"`' }
    - { id: c, text: '`| where Message == "throttled"`' }
    - { id: d, text: '`| where Message contains "throttled"`' }
    - { id: e, text: '`| where Message startswith "throttled"`' }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "`has` looks for a whole term and `contains` for a substring, and both ignore case, so they match every form of the word. `has` is the faster of the two because it uses the term index."
    fr: "`has` recherche un terme entier et `contains` une sous-chaîne, et les deux ignorent la casse : ils correspondent à toutes les formes du mot. `has` est le plus rapide des deux, car il utilise l'index des termes."
  options:
    b:
      en: |-
        The `_cs` suffix makes the operator case-sensitive, so `THROTTLED` isn't matched.
      fr: |-
        Le suffixe `_cs` rend l'opérateur sensible à la casse : `THROTTLED` ne correspond pas.
    c:
      en: "`==` compares the whole message, case-sensitively, with the single word."
      fr: "`==` compare le message entier, en respectant la casse, avec ce seul mot."
    e:
      en: "`startswith` only matches messages that begin with the word, such as the second example."
      fr: "`startswith` ne correspond qu'aux messages qui commencent par le mot, comme le deuxième exemple."
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
