id: ai200-4b-logger-name
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation instruments a Flask chat API with the Azure Monitor OpenTelemetry Distro by calling `configure_azure_monitor()` with no arguments. The application writes its own logs with `logging.getLogger("adatum.chat")`.

    The `AppTraces` table now also fills with log records from libraries, including the SDK's own logs, which increases ingestion costs. You need to export only the records of the `adatum.chat` logger. Traces and metrics must not change.

    What should you do?
  fr: |
    Adatum Corporation instrumente une API de conversation Flask avec la distribution OpenTelemetry Azure Monitor en appelant `configure_azure_monitor()` sans argument. L'application écrit ses propres journaux avec `logging.getLogger("adatum.chat")`.

    La table `AppTraces` se remplit désormais aussi des enregistrements de journaux des bibliothèques, y compris les journaux du SDK lui-même, ce qui augmente les coûts d'ingestion. Vous devez exporter uniquement les enregistrements de l'enregistreur `adatum.chat`. Les traces et les métriques ne doivent pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Call `configure_azure_monitor(instrumentation_options={"azure_sdk": {"enabled": False}})`.
        fr: |-
          Appeler `configure_azure_monitor(instrumentation_options={"azure_sdk": {"enabled": False}})`.
    - id: b
      text:
        en: |-
          Set the `OTEL_LOGS_EXPORTER` environment variable to `None`.
        fr: |-
          Définir la variable d'environnement `OTEL_LOGS_EXPORTER` sur `None`.
    - id: c
      text:
        en: |-
          Call `logging.getLogger("adatum.chat").setLevel(logging.WARNING)` before the first log record.
        fr: |-
          Appeler `logging.getLogger("adatum.chat").setLevel(logging.WARNING)` avant le premier enregistrement de journal.
    - id: d
      text:
        en: |-
          Call `configure_azure_monitor(logger_name="adatum.chat")`.
        fr: |-
          Appeler `configure_azure_monitor(logger_name="adatum.chat")`.
answer: { optionId: d }
explanation:
  correct:
    en: "`logger_name` sets the Python logger under which the distro collects log telemetry. Microsoft recommends setting it so that the SDK's own logs aren't tracked; records from other loggers are no longer exported, and spans and metrics are unaffected."
    fr: "`logger_name` définit l'enregistreur Python sous lequel la distribution collecte la télémétrie de journaux. Microsoft recommande de le définir pour que les journaux du SDK lui-même ne soient pas suivis ; les enregistrements des autres enregistreurs ne sont plus exportés, et les étendues et métriques ne sont pas affectées."
  options:
    a:
      en: |-
        Disabling the `azure_sdk` instrumentation removes the spans of Azure SDK calls, which changes traces and doesn't filter log records.
      fr: |-
        Désactiver l'instrumentation `azure_sdk` supprime les étendues des appels du SDK Azure, ce qui modifie les traces et ne filtre pas les enregistrements de journaux.
    b:
      en: "`OTEL_LOGS_EXPORTER=None` disables the export of all logs, including the ones of `adatum.chat`."
      fr: "`OTEL_LOGS_EXPORTER=None` désactive l'export de tous les journaux, y compris ceux de `adatum.chat`."
    c:
      en: |-
        The level of the application logger filters its own records by severity; it doesn't stop the collection of the other loggers' records.
      fr: |-
        Le niveau de l'enregistreur de l'application filtre ses propres enregistrements par gravité ; il n'arrête pas la collecte des enregistrements des autres enregistreurs.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
