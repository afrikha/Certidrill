id: ai200-4b-role-instance
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a Python product-ranking API named **rank-api** as several replicas in Azure Container Apps. The API uses the Azure Monitor OpenTelemetry Distro, and `OTEL_SERVICE_NAME` is set to `rank-api`.

    Support engineers must be able to tell which replica produced each telemetry item by using the `AppRoleInstance` column. All the replicas must stay a single **rank-api** node in the application map. Each replica exposes its name in the `REPLICA_ID` environment variable.

    Which environment variable setting should you add to the container app?
  fr: |
    Northwind Traders exécute une API Python de classement de produits nommée **rank-api** sous forme de plusieurs réplicas dans Azure Container Apps. L'API utilise la distribution OpenTelemetry Azure Monitor, et `OTEL_SERVICE_NAME` est défini sur `rank-api`.

    Les ingénieurs du support doivent pouvoir identifier le réplica qui a produit chaque élément de télémétrie à l'aide de la colonne `AppRoleInstance`. Tous les réplicas doivent rester un seul nœud **rank-api** dans la cartographie d'application. Chaque réplica expose son nom dans la variable d'environnement `REPLICA_ID`.

    Quel paramètre de variable d'environnement devez-vous ajouter à l'application conteneur ?
body:
  options:
    - id: a
      text: '`OTEL_RESOURCE_ATTRIBUTES=service.namespace=$REPLICA_ID`'
    - id: b
      text: '`OTEL_SERVICE_NAME=rank-api-$REPLICA_ID`'
    - id: c
      text: '`OTEL_RESOURCE_ATTRIBUTES=service.instance.id=$REPLICA_ID`'
    - id: d
      text: '`PYTHON_APPLICATIONINSIGHTS_LOGGER_NAME=$REPLICA_ID`'
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Application Insights sets the cloud role instance (`AppRoleInstance`) from the `service.instance.id` resource attribute, which you can pass in `OTEL_RESOURCE_ATTRIBUTES`. The cloud role name still comes from `OTEL_SERVICE_NAME`, so every replica stays in the same rank-api node.
    fr: |-
      Application Insights définit l'instance de rôle cloud (`AppRoleInstance`) à partir de l'attribut de ressource `service.instance.id`, que vous pouvez passer dans `OTEL_RESOURCE_ATTRIBUTES`. Le nom de rôle cloud provient toujours de `OTEL_SERVICE_NAME` : chaque réplica reste dans le même nœud rank-api.
  options:
    a:
      en: "`service.namespace` is combined with `service.name` to build the cloud role name: each replica would become a different node instead of a different instance."
      fr: "`service.namespace` est combiné avec `service.name` pour former le nom de rôle cloud : chaque réplica deviendrait un nœud différent au lieu d'une instance différente."
    b:
      en: |-
        A different service name per replica gives each replica its own cloud role name, which splits the application map into several nodes.
      fr: |-
        Un nom de service différent par réplica donne à chaque réplica son propre nom de rôle cloud, ce qui scinde la cartographie d'application en plusieurs nœuds.
    d:
      en: |-
        This variable selects the Python logger whose records are collected; it doesn't set any role property.
      fr: |-
        Cette variable sélectionne l'enregistreur Python dont les enregistrements sont collectés ; elle ne définit aucune propriété de rôle.
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
  - title: Application map in Azure Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-map
