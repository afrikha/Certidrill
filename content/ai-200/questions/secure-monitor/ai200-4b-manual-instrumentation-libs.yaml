id: ai200-4b-manual-instrumentation-libs
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is instrumenting a Python order-assistant back end with the Azure Monitor OpenTelemetry Distro. The back end uses the following libraries:

    - `httpx` to call the model endpoint
    - `psycopg2` to query Azure Database for PostgreSQL
    - `requests` to call a partner pricing API
    - `aiohttp` (client) to download product images
    - `celery` to run background tasks

    You need every library call to produce spans. Which two libraries require you to install and enable an additional OpenTelemetry instrumentation library?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders instrumente un back-end Python d'assistance aux commandes avec la distribution OpenTelemetry Azure Monitor. Le back-end utilise les bibliothèques suivantes :

    - `httpx` pour appeler le point de terminaison du modèle
    - `psycopg2` pour interroger Azure Database pour PostgreSQL
    - `requests` pour appeler une API de tarifs d'un partenaire
    - `aiohttp` (client) pour télécharger des images de produits
    - `celery` pour exécuter des tâches en arrière-plan

    Chaque appel de bibliothèque doit produire des étendues. Pour quelles deux bibliothèques devez-vous installer et activer une bibliothèque d'instrumentation OpenTelemetry supplémentaire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: httpx }
    - { id: b, text: psycopg2 }
    - { id: c, text: requests }
    - { id: d, text: aiohttp }
    - { id: e, text: celery }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: |-
      The distro bundles and enables by default the Azure SDK, Django, FastAPI, Flask, httpx, psycopg2, requests, urllib and urllib3 instrumentations. For any other library, such as the aiohttp client or Celery, you install its OpenTelemetry community instrumentation package and call its `instrument()` method.
    fr: |-
      La distribution intègre et active par défaut les instrumentations Azure SDK, Django, FastAPI, Flask, httpx, psycopg2, requests, urllib et urllib3. Pour toute autre bibliothèque, comme le client aiohttp ou Celery, vous installez son package d'instrumentation communautaire OpenTelemetry et appelez sa méthode `instrument()`.
  options:
    a:
      en: |-
        The httpx instrumentation is bundled with the distro and enabled by default.
      fr: |-
        L'instrumentation httpx est intégrée à la distribution et activée par défaut.
    b:
      en: |-
        The psycopg2 instrumentation is bundled with the distro and enabled by default.
      fr: |-
        L'instrumentation psycopg2 est intégrée à la distribution et activée par défaut.
    c:
      en: |-
        The requests instrumentation is bundled with the distro and enabled by default.
      fr: |-
        L'instrumentation requests est intégrée à la distribution et activée par défaut.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
