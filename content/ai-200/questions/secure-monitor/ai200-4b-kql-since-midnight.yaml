id: ai200-4b-kql-since-midnight
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's finance dashboard shows the number of calls to the document-extraction API "so far today", where a day starts at midnight UTC. The current query uses `where TimeGenerated > ago(1d)`, and its result at 09:00 UTC still includes calls from the previous afternoon.

    Which filter should you use instead?
  fr: |
    Le tableau de bord financier de Woodgrove Bank affiche le nombre d'appels à l'API d'extraction de documents « depuis le début de la journée », une journée commençant à minuit UTC. La requête actuelle utilise `where TimeGenerated > ago(1d)`, et son résultat à 9 h 00 UTC inclut encore des appels de l'après-midi précédent.

    Quel filtre devez-vous utiliser à la place ?
body:
  options:
    - { id: a, text: "`where TimeGenerated > ago(24h)`" }
    - { id: b, text: "`where TimeGenerated >= startofday(now())`" }
    - { id: c, text: "`where TimeGenerated >= bin(ago(1d), 1d)`" }
    - { id: d, text: "`where TimeGenerated >= now(-1d)`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`startofday(now())` returns midnight UTC of the current day, so the filter keeps only the calls made since the start of today. `ago()` always defines a rolling window that ends now."
    fr: "`startofday(now())` renvoie minuit UTC du jour en cours : le filtre ne conserve que les appels effectués depuis le début de la journée. `ago()` définit toujours une fenêtre glissante qui se termine maintenant."
  options:
    a:
      en: "`ago(24h)` is the same rolling 24-hour window as `ago(1d)`."
      fr: "`ago(24h)` est la même fenêtre glissante de 24 heures que `ago(1d)`."
    c:
      en: |-
        Rounding the time of 24 hours ago down to the day returns midnight of yesterday, so yesterday is fully included.
      fr: |-
        Arrondir au jour l'heure d'il y a 24 heures renvoie minuit hier : la journée d'hier est incluse en entier.
    d:
      en: "`now(-1d)` is the current time minus one day, the same rolling window."
      fr: "`now(-1d)` est l'heure actuelle moins un jour, soit la même fenêtre glissante."
references:
  - title: startofday()
    url: https://learn.microsoft.com/en-us/kusto/query/startofday-function
  - title: ago()
    url: https://learn.microsoft.com/en-us/kusto/query/ago-function
