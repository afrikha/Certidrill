id: ai200-4a-vault-per-env
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fourth Coffee is building a Python recommendation service that has a development environment and a production environment. Each environment uses its own Azure OpenAI key, Cosmos DB key and partner token, and new secrets are added often. Developers must be able to read every development secret but no production secret.

    You need to design the Key Vault layout and access by following Microsoft recommendations and minimizing administrative effort.

    What should you do?
  fr: |
    Fourth Coffee développe un service de recommandation Python qui dispose d'un environnement de développement et d'un environnement de production. Chaque environnement utilise sa propre clé Azure OpenAI, sa propre clé Cosmos DB et son propre jeton partenaire, et de nouveaux secrets sont souvent ajoutés. Les développeurs doivent pouvoir lire tous les secrets de développement mais aucun secret de production.

    Vous devez concevoir l'organisation des coffres et les accès en suivant les recommandations de Microsoft et en réduisant au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use one vault for both environments, and assign the developers Key Vault Secrets User on each development secret.", fr: "Utiliser un seul coffre pour les deux environnements, et attribuer aux développeurs Key Vault Secrets User sur chaque secret de développement." } }
    - { id: b, text: { en: "Use one vault for both environments, prefix secret names with `dev-` or `prod-`, and assign the developers Key Vault Reader on the vault.", fr: "Utiliser un seul coffre pour les deux environnements, préfixer les noms de secrets par `dev-` ou `prod-`, et attribuer aux développeurs Key Vault Reader sur le coffre." } }
    - { id: c, text: { en: "Use one vault per environment, and assign the developers Key Vault Secrets User at the scope of the development vault.", fr: "Utiliser un coffre par environnement, et attribuer aux développeurs Key Vault Secrets User à l'étendue du coffre de développement." } }
    - { id: d, text: { en: "Use one vault per environment, and assign the developers Key Vault Contributor at the scope of the development vault.", fr: "Utiliser un coffre par environnement, et attribuer aux développeurs Key Vault Contributor à l'étendue du coffre de développement." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends one vault per application and per environment, with roles assigned at the vault scope. A single Key Vault Secrets User assignment on the development vault covers every current and future development secret, and the production vault stays out of reach.
    fr: |
      Microsoft recommande un coffre par application et par environnement, avec des rôles attribués à l'étendue du coffre. Une seule attribution de Key Vault Secrets User sur le coffre de développement couvre tous les secrets de développement actuels et futurs, et le coffre de production reste inaccessible.
  options:
    a: { en: "Secret-scope assignments are for limited cases and must be repeated for every new secret, which increases effort.", fr: "Les attributions à l'étendue d'un secret sont réservées à des cas limités et doivent être répétées pour chaque nouveau secret, ce qui augmente l'effort." }
    b: { en: "Key Vault Reader reads metadata only, so developers couldn't read the secret values; a name prefix doesn't restrict access.", fr: "Key Vault Reader ne lit que les métadonnées : les développeurs ne pourraient pas lire les valeurs des secrets ; un préfixe de nom ne restreint pas l'accès." }
    d: { en: "Key Vault Contributor manages the vault resource and grants no access to secret values.", fr: "Key Vault Contributor gère la ressource coffre et ne donne aucun accès aux valeurs des secrets." }
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
