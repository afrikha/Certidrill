id: ai200-4b-kql-time-buckets
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys wants a time chart of the number of requests received by a Python image-captioning API during the last six hours, with one point every five minutes. The query starts with:

    ```kusto
    AppRequests
    | where TimeGenerated > ago(6h)
    ```

    Which two lines produce data that you can then display with `render timechart`? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys veut un graphique temporel du nombre de requêtes reçues par une API Python de légendage d'images au cours des six dernières heures, avec un point toutes les cinq minutes. La requête commence ainsi :

    ```kusto
    AppRequests
    | where TimeGenerated > ago(6h)
    ```

    Quelles sont les deux lignes qui produisent des données que vous pouvez ensuite afficher avec `render timechart` ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`| summarize Requests = sum(ItemCount) by TimeGenerated`" }
    - { id: b, text: "`| summarize Requests = sum(ItemCount) by bin(TimeGenerated, 5m)`" }
    - { id: c, text: "`| summarize Requests = sum(ItemCount) by startofday(TimeGenerated)`" }
    - { id: d, text: "`| make-series Requests = sum(ItemCount) on TimeGenerated step 5m`" }
    - { id: e, text: "`| where TimeGenerated > ago(5m) | summarize Requests = sum(ItemCount)`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`bin(TimeGenerated, 5m)` rounds each timestamp down to its five-minute bucket, so `summarize` returns one row per bucket. `make-series ... on TimeGenerated step 5m` builds the same buckets as an array; both outputs can be rendered as a time chart."
    fr: "`bin(TimeGenerated, 5m)` arrondit chaque horodatage à son intervalle de cinq minutes : `summarize` renvoie une ligne par intervalle. `make-series ... on TimeGenerated step 5m` construit les mêmes intervalles sous forme de tableau ; les deux sorties peuvent être affichées en graphique temporel."
  options:
    a:
      en: |-
        Grouping by the raw timestamp creates one group per distinct time value, not five-minute points.
      fr: |-
        Regrouper par l'horodatage brut crée un groupe par valeur de temps distincte, pas des points de cinq minutes.
    c:
      en: "`startofday()` produces one bucket per day."
      fr: "`startofday()` produit un intervalle par jour."
    e:
      en: |-
        This returns a single total for the last five minutes, not a series.
      fr: |-
        Cette ligne renvoie un total unique pour les cinq dernières minutes, pas une série.
references:
  - title: bin()
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function
  - title: make-series operator
    url: https://learn.microsoft.com/en-us/kusto/query/make-series-operator
