id: ai200-4b-kql-container-tables
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts its document API in Azure Container Apps and its embedding workers in Azure Kubernetes Service (AKS) with Container insights. Both send logs to the same Log Analytics workspace, and a diagnostic setting exports the platform metrics of the Azure Cosmos DB account to the workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware héberge son API de documents dans Azure Container Apps et ses workers d'embeddings dans Azure Kubernetes Service (AKS) avec Container insights. Les deux envoient leurs journaux au même espace de travail Log Analytics, et un paramètre de diagnostic exporte les métriques de plateforme du compte Azure Cosmos DB vers l'espace de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The `ContainerAppHTTPLogs` table contains the lines that the API containers write to stdout.
        fr: |-
          La table `ContainerAppHTTPLogs` contient les lignes que les conteneurs de l'API écrivent sur stdout.
    - id: s2
      text:
        en: |-
          In `ContainerLogV2`, you can filter on a field of a JSON log message through `LogMessage` without calling `parse_json()`.
        fr: |-
          Dans `ContainerLogV2`, vous pouvez filtrer sur un champ d'un message de journal JSON par `LogMessage` sans appeler `parse_json()`.
    - id: s3
      text:
        en: |-
          The Cosmos DB metrics are stored in the `AzureMetrics` table, with the metric name in `MetricName` and the aggregates in columns such as `Average` and `Maximum`.
        fr: |-
          Les métriques Cosmos DB sont stockées dans la table `AzureMetrics`, avec le nom de la métrique dans `MetricName` et les agrégats dans des colonnes comme `Average` et `Maximum`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "`ContainerAppHTTPLogs` records the ingress HTTP requests (method, path, status code, duration); stdout and stderr go to `ContainerAppConsoleLogs_CL`. `LogMessage` is a dynamic column in `ContainerLogV2`, so JSON log messages can be queried without `parse_json()`. Platform metrics exported by a diagnostic setting land in `AzureMetrics`, with `MetricName`, `Average`, `Maximum`, `Minimum`, `Total` and `Count`."
    fr: "`ContainerAppHTTPLogs` enregistre les requêtes HTTP d'entrée (méthode, chemin, code d'état, durée) ; stdout et stderr vont dans `ContainerAppConsoleLogs_CL`. `LogMessage` est une colonne dynamique de `ContainerLogV2` : les messages de journal JSON peuvent être interrogés sans `parse_json()`. Les métriques de plateforme exportées par un paramètre de diagnostic arrivent dans `AzureMetrics`, avec `MetricName`, `Average`, `Maximum`, `Minimum`, `Total` et `Count`."
references:
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
  - title: Azure Monitor Logs reference - ContainerLogV2
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/containerlogv2
