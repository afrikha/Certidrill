id: ai200-4a-feature-flag-code
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Lucerne Publishing wants to turn a new reranking step of its Python search API on and off from Azure App Configuration. The flag is named `Reranker` and has no label. The API doesn't watch any configuration key, but flag changes must take effect without a restart.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lucerne Publishing veut activer et désactiver depuis Azure App Configuration une nouvelle étape de reclassement de son API de recherche Python. L'indicateur se nomme `Reranker` et n'a pas d'étiquette. L'API ne surveille aucune clé de configuration, mais les modifications de l'indicateur doivent prendre effet sans redémarrage.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.appconfiguration.provider import load
    from azure.identity import DefaultAzureCredential
    from featuremanagement import FeatureManager

    config = load(
        endpoint=os.environ["AZURE_APPCONFIG_ENDPOINT"],
        credential=DefaultAzureCredential(),
        [[loadflags]]=True,
        [[refreshflags]]=True,
    )
    features = FeatureManager(config)

    @app.route("/search")
    def search():
        config.refresh()
        use_reranker = features.is_enabled("Reranker")
  slots:
    - id: loadflags
      options:
        - { id: ffenabled, text: feature_flag_enabled }
        - { id: refreshenabled, text: refresh_enabled }
        - { id: replica, text: replica_discovery_enabled }
    - id: refreshflags
      options:
        - { id: ffrefresh, text: feature_flag_refresh_enabled }
        - { id: refreshenabled, text: refresh_enabled }
        - { id: replica, text: replica_discovery_enabled }
answer:
  values: { loadflags: ffenabled, refreshflags: ffrefresh }
explanation:
  correct:
    en: |
      The provider doesn't load feature flags by default: `feature_flag_enabled=True` loads them. Flag refresh is independent of configuration refresh, and `feature_flag_refresh_enabled=True` makes every loaded flag monitored for changes when `refresh()` runs. `FeatureManager.is_enabled` then evaluates the flag.
    fr: |
      Le fournisseur ne charge pas les indicateurs de fonctionnalité par défaut : `feature_flag_enabled=True` les charge. L'actualisation des indicateurs est indépendante de celle de la configuration, et `feature_flag_refresh_enabled=True` fait surveiller chaque indicateur chargé quand `refresh()` s'exécute. `FeatureManager.is_enabled` évalue ensuite l'indicateur.
  options:
    refreshenabled: { en: "`refresh_enabled` turns on configuration refresh; it neither loads nor refreshes feature flags.", fr: "`refresh_enabled` active l'actualisation de la configuration ; il ne charge ni n'actualise les indicateurs de fonctionnalité." }
    replica: { en: "Replica discovery concerns geo-replicated stores and is already on by default.", fr: "La découverte des réplicas concerne les magasins géorépliqués et est déjà active par défaut." }
references:
  - title: "Quickstart: Add feature flags to a Python app"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/quickstart-feature-flag-python
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
