id: ai200-4a-secret-volume
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys a Python inference service to Azure Container Apps. The service uses a third-party client library that reads its license key only from a file. The license key is stored as a secret in a key vault named kv-litware, and the container app has a user-assigned managed identity that has the Key Vault Secrets User role on kv-litware.

    You need the license key to be available to the container as a file. The value must not be copied into the image or into the container app definition.

    What should you do?
  fr: |
    Litware déploie un service d'inférence Python sur Azure Container Apps. Le service utilise une bibliothèque cliente tierce qui ne lit sa clé de licence que dans un fichier. La clé de licence est stockée sous forme de secret dans un coffre de clés nommé kv-litware, et l'application conteneur dispose d'une identité managée affectée par l'utilisateur qui a le rôle Key Vault Secrets User sur kv-litware.

    La clé de licence doit être disponible pour le conteneur sous forme de fichier. La valeur ne doit être copiée ni dans l'image ni dans la définition de l'application conteneur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Define a container app secret that references the Key Vault secret with the identity, and mount the secrets in a volume of type Secret.", fr: "Définir un secret d'application conteneur qui référence le secret Key Vault avec l'identité, et monter les secrets dans un volume de type Secret." } }
    - { id: b, text: { en: "Define a container app secret that references the Key Vault secret with the identity, and expose it with a `secretref:` environment variable.", fr: "Définir un secret d'application conteneur qui référence le secret Key Vault avec l'identité, et l'exposer dans une variable d'environnement `secretref:`." } }
    - { id: c, text: { en: "Copy the license key into a file in an Azure Files share, and mount the share in the container app as a volume.", fr: "Copier la clé de licence dans un fichier d'un partage Azure Files, et monter le partage dans l'application conteneur sous forme de volume." } }
    - { id: d, text: { en: "Add an app setting with the value `@Microsoft.KeyVault(VaultName=kv-litware;SecretName=license-key)` to the container app.", fr: "Ajouter un paramètre d'application de valeur `@Microsoft.KeyVault(VaultName=kv-litware;SecretName=license-key)` à l'application conteneur." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A container app secret can be a Key Vault reference resolved with a managed identity. When secrets are mounted in a volume of type Secret, each secret becomes a file whose name is the secret name and whose content is its value, which is what the library needs.
    fr: |
      Un secret d'application conteneur peut être une référence Key Vault résolue avec une identité managée. Quand les secrets sont montés dans un volume de type Secret, chaque secret devient un fichier dont le nom est celui du secret et dont le contenu est sa valeur, ce dont la bibliothèque a besoin.
  options:
    b: { en: "A `secretref:` environment variable exposes the value as a variable, not as a file, so the library can't read it.", fr: "Une variable d'environnement `secretref:` expose la valeur comme variable, pas comme fichier : la bibliothèque ne peut pas la lire." }
    c: { en: "The key would be copied out of Key Vault into a file share, which breaks the requirement and loses rotation.", fr: "La clé serait copiée hors de Key Vault dans un partage de fichiers, ce qui enfreint l'exigence et perd la rotation." }
    d: { en: "The `@Microsoft.KeyVault(...)` syntax is for App Service and Azure Functions app settings, not for Container Apps.", fr: "La syntaxe `@Microsoft.KeyVault(...)` concerne les paramètres d'application d'App Service et d'Azure Functions, pas Container Apps." }
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
