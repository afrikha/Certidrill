id: ai200-4a-key-naming
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Coho Winery is designing the key names of an App Configuration store for its Python sommelier chatbot, such as `Chat:Model` and `Chat:Prompt:Tone`.

    Which two statements about keys in App Configuration are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Coho Winery conçoit les noms de clés d'un magasin App Configuration pour son chatbot sommelier Python, comme `Chat:Model` et `Chat:Prompt:Tone`.

    Quelles sont les deux affirmations vraies concernant les clés dans App Configuration ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "`Chat:Model` and `chat:model` are two different keys.", fr: "`Chat:Model` et `chat:model` sont deux clés différentes." } }
    - { id: b, text: { en: "A key name can contain the `%` character.", fr: "Un nom de clé peut contenir le caractère `%`." } }
    - { id: c, text: { en: "App Configuration requires `:` as the separator of hierarchical keys.", fr: "App Configuration impose `:` comme séparateur des clés hiérarchiques." } }
    - { id: d, text: { en: "The 10 KB size limit of a key-value includes its key, its value and its attributes.", fr: "La limite de taille de 10 Ko d'une clé-valeur inclut sa clé, sa valeur et ses attributs." } }
    - { id: e, text: { en: "A label filter of `*` excludes the key-values that have no label.", fr: "Un filtre d'étiquette `*` exclut les clés-valeurs sans étiquette." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Keys are case-sensitive Unicode strings, so the two keys are distinct (Microsoft advises against relying on case). The combined size limit of 10 KB covers all the characters of the key, the value and the optional attributes.
    fr: |
      Les clés sont des chaînes Unicode qui respectent la casse : les deux clés sont distinctes (Microsoft déconseille de s'appuyer sur la casse). La limite combinée de 10 Ko couvre tous les caractères de la clé, de la valeur et des attributs facultatifs.
  options:
    b: { en: "Any Unicode character is allowed in key names except `%`.", fr: "Tout caractère Unicode est autorisé dans les noms de clés, sauf `%`." }
    c: { en: "`:` and `/` are common conventions, but App Configuration doesn't parse keys or enforce a separator.", fr: "`:` et `/` sont des conventions courantes, mais App Configuration n'analyse pas les clés et n'impose aucun séparateur." }
    e: { en: "A label filter of `*` matches any label, including the null label `\\0`.", fr: "Un filtre d'étiquette `*` correspond à toute étiquette, y compris l'étiquette nulle `\\0`." }
references:
  - title: Keys and values
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
