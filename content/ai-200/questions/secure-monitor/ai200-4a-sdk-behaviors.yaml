id: ai200-4a-sdk-behaviors
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Coho Winery is writing a Python maintenance script for a key vault named kv-coho by using the `SecretClient` class of the `azure-keyvault-secrets` package. kv-coho already contains a secret named `crm-token`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Coho Winery écrit un script de maintenance Python pour un coffre de clés nommé kv-coho à l'aide de la classe `SecretClient` du package `azure-keyvault-secrets`. kv-coho contient déjà un secret nommé `crm-token`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Calling `set_secret("crm-token", new_value)` creates a new version of crm-token.
        fr: Appeler `set_secret("crm-token", new_value)` crée une nouvelle version de crm-token.
    - id: s2
      text:
        en: The items returned by `list_properties_of_secrets()` include the value of each secret.
        fr: Les éléments renvoyés par `list_properties_of_secrets()` incluent la valeur de chaque secret.
    - id: s3
      text:
        en: Calling `update_secret_properties("crm-token", enabled=False)` disables crm-token without changing its value.
        fr: Appeler `update_secret_properties("crm-token", enabled=False)` désactive crm-token sans modifier sa valeur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      `set_secret` creates the secret if the name is free and otherwise adds a new version with the given value. `list_properties_of_secrets` returns properties such as name, version and expiration date, never values. `update_secret_properties` changes metadata such as `enabled`, `tags` or `expires_on` and can't change the value; only `set_secret` sets a value.
    fr: |
      `set_secret` crée le secret si le nom est libre et ajoute sinon une nouvelle version avec la valeur indiquée. `list_properties_of_secrets` renvoie des propriétés comme le nom, la version et la date d'expiration, jamais les valeurs. `update_secret_properties` modifie des métadonnées comme `enabled`, `tags` ou `expires_on` et ne peut pas modifier la valeur ; seul `set_secret` définit une valeur.
references:
  - title: Azure Key Vault Secrets client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-secrets-readme
