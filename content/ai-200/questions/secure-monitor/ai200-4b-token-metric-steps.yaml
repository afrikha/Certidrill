id: ai200-4b-token-metric-steps
objective: "4.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso's chat API is instrumented with the Azure Monitor OpenTelemetry Distro. The finance team needs the number of model tokens consumed per hour, broken down by model, and the value must not be affected by trace sampling.

    You decide to publish a custom metric named **rag.tokens** from the code and to report it with a KQL query.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'API de conversation de Contoso est instrumentée avec la distribution OpenTelemetry Azure Monitor. L'équipe financière a besoin du nombre de jetons de modèle consommés par heure, ventilé par modèle, et la valeur ne doit pas être affectée par l'échantillonnage des traces.

    Vous décidez de publier depuis le code une métrique personnalisée nommée **rag.tokens** et d'en rendre compte avec une requête KQL.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: meter
      text: { en: "Get a meter by calling `metrics.get_meter(\"contoso.chat\")`.", fr: "Obtenir un compteur de mesures (meter) en appelant `metrics.get_meter(\"contoso.chat\")`." }
    - id: counter
      text: { en: "Create the instrument by calling `meter.create_counter(\"rag.tokens\")`.", fr: "Créer l'instrument en appelant `meter.create_counter(\"rag.tokens\")`." }
    - id: add
      text: { en: "After each completion, call `add()` on the instrument with the token count and a `model` attribute.", fr: "Après chaque complétion, appeler `add()` sur l'instrument avec le nombre de jetons et un attribut `model`." }
    - id: query
      text: { en: "Query `AppMetrics` for the name `rag.tokens` and sum the `Sum` column by model and by hour.", fr: "Interroger `AppMetrics` pour le nom `rag.tokens` et additionner la colonne `Sum` par modèle et par heure." }
    - id: traces
      text: { en: "Query `AppTraces` for the name `rag.tokens` and count the rows by model and by hour.", fr: "Interroger `AppTraces` pour le nom `rag.tokens` et compter les lignes par modèle et par heure." }
    - id: noexport
      text: { en: "Set the `OTEL_METRICS_EXPORTER` environment variable to `None`.", fr: "Définir la variable d'environnement `OTEL_METRICS_EXPORTER` sur `None`." }
answer:
  sequence: [ meter, counter, add, query ]
explanation:
  correct:
    en: |-
      Instruments are created from a meter, so you get the meter first, then create the counter, then add the measurements with the attributes to group by. Custom metrics are stored in `AppMetrics`, where `Sum` holds the aggregated sum of each row, and metrics aren't sampled.
    fr: |-
      Les instruments se créent à partir d'un meter : vous obtenez d'abord le meter, puis vous créez le compteur, puis vous ajoutez les mesures avec les attributs de regroupement. Les métriques personnalisées sont stockées dans `AppMetrics`, où `Sum` contient la somme agrégée de chaque ligne, et les métriques ne sont pas échantillonnées.
  options:
    traces:
      en: |-
        AppTraces holds logs; custom metric values are in AppMetrics.
      fr: |-
        AppTraces contient les journaux ; les valeurs des métriques personnalisées sont dans AppMetrics.
    noexport:
      en: |-
        This setting disables the export of all metrics.
      fr: |-
        Ce paramètre désactive l'export de toutes les métriques.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
  - title: Azure Monitor Logs reference - AppMetrics
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appmetrics
