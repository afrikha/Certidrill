id: ai200-4a-key-rotation-policy
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove encrypts the embeddings cache of its fraud-detection service with a key named `cmk-embeddings` in Azure Key Vault. You need to configure the key with a rotation policy that meets the following requirements:

    - Rotate the key automatically 90 days after each version is created.
    - Raise a near-expiry event 14 days before a version expires.
    - Give each new version an expiration of one year.

    How should you complete the policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove chiffre le cache d'incorporations de son service de détection des fraudes avec une clé nommée `cmk-embeddings` dans Azure Key Vault. Vous devez configurer la clé avec une stratégie de rotation qui respecte les exigences suivantes :

    - Faire tourner la clé automatiquement 90 jours après la création de chaque version.
    - Déclencher un événement d'expiration proche 14 jours avant l'expiration d'une version.
    - Donner à chaque nouvelle version une expiration d'un an.

    Comment devez-vous compléter la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "lifetimeActions": [
        {
          "trigger": { "[[rotTrigger]]": "P90D" },
          "action": { "type": "[[rotAction]]" }
        },
        {
          "trigger": { "[[notifyTrigger]]": "P14D" },
          "action": { "type": "Notify" }
        }
      ],
      "attributes": { "expiryTime": "P1Y" }
    }
  slots:
    - id: rotTrigger
      options:
        - { id: after, text: timeAfterCreate }
        - { id: before, text: timeBeforeExpiry }
        - { id: expiry, text: expiryTime }
    - id: rotAction
      options:
        - { id: rotate, text: Rotate }
        - { id: notify, text: Notify }
    - id: notifyTrigger
      options:
        - { id: after, text: timeAfterCreate }
        - { id: before, text: timeBeforeExpiry }
        - { id: expiry, text: expiryTime }
answer:
  values: { rotTrigger: after, rotAction: rotate, notifyTrigger: before }
explanation:
  correct:
    en: |
      A `Rotate` lifetime action with `timeAfterCreate` set to an ISO 8601 duration creates a new version that long after creation. A `Notify` action with `timeBeforeExpiry` raises the near-expiry Event Grid event before the version expires, which requires `expiryTime` in the policy attributes; `expiryTime` sets the expiration of each newly rotated version. You can apply the file with `az keyvault key rotation-policy update --value <file>`.
    fr: |
      Une action de cycle de vie `Rotate` avec `timeAfterCreate` défini sur une durée ISO 8601 crée une nouvelle version au bout de cette durée après la création. Une action `Notify` avec `timeBeforeExpiry` déclenche l'événement Event Grid d'expiration proche avant l'expiration de la version, ce qui nécessite `expiryTime` dans les attributs de la stratégie ; `expiryTime` fixe l'expiration de chaque nouvelle version. Vous pouvez appliquer le fichier avec `az keyvault key rotation-policy update --value <fichier>`.
  options:
    before: { en: "For the rotation, `timeBeforeExpiry` would rotate relative to the expiration date, not 90 days after creation.", fr: "Pour la rotation, `timeBeforeExpiry` ferait tourner la clé par rapport à la date d'expiration, et non 90 jours après la création." }
    notify: { en: "`Notify` only raises an event; it never creates a new key version.", fr: "`Notify` déclenche seulement un événement ; il ne crée jamais de nouvelle version de clé." }
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
