id: ai200-4b-kql-slowest-requests
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders' support team investigates latency complaints about a Python recommendation API. You need a query that returns the 10 slowest requests of the last hour, slowest first, from `AppRequests`.

    Which two lines can you append to `AppRequests | where TimeGenerated > ago(1h)`? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de support de Northwind Traders examine des réclamations de latence concernant une API Python de recommandation. Vous avez besoin d'une requête qui renvoie les 10 requêtes les plus lentes de la dernière heure, de la plus lente à la moins lente, à partir de `AppRequests`.

    Quelles sont les deux lignes que vous pouvez ajouter à la fin de `AppRequests | where TimeGenerated > ago(1h)` ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`| top 10 by DurationMs desc`" }
    - { id: b, text: "`| take 10 | order by DurationMs desc`" }
    - { id: c, text: "`| order by DurationMs desc | take 10`" }
    - { id: d, text: "`| top 10 by DurationMs asc`" }
    - { id: e, text: "`| summarize max(DurationMs) by Name | take 10`" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "`top 10 by DurationMs desc` returns the first 10 rows sorted by duration in descending order. Sorting all the rows first and then taking 10 rows gives the same result, because `take` keeps the first rows of a sorted input."
    fr: "`top 10 by DurationMs desc` renvoie les 10 premières lignes triées par durée décroissante. Trier d'abord toutes les lignes puis en prendre 10 donne le même résultat, car `take` conserve les premières lignes d'une entrée triée."
  options:
    b:
      en: "`take 10` first returns 10 arbitrary rows; sorting them afterward doesn't make them the slowest."
      fr: "`take 10` renvoie d'abord 10 lignes arbitraires ; les trier ensuite n'en fait pas les plus lentes."
    d:
      en: |-
        Ascending order returns the 10 fastest requests.
      fr: |-
        L'ordre croissant renvoie les 10 requêtes les plus rapides.
    e:
      en: |-
        This returns one row per operation name, not individual requests, and in no particular order.
      fr: |-
        Cette ligne renvoie une ligne par nom d'opération, pas des requêtes individuelles, et sans ordre particulier.
references:
  - title: top operator
    url: https://learn.microsoft.com/en-us/kusto/query/top-operator
  - title: take operator
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
