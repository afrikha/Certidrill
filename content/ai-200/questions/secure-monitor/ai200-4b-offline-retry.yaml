id: ai200-4b-offline-retry
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs a Python inference gateway instrumented with the Azure Monitor OpenTelemetry Distro, with its default exporter settings. During a network incident, the gateway can't reach the Application Insights ingestion endpoint for six hours, but it keeps serving requests.

    What happens to the telemetry that the gateway produces during the incident?
  fr: |
    Tailspin Toys exécute une passerelle d'inférence Python instrumentée avec la distribution OpenTelemetry Azure Monitor, avec les paramètres d'exportateur par défaut. Pendant un incident réseau, la passerelle ne peut pas joindre le point de terminaison d'ingestion d'Application Insights pendant six heures, mais elle continue de traiter les requêtes.

    Qu'advient-il de la télémétrie produite par la passerelle pendant l'incident ?
body:
  options:
    - id: a
      text: { en: "It's cached on the local disk and retried for up to 48 hours.", fr: "Elle est mise en cache sur le disque local et renvoyée pendant 48 heures au maximum." }
    - id: b
      text: { en: "It's dropped as soon as an export attempt fails, and the gap stays in the data.", fr: "Elle est supprimée dès qu'une tentative d'export échoue, et la lacune reste dans les données." }
    - id: c
      text: { en: "It's kept in memory only until the next five-second export interval, then dropped.", fr: "Elle est conservée en mémoire jusqu'au prochain intervalle d'export de cinq secondes, puis supprimée." }
    - id: d
      text: { en: "It's written directly to the Log Analytics workspace through the Azure Monitor Agent.", fr: "Elle est écrite directement dans l'espace de travail Log Analytics par l'agent Azure Monitor." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Azure Monitor OpenTelemetry-based offerings cache telemetry when the application can't reach Application Insights and retry sending it for up to 48 hours. In Python, offline storage is on by default and can be turned off or moved to another directory.
    fr: |-
      Les offres Azure Monitor basées sur OpenTelemetry mettent la télémétrie en cache quand l'application ne peut pas joindre Application Insights et réessaient de l'envoyer pendant 48 heures au maximum. En Python, le stockage hors connexion est activé par défaut et peut être désactivé ou déplacé dans un autre répertoire.
  options:
    b:
      en: |-
        Failed exports aren't discarded immediately; they're stored locally and retried.
      fr: |-
        Les exports en échec ne sont pas abandonnés immédiatement ; ils sont stockés localement puis renvoyés.
    c:
      en: |-
        The export interval controls how often batches are sent; it doesn't limit how long unsent telemetry is kept.
      fr: |-
        L'intervalle d'export règle la fréquence d'envoi des lots ; il ne limite pas la durée de conservation de la télémétrie non envoyée.
    d:
      en: |-
        The distro exports directly to Application Insights; the Azure Monitor Agent collects data from machines and isn't involved.
      fr: |-
        La distribution exporte directement vers Application Insights ; l'agent Azure Monitor collecte les données des machines et n'intervient pas.
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
