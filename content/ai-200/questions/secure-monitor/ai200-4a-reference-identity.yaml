id: ai200-4a-reference-identity
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin runs a Python web app named app-tailspin-chat on Azure App Service. The app has no system-assigned identity and one user-assigned managed identity named id-chat. id-chat has the Key Vault Secrets User role on a key vault named kv-tailspin. Company policy forbids granting any other identity access to kv-tailspin.

    You add the app setting `SEARCH_KEY` with the value `@Microsoft.KeyVault(VaultName=kv-tailspin;SecretName=search-key)`. The app reads the literal reference string instead of the secret value.

    What should you do?
  fr: |
    Tailspin exécute une application web Python nommée app-tailspin-chat sur Azure App Service. L'application n'a pas d'identité affectée par le système et possède une identité managée affectée par l'utilisateur nommée id-chat. id-chat a le rôle Key Vault Secrets User sur un coffre de clés nommé kv-tailspin. La stratégie de l'entreprise interdit d'accorder l'accès à kv-tailspin à toute autre identité.

    Vous ajoutez le paramètre d'application `SEARCH_KEY` avec la valeur `@Microsoft.KeyVault(VaultName=kv-tailspin;SecretName=search-key)`. L'application lit la chaîne de référence littérale au lieu de la valeur du secret.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the system-assigned identity of app-tailspin-chat so that App Service can resolve the reference.", fr: "Activer l'identité affectée par le système d'app-tailspin-chat pour qu'App Service puisse résoudre la référence." } }
    - { id: b, text: { en: "Assign the Key Vault Reader role on kv-tailspin to id-chat in addition to Key Vault Secrets User.", fr: "Attribuer le rôle Key Vault Reader sur kv-tailspin à id-chat en plus de Key Vault Secrets User." } }
    - { id: c, text: { en: "Change the value to `@Microsoft.KeyVault(SecretUri=https://kv-tailspin.vault.azure.net/secrets/search-key)`.", fr: "Remplacer la valeur par `@Microsoft.KeyVault(SecretUri=https://kv-tailspin.vault.azure.net/secrets/search-key)`." } }
    - { id: d, text: { en: "Set the `keyVaultReferenceIdentity` property of app-tailspin-chat to the resource ID of id-chat.", fr: "Définir la propriété `keyVaultReferenceIdentity` d'app-tailspin-chat sur l'ID de ressource d'id-chat." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      App Service resolves Key Vault references with the system-assigned identity by default. To use a user-assigned identity, you set `keyVaultReferenceIdentity` to that identity's resource ID (for example with `az webapp update --set keyVaultReferenceIdentity=...`), and it then applies to every Key Vault reference of the app.
    fr: |
      App Service résout les références Key Vault avec l'identité affectée par le système par défaut. Pour utiliser une identité affectée par l'utilisateur, vous définissez `keyVaultReferenceIdentity` sur l'ID de ressource de cette identité (par exemple avec `az webapp update --set keyVaultReferenceIdentity=...`), qui s'applique alors à toutes les références Key Vault de l'application.
  options:
    a: { en: "The system-assigned identity would also need a role on kv-tailspin, which the policy forbids.", fr: "L'identité affectée par le système aurait aussi besoin d'un rôle sur kv-tailspin, ce que la stratégie interdit." }
    b: { en: "Key Vault Secrets User already allows reading the value; the problem is which identity App Service uses.", fr: "Key Vault Secrets User permet déjà de lire la valeur : le problème est l'identité qu'utilise App Service." }
    c: { en: "Both syntaxes are valid and equivalent; changing the syntax doesn't change the identity used.", fr: "Les deux syntaxes sont valides et équivalentes : changer de syntaxe ne change pas l'identité utilisée." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
