id: ai200-4a-cache-refresh-event
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a Python API on Azure Functions that caches the value of a secret named `vision-key` in memory to avoid Key Vault throttling. Operators sometimes write a new version of vision-key manually, at unpredictable times, in a key vault named kv-adatum.

    You need a second function to clear the cached value as soon as a new version of vision-key is written. The solution must not poll kv-adatum.

    What should you configure?
  fr: |
    Adatum exécute une API Python sur Azure Functions qui met en cache en mémoire la valeur d'un secret nommé `vision-key` pour éviter la limitation de Key Vault. Les opérateurs écrivent parfois manuellement une nouvelle version de vision-key, à des moments imprévisibles, dans un coffre de clés nommé kv-adatum.

    Une deuxième fonction doit vider la valeur en cache dès qu'une nouvelle version de vision-key est écrite. La solution ne doit pas interroger kv-adatum à intervalles réguliers.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Event Grid subscription on kv-adatum for `Microsoft.KeyVault.SecretNewVersionCreated`, with the second function as the endpoint", fr: "Un abonnement Event Grid sur kv-adatum pour `Microsoft.KeyVault.SecretNewVersionCreated`, avec la deuxième fonction comme point de terminaison" } }
    - { id: b, text: { en: "An Event Grid subscription on kv-adatum for `Microsoft.KeyVault.SecretNearExpiry`, with the second function as the endpoint", fr: "Un abonnement Event Grid sur kv-adatum pour `Microsoft.KeyVault.SecretNearExpiry`, avec la deuxième fonction comme point de terminaison" } }
    - { id: c, text: { en: "An Event Grid subscription on kv-adatum for `Microsoft.KeyVault.VaultAccessPolicyChanged`, with the second function as the endpoint", fr: "Un abonnement Event Grid sur kv-adatum pour `Microsoft.KeyVault.VaultAccessPolicyChanged`, avec la deuxième fonction comme point de terminaison" } }
    - { id: d, text: { en: "A timer trigger on the second function that calls `list_properties_of_secret_versions(\"vision-key\")` every minute", fr: "Un déclencheur de minuteur sur la deuxième fonction qui appelle `list_properties_of_secret_versions(\"vision-key\")` toutes les minutes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Key Vault raises `Microsoft.KeyVault.SecretNewVersionCreated` when a new secret or a new secret version is created. An Event Grid subscription on the vault pushes that event to the function, which can then clear the cache without ever polling the vault.
    fr: |
      Key Vault déclenche `Microsoft.KeyVault.SecretNewVersionCreated` quand un nouveau secret ou une nouvelle version de secret est créé. Un abonnement Event Grid sur le coffre envoie cet événement à la fonction, qui peut alors vider le cache sans jamais interroger le coffre.
  options:
    b: { en: "NearExpiry is raised 30 days before the expiration date, not when an operator writes a new version.", fr: "NearExpiry est déclenché 30 jours avant la date d'expiration, pas quand un opérateur écrit une nouvelle version." }
    c: { en: "This event reports changes to access policies or to the permission model, not new secret versions.", fr: "Cet événement signale les modifications des stratégies d'accès ou du modèle d'autorisation, pas les nouvelles versions de secrets." }
    d: { en: "A timer that lists versions every minute polls the vault, which the requirement forbids.", fr: "Un minuteur qui liste les versions chaque minute interroge le coffre à intervalles réguliers, ce que l'exigence interdit." }
references:
  - title: Azure Key Vault as Event Grid source
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-schema-key-vault
