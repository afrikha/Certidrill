seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You summarize the 95th percentile by name and then use top.
  fr: Vous agrégez le 95e centile par nom, puis vous utilisez top.
body:
  solution:
    en: |
      You run the following query:

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | summarize P95 = percentile(DurationMs, 95) by Name
      | top 5 by P95 desc
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | summarize P95 = percentile(DurationMs, 95) by Name
      | top 5 by P95 desc
      ```
answer: { value: true }
explanation:
  correct:
    en: "`summarize ... by Name` produces one row per request name with the 95th percentile of `DurationMs`, the time the application took to handle each request. `top 5 by P95 desc` then sorts these rows by the percentile and keeps the first five, from the slowest to the fastest."
    fr: "`summarize ... by Name` produit une ligne par nom de requête avec le 95e centile de `DurationMs`, le temps mis par l'application pour traiter chaque requête. `top 5 by P95 desc` trie ensuite ces lignes selon le centile et conserve les cinq premières, de la plus lente à la plus rapide."
references:
  - title: top operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/top-operator
  - title: Azure Monitor Logs reference - AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
