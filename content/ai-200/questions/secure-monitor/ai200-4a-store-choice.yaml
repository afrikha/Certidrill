id: ai200-4a-store-choice
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is building three Python AI services that share settings. The services use Azure App Configuration with the Python provider and Azure Key Vault.

    What should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove développe trois services IA Python qui partagent des paramètres. Les services utilisent Azure App Configuration avec le fournisseur Python et Azure Key Vault.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: secret, text: { en: "Key Vault secret", fr: "Secret Key Vault" } }
    - { id: labeled, text: { en: "App Configuration key-value with a label", fr: "Clé-valeur App Configuration avec une étiquette" } }
    - { id: flag, text: { en: "App Configuration feature flag", fr: "Indicateur de fonctionnalité App Configuration" } }
    - { id: kvref, text: { en: "App Configuration Key Vault reference", fr: "Référence Key Vault App Configuration" } }
    - { id: snapshot, text: { en: "App Configuration snapshot", fr: "Instantané App Configuration" } }
  targets:
    - id: index
      text: { en: "Store the search index name, which differs between Dev and Prod and is read by all three services", fr: "Stocker le nom de l'index de recherche, qui diffère entre Dev et Prod et que lisent les trois services" }
    - id: toggle
      text: { en: "Turn a new summarization step on or off at run time without redeploying", fr: "Activer ou désactiver une nouvelle étape de synthèse à l'exécution sans redéployer" }
    - id: value
      text: { en: "Hold the value of a partner API key", fr: "Contenir la valeur d'une clé API partenaire" }
    - id: pointer
      text: { en: "Return the partner API key to the services together with their other settings, without copying its value", fr: "Renvoyer la clé API partenaire aux services avec leurs autres paramètres, sans copier sa valeur" }
answer:
  mapping: { index: labeled, toggle: flag, value: secret, pointer: kvref }
explanation:
  correct:
    en: |
      Labels create per-environment variants of the same key. Feature flags switch functionality at run time. Secrets belong in Key Vault, and a Key Vault reference in App Configuration stores only the secret URI, so the provider resolves the value from Key Vault along with the other settings.
    fr: |
      Les étiquettes créent des variantes par environnement d'une même clé. Les indicateurs de fonctionnalité activent ou désactivent une fonctionnalité à l'exécution. Les secrets ont leur place dans Key Vault, et une référence Key Vault dans App Configuration ne stocke que l'URI du secret : le fournisseur résout la valeur depuis Key Vault avec les autres paramètres.
  options:
    snapshot: { en: "A snapshot freezes a set of key-values for a release; none of the requirements needs that.", fr: "Un instantané fige un ensemble de clés-valeurs pour une version ; aucune exigence n'en a besoin." }
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: Keys and values
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
