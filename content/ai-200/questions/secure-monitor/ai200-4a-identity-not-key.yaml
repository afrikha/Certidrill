id: ai200-4a-identity-not-key
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is building a Python ingestion service on Azure Container Apps that reads PDF files from an Azure Blob Storage container before it sends them to an embedding model. A developer proposes to store the storage account key in Azure Key Vault and to rotate it every 90 days.

    You need the service to read the blobs without any credential that must be stored or rotated.

    What should you do?
  fr: |
    Wingtip développe un service d'ingestion Python sur Azure Container Apps qui lit des fichiers PDF dans un conteneur Stockage Blob Azure avant de les envoyer à un modèle d'incorporation. Un développeur propose de stocker la clé du compte de stockage dans Azure Key Vault et d'en faire la rotation tous les 90 jours.

    Le service doit lire les objets blob sans aucune information d'identification à stocker ou à faire tourner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store a SAS token for the container in Key Vault and reference it from the container app.", fr: "Stocker un jeton SAS du conteneur dans Key Vault et le référencer depuis l'application conteneur." } }
    - { id: b, text: { en: "Assign the Storage Blob Data Reader role to the managed identity of the container app and use `DefaultAzureCredential`.", fr: "Attribuer le rôle Storage Blob Data Reader à l'identité managée de l'application conteneur et utiliser `DefaultAzureCredential`." } }
    - { id: c, text: { en: "Store the storage connection string in Azure App Configuration and load it with the configuration provider.", fr: "Stocker la chaîne de connexion de stockage dans Azure App Configuration et la charger avec le fournisseur de configuration." } }
    - { id: d, text: { en: "Store the storage account key in Key Vault and assign the Key Vault Secrets User role to the managed identity.", fr: "Stocker la clé du compte de stockage dans Key Vault et attribuer le rôle Key Vault Secrets User à l'identité managée." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Blob Storage accepts Microsoft Entra authentication. A managed identity with a data-plane role such as Storage Blob Data Reader gets tokens from the platform, and `DefaultAzureCredential` uses it in Azure, so no key, SAS or connection string exists to store or rotate.
    fr: |
      Stockage Blob accepte l'authentification Microsoft Entra. Une identité managée dotée d'un rôle de plan de données comme Storage Blob Data Reader obtient ses jetons de la plateforme, et `DefaultAzureCredential` l'utilise dans Azure : il n'existe aucune clé, SAS ou chaîne de connexion à stocker ou à faire tourner.
  options:
    a: { en: "A SAS token is still a credential that expires and must be stored and renewed.", fr: "Un jeton SAS reste une information d'identification qui expire et qu'il faut stocker et renouveler." }
    c: { en: "A connection string contains the account key, and App Configuration isn't the store for secrets.", fr: "Une chaîne de connexion contient la clé du compte, et App Configuration n'est pas le magasin des secrets." }
    d: { en: "This protects the key but still requires storing and rotating it, which the requirement rules out.", fr: "Cela protège la clé mais impose toujours de la stocker et d'en faire la rotation, ce que l'exigence exclut." }
references:
  - title: Azure Identity client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/identity-readme
