id: ai200-4a-containerapp-keyvaultref
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Lucerne Publishing deploys a Python search API to Azure Container Apps by using the Azure CLI. The API reads its Azure AI Search key from the `SEARCH_KEY` environment variable. The key is stored as a secret named `search-key` in a key vault named kv-lucerne. A user-assigned managed identity, whose resource ID is in `$IDENTITY_ID`, has the Key Vault Secrets User role on kv-lucerne.

    You need the container app to read the value from Key Vault by using that identity. The value must not appear in the command.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lucerne Publishing déploie une API de recherche Python sur Azure Container Apps à l'aide de l'Azure CLI. L'API lit sa clé Azure AI Search dans la variable d'environnement `SEARCH_KEY`. La clé est stockée sous forme de secret nommé `search-key` dans un coffre de clés nommé kv-lucerne. Une identité managée affectée par l'utilisateur, dont l'ID de ressource figure dans `$IDENTITY_ID`, a le rôle Key Vault Secrets User sur kv-lucerne.

    L'application conteneur doit lire la valeur dans Key Vault avec cette identité. La valeur ne doit pas apparaître dans la commande.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp create \
      --resource-group rg-lucerne \
      --name ca-search-api \
      --environment cae-lucerne \
      --image crlucerne.azurecr.io/search-api:1.4.0 \
      --user-assigned "$IDENTITY_ID" \
      --secrets "search-key=[[kv]]:https://kv-lucerne.vault.azure.net/secrets/search-key,[[id]]:$IDENTITY_ID" \
      --env-vars "SEARCH_KEY=[[env]]:search-key"
  slots:
    - id: kv
      options:
        - { id: kvref, text: keyvaultref }
        - { id: idref, text: identityref }
        - { id: secref, text: secretref }
    - id: id
      options:
        - { id: kvref, text: keyvaultref }
        - { id: idref, text: identityref }
        - { id: secref, text: secretref }
    - id: env
      options:
        - { id: kvref, text: keyvaultref }
        - { id: idref, text: identityref }
        - { id: secref, text: secretref }
answer:
  values: { kv: kvref, id: idref, env: secref }
explanation:
  correct:
    en: |
      In `--secrets`, a Key Vault reference has the format `<name>=keyvaultref:<secret URI>,identityref:<identity resource ID>`, so Container Apps fetches the value with that identity. An environment variable then points to the app-level secret with `secretref:<secret name>`. The user-assigned identity is used because a system-assigned identity doesn't exist yet when `create` runs.
    fr: |
      Dans `--secrets`, une référence Key Vault a le format `<nom>=keyvaultref:<URI du secret>,identityref:<ID de ressource de l'identité>` : Container Apps récupère la valeur avec cette identité. Une variable d'environnement pointe ensuite vers le secret de niveau application avec `secretref:<nom du secret>`. L'identité affectée par l'utilisateur est utilisée, car une identité affectée par le système n'existe pas encore quand `create` s'exécute.
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
