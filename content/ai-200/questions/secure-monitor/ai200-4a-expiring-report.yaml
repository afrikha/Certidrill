id: ai200-4a-expiring-report
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum needs a nightly Python job that lists the names of the secrets in a key vault named kv-adatum whose current version expires within 30 days. The job's identity has the Key Vault Reader role only, and the report must not contain any secret value.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a besoin d'une tâche Python nocturne qui liste les noms des secrets d'un coffre de clés nommé kv-adatum dont la version actuelle expire dans les 30 jours. L'identité de la tâche n'a que le rôle Key Vault Reader, et le rapport ne doit contenir aucune valeur de secret.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from datetime import datetime, timedelta, timezone
    from azure.identity import DefaultAzureCredential
    from azure.keyvault.secrets import SecretClient

    client = SecretClient("https://kv-adatum.vault.azure.net", DefaultAzureCredential())
    cutoff = datetime.now(timezone.utc) + timedelta(days=30)

    for props in client.[[method]]():
        expires = props.[[date]]
        if expires and expires < cutoff:
            print(props.[[field]], expires)
  slots:
    - id: method
      options:
        - { id: list, text: list_properties_of_secrets }
        - { id: deleted, text: list_deleted_secrets }
        - { id: versions, text: list_properties_of_secret_versions }
    - id: date
      options:
        - { id: expires, text: expires_on }
        - { id: notbefore, text: not_before }
        - { id: updated, text: updated_on }
    - id: field
      options:
        - { id: name, text: name }
        - { id: value, text: value }
        - { id: version, text: version }
answer:
  values: { method: list, date: expires, field: name }
explanation:
  correct:
    en: |
      `list_properties_of_secrets()` returns the properties of every secret in the vault without their values, which Key Vault Reader is allowed to read. `expires_on` holds the expiration date of the current version, and `name` identifies the secret in the report.
    fr: |
      `list_properties_of_secrets()` renvoie les propriétés de tous les secrets du coffre sans leurs valeurs, que Key Vault Reader est autorisé à lire. `expires_on` contient la date d'expiration de la version actuelle, et `name` identifie le secret dans le rapport.
  options:
    deleted: { en: "This lists soft-deleted secrets, not the active ones.", fr: "Cette méthode liste les secrets supprimés de manière réversible, pas les secrets actifs." }
    versions: { en: "This method lists the versions of one secret and requires its name.", fr: "Cette méthode liste les versions d'un seul secret et exige son nom." }
    notbefore: { en: "`not_before` is the activation date, not the expiration date.", fr: "`not_before` est la date d'activation, pas la date d'expiration." }
    value: { en: "Properties never contain the value, and the report must not include it.", fr: "Les propriétés ne contiennent jamais la valeur, et le rapport ne doit pas l'inclure." }
references:
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
