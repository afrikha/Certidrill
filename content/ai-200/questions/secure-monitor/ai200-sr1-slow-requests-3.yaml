id: ai200-sr1-slow-requests-3
objective: "4.2.2"
type: series_yesno
series: ai200-sr1-slow-requests
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use top on the duration of the requests and then project the name.
  fr: Vous utilisez top sur la durée des requêtes, puis vous projetez le nom.
body:
  solution:
    en: |
      You run the following query:

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | top 5 by DurationMs desc
      | project Name, DurationMs
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | top 5 by DurationMs desc
      | project Name, DurationMs
      ```
answer: { value: false }
explanation:
  correct:
    en: Without `summarize`, `top` works on individual request records, so the query returns the five slowest single requests. The same name can appear several times, and one exceptional request says nothing about the 95th percentile of a request name.
    fr: "Sans `summarize`, `top` porte sur les enregistrements de requête individuels : la requête renvoie les cinq requêtes les plus lentes prises une à une. Le même nom peut apparaître plusieurs fois, et une requête exceptionnelle n'indique rien sur le 95e centile d'un nom de requête."
references:
  - title: top operator (Kusto)
    url: https://learn.microsoft.com/en-us/kusto/query/top-operator
