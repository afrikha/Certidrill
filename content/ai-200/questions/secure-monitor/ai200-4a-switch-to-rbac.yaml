id: ai200-4a-switch-to-rbac
objective: "4.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware has a key vault named kv-litware-ai that uses the vault access policy permission model. Four managed identities of AI services read secrets from kv-litware-ai through access policies that grant Get on secrets.

    You need to move kv-litware-ai to the Azure RBAC permission model without interrupting the services.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un coffre de clés nommé kv-litware-ai qui utilise le modèle d'autorisation par stratégie d'accès au coffre. Quatre identités managées de services IA lisent des secrets dans kv-litware-ai par des stratégies d'accès qui accordent Get sur les secrets.

    Vous devez faire passer kv-litware-ai au modèle d'autorisation Azure RBAC sans interrompre les services.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: inventory, text: { en: "List the access policies of kv-litware-ai to identify each identity and its permissions.", fr: "Lister les stratégies d'accès de kv-litware-ai pour identifier chaque identité et ses autorisations." } }
    - { id: assign, text: { en: "Assign Key Vault Secrets User at the scope of kv-litware-ai to each identity.", fr: "Attribuer Key Vault Secrets User à l'étendue de kv-litware-ai à chaque identité." } }
    - { id: switch, text: { en: "Set the permission model of kv-litware-ai to Azure role-based access control.", fr: "Définir le modèle d'autorisation de kv-litware-ai sur le contrôle d'accès en fonction du rôle Azure." } }
    - { id: delete, text: { en: "Delete all the access policies of kv-litware-ai.", fr: "Supprimer toutes les stratégies d'accès de kv-litware-ai." } }
    - { id: contrib, text: { en: "Assign Key Vault Contributor at the scope of kv-litware-ai to each identity.", fr: "Attribuer Key Vault Contributor à l'étendue de kv-litware-ai à chaque identité." } }
    - { id: purgeprot, text: { en: "Enable purge protection on kv-litware-ai.", fr: "Activer la protection contre le vidage sur kv-litware-ai." } }
answer:
  sequence: [ inventory, assign, switch ]
explanation:
  correct:
    en: |
      Setting the Azure RBAC permission model invalidates every access policy, which causes outages if equivalent roles aren't assigned. You therefore identify the existing permissions, assign the equivalent role (Key Vault Secrets User for Get on secrets) at the vault scope, and only then switch the model.
    fr: |
      Passer au modèle d'autorisation Azure RBAC invalide toutes les stratégies d'accès, ce qui provoque des interruptions si les rôles équivalents ne sont pas attribués. Vous identifiez donc les autorisations existantes, attribuez le rôle équivalent (Key Vault Secrets User pour Get sur les secrets) à l'étendue du coffre, et seulement ensuite changez de modèle.
  options:
    delete: { en: "Deleting the policies before the switch interrupts the services, and the switch invalidates them anyway.", fr: "Supprimer les stratégies avant le changement interrompt les services, et le changement les invalide de toute façon." }
    contrib: { en: "Key Vault Contributor is a control-plane role that doesn't allow reading secrets.", fr: "Key Vault Contributor est un rôle du plan de contrôle qui ne permet pas de lire les secrets." }
    purgeprot: { en: "Purge protection is unrelated to the permission model.", fr: "La protection contre le vidage n'a aucun lien avec le modèle d'autorisation." }
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
