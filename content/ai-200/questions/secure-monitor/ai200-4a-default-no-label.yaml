id: ai200-4a-default-no-label
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware's App Configuration store, appcs-litware, holds the settings of a Python summarization service for two environments. Every key-value in the store has the label `Dev` or `Prod`. The production code loads the store as follows:

    `config = load(endpoint=endpoint, credential=DefaultAzureCredential())`

    The call succeeds, but `config["Summary:MaxTokens"]` raises a `KeyError` in production. You need the production service to read the Prod values.

    How should you change the call?
  fr: |
    Le magasin App Configuration de Litware, appcs-litware, contient les paramètres d'un service de synthèse Python pour deux environnements. Chaque clé-valeur du magasin a l'étiquette `Dev` ou `Prod`. Le code de production charge le magasin comme suit :

    `config = load(endpoint=endpoint, credential=DefaultAzureCredential())`

    L'appel réussit, mais `config["Summary:MaxTokens"]` lève une `KeyError` en production. Le service de production doit lire les valeurs Prod.

    Comment devez-vous modifier l'appel ?
body:
  options:
    - { id: a, text: { en: "Add `trim_prefixes=[\"Prod\"]`.", fr: "Ajouter `trim_prefixes=[\"Prod\"]`." } }
    - { id: b, text: { en: "Add `selects=[SettingSelector(key_filter=\"*\", label_filter=\"\\0\")]`.", fr: "Ajouter `selects=[SettingSelector(key_filter=\"*\", label_filter=\"\\0\")]`." } }
    - { id: c, text: { en: "Add `refresh_on=[WatchKey(\"Summary:MaxTokens\")]`.", fr: "Ajouter `refresh_on=[WatchKey(\"Summary:MaxTokens\")]`." } }
    - { id: d, text: { en: "Add `selects=[SettingSelector(key_filter=\"*\", label_filter=\"Prod\")]`.", fr: "Ajouter `selects=[SettingSelector(key_filter=\"*\", label_filter=\"Prod\")]`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Without `selects`, `load` loads only the key-values that have no label. Every key-value in appcs-litware has a label, so nothing is loaded. A selector with `label_filter="Prod"` loads the production values under their usual key names.
    fr: |
      Sans `selects`, `load` ne charge que les clés-valeurs sans étiquette. Toutes les clés-valeurs d'appcs-litware ont une étiquette : rien n'est chargé. Un sélecteur avec `label_filter="Prod"` charge les valeurs de production sous leurs noms de clés habituels.
  options:
    a: { en: "`trim_prefixes` shortens key names; the label isn't part of the key name.", fr: "`trim_prefixes` raccourcit les noms de clés ; l'étiquette ne fait pas partie du nom de la clé." }
    b: { en: "`\\0` selects the key-values without a label, which is what the default call already loads.", fr: "`\\0` sélectionne les clés-valeurs sans étiquette, ce que l'appel par défaut charge déjà." }
    c: { en: "Watching a key controls refresh; it doesn't change which key-values are loaded.", fr: "Surveiller une clé contrôle l'actualisation ; cela ne change pas les clés-valeurs chargées." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
