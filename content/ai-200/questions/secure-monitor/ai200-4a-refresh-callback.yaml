id: ai200-4a-refresh-callback
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fourth Coffee has a Flask menu-recommendation app. At startup, the app loads its settings with the App Configuration provider by using `refresh_on=[WatchKey("Sentinel")]`, and copies them into `app.config`, which the rest of the code reads. Each request calls `azure_app_config.refresh()`.

    After the Sentinel key changes, the provider object holds the new values, but `app.config` keeps the old ones. You need `app.config` to be updated only when a change is detected.

    What should you do?
  fr: |
    Fourth Coffee dispose d'une application Flask de recommandation de menus. Au démarrage, l'application charge ses paramètres avec le fournisseur App Configuration en utilisant `refresh_on=[WatchKey("Sentinel")]`, et les copie dans `app.config`, que le reste du code lit. Chaque requête appelle `azure_app_config.refresh()`.

    Après une modification de la clé Sentinel, l'objet du fournisseur contient les nouvelles valeurs, mais `app.config` conserve les anciennes. `app.config` doit être mis à jour uniquement quand une modification est détectée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Pass an `on_refresh_error` callback to `load()` that copies the values into `app.config`.", fr: "Passer à `load()` un rappel `on_refresh_error` qui copie les valeurs dans `app.config`." } }
    - { id: b, text: { en: "Pass `refresh_interval=1` to `load()`.", fr: "Passer `refresh_interval=1` à `load()`." } }
    - { id: c, text: { en: "Pass an `on_refresh_success` callback to `load()` that copies the values into `app.config`.", fr: "Passer à `load()` un rappel `on_refresh_success` qui copie les valeurs dans `app.config`." } }
    - { id: d, text: { en: "Call `load()` again in each request and copy the result into `app.config`.", fr: "Rappeler `load()` à chaque requête et copier le résultat dans `app.config`." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The provider calls `on_refresh_success` only when a refresh detects a change and completes without error. Copying the values into `app.config` in that callback keeps Flask's configuration in step with the store, as the Microsoft Flask sample does.
    fr: |
      Le fournisseur appelle `on_refresh_success` uniquement quand une actualisation détecte une modification et se termine sans erreur. Copier les valeurs dans `app.config` dans ce rappel garde la configuration Flask alignée sur le magasin, comme le fait l'exemple Flask de Microsoft.
  options:
    a: { en: "`on_refresh_error` runs when a refresh fails, not when new values are loaded.", fr: "`on_refresh_error` s'exécute quand une actualisation échoue, pas quand de nouvelles valeurs sont chargées." }
    b: { en: "A shorter interval checks the sentinel more often but still never updates `app.config`.", fr: "Un intervalle plus court vérifie la sentinelle plus souvent mais ne met toujours pas à jour `app.config`." }
    d: { en: "Loading the store in every request multiplies the requests and copies the values even when nothing changed.", fr: "Charger le magasin à chaque requête multiplie les requêtes et copie les valeurs même quand rien n'a changé." }
references:
  - title: "Tutorial: Use dynamic configuration in Python"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/enable-dynamic-configuration-python
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
