id: ai200-4a-read-secret-code
objective: "4.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wide World Importers is writing a synchronous Flask app that calls an Azure OpenAI deployment. The API key is stored as a secret named `openai-api-key` in a key vault whose URL is in the `VAULT_URL` environment variable. The app runs on Azure App Service with a managed identity, and the code must contain no credential.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers écrit une application Flask synchrone qui appelle un déploiement Azure OpenAI. La clé API est stockée sous forme de secret nommé `openai-api-key` dans un coffre de clés dont l'URL figure dans la variable d'environnement `VAULT_URL`. L'application s'exécute sur Azure App Service avec une identité managée, et le code ne doit contenir aucune information d'identification.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.identity import DefaultAzureCredential
    from [[module]] import SecretClient

    client = SecretClient(
        vault_url=os.environ["VAULT_URL"],
        credential=[[cred]],
    )
    api_key = client.[[method]]("openai-api-key").[[attr]]
  slots:
    - id: module
      options:
        - { id: secrets, text: azure.keyvault.secrets }
        - { id: keys, text: azure.keyvault.keys }
        - { id: aio, text: azure.keyvault.secrets.aio }
    - id: cred
      options:
        - { id: instance, text: DefaultAzureCredential() }
        - { id: klass, text: DefaultAzureCredential }
        - { id: envkey, text: "os.environ[\"VAULT_KEY\"]" }
    - id: method
      options:
        - { id: get, text: get_secret }
        - { id: deleted, text: get_deleted_secret }
        - { id: listp, text: list_properties_of_secrets }
    - id: attr
      options:
        - { id: value, text: value }
        - { id: name, text: name }
        - { id: props, text: properties }
answer:
  values: { module: secrets, cred: instance, method: get, attr: value }
explanation:
  correct:
    en: |
      `SecretClient` for synchronous code is in `azure.keyvault.secrets`, and it takes a credential instance such as `DefaultAzureCredential()`, which uses the managed identity on App Service. `get_secret(name)` returns a `KeyVaultSecret` for the latest version, and its `value` attribute holds the secret itself.
    fr: |
      Le `SecretClient` destiné au code synchrone se trouve dans `azure.keyvault.secrets` et reçoit une instance d'information d'identification comme `DefaultAzureCredential()`, qui utilise l'identité managée sur App Service. `get_secret(name)` renvoie un `KeyVaultSecret` pour la dernière version, et son attribut `value` contient le secret lui-même.
  options:
    aio: { en: "The `aio` client is asynchronous and must be awaited, which a synchronous Flask app doesn't do.", fr: "Le client `aio` est asynchrone et doit être attendu, ce que ne fait pas une application Flask synchrone." }
    klass: { en: "The client needs a credential object, not the class itself.", fr: "Le client a besoin d'un objet d'information d'identification, pas de la classe elle-même." }
    deleted: { en: "`get_deleted_secret` reads a soft-deleted secret, not the current one.", fr: "`get_deleted_secret` lit un secret supprimé de manière réversible, pas le secret actuel." }
    props: { en: "`properties` holds metadata such as the version and dates, not the secret value.", fr: "`properties` contient des métadonnées comme la version et les dates, pas la valeur du secret." }
references:
  - title: Azure Key Vault Secrets client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-secrets-readme
