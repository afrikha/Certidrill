id: ai200-4a-filter-patterns
objective: "4.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum's Python services query an App Configuration store whose keys look like `Rag:TopK`, `Rag:Model` and `Chat:Model`. Some key-values have a label and others don't.

    Which filter expression should you use for each query? To answer, drag the appropriate expressions to the correct queries. Each expression may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les services Python d'Adatum interrogent un magasin App Configuration dont les clés ressemblent à `Rag:TopK`, `Rag:Model` et `Chat:Model`. Certaines clés-valeurs ont une étiquette, d'autres non.

    Quelle expression de filtre devez-vous utiliser pour chaque requête ? Pour répondre, faites glisser les expressions appropriées vers les requêtes correspondantes. Chaque expression peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prefix, text: "Rag:*" }
    - { id: list, text: "Rag:TopK,Rag:Model" }
    - { id: nolabel, text: "\\0" }
    - { id: any, text: "*" }
    - { id: bare, text: "Rag:" }
    - { id: percent, text: "%" }
  targets:
    - id: starts
      text: { en: "Key filter: every key that starts with Rag:", fr: "Filtre de clé : toutes les clés qui commencent par Rag:" }
    - id: two
      text: { en: "Key filter: only the keys Rag:TopK and Rag:Model", fr: "Filtre de clé : uniquement les clés Rag:TopK et Rag:Model" }
    - id: unlabeled
      text: { en: "Label filter: only the key-values that have no label", fr: "Filtre d'étiquette : uniquement les clés-valeurs sans étiquette" }
    - id: all
      text: { en: "Label filter: any label, including no label", fr: "Filtre d'étiquette : toute étiquette, y compris aucune étiquette" }
answer:
  mapping: { starts: prefix, two: list, unlabeled: nolabel, all: any }
explanation:
  correct:
    en: |
      A trailing `*` matches keys that start with the text before it, and a comma-separated list matches any of the listed keys (up to five). For labels, `\0` (URL-encoded `%00`) means no label, and `*` matches any label, including no label.
    fr: |
      Un `*` final correspond aux clés qui commencent par le texte qui le précède, et une liste séparée par des virgules correspond à l'une des clés listées (cinq au maximum). Pour les étiquettes, `\0` (encodé `%00` dans une URL) signifie aucune étiquette, et `*` correspond à toute étiquette, y compris aucune étiquette.
  options:
    bare: { en: "Without `*`, the filter matches only a key named exactly `Rag:`.", fr: "Sans `*`, le filtre ne correspond qu'à une clé nommée exactement `Rag:`." }
    percent: { en: "`%` isn't a wildcard, and it isn't allowed in key names.", fr: "`%` n'est pas un caractère générique et n'est pas autorisé dans les noms de clés." }
references:
  - title: Keys and values
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
