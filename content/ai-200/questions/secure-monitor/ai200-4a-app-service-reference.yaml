id: ai200-4a-app-service-reference
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin hosts a Python flight-delay predictor on Azure App Service. The app reads the database password from the `DB_PASSWORD` environment variable. The password is stored as a secret named `db-password` in a key vault named kv-tailspin that uses the Azure RBAC permission model. The app has a system-assigned managed identity and no user-assigned identity.

    You need to supply the password through an App Service app setting. The app must pick up new versions of db-password without any change to the setting, and access must follow the principle of least privilege.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin héberge un prédicteur Python de retards de vols sur Azure App Service. L'application lit le mot de passe de la base de données dans la variable d'environnement `DB_PASSWORD`. Le mot de passe est stocké sous forme de secret nommé `db-password` dans un coffre de clés nommé kv-tailspin qui utilise le modèle d'autorisation Azure RBAC. L'application a une identité managée affectée par le système et aucune identité affectée par l'utilisateur.

    Vous devez fournir le mot de passe par un paramètre d'application App Service. L'application doit récupérer les nouvelles versions de db-password sans aucune modification du paramètre, et l'accès doit respecter le principe du moindre privilège.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Value of the DB_PASSWORD app setting: [[ref]]
      Identity that resolves the reference: [[identity]]
      Role to assign on kv-tailspin: [[role]]
    fr: |
      Valeur du paramètre d'application DB_PASSWORD : [[ref]]
      Identité qui résout la référence : [[identity]]
      Rôle à attribuer sur kv-tailspin : [[role]]
  slots:
    - id: ref
      options:
        - { id: latest, text: "@Microsoft.KeyVault(SecretUri=https://kv-tailspin.vault.azure.net/secrets/db-password)" }
        - { id: pinned, text: "@Microsoft.KeyVault(SecretUri=https://kv-tailspin.vault.azure.net/secrets/db-password/7d4e1b2c9a8f4e6d8c1b2a3f4e5d6c7b)" }
        - { id: caref, text: "keyvaultref:https://kv-tailspin.vault.azure.net/secrets/db-password,identityref:system" }
    - id: identity
      options:
        - { id: system, text: { en: "The system-assigned managed identity of the app", fr: "L'identité managée affectée par le système de l'application" } }
        - { id: deployer, text: { en: "The account of the developer who created the app setting", fr: "Le compte du développeur qui a créé le paramètre d'application" } }
        - { id: appreg, text: { en: "An app registration whose client secret is stored in another app setting", fr: "Une inscription d'application dont le secret client est stocké dans un autre paramètre d'application" } }
    - id: role
      options:
        - { id: user, text: Key Vault Secrets User }
        - { id: officer, text: Key Vault Secrets Officer }
        - { id: reader, text: Key Vault Reader }
answer:
  values: { ref: latest, identity: system, role: user }
explanation:
  correct:
    en: |
      A reference without a version uses the latest version of the secret, and App Service picks up new versions within 24 hours. References are resolved with the app's system-assigned identity by default, which needs Key Vault Secrets User to read the secret value.
    fr: |
      Une référence sans version utilise la dernière version du secret, et App Service récupère les nouvelles versions sous 24 heures. Les références sont résolues par défaut avec l'identité affectée par le système de l'application, qui a besoin de Key Vault Secrets User pour lire la valeur du secret.
  options:
    pinned: { en: "A URI with a version always resolves that version and never follows a rotation.", fr: "Un URI avec version résout toujours cette version et ne suit jamais une rotation." }
    caref: { en: "`keyvaultref:` is the Azure Container Apps CLI syntax, not an App Service reference.", fr: "`keyvaultref:` est la syntaxe CLI d'Azure Container Apps, pas une référence App Service." }
    officer: { en: "Secrets Officer can also write and delete secrets, which exceeds least privilege.", fr: "Secrets Officer peut aussi écrire et supprimer des secrets, ce qui dépasse le moindre privilège." }
    reader: { en: "Key Vault Reader reads metadata but not secret contents.", fr: "Key Vault Reader lit les métadonnées mais pas le contenu des secrets." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
