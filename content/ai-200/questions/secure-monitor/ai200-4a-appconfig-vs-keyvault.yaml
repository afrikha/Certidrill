id: ai200-4a-appconfig-vs-keyvault
objective: "4.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wide World Importers stores the settings of its Python customs-classification service in Azure App Configuration and its secrets in Azure Key Vault. Some key-values in App Configuration are Key Vault references.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wide World Importers stocke les paramètres de son service Python de classification douanière dans Azure App Configuration et ses secrets dans Azure Key Vault. Certaines clés-valeurs d'App Configuration sont des références Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: App Configuration encrypts all its data in transit and at rest.
        fr: App Configuration chiffre toutes ses données en transit et au repos.
    - id: s2
      text:
        en: A Key Vault reference stores an encrypted copy of the secret value in App Configuration.
        fr: Une référence Key Vault stocke une copie chiffrée de la valeur du secret dans App Configuration.
    - id: s3
      text:
        en: The service can use the same managed identity to authenticate to App Configuration and to Key Vault.
        fr: Le service peut utiliser la même identité managée pour s'authentifier auprès d'App Configuration et de Key Vault.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      App Configuration always encrypts data in transit (TLS 1.2 or 1.3) and at rest, but Microsoft still recommends Key Vault for secrets. A Key Vault reference stores only the URI of the secret, and the application reads the value from Key Vault itself. One managed identity can authenticate to both services if it has a role on each.
    fr: |
      App Configuration chiffre toujours les données en transit (TLS 1.2 ou 1.3) et au repos, mais Microsoft recommande toujours Key Vault pour les secrets. Une référence Key Vault ne stocke que l'URI du secret, et l'application lit elle-même la valeur dans Key Vault. Une même identité managée peut s'authentifier auprès des deux services si elle a un rôle sur chacun.
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: "Tutorial: Use Key Vault references in an ASP.NET Core app"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/use-key-vault-references-dotnet-core
