id: ai200-cs3a-rotation-trigger
objective: "4.1.1"
type: single
caseStudy: ai200-cs3a-coho-vineyard
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the rotation requirement for supplier-api-key. What should you configure to start func-coho-rotate?
  fr: |
    Vous devez respecter l'exigence de renouvellement de supplier-api-key. Que devez-vous configurer pour démarrer func-coho-rotate ?
body:
  options:
    - id: a
      text:
        en: "An Event Grid subscription on kv-coho for the `Microsoft.KeyVault.SecretNewVersionCreated` event, with func-coho-rotate as the endpoint"
        fr: "Un abonnement Event Grid sur kv-coho pour l'événement `Microsoft.KeyVault.SecretNewVersionCreated`, avec func-coho-rotate comme point de terminaison"
    - id: b
      text:
        en: "An Event Grid subscription on kv-coho for the `Microsoft.KeyVault.SecretExpired` event, with func-coho-rotate as the endpoint"
        fr: "Un abonnement Event Grid sur kv-coho pour l'événement `Microsoft.KeyVault.SecretExpired`, avec func-coho-rotate comme point de terminaison"
    - id: c
      text:
        en: "An Event Grid subscription on kv-coho for the `Microsoft.KeyVault.SecretNearExpiry` event, with func-coho-rotate as the endpoint"
        fr: "Un abonnement Event Grid sur kv-coho pour l'événement `Microsoft.KeyVault.SecretNearExpiry`, avec func-coho-rotate comme point de terminaison"
    - id: d
      text:
        en: "A timer trigger on func-coho-rotate that runs every hour and compares the expiration date of supplier-api-key with the current date"
        fr: "Un déclencheur de minuteur sur func-coho-rotate qui s'exécute toutes les heures et compare la date d'expiration de supplier-api-key à la date du jour"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Key Vault publishes a NearExpiry event to Event Grid 30 days before the current version of a secret expires. Subscribing func-coho-rotate to `Microsoft.KeyVault.SecretNearExpiry` starts the rotation while the current key is still valid, and nothing polls the vault.
    fr: |
      Key Vault publie un événement NearExpiry dans Event Grid 30 jours avant l'expiration de la version actuelle d'un secret. Abonner func-coho-rotate à `Microsoft.KeyVault.SecretNearExpiry` démarre le renouvellement pendant que la clé actuelle est encore valide, et rien n'interroge le coffre à intervalles réguliers.
  options:
    a:
      en: |
        A new version is created by the rotation itself, so this event fires after the rotation and cannot start it.
      fr: |
        Une nouvelle version est créée par le renouvellement lui-même : cet événement se déclenche après le renouvellement et ne peut pas le démarrer.
    b:
      en: |
        The Expired event fires once the version has already expired, so the application would use an expired key until the rotation completes.
      fr: |
        L'événement Expired se déclenche une fois la version déjà expirée : l'application utiliserait une clé expirée jusqu'à la fin du renouvellement.
    d:
      en: |
        A timer that reads the secret properties every hour polls kv-coho, which the requirement forbids.
      fr: |
        Un minuteur qui lit les propriétés du secret toutes les heures interroge kv-coho à intervalles réguliers, ce que l'exigence interdit.
references:
  - title: Monitoring Key Vault with Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/event-grid-overview
