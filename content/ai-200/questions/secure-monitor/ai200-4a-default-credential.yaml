id: ai200-4a-default-credential
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Margie's Travel is writing a Python itinerary assistant that reads secrets from Azure Key Vault with `SecretClient`. In Azure, the app runs on Azure App Service with a managed identity. On their workstations, developers are signed in to the Azure CLI with their own accounts.

    You need the same code to authenticate in both places without storing any credential in code or configuration.

    Which credential should you pass to `SecretClient`?
  fr: |
    Margie's Travel écrit un assistant d'itinéraires Python qui lit des secrets dans Azure Key Vault avec `SecretClient`. Dans Azure, l'application s'exécute sur Azure App Service avec une identité managée. Sur leurs postes, les développeurs sont connectés à l'Azure CLI avec leurs propres comptes.

    Le même code doit s'authentifier aux deux endroits sans stocker aucune information d'identification dans le code ou la configuration.

    Quelle information d'identification devez-vous passer à `SecretClient` ?
body:
  options:
    - { id: a, text: "ManagedIdentityCredential()" }
    - { id: b, text: "AzureCliCredential()" }
    - { id: c, text: { en: "ClientSecretCredential() with the client secret read from an environment variable", fr: "ClientSecretCredential() avec le secret client lu dans une variable d'environnement" } }
    - { id: d, text: "DefaultAzureCredential()" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` combines the credentials used in Azure hosting environments, such as a managed identity, with developer credentials such as the Azure CLI sign-in. The same code therefore uses the managed identity on App Service and the developer's account on a workstation.
    fr: |
      `DefaultAzureCredential` combine les informations d'identification des environnements d'hébergement Azure, comme une identité managée, avec celles des développeurs, comme la connexion à l'Azure CLI. Le même code utilise donc l'identité managée sur App Service et le compte du développeur sur un poste.
  options:
    a: { en: "A managed identity exists only on the Azure resource, so this credential fails on the workstations.", fr: "Une identité managée n'existe que sur la ressource Azure : cette information d'identification échoue sur les postes." }
    b: { en: "The Azure CLI isn't signed in on App Service, so this credential fails in Azure.", fr: "L'Azure CLI n'est pas connectée sur App Service : cette information d'identification échoue dans Azure." }
    c: { en: "A client secret is a stored credential, which the requirement forbids.", fr: "Un secret client est une information d'identification stockée, ce que l'exigence interdit." }
references:
  - title: Azure Identity client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/identity-readme
