id: ai200-4a-appconfig-roles
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an App Configuration store named appcs-fabrikam for its AI document services. Four principals need access, and each must receive only the permissions it needs. All access to key-values uses Microsoft Entra authentication.

    Which role should you assign to each principal on appcs-fabrikam? To answer, drag the appropriate roles to the correct principals. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un magasin App Configuration nommé appcs-fabrikam pour ses services IA de documents. Quatre principaux ont besoin d'un accès, et chacun ne doit recevoir que les autorisations dont il a besoin. Tout accès aux clés-valeurs utilise l'authentification Microsoft Entra.

    Quel rôle devez-vous attribuer à chaque principal sur appcs-fabrikam ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: owner, text: App Configuration Data Owner }
    - { id: reader, text: App Configuration Data Reader }
    - { id: acreader, text: App Configuration Reader }
    - { id: accontrib, text: App Configuration Contributor }
    - { id: contrib, text: Contributor }
  targets:
    - id: pipeline
      text: { en: "A deployment pipeline that creates, updates and deletes key-values", fr: "Un pipeline de déploiement qui crée, met à jour et supprime des clés-valeurs" }
    - id: api
      text: { en: "The managed identity of an API that reads key-values", fr: "L'identité managée d'une API qui lit des clés-valeurs" }
    - id: auditor
      text: { en: "An auditor who views the store's properties but no key-values and no access keys", fr: "Un auditeur qui consulte les propriétés du magasin, mais aucune clé-valeur ni aucune clé d'accès" }
    - id: platform
      text: { en: "A platform engineer who manages the store resource, such as its replicas, but no other Azure resources", fr: "Un ingénieur de plateforme qui gère la ressource magasin, comme ses réplicas, mais aucune autre ressource Azure" }
answer:
  mapping: { pipeline: owner, api: reader, auditor: acreader, platform: accontrib }
explanation:
  correct:
    en: |
      App Configuration Data Owner grants read, write and delete access to the data, and App Configuration Data Reader grants read access; neither grants access to the resource. App Configuration Reader reads the resource only, without access keys or data. App Configuration Contributor manages only App Configuration resources.
    fr: |
      App Configuration Data Owner donne un accès en lecture, écriture et suppression aux données, et App Configuration Data Reader un accès en lecture ; aucun ne donne accès à la ressource. App Configuration Reader lit uniquement la ressource, sans clés d'accès ni données. App Configuration Contributor gère uniquement les ressources App Configuration.
  options:
    contrib: { en: "Contributor manages every Azure resource in its scope, which exceeds the platform engineer's need.", fr: "Contributor gère toutes les ressources Azure de son étendue, ce qui dépasse le besoin de l'ingénieur de plateforme." }
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
