id: ai200-4b-kql-leftanti
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware's summarization API sometimes returns a 503 response on purpose when the model endpoint is saturated, without throwing an exception. You need to list the failed requests of the last day that have no related row in `AppExceptions`, so that you can separate these deliberate failures from the crashes.

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1d) and Success == false
    | join kind=??? (AppExceptions | where TimeGenerated > ago(1d)) on OperationId
    ```

    Which join kind should you use?
  fr: |
    L'API de synthèse de Litware renvoie parfois volontairement une réponse 503 quand le point de terminaison du modèle est saturé, sans lever d'exception. Vous devez lister les requêtes en échec de la dernière journée qui n'ont aucune ligne associée dans `AppExceptions`, afin de distinguer ces échecs volontaires des plantages.

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1d) and Success == false
    | join kind=??? (AppExceptions | where TimeGenerated > ago(1d)) on OperationId
    ```

    Quel type de jointure devez-vous utiliser ?
body:
  options:
    - { id: a, text: inner }
    - { id: b, text: leftouter }
    - { id: c, text: innerunique }
    - { id: d, text: leftanti }
answer: { optionId: d }
explanation:
  correct:
    en: "`leftanti` returns the rows of the left table that match no row of the right table, which models a NOT IN query. Here it keeps only the failed requests whose `OperationId` has no exception."
    fr: "`leftanti` renvoie les lignes de la table de gauche qui ne correspondent à aucune ligne de la table de droite, ce qui modélise une requête NOT IN. Ici, il ne conserve que les requêtes en échec dont l'`OperationId` n'a aucune exception."
  options:
    a:
      en: "`inner` returns only the requests that do have a matching exception, the opposite of the requirement."
      fr: "`inner` ne renvoie que les requêtes qui ont une exception correspondante, l'inverse de l'exigence."
    b:
      en: "`leftouter` returns every failed request, with or without an exception, unless you add another filter."
      fr: "`leftouter` renvoie toutes les requêtes en échec, avec ou sans exception, sauf si vous ajoutez un autre filtre."
    c:
      en: "`innerunique`, the default kind, deduplicates the left side and also returns only the matching requests."
      fr: "`innerunique`, le type par défaut, déduplique le côté gauche et ne renvoie lui aussi que les requêtes correspondantes."
references:
  - title: leftanti join
    url: https://learn.microsoft.com/en-us/kusto/query/join-leftanti
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
