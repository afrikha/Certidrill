id: ai200-4a-versionless-uri
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs a Python retrieval API on Azure Container Apps. The container app defines a secret named `cosmos-key` as a Key Vault reference to `https://kv-northwind.vault.azure.net/secrets/cosmos-key/4f2a9c1d7e6b4a3c9d8e1f0a2b3c4d5e`, and an environment variable references that secret.

    Key Vault writes a new version of cosmos-key every 60 days. You need the API to use each new version within 30 minutes of its creation, with no manual step after future rotations.

    What should you do?
  fr: |
    Northwind exécute une API de récupération Python sur Azure Container Apps. L'application conteneur définit un secret nommé `cosmos-key` sous forme de référence Key Vault vers `https://kv-northwind.vault.azure.net/secrets/cosmos-key/4f2a9c1d7e6b4a3c9d8e1f0a2b3c4d5e`, et une variable d'environnement référence ce secret.

    Key Vault écrit une nouvelle version de cosmos-key tous les 60 jours. L'API doit utiliser chaque nouvelle version dans les 30 minutes suivant sa création, sans étape manuelle après les rotations futures.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an Event Grid subscription on kv-northwind for `Microsoft.KeyVault.SecretNewVersionCreated` with the container app as the endpoint.", fr: "Créer un abonnement Event Grid sur kv-northwind pour `Microsoft.KeyVault.SecretNewVersionCreated` avec l'application conteneur comme point de terminaison." } }
    - { id: b, text: { en: "Change the secret to reference `https://kv-northwind.vault.azure.net/secrets/cosmos-key` without a version.", fr: "Modifier le secret pour qu'il référence `https://kv-northwind.vault.azure.net/secrets/cosmos-key` sans version." } }
    - { id: c, text: { en: "Switch the container app to multiple revision mode so that each rotation creates a new revision.", fr: "Passer l'application conteneur en mode de révisions multiples pour que chaque rotation crée une nouvelle révision." } }
    - { id: d, text: { en: "Mount the secrets in a volume of type Secret instead of using an environment variable.", fr: "Monter les secrets dans un volume de type Secret au lieu d'utiliser une variable d'environnement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Key Vault secret URI that includes a version always resolves that version. Without a version, Container Apps uses the latest version, retrieves newer versions within 30 minutes, and restarts the active revisions that reference the secret in an environment variable.
    fr: |
      Un URI de secret Key Vault qui inclut une version résout toujours cette version. Sans version, Container Apps utilise la dernière version, récupère les nouvelles versions sous 30 minutes et redémarre les révisions actives qui référencent le secret dans une variable d'environnement.
  options:
    a: { en: "A container app isn't an Event Grid handler that refreshes its secrets, and the reference would still be pinned.", fr: "Une application conteneur n'est pas un gestionnaire Event Grid qui actualise ses secrets, et la référence resterait épinglée." }
    c: { en: "Secret changes never create revisions, and the reference would still point to the old version.", fr: "Les modifications de secrets ne créent jamais de révisions, et la référence pointerait toujours vers l'ancienne version." }
    d: { en: "A volume mount still resolves the pinned version, so the value would never change.", fr: "Un montage de volume résout toujours la version épinglée : la valeur ne changerait jamais." }
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
