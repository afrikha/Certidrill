id: ai200-4b-kql-broken-query
objective: "4.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A developer at Litware migrates a dashboard to the Log Analytics workspace of a workspace-based Application Insights resource. The new query, shown in the following table, returns errors.

    Answer each prompt by selecting the line of the query that causes the problem.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur de Litware migre un tableau de bord vers l'espace de travail Log Analytics d'une ressource Application Insights basée sur un espace de travail. La nouvelle requête, présentée dans le tableau suivant, renvoie des erreurs.

    Répondez à chaque consigne en sélectionnant la ligne de la requête qui cause le problème.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The line that uses a column name of the classic Application Insights schema", fr: "La ligne qui utilise un nom de colonne du schéma classique d'Application Insights" }
    - id: p2
      text: { en: "The line that removes a column that a later line needs", fr: "La ligne qui supprime une colonne dont une ligne suivante a besoin" }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Query", fr: "Requête" }]
    rows:
      - [{ text: "1" }, { text: "`AppRequests`", area: l1 }]
      - [{ text: "2" }, { text: "`| where timestamp > ago(1d)`", area: l2 }]
      - [{ text: "3" }, { text: "`| project Name, Success, ItemCount`", area: l3 }]
      - [{ text: "4" }, { text: "`| summarize Failed = sumif(ItemCount, Success == false), P95 = percentile(DurationMs, 95) by Name`", area: l4 }]
      - [{ text: "5" }, { text: "`| where Failed > 0`", area: l5 }]
      - [{ text: "6" }, { text: "`| order by P95 desc`", area: l6 }]
answer:
  values: { p1: l2, p2: l3 }
explanation:
  correct:
    en: "`timestamp` is the classic name of the time column; the workspace tables use `TimeGenerated`, and KQL column names are case-sensitive. `project` keeps only the columns it lists, so `DurationMs` no longer exists when line 4 computes the percentile."
    fr: "`timestamp` est le nom classique de la colonne de temps ; les tables de l'espace de travail utilisent `TimeGenerated`, et les noms de colonnes KQL respectent la casse. `project` ne conserve que les colonnes qu'il liste : `DurationMs` n'existe plus quand la ligne 4 calcule le centile."
references:
  - title: Project operator
    url: https://learn.microsoft.com/en-us/kusto/query/project-operator
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
