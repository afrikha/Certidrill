id: ai200-4a-set-secret-expiry
objective: "4.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware writes a rotation function in Python for a storage account key that is kept in a key vault as a secret named `storageKey`. After it regenerates key2, the function must store it as a new version that expires in 60 days, so that Key Vault raises a near-expiry event before the next rotation. The version must also record which storage key it holds.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware écrit en Python une fonction de rotation pour une clé de compte de stockage conservée dans un coffre de clés sous forme de secret nommé `storageKey`. Après avoir régénéré key2, la fonction doit la stocker comme nouvelle version qui expire dans 60 jours, pour que Key Vault déclenche un événement d'expiration proche avant la rotation suivante. La version doit aussi indiquer quelle clé de stockage elle contient.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    client.set_secret(
        "storageKey",
        new_key2_value,
        [[date]]=datetime.now(timezone.utc) + timedelta(days=60),
        [[meta]]={"CredentialId": "key2", "ValidityPeriodDays": "60"},
    )
  slots:
    - id: date
      options:
        - { id: expires, text: expires_on }
        - { id: notbefore, text: not_before }
        - { id: enabled, text: enabled }
    - id: meta
      options:
        - { id: tags, text: tags }
        - { id: ctype, text: content_type }
        - { id: enabled, text: enabled }
answer:
  values: { date: expires, meta: tags }
explanation:
  correct:
    en: |
      `set_secret` accepts keyword-only attributes: `expires_on` sets the expiration date that the `SecretNearExpiry` event relies on, and `tags` stores name-value metadata such as `CredentialId`, which the dual-credential rotation pattern reads to know which key the version holds.
    fr: |
      `set_secret` accepte des attributs nommés : `expires_on` définit la date d'expiration sur laquelle s'appuie l'événement `SecretNearExpiry`, et `tags` stocke des métadonnées nom-valeur comme `CredentialId`, que le modèle de rotation à double information d'identification lit pour savoir quelle clé contient la version.
  options:
    notbefore: { en: "`not_before` sets the date from which the version can be used, not its expiration.", fr: "`not_before` fixe la date à partir de laquelle la version est utilisable, pas son expiration." }
    ctype: { en: "`content_type` is a single string that describes the value, not a dictionary of metadata.", fr: "`content_type` est une seule chaîne qui décrit la valeur, pas un dictionnaire de métadonnées." }
references:
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
  - title: Automate the rotation of a secret for resources that have two sets of authentication credentials
    url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/tutorial-rotation-dual
