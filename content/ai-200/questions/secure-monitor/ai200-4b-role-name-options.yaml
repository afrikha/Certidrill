id: ai200-4b-role-name-options
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs three Python services, **chat-api**, **ingest-worker** and **embed-worker**, that send telemetry to the same Application Insights resource through the Azure Monitor OpenTelemetry Distro. No resource attribute is configured, so the application map can't tell the services apart.

    You need the chat-api service to appear in the application map as a node named **chat-api**.

    Which two actions achieve this goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute trois services Python, **chat-api**, **ingest-worker** et **embed-worker**, qui envoient leur télémétrie à la même ressource Application Insights au moyen de la distribution OpenTelemetry Azure Monitor. Aucun attribut de ressource n'est configuré : la cartographie d'application ne distingue pas les services.

    Le service chat-api doit apparaître dans la cartographie d'application sous la forme d'un nœud nommé **chat-api**.

    Quelles sont les deux actions qui permettent d'atteindre cet objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the `OTEL_SERVICE_NAME` environment variable of the chat-api container to `chat-api`.
        fr: |-
          Définir la variable d'environnement `OTEL_SERVICE_NAME` du conteneur chat-api sur `chat-api`.
    - id: b
      text:
        en: |-
          Register a span processor whose `on_start` method calls `span.set_attribute("service.name", "chat-api")`.
        fr: |-
          Inscrire un processeur d'étendues dont la méthode `on_start` appelle `span.set_attribute("service.name", "chat-api")`.
    - id: c
      text:
        en: |-
          Pass `resource=Resource.create({"service.name": "chat-api"})` to `configure_azure_monitor()` in chat-api.
        fr: |-
          Passer `resource=Resource.create({"service.name": "chat-api"})` à `configure_azure_monitor()` dans chat-api.
    - id: d
      text:
        en: |-
          Set the `OTEL_RESOURCE_ATTRIBUTES` environment variable of the chat-api container to `service.instance.id=chat-api`.
        fr: |-
          Définir la variable d'environnement `OTEL_RESOURCE_ATTRIBUTES` du conteneur chat-api sur `service.instance.id=chat-api`.
    - id: e
      text:
        en: |-
          Pass `logger_name="chat-api"` to `configure_azure_monitor()` in chat-api.
        fr: |-
          Passer `logger_name="chat-api"` à `configure_azure_monitor()` dans chat-api.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The cloud role name, which names the nodes of the application map, comes from the `service.name` resource attribute (prefixed by `service.namespace` when it's set). You can set it with the `OTEL_SERVICE_NAME` environment variable or with the `resource` argument of the distro, whose attributes take priority over the defaults.
    fr: |-
      Le nom de rôle cloud, qui nomme les nœuds de la cartographie d'application, provient de l'attribut de ressource `service.name` (précédé de `service.namespace` s'il est défini). Vous pouvez le définir avec la variable d'environnement `OTEL_SERVICE_NAME` ou avec l'argument `resource` de la distribution, dont les attributs sont prioritaires sur les valeurs par défaut.
  options:
    b:
      en: |-
        A span attribute is exported as a custom property of each item; the role name is read from the resource, not from span attributes.
      fr: |-
        Un attribut d'étendue est exporté comme propriété personnalisée de chaque élément ; le nom de rôle est lu dans la ressource, pas dans les attributs d'étendues.
    d:
      en: "`service.instance.id` sets the cloud role instance, not the cloud role name."
      fr: "`service.instance.id` définit l'instance de rôle cloud, pas le nom de rôle cloud."
    e:
      en: "`logger_name` selects which Python logger is collected; it doesn't name the service."
      fr: "`logger_name` sélectionne l'enregistreur Python collecté ; il ne nomme pas le service."
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
