id: ai200-4a-import-json
objective: "4.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso keeps the production settings of its Python RAG service in a file named `settings.prod.json`, which contains nested objects such as `{"Rag": {"Search": {"TopK": 5}}}`. You need to import the file into an App Configuration store named appcs-contoso so that this value becomes the key `Rag:Search:TopK` with the label `Prod`.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conserve les paramètres de production de son service RAG Python dans un fichier nommé `settings.prod.json`, qui contient des objets imbriqués comme `{"Rag": {"Search": {"TopK": 5}}}`. Vous devez importer le fichier dans un magasin App Configuration nommé appcs-contoso pour que cette valeur devienne la clé `Rag:Search:TopK` avec l'étiquette `Prod`.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az appconfig kv import -n appcs-contoso \
      -s [[source]] --path ./settings.prod.json \
      --format [[format]] --separator [[sep]] --label Prod
  slots:
    - id: source
      options:
        - { id: file, text: file }
        - { id: appservice, text: appservice }
        - { id: appconfig, text: appconfig }
    - id: format
      options:
        - { id: json, text: json }
        - { id: yaml, text: yaml }
        - { id: properties, text: properties }
    - id: sep
      options:
        - { id: colon, text: ":" }
        - { id: dot, text: "." }
        - { id: slash, text: "/" }
answer:
  values: { source: file, format: json, sep: colon }
explanation:
  correct:
    en: |
      `-s file` with `--path` and `--format json` imports a JSON file. `--separator` sets the character used to flatten nested objects into key names, so `:` turns `Rag` > `Search` > `TopK` into `Rag:Search:TopK`, and `--label Prod` applies the label to every imported key-value.
    fr: |
      `-s file` avec `--path` et `--format json` importe un fichier JSON. `--separator` fixe le caractère utilisé pour aplatir les objets imbriqués en noms de clés : `:` transforme `Rag` > `Search` > `TopK` en `Rag:Search:TopK`, et `--label Prod` applique l'étiquette à chaque clé-valeur importée.
  options:
    appservice: { en: "This source imports the app settings of an App Service app, not a file.", fr: "Cette source importe les paramètres d'application d'une application App Service, pas un fichier." }
    dot: { en: "`.` would produce `Rag.Search.TopK`.", fr: "`.` produirait `Rag.Search.TopK`." }
references:
  - title: az appconfig kv
    url: https://learn.microsoft.com/en-us/cli/azure/appconfig/kv
