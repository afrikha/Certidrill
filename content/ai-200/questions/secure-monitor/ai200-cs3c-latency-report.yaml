id: ai200-cs3c-latency-report
objective: "4.2.2"
type: yesno_statements
caseStudy: ai200-cs3c-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You write the query shown in the Query exhibit in the Log Analytics workspace of appi-vanarsdel for the daily report.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la requête présentée dans la pièce Requête, dans l'espace de travail Log Analytics de appi-vanarsdel, pour le rapport quotidien.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: query
    title: { en: "Query", fr: "Requête" }
    body: |
      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | where AppRoleName == "func-vanarsdel"
      | summarize Requests = count(), Failures = countif(Success == false), P95 = percentile(DurationMs, 95) by OperationName
      | top 3 by P95 desc
      ```
body:
  statements:
    - id: s1
      text:
        en: |
          The query returns at most three rows.
        fr: |
          La requête renvoie au plus trois lignes.
    - id: s2
      text:
        en: |
          The P95 column is computed only from the failed requests.
        fr: |
          La colonne P95 est calculée uniquement à partir des requêtes en échec.
    - id: s3
      text:
        en: |
          The rows are sorted from the lowest P95 value to the highest.
        fr: |
          Les lignes sont triées de la valeur P95 la plus faible à la plus élevée.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "`summarize ... by OperationName` returns one row per operation, and `top 3 by P95 desc` keeps the three rows with the highest P95, sorted in descending order. The `countif(Success == false)` aggregation counts the failures, but the `percentile(DurationMs, 95)` aggregation in the same `summarize` uses every request of the operation."
    fr: "`summarize ... by OperationName` renvoie une ligne par opération, et `top 3 by P95 desc` conserve les trois lignes dont la valeur P95 est la plus élevée, triées dans l'ordre décroissant. L'agrégation `countif(Success == false)` compte les échecs, mais l'agrégation `percentile(DurationMs, 95)` du même `summarize` utilise toutes les requêtes de l'opération."
references:
  - title: AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
