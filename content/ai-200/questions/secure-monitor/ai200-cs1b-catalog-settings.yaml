id: ai200-cs1b-catalog-settings
objective: "4.1.2"
type: dropdown
caseStudy: ai200-cs1b-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You are writing the code that loads the configuration of catalog-api by using the Azure App Configuration Python provider.

    You need to meet the configuration requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le code qui charge la configuration de catalog-api à l'aide du fournisseur Python d'Azure App Configuration.

    Vous devez satisfaire l'exigence relative à la configuration. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.appconfiguration.provider import load, SettingSelector
    from azure.identity import DefaultAzureCredential

    config = load(
        endpoint="https://appcs-wingtip.azconfig.io",
        credential=DefaultAzureCredential(),
        selects=[SettingSelector(key_filter=[[keys]], label_filter=[[label]])],
        [[trim]]=["catalog:"],
        [[flags]]=True,
    )

    top_k = int(config["SearchTopK"])
  slots:
    - id: keys
      options:
        - { id: prefix, text: "\"catalog:*\"" }
        - { id: exact, text: "\"catalog:\"" }
        - { id: all, text: "\"*\"" }
    - id: label
      options:
        - { id: prod, text: "\"prod\"" }
        - { id: nolabel, text: "\"\\0\"" }
        - { id: any, text: "\"*\"" }
    - id: trim
      options:
        - { id: trimp, text: trim_prefixes }
        - { id: refreshon, text: refresh_on }
    - id: flags
      options:
        - { id: ff, text: feature_flag_enabled }
        - { id: refreshen, text: refresh_enabled }
answer:
  values: { keys: prefix, label: prod, trim: trimp, flags: ff }
explanation:
  correct:
    en: |
      A key filter that ends with `*` selects every key that starts with `catalog:`, and `label_filter="prod"` keeps only the prod values. `trim_prefixes` removes `catalog:` from the loaded key names, so the code reads `SearchTopK`. Feature flags are not loaded by default: `feature_flag_enabled=True` loads them, including GiftFinder, under the `feature_management` key of the configuration.
    fr: |
      Un filtre de clé qui se termine par `*` sélectionne toutes les clés qui commencent par `catalog:`, et `label_filter="prod"` ne conserve que les valeurs prod. `trim_prefixes` retire `catalog:` du nom des clés chargées : le code lit `SearchTopK`. Les indicateurs de fonctionnalité ne sont pas chargés par défaut : `feature_flag_enabled=True` les charge, y compris GiftFinder, sous la clé `feature_management` de la configuration.
  options:
    exact: { en: "Without a wildcard, the filter matches only a key named exactly `catalog:`.", fr: "Sans caractère générique, le filtre ne correspond qu'à une clé nommée exactement `catalog:`." }
    all: { en: "`\"*\"` loads every key of the store, not only the catalog keys.", fr: "`\"*\"` charge toutes les clés du magasin, pas seulement les clés catalog." }
    nolabel: { en: "`\"\\0\"` selects the keys that have no label, and every catalog key has a label.", fr: "`\"\\0\"` sélectionne les clés sans étiquette, alors que toutes les clés catalog ont une étiquette." }
    any: { en: "`\"*\"` loads both the dev and prod values of each key.", fr: "`\"*\"` charge les valeurs dev et prod de chaque clé." }
    refreshon: { en: "refresh_on lists the WatchKey objects that trigger a refresh; it does not rename keys.", fr: "refresh_on liste les objets WatchKey qui déclenchent une actualisation ; il ne renomme pas les clés." }
    refreshen: { en: "refresh_enabled turns on configuration refresh; it does not load the feature flags.", fr: "refresh_enabled active l'actualisation de la configuration ; il ne charge pas les indicateurs de fonctionnalité." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
