id: ai200-4b-kql-filter-aggregate
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam's SRE team needs the API operations whose failure rate exceeded 5 percent during the last day. A developer writes the following query, which returns an error:

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1d)
    | where FailureRate > 5
    | summarize Total = sum(ItemCount), Failed = sumif(ItemCount, Success == false) by Name
    | extend FailureRate = 100.0 * Failed / Total
    ```

    What should you do to return the expected operations?
  fr: |
    L'équipe SRE de Fabrikam a besoin des opérations d'API dont le taux d'échec a dépassé 5 % au cours de la dernière journée. Un développeur écrit la requête suivante, qui renvoie une erreur :

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1d)
    | where FailureRate > 5
    | summarize Total = sum(ItemCount), Failed = sumif(ItemCount, Success == false) by Name
    | extend FailureRate = 100.0 * Failed / Total
    ```

    Que devez-vous faire pour renvoyer les opérations attendues ?
body:
  options:
    - id: a
      text:
        en: |-
          Move the `where FailureRate > 5` line so that it follows the `summarize` line.
        fr: |-
          Déplacer la ligne `where FailureRate > 5` pour qu'elle suive la ligne `summarize`.
    - id: b
      text:
        en: |-
          Replace `where FailureRate > 5` with `where Success == false`.
        fr: |-
          Remplacer `where FailureRate > 5` par `where Success == false`.
    - id: c
      text:
        en: |-
          Move the `where FailureRate > 5` line so that it follows the `extend` line.
        fr: |-
          Déplacer la ligne `where FailureRate > 5` pour qu'elle suive la ligne `extend`.
    - id: d
      text:
        en: |-
          Add `FailureRate` to the `by` clause of the `summarize` line.
        fr: |-
          Ajouter `FailureRate` à la clause `by` de la ligne `summarize`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Each operator works on the output of the previous one. `FailureRate` exists only after the `extend` line computes it from the aggregates, so the condition on it must come last. The time filter stays before `summarize` because it applies to individual rows.
    fr: |-
      Chaque opérateur travaille sur la sortie du précédent. `FailureRate` n'existe qu'après la ligne `extend` qui le calcule à partir des agrégats : la condition qui le concerne doit venir en dernier. Le filtre de temps reste avant `summarize`, car il s'applique aux lignes individuelles.
  options:
    a:
      en: |-
        After `summarize`, the columns are `Name`, `Total` and `Failed`; `FailureRate` isn't computed until the `extend` line.
      fr: |-
        Après `summarize`, les colonnes sont `Name`, `Total` et `Failed` ; `FailureRate` n'est calculé qu'à la ligne `extend`.
    b:
      en: |-
        Keeping only failed rows makes every remaining operation 100 % failed, so the rate is meaningless.
      fr: |-
        Ne conserver que les lignes en échec donne 100 % d'échec à chaque opération restante : le taux n'a plus de sens.
    d:
      en: "`FailureRate` doesn't exist in the input rows, so it can't be a grouping column."
      fr: "`FailureRate` n'existe pas dans les lignes d'entrée : il ne peut pas servir de colonne de regroupement."
references:
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
  - title: where operator
    url: https://learn.microsoft.com/en-us/kusto/query/where-operator
