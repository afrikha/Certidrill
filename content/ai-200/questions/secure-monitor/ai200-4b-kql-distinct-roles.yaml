id: ai200-4b-kql-distinct-roles
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs about twenty Python microservices that send telemetry to the same Application Insights resource. Each service sets its own cloud role name.

    You need a query that returns one row for each cloud role name that received at least one request during the last hour.

    Which line should you append to `AppRequests | where TimeGenerated > ago(1h)`?
  fr: |
    Adatum exécute une vingtaine de microservices Python qui envoient leur télémétrie à la même ressource Application Insights. Chaque service définit son propre nom de rôle cloud.

    Vous avez besoin d'une requête qui renvoie une ligne par nom de rôle cloud ayant reçu au moins une requête au cours de la dernière heure.

    Quelle ligne devez-vous ajouter à la fin de `AppRequests | where TimeGenerated > ago(1h)` ?
body:
  options:
    - { id: a, text: "`| project AppRoleName`" }
    - { id: b, text: "`| distinct AppRoleName`" }
    - { id: c, text: "`| top 1 by AppRoleName`" }
    - { id: d, text: "`| take 1`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`distinct` returns one row for each distinct combination of the listed columns, here each cloud role name stored in `AppRoleName`."
    fr: "`distinct` renvoie une ligne par combinaison distincte des colonnes listées, ici chaque nom de rôle cloud stocké dans `AppRoleName`."
  options:
    a:
      en: "`project` keeps one output row per input row, so each role appears once per request."
      fr: "`project` conserve une ligne de sortie par ligne d'entrée : chaque rôle apparaît une fois par requête."
    c:
      en: "`top 1` returns a single row in total, the one with the highest role name in sort order."
      fr: "`top 1` renvoie une seule ligne au total, celle dont le nom de rôle est le plus élevé dans l'ordre de tri."
    d:
      en: "`take 1` returns one arbitrary row, not one row per role."
      fr: "`take 1` renvoie une ligne arbitraire, pas une ligne par rôle."
references:
  - title: distinct operator
    url: https://learn.microsoft.com/en-us/kusto/query/distinct-operator
