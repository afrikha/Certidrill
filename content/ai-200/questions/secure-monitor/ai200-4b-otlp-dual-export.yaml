id: ai200-4b-otlp-dual-export
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's Python vector-search service sends its traces to Application Insights through the Azure Monitor OpenTelemetry Distro. The platform team also runs an OpenTelemetry Collector with an OTLP receiver at `http://otel-collector:4317`.

    You need every span of the service to be sent to both Application Insights and the collector.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le service Python de recherche vectorielle de Fabrikam envoie ses traces à Application Insights au moyen de la distribution OpenTelemetry Azure Monitor. L'équipe plateforme exécute aussi un collecteur OpenTelemetry avec un récepteur OTLP à l'adresse `http://otel-collector:4317`.

    Chaque étendue du service doit être envoyée à la fois à Application Insights et au collecteur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: install
      text: { en: "Install the `opentelemetry-exporter-otlp` package.", fr: "Installer le package `opentelemetry-exporter-otlp`." }
    - id: configure
      text: { en: "Call `configure_azure_monitor()` at startup.", fr: "Appeler `configure_azure_monitor()` au démarrage." }
    - id: add
      text: { en: "Add a `BatchSpanProcessor` that wraps an `OTLPSpanExporter` for the collector endpoint to the provider returned by `trace.get_tracer_provider()`.", fr: "Ajouter un `BatchSpanProcessor` qui encapsule un `OTLPSpanExporter` pour le point de terminaison du collecteur au fournisseur renvoyé par `trace.get_tracer_provider()`." }
    - id: second
      text: { en: "Also call `use_microsoft_opentelemetry()` from the Microsoft OpenTelemetry Distro with the collector endpoint.", fr: "Appeler aussi `use_microsoft_opentelemetry()` de la distribution Microsoft OpenTelemetry avec le point de terminaison du collecteur." }
    - id: none
      text: { en: "Set the `OTEL_TRACES_EXPORTER` environment variable to `None`.", fr: "Définir la variable d'environnement `OTEL_TRACES_EXPORTER` sur `None`." }
    - id: connstr
      text: { en: "Set `APPLICATIONINSIGHTS_CONNECTION_STRING` to the collector endpoint.", fr: "Définir `APPLICATIONINSIGHTS_CONNECTION_STRING` sur le point de terminaison du collecteur." }
answer:
  sequence: [ install, configure, add ]
explanation:
  correct:
    en: |-
      The OTLP exporter comes from the `opentelemetry-exporter-otlp` package. The distro sets up the tracer provider with its Azure Monitor exporter, and you then add a batch span processor with the OTLP span exporter to that provider, so each span goes to both destinations.
    fr: |-
      L'exportateur OTLP provient du package `opentelemetry-exporter-otlp`. La distribution configure le fournisseur de traceurs avec son exportateur Azure Monitor, puis vous ajoutez à ce fournisseur un processeur d'étendues par lots avec l'exportateur d'étendues OTLP : chaque étendue part vers les deux destinations.
  options:
    second:
      en: |-
        Microsoft states that you must not initialize two distros, or a second provider for the same signal, in the same application.
      fr: |-
        Microsoft indique qu'il ne faut pas initialiser deux distributions, ni un second fournisseur pour le même signal, dans la même application.
    none:
      en: |-
        This setting disables the export of traces by the distro, so nothing would reach Application Insights.
      fr: |-
        Ce paramètre désactive l'export des traces par la distribution : rien n'atteindrait Application Insights.
    connstr:
      en: |-
        The connection string identifies the Application Insights resource; replacing it would break the Azure Monitor export.
      fr: |-
        La chaîne de connexion identifie la ressource Application Insights ; la remplacer casserait l'export vers Azure Monitor.
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
