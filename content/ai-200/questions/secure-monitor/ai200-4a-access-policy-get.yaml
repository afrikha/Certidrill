id: ai200-4a-access-policy-get
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a Python document-summarization API on Azure App Service. The API uses its system-assigned managed identity to read one secret named `openai-api-key` from a key vault named kv-fabrikam by calling `SecretClient.get_secret("openai-api-key")`.

    kv-fabrikam uses the vault access policy permission model. You need to grant the managed identity access by following the principle of least privilege.

    Which secret permissions should you include in the access policy?
  fr: |
    Fabrikam exécute une API Python de synthèse de documents sur Azure App Service. L'API utilise son identité managée affectée par le système pour lire un secret nommé `openai-api-key` dans un coffre de clés nommé kv-fabrikam en appelant `SecretClient.get_secret("openai-api-key")`.

    kv-fabrikam utilise le modèle d'autorisation par stratégie d'accès au coffre. Vous devez accorder l'accès à l'identité managée en respectant le principe du moindre privilège.

    Quelles autorisations sur les secrets devez-vous inclure dans la stratégie d'accès ?
body:
  options:
    - { id: a, text: { en: "Get and List", fr: "Get et List" } }
    - { id: b, text: { en: "Get only", fr: "Get uniquement" } }
    - { id: c, text: { en: "List only", fr: "List uniquement" } }
    - { id: d, text: { en: "Get, List and Set", fr: "Get, List et Set" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Reading a secret value by name needs only the Get permission on secrets, which is what App Service and the SDK use. The API never enumerates the vault, so List isn't needed, and it never writes, so Set isn't needed.
    fr: |
      Lire la valeur d'un secret par son nom ne nécessite que l'autorisation Get sur les secrets. L'API n'énumère jamais le coffre : List n'est pas nécessaire, et elle n'écrit jamais : Set n'est pas nécessaire.
  options:
    a: { en: "List enumerates the secrets of the vault, which the API never does, so it exceeds least privilege.", fr: "List énumère les secrets du coffre, ce que l'API ne fait jamais : cela dépasse le moindre privilège." }
    c: { en: "List returns secret properties without values, so `get_secret` would fail.", fr: "List renvoie les propriétés des secrets sans leurs valeurs : `get_secret` échouerait." }
    d: { en: "Set lets the identity write new versions, and List isn't needed either.", fr: "Set permet à l'identité d'écrire de nouvelles versions, et List n'est pas nécessaire non plus." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
