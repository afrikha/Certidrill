id: ai200-cs3c-config-refresh
objective: "4.1.2"
type: single
caseStudy: ai200-cs3c-vanarsdel
difficulty: 3
status: draft
stem:
  en: |
    You need to update the configuration code of app-vanarsdel-shop to meet the configuration requirement. The code uses `load` and `WatchKey` from `azure.appconfiguration.provider`. What should you do?
  fr: |
    Vous devez mettre à jour le code de configuration de app-vanarsdel-shop pour respecter l'exigence relative à la configuration. Le code utilise `load` et `WatchKey` de `azure.appconfiguration.provider`. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Call `load()` at startup with `refresh_on=[WatchKey(\"Shop:Sentinel\")]` and `refresh_interval=60`, and read the values from the returned object in each request."
        fr: "Appeler `load()` au démarrage avec `refresh_on=[WatchKey(\"Shop:Sentinel\")]` et `refresh_interval=60`, et lire les valeurs dans l'objet renvoyé à chaque requête."
    - id: b
      text:
        en: "Call `load()` at startup with `refresh_on=[WatchKey(\"Shop:Sentinel\")]` and `refresh_interval=60`, and call `refresh()` on the returned object at the start of each request."
        fr: "Appeler `load()` au démarrage avec `refresh_on=[WatchKey(\"Shop:Sentinel\")]` et `refresh_interval=60`, et appeler `refresh()` sur l'objet renvoyé au début de chaque requête."
    - id: c
      text:
        en: "Call `load()` at startup with one `WatchKey` for each `Shop:` key and `refresh_interval=60`, and call `refresh()` on the returned object at the start of each request."
        fr: "Appeler `load()` au démarrage avec un `WatchKey` pour chaque clé `Shop:` et `refresh_interval=60`, et appeler `refresh()` sur l'objet renvoyé au début de chaque requête."
    - id: d
      text:
        en: "Call `load()` at the start of each request to read the current `Shop:` settings from appcs-vanarsdel."
        fr: "Appeler `load()` au début de chaque requête pour lire les paramètres `Shop:` actuels dans appcs-vanarsdel."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Python provider refreshes only when the application calls `refresh()`, and the call returns at once if the refresh interval has not elapsed, so calling it in each request costs at most one check of the sentinel every 60 seconds. When the watched sentinel key changes, the provider reloads all the selected settings together, which keeps the configuration consistent.
    fr: |
      Le fournisseur Python n'actualise la configuration que lorsque l'application appelle `refresh()`, et l'appel rend la main immédiatement si l'intervalle d'actualisation n'est pas écoulé : l'appeler à chaque requête coûte au plus une vérification de la sentinelle toutes les 60 secondes. Quand la clé sentinelle surveillée change, le fournisseur recharge ensemble tous les paramètres sélectionnés, ce qui garde la configuration cohérente.
  options:
    a:
      en: |
        Without calls to `refresh()`, the provider never checks the sentinel, so the values loaded at startup never change.
      fr: |
        Sans appel à `refresh()`, le fournisseur ne vérifie jamais la sentinelle : les valeurs chargées au démarrage ne changent jamais.
    c:
      en: |
        Watching every key sends more requests to appcs-vanarsdel and can apply a change while the operations team is still updating the other keys.
      fr: |
        Surveiller chaque clé envoie plus de requêtes à appcs-vanarsdel et peut appliquer une modification pendant que l'équipe d'exploitation met encore à jour les autres clés.
    d:
      en: |
        Loading the whole configuration in every request multiplies the requests to appcs-vanarsdel.
      fr: |
        Charger toute la configuration à chaque requête multiplie les requêtes adressées à appcs-vanarsdel.
references:
  - title: "Tutorial: Use dynamic configuration in Python"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/enable-dynamic-configuration-python
