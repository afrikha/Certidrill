id: ai200-cs3a-order-tracing
objective: "4.2.1"
type: single
caseStudy: ai200-cs3a-coho-vineyard
difficulty: 1
status: draft
stem:
  en: |
    The end-to-end transaction view of appi-coho shows the requests to app-coho-pairing and the messages that it sends to the orders topic, but nothing from app-coho-fulfil. You need to meet the tracing requirement. What should you do?
  fr: |
    La vue des transactions de bout en bout de appi-coho montre les requêtes adressées à app-coho-pairing et les messages qu'elle envoie à la rubrique orders, mais rien de app-coho-fulfil. Vous devez respecter l'exigence de traçage. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In app-coho-fulfil, call `configure_azure_monitor()` at startup and add the `APPLICATIONINSIGHTS_CONNECTION_STRING` app setting with the connection string of appi-coho."
        fr: "Dans app-coho-fulfil, appeler `configure_azure_monitor()` au démarrage et ajouter le paramètre d'application `APPLICATIONINSIGHTS_CONNECTION_STRING` avec la chaîne de connexion de appi-coho."
    - id: b
      text:
        en: "In app-coho-fulfil, call `configure_azure_monitor(connection_string=\"<connection string of appi-coho>\")` at startup."
        fr: "Dans app-coho-fulfil, appeler `configure_azure_monitor(connection_string=\"<chaîne de connexion de appi-coho>\")` au démarrage."
    - id: c
      text:
        en: "Enable App Service logs on app-coho-fulfil and send its console logs to the workspace of appi-coho by using a diagnostic setting."
        fr: "Activer les journaux App Service sur app-coho-fulfil et envoyer ses journaux de console vers l'espace de travail de appi-coho à l'aide d'un paramètre de diagnostic."
    - id: d
      text:
        en: "In app-coho-pairing, wrap the call that sends each order message in `tracer.start_as_current_span(\"send-order\")`."
        fr: "Dans app-coho-pairing, encadrer l'appel qui envoie chaque message de commande par `tracer.start_as_current_span(\"send-order\")`."
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Monitor OpenTelemetry Distro must also run in app-coho-fulfil so that its spans are exported to appi-coho. `configure_azure_monitor()` without arguments reads the connection string from the `APPLICATIONINSIGHTS_CONNECTION_STRING` environment variable, which App Service sets from the app setting, so no connection string appears in the code. The Azure SDK tracing instrumentation, enabled by default in the distro, records the Service Bus operations of both apps in the same distributed trace.
    fr: |
      La distribution OpenTelemetry Azure Monitor doit aussi s'exécuter dans app-coho-fulfil pour que ses étendues (spans) soient exportées vers appi-coho. `configure_azure_monitor()` sans argument lit la chaîne de connexion dans la variable d'environnement `APPLICATIONINSIGHTS_CONNECTION_STRING`, qu'App Service définit à partir du paramètre d'application : aucune chaîne de connexion n'apparaît dans le code. L'instrumentation de traçage du SDK Azure, activée par défaut dans la distribution, enregistre les opérations Service Bus des deux applications dans la même trace distribuée.
  options:
    b:
      en: |
        Passing the connection string as an argument puts it in the code, which the requirement forbids.
      fr: |
        Passer la chaîne de connexion en argument la place dans le code, ce que l'exigence interdit.
    c:
      en: |
        Console logs are log records, not spans; they do not appear in the end-to-end transaction view of the order.
      fr: |
        Les journaux de console sont des enregistrements de journal, pas des étendues ; ils n'apparaissent pas dans la vue des transactions de bout en bout de la commande.
    d:
      en: |
        A custom span in app-coho-pairing adds detail on the sender side only; app-coho-fulfil still exports no telemetry.
      fr: |
        Une étendue personnalisée dans app-coho-pairing ajoute du détail côté émetteur uniquement ; app-coho-fulfil n'exporte toujours aucune donnée de télémétrie.
references:
  - title: Azure Monitor OpenTelemetry Distro for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
  - title: Enable OpenTelemetry for .NET, Node.js, Python, and Java applications
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-enable
