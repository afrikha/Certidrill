id: ai200-4b-distro-options
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank instruments a Python fraud-explanation service with the Azure Monitor OpenTelemetry Distro. The service hosts its public API with FastAPI and an internal admin console with Flask in the same process.

    The security team sets the following requirements:

    - Live Metrics must be turned off.
    - Telemetry that can't be sent must never be written to the local disk.
    - The requests of the Flask admin console must not be traced. The FastAPI requests must still be traced.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank instrumente un service Python d'explication des fraudes avec la distribution OpenTelemetry Azure Monitor. Le service héberge son API publique avec FastAPI et une console d'administration interne avec Flask dans le même processus.

    L'équipe de sécurité fixe les exigences suivantes :

    - Live Metrics doit être désactivé.
    - La télémétrie qui ne peut pas être envoyée ne doit jamais être écrite sur le disque local.
    - Les requêtes de la console d'administration Flask ne doivent pas être tracées. Les requêtes FastAPI doivent toujours être tracées.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.monitor.opentelemetry import configure_azure_monitor

    configure_azure_monitor(
        logger_name="woodgrove.fraud",
        [[live]]=False,
        [[disk]]=True,
        [[instr]]={"flask": {"enabled": False}},
    )
  slots:
    - id: live
      options:
        - { id: live, text: enable_live_metrics }
        - { id: perf, text: enable_performance_counters }
        - { id: sampling, text: sampling_ratio }
    - id: disk
      options:
        - { id: offline, text: disable_offline_storage }
        - { id: perf, text: enable_performance_counters }
        - { id: live, text: enable_live_metrics }
    - id: instr
      options:
        - { id: options, text: instrumentation_options }
        - { id: processors, text: span_processors }
        - { id: views, text: views }
answer:
  values: { live: live, disk: offline, instr: options }
explanation:
  correct:
    en: "`enable_live_metrics` defaults to True, so you set it to False. Exporter options such as `disable_offline_storage=True` can be passed directly to `configure_azure_monitor()` and stop the local caching of unsent telemetry. `instrumentation_options` is a nested dictionary keyed by library name that disables the Flask instrumentation while FastAPI stays enabled."
    fr: "`enable_live_metrics` vaut True par défaut : vous le définissez sur False. Les options de l'exportateur, comme `disable_offline_storage=True`, peuvent être passées directement à `configure_azure_monitor()` et arrêtent la mise en cache locale de la télémétrie non envoyée. `instrumentation_options` est un dictionnaire imbriqué indexé par nom de bibliothèque qui désactive l'instrumentation Flask, tandis que FastAPI reste activée."
  options:
    perf:
      en: |-
        enable_performance_counters controls the collection of performance counters, not Live Metrics or offline storage.
      fr: |-
        enable_performance_counters contrôle la collecte des compteurs de performances, pas Live Metrics ni le stockage hors connexion.
    sampling:
      en: |-
        sampling_ratio is a number between 0 and 1 for the trace sampler; it doesn't turn off Live Metrics.
      fr: |-
        sampling_ratio est un nombre compris entre 0 et 1 pour l'échantillonneur de traces ; il ne désactive pas Live Metrics.
    processors:
      en: |-
        span_processors expects a list of processors, not a dictionary of instrumentations.
      fr: |-
        span_processors attend une liste de processeurs, pas un dictionnaire d'instrumentations.
    views:
      en: |-
        views customize the exported metrics; they don't control instrumentations.
      fr: |-
        views personnalisent les métriques exportées ; elles ne contrôlent pas les instrumentations.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
