id: ai200-sr1-rotated-key-3
objective: "4.1.1"
type: series_yesno
series: ai200-sr1-rotated-key
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You assign the Key Vault Secrets User role and read the secret by name.
  fr: Vous attribuez le rôle Key Vault Secrets User et lisez le secret par son nom.
body:
  solution:
    en: |
      You assign the **Key Vault Secrets User** role to the managed identity of app-woodgrove-chat at the scope of kv-woodgrove. The app reads the key with the following code:

      `api_key = client.get_secret("search-api-key").value`
    fr: |
      Vous attribuez le rôle **Key Vault Secrets User** à l'identité managée de app-woodgrove-chat à l'étendue de kv-woodgrove. L'application lit la clé avec le code suivant :

      `api_key = client.get_secret("search-api-key").value`
answer: { value: true }
explanation:
  correct:
    en: Key Vault Secrets User can read secret contents but cannot create, modify or delete secrets. When `get_secret` receives no version, it returns the latest version of the secret, so the hourly read picks up each new version after a rotation, and the managed identity removes the need to store any credential.
    fr: "Key Vault Secrets User peut lire le contenu des secrets, mais ne peut ni créer, ni modifier, ni supprimer de secrets. Lorsque `get_secret` ne reçoit pas de version, il renvoie la version la plus récente du secret : la lecture horaire récupère chaque nouvelle version après un renouvellement, et l'identité managée évite de stocker toute information d'identification."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
