id: ai200-4b-telemetry-tables
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso's Python RAG API is instrumented with the Azure Monitor OpenTelemetry Distro and sends telemetry to a workspace-based Application Insights resource. The distro collects the logger used by the code.

    In which Log Analytics table does the telemetry produced by each piece of code land? To answer, drag the appropriate tables to the correct code. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API RAG Python de Contoso est instrumentée avec la distribution OpenTelemetry Azure Monitor et envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail. La distribution collecte l'enregistreur utilisé par le code.

    Dans quelle table Log Analytics arrive la télémétrie produite par chaque portion de code ? Pour répondre, faites glisser les tables appropriées vers le code correspondant. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: traces, text: AppTraces }
    - { id: requests, text: AppRequests }
    - { id: deps, text: AppDependencies }
    - { id: exceptions, text: AppExceptions }
    - { id: metrics, text: AppMetrics }
    - { id: events, text: AppEvents }
  targets:
    - id: log
      text: '`logger.warning("Index stale", extra={"index": "products"})`'
    - id: span
      text: '`with tracer.start_as_current_span("chunk-text"):` (default span kind)'
    - id: counter
      text: '`tokens.add(812, {"model": "gpt-4.1-mini"})` on a counter'
    - id: raise
      text: { en: "A `ValueError` that leaves a `start_as_current_span` block", fr: "Une `ValueError` qui sort d'un bloc `start_as_current_span`" }
answer:
  mapping: { log: traces, span: deps, counter: metrics, raise: exceptions }
explanation:
  correct:
    en: |-
      Python log records become trace telemetry in `AppTraces`, with the `extra` keys as custom properties. A span with the default INTERNAL kind is a dependency of type InProc in `AppDependencies`. Counter values are custom metrics in `AppMetrics`. An exception that escapes a span block is recorded automatically and exported as exception telemetry in `AppExceptions`.
    fr: |-
      Les enregistrements de journaux Python deviennent une télémétrie de trace dans `AppTraces`, avec les clés d'`extra` comme propriétés personnalisées. Une étendue du type par défaut INTERNAL est une dépendance de type InProc dans `AppDependencies`. Les valeurs d'un compteur sont des métriques personnalisées dans `AppMetrics`. Une exception qui sort d'un bloc d'étendue est enregistrée automatiquement et exportée comme télémétrie d'exception dans `AppExceptions`.
references:
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
