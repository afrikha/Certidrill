id: ai200-4b-trace-id-header
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's support team asks users of a Python chat API for the ID shown on error pages, and then searches for all the telemetry of the failed request by its `OperationId` in Application Insights. The API is instrumented with the Azure Monitor OpenTelemetry Distro, and the request handler runs inside the span created by the Flask instrumentation.

    You need to get the value to return in an `X-Trace-Id` response header. The value is formatted as hexadecimal before it's written.

    Which expression should you use?
  fr: |
    L'équipe de support de Contoso demande aux utilisateurs d'une API de conversation Python l'ID affiché sur les pages d'erreur, puis recherche toute la télémétrie de la requête en échec par son `OperationId` dans Application Insights. L'API est instrumentée avec la distribution OpenTelemetry Azure Monitor, et le gestionnaire de requêtes s'exécute dans l'étendue créée par l'instrumentation Flask.

    Vous devez obtenir la valeur à renvoyer dans un en-tête de réponse `X-Trace-Id`. La valeur est mise au format hexadécimal avant d'être écrite.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - id: a
      text: '`trace.get_current_span().get_span_context().span_id`'
    - id: b
      text: '`trace.get_current_span().get_span_context().trace_state`'
    - id: c
      text: '`trace.get_current_span().get_span_context().trace_id`'
    - id: d
      text: '`trace.get_tracer_provider().get_tracer(__name__)`'
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The span context of the current span carries the trace ID shared by every span of the distributed operation. Application Insights stores this trace ID in the `OperationId` column, so support can find the request, its dependencies, logs and exceptions with it.
    fr: |-
      Le contexte de l'étendue courante porte l'ID de trace partagé par toutes les étendues de l'opération distribuée. Application Insights stocke cet ID de trace dans la colonne `OperationId` : le support peut ainsi retrouver la requête, ses dépendances, ses journaux et ses exceptions.
  options:
    a:
      en: |-
        The span ID identifies only the current span (the `Id` column of one row), not the whole operation.
      fr: |-
        L'ID d'étendue identifie seulement l'étendue courante (la colonne `Id` d'une ligne), pas l'opération entière.
    b:
      en: |-
        The trace state carries vendor-specific key-value pairs propagated with the trace, not its identifier.
      fr: |-
        L'état de trace contient des paires clé-valeur propres aux fournisseurs propagées avec la trace, pas son identifiant.
    d:
      en: |-
        This call returns a tracer used to create spans; it holds no ID of the current request.
      fr: |-
        Cet appel renvoie un traceur servant à créer des étendues ; il ne contient aucun ID de la requête en cours.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
