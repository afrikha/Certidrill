id: ai200-4a-tag-filters
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip shares one App Configuration store between several AI teams. Key-values have no label and carry tags such as `team` and `region`. The search team's Python service must load only the key-values that have both the tag `team=search` and the tag `region=eu`.

    Which `selects` argument should you pass to `load()`?
  fr: |
    Wingtip partage un magasin App Configuration entre plusieurs équipes IA. Les clés-valeurs n'ont pas d'étiquette et portent des balises comme `team` et `region`. Le service Python de l'équipe de recherche ne doit charger que les clés-valeurs qui ont à la fois la balise `team=search` et la balise `region=eu`.

    Quel argument `selects` devez-vous passer à `load()` ?
body:
  options:
    - id: a
      text: "selects=[SettingSelector(key_filter=\"*\", label_filter=\"\\0\", tag_filters=[{\"team\": \"search\"}]), SettingSelector(key_filter=\"*\", label_filter=\"\\0\", tag_filters=[{\"region\": \"eu\"}])]"
    - id: b
      text: "selects=[SettingSelector(key_filter=\"team=search,region=eu\", label_filter=\"\\0\")]"
    - id: c
      text: "selects=[SettingSelector(key_filter=\"*\", label_filter=\"team=search,region=eu\")]"
    - id: d
      text: "selects=[SettingSelector(key_filter=\"*\", label_filter=\"\\0\", tag_filters=[{\"team\": \"search\"}, {\"region\": \"eu\"}])]"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Within one selector, a key-value is loaded only if it has all the tags listed in `tag_filters`, so a single selector with both tags returns exactly the key-values tagged `team=search` and `region=eu`. `label_filter="\0"` matches key-values without a label.
    fr: |
      Dans un même sélecteur, une clé-valeur n'est chargée que si elle possède toutes les balises listées dans `tag_filters` : un sélecteur unique avec les deux balises renvoie exactement les clés-valeurs balisées `team=search` et `region=eu`. `label_filter="\0"` correspond aux clés-valeurs sans étiquette.
  options:
    a: { en: "Each selector adds its own results, so this loads key-values that have either tag, not only those with both.", fr: "Chaque sélecteur ajoute ses propres résultats : cela charge les clés-valeurs qui ont l'une ou l'autre balise, pas seulement celles qui ont les deux." }
    b: { en: "A key filter matches key names; this one looks for keys named `team=search` or `region=eu`.", fr: "Un filtre de clé porte sur les noms de clés : celui-ci recherche des clés nommées `team=search` ou `region=eu`." }
    c: { en: "A label filter matches labels, and the key-values have no label.", fr: "Un filtre d'étiquette porte sur les étiquettes, et les clés-valeurs n'en ont pas." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
