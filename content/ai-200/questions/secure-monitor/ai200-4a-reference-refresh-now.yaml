id: ai200-4a-reference-refresh-now
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Alpine Ski House runs a Python booking assistant on Azure App Service. The app setting `PAYMENT_KEY` contains `@Microsoft.KeyVault(VaultName=kv-alpine;SecretName=payment-key)`, and the app's managed identity has the Key Vault Secrets User role on kv-alpine.

    After a leak, the security team writes a new version of payment-key. The app must start using the new value now, without waiting for the periodic refresh of Key Vault references and without code changes.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Alpine Ski House exécute un assistant de réservation Python sur Azure App Service. Le paramètre d'application `PAYMENT_KEY` contient `@Microsoft.KeyVault(VaultName=kv-alpine;SecretName=payment-key)`, et l'identité managée de l'application a le rôle Key Vault Secrets User sur kv-alpine.

    Après une fuite, l'équipe de sécurité écrit une nouvelle version de payment-key. L'application doit utiliser la nouvelle valeur dès maintenant, sans attendre l'actualisation périodique des références Key Vault et sans modification du code.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Send an authenticated POST request to the `config/configreferences/appsettings/refresh` endpoint of the app.", fr: "Envoyer une requête POST authentifiée au point de terminaison `config/configreferences/appsettings/refresh` de l'application." } }
    - { id: b, text: { en: "Create an Event Grid subscription on kv-alpine for `Microsoft.KeyVault.SecretNewVersionCreated` with the web app as the endpoint.", fr: "Créer un abonnement Event Grid sur kv-alpine pour `Microsoft.KeyVault.SecretNewVersionCreated` avec l'application web comme point de terminaison." } }
    - { id: c, text: { en: "Add or change any app setting of the app.", fr: "Ajouter ou modifier n'importe quel paramètre d'application de l'application." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets Officer role on kv-alpine to the app's managed identity.", fr: "Attribuer le rôle Key Vault Secrets Officer sur kv-alpine à l'identité managée de l'application." } }
    - { id: e, text: { en: "Disable the previous version of payment-key in kv-alpine.", fr: "Désactiver la version précédente de payment-key dans kv-alpine." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      App Service caches resolved references and refetches them every 24 hours. An authenticated POST to `https://management.azure.com/<app resource ID>/config/configreferences/appsettings/refresh` forces resolution, and any configuration change restarts the app and refetches every referenced secret at once. Because the reference has no version, both actions return the new version.
    fr: |
      App Service met en cache les références résolues et les récupère de nouveau toutes les 24 heures. Une requête POST authentifiée vers `https://management.azure.com/<ID de ressource de l'application>/config/configreferences/appsettings/refresh` force la résolution, et toute modification de configuration redémarre l'application et récupère immédiatement tous les secrets référencés. La référence n'ayant pas de version, les deux actions renvoient la nouvelle version.
  options:
    b: { en: "A web app isn't an Event Grid handler that refreshes its references; the cached value stays until the next refetch.", fr: "Une application web n'est pas un gestionnaire Event Grid qui actualise ses références : la valeur en cache reste jusqu'à la prochaine récupération." }
    d: { en: "The identity can already read the secret; a broader role doesn't refresh the cached value.", fr: "L'identité peut déjà lire le secret : un rôle plus large n'actualise pas la valeur en cache." }
    e: { en: "Disabling the old version in the vault doesn't clear the value that App Service has already cached.", fr: "Désactiver l'ancienne version dans le coffre ne vide pas la valeur qu'App Service a déjà mise en cache." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
