id: ai200-4a-throttling-fix
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a Python chat API on Azure Container Apps that scales out to 40 replicas at peak. Each incoming request calls `client.get_secret("search-key")` on a key vault named kv-contoso-chat before it queries the search index. During peaks, many requests fail because Key Vault returns HTTP 429.

    You need to stop the failures and follow the Key Vault throttling guidance.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une API de conversation Python sur Azure Container Apps qui monte jusqu'à 40 réplicas en pointe. Chaque requête entrante appelle `client.get_secret("search-key")` sur un coffre de clés nommé kv-contoso-chat avant d'interroger l'index de recherche. Pendant les pointes, de nombreuses requêtes échouent, car Key Vault renvoie HTTP 429.

    Vous devez mettre fin aux échecs en suivant les recommandations de Key Vault sur la limitation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Cache the secret value in memory, and read it again from kv-contoso-chat only when the cached value stops working.", fr: "Mettre en cache la valeur du secret en mémoire, et ne la relire dans kv-contoso-chat que lorsque la valeur en cache ne fonctionne plus." } }
    - { id: b, text: { en: "Retry each request that returns HTTP 429 immediately, until it succeeds.", fr: "Réessayer immédiatement chaque requête qui renvoie HTTP 429, jusqu'à ce qu'elle réussisse." } }
    - { id: c, text: { en: "Retry requests that return HTTP 429 with an exponential backoff.", fr: "Réessayer les requêtes qui renvoient HTTP 429 avec une temporisation exponentielle." } }
    - { id: d, text: { en: "Replace `get_secret` with `list_properties_of_secrets`, which costs fewer transactions.", fr: "Remplacer `get_secret` par `list_properties_of_secrets`, qui coûte moins de transactions." } }
    - { id: e, text: { en: "Pass an explicit `version` to `get_secret` in each request.", fr: "Passer une `version` explicite à `get_secret` dans chaque requête." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Key Vault returns HTTP 429 when a client exceeds the service thresholds. The guidance is to cache retrieved secrets in memory and re-read them only when the cached copy stops working (for example after a rotation), and to retry throttled requests with an exponential backoff (1, 2, 4, 8, 16 seconds) instead of retrying at once.
    fr: |
      Key Vault renvoie HTTP 429 quand un client dépasse les seuils du service. Les recommandations sont de mettre en cache en mémoire les secrets récupérés et de ne les relire que lorsque la copie en cache ne fonctionne plus (par exemple après une rotation), et de réessayer les requêtes limitées avec une temporisation exponentielle (1, 2, 4, 8, 16 secondes) plutôt que tout de suite.
  options:
    b: { en: "Immediate retries add load while the client is throttled; the guidance says to avoid them.", fr: "Les nouvelles tentatives immédiates ajoutent de la charge pendant la limitation : les recommandations disent de les éviter." }
    d: { en: "Listing returns properties without values, so the API couldn't get the key, and each call is still a transaction.", fr: "Les méthodes de liste renvoient des propriétés sans valeurs : l'API ne pourrait pas obtenir la clé, et chaque appel reste une transaction." }
    e: { en: "A versioned read is still one Key Vault transaction per request, so the throttling continues.", fr: "Une lecture avec version reste une transaction Key Vault par requête : la limitation continue." }
references:
  - title: Azure Key Vault throttling guidance
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-throttling
