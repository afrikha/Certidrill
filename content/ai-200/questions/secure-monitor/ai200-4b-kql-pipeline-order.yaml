id: ai200-4b-kql-pipeline-order
objective: "4.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's API team needs a KQL query that lists the operations of a Python fraud-scoring API whose 95th percentile duration exceeded 2,000 ms during the last day. The result must contain one row per operation name with its 95th percentile duration.

    Which four lines should you use to build the query, in sequence? To answer, move the appropriate lines from the list of lines to the answer area and arrange them in the correct order.
  fr: |
    L'équipe API de Woodgrove Bank a besoin d'une requête KQL qui liste les opérations d'une API Python de scoring des fraudes dont le 95e centile de durée a dépassé 2 000 ms au cours de la dernière journée. Le résultat doit contenir une ligne par nom d'opération avec son 95e centile de durée.

    Quelles sont les quatre lignes à utiliser pour construire la requête, dans l'ordre ? Pour répondre, déplacez les lignes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: table, text: "`AppRequests`" }
    - { id: time, text: "`| where TimeGenerated > ago(1d)`" }
    - { id: agg, text: "`| summarize P95 = percentile(DurationMs, 95) by Name`" }
    - { id: filter, text: "`| where P95 > 2000`" }
    - { id: rows, text: "`| where DurationMs > 2000`" }
    - { id: proj, text: "`| project Name, P95`" }
answer:
  sequence: [ table, time, agg, filter ]
explanation:
  correct:
    en: |-
      A query starts from the table, filters the rows by time while `TimeGenerated` still exists, aggregates them by operation name, and only then filters on the aggregate, which doesn't exist before `summarize`.
    fr: |-
      Une requête part de la table, filtre les lignes par date tant que `TimeGenerated` existe encore, les agrège par nom d'opération, puis seulement filtre sur l'agrégat, qui n'existe pas avant `summarize`.
  options:
    rows:
      en: |-
        Filtering individual requests above 2,000 ms changes the percentile, which is then computed only on slow requests.
      fr: |-
        Filtrer les requêtes individuelles au-delà de 2 000 ms modifie le centile, qui n'est alors calculé que sur les requêtes lentes.
    proj:
      en: |-
        After summarize, the output already contains only Name and P95, so this line isn't needed.
      fr: |-
        Après summarize, la sortie ne contient déjà que Name et P95 : cette ligne n'est pas nécessaire.
references:
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
  - title: percentile(), percentiles()
    url: https://learn.microsoft.com/en-us/kusto/query/percentiles-aggregation-function
