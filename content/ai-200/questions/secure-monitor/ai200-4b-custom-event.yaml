id: ai200-4b-custom-event
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum's answer-assistant API is instrumented with the Azure Monitor OpenTelemetry Distro, which collects the records of the `adatum.feedback` logger (`logger_name="adatum.feedback"`). The variable `logger` holds this logger, and `span` holds the current span.

    Each time a user rejects an answer, you need to record a custom event named **AnswerRejected** that appears in the `AppEvents` table with a property that contains the answer ID.

    Which call should you add?
  fr: |
    L'API d'assistant de réponses d'Adatum est instrumentée avec la distribution OpenTelemetry Azure Monitor, qui collecte les enregistrements de l'enregistreur `adatum.feedback` (`logger_name="adatum.feedback"`). La variable `logger` contient cet enregistreur, et `span` contient l'étendue courante.

    Chaque fois qu'un utilisateur rejette une réponse, vous devez enregistrer un événement personnalisé nommé **AnswerRejected** qui apparaît dans la table `AppEvents` avec une propriété contenant l'ID de la réponse.

    Quel appel devez-vous ajouter ?
body:
  options:
    - id: a
      text: '`logger.info("AnswerRejected", extra={"answer_id": answer_id})`'
    - id: b
      text: '`span.add_event("AnswerRejected", {"answer_id": answer_id})`'
    - id: c
      text: '`meter.create_counter("AnswerRejected").add(1, {"answer_id": answer_id})`'
    - id: d
      text: '`logger.info("Rejected", extra={"microsoft.custom_event.name": "AnswerRejected", "answer_id": answer_id})`'
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In Python, a custom event is sent through the logging library with the `microsoft.custom_event.name` attribute in `extra`; its value becomes the event name. The other keys of `extra` become custom properties of the event, stored in `AppEvents` (customEvents in classic queries).
    fr: |-
      En Python, un événement personnalisé s'envoie avec la bibliothèque logging en plaçant l'attribut `microsoft.custom_event.name` dans `extra` ; sa valeur devient le nom de l'événement. Les autres clés d'`extra` deviennent des propriétés personnalisées de l'événement, stocké dans `AppEvents` (customEvents dans les requêtes classiques).
  options:
    a:
      en: |-
        Without the custom event attribute, the record is an ordinary log stored in `AppTraces`.
      fr: |-
        Sans l'attribut d'événement personnalisé, l'enregistrement est un journal ordinaire stocké dans `AppTraces`.
    b:
      en: "`add_event` adds a timestamped event to the span itself; it doesn't create a row in `AppEvents`."
      fr: "`add_event` ajoute un événement horodaté à l'étendue elle-même ; il ne crée pas de ligne dans `AppEvents`."
    c:
      en: |-
        A counter produces a custom metric in `AppMetrics`, not a custom event.
      fr: |-
        Un compteur produit une métrique personnalisée dans `AppMetrics`, pas un événement personnalisé.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
