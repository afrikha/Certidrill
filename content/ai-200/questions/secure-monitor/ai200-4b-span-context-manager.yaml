id: ai200-4b-span-context-manager
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware's answer service is instrumented with the Azure Monitor OpenTelemetry Distro. The reranking step uses the following code. The `score()` function makes HTTP calls with `httpx` and can raise `TimeoutError`, which the code doesn't catch.

    ```text
    tracer = trace.get_tracer(__name__)

    def rerank(chunks, model):
        with tracer.start_as_current_span("rerank") as span:
            span.set_attribute("rerank.model", model)
            return score(chunks)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service de réponses de Litware est instrumenté avec la distribution OpenTelemetry Azure Monitor. L'étape de reclassement utilise le code suivant. La fonction `score()` effectue des appels HTTP avec `httpx` et peut lever `TimeoutError`, que le code n'intercepte pas.

    ```text
    tracer = trace.get_tracer(__name__)

    def rerank(chunks, model):
        with tracer.start_as_current_span("rerank") as span:
            span.set_attribute("rerank.model", model)
            return score(chunks)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          When `score()` raises `TimeoutError`, the exception is recorded on the rerank span.
        fr: |-
          Quand `score()` lève `TimeoutError`, l'exception est enregistrée sur l'étendue rerank.
    - id: s2
      text:
        en: |-
          The HTTP dependencies created by `score()` are children of the rerank span.
        fr: |-
          Les dépendances HTTP créées par `score()` sont enfants de l'étendue rerank.
    - id: s3
      text:
        en: |-
          The model name is stored in the `Measurements` column of the rerank row.
        fr: |-
          Le nom du modèle est stocké dans la colonne `Measurements` de la ligne rerank.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |-
      The `with` block starts the span, makes it current and ends it; an exception that leaves the block is recorded automatically unless `record_exception=False` is passed. Because the span is current, the httpx client spans created inside it get it as parent. Span attributes are exported as custom properties, in the `Properties` column (customDimensions), not in `Measurements`.
    fr: |-
      Le bloc `with` démarre l'étendue, la rend courante et la termine ; une exception qui sort du bloc est enregistrée automatiquement, sauf si `record_exception=False` est passé. Comme l'étendue est courante, les étendues clientes httpx créées à l'intérieur l'ont pour parent. Les attributs d'étendue sont exportés comme propriétés personnalisées, dans la colonne `Properties` (customDimensions), pas dans `Measurements`.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
