id: ai200-sr2-partner-secret-3
objective: "4.1.1"
type: series_yesno
series: ai200-sr2-partner-secret
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You assign the Key Vault Secrets User role and pass a version from an environment variable.
  fr: Vous attribuez le rôle Key Vault Secrets User et transmettez une version depuis une variable d'environnement.
body:
  solution:
    en: |
      You assign the **Key Vault Secrets User** role to id-nw-reco on the partner-api-key secret. At deployment, the pipeline writes the current version identifier of the secret to the `PARTNER_KEY_VERSION` environment variable. Each time the API needs the key, it runs the following code.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key", version=os.environ["PARTNER_KEY_VERSION"]).value
      ```
    fr: |
      Vous attribuez le rôle **Key Vault Secrets User** à id-nw-reco sur le secret partner-api-key. Lors du déploiement, le pipeline écrit l'identificateur de la version actuelle du secret dans la variable d'environnement `PARTNER_KEY_VERSION`. Chaque fois que l'API a besoin de la clé, elle exécute le code suivant.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key", version=os.environ["PARTNER_KEY_VERSION"]).value
      ```
answer: { value: false }
explanation:
  correct:
    en: The role is correct, but the code requests the version that was current at deployment. After a rotation adds a new version, the API keeps reading the old one until it is redeployed, which the goal forbids.
    fr: "Le rôle est correct, mais le code demande la version qui était actuelle lors du déploiement. Après qu'une rotation a ajouté une nouvelle version, l'API continue de lire l'ancienne jusqu'à son redéploiement, ce que l'objectif interdit."
references:
  - title: azure.keyvault.secrets.SecretClient class
