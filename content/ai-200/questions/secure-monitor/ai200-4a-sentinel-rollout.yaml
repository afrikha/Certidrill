id: ai200-4a-sentinel-rollout
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Trey Research runs 20 instances of a Python RAG service that load five related settings from App Configuration: `Rag:Model`, `Rag:TopK`, `Rag:ChunkSize`, `Rag:Overlap` and `Rag:Index`. Each instance already calls `config.refresh()` at the start of each request.

    Operators change the five settings together a few times a month. Each instance must apply the new values as one consistent set, without a restart, and the number of requests to the store must be minimized.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trey Research exécute 20 instances d'un service RAG Python qui chargent cinq paramètres liés depuis App Configuration : `Rag:Model`, `Rag:TopK`, `Rag:ChunkSize`, `Rag:Overlap` et `Rag:Index`. Chaque instance appelle déjà `config.refresh()` au début de chaque requête.

    Les opérateurs modifient les cinq paramètres ensemble quelques fois par mois. Chaque instance doit appliquer les nouvelles valeurs comme un ensemble cohérent, sans redémarrage, et le nombre de requêtes adressées au magasin doit être réduit au minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Load the settings with `refresh_on=[WatchKey(\"Rag:Sentinel\")]`.", fr: "Charger les paramètres avec `refresh_on=[WatchKey(\"Rag:Sentinel\")]`." } }
    - { id: b, text: { en: "Load the settings with one `WatchKey` for each of the five keys.", fr: "Charger les paramètres avec un `WatchKey` pour chacune des cinq clés." } }
    - { id: c, text: { en: "Ask the operators to update Rag:Sentinel first, and then the five settings.", fr: "Demander aux opérateurs de mettre à jour Rag:Sentinel d'abord, puis les cinq paramètres." } }
    - { id: d, text: { en: "Ask the operators to update the five settings first, and then Rag:Sentinel.", fr: "Demander aux opérateurs de mettre à jour les cinq paramètres d'abord, puis Rag:Sentinel." } }
    - { id: e, text: { en: "Lock the five settings with `az appconfig kv lock` between changes.", fr: "Verrouiller les cinq paramètres avec `az appconfig kv lock` entre les modifications." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      With `refresh_on`, the provider watches only the listed keys and reloads all the selected values when one of them changes. A sentinel key that operators update after all the other keys makes each instance reload the five settings together, and watching a single key sends fewer requests than watching five.
    fr: |
      Avec `refresh_on`, le fournisseur ne surveille que les clés listées et recharge toutes les valeurs sélectionnées quand l'une d'elles change. Une clé sentinelle que les opérateurs mettent à jour après toutes les autres clés fait recharger les cinq paramètres ensemble par chaque instance, et surveiller une seule clé envoie moins de requêtes qu'en surveiller cinq.
  options:
    b: { en: "Watching every key sends more requests and can reload the settings while the operators are halfway through the change.", fr: "Surveiller chaque clé envoie plus de requêtes et peut recharger les paramètres alors que les opérateurs n'ont fait que la moitié de la modification." }
    c: { en: "Updating the sentinel first triggers a reload before the other settings have their new values.", fr: "Mettre à jour la sentinelle d'abord déclenche un rechargement avant que les autres paramètres aient leurs nouvelles valeurs." }
    e: { en: "Locking prevents changes; it doesn't control when instances reload the settings.", fr: "Le verrouillage empêche les modifications ; il ne contrôle pas le moment où les instances rechargent les paramètres." }
references:
  - title: "Tutorial: Use dynamic configuration in Python"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/enable-dynamic-configuration-python
