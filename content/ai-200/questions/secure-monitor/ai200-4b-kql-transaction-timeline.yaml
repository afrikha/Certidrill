id: ai200-4b-kql-transaction-timeline
objective: "4.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A user of Fabrikam's chat assistant reports an error page that shows the trace ID `4bf92f3577b34da6a3ce929d0e0e4736`. All the services involved send OpenTelemetry telemetry to the same Application Insights resource.

    You need one query that lists the requests, dependencies, logs and exceptions of this distributed operation in chronological order, oldest first.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un utilisateur de l'assistant de conversation de Fabrikam signale une page d'erreur qui affiche l'ID de trace `4bf92f3577b34da6a3ce929d0e0e4736`. Tous les services concernés envoient leur télémétrie OpenTelemetry à la même ressource Application Insights.

    Vous avez besoin d'une requête unique qui liste les requêtes, dépendances, journaux et exceptions de cette opération distribuée dans l'ordre chronologique, du plus ancien au plus récent.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[op]] AppRequests, AppDependencies, AppTraces, AppExceptions
    | where [[col]] == "4bf92f3577b34da6a3ce929d0e0e4736"
    | project TimeGenerated, Type, AppRoleName, Name, Message, OuterMessage
    | order by TimeGenerated [[dir]]
  slots:
    - id: op
      options:
        - { id: union, text: union }
        - { id: join, text: join }
        - { id: lookup, text: lookup }
    - id: col
      options:
        - { id: opid, text: OperationId }
        - { id: id, text: Id }
        - { id: parent, text: ParentId }
    - id: dir
      options:
        - { id: asc, text: asc }
        - { id: desc, text: desc }
        - { id: nulls, text: nulls last }
answer:
  values: { op: union, col: opid, dir: asc }
explanation:
  correct:
    en: "`union` stacks the rows of several tables, and the `Type` column tells which table each row comes from. The trace ID of a distributed operation is stored in `OperationId` in every table. `order by` sorts in descending order by default, so `asc` is needed to read the timeline oldest first."
    fr: "`union` empile les lignes de plusieurs tables, et la colonne `Type` indique la table d'origine de chaque ligne. L'ID de trace d'une opération distribuée est stocké dans `OperationId` dans chaque table. `order by` trie par défaut dans l'ordre décroissant : `asc` est nécessaire pour lire la chronologie du plus ancien au plus récent."
  options:
    join:
      en: |-
        join combines two tables side by side on a key; it doesn't take a list of four tables.
      fr: |-
        join combine deux tables côte à côte sur une clé ; il n'accepte pas une liste de quatre tables.
    lookup:
      en: |-
        lookup extends a table with columns from a dimension table; it doesn't stack several tables.
      fr: |-
        lookup étend une table avec les colonnes d'une table de dimension ; il n'empile pas plusieurs tables.
    id:
      en: |-
        Id identifies a single request or dependency, not the whole operation.
      fr: |-
        Id identifie une seule requête ou dépendance, pas l'opération entière.
    parent:
      en: |-
        ParentId is the ID of the immediate parent, which differs from row to row.
      fr: |-
        ParentId est l'ID du parent immédiat, qui varie d'une ligne à l'autre.
    desc:
      en: |-
        desc lists the newest rows first.
      fr: |-
        desc liste d'abord les lignes les plus récentes.
references:
  - title: union operator
    url: https://learn.microsoft.com/en-us/kusto/query/union-operator
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
