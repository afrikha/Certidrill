id: ai200-4a-pinned-version
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Python worker on Azure Container Apps that calls a partner translation API. At startup, the worker reads the API key from a key vault named kv-contoso by using the following call:

    `client.get_secret("partner-key", version="9b1c6a0e4d3f4f6c8a2b7e5d1c0f3a9b")`

    The security team rotates partner-key every month by writing a new version. After each rotation, the worker keeps sending the old key until a developer edits the code. You need the worker to use the current key after each rotation and its next restart, without code changes at each rotation.

    What should you do?
  fr: |
    Contoso dispose d'un worker Python sur Azure Container Apps qui appelle une API de traduction partenaire. Au démarrage, le worker lit la clé API dans un coffre de clés nommé kv-contoso avec l'appel suivant :

    `client.get_secret("partner-key", version="9b1c6a0e4d3f4f6c8a2b7e5d1c0f3a9b")`

    L'équipe de sécurité fait une rotation de partner-key chaque mois en écrivant une nouvelle version. Après chaque rotation, le worker continue d'envoyer l'ancienne clé jusqu'à ce qu'un développeur modifie le code. Vous devez faire en sorte que le worker utilise la clé actuelle après chaque rotation et son redémarrage suivant, sans modifier le code à chaque rotation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the call with `client.list_properties_of_secret_versions(\"partner-key\")` and read the value of the first item.", fr: "Remplacer l'appel par `client.list_properties_of_secret_versions(\"partner-key\")` et lire la valeur du premier élément." } }
    - { id: b, text: { en: "Ask the security team to call `update_secret_properties(\"partner-key\", enabled=False)` on the old version after each rotation.", fr: "Demander à l'équipe de sécurité d'appeler `update_secret_properties(\"partner-key\", enabled=False)` sur l'ancienne version après chaque rotation." } }
    - { id: c, text: { en: "Remove the `version` argument so that the call becomes `client.get_secret(\"partner-key\")`.", fr: "Supprimer l'argument `version` pour que l'appel devienne `client.get_secret(\"partner-key\")`." } }
    - { id: d, text: { en: "Store the version identifier in an environment variable of the container app and pass it to `get_secret`.", fr: "Stocker l'identificateur de version dans une variable d'environnement de l'application conteneur et le passer à `get_secret`." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `get_secret` returns the latest version of a secret when no version is passed. A rotation writes a new version under the same name, so an unversioned call picks up the new key the next time the worker reads the secret.
    fr: |
      `get_secret` renvoie la dernière version d'un secret quand aucune version n'est passée. Une rotation écrit une nouvelle version sous le même nom : un appel sans version récupère la nouvelle clé dès que le worker relit le secret.
  options:
    a: { en: "Listing returns secret properties only, never values, so the worker can't read the key this way.", fr: "Les méthodes de liste ne renvoient que les propriétés des secrets, jamais les valeurs : le worker ne peut pas lire la clé ainsi." }
    b: { en: "Disabling the old version doesn't make a pinned call read another version; the call to that version would simply fail.", fr: "Désactiver l'ancienne version ne fait pas lire une autre version à un appel épinglé : l'appel à cette version échouerait simplement." }
    d: { en: "The version stays pinned, so someone must still update the variable after every rotation.", fr: "La version reste épinglée : quelqu'un doit toujours mettre à jour la variable après chaque rotation." }
references:
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
