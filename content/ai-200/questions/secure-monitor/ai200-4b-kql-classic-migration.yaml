id: ai200-4b-kql-classic-migration
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an old query that was written for the classic Application Insights schema:

    ```kusto
    requests
    | where timestamp > ago(1d)
    | summarize avg(duration) by bin(timestamp, 1h)
    ```

    You need to run the query directly in the Log Analytics workspace of the workspace-based Application Insights resource.

    Which three changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une ancienne requête écrite pour le schéma classique d'Application Insights :

    ```kusto
    requests
    | where timestamp > ago(1d)
    | summarize avg(duration) by bin(timestamp, 1h)
    ```

    Vous devez exécuter la requête directement dans l'espace de travail Log Analytics de la ressource Application Insights basée sur un espace de travail.

    Quelles sont les trois modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Replace `requests` with `AppRequests`.", fr: "Remplacer `requests` par `AppRequests`." } }
    - { id: b, text: { en: "Replace `timestamp` with `TimeGenerated`.", fr: "Remplacer `timestamp` par `TimeGenerated`." } }
    - { id: c, text: { en: "Replace `duration` with `DurationMs`.", fr: "Remplacer `duration` par `DurationMs`." } }
    - { id: d, text: { en: "Replace `requests` with `AppDependencies`.", fr: "Remplacer `requests` par `AppDependencies`." } }
    - { id: e, text: { en: "Replace `ago(1d)` with `startofday(now())`.", fr: "Remplacer `ago(1d)` par `startofday(now())`." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |-
      The workspace tables of Application Insights use different table and column names from the classic schema, and KQL is case-sensitive. The `requests` table is `AppRequests`, `timestamp` is `TimeGenerated` and `duration` is `DurationMs`.
    fr: |-
      Les tables d'espace de travail d'Application Insights utilisent des noms de tables et de colonnes différents du schéma classique, et KQL respecte la casse. La table `requests` devient `AppRequests`, `timestamp` devient `TimeGenerated` et `duration` devient `DurationMs`.
  options:
    d:
      en: "`AppDependencies` is the workspace table of the classic `dependencies` table, not of `requests`."
      fr: "`AppDependencies` est la table d'espace de travail correspondant à la table classique `dependencies`, pas à `requests`."
    e:
      en: "`ago()` works the same in both schemas; changing it would alter the time range."
      fr: "`ago()` fonctionne de la même façon dans les deux schémas ; le modifier changerait la plage de temps."
references:
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
  - title: Azure Monitor Logs reference - AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
