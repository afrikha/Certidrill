id: ai200-4b-sampler-env-vars
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a Python chat API instrumented with the Azure Monitor OpenTelemetry Distro. To reduce ingestion costs without rebuilding the image, you configure the container app with environment variables.

    The configuration must meet the following requirements:

    - Keep about 25 % of the traces by using the Application Insights fixed-percentage sampler.
    - Stop collecting and exporting custom metrics.
    - Keep exporting logs.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie une API de conversation Python instrumentée avec la distribution OpenTelemetry Azure Monitor. Pour réduire les coûts d'ingestion sans regénérer l'image, vous configurez l'application conteneur avec des variables d'environnement.

    La configuration doit satisfaire les exigences suivantes :

    - Conserver environ 25 % des traces avec l'échantillonneur à pourcentage fixe d'Application Insights.
    - Arrêter la collecte et l'export des métriques personnalisées.
    - Continuer à exporter les journaux.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    export OTEL_TRACES_SAMPLER="[[sampler]]"
    export OTEL_TRACES_SAMPLER_ARG="[[arg]]"
    export [[exporter]]="None"
  slots:
    - id: sampler
      options:
        - { id: fixed, text: microsoft.fixed_percentage }
        - { id: rate, text: microsoft.rate_limited }
        - { id: on, text: parentbased_always_on }
    - id: arg
      options:
        - { id: quarter, text: "0.25" }
        - { id: pct, text: "25" }
        - { id: four, text: "4" }
    - id: exporter
      options:
        - { id: metrics, text: OTEL_METRICS_EXPORTER }
        - { id: logs, text: OTEL_LOGS_EXPORTER }
        - { id: traces, text: OTEL_TRACES_EXPORTER }
answer:
  values: { sampler: fixed, arg: quarter, exporter: metrics }
explanation:
  correct:
    en: "`microsoft.fixed_percentage` selects the Application Insights sampler, whose argument is a ratio between 0 and 1, so 0.25 keeps about 25 % of the traces. Setting `OTEL_METRICS_EXPORTER` to `None` disables the collection and export of metrics only; logs and traces are still exported."
    fr: "`microsoft.fixed_percentage` sélectionne l'échantillonneur Application Insights, dont l'argument est un rapport compris entre 0 et 1 : 0.25 conserve environ 25 % des traces. Définir `OTEL_METRICS_EXPORTER` sur `None` désactive uniquement la collecte et l'export des métriques ; les journaux et les traces restent exportés."
  options:
    rate:
      en: |-
        The rate-limited sampler caps the number of traces per second; it doesn't keep a percentage.
      fr: |-
        L'échantillonneur limité par débit plafonne le nombre de traces par seconde ; il ne conserve pas un pourcentage.
    on:
      en: |-
        parentbased_always_on keeps every trace whose root is sampled, so nothing is reduced.
      fr: |-
        parentbased_always_on conserve toutes les traces dont la racine est échantillonnée : rien n'est réduit.
    pct:
      en: |-
        The argument of the fixed-percentage sampler is a ratio between 0 and 1, not a percentage.
      fr: |-
        L'argument de l'échantillonneur à pourcentage fixe est un rapport compris entre 0 et 1, pas un pourcentage.
    logs:
      en: |-
        OTEL_LOGS_EXPORTER set to None would stop the logs, which must be kept.
      fr: |-
        OTEL_LOGS_EXPORTER défini sur None arrêterait les journaux, qui doivent être conservés.
    traces:
      en: |-
        OTEL_TRACES_EXPORTER set to None would stop all traces instead of sampling them.
      fr: |-
        OTEL_TRACES_EXPORTER défini sur None arrêterait toutes les traces au lieu de les échantillonner.
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
