id: ai200-4b-custom-properties
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware's retrieval service is instrumented with the Azure Monitor OpenTelemetry Distro. The function below runs inside a span named **retrieve** created with the default span kind, and the `litware.search` logger is the one collected by the distro.

    ```text
    def retrieve(question, doc_id):
        with tracer.start_as_current_span("retrieve") as span:
            ...
            logger.warning("Low relevance score")
    ```

    You need the document ID to be available as a custom property in the `Properties` column of both the **retrieve** row in `AppDependencies` and the warning row in `AppTraces`.

    Which two lines should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service de récupération de Litware est instrumenté avec la distribution OpenTelemetry Azure Monitor. La fonction ci-dessous s'exécute dans une étendue nommée **retrieve** créée avec le type d'étendue par défaut, et l'enregistreur `litware.search` est celui que collecte la distribution.

    ```text
    def retrieve(question, doc_id):
        with tracer.start_as_current_span("retrieve") as span:
            ...
            logger.warning("Low relevance score")
    ```

    L'ID du document doit être disponible comme propriété personnalisée dans la colonne `Properties` de la ligne **retrieve** de `AppDependencies` et de la ligne d'avertissement de `AppTraces`.

    Quelles sont les deux lignes à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: '`span.add_event("document", {"doc.id": doc_id})`'
    - id: b
      text: '`span.set_attribute("doc.id", doc_id)`'
    - id: c
      text: '`logger.warning("Low relevance score for %s", doc_id)`'
    - id: d
      text: '`logger.warning("Low relevance score", extra={"doc.id": doc_id})`'
    - id: e
      text: '`span.update_name(f"retrieve {doc_id}")`'
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Span attributes are exported as custom properties, which land in `Properties` (customDimensions in classic queries) of the dependency row produced by the INTERNAL span. For Python logs, the dictionary passed in the `extra` argument becomes the custom properties of the `AppTraces` row.
    fr: |-
      Les attributs d'étendue sont exportés comme propriétés personnalisées, placées dans `Properties` (customDimensions dans les requêtes classiques) de la ligne de dépendance produite par l'étendue INTERNAL. Pour les journaux Python, le dictionnaire passé dans l'argument `extra` devient les propriétés personnalisées de la ligne `AppTraces`.
  options:
    a:
      en: |-
        A span event is a timestamped annotation of the span; its attributes aren't custom properties of the dependency row.
      fr: |-
        Un événement d'étendue est une annotation horodatée de l'étendue ; ses attributs ne sont pas des propriétés personnalisées de la ligne de dépendance.
    c:
      en: |-
        Formatting the ID into the text puts it in the `Message` column, not in `Properties`.
      fr: |-
        Insérer l'ID dans le texte le place dans la colonne `Message`, pas dans `Properties`.
    e:
      en: |-
        Renaming the span changes the `Name` column and creates one name per document, which breaks grouping; it adds no property.
      fr: |-
        Renommer l'étendue modifie la colonne `Name` et crée un nom par document, ce qui empêche le regroupement ; aucune propriété n'est ajoutée.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
