stem:
  en: You summarize the 95th percentile by name and then use take.
  fr: Vous agrégez le 95e centile par nom, puis vous utilisez take.
body:
  solution:
    en: |
      You run the following query:

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | summarize P95 = percentile(DurationMs, 95) by Name
      | take 5
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | summarize P95 = percentile(DurationMs, 95) by Name
      | take 5
      ```
answer: { value: false }
explanation:
  correct:
    en: "`take` returns the requested number of rows with no guarantee of which rows are returned unless the input is sorted, and the output of `summarize` is not sorted. The query returns five arbitrary request names in no particular order, not the five slowest ones."
    fr: "`take` renvoie le nombre de lignes demandé sans garantie sur les lignes renvoyées, sauf si l'entrée est triée, et la sortie de `summarize` n'est pas triée. La requête renvoie cinq noms de requête quelconques, dans un ordre quelconque, et non les cinq plus lents."
references:
  - title: take operator - Kusto
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
