id: ai200-4a-dynamic-refresh-code
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Margie's Travel is adding dynamic configuration to a Flask itinerary API. The API must reload all its settings when operators change the key `Sentinel`, check for a change at most every five minutes, and never restart to apply a change.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Margie's Travel ajoute la configuration dynamique à une API d'itinéraires Flask. L'API doit recharger tous ses paramètres quand les opérateurs modifient la clé `Sentinel`, vérifier une modification au plus toutes les cinq minutes, et ne jamais redémarrer pour appliquer une modification.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.appconfiguration.provider import load, SettingSelector, WatchKey

    config = load(
        endpoint=os.environ["AZURE_APPCONFIG_ENDPOINT"],
        credential=DefaultAzureCredential(),
        refresh_on=[[watch]],
        [[interval]]=300,
    )

    @app.route("/itinerary")
    def itinerary():
        config.[[call]]()
        return build_itinerary(config["Trip:MaxStops"])
  slots:
    - id: watch
      options:
        - { id: watchkey, text: "[WatchKey(\"Sentinel\")]" }
        - { id: selector, text: "[SettingSelector(key_filter=\"Sentinel\")]" }
        - { id: string, text: "[\"Sentinel\"]" }
    - id: interval
      options:
        - { id: refresh, text: refresh_interval }
        - { id: secret, text: secret_refresh_interval }
        - { id: startup, text: startup_timeout }
    - id: call
      options:
        - { id: refresh, text: refresh }
        - { id: keys, text: keys }
        - { id: values, text: values }
answer:
  values: { watch: watchkey, interval: refresh, call: refresh }
explanation:
  correct:
    en: |
      `refresh_on` takes a list of `WatchKey` objects; when a watched key changes, all configuration values are reloaded. `refresh_interval` (30 seconds by default) sets the minimum time between checks. The app must call `refresh()` itself, for example in each request; the call returns at once until the interval has elapsed.
    fr: |
      `refresh_on` reçoit une liste d'objets `WatchKey` ; quand une clé surveillée change, toutes les valeurs de configuration sont rechargées. `refresh_interval` (30 secondes par défaut) fixe le délai minimal entre deux vérifications. L'application doit appeler elle-même `refresh()`, par exemple à chaque requête ; l'appel rend la main immédiatement tant que l'intervalle n'est pas écoulé.
  options:
    selector: { en: "`SettingSelector` chooses which key-values to load, not which keys to watch.", fr: "`SettingSelector` choisit les clés-valeurs à charger, pas les clés à surveiller." }
    secret: { en: "`secret_refresh_interval` controls how often Key Vault secrets are re-read, not the sentinel check.", fr: "`secret_refresh_interval` contrôle la fréquence de relecture des secrets Key Vault, pas la vérification de la sentinelle." }
    startup: { en: "`startup_timeout` is the time allowed for the initial load.", fr: "`startup_timeout` est le temps accordé au chargement initial." }
references:
  - title: "Tutorial: Use dynamic configuration in Python"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/enable-dynamic-configuration-python
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
