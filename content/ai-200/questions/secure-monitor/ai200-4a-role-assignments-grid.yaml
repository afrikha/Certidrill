id: ai200-4a-role-assignments-grid
objective: "4.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a key vault named kv-adatum-ai that uses the Azure RBAC permission model. The vault contains a secret named `db-password`, a secret named `storageKey` and a key named `cmk-orders`. The role assignments on kv-adatum-ai and its objects are shown in the following table.

    Answer each prompt by selecting the identity in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un coffre de clés nommé kv-adatum-ai qui utilise le modèle d'autorisation Azure RBAC. Le coffre contient un secret nommé `db-password`, un secret nommé `storageKey` et une clé nommée `cmk-orders`. Les attributions de rôles sur kv-adatum-ai et ses objets figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'identité dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which identity can read the value of db-password?", fr: "Quelle identité peut lire la valeur de db-password ?" }
    - id: p2
      text: { en: "Which identity can set the rotation policy of cmk-orders?", fr: "Quelle identité peut définir la stratégie de rotation de cmk-orders ?" }
  grid:
    header: [{ en: Identity, fr: Identité }, { en: Role, fr: Rôle }, { en: Scope, fr: Étendue }]
    rows:
      - [{ text: id-web, area: web }, { text: Key Vault Reader }, { text: kv-adatum-ai }]
      - [{ text: id-rotate, area: rotate }, { text: Key Vault Secrets Officer }, { text: { en: "kv-adatum-ai/secrets/storageKey", fr: "kv-adatum-ai/secrets/storageKey" } }]
      - [{ text: id-api, area: api }, { text: Key Vault Secrets User }, { text: kv-adatum-ai }]
      - [{ text: id-sec, area: sec }, { text: Key Vault Crypto Officer }, { text: kv-adatum-ai }]
      - [{ text: id-ops, area: ops }, { text: Key Vault Contributor }, { text: kv-adatum-ai }]
answer:
  values: { p1: api, p2: sec }
explanation:
  correct:
    en: |
      Key Vault Secrets User at the vault scope reads the contents of every secret, including db-password. id-rotate has a broader role, but only on storageKey, so it can't read db-password; Key Vault Reader reads metadata only, and Key Vault Contributor manages the vault resource without data access. Key Vault Crypto Officer performs any action on keys except managing permissions, which includes managing the rotation policy.
    fr: |
      Key Vault Secrets User à l'étendue du coffre lit le contenu de tous les secrets, y compris db-password. id-rotate a un rôle plus large, mais seulement sur storageKey : il ne peut pas lire db-password ; Key Vault Reader ne lit que les métadonnées, et Key Vault Contributor gère la ressource coffre sans accès aux données. Key Vault Crypto Officer effectue toute action sur les clés sauf la gestion des autorisations, ce qui inclut la gestion de la stratégie de rotation.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
