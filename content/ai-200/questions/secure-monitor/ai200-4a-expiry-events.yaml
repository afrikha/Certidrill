id: ai200-4a-expiry-events
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Graphic Design Institute stores the API key of an image-generation service as a secret named `imagegen-key` in a key vault named kv-gdi. The secret was written with an expiration date. You plan to subscribe an Azure Functions function to events from kv-gdi.

    Which two event types can kv-gdi raise for imagegen-key based on its expiration date?

    NOTE: Each correct selection is worth one point.
  fr: |
    Graphic Design Institute stocke la clé API d'un service de génération d'images sous forme de secret nommé `imagegen-key` dans un coffre de clés nommé kv-gdi. Le secret a été écrit avec une date d'expiration. Vous prévoyez d'abonner une fonction Azure Functions aux événements de kv-gdi.

    Quels sont les deux types d'événements que kv-gdi peut déclencher pour imagegen-key en fonction de sa date d'expiration ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Microsoft.KeyVault.SecretNearExpiry }
    - { id: b, text: Microsoft.KeyVault.SecretNewVersionCreated }
    - { id: c, text: Microsoft.KeyVault.KeyNearExpiry }
    - { id: d, text: Microsoft.KeyVault.SecretExpired }
    - { id: e, text: Microsoft.KeyVault.VaultAccessPolicyChanged }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      For secrets, Key Vault raises `SecretNearExpiry` 30 days before the expiration date of the current version and `SecretExpired` when that version expires. Both depend on the expiration date of the secret.
    fr: |
      Pour les secrets, Key Vault déclenche `SecretNearExpiry` 30 jours avant la date d'expiration de la version actuelle et `SecretExpired` quand cette version expire. Les deux dépendent de la date d'expiration du secret.
  options:
    b: { en: "This event is raised when a new secret or version is written, whatever its expiration date.", fr: "Cet événement est déclenché quand un nouveau secret ou une nouvelle version est écrit, quelle que soit sa date d'expiration." }
    c: { en: "KeyNearExpiry concerns Key Vault keys, not secrets.", fr: "KeyNearExpiry concerne les clés Key Vault, pas les secrets." }
    e: { en: "This event reports changes to vault access policies or to the permission model.", fr: "Cet événement signale les modifications des stratégies d'accès au coffre ou du modèle d'autorisation." }
references:
  - title: Azure Key Vault as Event Grid source
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-schema-key-vault
