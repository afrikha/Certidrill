id: ai200-4b-kql-histogram-average
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware's search service records the duration of each vector query with an OpenTelemetry histogram named **search.duration**. Azure Monitor stores the custom metric in the `AppMetrics` table, where each row aggregates several measurements.

    You need the true average duration of all the measurements for each hour of the last day.

    Which query should you use?
  fr: |
    Le service de recherche de Proseware enregistre la durée de chaque requête vectorielle avec un histogramme OpenTelemetry nommé **search.duration**. Azure Monitor stocke la métrique personnalisée dans la table `AppMetrics`, où chaque ligne agrège plusieurs mesures.

    Vous avez besoin de la véritable durée moyenne de toutes les mesures pour chaque heure de la dernière journée.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - id: a
      text: '`AppMetrics | where TimeGenerated > ago(1d) and Name == "search.duration" | summarize AvgMs = avg(Sum) by bin(TimeGenerated, 1h)`'
    - id: b
      text: '`AppMetrics | where TimeGenerated > ago(1d) and Name == "search.duration" | summarize AvgMs = sum(Sum) / sum(ItemCount) by bin(TimeGenerated, 1h)`'
    - id: c
      text: '`AppMetrics | where TimeGenerated > ago(1d) and Name == "search.duration" | summarize AvgMs = sum(Sum) / count() by bin(TimeGenerated, 1h)`'
    - id: d
      text: '`AppMetrics | where TimeGenerated > ago(1d) and Name == "search.duration" | summarize AvgMs = avg(Max) by bin(TimeGenerated, 1h)`'
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In `AppMetrics`, `Sum` is the sum of the measurements aggregated into the row and `ItemCount` is the number of those measurements. Dividing the total of `Sum` by the total of `ItemCount` gives the mean of all measurements in each hour.
    fr: |-
      Dans `AppMetrics`, `Sum` est la somme des mesures agrégées dans la ligne et `ItemCount` le nombre de ces mesures. Diviser le total de `Sum` par le total d'`ItemCount` donne la moyenne de toutes les mesures de chaque heure.
  options:
    a:
      en: |-
        The average of the `Sum` values is an average of per-row totals, not of individual measurements.
      fr: |-
        La moyenne des valeurs `Sum` est une moyenne de totaux par ligne, pas des mesures individuelles.
    c:
      en: "`count()` counts the rows, and each row aggregates several measurements, so the result is too high."
      fr: "`count()` compte les lignes, et chaque ligne agrège plusieurs mesures : le résultat est trop élevé."
    d:
      en: |-
        The average of the per-row maximums overstates the mean duration.
      fr: |-
        La moyenne des maximums par ligne surestime la durée moyenne.
references:
  - title: Azure Monitor Logs reference - AppMetrics
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appmetrics
