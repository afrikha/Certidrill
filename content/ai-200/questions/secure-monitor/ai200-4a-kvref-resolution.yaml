id: ai200-4a-kvref-resolution
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Alpine Ski House's Python booking assistant loads its settings with `load(endpoint=endpoint, credential=DefaultAzureCredential())`. Some key-values are Key Vault references to secrets in a key vault at `https://kv-alpine.vault.azure.net`. The app's managed identity has the App Configuration Data Reader role on the store and the Key Vault Secrets User role on kv-alpine.

    You need the provider to resolve the Key Vault references by using the managed identity.

    Which two arguments can you add to the `load()` call? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant de réservation Python d'Alpine Ski House charge ses paramètres avec `load(endpoint=endpoint, credential=DefaultAzureCredential())`. Certaines clés-valeurs sont des références Key Vault vers des secrets d'un coffre de clés situé à `https://kv-alpine.vault.azure.net`. L'identité managée de l'application a le rôle App Configuration Data Reader sur le magasin et le rôle Key Vault Secrets User sur kv-alpine.

    Le fournisseur doit résoudre les références Key Vault à l'aide de l'identité managée.

    Quels sont les deux arguments que vous pouvez ajouter à l'appel `load()` ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "keyvault_credential=DefaultAzureCredential()" }
    - { id: b, text: "secret_refresh_interval=3600" }
    - { id: c, text: "keyvault_client_configs={\"https://kv-alpine.vault.azure.net\": {\"credential\": DefaultAzureCredential()}}" }
    - { id: d, text: "refresh_on=[WatchKey(\"Booking:PaymentKey\")]" }
    - { id: e, text: "trim_prefixes=[\"https://kv-alpine.vault.azure.net/secrets/\"]" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      `keyvault_credential` resolves every Key Vault reference with the given credential, and `keyvault_client_configs` maps each vault URI to the configuration of its `SecretClient`, including the credential. Either one lets the provider read the secrets from kv-alpine with the managed identity.
    fr: |
      `keyvault_credential` résout toutes les références Key Vault avec l'information d'identification fournie, et `keyvault_client_configs` associe chaque URI de coffre à la configuration de son `SecretClient`, y compris l'information d'identification. L'un ou l'autre permet au fournisseur de lire les secrets de kv-alpine avec l'identité managée.
  options:
    b: { en: "This sets how often resolved secrets are refreshed; it gives the provider no way to authenticate to the vault.", fr: "Cela fixe la fréquence d'actualisation des secrets résolus ; cela ne donne au fournisseur aucun moyen de s'authentifier auprès du coffre." }
    d: { en: "Watching a key controls configuration refresh, not Key Vault authentication.", fr: "Surveiller une clé contrôle l'actualisation de la configuration, pas l'authentification auprès de Key Vault." }
    e: { en: "`trim_prefixes` shortens key names; it doesn't resolve references.", fr: "`trim_prefixes` raccourcit les noms de clés ; il ne résout pas les références." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
