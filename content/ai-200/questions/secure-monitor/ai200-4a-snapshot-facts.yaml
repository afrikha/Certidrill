id: ai200-4a-snapshot-facts
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    VanArsdel plans to use App Configuration snapshots to release the settings of its Python styling assistant. The store is in the Standard tier.

    Which two statements about snapshots are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    VanArsdel prévoit d'utiliser les instantanés App Configuration pour publier les paramètres de son assistant de style Python. Le magasin est au niveau Standard.

    Quelles sont les deux affirmations vraies concernant les instantanés ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "After a snapshot is created, the key-values it contains can't change.", fr: "Une fois un instantané créé, les clés-valeurs qu'il contient ne peuvent plus changer." } }
    - { id: b, text: { en: "You can edit the value of one key-value inside an existing snapshot.", fr: "Vous pouvez modifier la valeur d'une clé-valeur à l'intérieur d'un instantané existant." } }
    - { id: c, text: { en: "An individual snapshot can contain up to 1 MB of key-values.", fr: "Un instantané individuel peut contenir jusqu'à 1 Mo de clés-valeurs." } }
    - { id: d, text: { en: "An archived snapshot is deleted immediately.", fr: "Un instantané archivé est supprimé immédiatement." } }
    - { id: e, text: { en: "In the Python provider, a selector can combine `snapshot_name` with a `label_filter`.", fr: "Dans le fournisseur Python, un sélecteur peut combiner `snapshot_name` avec un `label_filter`." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      A snapshot is a named, immutable subset of the store's key-values, and an individual snapshot is limited to 1 MB. It can be archived and recovered but never edited.
    fr: |
      Un instantané est un sous-ensemble nommé et immuable des clés-valeurs du magasin, et un instantané individuel est limité à 1 Mo. Il peut être archivé et récupéré, mais jamais modifié.
  options:
    b: { en: "Snapshots can't be edited; you create a new snapshot instead.", fr: "Les instantanés ne peuvent pas être modifiés : vous créez plutôt un nouvel instantané." }
    d: { en: "An archived snapshot expires after the retention period set at creation (30 days by default in the Standard tier) and can be recovered before then.", fr: "Un instantané archivé expire après la période de rétention fixée à sa création (30 jours par défaut au niveau Standard) et peut être récupéré avant." }
    e: { en: "`snapshot_name` can't be used with `key_filter`, `label_filter` or `tag_filters`.", fr: "`snapshot_name` ne peut pas être utilisé avec `key_filter`, `label_filter` ou `tag_filters`." }
references:
  - title: Snapshots
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-snapshots
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
