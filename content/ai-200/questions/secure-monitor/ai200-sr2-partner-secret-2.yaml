id: ai200-sr2-partner-secret-2
objective: "4.1.1"
type: series_yesno
series: ai200-sr2-partner-secret
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign the Key Vault Secrets User role and call get_secret without a version.
  fr: Vous attribuez le rôle Key Vault Secrets User et appelez get_secret sans version.
body:
  solution:
    en: |
      You assign the **Key Vault Secrets User** role to id-nw-reco on the partner-api-key secret. Each time the API needs the key, it runs the following code.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key").value
      ```
    fr: |
      Vous attribuez le rôle **Key Vault Secrets User** à id-nw-reco sur le secret partner-api-key. Chaque fois que l'API a besoin de la clé, elle exécute le code suivant.

      ```python
      credential = ManagedIdentityCredential(client_id=os.environ["AZURE_CLIENT_ID"])
      client = SecretClient(vault_url="https://kv-nw-reco.vault.azure.net", credential=credential)
      api_key = client.get_secret("partner-api-key").value
      ```
answer: { value: true }
explanation:
  correct:
    en: Key Vault Secrets User allows reading secret contents and nothing else, and an assignment on the secret itself limits the access to partner-api-key. When get_secret is called without a version, it returns the latest version, so the API picks up each rotated value without being redeployed.
    fr: "Key Vault Secrets User permet de lire le contenu des secrets et rien d'autre, et une attribution sur le secret lui-même limite l'accès à partner-api-key. Quand get_secret est appelé sans version, il renvoie la dernière version : l'API prend en compte chaque valeur renouvelée sans être redéployée."
