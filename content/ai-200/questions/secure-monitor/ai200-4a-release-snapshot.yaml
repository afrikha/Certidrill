id: ai200-4a-release-snapshot
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin ships its Python flight-assistant service in releases. Release 5.2 must always run with the exact set of key-values that was validated during testing, even while the team edits key-values in the App Configuration store for release 5.3. If 5.3 fails, the team must be able to switch back to the 5.2 settings by name. The settings must remain in App Configuration.

    What should you do?
  fr: |
    Tailspin livre son service Python d'assistance aux vols par versions. La version 5.2 doit toujours s'exécuter avec l'ensemble exact de clés-valeurs validé pendant les tests, même pendant que l'équipe modifie les clés-valeurs du magasin App Configuration pour la version 5.3. Si la 5.3 échoue, l'équipe doit pouvoir revenir aux paramètres de la 5.2 par leur nom. Les paramètres doivent rester dans App Configuration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a snapshot named release-5.2 and load it with `SettingSelector(snapshot_name=\"release-5.2\")`.", fr: "Créer un instantané nommé release-5.2 et le charger avec `SettingSelector(snapshot_name=\"release-5.2\")`." } }
    - { id: b, text: { en: "Copy the key-values with the label `5.2` and load them with `SettingSelector(key_filter=\"*\", label_filter=\"5.2\")`.", fr: "Copier les clés-valeurs avec l'étiquette `5.2` et les charger avec `SettingSelector(key_filter=\"*\", label_filter=\"5.2\")`." } }
    - { id: c, text: { en: "Lock every key-value used by release 5.2 with `az appconfig kv lock`.", fr: "Verrouiller chaque clé-valeur utilisée par la version 5.2 avec `az appconfig kv lock`." } }
    - { id: d, text: { en: "Add the tag `release=5.2` to the key-values and load them with `tag_filters=[{\"release\": \"5.2\"}]`.", fr: "Ajouter la balise `release=5.2` aux clés-valeurs et les charger avec `tag_filters=[{\"release\": \"5.2\"}]`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A snapshot is a named, immutable subset of the store's key-values: once it is created, its content can't change. The Python provider loads it with `SettingSelector(snapshot_name=...)`, so switching back to 5.2 only means referencing that snapshot name again.
    fr: |
      Un instantané est un sous-ensemble nommé et immuable des clés-valeurs du magasin : une fois créé, son contenu ne peut plus changer. Le fournisseur Python le charge avec `SettingSelector(snapshot_name=...)` : revenir à la 5.2 consiste simplement à référencer de nouveau ce nom d'instantané.
  options:
    b: { en: "Labelled key-values remain editable, so the 5.2 values could change after validation.", fr: "Les clés-valeurs étiquetées restent modifiables : les valeurs 5.2 pourraient changer après la validation." }
    c: { en: "Locking the shared key-values would also prevent the team from editing them for 5.3.", fr: "Verrouiller les clés-valeurs partagées empêcherait aussi l'équipe de les modifier pour la 5.3." }
    d: { en: "Tags only filter key-values, which stay editable, and the tagged values are the ones the team edits for 5.3.", fr: "Les balises ne font que filtrer des clés-valeurs qui restent modifiables, et ce sont celles que l'équipe modifie pour la 5.3." }
references:
  - title: Snapshots
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-snapshots
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
