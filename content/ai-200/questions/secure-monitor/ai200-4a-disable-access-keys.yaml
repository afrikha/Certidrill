id: ai200-4a-disable-access-keys
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has 12 App Configuration stores that hold the settings of its AI underwriting services. The platform engineers have the Contributor role on the subscription and no App Configuration data-plane role. An audit shows that they can still read and change key-values.

    You need to ensure that only identities with an App Configuration data-plane role can access key-values in every current and future store. The engineers must keep the Contributor role.

    What should you do?
  fr: |
    Woodgrove dispose de 12 magasins App Configuration qui contiennent les paramètres de ses services IA de souscription. Les ingénieurs de la plateforme ont le rôle Contributor sur l'abonnement et aucun rôle de plan de données App Configuration. Un audit montre qu'ils peuvent quand même lire et modifier les clés-valeurs.

    Vous devez vous assurer que seules les identités dotées d'un rôle de plan de données App Configuration peuvent accéder aux clés-valeurs de chaque magasin actuel et futur. Les ingénieurs doivent conserver le rôle Contributor.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Regenerate the read-write and read-only access keys of every store.", fr: "Régénérer les clés d'accès en lecture-écriture et en lecture seule de chaque magasin." } }
    - { id: b, text: { en: "Assign the App Configuration Reader role to the engineers at the subscription scope.", fr: "Attribuer le rôle App Configuration Reader aux ingénieurs à l'étendue de l'abonnement." } }
    - { id: c, text: { en: "Disable access key authentication on the stores, and use Azure Policy to enforce that it stays disabled.", fr: "Désactiver l'authentification par clé d'accès sur les magasins, et utiliser Azure Policy pour imposer qu'elle reste désactivée." } }
    - { id: d, text: { en: "Assign the App Configuration Data Reader role to the engineers and remove their Contributor role assignment.", fr: "Attribuer le rôle App Configuration Data Reader aux ingénieurs et supprimer leur attribution du rôle Contributor." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Contributor and Owner don't grant data access through Microsoft Entra ID, but they can read the store's access keys and re-enable access key authentication. Disabling access key authentication removes that path, and an Azure Policy assignment enforces it on current and future stores so that Contributors can't turn it back on.
    fr: |
      Contributor et Owner ne donnent pas accès aux données par Microsoft Entra ID, mais ils peuvent lire les clés d'accès du magasin et réactiver l'authentification par clé d'accès. Désactiver l'authentification par clé d'accès supprime cette voie, et une attribution Azure Policy l'impose sur les magasins actuels et futurs pour que les Contributors ne puissent pas la réactiver.
  options:
    a: { en: "Contributors can read the new keys right after the regeneration.", fr: "Les Contributors peuvent lire les nouvelles clés juste après la régénération." }
    b: { en: "Adding a read-only control-plane role doesn't remove what Contributor already allows.", fr: "Ajouter un rôle en lecture seule du plan de contrôle ne retire pas ce que Contributor autorise déjà." }
    d: { en: "The engineers must keep Contributor, and Data Reader would still give them access to key-values.", fr: "Les ingénieurs doivent conserver Contributor, et Data Reader leur donnerait quand même accès aux clés-valeurs." }
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
