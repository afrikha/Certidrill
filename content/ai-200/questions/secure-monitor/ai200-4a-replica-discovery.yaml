id: ai200-4a-replica-discovery
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso's App Configuration store, appcs-contoso, is in the Standard tier in East US. You add a replica of appcs-contoso in West US to protect a Python recommendation API against a regional outage. The API calls `load(endpoint="https://appcs-contoso.azconfig.io", credential=DefaultAzureCredential())` with no other arguments.

    You need the API to load its settings from the replica when the origin is unavailable. The solution must minimize code changes.

    What should you do?
  fr: |
    Le magasin App Configuration de Contoso, appcs-contoso, est au niveau Standard dans la région USA Est. Vous ajoutez un réplica d'appcs-contoso dans la région USA Ouest pour protéger une API de recommandation Python contre une panne régionale. L'API appelle `load(endpoint="https://appcs-contoso.azconfig.io", credential=DefaultAzureCredential())` sans autre argument.

    L'API doit charger ses paramètres depuis le réplica quand l'origine n'est pas disponible. La solution doit réduire au minimum les modifications du code.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Nothing: the provider discovers the replicas of the store and fails over to them by default.", fr: "Rien : le fournisseur découvre les réplicas du magasin et bascule vers eux par défaut." } }
    - { id: b, text: { en: "Catch the exception raised by `load()` and call `load()` again with the endpoint of the replica.", fr: "Intercepter l'exception levée par `load()` et rappeler `load()` avec le point de terminaison du réplica." } }
    - { id: c, text: { en: "Pass `startup_timeout=0` so that the provider tries the replica immediately.", fr: "Passer `startup_timeout=0` pour que le fournisseur essaie immédiatement le réplica." } }
    - { id: d, text: { en: "Replace the endpoint with the connection string of the replica.", fr: "Remplacer le point de terminaison par la chaîne de connexion du réplica." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Replica discovery is enabled by default in the Python provider (`replica_discovery_enabled` defaults to `True`), so the provider finds the replicas of appcs-contoso and uses them when the origin can't be reached. No code change is needed.
    fr: |
      La découverte des réplicas est activée par défaut dans le fournisseur Python (`replica_discovery_enabled` vaut `True` par défaut) : le fournisseur trouve les réplicas d'appcs-contoso et les utilise quand l'origine est injoignable. Aucune modification du code n'est nécessaire.
  options:
    b: { en: "This works but adds failover code that the provider already provides by default.", fr: "Cela fonctionne mais ajoute un code de basculement que le fournisseur fournit déjà par défaut." }
    c: { en: "`startup_timeout` is the time allowed to load data at startup (100 seconds by default); zero leaves no time to load.", fr: "`startup_timeout` est le temps accordé au chargement au démarrage (100 secondes par défaut) : zéro ne laisse aucun temps pour charger." }
    d: { en: "The app would always read the replica and would introduce an access key into the configuration.", fr: "L'application lirait toujours le réplica et introduirait une clé d'accès dans la configuration." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
