id: ai200-4a-refresh-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Graphic Design Institute's Python image-captioning API loads its settings with the following call and calls `config.refresh()` at the start of each request:

    `config = load(endpoint=endpoint, credential=cred, refresh_on=[WatchKey("Sentinel")], refresh_interval=60)`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API Python de légendage d'images de Graphic Design Institute charge ses paramètres avec l'appel suivant et appelle `config.refresh()` au début de chaque requête :

    `config = load(endpoint=endpoint, credential=cred, refresh_on=[WatchKey("Sentinel")], refresh_interval=60)`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When Sentinel changes, the next refresh reloads all the selected key-values, not only Sentinel.
        fr: Quand Sentinel change, l'actualisation suivante recharge toutes les clés-valeurs sélectionnées, pas seulement Sentinel.
    - id: s2
      text:
        en: A call to `config.refresh()` made 10 seconds after the previous check sends a request to the store.
        fr: Un appel à `config.refresh()` effectué 10 secondes après la vérification précédente envoie une requête au magasin.
    - id: s3
      text:
        en: If a refresh fails because the store is unreachable, the API keeps using the values loaded previously.
        fr: Si une actualisation échoue parce que le magasin est injoignable, l'API continue d'utiliser les valeurs chargées précédemment.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When a watched key changes, the provider refreshes all configuration values at once, which keeps them consistent. Calling `refresh()` is a no-op until the refresh interval (60 seconds here) has elapsed, so a call after 10 seconds returns immediately. If a refresh fails, the app keeps using the cached configuration.
    fr: |
      Quand une clé surveillée change, le fournisseur actualise toutes les valeurs de configuration en une fois, ce qui les garde cohérentes. Appeler `refresh()` est sans effet tant que l'intervalle d'actualisation (ici 60 secondes) n'est pas écoulé : un appel au bout de 10 secondes rend la main immédiatement. Si une actualisation échoue, l'application continue d'utiliser la configuration en cache.
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
  - title: "Tutorial: Use dynamic configuration in Python"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/enable-dynamic-configuration-python
