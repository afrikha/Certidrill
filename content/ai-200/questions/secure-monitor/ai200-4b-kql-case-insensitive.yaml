id: ai200-4b-kql-case-insensitive
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two deployment pipelines at Tailspin Toys set the cloud role name of the same chat service differently: one uses `Chat-API` and the other uses `chat-api`. No other role name contains this text.

    You need a filter on `AppRequests` that returns the requests of both deployments by comparing the whole role name.

    Which filter should you use?
  fr: |
    Deux pipelines de déploiement de Tailspin Toys définissent différemment le nom de rôle cloud du même service de conversation : l'un utilise `Chat-API` et l'autre `chat-api`. Aucun autre nom de rôle ne contient ce texte.

    Vous avez besoin d'un filtre sur `AppRequests` qui renvoie les requêtes des deux déploiements en comparant le nom de rôle entier.

    Quel filtre devez-vous utiliser ?
body:
  options:
    - { id: a, text: '`| where AppRoleName == "chat-api"`' }
    - { id: b, text: '`| where AppRoleName has_cs "chat-api"`' }
    - { id: c, text: '`| where AppRoleName =~ "chat-api"`' }
    - { id: d, text: '`| where AppRoleName in ("chat-api")`' }
answer: { optionId: c }
explanation:
  correct:
    en: "`=~` tests equality without regard to case, so both `Chat-API` and `chat-api` match the whole value."
    fr: "`=~` teste l'égalité sans tenir compte de la casse : `Chat-API` et `chat-api` correspondent tous deux à la valeur entière."
  options:
    a:
      en: "`==` is case-sensitive and misses `Chat-API`."
      fr: "`==` respecte la casse et ignore `Chat-API`."
    b:
      en: |-
        Operators with the `_cs` suffix are case-sensitive, and `has_cs` matches a term, not the whole value.
      fr: |-
        Les opérateurs suffixés par `_cs` respectent la casse, et `has_cs` recherche un terme, pas la valeur entière.
    d:
      en: "`in` is case-sensitive; the case-insensitive version is `in~`."
      fr: "`in` respecte la casse ; la version insensible à la casse est `in~`."
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
