id: ai200-cs1a-latency-query
objective: "4.2.2"
type: dropdown
caseStudy: ai200-cs1a-proseware
difficulty: 1
status: draft
stem:
  en: |
    You are writing a KQL query in log-proseware for the operations team.

    You need to meet the monitoring requirement. How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une requête KQL dans log-proseware pour l'équipe d'exploitation.

    Vous devez satisfaire l'exigence relative à la supervision. Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(24h)
    | summarize [[agg]] by [[group]], bin(TimeGenerated, 15m)
    | render timechart
  slots:
    - id: table
      options:
        - { id: requests, text: AppRequests }
        - { id: deps, text: AppDependencies }
        - { id: traces, text: AppTraces }
    - id: agg
      options:
        - { id: avg, text: avg(DurationMs) }
        - { id: p95, text: "percentile(DurationMs, 95)" }
        - { id: max, text: max(DurationMs) }
    - id: group
      options:
        - { id: name, text: Name }
        - { id: opid, text: OperationId }
        - { id: role, text: AppRoleInstance }
answer:
  values: { table: requests, agg: p95, group: name }
explanation:
  correct:
    en: |
      AppRequests stores one row per request received by the apps, with its duration in `DurationMs` and the human-readable name of the operation in `Name`. `percentile(DurationMs, 95)` grouped by `Name` and `bin(TimeGenerated, 15m)` returns one 95th percentile per API operation and per 15-minute interval, and `render timechart` draws the chart.
    fr: |
      AppRequests stocke une ligne par requête reçue par les applications, avec sa durée dans `DurationMs` et le nom lisible de l'opération dans `Name`. `percentile(DurationMs, 95)` regroupé par `Name` et `bin(TimeGenerated, 15m)` renvoie un 95e centile par opération de l'API et par intervalle de 15 minutes, et `render timechart` trace le graphique.
  options:
    deps: { en: "AppDependencies stores the outgoing calls of the apps, such as database calls, not the API operations they serve.", fr: "AppDependencies stocke les appels sortants des applications, comme les appels de base de données, pas les opérations de l'API qu'elles servent." }
    traces: { en: "AppTraces stores log messages, which have no request duration.", fr: "AppTraces stocke des messages de journal, qui n'ont pas de durée de requête." }
    avg: { en: "avg returns the mean duration, not the 95th percentile.", fr: "avg renvoie la durée moyenne, pas le 95e centile." }
    max: { en: "max returns the slowest request, not the 95th percentile.", fr: "max renvoie la requête la plus lente, pas le 95e centile." }
    opid: { en: "OperationId identifies one end-to-end transaction, so the query would return a value per request instead of per operation.", fr: "OperationId identifie une transaction de bout en bout : la requête renverrait une valeur par requête au lieu d'une valeur par opération." }
    role: { en: "AppRoleInstance identifies the replica that handled the request, not the API operation.", fr: "AppRoleInstance identifie le réplica qui a traité la requête, pas l'opération de l'API." }
references:
  - title: AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
