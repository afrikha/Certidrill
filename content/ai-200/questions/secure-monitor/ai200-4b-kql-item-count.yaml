id: ai200-4b-kql-item-count
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys' product-assistant API sends telemetry to a workspace-based Application Insights resource with trace sampling enabled. A dashboard uses the following query:

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1h)
    | summarize Requests = count() by Name
    ```

    The counts are much lower than the request counts reported by the API gateway. You need the query to estimate the real number of requests per operation.

    With which expression should you replace `count()`?
  fr: |
    L'API d'assistant produits de Wingtip Toys envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail, avec l'échantillonnage des traces activé. Un tableau de bord utilise la requête suivante :

    ```kusto
    AppRequests
    | where TimeGenerated > ago(1h)
    | summarize Requests = count() by Name
    ```

    Les nombres obtenus sont bien inférieurs à ceux de la passerelle d'API. La requête doit estimer le nombre réel de requêtes par opération.

    Par quelle expression devez-vous remplacer `count()` ?
body:
  options:
    - { id: a, text: "`dcount(Id)`" }
    - { id: b, text: "`countif(ItemCount > 0)`" }
    - { id: c, text: "`sum(ItemCount)`" }
    - { id: d, text: "`max(ItemCount)`" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With sampling, each stored row represents `ItemCount` original telemetry items. Summing `ItemCount` restores an estimate of the original number of requests, whereas `count()` only counts the rows that were kept.
    fr: |-
      Avec l'échantillonnage, chaque ligne stockée représente `ItemCount` éléments de télémétrie d'origine. Additionner `ItemCount` rétablit une estimation du nombre initial de requêtes, alors que `count()` ne compte que les lignes conservées.
  options:
    a:
      en: |-
        Each stored row has its own ID, so `dcount(Id)` still counts the kept rows, and only approximately.
      fr: |-
        Chaque ligne stockée a son propre ID : `dcount(Id)` compte toujours les lignes conservées, et seulement de façon approximative.
    b:
      en: |-
        Every row has an `ItemCount` of at least 1, so this counts the same rows as `count()`.
      fr: |-
        Chaque ligne a un `ItemCount` d'au moins 1 : cette expression compte les mêmes lignes que `count()`.
    d:
      en: |-
        The maximum returns the weight of a single row, not the total number of requests.
      fr: |-
        Le maximum renvoie le poids d'une seule ligne, pas le nombre total de requêtes.
references:
  - title: Azure Monitor Logs reference - AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
  - title: Sampling in Azure Application Insights with OpenTelemetry
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-sampling
