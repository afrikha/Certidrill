id: ai200-4a-migrate-entra
objective: "4.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso's Python claims API on Azure Container Apps reads its settings from an App Configuration store named appcs-claims by using a connection string stored in an environment variable. The container app already has a system-assigned managed identity.

    You need to move the API to Microsoft Entra authentication and then block access key authentication on appcs-claims, without interrupting the API.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'API de sinistres Python de Contoso sur Azure Container Apps lit ses paramètres dans un magasin App Configuration nommé appcs-claims à l'aide d'une chaîne de connexion stockée dans une variable d'environnement. L'application conteneur dispose déjà d'une identité managée affectée par le système.

    Vous devez faire passer l'API à l'authentification Microsoft Entra, puis bloquer l'authentification par clé d'accès sur appcs-claims, sans interrompre l'API.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: role, text: { en: "Assign the App Configuration Data Reader role on appcs-claims to the managed identity.", fr: "Attribuer le rôle App Configuration Data Reader sur appcs-claims à l'identité managée." } }
    - { id: code, text: { en: "Deploy code that calls `load()` with the store endpoint and `DefaultAzureCredential()`.", fr: "Déployer un code qui appelle `load()` avec le point de terminaison du magasin et `DefaultAzureCredential()`." } }
    - { id: disable, text: { en: "Disable access key authentication on appcs-claims.", fr: "Désactiver l'authentification par clé d'accès sur appcs-claims." } }
    - { id: accontrib, text: { en: "Assign the App Configuration Contributor role on appcs-claims to the managed identity.", fr: "Attribuer le rôle App Configuration Contributor sur appcs-claims à l'identité managée." } }
    - { id: regen, text: { en: "Regenerate the read-only access key of appcs-claims.", fr: "Régénérer la clé d'accès en lecture seule d'appcs-claims." } }
    - { id: kv, text: { en: "Move the connection string to Azure Key Vault and reference it from the container app.", fr: "Déplacer la chaîne de connexion dans Azure Key Vault et la référencer depuis l'application conteneur." } }
answer:
  sequence: [ role, code, disable ]
explanation:
  correct:
    en: |
      The identity first needs a data-plane role (allow up to 15 minutes for it to propagate) so that the new code can read key-values with Microsoft Entra ID. After the code no longer uses the connection string, you can disable access key authentication without breaking the API.
    fr: |
      L'identité a d'abord besoin d'un rôle de plan de données (comptez jusqu'à 15 minutes de propagation) pour que le nouveau code puisse lire les clés-valeurs avec Microsoft Entra ID. Une fois que le code n'utilise plus la chaîne de connexion, vous pouvez désactiver l'authentification par clé d'accès sans casser l'API.
  options:
    accontrib: { en: "App Configuration Contributor manages the resource and grants no data access through Microsoft Entra ID.", fr: "App Configuration Contributor gère la ressource et ne donne aucun accès aux données par Microsoft Entra ID." }
    regen: { en: "Regenerating a key keeps access key authentication in use, which is what you're removing.", fr: "Régénérer une clé maintient l'authentification par clé d'accès, que vous êtes en train de supprimer." }
    kv: { en: "Protecting the connection string still relies on an access key.", fr: "Protéger la chaîne de connexion repose toujours sur une clé d'accès." }
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
