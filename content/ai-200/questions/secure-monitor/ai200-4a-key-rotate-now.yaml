id: ai200-4a-key-rotate-now
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Relecloud encrypts customer transcripts with a key named `cmk-transcripts` in a key vault named kv-relecloud. The key has a rotation policy that rotates it 180 days after creation, and the services that use it reference the versionless key URI.

    After a security incident, you must create a new version of cmk-transcripts immediately. The rotation policy must stay unchanged.

    Which Azure CLI command should you run?
  fr: |
    Relecloud chiffre les transcriptions des clients avec une clé nommée `cmk-transcripts` dans un coffre de clés nommé kv-relecloud. La clé possède une stratégie de rotation qui la fait tourner 180 jours après sa création, et les services qui l'utilisent référencent l'URI de clé sans version.

    Après un incident de sécurité, vous devez créer immédiatement une nouvelle version de cmk-transcripts. La stratégie de rotation doit rester inchangée.

    Quelle commande Azure CLI devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az keyvault key rotate --vault-name kv-relecloud --name cmk-transcripts" }
    - { id: b, text: "az keyvault key rotation-policy update --vault-name kv-relecloud --name cmk-transcripts --value ./policy.json" }
    - { id: c, text: "az keyvault key set-attributes --vault-name kv-relecloud --name cmk-transcripts --enabled false" }
    - { id: d, text: "az keyvault key recover --vault-name kv-relecloud --name cmk-transcripts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `az keyvault key rotate` performs an on-demand rotation: it generates a new key version with new key material and leaves the rotation policy as it is. Services that use the versionless key URI move to the new version automatically.
    fr: |
      `az keyvault key rotate` effectue une rotation à la demande : elle génère une nouvelle version de clé avec un nouveau matériel de clé et laisse la stratégie de rotation telle quelle. Les services qui utilisent l'URI de clé sans version passent automatiquement à la nouvelle version.
  options:
    b: { en: "Updating the policy changes the schedule, which must stay unchanged, and doesn't rotate the key now; the minimum rotation time is seven days after creation.", fr: "Mettre à jour la stratégie change le calendrier, qui doit rester inchangé, et ne fait pas tourner la clé tout de suite ; la durée de rotation minimale est de sept jours après la création." }
    c: { en: "Disabling the key stops all cryptographic operations with it but creates no new version.", fr: "Désactiver la clé bloque toutes les opérations de chiffrement avec elle mais ne crée aucune nouvelle version." }
    d: { en: "Recover restores a soft-deleted key; cmk-transcripts isn't deleted.", fr: "Recover restaure une clé supprimée de manière réversible : cmk-transcripts n'est pas supprimée." }
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
