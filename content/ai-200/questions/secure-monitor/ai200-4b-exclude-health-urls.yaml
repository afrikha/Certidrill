id: ai200-4b-exclude-health-urls
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank hosts a FastAPI document-classification API in Azure Container Apps. A liveness probe calls the `/healthz` endpoint every 10 seconds, and these calls fill the `AppRequests` table. The API uses the Azure Monitor OpenTelemetry Distro.

    You need to stop tracking the `/healthz` requests while every other endpoint is still tracked. The solution must not require a code change.

    What should you do?
  fr: |
    Woodgrove Bank héberge dans Azure Container Apps une API FastAPI de classification de documents. Une sonde liveness appelle le point de terminaison `/healthz` toutes les 10 secondes, et ces appels remplissent la table `AppRequests`. L'API utilise la distribution OpenTelemetry Azure Monitor.

    Vous devez arrêter le suivi des requêtes `/healthz` tout en continuant à suivre tous les autres points de terminaison. La solution ne doit pas nécessiter de modification du code.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set `OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` to `fastapi`.", fr: "Définir `OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` sur `fastapi`." }
    - id: b
      text: { en: "Configure ingestion sampling in the Application Insights resource.", fr: "Configurer l'échantillonnage à l'ingestion dans la ressource Application Insights." }
    - id: c
      text: { en: "Set `OTEL_PYTHON_EXCLUDED_URLS` to the URL of the `/healthz` endpoint.", fr: "Définir `OTEL_PYTHON_EXCLUDED_URLS` sur l'URL du point de terminaison `/healthz`." }
    - id: d
      text: { en: "Set `OTEL_TRACES_SAMPLER` to `parentbased_always_off`.", fr: "Définir `OTEL_TRACES_SAMPLER` sur `parentbased_always_off`." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The HTTP instrumentations of the Python distro honor `OTEL_PYTHON_EXCLUDED_URLS`. Requests whose URL matches the value aren't traced, and every other endpoint keeps its request telemetry. It's an environment variable, so no code changes.
    fr: |-
      Les instrumentations HTTP de la distribution Python respectent `OTEL_PYTHON_EXCLUDED_URLS`. Les requêtes dont l'URL correspond à la valeur ne sont pas tracées, et tous les autres points de terminaison conservent leur télémétrie de requêtes. C'est une variable d'environnement : aucune modification du code.
  options:
    a:
      en: |-
        Disabling the FastAPI instrumentation stops tracking every endpoint of the API, not only `/healthz`.
      fr: |-
        Désactiver l'instrumentation FastAPI arrête le suivi de tous les points de terminaison de l'API, pas seulement `/healthz`.
    b:
      en: |-
        Ingestion sampling drops a percentage of all telemetry at random, with no control over which requests are kept.
      fr: |-
        L'échantillonnage à l'ingestion supprime au hasard un pourcentage de toute la télémétrie, sans contrôle sur les requêtes conservées.
    d:
      en: |-
        This sampler drops every root trace, so the other endpoints would no longer be traced either.
      fr: |-
        Cet échantillonneur supprime toutes les traces racines : les autres points de terminaison ne seraient plus tracés non plus.
references:
  - title: Filter OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-filter
