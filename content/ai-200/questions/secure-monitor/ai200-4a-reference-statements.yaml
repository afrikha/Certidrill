id: ai200-4a-reference-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Bellows College hosts a Python tutoring API on Azure App Service with a production slot and a staging slot. Each environment has its own key vault, and the app reads its secrets through app settings that contain Key Vault references.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Bellows College héberge une API de tutorat Python sur Azure App Service avec un emplacement de production et un emplacement de préproduction. Chaque environnement a son propre coffre de clés, et l'application lit ses secrets par des paramètres d'application qui contiennent des références Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The app settings that contain Key Vault references should be marked as deployment slot settings.
        fr: Les paramètres d'application qui contiennent des références Key Vault doivent être marqués comme paramètres d'emplacement de déploiement.
    - id: s2
      text:
        en: If a Key Vault reference can't be resolved, App Service prevents the app from starting.
        fr: Si une référence Key Vault ne peut pas être résolue, App Service empêche l'application de démarrer.
    - id: s3
      text:
        en: Setting the `keyVaultReferenceIdentity` property of the app changes the identity used by all its Key Vault references.
        fr: Définir la propriété `keyVaultReferenceIdentity` de l'application modifie l'identité utilisée par toutes ses références Key Vault.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Because each environment should have its own vault, Microsoft advises marking Key Vault reference settings as slot settings so that a swap doesn't move a production reference into staging. When a reference doesn't resolve, the app still starts and receives the literal `@Microsoft.KeyVault(...)` string as the value, which causes application errors. `keyVaultReferenceIdentity` selects the identity for every Key Vault reference of the app.
    fr: |
      Comme chaque environnement doit avoir son propre coffre, Microsoft conseille de marquer les paramètres de référence Key Vault comme paramètres d'emplacement, pour qu'un échange ne déplace pas une référence de production vers la préproduction. Quand une référence n'est pas résolue, l'application démarre quand même et reçoit la chaîne littérale `@Microsoft.KeyVault(...)` comme valeur, ce qui provoque des erreurs applicatives. `keyVaultReferenceIdentity` choisit l'identité de toutes les références Key Vault de l'application.
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
