id: ai200-4a-soft-delete-facts
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Munson's Pickles creates a key vault named kv-munson to store the keys of its demand-forecasting service. Soft delete is enabled with a retention period of 30 days, and purge protection is enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Munson's Pickles crée un coffre de clés nommé kv-munson pour stocker les clés de son service de prévision de la demande. La suppression réversible est activée avec une période de rétention de 30 jours, et la protection contre le vidage est activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can later change the retention period of kv-munson to 90 days.
        fr: Vous pourrez modifier ultérieurement la période de rétention de kv-munson à 90 jours.
    - id: s2
      text:
        en: A secret deleted from kv-munson can still be recovered during the retention period.
        fr: Un secret supprimé de kv-munson peut encore être récupéré pendant la période de rétention.
    - id: s3
      text:
        en: While a secret named `forecast-key` is in the deleted state, you can create a new secret named `forecast-key` in kv-munson.
        fr: Tant qu'un secret nommé `forecast-key` est à l'état supprimé, vous pouvez créer un nouveau secret nommé `forecast-key` dans kv-munson.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The retention period (7 to 90 days) can only be set when the vault is created. Purge protection blocks purging until the retention period ends, but soft-deleted objects can still be recovered. Key Vault can't create an object with the name of an object that is in the deleted state, so the name stays taken until the secret is recovered or the retention period ends.
    fr: |
      La période de rétention (7 à 90 jours) ne peut être définie qu'à la création du coffre. La protection contre le vidage bloque le vidage jusqu'à la fin de la période de rétention, mais les objets supprimés de manière réversible peuvent toujours être récupérés. Key Vault ne peut pas créer un objet portant le nom d'un objet à l'état supprimé : le nom reste pris jusqu'à la récupération du secret ou la fin de la période de rétention.
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
