id: ai200-4a-purge-reuse
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores model-provider API keys in a key vault named kv-proseware. Soft delete is enabled with a 90-day retention period, and purge protection is disabled. A developer deleted a secret named `embed-key` by calling `begin_delete_secret("embed-key")`, and the old key has since been revoked by the provider.

    A deployment script now fails when it calls `set_secret("embed-key", new_value)`. You need the script to create embed-key with the new value. The old value must not remain recoverable. Your identity has the required permissions.

    What should the script do before it calls `set_secret`?
  fr: |
    Proseware stocke les clés API des fournisseurs de modèles dans un coffre de clés nommé kv-proseware. La suppression réversible est activée avec une période de rétention de 90 jours, et la protection contre le vidage est désactivée. Un développeur a supprimé un secret nommé `embed-key` en appelant `begin_delete_secret("embed-key")`, et l'ancienne clé a depuis été révoquée par le fournisseur.

    Un script de déploiement échoue désormais quand il appelle `set_secret("embed-key", new_value)`. Le script doit créer embed-key avec la nouvelle valeur. L'ancienne valeur ne doit pas rester récupérable. Votre identité dispose des autorisations requises.

    Que doit faire le script avant d'appeler `set_secret` ?
body:
  options:
    - { id: a, text: { en: "Call `begin_recover_deleted_secret(\"embed-key\")` and wait for the poller to complete.", fr: "Appeler `begin_recover_deleted_secret(\"embed-key\")` et attendre la fin de l'opération." } }
    - { id: b, text: { en: "Call `update_secret_properties(\"embed-key\", enabled=True)` to reactivate the name.", fr: "Appeler `update_secret_properties(\"embed-key\", enabled=True)` pour réactiver le nom." } }
    - { id: c, text: { en: "Disable soft delete on kv-proseware, and then delete embed-key again.", fr: "Désactiver la suppression réversible sur kv-proseware, puis supprimer de nouveau embed-key." } }
    - { id: d, text: { en: "Call `purge_deleted_secret(\"embed-key\")`.", fr: "Appeler `purge_deleted_secret(\"embed-key\")`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A soft-deleted secret keeps its name: Key Vault refuses to create an object with the name of an object that is in the deleted state. Purging permanently deletes it, which frees the name and leaves nothing to recover. Purging is allowed before the retention period ends because purge protection is disabled.
    fr: |
      Un secret supprimé de manière réversible conserve son nom : Key Vault refuse de créer un objet portant le nom d'un objet à l'état supprimé. Le vidage le supprime définitivement, ce qui libère le nom et ne laisse rien à récupérer. Le vidage est autorisé avant la fin de la période de rétention, car la protection contre le vidage est désactivée.
  options:
    a: { en: "Recovering restores the old versions, so the revoked value would remain in the vault's history.", fr: "La récupération restaure les anciennes versions : la valeur révoquée resterait dans l'historique du coffre." }
    b: { en: "A soft-deleted secret only accepts list, recover and purge operations; updating its properties fails.", fr: "Un secret supprimé de manière réversible n'accepte que les opérations de liste, de récupération et de vidage : la mise à jour de ses propriétés échoue." }
    c: { en: "Once enabled, soft delete can't be disabled on a key vault.", fr: "Une fois activée, la suppression réversible ne peut pas être désactivée sur un coffre de clés." }
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
