id: ai200-4a-set-keyvault-cli
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the API key of a translation partner as a secret named `partner-key` in a key vault named kv-fabrikam. You need to make the key available through an App Configuration store named appcs-fabrikam as the key `Chat:PartnerKey` with the label `Prod`, without copying the value into the store. The command must authenticate with your Microsoft Entra sign-in instead of an access key.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke la clé API d'un partenaire de traduction sous forme de secret nommé `partner-key` dans un coffre de clés nommé kv-fabrikam. Vous devez rendre la clé disponible dans un magasin App Configuration nommé appcs-fabrikam sous la clé `Chat:PartnerKey` avec l'étiquette `Prod`, sans copier la valeur dans le magasin. La commande doit s'authentifier avec votre connexion Microsoft Entra plutôt qu'avec une clé d'accès.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az appconfig kv [[cmd]] -n appcs-fabrikam \
      --key Chat:PartnerKey --label Prod \
      [[param]] https://kv-fabrikam.vault.azure.net/secrets/partner-key \
      --auth-mode [[auth]]
  slots:
    - id: cmd
      options:
        - { id: setkv, text: set-keyvault }
        - { id: set, text: set }
        - { id: import, text: import }
    - id: param
      options:
        - { id: secretid, text: --secret-identifier }
        - { id: value, text: --value }
        - { id: ctype, text: --content-type }
    - id: auth
      options:
        - { id: login, text: login }
        - { id: key, text: key }
answer:
  values: { cmd: setkv, param: secretid, auth: login }
explanation:
  correct:
    en: |
      `az appconfig kv set-keyvault` creates a Key Vault reference whose `--secret-identifier` is the URI of the secret; the store keeps only that URI. The CLI uses `--auth-mode key` by default, and `--auth-mode login` uses your Microsoft Entra credentials.
    fr: |
      `az appconfig kv set-keyvault` crée une référence Key Vault dont `--secret-identifier` est l'URI du secret ; le magasin ne conserve que cet URI. L'interface CLI utilise `--auth-mode key` par défaut, et `--auth-mode login` utilise vos informations d'identification Microsoft Entra.
  options:
    set: { en: "`kv set --value` would store the URI as a plain string, not as a Key Vault reference.", fr: "`kv set --value` stockerait l'URI comme une simple chaîne, pas comme une référence Key Vault." }
    key: { en: "`key` is the default mode and authenticates with an access key of the store.", fr: "`key` est le mode par défaut et s'authentifie avec une clé d'accès du magasin." }
references:
  - title: az appconfig kv
    url: https://learn.microsoft.com/en-us/cli/azure/appconfig/kv
