id: ai200-4b-disable-psycopg2
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a Flask semantic-search API that queries Azure Database for PostgreSQL with pgvector through `psycopg2`. The API uses the Azure Monitor OpenTelemetry Distro with its default instrumentations.

    Each search runs dozens of small SQL statements, and the resulting dependency rows make up most of the ingestion volume. You need to stop collecting the PostgreSQL dependencies while keeping the Flask requests and the outgoing HTTP calls to the embedding endpoint. You can change the container app configuration but you can't rebuild the image.

    What should you do?
  fr: |
    Litware exécute une API de recherche sémantique Flask qui interroge Azure Database pour PostgreSQL avec pgvector au moyen de `psycopg2`. L'API utilise la distribution OpenTelemetry Azure Monitor avec ses instrumentations par défaut.

    Chaque recherche exécute des dizaines de petites instructions SQL, et les lignes de dépendances qui en résultent représentent l'essentiel du volume d'ingestion. Vous devez arrêter la collecte des dépendances PostgreSQL tout en conservant les requêtes Flask et les appels HTTP sortants vers le point de terminaison d'embeddings. Vous pouvez modifier la configuration de l'application conteneur, mais vous ne pouvez pas regénérer l'image.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set `OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` to `psycopg2`.", fr: "Définir `OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` sur `psycopg2`." }
    - id: b
      text: { en: "Set `OTEL_TRACES_EXPORTER` to `None`.", fr: "Définir `OTEL_TRACES_EXPORTER` sur `None`." }
    - id: c
      text: { en: "Set `OTEL_TRACES_SAMPLER` to `microsoft.fixed_percentage` and `OTEL_TRACES_SAMPLER_ARG` to `0.1`.", fr: "Définir `OTEL_TRACES_SAMPLER` sur `microsoft.fixed_percentage` et `OTEL_TRACES_SAMPLER_ARG` sur `0.1`." }
    - id: d
      text: { en: "Set `OTEL_PYTHON_EXCLUDED_URLS` to the host name of the PostgreSQL server.", fr: "Définir `OTEL_PYTHON_EXCLUDED_URLS` sur le nom d'hôte du serveur PostgreSQL." }
answer: { optionId: a }
explanation:
  correct:
    en: "`OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` takes a comma-separated list of library names and turns off those bundled instrumentations without a code change. With `psycopg2` disabled, the Flask and HTTP client instrumentations keep producing requests and dependencies."
    fr: "`OTEL_PYTHON_DISABLED_INSTRUMENTATIONS` accepte une liste de noms de bibliothèques séparés par des virgules et désactive ces instrumentations intégrées sans modification du code. Avec `psycopg2` désactivé, les instrumentations Flask et des clients HTTP continuent de produire les requêtes et les dépendances."
  options:
    b:
      en: |-
        This setting disables the export of all distributed tracing telemetry, including the Flask requests and the HTTP dependencies.
      fr: |-
        Ce paramètre désactive l'export de toute la télémétrie de suivi distribué, y compris les requêtes Flask et les dépendances HTTP.
    c:
      en: |-
        Sampling keeps about 10 % of whole traces; the PostgreSQL dependencies remain in the sampled traces and the requests are reduced too.
      fr: |-
        L'échantillonnage conserve environ 10 % des traces entières ; les dépendances PostgreSQL restent dans les traces échantillonnées et les requêtes sont aussi réduites.
    d:
      en: |-
        Excluded URLs apply to HTTP instrumentations only; they don't filter database calls.
      fr: |-
        Les URL exclues s'appliquent uniquement aux instrumentations HTTP ; elles ne filtrent pas les appels de base de données.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
