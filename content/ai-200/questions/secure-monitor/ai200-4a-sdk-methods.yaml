id: ai200-4a-sdk-methods
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is writing a Python operations tool for a key vault named kv-fabrikam by using `SecretClient`. Soft delete is enabled on kv-fabrikam.

    Which method should the tool call for each task? To answer, drag the appropriate methods to the correct tasks. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam écrit un outil d'exploitation Python pour un coffre de clés nommé kv-fabrikam à l'aide de `SecretClient`. La suppression réversible est activée sur kv-fabrikam.

    Quelle méthode l'outil doit-il appeler pour chaque tâche ? Pour répondre, faites glisser les méthodes appropriées vers les tâches correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: get, text: get_secret }
    - { id: update, text: update_secret_properties }
    - { id: listp, text: list_properties_of_secrets }
    - { id: recover, text: begin_recover_deleted_secret }
    - { id: purge, text: purge_deleted_secret }
    - { id: set, text: set_secret }
  targets:
    - id: read
      text: { en: "Read the current value of a secret", fr: "Lire la valeur actuelle d'un secret" }
    - id: disable
      text: { en: "Disable a secret without changing or deleting its value", fr: "Désactiver un secret sans modifier ni supprimer sa valeur" }
    - id: inventory
      text: { en: "List the names and expiration dates of all secrets", fr: "Lister les noms et dates d'expiration de tous les secrets" }
    - id: undo
      text: { en: "Bring back a secret that was deleted by mistake, with its versions", fr: "Rétablir un secret supprimé par erreur, avec ses versions" }
answer:
  mapping: { read: get, disable: update, inventory: listp, undo: recover }
explanation:
  correct:
    en: |
      `get_secret` returns the latest version with its value. `update_secret_properties` changes attributes such as `enabled` and never the value. `list_properties_of_secrets` returns names and attributes without values. `begin_recover_deleted_secret` restores a soft-deleted secret during the retention period.
    fr: |
      `get_secret` renvoie la dernière version avec sa valeur. `update_secret_properties` modifie des attributs comme `enabled`, jamais la valeur. `list_properties_of_secrets` renvoie les noms et attributs sans les valeurs. `begin_recover_deleted_secret` restaure un secret supprimé de manière réversible pendant la période de rétention.
  options:
    purge: { en: "Purging deletes the soft-deleted secret permanently, which is the opposite of recovering it.", fr: "Le vidage supprime définitivement le secret supprimé de manière réversible, soit l'inverse de sa récupération." }
    set: { en: "`set_secret` writes a value and creates a new version; it can't disable a secret or restore a deleted one.", fr: "`set_secret` écrit une valeur et crée une nouvelle version : il ne peut ni désactiver un secret ni en restaurer un supprimé." }
references:
  - title: azure.keyvault.secrets.SecretClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-keyvault-secrets/azure.keyvault.secrets.secretclient
