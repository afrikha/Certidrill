id: ai200-4b-span-kind-scenarios
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is adding manual OpenTelemetry spans to the parts of a Python document-processing pipeline that no bundled instrumentation covers. The telemetry is sent to Application Insights.

    Which span kind should you use for each operation? To answer, drag the appropriate span kinds to the correct operations. Each span kind may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware ajoute des étendues OpenTelemetry manuelles aux parties d'un pipeline Python de traitement de documents qu'aucune instrumentation intégrée ne couvre. La télémétrie est envoyée à Application Insights.

    Quel type d'étendue devez-vous utiliser pour chaque opération ? Pour répondre, faites glisser les types d'étendue appropriés vers les opérations correspondantes. Chaque type d'étendue peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: server, text: SpanKind.SERVER }
    - { id: client, text: SpanKind.CLIENT }
    - { id: producer, text: SpanKind.PRODUCER }
    - { id: consumer, text: SpanKind.CONSUMER }
    - { id: internal, text: SpanKind.INTERNAL }
  targets:
    - id: incoming
      text: { en: "Handle an upload received on a custom TCP listener", fr: "Traiter un chargement reçu sur un écouteur TCP personnalisé" }
    - id: outgoing
      text: { en: "Call an OCR endpoint through a proprietary client library and wait for the response", fr: "Appeler un point de terminaison OCR avec une bibliothèque cliente propriétaire et attendre la réponse" }
    - id: send
      text: { en: "Publish a message announcing that a document is ready to a custom broker", fr: "Publier vers un broker personnalisé un message annonçant qu'un document est prêt" }
    - id: receive
      text: { en: "Process a message received from the custom broker", fr: "Traiter un message reçu du broker personnalisé" }
answer:
  mapping: { incoming: server, outgoing: client, send: producer, receive: consumer }
explanation:
  correct:
    en: |-
      SERVER handles an incoming remote request and CONSUMER processes a received message; Application Insights stores both as requests. CLIENT describes an outgoing call whose response is awaited and PRODUCER describes sending a message; both are stored as dependencies. INTERNAL, the default, is for in-process work with no remote party.
    fr: |-
      SERVER traite une requête distante entrante et CONSUMER traite un message reçu ; Application Insights stocke les deux comme requêtes. CLIENT décrit un appel sortant dont on attend la réponse et PRODUCER décrit l'envoi d'un message ; les deux sont stockés comme dépendances. INTERNAL, le type par défaut, est réservé au travail interne au processus, sans partie distante.
references:
  - title: Add and Modify OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
