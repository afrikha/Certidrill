id: ai200-4a-json-content-type
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores the prompt settings of its writing assistant in an App Configuration store as one key-value, `Assistant:Prompt`, whose value is `{"tone": "formal", "maxWords": 300}`. The Python service loads the store with the configuration provider and must read `config["Assistant:Prompt"]["tone"]` without parsing the value itself.

    What should you do?
  fr: |
    Proseware stocke les paramètres d'invite de son assistant de rédaction dans un magasin App Configuration sous forme d'une clé-valeur, `Assistant:Prompt`, dont la valeur est `{"tone": "formal", "maxWords": 300}`. Le service Python charge le magasin avec le fournisseur de configuration et doit lire `config["Assistant:Prompt"]["tone"]` sans analyser lui-même la valeur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the label of the key-value to `json`.", fr: "Définir l'étiquette de la clé-valeur sur `json`." } }
    - { id: b, text: { en: "Add the tag `format=json` to the key-value.", fr: "Ajouter la balise `format=json` à la clé-valeur." } }
    - { id: c, text: { en: "Pass `trim_prefixes=[\"Assistant:\"]` to `load()`.", fr: "Passer `trim_prefixes=[\"Assistant:\"]` à `load()`." } }
    - { id: d, text: { en: "Set the content type of the key-value to `application/json`.", fr: "Définir le type de contenu de la clé-valeur sur `application/json`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The provider automatically deserializes key-values that have a valid JSON content type, such as `application/json`, into Python objects. You can set it with `az appconfig kv set ... --content-type application/json`.
    fr: |
      Le fournisseur désérialise automatiquement en objets Python les clés-valeurs qui ont un type de contenu JSON valide, comme `application/json`. Vous pouvez le définir avec `az appconfig kv set ... --content-type application/json`.
  options:
    a: { en: "A label creates a variant of the key; it doesn't describe the format of the value.", fr: "Une étiquette crée une variante de la clé ; elle ne décrit pas le format de la valeur." }
    b: { en: "Tags are used to filter key-values, not to deserialize them.", fr: "Les balises servent à filtrer les clés-valeurs, pas à les désérialiser." }
    c: { en: "Trimming the prefix renames the key; the value would still be a string.", fr: "Retirer le préfixe renomme la clé : la valeur resterait une chaîne." }
references:
  - title: Python configuration provider
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider
  - title: Keys and values
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
