id: ai200-4b-conn-string-env
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso builds a retrieval-augmented generation (RAG) API in Python that runs in Azure Container Apps. You add the Azure Monitor OpenTelemetry Distro (`azure-monitor-opentelemetry`) to the app.

    The connection string of the Application Insights resource must not appear in the source code or in the container image. The same image is deployed to a test and a production environment, and each environment sends telemetry to its own Application Insights resource.

    What should you do?
  fr: |
    Contoso développe en Python une API de génération augmentée de récupération (RAG) qui s'exécute dans Azure Container Apps. Vous ajoutez la distribution OpenTelemetry Azure Monitor (`azure-monitor-opentelemetry`) à l'application.

    La chaîne de connexion de la ressource Application Insights ne doit apparaître ni dans le code source ni dans l'image conteneur. La même image est déployée dans un environnement de test et dans un environnement de production, et chaque environnement envoie sa télémétrie à sa propre ressource Application Insights.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the `APPLICATIONINSIGHTS_CONNECTION_STRING` environment variable of each container app and call `configure_azure_monitor()` without a connection string argument.
        fr: |-
          Définir la variable d'environnement `APPLICATIONINSIGHTS_CONNECTION_STRING` de chaque application conteneur et appeler `configure_azure_monitor()` sans argument de chaîne de connexion.
    - id: b
      text:
        en: |-
          Pass the connection string of each environment to `configure_azure_monitor(connection_string=...)` from a constant that the build pipeline writes into the code.
        fr: |-
          Passer la chaîne de connexion de chaque environnement à `configure_azure_monitor(connection_string=...)` à partir d'une constante que le pipeline de build écrit dans le code.
    - id: c
      text:
        en: |-
          Set the `OTEL_EXPORTER_OTLP_ENDPOINT` environment variable of each container app to the ingestion endpoint of its Application Insights resource.
        fr: |-
          Définir la variable d'environnement `OTEL_EXPORTER_OTLP_ENDPOINT` de chaque application conteneur sur le point de terminaison d'ingestion de sa ressource Application Insights.
    - id: d
      text:
        en: |-
          Declare `APPLICATIONINSIGHTS_CONNECTION_STRING` with an `ENV` instruction in the Dockerfile and build one image tag for each environment.
        fr: |-
          Déclarer `APPLICATIONINSIGHTS_CONNECTION_STRING` avec une instruction `ENV` dans le Dockerfile et générer une balise d'image par environnement.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When `connection_string` isn't passed, `configure_azure_monitor()` reads it from the `APPLICATIONINSIGHTS_CONNECTION_STRING` environment variable. Each container app supplies its own value at run time, so the code and the image stay identical across environments and contain no connection string.
    fr: |-
      Quand `connection_string` n'est pas passé, `configure_azure_monitor()` le lit dans la variable d'environnement `APPLICATIONINSIGHTS_CONNECTION_STRING`. Chaque application conteneur fournit sa propre valeur à l'exécution : le code et l'image restent identiques d'un environnement à l'autre et ne contiennent aucune chaîne de connexion.
  options:
    b:
      en: |-
        A constant written into the code puts the connection string in the source and in the image, which the requirements forbid.
      fr: |-
        Une constante écrite dans le code place la chaîne de connexion dans la source et dans l'image, ce que les exigences interdisent.
    c:
      en: "`OTEL_EXPORTER_OTLP_ENDPOINT` configures the OTLP exporter for a collector; the Azure Monitor exporter of the distro is configured by the connection string."
      fr: "`OTEL_EXPORTER_OTLP_ENDPOINT` configure l'exportateur OTLP vers un collecteur ; l'exportateur Azure Monitor de la distribution se configure avec la chaîne de connexion."
    d:
      en: |-
        An `ENV` instruction stores the value in the image, and one tag per environment means the same image is no longer deployed everywhere.
      fr: |-
        Une instruction `ENV` stocke la valeur dans l'image, et une balise par environnement signifie que la même image n'est plus déployée partout.
references:
  - title: Azure Monitor Opentelemetry Distro client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
