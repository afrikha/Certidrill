id: ai200-1a-app-slot-image-release
objective: "1.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware runs its invoice-extraction API in the App Service app **app-lit-invoice**, which has a `staging` deployment slot. The images are built with ACR Tasks in the Azure container registry **crlitware**.

    You need to release version 2.2.0 of the API. Production must never serve an untested build, and every instance must run the same image.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware exécute son API d'extraction de factures dans l'application App Service **app-lit-invoice**, qui possède un emplacement de déploiement `staging`. Les images sont générées avec ACR Tasks dans le registre de conteneurs Azure **crlitware**.

    Vous devez publier la version 2.2.0 de l'API. La production ne doit jamais servir un build non testé, et chaque instance doit exécuter la même image.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: build, text: { en: "Run `az acr build` to build and push `invoice/api:2.2.0-<commit>`.", fr: "Exécuter `az acr build` pour générer et envoyer `invoice/api:2.2.0-<commit>`." } }
    - { id: setimage, text: { en: "Run `az webapp config container set --slot staging` with the image `crlitware.azurecr.io/invoice/api:2.2.0-<commit>`.", fr: "Exécuter `az webapp config container set --slot staging` avec l'image `crlitware.azurecr.io/invoice/api:2.2.0-<commit>`." } }
    - { id: test, text: { en: "Run the integration tests against the staging slot's URL.", fr: "Exécuter les tests d'intégration sur l'URL de l'emplacement staging." } }
    - { id: swap, text: { en: "Swap the staging slot with the production slot.", fr: "Permuter l'emplacement staging avec l'emplacement de production." } }
    - { id: latest, text: { en: "Run `az webapp config container set` on production with the image `crlitware.azurecr.io/invoice/api:latest`.", fr: "Exécuter `az webapp config container set` sur la production avec l'image `crlitware.azurecr.io/invoice/api:latest`." } }
    - { id: restart, text: { en: "Restart the production slot.", fr: "Redémarrer l'emplacement de production." } }
answer:
  sequence: [ build, setimage, test, swap ]
explanation:
  correct:
    en: |
      The image must exist under a unique tag before a slot can reference it. Deploying it to the staging slot lets you test it on the same App Service plan as production, and only the swap moves the tested build to production, so production never runs an untested image.
    fr: |
      L'image doit exister sous une balise unique avant qu'un emplacement puisse la référencer. La déployer sur l'emplacement staging permet de la tester sur le même plan que la production, et seule la permutation fait passer le build testé en production : la production n'exécute jamais une image non testée.
  options:
    latest: { en: "Deploying latest directly to production skips the tests, and a moving tag lets instances drift.", fr: "Déployer latest directement en production contourne les tests, et une balise mobile laisse les instances diverger." }
    restart: { en: "A swap needs no restart of production, and a restart doesn't deploy anything.", fr: "Une permutation ne nécessite aucun redémarrage de la production, et un redémarrage ne déploie rien." }
references:
  - title: az webapp config container
    url: https://learn.microsoft.com/en-us/cli/azure/webapp/config/container?view=azure-cli-latest
  - title: Recommendations for tagging and versioning container images
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
