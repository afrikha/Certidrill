id: ai200-1b-aks-core-concepts
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is writing the manifests of a product-search API for its Azure Kubernetes Service (AKS) cluster, which has one system node pool and one user node pool. The team is deciding which namespace the objects will use and where the pods will run.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys rédige les manifestes d'une API de recherche de produits pour son cluster Azure Kubernetes Service (AKS), qui possède un pool de nœuds système et un pool de nœuds utilisateur. L'équipe choisit l'espace de noms des objets et l'endroit où les pods s'exécuteront.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft recommends that you don't deploy your own applications to the kube-system namespace.", fr: "Microsoft recommande de ne pas déployer vos propres applications dans l'espace de noms kube-system." } }
    - { id: b, text: { en: "Objects whose manifest doesn't specify a namespace are created in the kube-public namespace.", fr: "Les objets dont le manifeste ne précise pas d'espace de noms sont créés dans l'espace de noms kube-public." } }
    - { id: c, text: { en: "User node pools are intended to host the application pods, while system node pools host critical system pods such as CoreDNS.", fr: "Les pools de nœuds utilisateur sont destinés à héberger les pods d'application, tandis que les pools de nœuds système hébergent les pods système critiques comme CoreDNS." } }
    - { id: d, text: { en: "Each node can give all of its CPU and memory to pods, because AKS reserves no resources on nodes.", fr: "Chaque nœud peut donner tout son processeur et toute sa mémoire aux pods, car AKS ne réserve aucune ressource sur les nœuds." } }
    - { id: e, text: { en: "The system node pool is created when you add the first user node pool.", fr: "Le pool de nœuds système est créé lors de l'ajout du premier pool de nœuds utilisateur." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The kube-system namespace holds the resources that Kubernetes uses to manage the cluster, such as coredns and metrics-server, and Microsoft recommends against deploying your own applications there. System node pools host critical system pods, and user node pools host application pods with their own compute or storage needs.
    fr: "L'espace de noms kube-system contient les ressources que Kubernetes utilise pour gérer le cluster, comme coredns et metrics-server, et Microsoft déconseille d'y déployer vos propres applications. Les pools de nœuds système hébergent les pods système critiques, et les pools de nœuds utilisateur hébergent les pods d'application avec leurs propres besoins de calcul ou de stockage."
  options:
    b: { en: "Such objects go to the namespace of the current kubectl context, default unless you change it; kube-public is rarely used and makes resources visible across the whole cluster.", fr: "Ces objets vont dans l'espace de noms du contexte kubectl actuel, default sauf si vous le changez ; kube-public est rarement utilisé et rend des ressources visibles dans tout le cluster." }
    d: { en: "AKS reserves CPU and memory on each node, so the allocatable resources are less than the node's total resources.", fr: "AKS réserve du processeur et de la mémoire sur chaque nœud : les ressources allouables sont donc inférieures aux ressources totales du nœud." }
    e: { en: "The system node pool is created with the cluster.", fr: "Le pool de nœuds système est créé avec le cluster." }
references:
  - title: Azure Kubernetes Service (AKS) Core Concepts
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-clusters-workloads
