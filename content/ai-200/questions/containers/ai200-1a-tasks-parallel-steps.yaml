id: ai200-1a-tasks-parallel-steps
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs the following multi-step task file with `az acr run` to build the API and the indexing worker of its RAG solution.

    ```yaml
    version: v1.1.0
    steps:
      - id: build-api
        build: -t $Registry/rag/api:$ID .
        when: ["-"]
      - id: build-worker
        build: -t $Registry/rag/worker:$ID ./worker
        when: ["-"]
      - id: test-api
        cmd: $Registry/rag/api:$ID python -m pytest
        when: ["build-api"]
      - id: push
        push:
          - $Registry/rag/api:$ID
          - $Registry/rag/worker:$ID
        when: ["test-api", "build-worker"]
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute le fichier de tâche multiétape suivant avec `az acr run` pour générer l'API et le worker d'indexation de sa solution RAG.

    ```yaml
    version: v1.1.0
    steps:
      - id: build-api
        build: -t $Registry/rag/api:$ID .
        when: ["-"]
      - id: build-worker
        build: -t $Registry/rag/worker:$ID ./worker
        when: ["-"]
      - id: test-api
        cmd: $Registry/rag/api:$ID python -m pytest
        when: ["build-api"]
      - id: push
        push:
          - $Registry/rag/api:$ID
          - $Registry/rag/worker:$ID
        when: ["test-api", "build-worker"]
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "build-api and build-worker can run at the same time.", fr: "build-api et build-worker peuvent s'exécuter en même temps." } }
    - { id: b, text: { en: "If test-api fails, the worker image is still pushed.", fr: "Si test-api échoue, l'image du worker est quand même envoyée." } }
    - { id: c, text: { en: "If test-api fails, neither image is pushed.", fr: "Si test-api échoue, aucune des deux images n'est envoyée." } }
    - { id: d, text: { en: "test-api pulls the rag/api image from Docker Hub.", fr: "test-api tire l'image rag/api depuis Docker Hub." } }
    - { id: e, text: { en: "Each step times out after 3,600 seconds unless the file sets another value.", fr: "Chaque étape expire au bout de 3 600 secondes, sauf si le fichier définit une autre valeur." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      `when: ["-"]` means that a step has no dependency and starts immediately, so the two build steps run in parallel. The push step depends on both test-api and build-worker; if the tests fail, the push step never runs and neither image is pushed, because a build step doesn't push its image by itself.
    fr: |
      `when: ["-"]` signifie qu'une étape n'a aucune dépendance et démarre immédiatement : les deux étapes de génération s'exécutent en parallèle. L'étape push dépend à la fois de test-api et de build-worker ; si les tests échouent, l'étape push ne s'exécute jamais et aucune image n'est envoyée, car une étape build n'envoie pas son image d'elle-même.
  options:
    b: { en: "The single push step pushes both images and waits for test-api to succeed.", fr: "L'unique étape push envoie les deux images et attend la réussite de test-api." }
    d: { en: "The image name is prefixed with $Registry, so it refers to the image built earlier in the run for the task's own registry, not to Docker Hub.", fr: "Le nom de l'image est préfixé par $Registry : il désigne l'image générée plus tôt dans l'exécution pour le registre de la tâche, pas une image de Docker Hub." }
    e: { en: "The default step timeout is 600 seconds.", fr: "Le délai d'expiration par défaut d'une étape est de 600 secondes." }
references:
  - title: "ACR Tasks reference: YAML"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-reference-yaml
  - title: Run multi-step build, test, and patch tasks in ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-multi-step
