id: ai200-sr1-secret-update-2
objective: "1.2.1"
type: series_yesno
series: ai200-sr1-secret-update
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You update the secret value and restart the active revision.
  fr: Vous mettez à jour la valeur du secret et redémarrez la révision active.
body:
  solution:
    en: |
      You run the following commands:

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`

      `az containerapp revision restart -n ca-summarizer -g rg-fabrikam --revision ca-summarizer--v7`
    fr: |
      Vous exécutez les commandes suivantes :

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`

      `az containerapp revision restart -n ca-summarizer -g rg-fabrikam --revision ca-summarizer--v7`
answer: { value: true }
explanation:
  correct:
    en: Changing a secret is an application-scope change that does not create a revision. A revision must be restarted before its containers recognize the new secret value, so restarting ca-summarizer--v7 makes the replicas start with the new key in `TRANSLATOR_KEY` while the revision stays the same.
    fr: "La modification d'un secret est une modification de l'étendue application qui ne crée pas de révision. Une révision doit être redémarrée pour que ses conteneurs prennent en compte la nouvelle valeur du secret : le redémarrage de ca-summarizer--v7 fait démarrer les réplicas avec la nouvelle clé dans `TRANSLATOR_KEY`, sans changer de révision."
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
  - title: az containerapp revision
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp/revision?view=azure-cli-latest
