id: ai200-1b-aks-hpa-manifest
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a retrieval API as the Deployment **rag-api** in the namespace `rag` of an Azure Kubernetes Service (AKS) cluster. Every container of rag-api defines CPU requests and limits.

    You need rag-api to run between 3 and 12 pods and to add or remove pods to keep the average CPU utilization of the pods at about 70 percent of their requests.

    How should you complete the manifest? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une API de récupération sous la forme du Deployment **rag-api** dans l'espace de noms `rag` d'un cluster Azure Kubernetes Service (AKS). Chaque conteneur de rag-api définit des demandes et des limites de processeur.

    Vous devez faire en sorte que rag-api exécute entre 3 et 12 pods et ajoute ou supprime des pods pour maintenir l'utilisation moyenne du processeur des pods à environ 70 % de leurs demandes.

    Comment devez-vous compléter le manifeste ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: rag-api-hpa
      namespace: rag
    spec:
      minReplicas: 3
      maxReplicas: 12
      scaleTargetRef:
        apiVersion: apps/v1
        kind: [[kind]]
        name: rag-api
      metrics:
        - type: Resource
          resource:
            name: [[metric]]
            target:
              type: Utilization
              averageUtilization: [[util]]
  slots:
    - id: kind
      options:
        - { id: deployment, text: Deployment }
        - { id: service, text: Service }
        - { id: pod, text: Pod }
    - id: metric
      options:
        - { id: cpu, text: cpu }
        - { id: memory, text: memory }
        - { id: requests, text: requests }
    - id: util
      options:
        - { id: u70, text: "70" }
        - { id: u07, text: "0.7" }
        - { id: u700m, text: "700m" }
answer:
  values: { kind: deployment, metric: cpu, util: u70 }
explanation:
  correct:
    en: "The HorizontalPodAutoscaler changes the replica count of the workload named in `scaleTargetRef`, here the rag-api Deployment. A `Resource` metric named `cpu` with a `Utilization` target compares the average CPU use of the pods with their requests, and `averageUtilization` is a percentage, so 70 means 70 percent."
    fr: "Le HorizontalPodAutoscaler modifie le nombre de réplicas de la charge de travail nommée dans `scaleTargetRef`, ici le Deployment rag-api. Une métrique `Resource` nommée `cpu` avec une cible `Utilization` compare l'utilisation moyenne du processeur des pods à leurs demandes, et `averageUtilization` est un pourcentage : 70 signifie 70 %."
  options:
    service: { en: "A Service has no replicas; the autoscaler must target the Deployment that owns the pods.", fr: "Un Service n'a pas de réplicas ; l'outil de mise à l'échelle doit cibler le Deployment qui possède les pods." }
    pod: { en: "A single pod can't be scaled; the target must be a workload with a replica count.", fr: "Un pod isolé ne peut pas être mis à l'échelle ; la cible doit être une charge de travail dotée d'un nombre de réplicas." }
    memory: { en: "The requirement is based on CPU utilization, not memory.", fr: "L'exigence porte sur l'utilisation du processeur, pas sur la mémoire." }
    requests: { en: "requests isn't a resource name; the metric name is the resource, such as cpu.", fr: "requests n'est pas un nom de ressource ; le nom de la métrique est la ressource, comme cpu." }
    u07: { en: "averageUtilization is an integer percentage, not a fraction.", fr: "averageUtilization est un pourcentage entier, pas une fraction." }
    u700m: { en: "700m is a CPU quantity in millicores; a Utilization target takes a percentage.", fr: "700m est une quantité de processeur en millicœurs ; une cible Utilization prend un pourcentage." }
references:
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
