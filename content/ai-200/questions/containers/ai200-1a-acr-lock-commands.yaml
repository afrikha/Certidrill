id: ai200-1a-acr-lock-commands
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware's release pipeline has just deployed the image `vision/ocr:3.2.0-b2841` from the Azure container registry **crlitware**. You need to meet the following requirements:

    - Nobody can overwrite or delete the deployed image.
    - Teams can keep pushing and updating other images in the `vision/ocr` repository, but nobody can delete the repository.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline de mise en production de Litware vient de déployer l'image `vision/ocr:3.2.0-b2841` du registre de conteneurs Azure **crlitware**. Vous devez satisfaire les exigences suivantes :

    - Personne ne peut écraser ni supprimer l'image déployée.
    - Les équipes peuvent continuer à envoyer et à mettre à jour d'autres images dans le dépôt `vision/ocr`, mais personne ne peut supprimer le dépôt.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr repository update --name crlitware \
      --image vision/ocr:3.2.0-b2841 [[img]]

    az acr repository update --name crlitware \
      --repository vision/ocr [[repo]]
  slots:
    - id: img
      options:
        - { id: wf, text: "--write-enabled false" }
        - { id: df, text: "--delete-enabled false --write-enabled true" }
        - { id: rf, text: "--read-enabled false" }
        - { id: unlock, text: "--delete-enabled true --write-enabled true" }
    - id: repo
      options:
        - { id: wf, text: "--write-enabled false" }
        - { id: df, text: "--delete-enabled false --write-enabled true" }
        - { id: rf, text: "--read-enabled false" }
        - { id: unlock, text: "--delete-enabled true --write-enabled true" }
answer:
  values: { img: wf, repo: df }
explanation:
  correct:
    en: |
      Setting write-enabled to false on an image locks it: it can be neither overwritten nor deleted. On the repository, delete-enabled false with write-enabled true blocks the deletion of the repository while images can still be pushed and updated; locking the whole repository with write-enabled false would block every push.
    fr: |
      Définir write-enabled sur false pour une image la verrouille : elle ne peut être ni écrasée ni supprimée. Sur le dépôt, delete-enabled false avec write-enabled true bloque la suppression du dépôt tout en permettant d'envoyer et de mettre à jour des images ; verrouiller tout le dépôt avec write-enabled false bloquerait tous les envois.
  options:
    rf: { en: "read-enabled false blocks pulls, which would break the deployment, and protects nothing against deletion.", fr: "read-enabled false bloque les tirages, ce qui casserait le déploiement, et ne protège pas contre la suppression." }
    unlock: { en: "These values remove the locks instead of setting them.", fr: "Ces valeurs suppriment les verrous au lieu de les poser." }
references:
  - title: Lock a container image in an Azure container registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-lock
