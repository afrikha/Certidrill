id: ai200-cs2a-image-pulls
objective: "1.2.3"
type: single
caseStudy: ai200-cs2a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    The DocParser deployment manifest references the image `crwwi.azurecr.io/docparser` and contains no `imagePullSecrets` section. The new pods stay in the `ImagePullBackOff` state, and the pod events show an authorization error from crwwi. You hold the Owner role on the subscription.

    You need to meet the image pulls requirement. What should you do?
  fr: |
    Le manifeste du déploiement DocParser référence l'image `crwwi.azurecr.io/docparser` et ne contient pas de section `imagePullSecrets`. Les nouveaux pods restent à l'état `ImagePullBackOff`, et les événements des pods indiquent une erreur d'autorisation de crwwi. Vous disposez du rôle Owner sur l'abonnement.

    Vous devez satisfaire l'exigence relative au tirage des images. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Enable the admin user of crwwi and store its password in a Kubernetes secret referenced by the deployment."
        fr: "Activer l'utilisateur administrateur de crwwi et stocker son mot de passe dans un secret Kubernetes référencé par le déploiement."
    - id: c
      text:
        en: "Assign the AcrPush role on crwwi to your own user account and redeploy the manifest."
        fr: "Attribuer le rôle AcrPush sur crwwi à votre propre compte d'utilisateur, puis redéployer le manifeste."
    - id: d
      text:
        en: "Create a service principal, assign it the AcrPull role on crwwi, and add its secret to an `imagePullSecrets` entry."
        fr: "Créer un principal de service, lui attribuer le rôle AcrPull sur crwwi, puis ajouter son secret dans une entrée `imagePullSecrets`."
    - id: b
      text:
        en: "Run `az aks update --name aks-wwi --resource-group <rg> --attach-acr crwwi`."
        fr: "Exécuter `az aks update --name aks-wwi --resource-group <rg> --attach-acr crwwi`."
answer: { optionId: b }
explanation:
  correct:
    en: "`az aks update --attach-acr` assigns the AcrPull role on the registry to the kubelet managed identity of the cluster, by using the permissions of the user who runs the command (Owner is enough). The nodes then authenticate to crwwi with that identity, so no registry credential is stored in the cluster and the manifest needs no `imagePullSecrets`."
    fr: "`az aks update --attach-acr` attribue le rôle AcrPull sur le registre à l'identité managée kubelet du cluster, avec les autorisations de l'utilisateur qui exécute la commande (Owner suffit). Les nœuds s'authentifient alors auprès de crwwi avec cette identité : aucune information d'identification du registre n'est stockée dans le cluster et le manifeste n'a pas besoin d'`imagePullSecrets`."
  options:
    a:
      en: The admin user password would be stored in a Kubernetes secret, which the requirement forbids.
      fr: Le mot de passe de l'utilisateur administrateur serait stocké dans un secret Kubernetes, ce que l'exigence interdit.
    c:
      en: The kubelet identity of the nodes pulls the images, not your user account; a role on your account does not change what the nodes can do.
      fr: C'est l'identité kubelet des nœuds qui tire les images, pas votre compte d'utilisateur ; un rôle sur votre compte ne change pas ce que les nœuds peuvent faire.
    d:
      en: The service principal works, but its secret is stored in the cluster as an image pull secret, which the requirement forbids.
      fr: Le principal de service fonctionne, mais son secret est stocké dans le cluster sous forme de secret de tirage d'image, ce que l'exigence interdit.
references:
  - title: Integrate Azure Container Registry with Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
