id: ai200-sr1-cpu-autoscale-3
objective: "1.2.3"
type: series_yesno
series: ai200-sr1-cpu-autoscale
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You apply a HorizontalPodAutoscaler without changing the Deployment.
  fr: Vous appliquez un HorizontalPodAutoscaler sans modifier le Deployment.
body:
  solution:
    en: |
      You leave the embed-api Deployment manifest unchanged, and you apply the following manifest:

      ```yaml
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: embed-api-hpa
        namespace: rag
      spec:
        minReplicas: 2
        maxReplicas: 8
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: embed-api
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
      ```
    fr: |
      Vous laissez le manifeste du Deployment embed-api inchangé, et vous appliquez le manifeste suivant :

      ```yaml
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: embed-api-hpa
        namespace: rag
      spec:
        minReplicas: 2
        maxReplicas: 8
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: embed-api
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
      ```
answer: { value: false }
explanation:
  correct:
    en: The manifest itself is valid, but the horizontal pod autoscaler requires CPU requests and limits on all the containers. The embed-api container has no `resources` section, so the autoscaler cannot compute a utilization percentage and does not scale the Deployment.
    fr: "Le manifeste lui-même est valide, mais le HorizontalPodAutoscaler exige des demandes et des limites de processeur sur tous les conteneurs. Le conteneur embed-api n'a pas de section `resources` : l'autoscaler ne peut pas calculer de pourcentage d'utilisation et ne met pas le Deployment à l'échelle."
references:
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
