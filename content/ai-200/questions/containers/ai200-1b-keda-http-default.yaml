id: ai200-1b-keda-http-default
objective: "1.2.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Adatum deploys a question-answering API named **ca-qna** to Azure Container Apps with external ingress. The deployment defines an HTTP scale rule but doesn't set its `concurrentRequests` value.

    Above how many concurrent HTTP requests per replica does Container Apps add replicas?
  fr: |
    Adatum déploie une API de questions-réponses nommée **ca-qna** sur Azure Container Apps avec une entrée externe. Le déploiement définit une règle de mise à l'échelle HTTP, mais ne définit pas sa valeur `concurrentRequests`.

    Au-delà de combien de requêtes HTTP simultanées par réplica Container Apps ajoute-t-il des réplicas ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "5" }
    - { id: c, text: "10" }
    - { id: d, text: "100" }
answer: { optionId: c }
explanation:
  correct:
    en: The `concurrentRequests` property of an HTTP scale rule defaults to 10, with a minimum of 1. Every 15 seconds, Container Apps computes the concurrent requests from the requests of the past 15 seconds and adds replicas when the value exceeds the target.
    fr: La propriété `concurrentRequests` d'une règle de mise à l'échelle HTTP vaut 10 par défaut, avec un minimum de 1. Toutes les 15 secondes, Container Apps calcule les requêtes simultanées à partir des requêtes des 15 dernières secondes et ajoute des réplicas quand la valeur dépasse la cible.
  options:
    a: { en: "1 is the minimum value you can set, not the default.", fr: "1 est la valeur minimale que vous pouvez définir, pas la valeur par défaut." }
    b: { en: "The default value is 10.", fr: "La valeur par défaut est 10." }
    d: { en: "The default value is 10; 100 must be set explicitly.", fr: "La valeur par défaut est 10 ; 100 doit être défini explicitement." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
