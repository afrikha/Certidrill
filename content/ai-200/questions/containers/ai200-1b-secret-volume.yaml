id: ai200-1b-secret-volume
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys a document assistant named **ca-docs** to Azure Container Apps by using a YAML file. The app has a system-assigned managed identity with the Key Vault Secrets User role on the key vault **kv-fab**.

    The code expects the Azure OpenAI key in the file `/mnt/secrets/openai.txt`. The key must come from the Key Vault secret `openai-key`, and it must never be written in the YAML file.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam déploie un assistant documentaire nommé **ca-docs** sur Azure Container Apps à l'aide d'un fichier YAML. L'application possède une identité managée affectée par le système qui dispose du rôle Key Vault Secrets User sur le coffre de clés **kv-fab**.

    Le code attend la clé Azure OpenAI dans le fichier `/mnt/secrets/openai.txt`. La clé doit provenir du secret Key Vault `openai-key` et ne doit jamais être écrite dans le fichier YAML.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    properties:
      configuration:
        secrets:
          - name: openai-key
            [[kvurl]]: https://kv-fab.vault.azure.net/secrets/openai-key
            identity: system
      template:
        containers:
          - name: docs
            image: crfabrikam.azurecr.io/docs/assistant:3.2.0
            volumeMounts:
              - volumeName: llm-secrets
                mountPath: /mnt/secrets
        volumes:
          - name: llm-secrets
            storageType: [[storage]]
            secrets:
              - [[ref]]: openai-key
                path: openai.txt
  slots:
    - id: kvurl
      options:
        - { id: keyvaulturl, text: keyVaultUrl }
        - { id: value, text: value }
        - { id: keyvaultref, text: keyvaultref }
    - id: storage
      options:
        - { id: secret, text: Secret }
        - { id: emptydir, text: EmptyDir }
        - { id: azurefile, text: AzureFile }
    - id: ref
      options:
        - { id: secretref, text: secretRef }
        - { id: secretkeyref, text: secretKeyRef }
        - { id: name, text: name }
answer:
  values: { kvurl: keyvaulturl, storage: secret, ref: secretref }
explanation:
  correct:
    en: "In the `secrets` array, `keyVaultUrl` with `identity: system` makes Container Apps read the value from Key Vault with the app's identity. A volume with `storageType: Secret` turns app secrets into files, and its `secrets` list selects `openai-key` with `secretRef` and names the file with `path`, so the code reads `/mnt/secrets/openai.txt`."
    fr: "Dans le tableau `secrets`, `keyVaultUrl` avec `identity: system` fait lire la valeur dans Key Vault par Container Apps avec l'identité de l'application. Un volume avec `storageType: Secret` transforme les secrets de l'application en fichiers, et sa liste `secrets` sélectionne `openai-key` avec `secretRef` et nomme le fichier avec `path` : le code lit donc `/mnt/secrets/openai.txt`."
  options:
    value: { en: "`value` stores the secret value itself in the YAML file, which is forbidden.", fr: "`value` stocke la valeur du secret elle-même dans le fichier YAML, ce qui est interdit." }
    keyvaultref: { en: "`keyvaultref:` is the prefix of the Azure CLI `--secrets` syntax, not a YAML property.", fr: "`keyvaultref:` est le préfixe de la syntaxe `--secrets` de l'Azure CLI, pas une propriété YAML." }
    emptydir: { en: "An EmptyDir volume is empty scratch storage; it doesn't contain the app secrets.", fr: "Un volume EmptyDir est un stockage temporaire vide ; il ne contient pas les secrets de l'application." }
    azurefile: { en: "An AzureFile volume mounts an Azure Files share, not the app secrets.", fr: "Un volume AzureFile monte un partage Azure Files, pas les secrets de l'application." }
    secretkeyref: { en: "`secretKeyRef` is Kubernetes syntax for environment variables in a pod manifest.", fr: "`secretKeyRef` est une syntaxe Kubernetes pour les variables d'environnement d'un manifeste de pod." }
    name: { en: "The entries of a Secret volume reference an app secret with `secretRef`.", fr: "Les entrées d'un volume Secret référencent un secret de l'application avec `secretRef`." }
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
