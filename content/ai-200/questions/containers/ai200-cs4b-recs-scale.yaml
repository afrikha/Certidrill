id: ai200-cs4b-recs-scale
objective: "1.2.2"
type: dropdown
caseStudy: ai200-cs4b-southridge
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the scaling of recs-api to meet the WatchNext scaling requirement. You will apply the following YAML to recs-api.

    How should you complete the YAML? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la mise à l'échelle de recs-api pour satisfaire l'exigence relative à la mise à l'échelle de WatchNext. Vous appliquerez le code YAML suivant à recs-api.

    Comment devez-vous compléter le code YAML ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    properties:
      template:
        scale:
          minReplicas: [[min]]
          maxReplicas: [[max]]
          rules:
            - name: http-concurrency
              [[ruletype]]:
                metadata:
                  [[key]]: "50"
  slots:
    - id: min
      options:
        - { id: m0, text: "0" }
        - { id: m1, text: "1" }
        - { id: m30, text: "30" }
    - id: max
      options:
        - { id: x10, text: "10" }
        - { id: x30, text: "30" }
        - { id: x1000, text: "1000" }
    - id: ruletype
      options:
        - { id: http, text: "http" }
        - { id: tcp, text: "tcp" }
        - { id: custom, text: "custom" }
    - id: key
      options:
        - { id: requests, text: "concurrentRequests" }
        - { id: connections, text: "concurrentConnections" }
        - { id: messages, text: "messageCount" }
answer:
  values: { min: m1, max: x30, ruletype: http, key: requests }
explanation:
  correct:
    en: "One replica that always runs removes the cold start at the lowest cost, because `minReplicas` defaults to 0. `maxReplicas` defaults to 10, so it must be raised to 30, and not higher, to cap the replicas. An HTTP scale rule with `concurrentRequests` adds replicas when the concurrent HTTP requests exceed the threshold, which defaults to 10."
    fr: "Un réplica toujours actif supprime le démarrage à froid au coût le plus faible, car `minReplicas` vaut 0 par défaut. `maxReplicas` vaut 10 par défaut : il doit être porté à 30, et pas plus, pour plafonner les réplicas. Une règle de mise à l'échelle HTTP avec `concurrentRequests` ajoute des réplicas quand les requêtes HTTP simultanées dépassent le seuil, qui vaut 10 par défaut."
  options:
    m0: { en: "With `minReplicas` 0, recs-api scales to zero when idle and the next request waits for a cold start.", fr: "Avec `minReplicas` à 0, recs-api descend à zéro en l'absence d'activité et la requête suivante attend un démarrage à froid." }
    m30: { en: "Thirty replicas that always run avoid the cold start but cost far more than one.", fr: "Trente réplicas toujours actifs évitent le démarrage à froid mais coûtent bien plus qu'un seul." }
    x10: { en: "10 is the default maximum: recs-api couldn't reach the 30 replicas it needs at peak times.", fr: "10 est le maximum par défaut : recs-api ne pourrait pas atteindre les 30 réplicas nécessaires aux heures de pointe." }
    x1000: { en: "1,000 is the upper limit of `maxReplicas`; it doesn't cap recs-api at 30 replicas.", fr: "1 000 est la limite supérieure de `maxReplicas` ; cette valeur ne plafonne pas recs-api à 30 réplicas." }
    tcp: { en: "A TCP rule scales on concurrent TCP connections, not on HTTP requests.", fr: "Une règle TCP met à l'échelle selon les connexions TCP simultanées, pas selon les requêtes HTTP." }
    custom: { en: "A custom rule uses a KEDA scaler such as a queue; the built-in HTTP rule measures concurrent requests.", fr: "Une règle personnalisée utilise un scaler KEDA, par exemple une file d'attente ; la règle HTTP intégrée mesure les requêtes simultanées." }
    connections: { en: "`concurrentConnections` is the metadata of a TCP rule.", fr: "`concurrentConnections` est la métadonnée d'une règle TCP." }
    messages: { en: "`messageCount` is the metadata of the Azure Service Bus KEDA scaler.", fr: "`messageCount` est la métadonnée du scaler KEDA Azure Service Bus." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
