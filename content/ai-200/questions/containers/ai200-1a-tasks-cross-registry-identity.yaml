id: ai200-1a-tasks-cross-registry-identity
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has two Azure container registries: **crbase**, which holds approved base images, and **crapps**, which runs the ACR task **build-forecast**. Neither registry uses ABAC repository permissions.

    The Dockerfile of build-forecast starts with `FROM crbase.azurecr.io/base/python:3.12`, and the runs fail with an authentication error when pulling the base image. No password, token or client secret may be stored in the task.

    What should you do?
  fr: |
    Northwind Traders dispose de deux registres de conteneurs Azure : **crbase**, qui contient les images de base approuvées, et **crapps**, qui exécute la tâche ACR **build-forecast**. Aucun des deux registres n'utilise les autorisations de dépôt ABAC.

    Le Dockerfile de build-forecast commence par `FROM crbase.azurecr.io/base/python:3.12`, et les exécutions échouent avec une erreur d'authentification lors du tirage de l'image de base. Aucun mot de passe, jeton ni secret client ne peut être stocké dans la tâche.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the admin user on crbase and add its user name and password to build-forecast with az acr task credential add.", fr: "Activer l'utilisateur administrateur sur crbase et ajouter son nom d'utilisateur et son mot de passe à build-forecast avec az acr task credential add." } }
    - { id: b, text: { en: "Assign the AcrPull role on crbase to the system-assigned managed identity of the crapps registry resource itself.", fr: "Attribuer le rôle AcrPull sur crbase à l'identité attribuée par le système de la ressource de registre crapps." } }
    - { id: c, text: { en: "Give build-forecast a managed identity with AcrPull on crbase, and add crbase with az acr task credential add --use-identity.", fr: "Donner à build-forecast une identité managée dotée d'AcrPull sur crbase, et ajouter crbase avec az acr task credential add --use-identity." } }
    - { id: d, text: { en: "Create a repository-scoped token on crbase and pass the token value to build-forecast with the --secret-arg parameter.", fr: "Créer un jeton limité à des dépôts sur crbase et transmettre sa valeur à build-forecast avec le paramètre --secret-arg." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A task authenticates to another registry with its own managed identity: enable a system-assigned or user-assigned identity on the task, grant it AcrPull on the source registry, then register the login server with az acr task credential add --use-identity ([system] or the client ID of a user-assigned identity). No secret is stored.
    fr: |
      Une tâche s'authentifie auprès d'un autre registre avec sa propre identité managée : activez une identité attribuée par le système ou par l'utilisateur sur la tâche, attribuez-lui AcrPull sur le registre source, puis enregistrez le serveur de connexion avec az acr task credential add --use-identity ([system] ou l'ID client d'une identité attribuée par l'utilisateur). Aucun secret n'est stocké.
  options:
    a: { en: "Admin user credentials are a stored password, which the requirement forbids.", fr: "Les informations d'identification de l'utilisateur administrateur sont un mot de passe stocké, ce que l'exigence interdit." }
    b: { en: "Task runs use the identity of the task, not an identity of the registry resource.", fr: "Les exécutions de tâche utilisent l'identité de la tâche, pas une identité de la ressource de registre." }
    d: { en: "A token passed as a secret argument is still a secret stored in the task.", fr: "Un jeton transmis comme argument secret reste un secret stocké dans la tâche." }
references:
  - title: Use an Azure-managed identity in ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-authentication-managed-identity
