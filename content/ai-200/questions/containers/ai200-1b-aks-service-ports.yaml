id: ai200-1b-aks-service-ports
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is writing the Kubernetes Service manifest for a chat front end that runs on Azure Kubernetes Service (AKS). The container of the front-end pods listens on port 8080. Other pods in the cluster must call the Service on port 80.

    How should you configure the `ports` section of the Service?
  fr: |
    Tailspin Toys rédige le manifeste du Service Kubernetes d'un front-end de conversation qui s'exécute sur Azure Kubernetes Service (AKS). Le conteneur des pods du front-end écoute sur le port 8080. Les autres pods du cluster doivent appeler le Service sur le port 80.

    Comment devez-vous configurer la section `ports` du Service ?
body:
  options:
    - { id: a, text: "port: 8080 and targetPort: 80" }
    - { id: b, text: "port: 80 and targetPort: 8080" }
    - { id: c, text: "port: 80 and nodePort: 8080" }
    - { id: d, text: "port: 80 only" }
answer: { optionId: b }
explanation:
  correct:
    en: "`port` is the port that clients use on the Service, and `targetPort` is the port of the container that receives the traffic. With `port: 80` and `targetPort: 8080`, calls to the Service on port 80 reach the containers on port 8080."
    fr: "`port` est le port que les clients utilisent sur le Service, et `targetPort` est le port du conteneur qui reçoit le trafic. Avec `port: 80` et `targetPort: 8080`, les appels au Service sur le port 80 atteignent les conteneurs sur le port 8080."
  options:
    a: { en: "The values are inverted: clients would have to call port 8080, and traffic would go to a port the container doesn't listen on.", fr: "Les valeurs sont inversées : les clients devraient appeler le port 8080, et le trafic irait vers un port sur lequel le conteneur n'écoute pas." }
    c: { en: "nodePort opens a port on each node for a NodePort or LoadBalancer Service; it doesn't set the container port.", fr: "nodePort ouvre un port sur chaque nœud pour un Service NodePort ou LoadBalancer ; il ne définit pas le port du conteneur." }
    d: { en: "Without targetPort, the traffic goes to the same port as port, here 80, where the container doesn't listen.", fr: "Sans targetPort, le trafic va vers le même port que port, ici 80, sur lequel le conteneur n'écoute pas." }
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
  - title: Concepts - Services in Azure Kubernetes Services (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-network-services
