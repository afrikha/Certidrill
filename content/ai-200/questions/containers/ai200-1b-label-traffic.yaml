id: ai200-1b-label-traffic
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a chat assistant named **ca-chat** in Azure Container Apps. The app uses single revision mode. The revision ca-chat--v7 has the label `stable`, and you have just deployed the revision ca-chat--v8 with a new prompt template.

    You need to:

    - give ca-chat--v8 the label `candidate`;
    - send 10 percent of the traffic to `candidate` and 90 percent to `stable`, by using weights that don't change when the labels later move to other revisions.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute un assistant conversationnel nommé **ca-chat** dans Azure Container Apps. L'application utilise le mode de révision unique. La révision ca-chat--v7 porte l'étiquette `stable`, et vous venez de déployer la révision ca-chat--v8 avec un nouveau modèle de prompt.

    Vous devez :

    - attribuer l'étiquette `candidate` à ca-chat--v8 ;
    - envoyer 10 % du trafic vers `candidate` et 90 % vers `stable`, avec des poids qui ne changent pas quand les étiquettes passent ensuite à d'autres révisions.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp revision [[cmd]] --name ca-chat --resource-group rg-chat --mode multiple

    az containerapp revision label [[lbl]] --name ca-chat --resource-group rg-chat \
      --label candidate --revision ca-chat--v8

    az containerapp ingress traffic set --name ca-chat --resource-group rg-chat \
      [[weight]] stable=90 candidate=10
  slots:
    - id: cmd
      options:
        - { id: setmode, text: set-mode }
        - { id: activate, text: activate }
        - { id: copy, text: copy }
        - { id: restart, text: restart }
    - id: lbl
      options:
        - { id: add, text: add }
        - { id: swap, text: swap }
        - { id: remove, text: remove }
    - id: weight
      options:
        - { id: labelw, text: "--label-weight" }
        - { id: revw, text: "--revision-weight" }
        - { id: suffix, text: "--revision-suffix" }
answer:
  values: { cmd: setmode, lbl: add, weight: labelw }
explanation:
  correct:
    en: "Traffic splitting requires multiple revision mode, which `az containerapp revision set-mode --mode multiple` sets. `az containerapp revision label add` assigns the candidate label to ca-chat--v8. `--label-weight` splits the traffic by label, so the weights stay valid when you later move a label to a newer revision."
    fr: "Le fractionnement du trafic exige le mode de révisions multiples, que définit `az containerapp revision set-mode --mode multiple`. `az containerapp revision label add` attribue l'étiquette candidate à ca-chat--v8. `--label-weight` répartit le trafic par étiquette : les poids restent valides quand vous déplacez ensuite une étiquette vers une révision plus récente."
  options:
    activate: { en: "activate reactivates an inactive revision and has no --mode parameter.", fr: "activate réactive une révision inactive et n'a pas de paramètre --mode." }
    copy: { en: "copy creates a new revision from a previous one; it doesn't change the revision mode.", fr: "copy crée une révision à partir d'une révision précédente ; il ne change pas le mode de révision." }
    restart: { en: "restart restarts the replicas of a revision.", fr: "restart redémarre les réplicas d'une révision." }
    swap: { en: "swap exchanges the labels of two revisions that already have labels; ca-chat--v8 has none yet.", fr: "swap échange les étiquettes de deux révisions qui en ont déjà ; ca-chat--v8 n'en a pas encore." }
    remove: { en: "remove deletes a label from a revision.", fr: "remove retire une étiquette d'une révision." }
    revw: { en: "Revision weights are tied to revision names, so they must be edited at every release.", fr: "Les poids de révision sont liés aux noms des révisions : il faut les modifier à chaque mise en production." }
    suffix: { en: "--revision-suffix names a new revision; it isn't a parameter of the traffic command.", fr: "--revision-suffix nomme une nouvelle révision ; ce n'est pas un paramètre de la commande de trafic." }
references:
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
  - title: az containerapp revision
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp/revision
