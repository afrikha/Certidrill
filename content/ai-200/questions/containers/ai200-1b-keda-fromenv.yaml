id: ai200-1b-keda-fromenv
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs an ingestion app named **ca-ingest** in Azure Container Apps. Its template contains two containers: `otel-collector`, listed first, and `ingest`, listed second. The environment variable `INGEST_QUEUE` is defined only in the `ingest` container.

    The custom scale rule of the app uses the metadata `queueNameFromEnv: INGEST_QUEUE`, but the scaler can't resolve the queue name, and the app doesn't scale.

    You need to fix the scale rule without hard-coding the queue name in the rule. What should you do?
  fr: |
    Litware exécute une application d'ingestion nommée **ca-ingest** dans Azure Container Apps. Son modèle contient deux conteneurs : `otel-collector`, listé en premier, et `ingest`, listé en second. La variable d'environnement `INGEST_QUEUE` n'est définie que dans le conteneur `ingest`.

    La règle de mise à l'échelle personnalisée de l'application utilise la métadonnée `queueNameFromEnv: INGEST_QUEUE`, mais le scaler ne parvient pas à résoudre le nom de la file d'attente, et l'application ne se met pas à l'échelle.

    Vous devez corriger la règle de mise à l'échelle sans coder en dur le nom de la file d'attente dans la règle. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store the queue name in an app secret and reference it in an `auth` entry of the rule.", fr: "Stocker le nom de la file d'attente dans un secret de l'application et le référencer dans une entrée `auth` de la règle." } }
    - { id: b, text: { en: "Set `minReplicas` to 1 so that the `ingest` container is always running.", fr: "Définir `minReplicas` sur 1 pour que le conteneur `ingest` s'exécute en permanence." } }
    - { id: c, text: { en: "Set `identity: system` on the scale rule.", fr: "Définir `identity: system` sur la règle de mise à l'échelle." } }
    - { id: d, text: { en: "Define `INGEST_QUEUE` in the first container listed in the template.", fr: "Définir `INGEST_QUEUE` dans le premier conteneur listé dans le modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: Scale rule metadata with the `FromEnv` suffix reads the value of an environment variable from the first container listed in the template. Here the first container is `otel-collector`, which doesn't define `INGEST_QUEUE`, so the variable must be available in that container.
    fr: "Les métadonnées de règle de mise à l'échelle avec le suffixe `FromEnv` lisent la valeur d'une variable d'environnement dans le premier conteneur listé dans le modèle. Ici, le premier conteneur est `otel-collector`, qui ne définit pas `INGEST_QUEUE` : la variable doit donc être disponible dans ce conteneur."
  options:
    a: { en: "`auth` entries pass secrets to trigger parameters such as a connection; they don't resolve `FromEnv` metadata.", fr: "Les entrées `auth` transmettent des secrets à des paramètres de déclencheur, comme une connexion ; elles ne résolvent pas les métadonnées `FromEnv`." }
    b: { en: "The scaler still reads the variable from the first container, whatever the number of replicas.", fr: "Le scaler lit toujours la variable dans le premier conteneur, quel que soit le nombre de réplicas." }
    c: { en: "A managed identity authenticates the scaler; it doesn't provide the queue name.", fr: "Une identité managée authentifie le scaler ; elle ne fournit pas le nom de la file d'attente." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
