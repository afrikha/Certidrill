id: ai200-1a-acr-import-cross-subscription
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam validates the image `rag/api:1.4.0` in the Azure container registry **crfabrikamdev**, in the subscription Dev. Validated images must be copied to the registry **crfabrikamprod** in the subscription Prod. Both subscriptions belong to the same Microsoft Entra tenant.

    Public network access is disabled on crfabrikamdev. Your identity already has the **Container Registry Data Importer and Data Reader** role on both registries. The copy must not use any password or client secret.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam valide l'image `rag/api:1.4.0` dans le registre de conteneurs Azure **crfabrikamdev**, de l'abonnement Dev. Les images validées doivent être copiées vers le registre **crfabrikamprod** de l'abonnement Prod. Les deux abonnements appartiennent au même locataire Microsoft Entra.

    L'accès au réseau public est désactivé sur crfabrikamdev. Votre identité dispose déjà du rôle **Container Registry Data Importer and Data Reader** sur les deux registres. La copie ne doit utiliser aucun mot de passe ni secret client.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr import --name crfabrikamprod \
      --source [[src]] \
      --image rag/api:1.4.0 \
      [[auth]]
  slots:
    - id: src
      options:
        - { id: short, text: "rag/api:1.4.0" }
        - { id: login, text: "crfabrikamdev.azurecr.io/rag/api:1.4.0" }
        - { id: hub, text: "docker.io/rag/api:1.4.0" }
    - id: auth
      options:
        - { id: regid, text: "--registry /subscriptions/<dev-subscription-id>/resourceGroups/rg-dev/providers/Microsoft.ContainerRegistry/registries/crfabrikamdev" }
        - { id: sp, text: "--username <sp-app-id> --password <sp-secret>" }
        - { id: force, text: "--force" }
answer:
  values: { src: short, auth: regid }
explanation:
  correct:
    en: |
      To import from a registry of another subscription in the same tenant, pass the source registry's resource ID with --registry and give --source as repository and tag only, without the login server. The import then runs with your Microsoft Entra identity, which holds the importer role on both registries, and it works even though the source has public access disabled.
    fr: |
      Pour importer depuis un registre d'un autre abonnement du même locataire, passez l'ID de ressource du registre source avec --registry et indiquez --source sous la forme dépôt et balise seulement, sans le serveur de connexion. L'importation s'exécute alors avec votre identité Microsoft Entra, qui détient le rôle d'importateur sur les deux registres, et elle fonctionne même si l'accès public est désactivé sur la source.
  options:
    login: { en: "With --registry, --source takes the repository and tag only, not the login server.", fr: "Avec --registry, --source prend uniquement le dépôt et la balise, pas le serveur de connexion." }
    hub: { en: "The image is in crfabrikamdev, not on Docker Hub.", fr: "L'image se trouve dans crfabrikamdev, pas sur Docker Hub." }
    sp: { en: "Service principal credentials are meant for another tenant and break the no-secret requirement.", fr: "Les informations d'identification d'un principal de service sont prévues pour un autre locataire et enfreignent l'exigence d'absence de secret." }
    force: { en: "--force only allows overwriting an existing tag in the target; it doesn't identify the source registry.", fr: "--force autorise seulement l'écrasement d'une balise existante dans la cible ; il n'identifie pas le registre source." }
references:
  - title: Import container images to a container registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-import-images
