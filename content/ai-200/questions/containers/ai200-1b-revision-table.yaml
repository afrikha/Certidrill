id: ai200-1b-revision-table
objective: "1.2.1"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs an image-captioning API named **ca-vision** in Azure Container Apps in multiple revision mode. The following table summarizes the revisions of ca-vision.

    Answer each prompt by selecting the appropriate revision.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une API de légendage d'images nommée **ca-vision** dans Azure Container Apps en mode de révisions multiples. Le tableau suivant résume les révisions de ca-vision.

    Répondez à chaque consigne en sélectionnant la révision appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A tester sends a request to the URL of the candidate label. Which revision processes it?", fr: "Un testeur envoie une requête à l'URL de l'étiquette candidate. Quelle révision la traite ?" }
    - id: p2
      text: { en: "Which revision can't run any replica until it is activated again?", fr: "Quelle révision ne peut exécuter aucun réplica tant qu'elle n'est pas réactivée ?" }
  grid:
    header: [{ en: Revision, fr: Révision }, { en: Active, fr: Active }, { en: Traffic weight, fr: Poids de trafic }, { en: Label, fr: Étiquette }]
    rows:
      - [{ text: ca-vision--v5, area: v5 }, { text: { en: "No", fr: "Non" } }, { text: "0 %" }, { text: "-" }]
      - [{ text: ca-vision--v6, area: v6 }, { text: { en: "Yes", fr: "Oui" } }, { text: "100 %" }, { text: stable }]
      - [{ text: ca-vision--v7, area: v7 }, { text: { en: "Yes", fr: "Oui" } }, { text: "0 %" }, { text: candidate }]
      - [{ text: ca-vision--v8, area: v8 }, { text: { en: "Yes", fr: "Oui" } }, { text: "0 %" }, { text: "-" }]
answer:
  values: { p1: v7, p2: v5 }
explanation:
  correct:
    en: "Traffic sent to a label URL always goes to the revision that holds the label, here ca-vision--v7, even though its traffic weight is 0 percent. ca-vision--v5 is inactive: it has no provisioning or running state and isn't billed until you activate it again, whereas the active revisions can run replicas even without traffic."
    fr: "Le trafic envoyé à l'URL d'une étiquette va toujours vers la révision qui porte l'étiquette, ici ca-vision--v7, même si son poids de trafic est de 0 %. ca-vision--v5 est inactive : elle n'a pas d'état d'approvisionnement ni d'exécution et n'est pas facturée tant que vous ne la réactivez pas, alors que les révisions actives peuvent exécuter des réplicas même sans trafic."
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
