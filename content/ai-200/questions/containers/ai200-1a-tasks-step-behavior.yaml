id: ai200-1a-tasks-step-behavior
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's developers build the images of a document-summarization service both with quick tasks (`az acr build`) and with multi-step task files in YAML format version `v1.1.0`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Fabrikam génèrent les images d'un service de synthèse de documents à la fois avec des tâches rapides (`az acr build`) et avec des fichiers de tâche multiétapes au format YAML version `v1.1.0`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In a task file, a step with `when: ["-"]` waits until all the previous steps of the file have completed.
        fr: |
          Dans un fichier de tâche, une étape dotée de `when: ["-"]` attend la fin de toutes les étapes précédentes du fichier.
    - id: s2
      text:
        en: |
          In a task file, steps without a `when` property run one after the other, in the order of the file.
        fr: |
          Dans un fichier de tâche, les étapes sans propriété `when` s'exécutent l'une après l'autre, dans l'ordre du fichier.
    - id: s3
      text:
        en: |
          When the build succeeds, `az acr build` pushes the image to the registry unless you add `--no-push`.
        fr: |
          Quand la génération réussit, `az acr build` envoie l'image au registre, sauf si vous ajoutez `--no-push`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      `when: ["-"]` removes every dependency: the step starts immediately and can run in parallel with others. Without `when`, each step depends on the completion of the previous step in the file, so the steps run sequentially. A quick task pushes the built image by default; `--no-push` (false by default) only builds it.
    fr: |
      `when: ["-"]` supprime toute dépendance : l'étape démarre immédiatement et peut s'exécuter en parallèle d'autres étapes. Sans `when`, chaque étape dépend de la fin de l'étape précédente du fichier : les étapes s'exécutent de façon séquentielle. Une tâche rapide envoie l'image générée par défaut ; `--no-push` (false par défaut) se contente de la générer.
references:
  - title: "ACR Tasks reference: YAML"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-reference-yaml
  - title: az acr
    url: https://learn.microsoft.com/en-us/cli/azure/acr?view=azure-cli-latest
