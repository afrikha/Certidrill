id: ai200-1a-app-kv-reference-syntax
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys' product-search API runs as a custom container in Azure App Service and reads its Azure OpenAI key from the environment variable `AOAI_KEY`. The key is stored as the secret `aoai-key` in the key vault **kv-wingtip**, and the app's managed identity can read it.

    The app must always use the latest version of the secret after each rotation.

    Which two values can you assign to the app setting `AOAI_KEY`? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API de recherche de produits de Wingtip Toys s'exécute sous forme de conteneur personnalisé dans Azure App Service et lit sa clé Azure OpenAI dans la variable d'environnement `AOAI_KEY`. La clé est stockée sous le nom de secret `aoai-key` dans le coffre de clés **kv-wingtip**, et l'identité managée de l'application peut la lire.

    L'application doit toujours utiliser la dernière version du secret après chaque renouvellement.

    Quelles sont les deux valeurs que vous pouvez attribuer au paramètre d'application `AOAI_KEY` ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "@Microsoft.KeyVault(SecretUri=https://kv-wingtip.vault.azure.net/secrets/aoai-key)" }
    - { id: b, text: "@Microsoft.KeyVault(VaultName=kv-wingtip;SecretName=aoai-key;SecretVersion=4f1c7e0d9a2b4c6e8f0a1b3c5d7e9f21)" }
    - { id: c, text: "@Microsoft.KeyVault(VaultName=kv-wingtip;SecretName=aoai-key)" }
    - { id: d, text: "@Microsoft.KeyVault(SecretUri=https://kv-wingtip.vault.azure.net/keys/aoai-key)" }
    - { id: e, text: "@Microsoft.KeyVault(kv-wingtip/aoai-key)" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A Key Vault reference has the form `@Microsoft.KeyVault(...)` with either `SecretUri=<secret URI>` or `VaultName=<vault>;SecretName=<secret>`. Without a version, the reference follows the latest version of the secret; App Service refetches it within 24 hours or at the next configuration change.
    fr: |
      Une référence Key Vault a la forme `@Microsoft.KeyVault(...)` avec soit `SecretUri=<URI du secret>`, soit `VaultName=<coffre>;SecretName=<secret>`. Sans version, la référence suit la dernière version du secret ; App Service la récupère de nouveau sous 24 heures ou à la prochaine modification de la configuration.
  options:
    b: { en: "SecretVersion pins one version, so the app wouldn't follow rotations.", fr: "SecretVersion épingle une version : l'application ne suivrait pas les renouvellements." }
    d: { en: "The URI points to a Key Vault key (/keys/), not to a secret.", fr: "L'URI pointe vers une clé Key Vault (/keys/), pas vers un secret." }
    e: { en: "This isn't a recognized reference format, so the string would be passed as is.", fr: "Ce format de référence n'est pas reconnu : la chaîne serait transmise telle quelle." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
