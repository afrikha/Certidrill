id: ai200-1b-keda-behavior-yesno
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an enrichment worker named **ca-enrich** in Azure Container Apps with the default scale behavior. The app has two custom scale rules: one on the Service Bus queue `enrich-requests` and one on the Event Hubs hub `clickstream`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un worker d'enrichissement nommé **ca-enrich** dans Azure Container Apps avec le comportement de mise à l'échelle par défaut. L'application possède deux règles de mise à l'échelle personnalisées : une sur la file d'attente Service Bus `enrich-requests` et une sur le hub Event Hubs `clickstream`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: ca-enrich starts adding replicas as soon as the condition of either rule is met.
        fr: ca-enrich commence à ajouter des réplicas dès que la condition de l'une des deux règles est remplie.
    - id: s2
      text:
        en: When the backlog drops below the target, the extra replicas of ca-enrich are removed at the next polling interval.
        fr: Quand le backlog descend sous la cible, les réplicas supplémentaires de ca-enrich sont supprimés au prochain intervalle d'interrogation.
    - id: s3
      text:
        en: The scaler checks the queue and the event hub every 30 seconds.
        fr: Le scaler vérifie la file d'attente et le hub d'événements toutes les 30 secondes.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: When an app has several rules, scaling begins as soon as the first condition of any rule is met. Scale-in waits for a 300-second scale-down stabilization window, whereas scale-out has no stabilization window. The default polling interval of custom rules is 30 seconds.
    fr: Quand une application possède plusieurs règles, la mise à l'échelle commence dès que la première condition de l'une des règles est remplie. Le scale-in attend une fenêtre de stabilisation de 300 secondes, alors que le scale-out n'a pas de fenêtre de stabilisation. L'intervalle d'interrogation par défaut des règles personnalisées est de 30 secondes.
  options:
    s2:
      en: Replicas are removed only after the condition has held for the 300-second scale-down stabilization window.
      fr: Les réplicas ne sont supprimés qu'une fois la condition maintenue pendant la fenêtre de stabilisation de 300 secondes du scale-in.
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
