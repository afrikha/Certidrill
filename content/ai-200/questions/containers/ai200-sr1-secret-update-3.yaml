id: ai200-sr1-secret-update-3
objective: "1.2.1"
type: series_yesno
series: ai200-sr1-secret-update
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You update the secret value and set the environment variable again.
  fr: Vous mettez à jour la valeur du secret et redéfinissez la variable d'environnement.
body:
  solution:
    en: |
      You run the following commands:

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`

      `az containerapp update -n ca-summarizer -g rg-fabrikam --set-env-vars TRANSLATOR_KEY=secretref:translator-key`
    fr: |
      Vous exécutez les commandes suivantes :

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`

      `az containerapp update -n ca-summarizer -g rg-fabrikam --set-env-vars TRANSLATOR_KEY=secretref:translator-key`
answer: { value: false }
explanation:
  correct:
    en: Environment variables belong to the container definition in the `properties.template` section, so `az containerapp update --set-env-vars` is a revision-scope change. The replicas would use the new key, but only because the command deploys a new revision, which the change control policy prohibits.
    fr: "Les variables d'environnement font partie de la définition du conteneur dans la section `properties.template` : `az containerapp update --set-env-vars` est donc une modification de l'étendue révision. Les réplicas utiliseraient la nouvelle clé, mais uniquement parce que la commande déploie une nouvelle révision, ce que la stratégie de gestion des modifications interdit."
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
