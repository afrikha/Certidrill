id: ai200-1a-acr-push-role
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses a self-hosted build agent that runs on an Azure virtual machine with a system-assigned managed identity. The agent builds the image of a summarization API with `docker build` and pushes it to the Azure container registry **crnorthwind**.

    The registry uses the **RBAC Registry Permissions** role assignment mode. The identity must push and pull images, and nothing else (principle of least privilege).

    Which role should you assign to the identity on crnorthwind?
  fr: |
    Northwind Traders utilise un agent de build auto-hébergé qui s'exécute sur une machine virtuelle Azure dotée d'une identité managée attribuée par le système. L'agent génère l'image d'une API de synthèse avec `docker build` et l'envoie au registre de conteneurs Azure **crnorthwind**.

    Le registre utilise le mode d'attribution de rôles **RBAC Registry Permissions**. L'identité doit envoyer et tirer des images, et rien d'autre (principe du moindre privilège).

    Quel rôle devez-vous attribuer à l'identité sur crnorthwind ?
body:
  options:
    - { id: a, text: AcrPush }
    - { id: b, text: AcrPull }
    - { id: c, text: Container Registry Tasks Contributor }
    - { id: d, text: Contributor }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AcrPush grants push and pull on the registry's images and nothing on the control plane, which is exactly what a build agent that runs docker push needs.
    fr: |
      AcrPush accorde l'envoi et le tirage des images du registre, sans aucune autorisation sur le plan de contrôle : c'est exactement ce dont a besoin un agent de build qui exécute docker push.
  options:
    b: { en: "AcrPull only allows pulling images; the push would be denied.", fr: "AcrPull permet seulement de tirer des images ; l'envoi serait refusé." }
    c: { en: "Container Registry Tasks Contributor manages ACR Tasks and quick builds, with no data-plane push or pull.", fr: "Container Registry Tasks Contributor gère ACR Tasks et les générations rapides, sans envoi ni tirage sur le plan de données." }
    d: { en: "Contributor manages the registry resource itself, which is far more than required.", fr: "Contributor gère la ressource du registre elle-même, ce qui dépasse largement le besoin." }
references:
  - title: Authenticate with Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
  - title: Azure Container Registry Microsoft Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
