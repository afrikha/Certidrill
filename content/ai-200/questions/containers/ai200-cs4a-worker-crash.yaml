id: ai200-cs4a-worker-crash
objective: "1.2.4"
type: single
caseStudy: ai200-cs4a-woodgrove
difficulty: 1
status: draft
stem:
  en: |
    After an update, the fraud-worker pod named fraud-worker-6c9d7-k2xpt is in the `CrashLoopBackOff` state. Its container exits about 30 seconds after each start. When you run `kubectl logs fraud-worker-6c9d7-k2xpt -n complaints`, you see only the startup messages of the container that has just restarted.

    You need to read the Python exception that made the container exit. Which command should you run?
  fr: |
    Après une mise à jour, le pod fraud-worker nommé fraud-worker-6c9d7-k2xpt est à l'état `CrashLoopBackOff`. Son conteneur s'arrête environ 30 secondes après chaque démarrage. Quand vous exécutez `kubectl logs fraud-worker-6c9d7-k2xpt -n complaints`, vous ne voyez que les messages de démarrage du conteneur qui vient de redémarrer.

    Vous devez lire l'exception Python qui a provoqué l'arrêt du conteneur. Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "kubectl describe pod fraud-worker-6c9d7-k2xpt -n complaints" }
    - { id: b, text: "kubectl get events -n complaints --field-selector involvedObject.name=fraud-worker-6c9d7-k2xpt" }
    - { id: c, text: "kubectl logs fraud-worker-6c9d7-k2xpt -n complaints --previous" }
    - { id: d, text: "kubectl get pod fraud-worker-6c9d7-k2xpt -n complaints --output=yaml" }
answer: { optionId: c }
explanation:
  correct:
    en: "`kubectl logs --previous` returns the standard output of the previous instance of the container, the one that crashed. Because fraud-worker writes its errors only to standard output, that log contains the Python exception, while the plain `kubectl logs` command shows only the instance that has just restarted."
    fr: "`kubectl logs --previous` renvoie la sortie standard de l'instance précédente du conteneur, celle qui a planté. Comme fraud-worker écrit ses erreurs uniquement sur la sortie standard, ce journal contient l'exception Python, alors que la commande `kubectl logs` simple n'affiche que l'instance qui vient de redémarrer."
  options:
    a: { en: "`kubectl describe pod` shows the container state, the last exit code, the restart count and the events, but not the output of the application.", fr: "`kubectl describe pod` affiche l'état du conteneur, le dernier code de sortie, le nombre de redémarrages et les événements, mais pas la sortie de l'application." }
    b: { en: "The events report the back-off restarts of the container; they don't contain what the application wrote.", fr: "Les événements signalent les redémarrages avec interruption du conteneur ; ils ne contiennent pas ce que l'application a écrit." }
    d: { en: "The pod YAML shows the termination message, which the container writes to its termination log file; fraud-worker writes its errors only to standard output.", fr: "Le YAML du pod affiche le message d'arrêt, que le conteneur écrit dans son fichier journal d'arrêt ; fraud-worker écrit ses erreurs uniquement sur la sortie standard." }
references:
  - title: Pod is stuck in CrashLoopBackOff mode
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/pod-stuck-crashloopbackoff-mode
