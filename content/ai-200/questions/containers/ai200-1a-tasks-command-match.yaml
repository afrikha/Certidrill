id: ai200-1a-tasks-command-match
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware's AI team uses the Azure container registry **crlitware** and ACR Tasks for all its image builds. No team member has a Docker engine.

    Which command should the team use for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'IA de Litware utilise le registre de conteneurs Azure **crlitware** et ACR Tasks pour toutes ses générations d'images. Aucun membre de l'équipe ne dispose d'un moteur Docker.

    Quelle commande l'équipe doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: build, text: az acr build }
    - { id: run, text: az acr run }
    - { id: create, text: az acr task create }
    - { id: taskrun, text: az acr task run }
    - { id: import, text: az acr import }
  targets:
    - { id: t1, text: { en: "Build an image from a local folder once and push it", fr: "Générer une fois une image à partir d'un dossier local et l'envoyer" } }
    - { id: t2, text: { en: "Execute a multi-step YAML task file once, without saving a task", fr: "Exécuter une fois un fichier de tâche YAML multiétape, sans enregistrer de tâche" } }
    - { id: t3, text: { en: "Rebuild the image automatically on every commit to a GitHub repository", fr: "Régénérer automatiquement l'image à chaque commit dans un dépôt GitHub" } }
    - { id: t4, text: { en: "Start an existing task manually to test it", fr: "Démarrer manuellement une tâche existante pour la tester" } }
answer:
  mapping: { t1: build, t2: run, t3: create, t4: taskrun }
explanation:
  correct:
    en: |
      Quick tasks run on demand: az acr build builds and pushes one image, az acr run runs a command or a YAML task file. az acr task create saves a task with triggers (source commit, base image update, timer), and az acr task run starts an existing task manually.
    fr: |
      Les tâches rapides s'exécutent à la demande : az acr build génère et envoie une image, az acr run exécute une commande ou un fichier de tâche YAML. az acr task create enregistre une tâche avec des déclencheurs (commit de code source, mise à jour de l'image de base, minuteur), et az acr task run démarre manuellement une tâche existante.
  options:
    import: { en: "az acr import copies existing images from another registry; it builds nothing.", fr: "az acr import copie des images existantes depuis un autre registre ; il ne génère rien." }
references:
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
  - title: az acr task
    url: https://learn.microsoft.com/en-us/cli/azure/acr/task?view=azure-cli-latest
