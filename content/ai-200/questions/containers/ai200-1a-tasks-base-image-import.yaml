id: ai200-1a-tasks-base-image-import
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso builds its RAG API with an ACR task named **build-rag** in the Azure container registry **crcontoso**. The Dockerfile starts with `FROM python:3.12-slim`, an image from Docker Hub. The base image update trigger is enabled, and the task has already run several times.

    The security team requires that a rebuild starts within a few minutes of each update of the base image, and that the builds no longer depend on the availability of Docker Hub.

    What should you do?
  fr: |
    Contoso génère son API RAG avec une tâche ACR nommée **build-rag** dans le registre de conteneurs Azure **crcontoso**. Le Dockerfile commence par `FROM python:3.12-slim`, une image de Docker Hub. Le déclencheur de mise à jour de l'image de base est activé et la tâche s'est déjà exécutée plusieurs fois.

    L'équipe de sécurité exige qu'une régénération démarre dans les quelques minutes qui suivent chaque mise à jour de l'image de base, et que les builds ne dépendent plus de la disponibilité de Docker Hub.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Import the base image into crcontoso with az acr import and change the FROM instruction to reference the copy in crcontoso.", fr: "Importer l'image de base dans crcontoso avec az acr import et modifier l'instruction FROM pour référencer la copie dans crcontoso." } }
    - { id: b, text: { en: "Add a timer trigger with the schedule */5 * * * * to build-rag and keep the FROM instruction unchanged.", fr: "Ajouter à build-rag un déclencheur de minuteur de planification */5 * * * * et conserver l'instruction FROM." } }
    - { id: c, text: { en: "Change the FROM instruction to reference the base image by its manifest digest on Docker Hub.", fr: "Modifier l'instruction FROM pour référencer l'image de base par la synthèse (digest) de son manifeste sur Docker Hub." } }
    - { id: d, text: { en: "Enable the pull request trigger of build-rag and keep the FROM instruction unchanged.", fr: "Activer le déclencheur de demande de tirage (pull request) de build-rag et conserver l'instruction FROM." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ACR Tasks checks public base images such as Docker Hub at a random interval of 10 to 60 minutes, but it triggers a dependent run immediately when a base image is updated in an Azure container registry. Microsoft recommends importing public base images into your own registry and building from that copy, which also removes the dependency on Docker Hub during builds.
    fr: |
      ACR Tasks vérifie les images de base publiques, comme celles de Docker Hub, à un intervalle aléatoire de 10 à 60 minutes, mais déclenche immédiatement une exécution dépendante quand une image de base est mise à jour dans un registre de conteneurs Azure. Microsoft recommande d'importer les images de base publiques dans votre propre registre et de générer à partir de cette copie, ce qui supprime aussi la dépendance à Docker Hub pendant les builds.
  options:
    b: { en: "A five-minute timer rebuilds constantly even without any base image change, and every build still pulls from Docker Hub.", fr: "Un minuteur de cinq minutes régénère en permanence, même sans modification de l'image de base, et chaque build tire toujours depuis Docker Hub." }
    c: { en: "A digest never changes, so base image updates would no longer be tracked, and the image still comes from Docker Hub.", fr: "Une synthèse ne change jamais : les mises à jour de l'image de base ne seraient plus suivies, et l'image proviendrait toujours de Docker Hub." }
    d: { en: "The pull request trigger reacts to pull requests in the source repository, not to base image updates.", fr: "Le déclencheur de demande de tirage réagit aux demandes de tirage du dépôt source, pas aux mises à jour de l'image de base." }
references:
  - title: About base image updates for ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-base-images
