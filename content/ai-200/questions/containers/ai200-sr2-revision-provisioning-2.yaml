id: ai200-sr2-revision-provisioning-2
objective: "1.2.4"
type: series_yesno
series: ai200-sr2-revision-provisioning
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You query the system logs table in log-tailspin.
  fr: Vous interrogez la table des journaux système dans log-tailspin.
body:
  solution:
    en: |
      You run the following query in log-tailspin.

      ```kusto
      ContainerAppSystemLogs_CL
      | where ContainerAppName_s == "ca-tailspin-rank"
      | where RevisionName_s == "ca-tailspin-rank--v4"
      | project TimeGenerated, RevisionName_s, Log_s
      | order by TimeGenerated desc
      ```
    fr: |
      Vous exécutez la requête suivante dans log-tailspin.

      ```kusto
      ContainerAppSystemLogs_CL
      | where ContainerAppName_s == "ca-tailspin-rank"
      | where RevisionName_s == "ca-tailspin-rank--v4"
      | project TimeGenerated, RevisionName_s, Log_s
      | order by TimeGenerated desc
      ```
answer: { value: true }
explanation:
  correct:
    en: When the environment sends its logs to Log Analytics, the messages generated by the Container Apps service, including revision provisioning errors such as ErrImagePull, are stored in ContainerAppSystemLogs_CL. Filtering on the app and revision names returns the error of ca-tailspin-rank--v4 in the Log_s column.
    fr: "Quand l'environnement envoie ses journaux à Log Analytics, les messages générés par le service Container Apps, y compris les erreurs d'approvisionnement de révision telles qu'ErrImagePull, sont stockés dans ContainerAppSystemLogs_CL. Le filtre sur les noms de l'application et de la révision renvoie l'erreur de ca-tailspin-rank--v4 dans la colonne Log_s."
references:
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
