id: ai200-1b-config-scope
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is writing the YAML definitions of its Azure Container Apps resources for a retrieval-augmented generation solution.

    Where should each setting be defined? To answer, drag the appropriate locations to the correct settings. Each location may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige les définitions YAML de ses ressources Azure Container Apps pour une solution de génération augmentée de récupération.

    Où chaque paramètre doit-il être défini ? Pour répondre, faites glisser les emplacements appropriés vers les paramètres correspondants. Chaque emplacement peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: env, text: { en: "Container Apps environment", fr: "Environnement Container Apps" } }
    - { id: config, text: { en: "App configuration (`properties.configuration`)", fr: "Configuration de l'application (`properties.configuration`)" } }
    - { id: template, text: { en: "Revision template (`properties.template`)", fr: "Modèle de révision (`properties.template`)" } }
    - { id: replica, text: { en: "Replica", fr: "Réplica" } }
  targets:
    - { id: logs, text: { en: "Log Analytics workspace that receives the logs of all the apps", fr: "Espace de travail Log Analytics qui reçoit les journaux de toutes les applications" } }
    - { id: traffic, text: { en: "Traffic weights between revisions", fr: "Poids de trafic entre les révisions" } }
    - { id: image, text: { en: "Container image and CPU and memory allocation", fr: "Image conteneur et allocation de processeur et de mémoire" } }
    - { id: registry, text: { en: "Credentials of a private container registry", fr: "Informations d'identification d'un registre de conteneurs privé" } }
answer:
  mapping: { logs: env, traffic: config, image: template, registry: config }
explanation:
  correct:
    en: The Log Analytics destination is an environment property shared by all the apps of the environment. Ingress settings such as traffic weights and the registry credentials belong to `properties.configuration`, which applies to every revision. Containers, images and resources belong to `properties.template`, and changing them creates a new revision. A replica is a running instance of a revision and holds no configuration.
    fr: "La destination Log Analytics est une propriété de l'environnement partagée par toutes ses applications. Les paramètres d'entrée, comme les poids de trafic, et les informations d'identification du registre appartiennent à `properties.configuration`, qui s'applique à toutes les révisions. Les conteneurs, les images et les ressources appartiennent à `properties.template`, et les modifier crée une nouvelle révision. Un réplica est une instance en cours d'exécution d'une révision et ne contient aucune configuration."
references:
  - title: Azure Container Apps ARM and YAML template specifications
    url: https://learn.microsoft.com/en-us/azure/container-apps/azure-resource-manager-api-spec
  - title: Azure Container Apps environments
    url: https://learn.microsoft.com/en-us/azure/container-apps/environment
