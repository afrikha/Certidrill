id: ai200-1c-aca-errimagepull-causes
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin hosts a Python grading API in Azure Container Apps. The environment is integrated with a virtual network that uses custom DNS servers, and a user-defined route sends all outbound traffic of the environment's subnet through Azure Firewall. The app pulls its image from a private Azure Container Registry by using a managed identity that has the AcrPull role on the registry.

    A developer deploys a new revision with an image tag that exists in the registry. The system logs of the app show `Error provisioning revision ca-grader--r12. ErrorCode: ErrImagePull`.

    Which two issues could cause this error?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin héberge une API Python de notation dans Azure Container Apps. L'environnement est intégré à un réseau virtuel qui utilise des serveurs DNS personnalisés, et un itinéraire défini par l'utilisateur envoie tout le trafic sortant du sous-réseau de l'environnement vers le Pare-feu Azure. L'application tire son image d'un registre Azure Container Registry privé à l'aide d'une identité managée qui dispose du rôle AcrPull sur le registre.

    Un développeur déploie une nouvelle révision avec une balise d'image qui existe dans le registre. Les journaux système de l'application affichent `Error provisioning revision ca-grader--r12. ErrorCode: ErrImagePull`.

    Quels sont les deux problèmes qui pourraient provoquer cette erreur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The TCP readiness probe of the container uses a port other than the ingress target port.", fr: "La sonde de disponibilité TCP du conteneur utilise un port différent du port cible de l'entrée." } }
    - { id: b, text: { en: "The custom DNS servers do not forward unresolved queries to 168.63.129.16.", fr: "Les serveurs DNS personnalisés ne transfèrent pas les requêtes non résolues vers 168.63.129.16." } }
    - { id: c, text: { en: "The ingress of the app is limited to the Container Apps environment.", fr: "L'entrée de l'application est limitée à l'environnement Container Apps." } }
    - { id: d, text: { en: "Azure Firewall has no rule that allows outbound traffic to the registry.", fr: "Le Pare-feu Azure n'a aucune règle qui autorise le trafic sortant vers le registre." } }
    - { id: e, text: { en: "The minimum replica count of the new revision is 0.", fr: "Le nombre minimal de réplicas de la nouvelle révision est de 0." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      ErrImagePull means that the replicas could not download the image. With a custom DNS server that does not forward to the Azure resolver at 168.63.129.16, the registry name may not resolve; with outbound traffic forced through a firewall that does not allow the registry, the pull is blocked. Microsoft's troubleshooting steps for image pull failures check exactly these two points.
    fr: |
      ErrImagePull signifie que les réplicas n'ont pas pu télécharger l'image. Avec un serveur DNS personnalisé qui ne transfère pas vers le résolveur Azure 168.63.129.16, le nom du registre peut ne pas être résolu ; avec un trafic sortant forcé vers un pare-feu qui n'autorise pas le registre, le tirage est bloqué. Les étapes de dépannage de Microsoft pour les échecs de tirage d'image vérifient précisément ces deux points.
  options:
    a:
      en: |
        A probe on the wrong port leaves the revision Degraded with no ready replica, after the image has been pulled; it does not produce ErrImagePull.
      fr: |
        Une sonde sur le mauvais port laisse la révision Degraded sans réplica prêt, une fois l'image tirée ; elle ne produit pas ErrImagePull.
    c:
      en: |
        Internal ingress only decides who can call the app; it has no effect on how the image is pulled.
      fr: |
        Une entrée interne décide seulement qui peut appeler l'application ; elle n'a aucun effet sur le tirage de l'image.
    e:
      en: |
        Scaling to zero means no replica runs until a scale rule fires; it does not make an image pull fail.
      fr: |
        La mise à l'échelle à zéro signifie qu'aucun réplica ne s'exécute tant qu'une règle de mise à l'échelle ne se déclenche pas ; elle ne fait pas échouer un tirage d'image.
references:
  - title: Troubleshoot a container app
    url: https://learn.microsoft.com/en-us/azure/container-apps/troubleshooting
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
