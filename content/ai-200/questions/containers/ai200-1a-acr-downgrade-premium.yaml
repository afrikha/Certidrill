id: ai200-1a-acr-downgrade-premium
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Premium tier Azure container registry named **crwoodgrove** in West Europe. The registry stores 300 GiB of images for an AI scoring service and has a geo-replication in North Europe that is no longer needed.

    To reduce costs, you run `az acr update --name crwoodgrove --sku Standard`, and the command fails.

    What should you do first so that the tier change succeeds?
  fr: |
    Woodgrove Bank dispose d'un registre de conteneurs Azure de niveau Premium nommé **crwoodgrove** en West Europe. Le registre stocke 300 Gio d'images pour un service de notation par IA et possède une géoréplication en North Europe qui n'est plus nécessaire.

    Pour réduire les coûts, vous exécutez `az acr update --name crwoodgrove --sku Standard`, et la commande échoue.

    Que devez-vous faire en premier pour que le changement de niveau réussisse ?
body:
  options:
    - { id: a, text: { en: "Disable zone redundancy on the registry.", fr: "Désactiver la redondance de zone du registre." } }
    - { id: b, text: { en: "Delete images until the registry stores less than 100 GiB.", fr: "Supprimer des images jusqu'à ce que le registre stocke moins de 100 Gio." } }
    - { id: c, text: { en: "Create a Standard registry and import all the images into it.", fr: "Créer un registre Standard et y importer toutes les images." } }
    - { id: d, text: { en: "Delete the North Europe geo-replication.", fr: "Supprimer la géoréplication North Europe." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      You can move between tiers without downtime, but before going from Premium to Standard or Basic you must delete the geo-replications and connected registries, because these features exist only in Premium.
    fr: |
      Vous pouvez changer de niveau sans interruption, mais avant de passer de Premium à Standard ou Basic, vous devez supprimer les géoréplications et les registres connectés, car ces fonctionnalités n'existent qu'en Premium.
  options:
    a: { en: "Zone redundancy is supported by every tier and doesn't block a tier change.", fr: "La redondance de zone est prise en charge par tous les niveaux et ne bloque pas un changement de niveau." }
    b: { en: "100 GiB is the storage included in Standard, not its limit; storage beyond it is billed per GiB.", fr: "100 Gio est le stockage inclus dans Standard, pas sa limite ; le stockage au-delà est facturé au Gio." }
    c: { en: "A new registry isn't needed: the tier of the existing registry can be changed in place.", fr: "Un nouveau registre n'est pas nécessaire : le niveau du registre existant peut être modifié sur place." }
references:
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
