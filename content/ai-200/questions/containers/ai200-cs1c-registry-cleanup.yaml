id: ai200-cs1c-registry-cleanup
objective: "1.1.2"
type: single
caseStudy: ai200-cs1c-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the registry cleanup requirement. Which command should you run?
  fr: |
    Vous devez satisfaire l'exigence relative au nettoyage du registre. Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az acr run --registry crlitware --cmd \"acr purge --filter 'field-assistant:.*' --ago 30d --keep 10 --untagged\" /dev/null" }
    - { id: b, text: "az acr task create --name purge-assist --registry crlitware --cmd \"acr purge --filter 'field-assistant:.*' --ago 10d --keep 30 --untagged\" --schedule \"0 2 * * 0\" --context /dev/null" }
    - { id: c, text: "az acr task create --name purge-assist --registry crlitware --cmd \"acr purge --filter 'field-assistant:.*' --ago 30d --keep 10 --untagged\" --schedule \"0 2 * * 0\" --context /dev/null" }
    - { id: d, text: "az acr task create --name purge-assist --registry crlitware --cmd \"acr purge --filter 'field-assistant:.*' --ago 30d --keep 10 --untagged --include-locked\" --schedule \"0 2 * * 0\" --context /dev/null" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `az acr task create` with `--schedule` creates a task that runs the `acr purge` command on a cron schedule; `--context /dev/null` is used because the task builds nothing. `--ago 30d` selects the tags older than 30 days, `--keep 10` retains the 10 most recent of them, and `--untagged` also deletes the manifests that have no tag. By default, `acr purge` does not delete a tag whose `write-enabled` attribute is `false`.
    fr: |
      `az acr task create` avec `--schedule` crée une tâche qui exécute la commande `acr purge` selon une planification cron ; `--context /dev/null` est utilisé car la tâche ne génère rien. `--ago 30d` sélectionne les balises de plus de 30 jours, `--keep 10` conserve les 10 plus récentes d'entre elles et `--untagged` supprime aussi les manifestes sans balise. Par défaut, `acr purge` ne supprime pas une balise dont l'attribut `write-enabled` est `false`.
  options:
    a:
      en: "`az acr run` runs the purge once, on demand; it does not create a weekly schedule."
      fr: "`az acr run` exécute la suppression une seule fois, à la demande ; il ne crée pas de planification hebdomadaire."
    b:
      en: "The values are swapped: this command deletes the tags older than 10 days and keeps 30 of them."
      fr: "Les valeurs sont inversées : cette commande supprime les balises de plus de 10 jours et en conserve 30."
    d:
      en: "`--include-locked` unlocks the matching tags before deleting them, so the locked production tags would be deleted."
      fr: "`--include-locked` déverrouille les balises correspondantes avant de les supprimer : les balises de production verrouillées seraient supprimées."
references:
  - title: Automatically purge images from an Azure container registry (preview)
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-auto-purge
