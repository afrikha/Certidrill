id: ai200-1a-acr-delete-semantics
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    The Azure container registry **crcontoso** contains the following images:

    - `rag/api:1.4.0` and `rag/api:stable`, two tags that point to the same manifest;
    - `rag/worker:2.0`, which shares its base layers with `rag/api:1.4.0`.

    No image is locked.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le registre de conteneurs Azure **crcontoso** contient les images suivantes :

    - `rag/api:1.4.0` et `rag/api:stable`, deux balises qui pointent vers le même manifeste ;
    - `rag/worker:2.0`, qui partage ses couches de base avec `rag/api:1.4.0`.

    Aucune image n'est verrouillée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Running `az acr repository delete --name crcontoso --image rag/api:1.4.0` also removes the tag `rag/api:stable`.
        fr: |
          L'exécution de `az acr repository delete --name crcontoso --image rag/api:1.4.0` supprime aussi la balise `rag/api:stable`.
    - id: s2
      text:
        en: |
          Running `az acr repository untag --name crcontoso --image rag/api:1.4.0` reduces the storage used by the registry.
        fr: |
          L'exécution de `az acr repository untag --name crcontoso --image rag/api:1.4.0` réduit le stockage utilisé par le registre.
    - id: s3
      text:
        en: |
          After `rag/api:1.4.0` is deleted, the base layers it shares with `rag/worker:2.0` remain in the registry.
        fr: |
          Après la suppression de `rag/api:1.4.0`, les couches de base partagées avec `rag/worker:2.0` restent dans le registre.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Deleting by tag deletes the manifest, so every other tag on that manifest disappears too. Untagging only removes the tag reference and frees no space. Layers are deleted only when no other image in the registry references them, so the layers shared with rag/worker:2.0 stay.
    fr: |
      La suppression par balise supprime le manifeste : toutes les autres balises de ce manifeste disparaissent aussi. Retirer une balise ne supprime que la référence et ne libère aucun espace. Les couches ne sont supprimées que si aucune autre image du registre ne les référence : celles partagées avec rag/worker:2.0 restent.
references:
  - title: Delete container images in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-delete
