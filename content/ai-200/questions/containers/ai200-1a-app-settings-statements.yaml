id: ai200-1a-app-settings-statements
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a Python translation API as a Linux custom container in the App Service app **app-lit-translate**, with an OpenTelemetry Collector sidecar. The app pulls its image from a private registry by using the `DOCKER_REGISTRY_SERVER_URL`, `DOCKER_REGISTRY_SERVER_USERNAME` and `DOCKER_REGISTRY_SERVER_PASSWORD` settings, and the container listens on port 8000, set with `WEBSITES_PORT`.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute une API de traduction Python sous forme de conteneur personnalisé Linux dans l'application App Service **app-lit-translate**, avec un sidecar de collecteur OpenTelemetry. L'application tire son image d'un registre privé à l'aide des paramètres `DOCKER_REGISTRY_SERVER_URL`, `DOCKER_REGISTRY_SERVER_USERNAME` et `DOCKER_REGISTRY_SERVER_PASSWORD`, et le conteneur écoute sur le port 8000, défini avec `WEBSITES_PORT`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Python code can read an app setting named TRANSLATOR_REGION with os.environ[\"TRANSLATOR_REGION\"].", fr: "Le code Python peut lire un paramètre d'application nommé TRANSLATOR_REGION avec os.environ[\"TRANSLATOR_REGION\"]." } }
    - { id: b, text: { en: "The Python code can read the registry password from the DOCKER_REGISTRY_SERVER_PASSWORD environment variable.", fr: "Le code Python peut lire le mot de passe du registre dans la variable d'environnement DOCKER_REGISTRY_SERVER_PASSWORD." } }
    - { id: c, text: { en: "Updating an app setting recycles the app.", fr: "La mise à jour d'un paramètre d'application recycle l'application." } }
    - { id: d, text: { en: "The container receives WEBSITES_PORT as an environment variable.", fr: "Le conteneur reçoit WEBSITES_PORT comme variable d'environnement." } }
    - { id: e, text: { en: "App settings are visible to the main container only, not to the sidecar.", fr: "Les paramètres d'application ne sont visibles que par le conteneur principal, pas par le sidecar." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      App Service injects app settings into the container as environment variables, so the code reads them with os.environ. Updating or removing app settings recycles the app, which then starts with the new values.
    fr: |
      App Service injecte les paramètres d'application dans le conteneur sous forme de variables d'environnement : le code les lit avec os.environ. La mise à jour ou la suppression de paramètres d'application recycle l'application, qui redémarre avec les nouvelles valeurs.
  options:
    b: { en: "The DOCKER_REGISTRY_SERVER_* settings are used for the pull and aren't exposed to the application.", fr: "Les paramètres DOCKER_REGISTRY_SERVER_* servent au tirage et ne sont pas exposés à l'application." }
    d: { en: "WEBSITES_PORT tells App Service where to route requests; it isn't injected into the container.", fr: "WEBSITES_PORT indique à App Service où router les requêtes ; il n'est pas injecté dans le conteneur." }
    e: { en: "App settings are shared by all the containers of the app, sidecars included.", fr: "Les paramètres d'application sont partagés par tous les conteneurs de l'application, sidecars compris." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
  - title: Environment variables and app settings reference
    url: https://learn.microsoft.com/en-us/azure/app-service/reference-app-settings
