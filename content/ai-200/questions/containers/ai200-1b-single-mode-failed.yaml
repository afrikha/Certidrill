id: ai200-1b-single-mode-failed
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an OCR service named **ca-ocr** in Azure Container Apps with external ingress and single revision mode. The revision ca-ocr--v4 serves all the traffic.

    A developer deploys a new image, which creates the revision ca-ocr--v5. The replicas of ca-ocr--v5 start, but their readiness probe never succeeds because the new image listens on a different path for health checks.

    What happens to the traffic of ca-ocr?
  fr: |
    Proseware exécute un service d'OCR nommé **ca-ocr** dans Azure Container Apps avec une entrée externe et le mode de révision unique. La révision ca-ocr--v4 sert tout le trafic.

    Un développeur déploie une nouvelle image, ce qui crée la révision ca-ocr--v5. Les réplicas de ca-ocr--v5 démarrent, mais leur sonde de disponibilité ne réussit jamais, car la nouvelle image répond aux contrôles d'intégrité sur un autre chemin.

    Qu'advient-il du trafic de ca-ocr ?
body:
  options:
    - { id: a, text: { en: "ca-ocr--v4 keeps receiving all the traffic, and ca-ocr--v5 receives none.", fr: "ca-ocr--v4 continue de recevoir tout le trafic, et ca-ocr--v5 n'en reçoit aucun." } }
    - { id: b, text: { en: "The traffic is split evenly between ca-ocr--v4 and ca-ocr--v5 until ca-ocr--v5 becomes ready.", fr: "Le trafic est réparti à parts égales entre ca-ocr--v4 et ca-ocr--v5 jusqu'à ce que ca-ocr--v5 devienne prête." } }
    - { id: c, text: { en: "All the traffic moves to ca-ocr--v5 as soon as it is provisioned, and requests fail until the probe is fixed.", fr: "Tout le trafic passe à ca-ocr--v5 dès son approvisionnement, et les requêtes échouent jusqu'à la correction de la sonde." } }
    - { id: d, text: { en: "ca-ocr--v4 is deactivated, and the app returns errors until ca-ocr--v5 becomes ready.", fr: "ca-ocr--v4 est désactivée, et l'application renvoie des erreurs jusqu'à ce que ca-ocr--v5 devienne prête." } }
answer: { optionId: a }
explanation:
  correct:
    en: In single revision mode, the existing revision keeps 100 percent of the traffic until the new revision is ready, which means provisioned, scaled to the previous replica count and passing its startup and readiness probes. If the update fails, the traffic stays on the old revision.
    fr: "En mode de révision unique, la révision existante conserve 100 % du trafic jusqu'à ce que la nouvelle révision soit prête, c'est-à-dire approvisionnée, mise à l'échelle au nombre de réplicas précédent et validée par ses sondes de démarrage et de disponibilité. Si la mise à jour échoue, le trafic reste sur l'ancienne révision."
  options:
    b:
      en: Single revision mode never splits traffic; weights exist only in multiple revision mode.
      fr: Le mode de révision unique ne fractionne jamais le trafic ; les poids n'existent qu'en mode de révisions multiples.
    c:
      en: Provisioning alone isn't enough; the replicas must also pass their readiness probes before traffic moves.
      fr: L'approvisionnement seul ne suffit pas ; les réplicas doivent aussi réussir leurs sondes de disponibilité avant que le trafic bascule.
    d:
      en: The old revision is deprovisioned only after the new one is ready, which provides zero-downtime updates.
      fr: L'ancienne révision n'est déprovisionnée qu'une fois la nouvelle prête, ce qui permet des mises à jour sans interruption.
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
  - title: Health probes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/health-probes
