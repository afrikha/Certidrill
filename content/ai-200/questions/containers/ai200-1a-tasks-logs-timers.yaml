id: ai200-1a-tasks-logs-timers
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso's Azure container registry **crcontoso**, in the West Europe region, runs an ACR task named **build-rag**. The task has a source code commit trigger and a timer trigger.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le registre de conteneurs Azure **crcontoso** de Contoso, situé dans la région West Europe, exécute une tâche ACR nommée **build-rag**. La tâche possède un déclencheur de commit de code source et un déclencheur de minuteur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The hours in the timer's cron expression are interpreted in the time zone of the registry's region.
        fr: |
          Les heures de l'expression cron du minuteur sont interprétées dans le fuseau horaire de la région du registre.
    - id: s2
      text:
        en: |
          The logs of a run started by a commit are stored, and you can view them in the Azure portal or with `az acr task logs`.
        fr: |
          Les journaux d'une exécution démarrée par un commit sont stockés, et vous pouvez les consulter dans le portail Azure ou avec `az acr task logs`.
    - id: s3
      text:
        en: |
          The expression `0 30 6 * * 1-5`, which includes a seconds field, schedules a run at 06:30 every weekday.
        fr: |
          L'expression `0 30 6 * * 1-5`, qui comporte un champ des secondes, planifie une exécution à 06:30 chaque jour de semaine.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Timer triggers use five-field cron expressions evaluated in UTC, whatever the region; seconds and year fields aren't supported, so a six-field expression must be shortened to `30 6 * * 1-5`. Runs triggered automatically, by a commit or a base image update, don't stream their logs to a console: the logs are stored and can be viewed in the portal or with az acr task logs.
    fr: |
      Les déclencheurs de minuteur utilisent des expressions cron à cinq champs évaluées en UTC, quelle que soit la région ; les champs des secondes et de l'année ne sont pas pris en charge : une expression à six champs doit être ramenée à `30 6 * * 1-5`. Les exécutions déclenchées automatiquement, par un commit ou une mise à jour de l'image de base, ne diffusent pas leurs journaux dans une console : les journaux sont stockés et consultables dans le portail ou avec az acr task logs.
references:
  - title: "Tutorial: Run an ACR task on a defined schedule"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-scheduled
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
