id: ai200-1a-app-kv-identity-cli
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam creates the App Service app **app-fab-qa** from a template. The key vault access must be granted before the app exists, so the security team created the user-assigned managed identity **id-fab-kv** and gave it the Key Vault Secrets User role on the vault that holds the app's secrets.

    You need all the Key Vault references of app-fab-qa to be resolved with id-fab-kv.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée l'application App Service **app-fab-qa** à partir d'un modèle. L'accès au coffre de clés doit être accordé avant que l'application n'existe : l'équipe de sécurité a donc créé l'identité managée attribuée par l'utilisateur **id-fab-kv** et lui a attribué le rôle Key Vault Secrets User sur le coffre qui contient les secrets de l'application.

    Vous devez faire en sorte que toutes les références Key Vault de app-fab-qa soient résolues avec id-fab-kv.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    identityId=$(az identity show --resource-group rg-fab --name id-fab-kv --query id --output tsv)
    clientId=$(az identity show --resource-group rg-fab --name id-fab-kv --query clientId --output tsv)
    principalId=$(az identity show --resource-group rg-fab --name id-fab-kv --query principalId --output tsv)

    az webapp identity assign --resource-group rg-fab --name app-fab-qa --identities $identityId

    az webapp update --resource-group rg-fab --name app-fab-qa \
      --set [[prop]]=[[val]]
  slots:
    - id: prop
      options:
        - { id: kvref, text: keyVaultReferenceIdentity }
        - { id: acruser, text: acrUserManagedIdentityID }
        - { id: routeall, text: vnetRouteAllEnabled }
    - id: val
      options:
        - { id: rid, text: "$identityId" }
        - { id: cid, text: "$clientId" }
        - { id: pid, text: "$principalId" }
        - { id: sys, text: SystemAssigned }
answer:
  values: { prop: kvref, val: rid }
explanation:
  correct:
    en: |
      Key Vault references use the system-assigned identity by default. To use a user-assigned identity, assign it to the app and set the keyVaultReferenceIdentity property to the identity's resource ID; the setting applies to every Key Vault reference of the app.
    fr: |
      Les références Key Vault utilisent par défaut l'identité attribuée par le système. Pour utiliser une identité attribuée par l'utilisateur, attribuez-la à l'application et définissez la propriété keyVaultReferenceIdentity sur l'ID de ressource de l'identité ; ce paramètre s'applique à toutes les références Key Vault de l'application.
  options:
    acruser: { en: "acrUserManagedIdentityID selects the identity used to pull images from a registry.", fr: "acrUserManagedIdentityID choisit l'identité utilisée pour tirer les images d'un registre." }
    routeall: { en: "vnetRouteAllEnabled controls outbound routing; it doesn't select an identity.", fr: "vnetRouteAllEnabled contrôle le routage sortant ; il ne choisit aucune identité." }
    cid: { en: "keyVaultReferenceIdentity expects the resource ID of the identity, not its client ID.", fr: "keyVaultReferenceIdentity attend l'ID de ressource de l'identité, pas son ID client." }
    pid: { en: "The principal ID is used for role assignments, not to select the identity.", fr: "L'ID de principal sert aux attributions de rôles, pas à sélectionner l'identité." }
    sys: { en: "SystemAssigned reverts to the system-assigned identity, which has no access to the vault.", fr: "SystemAssigned revient à l'identité attribuée par le système, qui n'a pas accès au coffre." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
