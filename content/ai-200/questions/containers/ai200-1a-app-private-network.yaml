id: ai200-1a-app-private-network
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum deploys a RAG API as a Linux custom container in the App Service app **app-adt-rag**. The image is in the Premium tier Azure container registry **cradatum**, and the API key of the search service is read through a Key Vault reference to the vault **kv-adatum**.

    Public network access is disabled on both cradatum and kv-adatum. Both are reachable only through private endpoints in the virtual network **vnet-adt**, whose private DNS zones are already linked. The app already pulls with its managed identity, which holds AcrPull on cradatum and Key Vault Secrets User on kv-adatum.

    Which three actions should you perform so that the app can pull its image and resolve the reference? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie une API RAG sous forme de conteneur personnalisé Linux dans l'application App Service **app-adt-rag**. L'image se trouve dans le registre de conteneurs Azure de niveau Premium **cradatum**, et la clé d'API du service de recherche est lue au moyen d'une référence Key Vault au coffre **kv-adatum**.

    L'accès au réseau public est désactivé sur cradatum et sur kv-adatum. Les deux ne sont joignables que par des points de terminaison privés du réseau virtuel **vnet-adt**, dont les zones DNS privées sont déjà liées. L'application tire déjà avec son identité managée, qui détient AcrPull sur cradatum et Key Vault Secrets User sur kv-adatum.

    Quelles sont les trois actions à effectuer pour que l'application puisse tirer son image et résoudre la référence ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Integrate app-adt-rag with a subnet of vnet-adt.", fr: "Intégrer app-adt-rag à un sous-réseau de vnet-adt." } }
    - { id: b, text: { en: "Set vnetImagePullEnabled to true on app-adt-rag.", fr: "Définir vnetImagePullEnabled sur true sur app-adt-rag." } }
    - { id: c, text: { en: "Set vnetRouteAllEnabled to true on app-adt-rag.", fr: "Définir vnetRouteAllEnabled sur true sur app-adt-rag." } }
    - { id: d, text: { en: "Add the outbound IP addresses of app-adt-rag to the firewall of kv-adatum.", fr: "Ajouter les adresses IP sortantes de app-adt-rag au pare-feu de kv-adatum." } }
    - { id: e, text: { en: "Enable anonymous pull access on cradatum.", fr: "Activer l'accès anonyme en tirage sur cradatum." } }
    - { id: f, text: { en: "Enable the admin user on cradatum and store its password in kv-adatum.", fr: "Activer l'utilisateur administrateur sur cradatum et stocker son mot de passe dans kv-adatum." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      Both resources are reachable only from vnet-adt, so the app needs virtual network integration. Image pulls go through the virtual network only when vnetImagePullEnabled is true. For Key Vault references, a Linux app that reaches a private endpoint must also route its outbound traffic through the virtual network with vnetRouteAllEnabled.
    fr: |
      Les deux ressources ne sont joignables que depuis vnet-adt : l'application a besoin de l'intégration au réseau virtuel. Le tirage des images ne passe par le réseau virtuel que si vnetImagePullEnabled vaut true. Pour les références Key Vault, une application Linux qui joint un point de terminaison privé doit aussi faire passer son trafic sortant par le réseau virtuel avec vnetRouteAllEnabled.
  options:
    d: { en: "Public network access is disabled on the vault, and Microsoft advises against relying on the app's public outbound IP addresses.", fr: "L'accès au réseau public est désactivé sur le coffre, et Microsoft déconseille de s'appuyer sur les adresses IP sortantes publiques de l'application." }
    e: { en: "Anonymous pull doesn't create a network path, and it would expose the images to anyone who can reach the registry.", fr: "Le tirage anonyme ne crée aucun chemin réseau et exposerait les images à quiconque peut joindre le registre." }
    f: { en: "Credentials don't solve the network problem, and the app already authenticates with its managed identity.", fr: "Des informations d'identification ne résolvent pas le problème réseau, et l'application s'authentifie déjà avec son identité managée." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
