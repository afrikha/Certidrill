id: ai200-1a-tasks-run-yaml
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum's GitHub repository `adatum/vector-indexer` contains a Dockerfile and a multi-step task file named `ci/build-test.yaml` that builds the indexer image, runs its unit tests and pushes it.

    You need to run this task file once, now, in the Azure container registry **cradatum**, without creating a task.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le dépôt GitHub `adatum/vector-indexer` d'Adatum contient un Dockerfile et un fichier de tâche multiétape nommé `ci/build-test.yaml`, qui génère l'image de l'indexeur, exécute ses tests unitaires et l'envoie.

    Vous devez exécuter ce fichier de tâche une seule fois, maintenant, dans le registre de conteneurs Azure **cradatum**, sans créer de tâche.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr [[verb]] --registry cradatum \
      [[f]] ci/build-test.yaml \
      https://github.com/adatum/vector-indexer.git
  slots:
    - id: verb
      options:
        - { id: run, text: run }
        - { id: build, text: build }
        - { id: import, text: import }
    - id: f
      options:
        - { id: file, text: "-f" }
        - { id: cmd, text: "--cmd" }
        - { id: values, text: "--values" }
answer:
  values: { verb: run, f: file }
explanation:
  correct:
    en: |
      `az acr run` runs a quick task from a task file: `-f` gives the path of the YAML file relative to the source context, here the Git repository passed as the last argument. Nothing is saved as a task, unlike `az acr task create`.
    fr: |
      `az acr run` exécute une tâche rapide à partir d'un fichier de tâche : `-f` indique le chemin du fichier YAML relativement au contexte source, ici le dépôt Git transmis en dernier argument. Rien n'est enregistré comme tâche, contrairement à `az acr task create`.
  options:
    build: { en: "az acr build builds one image from a Dockerfile; it doesn't run a multi-step task file.", fr: "az acr build génère une image à partir d'un Dockerfile ; il n'exécute pas de fichier de tâche multiétape." }
    import: { en: "az acr import copies existing images between registries.", fr: "az acr import copie des images existantes entre registres." }
    cmd: { en: "--cmd runs a single container command, not a task file.", fr: "--cmd exécute une seule commande de conteneur, pas un fichier de tâche." }
    values: { en: "--values points to a file of values for the task template, not to the task file itself.", fr: "--values pointe vers un fichier de valeurs pour le modèle de tâche, pas vers le fichier de tâche lui-même." }
references:
  - title: Run multi-step build, test, and patch tasks in ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-multi-step
  - title: az acr
    url: https://learn.microsoft.com/en-us/cli/azure/acr?view=azure-cli-latest
