id: ai200-cs2a-image-builds
objective: "1.1.2"
type: single
caseStudy: ai200-cs2a-wideworld
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the image builds requirement for DocParser. You create a GitHub personal access token that grants access to wwi/docparser.

    What should you do next?
  fr: |
    Vous devez satisfaire l'exigence relative à la génération des images de DocParser. Vous créez un jeton d'accès personnel GitHub qui donne accès à wwi/docparser.

    Que devez-vous faire ensuite ?
body:
  options:
    - id: a
      text:
        en: "Run `az acr build --registry crwwi --image docparser:{{.Run.ID}} .` from a clone of the repository."
        fr: "Exécuter `az acr build --registry crwwi --image docparser:{{.Run.ID}} .` à partir d'un clone du dépôt."
    - id: b
      text:
        en: "Run `az acr task create` with `--image docparser:{{.Run.ID}}` and `--context` set to the main branch of wwi/docparser."
        fr: "Exécuter `az acr task create` avec `--image docparser:{{.Run.ID}}` et `--context` défini sur la branche main de wwi/docparser."
    - id: c
      text:
        en: "Run `az acr import --name crwwi --image docparser:latest` with `--source` set to the base image."
        fr: "Exécuter `az acr import --name crwwi --image docparser:latest` avec `--source` défini sur l'image de base."
    - id: d
      text:
        en: "Run `az acr webhook create` on crwwi with the `push` action and the GitHub repository URL as the service URI."
        fr: "Exécuter `az acr webhook create` sur crwwi avec l'action `push` et l'URL du dépôt GitHub comme URI de service."
answer: { optionId: b }
explanation:
  correct:
    en: An ACR task created with `az acr task create` and a Git context builds the image in Azure. By default the task has a commit trigger on the branch in the context URL and a base image update trigger, so both events start a build without a workstation. The `{{.Run.ID}}` placeholder tags each image with the ID of the run that built it.
    fr: |
      Une tâche ACR créée avec `az acr task create` et un contexte Git génère l'image dans Azure. Par défaut, la tâche a un déclencheur sur validation pour la branche de l'URL de contexte et un déclencheur sur mise à jour de l'image de base : les deux événements lancent une génération sans poste de travail. L'espace réservé `{{.Run.ID}}` attribue à chaque image la balise de l'ID de l'exécution qui l'a générée.
  options:
    a:
      en: A quick task with `az acr build` builds in Azure, but only when someone runs the command; it does not react to commits or base image updates.
      fr: Une tâche rapide `az acr build` génère dans Azure, mais uniquement quand quelqu'un exécute la commande ; elle ne réagit ni aux validations ni aux mises à jour de l'image de base.
    c:
      en: "`az acr import` copies an existing image into the registry; it does not build DocParser from its source code."
      fr: "`az acr import` copie une image existante dans le registre ; elle ne génère pas DocParser à partir de son code source."
    d:
      en: A registry webhook sends a notification after an image is pushed to crwwi; it does not build anything and is not triggered by commits.
      fr: Un webhook de registre envoie une notification après l'envoi d'une image vers crwwi ; il ne génère rien et n'est pas déclenché par les validations.
references:
  - title: Tutorial - Build Container Image on Code Commit in Azure
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tutorial-build-task
