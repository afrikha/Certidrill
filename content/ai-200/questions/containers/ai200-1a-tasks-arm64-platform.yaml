id: ai200-1a-tasks-arm64-platform
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a small vision model on ARM64 Linux edge devices. The model server image is built with ACR Tasks in the Azure container registry **crtailspin** by using the following command:

    `az acr build --registry crtailspin --image vision/edge:1.3.0 .`

    The devices fail to start the container because the image was built for the wrong architecture. You need the image to be built for 64-bit ARM Linux.

    Which parameter should you add to the command?
  fr: |
    Tailspin Toys exécute un petit modèle de vision sur des appareils de périphérie Linux ARM64. L'image du serveur de modèle est générée avec ACR Tasks dans le registre de conteneurs Azure **crtailspin** à l'aide de la commande suivante :

    `az acr build --registry crtailspin --image vision/edge:1.3.0 .`

    Les appareils ne parviennent pas à démarrer le conteneur, car l'image a été générée pour la mauvaise architecture. Vous devez générer l'image pour Linux ARM 64 bits.

    Quel paramètre devez-vous ajouter à la commande ?
body:
  options:
    - { id: a, text: "--target arm64" }
    - { id: b, text: "--platform linux/arm64/v8" }
    - { id: c, text: "--build-arg TARGETARCH=arm64" }
    - { id: d, text: "--platform windows/arm64" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ACR Tasks builds for Linux/amd64 by default. The --platform parameter selects the operating system and architecture in the os/architecture[/variant] format; Linux supports amd64, arm, arm64 and 386, so linux/arm64/v8 produces a 64-bit ARM image.
    fr: |
      ACR Tasks génère par défaut pour Linux/amd64. Le paramètre --platform choisit le système d'exploitation et l'architecture au format os/architecture[/variante] ; Linux prend en charge amd64, arm, arm64 et 386 : linux/arm64/v8 produit donc une image ARM 64 bits.
  options:
    a: { en: "--target selects a stage of a multi-stage Dockerfile, not a CPU architecture.", fr: "--target choisit une étape d'un Dockerfile multiétape, pas une architecture de processeur." }
    c: { en: "A build argument only passes a value to the Dockerfile; the build still runs for the default linux/amd64 platform.", fr: "Un argument de build transmet seulement une valeur au Dockerfile ; la génération s'exécute toujours pour la plateforme par défaut linux/amd64." }
    d: { en: "The devices run Linux, and ACR Tasks supports only the amd64 architecture for Windows.", fr: "Les appareils exécutent Linux, et ACR Tasks ne prend en charge que l'architecture amd64 pour Windows." }
references:
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
