id: ai200-1b-aks-csi-keyvault
objective: "1.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs a document-classification API on the Azure Kubernetes Service (AKS) cluster **aks-docs**. Microsoft Entra Workload ID is already configured for the API pods.

    The API must read its model provider keys as files mounted from the Azure Key Vault **kv-docs**. The key values must not be written in any manifest or Kubernetes object that you create.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une API de classification de documents sur le cluster Azure Kubernetes Service (AKS) **aks-docs**. Microsoft Entra Workload ID est déjà configuré pour les pods de l'API.

    L'API doit lire ses clés de fournisseur de modèle sous forme de fichiers montés depuis l'instance Azure Key Vault **kv-docs**. Les valeurs des clés ne doivent être écrites dans aucun manifeste ni aucun objet Kubernetes que vous créez.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the `azure-keyvault-secrets-provider` add-on on aks-docs.", fr: "Activer le module complémentaire `azure-keyvault-secrets-provider` sur aks-docs." } }
    - { id: b, text: { en: "Create a Kubernetes Secret that contains the keys, and mount it as a volume in the pods.", fr: "Créer un secret Kubernetes qui contient les clés, et le monter comme volume dans les pods." } }
    - { id: c, text: { en: "Create a SecretProviderClass that lists the kv-docs objects, and add a CSI volume that references it to the pod template.", fr: "Créer une SecretProviderClass qui liste les objets de kv-docs, et ajouter au modèle de pod un volume CSI qui la référence." } }
    - { id: d, text: { en: "Enable the application routing add-on on aks-docs.", fr: "Activer le module complémentaire de routage d'application sur aks-docs." } }
    - { id: e, text: { en: "Run `az aks update` with `--attach-acr` for kv-docs.", fr: "Exécuter `az aks update` avec `--attach-acr` pour kv-docs." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The Azure Key Vault provider for the Secrets Store CSI Driver, enabled with the `azure-keyvault-secrets-provider` add-on, mounts Key Vault secrets, keys and certificates into pods through a CSI volume. The SecretProviderClass tells the driver which vault, identity and objects to fetch, and the pod references it from its CSI volume, so the values never appear in a manifest.
    fr: "Le fournisseur Azure Key Vault pour le pilote CSI du magasin de secrets, activé avec le module complémentaire `azure-keyvault-secrets-provider`, monte des secrets, clés et certificats Key Vault dans les pods via un volume CSI. La SecretProviderClass indique au pilote le coffre, l'identité et les objets à récupérer, et le pod la référence depuis son volume CSI : les valeurs n'apparaissent jamais dans un manifeste."
  options:
    b: { en: "Creating a Kubernetes Secret yourself writes the key values into a Kubernetes object, which the requirement forbids.", fr: "Créer vous-même un secret Kubernetes écrit les valeurs des clés dans un objet Kubernetes, ce que l'exigence interdit." }
    d: { en: "The application routing add-on provides managed ingress; it doesn't mount secrets.", fr: "Le module complémentaire de routage d'application fournit une entrée managée ; il ne monte pas de secrets." }
    e: { en: "--attach-acr grants pull access on a container registry, not on a key vault.", fr: "--attach-acr accorde un accès en extraction sur un registre de conteneurs, pas sur un coffre de clés." }
references:
  - title: Use the Azure Key Vault Provider for Secrets Store CSI Driver for Azure Kubernetes Service (AKS) Secrets
    url: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
