id: ai200-1a-app-container-settings
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a speech-to-text model server as a Linux custom container in the App Service app **app-tail-stt**. The image is in Azure Container Registry. The team has the following requirements:

    - The server listens on port 5000.
    - The server loads a large model at startup and needs about six minutes before it answers HTTP requests.
    - When the container is stopped, the server needs 60 seconds to finish the transcriptions in progress.
    - The app is redeployed automatically when a new image is pushed to the configured tag.

    Which app setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie un serveur de modèle de reconnaissance vocale sous forme de conteneur personnalisé Linux dans l'application App Service **app-tail-stt**. L'image se trouve dans Azure Container Registry. L'équipe a les exigences suivantes :

    - Le serveur écoute sur le port 5000.
    - Le serveur charge un modèle volumineux au démarrage et a besoin d'environ six minutes avant de répondre aux requêtes HTTP.
    - Quand le conteneur est arrêté, le serveur a besoin de 60 secondes pour terminer les transcriptions en cours.
    - L'application est redéployée automatiquement quand une nouvelle image est envoyée sur la balise configurée.

    Quel paramètre d'application devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: port, text: WEBSITES_PORT }
    - { id: start, text: WEBSITES_CONTAINER_START_TIME_LIMIT }
    - { id: stop, text: WEBSITES_CONTAINER_STOP_TIME_LIMIT }
    - { id: ci, text: DOCKER_ENABLE_CI }
    - { id: storage, text: WEBSITES_ENABLE_APP_SERVICE_STORAGE }
    - { id: portro, text: PORT }
  targets:
    - { id: t1, text: { en: "Port 5000", fr: "Port 5000" } }
    - { id: t2, text: { en: "Six-minute startup", fr: "Démarrage de six minutes" } }
    - { id: t3, text: { en: "60-second graceful shutdown", fr: "Arrêt propre de 60 secondes" } }
    - { id: t4, text: { en: "Automatic redeployment on push", fr: "Redéploiement automatique à l'envoi" } }
answer:
  mapping: { t1: port, t2: start, t3: stop, t4: ci }
explanation:
  correct:
    en: |
      WEBSITES_PORT tells App Service which container port receives the requests. WEBSITES_CONTAINER_START_TIME_LIMIT raises the time the platform waits for the container to be ready (230 seconds by default on Linux, up to 1,800). WEBSITES_CONTAINER_STOP_TIME_LIMIT sets the graceful termination wait (5 seconds by default, up to 120). DOCKER_ENABLE_CI set to true enables continuous deployment for the custom container.
    fr: |
      WEBSITES_PORT indique à App Service le port du conteneur qui reçoit les requêtes. WEBSITES_CONTAINER_START_TIME_LIMIT augmente le temps pendant lequel la plateforme attend que le conteneur soit prêt (230 secondes par défaut sous Linux, jusqu'à 1 800). WEBSITES_CONTAINER_STOP_TIME_LIMIT définit l'attente d'arrêt propre (5 secondes par défaut, jusqu'à 120). DOCKER_ENABLE_CI défini sur true active le déploiement continu du conteneur personnalisé.
  options:
    storage: { en: "WEBSITES_ENABLE_APP_SERVICE_STORAGE controls the persistence of /home, not ports or timeouts.", fr: "WEBSITES_ENABLE_APP_SERVICE_STORAGE contrôle la persistance de /home, pas les ports ni les délais." }
    portro: { en: "PORT is read-only; it describes the port of the .NET runtime and can't route requests to the container.", fr: "PORT est en lecture seule ; il décrit le port du runtime .NET et ne permet pas de router les requêtes vers le conteneur." }
references:
  - title: Environment variables and app settings reference
    url: https://learn.microsoft.com/en-us/azure/app-service/reference-app-settings
