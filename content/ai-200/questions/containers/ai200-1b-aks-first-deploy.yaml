id: ai200-1b-aks-first-deploy
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum is deploying a tutoring API to the Azure Kubernetes Service (AKS) cluster **aks-tutor** for the first time, from a new build agent that is signed in to Azure. The cluster already has the AcrPull role on the registry that stores the image.

    The manifest `tutor.yaml` contains a Deployment and a Service whose `metadata.namespace` is `tutor`. The Deployment reads an API key from the Kubernetes Secret `tutor-secrets`. The manifest doesn't create the namespace or the Secret, and the pods must start successfully on the first rollout.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum déploie pour la première fois une API de tutorat sur le cluster Azure Kubernetes Service (AKS) **aks-tutor**, depuis un nouvel agent de build connecté à Azure. Le cluster dispose déjà du rôle AcrPull sur le registre qui stocke l'image.

    Le manifeste `tutor.yaml` contient un Deployment et un Service dont le `metadata.namespace` est `tutor`. Le Deployment lit une clé d'API dans le secret Kubernetes `tutor-secrets`. Le manifeste ne crée ni l'espace de noms ni le secret, et les pods doivent démarrer correctement dès le premier déploiement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: creds, text: { en: "Run `az aks get-credentials --resource-group rg-tutor --name aks-tutor`.", fr: "Exécuter `az aks get-credentials --resource-group rg-tutor --name aks-tutor`." } }
    - { id: ns, text: { en: "Run `kubectl create namespace tutor`.", fr: "Exécuter `kubectl create namespace tutor`." } }
    - { id: secret, text: { en: "Run `kubectl create secret generic tutor-secrets -n tutor --from-literal=api-key=$API_KEY`.", fr: "Exécuter `kubectl create secret generic tutor-secrets -n tutor --from-literal=api-key=$API_KEY`." } }
    - { id: apply, text: { en: "Run `kubectl apply -f tutor.yaml`.", fr: "Exécuter `kubectl apply -f tutor.yaml`." } }
    - { id: attach, text: { en: "Run `az aks update --resource-group rg-tutor --name aks-tutor --attach-acr cradatum`.", fr: "Exécuter `az aks update --resource-group rg-tutor --name aks-tutor --attach-acr cradatum`." } }
    - { id: acrlogin, text: { en: "Run `az acr login --name cradatum`.", fr: "Exécuter `az acr login --name cradatum`." } }
answer:
  sequence: [ creds, ns, secret, apply ]
explanation:
  correct:
    en: "`az aks get-credentials` writes the cluster credentials to the kubeconfig file so that kubectl can reach aks-tutor. The namespace must exist before you create the Secret in it, and the Secret must exist before the pods that reference it start. `kubectl apply` then creates the Deployment and the Service."
    fr: "`az aks get-credentials` écrit les informations d'identification du cluster dans le fichier kubeconfig pour que kubectl puisse joindre aks-tutor. L'espace de noms doit exister avant que vous y créiez le secret, et le secret doit exister avant le démarrage des pods qui le référencent. `kubectl apply` crée ensuite le Deployment et le Service."
  options:
    attach:
      en: The cluster already has AcrPull on the registry; attaching it again isn't needed.
      fr: Le cluster dispose déjà d'AcrPull sur le registre ; le rattacher n'est pas nécessaire.
    acrlogin:
      en: The nodes pull the image with the kubelet identity; logging the build agent in to the registry doesn't help the pods.
      fr: Les nœuds tirent l'image avec l'identité kubelet ; connecter l'agent de build au registre n'aide pas les pods.
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
  - title: Integrate Azure Container Registry with Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
