id: ai200-1a-acr-retention-command
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores the images of its forecasting API in a Standard tier Azure container registry named **crnorthwind**. Every push to a stable tag leaves an untagged manifest behind.

    You need to configure the registry so that untagged manifests are deleted automatically as soon as they become untagged, without running any scheduled task.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke les images de son API de prévision dans un registre de conteneurs Azure de niveau Standard nommé **crnorthwind**. Chaque envoi sur une balise stable laisse un manifeste non balisé.

    Vous devez configurer le registre pour que les manifestes non balisés soient supprimés automatiquement dès qu'ils perdent leur balise, sans exécuter de tâche planifiée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr update --name crnorthwind --sku [[sku]]

    az acr config retention update --registry crnorthwind \
      --status enabled --days [[days]] --type UntaggedManifests
  slots:
    - id: sku
      options:
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: days
      options:
        - { id: d0, text: "0" }
        - { id: d1, text: "1" }
        - { id: d7, text: "7" }
        - { id: d365, text: "365" }
answer:
  values: { sku: premium, days: d0 }
explanation:
  correct:
    en: |
      The retention policy for untagged manifests is a Premium-only feature (in preview), so the registry must move to Premium first; the tier change causes no downtime. The retention period accepts 0 to 365 days, and 0 deletes untagged manifests as soon as they are untagged.
    fr: |
      La stratégie de rétention des manifestes non balisés est réservée au niveau Premium (en préversion) : le registre doit d'abord passer en Premium, sans interruption de service. La période de rétention accepte de 0 à 365 jours, et 0 supprime les manifestes non balisés dès qu'ils perdent leur balise.
  options:
    standard: { en: "Standard doesn't support the retention policy; the command would fail.", fr: "Standard ne prend pas en charge la stratégie de rétention ; la commande échouerait." }
    basic: { en: "Basic doesn't support the retention policy.", fr: "Basic ne prend pas en charge la stratégie de rétention." }
    d7: { en: "7 days is the default period, not an immediate deletion.", fr: "7 jours est la période par défaut, pas une suppression immédiate." }
    d1: { en: "1 keeps untagged manifests for one day.", fr: "1 conserve les manifestes non balisés pendant un jour." }
references:
  - title: Set a retention policy to retain untagged manifests
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-retention-policy
