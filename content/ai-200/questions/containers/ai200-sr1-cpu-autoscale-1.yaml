id: ai200-sr1-cpu-autoscale-1
objective: "1.2.3"
type: series_yesno
series: ai200-sr1-cpu-autoscale
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add CPU requests and limits to the container, and then you apply a HorizontalPodAutoscaler.
  fr: Vous ajoutez des demandes et des limites de processeur au conteneur, puis vous appliquez un HorizontalPodAutoscaler.
body:
  solution:
    en: |
      You add `resources.requests.cpu: 250m` and `resources.limits.cpu: 500m` to the embed-api container in the Deployment manifest, and you apply the manifest. You then apply the following manifest:

      ```yaml
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: embed-api-hpa
        namespace: rag
      spec:
        minReplicas: 2
        maxReplicas: 8
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: embed-api
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
      ```
    fr: |
      Vous ajoutez `resources.requests.cpu: 250m` et `resources.limits.cpu: 500m` au conteneur embed-api dans le manifeste du Deployment, puis vous appliquez le manifeste. Vous appliquez ensuite le manifeste suivant :

      ```yaml
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: embed-api-hpa
        namespace: rag
      spec:
        minReplicas: 2
        maxReplicas: 8
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: embed-api
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
      ```
answer: { value: true }
explanation:
  correct:
    en: The horizontal pod autoscaler computes CPU utilization as a percentage of the CPU requested by the pods, so the containers must define CPU requests and limits. With the requests in place, the `autoscaling/v2` manifest targets the embed-api Deployment and keeps between 2 and 8 replicas for an average utilization of 60 percent.
    fr: "Le HorizontalPodAutoscaler calcule l'utilisation du processeur en pourcentage du processeur demandé par les pods : les conteneurs doivent donc définir des demandes et des limites de processeur. Une fois les demandes en place, le manifeste `autoscaling/v2` cible le Deployment embed-api et maintient entre 2 et 8 réplicas pour une utilisation moyenne de 60 %."
references:
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
