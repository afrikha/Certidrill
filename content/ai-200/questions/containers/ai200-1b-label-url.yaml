id: ai200-1b-label-url
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs a tutoring assistant named **ca-tutor** in Azure Container Apps in multiple revision mode. Every week, a new revision is deployed with an updated model.

    The QA team must test each new revision before it receives any production traffic. QA wants to use the same URL for every release, without receiving a new address each week.

    What should you use?
  fr: |
    Adatum exécute un assistant de tutorat nommé **ca-tutor** dans Azure Container Apps en mode de révisions multiples. Chaque semaine, une nouvelle révision est déployée avec un modèle mis à jour.

    L'équipe QA doit tester chaque nouvelle révision avant qu'elle reçoive le moindre trafic de production. L'équipe QA veut utiliser la même URL pour chaque mise en production, sans recevoir de nouvelle adresse chaque semaine.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A label that you move to each new revision", fr: "Une étiquette que vous déplacez vers chaque nouvelle révision" } }
    - { id: b, text: { en: "The revision-specific FQDN of each new revision", fr: "Le FQDN propre à chaque nouvelle révision" } }
    - { id: c, text: { en: "A traffic weight of 10 percent on each new revision", fr: "Un poids de trafic de 10 % sur chaque nouvelle révision" } }
    - { id: d, text: { en: "Internal ingress on the app", fr: "Une entrée interne sur l'application" } }
answer: { optionId: a }
explanation:
  correct:
    en: A label gives a revision its own URL, and traffic sent to that URL reaches only the labeled revision, even with a traffic weight of 0. When you move the label to the next revision, the URL stays the same.
    fr: "Une étiquette donne à une révision sa propre URL, et le trafic envoyé à cette URL n'atteint que la révision étiquetée, même avec un poids de trafic de 0. Quand vous déplacez l'étiquette vers la révision suivante, l'URL reste la même."
  options:
    b:
      en: The revision-specific address contains the revision name, so it changes with every release.
      fr: "L'adresse propre à une révision contient le nom de la révision : elle change donc à chaque mise en production."
    c:
      en: A traffic weight sends real production requests to the revision, which the requirement forbids before testing.
      fr: Un poids de trafic envoie de vraies requêtes de production vers la révision, ce que l'exigence interdit avant les tests.
    d:
      en: Internal ingress restricts who can reach the whole app; it doesn't target a specific revision.
      fr: L'entrée interne limite qui peut joindre l'ensemble de l'application ; elle ne cible pas une révision précise.
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
