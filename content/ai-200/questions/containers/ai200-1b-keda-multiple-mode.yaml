id: ai200-1b-keda-multiple-mode
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs an indexing worker named **ca-index-worker** in Azure Container Apps. Ingress is disabled. Last month, the team switched the app to multiple revision mode to test two versions side by side, and the app still uses that mode.

    You need to add a custom scale rule of type `azure-servicebus` so that the worker scales on the length of the `index-requests` queue. The configuration must be supported by Container Apps.

    What should you do first?
  fr: |
    Fabrikam exécute un worker d'indexation nommé **ca-index-worker** dans Azure Container Apps. L'entrée est désactivée. Le mois dernier, l'équipe a fait passer l'application en mode de révisions multiples pour tester deux versions côte à côte, et l'application utilise toujours ce mode.

    Vous devez ajouter une règle de mise à l'échelle personnalisée de type `azure-servicebus` pour que le worker se mette à l'échelle selon la longueur de la file d'attente `index-requests`. La configuration doit être prise en charge par Container Apps.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Set `minReplicas` to 1 on the latest revision.", fr: "Définir `minReplicas` sur 1 sur la dernière révision." } }
    - { id: b, text: { en: "Assign a label to the latest revision.", fr: "Attribuer une étiquette à la dernière révision." } }
    - { id: c, text: { en: "Enable internal ingress on the app.", fr: "Activer une entrée interne sur l'application." } }
    - { id: d, text: { en: "Set `activeRevisionsMode` to `single`.", fr: "Définir `activeRevisionsMode` sur `single`." } }
answer: { optionId: d }
explanation:
  correct:
    en: Non-HTTP event scale rules require `properties.configuration.activeRevisionsMode` set to `single`. In multiple revision mode, adding a scale trigger creates a new revision while the old active revisions keep their old rules.
    fr: Les règles de mise à l'échelle d'événements non HTTP exigent que `properties.configuration.activeRevisionsMode` soit défini sur `single`. En mode de révisions multiples, l'ajout d'un déclencheur de mise à l'échelle crée une nouvelle révision, tandis que les anciennes révisions actives gardent leurs anciennes règles.
  options:
    a: { en: "A minimum replica count keeps the worker running but doesn't make a queue rule supported in multiple revision mode.", fr: "Un nombre minimal de réplicas maintient le worker en cours d'exécution, mais ne rend pas une règle de file d'attente prise en charge en mode de révisions multiples." }
    b: { en: "Labels route HTTP traffic to a revision; they have no effect on event scale rules.", fr: "Les étiquettes acheminent le trafic HTTP vers une révision ; elles n'ont aucun effet sur les règles de mise à l'échelle d'événements." }
    c: { en: "Ingress is needed only for HTTP or TCP rules; the queue rule doesn't use it.", fr: "L'entrée n'est nécessaire que pour les règles HTTP ou TCP ; la règle de file d'attente ne l'utilise pas." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
