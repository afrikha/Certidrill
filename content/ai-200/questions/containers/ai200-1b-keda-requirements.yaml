id: ai200-1b-keda-requirements
objective: "1.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs two apps in Azure Container Apps: **chat-api**, an HTTP API with an HTTP scale rule, and **summary-worker**, which has an `azure-servicebus` scale rule on the queue it processes. The Azure OpenAI quota allows at most 30 parallel summarization calls.

    Which setting meets each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute deux applications dans Azure Container Apps : **chat-api**, une API HTTP dotée d'une règle de mise à l'échelle HTTP, et **summary-worker**, qui possède une règle de mise à l'échelle `azure-servicebus` sur la file d'attente qu'il traite. Le quota Azure OpenAI autorise au plus 30 appels de synthèse en parallèle.

    Quel paramètre répond à chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: min0, text: "minReplicas: 0" }
    - { id: min1, text: "minReplicas: 1" }
    - { id: max30, text: "maxReplicas: 30" }
    - { id: conc50, text: "concurrentRequests: \"50\"" }
    - { id: msg50, text: "messageCount: \"50\"" }
    - { id: identity, text: "identity: system" }
  targets:
    - { id: warm, text: { en: "chat-api answers the first request of the day without a cold start.", fr: "chat-api répond à la première requête de la journée sans démarrage à froid." } }
    - { id: perreplica, text: { en: "Each chat-api replica handles at most about 50 simultaneous requests.", fr: "Chaque réplica de chat-api traite au plus environ 50 requêtes simultanées." } }
    - { id: backlog, text: { en: "summary-worker targets one replica for every 50 messages waiting in the queue.", fr: "summary-worker cible un réplica pour 50 messages en attente dans la file d'attente." } }
    - { id: quota, text: { en: "summary-worker is limited to 30 replicas, one call per replica.", fr: "summary-worker est limité à 30 réplicas, un appel par réplica." } }
answer:
  mapping: { warm: min1, perreplica: conc50, backlog: msg50, quota: max30 }
explanation:
  correct:
    en: "A minimum of one replica keeps an instance always running, which avoids cold starts. `concurrentRequests` is the target of concurrent HTTP requests per replica, and `messageCount` is the target number of Service Bus messages per replica. `maxReplicas` caps the scale-out of a revision."
    fr: "Un minimum d'un réplica maintient une instance toujours en cours d'exécution, ce qui évite les démarrages à froid. `concurrentRequests` est la cible de requêtes HTTP simultanées par réplica, et `messageCount` est le nombre cible de messages Service Bus par réplica. `maxReplicas` plafonne le scale-out d'une révision."
  options:
    min0: { en: "minReplicas 0 lets the app scale to zero, which causes cold starts.", fr: "minReplicas 0 permet à l'application de descendre à zéro, ce qui provoque des démarrages à froid." }
    identity: { en: "identity selects how the scaler authenticates; it doesn't change any scale target.", fr: "identity choisit comment le scaler s'authentifie ; il ne modifie aucune cible de mise à l'échelle." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
