id: ai200-1a-tasks-quick-build
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Proseware works on a Python image-captioning API. Her laptop has the Azure CLI but no Docker engine, and company policy forbids installing one.

    The current folder contains the API source code and a `Dockerfile`. She needs to build the image and push it to the Azure container registry **crproseware** as `caption/api:1.0.0`.

    Which command should she run?
  fr: |
    Une développeuse de Proseware travaille sur une API Python de légendage d'images. Son ordinateur portable dispose de l'Azure CLI mais d'aucun moteur Docker, et la stratégie de l'entreprise interdit d'en installer un.

    Le dossier actuel contient le code source de l'API et un `Dockerfile`. Elle doit générer l'image et l'envoyer au registre de conteneurs Azure **crproseware** sous le nom `caption/api:1.0.0`.

    Quelle commande doit-elle exécuter ?
body:
  options:
    - { id: a, text: "az acr import --name crproseware --source . --image caption/api:1.0.0" }
    - { id: b, text: "az acr task create --registry crproseware --name caption --context . --image caption/api:1.0.0" }
    - { id: c, text: "az acr build --registry crproseware --image caption/api:1.0.0 ." }
    - { id: d, text: "az acr login --name crproseware && docker push crproseware.azurecr.io/caption/api:1.0.0" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `az acr build` runs a quick task: it uploads the local folder as the build context, builds the image in Azure from the Dockerfile and pushes it to the registry, with no local Docker engine. It is the cloud equivalent of docker build followed by docker push.
    fr: |
      `az acr build` exécute une tâche rapide : il charge le dossier local comme contexte de génération, génère l'image dans Azure à partir du Dockerfile et l'envoie au registre, sans moteur Docker local. C'est l'équivalent cloud de docker build suivi de docker push.
  options:
    a: { en: "az acr import copies an existing image from another registry; it doesn't build from source.", fr: "az acr import copie une image existante depuis un autre registre ; il ne génère rien à partir du code source." }
    b: { en: "az acr task create defines a task triggered from a Git repository, tarball or OCI artifact context; it doesn't take a local folder and doesn't run a one-off build.", fr: "az acr task create définit une tâche déclenchée à partir d'un contexte de dépôt Git, d'archive ou d'artefact OCI ; il n'accepte pas de dossier local et n'exécute pas de génération ponctuelle." }
    d: { en: "docker push needs a Docker engine and an image that was already built locally.", fr: "docker push nécessite un moteur Docker et une image déjà générée localement." }
references:
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
