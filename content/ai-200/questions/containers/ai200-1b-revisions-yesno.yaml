id: ai200-1b-revisions-yesno
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a forecasting API named **ca-forecast** in Azure Container Apps. The app uses the multiple revision mode, and each model version that the data science team ships is deployed as a new revision. Over a year, the team has created more than 150 revisions and deactivated most of them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une API de prévision nommée **ca-forecast** dans Azure Container Apps. L'application utilise le mode de révisions multiples, et chaque version de modèle livrée par l'équipe de science des données est déployée sous la forme d'une nouvelle révision. En un an, l'équipe a créé plus de 150 révisions et en a désactivé la plupart.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Container Apps doesn't charge for the revisions of ca-forecast that are inactive.
        fr: Container Apps ne facture pas les révisions de ca-forecast qui sont inactives.
    - id: s2
      text:
        en: With the default settings, the oldest inactive revisions of ca-forecast are purged once the app has more than 100 inactive revisions.
        fr: Avec les paramètres par défaut, les révisions inactives les plus anciennes de ca-forecast sont purgées dès que l'application compte plus de 100 révisions inactives.
    - id: s3
      text:
        en: The team can assign the label prod to two revisions at the same time to share the traffic of the prod label URL between them.
        fr: L'équipe peut attribuer l'étiquette prod à deux révisions en même temps pour répartir entre elles le trafic de l'URL de l'étiquette prod.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Inactive revisions don't run, have no provisioning or running state, and aren't billed; you can reactivate them at any time. By default, 100 inactive revisions are kept, and the oldest are purged beyond that limit. A label points to exactly one revision at a time, so its URL always reaches a single revision; splitting traffic is done with traffic weights.
    fr: "Les révisions inactives ne s'exécutent pas, n'ont pas d'état d'approvisionnement ni d'exécution et ne sont pas facturées ; vous pouvez les réactiver à tout moment. Par défaut, 100 révisions inactives sont conservées, et les plus anciennes sont purgées au-delà de cette limite. Une étiquette désigne une seule révision à la fois : son URL atteint donc toujours une seule révision ; la répartition du trafic se fait avec des poids de trafic."
  options:
    s3:
      en: A label can be assigned to only one revision at a time.
      fr: Une étiquette ne peut être attribuée qu'à une seule révision à la fois.
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
