id: ai200-1b-aks-selector
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders deploys a reranking API to an Azure Kubernetes Service (AKS) cluster with the manifest shown in the exhibit. When you run `kubectl apply -f rerank.yaml`, the API server rejects the Deployment because the selector doesn't match the template labels.

    You need to deploy the API without changing how other objects select its pods. What should you do?
  fr: |
    Northwind Traders déploie une API de reclassement sur un cluster Azure Kubernetes Service (AKS) avec le manifeste présenté dans la pièce. Quand vous exécutez `kubectl apply -f rerank.yaml`, le serveur d'API rejette le Deployment, car le sélecteur ne correspond pas aux étiquettes du modèle.

    Vous devez déployer l'API sans changer la façon dont les autres objets sélectionnent ses pods. Que devez-vous faire ?
exhibits:
  - id: manifest
    title: { en: "rerank.yaml", fr: "rerank.yaml" }
    body: |
      ```yaml
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rerank-api
        namespace: search
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: rerank-api
        template:
          metadata:
            labels:
              app: reranker
          spec:
            containers:
              - name: api
                image: crnorthwind.azurecr.io/search/rerank:1.0.3
      ```
body:
  options:
    - { id: a, text: { en: "Set `replicas` to 1.", fr: "Définir `replicas` sur 1." } }
    - { id: b, text: { en: "Run `kubectl create -f rerank.yaml` instead.", fr: "Exécuter plutôt `kubectl create -f rerank.yaml`." } }
    - { id: c, text: { en: "Change the pod template label to `app: rerank-api`.", fr: "Remplacer l'étiquette du modèle de pod par `app: rerank-api`." } }
    - { id: d, text: { en: "Add a Service whose selector is `app: reranker`.", fr: "Ajouter un Service dont le sélecteur est `app: reranker`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Deployment manages the pods whose labels match `spec.selector.matchLabels`, so the labels in `spec.template.metadata.labels` must include the selector labels. Changing the template label to `app: rerank-api` keeps the selector, which other objects such as Services rely on, and makes the manifest valid."
    fr: "Un Deployment gère les pods dont les étiquettes correspondent à `spec.selector.matchLabels` : les étiquettes de `spec.template.metadata.labels` doivent donc inclure celles du sélecteur. Remplacer l'étiquette du modèle par `app: rerank-api` conserve le sélecteur, sur lequel s'appuient d'autres objets comme les Services, et rend le manifeste valide."
  options:
    a: { en: "The replica count has nothing to do with the selector validation.", fr: "Le nombre de réplicas n'a aucun rapport avec la validation du sélecteur." }
    b: { en: "kubectl create sends the same invalid object and is rejected for the same reason.", fr: "kubectl create envoie le même objet invalide et est rejeté pour la même raison." }
    d: { en: "A Service doesn't fix the Deployment; the Deployment itself is invalid.", fr: "Un Service ne corrige pas le Deployment ; c'est le Deployment lui-même qui est invalide." }
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
