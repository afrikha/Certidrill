id: ai200-1a-app-log-stream
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders' chatbot API runs as a Linux custom container in the App Service app **app-nw-bot**. The Python code writes its diagnostic messages to standard output.

    You need to capture the container's output on the file system and watch it in real time from a terminal.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'API de chatbot de Northwind Traders s'exécute sous forme de conteneur personnalisé Linux dans l'application App Service **app-nw-bot**. Le code Python écrit ses messages de diagnostic sur la sortie standard.

    Vous devez capturer la sortie du conteneur sur le système de fichiers et la suivre en temps réel depuis un terminal.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az webapp log config --resource-group rg-nw --name app-nw-bot \
      [[flag]] filesystem

    az webapp log [[verb]] --resource-group rg-nw --name app-nw-bot
  slots:
    - id: flag
      options:
        - { id: docker, text: "--docker-container-logging" }
        - { id: web, text: "--web-server-logging" }
        - { id: frt, text: "--failed-request-tracing" }
    - id: verb
      options:
        - { id: tail, text: tail }
        - { id: download, text: download }
        - { id: show, text: show }
answer:
  values: { flag: docker, verb: tail }
explanation:
  correct:
    en: |
      For a custom container, `--docker-container-logging filesystem` stores what the container writes to stdout and stderr, and `az webapp log tail` streams the logs to the terminal in real time.
    fr: |
      Pour un conteneur personnalisé, `--docker-container-logging filesystem` enregistre ce que le conteneur écrit sur stdout et stderr, et `az webapp log tail` diffuse les journaux en temps réel dans le terminal.
  options:
    web: { en: "Web server logging records HTTP requests, not the container's own output.", fr: "La journalisation du serveur web enregistre les requêtes HTTP, pas la sortie du conteneur." }
    frt: { en: "Failed request tracing records failed requests and doesn't take a storage location.", fr: "Le suivi des demandes ayant échoué enregistre les requêtes en échec et ne prend pas d'emplacement de stockage." }
    download: { en: "download retrieves a ZIP file of past logs instead of streaming them.", fr: "download récupère un fichier ZIP des journaux passés au lieu de les diffuser." }
    show: { en: "show displays the logging configuration, not the logs.", fr: "show affiche la configuration de la journalisation, pas les journaux." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
