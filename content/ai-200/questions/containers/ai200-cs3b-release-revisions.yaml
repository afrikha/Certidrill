id: ai200-cs3b-release-revisions
objective: "1.2.1"
type: ordering
caseStudy: ai200-cs3b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You are preparing the first release of tutor-api that must follow the release requirement. The new version will run as the revision tutor-api--v2.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous préparez la première mise en production de tutor-api qui doit suivre l'exigence relative aux mises en production. La nouvelle version s'exécutera sous la forme de la révision tutor-api--v2.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mode, text: { en: "Run `az containerapp revision set-mode` with `--mode multiple`.", fr: "Exécuter `az containerapp revision set-mode` avec `--mode multiple`." } }
    - { id: pin, text: { en: "Run `az containerapp ingress traffic set` with `--revision-weight tutor-api--v1=100`.", fr: "Exécuter `az containerapp ingress traffic set` avec `--revision-weight tutor-api--v1=100`." } }
    - { id: deploy, text: { en: "Run `az containerapp update` with the new image and `--revision-suffix v2`.", fr: "Exécuter `az containerapp update` avec la nouvelle image et `--revision-suffix v2`." } }
    - { id: label, text: { en: "Run `az containerapp revision label add` with `--label green --revision tutor-api--v2`.", fr: "Exécuter `az containerapp revision label add` avec `--label green --revision tutor-api--v2`." } }
    - { id: switch, text: { en: "Run `az containerapp ingress traffic set` with `--revision-weight tutor-api--v1=0 tutor-api--v2=100`.", fr: "Exécuter `az containerapp ingress traffic set` avec `--revision-weight tutor-api--v1=0 tutor-api--v2=100`." } }
    - { id: deactivate, text: { en: "Run `az containerapp revision deactivate` with `--revision tutor-api--v1`.", fr: "Exécuter `az containerapp revision deactivate` avec `--revision tutor-api--v1`." } }
    - { id: restart, text: { en: "Run `az containerapp revision restart` with `--revision tutor-api--v1`.", fr: "Exécuter `az containerapp revision restart` avec `--revision tutor-api--v1`." } }
answer:
  sequence: [ mode, pin, deploy, label, switch ]
explanation:
  correct:
    en: |
      Traffic splitting needs the multiple revision mode, so you switch the mode first. You then pin all the traffic to tutor-api--v1 so that the new revision receives no student traffic when it is created. After you deploy tutor-api--v2, the green label gives it a label URL that the faculty uses for tests; moving the label to the next revision later keeps the same URL. Finally, one traffic update moves all the traffic to tutor-api--v2 while tutor-api--v1 stays active for a rollback.
    fr: |
      Le fractionnement du trafic exige le mode de révisions multiples : vous changez donc d'abord le mode. Vous épinglez ensuite tout le trafic sur tutor-api--v1 pour que la nouvelle révision ne reçoive aucun trafic étudiant lors de sa création. Après le déploiement de tutor-api--v2, l'étiquette green lui donne une URL d'étiquette que les enseignants utilisent pour leurs tests ; déplacer plus tard l'étiquette vers la révision suivante conserve la même URL. Enfin, une seule mise à jour du trafic envoie tout le trafic vers tutor-api--v2, tandis que tutor-api--v1 reste active pour une restauration.
  options:
    deactivate:
      en: |
        Deactivating tutor-api--v1 removes the version that must stay available for a fast rollback.
      fr: |
        Désactiver tutor-api--v1 supprime la version qui doit rester disponible pour une restauration rapide.
    restart:
      en: |
        Restarting a revision only restarts its replicas; it plays no part in the release.
      fr: |
        Redémarrer une révision redémarre seulement ses réplicas ; cela ne joue aucun rôle dans la mise en production.
references:
  - title: Blue-Green Deployment in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
