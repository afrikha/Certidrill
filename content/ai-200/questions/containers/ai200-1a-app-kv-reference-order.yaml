id: ai200-1a-app-kv-reference-order
objective: "1.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs a contract-analysis API as a Linux custom container in the App Service app **app-adt-contracts**. The app has no managed identity yet. The Azure OpenAI key is stored as the secret `aoai-key` in the key vault **kv-adatum**, which uses the Azure RBAC permission model.

    The code must read the key from the environment variable `AOAI_KEY`, and the secret must be resolved as soon as the app setting is saved.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum exécute une API d'analyse de contrats sous forme de conteneur personnalisé Linux dans l'application App Service **app-adt-contracts**. L'application n'a pas encore d'identité managée. La clé Azure OpenAI est stockée sous le nom de secret `aoai-key` dans le coffre de clés **kv-adatum**, qui utilise le modèle d'autorisation Azure RBAC.

    Le code doit lire la clé dans la variable d'environnement `AOAI_KEY`, et le secret doit être résolu dès l'enregistrement du paramètre d'application.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: identity, text: { en: "Enable the system-assigned managed identity of app-adt-contracts.", fr: "Activer l'identité managée attribuée par le système de app-adt-contracts." } }
    - { id: role, text: { en: "Assign the Key Vault Secrets User role on kv-adatum to the app's identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-adatum à l'identité de l'application." } }
    - { id: setting, text: { en: "Add the app setting `AOAI_KEY` with the value `@Microsoft.KeyVault(VaultName=kv-adatum;SecretName=aoai-key)`.", fr: "Ajouter le paramètre d'application `AOAI_KEY` avec la valeur `@Microsoft.KeyVault(VaultName=kv-adatum;SecretName=aoai-key)`." } }
    - { id: reader, text: { en: "Assign the Key Vault Reader role on kv-adatum to the app's identity.", fr: "Attribuer le rôle Key Vault Reader sur kv-adatum à l'identité de l'application." } }
    - { id: plain, text: { en: "Copy the secret value into the app setting `AOAI_KEY`.", fr: "Copier la valeur du secret dans le paramètre d'application `AOAI_KEY`." } }
    - { id: principal, text: { en: "Set keyVaultReferenceIdentity to the principal ID of the app's identity.", fr: "Définir keyVaultReferenceIdentity sur l'ID de principal de l'identité de l'application." } }
answer:
  sequence: [ identity, role, setting ]
explanation:
  correct:
    en: |
      The role assignment needs the identity's principal, which exists only once the identity is enabled. The identity must be able to read the secret before the reference is saved: saving the setting restarts the app, which resolves the reference immediately, whereas a reference saved too early stays unresolved until the next refetch. Key Vault references use the system-assigned identity by default.
    fr: |
      L'attribution de rôle a besoin du principal de l'identité, qui n'existe qu'une fois l'identité activée. L'identité doit pouvoir lire le secret avant l'enregistrement de la référence : l'enregistrement du paramètre redémarre l'application, qui résout la référence immédiatement, alors qu'une référence enregistrée trop tôt reste non résolue jusqu'à la récupération suivante. Les références Key Vault utilisent par défaut l'identité attribuée par le système.
  options:
    reader: { en: "Key Vault Reader reads metadata only, not secret values.", fr: "Key Vault Reader lit seulement les métadonnées, pas les valeurs des secrets." }
    plain: { en: "A plain value stores the secret in the App Service configuration.", fr: "Une valeur en clair stocke le secret dans la configuration App Service." }
    principal: { en: "keyVaultReferenceIdentity is only needed for a user-assigned identity, and it takes a resource ID.", fr: "keyVaultReferenceIdentity n'est nécessaire que pour une identité attribuée par l'utilisateur, et il prend un ID de ressource." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
