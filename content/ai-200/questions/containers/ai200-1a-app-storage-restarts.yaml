id: ai200-1a-app-storage-restarts
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a Linux custom container in the App Service app **app-con-embed**. At startup, the container downloads tokenizer files and caches them on disk. The app setting `WEBSITES_ENABLE_APP_SERVICE_STORAGE` is set to `true`, and the App Service plan scales out during the day.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un conteneur personnalisé Linux dans l'application App Service **app-con-embed**. Au démarrage, le conteneur télécharge des fichiers de tokenizer et les met en cache sur le disque. Le paramètre d'application `WEBSITES_ENABLE_APP_SERVICE_STORAGE` est défini sur `true`, et le plan App Service fait l'objet d'un scale-out pendant la journée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Files that the container writes under `/home` persist across restarts and are shared by all the instances of the app.
        fr: |
          Les fichiers que le conteneur écrit sous `/home` sont conservés lors des redémarrages et partagés par toutes les instances de l'application.
    - id: s2
      text:
        en: |
          Files that the container writes under `/tmp` are still there after the app restarts.
        fr: |
          Les fichiers que le conteneur écrit sous `/tmp` sont toujours présents après un redémarrage de l'application.
    - id: s3
      text:
        en: |
          A new instance added by a scale-out starts the container without pulling the image from the registry.
        fr: |
          Une nouvelle instance ajoutée par un scale-out démarre le conteneur sans tirer l'image depuis le registre.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      With App Service storage enabled, writes to /home persist across restarts and are shared across instances. Data written outside /home or a mounted storage path doesn't persist across restarts. The image is pulled again whenever the app moves to new compute instances, for example after a scale-out or a pricing tier change.
    fr: |
      Avec le stockage App Service activé, les écritures sous /home sont conservées lors des redémarrages et partagées entre les instances. Les données écrites hors de /home ou d'un chemin de stockage monté ne sont pas conservées lors des redémarrages. L'image est de nouveau tirée chaque fois que l'application passe sur de nouvelles instances de calcul, par exemple après un scale-out ou un changement de niveau tarifaire.
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
