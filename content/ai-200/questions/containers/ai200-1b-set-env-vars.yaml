id: ai200-1b-set-env-vars
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a retrieval API named **ca-rag-api** in Azure Container Apps. Its container has the environment variables `SEARCH_ENDPOINT`, `SEARCH_INDEX` and `OPENAI_API_KEY`; the last one references an app secret.

    You need to deploy a new revision named ca-rag-api--v12 that sets `SEARCH_INDEX` to `docs-v4` and adds `RERANK_TOP_K` with the value `20`. The other environment variables must remain unchanged.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une API de récupération nommée **ca-rag-api** dans Azure Container Apps. Son conteneur possède les variables d'environnement `SEARCH_ENDPOINT`, `SEARCH_INDEX` et `OPENAI_API_KEY` ; la dernière référence un secret de l'application.

    Vous devez déployer une nouvelle révision nommée ca-rag-api--v12 qui définit `SEARCH_INDEX` sur `docs-v4` et ajoute `RERANK_TOP_K` avec la valeur `20`. Les autres variables d'environnement doivent rester inchangées.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp update --name ca-rag-api --resource-group rg-rag \
      [[envflag]] SEARCH_INDEX=docs-v4 RERANK_TOP_K=20 \
      [[suffixflag]] v12
  slots:
    - id: envflag
      options:
        - { id: set, text: "--set-env-vars" }
        - { id: replace, text: "--replace-env-vars" }
        - { id: remove, text: "--remove-env-vars" }
        - { id: secrets, text: "--secrets" }
    - id: suffixflag
      options:
        - { id: suffix, text: "--revision-suffix" }
        - { id: container, text: "--container-name" }
        - { id: tags, text: "--tags" }
answer:
  values: { envflag: set, suffixflag: suffix }
explanation:
  correct:
    en: "`--set-env-vars` adds or updates the listed variables and leaves the existing ones untouched. `--revision-suffix v12` appends the suffix to the name of the revision that the template change creates, which gives ca-rag-api--v12."
    fr: "`--set-env-vars` ajoute ou met à jour les variables indiquées et laisse les variables existantes intactes. `--revision-suffix v12` ajoute le suffixe au nom de la révision créée par la modification du modèle, ce qui donne ca-rag-api--v12."
  options:
    replace: { en: "--replace-env-vars removes every variable that isn't listed, including SEARCH_ENDPOINT and OPENAI_API_KEY.", fr: "--replace-env-vars supprime toutes les variables non indiquées, y compris SEARCH_ENDPOINT et OPENAI_API_KEY." }
    remove: { en: "--remove-env-vars takes variable names to delete, not name=value pairs.", fr: "--remove-env-vars prend des noms de variables à supprimer, pas des paires nom=valeur." }
    secrets: { en: "--secrets defines app secrets, not container environment variables.", fr: "--secrets définit des secrets de l'application, pas des variables d'environnement du conteneur." }
    container: { en: "--container-name selects which container of the template to update.", fr: "--container-name sélectionne le conteneur du modèle à mettre à jour." }
    tags: { en: "--tags sets Azure tags on the resource; it doesn't name the revision.", fr: "--tags définit des étiquettes Azure sur la ressource ; il ne nomme pas la révision." }
references:
  - title: az containerapp
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp
