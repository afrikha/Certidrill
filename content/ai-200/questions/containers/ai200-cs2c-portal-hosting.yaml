id: ai200-cs2c-portal-hosting
objective: "1.1.3"
type: dragdrop
caseStudy: ai200-cs2c-blue-yonder
difficulty: 3
status: draft
stem:
  en: |
    You need to configure app-byair-portal to meet the portal hosting requirement.

    Which setting should you configure for each part of the requirement? To answer, drag the appropriate settings to the correct parts. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer app-byair-portal pour satisfaire l'exigence relative à l'hébergement du portail.

    Quel paramètre devez-vous configurer pour chaque partie de l'exigence ? Pour répondre, faites glisser les paramètres appropriés vers les parties correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: port, text: "App setting WEBSITES_PORT=8000" }
    - { id: acrmi, text: "Site configuration acrUseManagedIdentityCreds=true" }
    - { id: acruami, text: "Site configuration acrUserManagedIdentityID=<client ID of id-byair-pull>" }
    - { id: storage, text: "App setting WEBSITES_ENABLE_APP_SERVICE_STORAGE=true" }
    - { id: dockerpwd, text: "App setting DOCKER_REGISTRY_SERVER_PASSWORD=<registry admin password>" }
    - { id: kvident, text: "Site property keyVaultReferenceIdentity=<resource ID of id-byair-pull>" }
  targets:
    - id: t1
      text:
        en: "Send the HTTP requests to the port of the Flask application"
        fr: "Envoyer les requêtes HTTP vers le port de l'application Flask"
    - id: t2
      text:
        en: "Pull the image by using managed identity credentials instead of registry credentials"
        fr: "Tirer l'image avec les informations d'identification d'une identité managée au lieu des informations d'identification du registre"
    - id: t3
      text:
        en: "Use id-byair-pull for the image pulls"
        fr: "Utiliser id-byair-pull pour tirer les images"
    - id: t4
      text:
        en: "Keep the files written under /home/uploads across restarts"
        fr: "Conserver après les redémarrages les fichiers écrits sous /home/uploads"
answer:
  mapping: { t1: port, t2: acrmi, t3: acruami, t4: storage }
explanation:
  correct:
    en: |
      App Service assumes that a custom container listens on port 80, so `WEBSITES_PORT=8000` routes the requests to the Flask port. `acrUseManagedIdentityCreds=true` makes App Service pull the image with a managed identity, and `acrUserManagedIdentityID`, set to the client ID of id-byair-pull, selects that user-assigned identity; both are set with `az webapp config set --generic-configurations`. On Linux custom containers, persistent storage for `/home` is disabled by default; `WEBSITES_ENABLE_APP_SERVICE_STORAGE=true` makes the writes under `/home` persist across restarts.
    fr: |
      App Service suppose qu'un conteneur personnalisé écoute sur le port 80 : `WEBSITES_PORT=8000` achemine les requêtes vers le port de Flask. `acrUseManagedIdentityCreds=true` fait tirer l'image par App Service avec une identité managée, et `acrUserManagedIdentityID`, défini sur l'ID client d'id-byair-pull, sélectionne cette identité affectée par l'utilisateur ; les deux sont définis avec `az webapp config set --generic-configurations`. Pour les conteneurs personnalisés Linux, le stockage persistant de `/home` est désactivé par défaut ; `WEBSITES_ENABLE_APP_SERVICE_STORAGE=true` fait persister après les redémarrages les écritures sous `/home`.
  options:
    dockerpwd:
      en: A registry password is a registry credential, which the requirement forbids.
      fr: Un mot de passe de registre est une information d'identification du registre, ce que l'exigence interdit.
    kvident:
      en: keyVaultReferenceIdentity selects the identity that resolves Key Vault references, not the identity that pulls images.
      fr: keyVaultReferenceIdentity sélectionne l'identité qui résout les références Key Vault, pas celle qui tire les images.
references:
  - title: Configure a Custom Container - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
