id: ai200-1a-app-kv-refresh
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders' App Service app **app-nw-search** reads a search API key from the app setting `SEARCH_KEY`, defined as `@Microsoft.KeyVault(VaultName=kv-northwind;SecretName=search-key)`.

    At 09:00, the security team rotates the key and creates a new version of `search-key`. The old key will be revoked at 10:00. The app must use the new value before 10:00, and future rotations must keep working without editing the reference.

    What should you do?
  fr: |
    L'application App Service **app-nw-search** de Northwind Traders lit une clé d'API de recherche dans le paramètre d'application `SEARCH_KEY`, défini sur `@Microsoft.KeyVault(VaultName=kv-northwind;SecretName=search-key)`.

    À 09:00, l'équipe de sécurité renouvelle la clé et crée une nouvelle version de `search-key`. L'ancienne clé sera révoquée à 10:00. L'application doit utiliser la nouvelle valeur avant 10:00, et les renouvellements futurs doivent continuer de fonctionner sans modification de la référence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Do nothing: App Service picks up new secret versions within one hour.", fr: "Ne rien faire : App Service récupère les nouvelles versions de secret en moins d'une heure." } }
    - { id: b, text: { en: "Add SecretVersion with the new version ID to the reference.", fr: "Ajouter SecretVersion avec l'ID de la nouvelle version à la référence." } }
    - { id: c, text: { en: "Send an authenticated POST to the app's configreferences refresh endpoint.", fr: "Envoyer un POST authentifié au point de terminaison de rafraîchissement configreferences de l'application." } }
    - { id: d, text: { en: "Disable the app's system-assigned identity, and then enable it again.", fr: "Désactiver l'identité attribuée par le système de l'application, puis la réactiver." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A reference without a version follows the latest version, but App Service caches the value and refetches it only every 24 hours, or when the app configuration changes. The refresh endpoint forces an immediate refetch of all referenced secrets while the reference stays versionless for future rotations.
    fr: |
      Une référence sans version suit la dernière version, mais App Service met la valeur en cache et ne la récupère de nouveau que toutes les 24 heures, ou lors d'une modification de la configuration de l'application. Le point de terminaison de rafraîchissement force une nouvelle récupération immédiate de tous les secrets référencés, tandis que la référence reste sans version pour les renouvellements futurs.
  options:
    a: { en: "The cached value is refetched every 24 hours, not every hour.", fr: "La valeur en cache est récupérée de nouveau toutes les 24 heures, pas toutes les heures." }
    b: { en: "A pinned version would require editing the reference at every rotation.", fr: "Une version épinglée obligerait à modifier la référence à chaque renouvellement." }
    d: { en: "Re-enabling creates a new identity with a new principal ID, which loses its access to the vault.", fr: "La réactivation crée une nouvelle identité avec un nouvel ID de principal, qui perd son accès au coffre." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
