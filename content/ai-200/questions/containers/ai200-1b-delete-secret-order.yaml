id: ai200-1b-delete-secret-order
objective: "1.2.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs an intake service named **ca-intake** in Azure Container Apps in multiple revision mode. The revision ca-intake--v3 receives all the traffic. Its container reads the environment variable `LEGACY_OCR_KEY`, which references the app secret `legacy-ocr-key`.

    The new code no longer needs this key. You need to delete the `legacy-ocr-key` secret without interrupting the service, following the recommended procedure.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso exécute un service d'admission nommé **ca-intake** dans Azure Container Apps en mode de révisions multiples. La révision ca-intake--v3 reçoit tout le trafic. Son conteneur lit la variable d'environnement `LEGACY_OCR_KEY`, qui référence le secret d'application `legacy-ocr-key`.

    Le nouveau code n'a plus besoin de cette clé. Vous devez supprimer le secret `legacy-ocr-key` sans interrompre le service, en suivant la procédure recommandée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: update, text: { en: "Run `az containerapp update` with `--remove-env-vars LEGACY_OCR_KEY` to create the revision ca-intake--v4.", fr: "Exécuter `az containerapp update` avec `--remove-env-vars LEGACY_OCR_KEY` pour créer la révision ca-intake--v4." } }
    - { id: traffic, text: { en: "Send all the traffic to ca-intake--v4.", fr: "Envoyer tout le trafic vers ca-intake--v4." } }
    - { id: deactivate, text: { en: "Deactivate ca-intake--v3.", fr: "Désactiver ca-intake--v3." } }
    - { id: remove, text: { en: "Remove the `legacy-ocr-key` secret from ca-intake.", fr: "Supprimer le secret `legacy-ocr-key` de ca-intake." } }
    - { id: restart, text: { en: "Restart ca-intake--v3.", fr: "Redémarrer ca-intake--v3." } }
    - { id: empty, text: { en: "Run `az containerapp secret set` to give `legacy-ocr-key` an empty value.", fr: "Exécuter `az containerapp secret set` pour donner une valeur vide à `legacy-ocr-key`." } }
answer:
  sequence: [ update, traffic, deactivate, remove ]
explanation:
  correct:
    en: Before you delete a secret, you deploy a new revision that no longer references it and deactivate all the revisions that do. Removing the environment variable changes the template, which creates ca-intake--v4. In multiple revision mode the new revision doesn't receive traffic automatically, so you move the traffic to it before you deactivate ca-intake--v3; the secret is then referenced by no active revision and can be removed.
    fr: "Avant de supprimer un secret, vous déployez une nouvelle révision qui ne le référence plus et vous désactivez toutes les révisions qui le référencent. Retirer la variable d'environnement modifie le modèle, ce qui crée ca-intake--v4. En mode de révisions multiples, la nouvelle révision ne reçoit pas automatiquement de trafic : vous y envoyez le trafic avant de désactiver ca-intake--v3 ; le secret n'est alors référencé par aucune révision active et peut être supprimé."
  options:
    restart:
      en: A restart keeps the reference to the secret, so ca-intake--v3 still depends on it.
      fr: "Un redémarrage conserve la référence au secret : ca-intake--v3 en dépend toujours."
    empty:
      en: An empty value would break ca-intake--v3 on its next restart and doesn't delete the secret.
      fr: Une valeur vide casserait ca-intake--v3 à son prochain redémarrage et ne supprime pas le secret.
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
  - title: az containerapp
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp
