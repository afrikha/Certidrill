id: ai200-1b-aks-ilb-manifest
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware runs an embedding API on Azure Kubernetes Service (AKS). Applications in a peered virtual network must reach the API through an Azure load balancer on a private IP address, never on a public IP address. The frontend IP address must come from the subnet **snet-ilb** (10.240.1.0/24) of the cluster's virtual network.

    How should you complete the Service manifest? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute une API d'incorporation sur Azure Kubernetes Service (AKS). Les applications d'un réseau virtuel relié par peering doivent joindre l'API via un équilibreur de charge Azure sur une adresse IP privée, jamais sur une adresse IP publique. L'adresse IP frontale doit provenir du sous-réseau **snet-ilb** (10.240.1.0/24) du réseau virtuel du cluster.

    Comment devez-vous compléter le manifeste du Service ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    apiVersion: v1
    kind: Service
    metadata:
      name: embed-api
      namespace: ml
      annotations:
        [[annotation]]: "true"
        service.beta.kubernetes.io/azure-load-balancer-internal-subnet: [[subnet]]
    spec:
      type: [[type]]
      selector:
        app: embed-api
      ports:
        - port: 80
          targetPort: 8000
  slots:
    - id: annotation
      options:
        - { id: internal, text: service.beta.kubernetes.io/azure-load-balancer-internal }
        - { id: pls, text: service.beta.kubernetes.io/azure-pls-create }
        - { id: ipv4, text: service.beta.kubernetes.io/azure-load-balancer-ipv4 }
    - id: subnet
      options:
        - { id: name, text: "\"snet-ilb\"" }
        - { id: cidr, text: "\"10.240.1.0/24\"" }
        - { id: vnet, text: "\"vnet-aks\"" }
    - id: type
      options:
        - { id: lb, text: LoadBalancer }
        - { id: clusterip, text: ClusterIP }
        - { id: nodeport, text: NodePort }
answer:
  values: { annotation: internal, subnet: name, type: lb }
explanation:
  correct:
    en: "A Service of type LoadBalancer with the annotation `service.beta.kubernetes.io/azure-load-balancer-internal: \"true\"` gets an internal Azure load balancer with only a private IP address. The `azure-load-balancer-internal-subnet` annotation takes the name of a subnet in the same virtual network as the cluster."
    fr: "Un Service de type LoadBalancer avec l'annotation `service.beta.kubernetes.io/azure-load-balancer-internal: \"true\"` obtient un équilibreur de charge Azure interne doté uniquement d'une adresse IP privée. L'annotation `azure-load-balancer-internal-subnet` prend le nom d'un sous-réseau du même réseau virtuel que le cluster."
  options:
    pls: { en: "azure-pls-create creates a Private Link service in addition to an internal load balancer; it doesn't make the load balancer internal.", fr: "azure-pls-create crée un service Private Link en plus d'un équilibreur de charge interne ; il ne rend pas l'équilibreur de charge interne." }
    ipv4: { en: "azure-load-balancer-ipv4 takes a specific IP address, not \"true\".", fr: "azure-load-balancer-ipv4 prend une adresse IP précise, pas \"true\"." }
    cidr: { en: "The subnet annotation expects a subnet name, not an address range.", fr: "L'annotation de sous-réseau attend un nom de sous-réseau, pas une plage d'adresses." }
    vnet: { en: "The annotation names a subnet of the cluster's virtual network, not the virtual network.", fr: "L'annotation désigne un sous-réseau du réseau virtuel du cluster, pas le réseau virtuel." }
    clusterip: { en: "A ClusterIP Service is reachable only from inside the cluster, not from a peered network.", fr: "Un Service ClusterIP n'est joignable que depuis l'intérieur du cluster, pas depuis un réseau relié par peering." }
    nodeport: { en: "A NodePort Service opens a port on the nodes; it doesn't create an Azure load balancer.", fr: "Un Service NodePort ouvre un port sur les nœuds ; il ne crée pas d'équilibreur de charge Azure." }
references:
  - title: Create an Internal Load Balancer in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/internal-lb
  - title: Concepts - Services in Azure Kubernetes Services (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-network-services
