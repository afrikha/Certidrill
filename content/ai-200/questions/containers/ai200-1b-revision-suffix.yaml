id: ai200-1b-revision-suffix
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys deploys a recommendation API named **ca-recs** to Azure Container Apps. Each deployment pipeline run calls `az containerapp update` with the `--revision-suffix` parameter to name the new revision after the model it serves.

    Which two values can the pipeline use as the revision suffix?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys déploie une API de recommandation nommée **ca-recs** sur Azure Container Apps. Chaque exécution du pipeline de déploiement appelle `az containerapp update` avec le paramètre `--revision-suffix` pour nommer la nouvelle révision d'après le modèle qu'elle sert.

    Quelles sont les deux valeurs que le pipeline peut utiliser comme suffixe de révision ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "gpt4o-r2" }
    - { id: b, text: "R2-gpt4o" }
    - { id: c, text: "r2--gpt4o" }
    - { id: d, text: "2-gpt4o" }
    - { id: e, text: "rc7" }
    - { id: f, text: "gpt4o-" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: A revision suffix contains only lowercase alphanumeric characters or dashes, starts with a letter, ends with an alphanumeric character, has no consecutive dashes and is at most 64 characters long. gpt4o-r2 and rc7 meet every rule.
    fr: Un suffixe de révision ne contient que des caractères alphanumériques minuscules ou des tirets, commence par une lettre, se termine par un caractère alphanumérique, ne comporte pas de tirets consécutifs et compte au plus 64 caractères. gpt4o-r2 et rc7 respectent toutes ces règles.
  options:
    b: { en: "Uppercase letters aren't allowed.", fr: "Les majuscules ne sont pas autorisées." }
    c: { en: "Consecutive dashes aren't allowed; the double dash separates the app name from the suffix.", fr: "Les tirets consécutifs ne sont pas autorisés ; le double tiret sépare le nom de l'application du suffixe." }
    d: { en: "The suffix must start with a letter.", fr: "Le suffixe doit commencer par une lettre." }
    f: { en: "The suffix must end with an alphanumeric character.", fr: "Le suffixe doit se terminer par un caractère alphanumérique." }
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
