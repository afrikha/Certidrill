id: ai200-sr2-revision-provisioning-3
objective: "1.2.4"
type: series_yesno
series: ai200-sr2-revision-provisioning
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You open a shell in a replica of the new revision.
  fr: Vous ouvrez un shell dans un réplica de la nouvelle révision.
body:
  solution:
    en: |
      You run the following command, and then you inspect the files of the container.

      ```bash
      az containerapp exec --name ca-tailspin-rank --resource-group rg-tailspin \
        --revision ca-tailspin-rank--v4
      ```
    fr: |
      Vous exécutez la commande suivante, puis vous examinez les fichiers du conteneur.

      ```bash
      az containerapp exec --name ca-tailspin-rank --resource-group rg-tailspin \
        --revision ca-tailspin-rank--v4
      ```
answer: { value: false }
explanation:
  correct:
    en: An interactive shell needs a running replica, and ca-tailspin-rank--v4 has none. Even with a shell, the files of the container do not contain the errors that the Container Apps service reports during provisioning; those are in the system logs.
    fr: "Un shell interactif nécessite un réplica en cours d'exécution, et ca-tailspin-rank--v4 n'en a aucun. Même avec un shell, les fichiers du conteneur ne contiennent pas les erreurs que le service Container Apps signale pendant l'approvisionnement : elles se trouvent dans les journaux système."
references:
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
