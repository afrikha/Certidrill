id: ai200-sr1-secret-update-1
objective: "1.2.1"
type: series_yesno
series: ai200-sr1-secret-update
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You update the secret value only.
  fr: Vous mettez à jour uniquement la valeur du secret.
body:
  solution:
    en: |
      You run the following command, and you perform no other action:

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`
    fr: |
      Vous exécutez la commande suivante, sans aucune autre action :

      `az containerapp secret set -n ca-summarizer -g rg-fabrikam --secrets translator-key=<new-key>`
answer: { value: false }
explanation:
  correct:
    en: Secrets are application-scope settings, so updating translator-key does not create a revision, but an updated secret does not automatically affect the existing revisions either. The replicas of ca-summarizer--v7 keep the old value in `TRANSLATOR_KEY` until the revision is restarted or a new revision is deployed.
    fr: "Les secrets sont des paramètres de l'étendue application : la mise à jour de translator-key ne crée pas de révision, mais un secret mis à jour n'affecte pas non plus automatiquement les révisions existantes. Les réplicas de ca-summarizer--v7 conservent l'ancienne valeur dans `TRANSLATOR_KEY` jusqu'au redémarrage de la révision ou au déploiement d'une nouvelle révision."
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
