id: ai200-1b-keda-desired-replicas
objective: "1.2.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso runs an embedding worker named **ca-embed-worker** in Azure Container Apps. The app has a custom scale rule of type `azure-servicebus` on the queue `embed-requests` with the metadata `messageCount: "25"`, and its scale limits are `minReplicas: 0` and `maxReplicas: 10`.

    A batch import puts 400 messages in the queue, and the backlog stays at about 400 messages for several minutes.

    How many replicas does the app target once scaling has stabilized?
  fr: |
    Contoso exécute un worker d'incorporation nommé **ca-embed-worker** dans Azure Container Apps. L'application possède une règle de mise à l'échelle personnalisée de type `azure-servicebus` sur la file d'attente `embed-requests` avec la métadonnée `messageCount: "25"`, et ses limites de mise à l'échelle sont `minReplicas: 0` et `maxReplicas: 10`.

    Une importation par lots place 400 messages dans la file d'attente, et le backlog reste à environ 400 messages pendant plusieurs minutes.

    Combien de réplicas l'application cible-t-elle une fois la mise à l'échelle stabilisée ?
body:
  options:
    - { id: a, text: "10" }
    - { id: b, text: "16" }
    - { id: c, text: "25" }
    - { id: d, text: "400" }
answer: { optionId: a }
explanation:
  correct:
    en: "KEDA computes `desiredReplicas = ceil(currentMetricValue / targetMetricValue)`, here ceil(400 / 25) = 16. The replica count can never exceed `maxReplicas`, so the app stops at 10 replicas."
    fr: "KEDA calcule `desiredReplicas = ceil(currentMetricValue / targetMetricValue)`, ici ceil(400 / 25) = 16. Le nombre de réplicas ne peut jamais dépasser `maxReplicas` : l'application s'arrête donc à 10 réplicas."
  options:
    b: { en: "16 is the computed value before the maxReplicas limit of 10 applies.", fr: "16 est la valeur calculée avant l'application de la limite maxReplicas de 10." }
    c: { en: "messageCount is the number of messages per replica, not a replica count.", fr: "messageCount est le nombre de messages par réplica, pas un nombre de réplicas." }
    d: { en: "The scaler targets one replica per 25 messages, within the scale limits, not one per message.", fr: "Le scaler cible un réplica par lot de 25 messages, dans les limites de mise à l'échelle, et non un réplica par message." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
