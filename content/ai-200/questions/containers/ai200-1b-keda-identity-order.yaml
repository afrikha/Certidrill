id: ai200-1b-keda-identity-order
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an embedding worker named **ca-embed-worker** in Azure Container Apps in single revision mode. Its `azure-servicebus` scale rule on the queue `embed-requests` of the namespace **sb-contoso** authenticates with the app secret `sb-conn`, which contains a connection string. The app has no managed identity.

    You need the scale rule to authenticate with a system-assigned managed identity and then remove the connection string from the app. Scaling must keep working at every step.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso exécute un worker d'incorporation nommé **ca-embed-worker** dans Azure Container Apps en mode de révision unique. Sa règle de mise à l'échelle `azure-servicebus` sur la file d'attente `embed-requests` de l'espace de noms **sb-contoso** s'authentifie avec le secret d'application `sb-conn`, qui contient une chaîne de connexion. L'application n'a pas d'identité managée.

    Vous devez faire en sorte que la règle de mise à l'échelle s'authentifie avec une identité managée affectée par le système, puis supprimer la chaîne de connexion de l'application. La mise à l'échelle doit continuer à fonctionner à chaque étape.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: assign, text: { en: "Enable the system-assigned managed identity of ca-embed-worker.", fr: "Activer l'identité managée affectée par le système de ca-embed-worker." } }
    - { id: role, text: { en: "Assign the identity the Service Bus data role that the scaler needs on sb-contoso.", fr: "Attribuer à l'identité le rôle de données Service Bus dont le scaler a besoin sur sb-contoso." } }
    - { id: rule, text: { en: "Update the scale rule with `--scale-rule-identity system` instead of `--scale-rule-auth`.", fr: "Mettre à jour la règle de mise à l'échelle avec `--scale-rule-identity system` au lieu de `--scale-rule-auth`." } }
    - { id: remove, text: { en: "Remove the `sb-conn` secret from the app.", fr: "Supprimer le secret `sb-conn` de l'application." } }
    - { id: mode, text: { en: "Switch the app to multiple revision mode.", fr: "Faire passer l'application en mode de révisions multiples." } }
    - { id: federated, text: { en: "Create a federated identity credential for the identity.", fr: "Créer une information d'identification fédérée pour l'identité." } }
answer:
  sequence: [ assign, role, rule, remove ]
explanation:
  correct:
    en: The identity must exist before it can receive a role, and it needs its role before the scaler uses it, otherwise the rule can't read the queue. Once the updated rule authenticates with `system`, no revision references `sb-conn` any more, so the secret can be removed.
    fr: "L'identité doit exister avant de pouvoir recevoir un rôle, et elle doit disposer de ce rôle avant que le scaler l'utilise, sinon la règle ne peut pas lire la file d'attente. Une fois la règle mise à jour authentifiée avec `system`, plus aucune révision ne référence `sb-conn` : le secret peut donc être supprimé."
  options:
    mode:
      en: Non-HTTP event scale rules require single revision mode.
      fr: Les règles de mise à l'échelle d'événements non HTTP exigent le mode de révision unique.
    federated:
      en: Federated credentials are used by Kubernetes workload identity; Container Apps uses the app's managed identity directly.
      fr: Les informations d'identification fédérées servent à l'identité de charge de travail Kubernetes ; Container Apps utilise directement l'identité managée de l'application.
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
