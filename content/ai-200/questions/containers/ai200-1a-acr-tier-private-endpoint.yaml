id: ai200-1a-acr-tier-private-endpoint
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts a retrieval-augmented generation (RAG) API on Azure. The API image is stored in a Basic tier Azure container registry named **crcontosorag**.

    A new security policy requires that the AKS cluster and the build agents pull and push images only through private IP addresses in the virtual network **vnet-rag**, with no traffic to the registry's public endpoint.

    What should you do?
  fr: |
    Contoso héberge une API de génération augmentée de récupération (RAG) sur Azure. L'image de l'API est stockée dans un registre de conteneurs Azure de niveau Basic nommé **crcontosorag**.

    Une nouvelle stratégie de sécurité impose que le cluster AKS et les agents de build tirent et envoient les images uniquement par des adresses IP privées du réseau virtuel **vnet-rag**, sans aucun trafic vers le point de terminaison public du registre.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Basic tier and create a private endpoint for the registry in vnet-rag.", fr: "Conserver le niveau Basic et créer un point de terminaison privé pour le registre dans vnet-rag." } }
    - { id: b, text: { en: "Change the registry to the Standard tier and create a private endpoint in vnet-rag.", fr: "Passer le registre au niveau Standard et créer un point de terminaison privé dans vnet-rag." } }
    - { id: c, text: { en: "Change the registry to the Premium tier and create a private endpoint in vnet-rag.", fr: "Passer le registre au niveau Premium et créer un point de terminaison privé dans vnet-rag." } }
    - { id: d, text: { en: "Keep the Basic tier and add public IP network rules for the build agents.", fr: "Conserver le niveau Basic et ajouter des règles de réseau IP publiques pour les agents de build." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Private Link with private endpoints is a Premium-only feature of Azure Container Registry. You can change the tier of an existing registry without downtime, then create the private endpoint so that clients in vnet-rag reach the registry through private IP addresses.
    fr: |
      Private Link avec des points de terminaison privés est une fonctionnalité réservée au niveau Premium d'Azure Container Registry. Vous pouvez changer le niveau d'un registre existant sans interruption, puis créer le point de terminaison privé pour que les clients de vnet-rag joignent le registre par des adresses IP privées.
  options:
    a: { en: "The Basic tier supports no private endpoint at all.", fr: "Le niveau Basic ne prend en charge aucun point de terminaison privé." }
    b: { en: "The Standard tier adds storage, throughput, artifact cache and anonymous pull, but not private endpoints.", fr: "Le niveau Standard ajoute du stockage, du débit, le cache d'artefacts et le tirage anonyme, mais pas les points de terminaison privés." }
    d: { en: "IP network rules are a Premium feature, and they still use the public endpoint, which the policy forbids.", fr: "Les règles de réseau IP sont une fonctionnalité Premium, et elles utilisent toujours le point de terminaison public, ce que la stratégie interdit." }
references:
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
