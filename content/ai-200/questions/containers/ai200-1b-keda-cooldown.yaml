id: ai200-1b-keda-cooldown
objective: "1.2.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Fabrikam runs a transcription worker named **ca-transcribe** in Azure Container Apps. The app has `minReplicas: 0` and a custom scale rule on an Azure Queue Storage queue, with the default scale behavior.

    At the end of the day, the queue becomes empty while one replica is still running.

    How long does the queue have to stay empty before Container Apps removes the last replica?
  fr: |
    Fabrikam exécute un worker de transcription nommé **ca-transcribe** dans Azure Container Apps. L'application a `minReplicas: 0` et une règle de mise à l'échelle personnalisée sur une file d'attente Stockage File d'attente Azure, avec le comportement de mise à l'échelle par défaut.

    En fin de journée, la file d'attente devient vide alors qu'un réplica s'exécute encore.

    Pendant combien de temps la file d'attente doit-elle rester vide avant que Container Apps supprime le dernier réplica ?
body:
  options:
    - { id: a, text: { en: "30 seconds", fr: "30 secondes" } }
    - { id: b, text: { en: "300 seconds", fr: "300 secondes" } }
    - { id: c, text: { en: "900 seconds", fr: "900 secondes" } }
    - { id: d, text: { en: "3,600 seconds", fr: "3 600 secondes" } }
answer: { optionId: b }
explanation:
  correct:
    en: The cool down period of a custom scale rule is 300 seconds by default, and it applies when the app scales from its final replica to 0. The 30-second value is the polling interval, the time between two checks of the event source.
    fr: La période de refroidissement d'une règle de mise à l'échelle personnalisée est de 300 secondes par défaut, et elle s'applique quand l'application passe de son dernier réplica à 0. La valeur de 30 secondes est l'intervalle d'interrogation, le délai entre deux vérifications de la source d'événements.
  options:
    a: { en: "30 seconds is the default polling interval, not the cool down period.", fr: "30 secondes est l'intervalle d'interrogation par défaut, pas la période de refroidissement." }
    c: { en: "The default cool down period is 300 seconds.", fr: "La période de refroidissement par défaut est de 300 secondes." }
    d: { en: "The default cool down period is 300 seconds.", fr: "La période de refroidissement par défaut est de 300 secondes." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
