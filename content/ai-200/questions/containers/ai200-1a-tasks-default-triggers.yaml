id: ai200-1a-tasks-default-triggers
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys creates an ACR task by running the following command:

    ```bash
    az acr task create --registry crtailspin --name build-api \
      --context https://github.com/tailspin/assistant-api.git#main \
      --file Dockerfile --image assistant/api:{{.Run.ID}} \
      --git-access-token $GIT_PAT
    ```

    The Dockerfile starts with `FROM crtailspin.azurecr.io/base/python:3.12`. You run the task once manually to validate it.

    Which two events will start a run of build-api automatically?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée une tâche ACR en exécutant la commande suivante :

    ```bash
    az acr task create --registry crtailspin --name build-api \
      --context https://github.com/tailspin/assistant-api.git#main \
      --file Dockerfile --image assistant/api:{{.Run.ID}} \
      --git-access-token $GIT_PAT
    ```

    Le Dockerfile commence par `FROM crtailspin.azurecr.io/base/python:3.12`. Vous exécutez la tâche une fois manuellement pour la valider.

    Quels sont les deux événements qui démarreront automatiquement une exécution de build-api ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A commit is pushed to the main branch of tailspin/assistant-api.", fr: "Un commit est envoyé sur la branche main de tailspin/assistant-api." } }
    - { id: b, text: { en: "A pull request is opened against the main branch.", fr: "Une demande de tirage (pull request) est ouverte sur la branche main." } }
    - { id: c, text: { en: "A patched image is pushed to crtailspin.azurecr.io/base/python:3.12.", fr: "Une image corrigée est envoyée sur crtailspin.azurecr.io/base/python:3.12." } }
    - { id: d, text: { en: "A new image is pushed to crtailspin.azurecr.io/base/python:3.13.", fr: "Une nouvelle image est envoyée sur crtailspin.azurecr.io/base/python:3.13." } }
    - { id: e, text: { en: "The clock reaches midnight UTC.", fr: "L'horloge atteint minuit UTC." } }
    - { id: f, text: { en: "A developer pushes an image to the assistant/api repository.", fr: "Un développeur envoie une image dans le dépôt assistant/api." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With a Git context and an access token, the source code commit trigger and the base image update trigger are enabled by default. A push to the stable base tag referenced in FROM updates the tracked base image, so it triggers a rebuild once the task has run at least once.
    fr: |
      Avec un contexte Git et un jeton d'accès, le déclencheur de commit de code source et le déclencheur de mise à jour de l'image de base sont activés par défaut. Un envoi sur la balise de base stable référencée dans FROM met à jour l'image de base suivie : il déclenche une régénération dès lors que la tâche s'est exécutée au moins une fois.
  options:
    b: { en: "The pull request trigger is disabled by default.", fr: "Le déclencheur de demande de tirage est désactivé par défaut." }
    d: { en: "A new tag isn't the image referenced in FROM; only updates of the referenced tag trigger a build.", fr: "Une nouvelle balise n'est pas l'image référencée dans FROM ; seules les mises à jour de la balise référencée déclenchent une génération." }
    e: { en: "No --schedule was defined, so the task has no timer trigger.", fr: "Aucun --schedule n'a été défini : la tâche n'a pas de déclencheur de minuteur." }
    f: { en: "Pushing the task's own output image isn't a trigger.", fr: "L'envoi de l'image produite par la tâche elle-même n'est pas un déclencheur." }
references:
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
  - title: About base image updates for ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-base-images
