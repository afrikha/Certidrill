id: ai200-1b-keda-event-job
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders extracts clauses from uploaded contracts with a containerized model. Each upload adds one message to an Azure Queue Storage queue named `contracts`.

    Each message must be processed by its own container instance with dedicated resources, which runs for up to 40 minutes and then stops. Nothing must run while the queue is empty.

    What should you deploy?
  fr: |
    Northwind Traders extrait les clauses des contrats téléchargés avec un modèle conteneurisé. Chaque téléchargement ajoute un message à une file d'attente Stockage File d'attente Azure nommée `contracts`.

    Chaque message doit être traité par sa propre instance de conteneur dotée de ressources dédiées, qui s'exécute jusqu'à 40 minutes puis s'arrête. Rien ne doit s'exécuter quand la file d'attente est vide.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A container app with `minReplicas` set to 0 and an `azure-queue` scale rule", fr: "Une application conteneur avec `minReplicas` défini sur 0 et une règle de mise à l'échelle `azure-queue`" } }
    - { id: b, text: { en: "A Container Apps job with the Event trigger type and an `azure-queue` scale rule", fr: "Un travail Container Apps avec le type de déclencheur Event et une règle de mise à l'échelle `azure-queue`" } }
    - { id: c, text: { en: "A Container Apps job with the Schedule trigger type and a cron expression of every five minutes", fr: "Un travail Container Apps avec le type de déclencheur Schedule et une expression cron toutes les cinq minutes" } }
    - { id: d, text: { en: "A container app with `minReplicas` set to 0 and an HTTP scale rule with `concurrentRequests` set to 1", fr: "Une application conteneur avec `minReplicas` défini sur 0 et une règle de mise à l'échelle HTTP avec `concurrentRequests` défini sur 1" } }
answer: { optionId: b }
explanation:
  correct:
    en: An event-driven job uses the same KEDA scale rules as an app, but each event starts an execution that runs to completion and stops. Microsoft recommends a job with the Event trigger for work that processes one or a few queue messages and then stops, or when each event needs a new container instance with dedicated resources.
    fr: Un travail piloté par les événements utilise les mêmes règles de mise à l'échelle KEDA qu'une application, mais chaque événement démarre une exécution qui va jusqu'à son terme puis s'arrête. Microsoft recommande un travail avec le déclencheur Event pour un traitement qui gère un ou quelques messages de file d'attente puis s'arrête, ou quand chaque événement a besoin d'une nouvelle instance de conteneur avec des ressources dédiées.
  options:
    a: { en: "An app runs continuously: its replicas keep pulling messages and aren't dedicated to one message.", fr: "Une application s'exécute en continu : ses réplicas continuent de lire des messages et ne sont pas dédiés à un seul message." }
    c: { en: "A scheduled job runs on its timetable, even when the queue is empty, and doesn't start per message.", fr: "Un travail planifié s'exécute selon son calendrier, même quand la file d'attente est vide, et ne démarre pas pour chaque message." }
    d: { en: "Queue messages aren't HTTP requests, so an HTTP rule never reacts to them.", fr: "Les messages de file d'attente ne sont pas des requêtes HTTP : une règle HTTP n'y réagit jamais." }
references:
  - title: Jobs in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/jobs
