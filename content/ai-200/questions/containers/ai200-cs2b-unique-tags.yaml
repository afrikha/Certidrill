id: ai200-cs2b-unique-tags
objective: "1.1.1"
type: single
caseStudy: ai200-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to change the build and release pipelines of LitScan to meet the image versions requirement.

    What should you do?
  fr: |
    Vous devez modifier les pipelines de génération et de mise en production de LitScan pour satisfaire l'exigence relative aux versions des images.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Lock the `litscan:2.4` tag by setting its `write-enabled` attribute to `false` after each release."
        fr: "Verrouiller la balise `litscan:2.4` en définissant son attribut `write-enabled` sur `false` après chaque mise en production."
    - id: b
      text:
        en: "Also tag each build with a unique tag, such as the build ID, and deploy litscan-api with that unique tag."
        fr: "Ajouter aussi à chaque build une balise unique, comme l'ID du build, et déployer litscan-api avec cette balise unique."
    - id: c
      text:
        en: "Also tag each build as `litscan:latest`, and deploy litscan-api with the `latest` tag."
        fr: "Ajouter aussi à chaque build la balise `litscan:latest`, et déployer litscan-api avec la balise `latest`."
    - id: d
      text:
        en: "Import each build into a second repository named litscan-prod with the `2.4` tag, and deploy litscan-api from that repository."
        fr: "Importer chaque build dans un second référentiel nommé litscan-prod avec la balise `2.4`, et déployer litscan-api à partir de ce référentiel."
answer: { optionId: b }
explanation:
  correct:
    en: |
      `litscan:2.4` is a stable tag: it keeps receiving updates, so a replica that starts after a new patch build pulls a different image than the replicas that were already running. Microsoft recommends stable tags for base images and unique tags, which are never reused, for deployments. Adding a unique tag keeps `litscan:2.4` available for the other teams while every replica of a deployment pulls the same image.
    fr: |
      `litscan:2.4` est une balise stable : elle continue de recevoir des mises à jour, donc un réplica qui démarre après un nouveau build de correctif tire une image différente de celle des réplicas déjà en cours d'exécution. Microsoft recommande les balises stables pour les images de base et les balises uniques, jamais réutilisées, pour les déploiements. Ajouter une balise unique conserve `litscan:2.4` pour les autres équipes, tandis que tous les réplicas d'un déploiement tirent la même image.
  options:
    a:
      en: A locked `litscan:2.4` tag can no longer be updated, so the other teams would stop receiving the patch builds.
      fr: |
        Une balise `litscan:2.4` verrouillée ne peut plus être mise à jour : les autres équipes ne recevraient plus les builds de correctif.
    c:
      en: "`latest` is also a stable tag that moves with every push, so replicas can still run different builds."
      fr: "`latest` est aussi une balise stable qui change à chaque envoi : des réplicas peuvent toujours exécuter des builds différents."
    d:
      en: The `2.4` tag of litscan-prod is still overwritten by every import, so it remains a stable tag.
      fr: |
        La balise `2.4` de litscan-prod est toujours remplacée à chaque importation : elle reste une balise stable.
references:
  - title: Image Tag Best Practices - Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
