id: ai200-1b-aks-acr-abac
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank deploys a fraud-scoring model to the Azure Kubernetes Service (AKS) cluster **aks-risk**. The manifests reference images in the Azure Container Registry **crwoodgrove**, which uses the **RBAC Registry + ABAC Repository Permissions** mode. The pods stay in the `ImagePullBackOff` state.

    The cluster must pull the images without any registry credential stored in Kubernetes. You hold the Owner role on the subscription.

    What should you do?
  fr: |
    Woodgrove Bank déploie un modèle de détection des fraudes sur le cluster Azure Kubernetes Service (AKS) **aks-risk**. Les manifestes référencent des images du registre Azure Container Registry **crwoodgrove**, qui utilise le mode **RBAC Registry + ABAC Repository Permissions**. Les pods restent dans l'état `ImagePullBackOff`.

    Le cluster doit tirer les images sans qu'aucune information d'identification de registre ne soit stockée dans Kubernetes. Vous disposez du rôle Owner sur l'abonnement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az aks update --name aks-risk --resource-group rg-risk --attach-acr crwoodgrove`.", fr: "Exécuter `az aks update --name aks-risk --resource-group rg-risk --attach-acr crwoodgrove`." } }
    - { id: b, text: { en: "Create an image pull secret with the registry admin credentials and reference it in the manifests.", fr: "Créer un secret d'extraction d'image avec les informations d'identification d'administrateur du registre et le référencer dans les manifestes." } }
    - { id: c, text: { en: "Assign the AcrPull role on crwoodgrove to the control plane identity of aks-risk.", fr: "Attribuer le rôle AcrPull sur crwoodgrove à l'identité du plan de contrôle de aks-risk." } }
    - { id: d, text: { en: "Assign the Container Registry Repository Reader role on crwoodgrove to the kubelet managed identity of aks-risk.", fr: "Attribuer le rôle Container Registry Repository Reader sur crwoodgrove à l'identité managée kubelet de aks-risk." } }
answer: { optionId: d }
explanation:
  correct:
    en: The nodes pull images with the kubelet managed identity. For a registry in the RBAC Registry + ABAC Repository Permissions mode, `--attach-acr` isn't supported, and you assign the Container Registry Repository Reader role yourself instead of AcrPull.
    fr: "Les nœuds tirent les images avec l'identité managée kubelet. Pour un registre en mode RBAC Registry + ABAC Repository Permissions, `--attach-acr` n'est pas pris en charge : vous attribuez vous-même le rôle Container Registry Repository Reader au lieu d'AcrPull."
  options:
    a: { en: "--attach-acr isn't supported for registries that use ABAC repository permissions, whatever your role.", fr: "--attach-acr n'est pas pris en charge pour les registres qui utilisent les autorisations de référentiel ABAC, quel que soit votre rôle." }
    b: { en: "An image pull secret stores a registry credential in Kubernetes, which the requirement forbids.", fr: "Un secret d'extraction d'image stocke une information d'identification de registre dans Kubernetes, ce que l'exigence interdit." }
    c: { en: "Images are pulled by the kubelet identity of the nodes, not by the control plane identity, and ABAC registries need Repository Reader.", fr: "Les images sont tirées par l'identité kubelet des nœuds, pas par l'identité du plan de contrôle, et les registres ABAC exigent Repository Reader." }
references:
  - title: Integrate Azure Container Registry with Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
