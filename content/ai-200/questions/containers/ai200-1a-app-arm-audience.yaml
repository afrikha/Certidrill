id: ai200-1a-app-arm-audience
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys a Python inference API as a Linux custom container in the App Service app **app-fab-infer**. The image is in the Azure container registry **crfabrikam**, which allows public network access.

    You enabled the app's system-assigned managed identity, assigned it the AcrPull role on crfabrikam two days ago, and set `acrUseManagedIdentityCreds` to true. The container still doesn't start, and the logs show that the image pull fails with `UNAUTHORIZED` and the message "token validation failed".

    What should you do?
  fr: |
    Fabrikam déploie une API d'inférence Python sous forme de conteneur personnalisé Linux dans l'application App Service **app-fab-infer**. L'image se trouve dans le registre de conteneurs Azure **crfabrikam**, qui autorise l'accès au réseau public.

    Vous avez activé l'identité managée attribuée par le système de l'application, vous lui avez attribué le rôle AcrPull sur crfabrikam il y a deux jours et vous avez défini `acrUseManagedIdentityCreds` sur true. Le conteneur ne démarre toujours pas, et les journaux montrent que le tirage de l'image échoue avec `UNAUTHORIZED` et le message « token validation failed ».

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: "az acr config authentication-as-arm update -r crfabrikam --status enabled" }
    - { id: b, text: "az acr update --name crfabrikam --admin-enabled true" }
    - { id: c, text: "az resource update --resource-group rg-fab --name app-fab-infer --resource-type Microsoft.Web/sites --set properties.vnetImagePullEnabled=true" }
    - { id: d, text: "az role assignment create --assignee <principal-id> --scope <crfabrikam-id> --role AcrPush" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      App Service authenticates to the registry with an ARM audience token. If the registry doesn't accept ARM audience tokens, the pull fails with UNAUTHORIZED and "token validation failed" even though the role assignment is correct. Enabling authentication-as-arm on the registry fixes it.
    fr: |
      App Service s'authentifie auprès du registre avec un jeton d'audience ARM. Si le registre n'accepte pas les jetons d'audience ARM, le tirage échoue avec UNAUTHORIZED et « token validation failed », même si l'attribution de rôle est correcte. Activer authentication-as-arm sur le registre résout le problème.
  options:
    b: { en: "The admin user is a shared password-based account, and it doesn't fix managed identity token validation.", fr: "L'utilisateur administrateur est un compte partagé à mot de passe, et il ne corrige pas la validation du jeton de l'identité managée." }
    c: { en: "vnetImagePullEnabled routes the pull through a virtual network, which isn't needed for a registry with public access.", fr: "vnetImagePullEnabled fait passer le tirage par un réseau virtuel, ce qui n'est pas nécessaire pour un registre accessible publiquement." }
    d: { en: "The identity already holds AcrPull, which is enough to pull; a broader role doesn't change token validation.", fr: "L'identité détient déjà AcrPull, qui suffit pour tirer ; un rôle plus large ne change rien à la validation du jeton." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
