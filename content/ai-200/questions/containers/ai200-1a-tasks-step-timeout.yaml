id: ai200-1a-tasks-step-timeout
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum builds a GPU inference image with a multi-step ACR task named **build-infer**, created with the default settings of `az acr task create`. The task file is shown below.

    ```yaml
    version: v1.1.0
    steps:
      - id: build
        build: -t $Registry/infer/server:$ID -f Dockerfile.gpu .
      - id: push
        push:
          - $Registry/infer/server:$ID
    ```

    The build step compiles native libraries and takes about 20 minutes. Every run fails on the `build` step after exactly 10 minutes with a timeout.

    What should you do?
  fr: |
    Adatum génère une image d'inférence GPU avec une tâche ACR multiétape nommée **build-infer**, créée avec les paramètres par défaut de `az acr task create`. Le fichier de tâche est présenté ci-dessous.

    ```yaml
    version: v1.1.0
    steps:
      - id: build
        build: -t $Registry/infer/server:$ID -f Dockerfile.gpu .
      - id: push
        push:
          - $Registry/infer/server:$ID
    ```

    L'étape de génération compile des bibliothèques natives et dure environ 20 minutes. Chaque exécution échoue sur l'étape `build` au bout d'exactement 10 minutes, avec un dépassement de délai.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run az acr task update --name build-infer with --timeout 7200.", fr: "Exécuter az acr task update --name build-infer avec --timeout 7200." } }
    - { id: b, text: { en: "Add retries: 2 to the build step.", fr: "Ajouter retries: 2 à l'étape build." } }
    - { id: c, text: { en: "Add startDelay: 600 to the build step.", fr: "Ajouter startDelay: 600 à l'étape build." } }
    - { id: d, text: { en: "Add stepTimeout: 1800 at the top level of the task file.", fr: "Ajouter stepTimeout: 1800 au premier niveau du fichier de tâche." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each step of a task file times out after 600 seconds by default. The top-level stepTimeout property (or a timeout on the step) raises this limit; 1,800 seconds stays below the default run timeout of 3,600 seconds, which also bounds the whole run.
    fr: |
      Chaque étape d'un fichier de tâche expire par défaut au bout de 600 secondes. La propriété stepTimeout de premier niveau (ou un timeout sur l'étape) relève cette limite ; 1 800 secondes restent sous le délai d'exécution par défaut de 3 600 secondes, qui borne aussi l'ensemble de l'exécution.
  options:
    a: { en: "The run timeout (3,600 seconds by default) isn't the limit reached here; the 600-second step timeout still applies.", fr: "Le délai d'exécution (3 600 secondes par défaut) n'est pas la limite atteinte ici ; le délai de 600 secondes par étape s'applique toujours." }
    b: { en: "Retries would restart the step, which would time out again after 10 minutes.", fr: "Les nouvelles tentatives relanceraient l'étape, qui expirerait de nouveau au bout de 10 minutes." }
    c: { en: "startDelay only delays the start of the step; it doesn't extend its timeout.", fr: "startDelay retarde seulement le démarrage de l'étape ; il n'allonge pas son délai d'expiration." }
references:
  - title: "ACR Tasks reference: YAML"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-reference-yaml
  - title: az acr task
    url: https://learn.microsoft.com/en-us/cli/azure/acr/task?view=azure-cli-latest
