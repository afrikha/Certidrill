id: ai200-1b-keda-scale-step
objective: "1.2.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys runs a moderation worker named **ca-moderate** in Azure Container Apps with the default scale behavior. Its custom scale rule targets 10 messages per replica, and its scale limits are `minReplicas: 0` and `maxReplicas: 50`.

    One replica is running when a burst puts 1,000 messages in the queue.

    How many replicas does the app target at the next scaling step?
  fr: |
    Wingtip Toys exécute un worker de modération nommé **ca-moderate** dans Azure Container Apps avec le comportement de mise à l'échelle par défaut. Sa règle de mise à l'échelle personnalisée cible 10 messages par réplica, et ses limites de mise à l'échelle sont `minReplicas: 0` et `maxReplicas: 50`.

    Un réplica s'exécute quand un pic place 1 000 messages dans la file d'attente.

    Combien de réplicas l'application cible-t-elle à la prochaine étape de mise à l'échelle ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "50" }
answer: { optionId: c }
explanation:
  correct:
    en: The desired count is ceil(1,000 / 10) = 100, but each step scales to min(maxReplicas, desiredReplicas, max(4, 2 × currentReplicas)) = min(50, 100, 4) = 4. Scale-up steps follow 1, 4, 8, 16, 32 and so on until the maximum is reached.
    fr: "Le nombre souhaité est ceil(1 000 / 10) = 100, mais chaque étape passe à min(maxReplicas, desiredReplicas, max(4, 2 × currentReplicas)) = min(50, 100, 4) = 4. Les étapes de scale-out suivent 1, 4, 8, 16, 32, etc., jusqu'à atteindre le maximum."
  options:
    a: { en: "There is no scale-up stabilization window, so the app scales out at the next evaluation.", fr: "Il n'y a pas de fenêtre de stabilisation pour le scale-out : l'application augmente le nombre de réplicas dès l'évaluation suivante." }
    b: { en: "A step can grow to max(4, 2 × current replicas), which is 4 here, not 2.", fr: "Une étape peut monter jusqu'à max(4, 2 × réplicas actuels), soit 4 ici, pas 2." }
    d: { en: "The app reaches 50 only after several steps; one step can't jump from 1 to 50 replicas.", fr: "L'application n'atteint 50 qu'après plusieurs étapes ; une étape ne peut pas passer de 1 à 50 réplicas." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
