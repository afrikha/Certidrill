id: ai200-cs1a-image-lock
objective: "1.1.1"
type: single
caseStudy: ai200-cs1a-proseware
difficulty: 2
status: draft
stem:
  en: |
    The release pipeline has just deployed the tag **search-api:build-4512** to ca-search-api.

    You need to meet the image protection requirement. Which command should the release pipeline run next?
  fr: |
    Le pipeline de mise en production vient de déployer la balise **search-api:build-4512** sur ca-search-api.

    Vous devez satisfaire l'exigence relative à la protection des images. Quelle commande le pipeline de mise en production doit-il exécuter ensuite ?
body:
  options:
    - { id: a, text: "az acr repository update --name crproseware --image search-api:build-4512 --delete-enabled false --write-enabled true" }
    - { id: b, text: "az acr repository update --name crproseware --repository search-api --write-enabled false" }
    - { id: c, text: "az acr repository update --name crproseware --image search-api:build-4512 --write-enabled false" }
    - { id: d, text: "az acr repository update --name crproseware --image search-api:build-4512 --read-enabled false" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Setting the `write-enabled` attribute of the tag to `false` locks it: the tag can no longer be updated, and the lock also blocks its deletion. The lock applies only to search-api:build-4512, so the pipeline can still push new tags to the repository.
    fr: |
      Définir l'attribut `write-enabled` de la balise sur `false` la verrouille : la balise ne peut plus être mise à jour, et le verrou bloque aussi sa suppression. Le verrou ne s'applique qu'à search-api:build-4512 : le pipeline peut toujours envoyer de nouvelles balises vers le dépôt.
  options:
    a:
      en: "`--delete-enabled false` with `--write-enabled true` prevents the deletion of the tag but still allows it to be updated, so it can be overwritten."
      fr: "`--delete-enabled false` avec `--write-enabled true` empêche la suppression de la balise mais autorise toujours sa mise à jour : elle peut être remplacée."
    b:
      en: "Locking the whole repository locks all its images, so the pipeline could no longer push new tags to search-api."
      fr: "Verrouiller tout le dépôt verrouille toutes ses images : le pipeline ne pourrait plus envoyer de nouvelles balises vers search-api."
    d:
      en: "`--read-enabled false` blocks the pulls of the image, which would stop ca-search-api from pulling it, and it does not prevent an overwrite."
      fr: "`--read-enabled false` bloque les extractions de l'image, ce qui empêcherait ca-search-api de l'extraire, et n'empêche pas son remplacement."
references:
  - title: Lock a container image in an Azure container registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-lock
