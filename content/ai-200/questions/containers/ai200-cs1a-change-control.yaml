id: ai200-cs1a-change-control
objective: "1.2.1"
type: multi
caseStudy: ai200-cs1a-proseware
difficulty: 2
status: draft
stem:
  en: |
    The CaseFinder team plans the following changes to ca-search-api.

    You need to meet the change control requirement. Which two changes must be approved by the change advisory board?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe CaseFinder prévoit les modifications suivantes de ca-search-api.

    Vous devez satisfaire l'exigence relative au contrôle des modifications. Quelles sont les deux modifications qui doivent être approuvées par le comité consultatif des changements ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the value of the courtfeed-key secret", fr: "Mettre à jour la valeur du secret courtfeed-key" } }
    - { id: b, text: { en: "Deploy a new tag of the container image", fr: "Déployer une nouvelle balise de l'image conteneur" } }
    - { id: c, text: { en: "Switch the app to multiple revision mode", fr: "Faire passer l'application en mode de révisions multiples" } }
    - { id: d, text: { en: "Change the concurrent requests value of the HTTP scale rule", fr: "Modifier la valeur de requêtes simultanées de la règle de mise à l'échelle HTTP" } }
    - { id: e, text: { en: "Add the credentials of a private container registry", fr: "Ajouter les informations d'identification d'un registre de conteneurs privé" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Only revision-scope changes, which modify the `properties.template` section of the app, create a new revision. The container image and the scale rules are part of the template, so these two changes need the approval of the change advisory board. Secrets, the revision mode, ingress settings and registry credentials are application-scope settings in `properties.configuration`, which do not create a revision.
    fr: |
      Seules les modifications de l'étendue révision, qui changent la section `properties.template` de l'application, créent une nouvelle révision. L'image conteneur et les règles de mise à l'échelle font partie du modèle : ces deux modifications exigent l'approbation du comité consultatif des changements. Les secrets, le mode de révision, les paramètres d'entrée et les informations d'identification de registre sont des paramètres de l'étendue application, dans `properties.configuration`, qui ne créent pas de révision.
  options:
    a:
      en: "Changing a secret value does not create a revision; existing revisions must be restarted to read the new value."
      fr: "Modifier la valeur d'un secret ne crée pas de révision ; les révisions existantes doivent être redémarrées pour lire la nouvelle valeur."
    c:
      en: "The revision mode is an application-scope setting and does not create a revision."
      fr: "Le mode de révision est un paramètre de l'étendue application et ne crée pas de révision."
    e:
      en: "Private registry credentials are application-scope settings and do not create a revision."
      fr: "Les informations d'identification d'un registre privé sont des paramètres de l'étendue application et ne créent pas de révision."
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
