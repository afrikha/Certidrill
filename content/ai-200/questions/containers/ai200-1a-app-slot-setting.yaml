id: ai200-1a-app-slot-setting
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs its assistant API in the App Service app **app-tail-assist**, which has a `staging` deployment slot. Releases are deployed to staging and then swapped into production.

    The API reads the secret `MODEL_KEY` from an environment variable. In staging, the value must come from the test vault **kv-tail-test**; in production, from **kv-tail-prod**. After each swap, each slot must keep the value that points to its own vault.

    Which command should you run for the staging slot?
  fr: |
    Tailspin Toys exécute son API d'assistant dans l'application App Service **app-tail-assist**, qui possède un emplacement de déploiement `staging`. Les versions sont déployées sur staging, puis permutées en production.

    L'API lit le secret `MODEL_KEY` dans une variable d'environnement. En staging, la valeur doit provenir du coffre de test **kv-tail-test** ; en production, de **kv-tail-prod**. Après chaque permutation, chaque emplacement doit conserver la valeur qui pointe vers son propre coffre.

    Quelle commande devez-vous exécuter pour l'emplacement staging ?
body:
  options:
    - { id: a, text: "az webapp config appsettings set --resource-group rg-tail --name app-tail-assist --slot staging --slot-settings \"MODEL_KEY=@Microsoft.KeyVault(VaultName=kv-tail-test;SecretName=model-key)\"" }
    - { id: b, text: "az webapp config appsettings set --resource-group rg-tail --name app-tail-assist --slot staging --settings \"MODEL_KEY=@Microsoft.KeyVault(VaultName=kv-tail-test;SecretName=model-key)\"" }
    - { id: c, text: "az webapp config appsettings set --resource-group rg-tail --name app-tail-assist --slot staging --settings \"MODEL_KEY=@Microsoft.KeyVault(VaultName=kv-tail-test;SecretName=model-key)\" WEBSITE_OVERRIDE_PRESERVE_DEFAULT_STICKY_SLOT_SETTINGS=false" }
    - { id: d, text: "az webapp config appsettings set --resource-group rg-tail --name app-tail-assist --settings \"MODEL_KEY=@Microsoft.KeyVault(VaultName=kv-tail-test;SecretName=model-key)\"" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--slot-settings` adds the settings and marks them as deployment slot settings, so they stay with the slot during a swap. Microsoft recommends slot settings for Key Vault references because each environment should use its own vault.
    fr: |
      `--slot-settings` ajoute les paramètres et les marque comme paramètres d'emplacement de déploiement : ils restent attachés à l'emplacement lors d'une permutation. Microsoft recommande les paramètres d'emplacement pour les références Key Vault, car chaque environnement doit utiliser son propre coffre.
  options:
    b: { en: "A setting created with --settings swaps with the content, so production would receive the test vault reference.", fr: "Un paramètre créé avec --settings est permuté avec le contenu : la production recevrait la référence au coffre de test." }
    c: { en: "Setting WEBSITE_OVERRIDE_PRESERVE_DEFAULT_STICKY_SLOT_SETTINGS to false makes settings swappable, the opposite of the requirement.", fr: "Définir WEBSITE_OVERRIDE_PRESERVE_DEFAULT_STICKY_SLOT_SETTINGS sur false rend les paramètres permutables, l'inverse de l'exigence." }
    d: { en: "Without --slot, the command targets the production slot.", fr: "Sans --slot, la commande cible l'emplacement de production." }
references:
  - title: az webapp config appsettings
    url: https://learn.microsoft.com/en-us/cli/azure/webapp/config/appsettings?view=azure-cli-latest
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
