id: ai200-1c-aca-logs-cli
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a document indexer in a container app named **ca-indexer** in a resource group named **rg-search**. The app runs in multiple revision mode. The revision **ca-indexer--v7** has one replica, which contains two containers: **indexer** and a Python sidecar named **embedder**.

    You need to watch, continuously and as new lines arrive, the messages that the **embedder** container prints in revision ca-indexer--v7.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute un indexeur de documents dans une application conteneur nommée **ca-indexer** dans un groupe de ressources nommé **rg-search**. L'application fonctionne en mode à révisions multiples. La révision **ca-indexer--v7** a un seul réplica, qui contient deux conteneurs : **indexer** et un conteneur sidecar Python nommé **embedder**.

    Vous devez suivre en continu, au fur et à mesure de leur arrivée, les messages qu'affiche le conteneur **embedder** dans la révision ca-indexer--v7.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp logs show \
      --name ca-indexer \
      --resource-group rg-search \
      --revision ca-indexer--v7 \
      [[sel]] embedder \
      --type [[type]] \
      [[stream]]
  slots:
    - id: sel
      options:
        - { id: container, text: "--container" }
        - { id: replica, text: "--replica" }
        - { id: name, text: "--name" }
    - id: type
      options:
        - { id: console, text: console }
        - { id: system, text: system }
    - id: stream
      options:
        - { id: follow, text: "--follow" }
        - { id: tail, text: "--tail 300" }
        - { id: format, text: "--format text" }
        - { id: output, text: "--output table" }
answer:
  values: { sel: container, type: console, stream: follow }
explanation:
  correct:
    en: |
      `--container` selects one container of the replica, here the embedder sidecar. The `console` type returns what the containers write to stdout and stderr, and `--follow` keeps the stream open and prints new messages as they arrive.
    fr: |
      `--container` sélectionne un conteneur du réplica, ici le conteneur sidecar embedder. Le type `console` renvoie ce que les conteneurs écrivent sur stdout et stderr, et `--follow` garde le flux ouvert et affiche les nouveaux messages au fur et à mesure.
  options:
    replica:
      en: "--replica expects the name of a replica of the revision, not the name of a container."
      fr: "--replica attend le nom d'un réplica de la révision, pas celui d'un conteneur."
    name:
      en: "--name is the name of the container app and is already given."
      fr: "--name est le nom de l'application conteneur et figure déjà dans la commande."
    system:
      en: System logs report service events such as revision provisioning, not what the code prints.
      fr: Les journaux système signalent des événements du service, comme l'approvisionnement des révisions, pas ce qu'affiche le code.
    tail:
      en: "--tail prints a number of past messages (0 to 300) and exits; it does not keep streaming."
      fr: "--tail affiche un nombre de messages passés (0 à 300) puis se termine ; il ne poursuit pas la diffusion."
    format:
      en: "--format only changes the output format (json or text)."
      fr: "--format ne change que le format de sortie (json ou text)."
    output:
      en: "--output is the global format argument of the Azure CLI; it does not stream new messages."
      fr: "--output est l'argument global de format d'Azure CLI ; il ne diffuse pas les nouveaux messages."
references:
  - title: View log streams in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-streaming
  - title: az containerapp logs
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp/logs
