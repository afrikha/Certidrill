id: ai200-1c-oomkilled-limit
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts a Python inference API on Azure Kubernetes Service (AKS). The API loads a model of about 3 GiB into memory when it starts. The deployment manifest sets `resources.requests.memory` to `1Gi` and `resources.limits.memory` to `2Gi`. The nodes have 16 GiB of memory.

    The pods restart a few seconds after each start. `kubectl describe pod` shows the following for the container:

    ```text
    Last State:     Terminated
      Reason:       OOMKilled
      Exit Code:    137
    ```

    You need to stop the restarts. What should you change in the deployment manifest?
  fr: |
    Fabrikam héberge une API d'inférence Python sur Azure Kubernetes Service (AKS). Au démarrage, l'API charge en mémoire un modèle d'environ 3 Gio. Le manifeste de déploiement définit `resources.requests.memory` sur `1Gi` et `resources.limits.memory` sur `2Gi`. Les nœuds disposent de 16 Gio de mémoire.

    Les pods redémarrent quelques secondes après chaque démarrage. `kubectl describe pod` affiche ceci pour le conteneur :

    ```text
    Last State:     Terminated
      Reason:       OOMKilled
      Exit Code:    137
    ```

    Vous devez faire cesser les redémarrages. Que devez-vous modifier dans le manifeste de déploiement ?
body:
  options:
    - { id: a, text: { en: "Increase `resources.requests.cpu` of the container.", fr: "Augmenter `resources.requests.cpu` du conteneur." } }
    - { id: b, text: { en: "Increase `resources.limits.memory` of the container.", fr: "Augmenter `resources.limits.memory` du conteneur." } }
    - { id: c, text: { en: "Increase `initialDelaySeconds` of the liveness probe.", fr: "Augmenter `initialDelaySeconds` de la sonde liveness." } }
    - { id: d, text: { en: "Set `imagePullPolicy` of the container to `Always`.", fr: "Définir `imagePullPolicy` du conteneur sur `Always`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The reason OOMKilled means the container exceeded its memory limit and the Linux OOM killer terminated it (exit code 137). The model needs about 3 GiB while the limit is 2Gi, so the memory limit (and usually the request) must be raised above what the process uses; the nodes have room for it.
    fr: |
      La raison OOMKilled signifie que le conteneur a dépassé sa limite de mémoire et que le tueur OOM de Linux l'a arrêté (code de sortie 137). Le modèle a besoin d'environ 3 Gio alors que la limite est de 2Gi : il faut relever la limite de mémoire (et en général la demande) au-dessus de ce qu'utilise le processus ; les nœuds ont la place nécessaire.
  options:
    a:
      en: CPU requests affect scheduling and CPU share; they do not change the memory limit that the container exceeds.
      fr: Les demandes de processeur influent sur la planification et la part de processeur ; elles ne modifient pas la limite de mémoire que le conteneur dépasse.
    c:
      en: A longer probe delay helps a slow start that a liveness probe kills (reason Error with exit code 137), not a container stopped by the OOM killer.
      fr: Un délai de sonde plus long aide un démarrage lent interrompu par une sonde liveness (raison Error avec le code de sortie 137), pas un conteneur arrêté par le tueur OOM.
    d:
      en: The pull policy decides when the image is downloaded; the image starts correctly and is killed later for memory.
      fr: La stratégie de tirage décide quand l'image est téléchargée ; l'image démarre correctement et est arrêtée plus tard pour cause de mémoire.
references:
  - title: Troubleshoot memory saturation in AKS clusters
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/availability-performance/identify-memory-saturation-aks
