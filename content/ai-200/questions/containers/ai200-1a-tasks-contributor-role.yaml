id: ai200-1a-tasks-contributor-role
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware uses an automation service with a managed identity to maintain the build pipelines of its AI services in the Azure container registry **crlitware**.

    The identity must create, update and run ACR tasks, queue quick builds with `az acr build` and read task logs. It must not push, pull or delete images directly, and it must not change registry settings such as networking or SKU.

    Which role should you assign to the identity on crlitware?
  fr: |
    Litware utilise un service d'automatisation doté d'une identité managée pour maintenir les pipelines de génération de ses services d'IA dans le registre de conteneurs Azure **crlitware**.

    L'identité doit créer, mettre à jour et exécuter des tâches ACR, mettre en file d'attente des générations rapides avec `az acr build` et lire les journaux des tâches. Elle ne doit pas envoyer, tirer ni supprimer directement des images, et ne doit pas modifier les paramètres du registre comme le réseau ou la référence SKU.

    Quel rôle devez-vous attribuer à l'identité sur crlitware ?
body:
  options:
    - { id: a, text: Container Registry Tasks Contributor }
    - { id: b, text: AcrPush }
    - { id: c, text: Container Registry Contributor and Data Access Configuration Administrator }
    - { id: d, text: Contributor }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Container Registry Tasks Contributor manages ACR tasks, task runs and agent pools, and runs az acr build and az acr run with access to task logs. It grants no data-plane access to images and no broader registry configuration.
    fr: |
      Container Registry Tasks Contributor gère les tâches ACR, leurs exécutions et les pools d'agents, et permet d'exécuter az acr build et az acr run avec accès aux journaux des tâches. Il n'accorde aucun accès aux images sur le plan de données ni aucune configuration plus large du registre.
  options:
    b: { en: "AcrPush pushes and pulls images directly and doesn't manage tasks.", fr: "AcrPush envoie et tire directement des images et ne gère pas les tâches." }
    c: { en: "This role configures the registry (SKU, networking, policies) but doesn't include ACR Tasks.", fr: "Ce rôle configure le registre (référence SKU, réseau, stratégies) mais n'inclut pas ACR Tasks." }
    d: { en: "Contributor could also change registry settings such as networking and SKU.", fr: "Contributor permettrait aussi de modifier les paramètres du registre comme le réseau et la référence SKU." }
references:
  - title: Azure Container Registry Microsoft Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
