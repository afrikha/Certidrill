id: ai200-1b-secret-restart
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a summarization service named **ca-summarize** in Azure Container Apps in single revision mode. The code reads an Azure OpenAI key from the environment variable `OPENAI_API_KEY`, which references the Container Apps secret `openai-key`.

    After the key was regenerated, you ran `az containerapp secret set` to store the new value, but the running replicas still send the old key.

    You need the replicas of the active revision to use the new value. You must not create a new revision. What should you do?
  fr: |
    Fabrikam exécute un service de synthèse nommé **ca-summarize** dans Azure Container Apps en mode de révision unique. Le code lit une clé Azure OpenAI dans la variable d'environnement `OPENAI_API_KEY`, qui référence le secret Container Apps `openai-key`.

    Après la régénération de la clé, vous avez exécuté `az containerapp secret set` pour stocker la nouvelle valeur, mais les réplicas en cours d'exécution envoient toujours l'ancienne clé.

    Vous devez faire en sorte que les réplicas de la révision active utilisent la nouvelle valeur. Vous ne devez pas créer de nouvelle révision. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az containerapp revision activate` for the active revision.", fr: "Exécuter `az containerapp revision activate` pour la révision active." } }
    - { id: b, text: { en: "Run `az containerapp ingress traffic set` to send all the traffic to the active revision.", fr: "Exécuter `az containerapp ingress traffic set` pour envoyer tout le trafic vers la révision active." } }
    - { id: c, text: { en: "Run `az containerapp revision restart` for the active revision.", fr: "Exécuter `az containerapp revision restart` pour la révision active." } }
    - { id: d, text: { en: "Run `az containerapp revision set-mode` to switch the app to multiple revision mode.", fr: "Exécuter `az containerapp revision set-mode` pour faire passer l'application en mode de révisions multiples." } }
answer: { optionId: c }
explanation:
  correct:
    en: Secrets are scoped to the application, and updating one neither creates a revision nor changes the running containers. To pick up the new value you either deploy a new revision or restart an existing one; because no new revision is allowed, you restart the active revision, whose replicas start again with the current secret value.
    fr: "Les secrets ont pour étendue l'application ; en mettre un à jour ne crée pas de révision et ne modifie pas les conteneurs en cours d'exécution. Pour prendre en compte la nouvelle valeur, vous déployez une nouvelle révision ou redémarrez une révision existante ; comme aucune nouvelle révision n'est autorisée, vous redémarrez la révision active, dont les réplicas repartent avec la valeur actuelle du secret."
  options:
    a:
      en: Activation applies to an inactive revision; the revision is already active and its replicas keep their environment.
      fr: L'activation s'applique à une révision inactive ; la révision est déjà active et ses réplicas conservent leur environnement.
    b:
      en: Traffic rules only route requests; they don't restart replicas, and weights need multiple revision mode.
      fr: Les règles de trafic ne font qu'acheminer les requêtes ; elles ne redémarrent pas les réplicas, et les poids exigent le mode de révisions multiples.
    d:
      en: The revision mode is an application-scope setting; changing it doesn't reload secret values in running replicas.
      fr: Le mode de révision est un paramètre d'étendue application ; le modifier ne recharge pas les valeurs des secrets dans les réplicas en cours d'exécution.
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
  - title: az containerapp revision
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp/revision
