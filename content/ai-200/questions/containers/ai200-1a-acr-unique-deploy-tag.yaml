id: ai200-1a-acr-unique-deploy-tag
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam builds an embedding worker image in Azure Pipelines and pushes it to the Azure container registry **crfabrikam**. The worker runs on several nodes that scale out during peak hours.

    After a recent scale-out, some nodes ran a newer build of the worker than the others. You need to ensure that every instance, including instances added later, runs exactly the same build until the next release.

    Which image reference should the release pipeline deploy?
  fr: |
    Fabrikam génère une image de worker de calcul d'incorporations dans Azure Pipelines et l'envoie au registre de conteneurs Azure **crfabrikam**. Le worker s'exécute sur plusieurs nœuds qui font l'objet d'un scale-out aux heures de pointe.

    Après un scale-out récent, certains nœuds ont exécuté un build du worker plus récent que les autres. Vous devez faire en sorte que chaque instance, y compris celles ajoutées plus tard, exécute exactement le même build jusqu'à la prochaine mise en production.

    Quelle référence d'image le pipeline de mise en production doit-il déployer ?
body:
  options:
    - { id: a, text: "crfabrikam.azurecr.io/embed/worker:latest" }
    - { id: b, text: "crfabrikam.azurecr.io/embed/worker:2" }
    - { id: c, text: "crfabrikam.azurecr.io/embed/worker:2.3" }
    - { id: d, text: "crfabrikam.azurecr.io/embed/worker:2.3.1-build4812" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A unique tag, here the version followed by the build ID, is never reused, so every node that pulls it, now or after a scale-out, gets the same image. Microsoft recommends unique tags for deployments and stable tags for base images.
    fr: |
      Une balise unique, ici la version suivie de l'ID de build, n'est jamais réutilisée ; chaque nœud qui la tire, maintenant ou après un scale-out, obtient donc la même image. Microsoft recommande les balises uniques pour les déploiements et les balises stables pour les images de base.
  options:
    a: { en: "latest is a stable tag that moves to every new push, which is exactly what caused the drift.", fr: "latest est une balise stable qui suit chaque nouvel envoi, ce qui est précisément la cause de l'écart." }
    b: { en: "A major-version tag keeps receiving every 2.x build, so new nodes can pull a different image.", fr: "Une balise de version majeure continue de recevoir chaque build 2.x : de nouveaux nœuds peuvent tirer une image différente." }
    c: { en: "A minor-version tag still receives servicing builds, so it is not guaranteed to point to the same image.", fr: "Une balise de version mineure reçoit encore des builds de maintenance : rien ne garantit qu'elle pointe toujours vers la même image." }
references:
  - title: Recommendations for tagging and versioning container images
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
