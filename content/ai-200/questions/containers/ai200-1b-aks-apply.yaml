id: ai200-1b-aks-apply
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys a retrieval API to an Azure Kubernetes Service (AKS) cluster from a release pipeline. The pipeline runs `kubectl create -f rag-api.yaml`. The first release succeeds, but every later release fails because the objects already exist.

    You need a single command that creates the objects on the first run and updates them on later runs, without deleting the running pods first. Which command should the pipeline run?
  fr: |
    Contoso déploie une API de récupération sur un cluster Azure Kubernetes Service (AKS) depuis un pipeline de mise en production. Le pipeline exécute `kubectl create -f rag-api.yaml`. La première mise en production réussit, mais toutes les suivantes échouent, car les objets existent déjà.

    Vous avez besoin d'une seule commande qui crée les objets à la première exécution et les met à jour lors des exécutions suivantes, sans supprimer d'abord les pods en cours d'exécution. Quelle commande le pipeline doit-il exécuter ?
body:
  options:
    - { id: a, text: "kubectl apply -f rag-api.yaml" }
    - { id: b, text: "kubectl replace --force -f rag-api.yaml" }
    - { id: c, text: "kubectl delete -f rag-api.yaml && kubectl create -f rag-api.yaml" }
    - { id: d, text: "kubectl create -f rag-api.yaml --dry-run=client" }
answer: { optionId: a }
explanation:
  correct:
    en: "`kubectl apply` is declarative: it creates the objects that don't exist and updates the existing ones to match the file, so the same command works for every release. A change to the pod template then rolls out new pods through the Deployment's rolling update."
    fr: "`kubectl apply` est déclaratif : il crée les objets qui n'existent pas et met à jour les objets existants pour qu'ils correspondent au fichier ; la même commande fonctionne donc à chaque mise en production. Une modification du modèle de pod déploie ensuite de nouveaux pods via la mise à jour propagée du Deployment."
  options:
    b: { en: "--force deletes and recreates the objects, which removes the running pods.", fr: "--force supprime puis recrée les objets, ce qui supprime les pods en cours d'exécution." }
    c: { en: "Deleting the objects first stops the running pods and interrupts the service.", fr: "Supprimer d'abord les objets arrête les pods en cours d'exécution et interrompt le service." }
    d: { en: "A client dry run only prints the objects; it changes nothing in the cluster.", fr: "Une exécution à blanc côté client affiche seulement les objets ; elle ne modifie rien dans le cluster." }
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
