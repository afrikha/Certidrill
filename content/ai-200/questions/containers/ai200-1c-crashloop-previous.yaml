id: ai200-1c-crashloop-previous
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a Python embedding worker on an Azure Kubernetes Service (AKS) cluster. The worker runs in a pod named **embed-worker-6b7f9-k2xqd** in the **ml** namespace.

    After a configuration change, the pod status alternates between **Error** and **CrashLoopBackOff**. When you read the logs of the pod, the container has just restarted and the output contains only the startup banner.

    You need to read the Python traceback that the container wrote before it exited.

    Which command should you run?
  fr: |
    Contoso exécute un worker Python de calcul d'embeddings sur un cluster Azure Kubernetes Service (AKS). Le worker s'exécute dans un pod nommé **embed-worker-6b7f9-k2xqd** dans l'espace de noms **ml**.

    Après une modification de configuration, l'état du pod alterne entre **Error** et **CrashLoopBackOff**. Quand vous lisez les journaux du pod, le conteneur vient de redémarrer et la sortie ne contient que la bannière de démarrage.

    Vous devez lire la trace de pile (traceback) Python que le conteneur a écrite avant de s'arrêter.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "kubectl logs embed-worker-6b7f9-k2xqd -n ml --follow" }
    - { id: b, text: "kubectl get events -n ml --sort-by=.metadata.creationTimestamp" }
    - { id: c, text: "kubectl logs embed-worker-6b7f9-k2xqd -n ml --previous" }
    - { id: d, text: "kubectl describe deployment embed-worker -n ml" }
answer: { optionId: c }
explanation:
  correct:
    en: The `--previous` flag of `kubectl logs` returns the stdout and stderr of the previous instance of the container, which is the instance that crashed. This is where the traceback written before the exit is found, while the plain log command shows the new instance that just started.
    fr: L'option `--previous` de `kubectl logs` renvoie stdout et stderr de l'instance précédente du conteneur, c'est-à-dire celle qui a planté. C'est là que se trouve la trace de pile écrite avant l'arrêt, alors que la commande de journaux simple affiche la nouvelle instance qui vient de démarrer.
  options:
    a:
      en: "`--follow` streams the logs of the current container instance, which has just restarted and does not contain the traceback."
      fr: "`--follow` diffuse les journaux de l'instance actuelle du conteneur, qui vient de redémarrer et ne contient pas la trace de pile."
    b:
      en: Kubernetes events report what happened to the pod (back-off, restarts), not what the Python process wrote to stderr.
      fr: Les événements Kubernetes indiquent ce qui est arrivé au pod (back-off, redémarrages), pas ce que le processus Python a écrit sur stderr.
    d:
      en: Describing the deployment shows its replicas, strategy and conditions; it contains no container output.
      fr: La description du déploiement affiche ses réplicas, sa stratégie et ses conditions ; elle ne contient aucune sortie de conteneur.
references:
  - title: Troubleshoot app connection issues in an AKS cluster
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/connectivity/connection-issues-application-hosted-aks-cluster
  - title: Pod is stuck in CrashLoopBackOff mode
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/pod-stuck-crashloopbackoff-mode
