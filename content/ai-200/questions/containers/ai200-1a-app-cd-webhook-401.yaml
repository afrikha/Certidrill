id: ai200-1a-app-cd-webhook-401
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a credit-risk scoring API as a custom container in the App Service app **app-wg-risk**. In Deployment Center, you selected the Azure container registry **crwoodgrove**, the image `risk/api` and the tag `prod`, and you set **Continuous deployment** to **On**.

    When the pipeline pushes a new image to `risk/api:prod`, the app keeps running the old image. The registry's webhook history shows that each call to the app fails with **401 Unauthorized**.

    What should you do?
  fr: |
    Woodgrove Bank exécute une API de notation du risque de crédit sous forme de conteneur personnalisé dans l'application App Service **app-wg-risk**. Dans le Centre de déploiement, vous avez sélectionné le registre de conteneurs Azure **crwoodgrove**, l'image `risk/api` et la balise `prod`, et vous avez défini **Continuous deployment** sur **On**.

    Quand le pipeline envoie une nouvelle image sur `risk/api:prod`, l'application continue d'exécuter l'ancienne image. L'historique du webhook du registre montre que chaque appel à l'application échoue avec **401 Unauthorized**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the AcrPush role on crwoodgrove to the app's managed identity.", fr: "Attribuer le rôle AcrPush sur crwoodgrove à l'identité managée de l'application." } }
    - { id: b, text: { en: "Enable the admin user on crwoodgrove and select admin credentials in Deployment Center.", fr: "Activer l'utilisateur administrateur sur crwoodgrove et sélectionner les informations d'administrateur dans le Centre de déploiement." } }
    - { id: c, text: { en: "Recreate the registry webhook with the delete action instead of the push action.", fr: "Recréer le webhook du registre avec l'action delete au lieu de l'action push." } }
    - { id: d, text: { en: "Enable Basic Auth Publishing Credentials in the app's general settings.", fr: "Activer Basic Auth Publishing Credentials dans les paramètres généraux de l'application." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With continuous deployment on, App Service adds a webhook to the registry; a push calls the webhook, which restarts the app so that it pulls the updated image. The webhook authenticates with basic publishing credentials, so when Basic Auth Publishing Credentials is disabled on the app, the call fails with 401 Unauthorized.
    fr: |
      Avec le déploiement continu activé, App Service ajoute un webhook au registre ; un envoi appelle le webhook, qui redémarre l'application pour qu'elle tire l'image mise à jour. Le webhook s'authentifie avec les informations de publication de base : quand Basic Auth Publishing Credentials est désactivé sur l'application, l'appel échoue avec 401 Unauthorized.
  options:
    a: { en: "The 401 error comes from the app's webhook endpoint, not from the registry, and the app only needs to pull.", fr: "L'erreur 401 provient du point de terminaison du webhook de l'application, pas du registre, et l'application a seulement besoin de tirer." }
    b: { en: "Registry credentials are used for the pull, not to authenticate the webhook call to the app.", fr: "Les informations d'identification du registre servent au tirage, pas à authentifier l'appel du webhook vers l'application." }
    c: { en: "The app must react to pushes; a delete action would never fire on a new image.", fr: "L'application doit réagir aux envois ; une action delete ne se déclencherait jamais pour une nouvelle image." }
references:
  - title: Continuous deployment with custom containers in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-ci-cd-custom-container
