id: ai200-1a-app-sidecar-otel
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a document Q&A API as a Linux custom container in the App Service app **app-pro-docqa**. The API sends its telemetry to an OpenTelemetry Collector at `http://localhost:4318`.

    The collector image is maintained by another team and stored in the Azure container registry **crproseware**. Both images must be pulled with the app's managed identity, and the collector must start, stop and scale together with the API.

    What should you do?
  fr: |
    Proseware exécute une API de questions-réponses sur des documents sous forme de conteneur personnalisé Linux dans l'application App Service **app-pro-docqa**. L'API envoie sa télémétrie à un collecteur OpenTelemetry à l'adresse `http://localhost:4318`.

    L'image du collecteur est maintenue par une autre équipe et stockée dans le registre de conteneurs Azure **crproseware**. Les deux images doivent être tirées avec l'identité managée de l'application, et le collecteur doit démarrer, s'arrêter et se mettre à l'échelle en même temps que l'API.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Convert the app to a Docker Compose multi-container app that defines both containers.", fr: "Convertir l'application en application multiconteneur Docker Compose qui définit les deux conteneurs." } }
    - { id: b, text: { en: "Add the collector to the app as a sidecar container next to the main container.", fr: "Ajouter le collecteur à l'application en tant que conteneur sidecar à côté du conteneur principal." } }
    - { id: c, text: { en: "Deploy the collector to a second App Service app and integrate both apps with the same virtual network.", fr: "Déployer le collecteur dans une deuxième application App Service et intégrer les deux applications au même réseau virtuel." } }
    - { id: d, text: { en: "Set WEBSITES_PORT to 4318 so that App Service routes telemetry to the collector.", fr: "Définir WEBSITES_PORT sur 4318 pour qu'App Service route la télémétrie vers le collecteur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A sidecar runs in the same environment as the main container: the containers share the network namespace and communicate over localhost, they start, stop and scale together, and images from a private registry such as Azure Container Registry are pulled with a managed identity or admin credentials. An app can have up to nine sidecars.
    fr: |
      Un sidecar s'exécute dans le même environnement que le conteneur principal : les conteneurs partagent l'espace de noms réseau et communiquent par localhost, ils démarrent, s'arrêtent et se mettent à l'échelle ensemble, et les images d'un registre privé comme Azure Container Registry sont tirées avec une identité managée ou des informations d'administrateur. Une application peut compter jusqu'à neuf sidecars.
  options:
    a: { en: "Docker Compose apps don't support managed identities, and Docker Compose support retires on March 31, 2027, replaced by sidecars.", fr: "Les applications Docker Compose ne prennent pas en charge les identités managées, et Docker Compose est mis hors service le 31 mars 2027 au profit des sidecars." }
    c: { en: "A separate app isn't reachable on localhost and doesn't scale together with the API.", fr: "Une application distincte n'est pas joignable par localhost et ne se met pas à l'échelle avec l'API." }
    d: { en: "WEBSITES_PORT sets the port of the main container for incoming HTTP traffic; it doesn't deploy a collector.", fr: "WEBSITES_PORT définit le port du conteneur principal pour le trafic HTTP entrant ; il ne déploie aucun collecteur." }
references:
  - title: Sidecars in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-sidecar
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
