id: ai200-1a-acr-reclaim-storage
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Azure container registry **crfabrikam** contains the image `vision/ocr:1.2.0`, pushed six months ago. Its manifest has no other tag, it isn't locked, and no deployment uses it anymore. Some of its layers are unique to this image.

    You need to free the storage used by the unique layers of this image.

    Which two commands should you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le registre de conteneurs Azure **crfabrikam** contient l'image `vision/ocr:1.2.0`, envoyée il y a six mois. Son manifeste n'a aucune autre balise, il n'est pas verrouillé et plus aucun déploiement ne l'utilise. Certaines de ses couches sont propres à cette image.

    Vous devez libérer le stockage occupé par les couches propres à cette image.

    Quelles sont les deux commandes à exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "az acr repository untag --name crfabrikam --image vision/ocr:1.2.0" }
    - { id: b, text: "az acr repository delete --name crfabrikam --image vision/ocr:1.2.0" }
    - { id: c, text: "az acr repository delete --name crfabrikam --image vision/ocr@sha256:<digest-of-1.2.0>" }
    - { id: d, text: "az acr repository update --name crfabrikam --image vision/ocr:1.2.0 --delete-enabled true" }
    - { id: e, text: "az acr run --registry crfabrikam --cmd \"acr purge --filter 'vision/ocr:^1.2.0$' --ago 1d\" /dev/null" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Deleting by tag or by manifest digest removes the manifest, every tag that points to it and the layers that no other image uses. Shared layers stay in the registry until no image references them.
    fr: |
      La suppression par balise ou par synthèse (digest) du manifeste supprime le manifeste, toutes les balises qui pointent vers lui et les couches qu'aucune autre image n'utilise. Les couches partagées restent dans le registre tant qu'une image les référence.
  options:
    a: { en: "Untagging removes only the tag reference: the manifest and its layers stay, so no space is freed.", fr: "Retirer la balise supprime seulement la référence : le manifeste et ses couches restent, aucun espace n'est libéré." }
    d: { en: "This command only sets the lock attribute; it deletes nothing.", fr: "Cette commande définit seulement l'attribut de verrouillage ; elle ne supprime rien." }
    e: { en: "Without --untagged, acr purge deletes the matching tags but leaves the now untagged manifest and its layers in the registry.", fr: "Sans --untagged, acr purge supprime les balises correspondantes mais laisse dans le registre le manifeste devenu non balisé et ses couches." }
references:
  - title: Delete container images in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-delete
  - title: Automatically purge images from an Azure container registry (preview)
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-auto-purge
