id: ai200-1c-aks-symptom-command
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs a Python question-answering service on Azure Kubernetes Service (AKS). The service consists of a deployment named **qa-api** and a Service of the same name. While troubleshooting, you need to collect specific information.

    Which command should you use for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute un service Python de questions-réponses sur Azure Kubernetes Service (AKS). Le service se compose d'un déploiement nommé **qa-api** et d'un Service du même nom. Pendant le dépannage, vous devez recueillir des informations précises.

    Quelle commande devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: previous, text: "kubectl logs <pod> --previous" }
    - { id: describe, text: "kubectl describe pod <pod>" }
    - { id: endpoints, text: "kubectl get endpoints qa-api" }
    - { id: exec, text: "kubectl exec <pod> -- ss -lntp" }
    - { id: topnodes, text: "kubectl top nodes" }
    - { id: undo, text: "kubectl rollout undo deployment/qa-api" }
  targets:
    - id: crash
      text: { en: "A pod is in CrashLoopBackOff: read the exception that the crashed container instance printed.", fr: "Un pod est à l'état CrashLoopBackOff : lire l'exception affichée par l'instance du conteneur qui a planté." }
    - id: pending
      text: { en: "A pod stays Pending: read the FailedScheduling message of the pod.", fr: "Un pod reste à l'état Pending : lire le message FailedScheduling du pod." }
    - id: selector
      text: { en: "Calls to the Service time out: find out whether the Service routes to any ready pod.", fr: "Les appels au Service expirent : déterminer si le Service achemine vers au moins un pod prêt." }
    - id: listen
      text: { en: "The pod IP refuses connections: check on which address and port the process listens.", fr: "L'adresse IP du pod refuse les connexions : vérifier sur quelle adresse et quel port le processus écoute." }
answer:
  mapping: { crash: previous, pending: describe, selector: endpoints, listen: exec }
explanation:
  correct:
    en: |
      `kubectl logs --previous` returns the output of the previous, crashed instance of the container. `kubectl describe pod` lists the events of the pod, including FailedScheduling and its reason. `kubectl get endpoints` shows the IP addresses of the ready pods that the Service selector matches; an empty list means no backend. `kubectl exec ... -- ss -lntp` runs inside the container and shows the listening sockets, which reveals an app bound to 127.0.0.1 or to the wrong port.
    fr: |
      `kubectl logs --previous` renvoie la sortie de l'instance précédente du conteneur, celle qui a planté. `kubectl describe pod` liste les événements du pod, dont FailedScheduling et sa raison. `kubectl get endpoints` affiche les adresses IP des pods prêts qui correspondent au sélecteur du Service ; une liste vide signifie qu'il n'y a aucun back-end. `kubectl exec ... -- ss -lntp` s'exécute dans le conteneur et affiche les sockets en écoute, ce qui révèle une application liée à 127.0.0.1 ou au mauvais port.
  options:
    topnodes:
      en: kubectl top nodes shows the current CPU and memory use of the nodes, not the scheduler message of a pod.
      fr: kubectl top nodes affiche l'utilisation actuelle du processeur et de la mémoire des nœuds, pas le message du planificateur pour un pod.
    undo:
      en: kubectl rollout undo returns the deployment to its previous revision; it changes the cluster instead of collecting information.
      fr: kubectl rollout undo ramène le déploiement à sa révision précédente ; il modifie le cluster au lieu de recueillir des informations.
references:
  - title: Troubleshoot connections to pods and services within an AKS cluster
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/connectivity/troubleshoot-connection-pods-services-same-cluster
  - title: Troubleshoot AKS pod scheduler errors
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/availability-performance/troubleshoot-pod-scheduler-errors
