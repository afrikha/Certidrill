id: ai200-1b-aks-workload-id-flags
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs the Azure Kubernetes Service (AKS) cluster **aks-lex**, which has neither an OIDC issuer nor Microsoft Entra Workload ID enabled. The team will add a ServiceAccount annotated with the client ID of a user-assigned managed identity to its manifests so that the pods of a document API can call Azure OpenAI without secrets.

    Which command should you run on the cluster first?
  fr: |
    Litware exécute le cluster Azure Kubernetes Service (AKS) **aks-lex**, sur lequel ni un émetteur OIDC ni Microsoft Entra Workload ID ne sont activés. L'équipe va ajouter à ses manifestes un ServiceAccount annoté avec l'ID client d'une identité managée affectée par l'utilisateur, afin que les pods d'une API documentaire puissent appeler Azure OpenAI sans secret.

    Quelle commande devez-vous exécuter d'abord sur le cluster ?
body:
  options:
    - { id: a, text: "az aks update --resource-group rg-lex --name aks-lex --enable-managed-identity" }
    - { id: b, text: "az aks enable-addons --resource-group rg-lex --name aks-lex --addons azure-keyvault-secrets-provider" }
    - { id: c, text: "az aks update --resource-group rg-lex --name aks-lex --enable-oidc-issuer --enable-workload-identity" }
    - { id: d, text: "az aks update --resource-group rg-lex --name aks-lex --attach-acr crlitware" }
answer: { optionId: c }
explanation:
  correct:
    en: "Workload ID needs the cluster's OIDC issuer, which issues the service account tokens that Microsoft Entra ID trusts through a federated credential, and the workload identity feature, whose webhook injects the token into pods labeled `azure.workload.identity/use: \"true\"`. `--enable-oidc-issuer` and `--enable-workload-identity` enable both."
    fr: "Workload ID a besoin de l'émetteur OIDC du cluster, qui émet les jetons de compte de service que Microsoft Entra ID approuve via une information d'identification fédérée, et de la fonctionnalité d'identité de charge de travail, dont le webhook injecte le jeton dans les pods portant l'étiquette `azure.workload.identity/use: \"true\"`. `--enable-oidc-issuer` et `--enable-workload-identity` activent les deux."
  options:
    a: { en: "This parameter converts the cluster identity to a managed identity; it doesn't let pods use a workload identity.", fr: "Ce paramètre convertit l'identité du cluster en identité managée ; il ne permet pas aux pods d'utiliser une identité de charge de travail." }
    b: { en: "The Secrets Store CSI Driver add-on mounts Key Vault secrets; it doesn't enable the OIDC issuer or the workload identity webhook.", fr: "Le module complémentaire Secrets Store CSI Driver monte des secrets Key Vault ; il n'active ni l'émetteur OIDC ni le webhook d'identité de charge de travail." }
    d: { en: "--attach-acr grants the nodes AcrPull on a registry; it has nothing to do with pod identities.", fr: "--attach-acr accorde AcrPull aux nœuds sur un registre ; cela n'a aucun rapport avec les identités des pods." }
references:
  - title: Deploy and Configure an Azure Kubernetes Service (AKS) Cluster with Microsoft Entra Workload ID
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-deploy-cluster
  - title: Use a Microsoft Entra Workload ID on Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
