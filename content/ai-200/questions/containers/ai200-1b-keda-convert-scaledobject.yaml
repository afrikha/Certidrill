id: ai200-1b-keda-convert-scaledobject
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is moving a summarization worker from an AKS cluster to Azure Container Apps. On AKS, the worker scales with the KEDA trigger and the TriggerAuthentication shown in the exhibit. The Service Bus connection string is stored in the Kubernetes secret `sb-secrets` under the key `sb-connection`.

    You need the container app to scale on the same queue with the same target, authenticating with the connection string.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware migre un worker de synthèse d'un cluster AKS vers Azure Container Apps. Sur AKS, le worker se met à l'échelle avec le déclencheur KEDA et la ressource TriggerAuthentication présentés dans la pièce. La chaîne de connexion Service Bus est stockée dans le secret Kubernetes `sb-secrets` sous la clé `sb-connection`.

    Vous devez faire en sorte que l'application conteneur se mette à l'échelle sur la même file d'attente avec la même cible, en s'authentifiant avec la chaîne de connexion.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: keda
    title: { en: "KEDA configuration on AKS", fr: "Configuration KEDA sur AKS" }
    body: |
      ```yaml
      triggers:
        - type: azure-servicebus
          metadata:
            queueName: summaries
            namespace: sb-litware
            messageCount: "10"
          authenticationRef:
            name: sb-auth
      ---
      apiVersion: keda.sh/v1alpha1
      kind: TriggerAuthentication
      metadata:
        name: sb-auth
      spec:
        secretTargetRef:
          - parameter: connection
            name: sb-secrets
            key: sb-connection
      ```
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an app secret named `sb-connection` that contains the connection string.", fr: "Ajouter un secret d'application nommé `sb-connection` qui contient la chaîne de connexion." } }
    - { id: b, text: { en: "Apply the TriggerAuthentication manifest to the Container Apps environment.", fr: "Appliquer le manifeste TriggerAuthentication à l'environnement Container Apps." } }
    - { id: c, text: { en: "Add a custom scale rule of type `azure-servicebus` with the same metadata and an `auth` entry with `secretRef: sb-connection` and `triggerParameter: connection`.", fr: "Ajouter une règle de mise à l'échelle personnalisée de type `azure-servicebus` avec les mêmes métadonnées et une entrée `auth` avec `secretRef: sb-connection` et `triggerParameter: connection`." } }
    - { id: d, text: { en: "Add an environment variable named `connection` that contains the connection string to the container.", fr: "Ajouter au conteneur une variable d'environnement nommée `connection` qui contient la chaîne de connexion." } }
    - { id: e, text: { en: "Add an HTTP scale rule with `concurrentRequests` set to 10.", fr: "Ajouter une règle de mise à l'échelle HTTP avec `concurrentRequests` défini sur 10." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A Container Apps custom rule reuses the KEDA trigger type and all its metadata. The TriggerAuthentication is replaced by an `auth` entry, where `secretTargetRef.parameter` becomes `triggerParameter` and `secretTargetRef.key` becomes `secretRef`, the name of a secret that you create in the app's `secrets` array.
    fr: "Une règle personnalisée Container Apps reprend le type de déclencheur KEDA et toutes ses métadonnées. La ressource TriggerAuthentication est remplacée par une entrée `auth`, où `secretTargetRef.parameter` devient `triggerParameter` et `secretTargetRef.key` devient `secretRef`, le nom d'un secret que vous créez dans le tableau `secrets` de l'application."
  options:
    b: { en: "Container Apps doesn't expose the Kubernetes API, so you can't apply KEDA resources to the environment.", fr: "Container Apps n'expose pas l'API Kubernetes : vous ne pouvez pas appliquer de ressources KEDA à l'environnement." }
    d: { en: "The scaler reads its credentials from the rule's `auth` entries, not from a container variable named after the parameter.", fr: "Le scaler lit ses informations d'identification dans les entrées `auth` de la règle, pas dans une variable de conteneur portant le nom du paramètre." }
    e: { en: "The worker scales on the queue length; an HTTP rule measures HTTP requests.", fr: "Le worker se met à l'échelle selon la longueur de la file d'attente ; une règle HTTP mesure des requêtes HTTP." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
