id: ai200-1c-kql-aca-console
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam hosts a Python summarization API in a container app named **ca-summarizer**. The logs destination of the Azure Container Apps environment is a Log Analytics workspace.

    Users report failed summaries. You need a query that returns the Python tracebacks that the app printed during the last 30 minutes, with the revision and the container that wrote them.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam héberge une API Python de synthèse dans une application conteneur nommée **ca-summarizer**. La destination des journaux de l'environnement Azure Container Apps est un espace de travail Log Analytics.

    Des utilisateurs signalent des synthèses en échec. Vous avez besoin d'une requête qui renvoie les traces de pile (tracebacks) Python affichées par l'application au cours des 30 dernières minutes, avec la révision et le conteneur qui les ont écrites.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(30m)
    | where [[app]] == "ca-summarizer"
    | where [[msg]] contains "Traceback"
    | project TimeGenerated, RevisionName_s, ContainerName_s
  slots:
    - id: table
      options:
        - { id: console, text: ContainerAppConsoleLogs_CL }
        - { id: system, text: ContainerAppSystemLogs_CL }
        - { id: http, text: ContainerAppHTTPLogs }
        - { id: v2, text: ContainerLogV2 }
    - id: app
      options:
        - { id: appname, text: ContainerAppName_s }
        - { id: pod, text: PodName }
        - { id: env, text: EnvironmentName_s }
    - id: msg
      options:
        - { id: logs, text: Log_s }
        - { id: logmsg, text: LogMessage }
        - { id: details, text: ResponseCodeDetails }
answer:
  values: { table: console, app: appname, msg: logs }
explanation:
  correct:
    en: |
      What a container app writes to stdout and stderr, such as a Python traceback, lands in the `ContainerAppConsoleLogs_CL` table when the environment sends its logs to Log Analytics. The app is filtered on `ContainerAppName_s`, and the text of each line is in `Log_s`.
    fr: |
      Ce qu'une application conteneur écrit sur stdout et stderr, comme une trace de pile Python, arrive dans la table `ContainerAppConsoleLogs_CL` lorsque l'environnement envoie ses journaux vers Log Analytics. L'application est filtrée sur `ContainerAppName_s`, et le texte de chaque ligne se trouve dans `Log_s`.
  options:
    system:
      en: ContainerAppSystemLogs_CL holds events of the Container Apps service (revision provisioning, scaling), not the output of the code.
      fr: ContainerAppSystemLogs_CL contient les événements du service Container Apps (approvisionnement des révisions, mise à l'échelle), pas la sortie du code.
    http:
      en: ContainerAppHTTPLogs holds ingress requests, sent through diagnostic settings, not the console output.
      fr: ContainerAppHTTPLogs contient les requêtes d'entrée, envoyées par les paramètres de diagnostic, pas la sortie de console.
    v2:
      en: ContainerLogV2 is the Container insights table for AKS.
      fr: ContainerLogV2 est la table Container insights pour AKS.
    env:
      en: EnvironmentName_s would return every app of the environment, not ca-summarizer.
      fr: EnvironmentName_s renverrait toutes les applications de l'environnement, pas ca-summarizer.
references:
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
