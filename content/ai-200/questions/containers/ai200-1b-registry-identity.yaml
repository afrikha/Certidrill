id: ai200-1b-registry-identity
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is deploying a speech-to-text service named **ca-stt** to Azure Container Apps by using `az containerapp create`. The image is stored in the private Azure Container Registry **crtailspin**.

    The app must pull the image without any registry username or password stored in its configuration, and administrative effort must be minimized.

    Which parameters should you add to the command?
  fr: |
    Tailspin Toys déploie un service de transcription vocale nommé **ca-stt** sur Azure Container Apps à l'aide de `az containerapp create`. L'image est stockée dans le registre Azure Container Registry privé **crtailspin**.

    L'application doit tirer l'image sans qu'aucun nom d'utilisateur ni mot de passe de registre ne soit stocké dans sa configuration, et l'effort d'administration doit être réduit au minimum.

    Quels paramètres devez-vous ajouter à la commande ?
body:
  options:
    - { id: a, text: "--registry-server crtailspin.azurecr.io --registry-identity system" }
    - { id: b, text: "--registry-server crtailspin.azurecr.io --registry-username crtailspin --registry-password $ACR_PASSWORD" }
    - { id: c, text: "--registry-server crtailspin.azurecr.io --scale-rule-identity system" }
    - { id: d, text: "--registry-server crtailspin.azurecr.io --secrets acr-password=$ACR_PASSWORD" }
answer: { optionId: a }
explanation:
  correct:
    en: "`--registry-identity` makes the app authenticate to Azure Container Registry with a managed identity instead of a username and password; `system` uses the system-assigned identity. The CLI creates the AcrPull role assignment for the identity when it can, so no credential has to be stored or rotated."
    fr: "`--registry-identity` fait s'authentifier l'application auprès d'Azure Container Registry avec une identité managée au lieu d'un nom d'utilisateur et d'un mot de passe ; `system` utilise l'identité affectée par le système. L'interface CLI crée l'attribution du rôle AcrPull pour l'identité quand c'est possible : aucune information d'identification n'est à stocker ni à renouveler."
  options:
    b:
      en: The registry password would be stored in the app configuration as a secret, which the requirement forbids.
      fr: Le mot de passe du registre serait stocké dans la configuration de l'application sous forme de secret, ce que l'exigence interdit.
    c:
      en: "`--scale-rule-identity` sets the identity that a scale rule uses to read its event source, not the registry identity."
      fr: "`--scale-rule-identity` définit l'identité qu'une règle de mise à l'échelle utilise pour lire sa source d'événements, pas l'identité du registre."
    d:
      en: Storing the password as an app secret still keeps a registry credential in the configuration, and nothing links the secret to the registry.
      fr: Stocker le mot de passe comme secret de l'application conserve une information d'identification de registre dans la configuration, et rien ne relie ce secret au registre.
references:
  - title: az containerapp
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp
