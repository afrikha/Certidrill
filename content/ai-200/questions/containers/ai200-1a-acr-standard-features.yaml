id: ai200-1a-acr-standard-features
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores the images of its recommendation service in a Standard tier Azure container registry named **crwingtip**. Management wants to evaluate new registry features without paying for a higher tier.

    Which two features can you use on crwingtip without changing its tier?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke les images de son service de recommandation dans un registre de conteneurs Azure de niveau Standard nommé **crwingtip**. La direction veut évaluer de nouvelles fonctionnalités du registre sans payer un niveau supérieur.

    Quelles sont les deux fonctionnalités que vous pouvez utiliser sur crwingtip sans changer son niveau ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Geo-replication to a second region", fr: "Géoréplication vers une seconde région" } }
    - { id: b, text: { en: "Artifact cache rules for Docker Hub images", fr: "Règles de cache d'artefacts pour les images Docker Hub" } }
    - { id: c, text: { en: "A retention policy for untagged manifests", fr: "Une stratégie de rétention des manifestes non balisés" } }
    - { id: d, text: { en: "Anonymous pull access", fr: "L'accès anonyme en tirage (pull)" } }
    - { id: e, text: { en: "Encryption with a customer-managed key", fr: "Le chiffrement avec une clé gérée par le client" } }
    - { id: f, text: { en: "Private endpoints", fr: "Les points de terminaison privés" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Standard includes everything in Basic plus more storage and throughput, artifact cache rules and anonymous pull access. Geo-replication, retention policies for untagged manifests, customer-managed keys and private endpoints require Premium.
    fr: |
      Standard comprend tout ce que propose Basic, plus davantage de stockage et de débit, les règles de cache d'artefacts et l'accès anonyme en tirage. La géoréplication, la stratégie de rétention des manifestes non balisés, les clés gérées par le client et les points de terminaison privés nécessitent Premium.
  options:
    a: { en: "Geo-replication is a Premium-only feature.", fr: "La géoréplication est réservée au niveau Premium." }
    c: { en: "The retention policy for untagged manifests is a Premium-only feature.", fr: "La stratégie de rétention des manifestes non balisés est réservée au niveau Premium." }
    e: { en: "Customer-managed keys are a Premium-only feature.", fr: "Les clés gérées par le client sont réservées au niveau Premium." }
    f: { en: "Private endpoints are a Premium-only feature.", fr: "Les points de terminaison privés sont réservés au niveau Premium." }
references:
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
