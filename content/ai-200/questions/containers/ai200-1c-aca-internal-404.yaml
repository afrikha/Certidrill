id: ai200-1c-aca-internal-404
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove hosts a retrieval API in a container app named **ca-ragapi** in a resource group named **rg-rag**. The Azure Container Apps environment is an internal environment integrated with a virtual network named **vnet-rag**. The ingress of ca-ragapi uses HTTP with the target port set to the port the application listens on, and the traffic setting is **Limited to Container Apps Environment**.

    A Python client on a virtual machine in vnet-rag calls the FQDN of ca-ragapi. The name resolves and the TLS handshake succeeds, but every request returns HTTP 404 with the message `Container App is stopped or does not exist`. The revision is healthy.

    You need the client on the virtual machine to reach the API. The API must not become reachable from the internet.

    Which command should you run?
  fr: |
    Woodgrove héberge une API de récupération dans une application conteneur nommée **ca-ragapi** dans un groupe de ressources nommé **rg-rag**. L'environnement Azure Container Apps est un environnement interne intégré à un réseau virtuel nommé **vnet-rag**. L'entrée de ca-ragapi utilise HTTP avec un port cible égal au port d'écoute de l'application, et le paramètre de trafic est **Limited to Container Apps Environment**.

    Un client Python situé sur une machine virtuelle de vnet-rag appelle le FQDN de ca-ragapi. Le nom est résolu et la négociation TLS réussit, mais chaque requête renvoie HTTP 404 avec le message `Container App is stopped or does not exist`. La révision est saine.

    Le client de la machine virtuelle doit atteindre l'API. L'API ne doit pas devenir accessible depuis Internet.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az containerapp ingress update --name ca-ragapi --resource-group rg-rag --transport http2" }
    - { id: b, text: "az containerapp ingress update --name ca-ragapi --resource-group rg-rag --type external" }
    - { id: c, text: "az containerapp ingress update --name ca-ragapi --resource-group rg-rag --allow-insecure true" }
    - { id: d, text: "az containerapp update --name ca-ragapi --resource-group rg-rag --min-replicas 1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Internal ingress accepts only requests that come from inside the Container Apps environment, so requests from the virtual network get a 404 from the environment's load balancer. External ingress exposes the app through the environment's inbound IP address; because the environment is internal, that address is private, so the app is reachable from vnet-rag but still not from the internet.
    fr: |
      Une entrée interne n'accepte que les requêtes provenant de l'environnement Container Apps : les requêtes issues du réseau virtuel reçoivent une erreur 404 de l'équilibreur de charge de l'environnement. Une entrée externe expose l'application par l'adresse IP entrante de l'environnement ; comme l'environnement est interne, cette adresse est privée : l'application est accessible depuis vnet-rag, mais toujours pas depuis Internet.
  options:
    a:
      en: |
        The transport decides between HTTP/1 and HTTP/2 for a client that reaches the app; it does not open the app to callers outside the environment.
      fr: |
        Le transport choisit entre HTTP/1 et HTTP/2 pour un client qui atteint l'application ; il n'ouvre pas l'application aux appelants extérieurs à l'environnement.
    c:
      en: |
        Allowing insecure connections only accepts plain HTTP instead of redirecting it to HTTPS; the TLS handshake already succeeds and the 404 remains.
      fr: |
        Autoriser les connexions non sécurisées accepte simplement HTTP au lieu de le rediriger vers HTTPS ; la négociation TLS réussit déjà et l'erreur 404 demeure.
    d:
      en: |
        The revision is already healthy with running replicas; a minimum replica count does not change who may reach the ingress.
      fr: |
        La révision est déjà saine et possède des réplicas en cours d'exécution ; un nombre minimal de réplicas ne change pas qui peut atteindre l'entrée.
references:
  - title: Troubleshoot a container app
    url: https://learn.microsoft.com/en-us/azure/container-apps/troubleshooting
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
