id: ai200-1b-keda-http-cli
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs an interactive advisory chatbot named **ca-advisor** in Azure Container Apps. You need to configure its scaling to meet the following requirements:

    - The first request of the day must not wait for a cold start.
    - The app must never scale beyond 20 replicas.
    - A replica must be added when the replicas handle more than 50 concurrent requests each.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute un chatbot de conseil interactif nommé **ca-advisor** dans Azure Container Apps. Vous devez configurer sa mise à l'échelle pour respecter les exigences suivantes :

    - La première requête de la journée ne doit pas attendre un démarrage à froid.
    - L'application ne doit jamais dépasser 20 réplicas.
    - Un réplica doit être ajouté quand les réplicas traitent chacun plus de 50 requêtes simultanées.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp update --name ca-advisor --resource-group rg-advisor \
      --min-replicas [[min]] --max-replicas 20 \
      --scale-rule-name http-load --scale-rule-type [[type]] \
      --scale-rule-http-concurrency [[conc]]
  slots:
    - id: min
      options:
        - { id: m0, text: "0" }
        - { id: m1, text: "1" }
        - { id: m20, text: "20" }
    - id: type
      options:
        - { id: http, text: http }
        - { id: tcp, text: tcp }
        - { id: servicebus, text: azure-servicebus }
    - id: conc
      options:
        - { id: c10, text: "10" }
        - { id: c20, text: "20" }
        - { id: c50, text: "50" }
answer:
  values: { min: m1, type: http, conc: c50 }
explanation:
  correct:
    en: "A minimum of one replica keeps an instance always running, so no request waits for a cold start. The `http` rule scales on concurrent HTTP requests, and `--scale-rule-http-concurrency 50` sets the `concurrentRequests` target per replica; `--max-replicas 20` caps the scale-out."
    fr: "Un minimum d'un réplica maintient une instance toujours en cours d'exécution : aucune requête n'attend un démarrage à froid. La règle `http` se met à l'échelle selon les requêtes HTTP simultanées, et `--scale-rule-http-concurrency 50` définit la cible `concurrentRequests` par réplica ; `--max-replicas 20` plafonne le scale-out."
  options:
    m0: { en: "With 0 replicas, the first request of the day triggers a cold start.", fr: "Avec 0 réplica, la première requête de la journée déclenche un démarrage à froid." }
    m20: { en: "20 permanent replicas would meet the latency goal but waste resources and disable scaling.", fr: "20 réplicas permanents respecteraient l'objectif de latence, mais gaspilleraient des ressources et désactiveraient la mise à l'échelle." }
    tcp: { en: "A TCP rule counts TCP connections and requires TCP transport.", fr: "Une règle TCP compte les connexions TCP et exige le transport TCP." }
    servicebus: { en: "The chatbot receives HTTP requests, not Service Bus messages.", fr: "Le chatbot reçoit des requêtes HTTP, pas des messages Service Bus." }
    c10: { en: "10 is the default concurrency; it would add replicas well before 50 requests.", fr: "10 est la concurrence par défaut ; elle ajouterait des réplicas bien avant 50 requêtes." }
    c20: { en: "20 would scale out before each replica reaches 50 concurrent requests.", fr: "20 provoquerait un scale-out avant que chaque réplica atteigne 50 requêtes simultanées." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
  - title: az containerapp
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp
