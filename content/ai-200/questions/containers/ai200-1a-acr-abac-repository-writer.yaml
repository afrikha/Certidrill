id: ai200-1a-acr-abac-repository-writer
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum stores the images of several AI teams in the Azure container registry **cradatum**. The registry uses the **RBAC Registry + ABAC Repository Permissions** role assignment mode.

    The pipeline identity of the RAG team must be able to push and pull images in the repositories whose names start with `rag/`. It must not be able to delete images, and it must have no access to the other repositories.

    What should you assign to the pipeline identity?
  fr: |
    Adatum stocke les images de plusieurs équipes d'IA dans le registre de conteneurs Azure **cradatum**. Le registre utilise le mode d'attribution de rôles **RBAC Registry + ABAC Repository Permissions**.

    L'identité du pipeline de l'équipe RAG doit pouvoir envoyer et tirer des images dans les dépôts dont le nom commence par `rag/`. Elle ne doit pas pouvoir supprimer d'images et ne doit avoir aucun accès aux autres dépôts.

    Que devez-vous attribuer à l'identité du pipeline ?
body:
  options:
    - { id: a, text: { en: "The AcrPush role on cradatum", fr: "Le rôle AcrPush sur cradatum" } }
    - { id: b, text: { en: "The Container Registry Repository Contributor role on cradatum, with a condition on repositories that start with rag/", fr: "Le rôle Container Registry Repository Contributor sur cradatum, avec une condition sur les dépôts commençant par rag/" } }
    - { id: c, text: { en: "The Container Registry Repository Writer role on cradatum, with a condition on repositories that start with rag/", fr: "Le rôle Container Registry Repository Writer sur cradatum, avec une condition sur les dépôts commençant par rag/" } }
    - { id: d, text: { en: "The Container Registry Repository Writer role on cradatum, without a condition", fr: "Le rôle Container Registry Repository Writer sur cradatum, sans condition" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Container Registry Repository Writer allows push, pull and update but not delete. In the ABAC mode, the repository roles accept a Microsoft Entra ABAC condition that limits the assignment to the repositories whose name matches rag/, so the identity has no access elsewhere.
    fr: |
      Container Registry Repository Writer permet l'envoi, le tirage et la mise à jour, mais pas la suppression. En mode ABAC, les rôles de dépôt acceptent une condition ABAC Microsoft Entra qui limite l'attribution aux dépôts dont le nom correspond à rag/ : l'identité n'a donc aucun accès ailleurs.
  options:
    a: { en: "AcrPush can't carry a repository condition, so it would apply to every repository of the registry.", fr: "AcrPush ne peut pas porter de condition de dépôt : il s'appliquerait à tous les dépôts du registre." }
    b: { en: "Repository Contributor also allows deleting images and tags, which the requirement forbids.", fr: "Repository Contributor permet aussi de supprimer des images et des balises, ce que l'exigence interdit." }
    d: { en: "Without a condition, the role applies to all the repositories of the registry.", fr: "Sans condition, le rôle s'applique à tous les dépôts du registre." }
references:
  - title: Azure Container Registry Microsoft Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
