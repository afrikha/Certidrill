id: ai200-1a-tasks-create-git-context
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores the code of its invoice-extraction API in the GitHub repository `northwind/ocr-api`. The Dockerfile and the application code are in the `src` folder of the `main` branch.

    You need to create an ACR task that builds the image on every commit to `main`. Each image must get a tag that is never reused and that identifies the task run that produced it.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke le code de son API d'extraction de factures dans le dépôt GitHub `northwind/ocr-api`. Le Dockerfile et le code de l'application se trouvent dans le dossier `src` de la branche `main`.

    Vous devez créer une tâche ACR qui génère l'image à chaque commit sur `main`. Chaque image doit recevoir une balise qui n'est jamais réutilisée et qui identifie l'exécution de tâche qui l'a produite.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr task create --registry crnorthwind --name build-ocr \
      --context [[ctx]] \
      --file Dockerfile \
      --image [[img]] \
      --git-access-token $GIT_PAT
  slots:
    - id: ctx
      options:
        - { id: branchdir, text: "https://github.com/northwind/ocr-api.git#main:src" }
        - { id: dirbranch, text: "https://github.com/northwind/ocr-api.git#src:main" }
        - { id: tree, text: "https://github.com/northwind/ocr-api/tree/main/src" }
        - { id: local, text: "./src" }
    - id: img
      options:
        - { id: runid, text: "ocr/api:{{.Run.ID}}" }
        - { id: latest, text: "ocr/api:latest" }
        - { id: main, text: "ocr/api:main" }
        - { id: reg, text: "ocr/api:{{.Run.Registry}}" }
answer:
  values: { ctx: branchdir, img: runid }
explanation:
  correct:
    en: |
      A GitHub context is the repository URL with the `.git` suffix, followed by `#<branch>:<folder>`, so `#main:src` builds from the src folder of main. `{{.Run.ID}}` is a run variable that gives each run a unique ID, which makes every tag unique and traceable to its run.
    fr: |
      Un contexte GitHub est l'URL du dépôt avec le suffixe `.git`, suivie de `#<branche>:<dossier>` : `#main:src` génère à partir du dossier src de main. `{{.Run.ID}}` est une variable d'exécution qui attribue un ID unique à chaque exécution : chaque balise est donc unique et rattachée à son exécution.
  options:
    dirbranch: { en: "The branch comes first after #, then the folder.", fr: "La branche vient en premier après #, puis le dossier." }
    tree: { en: "A browser URL to a folder isn't a Git context; the CLI expects the .git URL.", fr: "Une URL de navigateur vers un dossier n'est pas un contexte Git ; la CLI attend l'URL .git." }
    local: { en: "A task with a commit trigger needs a Git context; a local folder can't be monitored for commits.", fr: "Une tâche avec un déclencheur de commit nécessite un contexte Git ; un dossier local ne peut pas être surveillé pour les commits." }
    latest: { en: "latest is reused by every run, so it neither stays unique nor identifies a run.", fr: "latest est réutilisée par chaque exécution : elle n'est ni unique ni rattachée à une exécution." }
    main: { en: "A branch-name tag is reused by every commit.", fr: "Une balise portant le nom de la branche est réutilisée à chaque commit." }
    reg: { en: "Run.Registry is the registry name, identical for every run.", fr: "Run.Registry est le nom du registre, identique pour chaque exécution." }
references:
  - title: az acr task
    url: https://learn.microsoft.com/en-us/cli/azure/acr/task?view=azure-cli-latest
  - title: "ACR Tasks reference: YAML"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-reference-yaml
