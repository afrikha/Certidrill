id: ai200-1c-pending-cpu-request
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys a document-chunking service to an Azure Kubernetes Service (AKS) cluster that has one node pool of three nodes. Each node has 4 vCPUs, and `kubectl describe nodes` shows an allocatable CPU of 3860m per node, of which less than 500m is requested by other pods. The nodes have no taints.

    The deployment manifest sets `resources.requests.cpu` and `resources.limits.cpu` of the container to `"4"`. The pod stays **Pending**, and `kubectl describe pod` shows a **FailedScheduling** event with the message `0/3 nodes are available: Insufficient CPU.`

    You must not add nodes or change the VM size of the node pool. You need the pod to be scheduled.

    What should you do?
  fr: |
    Litware déploie un service de découpage de documents sur un cluster Azure Kubernetes Service (AKS) qui comporte un pool de trois nœuds. Chaque nœud dispose de 4 processeurs virtuels, et `kubectl describe nodes` indique un processeur allouable de 3860m par nœud, dont moins de 500m sont demandés par d'autres pods. Les nœuds n'ont aucune teinte (taint).

    Le manifeste de déploiement définit `resources.requests.cpu` et `resources.limits.cpu` du conteneur sur `"4"`. Le pod reste à l'état **Pending**, et `kubectl describe pod` affiche un événement **FailedScheduling** avec le message `0/3 nodes are available: Insufficient CPU.`

    Vous ne devez ni ajouter de nœuds ni modifier la taille de machine virtuelle du pool. Le pod doit être planifié.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `resources.limits.cpu` to `\"6\"` and keep the CPU request.", fr: "Définir `resources.limits.cpu` sur `\"6\"` et conserver la demande de processeur." } }
    - { id: b, text: { en: "Add a toleration for `CriticalAddonsOnly` to the pod template.", fr: "Ajouter une tolérance pour `CriticalAddonsOnly` au modèle de pod." } }
    - { id: c, text: { en: "Set `spec.replicas` of the deployment to `3`.", fr: "Définir `spec.replicas` du déploiement sur `3`." } }
    - { id: d, text: { en: "Set `resources.requests.cpu` to `\"3\"` and keep the CPU limit.", fr: "Définir `resources.requests.cpu` sur `\"3\"` et conserver la limite de processeur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The scheduler places a pod only on a node whose unrequested allocatable CPU covers the pod's CPU request. A request of 4 CPUs can never fit a node with 3860m allocatable, but a request of 3 CPUs fits in the 3,360m or more left on each node. The limit of 4 stays valid because a limit can be higher than the request.
    fr: |
      Le planificateur ne place un pod que sur un nœud dont le processeur allouable non demandé couvre la demande de processeur du pod. Une demande de 4 processeurs ne peut jamais tenir sur un nœud qui a 3860m allouables, alors qu'une demande de 3 processeurs tient dans les 3 360m ou plus qui restent sur chaque nœud. La limite de 4 reste valide, car une limite peut être supérieure à la demande.
  options:
    a:
      en: |
        Scheduling uses the request, not the limit. The request stays at 4 CPUs, so the pod still does not fit any node.
      fr: |
        La planification utilise la demande, pas la limite. La demande reste de 4 processeurs : le pod ne tient toujours sur aucun nœud.
    b:
      en: |
        A toleration only matters when nodes have taints; these nodes have none, and the message reports insufficient CPU.
      fr: |
        Une tolérance n'a d'effet que si les nœuds ont des teintes ; ces nœuds n'en ont pas, et le message signale un manque de processeur.
    c:
      en: |
        More replicas create more pods with the same 4-CPU request, and each of them stays Pending.
      fr: |
        Plus de réplicas créent plus de pods avec la même demande de 4 processeurs, et chacun reste à l'état Pending.
references:
  - title: Troubleshoot AKS pod scheduler errors
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/availability-performance/troubleshoot-pod-scheduler-errors
