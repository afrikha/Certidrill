id: ai200-1a-acr-retention-hotarea
objective: "1.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Premium tier Azure container registry named **cradatum**. On November 1, 2026, you enabled a retention policy for untagged manifests with a retention period of 7 days.

    The following table lists every manifest that the `rag/api` repository has contained since November 1, 2026, with the date on which each one lost its last tag. No other change has occurred. All the manifests use the Docker image manifest V2 media type.

    Answer each prompt by selecting the appropriate manifest.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un registre de conteneurs Azure de niveau Premium nommé **cradatum**. Le 1er novembre 2026, vous avez activé une stratégie de rétention des manifestes non balisés avec une période de rétention de 7 jours.

    Le tableau suivant liste tous les manifestes que le dépôt `rag/api` a contenus depuis le 1er novembre 2026, avec la date à laquelle chacun a perdu sa dernière balise. Aucune autre modification n'a eu lieu. Tous les manifestes utilisent le type de média Docker image manifest V2.

    Répondez à chaque consigne en sélectionnant le manifeste approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The manifest that the retention policy has deleted by November 20, 2026", fr: "Le manifeste que la stratégie de rétention a supprimé au 20 novembre 2026" }
    - id: p2
      text: { en: "The manifest that was untagged after the policy was enabled but is still in the registry on November 20, 2026", fr: "Le manifeste qui a perdu sa balise après l'activation de la stratégie mais se trouve toujours dans le registre au 20 novembre 2026" }
  grid:
    header: [{ en: Digest, fr: Synthèse }, { en: Tags, fr: Balises }, { en: "Last tag removed on", fr: "Dernière balise retirée le" }, delete-enabled]
    rows:
      - [{ text: "sha256:1a7f...", area: m1 }, { text: "2.3.0, stable" }, { text: "-" }, { text: "true" }]
      - [{ text: "sha256:4c02...", area: m2 }, { text: { en: "(none)", fr: "(aucune)" } }, { text: { en: "October 25, 2026", fr: "25 octobre 2026" } }, { text: "true" }]
      - [{ text: "sha256:8e5d...", area: m3 }, { text: { en: "(none)", fr: "(aucune)" } }, { text: { en: "November 6, 2026", fr: "6 novembre 2026" } }, { text: "true" }]
      - [{ text: "sha256:b913...", area: m4 }, { text: { en: "(none)", fr: "(aucune)" } }, { text: { en: "November 9, 2026", fr: "9 novembre 2026" } }, { text: "false" }]
      - [{ text: "sha256:f04c...", area: m5 }, { text: "2.2.0" }, { text: "-" }, { text: "false" }]
answer:
  values: { p1: m3, p2: m4 }
explanation:
  correct:
    en: |
      The policy applies only to manifests untagged after it was enabled: sha256:8e5d... was untagged on November 6 and deleted 7 days later, on November 13. sha256:b913... was also untagged after November 1, but its delete-enabled attribute is false, which excludes it from the policy. sha256:4c02... was untagged before the policy was enabled, so it isn't affected, and tagged manifests are never deleted by the policy.
    fr: |
      La stratégie ne s'applique qu'aux manifestes devenus non balisés après son activation : sha256:8e5d... a perdu sa balise le 6 novembre et a été supprimé 7 jours plus tard, le 13 novembre. sha256:b913... a lui aussi perdu sa balise après le 1er novembre, mais son attribut delete-enabled vaut false, ce qui l'exclut de la stratégie. sha256:4c02... a perdu sa balise avant l'activation de la stratégie : il n'est pas concerné, et les manifestes balisés ne sont jamais supprimés par la stratégie.
references:
  - title: Set a retention policy to retain untagged manifests
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-retention-policy
