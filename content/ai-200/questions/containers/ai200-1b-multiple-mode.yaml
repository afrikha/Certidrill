id: ai200-1b-multiple-mode
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a contract-analysis API named **ca-contracts** in Azure Container Apps in single revision mode. The team plans several changes to its release process and doesn't use preview features.

    Which two requirements require you to switch ca-contracts to multiple revision mode?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute une API d'analyse de contrats nommée **ca-contracts** dans Azure Container Apps en mode de révision unique. L'équipe prévoit plusieurs changements dans son processus de mise en production et n'utilise pas de fonctionnalités en préversion.

    Quelles sont les deux exigences qui vous obligent à faire passer ca-contracts en mode de révisions multiples ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Send 20 percent of the requests to a new model version during an A/B test.", fr: "Envoyer 20 % des requêtes vers une nouvelle version du modèle pendant un test A/B." } }
    - { id: b, text: { en: "Deploy a new image without downtime for the callers.", fr: "Déployer une nouvelle image sans interruption pour les appelants." } }
    - { id: c, text: { en: "Keep the previous revision running after a release to move the traffic back to it instantly.", fr: "Garder la révision précédente en cours d'exécution après une mise en production pour y renvoyer le trafic instantanément." } }
    - { id: d, text: { en: "Make the running replicas use a new secret value without changing the image.", fr: "Faire utiliser une nouvelle valeur de secret aux réplicas en cours d'exécution sans changer l'image." } }
    - { id: e, text: { en: "Scale the app to zero replicas when no requests arrive.", fr: "Mettre l'application à l'échelle à zéro réplica quand aucune requête n'arrive." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Traffic splitting by weight needs multiple revision mode, in which several revisions stay active at the same time. In single revision mode, the old revision is deprovisioned automatically once the new one is ready, so it can't be kept running for an instant rollback.
    fr: "Le fractionnement du trafic par poids exige le mode de révisions multiples, dans lequel plusieurs révisions restent actives en même temps. En mode de révision unique, l'ancienne révision est déprovisionnée automatiquement dès que la nouvelle est prête : elle ne peut pas rester en cours d'exécution pour une restauration instantanée."
  options:
    b: { en: "Single revision mode already keeps the old revision serving until the new one is ready.", fr: "Le mode de révision unique garde déjà l'ancienne révision en service jusqu'à ce que la nouvelle soit prête." }
    d: { en: "Restarting the revision picks up a new secret value in any revision mode.", fr: "Redémarrer la révision prend en compte une nouvelle valeur de secret, quel que soit le mode de révision." }
    e: { en: "Scale to zero depends on the minimum replica count and the scale rules, not on the revision mode.", fr: "La mise à l'échelle à zéro dépend du nombre minimal de réplicas et des règles de mise à l'échelle, pas du mode de révision." }
references:
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
