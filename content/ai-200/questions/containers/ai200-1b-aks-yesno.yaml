id: ai200-1b-aks-yesno
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys a retrieval-augmented generation API to an Azure Kubernetes Service (AKS) cluster with manifest files. The cluster has the `azure-keyvault-secrets-provider` add-on enabled with its default configuration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie une API de génération augmentée de récupération sur un cluster Azure Kubernetes Service (AKS) avec des fichiers manifeste. Le module complémentaire `azure-keyvault-secrets-provider` est activé sur le cluster avec sa configuration par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Service whose manifest has no `type` field is reachable only from inside the cluster.
        fr: Un Service dont le manifeste n'a pas de champ `type` n'est joignable que depuis l'intérieur du cluster.
    - id: s2
      text:
        en: When a secret is updated in Key Vault, the files mounted by the add-on in running pods are updated automatically.
        fr: Quand un secret est mis à jour dans Key Vault, les fichiers montés par le module complémentaire dans les pods en cours d'exécution sont mis à jour automatiquement.
    - id: s3
      text:
        en: The add-on creates a user-assigned managed identity in the node resource group of the cluster.
        fr: Le module complémentaire crée une identité managée affectée par l'utilisateur dans le groupe de ressources de nœuds du cluster.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Without a `type`, a Service is of type ClusterIP, which creates an internal IP for use within the cluster only. The add-on supports autorotation of the mounted contents, but rotation is disabled by default (`enableSecretRotation` is false, with a 2-minute poll interval once enabled). The add-on creates the identity `azurekeyvaultsecretsprovider-xxxx` in the node resource group.
    fr: "Sans `type`, un Service est de type ClusterIP, qui crée une adresse IP interne utilisable uniquement dans le cluster. Le module complémentaire prend en charge la rotation automatique du contenu monté, mais la rotation est désactivée par défaut (`enableSecretRotation` vaut false, avec un intervalle d'interrogation de 2 minutes une fois activée). Le module complémentaire crée l'identité `azurekeyvaultsecretsprovider-xxxx` dans le groupe de ressources de nœuds."
  options:
    s2:
      en: Secret rotation is disabled by default; you must enable it for the mounted files to follow Key Vault updates.
      fr: La rotation des secrets est désactivée par défaut ; vous devez l'activer pour que les fichiers montés suivent les mises à jour de Key Vault.
references:
  - title: Concepts - Services in Azure Kubernetes Services (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-network-services
  - title: Use the Azure Key Vault Provider for Secrets Store CSI Driver for Azure Kubernetes Service (AKS) Secrets
    url: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
