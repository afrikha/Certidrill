id: ai200-1c-aks-normal-events
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs a retrieval-augmented generation (RAG) API on an Azure Kubernetes Service (AKS) cluster. Container insights is not enabled. A Log Analytics workspace that keeps data for 30 days already exists.

    After incidents, developers need to review all the Kubernetes events of the cluster, including events of type **Normal** such as image pulls and deployment scaling, for up to seven days after the events occurred.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une API de génération augmentée par récupération (RAG) sur un cluster Azure Kubernetes Service (AKS). Container insights n'est pas activé. Un espace de travail Log Analytics qui conserve les données pendant 30 jours existe déjà.

    Après des incidents, les développeurs doivent consulter tous les événements Kubernetes du cluster, y compris les événements de type **Normal** comme les tirages d'image et la mise à l'échelle des déploiements, jusqu'à sept jours après leur survenue.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Container insights on the cluster and send its data to the workspace.", fr: "Activer Container insights sur le cluster et envoyer ses données vers l'espace de travail." } }
    - { id: b, text: { en: "Switch Container insights to the ContainerLogV2 schema.", fr: "Faire passer Container insights au schéma ContainerLogV2." } }
    - { id: c, text: { en: "Set `enabled = true` under `[collect_all_kube_events]` in the `container-azm-ms-agentconfig` ConfigMap.", fr: "Définir `enabled = true` sous `[collect_all_kube_events]` dans le ConfigMap `container-azm-ms-agentconfig`." } }
    - { id: d, text: { en: "Schedule a daily job that runs `kubectl get events --all-namespaces`.", fr: "Planifier une tâche quotidienne qui exécute `kubectl get events --all-namespaces`." } }
    - { id: e, text: { en: "Increase the retention of the workspace to 90 days.", fr: "Porter la rétention de l'espace de travail à 90 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Kubernetes keeps events for only about one hour, so they must be collected: Container insights stores them in the `KubeEvents` table of the workspace. By default, Container insights does not collect events of type Normal; setting `collect_all_kube_events` to true in the `container-azm-ms-agentconfig` ConfigMap removes that filter.
    fr: |
      Kubernetes ne conserve les événements qu'environ une heure : ils doivent donc être collectés. Container insights les stocke dans la table `KubeEvents` de l'espace de travail. Par défaut, Container insights ne collecte pas les événements de type Normal ; définir `collect_all_kube_events` sur true dans le ConfigMap `container-azm-ms-agentconfig` supprime ce filtre.
  options:
    b:
      en: |
        The ContainerLogV2 schema only changes the table that receives container stdout and stderr; it does not affect event collection.
      fr: |
        Le schéma ContainerLogV2 ne modifie que la table qui reçoit stdout et stderr des conteneurs ; il n'a aucun effet sur la collecte des événements.
    d:
      en: |
        A daily run sees only the events of the last hour, because the cluster does not keep events longer; most events would be lost.
      fr: |
        Une exécution quotidienne ne voit que les événements de la dernière heure, car le cluster ne conserve pas les événements plus longtemps ; la plupart seraient perdus.
    e:
      en: |
        The workspace already keeps data for 30 days, which covers seven days; the problem is that events are not collected.
      fr: |
        L'espace de travail conserve déjà les données pendant 30 jours, ce qui couvre sept jours ; le problème est que les événements ne sont pas collectés.
references:
  - title: Use Kubernetes events for troubleshooting
    url: https://learn.microsoft.com/en-us/azure/aks/events
  - title: Configure container log collection with ConfigMap
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-data-collection-configmap
