id: ai200-1a-app-acr-user-identity
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs three Linux custom-container apps in Azure App Service: a RAG API, an embedding service and an admin portal. All the images are stored in the Azure container registry **crcontoso**.

    The security team created a single user-assigned managed identity named **id-acr-pull** and assigned it the AcrPull role on crcontoso. id-acr-pull is already assigned to the three apps. Each app must pull its image with id-acr-pull, without any registry password.

    Which configuration should you apply to each app?
  fr: |
    Contoso exécute trois applications à conteneur personnalisé Linux dans Azure App Service : une API RAG, un service d'incorporations et un portail d'administration. Toutes les images sont stockées dans le registre de conteneurs Azure **crcontoso**.

    L'équipe de sécurité a créé une seule identité managée attribuée par l'utilisateur, nommée **id-acr-pull**, et lui a attribué le rôle AcrPull sur crcontoso. id-acr-pull est déjà attribuée aux trois applications. Chaque application doit tirer son image avec id-acr-pull, sans aucun mot de passe de registre.

    Quelle configuration devez-vous appliquer à chaque application ?
body:
  options:
    - { id: a, text: { en: "Set acrUseManagedIdentityCreds to true and acrUserManagedIdentityID to the resource ID of id-acr-pull.", fr: "Définir acrUseManagedIdentityCreds sur true et acrUserManagedIdentityID sur l'ID de ressource de id-acr-pull." } }
    - { id: b, text: { en: "Set acrUseManagedIdentityCreds to true and acrUserManagedIdentityID to the client ID of id-acr-pull.", fr: "Définir acrUseManagedIdentityCreds sur true et acrUserManagedIdentityID sur l'ID client de id-acr-pull." } }
    - { id: c, text: { en: "Set acrUseManagedIdentityCreds to true and keyVaultReferenceIdentity to the resource ID of id-acr-pull.", fr: "Définir acrUseManagedIdentityCreds sur true et keyVaultReferenceIdentity sur l'ID de ressource de id-acr-pull." } }
    - { id: d, text: { en: "Set the DOCKER_REGISTRY_SERVER_USERNAME app setting to the client ID of id-acr-pull.", fr: "Définir le paramètre d'application DOCKER_REGISTRY_SERVER_USERNAME sur l'ID client de id-acr-pull." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      acrUseManagedIdentityCreds makes App Service pull with a managed identity instead of registry credentials. Without another setting it uses the system-assigned identity; to use a user-assigned identity, set acrUserManagedIdentityID to that identity's client ID (for example with `az webapp config set --generic-configurations`).
    fr: |
      acrUseManagedIdentityCreds fait tirer l'image par App Service avec une identité managée plutôt qu'avec des informations d'identification de registre. Sans autre paramètre, l'identité attribuée par le système est utilisée ; pour une identité attribuée par l'utilisateur, définissez acrUserManagedIdentityID sur l'ID client de cette identité (par exemple avec `az webapp config set --generic-configurations`).
  options:
    a: { en: "acrUserManagedIdentityID expects the client ID of the identity, not its resource ID.", fr: "acrUserManagedIdentityID attend l'ID client de l'identité, pas son ID de ressource." }
    c: { en: "keyVaultReferenceIdentity selects the identity used for Key Vault references, not for image pulls.", fr: "keyVaultReferenceIdentity choisit l'identité utilisée pour les références Key Vault, pas pour le tirage des images." }
    d: { en: "The DOCKER_REGISTRY_SERVER_* settings hold registry user name and password credentials, not a managed identity.", fr: "Les paramètres DOCKER_REGISTRY_SERVER_* contiennent un nom d'utilisateur et un mot de passe de registre, pas une identité managée." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
