id: ai200-cs2b-failed-revision
objective: "1.2.4"
type: single
caseStudy: ai200-cs2b-trey-research
difficulty: 1
status: draft
stem:
  en: |
    A developer updates litscan-api to a new image tag. The new revision never becomes ready, and the console log stream of litscan-api shows no output from the new revision.

    You need to find the error code that Azure Container Apps reported for the failed revision provisioning. Which command should you run?
  fr: |
    Un développeur met à jour litscan-api vers une nouvelle balise d'image. La nouvelle révision ne devient jamais prête, et le flux des journaux de console de litscan-api n'affiche aucune sortie de la nouvelle révision.

    Vous devez trouver le code d'erreur signalé par Azure Container Apps pour l'échec d'approvisionnement de la révision. Quelle commande devez-vous exécuter ?
body:
  options:
    - id: a
      text: "az containerapp logs show --name litscan-api --resource-group rg-litscan --type system"
    - id: b
      text: "az containerapp logs show --name litscan-api --resource-group rg-litscan --type console --follow"
    - id: c
      text: "az containerapp exec --name litscan-api --resource-group rg-litscan --command /bin/sh"
    - id: d
      text: "az containerapp ingress show --name litscan-api --resource-group rg-litscan"
answer: { optionId: a }
explanation:
  correct:
    en: |
      System logs are generated by the Container Apps runtime, and they include the revision provisioning events, such as "Error provisioning revision" with an error code like ErrImagePull, Timeout or ContainerCrashing. `az containerapp logs show --type system` streams these logs.
    fr: |
      Les journaux système sont générés par le runtime Container Apps et incluent les événements d'approvisionnement des révisions, comme « Error provisioning revision » avec un code d'erreur tel que ErrImagePull, Timeout ou ContainerCrashing. `az containerapp logs show --type system` diffuse ces journaux.
  options:
    b:
      en: Console logs contain what the containers write to stdout and stderr; a container that never starts writes nothing there. Console is also the default type.
      fr: Les journaux de console contiennent ce que les conteneurs écrivent sur stdout et stderr ; un conteneur qui ne démarre jamais n'y écrit rien. Console est aussi le type par défaut.
    c:
      en: You can only open a shell in a running replica; the new revision has no running container.
      fr: Vous ne pouvez ouvrir un shell que dans un réplica en cours d'exécution ; la nouvelle révision n'a aucun conteneur en cours d'exécution.
    d:
      en: The ingress settings show the FQDN, target port and traffic weights, not why a revision failed to provision.
      fr: Les paramètres d'entrée indiquent le FQDN, le port cible et les poids de trafic, pas la raison de l'échec d'approvisionnement d'une révision.
references:
  - title: View log streams in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-streaming
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
