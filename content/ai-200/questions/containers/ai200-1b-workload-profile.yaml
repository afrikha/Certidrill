id: ai200-1b-workload-profile
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs its AI apps in an Azure Container Apps environment of the workload profiles type that contains only the default Consumption profile.

    You must deploy a new reranking app named **ca-rerank** that loads a cross-encoder model into memory. Each replica needs 4 vCPUs and 24 GiB of memory. The solution must minimize cost and must not require a new environment.

    What should you do?
  fr: |
    Fabrikam exécute ses applications d'IA dans un environnement Azure Container Apps de type profils de charge de travail qui contient uniquement le profil Consumption par défaut.

    Vous devez déployer une nouvelle application de reclassement nommée **ca-rerank** qui charge un modèle cross-encoder en mémoire. Chaque réplica a besoin de 4 processeurs virtuels et de 24 Gio de mémoire. La solution doit réduire les coûts au minimum et ne doit pas nécessiter de nouvel environnement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Dedicated workload profile of type D4 to the environment, and run ca-rerank on it.", fr: "Ajouter à l'environnement un profil de charge de travail Dedicated de type D4, et exécuter ca-rerank sur ce profil." } }
    - { id: b, text: { en: "Add a Dedicated workload profile of type E4 to the environment, and run ca-rerank on it.", fr: "Ajouter à l'environnement un profil de charge de travail Dedicated de type E4, et exécuter ca-rerank sur ce profil." } }
    - { id: c, text: { en: "Run ca-rerank on the Consumption profile with 4 vCPUs and 24 GiB of memory per replica.", fr: "Exécuter ca-rerank sur le profil Consumption avec 4 processeurs virtuels et 24 Gio de mémoire par réplica." } }
    - { id: d, text: { en: "Run ca-rerank on the Consumption profile with 8 GiB per replica and a minimum of three replicas.", fr: "Exécuter ca-rerank sur le profil Consumption avec 8 Gio par réplica et un minimum de trois réplicas." } }
answer: { optionId: b }
explanation:
  correct:
    en: The memory-optimized E4 Dedicated profile provides 4 vCPUs and 32 GiB of memory per instance, which can host a 24 GiB replica, and a workload profiles environment can mix Dedicated and Consumption profiles. It is the smallest offered profile that fits the replica.
    fr: Le profil Dedicated E4, optimisé pour la mémoire, fournit 4 processeurs virtuels et 32 Gio de mémoire par instance, ce qui peut accueillir un réplica de 24 Gio, et un environnement à profils de charge de travail peut combiner des profils Dedicated et Consumption. C'est le plus petit profil proposé qui convient au réplica.
  options:
    a:
      en: A D4 instance has only 16 GiB of memory, less than one replica needs.
      fr: Une instance D4 ne dispose que de 16 Gio de mémoire, moins que ce dont un réplica a besoin.
    c:
      en: The Consumption profile allocates at most 8 GiB of memory per replica.
      fr: Le profil Consumption alloue au plus 8 Gio de mémoire par réplica.
    d:
      en: Each replica must load the whole model; adding replicas is horizontal scaling and doesn't give one replica more memory.
      fr: Chaque réplica doit charger tout le modèle ; ajouter des réplicas est une mise à l'échelle horizontale qui ne donne pas plus de mémoire à un réplica.
references:
  - title: Workload profiles in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/workload-profiles-overview
