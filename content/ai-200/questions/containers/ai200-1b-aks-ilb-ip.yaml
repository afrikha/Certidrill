id: ai200-1b-aks-ilb-ip
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam exposes an embedding API from an Azure Kubernetes Service (AKS) cluster to its on-premises network through a VPN. The Service manifest has `type: LoadBalancer` and the annotation `service.beta.kubernetes.io/azure-load-balancer-internal: "true"`.

    The on-premises firewall only allows traffic to 10.240.0.25, a free address in the cluster's subnet. The internal load balancer must always use this address.

    What should you add to the Service manifest?
  fr: |
    Fabrikam expose une API d'incorporation d'un cluster Azure Kubernetes Service (AKS) à son réseau local via un VPN. Le manifeste du Service a `type: LoadBalancer` et l'annotation `service.beta.kubernetes.io/azure-load-balancer-internal: "true"`.

    Le pare-feu local n'autorise que le trafic vers 10.240.0.25, une adresse libre du sous-réseau du cluster. L'équilibreur de charge interne doit toujours utiliser cette adresse.

    Que devez-vous ajouter au manifeste du Service ?
body:
  options:
    - { id: a, text: "spec.clusterIP: 10.240.0.25" }
    - { id: b, text: "The annotation service.beta.kubernetes.io/azure-load-balancer-internal-subnet: \"10.240.0.25\"" }
    - { id: c, text: "The annotation service.beta.kubernetes.io/azure-load-balancer-ipv4: 10.240.0.25" }
    - { id: d, text: "The annotation service.beta.kubernetes.io/azure-pls-ip-configuration-ip-address: 10.240.0.25" }
answer: { optionId: c }
explanation:
  correct:
    en: The `azure-load-balancer-ipv4` annotation sets the private frontend IP address of the internal load balancer. The address must be free in the load balancer's subnet and must not come from the Kubernetes service CIDR; it replaces the deprecated `loadBalancerIP` property.
    fr: "L'annotation `azure-load-balancer-ipv4` définit l'adresse IP privée frontale de l'équilibreur de charge interne. L'adresse doit être libre dans le sous-réseau de l'équilibreur de charge et ne doit pas provenir du CIDR de service Kubernetes ; elle remplace la propriété `loadBalancerIP`, dépréciée."
  options:
    a: { en: "clusterIP is the virtual IP inside the cluster, taken from the service CIDR, not the load balancer address.", fr: "clusterIP est l'adresse IP virtuelle interne au cluster, prise dans le CIDR de service, pas l'adresse de l'équilibreur de charge." }
    b: { en: "This annotation takes the name of a subnet of the cluster's virtual network, not an IP address.", fr: "Cette annotation prend le nom d'un sous-réseau du réseau virtuel du cluster, pas une adresse IP." }
    d: { en: "This annotation sets the NAT IP addresses of a Private Link service, not the load balancer frontend.", fr: "Cette annotation définit les adresses IP NAT d'un service Private Link, pas l'adresse frontale de l'équilibreur de charge." }
references:
  - title: Create an Internal Load Balancer in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/internal-lb
