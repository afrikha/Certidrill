id: ai200-1a-app-kv-secrets-user
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware's App Service app **app-lit-chat** runs a Linux container that reads the environment variable `OPENAI_API_KEY`. The app setting is defined as `@Microsoft.KeyVault(SecretUri=https://kv-litware.vault.azure.net/secrets/openai-key)`.

    The key vault **kv-litware** uses the Azure RBAC permission model and allows public network access. The app's system-assigned managed identity has the **Key Vault Reader** role on kv-litware.

    Requests fail because the code receives the literal string `@Microsoft.KeyVault(...)` as the API key. What should you do?
  fr: |
    L'application App Service **app-lit-chat** de Litware exécute un conteneur Linux qui lit la variable d'environnement `OPENAI_API_KEY`. Le paramètre d'application est défini sur `@Microsoft.KeyVault(SecretUri=https://kv-litware.vault.azure.net/secrets/openai-key)`.

    Le coffre de clés **kv-litware** utilise le modèle d'autorisation Azure RBAC et autorise l'accès au réseau public. L'identité managée attribuée par le système de l'application dispose du rôle **Key Vault Reader** sur kv-litware.

    Les requêtes échouent, car le code reçoit la chaîne littérale `@Microsoft.KeyVault(...)` comme clé d'API. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set keyVaultReferenceIdentity to SystemAssigned.", fr: "Définir keyVaultReferenceIdentity sur SystemAssigned." } }
    - { id: b, text: { en: "Add an access policy with the Get secret permission for the identity.", fr: "Ajouter une stratégie d'accès avec l'autorisation Get sur les secrets pour l'identité." } }
    - { id: c, text: { en: "Set vnetRouteAllEnabled to true on the app.", fr: "Définir vnetRouteAllEnabled sur true dans l'application." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets User role on kv-litware to the identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-litware à l'identité." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a Key Vault reference can't be resolved, App Service passes the literal reference string to the app. In the RBAC model, the identity needs Key Vault Secrets User to read secret values; Key Vault Reader only reads metadata, not secret contents.
    fr: |
      Quand une référence Key Vault ne peut pas être résolue, App Service transmet la chaîne de référence littérale à l'application. Dans le modèle RBAC, l'identité a besoin de Key Vault Secrets User pour lire les valeurs des secrets ; Key Vault Reader ne lit que les métadonnées, pas le contenu des secrets.
  options:
    a: { en: "References already use the system-assigned identity by default; the identity lacks permission, not configuration.", fr: "Les références utilisent déjà l'identité attribuée par le système par défaut ; c'est l'autorisation qui manque, pas la configuration." }
    b: { en: "Access policies apply only to vaults that use the access policy permission model.", fr: "Les stratégies d'accès ne s'appliquent qu'aux coffres qui utilisent le modèle d'autorisation par stratégie d'accès." }
    c: { en: "The vault accepts public traffic, so routing outbound traffic through a virtual network doesn't help.", fr: "Le coffre accepte le trafic public : faire passer le trafic sortant par un réseau virtuel n'aide pas." }
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
