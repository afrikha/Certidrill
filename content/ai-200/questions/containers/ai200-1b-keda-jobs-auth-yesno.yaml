id: ai200-1b-keda-jobs-auth-yesno
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is planning event-driven processing in Azure Container Apps for a product-image pipeline. Some steps will run as container apps and others as Container Apps jobs. The team wants to avoid connection strings wherever possible.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys planifie un traitement piloté par les événements dans Azure Container Apps pour un pipeline d'images de produits. Certaines étapes s'exécuteront en tant qu'applications conteneur, d'autres en tant que travaux Container Apps. L'équipe veut éviter les chaînes de connexion partout où c'est possible.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An event-driven Container Apps job can start executions based on an Azure Queue Storage scale rule.
        fr: Un travail Container Apps piloté par les événements peut démarrer des exécutions selon une règle de mise à l'échelle Stockage File d'attente Azure.
    - id: s2
      text:
        en: A scale rule that authenticates with a managed identity can be configured in the Azure portal.
        fr: Une règle de mise à l'échelle qui s'authentifie avec une identité managée peut être configurée dans le portail Azure.
    - id: s3
      text:
        en: An event-driven Container Apps job can start an execution for each incoming HTTP request by using an HTTP scale rule.
        fr: Un travail Container Apps piloté par les événements peut démarrer une exécution pour chaque requête HTTP entrante à l'aide d'une règle de mise à l'échelle HTTP.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Event-driven jobs are triggered by KEDA custom scalers such as Azure Queue Storage. Managed identity for scale rules is supported for Azure Queue Storage, Service Bus and Event Hubs, but only through the Azure CLI, ARM or Bicep, not the Azure portal. Container Apps jobs don't support HTTP or TCP scale rules.
    fr: Les travaux pilotés par les événements sont déclenchés par des scalers KEDA personnalisés, comme Stockage File d'attente Azure. L'identité managée pour les règles de mise à l'échelle est prise en charge pour Stockage File d'attente Azure, Service Bus et Event Hubs, mais uniquement via l'Azure CLI, ARM ou Bicep, pas dans le portail Azure. Les travaux Container Apps ne prennent pas en charge les règles de mise à l'échelle HTTP ni TCP.
  options:
    s2:
      en: The portal doesn't support managed identity for scale rules; use the Azure CLI, ARM or Bicep.
      fr: Le portail ne prend pas en charge l'identité managée pour les règles de mise à l'échelle ; utilisez l'Azure CLI, ARM ou Bicep.
    s3:
      en: HTTP scale rules aren't supported for Container Apps jobs.
      fr: Les règles de mise à l'échelle HTTP ne sont pas prises en charge pour les travaux Container Apps.
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
  - title: Jobs in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/jobs
