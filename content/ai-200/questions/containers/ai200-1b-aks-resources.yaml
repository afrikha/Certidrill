id: ai200-1b-aks-resources
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum is writing the Deployment manifest of a tokenizer service for Azure Kubernetes Service (AKS). The requirements are:

    - The scheduler must place each pod only on a node that can reserve half a CPU core and 4 GiB of memory for it.
    - The container must never use more than 6 GiB of memory.

    How should you complete the container definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum rédige le manifeste du Deployment d'un service de tokenisation pour Azure Kubernetes Service (AKS). Les exigences sont les suivantes :

    - Le planificateur doit placer chaque pod uniquement sur un nœud qui peut lui réserver un demi-cœur de processeur et 4 Gio de mémoire.
    - Le conteneur ne doit jamais utiliser plus de 6 Gio de mémoire.

    Comment devez-vous compléter la définition du conteneur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    containers:
      - name: tokenizer
        image: cradatum.azurecr.io/nlp/tokenizer:4.1.0
        resources:
          [[first]]:
            cpu: [[cpu]]
            memory: 4Gi
          [[second]]:
            memory: 6Gi
  slots:
    - id: first
      options:
        - { id: req1, text: requests }
        - { id: lim1, text: limits }
        - { id: res1, text: claims }
    - id: cpu
      options:
        - { id: m500, text: 500m }
        - { id: gi05, text: 0.5Gi }
        - { id: mi500, text: 500Mi }
    - id: second
      options:
        - { id: lim2, text: limits }
        - { id: req2, text: requests }
        - { id: res2, text: claims }
answer:
  values: { first: req1, cpu: m500, second: lim2 }
explanation:
  correct:
    en: "`requests` is the amount of CPU and memory that the scheduler reserves for the container when it chooses a node, and `limits` is the maximum the container may use; a container that goes over its memory limit is terminated. CPU is expressed in cores or millicores, so half a core is `500m`."
    fr: "`requests` est la quantité de processeur et de mémoire que le planificateur réserve au conteneur quand il choisit un nœud, et `limits` est le maximum que le conteneur peut utiliser ; un conteneur qui dépasse sa limite de mémoire est arrêté. Le processeur s'exprime en cœurs ou en millicœurs : un demi-cœur s'écrit `500m`."
  options:
    lim1: { en: "limits caps usage but isn't what the scheduler uses to reserve capacity on a node; it belongs in the second section.", fr: "limits plafonne l'utilisation, mais ce n'est pas ce que le planificateur utilise pour réserver de la capacité sur un nœud ; il va dans la seconde section." }
    req2: { en: "requests reserves capacity; the 6 GiB ceiling is a limit.", fr: "requests réserve de la capacité ; le plafond de 6 Gio est une limite." }
    res1: { en: "claims lists dynamic resource claims used by the container; CPU and memory reservations are set in requests.", fr: "claims liste les revendications de ressources dynamiques utilisées par le conteneur ; les réservations de processeur et de mémoire se définissent dans requests." }
    res2: { en: "claims lists dynamic resource claims; a memory ceiling is set in limits.", fr: "claims liste des revendications de ressources dynamiques ; un plafond de mémoire se définit dans limits." }
    gi05: { en: "Gi is a memory unit; CPU uses cores or millicores.", fr: "Gi est une unité de mémoire ; le processeur utilise des cœurs ou des millicœurs." }
    mi500: { en: "Mi is a memory unit; CPU uses cores or millicores.", fr: "Mi est une unité de mémoire ; le processeur utilise des cœurs ou des millicœurs." }
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
