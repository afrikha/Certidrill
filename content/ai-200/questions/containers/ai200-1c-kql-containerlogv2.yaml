id: ai200-1c-kql-containerlogv2
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an AI ingestion pipeline on an Azure Kubernetes Service (AKS) cluster. Container insights sends the cluster data to a Log Analytics workspace by using the ContainerLogV2 schema.

    You need a query that returns the error messages written during the last hour by the container named **chunker** in the pods of the **ingest** namespace.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un pipeline d'ingestion IA sur un cluster Azure Kubernetes Service (AKS). Container insights envoie les données du cluster vers un espace de travail Log Analytics en utilisant le schéma ContainerLogV2.

    Vous avez besoin d'une requête qui renvoie les messages d'erreur écrits au cours de la dernière heure par le conteneur nommé **chunker** dans les pods de l'espace de noms **ingest**.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(1h)
    | where PodNamespace == "ingest" and [[col]] == "chunker"
    | where LogLevel == "ERROR"
    | project TimeGenerated, PodName, [[msg]]
  slots:
    - id: table
      options:
        - { id: v2, text: ContainerLogV2 }
        - { id: events, text: KubeEvents }
        - { id: pods, text: KubePodInventory }
        - { id: aca, text: ContainerAppConsoleLogs_CL }
    - id: col
      options:
        - { id: cname, text: ContainerName }
        - { id: computer, text: Computer }
        - { id: acaname, text: ContainerAppName_s }
        - { id: source, text: LogSource }
    - id: msg
      options:
        - { id: logmsg, text: LogMessage }
        - { id: logs, text: Log_s }
        - { id: message, text: Message }
        - { id: level, text: LogLevel }
answer:
  values: { table: v2, col: cname, msg: logmsg }
explanation:
  correct:
    en: |
      With the ContainerLogV2 schema, the stdout and stderr lines of AKS containers are stored in the `ContainerLogV2` table, which has the `PodNamespace`, `PodName`, `ContainerName` and `LogLevel` columns. The text of each line is in `LogMessage`.
    fr: |
      Avec le schéma ContainerLogV2, les lignes stdout et stderr des conteneurs AKS sont stockées dans la table `ContainerLogV2`, qui comporte les colonnes `PodNamespace`, `PodName`, `ContainerName` et `LogLevel`. Le texte de chaque ligne se trouve dans `LogMessage`.
  options:
    events:
      en: KubeEvents holds Kubernetes events (scheduling, back-off), not the output of the containers.
      fr: KubeEvents contient les événements Kubernetes (planification, back-off), pas la sortie des conteneurs.
    pods:
      en: KubePodInventory lists pods, their status and their controller; it contains no log lines.
      fr: KubePodInventory liste les pods, leur état et leur contrôleur ; elle ne contient aucune ligne de journal.
    aca:
      en: ContainerAppConsoleLogs_CL holds the console logs of Azure Container Apps, not of AKS.
      fr: ContainerAppConsoleLogs_CL contient les journaux de console d'Azure Container Apps, pas ceux d'AKS.
    computer:
      en: Computer is the node name, not the container name.
      fr: Computer est le nom du nœud, pas celui du conteneur.
    acaname:
      en: ContainerAppName_s is a column of the Container Apps tables.
      fr: ContainerAppName_s est une colonne des tables Container Apps.
    source:
      en: LogSource tells whether a line came from stdout or stderr; it does not hold the container name.
      fr: LogSource indique si une ligne provient de stdout ou de stderr ; elle ne contient pas le nom du conteneur.
    logs:
      en: Log_s is the message column of the Container Apps custom tables.
      fr: Log_s est la colonne de message des tables personnalisées Container Apps.
    level:
      en: LogLevel only gives the severity that is already filtered on, not the message text.
      fr: LogLevel ne donne que la gravité, déjà filtrée, pas le texte du message.
references:
  - title: Query container logs in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/container-insights-log-query
  - title: Configure the ContainerLogV2 schema for Container insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/container-insights-logs-schema
