id: ai200-1a-tasks-build-dockerfile-path
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's release engineer must produce a GPU build of the summarization API from the public GitHub repository `woodgrove/summarizer`, branch `release`. The Dockerfile for this build is `docker/Dockerfile.gpu`, relative to the root of the repository, and the build context is the root of the repository.

    The engineer's machine has the Azure CLI but no copy of the source code and no Docker engine.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'ingénieur de mise en production de Woodgrove Bank doit produire un build GPU de l'API de synthèse à partir du dépôt GitHub public `woodgrove/summarizer`, branche `release`. Le Dockerfile de ce build est `docker/Dockerfile.gpu`, relativement à la racine du dépôt, et le contexte de génération est la racine du dépôt.

    La machine de l'ingénieur dispose de l'Azure CLI, mais d'aucune copie du code source et d'aucun moteur Docker.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az acr build --registry crwoodgrove \
      --image summarizer/api:3.0.0-gpu \
      [[file]] \
      [[ctx]]
  slots:
    - id: file
      options:
        - { id: f, text: "--file docker/Dockerfile.gpu" }
        - { id: target, text: "--target docker/Dockerfile.gpu" }
        - { id: arg, text: "--build-arg DOCKERFILE=docker/Dockerfile.gpu" }
    - id: ctx
      options:
        - { id: git, text: "https://github.com/woodgrove/summarizer.git#release" }
        - { id: dot, text: "." }
        - { id: none, text: /dev/null }
        - { id: gitdir, text: "https://github.com/woodgrove/summarizer.git#release:docker" }
answer:
  values: { file: f, ctx: git }
explanation:
  correct:
    en: |
      `--file` gives the path of the Dockerfile relative to the root of the source context (Dockerfile by default). A quick task accepts a GitHub repository as its context, so `https://github.com/woodgrove/summarizer.git#release` builds from the root of the release branch without any local copy.
    fr: |
      `--file` indique le chemin du Dockerfile relativement à la racine du contexte source (Dockerfile par défaut). Une tâche rapide accepte un dépôt GitHub comme contexte : `https://github.com/woodgrove/summarizer.git#release` génère à partir de la racine de la branche release, sans copie locale.
  options:
    target: { en: "--target selects a build stage inside the Dockerfile, not the Dockerfile path.", fr: "--target choisit une étape de génération dans le Dockerfile, pas le chemin du Dockerfile." }
    arg: { en: "A build argument is passed to the Dockerfile; it doesn't tell ACR Tasks which file to use.", fr: "Un argument de build est transmis au Dockerfile ; il n'indique pas à ACR Tasks quel fichier utiliser." }
    dot: { en: "The current folder doesn't contain the source code.", fr: "Le dossier actuel ne contient pas le code source." }
    none: { en: "/dev/null means no context, so there would be nothing to build.", fr: "/dev/null signifie aucun contexte : il n'y aurait rien à générer." }
    gitdir: { en: "This context is the docker folder, but the build context must be the root of the repository.", fr: "Ce contexte est le dossier docker, alors que le contexte de génération doit être la racine du dépôt." }
references:
  - title: az acr
    url: https://learn.microsoft.com/en-us/cli/azure/acr?view=azure-cli-latest
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
