id: ai200-1b-keda-wake-worker
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys an OCR worker named **ca-ocr-worker** to Azure Container Apps. The worker reads jobs from the Azure Queue Storage queue `ocr-jobs`. Ingress is disabled, `minReplicas` is 0, and no scale rule is defined.

    Messages pile up in the queue, but the worker never processes them.

    Which two actions would each make the worker process the messages? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware déploie un worker d'OCR nommé **ca-ocr-worker** sur Azure Container Apps. Le worker lit des travaux dans la file d'attente Stockage File d'attente Azure `ocr-jobs`. L'entrée est désactivée, `minReplicas` vaut 0 et aucune règle de mise à l'échelle n'est définie.

    Les messages s'accumulent dans la file d'attente, mais le worker ne les traite jamais.

    Quelles sont les deux actions qui permettraient chacune au worker de traiter les messages ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set `minReplicas` to 1.", fr: "Définir `minReplicas` sur 1." } }
    - { id: b, text: { en: "Set `maxReplicas` to 20.", fr: "Définir `maxReplicas` sur 20." } }
    - { id: c, text: { en: "Add an HTTP scale rule with `concurrentRequests` set to 1.", fr: "Ajouter une règle de mise à l'échelle HTTP avec `concurrentRequests` défini sur 1." } }
    - { id: d, text: { en: "Add a custom scale rule of type `azure-queue` on the `ocr-jobs` queue.", fr: "Ajouter une règle de mise à l'échelle personnalisée de type `azure-queue` sur la file d'attente `ocr-jobs`." } }
    - { id: e, text: { en: "Restart the active revision.", fr: "Redémarrer la révision active." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Without a scale rule, the default HTTP rule applies; with ingress disabled and `minReplicas` at 0, the app scales to zero and can't restart. Keeping at least one replica running, or adding a queue rule that starts replicas when messages arrive, solves the problem.
    fr: "Sans règle de mise à l'échelle, la règle HTTP par défaut s'applique ; avec l'entrée désactivée et `minReplicas` à 0, l'application descend à zéro réplica et ne peut pas redémarrer. Garder au moins un réplica en cours d'exécution, ou ajouter une règle de file d'attente qui démarre des réplicas à l'arrivée de messages, résout le problème."
  options:
    b: { en: "A higher maximum doesn't help when nothing triggers the first replica.", fr: "Un maximum plus élevé n'aide pas quand rien ne déclenche le premier réplica." }
    c: { en: "No HTTP request can reach the app because ingress is disabled, and queue messages aren't HTTP requests.", fr: "Aucune requête HTTP ne peut atteindre l'application, car l'entrée est désactivée, et les messages de file d'attente ne sont pas des requêtes HTTP." }
    e: { en: "After a restart, the app scales back to zero for the same reason.", fr: "Après un redémarrage, l'application redescend à zéro pour la même raison." }
references:
  - title: Scaling in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
