id: ai200-1b-keyvault-uri
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a credit-scoring API named **ca-risk-api** in Azure Container Apps. The app reads a model provider key through a Key Vault reference to the secret `scoring-key` in the key vault **kv-woodgrove**, by using its system-assigned managed identity.

    The security team rotates the key every month by creating a new version of the secret. After each rotation, ca-risk-api must start using the new version automatically, without a redeployment and without editing the secret reference.

    Which value should you use as the Key Vault secret URI?
  fr: |
    Woodgrove Bank exécute une API de notation de crédit nommée **ca-risk-api** dans Azure Container Apps. L'application lit une clé de fournisseur de modèle via une référence Key Vault au secret `scoring-key` du coffre de clés **kv-woodgrove**, à l'aide de son identité managée affectée par le système.

    L'équipe de sécurité fait la rotation de la clé chaque mois en créant une nouvelle version du secret. Après chaque rotation, ca-risk-api doit utiliser automatiquement la nouvelle version, sans redéploiement et sans modifier la référence du secret.

    Quelle valeur devez-vous utiliser comme URI du secret Key Vault ?
body:
  options:
    - { id: a, text: "https://kv-woodgrove.vault.azure.net/secrets/scoring-key/ec96f02080254f109c51a1f14cdb1931" }
    - { id: b, text: "https://kv-woodgrove.vault.azure.net/keys/scoring-key" }
    - { id: c, text: "https://kv-woodgrove.vault.azure.net/" }
    - { id: d, text: "https://kv-woodgrove.vault.azure.net/secrets/scoring-key" }
answer: { optionId: d }
explanation:
  correct:
    en: A secret URI without a version makes the app use the latest version of the secret. When a newer version exists, Container Apps retrieves it within 30 minutes and automatically restarts the active revisions that reference the secret in an environment variable.
    fr: Un URI de secret sans version fait utiliser à l'application la dernière version du secret. Quand une version plus récente existe, Container Apps la récupère dans les 30 minutes et redémarre automatiquement les révisions actives qui référencent le secret dans une variable d'environnement.
  options:
    a:
      en: A URI that ends with a version pins that exact version; rotations are ignored until you edit the reference.
      fr: Un URI qui se termine par une version épingle cette version précise ; les rotations sont ignorées jusqu'à ce que vous modifiiez la référence.
    b:
      en: The `/keys/` path addresses a cryptographic key object, not a secret.
      fr: Le chemin `/keys/` désigne un objet clé de chiffrement, pas un secret.
    c:
      en: The vault URI alone doesn't identify a secret; the reference must point to a secret under `/secrets/`.
      fr: L'URI du coffre seul n'identifie aucun secret ; la référence doit pointer vers un secret sous `/secrets/`.
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
