id: ai200-1c-aca-log-types
objective: "1.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind hosts a Python recommendation API in a container app named **ca-recommend**. The Azure Container Apps environment sends its logs to a Log Analytics workspace. No diagnostic setting is configured on the environment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind héberge une API Python de recommandation dans une application conteneur nommée **ca-recommend**. L'environnement Azure Container Apps envoie ses journaux vers un espace de travail Log Analytics. Aucun paramètre de diagnostic n'est configuré sur l'environnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a new revision of ca-recommend fails with the error code ErrImagePull, the error appears in the console logs of the app.
        fr: Quand une nouvelle révision de ca-recommend échoue avec le code d'erreur ErrImagePull, l'erreur apparaît dans les journaux de console de l'application.
    - id: s2
      text:
        en: Running `az containerapp logs show --name ca-recommend --resource-group rg-reco` without the `--type` parameter returns console logs.
        fr: L'exécution de `az containerapp logs show --name ca-recommend --resource-group rg-reco` sans le paramètre `--type` renvoie des journaux de console.
    - id: s3
      text:
        en: The status code and duration of each HTTP request to ca-recommend are available in the ContainerAppHTTPLogs table of the workspace.
        fr: Le code d'état et la durée de chaque requête HTTP adressée à ca-recommend sont disponibles dans la table ContainerAppHTTPLogs de l'espace de travail.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Revision provisioning errors such as ErrImagePull, Timeout or ContainerCrashing are generated by the Container Apps service and appear in the system logs, not in the console logs, which hold the containers' stdout and stderr. The `--type` parameter of `az containerapp logs show` defaults to `console`. HTTP logs are opt-in: they are sent only after you enable them in the diagnostic settings of the environment, and none is configured here.
    fr: |
      Les erreurs d'approvisionnement de révision comme ErrImagePull, Timeout ou ContainerCrashing sont générées par le service Container Apps et apparaissent dans les journaux système, pas dans les journaux de console, qui contiennent stdout et stderr des conteneurs. Le paramètre `--type` de `az containerapp logs show` vaut `console` par défaut. Les journaux HTTP sont facultatifs : ils ne sont envoyés qu'après leur activation dans les paramètres de diagnostic de l'environnement, et aucun n'est configuré ici.
references:
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
  - title: Monitor logs in Azure Container Apps with Log Analytics
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-monitoring
