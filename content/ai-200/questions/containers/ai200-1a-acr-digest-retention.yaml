id: ai200-1a-acr-digest-retention
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys stores the images of its shopping assistant in the Premium tier Azure container registry **crwingtip**. The release pipeline pushes every build to the tag `assistant/api:prod`, and the deployment manifests reference the image by the digest of that build (`assistant/api@sha256:...`). Older digests stay in use for weeks in regions that are rolled back.

    You plan to enable a retention policy for untagged manifests to reclaim storage. Every deployment, including rolled-back ones, must keep pulling its image successfully.

    What should you do?
  fr: |
    Wingtip Toys stocke les images de son assistant d'achat dans le registre de conteneurs Azure de niveau Premium **crwingtip**. Le pipeline de mise en production envoie chaque build sur la balise `assistant/api:prod`, et les manifestes de déploiement référencent l'image par la synthèse (digest) de ce build (`assistant/api@sha256:...`). Des synthèses plus anciennes restent utilisées pendant des semaines dans les régions qui ont fait l'objet d'une restauration.

    Vous prévoyez d'activer une stratégie de rétention des manifestes non balisés pour récupérer du stockage. Chaque déploiement, y compris ceux qui ont été restaurés, doit continuer de tirer son image sans erreur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Push each build under a unique tag, deploy that tag, and then enable the policy.", fr: "Envoyer chaque build sous une balise unique, déployer cette balise, puis activer la stratégie." } }
    - { id: b, text: { en: "Enable the policy with a retention period of 365 days.", fr: "Activer la stratégie avec une période de rétention de 365 jours." } }
    - { id: c, text: { en: "Lock the assistant/api repository with --write-enabled false, and then enable the policy.", fr: "Verrouiller le dépôt assistant/api avec --write-enabled false, puis activer la stratégie." } }
    - { id: d, text: { en: "Enable the policy with a retention period of 0 days.", fr: "Activer la stratégie avec une période de rétention de 0 jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each push to the prod tag leaves the previous build as an untagged manifest, which the retention policy deletes permanently once the period ends, breaking any deployment that pulls it by digest. Microsoft advises against the policy when systems pull by digest and recommends unique tags instead: an image that keeps its unique tag is never untagged, so the policy doesn't touch it.
    fr: |
      Chaque envoi sur la balise prod laisse le build précédent sous forme de manifeste non balisé, que la stratégie de rétention supprime définitivement à la fin de la période, ce qui casse tout déploiement qui le tire par sa synthèse. Microsoft déconseille la stratégie lorsque des systèmes tirent par synthèse et recommande plutôt des balises uniques : une image qui conserve sa balise unique n'est jamais non balisée, et la stratégie ne la touche pas.
  options:
    b: { en: "A longer period only delays the deletion: digests still in use after 365 days would break.", fr: "Une période plus longue ne fait que retarder la suppression : les synthèses encore utilisées après 365 jours ne fonctionneraient plus." }
    c: { en: "Locking the whole repository with write-enabled false would block the pipeline's pushes.", fr: "Verrouiller tout le dépôt avec write-enabled false bloquerait les envois du pipeline." }
    d: { en: "A period of 0 deletes each untagged manifest immediately, breaking every rollback at once.", fr: "Une période de 0 supprime immédiatement chaque manifeste non balisé, ce qui casse aussitôt toute restauration." }
references:
  - title: Set a retention policy to retain untagged manifests
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-retention-policy
  - title: Recommendations for tagging and versioning container images
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
