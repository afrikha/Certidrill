id: ai200-1c-aks-inside-out
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove exposes a Python fraud-scoring API to internal clients through a Kubernetes Service of type **LoadBalancer** on an Azure Kubernetes Service (AKS) cluster. Clients report that requests to the load balancer IP address time out.

    You decide to troubleshoot from the inside out: start with the application itself and move outward one layer at a time until you find the layer that fails.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove expose une API Python d'évaluation de la fraude à des clients internes par un Service Kubernetes de type **LoadBalancer** sur un cluster Azure Kubernetes Service (AKS). Les clients signalent que les requêtes adressées à l'adresse IP de l'équilibreur de charge expirent.

    Vous décidez de dépanner de l'intérieur vers l'extérieur : commencer par l'application elle-même et avancer d'une couche à la fois jusqu'à trouver la couche défaillante.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: pods, text: { en: "Run `kubectl get pods` and `kubectl logs` to confirm that the pods are running and the app started.", fr: "Exécuter `kubectl get pods` et `kubectl logs` pour confirmer que les pods s'exécutent et que l'application a démarré." } }
    - { id: podip, text: { en: "From a test pod in the cluster, run `curl` against a pod IP address on the container port.", fr: "Depuis un pod de test du cluster, exécuter `curl` sur l'adresse IP d'un pod et le port du conteneur." } }
    - { id: svc, text: { en: "Run `kubectl describe svc` to check the endpoints, and then `curl` the cluster IP of the Service from the test pod.", fr: "Exécuter `kubectl describe svc` pour vérifier les points de terminaison, puis exécuter `curl` sur l'adresse IP de cluster du Service depuis le pod de test." } }
    - { id: lb, text: { en: "From outside the cluster, `curl` the load balancer IP address and check the NSG rules of the AKS subnet.", fr: "Depuis l'extérieur du cluster, exécuter `curl` sur l'adresse IP de l'équilibreur de charge et vérifier les règles NSG du sous-réseau AKS." } }
    - { id: dns, text: { en: "Restart the kube-proxy and kube-dns pods in the kube-system namespace.", fr: "Redémarrer les pods kube-proxy et kube-dns de l'espace de noms kube-system." } }
    - { id: netpol, text: { en: "Delete the network policies of the namespace to rule them out.", fr: "Supprimer les stratégies réseau de l'espace de noms pour les écarter." } }
answer:
  sequence: [ pods, podip, svc, lb ]
explanation:
  correct:
    en: |
      The inside-out approach first checks the pod and its logs, then tests the pod IP from inside the cluster, then checks that the ClusterIP Service has the pod as an endpoint and answers, and finally tests the load balancer from outside and the NSG rules. The first layer that fails is the one to fix.
    fr: |
      L'approche de l'intérieur vers l'extérieur vérifie d'abord le pod et ses journaux, puis teste l'adresse IP du pod depuis le cluster, vérifie ensuite que le Service ClusterIP a le pod comme point de terminaison et répond, et teste enfin l'équilibreur de charge depuis l'extérieur ainsi que les règles NSG. La première couche qui échoue est celle à corriger.
  options:
    dns:
      en: Restarting system networking components is a last resort once evidence points to them; it is not a diagnostic step.
      fr: Redémarrer des composants réseau système est un dernier recours une fois que les éléments recueillis les désignent ; ce n'est pas une étape de diagnostic.
    netpol:
      en: Deleting production network policies as a shortcut is discouraged; you inspect them with `kubectl describe networkpolicy` instead.
      fr: Supprimer des stratégies réseau de production comme raccourci est déconseillé ; vous les inspectez plutôt avec `kubectl describe networkpolicy`.
references:
  - title: Troubleshoot app connection issues in an AKS cluster
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/connectivity/connection-issues-application-hosted-aks-cluster
