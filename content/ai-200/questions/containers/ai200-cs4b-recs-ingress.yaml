id: ai200-cs4b-recs-ingress
objective: "1.2.1"
type: single
caseStudy: ai200-cs4b-southridge
difficulty: 1
status: draft
stem:
  en: |
    You need to configure recs-api to meet the WatchNext access requirement. web-southridge will call recs-api by its app name.

    What should you do?
  fr: |
    Vous devez configurer recs-api pour satisfaire l'exigence relative à l'accès à WatchNext. web-southridge appellera recs-api par son nom d'application.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Enable ingress on recs-api with `--type external` and `--target-port 8000`."
        fr: "Activer l'entrée sur recs-api avec `--type external` et `--target-port 8000`."
    - id: b
      text:
        en: "Enable ingress on recs-api with `--type internal` and `--target-port 8000`."
        fr: "Activer l'entrée sur recs-api avec `--type internal` et `--target-port 8000`."
    - id: c
      text:
        en: "Recreate cae-southridge with `--internal-only true`, then enable external ingress on recs-api."
        fr: "Recréer cae-southridge avec `--internal-only true`, puis activer l'entrée externe sur recs-api."
    - id: d
      text:
        en: "Keep ingress disabled on recs-api, and deploy recs-api to the same workload profile as web-southridge."
        fr: "Laisser l'entrée désactivée sur recs-api et déployer recs-api sur le même profil de charge de travail que web-southridge."
answer: { optionId: b }
explanation:
  correct:
    en: "Internal ingress makes recs-api reachable only from within cae-southridge, for example by its app name from web-southridge, and doesn't expose it through the inbound IP address of the environment. The target port must be the port the container listens on, 8000."
    fr: "L'entrée interne rend recs-api joignable uniquement depuis cae-southridge, par exemple par son nom d'application depuis web-southridge, et ne l'expose pas par l'adresse IP entrante de l'environnement. Le port cible doit être le port sur lequel le conteneur écoute, 8000."
  options:
    a: { en: "External ingress exposes recs-api through the inbound IP address of the environment, which is reachable from the internet because cae-southridge isn't internal-only.", fr: "L'entrée externe expose recs-api par l'adresse IP entrante de l'environnement, joignable depuis Internet car cae-southridge n'est pas interne uniquement." }
    c: { en: "An internal-only environment has no public inbound IP address, so web-southridge would no longer be reachable from the internet.", fr: "Un environnement interne uniquement n'a pas d'adresse IP entrante publique : web-southridge ne serait plus joignable depuis Internet." }
    d: { en: "Without ingress, recs-api accepts no HTTP request at all, even from apps of the same environment or workload profile.", fr: "Sans entrée, recs-api n'accepte aucune requête HTTP, même depuis des applications du même environnement ou du même profil de charge de travail." }
references:
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
