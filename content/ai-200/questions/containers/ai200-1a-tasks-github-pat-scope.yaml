id: ai200-1a-tasks-github-pat-scope
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank keeps the source code of its document-extraction API in a **private** GitHub repository. You plan to create an ACR task with `az acr task create` that builds the image each time a commit is pushed to the `main` branch.

    You create a GitHub personal access token (PAT) for the `--git-access-token` parameter.

    Which scope must the token have?
  fr: |
    Woodgrove Bank conserve le code source de son API d'extraction de documents dans un dépôt GitHub **privé**. Vous prévoyez de créer avec `az acr task create` une tâche ACR qui génère l'image à chaque commit envoyé sur la branche `main`.

    Vous créez un jeton d'accès personnel (PAT) GitHub pour le paramètre `--git-access-token`.

    Quelle étendue le jeton doit-il avoir ?
body:
  options:
    - { id: a, text: "repo:status and public_repo" }
    - { id: b, text: repo }
    - { id: c, text: "read:packages" }
    - { id: d, text: "workflow" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a source code commit trigger on a private GitHub repository, ACR Tasks needs a PAT with the repo scope (full control). A public repository needs only repo:status and public_repo.
    fr: |
      Pour un déclencheur de commit sur un dépôt GitHub privé, ACR Tasks a besoin d'un PAT doté de l'étendue repo (contrôle total). Un dépôt public ne nécessite que repo:status et public_repo.
  options:
    a: { en: "These scopes are enough for a public repository only.", fr: "Ces étendues suffisent uniquement pour un dépôt public." }
    c: { en: "read:packages gives access to GitHub Packages, not to the repository code.", fr: "read:packages donne accès à GitHub Packages, pas au code du dépôt." }
    d: { en: "workflow lets a token update GitHub Actions workflow files; it isn't what ACR Tasks requires.", fr: "workflow permet à un jeton de modifier les fichiers de workflow GitHub Actions ; ce n'est pas ce qu'exige ACR Tasks." }
references:
  - title: Automate container image builds and maintenance with Azure Container Registry tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-overview
