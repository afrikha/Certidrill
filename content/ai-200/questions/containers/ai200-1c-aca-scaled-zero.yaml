id: ai200-1c-aca-scaled-zero
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin runs a Python batch scorer in Azure Container Apps. The container app uses the default scale settings, with a minimum replica count of 0.

    A developer opens **Monitoring** > **Log stream** for the app in the Azure portal and selects **Console**. Instead of the application output, the page displays the message **This revision is scaled to zero.**

    You need the developer to be able to watch the console output of the app in the log stream.

    What should you do?
  fr: |
    Tailspin exécute un évaluateur par lots Python dans Azure Container Apps. L'application conteneur utilise les paramètres de mise à l'échelle par défaut, avec un nombre minimal de réplicas de 0.

    Un développeur ouvre **Monitoring** > **Log stream** pour l'application dans le portail Azure et sélectionne **Console**. Au lieu de la sortie de l'application, la page affiche le message **This revision is scaled to zero.**

    Le développeur doit pouvoir suivre la sortie de console de l'application dans le flux de journaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select **System** instead of **Console** in the log stream.", fr: "Sélectionner **System** au lieu de **Console** dans le flux de journaux." } }
    - { id: b, text: { en: "Enable HTTP logs in the diagnostic settings of the environment.", fr: "Activer les journaux HTTP dans les paramètres de diagnostic de l'environnement." } }
    - { id: c, text: { en: "Open a shell in the container by using **Monitoring** > **Console**.", fr: "Ouvrir un shell dans le conteneur à l'aide de **Monitoring** > **Console**." } }
    - { id: d, text: { en: "Deploy a new revision that has a minimum replica count of 1.", fr: "Déployer une nouvelle révision dont le nombre minimal de réplicas est de 1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The console log stream reads the output of a running replica, and a revision scaled to zero has none. Microsoft's troubleshooting guidance for this message is to go to revision management and deploy a new revision with a minimum replica count of 1, so that a replica keeps running and its stdout and stderr can be streamed.
    fr: |
      Le flux de journaux de console lit la sortie d'un réplica en cours d'exécution, et une révision mise à l'échelle à zéro n'en a aucun. Pour ce message, la procédure de dépannage de Microsoft consiste à ouvrir la gestion des révisions et à déployer une nouvelle révision avec un nombre minimal de réplicas de 1, afin qu'un réplica reste actif et que son stdout et son stderr puissent être diffusés.
  options:
    a:
      en: |
        System logs contain service events such as revision provisioning, not the output that the application prints.
      fr: |
        Les journaux système contiennent des événements du service, comme l'approvisionnement des révisions, pas la sortie affichée par l'application.
    b:
      en: |
        HTTP logs record ingress requests (status codes, durations) and are sent to a destination; they are not the console output and do not start a replica.
      fr: |
        Les journaux HTTP enregistrent les requêtes d'entrée (codes d'état, durées) et sont envoyés vers une destination ; ils ne constituent pas la sortie de console et ne démarrent aucun réplica.
    c:
      en: |
        A console session connects to a running replica, and there is none to connect to; a shell would not show the log stream anyway.
      fr: |
        Une session de console se connecte à un réplica en cours d'exécution, et il n'y en a aucun ; un shell n'afficherait de toute façon pas le flux de journaux.
references:
  - title: Troubleshoot a container app
    url: https://learn.microsoft.com/en-us/azure/container-apps/troubleshooting
  - title: View log streams in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-streaming
