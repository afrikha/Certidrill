id: ai200-1b-env-count
objective: "1.2.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Contoso is moving three services of its document question-answering solution to Azure Container Apps: **rag-api**, **embed-worker** and **eval-sandbox**.

    rag-api calls embed-worker through the Dapr service invocation API, and both apps must send their logs to the same Log Analytics workspace. eval-sandbox runs untrusted evaluation code. It must not share compute resources with rag-api or embed-worker, and it must not be able to call them through Dapr service invocation.

    You need to meet the requirements by using the minimum number of Container Apps environments. How many environments should you create?
  fr: |
    Contoso migre trois services de sa solution de questions-réponses sur des documents vers Azure Container Apps : **rag-api**, **embed-worker** et **eval-sandbox**.

    rag-api appelle embed-worker via l'API d'appel de service Dapr, et les deux applications doivent envoyer leurs journaux au même espace de travail Log Analytics. eval-sandbox exécute du code d'évaluation non approuvé. Il ne doit pas partager de ressources de calcul avec rag-api ni avec embed-worker, et il ne doit pas pouvoir les appeler via l'appel de service Dapr.

    Vous devez respecter ces exigences avec le nombre minimal d'environnements Container Apps. Combien d'environnements devez-vous créer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: Apps in the same environment share the same virtual network, the same log destination and Dapr service invocation, so rag-api and embed-worker belong together. Microsoft recommends separate environments when apps must not share compute resources or must not communicate through Dapr service invocation, so eval-sandbox needs its own environment, for a total of two.
    fr: "Les applications d'un même environnement partagent le même réseau virtuel, la même destination de journaux et l'appel de service Dapr : rag-api et embed-worker vont donc ensemble. Microsoft recommande des environnements distincts quand des applications ne doivent pas partager de ressources de calcul ni communiquer via l'appel de service Dapr : eval-sandbox a donc besoin de son propre environnement, soit deux au total."
  options:
    a:
      en: In a single environment, eval-sandbox could reach the other apps through Dapr service invocation.
      fr: Dans un seul environnement, eval-sandbox pourrait joindre les autres applications via l'appel de service Dapr.
    c:
      en: rag-api and embed-worker must share Dapr service invocation and a log destination, which requires them to be in the same environment.
      fr: rag-api et embed-worker doivent partager l'appel de service Dapr et une destination de journaux, ce qui impose qu'ils soient dans le même environnement.
    d:
      en: Three apps never need more than three environments, and only two isolation boundaries are required here.
      fr: Trois applications n'ont jamais besoin de plus de trois environnements, et seules deux frontières d'isolation sont nécessaires ici.
references:
  - title: Azure Container Apps environments
    url: https://learn.microsoft.com/en-us/azure/container-apps/environment
