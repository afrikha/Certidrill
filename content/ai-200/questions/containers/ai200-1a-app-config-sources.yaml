id: ai200-1a-app-config-sources
objective: "1.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys deploys the same RAG API image to a test app and a production app in Azure App Service. The image comes from Azure Container Registry, except for a partner add-on image hosted in the partner's private registry outside Azure, which supports only user name and password authentication. No secret may be stored in the image or in plain text in the App Service configuration, except where no other option exists.

    Which configuration should you use for each item? To answer, drag the appropriate configurations to the correct items. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys déploie la même image d'API RAG dans une application de test et une application de production d'Azure App Service. L'image provient d'Azure Container Registry, à l'exception d'une image complémentaire d'un partenaire, hébergée dans le registre privé de ce partenaire hors d'Azure, qui ne prend en charge que l'authentification par nom d'utilisateur et mot de passe. Aucun secret ne doit être stocké dans l'image ni en clair dans la configuration App Service, sauf en l'absence d'autre option.

    Quelle configuration devez-vous utiliser pour chaque élément ? Pour répondre, faites glisser les configurations appropriées vers les éléments correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: plain, text: { en: "An app setting with a plain value", fr: "Un paramètre d'application avec une valeur en clair" } }
    - { id: kvref, text: { en: "An app setting with a Key Vault reference", fr: "Un paramètre d'application avec une référence Key Vault" } }
    - { id: mi, text: { en: "The app's managed identity with AcrPull", fr: "L'identité managée de l'application avec AcrPull" } }
    - { id: creds, text: { en: "Registry URL, user name and password in the container settings", fr: "URL, nom d'utilisateur et mot de passe du registre dans les paramètres du conteneur" } }
    - { id: env, text: { en: "An ENV instruction in the Dockerfile", fr: "Une instruction ENV dans le Dockerfile" } }
  targets:
    - { id: t1, text: { en: "The search endpoint URL, which differs between test and production and isn't secret", fr: "L'URL du point de terminaison de recherche, qui diffère entre test et production et n'est pas secrète" } }
    - { id: t2, text: { en: "The Azure OpenAI API key, read by the code from an environment variable", fr: "La clé d'API Azure OpenAI, lue par le code dans une variable d'environnement" } }
    - { id: t3, text: { en: "Pulling the RAG API image", fr: "Le tirage de l'image de l'API RAG" } }
    - { id: t4, text: { en: "Pulling the partner add-on image", fr: "Le tirage de l'image complémentaire du partenaire" } }
answer:
  mapping: { t1: plain, t2: kvref, t3: mi, t4: creds }
explanation:
  correct:
    en: |
      App settings become environment variables, so a plain app setting fits a non-secret value that changes per environment. A Key Vault reference keeps the secret in the vault while the code still reads an environment variable. Azure Container Registry supports pulls with a managed identity and AcrPull, whereas a registry that accepts only user name and password needs credentials in the container settings.
    fr: |
      Les paramètres d'application deviennent des variables d'environnement : un paramètre d'application en clair convient à une valeur non secrète qui change selon l'environnement. Une référence Key Vault conserve le secret dans le coffre, tandis que le code lit toujours une variable d'environnement. Azure Container Registry prend en charge le tirage avec une identité managée et AcrPull, alors qu'un registre qui n'accepte que le nom d'utilisateur et le mot de passe nécessite des informations d'identification dans les paramètres du conteneur.
  options:
    env: { en: "An ENV value is baked into the image, so the same image couldn't carry different values for test and production.", fr: "Une valeur ENV est figée dans l'image : la même image ne pourrait pas porter des valeurs différentes pour le test et la production." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
