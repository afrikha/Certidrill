id: ai200-sr1-cpu-autoscale-2
objective: "1.2.3"
type: series_yesno
series: ai200-sr1-cpu-autoscale
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You set the replica count of the Deployment to 8.
  fr: Vous définissez le nombre de réplicas du Deployment sur 8.
body:
  solution:
    en: |
      You change `replicas: 2` to `replicas: 8` in the embed-api Deployment manifest, and you run `kubectl apply` with the updated manifest.
    fr: |
      Vous remplacez `replicas: 2` par `replicas: 8` dans le manifeste du Deployment embed-api, puis vous exécutez `kubectl apply` avec le manifeste mis à jour.
answer: { value: false }
explanation:
  correct:
    en: The `replicas` field sets a fixed number of pods, exactly like a manual `kubectl scale --replicas=8`. Eight pods would run all the time whatever the CPU load, and nothing would scale the Deployment back to 2 pods or react to the 60 percent target.
    fr: "Le champ `replicas` définit un nombre fixe de pods, exactement comme une commande manuelle `kubectl scale --replicas=8`. Huit pods s'exécuteraient en permanence quelle que soit la charge du processeur, et rien ne ramènerait le Deployment à 2 pods ni ne réagirait à la cible de 60 %."
references:
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
