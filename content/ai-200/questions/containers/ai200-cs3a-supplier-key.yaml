id: ai200-cs3a-supplier-key
objective: "1.1.3"
type: single
caseStudy: ai200-cs3a-coho-vineyard
difficulty: 1
status: draft
stem:
  en: |
    You need to configure app-coho-pairing to meet the supplier key requirement. What should you do?
  fr: |
    Vous devez configurer app-coho-pairing pour respecter l'exigence relative à la clé du fournisseur. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add an app setting named `SUPPLIER_API_KEY` whose value is `@Microsoft.KeyVault(SecretUri=https://kv-coho.vault.azure.net/secrets/supplier-api-key)`."
        fr: "Ajouter un paramètre d'application nommé `SUPPLIER_API_KEY` dont la valeur est `@Microsoft.KeyVault(SecretUri=https://kv-coho.vault.azure.net/secrets/supplier-api-key)`."
    - id: b
      text:
        en: "Add an app setting named `SUPPLIER_API_KEY` whose value is `@Microsoft.KeyVault(SecretUri=https://kv-coho.vault.azure.net/secrets/supplier-api-key/3f1c9a7b2e5d4c8a)`."
        fr: "Ajouter un paramètre d'application nommé `SUPPLIER_API_KEY` dont la valeur est `@Microsoft.KeyVault(SecretUri=https://kv-coho.vault.azure.net/secrets/supplier-api-key/3f1c9a7b2e5d4c8a)`."
    - id: c
      text:
        en: "Add an app setting named `SUPPLIER_API_KEY` that contains the current value of supplier-api-key, and mark it as a deployment slot setting."
        fr: "Ajouter un paramètre d'application nommé `SUPPLIER_API_KEY` qui contient la valeur actuelle de supplier-api-key, et le marquer comme paramètre d'emplacement de déploiement."
    - id: d
      text:
        en: "Add a connection string named `SUPPLIER_API_KEY` of type Custom that contains the current value of supplier-api-key."
        fr: "Ajouter une chaîne de connexion nommée `SUPPLIER_API_KEY` de type Custom qui contient la valeur actuelle de supplier-api-key."
answer: { optionId: a }
explanation:
  correct:
    en: |
      App Service exposes app settings to a custom container as environment variables, so a Key Vault reference in the `SUPPLIER_API_KEY` setting needs no code change and stores no secret value. Because the URI has no version, App Service resolves the latest version and refetches the referenced secrets periodically, so new versions are picked up without a manual change. The system-assigned identity already has the Key Vault Secrets User role that the reference requires.
    fr: |
      App Service expose les paramètres d'application à un conteneur personnalisé sous forme de variables d'environnement : une référence Key Vault dans le paramètre `SUPPLIER_API_KEY` ne demande donc aucune modification du code et ne stocke aucune valeur de secret. Comme l'URI ne contient pas de version, App Service résout la dernière version et récupère à nouveau périodiquement les secrets référencés : les nouvelles versions sont prises en compte sans modification manuelle. L'identité affectée par le système a déjà le rôle Key Vault Secrets User dont la référence a besoin.
  options:
    b:
      en: |
        A reference whose URI contains a version always resolves that version, so the app keeps using the old key after func-coho-rotate stores a new one.
      fr: |
        Une référence dont l'URI contient une version résout toujours cette version : l'application continue d'utiliser l'ancienne clé après que func-coho-rotate en a stocké une nouvelle.
    c:
      en: |
        The secret value would be stored in the app settings, and the setting would not change when a new version is created.
      fr: |
        La valeur du secret serait stockée dans les paramètres d'application, et le paramètre ne changerait pas lors de la création d'une nouvelle version.
    d:
      en: |
        A connection string stores the secret value in the app configuration and is exposed with a `CUSTOMCONNSTR_` prefix, not as `SUPPLIER_API_KEY`.
      fr: |
        Une chaîne de connexion stocke la valeur du secret dans la configuration de l'application et est exposée avec un préfixe `CUSTOMCONNSTR_`, pas sous le nom `SUPPLIER_API_KEY`.
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
