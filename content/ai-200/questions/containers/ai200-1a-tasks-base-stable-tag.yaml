id: ai200-1a-tasks-base-stable-tag
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's platform team publishes a patched Node.js base image every month in the Azure container registry **crfabrikam**, each time under a new tag such as `base/node:20-2026.10` and then `base/node:20-2026.11`.

    The ACR task **build-chat-ui** builds a front end for an AI assistant from a Dockerfile that starts with `FROM crfabrikam.azurecr.io/base/node:20-2026.10`. The task has run successfully many times, and its base image update trigger is enabled. However, the task never runs when the platform team publishes a new base image.

    You need the task to rebuild automatically after each monthly patch, without monthly changes to the Dockerfile. What should you do?
  fr: |
    L'équipe plateforme de Fabrikam publie chaque mois une image de base Node.js corrigée dans le registre de conteneurs Azure **crfabrikam**, chaque fois sous une nouvelle balise, par exemple `base/node:20-2026.10` puis `base/node:20-2026.11`.

    La tâche ACR **build-chat-ui** génère le front-end d'un assistant d'IA à partir d'un Dockerfile qui commence par `FROM crfabrikam.azurecr.io/base/node:20-2026.10`. La tâche s'est exécutée avec succès à de nombreuses reprises et son déclencheur de mise à jour de l'image de base est activé. Pourtant, elle ne s'exécute jamais quand l'équipe plateforme publie une nouvelle image de base.

    Vous devez faire en sorte que la tâche régénère automatiquement l'image après chaque correctif mensuel, sans modification mensuelle du Dockerfile. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run az acr task update with --base-image-trigger-enabled true.", fr: "Exécuter az acr task update avec --base-image-trigger-enabled true." } }
    - { id: b, text: { en: "Run az acr task update with --pull-request-trigger-enabled true.", fr: "Exécuter az acr task update avec --pull-request-trigger-enabled true." } }
    - { id: c, text: { en: "Run the task once with az acr task run so that it detects the base image dependency.", fr: "Exécuter la tâche une fois avec az acr task run pour qu'elle détecte la dépendance envers l'image de base." } }
    - { id: d, text: { en: "Publish each patch under a stable tag, base/node:20, used in FROM.", fr: "Publier chaque correctif sous une balise stable, base/node:20, utilisée dans FROM." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A base image update trigger fires when the image behind the tag referenced in FROM is updated. Publishing a patch under a new tag doesn't update the tag the Dockerfile uses, so nothing happens. The base image must be maintained under a stable tag that receives each patch.
    fr: |
      Un déclencheur de mise à jour de l'image de base se déclenche quand l'image derrière la balise référencée dans FROM est mise à jour. Publier un correctif sous une nouvelle balise ne met pas à jour la balise utilisée par le Dockerfile : rien ne se passe. L'image de base doit être maintenue sous une balise stable qui reçoit chaque correctif.
  options:
    a: { en: "The trigger is already enabled (it is enabled by default); the problem is the tag the Dockerfile references.", fr: "Le déclencheur est déjà activé (il l'est par défaut) ; le problème vient de la balise référencée par le Dockerfile." }
    b: { en: "The pull request trigger reacts to pull requests in the source repository, not to base images.", fr: "Le déclencheur de demande de tirage réagit aux demandes de tirage du dépôt source, pas aux images de base." }
    c: { en: "A first run is needed to start tracking, but the task has already run many times.", fr: "Une première exécution est nécessaire pour démarrer le suivi, mais la tâche s'est déjà exécutée de nombreuses fois." }
references:
  - title: About base image updates for ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-base-images
