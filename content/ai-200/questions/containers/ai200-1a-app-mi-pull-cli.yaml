id: ai200-1a-app-mi-pull-cli
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys its summarization API to the App Service app **app-pro-sum**. The release pipeline built the image `sum/api:2.1.0-41a9c3e` in the Azure container registry **crproseware**, whose resource ID is stored in `$acrId`.

    The app must pull the image with its system-assigned managed identity, with the least privilege, and every instance of the app must run exactly this build.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware déploie son API de synthèse dans l'application App Service **app-pro-sum**. Le pipeline de mise en production a généré l'image `sum/api:2.1.0-41a9c3e` dans le registre de conteneurs Azure **crproseware**, dont l'ID de ressource est stocké dans `$acrId`.

    L'application doit tirer l'image avec son identité managée attribuée par le système, avec le moindre privilège, et chaque instance de l'application doit exécuter exactement ce build.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    principalId=$(az webapp identity assign --resource-group rg-pro --name app-pro-sum \
      --query principalId --output tsv)

    az role assignment create --assignee $principalId --scope $acrId --role [[role]]

    az webapp config set --resource-group rg-pro --name app-pro-sum \
      --generic-configurations '{"[[prop]]": true}'

    az webapp config container set --resource-group rg-pro --name app-pro-sum \
      --container-image-name [[img]]
  slots:
    - id: role
      options:
        - { id: pull, text: AcrPull }
        - { id: push, text: AcrPush }
        - { id: reader, text: Reader }
        - { id: tasks, text: "\"Container Registry Tasks Contributor\"" }
    - id: prop
      options:
        - { id: acrmi, text: acrUseManagedIdentityCreds }
        - { id: vnetpull, text: vnetImagePullEnabled }
        - { id: routeall, text: vnetRouteAllEnabled }
    - id: img
      options:
        - { id: full, text: "crproseware.azurecr.io/sum/api:2.1.0-41a9c3e" }
        - { id: short, text: "sum/api:2.1.0-41a9c3e" }
        - { id: latest, text: "crproseware.azurecr.io/sum/api:latest" }
answer:
  values: { role: pull, prop: acrmi, img: full }
explanation:
  correct:
    en: |
      The app's identity needs only AcrPull on the registry. Setting acrUseManagedIdentityCreds to true makes App Service pull with the managed identity instead of registry credentials. The image name includes the registry's login server and the unique tag of the build, so every instance pulls the same image.
    fr: |
      L'identité de l'application n'a besoin que d'AcrPull sur le registre. Définir acrUseManagedIdentityCreds sur true fait tirer l'image par App Service avec l'identité managée plutôt qu'avec des informations d'identification de registre. Le nom de l'image comprend le serveur de connexion du registre et la balise unique du build : chaque instance tire la même image.
  options:
    push: { en: "AcrPush also allows pushing, more than the app needs.", fr: "AcrPush permet aussi l'envoi, plus que ce dont l'application a besoin." }
    reader: { en: "Reader is a control-plane role that doesn't allow pulling images.", fr: "Reader est un rôle du plan de contrôle qui ne permet pas de tirer des images." }
    tasks: { en: "This role manages ACR Tasks and has no data-plane access to images.", fr: "Ce rôle gère ACR Tasks et n'a aucun accès aux images sur le plan de données." }
    vnetpull: { en: "vnetImagePullEnabled routes pulls through a virtual network; it doesn't select the managed identity.", fr: "vnetImagePullEnabled fait passer les tirages par un réseau virtuel ; il ne sélectionne pas l'identité managée." }
    routeall: { en: "vnetRouteAllEnabled controls outbound routing, not registry authentication.", fr: "vnetRouteAllEnabled contrôle le routage sortant, pas l'authentification auprès du registre." }
    short: { en: "Without the login server, the image name would refer to Docker Hub.", fr: "Sans le serveur de connexion, le nom de l'image désignerait Docker Hub." }
    latest: { en: "latest is a moving tag, so instances could run different builds.", fr: "latest est une balise mobile : les instances pourraient exécuter des builds différents." }
references:
  - title: Configure a custom container for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-custom-container
  - title: Recommendations for tagging and versioning container images
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
