id: ai200-1b-aks-service-types
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is writing the Service manifests of three components of an AI shopping assistant that runs on Azure Kubernetes Service (AKS).

    Which Service type should you use for each component? To answer, drag the appropriate Service types to the correct components. Each Service type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam rédige les manifestes des Services de trois composants d'un assistant d'achat d'IA qui s'exécute sur Azure Kubernetes Service (AKS).

    Quel type de Service devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les types de Services appropriés vers les composants correspondants. Chaque type de Service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: clusterip, text: ClusterIP }
    - { id: nodeport, text: NodePort }
    - { id: lb, text: LoadBalancer }
    - { id: external, text: ExternalName }
  targets:
    - { id: embed, text: { en: "An embedding service called only by other pods of the cluster", fr: "Un service d'incorporation appelé uniquement par d'autres pods du cluster" } }
    - { id: web, text: { en: "A web front end that must get a public IP address from an Azure load balancer", fr: "Un front-end web qui doit obtenir une adresse IP publique d'un équilibreur de charge Azure" } }
    - { id: legacy, text: { en: "A legacy appliance that must reach the service on a static port of each node's IP address", fr: "Une appliance héritée qui doit joindre le service sur un port statique de l'adresse IP de chaque nœud" } }
answer:
  mapping: { embed: clusterip, web: lb, legacy: nodeport }
explanation:
  correct:
    en: ClusterIP, the default type, creates an internal IP address for use within the cluster only. LoadBalancer creates an Azure load balancer with an external IP address and adds the pods to its backend pool. NodePort maps a port on the nodes, so the app is reachable on each node's IP address and port.
    fr: "ClusterIP, le type par défaut, crée une adresse IP interne utilisable uniquement dans le cluster. LoadBalancer crée un équilibreur de charge Azure doté d'une adresse IP externe et ajoute les pods à son pool principal. NodePort mappe un port sur les nœuds : l'application est joignable sur l'adresse IP et le port de chaque nœud."
  options:
    external: { en: "ExternalName gives a Service a DNS name instead of selecting pods; none of the components needs it.", fr: "ExternalName donne un nom DNS à un Service au lieu de sélectionner des pods ; aucun des composants n'en a besoin." }
references:
  - title: Concepts - Services in Azure Kubernetes Services (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-network-services
