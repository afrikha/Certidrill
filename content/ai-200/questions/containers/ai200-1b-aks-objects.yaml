id: ai200-1b-aks-objects
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is writing the manifest files that deploy its retrieval API to Azure Kubernetes Service (AKS).

    Which Kubernetes object should you use for each requirement? To answer, drag the appropriate objects to the correct requirements. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige les fichiers manifeste qui déploient son API de récupération sur Azure Kubernetes Service (AKS).

    Quel objet Kubernetes devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les objets appropriés vers les exigences correspondantes. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: deployment, text: Deployment }
    - { id: service, text: Service }
    - { id: configmap, text: ConfigMap }
    - { id: secret, text: Secret }
    - { id: hpa, text: HorizontalPodAutoscaler }
    - { id: namespace, text: Namespace }
  targets:
    - { id: index, text: { en: "Store the non-sensitive name of the search index that the pods read as an environment variable.", fr: "Stocker le nom non sensible de l'index de recherche que les pods lisent comme variable d'environnement." } }
    - { id: replicas, text: { en: "Keep three replicas of the API pod running and replace them when the image changes.", fr: "Maintenir trois réplicas du pod de l'API en cours d'exécution et les remplacer quand l'image change." } }
    - { id: cpu, text: { en: "Add pods when the average CPU utilization exceeds 60 percent.", fr: "Ajouter des pods quand l'utilisation moyenne du processeur dépasse 60 %." } }
    - { id: dns, text: { en: "Give the API pods a stable name and a single virtual IP address in the cluster.", fr: "Donner aux pods de l'API un nom stable et une seule adresse IP virtuelle dans le cluster." } }
answer:
  mapping: { index: configmap, replicas: deployment, cpu: hpa, dns: service }
explanation:
  correct:
    en: A ConfigMap holds non-sensitive settings that pods consume as environment variables or files. A Deployment maintains the desired number of pod replicas and rolls out new pods when the pod template changes. A HorizontalPodAutoscaler adjusts the replica count from metrics such as CPU utilization. A Service gives the pods that match its selector a stable name and virtual IP address.
    fr: Une ConfigMap contient des paramètres non sensibles que les pods consomment comme variables d'environnement ou fichiers. Un Deployment maintient le nombre souhaité de réplicas de pods et déploie de nouveaux pods quand le modèle de pod change. Un HorizontalPodAutoscaler ajuste le nombre de réplicas d'après des métriques comme l'utilisation du processeur. Un Service donne aux pods qui correspondent à son sélecteur un nom et une adresse IP virtuelle stables.
  options:
    secret: { en: "A Secret is for sensitive values; the index name isn't sensitive.", fr: "Un Secret est destiné aux valeurs sensibles ; le nom de l'index ne l'est pas." }
    namespace: { en: "A namespace groups objects; it meets none of the requirements.", fr: "Un espace de noms regroupe des objets ; il ne répond à aucune des exigences." }
references:
  - title: Deploy an Azure Kubernetes Service (AKS) Cluster using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
