id: ai200-1a-acr-list-untagged-manifests
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware pushes a new build of its chatbot API to the stable tag `chat/api:dev` several times a day in the Azure container registry **crproseware**. The registry's storage keeps growing.

    Before cleaning up, you need to list every manifest of the `chat/api` repository, including the manifests that no longer have any tag, with their digests and last update times.

    Which command should you run?
  fr: |
    Proseware envoie plusieurs fois par jour un nouveau build de son API de chatbot sur la balise stable `chat/api:dev` du registre de conteneurs Azure **crproseware**. Le stockage du registre ne cesse d'augmenter.

    Avant le nettoyage, vous devez lister tous les manifestes du dépôt `chat/api`, y compris ceux qui n'ont plus aucune balise, avec leur synthèse (digest) et leur date de dernière mise à jour.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az acr repository show-tags --name crproseware --repository chat/api" }
    - { id: b, text: "az acr manifest list-metadata --name chat/api --registry crproseware" }
    - { id: c, text: "az acr repository list --name crproseware" }
    - { id: d, text: "az acr repository show --name crproseware --repository chat/api" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `az acr manifest list-metadata` lists the manifests of a repository with their digest, tags and last update time. Untagged manifests appear without a tags field, which lets you find the orphaned images left behind by each push to the stable tag.
    fr: |
      `az acr manifest list-metadata` liste les manifestes d'un dépôt avec leur synthèse, leurs balises et leur date de dernière mise à jour. Les manifestes non balisés apparaissent sans champ tags, ce qui permet de repérer les images orphelines laissées par chaque envoi sur la balise stable.
  options:
    a: { en: "show-tags lists tags; a manifest without any tag can't appear in its output.", fr: "show-tags liste les balises ; un manifeste sans balise ne peut pas apparaître dans sa sortie." }
    c: { en: "This command lists the repositories of the registry, not their manifests.", fr: "Cette commande liste les dépôts du registre, pas leurs manifestes." }
    d: { en: "This command shows the attributes of the repository (such as its lock settings), not its manifests.", fr: "Cette commande affiche les attributs du dépôt (par exemple ses paramètres de verrouillage), pas ses manifestes." }
references:
  - title: Delete container images in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-delete
