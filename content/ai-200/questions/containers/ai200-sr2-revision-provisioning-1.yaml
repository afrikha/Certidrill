id: ai200-sr2-revision-provisioning-1
objective: "1.2.4"
type: series_yesno
series: ai200-sr2-revision-provisioning
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You stream the console logs of the new revision.
  fr: Vous diffusez les journaux de console de la nouvelle révision.
body:
  solution:
    en: |
      You run the following command.

      ```bash
      az containerapp logs show --name ca-tailspin-rank --resource-group rg-tailspin \
        --revision ca-tailspin-rank--v4 --type console --tail 50
      ```
    fr: |
      Vous exécutez la commande suivante.

      ```bash
      az containerapp logs show --name ca-tailspin-rank --resource-group rg-tailspin \
        --revision ca-tailspin-rank--v4 --type console --tail 50
      ```
answer: { value: false }
explanation:
  correct:
    en: Console logs contain only what the containers write to stdout and stderr. A provisioning error such as ErrImagePull is a service-level event that appears in the system logs, and a revision without a running replica has no console output to stream.
    fr: "Les journaux de console contiennent uniquement ce que les conteneurs écrivent sur stdout et stderr. Une erreur d'approvisionnement telle qu'ErrImagePull est un événement de niveau service qui apparaît dans les journaux système, et une révision sans réplica en cours d'exécution n'a aucune sortie de console à diffuser."
references:
  - title: View log streams in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/log-streaming
  - title: Application logging in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/logging
