id: ai200-1a-tasks-keyvault-sequence
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware's chatbot image needs a token to download packages from a private feed during the build. The token is stored as the secret `feed-token` in the key vault **kv-proseware**, which uses the Azure role-based access control permission model, and it is rotated every month.

    The repository already contains a task file that declares the secret in its `secrets` section with the `keyvault` URL of `feed-token`. You need to create and test an ACR task that reads the current value of the secret at run time. No secret value may be passed to the Azure CLI.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'image du chatbot de Proseware a besoin d'un jeton pour télécharger des paquets depuis un flux privé pendant la génération. Le jeton est stocké sous le nom de secret `feed-token` dans le coffre de clés **kv-proseware**, qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure, et il est renouvelé chaque mois.

    Le dépôt contient déjà un fichier de tâche qui déclare le secret dans sa section `secrets` avec l'URL `keyvault` de `feed-token`. Vous devez créer et tester une tâche ACR qui lit la valeur actuelle du secret au moment de l'exécution. Aucune valeur secrète ne doit être transmise à l'Azure CLI.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create the task with `az acr task create` and the `--assign-identity` parameter.", fr: "Créer la tâche avec `az acr task create` et le paramètre `--assign-identity`." } }
    - { id: role, text: { en: "Assign the Key Vault Secrets User role on kv-proseware to the task's managed identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-proseware à l'identité managée de la tâche." } }
    - { id: run, text: { en: "Start the task with `az acr task run`.", fr: "Démarrer la tâche avec `az acr task run`." } }
    - { id: secretarg, text: { en: "Create the task with `--secret-arg FEED_TOKEN=<token-value>`.", fr: "Créer la tâche avec `--secret-arg FEED_TOKEN=<valeur-du-jeton>`." } }
    - { id: cred, text: { en: "Run `az acr task credential add --login-server kv-proseware.vault.azure.net --use-identity [system]`.", fr: "Exécuter `az acr task credential add --login-server kv-proseware.vault.azure.net --use-identity [system]`." } }
    - { id: admin, text: { en: "Enable the admin user of the registry.", fr: "Activer l'utilisateur administrateur du registre." } }
answer:
  sequence: [ create, role, run ]
explanation:
  correct:
    en: |
      The task needs a managed identity to read Key Vault secrets, and a system-assigned identity exists only once the task is created with --assign-identity. You can then grant this identity read access to the secret (Key Vault Secrets User in the RBAC model) and run the task, which resolves the secret from its keyvault URL at run time, so rotations need no change to the task.
    fr: |
      La tâche a besoin d'une identité managée pour lire des secrets Key Vault, et une identité attribuée par le système n'existe qu'une fois la tâche créée avec --assign-identity. Vous pouvez alors accorder à cette identité l'accès en lecture au secret (Key Vault Secrets User dans le modèle RBAC), puis exécuter la tâche, qui résout le secret à partir de son URL keyvault au moment de l'exécution : les renouvellements ne nécessitent aucune modification de la tâche.
  options:
    secretarg: { en: "The token value would be passed to the CLI and would have to be updated after each rotation.", fr: "La valeur du jeton serait transmise à la CLI et devrait être mise à jour après chaque renouvellement." }
    cred: { en: "Task credentials authenticate to container registries, not to a key vault.", fr: "Les informations d'identification de tâche servent à s'authentifier auprès de registres de conteneurs, pas d'un coffre de clés." }
    admin: { en: "The admin user is unrelated to reading Key Vault secrets.", fr: "L'utilisateur administrateur n'a aucun rapport avec la lecture des secrets Key Vault." }
references:
  - title: Use an Azure-managed identity in ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-authentication-managed-identity
  - title: "ACR Tasks reference: YAML"
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-reference-yaml
