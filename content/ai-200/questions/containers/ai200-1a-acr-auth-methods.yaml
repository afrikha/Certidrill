id: ai200-1a-acr-auth-methods
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores the images of its AI services in the Azure container registry **crcontoso**. Several clients must authenticate to the registry. The solution must avoid shared accounts and, where possible, stored secrets.

    Which authentication method should each client use? To answer, drag the appropriate methods to the correct clients. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke les images de ses services d'IA dans le registre de conteneurs Azure **crcontoso**. Plusieurs clients doivent s'authentifier auprès du registre. La solution doit éviter les comptes partagés et, dans la mesure du possible, les secrets stockés.

    Quelle méthode d'authentification chaque client doit-il utiliser ? Pour répondre, faites glisser les méthodes appropriées vers les clients correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: entra, text: { en: "Individual Microsoft Entra identity with az acr login", fr: "Identité Microsoft Entra individuelle avec az acr login" } }
    - { id: mi, text: { en: "Managed identity with the AcrPull role", fr: "Identité managée avec le rôle AcrPull" } }
    - { id: sp, text: { en: "Service principal with the AcrPush role", fr: "Principal de service avec le rôle AcrPush" } }
    - { id: admin, text: { en: "Admin user", fr: "Utilisateur administrateur" } }
    - { id: token, text: { en: "Repository-scoped token", fr: "Jeton limité à des dépôts" } }
  targets:
    - { id: dev, text: { en: "A developer pushes test images from a workstation", fr: "Un développeur envoie des images de test depuis son poste de travail" } }
    - { id: app, text: { en: "An Azure App Service app pulls its container image", fr: "Une application Azure App Service tire son image conteneur" } }
    - { id: ci, text: { en: "A third-party SaaS build service outside Azure pushes images unattended", fr: "Un service de build SaaS tiers, hors d'Azure, envoie des images sans surveillance" } }
    - { id: partner, text: { en: "A partner system without any identity in your Microsoft Entra tenant pulls images from the partner/ repositories only", fr: "Le système d'un partenaire, sans identité dans votre locataire Microsoft Entra, tire des images uniquement depuis les dépôts partner/" } }
answer:
  mapping: { dev: entra, app: mi, ci: sp, partner: token }
explanation:
  correct:
    en: |
      Developers use their own Microsoft Entra identity with az acr login (token valid three hours). Azure services that support managed identities, such as App Service, pull with a managed identity and AcrPull, with no secret. Unattended pipelines outside Azure use a service principal with a role. A repository-scoped token grants access to specific repositories for clients outside Microsoft Entra ID. The admin user is a single shared account with full push and pull, meant only for testing.
    fr: |
      Les développeurs utilisent leur propre identité Microsoft Entra avec az acr login (jeton valide trois heures). Les services Azure qui prennent en charge les identités managées, comme App Service, tirent avec une identité managée et AcrPull, sans secret. Les pipelines sans surveillance hors d'Azure utilisent un principal de service doté d'un rôle. Un jeton limité à des dépôts accorde l'accès à des dépôts précis à des clients hors de Microsoft Entra ID. L'utilisateur administrateur est un compte unique partagé avec envoi et tirage complets, prévu uniquement pour les tests.
  options:
    admin: { en: "The admin user is a shared account with full push and pull rights and no role-based scoping.", fr: "L'utilisateur administrateur est un compte partagé avec des droits complets d'envoi et de tirage, sans restriction par rôle." }
references:
  - title: Authenticate with Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
