id: ai200-1b-internal-ingress
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso is deploying an embedding service named **ca-embed** to an existing Azure Container Apps environment by using `az containerapp create`. The container serves HTTP requests on port 8000.

    ca-embed must be reachable only from the other container apps of the same environment, and those apps must call it over HTTP.

    Which two parameters should you include in the command? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un service d'incorporation nommé **ca-embed** dans un environnement Azure Container Apps existant à l'aide de `az containerapp create`. Le conteneur sert des requêtes HTTP sur le port 8000.

    ca-embed doit être joignable uniquement depuis les autres applications conteneur du même environnement, et ces applications doivent l'appeler en HTTP.

    Quels sont les deux paramètres que vous devez inclure dans la commande ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "--ingress internal" }
    - { id: b, text: "--ingress external" }
    - { id: c, text: "--target-port 8000" }
    - { id: d, text: "--transport tcp" }
    - { id: e, text: "--exposed-port 8000" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: With internal ingress, the app's FQDN is reachable only from within the same environment. The target port tells the ingress which port the container listens on, here 8000; HTTP ingress terminates TLS and forwards the requests to that port.
    fr: Avec une entrée interne, le FQDN de l'application n'est joignable que depuis le même environnement. Le port cible indique à l'entrée le port sur lequel le conteneur écoute, ici 8000 ; l'entrée HTTP termine TLS et transmet les requêtes à ce port.
  options:
    b: { en: "External ingress exposes the app through the environment's inbound IP, beyond the other apps of the environment.", fr: "L'entrée externe expose l'application via l'adresse IP entrante de l'environnement, au-delà des autres applications de l'environnement." }
    d: { en: "TCP transport is for non-HTTP protocols; the callers use HTTP.", fr: "Le transport TCP est destiné aux protocoles non HTTP ; les appelants utilisent HTTP." }
    e: { en: "--exposed-port is an additional port that only the TCP transport supports.", fr: "--exposed-port est un port supplémentaire que seul le transport TCP prend en charge." }
references:
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
  - title: az containerapp
    url: https://learn.microsoft.com/en-us/cli/azure/containerapp
