id: ai200-1a-acr-import-public-base
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware builds its document-classification API from the public Docker Hub image `python:3.12-slim`. To avoid Docker Hub rate limits, the team wants a copy of this image in the Azure container registry **crlitware** under the name `base/python:3.12-slim`.

    The copy must be made from Azure Cloud Shell, which has no Docker daemon.

    Which command should you run?
  fr: |
    Litware génère son API de classification de documents à partir de l'image publique Docker Hub `python:3.12-slim`. Pour éviter les limites de débit de Docker Hub, l'équipe veut une copie de cette image dans le registre de conteneurs Azure **crlitware** sous le nom `base/python:3.12-slim`.

    La copie doit être effectuée depuis Azure Cloud Shell, qui ne dispose d'aucun démon Docker.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az acr build --registry crlitware --image base/python:3.12-slim docker.io/library/python:3.12-slim" }
    - { id: b, text: "az acr import --name crlitware --source docker.io/library/python:3.12-slim --image base/python:3.12-slim" }
    - { id: c, text: "az acr repository update --name crlitware --image base/python:3.12-slim --write-enabled true" }
    - { id: d, text: "docker pull python:3.12-slim && docker push crlitware.azurecr.io/base/python:3.12-slim" }
answer: { optionId: b }
explanation:
  correct:
    en: "`az acr import` copies an image from Docker Hub, another registry or a private registry into the target registry on the server side, without any Docker command or local daemon. Multi-architecture images are copied with all their platforms."
    fr: "`az acr import` copie côté serveur une image depuis Docker Hub, un autre registre ou un registre privé vers le registre cible, sans commande Docker ni démon local. Les images multiarchitectures sont copiées avec toutes leurs plateformes."
  options:
    a: { en: "az acr build builds an image from a source context such as a folder or a Git repository; an image reference isn't a build context.", fr: "az acr build génère une image à partir d'un contexte source (dossier, dépôt Git...) ; une référence d'image n'est pas un contexte de génération." }
    c: { en: "This command only changes the lock attributes of an image that must already exist in the registry.", fr: "Cette commande modifie seulement les attributs de verrouillage d'une image qui doit déjà exister dans le registre." }
    d: { en: "docker pull and docker push need a Docker daemon, which Cloud Shell doesn't have, and the image would also need to be retagged first.", fr: "docker pull et docker push nécessitent un démon Docker, absent de Cloud Shell, et l'image devrait aussi être rebalisée au préalable." }
references:
  - title: Import container images to a container registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-import-images
