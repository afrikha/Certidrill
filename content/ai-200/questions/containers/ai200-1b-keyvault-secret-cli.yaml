id: ai200-1b-keyvault-secret-cli
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is deploying a legal search API named **ca-lex-api** to Azure Container Apps. The Azure OpenAI key is stored as the secret `llm-key` in the key vault **kv-lex**. A user-assigned managed identity named **id-lex-api** has the Key Vault Secrets User role on kv-lex; its resource ID is stored in the shell variable `$IDENTITY_ID`.

    The key value must not appear in the command or in the app configuration, and the code reads the key from the environment variable `LLM_API_KEY`.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie une API de recherche juridique nommée **ca-lex-api** sur Azure Container Apps. La clé Azure OpenAI est stockée sous la forme du secret `llm-key` dans le coffre de clés **kv-lex**. Une identité managée affectée par l'utilisateur nommée **id-lex-api** dispose du rôle Key Vault Secrets User sur kv-lex ; son ID de ressource est stocké dans la variable shell `$IDENTITY_ID`.

    La valeur de la clé ne doit apparaître ni dans la commande ni dans la configuration de l'application, et le code lit la clé dans la variable d'environnement `LLM_API_KEY`.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az containerapp create --resource-group rg-lex --name ca-lex-api \
      --environment cae-lex --image crlitware.azurecr.io/lex/api:2.0.1 \
      [[assign]] "$IDENTITY_ID" \
      --secrets "llm-key=[[kv]]:https://kv-lex.vault.azure.net/secrets/llm-key,identityref:$IDENTITY_ID" \
      --env-vars "LLM_API_KEY=[[ref]]:llm-key"
  slots:
    - id: assign
      options:
        - { id: user, text: "--user-assigned" }
        - { id: system, text: "--system-assigned" }
        - { id: registry, text: "--registry-identity" }
    - id: kv
      options:
        - { id: kvkv, text: keyvaultref }
        - { id: kvsecret, text: secretref }
        - { id: kvidentity, text: identityref }
    - id: ref
      options:
        - { id: refsecret, text: secretref }
        - { id: refkv, text: keyvaultref }
        - { id: refidentity, text: identityref }
answer:
  values: { assign: user, kv: kvkv, ref: refsecret }
explanation:
  correct:
    en: "`--user-assigned` attaches id-lex-api to the app so that it can read Key Vault. A Key Vault reference uses the format `<name>=keyvaultref:<secret URI>,identityref:<identity ID>`, so the app stores only the reference, not the value. An environment variable gets its value from an app secret with `secretref:` followed by the secret name."
    fr: "`--user-assigned` associe id-lex-api à l'application pour qu'elle puisse lire Key Vault. Une référence Key Vault utilise le format `<nom>=keyvaultref:<URI du secret>,identityref:<ID de l'identité>` : l'application ne stocke que la référence, pas la valeur. Une variable d'environnement obtient sa valeur d'un secret de l'application avec `secretref:` suivi du nom du secret."
  options:
    system:
      en: "A system-assigned identity can't be used with the create command because it doesn't exist until the app is created, and it wouldn't be id-lex-api."
      fr: "Une identité affectée par le système ne peut pas être utilisée avec la commande create, car elle n'existe qu'après la création de l'application, et ce ne serait pas id-lex-api."
    registry:
      en: "`--registry-identity` only sets the identity used to pull images from Azure Container Registry."
      fr: "`--registry-identity` définit seulement l'identité utilisée pour tirer les images d'Azure Container Registry."
    kvsecret:
      en: "`secretref:` references an existing app secret from an environment variable; it doesn't point to Key Vault."
      fr: "`secretref:` référence un secret existant de l'application depuis une variable d'environnement ; il ne pointe pas vers Key Vault."
    refkv:
      en: "`keyvaultref:` belongs in the `--secrets` definition, not in an environment variable value."
      fr: "`keyvaultref:` s'utilise dans la définition `--secrets`, pas dans la valeur d'une variable d'environnement."
    kvidentity:
      en: "`identityref:` names the identity of a Key Vault reference; it is already given after the secret URI."
      fr: "`identityref:` désigne l'identité d'une référence Key Vault ; elle est déjà indiquée après l'URI du secret."
    refidentity:
      en: "`identityref:` names the identity of a Key Vault reference; it can't provide the value of an environment variable."
      fr: "`identityref:` désigne l'identité d'une référence Key Vault ; il ne peut pas fournir la valeur d'une variable d'environnement."
references:
  - title: Manage secrets in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
