id: ai200-1b-aks-scale-cmd
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs a summarization API as the Deployment **summarizer** in the namespace `ai` of an Azure Kubernetes Service (AKS) cluster. No autoscaler is configured. For a one-day load test, the API must run five pods.

    You need to change the number of pods immediately, without editing the manifest files. Which command should you run?
  fr: |
    Adatum exécute une API de synthèse sous la forme du Deployment **summarizer** dans l'espace de noms `ai` d'un cluster Azure Kubernetes Service (AKS). Aucun outil de mise à l'échelle automatique n'est configuré. Pour un test de charge d'une journée, l'API doit exécuter cinq pods.

    Vous devez modifier immédiatement le nombre de pods, sans modifier les fichiers manifeste. Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "kubectl scale --replicas=5 deployment/summarizer -n ai" }
    - { id: b, text: "az aks scale --resource-group rg-ai --name aks-ai --node-count 5" }
    - { id: c, text: "az aks nodepool scale --resource-group rg-ai --cluster-name aks-ai --name userpool --node-count 5" }
    - { id: d, text: "kubectl rollout restart deployment/summarizer -n ai" }
answer: { optionId: a }
explanation:
  correct:
    en: "`kubectl scale --replicas` changes the replica count of the Deployment, and Kubernetes creates or removes pods to match it. The manifest file is unchanged, so the next `kubectl apply` of the file sets the count back to the value in the manifest."
    fr: "`kubectl scale --replicas` modifie le nombre de réplicas du Deployment, et Kubernetes crée ou supprime des pods pour s'y conformer. Le fichier manifeste reste inchangé : le prochain `kubectl apply` du fichier rétablit la valeur du manifeste."
  options:
    b: { en: "az aks scale changes the number of nodes, not the number of pods of a Deployment.", fr: "az aks scale modifie le nombre de nœuds, pas le nombre de pods d'un Deployment." }
    c: { en: "Scaling a node pool adds nodes; the Deployment still runs the same number of pods.", fr: "Mettre à l'échelle un pool de nœuds ajoute des nœuds ; le Deployment exécute toujours le même nombre de pods." }
    d: { en: "A rollout restart replaces the pods with new ones but keeps the same replica count.", fr: "Un redémarrage du déploiement remplace les pods par de nouveaux, mais conserve le même nombre de réplicas." }
references:
  - title: Kubernetes on Azure tutorial - Scale applications in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-scale
