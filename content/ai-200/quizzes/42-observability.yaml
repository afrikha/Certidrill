chapter: 42-observability
questions:
  # ------------------------------------------------------------------ 1
  - id: ai200-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's RAG API runs in Azure Container Apps. For each question, it calls an embedding endpoint, runs a vector search in Azure Cosmos DB for NoSQL and calls a model endpoint. Every component is instrumented with OpenTelemetry.

        A user reports that one answer took 20 seconds. For this single request, you need to see every operation that it went through across the components, with the duration of each operation and which operation called which.

        Which OpenTelemetry signal provides this information?
      fr: |
        L'API RAG de Contoso s'exécute dans Azure Container Apps. Pour chaque question, elle appelle un point de terminaison d'embeddings, exécute une recherche vectorielle dans Azure Cosmos DB for NoSQL et appelle un point de terminaison de modèle. Chaque composant est instrumenté avec OpenTelemetry.

        Un utilisateur signale qu'une réponse a pris 20 secondes. Pour cette seule requête, vous devez voir chaque opération qu'elle a traversée dans les composants, avec la durée de chaque opération et quelle opération a appelé laquelle.

        Quel signal OpenTelemetry fournit ces informations ?
    body:
      options:
        - id: a
          text:
            en: |-
              Metrics: numeric measurements aggregated over time, such as a duration histogram
            fr: |-
              Les métriques : des mesures numériques agrégées dans le temps, comme un histogramme des durées
        - id: b
          text:
            en: |-
              Traces: trees of timed spans that all carry the same trace ID
            fr: |-
              Les traces : des arbres d'étendues chronométrées qui portent toutes le même ID de trace
        - id: c
          text:
            en: |-
              Logs: timestamped records written by the logging framework of each component
            fr: |-
              Les journaux : des enregistrements horodatés écrits par le framework de journalisation de chaque composant
        - id: d
          text:
            en: |-
              Baggage: key-value pairs that are propagated with the context between components
            fr: |-
              Le baggage : des paires clé-valeur propagées avec le contexte entre les composants
    answer: { optionId: b }
    explanation:
      correct:
        en: |-
          A distributed trace is a tree of spans that share one trace ID. Each span is a timed operation that knows its parent span, so the trace shows every step of the request across the components, with its duration and its caller. In Application Insights, the trace ID becomes the operation ID shared by the request and dependency rows of the transaction.
        fr: |-
          Une trace distribuée est un arbre d'étendues (spans) qui partagent un même ID de trace. Chaque étendue est une opération chronométrée qui connaît son étendue parente : la trace montre donc chaque étape de la requête dans les composants, avec sa durée et son appelant. Dans Application Insights, l'ID de trace devient l'ID d'opération partagé par les lignes de requêtes et de dépendances de la transaction.
      options:
        a:
          en: |-
            Metrics aggregate many measurements per interval: they show that requests are slow, not the steps of one particular request.
          fr: |-
            Les métriques agrègent de nombreuses mesures par intervalle : elles montrent que les requêtes sont lentes, pas les étapes d'une requête particulière.
        c:
          en: |-
            Logs are individual records; correlated with an operation they add context, but they don't record the duration and the parent of each operation.
          fr: |-
            Les journaux sont des enregistrements individuels ; corrélés à une opération, ils ajoutent du contexte, mais n'enregistrent ni la durée ni le parent de chaque opération.
        d:
          en: |-
            Baggage carries application values from service to service with the context; it isn't a telemetry signal and records no duration.
          fr: |-
            Le baggage transporte des valeurs applicatives de service en service avec le contexte ; ce n'est pas un signal de télémétrie et il n'enregistre aucune durée.
    references:
      - title: Application Insights telemetry data model
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete

  # ------------------------------------------------------------------ 2
  - id: ai200-qz-42-02
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam adds manual spans with the OpenTelemetry API to a Python service. The service sends its telemetry to a workspace-based Application Insights resource through the Azure Monitor OpenTelemetry Distro.

        Which two span kinds produce rows in the `AppRequests` table?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam ajoute des étendues manuelles avec l'API OpenTelemetry à un service Python. Le service envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail par l'intermédiaire de la distribution OpenTelemetry Azure Monitor.

        Quels sont les deux types d'étendue qui produisent des lignes dans la table `AppRequests` ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "`SpanKind.SERVER`" }
        - { id: b, text: "`SpanKind.CLIENT`" }
        - { id: c, text: "`SpanKind.PRODUCER`" }
        - { id: d, text: "`SpanKind.CONSUMER`" }
        - { id: e, text: "`SpanKind.INTERNAL`" }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |-
          Application Insights maps the SERVER kind (handling of an incoming request) and the CONSUMER kind (processing of a received message) to requests, stored in `AppRequests`. The CLIENT, PRODUCER and INTERNAL kinds are mapped to dependencies, stored in `AppDependencies`.
        fr: |-
          Application Insights associe le type SERVER (traitement d'une requête entrante) et le type CONSUMER (traitement d'un message reçu) aux requêtes, stockées dans `AppRequests`. Les types CLIENT, PRODUCER et INTERNAL sont associés aux dépendances, stockées dans `AppDependencies`.
      options:
        b:
          en: |-
            A CLIENT span describes an outgoing call, such as an HTTP call to a model endpoint: it becomes a dependency.
          fr: |-
            Une étendue CLIENT décrit un appel sortant, comme un appel HTTP à un point de terminaison de modèle : elle devient une dépendance.
        c:
          en: |-
            A PRODUCER span describes sending a message: it becomes a dependency of the operation.
          fr: |-
            Une étendue PRODUCER décrit l'envoi d'un message : elle devient une dépendance de l'opération.
        e:
          en: |-
            INTERNAL, the default kind, describes in-process work: it becomes a dependency of type InProc.
          fr: |-
            INTERNAL, le type par défaut, décrit un travail dans le processus : elle devient une dépendance de type InProc.
    references:
      - title: Add and Modify OpenTelemetry in Application Insights
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify

  # ------------------------------------------------------------------ 3
  - id: ai200-qz-42-03
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys' Python chat API calls a model deployment at `tailspin-ai.openai.azure.com` with `httpx`. When the deployment is overloaded, it rejects calls with the HTTP status code 429, and the API then returns a fallback answer to the user with the status code 200. The API sends its telemetry to a workspace-based Application Insights resource, with trace sampling enabled.

        You need the estimated number of calls that the model deployment rejected with status code 429, for each 5-minute interval of the last six hours.

        Which query should you use?
      fr: |
        L'API de conversation Python de Tailspin Toys appelle un déploiement de modèle à l'adresse `tailspin-ai.openai.azure.com` avec `httpx`. Quand le déploiement est surchargé, il rejette les appels avec le code d'état HTTP 429, et l'API renvoie alors à l'utilisateur une réponse de secours avec le code d'état 200. L'API envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail, avec l'échantillonnage des traces activé.

        Vous avez besoin du nombre estimé d'appels que le déploiement de modèle a rejetés avec le code d'état 429, pour chaque intervalle de 5 minutes des six dernières heures.

        Quelle requête devez-vous utiliser ?
    body:
      options:
        - id: a
          text: |-
            ```kusto
            AppRequests
            | where TimeGenerated > ago(6h) and ResultCode == "429"
            | summarize Throttled = sum(ItemCount) by bin(TimeGenerated, 5m)
            ```
        - id: b
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(6h) and Target endswith "openai.azure.com" and ResultCode == "429"
            | summarize Throttled = sum(ItemCount) by bin(TimeGenerated, 5m)
            ```
        - id: c
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(6h) and Target endswith "openai.azure.com" and Success == false
            | summarize Throttled = sum(ItemCount) by bin(TimeGenerated, 5m)
            ```
        - id: d
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(6h) and Target endswith "openai.azure.com" and Data has "429"
            | summarize Throttled = sum(ItemCount) by bin(TimeGenerated, 5m)
            ```
    answer: { optionId: b }
    explanation:
      correct:
        en: |-
          The 429 is the result of the API's outgoing call, so it's recorded on the dependency row: `AppDependencies` stores the call with the host name in `Target` and the HTTP status code in the string column `ResultCode`. With sampling enabled, `sum(ItemCount)` estimates the real number of calls.
        fr: |-
          Le code 429 est le résultat de l'appel sortant de l'API : il est donc enregistré sur la ligne de dépendance. `AppDependencies` stocke l'appel avec le nom d'hôte dans `Target` et le code d'état HTTP dans la colonne de type chaîne `ResultCode`. Avec l'échantillonnage activé, `sum(ItemCount)` estime le nombre réel d'appels.
      options:
        a:
          en: |-
            `AppRequests` holds the requests that the API receives; the API answers them with 200, so their rows never show the 429 returned by the deployment.
          fr: |-
            `AppRequests` contient les requêtes que l'API reçoit ; l'API y répond avec 200, donc leurs lignes ne montrent jamais le 429 renvoyé par le déploiement.
        c:
          en: |-
            `Success == false` counts every failed call to the deployment, including timeouts and 5xx errors, not only the throttled calls.
          fr: |-
            `Success == false` compte tous les appels en échec vers le déploiement, y compris les expirations de délai et les erreurs 5xx, pas seulement les appels limités.
        d:
          en: |-
            `Data` holds the details of the call, such as its full URL, not the status code that the deployment returned.
          fr: |-
            `Data` contient le détail de l'appel, comme son URL complète, pas le code d'état renvoyé par le déploiement.
    references:
      - title: Azure Monitor Logs reference - AppDependencies
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appdependencies
      - title: Application Insights telemetry data model
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete

  # ------------------------------------------------------------------ 4
  - id: ai200-qz-42-04
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum's document-search API sends its telemetry to a workspace-based Application Insights resource, and sampling is disabled. The team compares the typical latency with the tail latency of each endpoint.

        You need a query that returns one row for each API operation, with its 50th, 95th and 99th percentile durations over the last day.

        Which line should you append to `AppRequests | where TimeGenerated > ago(1d)`?
      fr: |
        L'API de recherche de documents d'Adatum envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail, et l'échantillonnage est désactivé. L'équipe compare la latence typique à la latence de queue de chaque point de terminaison.

        Vous avez besoin d'une requête qui renvoie une ligne pour chaque opération de l'API, avec ses durées au 50e, au 95e et au 99e centile sur le dernier jour.

        Quelle ligne devez-vous ajouter à la fin de `AppRequests | where TimeGenerated > ago(1d)` ?
    body:
      options:
        - { id: a, text: "`| summarize percentiles(DurationMs, 50, 95, 99) by Name, DurationMs`" }
        - { id: b, text: "`| summarize percentile(DurationMs, 50, 95, 99) by Name`" }
        - { id: c, text: "`| summarize percentiles(DurationMs, 50, 95, 99) by Name`" }
        - { id: d, text: "`| summarize percentiles(DurationMs, 50, 95, 99)`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |-
          `percentiles()` takes one or more comma-separated percentages and returns one column for each of them. Grouping by `Name` returns one row for each API operation.
        fr: |-
          `percentiles()` accepte un ou plusieurs pourcentages séparés par des virgules et renvoie une colonne pour chacun. Le regroupement par `Name` renvoie une ligne pour chaque opération de l'API.
      options:
        a:
          en: |-
            Adding `DurationMs` to the `by` clause creates one group for each distinct duration value, so each operation returns many rows.
          fr: |-
            Ajouter `DurationMs` à la clause `by` crée un groupe pour chaque valeur de durée distincte : chaque opération renvoie donc de nombreuses lignes.
        b:
          en: |-
            `percentile()` takes a single percentage; to compute several values at once, use `percentiles()`.
          fr: |-
            `percentile()` accepte un seul pourcentage ; pour calculer plusieurs valeurs en une fois, utilisez `percentiles()`.
        d:
          en: |-
            Without a `by` clause, `summarize` returns a single row for all the operations together.
          fr: |-
            Sans clause `by`, `summarize` renvoie une seule ligne pour l'ensemble des opérations.
    references:
      - title: percentile(), percentiles()
        url: https://learn.microsoft.com/en-us/kusto/query/percentiles-aggregation-function

  # ------------------------------------------------------------------ 5
  - id: ai200-qz-42-05
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware builds a single container image for a Python summarization API. At startup, the code runs the following call, where `TEST_CONNECTION_STRING` is a constant that holds the connection string of an Application Insights resource named **appi-test**:

        ```text
        configure_azure_monitor(connection_string=TEST_CONNECTION_STRING)
        ```

        In production, the container app defines the following environment variables:

        ```text
        APPLICATIONINSIGHTS_CONNECTION_STRING=<connection string of appi-prod>
        OTEL_RESOURCE_ATTRIBUTES=service.name=summarizer
        OTEL_SERVICE_NAME=summary-api
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware crée une seule image conteneur pour une API Python de synthèse. Au démarrage, le code exécute l'appel suivant, où `TEST_CONNECTION_STRING` est une constante qui contient la chaîne de connexion d'une ressource Application Insights nommée **appi-test** :

        ```text
        configure_azure_monitor(connection_string=TEST_CONNECTION_STRING)
        ```

        En production, l'application conteneur définit les variables d'environnement suivantes :

        ```text
        APPLICATIONINSIGHTS_CONNECTION_STRING=<connection string of appi-prod>
        OTEL_RESOURCE_ATTRIBUTES=service.name=summarizer
        OTEL_SERVICE_NAME=summary-api
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In production, the API sends its telemetry to appi-prod.", fr: "En production, l'API envoie sa télémétrie à appi-prod." }
        - id: s2
          text: { en: "The application map shows the API as a node named summary-api.", fr: "La cartographie d'application affiche l'API sous la forme d'un nœud nommé summary-api." }
        - id: s3
          text: { en: "If you remove the `connection_string` argument from the call, the production telemetry is sent to appi-prod.", fr: "Si vous supprimez l'argument `connection_string` de l'appel, la télémétrie de production est envoyée à appi-prod." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |-
          The parameters passed to `configure_azure_monitor()` take priority over the related environment variables, so the image keeps sending to appi-test. When `OTEL_SERVICE_NAME` and `service.name` in `OTEL_RESOURCE_ATTRIBUTES` are both set, `OTEL_SERVICE_NAME` wins and becomes the cloud role name. Without the argument, the distro reads `APPLICATIONINSIGHTS_CONNECTION_STRING`, which is also how one image can target a different resource in each environment.
        fr: |-
          Les paramètres passés à `configure_azure_monitor()` sont prioritaires sur les variables d'environnement correspondantes : l'image continue donc d'envoyer à appi-test. Quand `OTEL_SERVICE_NAME` et `service.name` dans `OTEL_RESOURCE_ATTRIBUTES` sont tous deux définis, `OTEL_SERVICE_NAME` l'emporte et devient le nom du rôle cloud. Sans l'argument, la distribution lit `APPLICATIONINSIGHTS_CONNECTION_STRING`, ce qui permet aussi à une même image de cibler une ressource différente dans chaque environnement.
      options:
        s1:
          en: |-
            The connection string passed in code overrides the environment variable: production telemetry goes to appi-test.
          fr: |-
            La chaîne de connexion passée dans le code remplace la variable d'environnement : la télémétrie de production part vers appi-test.
    references:
      - title: Azure Monitor Opentelemetry Distro client library for Python
        url: https://learn.microsoft.com/en-us/python/api/overview/azure/monitor-opentelemetry-readme
      - title: Configure OpenTelemetry in Application Insights
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration

  # ------------------------------------------------------------------ 6
  - id: ai200-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso's Python chat API is instrumented with the Azure Monitor OpenTelemetry Distro, and trace sampling is enabled. After each model completion, `usage.total_tokens` holds the number of tokens of the completion and `model` holds the name of the model deployment.

        The finance team needs a report that shows, for each model and each hour, the total number of tokens and the number of tokens of the largest single completion. The values must not be affected by trace sampling, and the code must use a single metric instrument.

        How should you complete the code and the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'API de conversation Python de Contoso est instrumentée avec la distribution OpenTelemetry Azure Monitor, et l'échantillonnage des traces est activé. Après chaque complétion du modèle, `usage.total_tokens` contient le nombre de jetons de la complétion et `model` contient le nom du déploiement de modèle.

        L'équipe financière a besoin d'un rapport qui affiche, pour chaque modèle et chaque heure, le nombre total de jetons et le nombre de jetons de la plus grande complétion. Les valeurs ne doivent pas être affectées par l'échantillonnage des traces, et le code doit utiliser un seul instrument de métrique.

        Comment devez-vous compléter le code et la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: text
      template: |
        meter = metrics.get_meter("contoso.chat")
        tokens = meter.[[create]]("chat.completion.tokens", unit="token")

        def on_completion(usage, model):
            tokens.[[method]](usage.total_tokens, {"model": model})

        # Report query (Log Analytics workspace)
        AppMetrics
        | where Name == "chat.completion.tokens"
        | summarize Total = sum(Sum), Largest = max([[col]])
            by Model = tostring(Properties["model"]), bin(TimeGenerated, 1h)
      slots:
        - id: create
          options:
            - { id: counter, text: create_counter }
            - { id: histogram, text: create_histogram }
            - { id: updown, text: create_up_down_counter }
            - { id: gauge, text: create_observable_gauge }
        - id: method
          options:
            - { id: add, text: add }
            - { id: record, text: record }
            - { id: set, text: set }
        - id: col
          options:
            - { id: max, text: Max }
            - { id: sum, text: Sum }
            - { id: count, text: ItemCount }
    answer:
      values: { create: histogram, method: record, col: max }
    explanation:
      correct:
        en: |-
          Azure Monitor aggregates a histogram into Min, Max, Average, Sum and Count, so one instrument gives both the total (`Sum`) and the largest completion (`Max`) of each interval; metrics are never sampled. A histogram records each measurement with `record()`, and `max(Max)` returns the largest completion of the hour across the rows of each export interval.
        fr: |-
          Azure Monitor agrège un histogramme en Min, Max, Average, Sum et Count : un seul instrument donne donc le total (`Sum`) et la plus grande complétion (`Max`) de chaque intervalle ; les métriques ne sont jamais échantillonnées. Un histogramme enregistre chaque mesure avec `record()`, et `max(Max)` renvoie la plus grande complétion de l'heure parmi les lignes de chaque intervalle d'exportation.
      options:
        counter:
          en: |-
            A counter is aggregated as a sum only: it gives the total but doesn't keep the largest single measurement.
          fr: |-
            Un compteur est agrégé uniquement en somme : il donne le total mais ne conserve pas la plus grande mesure.
        updown:
          en: |-
            An UpDownCounter is also aggregated as a sum; it's meant for values that go up and down, such as active sessions.
          fr: |-
            Un UpDownCounter est lui aussi agrégé en somme ; il est destiné aux valeurs qui augmentent et diminuent, comme les sessions actives.
        gauge:
          en: |-
            An observable gauge reads a current value through a callback at each collection and is aggregated as an average; it can't record each completion.
          fr: |-
            Une jauge observable lit une valeur courante par un rappel à chaque collecte et est agrégée en moyenne ; elle ne peut pas enregistrer chaque complétion.
        add:
          en: |-
            `add()` is the method of counters; a histogram records its measurements with `record()`.
          fr: |-
            `add()` est la méthode des compteurs ; un histogramme enregistre ses mesures avec `record()`.
        sum:
          en: |-
            `Sum` adds up the tokens of all the completions of the interval; its maximum isn't the largest single completion.
          fr: |-
            `Sum` additionne les jetons de toutes les complétions de l'intervalle ; son maximum n'est pas la plus grande complétion.
        count:
          en: |-
            `ItemCount` is the number of measurements aggregated in the row, not a number of tokens.
          fr: |-
            `ItemCount` est le nombre de mesures agrégées dans la ligne, pas un nombre de jetons.
    references:
      - title: Add and Modify OpenTelemetry in Application Insights
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify
      - title: Azure Monitor Logs reference - AppMetrics
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appmetrics

  # ------------------------------------------------------------------ 7
  - id: ai200-qz-42-07
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders runs several Python services that send their telemetry to the same workspace-based Application Insights resource, with trace sampling enabled. Each service exposes a `POST /chat` operation. An engineer writes the following query:

        ```kusto
        AppRequests
        | where TimeGenerated > ago(1d) and Name == "POST /chat"
        | where DurationMs > 2000
        | summarize Slow = sum(ItemCount), P95 = percentile(DurationMs, 95) by AppRoleName
        | where Slow > 100
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exécute plusieurs services Python qui envoient leur télémétrie à la même ressource Application Insights basée sur un espace de travail, avec l'échantillonnage des traces activé. Chaque service expose une opération `POST /chat`. Un ingénieur écrit la requête suivante :

        ```kusto
        AppRequests
        | where TimeGenerated > ago(1d) and Name == "POST /chat"
        | where DurationMs > 2000
        | summarize Slow = sum(ItemCount), P95 = percentile(DurationMs, 95) by AppRoleName
        | where Slow > 100
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "For each service in the results, `Slow` estimates the number of its `POST /chat` requests of the last day that took more than two seconds.", fr: "Pour chaque service des résultats, `Slow` estime le nombre de ses requêtes `POST /chat` du dernier jour qui ont duré plus de deux secondes." }
        - id: s2
          text: { en: "`P95` is the 95th percentile duration of all the `POST /chat` requests of the service during the last day.", fr: "`P95` est la durée au 95e centile de toutes les requêtes `POST /chat` du service pendant le dernier jour." }
        - id: s3
          text: { en: "Moving the `where DurationMs > 2000` line so that it follows the `summarize` line returns the same results.", fr: "Déplacer la ligne `where DurationMs > 2000` après la ligne `summarize` renvoie les mêmes résultats." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |-
          A `where` placed before `summarize` filters the rows that are aggregated, so every aggregate is computed on the slow `POST /chat` requests only, and `sum(ItemCount)` estimates their real number despite sampling. `P95` is therefore the 95th percentile of the requests that took more than two seconds, not of all the requests. After `summarize`, the output contains only `AppRoleName`, `Slow` and `P95`, so a filter on `DurationMs` placed there fails.
        fr: |-
          Un `where` placé avant `summarize` filtre les lignes agrégées : chaque agrégat est donc calculé sur les seules requêtes `POST /chat` lentes, et `sum(ItemCount)` estime leur nombre réel malgré l'échantillonnage. `P95` est donc le 95e centile des requêtes qui ont duré plus de deux secondes, pas de toutes les requêtes. Après `summarize`, la sortie ne contient que `AppRoleName`, `Slow` et `P95` : un filtre sur `DurationMs` placé à cet endroit échoue.
      options:
        s2:
          en: |-
            The percentile is computed after the `DurationMs > 2000` filter, so it describes only the slow requests.
          fr: |-
            Le centile est calculé après le filtre `DurationMs > 2000` : il ne décrit donc que les requêtes lentes.
        s3:
          en: |-
            `summarize` keeps only the `by` columns and the aggregates; `DurationMs` no longer exists after it.
          fr: |-
            `summarize` ne conserve que les colonnes `by` et les agrégats ; `DurationMs` n'existe plus après.
    references:
      - title: summarize operator
        url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
      - title: Azure Monitor Logs reference - AppRequests
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests

  # ------------------------------------------------------------------ 8
  - id: ai200-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys' Python chat API, whose cloud role name is **chat-api**, is the entry point of every user request; no instrumented component calls it. In each request, the FastAPI handler opens a custom INTERNAL span named **generate-answer**, and inside this span it calls the model endpoint with `httpx` one or more times, for tool calls and retries. Sampling is disabled.

        You need, for each API operation, the average percentage of the request duration that is spent in calls to the model endpoint during the last day. Requests without any model call must not be taken into account.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'API de conversation Python de Wingtip Toys, dont le nom du rôle cloud est **chat-api**, est le point d'entrée de chaque requête utilisateur ; aucun composant instrumenté ne l'appelle. Dans chaque requête, le gestionnaire FastAPI ouvre une étendue INTERNAL personnalisée nommée **generate-answer**, et dans cette étendue il appelle le point de terminaison du modèle avec `httpx` une ou plusieurs fois, pour des appels d'outils et des nouvelles tentatives. L'échantillonnage est désactivé.

        Vous avez besoin, pour chaque opération de l'API, du pourcentage moyen de la durée de la requête passé dans des appels au point de terminaison du modèle pendant le dernier jour. Les requêtes sans aucun appel au modèle ne doivent pas être prises en compte.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        AppDependencies
        | where TimeGenerated > ago(1d) and AppRoleName == "chat-api" and Target endswith "openai.azure.com"
        | summarize ModelMs = [[agg]] by LinkId = [[lkey]]
        | join kind=inner (
            AppRequests
            | where TimeGenerated > ago(1d) and AppRoleName == "chat-api"
            | project LinkId = [[rkey]], Name, RequestMs = DurationMs
          ) on LinkId
        | summarize ModelShare = avg(100.0 * ModelMs / RequestMs) by Name
      slots:
        - id: agg
          options:
            - { id: sum, text: sum(DurationMs) }
            - { id: avg, text: avg(DurationMs) }
            - { id: max, text: max(DurationMs) }
            - { id: count, text: count() }
        - id: lkey
          options:
            - { id: opid, text: OperationId }
            - { id: parent, text: ParentId }
            - { id: id, text: Id }
        - id: rkey
          options:
            - { id: opid, text: OperationId }
            - { id: id, text: Id }
            - { id: parent, text: ParentId }
    answer:
      values: { agg: sum, lkey: opid, rkey: opid }
    explanation:
      correct:
        en: |-
          A request can call the model several times, so the time spent in the model is the sum of the durations of its model calls. Every row of a distributed operation shares the same `OperationId`, which links the model calls to the request whatever the depth of the span tree; since chat-api is the entry point, each operation has exactly one chat-api request. The `ParentId` of the model calls is the ID of the generate-answer span, which is stored in `AppDependencies`, so it never matches the `Id` of a request row.
        fr: |-
          Une requête peut appeler le modèle plusieurs fois : le temps passé dans le modèle est donc la somme des durées de ses appels au modèle. Toutes les lignes d'une opération distribuée partagent le même `OperationId`, qui relie les appels au modèle à la requête quelle que soit la profondeur de l'arbre d'étendues ; comme chat-api est le point d'entrée, chaque opération a exactement une requête chat-api. Le `ParentId` des appels au modèle est l'ID de l'étendue generate-answer, stockée dans `AppDependencies` : il ne correspond donc jamais à l'`Id` d'une ligne de requête.
      options:
        avg:
          en: |-
            The average duration of the calls underestimates the model time of a request that made several calls.
          fr: |-
            La durée moyenne des appels sous-estime le temps passé dans le modèle par une requête qui a fait plusieurs appels.
        max:
          en: |-
            The longest call ignores the time of the other model calls of the same request.
          fr: |-
            L'appel le plus long ignore le temps des autres appels au modèle de la même requête.
        count:
          en: |-
            `count()` returns a number of calls, not a duration that can be compared with the request duration.
          fr: |-
            `count()` renvoie un nombre d'appels, pas une durée comparable à la durée de la requête.
        parent:
          en: |-
            `ParentId` of a model call is the generate-answer span, not the request; on the request side, it identifies the caller of the request, and chat-api has none.
          fr: |-
            Le `ParentId` d'un appel au modèle est l'étendue generate-answer, pas la requête ; côté requête, il identifie l'appelant de la requête, et chat-api n'en a pas.
        id:
          en: |-
            `Id` identifies one row (one span); the `Id` of a call never equals the `Id` of the request, and the request `Id` isn't the parent of the calls here.
          fr: |-
            `Id` identifie une ligne (une étendue) ; l'`Id` d'un appel n'est jamais égal à l'`Id` de la requête, et l'`Id` de la requête n'est pas ici le parent des appels.
    references:
      - title: join operator
        url: https://learn.microsoft.com/en-us/kusto/query/join-operator
      - title: Application Insights telemetry data model
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete

  # ------------------------------------------------------------------ 9
  - id: ai200-qz-42-09
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware's API publishes indexing jobs to a custom queue that no bundled instrumentation supports. The API calls `inject(fields)` inside a span named **publish-job** that it starts with `tracer.start_as_current_span()` and `kind=SpanKind.PRODUCER`, and sends `fields` with the job. A worker processes each job with the following code. Both services use the Azure Monitor OpenTelemetry Distro and send their telemetry to the same workspace-based Application Insights resource.

        ```text
        def process(job, fields):
            ctx = extract(fields)
            with tracer.start_as_current_span("process-job", context=ctx, kind=SpanKind.CONSUMER):
                httpx.post(EMBEDDING_URL, json=job.body)
        ```

        For one job, `fields` contains the following entry:

        ```text
        traceparent: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        ```

        Which value appears in each column? To answer, drag the appropriate values to the correct columns. Each value may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'API de Proseware publie des travaux d'indexation dans une file d'attente personnalisée qu'aucune instrumentation incluse ne prend en charge. L'API appelle `inject(fields)` dans une étendue nommée **publish-job** qu'elle démarre avec `tracer.start_as_current_span()` et `kind=SpanKind.PRODUCER`, et envoie `fields` avec le travail. Un worker traite chaque travail avec le code suivant. Les deux services utilisent la distribution OpenTelemetry Azure Monitor et envoient leur télémétrie à la même ressource Application Insights basée sur un espace de travail.

        ```text
        def process(job, fields):
            ctx = extract(fields)
            with tracer.start_as_current_span("process-job", context=ctx, kind=SpanKind.CONSUMER):
                httpx.post(EMBEDDING_URL, json=job.body)
        ```

        Pour un travail, `fields` contient l'entrée suivante :

        ```text
        traceparent: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        ```

        Quelle valeur apparaît dans chaque colonne ? Pour répondre, faites glisser les valeurs appropriées vers les colonnes correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: tid, text: "`0af7651916cd43dd8448eb211c80319c`" }
        - { id: pid, text: "`b7ad6b7169203331`" }
        - { id: apireq, text: { en: "The `Id` of the API request row in `AppRequests`", fr: "L'`Id` de la ligne de la requête de l'API dans `AppRequests`" } }
        - { id: procspan, text: { en: "The span ID of process-job", fr: "L'ID d'étendue de process-job" } }
        - { id: httpspan, text: { en: "The span ID of the httpx call", fr: "L'ID d'étendue de l'appel httpx" } }
      targets:
        - { id: t1, text: { en: "`OperationId` of the process-job row in `AppRequests`", fr: "`OperationId` de la ligne process-job dans `AppRequests`" } }
        - { id: t2, text: { en: "`ParentId` of the process-job row in `AppRequests`", fr: "`ParentId` de la ligne process-job dans `AppRequests`" } }
        - { id: t3, text: { en: "`Id` of the publish-job row in `AppDependencies`", fr: "`Id` de la ligne publish-job dans `AppDependencies`" } }
        - { id: t4, text: { en: "`ParentId` of the httpx row in `AppDependencies`", fr: "`ParentId` de la ligne httpx dans `AppDependencies`" } }
    answer:
      mapping: { t1: tid, t2: pid, t3: pid, t4: procspan }
    explanation:
      correct:
        en: |-
          In `traceparent`, the second field is the trace ID and the third is the span ID of the caller. The trace ID becomes the `OperationId` of every row of the operation. `inject()` ran while publish-job was the current span, so the third field is the span ID of publish-job: it's the `Id` of its dependency row and the `ParentId` of the process-job request, which `extract()` and `context=ctx` attach to it. The httpx call runs inside process-job, so its `ParentId` is the span ID of process-job.
        fr: |-
          Dans `traceparent`, le deuxième champ est l'ID de trace et le troisième l'ID d'étendue de l'appelant. L'ID de trace devient l'`OperationId` de toutes les lignes de l'opération. `inject()` s'est exécuté pendant que publish-job était l'étendue courante : le troisième champ est donc l'ID d'étendue de publish-job. C'est l'`Id` de sa ligne de dépendance et le `ParentId` de la requête process-job, que `extract()` et `context=ctx` lui rattachent. L'appel httpx s'exécute dans process-job : son `ParentId` est donc l'ID d'étendue de process-job.
      options:
        apireq:
          en: |-
            The API request is the parent of publish-job, not of process-job: the downstream request points to the span that sent the context.
          fr: |-
            La requête de l'API est le parent de publish-job, pas de process-job : la requête en aval pointe vers l'étendue qui a envoyé le contexte.
        httpspan:
          en: |-
            The span ID of the httpx call is the `Id` of its own row, not the parent of another row.
          fr: |-
            L'ID d'étendue de l'appel httpx est l'`Id` de sa propre ligne, pas le parent d'une autre ligne.
    references:
      - title: Application Insights telemetry data model
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
      - title: Add and Modify OpenTelemetry in Application Insights
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-add-modify

  # ------------------------------------------------------------------ 10
  - id: ai200-qz-42-10
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs several Python services that call model deployments whose host names end with `openai.azure.com`. All the services send their telemetry to the same workspace-based Application Insights resource, with a fixed-percentage trace sampler that keeps 20 percent of the traces.

        The operations team needs, for each service and each hour of the last day, the failure rate of the calls to the model deployments, as a percentage. A row must appear only when the service made an estimated 100 calls or more during the hour and when its failure rate exceeded 2 percent.

        Which query should you use?
      fr: |
        Fabrikam exécute plusieurs services Python qui appellent des déploiements de modèles dont les noms d'hôte se terminent par `openai.azure.com`. Tous les services envoient leur télémétrie à la même ressource Application Insights basée sur un espace de travail, avec un échantillonneur de traces à pourcentage fixe qui conserve 20 % des traces.

        L'équipe d'exploitation a besoin, pour chaque service et chaque heure du dernier jour, du taux d'échec des appels aux déploiements de modèles, en pourcentage. Une ligne ne doit apparaître que si le service a fait 100 appels estimés ou plus pendant l'heure et si son taux d'échec a dépassé 2 %.

        Quelle requête devez-vous utiliser ?
    body:
      options:
        - id: a
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(1d) and Target endswith "openai.azure.com"
            | summarize Calls = count(), Failed = countif(Success == false) by AppRoleName, bin(TimeGenerated, 1h)
            | extend FailureRate = 100.0 * Failed / Calls
            | where Calls >= 100 and FailureRate > 2
            ```
        - id: b
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(1d) and Target endswith "openai.azure.com" and Success == false
            | summarize Calls = sum(ItemCount), Failed = sumif(ItemCount, Success == false) by AppRoleName, bin(TimeGenerated, 1h)
            | extend FailureRate = 100.0 * Failed / Calls
            | where Calls >= 100 and FailureRate > 2
            ```
        - id: c
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(1d) and Target endswith "openai.azure.com"
            | summarize Calls = sum(ItemCount), Failed = sumif(ItemCount, Success == false) by AppRoleName, bin(TimeGenerated, 1h)
            | project AppRoleName, TimeGenerated, FailureRate = 100.0 * Failed / Calls
            | where Calls >= 100 and FailureRate > 2
            ```
        - id: d
          text: |-
            ```kusto
            AppDependencies
            | where TimeGenerated > ago(1d) and Target endswith "openai.azure.com"
            | summarize Calls = sum(ItemCount), Failed = sumif(ItemCount, Success == false) by AppRoleName, bin(TimeGenerated, 1h)
            | extend FailureRate = 100.0 * Failed / Calls
            | where Calls >= 100 and FailureRate > 2
            ```
    answer: { optionId: d }
    explanation:
      correct:
        en: |-
          With sampling, each stored row represents `ItemCount` calls (5 here), so `sum(ItemCount)` and `sumif(ItemCount, ...)` estimate the real numbers of calls and failures. `extend` adds the rate while keeping `Calls`, and the conditions on the aggregates are applied after them. Grouping by `AppRoleName` and `bin(TimeGenerated, 1h)` returns one row per service and hour.
        fr: |-
          Avec l'échantillonnage, chaque ligne stockée représente `ItemCount` appels (5 ici) : `sum(ItemCount)` et `sumif(ItemCount, ...)` estiment donc les nombres réels d'appels et d'échecs. `extend` ajoute le taux tout en conservant `Calls`, et les conditions sur les agrégats sont appliquées après leur calcul. Le regroupement par `AppRoleName` et `bin(TimeGenerated, 1h)` renvoie une ligne par service et par heure.
      options:
        a:
          en: |-
            `count()` counts the stored rows, about one fifth of the real calls here, so the 100-call threshold is applied to the wrong number.
          fr: |-
            `count()` compte les lignes stockées, environ un cinquième des appels réels ici : le seuil de 100 appels s'applique donc au mauvais nombre.
        b:
          en: |-
            Filtering on `Success == false` before `summarize` keeps only the failed calls, so `Calls` equals `Failed` and every rate is 100 percent.
          fr: |-
            Filtrer sur `Success == false` avant `summarize` ne conserve que les appels en échec : `Calls` est alors égal à `Failed` et chaque taux vaut 100 %.
        c:
          en: |-
            `project` drops every column that it doesn't list, so the last line can't use `Calls` and the query fails.
          fr: |-
            `project` supprime toutes les colonnes qu'il ne liste pas : la dernière ligne ne peut donc pas utiliser `Calls` et la requête échoue.
    references:
      - title: Sampling in Azure Application Insights with OpenTelemetry
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-sampling
      - title: Project operator
        url: https://learn.microsoft.com/en-us/kusto/query/project-operator
