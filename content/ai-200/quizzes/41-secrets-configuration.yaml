chapter: 41-secrets-configuration
questions:
  # ------------------------------------------------------------------ 1
  - id: ai200-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam exposes its AI inference API over HTTPS with a TLS certificate issued by DigiCert, a certificate authority that is integrated with Azure Key Vault. Before the certificate expires, Key Vault must obtain a new certificate from DigiCert by itself, without any script or function to maintain.

        How should you store the certificate in Key Vault?
      fr: |
        Fabrikam expose son API d'inférence IA en HTTPS avec un certificat TLS émis par DigiCert, une autorité de certification intégrée à Azure Key Vault. Avant l'expiration du certificat, Key Vault doit obtenir lui-même un nouveau certificat auprès de DigiCert, sans script ni fonction à maintenir.

        Comment devez-vous stocker le certificat dans Key Vault ?
    body:
      options:
        - { id: a, text: { en: "As a Key Vault secret that contains the PFX file, with an expiration date", fr: "Comme secret Key Vault qui contient le fichier PFX, avec une date d'expiration" } }
        - { id: b, text: { en: "As a Key Vault key, with a rotation policy that has a Rotate action", fr: "Comme clé Key Vault, avec une stratégie de rotation qui a une action Rotate" } }
        - { id: c, text: { en: "As a Key Vault certificate, with a policy that renews it automatically", fr: "Comme certificat Key Vault, avec une stratégie qui le renouvelle automatiquement" } }
        - { id: d, text: { en: "As a Key Vault secret, with an Event Grid subscription to its expiry events", fr: "Comme secret Key Vault, avec un abonnement Event Grid à ses événements d'expiration" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Key Vault handles the end-to-end maintenance of certificates issued by its integrated certificate authorities, DigiCert and GlobalSign, including automatic renewal when the certificate policy is set to renew. Each renewal creates a new version, and Key Vault can notify the certificate contacts before and after the renewal.
        fr: |
          Key Vault gère de bout en bout la maintenance des certificats émis par ses autorités de certification intégrées, DigiCert et GlobalSign, y compris le renouvellement automatique quand la stratégie du certificat est définie pour le renouveler. Chaque renouvellement crée une nouvelle version, et Key Vault peut avertir les contacts du certificat avant et après le renouvellement.
      options:
        a: { en: "A secret has no renewal or rotation policy: Key Vault would only know its expiration date, not how to obtain a new certificate.", fr: "Un secret n'a aucune stratégie de renouvellement ni de rotation : Key Vault connaîtrait seulement sa date d'expiration, pas la manière d'obtenir un nouveau certificat." }
        b: { en: "A key rotation policy generates new key material; it doesn't request a new certificate from a certificate authority.", fr: "Une stratégie de rotation de clé génère un nouveau matériel de clé ; elle ne demande pas de nouveau certificat à une autorité de certification." }
        d: { en: "Expiry events only start your own code, which is the function to maintain that the requirement excludes.", fr: "Les événements d'expiration démarrent seulement votre propre code, c'est-à-dire la fonction à maintenir que l'exigence exclut." }
    references:
      - title: About Azure Key Vault certificate renewal
        url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/overview-renew-certificate

  # ------------------------------------------------------------------ 2
  - id: ai200-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A Python API loads its settings with the App Configuration provider as follows:

        `config = load(endpoint=endpoint, credential=credential, refresh_on=[WatchKey("Sentinel")])`

        The API calls `config.refresh()` at the start of each request and receives several requests per second.

        How often, at most, does the provider check whether the Sentinel key has changed?
      fr: |
        Une API Python charge ses paramètres avec le fournisseur App Configuration comme suit :

        `config = load(endpoint=endpoint, credential=credential, refresh_on=[WatchKey("Sentinel")])`

        L'API appelle `config.refresh()` au début de chaque requête et reçoit plusieurs requêtes par seconde.

        À quelle fréquence, au maximum, le fournisseur vérifie-t-il si la clé Sentinel a changé ?
    body:
      options:
        - { id: a, text: { en: "At each call to `refresh()`, so several times per second", fr: "À chaque appel de `refresh()`, donc plusieurs fois par seconde" } }
        - { id: b, text: { en: "Once every 30 seconds", fr: "Une fois toutes les 30 secondes" } }
        - { id: c, text: { en: "Once every 5 minutes", fr: "Une fois toutes les 5 minutes" } }
        - { id: d, text: { en: "Only when the API restarts", fr: "Uniquement quand l'API redémarre" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Without a `refresh_interval` argument, the provider uses a refresh interval of 30 seconds. A call to `refresh()` made before the interval has elapsed is a no-op, so calling it at each request costs almost nothing and sends at most one check every 30 seconds.
        fr: |
          Sans argument `refresh_interval`, le fournisseur utilise un intervalle d'actualisation de 30 secondes. Un appel à `refresh()` effectué avant la fin de l'intervalle n'a aucun effet : l'appeler à chaque requête ne coûte presque rien et envoie au plus une vérification toutes les 30 secondes.
      options:
        a: { en: "Calls made before the refresh interval has elapsed return immediately without contacting the store.", fr: "Les appels effectués avant la fin de l'intervalle d'actualisation se terminent immédiatement sans contacter le magasin." }
        c: { en: "5 minutes isn't the default; you would have to pass `refresh_interval=300`.", fr: "5 minutes n'est pas la valeur par défaut ; il faudrait transmettre `refresh_interval=300`." }
        d: { en: "With `refresh_on`, refresh is enabled and the app applies changes at run time when it calls `refresh()`.", fr: "Avec `refresh_on`, l'actualisation est activée et l'application applique les modifications à l'exécution quand elle appelle `refresh()`." }
    references:
      - title: Python Configuration Provider - Azure App Configuration
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider

  # ------------------------------------------------------------------ 3
  - id: ai200-qz-41-03
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Contoso is creating an App Configuration store for the production settings of its Python RAG service. After an incident, the team must be able to review and restore the value that any key-value had up to three weeks earlier. The store will receive about 2,000 requests per hour and doesn't need geo-replication.

        You need to choose the tier of the store. The solution must minimize cost. Which tier should you choose?
      fr: |
        Contoso crée un magasin App Configuration pour les paramètres de production de son service RAG en Python. Après un incident, l'équipe doit pouvoir consulter et restaurer la valeur qu'avait n'importe quelle clé-valeur jusqu'à trois semaines auparavant. Le magasin recevra environ 2 000 requêtes par heure et n'a pas besoin de géoréplication.

        Vous devez choisir le niveau du magasin. La solution doit réduire le coût au minimum. Quel niveau devez-vous choisir ?
    body:
      options:
        - { id: a, text: Free }
        - { id: b, text: Developer }
        - { id: c, text: Standard }
        - { id: d, text: Premium }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The revision history of key-values is kept for 7 days in the Free and Developer tiers and for 30 days in the Standard and Premium tiers. Standard is the cheaper of the two tiers that cover three weeks, and its quota of 30,000 requests per hour easily covers the load.
        fr: |
          L'historique des révisions des clés-valeurs est conservé 7 jours dans les niveaux Free et Developer, et 30 jours dans les niveaux Standard et Premium. Standard est le moins cher des deux niveaux qui couvrent trois semaines, et son quota de 30 000 requêtes par heure couvre largement la charge.
      options:
        a: { en: "Free keeps 7 days of history, and its quota of 1,000 requests per day is far below the load.", fr: "Free conserve 7 jours d'historique, et son quota de 1 000 requêtes par jour est très inférieur à la charge." }
        b: { en: "Developer handles the load, but it keeps only 7 days of revision history.", fr: "Developer absorbe la charge, mais il ne conserve que 7 jours d'historique des révisions." }
        d: { en: "Premium also keeps 30 days of history, but it costs more than Standard, and its unlimited quota and higher SLA aren't required.", fr: "Premium conserve aussi 30 jours d'historique, mais il coûte plus cher que Standard, et son quota illimité et son SLA supérieur ne sont pas requis." }
    references:
      - title: Azure App Configuration FAQ
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq

  # ------------------------------------------------------------------ 4
  - id: ai200-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum runs the same Python AI services in a development environment and in a production environment. All their settings will be stored in Azure App Configuration and read with Microsoft Entra authentication.

        The managed identities of the development services must not be able to read any production key-value, and the developers must create and update the development key-values themselves.

        Which design should you use?
      fr: |
        Adatum exécute les mêmes services IA en Python dans un environnement de développement et dans un environnement de production. Tous leurs paramètres seront stockés dans Azure App Configuration et lus avec l'authentification Microsoft Entra.

        Les identités managées des services de développement ne doivent pouvoir lire aucune clé-valeur de production, et les développeurs doivent créer et mettre à jour eux-mêmes les clés-valeurs de développement.

        Quelle conception devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "One store with the labels Dev and Prod. Assign App Configuration Data Reader on the store to every service identity, and set `label_filter` to the environment of each service.", fr: "Un magasin avec les étiquettes Dev et Prod. Attribuer App Configuration Data Reader sur le magasin à chaque identité de service, et définir `label_filter` sur l'environnement de chaque service." } }
        - { id: b, text: { en: "One store with one snapshot per environment. Assign App Configuration Data Reader on the store to every service identity, and load the snapshot of each environment with `snapshot_name`.", fr: "Un magasin avec un instantané par environnement. Attribuer App Configuration Data Reader sur le magasin à chaque identité de service, et charger l'instantané de chaque environnement avec `snapshot_name`." } }
        - { id: c, text: { en: "Two stores, one per environment. Assign App Configuration Data Reader on each store to the identities of its environment, and App Configuration Data Owner on the development store to the developers.", fr: "Deux magasins, un par environnement. Attribuer App Configuration Data Reader sur chaque magasin aux identités de son environnement, et App Configuration Data Owner sur le magasin de développement aux développeurs." } }
        - { id: d, text: { en: "One store with access key authentication. Give the development services a read-only access key, and give the developers and the production services a read-write access key.", fr: "Un magasin avec l'authentification par clé d'accès. Donner aux services de développement une clé d'accès en lecture seule, et aux développeurs et aux services de production une clé d'accès en lecture-écriture." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          App Configuration data roles apply to a whole store, so an identity that can read a store can read all its key-values, whatever their label. Microsoft recommends a separate store per environment for the best security isolation, and labels only when isolation isn't needed. Data Reader on each environment's store and Data Owner for the developers on the development store meet both requirements.
        fr: |
          Les rôles de données App Configuration s'appliquent à un magasin entier : une identité qui peut lire un magasin peut lire toutes ses clés-valeurs, quelle que soit leur étiquette. Microsoft recommande un magasin distinct par environnement pour la meilleure isolation de sécurité, et les étiquettes seulement quand l'isolation n'est pas nécessaire. Data Reader sur le magasin de chaque environnement et Data Owner pour les développeurs sur le magasin de développement satisfont les deux exigences.
      options:
        a: { en: "A label filter only selects what the code loads; a development identity with Data Reader on the store can still read the Prod key-values.", fr: "Un filtre d'étiquette sélectionne seulement ce que le code charge ; une identité de développement avec Data Reader sur le magasin peut toujours lire les clés-valeurs Prod." }
        b: { en: "A snapshot is an immutable set of key-values, not an access boundary: Data Reader on the store reads every snapshot and key-value.", fr: "Un instantané est un ensemble immuable de clés-valeurs, pas une limite d'accès : Data Reader sur le magasin lit tous les instantanés et toutes les clés-valeurs." }
        d: { en: "A read-only key still reads every key-value of the store, and the services must use Microsoft Entra authentication, not access keys.", fr: "Une clé en lecture seule lit toujours toutes les clés-valeurs du magasin, et les services doivent utiliser l'authentification Microsoft Entra, pas des clés d'accès." }
    references:
      - title: Azure App Configuration FAQ
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
      - title: Access Azure App Configuration using Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac

  # ------------------------------------------------------------------ 5
  - id: ai200-qz-41-05
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware deploys a new key vault named **kv-pro-ai** with a Bicep file that uses API version 2026-02-01 of `Microsoft.KeyVault/vaults` and doesn't set the `enableRbacAuthorization` property. The same file defines an access policy that grants the Get permission on secrets to the managed identity of a Python API.

        The deployment succeeds, but each call to `get_secret()` from the API returns HTTP 403. You need the API to read the secrets of kv-pro-ai by following the principle of least privilege. What should you do?
      fr: |
        Proseware déploie un nouveau coffre de clés nommé **kv-pro-ai** avec un fichier Bicep qui utilise la version d'API 2026-02-01 de `Microsoft.KeyVault/vaults` et ne définit pas la propriété `enableRbacAuthorization`. Le même fichier définit une stratégie d'accès qui accorde l'autorisation Get sur les secrets à l'identité managée d'une API Python.

        Le déploiement réussit, mais chaque appel à `get_secret()` depuis l'API renvoie HTTP 403. Vous devez permettre à l'API de lire les secrets de kv-pro-ai en respectant le principe du moindre privilège. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the List permission on secrets to the access policy of the API identity.", fr: "Ajouter l'autorisation List sur les secrets à la stratégie d'accès de l'identité de l'API." } }
        - { id: b, text: { en: "Assign the Key Vault Reader role on kv-pro-ai to the API identity.", fr: "Attribuer le rôle Key Vault Reader sur kv-pro-ai à l'identité de l'API." } }
        - { id: c, text: { en: "Assign the Key Vault Contributor role on kv-pro-ai to the API identity.", fr: "Attribuer le rôle Key Vault Contributor sur kv-pro-ai à l'identité de l'API." } }
        - { id: d, text: { en: "Assign the Key Vault Secrets User role on kv-pro-ai to the API identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-pro-ai à l'identité de l'API." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Starting with API version 2026-02-01, Azure RBAC is the default permission model for new key vaults, so kv-pro-ai ignores its access policy. Under the RBAC model, reading secret contents requires a data-plane role: Key Vault Secrets User is the least privileged role that allows `get_secret()`.
        fr: |
          À partir de la version d'API 2026-02-01, Azure RBAC est le modèle d'autorisation par défaut des nouveaux coffres de clés : kv-pro-ai ignore donc sa stratégie d'accès. Avec le modèle RBAC, lire le contenu des secrets exige un rôle du plan de données : Key Vault Secrets User est le rôle le moins privilégié qui permet `get_secret()`.
      options:
        a: { en: "The vault uses Azure RBAC, so access policies aren't evaluated; List would only enumerate names anyway.", fr: "Le coffre utilise Azure RBAC : les stratégies d'accès ne sont pas évaluées ; List ne ferait de toute façon qu'énumérer les noms." }
        b: { en: "Key Vault Reader reads the metadata of the vault and its objects, not secret contents.", fr: "Key Vault Reader lit les métadonnées du coffre et de ses objets, pas le contenu des secrets." }
        c: { en: "Key Vault Contributor manages the vault resource only and doesn't allow access to secrets.", fr: "Key Vault Contributor gère seulement la ressource coffre et ne permet pas d'accéder aux secrets." }
    references:
      - title: Azure role-based access control (Azure RBAC) vs. access policies
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-access-policy
      - title: Grant permission to applications to access an Azure key vault using Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide

  # ------------------------------------------------------------------ 6
  - id: ai200-qz-41-06
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware stores the API key of a reranking service as the secret **rerank-key** in a key vault named **kv-lit-ai**. Soft delete is enabled with a retention period of 90 days, and purge protection is enabled. Ten days ago, an operator deleted rerank-key by mistake, and the reranking provider has since issued a new key.

        A deployment script now fails with a conflict when it calls `client.set_secret("rerank-key", new_key)`. The applications read the secret by the name rerank-key and must receive the new key today. The identity of the script has the Key Vault Secrets Officer role on kv-lit-ai.

        What should the script do before it calls `set_secret()`?
      fr: |
        Litware stocke la clé API d'un service de reclassement sous la forme du secret **rerank-key** dans un coffre de clés nommé **kv-lit-ai**. La suppression réversible est activée avec une période de rétention de 90 jours, et la protection contre le vidage est activée. Il y a dix jours, un opérateur a supprimé rerank-key par erreur, et le fournisseur du service de reclassement a depuis émis une nouvelle clé.

        Un script de déploiement échoue maintenant avec un conflit quand il appelle `client.set_secret("rerank-key", new_key)`. Les applications lisent le secret par le nom rerank-key et doivent recevoir la nouvelle clé aujourd'hui. L'identité du script dispose du rôle Key Vault Secrets Officer sur kv-lit-ai.

        Que doit faire le script avant d'appeler `set_secret()` ?
    body:
      options:
        - { id: a, text: { en: "Call `client.purge_deleted_secret(\"rerank-key\")`.", fr: "Appeler `client.purge_deleted_secret(\"rerank-key\")`." } }
        - { id: b, text: { en: "Call `client.update_secret_properties(\"rerank-key\", enabled=True)`.", fr: "Appeler `client.update_secret_properties(\"rerank-key\", enabled=True)`." } }
        - { id: c, text: { en: "Call `client.begin_delete_secret(\"rerank-key\")` and wait for the poller.", fr: "Appeler `client.begin_delete_secret(\"rerank-key\")` et attendre le poller." } }
        - { id: d, text: { en: "Call `client.begin_recover_deleted_secret(\"rerank-key\")` and wait for the poller.", fr: "Appeler `client.begin_recover_deleted_secret(\"rerank-key\")` et attendre le poller." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A vault can't create an object with the name of an object that is in the deleted state, hence the conflict. Purge protection prevents purging rerank-key until its retention period ends, in 80 days, so the only way to use the name today is to recover the secret and then call `set_secret()`, which adds the new key as the latest version.
        fr: |
          Un coffre ne peut pas créer d'objet portant le nom d'un objet à l'état supprimé, d'où le conflit. La protection contre le vidage empêche de vider rerank-key avant la fin de sa période de rétention, dans 80 jours : la seule manière d'utiliser le nom aujourd'hui est donc de récupérer le secret, puis d'appeler `set_secret()`, qui ajoute la nouvelle clé comme dernière version.
      options:
        a: { en: "With purge protection enabled, a deleted secret can't be purged until its retention period has passed, whatever the permissions of the caller.", fr: "Avec la protection contre le vidage activée, un secret supprimé ne peut pas être vidé avant la fin de sa période de rétention, quelles que soient les autorisations de l'appelant." }
        b: { en: "A secret in the deleted state can only be listed, recovered or purged: its properties can't be updated.", fr: "Un secret à l'état supprimé peut seulement être listé, récupéré ou vidé : ses propriétés ne peuvent pas être mises à jour." }
        c: { en: "rerank-key is already in the deleted state; deleting it again doesn't free the name.", fr: "rerank-key est déjà à l'état supprimé ; le supprimer de nouveau ne libère pas le nom." }
    references:
      - title: Azure Key Vault soft-delete
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
      - title: Azure Key Vault Secrets client library for Python
        url: https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-secrets-readme

  # ------------------------------------------------------------------ 7
  - id: ai200-qz-41-07
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an App Configuration store named **appcs-nw**. Access key authentication is enabled on appcs-nw. Two users run Azure CLI commands from their workstations after signing in with `az login`:

        - Dana has the Owner role on the resource group of appcs-nw and no App Configuration data-plane role.
        - Lee has the App Configuration Data Reader role on appcs-nw, assigned last month, and no other role.

        Neither user has configured a default authentication mode in the Azure CLI.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un magasin App Configuration nommé **appcs-nw**. L'authentification par clé d'accès est activée sur appcs-nw. Deux utilisateurs exécutent des commandes Azure CLI depuis leurs postes de travail après s'être connectés avec `az login` :

        - Dana dispose du rôle Owner sur le groupe de ressources d'appcs-nw et d'aucun rôle App Configuration du plan de données.
        - Lee dispose du rôle App Configuration Data Reader sur appcs-nw, attribué le mois dernier, et d'aucun autre rôle.

        Aucun des deux utilisateurs n'a configuré de mode d'authentification par défaut dans Azure CLI.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When Dana runs `az appconfig kv list -n appcs-nw`, the command returns the key-values of appcs-nw.", fr: "Quand Dana exécute `az appconfig kv list -n appcs-nw`, la commande renvoie les clés-valeurs d'appcs-nw." }
        - id: s2
          text: { en: "When Dana runs `az appconfig kv list -n appcs-nw --auth-mode login`, the command returns the key-values of appcs-nw.", fr: "Quand Dana exécute `az appconfig kv list -n appcs-nw --auth-mode login`, la commande renvoie les clés-valeurs d'appcs-nw." }
        - id: s3
          text: { en: "When Lee runs `az appconfig kv list -n appcs-nw`, the command returns the key-values of appcs-nw.", fr: "Quand Lee exécute `az appconfig kv list -n appcs-nw`, la commande renvoie les clés-valeurs d'appcs-nw." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The default authentication mode of `az appconfig kv` commands is `key`: the CLI retrieves the access keys of the store and uses them. Owner can read those keys, so Dana's first command works, but Owner grants no direct data access through Microsoft Entra ID, so `--auth-mode login` fails for Dana. Data Reader is the opposite: it allows reading key-values with Microsoft Entra ID but doesn't grant access to the resource or its keys, so Lee needs `--auth-mode login`.
        fr: |
          Le mode d'authentification par défaut des commandes `az appconfig kv` est `key` : Azure CLI récupère les clés d'accès du magasin et les utilise. Owner peut lire ces clés : la première commande de Dana fonctionne donc, mais Owner n'accorde aucun accès direct aux données via Microsoft Entra ID, si bien que `--auth-mode login` échoue pour Dana. Data Reader est l'inverse : il permet de lire les clés-valeurs avec Microsoft Entra ID mais n'accorde pas d'accès à la ressource ni à ses clés ; Lee a donc besoin de `--auth-mode login`.
      options:
        s2: { en: "With login, the request is authorized by Dana's Microsoft Entra identity, which has no App Configuration data role.", fr: "Avec login, la requête est autorisée par l'identité Microsoft Entra de Dana, qui n'a aucun rôle de données App Configuration." }
        s3: { en: "In key mode, the CLI must read the access keys of the store, which Data Reader doesn't allow.", fr: "En mode key, Azure CLI doit lire les clés d'accès du magasin, ce que Data Reader ne permet pas." }
    references:
      - title: az appconfig kv
        url: https://learn.microsoft.com/en-us/cli/azure/appconfig/kv
      - title: Access Azure App Configuration using Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac

  # ------------------------------------------------------------------ 8
  - id: ai200-qz-41-08
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Relecloud stores the API key of a partner translation service as the secret **translator-key** in a key vault named **kv-relecloud**. Each version is written with an expiration date 90 days after its creation. The partner can issue a new key at any time, and old keys stay valid until they expire.

        An Event Grid subscription on kv-relecloud delivers every secret event of the vault, in the Event Grid schema, to a Python function app (v2 programming model) whose identity has the Key Vault Secrets Officer role. You are writing the rotation function. It must write a new version 30 days before the current version expires, and writing that version must not start another rotation.

        How should you complete the code? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Relecloud stocke la clé API d'un service de traduction partenaire sous la forme du secret **translator-key** dans un coffre de clés nommé **kv-relecloud**. Chaque version est écrite avec une date d'expiration fixée 90 jours après sa création. Le partenaire peut émettre une nouvelle clé à tout moment, et les anciennes clés restent valides jusqu'à leur expiration.

        Un abonnement Event Grid sur kv-relecloud remet tous les événements de secrets du coffre, selon le schéma Event Grid, à une application de fonction Python (modèle de programmation v2) dont l'identité dispose du rôle Key Vault Secrets Officer. Vous écrivez la fonction de rotation. Elle doit écrire une nouvelle version 30 jours avant l'expiration de la version actuelle, et l'écriture de cette version ne doit pas démarrer une autre rotation.

        Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        client = SecretClient(vault_url=os.environ["VAULT_URL"],
                              credential=DefaultAzureCredential())

        @app.[[trigger]](arg_name="event")
        def rotate(event: func.EventGridEvent) -> None:
            if event.event_type != "[[etype]]":
                return
            name = event.[[name]]
            new_key = partner_api.issue_key()
            client.[[write]](name, new_key,
                             expires_on=datetime.now(timezone.utc) + timedelta(days=90))
      slots:
        - id: trigger
          options:
            - { id: route, text: "route" }
            - { id: eg, text: "event_grid_trigger" }
            - { id: sbt, text: "service_bus_topic_trigger" }
        - id: etype
          options:
            - { id: expired, text: "Microsoft.KeyVault.SecretExpired" }
            - { id: newver, text: "Microsoft.KeyVault.SecretNewVersionCreated" }
            - { id: near, text: "Microsoft.KeyVault.SecretNearExpiry" }
        - id: name
          options:
            - { id: subject, text: "subject" }
            - { id: topic, text: "topic" }
            - { id: id, text: "id" }
        - id: write
          options:
            - { id: update, text: "update_secret_properties" }
            - { id: set, text: "set_secret" }
            - { id: recover, text: "begin_recover_deleted_secret" }
    answer:
      values: { trigger: eg, etype: near, name: subject, write: set }
    explanation:
      correct:
        en: |
          The Event Grid trigger receives the events as `func.EventGridEvent` and handles the subscription validation. Key Vault raises `SecretNearExpiry` 30 days before the current version expires; filtering on it ignores the `SecretNewVersionCreated` event that the new version raises, so the function doesn't loop. The subject of a Key Vault event is the name of the secret, and `set_secret()` writes the new key as a new version with its own expiration date.
        fr: |
          Le déclencheur Event Grid reçoit les événements sous la forme `func.EventGridEvent` et gère la validation de l'abonnement. Key Vault déclenche `SecretNearExpiry` 30 jours avant l'expiration de la version actuelle ; filtrer sur cet événement ignore l'événement `SecretNewVersionCreated` déclenché par la nouvelle version : la fonction ne boucle donc pas. Le sujet (subject) d'un événement Key Vault est le nom du secret, et `set_secret()` écrit la nouvelle clé comme nouvelle version avec sa propre date d'expiration.
      options:
        route: { en: "An HTTP trigger would have to answer the Event Grid validation handshake in code and wouldn't provide a func.EventGridEvent.", fr: "Un déclencheur HTTP devrait répondre à la négociation de validation Event Grid dans le code et ne fournirait pas de func.EventGridEvent." }
        sbt: { en: "The subscription delivers the events directly to the function app, not through a Service Bus topic.", fr: "L'abonnement remet les événements directement à l'application de fonction, pas via une rubrique Service Bus." }
        expired: { en: "SecretExpired is raised when the current version has already expired, not 30 days before.", fr: "SecretExpired est déclenché quand la version actuelle a déjà expiré, pas 30 jours avant." }
        newver: { en: "SecretNewVersionCreated is raised by the version that the function writes, so the rotation would start again after each rotation.", fr: "SecretNewVersionCreated est déclenché par la version que la fonction écrit : la rotation redémarrerait donc après chaque rotation." }
        topic: { en: "topic is the resource path of the vault that publishes the event, not the name of the secret.", fr: "topic est le chemin de ressource du coffre qui publie l'événement, pas le nom du secret." }
        id: { en: "id is the unique identifier of the event, not the name of the secret.", fr: "id est l'identifiant unique de l'événement, pas le nom du secret." }
        update: { en: "update_secret_properties changes attributes only; it can't change the value of a secret.", fr: "update_secret_properties modifie seulement les attributs ; il ne peut pas changer la valeur d'un secret." }
        recover: { en: "begin_recover_deleted_secret restores a soft-deleted secret; it doesn't write a new value.", fr: "begin_recover_deleted_secret restaure un secret supprimé de manière réversible ; il n'écrit pas de nouvelle valeur." }
    references:
      - title: Azure Key Vault as Event Grid source
        url: https://learn.microsoft.com/en-us/azure/event-grid/event-schema-key-vault
      - title: Azure Key Vault Secrets client library for Python
        url: https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-secrets-readme

  # ------------------------------------------------------------------ 9
  - id: ai200-qz-41-09
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip's App Configuration store contains the following key-values.

        | Key | Label | Value | Content type |
        | --- | --- | --- | --- |
        | `Rag:TopK` | (no label) | `5` | (none) |
        | `Rag:TopK` | `Prod` | `8` | (none) |
        | `Rag:Model` | `Prod` | `chat-prod` | (none) |
        | `Rag:Prompts` | (no label) | `{"tone": "formal"}` | `application/json` |
        | `Chat:TopK` | `Prod` | `3` | (none) |

        A Python service loads the store with the following code:

        ```python
        config = load(endpoint=endpoint, credential=DefaultAzureCredential(),
                      selects=[SettingSelector(key_filter="Rag:*", label_filter="Prod"),
                               SettingSelector(key_filter="Rag:*", label_filter="\0")],
                      trim_prefixes=["Rag:"])
        ```

        How does the `config` object behave? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le magasin App Configuration de Wingtip contient les clés-valeurs suivantes.

        | Clé | Étiquette | Valeur | Type de contenu |
        | --- | --- | --- | --- |
        | `Rag:TopK` | (aucune étiquette) | `5` | (aucun) |
        | `Rag:TopK` | `Prod` | `8` | (aucun) |
        | `Rag:Model` | `Prod` | `chat-prod` | (aucun) |
        | `Rag:Prompts` | (aucune étiquette) | `{"tone": "formal"}` | `application/json` |
        | `Chat:TopK` | `Prod` | `3` | (aucun) |

        Un service Python charge le magasin avec le code suivant :

        ```python
        config = load(endpoint=endpoint, credential=DefaultAzureCredential(),
                      selects=[SettingSelector(key_filter="Rag:*", label_filter="Prod"),
                               SettingSelector(key_filter="Rag:*", label_filter="\0")],
                      trim_prefixes=["Rag:"])
        ```

        Comment se comporte l'objet `config` ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          `config["TopK"]` returns [[topk]].

          `config["Model"]` returns [[model]].

          `config["Prompts"]["tone"]` returns [[tone]].

          `"Chat:TopK" in config` evaluates to [[chat]].
        fr: |
          `config["TopK"]` renvoie [[topk]].

          `config["Model"]` renvoie [[model]].

          `config["Prompts"]["tone"]` renvoie [[tone]].

          `"Chat:TopK" in config` prend la valeur [[chat]].
      slots:
        - id: topk
          options:
            - { id: eight, text: "\"8\"" }
            - { id: five, text: "\"5\"" }
            - { id: keyerr, text: { en: "a `KeyError`", fr: "une `KeyError`" } }
        - id: model
          options:
            - { id: keyerr, text: { en: "a `KeyError`", fr: "une `KeyError`" } }
            - { id: none, text: "None" }
            - { id: prod, text: "\"chat-prod\"" }
        - id: tone
          options:
            - { id: formal, text: "\"formal\"" }
            - { id: typeerr, text: { en: "a `TypeError`", fr: "une `TypeError`" } }
            - { id: keyerr, text: { en: "a `KeyError`", fr: "une `KeyError`" } }
        - id: chat
          options:
            - { id: "true", text: "True" }
            - { id: "false", text: "False" }
    answer:
      values: { topk: five, model: prod, tone: formal, chat: "false" }
    explanation:
      correct:
        en: |
          Selectors are loaded in order, and for the same key the last selector wins: the unlabeled `Rag:TopK` (`5`) overrides the Prod value. `Rag:Model` exists only with the Prod label, so the first selector loads it and nothing overrides it. `trim_prefixes` removes `Rag:` from the exposed keys, and the `application/json` content type makes the provider return a deserialized object. `Chat:TopK` matches neither key filter, so it isn't loaded.
        fr: |
          Les sélecteurs sont chargés dans l'ordre et, pour une même clé, le dernier sélecteur l'emporte : `Rag:TopK` sans étiquette (`5`) remplace la valeur Prod. `Rag:Model` n'existe qu'avec l'étiquette Prod : le premier sélecteur le charge et rien ne le remplace. `trim_prefixes` retire `Rag:` des clés exposées, et le type de contenu `application/json` fait renvoyer un objet désérialisé par le fournisseur. `Chat:TopK` ne correspond à aucun des filtres de clé : il n'est donc pas chargé.
      options:
        eight: { en: "The Prod value is loaded first and then overridden by the unlabeled value of the second selector.", fr: "La valeur Prod est chargée en premier, puis remplacée par la valeur sans étiquette du second sélecteur." }
        none: { en: "A key missing from the configuration raises a KeyError; here the key is present anyway.", fr: "Une clé absente de la configuration lève une KeyError ; ici, la clé est de toute façon présente." }
        typeerr: { en: "The JSON value is deserialized into a dictionary, so it can be indexed by tone.", fr: "La valeur JSON est désérialisée en dictionnaire : elle peut donc être indexée par tone." }
        "true": { en: "Both selectors filter on Rag:*, so no Chat key is loaded.", fr: "Les deux sélecteurs filtrent sur Rag:* : aucune clé Chat n'est chargée." }
    references:
      - title: Python Configuration Provider - Azure App Configuration
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/reference-python-provider

  # ------------------------------------------------------------------ 10
  - id: ai200-qz-41-10
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has a key vault named **kv-wg-models** that uses the vault access policy permission model. The vault contains a secret named `scoring-key`. The following table shows all the access granted on kv-wg-models.

        | Principal | Azure role assignment on kv-wg-models | Access policy on kv-wg-models |
        | --- | --- | --- |
        | id-api (managed identity) | Key Vault Secrets User | None |
        | id-batch (managed identity) | None | Secret permissions: Get, List |
        | G-Ops (group) | Key Vault Contributor | None |
        | id-audit (managed identity) | Key Vault Reader | Secret permissions: List |

        No other role assignment or access policy applies to these principals.

        Which two actions succeed?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un coffre de clés nommé **kv-wg-models** qui utilise le modèle d'autorisation par stratégie d'accès au coffre. Le coffre contient un secret nommé `scoring-key`. Le tableau suivant présente tous les accès accordés sur kv-wg-models.

        | Principal | Attribution de rôle Azure sur kv-wg-models | Stratégie d'accès sur kv-wg-models |
        | --- | --- | --- |
        | id-api (identité managée) | Key Vault Secrets User | Aucune |
        | id-batch (identité managée) | Aucune | Autorisations de secret : Get, List |
        | G-Ops (groupe) | Key Vault Contributor | Aucune |
        | id-audit (identité managée) | Key Vault Reader | Autorisations de secret : List |

        Aucune autre attribution de rôle ni stratégie d'accès ne s'applique à ces principaux.

        Quelles sont les deux actions qui réussissent ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "id-api reads the value of scoring-key by calling `get_secret(\"scoring-key\")`.", fr: "id-api lit la valeur de scoring-key en appelant `get_secret(\"scoring-key\")`." } }
        - { id: b, text: { en: "A member of G-Ops adds an access policy that grants the member the Get permission on secrets.", fr: "Un membre de G-Ops ajoute une stratégie d'accès qui lui accorde l'autorisation Get sur les secrets." } }
        - { id: c, text: { en: "id-audit reads the value of scoring-key by calling `get_secret(\"scoring-key\")`.", fr: "id-audit lit la valeur de scoring-key en appelant `get_secret(\"scoring-key\")`." } }
        - { id: d, text: { en: "id-batch reads the value of scoring-key by calling `get_secret(\"scoring-key\")`.", fr: "id-batch lit la valeur de scoring-key en appelant `get_secret(\"scoring-key\")`." } }
        - { id: e, text: { en: "A member of G-Ops reads the value of scoring-key without changing the configuration of the vault.", fr: "Un membre de G-Ops lit la valeur de scoring-key sans modifier la configuration du coffre." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          With the access policy model, data-plane access comes only from access policies: the Get permission on secrets lets id-batch read the value. Key Vault data-plane roles such as Key Vault Secrets User and Key Vault Reader work only on vaults that use the Azure RBAC model. Key Vault Contributor has no data access, but it can write the vault configuration, including its access policies, so a member of G-Ops can grant themselves access; the Azure RBAC model removes this risk.
        fr: |
          Avec le modèle par stratégie d'accès, l'accès au plan de données provient uniquement des stratégies d'accès : l'autorisation Get sur les secrets permet à id-batch de lire la valeur. Les rôles Key Vault du plan de données, comme Key Vault Secrets User et Key Vault Reader, ne fonctionnent que sur les coffres qui utilisent le modèle Azure RBAC. Key Vault Contributor n'a aucun accès aux données, mais il peut écrire la configuration du coffre, y compris ses stratégies d'accès : un membre de G-Ops peut donc s'accorder l'accès ; le modèle Azure RBAC supprime ce risque.
      options:
        a: { en: "Key Vault Secrets User only works on vaults that use the Azure RBAC permission model; this vault evaluates access policies only.", fr: "Key Vault Secrets User ne fonctionne que sur les coffres qui utilisent le modèle d'autorisation Azure RBAC ; ce coffre n'évalue que les stratégies d'accès." }
        c: { en: "List only enumerates secrets without their values, and Key Vault Reader neither reads values nor applies to this vault.", fr: "List énumère seulement les secrets sans leurs valeurs, et Key Vault Reader ne lit pas les valeurs et ne s'applique pas à ce coffre." }
        e: { en: "Key Vault Contributor is a control plane role with no access to secrets; a member must first change an access policy.", fr: "Key Vault Contributor est un rôle du plan de contrôle sans accès aux secrets ; un membre doit d'abord modifier une stratégie d'accès." }
    references:
      - title: Azure role-based access control (Azure RBAC) vs. access policies
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-access-policy
      - title: Grant permission to applications to access an Azure key vault using Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
