chapter: 32-functions
questions:
  # ------------------------------------------------------------------ 1
  - id: ai200-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders stores the connection string of its Service Bus namespace in an app setting named `JobsBus`. In a Python function app (v2 programming model), a function must start when a message arrives in the **ocr-jobs** queue of that namespace.

        How should you set the `connection` parameter of the `@app.service_bus_queue_trigger` decorator?
      fr: |
        Northwind Traders stocke la chaîne de connexion de son espace de noms Service Bus dans un paramètre d'application nommé `JobsBus`. Dans une application de fonction Python (modèle de programmation v2), une fonction doit démarrer quand un message arrive dans la file d'attente **ocr-jobs** de cet espace de noms.

        Comment devez-vous définir le paramètre `connection` du décorateur `@app.service_bus_queue_trigger` ?
    body:
      options:
        - { id: a, text: "`connection=\"%JobsBus%\"`" }
        - { id: b, text: "`connection=os.environ[\"JobsBus\"]`" }
        - { id: c, text: "`connection=\"JobsBus\"`" }
        - { id: d, text: "`connection=\"northwind-jobs.servicebus.windows.net\"`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A trigger or binding never receives the secret itself: `connection` holds the name of the app setting (or the prefix of a group of settings) that the runtime reads. The `connection` property resolves its value as an app setting name directly, without percent signs.
        fr: |
          Un déclencheur ou une liaison ne reçoit jamais le secret lui-même : `connection` contient le nom du paramètre d'application (ou le préfixe d'un groupe de paramètres) que le runtime lit. La propriété `connection` résout directement sa valeur comme nom de paramètre d'application, sans signes pourcentage.
      options:
        a: { en: "Percent signs are the app setting syntax of other binding properties, such as `path`; `connection` already resolves an app setting name without them.", fr: "Les signes pourcentage sont la syntaxe des paramètres d'application pour d'autres propriétés de liaison, comme `path` ; `connection` résout déjà un nom de paramètre d'application sans eux." }
        b: { en: "This passes the connection string itself to the decorator, while `connection` expects the name of a setting, not a secret value.", fr: "Cela transmet la chaîne de connexion elle-même au décorateur, alors que `connection` attend le nom d'un paramètre, pas une valeur secrète." }
        d: { en: "A namespace address isn't a setting name; with a managed identity, it is the value of a `JobsBus__fullyQualifiedNamespace` app setting.", fr: "Une adresse d'espace de noms n'est pas un nom de paramètre ; avec une identité managée, c'est la valeur d'un paramètre d'application `JobsBus__fullyQualifiedNamespace`." }
    references:
      - title: Azure Functions Binding Expressions and Patterns
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-expressions-patterns
      - title: Python developer reference for Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python

  # ------------------------------------------------------------------ 2
  - id: ai200-qz-32-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam is preparing the deployment package of a Python function app that uses the v2 programming model. The functions use only the `azure-functions` package and the Python standard library. The project folder contains `function_app.py`, `host.json`, `local.settings.json`, `requirements.txt` and `.funcignore`.

        Which two files must the package contain for the app to run in Azure?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prépare le package de déploiement d'une application de fonction Python qui utilise le modèle de programmation v2. Les fonctions n'utilisent que le package `azure-functions` et la bibliothèque standard Python. Le dossier du projet contient `function_app.py`, `host.json`, `local.settings.json`, `requirements.txt` et `.funcignore`.

        Quels sont les deux fichiers que le package doit contenir pour que l'application s'exécute dans Azure ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "`local.settings.json`" }
        - { id: b, text: "`function_app.py`" }
        - { id: c, text: "`requirements.txt`" }
        - { id: d, text: "`host.json`" }
        - { id: e, text: "`.funcignore`" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          In the v2 model, `function_app.py` declares the functions with decorators, and `host.json` holds the global configuration of every function of the app: both are required in Azure. The other files are local-only or recommended, not required.
        fr: |
          Dans le modèle v2, `function_app.py` déclare les fonctions avec des décorateurs, et `host.json` contient la configuration globale de toutes les fonctions de l'application : les deux sont obligatoires dans Azure. Les autres fichiers sont locaux ou recommandés, pas obligatoires.
      options:
        a: { en: "`local.settings.json` holds local app settings and secrets for Core Tools and is never published.", fr: "`local.settings.json` contient les paramètres d'application et les secrets locaux de Core Tools et n'est jamais publié." }
        c: { en: "`requirements.txt` is recommended: a remote build installs the packages it lists. With no third-party package, the app runs without it.", fr: "`requirements.txt` est recommandé : une build distante installe les packages qu'il liste. Sans package tiers, l'application s'exécute sans lui." }
        e: { en: "`.funcignore` only lists files and folders to exclude from the deployment; it is optional.", fr: "`.funcignore` liste seulement les fichiers et dossiers à exclure du déploiement ; il est facultatif." }
    references:
      - title: Python developer reference for Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference-python

  # ------------------------------------------------------------------ 3
  - id: ai200-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys is creating a Python function app named **func-tt-rerank** by using the Azure CLI. Each execution loads a reranking model that needs about 3 GB of memory. The app must scale to zero when it's idle, and its cost must be minimized.

        Which parameters should you add to the `az functionapp create` command?
      fr: |
        Tailspin Toys crée une application de fonction Python nommée **func-tt-rerank** à l'aide d'Azure CLI. Chaque exécution charge un modèle de reclassement qui a besoin d'environ 3 Go de mémoire. L'application doit se mettre à l'échelle jusqu'à zéro quand elle est inactive, et son coût doit être réduit au minimum.

        Quels paramètres devez-vous ajouter à la commande `az functionapp create` ?
    body:
      options:
        - { id: a, text: "`--flexconsumption-location westeurope --instance-memory 2048`" }
        - { id: b, text: "`--flexconsumption-location westeurope --instance-memory 4096`" }
        - { id: c, text: "`--flexconsumption-location westeurope --instance-memory 8192`" }
        - { id: d, text: "`--consumption-plan-location westeurope --os-type Linux`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Flex Consumption plan scales to zero and offers three instance memory sizes: 512, 2,048 (the default) and 4,096 MB. A model that needs about 3 GB requires the 4,096 MB size, which is the smallest size that fits and therefore the cheapest one that works.
        fr: |
          Le plan Flex Consumption se met à l'échelle jusqu'à zéro et propose trois tailles de mémoire d'instance : 512, 2 048 (la valeur par défaut) et 4 096 Mo. Un modèle qui a besoin d'environ 3 Go exige la taille de 4 096 Mo, qui est la plus petite taille suffisante et donc la moins chère qui fonctionne.
      options:
        a: { en: "2,048 MB is the default size, but it is smaller than the 3 GB that the model needs.", fr: "2 048 Mo est la taille par défaut, mais elle est inférieure aux 3 Go dont le modèle a besoin." }
        c: { en: "8,192 MB isn't an instance memory size of Flex Consumption: the sizes are 512, 2,048 and 4,096 MB.", fr: "8 192 Mo n'est pas une taille de mémoire d'instance de Flex Consumption : les tailles sont 512, 2 048 et 4 096 Mo." }
        d: { en: "This targets the legacy Consumption plan: Flex Consumption is the plan for new serverless apps, and the Linux Consumption option retires on 30 September 2028.", fr: "Cela cible le plan Consumption hérité : Flex Consumption est le plan des nouvelles applications serverless, et l'option Consumption sur Linux est mise hors service le 30 septembre 2028." }
    references:
      - title: Azure Functions Flex Consumption plan hosting
        url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
      - title: Azure Functions Scale and Hosting
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale

  # ------------------------------------------------------------------ 4
  - id: ai200-qz-32-04
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso sends summarization jobs to a Service Bus queue named **summarize-jobs**. Each message is a JSON document such as `{"documentId": "c-1042", "language": "fr"}`. The transcript of each document is stored as the blob `transcripts/<documentId>.txt` in a storage account.

        You are writing the Python function (v2 programming model) that processes the jobs. The function must receive the transcript named by each message without Blob Storage SDK code.

        How should you complete the code? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso envoie des tâches de synthèse à une file d'attente Service Bus nommée **summarize-jobs**. Chaque message est un document JSON comme `{"documentId": "c-1042", "language": "fr"}`. La transcription de chaque document est stockée sous la forme de l'objet blob `transcripts/<documentId>.txt` dans un compte de stockage.

        Vous écrivez la fonction Python (modèle de programmation v2) qui traite les tâches. La fonction doit recevoir la transcription désignée par chaque message, sans code du SDK Stockage Blob.

        Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        @app.service_bus_queue_trigger(arg_name="msg", queue_name="summarize-jobs",
                                       connection="JobsBus")
        @app.[[dec]](arg_name="transcript", path=[[path]],
                     connection="TranscriptStorage")
        def summarize(msg: func.ServiceBusMessage, transcript: [[ptype]]) -> None:
            job = json.loads(msg.get_body().decode("utf-8"))
            summary = call_model(transcript, job["language"])
            save_summary(job["documentId"], summary)
      slots:
        - id: dec
          options:
            - { id: trigger, text: "blob_trigger" }
            - { id: input, text: "blob_input" }
            - { id: output, text: "blob_output" }
        - id: path
          options:
            - { id: pct, text: "\"transcripts/%documentId%.txt\"" }
            - { id: name, text: "\"transcripts/{name}.txt\"" }
            - { id: prop, text: "\"transcripts/{documentId}.txt\"" }
            - { id: guid, text: "\"transcripts/{rand-guid}.txt\"" }
        - id: ptype
          options:
            - { id: out, text: "func.Out[str]" }
            - { id: str, text: "str" }
            - { id: sbm, text: "func.ServiceBusMessage" }
    answer:
      values: { dec: input, path: prop, ptype: str }
    explanation:
      correct:
        en: |
          The function already has its trigger, so it reads the blob with a `blob_input` binding, received as a plain `str` parameter. Because the message is JSON, the binding expression `{documentId}` takes the value of its `documentId` property and selects the right blob for each message.
        fr: |
          La fonction a déjà son déclencheur : elle lit donc l'objet blob avec une liaison `blob_input`, reçue comme simple paramètre `str`. Comme le message est en JSON, l'expression de liaison `{documentId}` prend la valeur de sa propriété `documentId` et sélectionne le bon objet blob pour chaque message.
      options:
        trigger: { en: "A function has exactly one trigger, and this one is already the Service Bus queue trigger.", fr: "Une fonction a exactement un déclencheur, et celui-ci est déjà le déclencheur de file d'attente Service Bus." }
        output: { en: "blob_output writes a blob; the function must read an existing transcript.", fr: "blob_output écrit un objet blob ; la fonction doit lire une transcription existante." }
        pct: { en: "Percent signs resolve an app setting, not a property of the trigger message.", fr: "Les signes pourcentage résolvent un paramètre d'application, pas une propriété du message déclencheur." }
        name: { en: "The message has no `name` property; `{name}` comes from the path of a blob trigger.", fr: "Le message n'a pas de propriété `name` ; `{name}` provient du chemin d'un déclencheur d'objet blob." }
        guid: { en: "`{rand-guid}` generates a new GUID, so it can't designate an existing blob.", fr: "`{rand-guid}` génère un nouveau GUID : il ne peut donc pas désigner un objet blob existant." }
        out: { en: "func.Out[str] is the type of an output binding written with set().", fr: "func.Out[str] est le type d'une liaison de sortie écrite avec set()." }
        sbm: { en: "func.ServiceBusMessage is the type of the trigger parameter, not of the blob content.", fr: "func.ServiceBusMessage est le type du paramètre du déclencheur, pas du contenu de l'objet blob." }
    references:
      - title: Azure Blob storage input binding for Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-storage-blob-input
      - title: Azure Functions Binding Expressions and Patterns
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-expressions-patterns

  # ------------------------------------------------------------------ 5
  - id: ai200-qz-32-05
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware publishes custom events to an Event Grid topic each time a knowledge base article is approved. A developer writes a Python function (v2 programming model) decorated with `@app.route(route="article-events", methods=["POST"])` and uses its URL as the webhook endpoint of a new event subscription. Creating the event subscription fails because the endpoint isn't validated.

        You need the function to receive the events with the least custom code. What should you do?
      fr: |
        Litware publie des événements personnalisés dans une rubrique Event Grid chaque fois qu'un article de la base de connaissances est approuvé. Un développeur écrit une fonction Python (modèle de programmation v2) décorée avec `@app.route(route="article-events", methods=["POST"])` et utilise son URL comme point de terminaison webhook d'un nouvel abonnement aux événements. La création de l'abonnement aux événements échoue, car le point de terminaison n'est pas validé.

        Vous devez faire en sorte que la fonction reçoive les événements avec le moins de code personnalisé possible. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the authorization level of the function to `func.AuthLevel.ANONYMOUS` so that Event Grid can call the URL without a key.", fr: "Définir le niveau d'autorisation de la fonction sur `func.AuthLevel.ANONYMOUS` pour qu'Event Grid puisse appeler l'URL sans clé." } }
        - { id: b, text: { en: "Return HTTP status code 202 from the function for every request that Event Grid sends.", fr: "Renvoyer le code d'état HTTP 202 depuis la fonction pour chaque requête qu'Event Grid envoie." } }
        - { id: c, text: { en: "Replace `@app.route` with `@app.event_grid_trigger`, and select the function as the endpoint of the event subscription.", fr: "Remplacer `@app.route` par `@app.event_grid_trigger`, puis sélectionner la fonction comme point de terminaison de l'abonnement aux événements." } }
        - { id: d, text: { en: "Add an `@app.retry` decorator to the function so that the runtime retries the failed validation.", fr: "Ajouter un décorateur `@app.retry` à la fonction pour que le runtime réessaie la validation qui a échoué." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Event Grid validates a webhook endpoint by sending a validation event whose code the endpoint must echo back. With the Event Grid trigger, Azure handles this handshake automatically, whereas an HTTP-triggered function must implement it in its own code. The trigger then delivers each event as a `func.EventGridEvent`.
        fr: |
          Event Grid valide un point de terminaison webhook en envoyant un événement de validation dont le point de terminaison doit renvoyer le code. Avec le déclencheur Event Grid, Azure gère automatiquement cette négociation, alors qu'une fonction déclenchée par HTTP doit l'implémenter dans son propre code. Le déclencheur remet ensuite chaque événement sous la forme d'un `func.EventGridEvent`.
      options:
        a: { en: "Removing the key doesn't answer the handshake: the HTTP function still has to read the validation code and send it back.", fr: "Supprimer la clé ne répond pas à la négociation : la fonction HTTP doit toujours lire le code de validation et le renvoyer." }
        b: { en: "Event Grid requires an HTTP 200 response that echoes the validation code; a 202 response isn't a valid validation response.", fr: "Event Grid exige une réponse HTTP 200 qui renvoie le code de validation ; une réponse 202 n'est pas une réponse de validation valide." }
        d: { en: "Runtime retry policies apply to Timer, Event Hubs, Cosmos DB and Kafka triggers, and they don't take part in the subscription validation.", fr: "Les stratégies de nouvelle tentative du runtime s'appliquent aux déclencheurs Timer, Event Hubs, Cosmos DB et Kafka, et elles ne participent pas à la validation de l'abonnement." }
    references:
      - title: Validate Webhook Endpoints with Event Grid Schema - Azure Event Grid
        url: https://learn.microsoft.com/en-us/azure/event-grid/end-point-validation-event-grid-events-schema
      - title: Azure Event Grid trigger for Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-event-grid-trigger

  # ------------------------------------------------------------------ 6
  - id: ai200-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank hosts a Python function app named **func-wg-advisor** on a Premium plan. An HTTP-triggered function named **ask** uses `func.AuthLevel.FUNCTION`. It is called by a single-page web application that runs in the browsers of the bank's financial advisors, and the function key is embedded in the JavaScript code of that application.

        A security review sets the following requirements:

        - Only advisors who are signed in with their work account in the Microsoft Entra tenant of Woodgrove can call **ask**.
        - The function code must be able to identify the advisor who sends each request.
        - No shared secret may be delivered to the browsers.

        What should you do?
      fr: |
        Woodgrove Bank héberge une application de fonction Python nommée **func-wg-advisor** dans un plan Premium. Une fonction déclenchée par HTTP nommée **ask** utilise `func.AuthLevel.FUNCTION`. Elle est appelée par une application web monopage qui s'exécute dans les navigateurs des conseillers financiers de la banque, et la clé de fonction est incorporée dans le code JavaScript de cette application.

        Une revue de sécurité fixe les exigences suivantes :

        - Seuls les conseillers connectés avec leur compte professionnel dans le locataire Microsoft Entra de Woodgrove peuvent appeler **ask**.
        - Le code de la fonction doit pouvoir identifier le conseiller qui envoie chaque requête.
        - Aucun secret partagé ne doit être remis aux navigateurs.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Rotate the function key every day, and store the current key in Azure Key Vault so that the web application retrieves it at startup.", fr: "Faire pivoter la clé de fonction chaque jour, et stocker la clé actuelle dans Azure Key Vault pour que l'application web la récupère au démarrage." } }
        - { id: b, text: { en: "Set the authorization level of ask to `func.AuthLevel.ADMIN`, and give the master key only to the web application of the advisors.", fr: "Définir le niveau d'autorisation de ask sur `func.AuthLevel.ADMIN`, et ne donner la clé principale qu'à l'application web des conseillers." } }
        - { id: c, text: { en: "Assign the Website Contributor role on func-wg-advisor to the Microsoft Entra group of the advisors, and set ask to `func.AuthLevel.ANONYMOUS`.", fr: "Attribuer le rôle Website Contributor sur func-wg-advisor au groupe Microsoft Entra des conseillers, et définir ask sur `func.AuthLevel.ANONYMOUS`." } }
        - { id: d, text: { en: "Enable App Service authentication on func-wg-advisor with the Microsoft Entra identity provider, and require authentication for every request.", fr: "Activer l'authentification App Service sur func-wg-advisor avec le fournisseur d'identité Microsoft Entra, et exiger l'authentification pour chaque requête." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Function keys only make an endpoint harder to call: any holder of a key can use it, and a key doesn't identify a user. App Service authentication with Microsoft Entra ID positively authenticates each caller before the request reaches the function, and the platform passes the identity of the signed-in user to the app. Nothing secret is shipped to the browser.
        fr: |
          Les clés de fonction rendent seulement un point de terminaison plus difficile à appeler : tout détenteur d'une clé peut l'utiliser, et une clé n'identifie pas un utilisateur. L'authentification App Service avec Microsoft Entra ID authentifie réellement chaque appelant avant que la requête n'atteigne la fonction, et la plateforme transmet à l'application l'identité de l'utilisateur connecté. Aucun secret n'est envoyé au navigateur.
      options:
        a: { en: "The browser still receives a shared key, which any user who reads it can reuse, and the key identifies no advisor.", fr: "Le navigateur reçoit toujours une clé partagée, que tout utilisateur qui la lit peut réutiliser, et la clé n'identifie aucun conseiller." }
        b: { en: "The master key is a shared secret too, with even broader rights over the app, and it identifies no caller.", fr: "La clé principale est elle aussi un secret partagé, avec des droits encore plus larges sur l'application, et elle n'identifie aucun appelant." }
        c: { en: "Azure roles govern management of the resource, not HTTP calls to a function; with ANONYMOUS, anyone can call ask.", fr: "Les rôles Azure régissent la gestion de la ressource, pas les appels HTTP à une fonction ; avec ANONYMOUS, n'importe qui peut appeler ask." }
    references:
      - title: Securing Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts
      - title: Azure Functions HTTP trigger
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger

  # ------------------------------------------------------------------ 7
  - id: ai200-qz-32-07
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum runs a Python function app on a Premium plan. A function triggered by the Service Bus queue **transcribe-jobs** sends an audio file to a speech model and writes the transcript to Blob Storage. Each execution receives one message and runs for 8 to 9 minutes.

        The queue uses peek-lock mode, the default lock duration of 1 minute and a maximum delivery count of 10. host.json sets `functionTimeout` to `00:30:00` and doesn't configure the Service Bus extension.

        Many transcripts are produced two or three times, and the logs show that some messages are delivered again while their first execution is still running. You need each message to be delivered only once when its execution succeeds. What should you do?
      fr: |
        Adatum exécute une application de fonction Python dans un plan Premium. Une fonction déclenchée par la file d'attente Service Bus **transcribe-jobs** envoie un fichier audio à un modèle de reconnaissance vocale et écrit la transcription dans le Stockage Blob. Chaque exécution reçoit un message et dure de 8 à 9 minutes.

        La file d'attente utilise le mode peek-lock, la durée de verrouillage par défaut de 1 minute et un nombre maximal de remises de 10. host.json définit `functionTimeout` sur `00:30:00` et ne configure pas l'extension Service Bus.

        De nombreuses transcriptions sont produites deux ou trois fois, et les journaux montrent que certains messages sont remis de nouveau pendant que leur première exécution est encore en cours. Vous devez faire en sorte que chaque message ne soit remis qu'une fois quand son exécution réussit. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In host.json, set `extensions.serviceBus.autoCompleteMessages` to `false`.", fr: "Dans host.json, définir `extensions.serviceBus.autoCompleteMessages` sur `false`." } }
        - { id: b, text: { en: "Set the lock duration of the transcribe-jobs queue to 15 minutes.", fr: "Définir la durée de verrouillage de la file d'attente transcribe-jobs sur 15 minutes." } }
        - { id: c, text: { en: "Set the maximum delivery count of the transcribe-jobs queue to 1.", fr: "Définir le nombre maximal de remises de la file d'attente transcribe-jobs sur 1." } }
        - { id: d, text: { en: "In host.json, set `extensions.serviceBus.maxAutoLockRenewalDuration` to `00:15:00`.", fr: "Dans host.json, définir `extensions.serviceBus.maxAutoLockRenewalDuration` sur `00:15:00`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          For a function that receives one message at a time, the runtime renews the message lock automatically, but only for `maxAutoLockRenewalDuration`, which is 5 minutes by default. After that, the lock expires and Service Bus makes the message available again while the first execution is still running. A renewal duration longer than the processing time keeps the lock until the runtime completes the message.
        fr: |
          Pour une fonction qui reçoit un message à la fois, le runtime renouvelle automatiquement le verrou du message, mais seulement pendant `maxAutoLockRenewalDuration`, qui vaut 5 minutes par défaut. Ensuite, le verrou expire et Service Bus rend le message de nouveau disponible pendant que la première exécution est encore en cours. Une durée de renouvellement supérieure au temps de traitement conserve le verrou jusqu'à ce que le runtime termine le message.
      options:
        a: { en: "The runtime would no longer complete the messages after success; without settlement code, every message would come back when its lock expires.", fr: "Le runtime ne terminerait plus les messages après un succès ; sans code de règlement, chaque message reviendrait à l'expiration de son verrou." }
        b: { en: "The lock duration of a queue can't exceed 5 minutes; longer processing relies on lock renewal.", fr: "La durée de verrouillage d'une file d'attente ne peut pas dépasser 5 minutes ; un traitement plus long repose sur le renouvellement du verrou." }
        c: { en: "When the lock expires, the message would go to the dead-letter queue instead of being completed, so long jobs would fail instead of running once.", fr: "Quand le verrou expire, le message irait dans la file d'attente de lettres mortes au lieu d'être terminé : les longues tâches échoueraient au lieu de s'exécuter une fois." }
    references:
      - title: Azure Service Bus bindings for Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus
      - title: Message Transfers, Locks, and Settlement - Azure Service Bus
        url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement

  # ------------------------------------------------------------------ 8
  - id: ai200-qz-32-08
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware runs three Python function apps, described in the following table.

        | App | Hosting plan | `functionTimeout` in host.json | Function |
        | --- | --- | --- | --- |
        | func-pro-batch | Flex Consumption | `01:00:00` | Service Bus triggered function whose executions last 45 minutes |
        | func-pro-legacy | Consumption (legacy) | `00:20:00` | Queue storage triggered function whose executions last 15 minutes |
        | func-pro-api | Premium | `-1` | HTTP-triggered function that sends its response after 5 minutes |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exécute trois applications de fonction Python, décrites dans le tableau suivant.

        | Application | Plan d'hébergement | `functionTimeout` dans host.json | Fonction |
        | --- | --- | --- | --- |
        | func-pro-batch | Flex Consumption | `01:00:00` | Fonction déclenchée par Service Bus dont les exécutions durent 45 minutes |
        | func-pro-legacy | Consumption (hérité) | `00:20:00` | Fonction déclenchée par une file d'attente Stockage dont les exécutions durent 15 minutes |
        | func-pro-api | Premium | `-1` | Fonction déclenchée par HTTP qui envoie sa réponse au bout de 5 minutes |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The 45-minute executions of the function in func-pro-batch can complete.", fr: "Les exécutions de 45 minutes de la fonction de func-pro-batch peuvent se terminer." }
        - id: s2
          text: { en: "The 15-minute executions of the function in func-pro-legacy can complete.", fr: "Les exécutions de 15 minutes de la fonction de func-pro-legacy peuvent se terminer." }
        - id: s3
          text: { en: "The clients of func-pro-api receive the response that the function sends after 5 minutes.", fr: "Les clients de func-pro-api reçoivent la réponse que la fonction envoie au bout de 5 minutes." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Flex Consumption has a default timeout of 30 minutes and no enforced maximum, so a `functionTimeout` of one hour covers 45-minute executions. The legacy Consumption plan allows 10 minutes at most, whatever host.json says. On every plan, an HTTP-triggered function must respond within 230 seconds: after that, the load balancer returns HTTP 502 while the function keeps running.
        fr: |
          Flex Consumption a un délai d'expiration par défaut de 30 minutes et aucun maximum imposé : une valeur `functionTimeout` d'une heure couvre donc des exécutions de 45 minutes. Le plan Consumption hérité autorise 10 minutes au plus, quoi qu'indique host.json. Dans tous les plans, une fonction déclenchée par HTTP doit répondre en moins de 230 secondes : au-delà, l'équilibreur de charge renvoie HTTP 502 pendant que la fonction continue de s'exécuter.
      options:
        s2: { en: "The maximum timeout of the Consumption plan is 10 minutes, so the executions are stopped before they finish.", fr: "Le délai d'expiration maximal du plan Consumption est de 10 minutes : les exécutions sont donc arrêtées avant leur fin." }
        s3: { en: "An unbounded functionTimeout doesn't lift the 230-second HTTP response limit; queue the work and return 202 instead.", fr: "Un functionTimeout illimité ne lève pas la limite de réponse HTTP de 230 secondes ; mettez plutôt le travail en file d'attente et renvoyez 202." }
    references:
      - title: Azure Functions Scale and Hosting
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
      - title: host.json reference for Azure Functions 2.x
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-host-json

  # ------------------------------------------------------------------ 9
  - id: ai200-qz-32-09
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso hosts a Python function app named **func-cts-docs** on the Flex Consumption plan. The app contains the following functions:

        - three HTTP-triggered functions named **ask**, **feedback** and **health**;
        - a blob-triggered function named **ingest** that uses the Event Grid source;
        - a Service Bus triggered function named **embed**.

        You run the following command:

        `az functionapp scale config always-ready set -g rg-cts -n func-cts-docs --settings http=2`

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso héberge une application de fonction Python nommée **func-cts-docs** dans le plan Flex Consumption. L'application contient les fonctions suivantes :

        - trois fonctions déclenchées par HTTP nommées **ask**, **feedback** et **health** ;
        - une fonction déclenchée par objet blob nommée **ingest** qui utilise la source Event Grid ;
        - une fonction déclenchée par Service Bus nommée **embed**.

        Vous exécutez la commande suivante :

        `az functionapp scale config always-ready set -g rg-cts -n func-cts-docs --settings http=2`

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "During a burst of HTTP requests, the instances added for the HTTP functions also process the messages of embed.", fr: "Pendant un pic de requêtes HTTP, les instances ajoutées pour les fonctions HTTP traitent aussi les messages d'embed." } }
        - { id: b, text: { en: "The two always-ready instances serve ask, feedback and health together.", fr: "Les deux instances toujours prêtes servent ask, feedback et health ensemble." } }
        - { id: c, text: { en: "ingest runs on the same instances as the HTTP functions, including the two always-ready ones.", fr: "ingest s'exécute sur les mêmes instances que les fonctions HTTP, y compris les deux toujours prêtes." } }
        - { id: d, text: { en: "The two always-ready instances aren't billed during the periods when no function runs.", fr: "Les deux instances toujours prêtes ne sont pas facturées pendant les périodes où aucune fonction ne s'exécute." } }
        - { id: e, text: { en: "embed scales out on its own instances, independently of the other functions of the app.", fr: "embed se met à l'échelle sur ses propres instances, indépendamment des autres fonctions de l'application." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Flex Consumption uses per-function scaling: all HTTP-triggered functions form the `http` group and scale together on their own instances, so `http=2` keeps two instances ready for the whole group. Blob (Event Grid) triggered functions form a separate `blob` group, and every other function, such as a Service Bus triggered one, scales individually.
        fr: |
          Flex Consumption utilise la mise à l'échelle par fonction : toutes les fonctions déclenchées par HTTP forment le groupe `http` et se mettent à l'échelle ensemble sur leurs propres instances ; `http=2` garde donc deux instances prêtes pour tout le groupe. Les fonctions déclenchées par objet blob (Event Grid) forment un groupe `blob` distinct, et toute autre fonction, comme une fonction déclenchée par Service Bus, se met à l'échelle individuellement.
      options:
        a: { en: "Instances of the http group run only the HTTP functions; embed gets its own instances.", fr: "Les instances du groupe http n'exécutent que les fonctions HTTP ; embed obtient ses propres instances." }
        c: { en: "Event Grid-based blob triggers form the separate blob group, with their own instances.", fr: "Les déclencheurs d'objet blob basés sur Event Grid forment le groupe blob distinct, avec leurs propres instances." }
        d: { en: "Always-ready instances are billed for their provisioned memory even when idle, with no free grant.", fr: "Les instances toujours prêtes sont facturées pour leur mémoire provisionnée même inactives, sans octroi gratuit." }
    references:
      - title: Azure Functions Flex Consumption plan hosting
        url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
      - title: Create and manage function apps in the Flex Consumption plan
        url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to

  # ------------------------------------------------------------------ 10
  - id: ai200-qz-32-10
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam is standardizing failure handling in a Python function app (v2 programming model). Four functions call a language model that sometimes fails, and each function has the requirement described for it in the answer area. Each requirement must be met by configuration, without settlement or retry code in the functions.

        Which mechanism should you configure for each function? To answer, drag the appropriate mechanisms to the correct functions. Each mechanism may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam standardise la gestion des échecs dans une application de fonction Python (modèle de programmation v2). Quatre fonctions appellent un modèle de langage qui échoue parfois, et chaque fonction a l'exigence décrite pour elle dans la zone de réponse. Chaque exigence doit être satisfaite par configuration, sans code de règlement ni de nouvelle tentative dans les fonctions.

        Quel mécanisme devez-vous configurer pour chaque fonction ? Pour répondre, faites glisser les mécanismes appropriés vers les fonctions correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: retry, text: { en: "`@app.retry` with `strategy=\"exponential_backoff\"` on the function", fr: "`@app.retry` avec `strategy=\"exponential_backoff\"` sur la fonction" } }
        - { id: dequeue, text: { en: "`maxDequeueCount` of the Queue storage extension in host.json", fr: "`maxDequeueCount` de l'extension File d'attente Stockage dans host.json" } }
        - { id: delivery, text: { en: "Maximum delivery count of the Service Bus queue", fr: "Nombre maximal de remises de la file d'attente Service Bus" } }
        - { id: egpolicy, text: { en: "Retry policy of the Event Grid event subscription", fr: "Stratégie de nouvelle tentative de l'abonnement aux événements Event Grid" } }
        - { id: lockrenew, text: { en: "`maxAutoLockRenewalDuration` of the Service Bus extension in host.json", fr: "`maxAutoLockRenewalDuration` de l'extension Service Bus dans host.json" } }
        - { id: functimeout, text: { en: "`functionTimeout` in host.json", fr: "`functionTimeout` dans host.json" } }
      targets:
        - id: telemetry
          text: { en: "telemetry (Event Hubs trigger): run a failed execution again up to 5 times, with a delay that grows between attempts", fr: "telemetry (déclencheur Event Hubs) : réexécuter une exécution en échec jusqu'à 5 fois, avec un délai qui augmente entre les tentatives" }
        - id: ocr
          text: { en: "ocr (Queue storage trigger): move a message to the poison queue after 3 failed attempts", fr: "ocr (déclencheur de file d'attente Stockage) : déplacer un message vers la file d'attente de messages incohérents (poison) après 3 tentatives en échec" }
        - id: score
          text: { en: "score (Service Bus queue trigger): move a message to the dead-letter queue after 3 failed attempts", fr: "score (déclencheur de file d'attente Service Bus) : déplacer un message vers la file d'attente de lettres mortes après 3 tentatives en échec" }
        - id: moderate
          text: { en: "moderate (Event Grid trigger): stop redelivering an event 2 hours after it was published", fr: "moderate (déclencheur Event Grid) : arrêter de remettre un événement 2 heures après sa publication" }
    answer:
      mapping: { telemetry: retry, ocr: dequeue, score: delivery, moderate: egpolicy }
    explanation:
      correct:
        en: |
          The runtime retry policy (`fixed_delay` or `exponential_backoff`) applies to Timer, Event Hubs, Cosmos DB and Kafka triggers. A Queue storage trigger moves a message to the poison queue after `maxDequeueCount` attempts, set in host.json. A Service Bus message is dead-lettered by Service Bus after the maximum delivery count of the queue. Event Grid retries according to the event subscription, whose event time-to-live (here 120 minutes) stops the delivery.
        fr: |
          La stratégie de nouvelle tentative du runtime (`fixed_delay` ou `exponential_backoff`) s'applique aux déclencheurs Timer, Event Hubs, Cosmos DB et Kafka. Un déclencheur de file d'attente Stockage déplace un message vers la file d'attente de messages incohérents après `maxDequeueCount` tentatives, défini dans host.json. Un message Service Bus est déplacé vers les lettres mortes par Service Bus après le nombre maximal de remises de la file d'attente. Event Grid réessaie selon l'abonnement aux événements, dont la durée de vie des événements (ici 120 minutes) arrête la remise.
      options:
        lockrenew: { en: "maxAutoLockRenewalDuration only controls how long the runtime renews the lock of a message being processed.", fr: "maxAutoLockRenewalDuration contrôle seulement pendant combien de temps le runtime renouvelle le verrou d'un message en cours de traitement." }
        functimeout: { en: "functionTimeout limits the duration of an execution; it doesn't define retries or dead-lettering.", fr: "functionTimeout limite la durée d'une exécution ; il ne définit ni nouvelles tentatives ni lettres mortes." }
    references:
      - title: Azure Functions Error Handling and Retry Guidance
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-error-pages
      - title: Azure Event Grid Delivery and Retry Explained - Azure Event Grid
        url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
