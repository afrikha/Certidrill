chapter: 22-postgresql
questions:
  # ------------------------------------------------------------------ 1
  - id: ai200-qz-22-01
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Fabrikam plans to store 5 million chunk embeddings in a `vector(768)` column of a table on Azure Database for PostgreSQL flexible server. The embedding model returns single-precision floats.

        Approximately how much storage does the vector column need, before any index is created?
      fr: |
        Fabrikam prévoit de stocker 5 millions d'incorporations de segments dans une colonne `vector(768)` d'une table sur Azure Database for PostgreSQL serveur flexible. Le modèle d'incorporation renvoie des nombres à virgule flottante simple précision.

        Quel espace de stockage la colonne vectorielle demande-t-elle approximativement, avant la création de tout index ?
    body:
      options:
        - { id: a, text: { en: "About 4 GB", fr: "Environ 4 Go" } }
        - { id: b, text: { en: "About 8 GB", fr: "Environ 8 Go" } }
        - { id: c, text: { en: "About 15 GB", fr: "Environ 15 Go" } }
        - { id: d, text: { en: "About 30 GB", fr: "Environ 30 Go" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Each dimension of a `vector` value takes 4 bytes, so a 768-dimension vector takes about 3 KB, and one million of them about 3 GB. Five million vectors need about 15 GB for the column alone; an HNSW index then adds roughly 50 %.
        fr: |
          Chaque dimension d'une valeur `vector` occupe 4 octets : un vecteur de 768 dimensions occupe donc environ 3 Ko, et un million d'entre eux environ 3 Go. Cinq millions de vecteurs demandent environ 15 Go pour la colonne seule ; un index HNSW ajoute ensuite à peu près 50 %.
      options:
        a: { en: "About 4 GB would be less than 1 KB per vector, far below the 4 bytes per dimension of `vector`.", fr: "Environ 4 Go correspondrait à moins de 1 Ko par vecteur, bien en dessous des 4 octets par dimension de `vector`." }
        b: { en: "About 8 GB matches 2 bytes per dimension, which is the size of `halfvec`, not of `vector`.", fr: "Environ 8 Go correspond à 2 octets par dimension, soit la taille de `halfvec`, pas de `vector`." }
        d: { en: "About 30 GB is the size of 5 million 1,536-dimension vectors, twice the dimensions of this model.", fr: "Environ 30 Go est la taille de 5 millions de vecteurs de 1 536 dimensions, le double des dimensions de ce modèle." }
    references:
      - title: Optimize data layout
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout

  # ------------------------------------------------------------------ 2
  - id: ai200-qz-22-02
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware's retrieval API runs in a container app named **ca-rag** in Azure Container Apps. The app uses a user-assigned managed identity named **id-rag-prod**. The Microsoft Entra admin of an Azure Database for PostgreSQL flexible server created a non-admin database role for the identity with `pgaadauth_create_principal`, following the Learn naming rule for managed identities.

        The Python code gets a Microsoft Entra token for the identity with `DefaultAzureCredential` and passes it as the password to `psycopg.connect()`. Which value should the code pass as `user`?
      fr: |
        L'API de récupération de Litware s'exécute dans une application conteneur nommée **ca-rag** dans Azure Container Apps. L'application utilise une identité managée affectée par l'utilisateur nommée **id-rag-prod**. L'administrateur Microsoft Entra d'un serveur flexible Azure Database for PostgreSQL a créé un rôle de base de données non administrateur pour l'identité avec `pgaadauth_create_principal`, en suivant la règle de nommage de Learn pour les identités managées.

        Le code Python obtient un jeton Microsoft Entra pour l'identité avec `DefaultAzureCredential` et le passe comme mot de passe à `psycopg.connect()`. Quelle valeur le code doit-il passer comme `user` ?
    body:
      options:
        - { id: a, text: { en: "The client ID of id-rag-prod", fr: "L'ID client de id-rag-prod" } }
        - { id: b, text: { en: "The object (principal) ID of id-rag-prod", fr: "L'ID d'objet (principal) de id-rag-prod" } }
        - { id: c, text: { en: "The name of the app, ca-rag", fr: "Le nom de l'application, ca-rag" } }
        - { id: d, text: { en: "The display name, id-rag-prod", fr: "Le nom d'affichage, id-rag-prod" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The database role of a Microsoft Entra principal must have the principal's name: the display name for service principals and managed identities. The connection signs in as that role, so `user` is `id-rag-prod`, and the Microsoft Entra token goes in the password.
        fr: |
          Le rôle de base de données d'un principal Microsoft Entra doit porter le nom du principal : le nom d'affichage pour les principaux de service et les identités managées. La connexion s'authentifie avec ce rôle : `user` vaut donc `id-rag-prod`, et le jeton Microsoft Entra va dans le mot de passe.
      options:
        a: { en: "The client ID selects the identity for `DefaultAzureCredential`; the role on the server is named after the display name.", fr: "L'ID client sélectionne l'identité pour `DefaultAzureCredential` ; le rôle sur le serveur porte le nom d'affichage." }
        b: { en: "For managed identities the role is named after the display name, so no role named after the object ID exists.", fr: "Pour les identités managées, le rôle porte le nom d'affichage : aucun rôle ne porte le nom de l'ID d'objet." }
        c: { en: "A user-assigned identity is a separate resource: the token and the role belong to id-rag-prod, not to ca-rag.", fr: "Une identité affectée par l'utilisateur est une ressource distincte : le jeton et le rôle appartiennent à id-rag-prod, pas à ca-rag." }
    references:
      - title: Manage Microsoft Entra Roles in Azure Database for PostgreSQL Flexible Server
        url: https://learn.microsoft.com/en-us/azure/postgresql/security/security-manage-entra-users

  # ------------------------------------------------------------------ 3
  - id: ai200-qz-22-03
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso's support copilot retrieves chunks from Azure Database for PostgreSQL through an HNSW index that uses the default parameters. A new reranking step needs the 100 nearest chunks, so the retrieval query now ends with `ORDER BY embedding <=> %s::vector LIMIT 100`.

        The other queries share the same pooled connections and must keep their current settings. Following Learn guidance, which statement should you run before the query, in the same transaction?
      fr: |
        Le copilote de support de Contoso récupère des segments dans Azure Database for PostgreSQL au moyen d'un index HNSW qui utilise les paramètres par défaut. Une nouvelle étape de reclassement a besoin des 100 segments les plus proches : la requête de récupération se termine donc maintenant par `ORDER BY embedding <=> %s::vector LIMIT 100`.

        Les autres requêtes partagent les mêmes connexions mises en pool et doivent conserver leurs paramètres actuels. Selon les recommandations de Learn, quelle instruction devez-vous exécuter avant la requête, dans la même transaction ?
    body:
      options:
        - { id: a, text: "SET LOCAL ivfflat.probes = 100;" }
        - { id: b, text: "SET LOCAL hnsw.ef_search = 100;" }
        - { id: c, text: "SET LOCAL diskann.l_value_is = 100;" }
        - { id: d, text: "SET LOCAL work_mem = '100MB';" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `hnsw.ef_search` is the size of the candidate list that an HNSW search explores (40 by default), and Learn recommends a value at least as large as the number of results requested by `LIMIT`. `SET LOCAL` applies it to the current transaction only, so the other queries on the pooled connections keep the default.
        fr: |
          `hnsw.ef_search` est la taille de la liste de candidats qu'explore une recherche HNSW (40 par défaut), et Learn recommande une valeur au moins égale au nombre de résultats demandés par `LIMIT`. `SET LOCAL` l'applique uniquement à la transaction en cours : les autres requêtes des connexions mises en pool conservent la valeur par défaut.
      options:
        a: { en: "`ivfflat.probes` tunes IVFFlat indexes; it has no effect on an HNSW index scan.", fr: "`ivfflat.probes` règle les index IVFFlat ; il n'a aucun effet sur une analyse d'index HNSW." }
        c: { en: "`diskann.l_value_is` is the search list size of DiskANN indexes; it doesn't apply to an HNSW index.", fr: "`diskann.l_value_is` est la taille de la liste de recherche des index DiskANN ; il ne s'applique pas à un index HNSW." }
        d: { en: "`work_mem` is the memory of sorts and hashes; it doesn't change how many candidates the HNSW search explores.", fr: "`work_mem` est la mémoire des tris et des hachages ; il ne change pas le nombre de candidats qu'explore la recherche HNSW." }
    references:
      - title: Choose and configure vector indexes
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes

  # ------------------------------------------------------------------ 4
  - id: ai200-qz-22-04
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders backfills the missing embeddings of a `ticket_chunks` table in SQL with the `azure_ai` extension of Azure Database for PostgreSQL flexible server. The embedding model is deployed in Azure OpenAI with the deployment name `emb-small`. The backfill must meet the following requirements:

        - A failed call for one row must not roll back the update of the other rows.
        - Each row gets at most three attempts when Azure OpenAI returns a retryable error.
        - The extension waits 2 seconds between two attempts.

        How should you complete the statement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders complète en SQL les incorporations manquantes d'une table `ticket_chunks` avec l'extension `azure_ai` d'Azure Database for PostgreSQL serveur flexible. Le modèle d'incorporation est déployé dans Azure OpenAI avec le nom de déploiement `emb-small`. Le remplissage doit répondre aux exigences suivantes :

        - Un appel en échec pour une ligne ne doit pas annuler la mise à jour des autres lignes.
        - Chaque ligne bénéficie d'au plus trois tentatives quand Azure OpenAI renvoie une erreur pouvant faire l'objet d'une nouvelle tentative.
        - L'extension attend 2 secondes entre deux tentatives.

        Comment devez-vous compléter l'instruction ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        UPDATE ticket_chunks
        SET embedding = azure_openai.create_embeddings(
                'emb-small', content,
                throw_on_error => [[err]],
                [[attempts]] => 3,
                [[wait]] => 2000)::vector
        WHERE embedding IS NULL;
      slots:
        - id: err
          options:
            - { id: t, text: "true" }
            - { id: f, text: "false" }
        - id: attempts
          options:
            - { id: maxatt, text: max_attempts }
            - { id: batch, text: batch_size }
            - { id: timeout, text: timeout_ms }
        - id: wait
          options:
            - { id: delay, text: retry_delay_ms }
            - { id: timeout, text: timeout_ms }
            - { id: batch, text: batch_size }
    answer:
      values: { err: f, attempts: maxatt, wait: delay }
    explanation:
      correct:
        en: |
          With `throw_on_error` set to `true` (the default), an error throws an exception that rolls back the wrapping transaction, so `false` protects the other rows. `max_attempts` (default 1) sets how many times the extension tries the call on a retryable error, and `retry_delay_ms` (default 1000) is the wait before each new attempt.
        fr: |
          Avec `throw_on_error` défini sur `true` (valeur par défaut), une erreur lève une exception qui annule la transaction englobante : `false` protège donc les autres lignes. `max_attempts` (1 par défaut) fixe le nombre de tentatives de l'appel sur une erreur pouvant faire l'objet d'une nouvelle tentative, et `retry_delay_ms` (1000 par défaut) est l'attente avant chaque nouvelle tentative.
      options:
        t: { en: "`true` makes one failed call raise an exception that rolls back the whole UPDATE.", fr: "`true` fait lever par un seul appel en échec une exception qui annule tout l'UPDATE." }
        batch: { en: "`batch_size` exists only in the overload that takes a `text[]` array, and it sets how many texts are sent per call.", fr: "`batch_size` n'existe que dans la surcharge qui prend un tableau `text[]`, et il fixe le nombre de textes envoyés par appel." }
        timeout: { en: "`timeout_ms` stops the operation after a time limit; it neither counts attempts nor sets the wait between them.", fr: "`timeout_ms` arrête l'opération après un délai ; il ne compte pas les tentatives et ne fixe pas l'attente entre elles." }
    references:
      - title: Generate Vector Embeddings with Azure OpenAI
        url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/generative-ai-azure-openai

  # ------------------------------------------------------------------ 5
  - id: ai200-qz-22-05
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum must build a DiskANN index on a 25-million-row table on an Azure Database for PostgreSQL flexible server that was scaled up for the build. To use more parallel workers, you changed the `max_worker_processes` server parameter from 8 to 16 with `az postgres flexible-server parameter set`, and you raised `max_parallel_maintenance_workers` and the `parallel_workers` storage parameter of the table to 12.

        `SHOW max_worker_processes;` still returns 8, and the build starts fewer workers than expected. What should you do?
      fr: |
        Adatum doit construire un index DiskANN sur une table de 25 millions de lignes d'un serveur flexible Azure Database for PostgreSQL dont la taille a été augmentée pour la construction. Pour utiliser davantage de workers parallèles, vous avez fait passer le paramètre de serveur `max_worker_processes` de 8 à 16 avec `az postgres flexible-server parameter set`, et vous avez porté `max_parallel_maintenance_workers` et le paramètre de stockage `parallel_workers` de la table à 12.

        `SHOW max_worker_processes;` renvoie toujours 8, et la construction démarre moins de workers que prévu. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `SET max_worker_processes = 16` in the session that builds the index.", fr: "Exécuter `SET max_worker_processes = 16` dans la session qui construit l'index." } }
        - { id: b, text: { en: "Open a new session, because the new value applies only to new sessions.", fr: "Ouvrir une nouvelle session, car la nouvelle valeur ne s'applique qu'aux nouvelles sessions." } }
        - { id: c, text: { en: "Restart the server, and then start the index build again.", fr: "Redémarrer le serveur, puis relancer la construction de l'index." } }
        - { id: d, text: { en: "Raise `maintenance_work_mem`, so that the build can start more workers.", fr: "Augmenter `maintenance_work_mem`, afin que la construction puisse démarrer plus de workers." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `max_worker_processes` requires a server restart to take effect, which is why `SHOW` still returns the old value. The parallel workers of an index build come from this pool of background processes, so the build can use 12 workers only after the restart.
        fr: |
          `max_worker_processes` exige un redémarrage du serveur pour prendre effet, c'est pourquoi `SHOW` renvoie toujours l'ancienne valeur. Les workers parallèles d'une construction d'index proviennent de ce pool de processus d'arrière-plan : la construction ne peut donc utiliser 12 workers qu'après le redémarrage.
      options:
        a: { en: "`max_worker_processes` is applied only at server start; a session can't raise it.", fr: "`max_worker_processes` n'est appliqué qu'au démarrage du serveur ; une session ne peut pas l'augmenter." }
        b: { en: "A new session picks up dynamic parameters, but this one keeps its old value until the server restarts.", fr: "Une nouvelle session prend en compte les paramètres dynamiques, mais celui-ci garde son ancienne valeur jusqu'au redémarrage du serveur." }
        d: { en: "`maintenance_work_mem` sets the memory of the build; it doesn't change how many worker processes the server allows.", fr: "`maintenance_work_mem` fixe la mémoire de la construction ; il ne change pas le nombre de processus workers autorisés par le serveur." }
    references:
      - title: Enable and Use DiskANN in Azure Database for PostgreSQL Flexible Server
        url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-use-pgdiskann

  # ------------------------------------------------------------------ 6
  - id: ai200-qz-22-06
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys connects three services to the **kb** database of an Azure Database for PostgreSQL flexible server through the built-in PgBouncer on port 6432. Each service signs in with its own Microsoft Entra role: `rag-api`, `ingest-worker` and `eval-job`. Every service has enough client connections to fill its PgBouncer pool during peaks.

        The `max_connections` server parameter is 600, and 20 of these connections are reserved for administrators. A migration tool also connects directly on port 5432 and can use up to 40 connections at any time.

        You need to set `pgbouncer.default_pool_size` to the largest value that never makes the server reach its connection limit when every pool is full. Which value should you use?
      fr: |
        Tailspin Toys connecte trois services à la base de données **kb** d'un serveur flexible Azure Database for PostgreSQL via le PgBouncer intégré sur le port 6432. Chaque service se connecte avec son propre rôle Microsoft Entra : `rag-api`, `ingest-worker` et `eval-job`. Chaque service a assez de connexions clientes pour remplir son pool PgBouncer pendant les pics.

        Le paramètre de serveur `max_connections` vaut 600, et 20 de ces connexions sont réservées aux administrateurs. Un outil de migration se connecte aussi directement sur le port 5432 et peut utiliser jusqu'à 40 connexions à tout moment.

        Vous devez définir `pgbouncer.default_pool_size` sur la plus grande valeur qui ne fait jamais atteindre au serveur sa limite de connexions quand tous les pools sont pleins. Quelle valeur devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "50" }
        - { id: b, text: "180" }
        - { id: c, text: "193" }
        - { id: d, text: "540" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `pgbouncer.default_pool_size` is the number of server connections allowed per user and database pair, and each role connecting to kb forms its own pair. The server offers 600 − 20 − 40 = 540 connections to PgBouncer, shared by three pools, so each pool can hold at most 540 / 3 = 180 server connections.
        fr: |
          `pgbouncer.default_pool_size` est le nombre de connexions serveur autorisées par paire utilisateur et base de données, et chaque rôle qui se connecte à kb forme sa propre paire. Le serveur offre 600 − 20 − 40 = 540 connexions à PgBouncer, partagées par trois pools : chaque pool peut donc contenir au plus 540 / 3 = 180 connexions serveur.
      options:
        a: { en: "50 is the default; it stays below the limit but isn't the largest value that fits.", fr: "50 est la valeur par défaut ; elle reste sous la limite, mais ce n'est pas la plus grande valeur possible." }
        c: { en: "193 ignores the 40 connections that the migration tool opens directly on port 5432.", fr: "193 ignore les 40 connexions que l'outil de migration ouvre directement sur le port 5432." }
        d: { en: "540 treats the parameter as a total for the server, but it applies to each of the three user and database pairs.", fr: "540 traite le paramètre comme un total pour le serveur, alors qu'il s'applique à chacune des trois paires utilisateur et base de données." }
    references:
      - title: PgBouncer in Azure Database for PostgreSQL Flexible Server
        url: https://learn.microsoft.com/en-us/azure/postgresql/connectivity/concepts-pgbouncer

  # ------------------------------------------------------------------ 7
  - id: ai200-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware stores 90 million interaction embeddings for a recommendation assistant on Azure Database for PostgreSQL flexible server. Most recommendation queries only look at recent months, and rebuilding the single global vector index of the current table takes hours. You redesign the table with monthly partitions as follows:

        ```sql
        CREATE TABLE interactions (
            id         bigint GENERATED ALWAYS AS IDENTITY,
            tenant_id  integer NOT NULL,
            created_at timestamptz NOT NULL,
            embedding  vector(768)
        ) PARTITION BY RANGE (created_at);

        CREATE TABLE interactions_2026_10 PARTITION OF interactions
            FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');
        -- one partition per month

        CREATE INDEX ON interactions USING hnsw (embedding vector_cosine_ops);
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware stocke 90 millions d'incorporations d'interactions pour un assistant de recommandation sur Azure Database for PostgreSQL serveur flexible. La plupart des requêtes de recommandation ne portent que sur les derniers mois, et la reconstruction de l'unique index vectoriel global de la table actuelle prend des heures. Vous reconcevez la table avec des partitions mensuelles comme suit :

        ```sql
        CREATE TABLE interactions (
            id         bigint GENERATED ALWAYS AS IDENTITY,
            tenant_id  integer NOT NULL,
            created_at timestamptz NOT NULL,
            embedding  vector(768)
        ) PARTITION BY RANGE (created_at);

        CREATE TABLE interactions_2026_10 PARTITION OF interactions
            FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');
        -- one partition per month

        CREATE INDEX ON interactions USING hnsw (embedding vector_cosine_ops);
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Each monthly partition gets its own HNSW index, which can be rebuilt without rebuilding the indexes of the other partitions.", fr: "Chaque partition mensuelle reçoit son propre index HNSW, qui peut être reconstruit sans reconstruire les index des autres partitions." }
        - id: s2
          text: { en: "You can add a `PRIMARY KEY (id)` constraint to the interactions table without including `created_at` in it.", fr: "Vous pouvez ajouter une contrainte `PRIMARY KEY (id)` à la table interactions sans y inclure `created_at`." }
        - id: s3
          text: { en: "A query with `WHERE created_at >= '2026-10-01'` scans only the partitions that can contain matching rows.", fr: "Une requête avec `WHERE created_at >= '2026-10-01'` n'analyse que les partitions qui peuvent contenir des lignes correspondantes." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          An index created on a partitioned table creates a matching index on every partition, and each of these indexes can be built or rebuilt independently. A unique or primary key constraint across partitions must include the partition key, so `PRIMARY KEY (id)` alone is refused. Queries that filter on the partition key read only the relevant partitions.
        fr: |
          Un index créé sur une table partitionnée crée un index correspondant sur chaque partition, et chacun de ces index peut être construit ou reconstruit indépendamment. Une contrainte d'unicité ou de clé primaire sur l'ensemble des partitions doit inclure la clé de partition : `PRIMARY KEY (id)` seul est donc refusé. Les requêtes qui filtrent sur la clé de partition ne lisent que les partitions concernées.
      options:
        s2: { en: "Cross-partition unique constraints require the partition key: use `PRIMARY KEY (id, created_at)`.", fr: "Les contraintes d'unicité entre partitions exigent la clé de partition : utilisez `PRIMARY KEY (id, created_at)`." }
    references:
      - title: Optimize data layout
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout

  # ------------------------------------------------------------------ 8
  - id: ai200-qz-22-08
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's internal assistant searches 3 million policy chunks on Azure Database for PostgreSQL through an HNSW index that uses the default settings. A user may see a chunk only when a row of `document_acl` grants one of the user's groups access to its document; about 30 percent of the chunks are visible to a typical user. The current query is:

        ```sql
        SELECT c.id, c.content
        FROM document_chunks AS c
        WHERE EXISTS (SELECT 1 FROM document_acl AS a
                      WHERE a.document_id = c.document_id
                        AND a.group_id = ANY(%(groups)s))
        ORDER BY c.embedding <=> %(q)s::vector
        LIMIT 10;
        ```

        Users often receive fewer than 10 chunks. You need typical users to receive 10 chunks. The search must keep using the HNSW index, and you must not change any server or session parameter.

        How should you rewrite the query?
      fr: |
        L'assistant interne de Woodgrove Bank recherche parmi 3 millions de segments de stratégies sur Azure Database for PostgreSQL au moyen d'un index HNSW qui utilise les paramètres par défaut. Un utilisateur ne peut voir un segment que si une ligne de `document_acl` accorde à l'un de ses groupes l'accès au document ; environ 30 % des segments sont visibles par un utilisateur type. La requête actuelle est la suivante :

        ```sql
        SELECT c.id, c.content
        FROM document_chunks AS c
        WHERE EXISTS (SELECT 1 FROM document_acl AS a
                      WHERE a.document_id = c.document_id
                        AND a.group_id = ANY(%(groups)s))
        ORDER BY c.embedding <=> %(q)s::vector
        LIMIT 10;
        ```

        Les utilisateurs reçoivent souvent moins de 10 segments. Vous devez faire en sorte qu'un utilisateur type reçoive 10 segments. La recherche doit continuer à utiliser l'index HNSW, et vous ne devez modifier aucun paramètre de serveur ni de session.

        Comment devez-vous réécrire la requête ?
    body:
      options:
        - { id: a, text: { en: "A CTE applies the permission filter with `LIMIT 100`; the outer query orders those rows by distance and keeps `LIMIT 10`.", fr: "Une CTE applique le filtre d'autorisation avec `LIMIT 100` ; la requête externe trie ces lignes par distance et conserve `LIMIT 10`." } }
        - { id: b, text: { en: "A CTE orders all chunks by distance with `LIMIT 10`; the outer query applies the permission filter, orders by distance and keeps `LIMIT 10`.", fr: "Une CTE trie tous les segments par distance avec `LIMIT 10` ; la requête externe applique le filtre d'autorisation, trie par distance et conserve `LIMIT 10`." } }
        - { id: c, text: { en: "A CTE orders all chunks by distance with `LIMIT 100`; the outer query applies the permission filter, orders by distance and keeps `LIMIT 10`.", fr: "Une CTE trie tous les segments par distance avec `LIMIT 100` ; la requête externe applique le filtre d'autorisation, trie par distance et conserve `LIMIT 10`." } }
        - { id: d, text: { en: "One query joins `document_acl` instead of using `EXISTS`, orders the rows by distance and keeps `LIMIT 10`.", fr: "Une seule requête joint `document_acl` au lieu d'utiliser `EXISTS`, trie les lignes par distance et conserve `LIMIT 10`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An approximate index explores a fixed number of candidates (40 by default for HNSW) before the filter is applied, so a filter that keeps 30 percent of the rows leaves about 12 of them, and often fewer than 10. The post-filtering pattern fetches more nearest candidates than needed through the index, here 100 (about 30 visible), then filters them, orders them by distance and keeps 10.
        fr: |
          Un index approximatif explore un nombre fixe de candidats (40 par défaut pour HNSW) avant l'application du filtre : un filtre qui conserve 30 % des lignes en laisse environ 12, et souvent moins de 10. Le modèle de post-filtrage récupère par l'index plus de candidats proches que nécessaire, ici 100 (environ 30 visibles), puis les filtre, les trie par distance et en conserve 10.
      options:
        a: { en: "Filtering first returns 100 arbitrary visible chunks, not the nearest ones, and the distance ranking then runs on that arbitrary set.", fr: "Filtrer d'abord renvoie 100 segments visibles quelconques, pas les plus proches, et le classement par distance porte ensuite sur cet ensemble arbitraire." }
        b: { en: "With only 10 candidates, about 3 survive a filter that keeps 30 percent of the rows.", fr: "Avec seulement 10 candidats, environ 3 résistent à un filtre qui conserve 30 % des lignes." }
        d: { en: "A join is still a filter applied to the candidates that the index returns, so the query keeps returning fewer than 10 chunks.", fr: "Une jointure reste un filtre appliqué aux candidats que renvoie l'index : la requête continue donc de renvoyer moins de 10 segments." }
    references:
      - title: Optimize data layout
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/4-optimize-data-layout
      - title: Choose and configure vector indexes
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes

  # ------------------------------------------------------------------ 9
  - id: ai200-qz-22-09
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys shows product suggestions while users type in a shopping assistant. The embeddings come from an OpenAI model and are normalized to length 1. They are stored on Azure Database for PostgreSQL with an HNSW index created with `vector_cosine_ops`, `m = 16` and `ef_construction = 64`.

        Each suggestion request runs `SET LOCAL hnsw.ef_search = 200` and then a query that ends with `ORDER BY embedding <=> %s::vector LIMIT 5`. CPU usage is high and the latency target is missed. Product managers accept a lower recall for suggestions, and a one-time rebuild of the index is acceptable.

        Which two actions reduce the compute cost of each suggestion query? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys affiche des suggestions de produits pendant la saisie des utilisateurs dans un assistant d'achat. Les incorporations proviennent d'un modèle OpenAI et sont normalisées à une longueur de 1. Elles sont stockées sur Azure Database for PostgreSQL avec un index HNSW créé avec `vector_cosine_ops`, `m = 16` et `ef_construction = 64`.

        Chaque demande de suggestion exécute `SET LOCAL hnsw.ef_search = 200` puis une requête qui se termine par `ORDER BY embedding <=> %s::vector LIMIT 5`. L'utilisation du processeur est élevée et l'objectif de latence n'est pas atteint. Les chefs de produit acceptent un rappel plus faible pour les suggestions, et une reconstruction unique de l'index est acceptable.

        Quelles sont les deux actions qui réduisent le coût de calcul de chaque requête de suggestion ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Rebuild the index with `m = 32` and `ef_construction = 128`.", fr: "Reconstruire l'index avec `m = 32` et `ef_construction = 128`." } }
        - { id: b, text: { en: "Run `SET LOCAL hnsw.ef_search = 20` for the suggestion queries.", fr: "Exécuter `SET LOCAL hnsw.ef_search = 20` pour les requêtes de suggestion." } }
        - { id: c, text: { en: "Raise `max_parallel_workers_per_gather` for the suggestion queries.", fr: "Augmenter `max_parallel_workers_per_gather` pour les requêtes de suggestion." } }
        - { id: d, text: { en: "Rebuild the index with `vector_ip_ops`, and order by `embedding <#> %s::vector`.", fr: "Reconstruire l'index avec `vector_ip_ops` et trier par `embedding <#> %s::vector`." } }
        - { id: e, text: { en: "Raise `maintenance_work_mem`, and then rebuild the index concurrently.", fr: "Augmenter `maintenance_work_mem`, puis reconstruire l'index en mode concurrent." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A smaller `hnsw.ef_search` explores fewer candidates per query, trading recall for speed, and 20 still covers the 5 rows of `LIMIT`. For vectors normalized to length 1, such as OpenAI embeddings, inner product gives the same ranking as cosine and Learn recommends it for the best performance; the index must then use `vector_ip_ops` to serve `<#>`.
        fr: |
          Un `hnsw.ef_search` plus petit explore moins de candidats par requête, au prix du rappel, et 20 couvre toujours les 5 lignes de `LIMIT`. Pour des vecteurs normalisés à une longueur de 1, comme les incorporations OpenAI, le produit scalaire donne le même classement que le cosinus et Learn le recommande pour les meilleures performances ; l'index doit alors utiliser `vector_ip_ops` pour servir `<#>`.
      options:
        a: { en: "Larger `m` and `ef_construction` improve recall but make the index bigger and each search heavier, not lighter.", fr: "Des valeurs `m` et `ef_construction` plus grandes améliorent le rappel, mais rendent l'index plus gros et chaque recherche plus lourde, pas plus légère." }
        c: { en: "Parallel workers can speed up exact searches without an index; they add workers instead of reducing the work of an index scan.", fr: "Les workers parallèles peuvent accélérer les recherches exactes sans index ; ils ajoutent des workers au lieu de réduire le travail d'une analyse d'index." }
        e: { en: "`maintenance_work_mem` speeds up index builds; a rebuild with the same parameters doesn't change the cost of each query.", fr: "`maintenance_work_mem` accélère les constructions d'index ; une reconstruction avec les mêmes paramètres ne change pas le coût de chaque requête." }
    references:
      - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
        url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
      - title: Choose and configure vector indexes
        url: https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/3-choose-configure-vector-indexes

  # ------------------------------------------------------------------ 10
  - id: ai200-qz-22-10
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has loaded 4 million review chunks into a table named **review_chunks** on Azure Database for PostgreSQL. The embeddings aren't normalized, and the search query ranks the chunks by cosine distance with the `<=>` operator.

        You choose an IVFFlat index because it must build quickly and use little memory. The writes to the table must continue during the build. The `lists` and `probes` values must follow the Learn starting recommendations for this table size.

        How should you complete the statements? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware a chargé 4 millions de segments d'avis dans une table nommée **review_chunks** sur Azure Database for PostgreSQL. Les incorporations ne sont pas normalisées, et la requête de recherche classe les segments par distance cosinus avec l'opérateur `<=>`.

        Vous choisissez un index IVFFlat, car il doit se construire rapidement et utiliser peu de mémoire. Les écritures dans la table doivent continuer pendant la construction. Les valeurs `lists` et `probes` doivent suivre les recommandations de départ de Learn pour cette taille de table.

        Comment devez-vous compléter les instructions ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE INDEX CONCURRENTLY idx_reviews_embedding
        ON review_chunks USING ivfflat (embedding [[ops]])
        WITH (lists = [[lists]]);

        BEGIN;
        SET LOCAL ivfflat.probes = [[probes]];
        SELECT id, content FROM review_chunks
        ORDER BY embedding <=> %s::vector
        LIMIT 10;
        COMMIT;
      slots:
        - id: ops
          options:
            - { id: cos, text: vector_cosine_ops }
            - { id: ip, text: vector_ip_ops }
            - { id: l2, text: vector_l2_ops }
        - id: lists
          options:
            - { id: l400, text: "400" }
            - { id: l2000, text: "2000" }
            - { id: l4000, text: "4000" }
        - id: probes
          options:
            - { id: p1, text: "1" }
            - { id: p45, text: "45" }
            - { id: p200, text: "200" }
            - { id: p2000, text: "2000" }
    answer:
      values: { ops: cos, lists: l2000, probes: p45 }
    explanation:
      correct:
        en: |
          The operator class must match the query operator, so `<=>` needs `vector_cosine_ops`. Above a million rows, Learn starts with `lists = sqrt(rows)`, here sqrt(4,000,000) = 2,000, and `probes = sqrt(lists)`, about 45. The `rows / 1000` and `lists / 10` rules apply only up to a million rows.
        fr: |
          La classe d'opérateurs doit correspondre à l'opérateur de la requête : `<=>` exige donc `vector_cosine_ops`. Au-delà d'un million de lignes, Learn part de `lists = sqrt(lignes)`, ici sqrt(4 000 000) = 2 000, et de `probes = sqrt(lists)`, soit environ 45. Les règles `lignes / 1000` et `lists / 10` ne s'appliquent que jusqu'à un million de lignes.
      options:
        ip: { en: "`vector_ip_ops` serves `<#>`; with `<=>` in the query, the planner ignores the index. Inner product also ranks like cosine only for normalized vectors.", fr: "`vector_ip_ops` sert `<#>` ; avec `<=>` dans la requête, le planificateur ignore l'index. De plus, le produit scalaire ne classe comme le cosinus que pour des vecteurs normalisés." }
        l2: { en: "`vector_l2_ops` serves the Euclidean operator `<->`, not `<=>`.", fr: "`vector_l2_ops` sert l'opérateur euclidien `<->`, pas `<=>`." }
        l400: { en: "400 doesn't follow either Learn starting rule for this table size.", fr: "400 ne suit aucune des règles de départ de Learn pour cette taille de table." }
        l4000: { en: "4,000 applies the `rows / 1000` rule, which Learn gives only for tables of up to a million rows.", fr: "4 000 applique la règle `lignes / 1000`, que Learn ne donne que pour les tables d'au plus un million de lignes." }
        p1: { en: "With one probe, only the list of the closest cluster center is searched, which gives low recall.", fr: "Avec une seule sonde, seule la liste du centre de cluster le plus proche est parcourue, ce qui donne un rappel faible." }
        p200: { en: "200 applies the `lists / 10` rule, which Learn gives only for tables of up to a million rows.", fr: "200 applique la règle `lists / 10`, que Learn ne donne que pour les tables d'au plus un million de lignes." }
        p2000: { en: "Probing all the lists makes the search exact, and the planner then doesn't use the index.", fr: "Sonder toutes les listes rend la recherche exacte, et le planificateur n'utilise alors plus l'index." }
    references:
      - title: Optimize Performance when Using pgvector in Azure Database for PostgreSQL Flexible Server
        url: https://learn.microsoft.com/en-us/azure/postgresql/extensions/how-to-optimize-performance-pgvector
