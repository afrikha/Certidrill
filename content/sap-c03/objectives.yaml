# SAP-C03 objectives — AWS Certified Solutions Architect - Professional (SAP-C03) Exam Guide
# (no version number or date printed), English Markdown domain pages
# solutions-architect-professional-03-domain1..5.md, checked on 2026-11-19 (domain 1 also read on the
# HTML page: same bullets).
# One group per task statement (title without the "Task n.n:" prefix and final period).
# The SAP-C03 guide has a single "Skill n.n.n" list per task (no "Knowledge of" / "Skills in"
# split): objectives = every skill bullet, in the guide's order, codes <domain>.<task>.<n> = the
# guide's skill numbers. `code` is the stable key referenced by question files and course sections.
# English: verbatim, "Skill n.n.n:" prefix and final periods removed (guide wording kept even where
# AWS names differ elsewhere, e.g. "AWS GuardDuty" in 2.3.2 for Amazon GuardDuty).
# French: NO French guide exists (the fr_fr URLs serve the English text, the fr_fr PDF does not
# open), so ALL French group titles and objectives are our translation, following BRIEF-AWS §6 and
# AWS fr_fr documentation terminology: AWS service and feature names in English (Reserved Instances,
# Savings Plans, Spot Instances, S3 Lifecycle, Multi-AZ, StackSets, Object Lock, Vault Lock,
# Container Insights, Application Signals...); policy = « politique »; health checks =
# « vérifications de l'état »; user pools / identity pools = « groupes d'utilisateurs » /
# « groupes d'identités »; Region = « Région »; English term in brackets where the French is not
# settled (stateless, serverless, durable functions, service mesh, ingress, edge, multi-tenant,
# silo/pool, split-horizon, VPC peering, dual-stack, data lake, permissions boundaries, guardrails,
# landing zones, rightsizing, target tracking, cross-Region inference, chargeback/showback, cost
# categories, split cost allocation, tag policies, rehost/replatform/refactor, snapshot lock,
# steady-state, policy as code, rollback, rolling, circuit breakers, bulkhead); runbooks, mainframes,
# lakehouse, canary and backoff kept in English.
architecture:
- group:
    en: Design architectures built for the cloud
    fr: Concevoir des architectures conçues pour le cloud
  objectives:
  - code: '1.1.1'
    en: Design event-driven architectures that use appropriate messaging patterns such as idempotency, ordering, and delivery guarantees (for example, by using Amazon EventBridge, Amazon SQS FIFO queues and standard queues, Amazon SNS, Amazon Kinesis with partition keys)
    fr: Concevoir des architectures pilotées par les événements qui utilisent des modèles de messagerie appropriés, tels que l'idempotence, l'ordre des messages et les garanties de livraison (par exemple, à l'aide d'Amazon EventBridge, des files d'attente Amazon SQS FIFO et standard, d'Amazon SNS, d'Amazon Kinesis avec des clés de partition)
  - code: '1.1.2'
    en: Design stateless applications that use externalized state management (for example, by using Amazon DynamoDB, Amazon S3, Amazon ElastiCache)
    fr: Concevoir des applications sans état (stateless) dont la gestion de l'état est externalisée (par exemple, à l'aide d'Amazon DynamoDB, d'Amazon S3, d'Amazon ElastiCache)
  - code: '1.1.3'
    en: Design serverless data processing and analysis pipelines (for example, by using Amazon Kinesis Data Streams, AWS Glue, Amazon Athena, AWS Lambda)
    fr: Concevoir des pipelines sans serveur (serverless) de traitement et d'analyse des données (par exemple, à l'aide d'Amazon Kinesis Data Streams, d'AWS Glue, d'Amazon Athena, d'AWS Lambda)
  - code: '1.1.4'
    en: Design multi-step workflows that have durable execution patterns (for example, by using AWS Step Functions, durable Lambda functions)
    fr: Concevoir des flux de travail en plusieurs étapes dotés de modèles d'exécution durable (par exemple, à l'aide d'AWS Step Functions, des fonctions durables Lambda [durable functions])
  - code: '1.1.5'
    en: Implement cross-account and cross-Region event routing patterns that use event buses and event forwarding
    fr: Mettre en œuvre des modèles de routage d'événements entre comptes et entre Régions qui utilisent des bus d'événements et le transfert d'événements
  - code: '1.1.6'
    en: Design container orchestration for microservices by using managed services (for example, Amazon EKS, Amazon ECS, AWS Fargate)
    fr: Concevoir l'orchestration de conteneurs pour des microservices à l'aide de services gérés (par exemple, Amazon EKS, Amazon ECS, AWS Fargate)
  - code: '1.1.7'
    en: Design service mesh architectures that facilitate microservice communication and observability (for example, by using Amazon VPC Lattice, Amazon ECS Service Connect)
    fr: Concevoir des architectures de maillage de services (service mesh) qui facilitent la communication et l'observabilité des microservices (par exemple, à l'aide d'Amazon VPC Lattice, d'Amazon ECS Service Connect)
  - code: '1.1.8'
    en: Manage container images by configuring security scans and lifecycle policies (for example, by using Amazon ECR)
    fr: Gérer les images de conteneur en configurant des analyses de sécurité et des politiques de cycle de vie (par exemple, à l'aide d'Amazon ECR)
  - code: '1.1.9'
    en: Design auto scaling patterns for serverless and containerized workloads (for example, by using Lambda concurrency, Horizontal Pod Autoscaler, Cluster Autoscaler, Amazon ECS service auto scaling, AWS Application Auto Scaling)
    fr: Concevoir des modèles de mise à l'échelle automatique pour les charges de travail sans serveur et conteneurisées (par exemple, à l'aide de la simultanéité Lambda, de Horizontal Pod Autoscaler, de Cluster Autoscaler, de l'auto scaling de service Amazon ECS, d'AWS Application Auto Scaling)
  - code: '1.1.10'
    en: Design ingress patterns and optimize resources for specific usage patterns (for example, Application Load Balancer, Network Load Balancer, AWS Load Balancer Controller, Amazon API Gateway)
    fr: Concevoir des modèles d'entrée du trafic (ingress) et optimiser les ressources pour des modèles d'utilisation spécifiques (par exemple, Application Load Balancer, Network Load Balancer, AWS Load Balancer Controller, Amazon API Gateway)
  - code: '1.1.11'
    en: Design edge architectures to meet latency requirements (for example, by using Amazon CloudFront Functions, Lambda@Edge)
    fr: Concevoir des architectures en périphérie (edge) pour répondre aux exigences de latence (par exemple, à l'aide d'Amazon CloudFront Functions, de Lambda@Edge)
  - code: '1.1.12'
    en: Design architectures that support real-time data processing by using WebSocket and publish-subscribe patterns (for example, by using API Gateway WebSocket APIs)
    fr: Concevoir des architectures qui prennent en charge le traitement des données en temps réel à l'aide de WebSocket et de modèles de publication/abonnement (par exemple, à l'aide des API WebSocket d'API Gateway)
  - code: '1.1.13'
    en: Design multi-tenant architectures that use tenant isolation patterns (for example, siloed or pooled resources, Amazon Cognito tenant context, row-level security, tenant-specific encryption)
    fr: Concevoir des architectures mutualisées (multi-tenant) qui utilisent des modèles d'isolation des locataires (par exemple, ressources cloisonnées [silo] ou mutualisées [pool], contexte de locataire Amazon Cognito, sécurité au niveau des lignes, chiffrement propre à chaque locataire)
- group:
    en: Integrate AI and ML services into architectures
    fr: Intégrer des services d'IA et de ML dans les architectures
  objectives:
  - code: '1.2.1'
    en: Design generative AI integrations for applications, including for multi-account deployment patterns (for example, by using Amazon Bedrock)
    fr: Concevoir des intégrations d'IA générative pour les applications, y compris pour des modèles de déploiement multicomptes (par exemple, à l'aide d'Amazon Bedrock)
  - code: '1.2.2'
    en: Design AI agent architectures that integrate with tools (for example, by using Amazon Bedrock AgentCore, Amazon Bedrock Knowledge Bases)
    fr: Concevoir des architectures d'agents d'IA qui s'intègrent à des outils (par exemple, à l'aide d'Amazon Bedrock AgentCore, d'Amazon Bedrock Knowledge Bases)
  - code: '1.2.3'
    en: Design ML inference architectures (for example, Amazon SageMaker AI endpoints)
    fr: Concevoir des architectures d'inférence ML (par exemple, points de terminaison Amazon SageMaker AI)
  - code: '1.2.4'
    en: Design RAG architectures, including ingestion and retrieval strategies (for example, Amazon Bedrock knowledge bases that use vector stores)
    fr: Concevoir des architectures RAG, y compris les stratégies d'ingestion et de récupération (par exemple, bases de connaissances Amazon Bedrock qui utilisent des magasins vectoriels)
- group:
    en: Design hybrid cloud integration patterns
    fr: Concevoir des modèles d'intégration de cloud hybride
  objectives:
  - code: '1.3.1'
    en: Design hybrid connectivity that provides redundancy and failover capabilities (for example, by using AWS Direct Connect, AWS VPN, AWS Transit Gateway)
    fr: Concevoir une connectivité hybride qui offre des capacités de redondance et de basculement (par exemple, à l'aide d'AWS Direct Connect, d'AWS VPN, d'AWS Transit Gateway)
  - code: '1.3.2'
    en: Design data synchronization strategies for hybrid workloads (for example, by using AWS DataSync, AWS Storage Gateway, AWS Transfer Family)
    fr: Concevoir des stratégies de synchronisation des données pour les charges de travail hybrides (par exemple, à l'aide d'AWS DataSync, d'AWS Storage Gateway, d'AWS Transfer Family)
  - code: '1.3.3'
    en: Design integration patterns to modernize legacy systems by using data transformations (for example, by using API Gateway, Lambda, Amazon MQ)
    fr: Concevoir des modèles d'intégration pour moderniser des systèmes hérités à l'aide de transformations de données (par exemple, à l'aide d'API Gateway, de Lambda, d'Amazon MQ)
  - code: '1.3.4'
    en: Design DNS solutions for hybrid environments (for example, by using Amazon Route 53 Resolver endpoints, Route 53 private hosted zones, split-horizon DNS, conditional forwarding)
    fr: Concevoir des solutions DNS pour les environnements hybrides (par exemple, à l'aide des points de terminaison Amazon Route 53 Resolver, des zones hébergées privées Route 53, du DNS à horizon partagé [split-horizon], du transfert conditionnel)
  - code: '1.3.5'
    en: Design hybrid compute patterns (for example, by using Amazon EKS Anywhere, Amazon ECS Anywhere, AWS Outposts, AWS Local Zones)
    fr: Concevoir des modèles de calcul hybride (par exemple, à l'aide d'Amazon EKS Anywhere, d'Amazon ECS Anywhere, d'AWS Outposts, d'AWS Local Zones)
- group:
    en: Design network architectures
    fr: Concevoir des architectures réseau
  objectives:
  - code: '1.4.1'
    en: Design multi-VPC architectures that provide hybrid and multi-account connectivity (for example, VPC peering, AWS PrivateLink)
    fr: Concevoir des architectures multi-VPC qui offrent une connectivité hybride et multicomptes (par exemple, appairage de VPC [VPC peering], AWS PrivateLink)
  - code: '1.4.2'
    en: Design VPC architectures by using subnet strategies, IP address management, and network segmentation (for example, by using Amazon VPC IP Address Manager [IPAM], public and private subnets)
    fr: Concevoir des architectures VPC à l'aide de stratégies de sous-réseaux, de la gestion des adresses IP et de la segmentation du réseau (par exemple, à l'aide d'Amazon VPC IP Address Manager [IPAM], de sous-réseaux publics et privés)
  - code: '1.4.3'
    en: Design network security architectures that include traffic inspection, traffic filtering, and application layer protection (for example, by using AWS Network Firewall, AWS WAF, Gateway Load Balancers, security groups, network ACLs, VPC Flow Logs)
    fr: Concevoir des architectures de sécurité réseau qui incluent l'inspection du trafic, le filtrage du trafic et la protection de la couche application (par exemple, à l'aide d'AWS Network Firewall, d'AWS WAF, de Gateway Load Balancers, de groupes de sécurité, de listes ACL réseau, de VPC Flow Logs)
  - code: '1.4.4'
    en: Design IPv6 adoption and dual-stack migration strategies
    fr: Concevoir des stratégies d'adoption d'IPv6 et de migration vers la double pile (dual-stack)
  - code: '1.4.5'
    en: Design global traffic routing strategies for multi-Region applications (for example, by using Route 53 routing policies, AWS Global Accelerator)
    fr: Concevoir des stratégies de routage global du trafic pour les applications multi-Régions (par exemple, à l'aide des politiques de routage Route 53, d'AWS Global Accelerator)
- group:
    en: Design data, storage, and database architectures
    fr: Concevoir des architectures de données, de stockage et de bases de données
  objectives:
  - code: '1.5.1'
    en: Design data lake and lakehouse architectures (for example, by using Amazon S3, AWS Lake Formation, Amazon Redshift Spectrum, Apache Iceberg)
    fr: Concevoir des architectures de lac de données (data lake) et de lakehouse (par exemple, à l'aide d'Amazon S3, d'AWS Lake Formation, d'Amazon Redshift Spectrum, d'Apache Iceberg)
  - code: '1.5.2'
    en: Design real-time and batch analytics pipelines (for example, by using Amazon EMR, Amazon Redshift, Amazon Managed Streaming for Apache Kafka [Amazon MSK], Amazon AppFlow)
    fr: Concevoir des pipelines d'analytique en temps réel et par lots (par exemple, à l'aide d'Amazon EMR, d'Amazon Redshift, d'Amazon Managed Streaming for Apache Kafka [Amazon MSK], d'Amazon AppFlow)
  - code: '1.5.3'
    en: Select appropriate database services based on workload requirements such as access patterns, consistency needs, and scalability (for example, Amazon RDS, Amazon Aurora, Amazon DynamoDB, Amazon Redshift)
    fr: Sélectionner les services de base de données appropriés en fonction des exigences de la charge de travail, telles que les modèles d'accès, les besoins de cohérence et l'évolutivité (par exemple, Amazon RDS, Amazon Aurora, Amazon DynamoDB, Amazon Redshift)
  - code: '1.5.4'
    en: Design database scaling solutions to provide high availability (for example, by using read replicas, Amazon Aurora Global Database, Amazon DynamoDB global tables, Amazon RDS Multi-AZ deployments)
    fr: Concevoir des solutions de mise à l'échelle des bases de données pour assurer la haute disponibilité (par exemple, à l'aide de réplicas en lecture, d'Amazon Aurora Global Database, des tables globales Amazon DynamoDB, des déploiements Multi-AZ Amazon RDS)
  - code: '1.5.5'
    en: Design storage architectures based on access patterns and performance requirements (for example, by using Amazon S3, Amazon EBS, Amazon EFS, Amazon FSx)
    fr: Concevoir des architectures de stockage en fonction des modèles d'accès et des exigences de performance (par exemple, à l'aide d'Amazon S3, d'Amazon EBS, d'Amazon EFS, d'Amazon FSx)
  - code: '1.5.6'
    en: Design data caching strategies to optimize performance (for example, by using ElastiCache, DynamoDB Accelerator [DAX])
    fr: Concevoir des stratégies de mise en cache des données pour optimiser les performances (par exemple, à l'aide d'ElastiCache, de DynamoDB Accelerator [DAX])
  - code: '1.5.7'
    en: Design data cataloging and cross-account data sharing patterns (for example, AWS Glue Data Catalog, Lake Formation, AWS Clean Rooms)
    fr: Concevoir des modèles de catalogage des données et de partage des données entre comptes (par exemple, AWS Glue Data Catalog, Lake Formation, AWS Clean Rooms)
security:
- group:
    en: Design identity security architectures
    fr: Concevoir des architectures de sécurité des identités
  objectives:
  - code: '2.1.1'
    en: Implement identity federation by using standard protocols (for example, AWS IAM Identity Center, SAML 2.0, OpenID Connect, System for Cross-domain Identity Management [SCIM])
    fr: Mettre en œuvre la fédération d'identités à l'aide de protocoles standard (par exemple, AWS IAM Identity Center, SAML 2.0, OpenID Connect, System for Cross-domain Identity Management [SCIM])
  - code: '2.1.2'
    en: Design application authentication and authorization solutions (for example, by using Amazon Cognito user pools, identity pools, OAuth 2.0, Amazon EKS Pod Identity)
    fr: Concevoir des solutions d'authentification et d'autorisation des applications (par exemple, à l'aide des groupes d'utilisateurs Amazon Cognito, des groupes d'identités, d'OAuth 2.0, d'Amazon EKS Pod Identity)
  - code: '2.1.3'
    en: Design least-privilege access controls such as cross-account access and temporary credentials (for example, by using IAM roles, IAM policies, permissions boundaries, external IDs, session policies, attribute-based access control [ABAC])
    fr: Concevoir des contrôles d'accès selon le principe du moindre privilège, tels que l'accès entre comptes et les informations d'identification temporaires (par exemple, à l'aide de rôles IAM, de politiques IAM, de limites d'autorisations [permissions boundaries], d'ID externes, de politiques de session, du contrôle d'accès par attributs [ABAC])
  - code: '2.1.4'
    en: Design data perimeter controls and external access validation solutions (for example, by using AWS Identity and Access Management Access Analyzer, VPC endpoint policies, AWS Verified Access)
    fr: Concevoir des contrôles de périmètre de données et des solutions de validation des accès externes (par exemple, à l'aide d'AWS Identity and Access Management Access Analyzer, des politiques de point de terminaison de VPC, d'AWS Verified Access)
  - code: '2.1.5'
    en: Design workload identities for hybrid and multi-cloud environments (for example, by using IAM Roles Anywhere)
    fr: Concevoir des identités de charge de travail pour les environnements hybrides et multicloud (par exemple, à l'aide d'IAM Roles Anywhere)
- group:
    en: Design solutions to implement encryption and key management strategies
    fr: Concevoir des solutions pour mettre en œuvre des stratégies de chiffrement et de gestion des clés
  objectives:
  - code: '2.2.1'
    en: Implement encryption at rest by using customer managed keys and automatic key rotation (for example, by using AWS KMS)
    fr: Mettre en œuvre le chiffrement au repos à l'aide de clés gérées par le client et de la rotation automatique des clés (par exemple, à l'aide d'AWS KMS)
  - code: '2.2.2'
    en: Implement encryption in transit by using certificate management (for example, TLS 1.3, AWS Certificate Manager [ACM], AWS Private CA)
    fr: Mettre en œuvre le chiffrement en transit à l'aide de la gestion des certificats (par exemple, TLS 1.3, AWS Certificate Manager [ACM], AWS Private CA)
  - code: '2.2.3'
    en: Implement dedicated hardware security modules to comply with regulations (for example, AWS CloudHSM)
    fr: Mettre en œuvre des modules de sécurité matériels (HSM) dédiés pour se conformer aux réglementations (par exemple, AWS CloudHSM)
  - code: '2.2.4'
    en: Design post-quantum cryptography strategies (for example, by using AWS KMS with Module-Lattice Digital Signature Algorithm [ML-DSA], Module-Lattice-Based Key-Encapsulation Mechanism [ML-KEM])
    fr: Concevoir des stratégies de cryptographie post-quantique (par exemple, à l'aide d'AWS KMS avec Module-Lattice Digital Signature Algorithm [ML-DSA], Module-Lattice-Based Key-Encapsulation Mechanism [ML-KEM])
- group:
    en: Design multi-account governance and compliance solutions
    fr: Concevoir des solutions de gouvernance et de conformité multicomptes
  objectives:
  - code: '2.3.1'
    en: Design organizational structures that include features such as guardrails, landing zones, and automated account provisioning (for example, by using AWS Organizations, OUs, AWS Control Tower, AWS Control Tower Account Factory)
    fr: Concevoir des structures organisationnelles qui incluent des fonctionnalités telles que les garde-fous (guardrails), les zones d'atterrissage (landing zones) et le provisionnement automatisé des comptes (par exemple, à l'aide d'AWS Organizations, des unités d'organisation [OU], d'AWS Control Tower, d'AWS Control Tower Account Factory)
  - code: '2.3.2'
    en: Implement centralized logging and configuration management solutions, including solutions for AI model invocations and responses (for example, by using AWS CloudTrail organization trails, AWS Config aggregation, AWS GuardDuty, Amazon Security Lake, AWS Security Hub, Amazon CloudWatch Logs)
    fr: Mettre en œuvre des solutions centralisées de journalisation et de gestion de la configuration, y compris pour les invocations et les réponses des modèles d'IA (par exemple, à l'aide des journaux de suivi d'organisation AWS CloudTrail, de l'agrégation AWS Config, d'AWS GuardDuty, d'Amazon Security Lake, d'AWS Security Hub, d'Amazon CloudWatch Logs)
  - code: '2.3.3'
    en: Configure cross-account resource sharing (for example, AWS Resource Access Manager [AWS RAM], AWS Transit Gateway)
    fr: Configurer le partage de ressources entre comptes (par exemple, AWS Resource Access Manager [AWS RAM], AWS Transit Gateway)
  - code: '2.3.4'
    en: Design policy enforcement by using SCPs and RCPs
    fr: Concevoir l'application des politiques à l'aide des SCP et des RCP
  - code: '2.3.5'
    en: Implement automated compliance monitoring (for example, by using AWS Config rules, AWS Security Hub CSPM)
    fr: Mettre en œuvre la surveillance automatisée de la conformité (par exemple, à l'aide des règles AWS Config, d'AWS Security Hub CSPM)
  - code: '2.3.6'
    en: Configure automated vulnerability scanning and patch management (for example, by using Amazon Inspector, AWS Systems Manager Patch Manager)
    fr: Configurer l'analyse automatisée des vulnérabilités et la gestion des correctifs (par exemple, à l'aide d'Amazon Inspector, d'AWS Systems Manager Patch Manager)
- group:
    en: Design architectures to meet compliance requirements
    fr: Concevoir des architectures qui répondent aux exigences de conformité
  objectives:
  - code: '2.4.1'
    en: Design architectures to meet data protection requirements (for example, by implementing encryption, access controls, audit logging)
    fr: Concevoir des architectures qui répondent aux exigences de protection des données (par exemple, en mettant en œuvre le chiffrement, les contrôles d'accès, la journalisation d'audit)
  - code: '2.4.2'
    en: Design solutions to meet regulatory requirements such as data sovereignty controls
    fr: Concevoir des solutions qui répondent aux exigences réglementaires, telles que les contrôles de souveraineté des données
  - code: '2.4.3'
    en: Implement audit trail management for regulated workloads, including for AI services
    fr: Mettre en œuvre la gestion des pistes d'audit pour les charges de travail réglementées, y compris pour les services d'IA
  - code: '2.4.4'
    en: Design data residency controls such as AWS Region-specific deployments and transfer restrictions
    fr: Concevoir des contrôles de résidence des données, tels que les déploiements propres à une Région AWS et les restrictions de transfert
  - code: '2.4.5'
    en: Implement compliance evidence collection and reporting solutions (for example, by using AWS Artifact)
    fr: Mettre en œuvre des solutions de collecte des preuves de conformité et de création de rapports (par exemple, à l'aide d'AWS Artifact)
  - code: '2.4.6'
    en: Implement risk assessment solutions for cloud architectures such as threat modeling and mitigation strategies
    fr: Mettre en œuvre des solutions d'évaluation des risques pour les architectures cloud, telles que la modélisation des menaces et les stratégies d'atténuation
- group:
    en: Design security and responsible AI controls
    fr: Concevoir des contrôles de sécurité et d'IA responsable
  objectives:
  - code: '2.5.1'
    en: Implement content filtering and compliance controls for generative AI services (for example, by using Amazon Bedrock Guardrails)
    fr: Mettre en œuvre le filtrage du contenu et des contrôles de conformité pour les services d'IA générative (par exemple, à l'aide d'Amazon Bedrock Guardrails)
  - code: '2.5.2'
    en: Implement access controls for generative and agentic AI applications (for example, by using Amazon Bedrock AgentCore Identity)
    fr: Mettre en œuvre des contrôles d'accès pour les applications d'IA générative et agentique (par exemple, à l'aide d'Amazon Bedrock AgentCore Identity)
  - code: '2.5.3'
    en: Design human oversight workflows that include approval mechanisms for AI operations (for example, by using AWS Step Functions)
    fr: Concevoir des flux de travail de supervision humaine qui incluent des mécanismes d'approbation pour les opérations d'IA (par exemple, à l'aide d'AWS Step Functions)
cost:
- group:
    en: Design architectures based on AWS pricing models
    fr: Concevoir des architectures basées sur les modèles de tarification AWS
  objectives:
  - code: '3.1.1'
    en: Select appropriate purchase options based on usage patterns, including commitment-based and capacity-based options (for example, provisioned capacity, Reserved Instances, AWS Savings Plans, Spot Instances, On-Demand Instances)
    fr: Sélectionner les options d'achat appropriées en fonction des modèles d'utilisation, y compris les options basées sur un engagement et sur la capacité (par exemple, capacité provisionnée, Reserved Instances, AWS Savings Plans, Spot Instances, On-Demand Instances)
  - code: '3.1.2'
    en: Design cost-optimized architectures to meet workload requirements (for example, by using Graviton-based instances, AWS Step Functions Standard Workflows or Express Workflows, AWS Lambda functions)
    fr: Concevoir des architectures optimisées en coûts qui répondent aux exigences des charges de travail (par exemple, à l'aide d'instances basées sur Graviton, des flux de travail Standard ou Express d'AWS Step Functions, de fonctions AWS Lambda)
  - code: '3.1.3'
    en: Implement rightsizing and scaling strategies based on performance metrics (for example, by using AWS Compute Optimizer, scheduled scaling, target tracking policies, AWS Fargate Spot)
    fr: Mettre en œuvre des stratégies de dimensionnement adapté (rightsizing) et de mise à l'échelle basées sur les métriques de performance (par exemple, à l'aide d'AWS Compute Optimizer, de la mise à l'échelle planifiée, des politiques de suivi de cible [target tracking], d'AWS Fargate Spot)
  - code: '3.1.4'
    en: Optimize costs for AI/ML workloads by selecting the appropriate service tier, implementing batching strategies, and designing caching patterns (for example, by using Amazon Bedrock, Amazon SageMaker AI)
    fr: Optimiser les coûts des charges de travail d'IA/ML en sélectionnant le niveau de service approprié, en mettant en œuvre des stratégies de traitement par lots et en concevant des modèles de mise en cache (par exemple, à l'aide d'Amazon Bedrock, d'Amazon SageMaker AI)
- group:
    en: Optimize data transfer and network costs
    fr: Optimiser les coûts de transfert de données et de réseau
  objectives:
  - code: '3.2.1'
    en: Design content delivery architectures, origin selection strategies, caching strategies, and failover patterns (for example, by using Amazon CloudFront, Amazon CloudFront Origin Shield)
    fr: Concevoir des architectures de diffusion de contenu, des stratégies de sélection de l'origine, des stratégies de mise en cache et des modèles de basculement (par exemple, à l'aide d'Amazon CloudFront, d'Amazon CloudFront Origin Shield)
  - code: '3.2.2'
    en: Optimize data transfer costs by using strategies such as private connectivity, Regional traffic patterns, and inter-Availability Zone/inter-Region strategies (for example, by using VPC endpoints, NAT gateways, Availability Zone-aware architectures)
    fr: Optimiser les coûts de transfert de données à l'aide de stratégies telles que la connectivité privée, les modèles de trafic régionaux et les stratégies entre zones de disponibilité ou entre Régions (par exemple, à l'aide de points de terminaison de VPC, de passerelles NAT, d'architectures qui tiennent compte des zones de disponibilité)
  - code: '3.2.3'
    en: Configure cost-aware, multi-Region data replication (for example, by using Amazon S3 Cross-Region Replication, Amazon DynamoDB global tables)
    fr: Configurer une réplication de données multi-Régions qui tient compte des coûts (par exemple, à l'aide d'Amazon S3 Cross-Region Replication, des tables globales Amazon DynamoDB)
  - code: '3.2.4'
    en: Design cost-effective network architectures (for example, by using AWS Transit Gateway data processing charges, AWS PrivateLink pricing models)
    fr: Concevoir des architectures réseau rentables (par exemple, en tenant compte des frais de traitement des données d'AWS Transit Gateway et des modèles de tarification d'AWS PrivateLink)
  - code: '3.2.5'
    en: Optimize data transfer costs for AI/ML workloads by using strategies such as cross-Region inference routing
    fr: Optimiser les coûts de transfert de données des charges de travail d'IA/ML à l'aide de stratégies telles que le routage de l'inférence entre Régions (cross-Region inference)
- group:
    en: Design cost allocation and visibility solutions
    fr: Concevoir des solutions de répartition et de visibilité des coûts
  objectives:
  - code: '3.3.1'
    en: Design tagging strategies for cost allocation (for example, by using tags for business units, projects, and environments)
    fr: Concevoir des stratégies de balisage pour la répartition des coûts (par exemple, à l'aide de balises pour les unités opérationnelles, les projets et les environnements)
  - code: '3.3.2'
    en: Configure cost reporting and analytics solutions that use detailed billing data (for example, by using AWS Cost Explorer, AWS Cost and Usage Reports)
    fr: Configurer des solutions de rapports et d'analyse des coûts qui utilisent des données de facturation détaillées (par exemple, à l'aide d'AWS Cost Explorer, d'AWS Cost and Usage Reports)
  - code: '3.3.3'
    en: Implement policy-based tagging enforcement for cost allocation (for example, by using SCPs, AWS Config rules, tag policies)
    fr: Mettre en œuvre l'application du balisage par des politiques pour la répartition des coûts (par exemple, à l'aide des SCP, des règles AWS Config, des politiques de balises [tag policies])
  - code: '3.3.4'
    en: Implement chargeback and showback capabilities for cost allocation (for example, by using cost categories, split cost allocation, token usage monitoring for Amazon Bedrock)
    fr: Mettre en œuvre des capacités de refacturation (chargeback) et de présentation des coûts (showback) pour la répartition des coûts (par exemple, à l'aide des catégories de coûts [cost categories], de la répartition fractionnée des coûts [split cost allocation], de la surveillance de l'utilisation des jetons d'Amazon Bedrock)
  - code: '3.3.5'
    en: Configure cost monitoring and alerting solutions that include budget thresholds and anomaly detection (for example, by using AWS Budgets, AWS Cost Anomaly Detection)
    fr: Configurer des solutions de surveillance des coûts et d'alerte qui incluent des seuils budgétaires et la détection des anomalies (par exemple, à l'aide d'AWS Budgets, d'AWS Cost Anomaly Detection)
- group:
    en: Optimize storage and database costs
    fr: Optimiser les coûts de stockage et de base de données
  objectives:
  - code: '3.4.1'
    en: Implement intelligent storage tiering and lifecycle policies (for example, by using Amazon S3 Intelligent-Tiering, S3 Lifecycle policies, S3 Glacier storage classes, Amazon EFS lifecycle policies)
    fr: Mettre en œuvre la hiérarchisation intelligente du stockage et des politiques de cycle de vie (par exemple, à l'aide d'Amazon S3 Intelligent-Tiering, des politiques S3 Lifecycle, des classes de stockage S3 Glacier, des politiques de cycle de vie Amazon EFS)
  - code: '3.4.2'
    en: Optimize block storage costs by selecting appropriate volume types and provisioning appropriate input/output operations per second (IOPS) (for example, Amazon EBS gp3 volumes, EBS gp2 volumes, Provisioned IOPS)
    fr: Optimiser les coûts du stockage en mode bloc en sélectionnant les types de volumes appropriés et en provisionnant un nombre approprié d'opérations d'entrée/sortie par seconde (IOPS) (par exemple, volumes Amazon EBS gp3, volumes EBS gp2, Provisioned IOPS)
  - code: '3.4.3'
    en: Optimize database costs by selecting appropriate capacity modes and reserved capacity (for example, DynamoDB capacity modes, Amazon RDS reserved DB instances, Amazon Aurora serverless, Aurora I/O-Optimized, Database Savings Plans)
    fr: Optimiser les coûts des bases de données en sélectionnant les modes de capacité et la capacité réservée appropriés (par exemple, modes de capacité DynamoDB, instances de base de données réservées Amazon RDS, Amazon Aurora Serverless, Aurora I/O-Optimized, Database Savings Plans)
  - code: '3.4.4'
    en: Implement backup and disaster recovery mechanisms that use cost-optimized retention policies (for example, by using AWS Backup, Amazon Data Lifecycle Manager)
    fr: Mettre en œuvre des mécanismes de sauvegarde et de reprise après sinistre qui utilisent des politiques de conservation optimisées en coûts (par exemple, à l'aide d'AWS Backup, d'Amazon Data Lifecycle Manager)
  - code: '3.4.5'
    en: Design cost-effective observability solutions that include features such as log filtering, metric aggregation, and retention optimization
    fr: Concevoir des solutions d'observabilité rentables qui incluent des fonctionnalités telles que le filtrage des journaux, l'agrégation des métriques et l'optimisation de la conservation
resilience:
- group:
    en: Design migration strategies by using AWS frameworks
    fr: Concevoir des stratégies de migration à l'aide des cadres AWS
  objectives:
  - code: '4.1.1'
    en: Design discovery and portfolio assessment solutions to map dependencies and plan migration waves
    fr: Concevoir des solutions de découverte et d'évaluation du portefeuille pour cartographier les dépendances et planifier les vagues de migration
  - code: '4.1.2'
    en: Implement rehosting strategies (for example, by using AWS Transform MGN [previously known as AWS Application Migration Service], AWS Transform)
    fr: Mettre en œuvre des stratégies de réhébergement (rehost) (par exemple, à l'aide d'AWS Transform MGN [anciennement AWS Application Migration Service], d'AWS Transform)
  - code: '4.1.3'
    en: Design database and data migration strategies (for example, by using AWS Database Migration Service, AWS DataSync)
    fr: Concevoir des stratégies de migration des bases de données et des données (par exemple, à l'aide d'AWS Database Migration Service, d'AWS DataSync)
  - code: '4.1.4'
    en: Design replatforming strategies that use managed services to reduce operational overhead (for example, Amazon RDS, Amazon Aurora, Amazon ECS, AWS Lambda)
    fr: Concevoir des stratégies de changement de plateforme (replatform) qui utilisent des services gérés pour réduire la charge opérationnelle (par exemple, Amazon RDS, Amazon Aurora, Amazon ECS, AWS Lambda)
  - code: '4.1.5'
    en: Implement refactor strategies such as microservices decomposition, serverless adoption, and incremental modernization patterns (for example, strangler fig pattern)
    fr: Mettre en œuvre des stratégies de refactorisation (refactor), telles que la décomposition en microservices, l'adoption du sans serveur et les modèles de modernisation incrémentielle (par exemple, le modèle strangler fig)
  - code: '4.1.6'
    en: Modernize legacy workloads, including mainframes, applications, and databases
    fr: Moderniser les charges de travail héritées, y compris les mainframes, les applications et les bases de données
- group:
    en: Design disaster recovery architectures
    fr: Concevoir des architectures de reprise après sinistre
  objectives:
  - code: '4.2.1'
    en: Design disaster recovery solutions to meet business requirements (for example, RTO, RPO, costs)
    fr: Concevoir des solutions de reprise après sinistre qui répondent aux exigences métier (par exemple, RTO, RPO, coûts)
  - code: '4.2.2'
    en: Configure continuous replication to recover quickly from incidents (for example, by using AWS Elastic Disaster Recovery)
    fr: Configurer la réplication continue pour récupérer rapidement après des incidents (par exemple, à l'aide d'AWS Elastic Disaster Recovery)
  - code: '4.2.3'
    en: Establish disaster recovery assessment and recovery procedures (for example, by using AWS Resilience Hub, AWS Systems Manager runbooks)
    fr: Établir des procédures d'évaluation de la reprise après sinistre et de récupération (par exemple, à l'aide d'AWS Resilience Hub, des runbooks AWS Systems Manager)
  - code: '4.2.4'
    en: Implement multi-Region disaster recovery solutions that include features such as data replication and failover (for example, by using Amazon Route 53 health checks, AWS Global Accelerator, Amazon Application Recovery Controller)
    fr: Mettre en œuvre des solutions de reprise après sinistre multi-Régions qui incluent des fonctionnalités telles que la réplication des données et le basculement (par exemple, à l'aide des vérifications de l'état Amazon Route 53, d'AWS Global Accelerator, d'Amazon Application Recovery Controller)
  - code: '4.2.5'
    en: Establish disaster recovery testing and validation procedures (for example, by using AWS Resilience Hub)
    fr: Établir des procédures de test et de validation de la reprise après sinistre (par exemple, à l'aide d'AWS Resilience Hub)
  - code: '4.2.6'
    en: Implement multi-cluster container strategies to provide high availability and disaster recovery (for example, by using Amazon EKS, Amazon ECS)
    fr: Mettre en œuvre des stratégies de conteneurs multiclusters pour assurer la haute disponibilité et la reprise après sinistre (par exemple, à l'aide d'Amazon EKS, d'Amazon ECS)
- group:
    en: Design solutions to meet business continuity and resiliency requirements
    fr: Concevoir des solutions qui répondent aux exigences de continuité des activités et de résilience
  objectives:
  - code: '4.3.1'
    en: Configure centralized backup governance and cross-account backup policies (for example, by using AWS Backup)
    fr: Configurer une gouvernance centralisée des sauvegardes et des politiques de sauvegarde entre comptes (par exemple, à l'aide d'AWS Backup)
  - code: '4.3.2'
    en: Design failover tests and measure recovery times (for example, by using AWS Fault Injection Service, Amazon Route 53 health checks)
    fr: Concevoir des tests de basculement et mesurer les temps de récupération (par exemple, à l'aide d'AWS Fault Injection Service, des vérifications de l'état Amazon Route 53)
  - code: '4.3.3'
    en: Design technically resilient architectures that have features such as redundancy, fault tolerance, and self-healing capabilities
    fr: Concevoir des architectures techniquement résilientes dotées de fonctionnalités telles que la redondance, la tolérance aux pannes et des capacités d'autoréparation
  - code: '4.3.4'
    en: Protect data against ransomware and accidental deletion (for example, by using Amazon S3 Object Lock, Amazon EBS snapshot lock, AWS Backup Vault Lock)
    fr: Protéger les données contre les rançongiciels et la suppression accidentelle (par exemple, à l'aide d'Amazon S3 Object Lock, du verrouillage des instantanés Amazon EBS [snapshot lock], d'AWS Backup Vault Lock)
  - code: '4.3.5'
    en: Implement chaos engineering with controlled failure scenarios (for example, by using AWS Fault Injection Service experiment templates, steady-state hypotheses)
    fr: Mettre en œuvre l'ingénierie du chaos avec des scénarios de défaillance contrôlés (par exemple, à l'aide des modèles d'expérience AWS Fault Injection Service, d'hypothèses d'état stable [steady-state])
operations:
- group:
    en: Design infrastructure as code
    fr: Concevoir l'infrastructure en tant que code
  objectives:
  - code: '5.1.1'
    en: Implement infrastructure as code by using declarative and imperative approaches (for example, AWS CloudFormation, AWS CDK)
    fr: Mettre en œuvre l'infrastructure en tant que code à l'aide d'approches déclaratives et impératives (par exemple, AWS CloudFormation, AWS CDK)
  - code: '5.1.2'
    en: Design policy as code to perform proactive validation, enforcement, and drift remediation (for example, by using AWS CloudFormation Hooks, AWS CDK aspects, AWS Config rules, SCPs)
    fr: Concevoir des politiques en tant que code (policy as code) pour la validation proactive, l'application et la correction des dérives (par exemple, à l'aide d'AWS CloudFormation Hooks, des aspects AWS CDK, des règles AWS Config, des SCP)
  - code: '5.1.3'
    en: Manage secrets in infrastructure code (for example, by using AWS Secrets Manager, AWS Systems Manager Parameter Store)
    fr: Gérer les secrets dans le code d'infrastructure (par exemple, à l'aide d'AWS Secrets Manager, d'AWS Systems Manager Parameter Store)
  - code: '5.1.4'
    en: Design multi-account and multi-Region infrastructure deployments (for example, by using CloudFormation StackSets)
    fr: Concevoir des déploiements d'infrastructure multicomptes et multi-Régions (par exemple, à l'aide de CloudFormation StackSets)
- group:
    en: Design CI/CD and DevSecOps pipelines
    fr: Concevoir des pipelines CI/CD et DevSecOps
  objectives:
  - code: '5.2.1'
    en: Design CI/CD solutions to orchestrate automated build and deployment pipelines (for example, by using AWS CodePipeline, AWS CodeBuild, AWS CodeDeploy, AWS CodeCommit)
    fr: Concevoir des solutions CI/CD pour orchestrer des pipelines automatisés de génération et de déploiement (par exemple, à l'aide d'AWS CodePipeline, d'AWS CodeBuild, d'AWS CodeDeploy, d'AWS CodeCommit)
  - code: '5.2.2'
    en: Implement security scanning in pipelines to assess vulnerabilities and sign artifacts (for example, by using Amazon Inspector, Amazon ECR image scanning)
    fr: Mettre en œuvre l'analyse de sécurité dans les pipelines pour évaluer les vulnérabilités et signer les artefacts (par exemple, à l'aide d'Amazon Inspector, de l'analyse d'images Amazon ECR)
  - code: '5.2.3'
    en: Configure multi-account and multi-Region deployment pipelines that include features such as role delegation and artifact promotion (for example, by using CodePipeline cross-account deployments)
    fr: Configurer des pipelines de déploiement multicomptes et multi-Régions qui incluent des fonctionnalités telles que la délégation de rôles et la promotion des artefacts (par exemple, à l'aide des déploiements entre comptes de CodePipeline)
  - code: '5.2.4'
    en: Evaluate AI/ML applications and validate outputs (for example, by using Amazon Bedrock Evaluations)
    fr: Évaluer les applications d'IA/ML et valider leurs sorties (par exemple, à l'aide d'Amazon Bedrock Evaluations)
  - code: '5.2.5'
    en: Implement deployment strategies that provide rollback capabilities (for example, blue/green, canary, rolling deployments)
    fr: Mettre en œuvre des stratégies de déploiement qui offrent des capacités de restauration (rollback) (par exemple, déploiements bleu/vert, canary, propagés [rolling])
- group:
    en: Design observability and monitoring solutions
    fr: Concevoir des solutions d'observabilité et de surveillance
  objectives:
  - code: '5.3.1'
    en: Implement observability by collecting metrics, logs, and distributed tracing by using standardized instrumentation (for example, by using Amazon CloudWatch, AWS X-Ray, AWS Distro for OpenTelemetry)
    fr: Mettre en œuvre l'observabilité en collectant des métriques, des journaux et des traces distribuées à l'aide d'une instrumentation standardisée (par exemple, à l'aide d'Amazon CloudWatch, d'AWS X-Ray, d'AWS Distro for OpenTelemetry)
  - code: '5.3.2'
    en: Implement monitoring for containerized applications (for example, by using Amazon ECS, Amazon EKS with Container Insights)
    fr: Mettre en œuvre la surveillance des applications conteneurisées (par exemple, à l'aide d'Amazon ECS, d'Amazon EKS avec Container Insights)
  - code: '5.3.3'
    en: Implement multi-account log aggregation with cross-account subscriptions and centralized archives (for example, by using Amazon CloudWatch Logs subscriptions, Amazon S3 archival storage tiers)
    fr: Mettre en œuvre l'agrégation des journaux multicomptes avec des abonnements entre comptes et des archives centralisées (par exemple, à l'aide des abonnements Amazon CloudWatch Logs, des niveaux de stockage d'archivage Amazon S3)
  - code: '5.3.4'
    en: Configure alerting solutions (for example, by using CloudWatch alarms, Amazon SNS, AWS Systems Manager)
    fr: Configurer des solutions d'alerte (par exemple, à l'aide des alarmes CloudWatch, d'Amazon SNS, d'AWS Systems Manager)
  - code: '5.3.5'
    en: Monitor metrics for AI/ML workloads, including model performance, AI agent performance, inference latency, and model drift
    fr: Surveiller les métriques des charges de travail d'IA/ML, y compris les performances des modèles, les performances des agents d'IA, la latence d'inférence et la dérive des modèles
  - code: '5.3.6'
    en: Design monitoring solutions for the user experience by using strategies such as synthetic transactions and real user monitoring (for example, by using Amazon CloudWatch Synthetics, Amazon CloudWatch RUM)
    fr: Concevoir des solutions de surveillance de l'expérience utilisateur à l'aide de stratégies telles que les transactions synthétiques et la surveillance des utilisateurs réels (par exemple, à l'aide d'Amazon CloudWatch Synthetics, d'Amazon CloudWatch RUM)
  - code: '5.3.7'
    en: Design service-level objectives (SLOs) that have measurable indicators and alerts (for example, by using CloudWatch, CloudWatch Application Signals)
    fr: Concevoir des objectifs de niveau de service (SLO) dotés d'indicateurs mesurables et d'alertes (par exemple, à l'aide de CloudWatch, de CloudWatch Application Signals)
- group:
    en: Design operational automation and resilient systems
    fr: Concevoir l'automatisation opérationnelle et des systèmes résilients
  objectives:
  - code: '5.4.1'
    en: Implement health monitoring, capacity planning, and operational responses (for example, by using CloudWatch alarms, Amazon EventBridge, AWS Systems Manager, Service Quotas)
    fr: Mettre en œuvre la surveillance de l'état, la planification de la capacité et les réponses opérationnelles (par exemple, à l'aide des alarmes CloudWatch, d'Amazon EventBridge, d'AWS Systems Manager, de Service Quotas)
  - code: '5.4.2'
    en: Configure controlled remediation solutions that have safety constraints (for example, circuit breakers, rate limits, bulkhead patterns, retry patterns with exponential backoff)
    fr: Configurer des solutions de correction contrôlées dotées de contraintes de sécurité (par exemple, disjoncteurs [circuit breakers], limites de débit, modèles de cloisonnement [bulkhead], modèles de nouvelles tentatives avec backoff exponentiel)
  - code: '5.4.3'
    en: Configure auto scaling policies that are based on metrics and scheduled scaling policies (for example, target tracking scaling, predictive scaling for Auto Scaling groups)
    fr: Configurer des politiques de mise à l'échelle automatique basées sur des métriques et des politiques de mise à l'échelle planifiée (par exemple, mise à l'échelle avec suivi de cible [target tracking], mise à l'échelle prédictive pour les groupes Auto Scaling)
  - code: '5.4.4'
    en: Design automated failure recovery solutions that use health checks and replacement strategies (for example, by using Auto Scaling health checks, Amazon ECS task replacement, AWS Lambda retry policies)
    fr: Concevoir des solutions automatisées de récupération après défaillance qui utilisent des vérifications de l'état et des stratégies de remplacement (par exemple, à l'aide des vérifications de l'état Auto Scaling, du remplacement des tâches Amazon ECS, des politiques de nouvelles tentatives AWS Lambda)
  - code: '5.4.5'
    en: Configure automated runbooks and incident response procedures for operational tasks such as patching, remediation, and scaling
    fr: Configurer des runbooks automatisés et des procédures de réponse aux incidents pour les tâches opérationnelles telles que l'application des correctifs, la correction et la mise à l'échelle
