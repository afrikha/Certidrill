# SAP-C03 — AWS Certified Solutions Architect – Professional
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified Solutions Architect - Professional (SAP-C03) Exam Guide, HTML pages and Markdown copies under
#     https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03.html
#     (domain pages solutions-architect-professional-03-domain1..5, sap-03-in-scope-services,
#     sap-03-comparison) and the PDF in the same folder.
#     The fr_fr path serves the English text (meta locale en_us) and the fr_fr PDF does not open:
#     no French guide exists.
#   - Certification page: https://aws.amazon.com/certification/certified-solutions-architect-professional/
#     (links to the SAP-C03 guide only, SAP-C02 not mentioned; 180 minutes, 75 questions, multiple
#     choice or multiple response, 300 USD; English, Japanese, Korean, Portuguese (Brazil),
#     Simplified Chinese, Spanish (Latin America); Pearson VUE test center or online proctored).
# Guide version: none printed (no version number, no publication date, no revisions page; the PDF
# only carries "Copyright © 2026") → blueprint.version 'SAP-C03'.
# Comparison page: SAP-C02 in use until November 16, 2026; SAP-C03 in use beginning November 17, 2026.
# Exam facts: 75 questions = 65 scored + 10 unscored (not identified); scaled score 100–1,000,
# pass at 720, compensatory scoring; response types: multiple choice (1 correct of 4) and multiple
# response (2 or more correct of 5 or more, all correct responses required for credit). No case
# study. The guide does not state the duration (180 min from the certification page).
# Unscored questions are not modelled: the mock exam scores all 75 questions.
# Domain weights: share of scored content as published (25 / 25 / 15 / 15 / 20 %).
# difficultyMix: professional level, middle of the target ranges (easy 0.10–0.20,
# medium 0.45–0.55, hard 0.30–0.40); the schema takes one share per level.
certification:
  code: sap-c03
  title: AWS Certified Solutions Architect – Professional
  vendor: AWS
  active: false

blueprint:
  version: 'SAP-C03'
  durationMin: 180
  questionCount: { min: 75, max: 75 }
  passScore: 720
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # dragdrop states the AWS rule too, though this exam has no such question.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing

  # Target share of each question type in an exam (0..1). The real exam has only
  # multiple choice (single) and multiple response (multi).
  typeMix:
    single: { min: 0.78, max: 0.88 }
    multi: { min: 0.12, max: 0.22 }

  difficultyMix: { easy: 0.15, medium: 0.50, hard: 0.35 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 720 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: Whiteboard sketcher, fr: Dessinateur au tableau blanc } }
        - { xp: 150, title: { en: Landing zone planner, fr: Planificateur de landing zone } }
        - { xp: 400, title: { en: Multi-account organizer, fr: Organisateur multicomptes } }
        - { xp: 750, title: { en: Hybrid network designer, fr: Concepteur de réseaux hybrides } }
        - { xp: 1200, title: { en: Associate-level architect, fr: Architecte de niveau associé } }
        - { xp: 1750, title: { en: Migration wave leader, fr: Pilote de vagues de migration } }
        - { xp: 2400, title: { en: Resilience strategist, fr: Stratège de la résilience } }
        - { xp: 3150, title: { en: Cost-at-scale optimizer, fr: Optimiseur des coûts à grande échelle } }
        - { xp: 4000, title: { en: Professional solutions architect, fr: Architecte de solutions professionnel } }
        - { xp: 5000, title: { en: Well-Architected legend, fr: Légende du Well-Architected } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }


domains:
  - code: architecture
    order: 1
    weight: { min: 0.25, max: 0.25 }
    title:
      en: Architecture Design and Implementation Built for the Cloud
      fr: Conception et mise en œuvre d'architectures conçues pour le cloud
  - code: security
    order: 2
    weight: { min: 0.25, max: 0.25 }
    title:
      en: Security, Compliance, and Governance
      fr: Sécurité, conformité et gouvernance
  - code: cost
    order: 3
    weight: { min: 0.15, max: 0.15 }
    title:
      en: Cost-Optimized Architecture Design
      fr: Conception d'architectures optimisées en coûts
  - code: resilience
    order: 4
    weight: { min: 0.15, max: 0.15 }
    title:
      en: Resilience, Migration, and Business Continuity
      fr: Résilience, migration et continuité des activités
  - code: operations
    order: 5
    weight: { min: 0.20, max: 0.20 }
    title:
      en: Operational Excellence and Automation
      fr: Excellence opérationnelle et automatisation
