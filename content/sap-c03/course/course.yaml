# Course manifest: modules, chapter order (the order of this list), titles, reading time
# and AWS documentation references. Sections, their titles and their objectives are read from
# chapters/<id>.<locale>.md (the section markers), never duplicated here.
# One chapter per task statement of the SAP-C03 exam guide (21 task statements, 115 objectives).
# Split (more than 8 objectives, professional level): task 1.1 (13) → 11-event-driven-serverless
# (1.1.1–1.1.5, 1.1.12: messaging, state, pipelines, workflows, event routing, WebSocket) and
# 12-containers-edge-tenancy (1.1.6–1.1.11, 1.1.13: containers, mesh, ECR, scaling, ingress, edge,
# multi-tenancy). Objective assignment: factory/plans/sap-c03.json.
# Course code fences: bash, json, yaml, text only.
version: 1
