id: sapc03-4b-dr-managed-ad-replication
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company runs Windows-based applications on Amazon EC2 and Amazon FSx for Windows File Server in the us-east-1 Region. All the resources are joined to an AWS Managed Microsoft AD directory (Enterprise Edition) in us-east-1. The company has built a warm standby of the applications and file systems in us-west-2. During a DR test that isolated us-east-1, users could not sign in to the standby applications, and the file shares in us-west-2 could not be mounted. The company requires the same domain to be available in us-west-2 without depending on us-east-1, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exécute des applications Windows sur Amazon EC2 et Amazon FSx for Windows File Server dans la Région us-east-1. Toutes les ressources sont jointes à un annuaire AWS Managed Microsoft AD (Enterprise Edition) dans us-east-1. L'entreprise a construit une veille active des applications et des systèmes de fichiers dans us-west-2. Lors d'un test de reprise qui isolait us-east-1, les utilisateurs n'ont pas pu se connecter aux applications de secours, et les partages de fichiers d'us-west-2 n'ont pas pu être montés. L'entreprise exige que le même domaine soit disponible dans us-west-2 sans dépendre d'us-east-1, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a second AWS Managed Microsoft AD directory in us-west-2 with the same domain name, and synchronize the users and groups to it with a scheduled PowerShell script.", fr: "Créer un second annuaire AWS Managed Microsoft AD dans us-west-2 avec le même nom de domaine, et y synchroniser les utilisateurs et les groupes avec un script PowerShell planifié." }
    - id: b
      text: { en: "Use AWS Directory Service directory sharing to make the directory in us-east-1 available to the standby VPC and the FSx file systems in us-west-2.", fr: "Utiliser le partage d'annuaire d'AWS Directory Service pour rendre l'annuaire d'us-east-1 disponible pour le VPC de secours et les systèmes de fichiers FSx d'us-west-2." }
    - id: c
      text: { en: "Add us-west-2 as a replicated Region of the existing directory with multi-Region replication, and have the standby resources use the domain controllers in us-west-2.", fr: "Ajouter us-west-2 comme Région répliquée de l'annuaire existant avec la réplication multi-Régions, et faire utiliser par les ressources de secours les contrôleurs de domaine d'us-west-2." }
    - id: d
      text: { en: "Deploy an AD Connector in us-west-2 that points to the domain controllers of the directory in us-east-1, and join the standby resources through the AD Connector.", fr: "Déployer un AD Connector dans us-west-2 qui pointe vers les contrôleurs de domaine de l'annuaire d'us-east-1, et joindre les ressources de secours par l'AD Connector." }
answer: { optionId: c }
explanation:
  correct:
    en: "Multi-Region replication, available for the Enterprise Edition of AWS Managed Microsoft AD, deploys two domain controllers in the added Region and replicates all directory data, including users, groups, group policies and trusts, under the same directory ID. Services such as FSx for Windows File Server connect to the local domain controllers, and domain controllers in other Regions stay up when one Region has a problem."
    fr: "La réplication multi-Régions, disponible pour l'édition Enterprise d'AWS Managed Microsoft AD, déploie deux contrôleurs de domaine dans la Région ajoutée et réplique toutes les données de l'annuaire, notamment utilisateurs, groupes, stratégies de groupe et approbations, sous le même ID d'annuaire. Des services comme FSx for Windows File Server se connectent aux contrôleurs de domaine locaux, et les contrôleurs des autres Régions restent actifs quand une Région rencontre un problème."
  options:
    a:
      en: "A second directory is a separate domain whose objects have different security identifiers, and a custom synchronization script is ongoing work that AWS replication provides natively."
      fr: "Un second annuaire est un domaine distinct dont les objets ont des identifiants de sécurité différents, et un script de synchronisation personnalisé est un travail permanent que la réplication AWS fournit nativement."
    b:
      en: "Directory sharing gives other AWS accounts access to the directory; it does not place domain controllers in another Region, so the standby still depends on us-east-1."
      fr: "Le partage d'annuaire donne à d'autres comptes AWS l'accès à l'annuaire ; il ne place pas de contrôleurs de domaine dans une autre Région : la veille dépend toujours d'us-east-1."
    d:
      en: "AD Connector is a proxy that forwards requests to existing domain controllers, so authentication in us-west-2 would still fail when us-east-1 is unavailable."
      fr: "AD Connector est un proxy qui transmet les requêtes à des contrôleurs de domaine existants : l'authentification dans us-west-2 échouerait toujours quand us-east-1 est indisponible."
references:
  - title: Configure Multi-Region replication for AWS Managed Microsoft AD
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_configure_multi_region_replication.html
