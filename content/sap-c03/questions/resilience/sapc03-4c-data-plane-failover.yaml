id: sapc03-4c-data-plane-failover
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A brokerage runs its trading portal in us-east-1 with a recovery environment in us-east-2. When us-east-1 is impaired, an operator runs a script that updates the Route 53 records with the ChangeResourceRecordSets API, raises the desired capacity of the us-east-2 Auto Scaling group from 2 to 40 instances, and creates the listener rules on the us-east-2 Application Load Balancer. During the last game day, the runbook took 35 minutes, and the script failed twice because of API errors during the simulated event. The RTO is 10 minutes. The budget allows the recovery Region to run at full capacity at all times. The company wants to follow AWS Well-Architected guidance for recovery actions.

    Which solution will meet these requirements?
  fr: |
    Une société de courtage exécute son portail de négociation dans us-east-1 avec un environnement de reprise dans us-east-2. Quand us-east-1 est dégradée, un opérateur exécute un script qui met à jour les enregistrements Route 53 avec l'API ChangeResourceRecordSets, augmente la capacité souhaitée du groupe Auto Scaling de us-east-2 de 2 à 40 instances et crée les règles d'écouteur de l'Application Load Balancer de us-east-2. Lors du dernier exercice (game day), le runbook a pris 35 minutes et le script a échoué deux fois à cause d'erreurs d'API pendant l'événement simulé. Le RTO est de 10 minutes. Le budget permet à la Région de reprise de fonctionner à pleine capacité en permanence. L'entreprise veut suivre les recommandations AWS Well-Architected pour les actions de récupération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run the same script from a Lambda function in us-east-2 with retries and exponential backoff on every API call, and start it automatically from a CloudWatch alarm."
        fr: "Exécuter le même script depuis une fonction Lambda dans us-east-2 avec des nouvelles tentatives et un backoff exponentiel sur chaque appel d'API, et le démarrer automatiquement depuis une alarme CloudWatch."
    - id: b
      text:
        en: "Convert the script into an AWS Step Functions workflow that runs the three steps in parallel, and lower the TTL of the Route 53 records to 30 seconds."
        fr: "Convertir le script en flux AWS Step Functions qui exécute les trois étapes en parallèle, et réduire la TTL des enregistrements Route 53 à 30 secondes."
    - id: c
      text:
        en: "Run us-east-2 at full capacity with its listener rules already in place, and use Route 53 failover records with health checks so that traffic moves when the primary health check fails."
        fr: "Faire fonctionner us-east-2 à pleine capacité avec ses règles d'écouteur déjà en place, et utiliser des enregistrements de basculement Route 53 avec des vérifications de l'état pour que le trafic bascule quand la vérification principale échoue."
    - id: d
      text:
        en: "Add a warm pool of stopped instances to the us-east-2 Auto Scaling group so that the scale-out from 2 to 40 instances completes faster, and keep the rest of the script."
        fr: "Ajouter un groupe d'instances pré-initialisées (warm pool) arrêtées au groupe Auto Scaling de us-east-2 pour que le passage de 2 à 40 instances soit plus rapide, et conserver le reste du script."
answer: { optionId: c }
explanation:
  correct:
    en: "Well-Architected guidance is to rely on the data plane, not the control plane, during recovery: record changes, scaling actions, and resource creation are control plane operations that can fail or slow down during an event. Pre-provisioned, statically stable capacity and health check evaluation, which runs on the Route 53 data plane, remove those steps from the recovery path."
    fr: "Les recommandations Well-Architected sont de s'appuyer sur le plan de données et non sur le plan de contrôle pendant une récupération : modifier des enregistrements, mettre à l'échelle et créer des ressources sont des opérations du plan de contrôle qui peuvent échouer ou ralentir pendant un incident. Une capacité préprovisionnée et statiquement stable, ainsi que l'évaluation des vérifications de l'état, qui s'exécute sur le plan de données de Route 53, retirent ces étapes du chemin de récupération."
  options:
    a: { en: "Retries make the script more robust, but recovery still depends on three control plane operations during the event.", fr: "Les nouvelles tentatives rendent le script plus robuste, mais la récupération dépend toujours de trois opérations du plan de contrôle pendant l'incident." }
    b: { en: "Parallel steps save some time, but the recovery still depends on record changes, scaling, and resource creation through control plane APIs.", fr: "Des étapes parallèles font gagner du temps, mais la récupération dépend toujours de modifications d'enregistrements, de mise à l'échelle et de créations de ressources par des API du plan de contrôle." }
    d: { en: "A warm pool speeds up launches, but the scale-out, the record update, and the rule creation are still control plane actions performed during the event.", fr: "Un warm pool accélère les lancements, mais la montée en charge, la mise à jour des enregistrements et la création des règles restent des actions du plan de contrôle réalisées pendant l'incident." }
references:
  - title: REL11-BP04 Rely on the data plane and not the control plane during recovery
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_withstand_component_failures_avoid_control_plane.html
