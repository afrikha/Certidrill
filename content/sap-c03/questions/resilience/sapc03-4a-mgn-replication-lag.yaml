id: sapc03-4a-mgn-replication-lag
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company is replicating 300 servers to AWS with AWS Transform MGN over a 10 Gbps AWS Direct Connect connection that is mostly idle. All servers use the default replication settings, including the default t3.small replication server instance type and shared replication servers. Two database servers, each with eight disks, write several hundred megabytes per second, and their replication keeps falling behind. The other servers replicate without lag. CloudWatch shows that the replication servers that the two database servers share with other servers are saturated. The cutover of the databases is planned in three weeks.

    Which actions will reduce the replication lag of the two database servers? (Choose two.)
  fr: |
    Une entreprise réplique 300 serveurs vers AWS avec AWS Transform MGN par une connexion AWS Direct Connect de 10 Gbit/s presque inutilisée. Tous les serveurs utilisent les paramètres de réplication par défaut, y compris le type d'instance par défaut t3.small pour les serveurs de réplication et des serveurs de réplication partagés. Deux serveurs de bases de données, dotés chacun de huit disques, écrivent plusieurs centaines de mégaoctets par seconde, et leur réplication prend sans cesse du retard. Les autres serveurs se répliquent sans retard. CloudWatch montre que les serveurs de réplication que les deux serveurs de bases partagent avec d'autres serveurs sont saturés. Le basculement des bases est prévu dans trois semaines.

    Quelles actions réduiront le retard de réplication des deux serveurs de bases de données ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on Dedicated replication server for the two database servers."
        fr: "Activer Dedicated replication server pour les deux serveurs de bases de données."
    - id: b
      text:
        en: "Turn on Throttle bandwidth for the two database servers so that the shared replication servers serve the other servers first."
        fr: "Activer Throttle bandwidth pour les deux serveurs de bases afin que les serveurs de réplication partagés servent d'abord les autres serveurs."
    - id: c
      text:
        en: "Clear Always use AWS Transform MGN security group and attach a custom security group that opens TCP port 1500."
        fr: "Décocher Always use AWS Transform MGN security group et attacher un groupe de sécurité personnalisé qui ouvre le port TCP 1500."
    - id: d
      text:
        en: "Change the replication server instance type of the two database servers from t3.small to m5.large."
        fr: "Changer le type d'instance des serveurs de réplication des deux serveurs de bases de t3.small à m5.large."
    - id: e
      text:
        en: "Switch the two database servers to agentless snapshot replication through the MGN vCenter Client."
        fr: "Passer les deux serveurs de bases à la réplication sans agent par instantanés avec le client MGN vCenter."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A dedicated replication server gives a very write-intensive source server its own replication server instead of sharing one, at extra EC2 cost. MGN recommends m5.large instead of the default t3.small for servers with fewer than 26 disks that need more capacity, and changing the instance type does not interrupt replication."
    fr: "Un serveur de réplication dédié donne à un serveur source très intensif en écriture son propre serveur de réplication au lieu d'un serveur partagé, moyennant un coût EC2 supplémentaire. MGN recommande m5.large au lieu du t3.small par défaut pour les serveurs de moins de 26 disques qui ont besoin de plus de capacité, et changer le type d'instance n'interrompt pas la réplication."
  options:
    b: { en: "Throttling limits the bandwidth of these servers, which increases their lag instead of reducing it.", fr: "La limitation réduit la bande passante de ces serveurs, ce qui augmente leur retard au lieu de le réduire." }
    c: { en: "The MGN security group already opens TCP 1500 and is recommended; the bottleneck is the saturated replication servers, not the network rules.", fr: "Le groupe de sécurité MGN ouvre déjà le TCP 1500 et il est recommandé ; le goulet d'étranglement est la saturation des serveurs de réplication, pas les règles réseau." }
    e: { en: "Agentless replication is no longer available for new deployments and does not provide continuous replication.", fr: "La réplication sans agent n'est plus disponible pour les nouveaux déploiements et n'offre pas de réplication continue." }
references:
  - title: Replication template reference
    url: https://docs.aws.amazon.com/mgn/latest/ug/replication-server-settings.html
