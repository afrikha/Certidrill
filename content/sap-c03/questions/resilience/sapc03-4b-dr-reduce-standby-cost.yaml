id: sapc03-4b-dr-reduce-standby-cost
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a claims-processing application in the us-east-1 Region on 12 Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with an Amazon Aurora PostgreSQL database. For disaster recovery, the us-west-2 Region runs a full-size copy: an Auto Scaling group with 12 running instances and the secondary cluster of an Aurora global database with two large DB instances. A recent business impact analysis set the objectives for this application to an RPO of 5 minutes and an RTO of 2 hours, and confirmed that the application must survive the loss of us-east-1. The operations team has measured that launching the fleet and resizing DB instances in us-west-2 takes less than 1 hour. Management wants to reduce the cost of the recovery Region as much as possible while still meeting the objectives.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute une application de traitement des sinistres dans la Région us-east-1 sur 12 instances Amazon EC2 dans un Auto Scaling group derrière un Application Load Balancer, avec une base de données Amazon Aurora PostgreSQL. Pour la reprise après sinistre, la Région us-west-2 exécute une copie de taille complète : un Auto Scaling group avec 12 instances en fonctionnement et le cluster secondaire d'une base de données globale Aurora avec deux grandes instances de base de données. Une récente analyse d'impact sur l'activité a fixé pour cette application un RPO de 5 minutes et un RTO de 2 heures, et a confirmé que l'application doit survivre à la perte d'us-east-1. L'équipe d'exploitation a mesuré que lancer la flotte et redimensionner les instances de base de données dans us-west-2 prend moins d'une heure. La direction veut réduire autant que possible le coût de la Région de reprise tout en respectant les objectifs.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Set the minimum and desired capacity of the us-west-2 Auto Scaling group to zero, keep its launch template and AMIs current, and scale it out in the failover procedure.", fr: "Définir à zéro la capacité minimale et souhaitée de l'Auto Scaling group d'us-west-2, maintenir à jour son modèle de lancement et ses AMI, et le mettre à l'échelle dans la procédure de basculement." }
    - id: b
      text: { en: "Replace the Aurora global database with AWS Backup snapshots of the cluster taken every hour and copied to a backup vault in us-west-2.", fr: "Remplacer la base de données globale Aurora par des instantanés AWS Backup du cluster pris toutes les heures et copiés vers un coffre de sauvegarde dans us-west-2." }
    - id: c
      text: { en: "Move the standby environment to a second Availability Zone in us-east-1 and remove the resources in us-west-2.", fr: "Déplacer l'environnement de secours vers une seconde zone de disponibilité d'us-east-1 et supprimer les ressources d'us-west-2." }
    - id: d
      text: { en: "Reduce the secondary cluster in us-west-2 to a single smaller DB instance, and modify its instance class after a global database failover.", fr: "Réduire le cluster secondaire d'us-west-2 à une seule instance de base de données plus petite, et modifier sa classe d'instance après un basculement de la base globale." }
    - id: e
      text: { en: "Replace the Aurora global database with Aurora Backtrack configured with a 72-hour window on the primary cluster in us-east-1.", fr: "Remplacer la base de données globale Aurora par Aurora Backtrack configuré avec une fenêtre de 72 heures sur le cluster principal d'us-east-1." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With a 2-hour RTO and a measured scale-out of less than 1 hour, the recovery Region can move from a full-size copy to a pilot light. Compute can stay at zero capacity until failover, and the Aurora global database keeps replicating at the storage layer with an RPO of seconds whatever the size of the secondary DB instances, so a single small instance resized after failover keeps the 5-minute RPO."
    fr: "Avec un RTO de 2 heures et une montée en charge mesurée à moins d'une heure, la Région de reprise peut passer d'une copie complète à une veilleuse (pilot light). Le calcul peut rester à capacité nulle jusqu'au basculement, et la base de données globale Aurora continue de répliquer au niveau du stockage avec un RPO de quelques secondes quelle que soit la taille des instances secondaires : une seule petite instance redimensionnée après le basculement conserve le RPO de 5 minutes."
  options:
    b:
      en: "Hourly snapshots give an RPO of up to 1 hour, which breaks the 5-minute RPO."
      fr: "Des instantanés horaires donnent un RPO pouvant atteindre 1 heure, ce qui ne respecte pas le RPO de 5 minutes."
    c:
      en: "A second Availability Zone in the same Region does not survive the loss of us-east-1, which the business impact analysis requires."
      fr: "Une seconde zone de disponibilité dans la même Région ne survit pas à la perte d'us-east-1, ce qu'exige l'analyse d'impact."
    e:
      en: "Backtrack rewinds the same cluster in place; it provides no copy outside us-east-1 and offers no protection against a Regional failure."
      fr: "Backtrack fait revenir en arrière le même cluster sur place ; il ne fournit aucune copie hors d'us-east-1 et ne protège pas contre une panne régionale."
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Using switchover or failover in an Amazon Aurora global database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
