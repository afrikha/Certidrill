id: sapc03-4b-arh-sop-as-code
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company assessed its checkout application with AWS Resilience Hub. The assessment includes operational recommendations for standard operating procedures (SOPs), such as restoring the database from a backup and scaling out the compute tier. Today the recovery steps exist only as notes on a wiki, and nobody has run them in a year. The company requires the SOPs to be version-controlled and deployed together with the application infrastructure. The SOPs must also be tested regularly to prove that they work, with as little custom tooling as possible.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise d'e-commerce a évalué son application de paiement avec AWS Resilience Hub. L'évaluation comporte des recommandations d'exploitation pour des procédures opérationnelles standard (SOP), comme la restauration de la base de données à partir d'une sauvegarde et la montée en charge du niveau de calcul. Aujourd'hui, les étapes de reprise n'existent que sous forme de notes sur un wiki, et personne ne les a exécutées depuis un an. L'entreprise exige que les SOP soient versionnées et déployées en même temps que l'infrastructure de l'application. Les SOP doivent aussi être testées régulièrement pour prouver qu'elles fonctionnent, avec le moins d'outillage personnalisé possible.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Generate the CloudFormation template for the SOP recommendations in Resilience Hub, and add it to the application repository so that the pipeline deploys the SOP resources with the application.", fr: "Générer dans Resilience Hub le modèle CloudFormation des recommandations de SOP, et l'ajouter au dépôt de l'application afin que le pipeline déploie les ressources des SOP avec l'application." }
    - id: b
      text: { en: "Keep the SOP steps on the wiki, and add a link to the relevant wiki page in the description of each CloudWatch alarm that triggers a recovery.", fr: "Conserver les étapes des SOP sur le wiki, et ajouter un lien vers la page wiki correspondante dans la description de chaque alarme CloudWatch qui déclenche une reprise." }
    - id: c
      text: { en: "Run the AWS FIS experiments that Resilience Hub provides for the SOPs, which inject the failure and call the SSM Automation documents, on a regular schedule.", fr: "Exécuter de manière planifiée les expériences AWS FIS que Resilience Hub fournit pour les SOP, qui injectent la panne et appellent les documents SSM Automation." }
    - id: d
      text: { en: "Rewrite each SOP as a Lambda function that an EventBridge rule invokes when the matching alarm fires, and remove the SSM documents from the application.", fr: "Réécrire chaque SOP sous forme de fonction Lambda invoquée par une règle EventBridge quand l'alarme correspondante se déclenche, et retirer les documents SSM de l'application." }
    - id: e
      text: { en: "Attach the SSM Automation documents as AWS Config remediation actions for the resources of the application, and rely on Config evaluations to run them.", fr: "Associer les documents SSM Automation comme actions de correction AWS Config aux ressources de l'application, et compter sur les évaluations Config pour les exécuter." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Resilience Hub delivers operational recommendations as CloudFormation templates; for an SOP the template contains the IAM role to run it, an SSM parameter that points to the SSM Automation document, and an AWS FIS experiment to test it. Adding the template and any customized SSM documents to the code base deploys the latest SOP with every release, and running the provided FIS experiments regularly proves that the SOP does its job."
    fr: "Resilience Hub fournit les recommandations d'exploitation sous forme de modèles CloudFormation ; pour une SOP, le modèle contient le rôle IAM pour l'exécuter, un paramètre SSM qui désigne le document SSM Automation et une expérience AWS FIS pour la tester. Ajouter le modèle et les documents SSM personnalisés au code déploie la SOP la plus récente à chaque version, et exécuter régulièrement les expériences FIS fournies prouve que la SOP fait son travail."
  options:
    b:
      en: "Wiki pages are neither deployed with the infrastructure nor executable, so they cannot be tested automatically."
      fr: "Les pages wiki ne sont ni déployées avec l'infrastructure ni exécutables : elles ne peuvent pas être testées automatiquement."
    d:
      en: "Rewriting SOPs as Lambda functions is custom tooling, and it drops the SSM documents and FIS experiments that Resilience Hub generates and tests."
      fr: "Réécrire les SOP en fonctions Lambda est de l'outillage personnalisé, et cela abandonne les documents SSM et les expériences FIS que Resilience Hub génère et teste."
    e:
      en: "Config remediation corrects noncompliant configurations; it does not recover the application from an outage, and it does not test that the SOPs meet the recovery objectives."
      fr: "Les corrections Config rectifient des configurations non conformes ; elles ne rétablissent pas l'application après une panne et ne testent pas que les SOP respectent les objectifs de reprise."
references:
  - title: Managing standard operating procedures
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/sops.html
  - title: Reviewing operational recommendations
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/ops.reqs.html
