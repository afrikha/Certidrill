id: sapc03-4a-microservice-boundaries
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company has migrated a monolithic order management application to Amazon EC2 and now plans to decompose it into microservices. The application has grown for 15 years, and its domain boundaries are unclear. A first attempt split the code into a UI service, a business logic service and a data access service, and every change still required coordinated releases of all three services. The company wants teams to release their services independently and to choose the database that fits each service. It also wants to avoid costly rework caused by premature decomposition.

    Which practices should the architects follow? (Choose two.)
  fr: |
    Une entreprise de distribution a migré une application monolithique de gestion des commandes vers Amazon EC2 et prévoit maintenant de la décomposer en microservices. L'application a grandi pendant 15 ans, et ses frontières de domaine sont floues. Une première tentative a découpé le code en un service d'interface, un service de logique métier et un service d'accès aux données, et chaque modification exigeait encore des publications coordonnées des trois services. L'entreprise veut que les équipes publient leurs services de façon indépendante et choisissent la base de données adaptée à chaque service. Elle veut aussi éviter les reprises coûteuses causées par une décomposition prématurée.

    Quelles pratiques les architectes doivent-ils suivre ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Identify service boundaries with domain-driven design and event storming before extracting any service."
        fr: "Identifier les frontières des services avec la conception pilotée par le domaine et l'event storming avant d'extraire un service."
    - id: b
      text:
        en: "Split the services by technical layer again, but deploy each layer in its own AWS account."
        fr: "Découper à nouveau les services par couche technique, mais déployer chaque couche dans son propre compte AWS."
    - id: c
      text:
        en: "Give each microservice ownership of its own data store, and let other services access the data only through its API or events."
        fr: "Donner à chaque microservice la propriété de son propre magasin de données, et ne laisser les autres services accéder aux données que par son API ou ses événements."
    - id: d
      text:
        en: "Keep one shared database schema for all microservices so that no data synchronization is ever needed."
        fr: "Conserver un schéma de base de données unique et partagé par tous les microservices pour n'avoir jamais besoin de synchroniser des données."
    - id: e
      text:
        en: "Decompose the whole application into microservices in one release before moving any traffic to them."
        fr: "Décomposer toute l'application en microservices en une seule publication avant de leur envoyer du trafic."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "When the domain is unclear, domain-driven design and event storming help find natural service boundaries and avoid costly premature decomposition. Services that own their data and expose it only through APIs or events can be released independently, and each can use a purpose-built database (polyglot persistence)."
    fr: "Quand le domaine est flou, la conception pilotée par le domaine et l'event storming aident à trouver des frontières naturelles entre services et à éviter une décomposition prématurée coûteuse. Des services propriétaires de leurs données, qu'ils exposent uniquement par des API ou des événements, peuvent être publiés de façon indépendante, et chacun peut utiliser une base adaptée (persistance polyglotte)."
  options:
    b: { en: "Layer-based services still change together for every feature; separate accounts do not remove that coupling.", fr: "Des services découpés par couche changent toujours ensemble pour chaque fonctionnalité ; des comptes séparés ne suppriment pas ce couplage." }
    d: { en: "A shared schema couples all services, prevents independent releases and rules out choosing a database per service.", fr: "Un schéma partagé couple tous les services, empêche les publications indépendantes et interdit de choisir une base par service." }
    e: { en: "A one-release decomposition is a big-bang rewrite, the riskiest option, instead of an incremental modernization.", fr: "Une décomposition en une seule publication est une réécriture de type big-bang, l'option la plus risquée, au lieu d'une modernisation incrémentielle." }
references:
  - title: Strangler fig pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/strangler-fig.html
