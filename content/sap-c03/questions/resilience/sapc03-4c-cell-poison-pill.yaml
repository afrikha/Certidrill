id: sapc03-4c-cell-poison-pill
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A B2B SaaS provider serves 4,000 tenants from a single stack in one AWS Region: one Amazon API Gateway REST API, one Amazon ECS service, and one Aurora cluster, all deployed across three Availability Zones. Twice this year, a malformed request from a single tenant triggered a bug that crashed every task of the ECS service, and all tenants lost access. In another incident, a faulty release reached every tenant at the same moment. Leadership wants a failure of this kind to affect only a small fraction of tenants. Customers must keep a single API endpoint, and the platform must grow by adding capacity units of a known, tested size.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS B2B sert 4 000 locataires depuis une pile unique dans une Région AWS : une API REST Amazon API Gateway, un service Amazon ECS et un cluster Aurora, tous déployés sur trois zones de disponibilité. Deux fois cette année, une requête malformée d'un seul locataire a déclenché un bogue qui a fait planter toutes les tâches du service ECS, et tous les locataires ont perdu l'accès. Lors d'un autre incident, une version défectueuse a atteint tous les locataires au même moment. La direction veut qu'une panne de ce type n'affecte qu'une petite fraction des locataires. Les clients doivent conserver un point de terminaison d'API unique, et la plateforme doit croître en ajoutant des unités de capacité d'une taille connue et testée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Scale the ECS service to three times the peak capacity, add Aurora Replicas in every Availability Zone, and turn on the ECS deployment circuit breaker with rollback."
        fr: "Dimensionner le service ECS à trois fois la capacité de pointe, ajouter des réplicas Aurora dans chaque zone de disponibilité, et activer le disjoncteur de déploiement ECS avec restauration."
    - id: b
      text:
        en: "Deploy a copy of the stack in a second Region in an active-active design, and route each tenant to the closest Region with Route 53 latency-based routing records."
        fr: "Déployer une copie de la pile dans une deuxième Région selon une conception active-active, et diriger chaque locataire vers la Région la plus proche avec des enregistrements Route 53 de routage fondé sur la latence."
    - id: c
      text:
        en: "Split the platform into independent cells of capped size, each serving the tenants that a thin routing layer maps to it by tenant ID, and deploy releases cell by cell."
        fr: "Découper la plateforme en cellules indépendantes de taille plafonnée, chacune servant les locataires qu'une couche de routage simple lui associe par ID de locataire, et déployer les versions cellule par cellule."
    - id: d
      text:
        en: "Create API Gateway usage plans with per-tenant throttling limits, and add AWS WAF rate-based rules that block tenants whose request rate exceeds their plan."
        fr: "Créer des plans d'utilisation API Gateway avec des limites de requêtes par locataire, et ajouter des règles AWS WAF basées sur le débit qui bloquent les locataires dont le débit dépasse leur plan."
answer: { optionId: c }
explanation:
  correct:
    en: "In a cell-based architecture, each cell is an independent copy of the workload that shares no state with other cells and serves a subset of requests selected by a partition key such as the tenant ID. A poison pill request or a bad deployment is then contained to one cell, the thin router keeps a single endpoint, and the platform grows by adding cells of a maximum, load-tested size."
    fr: "Dans une architecture cellulaire, chaque cellule est une copie indépendante de la charge de travail qui ne partage aucun état avec les autres et sert un sous-ensemble des requêtes choisi par une clé de partition comme l'ID de locataire. Une requête empoisonnée (poison pill) ou un mauvais déploiement reste alors confiné à une cellule, le routeur simple conserve un point de terminaison unique, et la plateforme croît en ajoutant des cellules d'une taille maximale testée en charge."
  options:
    a: { en: "More capacity doesn't help when one malformed request crashes every task, and all tenants still share the same service and database.", fr: "Plus de capacité n'aide pas quand une seule requête malformée fait planter toutes les tâches, et tous les locataires partagent toujours le même service et la même base." }
    b: { en: "The same malformed request or release would crash both Regions, and the design doesn't create capacity units of a known size.", fr: "La même requête malformée ou la même version ferait planter les deux Régions, et la conception ne crée pas d'unités de capacité de taille connue." }
    d: { en: "Throttling limits request volume, but a single malformed request within the limit still crashes the shared service for everyone.", fr: "La limitation agit sur le volume de requêtes, mais une seule requête malformée sous la limite fait toujours planter le service partagé pour tout le monde." }
references:
  - title: REL10-BP03 Use bulkhead architectures to limit scope of impact
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_fault_isolation_use_bulkhead.html
