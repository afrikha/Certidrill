id: sapc03-4a-datasync-private-nfs
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research institute must migrate 400 TB of data from an on-premises NFS file server to Amazon S3 for analytics. The institute has an AWS Direct Connect connection with a private virtual interface to a VPC in the target Region. Security policy forbids sending research data over the public internet. Researchers keep writing to the NFS file server until the cutover, so the transfers must be incremental. The team wants a managed, scheduled transfer service that verifies data integrity, without writing copy scripts.

    Which solution will meet these requirements?
  fr: |
    Un institut de recherche doit migrer 400 To de données d'un serveur de fichiers NFS sur site vers Amazon S3 pour des analyses. L'institut dispose d'une connexion AWS Direct Connect avec une interface virtuelle privée vers un VPC de la Région cible. La politique de sécurité interdit d'envoyer des données de recherche par l'internet public. Les chercheurs continuent d'écrire sur le serveur NFS jusqu'au basculement : les transferts doivent donc être incrémentiels. L'équipe veut un service de transfert géré et planifié qui vérifie l'intégrité des données, sans écrire de scripts de copie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy an AWS DataSync agent activated with a VPC service endpoint reached over Direct Connect, and run scheduled tasks from an NFS location to an S3 location that copy only changed data and verify it."
        fr: "Déployer un agent AWS DataSync activé avec un point de terminaison de service VPC joint par Direct Connect, puis exécuter des tâches planifiées d'un emplacement NFS vers un emplacement S3 qui ne copient que les données modifiées et les vérifient."
    - id: b
      text:
        en: "Deploy an Amazon S3 File Gateway on premises with a public service endpoint, mount its NFS share on a Linux server, and copy the data with scheduled rsync jobs until the cutover."
        fr: "Déployer une passerelle Amazon S3 File Gateway sur site avec un point de terminaison de service public, monter son partage NFS sur un serveur Linux, puis copier les données par des tâches rsync planifiées jusqu'au basculement."
    - id: c
      text:
        en: "Create an AWS Transfer Family SFTP server with a VPC endpoint reached over Direct Connect, and have the storage administrators push the changed files with scheduled SFTP scripts that compare checksums until the cutover."
        fr: "Créer un serveur SFTP AWS Transfer Family avec un point de terminaison VPC joint par Direct Connect, et faire envoyer les fichiers modifiés par les administrateurs du stockage avec des scripts SFTP planifiés qui comparent les sommes de contrôle jusqu'au basculement."
    - id: d
      text:
        en: "Copy the data to portable drives, upload it to Amazon S3 at an AWS Data Transfer Terminal, and synchronize the later changes with aws s3 sync commands over the internet connection."
        fr: "Copier les données sur des disques portables, les charger dans Amazon S3 dans un AWS Data Transfer Terminal, puis synchroniser les modifications ultérieures avec des commandes aws s3 sync par la connexion internet."
answer: { optionId: a }
explanation:
  correct:
    en: "A DataSync agent activated with a VPC service endpoint sends data through AWS PrivateLink with private IP addresses, which Direct Connect extends to the data center. DataSync tasks can run on a schedule, transfer only changed data and verify what they transfer, with no scripts to maintain."
    fr: "Un agent DataSync activé avec un point de terminaison de service VPC envoie les données par AWS PrivateLink avec des adresses IP privées, que Direct Connect étend jusqu'au centre de données. Les tâches DataSync peuvent être planifiées, ne transférer que les données modifiées et vérifier ce qu'elles transfèrent, sans script à maintenir."
  options:
    b: { en: "A public service endpoint sends the data over the internet, and rsync jobs are copy scripts that the team must write and monitor.", fr: "Un point de terminaison de service public envoie les données par internet, et les tâches rsync sont des scripts de copie que l'équipe doit écrire et surveiller." }
    c: { en: "Transfer Family is meant for partner file exchanges over SFTP, FTPS or FTP; pushing 400 TB with custom scripts provides no managed incremental sync.", fr: "Transfer Family sert aux échanges de fichiers avec des partenaires en SFTP, FTPS ou FTP ; envoyer 400 To par des scripts personnalisés n'offre aucune synchronisation incrémentielle gérée." }
    d: { en: "Synchronizing the changes with aws s3 sync over the internet breaks the security policy and relies on scripts.", fr: "Synchroniser les modifications avec aws s3 sync par internet enfreint la politique de sécurité et repose sur des scripts." }
references:
  - title: Choosing a service endpoint for your AWS DataSync agent
    url: https://docs.aws.amazon.com/datasync/latest/userguide/choose-service-endpoint.html
