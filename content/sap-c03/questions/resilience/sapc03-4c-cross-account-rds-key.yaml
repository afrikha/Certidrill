id: sapc03-4c-cross-account-rds-key
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company runs its workloads in 25 accounts in AWS Organizations. A backup policy creates daily backups in each account and copies them to a vault named central-vault in a dedicated backup account in the same AWS Region. Cross-account backup is turned on in the management account. central-vault is encrypted with a customer managed AWS KMS key, and its vault access policy allows backup:CopyIntoBackupVault for principals whose aws:PrincipalOrgID matches the organization. Copies of Amazon EFS file systems succeed in every account. Copies of Amazon RDS for PostgreSQL DB instances fail in every account. The DB instances are encrypted with the AWS managed key aws/rds. The company must have cross-account copies of every database and wants to keep the central-vault design.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute ses charges de travail dans 25 comptes d'AWS Organizations. Une politique de sauvegarde crée des sauvegardes quotidiennes dans chaque compte et les copie vers un coffre nommé central-vault dans un compte de sauvegarde dédié, dans la même Région AWS. La sauvegarde entre comptes est activée dans le compte de gestion. central-vault est chiffré avec une clé AWS KMS gérée par le client, et sa politique d'accès au coffre autorise backup:CopyIntoBackupVault pour les principaux dont l'aws:PrincipalOrgID correspond à l'organisation. Les copies des systèmes de fichiers Amazon EFS réussissent dans tous les comptes. Les copies des instances de base de données Amazon RDS for PostgreSQL échouent dans tous les comptes. Les instances de base de données sont chiffrées avec la clé gérée par AWS aws/rds. L'entreprise doit disposer de copies entre comptes de toutes les bases de données et veut conserver la conception de central-vault.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Switch central-vault to the AWS Backup managed key aws/backup so that AWS Backup re-encrypts every copy with a key that all the accounts of the organization can use."
        fr: "Faire passer central-vault à la clé gérée par AWS Backup aws/backup pour qu'AWS Backup rechiffre chaque copie avec une clé utilisable par tous les comptes de l'organisation."
    - id: b
      text:
        en: "Add each member account ID as a principal in the vault access policy of central-vault, because aws:PrincipalOrgID conditions aren't evaluated for copy jobs."
        fr: "Ajouter l'ID de chaque compte membre comme principal dans la politique d'accès de central-vault, car les conditions aws:PrincipalOrgID ne sont pas évaluées pour les tâches de copie."
    - id: c
      text:
        en: "Turn on cross-account backup in the AWS Backup settings of each member account, because the management account setting applies only to fully managed resource types."
        fr: "Activer la sauvegarde entre comptes dans les paramètres AWS Backup de chaque compte membre, car le paramètre du compte de gestion ne s'applique qu'aux types de ressources entièrement gérés."
    - id: d
      text:
        en: "Move each database to a new DB instance restored from a snapshot copied with a customer managed key, and allow the backup account to use that key in its key policy."
        fr: "Déplacer chaque base de données vers une nouvelle instance restaurée à partir d'un instantané copié avec une clé gérée par le client, et autoriser le compte de sauvegarde à utiliser cette clé dans sa politique de clé."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon RDS isn't a resource type fully managed by AWS Backup, so a cross-account copy needs the source to be encrypted with a customer managed key that is shared with the destination account; the policy of an AWS managed key such as aws/rds can't be changed to allow another account. Because the key of an existing DB instance can't be changed, the company copies a snapshot with a customer managed key, restores a new instance, and moves the application to it."
    fr: "Amazon RDS n'est pas un type de ressource entièrement géré par AWS Backup : une copie entre comptes exige que la source soit chiffrée avec une clé gérée par le client et partagée avec le compte de destination ; la politique d'une clé gérée par AWS comme aws/rds ne peut pas être modifiée pour autoriser un autre compte. Comme la clé d'une instance existante ne peut pas être changée, l'entreprise copie un instantané avec une clé gérée par le client, restaure une nouvelle instance et y bascule l'application."
  options:
    a: { en: "The key of a vault can't be changed after creation, and aws/backup is accepted only for fully managed resource types; the RDS source key is still an unshareable AWS managed key.", fr: "La clé d'un coffre ne peut pas être modifiée après sa création, et aws/backup n'est accepté que pour les types de ressources entièrement gérés ; la clé source RDS reste une clé gérée par AWS non partageable." }
    b: { en: "The aws:PrincipalOrgID condition works for copies, as the successful EFS copies show; the failure comes from the AWS managed key of the source databases.", fr: "La condition aws:PrincipalOrgID fonctionne pour les copies, comme le montrent les copies EFS réussies ; l'échec vient de la clé gérée par AWS des bases sources." }
    c: { en: "Cross-account management features are turned on only by the management account, and the setting applies to every supported resource type.", fr: "Les fonctionnalités de gestion entre comptes ne s'activent que depuis le compte de gestion, et le paramètre s'applique à tous les types de ressources pris en charge." }
references:
  - title: Creating backup copies across AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
