id: sapc03-4c-r53-calculated-check
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs its order portal in two AWS Regions with Amazon Route 53 failover routing. The primary record currently has a health check on the HTTPS endpoint of the Application Load Balancer in the primary Region. During a failover test, the team stopped the primary Aurora writer, but the web tier kept answering its /health page, so Route 53 never failed over. The database team already maintains an Amazon CloudWatch alarm in the same account that goes into the ALARM state when the primary database can't accept writes. The primary Region must be considered healthy only when both the load balancer endpoint and the database are healthy. The application code must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute son portail de commandes dans deux Régions AWS avec un routage de basculement Amazon Route 53. L'enregistrement principal a actuellement une vérification de l'état sur le point de terminaison HTTPS de l'Application Load Balancer de la Région principale. Lors d'un test de basculement, l'équipe a arrêté l'instance d'écriture Aurora principale, mais le niveau web a continué à répondre sur sa page /health, si bien que Route 53 n'a jamais basculé. L'équipe base de données gère déjà dans le même compte une alarme Amazon CloudWatch qui passe à l'état ALARM quand la base principale ne peut plus accepter d'écritures. La Région principale ne doit être considérée comme saine que si le point de terminaison de l'équilibreur de charge et la base de données sont tous deux sains. Le code de l'application ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a health check that monitors the CloudWatch alarm, and associate both this health check and the existing endpoint health check with the primary failover record."
        fr: "Créer une vérification de l'état qui surveille l'alarme CloudWatch, et associer à la fois cette vérification et la vérification du point de terminaison existante à l'enregistrement de basculement principal."
    - id: b
      text:
        en: "Create a health check that monitors the CloudWatch alarm, create a calculated health check that requires both child checks to be healthy, and associate it with the primary record."
        fr: "Créer une vérification de l'état qui surveille l'alarme CloudWatch, créer une vérification calculée qui exige que les deux vérifications enfants soient saines, et l'associer à l'enregistrement principal."
    - id: c
      text:
        en: "Change the endpoint health check to use string matching on the /health page, and search for the name of the Aurora writer endpoint in the first 5,120 bytes of the response."
        fr: "Modifier la vérification du point de terminaison pour utiliser la correspondance de chaîne sur la page /health, et rechercher le nom du point de terminaison d'écriture Aurora dans les 5 120 premiers octets de la réponse."
    - id: d
      text:
        en: "Keep the endpoint health check, and add an EventBridge rule that calls the CloudWatch SetAlarmState API on an alarm-based health check whenever the database alarm changes state."
        fr: "Conserver la vérification du point de terminaison et ajouter une règle EventBridge qui appelle l'API CloudWatch SetAlarmState sur une vérification fondée sur une alarme chaque fois que l'alarme de base de données change d'état."
answer: { optionId: b }
explanation:
  correct:
    en: "A Route 53 health check can monitor the data stream of a CloudWatch alarm in the same account. A calculated health check combines child health checks and is healthy only when the number of healthy children reaches the threshold you set, here two out of two, so the primary record fails over when either the load balancer or the database is unhealthy."
    fr: "Une vérification de l'état Route 53 peut surveiller le flux de données d'une alarme CloudWatch du même compte. Une vérification calculée combine des vérifications enfants et n'est saine que si le nombre d'enfants sains atteint le seuil défini, ici deux sur deux : l'enregistrement principal bascule dès que l'équilibreur de charge ou la base de données est défectueux."
  options:
    a: { en: "A record is associated with one health check; to combine several checks you need a calculated health check.", fr: "Un enregistrement est associé à une seule vérification de l'état ; pour combiner plusieurs vérifications, il faut une vérification calculée." }
    c: { en: "The /health page doesn't test the database, so its content wouldn't change when the writer stops; making it do so would require an application change.", fr: "La page /health ne teste pas la base de données, donc son contenu ne changerait pas à l'arrêt de l'instance d'écriture ; la modifier exigerait un changement de l'application." }
    d: { en: "Route 53 monitors the alarm's data stream, not its state, so SetAlarmState can't force a health check status to change; the design also adds custom automation.", fr: "Route 53 surveille le flux de données de l'alarme et non son état : SetAlarmState ne peut pas forcer le changement d'état d'une vérification ; la conception ajoute en outre une automatisation personnalisée." }
references:
  - title: How Amazon Route 53 determines whether a health check is healthy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
