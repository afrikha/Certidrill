id: sapc03-4c-measure-recovery-time
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online retailer runs its checkout service on Amazon ECS and Aurora across three Availability Zones in one AWS Region. The resilience team runs an AWS FIS experiment from the AZ Availability: Power Interruption scenario every month. The team's report must state the measured recovery time from the customer's point of view: when a test purchase first failed and when test purchases succeeded again. The report must also show the exact start and end time of each fault action that FIS injected, so that the team can correlate customer impact with each action. The team wants to use managed features instead of writing custom measurement code where possible.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un détaillant en ligne exécute son service de paiement sur Amazon ECS et Aurora dans trois zones de disponibilité d'une Région AWS. L'équipe résilience exécute chaque mois une expérience AWS FIS issue du scénario AZ Availability: Power Interruption. Le rapport de l'équipe doit indiquer le temps de récupération mesuré du point de vue du client : quand un achat de test a échoué pour la première fois et quand les achats de test ont de nouveau réussi. Le rapport doit aussi montrer l'heure exacte de début et de fin de chaque action de panne injectée par FIS, pour que l'équipe puisse corréler l'impact client avec chaque action. L'équipe veut utiliser des fonctionnalités gérées plutôt que d'écrire du code de mesure personnalisé quand c'est possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Run a CloudWatch Synthetics canary that performs a test purchase through the public endpoint every minute, and use its success metric to timestamp the start and end of customer impact."
        fr: "Exécuter un canari CloudWatch Synthetics qui effectue un achat de test par le point de terminaison public chaque minute, et utiliser sa métrique de réussite pour horodater le début et la fin de l'impact client."
    - id: b
      text:
        en: "Run an AWS Resilience Hub assessment after each experiment, and use the estimated workload RTO in the assessment report as the measured recovery time."
        fr: "Exécuter une évaluation AWS Resilience Hub après chaque expérience, et utiliser le RTO estimé de la charge de travail dans le rapport d'évaluation comme temps de récupération mesuré."
    - id: c
      text:
        en: "Turn on experiment logging to CloudWatch Logs in the experiment template, and use the action-start and action-end events to timestamp each injected fault."
        fr: "Activer la journalisation des expériences vers CloudWatch Logs dans le modèle d'expérience, et utiliser les événements action-start et action-end pour horodater chaque panne injectée."
    - id: d
      text:
        en: "Query AWS CloudTrail for the StopInstances and StartInstances events of the experiment, and use the time between them as the customer recovery time."
        fr: "Interroger AWS CloudTrail sur les événements StopInstances et StartInstances de l'expérience, et utiliser le temps écoulé entre eux comme temps de récupération client."
    - id: e
      text:
        en: "Turn on latency measurements for the Route 53 health check of the checkout endpoint, and use the latency graphs to timestamp when each fault started and ended."
        fr: "Activer les mesures de latence de la vérification de l'état Route 53 du point de terminaison de paiement, et utiliser les graphiques de latence pour horodater le début et la fin de chaque panne."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A canary that runs the purchase journey measures what customers experience, so its failures and recoveries give the measured customer impact window. FIS experiment logging records experiment-start, action-start, action-end, and experiment-end events with timestamps, which gives the exact timing of each injected fault to correlate with the canary results."
    fr: "Un canari qui exécute le parcours d'achat mesure ce que vivent les clients : ses échecs et ses rétablissements donnent la fenêtre d'impact client mesurée. La journalisation des expériences FIS enregistre des événements experiment-start, action-start, action-end et experiment-end horodatés, ce qui donne le minutage exact de chaque panne injectée à corréler avec les résultats du canari."
  options:
    b: { en: "Resilience Hub estimates whether the workload can meet its RTO from its configuration; an estimate isn't a measurement of the experiment.", fr: "Resilience Hub estime, d'après la configuration, si la charge de travail peut atteindre son RTO ; une estimation n'est pas une mesure de l'expérience." }
    d: { en: "API events show infrastructure actions, not whether customers could complete a purchase, and the scenario injects more than instance stops.", fr: "Les événements d'API montrent des actions d'infrastructure, pas si les clients pouvaient terminer un achat, et le scénario injecte plus que des arrêts d'instances." }
    e: { en: "Latency graphs show the latency between health checkers and the endpoint; they don't record when FIS actions started or ended.", fr: "Les graphiques de latence montrent la latence entre les vérificateurs et le point de terminaison ; ils n'enregistrent pas quand les actions FIS ont commencé ou fini." }
references:
  - title: Experiment logging for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/monitoring-logging.html
