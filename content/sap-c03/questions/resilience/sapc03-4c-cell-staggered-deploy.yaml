id: sapc03-4c-cell-staggered-deploy
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payments processor runs a cell-based architecture in one AWS Region. Twelve independent cells each serve a subset of merchants, and a thin routing layer maps each merchant ID to its cell. Each cell has its own Amazon ECS services, Amazon DynamoDB tables, and AWS account. The deployment pipeline in AWS CodePipeline deploys every new release to all 12 cells at the same time. Last week, a faulty release made every cell fail within minutes, and all merchants were affected. The company wants to keep the benefits of the cell design and limit the impact of a bad release.

    Which solution will meet these requirements?
  fr: |
    Un processeur de paiements exploite une architecture cellulaire dans une Région AWS. Douze cellules indépendantes servent chacune un sous-ensemble de commerçants, et une couche de routage simple associe chaque ID de commerçant à sa cellule. Chaque cellule dispose de ses propres services Amazon ECS, de ses propres tables Amazon DynamoDB et de son propre compte AWS. Le pipeline de déploiement AWS CodePipeline déploie chaque nouvelle version dans les 12 cellules en même temps. La semaine dernière, une version défectueuse a fait tomber toutes les cellules en quelques minutes, et tous les commerçants ont été touchés. L'entreprise veut conserver les avantages de la conception cellulaire et limiter l'impact d'une mauvaise version.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy each release to one cell first, watch its alarms, and then deploy to the remaining cells in successive waves that stop and roll back when an alarm fires."
        fr: "Déployer chaque version d'abord dans une cellule, surveiller ses alarmes, puis déployer dans les autres cellules par vagues successives qui s'arrêtent et reviennent en arrière quand une alarme se déclenche."
    - id: b
      text:
        en: "Double the number of cells to 24, so that each cell serves fewer merchants, and keep deploying every release to all cells at the same time."
        fr: "Doubler le nombre de cellules à 24, pour que chaque cellule serve moins de commerçants, et continuer à déployer chaque version dans toutes les cellules en même temps."
    - id: c
      text:
        en: "Add release health checks to the routing layer, so that it detects failing cells after a deployment and sends their merchants to the healthy cells."
        fr: "Ajouter des contrôles de santé des versions dans la couche de routage, pour qu'elle détecte les cellules défaillantes après un déploiement et envoie leurs commerçants vers les cellules saines."
    - id: d
      text:
        en: "Replace the per-cell DynamoDB tables with one shared global table, so that a failed release can be rolled back once for every cell."
        fr: "Remplacer les tables DynamoDB propres à chaque cellule par une seule table globale partagée, pour qu'une version défaillante puisse être annulée une seule fois pour toutes les cellules."
answer: { optionId: a }
explanation:
  correct:
    en: "Well-Architected guidance for cell-based architectures prefers staggered deployments over deploying to all cells at once. Deploying to one cell, then to the others in waves gated by alarms, keeps a faulty release contained to a small number of merchants."
    fr: "Les recommandations Well-Architected pour les architectures cellulaires privilégient les déploiements échelonnés plutôt que le déploiement simultané dans toutes les cellules. Déployer dans une cellule, puis dans les autres par vagues conditionnées par des alarmes, confine une version défectueuse à un petit nombre de commerçants."
  options:
    b: { en: "Smaller cells don't help if the same faulty release reaches all of them at the same moment.", fr: "Des cellules plus petites n'aident pas si la même version défectueuse les atteint toutes au même moment." }
    c: { en: "Adding complex logic to the router is an anti-pattern, and moving merchants doesn't help when every cell runs the faulty release.", fr: "Ajouter une logique complexe au routeur est un anti-modèle, et déplacer les commerçants n'aide pas quand toutes les cellules exécutent la version défectueuse." }
    d: { en: "Sharing state between cells breaks their isolation, which is the opposite of what a cell design requires.", fr: "Partager un état entre cellules rompt leur isolation, ce qui est l'inverse de ce qu'exige une conception cellulaire." }
references:
  - title: REL10-BP03 Use bulkhead architectures to limit scope of impact
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_fault_isolation_use_bulkhead.html
