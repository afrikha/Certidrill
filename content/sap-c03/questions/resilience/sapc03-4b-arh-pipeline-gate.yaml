id: sapc03-4b-arh-pipeline-gate
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team deploys an application with AWS CodePipeline and AWS CloudFormation, first to a staging account and then to production. Twice this year, a template change removed a cross-Region replica, and the application silently stopped meeting its resiliency policy for weeks. The team has defined the application and its resiliency policy in AWS Resilience Hub. The team now requires every release to be validated against the RTO and RPO targets of that policy before it reaches production. A release that would not meet the targets must be stopped automatically.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une équipe plateforme déploie une application avec AWS CodePipeline et AWS CloudFormation, d'abord dans un compte de préproduction puis en production. Deux fois cette année, une modification de modèle a supprimé un réplica entre Régions, et l'application a cessé de respecter sa politique de résilience pendant des semaines sans que personne ne le voie. L'équipe a défini l'application et sa politique de résilience dans AWS Resilience Hub. Elle exige désormais que chaque version soit validée par rapport aux objectifs de RTO et de RPO de cette politique avant d'atteindre la production. Une version qui ne respecterait pas les objectifs doit être arrêtée automatiquement.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Add an AWS CloudFormation Guard stage before the staging deployment with rules that require cross-Region replicas and backups on every database and storage resource in the templates.", fr: "Ajouter avant le déploiement en préproduction une étape AWS CloudFormation Guard avec des règles qui exigent réplicas entre Régions et sauvegardes sur chaque ressource de base de données et de stockage des modèles." }
    - id: b
      text: { en: "After the staging deployment, add a CodeBuild action that runs a Resilience Hub assessment of the new app version and fails unless the status is Policy met.", fr: "Après le déploiement en préproduction, ajouter une action CodeBuild qui lance une évaluation Resilience Hub de la nouvelle version de l'application et échoue sauf si l'état est Policy met." }
    - id: c
      text: { en: "Turn on Automatically assess daily and drift notifications for the production application, and have the on-call engineer roll back a release when a drift notification arrives.", fr: "Activer Automatically assess daily et les notifications de dérive pour l'application de production, et faire revenir en arrière une version par l'ingénieur d'astreinte à l'arrivée d'une notification de dérive." }
    - id: d
      text: { en: "Deploy an AWS Config rule in production that detects database resources without replicas, with an automatic remediation that re-creates the missing replicas.", fr: "Déployer en production une règle AWS Config qui détecte les ressources de base de données sans réplica, avec une correction automatique qui recrée les réplicas manquants." }
answer: { optionId: b }
explanation:
  correct:
    en: "Resilience Hub assesses the deployed resources of an application against its resiliency policy and returns a compliance status such as Policy met or Policy breached. Running the import, publish and assessment API calls from a pipeline action after the staging deployment turns that status into a gate, so a release that breaches the RTO or RPO targets stops before production."
    fr: "Resilience Hub évalue les ressources déployées d'une application par rapport à sa politique de résilience et renvoie un état de conformité comme Policy met ou Policy breached. Exécuter les appels d'API d'importation, de publication et d'évaluation depuis une action du pipeline après le déploiement en préproduction transforme cet état en contrôle : une version qui viole les objectifs de RTO ou de RPO s'arrête avant la production."
  options:
    a:
      en: "Guard rules check template properties one by one; they do not estimate recovery objectives against the policy, and every resiliency rule would have to be written and maintained."
      fr: "Les règles Guard vérifient des propriétés de modèle une à une ; elles n'estiment pas les objectifs de reprise par rapport à la politique, et chaque règle de résilience devrait être écrite et maintenue."
    c:
      en: "Daily assessments and drift notifications detect the problem after the release is already in production, and the rollback depends on a person."
      fr: "Les évaluations quotidiennes et les notifications de dérive détectent le problème une fois la version déjà en production, et le retour arrière dépend d'une personne."
    d:
      en: "A Config rule in production reacts after deployment, needs custom detection and remediation logic, and conflicts with the templates that removed the replicas."
      fr: "Une règle Config en production réagit après le déploiement, exige une logique de détection et de correction personnalisée, et entre en conflit avec les modèles qui ont supprimé les réplicas."
references:
  - title: What is AWS Resilience Hub?
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/what-is.html
