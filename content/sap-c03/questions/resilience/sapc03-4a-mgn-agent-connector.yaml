id: sapc03-4a-mgn-agent-connector
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A telecommunications company is rehosting 1,500 VMware virtual machines to native Amazon EC2 instances with AWS Transform. The server teams are understaffed and cannot sign in to every virtual machine to install software. The VMware team therefore proposes agentless replication through vCenter, which worked well in a migration that the company ran several years ago. The security team accepts software on the servers only if it is deployed centrally and if the credentials are stored in AWS Secrets Manager. The business wants the shortest possible cutover window for each wave.

    Which approach will meet these requirements?
  fr: |
    Une entreprise de télécommunications réhéberge 1 500 machines virtuelles VMware vers des instances Amazon EC2 natives avec AWS Transform. Les équipes serveurs manquent de personnel et ne peuvent pas se connecter à chaque machine virtuelle pour installer un logiciel. L'équipe VMware propose donc une réplication sans agent par vCenter, qui avait bien fonctionné lors d'une migration menée par l'entreprise il y a plusieurs années. L'équipe de sécurité n'accepte un logiciel sur les serveurs que s'il est déployé de manière centralisée et si les informations d'identification sont stockées dans AWS Secrets Manager. Le métier veut la fenêtre de basculement la plus courte possible pour chaque vague.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use the MGN connector with credentials stored in Secrets Manager to install the AWS Replication Agent over WinRM and SSH on the servers of each wave, and replicate them continuously with agent-based replication."
        fr: "Utiliser le connecteur MGN avec des informations d'identification stockées dans Secrets Manager pour installer l'agent de réplication AWS par WinRM et SSH sur les serveurs de chaque vague, puis les répliquer en continu avec la réplication basée sur agent."
    - id: b
      text:
        en: "Install the MGN vCenter Client in vCenter, replicate all virtual machines with agentless snapshot replication, and take a final snapshot of each virtual machine at the start of the cutover window."
        fr: "Installer le client MGN vCenter dans vCenter, répliquer toutes les machines virtuelles avec la réplication sans agent par instantanés, puis prendre un dernier instantané de chaque machine virtuelle au début de la fenêtre de basculement."
    - id: c
      text:
        en: "Export each virtual machine to Amazon S3 as an OVA image, import it with VM Import/Export, and repeat the export and import during the cutover window to capture the latest changes."
        fr: "Exporter chaque machine virtuelle dans Amazon S3 sous forme d'image OVA, l'importer avec VM Import/Export, puis répéter l'export et l'import pendant la fenêtre de basculement pour capturer les dernières modifications."
    - id: d
      text:
        en: "Deploy an Amazon Elastic VMware Service environment, connect it to the data center, and migrate the virtual machines into it with vMotion so that no software is installed in the guests."
        fr: "Déployer un environnement Amazon Elastic VMware Service, le connecter au centre de données et y migrer les machines virtuelles avec vMotion afin de n'installer aucun logiciel dans les systèmes invités."
answer: { optionId: a }
explanation:
  correct:
    en: "Agentless replication is no longer available for new deployments, and AWS Transform does not support it. The MGN connector installs the AWS Replication Agent remotely over WinRM or SSH with credentials kept in Secrets Manager, so no one signs in to each server. Agent-based replication is continuous and gives the shortest cutover window."
    fr: "La réplication sans agent n'est plus disponible pour les nouveaux déploiements, et AWS Transform ne la prend pas en charge. Le connecteur MGN installe l'agent de réplication AWS à distance par WinRM ou SSH avec des informations d'identification conservées dans Secrets Manager : personne n'a à se connecter à chaque serveur. La réplication basée sur agent est continue et offre la fenêtre de basculement la plus courte."
  options:
    b: { en: "Agentless replication through the MGN vCenter Client is no longer available for new deployments, and snapshot-based replication gives a longer cutover window than continuous replication.", fr: "La réplication sans agent par le client MGN vCenter n'est plus disponible pour les nouveaux déploiements, et la réplication par instantanés donne une fenêtre de basculement plus longue que la réplication continue." }
    c: { en: "Exporting and importing images at cutover takes hours per server, so the cutover window is much longer than with continuous replication.", fr: "Exporter et importer des images au basculement prend des heures par serveur : la fenêtre de basculement est bien plus longue qu'avec une réplication continue." }
    d: { en: "Amazon EVS keeps the workloads on VMware Cloud Foundation, but the target is native EC2 instances.", fr: "Amazon EVS maintient les charges de travail sur VMware Cloud Foundation, alors que la cible est des instances EC2 natives." }
references:
  - title: Installing the AWS Transform MGN vCenter Client for Agentless Replication on vCenter source environments
    url: https://docs.aws.amazon.com/mgn/latest/ug/agentless-mgn.html
  - title: Migrate servers
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-migrate-servers.html
