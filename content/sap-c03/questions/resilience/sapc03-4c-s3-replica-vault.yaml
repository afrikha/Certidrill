id: sapc03-4c-s3-replica-vault
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An analytics company stores its curated datasets in a versioned Amazon S3 bucket in a production account in eu-west-1. The bucket doesn't use S3 Object Lock, because data engineers must be able to delete obsolete versions. The security team's threat model assumes that an attacker could obtain administrator access to the production account and delete or overwrite objects and versions there. The company requires an immutable copy of every new object version in a separate data-vault account in eu-central-1, protected from deletion for 30 days by anyone, including the root user of the data-vault account. Administrators of the production account must have no control over the copies. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'analyse stocke ses jeux de données consolidés dans un compartiment Amazon S3 versionné d'un compte de production dans eu-west-1. Le compartiment n'utilise pas S3 Object Lock, car les ingénieurs de données doivent pouvoir supprimer les versions obsolètes. Le modèle de menace de l'équipe sécurité suppose qu'un attaquant pourrait obtenir un accès administrateur au compte de production et y supprimer ou écraser des objets et des versions. L'entreprise exige une copie immuable de chaque nouvelle version d'objet dans un compte coffre de données (data-vault) distinct dans eu-central-1, protégée contre la suppression pendant 30 jours par quiconque, y compris l'utilisateur racine du compte data-vault. Les administrateurs du compte de production ne doivent avoir aucun contrôle sur les copies. La solution doit avoir la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure S3 Cross-Region Replication to a new bucket in the production account in eu-central-1 that has Object Lock enabled with a 30-day default retention in compliance mode."
        fr: "Configurer S3 Cross-Region Replication vers un nouveau compartiment du compte de production dans eu-central-1 sur lequel Object Lock est activé avec une rétention par défaut de 30 jours en mode conformité."
    - id: b
      text:
        en: "Configure S3 Cross-Region Replication to a bucket in the data-vault account that has Object Lock enabled with a 30-day default retention in governance mode, and change replica ownership to the data-vault account."
        fr: "Configurer S3 Cross-Region Replication vers un compartiment du compte data-vault sur lequel Object Lock est activé avec une rétention par défaut de 30 jours en mode gouvernance, et transférer la propriété des réplicas au compte data-vault."
    - id: c
      text:
        en: "Schedule a nightly S3 Batch Operations Copy job from the production account into a bucket in the data-vault account that has S3 Versioning and MFA delete enabled."
        fr: "Planifier chaque nuit une tâche S3 Batch Operations Copy depuis le compte de production vers un compartiment du compte data-vault sur lequel S3 Versioning et la suppression MFA sont activés."
    - id: d
      text:
        en: "Configure S3 Cross-Region Replication to a bucket in the data-vault account that has Object Lock enabled with a 30-day default retention in compliance mode, and change replica ownership to the data-vault account."
        fr: "Configurer S3 Cross-Region Replication vers un compartiment du compte data-vault sur lequel Object Lock est activé avec une rétention par défaut de 30 jours en mode conformité, et transférer la propriété des réplicas au compte data-vault."
answer: { optionId: d }
explanation:
  correct:
    en: "Replication copies each new version continuously to the other account and Region, and the change of replica ownership makes the data-vault account the owner of the copies. Versions placed in the destination bucket receive its default retention, and in compliance mode no user, including the root user, can delete them or shorten the retention. Deleting a specific version in the source bucket isn't replicated, so the attacker can't remove the copies from production."
    fr: "La réplication copie en continu chaque nouvelle version vers l'autre compte et l'autre Région, et le transfert de propriété des réplicas fait du compte data-vault le propriétaire des copies. Les versions placées dans le compartiment de destination reçoivent sa rétention par défaut, et en mode conformité aucun utilisateur, y compris l'utilisateur racine, ne peut les supprimer ni raccourcir la rétention. La suppression d'une version précise dans le compartiment source n'est pas répliquée : l'attaquant ne peut pas retirer les copies depuis la production."
  options:
    a: { en: "The copies stay in the production account, whose administrators keep control over the bucket and its configuration, which the requirements forbid.", fr: "Les copies restent dans le compte de production, dont les administrateurs gardent le contrôle du compartiment et de sa configuration, ce que les exigences interdisent." }
    b: { en: "In governance mode, users with s3:BypassGovernanceRetention, which the data-vault root user can grant, can delete the versions before 30 days.", fr: "En mode gouvernance, les utilisateurs disposant de s3:BypassGovernanceRetention, que l'utilisateur racine du compte data-vault peut accorder, peuvent supprimer les versions avant 30 jours." }
    c: { en: "A nightly copy misses versions overwritten during the day and adds a job to run, and MFA delete isn't a time-based WORM protection against the vault account's root user.", fr: "Une copie nocturne manque les versions écrasées dans la journée et ajoute une tâche à exécuter, et la suppression MFA n'est pas une protection WORM temporelle contre l'utilisateur racine du compte coffre." }
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
