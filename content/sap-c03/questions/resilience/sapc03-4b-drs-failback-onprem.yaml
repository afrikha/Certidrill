id: sapc03-4b-drs-failback-onprem
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Three weeks ago, a flood made AnyCompany's data center unavailable, and the company recovered 90 VMware servers on AWS with AWS Elastic Disaster Recovery (AWS DRS). Production has run on the recovery instances since then, and users have created a large amount of new data. The data center is now repaired, and the original virtual machines and their disks are intact. The company wants to move production back to the original servers during a short maintenance window. Only the changes made on AWS since the recovery should be transferred, and the recovery instances must remain available as a fallback until the failback is validated.

    Which approach will meet these requirements?
  fr: |
    Il y a trois semaines, une inondation a rendu indisponible le centre de données d'AnyCompany, et l'entreprise a récupéré 90 serveurs VMware sur AWS avec AWS Elastic Disaster Recovery (AWS DRS). Depuis, la production s'exécute sur les instances de reprise, et les utilisateurs ont créé une grande quantité de nouvelles données. Le centre de données est maintenant réparé, et les machines virtuelles d'origine et leurs disques sont intacts. L'entreprise veut ramener la production sur les serveurs d'origine pendant une courte fenêtre de maintenance. Seules les modifications effectuées sur AWS depuis la reprise doivent être transférées, et les instances de reprise doivent rester disponibles comme solution de repli jusqu'à la validation de la restauration (failback).

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Boot the original servers with the DRS Failback Client so that they replicate the changes back from their recovery instances, choose Failback during the window, and keep the recovery instances until validation.", fr: "Démarrer les serveurs d'origine avec le DRS Failback Client pour qu'ils reçoivent les modifications depuis leurs instances de reprise, choisir Failback pendant la fenêtre, et conserver les instances de reprise jusqu'à la validation." }
    - id: b
      text: { en: "Reinstall the AWS Replication Agent on the original servers, and initiate a recovery job whose target is the data center so that DRS copies the latest recovery instance data back to the servers.", fr: "Réinstaller l'AWS Replication Agent sur les serveurs d'origine, et lancer une tâche de reprise ayant pour cible le centre de données afin que DRS recopie les dernières données des instances de reprise vers les serveurs." }
    - id: c
      text: { en: "Export the recovery instances to OVA images in Amazon S3 with VM Import/Export, download the images, and import them into vSphere to replace the original virtual machines.", fr: "Exporter les instances de reprise en images OVA dans Amazon S3 avec VM Import/Export, télécharger les images et les importer dans vSphere pour remplacer les machines virtuelles d'origine." }
    - id: d
      text: { en: "Deploy AWS DataSync agents in the data center, and copy the EBS volumes of the recovery instances to the original virtual machine disks before switching DNS back.", fr: "Déployer des agents AWS DataSync dans le centre de données, et copier les volumes EBS des instances de reprise vers les disques des machines virtuelles d'origine avant de rebasculer le DNS." }
answer: { optionId: a }
explanation:
  correct:
    en: "Failback to on premises uses the DRS Failback Client (or DRS Failback Automation), which pairs the source server with its recovery instance and replicates data from AWS back to it. When the target is the original source server, only the delta changes made after the recovery are replicated; choosing Failback then converts and finalizes the servers, and the recovery instances are terminated or disconnected only after validation."
    fr: "La restauration vers le site utilise le DRS Failback Client (ou DRS Failback Automation), qui apparie le serveur source à son instance de reprise et réplique les données d'AWS vers lui. Quand la cible est le serveur source d'origine, seules les modifications delta postérieures à la reprise sont répliquées ; choisir Failback convertit et finalise ensuite les serveurs, et les instances de reprise ne sont arrêtées ou déconnectées qu'après validation."
  options:
    b:
      en: "The AWS Replication Agent replicates from a source server to AWS; reinstalling it would start protecting the stale on-premises disks instead of bringing the AWS data back."
      fr: "L'AWS Replication Agent réplique d'un serveur source vers AWS ; le réinstaller commencerait à protéger les disques obsolètes du site au lieu de rapatrier les données d'AWS."
    c:
      en: "Exporting full images transfers every disk in full and requires a long outage for the final copy, instead of replicating only the changes."
      fr: "Exporter des images complètes transfère chaque disque en entier et impose une longue interruption pour la copie finale, au lieu de ne répliquer que les modifications."
    d:
      en: "DataSync transfers files and objects between storage services; it cannot copy EBS volumes block by block onto virtual machine disks."
      fr: "DataSync transfère des fichiers et des objets entre services de stockage ; il ne peut pas copier des volumes EBS bloc par bloc vers des disques de machines virtuelles."
references:
  - title: Failback to on-premises environment
    url: https://docs.aws.amazon.com/drs/latest/userguide/failback-performing.html
