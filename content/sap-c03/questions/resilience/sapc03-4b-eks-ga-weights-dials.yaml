id: sapc03-4b-eks-ga-weights-dials
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs its matchmaking service on Amazon EKS in the eu-west-1 and us-east-1 Regions. To upgrade clusters safely, each Region runs two clusters, blue and green, and each cluster exposes the service through its own Network Load Balancer created by the AWS Load Balancer Controller. Game clients connect over TCP and UDP to a fixed set of IP addresses. During a cluster upgrade, the operations team must shift traffic gradually from the blue cluster to the green cluster of a Region, in steps of 10, 50 and 100 percent. The team must also be able to reduce the share of traffic that a whole Region receives during Regional maintenance. If a Region fails, new connections must move to the other Region automatically.

    Which solution will meet these requirements?
  fr: |
    Une société de jeux vidéo exécute son service de matchmaking sur Amazon EKS dans les Régions eu-west-1 et us-east-1. Pour mettre à niveau les clusters en toute sécurité, chaque Région exécute deux clusters, bleu et vert, et chaque cluster expose le service par son propre Network Load Balancer créé par l'AWS Load Balancer Controller. Les clients de jeu se connectent en TCP et en UDP à un ensemble fixe d'adresses IP. Lors d'une mise à niveau de cluster, l'équipe d'exploitation doit déplacer progressivement le trafic du cluster bleu vers le cluster vert d'une Région, par paliers de 10, 50 et 100 %. Elle doit aussi pouvoir réduire la part de trafic que reçoit toute une Région pendant une maintenance régionale. Si une Région tombe en panne, les nouvelles connexions doivent passer automatiquement à l'autre Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create Amazon Route 53 weighted records with health checks for the four Network Load Balancers, and adjust the record weights for both the cluster upgrades and the Regional maintenance.", fr: "Créer des enregistrements pondérés Amazon Route 53 avec vérifications de l'état pour les quatre Network Load Balancers, et ajuster les poids des enregistrements pour les mises à niveau de clusters comme pour la maintenance régionale." }
    - id: b
      text: { en: "Create a Global Accelerator endpoint group per Region with both Network Load Balancers, and use the traffic dial of the group to shift traffic from the blue to the green cluster during an upgrade.", fr: "Créer un groupe de points de terminaison Global Accelerator par Région avec les deux Network Load Balancers, et utiliser le traffic dial du groupe pour déplacer le trafic du cluster bleu vers le vert lors d'une mise à niveau." }
    - id: c
      text: { en: "Create an Amazon CloudFront distribution with continuous deployment, using the green cluster's Network Load Balancer as the staging origin and the traffic-weight policy for the gradual shift.", fr: "Créer une distribution Amazon CloudFront avec déploiement continu, en utilisant le Network Load Balancer du cluster vert comme origine intermédiaire et la politique de pondération du trafic pour le déplacement progressif." }
    - id: d
      text: { en: "Create a Global Accelerator endpoint group per Region with both Network Load Balancers, adjust endpoint weights to shift between clusters, and use the traffic dial of each group for Regional maintenance.", fr: "Créer un groupe de points de terminaison Global Accelerator par Région avec les deux Network Load Balancers, ajuster les poids des points de terminaison pour basculer entre clusters, et utiliser le traffic dial de chaque groupe pour la maintenance régionale." }
answer: { optionId: d }
explanation:
  correct:
    en: "Global Accelerator gives clients static anycast IP addresses, supports TCP and UDP to Network Load Balancer endpoints, and sends new connections only to healthy endpoints, so a failed Region is bypassed automatically. Within an endpoint group, traffic is split by endpoint weight (default 128, maximum 255), which suits the blue/green shift, while the traffic dial of an endpoint group controls the percentage of traffic that the whole Region accepts."
    fr: "Global Accelerator fournit aux clients des adresses IP anycast statiques, prend en charge TCP et UDP vers des points de terminaison Network Load Balancer, et n'envoie les nouvelles connexions qu'aux points de terminaison sains : une Région en panne est contournée automatiquement. Dans un groupe de points de terminaison, le trafic est réparti selon le poids des points de terminaison (128 par défaut, 255 au maximum), ce qui convient au passage bleu/vert, tandis que le traffic dial d'un groupe contrôle le pourcentage de trafic qu'accepte toute la Région."
  options:
    a:
      en: "DNS-based routing returns the load balancers' own IP addresses, so clients cannot use a fixed set of IP addresses, and DNS caching slows both the shifts and the failover."
      fr: "Le routage DNS renvoie les adresses IP propres des équilibreurs de charge : les clients ne peuvent pas utiliser un ensemble fixe d'adresses IP, et le cache DNS ralentit les déplacements comme le basculement."
    b:
      en: "A traffic dial applies to the whole endpoint group, so it cannot split traffic between two endpoints in the same Region; endpoint weights do that."
      fr: "Un traffic dial s'applique à tout le groupe de points de terminaison : il ne peut pas répartir le trafic entre deux points de terminaison de la même Région ; ce sont les poids qui le font."
    c:
      en: "CloudFront delivers HTTP and HTTPS content; it cannot carry the TCP and UDP game protocol, and it does not provide a fixed set of IP addresses."
      fr: "CloudFront diffuse du contenu HTTP et HTTPS ; il ne peut pas transporter le protocole de jeu TCP et UDP, et ne fournit pas un ensemble fixe d'adresses IP."
references:
  - title: How AWS Global Accelerator works
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
