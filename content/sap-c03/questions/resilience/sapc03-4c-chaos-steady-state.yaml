id: sapc03-4c-chaos-steady-state
objective: "4.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank is launching its first chaos engineering program for a payments API that runs on Amazon ECS and Aurora across three Availability Zones. The draft plan has three points. First, the steady state is defined as an average CPU utilization below 70 % on the ECS tasks. Second, the first experiment will stop tasks in all three Availability Zones in production during the Monday peak, to get the most realistic results. Third, one experiment will cut access to a fraud-scoring dependency that the team already knows has no timeout or fallback, to confirm that payments fail. The architecture board asks the team to align the plan with AWS Well-Architected guidance.

    Which changes should the team make? (Choose two.)
  fr: |
    Une banque lance son premier programme d'ingénierie du chaos pour une API de paiements qui s'exécute sur Amazon ECS et Aurora dans trois zones de disponibilité. Le projet de plan comporte trois points. D'abord, l'état stable est défini comme une utilisation moyenne du processeur inférieure à 70 % sur les tâches ECS. Ensuite, la première expérience arrêtera des tâches dans les trois zones de disponibilité en production pendant la pointe du lundi, pour obtenir les résultats les plus réalistes. Enfin, une expérience coupera l'accès à une dépendance d'évaluation de la fraude dont l'équipe sait déjà qu'elle n'a ni délai d'expiration ni solution de repli, pour confirmer que les paiements échouent. Le comité d'architecture demande à l'équipe d'aligner le plan sur les recommandations AWS Well-Architected.

    Quelles modifications l'équipe doit-elle apporter ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Keep the CPU-based steady state, because infrastructure metrics react faster than business metrics and are the most direct indicator of customer experience."
        fr: "Conserver l'état stable fondé sur le processeur, car les métriques d'infrastructure réagissent plus vite que les métriques métier et sont l'indicateur le plus direct de l'expérience client."
    - id: b
      text:
        en: "Define the steady state as a client-facing output, such as payments per second, success rate, and latency measured by synthetic canaries, and base stop conditions on it."
        fr: "Définir l'état stable comme une sortie vue par les clients, par exemple les paiements par seconde, le taux de réussite et la latence mesurés par des canaris synthétiques, et en dériver les conditions d'arrêt."
    - id: c
      text:
        en: "Run every experiment with the ALL selection mode on all Availability Zones, because experiments with a limited scope don't produce valid results."
        fr: "Exécuter chaque expérience avec le mode de sélection ALL sur toutes les zones de disponibilité, car les expériences de portée limitée ne produisent pas de résultats valides."
    - id: d
      text:
        en: "Run the first experiments in a pre-production environment as close to production as possible with a limited scope, then move to production at off-peak times."
        fr: "Exécuter les premières expériences dans un environnement de préproduction aussi proche que possible de la production avec une portée limitée, puis passer en production en dehors des heures de pointe."
    - id: e
      text:
        en: "Keep the fraud-scoring experiment, because confirming a known weakness in production gives the strongest evidence for prioritizing its fix."
        fr: "Conserver l'expérience sur l'évaluation de la fraude, car confirmer une faiblesse connue en production fournit la preuve la plus forte pour prioriser sa correction."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Well-Architected defines the steady state as a measurable output of the workload, focused on client-facing results rather than internal attributes, and recommends synthetic monitors to measure it. Faults should first be simulated outside production, with the scope of each experiment kept small, and the first production runs should happen off-peak."
    fr: "Well-Architected définit l'état stable comme une sortie mesurable de la charge de travail, centrée sur les résultats vus par les clients plutôt que sur des attributs internes, et recommande des moniteurs synthétiques pour la mesurer. Les pannes doivent d'abord être simulées hors production, avec une portée réduite pour chaque expérience, et les premières exécutions en production doivent avoir lieu hors des heures de pointe."
  options:
    a: { en: "CPU is an internal attribute; the guidance is to measure the output that clients see, such as throughput, success rate, and latency.", fr: "Le processeur est un attribut interne ; les recommandations sont de mesurer la sortie vue par les clients, comme le débit, le taux de réussite et la latence." }
    c: { en: "The guidance is to minimize the scope and impact of each experiment; starting with every target in every zone maximizes customer risk.", fr: "Les recommandations sont de minimiser la portée et l'impact de chaque expérience ; commencer avec toutes les cibles de toutes les zones maximise le risque client." }
    e: { en: "An experiment should be fail-safe; if the team knows the workload will fail, it should fix the weakness first instead of running the experiment.", fr: "Une expérience doit être sans danger par défaut ; si l'équipe sait que la charge de travail va échouer, elle doit d'abord corriger la faiblesse au lieu de lancer l'expérience." }
references:
  - title: REL12-BP04 Test resiliency using chaos engineering
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_testing_resiliency_failure_injection_resiliency.html
