id: sapc03-4c-sqs-concurrency-bulkhead
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company processes order events in one AWS account. An Amazon SQS standard queue triggers a Lambda consumer function that writes each order to an Amazon RDS for MySQL database. The database supports about 60 concurrent connections from the consumer. In the same account, a payment authorization Lambda function is invoked synchronously by Amazon API Gateway. During the last flash sale, the consumer scaled to more than 900 concurrent executions, the database ran out of connections, and the payment function was throttled because the account's 1,000 concurrent executions were exhausted. The consumer must never run more than 50 concurrent executions, and orders that can't be processed immediately must wait in the queue. The payment function must always be able to scale to 300 concurrent executions. The function code must not change.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise d'e-commerce traite des événements de commande dans un compte AWS. Une file d'attente Amazon SQS standard déclenche une fonction Lambda consommatrice qui écrit chaque commande dans une base de données Amazon RDS for MySQL. La base accepte environ 60 connexions simultanées de la part du consommateur. Dans le même compte, une fonction Lambda d'autorisation de paiement est appelée de façon synchrone par Amazon API Gateway. Lors de la dernière vente flash, le consommateur est monté à plus de 900 exécutions simultanées, la base a manqué de connexions, et la fonction de paiement a été limitée parce que les 1 000 exécutions simultanées du compte étaient épuisées. Le consommateur ne doit jamais dépasser 50 exécutions simultanées, et les commandes qui ne peuvent pas être traitées immédiatement doivent attendre dans la file. La fonction de paiement doit toujours pouvoir monter à 300 exécutions simultanées. Le code des fonctions ne doit pas changer.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the reserved concurrency of the consumer function to 0 at the start of each flash sale, and set it back to its previous value when the sale ends."
        fr: "Régler la concurrence réservée de la fonction consommatrice à 0 au début de chaque vente flash, et la remettre à sa valeur précédente à la fin de la vente."
    - id: b
      text:
        en: "Set the maximum concurrency of the SQS event source mapping of the consumer function to 50."
        fr: "Régler la concurrence maximale du mappage de source d'événements SQS de la fonction consommatrice à 50."
    - id: c
      text:
        en: "Turn on provisioned mode for the SQS event source mapping, with a minimum number of event pollers sized for 50 concurrent executions."
        fr: "Activer le mode provisionné du mappage de source d'événements SQS, avec un nombre minimal d'interrogateurs d'événements dimensionné pour 50 exécutions simultanées."
    - id: d
      text:
        en: "Increase the batch size and the maximum batching window of the SQS event source mapping, so that each invocation of the consumer processes more orders."
        fr: "Augmenter la taille de lot et la fenêtre de traitement par lots maximale du mappage de source d'événements SQS, pour que chaque appel du consommateur traite plus de commandes."
    - id: e
      text:
        en: "Configure a reserved concurrency of 300 on the payment authorization function."
        fr: "Configurer une concurrence réservée de 300 sur la fonction d'autorisation de paiement."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Maximum concurrency on the SQS event source mapping caps how many concurrent invocations that queue can drive, so the consumer stays at 50 or fewer and the remaining messages wait in the queue; it is a bulkhead in front of the database. Reserved concurrency of 300 on the payment function sets aside capacity that other functions can't consume, so the payment path keeps scaling during a sale."
    fr: "La concurrence maximale du mappage de source d'événements SQS plafonne le nombre d'appels simultanés que la file peut déclencher : le consommateur reste à 50 au plus et les autres messages attendent dans la file ; c'est un cloisonnement (bulkhead) devant la base. Une concurrence réservée de 300 sur la fonction de paiement met de côté une capacité que les autres fonctions ne peuvent pas consommer, si bien que le chemin de paiement continue de monter en charge pendant une vente."
  options:
    a: { en: "Reserved concurrency of 0 stops all order processing during the sale and depends on manual changes, instead of processing at a controlled rate.", fr: "Une concurrence réservée de 0 arrête tout traitement des commandes pendant la vente et dépend de changements manuels, au lieu de traiter à un débit maîtrisé." }
    c: { en: "Provisioned mode is designed to scale faster and higher, it doesn't cap concurrency, and it can't be combined with the maximum concurrency setting.", fr: "Le mode provisionné est conçu pour monter plus vite et plus haut, il ne plafonne pas la concurrence et ne peut pas être combiné avec le paramètre de concurrence maximale." }
    d: { en: "Larger batches reduce the number of invocations but don't put an upper limit on the concurrency that the queue can drive.", fr: "Des lots plus grands réduisent le nombre d'appels mais n'imposent pas de limite supérieure à la concurrence que la file peut déclencher." }
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
