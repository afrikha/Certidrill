id: sapc03-4b-drs-drill-post-launch
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer protects 150 on-premises servers with AWS Elastic Disaster Recovery (AWS DRS). Auditors require a quarterly disaster recovery test that proves that each recovered server boots, that the expected application processes run, and that the web servers return HTTP 200 responses. The evidence must be produced automatically rather than by engineers logging in to each server. The test must not affect the production servers. It also must not increase the RPO of the replication while the test runs.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un détaillant protège 150 serveurs sur site avec AWS Elastic Disaster Recovery (AWS DRS). Les auditeurs exigent un test trimestriel de reprise après sinistre qui prouve que chaque serveur récupéré démarre, que les processus applicatifs attendus s'exécutent et que les serveurs web renvoient des réponses HTTP 200. Les preuves doivent être produites automatiquement plutôt que par des ingénieurs qui se connectent à chaque serveur. Le test ne doit pas affecter les serveurs de production. Il ne doit pas non plus augmenter le RPO de la réplication pendant son exécution.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Pause data replication for all source servers during the test so that the drill instances are launched from a consistent and frozen state.", fr: "Suspendre la réplication des données de tous les serveurs sources pendant le test afin que les instances d'exercice soient lancées depuis un état cohérent et figé." }
    - id: b
      text: { en: "Launch drill instances from AWS DRS into an isolated recovery subnet that has no route to the production network.", fr: "Lancer des instances d'exercice (drill) depuis AWS DRS dans un sous-réseau de reprise isolé sans route vers le réseau de production." }
    - id: c
      text: { en: "Use test launches of AWS Transform MGN for the servers, because test launches do not use the DRS replication staging area.", fr: "Utiliser les lancements de test d'AWS Transform MGN pour les serveurs, car ces lancements n'utilisent pas la zone de transit de réplication DRS." }
    - id: d
      text: { en: "Perform a failback to the on-premises servers after each drill so that replication restarts from a known state for the next quarter.", fr: "Effectuer une restauration (failback) vers les serveurs sur site après chaque exercice afin que la réplication reparte d'un état connu pour le trimestre suivant." }
    - id: e
      text: { en: "Activate the DRS post-launch actions for process status validation and HTTP/HTTPS response validation on the source servers.", fr: "Activer les actions post-lancement DRS de validation de l'état des processus et de validation des réponses HTTP/HTTPS sur les serveurs sources." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A DRS drill launches instances from a point-in-time snapshot without stopping replication, so the RPO and the source servers are not affected; an isolated subnet keeps the drill instances away from production. Predefined post-launch actions run through AWS Systems Manager on the launched instances and report results, including checks that listed processes run and that HTTP/HTTPS endpoints respond."
    fr: "Un exercice DRS lance des instances depuis un instantané à un moment donné sans arrêter la réplication : le RPO et les serveurs sources ne sont pas affectés ; un sous-réseau isolé tient les instances d'exercice à l'écart de la production. Les actions post-lancement prédéfinies s'exécutent via AWS Systems Manager sur les instances lancées et rapportent leurs résultats, notamment la vérification que les processus listés s'exécutent et que les points de terminaison HTTP/HTTPS répondent."
  options:
    a:
      en: "Pausing replication is unnecessary because drills do not stop replication, and it would increase the RPO during the test."
      fr: "Suspendre la réplication est inutile car les exercices n'arrêtent pas la réplication, et cela augmenterait le RPO pendant le test."
    c:
      en: "AWS Transform MGN is a migration service; the servers are protected by DRS, and replicating them with a second service adds agents and cost without testing the DRS recovery."
      fr: "AWS Transform MGN est un service de migration ; les serveurs sont protégés par DRS, et les répliquer avec un second service ajoute agents et coûts sans tester la reprise DRS."
    d:
      en: "Failback returns production from AWS to the source site after a real recovery; it is not needed after a drill, and it would disrupt production."
      fr: "La restauration (failback) ramène la production d'AWS vers le site source après une vraie reprise ; elle n'est pas nécessaire après un exercice et perturberait la production."
references:
  - title: Predefined post-launch actions
    url: https://docs.aws.amazon.com/drs/latest/userguide/predefined-post-launch-actions-default.html
  - title: AWS Elastic Disaster Recovery FAQs
    url: https://aws.amazon.com/disaster-recovery/faqs/
