id: sapc03-4b-arh-daily-drift-terraform
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech platform team manages 12 applications with Terraform, and the Terraform state files are stored in Amazon S3. Each application was added to AWS Resilience Hub from its state file and has been assessed successfully once. The applications change every week, and some changes have silently removed redundancy. The site reliability team wants every application to be assessed every day without writing or maintaining code. It also wants a message on an Amazon SNS topic that the central operations account owns in another Region whenever an application drifts from its resiliency policy.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme d'une fintech gère 12 applications avec Terraform, et les fichiers d'état Terraform sont stockés dans Amazon S3. Chaque application a été ajoutée à AWS Resilience Hub à partir de son fichier d'état et a déjà été évaluée une fois avec succès. Les applications changent chaque semaine, et certaines modifications ont supprimé de la redondance sans que personne ne le remarque. L'équipe SRE veut que chaque application soit évaluée chaque jour sans écrire ni maintenir de code. Elle veut aussi un message sur une rubrique Amazon SNS détenue par le compte d'exploitation central dans une autre Région chaque fois qu'une application dérive de sa politique de résilience.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EventBridge Scheduler schedule that invokes a Lambda function every day to start an assessment for each application and publish a summary of the results to the central SNS topic.", fr: "Créer une planification Amazon EventBridge Scheduler qui invoque chaque jour une fonction Lambda pour lancer une évaluation de chaque application et publier un résumé des résultats sur la rubrique SNS centrale." }
    - id: b
      text: { en: "Schedule AWS CloudFormation drift detection for the resources of each application every day, and send the drift results to the central SNS topic through an EventBridge rule.", fr: "Planifier chaque jour la détection de dérive AWS CloudFormation pour les ressources de chaque application, et envoyer les résultats de dérive à la rubrique SNS centrale via une règle EventBridge." }
    - id: c
      text: { en: "Write an AWS Config custom rule that compares the Terraform state files with the deployed resources every day and notifies the central SNS topic when they differ.", fr: "Écrire une règle personnalisée AWS Config qui compare chaque jour les fichiers d'état Terraform aux ressources déployées et notifie la rubrique SNS centrale en cas de différence." }
    - id: d
      text: { en: "Turn on Automatically assess daily and Get notified when the application drifts for each application with the ARN of the central SNS topic, and allow Resilience Hub to publish to it.", fr: "Activer Automatically assess daily et Get notified when the application drifts pour chaque application avec l'ARN de la rubrique SNS centrale, et autoriser Resilience Hub à y publier." }
answer: { optionId: d }
explanation:
  correct:
    en: "Resilience Hub has a built-in daily schedule that starts after the first successful manual assessment, and a drift notification that fires when an application drifts from its resiliency policy or its resources drift. The notification can target an SNS topic in another account or Region by ARN, provided the topic policy lets Resilience Hub publish to it."
    fr: "Resilience Hub propose une planification quotidienne intégrée qui démarre après la première évaluation manuelle réussie, et une notification de dérive déclenchée quand une application dérive de sa politique de résilience ou que ses ressources dérivent. La notification peut cibler par son ARN une rubrique SNS d'un autre compte ou d'une autre Région, à condition que la politique de la rubrique autorise Resilience Hub à y publier."
  options:
    a:
      en: "A scheduled Lambda function works, but it is custom code to write and maintain, which the team wants to avoid when the feature is built in."
      fr: "Une fonction Lambda planifiée fonctionne, mais c'est du code personnalisé à écrire et à maintenir, ce que l'équipe veut éviter quand la fonctionnalité est intégrée."
    b:
      en: "The applications are deployed with Terraform, not CloudFormation stacks, and configuration drift does not tell whether the resiliency policy is still met."
      fr: "Les applications sont déployées avec Terraform, pas avec des piles CloudFormation, et une dérive de configuration n'indique pas si la politique de résilience est toujours respectée."
    c:
      en: "A custom Config rule is code to write and maintain, and it detects differences from the state file rather than drift from the RTO and RPO targets of the policy."
      fr: "Une règle Config personnalisée est du code à écrire et à maintenir, et elle détecte des écarts avec le fichier d'état plutôt qu'une dérive par rapport aux objectifs de RTO et de RPO de la politique."
references:
  - title: Setup scheduled assessments and drift notification
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/scheduled-assessment.html
  - title: Add resource collections
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/discover-structure.html
