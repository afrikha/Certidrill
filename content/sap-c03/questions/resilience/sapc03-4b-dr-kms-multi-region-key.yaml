id: sapc03-4b-dr-kms-multi-region-key
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A health-tech company encrypts patient documents on the client side with the AWS Encryption SDK and a customer managed AWS KMS key in the eu-west-1 Region. The ciphertext is stored in an Amazon DynamoDB global table that replicates to a warm standby in eu-central-1. During a DR test that isolated eu-west-1, the standby application could read every item but could not decrypt any document, because the KMS key exists only in eu-west-1. The company requires the standby to decrypt both existing and new documents without any call to eu-west-1. The solution must minimize ongoing operational effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de technologies de santé chiffre côté client les documents des patients avec l'AWS Encryption SDK et une clé AWS KMS gérée par le client dans la Région eu-west-1. Le texte chiffré est stocké dans une table globale Amazon DynamoDB qui se réplique vers une veille active dans eu-central-1. Lors d'un test de reprise qui isolait eu-west-1, l'application de secours pouvait lire chaque élément mais ne pouvait déchiffrer aucun document, car la clé KMS n'existe que dans eu-west-1. L'entreprise exige que la veille déchiffre les documents existants comme les nouveaux sans aucun appel vers eu-west-1. La solution doit réduire au minimum l'effort opérationnel récurrent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Grant the IAM role of the standby application permission to use the key in eu-west-1, and configure the Encryption SDK in eu-central-1 to call the eu-west-1 KMS endpoint.", fr: "Accorder au rôle IAM de l'application de secours l'autorisation d'utiliser la clé d'eu-west-1, et configurer l'Encryption SDK d'eu-central-1 pour qu'il appelle le point de terminaison KMS d'eu-west-1." }
    - id: b
      text: { en: "Create a multi-Region primary key in eu-west-1 and a replica in eu-central-1, re-encrypt the existing documents under the new key, and have each Region use its local key.", fr: "Créer une clé principale multi-Régions dans eu-west-1 et un réplica dans eu-central-1, rechiffrer les documents existants sous la nouvelle clé, et faire utiliser à chaque Région sa clé locale." }
    - id: c
      text: { en: "Update the existing customer managed key to make it a multi-Region key, replicate it to eu-central-1, and have the standby application use the replica key for decryption.", fr: "Modifier la clé gérée par le client existante pour en faire une clé multi-Régions, la répliquer dans eu-central-1, et faire utiliser la clé réplica par l'application de secours pour le déchiffrement." }
    - id: d
      text: { en: "Export the key material of the existing key from eu-west-1, import it into a new key in eu-central-1, and have the standby application use the imported key for decryption.", fr: "Exporter le matériel de clé de la clé existante depuis eu-west-1, l'importer dans une nouvelle clé d'eu-central-1, et faire utiliser la clé importée par l'application de secours pour le déchiffrement." }
answer: { optionId: b }
explanation:
  correct:
    en: "Related multi-Region keys share the same key ID and key material, so data encrypted in one Region can be decrypted in another without re-encryption or a cross-Region call, which is a documented disaster recovery use case. An existing single-Region key cannot be converted, so the documents must be re-encrypted once under the new multi-Region key; afterward each Region uses its local key with no ongoing synchronization."
    fr: "Des clés multi-Régions associées partagent le même ID de clé et le même matériel de clé : des données chiffrées dans une Région peuvent être déchiffrées dans une autre sans rechiffrement ni appel entre Régions, ce qui est un cas d'usage documenté de reprise après sinistre. Une clé monorégion existante ne peut pas être convertie : les documents doivent être rechiffrés une fois sous la nouvelle clé multi-Régions ; ensuite chaque Région utilise sa clé locale sans synchronisation récurrente."
  options:
    a:
      en: "Calling the KMS endpoint of eu-west-1 keeps the dependency on the Region that the standby must survive, so decryption still fails during the outage."
      fr: "Appeler le point de terminaison KMS d'eu-west-1 conserve la dépendance envers la Région à laquelle la veille doit survivre : le déchiffrement échoue toujours pendant la panne."
    c:
      en: "AWS KMS cannot convert a single-Region key into a multi-Region key; the multi-Region property is set only when a key is created."
      fr: "AWS KMS ne peut pas convertir une clé monorégion en clé multi-Régions ; la propriété multi-Régions se fixe uniquement à la création d'une clé."
    d:
      en: "AWS KMS does not let you export the key material of a KMS key, so it cannot be copied into a key in another Region."
      fr: "AWS KMS ne permet pas d'exporter le matériel de clé d'une clé KMS : il ne peut pas être copié dans une clé d'une autre Région."
references:
  - title: Multi-Region keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
