id: sapc03-4c-dynamodb-deletion-pitr
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A fintech company stores customer ledgers in Amazon DynamoDB tables in several production accounts. Twice this year, a maintenance script that ran with the wrong environment variables deleted a production table, and once it overwrote thousands of items with incorrect balances. The company must prevent production tables from being deleted by mistake. After a bad write, it must be able to restore a table to any second within the last 7 days. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une fintech stocke les registres de ses clients dans des tables Amazon DynamoDB de plusieurs comptes de production. Deux fois cette année, un script de maintenance exécuté avec de mauvaises variables d'environnement a supprimé une table de production, et une fois il a écrasé des milliers d'éléments avec des soldes incorrects. L'entreprise doit empêcher la suppression par erreur des tables de production. Après une mauvaise écriture, elle doit pouvoir restaurer une table à n'importe quelle seconde des 7 derniers jours. La solution doit avoir la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on deletion protection for each production table, and turn on point-in-time recovery with a recovery period of 7 days."
        fr: "Activer la protection contre la suppression pour chaque table de production, et activer la restauration à un instant dans le passé (PITR) avec une période de récupération de 7 jours."
    - id: b
      text:
        en: "Create daily on-demand backups of each table with AWS Backup, and add an IAM policy that denies dynamodb:DeleteTable to the maintenance script's role."
        fr: "Créer des sauvegardes à la demande quotidiennes de chaque table avec AWS Backup, et ajouter une politique IAM qui refuse dynamodb:DeleteTable au rôle du script de maintenance."
    - id: c
      text:
        en: "Convert each table into a global table with a replica in a second Region, and restore from the replica when a table is deleted or overwritten."
        fr: "Convertir chaque table en table globale avec un réplica dans une deuxième Région, et restaurer depuis le réplica quand une table est supprimée ou écrasée."
    - id: d
      text:
        en: "Stream every change with DynamoDB Streams to a Lambda function that writes the item history to Amazon S3, and rebuild tables from that history when needed."
        fr: "Diffuser chaque modification avec DynamoDB Streams vers une fonction Lambda qui écrit l'historique des éléments dans Amazon S3, et reconstruire les tables à partir de cet historique si nécessaire."
answer: { optionId: a }
explanation:
  correct:
    en: "Deletion protection blocks DeleteTable on a table until the setting is turned off, whoever runs the script. Point-in-time recovery keeps recovery points at per-second granularity for a configurable period of 1 to 35 days and restores to a new table, which covers the 7-day window without any code."
    fr: "La protection contre la suppression bloque DeleteTable sur une table tant que le paramètre n'est pas désactivé, quel que soit l'exécutant du script. La restauration à un instant dans le passé conserve des points de récupération à la seconde près sur une période configurable de 1 à 35 jours et restaure vers une nouvelle table, ce qui couvre la fenêtre de 7 jours sans aucun code."
  options:
    b: { en: "Daily backups can lose up to a day of writes, so they can't restore to any second, and the IAM deny covers only one role.", fr: "Des sauvegardes quotidiennes peuvent perdre jusqu'à une journée d'écritures : elles ne permettent pas de restaurer à n'importe quelle seconde, et le refus IAM ne couvre qu'un seul rôle." }
    c: { en: "A global table replicates the incorrect writes to every replica within seconds, so the replica holds the same bad data.", fr: "Une table globale réplique les écritures incorrectes vers chaque réplica en quelques secondes : le réplica contient les mêmes mauvaises données." }
    d: { en: "A custom change archive takes code to build and maintain, and it doesn't prevent a table from being deleted.", fr: "Une archive personnalisée des modifications demande du code à créer et maintenir, et elle n'empêche pas la suppression d'une table." }
references:
  - title: Point-in-time backups for DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html
