id: sapc03-4b-fis-multi-account-test
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's order platform spans three AWS accounts in the us-east-1 Region: a front-end account, a services account and a data account. The resilience team wants one DR test that disrupts resources in the three accounts at the same time, configured, logged and run centrally from a resilience-testing account. The customer-facing error-rate alarm is defined in the resilience-testing account by using CloudWatch cross-account observability. The test must stop automatically if that alarm enters the ALARM state. The test must also disrupt the same physical Availability Zone in every account.

    Which solution will meet these requirements?
  fr: |
    La plateforme de commandes d'une entreprise s'étend sur trois comptes AWS dans la Région us-east-1 : un compte front-end, un compte de services et un compte de données. L'équipe résilience veut un seul test de reprise qui perturbe en même temps des ressources des trois comptes, configuré, journalisé et exécuté de manière centralisée depuis un compte de tests de résilience. L'alarme de taux d'erreurs côté client est définie dans le compte de tests de résilience à l'aide de l'observabilité entre comptes de CloudWatch. Le test doit s'arrêter automatiquement si cette alarme passe à l'état ALARM. Il doit aussi perturber la même zone de disponibilité physique dans chaque compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS FIS experiment template in each account that targets the Availability Zone name us-east-1a, and start the three experiments at the same time with Amazon EventBridge Scheduler.", fr: "Créer dans chaque compte un modèle d'expérience AWS FIS qui cible le nom de zone de disponibilité us-east-1a, et lancer les trois expériences en même temps avec Amazon EventBridge Scheduler." }
    - id: b
      text: { en: "Build an AWS Step Functions workflow in the resilience-testing account that assumes a role in each account to stop instances and change network ACLs, and that stops when the alarm fires.", fr: "Créer dans le compte de tests de résilience un workflow AWS Step Functions qui assume un rôle dans chaque compte pour arrêter des instances et modifier des ACL réseau, et qui s'arrête quand l'alarme se déclenche." }
    - id: c
      text: { en: "Create an AWS FIS multi-account experiment template in the resilience-testing account that filters targets on the Availability Zone name us-east-1a, with a stop condition on the error-rate alarm.", fr: "Créer dans le compte de tests de résilience un modèle d'expérience AWS FIS multicomptes qui filtre les cibles sur le nom de zone de disponibilité us-east-1a, avec une condition d'arrêt sur l'alarme de taux d'erreurs." }
    - id: d
      text: { en: "Create an AWS FIS multi-account experiment template in the resilience-testing account with a target account configuration per account, Availability Zone ID filters and a stop condition on the alarm.", fr: "Créer dans le compte de tests de résilience un modèle d'expérience AWS FIS multicomptes avec une configuration de compte cible par compte, des filtres sur l'ID de zone de disponibilité et une condition d'arrêt sur l'alarme." }
answer: { optionId: d }
explanation:
  correct:
    en: "An FIS multi-account experiment runs from an orchestrator account that owns the template and centralizes logging, with a target account configuration (account ID and IAM role) for each target account in the same Region. Availability Zone names map to different physical zones in different accounts, so AWS recommends targeting AZ IDs such as use1-az1, and a stop condition on the CloudWatch alarm halts the experiment."
    fr: "Une expérience FIS multicomptes s'exécute depuis un compte orchestrateur qui détient le modèle et centralise la journalisation, avec une configuration de compte cible (ID de compte et rôle IAM) pour chaque compte cible de la même Région. Les noms de zones de disponibilité correspondent à des zones physiques différentes selon les comptes : AWS recommande de cibler des ID de zone comme use1-az1, et une condition d'arrêt sur l'alarme CloudWatch interrompt l'expérience."
  options:
    a:
      en: "Three separate experiments are not configured and logged centrally, and the name us-east-1a can designate a different physical Availability Zone in each account."
      fr: "Trois expériences distinctes ne sont ni configurées ni journalisées de façon centralisée, et le nom us-east-1a peut désigner une zone de disponibilité physique différente dans chaque compte."
    b:
      en: "A custom workflow rebuilds fault injection, safety controls and logging that FIS provides, and changing network ACLs by script risks leaving production broken."
      fr: "Un workflow personnalisé recrée l'injection de pannes, les contrôles de sécurité et la journalisation que fournit FIS, et modifier des ACL réseau par script risque de laisser la production cassée."
    c:
      en: "Filtering on the Availability Zone name does not guarantee the same physical zone in every account; AZ IDs are consistent across accounts."
      fr: "Filtrer sur le nom de zone de disponibilité ne garantit pas la même zone physique dans chaque compte ; les ID de zone sont cohérents d'un compte à l'autre."
references:
  - title: Multi-account experiments for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/multi-account.html
