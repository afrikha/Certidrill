id: sapc03-4a-dms-sap-ase-aurora
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An airline runs its crew scheduling system on a 6 TB SAP ASE database in its data center. The database contains about 1,800 stored procedures, and the airline wants to move to Amazon Aurora PostgreSQL in the Europe (Ireland) Region to reduce licensing costs. The conversion of the stored procedures must be as automated as possible, because the team has little SAP ASE expertise. The system must stay in use during the migration, and cutover downtime must be less than 30 minutes. The source database is a single server, not a cluster or a warm standby pair.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une compagnie aérienne exécute son système de planification des équipages sur une base SAP ASE de 6 To dans son centre de données. La base contient environ 1 800 procédures stockées, et la compagnie veut passer à Amazon Aurora PostgreSQL dans la Région Europe (Irlande) pour réduire ses coûts de licence. La conversion des procédures stockées doit être aussi automatisée que possible, car l'équipe a peu d'expertise SAP ASE. Le système doit rester utilisé pendant la migration, et l'interruption au basculement doit être inférieure à 30 minutes. La base source est un serveur unique, pas un cluster ni une paire en attente semi-active (warm standby).

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Use AWS DMS homogeneous data migrations to move the data and code with the native database tools."
        fr: "Utiliser les migrations de données homogènes AWS DMS pour déplacer les données et le code avec les outils natifs de la base."
    - id: b
      text:
        en: "Create a DMS Schema Conversion migration project from SAP ASE to Aurora PostgreSQL, turn on generative AI conversion, and apply the converted code."
        fr: "Créer un projet de migration DMS Schema Conversion de SAP ASE vers Aurora PostgreSQL, activer la conversion par IA générative, puis appliquer le code converti."
    - id: c
      text:
        en: "Restore a native SAP ASE database dump into Aurora PostgreSQL from Amazon S3 with the aws_s3 extension."
        fr: "Restaurer un export natif de la base SAP ASE dans Aurora PostgreSQL depuis Amazon S3 avec l'extension aws_s3."
    - id: d
      text:
        en: "Copy the SAP ASE database device files to Amazon S3 with AWS DataSync and attach them to the Aurora cluster."
        fr: "Copier les fichiers de périphériques de la base SAP ASE dans Amazon S3 avec AWS DataSync, puis les attacher au cluster Aurora."
    - id: e
      text:
        en: "Run an AWS DMS full load and CDC task from SAP ASE to Aurora PostgreSQL, and cut over when the replication latency is close to zero."
        fr: "Exécuter une tâche AWS DMS de chargement complet et de CDC de SAP ASE vers Aurora PostgreSQL, puis basculer lorsque la latence de réplication est proche de zéro."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "DMS Schema Conversion converts SAP ASE schemas and code to Aurora PostgreSQL, and this path supports generative AI conversion, which converts more of the objects that the rules engine cannot fully convert; Europe (Ireland) is one of the Regions where it is available. A DMS full load and CDC task then migrates the data while the system stays in use, which keeps the cutover short."
    fr: "DMS Schema Conversion convertit les schémas et le code SAP ASE vers Aurora PostgreSQL, et ce chemin prend en charge la conversion par IA générative, qui convertit davantage d'objets que le moteur de règles ne peut pas convertir entièrement ; Europe (Irlande) fait partie des Régions où elle est disponible. Une tâche DMS de chargement complet et de CDC migre ensuite les données pendant que le système reste utilisé, ce qui raccourcit le basculement."
  options:
    a: { en: "Homogeneous data migrations work only between the same engines, such as PostgreSQL to Aurora PostgreSQL, not from SAP ASE.", fr: "Les migrations de données homogènes ne fonctionnent qu'entre moteurs identiques, par exemple de PostgreSQL vers Aurora PostgreSQL, pas depuis SAP ASE." }
    c: { en: "Aurora PostgreSQL cannot restore an SAP ASE dump; the aws_s3 extension imports data files such as CSV, not foreign database backups.", fr: "Aurora PostgreSQL ne peut pas restaurer un export SAP ASE ; l'extension aws_s3 importe des fichiers de données comme du CSV, pas des sauvegardes d'autres moteurs." }
    d: { en: "Aurora manages its own storage and cannot attach database files from another engine.", fr: "Aurora gère son propre stockage et ne peut pas attacher les fichiers de base de données d'un autre moteur." }
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
  - title: Using an SAP ASE database as a source for AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.SAP.html
