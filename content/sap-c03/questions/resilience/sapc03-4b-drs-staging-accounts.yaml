id: sapc03-4b-drs-staging-accounts
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer must protect 1,100 on-premises servers with AWS Elastic Disaster Recovery (AWS DRS) in the eu-west-1 Region. The cloud center of excellence requires that all drill and recovery instances launch in a single recovery account, where networking, IAM and monitoring are centralized. The operations team must be able to launch drills, recoveries and failbacks for every server from that account only. During a pilot, the team added servers to the recovery account until AWS DRS stopped accepting new replicating source servers at 300. The company cannot use another Region for recovery.

    Which design will meet these requirements?
  fr: |
    Un industriel doit protéger 1 100 serveurs sur site avec AWS Elastic Disaster Recovery (AWS DRS) dans la Région eu-west-1. Le centre d'excellence cloud exige que toutes les instances d'exercice et de reprise démarrent dans un seul compte de reprise, où le réseau, IAM et la supervision sont centralisés. L'équipe d'exploitation doit pouvoir lancer les exercices, les reprises et les restaurations (failback) de tous les serveurs depuis ce seul compte. Lors d'un pilote, l'équipe a ajouté des serveurs au compte de reprise jusqu'à ce qu'AWS DRS refuse de nouveaux serveurs sources en réplication à 300. L'entreprise ne peut pas utiliser une autre Région pour la reprise.

    Quelle conception répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request a Service Quotas increase of the maximum total replicating source servers per account to 1,100 for the recovery account in eu-west-1.", fr: "Demander à Service Quotas une augmentation du nombre maximal de serveurs sources en réplication par compte à 1 100 pour le compte de reprise dans eu-west-1." }
    - id: b
      text: { en: "Replicate 300 servers into eu-west-1 and the remaining servers into three other Regions of the recovery account, and launch the recoveries from each Region.", fr: "Répliquer 300 serveurs dans eu-west-1 et les autres dans trois autres Régions du compte de reprise, et lancer les reprises depuis chaque Région." }
    - id: c
      text: { en: "Protect 300 servers with AWS DRS and the other 800 servers with AWS Transform MGN in the recovery account, and launch test or cutover instances for all servers during a disaster.", fr: "Protéger 300 serveurs avec AWS DRS et les 800 autres avec AWS Transform MGN dans le compte de reprise, et lancer des instances de test ou de bascule pour tous les serveurs lors d'un sinistre." }
    - id: d
      text: { en: "Create four staging accounts that each replicate up to 300 servers, trust the recovery account with the staging role, and create extended source servers in the recovery account.", fr: "Créer quatre comptes de transit qui répliquent chacun jusqu'à 300 serveurs, approuver le compte de reprise avec le rôle de transit (staging role), et créer des serveurs sources étendus dans le compte de reprise." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS DRS supports at most 300 replicating source servers per account and Region, and this quota is not adjustable. To protect more, replication runs in several staging accounts, each trusting the target account; extended source servers in the target account inherit replication and points in time from the staging accounts, so drills, recoveries and failbacks are all launched from the single recovery account."
    fr: "AWS DRS prend en charge au plus 300 serveurs sources en réplication par compte et par Région, et ce quota n'est pas ajustable. Pour en protéger davantage, la réplication s'effectue dans plusieurs comptes de transit qui approuvent chacun le compte cible ; les serveurs sources étendus du compte cible héritent de la réplication et des points dans le temps des comptes de transit : exercices, reprises et restaurations sont tous lancés depuis le seul compte de reprise."
  options:
    a:
      en: "The maximum total replicating source servers per account is a fixed quota of 300 per Region that Service Quotas cannot raise."
      fr: "Le nombre maximal de serveurs sources en réplication par compte est un quota fixe de 300 par Région que Service Quotas ne peut pas relever."
    b:
      en: "The company cannot recover in another Region, and spreading servers across Regions also splits the recovery environment that must stay centralized in eu-west-1."
      fr: "L'entreprise ne peut pas reprendre dans une autre Région, et répartir les serveurs entre Régions éclate aussi l'environnement de reprise qui doit rester centralisé dans eu-west-1."
    c:
      en: "AWS Transform MGN is a migration service without DR point-in-time recovery, drills and failback, so 800 servers would not be protected as required."
      fr: "AWS Transform MGN est un service de migration sans récupération à un moment donné, exercices ni restauration (failback) de reprise après sinistre : 800 serveurs ne seraient pas protégés comme exigé."
references:
  - title: Using multiple staging accounts with AWS DRS
    url: https://docs.aws.amazon.com/drs/latest/userguide/multi-account.html
  - title: AWS Elastic Disaster Recovery endpoints and quotas
    url: https://docs.aws.amazon.com/general/latest/gr/drs.html
