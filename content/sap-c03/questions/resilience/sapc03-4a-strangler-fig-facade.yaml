id: sapc03-4a-strangler-fig-facade
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company runs a large monolithic Java application on Amazon EC2 instances behind an internal Application Load Balancer, with an Amazon RDS database. The company wants to move to microservices, but leadership rejected a full rewrite because it is too risky for an application of this size. The business requires new features to keep shipping during the transformation, and customers must keep using the same URLs. The company has never used AWS Migration Hub. The architects want each feature to move to its own AWS Lambda based service one at a time, until the monolith can be decommissioned.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exécute une grande application Java monolithique sur des instances Amazon EC2 derrière un Application Load Balancer interne, avec une base Amazon RDS. L'entreprise veut passer aux microservices, mais la direction a rejeté une réécriture complète, jugée trop risquée pour une application de cette taille. Le métier exige que de nouvelles fonctionnalités continuent d'être livrées pendant la transformation, et les clients doivent continuer à utiliser les mêmes URL. L'entreprise n'a jamais utilisé AWS Migration Hub. Les architectes veulent déplacer les fonctionnalités une par une vers leur propre service basé sur AWS Lambda, jusqu'à pouvoir mettre le monolithe hors service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Build all of the microservices in parallel in a new AWS account, test them against a copy of the database, and switch the customer DNS records to the new application in a single cutover."
        fr: "Construire tous les microservices en parallèle dans un nouveau compte AWS, les tester sur une copie de la base, puis basculer les enregistrements DNS clients vers la nouvelle application en un seul basculement."
    - id: b
      text:
        en: "Create an AWS Migration Hub Refactor Spaces environment and application, and add a route for each extracted feature that sends its path to the new Lambda function."
        fr: "Créer un environnement et une application AWS Migration Hub Refactor Spaces, puis ajouter pour chaque fonctionnalité extraite une route qui envoie son chemin vers la nouvelle fonction Lambda."
    - id: c
      text:
        en: "Rewrite the whole application as microservices, and use Amazon Route 53 weighted records to send 10 % of all customer traffic to the new application at first and then increase the weight every week."
        fr: "Réécrire toute l'application en microservices, puis utiliser des enregistrements pondérés Amazon Route 53 pour envoyer d'abord 10 % de tout le trafic client vers la nouvelle application et augmenter le poids chaque semaine."
    - id: d
      text:
        en: "Put an Amazon API Gateway HTTP API in front of the monolith with a default route through a VPC link to its load balancer, and add a route that sends each extracted feature's path to its Lambda function."
        fr: "Placer une API HTTP Amazon API Gateway devant le monolithe avec une route par défaut passant par un lien VPC vers son équilibreur de charge, puis ajouter une route qui envoie le chemin de chaque fonctionnalité extraite vers sa fonction Lambda."
answer: { optionId: d }
explanation:
  correct:
    en: "This is the strangler fig pattern: a proxy layer initially routes everything to the monolith, then each extracted feature is routed by path to its new service while customers keep the same URLs. API Gateway is serverless and runs across multiple Availability Zones, which limits the risk of the proxy becoming a single point of failure, and a VPC link reaches the private load balancer."
    fr: "Il s'agit du modèle strangler fig : une couche proxy envoie d'abord tout vers le monolithe, puis chaque fonctionnalité extraite est routée par chemin vers son nouveau service, tandis que les clients conservent les mêmes URL. API Gateway est sans serveur et s'exécute sur plusieurs zones de disponibilité, ce qui limite le risque que le proxy devienne un point de défaillance unique, et un lien VPC atteint l'équilibreur de charge privé."
  options:
    a: { en: "A single big-bang cutover of a full rewrite is the risky approach that leadership rejected.", fr: "Un basculement unique d'une réécriture complète est l'approche risquée que la direction a rejetée." }
    b: { en: "Refactor Spaces has not been open to new customers since November 7, 2025, so a company that has never used Migration Hub cannot adopt it.", fr: "Refactor Spaces n'est plus ouvert aux nouveaux clients depuis le 7 novembre 2025 : une entreprise qui n'a jamais utilisé Migration Hub ne peut pas l'adopter." }
    c: { en: "Weighted DNS shifts traffic between two complete applications, so it still requires a full rewrite instead of moving one feature at a time.", fr: "Un DNS pondéré répartit le trafic entre deux applications complètes : il exige toujours une réécriture complète au lieu de déplacer une fonctionnalité à la fois." }
references:
  - title: Strangler fig pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/strangler-fig.html
  - title: "Tutorial: Create an HTTP API with a private integration to an Amazon ECS service"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-private-integration.html
