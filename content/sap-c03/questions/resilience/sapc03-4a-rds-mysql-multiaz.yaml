id: sapc03-4a-rds-mysql-multiaz
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company is migrating its booking platform to AWS. The platform uses a MySQL 8.0 database that runs on two virtual machines with asynchronous replication and custom failover scripts that the DBAs maintain. The DBAs spend many hours each month on operating system patching, backups and failover tests. The company wants a managed database with automatic failover to a synchronous standby in another Availability Zone and automated backups. The application must keep using the MySQL engine and its existing drivers.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une agence de voyages migre sa plateforme de réservation vers AWS. La plateforme utilise une base MySQL 8.0 qui s'exécute sur deux machines virtuelles avec une réplication asynchrone et des scripts de basculement personnalisés que les DBA maintiennent. Les DBA passent chaque mois de nombreuses heures sur les correctifs du système d'exploitation, les sauvegardes et les tests de basculement. L'entreprise veut une base gérée avec un basculement automatique vers une instance de secours synchrone dans une autre zone de disponibilité et des sauvegardes automatisées. L'application doit continuer à utiliser le moteur MySQL et ses pilotes existants.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Rehost both virtual machines to Amazon EC2 in two Availability Zones with AWS Transform MGN, keep the replication and failover scripts, and schedule backups with AWS Backup."
        fr: "Réhéberger les deux machines virtuelles sur Amazon EC2 dans deux zones de disponibilité avec AWS Transform MGN, conserver la réplication et les scripts de basculement, et planifier les sauvegardes avec AWS Backup."
    - id: b
      text:
        en: "Migrate the database to an Amazon RDS for MySQL Multi-AZ DB instance deployment with automated backups, and point the application to the DB instance endpoint."
        fr: "Migrer la base vers un déploiement d'instance de base de données Multi-AZ Amazon RDS for MySQL avec sauvegardes automatisées, puis faire pointer l'application vers le point de terminaison de l'instance."
    - id: c
      text:
        en: "Migrate the data to Amazon DynamoDB tables with point-in-time recovery, and change the data access layer of the application to use the DynamoDB API."
        fr: "Migrer les données vers des tables Amazon DynamoDB avec restauration à un instant dans le passé, puis modifier la couche d'accès aux données de l'application pour utiliser l'API DynamoDB."
    - id: d
      text:
        en: "Migrate the database to a Single-AZ Amazon RDS for MySQL DB instance with a read replica in another Availability Zone, and promote the replica manually if the primary fails."
        fr: "Migrer la base vers une instance Amazon RDS for MySQL mono-AZ avec un réplica en lecture dans une autre zone de disponibilité, puis promouvoir le réplica manuellement si l'instance principale tombe en panne."
answer: { optionId: b }
explanation:
  correct:
    en: "A Multi-AZ DB instance deployment keeps a synchronous standby in another Availability Zone and fails over to it automatically, while RDS handles patching and automated backups. This replatform keeps the MySQL engine and drivers and removes the custom scripts."
    fr: "Un déploiement d'instance Multi-AZ maintient une instance de secours synchrone dans une autre zone de disponibilité et bascule automatiquement vers elle, tandis qu'RDS gère les correctifs et les sauvegardes automatisées. Ce changement de plateforme conserve le moteur MySQL et ses pilotes et supprime les scripts personnalisés."
  options:
    a: { en: "A rehost keeps the operating system patching, the replication and the failover scripts that the DBAs want to stop maintaining.", fr: "Un réhébergement conserve les correctifs du système d'exploitation, la réplication et les scripts de basculement que les DBA veulent cesser de maintenir." }
    c: { en: "DynamoDB is not MySQL; the application would need code changes and new drivers.", fr: "DynamoDB n'est pas MySQL : l'application nécessiterait des modifications de code et de nouveaux pilotes." }
    d: { en: "A read replica is asynchronous and its promotion is manual, so this provides neither a synchronous standby nor automatic failover.", fr: "Un réplica en lecture est asynchrone et sa promotion est manuelle : cette solution n'offre ni instance de secours synchrone ni basculement automatique." }
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
