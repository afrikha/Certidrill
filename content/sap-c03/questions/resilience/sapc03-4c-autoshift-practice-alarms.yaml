id: sapc03-4c-autoshift-practice-alarms
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company enabled zonal autoshift in Amazon Application Recovery Controller (ARC) for the Application Load Balancers of its checkout service, which runs in three Availability Zones. ARC runs a practice run for each resource every week, shifting traffic away from one Availability Zone for about 30 minutes. The SRE team wants each practice run to be recorded as FAILED when the p99 checkout latency exceeds the SLO during the shift, so that the result can be used as evidence of the zone failover capability. The deployment pipeline publishes a metric during deployments, which happen several times a day at unpredictable times, and an alarm named deploy-in-progress is in the ALARM state while a deployment runs. Practice runs must not start, or must stop, while a deployment is in progress, and a deployment must not cause a practice run to be recorded as FAILED.

    Which practice run configuration will meet these requirements?
  fr: |
    Une entreprise de distribution a activé le décalage zonal automatique (zonal autoshift) d'Amazon Application Recovery Controller (ARC) pour les Application Load Balancers de son service de paiement, qui s'exécute dans trois zones de disponibilité. ARC effectue chaque semaine un exercice (practice run) pour chaque ressource, en détournant le trafic d'une zone de disponibilité pendant environ 30 minutes. L'équipe SRE veut que chaque exercice soit enregistré comme FAILED quand la latence p99 du paiement dépasse le SLO pendant le décalage, afin d'utiliser le résultat comme preuve de la capacité de basculement de zone. Le pipeline de déploiement publie une métrique pendant les déploiements, qui ont lieu plusieurs fois par jour à des heures imprévisibles, et une alarme nommée deploy-in-progress est à l'état ALARM pendant un déploiement. Les exercices ne doivent pas démarrer, ou doivent s'arrêter, pendant un déploiement, et un déploiement ne doit pas faire enregistrer un exercice comme FAILED.

    Quelle configuration des exercices répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Specify both the p99 latency alarm and the deploy-in-progress alarm as outcome alarms, so that ARC ends the practice run when either alarm enters the ALARM state."
        fr: "Indiquer l'alarme de latence p99 et l'alarme deploy-in-progress comme alarmes de résultat, pour qu'ARC termine l'exercice quand l'une ou l'autre passe à l'état ALARM."
    - id: b
      text:
        en: "Specify the deploy-in-progress alarm as the outcome alarm, and specify the p99 latency alarm as a blocking alarm that ends the practice run when the latency exceeds the SLO."
        fr: "Indiquer l'alarme deploy-in-progress comme alarme de résultat, et l'alarme de latence p99 comme alarme de blocage qui termine l'exercice quand la latence dépasse le SLO."
    - id: c
      text:
        en: "Specify the p99 latency alarm as the outcome alarm, and add blocked windows in UTC that cover the deployment pipeline's usual working hours."
        fr: "Indiquer l'alarme de latence p99 comme alarme de résultat, et ajouter des fenêtres bloquées en UTC qui couvrent les heures habituelles de travail du pipeline de déploiement."
    - id: d
      text:
        en: "Specify the p99 latency alarm as the outcome alarm, and specify the deploy-in-progress alarm as a blocking alarm."
        fr: "Indiquer l'alarme de latence p99 comme alarme de résultat, et l'alarme deploy-in-progress comme alarme de blocage."
answer: { optionId: d }
explanation:
  correct:
    en: "ARC records a practice run as FAILED only when an outcome alarm enters the ALARM state during the run, so the latency alarm must be the outcome alarm. A blocking alarm in the ALARM state prevents practice runs from starting and stops runs in progress, and an interrupted run is recorded as INTERRUPTED, not FAILED, which is the behavior required during deployments."
    fr: "ARC n'enregistre un exercice comme FAILED que si une alarme de résultat passe à l'état ALARM pendant l'exercice : l'alarme de latence doit donc être l'alarme de résultat. Une alarme de blocage à l'état ALARM empêche les exercices de démarrer et arrête ceux en cours, et un exercice interrompu est enregistré comme INTERRUPTED et non FAILED, ce qui est le comportement exigé pendant les déploiements."
  options:
    a: { en: "A deployment would put an outcome alarm in the ALARM state and mark the practice run as FAILED, which the requirements forbid.", fr: "Un déploiement mettrait une alarme de résultat à l'état ALARM et marquerait l'exercice comme FAILED, ce que les exigences interdisent." }
    b: { en: "The roles are reversed: deployments would mark runs as FAILED, and a latency breach would only interrupt the run instead of failing it.", fr: "Les rôles sont inversés : les déploiements marqueraient les exercices comme FAILED, et un dépassement de latence ne ferait qu'interrompre l'exercice au lieu de le faire échouer." }
    c: { en: "Deployments happen at unpredictable times, so fixed blocked windows can't guarantee that no practice run overlaps a deployment.", fr: "Les déploiements ont lieu à des heures imprévisibles : des fenêtres bloquées fixes ne peuvent pas garantir qu'aucun exercice ne chevauche un déploiement." }
references:
  - title: Alarms for practice runs
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-autoshift.how-it-works.alarms.html
  - title: When ARC schedules, starts, and ends practice runs
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-autoshift.how-it-works.scheduled-practice-runs.html
