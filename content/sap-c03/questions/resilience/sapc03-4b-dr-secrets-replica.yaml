id: sapc03-4b-dr-secrets-replica
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a warm standby of its order API in the us-west-2 Region, with the primary stack in us-east-1. The Amazon ECS tasks in both Regions read the database credentials from an AWS Secrets Manager secret in us-east-1 that is encrypted with a customer managed KMS key in us-east-1. Secrets Manager rotates the secret every 30 days. During a DR test that blocked access to us-east-1, the tasks in us-west-2 could not start because they could not retrieve the secret. The company requires the standby tasks to start without depending on us-east-1, and rotated credentials must stay synchronized without manual steps or custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une veille active de son API de commandes dans la Région us-west-2, avec la pile principale dans us-east-1. Les tâches Amazon ECS des deux Régions lisent les identifiants de la base de données dans un secret AWS Secrets Manager d'us-east-1 chiffré avec une clé KMS gérée par le client d'us-east-1. Secrets Manager fait la rotation du secret tous les 30 jours. Lors d'un test de reprise qui bloquait l'accès à us-east-1, les tâches d'us-west-2 n'ont pas pu démarrer car elles ne pouvaient pas récupérer le secret. L'entreprise exige que les tâches de secours démarrent sans dépendre d'us-east-1, et que les identifiants renouvelés restent synchronisés sans étape manuelle ni code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Lambda function that runs after each rotation, reads the new secret value in us-east-1, and writes it to a separate secret in us-west-2 for the standby tasks.", fr: "Créer une fonction Lambda qui s'exécute après chaque rotation, lit la nouvelle valeur du secret dans us-east-1 et l'écrit dans un secret distinct d'us-west-2 pour les tâches de secours." }
    - id: b
      text: { en: "Store a copy of the credentials as a SecureString parameter in Parameter Store in us-west-2, and have the operations team update it after every rotation.", fr: "Stocker une copie des identifiants sous forme de paramètre SecureString dans Parameter Store d'us-west-2, et faire mettre à jour ce paramètre par l'équipe d'exploitation après chaque rotation." }
    - id: c
      text: { en: "Create an interface VPC endpoint for Secrets Manager in the us-west-2 VPC, and keep the task definitions in us-west-2 referencing the ARN of the secret in us-east-1.", fr: "Créer un point de terminaison VPC d'interface pour Secrets Manager dans le VPC d'us-west-2, et laisser les définitions de tâches d'us-west-2 référencer l'ARN du secret d'us-east-1." }
    - id: d
      text: { en: "Replicate the secret to us-west-2 with a replica encrypted by a KMS key in us-west-2, and reference the ARN of the replica secret in the task definitions in us-west-2.", fr: "Répliquer le secret dans us-west-2 avec un réplica chiffré par une clé KMS d'us-west-2, et référencer l'ARN du secret réplica dans les définitions de tâches d'us-west-2." }
answer: { optionId: d }
explanation:
  correct:
    en: "Secrets Manager replica secrets copy the encrypted secret value and metadata to other Regions, and a rotation of the primary propagates to every replica automatically. Each replica is encrypted with a KMS key in its own Region and has the same ARN apart from the Region, so tasks in us-west-2 read the local replica without calling us-east-1; during a long outage, the replica can be promoted to a standalone secret."
    fr: "Les secrets réplicas de Secrets Manager copient la valeur chiffrée et les métadonnées du secret vers d'autres Régions, et une rotation du secret principal se propage automatiquement à chaque réplica. Chaque réplica est chiffré avec une clé KMS de sa propre Région et a le même ARN à la Région près : les tâches d'us-west-2 lisent le réplica local sans appeler us-east-1 ; lors d'une panne longue, le réplica peut être promu en secret autonome."
  options:
    a:
      en: "A custom Lambda function is code to write and maintain, which the requirements exclude, and it reproduces the synchronization that replica secrets provide."
      fr: "Une fonction Lambda personnalisée est du code à écrire et à maintenir, ce que les exigences excluent, et elle reproduit la synchronisation fournie par les secrets réplicas."
    b:
      en: "Updating a parameter after every rotation is a manual step that is easily forgotten, so the standby could start with expired credentials."
      fr: "Mettre à jour un paramètre après chaque rotation est une étape manuelle facile à oublier : la veille pourrait démarrer avec des identifiants expirés."
    c:
      en: "An interface endpoint in us-west-2 reaches the Secrets Manager service of us-west-2, where the secret does not exist; the tasks still depend on the secret and key in us-east-1."
      fr: "Un point de terminaison d'interface dans us-west-2 atteint le service Secrets Manager d'us-west-2, où le secret n'existe pas ; les tâches dépendent toujours du secret et de la clé d'us-east-1."
references:
  - title: Replicate AWS Secrets Manager secrets across Regions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
