id: sapc03-4a-anti-corruption-layer
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company is extracting the customer management feature of its monolithic .NET application into a new microservice exposed through Amazon API Gateway. The new service uses its own domain model: addresses are a single field, postal codes are numbers and customer types use new codes. The monolith's billing, shipping and claims modules still call the old in-process customer function with the legacy data model. The teams that own these modules cannot change their code this year. The architects also want the new service's model to stay free of legacy concepts, and they want the translation to be removed once all callers have been migrated.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique extrait la fonctionnalité de gestion des clients de son application .NET monolithique vers un nouveau microservice exposé par Amazon API Gateway. Le nouveau service utilise son propre modèle de domaine : les adresses forment un seul champ, les codes postaux sont des nombres et les types de clients utilisent de nouveaux codes. Les modules de facturation, d'expédition et de réclamations du monolithe appellent toujours l'ancienne fonction client interne avec le modèle de données hérité. Les équipes responsables de ces modules ne peuvent pas modifier leur code cette année. Les architectes veulent aussi que le modèle du nouveau service reste exempt de concepts hérités, et que la traduction soit supprimée une fois tous les appelants migrés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the new microservice to accept the legacy data model on its API, so that the billing, shipping and claims modules can call it directly with their current objects."
        fr: "Modifier le nouveau microservice pour qu'il accepte le modèle de données hérité sur son API, afin que les modules de facturation, d'expédition et de réclamations l'appellent directement avec leurs objets actuels."
    - id: b
      text:
        en: "Implement an anti-corruption layer in the monolith behind the old customer function that maps the legacy model to the new one and calls the API Gateway endpoint with retries and a circuit breaker."
        fr: "Mettre en œuvre dans le monolithe, derrière l'ancienne fonction client, une couche anticorruption qui convertit le modèle hérité vers le nouveau et appelle le point de terminaison API Gateway avec des nouvelles tentatives et un disjoncteur."
    - id: c
      text:
        en: "Let the new microservice read and write the monolith's customer tables directly instead of its own data store, so that the legacy function and the new service always share the same data and no translation is needed."
        fr: "Laisser le nouveau microservice lire et écrire directement les tables client du monolithe au lieu de son propre magasin de données, pour que l'ancienne fonction et le nouveau service partagent toujours les mêmes données sans traduction."
    - id: d
      text:
        en: "Replicate the new service's customer data back to the monolith's tables with an AWS DMS CDC task, and keep the legacy customer function running in the monolith for all callers."
        fr: "Répliquer les données client du nouveau service vers les tables du monolithe avec une tâche AWS DMS de CDC, et conserver l'ancienne fonction client dans le monolithe pour tous les appelants."
answer: { optionId: b }
explanation:
  correct:
    en: "An anti-corruption layer translates between the monolith's model and the new service's model, so existing callers keep their interface while their calls are redirected to the microservice. Because it can become a single point of failure, it uses retry with backoff and a circuit breaker, and it is tracked as interim technical debt and decommissioned when all callers have migrated."
    fr: "Une couche anticorruption traduit entre le modèle du monolithe et celui du nouveau service : les appelants existants conservent leur interface pendant que leurs appels sont redirigés vers le microservice. Comme elle peut devenir un point de défaillance unique, elle utilise des nouvelles tentatives avec backoff et un disjoncteur, et elle est suivie comme une dette technique temporaire à supprimer une fois tous les appelants migrés."
  options:
    a: { en: "Adopting the legacy model in the new service brings the legacy concepts into its domain, which the architects want to avoid.", fr: "Adopter le modèle hérité dans le nouveau service introduit les concepts hérités dans son domaine, ce que les architectes veulent éviter." }
    c: { en: "Sharing the monolith's tables couples the new service to the legacy schema and model, so the service is not really extracted.", fr: "Partager les tables du monolithe couple le nouveau service au schéma et au modèle hérités : le service n'est pas réellement extrait." }
    d: { en: "The callers keep using the legacy function instead of the new service, so the feature is never really moved out of the monolith.", fr: "Les appelants continuent d'utiliser l'ancienne fonction au lieu du nouveau service : la fonctionnalité ne sort jamais vraiment du monolithe." }
references:
  - title: Anti-corruption layer pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/acl.html
