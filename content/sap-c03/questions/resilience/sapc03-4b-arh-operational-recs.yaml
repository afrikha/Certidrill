id: sapc03-4b-arh-operational-recs
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Resilience Hub assessment of a three-tier application reports Policy met for the Availability Zone disruption type, whose RTO target is 15 minutes. Last month, an Availability Zone impairment caused an outage of 55 minutes. The post-incident review found that no alarm detected the problem for 30 minutes and that the on-call engineers improvised the recovery steps. The resiliency score of the application is low even though the policy is met, and the operational recommendations have never been implemented. The company wants to fix the root causes and to prove that the application can now recover within 15 minutes.

    Which approach will meet these requirements?
  fr: |
    Une évaluation AWS Resilience Hub d'une application à trois niveaux indique Policy met pour le type de perturbation Availability Zone, dont l'objectif de RTO est de 15 minutes. Le mois dernier, une dégradation d'une zone de disponibilité a provoqué une panne de 55 minutes. L'analyse post-incident a montré qu'aucune alarme n'a détecté le problème pendant 30 minutes et que les ingénieurs d'astreinte ont improvisé les étapes de reprise. Le score de résilience de l'application est faible alors que la politique est respectée, et les recommandations d'exploitation n'ont jamais été mises en œuvre. L'entreprise veut corriger les causes profondes et prouver que l'application peut désormais récupérer en moins de 15 minutes.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Lower the Availability Zone RTO target of the resiliency policy to 5 minutes so that the next assessment produces stricter resiliency recommendations, and implement them.", fr: "Abaisser à 5 minutes l'objectif de RTO de zone de disponibilité de la politique de résilience afin que la prochaine évaluation produise des recommandations de résilience plus strictes, puis les mettre en œuvre." }
    - id: b
      text: { en: "Deploy the recommended alarms, SOPs and AWS FIS experiments from the generated templates, then run the experiments to verify detection and recovery within 15 minutes.", fr: "Déployer les alarmes, SOP et expériences AWS FIS recommandées à partir des modèles générés, puis exécuter les expériences pour vérifier la détection et la reprise en moins de 15 minutes." }
    - id: c
      text: { en: "Turn on daily assessments and drift notifications for the application so that the operations team is told whenever the compliance status of the policy changes.", fr: "Activer les évaluations quotidiennes et les notifications de dérive pour l'application afin que l'équipe d'exploitation soit prévenue dès que l'état de conformité de la politique change." }
    - id: d
      text: { en: "Redeploy the application as an active/active workload in a second Region behind Route 53 latency-based records so that an Availability Zone impairment no longer affects users.", fr: "Redéployer l'application en charge de travail actif/actif dans une seconde Région derrière des enregistrements Route 53 basés sur la latence afin qu'une dégradation de zone de disponibilité n'affecte plus les utilisateurs." }
answer: { optionId: b }
explanation:
  correct:
    en: "The estimated RTO assumes that the failure is detected and the recovery procedure is executed; the outage came from missing detection and missing procedures, which is why the resiliency score, which also counts alarms, SOPs and tests, stayed low. Resilience Hub operational recommendations provide CloudWatch alarms, SSM-based SOPs and FIS experiments as CloudFormation templates, and running the experiments verifies that alarms fire and that the SOPs recover within the target."
    fr: "Le RTO estimé suppose que la panne est détectée et que la procédure de reprise est exécutée ; la panne venait d'une détection et de procédures absentes, d'où le score de résilience faible, qui compte aussi les alarmes, les SOP et les tests. Les recommandations d'exploitation de Resilience Hub fournissent des alarmes CloudWatch, des SOP basées sur SSM et des expériences FIS sous forme de modèles CloudFormation, et exécuter les expériences vérifie que les alarmes se déclenchent et que les SOP rétablissent le service dans l'objectif."
  options:
    a:
      en: "A stricter target changes the architecture recommendations, but the architecture was not the problem; detection and procedures would still be missing and untested."
      fr: "Un objectif plus strict change les recommandations d'architecture, mais l'architecture n'était pas en cause ; la détection et les procédures resteraient absentes et non testées."
    c:
      en: "Daily assessments detect configuration drift from the policy, which was already met; they add no alarm and no tested recovery procedure."
      fr: "Les évaluations quotidiennes détectent une dérive de configuration par rapport à la politique, déjà respectée ; elles n'ajoutent ni alarme ni procédure de reprise testée."
    d:
      en: "A second active Region is a costly redesign that does not address the missing alarms and procedures, and it proves nothing about the 15-minute RTO."
      fr: "Une seconde Région active est une refonte coûteuse qui ne traite pas les alarmes et procédures manquantes, et elle ne prouve rien sur le RTO de 15 minutes."
references:
  - title: Reviewing operational recommendations
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/ops.reqs.html
  - title: Managing standard operating procedures
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/sops.html
