id: sapc03-4b-arh-region-breach-fix
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Resilience Hub assessment of an order-tracking application reports Policy breached for the Cloud Infrastructure Region incident disruption type. The resiliency policy sets an RTO of 1 hour and an RPO of 15 minutes for a Regional incident, and the application and Availability Zone targets are met. The application uses Amazon API Gateway and AWS Lambda functions that are already deployed in us-east-1 and us-west-2 by AWS CloudFormation. Its Amazon DynamoDB table and its Amazon S3 bucket of shipping labels exist only in us-east-1, and the bucket has versioning enabled. The business confirms that the Regional targets are mandatory.

    Which change will make the application meet its policy with the LEAST operational overhead?
  fr: |
    Une évaluation AWS Resilience Hub d'une application de suivi des commandes indique Policy breached pour le type de perturbation Cloud Infrastructure Region incident. La politique de résilience fixe un RTO de 1 heure et un RPO de 15 minutes pour un incident régional, et les objectifs applicatifs et de zone de disponibilité sont respectés. L'application utilise Amazon API Gateway et des fonctions AWS Lambda déjà déployées dans us-east-1 et us-west-2 par AWS CloudFormation. Sa table Amazon DynamoDB et son compartiment Amazon S3 d'étiquettes d'expédition n'existent que dans us-east-1, et le compartiment a la gestion des versions activée. Le métier confirme que les objectifs régionaux sont obligatoires.

    Quelle modification permet à l'application de respecter sa politique avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Add a us-west-2 replica to make the table a global table, configure S3 Cross-Region Replication with S3 Replication Time Control to a bucket in us-west-2, and run the assessment again.", fr: "Ajouter un réplica us-west-2 pour faire de la table une table globale, configurer la réplication S3 entre Régions avec S3 Replication Time Control vers un compartiment d'us-west-2, et relancer l'évaluation." }
    - id: b
      text: { en: "Enable point-in-time recovery on the table and S3 Object Lock on the bucket in us-east-1, and run the assessment again to update the estimated RPO.", fr: "Activer la récupération à un instant dans le passé sur la table et S3 Object Lock sur le compartiment dans us-east-1, et relancer l'évaluation pour mettre à jour le RPO estimé." }
    - id: c
      text: { en: "Edit the resiliency policy to leave the Regional targets unset, and keep the AZ targets so that the application compliance status changes to Policy met.", fr: "Modifier la politique de résilience pour laisser vides les objectifs régionaux, et conserver les objectifs de zone de disponibilité afin que l'état de conformité de l'application passe à Policy met." }
    - id: d
      text: { en: "Create an AWS Backup plan with daily backups of the table and the bucket and a copy rule to a vault in us-west-2, and run the assessment again to confirm compliance.", fr: "Créer un plan AWS Backup avec des sauvegardes quotidiennes de la table et du compartiment et une règle de copie vers un coffre d'us-west-2, et relancer l'évaluation pour confirmer la conformité." }
answer: { optionId: a }
explanation:
  correct:
    en: "The Regional breach comes from data stores that exist only in us-east-1, while the compute already runs in both Regions. A global table replica replicates writes to us-west-2 typically within a second, and S3 Replication Time Control is designed to replicate 99.99 percent of objects within 15 minutes, so both meet the 15-minute RPO; a new assessment then recalculates the compliance status."
    fr: "La violation régionale vient de magasins de données qui n'existent que dans us-east-1, alors que le calcul tourne déjà dans les deux Régions. Un réplica de table globale réplique les écritures vers us-west-2 généralement en moins d'une seconde, et S3 Replication Time Control est conçu pour répliquer 99,99 % des objets en 15 minutes : les deux respectent le RPO de 15 minutes ; une nouvelle évaluation recalcule ensuite l'état de conformité."
  options:
    b:
      en: "Point-in-time recovery and Object Lock protect data inside us-east-1 against deletion or corruption; they keep no copy available if the Region itself is lost."
      fr: "La récupération à un instant dans le passé et Object Lock protègent les données dans us-east-1 contre la suppression ou la corruption ; elles ne gardent aucune copie disponible si la Région elle-même est perdue."
    c:
      en: "Removing the Regional targets hides the gap instead of closing it, and the business has confirmed that the Regional targets are mandatory."
      fr: "Supprimer les objectifs régionaux masque l'écart au lieu de le combler, et le métier a confirmé que les objectifs régionaux sont obligatoires."
    d:
      en: "Daily copies give an RPO of up to 24 hours, and restoring the table and bucket during an incident adds recovery time, so the 15-minute RPO is still breached."
      fr: "Des copies quotidiennes donnent un RPO pouvant atteindre 24 heures, et restaurer la table et le compartiment pendant l'incident ajoute du temps de reprise : le RPO de 15 minutes reste violé."
references:
  - title: What is AWS Resilience Hub?
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/what-is.html
  - title: How DynamoDB global tables work
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
