id: sapc03-4c-ec2-auto-recovery
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer runs a licensed manufacturing execution system on a single Amazon EC2 instance in a production account. The instance uses only Amazon EBS volumes, is not a metal size, and runs on an instance type that supports automatic recovery. The vendor's license server binds the license to the instance ID and the private IP address, and the vendor doesn't support clustering. Last quarter, a failure of the underlying host caused a 6-hour outage until an on-call engineer stopped and started the instance. The company needs automatic recovery from underlying hardware failures without operator action. The instance ID, the private IP address, and the attached EBS volumes must be preserved, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un fabricant exécute un système d'exécution de la fabrication sous licence sur une seule instance Amazon EC2 d'un compte de production. L'instance n'utilise que des volumes Amazon EBS, n'est pas une taille metal et s'exécute sur un type d'instance qui prend en charge la récupération automatique. Le serveur de licences de l'éditeur lie la licence à l'ID d'instance et à l'adresse IP privée, et l'éditeur ne prend pas en charge la mise en cluster. Le trimestre dernier, une panne de l'hôte sous-jacent a provoqué une interruption de 6 heures jusqu'à ce qu'un ingénieur d'astreinte arrête puis démarre l'instance. L'entreprise a besoin d'une récupération automatique après les pannes matérielles sous-jacentes, sans intervention d'un opérateur. L'ID d'instance, l'adresse IP privée et les volumes EBS attachés doivent être préservés, avec la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Auto Scaling group with a minimum and maximum size of 1 from a launch template, and restore the data volume from the latest EBS snapshot when a replacement instance launches."
        fr: "Créer un groupe Auto Scaling d'une taille minimale et maximale de 1 à partir d'un modèle de lancement, et restaurer le volume de données à partir du dernier instantané EBS au lancement d'une instance de remplacement."
    - id: b
      text:
        en: "Keep simplified automatic recovery turned on for the instance, so that AWS migrates the instance to new hardware when its system status check fails, and monitor the recovery events in AWS Health."
        fr: "Garder la récupération automatique simplifiée activée pour l'instance, pour qu'AWS migre l'instance vers un nouveau matériel quand sa vérification d'état du système échoue, et surveiller les événements de récupération dans AWS Health."
    - id: c
      text:
        en: "Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with the EC2 recover action, so that AWS moves the instance to new hardware when its instance status check fails."
        fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed_Instance avec l'action de récupération EC2, pour qu'AWS déplace l'instance vers un nouveau matériel quand sa vérification d'état de l'instance échoue."
    - id: d
      text:
        en: "Schedule a Lambda function every 5 minutes that calls DescribeInstanceStatus and stops and then starts the instance whenever AWS reports the instance as impaired."
        fr: "Planifier toutes les 5 minutes une fonction Lambda qui appelle DescribeInstanceStatus, puis arrête et démarre l'instance chaque fois qu'AWS la signale comme altérée."
answer: { optionId: b }
explanation:
  correct:
    en: "Simplified automatic recovery is enabled by default on supported instances and costs nothing extra. When a system status check fails because of an underlying hardware or software issue, AWS migrates the instance to different hardware and keeps its instance ID, private and Elastic IP addresses, metadata, and attached EBS volumes; only in-memory data is lost."
    fr: "La récupération automatique simplifiée est activée par défaut sur les instances prises en charge et ne coûte rien de plus. Quand une vérification d'état du système échoue à cause d'un problème matériel ou logiciel sous-jacent, AWS migre l'instance vers un autre matériel en conservant son ID d'instance, ses adresses IP privées et Elastic, ses métadonnées et ses volumes EBS attachés ; seules les données en mémoire sont perdues."
  options:
    a: { en: "Auto Scaling launches a new instance with a new instance ID, which breaks the license, and restoring from a snapshot can lose recent data.", fr: "Auto Scaling lance une nouvelle instance avec un nouvel ID d'instance, ce qui casse la licence, et la restauration depuis un instantané peut perdre des données récentes." }
    c: { en: "Automatic instance recovery doesn't operate when only the instance status check fails; host failures are reported by the system status check.", fr: "La récupération automatique ne fonctionne pas quand seule la vérification d'état de l'instance échoue ; les pannes d'hôte sont signalées par la vérification d'état du système." }
    d: { en: "A stop and start would keep the instance ID and private IP address, but this custom polling code adds overhead that the built-in recovery avoids.", fr: "Un arrêt puis un démarrage conserveraient l'ID d'instance et l'adresse IP privée, mais ce code de surveillance personnalisé ajoute une charge que la récupération intégrée évite." }
references:
  - title: Automatic instance recovery
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-recover.html
