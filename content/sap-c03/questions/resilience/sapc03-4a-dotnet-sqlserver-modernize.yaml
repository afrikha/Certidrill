id: sapc03-4a-dotnet-sqlserver-modernize
objective: "4.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurance company runs 40 ASP.NET MVC and Web API applications on .NET Framework 4.8 on Windows Server, with Microsoft SQL Server Standard edition databases. Windows Server and SQL Server licenses are the largest items of the infrastructure budget. The company wants the applications to run as Linux containers on Amazon ECS with AWS Fargate and the databases on Amazon Aurora PostgreSQL. The source code is in GitHub and has unit tests, and the company wants to automate as much of the code and schema conversion as possible. The company is a new AWS customer and wants to use only services that are open to new customers.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une compagnie d'assurance exécute 40 applications ASP.NET MVC et Web API sur .NET Framework 4.8 sous Windows Server, avec des bases Microsoft SQL Server Standard edition. Les licences Windows Server et SQL Server sont les plus gros postes du budget d'infrastructure. L'entreprise veut que les applications s'exécutent sous forme de conteneurs Linux sur Amazon ECS avec AWS Fargate et que les bases soient sur Amazon Aurora PostgreSQL. Le code source se trouve dans GitHub et dispose de tests unitaires, et l'entreprise veut automatiser autant que possible la conversion du code et des schémas. L'entreprise est un nouveau client AWS et ne veut utiliser que des services ouverts aux nouveaux clients.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Use AWS Transform for .NET to port the applications to cross-platform .NET, validate them with their unit tests, and deploy them as Linux containers to ECS on Fargate."
        fr: "Utiliser AWS Transform for .NET pour porter les applications vers .NET multiplateforme, les valider avec leurs tests unitaires, puis les déployer sous forme de conteneurs Linux sur ECS avec Fargate."
    - id: b
      text:
        en: "Use Porting Assistant for .NET to analyze and port the applications, and then build Linux container images for ECS on Fargate."
        fr: "Utiliser Porting Assistant for .NET pour analyser et porter les applications, puis construire des images de conteneur Linux pour ECS avec Fargate."
    - id: c
      text:
        en: "Convert the SQL Server schemas and code with DMS Schema Conversion and generative AI conversion, and migrate the data to Aurora PostgreSQL with an AWS DMS full load and CDC task."
        fr: "Convertir les schémas et le code SQL Server avec DMS Schema Conversion et la conversion par IA générative, puis migrer les données vers Aurora PostgreSQL avec une tâche AWS DMS de chargement complet et de CDC."
    - id: d
      text:
        en: "Run the .NET Framework applications unchanged in Windows containers on ECS, and migrate the databases to Amazon RDS for SQL Server with License Included."
        fr: "Exécuter les applications .NET Framework sans modification dans des conteneurs Windows sur ECS, puis migrer les bases vers Amazon RDS for SQL Server avec License Included."
    - id: e
      text:
        en: "Rehost the servers to Amazon EC2 with AWS Transform MGN, and use the Convert MS-SQL license post-launch action to move SQL Server to AWS licensing."
        fr: "Réhéberger les serveurs sur Amazon EC2 avec AWS Transform MGN, puis utiliser l'action post-lancement Convert MS-SQL license pour passer SQL Server sous licence AWS."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS Transform for .NET ports .NET Framework ASP.NET MVC and Web API projects from GitHub to cross-platform .NET that runs on Linux, and validates the result with builds and unit tests. DMS Schema Conversion converts SQL Server schemas and code to Aurora PostgreSQL, with generative AI conversion on this path, and AWS DMS migrates the data with ongoing replication."
    fr: "AWS Transform for .NET porte des projets ASP.NET MVC et Web API .NET Framework depuis GitHub vers .NET multiplateforme exécutable sous Linux, et valide le résultat par des compilations et des tests unitaires. DMS Schema Conversion convertit les schémas et le code SQL Server vers Aurora PostgreSQL, avec la conversion par IA générative sur ce chemin, et AWS DMS migre les données avec une réplication continue."
  options:
    b: { en: "Porting Assistant for .NET belongs to the .NET Modernization Tools, which have not been available to new customers since November 7, 2025.", fr: "Porting Assistant for .NET fait partie des .NET Modernization Tools, qui ne sont plus disponibles pour les nouveaux clients depuis le 7 novembre 2025." }
    d: { en: "Windows containers and RDS for SQL Server License Included still pay for Windows Server and SQL Server licenses.", fr: "Des conteneurs Windows et RDS for SQL Server avec License Included paient toujours les licences Windows Server et SQL Server." }
    e: { en: "A rehost keeps Windows Server and SQL Server; the post-launch action only changes how the SQL Server license is billed.", fr: "Un réhébergement conserve Windows Server et SQL Server ; l'action post-lancement ne change que la facturation de la licence SQL Server." }
references:
  - title: Modernizing .NET with AWS Transform
    url: https://docs.aws.amazon.com/transform/latest/userguide/dotnet.html
  - title: AWS .NET Modernization Tools availability change
    url: https://docs.aws.amazon.com/app2container/latest/UserGuide/dotnet-modernization-tools-availability-change.html
