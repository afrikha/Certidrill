id: sapc03-4a-mgn-launch-settings
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is rehosting 120 Windows servers that run a commercial ERP system with AWS Transform MGN. The ERP licenses are bound to the private IP address of each server, and partner firewalls allowlist those addresses. The company has therefore created target subnets with the same CIDR ranges as the source networks. Each EC2 instance must match the hardware configuration of its source server without the team choosing 120 instance types by hand. The finance team allocates costs with custom tags that are already set on the source servers in MGN, and the cutover instances must carry those tags.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise réhéberge avec AWS Transform MGN 120 serveurs Windows qui exécutent un ERP commercial. Les licences de l'ERP sont liées à l'adresse IP privée de chaque serveur, et des pare-feu de partenaires autorisent ces adresses. L'entreprise a donc créé des sous-réseaux cibles avec les mêmes plages CIDR que les réseaux sources. Chaque instance EC2 doit correspondre à la configuration matérielle de son serveur source sans que l'équipe choisisse 120 types d'instances à la main. L'équipe financière répartit les coûts avec des balises personnalisées déjà définies sur les serveurs sources dans MGN, et les instances de basculement doivent porter ces balises.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the default launch settings, add the old addresses to the cutover instances as secondary private IP addresses after launch, and apply the cost tags with Tag Editor."
        fr: "Conserver les paramètres de lancement par défaut, ajouter après le lancement les anciennes adresses aux instances de basculement comme adresses IP privées secondaires, puis appliquer les balises de coût avec Tag Editor."
    - id: b
      text:
        en: "Edit the EC2 launch template of each server to set a static private IP address and an instance type chosen from the source specifications, and turn off instance type right-sizing."
        fr: "Modifier le modèle de lancement EC2 de chaque serveur pour définir une adresse IP privée statique et un type d'instance choisi d'après les caractéristiques sources, puis désactiver le dimensionnement automatique du type d'instance."
    - id: c
      text:
        en: "Turn on instance type right-sizing and Transfer server tags, and create DHCP reservations in the VPC DHCP options set so that each instance receives its previous address."
        fr: "Activer le dimensionnement automatique du type d'instance et Transfer server tags, puis créer des réservations DHCP dans le jeu d'options DHCP du VPC pour que chaque instance reçoive son ancienne adresse."
    - id: d
      text:
        en: "In the general launch settings of the source servers, turn on instance type right-sizing, Copy private IP and Transfer server tags before launching the test and cutover instances."
        fr: "Dans les paramètres de lancement généraux des serveurs sources, activer le dimensionnement automatique du type d'instance (right-sizing), Copy private IP et Transfer server tags avant de lancer les instances de test et de basculement."
answer: { optionId: d }
explanation:
  correct:
    en: "Instance type right-sizing launches the instance type that best matches the source hardware and overrides the launch template type. Copy private IP makes MGN use the source server's private IP address, and Transfer server tags copies the custom tags of the source server to the test and cutover instances."
    fr: "Le dimensionnement automatique du type d'instance lance le type qui correspond le mieux au matériel source et remplace le type du modèle de lancement. Copy private IP fait utiliser par MGN l'adresse IP privée du serveur source, et Transfer server tags copie les balises personnalisées du serveur source vers les instances de test et de basculement."
  options:
    a: { en: "Adding the addresses after launch is manual work on 120 instances, and the ERP and partner rules may see the wrong primary address at first boot.", fr: "Ajouter les adresses après le lancement est un travail manuel sur 120 instances, et l'ERP comme les règles des partenaires peuvent voir une mauvaise adresse principale au premier démarrage." }
    b: { en: "Choosing 120 instance types by hand is what the team wants to avoid, and the custom tags are not copied.", fr: "Choisir 120 types d'instances à la main est précisément ce que l'équipe veut éviter, et les balises personnalisées ne sont pas copiées." }
    c: { en: "A VPC DHCP options set has no address reservations, so this cannot preserve the private IP addresses.", fr: "Un jeu d'options DHCP de VPC ne propose pas de réservations d'adresses : cette solution ne peut pas conserver les adresses IP privées." }
references:
  - title: Configuring launch settings
    url: https://docs.aws.amazon.com/mgn/latest/ug/configuring-target-gs.html
