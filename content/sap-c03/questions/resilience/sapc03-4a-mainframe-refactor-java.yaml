id: sapc03-4a-mainframe-refactor-java
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company runs its policy administration system on an IBM z/OS mainframe. The system consists of COBOL programs with copybooks, JCL batch jobs, CICS transactions, BMS screens, a Db2 database and VSAM files. Most of the COBOL developers will retire within three years, and the company cannot hire replacements. The board wants the system to run on AWS as a Java application that the company's existing Java teams can maintain. The company is starting a new modernization project this year.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exécute son système de gestion des contrats sur un mainframe IBM z/OS. Le système se compose de programmes COBOL avec des copybooks, de traitements par lots JCL, de transactions CICS, d'écrans BMS, d'une base Db2 et de fichiers VSAM. La plupart des développeurs COBOL partiront à la retraite d'ici trois ans, et l'entreprise ne peut pas les remplacer. Le conseil d'administration veut que le système s'exécute sur AWS sous forme d'application Java que les équipes Java existantes de l'entreprise peuvent maintenir. L'entreprise lance cette année un nouveau projet de modernisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use AWS Transform for mainframe to analyze the codebase, generate documentation, decompose the system into domains, and refactor the COBOL workloads into Java applications that run on AWS."
        fr: "Utiliser AWS Transform for mainframe pour analyser le code, générer de la documentation, décomposer le système en domaines et refactoriser les charges de travail COBOL en applications Java qui s'exécutent sur AWS."
    - id: b
      text:
        en: "Rehost the mainframe on Amazon EC2 with AWS Transform MGN by installing the AWS Replication Agent on the z/OS logical partitions, and then cut over each partition."
        fr: "Réhéberger le mainframe sur Amazon EC2 avec AWS Transform MGN en installant l'agent de réplication AWS sur les partitions logiques z/OS, puis basculer chaque partition."
    - id: c
      text:
        en: "Replatform the COBOL programs to the AWS Mainframe Modernization managed runtime environment with Rocket, and keep the COBOL source code for the Java teams to maintain."
        fr: "Changer la plateforme des programmes COBOL vers l'environnement d'exécution géré AWS Mainframe Modernization avec Rocket, et conserver le code source COBOL que les équipes Java maintiendront."
    - id: d
      text:
        en: "Retain the mainframe, and expose its CICS transactions as REST APIs through Amazon API Gateway so that the Java teams can build new front ends around the existing COBOL code."
        fr: "Conserver le mainframe et exposer ses transactions CICS comme API REST par Amazon API Gateway pour que les équipes Java construisent de nouveaux front-ends autour du code COBOL existant."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Transform for mainframe supports z/OS COBOL with copybooks, JCL, CICS, BMS, Db2 and VSAM. It analyzes and documents the code, decomposes the monolith into domains and waves, and automatically refactors COBOL workloads into cloud-optimized Java applications, which removes the dependency on COBOL skills."
    fr: "AWS Transform for mainframe prend en charge COBOL z/OS avec copybooks, JCL, CICS, BMS, Db2 et VSAM. Il analyse et documente le code, décompose le monolithe en domaines et en vagues, et refactorise automatiquement les charges COBOL en applications Java optimisées pour le cloud, ce qui supprime la dépendance aux compétences COBOL."
  options:
    b: { en: "AWS Transform MGN supports Windows and Linux servers; it cannot replicate z/OS logical partitions to EC2.", fr: "AWS Transform MGN prend en charge les serveurs Windows et Linux ; il ne peut pas répliquer des partitions logiques z/OS vers EC2." }
    c: { en: "A replatform keeps the application in COBOL, and the managed runtime environment with Rocket is no longer open to new customers.", fr: "Un changement de plateforme conserve l'application en COBOL, et l'environnement d'exécution géré avec Rocket n'est plus ouvert aux nouveaux clients." }
    d: { en: "Retaining the mainframe keeps the COBOL code that nobody will be able to maintain once the developers retire.", fr: "Conserver le mainframe maintient le code COBOL que personne ne pourra plus maintenir après le départ des développeurs." }
references:
  - title: Modernization of mainframe applications
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-app-mainframe.html
  - title: AWS Mainframe Modernization availability change
    url: https://docs.aws.amazon.com/m2/latest/userguide/mainframe-modernization-availability-change.html
