id: sapc03-4b-ecs-regional-clusters
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a stateless customer portal as an Amazon ECS service on AWS Fargate behind an Application Load Balancer in the ap-southeast-2 Region. Container images are stored in Amazon ECR in the same Region, and session data is already stored in an Amazon DynamoDB global table with a replica in ap-southeast-4. The company must be able to serve the portal from ap-southeast-4 if ap-southeast-2 fails, with an RTO of 15 minutes. A small number of tasks may run in ap-southeast-4 at all times. All infrastructure is defined with AWS CloudFormation.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un portail client sans état sous forme de service Amazon ECS sur AWS Fargate derrière un Application Load Balancer dans la Région ap-southeast-2. Les images de conteneurs sont stockées dans Amazon ECR dans la même Région, et les données de session sont déjà stockées dans une table globale Amazon DynamoDB avec un réplica dans ap-southeast-4. L'entreprise doit pouvoir servir le portail depuis ap-southeast-4 si ap-southeast-2 tombe en panne, avec un RTO de 15 minutes. Un petit nombre de tâches peut s'exécuter en permanence dans ap-southeast-4. Toute l'infrastructure est définie avec AWS CloudFormation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a Fargate capacity provider in ap-southeast-4 to the existing ECS cluster, and use a task placement strategy that spreads the tasks of the service evenly across the two Regions.", fr: "Ajouter au cluster ECS existant un fournisseur de capacité Fargate dans ap-southeast-4, et utiliser une stratégie de placement des tâches qui répartit uniformément les tâches du service entre les deux Régions." }
    - id: b
      text: { en: "Deploy a second ECS cluster, service and ALB in ap-southeast-4 from the same templates with a small desired count, replicate the images there, and add Route 53 failover records.", fr: "Déployer un second cluster ECS, un service et un ALB dans ap-southeast-4 à partir des mêmes modèles avec un petit nombre souhaité, y répliquer les images, et ajouter des enregistrements de basculement Route 53." }
    - id: c
      text: { en: "Enable ECS Service Connect with an AWS Cloud Map namespace shared by both Regions, so that tasks in ap-southeast-4 take over the traffic automatically when ap-southeast-2 fails.", fr: "Activer ECS Service Connect avec un espace de noms AWS Cloud Map partagé par les deux Régions, afin que les tâches d'ap-southeast-4 reprennent automatiquement le trafic quand ap-southeast-2 tombe en panne." }
    - id: d
      text: { en: "Spread the service across three Availability Zones in ap-southeast-2, and enable ARC zonal autoshift on the ALB so that traffic moves away from an impaired zone.", fr: "Répartir le service sur trois zones de disponibilité d'ap-southeast-2, et activer le zonal autoshift d'ARC sur l'ALB afin que le trafic quitte une zone dégradée." }
answer: { optionId: b }
explanation:
  correct:
    en: "An ECS cluster and its services are Regional, so a multi-Region design uses a separate cluster per Region deployed from the same infrastructure code. ECR cross-Region replication keeps the images available in the recovery Region, the small always-running service can take traffic immediately, and Route 53 failover with health checks redirects users when the primary Region fails."
    fr: "Un cluster ECS et ses services sont régionaux : une conception multi-Régions utilise un cluster distinct par Région, déployé à partir du même code d'infrastructure. La réplication ECR entre Régions garde les images disponibles dans la Région de reprise, le petit service toujours actif peut prendre le trafic immédiatement, et le basculement Route 53 avec vérifications de l'état redirige les utilisateurs quand la Région principale tombe en panne."
  options:
    a:
      en: "An ECS cluster cannot span Regions; capacity providers and task placement operate only within the Region of the cluster."
      fr: "Un cluster ECS ne peut pas couvrir plusieurs Régions ; les fournisseurs de capacité et le placement des tâches n'opèrent que dans la Région du cluster."
    c:
      en: "Service Connect provides service-to-service discovery and connectivity within a Region; it does not route client traffic between Regions or fail over the portal."
      fr: "Service Connect fournit la découverte et la connectivité entre services au sein d'une Région ; il ne route pas le trafic client entre Régions et ne fait pas basculer le portail."
    d:
      en: "Multiple Availability Zones and zonal autoshift protect against the loss of one zone, not against the failure of the whole ap-southeast-2 Region."
      fr: "Plusieurs zones de disponibilité et le zonal autoshift protègent contre la perte d'une zone, pas contre la panne de toute la Région ap-southeast-2."
references:
  - title: Private image replication in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
