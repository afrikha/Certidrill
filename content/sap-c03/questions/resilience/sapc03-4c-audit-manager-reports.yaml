id: sapc03-4c-audit-manager-reports
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance group has 80 accounts in AWS Organizations across three AWS Regions. A backup policy protects production resources, and an audit account is registered as the AWS Backup delegated administrator. AWS Config resource tracking for AWS Backup is turned on in every account and Region. Auditors require one daily report that shows, for every account and Region, whether resources comply with the company's backup controls: daily frequency, 35-day minimum retention, a cross-Region copy, and a locked vault. The report must be delivered to an S3 bucket in the audit account, and the solution must use AWS Backup Audit Manager.

    Which solution will meet these requirements?
  fr: |
    Un groupe d'assurance possède 80 comptes dans AWS Organizations répartis sur trois Régions AWS. Une politique de sauvegarde protège les ressources de production, et un compte d'audit est enregistré comme administrateur délégué d'AWS Backup. Le suivi des ressources AWS Config pour AWS Backup est activé dans chaque compte et chaque Région. Les auditeurs exigent un rapport quotidien unique qui montre, pour chaque compte et chaque Région, si les ressources respectent les contrôles de sauvegarde de l'entreprise : fréquence quotidienne, rétention minimale de 35 jours, copie inter-Régions et coffre verrouillé. Le rapport doit être livré dans un compartiment S3 du compte d'audit, et la solution doit utiliser AWS Backup Audit Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy a framework with the four controls to every account and Region with StackSets, and create a cross-account, cross-Region compliance report plan in the audit account."
        fr: "Déployer un cadre avec les quatre contrôles dans chaque compte et chaque Région avec StackSets, et créer dans le compte d'audit un plan de rapport de conformité entre comptes et inter-Régions."
    - id: b
      text:
        en: "Create a framework with the four controls only in the audit account, and create a cross-account, cross-Region compliance report plan in the audit account."
        fr: "Créer un cadre avec les quatre contrôles uniquement dans le compte d'audit, et créer dans le compte d'audit un plan de rapport de conformité entre comptes et inter-Régions."
    - id: c
      text:
        en: "Create a framework and a compliance report plan in every account and Region with CloudFormation StackSets, and configure each report plan to deliver to the bucket in the audit account."
        fr: "Créer un cadre et un plan de rapport de conformité dans chaque compte et chaque Région avec CloudFormation StackSets, et configurer chaque plan de rapport pour livrer dans le compartiment du compte d'audit."
    - id: d
      text:
        en: "Create a cross-account, cross-Region backup jobs report plan in the audit account, and deliver it daily to the audit account's bucket as evidence of the controls."
        fr: "Créer dans le compte d'audit un plan de rapport de tâches de sauvegarde entre comptes et inter-Régions, et le livrer chaque jour dans le compartiment du compte d'audit comme preuve des contrôles."
answer: { optionId: a }
explanation:
  correct:
    en: "Management and delegated administrator accounts can create cross-account reports, and any account can create cross-Region reports. For a delegated administrator's compliance report to show member account data, the frameworks must exist in those member accounts, and Audit Manager delivers reports only to a bucket in the account that owns the report plan."
    fr: "Les comptes de gestion et d'administrateur délégué peuvent créer des rapports entre comptes, et tout compte peut créer des rapports inter-Régions. Pour que le rapport de conformité d'un administrateur délégué montre les données des comptes membres, les cadres doivent exister dans ces comptes membres, et Audit Manager ne livre les rapports que dans un compartiment du compte propriétaire du plan de rapport."
  options:
    b: { en: "Without frameworks in the member accounts, the delegated administrator's compliance report doesn't contain their compliance data.", fr: "Sans cadre dans les comptes membres, le rapport de conformité de l'administrateur délégué ne contient pas leurs données de conformité." }
    c: { en: "Audit Manager doesn't deliver reports to a bucket in another account, and 240 separate reports aren't the single report the auditors require.", fr: "Audit Manager ne livre pas de rapports dans un compartiment d'un autre compte, et 240 rapports distincts ne sont pas le rapport unique exigé par les auditeurs." }
    d: { en: "A jobs report lists backup jobs and their context; it doesn't evaluate resources against the four controls.", fr: "Un rapport de tâches liste les tâches de sauvegarde et leur contexte ; il n'évalue pas les ressources par rapport aux quatre contrôles." }
references:
  - title: Working with audit reports
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/working-with-audit-reports.html
  - title: AWS Backup Audit Manager
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/aws-backup-audit-manager.html
