id: sapc03-4c-fis-report-evidence
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regulated bank deploys its loan origination platform through AWS CodePipeline. Every release must pass an AWS FIS experiment that runs against the staging environment in eu-west-1 before production approval. Auditors require, for each run, a document that summarizes the experiment actions and shows the graphs of the application's key metrics before, during, and after the experiment. The documents must be kept for 7 years, and nobody, including administrators, may delete them during that time. The application metrics are already on a CloudWatch dashboard in the staging account. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une banque réglementée déploie sa plateforme d'octroi de prêts avec AWS CodePipeline. Chaque version doit réussir une expérience AWS FIS exécutée sur l'environnement de préproduction dans eu-west-1 avant l'approbation pour la production. Les auditeurs exigent, pour chaque exécution, un document qui résume les actions de l'expérience et montre les graphiques des principales métriques de l'application avant, pendant et après l'expérience. Les documents doivent être conservés 7 ans, et personne, y compris les administrateurs, ne doit pouvoir les supprimer pendant cette période. Les métriques de l'application figurent déjà sur un tableau de bord CloudWatch du compte de préproduction. La solution doit avoir la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on experiment logging to CloudWatch Logs, export the logs to Amazon S3 every night, and build an Amazon QuickSight dashboard of the experiment timeline for the auditors."
        fr: "Activer la journalisation des expériences vers CloudWatch Logs, exporter chaque nuit les journaux vers Amazon S3, et créer un tableau de bord Amazon QuickSight de la chronologie des expériences pour les auditeurs."
    - id: b
      text:
        en: "Add an experiment report configuration with the dashboard to the template, deliver the reports to an S3 bucket in eu-west-1 with a 7-year compliance-mode Object Lock retention, and start the experiment from the pipeline."
        fr: "Ajouter au modèle une configuration de rapport d'expérience avec le tableau de bord, livrer les rapports dans un compartiment S3 de eu-west-1 avec une rétention Object Lock de 7 ans en mode conformité, et démarrer l'expérience depuis le pipeline."
    - id: c
      text:
        en: "Add an experiment report configuration with the dashboard to the template, deliver the reports to an Object Lock bucket in an audit account in eu-central-1, and start the experiment from the pipeline."
        fr: "Ajouter au modèle une configuration de rapport d'expérience avec le tableau de bord, livrer les rapports dans un compartiment Object Lock d'un compte d'audit dans eu-central-1, et démarrer l'expérience depuis le pipeline."
    - id: d
      text:
        en: "Add a pipeline stage that runs a Lambda function, which calls GetMetricWidgetImage for each dashboard widget after the experiment and stores the images and a summary in S3 Glacier Deep Archive."
        fr: "Ajouter une étape de pipeline qui exécute une fonction Lambda, laquelle appelle GetMetricWidgetImage pour chaque widget du tableau de bord après l'expérience et stocke les images et un résumé dans S3 Glacier Deep Archive."
answer: { optionId: b }
explanation:
  correct:
    en: "An FIS experiment report is a PDF that summarizes the experiment actions and can include snapshot graphs of the metric widgets of one CloudWatch dashboard, annotated with the experiment start and end and covering configurable periods before and after. The report bucket must be in the same Region as the experiment, and AWS recommends S3 Object Lock to prevent reports from being deleted; compliance mode stops everyone, including administrators."
    fr: "Un rapport d'expérience FIS est un PDF qui résume les actions de l'expérience et peut inclure des graphiques instantanés des widgets de métriques d'un tableau de bord CloudWatch, annotés avec le début et la fin de l'expérience et couvrant des périodes configurables avant et après. Le compartiment des rapports doit être dans la même Région que l'expérience, et AWS recommande S3 Object Lock pour empêcher la suppression des rapports ; le mode conformité bloque tout le monde, administrateurs compris."
  options:
    a: { en: "Logs and a custom dashboard require export jobs and BI work, don't produce a per-run document, and nothing makes the exported logs undeletable.", fr: "Des journaux et un tableau de bord personnalisé exigent des tâches d'export et un travail de BI, ne produisent pas de document par exécution, et rien ne rend les journaux exportés impossibles à supprimer." }
    c: { en: "The report bucket must be in the same Region as the experiment, so a bucket in eu-central-1 can't receive reports from an experiment in eu-west-1.", fr: "Le compartiment des rapports doit être dans la même Région que l'expérience : un compartiment de eu-central-1 ne peut pas recevoir les rapports d'une expérience de eu-west-1." }
    d: { en: "This rebuilds the report feature with custom code, and Glacier Deep Archive alone doesn't prevent deletion.", fr: "Cela reconstruit la fonctionnalité de rapport avec du code personnalisé, et Glacier Deep Archive à lui seul n'empêche pas la suppression." }
references:
  - title: Experiment report configurations for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/experiment-report-configuration.html
