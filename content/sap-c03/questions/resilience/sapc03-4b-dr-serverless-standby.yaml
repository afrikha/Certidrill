id: sapc03-4b-dr-serverless-standby
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media subscription company runs its customer API in the us-east-1 Region on Amazon API Gateway REST APIs, AWS Lambda functions and an Amazon DynamoDB table, all deployed with AWS SAM. Traffic is close to zero at night and peaks sharply during live events. The disaster recovery requirement is an RTO of 30 minutes and an RPO of 1 minute if us-east-1 fails, with us-west-2 as the recovery Region. Finance wants disaster recovery to cost as little as possible while no disaster occurs. The architecture team also wants recovery not to depend on deploying infrastructure or restoring data during the event.

    Which solution will meet these requirements?
  fr: |
    Une société d'abonnements média exécute son API client dans la Région us-east-1 sur des API REST Amazon API Gateway, des fonctions AWS Lambda et une table Amazon DynamoDB, le tout déployé avec AWS SAM. Le trafic est presque nul la nuit et culmine fortement pendant les événements en direct. L'exigence de reprise après sinistre est un RTO de 30 minutes et un RPO de 1 minute si us-east-1 tombe en panne, avec us-west-2 comme Région de reprise. La direction financière veut que la reprise coûte le moins possible tant qu'aucun sinistre ne survient. L'équipe d'architecture veut aussi que la reprise ne dépende pas d'un déploiement d'infrastructure ni d'une restauration de données pendant l'incident.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Export the table to an S3 bucket every hour with S3 Cross-Region Replication to us-west-2, and during a disaster deploy the SAM application and import the latest export into a new table.", fr: "Exporter la table vers un compartiment S3 toutes les heures avec la réplication S3 entre Régions vers us-west-2, et lors d'un sinistre déployer l'application SAM et importer le dernier export dans une nouvelle table." }
    - id: b
      text: { en: "Deploy the SAM application to us-west-2 with provisioned concurrency sized for peak traffic, and copy every change to a table in us-west-2 with DynamoDB Streams and a custom Lambda function.", fr: "Déployer l'application SAM dans us-west-2 avec une simultanéité provisionnée dimensionnée pour le pic, et copier chaque modification vers une table d'us-west-2 avec DynamoDB Streams et une fonction Lambda personnalisée." }
    - id: c
      text: { en: "Also deploy the SAM application to us-west-2, add a us-west-2 replica to the table to make it a global table, and use Route 53 failover records with health checks for the two APIs.", fr: "Déployer aussi l'application SAM dans us-west-2, ajouter à la table un réplica us-west-2 pour en faire une table globale, et utiliser des enregistrements de basculement Route 53 avec vérifications de l'état pour les deux API." }
    - id: d
      text: { en: "Enable point-in-time recovery on the table, and during a disaster restore the table into us-west-2 and deploy the SAM application there from the pipeline.", fr: "Activer la récupération à un instant dans le passé sur la table, et lors d'un sinistre restaurer la table dans us-west-2 et y déployer l'application SAM depuis le pipeline." }
answer: { optionId: c }
explanation:
  correct:
    en: "API Gateway and Lambda are billed per request, so an idle copy of the serverless stack in us-west-2 costs almost nothing until traffic fails over. A global table replica keeps the data replicated with an RPO of seconds, and Route 53 failover with health checks redirects clients automatically, with nothing to deploy or restore during the event."
    fr: "API Gateway et Lambda sont facturés à la requête : une copie inactive de la pile sans serveur dans us-west-2 ne coûte presque rien tant que le trafic n'a pas basculé. Un réplica de table globale garde les données répliquées avec un RPO de quelques secondes, et le basculement Route 53 avec vérifications de l'état redirige les clients automatiquement, sans rien à déployer ni à restaurer pendant l'incident."
  options:
    a:
      en: "Hourly exports give an RPO of up to 1 hour, and the design depends on deploying and importing data during the event."
      fr: "Des exports horaires donnent un RPO pouvant atteindre 1 heure, et la conception dépend d'un déploiement et d'une importation de données pendant l'incident."
    b:
      en: "Provisioned concurrency is billed while idle, which contradicts the cost requirement, and a custom Streams replicator adds code that global tables provide natively."
      fr: "La simultanéité provisionnée est facturée même inactive, ce qui contredit l'exigence de coût, et un réplicateur personnalisé basé sur Streams ajoute du code que les tables globales fournissent nativement."
    d:
      en: "Restoring a table and deploying the stack during the event is exactly the dependency the architecture team wants to avoid, and a large restore can exceed the 30-minute RTO."
      fr: "Restaurer une table et déployer la pile pendant l'incident est précisément la dépendance que l'équipe veut éviter, et une restauration volumineuse peut dépasser le RTO de 30 minutes."
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: How DynamoDB global tables work
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
