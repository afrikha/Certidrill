id: sapc03-4b-eks-aws-backup-dr
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a stateful document-indexing application on an Amazon EKS cluster in the us-east-2 Region. The application uses StatefulSets with persistent volume claims backed by Amazon EBS through the EBS CSI driver add-on. The disaster recovery tier for this application is an RPO of 24 hours and an RTO of 12 hours. The company does not want to run a second cluster until a disaster occurs, and it wants the solution with the LEAST operational overhead. Container images are already replicated by Amazon ECR to us-west-2. The cluster currently uses the CONFIG_MAP authentication mode.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application d'indexation de documents avec état sur un cluster Amazon EKS dans la Région us-east-2. L'application utilise des StatefulSets avec des demandes de volumes persistants (PVC) adossées à Amazon EBS via le module complémentaire EBS CSI driver. Le niveau de reprise de cette application est un RPO de 24 heures et un RTO de 12 heures. L'entreprise ne veut pas exécuter de second cluster tant qu'aucun sinistre ne survient, et veut la solution avec le MOINS de charge opérationnelle. Les images de conteneurs sont déjà répliquées par Amazon ECR vers us-west-2. Le cluster utilise actuellement le mode d'authentification CONFIG_MAP.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Install Velero on the cluster with an Amazon S3 bucket in us-west-2 as the backup location, and schedule daily backups of all namespaces with snapshots of the persistent volumes.", fr: "Installer Velero sur le cluster avec un compartiment Amazon S3 d'us-west-2 comme emplacement de sauvegarde, et planifier des sauvegardes quotidiennes de tous les espaces de noms avec des instantanés des volumes persistants." }
    - id: b
      text: { en: "Change the cluster authentication mode to API_AND_CONFIG_MAP so that AWS Backup can create the access entries it needs on the cluster.", fr: "Passer le mode d'authentification du cluster à API_AND_CONFIG_MAP afin qu'AWS Backup puisse créer les entrées d'accès dont il a besoin sur le cluster." }
    - id: c
      text: { en: "Create Amazon Data Lifecycle Manager policies that snapshot the EBS volumes of the persistent volumes daily and copy the snapshots to us-west-2.", fr: "Créer des politiques Amazon Data Lifecycle Manager qui prennent chaque jour des instantanés des volumes EBS des volumes persistants et les copient vers us-west-2." }
    - id: d
      text: { en: "Create an AWS Backup plan that backs up the EKS cluster daily with a copy rule to a vault in us-west-2, and restore to a new cluster in us-west-2 during a disaster.", fr: "Créer un plan AWS Backup qui sauvegarde chaque jour le cluster EKS avec une règle de copie vers un coffre d'us-west-2, et restaurer vers un nouveau cluster d'us-west-2 lors d'un sinistre." }
    - id: e
      text: { en: "Create a standby EKS cluster in us-west-2 with the same node groups and add-ons, and synchronize the persistent volume data to it every night with AWS DataSync tasks.", fr: "Créer un cluster EKS de secours dans us-west-2 avec les mêmes groupes de nœuds et modules complémentaires, et y synchroniser chaque nuit les données des volumes persistants avec des tâches AWS DataSync." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AWS Backup protects an EKS cluster without any agent: a composite recovery point holds the cluster state (Kubernetes manifests and cluster configuration) and the EBS-backed persistent volumes, and it can be copied to another Region and restored to a new cluster there. AWS Backup creates access entries on the cluster, so the authentication mode must be API or API_AND_CONFIG_MAP."
    fr: "AWS Backup protège un cluster EKS sans agent : un point de récupération composite contient l'état du cluster (manifestes Kubernetes et configuration du cluster) et les volumes persistants adossés à EBS, et il peut être copié vers une autre Région puis restauré dans un nouveau cluster. AWS Backup crée des entrées d'accès sur le cluster : le mode d'authentification doit être API ou API_AND_CONFIG_MAP."
  options:
    a:
      en: "Velero can back up the cluster, but it is a self-managed tool to install, upgrade and monitor, which is more overhead than the managed AWS Backup support for EKS."
      fr: "Velero peut sauvegarder le cluster, mais c'est un outil autogéré à installer, mettre à niveau et surveiller, ce qui représente plus de charge que la prise en charge gérée d'EKS par AWS Backup."
    c:
      en: "EBS snapshots alone do not capture the Kubernetes objects, such as StatefulSets, ConfigMaps and secrets, needed to rebuild the application."
      fr: "Les instantanés EBS seuls ne capturent pas les objets Kubernetes, comme les StatefulSets, les ConfigMaps et les secrets, nécessaires pour reconstruire l'application."
    e:
      en: "A standby cluster contradicts the requirement not to run a second cluster, and DataSync transfers files and objects, not EBS block volumes attached to pods."
      fr: "Un cluster de secours contredit l'exigence de ne pas exécuter de second cluster, et DataSync transfère des fichiers et des objets, pas des volumes bloc EBS attachés à des pods."
references:
  - title: Amazon EKS backups
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/eks-backups.html
  - title: Restore an Amazon EKS cluster
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restoring-eks.html
