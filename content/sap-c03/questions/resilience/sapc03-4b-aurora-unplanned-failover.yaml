id: sapc03-4b-aurora-unplanned-failover
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company runs its booking database on an Amazon Aurora MySQL global database with the primary cluster in the us-east-1 Region and a secondary cluster in eu-west-1. The application connects through the global writer endpoint. The AWS Health Dashboard reports a Regional impairment in us-east-1, and the primary cluster has been unreachable for 40 minutes. The business accepts losing a few seconds of transactions to restore write availability quickly. After us-east-1 recovers, the company wants to move the primary role back to us-east-1 without losing any further data. Application connection settings must not change at any point.

    Which sequence of actions will meet these requirements?
  fr: |
    Une entreprise de voyages exécute sa base de réservations sur une base de données globale Amazon Aurora MySQL avec le cluster principal dans la Région us-east-1 et un cluster secondaire dans eu-west-1. L'application se connecte par le point de terminaison d'écriture global. L'AWS Health Dashboard signale une dégradation régionale dans us-east-1, et le cluster principal est injoignable depuis 40 minutes. Le métier accepte de perdre quelques secondes de transactions pour rétablir rapidement les écritures. Après le rétablissement d'us-east-1, l'entreprise veut ramener le rôle principal dans us-east-1 sans perdre davantage de données. Les paramètres de connexion de l'application ne doivent changer à aucun moment.

    Quelle séquence d'actions répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run a global database failover to the eu-west-1 cluster with the allow-data-loss option, keep using the global writer endpoint, and run a switchover back to us-east-1 after Aurora adds it back as a secondary.", fr: "Lancer un basculement de la base globale vers le cluster d'eu-west-1 avec l'option allow-data-loss, continuer d'utiliser le point de terminaison d'écriture global, et lancer une permutation (switchover) vers us-east-1 après qu'Aurora l'a réintégré comme secondaire." }
    - id: b
      text: { en: "Run a global database switchover to the eu-west-1 cluster now because switchover has an RPO of zero, and run another switchover back to us-east-1 after the Region recovers.", fr: "Lancer dès maintenant une permutation (switchover) de la base globale vers le cluster d'eu-west-1 car la permutation a un RPO nul, puis une autre permutation vers us-east-1 après le rétablissement de la Région." }
    - id: c
      text: { en: "Detach the eu-west-1 cluster from the global database and promote it, point the application to its cluster endpoint, and later restore a snapshot into us-east-1 to make it the primary cluster again.", fr: "Détacher le cluster d'eu-west-1 de la base globale et le promouvoir, pointer l'application vers son point de terminaison de cluster, puis restaurer plus tard un instantané dans us-east-1 pour en refaire le cluster principal." }
    - id: d
      text: { en: "Wait for us-east-1 to recover before taking any action, because a managed failover of an Aurora MySQL global database can cause a split-brain that corrupts both clusters.", fr: "Attendre le rétablissement d'us-east-1 avant toute action, car un basculement géré d'une base de données globale Aurora MySQL peut provoquer un split-brain qui corrompt les deux clusters." }
answer: { optionId: a }
explanation:
  correct:
    en: "An unplanned outage calls for a global database failover with --allow-data-loss: it promotes the secondary without waiting for synchronization, so the RPO is the replication lag of a few seconds. The global writer endpoint keeps its value after the failover, so connection settings do not change; when the old Region recovers, Aurora re-adds it as a secondary, and a switchover, which synchronizes first and has an RPO of zero, returns the primary role."
    fr: "Une panne imprévue nécessite un basculement de la base globale avec --allow-data-loss : il promeut le secondaire sans attendre la synchronisation, le RPO est donc le décalage de réplication de quelques secondes. Le point de terminaison d'écriture global garde sa valeur après le basculement : les paramètres de connexion ne changent pas ; quand l'ancienne Région se rétablit, Aurora la réintègre comme secondaire, et une permutation, qui synchronise d'abord et a un RPO nul, rétablit le rôle principal."
  options:
    b:
      en: "Switchover requires all clusters to be healthy and waits for the secondaries to synchronize, so it cannot run while the primary Region is unreachable."
      fr: "La permutation exige que tous les clusters soient sains et attend la synchronisation des secondaires : elle ne peut pas s'exécuter tant que la Région principale est injoignable."
    c:
      en: "Detach and promote is the manual fallback when managed failover is not possible; it breaks the global topology and forces the application onto a different endpoint, which the requirements forbid."
      fr: "Détacher et promouvoir est le recours manuel quand le basculement géré n'est pas possible ; cela casse la topologie globale et impose un autre point de terminaison à l'application, ce que les exigences interdisent."
    d:
      en: "Managed failover is supported for Aurora MySQL global databases and is the documented response to a Regional outage; waiting leaves writes unavailable for an unknown time."
      fr: "Le basculement géré est pris en charge pour les bases de données globales Aurora MySQL et c'est la réponse documentée à une panne régionale ; attendre laisse les écritures indisponibles pour une durée inconnue."
references:
  - title: Using switchover or failover in an Amazon Aurora global database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
