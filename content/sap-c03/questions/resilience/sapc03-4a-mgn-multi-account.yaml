id: sapc03-4a-mgn-multi-account
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A holding company uses AWS Organizations with a separate workload account for each of its four business units. It is rehosting 900 servers with AWS Transform, and the servers of each business unit must land directly in that business unit's account and Region. A central cloud team runs the whole migration from one AWS Transform workspace. The team does not want to sign in to each target account to initialize the migration service, create IAM roles or launch instances. Each server must be cut over only once.

    Which approach will meet these requirements with the LEAST operational overhead?
  fr: |
    Une société holding utilise AWS Organizations avec un compte de charge de travail distinct pour chacune de ses quatre unités commerciales. Elle réhéberge 900 serveurs avec AWS Transform, et les serveurs de chaque unité doivent arriver directement dans le compte et la Région de cette unité. Une équipe cloud centrale mène toute la migration depuis un seul espace de travail AWS Transform. L'équipe ne veut pas se connecter à chaque compte cible pour initialiser le service de migration, créer des rôles IAM ou lancer des instances. Chaque serveur ne doit basculer qu'une seule fois.

    Quelle approche répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create a separate AWS Transform workspace in each business unit account, initialize AWS Transform MGN manually in each account, and let each business unit team run its own waves."
        fr: "Créer un espace de travail AWS Transform distinct dans chaque compte d'unité commerciale, initialiser AWS Transform MGN manuellement dans chaque compte et laisser l'équipe de chaque unité mener ses propres vagues."
    - id: b
      text:
        en: "Use multi-account migration in AWS Transform, set each server's target account in the mgn:account-id column of the inventory file, and let AWS Transform initialize MGN and its roles in each account."
        fr: "Utiliser la migration multicompte d'AWS Transform, renseigner le compte cible de chaque serveur dans la colonne mgn:account-id du fichier d'inventaire, et laisser AWS Transform initialiser MGN et ses rôles dans chaque compte."
    - id: c
      text:
        en: "Replicate and cut over all servers into the central account, create an AMI from each instance, share the AMIs with the business unit accounts, and launch the instances again in those accounts."
        fr: "Répliquer et basculer tous les serveurs dans le compte central, créer une AMI à partir de chaque instance, partager les AMI avec les comptes des unités commerciales, puis relancer les instances dans ces comptes."
    - id: d
      text:
        en: "Replicate and cut over all servers into the central account, back up the instances with AWS Backup, copy the recovery points to the business unit accounts with cross-account copy, and restore the instances there."
        fr: "Répliquer et basculer tous les serveurs dans le compte central, sauvegarder les instances avec AWS Backup, copier les points de récupération vers les comptes des unités par copie entre comptes, puis y restaurer les instances."
answer: { optionId: b }
explanation:
  correct:
    en: "In a multi-account migration, AWS Transform sends each server to the account listed in the mgn:account-id column of the inventory. It initializes AWS Transform MGN in each target account and Region and creates the required IAM service roles, so the central team works from one workspace and each server is cut over once, directly into its account."
    fr: "Dans une migration multicompte, AWS Transform envoie chaque serveur vers le compte indiqué dans la colonne mgn:account-id de l'inventaire. Il initialise AWS Transform MGN dans chaque compte et Région cibles et crée les rôles de service IAM requis : l'équipe centrale travaille depuis un seul espace de travail et chaque serveur bascule une seule fois, directement dans son compte."
  options:
    a: { en: "Four workspaces and manual initialization in every account are the per-account work that the central team wants to avoid.", fr: "Quatre espaces de travail et une initialisation manuelle dans chaque compte représentent le travail par compte que l'équipe centrale veut éviter." }
    c: { en: "Servers land in the wrong account first and need a second relaunch, so each workload is cut over twice.", fr: "Les serveurs arrivent d'abord dans le mauvais compte et doivent être relancés une seconde fois : chaque charge de travail bascule deux fois." }
    d: { en: "Backing up, copying and restoring every instance adds a second migration step and a second cutover for each server.", fr: "Sauvegarder, copier et restaurer chaque instance ajoute une seconde étape de migration et un second basculement pour chaque serveur." }
references:
  - title: Migrate servers
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-migrate-servers.html
