id: sapc03-4c-ebs-lock-cooloff
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A broker-dealer runs its order management database on Amazon EC2 with Amazon EBS volumes. A script in the production account creates snapshots of the volumes every night; the company doesn't use AWS Backup for these volumes. A regulation requires that each snapshot be kept in a WORM state for 90 days, so that no user, including administrators and the root user of the account, can delete it during that period. The compliance team wants 48 hours after each snapshot is protected to correct a protection that was applied with the wrong duration, after which the protection must become permanent. The nightly script must keep creating the snapshots.

    Which solution will meet these requirements?
  fr: |
    Un courtier exécute sa base de données de gestion des ordres sur Amazon EC2 avec des volumes Amazon EBS. Un script du compte de production crée chaque nuit des instantanés des volumes ; l'entreprise n'utilise pas AWS Backup pour ces volumes. Une réglementation exige que chaque instantané soit conservé en état WORM pendant 90 jours, pour qu'aucun utilisateur, y compris les administrateurs et l'utilisateur racine du compte, ne puisse le supprimer pendant cette période. L'équipe conformité veut disposer de 48 heures après la protection de chaque instantané pour corriger une protection appliquée avec une mauvaise durée, après quoi la protection doit devenir définitive. Le script nocturne doit continuer à créer les instantanés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Have the script lock each snapshot in governance mode for 90 days, and remove the ec2:UnlockSnapshot permission from every IAM policy in the account 48 hours later."
        fr: "Faire verrouiller chaque instantané par le script en mode gouvernance pendant 90 jours, et retirer l'autorisation ec2:UnlockSnapshot de toutes les politiques IAM du compte 48 heures plus tard."
    - id: b
      text:
        en: "Create a Region-level Recycle Bin retention rule for EBS snapshots with a 90-day retention period, and lock the rule with a 30-day unlock delay."
        fr: "Créer une règle de conservation de la Corbeille (Recycle Bin) au niveau de la Région pour les instantanés EBS avec une période de conservation de 90 jours, et verrouiller la règle avec un délai de déverrouillage de 30 jours."
    - id: c
      text:
        en: "Have the script lock each snapshot in compliance mode with a 90-day lock duration and a 48-hour cooling-off period."
        fr: "Faire verrouiller chaque instantané par le script en mode conformité avec une durée de verrouillage de 90 jours et une période de réflexion (cooling-off) de 48 heures."
    - id: d
      text:
        en: "Move the volumes to an AWS Backup plan that stores the recovery points in a vault with a compliance-mode Vault Lock and a 48-hour grace time."
        fr: "Faire passer les volumes dans un plan AWS Backup qui stocke les points de récupération dans un coffre doté d'un Vault Lock en mode conformité avec un délai de grâce de 48 heures."
answer: { optionId: c }
explanation:
  correct:
    en: "A snapshot locked in compliance mode can't be deleted by any user. During an optional cooling-off period of 1 to 72 hours, users with permissions can still unlock it or change the mode and duration; after it expires, nobody can unlock it or shorten the lock, which matches the 48-hour correction window."
    fr: "Un instantané verrouillé en mode conformité ne peut être supprimé par aucun utilisateur. Pendant une période de réflexion facultative de 1 à 72 heures, les utilisateurs autorisés peuvent encore le déverrouiller ou changer le mode et la durée ; une fois cette période expirée, personne ne peut le déverrouiller ni raccourcir le verrou, ce qui correspond à la fenêtre de correction de 48 heures."
  options:
    a: { en: "In governance mode, users with the right IAM permissions can unlock the snapshot at any time, and an administrator or the root user could grant those permissions again.", fr: "En mode gouvernance, les utilisateurs disposant des bonnes autorisations IAM peuvent déverrouiller l'instantané à tout moment, et un administrateur ou l'utilisateur racine pourrait réaccorder ces autorisations." }
    b: { en: "Recycle Bin keeps deleted snapshots recoverable, but the snapshots can still be deleted, so they aren't kept in a WORM state.", fr: "La Corbeille garde les instantanés supprimés récupérables, mais les instantanés peuvent toujours être supprimés : ils ne sont pas conservés en état WORM." }
    d: { en: "The grace time of a compliance-mode Vault Lock is at least 3 days, and the change replaces the nightly script that the company must keep.", fr: "Le délai de grâce d'un Vault Lock en mode conformité est d'au moins 3 jours, et ce changement remplace le script nocturne que l'entreprise doit conserver." }
references:
  - title: Amazon EBS snapshot lock concepts
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-lock-concepts.html
