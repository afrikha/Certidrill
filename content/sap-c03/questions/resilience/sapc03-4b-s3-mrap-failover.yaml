id: sapc03-4b-s3-mrap-failover
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A document-management SaaS provider runs its primary stack in the us-east-1 Region and a standby stack in us-west-2. The application reads and writes objects in an Amazon S3 bucket in each Region, and two-way S3 Cross-Region Replication keeps the buckets synchronized. Today each service stores the Regional bucket name in its configuration, and switching all services to the us-west-2 bucket took 2 hours during the last DR test. The company wants one global S3 endpoint for both reads and writes. During a Regional disruption, the company must be able to send all S3 requests to the us-west-2 bucket within minutes without changing the configuration of the services.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS de gestion documentaire exécute sa pile principale dans la Région us-east-1 et une pile de secours dans us-west-2. L'application lit et écrit des objets dans un compartiment Amazon S3 de chaque Région, et une réplication S3 entre Régions bidirectionnelle garde les compartiments synchronisés. Aujourd'hui, chaque service stocke le nom du compartiment régional dans sa configuration, et basculer tous les services vers le compartiment d'us-west-2 a pris 2 heures lors du dernier test de reprise. L'entreprise veut un seul point de terminaison S3 mondial pour les lectures comme pour les écritures. Lors d'une perturbation régionale, elle doit pouvoir envoyer toutes les requêtes S3 vers le compartiment d'us-west-2 en quelques minutes sans modifier la configuration des services.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon CloudFront distribution with an origin group that contains both buckets, and have the services send all reads and writes through the distribution domain name.", fr: "Créer une distribution Amazon CloudFront avec un groupe d'origines contenant les deux compartiments, et faire passer toutes les lectures et écritures des services par le nom de domaine de la distribution." }
    - id: b
      text: { en: "Create Amazon Route 53 failover CNAME records that point to the two Regional bucket endpoints, and have the services use the record name as the bucket host name.", fr: "Créer des enregistrements CNAME de basculement Amazon Route 53 qui pointent vers les deux points de terminaison régionaux des compartiments, et faire utiliser le nom de l'enregistrement par les services comme nom d'hôte du compartiment." }
    - id: c
      text: { en: "Create an AWS Global Accelerator standard accelerator with the two buckets as endpoints in two endpoint groups, and lower the traffic dial of us-east-1 during a disruption.", fr: "Créer un accélérateur standard AWS Global Accelerator avec les deux compartiments comme points de terminaison dans deux groupes, et baisser le traffic dial d'us-east-1 lors d'une perturbation." }
    - id: d
      text: { en: "Create an S3 Multi-Region Access Point for both buckets with us-east-1 active and us-west-2 passive, point the services to it, and use its failover controls during a disruption.", fr: "Créer un S3 Multi-Region Access Point pour les deux compartiments avec us-east-1 actif et us-west-2 passif, y faire pointer les services, et utiliser ses contrôles de basculement lors d'une perturbation." }
answer: { optionId: d }
explanation:
  correct:
    en: "A Multi-Region Access Point gives the application a single global endpoint in front of buckets in several Regions. With active/passive routing, requests such as GET and PUT go to the active Region, and failover controls change which Region is active, so all requests move to the us-west-2 bucket without changing the services; two-way replication keeps both buckets synchronized during and after the failover."
    fr: "Un Multi-Region Access Point fournit à l'application un seul point de terminaison mondial devant des compartiments de plusieurs Régions. Avec un routage actif/passif, les requêtes comme GET et PUT vont vers la Région active, et les contrôles de basculement changent la Région active : toutes les requêtes passent au compartiment d'us-west-2 sans modifier les services ; la réplication bidirectionnelle garde les deux compartiments synchronisés pendant et après le basculement."
  options:
    a:
      en: "CloudFront origin failover applies only to GET, HEAD and OPTIONS requests, so writes would not fail over to the us-west-2 bucket."
      fr: "Le basculement d'origine de CloudFront ne s'applique qu'aux requêtes GET, HEAD et OPTIONS : les écritures ne basculeraient pas vers le compartiment d'us-west-2."
    b:
      en: "Amazon S3 identifies the bucket from the request host name, so a single custom DNS name cannot front two buckets with different names in different Regions."
      fr: "Amazon S3 identifie le compartiment à partir du nom d'hôte de la requête : un seul nom DNS personnalisé ne peut pas servir deux compartiments aux noms différents dans des Régions différentes."
    c:
      en: "Global Accelerator endpoints are Network Load Balancers, Application Load Balancers, EC2 instances and Elastic IP addresses; S3 buckets are not supported endpoints."
      fr: "Les points de terminaison Global Accelerator sont des Network Load Balancers, des Application Load Balancers, des instances EC2 et des adresses IP Elastic ; les compartiments S3 ne sont pas des points de terminaison pris en charge."
references:
  - title: Amazon S3 Multi-Region Access Points failover controls
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MrapFailover.html
  - title: How AWS Global Accelerator works
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
