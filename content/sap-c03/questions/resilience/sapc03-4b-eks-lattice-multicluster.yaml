id: sapc03-4b-eks-lattice-multicluster
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs its payments service on two Amazon EKS clusters in the eu-west-1 Region, each in a different AWS account to limit the blast radius. About 15 consumer microservices run in other VPCs and accounts, and several of those VPCs use CIDR ranges that overlap with the cluster VPCs. Consumers must call the payments service through a single service name, and requests must be spread across both clusters. If one cluster or its pods become unhealthy, requests must go only to the healthy cluster without any change in the consumers. Calls must be authorized with IAM, and the network team refuses to add VPC peering or transit gateway routes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une banque exécute son service de paiement sur deux clusters Amazon EKS dans la Région eu-west-1, chacun dans un compte AWS différent pour limiter le rayon d'impact. Une quinzaine de microservices consommateurs s'exécutent dans d'autres VPC et comptes, et plusieurs de ces VPC utilisent des plages CIDR qui chevauchent celles des VPC des clusters. Les consommateurs doivent appeler le service de paiement par un seul nom de service, et les requêtes doivent être réparties entre les deux clusters. Si un cluster ou ses pods deviennent défaillants, les requêtes ne doivent aller qu'au cluster sain, sans aucune modification côté consommateurs. Les appels doivent être autorisés avec IAM, et l'équipe réseau refuse d'ajouter du peering de VPC ou des routes de passerelle de transit.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Attach all the VPCs to a transit gateway, expose each cluster through a Network Load Balancer, and create Route 53 private hosted zone weighted records with health checks for the two load balancers.", fr: "Attacher tous les VPC à une passerelle de transit, exposer chaque cluster par un Network Load Balancer, et créer des enregistrements pondérés de zone hébergée privée Route 53 avec vérifications de l'état pour les deux équilibreurs." }
    - id: b
      text: { en: "Create an AWS PrivateLink endpoint service for each cluster, and have every consumer create interface endpoints to both endpoint services and fail over between them in its client code.", fr: "Créer un service de point de terminaison AWS PrivateLink pour chaque cluster, et faire créer par chaque consommateur des points de terminaison d'interface vers les deux services avec un basculement entre eux dans son code client." }
    - id: c
      text: { en: "Share a VPC Lattice service network through AWS RAM, export the service from both clusters with the AWS Gateway API Controller, and route one Lattice service to both clusters with IAM auth policies.", fr: "Partager un réseau de services VPC Lattice via AWS RAM, exporter le service depuis les deux clusters avec l'AWS Gateway API Controller, et router un seul service Lattice vers les deux clusters avec des politiques d'authentification IAM." }
    - id: d
      text: { en: "Enable Amazon ECS Service Connect in both accounts with a shared AWS Cloud Map namespace, and register the payments pods of both clusters as endpoints of one service.", fr: "Activer Amazon ECS Service Connect dans les deux comptes avec un espace de noms AWS Cloud Map partagé, et enregistrer les pods de paiement des deux clusters comme points de terminaison d'un seul service." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon VPC Lattice connects services across VPCs and accounts, supports overlapping CIDR ranges, and is shared across accounts with AWS RAM, so no peering or transit gateway routes are needed. The AWS Gateway API Controller manages Lattice resources from Kubernetes for cross-cluster connectivity, Kubernetes pods can be Lattice targets, and a listener rule can forward one service name to target groups in both clusters while health checks and IAM auth policies handle failover and authorization."
    fr: "Amazon VPC Lattice relie des services entre VPC et comptes, prend en charge les plages CIDR qui se chevauchent et se partage entre comptes avec AWS RAM : aucun peering ni route de passerelle de transit n'est nécessaire. L'AWS Gateway API Controller gère les ressources Lattice depuis Kubernetes pour la connectivité entre clusters, des pods Kubernetes peuvent être des cibles Lattice, et une règle d'écouteur peut transmettre un seul nom de service vers des groupes cibles des deux clusters, tandis que les vérifications de l'état et les politiques d'authentification IAM assurent le basculement et l'autorisation."
  options:
    a:
      en: "A transit gateway needs the routes the network team refuses, cannot route between overlapping CIDR ranges, and provides no IAM authorization of calls."
      fr: "Une passerelle de transit exige les routes que l'équipe réseau refuse, ne peut pas router entre des plages CIDR qui se chevauchent et n'offre aucune autorisation IAM des appels."
    b:
      en: "Each consumer would manage two endpoints and failover logic in its own code, which is a change in the consumers and far more operational overhead."
      fr: "Chaque consommateur gérerait deux points de terminaison et une logique de basculement dans son propre code, ce qui modifie les consommateurs et représente bien plus de charge opérationnelle."
    d:
      en: "Service Connect is a feature of Amazon ECS services; it does not register pods running on EKS clusters."
      fr: "Service Connect est une fonctionnalité des services Amazon ECS ; il n'enregistre pas des pods exécutés sur des clusters EKS."
references:
  - title: What is Amazon VPC Lattice?
    url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/what-is-vpc-lattice.html
  - title: Enable secure cross-cluster connectivity with Amazon VPC Lattice
    url: https://docs.aws.amazon.com/eks/latest/userguide/integration-vpc-lattice.html
