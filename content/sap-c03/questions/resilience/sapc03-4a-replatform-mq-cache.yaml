id: sapc03-4a-replatform-mq-cache
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online ticketing company is replatforming its booking application to AWS. The application publishes booking events to a self-managed RabbitMQ cluster over AMQP and keeps seat holds and page fragments in a self-managed Redis OSS cluster. The operations team spends most of its time patching, upgrading and recovering these two clusters. Messages must still be delivered if one broker node or one Availability Zone becomes unavailable. The cache must fail over automatically to a replica in another Availability Zone. Developers can change connection endpoints but not the messaging or caching code.

    Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)
  fr: |
    Une société de billetterie en ligne change la plateforme de son application de réservation vers AWS. L'application publie des événements de réservation vers un cluster RabbitMQ autogéré en AMQP et conserve les réservations temporaires de places et des fragments de pages dans un cluster Redis OSS autogéré. L'équipe d'exploitation passe l'essentiel de son temps à corriger, mettre à niveau et rétablir ces deux clusters. Les messages doivent toujours être livrés si un nœud du broker ou une zone de disponibilité devient indisponible. Le cache doit basculer automatiquement vers un réplica dans une autre zone de disponibilité. Les développeurs peuvent modifier les points de terminaison de connexion, mais pas le code de messagerie ni de cache.

    Quelle combinaison d'étapes répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an Amazon MQ for RabbitMQ cluster broker and declare the booking queues as quorum queues."
        fr: "Créer un broker en cluster Amazon MQ for RabbitMQ et déclarer les files d'attente de réservation comme files quorum."
    - id: b
      text:
        en: "Replace RabbitMQ with an Amazon SNS topic that fans out to Amazon SQS queues for each consumer."
        fr: "Remplacer RabbitMQ par une rubrique Amazon SNS qui diffuse vers des files d'attente Amazon SQS pour chaque consommateur."
    - id: c
      text:
        en: "Create an Amazon ElastiCache replication group with replicas in other Availability Zones and Multi-AZ with automatic failover enabled."
        fr: "Créer un groupe de réplication Amazon ElastiCache avec des réplicas dans d'autres zones de disponibilité et Multi-AZ avec basculement automatique activé."
    - id: d
      text:
        en: "Rehost the RabbitMQ and Redis OSS servers to Amazon EC2 in three Availability Zones with AWS Transform MGN."
        fr: "Réhéberger les serveurs RabbitMQ et Redis OSS sur Amazon EC2 dans trois zones de disponibilité avec AWS Transform MGN."
    - id: e
      text:
        en: "Move the seat holds and page fragments to Amazon DynamoDB tables accelerated by DynamoDB Accelerator (DAX)."
        fr: "Déplacer les réservations temporaires et les fragments de pages vers des tables Amazon DynamoDB accélérées par DynamoDB Accelerator (DAX)."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Amazon MQ for RabbitMQ is a managed broker that keeps AMQP clients unchanged, and quorum queues replicate each queue to a leader and followers in different Availability Zones so delivery continues when a node is unavailable. ElastiCache for Valkey or Redis OSS is compatible with the existing client code, and Multi-AZ with automatic failover promotes a replica in another Availability Zone while the primary endpoint stays the same."
    fr: "Amazon MQ for RabbitMQ est un broker géré qui laisse les clients AMQP inchangés, et les files quorum répliquent chaque file sur un leader et des suiveurs dans différentes zones de disponibilité : la livraison continue quand un nœud est indisponible. ElastiCache pour Valkey ou Redis OSS est compatible avec le code client existant, et Multi-AZ avec basculement automatique promeut un réplica dans une autre zone de disponibilité tandis que le point de terminaison principal reste le même."
  options:
    b: { en: "SNS and SQS use different APIs from AMQP, so the messaging code would have to change.", fr: "SNS et SQS utilisent d'autres API qu'AMQP : le code de messagerie devrait changer." }
    d: { en: "A rehost keeps the same clusters to patch, upgrade and recover, which is the overhead the team wants to remove.", fr: "Un réhébergement conserve les mêmes clusters à corriger, mettre à niveau et rétablir, soit la charge que l'équipe veut supprimer." }
    e: { en: "DynamoDB and DAX use a different API from Redis OSS, so the caching code would have to change.", fr: "DynamoDB et DAX utilisent une autre API que Redis OSS : le code de cache devrait changer." }
references:
  - title: What is Amazon MQ?
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
  - title: Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html
