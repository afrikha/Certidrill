id: sapc03-4b-arc-routing-control-human
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading platform runs active/passive in the us-east-1 and us-west-2 Regions, and clients reach it through a DNS name hosted in Amazon Route 53. Twice last year, automatic failover based on health checks flipped traffic back and forth between the Regions during a partial degradation. The company now requires that an incident commander decides when to fail over between Regions. The failover action must keep working even if the control planes of AWS services are impaired during the event. The company also wants a guardrail that prevents operators from turning off both Regions by mistake.

    Which solution will meet these requirements?
  fr: |
    Une plateforme de trading fonctionne en actif/passif dans les Régions us-east-1 et us-west-2, et les clients l'atteignent par un nom DNS hébergé dans Amazon Route 53. Deux fois l'an dernier, le basculement automatique fondé sur des vérifications de l'état a fait aller et venir le trafic entre les Régions pendant une dégradation partielle. L'entreprise exige désormais qu'un responsable d'incident décide du moment du basculement entre Régions. L'action de basculement doit continuer de fonctionner même si les plans de contrôle des services AWS sont dégradés pendant l'incident. L'entreprise veut aussi un garde-fou qui empêche les opérateurs de désactiver par erreur les deux Régions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep Route 53 failover records with health checks on the Application Load Balancers, and raise the failure threshold so that only a sustained outage triggers a failover.", fr: "Conserver les enregistrements de basculement Route 53 avec vérifications de l'état sur les Application Load Balancers, et relever le seuil d'échec afin que seule une panne durable déclenche le basculement." }
    - id: b
      text: { en: "Create an ARC cluster with a routing control per Region tied to the Route 53 failover records, add a safety rule that keeps one Region on, and change states through the cluster endpoints.", fr: "Créer un cluster ARC avec un contrôle de routage par Région lié aux enregistrements de basculement Route 53, ajouter une règle de sécurité qui garde une Région active, et changer les états via les points de terminaison du cluster." }
    - id: c
      text: { en: "Replace the failover records with weighted records, and have the incident commander change the weights from 100/0 to 0/100 with the Route 53 ChangeResourceRecordSets API.", fr: "Remplacer les enregistrements de basculement par des enregistrements pondérés, et faire passer les poids de 100/0 à 0/100 par le responsable d'incident avec l'API Route 53 ChangeResourceRecordSets." }
    - id: d
      text: { en: "Put AWS Global Accelerator in front of both Regions, and have the incident commander set the traffic dial of the us-east-1 endpoint group to 0 percent through the Global Accelerator API to fail over.", fr: "Placer AWS Global Accelerator devant les deux Régions, et faire régler par le responsable d'incident le traffic dial du groupe de points de terminaison d'us-east-1 à 0 % par l'API Global Accelerator pour basculer." }
answer: { optionId: b }
explanation:
  correct:
    en: "ARC routing controls are on/off switches whose routing control health checks drive Route 53 failover records, so a person decides when traffic moves. State changes go through the highly reliable data plane of the cluster, which has endpoints in five Regions that operators can retry across, and safety rules act as guardrails, for example keeping at least one Region enabled."
    fr: "Les contrôles de routage ARC sont des interrupteurs marche/arrêt dont les vérifications de l'état de contrôle de routage pilotent les enregistrements de basculement Route 53 : une personne décide du moment où le trafic bascule. Les changements d'état passent par le plan de données très fiable du cluster, qui a des points de terminaison dans cinq Régions entre lesquels les opérateurs peuvent réessayer, et des règles de sécurité servent de garde-fous, par exemple pour garder au moins une Région active."
  options:
    a:
      en: "Health-check failover stays automatic, so the incident commander does not decide; a higher threshold only delays the flapping."
      fr: "Le basculement par vérification de l'état reste automatique : le responsable d'incident ne décide pas ; un seuil plus élevé ne fait que retarder les va-et-vient."
    c:
      en: "Changing record weights is a Route 53 control plane operation, which is less resilient than a data plane action during an event, and nothing prevents setting both weights to zero."
      fr: "Modifier les poids des enregistrements est une opération du plan de contrôle de Route 53, moins résiliente qu'une action du plan de données pendant un incident, et rien n'empêche de mettre les deux poids à zéro."
    d:
      en: "Updating a traffic dial is a configuration change through the Global Accelerator API, not a data plane operation, and it offers no guardrail against turning off both endpoint groups."
      fr: "Modifier un traffic dial est un changement de configuration par l'API Global Accelerator, pas une opération du plan de données, et cela n'offre aucun garde-fou contre la désactivation des deux groupes."
references:
  - title: Routing control in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
  - title: Best practices for routing control in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/route53-arc-best-practices.regional.html
