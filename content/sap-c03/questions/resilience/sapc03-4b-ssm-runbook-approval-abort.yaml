id: sapc03-4b-ssm-runbook-approval-abort
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank is formalizing the recovery procedure that promotes its standby database and redirects the application during a disaster. The procedure must pause until at least two of the five on-call database administrators approve the promotion. If the CloudWatch alarm that tracks the application error rate enters the ALARM state while the procedure runs, the procedure must stop automatically. When it stops this way, rollback steps must run without manual intervention. The bank wants a managed solution with the LEAST operational overhead and no custom orchestration code.

    Which solution will meet these requirements?
  fr: |
    Une banque formalise la procédure de reprise qui promeut sa base de données de secours et redirige l'application lors d'un sinistre. La procédure doit se mettre en pause jusqu'à ce qu'au moins deux des cinq administrateurs de bases de données d'astreinte approuvent la promotion. Si l'alarme CloudWatch qui suit le taux d'erreurs de l'application passe à l'état ALARM pendant l'exécution, la procédure doit s'arrêter automatiquement. Lorsqu'elle s'arrête ainsi, des étapes de retour arrière doivent s'exécuter sans intervention manuelle. La banque veut une solution gérée avec le MOINS de charge opérationnelle et sans code d'orchestration personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a pipeline in AWS CodePipeline with two manual approval actions followed by an AWS CodeBuild action that runs the promotion commands, and a separate pipeline that operators start to roll back.", fr: "Créer un pipeline AWS CodePipeline avec deux actions d'approbation manuelle suivies d'une action AWS CodeBuild qui exécute les commandes de promotion, et un pipeline distinct que les opérateurs lancent pour revenir en arrière." }
    - id: b
      text: { en: "Create an AWS Step Functions workflow with two callback-token tasks for approvals, an EventBridge rule on the alarm that invokes a Lambda function to stop the execution, and a Catch that runs the rollback.", fr: "Créer un workflow AWS Step Functions avec deux tâches à jeton de rappel pour les approbations, une règle EventBridge sur l'alarme qui invoque une fonction Lambda pour arrêter l'exécution, et un Catch qui lance le retour arrière." }
    - id: c
      text: { en: "Create an SSM Command document that runs the promotion with Run Command, and send an SNS notification asking the database administrators to reply before an operator starts the command.", fr: "Créer un document SSM Command qui exécute la promotion avec Run Command, et envoyer une notification SNS demandant aux administrateurs de répondre avant qu'un opérateur lance la commande." }
    - id: d
      text: { en: "Create an Automation runbook with an aws:approve step that lists the five administrators and sets MinRequiredApprovals to 2, onCancel rollback steps, and start it with the error-rate alarm attached to the execution.", fr: "Créer un runbook Automation avec une étape aws:approve qui liste les cinq administrateurs et définit MinRequiredApprovals à 2, des étapes onCancel de retour arrière, et le lancer avec l'alarme de taux d'erreurs associée à l'exécution." }
answer: { optionId: d }
explanation:
  correct:
    en: "The aws:approve action pauses an Automation runbook until the required number of listed approvers (MinRequiredApprovals, up to 10 approvers) approve, optionally notifying them through SNS. A CloudWatch alarm can be attached to the automation execution: when the alarm enters ALARM, the automation is canceled and the onCancel steps run, which gives automatic abort and rollback without custom code."
    fr: "L'action aws:approve met en pause un runbook Automation jusqu'à ce que le nombre requis d'approbateurs listés (MinRequiredApprovals, jusqu'à 10 approbateurs) approuve, avec notification facultative par SNS. Une alarme CloudWatch peut être associée à l'exécution d'Automation : quand l'alarme passe à ALARM, l'automatisation est annulée et les étapes onCancel s'exécutent, ce qui donne un arrêt et un retour arrière automatiques sans code personnalisé."
  options:
    a:
      en: "The pipeline has no way to stop on the error-rate alarm, and the rollback depends on operators starting a second pipeline manually."
      fr: "Le pipeline ne peut pas s'arrêter sur l'alarme de taux d'erreurs, et le retour arrière dépend d'opérateurs qui lancent manuellement un second pipeline."
    b:
      en: "This works, but callback handling, the alarm-to-Lambda stop logic and the rollback wiring are custom orchestration code to build and maintain."
      fr: "Cela fonctionne, mais la gestion des rappels, la logique d'arrêt de l'alarme vers Lambda et le câblage du retour arrière sont du code d'orchestration personnalisé à construire et à maintenir."
    c:
      en: "Replies to an SNS email are not recorded approvals, and Run Command provides neither a two-approver gate nor automatic cancellation with rollback."
      fr: "Les réponses à un e-mail SNS ne sont pas des approbations enregistrées, et Run Command ne fournit ni contrôle à deux approbateurs ni annulation automatique avec retour arrière."
references:
