id: sapc03-4b-drs-ec2-cross-region
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare SaaS provider runs a legacy patient-scheduling application on 25 Amazon EC2 instances in the us-east-1 Region. The instances include self-managed MySQL servers on Amazon EBS volumes and third-party software that cannot be refactored. The provider must be able to recover the application in the us-west-2 Region with an RPO of seconds and an RTO of 30 minutes. Compute costs in us-west-2 must stay minimal until a recovery is needed. The VPC configuration used for recovery, including security groups, must stay consistent with production as the network team changes it.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS de santé exécute une application historique de prise de rendez-vous sur 25 instances Amazon EC2 dans la Région us-east-1. Les instances comprennent des serveurs MySQL autogérés sur des volumes Amazon EBS et des logiciels tiers qui ne peuvent pas être refactorisés. Le fournisseur doit pouvoir récupérer l'application dans la Région us-west-2 avec un RPO de quelques secondes et un RTO de 30 minutes. Les coûts de calcul dans us-west-2 doivent rester minimaux tant qu'aucune reprise n'est nécessaire. La configuration VPC utilisée pour la reprise, y compris les groupes de sécurité, doit rester cohérente avec la production au fil des modifications de l'équipe réseau.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Backup plan that backs up the EC2 instances every hour with a copy rule to us-west-2, and restore the instances with a CloudFormation template of the VPC during a disaster.", fr: "Créer un plan AWS Backup qui sauvegarde les instances EC2 toutes les heures avec une règle de copie vers us-west-2, et restaurer les instances avec un modèle CloudFormation du VPC lors d'un sinistre." }
    - id: b
      text: { en: "Create Amazon Data Lifecycle Manager policies that take hourly EBS snapshots with cross-Region copy to us-west-2, and launch instances from the copied snapshots during a disaster.", fr: "Créer des politiques Amazon Data Lifecycle Manager qui prennent des instantanés EBS horaires avec copie entre Régions vers us-west-2, et lancer des instances depuis les instantanés copiés lors d'un sinistre." }
    - id: c
      text: { en: "Add the EC2 instances as source servers of AWS Elastic Disaster Recovery with a staging area in us-west-2, and replicate the source networks so that the recovery VPC configuration follows production.", fr: "Ajouter les instances EC2 comme serveurs sources d'AWS Elastic Disaster Recovery avec une zone de transit dans us-west-2, et répliquer les réseaux sources afin que la configuration du VPC de reprise suive la production." }
    - id: d
      text: { en: "Run a copy of all 25 instances in us-west-2, configure MySQL replication between the Regions, and synchronize the other servers with scheduled rsync jobs.", fr: "Exécuter une copie des 25 instances dans us-west-2, configurer la réplication MySQL entre les Régions, et synchroniser les autres serveurs avec des tâches rsync planifiées." }
answer: { optionId: c }
explanation:
  correct:
    en: "Elastic Disaster Recovery can protect EC2 instances and recover them in another Region, with continuous block-level replication for an RPO of seconds and recovery in minutes, while the staging area uses only low-cost storage and lightweight replication servers. Network replication tracks changes to in-AWS source networks, such as security group updates, and deploys the recovered network with CloudFormation so that recovery instances launch into a matching VPC."
    fr: "Elastic Disaster Recovery peut protéger des instances EC2 et les récupérer dans une autre Région, avec une réplication continue au niveau bloc pour un RPO de quelques secondes et une reprise en quelques minutes, tandis que la zone de transit n'utilise qu'un stockage peu coûteux et des serveurs de réplication légers. La réplication réseau suit les modifications des réseaux sources dans AWS, comme les mises à jour de groupes de sécurité, et déploie le réseau récupéré avec CloudFormation pour que les instances de reprise démarrent dans un VPC correspondant."
  options:
    a:
      en: "Hourly backups give an RPO of up to 1 hour, and a static VPC template drifts from production as the network team changes it."
      fr: "Des sauvegardes horaires donnent un RPO pouvant atteindre 1 heure, et un modèle VPC statique s'écarte de la production au fil des modifications de l'équipe réseau."
    b:
      en: "Hourly snapshots give an RPO of up to 1 hour, and nothing keeps the recovery network consistent with production."
      fr: "Des instantanés horaires donnent un RPO pouvant atteindre 1 heure, et rien ne garde le réseau de reprise cohérent avec la production."
    d:
      en: "A full running copy pays for 25 instances continuously, and scheduled rsync jobs neither give an RPO of seconds nor cover the network configuration."
      fr: "Une copie complète en fonctionnement paie 25 instances en permanence, et des tâches rsync planifiées ne donnent pas un RPO de quelques secondes et ne couvrent pas la configuration réseau."
references:
  - title: Source networks
    url: https://docs.aws.amazon.com/drs/latest/userguide/source-networks.html
  - title: AWS Elastic Disaster Recovery FAQs
    url: https://aws.amazon.com/disaster-recovery/faqs/
