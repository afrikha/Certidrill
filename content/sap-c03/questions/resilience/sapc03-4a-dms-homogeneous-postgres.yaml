id: sapc03-4a-dms-homogeneous-postgres
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company runs 40 self-managed PostgreSQL databases on Amazon EC2 instances and wants to move them to Amazon Aurora PostgreSQL to reduce administration. The DBA team is small and does not want to size, patch or monitor replication instances during the migration. The DBAs want the migration to use the native PostgreSQL tools so that it is like-for-like and performs well. Each database must stay online during the migration, and cutover downtime must be a few minutes at most. Secondary objects such as functions and stored procedures must be migrated too.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS exécute 40 bases de données PostgreSQL autogérées sur des instances Amazon EC2 et veut les déplacer vers Amazon Aurora PostgreSQL pour réduire l'administration. L'équipe de DBA est réduite et ne veut ni dimensionner, ni corriger, ni surveiller des instances de réplication pendant la migration. Les DBA veulent que la migration utilise les outils natifs de PostgreSQL pour qu'elle soit à l'identique et performante. Chaque base doit rester en ligne pendant la migration, et l'interruption au basculement ne doit pas dépasser quelques minutes. Les objets secondaires, comme les fonctions et les procédures stockées, doivent aussi être migrés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create provisioned AWS DMS replication instances sized for each database, and run full load and CDC tasks between PostgreSQL source and Aurora PostgreSQL target endpoints."
        fr: "Créer des instances de réplication AWS DMS provisionnées dimensionnées pour chaque base, puis exécuter des tâches de chargement complet et de CDC entre des points de terminaison source PostgreSQL et cible Aurora PostgreSQL."
    - id: b
      text:
        en: "Use AWS DMS homogeneous data migrations: create an instance profile, source and target data providers and a migration project, and run each migration in full load and ongoing replication mode."
        fr: "Utiliser les migrations de données homogènes AWS DMS : créer un profil d'instance, des fournisseurs de données source et cible et un projet de migration, puis exécuter chaque migration en mode chargement complet et réplication continue."
    - id: c
      text:
        en: "Run pg_dump on each EC2 instance during a maintenance window, copy the dump files to Amazon S3, and restore them into Aurora PostgreSQL with pg_restore from an EC2 jump host."
        fr: "Exécuter pg_dump sur chaque instance EC2 pendant une fenêtre de maintenance, copier les fichiers d'export dans Amazon S3, puis les restaurer dans Aurora PostgreSQL avec pg_restore depuis un hôte de rebond EC2."
    - id: d
      text:
        en: "Convert the schemas with DMS Schema Conversion, and then migrate the data with AWS DMS Serverless replications in full load and CDC mode between the PostgreSQL source and Aurora PostgreSQL target endpoints."
        fr: "Convertir les schémas avec DMS Schema Conversion, puis migrer les données avec des réplications AWS DMS Serverless en mode chargement complet et CDC entre les points de terminaison source PostgreSQL et cible Aurora PostgreSQL."
answer: { optionId: b }
explanation:
  correct:
    en: "DMS homogeneous data migrations move self-managed databases to their Amazon RDS or Aurora equivalents with the engine's native tools. DMS provisions and scales the serverless migration environment, supports full load with ongoing replication, and migrates secondary objects such as functions and stored procedures."
    fr: "Les migrations de données homogènes AWS DMS déplacent des bases autogérées vers leurs équivalents Amazon RDS ou Aurora avec les outils natifs du moteur. DMS provisionne et met à l'échelle l'environnement de migration sans serveur, prend en charge le chargement complet avec réplication continue et migre les objets secondaires comme les fonctions et les procédures stockées."
  options:
    a: { en: "Provisioned replication instances are exactly the infrastructure that the DBAs do not want to size and monitor, and standard DMS tasks do not use the native PostgreSQL tools.", fr: "Les instances de réplication provisionnées sont précisément l'infrastructure que les DBA ne veulent ni dimensionner ni surveiller, et les tâches DMS standard n'utilisent pas les outils natifs de PostgreSQL." }
    c: { en: "A dump and restore without ongoing replication requires the database to stop accepting writes for the whole copy, which exceeds a few minutes of downtime.", fr: "Un export et une restauration sans réplication continue imposent d'arrêter les écritures pendant toute la copie, ce qui dépasse quelques minutes d'interruption." }
    d: { en: "Schema conversion is unnecessary between identical engines, and DMS Serverless replications do not use the native PostgreSQL tools.", fr: "La conversion de schéma est inutile entre moteurs identiques, et les réplications AWS DMS Serverless n'utilisent pas les outils natifs de PostgreSQL." }
references:
  - title: Migrating databases to their Amazon RDS equivalents with AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/data-migrations.html
