id: sapc03-4a-ecs-fargate-tomcat
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company runs a Java web application on Apache Tomcat on 12 Linux virtual machines behind a hardware load balancer with sticky sessions. HTTP sessions are kept in the memory of each Tomcat server, and the servers share an NFS directory where customers upload documents. The company wants to stop managing operating systems and application servers, scale out automatically during sales events and survive the loss of an Availability Zone. Developers can change configuration files, such as the session manager settings, but they cannot rewrite the application.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de commerce en ligne exécute une application web Java sur Apache Tomcat sur 12 machines virtuelles Linux derrière un équilibreur de charge matériel avec des sessions persistantes. Les sessions HTTP sont conservées dans la mémoire de chaque serveur Tomcat, et les serveurs partagent un répertoire NFS dans lequel les clients chargent des documents. L'entreprise veut cesser de gérer les systèmes d'exploitation et les serveurs d'applications, monter en charge automatiquement pendant les soldes et survivre à la perte d'une zone de disponibilité. Les développeurs peuvent modifier des fichiers de configuration, comme les paramètres du gestionnaire de sessions, mais ne peuvent pas réécrire l'application.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Rehost the 12 virtual machines to Amazon EC2 with AWS Transform MGN in an Auto Scaling group across two Availability Zones behind an Application Load Balancer with sticky sessions, and mount Amazon EFS."
        fr: "Réhéberger les 12 machines virtuelles sur Amazon EC2 avec AWS Transform MGN dans un groupe Auto Scaling sur deux zones de disponibilité derrière un Application Load Balancer avec sessions persistantes, puis monter Amazon EFS."
    - id: b
      text:
        en: "Containerize the application and run it on Amazon ECS with AWS Fargate behind an Application Load Balancer with sticky sessions, keep sessions in memory, and store uploads on the ephemeral storage of each task."
        fr: "Conteneuriser l'application et l'exécuter sur Amazon ECS avec AWS Fargate derrière un Application Load Balancer avec sessions persistantes, conserver les sessions en mémoire et stocker les fichiers chargés sur le stockage éphémère de chaque tâche."
    - id: c
      text:
        en: "Rewrite each page of the application as an AWS Lambda function behind Amazon API Gateway, store sessions in Amazon DynamoDB, and store the uploaded documents in Amazon S3."
        fr: "Réécrire chaque page de l'application sous forme de fonction AWS Lambda derrière Amazon API Gateway, stocker les sessions dans Amazon DynamoDB et les documents chargés dans Amazon S3."
    - id: d
      text:
        en: "Run the containerized application on Amazon ECS with AWS Fargate across multiple Availability Zones behind an Application Load Balancer, store sessions in Amazon ElastiCache, and mount Amazon EFS for the uploads."
        fr: "Exécuter l'application conteneurisée sur Amazon ECS avec AWS Fargate sur plusieurs zones de disponibilité derrière un Application Load Balancer, stocker les sessions dans Amazon ElastiCache et monter Amazon EFS pour les fichiers chargés."
answer: { optionId: d }
explanation:
  correct:
    en: "ECS on Fargate removes the management of hosts and operating systems, and ECS service auto scaling adds tasks across Availability Zones. Moving the sessions to ElastiCache through the session manager configuration makes tasks stateless, and Fargate tasks can mount an EFS file system, which replaces the shared NFS directory."
    fr: "ECS sur Fargate supprime la gestion des hôtes et des systèmes d'exploitation, et la mise à l'échelle automatique du service ECS ajoute des tâches réparties sur les zones de disponibilité. Déplacer les sessions vers ElastiCache par la configuration du gestionnaire de sessions rend les tâches sans état, et les tâches Fargate peuvent monter un système de fichiers EFS, qui remplace le répertoire NFS partagé."
  options:
    a: { en: "A rehost keeps the operating systems and Tomcat servers to manage, which the company wants to stop doing.", fr: "Un réhébergement laisse les systèmes d'exploitation et les serveurs Tomcat à gérer, ce que l'entreprise veut cesser de faire." }
    b: { en: "In-memory sessions are lost when a task stops or scales in, and ephemeral task storage loses the uploaded documents.", fr: "Les sessions en mémoire sont perdues quand une tâche s'arrête ou que le service réduit sa capacité, et le stockage éphémère des tâches perd les documents chargés." }
    c: { en: "Rewriting the application as Lambda functions is a refactor that the developers are not allowed to do.", fr: "Réécrire l'application en fonctions Lambda est une refactorisation que les développeurs n'ont pas le droit de faire." }
references:
  - title: Use Amazon EFS volumes with Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/efs-volumes.html
