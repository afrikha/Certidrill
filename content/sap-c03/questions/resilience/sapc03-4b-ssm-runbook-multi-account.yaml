id: sapc03-4b-ssm-runbook-multi-account
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations, and a delegated administrator account for AWS Systems Manager is used by the operations team. A recovery procedure that rebuilds the cache tier and restarts the application services of a workload must run consistently in 30 member accounts in two Regions. The procedure is defined as a custom Systems Manager Automation runbook. During a recovery, no more than 10 percent of the account-Region pairs may run the procedure at the same time, and the rollout must stop after two failed locations. Operators must start and monitor the whole procedure from the delegated administrator account.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise AWS Organizations, et un compte administrateur délégué pour AWS Systems Manager est utilisé par l'équipe d'exploitation. Une procédure de reprise qui reconstruit le niveau de cache et redémarre les services applicatifs d'une charge de travail doit s'exécuter de manière homogène dans 30 comptes membres dans deux Régions. La procédure est définie comme un runbook Automation personnalisé de Systems Manager. Pendant une reprise, au plus 10 % des couples compte-Région peuvent exécuter la procédure en même temps, et le déploiement doit s'arrêter après deux emplacements en échec. Les opérateurs doivent lancer et suivre l'ensemble de la procédure depuis le compte administrateur délégué.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Share an SSM Command document with all member accounts, and have a CI job assume a role in each account and Region to run the document with Run Command one location at a time.", fr: "Partager un document SSM Command avec tous les comptes membres, et faire assumer par une tâche CI un rôle dans chaque compte et chaque Région pour exécuter le document avec Run Command, un emplacement à la fois." }
    - id: b
      text: { en: "Package the recovery steps in a CloudFormation custom resource, and deploy it with a stack set whose maximum concurrent accounts is 10 percent and failure tolerance is two.", fr: "Empaqueter les étapes de reprise dans une ressource personnalisée CloudFormation, et la déployer avec un ensemble de piles dont le nombre maximal de comptes simultanés est 10 % et la tolérance aux pannes est deux." }
    - id: c
      text: { en: "Create the Automation administration role centrally and the execution role in each member account, and start a multi-account, multi-Region execution with a location concurrency of 10 percent and an error threshold of 2.", fr: "Créer le rôle d'administration Automation dans le compte central et le rôle d'exécution dans chaque compte membre, et lancer une exécution multicomptes et multi-Régions avec une simultanéité d'emplacements de 10 % et un seuil d'erreurs de 2." }
    - id: d
      text: { en: "Create an EventBridge cross-account event bus that sends a recovery event to every member account, where a Lambda function runs the recovery steps and reports back.", fr: "Créer un bus d'événements EventBridge entre comptes qui envoie un événement de reprise à chaque compte membre, où une fonction Lambda exécute les étapes de reprise et rend compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "Systems Manager Automation runs a runbook across accounts, OUs and Regions from a central account that holds AWS-SystemsManager-AutomationAdministrationRole, with AWS-SystemsManager-AutomationExecutionRole in each target account (deployed, for example, with StackSets). Location concurrency (TargetLocationMaxConcurrency) and location error threshold (TargetLocationMaxErrors) control the account-Region pairs, and the parent execution shows the child executions. A custom runbook must be shared with the target accounts."
    fr: "Systems Manager Automation exécute un runbook entre comptes, unités d'organisation et Régions depuis un compte central qui détient AWS-SystemsManager-AutomationAdministrationRole, avec AWS-SystemsManager-AutomationExecutionRole dans chaque compte cible (déployé par exemple avec StackSets). La simultanéité d'emplacements (TargetLocationMaxConcurrency) et le seuil d'erreurs d'emplacements (TargetLocationMaxErrors) contrôlent les couples compte-Région, et l'exécution parente présente les exécutions enfants. Un runbook personnalisé doit être partagé avec les comptes cibles."
  options:
    a:
      en: "A CI job that assumes roles location by location is custom orchestration; it rebuilds the rate control and error handling that Automation provides, and the procedure is already an Automation runbook."
      fr: "Une tâche CI qui assume des rôles emplacement par emplacement est une orchestration personnalisée ; elle recrée le contrôle de débit et la gestion des erreurs fournis par Automation, et la procédure est déjà un runbook Automation."
    b:
      en: "StackSets deploy stacks; running operational recovery steps inside a custom resource needs Lambda code and turns a recovery action into a stack deployment that must later be cleaned up."
      fr: "StackSets déploie des piles ; exécuter des étapes de reprise dans une ressource personnalisée exige du code Lambda et transforme une action de reprise en déploiement de pile qu'il faudra ensuite nettoyer."
    d:
      en: "Fanning out events to Lambda functions provides no concurrency limit or error threshold across locations, and the functions must be written and maintained in 30 accounts."
      fr: "Diffuser des événements vers des fonctions Lambda ne fournit ni limite de simultanéité ni seuil d'erreurs entre emplacements, et les fonctions doivent être écrites et maintenues dans 30 comptes."
references:
  - title: Running automations in multiple AWS Regions and accounts
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
