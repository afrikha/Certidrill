id: sapc03-4c-policy-lock-child-plan
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 140 AWS accounts in AWS Organizations, with one OU for each business unit. The central cloud team manages backup policies from a delegated administrator account. The team attaches a backup policy named Regulated-Baseline to the organization root. The policy defines a backup plan named Regulated_Daily with a daily rule, a 35-day retention, and a copy action to a locked vault in a central backup account. Each business unit team is allowed to attach its own backup policies to its OU. Last quarter, one business unit attached a child policy that used @@assign to shorten the Regulated_Daily retention to 7 days, and the change was found only during an audit. The business units must keep the ability to add their own backup plans for their workloads through child policies.

    Which change to the Regulated-Baseline policy will meet these requirements?
  fr: |
    AnyCompany possède 140 comptes AWS dans AWS Organizations, avec une OU par unité métier. L'équipe cloud centrale gère les politiques de sauvegarde depuis un compte administrateur délégué. L'équipe attache une politique de sauvegarde nommée Regulated-Baseline à la racine de l'organisation. Cette politique définit un plan de sauvegarde nommé Regulated_Daily avec une règle quotidienne, une rétention de 35 jours et une action de copie vers un coffre verrouillé dans un compte de sauvegarde central. Chaque équipe d'unité métier est autorisée à attacher ses propres politiques de sauvegarde à son OU. Le trimestre dernier, une unité métier a attaché une politique enfant qui utilisait @@assign pour réduire la rétention de Regulated_Daily à 7 jours, et la modification n'a été découverte que lors d'un audit. Les unités métier doivent conserver la possibilité d'ajouter leurs propres plans de sauvegarde pour leurs charges de travail au moyen de politiques enfants.

    Quelle modification de la politique Regulated-Baseline répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set @@operators_allowed_for_child_policies to @@none on every node of the policy, including the plans node, so that child policies can't alter the effective policy."
        fr: "Définir @@operators_allowed_for_child_policies à @@none sur chaque nœud de la politique, y compris le nœud plans, pour que les politiques enfants ne puissent pas modifier la politique effective."
    - id: b
      text:
        en: "Keep the default child-control settings, and set every Regulated_Daily value with @@assign, because a parent @@assign always takes precedence over a child @@assign."
        fr: "Conserver les paramètres de contrôle des enfants par défaut et définir chaque valeur de Regulated_Daily avec @@assign, car un @@assign parent l'emporte toujours sur un @@assign enfant."
    - id: c
      text:
        en: "Set @@operators_allowed_for_child_policies to @@append on the plans node, and to @@none on the Regulated_Daily plan node and on each of its child nodes."
        fr: "Définir @@operators_allowed_for_child_policies à @@append sur le nœud plans, et à @@none sur le nœud du plan Regulated_Daily et sur chacun de ses nœuds enfants."
    - id: d
      text:
        en: "Attach an SCP to the business unit OUs that denies backup:UpdateBackupPlan and backup:DeleteBackupPlan, so that member accounts can't change the plan that the policy creates."
        fr: "Attacher aux OU des unités métier une SCP qui refuse backup:UpdateBackupPlan et backup:DeleteBackupPlan, pour que les comptes membres ne puissent pas modifier le plan créé par la politique."
answer: { optionId: c }
explanation:
  correct:
    en: "Without a child-control operator, a child policy can @@assign, @@append or @@remove any inherited value, which is how the retention was shortened. Allowing only @@append on the plans node lets business units add their own plans to the effective policy, while @@none on the Regulated_Daily plan and its child nodes (rules, lifecycle, copy actions, selections) blocks every change to the inherited plan."
    fr: "Sans opérateur de contrôle des enfants, une politique enfant peut appliquer @@assign, @@append ou @@remove à toute valeur héritée, ce qui a permis de réduire la rétention. N'autoriser que @@append sur le nœud plans permet aux unités métier d'ajouter leurs propres plans à la politique effective, tandis que @@none sur le plan Regulated_Daily et ses nœuds enfants (règles, cycle de vie, actions de copie, sélections) bloque toute modification du plan hérité."
  options:
    a: { en: "@@none on the plans node also prevents child policies from adding plans, so the business units lose the ability to define backup plans for their own workloads.", fr: "@@none sur le nœud plans empêche aussi les politiques enfants d'ajouter des plans : les unités métier perdent la possibilité de définir des plans de sauvegarde pour leurs propres charges de travail." }
    b: { en: "By default a child policy can override an inherited value with its own @@assign; this default is exactly what allowed the 7-day retention.", fr: "Par défaut, une politique enfant peut remplacer une valeur héritée par son propre @@assign ; c'est justement ce comportement par défaut qui a permis la rétention de 7 jours." }
    d: { en: "The retention was changed by a child backup policy that AWS Organizations merged into the effective policy, not by API calls in member accounts; an SCP on member accounts doesn't control policy inheritance.", fr: "La rétention a été modifiée par une politique de sauvegarde enfant qu'AWS Organizations a fusionnée dans la politique effective, et non par des appels d'API dans les comptes membres ; une SCP sur les comptes membres ne contrôle pas l'héritage des politiques." }
references:
  - title: Backup policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup_syntax.html
