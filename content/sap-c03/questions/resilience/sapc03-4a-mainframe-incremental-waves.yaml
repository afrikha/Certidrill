id: sapc03-4a-mainframe-incremental-waves
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail bank has a z/OS mainframe with about eight million lines of COBOL, JCL and PL/I code that supports deposits, lending and payments. Documentation is out of date, and a previous attempt to rewrite the whole system at once was cancelled after two years. The new program must reduce risk by modernizing the system to Java one business domain at a time. Subject matter experts must approve how the code is split into domains and the order of the waves before any code is transformed. Each wave must prove that the modernized code behaves like the legacy code before it goes live.

    Which approach will meet these requirements?
  fr: |
    Une banque de détail dispose d'un mainframe z/OS avec environ huit millions de lignes de code COBOL, JCL et PL/I qui prennent en charge les dépôts, les prêts et les paiements. La documentation n'est plus à jour, et une précédente tentative de réécriture complète du système en une fois a été abandonnée au bout de deux ans. Le nouveau programme doit réduire le risque en modernisant le système vers Java un domaine métier à la fois. Des experts métier doivent approuver la façon dont le code est découpé en domaines et l'ordre des vagues avant toute transformation du code. Chaque vague doit prouver que le code modernisé se comporte comme le code hérité avant sa mise en production.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use AWS Transform for mainframe to refactor the entire codebase to Java in a single transformation job, and test the complete application once before a single cutover weekend."
        fr: "Utiliser AWS Transform for mainframe pour refactoriser tout le code vers Java en une seule tâche de transformation, puis tester l'application complète une fois avant un unique week-end de basculement."
    - id: b
      text:
        en: "Use AWS Transform for mainframe to document the code, decompose it into domains and waves for expert approval, then refactor wave by wave to Java and verify functional equivalence before each go-live."
        fr: "Utiliser AWS Transform for mainframe pour documenter le code, le décomposer en domaines et en vagues soumis à l'approbation des experts, puis refactoriser vague par vague vers Java et vérifier l'équivalence fonctionnelle avant chaque mise en production."
    - id: c
      text:
        en: "Replatform the whole mainframe to the AWS Mainframe Modernization managed runtime environment with Rocket first, and then rewrite the COBOL programs to Java by hand domain by domain."
        fr: "Changer d'abord la plateforme de tout le mainframe vers l'environnement d'exécution géré AWS Mainframe Modernization avec Rocket, puis réécrire à la main les programmes COBOL en Java domaine par domaine."
    - id: d
      text:
        en: "Ask a new Java team to interview the business users, write new specifications for each domain, and develop and release new microservices domain by domain from these specifications without analyzing the legacy code."
        fr: "Demander à une nouvelle équipe Java d'interroger les utilisateurs métier, de rédiger de nouvelles spécifications par domaine, puis de développer et publier de nouveaux microservices domaine par domaine à partir de ces spécifications, sans analyser le code hérité."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Transform for mainframe analyzes the codebase, generates documentation and extracts business logic, then decomposes the monolith into domains and migration waves, steps that require human approval. Refactoring and testing each wave against the legacy behavior keeps the risk of each go-live small."
    fr: "AWS Transform for mainframe analyse le code, génère de la documentation et extrait la logique métier, puis décompose le monolithe en domaines et en vagues de migration, des étapes qui exigent une approbation humaine. Refactoriser et tester chaque vague par rapport au comportement hérité limite le risque de chaque mise en production."
  options:
    a: { en: "A single transformation and cutover of the whole system is the big-bang approach that failed before, and it skips the per-domain approval.", fr: "Une transformation et un basculement uniques de tout le système correspondent à l'approche big-bang qui a déjà échoué, et ils sautent l'approbation par domaine." }
    c: { en: "The managed runtime environment with Rocket is no longer open to new customers, and a manual rewrite keeps the risk of the cancelled project.", fr: "L'environnement d'exécution géré avec Rocket n'est plus ouvert aux nouveaux clients, et une réécriture manuelle conserve le risque du projet abandonné." }
    d: { en: "Without analyzing the code, the undocumented business rules are lost, and nothing proves that the new services behave like the legacy system.", fr: "Sans analyse du code, les règles métier non documentées sont perdues, et rien ne prouve que les nouveaux services se comportent comme le système hérité." }
references:
  - title: Modernization of mainframe applications
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-app-mainframe.html
