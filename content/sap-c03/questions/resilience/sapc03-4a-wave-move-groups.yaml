id: sapc03-4a-wave-move-groups
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has finished discovering 2,400 servers with AWS Transform and is building its migration plan. The discovery data shows that almost every server has network connections to the Active Directory domain controllers, the backup servers and the monitoring servers. When the team grouped applications by network connections, AWS Transform produced a single move group of 2,100 servers, which is far too large for one wave. The order management application must stay with its Oracle database because it cannot tolerate the latency of a hybrid connection. The reporting application queries the same database once a night and tolerates higher latency.

    Which approach will produce a workable wave plan?
  fr: |
    Une entreprise de distribution a terminé la découverte de 2 400 serveurs avec AWS Transform et construit son plan de migration. Les données de découverte montrent que presque tous les serveurs ont des connexions réseau vers les contrôleurs de domaine Active Directory, les serveurs de sauvegarde et les serveurs de supervision. Lorsque l'équipe a regroupé les applications par connexions réseau, AWS Transform a produit un seul groupe de déplacement (move group) de 2 100 serveurs, bien trop grand pour une vague. L'application de gestion des commandes doit rester avec sa base de données Oracle, car elle ne tolère pas la latence d'une connexion hybride. L'application de reporting interroge la même base une fois par nuit et tolère une latence plus élevée.

    Quelle approche produira un plan de vagues exploitable ?
body:
  options:
    - id: a
      text:
        en: "Use each source subnet as a move group so that the group sizes become manageable, and migrate the subnets in order of size, starting with the smallest subnet and ending with the database subnet."
        fr: "Utiliser chaque sous-réseau source comme groupe de déplacement pour obtenir des groupes de taille gérable, puis migrer les sous-réseaux par ordre de taille, du plus petit jusqu'au sous-réseau des bases de données."
    - id: b
      text:
        en: "Keep the single move group, and split it into waves with an equal number of servers so that each wave fits the team's capacity, regardless of the dependencies."
        fr: "Conserver le groupe de déplacement unique et le découper en vagues comportant le même nombre de serveurs pour respecter la capacité de l'équipe, sans tenir compte des dépendances."
    - id: c
      text:
        en: "Treat every network connection as a hard dependency, and move the order management application, the reporting application and all of the shared services together in the first wave."
        fr: "Traiter chaque connexion réseau comme une dépendance critique et déplacer ensemble, dans la première vague, l'application de gestion des commandes, l'application de reporting et tous les services partagés."
    - id: d
      text:
        en: "Exclude the shared services from dependency grouping, treat the order management link to the database as a hard dependency, and treat the reporting link as a soft dependency."
        fr: "Exclure les services partagés du regroupement par dépendances, traiter le lien entre la gestion des commandes et la base comme une dépendance critique, et le lien du reporting comme une dépendance souple."
answer: { optionId: d }
explanation:
  correct:
    en: "Shared services such as Active Directory, backup and monitoring connect to everything and glue the whole scope into one group, so they are filtered out of dependency analysis and handled separately. Hard (latency-sensitive) dependencies stay in the same move group, while soft dependencies such as a nightly report can be split across on premises and AWS for a while."
    fr: "Les services partagés comme Active Directory, la sauvegarde et la supervision sont connectés à tout et soudent tout le périmètre en un seul groupe : on les exclut de l'analyse des dépendances et on les traite à part. Les dépendances critiques (sensibles à la latence) restent dans le même groupe de déplacement, tandis que les dépendances souples comme un rapport nocturne peuvent être réparties temporairement entre le site et AWS."
  options:
    a: { en: "Subnets do not reflect application dependencies; this could separate the order management application from its database across a hybrid link.", fr: "Les sous-réseaux ne reflètent pas les dépendances applicatives ; cette approche pourrait séparer l'application de gestion des commandes de sa base par une liaison hybride." }
    b: { en: "Ignoring dependencies risks splitting latency-sensitive components between waves, which causes problems that cannot be resolved after cutover.", fr: "Ignorer les dépendances risque de séparer des composants sensibles à la latence entre plusieurs vagues, ce qui crée des problèmes impossibles à résoudre après le basculement." }
    c: { en: "Treating soft and shared-service connections as hard dependencies recreates the oversized group and puts a huge, risky first wave on the schedule.", fr: "Traiter les connexions souples et celles des services partagés comme critiques recrée le groupe démesuré et impose une première vague énorme et risquée." }
references:
  - title: Wave planning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/application-portfolio-assessment-guide/wave-planning.html
  - title: Build migration plan
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-review-groupings-and-waves.html
