id: sapc03-4a-wave-plan-practices
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A global bank plans to migrate 3,000 servers from three data centers over 18 months. The program office wants a factory-style approach with a predictable cadence so that the same teams can repeat the same activities. The first draft of the plan contains four waves of about four months each, and each wave contains several hundred applications. The draft schedules the cutover of the core payments application in the last week of December. Business stakeholders are concerned about the risk of such large waves and about the month-end and year-end change freezes.

    Which changes to the wave plan follow AWS wave planning guidance? (Choose two.)
  fr: |
    Une banque internationale prévoit de migrer 3 000 serveurs depuis trois centres de données en 18 mois. Le bureau de programme veut une approche de type usine avec une cadence prévisible, pour que les mêmes équipes répètent les mêmes activités. La première version du plan contient quatre vagues d'environ quatre mois chacune, et chaque vague contient plusieurs centaines d'applications. Cette version planifie le basculement (cutover) de l'application de paiements principale la dernière semaine de décembre. Les parties prenantes métier s'inquiètent du risque de vagues aussi grandes et des gels des changements de fin de mois et de fin d'année.

    Quelles modifications du plan de vagues suivent les recommandations AWS de planification des vagues ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Merge the four waves into one wave so that every application shares a single, well-rehearsed cutover weekend."
        fr: "Fusionner les quatre vagues en une seule pour que toutes les applications partagent un seul week-end de basculement bien répété."
    - id: b
      text:
        en: "Split the work into smaller waves of similar length and structure, about 6 to 10 weeks each, and let consecutive waves overlap."
        fr: "Découper le travail en vagues plus petites de durée et de structure similaires, d'environ 6 à 10 semaines chacune, et laisser les vagues successives se chevaucher."
    - id: c
      text:
        en: "Place all of the most critical applications in the first wave so that the migration process is validated on the hardest cases first."
        fr: "Placer toutes les applications les plus critiques dans la première vague pour valider le processus de migration d'abord sur les cas les plus difficiles."
    - id: d
      text:
        en: "Remove maintenance windows and business dates from the plan, because only network dependencies should determine the content of each wave."
        fr: "Retirer du plan les fenêtres de maintenance et les dates métier, car seules les dépendances réseau doivent déterminer le contenu de chaque vague."
    - id: e
      text:
        en: "Record month-end and year-end periods as nontechnical dependencies, and move the payments cutover outside those freeze periods."
        fr: "Enregistrer les périodes de fin de mois et de fin d'année comme des dépendances non techniques et déplacer le basculement des paiements hors de ces périodes de gel."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS guidance recommends keeping waves within about 6 to 10 weeks, preferring smaller waves of similar length and structure for a factory approach, and overlapping waves to go faster. Key business dates such as month-end and year-end are nontechnical dependencies that the schedule must avoid."
    fr: "Les recommandations AWS conseillent de limiter les vagues à environ 6 à 10 semaines, de préférer des vagues plus petites de durée et de structure similaires pour une approche de type usine, et de faire chevaucher les vagues pour aller plus vite. Les dates métier clés comme la fin de mois et la fin d'année sont des dépendances non techniques que le calendrier doit éviter."
  options:
    a: { en: "One giant wave maximizes the amount of parallel change and the risk, which is the opposite of what the stakeholders want.", fr: "Une seule vague géante maximise la quantité de changements simultanés et le risque, à l'inverse de ce que veulent les parties prenantes." }
    c: { en: "Starting with the most critical applications concentrates risk before the teams have refined the process on simpler workloads.", fr: "Commencer par les applications les plus critiques concentre le risque avant que les équipes aient rodé le processus sur des charges plus simples." }
    d: { en: "Nontechnical dependencies such as maintenance windows and business dates are part of wave planning; ignoring them creates cutovers during freezes.", fr: "Les dépendances non techniques comme les fenêtres de maintenance et les dates métier font partie de la planification des vagues ; les ignorer crée des basculements pendant les gels." }
references:
  - title: Wave planning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/application-portfolio-assessment-guide/wave-planning.html
