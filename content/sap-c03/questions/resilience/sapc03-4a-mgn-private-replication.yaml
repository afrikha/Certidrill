id: sapc03-4a-mgn-private-replication
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank is rehosting 400 servers into a migration account with AWS Transform MGN. The data center connects to AWS through a 10 Gbps AWS Direct Connect connection, with a private virtual interface to a transit gateway that is attached to the staging VPC. Security policy forbids sending any replication data or control traffic over the public internet, and it forbids internet gateways and NAT gateways in the staging VPC. The on-premises servers can reach only private IP addresses in AWS and resolve names through the corporate DNS servers. The replication servers must still download their software and report their status to the service.

    Which configuration will meet these requirements?
  fr: |
    Une banque réhéberge 400 serveurs dans un compte de migration avec AWS Transform MGN. Le centre de données se connecte à AWS par une connexion AWS Direct Connect de 10 Gbit/s, avec une interface virtuelle privée vers une passerelle de transit attachée au VPC intermédiaire (staging). La politique de sécurité interdit d'envoyer des données de réplication ou du trafic de contrôle par l'internet public, et elle interdit les passerelles internet et les passerelles NAT dans le VPC intermédiaire. Les serveurs sur site ne peuvent joindre que des adresses IP privées dans AWS et résolvent les noms par les serveurs DNS de l'entreprise. Les serveurs de réplication doivent toujours télécharger leur logiciel et remonter leur état au service.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the default replication settings so that replication servers receive public IP addresses, and restrict the replication server security group to the on-premises CIDR ranges on TCP port 1500."
        fr: "Conserver les paramètres de réplication par défaut pour que les serveurs de réplication reçoivent des adresses IP publiques, et limiter le groupe de sécurité des serveurs de réplication aux plages CIDR sur site sur le port TCP 1500."
    - id: b
      text:
        en: "Turn on Use private IP for data replication, and add a NAT gateway in a separate public subnet of the staging VPC so that the replication servers and the agents can reach the MGN, Amazon EC2 and Amazon S3 endpoints."
        fr: "Activer Use private IP pour la réplication des données et ajouter une passerelle NAT dans un sous-réseau public distinct du VPC intermédiaire pour que les serveurs de réplication et les agents joignent les points de terminaison MGN, Amazon EC2 et Amazon S3."
    - id: c
      text:
        en: "Turn on Use private IP for data replication, create an S3 gateway endpoint and MGN and EC2 interface endpoints for the replication servers, and let the agents reach MGN and Amazon S3 through the corporate internet proxy."
        fr: "Activer Use private IP pour la réplication des données, créer un point de terminaison de passerelle S3 et des points de terminaison d'interface MGN et EC2 pour les serveurs de réplication, et laisser les agents joindre MGN et Amazon S3 par le proxy internet de l'entreprise."
    - id: d
      text:
        en: "Turn on Use private IP, create an S3 gateway endpoint and MGN and EC2 interface endpoints for the replication servers, add MGN and S3 interface endpoints for the agents, and add a Route 53 Resolver inbound endpoint."
        fr: "Activer Use private IP, créer un point de terminaison de passerelle S3 et des points de terminaison d'interface MGN et EC2 pour les serveurs de réplication, ajouter des points de terminaison d'interface MGN et S3 pour les agents, puis un point de terminaison entrant Route 53 Resolver."
answer: { optionId: d }
explanation:
  correct:
    en: "Use private IP sends the TCP 1500 replication stream over Direct Connect. Replication servers reach Amazon S3 through a gateway endpoint and MGN and EC2 through interface endpoints, while the on-premises agents, which need TCP 443 to MGN and Amazon S3, use MGN and S3 interface endpoints. A Route 53 Resolver inbound endpoint lets the corporate DNS resolve the private IP addresses of those endpoints."
    fr: "Use private IP fait passer le flux de réplication TCP 1500 par Direct Connect. Les serveurs de réplication joignent Amazon S3 par un point de terminaison de passerelle et MGN et EC2 par des points de terminaison d'interface, tandis que les agents sur site, qui ont besoin du TCP 443 vers MGN et Amazon S3, utilisent des points de terminaison d'interface MGN et S3. Un point de terminaison entrant Route 53 Resolver permet au DNS de l'entreprise de résoudre les adresses IP privées de ces points de terminaison."
  options:
    a: { en: "By default replication data is routed over the public internet to public IP addresses, which the policy forbids.", fr: "Par défaut, les données de réplication passent par l'internet public vers des adresses IP publiques, ce que la politique interdit." }
    b: { en: "The policy forbids NAT gateways in the staging VPC, and a NAT gateway still sends control traffic to public endpoints over the internet.", fr: "La politique interdit les passerelles NAT dans le VPC intermédiaire, et une passerelle NAT envoie toujours le trafic de contrôle vers des points de terminaison publics par internet." }
    c: { en: "The replication servers are private, but the agents' TCP 443 traffic to MGN and Amazon S3 would still cross the public internet through the proxy.", fr: "Les serveurs de réplication sont privés, mais le trafic TCP 443 des agents vers MGN et Amazon S3 traverserait toujours l'internet public par le proxy." }
references:
  - title: Architecture components and requirements for restricted replication
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/rehost-servers-over-private-networks-mgn/architecture.html
  - title: Replication template reference
    url: https://docs.aws.amazon.com/mgn/latest/ug/replication-server-settings.html
