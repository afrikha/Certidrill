id: sapc03-4c-delegated-admin-steps
objective: "4.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial services company has 60 member accounts in AWS Organizations. In the AWS Backup console of the management account, backup policies, cross-account monitoring, and cross-account backup are already turned on, and the AWSServiceRoleForBackup service-linked role exists. A new security rule forbids the backup team from signing in to the management account or assuming any role in it. The backup team works from a dedicated member account named backup-admin. From that account, the team must create, update, and attach backup policies, and it must view the backup, copy, and restore jobs of every account in the organization.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une société de services financiers possède 60 comptes membres dans AWS Organizations. Dans la console AWS Backup du compte de gestion, les politiques de sauvegarde, la surveillance entre comptes et la sauvegarde entre comptes sont déjà activées, et le rôle lié au service AWSServiceRoleForBackup existe. Une nouvelle règle de sécurité interdit à l'équipe de sauvegarde de se connecter au compte de gestion ou d'y assumer un rôle. L'équipe de sauvegarde travaille depuis un compte membre dédié nommé backup-admin. Depuis ce compte, l'équipe doit créer, mettre à jour et attacher des politiques de sauvegarde, et elle doit voir les tâches de sauvegarde, de copie et de restauration de tous les comptes de l'organisation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "From the management account, register the backup-admin account as a delegated administrator for the backup.amazonaws.com service principal."
        fr: "Depuis le compte de gestion, enregistrer le compte backup-admin comme administrateur délégué pour le principal de service backup.amazonaws.com."
    - id: b
      text:
        en: "From the backup-admin account, register the account as a delegated administrator for AWS Backup, and turn on cross-account monitoring in its own AWS Backup settings."
        fr: "Depuis le compte backup-admin, enregistrer ce compte comme administrateur délégué pour AWS Backup et activer la surveillance entre comptes dans ses propres paramètres AWS Backup."
    - id: c
      text:
        en: "Create an IAM role in the management account that trusts the backup-admin account, and attach the AWSBackupFullAccess managed policy to the role."
        fr: "Créer dans le compte de gestion un rôle IAM qui approuve le compte backup-admin, et attacher la politique gérée AWSBackupFullAccess à ce rôle."
    - id: d
      text:
        en: "From the management account, create an AWS Organizations resource-based delegation policy for backup policies, and attach the AWSBackupOrganizationAdminAccess managed policy to the backup team's role in backup-admin."
        fr: "Depuis le compte de gestion, créer une politique de délégation basée sur les ressources AWS Organizations pour les politiques de sauvegarde, et attacher la politique gérée AWSBackupOrganizationAdminAccess au rôle de l'équipe de sauvegarde dans backup-admin."
    - id: e
      text:
        en: "Share the management account's backup plans with backup-admin through AWS RAM, and attach the AWSBackupOrganizationAdminAccess managed policy to a role in the management account."
        fr: "Partager les plans de sauvegarde du compte de gestion avec backup-admin par AWS RAM, et attacher la politique gérée AWSBackupOrganizationAdminAccess à un rôle du compte de gestion."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The management account registers the member account as a delegated administrator for AWS Backup, which gives it cross-account job monitoring. Registration alone doesn't allow backup policy management: the management account must also create a resource-based delegation policy in AWS Organizations, and the roles in the delegated account need the AWSBackupOrganizationAdminAccess managed policy, which isn't attached automatically."
    fr: "Le compte de gestion enregistre le compte membre comme administrateur délégué pour AWS Backup, ce qui lui donne la surveillance des tâches entre comptes. L'enregistrement seul ne permet pas de gérer les politiques de sauvegarde : le compte de gestion doit aussi créer une politique de délégation basée sur les ressources dans AWS Organizations, et les rôles du compte délégué ont besoin de la politique gérée AWSBackupOrganizationAdminAccess, qui n'est pas attachée automatiquement."
  options:
    b: { en: "Only the management account can register delegated administrators and turn on cross-account management features; a member account can't register itself.", fr: "Seul le compte de gestion peut enregistrer des administrateurs délégués et activer les fonctionnalités de gestion entre comptes ; un compte membre ne peut pas s'enregistrer lui-même." }
    c: { en: "The backup team would assume a role in the management account, which the new security rule forbids.", fr: "L'équipe de sauvegarde assumerait un rôle dans le compte de gestion, ce que la nouvelle règle de sécurité interdit." }
    e: { en: "Backup plans aren't shared through AWS RAM, and a policy attached to a role in the management account gives nothing to the backup-admin account.", fr: "Les plans de sauvegarde ne se partagent pas par AWS RAM, et une politique attachée à un rôle du compte de gestion n'accorde rien au compte backup-admin." }
references:
  - title: Managing AWS Backup resources across multiple AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
