id: sapc03-4c-fis-lambda-faults
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs a serverless order service. API Gateway invokes an order Lambda function, which calls downstream services and writes to Amazon DynamoDB. The team suspects that the frontend and the retry logic of the downstream consumers don't handle slow or failed order invocations well. The team wants an experiment that adds 3 seconds of latency to 20 % of the order function's invocations, and then makes 20 % of them return errors. The experiment must run from AWS FIS with stop conditions, and the function code must not change. The function doesn't use response streaming.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie exécute un service de commandes sans serveur. API Gateway appelle une fonction Lambda de commande, qui appelle des services en aval et écrit dans Amazon DynamoDB. L'équipe soupçonne que le frontend et la logique de nouvelles tentatives des consommateurs en aval gèrent mal les appels de commande lents ou en échec. L'équipe veut une expérience qui ajoute 3 secondes de latence à 20 % des appels de la fonction de commande, puis fait renvoyer des erreurs à 20 % d'entre eux. L'expérience doit s'exécuter depuis AWS FIS avec des conditions d'arrêt, et le code de la fonction ne doit pas changer. La fonction n'utilise pas le streaming des réponses.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an experiment with the aws:ssm:send-command action that runs a latency injection document on the execution environments of the order function."
        fr: "Créer une expérience avec l'action aws:ssm:send-command qui exécute un document d'injection de latence sur les environnements d'exécution de la fonction de commande."
    - id: b
      text:
        en: "Create an experiment that lowers the reserved concurrency of the order function during the test, so that 20 % of the invocations are delayed or rejected."
        fr: "Créer une expérience qui abaisse la concurrence réservée de la fonction de commande pendant le test, pour que 20 % des appels soient retardés ou rejetés."
    - id: c
      text:
        en: "Attach the FIS Lambda extension layer configured with an S3 bucket, and run the invocation-add-delay and invocation-error actions with invocationPercentage 20."
        fr: "Attacher la couche d'extension FIS pour Lambda configurée avec un compartiment S3, et exécuter les actions invocation-add-delay et invocation-error avec invocationPercentage à 20."
    - id: d
      text:
        en: "Publish a new function version that contains fault injection code behind a feature flag, and shift 20 % of the alias traffic to that version during the test."
        fr: "Publier une nouvelle version de la fonction qui contient du code d'injection de pannes derrière un indicateur de fonctionnalité, et basculer 20 % du trafic de l'alias vers cette version pendant le test."
answer: { optionId: c }
explanation:
  correct:
    en: "The aws:lambda:function actions inject delays, errors, or modified HTTP integration responses into invocations. The function needs the FIS extension layer, AWS_FIS_CONFIGURATION_LOCATION pointing to the S3 bucket where FIS writes fault configurations, AWS_LAMBDA_EXEC_WRAPPER set to the extension bootstrap, and read access to the bucket; invocationPercentage sets the share of affected invocations without any code change."
    fr: "Les actions aws:lambda:function injectent des délais, des erreurs ou des réponses d'intégration HTTP modifiées dans les appels. La fonction a besoin de la couche d'extension FIS, d'AWS_FIS_CONFIGURATION_LOCATION pointant vers le compartiment S3 où FIS écrit les configurations de panne, d'AWS_LAMBDA_EXEC_WRAPPER réglé sur l'amorce de l'extension et d'un accès en lecture au compartiment ; invocationPercentage fixe la part des appels affectés sans aucune modification du code."
  options:
    a: { en: "Lambda execution environments aren't managed instances that run the SSM Agent, so Run Command documents can't target them.", fr: "Les environnements d'exécution Lambda ne sont pas des instances gérées exécutant l'agent SSM : les documents Run Command ne peuvent pas les cibler." }
    b: { en: "Throttling rejects invocations once concurrency is exhausted; it doesn't add a controlled delay to 20 % of the invocations.", fr: "La limitation rejette les appels une fois la concurrence épuisée ; elle n'ajoute pas un délai maîtrisé à 20 % des appels." }
    d: { en: "Fault injection code in a new version is a code change, and the alias shift isn't an FIS action with stop conditions.", fr: "Du code d'injection de pannes dans une nouvelle version est une modification du code, et le basculement d'alias n'est pas une action FIS avec des conditions d'arrêt." }
references:
  - title: Use the AWS FIS aws:lambda:function actions
    url: https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html
