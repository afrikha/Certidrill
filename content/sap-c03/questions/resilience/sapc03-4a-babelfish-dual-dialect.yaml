id: sapc03-4a-babelfish-dual-dialect
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A distribution company runs a 15-year-old order management application on Microsoft SQL Server. The C# application uses a SQL Server driver, sends T-SQL statements and calls hundreds of stored procedures. The company wants to stop paying for SQL Server licenses this year, but it cannot rewrite the data access layer of the legacy application before its planned retirement in three years. Meanwhile, new microservices that replace parts of the application must be written in the PostgreSQL dialect with standard PostgreSQL drivers. These new services must read and write the same live data as the legacy application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute une application de gestion des commandes vieille de 15 ans sur Microsoft SQL Server. L'application C# utilise un pilote SQL Server, envoie des instructions T-SQL et appelle des centaines de procédures stockées. L'entreprise veut cesser de payer des licences SQL Server cette année, mais elle ne peut pas réécrire la couche d'accès aux données de l'application héritée avant son retrait prévu dans trois ans. En attendant, les nouveaux microservices qui remplacent des parties de l'application doivent être écrits dans le dialecte PostgreSQL avec des pilotes PostgreSQL standard. Ces nouveaux services doivent lire et écrire les mêmes données en direct que l'application héritée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Convert the schema and the stored procedures to Aurora PostgreSQL with DMS Schema Conversion, migrate the data with an AWS DMS full load and CDC task, and rewrite the legacy data access layer to use a PostgreSQL driver."
        fr: "Convertir le schéma et les procédures stockées vers Aurora PostgreSQL avec DMS Schema Conversion, migrer les données avec une tâche AWS DMS de chargement complet et de CDC, puis réécrire la couche d'accès aux données héritée pour utiliser un pilote PostgreSQL."
    - id: b
      text:
        en: "Migrate the database to Amazon RDS for SQL Server with License Included, and replicate it continuously with AWS DMS to an Aurora PostgreSQL cluster that the new microservices use."
        fr: "Migrer la base vers Amazon RDS for SQL Server avec License Included, puis la répliquer en continu avec AWS DMS vers un cluster Aurora PostgreSQL utilisé par les nouveaux microservices."
    - id: c
      text:
        en: "Migrate the database to Babelfish for Aurora PostgreSQL, connect the legacy application to the TDS endpoint on port 1433, and connect the new microservices to the PostgreSQL endpoint on port 5432."
        fr: "Migrer la base vers Babelfish for Aurora PostgreSQL, connecter l'application héritée au point de terminaison TDS sur le port 1433, et connecter les nouveaux microservices au point de terminaison PostgreSQL sur le port 5432."
    - id: d
      text:
        en: "Migrate the database to Babelfish for Aurora PostgreSQL, and connect both the legacy application and the new microservices with SQL Server drivers to the TDS endpoint on port 1433."
        fr: "Migrer la base vers Babelfish for Aurora PostgreSQL, et connecter l'application héritée comme les nouveaux microservices avec des pilotes SQL Server au point de terminaison TDS sur le port 1433."
answer: { optionId: c }
explanation:
  correct:
    en: "Babelfish adds a TDS endpoint (port 1433) that understands T-SQL, so the legacy application keeps its SQL Server driver with few code changes, while the same Aurora PostgreSQL cluster also accepts standard PostgreSQL connections on port 5432. Both dialects work on the same live data, and SQL Server licenses are no longer needed."
    fr: "Babelfish ajoute un point de terminaison TDS (port 1433) qui comprend le T-SQL : l'application héritée conserve son pilote SQL Server avec peu de modifications, tandis que le même cluster Aurora PostgreSQL accepte aussi des connexions PostgreSQL standard sur le port 5432. Les deux dialectes travaillent sur les mêmes données en direct, et les licences SQL Server ne sont plus nécessaires."
  options:
    a: { en: "Rewriting the legacy data access layer is exactly what the company cannot do before the application retires.", fr: "Réécrire la couche d'accès aux données héritée est précisément ce que l'entreprise ne peut pas faire avant le retrait de l'application." }
    b: { en: "RDS for SQL Server License Included still pays for SQL Server licenses, and two databases linked by replication are not the same live data for writes.", fr: "RDS for SQL Server avec License Included paie toujours les licences SQL Server, et deux bases reliées par réplication ne constituent pas les mêmes données en direct pour les écritures." }
    d: { en: "The new microservices must use the PostgreSQL dialect and PostgreSQL drivers, not T-SQL through the TDS endpoint.", fr: "Les nouveaux microservices doivent utiliser le dialecte et les pilotes PostgreSQL, pas le T-SQL par le point de terminaison TDS." }
references:
  - title: Using Babelfish for Aurora PostgreSQL
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html
