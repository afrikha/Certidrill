id: sapc03-4a-fsx-windows-shares
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering firm is migrating four Windows file servers that hold 60 TB of SMB shares protected by NTFS permissions. The servers are joined to the company's Active Directory domain, and users access the shares both from the offices, through an AWS Direct Connect connection, and from Windows instances on Amazon EC2. The firm wants the shares to stay available if an Availability Zone fails. It also wants file-system-consistent daily backups without running backup software. The two-person infrastructure team wants to stop patching and maintaining Windows file servers.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'ingénierie migre quatre serveurs de fichiers Windows qui hébergent 60 To de partages SMB protégés par des autorisations NTFS. Les serveurs sont joints au domaine Active Directory de l'entreprise, et les utilisateurs accèdent aux partages depuis les bureaux, par une connexion AWS Direct Connect, et depuis des instances Windows sur Amazon EC2. Le cabinet veut que les partages restent disponibles en cas de panne d'une zone de disponibilité. Il veut aussi des sauvegardes quotidiennes cohérentes au niveau du système de fichiers sans exécuter de logiciel de sauvegarde. L'équipe d'infrastructure de deux personnes veut cesser de corriger et de maintenir des serveurs de fichiers Windows.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon EFS file system with Multi-AZ storage, mount it from the Windows clients and instances, and recreate the NTFS permissions as POSIX permissions on the directories."
        fr: "Créer un système de fichiers Amazon EFS avec un stockage Multi-AZ, le monter depuis les clients et les instances Windows, puis recréer les autorisations NTFS sous forme d'autorisations POSIX sur les répertoires."
    - id: b
      text:
        en: "Rehost the four file servers to Amazon EC2 in two Availability Zones with AWS Transform MGN, configure DFS Namespaces and DFS Replication between them, and back up the instances daily with AWS Backup."
        fr: "Réhéberger les quatre serveurs de fichiers sur Amazon EC2 dans deux zones de disponibilité avec AWS Transform MGN, configurer DFS Namespaces et DFS Replication entre eux, puis sauvegarder les instances chaque jour avec AWS Backup."
    - id: c
      text:
        en: "Create an Amazon FSx for Windows File Server Multi-AZ file system joined to the domain, migrate the shares and their permissions with AWS DataSync, and keep the automatic daily backups enabled."
        fr: "Créer un système de fichiers Amazon FSx for Windows File Server Multi-AZ joint au domaine, migrer les partages et leurs autorisations avec AWS DataSync, puis conserver les sauvegardes quotidiennes automatiques activées."
    - id: d
      text:
        en: "Deploy an Amazon S3 File Gateway on an EC2 instance joined to the domain, create SMB file shares backed by an S3 bucket, and copy the data from the file servers to the gateway with Robocopy."
        fr: "Déployer une passerelle Amazon S3 File Gateway sur une instance EC2 jointe au domaine, créer des partages de fichiers SMB adossés à un compartiment S3, puis copier les données des serveurs de fichiers vers la passerelle avec Robocopy."
answer: { optionId: c }
explanation:
  correct:
    en: "FSx for Windows File Server is a managed SMB file system that joins the Active Directory domain and enforces Windows ACLs. A Multi-AZ file system keeps a standby file server in another Availability Zone for failover, and automatic daily backups, enabled by default, use VSS to be file-system-consistent; the shares are reachable from on premises over Direct Connect."
    fr: "FSx for Windows File Server est un système de fichiers SMB géré qui rejoint le domaine Active Directory et applique les ACL Windows. Un système de fichiers Multi-AZ maintient un serveur de fichiers de secours dans une autre zone de disponibilité pour le basculement, et les sauvegardes quotidiennes automatiques, activées par défaut, utilisent VSS pour être cohérentes au niveau du système de fichiers ; les partages sont accessibles depuis le site par Direct Connect."
  options:
    a: { en: "Amazon EFS is an NFS file system, so it does not provide SMB shares with NTFS permissions for Windows clients.", fr: "Amazon EFS est un système de fichiers NFS : il ne fournit pas de partages SMB avec autorisations NTFS pour les clients Windows." }
    b: { en: "The team would still patch and maintain Windows file servers and DFS Replication, which it wants to stop doing.", fr: "L'équipe devrait toujours corriger et maintenir des serveurs de fichiers Windows et DFS Replication, ce qu'elle veut cesser de faire." }
    d: { en: "A single gateway instance is not resilient to an Availability Zone failure, and the gateway is another server to maintain.", fr: "Une instance de passerelle unique ne résiste pas à la panne d'une zone de disponibilité, et la passerelle est un serveur de plus à maintenir." }
references:
  - title: What is FSx for Windows File Server?
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
