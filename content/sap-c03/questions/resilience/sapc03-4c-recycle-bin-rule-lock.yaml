id: sapc03-4c-recycle-bin-rule-lock
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company protects the Amazon EBS snapshots of its production account with an Amazon EBS Recycle Bin retention rule. The rule is a tag-level rule that retains deleted snapshots tagged backup=critical for 30 days. A red-team exercise showed that an attacker with administrator credentials in the account could first delete the retention rule and then delete the snapshots, which are then permanently deleted. The security team requires that every deleted snapshot in the Region stays recoverable for 30 days even if administrator credentials are compromised. Nobody, including an administrator, may be able to modify or delete the protection quickly, and the security team must be alerted as soon as anyone starts to remove it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique protège les instantanés Amazon EBS de son compte de production par une règle de conservation de la Corbeille (Recycle Bin) Amazon EBS. Cette règle est une règle au niveau des balises qui conserve pendant 30 jours les instantanés supprimés balisés backup=critical. Un exercice red team a montré qu'un attaquant disposant d'identifiants administrateur dans le compte pouvait d'abord supprimer la règle de conservation, puis supprimer les instantanés, qui sont alors supprimés définitivement. L'équipe sécurité exige que chaque instantané supprimé de la Région reste récupérable pendant 30 jours même si des identifiants administrateur sont compromis. Personne, pas même un administrateur, ne doit pouvoir modifier ou supprimer rapidement la protection, et l'équipe sécurité doit être alertée dès que quelqu'un commence à la retirer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Region-level retention rule for EBS snapshots with no exclusion tags and a 30-day retention, lock it with a 30-day unlock delay, and add an EventBridge rule that alerts on rule lock state changes."
        fr: "Créer une règle de conservation au niveau de la Région pour les instantanés EBS sans balise d'exclusion et avec une conservation de 30 jours, la verrouiller avec un délai de déverrouillage de 30 jours, et ajouter une règle EventBridge qui alerte sur les changements d'état du verrou."
    - id: b
      text:
        en: "Lock the existing tag-level retention rule with a 30-day unlock delay, and add an EventBridge rule that alerts the security team when the lock state of the rule changes."
        fr: "Verrouiller la règle de conservation existante au niveau des balises avec un délai de déverrouillage de 30 jours, et ajouter une règle EventBridge qui alerte l'équipe sécurité quand l'état du verrou de la règle change."
    - id: c
      text:
        en: "Keep the tag-level retention rule, and attach an IAM policy that denies rbin:DeleteRule and rbin:UpdateRule to every administrator role in the account, with an alert on changes to that policy."
        fr: "Conserver la règle au niveau des balises et attacher à chaque rôle administrateur du compte une politique IAM qui refuse rbin:DeleteRule et rbin:UpdateRule, avec une alerte sur les modifications de cette politique."
    - id: d
      text:
        en: "Create a Region-level retention rule for EBS snapshots that excludes snapshots tagged env=test, lock it with a 30-day unlock delay, and alert on rule lock state changes with EventBridge."
        fr: "Créer une règle de conservation au niveau de la Région pour les instantanés EBS qui exclut les instantanés balisés env=test, la verrouiller avec un délai de déverrouillage de 30 jours, et alerter sur les changements d'état du verrou avec EventBridge."
answer: { optionId: a }
explanation:
  correct:
    en: "A locked retention rule can't be modified or deleted, even by users with the required IAM permissions, until an unlock delay of 7 to 30 days has passed after someone unlocks it. Only Region-level rules without exclusion tags can be locked, and a Region-level rule covers every deleted snapshot in the Region; EventBridge reports the lock state change when someone starts the unlock."
    fr: "Une règle de conservation verrouillée ne peut être ni modifiée ni supprimée, même par des utilisateurs disposant des autorisations IAM nécessaires, tant qu'un délai de déverrouillage de 7 à 30 jours ne s'est pas écoulé après le déverrouillage. Seules les règles au niveau de la Région sans balise d'exclusion peuvent être verrouillées, et une règle au niveau de la Région couvre tous les instantanés supprimés de la Région ; EventBridge signale le changement d'état du verrou quand quelqu'un lance le déverrouillage."
  options:
    b: { en: "Tag-level retention rules can't be locked, and the rule would cover only snapshots that carry the tag.", fr: "Les règles au niveau des balises ne peuvent pas être verrouillées, et la règle ne couvrirait que les instantanés portant la balise." }
    c: { en: "An administrator can detach or edit the IAM policy and then delete the rule within minutes, so the protection can be removed quickly.", fr: "Un administrateur peut détacher ou modifier la politique IAM puis supprimer la règle en quelques minutes : la protection peut être retirée rapidement." }
    d: { en: "Region-level rules that have exclusion tags can't be locked, and excluded snapshots wouldn't be retained.", fr: "Les règles au niveau de la Région qui ont des balises d'exclusion ne peuvent pas être verrouillées, et les instantanés exclus ne seraient pas conservés." }
references:
  - title: Lock a Recycle Bin retention rule to prevent it from being updated or deleted
    url: https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin-lock.html
