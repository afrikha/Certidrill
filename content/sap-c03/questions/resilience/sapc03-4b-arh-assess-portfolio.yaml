id: sapc03-4b-arh-assess-portfolio
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 40 applications that are deployed with AWS CloudFormation across several AWS accounts. The business has assigned each application a tier, and each tier has RTO and RPO targets for application, Availability Zone and Regional disruptions. Leadership wants to know which applications are estimated to meet their targets. It also wants actionable recommendations to close the gaps and a score that shows progress over time. The cloud team wants to achieve this with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 40 applications déployées avec AWS CloudFormation dans plusieurs comptes AWS. Le métier a attribué un niveau à chaque application, et chaque niveau a des objectifs de RTO et de RPO pour les perturbations applicatives, de zone de disponibilité et régionales. La direction veut savoir quelles applications sont estimées respecter leurs objectifs. Elle veut aussi des recommandations concrètes pour combler les écarts et un score qui montre la progression dans le temps. L'équipe cloud veut y parvenir avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run the AWS Trusted Advisor fault tolerance checks in each account every week, and map the findings of each application to its tier targets in a shared spreadsheet.", fr: "Exécuter chaque semaine les vérifications de tolérance aux pannes d'AWS Trusted Advisor dans chaque compte, et rapprocher dans un tableur partagé les résultats de chaque application des objectifs de son niveau." }
    - id: b
      text: { en: "Create an AWS Resilience Hub resiliency policy per tier, add each application from its CloudFormation stacks, and run assessments for estimated RTO and RPO, compliance status and recommendations.", fr: "Créer une politique de résilience AWS Resilience Hub par niveau, ajouter chaque application à partir de ses piles CloudFormation, et lancer des évaluations pour obtenir RTO et RPO estimés, état de conformité et recommandations." }
    - id: c
      text: { en: "Deploy AWS Config conformance packs for resilience best practices in each account, and use the compliance score of each pack as the estimate for the application.", fr: "Déployer dans chaque compte des packs de conformité AWS Config pour les bonnes pratiques de résilience, et utiliser le score de conformité de chaque pack comme estimation pour l'application." }
    - id: d
      text: { en: "Review each application against the Reliability pillar in the AWS Well-Architected Tool, and record the improvement plan of each workload as its list of recommendations to track.", fr: "Revoir chaque application selon le pilier Fiabilité dans l'AWS Well-Architected Tool, et consigner le plan d'amélioration de chaque charge de travail comme liste de recommandations à suivre." }
answer: { optionId: b }
explanation:
  correct:
    en: "Resilience Hub assesses an application, described from sources such as CloudFormation stacks in the same or other accounts, against a resiliency policy that holds RTO and RPO targets per disruption type. The assessment reports the estimated workload RTO and RPO, a compliance status (Policy met or Policy breached), resiliency and operational recommendations, and a resiliency score that can be tracked over time."
    fr: "Resilience Hub évalue une application, décrite à partir de sources comme des piles CloudFormation du même compte ou d'autres comptes, par rapport à une politique de résilience qui contient des objectifs de RTO et de RPO par type de perturbation. L'évaluation indique le RTO et le RPO estimés de la charge de travail, un état de conformité (Policy met ou Policy breached), des recommandations de résilience et d'exploitation, et un score de résilience suivi dans le temps."
  options:
    a:
      en: "Trusted Advisor checks individual resources for best practices; it does not estimate RTO and RPO against per-tier targets, and the spreadsheet mapping is manual work."
      fr: "Trusted Advisor vérifie les bonnes pratiques ressource par ressource ; il n'estime pas le RTO et le RPO par rapport aux objectifs de chaque niveau, et le rapprochement dans un tableur est un travail manuel."
    c:
      en: "Conformance packs evaluate configuration rules; their compliance score says nothing about estimated recovery times or recovery points."
      fr: "Les packs de conformité évaluent des règles de configuration ; leur score de conformité ne dit rien des temps ou des points de récupération estimés."
    d:
      en: "A Well-Architected review is a manual questionnaire per workload; it produces no estimated RTO or RPO and is far more effort for 40 applications."
      fr: "Une revue Well-Architected est un questionnaire manuel par charge de travail ; elle ne produit aucun RTO ni RPO estimé et demande bien plus d'effort pour 40 applications."
references:
  - title: What is AWS Resilience Hub?
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/what-is.html
  - title: Add resource collections
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/discover-structure.html
