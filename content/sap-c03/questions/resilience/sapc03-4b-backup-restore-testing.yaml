id: sapc03-4b-backup-restore-testing
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company protects its tier-3 applications with a backup and restore disaster recovery strategy. AWS Backup copies the recovery points of Amazon RDS, Amazon EBS and Amazon EFS resources to a backup vault in the recovery Region. A new policy requires monthly proof that a randomly chosen recent recovery point of each protected resource can be restored in the recovery Region. The proof must also show whether each restore completes within the 8-hour restore target, and the results must appear in the company's audit reports. The company wants to write as little custom code as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise protège ses applications de niveau 3 avec une stratégie de reprise par sauvegarde et restauration. AWS Backup copie les points de récupération des ressources Amazon RDS, Amazon EBS et Amazon EFS vers un coffre de sauvegarde de la Région de reprise. Une nouvelle politique exige la preuve mensuelle qu'un point de récupération récent choisi au hasard pour chaque ressource protégée peut être restauré dans la Région de reprise. La preuve doit aussi montrer si chaque restauration se termine dans l'objectif de 8 heures, et les résultats doivent figurer dans les rapports d'audit de l'entreprise. L'entreprise veut écrire le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Write a monthly AWS Systems Manager Automation runbook that restores the latest recovery point of each resource, measures the duration, writes a report to Amazon S3 and deletes the restored resources.", fr: "Écrire un runbook AWS Systems Manager Automation mensuel qui restaure le dernier point de récupération de chaque ressource, mesure la durée, écrit un rapport dans Amazon S3 et supprime les ressources restaurées." }
    - id: b
      text: { en: "Enable AWS Backup Vault Lock in compliance mode on the vault in the recovery Region, and use the vault lock configuration report as the monthly proof that the recovery points of every resource are usable.", fr: "Activer AWS Backup Vault Lock en mode conformité sur le coffre de la Région de reprise, et utiliser le rapport de configuration du verrou comme preuve mensuelle que les points de récupération de chaque ressource sont utilisables." }
    - id: c
      text: { en: "Create a monthly restore testing plan in the recovery Region that restores a random recovery point of each resource from that vault, and add the Audit Manager restore time control.", fr: "Créer dans la Région de reprise un plan de test de restauration mensuel qui restaure un point de récupération aléatoire de chaque ressource depuis ce coffre, et ajouter le contrôle Audit Manager de durée de restauration." }
    - id: d
      text: { en: "Create an AWS Backup Audit Manager framework with the backup plan minimum frequency and minimum retention controls, and generate a monthly compliance report for the auditors.", fr: "Créer un cadre AWS Backup Audit Manager avec les contrôles de fréquence minimale et de rétention minimale des plans de sauvegarde, et générer un rapport de conformité mensuel pour les auditeurs." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Backup restore testing runs scheduled restores of selected protected resources, choosing the LATEST or a RANDOM recovery point within a selection window from the included vaults, then deletes the restored resources. It records the restore time of each test job, and the AWS Backup Audit Manager control Restore time for resources meet target reports whether restores finish within the target."
    fr: "Le test de restauration d'AWS Backup exécute des restaurations planifiées de ressources protégées sélectionnées, en choisissant le point de récupération LATEST ou RANDOM dans une fenêtre de sélection parmi les coffres inclus, puis supprime les ressources restaurées. Il enregistre la durée de chaque tâche de test, et le contrôle AWS Backup Audit Manager Restore time for resources meet target indique si les restaurations se terminent dans l'objectif."
  options:
    a:
      en: "A custom runbook can restore and measure, but it is code to write and maintain, it always uses the latest point instead of a random one, and its results are not part of the audit reports."
      fr: "Un runbook personnalisé peut restaurer et mesurer, mais c'est du code à écrire et à maintenir, il utilise toujours le dernier point au lieu d'un point aléatoire, et ses résultats ne figurent pas dans les rapports d'audit."
    b:
      en: "Vault Lock makes recovery points immutable; it proves nothing about whether they can be restored or how long a restore takes."
      fr: "Vault Lock rend les points de récupération immuables ; il ne prouve rien sur leur capacité à être restaurés ni sur la durée d'une restauration."
    d:
      en: "These controls verify how often backups are taken and how long they are kept; no restore is performed, so restorability and restore time are not tested."
      fr: "Ces contrôles vérifient la fréquence et la durée de conservation des sauvegardes ; aucune restauration n'est effectuée : la capacité de restauration et sa durée ne sont pas testées."
references:
  - title: Restore testing
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html
