id: sapc03-4a-amazon-mq-cross-region
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs a settlement application whose components exchange JMS messages through a self-managed Apache ActiveMQ Classic broker pair in its data center. The company is replatforming the application to AWS and wants to stop installing, patching and upgrading broker software. The messaging code must not change. The broker must continue to operate automatically if an Availability Zone fails. For regional disasters, the company needs an asynchronous copy of the messages in a second AWS Region that can be promoted through an API call, without building a custom replication mechanism.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement exécute une application de règlement dont les composants échangent des messages JMS par une paire de brokers Apache ActiveMQ Classic autogérée dans son centre de données. L'entreprise change la plateforme de l'application vers AWS et veut cesser d'installer, de corriger et de mettre à niveau le logiciel du broker. Le code de messagerie ne doit pas changer. Le broker doit continuer à fonctionner automatiquement en cas de panne d'une zone de disponibilité. Pour les sinistres régionaux, l'entreprise a besoin d'une copie asynchrone des messages dans une seconde Région AWS, promue par un appel d'API, sans créer de mécanisme de réplication personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon MQ for RabbitMQ cluster broker with quorum queues in the primary Region and a second cluster broker in the DR Region, and connect the two brokers with the RabbitMQ federation plugin so that the queues are copied."
        fr: "Créer un broker en cluster Amazon MQ for RabbitMQ avec des files d'attente quorum dans la Région principale et un second broker en cluster dans la Région de reprise, puis relier les deux brokers avec le plugin de fédération RabbitMQ pour copier les files."
    - id: b
      text:
        en: "Create an Amazon MQ for ActiveMQ active/standby broker in the primary Region with cross-Region data replication to a replica broker in the DR Region, and promote the replica with a failover request to the Amazon MQ API."
        fr: "Créer un broker actif/en veille Amazon MQ for ActiveMQ dans la Région principale avec la réplication des données entre Régions vers un broker réplica dans la Région de reprise, puis promouvoir le réplica par une demande de basculement à l'API Amazon MQ."
    - id: c
      text:
        en: "Replace the broker with Amazon SQS FIFO queues in the primary Region, and forward every message to queues in the DR Region with an AWS Lambda function subscribed to an Amazon SNS topic."
        fr: "Remplacer le broker par des files d'attente Amazon SQS FIFO dans la Région principale, puis transférer chaque message vers des files de la Région de reprise avec une fonction AWS Lambda abonnée à une rubrique Amazon SNS."
    - id: d
      text:
        en: "Rehost the ActiveMQ servers to Amazon EC2 in two Availability Zones with AWS Transform MGN, and replicate the broker instances and their message stores to the DR Region with AWS Elastic Disaster Recovery."
        fr: "Réhéberger les serveurs ActiveMQ sur Amazon EC2 dans deux zones de disponibilité avec AWS Transform MGN, puis répliquer les instances du broker et leurs magasins de messages vers la Région de reprise avec AWS Elastic Disaster Recovery."
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon MQ for ActiveMQ is a managed broker that keeps JMS clients working without rewriting messaging code. An active/standby deployment survives an Availability Zone failure, and cross-Region data replication, available only for active/standby brokers, replicates messages asynchronously to a replica broker that a failover request to the Amazon MQ API promotes."
    fr: "Amazon MQ for ActiveMQ est un broker géré qui permet aux clients JMS de continuer à fonctionner sans réécrire le code de messagerie. Un déploiement actif/en veille survit à la panne d'une zone de disponibilité, et la réplication des données entre Régions, disponible uniquement pour les brokers actif/en veille, réplique les messages de façon asynchrone vers un broker réplica qu'une demande de basculement à l'API Amazon MQ promeut."
  options:
    a: { en: "RabbitMQ is a different engine from ActiveMQ, so the JMS code built for ActiveMQ would have to change, and federation is a replication setup that the company must build and operate.", fr: "RabbitMQ est un moteur différent d'ActiveMQ : le code JMS conçu pour ActiveMQ devrait changer, et la fédération est un dispositif de réplication que l'entreprise doit construire et exploiter." }
    c: { en: "Moving to SQS changes the messaging code, and the Lambda forwarding is a custom replication mechanism.", fr: "Passer à SQS modifie le code de messagerie, et le transfert par Lambda est un mécanisme de réplication personnalisé." }
    d: { en: "A rehost keeps the broker software to install, patch and upgrade, which the company wants to stop doing.", fr: "Un réhébergement conserve le logiciel du broker à installer, corriger et mettre à niveau, ce que l'entreprise veut cesser de faire." }
references:
  - title: Cross-Region data replication for Amazon MQ for ActiveMQ
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/crdr-for-active-mq.html
  - title: What is Amazon MQ?
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
