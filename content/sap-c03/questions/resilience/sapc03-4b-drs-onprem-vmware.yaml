id: sapc03-4b-drs-onprem-vmware
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany operates 140 VMware virtual machines in a single on-premises data center. The machines include Windows and Linux application servers and several Microsoft SQL Server and Oracle database servers. The company has no secondary data center and wants to use AWS as its disaster recovery site. The business requires an RPO of seconds and an RTO of minutes for every server. Until a recovery is needed, the company wants to pay only for low-cost storage and minimal compute in AWS. It also wants to run periodic recovery tests without disrupting production.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite 140 machines virtuelles VMware dans un seul centre de données sur site. Ces machines comprennent des serveurs d'application Windows et Linux et plusieurs serveurs de bases de données Microsoft SQL Server et Oracle. L'entreprise n'a pas de centre de données secondaire et veut utiliser AWS comme site de reprise après sinistre. Le métier exige un RPO de quelques secondes et un RTO de quelques minutes pour chaque serveur. Tant qu'aucune reprise n'est nécessaire, l'entreprise ne veut payer qu'un stockage peu coûteux et un calcul minimal dans AWS. Elle veut aussi effectuer des tests de reprise périodiques sans perturber la production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AWS Transform MGN to replicate the servers to AWS, keep the replication running indefinitely, and launch test instances whenever a recovery test is due.", fr: "Utiliser AWS Transform MGN pour répliquer les serveurs vers AWS, laisser la réplication tourner indéfiniment, et lancer des instances de test à chaque test de reprise." }
    - id: b
      text: { en: "Back up the virtual machines every hour with AWS Backup for VMware, and restore the backups to Amazon EC2 instances when a recovery or a test is needed.", fr: "Sauvegarder les machines virtuelles toutes les heures avec AWS Backup pour VMware, et restaurer les sauvegardes vers des instances Amazon EC2 lorsqu'une reprise ou un test est nécessaire." }
    - id: c
      text: { en: "Deploy AWS Storage Gateway Volume Gateway in stored mode for the disks of each virtual machine, create EBS snapshots of the volumes every hour, and launch instances from them during tests.", fr: "Déployer AWS Storage Gateway Volume Gateway en mode stocké pour les disques de chaque machine virtuelle, créer des instantanés EBS des volumes toutes les heures, et lancer des instances à partir d'eux lors des tests." }
    - id: d
      text: { en: "Install the AWS Replication Agent on each server, replicate continuously with AWS Elastic Disaster Recovery to a staging area subnet, and launch recovery instances only for drills or recovery.", fr: "Installer l'AWS Replication Agent sur chaque serveur, répliquer en continu avec AWS Elastic Disaster Recovery vers un sous-réseau de zone de transit (staging area), et lancer des instances de reprise uniquement pour les exercices (drills) ou la reprise." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Elastic Disaster Recovery performs continuous block-level replication into a staging area that uses low-cost storage and minimal compute, for a crash-consistent RPO of seconds and an RTO of minutes. Servers are converted to boot natively on EC2 at launch, and drills are non-disruptive: replication continues and the source servers are not affected."
    fr: "AWS Elastic Disaster Recovery effectue une réplication continue au niveau bloc vers une zone de transit qui utilise un stockage peu coûteux et un calcul minimal, pour un RPO cohérent après plantage (crash-consistent) de quelques secondes et un RTO de quelques minutes. Les serveurs sont convertis pour démarrer nativement sur EC2 au lancement, et les exercices ne perturbent rien : la réplication continue et les serveurs sources ne sont pas affectés."
  options:
    a:
      en: "AWS Transform MGN is built for migrations that end with a cutover, not for ongoing protection with point-in-time recovery, drills and failback; Elastic Disaster Recovery is the service for DR."
      fr: "AWS Transform MGN est conçu pour des migrations qui se terminent par une bascule définitive, pas pour une protection continue avec récupération à un instant donné, exercices et restauration (failback) ; Elastic Disaster Recovery est le service dédié à la reprise."
    b:
      en: "Hourly backups give an RPO of up to 1 hour, and restoring 140 machines from backups takes far longer than minutes."
      fr: "Des sauvegardes horaires donnent un RPO pouvant atteindre 1 heure, et restaurer 140 machines depuis des sauvegardes prend bien plus que quelques minutes."
    c:
      en: "Hourly snapshots give an RPO of hours, and volume snapshots do not convert and launch bootable servers in AWS."
      fr: "Des instantanés horaires donnent un RPO de l'ordre de l'heure, et des instantanés de volumes ne convertissent ni ne lancent de serveurs amorçables dans AWS."
references:
  - title: Elastic Disaster Recovery Concepts
    url: https://docs.aws.amazon.com/drs/latest/userguide/CloudEndure-Concepts.html
  - title: AWS Elastic Disaster Recovery FAQs
    url: https://aws.amazon.com/disaster-recovery/faqs/
