id: sapc03-4a-mgn-post-launch-actions
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company is rehosting 600 servers to Amazon EC2 with AWS Transform MGN in waves of 50 servers. After each test launch and each cutover, operations engineers spend hours signing in to the instances. They check that every volume is attached and mounted, that the application services are running and that a local health URL returns HTTP 200. They then install and configure the Amazon CloudWatch agent. The migration lead wants these steps to run automatically on every test and cutover instance, with as little custom code as possible.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels réhéberge 600 serveurs vers Amazon EC2 avec AWS Transform MGN, par vagues de 50 serveurs. Après chaque lancement de test et chaque basculement, les ingénieurs d'exploitation passent des heures à se connecter aux instances. Ils vérifient que chaque volume est attaché et monté, que les services applicatifs s'exécutent et qu'une URL de santé locale renvoie HTTP 200. Ils installent et configurent ensuite l'agent Amazon CloudWatch. Le responsable de la migration veut que ces étapes s'exécutent automatiquement sur chaque instance de test et de basculement, avec le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a user data script to the EC2 launch template of each source server that performs the checks and installs the CloudWatch agent, and maintain one version of the script per operating system."
        fr: "Ajouter au modèle de lancement EC2 de chaque serveur source un script de données utilisateur qui effectue les vérifications et installe l'agent CloudWatch, et maintenir une version du script par système d'exploitation."
    - id: b
      text:
        en: "Create an Amazon EventBridge rule on EC2 instance state changes that invokes an AWS Lambda function, which connects to each new instance over SSH or WinRM to run the checks and install the agent."
        fr: "Créer une règle Amazon EventBridge sur les changements d'état des instances EC2 qui appelle une fonction AWS Lambda, laquelle se connecte à chaque nouvelle instance par SSH ou WinRM pour exécuter les vérifications et installer l'agent."
    - id: c
      text:
        en: "Activate MGN post-launch actions with Validate volume integrity, Verify process status, Verify HTTP/HTTPS response and Install a CloudWatch Agent, and add the required policies to the instance profile."
        fr: "Activer les actions post-lancement de MGN avec Validate volume integrity, Verify process status, Verify HTTP/HTTPS response et Install a CloudWatch Agent, puis ajouter les politiques requises au profil d'instance."
    - id: d
      text:
        en: "Deploy AWS Config managed rules that evaluate each migrated instance for mounted volumes, running processes and HTTP responses, and use automatic remediation to install the CloudWatch agent."
        fr: "Déployer des règles gérées AWS Config qui évaluent chaque instance migrée pour les volumes montés, les processus en cours et les réponses HTTP, et utiliser la correction automatique pour installer l'agent CloudWatch."
answer: { optionId: c }
explanation:
  correct:
    en: "MGN post-launch actions run AWS Systems Manager documents on every test and cutover instance. Predefined actions validate volume integrity, verify that processes are running, check HTTP or HTTPS responses and install the CloudWatch agent, so no custom code is needed; the instance profile in the launch template needs the matching policies, such as CloudWatchAgentServerPolicy."
    fr: "Les actions post-lancement de MGN exécutent des documents AWS Systems Manager sur chaque instance de test et de basculement. Des actions prédéfinies valident l'intégrité des volumes, vérifient que des processus s'exécutent, contrôlent les réponses HTTP ou HTTPS et installent l'agent CloudWatch, sans code personnalisé ; le profil d'instance du modèle de lancement doit avoir les politiques correspondantes, comme CloudWatchAgentServerPolicy."
  options:
    a: { en: "Custom scripts per operating system and per launch template are custom code to write and maintain across 600 servers.", fr: "Des scripts personnalisés par système d'exploitation et par modèle de lancement représentent du code à écrire et à maintenir pour 600 serveurs." }
    b: { en: "This is a custom remote-execution solution that needs credentials and network access to every instance, which is more code than the built-in actions.", fr: "Il s'agit d'une solution d'exécution à distance personnalisée qui exige des informations d'identification et un accès réseau à chaque instance, soit plus de code que les actions intégrées." }
    d: { en: "AWS Config evaluates resource configurations; its managed rules do not check mounted volumes, running processes or HTTP responses inside an instance.", fr: "AWS Config évalue la configuration des ressources ; ses règles gérées ne vérifient pas les volumes montés, les processus en cours ou les réponses HTTP à l'intérieur d'une instance." }
references:
  - title: Predefined post-launch actions reference
    url: https://docs.aws.amazon.com/mgn/latest/ug/predefined-post-launch-actions.html
