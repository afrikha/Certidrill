id: sapc03-4c-fis-stop-lever
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer runs a weekly AWS FIS experiment in its production account that stresses the CPU of 30 % of the web tier instances. The steady state is a checkout success rate of at least 99 %. The SRE team has two requirements. First, the experiment must end automatically if the checkout success rate stays below 99 % for 2 minutes. Second, during a real incident, the on-call engineer must be able to stop every running FIS experiment in the account and Region at once and prevent new experiments from starting until the incident is over.

    Which solution will meet these requirements?
  fr: |
    Un détaillant en ligne exécute chaque semaine dans son compte de production une expérience AWS FIS qui sollicite le processeur de 30 % des instances du niveau web. L'état stable est un taux de réussite des paiements d'au moins 99 %. L'équipe SRE a deux exigences. D'abord, l'expérience doit se terminer automatiquement si le taux de réussite des paiements reste sous 99 % pendant 2 minutes. Ensuite, pendant un incident réel, l'ingénieur d'astreinte doit pouvoir arrêter d'un coup toutes les expériences FIS en cours dans le compte et la Région, et empêcher le démarrage de nouvelles expériences jusqu'à la fin de l'incident.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a CloudWatch alarm on the checkout success rate as a stop condition, and have the on-call engineer delete the experiment templates of the account during an incident."
        fr: "Ajouter une alarme CloudWatch sur le taux de réussite des paiements comme condition d'arrêt, et faire supprimer par l'ingénieur d'astreinte les modèles d'expérience du compte pendant un incident."
    - id: b
      text:
        en: "Configure the FIS safety lever to engage automatically when the checkout success rate falls below 99 %, and have the on-call engineer stop each experiment from the console."
        fr: "Configurer le levier de sécurité FIS pour qu'il s'active automatiquement quand le taux de réussite des paiements passe sous 99 %, et faire arrêter chaque expérience depuis la console par l'ingénieur d'astreinte."
    - id: c
      text:
        en: "Add a CloudWatch alarm on the checkout success rate as a stop condition, and have the on-call engineer engage the FIS safety lever for the account and Region during an incident."
        fr: "Ajouter une alarme CloudWatch sur le taux de réussite des paiements comme condition d'arrêt, et faire activer par l'ingénieur d'astreinte le levier de sécurité FIS du compte et de la Région pendant un incident."
    - id: d
      text:
        en: "Create an EventBridge rule that invokes a Lambda function to call StopExperiment when the alarm fires, and attach an SCP that denies fis:StartExperiment during an incident."
        fr: "Créer une règle EventBridge qui appelle une fonction Lambda pour exécuter StopExperiment quand l'alarme se déclenche, et attacher une SCP qui refuse fis:StartExperiment pendant un incident."
answer: { optionId: c }
explanation:
  correct:
    en: "A stop condition is a CloudWatch alarm in the experiment template, and FIS stops the experiment when the alarm is triggered. The safety lever exists once per account and Region: when it is engaged, experiments in progress are stopped and experiments that try to start are cancelled until it is disengaged."
    fr: "Une condition d'arrêt est une alarme CloudWatch du modèle d'expérience, et FIS arrête l'expérience quand l'alarme se déclenche. Le levier de sécurité existe une fois par compte et par Région : une fois activé, les expériences en cours sont arrêtées et celles qui tentent de démarrer sont annulées jusqu'à sa désactivation."
  options:
    a: { en: "Deleting templates doesn't stop experiments that are already running, and it destroys the experiment definitions.", fr: "Supprimer les modèles n'arrête pas les expériences déjà en cours et détruit les définitions d'expérience." }
    b: { en: "The safety lever is engaged by an operator, not by a metric threshold, and stopping experiments one by one doesn't block new ones.", fr: "Le levier de sécurité est activé par un opérateur, pas par un seuil de métrique, et arrêter les expériences une à une ne bloque pas les nouvelles." }
    d: { en: "This rebuilds stop conditions with custom code, and an SCP that denies new starts doesn't stop the experiments that are already running.", fr: "Cela reconstruit les conditions d'arrêt avec du code personnalisé, et une SCP qui refuse les démarrages n'arrête pas les expériences déjà en cours." }
references:
  - title: Stop conditions for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html
  - title: Safety Levers for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/safety-lever.html
