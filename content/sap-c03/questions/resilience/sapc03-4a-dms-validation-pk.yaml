id: sapc03-4a-dms-validation-pk
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank is migrating its loan servicing database from Oracle to Amazon Aurora PostgreSQL with an AWS DMS full load and CDC task. The regulator requires evidence, before cutover, that every migrated row matches the source row, and it requires the ongoing changes to be compared continuously until cutover. Of the 2,000 tables, 30 have neither a primary key nor a unique index. The DBAs are allowed to add unique indexes on NOT NULL columns to the source and target tables. Mismatches must be reported with the key of each affected row.

    Which approach will meet these requirements?
  fr: |
    Une banque migre sa base de gestion des prêts d'Oracle vers Amazon Aurora PostgreSQL avec une tâche AWS DMS de chargement complet et de CDC. Le régulateur exige la preuve, avant le basculement, que chaque ligne migrée correspond à la ligne source, et il exige que les modifications continues soient comparées en permanence jusqu'au basculement. Sur les 2 000 tables, 30 n'ont ni clé primaire ni index unique. Les DBA sont autorisés à ajouter des index uniques sur des colonnes NOT NULL dans les tables source et cible. Les écarts doivent être signalés avec la clé de chaque ligne concernée.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable DMS data validation on the task as it is, because DMS compares the tables without a key by scanning all of their columns, and read the results in the Table statistics tab."
        fr: "Activer la validation des données DMS sur la tâche telle quelle, car DMS compare les tables sans clé en analysant toutes leurs colonnes, puis lire les résultats dans l'onglet Table statistics."
    - id: b
      text:
        en: "After the cutover, run a separate Full load validation only task on all 2,000 tables, and export the validation results and table statistics of the task to Amazon S3 as evidence for the regulator."
        fr: "Après le basculement, exécuter une tâche distincte Full load validation only sur les 2 000 tables, puis exporter les résultats de validation et les statistiques de tables de la tâche dans Amazon S3 comme preuve pour le régulateur."
    - id: c
      text:
        en: "Schedule an AWS Lambda function that counts the rows of every table in both databases each hour, and store the comparison results in Amazon DynamoDB as evidence."
        fr: "Planifier une fonction AWS Lambda qui compte toutes les heures les lignes de chaque table dans les deux bases, puis stocker les résultats de comparaison dans Amazon DynamoDB comme preuve."
    - id: d
      text:
        en: "Add a unique index to the 30 tables in both databases, enable DMS data validation on the task, and review mismatches in the awsdms_validation_failures_v1 table and the CloudWatch validation metrics."
        fr: "Ajouter un index unique aux 30 tables dans les deux bases, activer la validation des données DMS sur la tâche, puis examiner les écarts dans la table awsdms_validation_failures_v1 et les métriques de validation CloudWatch."
answer: { optionId: d }
explanation:
  correct:
    en: "DMS validation compares each source row with its target row after the full load and then validates CDC changes as they occur. It requires a primary key or a unique index (with NOT NULL columns for Oracle), so the 30 tables need one; failed rows are written with their key and details to awsdms_validation_failures_v1, and CloudWatch exposes validation metrics."
    fr: "La validation DMS compare chaque ligne source à sa ligne cible après le chargement complet, puis valide les modifications CDC au fil de l'eau. Elle exige une clé primaire ou un index unique (sur des colonnes NOT NULL pour Oracle) : les 30 tables en ont besoin ; les lignes en échec sont écrites avec leur clé et leurs détails dans awsdms_validation_failures_v1, et CloudWatch expose des métriques de validation."
  options:
    a: { en: "Tables without a primary key or unique index are not validated; DMS reports them in the No primary key state.", fr: "Les tables sans clé primaire ni index unique ne sont pas validées ; DMS les signale avec l'état No primary key." }
    b: { en: "Validating after cutover is too late for the regulator, a full-load-only validation does not compare ongoing changes, and the 30 tables still lack a key.", fr: "Valider après le basculement est trop tard pour le régulateur, une validation de chargement complet seul ne compare pas les modifications continues, et les 30 tables n'ont toujours pas de clé." }
    c: { en: "Row counts do not prove that the content of each row matches, and they cannot report the key of a mismatched row.", fr: "Des nombres de lignes ne prouvent pas que le contenu de chaque ligne correspond et ne peuvent pas indiquer la clé d'une ligne en écart." }
references:
  - title: AWS DMS data validation
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Validating.html
