id: sapc03-4c-object-lock-existing
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company stores 400 million medical images in an existing Amazon S3 bucket that has S3 Versioning enabled but not S3 Object Lock. Dozens of applications in several accounts reference the bucket by name. After a ransomware incident at another hospital, the compliance office requires that every existing object version and every future object version be protected against deletion and overwrite for 6 years in compliance mode. The data must stay in the current bucket, because changing the applications or copying the data would take months.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de santé stocke 400 millions d'images médicales dans un compartiment Amazon S3 existant sur lequel S3 Versioning est activé, mais pas S3 Object Lock. Des dizaines d'applications de plusieurs comptes référencent le compartiment par son nom. Après un incident de rançongiciel dans un autre hôpital, le service conformité exige que chaque version d'objet existante et chaque future version d'objet soient protégées contre la suppression et l'écrasement pendant 6 ans en mode conformité. Les données doivent rester dans le compartiment actuel, car modifier les applications ou copier les données prendrait des mois.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a new bucket with Object Lock enabled, and copy every object version into it with an S3 Batch Operations Copy job."
        fr: "Créer un nouveau compartiment avec Object Lock activé et y copier chaque version d'objet avec une tâche S3 Batch Operations Copy."
    - id: b
      text:
        en: "Open a case with AWS Support to enable Object Lock on the existing bucket, because Object Lock can be enabled only when a bucket is created."
        fr: "Ouvrir un dossier auprès d'AWS Support pour activer Object Lock sur le compartiment existant, car Object Lock ne peut être activé qu'à la création d'un compartiment."
    - id: c
      text:
        en: "Enable Object Lock on the existing bucket, and configure a default retention of 6 years in compliance mode."
        fr: "Activer Object Lock sur le compartiment existant et configurer une rétention par défaut de 6 ans en mode conformité."
    - id: d
      text:
        en: "Add an S3 Lifecycle rule that transitions every object version to S3 Glacier Deep Archive and expires it after 6 years."
        fr: "Ajouter une règle S3 Lifecycle qui fait passer chaque version d'objet dans S3 Glacier Deep Archive et la fait expirer après 6 ans."
    - id: e
      text:
        en: "Run an S3 Batch Operations Object Lock retention job, with an S3 Inventory report of all object versions as the manifest, to set a 6-year compliance retention."
        fr: "Exécuter une tâche S3 Batch Operations Object Lock retention, avec un rapport S3 Inventory de toutes les versions d'objets comme manifeste, pour définir une rétention de 6 ans en mode conformité."
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Object Lock can be enabled on an existing versioned bucket, and its default retention protects every object version placed in the bucket afterward. The versions that already exist need an explicit retention: an S3 Batch Operations Object Lock retention job applies a compliance-mode retain-until date to every version listed in the manifest, after checking that Object Lock is enabled on the bucket."
    fr: "Object Lock peut être activé sur un compartiment versionné existant, et sa rétention par défaut protège chaque version d'objet placée ensuite dans le compartiment. Les versions qui existent déjà ont besoin d'une rétention explicite : une tâche S3 Batch Operations Object Lock retention applique une date de fin de rétention en mode conformité à chaque version listée dans le manifeste, après avoir vérifié qu'Object Lock est activé sur le compartiment."
  options:
    a: { en: "Copying the data into a new bucket is exactly what the company can't do, because the applications reference the current bucket.", fr: "Copier les données dans un nouveau compartiment est justement ce que l'entreprise ne peut pas faire, car les applications référencent le compartiment actuel." }
    b: { en: "Object Lock can be enabled on an existing bucket from the bucket properties or the PutObjectLockConfiguration API, without AWS Support.", fr: "Object Lock peut être activé sur un compartiment existant depuis les propriétés du compartiment ou par l'API PutObjectLockConfiguration, sans AWS Support." }
    d: { en: "Lifecycle rules change storage classes and expire objects; they don't stop a user from deleting or overwriting object versions.", fr: "Les règles Lifecycle changent la classe de stockage et font expirer les objets ; elles n'empêchent pas un utilisateur de supprimer ou d'écraser des versions d'objets." }
references:
  - title: Configuring S3 Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-configure.html
  - title: S3 Object Lock retention
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-retention-date.html
