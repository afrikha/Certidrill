id: sapc03-4a-rightsize-utilization
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company is preparing the business case for migrating 600 VMware virtual machines to Amazon EC2. vCenter shows that most virtual machines are allocated 16 vCPUs and 64 GiB of memory, but the infrastructure team believes that they are heavily overprovisioned. The CFO will approve the migration only if the EC2 estimate reflects actual usage while still covering the month-end processing peaks. The AWS Transform discovery tool has been collecting data for 30 days, a period that includes one month-end close. The estimate must use Compute Savings Plans pricing.

    Which approach will produce the MOST accurate estimate?
  fr: |
    Une entreprise de médias prépare l'analyse de rentabilité de la migration de 600 machines virtuelles VMware vers Amazon EC2. vCenter montre que la plupart des machines virtuelles disposent de 16 vCPU et de 64 Gio de mémoire, mais l'équipe d'infrastructure pense qu'elles sont largement surdimensionnées. Le directeur financier n'approuvera la migration que si l'estimation EC2 reflète l'utilisation réelle tout en couvrant les pics de traitement de fin de mois. L'outil de découverte AWS Transform collecte des données depuis 30 jours, une période qui inclut une clôture de fin de mois. L'estimation doit utiliser la tarification Compute Savings Plans.

    Quelle approche produira l'estimation la PLUS précise ?
body:
  options:
    - id: a
      text:
        en: "Export the discovery tool data for the full 30-day window, upload it to an AWS Transform migration assessment, and base EC2 rightsizing on the collected utilization with Savings Plans as the pricing model."
        fr: "Exporter les données de l'outil de découverte sur toute la fenêtre de 30 jours, les charger dans une évaluation de migration AWS Transform et fonder le redimensionnement EC2 sur l'utilisation collectée, avec Savings Plans comme modèle de tarification."
    - id: b
      text:
        en: "Upload an RVTools export to an AWS Transform migration assessment, and generate EC2 recommendations that match the allocated vCPU and memory of each virtual machine with Savings Plans pricing."
        fr: "Charger un export RVTools dans une évaluation de migration AWS Transform et générer des recommandations EC2 qui reprennent les vCPU et la mémoire alloués à chaque machine virtuelle, avec une tarification Savings Plans."
    - id: c
      text:
        en: "Migrate the virtual machines with their current sizes, enable AWS Compute Optimizer after cutover, resize the instances after 14 days of CloudWatch metrics, and then purchase Savings Plans."
        fr: "Migrer les machines virtuelles avec leurs tailles actuelles, activer AWS Compute Optimizer après le basculement, redimensionner les instances après 14 jours de métriques CloudWatch, puis acheter des Savings Plans."
    - id: d
      text:
        en: "Export only the last seven days of discovery tool data, which exclude the month-end close, so that the assessment recommends smaller instance types with Savings Plans pricing."
        fr: "Exporter uniquement les sept derniers jours de données de l'outil de découverte, qui excluent la clôture de fin de mois, afin que l'évaluation recommande des types d'instances plus petits avec une tarification Savings Plans."
answer: { optionId: a }
explanation:
  correct:
    en: "The discovery tool samples CPU, memory, network and storage every 10 minutes and reports average, p95 and peak values over the export window. A migration assessment rightsizes EC2 instances from this utilization instead of the allocated sizes, and the 30-day window includes the month-end peak, so the estimate is both lean and safe."
    fr: "L'outil de découverte échantillonne le processeur, la mémoire, le réseau et le stockage toutes les 10 minutes et fournit les valeurs moyenne, p95 et maximale sur la fenêtre exportée. Une évaluation de migration redimensionne les instances EC2 à partir de cette utilisation plutôt que des tailles allouées, et la fenêtre de 30 jours inclut le pic de fin de mois : l'estimation est à la fois économique et sûre."
  options:
    b: { en: "Matching allocated sizes reproduces the overprovisioning in the estimate, so it does not reflect actual usage.", fr: "Reprendre les tailles allouées reproduit le surdimensionnement dans l'estimation, qui ne reflète donc pas l'utilisation réelle." }
    c: { en: "This optimizes only after the migration, so the business case that the CFO needs before approval is still based on overprovisioned sizes.", fr: "Cette approche n'optimise qu'après la migration : l'analyse de rentabilité dont le directeur financier a besoin avant l'approbation repose toujours sur des tailles surdimensionnées." }
    d: { en: "Excluding the month-end close underestimates the peak demand, so the recommended instances might not cover month-end processing.", fr: "Exclure la clôture de fin de mois sous-estime la demande de pointe : les instances recommandées risquent de ne pas couvrir les traitements de fin de mois." }
references:
  - title: Data collection
    url: https://docs.aws.amazon.com/transform/latest/userguide/discovery-tool-data-collection.html
  - title: Migration assessments
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html
