id: sapc03-4c-aurora-failover-test
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs an order API on Amazon ECS with an Aurora PostgreSQL cluster that has one writer and two Aurora Replicas in different Availability Zones. The SRE team must measure, every month, how long the API takes to recover when the writer instance fails. The test must be defined once as a reusable template, must stop automatically if the API error rate alarm goes into the ALARM state, and must leave a record of when the fault was injected. The team wants to use managed AWS services.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute une API de commandes sur Amazon ECS avec un cluster Aurora PostgreSQL qui comporte une instance d'écriture et deux réplicas Aurora dans des zones de disponibilité différentes. L'équipe SRE doit mesurer chaque mois le temps que met l'API à se rétablir quand l'instance d'écriture tombe en panne. Le test doit être défini une fois sous forme de modèle réutilisable, doit s'arrêter automatiquement si l'alarme de taux d'erreur de l'API passe à l'état ALARM, et doit laisser une trace de l'heure d'injection de la panne. L'équipe veut utiliser des services AWS gérés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Schedule a monthly Lambda function that deletes the writer instance, records the time in Amazon DynamoDB, and recreates the instance after the API recovers."
        fr: "Planifier une fonction Lambda mensuelle qui supprime l'instance d'écriture, enregistre l'heure dans Amazon DynamoDB et recrée l'instance après le rétablissement de l'API."
    - id: b
      text:
        en: "Create an AWS FIS experiment template with the aws:rds:failover-db-cluster action on the cluster, the API error rate alarm as a stop condition, and experiment logging turned on."
        fr: "Créer un modèle d'expérience AWS FIS avec l'action aws:rds:failover-db-cluster sur le cluster, l'alarme de taux d'erreur de l'API comme condition d'arrêt, et la journalisation des expériences activée."
    - id: c
      text:
        en: "Create an AWS FIS experiment template with the aws:rds:reboot-db-instances action on the writer instance with forceFailover set to false, and the API error rate alarm as a stop condition."
        fr: "Créer un modèle d'expérience AWS FIS avec l'action aws:rds:reboot-db-instances sur l'instance d'écriture avec forceFailover à false, et l'alarme de taux d'erreur de l'API comme condition d'arrêt."
    - id: d
      text:
        en: "Ask an operator to choose Failover for the cluster in the Amazon RDS console each month and to note the time of the action in the change ticket."
        fr: "Demander chaque mois à un opérateur de choisir Failover pour le cluster dans la console Amazon RDS et de noter l'heure de l'action dans le ticket de changement."
answer: { optionId: b }
explanation:
  correct:
    en: "The aws:rds:failover-db-cluster action runs FailoverDBCluster on the target Aurora cluster, which promotes a replica as a real writer failure would. The experiment template is reusable, the CloudWatch alarm stop condition halts the experiment if the error rate breaches, and experiment logging records the start and end time of each action."
    fr: "L'action aws:rds:failover-db-cluster exécute FailoverDBCluster sur le cluster Aurora cible, ce qui promeut un réplica comme le ferait une vraie panne de l'instance d'écriture. Le modèle d'expérience est réutilisable, la condition d'arrêt fondée sur l'alarme CloudWatch arrête l'expérience si le taux d'erreur est dépassé, et la journalisation enregistre l'heure de début et de fin de chaque action."
  options:
    a: { en: "Deleting the writer is destructive, has no automatic stop condition, and needs custom code to build and maintain.", fr: "Supprimer l'instance d'écriture est destructif, n'a pas de condition d'arrêt automatique et demande du code personnalisé à créer et maintenir." }
    c: { en: "A reboot without forced failover restarts the writer in place, so it doesn't test the promotion of a replica.", fr: "Un redémarrage sans basculement forcé relance l'instance d'écriture sur place : il ne teste pas la promotion d'un réplica." }
    d: { en: "A manual console action isn't a reusable template and has no automatic stop condition.", fr: "Une action manuelle dans la console n'est pas un modèle réutilisable et n'a pas de condition d'arrêt automatique." }
references:
  - title: AWS FIS Actions reference
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
  - title: Stop conditions for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html
