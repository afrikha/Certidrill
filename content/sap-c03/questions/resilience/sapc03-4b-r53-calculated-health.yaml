id: sapc03-4b-r53-calculated-health
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application active/passive in the eu-west-1 and eu-west-2 Regions. Amazon Route 53 failover records point to an Application Load Balancer in each Region, and an endpoint health check monitors the /health path in eu-west-1. During a recent incident, the Aurora writer in eu-west-1 was unavailable, but the /health path still returned HTTP 200, so Route 53 never failed over. A CloudWatch alarm on database connection errors, in the same account and based on a standard-resolution metric with the Average statistic, did enter the ALARM state. The company wants Route 53 to fail over when either the /health check fails or the database alarm indicates a problem.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une application web en actif/passif dans les Régions eu-west-1 et eu-west-2. Des enregistrements de basculement Amazon Route 53 pointent vers un Application Load Balancer dans chaque Région, et une vérification de l'état de point de terminaison surveille le chemin /health dans eu-west-1. Lors d'un récent incident, l'instance d'écriture Aurora d'eu-west-1 était indisponible, mais le chemin /health renvoyait toujours HTTP 200 : Route 53 n'a jamais basculé. Une alarme CloudWatch sur les erreurs de connexion à la base, dans le même compte et fondée sur une métrique à résolution standard avec la statistique Average, est bien passée à l'état ALARM. L'entreprise veut que Route 53 bascule quand la vérification /health échoue ou quand l'alarme de base de données signale un problème.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Replace the failover records with latency-based records so that Route 53 sends users to the Region with the lowest latency and the healthiest database.", fr: "Remplacer les enregistrements de basculement par des enregistrements basés sur la latence afin que Route 53 envoie les utilisateurs vers la Région à la latence la plus faible et à la base la plus saine." }
    - id: b
      text: { en: "Create a Route 53 health check that monitors the CloudWatch alarm on database connection errors.", fr: "Créer une vérification de l'état Route 53 qui surveille l'alarme CloudWatch des erreurs de connexion à la base." }
    - id: c
      text: { en: "Set the TTL of the primary failover record to 0 seconds so that clients resolve the name again on every request.", fr: "Définir à 0 seconde le TTL de l'enregistrement de basculement principal afin que les clients résolvent à nouveau le nom à chaque requête." }
    - id: d
      text: { en: "Create a calculated health check that is healthy only when both the /health check and the alarm-based check are healthy, and associate it with the primary failover record.", fr: "Créer une vérification de l'état calculée qui n'est saine que si la vérification /health et la vérification fondée sur l'alarme sont toutes deux saines, et l'associer à l'enregistrement de basculement principal." }
    - id: e
      text: { en: "Associate the alarm-based health check with the secondary failover record so that Route 53 promotes eu-west-2 when the alarm fires.", fr: "Associer la vérification fondée sur l'alarme à l'enregistrement de basculement secondaire afin que Route 53 favorise eu-west-2 quand l'alarme se déclenche." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A CloudWatch alarm-based health check follows the alarm's data stream; it supports standard-resolution metrics, the Average statistic and alarms in the same account. A calculated health check combines child health checks, here requiring both to be healthy, and associating it with the primary record makes Route 53 fail over when either the endpoint check or the database alarm reports a problem."
    fr: "Une vérification de l'état fondée sur une alarme CloudWatch suit le flux de données de l'alarme ; elle prend en charge les métriques à résolution standard, la statistique Average et les alarmes du même compte. Une vérification calculée combine des vérifications enfants, ici en exigeant que les deux soient saines, et l'associer à l'enregistrement principal fait basculer Route 53 dès que la vérification de point de terminaison ou l'alarme de base signale un problème."
  options:
    a:
      en: "Latency-based routing sends users to both Regions and does not evaluate the database alarm, which breaks the active/passive design."
      fr: "Le routage basé sur la latence envoie les utilisateurs vers les deux Régions et n'évalue pas l'alarme de base, ce qui casse la conception actif/passif."
    c:
      en: "A lower TTL speeds up the propagation of a failover, but it does not make Route 53 detect the database problem that should trigger the failover."
      fr: "Un TTL plus faible accélère la propagation d'un basculement, mais ne fait pas détecter par Route 53 le problème de base qui doit le déclencher."
    e:
      en: "Failover routing returns the primary record while it is healthy; a health check on the secondary record only decides whether the secondary can receive traffic."
      fr: "Le routage de basculement renvoie l'enregistrement principal tant qu'il est sain ; une vérification sur l'enregistrement secondaire décide seulement si le secondaire peut recevoir du trafic."
references:
  - title: Types of Amazon Route 53 health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html
