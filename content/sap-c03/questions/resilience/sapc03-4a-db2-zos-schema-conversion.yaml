id: sapc03-4a-db2-zos-schema-conversion
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A government agency is modernizing a mainframe application and must move its IBM Db2 for z/OS database to Amazon Aurora PostgreSQL. The schemas contain thousands of stored procedures, triggers and user-defined functions, and the agency wants a managed service to convert as much of this code as possible automatically, including objects that rule-based conversion cannot fully convert. A DBA tried to create a DMS Schema Conversion migration project in the AWS Management Console but could not select Db2 for z/OS as the source. The agency's workloads run in the US East (N. Virginia) Region.

    Which solution will meet these requirements?
  fr: |
    Une administration modernise une application mainframe et doit déplacer sa base IBM Db2 for z/OS vers Amazon Aurora PostgreSQL. Les schémas contiennent des milliers de procédures stockées, de déclencheurs et de fonctions définies par l'utilisateur, et l'administration veut qu'un service géré convertisse automatiquement la plus grande partie possible de ce code, y compris les objets que la conversion par règles ne peut pas convertir entièrement. Un DBA a essayé de créer un projet de migration DMS Schema Conversion dans la console de gestion AWS, mais n'a pas pu sélectionner Db2 for z/OS comme source. Les charges de travail de l'administration s'exécutent dans la Région USA Est (Virginie du Nord).

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create the migration project in the console with IBM Db2 for LUW as the source data provider, because DMS Schema Conversion treats Db2 for LUW and Db2 for z/OS as the same dialect."
        fr: "Créer le projet de migration dans la console avec IBM Db2 for LUW comme fournisseur de données source, car DMS Schema Conversion traite Db2 for LUW et Db2 for z/OS comme le même dialecte."
    - id: b
      text:
        en: "Create the instance profile, the Db2 for z/OS and Aurora PostgreSQL data providers and the migration project with the AWS CLI or the DMS API, and turn on generative AI conversion for the project."
        fr: "Créer le profil d'instance, les fournisseurs de données Db2 for z/OS et Aurora PostgreSQL et le projet de migration avec l'AWS CLI ou l'API DMS, puis activer la conversion par IA générative pour le projet."
    - id: c
      text:
        en: "Change the target to Amazon RDS for Db2, create the migration project from Db2 for z/OS with the AWS CLI, and turn on generative AI conversion to convert the stored procedures."
        fr: "Changer la cible pour Amazon RDS for Db2, créer le projet de migration depuis Db2 for z/OS avec l'AWS CLI, puis activer la conversion par IA générative pour convertir les procédures stockées."
    - id: d
      text:
        en: "Use AWS DMS homogeneous data migrations from Db2 for z/OS to Aurora PostgreSQL, so that DMS uses the native database tools in a serverless environment to convert and move the schemas, the code and the data."
        fr: "Utiliser les migrations de données homogènes AWS DMS de Db2 for z/OS vers Aurora PostgreSQL, pour que DMS utilise les outils natifs de la base dans un environnement sans serveur afin de convertir et de déplacer les schémas, le code et les données."
answer: { optionId: b }
explanation:
  correct:
    en: "DMS Schema Conversion supports Db2 for z/OS to Aurora PostgreSQL, but this path is not available in the AWS Management Console and must be created with the DMS API or the AWS CLI. The path supports generative AI conversion, which converts more of the objects that the rules engine cannot fully convert, and US East (N. Virginia) is a supported Region."
    fr: "DMS Schema Conversion prend en charge Db2 for z/OS vers Aurora PostgreSQL, mais ce chemin n'est pas disponible dans la console de gestion AWS et doit être créé avec l'API DMS ou l'AWS CLI. Il prend en charge la conversion par IA générative, qui convertit davantage d'objets que le moteur de règles ne peut pas convertir entièrement, et USA Est (Virginie du Nord) est une Région prise en charge."
  options:
    a: { en: "Db2 for LUW and Db2 for z/OS are different source types with separate conversion paths; choosing LUW does not convert a z/OS source correctly.", fr: "Db2 for LUW et Db2 for z/OS sont des types de source différents avec des chemins de conversion distincts ; choisir LUW ne convertit pas correctement une source z/OS." }
    c: { en: "The target must be Aurora PostgreSQL, and the Db2 for z/OS to RDS for Db2 path does not support generative AI conversion.", fr: "La cible doit être Aurora PostgreSQL, et le chemin Db2 for z/OS vers RDS for Db2 ne prend pas en charge la conversion par IA générative." }
    d: { en: "Homogeneous data migrations move databases to the same engine on RDS or Aurora; they do not convert Db2 code to PostgreSQL.", fr: "Les migrations de données homogènes déplacent des bases vers le même moteur sur RDS ou Aurora ; elles ne convertissent pas du code Db2 en PostgreSQL." }
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
