id: sapc03-4c-r53-detection-time
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs an API in two AWS Regions behind Network Load Balancers with static Elastic IP addresses. Amazon Route 53 failover records of type A (not alias records) point to these addresses with a TTL of 120 seconds. The primary record uses a health check that was created with a request interval of 30 seconds and a failure threshold of 3. During the last failover test, clients needed more than 3 minutes to reach the secondary Region. The new target is that clients reach the secondary Region within about 60 seconds after the primary endpoint stops responding. To avoid failovers caused by transient errors, a single failed check must not change the endpoint status.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement exécute une API dans deux Régions AWS derrière des Network Load Balancers dotés d'adresses IP Elastic statiques. Des enregistrements de basculement Amazon Route 53 de type A (pas des enregistrements d'alias) pointent vers ces adresses avec une TTL de 120 secondes. L'enregistrement principal utilise une vérification de l'état créée avec un intervalle de requête de 30 secondes et un seuil d'échec de 3. Lors du dernier test de basculement, les clients ont mis plus de 3 minutes à atteindre la Région secondaire. La nouvelle cible est que les clients atteignent la Région secondaire environ 60 secondes au plus après que le point de terminaison principal cesse de répondre. Pour éviter des basculements dus à des erreurs passagères, un seul échec de vérification ne doit pas changer l'état du point de terminaison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Edit the existing health check to use a 10-second request interval and a failure threshold of 2, and keep the 120-second TTL on both failover records."
        fr: "Modifier la vérification de l'état existante pour utiliser un intervalle de requête de 10 secondes et un seuil d'échec de 2, et conserver la TTL de 120 secondes sur les deux enregistrements de basculement."
    - id: b
      text:
        en: "Edit the existing health check to use a failure threshold of 1, and lower the TTL of both failover records to 30 seconds."
        fr: "Modifier la vérification de l'état existante pour utiliser un seuil d'échec de 1, et réduire la TTL des deux enregistrements de basculement à 30 secondes."
    - id: c
      text:
        en: "Create a health check with a 10-second request interval and a failure threshold of 2 in a single custom Region, associate it with the primary record, and keep the 120-second TTL."
        fr: "Créer une vérification de l'état avec un intervalle de requête de 10 secondes et un seuil d'échec de 2 dans une seule Région personnalisée, l'associer à l'enregistrement principal et conserver la TTL de 120 secondes."
    - id: d
      text:
        en: "Create a health check with a 10-second request interval and a failure threshold of 2, associate it with the primary record, and lower the TTL of both failover records to 30 seconds."
        fr: "Créer une vérification de l'état avec un intervalle de requête de 10 secondes et un seuil d'échec de 2, l'associer à l'enregistrement principal, et réduire la TTL des deux enregistrements de basculement à 30 secondes."
answer: { optionId: d }
explanation:
  correct:
    en: "Detection takes roughly the request interval multiplied by the failure threshold, and resolvers can then cache the old answer for up to one TTL. A new fast health check (10 seconds, threshold 2) detects the failure in about 20 seconds, and a 30-second TTL brings the total to about 50 seconds, while two consecutive failures are still needed to change the status. The request interval of an existing health check can't be changed, so a new health check is required."
    fr: "La détection prend à peu près l'intervalle de requête multiplié par le seuil d'échec, puis les résolveurs peuvent conserver l'ancienne réponse en cache jusqu'à une TTL. Une nouvelle vérification rapide (10 secondes, seuil de 2) détecte la panne en environ 20 secondes, et une TTL de 30 secondes porte le total à environ 50 secondes, tout en exigeant deux échecs consécutifs pour changer l'état. L'intervalle de requête d'une vérification existante ne peut pas être modifié : il faut créer une nouvelle vérification."
  options:
    a: { en: "The request interval can't be changed after a health check is created, and even with fast checks the 120-second TTL keeps clients on the failed Region for too long.", fr: "L'intervalle de requête ne peut pas être modifié après la création d'une vérification, et même avec des vérifications rapides, la TTL de 120 secondes laisse les clients trop longtemps sur la Région défaillante." }
    b: { en: "A failure threshold of 1 changes the status after a single failed check, which the transient-error requirement forbids.", fr: "Un seuil d'échec de 1 change l'état après un seul échec de vérification, ce que l'exigence sur les erreurs passagères interdit." }
    c: { en: "A customized health check must use at least three Regions, and the 120-second TTL alone exceeds the 60-second target.", fr: "Une vérification personnalisée doit utiliser au moins trois Régions, et la TTL de 120 secondes dépasse à elle seule la cible de 60 secondes." }
references:
