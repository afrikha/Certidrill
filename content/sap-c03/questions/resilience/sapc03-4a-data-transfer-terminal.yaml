id: sapc03-4a-data-transfer-terminal
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A geophysics company stores 1.5 PB of seismic survey data on portable NVMe storage arrays in its Paris office. The office has a 1 Gbps internet connection and no AWS Direct Connect connection. The data must be in Amazon S3 in the Europe (Paris) Region within three weeks so that a new processing pipeline can start. The company is a new AWS customer, and AWS Snowball Edge devices are not available to it. The storage arrays have 100G LR4 QSFP optical interfaces.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de géophysique stocke 1,5 Po de données d'études sismiques sur des baies de stockage NVMe portables dans son bureau de Paris. Le bureau dispose d'une connexion internet de 1 Gbit/s et d'aucune connexion AWS Direct Connect. Les données doivent être dans Amazon S3 dans la Région Europe (Paris) sous trois semaines pour qu'un nouveau pipeline de traitement puisse démarrer. L'entreprise est un nouveau client AWS, et les appareils AWS Snowball Edge ne lui sont pas disponibles. Les baies de stockage disposent d'interfaces optiques QSFP 100G LR4.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy an AWS DataSync agent in the office, create an Enhanced mode task to Amazon S3 over the internet connection with parallel transfers, and run the task continuously until the transfer completes."
        fr: "Déployer un agent AWS DataSync dans le bureau, créer une tâche en mode Enhanced vers Amazon S3 par la connexion internet avec des transferts parallèles, puis exécuter la tâche en continu jusqu'à la fin du transfert."
    - id: b
      text:
        en: "Enable S3 Transfer Acceleration on the target bucket, and upload the data from the office with parallel multipart uploads over the existing internet connection."
        fr: "Activer S3 Transfer Acceleration sur le compartiment cible, puis charger les données depuis le bureau par des chargements partitionnés parallèles sur la connexion internet existante."
    - id: c
      text:
        en: "Reserve sessions at the AWS Data Transfer Terminal in Paris, bring the storage arrays to the facility, and upload the data to Amazon S3 over its 100G connections to the AWS network."
        fr: "Réserver des sessions dans l'AWS Data Transfer Terminal de Paris, apporter les baies de stockage sur le site, puis charger les données dans Amazon S3 par ses connexions 100G vers le réseau AWS."
    - id: d
      text:
        en: "Create an AWS Transfer Family SFTP server with an S3 bucket as storage, and upload the data from the office with several parallel SFTP clients over the internet connection."
        fr: "Créer un serveur SFTP AWS Transfer Family avec un compartiment S3 comme stockage, puis charger les données depuis le bureau avec plusieurs clients SFTP parallèles par la connexion internet."
answer: { optionId: c }
explanation:
  correct:
    en: "At 1 Gbps, 1.5 PB takes about 139 days even at full line rate, so any online transfer from the office misses the three-week deadline. AWS Data Transfer Terminal is a facility in Paris where customers bring their own storage devices and upload them over at least two 100G connections to the AWS network."
    fr: "À 1 Gbit/s, 1,5 Po prend environ 139 jours même à plein débit : tout transfert en ligne depuis le bureau dépasse le délai de trois semaines. AWS Data Transfer Terminal est un site à Paris où les clients apportent leurs propres appareils de stockage et les chargent par au moins deux connexions 100G vers le réseau AWS."
  options:
    a: { en: "DataSync cannot exceed the 1 Gbps office link, so the transfer would take months.", fr: "DataSync ne peut pas dépasser le lien de 1 Gbit/s du bureau : le transfert prendrait des mois." }
    b: { en: "Transfer Acceleration optimizes the path to AWS but cannot exceed the 1 Gbps office bandwidth.", fr: "Transfer Acceleration optimise le chemin vers AWS mais ne peut pas dépasser la bande passante de 1 Gbit/s du bureau." }
    d: { en: "SFTP uploads are still limited by the 1 Gbps internet connection, so the deadline is missed.", fr: "Les chargements SFTP restent limités par la connexion internet de 1 Gbit/s : le délai n'est pas tenu." }
references:
  - title: AWS Data Transfer Terminal FAQs
    url: https://aws.amazon.com/data-transfer-terminal/faqs/
