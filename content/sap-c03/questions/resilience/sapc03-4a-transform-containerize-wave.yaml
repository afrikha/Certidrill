id: sapc03-4a-transform-containerize-wave
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company is migrating its VMware data center with AWS Transform, which has already built the move groups and waves. Most waves will be rehosted to Amazon EC2. One wave contains 60 in-house Java web applications that run on aging application servers inside virtual machines, and their source code is in the company's Git repositories. The company wants these 60 applications to run as containers on Amazon EKS instead of on virtual machines. The platform team wants to avoid writing Dockerfiles and deployment manifests by hand for each application.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une entreprise industrielle migre son centre de données VMware avec AWS Transform, qui a déjà constitué les groupes de déplacement et les vagues. La plupart des vagues seront réhébergées sur Amazon EC2. Une vague contient 60 applications web Java développées en interne, qui s'exécutent sur des serveurs d'applications vieillissants dans des machines virtuelles, et leur code source se trouve dans les dépôts Git de l'entreprise. L'entreprise veut que ces 60 applications s'exécutent sous forme de conteneurs sur Amazon EKS plutôt que sur des machines virtuelles. L'équipe plateforme veut éviter d'écrire à la main des Dockerfiles et des manifestes de déploiement pour chaque application.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text:
        en: "In the AWS Transform migration plan, set the migration strategy of that wave to containerize, so that AWS Transform containerizes the applications from their source code and deploys them to Amazon EKS."
        fr: "Dans le plan de migration AWS Transform, définir la stratégie de migration de cette vague sur la conteneurisation (containerize), pour qu'AWS Transform conteneurise les applications à partir de leur code source et les déploie sur Amazon EKS."
    - id: b
      text:
        en: "Rehost the wave to Amazon EC2 with AWS Transform MGN, use the Create AMI from instance post-launch action on each server, and launch the resulting AMIs as the worker nodes of a new Amazon EKS cluster."
        fr: "Réhéberger la vague sur Amazon EC2 avec AWS Transform MGN, utiliser l'action post-lancement Create AMI from instance sur chaque serveur, puis lancer les AMI obtenues comme nœuds de travail d'un nouveau cluster Amazon EKS."
    - id: c
      text:
        en: "Rehost the wave to Amazon EC2 with AWS Transform MGN, and then have the developers write a Dockerfile and Kubernetes manifests for each application and deploy them to Amazon EKS."
        fr: "Réhéberger la vague sur Amazon EC2 avec AWS Transform MGN, puis faire écrire par les développeurs un Dockerfile et des manifestes Kubernetes pour chaque application avant de les déployer sur Amazon EKS."
    - id: d
      text:
        en: "Relocate the wave to Amazon Elastic VMware Service, and run the application server virtual machines there until the developers have time to containerize them by hand."
        fr: "Déplacer (relocate) la vague vers Amazon Elastic VMware Service et y exécuter les machines virtuelles des serveurs d'applications jusqu'à ce que les développeurs aient le temps de les conteneuriser à la main."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Transform lets you choose a migration strategy per wave: rehost to Amazon EC2 or containerize. Its source code containerization capability builds containers from the application source code and deploys them to Amazon ECS or Amazon EKS, so the team does not write Dockerfiles or manifests by hand."
    fr: "AWS Transform permet de choisir une stratégie de migration par vague : réhébergement sur Amazon EC2 ou conteneurisation. Sa fonctionnalité de conteneurisation du code source construit des conteneurs à partir du code source des applications et les déploie sur Amazon ECS ou Amazon EKS : l'équipe n'écrit pas de Dockerfiles ni de manifestes à la main."
  options:
    b: { en: "Running rehosted AMIs as EKS nodes still runs each application inside a virtual machine, not as a container.", fr: "Exécuter des AMI réhébergées comme nœuds EKS fait toujours tourner chaque application dans une machine virtuelle, pas dans un conteneur." }
    c: { en: "This reaches EKS but requires the manual Dockerfiles and manifests that the platform team wants to avoid, plus an extra migration step.", fr: "Cette solution atteint EKS mais exige les Dockerfiles et manifestes manuels que l'équipe plateforme veut éviter, plus une étape de migration supplémentaire." }
    d: { en: "The applications stay in virtual machines and the containerization is still manual and postponed.", fr: "Les applications restent dans des machines virtuelles et la conteneurisation reste manuelle et reportée." }
references:
  - title: Build migration plan
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-review-groupings-and-waves.html
  - title: What is AWS Transform?
    url: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
