id: sapc03-4a-retire-candidates
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is assessing 1,200 servers before it closes its data center. AWS Transform has 90 days of discovery data, including utilization and network connections, and has grouped the servers into applications. The team finds 140 servers whose average CPU and memory utilization stays below 5 % and that received no inbound network connections during the 90 days. Nobody in the IT department can identify the owners of these servers. Leadership wants to reduce the migration scope and the ongoing hosting costs as much as possible. The compliance team requires that the data on any decommissioned server be kept for audits.

    Which strategy should the team apply to these 140 servers?
  fr: |
    Une compagnie d'assurance évalue 1 200 serveurs avant de fermer son centre de données. AWS Transform dispose de 90 jours de données de découverte, y compris l'utilisation et les connexions réseau, et a regroupé les serveurs en applications. L'équipe trouve 140 serveurs dont l'utilisation moyenne du processeur et de la mémoire reste inférieure à 5 % et qui n'ont reçu aucune connexion réseau entrante pendant ces 90 jours. Personne au service informatique ne peut identifier les responsables de ces serveurs. La direction veut réduire autant que possible le périmètre de la migration et les coûts d'hébergement récurrents. L'équipe de conformité exige que les données de tout serveur mis hors service soient conservées pour les audits.

    Quelle stratégie l'équipe doit-elle appliquer à ces 140 serveurs ?
body:
  options:
    - id: a
      text:
        en: "Rehost the servers with AWS Transform MGN onto the smallest burstable EC2 instance types, stop the instances after cutover, and start them again only if someone claims them."
        fr: "Réhéberger les serveurs avec AWS Transform MGN sur les plus petits types d'instances EC2 à capacité extensible, arrêter les instances après le basculement et ne les redémarrer que si quelqu'un les réclame."
    - id: b
      text:
        en: "Mark the servers as retire in the AWS Transform 7Rs recommendations, confirm with business stakeholders, archive their data for audits, and decommission them instead of migrating them."
        fr: "Classer les serveurs en retrait (retire) dans les recommandations 7R d'AWS Transform, confirmer avec les parties prenantes métier, archiver leurs données pour les audits, puis les mettre hors service au lieu de les migrer."
    - id: c
      text:
        en: "Mark the servers as retain in the AWS Transform 7Rs recommendations, leave them running in a small colocation rack after the data center exit, and review their ownership and status again in 12 months."
        fr: "Classer les serveurs en conservation (retain) dans les recommandations 7R d'AWS Transform, les laisser fonctionner dans une petite baie en colocation après la sortie du centre de données, puis réexaminer leur propriété et leur statut dans 12 mois."
    - id: d
      text:
        en: "Relocate the servers as one group to Amazon Elastic VMware Service so that no conversion is needed, and decide later whether each server should be rehosted or retired."
        fr: "Déplacer (relocate) les serveurs en un seul groupe vers Amazon Elastic VMware Service pour éviter toute conversion, puis décider plus tard si chaque serveur doit être réhébergé ou retiré."
answer: { optionId: b }
explanation:
  correct:
    en: "Servers with average CPU and memory below 5 % and no inbound connections for 90 days are typical retire candidates: decommissioning them shrinks the migration scope and removes their hosting cost. AWS Transform can recommend retire for idle servers, and the decision is confirmed with stakeholders and the data archived before shutdown."
    fr: "Des serveurs dont le processeur et la mémoire restent en moyenne sous 5 % et sans connexion entrante pendant 90 jours sont des candidats typiques au retrait : les mettre hors service réduit le périmètre de migration et supprime leur coût d'hébergement. AWS Transform peut recommander le retrait des serveurs inactifs, et la décision est confirmée avec les parties prenantes et les données archivées avant l'arrêt."
  options:
    a: { en: "Migrating unused servers keeps them in scope and adds replication, testing and storage costs for workloads that deliver no value.", fr: "Migrer des serveurs inutilisés les maintient dans le périmètre et ajoute des coûts de réplication, de test et de stockage pour des charges sans valeur." }
    c: { en: "Retaining them keeps hosting costs after the data center exit and does not reduce the scope, which leadership wants to minimize.", fr: "Les conserver maintient des coûts d'hébergement après la sortie du centre de données et ne réduit pas le périmètre, ce que la direction veut minimiser." }
    d: { en: "Relocating them moves the unused servers and their costs to AWS, and only postpones the decision that the utilization data already supports.", fr: "Les déplacer transfère les serveurs inutilisés et leurs coûts vers AWS, et ne fait que reporter une décision que les données d'utilisation justifient déjà." }
references:
  - title: About the migration strategies
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
  - title: Migration strategy (7Rs) recommendations
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-r-strategy-report.html
