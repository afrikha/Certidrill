id: sapc03-4b-drs-private-replication
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank protects 80 on-premises servers with AWS Elastic Disaster Recovery (AWS DRS) into a disaster recovery account in the eu-west-3 Region. The security policy forbids any replication data from crossing the public internet, even when it is encrypted. The policy also forbids public IPv4 addresses on resources in the disaster recovery account. The data center already connects to a transit gateway in eu-west-3 over AWS Direct Connect. The current DRS replication settings use a public staging area subnet, and each replication server receives a public IP address.

    Which configuration will meet these requirements?
  fr: |
    Une banque protège 80 serveurs sur site avec AWS Elastic Disaster Recovery (AWS DRS) vers un compte de reprise après sinistre dans la Région eu-west-3. La politique de sécurité interdit que des données de réplication traversent l'internet public, même chiffrées. Elle interdit aussi les adresses IPv4 publiques sur les ressources du compte de reprise. Le centre de données est déjà connecté à une passerelle de transit (transit gateway) dans eu-west-3 par AWS Direct Connect. Les paramètres de réplication DRS actuels utilisent un sous-réseau de zone de transit (staging area) public, et chaque serveur de réplication reçoit une adresse IP publique.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Move the staging area to a private subnet of a VPC attached to the transit gateway, and enable the option to use private IP for data replication over Direct Connect.", fr: "Déplacer la zone de transit vers un sous-réseau privé d'un VPC attaché à la passerelle de transit, et activer l'option d'utilisation de l'IP privée pour la réplication des données par Direct Connect." }
    - id: b
      text: { en: "Keep the public staging area subnet, and restrict the replication server security group to inbound traffic from the public IP ranges of the data center.", fr: "Conserver le sous-réseau public de zone de transit, et limiter le groupe de sécurité des serveurs de réplication au trafic entrant provenant des plages d'IP publiques du centre de données." }
    - id: c
      text: { en: "Create an AWS Site-to-Site VPN over the internet to a virtual private gateway, and point the replication agents to the public IP addresses of the replication servers through the tunnel.", fr: "Créer un AWS Site-to-Site VPN sur internet vers une passerelle privée virtuelle, et diriger les agents de réplication vers les adresses IP publiques des serveurs de réplication via le tunnel." }
    - id: d
      text: { en: "Replace AWS DRS with AWS DataSync agents that copy the server volumes over Direct Connect to Amazon S3 every 15 minutes, and launch EC2 instances from those copies during a disaster or a test.", fr: "Remplacer AWS DRS par des agents AWS DataSync qui copient les volumes des serveurs par Direct Connect vers Amazon S3 toutes les 15 minutes, et lancer des instances EC2 depuis ces copies lors d'un sinistre ou d'un test." }
answer: { optionId: a }
explanation:
  correct:
    en: "By default a replication server gets a public IPv4 address and the staging subnet must be public. When the option to use private IP for data replication is enabled and the VPC has valid routing to the source network, the staging area can be a private subnet, and the agents replicate over the private connection, here Direct Connect through the transit gateway."
    fr: "Par défaut, un serveur de réplication reçoit une adresse IPv4 publique et le sous-réseau de transit doit être public. Quand l'option d'utilisation de l'IP privée pour la réplication est activée et que le VPC dispose d'un routage valide vers le réseau source, la zone de transit peut être un sous-réseau privé, et les agents répliquent par la connexion privée, ici Direct Connect via la passerelle de transit."
  options:
    b:
      en: "Restricting source IP ranges still sends the replication data over the public internet to public IP addresses, which both rules forbid."
      fr: "Restreindre les plages d'IP sources envoie toujours les données de réplication sur l'internet public vers des adresses IP publiques, ce que les deux règles interdisent."
    c:
      en: "A Site-to-Site VPN runs over the internet, and the replication servers would keep public IP addresses in the disaster recovery account."
      fr: "Un Site-to-Site VPN passe par internet, et les serveurs de réplication conserveraient des adresses IP publiques dans le compte de reprise."
    d:
      en: "DataSync transfers files and objects, not bootable server volumes, and copies every 15 minutes neither give an RPO of seconds nor convert servers to run on EC2."
      fr: "DataSync transfère des fichiers et des objets, pas des volumes de serveurs amorçables, et des copies toutes les 15 minutes ne donnent ni un RPO de quelques secondes ni une conversion des serveurs pour EC2."
references:
  - title: AWS DRS replication settings
    url: https://docs.aws.amazon.com/drs/latest/userguide/replication-settings.html
  - title: AWS Elastic Disaster Recovery FAQs
    url: https://aws.amazon.com/disaster-recovery/faqs/
