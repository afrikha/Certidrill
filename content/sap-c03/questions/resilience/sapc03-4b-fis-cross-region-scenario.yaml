id: sapc03-4b-fis-cross-region-scenario
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a multi-Region application with its primary stack in the eu-west-1 Region and a standby in eu-north-1. The Regions are connected by transit gateway peering, Amazon S3 Cross-Region Replication copies documents, and an Amazon DynamoDB global table stores session data. The team has never observed the application while the Regions are disconnected. The disaster recovery team wants to validate how the application behaves when eu-west-1 loses network connectivity to eu-north-1 and cross-Region replication stops. The test must be controlled, must revert automatically at the end, and should start from a prebuilt template rather than custom scripts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application multi-Régions avec sa pile principale dans la Région eu-west-1 et une veille dans eu-north-1. Les Régions sont reliées par un peering de passerelles de transit, la réplication S3 entre Régions copie des documents, et une table globale Amazon DynamoDB stocke les données de session. L'équipe n'a jamais observé l'application pendant une déconnexion des Régions. L'équipe de reprise après sinistre veut valider le comportement de l'application quand eu-west-1 perd la connectivité réseau vers eu-north-1 et que la réplication entre Régions s'arrête. Le test doit être maîtrisé, doit revenir automatiquement à la normale à la fin et doit partir d'un modèle prédéfini plutôt que de scripts personnalisés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS FIS experiment from the Cross-Region: Connectivity scenario in eu-west-1 with eu-north-1 as the destination Region, tag the target resources, and add stop conditions.", fr: "Créer une expérience AWS FIS à partir du scénario Cross-Region: Connectivity dans eu-west-1 avec eu-north-1 comme Région de destination, baliser les ressources cibles et ajouter des conditions d'arrêt." }
    - id: b
      text: { en: "Delete the transit gateway peering attachment and suspend the S3 replication rules during a maintenance window, then re-create them when the observations are complete.", fr: "Supprimer l'attachement de peering de passerelles de transit et suspendre les règles de réplication S3 pendant une fenêtre de maintenance, puis les recréer une fois les observations terminées." }
    - id: c
      text: { en: "Run an AWS Resilience Hub assessment against a resiliency policy with Regional targets, and review the estimated RTO and RPO for the Cloud Infrastructure Region incident type.", fr: "Lancer une évaluation AWS Resilience Hub par rapport à une politique de résilience avec des objectifs régionaux, et examiner le RTO et le RPO estimés pour le type Cloud Infrastructure Region incident." }
    - id: d
      text: { en: "Launch an AWS Elastic Disaster Recovery drill of the application servers into eu-north-1, and compare the drill instances with the production servers.", fr: "Lancer un exercice AWS Elastic Disaster Recovery des serveurs d'application dans eu-north-1, et comparer les instances d'exercice aux serveurs de production." }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS FIS scenario library includes Cross-Region: Connectivity, run from the Region whose outbound traffic is blocked. Its actions block traffic over transit gateways, subnets and VPC endpoints toward the destination Region and pause S3 replication and DynamoDB global table replication for the configured duration, after which replication resumes; stop conditions end the experiment early if an alarm fires."
    fr: "La bibliothèque de scénarios AWS FIS comprend Cross-Region: Connectivity, exécuté depuis la Région dont le trafic sortant est bloqué. Ses actions bloquent le trafic par les passerelles de transit, les sous-réseaux et les points de terminaison VPC vers la Région de destination et suspendent la réplication S3 et celle des tables globales DynamoDB pendant la durée configurée, après quoi la réplication reprend ; des conditions d'arrêt mettent fin à l'expérience plus tôt si une alarme se déclenche."
  options:
    b:
      en: "Deleting and re-creating resources is a manual, destructive change that does not revert automatically and can leave the configuration broken if re-creation fails."
      fr: "Supprimer puis recréer des ressources est une modification manuelle et destructive qui ne revient pas automatiquement à la normale et peut laisser la configuration cassée si la recréation échoue."
    c:
      en: "An assessment estimates recovery objectives from the configuration; it injects no failure, so it does not show how the application actually behaves."
      fr: "Une évaluation estime les objectifs de reprise à partir de la configuration ; elle n'injecte aucune panne et ne montre donc pas le comportement réel de l'application."
    d:
      en: "An Elastic Disaster Recovery drill launches copies of protected servers; it neither cuts connectivity between Regions nor pauses S3 and DynamoDB replication."
      fr: "Un exercice Elastic Disaster Recovery lance des copies de serveurs protégés ; il ne coupe pas la connectivité entre Régions et ne suspend pas la réplication S3 et DynamoDB."
references:
  - title: "Cross-Region: Connectivity"
    url: https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html
  - title: Scenarios reference
    url: https://docs.aws.amazon.com/fis/latest/userguide/scenario-library-scenarios.html
