id: sapc03-4a-discovery-network-deps
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs 900 Windows and Linux servers on VMware vSphere and on Microsoft Hyper-V in one data center. The original application owners left the company years ago, and the CMDB does not record which servers communicate with each other. Before planning migration waves, the migration team must map server-to-server dependencies, collect CPU, memory and storage utilization for rightsizing, and detect the SQL Server and Oracle Database instances. The security team prohibits installing software on production servers, but it allows one appliance virtual machine on each hypervisor platform and read-only operating system credentials. The company is starting its first migration to AWS this year.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exécute 900 serveurs Windows et Linux sur VMware vSphere et sur Microsoft Hyper-V dans un seul centre de données. Les responsables d'origine des applications ont quitté l'entreprise il y a des années, et la CMDB n'indique pas quels serveurs communiquent entre eux. Avant de planifier les vagues de migration, l'équipe de migration doit cartographier les dépendances entre serveurs, collecter l'utilisation du processeur, de la mémoire et du stockage pour le redimensionnement (rightsizing) et détecter les instances SQL Server et Oracle Database. L'équipe de sécurité interdit d'installer un logiciel sur les serveurs de production, mais elle autorise une machine virtuelle d'appliance sur chaque plateforme d'hyperviseur ainsi que des informations d'identification du système d'exploitation en lecture seule. L'entreprise commence cette année sa première migration vers AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the AWS Transform discovery tool as an OVA on vCenter and as a VHD on Hyper-V, add both discovery sources, and configure WinRM and SSH credentials so that it collects network connections, utilization and database metadata."
        fr: "Déployer l'outil de découverte AWS Transform sous forme d'OVA sur vCenter et de VHD sur Hyper-V, ajouter les deux sources de découverte, puis configurer des informations d'identification WinRM et SSH pour qu'il collecte les connexions réseau, l'utilisation et les métadonnées des bases."
    - id: b
      text:
        en: "Deploy the AWS Application Discovery Service Agentless Collector on vCenter, enable its network data collection module, and visualize the server-to-server connections and utilization in the AWS Migration Hub console."
        fr: "Déployer AWS Application Discovery Service Agentless Collector sur vCenter, activer son module de collecte des données réseau, puis visualiser les connexions entre serveurs et l'utilisation dans la console AWS Migration Hub."
    - id: c
      text:
        en: "Export the vCenter inventory with RVTools and the Hyper-V inventory with PowerShell, import both files into an AWS Transform migration assessment, and derive the dependencies from the subnet of each server."
        fr: "Exporter l'inventaire vCenter avec RVTools et l'inventaire Hyper-V avec PowerShell, importer les deux fichiers dans une évaluation de migration AWS Transform, puis déduire les dépendances à partir du sous-réseau de chaque serveur."
    - id: d
      text:
        en: "Configure NetFlow export on the core switches to a collector on an Amazon EC2 instance, store the flow records in Amazon S3, and join them with the RVTools inventory in Amazon Athena to build the dependency groups and utilization reports."
        fr: "Configurer l'export NetFlow sur les commutateurs principaux vers un collecteur sur une instance Amazon EC2, stocker les enregistrements de flux dans Amazon S3, puis les joindre à l'inventaire RVTools dans Amazon Athena pour constituer les groupes de dépendances et les rapports d'utilisation."
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Transform discovery tool runs as an appliance (OVA on vCenter, VHD on Hyper-V) and reaches the servers over WinRM and SSH, so nothing is installed on them. It collects established TCP connections between inventoried servers, CPU, memory and storage performance statistics, and SQL Server and Oracle Database metadata, which feed the AWS Transform migration plan."
    fr: "L'outil de découverte AWS Transform s'exécute comme une appliance (OVA sur vCenter, VHD sur Hyper-V) et accède aux serveurs par WinRM et SSH, sans rien installer sur eux. Il collecte les connexions TCP établies entre les serveurs inventoriés, les statistiques de performance du processeur, de la mémoire et du stockage ainsi que les métadonnées SQL Server et Oracle Database, qui alimentent le plan de migration AWS Transform."
  options:
    b: { en: "AWS Application Discovery Service and AWS Migration Hub have not accepted new customers since November 7, 2025, and a vCenter collector does not cover the Hyper-V servers.", fr: "AWS Application Discovery Service et AWS Migration Hub n'acceptent plus de nouveaux clients depuis le 7 novembre 2025, et un collecteur vCenter ne couvre pas les serveurs Hyper-V." }
    c: { en: "Inventory exports contain no network connections and no database discovery; servers in the same subnet do not necessarily depend on each other.", fr: "Les exports d'inventaire ne contiennent ni connexions réseau ni découverte des bases de données ; des serveurs du même sous-réseau ne dépendent pas forcément les uns des autres." }
    d: { en: "Flow records give connections only between IP addresses; this custom pipeline collects no Hyper-V utilization and detects no database instances.", fr: "Les enregistrements de flux ne donnent que des connexions entre adresses IP ; ce pipeline personnalisé ne collecte pas l'utilisation des serveurs Hyper-V et ne détecte aucune instance de base de données." }
