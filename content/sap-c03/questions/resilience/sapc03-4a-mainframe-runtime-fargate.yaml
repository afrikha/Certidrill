id: sapc03-4a-mainframe-runtime-fargate
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has used AWS Transform for mainframe to refactor its card management system from COBOL into Java. The build produces a business service WAR file and a web WAR file that run on the AWS Transform for mainframe Runtime. The data has been migrated to Amazon Aurora PostgreSQL. The platform team does not want to manage servers, cluster nodes or operating system patches. The application must continue to run if an Availability Zone fails and must scale with the daily transaction volume.

    Which deployment will meet these requirements with the LEAST operational overhead?
  fr: |
    Une banque a utilisé AWS Transform for mainframe pour refactoriser son système de gestion des cartes de COBOL vers Java. La compilation produit un fichier WAR de services métier et un fichier WAR web qui s'exécutent sur AWS Transform for mainframe Runtime. Les données ont été migrées vers Amazon Aurora PostgreSQL. L'équipe plateforme ne veut gérer ni serveurs, ni nœuds de cluster, ni correctifs du système d'exploitation. L'application doit continuer à fonctionner en cas de panne d'une zone de disponibilité et monter en charge selon le volume quotidien de transactions.

    Quel déploiement répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Deploy the runtime and the WAR files to an AWS Mainframe Modernization managed runtime environment, and configure high availability for the application in that environment."
        fr: "Déployer l'environnement d'exécution et les fichiers WAR dans un environnement d'exécution géré AWS Mainframe Modernization, puis configurer la haute disponibilité de l'application dans cet environnement."
    - id: b
      text:
        en: "Install the runtime and the WAR files on Amazon EC2 instances in an Auto Scaling group across two Availability Zones, and patch the instances with AWS Systems Manager Patch Manager."
        fr: "Installer l'environnement d'exécution et les fichiers WAR sur des instances Amazon EC2 dans un groupe Auto Scaling sur deux zones de disponibilité, puis corriger les instances avec AWS Systems Manager Patch Manager."
    - id: c
      text:
        en: "Package the runtime and the WAR files as container images, and run them as an Amazon ECS service on AWS Fargate across multiple Availability Zones with service auto scaling."
        fr: "Empaqueter l'environnement d'exécution et les fichiers WAR sous forme d'images de conteneur, puis les exécuter comme service Amazon ECS sur AWS Fargate sur plusieurs zones de disponibilité avec mise à l'échelle automatique du service."
    - id: d
      text:
        en: "Package the runtime and the WAR files as container images, and run them on an Amazon EKS cluster with self-managed node groups on EC2 instances in two Availability Zones with the Cluster Autoscaler."
        fr: "Empaqueter l'environnement d'exécution et les fichiers WAR sous forme d'images de conteneur, puis les exécuter sur un cluster Amazon EKS avec des groupes de nœuds autogérés sur des instances EC2 dans deux zones de disponibilité avec Cluster Autoscaler."
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Transform for mainframe Runtime is customer-deployed and can run on Amazon EC2, Amazon ECS on EC2, Amazon EKS on EC2 or Amazon ECS managed by AWS Fargate, with containers preferred for ECS and EKS. ECS on Fargate removes server and node management, and a multi-AZ service with auto scaling meets the availability and scaling requirements."
    fr: "AWS Transform for mainframe Runtime est déployé par le client et peut s'exécuter sur Amazon EC2, Amazon ECS sur EC2, Amazon EKS sur EC2 ou Amazon ECS géré par AWS Fargate, les conteneurs étant privilégiés pour ECS et EKS. ECS sur Fargate supprime la gestion des serveurs et des nœuds, et un service multi-AZ avec mise à l'échelle automatique répond aux exigences de disponibilité et de montée en charge."
  options:
    a: { en: "The AWS Mainframe Modernization managed runtime environment experience is no longer open to new customers.", fr: "L'expérience d'environnement d'exécution géré AWS Mainframe Modernization n'est plus ouverte aux nouveaux clients." }
    b: { en: "The team would manage EC2 instances and their operating system patches, which it wants to avoid.", fr: "L'équipe gérerait des instances EC2 et les correctifs de leur système d'exploitation, ce qu'elle veut éviter." }
    d: { en: "Self-managed node groups leave the cluster nodes and their patching to the team.", fr: "Des groupes de nœuds autogérés laissent à l'équipe les nœuds du cluster et leurs correctifs." }
references:
  - title: AWS Transform for mainframe Runtime
    url: https://docs.aws.amazon.com/m2/latest/userguide/ba-runtime-options.html
