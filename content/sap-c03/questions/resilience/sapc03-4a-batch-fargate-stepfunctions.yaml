id: sapc03-4a-batch-fargate-stepfunctions
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company runs 30 nightly batch jobs written in Python on three Linux virtual machines, scheduled with cron. Each job processes the sales of one country, runs for two to three hours, needs 16 GB of memory, and can run in parallel with the other jobs. The company is replatforming the jobs to AWS and does not want to manage any servers or clusters. It wants to pay only while the jobs run. Failed jobs must be retried automatically, and the operations team must be notified when a job still fails after its retries. The job code must stay unchanged apart from packaging.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute 30 traitements par lots nocturnes écrits en Python sur trois machines virtuelles Linux, planifiés avec cron. Chaque traitement traite les ventes d'un pays, dure deux à trois heures, a besoin de 16 Go de mémoire et peut s'exécuter en parallèle des autres. L'entreprise change la plateforme de ces traitements vers AWS et ne veut gérer ni serveurs ni clusters. Elle veut payer uniquement pendant l'exécution des traitements. Les traitements en échec doivent être relancés automatiquement, et l'équipe d'exploitation doit être avertie lorsqu'un traitement échoue encore après ses nouvelles tentatives. Le code des traitements doit rester inchangé, hormis son empaquetage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an EC2 Auto Scaling group with scheduled actions that scale from zero to three instances at night, run the jobs with cron on the instances, and alarm on failures with Amazon CloudWatch."
        fr: "Créer un groupe Auto Scaling EC2 avec des actions planifiées qui passent de zéro à trois instances la nuit, exécuter les traitements avec cron sur les instances et créer des alarmes Amazon CloudWatch sur les échecs."
    - id: b
      text:
        en: "Deploy the jobs to an AWS Elastic Beanstalk worker environment with enhanced health reporting, schedule them with periodic tasks in a cron.yaml file, and send failed messages to an Amazon SQS dead-letter queue that alarms the team."
        fr: "Déployer les traitements dans un environnement de travail AWS Elastic Beanstalk avec le rapport d'intégrité amélioré, les planifier par des tâches périodiques dans un fichier cron.yaml, puis envoyer les messages en échec vers une file de lettres mortes Amazon SQS qui alerte l'équipe."
    - id: c
      text:
        en: "Create an Amazon EKS cluster with a managed node group, run the jobs as Kubernetes CronJobs with a retry limit, and send failure notifications from a monitoring agent installed on the nodes."
        fr: "Créer un cluster Amazon EKS avec un groupe de nœuds gérés, exécuter les traitements comme CronJobs Kubernetes avec une limite de nouvelles tentatives, puis envoyer les notifications d'échec depuis un agent de supervision installé sur les nœuds."
    - id: d
      text:
        en: "Package the jobs as images in Amazon ECR, and have EventBridge Scheduler start a Step Functions Standard workflow that runs one ECS task on AWS Fargate per country, with Retry and a Catch that notifies Amazon SNS."
        fr: "Empaqueter les traitements en images dans Amazon ECR, et faire démarrer par EventBridge Scheduler un flux de travail Step Functions Standard qui exécute une tâche ECS sur AWS Fargate par pays, avec un Retry et un Catch qui avertit Amazon SNS."
answer: { optionId: d }
explanation:
  correct:
    en: "Fargate runs each containerized job without servers or clusters to manage and bills only while the tasks run. A Standard workflow can run for up to one year and supports the .sync pattern that waits for each ECS task to finish, so Retry relaunches failed jobs and a Catch publishes to SNS after the last attempt; EventBridge Scheduler starts the workflow every night."
    fr: "Fargate exécute chaque traitement conteneurisé sans serveurs ni clusters à gérer et ne facture que pendant l'exécution des tâches. Un flux de travail Standard peut durer jusqu'à un an et prend en charge le modèle .sync qui attend la fin de chaque tâche ECS : Retry relance les traitements en échec et un Catch publie vers SNS après la dernière tentative ; EventBridge Scheduler démarre le flux chaque nuit."
  options:
    a: { en: "The company would still manage EC2 instances and their operating systems, and cron provides no automatic retries.", fr: "L'entreprise gérerait toujours des instances EC2 et leurs systèmes d'exploitation, et cron n'offre pas de nouvelles tentatives automatiques." }
    b: { en: "A worker environment keeps EC2 instances running and billed all day, so the company does not pay only while the jobs run.", fr: "Un environnement de travail maintient des instances EC2 en marche et facturées toute la journée : l'entreprise ne paie pas uniquement pendant les traitements." }
    c: { en: "An EKS cluster with a node group is a cluster and servers to manage, and the nodes and control plane are billed even when no job runs.", fr: "Un cluster EKS avec un groupe de nœuds représente un cluster et des serveurs à gérer, et les nœuds comme le plan de contrôle sont facturés même quand aucun traitement ne s'exécute." }
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
  - title: Using Amazon EventBridge Scheduler to schedule Amazon ECS tasks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/tasks-scheduled-eventbridge-scheduler.html
