id: sapc03-4b-dr-capacity-validation
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During last quarter's DR test of a tier-0 trading application, an ARC Region switch plan executed every step successfully. However, the EC2 Auto Scaling group in the recovery Region reached only 60 percent of its target capacity because of insufficient capacity for the required instance type in two Availability Zones, and the RTO was missed. The company's EC2 service quotas in the recovery Region were already sufficient. The new requirement is that the recovery Region reaches 100 percent of the required compute capacity within the RTO during any test or real event. The company also wants to keep detecting configuration problems in the recovery plan between tests.

    Which solution will meet these requirements?
  fr: |
    Lors du test de reprise du dernier trimestre d'une application de trading de niveau 0, un plan ARC Region switch a exécuté toutes ses étapes avec succès. Pourtant, l'Auto Scaling group EC2 de la Région de reprise n'a atteint que 60 % de sa capacité cible faute de capacité suffisante pour le type d'instance requis dans deux zones de disponibilité, et le RTO n'a pas été respecté. Les quotas de service EC2 de l'entreprise dans la Région de reprise étaient déjà suffisants. La nouvelle exigence est que la Région de reprise atteigne 100 % de la capacité de calcul requise dans le RTO lors de tout test ou événement réel. L'entreprise veut aussi continuer à détecter les problèmes de configuration du plan de reprise entre les tests.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request an increase of the On-Demand Standard instances vCPU quota in the recovery Region to twice the production fleet, and keep relying on Region switch plan evaluation.", fr: "Demander l'augmentation du quota de vCPU d'instances On-Demand standard dans la Région de reprise au double de la flotte de production, et continuer à s'appuyer sur l'évaluation du plan Region switch." }
    - id: b
      text: { en: "Create On-Demand Capacity Reservations for the required instance type in the recovery Availability Zones, have the recovery launch template use them, and keep relying on Region switch plan evaluation.", fr: "Créer des On-Demand Capacity Reservations pour le type d'instance requis dans les zones de disponibilité de reprise, faire utiliser ces réservations par le modèle de lancement de reprise, et continuer à s'appuyer sur l'évaluation du plan Region switch." }
    - id: c
      text: { en: "Onboard the application to ARC readiness checks so that the capacity of the recovery Auto Scaling group is monitored continuously against the production Auto Scaling group.", fr: "Intégrer l'application aux readiness checks d'ARC afin que la capacité de l'Auto Scaling group de reprise soit comparée en continu à celle de l'Auto Scaling group de production." }
    - id: d
      text: { en: "Change the recovery Auto Scaling group to use Spot Instances with the capacity-optimized allocation strategy across several instance types and Availability Zones, and keep relying on Region switch plan evaluation.", fr: "Faire utiliser à l'Auto Scaling group de reprise des instances Spot avec la stratégie d'allocation capacity-optimized sur plusieurs types d'instances et zones de disponibilité, et continuer à s'appuyer sur l'évaluation du plan Region switch." }
answer: { optionId: b }
explanation:
  correct:
    en: "Region switch scaling blocks request capacity but do not guarantee that it is obtained, and AWS recommends reserving capacity, for example with On-Demand Capacity Reservations in the secondary Region, for critical applications. Plan evaluation, which runs after each plan change and every 30 minutes, continues to report configuration problems between tests."
    fr: "Les blocs de mise à l'échelle de Region switch demandent de la capacité mais ne garantissent pas de l'obtenir, et AWS recommande de réserver la capacité, par exemple avec des On-Demand Capacity Reservations dans la Région secondaire, pour les applications critiques. L'évaluation du plan, exécutée après chaque modification et toutes les 30 minutes, continue de signaler les problèmes de configuration entre les tests."
  options:
    a:
      en: "Service quotas limit how much the account may launch; a higher quota does not create physical capacity in an Availability Zone, and the quotas were already sufficient."
      fr: "Les quotas de service limitent ce que le compte peut lancer ; un quota plus élevé ne crée pas de capacité physique dans une zone de disponibilité, et les quotas étaient déjà suffisants."
    c:
      en: "ARC readiness check is no longer open to new customers, and monitoring capacity differences would still not guarantee that capacity is available during an event."
      fr: "Les readiness checks d'ARC ne sont plus ouverts aux nouveaux clients, et surveiller des écarts de capacité ne garantirait toujours pas sa disponibilité pendant un événement."
    d:
      en: "Spot capacity can be interrupted or unavailable, especially when many customers fail over at the same time, so it cannot guarantee 100 percent of the capacity."
      fr: "La capacité Spot peut être interrompue ou indisponible, surtout quand de nombreux clients basculent en même temps : elle ne peut pas garantir 100 % de la capacité."
references:
  - title: Add execution blocks
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/working-with-rs-execution-blocks.html
  - title: Region switch in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/region-switch.html
