id: sapc03-4a-assessment-business-case
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company plans to exit two colocation data centers whose contracts end in 14 months. The infrastructure team has an RVTools export of its 1,800 VMware virtual machines and a CMDB extract that maps each server to a business owner. The CFO asks for a directional total cost of ownership (TCO) business case within two weeks. The business case must compare current costs with Amazon EC2 costs, including Savings Plans pricing and the Microsoft SQL Server licensing options. The security team does not allow any new software to be installed in the data centers for this first estimate.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une entreprise industrielle prévoit de quitter deux centres de données en colocation dont les contrats se terminent dans 14 mois. L'équipe d'infrastructure dispose d'un export RVTools de ses 1 800 machines virtuelles VMware et d'un extrait de la CMDB qui associe chaque serveur à un responsable métier. Le directeur financier demande sous deux semaines une analyse de rentabilité (business case) indicative du coût total de possession (TCO). Elle doit comparer les coûts actuels aux coûts Amazon EC2, y compris la tarification Savings Plans et les options de licence Microsoft SQL Server. L'équipe de sécurité n'autorise l'installation d'aucun nouveau logiciel dans les centres de données pour cette première estimation.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text:
        en: "Install the AWS Application Discovery Service agent on every virtual machine, collect performance data for 30 days in AWS Migration Hub, and export it to Amazon S3 for analysis with Amazon Athena."
        fr: "Installer l'agent AWS Application Discovery Service sur chaque machine virtuelle, collecter les données de performance pendant 30 jours dans AWS Migration Hub et les exporter vers Amazon S3 pour les analyser avec Amazon Athena."
    - id: b
      text:
        en: "Upload the RVTools export to Amazon S3, map each virtual machine to an EC2 instance type with AWS Glue jobs and Amazon Athena queries, and price the result manually in the AWS Pricing Calculator."
        fr: "Charger l'export RVTools dans Amazon S3, associer chaque machine virtuelle à un type d'instance EC2 avec des tâches AWS Glue et des requêtes Amazon Athena, puis chiffrer manuellement le résultat dans AWS Pricing Calculator."
    - id: c
      text:
        en: "Upload the RVTools export and the CMDB extract to an AWS Transform migration assessment, set the pricing model and SQL Server licensing assumptions, and generate the TCO business case."
        fr: "Charger l'export RVTools et l'extrait de la CMDB dans une évaluation de migration AWS Transform, définir les hypothèses de modèle de tarification et de licence SQL Server, puis générer l'analyse de rentabilité TCO."
    - id: d
      text:
        en: "Deploy the AWS Transform discovery tool as an OVA on vCenter, configure WinRM and SSH credentials for every server, and generate the business case after 30 days of collection."
        fr: "Déployer l'outil de découverte AWS Transform sous forme d'OVA sur vCenter, configurer des informations d'identification WinRM et SSH pour chaque serveur, puis générer l'analyse de rentabilité après 30 jours de collecte."
answer: { optionId: c }
explanation:
  correct:
    en: "An AWS Transform migration assessment accepts RVTools and CMDB exports and generates a TCO business case in minutes, with EC2 recommendations, On-Demand, Reserved Instances or Savings Plans pricing, and SQL Server licensing analysis. Nothing is installed on premises, and the assumptions can be refined through chat."
    fr: "Une évaluation de migration AWS Transform accepte les exports RVTools et CMDB et génère en quelques minutes une analyse de rentabilité TCO, avec des recommandations EC2, une tarification On-Demand, instances réservées ou Savings Plans et une analyse des licences SQL Server. Rien n'est installé sur site, et les hypothèses peuvent être affinées par le chat."
  options:
    a: { en: "It installs software on every server, takes longer than two weeks, and AWS Application Discovery Service and AWS Migration Hub are no longer open to new customers.", fr: "Cette solution installe un logiciel sur chaque serveur, prend plus de deux semaines, et AWS Application Discovery Service et AWS Migration Hub ne sont plus ouverts aux nouveaux clients." }
    b: { en: "It could produce an estimate, but building the mapping and pricing 1,800 servers by hand is far more effort than a generated assessment, and it does not analyze SQL Server licensing.", fr: "Cette solution pourrait produire une estimation, mais construire la correspondance et chiffrer 1 800 serveurs à la main demande bien plus d'effort qu'une évaluation générée, et elle n'analyse pas les licences SQL Server." }
    d: { en: "The discovery tool is an appliance installed in the data center, which the security team forbids for this estimate, and 30 days of collection misses the two-week deadline.", fr: "L'outil de découverte est une appliance installée dans le centre de données, ce que l'équipe de sécurité interdit pour cette estimation, et 30 jours de collecte dépassent le délai de deux semaines." }
references:
  - title: Migration assessments
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html
