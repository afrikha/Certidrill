id: sapc03-4c-fis-target-filters
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company is writing an AWS FIS experiment template that stops Amazon EC2 instances to test the resilience of its card authorization tier in us-east-1. To limit the blast radius, the experiment must act only on instances that are tagged app=card-auth, that are in the us-east-1a Availability Zone, that are in the running state, and that belong to both the security group sg-0aa11 (payments) and the security group sg-0bb22 (PCI zone). Other instances in the same Availability Zone belong to only one of the two security groups. Each run must stop a random 25 % of the matching instances, so that the number adapts as the fleet grows.

    Which target definition will meet these requirements?
  fr: |
    Une société de paiement rédige un modèle d'expérience AWS FIS qui arrête des instances Amazon EC2 pour tester la résilience de son niveau d'autorisation des cartes dans us-east-1. Pour limiter le rayon d'impact, l'expérience ne doit agir que sur les instances balisées app=card-auth, situées dans la zone de disponibilité us-east-1a, à l'état running, et qui appartiennent à la fois au groupe de sécurité sg-0aa11 (paiements) et au groupe de sécurité sg-0bb22 (zone PCI). D'autres instances de la même zone n'appartiennent qu'à l'un des deux groupes de sécurité. Chaque exécution doit arrêter 25 % des instances correspondantes choisies au hasard, pour que le nombre s'adapte à la croissance de la flotte.

    Quelle définition de cible répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "resourceTags app=card-auth; filters on Placement.AvailabilityZone, on State.Name, and one filter on NetworkInterfaces.Groups.GroupId with both security group IDs as values; selectionMode PERCENT(25)."
        fr: "resourceTags app=card-auth ; filtres sur Placement.AvailabilityZone, sur State.Name, et un seul filtre sur NetworkInterfaces.Groups.GroupId avec les deux ID de groupes de sécurité comme valeurs ; selectionMode PERCENT(25)."
    - id: b
      text:
        en: "resourceArns listing the current instances of the tier and resourceTags app=card-auth; filters on Placement.AvailabilityZone and on State.Name; selectionMode PERCENT(25)."
        fr: "resourceArns qui liste les instances actuelles du niveau et resourceTags app=card-auth ; filtres sur Placement.AvailabilityZone et sur State.Name ; selectionMode PERCENT(25)."
    - id: c
      text:
        en: "resourceTags app=card-auth; filters on Placement.AvailabilityZone, on State.Name, and two separate filters on NetworkInterfaces.Groups.GroupId with one security group ID each; selectionMode COUNT(25)."
        fr: "resourceTags app=card-auth ; filtres sur Placement.AvailabilityZone, sur State.Name, et deux filtres distincts sur NetworkInterfaces.Groups.GroupId avec un ID de groupe de sécurité chacun ; selectionMode COUNT(25)."
    - id: d
      text:
        en: "resourceTags app=card-auth; filters on Placement.AvailabilityZone, on State.Name, and two separate filters on NetworkInterfaces.Groups.GroupId with one security group ID each; selectionMode PERCENT(25)."
        fr: "resourceTags app=card-auth ; filtres sur Placement.AvailabilityZone, sur State.Name, et deux filtres distincts sur NetworkInterfaces.Groups.GroupId avec un ID de groupe de sécurité chacun ; selectionMode PERCENT(25)."
answer: { optionId: d }
explanation:
  correct:
    en: "FIS combines separate filters with AND, but the values inside one filter with OR, so two filters with one security group each select only instances that belong to both groups. The tag, Availability Zone, and state conditions narrow the scope further, and PERCENT(25) acts on 25 % of the identified targets, chosen at random."
    fr: "FIS combine des filtres distincts par un ET, mais les valeurs d'un même filtre par un OU : deux filtres avec un groupe de sécurité chacun ne sélectionnent que les instances qui appartiennent aux deux groupes. Les conditions de balise, de zone de disponibilité et d'état réduisent encore la portée, et PERCENT(25) agit sur 25 % des cibles identifiées, choisies au hasard."
  options:
    a: { en: "Several values in one filter match any one of them, so instances in only one of the two security groups would also be targeted.", fr: "Plusieurs valeurs dans un même filtre correspondent à l'une quelconque d'entre elles : des instances d'un seul des deux groupes de sécurité seraient aussi ciblées." }
    b: { en: "A target can't combine resource IDs with tags or filters, and a fixed list of ARNs doesn't adapt as the fleet grows.", fr: "Une cible ne peut pas combiner des ID de ressources avec des balises ou des filtres, et une liste fixe d'ARN ne s'adapte pas à la croissance de la flotte." }
    c: { en: "COUNT(25) acts on 25 instances chosen at random, not on 25 % of the matching instances.", fr: "COUNT(25) agit sur 25 instances choisies au hasard, et non sur 25 % des instances correspondantes." }
references:
  - title: Targets for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/targets.html
