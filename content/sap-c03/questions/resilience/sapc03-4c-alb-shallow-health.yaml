id: sapc03-4c-alb-shallow-health
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company runs a stateless web application on Amazon EC2 instances in an Auto Scaling group that spans three Availability Zones behind an Application Load Balancer. The Auto Scaling group uses the ELB health check type. The target group health check calls a /health page that opens a connection to the Aurora cluster and calls a third-party tax API, and the page returns HTTP 500 if either call fails. Last month the tax API was unavailable for 20 minutes. Every target failed its health check, the Auto Scaling group terminated and replaced instances in waves, and the new instances also failed, so pages that don't need tax calculation were unavailable for 40 minutes. The company still wants an instance to be replaced when its own application process is broken. A failure of a shared dependency must not remove capacity, and the operations team must still be alerted when a dependency fails.

    Which solution will meet these requirements?
  fr: |
    Une société SaaS exécute une application web sans état sur des instances Amazon EC2 dans un groupe Auto Scaling réparti sur trois zones de disponibilité derrière un Application Load Balancer. Le groupe Auto Scaling utilise le type de vérification de l'état ELB. La vérification de l'état du groupe cible appelle une page /health qui ouvre une connexion au cluster Aurora et appelle une API fiscale tierce, et la page renvoie HTTP 500 si l'un des appels échoue. Le mois dernier, l'API fiscale a été indisponible pendant 20 minutes. Toutes les cibles ont échoué à leur vérification, le groupe Auto Scaling a résilié et remplacé les instances par vagues, et les nouvelles instances ont échoué elles aussi : les pages qui n'ont pas besoin du calcul de taxes ont été indisponibles pendant 40 minutes. L'entreprise veut toujours qu'une instance soit remplacée quand son propre processus applicatif est défaillant. La panne d'une dépendance partagée ne doit pas retirer de capacité, et l'équipe des opérations doit toujours être alertée quand une dépendance tombe en panne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Make the /health page check only the local application process, publish the status of each dependency as CloudWatch metrics with alarms, and disable only the features that need a failed dependency."
        fr: "Faire vérifier par la page /health uniquement le processus applicatif local, publier l'état de chaque dépendance sous forme de métriques CloudWatch avec des alarmes, et ne désactiver que les fonctionnalités qui ont besoin d'une dépendance défaillante."
    - id: b
      text:
        en: "Change the health check type of the Auto Scaling group to EC2, keep the existing /health page for the target group, and add CloudWatch alarms on the target group's UnHealthyHostCount metric."
        fr: "Passer le type de vérification de l'état du groupe Auto Scaling à EC2, conserver la page /health existante pour le groupe cible, et ajouter des alarmes CloudWatch sur la métrique UnHealthyHostCount du groupe cible."
    - id: c
      text:
        en: "Raise the target group's unhealthy threshold count to 10 and its health check interval to 300 seconds, so that a dependency outage of less than 50 minutes doesn't mark the targets unhealthy."
        fr: "Porter le seuil de défaillance du groupe cible à 10 et son intervalle de vérification à 300 secondes, pour qu'une panne de dépendance de moins de 50 minutes ne rende pas les cibles défectueuses."
    - id: d
      text:
        en: "Keep the existing /health page, because the Application Load Balancer fails open and routes requests to all targets when every target in the target group is unhealthy."
        fr: "Conserver la page /health existante, car l'Application Load Balancer échoue en mode ouvert (fail open) et achemine les requêtes vers toutes les cibles quand toutes les cibles du groupe sont défectueuses."
answer: { optionId: a }
explanation:
  correct:
    en: "A health check used for replacement should test what the instance controls, so a shared dependency failure no longer makes every target unhealthy and triggers replacements that can't help. Dependency health is better watched through separate metrics and alarms, while the application degrades gracefully by turning off only the features that need the failed dependency."
    fr: "Une vérification de l'état utilisée pour le remplacement doit tester ce que l'instance maîtrise : la panne d'une dépendance partagée ne rend plus toutes les cibles défectueuses et ne déclenche plus des remplacements inutiles. La santé des dépendances se surveille mieux par des métriques et des alarmes distinctes, pendant que l'application se dégrade proprement en désactivant seulement les fonctionnalités qui ont besoin de la dépendance défaillante."
  options:
    b: { en: "EC2 status checks don't detect a broken application process, so instances whose application has failed would no longer be replaced.", fr: "Les vérifications d'état EC2 ne détectent pas un processus applicatif défaillant : les instances dont l'application est en panne ne seraient plus remplacées." }
    c: { en: "This delays the detection of a genuinely broken instance by up to 50 minutes, and a longer dependency outage would still remove all capacity.", fr: "Cela retarde jusqu'à 50 minutes la détection d'une instance réellement défaillante, et une panne de dépendance plus longue retirerait toujours toute la capacité." }
    d: { en: "Fail-open keeps traffic flowing through the load balancer, but with the ELB health check type the Auto Scaling group still terminates the unhealthy instances, which caused the capacity churn.", fr: "Le mode fail open laisse passer le trafic par l'équilibreur de charge, mais avec le type de vérification ELB, le groupe Auto Scaling résilie toujours les instances défectueuses, ce qui a provoqué la perte de capacité." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
