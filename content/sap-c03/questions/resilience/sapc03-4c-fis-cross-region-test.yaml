id: sapc03-4c-fis-cross-region-test
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs a booking platform in us-east-1 with a warm standby in us-west-2. The VPCs of the two Regions are connected by transit gateway peering. Booking documents are copied to us-west-2 by S3 Cross-Region Replication, and session data is stored in an Amazon DynamoDB global table. The company's Regional failover runbook has never been tested under realistic conditions. The resilience team wants to cut application traffic from us-east-1 to us-west-2 and pause the S3 and DynamoDB replication from us-east-1, then measure how long the runbook takes to restore service in us-west-2. The test must stop automatically if the booking error rate in us-west-2 exceeds the SLO, and it must take the LEAST effort to build.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages exécute une plateforme de réservation dans us-east-1 avec une reprise de type warm standby dans us-west-2. Les VPC des deux Régions sont reliés par un peering de passerelles de transit. Les documents de réservation sont copiés vers us-west-2 par S3 Cross-Region Replication, et les données de session sont stockées dans une table globale Amazon DynamoDB. Le runbook de basculement régional de l'entreprise n'a jamais été testé dans des conditions réalistes. L'équipe résilience veut couper le trafic applicatif de us-east-1 vers us-west-2 et suspendre la réplication S3 et DynamoDB depuis us-east-1, puis mesurer le temps que met le runbook à rétablir le service dans us-west-2. Le test doit s'arrêter automatiquement si le taux d'erreur des réservations dans us-west-2 dépasse le SLO, et il doit demander le MOINS d'effort à construire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an experiment template from the FIS Cross-Region: Connectivity scenario in us-east-1, tag the transit gateway, subnets, bucket, and table, and add the booking error alarm as a stop condition."
        fr: "Créer un modèle d'expérience à partir du scénario FIS Cross-Region: Connectivity dans us-east-1, baliser la passerelle de transit, les sous-réseaux, le compartiment et la table, et ajouter l'alarme d'erreurs de réservation comme condition d'arrêt."
    - id: b
      text:
        en: "Create an experiment template from the FIS AZ Availability: Power Interruption scenario in us-east-1, target every Availability Zone of the Region, and keep the scenario's default stop conditions."
        fr: "Créer un modèle d'expérience à partir du scénario FIS AZ Availability: Power Interruption dans us-east-1, cibler toutes les zones de disponibilité de la Région, et conserver les conditions d'arrêt par défaut du scénario."
    - id: c
      text:
        en: "Create an FIS experiment template in us-east-1 with the aws:network:disrupt-connectivity action on the application subnets, and add the booking error alarm as a stop condition."
        fr: "Créer un modèle d'expérience FIS dans us-east-1 avec l'action aws:network:disrupt-connectivity sur les sous-réseaux applicatifs, et ajouter l'alarme d'erreurs de réservation comme condition d'arrêt."
    - id: d
      text:
        en: "Write an AWS Systems Manager Automation runbook that removes the transit gateway peering routes, disables the replication rule, and removes the us-west-2 replica, with a CloudWatch alarm that triggers rollback."
        fr: "Écrire un runbook AWS Systems Manager Automation qui supprime les itinéraires du peering de passerelles de transit, désactive la règle de réplication et supprime le réplica us-west-2, avec une alarme CloudWatch qui déclenche le retour arrière."
answer: { optionId: a }
explanation:
  correct:
    en: "The Cross-Region: Connectivity scenario blocks application traffic from the experiment Region to the destination Region, including transit gateway and cross-Region peering traffic, and pauses S3 replication and DynamoDB global table replication for tagged resources. The scenario doesn't include stop conditions, so the team adds its own CloudWatch alarm to halt the experiment when the error rate breaches the SLO."
    fr: "Le scénario Cross-Region: Connectivity bloque le trafic applicatif de la Région de l'expérience vers la Région de destination, y compris le trafic par passerelle de transit et par peering inter-Régions, et suspend la réplication S3 et celle des tables globales DynamoDB pour les ressources balisées. Le scénario n'inclut pas de condition d'arrêt : l'équipe ajoute sa propre alarme CloudWatch pour arrêter l'expérience quand le taux d'erreur dépasse le SLO."
  options:
    b: { en: "The AZ power interruption scenario simulates the loss of zones inside one Region; it doesn't pause cross-Region replication, and no scenario stop condition is tied to the booking SLO.", fr: "Le scénario de coupure de courant simule la perte de zones dans une Région ; il ne suspend pas la réplication inter-Régions, et aucune condition d'arrêt du scénario n'est liée au SLO des réservations." }
    c: { en: "A subnet connectivity disruption alone doesn't pause S3 Cross-Region Replication or the DynamoDB global table replication that the test requires.", fr: "Une perturbation de la connectivité des sous-réseaux ne suspend pas à elle seule la réplication S3 Cross-Region Replication ni la réplication de la table globale DynamoDB exigées par le test." }
    d: { en: "A custom runbook takes more effort to build, and removing the replica is destructive instead of a reversible pause.", fr: "Un runbook personnalisé demande plus d'effort à construire, et supprimer le réplica est destructif au lieu d'être une suspension réversible." }
references:
  - title: "Cross-Region: Connectivity"
    url: https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html
