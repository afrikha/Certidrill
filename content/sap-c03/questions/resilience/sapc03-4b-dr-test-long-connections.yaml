id: sapc03-4b-dr-test-long-connections
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During a DR test, a company switched an ARC routing control so that Amazon Route 53 failover records direct clients to the Application Load Balancer (ALB) in the recovery Region. Route 53 began answering with the recovery Region within a minute. However, about 30 percent of requests kept reaching the ALB in the primary Region for almost an hour. The failover records have a TTL of 300 seconds, and the ALBs use the default HTTP client keepalive duration. Most clients are mobile apps that reuse persistent HTTP connections. The RTO is 15 minutes.

    What should the solutions architect change so that the next test meets the RTO?
  fr: |
    Lors d'un test de reprise, une entreprise a basculé un contrôle de routage ARC pour que les enregistrements de basculement Amazon Route 53 dirigent les clients vers l'Application Load Balancer (ALB) de la Région de reprise. Route 53 a commencé à répondre avec la Région de reprise en moins d'une minute. Pourtant, environ 30 % des requêtes ont continué d'atteindre l'ALB de la Région principale pendant près d'une heure. Les enregistrements de basculement ont un TTL de 300 secondes, et les ALB utilisent la durée keepalive du client HTTP par défaut. La plupart des clients sont des applications mobiles qui réutilisent des connexions HTTP persistantes. Le RTO est de 15 minutes.

    Que doit modifier l'architecte de solutions pour que le prochain test respecte le RTO ?
body:
  options:
    - id: a
      text: { en: "Reduce the request interval of the Route 53 health checks to 10 seconds and their failure threshold to 1 so that Route 53 detects the failure and answers with the recovery Region faster.", fr: "Réduire à 10 secondes l'intervalle de requête des vérifications de l'état Route 53 et à 1 leur seuil d'échec afin que Route 53 détecte la panne et réponde plus vite avec la Région de reprise." }
    - id: b
      text: { en: "Increase the deregistration delay of the target groups behind the primary ALB so that in-flight requests can finish before the targets are removed.", fr: "Augmenter le délai de désenregistrement des groupes cibles derrière l'ALB principal afin que les requêtes en cours puissent se terminer avant le retrait des cibles." }
    - id: c
      text: { en: "Replace the failover records with weighted records, and set the weight of the primary Region to 0 during a failover instead of switching the routing control.", fr: "Remplacer les enregistrements de basculement par des enregistrements pondérés, et mettre à 0 le poids de la Région principale lors d'un basculement au lieu de basculer le contrôle de routage." }
    - id: d
      text: { en: "Lower the TTL of the failover records to 60 seconds, and reduce the HTTP client keepalive duration of the primary ALB from its default of 3,600 seconds to about 300 seconds.", fr: "Abaisser à 60 secondes le TTL des enregistrements de basculement, et réduire la durée keepalive du client HTTP de l'ALB principal de 3 600 secondes par défaut à environ 300 secondes." }
answer: { optionId: d }
explanation:
  correct:
    en: "A DNS change affects only new connections: clients with open connections keep using the old Region until the connection closes, and the ALB HTTP client keepalive duration defaults to 3,600 seconds, which explains the hour-long tail. AWS recommends a low TTL (60 or 120 seconds) on health-checked failover records and a keepalive duration aligned with the recovery time goal, for example 300 seconds."
    fr: "Une modification DNS n'affecte que les nouvelles connexions : les clients aux connexions ouvertes continuent d'utiliser l'ancienne Région jusqu'à leur fermeture, et la durée keepalive du client HTTP d'un ALB vaut 3 600 secondes par défaut, ce qui explique la traîne d'une heure. AWS recommande un TTL faible (60 ou 120 secondes) sur les enregistrements de basculement surveillés et une durée keepalive alignée sur l'objectif de temps de reprise, par exemple 300 secondes."
  options:
    a:
      en: "Route 53 already answered with the recovery Region within a minute; faster health checks do not close the persistent connections that kept reaching the primary ALB."
      fr: "Route 53 répondait déjà avec la Région de reprise en moins d'une minute ; des vérifications plus rapides ne ferment pas les connexions persistantes qui continuaient d'atteindre l'ALB principal."
    b:
      en: "Deregistration delay applies when targets are removed from a target group; it does not close client connections to the ALB, and a longer delay keeps old connections even longer."
      fr: "Le délai de désenregistrement s'applique au retrait de cibles d'un groupe cible ; il ne ferme pas les connexions des clients à l'ALB, et un délai plus long garde les anciennes connexions encore plus longtemps."
    c:
      en: "Weighted records are still DNS answers subject to the same TTL and persistent connections, and changing weights is a control plane operation that is less reliable than a routing control."
      fr: "Les enregistrements pondérés restent des réponses DNS soumises au même TTL et aux mêmes connexions persistantes, et modifier des poids est une opération du plan de contrôle moins fiable qu'un contrôle de routage."
references:
  - title: Best practices for routing control in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/route53-arc-best-practices.regional.html
