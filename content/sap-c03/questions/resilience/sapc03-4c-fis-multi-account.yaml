id: sapc03-4c-fis-multi-account
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company runs its streaming platform across three AWS accounts: a web account, an API account, and a data account. A central resilience account must run a single AWS FIS experiment that injects faults into resources in all three accounts at the same time and centralizes the experiment logs. In the workload accounts, FIS must be able to act only on behalf of experiments that belong to the resilience account. The experiment must stop automatically when the combined error rate of the three accounts exceeds 2 %, and the error metrics stay in each workload account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute sa plateforme de streaming dans trois comptes AWS : un compte web, un compte API et un compte de données. Un compte central de résilience doit exécuter une expérience AWS FIS unique qui injecte des pannes dans les ressources des trois comptes en même temps et centralise les journaux de l'expérience. Dans les comptes de charge de travail, FIS ne doit pouvoir agir que pour le compte d'expériences appartenant au compte de résilience. L'expérience doit s'arrêter automatiquement quand le taux d'erreur combiné des trois comptes dépasse 2 %, et les métriques d'erreur restent dans chaque compte de charge de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a multi-account template in the resilience account with a target account configuration per account. Have the target roles trust the orchestrator role with an sts:ExternalId condition on its experiment ARNs, and use a metric math alarm on shared metrics as the stop condition."
        fr: "Créer un modèle multicompte dans le compte de résilience avec une configuration de compte cible par compte. Faire approuver le rôle orchestrateur par les rôles cibles avec une condition sts:ExternalId sur ses ARN d'expérience, et utiliser comme condition d'arrêt une alarme metric math sur des métriques partagées."
    - id: b
      text:
        en: "Create a multi-account template in the resilience account with a target account configuration per account. Have the target roles trust the fis.amazonaws.com service principal directly, and reference the alarm of each workload account as a stop condition."
        fr: "Créer un modèle multicompte dans le compte de résilience avec une configuration de compte cible par compte. Faire approuver directement le principal de service fis.amazonaws.com par les rôles cibles, et référencer l'alarme de chaque compte de charge de travail comme condition d'arrêt."
    - id: c
      text:
        en: "Create one experiment template in each workload account with a local error alarm as the stop condition. Start the three experiments at the same time from an AWS Step Functions workflow in the resilience account."
        fr: "Créer un modèle d'expérience dans chaque compte de charge de travail avec une alarme d'erreur locale comme condition d'arrêt. Démarrer les trois expériences en même temps depuis un flux AWS Step Functions du compte de résilience."
    - id: d
      text:
        en: "Create a multi-account template in the resilience account with a target account configuration per account. Have the target roles trust the whole resilience account without conditions, and use a metric math alarm on shared metrics as the stop condition."
        fr: "Créer un modèle multicompte dans le compte de résilience avec une configuration de compte cible par compte. Faire approuver tout le compte de résilience par les rôles cibles sans condition, et utiliser comme condition d'arrêt une alarme metric math sur des métriques partagées."
answer: { optionId: a }
explanation:
  correct:
    en: "Multi-account experiments use role chaining: FIS assumes the orchestrator role, which assumes the role named in each target account configuration. The target role trust policy allows the orchestrator role, and an sts:ExternalId condition on the experiment ARNs of the orchestrator account ensures that only its experiments can use the role. The workload accounts share their metrics with the orchestrator account so that a metric math alarm can combine them as a stop condition."
    fr: "Les expériences multicomptes utilisent le chaînage de rôles : FIS assume le rôle orchestrateur, qui assume le rôle indiqué dans chaque configuration de compte cible. La politique d'approbation du rôle cible autorise le rôle orchestrateur, et une condition sts:ExternalId sur les ARN d'expérience du compte orchestrateur garantit que seules ses expériences peuvent utiliser le rôle. Les comptes de charge de travail partagent leurs métriques avec le compte orchestrateur pour qu'une alarme metric math les combine comme condition d'arrêt."
  options:
    b: { en: "Target roles are assumed by the orchestrator role, not directly by FIS, and the alarms must be shared with the orchestrator account to combine them into one stop condition.", fr: "Les rôles cibles sont assumés par le rôle orchestrateur, pas directement par FIS, et les alarmes doivent être partagées avec le compte orchestrateur pour être combinées en une seule condition d'arrêt." }
    c: { en: "Three separate experiments aren't one experiment with central logs, and each local alarm sees only one account instead of the combined error rate.", fr: "Trois expériences distinctes ne forment pas une expérience unique avec des journaux centralisés, et chaque alarme locale ne voit qu'un compte au lieu du taux d'erreur combiné." }
    d: { en: "Trusting the whole account without the external ID and principal ARN conditions lets any principal or experiment of that account use the roles.", fr: "Approuver tout le compte sans les conditions d'ID externe et d'ARN de principal permet à n'importe quel principal ou expérience de ce compte d'utiliser les rôles." }
references:
