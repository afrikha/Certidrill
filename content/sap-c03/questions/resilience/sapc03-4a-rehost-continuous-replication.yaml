id: sapc03-4a-rehost-continuous-replication
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company must migrate 350 Windows and Linux servers from VMware and from physical hosts to Amazon EC2 within six months, because its data center lease expires. Most applications are commercial products whose vendors support them only if the application code and the operating system stay unchanged. Each application can tolerate at most one hour of downtime at cutover. The company wants to validate every server with test launches in AWS before its cutover. The migration team is small and wants to minimize manual work.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique doit migrer 350 serveurs Windows et Linux, hébergés sur VMware et sur des hôtes physiques, vers Amazon EC2 en six mois, car le bail de son centre de données expire. La plupart des applications sont des produits commerciaux que leurs éditeurs ne prennent en charge que si le code applicatif et le système d'exploitation restent inchangés. Chaque application tolère au maximum une heure d'interruption lors du basculement (cutover). L'entreprise veut valider chaque serveur par des lancements de test dans AWS avant son basculement. L'équipe de migration est réduite et veut limiter le travail manuel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Export each virtual machine as an OVA image to Amazon S3, import it with VM Import/Export, and copy the data changed since the export with rsync and robocopy during the cutover window."
        fr: "Exporter chaque machine virtuelle sous forme d'image OVA dans Amazon S3, l'importer avec VM Import/Export, puis copier les données modifiées depuis l'export avec rsync et robocopy pendant la fenêtre de basculement."
    - id: b
      text:
        en: "Plan the waves in AWS Transform and rehost the servers with AWS Transform MGN: replicate them continuously at block level with the AWS Replication Agent, launch test instances, then launch cutover instances."
        fr: "Planifier les vagues dans AWS Transform et réhéberger les serveurs avec AWS Transform MGN : les répliquer en continu au niveau des blocs avec l'agent de réplication AWS (AWS Replication Agent), lancer des instances de test, puis des instances de basculement."
    - id: c
      text:
        en: "Rebuild each server on Amazon EC2 from the vendor installation media with AWS Systems Manager Automation runbooks, restore the configuration from backups, and migrate the application data with AWS DataSync during a weekend cutover."
        fr: "Reconstruire chaque serveur sur Amazon EC2 à partir des supports d'installation des éditeurs avec des runbooks AWS Systems Manager Automation, restaurer la configuration à partir des sauvegardes, puis migrer les données applicatives avec AWS DataSync lors d'un basculement le week-end."
    - id: d
      text:
        en: "Containerize each application with the AWS Transform source code containerization capability, deploy the containers to Amazon ECS on AWS Fargate, and switch DNS to the new services."
        fr: "Conteneuriser chaque application avec la fonctionnalité de conteneurisation du code source d'AWS Transform, déployer les conteneurs sur Amazon ECS avec AWS Fargate, puis basculer le DNS vers les nouveaux services."
answer: { optionId: b }
explanation:
  correct:
    en: "Rehosting with AWS Transform MGN keeps the operating system and the application unchanged. The AWS Replication Agent replicates disks continuously at block level, test instances validate each server before cutover, and only the last changes remain at cutover, which keeps downtime short."
    fr: "Le réhébergement avec AWS Transform MGN conserve le système d'exploitation et l'application à l'identique. L'agent de réplication AWS réplique les disques en continu au niveau des blocs, des instances de test valident chaque serveur avant le basculement, et seules les dernières modifications restent à appliquer au basculement, ce qui limite l'interruption."
  options:
    a: { en: "Image exports and manual delta copies for 350 servers are labor-intensive, and changes between export and cutover make the one-hour window hard to meet.", fr: "Des exports d'images et des copies manuelles des écarts pour 350 serveurs demandent beaucoup de travail, et les modifications entre l'export et le basculement rendent la fenêtre d'une heure difficile à tenir." }
    c: { en: "Reinstalling every server is a rebuild, not a rehost, requires a lot of manual work and risks configuration drift that the vendors do not support.", fr: "Réinstaller chaque serveur est une reconstruction et non un réhébergement ; cela demande beaucoup de travail manuel et risque des écarts de configuration que les éditeurs ne prennent pas en charge." }
    d: { en: "Containerization needs the application source code and changes the platform, which commercial products and their vendor support do not allow.", fr: "La conteneurisation exige le code source de l'application et change la plateforme, ce que les produits commerciaux et le support de leurs éditeurs ne permettent pas." }
references:
  - title: Migrate servers
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-migrate-servers.html
