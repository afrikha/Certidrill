id: sapc03-4c-r53-invert-test
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company serves a public claims API from two AWS Regions. Amazon Route 53 failover records route traffic to the primary Region, and the primary record is associated with an endpoint health check. Regulators require a quarterly test that shows that the secondary Region can take all production traffic, with the time until client traffic arrives in the secondary Region measured by CloudWatch Synthetics canaries. The test must not stop, modify, or degrade any resource in the primary Region, and the DNS records must not be edited. The operations team must be able to end the test and return traffic to the primary Region in one action.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance sert une API publique de déclarations de sinistres depuis deux Régions AWS. Des enregistrements de basculement Amazon Route 53 acheminent le trafic vers la Région principale, et l'enregistrement principal est associé à une vérification de l'état du point de terminaison. Les régulateurs exigent un test trimestriel qui montre que la Région secondaire peut prendre tout le trafic de production, le délai jusqu'à l'arrivée du trafic client dans la Région secondaire étant mesuré par des canaris CloudWatch Synthetics. Le test ne doit arrêter, modifier ni dégrader aucune ressource de la Région principale, et les enregistrements DNS ne doivent pas être modifiés. L'équipe des opérations doit pouvoir terminer le test et ramener le trafic vers la Région principale en une seule action.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Disable the primary health check at the start of the test window, measure the arrival of traffic in the secondary Region with the canaries, and enable the health check again to end the test."
        fr: "Désactiver la vérification de l'état principale au début de la fenêtre de test, mesurer l'arrivée du trafic dans la Région secondaire avec les canaris, et réactiver la vérification pour terminer le test."
    - id: b
      text:
        en: "Turn on Invert health check status for the primary health check at the start of the test window, measure with the canaries, and turn the setting off to end the test."
        fr: "Activer « Inverser le statut de la vérification de l'état » (Invert health check status) sur la vérification de l'état principale au début de la fenêtre de test, mesurer avec les canaris, et désactiver ce paramètre pour terminer le test."
    - id: c
      text:
        en: "Run an AWS FIS experiment that stops the load balancer targets in the primary Region, measure with the canaries, and stop the experiment to restart the targets."
        fr: "Exécuter une expérience AWS FIS qui arrête les cibles de l'équilibreur de charge dans la Région principale, mesurer avec les canaris, et arrêter l'expérience pour redémarrer les cibles."
    - id: d
      text:
        en: "Replace the endpoint health check with a CloudWatch alarm-based health check, call SetAlarmState to put the alarm in ALARM for the test, and set it back to OK to end the test."
        fr: "Remplacer la vérification du point de terminaison par une vérification fondée sur une alarme CloudWatch, appeler SetAlarmState pour mettre l'alarme en ALARM pendant le test, et la remettre à OK pour terminer le test."
answer: { optionId: b }
explanation:
  correct:
    en: "Inverting the status of the primary health check makes Route 53 treat the healthy primary endpoint as unhealthy, so the failover records answer with the secondary Region without any change to resources or records. The canaries timestamp when client traffic reaches the secondary Region, and turning the setting off returns traffic to the primary Region in one action."
    fr: "Inverser l'état de la vérification principale fait considérer par Route 53 le point de terminaison principal sain comme défectueux : les enregistrements de basculement répondent avec la Région secondaire sans aucune modification des ressources ni des enregistrements. Les canaris horodatent l'arrivée du trafic client dans la Région secondaire, et désactiver ce paramètre ramène le trafic vers la Région principale en une seule action."
  options:
    a: { en: "Route 53 considers a disabled health check to be healthy, so the primary record keeps receiving traffic and no failover happens.", fr: "Route 53 considère une vérification désactivée comme saine : l'enregistrement principal continue de recevoir le trafic et aucun basculement n'a lieu." }
    c: { en: "Stopping the targets degrades resources in the primary Region, which the test rules forbid.", fr: "Arrêter les cibles dégrade des ressources de la Région principale, ce que les règles du test interdisent." }
    d: { en: "Route 53 monitors the alarm's data stream, so SetAlarmState can't force the health check status to change.", fr: "Route 53 surveille le flux de données de l'alarme : SetAlarmState ne peut pas forcer le changement d'état de la vérification." }
references:
  - title: Values that you specify when you create or update health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
  - title: How Amazon Route 53 determines whether a health check is healthy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
