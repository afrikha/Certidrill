id: sapc03-4c-policy-arn-selection
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company manages backups for its 40 AWS accounts only through backup policies in AWS Organizations. The current policy backs up every Amazon Aurora DB cluster daily with a 35-day retention. The data team now asks for hourly backups with a 14-day retention for three specific Aurora DB clusters in the analytics account. The other Aurora DB clusters in that account must keep only the daily backups. The cloud team wants to keep defining every backup plan centrally in backup policies.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias gère les sauvegardes de ses 40 comptes AWS uniquement par des politiques de sauvegarde d'AWS Organizations. La politique actuelle sauvegarde chaque jour tous les clusters de base de données Amazon Aurora avec une rétention de 35 jours. L'équipe de données demande maintenant des sauvegardes toutes les heures avec une rétention de 14 jours pour trois clusters Aurora précis du compte d'analyse. Les autres clusters Aurora de ce compte doivent conserver uniquement les sauvegardes quotidiennes. L'équipe cloud veut continuer à définir tous les plans de sauvegarde de façon centralisée dans des politiques de sauvegarde.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a new hourly plan to the backup policy, and list the ARNs of the three DB clusters in the selection of that plan."
        fr: "Ajouter un nouveau plan horaire à la politique de sauvegarde et indiquer les ARN des trois clusters dans la sélection de ce plan."
    - id: b
      text:
        en: "Tag the three DB clusters with a dedicated tag, and add a new hourly plan to the backup policy that selects resources by that tag."
        fr: "Baliser les trois clusters avec une balise dédiée et ajouter à la politique de sauvegarde un nouveau plan horaire qui sélectionne les ressources par cette balise."
    - id: c
      text:
        en: "Create a local hourly backup plan in the analytics account, and assign the three DB clusters to it by resource ARN."
        fr: "Créer un plan de sauvegarde horaire local dans le compte d'analyse et lui affecter les trois clusters par ARN de ressource."
    - id: d
      text:
        en: "Create a new hourly backup policy, and attach it directly to the three DB clusters instead of to the analytics account."
        fr: "Créer une nouvelle politique de sauvegarde horaire et l'attacher directement aux trois clusters plutôt qu'au compte d'analyse."
answer: { optionId: b }
explanation:
  correct:
    en: "Backup policies select resources by resource type or by tag, not by individual resource ARN. Tagging the three clusters and adding a tag-based hourly plan keeps everything in backup policies, and the other clusters remain only in the daily plan."
    fr: "Les politiques de sauvegarde sélectionnent les ressources par type de ressource ou par balise, pas par ARN de ressource individuel. Baliser les trois clusters et ajouter un plan horaire fondé sur la balise garde tout dans les politiques de sauvegarde, et les autres clusters restent uniquement dans le plan quotidien."
  options:
    a: { en: "A backup policy can't select an individual resource by its ARN; only a local backup plan can.", fr: "Une politique de sauvegarde ne peut pas sélectionner une ressource individuelle par son ARN ; seul un plan de sauvegarde local le peut." }
    c: { en: "A local plan would work technically, but it is defined in the account instead of centrally in a backup policy, which the cloud team wants to avoid.", fr: "Un plan local fonctionnerait techniquement, mais il est défini dans le compte et non de façon centralisée dans une politique de sauvegarde, ce que l'équipe cloud veut éviter." }
    d: { en: "Backup policies attach to the organization root, OUs, or accounts, not to individual resources.", fr: "Les politiques de sauvegarde s'attachent à la racine de l'organisation, à des OU ou à des comptes, pas à des ressources individuelles." }
references:
  - title: Managing AWS Backup resources across multiple AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
  - title: Backup policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup_syntax.html
