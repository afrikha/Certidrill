id: sapc03-4c-ami-recycle-bin
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company builds hardened, EBS-backed golden AMIs with EC2 Image Builder in a shared services account and shares them with 70 workload accounts. Last month, a cleanup script with a wrong filter deregistered 30 AMIs that were still in use and deleted their snapshots. The AMIs couldn't be recovered, and teams had to rebuild and reshare them. The company now requires that any AMI deregistered in the shared services account can be restored with the same sharing permissions for 21 days after deregistration, even if its snapshots were deleted. The solution must have the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un éditeur de logiciels crée des AMI de référence (golden AMI) renforcées et basées sur EBS avec EC2 Image Builder dans un compte de services partagés, et les partage avec 70 comptes de charge de travail. Le mois dernier, un script de nettoyage doté d'un mauvais filtre a désenregistré 30 AMI encore utilisées et supprimé leurs instantanés. Les AMI n'ont pas pu être récupérées, et les équipes ont dû les reconstruire et les partager à nouveau. L'entreprise exige désormais que toute AMI désenregistrée dans le compte de services partagés puisse être restaurée avec les mêmes autorisations de partage pendant 21 jours après son désenregistrement, même si ses instantanés ont été supprimés. La solution doit avoir la charge opérationnelle la PLUS FAIBLE.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a Recycle Bin retention rule for EBS-backed AMIs in the shared services account with a retention period of 21 days."
        fr: "Créer dans le compte de services partagés une règle de conservation de la Corbeille (Recycle Bin) pour les AMI basées sur EBS avec une période de conservation de 21 jours."
    - id: b
      text:
        en: "Create a Recycle Bin retention rule for EBS snapshots in the shared services account with a retention period of 7 days, to limit the cost of retained snapshots."
        fr: "Créer dans le compte de services partagés une règle de conservation de la Corbeille pour les instantanés EBS avec une période de conservation de 7 jours, pour limiter le coût des instantanés conservés."
    - id: c
      text:
        en: "Create a Recycle Bin retention rule for EBS snapshots in the shared services account with a retention period of 21 days."
        fr: "Créer dans le compte de services partagés une règle de conservation de la Corbeille pour les instantanés EBS avec une période de conservation de 21 jours."
    - id: d
      text:
        en: "Configure AMI deprecation 21 days after creation in the Image Builder distribution settings, so that old AMIs are hidden instead of deregistered."
        fr: "Configurer la dépréciation des AMI 21 jours après leur création dans les paramètres de distribution d'Image Builder, pour que les anciennes AMI soient masquées au lieu d'être désenregistrées."
    - id: e
      text:
        en: "Lock the snapshots of every golden AMI in governance mode for 21 days with Amazon EBS snapshot lock, so that the cleanup script can't delete them."
        fr: "Verrouiller les instantanés de chaque AMI de référence en mode gouvernance pendant 21 jours avec le verrouillage des instantanés Amazon EBS, pour que le script de nettoyage ne puisse pas les supprimer."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A Recycle Bin rule for AMIs keeps deregistered EBS-backed AMIs recoverable, and restored AMIs get their previous sharing permissions back. Before an AMI can be restored, all its snapshots must be restored from the Recycle Bin, so a snapshot rule with a retention equal to or longer than the AMI rule is also required."
    fr: "Une règle de la Corbeille pour les AMI garde récupérables les AMI basées sur EBS désenregistrées, et les AMI restaurées retrouvent leurs autorisations de partage. Avant de restaurer une AMI, il faut restaurer tous ses instantanés depuis la Corbeille : une règle pour les instantanés avec une conservation égale ou supérieure à celle de la règle des AMI est donc aussi nécessaire."
  options:
    b: { en: "If the snapshots leave the Recycle Bin before the AMI, the AMI is no longer recoverable after day 7.", fr: "Si les instantanés quittent la Corbeille avant l'AMI, l'AMI n'est plus récupérable après le septième jour." }
    d: { en: "Deprecation only marks an AMI as outdated; it doesn't prevent deregistration or make a deregistered AMI recoverable.", fr: "La dépréciation marque seulement une AMI comme obsolète ; elle n'empêche pas le désenregistrement et ne rend pas récupérable une AMI désenregistrée." }
    e: { en: "Snapshot lock prevents snapshot deletion, but the AMI itself can still be deregistered and can't be restored with its ID and sharing permissions.", fr: "Le verrouillage empêche la suppression des instantanés, mais l'AMI elle-même peut toujours être désenregistrée et ne peut pas être restaurée avec son ID et ses autorisations de partage." }
references:
  - title: Considerations for Recycle Bin
    url: https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin-factors.html
