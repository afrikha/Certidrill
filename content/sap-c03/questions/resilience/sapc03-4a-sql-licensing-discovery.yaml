id: sapc03-4a-sql-licensing-discovery
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company runs 220 Microsoft SQL Server instances on VMware. Some instances belong to Always On availability groups, and many run Enterprise edition even though they use few Enterprise features. Before the architects choose between Amazon RDS for SQL Server and SQL Server on Amazon EC2 for each workload, they need the number of databases on each instance, the availability group membership and the role of each replica. They also need a business case that compares License Included with bring-your-own-license options. The AWS Transform discovery tool is already deployed and connects to the Windows servers over WinRM with operating system credentials.

    Which additional step will meet these requirements?
  fr: |
    Une entreprise de santé exécute 220 instances Microsoft SQL Server sur VMware. Certaines instances appartiennent à des groupes de disponibilité Always On, et beaucoup utilisent l'édition Enterprise alors qu'elles utilisent peu de fonctionnalités Enterprise. Avant de choisir pour chaque charge de travail entre Amazon RDS for SQL Server et SQL Server sur Amazon EC2, les architectes ont besoin du nombre de bases de données de chaque instance, de l'appartenance aux groupes de disponibilité et du rôle de chaque réplica. Ils ont aussi besoin d'une analyse de rentabilité qui compare la licence incluse (License Included) aux options d'apport de licence. L'outil de découverte AWS Transform est déjà déployé et se connecte aux serveurs Windows par WinRM avec des informations d'identification du système d'exploitation.

    Quelle étape supplémentaire répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Install the AWS Application Discovery Service agent on each SQL Server host to report database metadata to AWS Migration Hub, and then export the data into the migration assessment."
        fr: "Installer l'agent AWS Application Discovery Service sur chaque hôte SQL Server pour remonter les métadonnées des bases vers AWS Migration Hub, puis exporter les données dans l'évaluation de migration."
    - id: b
      text:
        en: "Keep the current WinRM-only collection, which already reports availability group membership and replica roles, and upload the discovery export to an AWS Transform migration assessment."
        fr: "Conserver la collecte actuelle par WinRM seul, qui remonte déjà l'appartenance aux groupes de disponibilité et les rôles des réplicas, puis charger l'export de découverte dans une évaluation de migration AWS Transform."
    - id: c
      text:
        en: "Add SQL Server database credentials to the discovery tool so that it collects database counts, availability group membership and replica roles, then run a migration assessment with licensing analysis."
        fr: "Ajouter des informations d'identification de base SQL Server à l'outil de découverte pour qu'il collecte le nombre de bases, l'appartenance aux groupes de disponibilité et les rôles des réplicas, puis exécuter une évaluation de migration avec analyse des licences."
    - id: d
      text:
        en: "Run AWS DMS premigration assessments against each SQL Server instance to report the editions, the database counts and the availability group roles, and compare the licensing options in the AWS Pricing Calculator."
        fr: "Exécuter des évaluations préalables à la migration AWS DMS sur chaque instance SQL Server pour obtenir les éditions, le nombre de bases et les rôles des groupes de disponibilité, puis comparer les options de licence dans AWS Pricing Calculator."
answer: { optionId: c }
explanation:
  correct:
    en: "Over WinRM alone, the discovery tool detects SQL Server components from Windows; with SQL Server database credentials it also collects the database count, Always On availability group membership, cluster role and read-only replica status. A migration assessment then recommends RDS for SQL Server or SQL Server on EC2 with licensing analysis (License Included, BYOL or BYOM) and edition recommendations."
    fr: "Par WinRM seul, l'outil de découverte détecte les composants SQL Server depuis Windows ; avec des informations d'identification de base SQL Server, il collecte aussi le nombre de bases, l'appartenance aux groupes de disponibilité Always On, le rôle de cluster et l'état des réplicas en lecture seule. Une évaluation de migration recommande ensuite RDS for SQL Server ou SQL Server sur EC2, avec une analyse des licences (License Included, BYOL ou BYOM) et des recommandations d'édition."
  options:
    a: { en: "AWS Application Discovery Service and AWS Migration Hub are closed to new customers, and installing agents is unnecessary when the discovery tool can collect the metadata.", fr: "AWS Application Discovery Service et AWS Migration Hub sont fermés aux nouveaux clients, et installer des agents est inutile puisque l'outil de découverte peut collecter ces métadonnées." }
    b: { en: "Without database credentials the tool falls back to Windows-level detection, which does not report availability group membership or replica roles.", fr: "Sans informations d'identification de base, l'outil se replie sur une détection au niveau de Windows, qui ne remonte ni l'appartenance aux groupes de disponibilité ni les rôles des réplicas." }
    d: { en: "DMS premigration assessments check a configured migration task for issues; they do not inventory availability group roles, and the manual pricing produces no licensing analysis.", fr: "Les évaluations préalables AWS DMS vérifient les problèmes d'une tâche de migration configurée ; elles n'inventorient pas les rôles des groupes de disponibilité, et le chiffrage manuel ne produit aucune analyse des licences." }
references:
  - title: Data collection
    url: https://docs.aws.amazon.com/transform/latest/userguide/discovery-tool-data-collection.html
  - title: Migration assessments
    url: https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html
