id: sapc03-4b-eks-argocd-capability
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its order services on two Amazon EKS clusters: a primary cluster in the us-east-1 Region and a standby cluster in us-west-2. Engineers release changes by running Helm and kubectl commands against each cluster separately. During a failover test, the standby cluster was found to be two releases behind and missing a ConfigMap, and the failover failed. The company requires both clusters to be reconciled continuously to the same state declared in Git, with manual changes reverted automatically. The platform team does not want to install, patch or scale a GitOps controller itself, and access to the GitOps UI must use AWS IAM Identity Center.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute ses services de commandes sur deux clusters Amazon EKS : un cluster principal dans la Région us-east-1 et un cluster de secours dans us-west-2. Les ingénieurs publient les modifications en exécutant des commandes Helm et kubectl sur chaque cluster séparément. Lors d'un test de basculement, le cluster de secours avait deux versions de retard et il lui manquait une ConfigMap : le basculement a échoué. L'entreprise exige que les deux clusters soient réconciliés en continu avec le même état déclaré dans Git, et que les modifications manuelles soient annulées automatiquement. L'équipe plateforme ne veut ni installer, ni corriger, ni mettre à l'échelle elle-même un contrôleur GitOps, et l'accès à l'interface GitOps doit passer par AWS IAM Identity Center.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the EKS capability for Argo CD, register both clusters, and use an ApplicationSet that generates an Application for each cluster from the Git repository with automated sync and self-heal.", fr: "Créer la capacité EKS pour Argo CD, enregistrer les deux clusters, et utiliser un ApplicationSet qui génère une Application pour chaque cluster à partir du dépôt Git avec synchronisation automatique et auto-réparation (self-heal)." }
    - id: b
      text: { en: "Install open source Flux on each cluster with a Helm chart, point both installations to the Git repository, and upgrade the Flux controllers on both clusters during the monthly maintenance window.", fr: "Installer Flux open source sur chaque cluster avec un chart Helm, faire pointer les deux installations vers le dépôt Git, et mettre à niveau les contrôleurs Flux des deux clusters pendant la fenêtre de maintenance mensuelle." }
    - id: c
      text: { en: "Back up the primary cluster every night with AWS Backup, copy the recovery point to us-west-2, and restore it into the existing standby cluster every morning.", fr: "Sauvegarder chaque nuit le cluster principal avec AWS Backup, copier le point de récupération vers us-west-2, et le restaurer chaque matin dans le cluster de secours existant." }
    - id: d
      text: { en: "Create a pipeline in AWS CodePipeline that runs kubectl apply against both clusters on every commit to the Git repository, and require all changes to go through the pipeline.", fr: "Créer dans AWS CodePipeline un pipeline qui exécute kubectl apply sur les deux clusters à chaque commit dans le dépôt Git, et exiger que toutes les modifications passent par le pipeline." }
answer: { optionId: a }
explanation:
  correct:
    en: "The EKS capability for Argo CD is fully managed by AWS, which handles scaling, patching and operations, and its UI integrates with IAM Identity Center. A single Argo CD instance can deploy to several clusters, and an ApplicationSet generates one Application per cluster; automated sync with self-heal reconciles each cluster to Git and reverts manual drift."
    fr: "La capacité EKS pour Argo CD est entièrement gérée par AWS, qui en assure la mise à l'échelle, les correctifs et l'exploitation, et son interface s'intègre à IAM Identity Center. Une seule instance Argo CD peut déployer vers plusieurs clusters, et un ApplicationSet génère une Application par cluster ; la synchronisation automatique avec auto-réparation réconcilie chaque cluster avec Git et annule les dérives manuelles."
  options:
    b:
      en: "Self-managed Flux works for GitOps, but the team would install, patch and scale the controllers itself, which the requirements exclude."
      fr: "Flux autogéré convient au GitOps, mais l'équipe installerait, corrigerait et mettrait à l'échelle elle-même les contrôleurs, ce que les exigences excluent."
    c:
      en: "A nightly restore is not continuous reconciliation, and an AWS Backup restore into an existing cluster skips objects that already exist instead of overwriting them."
      fr: "Une restauration nocturne n'est pas une réconciliation continue, et une restauration AWS Backup dans un cluster existant ignore les objets déjà présents au lieu de les écraser."
    d:
      en: "A push pipeline applies changes only when a commit happens; it does not detect or revert manual changes made directly on a cluster between commits."
      fr: "Un pipeline de type push n'applique les modifications qu'à chaque commit ; il ne détecte ni n'annule les modifications manuelles faites directement sur un cluster entre deux commits."
references:
  - title: Continuous Deployment with Argo CD
    url: https://docs.aws.amazon.com/eks/latest/userguide/argocd.html
  - title: Restore an Amazon EKS cluster
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restoring-eks.html
