id: sapc03-4a-strangler-data-sync
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank is using the strangler fig pattern to move features out of a monolith that runs on Amazon EC2 with an Amazon RDS for Oracle database. The new customer profile microservice now owns all profile updates and stores them in its own Amazon DynamoDB table. Several monolith reports still read the CUSTOMER table in the Oracle database every few minutes, and they will be migrated only in a later phase. The reports can tolerate data that is a few minutes old. The architects do not want the microservice to depend on the Oracle schema or to fail when the monolith database is unavailable.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise le modèle strangler fig pour sortir des fonctionnalités d'un monolithe qui s'exécute sur Amazon EC2 avec une base Amazon RDS for Oracle. Le nouveau microservice de profil client gère désormais toutes les mises à jour des profils et les stocke dans sa propre table Amazon DynamoDB. Plusieurs rapports du monolithe lisent toujours la table CUSTOMER de la base Oracle toutes les quelques minutes, et ils ne seront migrés que dans une phase ultérieure. Les rapports tolèrent des données vieilles de quelques minutes. Les architectes ne veulent pas que le microservice dépende du schéma Oracle ni qu'il échoue lorsque la base du monolithe est indisponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Make the microservice write each profile update to DynamoDB and to the Oracle CUSTOMER table in the same request through the Oracle driver, and return an error to the caller if either of the two writes fails."
        fr: "Faire écrire chaque mise à jour de profil par le microservice dans DynamoDB et dans la table Oracle CUSTOMER au sein de la même requête par le pilote Oracle, et renvoyer une erreur à l'appelant si l'une des deux écritures échoue."
    - id: b
      text:
        en: "Change the monolith reports to query the microservice's DynamoDB table directly through the AWS SDK, and drop the CUSTOMER table from the Oracle database."
        fr: "Modifier les rapports du monolithe pour qu'ils interrogent directement la table DynamoDB du microservice par le kit SDK AWS, puis supprimer la table CUSTOMER de la base Oracle."
    - id: c
      text:
        en: "Export the DynamoDB table to Amazon S3 every night, and load the exported files into the Oracle CUSTOMER table with a scheduled job before the business day starts."
        fr: "Exporter la table DynamoDB vers Amazon S3 chaque nuit, puis charger les fichiers exportés dans la table Oracle CUSTOMER par une tâche planifiée avant le début de la journée."
    - id: d
      text:
        en: "Make the microservice publish an event to an Amazon SQS queue for each profile update, and have a separate synchronizing function consume the queue and update the Oracle CUSTOMER table."
        fr: "Faire publier par le microservice un événement dans une file d'attente Amazon SQS pour chaque mise à jour de profil, et faire consommer la file par une fonction de synchronisation distincte qui met à jour la table Oracle CUSTOMER."
answer: { optionId: d }
explanation:
  correct:
    en: "During a strangler fig migration, the new service publishes an event to a queue on each update and a synchronizing agent applies it to the monolith's database. The microservice knows nothing about the Oracle schema, the queue buffers updates while the database is unavailable, and the reports get eventually consistent data within minutes."
    fr: "Pendant une migration strangler fig, le nouveau service publie un événement dans une file à chaque mise à jour, et un agent de synchronisation l'applique à la base du monolithe. Le microservice ignore tout du schéma Oracle, la file met les mises à jour en attente pendant l'indisponibilité de la base, et les rapports obtiennent des données cohérentes à terme en quelques minutes."
  options:
    a: { en: "Synchronous dual writes couple the microservice to the Oracle schema and make it fail whenever the monolith database is unavailable.", fr: "Des écritures doubles synchrones couplent le microservice au schéma Oracle et le font échouer chaque fois que la base du monolithe est indisponible." }
    b: { en: "This changes the reports now, although they are migrated only in a later phase, and couples them to the microservice's private table.", fr: "Cette solution modifie les rapports dès maintenant, alors qu'ils ne seront migrés que plus tard, et les couple à la table privée du microservice." }
    c: { en: "A nightly load gives data up to a day old, but the reports need data that is only minutes old.", fr: "Un chargement nocturne fournit des données vieilles d'un jour, alors que les rapports ont besoin de données vieilles de quelques minutes seulement." }
references:
  - title: Strangler fig pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/strangler-fig.html
