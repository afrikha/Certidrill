id: sapc03-4b-drs-pit-ransomware
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company protects 60 on-premises servers with AWS Elastic Disaster Recovery (AWS DRS). The servers use the default point-in-time (PIT) policy, and replication has been healthy for months. At 14:00, security analysts discover that ransomware started encrypting files on the file servers and ERP servers at about 10:30 the same day. Because replication was healthy, the encrypted blocks were also replicated to AWS. The company must recover the affected servers on AWS with the least possible data loss. The recovered data must be guaranteed to predate the attack.

    What should the solutions architect do?
  fr: |
    Une entreprise de logistique protège 60 serveurs sur site avec AWS Elastic Disaster Recovery (AWS DRS). Les serveurs utilisent la politique par défaut d'instantanés à un moment donné (PIT), et la réplication est saine depuis des mois. À 14 h 00, les analystes de sécurité découvrent qu'un rançongiciel a commencé à chiffrer des fichiers sur les serveurs de fichiers et les serveurs ERP vers 10 h 30 le même jour. Comme la réplication était saine, les blocs chiffrés ont aussi été répliqués vers AWS. L'entreprise doit récupérer les serveurs touchés sur AWS avec la plus faible perte de données possible. Les données récupérées doivent dater de façon certaine d'avant l'attaque.

    Que doit faire l'architecte de solutions ?
body:
  options:
    - id: a
      text: { en: "Initiate a recovery job with the Use most recent data option, and then restore the encrypted files from the most recent versions stored in Amazon S3.", fr: "Lancer une tâche de reprise avec l'option Use most recent data, puis restaurer les fichiers chiffrés à partir des versions les plus récentes stockées dans Amazon S3." }
    - id: b
      text: { en: "Initiate a recovery job for the affected servers and select the hourly PIT snapshot taken at 10:00, before the encryption started.", fr: "Lancer une tâche de reprise pour les serveurs touchés et sélectionner l'instantané PIT horaire pris à 10 h 00, avant le début du chiffrement." }
    - id: c
      text: { en: "Increase the PIT snapshot retention to 365 days, and initiate a recovery job from the oldest daily PIT snapshot to be sure the data predates the attack.", fr: "Porter la rétention des instantanés PIT à 365 jours, et lancer une tâche de reprise depuis l'instantané PIT quotidien le plus ancien pour être sûr que les données datent d'avant l'attaque." }
    - id: d
      text: { en: "Disconnect the source servers, reinstall the AWS Replication Agent to force a full resynchronization, and initiate a recovery job when the initial sync completes.", fr: "Déconnecter les serveurs sources, réinstaller l'AWS Replication Agent pour forcer une resynchronisation complète, et lancer une tâche de reprise une fois la synchronisation initiale terminée." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS DRS keeps crash-consistent PIT snapshots: by default one every 10 minutes for the last hour, one every hour for the last 24 hours and one per day for 7 days. At 14:00 the 10-minute snapshots only cover 13:00 to 14:00, after the attack began, so the hourly snapshot from 10:00 is the most recent point that is certain to predate the encryption."
    fr: "AWS DRS conserve des instantanés PIT cohérents après plantage : par défaut un toutes les 10 minutes sur la dernière heure, un par heure sur les dernières 24 heures et un par jour sur 7 jours. À 14 h 00, les instantanés de 10 minutes ne couvrent que 13 h 00 à 14 h 00, après le début de l'attaque : l'instantané horaire de 10 h 00 est le point le plus récent dont on est sûr qu'il précède le chiffrement."
  options:
    a:
      en: "The most recent data contains the encrypted blocks, and the scenario states no S3 copy of the files that could repair them."
      fr: "Les données les plus récentes contiennent les blocs chiffrés, et le scénario ne mentionne aucune copie S3 des fichiers qui permettrait de les réparer."
    c:
      en: "Raising the retention does not create older snapshots, and recovering from a days-old snapshot loses far more data than the 10:00 snapshot."
      fr: "Augmenter la rétention ne crée pas d'instantanés plus anciens, et reprendre depuis un instantané vieux de plusieurs jours perd bien plus de données que l'instantané de 10 h 00."
    d:
      en: "A full resynchronization copies the current, encrypted disks again, so the recovered servers would still contain the ransomware damage."
      fr: "Une resynchronisation complète recopie les disques actuels chiffrés : les serveurs récupérés contiendraient toujours les dégâts du rançongiciel."
references:
  - title: Elastic Disaster Recovery Concepts
    url: https://docs.aws.amazon.com/drs/latest/userguide/CloudEndure-Concepts.html
  - title: Point in time (PIT) policy
    url: https://docs.aws.amazon.com/drs/latest/userguide/point-in-time.html
