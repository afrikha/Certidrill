id: sapc03-4a-dms-reverse-fallback
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company is migrating its order database from on-premises MySQL to Amazon Aurora MySQL with an AWS DMS full load and CDC task. The change advisory board requires a fallback plan before it approves the cutover. For two weeks after cutover, if critical defects appear, the company must be able to switch the application back to the on-premises MySQL database. No transaction written to Aurora after cutover can be lost if the company falls back. Binary logging in row format can be enabled on the Aurora cluster.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution migre sa base de commandes de MySQL sur site vers Amazon Aurora MySQL avec une tâche AWS DMS de chargement complet et de CDC. Le comité consultatif des changements exige un plan de retour arrière avant d'approuver le basculement. Pendant deux semaines après le basculement, en cas de défauts critiques, l'entreprise doit pouvoir rebasculer l'application vers la base MySQL sur site. Aucune transaction écrite dans Aurora après le basculement ne doit être perdue en cas de retour arrière. La journalisation binaire au format ligne peut être activée sur le cluster Aurora.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "At cutover, stop the forward task and start a CDC-only DMS task from Aurora MySQL to the on-premises database from the Aurora binary log position recorded at cutover, and run it for two weeks."
        fr: "Au basculement, arrêter la tâche aller et démarrer une tâche DMS de CDC seule d'Aurora MySQL vers la base sur site à partir de la position du journal binaire Aurora relevée au basculement, puis l'exécuter pendant deux semaines."
    - id: b
      text:
        en: "Take a manual Aurora snapshot every hour after cutover, and if the company falls back, restore the latest snapshot to a new cluster and export its data to the on-premises database."
        fr: "Prendre un instantané manuel d'Aurora toutes les heures après le basculement et, en cas de retour arrière, restaurer le dernier instantané dans un nouveau cluster et exporter ses données vers la base sur site."
    - id: c
      text:
        en: "Keep the existing full load and CDC task running after cutover, and enable its data validation, so that DMS keeps the on-premises database and the Aurora cluster synchronized and verified during the two weeks."
        fr: "Laisser la tâche existante de chargement complet et de CDC s'exécuter après le basculement en activant sa validation des données, pour que DMS maintienne la base sur site et le cluster Aurora synchronisés et vérifiés pendant les deux semaines."
    - id: d
      text:
        en: "Export the Aurora tables to Amazon S3 every night after cutover, and if the company falls back, load the latest files into the on-premises database with LOAD DATA statements."
        fr: "Exporter chaque nuit les tables Aurora dans Amazon S3 après le basculement et, en cas de retour arrière, charger les derniers fichiers dans la base sur site avec des instructions LOAD DATA."
answer: { optionId: a }
explanation:
  correct:
    en: "A CDC-only task migrates ongoing changes to a target that already holds the data. Starting it from a native start point (the MySQL binary log file and position) recorded at cutover replicates every transaction written to Aurora back to the on-premises database, so a fallback loses nothing."
    fr: "Une tâche de CDC seule migre les modifications continues vers une cible qui contient déjà les données. La démarrer à partir d'un point de départ natif (fichier et position du journal binaire MySQL) relevé au basculement réplique chaque transaction écrite dans Aurora vers la base sur site : un retour arrière ne perd rien."
  options:
    b: { en: "Hourly snapshots lose up to an hour of transactions, and restoring and exporting them takes far longer than a switch back.", fr: "Des instantanés horaires perdent jusqu'à une heure de transactions, et les restaurer puis les exporter prend bien plus de temps qu'un rebasculement." }
    c: { en: "The existing task replicates only from on premises to Aurora, so writes made in Aurora after cutover never reach the on-premises database.", fr: "La tâche existante ne réplique que du site vers Aurora : les écritures faites dans Aurora après le basculement n'atteignent jamais la base sur site." }
    d: { en: "Nightly exports lose up to a day of transactions written to Aurora.", fr: "Des exports nocturnes perdent jusqu'à une journée de transactions écrites dans Aurora." }
references:
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
