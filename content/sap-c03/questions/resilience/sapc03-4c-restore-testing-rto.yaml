id: sapc03-4c-restore-testing-rto
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank protects Amazon RDS for SQL Server databases and Amazon EFS file systems in 12 production accounts with AWS Backup. Auditors now require monthly evidence that backups can be restored within the 4-hour target restore time and that each restored database contains readable tables. Today, an engineer restores one backup each quarter by hand, runs a few queries, and deletes the restored resources. The bank wants the recovery points to be chosen at random from the last 30 days, the restored resources to be kept only long enough for validation, and a compliance report that shows whether each restore met the 4-hour target. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une banque protège avec AWS Backup des bases de données Amazon RDS for SQL Server et des systèmes de fichiers Amazon EFS dans 12 comptes de production. Les auditeurs exigent désormais une preuve mensuelle que les sauvegardes peuvent être restaurées dans le délai cible de restauration de 4 heures et que chaque base restaurée contient des tables lisibles. Aujourd'hui, un ingénieur restaure une sauvegarde par trimestre à la main, exécute quelques requêtes et supprime les ressources restaurées. La banque veut que les points de récupération soient choisis au hasard parmi les 30 derniers jours, que les ressources restaurées ne soient conservées que le temps de la validation, et un rapport de conformité qui indique si chaque restauration a respecté la cible de 4 heures. La solution doit avoir la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Schedule an AWS Step Functions workflow that restores the latest recovery point of each resource, runs validation queries, deletes the resources, and stores durations in Amazon DynamoDB."
        fr: "Planifier un flux AWS Step Functions qui restaure le point de récupération le plus récent de chaque ressource, exécute des requêtes de validation, supprime les ressources et stocke les durées dans Amazon DynamoDB."
    - id: b
      text:
        en: "Create an AWS Backup Audit Manager framework with the restore time for resources meet target control set to 4 hours, and deliver its reports to Amazon S3 each month."
        fr: "Créer un cadre AWS Backup Audit Manager avec le contrôle de temps de restauration des ressources conforme à la cible réglé sur 4 heures, et livrer ses rapports dans Amazon S3 chaque mois."
    - id: c
      text:
        en: "Create AWS Backup restore testing plans with random recovery point selection and a short retention, validate with a Lambda function, and report with an Audit Manager restore time control."
        fr: "Créer des plans de test de restauration AWS Backup avec sélection aléatoire des points de récupération et une rétention courte, valider avec une fonction Lambda, et rendre compte avec un contrôle de temps de restauration d'Audit Manager."
    - id: d
      text:
        en: "Define an AWS Resilience Hub resiliency policy with a 4-hour RTO for each application, and run a monthly assessment that reports whether the backups meet the RTO."
        fr: "Définir dans AWS Resilience Hub une politique de résilience avec un RTO de 4 heures pour chaque application, et exécuter une évaluation mensuelle qui indique si les sauvegardes respectent le RTO."
answer: { optionId: c }
explanation:
  correct:
    en: "Restore testing plans run restore jobs on a schedule, can pick a random recovery point within a selection window, keep the restored resource for 1 to 168 hours for validation, record how long the restore took, and then delete the resource. Validation runs programmatically, for example from a Lambda function triggered by the restore job event, and the Backup Audit Manager restore time control evaluates whether restores completed within the target."
    fr: "Les plans de test de restauration exécutent des tâches de restauration selon un calendrier, peuvent choisir un point de récupération aléatoire dans une fenêtre de sélection, conservent la ressource restaurée de 1 à 168 heures pour la validation, enregistrent la durée de la restauration, puis suppriment la ressource. La validation s'exécute par programme, par exemple depuis une fonction Lambda déclenchée par l'événement de la tâche de restauration, et le contrôle de temps de restauration de Backup Audit Manager évalue si les restaurations se sont terminées dans la cible."
  options:
    a: { en: "A custom workflow adds code to build and maintain, and restoring only the latest recovery point doesn't meet the random selection requirement.", fr: "Un flux personnalisé ajoute du code à créer et à maintenir, et restaurer uniquement le point le plus récent ne respecte pas l'exigence de sélection aléatoire." }
    b: { en: "The Audit Manager control evaluates restore jobs that ran; on its own it doesn't run any restore or validate the restored data.", fr: "Le contrôle d'Audit Manager évalue les tâches de restauration exécutées ; à lui seul, il ne lance aucune restauration et ne valide pas les données restaurées." }
    d: { en: "A Resilience Hub assessment estimates whether the configuration can meet the RTO; it doesn't restore backups or check the restored tables.", fr: "Une évaluation Resilience Hub estime si la configuration peut atteindre le RTO ; elle ne restaure pas de sauvegarde et ne vérifie pas les tables restaurées." }
references:
  - title: Restore testing
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html
