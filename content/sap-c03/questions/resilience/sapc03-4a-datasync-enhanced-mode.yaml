id: sapc03-4a-datasync-enhanced-mode
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media archive company is migrating an on-premises NFS file system that holds 1.2 billion small files to Amazon S3. During a pilot, the team created an AWS DataSync task in Basic mode with an existing agent. The pilot execution failed on the full dataset because the dataset exceeds the Basic mode quotas on the number of files per task execution. The company wants a single task for the full dataset, the fastest transfers, and detailed per-execution counters in structured logs. The migration must start within days.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'archives audiovisuelles migre vers Amazon S3 un système de fichiers NFS sur site qui contient 1,2 milliard de petits fichiers. Lors d'un pilote, l'équipe a créé une tâche AWS DataSync en mode Basic avec un agent existant. L'exécution pilote a échoué sur l'ensemble des données, car celui-ci dépasse les quotas du mode Basic sur le nombre de fichiers par exécution de tâche. L'entreprise veut une seule tâche pour l'ensemble des données, les transferts les plus rapides et des compteurs détaillés par exécution dans des journaux structurés. La migration doit commencer dans quelques jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Split the dataset into many Basic mode tasks with include filters so that each execution stays under the quotas, and run the tasks in sequence from the existing agent."
        fr: "Découper l'ensemble des données en de nombreuses tâches en mode Basic avec des filtres d'inclusion pour que chaque exécution reste sous les quotas, puis exécuter les tâches l'une après l'autre depuis l'agent existant."
    - id: b
      text:
        en: "Change the task mode of the existing pilot task from Basic to Enhanced, keep its NFS and S3 locations and its schedule, and start a new execution."
        fr: "Changer le mode de la tâche pilote existante de Basic à Enhanced, conserver ses emplacements NFS et S3 ainsi que sa planification, puis démarrer une nouvelle exécution."
    - id: c
      text:
        en: "Deploy an Enhanced mode agent, create a new task with the task mode set to Enhanced from the NFS location to the S3 location, and run it for the full dataset."
        fr: "Déployer un agent compatible avec le mode Enhanced, créer une nouvelle tâche en mode Enhanced de l'emplacement NFS vers l'emplacement S3, puis l'exécuter sur l'ensemble des données."
    - id: d
      text:
        en: "Deploy an Amazon S3 File Gateway, mount its NFS share on several Linux servers, and copy the files in parallel with rsync jobs that write logs to Amazon CloudWatch."
        fr: "Déployer une passerelle Amazon S3 File Gateway, monter son partage NFS sur plusieurs serveurs Linux, puis copier les fichiers en parallèle avec des tâches rsync qui écrivent leurs journaux dans Amazon CloudWatch."
answer: { optionId: c }
explanation:
  correct:
    en: "Enhanced mode lists, prepares, transfers and verifies data in parallel, handles a virtually unlimited number of objects per execution, and provides more counters and structured JSON logs. NFS transfers in Enhanced mode require an Enhanced mode agent, and a new task is needed because the mode cannot be changed after a task is created."
    fr: "Le mode Enhanced liste, prépare, transfère et vérifie les données en parallèle, gère un nombre pratiquement illimité d'objets par exécution et fournit davantage de compteurs et des journaux JSON structurés. Les transferts NFS en mode Enhanced exigent un agent compatible avec ce mode, et une nouvelle tâche est nécessaire, car le mode ne peut pas être changé après la création d'une tâche."
  options:
    a: { en: "Many filtered Basic tasks run sequentially are slower and harder to manage, and they do not give the single task that the company wants.", fr: "De nombreuses tâches Basic filtrées exécutées l'une après l'autre sont plus lentes et plus difficiles à gérer, et ne constituent pas la tâche unique voulue." }
    b: { en: "A task's mode is fixed when the task is created, so the pilot task cannot be switched to Enhanced mode.", fr: "Le mode d'une tâche est fixé à sa création : la tâche pilote ne peut pas passer en mode Enhanced." }
    d: { en: "Copy scripts through a file gateway are slower for billions of small files and lack the managed verification and counters of DataSync.", fr: "Des scripts de copie à travers une passerelle de fichiers sont plus lents pour des milliards de petits fichiers et n'offrent ni la vérification gérée ni les compteurs de DataSync." }
references:
  - title: Choosing a task mode for your data transfer
    url: https://docs.aws.amazon.com/datasync/latest/userguide/choosing-task-mode.html
