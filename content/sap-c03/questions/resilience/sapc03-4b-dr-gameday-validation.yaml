id: sapc03-4b-dr-gameday-validation
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a warm standby application in the us-east-1 and us-west-2 Regions, and an ARC Region switch plan orchestrates the failover between them. Replication between the Regions uses S3 Cross-Region Replication and DynamoDB global tables. The annual audit requires evidence that the standby Region can actually take production traffic and that the measured recovery time meets the 30-minute RTO. The audit also requires evidence that the application in the standby Region keeps working when it loses connectivity to the primary Region and cross-Region replication pauses. Every test must limit the blast radius and be reversible.

    Which combination of actions should the solutions architect include in the test procedure? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application en veille active dans les Régions us-east-1 et us-west-2, et un plan ARC Region switch orchestre le basculement entre elles. La réplication entre les Régions utilise la réplication S3 entre Régions et des tables globales DynamoDB. L'audit annuel exige la preuve que la Région de secours peut réellement prendre le trafic de production et que le temps de reprise mesuré respecte le RTO de 30 minutes. L'audit exige aussi la preuve que l'application de la Région de secours continue de fonctionner quand elle perd la connectivité vers la Région principale et que la réplication entre Régions est suspendue. Chaque test doit limiter le rayon d'impact et être réversible.

    Quelle combinaison d'actions l'architecte de solutions doit-il inclure dans la procédure de test ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "During a scheduled game day, execute the Region switch plan to fail over to us-west-2, record the elapsed time from the plan execution dashboard, and then fail back.", fr: "Lors d'une journée de test planifiée (game day), exécuter le plan Region switch pour basculer vers us-west-2, relever la durée sur le tableau de bord d'exécution du plan, puis revenir en arrière." }
    - id: b
      text: { en: "Present the results of the Region switch plan evaluations, which run every 30 minutes, as evidence that the failover meets the RTO.", fr: "Présenter les résultats des évaluations du plan Region switch, qui s'exécutent toutes les 30 minutes, comme preuve que le basculement respecte le RTO." }
    - id: c
      text: { en: "Run the AWS FIS Cross-Region: Connectivity scenario from us-east-1 toward us-west-2 with stop conditions, and observe the application in us-west-2 during the experiment.", fr: "Exécuter le scénario AWS FIS Cross-Region: Connectivity depuis us-east-1 vers us-west-2 avec des conditions d'arrêt, et observer l'application dans us-west-2 pendant l'expérience." }
    - id: d
      text: { en: "Restore last night's backups into the production VPC in us-east-1 and measure how long the restore takes as the recovery time of the application.", fr: "Restaurer les sauvegardes de la nuit dernière dans le VPC de production d'us-east-1 et mesurer la durée de la restauration comme temps de reprise de l'application." }
    - id: e
      text: { en: "Terminate all EC2 instances and delete the load balancers in us-east-1 to reproduce a real disaster, and redeploy them from CloudFormation after the test.", fr: "Résilier toutes les instances EC2 et supprimer les équilibreurs de charge d'us-east-1 pour reproduire un vrai sinistre, puis les redéployer depuis CloudFormation après le test." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Executing the Region switch plan during a game day moves real traffic to the standby and its dashboards record the progress of each step, which measures the actual recovery time; the plan's failback returns traffic afterward. The FIS Cross-Region: Connectivity scenario blocks traffic toward the other Region and pauses cross-Region replication for a set duration, with stop conditions limiting the impact, which tests the second audit requirement reversibly."
    fr: "Exécuter le plan Region switch lors d'une journée de test déplace un vrai trafic vers la veille, et ses tableaux de bord enregistrent la progression de chaque étape, ce qui mesure le temps de reprise réel ; le retour arrière du plan ramène ensuite le trafic. Le scénario FIS Cross-Region: Connectivity bloque le trafic vers l'autre Région et suspend la réplication entre Régions pendant une durée fixée, avec des conditions d'arrêt qui limitent l'impact, ce qui teste la seconde exigence d'audit de façon réversible."
  options:
    b:
      en: "Plan evaluation checks that the plan configuration is still valid; it does not execute the failover, so it measures no recovery time."
      fr: "L'évaluation du plan vérifie que sa configuration reste valide ; elle n'exécute pas le basculement et ne mesure donc aucun temps de reprise."
    d:
      en: "Restoring backups into the production VPC risks conflicting with production resources, and a restore time is not the recovery time of a warm standby failover."
      fr: "Restaurer des sauvegardes dans le VPC de production risque d'entrer en conflit avec les ressources de production, et une durée de restauration n'est pas le temps de reprise d'un basculement en veille active."
    e:
      en: "Destroying production resources has an unlimited blast radius and is not reversible in a controlled way."
      fr: "Détruire des ressources de production a un rayon d'impact illimité et n'est pas réversible de manière maîtrisée."
references:
  - title: Region switch in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/region-switch.html
  - title: "Cross-Region: Connectivity"
    url: https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html
