id: sapc03-4b-arc-region-switch-plan
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs an application across three AWS accounts: a web tier on Amazon EC2 Auto Scaling groups, microservices on Amazon ECS, and an Amazon Aurora global database. The primary Region is us-east-1, and us-west-2 runs a scaled-down standby. Today the Regional failover is a 40-step wiki procedure, and the last test took 3 hours. The company wants a single orchestrated workflow that scales the standby, requires a human approval before the database failover, and redirects traffic. The workflow must not depend on the Region being deactivated, must show its progress in real time, and must be checked continuously so that resource changes do not silently break it. The company wants to write as little custom code as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute une application dans trois comptes AWS : un niveau web sur des Auto Scaling groups Amazon EC2, des microservices sur Amazon ECS et une base de données globale Amazon Aurora. La Région principale est us-east-1, et us-west-2 exécute une veille réduite. Aujourd'hui, le basculement régional est une procédure wiki de 40 étapes, et le dernier test a duré 3 heures. L'entreprise veut un seul workflow orchestré qui met à l'échelle la veille, exige une approbation humaine avant le basculement de la base de données et redirige le trafic. Le workflow ne doit pas dépendre de la Région en cours de désactivation, doit montrer sa progression en temps réel et doit être vérifié en continu pour que des modifications de ressources ne le cassent pas silencieusement. L'entreprise veut écrire le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Onboard the application to ARC readiness checks to monitor the standby, and build an AWS Step Functions state machine in us-east-1 that scales the standby, waits for approval, fails over Aurora and redirects traffic.", fr: "Intégrer l'application aux readiness checks d'ARC pour surveiller la veille, et créer dans us-east-1 une machine à états AWS Step Functions qui met la veille à l'échelle, attend l'approbation, bascule Aurora et redirige le trafic." }
    - id: b
      text: { en: "Write an AWS Systems Manager Automation runbook in us-east-1 that assumes roles in the three accounts to scale the standby, pauses for approval, fails over Aurora and updates DNS, and run it during an event.", fr: "Écrire dans us-east-1 un runbook AWS Systems Manager Automation qui assume des rôles dans les trois comptes pour mettre la veille à l'échelle, se met en pause pour approbation, bascule Aurora et met à jour le DNS, et l'exécuter pendant un incident." }
    - id: c
      text: { en: "Create an ARC Region switch plan with execution blocks for the Auto Scaling groups, the ECS services, a manual approval, the Aurora global database and Route 53 health checks, and include the resources of the three accounts.", fr: "Créer un plan ARC Region switch avec des blocs d'exécution pour les Auto Scaling groups, les services ECS, une approbation manuelle, la base de données globale Aurora et les vérifications de l'état Route 53, et y inclure les ressources des trois comptes." }
    - id: d
      text: { en: "Use AWS CloudFormation StackSets to deploy full-capacity stacks to us-west-2 during an event, and promote the Aurora secondary cluster with a stack parameter that operators set after approval.", fr: "Utiliser AWS CloudFormation StackSets pour déployer des piles à pleine capacité dans us-west-2 pendant un incident, et promouvoir le cluster secondaire Aurora par un paramètre de pile que les opérateurs définissent après approbation." }
answer: { optionId: c }
explanation:
  correct:
    en: "ARC Region switch orchestrates multi-Region recovery across accounts with plans made of steps and execution blocks, including EC2 Auto Scaling, ECS service scaling, manual approval, Aurora Global Database and Route 53 health check blocks. Each Region has its own Region switch data plane, so a plan runs without depending on the Region being deactivated; dashboards show progress in real time, and plan evaluation runs after each change and every 30 minutes."
    fr: "ARC Region switch orchestre la reprise multi-Régions entre comptes avec des plans faits d'étapes et de blocs d'exécution, notamment des blocs EC2 Auto Scaling, mise à l'échelle de service ECS, approbation manuelle, Aurora Global Database et vérification de l'état Route 53. Chaque Région possède son propre plan de données Region switch : un plan s'exécute sans dépendre de la Région désactivée ; des tableaux de bord montrent la progression en temps réel, et l'évaluation du plan s'exécute après chaque modification et toutes les 30 minutes."
  options:
    a:
      en: "ARC readiness check is no longer open to new customers, and a state machine hosted in us-east-1 depends on the Region it is meant to fail away from."
      fr: "Les readiness checks d'ARC ne sont plus ouverts aux nouveaux clients, et une machine à états hébergée dans us-east-1 dépend de la Région qu'elle est censée quitter."
    b:
      en: "A custom runbook in us-east-1 depends on the impaired Region, needs custom cross-account steps, and nothing validates it continuously between events."
      fr: "Un runbook personnalisé dans us-east-1 dépend de la Région dégradée, exige des étapes entre comptes personnalisées, et rien ne le valide en continu entre les incidents."
    d:
      en: "Deploying stacks during an event relies on control plane operations and lengthens recovery, and it provides no progress dashboard or continuous plan validation."
      fr: "Déployer des piles pendant un incident repose sur des opérations du plan de contrôle et allonge la reprise, sans tableau de bord de progression ni validation continue du plan."
references:
