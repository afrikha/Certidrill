id: sapc03-4a-rds-custom-sqlserver
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company is migrating a laboratory information management system (LIMS) whose database runs on Microsoft SQL Server 2019. The LIMS vendor supports the system only if its monitoring agent is installed on the database host operating system and if the vendor can apply its own host-level configuration changes. The company currently runs the database on physical servers and spends a lot of effort on backups and on recovering failed hosts. It wants AWS to automate backups, point-in-time recovery and the replacement of an impaired host. The database team wants the least possible administration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise pharmaceutique migre un système de gestion des informations de laboratoire (LIMS) dont la base de données s'exécute sur Microsoft SQL Server 2019. L'éditeur du LIMS ne prend en charge le système que si son agent de supervision est installé sur le système d'exploitation de l'hôte de la base et s'il peut appliquer ses propres modifications de configuration au niveau de l'hôte. L'entreprise exécute aujourd'hui la base sur des serveurs physiques et consacre beaucoup d'efforts aux sauvegardes et à la reprise des hôtes défaillants. Elle veut qu'AWS automatise les sauvegardes, la restauration à un instant dans le passé et le remplacement d'un hôte dégradé. L'équipe de bases de données veut le moins d'administration possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Migrate the database to Amazon RDS Custom for SQL Server, install the vendor agent with its privileged host access, and rely on its automated backups, point-in-time recovery and host repair."
        fr: "Migrer la base vers Amazon RDS Custom for SQL Server, installer l'agent de l'éditeur grâce à son accès privilégié à l'hôte, et s'appuyer sur ses sauvegardes automatisées, sa restauration à un instant dans le passé et sa réparation des hôtes."
    - id: b
      text:
        en: "Migrate the database to an Amazon RDS for SQL Server Multi-AZ deployment with automated backups, and ask AWS Support to install the vendor agent and apply the vendor's changes on the hosts of the DB instance."
        fr: "Migrer la base vers un déploiement Multi-AZ Amazon RDS for SQL Server avec sauvegardes automatisées, puis demander au support AWS d'installer l'agent de l'éditeur et d'appliquer ses modifications sur les hôtes de l'instance."
    - id: c
      text:
        en: "Rehost the database servers to Amazon EC2 with AWS Transform MGN, install the vendor agent, and build backup, log shipping and host recovery procedures with custom scripts and AWS Backup plans."
        fr: "Réhéberger les serveurs de bases sur Amazon EC2 avec AWS Transform MGN, installer l'agent de l'éditeur, puis créer des procédures de sauvegarde, d'envoi des journaux et de reprise des hôtes avec des scripts personnalisés et des plans AWS Backup."
    - id: d
      text:
        en: "Migrate the database to Babelfish for Aurora PostgreSQL so that the LIMS keeps its SQL Server drivers, and run the vendor agent on a separate EC2 instance that connects to the cluster."
        fr: "Migrer la base vers Babelfish for Aurora PostgreSQL pour que le LIMS conserve ses pilotes SQL Server, puis exécuter l'agent de l'éditeur sur une instance EC2 distincte qui se connecte au cluster."
answer: { optionId: a }
explanation:
  correct:
    en: "RDS Custom for SQL Server is meant for packaged applications that need access to the operating system and database environment. It gives privileged host access for third-party agents and customizations while automating backups, point-in-time recovery and monitoring, and it reboots or replaces an impaired underlying instance."
    fr: "RDS Custom for SQL Server est destiné aux applications packagées qui ont besoin d'accéder au système d'exploitation et à l'environnement de la base. Il donne un accès privilégié à l'hôte pour les agents tiers et les personnalisations tout en automatisant les sauvegardes, la restauration à un instant dans le passé et la supervision, et il redémarre ou remplace une instance sous-jacente dégradée."
  options:
    b: { en: "Amazon RDS gives no access to the host operating system, so the vendor agent and host-level changes cannot be applied.", fr: "Amazon RDS ne donne aucun accès au système d'exploitation de l'hôte : l'agent de l'éditeur et les modifications au niveau de l'hôte ne peuvent pas être appliqués." }
    c: { en: "This keeps backups and host recovery as customer-built procedures, which is far more administration than RDS Custom.", fr: "Cette solution laisse les sauvegardes et la reprise des hôtes sous forme de procédures construites par le client, soit bien plus d'administration qu'RDS Custom." }
    d: { en: "The vendor requires its agent on the database host and supports SQL Server, not an Aurora PostgreSQL cluster with a T-SQL endpoint.", fr: "L'éditeur exige son agent sur l'hôte de la base et prend en charge SQL Server, pas un cluster Aurora PostgreSQL doté d'un point de terminaison T-SQL." }
references:
  - title: Amazon RDS Custom
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-custom.html
