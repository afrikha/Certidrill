id: sapc03-4c-lag-vault-mpa
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company copies the backups of its production accounts to logically air-gapped vaults in AWS Backup. Its cyber-resilience plan assumes that an attacker could take control of the entire primary organization in AWS Organizations, including its management account and its IAM Identity Center instance. In that case, the company must still be able to restore the backups into a clean recovery account. The company has created a separate recovery organization with its own management account. Access to the backups from the recovery account must require the approval of at least 3 of 5 named executives, and no credentials from the primary organization may be needed during the recovery.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé copie les sauvegardes de ses comptes de production dans des coffres isolés logiquement (logically air-gapped vaults) d'AWS Backup. Son plan de cyber-résilience suppose qu'un attaquant pourrait prendre le contrôle de toute l'organisation principale AWS Organizations, y compris son compte de gestion et son instance IAM Identity Center. Dans ce cas, l'entreprise doit tout de même pouvoir restaurer les sauvegardes dans un compte de récupération sain. L'entreprise a créé une organisation de récupération distincte avec son propre compte de gestion. L'accès aux sauvegardes depuis le compte de récupération doit exiger l'approbation d'au moins 3 dirigeants désignés sur 5, et aucun identifiant de l'organisation principale ne doit être nécessaire pendant la récupération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a 3-of-5 multi-party approval team of the executives in the management account of the primary organization, and share it with the recovery account through AWS RAM."
        fr: "Créer une équipe d'approbation multipartite des dirigeants (3 sur 5) dans le compte de gestion de l'organisation principale, et la partager avec le compte de récupération par AWS RAM."
    - id: b
      text:
        en: "Share each logically air-gapped vault through AWS RAM with the entire recovery organization, and require 3 of the 5 executives to approve each restore job in the recovery organization."
        fr: "Partager chaque coffre isolé logiquement par AWS RAM avec toute l'organisation de récupération, et exiger que 3 des 5 dirigeants approuvent chaque tâche de restauration dans l'organisation de récupération."
    - id: c
      text:
        en: "Add a cross-account copy rule that copies each recovery point from the logically air-gapped vaults to a vault with a compliance-mode Vault Lock in the recovery account of the recovery organization."
        fr: "Ajouter une règle de copie entre comptes qui copie chaque point de récupération des coffres isolés logiquement vers un coffre doté d'un Vault Lock en mode conformité dans le compte de récupération de l'organisation de récupération."
    - id: d
      text:
        en: "Create a 3-of-5 multi-party approval team of the executives in the recovery organization, share it through AWS RAM with the vault-owning and recovery accounts, and associate each vault with it."
        fr: "Créer une équipe d'approbation multipartite des dirigeants (3 sur 5) dans l'organisation de récupération, la partager par AWS RAM avec les comptes propriétaires des coffres et le compte de récupération, et y associer chaque coffre."
answer: { optionId: d }
explanation:
  correct:
    en: "Multi-party approval lets a team of trusted individuals approve access to a logically air-gapped vault from a recovery account when the primary account may be compromised. The team is created in the management account of the separate recovery organization, with its own IAM Identity Center and approval threshold, shared through AWS RAM, and associated with each vault; the recovery account then restores through a restore access backup vault."
    fr: "L'approbation multipartite permet à une équipe de personnes de confiance d'approuver l'accès à un coffre isolé logiquement depuis un compte de récupération quand le compte principal risque d'être compromis. L'équipe est créée dans le compte de gestion de l'organisation de récupération distincte, avec son propre IAM Identity Center et son seuil d'approbation, partagée par AWS RAM et associée à chaque coffre ; le compte de récupération restaure ensuite par un coffre d'accès à la restauration (restore access backup vault)."
  options:
    a: { en: "A team that lives in the primary organization's management account depends on the identities that the attacker is assumed to control.", fr: "Une équipe hébergée dans le compte de gestion de l'organisation principale dépend des identités que l'attaquant est supposé contrôler." }
    b: { en: "A logically air-gapped vault can be shared only with individual account IDs, not with an entire organization or OU, so this sharing model isn't available.", fr: "Un coffre isolé logiquement ne peut être partagé qu'avec des ID de comptes individuels, pas avec toute une organisation ou une OU : ce modèle de partage n'est pas possible." }
    c: { en: "Cross-account copies work only between accounts of the same organization, and the copy rule would be managed from the compromised primary organization.", fr: "Les copies entre comptes ne fonctionnent qu'entre comptes de la même organisation, et la règle de copie serait gérée depuis l'organisation principale compromise." }
references:
  - title: Multi-party approval for logically air-gapped vaults
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/multipartyapproval.html
  - title: Logically air-gapped vault
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
