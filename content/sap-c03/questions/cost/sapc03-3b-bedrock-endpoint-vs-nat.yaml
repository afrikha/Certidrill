id: sapc03-3b-bedrock-endpoint-vs-nat
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's claims-processing application runs on Amazon ECS tasks in private subnets across three Availability Zones in eu-west-1. The application sends scanned claim documents, about 70 TB each month, to a foundation model through the Amazon Bedrock InvokeModel API in the same Region. The requests leave the VPC through a NAT gateway in each Availability Zone, and NAT gateway data processing is now the largest cost of the workload.

    The security team requires that Bedrock traffic stop using the internet path and that the VPC be allowed to invoke only two approved models. The application uses the AWS SDK with the default Regional endpoint, and the development team cannot change the code or its configuration before the next release.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    L'application de traitement des sinistres d'AnyCompany s'exécute sur des tâches Amazon ECS dans des sous-réseaux privés répartis sur trois zones de disponibilité de eu-west-1. L'application envoie des documents de sinistres numérisés, environ 70 To par mois, à un modèle de fondation par l'API InvokeModel d'Amazon Bedrock dans la même Région. Les requêtes quittent le VPC par une passerelle NAT dans chaque zone de disponibilité, et le traitement des données des passerelles NAT est désormais le premier coût de la charge de travail.

    L'équipe de sécurité exige que le trafic Bedrock cesse d'utiliser le chemin Internet et que le VPC ne puisse appeler que deux modèles approuvés. L'application utilise le SDK AWS avec le point de terminaison régional par défaut, et l'équipe de développement ne peut modifier ni le code ni sa configuration avant la prochaine version.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon Bedrock, add it to the private route tables, and attach an endpoint policy that allows only the two approved models.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon Bedrock, l'ajouter aux tables de routage privées, et y attacher une politique de point de terminaison qui n'autorise que les deux modèles approuvés." } }
    - { id: b, text: { en: "Route the Bedrock traffic through an AWS Transit Gateway to a central egress VPC, and filter the allowed model endpoints with AWS Network Firewall.", fr: "Acheminer le trafic Bedrock par une passerelle AWS Transit Gateway vers un VPC de sortie central, et filtrer les points de terminaison de modèles autorisés avec AWS Network Firewall." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for bedrock-runtime with private DNS disabled, and attach an endpoint policy that allows bedrock:InvokeModel only on the two approved models.", fr: "Créer un point de terminaison de VPC d'interface pour bedrock-runtime avec le DNS privé désactivé, et y attacher une politique de point de terminaison qui n'autorise bedrock:InvokeModel que sur les deux modèles approuvés." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for bedrock-runtime in the three private subnets with private DNS enabled, and attach an endpoint policy that allows bedrock:InvokeModel only on the two approved models.", fr: "Créer un point de terminaison de VPC d'interface pour bedrock-runtime dans les trois sous-réseaux privés avec le DNS privé activé, et y attacher une politique de point de terminaison qui n'autorise bedrock:InvokeModel que sur les deux modèles approuvés." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An interface endpoint for bedrock-runtime keeps the traffic on AWS PrivateLink, and its per-GB data processing charge is lower than NAT gateway data processing, so 70 TB per month costs less. With private DNS enabled, the default Regional name bedrock-runtime.eu-west-1.amazonaws.com resolves to the endpoint, so the SDK needs no change. A custom endpoint policy limits InvokeModel to the approved model ARNs.
    fr: |
      Un point de terminaison d'interface pour bedrock-runtime garde le trafic sur AWS PrivateLink, et ses frais de traitement des données par Go sont inférieurs à ceux des passerelles NAT : 70 To par mois coûtent donc moins cher. Avec le DNS privé activé, le nom régional par défaut bedrock-runtime.eu-west-1.amazonaws.com se résout vers le point de terminaison, donc le SDK ne change pas. Une politique de point de terminaison personnalisée limite InvokeModel aux ARN des modèles approuvés.
  options:
    a: { en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Amazon Bedrock is reached through interface endpoints.", fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Amazon Bedrock s'atteint par des points de terminaison d'interface." }
    b: { en: "The traffic would pay transit gateway processing, NAT gateway processing, and firewall processing, and it would still use the internet path.", fr: "Le trafic paierait le traitement de la passerelle de transit, celui des passerelles NAT et celui du pare-feu, et il emprunterait toujours le chemin Internet." }
    c: { en: "Without private DNS, the SDK must be configured with the endpoint-specific URL, which the development team cannot change before the release.", fr: "Sans DNS privé, le SDK doit être configuré avec l'URL propre au point de terminaison, ce que l'équipe de développement ne peut pas modifier avant la version." }
references:
  - title: AWS PrivateLink Pricing
    url: https://aws.amazon.com/privatelink/pricing/
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
