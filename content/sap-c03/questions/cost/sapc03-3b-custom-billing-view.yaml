id: sapc03-3b-custom-billing-view
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 400 accounts in AWS Organizations. Its business units run workloads in dedicated accounts and in shared accounts, and every resource carries a CostCenter tag that is activated as a cost allocation tag. Each business unit has several CostCenter values.

    The finance lead of each business unit works from a tools account that the business unit owns. Each lead must be able to analyze and forecast, in AWS Cost Explorer, only the costs that carry the CostCenter values of their business unit, across all accounts, and to create budgets on them. The leads must not get access to the management account or see any other business unit's costs.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 400 comptes dans AWS Organizations. Ses unités opérationnelles exécutent des charges de travail dans des comptes dédiés et dans des comptes partagés, et chaque ressource porte une balise CostCenter activée comme balise de répartition des coûts. Chaque unité opérationnelle a plusieurs valeurs de CostCenter.

    Le responsable financier de chaque unité opérationnelle travaille depuis un compte d'outils qui appartient à son unité. Chaque responsable doit pouvoir analyser et prévoir dans AWS Cost Explorer uniquement les coûts qui portent les valeurs de CostCenter de son unité, sur tous les comptes, et créer des budgets sur ces coûts. Les responsables ne doivent ni accéder au compte de gestion ni voir les coûts d'une autre unité opérationnelle.

    Quelle solution répond à ces exigences avec la charge opérationnelle la PLUS faible ?
body:
  options:
    - { id: a, text: { en: "Create an IAM role in the management account for each business unit that allows Cost Explorer actions with a condition on the CostCenter tag, and let the leads assume it from their tools accounts.", fr: "Créer dans le compte de gestion un rôle IAM par unité opérationnelle qui autorise les actions Cost Explorer avec une condition sur la balise CostCenter, et laisser les responsables l'endosser depuis leurs comptes d'outils." } }
    - { id: b, text: { en: "Create one CUR 2.0 export per business unit with a SQL filter on its CostCenter values, deliver each export to a bucket in the business unit's tools account, and query it with Amazon Athena.", fr: "Créer un export CUR 2.0 par unité opérationnelle avec un filtre SQL sur ses valeurs de CostCenter, livrer chaque export dans un compartiment du compte d'outils de l'unité, et l'interroger avec Amazon Athena." } }
    - { id: c, text: { en: "Create one AWS Billing Conductor billing group per business unit that contains its accounts, and give each lead access to the primary account of the billing group.", fr: "Créer un groupe de facturation AWS Billing Conductor par unité opérationnelle qui contient ses comptes, et donner à chaque responsable l'accès au compte principal du groupe de facturation." } }
    - { id: d, text: { en: "In the management account, create one custom billing view per business unit filtered on the CostCenter tag with that business unit's values, and share each view with the business unit's tools account.", fr: "Dans le compte de gestion, créer une vue de facturation personnalisée par unité opérationnelle filtrée sur la balise CostCenter avec les valeurs de cette unité, et partager chaque vue avec le compte d'outils de l'unité." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Custom billing views are created from the management account and contain a filtered subset of the organization's cost management data; a filter can use one cost allocation tag key with several values. Each view can be shared with other accounts, whose users select it in Cost Explorer to visualize and forecast spend and use it with AWS Budgets. The leads see only their business unit's tagged costs across all accounts and never sign in to the management account.
    fr: |
      Les vues de facturation personnalisées se créent depuis le compte de gestion et contiennent un sous-ensemble filtré des données de gestion des coûts de l'organisation ; un filtre peut utiliser une clé de balise de répartition des coûts avec plusieurs valeurs. Chaque vue peut être partagée avec d'autres comptes, dont les utilisateurs la sélectionnent dans Cost Explorer pour visualiser et prévoir les dépenses et l'utiliser avec AWS Budgets. Les responsables ne voient que les coûts balisés de leur unité sur tous les comptes et ne se connectent jamais au compte de gestion.
  options:
    a: { en: "The leads would work in the management account, which is forbidden, and IAM conditions do not filter the rows of cost data that Cost Explorer returns.", fr: "Les responsables travailleraient dans le compte de gestion, ce qui est interdit, et les conditions IAM ne filtrent pas les lignes de données de coûts que renvoie Cost Explorer." }
    b: { en: "Exports with Athena give SQL access, not Cost Explorer analysis and forecasts or AWS Budgets, and they add one pipeline per business unit.", fr: "Des exports avec Athena donnent un accès SQL, pas l'analyse et les prévisions de Cost Explorer ni AWS Budgets, et ils ajoutent un pipeline par unité opérationnelle." }
    c: { en: "Billing groups are made of whole accounts, so the tagged costs of the shared accounts cannot be split between business units.", fr: "Les groupes de facturation sont composés de comptes entiers : les coûts balisés des comptes partagés ne peuvent pas être répartis entre unités opérationnelles." }
references:
  - title: Controlling cost management data access with Billing View
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/billing-view.html
  - title: Creating custom billing views
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/create-custom-billing-views.html
