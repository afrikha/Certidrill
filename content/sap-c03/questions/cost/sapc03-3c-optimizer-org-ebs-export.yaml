id: sapc03-3c-optimizer-org-ebs-export
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 250 member accounts in AWS Organizations and more than 40,000 Amazon EBS volumes of types gp2, io1, and st1. Teams provisioned the volumes over several years, and the FinOps team believes that many are overprovisioned or use an older volume type. The FinOps team works from a dedicated member account and must not use the management account for daily work. It needs volume-level recommendations, including the suggested volume type, size, and IOPS, for every account, and it wants to analyze them with SQL every month. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 250 comptes membres dans AWS Organizations et plus de 40 000 volumes Amazon EBS de types gp2, io1 et st1. Les équipes ont provisionné les volumes pendant plusieurs années, et l'équipe FinOps pense que beaucoup sont surdimensionnés ou utilisent un type de volume plus ancien. L'équipe FinOps travaille depuis un compte membre dédié et ne doit pas utiliser le compte de gestion pour son travail quotidien. Elle a besoin de recommandations par volume, incluant le type de volume, la taille et les IOPS suggérés, pour chaque compte, et veut les analyser en SQL chaque mois. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on rightsizing recommendations in AWS Cost Explorer from the management account, and download the recommendations as a CSV file every month for the FinOps team.", fr: "Activer les recommandations de redimensionnement d'AWS Cost Explorer depuis le compte de gestion, et télécharger chaque mois les recommandations en fichier CSV pour l'équipe FinOps." }
    - id: b
      text: { en: "Deploy the CloudWatch agent and an AWS Lambda function to every account with StackSets to compute volume utilization, and write the results to an S3 bucket in the FinOps account.", fr: "Déployer l'agent CloudWatch et une fonction AWS Lambda dans chaque compte avec StackSets pour calculer l'utilisation des volumes, et écrire les résultats dans un compartiment S3 du compte FinOps." }
    - id: c
      text: { en: "Ask each account owner to opt in to AWS Compute Optimizer and export the EBS volume recommendations of the account to a shared S3 bucket every month for Athena.", fr: "Demander à chaque propriétaire de compte d'activer AWS Compute Optimizer et d'exporter chaque mois les recommandations de volumes EBS du compte vers un compartiment S3 partagé pour Athena." }
    - id: d
      text: { en: "Opt in the organization to AWS Compute Optimizer from the management account, make the FinOps account its delegated administrator, and export all accounts' EBS recommendations to S3 for Athena.", fr: "Activer AWS Compute Optimizer pour l'organisation depuis le compte de gestion, faire du compte FinOps son administrateur délégué, et exporter les recommandations EBS de tous les comptes vers S3 pour Athena." }
answer: { optionId: d }
explanation:
  correct:
    en: "Compute Optimizer analyzes 14 days of EBS metrics and recommends a volume type, size, and IOPS per volume. The management account registers one delegated administrator, which can set member opt-in, get recommendations, and export them for the organization. The export is a CSV file with JSON metadata in S3, which Athena can query."
    fr: "Compute Optimizer analyse 14 jours de métriques EBS et recommande un type de volume, une taille et des IOPS par volume. Le compte de gestion enregistre un administrateur délégué, qui peut définir l'adhésion des comptes membres, obtenir les recommandations et les exporter pour l'organisation. L'export est un fichier CSV avec des métadonnées JSON dans S3, qu'Athena peut interroger."
  options:
    a:
      en: "Cost Explorer rightsizing recommendations cover Amazon EC2 instances, not EBS volume types, sizes, or IOPS, and the process depends on the management account."
      fr: "Les recommandations de redimensionnement de Cost Explorer couvrent les instances Amazon EC2, pas les types, tailles ou IOPS des volumes EBS, et le processus dépend du compte de gestion."
    b:
      en: "Building and maintaining custom utilization analysis in 250 accounts is far more work than a managed recommendation service, and it would not produce volume type recommendations by itself."
      fr: "Construire et maintenir une analyse d'utilisation personnalisée dans 250 comptes demande bien plus de travail qu'un service de recommandations géré, et ne produirait pas à elle seule de recommandations de type de volume."
    c:
      en: "Relying on 250 account owners to opt in and export every month adds coordination work and leaves gaps, whereas the delegated administrator can do both for the whole organization."
      fr: "Compter sur 250 propriétaires de comptes pour l'adhésion et l'export mensuels ajoute un travail de coordination et laisse des lacunes, alors que l'administrateur délégué peut faire les deux pour toute l'organisation."
references:
  - title: Viewing Amazon EBS volume recommendations
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-ebs-recommendations.html
  - title: Delegating an administrator account
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/delegate-administrator-account.html
