id: sapc03-3a-lambda-durable-waits
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's customer onboarding service is written in Python on AWS Lambda. For each new customer, the service calls an identity verification provider, waits for the result, which arrives between a few minutes and 3 days later, creates the account, and then waits 7 days before it sends a follow-up offer. Today, the service stores progress in an Amazon DynamoDB table, and a scheduled Lambda function polls every minute for customers whose next step is due. The polling invocations and the custom state handling have become expensive and hard to maintain. The developers want to write the whole process as sequential Python code in Lambda, with automatic checkpointing of completed steps. They do not want to learn or maintain a separate workflow definition language, and the company does not want to pay for compute while the process waits.

    Which solution will meet these requirements?
  fr: |
    Le service d'intégration des clients d'AnyCompany est écrit en Python sur AWS Lambda. Pour chaque nouveau client, le service appelle un fournisseur de vérification d'identité, attend le résultat, qui arrive entre quelques minutes et 3 jours plus tard, crée le compte, puis attend 7 jours avant d'envoyer une offre de suivi. Aujourd'hui, le service stocke sa progression dans une table Amazon DynamoDB, et une fonction Lambda planifiée interroge la table toutes les minutes pour trouver les clients dont l'étape suivante est due. Les appels d'interrogation et la gestion d'état personnalisée sont devenus coûteux et difficiles à maintenir. Les développeurs veulent écrire tout le processus sous forme de code Python séquentiel dans Lambda, avec un enregistrement automatique des étapes terminées. Ils ne veulent ni apprendre ni maintenir un langage de définition de flux de travail distinct, et l'entreprise ne veut pas payer de calcul pendant les attentes du processus.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Orchestrate the process with an AWS Step Functions Express workflow that calls the Lambda functions and uses Wait states for the verification result and the 7-day delay."
        fr: "Orchestrer le processus avec un flux de travail AWS Step Functions Express qui appelle les fonctions Lambda et utilise des états Wait pour le résultat de vérification et le délai de 7 jours."
    - id: b
      text:
        en: "Orchestrate the process with an AWS Step Functions Standard workflow defined in Amazon States Language that uses a task token for the verification result and a Wait state for the 7-day delay."
        fr: "Orchestrer le processus avec un flux de travail AWS Step Functions Standard défini en Amazon States Language qui utilise un jeton de tâche pour le résultat de vérification et un état Wait pour le délai de 7 jours."
    - id: c
      text:
        en: "Replace the polling function with an Amazon SQS queue whose messages are re-sent with a delay until each step is due, and keep the progress in the DynamoDB table."
        fr: "Remplacer la fonction d'interrogation par une file d'attente Amazon SQS dont les messages sont renvoyés avec un délai jusqu'à l'échéance de chaque étape, et conserver la progression dans la table DynamoDB."
    - id: d
      text:
        en: "Rewrite the service as a Lambda durable function that wraps each call in a durable step and uses durable wait operations for the verification result and the 7-day delay."
        fr: "Réécrire le service sous forme de fonction Lambda durable (durable function) qui encapsule chaque appel dans une étape durable et utilise des opérations d'attente durables pour le résultat de vérification et le délai de 7 jours."
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda durable functions let developers write multi-step processes in ordinary code with the Durable Execution SDK, which is available for Python. Completed steps are checkpointed and replayed from stored results, executions can run for up to one year, and during wait operations the function is suspended without compute charges."
    fr: "Les fonctions Lambda durables permettent d'écrire des processus en plusieurs étapes dans du code ordinaire avec le Durable Execution SDK, disponible pour Python. Les étapes terminées sont enregistrées par points de contrôle et rejouées à partir des résultats stockés, une exécution peut durer jusqu'à un an, et pendant les opérations d'attente la fonction est suspendue sans frais de calcul."
  options:
    a:
      en: "Express workflows run for at most five minutes, so they cannot wait 3 days for the verification result or 7 days for the follow-up."
      fr: "Les flux Express durent au maximum cinq minutes : ils ne peuvent attendre ni 3 jours le résultat de vérification ni 7 jours avant le suivi."
    b:
      en: "A Standard workflow can wait for days, but it requires defining and maintaining the process in Amazon States Language, which the developers want to avoid."
      fr: "Un flux Standard peut attendre plusieurs jours, mais il impose de définir et de maintenir le processus en Amazon States Language, ce que les développeurs veulent éviter."
    c:
      en: "Re-sending delayed messages is still a polling loop with custom state handling in DynamoDB, which is the complexity and cost the company wants to remove."
      fr: "Renvoyer des messages différés reste une boucle d'interrogation avec une gestion d'état personnalisée dans DynamoDB, c'est-à-dire la complexité et le coût que l'entreprise veut supprimer."
references:
  - title: "Lambda durable functions"
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
  - title: "Choosing workflow type in Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
