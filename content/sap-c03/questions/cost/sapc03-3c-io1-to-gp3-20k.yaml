id: sapc03-3c-io1-to-gp3-20k
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs 40 self-managed SQL Server databases on Nitro-based Amazon EC2 instances in two AWS accounts. Each database uses one 500 GiB Provisioned IOPS SSD (io1) data volume with 20,000 provisioned IOPS. Amazon CloudWatch shows that each volume peaks at 18,000 IOPS and 400 MiB/s, and the application owners confirm that single-digit millisecond latency is sufficient. The volumes do not use Multi-Attach. The storage team must cut the cost of these volumes without downtime and without reducing the peak performance that the databases need.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exécute 40 bases de données SQL Server autogérées sur des instances Amazon EC2 basées sur Nitro, dans deux comptes AWS. Chaque base utilise un volume de données Provisioned IOPS SSD (io1) de 500 Gio avec 20 000 IOPS provisionnées. Amazon CloudWatch montre que chaque volume culmine à 18 000 IOPS et 400 Mio/s, et les responsables applicatifs confirment qu'une latence de quelques millisecondes suffit. Les volumes n'utilisent pas Multi-Attach. L'équipe de stockage doit réduire le coût de ces volumes sans interruption de service et sans réduire les performances de pointe dont les bases ont besoin.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Modify each volume to Provisioned IOPS SSD (io2) Block Express with 20,000 provisioned IOPS by using Elastic Volumes.", fr: "Modifier chaque volume en Provisioned IOPS SSD (io2) Block Express avec 20 000 IOPS provisionnées à l'aide d'Elastic Volumes." }
    - id: b
      text: { en: "Modify each volume to General Purpose SSD (gp2) and increase its size to 5,334 GiB to reach the gp2 maximum of 16,000 IOPS by using Elastic Volumes.", fr: "Modifier chaque volume en General Purpose SSD (gp2) et augmenter sa taille à 5 334 Gio pour atteindre le maximum gp2 de 16 000 IOPS à l'aide d'Elastic Volumes." }
    - id: c
      text: { en: "Modify each volume to General Purpose SSD (gp3) with 20,000 IOPS and 500 MiB/s of throughput by using Elastic Volumes.", fr: "Modifier chaque volume en General Purpose SSD (gp3) avec 20 000 IOPS et 500 Mio/s de débit à l'aide d'Elastic Volumes." }
    - id: d
      text: { en: "Keep io1 and reduce each volume to 16,000 provisioned IOPS by using Elastic Volumes, so that the IOPS charge decreases.", fr: "Conserver io1 et réduire chaque volume à 16 000 IOPS provisionnées à l'aide d'Elastic Volumes, afin de diminuer les frais d'IOPS." }
answer: { optionId: c }
explanation:
  correct:
    en: "gp3 now supports up to 80,000 IOPS and 2,000 MiB/s, at 500 IOPS per GiB, so a 500 GiB gp3 volume can be provisioned with 20,000 IOPS and 500 MiB/s. gp3 has a lower storage price than io1 and much cheaper additional IOPS, and Elastic Volumes changes the type while the volume stays in use."
    fr: "gp3 prend désormais en charge jusqu'à 80 000 IOPS et 2 000 Mio/s, à raison de 500 IOPS par Gio : un volume gp3 de 500 Gio peut être provisionné avec 20 000 IOPS et 500 Mio/s. gp3 a un prix de stockage inférieur à io1 et des IOPS supplémentaires bien moins chères, et Elastic Volumes change le type pendant que le volume reste utilisé."
  options:
    a:
      en: "io2 Block Express meets the performance but still charges a premium price per GiB and per provisioned IOPS; its sub-millisecond latency and higher durability are not required here."
      fr: "io2 Block Express respecte les performances mais facture toujours un prix élevé au Gio et par IOPS provisionnée : sa latence inférieure à la milliseconde et sa durabilité supérieure ne sont pas requises ici."
    b:
      en: "gp2 tops out at 16,000 IOPS, below the 18,000 IOPS peak, and a tenfold size increase would add a large storage cost."
      fr: "gp2 plafonne à 16 000 IOPS, sous le pic de 18 000 IOPS, et une taille multipliée par dix ajouterait un coût de stockage élevé."
    d:
      en: "16,000 IOPS is below the measured 18,000 IOPS peak, so performance would drop, and io1 storage remains more expensive than gp3."
      fr: "16 000 IOPS est inférieur au pic mesuré de 18 000 IOPS : les performances baisseraient, et le stockage io1 reste plus cher que gp3."
references:
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
  - title: Amazon EBS Provisioned IOPS SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/provisioned-iops.html
