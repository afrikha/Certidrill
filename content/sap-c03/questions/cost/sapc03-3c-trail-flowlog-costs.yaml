id: sapc03-3c-trail-flowlog-costs
objective: "3.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 40 member accounts in AWS Organizations. An organization trail in the management account delivers management events and Amazon S3 data events for every bucket in every account to a central S3 bucket. Each member account also has its own trail that delivers the same management events to a local bucket, a setup kept from before the organization trail existed. VPC flow logs from all VPCs are published to CloudWatch Logs log groups of the Standard class and are queried once a month for network reviews. The security team needs one organization-wide copy of management events, S3 data events only for buckets whose names start with pii-, and one year of flow logs that analysts can query with SQL.

    Which combination of actions will reduce costs while meeting these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany compte 40 comptes membres dans AWS Organizations. Un journal de suivi d'organisation dans le compte de gestion livre les événements de gestion et les événements de données Amazon S3 de chaque compartiment de chaque compte vers un compartiment S3 central. Chaque compte membre possède aussi son propre journal de suivi qui livre les mêmes événements de gestion vers un compartiment local, une configuration conservée d'avant l'existence du journal de suivi d'organisation. Les journaux de flux VPC de tous les VPC sont publiés dans des groupes de journaux CloudWatch Logs de la classe Standard et sont interrogés une fois par mois pour les revues réseau. L'équipe de sécurité a besoin d'une copie des événements de gestion pour toute l'organisation, des événements de données S3 uniquement pour les compartiments dont le nom commence par pii-, et d'un an de journaux de flux que les analystes peuvent interroger en SQL.

    Quelle combinaison d'actions réduit les coûts tout en répondant à ces exigences ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Configure advanced event selectors on the organization trail so that S3 data events are logged only when resources.ARN starts with arn:aws:s3:::pii-.", fr: "Configurer des sélecteurs d'événements avancés sur le journal de suivi d'organisation pour que les événements de données S3 ne soient journalisés que lorsque resources.ARN commence par arn:aws:s3:::pii-." } }
    - { id: b, text: { en: "Delete the trails in the member accounts that deliver duplicate copies of the management events.", fr: "Supprimer les journaux de suivi des comptes membres qui livrent des copies en double des événements de gestion." } }
    - { id: c, text: { en: "Publish the VPC flow logs to Amazon S3 in Apache Parquet format with Hive-compatible prefixes, apply a 1-year S3 Lifecycle expiration, and query them with Amazon Athena.", fr: "Publier les journaux de flux VPC dans Amazon S3 au format Apache Parquet avec des préfixes compatibles Hive, appliquer une expiration S3 Lifecycle d'un an et les interroger avec Amazon Athena." } }
    - { id: d, text: { en: "Change the class of the existing flow log log groups to Essentials and keep querying them with CloudWatch Logs Insights.", fr: "Changer la classe des groupes de journaux de flux existants en Essentials et continuer à les interroger avec CloudWatch Logs Insights." } }
    - { id: e, text: { en: "Replace the organization trail with a CloudTrail Lake event data store with 7-year retention that collects all management and data events.", fr: "Remplacer le journal de suivi d'organisation par un magasin de données d'événements CloudTrail Lake avec une rétention de 7 ans qui collecte tous les événements de gestion et de données." } }
    - { id: f, text: { en: "Change the organization trail to log only write-only S3 data events for every bucket.", fr: "Modifier le journal de suivi d'organisation pour ne journaliser que les événements de données S3 en écriture seule pour chaque compartiment." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: "Data events are charged per event delivered, and advanced event selectors can limit them to resources whose ARN starts with a prefix. The first copy of management events delivered by trails is free, but additional copies are charged, so the member-account trails only add cost. Flow logs delivered to S3 in Parquet use less storage than text and are queried 10 to 100 times faster with Athena, and an S3 Lifecycle rule enforces the one-year retention."
    fr: "Les événements de données sont facturés par événement livré, et des sélecteurs d'événements avancés peuvent les limiter aux ressources dont l'ARN commence par un préfixe. La première copie des événements de gestion livrée par des journaux de suivi est gratuite, mais les copies supplémentaires sont facturées : les journaux des comptes membres ne font qu'ajouter des coûts. Les journaux de flux livrés dans S3 au format Parquet occupent moins d'espace que le texte et sont interrogés 10 à 100 fois plus vite avec Athena, et une règle S3 Lifecycle impose la conservation d'un an."
  options:
    d:
      en: "The log class of an existing log group cannot be changed after creation, so this action is not possible as described."
      fr: "La classe d'un groupe de journaux existant ne peut pas être modifiée après sa création : cette action est impossible telle que décrite."
    e:
      en: "CloudTrail Lake charges for ingestion, retention, and queries; collecting all data events for 7 years would cost more and would still log buckets that are not in scope."
      fr: "CloudTrail Lake facture l'ingestion, la rétention et les requêtes : collecter tous les événements de données pendant 7 ans coûterait plus cher et journaliserait toujours des compartiments hors périmètre."
    f:
      en: "Write-only events for every bucket still log every bucket outside the pii- scope and also omit the read events of the pii- buckets."
      fr: "Des événements en écriture seule pour chaque compartiment journalisent toujours tous les compartiments hors du périmètre pii- et omettent en outre les événements de lecture des compartiments pii-."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
  - title: Flow log files
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-s3-path.html
