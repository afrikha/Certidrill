id: sapc03-3c-it-tenant-tag-archive
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a multi-tenant SaaS document platform that stores all tenant files in one S3 bucket per Region, under one prefix per tenant. The bucket holds 4 PB in S3 Standard, objects are between 1 MB and 200 MB, and each of the 6,000 tenants has its own unpredictable access pattern. Tenants on the Premium plan must be able to read any file in milliseconds at any time. Tenants on the Archive plan accept that a file not opened for one year can take up to 12 hours to become readable, and the application already calls the restore API and tags every object with the tenant's plan at upload. The engineering team cannot analyze access patterns tenant by tenant. The company wants to reduce storage costs while keeping retrieval fees out of the Premium tenants' bills.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exploite une plateforme documentaire SaaS mutualisée qui stocke tous les fichiers des locataires dans un compartiment S3 par Région, sous un préfixe par locataire. Le compartiment contient 4 Po dans S3 Standard, les objets font entre 1 Mo et 200 Mo, et chacun des 6 000 locataires a son propre profil d'accès imprévisible. Les locataires de l'offre Premium doivent pouvoir lire n'importe quel fichier en millisecondes à tout moment. Les locataires de l'offre Archive acceptent qu'un fichier non ouvert depuis un an mette jusqu'à 12 heures pour devenir lisible, et l'application appelle déjà l'API de restauration et balise chaque objet avec l'offre du locataire lors du chargement. L'équipe d'ingénierie ne peut pas analyser les profils d'accès locataire par locataire. L'entreprise veut réduire ses coûts de stockage tout en évitant les frais de récupération sur les factures des locataires Premium.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Store all objects in S3 Intelligent-Tiering, and add an S3 Lifecycle rule filtered on the Archive plan tag that transitions objects to S3 Glacier Deep Archive 365 days after creation.", fr: "Stocker tous les objets dans S3 Intelligent-Tiering, et ajouter une règle S3 Lifecycle filtrée sur la balise de l'offre Archive qui fait passer les objets dans S3 Glacier Deep Archive 365 jours après leur création." }
    - id: b
      text: { en: "Store all objects in S3 Intelligent-Tiering, and add an Intelligent-Tiering archive configuration filtered on the Archive plan tag that activates the Deep Archive Access tier after 365 days without access.", fr: "Stocker tous les objets dans S3 Intelligent-Tiering, et ajouter une configuration d'archivage Intelligent-Tiering filtrée sur la balise de l'offre Archive qui active le niveau Deep Archive Access après 365 jours sans accès." }
    - id: c
      text: { en: "Store all objects in S3 Intelligent-Tiering, and add a bucket-wide Intelligent-Tiering archive configuration that activates the Deep Archive Access tier after 365 days without access.", fr: "Stocker tous les objets dans S3 Intelligent-Tiering, et ajouter une configuration d'archivage Intelligent-Tiering pour tout le compartiment qui active le niveau Deep Archive Access après 365 jours sans accès." }
    - id: d
      text: { en: "Add an S3 Lifecycle rule that transitions all objects to S3 Standard-IA after 30 days, and a second rule filtered on the Archive plan tag that transitions objects to S3 Glacier Deep Archive after 365 days.", fr: "Ajouter une règle S3 Lifecycle qui fait passer tous les objets dans S3 Standard-IA après 30 jours, et une seconde règle filtrée sur la balise de l'offre Archive qui fait passer les objets dans S3 Glacier Deep Archive après 365 jours." }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 Intelligent-Tiering moves each object between its millisecond tiers according to its own access, with no retrieval fees and no access analysis, which suits unpredictable tenants. The optional Deep Archive Access tier is activated through an archive configuration that can be scoped with an object tag filter, so only Archive-plan objects not accessed for 365 days are archived, and their restores complete within 12 hours."
    fr: "S3 Intelligent-Tiering déplace chaque objet entre ses niveaux à la milliseconde selon ses propres accès, sans frais de récupération ni analyse des accès, ce qui convient à des locataires imprévisibles. Le niveau facultatif Deep Archive Access s'active par une configuration d'archivage qui peut être limitée par un filtre de balise d'objet : seuls les objets de l'offre Archive non consultés depuis 365 jours sont archivés, et leur restauration se termine en 12 heures."
  options:
    a:
      en: "A Lifecycle transition is based on the age of the object, not on its last access, so files that Archive-plan tenants still open every week would be archived after one year."
      fr: "Une transition Lifecycle se base sur l'âge de l'objet, pas sur son dernier accès : des fichiers que les locataires Archive ouvrent encore chaque semaine seraient archivés au bout d'un an."
    c:
      en: "A bucket-wide archive configuration would also archive Premium tenants' files, which must stay readable in milliseconds at any time."
      fr: "Une configuration d'archivage pour tout le compartiment archiverait aussi les fichiers des locataires Premium, qui doivent rester lisibles en millisecondes à tout moment."
    d:
      en: "Standard-IA charges a per-GB retrieval fee, so tenants with frequent reads would pay retrieval fees, and the age-based transition to Deep Archive ignores actual access."
      fr: "Standard-IA facture des frais de récupération au Go : les locataires qui lisent souvent paieraient ces frais, et la transition vers Deep Archive basée sur l'âge ignore les accès réels."
references:
  - title: How S3 Intelligent-Tiering works
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html
  - title: Understanding archive retrieval options
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
