id: sapc03-3b-mrsc-witness
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is designing a new account-balance service for its brokerage platform. The application tier will run only in us-east-1 and us-east-2, and it will store balances in a new Amazon DynamoDB table that is expected to grow to 20 TB with a steady, high write rate.

    The business requires an RPO of zero if either Region fails, and reads that follow a write must be strongly consistent in both Regions. The service does not use DynamoDB transactions, Time to Live (TTL), or local secondary indexes. Regulators allow data to be stored in any US Region. The company wants the lowest replication and storage cost that meets these requirements.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conçoit un nouveau service de soldes de comptes pour sa plateforme de courtage. La couche applicative ne s'exécutera que dans us-east-1 et us-east-2, et elle stockera les soldes dans une nouvelle table Amazon DynamoDB qui devrait atteindre 20 To avec un débit d'écriture élevé et régulier.

    L'entreprise exige un RPO nul en cas de défaillance de l'une ou l'autre Région, et les lectures qui suivent une écriture doivent être fortement cohérentes dans les deux Régions. Le service n'utilise ni les transactions DynamoDB, ni la durée de vie (TTL), ni les index secondaires locaux. Les régulateurs autorisent le stockage des données dans n'importe quelle Région des États-Unis. L'entreprise veut le coût de réplication et de stockage le plus bas qui respecte ces exigences.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a global table in multi-Region eventual consistency (MREC) mode with replicas in us-east-1 and us-east-2.", fr: "Créer une table globale en mode de cohérence éventuelle multi-Régions (MREC) avec des réplicas dans us-east-1 et us-east-2." } }
    - { id: b, text: { en: "Create a global table in multi-Region strong consistency (MRSC) mode with replicas in us-east-1 and us-east-2 and a witness in us-west-2.", fr: "Créer une table globale en mode de cohérence forte multi-Régions (MRSC) avec des réplicas dans us-east-1 et us-east-2 et un témoin (witness) dans us-west-2." } }
    - { id: c, text: { en: "Create a global table in multi-Region strong consistency (MRSC) mode with replicas in us-east-1, us-east-2, and us-west-2.", fr: "Créer une table globale en mode de cohérence forte multi-Régions (MRSC) avec des réplicas dans us-east-1, us-east-2 et us-west-2." } }
    - { id: d, text: { en: "Create the table in us-east-1 with point-in-time recovery, and use AWS Backup to copy a backup to us-east-2 every hour.", fr: "Créer la table dans us-east-1 avec la restauration à un instant dans le passé (PITR), et utiliser AWS Backup pour copier une sauvegarde dans us-east-2 toutes les heures." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Only MRSC global tables provide an RPO of zero and strongly consistent reads across Regions. An MRSC global table must span exactly three Regions, either as three replicas or as two replicas and a witness. A witness takes part in the write quorum but stores no readable copy, and it incurs no replicated write units, storage, or replication data transfer charges, so two replicas plus a witness is the cheapest valid MRSC layout.
    fr: |
      Seules les tables globales MRSC offrent un RPO nul et des lectures fortement cohérentes entre Régions. Une table globale MRSC doit couvrir exactement trois Régions, soit avec trois réplicas, soit avec deux réplicas et un témoin. Un témoin participe au quorum d'écriture mais ne stocke aucune copie lisible, et il n'entraîne ni unités d'écriture répliquée, ni stockage, ni frais de transfert de réplication : deux réplicas plus un témoin est donc la disposition MRSC valide la moins chère.
  options:
    a: { en: "MREC replicates asynchronously, so the RPO equals the replication delay (usually seconds) and reads in the other Region are only eventually consistent.", fr: "MREC réplique de façon asynchrone : le RPO est égal au délai de réplication (généralement quelques secondes) et les lectures dans l'autre Région ne sont qu'éventuellement cohérentes." }
    c: { en: "This meets the requirements, but the third replica stores another 20 TB and is billed replicated write units for every write, which a witness avoids.", fr: "Cette option répond aux exigences, mais le troisième réplica stocke 20 To de plus et se voit facturer des unités d'écriture répliquée pour chaque écriture, ce qu'un témoin évite." }
    d: { en: "Hourly backup copies give an RPO of up to an hour and no strongly consistent reads in us-east-2 until a restore is completed.", fr: "Des copies de sauvegarde horaires donnent un RPO pouvant atteindre une heure, et aucune lecture fortement cohérente dans us-east-2 avant la fin d'une restauration." }
references:
  - title: How DynamoDB global tables work
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
  - title: Understanding Amazon DynamoDB billing for global tables
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/global-tables-billing.html
