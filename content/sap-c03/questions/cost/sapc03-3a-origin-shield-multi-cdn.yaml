id: sapc03-3a-origin-shield-multi-cdn
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany streams on-demand video worldwide. Its origin is a fleet of Amazon EC2 instances behind an Application Load Balancer in the us-east-1 Region that performs just-in-time packaging of each video segment. Most viewers are served by an Amazon CloudFront distribution, but a regulator requires the company to keep a second, non-AWS CDN for one national market, and that CDN pulls segments directly from the load balancer. Origin logs show many duplicate requests for the same segments from CloudFront regional edge caches in several geographic areas and from the second CDN. Packaging compute and data transfer out of the origin have become the largest costs of the platform. The company wants to reduce the origin load and costs while keeping both CDNs.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany diffuse de la vidéo à la demande dans le monde entier. Son origine est une flotte d'instances Amazon EC2 derrière un Application Load Balancer dans la Région us-east-1, qui assure l'empaquetage à la volée (just-in-time packaging) de chaque segment vidéo. La plupart des spectateurs sont servis par une distribution Amazon CloudFront, mais un régulateur impose à l'entreprise de conserver un second CDN, hors AWS, pour un marché national, et ce CDN récupère les segments directement auprès de l'équilibreur de charge. Les journaux de l'origine montrent de nombreuses requêtes en double pour les mêmes segments, provenant des caches périphériques régionaux CloudFront de plusieurs zones géographiques et du second CDN. Le calcul d'empaquetage et le transfert de données sortant de l'origine sont devenus les principaux coûts de la plateforme. L'entreprise veut réduire la charge et les coûts de l'origine tout en conservant les deux CDN.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Enable CloudFront Origin Shield in the eu-west-1 Region, where the largest group of viewers is located, and keep the second CDN pulling segments from the load balancer."
        fr: "Activer CloudFront Origin Shield dans la Région eu-west-1, où se trouve le plus grand groupe de spectateurs, et laisser le second CDN récupérer les segments auprès de l'équilibreur de charge."
    - id: b
      text:
        en: "Enable CloudFront Origin Shield in the us-east-1 Region for the load balancer origin, and configure the second CDN to use the CloudFront distribution as its origin."
        fr: "Activer CloudFront Origin Shield dans la Région us-east-1 pour l'origine de l'équilibreur de charge, et configurer le second CDN pour qu'il utilise la distribution CloudFront comme origine."
    - id: c
      text:
        en: "Add a second Application Load Balancer in another Region as a failover origin in a CloudFront origin group, and point the second CDN to the new load balancer."
        fr: "Ajouter un second Application Load Balancer dans une autre Région comme origine de basculement dans un groupe d'origines CloudFront, et diriger le second CDN vers le nouvel équilibreur de charge."
    - id: d
      text:
        en: "Place AWS Global Accelerator in front of the load balancer, and make the accelerator the origin of both the CloudFront distribution and the second CDN."
        fr: "Placer AWS Global Accelerator devant l'équilibreur de charge, et faire de l'accélérateur l'origine de la distribution CloudFront et du second CDN."
answer: { optionId: b }
explanation:
  correct:
    en: "Origin Shield adds a central caching layer through which all regional edge caches send their origin requests, so each segment is packaged and sent from the origin far fewer times; AWS recommends enabling it in the Region closest to the origin. Using the CloudFront distribution as the origin of the other CDN gives both CDNs a common cache and removes their redundant origin requests, which also helps just-in-time packaging origins reduce compute and data transfer out costs."
    fr: "Origin Shield ajoute une couche de cache centrale par laquelle passent les requêtes à l'origine de tous les caches périphériques régionaux : chaque segment est donc empaqueté et envoyé par l'origine bien moins souvent ; AWS recommande de l'activer dans la Région la plus proche de l'origine. Utiliser la distribution CloudFront comme origine de l'autre CDN donne aux deux CDN un cache commun et supprime leurs requêtes redondantes à l'origine, ce qui aide aussi les origines d'empaquetage à la volée à réduire les coûts de calcul et de transfert de données sortant."
  options:
    a:
      en: "Origin Shield should be in the Region with the lowest latency to the origin, not near the viewers, and the second CDN would keep sending its duplicate requests to the origin."
      fr: "Origin Shield doit se trouver dans la Région la plus proche de l'origine en latence, pas près des spectateurs, et le second CDN continuerait d'envoyer ses requêtes en double à l'origine."
    c:
      en: "An origin group adds availability, but the origins still receive the same duplicate requests, and a second packaging fleet adds cost."
      fr: "Un groupe d'origines améliore la disponibilité, mais les origines reçoivent toujours les mêmes requêtes en double, et une seconde flotte d'empaquetage ajoute des coûts."
    d:
      en: "Global Accelerator improves the network path but caches nothing, so every duplicate request still reaches the packaging fleet, and the accelerator adds its own charges."
      fr: "Global Accelerator améliore le chemin réseau mais ne met rien en cache : chaque requête en double atteint toujours la flotte d'empaquetage, et l'accélérateur ajoute ses propres frais."
references:
  - title: "Use Amazon CloudFront Origin Shield"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html
