id: sapc03-3a-graviton-multiarch-ecs
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 30 microservices on Amazon ECS on EC2 with an Auto Scaling group of c6i instances. Twenty-nine services are written in Java or Node.js with open-source dependencies that publish arm64 builds. One service depends on a proprietary native library that the vendor provides only for x86_64. AWS CodeBuild builds the images and pushes them to Amazon ECR, and each service version must keep a single image tag. The company wants to lower compute costs by moving every compatible service to AWS Graviton without rewriting application code. The incompatible service must keep running with its current performance.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 30 microservices sur Amazon ECS sur EC2 avec un groupe Auto Scaling d'instances c6i. Vingt-neuf services sont écrits en Java ou en Node.js avec des dépendances open source qui publient des builds arm64. Un service dépend d'une bibliothèque native propriétaire que l'éditeur ne fournit que pour x86_64. AWS CodeBuild génère les images et les pousse dans Amazon ECR, et chaque version de service doit conserver une seule balise d'image. L'entreprise veut réduire les coûts de calcul en migrant chaque service compatible vers AWS Graviton sans réécrire le code applicatif. Le service incompatible doit continuer à tourner avec ses performances actuelles.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Replace the c6i Auto Scaling group with a c7g Auto Scaling group for all 30 services, and run the incompatible service under x86_64 emulation in its container image."
        fr: "Remplacer le groupe Auto Scaling c6i par un groupe Auto Scaling c7g pour les 30 services, et exécuter le service incompatible sous émulation x86_64 dans son image de conteneur."
    - id: b
      text:
        en: "Build multi-architecture images under one tag, run the compatible services with the ARM64 setting on a Graviton capacity provider, and keep x86 capacity for the other service."
        fr: "Générer des images multi-architectures sous une seule balise, exécuter les services compatibles avec le paramètre ARM64 sur un fournisseur de capacité Graviton, et conserver une capacité x86 pour l'autre service."
    - id: c
      text:
        en: "Keep all services on the c6i Auto Scaling group, and purchase a 3-year EC2 Instance Savings Plan for the C6i instance family in the Region to lower the hourly rate."
        fr: "Conserver tous les services sur le groupe Auto Scaling c6i, et acheter un EC2 Instance Savings Plan sur 3 ans pour la famille d'instances C6i dans la Région afin de réduire le tarif horaire."
    - id: d
      text:
        en: "Migrate the 29 compatible services to AWS Lambda functions with the arm64 architecture, and keep the incompatible service on the existing c6i Auto Scaling group."
        fr: "Migrer les 29 services compatibles vers des fonctions AWS Lambda avec l'architecture arm64, et conserver le service incompatible sur le groupe Auto Scaling c6i existant."
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon ECS runs 64-bit ARM tasks on Graviton instances, and a multi-architecture image lets one tag serve both arm64 and x86_64 hosts, so every service keeps a single tag. Placing compatible services on a Graviton capacity provider gives better price performance, while the service with the x86-only library keeps running natively on x86 capacity."
    fr: "Amazon ECS exécute des tâches ARM 64 bits sur des instances Graviton, et une image multi-architecture permet à une même balise de servir des hôtes arm64 et x86_64 : chaque service conserve donc une seule balise. Placer les services compatibles sur un fournisseur de capacité Graviton améliore le rapport prix/performances, tandis que le service doté de la bibliothèque x86 uniquement continue de tourner nativement sur une capacité x86."
  options:
    a:
      en: "Emulating x86_64 on Graviton degrades the performance of the incompatible service, which must keep its current performance."
      fr: "Émuler x86_64 sur Graviton dégrade les performances du service incompatible, qui doit conserver ses performances actuelles."
    c:
      en: "A Savings Plan lowers the rate of the current instances but does not move any service to Graviton, which is what the company wants."
      fr: "Un Savings Plan réduit le tarif des instances actuelles mais ne migre aucun service vers Graviton, ce que l'entreprise souhaite."
    d:
      en: "Moving long-running Java and Node.js microservices to Lambda functions requires rewriting and repackaging the applications, which the company wants to avoid."
      fr: "Migrer des microservices Java et Node.js de longue durée vers des fonctions Lambda impose de réécrire et de réempaqueter les applications, ce que l'entreprise veut éviter."
references:
  - title: "Amazon ECS task definitions for 64-bit ARM workloads"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-arm64.html
