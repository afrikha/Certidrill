id: sapc03-3a-sqs-batch-window-cost
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany collects telemetry from industrial sensors. An Amazon SQS standard queue receives about 20,000 small messages per second, and an AWS Lambda function processes them through an event source mapping with a batch size of 1. Each invocation transforms one message and writes it to an Amazon S3 data lake, and most of the billed duration is fixed per-invocation overhead. Message order does not matter, and the business accepts that data arrives in the data lake up to 60 seconds after it is sent. The company wants to reduce the Lambda cost of the pipeline.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany collecte la télémétrie de capteurs industriels. Une file d'attente Amazon SQS standard reçoit environ 20 000 petits messages par seconde, et une fonction AWS Lambda les traite via un mappage de source d'événements avec une taille de lot de 1. Chaque appel transforme un message et l'écrit dans un lac de données Amazon S3, et la majeure partie de la durée facturée correspond à un surcoût fixe par appel. L'ordre des messages n'a pas d'importance, et le métier accepte que les données arrivent dans le lac de données jusqu'à 60 secondes après leur envoi. L'entreprise veut réduire le coût Lambda du pipeline.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Enable provisioned mode on the event source mapping with a high minimum number of pollers, and keep the batch size of 1."
        fr: "Activer le mode provisionné sur le mappage de source d'événements avec un nombre minimal élevé d'interrogateurs (pollers), et conserver la taille de lot de 1."
    - id: b
      text:
        en: "Replace the standard queue with an SQS FIFO queue, and set the batch size of the event source mapping to 10 messages."
        fr: "Remplacer la file d'attente standard par une file d'attente SQS FIFO, et définir la taille de lot du mappage de source d'événements à 10 messages."
    - id: c
      text:
        en: "Raise the batch size to 1,000 messages with a 30-second maximum batching window, and report partial batch failures from the function."
        fr: "Porter la taille de lot à 1 000 messages avec une fenêtre de traitement par lots maximale de 30 secondes, et signaler les échecs partiels de lot depuis la fonction."
    - id: d
      text:
        en: "Increase the memory of the function to shorten each invocation, and configure reserved concurrency to cap the number of concurrent invocations."
        fr: "Augmenter la mémoire de la fonction pour raccourcir chaque appel, et configurer une simultanéité réservée pour plafonner le nombre d'appels simultanés."
answer: { optionId: c }
explanation:
  correct:
    en: "For standard queues, an event source mapping can deliver up to 10,000 records per batch when a batching window of at least 1 second is set, so each invocation processes many messages and the fixed overhead is paid far less often. Partial batch responses return only failed messages to the queue, and a 30-second window stays within the accepted 60-second delay."
    fr: "Pour les files d'attente standard, un mappage de source d'événements peut livrer jusqu'à 10 000 enregistrements par lot lorsqu'une fenêtre de traitement par lots d'au moins 1 seconde est définie : chaque appel traite donc de nombreux messages, et le surcoût fixe est payé bien moins souvent. Les réponses de lot partielles ne renvoient dans la file que les messages en échec, et une fenêtre de 30 secondes reste dans le délai accepté de 60 secondes."
  options:
    a:
      en: "Provisioned mode adds dedicated pollers for throughput, but with a batch size of 1 the number of invocations, and therefore the overhead, stays the same."
      fr: "Le mode provisionné ajoute des interrogateurs dédiés pour le débit, mais avec une taille de lot de 1 le nombre d'appels, et donc le surcoût, reste identique."
    b:
      en: "FIFO queues limit batches to 10 messages and add ordering that the workload does not need, so the reduction in invocations is much smaller."
      fr: "Les files FIFO limitent les lots à 10 messages et ajoutent un ordre dont la charge de travail n'a pas besoin : la réduction du nombre d'appels est donc bien plus faible."
    d:
      en: "More memory raises the price of each millisecond and does not remove the per-invocation overhead, and reserved concurrency only caps scaling."
      fr: "Plus de mémoire augmente le prix de chaque milliseconde sans supprimer le surcoût par appel, et la simultanéité réservée ne fait que plafonner la mise à l'échelle."
references:
  - title: "Creating and configuring an Amazon SQS event source mapping"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
