id: sapc03-3a-eks-same-zone-routing
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs 40 microservices on an Amazon EKS cluster whose nodes are spread across three Availability Zones. An Application Load Balancer created by the AWS Load Balancer Controller in instance target mode sends traffic to the services, and the services call one another through Kubernetes Services. The Cost and Usage Report shows that regional data transfer between Availability Zones has become one of the largest charges of the cluster. Every service runs several replicas in each Availability Zone. The reliability team requires every service to keep running in all three Availability Zones and to keep serving requests if one Availability Zone fails. The company wants to reduce inter-AZ data transfer charges.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 40 microservices sur un cluster Amazon EKS dont les nœuds sont répartis sur trois zones de disponibilité. Un Application Load Balancer créé par l'AWS Load Balancer Controller en mode de cible instance envoie le trafic aux services, et les services s'appellent entre eux via des Services Kubernetes. Le Cost and Usage Report montre que le transfert de données régional entre zones de disponibilité est devenu l'un des principaux postes de coût du cluster. Chaque service exécute plusieurs réplicas dans chaque zone de disponibilité. L'équipe de fiabilité exige que chaque service continue de tourner dans les trois zones de disponibilité et continue de répondre aux requêtes si une zone de disponibilité tombe en panne. L'entreprise veut réduire les frais de transfert de données entre zones de disponibilité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Move all node groups to a single Availability Zone, and keep a standby node group in a second Availability Zone with a desired capacity of zero."
        fr: "Déplacer tous les groupes de nœuds dans une seule zone de disponibilité, et conserver un groupe de nœuds de secours dans une deuxième zone de disponibilité avec une capacité souhaitée de zéro."
    - id: b
      text:
        en: "Set internalTrafficPolicy to Local on every Kubernetes Service so that pods only call endpoints on the same node, and keep the ALB in instance target mode."
        fr: "Définir internalTrafficPolicy sur Local pour chaque Service Kubernetes afin que les pods n'appellent que des points de terminaison du même nœud, et conserver l'ALB en mode de cible instance."
    - id: c
      text:
        en: "Replace the ALB with a Network Load Balancer in instance target mode, and turn on cross-zone load balancing so that traffic is spread evenly across all nodes."
        fr: "Remplacer l'ALB par un Network Load Balancer en mode de cible instance, et activer l'équilibrage de charge entre zones pour répartir le trafic uniformément sur tous les nœuds."
    - id: d
      text:
        en: "Switch the load balancer controller to IP target mode, set trafficDistribution to PreferClose on the Services, and spread replicas evenly across zones."
        fr: "Passer le contrôleur d'équilibreur de charge en mode de cible IP, définir trafficDistribution sur PreferClose dans les Services, et répartir uniformément les réplicas entre les zones."
answer: { optionId: d }
explanation:
  correct:
    en: "In instance mode, kube-proxy on the receiving node can forward a request to a pod in another Availability Zone, whereas IP mode sends traffic from the load balancer directly to the pods. PreferClose makes Services prefer endpoints in the same zone and fall back to other zones when none is available, and even replica spreading avoids overloading one zone, so cross-AZ traffic drops while every zone keeps serving and failover still works."
    fr: "En mode instance, kube-proxy sur le nœud destinataire peut transmettre une requête à un pod d'une autre zone de disponibilité, alors que le mode IP envoie le trafic de l'équilibreur de charge directement aux pods. PreferClose fait préférer aux Services les points de terminaison de la même zone, avec repli vers les autres zones si aucun n'est disponible, et une répartition uniforme des réplicas évite de surcharger une zone : le trafic entre zones diminue, chaque zone continue de servir et le basculement fonctionne toujours."
  options:
    a:
      en: "A single active Availability Zone removes most inter-AZ traffic but breaks the requirement to run in all three zones and to keep serving during a zone failure."
      fr: "Une seule zone de disponibilité active supprime l'essentiel du trafic entre zones, mais enfreint l'exigence de tourner dans les trois zones et de continuer à servir pendant la panne d'une zone."
    b:
      en: "internalTrafficPolicy Local drops traffic when the node has no local endpoint, which hurts availability, and instance mode keeps sending load balancer traffic across zones."
      fr: "internalTrafficPolicy Local abandonne le trafic lorsque le nœud n'a aucun point de terminaison local, ce qui nuit à la disponibilité, et le mode instance continue d'envoyer le trafic de l'équilibreur entre les zones."
    c:
      en: "Cross-zone load balancing sends traffic to nodes in every zone by design, and instance mode still adds kube-proxy hops, so inter-AZ traffic does not go down."
      fr: "L'équilibrage de charge entre zones envoie par conception le trafic vers des nœuds de toutes les zones, et le mode instance ajoute toujours des sauts kube-proxy : le trafic entre zones ne diminue pas."
references:
  - title: "Cost Optimization - Networking"
    url: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
