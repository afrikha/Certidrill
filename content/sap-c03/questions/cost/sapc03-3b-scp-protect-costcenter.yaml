id: sapc03-3b-scp-protect-costcenter
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's workload teams have administrator permissions in their own member accounts. The FinOps team sets the CostCenter tag on EC2 instances and EBS volumes through an automation role named FinOpsTagger that exists in every member account.

    Several teams have changed or removed the CostCenter tag on their resources, which breaks the monthly chargeback. The FinOps team requires that only the FinOpsTagger role can add, change, or remove the CostCenter tag on EC2 resources in member accounts. The teams must keep managing all their other tags, and the control must be preventive and apply even to account administrators.

    Which solution will meet these requirements?
  fr: |
    Les équipes de charges de travail d'AnyCompany ont des autorisations d'administrateur dans leurs propres comptes membres. L'équipe FinOps définit la balise CostCenter sur les instances EC2 et les volumes EBS par un rôle d'automatisation nommé FinOpsTagger qui existe dans chaque compte membre.

    Plusieurs équipes ont modifié ou supprimé la balise CostCenter de leurs ressources, ce qui casse la refacturation mensuelle. L'équipe FinOps exige que seul le rôle FinOpsTagger puisse ajouter, modifier ou supprimer la balise CostCenter des ressources EC2 dans les comptes membres. Les équipes doivent continuer à gérer toutes leurs autres balises, et le contrôle doit être préventif et s'appliquer même aux administrateurs des comptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP that denies ec2:CreateTags and ec2:DeleteTags when aws:TagKeys contains CostCenter and aws:PrincipalArn does not match the FinOpsTagger role.", fr: "Attacher une SCP qui refuse ec2:CreateTags et ec2:DeleteTags lorsque aws:TagKeys contient CostCenter et que aws:PrincipalArn ne correspond pas au rôle FinOpsTagger." } }
    - { id: b, text: { en: "Attach a tag policy that defines the CostCenter key and its allowed values, and enforces them for ec2:instance and ec2:volume.", fr: "Attacher une politique de balises qui définit la clé CostCenter et ses valeurs autorisées, et les applique à ec2:instance et ec2:volume." } }
    - { id: c, text: { en: "Attach a permissions boundary to every team role that denies tagging actions on the CostCenter key, and ask the teams not to remove it.", fr: "Attacher à chaque rôle d'équipe une limite d'autorisations qui refuse les actions de balisage sur la clé CostCenter, et demander aux équipes de ne pas la retirer." } }
    - { id: d, text: { en: "Deploy an AWS Config rule that detects changes to the CostCenter tag, with an automatic remediation that restores the previous value.", fr: "Déployer une règle AWS Config qui détecte les modifications de la balise CostCenter, avec une correction automatique qui restaure la valeur précédente." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An SCP applies to every principal in the member accounts, including administrators, and the aws:TagKeys condition key controls whether specific tag keys can be in a tagging request. Denying ec2:CreateTags and ec2:DeleteTags only when CostCenter is in the request and the caller is not the FinOpsTagger role protects that one key while leaving all other tags under team control. SCPs do not grant permissions, so the FinOpsTagger role keeps its own IAM permissions.
    fr: |
      Une SCP s'applique à tous les principaux des comptes membres, y compris les administrateurs, et la clé de condition aws:TagKeys contrôle si des clés de balises précises peuvent figurer dans une requête de balisage. Refuser ec2:CreateTags et ec2:DeleteTags seulement lorsque CostCenter est dans la requête et que l'appelant n'est pas le rôle FinOpsTagger protège cette seule clé et laisse toutes les autres balises sous le contrôle des équipes. Les SCP n'accordent pas d'autorisations : le rôle FinOpsTagger conserve ses propres autorisations IAM.
  options:
    b: { en: "A tag policy controls which values are allowed, not which principal may change the tag, so a team could still replace one approved value with another or remove the tag.", fr: "Une politique de balises contrôle les valeurs autorisées, pas le principal qui peut modifier la balise : une équipe pourrait toujours remplacer une valeur approuvée par une autre ou retirer la balise." }
    c: { en: "Account administrators can modify or detach a permissions boundary on their own roles, so the control is not enforced against them.", fr: "Les administrateurs de compte peuvent modifier ou détacher une limite d'autorisations sur leurs propres rôles : le contrôle ne s'impose donc pas à eux." }
    d: { en: "AWS Config is detective: the tag is wrong until remediation runs, and the requirement is a preventive control.", fr: "AWS Config est un contrôle de détection : la balise reste fausse jusqu'à l'exécution de la correction, alors que l'exigence est un contrôle préventif." }
references:
  - title: Controlling access to AWS resources using tags
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_tags.html
