id: sapc03-3c-aurora-io-optimized
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a payments platform on an Amazon Aurora MySQL-Compatible Edition DB cluster that uses the Aurora Standard storage configuration and non-NVMe-based DB instances. AWS Cost Explorer shows that read and write I/O charges represent about 40% of the cluster's monthly cost, and the I/O rate is high and stable all month. The writer and two readers are correctly sized according to CloudWatch, and the application team cannot change the application code or the database engine this year. The company wants a lower and more predictable database bill without downtime.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une plateforme de paiements sur un cluster de bases de données Amazon Aurora MySQL-Compatible Edition qui utilise la configuration de stockage Aurora Standard et des instances de base de données non basées sur NVMe. AWS Cost Explorer montre que les frais d'E/S de lecture et d'écriture représentent environ 40 % du coût mensuel du cluster, et que le débit d'E/S est élevé et stable tout le mois. L'instance d'écriture et les deux instances de lecture sont correctement dimensionnées selon CloudWatch, et l'équipe applicative ne peut modifier ni le code de l'application ni le moteur de base de données cette année. L'entreprise veut une facture de base de données plus basse et plus prévisible, sans interruption de service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Convert the writer and readers to Aurora Serverless v2 so that compute capacity follows the load and the I/O is billed only when used.", fr: "Convertir l'instance d'écriture et les instances de lecture en Aurora Serverless v2 pour que la capacité de calcul suive la charge et que les E/S ne soient facturées qu'à l'utilisation." }
    - id: b
      text: { en: "Add an Amazon ElastiCache for Valkey cluster in front of the database so that most reads no longer reach Aurora storage.", fr: "Ajouter un cluster Amazon ElastiCache for Valkey devant la base de données pour que la plupart des lectures n'atteignent plus le stockage Aurora." }
    - id: c
      text: { en: "Modify the DB cluster storage configuration to Aurora I/O-Optimized.", fr: "Modifier la configuration de stockage du cluster de bases de données en Aurora I/O-Optimized." }
    - id: d
      text: { en: "Migrate the database to Amazon RDS for MySQL on Provisioned IOPS SSD (io2) storage, where IOPS are billed at a fixed provisioned rate.", fr: "Migrer la base de données vers Amazon RDS for MySQL sur un stockage Provisioned IOPS SSD (io2), où les IOPS sont facturées à un tarif provisionné fixe." }
answer: { optionId: c }
explanation:
  correct:
    en: "With Aurora I/O-Optimized, instance and storage prices are higher but read and write I/O are not charged, which AWS recommends when I/O is 25% or more of Aurora spend. At 40%, the switch lowers the bill and makes it predictable. Switching from Standard is allowed once every 30 days and needs no downtime on non-NVMe-based instances."
    fr: "Avec Aurora I/O-Optimized, les prix des instances et du stockage sont plus élevés mais les E/S de lecture et d'écriture ne sont pas facturées, ce qu'AWS recommande lorsque les E/S représentent 25 % ou plus des dépenses Aurora. À 40 %, le changement réduit la facture et la rend prévisible. Le passage depuis Standard est autorisé une fois tous les 30 jours et ne nécessite aucune interruption sur les instances non basées sur NVMe."
  options:
    a:
      en: "Aurora Serverless v2 changes how compute is billed, not storage I/O; with Aurora Standard the I/O charges remain, and correctly sized instances under a stable load gain nothing from scaling."
      fr: "Aurora Serverless v2 change la facturation du calcul, pas des E/S de stockage : avec Aurora Standard, les frais d'E/S demeurent, et des instances bien dimensionnées sous une charge stable ne gagnent rien à la mise à l'échelle."
    b:
      en: "A cache requires application code changes to read from ElastiCache, which the team cannot make, and it adds a new cluster to pay for."
      fr: "Un cache exige de modifier le code de l'application pour lire depuis ElastiCache, ce que l'équipe ne peut pas faire, et il ajoute un nouveau cluster à payer."
    d:
      en: "A migration to RDS for MySQL is a platform change with a cutover, and provisioned io2 IOPS add their own charges, so it is neither simpler nor guaranteed to be cheaper."
      fr: "Une migration vers RDS for MySQL est un changement de plateforme avec bascule, et les IOPS io2 provisionnées ajoutent leurs propres frais : ce n'est ni plus simple ni assurément moins cher."
references:
  - title: Amazon Aurora storage
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.StorageReliability.html
