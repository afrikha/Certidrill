id: sapc03-3c-rds-export-deep-archive
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a 6 TB Amazon RDS for PostgreSQL DB instance for its insurance claims system. A regulation requires that the company keep a year-end copy of the claims data for 10 years. Auditors query these copies with SQL about once a year and give at least three days of notice. The copies will never be used to restore a running database, because the schema changes every year. Automated backups are already kept for 14 days for operational recovery. The company wants the lowest storage cost for the 10-year copies with the least ongoing effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une instance de base de données Amazon RDS for PostgreSQL de 6 To pour son système de gestion des sinistres. Une réglementation exige que l'entreprise conserve pendant 10 ans une copie de fin d'année des données de sinistres. Les auditeurs interrogent ces copies en SQL environ une fois par an et donnent au moins trois jours de préavis. Les copies ne serviront jamais à restaurer une base de données en fonctionnement, car le schéma change chaque année. Les sauvegardes automatiques sont déjà conservées 14 jours pour la reprise opérationnelle. L'entreprise veut le coût de stockage le plus bas pour les copies sur 10 ans avec le moins d'effort continu.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a yearly rule to an AWS Backup plan for the DB instance that moves recovery points to cold storage after 1 day and deletes them after 10 years.", fr: "Ajouter à un plan AWS Backup de l'instance de base de données une règle annuelle qui déplace les points de récupération vers le stockage à froid après 1 jour et les supprime après 10 ans." }
    - id: b
      text: { en: "Export each year-end snapshot to Amazon S3 in Apache Parquet format, apply an S3 Lifecycle rule that transitions the export to S3 Glacier Deep Archive, and restore and query it with Amazon Athena when auditors ask.", fr: "Exporter chaque instantané de fin d'année vers Amazon S3 au format Apache Parquet, appliquer une règle S3 Lifecycle qui fait passer l'export dans S3 Glacier Deep Archive, puis le restaurer et l'interroger avec Amazon Athena à la demande des auditeurs." }
    - id: c
      text: { en: "Take a manual DB snapshot at each year end and keep it for 10 years, then restore it to a temporary DB instance when auditors ask.", fr: "Créer un instantané de base de données manuel à chaque fin d'année et le conserver 10 ans, puis le restaurer dans une instance de base de données temporaire à la demande des auditeurs." }
    - id: d
      text: { en: "Create a cross-Region read replica at each year end, promote it, stop it, and start it only when auditors ask.", fr: "Créer un réplica en lecture entre Régions à chaque fin d'année, le promouvoir, l'arrêter et ne le démarrer qu'à la demande des auditeurs." }
answer: { optionId: b }
explanation:
  correct:
    en: "RDS snapshot export writes the data to Amazon S3 as compressed Apache Parquet files that Athena can query directly. Because the copies never need to become a database again, the fact that an export cannot be restored to a DB instance does not matter. S3 Glacier Deep Archive is the lowest-cost storage class, and a restore within 12 to 48 hours fits the three days of notice."
    fr: "L'export d'instantané RDS écrit les données dans Amazon S3 sous forme de fichiers Apache Parquet compressés qu'Athena peut interroger directement. Comme les copies n'ont jamais à redevenir une base de données, le fait qu'un export ne puisse pas être restauré dans une instance n'a pas d'importance. S3 Glacier Deep Archive est la classe de stockage la moins chère, et une restauration en 12 à 48 heures respecte les trois jours de préavis."
  options:
    a:
      en: "AWS Backup does not support cold storage for Amazon RDS, so the setting is ignored and the 10 recovery points stay at warm snapshot storage prices."
      fr: "AWS Backup ne prend pas en charge le stockage à froid pour Amazon RDS : le paramètre est ignoré et les 10 points de récupération restent au prix du stockage chaud des instantanés."
    c:
      en: "Manual snapshots are billed at RDS snapshot storage prices for 10 years, which is far more expensive than Parquet files in Glacier Deep Archive, and each audit needs a temporary DB instance."
      fr: "Les instantanés manuels sont facturés au prix du stockage d'instantanés RDS pendant 10 ans, bien plus cher que des fichiers Parquet dans Glacier Deep Archive, et chaque audit nécessite une instance temporaire."
    d:
      en: "A stopped DB instance still pays for its storage and is started again automatically after seven days, so ten yearly instances would generate large ongoing costs and effort."
      fr: "Une instance de base de données arrêtée paie toujours son stockage et redémarre automatiquement au bout de sept jours : dix instances annuelles généreraient des coûts et un effort continus importants."
references:
  - title: Exporting DB snapshot data to Amazon S3 for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ExportSnapshot.html
  - title: AWS Backup feature availability
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html
