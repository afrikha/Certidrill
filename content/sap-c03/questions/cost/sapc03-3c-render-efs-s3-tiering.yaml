id: sapc03-3c-render-efs-s3-tiering
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a rendering pipeline on Amazon EC2 instances in three Availability Zones. Render nodes write frames to a shared Amazon EFS Regional file system that uses Elastic throughput. After 14 days, frames are rarely reopened, but they must remain available under the same paths and in multiple Availability Zones for the rest of the project. Finished masters are uploaded to an S3 bucket in S3 Standard and must be kept for 7 years. After 30 days, masters are read only for legal requests, and the legal team accepts a delay of 48 hours to get a file.

    Which combination of actions will reduce storage costs MOST while meeting these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute un pipeline de rendu sur des instances Amazon EC2 réparties dans trois zones de disponibilité. Les nœuds de rendu écrivent les images dans un système de fichiers Amazon EFS régional partagé qui utilise le débit Elastic. Après 14 jours, les images sont rarement rouvertes, mais elles doivent rester disponibles sous les mêmes chemins et dans plusieurs zones de disponibilité jusqu'à la fin du projet. Les masters terminés sont chargés dans un compartiment S3 en S3 Standard et doivent être conservés 7 ans. Après 30 jours, les masters ne sont lus que pour des demandes juridiques, et l'équipe juridique accepte un délai de 48 heures pour obtenir un fichier.

    Quelle combinaison d'actions réduit le PLUS les coûts de stockage tout en répondant à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the EFS lifecycle policy to transition files into Infrequent Access after 14 days without access.", fr: "Définir la politique de cycle de vie EFS pour faire passer les fichiers dans Infrequent Access après 14 jours sans accès." } }
    - { id: b, text: { en: "Move the frames to a new EFS One Zone file system with a lifecycle policy that transitions files into Infrequent Access after 14 days.", fr: "Déplacer les images vers un nouveau système de fichiers EFS One Zone avec une politique de cycle de vie qui fait passer les fichiers dans Infrequent Access après 14 jours." } }
    - { id: c, text: { en: "Add an S3 Lifecycle rule that transitions the masters to S3 Glacier Deep Archive 30 days after creation.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les masters dans S3 Glacier Deep Archive 30 jours après leur création." } }
    - { id: d, text: { en: "Upload the masters to S3 Intelligent-Tiering and activate the Deep Archive Access tier after 180 days without access.", fr: "Charger les masters dans S3 Intelligent-Tiering et activer le niveau Deep Archive Access après 180 jours sans accès." } }
    - { id: e, text: { en: "Schedule an AWS DataSync task that moves frames older than 14 days from Amazon EFS to S3 Glacier Flexible Retrieval.", fr: "Planifier une tâche AWS DataSync qui déplace les images de plus de 14 jours d'Amazon EFS vers S3 Glacier Flexible Retrieval." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "An EFS lifecycle policy moves files not accessed for the chosen period to Infrequent Access while they stay in the same directory tree of the Regional file system. For the masters, a Lifecycle transition to S3 Glacier Deep Archive after 30 days gives the lowest storage price, and its bulk restores complete within 48 hours."
    fr: "Une politique de cycle de vie EFS déplace vers Infrequent Access les fichiers non consultés pendant la période choisie, tout en les laissant dans la même arborescence du système de fichiers régional. Pour les masters, une transition Lifecycle vers S3 Glacier Deep Archive après 30 jours donne le prix de stockage le plus bas, et ses restaurations bulk se terminent en 48 heures."
  options:
    b:
      en: "EFS One Zone stores data in a single Availability Zone, which breaks the requirement to keep the frames available in multiple Availability Zones, and the move changes the paths."
      fr: "EFS One Zone stocke les données dans une seule zone de disponibilité, ce qui enfreint l'exigence de disponibilité des images dans plusieurs zones, et le déplacement change les chemins."
    d:
      en: "The masters would stay at least 180 days in the more expensive Intelligent-Tiering tiers and pay a monitoring charge, so this costs more than transitioning to Deep Archive at day 30."
      fr: "Les masters resteraient au moins 180 jours dans les niveaux Intelligent-Tiering plus chers et paieraient des frais de surveillance : c'est plus cher qu'une transition vers Deep Archive au jour 30."
    e:
      en: "Moving the frames out of EFS removes them from their paths, so the render nodes could no longer open them without a restore and a copy back."
      fr: "Déplacer les images hors d'EFS les retire de leurs chemins : les nœuds de rendu ne pourraient plus les ouvrir sans restauration ni recopie."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
  - title: Understanding archive retrieval options
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
