id: sapc03-3c-anomaly-managed-accounts
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an organization in AWS Organizations with 300 member accounts, and Account Factory in AWS Control Tower creates several new accounts every week. Spending in most accounts is seasonal, so fixed budget thresholds raise many false alarms. The FinOps team wants to detect unusual spend in each member account separately, so that a spike in one small account is not hidden by the total of the others. New accounts must be covered automatically, without anyone editing a list of accounts. The on-call engineer must be notified through an Amazon SNS topic as soon as an anomaly is detected.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose d'une organisation AWS Organizations de 300 comptes membres, et Account Factory d'AWS Control Tower crée plusieurs nouveaux comptes chaque semaine. Les dépenses de la plupart des comptes sont saisonnières : des seuils budgétaires fixes déclenchent donc de nombreuses fausses alertes. L'équipe FinOps veut détecter les dépenses inhabituelles de chaque compte membre séparément, afin qu'un pic dans un petit compte ne soit pas masqué par le total des autres. Les nouveaux comptes doivent être couverts automatiquement, sans que personne ne modifie une liste de comptes. L'ingénieur d'astreinte doit être averti via une rubrique Amazon SNS dès qu'une anomalie est détectée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "In the management account, create an AWS managed Cost Anomaly Detection monitor for the linked account dimension, and add an alert subscription with individual alerts sent to the SNS topic.", fr: "Dans le compte de gestion, créer un moniteur Cost Anomaly Detection géré par AWS pour la dimension des comptes liés, et ajouter un abonnement aux alertes avec des alertes individuelles envoyées à la rubrique SNS." }
    - id: b
      text: { en: "In the management account, create customer managed Cost Anomaly Detection monitors of 10 linked accounts each, and add an alert subscription with individual alerts sent to the SNS topic.", fr: "Dans le compte de gestion, créer des moniteurs Cost Anomaly Detection gérés par le client de 10 comptes liés chacun, et ajouter un abonnement aux alertes avec des alertes individuelles envoyées à la rubrique SNS." }
    - id: c
      text: { en: "Use an AWS Control Tower account customization to create an AWS services monitor and an individual-alert subscription to the SNS topic in every new and existing member account.", fr: "Utiliser une personnalisation de compte AWS Control Tower pour créer un moniteur des services AWS et un abonnement aux alertes individuelles vers la rubrique SNS dans chaque compte membre, nouveau ou existant." }
    - id: d
      text: { en: "In the management account, create an AWS managed Cost Anomaly Detection monitor for the linked account dimension, and add an alert subscription with a daily summary sent to the SNS topic.", fr: "Dans le compte de gestion, créer un moniteur Cost Anomaly Detection géré par AWS pour la dimension des comptes liés, et ajouter un abonnement aux alertes avec un résumé quotidien envoyé à la rubrique SNS." }
answer: { optionId: a }
explanation:
  correct:
    en: "An AWS managed monitor for linked accounts, created in the management account, evaluates every member account independently and automatically includes accounts added later, up to 5,000 values. Individual alerts are sent as soon as an anomaly is detected and are the frequency that uses an SNS topic."
    fr: "Un moniteur géré par AWS pour les comptes liés, créé dans le compte de gestion, évalue chaque compte membre indépendamment et inclut automatiquement les comptes ajoutés plus tard, jusqu'à 5 000 valeurs. Les alertes individuelles sont envoyées dès qu'une anomalie est détectée et constituent la fréquence qui utilise une rubrique SNS."
  options:
    b:
      en: "A customer managed monitor aggregates up to 10 selected accounts, so a spike in one account is diluted in the group, and the lists must be edited each time an account is created."
      fr: "Un moniteur géré par le client agrège jusqu'à 10 comptes sélectionnés : un pic dans un compte est dilué dans le groupe, et les listes doivent être modifiées à chaque création de compte."
    c:
      en: "Creating and maintaining a monitor and a subscription in 300 accounts through a customization pipeline adds work that a single organization-level monitor avoids, and each account's monitors are visible only in that account."
      fr: "Créer et maintenir un moniteur et un abonnement dans 300 comptes via un pipeline de personnalisation ajoute un travail qu'un seul moniteur au niveau de l'organisation évite, et les moniteurs de chaque compte ne sont visibles que dans ce compte."
    d:
      en: "Daily and weekly summaries are emails that require email recipients and arrive once a day, so the on-call engineer is not notified through SNS as soon as the anomaly is detected."
      fr: "Les résumés quotidiens et hebdomadaires sont des e-mails qui exigent des destinataires e-mail et arrivent une fois par jour : l'ingénieur d'astreinte n'est pas averti via SNS dès la détection."
references:
  - title: Getting started with AWS Cost Anomaly Detection
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html
