id: sapc03-3a-compression-versioned-assets
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves a single-page application to millions of users through an Amazon CloudFront distribution with an Amazon S3 origin. The JavaScript and CSS bundles are 2 MB to 5 MB each and are stored uncompressed in S3. The bundle file names never change, so the cache policy uses a 5-minute TTL, and the deployment pipeline creates an invalidation for all paths after each of the 30 daily deployments. Data transfer out from CloudFront and requests to the S3 origin are the largest costs of the application. Users must receive a new version within 5 minutes of a deployment.

    Which combination of actions will meet these requirements MOST cost-effectively? (Choose two.)
  fr: |
    AnyCompany sert une application monopage à des millions d'utilisateurs via une distribution Amazon CloudFront avec une origine Amazon S3. Les bundles JavaScript et CSS pèsent de 2 Mo à 5 Mo chacun et sont stockés non compressés dans S3. Les noms des fichiers de bundles ne changent jamais : la politique de cache utilise donc une TTL de 5 minutes, et le pipeline de déploiement crée une invalidation de tous les chemins après chacun des 30 déploiements quotidiens. Le transfert de données sortant de CloudFront et les requêtes vers l'origine S3 sont les principaux coûts de l'application. Les utilisateurs doivent recevoir une nouvelle version dans les 5 minutes qui suivent un déploiement.

    Quelle combinaison d'actions permet de répondre à ces exigences de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Disable caching for the JavaScript and CSS bundles so that users always download the latest version from the S3 origin."
        fr: "Désactiver la mise en cache des bundles JavaScript et CSS pour que les utilisateurs téléchargent toujours la dernière version depuis l'origine S3."
    - id: b
      text:
        en: "Enable automatic compression with Gzip and Brotli in the cache behavior and its cache policy."
        fr: "Activer la compression automatique avec Gzip et Brotli dans le comportement de cache et sa politique de cache."
    - id: c
      text:
        en: "Publish the bundles with content-hashed file names and a long cache lifetime, reference them from an index page with a short TTL, and stop the invalidation of all paths."
        fr: "Publier les bundles avec des noms de fichiers contenant un hachage du contenu et une longue durée de mise en cache, les référencer depuis une page d'index à TTL courte, et cesser l'invalidation de tous les chemins."
    - id: d
      text:
        en: "Replicate the bucket to a second Region, and add both buckets to an origin group so that cache misses are spread across the two origins."
        fr: "Répliquer le compartiment dans une seconde Région, et ajouter les deux compartiments à un groupe d'origines pour répartir les échecs d'accès au cache entre les deux origines."
    - id: e
      text:
        en: "Keep the 5-minute TTL, and replace the invalidation of all paths with individual invalidations of the changed bundle files after each deployment."
        fr: "Conserver la TTL de 5 minutes, et remplacer l'invalidation de tous les chemins par des invalidations individuelles des fichiers de bundles modifiés après chaque déploiement."
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: "CloudFront compresses objects between 1,000 and 10,000,000 bytes with Brotli or Gzip when the viewer supports it, and compressed text files can be less than a quarter of their original size, which lowers data transfer charges. Content-hashed file names give each version a new URL, so bundles can be cached for a long time without invalidations, and only the small index page needs a short TTL to deliver new versions within 5 minutes."
    fr: "CloudFront compresse avec Brotli ou Gzip les objets de 1 000 à 10 000 000 octets lorsque l'utilisateur le prend en charge, et des fichiers texte compressés peuvent faire moins du quart de leur taille d'origine, ce qui réduit les frais de transfert de données. Des noms de fichiers contenant un hachage du contenu donnent une nouvelle URL à chaque version : les bundles peuvent être mis en cache longtemps sans invalidation, et seule la petite page d'index a besoin d'une TTL courte pour livrer les nouvelles versions en 5 minutes."
  options:
    a:
      en: "Disabling caching sends every request to S3 and removes the edge caching, which increases origin requests instead of reducing them."
      fr: "Désactiver la mise en cache envoie chaque requête vers S3 et supprime la mise en cache en périphérie, ce qui augmente les requêtes à l'origine au lieu de les réduire."
    d:
      en: "An origin group always sends requests to the primary origin first and uses the secondary only for failover, so it does not spread or reduce origin requests, and replication adds storage and transfer costs."
      fr: "Un groupe d'origines envoie toujours les requêtes d'abord à l'origine principale et n'utilise la secondaire que pour le basculement : il ne répartit ni ne réduit les requêtes à l'origine, et la réplication ajoute des coûts de stockage et de transfert."
    e:
      en: "Targeted invalidations still leave a 5-minute TTL, so the edge locations keep revalidating and refetching the bundles from S3 all day."
      fr: "Des invalidations ciblées laissent une TTL de 5 minutes : les emplacements périphériques continuent de revalider et de récupérer les bundles depuis S3 toute la journée."
references:
  - title: "Serve compressed files"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html
  - title: "Control the cache key with a policy"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html
