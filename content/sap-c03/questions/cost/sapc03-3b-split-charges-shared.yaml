id: sapc03-3b-split-charges-shared
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 60 accounts that belong to five business units, plus a shared network account that runs the transit gateway, NAT gateways, and firewalls for everyone. The organization also pays AWS Enterprise Support, which is billed to the management account.

    For a monthly showback, finance wants the shared network costs and the Enterprise Support charges allocated to the five business units in proportion to each business unit's own spend. Finance wants to see each business unit's cost before and after the allocation and download the result as a CSV file. The FinOps team wants the least manual work each month.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany dispose de 60 comptes qui appartiennent à cinq unités opérationnelles, plus un compte réseau partagé qui exécute la passerelle de transit, les passerelles NAT et les pare-feu pour tous. L'organisation paie aussi AWS Enterprise Support, facturé au compte de gestion.

    Pour une présentation des coûts (showback) mensuelle, la finance veut que les coûts réseau partagés et les frais d'Enterprise Support soient répartis entre les cinq unités opérationnelles au prorata des dépenses propres de chaque unité. La finance veut voir le coût de chaque unité avant et après la répartition et télécharger le résultat au format CSV. L'équipe FinOps veut le moins de travail manuel possible chaque mois.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a BusinessUnit resource tag to the Enterprise Support charges and to the shared network resources, and activate it as a cost allocation tag.", fr: "Appliquer une balise de ressource BusinessUnit aux frais d'Enterprise Support et aux ressources réseau partagées, et l'activer comme balise de répartition des coûts." } }
    - { id: b, text: { en: "Create a cost category with rules that map each business unit's accounts to its value, and map the network account and the AWS Support charges to a value named Shared.", fr: "Créer une catégorie de coûts dont les règles associent les comptes de chaque unité opérationnelle à sa valeur, et associent le compte réseau et les frais d'AWS Support à une valeur nommée Shared." } }
    - { id: c, text: { en: "Add a split charge rule to the cost category with Shared as the source, the five business unit values as the targets, and the proportional allocation method.", fr: "Ajouter à la catégorie de coûts une règle de répartition des frais avec Shared comme source, les cinq valeurs d'unités opérationnelles comme cibles et la méthode d'allocation proportionnelle." } }
    - { id: d, text: { en: "Add a split charge rule to the cost category with Shared as the source, the five business unit values as the targets, and fixed percentages that finance updates each month.", fr: "Ajouter à la catégorie de coûts une règle de répartition des frais avec Shared comme source, les cinq valeurs d'unités opérationnelles comme cibles et des pourcentages fixes que la finance met à jour chaque mois." } }
    - { id: e, text: { en: "Create AWS Billing Conductor custom line items each month that move a calculated share of the shared costs to each business unit's billing group.", fr: "Créer chaque mois des éléments de ligne personnalisés AWS Billing Conductor qui déplacent une part calculée des coûts partagés vers le groupe de facturation de chaque unité opérationnelle." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Split charge rules allocate a source cost category value, here Shared, across target values, and the proportional method weights each target by its own cost. The shared costs must first be categorized, which the account and service rules of the cost category do. The cost category details page shows each value before and after split charges and lets finance download a CSV report; split charges do not change the CUR or Cost Explorer data.
    fr: |
      Les règles de répartition des frais répartissent une valeur source de catégorie de coûts, ici Shared, entre des valeurs cibles, et la méthode proportionnelle pondère chaque cible selon son propre coût. Les coûts partagés doivent d'abord être catégorisés, ce que font les règles de compte et de service de la catégorie de coûts. La page de détails de la catégorie de coûts montre chaque valeur avant et après la répartition des frais et permet à la finance de télécharger un rapport CSV ; la répartition des frais ne modifie pas les données du CUR ni de Cost Explorer.
  options:
    a: { en: "Support charges cannot carry resource tags, and tagging shared resources with one business unit would assign all of their cost to it instead of splitting it.", fr: "Les frais de support ne peuvent pas porter de balises de ressource, et baliser les ressources partagées avec une seule unité opérationnelle leur attribuerait tout le coût au lieu de le répartir." }
    d: { en: "Fixed percentages do not follow each business unit's spend and require a manual update every month.", fr: "Des pourcentages fixes ne suivent pas les dépenses de chaque unité opérationnelle et exigent une mise à jour manuelle chaque mois." }
    e: { en: "Calculating and entering custom line items every month is manual work, and Billing Conductor pro forma billing is not needed for a showback report.", fr: "Calculer et saisir des éléments de ligne personnalisés chaque mois est un travail manuel, et la facturation pro forma de Billing Conductor n'est pas nécessaire pour un rapport de showback." }
