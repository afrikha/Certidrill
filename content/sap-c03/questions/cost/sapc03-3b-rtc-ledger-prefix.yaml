id: sapc03-3b-rtc-ledger-prefix
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a payments platform in us-east-1. One Amazon S3 bucket (S3 Versioning enabled) holds 900 TB of data: ledger exports under the ledger/ prefix, which represent about 2% of the new data written each day, and clickstream files and product images under other prefixes.

    A regulator now requires that every ledger export also exist in a versioned bucket in us-west-2, with a service level agreement that 99.9% of new ledger objects are copied within 15 minutes. The compliance team must receive a notification for any ledger object that misses this threshold. Clickstream files and images do not need to exist outside us-east-1. The company wants to keep the cost of the solution as low as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite une plateforme de paiement dans us-east-1. Un compartiment Amazon S3 (S3 Versioning activé) contient 900 To de données : des exports de grand livre sous le préfixe ledger/, qui représentent environ 2 % des nouvelles données écrites chaque jour, ainsi que des fichiers de parcours de navigation et des images de produits sous d'autres préfixes.

    Un régulateur exige désormais que chaque export de grand livre existe aussi dans un compartiment versionné de us-west-2, avec un accord de niveau de service garantissant que 99,9 % des nouveaux objets de grand livre sont copiés en moins de 15 minutes. L'équipe de conformité doit recevoir une notification pour tout objet de grand livre qui dépasse ce seuil. Les fichiers de navigation et les images n'ont pas besoin d'exister hors de us-east-1. L'entreprise veut que la solution coûte le moins cher possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one replication rule filtered on the ledger/ prefix with S3 Replication Time Control enabled, and send its OperationMissedThreshold event notifications to an Amazon SNS topic for the compliance team.", fr: "Créer une règle de réplication filtrée sur le préfixe ledger/ avec S3 Replication Time Control activé, et envoyer ses notifications d'événement OperationMissedThreshold vers une rubrique Amazon SNS de l'équipe de conformité." } }
    - { id: b, text: { en: "Create one replication rule for the whole bucket with S3 Replication Time Control enabled, and add an S3 Lifecycle rule in us-west-2 that expires replicas outside the ledger/ prefix after 1 day.", fr: "Créer une règle de réplication pour tout le compartiment avec S3 Replication Time Control activé, et ajouter dans us-west-2 une règle S3 Lifecycle qui fait expirer après 1 jour les réplicas hors du préfixe ledger/." } }
    - { id: c, text: { en: "Create one replication rule filtered on the ledger/ prefix without S3 Replication Time Control, enable S3 Replication metrics, and create an Amazon CloudWatch alarm when the replication latency exceeds 15 minutes.", fr: "Créer une règle de réplication filtrée sur le préfixe ledger/ sans S3 Replication Time Control, activer les métriques S3 Replication et créer une alarme Amazon CloudWatch lorsque la latence de réplication dépasse 15 minutes." } }
    - { id: d, text: { en: "Create an S3 Multi-Region Access Point with the us-east-1 bucket and a new us-west-2 bucket, and configure an active-passive failover routing configuration with the us-west-2 bucket as passive.", fr: "Créer un S3 Multi-Region Access Point avec le compartiment de us-east-1 et un nouveau compartiment de us-west-2, et configurer un routage de basculement actif-passif avec le compartiment de us-west-2 en passif." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 Replication Time Control is set per replication rule and is backed by an SLA of 99.9% of objects replicated within 15 minutes. It also publishes replication metrics and OperationMissedThreshold events that can notify the compliance team. Filtering the rule on ledger/ means the inter-Region transfer, replication requests, and the RTC data transfer charge apply only to the 2% of data that must be copied.
    fr: |
      S3 Replication Time Control se configure par règle de réplication et s'appuie sur un SLA de 99,9 % des objets répliqués en moins de 15 minutes. Il publie aussi des métriques de réplication et des événements OperationMissedThreshold qui peuvent notifier l'équipe de conformité. En filtrant la règle sur ledger/, le transfert entre Régions, les requêtes de réplication et les frais de transfert RTC ne s'appliquent qu'aux 2 % de données à copier.
  options:
    b: { en: "Every object of the bucket would pay inter-Region transfer, replication requests, and the RTC charge before being deleted, which is the opposite of a low-cost design.", fr: "Chaque objet du compartiment paierait le transfert entre Régions, les requêtes de réplication et les frais RTC avant d'être supprimé, ce qui est l'inverse d'une conception à faible coût." }
    c: { en: "Replication metrics show latency, but only S3 Replication Time Control comes with the 15-minute SLA and the missed-threshold events that the regulator requires.", fr: "Les métriques de réplication montrent la latence, mais seul S3 Replication Time Control offre le SLA de 15 minutes et les événements de seuil manqué qu'exige le régulateur." }
    d: { en: "A Multi-Region Access Point routes requests between buckets; it does not copy objects by itself, so a replication configuration would still be needed and no SLA would be provided.", fr: "Un Multi-Region Access Point achemine les requêtes entre compartiments ; il ne copie pas les objets par lui-même, donc une configuration de réplication resterait nécessaire et aucun SLA ne serait fourni." }
references:
  - title: Meeting compliance requirements with S3 Replication Time Control
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
  - title: Amazon S3 FAQs
    url: https://aws.amazon.com/s3/faqs/
