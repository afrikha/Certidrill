id: sapc03-3b-bedrock-iam-principal
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's generative AI platform account hosts eight product teams. Each team's applications call foundation models in Amazon Bedrock on demand by using an IAM role that belongs to that team only.

    Finance wants to see Bedrock cost and token usage for each team in AWS Cost Explorer and in the CUR 2.0 export, so that each team can be charged for its consumption. The platform team wants the fewest changes to the applications and no custom cost calculations.

    Which solution will meet these requirements?
  fr: |
    Le compte de la plateforme d'IA générative d'AnyCompany héberge huit équipes produit. Les applications de chaque équipe appellent à la demande des modèles de fondation d'Amazon Bedrock à l'aide d'un rôle IAM qui n'appartient qu'à cette équipe.

    La finance veut voir le coût et l'utilisation des jetons Bedrock de chaque équipe dans AWS Cost Explorer et dans l'export CUR 2.0, afin de refacturer à chaque équipe sa consommation. L'équipe plateforme veut le moins de changements possible dans les applications et aucun calcul de coûts personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Tag each team's IAM role with team and cost-center tags, activate them as cost allocation tags, and add IAM principal data to the CUR 2.0 export.", fr: "Baliser le rôle IAM de chaque équipe avec des balises team et cost-center, les activer comme balises de répartition des coûts, et ajouter les données de principal IAM à l'export CUR 2.0." } }
    - { id: b, text: { en: "Enable model invocation logging to Amazon S3, and run daily Amazon Athena queries that multiply each team's token counts by the model prices.", fr: "Activer la journalisation des appels de modèles vers Amazon S3, et exécuter chaque jour des requêtes Amazon Athena qui multiplient les jetons de chaque équipe par les prix des modèles." } }
    - { id: c, text: { en: "Move each team's applications to a separate AWS account in the organization, and report the Bedrock costs grouped by linked account.", fr: "Déplacer les applications de chaque équipe vers un compte AWS distinct de l'organisation, et présenter les coûts Bedrock regroupés par compte lié." } }
    - { id: d, text: { en: "Create one AWS Budgets cost budget per team, filter each budget on the team's IAM role ARN, and send the budget reports to finance.", fr: "Créer un budget de coûts AWS Budgets par équipe, filtrer chaque budget sur l'ARN du rôle IAM de l'équipe, et envoyer les rapports de budget à la finance." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      IAM principal cost allocation attributes Amazon Bedrock cost and usage to the IAM user or role that made each call. Tags on the roles, once activated as cost allocation tags, appear in Cost Explorer for grouping and filtering, and in CUR 2.0 with the iamPrincipal/ prefix and the caller ARN in the line_item_iam_principal column. The applications do not change, because each team already calls Bedrock with its own role.
    fr: |
      La répartition des coûts par principal IAM attribue le coût et l'utilisation d'Amazon Bedrock à l'utilisateur ou au rôle IAM qui a fait chaque appel. Les balises des rôles, une fois activées comme balises de répartition des coûts, apparaissent dans Cost Explorer pour le regroupement et le filtrage, et dans CUR 2.0 avec le préfixe iamPrincipal/ et l'ARN de l'appelant dans la colonne line_item_iam_principal. Les applications ne changent pas, car chaque équipe appelle déjà Bedrock avec son propre rôle.
  options:
    b: { en: "This is a custom cost calculation that must track model prices and does not show the result in Cost Explorer.", fr: "C'est un calcul de coûts personnalisé qui doit suivre les prix des modèles et n'affiche pas le résultat dans Cost Explorer." }
    c: { en: "Moving eight teams to new accounts is a large change to the applications and the platform, far beyond what is needed.", fr: "Déplacer huit équipes vers de nouveaux comptes est un changement important des applications et de la plateforme, bien au-delà du nécessaire." }
    d: { en: "Budgets monitor spend against thresholds; they do not produce the per-team cost and token reports in Cost Explorer and the CUR that finance needs.", fr: "Les budgets surveillent les dépenses par rapport à des seuils ; ils ne produisent pas les rapports de coûts et de jetons par équipe dans Cost Explorer et le CUR dont la finance a besoin." }
references:
  - title: Using IAM principal for cost allocation
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/iam-principal-cost-allocation.html
