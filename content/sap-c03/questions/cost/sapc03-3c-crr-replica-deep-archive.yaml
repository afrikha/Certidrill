id: sapc03-3c-crr-replica-deep-archive
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores 3 PB of engineering documents in an S3 Standard bucket in eu-west-1, with versioning enabled. A new regulation requires a second copy of every object in another AWS Region, kept in a separate AWS account that is managed by the security team. New objects must be copied automatically as they are written. The copy will be read only if eu-west-1 becomes unavailable, and in that case the company accepts that objects can take up to 48 hours to become readable. The objects are between 5 MB and 2 GB. The company wants the copy to add as little storage cost as possible.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany stocke 3 Po de documents d'ingénierie dans un compartiment S3 Standard en eu-west-1, avec la gestion des versions activée. Une nouvelle réglementation exige une seconde copie de chaque objet dans une autre Région AWS, conservée dans un compte AWS distinct géré par l'équipe de sécurité. Les nouveaux objets doivent être copiés automatiquement dès leur écriture. La copie ne sera lue que si eu-west-1 devient indisponible et, dans ce cas, l'entreprise accepte que les objets mettent jusqu'à 48 heures pour devenir lisibles. Les objets font entre 5 Mo et 2 Go. L'entreprise veut que la copie ajoute le moins de coût de stockage possible.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Configure S3 Cross-Region Replication to a versioned bucket in the security account, with S3 Glacier Deep Archive as the destination storage class in the replication rule, and use S3 Batch Replication for the existing objects.", fr: "Configurer S3 Cross-Region Replication vers un compartiment avec gestion des versions dans le compte de sécurité, avec S3 Glacier Deep Archive comme classe de stockage de destination dans la règle de réplication, et utiliser S3 Batch Replication pour les objets existants." }
    - id: b
      text: { en: "Configure S3 Cross-Region Replication to a versioned bucket in the security account, with S3 Standard-IA as the destination storage class in the replication rule, and use S3 Batch Replication for the existing objects.", fr: "Configurer S3 Cross-Region Replication vers un compartiment avec gestion des versions dans le compte de sécurité, avec S3 Standard-IA comme classe de stockage de destination dans la règle de réplication, et utiliser S3 Batch Replication pour les objets existants." }
    - id: c
      text: { en: "Protect the bucket with an AWS Backup plan that copies each recovery point to a backup vault in the security account in the other Region, with a lifecycle that moves the copies to cold storage after 1 day.", fr: "Protéger le compartiment avec un plan AWS Backup qui copie chaque point de récupération vers un coffre de sauvegarde du compte de sécurité dans l'autre Région, avec un cycle de vie qui déplace les copies vers le stockage à froid après 1 jour." }
    - id: d
      text: { en: "Configure S3 Cross-Region Replication to a versioned bucket in the security account, with S3 Intelligent-Tiering as the destination storage class and the Deep Archive Access tier activated after 180 days, and use S3 Batch Replication for the existing objects.", fr: "Configurer S3 Cross-Region Replication vers un compartiment avec gestion des versions dans le compte de sécurité, avec S3 Intelligent-Tiering comme classe de stockage de destination et le niveau Deep Archive Access activé après 180 jours, et utiliser S3 Batch Replication pour les objets existants." }
answer: { optionId: a }
explanation:
  correct:
    en: "A replication rule can set any S3 storage class for the replicas, so the copies can be written directly to S3 Glacier Deep Archive, the lowest-cost class. Deep Archive restores complete within 12 hours (standard) or 48 hours (bulk), which fits the accepted delay, and the replicas are never read in normal operation."
    fr: "Une règle de réplication peut définir n'importe quelle classe de stockage S3 pour les réplicas : les copies peuvent être écrites directement dans S3 Glacier Deep Archive, la classe la moins chère. Les restaurations Deep Archive se terminent en 12 heures (standard) ou 48 heures (bulk), ce qui respecte le délai accepté, et les réplicas ne sont jamais lus en fonctionnement normal."
  options:
    b:
      en: "Standard-IA keeps millisecond access that the copy does not need, at a much higher storage price than Glacier Deep Archive."
      fr: "Standard-IA conserve un accès en millisecondes dont la copie n'a pas besoin, à un prix de stockage bien plus élevé que Glacier Deep Archive."
    c:
      en: "AWS Backup does not support cold storage for Amazon S3 backups, so the lifecycle setting is ignored and the copies stay in warm backup storage, which costs more than Glacier Deep Archive."
      fr: "AWS Backup ne prend pas en charge le stockage à froid pour les sauvegardes Amazon S3 : le paramètre de cycle de vie est ignoré et les copies restent en stockage chaud, plus cher que Glacier Deep Archive."
    d:
      en: "Replicas would spend at least 180 days in the more expensive Intelligent-Tiering tiers before reaching Deep Archive Access, and each object adds a monitoring charge, so the cost is higher than writing directly to Glacier Deep Archive."
      fr: "Les réplicas passeraient au moins 180 jours dans les niveaux Intelligent-Tiering plus chers avant d'atteindre Deep Archive Access, et chaque objet ajoute des frais de surveillance : le coût est supérieur à une écriture directe dans Glacier Deep Archive."
