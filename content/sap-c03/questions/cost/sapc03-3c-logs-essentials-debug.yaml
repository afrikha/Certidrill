id: sapc03-3c-logs-essentials-debug
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 400 containerized microservices that write verbose diagnostic logs to Amazon CloudWatch Logs, in log groups of the Standard log class that also receive the services' error logs. The error logs feed metric filters and subscription filters that drive alarms and a security pipeline. The diagnostic logs are used only by engineers who run CloudWatch Logs Insights queries during investigations, and they must remain searchable for 90 days. Log ingestion represents about 85% of the CloudWatch Logs bill, and most of it comes from the diagnostic logs. The platform team can change the log group names that the services write to through configuration.

    Which solution will reduce the cost MOST while meeting these requirements?
  fr: |
    AnyCompany exécute 400 microservices conteneurisés qui écrivent des journaux de diagnostic détaillés dans Amazon CloudWatch Logs, dans des groupes de journaux de la classe Standard qui reçoivent aussi les journaux d'erreurs des services. Les journaux d'erreurs alimentent des filtres de métriques et des filtres d'abonnement qui pilotent des alarmes et un pipeline de sécurité. Les journaux de diagnostic ne servent qu'aux ingénieurs qui lancent des requêtes CloudWatch Logs Insights pendant les investigations, et ils doivent rester consultables pendant 90 jours. L'ingestion des journaux représente environ 85 % de la facture CloudWatch Logs, et la plus grande partie provient des journaux de diagnostic. L'équipe plateforme peut modifier par configuration les noms des groupes de journaux dans lesquels les services écrivent.

    Quelle solution réduit le PLUS les coûts tout en répondant à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the log class of the existing log groups to Essentials and set their retention to 90 days.", fr: "Changer la classe des groupes de journaux existants en Essentials et définir leur rétention à 90 jours." }
    - id: b
      text: { en: "Add a subscription filter that streams the diagnostic logs to Amazon Data Firehose for delivery to Amazon S3, and set the log group retention to 1 day.", fr: "Ajouter un filtre d'abonnement qui diffuse les journaux de diagnostic vers Amazon Data Firehose pour livraison dans Amazon S3, et définir la rétention du groupe de journaux à 1 jour." }
    - id: c
      text: { en: "Create new log groups of the Essentials log class with a 90-day retention for the diagnostic logs, and keep the error logs in the existing Standard log groups.", fr: "Créer de nouveaux groupes de journaux de la classe Essentials avec une rétention de 90 jours pour les journaux de diagnostic, et garder les journaux d'erreurs dans les groupes de journaux Standard existants." }
    - id: d
      text: { en: "Keep all logs in the existing log groups and set their retention to 90 days.", fr: "Garder tous les journaux dans les groupes de journaux existants et définir leur rétention à 90 jours." }
answer: { optionId: c }
explanation:
  correct:
    en: "The Essentials log class (formerly Infrequent Access) has a lower ingestion price and still supports CloudWatch Logs Insights queries, but not metric filters, subscription filters, or Live Tail. The class is chosen when a log group is created and cannot be changed, so the diagnostic logs need new Essentials log groups while the error logs stay in Standard."
    fr: "La classe de journaux Essentials (anciennement Infrequent Access) a un prix d'ingestion plus bas et prend toujours en charge les requêtes CloudWatch Logs Insights, mais pas les filtres de métriques, les filtres d'abonnement ni Live Tail. La classe se choisit à la création d'un groupe de journaux et ne peut pas être modifiée : les journaux de diagnostic ont besoin de nouveaux groupes Essentials, tandis que les journaux d'erreurs restent en Standard."
  options:
    a:
      en: "The log class of an existing log group cannot be changed, and an Essentials group would also lose the metric filters and subscription filters that the error logs need."
      fr: "La classe d'un groupe de journaux existant ne peut pas être modifiée, et un groupe Essentials perdrait en outre les filtres de métriques et d'abonnement dont les journaux d'erreurs ont besoin."
    b:
      en: "The logs are still ingested at the Standard price before they are streamed, so ingestion, the main cost, does not decrease, Firehose adds charges, and engineers lose Logs Insights on the diagnostic logs after 1 day."
      fr: "Les journaux sont toujours ingérés au prix Standard avant d'être diffusés : l'ingestion, coût principal, ne baisse pas, Firehose ajoute des frais, et les ingénieurs perdent Logs Insights sur les journaux de diagnostic après 1 jour."
    d:
      en: "Retention lowers only the stored volume; ingestion, which is 85% of the bill, is unchanged."
      fr: "La rétention ne réduit que le volume stocké : l'ingestion, qui représente 85 % de la facture, reste inchangée."
references:
  - title: Log classes
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch_Logs_Log_Classes.html
