id: sapc03-3a-sagemaker-multi-model
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sells a multi-tenant demand forecasting SaaS product. Each of its 3,000 tenants has its own XGBoost model of about 50 MB, and all models use the same serving container. Each model is invoked only a few times per hour through a synchronous API, and tenants accept a delay of a few seconds on the first request after a period of inactivity. Today, every tenant has a dedicated Amazon SageMaker AI real-time endpoint on its own instance in one Region, and the instances are almost idle. New tenants join every week. The company wants to cut hosting costs and onboard new tenants with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany commercialise une solution SaaS mutualisée (multi-tenant) de prévision de la demande. Chacun de ses 3 000 locataires dispose de son propre modèle XGBoost d'environ 50 Mo, et tous les modèles utilisent le même conteneur de service. Chaque modèle n'est appelé que quelques fois par heure via une API synchrone, et les locataires acceptent un délai de quelques secondes sur la première requête après une période d'inactivité. Aujourd'hui, chaque locataire dispose d'un point de terminaison en temps réel Amazon SageMaker AI dédié sur sa propre instance dans une Région, et les instances sont presque inactives. De nouveaux locataires arrivent chaque semaine. L'entreprise veut réduire les coûts d'hébergement et intégrer les nouveaux locataires avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Replace each dedicated endpoint with a SageMaker AI serverless inference endpoint for the tenant, and create a new serverless endpoint for every new tenant."
        fr: "Remplacer chaque point de terminaison dédié par un point de terminaison d'inférence serverless SageMaker AI propre au locataire, et créer un nouveau point de terminaison serverless pour chaque nouveau locataire."
    - id: b
      text:
        en: "Replace each dedicated endpoint with a SageMaker AI asynchronous inference endpoint for the tenant that scales to zero instances, and poll Amazon S3 for the results."
        fr: "Remplacer chaque point de terminaison dédié par un point de terminaison d'inférence asynchrone SageMaker AI propre au locataire qui se réduit à zéro instance, et interroger Amazon S3 pour récupérer les résultats."
    - id: c
      text:
        en: "Host all tenant models on one multi-model endpoint with auto scaling, store the models under one Amazon S3 prefix, and onboard tenants by uploading their models."
        fr: "Héberger tous les modèles des locataires sur un seul point de terminaison multimodèle avec autoscaling, stocker les modèles sous un même préfixe Amazon S3, et intégrer les locataires en téléversant leurs modèles."
    - id: d
      text:
        en: "Keep the dedicated real-time endpoints, move each one to a smaller instance type, and purchase a SageMaker AI Savings Plan that covers all the endpoint instances."
        fr: "Conserver les points de terminaison en temps réel dédiés, passer chacun à un type d'instance plus petit, et acheter un SageMaker AI Savings Plan qui couvre toutes les instances des points de terminaison."
answer: { optionId: c }
explanation:
  correct:
    en: "Multi-model endpoints host many models that share a framework and serving container on one shared fleet, which raises utilization and lowers hosting cost. Models are loaded dynamically from S3 when they are invoked and cached in memory, rarely used models accept an occasional cold start, and adding a tenant only requires uploading its model to the S3 prefix, with no endpoint update."
    fr: "Les points de terminaison multimodèles hébergent de nombreux modèles qui partagent un framework et un conteneur de service sur une même flotte, ce qui augmente l'utilisation et réduit le coût d'hébergement. Les modèles sont chargés dynamiquement depuis S3 lorsqu'ils sont appelés puis mis en cache en mémoire, les modèles rarement utilisés acceptent un démarrage à froid occasionnel, et ajouter un locataire ne demande que le téléversement de son modèle sous le préfixe S3, sans mise à jour du point de terminaison."
  options:
    a:
      en: "An account can have at most 50 serverless endpoints per Region, so 3,000 tenants cannot each get one, and managing one endpoint per tenant keeps the onboarding overhead."
      fr: "Un compte peut avoir au plus 50 points de terminaison serverless par Région : 3 000 locataires ne peuvent donc pas en avoir chacun un, et gérer un point de terminaison par locataire conserve la charge d'intégration."
    b:
      en: "Asynchronous inference returns results through S3 instead of in the response, which breaks the synchronous API, and it still requires one endpoint per tenant."
      fr: "L'inférence asynchrone renvoie les résultats via S3 et non dans la réponse, ce qui casse l'API synchrone, et elle impose toujours un point de terminaison par locataire."
    d:
      en: "Smaller instances and a Savings Plan reduce the rate, but 3,000 mostly idle instances remain, and every new tenant still needs a new endpoint."
      fr: "Des instances plus petites et un Savings Plan réduisent le tarif, mais 3 000 instances presque inactives subsistent, et chaque nouveau locataire nécessite toujours un nouveau point de terminaison."
references:
  - title: "Multi-model endpoints"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-model-endpoints.html
  - title: "Deploy models with Amazon SageMaker Serverless Inference"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
