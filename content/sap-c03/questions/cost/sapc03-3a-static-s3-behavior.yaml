id: sapc03-3a-static-s3-behavior
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's web application uses an Amazon CloudFront distribution with a single default cache behavior that points to an Application Load Balancer. Amazon EC2 instances behind the load balancer serve both the dynamic API and the static assets, such as images, JavaScript and CSS files, which account for 80% of the bytes delivered. Caching is disabled on the behavior because API responses are personalized and must never be cached. The static assets change only when a new version is deployed. The company wants to reduce the EC2 fleet size and the origin costs without caching API responses.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    L'application web d'AnyCompany utilise une distribution Amazon CloudFront avec un seul comportement de cache par défaut qui pointe vers un Application Load Balancer. Les instances Amazon EC2 derrière l'équilibreur de charge servent à la fois l'API dynamique et les ressources statiques, comme les images et les fichiers JavaScript et CSS, qui représentent 80 % des octets livrés. La mise en cache est désactivée sur le comportement, car les réponses de l'API sont personnalisées et ne doivent jamais être mises en cache. Les ressources statiques ne changent qu'au déploiement d'une nouvelle version. L'entreprise veut réduire la taille de la flotte EC2 et les coûts de l'origine sans mettre en cache les réponses de l'API.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Enable Origin Shield for the load balancer origin in the Region of the load balancer, and keep caching disabled on the default cache behavior."
        fr: "Activer Origin Shield pour l'origine de l'équilibreur de charge dans la Région de celui-ci, et laisser la mise en cache désactivée sur le comportement de cache par défaut."
    - id: b
      text:
        en: "Move the static assets to an S3 bucket with origin access control, route the static path to it in a cached behavior, and keep the default behavior uncached."
        fr: "Déplacer les ressources statiques dans un compartiment S3 avec un OAC, diriger le chemin statique vers celui-ci dans un comportement avec mise en cache, et laisser le comportement par défaut sans cache."
    - id: c
      text:
        en: "Enable caching on the default cache behavior with a 1-day default TTL, and include the Authorization header in the cache key to separate the users."
        fr: "Activer la mise en cache sur le comportement par défaut avec une TTL par défaut de 1 jour, et inclure l'en-tête Authorization dans la clé de cache pour séparer les utilisateurs."
    - id: d
      text:
        en: "Replace the instances with larger instance types that have more network bandwidth, and purchase a Compute Savings Plan that covers the new instance fleet."
        fr: "Remplacer les instances par des types d'instances plus grands disposant de plus de bande passante réseau, et acheter un Compute Savings Plan qui couvre la nouvelle flotte d'instances."
answer: { optionId: b }
explanation:
  correct:
    en: "Separate cache behaviors let each path use its own origin and cache policy, so static assets are cached at the edge from S3 while API requests still go to the load balancer uncached. The EC2 fleet no longer serves 80% of the bytes, and S3 serves the cache misses without any compute to manage."
    fr: "Des comportements de cache distincts permettent à chaque chemin d'utiliser sa propre origine et sa propre politique de cache : les ressources statiques sont mises en cache en périphérie depuis S3, tandis que les requêtes d'API vont toujours vers l'équilibreur de charge sans mise en cache. La flotte EC2 ne sert plus 80 % des octets, et S3 traite les échecs d'accès au cache sans aucun calcul à gérer."
  options:
    a:
      en: "With caching disabled, every request is dynamic and Origin Shield cannot cache the static assets; such requests also always incur Origin Shield charges."
      fr: "Avec la mise en cache désactivée, chaque requête est dynamique et Origin Shield ne peut pas mettre en cache les ressources statiques ; ces requêtes entraînent en outre toujours des frais Origin Shield."
    c:
      en: "Caching personalized API responses violates the requirement, and a per-user Authorization value in the cache key leaves almost no cache hits."
      fr: "Mettre en cache des réponses d'API personnalisées enfreint l'exigence, et une valeur Authorization propre à chaque utilisateur dans la clé de cache ne laisse presque aucun accès au cache."
    d:
      en: "Larger instances and a Savings Plan lower the rate but keep the fleet serving every static byte, so the fleet size and origin costs do not go down."
      fr: "Des instances plus grandes et un Savings Plan réduisent le tarif mais laissent la flotte servir chaque octet statique : la taille de la flotte et les coûts de l'origine ne baissent pas."
references:
  - title: "Control the cache key with a policy"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html
  - title: "Use Amazon CloudFront Origin Shield"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html
