id: sapc03-3a-co-preferences-dev-prod
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has an organization in AWS Organizations with separate production and development accounts in the eu-west-1 Region. The company owns a 3-year EC2 Instance Savings Plan for the M7g instance family in eu-west-1 that covers most of its EC2 usage. AWS Compute Optimizer, managed from a delegated administrator account, often recommends C7i or R7i instance types, which the Savings Plan would not cover. The finance team wants every EC2 recommendation in the organization to stay within the M7g family. The development teams want more aggressive recommendations for the development accounts that ignore short CPU spikes and add no CPU headroom. Production recommendations must keep the default thresholds. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une organisation dans AWS Organizations avec des comptes de production et de développement distincts dans la Région eu-west-1. L'entreprise possède un EC2 Instance Savings Plan sur 3 ans pour la famille d'instances M7g dans eu-west-1, qui couvre l'essentiel de son utilisation EC2. AWS Compute Optimizer, géré depuis un compte administrateur délégué, recommande souvent des types d'instances C7i ou R7i que le Savings Plan ne couvrirait pas. L'équipe financière veut que toutes les recommandations EC2 de l'organisation restent dans la famille M7g. Les équipes de développement veulent, pour les comptes de développement, des recommandations plus agressives qui ignorent les courts pics de processeur et n'ajoutent aucune marge de processeur. Les recommandations de production doivent conserver les seuils par défaut. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the delegated administrator account, set the preferred EC2 instances to the M7g family and apply the Maximum savings preset, both at the organization level."
        fr: "Depuis le compte administrateur délégué, définir les instances EC2 préférées sur la famille M7g et appliquer le préréglage Maximum savings, tous deux au niveau de l'organisation."
    - id: b
      text:
        en: "From the delegated administrator account, set the preferred EC2 instances to the M7g family at the organization level, and apply the Maximum savings preset at the account level to the development accounts."
        fr: "Depuis le compte administrateur délégué, définir les instances EC2 préférées sur la famille M7g au niveau de l'organisation, et appliquer le préréglage Maximum savings au niveau des comptes de développement."
    - id: c
      text:
        en: "Export the recommendations of all accounts to Amazon S3 every week, filter out the non-M7g instance types with Amazon Athena, and recalculate development recommendations from CloudWatch metrics."
        fr: "Exporter chaque semaine les recommandations de tous les comptes vers Amazon S3, filtrer les types d'instances autres que M7g avec Amazon Athena, et recalculer les recommandations de développement à partir des métriques CloudWatch."
    - id: d
      text:
        en: "From the delegated administrator account, set the preferred EC2 instances to the M7g family at the organization level, and set a 30% CPU headroom with the P99.5 CPU threshold for the development accounts."
        fr: "Depuis le compte administrateur délégué, définir les instances EC2 préférées sur la famille M7g au niveau de l'organisation, et définir une marge de processeur de 30 % avec le seuil de processeur P99.5 pour les comptes de développement."
answer: { optionId: b }
explanation:
  correct:
    en: "Rightsizing recommendation preferences can be set at the organization, account or Regional level by the management account or a delegated administrator. Preferred EC2 instances restrict the candidates to a chosen family such as one covered by Savings Plans, and the Maximum savings preset (P90 CPU threshold, 0% CPU headroom, 10% memory headroom) applied only to the development accounts leaves production on the default P99.5 threshold and 20% headroom."
    fr: "Les préférences de recommandation de dimensionnement adapté peuvent être définies au niveau de l'organisation, du compte ou de la Région par le compte de gestion ou un administrateur délégué. Les instances EC2 préférées limitent les candidats à une famille choisie, par exemple celle couverte par des Savings Plans, et le préréglage Maximum savings (seuil de processeur P90, marge de processeur de 0 %, marge de mémoire de 10 %) appliqué aux seuls comptes de développement laisse la production sur le seuil par défaut P99.5 et une marge de 20 %."
  options:
    a:
      en: "Applying Maximum savings at the organization level also changes the production recommendations, which must keep the default thresholds."
      fr: "Appliquer Maximum savings au niveau de l'organisation modifie aussi les recommandations de production, qui doivent conserver les seuils par défaut."
    c:
      en: "A weekly export and custom recalculation reproduce what the preferences already do natively and add a pipeline to operate."
      fr: "Un export hebdomadaire et un recalcul personnalisé reproduisent ce que les préférences font déjà nativement et ajoutent un pipeline à exploiter."
    d:
      en: "A 30% headroom with the P99.5 threshold makes development recommendations more conservative, the opposite of what the development teams want."
      fr: "Une marge de 30 % avec le seuil P99.5 rend les recommandations de développement plus prudentes, à l'opposé de ce que veulent les équipes de développement."
references:
  - title: "Rightsizing recommendation preferences"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
