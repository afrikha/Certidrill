id: sapc03-3b-tag-policy-iac-hook
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deploys all infrastructure through AWS CloudFormation pipelines into 180 accounts in three Regions; creating resources in the console is already blocked by other controls. The FinOps team defines the tagging standard centrally in AWS Organizations.

    The team now requires that any stack in which a supported resource lacks the CostCenter or Application tag fail validation before CloudFormation provisions any resource, so that no partial deployment and rollback happen. Developers must see the missing-tag reason in the deployment events. The solution must apply in every account and Region.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie toute son infrastructure par des pipelines AWS CloudFormation dans 180 comptes et trois Régions ; la création de ressources dans la console est déjà bloquée par d'autres contrôles. L'équipe FinOps définit le standard de balisage de manière centralisée dans AWS Organizations.

    L'équipe exige désormais que toute pile dans laquelle une ressource prise en charge n'a pas la balise CostCenter ou Application échoue à la validation avant que CloudFormation ne provisionne la moindre ressource, afin d'éviter tout déploiement partiel suivi d'une annulation. Les développeurs doivent voir le motif de la balise manquante dans les événements de déploiement. La solution doit s'appliquer dans chaque compte et chaque Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP that denies the create actions of the supported resource types when aws:RequestTag/CostCenter or aws:RequestTag/Application is null.", fr: "Attacher une SCP qui refuse les actions de création des types de ressources pris en charge lorsque aws:RequestTag/CostCenter ou aws:RequestTag/Application est nul." } }
    - { id: b, text: { en: "Attach a tag policy that defines CostCenter and Application and enforces them for the supported resource types with enforced_for.", fr: "Attacher une politique de balises qui définit CostCenter et Application et les applique aux types de ressources pris en charge avec enforced_for." } }
    - { id: c, text: { en: "Attach a tag policy that lists CostCenter and Application in report_required_tag_for, and activate the AWS::TagPolicies::TaggingComplianceValidator hook with the WARN failure mode in the management account.", fr: "Attacher une politique de balises qui liste CostCenter et Application dans report_required_tag_for, et activer le hook AWS::TagPolicies::TaggingComplianceValidator avec le mode d'échec WARN dans le compte de gestion." } }
    - { id: d, text: { en: "Attach a tag policy that lists CostCenter and Application in report_required_tag_for, and activate the AWS::TagPolicies::TaggingComplianceValidator hook with the FAIL failure mode in every account and Region.", fr: "Attacher une politique de balises qui liste CostCenter et Application dans report_required_tag_for, et activer le hook AWS::TagPolicies::TaggingComplianceValidator avec le mode d'échec FAIL dans chaque compte et chaque Région." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Tag policies can specify required tag keys for resource types, and the AWS::TagPolicies::TaggingComplianceValidator hook checks CloudFormation deployments against them before resources are created. With the FAIL mode, deployments missing required tags are blocked; the hook works as a stack hook and must be activated in every account and Region where compliance is enforced, for example with CloudFormation StackSets.
    fr: |
      Les politiques de balises peuvent indiquer des clés de balises obligatoires par type de ressource, et le hook AWS::TagPolicies::TaggingComplianceValidator vérifie les déploiements CloudFormation par rapport à elles avant la création des ressources. Avec le mode FAIL, les déploiements auxquels il manque des balises obligatoires sont bloqués ; le hook fonctionne comme hook de pile et doit être activé dans chaque compte et chaque Région où la conformité est imposée, par exemple avec CloudFormation StackSets.
  options:
    a: { en: "An SCP denies the API call only when CloudFormation reaches that resource, so the stack has already provisioned other resources and rolls back.", fr: "Une SCP ne refuse l'appel d'API qu'au moment où CloudFormation atteint cette ressource : la pile a déjà provisionné d'autres ressources et est annulée." }
    b: { en: "enforced_for blocks noncompliant tagging operations, but resources without the tag are not evaluated, so a stack that omits the tags still deploys.", fr: "enforced_for bloque les opérations de balisage non conformes, mais les ressources sans la balise ne sont pas évaluées : une pile qui omet les balises se déploie quand même." }
    c: { en: "The WARN mode lets deployments proceed with warnings, and activating the hook only in the management account leaves the 180 workload accounts unchecked.", fr: "Le mode WARN laisse les déploiements se poursuivre avec des avertissements, et activer le hook uniquement dans le compte de gestion laisse les 180 comptes de charges de travail sans contrôle." }
references:
  - title: Enforce "Required tag key" with IaC
    url: https://docs.aws.amazon.com/organizations/latest/userguide/enforce-required-tag-keys-iac.html
  - title: Tag policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_example-tag-policies.html
