id: sapc03-3b-config-org-required-tags
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 250 accounts in AWS Organizations and operates in four Regions. AWS Config is enabled in every account and Region, and a security account is the delegated administrator for AWS Config.

    Before it enforces any tagging rule, the FinOps team wants one view that shows which existing EC2 instances, EBS volumes, RDS DB instances, and S3 buckets are missing the CostCenter or Environment tag in every account and Region. Resources must be evaluated again whenever their configuration changes, and no deployment may be blocked.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 250 comptes dans AWS Organizations et opère dans quatre Régions. AWS Config est activé dans chaque compte et chaque Région, et un compte de sécurité est l'administrateur délégué d'AWS Config.

    Avant d'imposer une règle de balisage, l'équipe FinOps veut une vue unique qui montre quelles instances EC2, quels volumes EBS, quelles instances de base de données RDS et quels compartiments S3 existants n'ont pas la balise CostCenter ou Environment, dans chaque compte et chaque Région. Les ressources doivent être réévaluées à chaque changement de configuration, et aucun déploiement ne doit être bloqué.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the delegated administrator account, deploy the required-tags managed rule as an AWS Config organization rule, and view the results in an organization-wide aggregator.", fr: "Depuis le compte administrateur délégué, déployer la règle gérée required-tags comme règle d'organisation AWS Config, et consulter les résultats dans un agrégateur à l'échelle de l'organisation." } }
    - { id: b, text: { en: "Attach a tag policy to the organization root that defines CostCenter and Environment with their capitalization and enforces them for the four resource types.", fr: "Attacher à la racine de l'organisation une politique de balises qui définit CostCenter et Environment avec leur casse et les applique aux quatre types de ressources." } }
    - { id: c, text: { en: "Attach an SCP to the organization root that denies the creation of the four resource types when the CostCenter or the Environment tag is missing from the request.", fr: "Attacher à la racine de l'organisation une SCP qui refuse la création des quatre types de ressources lorsque la balise CostCenter ou Environment est absente de la requête." } }
    - { id: d, text: { en: "In AWS Cost Explorer, filter the costs of the four services on the No tag key value of the CostCenter and Environment tags, and save the report.", fr: "Dans AWS Cost Explorer, filtrer les coûts des quatre services sur la valeur No tag key des balises CostCenter et Environment, et enregistrer le rapport." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The required-tags managed rule checks whether resources have the specified tags, up to six keys, and supports EC2 instances, EBS volumes, RDS DB instances, and S3 buckets. It is triggered by configuration changes and only reports noncompliance; it does not prevent resource creation. Deployed as an organization rule from the delegated administrator and viewed through an aggregator, it gives one compliance view across all accounts and Regions.
    fr: |
      La règle gérée required-tags vérifie si les ressources portent les balises indiquées, jusqu'à six clés, et prend en charge les instances EC2, les volumes EBS, les instances de base de données RDS et les compartiments S3. Elle est déclenchée par les changements de configuration et ne fait que signaler la non-conformité ; elle n'empêche pas la création de ressources. Déployée comme règle d'organisation depuis l'administrateur délégué et consultée par un agrégateur, elle donne une vue de conformité unique sur tous les comptes et toutes les Régions.
  options:
    b: { en: "Tag policies do not evaluate untagged resources, so missing tags are not reported, and enforcement blocks noncompliant tagging operations.", fr: "Les politiques de balises n'évaluent pas les ressources sans balise : les balises manquantes ne sont pas signalées, et l'application bloque les opérations de balisage non conformes." }
    c: { en: "An SCP blocks deployments, which the team does not want yet, and it reports nothing about existing resources.", fr: "Une SCP bloque des déploiements, ce que l'équipe ne veut pas encore, et elle ne signale rien sur les ressources existantes." }
    d: { en: "Cost Explorer shows untagged cost, not a list of noncompliant resources per account and Region that is reevaluated on configuration changes.", fr: "Cost Explorer montre des coûts non balisés, pas une liste de ressources non conformes par compte et par Région réévaluée à chaque changement de configuration." }
references:
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
