id: sapc03-3c-sp-coverage-utilization
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's central FinOps team purchased Compute Savings Plans in the management account of its organization to cover Amazon EC2, AWS Fargate, and AWS Lambda usage in 40 member accounts. Several teams are migrating workloads to new instance families and Regions over the next months. The FinOps team needs to know quickly when the share of eligible compute usage covered by Savings Plans drops below 75%, so that it can buy more commitment. It also needs to know when less than 95% of the purchased commitment is being used, so that it can stop teams from moving usage away. Notifications must go to the team's email distribution list, and no custom code is allowed.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe FinOps centrale d'AnyCompany a acheté des Compute Savings Plans dans le compte de gestion de son organisation pour couvrir l'utilisation d'Amazon EC2, d'AWS Fargate et d'AWS Lambda dans 40 comptes membres. Plusieurs équipes migrent des charges de travail vers de nouvelles familles d'instances et de nouvelles Régions au cours des prochains mois. L'équipe FinOps doit savoir rapidement quand la part de l'utilisation de calcul éligible couverte par les Savings Plans passe sous 75 %, afin d'acheter davantage d'engagement. Elle doit aussi savoir quand moins de 95 % de l'engagement acheté est utilisé, afin d'empêcher les équipes de déplacer l'utilisation. Les notifications doivent être envoyées à la liste de diffusion e-mail de l'équipe, et aucun code personnalisé n'est autorisé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a Savings Plans coverage budget with an alert when coverage falls below 75%.", fr: "Créer un budget de couverture des Savings Plans avec une alerte lorsque la couverture passe sous 75 %." } }
    - { id: b, text: { en: "Create a Reserved Instance coverage budget for Amazon EC2 with an alert when coverage falls below 75%.", fr: "Créer un budget de couverture des Reserved Instances pour Amazon EC2 avec une alerte lorsque la couverture passe sous 75 %." } }
    - { id: c, text: { en: "Create a cost budget filtered on the Savings Plans purchase option with an alert at 95% of the monthly commitment amount.", fr: "Créer un budget de coûts filtré sur l'option d'achat Savings Plans avec une alerte à 95 % du montant mensuel de l'engagement." } }
    - { id: d, text: { en: "Create a Savings Plans utilization budget with an alert when utilization falls below 95%.", fr: "Créer un budget d'utilisation des Savings Plans avec une alerte lorsque l'utilisation passe sous 95 %." } }
    - { id: e, text: { en: "Create an AWS Cost Anomaly Detection monitor for the Savings Plans cost category with a daily summary to the email list.", fr: "Créer un moniteur AWS Cost Anomaly Detection pour la catégorie de coûts des Savings Plans avec un résumé quotidien vers la liste e-mail." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS Budgets has dedicated Savings Plans budget types. A coverage budget alerts when the share of eligible usage covered by Savings Plans falls below a threshold, and a utilization budget alerts when the usage of the purchased commitment falls below a threshold. Both send email notifications without code."
    fr: "AWS Budgets propose des types de budgets dédiés aux Savings Plans. Un budget de couverture alerte lorsque la part de l'utilisation éligible couverte par les Savings Plans passe sous un seuil, et un budget d'utilisation alerte lorsque l'utilisation de l'engagement acheté passe sous un seuil. Les deux envoient des notifications par e-mail sans code."
  options:
    b:
      en: "Reserved Instance coverage measures instance hours covered by RIs, not usage covered by Savings Plans, and it would ignore Fargate and Lambda."
      fr: "La couverture des Reserved Instances mesure les heures d'instance couvertes par des RI, pas l'utilisation couverte par des Savings Plans, et elle ignorerait Fargate et Lambda."
    c:
      en: "A cost budget tracks spend. The Savings Plans commitment is billed every hour whether or not it is used, so this budget cannot reveal that only part of the commitment is applied to usage."
      fr: "Un budget de coûts suit des dépenses. L'engagement Savings Plans est facturé chaque heure qu'il soit utilisé ou non : ce budget ne peut pas révéler que seule une partie de l'engagement s'applique à l'utilisation."
    e:
      en: "Cost Anomaly Detection looks for spend that deviates from the usual pattern; it does not measure coverage or utilization percentages against fixed thresholds."
      fr: "Cost Anomaly Detection recherche des dépenses qui s'écartent du profil habituel : il ne mesure pas de pourcentages de couverture ou d'utilisation par rapport à des seuils fixes."
references:
  - title: Managing your costs with AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
