id: sapc03-3b-local-geo-profile
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a document-analysis application active-active in us-east-1 and eu-west-1. When the application was built, the chosen foundation model was available only in us-east-1, so the eu-west-1 application tier calls the Amazon Bedrock Runtime endpoint in us-east-1. Each request includes images, and the eu-west-1 tier sends about 30 TB of prompts each month across the Atlantic, which appears as inter-Region data transfer on the bill.

    The model is now offered in the EU geographic cross-Region inference profile, and eu-west-1 is a source Region of that profile. EU users' prompts have no residency constraint, but the company wants to cut inter-Region data transfer and keep EU response times low. The us-east-1 tier must keep working as it does today.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exploite une application d'analyse de documents en actif-actif dans us-east-1 et eu-west-1. Lors de la création de l'application, le modèle de fondation choisi n'était disponible que dans us-east-1 : la couche applicative de eu-west-1 appelle donc le point de terminaison Amazon Bedrock Runtime de us-east-1. Chaque requête contient des images, et la couche de eu-west-1 envoie environ 30 To d'invites par mois de l'autre côté de l'Atlantique, ce qui apparaît comme du transfert de données entre Régions sur la facture.

    Le modèle est désormais proposé dans le profil d'inférence entre Régions géographique EU, et eu-west-1 est une Région source de ce profil. Les invites des utilisateurs européens n'ont aucune contrainte de résidence, mais l'entreprise veut réduire le transfert de données entre Régions et garder des temps de réponse faibles en Europe. La couche de us-east-1 doit continuer à fonctionner comme aujourd'hui.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Have the eu-west-1 tier invoke the global cross-Region inference profile through the Bedrock Runtime endpoint in us-east-1.", fr: "Faire appeler par la couche de eu-west-1 le profil d'inférence entre Régions global par le point de terminaison Bedrock Runtime de us-east-1." } }
    - { id: b, text: { en: "Create an inter-Region VPC peering connection to a us-east-1 VPC that has an interface endpoint for bedrock-runtime, and send the eu-west-1 requests through that endpoint.", fr: "Créer une connexion d'appairage de VPC entre Régions vers un VPC de us-east-1 doté d'un point de terminaison d'interface pour bedrock-runtime, et envoyer les requêtes de eu-west-1 par ce point de terminaison." } }
    - { id: c, text: { en: "Have the eu-west-1 tier invoke the EU geographic cross-Region inference profile through the Bedrock Runtime endpoint in eu-west-1.", fr: "Faire appeler par la couche de eu-west-1 le profil d'inférence entre Régions géographique EU par le point de terminaison Bedrock Runtime de eu-west-1." } }
    - { id: d, text: { en: "Move the eu-west-1 application tier to us-east-1, and serve EU users from us-east-1 through Amazon CloudFront.", fr: "Déplacer la couche applicative de eu-west-1 vers us-east-1, et servir les utilisateurs européens depuis us-east-1 par Amazon CloudFront." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Calling the EU geographic profile from eu-west-1 sends the prompts to a local Regional endpoint, and Amazon Bedrock routes them within the EU over the AWS network with no additional routing cost. The price is calculated from the source Region, eu-west-1, so the 30 TB of images no longer pays inter-Region data transfer from the application tier. Requests stay in Europe, which also keeps EU response times low.
    fr: |
      Appeler le profil géographique EU depuis eu-west-1 envoie les invites vers un point de terminaison régional local, et Amazon Bedrock les achemine au sein de l'UE sur le réseau AWS, sans coût de routage supplémentaire. Le prix est calculé à partir de la Région source, eu-west-1 : les 30 To d'images ne paient plus de transfert de données entre Régions depuis la couche applicative. Les requêtes restent en Europe, ce qui garde aussi des temps de réponse faibles en Europe.
  options:
    a: { en: "The eu-west-1 tier would still send every prompt to an endpoint in us-east-1, so the 30 TB would keep crossing the Atlantic and paying inter-Region transfer.", fr: "La couche de eu-west-1 enverrait toujours chaque invite vers un point de terminaison de us-east-1 : les 30 To continueraient de traverser l'Atlantique et de payer le transfert entre Régions." }
    b: { en: "Inter-Region peering still carries every prompt to us-east-1, so inter-Region transfer remains and interface endpoint charges are added.", fr: "L'appairage entre Régions transporte toujours chaque invite vers us-east-1 : le transfert entre Régions demeure et les frais du point de terminaison d'interface s'ajoutent." }
    d: { en: "Serving EU users from us-east-1 raises their response times and moves the transfer to CloudFront instead of removing it.", fr: "Servir les utilisateurs européens depuis us-east-1 augmente leurs temps de réponse et déplace le transfert vers CloudFront au lieu de le supprimer." }
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
  - title: Geographic cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/geographic-cross-region-inference.html
