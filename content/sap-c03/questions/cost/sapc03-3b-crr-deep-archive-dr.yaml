id: sapc03-3b-crr-deep-archive-dr
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany, a financial services company, stores signed customer statements as PDF files in an Amazon S3 bucket in eu-west-1. The objects use the S3 Standard storage class, S3 Versioning is enabled, and about 3 TB of new objects arrive each month. Objects are never modified after upload.

    Auditors now require a second copy of every new object in eu-central-1, in a bucket that a separate security account owns. The copy exists only for a Regional disaster: the company accepts that restoring objects from the copy can take up to 48 hours, and it expects to read from the copy at most once every few years. Objects must be kept in the copy for 10 years. The company wants to minimize the cost of storing and transferring the copy.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany, une société de services financiers, stocke des relevés clients signés au format PDF dans un compartiment Amazon S3 de eu-west-1. Les objets utilisent la classe de stockage S3 Standard, S3 Versioning est activé et environ 3 To de nouveaux objets arrivent chaque mois. Les objets ne sont jamais modifiés après leur chargement.

    Les auditeurs exigent désormais une deuxième copie de chaque nouvel objet dans eu-central-1, dans un compartiment qui appartient à un compte de sécurité distinct. Cette copie ne sert qu'en cas de sinistre régional : l'entreprise accepte que la restauration d'objets depuis la copie prenne jusqu'à 48 heures, et elle prévoit de lire la copie au plus une fois tous les quelques ans. Les objets doivent être conservés dans la copie pendant 10 ans. L'entreprise veut réduire au minimum le coût de stockage et de transfert de la copie.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Configure S3 Cross-Region Replication with S3 Replication Time Control to the eu-central-1 bucket, and add an S3 Lifecycle rule on the destination bucket that transitions objects to S3 Glacier Deep Archive after 30 days.", fr: "Configurer S3 Cross-Region Replication avec S3 Replication Time Control vers le compartiment de eu-central-1, et ajouter sur le compartiment de destination une règle S3 Lifecycle qui fait passer les objets en S3 Glacier Deep Archive après 30 jours." } }
    - { id: b, text: { en: "Create an AWS Backup plan for the source bucket with daily backups and a copy rule to a backup vault of the security account in eu-central-1, with a 10-year retention period.", fr: "Créer un plan AWS Backup pour le compartiment source avec des sauvegardes quotidiennes et une règle de copie vers un coffre de sauvegarde du compte de sécurité dans eu-central-1, avec une durée de conservation de 10 ans." } }
    - { id: c, text: { en: "Configure S3 Cross-Region Replication to the eu-central-1 bucket, and set S3 Glacier Deep Archive as the storage class of the replicas in the replication rule.", fr: "Configurer S3 Cross-Region Replication vers le compartiment de eu-central-1, et définir S3 Glacier Deep Archive comme classe de stockage des réplicas dans la règle de réplication." } }
    - { id: d, text: { en: "Configure S3 Cross-Region Replication to the eu-central-1 bucket with S3 Standard-IA as the replica storage class, and add an S3 Lifecycle rule that transitions replicas to S3 Glacier Flexible Retrieval after 90 days.", fr: "Configurer S3 Cross-Region Replication vers le compartiment de eu-central-1 avec S3 Standard-IA comme classe de stockage des réplicas, et ajouter une règle S3 Lifecycle qui fait passer les réplicas en S3 Glacier Flexible Retrieval après 90 jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A replication rule can write each replica directly into a storage class chosen for the destination, and the destination bucket can belong to another account. Writing replicas straight to S3 Glacier Deep Archive avoids paying for a warmer class first, and its retrieval times (within 12 hours for standard retrievals, within 48 hours for bulk) fit the accepted 48-hour restore window. The inter-Region transfer of each new object is paid once in every option, so the storage class of the copy decides the cost.
    fr: |
      Une règle de réplication peut écrire chaque réplica directement dans une classe de stockage choisie pour la destination, et le compartiment de destination peut appartenir à un autre compte. Écrire les réplicas directement en S3 Glacier Deep Archive évite de payer d'abord une classe plus chaude, et ses délais de récupération (moins de 12 heures en standard, moins de 48 heures en bulk) respectent la fenêtre de restauration acceptée de 48 heures. Le transfert entre Régions de chaque nouvel objet est payé une fois dans toutes les options : c'est la classe de stockage de la copie qui fait la différence de coût.
  options:
    a: { en: "S3 Replication Time Control adds a per-GB charge for a 15-minute replication SLA that the auditors do not require, and every replica is first billed for 30 days in S3 Standard.", fr: "S3 Replication Time Control ajoute des frais par Go pour un SLA de réplication de 15 minutes que les auditeurs n'exigent pas, et chaque réplica est d'abord facturé 30 jours en S3 Standard." }
    b: { en: "AWS Backup bills S3 backups at backup storage rates that are far higher than S3 Glacier Deep Archive, and the plan adds backup and cross-Region copy charges on top.", fr: "AWS Backup facture les sauvegardes S3 aux tarifs du stockage de sauvegarde, bien plus élevés que S3 Glacier Deep Archive, et le plan ajoute des frais de sauvegarde et de copie entre Régions." }
    d: { en: "This meets the restore window, but replicas pay S3 Standard-IA prices for 90 days and then S3 Glacier Flexible Retrieval prices, which are higher than S3 Glacier Deep Archive for a 10-year retention.", fr: "Cette option respecte la fenêtre de restauration, mais les réplicas paient le tarif S3 Standard-IA pendant 90 jours puis celui de S3 Glacier Flexible Retrieval, plus élevé que S3 Glacier Deep Archive pour une conservation de 10 ans." }
references:
  - title: Amazon S3 FAQs
    url: https://aws.amazon.com/s3/faqs/
  - title: Meeting compliance requirements with S3 Replication Time Control
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
