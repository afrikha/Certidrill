id: sapc03-3c-cwagent-asg-aggregation
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 2,000 Amazon EC2 instances in 40 Auto Scaling groups. The CloudWatch agent on every instance publishes memory and disk utilization every 10 seconds, with the InstanceId and AutoScalingGroupName dimensions. Because instances are replaced often, the number of custom metrics and the high-resolution data points have made CloudWatch metrics one of the largest observability costs. Operations dashboards and alarms use only the average memory and disk utilization of each Auto Scaling group at 1-minute granularity. No team looks at per-instance values of these metrics.

    Which change to the CloudWatch agent configuration will reduce the cost MOST while meeting these requirements?
  fr: |
    AnyCompany exécute 2 000 instances Amazon EC2 dans 40 groupes Auto Scaling. L'agent CloudWatch de chaque instance publie l'utilisation de la mémoire et du disque toutes les 10 secondes, avec les dimensions InstanceId et AutoScalingGroupName. Comme les instances sont souvent remplacées, le nombre de métriques personnalisées et les points de données haute résolution ont fait des métriques CloudWatch l'un des plus gros coûts d'observabilité. Les tableaux de bord et les alarmes d'exploitation n'utilisent que l'utilisation moyenne de la mémoire et du disque de chaque groupe Auto Scaling, avec une granularité d'une minute. Aucune équipe ne consulte les valeurs par instance de ces métriques.

    Quelle modification de la configuration de l'agent CloudWatch réduit le PLUS les coûts tout en répondant à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the current collection and add CloudWatch metric math expressions to the dashboards and alarms that average the per-instance metrics of each Auto Scaling group.", fr: "Conserver la collecte actuelle et ajouter aux tableaux de bord et aux alarmes des expressions mathématiques de métriques CloudWatch qui font la moyenne des métriques par instance de chaque groupe Auto Scaling." }
    - id: b
      text: { en: "Set metrics_collection_interval to 60, set aggregation_dimensions to [[\"AutoScalingGroupName\"]], and list the memory and disk metrics in drop_original_metrics.", fr: "Définir metrics_collection_interval à 60, définir aggregation_dimensions à [[\"AutoScalingGroupName\"]] et lister les métriques de mémoire et de disque dans drop_original_metrics." }
    - id: c
      text: { en: "Set metrics_collection_interval to 60 and keep the InstanceId and AutoScalingGroupName dimensions on every metric.", fr: "Définir metrics_collection_interval à 60 et conserver les dimensions InstanceId et AutoScalingGroupName sur chaque métrique." }
    - id: d
      text: { en: "Set aggregation_dimensions to [[\"AutoScalingGroupName\"], []] and keep the 10-second collection interval so that alarms react faster.", fr: "Définir aggregation_dimensions à [[\"AutoScalingGroupName\"], []] et conserver l'intervalle de collecte de 10 secondes pour que les alarmes réagissent plus vite." }
answer: { optionId: b }
explanation:
  correct:
    en: "A collection interval below 60 seconds makes every metric high resolution, so 60 seconds matches the 1-minute need. aggregation_dimensions rolls the metrics up per Auto Scaling group, and drop_original_metrics stops the agent from also sending the per-instance versions, which AWS states reduces the number of metrics and the cost."
    fr: "Un intervalle de collecte inférieur à 60 secondes rend chaque métrique haute résolution : 60 secondes correspond au besoin d'une minute. aggregation_dimensions agrège les métriques par groupe Auto Scaling, et drop_original_metrics empêche l'agent d'envoyer aussi les versions par instance, ce qui, selon AWS, réduit le nombre de métriques et le coût."
  options:
    a:
      en: "Metric math only computes values at query time; every per-instance high-resolution metric is still published and billed."
      fr: "Les expressions mathématiques ne calculent des valeurs qu'au moment de la requête : chaque métrique haute résolution par instance reste publiée et facturée."
    c:
      en: "Standard resolution removes the high-resolution data points, but one custom metric per instance and per replaced instance is still created, which is the larger cost."
      fr: "La résolution standard supprime les points de données haute résolution, mais une métrique personnalisée par instance, y compris par instance remplacée, est toujours créée, ce qui constitue le coût principal."
    d:
      en: "Without drop_original_metrics, the agent sends the aggregated metrics in addition to the per-instance ones, so the metric count grows, and the 10-second interval keeps high-resolution data that nobody uses."
      fr: "Sans drop_original_metrics, l'agent envoie les métriques agrégées en plus des métriques par instance : le nombre de métriques augmente, et l'intervalle de 10 secondes conserve des données haute résolution que personne n'utilise."
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
