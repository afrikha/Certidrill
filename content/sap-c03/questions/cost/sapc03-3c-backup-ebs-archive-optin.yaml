id: sapc03-3c-backup-ebs-archive-optin
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany protects the Amazon EBS volumes of its ERP servers with an AWS Backup plan that is deployed through an AWS Organizations backup policy. Daily backups are kept for 35 days and are often restored. Monthly backups must be kept for 7 years for auditors, and they are restored perhaps once a year, when a restore that takes a few days is acceptable. Today, both rules keep every recovery point in warm storage, and the monthly backups now dominate the backup bill. The company wants to reduce the cost of the monthly backups without adding another backup tool.

    Which change to the backup plan will meet these requirements?
  fr: |
    AnyCompany protège les volumes Amazon EBS de ses serveurs ERP avec un plan AWS Backup déployé par une politique de sauvegarde AWS Organizations. Les sauvegardes quotidiennes sont conservées 35 jours et sont souvent restaurées. Les sauvegardes mensuelles doivent être conservées 7 ans pour les auditeurs, et elles sont restaurées peut-être une fois par an, lorsqu'une restauration de quelques jours est acceptable. Aujourd'hui, les deux règles conservent chaque point de récupération en stockage chaud, et les sauvegardes mensuelles dominent désormais la facture de sauvegarde. L'entreprise veut réduire le coût des sauvegardes mensuelles sans ajouter un autre outil de sauvegarde.

    Quelle modification du plan de sauvegarde répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "In both rules, set MoveToColdStorageAfterDays to 7 and keep the current retention, so that every EBS backup reaches the cheaper tier quickly.", fr: "Dans les deux règles, définir MoveToColdStorageAfterDays à 7 et conserver la rétention actuelle, pour que chaque sauvegarde EBS atteigne rapidement le niveau le moins cher." }
    - id: b
      text: { en: "In the monthly rule, set MoveToColdStorageAfterDays to 30 and DeleteAfterDays to 2,557, without changing any other setting.", fr: "Dans la règle mensuelle, définir MoveToColdStorageAfterDays à 30 et DeleteAfterDays à 2 557, sans modifier aucun autre paramètre." }
    - id: c
      text: { en: "In the monthly rule, set OptInToArchiveForSupportedResources to true, MoveToColdStorageAfterDays to 30, and DeleteAfterDays to 2,557.", fr: "Dans la règle mensuelle, définir OptInToArchiveForSupportedResources sur true, MoveToColdStorageAfterDays à 30 et DeleteAfterDays à 2 557." }
    - id: d
      text: { en: "Replace the monthly rule with an Amazon Data Lifecycle Manager default policy for EBS snapshots that retains snapshots for 7 years.", fr: "Remplacer la règle mensuelle par une politique par défaut Amazon Data Lifecycle Manager pour les instantanés EBS qui conserve les instantanés 7 ans." }
answer: { optionId: c }
explanation:
  correct:
    en: "For Amazon EBS, AWS Backup cold storage uses the EBS Snapshots Archive tier, which must be enabled with OptInToArchiveForSupportedResources and is available when the backup frequency is monthly or less often. The retention of 2,557 days is more than 90 days after the 30-day transition, as cold storage requires, and the daily rule stays in warm storage for fast restores."
    fr: "Pour Amazon EBS, le stockage à froid d'AWS Backup utilise le niveau EBS Snapshots Archive, qui doit être activé avec OptInToArchiveForSupportedResources et est disponible lorsque la fréquence de sauvegarde est mensuelle ou moins fréquente. La rétention de 2 557 jours dépasse de plus de 90 jours la transition à 30 jours, comme l'exige le stockage à froid, et la règle quotidienne reste en stockage chaud pour des restaurations rapides."
  options:
    a:
      en: "Daily backups kept 35 days cannot satisfy the 90-day minimum in cold storage, and EBS archiving is not available for a daily frequency; archived EBS backups also become full copies."
      fr: "Des sauvegardes quotidiennes conservées 35 jours ne peuvent pas respecter le minimum de 90 jours en stockage à froid, et l'archivage EBS n'est pas disponible pour une fréquence quotidienne ; les sauvegardes EBS archivées deviennent en outre des copies complètes."
    b:
      en: "Without the archive opt-in for supported resources, the EBS recovery points are not moved to the EBS Snapshots Archive tier, so they stay in warm storage and nothing is saved."
      fr: "Sans l'activation de l'archivage pour les ressources prises en charge, les points de récupération EBS ne sont pas déplacés vers le niveau EBS Snapshots Archive : ils restent en stockage chaud et rien n'est économisé."
    d:
      en: "Moving the monthly backups to Data Lifecycle Manager adds a second tool, and keeping standard-tier snapshots for 7 years does not lower their storage price."
      fr: "Déplacer les sauvegardes mensuelles vers Data Lifecycle Manager ajoute un second outil, et conserver 7 ans des instantanés du niveau standard ne réduit pas leur prix de stockage."
references:
  - title: Backup plan options and configuration
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
