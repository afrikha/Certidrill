id: sapc03-3a-egress-hub-s3-gateway
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a hub-and-spoke network in one Region: 50 spoke VPCs attach to an AWS Transit Gateway, and all traffic that leaves the spokes for the internet or AWS service endpoints is routed to a central egress VPC with NAT gateways and AWS Network Firewall. Workloads in the spokes move about 400 TB each month to and from Amazon S3 buckets in the same Region, and all these buckets belong to the company's organization. The finance team found that most of the Transit Gateway data processing, Network Firewall and NAT gateway charges come from this S3 traffic. The security team confirmed that traffic to these buckets does not need firewall inspection. Security requires that S3 traffic never traverses the internet and that spoke workloads can reach only buckets that belong to the organization.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany utilise un réseau en étoile (hub-and-spoke) dans une Région : 50 VPC rayons sont attachés à une AWS Transit Gateway, et tout le trafic qui quitte les rayons vers internet ou les points de terminaison des services AWS est routé vers un VPC de sortie central doté de passerelles NAT et d'AWS Network Firewall. Les charges de travail des rayons échangent environ 400 To par mois avec des compartiments Amazon S3 de la même Région, et tous ces compartiments appartiennent à l'organisation de l'entreprise. L'équipe financière a constaté que l'essentiel des frais de traitement des données de la Transit Gateway, de Network Firewall et des passerelles NAT provient de ce trafic S3. L'équipe de sécurité a confirmé que le trafic vers ces compartiments n'a pas besoin d'être inspecté par le pare-feu. La sécurité exige que le trafic S3 ne traverse jamais internet et que les charges de travail des rayons ne puissent joindre que des compartiments appartenant à l'organisation.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Create an S3 interface endpoint in the egress VPC with an endpoint policy that allows only the organization's buckets, and route the S3 traffic of the spokes to it through the transit gateway."
        fr: "Créer un point de terminaison d'interface S3 dans le VPC de sortie avec une politique de point de terminaison qui n'autorise que les compartiments de l'organisation, et y router le trafic S3 des rayons via la passerelle de transit."
    - id: b
      text:
        en: "Create an S3 gateway endpoint in each spoke VPC with an endpoint policy that allows only the organization's buckets, and associate it with the spoke route tables."
        fr: "Créer un point de terminaison de passerelle S3 dans chaque VPC rayon avec une politique de point de terminaison qui n'autorise que les compartiments de l'organisation, et l'associer aux tables de routage du rayon."
    - id: c
      text:
        en: "Replace the NAT gateways in the egress VPC with NAT instances on Graviton-based EC2 instances, and keep the S3 traffic on the central egress path."
        fr: "Remplacer les passerelles NAT du VPC de sortie par des instances NAT sur des instances EC2 basées sur Graviton, et conserver le trafic S3 sur le chemin de sortie central."
    - id: d
      text:
        en: "Create an S3 gateway endpoint in the egress VPC with an endpoint policy that allows only the organization's buckets, and route the S3 traffic of the spokes to it through the transit gateway."
        fr: "Créer un point de terminaison de passerelle S3 dans le VPC de sortie avec une politique de point de terminaison qui n'autorise que les compartiments de l'organisation, et y router le trafic S3 des rayons via la passerelle de transit."
answer: { optionId: b }
explanation:
  correct:
    en: "A gateway endpoint in each spoke keeps S3 traffic inside the VPC on the AWS network, with no hourly or data processing charge, so the 400 TB no longer passes through the transit gateway, the firewall or the NAT gateways. An endpoint policy that allows only the organization's buckets enforces the access requirement at each spoke."
    fr: "Un point de terminaison de passerelle dans chaque rayon garde le trafic S3 dans le VPC, sur le réseau AWS, sans frais horaires ni de traitement des données : les 400 To ne passent plus par la passerelle de transit, le pare-feu ni les passerelles NAT. Une politique de point de terminaison qui n'autorise que les compartiments de l'organisation applique l'exigence d'accès dans chaque rayon."
  options:
    a:
      en: "A central interface endpoint is reachable through the transit gateway, but every GB still incurs Transit Gateway data processing plus the endpoint's hourly and per-GB charges."
      fr: "Un point de terminaison d'interface central est joignable via la passerelle de transit, mais chaque Go entraîne toujours des frais de traitement de la Transit Gateway en plus des frais horaires et par Go du point de terminaison."
    c:
      en: "NAT instances add operational work and the S3 traffic still incurs Transit Gateway and Network Firewall processing charges."
      fr: "Les instances NAT ajoutent du travail d'exploitation, et le trafic S3 entraîne toujours des frais de traitement de la Transit Gateway et de Network Firewall."
    d:
      en: "A gateway endpoint cannot be used by traffic that arrives through a transit gateway, so the spokes could not reach S3 through it."
      fr: "Un point de terminaison de passerelle ne peut pas être utilisé par du trafic arrivant via une passerelle de transit : les rayons ne pourraient pas joindre S3 par ce biais."
references:
  - title: "Gateway endpoints for Amazon S3"
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: "COST08-BP03 Implement services to reduce data transfer costs"
    url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/cost_data_transfer_implement_services.html
