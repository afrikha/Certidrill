id: sapc03-3b-central-s3-endpoint-tgw
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany hosts centralized interface VPC endpoints for 20 AWS services, including Amazon S3, in a shared services VPC. Seventy spoke VPCs in the same Region reach these endpoints through an AWS Transit Gateway, and Route 53 private hosted zones for the service names, including the S3 zone, are associated with every spoke VPC.

    A cost review shows that the spokes exchange about 350 TB each month with S3 buckets in the same Region through the central S3 interface endpoint. This traffic pays transit gateway data processing and PrivateLink data processing. Bucket policies allow access only through approved VPC endpoints by using the aws:SourceVpce condition key. On-premises servers also use the central S3 interface endpoint over AWS Direct Connect, and that access must keep working.

    Which solution will reduce the cost of the spoke S3 traffic the MOST while meeting these requirements?
  fr: |
    AnyCompany héberge des points de terminaison de VPC d'interface centralisés pour 20 services AWS, dont Amazon S3, dans un VPC de services partagés. Soixante-dix VPC spoke de la même Région atteignent ces points de terminaison par une passerelle AWS Transit Gateway, et des zones hébergées privées Route 53 pour les noms des services, y compris la zone S3, sont associées à chaque VPC spoke.

    Une revue des coûts montre que les spokes échangent environ 350 To par mois avec des compartiments S3 de la même Région par le point de terminaison d'interface S3 central. Ce trafic paie le traitement des données de la passerelle de transit et le traitement des données PrivateLink. Les politiques de compartiment n'autorisent l'accès que par des points de terminaison de VPC approuvés à l'aide de la clé de condition aws:SourceVpce. Des serveurs sur site utilisent aussi le point de terminaison d'interface S3 central par AWS Direct Connect, et cet accès doit continuer à fonctionner.

    Quelle solution réduit le PLUS le coût du trafic S3 des spokes tout en respectant ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an S3 gateway endpoint in the shared services VPC, route the spokes' S3 traffic to it through the transit gateway, and keep the central S3 interface endpoint.", fr: "Créer un point de terminaison de passerelle S3 dans le VPC de services partagés, y acheminer le trafic S3 des spokes par la passerelle de transit, et conserver le point de terminaison d'interface S3 central." } }
    - { id: b, text: { en: "Create an S3 interface endpoint with private DNS in every spoke VPC, add the new endpoint IDs to the bucket policies, and delete the central S3 interface endpoint.", fr: "Créer un point de terminaison d'interface S3 avec DNS privé dans chaque VPC spoke, ajouter les ID des nouveaux points de terminaison aux politiques de compartiment, et supprimer le point de terminaison d'interface S3 central." } }
    - { id: c, text: { en: "Create an S3 gateway endpoint in every spoke VPC, remove the S3 private hosted zone from the spokes, allow the new endpoint IDs in bucket policies, and keep the central endpoint.", fr: "Créer un point de terminaison de passerelle S3 dans chaque VPC spoke, retirer la zone hébergée privée S3 des spokes, autoriser les ID des nouveaux points de terminaison dans les politiques de compartiment, et conserver le point de terminaison central." } }
    - { id: d, text: { en: "Replace the transit gateway connections with VPC peering connections between each spoke VPC and the shared services VPC, and keep the central S3 interface endpoint and its zone.", fr: "Remplacer les connexions à la passerelle de transit par des connexions d'appairage de VPC entre chaque VPC spoke et le VPC de services partagés, et conserver le point de terminaison d'interface S3 central et sa zone." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Gateway endpoints for S3 have no hourly or data processing charge, so spoke S3 traffic that uses a local gateway endpoint no longer pays transit gateway or PrivateLink processing. The S3 private hosted zone must be removed from the spokes; otherwise the S3 names keep resolving to the central interface endpoint's private IP addresses and traffic never uses the gateway endpoint route. Adding the new endpoint IDs keeps the aws:SourceVpce bucket policies working, and the central interface endpoint stays for on-premises clients.
    fr: |
      Les points de terminaison de passerelle S3 n'ont ni frais horaires ni frais de traitement des données : le trafic S3 des spokes qui utilise un point de terminaison de passerelle local ne paie plus le traitement de la passerelle de transit ni celui de PrivateLink. La zone hébergée privée S3 doit être retirée des spokes ; sinon, les noms S3 continuent de se résoudre vers les adresses IP privées du point de terminaison d'interface central et le trafic n'emprunte jamais la route du point de terminaison de passerelle. Ajouter les ID des nouveaux points de terminaison préserve les politiques de compartiment aws:SourceVpce, et le point de terminaison d'interface central reste en place pour les clients sur site.
  options:
    a: { en: "A gateway endpoint is used only by the route tables of its own VPC; traffic arriving from other VPCs through a transit gateway cannot use it.", fr: "Un point de terminaison de passerelle n'est utilisé que par les tables de routage de son propre VPC ; le trafic qui arrive d'autres VPC par une passerelle de transit ne peut pas l'utiliser." }
    b: { en: "Seventy sets of interface endpoints add hourly charges in every Availability Zone and still pay PrivateLink data processing per GB, and deleting the central endpoint breaks on-premises access.", fr: "Soixante-dix jeux de points de terminaison d'interface ajoutent des frais horaires dans chaque zone de disponibilité et paient toujours le traitement des données PrivateLink par Go, et supprimer le point de terminaison central coupe l'accès sur site." }
    d: { en: "Peering removes transit gateway processing, but every GB still pays PrivateLink data processing, and 70 peering connections add routing to operate.", fr: "L'appairage supprime le traitement de la passerelle de transit, mais chaque Go paie toujours le traitement des données PrivateLink, et 70 connexions d'appairage ajoutent du routage à exploiter." }
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
  - title: Centralized access to VPC private endpoints
    url: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-access-to-vpc-private-endpoints.html
