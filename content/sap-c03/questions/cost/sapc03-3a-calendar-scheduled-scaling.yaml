id: sapc03-3a-calendar-scheduled-scaling
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany operates a market data API for a stock exchange on Amazon EC2 instances in an Auto Scaling group in the eu-central-1 Region. Trading opens at 08:00 local time, and request volume grows tenfold within two minutes of the open. New instances need about 6 minutes to become ready, and the current target tracking policy reacts too late, which causes errors at every open. The exchange publishes its calendar of trading days a year in advance, and there is no trading on exchange holidays, even on weekdays. Outside trading hours, the API receives very little traffic. The company wants to remove the errors at the open while keeping costs as low as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite une API de données de marché pour une bourse sur des instances Amazon EC2 d'un groupe Auto Scaling dans la Région eu-central-1. La séance ouvre à 08:00 heure locale, et le volume de requêtes est multiplié par dix dans les deux minutes qui suivent l'ouverture. Les nouvelles instances ont besoin d'environ 6 minutes pour être prêtes, et la politique de suivi de cible actuelle réagit trop tard, ce qui provoque des erreurs à chaque ouverture. La bourse publie un an à l'avance le calendrier des jours de séance, et il n'y a pas de séance les jours fériés boursiers, même en semaine. En dehors des heures de séance, l'API reçoit très peu de trafic. L'entreprise veut supprimer les erreurs à l'ouverture tout en maintenant les coûts aussi bas que possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a predictive scaling policy that forecasts capacity from the daily and weekly history of the group, and keep the target tracking policy for unexpected changes."
        fr: "Ajouter une politique de mise à l'échelle prédictive qui prévoit la capacité à partir de l'historique quotidien et hebdomadaire du groupe, et conserver la politique de suivi de cible pour les variations imprévues."
    - id: b
      text:
        en: "Set the minimum capacity of the group permanently to the capacity needed at the open, and keep the target tracking policy for the rest of the day."
        fr: "Fixer en permanence la capacité minimale du groupe à la capacité nécessaire à l'ouverture, et conserver la politique de suivi de cible pour le reste de la journée."
    - id: c
      text:
        en: "Each month, create scheduled actions from the trading calendar that raise the minimum capacity before 08:00 on trading days and lower it after the close, and keep target tracking."
        fr: "Chaque mois, créer à partir du calendrier boursier des actions planifiées qui relèvent la capacité minimale avant 08:00 les jours de séance et l'abaissent après la clôture, et conserver le suivi de cible."
    - id: d
      text:
        en: "Replace the target tracking policy with a step scaling policy that adds a large number of instances at once when the request count per target exceeds the threshold of its alarm."
        fr: "Remplacer la politique de suivi de cible par une politique de mise à l'échelle par étapes qui ajoute d'un coup un grand nombre d'instances lorsque le nombre de requêtes par cible dépasse le seuil de son alarme."
answer: { optionId: c }
explanation:
  correct:
    en: "Scheduled actions change the minimum, maximum or desired capacity at set times in a chosen IANA time zone, so capacity is ready before the open only on actual trading days. Target tracking keeps adjusting capacity within the scheduled limits during the session, and the minimum is lowered again after the close."
    fr: "Les actions planifiées modifient la capacité minimale, maximale ou souhaitée à des heures fixées dans un fuseau horaire IANA choisi : la capacité est donc prête avant l'ouverture uniquement les vrais jours de séance. Le suivi de cible continue d'ajuster la capacité dans les limites planifiées pendant la séance, et la capacité minimale est de nouveau abaissée après la clôture."
  options:
    a:
      en: "Predictive scaling learns from past daily and weekly patterns and does not know the exchange calendar, so it adds capacity on holidays and can under-forecast the first day after a holiday."
      fr: "La mise à l'échelle prédictive apprend des schémas quotidiens et hebdomadaires passés et ignore le calendrier boursier : elle ajoute de la capacité les jours fériés et peut sous-estimer le premier jour après un férié."
    b:
      en: "A permanent minimum sized for the open keeps peak capacity running at night, on weekends and on holidays, when the API receives very little traffic."
      fr: "Une capacité minimale permanente dimensionnée pour l'ouverture maintient la capacité de pointe la nuit, le week-end et les jours fériés, quand l'API reçoit très peu de trafic."
    d:
      en: "Step scaling is also reactive, so instances still need about 6 minutes after the spike begins and the errors at the open remain."
      fr: "La mise à l'échelle par étapes est elle aussi réactive : les instances ont toujours besoin d'environ 6 minutes après le début du pic, et les erreurs à l'ouverture persistent."
references:
  - title: "Scheduled scaling for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html
  - title: "Predictive scaling for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
