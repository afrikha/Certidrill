id: sapc03-3b-dlm-snapshot-tags
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany allocates costs by the CostCenter tag, which is applied correctly to all EBS volumes. EBS snapshot storage now represents a quarter of the storage spend, and it appears as untagged in the cost reports.

    In each account, Amazon Data Lifecycle Manager policies take daily snapshots of all volumes that carry the tag Backup=daily, whatever their cost center, and copy the snapshots to a second Region for disaster recovery. The FinOps team requires that snapshot costs in both Regions be allocated to the CostCenter of the source volume. The team wants the least effort and no custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany répartit ses coûts selon la balise CostCenter, correctement appliquée à tous les volumes EBS. Le stockage des instantanés EBS représente désormais un quart des dépenses de stockage, et il apparaît sans balise dans les rapports de coûts.

    Dans chaque compte, des politiques Amazon Data Lifecycle Manager prennent des instantanés quotidiens de tous les volumes qui portent la balise Backup=daily, quel que soit leur centre de coûts, et copient les instantanés vers une deuxième Région pour la reprise après sinistre. L'équipe FinOps exige que les coûts des instantanés dans les deux Régions soient répartis vers le CostCenter du volume source. L'équipe veut le moins d'effort possible et aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a static CostCenter tag to each policy schedule by using the tags to add setting, with the value of the account's main cost center.", fr: "Ajouter une balise CostCenter statique à chaque planification de politique avec le paramètre des balises à ajouter, avec pour valeur le centre de coûts principal du compte." } }
    - { id: b, text: { en: "Activate the AWS-generated aws:createdBy cost allocation tag, and allocate snapshot costs by the principal that created each snapshot.", fr: "Activer la balise de répartition des coûts générée par AWS aws:createdBy, et répartir les coûts des instantanés selon le principal qui a créé chaque instantané." } }
    - { id: c, text: { en: "Enable copy tags from source in the policy schedules and in their cross-Region copy rules.", fr: "Activer la copie des balises de la source (copy tags from source) dans les planifications des politiques et dans leurs règles de copie entre Régions." } }
    - { id: d, text: { en: "Deploy the AWS Config required-tags rule for snapshots with CostCenter as the required key, and fix the noncompliant snapshots that it reports.", fr: "Déployer la règle AWS Config required-tags pour les instantanés avec CostCenter comme clé obligatoire, et corriger les instantanés non conformes qu'elle signale." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Snapshots do not inherit volume tags by themselves, but a Data Lifecycle Manager schedule can copy all user-defined tags from the source volume to the snapshots it creates. Static user-defined tags such as CostCenter are also copied to cross-Region copies, so the snapshots in both Regions carry the cost center of their source volume. This is a policy setting, with no code to write.
    fr: |
      Les instantanés n'héritent pas d'eux-mêmes des balises du volume, mais une planification Data Lifecycle Manager peut copier toutes les balises définies par l'utilisateur du volume source vers les instantanés qu'elle crée. Les balises statiques définies par l'utilisateur, comme CostCenter, sont aussi copiées vers les copies entre Régions : les instantanés des deux Régions portent ainsi le centre de coûts de leur volume source. C'est un paramètre de politique, sans code à écrire.
  options:
    a: { en: "One policy snapshots volumes of many cost centers, so a single static value would allocate their snapshots to the wrong cost center.", fr: "Une même politique prend des instantanés de volumes de nombreux centres de coûts : une seule valeur statique répartirait leurs instantanés vers le mauvais centre de coûts." }
    b: { en: "The creator of every snapshot is the Data Lifecycle Manager role, so aws:createdBy says nothing about the cost center of the source volume.", fr: "Le créateur de chaque instantané est le rôle de Data Lifecycle Manager : aws:createdBy n'indique rien du centre de coûts du volume source." }
    d: { en: "The required-tags rule only reports missing tags and does not list EBS snapshots among its resource types; fixing snapshots by hand every day is not least effort.", fr: "La règle required-tags ne fait que signaler les balises manquantes et ne compte pas les instantanés EBS parmi ses types de ressources ; corriger des instantanés à la main chaque jour n'est pas l'effort le plus faible." }
references:
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-ami-policy.html
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
