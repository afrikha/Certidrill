id: sapc03-3c-backup-cold-supported-types
objective: "3.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses an AWS Organizations backup policy to apply one backup rule to every resource tagged retention=long across 50 accounts. The rule takes a monthly backup, moves it to cold storage after 30 days, and deletes it after 7 years. The tagged resources are Amazon EFS file systems, Amazon DynamoDB tables in accounts where AWS Backup advanced features for DynamoDB are turned on, Amazon RDS for PostgreSQL DB instances, Amazon Aurora MySQL-Compatible Edition DB clusters, and Amazon S3 buckets. The FinOps team assumed that all monthly recovery points would be billed at cold storage prices after 30 days. A solutions architect must tell the team which recovery points will actually move to cold storage.

    Which two resource types will have their recovery points moved to cold storage by this rule? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany utilise une politique de sauvegarde AWS Organizations pour appliquer une même règle de sauvegarde à chaque ressource balisée retention=long dans 50 comptes. La règle effectue une sauvegarde mensuelle, la déplace vers le stockage à froid après 30 jours et la supprime au bout de 7 ans. Les ressources balisées sont des systèmes de fichiers Amazon EFS, des tables Amazon DynamoDB dans des comptes où les fonctionnalités avancées d'AWS Backup pour DynamoDB sont activées, des instances de base de données Amazon RDS for PostgreSQL, des clusters de bases de données Amazon Aurora MySQL-Compatible Edition et des compartiments Amazon S3. L'équipe FinOps supposait que tous les points de récupération mensuels seraient facturés au prix du stockage à froid après 30 jours. Un architecte de solutions doit indiquer à l'équipe quels points de récupération passeront réellement en stockage à froid.

    Pour quels deux types de ressources cette règle déplacera-t-elle les points de récupération vers le stockage à froid ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Amazon EFS file systems", fr: "Systèmes de fichiers Amazon EFS" } }
    - { id: b, text: { en: "Amazon DynamoDB tables with AWS Backup advanced features turned on", fr: "Tables Amazon DynamoDB avec les fonctionnalités avancées d'AWS Backup activées" } }
    - { id: c, text: { en: "Amazon RDS for PostgreSQL DB instances", fr: "Instances de base de données Amazon RDS for PostgreSQL" } }
    - { id: d, text: { en: "Amazon Aurora MySQL-Compatible Edition DB clusters", fr: "Clusters de bases de données Amazon Aurora MySQL-Compatible Edition" } }
    - { id: e, text: { en: "Amazon S3 buckets", fr: "Compartiments Amazon S3" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "AWS Backup supports lifecycle to cold storage only for some resource types, including Amazon EFS and DynamoDB with AWS Backup advanced features. For other resource types, the cold storage setting is ignored and recovery points stay in warm storage until they are deleted."
    fr: "AWS Backup ne prend en charge le cycle de vie vers le stockage à froid que pour certains types de ressources, dont Amazon EFS et DynamoDB avec les fonctionnalités avancées d'AWS Backup. Pour les autres types, le paramètre de stockage à froid est ignoré et les points de récupération restent en stockage chaud jusqu'à leur suppression."
  options:
    c:
      en: "Amazon RDS does not support lifecycle to cold storage in AWS Backup, so RDS snapshots stay in warm storage for the 7 years."
      fr: "Amazon RDS ne prend pas en charge le cycle de vie vers le stockage à froid dans AWS Backup : les instantanés RDS restent en stockage chaud pendant les 7 ans."
    d:
      en: "Aurora MySQL clusters do not support cold storage in AWS Backup; among Aurora offerings, only Aurora DSQL does."
      fr: "Les clusters Aurora MySQL ne prennent pas en charge le stockage à froid dans AWS Backup : parmi les offres Aurora, seul Aurora DSQL le permet."
    e:
      en: "AWS Backup does not support cold storage for Amazon S3 backups, so the setting is ignored for the buckets."
      fr: "AWS Backup ne prend pas en charge le stockage à froid pour les sauvegardes Amazon S3 : le paramètre est ignoré pour les compartiments."
references:
  - title: AWS Backup feature availability
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html
