id: sapc03-3a-odcr-event-capacity
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a ticketing platform in the us-west-2 Region on r7i.2xlarge instances in an Auto Scaling group that spans three Availability Zones. Four times a year, a 3-day sales event requires 120 additional instances. During the last event, launches failed in two Availability Zones because of insufficient capacity. A contract with the event organizer now requires the additional capacity to be guaranteed in each of the three Availability Zones for the duration of every event. Outside the events, no additional capacity is needed. Event dates are confirmed one week in advance, and the existing Compute Savings Plan is fully used by the baseline.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exploite une plateforme de billetterie dans la Région us-west-2 sur des instances r7i.2xlarge d'un groupe Auto Scaling réparti sur trois zones de disponibilité. Quatre fois par an, un événement de vente de 3 jours nécessite 120 instances supplémentaires. Lors du dernier événement, des lancements ont échoué dans deux zones de disponibilité faute de capacité suffisante. Un contrat avec l'organisateur exige désormais que la capacité supplémentaire soit garantie dans chacune des trois zones de disponibilité pendant toute la durée de chaque événement. En dehors des événements, aucune capacité supplémentaire n'est nécessaire. Les dates des événements sont confirmées une semaine à l'avance, et le Compute Savings Plan existant est entièrement utilisé par la charge de base.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Purchase 1-year zonal Reserved Instances for 40 r7i.2xlarge instances in each Availability Zone, and let the Auto Scaling group launch the event instances in those zones."
        fr: "Acheter des instances réservées zonales sur 1 an pour 40 instances r7i.2xlarge dans chaque zone de disponibilité, et laisser le groupe Auto Scaling lancer les instances de l'événement dans ces zones."
    - id: b
      text:
        en: "Create On-Demand Capacity Reservations for 40 r7i.2xlarge instances in each Availability Zone when the event dates are confirmed, and cancel the reservations when each event ends."
        fr: "Créer des réservations de capacité à la demande pour 40 instances r7i.2xlarge dans chaque zone de disponibilité dès la confirmation des dates, et annuler les réservations à la fin de chaque événement."
    - id: c
      text:
        en: "Purchase EC2 Capacity Blocks for ML for 40 r7i.2xlarge instances in each Availability Zone for the 3 days of each event, and target the blocks from the launch template."
        fr: "Acheter des EC2 Capacity Blocks for ML pour 40 instances r7i.2xlarge dans chaque zone de disponibilité pour les 3 jours de chaque événement, et cibler les blocs depuis le modèle de lancement."
    - id: d
      text:
        en: "Purchase an additional 1-year Compute Savings Plan sized for the 120 event instances, and configure the Auto Scaling group to launch them in all three Availability Zones."
        fr: "Acheter un Compute Savings Plan supplémentaire sur 1 an dimensionné pour les 120 instances de l'événement, et configurer le groupe Auto Scaling pour les lancer dans les trois zones de disponibilité."
answer: { optionId: b }
explanation:
  correct:
    en: "On-Demand Capacity Reservations reserve capacity in a specific Availability Zone for any duration, with no term commitment, and they can be cancelled at any time to stop the charges. Creating them shortly before each event and cancelling them afterward guarantees the capacity while paying the On-Demand rate only around the 3 event days."
    fr: "Les réservations de capacité à la demande réservent de la capacité dans une zone de disponibilité précise pour une durée quelconque, sans engagement de durée, et peuvent être annulées à tout moment pour arrêter la facturation. Les créer peu avant chaque événement et les annuler ensuite garantit la capacité tout en ne payant le tarif On-Demand qu'autour des 3 jours de l'événement."
  options:
    a:
      en: "Zonal Reserved Instances do reserve capacity, but their 1-year term is paid every hour of the year although the capacity is needed for only about 12 days."
      fr: "Les instances réservées zonales réservent bien de la capacité, mais leur durée de 1 an est payée chaque heure de l'année alors que la capacité n'est nécessaire qu'environ 12 jours."
    c:
      en: "Capacity Blocks for ML are offered only for GPU and Trainium instance types such as P5 or Trn2, not for r7i memory-optimized instances."
      fr: "Les Capacity Blocks for ML ne sont proposés que pour des types d'instances GPU et Trainium comme P5 ou Trn2, pas pour les instances r7i à mémoire optimisée."
    d:
      en: "A Savings Plan is only a billing discount and reserves no capacity, so launches could still fail, and its hourly commitment would be paid all year."
      fr: "Un Savings Plan n'est qu'une remise de facturation et ne réserve aucune capacité : les lancements pourraient encore échouer, et son engagement horaire serait payé toute l'année."
references:
  - title: "Reserve compute capacity with EC2 On-Demand Capacity Reservations"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
  - title: "Capacity Reservation pricing and billing"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/capacity-reservations-pricing-billing.html
