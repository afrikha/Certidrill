id: sapc03-3a-lambda-managed-instances
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a payment authorization service as AWS Lambda functions behind Amazon API Gateway and Amazon SQS event source mappings. Traffic is steady around the clock at about 3,000 requests per second, with little daily variation. Each invocation spends most of its duration waiting for responses from downstream fraud and banking services. The code is thread-safe and can process several requests concurrently in one process. The Lambda bill has become the largest item of the account. The company wants to lower compute costs while keeping the Lambda programming model, its deployment pipeline and its event source integrations. The operations team must not patch operating systems or manage instance lifecycles, and the functions must run on Graviton-based capacity in the company's VPC.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exécute un service d'autorisation de paiement sous forme de fonctions AWS Lambda derrière Amazon API Gateway et des mappages de source d'événements Amazon SQS. Le trafic est stable jour et nuit, à environ 3 000 requêtes par seconde, avec peu de variations quotidiennes. Chaque appel passe l'essentiel de sa durée à attendre les réponses de services en aval de détection de fraude et bancaires. Le code est thread-safe et peut traiter plusieurs requêtes simultanément dans un même processus. La facture Lambda est devenue le premier poste du compte. L'entreprise veut réduire les coûts de calcul tout en conservant le modèle de programmation Lambda, son pipeline de déploiement et ses intégrations de sources d'événements. L'équipe d'exploitation ne doit ni corriger de systèmes d'exploitation ni gérer le cycle de vie d'instances, et les fonctions doivent s'exécuter sur une capacité basée sur Graviton dans le VPC de l'entreprise.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Create a Lambda Managed Instances capacity provider with Graviton instances in the VPC, attach the functions to it, and apply Savings Plans to the instance cost."
        fr: "Créer un fournisseur de capacité Lambda Managed Instances avec des instances Graviton dans le VPC, y rattacher les fonctions, et appliquer des Savings Plans au coût des instances."
    - id: b
      text:
        en: "Switch the functions to the arm64 architecture on the default Lambda compute, and double their memory so that each invocation finishes faster and consumes less billed duration."
        fr: "Passer les fonctions à l'architecture arm64 sur le calcul Lambda par défaut, et doubler leur mémoire pour que chaque appel se termine plus vite et consomme moins de durée facturée."
    - id: c
      text:
        en: "Repackage the functions as containers on Amazon ECS on EC2 with a Graviton Auto Scaling group, and patch the instances with AWS Systems Manager Patch Manager."
        fr: "Réempaqueter les fonctions en conteneurs sur Amazon ECS sur EC2 avec un groupe Auto Scaling Graviton, et corriger les instances avec AWS Systems Manager Patch Manager."
    - id: d
      text:
        en: "Repackage the functions as containers on Amazon ECS on AWS Fargate with the ARM64 platform behind an Application Load Balancer, and replace the SQS event source mappings with polling code."
        fr: "Réempaqueter les fonctions en conteneurs sur Amazon ECS sur AWS Fargate avec la plateforme ARM64 derrière un Application Load Balancer, et remplacer les mappages de source d'événements SQS par du code d'interrogation."
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda Managed Instances runs Lambda functions on current-generation EC2 instances, including Graviton, in the company's VPC, while Lambda handles patching, routing, scaling and instance lifecycle. It is priced as the EC2 instance cost plus a management fee, EC2 discounts such as Savings Plans apply to the instance portion, and one execution environment serves multiple concurrent invocations, which suits steady, I/O-bound traffic."
    fr: "Lambda Managed Instances exécute des fonctions Lambda sur des instances EC2 de génération actuelle, Graviton compris, dans le VPC de l'entreprise, tandis que Lambda gère les correctifs, le routage, la mise à l'échelle et le cycle de vie des instances. La tarification correspond au coût de l'instance EC2 plus des frais de gestion, les remises EC2 comme les Savings Plans s'appliquent à la part instance, et un environnement d'exécution sert plusieurs appels simultanés, ce qui convient à un trafic stable et limité par les E/S."
  options:
    b:
      en: "The invocations mostly wait on downstream services, so more memory does not shorten them, and default Lambda still bills every concurrent invocation for its full waiting time."
      fr: "Les appels attendent surtout des services en aval : plus de mémoire ne les raccourcit pas, et Lambda par défaut facture toujours chaque appel simultané pour toute sa durée d'attente."
    c:
      en: "ECS on EC2 makes the operations team manage and patch the instances, and it abandons the Lambda programming model and event source integrations."
      fr: "ECS sur EC2 oblige l'équipe d'exploitation à gérer et corriger les instances, et abandonne le modèle de programmation Lambda et ses intégrations de sources d'événements."
    d:
      en: "Fargate removes patching, but it abandons the Lambda programming model, the deployment pipeline and the event source mappings that the company wants to keep."
      fr: "Fargate supprime les correctifs, mais abandonne le modèle de programmation Lambda, le pipeline de déploiement et les mappages de source d'événements que l'entreprise veut conserver."
references:
  - title: "Lambda Managed Instances"
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html
