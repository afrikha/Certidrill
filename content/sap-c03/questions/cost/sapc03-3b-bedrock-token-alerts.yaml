id: sapc03-3b-bedrock-token-alerts
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's teams share an Amazon Bedrock platform account, and each team's applications call models on demand with the team's own IAM role. Daily chargeback already works through IAM principal cost allocation in the CUR 2.0 export.

    After an unexpected spike, finance adds a new requirement: each team lead must be alerted within 5 minutes when the team's applications generate more than 200,000 output tokens in any 5-minute period. The platform team wants the least operational overhead and no changes to the applications.

    Which solution will meet these requirements?
  fr: |
    Les équipes d'AnyCompany partagent un compte de plateforme Amazon Bedrock, et les applications de chaque équipe appellent les modèles à la demande avec le rôle IAM propre à l'équipe. La refacturation quotidienne fonctionne déjà grâce à la répartition des coûts par principal IAM dans l'export CUR 2.0.

    Après un pic inattendu, la finance ajoute une exigence : chaque responsable d'équipe doit être alerté en moins de 5 minutes lorsque les applications de son équipe génèrent plus de 200 000 jetons de sortie sur une période de 5 minutes. L'équipe plateforme veut la charge opérationnelle la plus faible et aucun changement dans les applications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one AWS Budgets usage budget per team, filtered on the team's iamPrincipal tag, with an alert threshold set to the token limit.", fr: "Créer un budget d'utilisation AWS Budgets par équipe, filtré sur la balise iamPrincipal de l'équipe, avec un seuil d'alerte réglé sur la limite de jetons." } }
    - { id: b, text: { en: "Create an AWS Cost Anomaly Detection monitor for each team's cost allocation tag, with individual alerts sent immediately to the team lead.", fr: "Créer un moniteur AWS Cost Anomaly Detection pour la balise de répartition des coûts de chaque équipe, avec des alertes individuelles envoyées immédiatement au responsable." } }
    - { id: c, text: { en: "Send model invocation logs to CloudWatch Logs, add a metric filter on output token counts with identity.arn as a dimension, and alarm per team role over 5 minutes.", fr: "Envoyer les journaux d'appels de modèles vers CloudWatch Logs, ajouter un filtre de métriques sur les jetons de sortie avec identity.arn comme dimension, et créer une alarme sur 5 minutes par rôle d'équipe." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the AWS/Bedrock OutputTokenCount metric for each model ID, and notify all team leads through one Amazon SNS topic.", fr: "Créer une alarme CloudWatch sur la métrique AWS/Bedrock OutputTokenCount pour chaque ID de modèle, et notifier tous les responsables d'équipe par une rubrique Amazon SNS." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Model invocation logging records, for each call, the ARN of the calling principal in identity.arn and the output token count in output.outputTokenCount, and it can deliver the records to CloudWatch Logs. A metric filter turns those fields into a per-role metric within minutes, and a CloudWatch alarm with a 5-minute period notifies each team lead through Amazon SNS. Logging is a Region-level setting of the account, so the applications do not change.
    fr: |
      La journalisation des appels de modèles enregistre pour chaque appel l'ARN du principal appelant dans identity.arn et le nombre de jetons de sortie dans output.outputTokenCount, et elle peut livrer les enregistrements à CloudWatch Logs. Un filtre de métriques transforme ces champs en métrique par rôle en quelques minutes, et une alarme CloudWatch sur une période de 5 minutes notifie chaque responsable d'équipe par Amazon SNS. La journalisation est un paramètre du compte au niveau de la Région : les applications ne changent pas.
  options:
    a: { en: "Budgets are evaluated from billing data that is refreshed only a few times per day, so they cannot alert within 5 minutes of a token spike.", fr: "Les budgets sont évalués à partir de données de facturation actualisées seulement quelques fois par jour : ils ne peuvent pas alerter dans les 5 minutes qui suivent un pic de jetons." }
    b: { en: "Cost Anomaly Detection looks for unusual spend patterns in billing data; it does not enforce a fixed token threshold and does not react within minutes.", fr: "Cost Anomaly Detection recherche des schémas de dépenses inhabituels dans les données de facturation ; il n'applique pas de seuil de jetons fixe et ne réagit pas en quelques minutes." }
    d: { en: "The Bedrock runtime metrics are dimensioned by model ID, not by caller, so the alarm cannot tell which team generated the tokens.", fr: "Les métriques d'exécution de Bedrock sont dimensionnées par ID de modèle, pas par appelant : l'alarme ne peut pas savoir quelle équipe a généré les jetons." }
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Monitor bedrock-runtime inference using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
