id: sapc03-3a-sagemaker-async-zero
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's claims department uses a computer vision model to assess vehicle damage from photo bundles that adjusters upload. The model is hosted on an Amazon SageMaker AI real-time endpoint backed by a GPU instance that runs 24 hours a day. Each photo bundle is about 300 MB, and an inference takes 6 to 10 minutes. Requests arrive in a few bursts during the day, and the endpoint is idle about 20 hours each day. Results must be available within 30 minutes of an upload, and the claims application must be notified when each result is ready. The company wants to reduce the hosting cost.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Le service des sinistres d'AnyCompany utilise un modèle de vision par ordinateur pour évaluer les dégâts sur des véhicules à partir de lots de photos téléversés par les experts. Le modèle est hébergé sur un point de terminaison en temps réel Amazon SageMaker AI reposant sur une instance GPU qui tourne 24 heures sur 24. Chaque lot de photos pèse environ 300 Mo, et une inférence prend de 6 à 10 minutes. Les requêtes arrivent en quelques pics dans la journée, et le point de terminaison est inactif environ 20 heures par jour. Les résultats doivent être disponibles dans les 30 minutes qui suivent un téléversement, et l'application de gestion des sinistres doit être avertie dès qu'un résultat est prêt. L'entreprise veut réduire le coût d'hébergement.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Deploy the model to an asynchronous inference endpoint on the GPU instance type that scales to zero instances when idle, and send completion notifications through Amazon SNS."
        fr: "Déployer le modèle sur un point de terminaison d'inférence asynchrone avec le type d'instance GPU qui se réduit à zéro instance en cas d'inactivité, et envoyer les notifications de fin via Amazon SNS."
    - id: b
      text:
        en: "Deploy the model to a SageMaker AI serverless inference endpoint with 6 GB of memory and provisioned concurrency during business hours, and return each result in the response."
        fr: "Déployer le modèle sur un point de terminaison d'inférence serverless SageMaker AI avec 6 Go de mémoire et une simultanéité provisionnée pendant les heures de bureau, et renvoyer chaque résultat dans la réponse."
    - id: c
      text:
        en: "Keep the real-time endpoint, configure auto scaling with a minimum of one instance, and purchase a SageMaker AI Savings Plan that covers the GPU instance."
        fr: "Conserver le point de terminaison en temps réel, configurer l'autoscaling avec un minimum d'une instance, et acheter un SageMaker AI Savings Plan qui couvre l'instance GPU."
    - id: d
      text:
        en: "Remove the endpoint, and run a SageMaker AI batch transform job every night at midnight on all photo bundles that adjusters uploaded during the day."
        fr: "Supprimer le point de terminaison, et exécuter chaque nuit à minuit une tâche de transformation par lots SageMaker AI sur tous les lots de photos téléversés par les experts dans la journée."
answer: { optionId: a }
explanation:
  correct:
    en: "Asynchronous inference queues requests, accepts payloads up to 1 GB through an S3 location and processing times up to one hour, and writes results to S3 with optional SNS success or error notifications. The endpoint can scale its instance count to zero when no requests are waiting, so the GPU instance is paid only during the bursts."
    fr: "L'inférence asynchrone met les requêtes en file d'attente, accepte des charges utiles jusqu'à 1 Go via un emplacement S3 et des durées de traitement jusqu'à une heure, et écrit les résultats dans S3 avec des notifications SNS facultatives de réussite ou d'erreur. Le point de terminaison peut réduire son nombre d'instances à zéro lorsqu'aucune requête n'attend : l'instance GPU n'est donc payée que pendant les pics."
  options:
    b:
      en: "Serverless inference does not support GPUs and is limited to 6 GB of memory, so it cannot host this computer vision model."
      fr: "L'inférence serverless ne prend pas en charge les GPU et est limitée à 6 Go de mémoire : elle ne peut pas héberger ce modèle de vision par ordinateur."
    c:
      en: "A real-time endpoint with a minimum of one instance keeps the GPU instance running during the 20 idle hours; a Savings Plan only discounts that idle time."
      fr: "Un point de terminaison en temps réel avec au moins une instance laisse l'instance GPU tourner pendant les 20 heures d'inactivité ; un Savings Plan ne fait qu'appliquer une remise à ce temps inactif."
    d:
      en: "A nightly batch job would deliver results many hours after the upload, which breaks the 30-minute requirement."
      fr: "Une tâche par lots nocturne livrerait les résultats de nombreuses heures après le téléversement, ce qui enfreint l'exigence de 30 minutes."
references:
  - title: "Asynchronous inference"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
  - title: "Deploy models with Amazon SageMaker Serverless Inference"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
