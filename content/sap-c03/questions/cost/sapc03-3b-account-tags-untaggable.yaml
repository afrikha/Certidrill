id: sapc03-3b-account-tags-untaggable
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations. Its account vending pipeline applies the account tags BusinessUnit and CostCenter to every new account, and the platform team updates those account tags whenever an account changes owner. Most accounts belong to a single business unit.

    The finance team reports spend by business unit in AWS Cost Explorer and in a CUR 2.0 export. Today, a large share of the spend appears without a business unit because it cannot carry resource tags: AWS Support charges, credits, refunds, and some service charges. The company wants every charge of an account attributed to its business unit, with the least ongoing effort as accounts are created and reassigned.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 300 comptes dans AWS Organizations. Son pipeline de distribution de comptes applique les balises de compte BusinessUnit et CostCenter à chaque nouveau compte, et l'équipe plateforme met à jour ces balises de compte chaque fois qu'un compte change de propriétaire. La plupart des comptes appartiennent à une seule unité opérationnelle.

    L'équipe financière présente les dépenses par unité opérationnelle dans AWS Cost Explorer et dans un export CUR 2.0. Aujourd'hui, une part importante des dépenses apparaît sans unité opérationnelle car elle ne peut pas porter de balises de ressource : frais d'AWS Support, crédits, remboursements et certains frais de service. L'entreprise veut que chaque frais d'un compte soit attribué à son unité opérationnelle, avec le moins d'effort continu possible lorsque des comptes sont créés et réaffectés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach a tag policy to the organization root that defines BusinessUnit and CostCenter with their allowed values and enforces them for all supported resource types.", fr: "Attacher à la racine de l'organisation une politique de balises qui définit BusinessUnit et CostCenter avec leurs valeurs autorisées et les applique à tous les types de ressources pris en charge." } }
    - { id: b, text: { en: "Create a cost category with one rule per business unit that lists the account IDs of that business unit, and update the rules each time an account is created or reassigned.", fr: "Créer une catégorie de coûts avec une règle par unité opérationnelle qui liste les ID des comptes de cette unité, et mettre à jour les règles à chaque création ou réaffectation de compte." } }
    - { id: c, text: { en: "In the management account, activate the BusinessUnit and CostCenter account tags as cost allocation tags.", fr: "Dans le compte de gestion, activer les balises de compte BusinessUnit et CostCenter comme balises de répartition des coûts." } }
    - { id: d, text: { en: "Use Tag Editor in every account to apply the BusinessUnit and CostCenter tags to all existing resources.", fr: "Utiliser Tag Editor dans chaque compte pour appliquer les balises BusinessUnit et CostCenter à toutes les ressources existantes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Account tags in AWS Organizations can be activated as cost allocation tags from the management account. All metered usage of a tagged account inherits them, including untaggable costs such as refunds, credits, and charges that cannot be tagged at the resource level. Because the vending pipeline already maintains the account tags, the business unit attribution follows every account change with no extra work.
    fr: |
      Les balises de compte d'AWS Organizations peuvent être activées comme balises de répartition des coûts depuis le compte de gestion. Toute l'utilisation mesurée d'un compte balisé en hérite, y compris les coûts non balisables comme les remboursements, les crédits et les frais qui ne peuvent pas être balisés au niveau des ressources. Comme le pipeline de distribution maintient déjà les balises de compte, l'attribution aux unités opérationnelles suit chaque changement de compte sans travail supplémentaire.
  options:
    a: { en: "Tag policies govern tags that are applied to resources; they cannot attach a business unit to support charges, credits, or refunds.", fr: "Les politiques de balises encadrent les balises appliquées aux ressources ; elles ne peuvent pas rattacher une unité opérationnelle aux frais de support, aux crédits ou aux remboursements." }
    b: { en: "Account-based cost category rules would cover untaggable charges, but they must be edited by hand for every account change, which is not the least ongoing effort.", fr: "Des règles de catégorie de coûts basées sur les comptes couvriraient les frais non balisables, mais elles doivent être modifiées à la main à chaque changement de compte : ce n'est pas l'effort continu le plus faible." }
    d: { en: "Resource tags cannot be applied to support charges, credits, or refunds, and retagging every resource in 300 accounts is a large manual effort.", fr: "Les balises de ressource ne s'appliquent ni aux frais de support, ni aux crédits, ni aux remboursements, et rebaliser chaque ressource de 300 comptes est un effort manuel important." }
references:
  - title: Using account tags for cost allocation
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/account-tags-cost-allocation.html
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
