id: sapc03-3b-config-custom-remediation
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deploys an organization conformance pack that contains the AWS Config required-tags managed rule with CostCenter as the required key. The rule reports thousands of noncompliant resources across the workload accounts.

    The account vending pipeline stores the cost center of each account in an AWS Systems Manager Parameter Store parameter in that account. The FinOps team configured automatic remediation on the rule with the AWS-managed AWS-SetRequiredTags runbook to apply the CostCenter tag, but the remediation does not fix the resources. The team wants remediation that adds the CostCenter value of the account to every noncompliant resource, with the least effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie un pack de conformité d'organisation qui contient la règle gérée AWS Config required-tags avec CostCenter comme clé obligatoire. La règle signale des milliers de ressources non conformes dans les comptes de charges de travail.

    Le pipeline de distribution de comptes stocke le centre de coûts de chaque compte dans un paramètre AWS Systems Manager Parameter Store de ce compte. L'équipe FinOps a configuré une correction automatique sur la règle avec le runbook géré par AWS AWS-SetRequiredTags pour appliquer la balise CostCenter, mais la correction ne répare pas les ressources. L'équipe veut une correction qui ajoute la valeur CostCenter du compte à chaque ressource non conforme, avec le moins d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the AWS-SetRequiredTags runbook, raise the maximum number of automatic remediation attempts, and pass the CostCenter value as a static parameter.", fr: "Conserver le runbook AWS-SetRequiredTags, augmenter le nombre maximal de tentatives de correction automatique et transmettre la valeur CostCenter comme paramètre statique." } }
    - { id: b, text: { en: "Create a custom Systems Manager Automation runbook that reads the account's parameter and tags the resource, and set it as the rule's remediation in the conformance pack.", fr: "Créer un runbook Systems Manager Automation personnalisé qui lit le paramètre du compte et balise la ressource, et le définir comme correction de la règle dans le pack de conformité." } }
    - { id: c, text: { en: "Replace the remediation with a tag policy attached to the organization root that enforces the CostCenter key for the resource types that the rule evaluates.", fr: "Remplacer la correction par une politique de balises attachée à la racine de l'organisation qui applique la clé CostCenter aux types de ressources évalués par la règle." } }
    - { id: d, text: { en: "Export the list of noncompliant resources from the aggregator every week, and apply the CostCenter tags in each account with Tag Editor.", fr: "Exporter chaque semaine la liste des ressources non conformes depuis l'agrégateur, et appliquer les balises CostCenter dans chaque compte avec Tag Editor." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The AWS Config documentation states that the AWS-managed AWS-SetRequiredTags Automation document does not work as a remediation for the required-tags rule, and that a custom Automation document must be created. A custom runbook can read the account's Parameter Store value and tag the resource through the tagging APIs. Defining it as the automatic remediation in the conformance pack applies the fix in every account where the pack is deployed.
    fr: |
      La documentation d'AWS Config indique que le document Automation géré par AWS AWS-SetRequiredTags ne fonctionne pas comme correction de la règle required-tags, et qu'il faut créer un document Automation personnalisé. Un runbook personnalisé peut lire la valeur Parameter Store du compte et baliser la ressource par les API de balisage. Le définir comme correction automatique dans le pack de conformité applique la correction dans chaque compte où le pack est déployé.
  options:
    a: { en: "More attempts or different parameters do not help, because AWS-SetRequiredTags does not work as a remediation for this rule, and a static value would ignore each account's cost center.", fr: "Plus de tentatives ou d'autres paramètres n'y changent rien, car AWS-SetRequiredTags ne fonctionne pas comme correction pour cette règle, et une valeur statique ignorerait le centre de coûts de chaque compte." }
    c: { en: "A tag policy does not add tags to existing resources, and it does not evaluate resources that have no CostCenter tag.", fr: "Une politique de balises n'ajoute pas de balises aux ressources existantes, et elle n'évalue pas les ressources qui n'ont pas de balise CostCenter." }
    d: { en: "A weekly manual process across all accounts is far more effort than automatic remediation, and resources stay untagged between runs.", fr: "Un processus manuel hebdomadaire dans tous les comptes demande bien plus d'effort qu'une correction automatique, et les ressources restent sans balise entre deux passages." }
references:
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
