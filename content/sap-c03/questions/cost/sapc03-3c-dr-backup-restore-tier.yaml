id: sapc03-3c-dr-backup-restore-tier
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an internal expense-reporting application on Amazon EC2 and Amazon RDS for MySQL in eu-west-1. The business impact analysis classifies the application as non-critical: if eu-west-1 is unavailable, the application can be restored within 24 hours, and losing up to 24 hours of data is acceptable. The company already uses AWS Backup for other workloads. It wants a disaster recovery design in eu-central-1 with the lowest ongoing cost. Infrastructure can be recreated with existing CloudFormation templates.

    Which disaster recovery strategy will meet these requirements?
  fr: |
    AnyCompany exécute une application interne de notes de frais sur Amazon EC2 et Amazon RDS for MySQL en eu-west-1. L'analyse d'impact sur l'activité classe l'application comme non critique : si eu-west-1 est indisponible, l'application peut être restaurée en 24 heures, et une perte de données de 24 heures au maximum est acceptable. L'entreprise utilise déjà AWS Backup pour d'autres charges de travail. Elle veut une conception de reprise après sinistre dans eu-central-1 au coût continu le plus bas. L'infrastructure peut être recréée avec des modèles CloudFormation existants.

    Quelle stratégie de reprise après sinistre répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Pilot light: run a cross-Region RDS read replica in eu-central-1 and keep stopped EC2 instances ready to start during a disaster.", fr: "Pilot light : exécuter un réplica en lecture RDS entre Régions dans eu-central-1 et garder des instances EC2 arrêtées prêtes à démarrer lors d'un sinistre." }
    - id: b
      text: { en: "Warm standby: run a scaled-down copy of the full application in eu-central-1 that can be scaled up during a disaster.", fr: "Warm standby : exécuter dans eu-central-1 une copie réduite de toute l'application, qui peut être agrandie lors d'un sinistre." }
    - id: c
      text: { en: "Multi-site active/active: serve users from both Regions with an Aurora global database and Route 53 latency-based routing.", fr: "Multi-site actif/actif : servir les utilisateurs depuis les deux Régions avec une base de données globale Aurora et le routage Route 53 basé sur la latence." }
    - id: d
      text: { en: "Backup and restore: copy daily AWS Backup backups of the instances and the DB instance to a vault in eu-central-1, and restore them with the templates.", fr: "Sauvegarde et restauration : copier les sauvegardes quotidiennes AWS Backup des instances et de l'instance de base de données vers un coffre dans eu-central-1, et les restaurer avec les modèles." }
answer: { optionId: d }
explanation:
  correct:
    en: "Backup and restore is the lowest-cost strategy because nothing runs in the recovery Region until a disaster. Daily backups give an RPO of up to 24 hours, cross-Region copies keep them available if eu-west-1 fails, and the CloudFormation templates plus restores fit a 24-hour RTO."
    fr: "La sauvegarde et restauration est la stratégie la moins coûteuse, car rien ne fonctionne dans la Région de reprise avant un sinistre. Des sauvegardes quotidiennes donnent un RPO de 24 heures au maximum, les copies entre Régions les gardent disponibles si eu-west-1 tombe, et les modèles CloudFormation avec les restaurations respectent un RTO de 24 heures."
  options:
    a:
      en: "A pilot light keeps a database replica running all the time in eu-central-1, which costs more than stored backups for an application that tolerates 24 hours of downtime and data loss."
      fr: "Un pilot light garde en permanence un réplica de base de données en fonctionnement dans eu-central-1, ce qui coûte plus cher que des sauvegardes stockées pour une application qui tolère 24 heures d'interruption et de perte de données."
    b:
      en: "A warm standby runs a reduced copy of the whole application continuously, for recovery times of minutes that the business does not need."
      fr: "Un warm standby exécute en continu une copie réduite de toute l'application, pour des temps de reprise de quelques minutes dont l'activité n'a pas besoin."
    c:
      en: "Active/active doubles the running infrastructure and adds global database replication, the most expensive strategy, designed for near-zero RTO and RPO."
      fr: "L'actif/actif double l'infrastructure en fonctionnement et ajoute la réplication de base de données globale : c'est la stratégie la plus chère, conçue pour un RTO et un RPO quasi nuls."
references:
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
