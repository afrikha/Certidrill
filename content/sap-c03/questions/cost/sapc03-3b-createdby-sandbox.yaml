id: sapc03-3b-createdby-sandbox
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's sandbox OU contains 120 accounts in which developers create resources by hand in us-east-1 and eu-west-1 for experiments. About 30% of the sandbox spend has no CostCenter tag, and the FinOps team cannot tell who is responsible for it.

    Starting now, the FinOps team wants to group the untagged costs of new EC2 instances, EBS volumes, RDS databases, and S3 buckets by the IAM user or role that created each resource, in AWS Cost Explorer. The solution must not block or slow down developers, and nothing may be deployed in the sandbox accounts.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    L'UO de bac à sable (sandbox) d'AnyCompany contient 120 comptes dans lesquels les développeurs créent des ressources à la main dans us-east-1 et eu-west-1 pour des expériences. Environ 30 % des dépenses de bac à sable n'ont pas de balise CostCenter, et l'équipe FinOps ne sait pas qui en est responsable.

    À partir de maintenant, l'équipe FinOps veut regrouper dans AWS Cost Explorer les coûts non balisés des nouvelles instances EC2, des nouveaux volumes EBS, des nouvelles bases de données RDS et des nouveaux compartiments S3 par utilisateur ou rôle IAM qui a créé chaque ressource. La solution ne doit ni bloquer ni ralentir les développeurs, et rien ne doit être déployé dans les comptes de bac à sable.

    Quelle solution répond à ces exigences avec la charge opérationnelle la PLUS faible ?
body:
  options:
    - { id: a, text: { en: "Create an organization trail in AWS CloudTrail, and use Amazon Athena to join resource creation events with resource IDs in the CUR 2.0 export.", fr: "Créer un journal de suivi d'organisation AWS CloudTrail, et utiliser Amazon Athena pour joindre les événements de création de ressources aux ID de ressources de l'export CUR 2.0." } }
    - { id: b, text: { en: "Activate the AWS-generated aws:createdBy cost allocation tag in the management account, and group the sandbox costs by that tag in Cost Explorer.", fr: "Activer la balise de répartition des coûts générée par AWS aws:createdBy dans le compte de gestion, et regrouper les coûts de bac à sable par cette balise dans Cost Explorer." } }
    - { id: c, text: { en: "Attach a tag policy to the sandbox OU that defines an Owner tag key, and enforce it for EC2, RDS, and S3 resources.", fr: "Attacher à l'UO de bac à sable une politique de balises qui définit une clé de balise Owner, et l'appliquer aux ressources EC2, RDS et S3." } }
    - { id: d, text: { en: "Attach an SCP to the sandbox OU that denies resource creation requests that do not include an Owner tag.", fr: "Attacher à l'UO de bac à sable une SCP qui refuse les requêtes de création de ressources qui n'incluent pas de balise Owner." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The aws:createdBy tag is generated by AWS from CloudTrail data and records the account type, ID, and user or role session that created a resource. Once the management account activates it, it is activated for all member accounts and applied to resources created after activation, including EC2 instances, EBS volumes, RDS databases, and S3 buckets. It is populated in a set of Regions that includes us-east-1 and eu-west-1, and nothing is deployed in the accounts.
    fr: |
      La balise aws:createdBy est générée par AWS à partir des données CloudTrail et enregistre le type de compte, l'ID et l'utilisateur ou la session de rôle qui a créé une ressource. Une fois activée par le compte de gestion, elle est activée pour tous les comptes membres et appliquée aux ressources créées après l'activation, dont les instances EC2, les volumes EBS, les bases de données RDS et les compartiments S3. Elle est renseignée dans un ensemble de Régions qui inclut us-east-1 et eu-west-1, et rien n'est déployé dans les comptes.
  options:
    a: { en: "This can work, but building and maintaining the event-to-resource joins is far more effort than activating one AWS-generated tag, and it is not a Cost Explorer dimension.", fr: "Cela peut fonctionner, mais construire et maintenir les jointures entre événements et ressources demande bien plus d'effort qu'activer une balise générée par AWS, et ce n'est pas une dimension de Cost Explorer." }
    c: { en: "A tag policy standardizes tags that developers apply; it does not add a creator value, and untagged resources are not evaluated.", fr: "Une politique de balises standardise les balises appliquées par les développeurs ; elle n'ajoute aucune valeur de créateur, et les ressources sans balise ne sont pas évaluées." }
    d: { en: "Denying untagged creation requests blocks developers, which the requirements forbid.", fr: "Refuser les requêtes de création sans balise bloque les développeurs, ce que les exigences interdisent." }
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
  - title: Using AWS-generated tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/aws-tags.html
