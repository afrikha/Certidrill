id: sapc03-3c-efs-first-access-return
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's engineering teams share an Amazon EFS Regional file system that uses Elastic throughput and holds 120 TB of project files, most of them smaller than 1 MB. An EFS lifecycle policy moves files to Infrequent Access after 30 days without access and has no setting for moving files back. Projects are often reopened months later, and their files are then read repeatedly for several weeks. Since the policy was applied, users complain about slow builds on reopened projects, and the bill shows growing charges for reads from Infrequent Access. The company wants to keep the storage savings on files that are really cold while removing the latency and read charges on reopened projects. The application and mount paths must not change.

    Which solution will meet these requirements?
  fr: |
    Les équipes d'ingénierie d'AnyCompany partagent un système de fichiers Amazon EFS régional qui utilise le débit Elastic et contient 120 To de fichiers de projets, pour la plupart de moins de 1 Mo. Une politique de cycle de vie EFS déplace les fichiers vers Infrequent Access après 30 jours sans accès et ne comporte aucun paramètre de retour. Les projets sont souvent rouverts des mois plus tard, et leurs fichiers sont alors lus de façon répétée pendant plusieurs semaines. Depuis l'application de la politique, les utilisateurs se plaignent de compilations lentes sur les projets rouverts, et la facture montre des frais croissants de lecture depuis Infrequent Access. L'entreprise veut conserver les économies de stockage sur les fichiers réellement froids tout en supprimant la latence et les frais de lecture sur les projets rouverts. L'application et les chemins de montage ne doivent pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Remove the lifecycle policy so that all files stay in EFS Standard, and switch the file system to Provisioned throughput sized for the build peaks.", fr: "Supprimer la politique de cycle de vie pour que tous les fichiers restent dans EFS Standard, et passer le système de fichiers en débit Provisioned dimensionné pour les pics de compilation." }
    - id: b
      text: { en: "Add a transition into Archive after 90 days without access to the lifecycle policy, so that reopened projects are read from the cheapest storage class.", fr: "Ajouter à la politique de cycle de vie une transition vers Archive après 90 jours sans accès, afin que les projets rouverts soient lus depuis la classe de stockage la moins chère." }
    - id: c
      text: { en: "Use AWS DataSync to copy reopened projects to a second EFS file system without a lifecycle policy, and point the build servers to it.", fr: "Utiliser AWS DataSync pour copier les projets rouverts vers un second système de fichiers EFS sans politique de cycle de vie, et pointer les serveurs de compilation vers celui-ci." }
    - id: d
      text: { en: "Keep the transition into Infrequent Access after 30 days and set the transition into Standard to On first access in the lifecycle policy.", fr: "Conserver la transition vers Infrequent Access après 30 jours et définir la transition vers Standard sur On first access dans la politique de cycle de vie." }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, EFS leaves accessed files in Infrequent Access, so every later read pays IA latency and a per-GB read charge. Setting the transition into Standard to On first access moves a file back to Standard the first time it is read, which AWS recommends for latency-sensitive workloads with many small files, while untouched files stay in IA."
    fr: "Par défaut, EFS laisse les fichiers consultés dans Infrequent Access : chaque lecture ultérieure subit la latence IA et des frais de lecture au Go. Définir la transition vers Standard sur On first access ramène un fichier dans Standard dès sa première lecture, ce qu'AWS recommande pour les charges sensibles à la latence avec de nombreux petits fichiers, tandis que les fichiers non consultés restent dans IA."
  options:
    a:
      en: "Removing lifecycle management gives up the savings on files that are really cold, and Provisioned throughput adds cost without changing first-byte latency."
      fr: "Supprimer la gestion du cycle de vie abandonne les économies sur les fichiers réellement froids, et le débit Provisioned ajoute des coûts sans modifier la latence du premier octet."
    b:
      en: "Archive has the same higher first-byte latency as IA and a higher charge per read, so reopened projects would become slower and more expensive to read."
      fr: "Archive a la même latence du premier octet élevée qu'IA et des frais de lecture plus élevés : les projets rouverts deviendraient plus lents et plus chers à lire."
    c:
      en: "A second file system changes the mount paths, duplicates storage, and the copy itself reads the files from IA."
      fr: "Un second système de fichiers change les chemins de montage, duplique le stockage, et la copie elle-même lit les fichiers depuis IA."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
