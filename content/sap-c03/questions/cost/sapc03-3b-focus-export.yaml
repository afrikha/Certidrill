id: sapc03-3b-focus-export
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs workloads on AWS and on two other cloud providers. Its FinOps platform ingests billing data only in the FinOps Open Cost and Usage Specification (FOCUS) format, and the two other providers already deliver FOCUS files.

    The FinOps team needs the detailed AWS cost and usage data of the whole organization in FOCUS 1.2 format, refreshed daily in an Amazon S3 bucket that the platform reads. The team wants the solution with the least development and maintenance effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des charges de travail sur AWS et sur deux autres fournisseurs de cloud. Sa plateforme FinOps n'ingère les données de facturation qu'au format FinOps Open Cost and Usage Specification (FOCUS), et les deux autres fournisseurs livrent déjà des fichiers FOCUS.

    L'équipe FinOps a besoin des données détaillées de coûts et d'utilisation AWS de toute l'organisation au format FOCUS 1.2, actualisées chaque jour dans un compartiment Amazon S3 que la plateforme lit. L'équipe veut la solution qui demande le moins de développement et de maintenance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the management account, create a standard export in AWS Data Exports that uses the FOCUS 1.2 with AWS columns table.", fr: "Depuis le compte de gestion, créer un export standard dans AWS Data Exports qui utilise la table FOCUS 1.2 with AWS columns." } }
    - { id: b, text: { en: "Create a CUR 2.0 export, and run a daily AWS Glue job that maps the CUR 2.0 columns to the FOCUS 1.2 schema.", fr: "Créer un export CUR 2.0, et exécuter chaque jour une tâche AWS Glue qui fait correspondre les colonnes CUR 2.0 au schéma FOCUS 1.2." } }
    - { id: c, text: { en: "Create a legacy Cost and Usage Report in CSV format, and convert each delivery to FOCUS 1.2 with an AWS Lambda function.", fr: "Créer un ancien rapport Cost and Usage Report au format CSV, et convertir chaque livraison en FOCUS 1.2 avec une fonction AWS Lambda." } }
    - { id: d, text: { en: "Call the Cost Explorer API every day for each account, and write the results to the bucket in the FOCUS 1.2 layout.", fr: "Appeler chaque jour l'API Cost Explorer pour chaque compte, et écrire les résultats dans le compartiment selon la disposition FOCUS 1.2." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AWS Data Exports offers standard exports for several tables, including FOCUS 1.2 with AWS columns and FOCUS 1.0 with AWS columns. A recurring export from the management account delivers the organization's data to Amazon S3, refreshed up to once per day. No transformation code is needed because AWS produces the FOCUS schema.
    fr: |
      AWS Data Exports propose des exports standard pour plusieurs tables, dont FOCUS 1.2 with AWS columns et FOCUS 1.0 with AWS columns. Un export récurrent depuis le compte de gestion livre les données de l'organisation dans Amazon S3, actualisées jusqu'à une fois par jour. Aucun code de transformation n'est nécessaire car AWS produit le schéma FOCUS.
  options:
    b: { en: "This works, but a custom column mapping must be built and maintained as both schemas evolve, which is more effort than a native FOCUS export.", fr: "Cela fonctionne, mais une correspondance de colonnes personnalisée doit être construite et maintenue au fil de l'évolution des deux schémas : c'est plus d'effort qu'un export FOCUS natif." }
    c: { en: "The legacy CUR still needs custom transformation code, and CUR 2.0 is the recommended way to receive detailed cost data.", fr: "L'ancien CUR exige toujours du code de transformation personnalisé, et CUR 2.0 est la méthode recommandée pour recevoir les données de coûts détaillées." }
    d: { en: "Cost Explorer API calls are billed per request, return aggregated results rather than detailed line items, and require custom formatting code.", fr: "Les appels à l'API Cost Explorer sont facturés à la requête, renvoient des résultats agrégés plutôt que des lignes détaillées, et exigent du code de mise en forme personnalisé." }
references:
  - title: What is AWS Data Exports?
    url: https://docs.aws.amazon.com/cur/latest/userguide/what-is-data-exports.html
