id: sapc03-3a-origin-group-s3-failover
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany distributes software installers to customers worldwide through an Amazon CloudFront distribution. The origin is an Amazon S3 bucket in the us-east-1 Region that CloudFront accesses with origin access control. S3 Cross-Region Replication copies every installer to a second bucket in the eu-west-1 Region. During a past service event in us-east-1, downloads of objects that were not in the cache failed for several hours. Customers download installers only with GET requests. The company wants downloads to fail over automatically to the replica within seconds, without adding compute resources and at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany distribue des programmes d'installation à ses clients dans le monde entier via une distribution Amazon CloudFront. L'origine est un compartiment Amazon S3 dans la Région us-east-1 auquel CloudFront accède avec un contrôle d'accès à l'origine (OAC). S3 Cross-Region Replication copie chaque programme d'installation dans un second compartiment de la Région eu-west-1. Lors d'un incident passé dans us-east-1, les téléchargements des objets absents du cache ont échoué pendant plusieurs heures. Les clients téléchargent les programmes uniquement avec des requêtes GET. L'entreprise veut que les téléchargements basculent automatiquement vers la réplique en quelques secondes, sans ajouter de ressources de calcul et au coût le plus faible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a second CloudFront distribution for the replica bucket, and use Amazon Route 53 failover records with health checks to switch the download domain between the two distributions."
        fr: "Créer une seconde distribution CloudFront pour le compartiment réplique, et utiliser des enregistrements de basculement Amazon Route 53 avec des vérifications de l'état pour faire basculer le domaine de téléchargement entre les deux distributions."
    - id: b
      text:
        en: "Add a Lambda@Edge function on the origin request event that checks the health of the primary bucket and rewrites the request to the replica bucket when the check fails."
        fr: "Ajouter une fonction Lambda@Edge sur l'événement de requête à l'origine qui vérifie l'état du compartiment principal et réécrit la requête vers le compartiment réplique en cas d'échec."
    - id: c
      text:
        en: "Create an AWS Global Accelerator standard accelerator with endpoint groups in both Regions, and make the accelerator the origin of the CloudFront distribution."
        fr: "Créer un accélérateur standard AWS Global Accelerator avec des groupes de points de terminaison dans les deux Régions, et faire de l'accélérateur l'origine de la distribution CloudFront."
    - id: d
      text:
        en: "Create an origin group with the us-east-1 bucket as primary and the eu-west-1 bucket as secondary, fail over on 5xx status codes, and shorten the connection timeout."
        fr: "Créer un groupe d'origines avec le compartiment us-east-1 comme principal et le compartiment eu-west-1 comme secondaire, basculer sur les codes 5xx, et réduire le délai de connexion."
answer: { optionId: d }
explanation:
  correct:
    en: "An origin group sends cache misses to the primary origin and retries them on the secondary origin when the primary returns a configured failover status code or cannot be reached, for GET, HEAD and OPTIONS requests. By default CloudFront tries the primary for up to 30 seconds (3 attempts of 10 seconds), so reducing the connection attempts and timeout makes the failover faster, with no extra compute or distribution."
    fr: "Un groupe d'origines envoie les échecs d'accès au cache vers l'origine principale et les relance sur l'origine secondaire lorsque la principale renvoie un code de basculement configuré ou est injoignable, pour les requêtes GET, HEAD et OPTIONS. Par défaut, CloudFront essaie l'origine principale jusqu'à 30 secondes (3 tentatives de 10 secondes) : réduire le nombre de tentatives et le délai de connexion accélère le basculement, sans calcul ni distribution supplémentaires."
  options:
    a:
      en: "DNS failover depends on health check intervals and record caching by resolvers, and a second distribution starts with an empty cache, so the switch is slower and the setup costs more."
      fr: "Le basculement DNS dépend des intervalles des vérifications de l'état et de la mise en cache des enregistrements par les résolveurs, et une seconde distribution démarre avec un cache vide : le basculement est plus lent et le dispositif coûte plus cher."
    b:
      en: "A Lambda@Edge function adds compute charges and custom health logic to every origin request, which the company wants to avoid."
      fr: "Une fonction Lambda@Edge ajoute des frais de calcul et une logique de vérification personnalisée à chaque requête à l'origine, ce que l'entreprise veut éviter."
    c:
      en: "Global Accelerator endpoints are resources such as load balancers, EC2 instances and Elastic IP addresses, not S3 buckets, and the accelerator would add fixed hourly charges."
      fr: "Les points de terminaison de Global Accelerator sont des ressources comme des équilibreurs de charge, des instances EC2 et des adresses IP Elastic, pas des compartiments S3, et l'accélérateur ajouterait des frais horaires fixes."
references:
  - title: "Optimize high availability with CloudFront origin failover"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
