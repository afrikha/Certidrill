id: sapc03-3c-unattached-volumes-archive
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cost review at AnyCompany finds 400 unattached General Purpose SSD (gp3) volumes, totaling 300 TiB, left behind by a decommissioned analytics project. The volumes have not been attached to any instance for six months. Auditors may ask to inspect the data at any time during the next two years, and a recovery that takes a few days is acceptable. Nobody expects to use the volumes for production again. The company wants the lowest storage cost while keeping the data recoverable.

    Which solution will meet these requirements?
  fr: |
    Une revue des coûts chez AnyCompany trouve 400 volumes General Purpose SSD (gp3) non attachés, totalisant 300 Tio, laissés par un projet d'analyse décommissionné. Les volumes ne sont attachés à aucune instance depuis six mois. Les auditeurs peuvent demander à inspecter les données à tout moment au cours des deux prochaines années, et une récupération qui prend quelques jours est acceptable. Personne ne prévoit de réutiliser les volumes en production. L'entreprise veut le coût de stockage le plus bas tout en gardant les données récupérables.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a snapshot of each volume, move each snapshot to the EBS Snapshots Archive tier, and delete the volumes.", fr: "Créer un instantané de chaque volume, déplacer chaque instantané vers le niveau EBS Snapshots Archive et supprimer les volumes." }
    - id: b
      text: { en: "Modify each volume to Cold HDD (sc1) by using Elastic Volumes and keep the volumes unattached.", fr: "Modifier chaque volume en Cold HDD (sc1) à l'aide d'Elastic Volumes et garder les volumes non attachés." }
    - id: c
      text: { en: "Create a snapshot of each volume in the standard snapshot tier and keep both the snapshots and the volumes.", fr: "Créer un instantané de chaque volume dans le niveau d'instantanés standard et conserver à la fois les instantanés et les volumes." }
    - id: d
      text: { en: "Reduce each gp3 volume to the baseline of 3,000 IOPS and 125 MiB/s and keep the volumes unattached.", fr: "Réduire chaque volume gp3 à la base de 3 000 IOPS et 125 Mio/s et garder les volumes non attachés." }
answer: { optionId: a }
explanation:
  correct:
    en: "Unattached volumes are billed for their full provisioned size. The EBS Snapshots Archive tier offers up to 75% lower snapshot storage cost for snapshots kept 90 days or more and rarely accessed, which fits a two-year audit hold. An archived snapshot is restored to the standard tier before use, which the accepted delay allows."
    fr: "Les volumes non attachés sont facturés sur toute leur taille provisionnée. Le niveau EBS Snapshots Archive offre un coût de stockage d'instantanés jusqu'à 75 % inférieur pour les instantanés conservés 90 jours ou plus et rarement consultés, ce qui convient à une conservation d'audit de deux ans. Un instantané archivé est restauré dans le niveau standard avant utilisation, ce que permet le délai accepté."
  options:
    b:
      en: "sc1 is cheaper than gp3 per GiB but is still billed for all 300 TiB of provisioned capacity every month, which costs more than archived snapshots."
      fr: "sc1 est moins cher que gp3 au Gio mais reste facturé chaque mois sur les 300 Tio de capacité provisionnée, ce qui coûte plus cher que des instantanés archivés."
    c:
      en: "Keeping the volumes and adding snapshots pays for the data twice; the volumes are the expensive part to remove."
      fr: "Conserver les volumes et ajouter des instantanés fait payer les données deux fois : ce sont les volumes, la partie la plus chère, qu'il faut supprimer."
    d:
      en: "Baseline gp3 performance is already included in the price, so the volumes are still billed for their full size and little or nothing is saved."
      fr: "Les performances de base gp3 sont déjà incluses dans le prix : les volumes restent facturés sur toute leur taille et l'économie est faible ou nulle."
references:
  - title: Archive Amazon EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-archive.html
