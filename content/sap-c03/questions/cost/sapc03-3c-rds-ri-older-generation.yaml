id: sapc03-3c-rds-ri-older-generation
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs its core banking ledger on an Amazon RDS for PostgreSQL Multi-AZ DB instance of class db.r5.8xlarge in eu-west-1. The vendor certifies the application only on this instance class until the end of its support contract in three years, and the database runs at a constant load 24 hours a day. The company will not change the engine, instance family, or Region during this period. The CFO approved an upfront payment if it gives the largest possible discount over the three years. A FinOps analyst proposes a Database Savings Plan because it is the newest commitment option.

    Which purchase will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exécute son registre bancaire principal sur une instance de base de données Amazon RDS for PostgreSQL Multi-AZ de classe db.r5.8xlarge en eu-west-1. L'éditeur ne certifie l'application que sur cette classe d'instance jusqu'à la fin de son contrat de support, dans trois ans, et la base fonctionne avec une charge constante 24 heures sur 24. L'entreprise ne changera ni le moteur, ni la famille d'instances, ni la Région pendant cette période. Le directeur financier a approuvé un paiement initial s'il apporte la remise la plus élevée possible sur les trois ans. Un analyste FinOps propose un Database Savings Plan, car c'est l'option d'engagement la plus récente.

    Quel achat répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "A 3-year All Upfront reserved DB instance for RDS for PostgreSQL, Multi-AZ, db.r5.8xlarge, in eu-west-1.", fr: "Une instance de base de données réservée RDS for PostgreSQL de 3 ans entièrement payée d'avance (All Upfront), Multi-AZ, db.r5.8xlarge, en eu-west-1." }
    - id: b
      text: { en: "A 1-year Database Savings Plan sized to the hourly cost of the DB instance, renewed every year for three years.", fr: "Un Database Savings Plan d'un an dimensionné sur le coût horaire de l'instance de base de données, renouvelé chaque année pendant trois ans." }
    - id: c
      text: { en: "A 3-year All Upfront Compute Savings Plan sized to the hourly cost of the DB instance.", fr: "Un Compute Savings Plan de 3 ans entièrement payé d'avance (All Upfront), dimensionné sur le coût horaire de l'instance de base de données." }
    - id: d
      text: { en: "A 1-year No Upfront reserved DB instance for RDS for PostgreSQL, Multi-AZ, db.r5.8xlarge, renewed every year for three years.", fr: "Une instance de base de données réservée RDS for PostgreSQL d'un an sans paiement initial (No Upfront), Multi-AZ, db.r5.8xlarge, renouvelée chaque année pendant trois ans." }
answer: { optionId: a }
explanation:
  correct:
    en: "Reserved DB instances are available for one or three years, with No Upfront, Partial Upfront, or All Upfront payment; a 3-year All Upfront reservation gives the deepest discount for a fixed engine, class, and Region. Database Savings Plans cover only generation 7 and newer instances and have a 1-year term, so they do not apply to db.r5."
    fr: "Les instances de base de données réservées existent pour un ou trois ans, avec un paiement No Upfront, Partial Upfront ou All Upfront : une réservation de 3 ans All Upfront donne la remise la plus forte pour un moteur, une classe et une Région fixes. Les Database Savings Plans ne couvrent que les instances de génération 7 et ultérieures et ont une durée d'un an : ils ne s'appliquent pas à db.r5."
  options:
    b:
      en: "Database Savings Plans cover only generation 7 and newer instances, so a db.r5 instance gets no discount, and the 1-year term cannot lock a three-year rate."
      fr: "Les Database Savings Plans ne couvrent que les instances de génération 7 et ultérieures : une instance db.r5 n'obtient aucune remise, et la durée d'un an ne permet pas de bloquer un tarif sur trois ans."
    c:
      en: "Compute Savings Plans apply to Amazon EC2, AWS Fargate, and AWS Lambda, not to Amazon RDS."
      fr: "Les Compute Savings Plans s'appliquent à Amazon EC2, AWS Fargate et AWS Lambda, pas à Amazon RDS."
    d:
      en: "A 1-year No Upfront reservation has a smaller discount than a 3-year All Upfront reservation, and the CFO approved the upfront payment to get the largest discount."
      fr: "Une réservation d'un an No Upfront offre une remise plus faible qu'une réservation de 3 ans All Upfront, et le directeur financier a approuvé le paiement initial pour obtenir la plus forte remise."
references:
  - title: Reserved DB instances for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html
  - title: Savings Plans FAQs
    url: https://aws.amazon.com/savingsplans/faq/
