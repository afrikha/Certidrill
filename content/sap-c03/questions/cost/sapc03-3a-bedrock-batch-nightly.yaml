id: sapc03-3a-bedrock-batch-nightly
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's contact center stores about 2 million call transcripts in an Amazon S3 bucket every night. A fleet of AWS Lambda functions sends each transcript to an Anthropic Claude model in Amazon Bedrock with an on-demand InvokeModel request to produce a summary. The functions are often throttled, and the team maintains custom retry and concurrency code. The summaries are needed only by 08:00 the next morning, and the model supports batch inference in the Region. The company wants to reduce the cost of the summaries with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le centre de contact d'AnyCompany stocke chaque nuit environ 2 millions de transcriptions d'appels dans un compartiment Amazon S3. Une flotte de fonctions AWS Lambda envoie chaque transcription à un modèle Anthropic Claude dans Amazon Bedrock avec une requête InvokeModel à la demande pour produire un résumé. Les fonctions sont souvent limitées (throttling), et l'équipe maintient un code personnalisé de nouvelles tentatives et de gestion de la simultanéité. Les résumés ne sont nécessaires que le lendemain à 08:00, et le modèle prend en charge l'inférence par lots dans la Région. L'entreprise veut réduire le coût des résumés avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write the prompts to S3 as JSONL records each night, and submit an Amazon Bedrock batch inference job that writes the summaries back to S3."
        fr: "Écrire chaque nuit les invites dans S3 sous forme d'enregistrements JSONL, et soumettre une tâche d'inférence par lots Amazon Bedrock qui réécrit les résumés dans S3."
    - id: b
      text:
        en: "Purchase Provisioned Throughput for the model with a 1-month commitment, and send the nightly requests from the Lambda functions to the provisioned model."
        fr: "Acheter du Provisioned Throughput pour le modèle avec un engagement de 1 mois, et envoyer les requêtes nocturnes des fonctions Lambda vers le modèle provisionné."
    - id: c
      text:
        en: "Set the service tier of the nightly requests to priority so that they are processed ahead of other traffic and finish with fewer throttled retries."
        fr: "Définir le niveau de service des requêtes nocturnes sur priority pour qu'elles soient traitées avant le reste du trafic et se terminent avec moins de nouvelles tentatives limitées."
    - id: d
      text:
        en: "Request a higher on-demand quota for the model, and raise the reserved concurrency of the Lambda functions so that all transcripts are sent in parallel."
        fr: "Demander un quota à la demande plus élevé pour le modèle, et augmenter la simultanéité réservée des fonctions Lambda pour que toutes les transcriptions soient envoyées en parallèle."
answer: { optionId: a }
explanation:
  correct:
    en: "Batch inference processes many prompts in one asynchronous job that reads input files from S3 and writes the responses back to S3, and Bedrock offers it for select models at a 50% lower price than on-demand inference. The job removes the custom throttling and retry code, and EventBridge notifications signal when the output is ready."
    fr: "L'inférence par lots traite de nombreuses invites dans une seule tâche asynchrone qui lit les fichiers d'entrée dans S3 et réécrit les réponses dans S3, et Bedrock la propose pour certains modèles à un prix inférieur de 50 % à celui de l'inférence à la demande. La tâche supprime le code personnalisé de limitation et de nouvelles tentatives, et les notifications EventBridge signalent que la sortie est prête."
  options:
    b:
      en: "Provisioned Throughput is billed every hour of the commitment, including the daytime hours when no summaries are produced, and does not lower the price per token."
      fr: "Le Provisioned Throughput est facturé chaque heure de l'engagement, y compris en journée quand aucun résumé n'est produit, et ne réduit pas le prix par jeton."
    c:
      en: "The priority tier is billed at a premium over standard on-demand pricing, so it increases the cost of a workload that does not need fast responses."
      fr: "Le niveau priority est facturé avec une majoration par rapport au tarif à la demande standard : il augmente le coût d'une charge de travail qui n'a pas besoin de réponses rapides."
    d:
      en: "More quota and concurrency may reduce throttling, but every request is still billed at the full on-demand price and the custom code remains."
      fr: "Plus de quota et de simultanéité peuvent réduire la limitation, mais chaque requête reste facturée au plein tarif à la demande et le code personnalisé demeure."
references:
  - title: "Process multiple prompts with batch inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
  - title: "Service tiers for optimizing performance and cost"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
