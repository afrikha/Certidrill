id: sapc03-3b-ce-api-to-cur
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's internal chargeback portal calls the AWS Cost Explorer GetCostAndUsage API every 5 minutes for each of its 350 accounts, with several group-by combinations and paginated results. The Cost Explorer API charges have grown to thousands of dollars each month, and the portal is often throttled.

    The business owners have confirmed that the portal data only needs to be refreshed once a day. They also want a new page that, from now on, keeps the daily cost of each EC2 instance and RDS DB instance over a rolling 12-month window. The FinOps team wants to reduce cost and keep operations simple.

    Which solution will meet these requirements?
  fr: |
    Le portail interne de refacturation d'AnyCompany appelle l'API GetCostAndUsage d'AWS Cost Explorer toutes les 5 minutes pour chacun de ses 350 comptes, avec plusieurs combinaisons de regroupement et des résultats paginés. Les frais de l'API Cost Explorer atteignent plusieurs milliers de dollars par mois, et le portail est souvent limité (throttling).

    Les responsables métier ont confirmé que les données du portail n'ont besoin d'être actualisées qu'une fois par jour. Ils veulent aussi une nouvelle page qui, à partir de maintenant, conserve le coût quotidien de chaque instance EC2 et de chaque instance de base de données RDS sur une fenêtre glissante de 12 mois. L'équipe FinOps veut réduire le coût et garder une exploitation simple.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Cache the Cost Explorer API results in an Amazon DynamoDB table, and refresh the cache once every hour.", fr: "Mettre en cache les résultats de l'API Cost Explorer dans une table Amazon DynamoDB, et actualiser le cache une fois par heure." } }
    - { id: b, text: { en: "Enable resource-level data at daily granularity in the Cost Management preferences, and call the Cost Explorer API once a day.", fr: "Activer les données au niveau des ressources à granularité quotidienne dans les préférences Cost Management, et appeler l'API Cost Explorer une fois par jour." } }
    - { id: c, text: { en: "Create a CUR 2.0 export with daily granularity, resource IDs, Parquet files, and overwrite delivery, and have the portal query it with Amazon Athena.", fr: "Créer un export CUR 2.0 avec une granularité quotidienne, les ID de ressources, des fichiers Parquet et une livraison par écrasement, et faire interroger l'export par le portail avec Amazon Athena." } }
    - { id: d, text: { en: "Create one custom billing view per account, and have the portal call the Cost Explorer API with each billing view once a day.", fr: "Créer une vue de facturation personnalisée par compte, et faire appeler par le portail l'API Cost Explorer avec chaque vue de facturation une fois par jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A CUR 2.0 export can include a line item for each resource and is delivered as a recurring export, refreshed up to once per day, which matches the portal's needs. Data kept in Amazon S3 builds up month after month, so a rolling 12-month window of per-resource daily costs becomes available, and Athena queries replace the per-request Cost Explorer API charges. Parquet with overwrite delivery is the option set that Data Exports recommends for Athena.
    fr: |
      Un export CUR 2.0 peut inclure une ligne pour chaque ressource et est livré comme export récurrent, actualisé jusqu'à une fois par jour, ce qui correspond aux besoins du portail. Les données conservées dans Amazon S3 s'accumulent mois après mois : une fenêtre glissante de 12 mois de coûts quotidiens par ressource devient disponible, et les requêtes Athena remplacent les frais par requête de l'API Cost Explorer. Parquet avec livraison par écrasement est l'ensemble d'options que Data Exports recommande pour Athena.
  options:
    a: { en: "Hourly refreshes still make thousands of billed API requests each day, and Cost Explorer resource-level data covers only the past 14 days, not 12 months.", fr: "Des actualisations horaires font toujours des milliers de requêtes API facturées par jour, et les données au niveau des ressources de Cost Explorer ne couvrent que les 14 derniers jours, pas 12 mois." }
    b: { en: "Daily resource-level data in Cost Explorer is available only for the past 14 days, so the 12-month per-instance page cannot be built.", fr: "Les données quotidiennes au niveau des ressources de Cost Explorer ne sont disponibles que pour les 14 derniers jours : la page par instance sur 12 mois ne peut pas être construite." }
    d: { en: "Requests that use custom billing views are billed per source, so 350 views keep the API charges high, and the 14-day resource-level limit still applies.", fr: "Les requêtes qui utilisent des vues de facturation personnalisées sont facturées par source : 350 vues maintiennent des frais d'API élevés, et la limite de 14 jours au niveau des ressources s'applique toujours." }
references:
  - title: Configuring multi-year and granular data
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-configuring-data.html
  - title: AWS Cost Explorer Pricing
    url: https://aws.amazon.com/aws-cost-management/aws-cost-explorer/pricing/
