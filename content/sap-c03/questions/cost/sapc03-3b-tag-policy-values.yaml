id: sapc03-3b-tag-policy-values
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's cost reports are split across several variants of the same tag: costcenter, Cost-Center, and CostCenter, with values such as fin, FIN, and FIN-01. The FinOps team has defined one standard: the key CostCenter, with one of 40 approved codes as its value.

    The team wants the standard applied across all accounts in AWS Organizations. Tagging requests on EC2 instances and S3 buckets that use a value outside the approved list must fail. The team also needs an organization-wide report of existing resources whose CostCenter tag does not follow the standard. For now, resources without a CostCenter tag must still be allowed.

    Which solution will meet these requirements?
  fr: |
    Les rapports de coûts d'AnyCompany sont répartis entre plusieurs variantes d'une même balise : costcenter, Cost-Center et CostCenter, avec des valeurs comme fin, FIN et FIN-01. L'équipe FinOps a défini un standard unique : la clé CostCenter, avec l'un des 40 codes approuvés comme valeur.

    L'équipe veut appliquer le standard à tous les comptes d'AWS Organizations. Les requêtes de balisage sur les instances EC2 et les compartiments S3 qui utilisent une valeur hors de la liste approuvée doivent échouer. L'équipe a aussi besoin d'un rapport à l'échelle de l'organisation sur les ressources existantes dont la balise CostCenter ne suit pas le standard. Pour l'instant, les ressources sans balise CostCenter doivent rester autorisées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP to the organization root that denies ec2:CreateTags and s3:PutBucketTagging when aws:RequestTag/CostCenter is not one of the 40 approved codes.", fr: "Attacher à la racine de l'organisation une SCP qui refuse ec2:CreateTags et s3:PutBucketTagging lorsque aws:RequestTag/CostCenter n'est pas l'un des 40 codes approuvés." } }
    - { id: b, text: { en: "Deploy the required-tags AWS Config rule as an organization rule with CostCenter as tag1Key and the 40 approved codes as tag1Value.", fr: "Déployer la règle AWS Config required-tags comme règle d'organisation avec CostCenter comme tag1Key et les 40 codes approuvés comme tag1Value." } }
    - { id: c, text: { en: "Attach a tag policy to the organization root that defines the CostCenter key capitalization and the 40 allowed values, and enforces them for ec2:instance and s3:bucket.", fr: "Attacher à la racine de l'organisation une politique de balises qui définit la casse de la clé CostCenter et les 40 valeurs autorisées, et les applique à `ec2:instance` et `s3:bucket`." } }
    - { id: d, text: { en: "Create a cost category whose rules map each tag variant and value to the approved code, and use it as the cost allocation dimension.", fr: "Créer une catégorie de coûts dont les règles font correspondre chaque variante de balise et chaque valeur au code approuvé, et l'utiliser comme dimension de répartition des coûts." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A tag policy defines the capitalization of the tag key and its allowed values, and enforcement for specified resource types prevents noncompliant tagging operations from completing. Untagged resources are not evaluated, so resources without the tag remain allowed. Signed in to the management account, the team can view tag policy compliance for all accounts of the organization.
    fr: |
      Une politique de balises définit la casse de la clé de balise et ses valeurs autorisées, et l'application à des types de ressources donnés empêche les opérations de balisage non conformes d'aboutir. Les ressources sans balise ne sont pas évaluées : elles restent donc autorisées. Connectée au compte de gestion, l'équipe peut consulter la conformité aux politiques de balises de tous les comptes de l'organisation.
  options:
    a: { en: "The SCP can block wrong values in tagging requests, but it produces no organization-wide compliance report of the existing resources, which the team needs.", fr: "La SCP peut bloquer les mauvaises valeurs dans les requêtes de balisage, mais elle ne produit aucun rapport de conformité à l'échelle de l'organisation sur les ressources existantes, dont l'équipe a besoin." }
    b: { en: "The required-tags rule reports noncompliant resources but does not make noncompliant tagging requests fail, and it flags untagged resources that must stay allowed.", fr: "La règle required-tags signale les ressources non conformes mais ne fait pas échouer les requêtes de balisage non conformes, et elle signale les ressources sans balise qui doivent rester autorisées." }
    d: { en: "A cost category only regroups costs in reports; it neither blocks noncompliant tags nor reports noncompliant resources.", fr: "Une catégorie de coûts ne fait que regrouper les coûts dans les rapports ; elle ne bloque pas les balises non conformes et ne signale pas les ressources non conformes." }
references:
  - title: Tag policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
  - title: Tag policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_example-tag-policies.html
