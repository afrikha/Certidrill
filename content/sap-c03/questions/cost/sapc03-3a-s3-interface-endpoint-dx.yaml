id: sapc03-3a-s3-interface-endpoint-dx
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's on-premises data center sends about 150 TB of backups each month to Amazon S3 buckets in the us-east-1 Region. The data center connects to a VPC in us-east-1 through an AWS Direct Connect private virtual interface. Because on-premises servers cannot use the VPC's S3 gateway endpoint, the backups pass through a fleet of Amazon EC2 proxy instances in the VPC that forward the traffic to S3 through the gateway endpoint. Security policy requires that the backup traffic stays on private connectivity and never uses the public internet or a public virtual interface. The company wants to remove the cost and operational overhead of the proxy fleet.

    Which solution will meet these requirements?
  fr: |
    Le centre de données sur site d'AnyCompany envoie chaque mois environ 150 To de sauvegardes vers des compartiments Amazon S3 de la Région us-east-1. Le centre de données est connecté à un VPC de us-east-1 par une interface virtuelle privée AWS Direct Connect. Comme les serveurs sur site ne peuvent pas utiliser le point de terminaison de passerelle S3 du VPC, les sauvegardes passent par une flotte d'instances proxy Amazon EC2 du VPC qui transmettent le trafic à S3 via le point de terminaison de passerelle. La politique de sécurité exige que le trafic de sauvegarde reste sur une connectivité privée et n'utilise jamais l'internet public ni une interface virtuelle publique. L'entreprise veut supprimer le coût et la charge opérationnelle de la flotte de proxys.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an S3 interface endpoint in the VPC, and point the on-premises backup software to its endpoint-specific DNS names over the private virtual interface."
        fr: "Créer un point de terminaison d'interface S3 dans le VPC, et diriger le logiciel de sauvegarde sur site vers ses noms DNS propres au point de terminaison via l'interface virtuelle privée."
    - id: b
      text:
        en: "Advertise the prefix list of the S3 gateway endpoint to the on-premises routers over the private virtual interface, and route the backup traffic directly to the gateway endpoint."
        fr: "Annoncer la liste de préfixes du point de terminaison de passerelle S3 aux routeurs sur site par l'interface virtuelle privée, et router le trafic de sauvegarde directement vers le point de terminaison de passerelle."
    - id: c
      text:
        en: "Replace the proxy fleet with a NAT gateway in a public subnet of the VPC, and route the on-premises backup traffic to the NAT gateway over the private virtual interface."
        fr: "Remplacer la flotte de proxys par une passerelle NAT dans un sous-réseau public du VPC, et router le trafic de sauvegarde sur site vers la passerelle NAT par l'interface virtuelle privée."
    - id: d
      text:
        en: "Create a public virtual interface on the Direct Connect connection, and send the backups to the public S3 endpoints over that interface."
        fr: "Créer une interface virtuelle publique sur la connexion Direct Connect, et envoyer les sauvegardes vers les points de terminaison publics S3 par cette interface."
answer: { optionId: a }
explanation:
  correct:
    en: "S3 interface endpoints are network interfaces with private IP addresses in the VPC, so on-premises applications can reach them over Direct Connect or Site-to-Site VPN, using the endpoint-specific DNS names or private DNS through an inbound Route 53 Resolver endpoint. The backups then go privately to S3 without any proxy instances to run, at the endpoint's hourly and per-GB price."
    fr: "Les points de terminaison d'interface S3 sont des interfaces réseau dotées d'adresses IP privées dans le VPC : les applications sur site peuvent les joindre via Direct Connect ou Site-to-Site VPN, avec les noms DNS propres au point de terminaison ou le DNS privé via un point de terminaison entrant Route 53 Resolver. Les sauvegardes vont alors en privé vers S3 sans aucune instance proxy à exploiter, au prix horaire et par Go du point de terminaison."
  options:
    b:
      en: "A gateway endpoint is a route table target that serves only resources inside the VPC; it cannot be reached from on-premises networks over Direct Connect or VPN."
      fr: "Un point de terminaison de passerelle est une cible de table de routage qui ne sert que les ressources du VPC ; il est injoignable depuis les réseaux sur site via Direct Connect ou VPN."
    c:
      en: "A NAT gateway provides outbound access for resources in the VPC and adds per-GB processing charges; it is not a supported path for on-premises traffic to S3."
      fr: "Une passerelle NAT fournit un accès sortant aux ressources du VPC et ajoute des frais de traitement par Go ; ce n'est pas un chemin pris en charge pour le trafic sur site vers S3."
    d:
      en: "The security policy forbids a public virtual interface for the backup traffic."
      fr: "La politique de sécurité interdit une interface virtuelle publique pour le trafic de sauvegarde."
references:
  - title: "AWS PrivateLink for Amazon S3"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html
  - title: "Gateway endpoints for Amazon S3"
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
