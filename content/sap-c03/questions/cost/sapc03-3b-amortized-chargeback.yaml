id: sapc03-3b-amortized-chargeback
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's central FinOps account bought Compute Savings Plans with the All Upfront payment option and Amazon EC2 Reserved Instances with the Partial Upfront payment option. The discounts are shared across the organization, and each business unit owns its own accounts.

    For the monthly chargeback, each business unit must be charged the effective cost of the compute it consumed, including its share of the upfront fees spread over the commitment term. The central FinOps account must not show the upfront payments as a one-day spike, and the totals across business units must reconcile with the commitment-based discounts the organization actually received.

    Which approach should the FinOps team use in AWS Cost Explorer?
  fr: |
    Le compte FinOps central d'AnyCompany a acheté des Compute Savings Plans avec l'option de paiement All Upfront et des instances réservées Amazon EC2 avec l'option Partial Upfront. Les remises sont partagées dans toute l'organisation, et chaque unité opérationnelle possède ses propres comptes.

    Pour la refacturation mensuelle, chaque unité opérationnelle doit payer le coût effectif du calcul qu'elle a consommé, y compris sa part des frais initiaux étalée sur la durée de l'engagement. Le compte FinOps central ne doit pas afficher les paiements initiaux comme un pic d'un jour, et les totaux des unités opérationnelles doivent correspondre aux remises sur engagement réellement obtenues par l'organisation.

    Quelle approche l'équipe FinOps doit-elle utiliser dans AWS Cost Explorer ?
body:
  options:
    - { id: a, text: { en: "Report unblended costs grouped by linked account, and allocate the upfront fees in the central account to business units by their share of On-Demand usage.", fr: "Présenter les coûts non combinés (unblended) regroupés par compte lié, et répartir les frais initiaux du compte central entre unités opérationnelles selon leur part d'utilisation à la demande." } }
    - { id: b, text: { en: "Report amortized costs grouped by linked account.", fr: "Présenter les coûts amortis (amortized) regroupés par compte lié." } }
    - { id: c, text: { en: "Report blended costs grouped by linked account.", fr: "Présenter les coûts combinés (blended) regroupés par compte lié." } }
    - { id: d, text: { en: "Turn off Reserved Instance and Savings Plans discount sharing, and report unblended costs grouped by linked account.", fr: "Désactiver le partage des remises des instances réservées et des Savings Plans, et présenter les coûts non combinés regroupés par compte lié." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amortized costs spread the upfront and recurring commitment fees across the billing period and show them in the accounts whose usage the commitments covered. Grouped by linked account, they give each business unit the effective cost of the compute it consumed, and the totals reconcile with the discounts that were applied. Unblended costs instead show an upfront fee as a spike on the day it is charged.
    fr: |
      Les coûts amortis étalent les frais d'engagement initiaux et récurrents sur la période de facturation et les présentent dans les comptes dont l'utilisation a été couverte par les engagements. Regroupés par compte lié, ils donnent à chaque unité opérationnelle le coût effectif du calcul qu'elle a consommé, et les totaux correspondent aux remises appliquées. Les coûts non combinés montrent au contraire un frais initial comme un pic le jour où il est facturé.
  options:
    a: { en: "Unblended costs show the upfront fees as a spike in the central account, and a manual reallocation by On-Demand share does not match how the discounts were actually applied.", fr: "Les coûts non combinés montrent les frais initiaux comme un pic dans le compte central, et une réaffectation manuelle selon la part à la demande ne correspond pas à la façon dont les remises ont réellement été appliquées." }
    c: { en: "Blended costs average usage rates across the consolidated billing family instead of showing the effective commitment cost that each account consumed.", fr: "Les coûts combinés font la moyenne des tarifs d'utilisation de toute la famille de facturation consolidée au lieu de montrer le coût d'engagement effectif consommé par chaque compte." }
    d: { en: "Without sharing, only the central account benefits from the commitments while the business units pay higher rates, which raises the organization's total cost.", fr: "Sans partage, seul le compte central profite des engagements tandis que les unités opérationnelles paient des tarifs plus élevés, ce qui augmente le coût total de l'organisation." }
references:
