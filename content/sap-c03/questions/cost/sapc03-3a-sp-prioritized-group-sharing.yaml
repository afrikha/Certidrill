id: sapc03-3a-sp-prioritized-group-sharing
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has an organization in AWS Organizations with 60 member accounts that belong to three business units. The retail business unit owns 18 of these accounts. The retail business unit purchased a 3-year Compute Savings Plan in its shared-services account to cover the Amazon EC2 and AWS Fargate baseline of its own workloads. The finance team discovered that the default organization-wide discount sharing applies part of the plan to accounts of other business units while some retail accounts still pay On-Demand rates. The finance team wants the plan to apply to the retail accounts before any other account. Any commitment that the retail accounts cannot use in a given hour must still reduce the bill of the rest of the organization. Every account must keep discount sharing activated.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une organisation dans AWS Organizations comprenant 60 comptes membres répartis entre trois unités opérationnelles. L'unité opérationnelle Retail possède 18 de ces comptes. Elle a acheté un Compute Savings Plan sur 3 ans dans son compte de services partagés pour couvrir la charge de base Amazon EC2 et AWS Fargate de ses propres charges de travail. L'équipe financière a découvert que le partage des remises à l'échelle de l'organisation, configuré par défaut, applique une partie du plan aux comptes d'autres unités opérationnelles alors que certains comptes Retail paient encore les tarifs On-Demand. L'équipe financière veut que le plan s'applique aux comptes Retail avant tout autre compte. Tout engagement que les comptes Retail ne peuvent pas utiliser pendant une heure donnée doit continuer à réduire la facture du reste de l'organisation. Tous les comptes doivent conserver le partage des remises activé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the management account, create a cost category with the Benefit group sharing association that groups the 18 retail accounts, and select Restricted sharing group in the billing preferences."
        fr: "Depuis le compte de gestion, créer une catégorie de coûts associée au partage par groupe de remises (Benefit group sharing) qui regroupe les 18 comptes Retail, puis sélectionner Restricted sharing group dans les préférences de facturation."
    - id: b
      text:
        en: "From the management account, create a cost category with the Benefit group sharing association that groups the 18 retail accounts, and select Prioritized sharing group in the billing preferences."
        fr: "Depuis le compte de gestion, créer une catégorie de coûts associée au partage par groupe de remises (Benefit group sharing) qui regroupe les 18 comptes Retail, puis sélectionner Prioritized sharing group dans les préférences de facturation."
    - id: c
      text:
        en: "From the management account, deactivate Reserved Instances and Savings Plans discount sharing for the 42 accounts of the other business units, and keep sharing activated for the retail accounts."
        fr: "Depuis le compte de gestion, désactiver le partage des remises des instances réservées et des Savings Plans pour les 42 comptes des autres unités opérationnelles, et le laisser activé pour les comptes Retail."
    - id: d
      text:
        en: "Use AWS Billing Conductor to create a billing group for the 18 retail accounts with the shared-services account as the primary account, so that the plan applies to that billing group first."
        fr: "Utiliser AWS Billing Conductor pour créer un groupe de facturation pour les 18 comptes Retail avec le compte de services partagés comme compte principal, afin que le plan s'applique d'abord à ce groupe de facturation."
answer: { optionId: b }
explanation:
  correct:
    en: "Group sharing uses a cost category with the Benefit group sharing association, created in the management account, to define which accounts form a sharing group. In Prioritized mode, a commitment applies to its owner account, then to the accounts of its group, and then to any other sharing-activated account, so the retail accounts are served first and no unused commitment is wasted."
    fr: "Le partage par groupe utilise une catégorie de coûts associée à Benefit group sharing, créée dans le compte de gestion, pour définir les comptes qui forment un groupe de partage. En mode Prioritized, un engagement s'applique au compte propriétaire, puis aux comptes de son groupe, puis à tout autre compte dont le partage est activé : les comptes Retail sont servis en premier et aucun engagement inutilisé n'est perdu."
  options:
    a:
      en: "Restricted mode applies the commitment only to the owner account and its group, so the hours that the retail accounts cannot use are not shared with the rest of the organization."
      fr: "Le mode Restricted n'applique l'engagement qu'au compte propriétaire et à son groupe : les heures que les comptes Retail ne peuvent pas utiliser ne sont pas partagées avec le reste de l'organisation."
    c:
      en: "Deactivating sharing violates the requirement that every account keeps sharing activated, and the unused retail commitment could no longer reduce the bill of the other business units."
      fr: "Désactiver le partage enfreint l'exigence selon laquelle tous les comptes conservent le partage activé, et l'engagement Retail inutilisé ne pourrait plus réduire la facture des autres unités opérationnelles."
    d:
      en: "Billing Conductor produces pro forma cost data only; it does not change the AWS invoice or how commitment-based discounts such as Savings Plans are shared."
      fr: "Billing Conductor ne produit que des données de coûts pro forma ; il ne modifie ni la facture AWS ni la manière dont les remises liées à un engagement, comme les Savings Plans, sont partagées."
references:
  - title: "Reserved Instances and Savings Plans discount sharing"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
  - title: "Understanding how Savings Plans apply to your usage"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-applying.html
