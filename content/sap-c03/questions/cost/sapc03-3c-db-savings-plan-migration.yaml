id: sapc03-3c-db-savings-plan-migration
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs 60 Amazon RDS for MySQL DB instances on db.r7g and db.r8g instance classes in us-east-1 and eu-west-1, with a stable baseline spend of about $90 per hour. Over the next 12 months, the company plans to migrate about half of these databases to Amazon Aurora PostgreSQL-Compatible Edition with Aurora Serverless v2. It also plans to move one product line from eu-west-1 to eu-central-1. The finance team wants a discount on the steady database spend now, but it will not accept a commitment that stops applying when a database changes engine, deployment type, or Region. The company does not want to pay upfront.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 60 instances de base de données Amazon RDS for MySQL sur les classes d'instance db.r7g et db.r8g en us-east-1 et eu-west-1, avec des dépenses de base stables d'environ 90 $ par heure. Au cours des 12 prochains mois, l'entreprise prévoit de migrer environ la moitié de ces bases vers Amazon Aurora PostgreSQL-Compatible Edition avec Aurora Serverless v2. Elle prévoit aussi de déplacer une gamme de produits de eu-west-1 vers eu-central-1. L'équipe financière veut une remise sur les dépenses stables de bases de données dès maintenant, mais n'acceptera pas un engagement qui cesse de s'appliquer lorsqu'une base change de moteur, de type de déploiement ou de Région. L'entreprise ne veut pas payer d'avance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Purchase 1-year No Upfront reserved DB instances for RDS for MySQL that match the current instance classes in each Region, using size flexibility within each instance family.", fr: "Acheter des instances de base de données réservées RDS for MySQL d'un an sans paiement initial (No Upfront) correspondant aux classes d'instance actuelles dans chaque Région, en utilisant la flexibilité de taille au sein de chaque famille d'instances." }
    - id: b
      text: { en: "Purchase a 1-year No Upfront Compute Savings Plan with a commitment of $90 per hour in the management account of the organization.", fr: "Acheter un Compute Savings Plan d'un an sans paiement initial avec un engagement de 90 $ par heure dans le compte de gestion de l'organisation." }
    - id: c
      text: { en: "Purchase 1-year No Upfront reserved DB instances for Aurora PostgreSQL now, sized for the target databases, so that they apply as soon as the migrations finish.", fr: "Acheter dès maintenant des instances de base de données réservées Aurora PostgreSQL d'un an sans paiement initial, dimensionnées pour les bases cibles, afin qu'elles s'appliquent dès la fin des migrations." }
    - id: d
      text: { en: "Purchase a 1-year Database Savings Plan with a commitment sized to the steady baseline, as recommended in the Billing and Cost Management console.", fr: "Acheter un Database Savings Plan d'un an avec un engagement dimensionné sur la base stable, comme le recommande la console Billing and Cost Management." }
answer: { optionId: d }
explanation:
  correct:
    en: "A Database Savings Plan is a 1-year, No Upfront commitment in dollars per hour that applies automatically to eligible Aurora, RDS, DynamoDB, and other database usage. The discount keeps applying when usage moves to another engine, from provisioned instances to serverless, or to another Region, and it covers generation 7 and newer instances such as db.r7g and db.r8g."
    fr: "Un Database Savings Plan est un engagement d'un an sans paiement initial, en dollars par heure, qui s'applique automatiquement à l'utilisation éligible d'Aurora, de RDS, de DynamoDB et d'autres bases de données. La remise continue de s'appliquer lorsque l'utilisation passe à un autre moteur, des instances provisionnées au sans serveur, ou dans une autre Région, et elle couvre les instances de génération 7 et ultérieures comme db.r7g et db.r8g."
  options:
    a:
      en: "Reserved DB instances are tied to an engine and a Region; size flexibility works only within the same engine and Region, so the reservations stop applying after the migration to Aurora Serverless v2 or the move to eu-central-1."
      fr: "Les instances de base de données réservées sont liées à un moteur et à une Région : la flexibilité de taille ne joue qu'au sein du même moteur et de la même Région, les réservations cessent donc de s'appliquer après la migration vers Aurora Serverless v2 ou le déplacement vers eu-central-1."
    b:
      en: "Compute Savings Plans apply to Amazon EC2, AWS Fargate, and AWS Lambda usage, not to Amazon RDS or Aurora, so the database spend gets no discount."
      fr: "Les Compute Savings Plans s'appliquent à l'utilisation d'Amazon EC2, d'AWS Fargate et d'AWS Lambda, pas à Amazon RDS ni à Aurora : les dépenses de bases de données n'obtiennent aucune remise."
    c:
      en: "Reservations bought now for databases that do not exist yet are paid without matching usage, and Aurora Serverless v2 capacity is billed in ACU-hours, which reserved DB instances do not cover."
      fr: "Des réservations achetées maintenant pour des bases qui n'existent pas encore sont payées sans utilisation correspondante, et la capacité Aurora Serverless v2 est facturée en ACU-heures, que les instances réservées ne couvrent pas."
references:
  - title: Savings Plans FAQs
    url: https://aws.amazon.com/savingsplans/faq/
  - title: Reserved DB instances for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html
