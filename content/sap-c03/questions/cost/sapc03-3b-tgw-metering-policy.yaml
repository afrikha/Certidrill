id: sapc03-3b-tgw-metering-policy
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's network account owns an AWS Transit Gateway with a Direct Connect gateway attachment, and 50 application accounts own VPC attachments to it. On-premises users download large datasets from the application VPCs and upload results to them every day.

    The network team has found that the transit gateway data processing for traffic coming from on premises is billed to the network account, while traffic from the application VPCs is billed to each application account. The CFO requires that the data processing charges for traffic from on premises also appear on each destination application account's own line items in the CUR, not only in a showback report. The network team wants the least effort and no additional tooling.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany possède une passerelle AWS Transit Gateway dotée d'un attachement de passerelle Direct Connect, et 50 comptes d'applications possèdent des attachements de VPC à celle-ci. Chaque jour, des utilisateurs sur site téléchargent de gros jeux de données depuis les VPC d'applications et y chargent des résultats.

    L'équipe réseau a constaté que le traitement des données de la passerelle de transit pour le trafic venant du site est facturé au compte réseau, tandis que le trafic venant des VPC d'applications est facturé à chaque compte d'application. Le directeur financier exige que les frais de traitement des données du trafic venant du site apparaissent aussi sur les propres lignes du CUR de chaque compte d'application de destination, et pas seulement dans un rapport de showback. L'équipe réseau veut le moins d'effort possible et aucun outillage supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In the network account, create a metering policy for the transit gateway with an entry that matches the Direct Connect gateway attachment type as the source and charges the destination attachment owner.", fr: "Dans le compte réseau, créer pour la passerelle de transit une politique de mesure (metering policy) avec une entrée qui fait correspondre le type d'attachement de passerelle Direct Connect comme source et facture le propriétaire de l'attachement de destination." } }
    - { id: b, text: { en: "Enable transit gateway flow logs, and build an Amazon Athena report that allocates the network account's data processing charges to the destination VPC owners.", fr: "Activer les journaux de flux de la passerelle de transit, et construire un rapport Amazon Athena qui répartit les frais de traitement des données du compte réseau entre les propriétaires des VPC de destination." } }
    - { id: c, text: { en: "Create a cost category split charge rule that allocates the network account's data processing charges to the application accounts in proportion to their spend.", fr: "Créer une règle de répartition des frais de catégorie de coûts qui répartit les frais de traitement des données du compte réseau entre les comptes d'applications au prorata de leurs dépenses." } }
    - { id: d, text: { en: "Tag each VPC attachment with the CostCenter of its application, activate the tag as a cost allocation tag, and group the network account's data processing charges by that tag.", fr: "Baliser chaque attachement de VPC avec le CostCenter de son application, activer la balise comme balise de répartition des coûts, et regrouper les frais de traitement des données du compte réseau par cette balise." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, transit gateway data processing is charged to the owner of the source attachment, which is the network account for traffic from the Direct Connect gateway. Flexible cost allocation lets the transit gateway owner create a metering policy whose ordered entries match attachment types, IDs, or CIDR blocks and charge the source owner, the destination owner, or the transit gateway owner. A rule for Direct Connect gateway sources that charges the destination owner moves those charges to each application account's own bill.
    fr: |
      Par défaut, le traitement des données de la passerelle de transit est facturé au propriétaire de l'attachement source, c'est-à-dire au compte réseau pour le trafic venant de la passerelle Direct Connect. La répartition flexible des coûts permet au propriétaire de la passerelle de transit de créer une politique de mesure dont les entrées ordonnées font correspondre des types d'attachements, des ID ou des blocs CIDR et facturent le propriétaire source, le propriétaire de destination ou le propriétaire de la passerelle de transit. Une règle pour les sources de type passerelle Direct Connect qui facture le propriétaire de destination déplace ces frais sur la facture propre de chaque compte d'application.
  options:
    b: { en: "A flow-log report is additional tooling and only produces a showback; the charges stay on the network account's line items.", fr: "Un rapport basé sur les journaux de flux est un outillage supplémentaire et ne produit qu'un showback ; les frais restent sur les lignes du compte réseau." }
    c: { en: "Split charges appear only on the cost category details page; they do not change the CUR, so the charges stay on the network account.", fr: "La répartition des frais n'apparaît que sur la page de détails de la catégorie de coûts ; elle ne modifie pas le CUR : les frais restent sur le compte réseau." }
    d: { en: "Traffic from on premises is metered on the Direct Connect gateway attachment, so VPC attachment tags do not apply to it, and tags only categorize costs that remain on the network account.", fr: "Le trafic venant du site est mesuré sur l'attachement de passerelle Direct Connect : les balises des attachements de VPC ne s'y appliquent pas, et les balises ne font que catégoriser des coûts qui restent sur le compte réseau." }
references:
  - title: Flexible cost allocation
    url: https://docs.aws.amazon.com/vpc/latest/tgw/metering-policy.html
  - title: AWS Transit Gateway pricing
    url: https://aws.amazon.com/transit-gateway/pricing/
