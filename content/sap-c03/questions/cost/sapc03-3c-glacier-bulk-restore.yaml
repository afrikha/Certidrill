id: sapc03-3c-glacier-bulk-restore
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany keeps 300 TB of raw sensor recordings in the S3 Glacier Flexible Retrieval storage class. The data science team must reprocess all of the recordings with a new algorithm. The reprocessing cluster will be ready in 24 hours, and the restored copies are needed for 7 days. The objects are between 100 MB and 5 GB, and the restore must be started for millions of objects without writing scripts. The company wants the lowest retrieval cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conserve 300 To d'enregistrements bruts de capteurs dans la classe de stockage S3 Glacier Flexible Retrieval. L'équipe de science des données doit retraiter tous les enregistrements avec un nouvel algorithme. Le cluster de retraitement sera prêt dans 24 heures, et les copies restaurées sont nécessaires pendant 7 jours. Les objets font entre 100 Mo et 5 Go, et la restauration doit être lancée pour des millions d'objets sans écrire de scripts. L'entreprise veut le coût de récupération le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use S3 Batch Operations to start a restore with the Expedited retrieval tier for 7 days, after purchasing provisioned capacity units.", fr: "Utiliser S3 Batch Operations pour lancer une restauration avec le niveau de récupération Expedited pendant 7 jours, après avoir acheté des unités de capacité provisionnée." }
    - id: b
      text: { en: "Use S3 Batch Operations to start a restore with the Standard retrieval tier for 7 days.", fr: "Utiliser S3 Batch Operations pour lancer une restauration avec le niveau de récupération Standard pendant 7 jours." }
    - id: c
      text: { en: "Use S3 Batch Operations to start a restore with the Bulk retrieval tier for 7 days.", fr: "Utiliser S3 Batch Operations pour lancer une restauration avec le niveau de récupération Bulk pendant 7 jours." }
    - id: d
      text: { en: "Add an S3 Lifecycle rule that transitions the objects to S3 Glacier Instant Retrieval, then read them directly from the cluster.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les objets dans S3 Glacier Instant Retrieval, puis les lire directement depuis le cluster." }
answer: { optionId: c }
explanation:
  correct:
    en: "Bulk retrievals from S3 Glacier Flexible Retrieval complete in 5 to 12 hours, well within the 24 hours available, and they are free for this storage class. S3 Batch Operations starts the restore for every object in a manifest without custom scripts."
    fr: "Les récupérations Bulk depuis S3 Glacier Flexible Retrieval se terminent en 5 à 12 heures, bien dans les 24 heures disponibles, et elles sont gratuites pour cette classe de stockage. S3 Batch Operations lance la restauration de chaque objet d'un manifeste sans script personnalisé."
  options:
    a:
      en: "Expedited retrievals and provisioned capacity are premium options for restores needed within minutes; they cost the most and the 24-hour window does not need them."
      fr: "Les récupérations Expedited et la capacité provisionnée sont des options premium pour des restaurations nécessaires en quelques minutes : elles coûtent le plus cher et la fenêtre de 24 heures n'en a pas besoin."
    b:
      en: "Standard retrievals complete in hours but are charged per GB and per request for Glacier Flexible Retrieval, whereas Bulk is free and still fast enough."
      fr: "Les récupérations Standard se terminent en quelques heures mais sont facturées au Go et à la requête pour Glacier Flexible Retrieval, alors que Bulk est gratuit et reste assez rapide."
    d:
      en: "S3 Lifecycle cannot transition objects from Glacier Flexible Retrieval to Glacier Instant Retrieval; the supported transitions from this class go only to Glacier Deep Archive."
      fr: "S3 Lifecycle ne peut pas faire passer des objets de Glacier Flexible Retrieval vers Glacier Instant Retrieval : les transitions prises en charge depuis cette classe vont uniquement vers Glacier Deep Archive."
references:
  - title: Understanding archive retrieval options
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
