id: sapc03-3a-semantic-cache-valkey
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's customer support chatbot calls a foundation model in Amazon Bedrock for every question and receives about 1 million questions each day. An analysis shows that 40% of the questions are rewordings of about 2,000 common questions, such as different ways to ask how to reset a password, and they receive the same answers. The approved answers change at most once a week. Cached answers must expire automatically so that outdated answers are not served after an update. The company wants to stop invoking the model for questions that are semantically equivalent to questions already answered, and cached answers must be returned in milliseconds.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Le chatbot de support client d'AnyCompany appelle un modèle de fondation dans Amazon Bedrock pour chaque question et reçoit environ 1 million de questions par jour. Une analyse montre que 40 % des questions reformulent environ 2 000 questions courantes, par exemple différentes façons de demander comment réinitialiser un mot de passe, et qu'elles reçoivent les mêmes réponses. Les réponses validées changent au plus une fois par semaine. Les réponses en cache doivent expirer automatiquement pour qu'aucune réponse obsolète ne soit servie après une mise à jour. L'entreprise veut cesser d'appeler le modèle pour les questions sémantiquement équivalentes à des questions déjà traitées, et les réponses en cache doivent être renvoyées en quelques millisecondes.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Store each answer in an Amazon DynamoDB table keyed by a hash of the exact question text with a 7-day TTL, and call the model only when the hash is not found."
        fr: "Stocker chaque réponse dans une table Amazon DynamoDB dont la clé est un hachage du texte exact de la question avec une durée de vie (TTL) de 7 jours, et n'appeler le modèle que si le hachage est introuvable."
    - id: b
      text:
        en: "Store question embeddings and answers in an Amazon ElastiCache for Valkey vector index with a 7-day TTL, and return a cached answer when a similar question is found."
        fr: "Stocker les embeddings des questions et les réponses dans un index vectoriel Amazon ElastiCache for Valkey avec une TTL de 7 jours, et renvoyer une réponse en cache lorsqu'une question similaire est trouvée."
    - id: c
      text:
        en: "Enable prompt caching with a cache checkpoint after the system prompt so that every question reuses the cached instructions at the lower cache-read rate."
        fr: "Activer la mise en cache des prompts avec un point de contrôle de cache après le prompt système pour que chaque question réutilise les instructions en cache au tarif réduit de lecture."
    - id: d
      text:
        en: "Place an Amazon CloudFront distribution in front of the chatbot API, and cache the POST responses of the API for 7 days at the edge locations."
        fr: "Placer une distribution Amazon CloudFront devant l'API du chatbot, et mettre en cache pendant 7 jours dans les emplacements périphériques les réponses aux requêtes POST de l'API."
answer: { optionId: b }
explanation:
  correct:
    en: "A semantic cache compares the vector embedding of a new question with cached questions and reuses the answer when they are similar enough, so rewordings of common questions no longer reach the model. ElastiCache for Valkey provides low-latency vector search with real-time updates and built-in TTL and eviction, which fits a hot set of answers that changes weekly."
    fr: "Un cache sémantique compare l'embedding vectoriel d'une nouvelle question aux questions en cache et réutilise la réponse lorsqu'elles sont suffisamment proches : les reformulations des questions courantes n'atteignent plus le modèle. ElastiCache for Valkey offre une recherche vectorielle à faible latence avec mises à jour en temps réel, ainsi qu'une TTL et une éviction intégrées, ce qui convient à un ensemble de réponses chaudes qui change chaque semaine."
  options:
    a:
      en: "An exact-match key finds only identical wording, so the reworded questions, which are the 40% to remove, would still invoke the model."
      fr: "Une clé à correspondance exacte ne trouve qu'une formulation identique : les questions reformulées, qui représentent les 40 % à supprimer, appelleraient toujours le modèle."
    c:
      en: "Prompt caching lowers the cost of repeated input tokens, but the model is still invoked and generates output for every question."
      fr: "La mise en cache des prompts réduit le coût des jetons d'entrée répétés, mais le modèle est toujours appelé et génère une sortie pour chaque question."
    d:
      en: "CloudFront does not cache responses to POST requests, and the questions are free text that would never produce matching cache keys."
      fr: "CloudFront ne met pas en cache les réponses aux requêtes POST, et les questions sont du texte libre qui ne produirait jamais de clés de cache identiques."
references:
  - title: "Why ElastiCache for Valkey for semantic caching"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/semantic-caching-why-elasticache.html
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
