id: sapc03-3b-geo-cris-us-quota
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a customer-support assistant in us-east-1. The assistant invokes a foundation model in Amazon Bedrock with on-demand pricing, and its requests are throttled during peak hours.

    Customer contracts require that prompts and responses be processed only in AWS Regions in the United States. To get more capacity, an architect proposes deploying a second copy of the application stack in us-west-2, replicating its Amazon DynamoDB session table and its Amazon S3 attachments to us-west-2, and splitting traffic with Amazon Route 53. The company wants more inference throughput with the lowest additional cost and the fewest changes.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un assistant de support client dans us-east-1. L'assistant appelle un modèle de fondation d'Amazon Bedrock avec la tarification à la demande, et ses requêtes sont limitées (throttling) aux heures de pointe.

    Les contrats clients exigent que les invites (prompts) et les réponses ne soient traitées que dans des Régions AWS des États-Unis. Pour obtenir plus de capacité, un architecte propose de déployer une deuxième copie de la pile applicative dans us-west-2, de répliquer vers us-west-2 sa table de sessions Amazon DynamoDB et ses pièces jointes Amazon S3, et de répartir le trafic avec Amazon Route 53. L'entreprise veut plus de débit d'inférence avec le coût supplémentaire le plus bas et le moins de changements possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the second application stack in us-west-2 as proposed, with DynamoDB global tables, S3 Cross-Region Replication, and Route 53 weighted routing.", fr: "Déployer la deuxième pile applicative dans us-west-2 comme proposé, avec les tables globales DynamoDB, S3 Cross-Region Replication et un routage pondéré Route 53." } }
    - { id: b, text: { en: "Keep the application in us-east-1, and invoke the model through the US geographic cross-Region inference profile instead of the in-Region model ID.", fr: "Conserver l'application dans us-east-1, et appeler le modèle par le profil d'inférence entre Régions géographique US au lieu de l'ID du modèle dans la Région." } }
    - { id: c, text: { en: "Keep the application in us-east-1, and invoke the model through the global cross-Region inference profile instead of the in-Region model ID.", fr: "Conserver l'application dans us-east-1, et appeler le modèle par le profil d'inférence entre Régions global au lieu de l'ID du modèle dans la Région." } }
    - { id: d, text: { en: "Keep the application in us-east-1, and purchase Provisioned Throughput for the model that is sized for the peak-hour demand.", fr: "Conserver l'application dans us-east-1, et acheter du débit provisionné (Provisioned Throughput) pour le modèle, dimensionné pour la demande aux heures de pointe." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A geographic cross-Region inference profile lets Amazon Bedrock route each request to a Region inside the chosen geography, here only US Regions, which adds throughput without moving the application. There is no additional routing cost: the price is that of the source Region from which the profile is called. The application and its data stay in us-east-1, so nothing has to be replicated.
    fr: |
      Un profil d'inférence entre Régions géographique permet à Amazon Bedrock d'acheminer chaque requête vers une Région de la géographie choisie, ici uniquement des Régions des États-Unis, ce qui ajoute du débit sans déplacer l'application. Le routage n'entraîne aucun coût supplémentaire : le prix est celui de la Région source depuis laquelle le profil est appelé. L'application et ses données restent dans us-east-1 : rien n'a besoin d'être répliqué.
  options:
    a: { en: "A second stack doubles compute, adds replicated writes and inter-Region transfer for the session and attachment data, and requires routing changes, which is the most expensive way to get capacity.", fr: "Une deuxième pile double le calcul, ajoute des écritures répliquées et du transfert entre Régions pour les données de session et les pièces jointes, et impose des changements de routage : c'est la façon la plus coûteuse d'obtenir de la capacité." }
    c: { en: "A global profile can route requests to any supported commercial Region worldwide, which breaks the US-only processing requirement.", fr: "Un profil global peut acheminer les requêtes vers n'importe quelle Région commerciale prise en charge dans le monde, ce qui viole l'exigence de traitement uniquement aux États-Unis." }
    d: { en: "Provisioned Throughput is billed for the reserved capacity whether or not it is used, so paying for peak capacity all day costs more than on-demand requests routed across US Regions.", fr: "Le débit provisionné est facturé pour la capacité réservée, qu'elle soit utilisée ou non : payer la capacité de pointe toute la journée coûte plus cher que des requêtes à la demande acheminées entre Régions des États-Unis." }
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
  - title: Geographic cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/geographic-cross-region-inference.html
