id: sapc03-3c-budget-new-account-forecast
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany created a new AWS account two weeks ago for a data analytics project that has a monthly budget of $20,000. The project team created an AWS Budgets cost budget with a single alert on forecasted cost at 100%, but the alert has never fired, even though actual spend already exceeds $15,000 this month. The team learns that forecasts need about five weeks of usage history. The project manager must be emailed this month when spend approaches and then reaches the budget. The solution must be simple and must not require custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé il y a deux semaines un nouveau compte AWS pour un projet d'analyse de données dont le budget mensuel est de 20 000 $. L'équipe du projet a créé un budget de coûts AWS Budgets avec une seule alerte sur le coût prévu à 100 %, mais l'alerte ne s'est jamais déclenchée, alors que les dépenses réelles dépassent déjà 15 000 $ ce mois-ci. L'équipe apprend que les prévisions nécessitent environ cinq semaines d'historique d'utilisation. Le chef de projet doit recevoir un e-mail ce mois-ci lorsque les dépenses approchent puis atteignent le budget. La solution doit être simple et ne doit nécessiter aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Cost Anomaly Detection monitor for the account with a daily summary to the project manager.", fr: "Créer un moniteur AWS Cost Anomaly Detection pour le compte avec un résumé quotidien envoyé au chef de projet." }
    - id: b
      text: { en: "Add alerts on actual cost at 80% and 100% of the budget, with the project manager as an email recipient.", fr: "Ajouter des alertes sur le coût réel à 80 % et 100 % du budget, avec le chef de projet comme destinataire e-mail." }
    - id: c
      text: { en: "Change the budget period from monthly to quarterly so that the forecast has a longer period to evaluate.", fr: "Faire passer la période du budget de mensuelle à trimestrielle pour que la prévision dispose d'une période plus longue à évaluer." }
    - id: d
      text: { en: "Export the Cost and Usage Report to Amazon S3 and schedule an Amazon Athena query that emails the daily total.", fr: "Exporter le Cost and Usage Report vers Amazon S3 et planifier une requête Amazon Athena qui envoie le total quotidien par e-mail." }
answer: { optionId: b }
explanation:
  correct:
    en: "Forecast-based alerts do not trigger until AWS has about five weeks of usage data. Alerts on actual cost do not depend on history: an 80% alert warns when spend approaches the budget and a 100% alert when it is reached, and each alert can email up to 10 recipients."
    fr: "Les alertes basées sur les prévisions ne se déclenchent pas tant qu'AWS ne dispose pas d'environ cinq semaines de données d'utilisation. Les alertes sur le coût réel ne dépendent pas de l'historique : une alerte à 80 % prévient quand les dépenses approchent du budget et une alerte à 100 % quand il est atteint, et chaque alerte peut envoyer un e-mail à 10 destinataires au maximum."
  options:
    a:
      en: "Cost Anomaly Detection compares spend with an expected pattern, needs history before it detects anomalies, and does not alert at a fixed $20,000 limit."
      fr: "Cost Anomaly Detection compare les dépenses à un profil attendu, a besoin d'historique avant de détecter des anomalies et n'alerte pas à une limite fixe de 20 000 $."
    c:
      en: "A longer period does not create the missing usage history, and a quarterly budget no longer tracks the monthly $20,000 limit."
      fr: "Une période plus longue ne crée pas l'historique d'utilisation manquant, et un budget trimestriel ne suit plus la limite mensuelle de 20 000 $."
    d:
      en: "Scheduling a query and sending its result by email requires custom code and does not compare spend with the budget thresholds."
      fr: "Planifier une requête et en envoyer le résultat par e-mail nécessite du code personnalisé et ne compare pas les dépenses aux seuils du budget."
references:
  - title: Best practices for AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-best-practices.html
