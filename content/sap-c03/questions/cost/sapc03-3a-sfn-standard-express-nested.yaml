id: sapc03-3a-sfn-standard-express-nested
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany processes insurance claims with one AWS Step Functions Standard workflow per claim. Each workflow first waits for a human adjuster's decision, which can take up to 5 days, by using the callback pattern with a task token. After approval, the workflow runs about 40 short, idempotent steps that validate the claim, enrich it and write the results to Amazon DynamoDB, and these steps finish in less than 30 seconds. The company processes 2 million claims each month, and the state transitions of the 40 short steps account for most of the Step Functions bill. The approval step must remain durable and auditable. The company wants to keep all the steps orchestrated by Step Functions with per-step retries, rather than moving the logic into application code.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany traite les sinistres d'assurance avec un flux de travail AWS Step Functions Standard par sinistre. Chaque flux de travail attend d'abord la décision d'un expert, qui peut prendre jusqu'à 5 jours, à l'aide du modèle de rappel avec un jeton de tâche (task token). Après approbation, le flux de travail exécute une quarantaine d'étapes courtes et idempotentes qui valident le sinistre, l'enrichissent et écrivent les résultats dans Amazon DynamoDB, et ces étapes se terminent en moins de 30 secondes. L'entreprise traite 2 millions de sinistres par mois, et les transitions d'état des 40 étapes courtes représentent l'essentiel de la facture Step Functions. L'étape d'approbation doit rester durable et auditable. L'entreprise veut que toutes les étapes restent orchestrées par Step Functions avec des nouvelles tentatives par étape, plutôt que de déplacer la logique dans le code applicatif.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Recreate the whole state machine as an Express workflow, and keep the task token callback for the adjuster's decision."
        fr: "Recréer toute la machine d'état sous forme de flux de travail Express, et conserver le rappel par jeton de tâche pour la décision de l'expert."
    - id: b
      text:
        en: "Keep the Standard workflow, and replace the 40 steps with a single AWS Lambda function that runs them in sequence and handles retries in code."
        fr: "Conserver le flux de travail Standard, et remplacer les 40 étapes par une seule fonction AWS Lambda qui les exécute à la suite et gère les nouvelles tentatives dans le code."
    - id: c
      text:
        en: "Keep the Standard workflow for the approval, and run the 40 short steps in an Express workflow that it starts as a nested execution."
        fr: "Conserver le flux Standard pour l'approbation, et exécuter les 40 étapes courtes dans un flux Express qu'il démarre comme exécution imbriquée."
    - id: d
      text:
        en: "Keep the Standard workflow, and run the 40 short steps in a Distributed Map state whose child workflow executions use the STANDARD execution type."
        fr: "Conserver le flux de travail Standard, et exécuter les 40 étapes courtes dans un état Distributed Map dont les exécutions de flux de travail enfants utilisent le type d'exécution STANDARD."
answer: { optionId: c }
explanation:
  correct:
    en: "Standard workflows are billed per state transition and support long waits with task tokens, while Express workflows are billed by number of executions, duration and memory and suit short, idempotent, high-volume steps. AWS recommends combining them: a Standard parent keeps the durable, auditable approval, and a nested Express workflow runs the short steps where checkpointing is not needed, which removes most of the per-transition charges."
    fr: "Les flux de travail Standard sont facturés par transition d'état et prennent en charge les longues attentes avec des jetons de tâche, tandis que les flux Express sont facturés selon le nombre d'exécutions, la durée et la mémoire, et conviennent aux étapes courtes, idempotentes et à fort volume. AWS recommande de les combiner : un parent Standard conserve l'approbation durable et auditable, et un flux Express imbriqué exécute les étapes courtes qui n'ont pas besoin de points de contrôle, ce qui supprime l'essentiel des frais par transition."
  options:
    a:
      en: "Express workflows run for at most five minutes and do not support the callback (.waitForTaskToken) pattern, so they cannot wait up to 5 days for the adjuster."
      fr: "Les flux Express durent au maximum cinq minutes et ne prennent pas en charge le modèle de rappel (.waitForTaskToken) : ils ne peuvent pas attendre l'expert jusqu'à 5 jours."
    b:
      en: "A single function moves orchestration and retries into application code, which the company explicitly wants to avoid."
      fr: "Une fonction unique déplace l'orchestration et les nouvelles tentatives dans le code applicatif, ce que l'entreprise veut explicitement éviter."
    d:
      en: "Distributed Map targets large parallel datasets, and STANDARD child executions are still billed per state transition, so the cost of the 40 steps does not go down."
      fr: "Distributed Map vise les grands jeux de données parallèles, et les exécutions enfants STANDARD restent facturées par transition d'état : le coût des 40 étapes ne baisse donc pas."
references:
  - title: "Choosing workflow type in Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
  - title: "AWS Step Functions Express Workflows"
    url: https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/step-functions-workflows.html
