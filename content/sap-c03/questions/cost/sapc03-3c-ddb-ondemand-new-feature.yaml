id: sapc03-3c-ddb-ondemand-new-feature
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is launching a new loyalty feature for its mobile app in three countries. The feature stores member events in a new Amazon DynamoDB table. Product managers cannot predict adoption: traffic could stay near zero for hours and then jump to thousands of requests per second after a marketing push. The team has no time to forecast capacity or tune scaling policies before launch. The company wants to pay only for the requests that the table actually serves.

    Which configuration will meet these requirements?
  fr: |
    AnyCompany lance une nouvelle fonctionnalité de fidélité pour son application mobile dans trois pays. La fonctionnalité stocke les événements des membres dans une nouvelle table Amazon DynamoDB. Les chefs de produit ne peuvent pas prévoir l'adoption : le trafic pourrait rester proche de zéro pendant des heures puis bondir à des milliers de requêtes par seconde après une campagne marketing. L'équipe n'a pas le temps de prévoir la capacité ni d'ajuster des politiques de mise à l'échelle avant le lancement. L'entreprise veut payer uniquement les requêtes que la table traite réellement.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Provisioned capacity mode with auto scaling between a low minimum and a high maximum of read and write capacity units.", fr: "Mode de capacité provisionnée avec mise à l'échelle automatique entre un minimum bas et un maximum élevé d'unités de capacité de lecture et d'écriture." }
    - id: b
      text: { en: "Provisioned capacity mode sized for the expected peak, with DynamoDB reserved capacity purchased for that peak.", fr: "Mode de capacité provisionnée dimensionné pour le pic attendu, avec de la capacité réservée DynamoDB achetée pour ce pic." }
    - id: c
      text: { en: "Provisioned capacity mode with the DynamoDB Standard-Infrequent Access table class and a low fixed capacity.", fr: "Mode de capacité provisionnée avec la classe de table DynamoDB Standard-Infrequent Access et une faible capacité fixe." }
    - id: d
      text: { en: "On-demand capacity mode with the DynamoDB Standard table class.", fr: "Mode de capacité à la demande avec la classe de table DynamoDB Standard." }
answer: { optionId: d }
explanation:
  correct:
    en: "On-demand mode is pay-per-request: there is no read or write capacity to specify, and the table scales with traffic, which suits a new workload with unknown and spiky demand. AWS presents it as the default and recommended throughput option for most DynamoDB workloads."
    fr: "Le mode à la demande est facturé à la requête : aucune capacité de lecture ou d'écriture n'est à définir, et la table s'adapte au trafic, ce qui convient à une nouvelle charge à la demande inconnue et en pics. AWS le présente comme l'option de débit par défaut et recommandée pour la plupart des charges DynamoDB."
  options:
    a:
      en: "Provisioned mode bills the provisioned capacity per hour, not the requests served, and the team would still have to choose limits and scaling targets that it cannot forecast."
      fr: "Le mode provisionné facture la capacité provisionnée à l'heure, pas les requêtes traitées, et l'équipe devrait encore choisir des limites et des cibles de mise à l'échelle qu'elle ne peut pas prévoir."
    b:
      en: "Provisioning and reserving capacity for a guessed peak means paying for that capacity even when traffic stays near zero, for a commitment of at least one year."
      fr: "Provisionner et réserver de la capacité pour un pic estimé revient à payer cette capacité même lorsque le trafic reste proche de zéro, avec un engagement d'au moins un an."
    c:
      en: "A low fixed capacity throttles requests during marketing pushes, and Standard-IA helps only when storage dominates the cost of a table."
      fr: "Une faible capacité fixe limite les requêtes pendant les campagnes marketing, et Standard-IA n'aide que lorsque le stockage domine le coût d'une table."
references:
  - title: DynamoDB throughput capacity
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html
