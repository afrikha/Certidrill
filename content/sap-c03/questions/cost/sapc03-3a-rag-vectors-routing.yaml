id: sapc03-3a-rag-vectors-routing
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an internal knowledge assistant on Amazon Bedrock Knowledge Bases. The knowledge base stores about 60 million document chunks in an Amazon OpenSearch Serverless vector collection, and the assistant receives about 300 queries per hour. Retrieval latency below one second is acceptable, and the assistant does not use hybrid search, aggregations or faceted search. Every prompt is sent to Amazon Nova Pro, but an evaluation shows that most prompts are simple English lookups that Amazon Nova Lite answers equally well. The company wants to reduce the cost of the assistant with minimal impact on answer quality.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exploite un assistant de connaissances interne sur Amazon Bedrock Knowledge Bases. La base de connaissances stocke environ 60 millions de segments de documents dans une collection vectorielle Amazon OpenSearch Serverless, et l'assistant reçoit environ 300 requêtes par heure. Une latence de récupération inférieure à une seconde est acceptable, et l'assistant n'utilise ni recherche hybride, ni agrégations, ni recherche à facettes. Chaque invite est envoyée à Amazon Nova Pro, mais une évaluation montre que la plupart des invites sont de simples recherches en anglais auxquelles Amazon Nova Lite répond aussi bien. L'entreprise veut réduire le coût de l'assistant avec un impact minimal sur la qualité des réponses.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Rebuild the knowledge base with an Amazon S3 Vectors vector index as its vector store."
        fr: "Reconstruire la base de connaissances avec un index vectoriel Amazon S3 Vectors comme magasin de vecteurs."
    - id: b
      text:
        en: "Purchase Provisioned Throughput for Amazon Nova Pro with a 6-month commitment, and send all prompts to the provisioned model."
        fr: "Acheter du Provisioned Throughput pour Amazon Nova Pro avec un engagement de 6 mois, et envoyer toutes les invites au modèle provisionné."
    - id: c
      text:
        en: "Send all prompts to Amazon Nova Pro with the priority service tier so that each answer is generated faster."
        fr: "Envoyer toutes les invites à Amazon Nova Pro avec le niveau de service priority pour que chaque réponse soit générée plus vite."
    - id: d
      text:
        en: "Create an Amazon Bedrock prompt router with Amazon Nova Lite and Amazon Nova Pro, use Nova Lite as the fallback model, and send the prompts to the router."
        fr: "Créer un routeur d'invites Amazon Bedrock avec Amazon Nova Lite et Amazon Nova Pro, utiliser Nova Lite comme modèle de repli, et envoyer les invites au routeur."
    - id: e
      text:
        en: "Increase the number of retrieved chunks per query so that the model needs fewer follow-up questions from users."
        fr: "Augmenter le nombre de segments récupérés par requête pour que le modèle ait besoin de moins de questions de suivi de la part des utilisateurs."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "S3 Vectors is cost-optimized vector storage with pay-for-what-you-use pricing and subsecond queries, ideal when queries are infrequent, and Bedrock Knowledge Bases can use a vector index as its vector store. Intelligent prompt routing sends each English prompt to the model in the same family that is predicted to answer well, so with Nova Lite as the fallback, Nova Pro is used only when its predicted quality is clearly better."
    fr: "S3 Vectors est un stockage vectoriel optimisé en coûts, facturé à l'usage, avec des requêtes en moins d'une seconde, idéal lorsque les requêtes sont peu fréquentes, et Bedrock Knowledge Bases peut utiliser un index vectoriel comme magasin de vecteurs. Le routage intelligent des invites envoie chaque invite en anglais au modèle de la même famille qui devrait bien y répondre : avec Nova Lite comme modèle de repli, Nova Pro n'est utilisé que lorsque sa qualité prévue est nettement meilleure."
  options:
    b:
      en: "Provisioned Throughput is billed every hour for model units and keeps every prompt on the more expensive model, which does not fit 300 queries per hour."
      fr: "Le Provisioned Throughput est facturé chaque heure par unité de modèle et maintient chaque invite sur le modèle le plus cher, ce qui ne convient pas à 300 requêtes par heure."
    c:
      en: "The priority tier is billed at a premium over Standard, so it increases cost without any quality gain."
      fr: "Le niveau priority est facturé avec une majoration par rapport au niveau Standard : il augmente le coût sans aucun gain de qualité."
    e:
      en: "More retrieved chunks add input tokens to every prompt, which increases the inference cost."
      fr: "Davantage de segments récupérés ajoutent des jetons d'entrée à chaque invite, ce qui augmente le coût d'inférence."
references:
  - title: "Working with S3 Vectors and vector buckets"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
  - title: "Understanding intelligent prompt routing in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
