id: sapc03-3a-standard-ri-graviton-move
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany bought 3-year Standard Reserved Instances with Partial Upfront payment 16 months ago for 40 m5.2xlarge Linux instances in the us-east-1 Region. The reservations have regional scope and were bought at list price without a volume discount. Within 2 months, the company will move this workload to m7g Graviton instances in us-east-1, and during the following year it will refactor part of it into AWS Lambda functions. Last year, the account's root user registered the company as a seller in the Reserved Instance Marketplace with a US bank account. The company wants to stop paying for reservations that it will no longer use. It also wants a discount on the new usage that keeps applying while the workload shifts between EC2 instance families and Lambda.

    Which solution will meet these requirements?
  fr: |
    Il y a 16 mois, AnyCompany a acheté des Standard Reserved Instances sur 3 ans avec paiement Partial Upfront pour 40 instances Linux m5.2xlarge dans la Région us-east-1. Les réservations ont une portée régionale et ont été achetées au prix catalogue, sans remise sur volume. D'ici 2 mois, l'entreprise migrera cette charge de travail vers des instances Graviton m7g dans us-east-1, puis, au cours de l'année suivante, en refactorisera une partie en fonctions AWS Lambda. L'an dernier, l'utilisateur root du compte a enregistré l'entreprise comme vendeur sur le Reserved Instance Marketplace avec un compte bancaire américain. L'entreprise veut cesser de payer des réservations qu'elle n'utilisera plus. Elle veut aussi une remise sur la nouvelle utilisation qui continue de s'appliquer pendant que la charge de travail passe d'une famille d'instances EC2 à Lambda.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Exchange the Standard Reserved Instances for Convertible Reserved Instances for the m7g family after the migration, and buy Convertible Reserved Instances for any remaining value."
        fr: "Échanger les Standard Reserved Instances contre des Convertible Reserved Instances pour la famille m7g après la migration, et acheter des Convertible Reserved Instances pour la valeur restante."
    - id: b
      text:
        en: "Modify the Standard Reserved Instances to the m7g family and an equivalent instance size after the migration, and buy an EC2 Instance Savings Plan for the Lambda usage."
        fr: "Modifier les Standard Reserved Instances vers la famille m7g et une taille d'instance équivalente après la migration, et acheter un EC2 Instance Savings Plan pour l'utilisation Lambda."
    - id: c
      text:
        en: "Keep the Standard Reserved Instances, and rely on instance size flexibility of regional reservations to apply the discount to the m7g instances after the migration."
        fr: "Conserver les Standard Reserved Instances, et compter sur la flexibilité de taille d'instance des réservations régionales pour appliquer la remise aux instances m7g après la migration."
    - id: d
      text:
        en: "List the Standard Reserved Instances in the Reserved Instance Marketplace after the migration, and buy a Compute Savings Plan sized to the new m7g and Lambda usage."
        fr: "Mettre en vente les Standard Reserved Instances sur le Reserved Instance Marketplace après la migration, et acheter un Compute Savings Plan dimensionné sur la nouvelle utilisation m7g et Lambda."
answer: { optionId: d }
explanation:
  correct:
    en: "Standard Reserved Instances that have been active for at least 30 days, have more than one month left and were not bought with a volume discount can be sold in the Reserved Instance Marketplace by a registered seller. A Compute Savings Plan then discounts EC2 usage in any instance family, including Graviton, and Lambda usage, so it follows the workload through the refactoring."
    fr: "Les Standard Reserved Instances actives depuis au moins 30 jours, auxquelles il reste plus d'un mois et qui n'ont pas été achetées avec une remise sur volume peuvent être vendues sur le Reserved Instance Marketplace par un vendeur enregistré. Un Compute Savings Plan remise ensuite l'utilisation EC2 de toute famille d'instances, Graviton compris, ainsi que l'utilisation Lambda : il suit donc la charge de travail pendant la refactorisation."
  options:
    a:
      en: "Only Convertible Reserved Instances can be exchanged; Standard Reserved Instances can only be modified or sold."
      fr: "Seules les Convertible Reserved Instances peuvent être échangées ; les Standard Reserved Instances peuvent seulement être modifiées ou vendues."
    b:
      en: "Modifying a Standard Reserved Instance cannot change its instance family, and an EC2 Instance Savings Plan applies only to EC2 usage, never to Lambda."
      fr: "La modification d'une Standard Reserved Instance ne peut pas changer sa famille d'instances, et un EC2 Instance Savings Plan ne s'applique qu'à l'utilisation EC2, jamais à Lambda."
    c:
      en: "Instance size flexibility applies only to other sizes of the same instance family, so m5 reservations do not cover m7g instances and would keep being paid for nothing."
      fr: "La flexibilité de taille d'instance ne s'applique qu'aux autres tailles de la même famille : des réservations m5 ne couvrent pas les instances m7g et continueraient d'être payées pour rien."
references:
  - title: "Sell Reserved Instances for Amazon EC2 in the Reserved Instance Marketplace"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ri-market-general.html
  - title: "Exchange Convertible Reserved Instances"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ri-convertible-exchange.html
