id: sapc03-3b-bedrock-app-profiles-tenants
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sells a multi-tenant SaaS product. One backend service, which runs under a single IAM role, serves 200 tenants and calls a foundation model in Amazon Bedrock on demand through the US geographic cross-Region inference profile. The service knows the tenant ID of every request.

    For chargeback, finance needs the Bedrock cost of each tenant in AWS Cost Explorer, where it groups costs by tag, and in the CUR 2.0 export. The requests must keep using cross-Region routing within the US. The engineering team wants the least custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany vend un produit SaaS multilocataire. Un seul service backend, qui s'exécute sous un unique rôle IAM, sert 200 locataires et appelle à la demande un modèle de fondation d'Amazon Bedrock par le profil d'inférence entre Régions géographique US. Le service connaît l'ID du locataire de chaque requête.

    Pour la refacturation, la finance a besoin du coût Bedrock de chaque locataire dans AWS Cost Explorer, où elle regroupe les coûts par balise, et dans l'export CUR 2.0. Les requêtes doivent continuer à utiliser le routage entre Régions aux États-Unis. L'équipe d'ingénierie veut le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Tag the backend IAM role with a tenant tag, activate it as a cost allocation tag, and add IAM principal data to the CUR 2.0 export.", fr: "Baliser le rôle IAM du backend avec une balise tenant, l'activer comme balise de répartition des coûts, et ajouter les données de principal IAM à l'export CUR 2.0." } }
    - { id: b, text: { en: "Create an application inference profile per tenant from the US cross-Region profile, tag it with the tenant ID, and invoke the model with that profile's ARN.", fr: "Créer un profil d'inférence d'application par locataire à partir du profil entre Régions US, le baliser avec l'ID du locataire, et appeler le modèle avec l'ARN de ce profil." } }
    - { id: c, text: { en: "Pass the tenant ID in the request metadata, enable model invocation logging, and compute each tenant's cost from the logged token counts in Amazon Athena.", fr: "Transmettre l'ID du locataire dans les métadonnées de la requête, activer la journalisation des appels de modèles, et calculer le coût de chaque locataire à partir des jetons journalisés dans Amazon Athena." } }
    - { id: d, text: { en: "Create one AWS account per tenant, deploy a copy of the backend service in each account, and report the Bedrock costs grouped by linked account.", fr: "Créer un compte AWS par locataire, déployer une copie du service backend dans chaque compte, et présenter les coûts Bedrock regroupés par compte lié." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An application inference profile can be created from a cross-Region (system-defined) profile, so it keeps the same model and US routing while adding the company's own tags. Tags attached to application inference profiles track the cost of on-demand invocations through cost allocation tags, which appear in Cost Explorer and in the CUR. The only code change is to choose the tenant's profile ARN as the model ID of each request.
    fr: |
      Un profil d'inférence d'application peut être créé à partir d'un profil entre Régions (défini par le système) : il conserve le même modèle et le même routage aux États-Unis tout en ajoutant les balises de l'entreprise. Les balises attachées aux profils d'inférence d'application suivent le coût des appels à la demande par les balises de répartition des coûts, qui apparaissent dans Cost Explorer et dans le CUR. Le seul changement de code consiste à choisir l'ARN du profil du locataire comme ID de modèle de chaque requête.
  options:
    a: { en: "All 200 tenants are served by one role, so the role's tags give every call the same tag value, and Cost Explorer cannot group the cost by tenant.", fr: "Les 200 locataires sont servis par un seul rôle : les balises du rôle donnent la même valeur de balise à chaque appel, et Cost Explorer ne peut pas regrouper le coût par locataire." }
    c: { en: "Invocation logs contain token counts, but turning them into costs is custom code that must track prices, and the result is not a tag dimension in Cost Explorer.", fr: "Les journaux d'appels contiennent les nombres de jetons, mais les transformer en coûts est du code personnalisé qui doit suivre les prix, et le résultat n'est pas une dimension de balise dans Cost Explorer." }
    d: { en: "Running 200 copies of the backend in 200 accounts multiplies infrastructure and operations for a reporting need.", fr: "Exécuter 200 copies du backend dans 200 comptes multiplie l'infrastructure et l'exploitation pour un besoin de rapport." }
references:
  - title: Set up a model invocation resource using inference profiles
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles.html
  - title: Using IAM principal for cost allocation
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/iam-principal-cost-allocation.html
