id: sapc03-3b-central-interface-endpoints
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 150 spoke VPCs in eu-central-1 that are attached to an AWS Transit Gateway. Each spoke VPC contains interface VPC endpoints for the same 12 AWS services (for example AWS STS, AWS Systems Manager, AWS KMS, Amazon ECR, and Amazon CloudWatch Logs) in three Availability Zones, with private DNS enabled.

    Each endpoint carries only a few GB per month, so endpoint hourly charges dominate the networking bill. The security team accepts one shared endpoint policy per service. Workloads must keep using the default AWS service DNS names without any code or configuration change.

    Which combination of steps will reduce the cost the MOST while meeting these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose de 150 VPC spoke dans eu-central-1, attachés à une passerelle AWS Transit Gateway. Chaque VPC spoke contient des points de terminaison de VPC d'interface pour les mêmes 12 services AWS (par exemple AWS STS, AWS Systems Manager, AWS KMS, Amazon ECR et Amazon CloudWatch Logs) dans trois zones de disponibilité, avec le DNS privé activé.

    Chaque point de terminaison ne transporte que quelques Go par mois : les frais horaires des points de terminaison dominent donc la facture réseau. L'équipe de sécurité accepte une seule politique de point de terminaison partagée par service. Les charges de travail doivent continuer à utiliser les noms DNS par défaut des services AWS, sans aucune modification de code ou de configuration.

    Quelle combinaison d'étapes réduit le PLUS le coût tout en respectant ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the 12 interface endpoints once in a shared services VPC on the transit gateway, with private DNS disabled, and delete the spoke endpoints.", fr: "Créer une seule fois les 12 points de terminaison d'interface dans un VPC de services partagés relié à la passerelle de transit, avec le DNS privé désactivé, et supprimer ceux des spokes." } }
    - { id: b, text: { en: "Replace the interface endpoints in each spoke VPC with gateway endpoints for the same 12 services, and remove the interface endpoints.", fr: "Remplacer les points de terminaison d'interface de chaque VPC spoke par des points de terminaison de passerelle pour les mêmes 12 services, et supprimer les points de terminaison d'interface." } }
    - { id: c, text: { en: "Enable private DNS on the shared endpoints so that the spoke VPCs resolve the default service names to them through the transit gateway.", fr: "Activer le DNS privé sur les points de terminaison partagés pour que les VPC spoke résolvent les noms de services par défaut vers ceux-ci par la passerelle de transit." } }
    - { id: d, text: { en: "Create a Route 53 private hosted zone for each service name with an alias record to the shared endpoint, and associate the zones with every spoke VPC.", fr: "Créer une zone hébergée privée Route 53 pour chaque nom de service avec un enregistrement d'alias vers le point de terminaison partagé, et associer les zones à chaque VPC spoke." } }
    - { id: e, text: { en: "Create Route 53 Resolver inbound endpoints in every spoke VPC, and forward the default service names to the shared services VPC resolver.", fr: "Créer des points de terminaison entrants Route 53 Resolver dans chaque VPC spoke, et transférer les noms de services par défaut vers le résolveur du VPC de services partagés." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Interface endpoints are billed for every hour in every Availability Zone, so 150 VPCs × 12 services × 3 AZs is replaced by 12 × 3 when the endpoints are centralized. The extra transit gateway processing is small because each endpoint carries only a few GB. Private DNS on an endpoint works only inside its own VPC, so private hosted zones with alias records, associated with each spoke, keep the default service names resolving to the shared endpoints without changes in the workloads.
    fr: |
      Les points de terminaison d'interface sont facturés chaque heure dans chaque zone de disponibilité : centraliser remplace 150 VPC × 12 services × 3 AZ par 12 × 3. Le traitement supplémentaire de la passerelle de transit est faible car chaque point de terminaison ne transporte que quelques Go. Le DNS privé d'un point de terminaison ne fonctionne qu'à l'intérieur de son propre VPC : des zones hébergées privées avec des enregistrements d'alias, associées à chaque spoke, maintiennent la résolution des noms par défaut vers les points de terminaison partagés sans modification des charges de travail.
  options:
    b: { en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB, not for services such as AWS STS, AWS KMS, or Systems Manager.", fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB, pas pour des services comme AWS STS, AWS KMS ou Systems Manager." }
    c: { en: "The private hosted zone that private DNS creates works only within the VPC that contains the endpoint, so the spoke VPCs would not resolve to it.", fr: "La zone hébergée privée créée par le DNS privé ne fonctionne que dans le VPC qui contient le point de terminaison : les VPC spoke ne s'y résoudraient pas." }
    e: { en: "Resolver inbound endpoints serve queries that come from outside a VPC, such as on premises; they add hourly charges in every spoke without being needed when the zones are associated.", fr: "Les points de terminaison entrants Resolver servent les requêtes venant de l'extérieur d'un VPC, par exemple sur site ; ils ajoutent des frais horaires dans chaque spoke sans être nécessaires quand les zones sont associées." }
references:
  - title: Centralized access to VPC private endpoints
    url: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-access-to-vpc-private-endpoints.html
  - title: AWS PrivateLink Pricing
    url: https://aws.amazon.com/privatelink/pricing/
