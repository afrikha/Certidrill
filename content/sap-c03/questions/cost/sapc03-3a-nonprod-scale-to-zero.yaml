id: sapc03-3a-nonprod-scale-to-zero
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has development and test environments in 40 AWS accounts. Each environment contains Amazon ECS services on AWS Fargate and Amazon EC2 Auto Scaling groups, and each one is deployed from an AWS CloudFormation template. Developers use the environments only on weekdays between 07:00 and 19:00 local time, but the resources run around the clock. The environments must be ready when developers start work. The company wants to cut the cost of these environments automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'environnements de développement et de test dans 40 comptes AWS. Chaque environnement contient des services Amazon ECS sur AWS Fargate et des groupes Amazon EC2 Auto Scaling, et chacun est déployé à partir d'un modèle AWS CloudFormation. Les développeurs n'utilisent les environnements qu'en semaine entre 07:00 et 19:00 heure locale, mais les ressources tournent en permanence. Les environnements doivent être prêts lorsque les développeurs commencent à travailler. L'entreprise veut réduire automatiquement le coût de ces environnements, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Move every ECS service to the FARGATE_SPOT capacity provider and every Auto Scaling group to Spot Instances, and keep the current capacity settings."
        fr: "Déplacer tous les services ECS vers le fournisseur de capacité FARGATE_SPOT et tous les groupes Auto Scaling vers des Spot Instances, et conserver les paramètres de capacité actuels."
    - id: b
      text:
        en: "Purchase a 1-year Compute Savings Plan that covers the around-the-clock compute usage of the 40 development and test environments."
        fr: "Acheter un Compute Savings Plan sur 1 an qui couvre l'utilisation de calcul continue des 40 environnements de développement et de test."
    - id: c
      text:
        en: "Apply the AWS Compute Optimizer recommendations to downsize the Fargate tasks and EC2 instances of every environment each month."
        fr: "Appliquer chaque mois les recommandations d'AWS Compute Optimizer pour réduire la taille des tâches Fargate et des instances EC2 de chaque environnement."
    - id: d
      text:
        en: "Add recurring scheduled actions to the templates that scale the ECS services and Auto Scaling groups to zero at 19:00 and back at 06:45 on weekdays."
        fr: "Ajouter aux modèles des actions planifiées récurrentes qui réduisent les services ECS et les groupes Auto Scaling à zéro à 19:00 et les rétablissent à 06:45 en semaine."
answer: { optionId: d }
explanation:
  correct:
    en: "Application Auto Scaling scheduled actions for ECS services and EC2 Auto Scaling scheduled actions change minimum and maximum capacity at set times with recurring cron schedules and a time zone. Scaling to zero outside working hours removes half of the weekday hours and all weekend hours, and adding the actions to the templates deploys them everywhere without extra tooling."
    fr: "Les actions planifiées d'Application Auto Scaling pour les services ECS et celles d'EC2 Auto Scaling modifient la capacité minimale et maximale à des heures fixées, avec des planifications cron récurrentes et un fuseau horaire. Réduire à zéro en dehors des heures de travail supprime environ la moitié des heures de semaine et toutes les heures du week-end, et ajouter les actions aux modèles les déploie partout sans outil supplémentaire."
  options:
    a:
      en: "Spot capacity lowers the price per hour, but the resources still run all night and all weekend while nobody uses them."
      fr: "La capacité Spot réduit le prix horaire, mais les ressources tournent toujours toute la nuit et tout le week-end alors que personne ne les utilise."
    b:
      en: "A Savings Plan discounts the idle hours instead of removing them, and it commits the company to paying for usage that should stop."
      fr: "Un Savings Plan applique une remise aux heures inutilisées au lieu de les supprimer, et engage l'entreprise à payer une utilisation qui devrait s'arrêter."
    c:
      en: "Rightsizing reduces the size of each resource but keeps it running outside working hours, and monthly manual changes add operational work."
      fr: "Le dimensionnement adapté réduit la taille de chaque ressource mais la laisse tourner en dehors des heures de travail, et des modifications manuelles mensuelles ajoutent du travail d'exploitation."
references:
  - title: "Scheduled scaling for Application Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-scheduled-scaling.html
  - title: "Scheduled scaling for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html
