id: sapc03-3b-eks-split-labels
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's platform account runs shared Amazon EKS clusters on EC2 worker nodes for 30 application teams. Pods from different teams run on the same nodes, and every pod carries the Kubernetes labels team and cost-center.

    Finance wants to charge each team for the share of the node costs that its pods use, based on the pods' CPU and memory, in the organization's CUR 2.0 export. The platform team does not want to change the cluster design or operate additional cost tooling.

    Which solution will meet these requirements?
  fr: |
    Le compte plateforme d'AnyCompany exécute des clusters Amazon EKS partagés sur des nœuds de travail EC2 pour 30 équipes applicatives. Les pods de différentes équipes s'exécutent sur les mêmes nœuds, et chaque pod porte les étiquettes Kubernetes team et cost-center.

    La finance veut refacturer à chaque équipe la part des coûts des nœuds qu'utilisent ses pods, selon leur processeur et leur mémoire, dans l'export CUR 2.0 de l'organisation. L'équipe plateforme ne veut ni changer la conception des clusters ni exploiter d'outils de coûts supplémentaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Tag each EC2 worker node with the team that runs the most pods on it, and activate the team tag as a cost allocation tag in the management account.", fr: "Baliser chaque nœud de travail EC2 avec l'équipe qui y exécute le plus de pods, et activer la balise team comme balise de répartition des coûts dans le compte de gestion." } }
    - { id: b, text: { en: "Create a dedicated managed node group for each team, tag each node group with the team name, and activate that tag as a cost allocation tag.", fr: "Créer un groupe de nœuds gérés dédié à chaque équipe, baliser chaque groupe de nœuds avec le nom de l'équipe, et activer cette balise comme balise de répartition des coûts." } }
    - { id: c, text: { en: "Turn on split cost allocation data for Amazon EKS, activate the imported team and cost-center labels as cost allocation tags, and include the data in the CUR 2.0 export.", fr: "Activer les données de répartition fractionnée des coûts pour Amazon EKS, activer les étiquettes team et cost-center importées comme balises de répartition des coûts, et inclure ces données dans l'export CUR 2.0." } }
    - { id: d, text: { en: "Deploy a self-managed cost monitoring tool in each cluster that collects pod metrics and writes per-team cost reports to an Amazon S3 bucket.", fr: "Déployer dans chaque cluster un outil de suivi des coûts autogéré qui collecte les métriques des pods et écrit des rapports de coûts par équipe dans un compartiment Amazon S3." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Split cost allocation data adds Kubernetes pod-level line items to the CUR, computed from each pod's share of the EC2 instance's CPU and memory and the instance's amortized cost. Pod labels are imported automatically as user-defined cost allocation tags, and they must be activated in the management account. The export must be configured to include split cost allocation data, and no change to the clusters is required.
    fr: |
      Les données de répartition fractionnée des coûts ajoutent au CUR des lignes au niveau des pods Kubernetes, calculées à partir de la part du processeur et de la mémoire de l'instance EC2 qu'utilise chaque pod et du coût amorti de l'instance. Les étiquettes des pods sont importées automatiquement comme balises de répartition des coûts définies par l'utilisateur, et doivent être activées dans le compte de gestion. L'export doit être configuré pour inclure ces données, et aucun changement des clusters n'est nécessaire.
  options:
    a: { en: "A node runs pods of several teams, so tagging it with one team charges that team for capacity that other teams use.", fr: "Un nœud exécute des pods de plusieurs équipes : le baliser avec une seule équipe facture à celle-ci une capacité qu'utilisent d'autres équipes." }
    b: { en: "Dedicated node groups change the cluster design and usually lower node utilization, which raises total cost.", fr: "Des groupes de nœuds dédiés changent la conception des clusters et réduisent généralement l'utilisation des nœuds, ce qui augmente le coût total." }
    d: { en: "A self-managed tool is additional cost tooling to operate in every cluster, and its reports are not in the CUR 2.0 export.", fr: "Un outil autogéré est un outillage de coûts supplémentaire à exploiter dans chaque cluster, et ses rapports ne sont pas dans l'export CUR 2.0." }
references:
  - title: Using Kubernetes labels for cost allocation in EKS
    url: https://docs.aws.amazon.com/cur/latest/userguide/split-cost-allocation-data-kubernetes-labels.html
  - title: Understanding split cost allocation data
    url: https://docs.aws.amazon.com/cur/latest/userguide/split-cost-allocation-data.html
