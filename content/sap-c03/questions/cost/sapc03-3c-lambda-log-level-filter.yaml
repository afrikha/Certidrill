id: sapc03-3c-lambda-log-level-filter
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 300 AWS Lambda functions written in Python, deployed with AWS SAM templates in 12 accounts. The functions use the standard Python logging module through the Lambda runtime logger, do not set a log level in code, and emit large numbers of DEBUG and INFO messages in production. The functions use the default plain text log format. Amazon CloudWatch Logs ingestion for these functions has become a top-five cost item. The company wants production functions to send only WARN and more severe application messages, while keeping the platform START and REPORT lines used by dashboards, without changing function code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 300 fonctions AWS Lambda écrites en Python, déployées avec des modèles AWS SAM dans 12 comptes. Les fonctions utilisent le module de journalisation Python standard via le journaliseur du runtime Lambda, ne définissent pas de niveau de journalisation dans le code, et émettent de grandes quantités de messages DEBUG et INFO en production. Les fonctions utilisent le format de journal texte brut par défaut. L'ingestion Amazon CloudWatch Logs de ces fonctions est devenue l'un des cinq premiers postes de coût. L'entreprise veut que les fonctions de production n'envoient que les messages applicatifs WARN et plus graves, tout en conservant les lignes de plateforme START et REPORT utilisées par les tableaux de bord, sans modifier le code des fonctions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "In the SAM templates, set the log format of the production functions to JSON and the application log level to WARN, keeping the system log level at INFO.", fr: "Dans les modèles SAM, définir le format de journal des fonctions de production sur JSON et le niveau de journalisation applicatif sur WARN, en gardant le niveau de journalisation système sur INFO." }
    - id: b
      text: { en: "In the SAM templates, keep the text log format and set the system log level of the production functions to WARN.", fr: "Dans les modèles SAM, garder le format de journal texte et définir le niveau de journalisation système des fonctions de production sur WARN." }
    - id: c
      text: { en: "Add a subscription filter to each log group with a pattern that forwards only WARN, ERROR, and FATAL messages to a central log group, and set the original log groups to a 1-day retention.", fr: "Ajouter à chaque groupe de journaux un filtre d'abonnement avec un modèle qui ne transmet que les messages WARN, ERROR et FATAL vers un groupe de journaux central, et définir une rétention de 1 jour sur les groupes d'origine." }
    - id: d
      text: { en: "Create an account-level CloudWatch Logs data protection policy that masks DEBUG and INFO messages in the Lambda log groups.", fr: "Créer une politique de protection des données CloudWatch Logs au niveau du compte qui masque les messages DEBUG et INFO dans les groupes de journaux Lambda." }
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda log-level filtering requires the JSON log format; with it, the application log level drops messages below the chosen level before they are sent to CloudWatch Logs, so they are never ingested. Supported runtime loggers need no code change, and a system log level of INFO keeps the START and REPORT platform lines."
    fr: "Le filtrage par niveau de journalisation Lambda exige le format de journal JSON : avec lui, le niveau applicatif écarte les messages inférieurs au niveau choisi avant leur envoi à CloudWatch Logs, ils ne sont donc jamais ingérés. Les journaliseurs des runtimes pris en charge ne demandent aucune modification de code, et un niveau système INFO conserve les lignes de plateforme START et REPORT."
  options:
    b:
      en: "Log-level filtering works only with the JSON log format, and the system log level controls Lambda platform messages, not application messages; WARN would even drop the START and REPORT lines."
      fr: "Le filtrage par niveau ne fonctionne qu'avec le format de journal JSON, et le niveau système contrôle les messages de plateforme Lambda, pas les messages applicatifs ; WARN supprimerait même les lignes START et REPORT."
    c:
      en: "Subscription filters act after the logs are ingested, so all DEBUG and INFO messages are still billed for ingestion, and the central log group adds a second ingestion charge."
      fr: "Les filtres d'abonnement agissent après l'ingestion des journaux : tous les messages DEBUG et INFO restent facturés à l'ingestion, et le groupe central ajoute un second coût d'ingestion."
    d:
      en: "Data protection policies mask sensitive data identifiers at ingestion; they do not drop messages by level and do not reduce the ingested volume."
      fr: "Les politiques de protection des données masquent des identifiants de données sensibles à l'ingestion : elles ne suppriment pas de messages selon leur niveau et ne réduisent pas le volume ingéré."
references:
  - title: Log-level filtering
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-log-level.html
