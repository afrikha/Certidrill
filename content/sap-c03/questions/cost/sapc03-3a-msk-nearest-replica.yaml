id: sapc03-3a-msk-nearest-replica
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon MSK cluster with brokers in three Availability Zones and a replication factor of 3. Consumer applications run on Amazon EC2 instances in Auto Scaling groups across the same three Availability Zones. Five consumer groups read every topic, so consumers read about five times the volume that producers write. Consumers fetch from partition leaders, which are usually in another Availability Zone, and inter-AZ data transfer has become the largest cost of the streaming platform. The company must keep the replication factor and the multi-AZ deployment of brokers and consumers.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un cluster Amazon MSK avec des brokers dans trois zones de disponibilité et un facteur de réplication de 3. Les applications consommatrices s'exécutent sur des instances Amazon EC2 de groupes Auto Scaling répartis sur les mêmes trois zones de disponibilité. Cinq groupes de consommateurs lisent chaque rubrique (topic) : les consommateurs lisent donc environ cinq fois le volume écrit par les producteurs. Les consommateurs lisent depuis les leaders de partition, qui se trouvent généralement dans une autre zone de disponibilité, et le transfert de données entre zones est devenu le premier coût de la plateforme de streaming. L'entreprise doit conserver le facteur de réplication et le déploiement multi-AZ des brokers et des consommateurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Reduce the replication factor of the topics to 1 so that brokers stop copying partitions to other Availability Zones."
        fr: "Réduire à 1 le facteur de réplication des rubriques pour que les brokers cessent de copier les partitions vers d'autres zones de disponibilité."
    - id: b
      text:
        en: "Enable rack-aware replica selection on the cluster, and set each consumer's client.rack to the ID of its Availability Zone."
        fr: "Activer la sélection de réplicas tenant compte des racks sur le cluster, et définir le client.rack de chaque consommateur sur l'ID de sa zone de disponibilité."
    - id: c
      text:
        en: "Move all consumer Auto Scaling groups to the Availability Zone that hosts the most partition leaders."
        fr: "Déplacer tous les groupes Auto Scaling de consommateurs dans la zone de disponibilité qui héberge le plus de leaders de partition."
    - id: d
      text:
        en: "Place a Network Load Balancer with cross-zone load balancing turned off in front of the brokers, and point the consumers to the load balancer."
        fr: "Placer un Network Load Balancer avec l'équilibrage de charge entre zones désactivé devant les brokers, et diriger les consommateurs vers l'équilibreur de charge."
answer: { optionId: b }
explanation:
  correct:
    en: "With rack awareness, a consumer that sets client.rack can read from the nearest replica instead of the partition leader. AWS recommends setting client.rack to the AZ ID to minimize network traffic costs and latency, so each consumer reads from a replica in its own Availability Zone while replication and the multi-AZ layout stay unchanged."
    fr: "Avec la prise en compte des racks, un consommateur qui définit client.rack peut lire depuis le réplica le plus proche plutôt que depuis le leader de partition. AWS recommande de définir client.rack sur l'ID de zone de disponibilité pour réduire au minimum les coûts de trafic réseau et la latence : chaque consommateur lit alors un réplica de sa propre zone, tandis que la réplication et la répartition multi-AZ restent inchangées."
  options:
    a:
      en: "A replication factor of 1 removes the redundancy that the company must keep, and consumers would still read leaders in other zones."
      fr: "Un facteur de réplication de 1 supprime la redondance que l'entreprise doit conserver, et les consommateurs liraient toujours des leaders dans d'autres zones."
    c:
      en: "Consumers in one Availability Zone break the multi-AZ requirement, and partitions led in the other zones would still be read across zones."
      fr: "Des consommateurs dans une seule zone de disponibilité enfreignent l'exigence multi-AZ, et les partitions dont le leader se trouve dans les autres zones seraient toujours lues entre zones."
    d:
      en: "Kafka clients connect to the specific broker that leads each partition, so a load balancer does not change which broker serves the fetches."
      fr: "Les clients Kafka se connectent au broker précis qui est leader de chaque partition : un équilibreur de charge ne change pas le broker qui sert les lectures."
references:
  - title: "Best practices for Apache Kafka clients"
    url: https://docs.aws.amazon.com/msk/latest/developerguide/bestpractices-kafka-client.html
