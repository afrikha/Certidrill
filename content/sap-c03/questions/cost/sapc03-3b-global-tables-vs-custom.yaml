id: sapc03-3b-global-tables-vs-custom
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is building a loyalty-points service that must accept writes from users in Europe and Asia. The service will run active-active in eu-west-1 and ap-southeast-1, and each Region's application tier writes to a local Amazon DynamoDB table in on-demand capacity mode.

    Writes in one Region must be visible in the other Region within a few seconds, and last-writer-wins conflict resolution is acceptable. During design review, an engineer argues that DynamoDB global tables are expensive because of replication charges, and proposes two independent tables with a custom replication pipeline instead. The company wants the lowest total cost and the least operational overhead, and the application must keep using the DynamoDB API.

    Which solution will meet these requirements?
  fr: |
    AnyCompany construit un service de points de fidélité qui doit accepter des écritures d'utilisateurs en Europe et en Asie. Le service fonctionnera en actif-actif dans eu-west-1 et ap-southeast-1, et la couche applicative de chaque Région écrit dans une table Amazon DynamoDB locale en mode de capacité à la demande.

    Les écritures d'une Région doivent être visibles dans l'autre Région en quelques secondes, et une résolution des conflits de type « le dernier écrivain gagne » est acceptable. Lors de la revue de conception, un ingénieur affirme que les tables globales DynamoDB sont coûteuses à cause des frais de réplication, et propose à la place deux tables indépendantes avec un pipeline de réplication personnalisé. L'entreprise veut le coût total le plus bas et la charge opérationnelle la plus faible, et l'application doit continuer à utiliser l'API DynamoDB.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a DynamoDB global table in multi-Region eventual consistency (MREC) mode with replicas in eu-west-1 and ap-southeast-1.", fr: "Créer une table globale DynamoDB en mode de cohérence éventuelle multi-Régions (MREC) avec des réplicas dans eu-west-1 et ap-southeast-1." } }
    - { id: b, text: { en: "Create two tables, enable DynamoDB Streams on both, and use an AWS Lambda function in each Region that writes every change to the table in the other Region with a version attribute to resolve conflicts.", fr: "Créer deux tables, activer DynamoDB Streams sur les deux, et utiliser dans chaque Région une fonction AWS Lambda qui écrit chaque modification dans la table de l'autre Région avec un attribut de version pour résoudre les conflits." } }
    - { id: c, text: { en: "Create two tables, stream changes from each table to Amazon Kinesis Data Streams, and run consumers in the other Region that apply the changes to the local table.", fr: "Créer deux tables, diffuser les modifications de chaque table vers Amazon Kinesis Data Streams, et exécuter dans l'autre Région des consommateurs qui appliquent les modifications à la table locale." } }
    - { id: d, text: { en: "Migrate the data to an Amazon Aurora global database with the primary cluster in eu-west-1, and enable write forwarding on the secondary cluster in ap-southeast-1.", fr: "Migrer les données vers une base de données globale Amazon Aurora avec le cluster principal dans eu-west-1, et activer le transfert des écritures (write forwarding) sur le cluster secondaire de ap-southeast-1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Global tables bill replicated write units at the same price as single-Region write units, and DynamoDB charges no cross-Region data transfer fees for replication between the Regions of a global table. Any custom pipeline must also pay a write in the destination table, so it cannot be cheaper; it only adds compute, data transfer, and code. An MREC global table replicates typically within a second and uses last-writer-wins conflict resolution with no change to the DynamoDB API.
    fr: |
      Les tables globales facturent les unités d'écriture répliquée au même prix que les unités d'écriture d'une seule Région, et DynamoDB ne facture aucun transfert de données entre Régions pour la réplication entre les Régions d'une table globale. Tout pipeline personnalisé doit aussi payer une écriture dans la table de destination : il ne peut donc pas être moins cher, il ajoute seulement du calcul, du transfert de données et du code. Une table globale MREC réplique généralement en moins d'une seconde et applique la règle du dernier écrivain gagnant, sans changement de l'API DynamoDB.
  options:
    b: { en: "The destination writes cost the same as replicated writes, and the design adds Lambda charges, cross-Region data transfer, and conflict-handling code to operate.", fr: "Les écritures de destination coûtent autant que les écritures répliquées, et la conception ajoute des frais Lambda, du transfert de données entre Régions et du code de gestion des conflits à exploiter." }
    c: { en: "Kinesis shards, consumers, and cross-Region transfer come on top of the same destination writes, which raises both cost and operational overhead.", fr: "Les shards Kinesis, les consommateurs et le transfert entre Régions s'ajoutent aux mêmes écritures de destination, ce qui augmente à la fois le coût et la charge opérationnelle." }
    d: { en: "The application would have to leave the DynamoDB API, all writes would be committed in the primary Region, and Aurora adds replicated write I/O and cross-Region transfer charges.", fr: "L'application devrait abandonner l'API DynamoDB, toutes les écritures seraient validées dans la Région principale, et Aurora ajoute des frais d'E/S d'écriture répliquées et de transfert entre Régions." }
references:
  - title: Understanding Amazon DynamoDB billing for global tables
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/global-tables-billing.html
  - title: How DynamoDB global tables work
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
