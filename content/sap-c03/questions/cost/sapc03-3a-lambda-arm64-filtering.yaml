id: sapc03-3a-lambda-arm64-filtering
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany ingests vehicle data through an Amazon Kinesis data stream. An AWS Lambda function on the x86_64 architecture consumes the stream through an event source mapping. About 90% of the records are heartbeat messages that the function discards immediately after it reads their type field. The remaining records go through CPU-intensive transformations. The function is written in Python, and all its dependencies are pure Python packages or packages that publish arm64 builds. The company wants to reduce the Lambda cost of the pipeline without changing the business logic or the stream producers.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany ingère des données de véhicules via un flux de données Amazon Kinesis. Une fonction AWS Lambda sur l'architecture x86_64 consomme le flux via un mappage de source d'événements. Environ 90 % des enregistrements sont des messages de pulsation (heartbeat) que la fonction ignore immédiatement après avoir lu leur champ de type. Les autres enregistrements subissent des transformations gourmandes en processeur. La fonction est écrite en Python, et toutes ses dépendances sont des paquets Python purs ou des paquets qui publient des builds arm64. L'entreprise veut réduire le coût Lambda du pipeline sans modifier la logique métier ni les producteurs du flux.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure provisioned concurrency on the function to remove cold starts from the stream processing."
        fr: "Configurer une simultanéité provisionnée sur la fonction pour supprimer les démarrages à froid du traitement du flux."
    - id: b
      text:
        en: "Add filter criteria to the event source mapping so that only records whose type is not heartbeat invoke the function."
        fr: "Ajouter des critères de filtrage au mappage de source d'événements pour que seuls les enregistrements dont le type n'est pas heartbeat appellent la fonction."
    - id: c
      text:
        en: "Replace the Kinesis data stream with an Amazon SQS FIFO queue, and process the messages in groups of 10."
        fr: "Remplacer le flux de données Kinesis par une file d'attente Amazon SQS FIFO, et traiter les messages par groupes de 10."
    - id: d
      text:
        en: "Raise the function memory and timeout to their maximum values so that each invocation processes more records."
        fr: "Porter la mémoire et le délai d'expiration de la fonction à leurs valeurs maximales pour que chaque appel traite davantage d'enregistrements."
    - id: e
      text:
        en: "Rebuild the deployment package for arm64, test it, and switch the function to the arm64 architecture."
        fr: "Regénérer le package de déploiement pour arm64, le tester, puis passer la fonction à l'architecture arm64."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: "Event filtering on a Kinesis event source mapping skips records that match no filter, so the 90% heartbeat records no longer cause invocations or billed duration. The arm64 architecture runs on Graviton processors and offers better price performance for compute-intensive code, and the migration only needs a package rebuilt for arm64 because every dependency has an arm64 build."
    fr: "Le filtrage d'événements sur un mappage de source d'événements Kinesis ignore les enregistrements qui ne correspondent à aucun filtre : les 90 % de pulsations ne provoquent plus d'appels ni de durée facturée. L'architecture arm64 s'exécute sur des processeurs Graviton et offre un meilleur rapport prix/performances pour du code gourmand en calcul, et la migration ne demande qu'un package regénéré pour arm64, car chaque dépendance dispose d'un build arm64."
  options:
    a:
      en: "Provisioned concurrency adds a charge for keeping environments ready and does not reduce the number of records processed."
      fr: "La simultanéité provisionnée ajoute des frais pour maintenir des environnements prêts et ne réduit pas le nombre d'enregistrements traités."
    c:
      en: "Replacing the stream changes the producers, and FIFO batches of 10 records would increase the number of invocations."
      fr: "Remplacer le flux modifie les producteurs, et des lots FIFO de 10 enregistrements augmenteraient le nombre d'appels."
    d:
      en: "Maximum memory raises the price of every millisecond, and the timeout does not change how many records the event source mapping puts in a batch."
      fr: "La mémoire maximale augmente le prix de chaque milliseconde, et le délai d'expiration ne change pas le nombre d'enregistrements que le mappage place dans un lot."
references:
  - title: "Control which events Lambda sends to your Event Function"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
  - title: "Selecting and configuring an instruction set architecture for your Lambda function"
    url: https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html
