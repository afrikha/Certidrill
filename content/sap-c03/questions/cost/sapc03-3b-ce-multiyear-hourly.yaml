id: sapc03-3b-ce-multiyear-hourly
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's finance analysts use AWS Cost Explorer from the management account of the organization, and they do not write SQL. They have asked for two new views.

    First, they want monthly cost trends for the last 3 years in Cost Explorer. Second, when they investigate a cost spike, they want the hourly cost of each individual EC2 instance for the last 2 weeks. The FinOps team wants to meet both needs without building a data pipeline.

    Which solution will meet these requirements?
  fr: |
    Les analystes financiers d'AnyCompany utilisent AWS Cost Explorer depuis le compte de gestion de l'organisation, et ils n'écrivent pas de SQL. Ils ont demandé deux nouvelles vues.

    D'abord, ils veulent les tendances mensuelles des coûts des 3 dernières années dans Cost Explorer. Ensuite, lorsqu'ils analysent un pic de coûts, ils veulent le coût horaire de chaque instance EC2 sur les 2 dernières semaines. L'équipe FinOps veut répondre aux deux besoins sans construire de pipeline de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CUR 2.0 export with hourly granularity and resource IDs, and give the analysts saved Amazon Athena queries that cover both views.", fr: "Créer un export CUR 2.0 avec une granularité horaire et les ID de ressources, et fournir aux analystes des requêtes Amazon Athena enregistrées pour les deux vues." } }
    - { id: b, text: { en: "In the management account's Cost Management preferences, enable multi-year data at monthly granularity and hourly EC2-Instances resource-level data.", fr: "Dans les préférences Cost Management du compte de gestion, activer les données pluriannuelles à granularité mensuelle et les données horaires au niveau des ressources EC2-Instances." } }
    - { id: c, text: { en: "In each member account, enable resource-level data at daily granularity for Amazon EC2 in the Cost Management preferences of that account.", fr: "Dans chaque compte membre, activer les données au niveau des ressources à granularité quotidienne pour Amazon EC2 dans les préférences Cost Management de ce compte." } }
    - { id: d, text: { en: "Create a saved Cost Explorer report with a 36-month date range, and group the report by resource with the hourly granularity setting.", fr: "Créer un rapport Cost Explorer enregistré avec une plage de 36 mois, et regrouper le rapport par ressource avec le paramètre de granularité horaire." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      From the management account, Cost Management preferences can enable multi-year data at monthly granularity, which gives up to 38 months of history in Cost Explorer. The same preferences can enable EC2-Instances resource-level data at hourly granularity, which covers the past 14 days. Both views are then available in Cost Explorer without SQL or a pipeline; changes can take up to 48 hours to appear.
    fr: |
      Depuis le compte de gestion, les préférences Cost Management peuvent activer les données pluriannuelles à granularité mensuelle, ce qui donne jusqu'à 38 mois d'historique dans Cost Explorer. Les mêmes préférences peuvent activer les données au niveau des ressources EC2-Instances à granularité horaire, qui couvrent les 14 derniers jours. Les deux vues sont alors disponibles dans Cost Explorer sans SQL ni pipeline ; les changements peuvent mettre jusqu'à 48 heures à apparaître.
  options:
    a: { en: "Athena queries require SQL and a data pipeline, which the analysts do not want, and the data would not be in Cost Explorer.", fr: "Les requêtes Athena exigent du SQL et un pipeline de données, ce que les analystes ne veulent pas, et les données ne seraient pas dans Cost Explorer." }
    c: { en: "These settings are enabled from the management account, and daily granularity does not give the hourly cost of each instance.", fr: "Ces paramètres s'activent depuis le compte de gestion, et la granularité quotidienne ne donne pas le coût horaire de chaque instance." }
    d: { en: "A saved report cannot extend history beyond what the data settings provide, and hourly resource-level data covers only the last 14 days.", fr: "Un rapport enregistré ne peut pas étendre l'historique au-delà de ce que fournissent les paramètres de données, et les données horaires au niveau des ressources ne couvrent que les 14 derniers jours." }
references:
  - title: Configuring multi-year and granular data
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-configuring-data.html
