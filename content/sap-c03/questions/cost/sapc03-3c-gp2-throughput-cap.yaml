id: sapc03-3c-gp2-throughput-cap
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a search indexing service on 60 Amazon EC2 instances. Each instance has a 2 TiB General Purpose SSD (gp2) data volume. During nightly reindexing, each volume needs about 6,000 IOPS and 400 MiB/s for 3 hours, but CloudWatch shows that throughput never exceeds 250 MiB/s and the job overruns its window. An engineer proposes to double the size of every gp2 volume. The company wants the lowest-cost change that lets the job get the required performance, with no downtime.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un service d'indexation de recherche sur 60 instances Amazon EC2. Chaque instance possède un volume de données General Purpose SSD (gp2) de 2 Tio. Pendant la réindexation nocturne, chaque volume a besoin d'environ 6 000 IOPS et 400 Mio/s pendant 3 heures, mais CloudWatch montre que le débit ne dépasse jamais 250 Mio/s et que la tâche déborde de sa fenêtre. Un ingénieur propose de doubler la taille de chaque volume gp2. L'entreprise veut la modification la moins coûteuse qui permette à la tâche d'obtenir les performances requises, sans interruption de service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify each volume to General Purpose SSD (gp3) with 6,000 IOPS and 400 MiB/s of throughput by using Elastic Volumes.", fr: "Modifier chaque volume en General Purpose SSD (gp3) avec 6 000 IOPS et 400 Mio/s de débit à l'aide d'Elastic Volumes." }
    - id: b
      text: { en: "Increase each gp2 volume to 4 TiB by using Elastic Volumes so that its baseline performance doubles.", fr: "Augmenter chaque volume gp2 à 4 Tio à l'aide d'Elastic Volumes pour doubler ses performances de base." }
    - id: c
      text: { en: "Modify each volume to Provisioned IOPS SSD (io2) Block Express with 6,000 provisioned IOPS by using Elastic Volumes.", fr: "Modifier chaque volume en Provisioned IOPS SSD (io2) Block Express avec 6 000 IOPS provisionnées à l'aide d'Elastic Volumes." }
    - id: d
      text: { en: "Modify each volume to Throughput Optimized HDD (st1) by using Elastic Volumes, because st1 delivers up to 500 MiB/s.", fr: "Modifier chaque volume en Throughput Optimized HDD (st1) à l'aide d'Elastic Volumes, car st1 fournit jusqu'à 500 Mio/s." }
answer: { optionId: a }
explanation:
  correct:
    en: "A gp2 volume of 334 GiB or more is capped at 250 MiB/s whatever its size, so throughput is the bottleneck. gp3 decouples performance from size: 6,000 IOPS and 400 MiB/s can be provisioned on a 2 TiB volume (up to 0.25 MiB/s per IOPS), at a lower price per GiB than gp2, and the change happens online."
    fr: "Un volume gp2 de 334 Gio ou plus est plafonné à 250 Mio/s quelle que soit sa taille : le débit est le goulot d'étranglement. gp3 découple les performances de la taille : 6 000 IOPS et 400 Mio/s peuvent être provisionnés sur un volume de 2 Tio (jusqu'à 0,25 Mio/s par IOPS), à un prix au Gio inférieur à celui de gp2, et la modification se fait en ligne."
  options:
    b:
      en: "Doubling the size doubles gp2 IOPS and storage cost, but gp2 throughput stays capped at 250 MiB/s, so the job is still too slow."
      fr: "Doubler la taille double les IOPS gp2 et le coût de stockage, mais le débit gp2 reste plafonné à 250 Mio/s : la tâche reste trop lente."
    c:
      en: "io2 Block Express can deliver the performance, but its price per GiB and per provisioned IOPS is much higher than gp3 for a workload that does not need sub-millisecond latency."
      fr: "io2 Block Express peut fournir ces performances, mais son prix au Gio et par IOPS provisionnée est bien supérieur à gp3 pour une charge qui n'a pas besoin d'une latence inférieure à la milliseconde."
    d:
      en: "st1 is designed for large sequential I/O; a 2 TiB st1 volume has a baseline of about 80 MiB/s, and index updates need thousands of small random IOPS that HDD volumes do not provide."
      fr: "st1 est conçu pour des E/S séquentielles volumineuses : un volume st1 de 2 Tio a une base d'environ 80 Mio/s, et les mises à jour d'index exigent des milliers de petites IOPS aléatoires que les volumes HDD ne fournissent pas."
references:
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
  - title: Amazon EBS Throughput Optimized HDD and Cold HDD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html
