id: sapc03-3a-bedrock-prompt-caching
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany built an internal HR assistant on Amazon Bedrock with an Anthropic Claude model that supports prompt caching. Every request sends the same 40,000-token policy handbook in the system prompt, followed by one employee question, through the Converse API with on-demand inference. The handbook changes once a month. During business hours, the assistant receives about 20 requests per minute, and input tokens make up most of the monthly bill. The company wants to reduce the inference cost without changing the model or the quality of the answers.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé un assistant RH interne sur Amazon Bedrock avec un modèle Anthropic Claude qui prend en charge la mise en cache des prompts. Chaque requête envoie le même manuel des politiques de 40 000 jetons dans le prompt système, suivi d'une question d'employé, via l'API Converse avec l'inférence à la demande. Le manuel change une fois par mois. Pendant les heures de bureau, l'assistant reçoit environ 20 requêtes par minute, et les jetons d'entrée représentent l'essentiel de la facture mensuelle. L'entreprise veut réduire le coût d'inférence sans changer de modèle ni dégrader la qualité des réponses.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Place the employee question before the handbook in the prompt so that the model reads the question first, and shorten the maximum output tokens of each request."
        fr: "Placer la question de l'employé avant le manuel dans le prompt pour que le modèle lise d'abord la question, et réduire le nombre maximal de jetons de sortie de chaque requête."
    - id: b
      text:
        en: "Collect the questions in Amazon S3 and answer them every 15 minutes with an Amazon Bedrock batch inference job that includes the handbook in each record."
        fr: "Collecter les questions dans Amazon S3 et y répondre toutes les 15 minutes avec une tâche d'inférence par lots Amazon Bedrock qui inclut le manuel dans chaque enregistrement."
    - id: c
      text:
        en: "Purchase Provisioned Throughput with no commitment for the model during business hours, and delete it every evening."
        fr: "Acheter du Provisioned Throughput sans engagement pour le modèle pendant les heures de bureau, et le supprimer chaque soir."
    - id: d
      text:
        en: "Keep the handbook at the start of the system prompt, add a cache checkpoint right after it, and place the question after the checkpoint."
        fr: "Conserver le manuel au début du prompt système, ajouter un point de contrôle de cache juste après, et placer la question après ce point de contrôle."
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt caching stores an identical prompt prefix up to a cache checkpoint, and later requests that reuse that prefix are billed at the lower cache-read rate instead of the standard input rate. With about 20 requests per minute, each cache hit resets the default 5-minute TTL, so the handbook is written to the cache rarely and read from it on most requests."
    fr: "La mise en cache des prompts conserve un préfixe de prompt identique jusqu'à un point de contrôle de cache, et les requêtes suivantes qui réutilisent ce préfixe sont facturées au tarif réduit de lecture du cache au lieu du tarif d'entrée standard. Avec environ 20 requêtes par minute, chaque accès au cache réinitialise la durée de vie par défaut de 5 minutes : le manuel est donc rarement écrit dans le cache et lu depuis celui-ci pour la plupart des requêtes."
  options:
    a:
      en: "Putting the variable question first changes the prompt prefix on every request, which prevents any reuse of the handbook tokens, and limiting output tokens can truncate answers."
      fr: "Placer la question variable en premier modifie le préfixe du prompt à chaque requête, ce qui empêche toute réutilisation des jetons du manuel, et limiter les jetons de sortie peut tronquer les réponses."
    b:
      en: "Batch inference makes an interactive assistant wait up to 15 minutes, and prompt caching does not apply to batch inference, so every record still pays for the full handbook."
      fr: "L'inférence par lots fait attendre un assistant interactif jusqu'à 15 minutes, et la mise en cache des prompts ne s'applique pas à l'inférence par lots : chaque enregistrement paie toujours le manuel complet."
    c:
      en: "Provisioned Throughput adds an hourly charge for model units and does not reduce the number of input tokens that each request processes."
      fr: "Le Provisioned Throughput ajoute des frais horaires par unité de modèle et ne réduit pas le nombre de jetons d'entrée traités par chaque requête."
references:
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
