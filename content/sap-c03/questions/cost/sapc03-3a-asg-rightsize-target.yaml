id: sapc03-3a-asg-rightsize-target
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a stateless web tier on an Auto Scaling group of m6i.4xlarge instances behind an Application Load Balancer. The group uses a target tracking policy that keeps average CPU utilization at 25%. AWS Compute Optimizer, which receives memory metrics from the CloudWatch agent, reports the group as over-provisioned and recommends m6i.2xlarge. At the busiest hour of the past month, average CPU utilization of the group reached 40%. The application scales horizontally, and response times are well within the service level objective. The company wants to reduce the cost of the web tier while keeping enough headroom for unexpected traffic.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute un niveau web sans état sur un groupe Auto Scaling d'instances m6i.4xlarge derrière un Application Load Balancer. Le groupe utilise une politique de suivi de cible qui maintient l'utilisation moyenne du processeur à 25 %. AWS Compute Optimizer, qui reçoit les métriques de mémoire de l'agent CloudWatch, signale le groupe comme surprovisionné et recommande m6i.2xlarge. À l'heure la plus chargée du mois écoulé, l'utilisation moyenne du processeur du groupe a atteint 40 %. L'application évolue horizontalement, et les temps de réponse respectent largement l'objectif de niveau de service. L'entreprise veut réduire le coût du niveau web tout en conservant une marge suffisante pour un trafic imprévu.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Update the launch template to the recommended m6i.2xlarge instance type, and start an instance refresh of the Auto Scaling group."
        fr: "Mettre à jour le modèle de lancement avec le type d'instance recommandé m6i.2xlarge, et lancer une actualisation des instances (instance refresh) du groupe Auto Scaling."
    - id: b
      text:
        en: "Replace the target tracking policy with a simple scaling policy that adds one instance when average CPU utilization exceeds 25%."
        fr: "Remplacer la politique de suivi de cible par une politique de mise à l'échelle simple qui ajoute une instance lorsque l'utilisation moyenne du processeur dépasse 25 %."
    - id: c
      text:
        en: "Raise the target value of the target tracking policy from 25% to about 60% average CPU utilization."
        fr: "Relever la valeur cible de la politique de suivi de cible de 25 % à environ 60 % d'utilisation moyenne du processeur."
    - id: d
      text:
        en: "Set the minimum capacity of the group to the number of instances needed at the busiest hour to avoid scaling delays."
        fr: "Fixer la capacité minimale du groupe au nombre d'instances nécessaire à l'heure la plus chargée pour éviter les délais de mise à l'échelle."
    - id: e
      text:
        en: "Purchase 3-year zonal Reserved Instances for the current m6i.4xlarge instances in each Availability Zone of the group."
        fr: "Acheter des instances réservées zonales sur 3 ans pour les instances m6i.4xlarge actuelles dans chaque zone de disponibilité du groupe."
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Compute Optimizer found that a smaller instance type meets the measured CPU and memory needs, and an instance refresh replaces the instances with the new launch template. AWS recommends setting the target tracking value as high as possible while keeping a reasonable buffer, so a 60% target runs fewer instances than 25% and still leaves headroom for unexpected traffic."
    fr: "Compute Optimizer a déterminé qu'un type d'instance plus petit répond aux besoins mesurés en processeur et en mémoire, et une actualisation des instances les remplace avec le nouveau modèle de lancement. AWS recommande de fixer la valeur cible du suivi de cible aussi haut que possible tout en gardant une marge raisonnable : une cible de 60 % exécute moins d'instances qu'une cible de 25 % tout en laissant de la marge pour un trafic imprévu."
  options:
    b:
      en: "A simple scaling policy with the same 25% threshold keeps the same over-provisioning and reacts more slowly than target tracking."
      fr: "Une politique de mise à l'échelle simple avec le même seuil de 25 % conserve le même surprovisionnement et réagit plus lentement que le suivi de cible."
    d:
      en: "A minimum sized for the busiest hour keeps peak capacity running all the time, which increases cost."
      fr: "Une capacité minimale dimensionnée pour l'heure la plus chargée maintient la capacité de pointe en permanence, ce qui augmente le coût."
    e:
      en: "Reserving the current oversized instance type for 3 years locks in the over-provisioning instead of removing it."
      fr: "Réserver pour 3 ans le type d'instance actuel surdimensionné fige le surprovisionnement au lieu de le supprimer."
references:
  - title: "Target tracking scaling policies for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
  - title: "What is AWS Compute Optimizer?"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
