id: sapc03-3a-commitment-mix-fargate
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany operates a customer platform in the eu-west-1 and eu-central-1 Regions. A baseline of about 300 vCPUs runs 24 hours a day on Amazon EC2 M-family instances. During the next 18 months, the company will move most of these services to Amazon ECS on AWS Fargate, and it might shift capacity between the two Regions. On weekdays, customer-facing traffic adds an unpredictable peak of up to 200 vCPUs for a few hours, and these requests must not be interrupted. A separate fleet of stateless rendering workers pulls jobs from an Amazon SQS queue and can retry any job that stops. The company wants to minimize compute costs without exchanging or modifying commitments later.

    Which combination of purchase options will meet these requirements MOST cost-effectively? (Choose two.)
  fr: |
    AnyCompany exploite une plateforme client dans les Régions eu-west-1 et eu-central-1. Une charge de base d'environ 300 vCPU tourne 24 heures sur 24 sur des instances Amazon EC2 de la famille M. Au cours des 18 prochains mois, l'entreprise migrera la plupart de ces services vers Amazon ECS sur AWS Fargate et pourrait déplacer de la capacité entre les deux Régions. En semaine, le trafic client ajoute pendant quelques heures un pic imprévisible pouvant atteindre 200 vCPU, et ces requêtes ne doivent pas être interrompues. Une flotte distincte de workers de rendu sans état (stateless) récupère des tâches dans une file d'attente Amazon SQS et peut relancer toute tâche qui s'arrête. L'entreprise veut réduire au minimum les coûts de calcul sans avoir à échanger ni modifier d'engagements par la suite.

    Quelle combinaison d'options d'achat répond à ces exigences de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Purchase a 3-year Compute Savings Plan with an hourly commitment sized to the 24-hour baseline."
        fr: "Acheter un Compute Savings Plan sur 3 ans avec un engagement horaire dimensionné sur la charge de base 24 heures sur 24."
    - id: b
      text:
        en: "Purchase 3-year EC2 Instance Savings Plans for the M family in each Region, sized to the baseline plus the weekday peak."
        fr: "Acheter des EC2 Instance Savings Plans sur 3 ans pour la famille M dans chaque Région, dimensionnés sur la charge de base plus le pic de semaine."
    - id: c
      text:
        en: "Purchase a 3-year Compute Savings Plan with an hourly commitment sized to the baseline plus the weekday peak."
        fr: "Acheter un Compute Savings Plan sur 3 ans avec un engagement horaire dimensionné sur la charge de base plus le pic de semaine."
    - id: d
      text:
        en: "Run the rendering workers on Spot capacity, such as Fargate Spot or EC2 Spot Instances, and keep the weekday peak On-Demand."
        fr: "Exécuter les workers de rendu sur de la capacité Spot, comme Fargate Spot ou des instances Spot EC2, et laisser le pic de semaine à la demande."
    - id: e
      text:
        en: "Purchase 1-year Standard Reserved Instances for the rendering workers in each Region, and run the weekday peak on Spot Instances."
        fr: "Acheter des instances réservées standard sur 1 an pour les workers de rendu dans chaque Région, et exécuter le pic de semaine sur des instances Spot."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "A Compute Savings Plan applies to EC2 in any family and Region and also to Fargate, so a commitment sized to the steady baseline keeps applying through the move to ECS on Fargate and across Regions. Interruption-tolerant queue workers are the right fit for Spot capacity, and the short, unpredictable peak that must not be interrupted stays On-Demand."
    fr: "Un Compute Savings Plan s'applique à EC2 quelles que soient la famille et la Région ainsi qu'à Fargate : un engagement dimensionné sur la charge de base stable continue donc de s'appliquer pendant la migration vers ECS sur Fargate et entre Régions. Les workers de file d'attente qui tolèrent les interruptions conviennent à la capacité Spot, et le pic court et imprévisible qui ne doit pas être interrompu reste à la demande."
  options:
    b:
      en: "EC2 Instance Savings Plans are tied to one family in one Region and never cover Fargate, and sizing them to the peak leaves the commitment unused most hours."
      fr: "Les EC2 Instance Savings Plans sont liés à une famille dans une Région et ne couvrent jamais Fargate, et les dimensionner sur le pic laisse l'engagement inutilisé la plupart des heures."
    c:
      en: "The peak lasts only a few hours on weekdays; an hourly commitment that includes it is paid every hour, including nights and weekends, and is mostly wasted."
      fr: "Le pic ne dure que quelques heures en semaine ; un engagement horaire qui l'inclut est payé chaque heure, nuits et week-ends compris, et il est en grande partie perdu."
    e:
      en: "Reserved Instances commit to capacity for workers that could run on cheaper Spot capacity, and Spot Instances do not suit peak requests that must not be interrupted."
      fr: "Les instances réservées engagent de la capacité pour des workers qui pourraient tourner sur une capacité Spot moins chère, et les instances Spot ne conviennent pas aux requêtes de pic qui ne doivent pas être interrompues."
