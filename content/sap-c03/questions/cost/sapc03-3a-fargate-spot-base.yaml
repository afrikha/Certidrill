id: sapc03-3a-fargate-spot-base
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a video transcoding service as an Amazon ECS service on AWS Fargate. The tasks pull jobs from an Amazon SQS queue, and Application Auto Scaling adjusts the desired count from 6 to 60 tasks based on the queue backlog. A contract requires at least 6 tasks to keep processing at all times, even when spare capacity is scarce. Tasks above this minimum may be interrupted, because each task checkpoints its work and needs about 30 seconds to finish the current segment and return the job to the queue. The company wants to minimize compute costs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un service de transcodage vidéo sous forme de service Amazon ECS sur AWS Fargate. Les tâches récupèrent des travaux dans une file d'attente Amazon SQS, et Application Auto Scaling ajuste le nombre souhaité de 6 à 60 tâches selon l'arriéré de la file. Un contrat exige qu'au moins 6 tâches continuent de traiter en permanence, même lorsque la capacité disponible se raréfie. Les tâches au-delà de ce minimum peuvent être interrompues, car chaque tâche enregistre son travail par points de contrôle et a besoin d'environ 30 secondes pour terminer le segment en cours et remettre le travail dans la file. L'entreprise veut réduire au minimum les coûts de calcul.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a capacity provider strategy with FARGATE at base 6 and weight 1 and FARGATE_SPOT at weight 4, handle SIGTERM in the container, and set stopTimeout to 60 seconds."
        fr: "Utiliser une stratégie de fournisseurs de capacité avec FARGATE en base 6 et poids 1 et FARGATE_SPOT en poids 4, gérer SIGTERM dans le conteneur, et définir stopTimeout à 60 secondes."
    - id: b
      text:
        en: "Use a capacity provider strategy with FARGATE_SPOT only at base 6, handle SIGTERM in the container, and set stopTimeout to 60 seconds."
        fr: "Utiliser une stratégie de fournisseurs de capacité avec FARGATE_SPOT seul en base 6, gérer SIGTERM dans le conteneur, et définir stopTimeout à 60 secondes."
    - id: c
      text:
        en: "Use a capacity provider strategy with FARGATE only, and purchase a Compute Savings Plan whose hourly commitment is sized to the maximum of 60 tasks."
        fr: "Utiliser une stratégie de fournisseurs de capacité avec FARGATE seul, et acheter un Compute Savings Plan dont l'engagement horaire est dimensionné sur le maximum de 60 tâches."
    - id: d
      text:
        en: "Use a capacity provider strategy with FARGATE_SPOT at base 6 and weight 1 and FARGATE at weight 4, handle SIGTERM in the container, and set stopTimeout to 60 seconds."
        fr: "Utiliser une stratégie de fournisseurs de capacité avec FARGATE_SPOT en base 6 et poids 1 et FARGATE en poids 4, gérer SIGTERM dans le conteneur, et définir stopTimeout à 60 secondes."
answer: { optionId: a }
explanation:
  correct:
    en: "The base value places the first 6 tasks on the FARGATE capacity provider, so the contractual minimum never depends on spare capacity, and the weights send most additional tasks to the discounted FARGATE_SPOT provider. Fargate Spot sends SIGTERM and an EventBridge event two minutes before an interruption, and a stopTimeout of 60 seconds gives each task time to finish its segment."
    fr: "La valeur base place les 6 premières tâches sur le fournisseur de capacité FARGATE : le minimum contractuel ne dépend donc jamais de la capacité disponible, et les poids envoient la plupart des tâches supplémentaires vers le fournisseur à prix réduit FARGATE_SPOT. Fargate Spot envoie SIGTERM et un événement EventBridge deux minutes avant une interruption, et un stopTimeout de 60 secondes laisse à chaque tâche le temps de terminer son segment."
  options:
    b:
      en: "When Spot capacity is unavailable, Fargate does not substitute On-Demand capacity, so the 6 required tasks could all be interrupted or delayed."
      fr: "Lorsque la capacité Spot est indisponible, Fargate ne la remplace pas par de la capacité à la demande : les 6 tâches exigées pourraient toutes être interrompues ou retardées."
    c:
      en: "A Savings Plan sized to the maximum is paid every hour while the service usually runs far fewer tasks, and the interruptible tasks miss the larger Spot discount."
      fr: "Un Savings Plan dimensionné sur le maximum est payé chaque heure alors que le service exécute généralement bien moins de tâches, et les tâches interruptibles ne profitent pas de la remise Spot plus importante."
    d:
      en: "This strategy puts the guaranteed minimum on interruptible Spot capacity and most additional tasks on full-price Fargate, the reverse of the requirements."
      fr: "Cette stratégie place le minimum garanti sur de la capacité Spot interruptible et la plupart des tâches supplémentaires sur Fargate à plein tarif, l'inverse des exigences."
references:
  - title: "Amazon ECS clusters for Fargate"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html
