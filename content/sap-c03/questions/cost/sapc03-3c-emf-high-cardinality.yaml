id: sapc03-3c-emf-high-cardinality
objective: "3.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's multi-tenant API publishes latency and error metrics with the CloudWatch embedded metric format from its AWS Lambda functions. To let support engineers investigate individual tenants, developers added TenantId and RequestId as dimensions next to Service and Operation. The platform now has more than 200,000 tenants, and the CloudWatch bill shows millions of custom metrics. Dashboards and alarms need only Service and Operation, while support engineers need to find the latency of a specific tenant or request a few times a week. The company wants to cut the metrics cost without losing per-tenant and per-request investigation.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    L'API mutualisée d'AnyCompany publie des métriques de latence et d'erreurs au format de métriques intégrées (embedded metric format) de CloudWatch depuis ses fonctions AWS Lambda. Pour permettre aux ingénieurs du support d'examiner chaque locataire, les développeurs ont ajouté TenantId et RequestId comme dimensions à côté de Service et Operation. La plateforme compte désormais plus de 200 000 locataires, et la facture CloudWatch affiche des millions de métriques personnalisées. Les tableaux de bord et les alarmes n'ont besoin que de Service et Operation, tandis que les ingénieurs du support doivent retrouver la latence d'un locataire ou d'une requête précise quelques fois par semaine. L'entreprise veut réduire le coût des métriques sans perdre l'investigation par locataire et par requête.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Keep only Service and Operation as dimensions in the embedded metric format, write TenantId and RequestId as plain properties of the log event, and query them with CloudWatch Logs Insights.", fr: "Ne garder que Service et Operation comme dimensions dans le format de métriques intégrées, écrire TenantId et RequestId comme simples propriétés de l'événement de journal, et les interroger avec CloudWatch Logs Insights." }
    - id: b
      text: { en: "Replace the embedded metric format with PutMetricData calls that use the same four dimensions, batched to reduce the number of API requests.", fr: "Remplacer le format de métriques intégrées par des appels PutMetricData utilisant les quatre mêmes dimensions, regroupés pour réduire le nombre de requêtes d'API." }
    - id: c
      text: { en: "Recreate the Lambda log groups with the Essentials log class to lower ingestion cost, and keep the four dimensions in the embedded metric format.", fr: "Recréer les groupes de journaux Lambda avec la classe Essentials pour réduire le coût d'ingestion, et garder les quatre dimensions dans le format de métriques intégrées." }
    - id: d
      text: { en: "Set a 1-day retention on the Lambda log groups so that the metrics extracted from the embedded metric format expire faster.", fr: "Définir une rétention de 1 jour sur les groupes de journaux Lambda pour que les métriques extraites du format de métriques intégrées expirent plus vite." }
answer: { optionId: a }
explanation:
  correct:
    en: "The embedded metric format creates one custom metric for each unique combination of dimension values, so TenantId and RequestId multiply the metric count. AWS recommends keeping high-cardinality values in the log event rather than in dimensions: the metrics keep Service and Operation for dashboards and alarms, and Logs Insights finds a tenant or request in the same log events."
    fr: "Le format de métriques intégrées crée une métrique personnalisée pour chaque combinaison unique de valeurs de dimensions : TenantId et RequestId multiplient le nombre de métriques. AWS recommande de garder les valeurs à forte cardinalité dans l'événement de journal plutôt que dans les dimensions : les métriques conservent Service et Operation pour les tableaux de bord et les alarmes, et Logs Insights retrouve un locataire ou une requête dans les mêmes événements de journal."
  options:
    b:
      en: "PutMetricData with the same dimensions creates the same millions of custom metrics and adds API request charges."
      fr: "PutMetricData avec les mêmes dimensions crée les mêmes millions de métriques personnalisées et ajoute des frais de requêtes d'API."
    c:
      en: "The Essentials log class does not support the embedded metric format, so the metrics would stop being extracted, and the metric count problem is not addressed."
      fr: "La classe de journaux Essentials ne prend pas en charge le format de métriques intégrées : les métriques ne seraient plus extraites, et le problème du nombre de métriques n'est pas traité."
    d:
      en: "Log retention controls stored log events, not custom metrics; every dimension combination is still billed as a custom metric, and the 1-day retention removes the data needed for investigations."
      fr: "La rétention des journaux contrôle les événements stockés, pas les métriques personnalisées : chaque combinaison de dimensions reste facturée comme métrique personnalisée, et la rétention d'un jour supprime les données nécessaires aux investigations."
references:
  - title: Embedding metrics within logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
  - title: Log classes
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch_Logs_Log_Classes.html
