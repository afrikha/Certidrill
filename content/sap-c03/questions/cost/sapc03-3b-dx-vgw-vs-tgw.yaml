id: sapc03-3b-dx-vgw-vs-tgw
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany connects its data center to us-east-1 with two 10 Gbps AWS Direct Connect connections. A transit virtual interface on each connection reaches a Direct Connect gateway that is associated with an AWS Transit Gateway in the network account. Forty application VPCs use this path for traffic with on-premises systems.

    Every night, on-premises backup servers send about 400 TB per month to three backup VPCs. Return traffic is small. The backup VPCs never communicate with each other or with any other VPC. The network team wants to reduce the cost of the backup flow, keep it on Direct Connect, and leave the application VPCs unchanged.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany relie son centre de données à us-east-1 par deux connexions AWS Direct Connect de 10 Gbit/s. Une interface virtuelle de transit sur chaque connexion atteint une passerelle Direct Connect associée à une passerelle AWS Transit Gateway du compte réseau. Quarante VPC d'applications utilisent ce chemin pour leur trafic avec les systèmes sur site.

    Chaque nuit, des serveurs de sauvegarde sur site envoient environ 400 To par mois vers trois VPC de sauvegarde. Le trafic retour est faible. Les VPC de sauvegarde ne communiquent jamais entre eux ni avec un autre VPC. L'équipe réseau veut réduire le coût du flux de sauvegarde, le garder sur Direct Connect et ne rien changer pour les VPC d'applications.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Attach virtual private gateways to the backup VPCs, associate them with a second Direct Connect gateway, and reach it through new private virtual interfaces.", fr: "Attacher des passerelles privées virtuelles aux VPC de sauvegarde, les associer à une deuxième passerelle Direct Connect, et l'atteindre par de nouvelles interfaces virtuelles privées." } }
    - { id: b, text: { en: "Associate the three backup VPC attachments with a dedicated transit gateway route table that contains only the on-premises routes.", fr: "Associer les trois attachements des VPC de sauvegarde à une table de routage de passerelle de transit dédiée qui ne contient que les routes sur site." } }
    - { id: c, text: { en: "Create AWS Site-to-Site VPN attachments on the transit gateway, and send the backup traffic over the VPN tunnels instead of Direct Connect.", fr: "Créer des attachements AWS Site-to-Site VPN sur la passerelle de transit, et envoyer le trafic de sauvegarde par les tunnels VPN plutôt que par Direct Connect." } }
    - { id: d, text: { en: "Deploy AWS DataSync agents on premises that copy the backups over the transit virtual interfaces to interface endpoints in the backup VPCs.", fr: "Déployer sur site des agents AWS DataSync qui copient les sauvegardes par les interfaces virtuelles de transit vers des points de terminaison d'interface des VPC de sauvegarde." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A transit gateway charges data processing for each GB sent into it from a Direct Connect attachment, so 400 TB of inbound backups pays that charge every month. Direct Connect pricing consists only of port hours, capacity, and data transfer out, and inbound data transfer is free, so private virtual interfaces to virtual private gateways carry the backups with no per-GB charge. A separate Direct Connect gateway with its own private virtual interfaces leaves the existing transit path of the application VPCs unchanged.
    fr: |
      Une passerelle de transit facture le traitement des données pour chaque Go qu'elle reçoit d'un attachement Direct Connect : 400 To de sauvegardes entrantes paient donc ces frais chaque mois. La tarification Direct Connect ne comprend que les heures de port, la capacité et le transfert de données sortant, et le transfert entrant est gratuit : des interfaces virtuelles privées vers des passerelles privées virtuelles transportent donc les sauvegardes sans frais par Go. Une passerelle Direct Connect distincte, avec ses propres interfaces virtuelles privées, ne change rien au chemin de transit existant des VPC d'applications.
  options:
    b: { en: "A route table changes only which routes the attachments use; the backups still enter the transit gateway and pay data processing.", fr: "Une table de routage ne change que les routes utilisées par les attachements ; les sauvegardes entrent toujours dans la passerelle de transit et paient le traitement des données." }
    c: { en: "VPN attachments also pay transit gateway data processing, add VPN connection hours, and move the traffic off Direct Connect onto the internet.", fr: "Les attachements VPN paient aussi le traitement des données de la passerelle de transit, ajoutent des heures de connexion VPN et font quitter Direct Connect au trafic pour Internet." }
    d: { en: "DataSync adds a per-GB charge and interface endpoint processing, and the traffic still crosses the transit gateway.", fr: "DataSync ajoute des frais par Go et le traitement des points de terminaison d'interface, et le trafic traverse toujours la passerelle de transit." }
references:
  - title: AWS Direct Connect Pay-as-you-go Pricing
    url: https://aws.amazon.com/directconnect/pricing/
  - title: AWS Transit Gateway pricing
    url: https://aws.amazon.com/transit-gateway/pricing/
