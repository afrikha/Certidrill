id: sapc03-3b-cur2-athena-config
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's FinOps team analyzes hourly cost per resource with Amazon Athena. The data comes from a CUR 2.0 export that is delivered as gzip-compressed CSV files, with the file versioning option set to create a new export file at each refresh.

    The S3 bucket that holds the export keeps growing, and the Athena queries scan large amounts of data and are slow. The team must keep hourly line items for each resource, and it wants to reduce both the Athena scan cost and the S3 storage used by the export.

    Which combination of changes will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe FinOps d'AnyCompany analyse le coût horaire par ressource avec Amazon Athena. Les données proviennent d'un export CUR 2.0 livré sous forme de fichiers CSV compressés en gzip, avec l'option de gestion des versions de fichiers réglée pour créer un nouveau fichier d'export à chaque actualisation.

    Le compartiment S3 qui contient l'export ne cesse de grossir, et les requêtes Athena analysent de grandes quantités de données et sont lentes. L'équipe doit conserver des lignes horaires pour chaque ressource, et elle veut réduire à la fois le coût d'analyse d'Athena et le stockage S3 utilisé par l'export.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the export to deliver Parquet files.", fr: "Configurer l'export pour livrer des fichiers Parquet." } }
    - { id: b, text: { en: "Change the time granularity of the export to monthly.", fr: "Passer la granularité temporelle de l'export à mensuelle." } }
    - { id: c, text: { en: "Add a GROUP BY clause to the export's SQL query to pre-aggregate the cost of each resource.", fr: "Ajouter une clause GROUP BY à la requête SQL de l'export pour pré-agréger le coût de chaque ressource." } }
    - { id: d, text: { en: "Set the file versioning option to overwrite the existing data export file.", fr: "Régler l'option de gestion des versions de fichiers sur l'écrasement du fichier d'export existant." } }
    - { id: e, text: { en: "Turn off the option that includes resource IDs in the export.", fr: "Désactiver l'option qui inclut les ID de ressources dans l'export." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Parquet is a columnar format, so Athena reads only the columns that a query needs, which reduces the data scanned. With overwrite delivery, each refresh replaces the previous delivery of the same billing period instead of adding a new copy, which saves S3 storage. Parquet with overwrite is the delivery option set that Data Exports selects for Athena.
    fr: |
      Parquet est un format en colonnes : Athena ne lit que les colonnes dont une requête a besoin, ce qui réduit les données analysées. Avec la livraison par écrasement, chaque actualisation remplace la livraison précédente de la même période de facturation au lieu d'ajouter une nouvelle copie, ce qui économise du stockage S3. Parquet avec écrasement est l'ensemble d'options de livraison que Data Exports choisit pour Athena.
  options:
    b: { en: "Monthly granularity aggregates the line items by month, so the team would lose the hourly cost per resource it must keep.", fr: "La granularité mensuelle agrège les lignes par mois : l'équipe perdrait le coût horaire par ressource qu'elle doit conserver." }
    c: { en: "Data Exports queries can select, filter, and rename columns, but they do not support aggregations.", fr: "Les requêtes de Data Exports peuvent sélectionner, filtrer et renommer des colonnes, mais elles ne prennent pas en charge les agrégations." }
    e: { en: "Without resource IDs, the export shows combined usage per service instead of one line item per resource, which the team must keep.", fr: "Sans ID de ressources, l'export montre l'utilisation combinée par service au lieu d'une ligne par ressource, que l'équipe doit conserver." }
references:
  - title: Creating a standard export
    url: https://docs.aws.amazon.com/cur/latest/userguide/dataexports-create-standard.html
  - title: Processing data exports
    url: https://docs.aws.amazon.com/cur/latest/userguide/dataexports-processing.html
