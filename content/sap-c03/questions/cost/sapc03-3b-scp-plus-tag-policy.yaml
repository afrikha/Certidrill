id: sapc03-3b-scp-plus-tag-policy
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants to stop new untagged spend in its workload accounts. Every new EC2 instance and EBS volume in the member accounts must carry a CostCenter tag at creation, and the value must be one of the codes that the FinOps team approves.

    The control must be preventive and apply to all creation paths, including the console, the AWS CLI, SDKs, and infrastructure as code. The FinOps team wants to manage the rules centrally in AWS Organizations.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany veut stopper les nouvelles dépenses non balisées dans ses comptes de charges de travail. Chaque nouvelle instance EC2 et chaque nouveau volume EBS des comptes membres doit porter une balise CostCenter dès sa création, et la valeur doit être l'un des codes approuvés par l'équipe FinOps.

    Le contrôle doit être préventif et s'appliquer à tous les chemins de création, y compris la console, l'AWS CLI, les SDK et l'infrastructure en tant que code. L'équipe FinOps veut gérer les règles de manière centralisée dans AWS Organizations.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the AWS Config required-tags rule as an organization rule with CostCenter as tag1Key and the approved codes as tag1Value.", fr: "Déployer la règle AWS Config required-tags comme règle d'organisation avec CostCenter comme tag1Key et les codes approuvés comme tag1Value." } }
    - { id: b, text: { en: "Add CostCenter to report_required_tag_for in a tag policy, and activate the AWS::TagPolicies::TaggingComplianceValidator hook in FAIL mode.", fr: "Ajouter CostCenter à report_required_tag_for dans une politique de balises, et activer le hook AWS::TagPolicies::TaggingComplianceValidator en mode FAIL." } }
    - { id: c, text: { en: "Attach an SCP that denies ec2:RunInstances and ec2:CreateVolume on instance and volume resources when aws:RequestTag/CostCenter is null.", fr: "Attacher une SCP qui refuse ec2:RunInstances et ec2:CreateVolume sur les ressources instance et volume lorsque aws:RequestTag/CostCenter est nul." } }
    - { id: d, text: { en: "Attach a tag policy that defines CostCenter and its approved values without the enforced_for element.", fr: "Attacher une politique de balises qui définit CostCenter et ses valeurs approuvées sans l'élément enforced_for." } }
    - { id: e, text: { en: "Attach a tag policy that defines CostCenter and its approved values, and enforces them for ec2:instance and ec2:volume.", fr: "Attacher une politique de balises qui définit CostCenter et ses valeurs approuvées, et les applique à ec2:instance et ec2:volume." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      The two controls are complementary. The SCP uses the Null condition on aws:RequestTag/CostCenter to deny creation requests that carry no CostCenter tag, on every API path. The enforced tag policy makes tagging operations with a value outside the approved list fail; it does not evaluate resources that have no tag, which is why the SCP is needed for the presence check.
    fr: |
      Les deux contrôles sont complémentaires. La SCP utilise la condition Null sur aws:RequestTag/CostCenter pour refuser les requêtes de création sans balise CostCenter, sur tous les chemins d'API. La politique de balises appliquée fait échouer les opérations de balisage dont la valeur est hors de la liste approuvée ; elle n'évalue pas les ressources sans balise, d'où la nécessité de la SCP pour vérifier la présence.
  options:
    a: { en: "The required-tags rule detects noncompliant resources after creation; it is not a preventive control.", fr: "La règle required-tags détecte les ressources non conformes après leur création ; ce n'est pas un contrôle préventif." }
    b: { en: "The hook checks only infrastructure as code deployments, so instances created from the console, the CLI, or SDKs would not be checked.", fr: "Le hook ne vérifie que les déploiements d'infrastructure en tant que code : les instances créées depuis la console, la CLI ou les SDK ne seraient pas vérifiées." }
    d: { en: "Without enforced_for, the tag policy only reports noncompliant values; it does not prevent them.", fr: "Sans enforced_for, la politique de balises ne fait que signaler les valeurs non conformes ; elle ne les empêche pas." }
references:
  - title: Tag policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_example-tag-policies.html
  - title: Controlling access to AWS resources using tags
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_tags.html
