id: sapc03-3b-onprem-bedrock-dx
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's on-premises document-processing system sends about 40 TB of images each month to a foundation model through the Amazon Bedrock Runtime API in us-east-1, and it receives about 2 TB of responses. Today the traffic uses the company's internet links.

    The company already has an AWS Direct Connect connection with a transit virtual interface to a Direct Connect gateway and an AWS Transit Gateway that is attached to a shared services VPC in us-east-1. Security now requires that this traffic use private IP addresses only and never cross the internet. On-premises applications must keep calling the standard Bedrock Runtime DNS name, and the company wants the lowest-cost design.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le système de traitement de documents sur site d'AnyCompany envoie environ 40 To d'images par mois à un modèle de fondation par l'API Amazon Bedrock Runtime de us-east-1, et il reçoit environ 2 To de réponses. Aujourd'hui, le trafic utilise les liens Internet de l'entreprise.

    L'entreprise dispose déjà d'une connexion AWS Direct Connect avec une interface virtuelle de transit vers une passerelle Direct Connect et une passerelle AWS Transit Gateway attachée à un VPC de services partagés de us-east-1. La sécurité exige désormais que ce trafic n'utilise que des adresses IP privées et ne traverse jamais Internet. Les applications sur site doivent continuer à appeler le nom DNS standard de Bedrock Runtime, et l'entreprise veut la conception la moins coûteuse.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon Bedrock in the shared services VPC, and advertise its prefix list to the data center over Direct Connect.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon Bedrock dans le VPC de services partagés, et annoncer sa liste de préfixes au centre de données par Direct Connect." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for bedrock-runtime with private DNS enabled in the shared services VPC.", fr: "Créer un point de terminaison de VPC d'interface pour bedrock-runtime avec le DNS privé activé dans le VPC de services partagés." } }
    - { id: c, text: { en: "Create a public virtual interface on the Direct Connect connection, and send the requests to the public Bedrock Runtime endpoint over it.", fr: "Créer une interface virtuelle publique sur la connexion Direct Connect, et envoyer les requêtes au point de terminaison public de Bedrock Runtime par celle-ci." } }
    - { id: d, text: { en: "Create Route 53 Resolver inbound endpoints in the shared services VPC, and configure the on-premises DNS servers to forward the Bedrock Runtime domain name to them.", fr: "Créer des points de terminaison entrants Route 53 Resolver dans le VPC de services partagés, et configurer les serveurs DNS sur site pour qu'ils leur transfèrent le nom de domaine de Bedrock Runtime." } }
    - { id: e, text: { en: "Create an AWS Site-to-Site VPN attachment on the transit gateway, and send the Bedrock traffic through the VPN tunnels.", fr: "Créer un attachement AWS Site-to-Site VPN sur la passerelle de transit, et envoyer le trafic Bedrock par les tunnels VPN." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An interface endpoint gives Bedrock Runtime private IP addresses in the shared services VPC, which the data center reaches over the existing transit virtual interface. With private DNS enabled, the standard name resolves to those addresses inside the VPC, and Resolver inbound endpoints let on-premises DNS servers forward that name and get the same private answers. Data sent into AWS over Direct Connect has no data transfer charge, and the 2 TB of responses are billed at Direct Connect data transfer out rates.
    fr: |
      Un point de terminaison d'interface donne à Bedrock Runtime des adresses IP privées dans le VPC de services partagés, que le centre de données atteint par l'interface virtuelle de transit existante. Avec le DNS privé activé, le nom standard se résout vers ces adresses dans le VPC, et les points de terminaison entrants Resolver permettent aux serveurs DNS sur site de transférer ce nom et d'obtenir les mêmes réponses privées. Les données envoyées vers AWS par Direct Connect n'ont pas de frais de transfert, et les 2 To de réponses sont facturés au tarif du transfert sortant Direct Connect.
  options:
    a: { en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB, and they cannot be used from outside their VPC.", fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB, et ils ne sont pas utilisables depuis l'extérieur de leur VPC." }
    c: { en: "A public virtual interface reaches the public service endpoints, which use public IP addresses and break the private-addressing requirement.", fr: "Une interface virtuelle publique atteint les points de terminaison publics des services, qui utilisent des adresses IP publiques et violent l'exigence d'adressage privé." }
    e: { en: "Site-to-Site VPN tunnels run over the internet, which security forbids, and they add VPN hours on top of transit gateway processing.", fr: "Les tunnels Site-to-Site VPN passent par Internet, ce que la sécurité interdit, et ils ajoutent des heures de VPN en plus du traitement de la passerelle de transit." }
references:
  - title: AWS Direct Connect Pay-as-you-go Pricing
    url: https://aws.amazon.com/directconnect/pricing/
  - title: Centralized access to VPC private endpoints
    url: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-access-to-vpc-private-endpoints.html
