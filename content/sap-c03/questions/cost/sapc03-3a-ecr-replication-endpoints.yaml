id: sapc03-3a-ecr-replication-endpoints
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany builds all container images in a central Amazon ECR private registry in the us-east-1 Region. Amazon EKS clusters in us-east-1, eu-west-1 and ap-southeast-1 pull these images from the us-east-1 registry. Each cluster runs in private subnets, and all image pulls go through NAT gateways in the cluster's VPC. The images are large, and the clusters add and replace nodes many times a day, so inter-Region data transfer and NAT gateway data processing charges keep growing. Security requires that the nodes have no public IP addresses. The clusters must stay in their current Regions.

    Which combination of actions will reduce these charges MOST cost-effectively? (Choose two.)
  fr: |
    AnyCompany génère toutes ses images de conteneurs dans un registre privé Amazon ECR central de la Région us-east-1. Des clusters Amazon EKS dans us-east-1, eu-west-1 et ap-southeast-1 récupèrent ces images depuis le registre us-east-1. Chaque cluster s'exécute dans des sous-réseaux privés, et toutes les récupérations d'images passent par des passerelles NAT du VPC du cluster. Les images sont volumineuses, et les clusters ajoutent et remplacent des nœuds de nombreuses fois par jour : les frais de transfert de données entre Régions et de traitement des données des passerelles NAT ne cessent d'augmenter. La sécurité exige que les nœuds n'aient aucune adresse IP publique. Les clusters doivent rester dans leurs Régions actuelles.

    Quelle combinaison d'actions permet de réduire ces frais de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure ECR cross-Region replication from us-east-1 to eu-west-1 and ap-southeast-1, and make each cluster pull images from the registry in its own Region."
        fr: "Configurer la réplication ECR entre Régions de us-east-1 vers eu-west-1 et ap-southeast-1, et faire récupérer à chaque cluster les images depuis le registre de sa propre Région."
    - id: b
      text:
        en: "Replace the NAT gateways in each cluster VPC with larger NAT gateways that process image traffic faster during node scaling."
        fr: "Remplacer les passerelles NAT de chaque VPC de cluster par des passerelles NAT plus grandes qui traitent plus vite le trafic d'images pendant la mise à l'échelle des nœuds."
    - id: c
      text:
        en: "Create Amazon S3 interface endpoints in every Availability Zone of each cluster VPC so that image layers are downloaded through AWS PrivateLink."
        fr: "Créer des points de terminaison d'interface Amazon S3 dans chaque zone de disponibilité de chaque VPC de cluster pour que les couches d'images soient téléchargées via AWS PrivateLink."
    - id: d
      text:
        en: "Move the eu-west-1 and ap-southeast-1 clusters to us-east-1 so that every image pull stays in the same Region as the registry."
        fr: "Déplacer les clusters eu-west-1 et ap-southeast-1 vers us-east-1 pour que chaque récupération d'image reste dans la même Région que le registre."
    - id: e
      text:
        en: "Create ecr.api and ecr.dkr interface endpoints and an Amazon S3 gateway endpoint in each cluster VPC, and associate the gateway endpoint with the private route tables."
        fr: "Créer des points de terminaison d'interface ecr.api et ecr.dkr et un point de terminaison de passerelle Amazon S3 dans chaque VPC de cluster, et associer le point de terminaison de passerelle aux tables de routage privées."
answer: { optionIds: [a, e] }
explanation:
  correct:
    en: "ECR replication copies each image to the other Regions once per push, so nodes pull from an in-Region registry instead of transferring every pull across Regions. ECR interface endpoints carry the registry API and Docker calls privately, and because ECR stores image layers in Amazon S3, an S3 gateway endpoint, which has no additional charge, carries the layer downloads, so pulls no longer pass through the NAT gateways."
    fr: "La réplication ECR copie chaque image vers les autres Régions une fois par push : les nœuds récupèrent les images depuis un registre de leur Région au lieu de transférer chaque récupération entre Régions. Les points de terminaison d'interface ECR transportent en privé les appels d'API du registre et de Docker, et comme ECR stocke les couches d'images dans Amazon S3, un point de terminaison de passerelle S3, sans frais supplémentaires, transporte le téléchargement des couches : les récupérations ne passent plus par les passerelles NAT."
  options:
    b:
      en: "NAT gateways are charged per hour and per GB processed, so the same image traffic still incurs the same processing charges, and the inter-Region transfer remains."
      fr: "Les passerelles NAT sont facturées à l'heure et par Go traité : le même trafic d'images entraîne toujours les mêmes frais de traitement, et le transfert entre Régions demeure."
    c:
      en: "S3 interface endpoints would also work, but they add hourly and per-GB charges, whereas a gateway endpoint carries the same layer traffic at no additional charge."
      fr: "Des points de terminaison d'interface S3 fonctionneraient aussi, mais ils ajoutent des frais horaires et par Go, alors qu'un point de terminaison de passerelle transporte le même trafic de couches sans frais supplémentaires."
    d:
      en: "The clusters must stay in their current Regions."
      fr: "Les clusters doivent rester dans leurs Régions actuelles."
references:
  - title: "Private image replication in Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
  - title: "Amazon ECR interface VPC endpoints (AWS PrivateLink)"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/vpc-endpoints.html
