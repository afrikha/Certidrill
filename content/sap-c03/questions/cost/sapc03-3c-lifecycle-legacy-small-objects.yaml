id: sapc03-3c-lifecycle-legacy-small-objects
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's media archive bucket has an S3 Lifecycle rule, created in 2023 and never edited, that transitions all objects to S3 Glacier Flexible Retrieval 90 days after creation. Each video file averages 800 MB and is stored with about 40 JSON sidecar files of 2 KB to 10 KB that describe scenes and rights. The monthly bill now shows high S3 Lifecycle transition request charges and Glacier storage charges that are out of proportion with the sidecar data volume. A catalog application must be able to read any sidecar file at any time with millisecond latency. Compliance requires that the video files keep moving to S3 Glacier Flexible Retrieval after 90 days.

    Which change will meet these requirements MOST cost-effectively for new objects?
  fr: |
    Le compartiment d'archives multimédias d'AnyCompany possède une règle S3 Lifecycle, créée en 2023 et jamais modifiée, qui fait passer tous les objets dans S3 Glacier Flexible Retrieval 90 jours après leur création. Chaque fichier vidéo pèse en moyenne 800 Mo et est stocké avec environ 40 fichiers annexes JSON de 2 Ko à 10 Ko qui décrivent les scènes et les droits. La facture mensuelle montre désormais des frais élevés de requêtes de transition S3 Lifecycle et des frais de stockage Glacier sans rapport avec le volume des fichiers annexes. Une application de catalogue doit pouvoir lire n'importe quel fichier annexe à tout moment avec une latence de l'ordre de la milliseconde. La conformité exige que les fichiers vidéo continuent de passer dans S3 Glacier Flexible Retrieval après 90 jours.

    Quelle modification répond à ces exigences de la manière la PLUS rentable pour les nouveaux objets ?
body:
  options:
    - id: a
      text: { en: "Replace the Lifecycle rule with uploads to S3 Intelligent-Tiering and activate the Archive Access tier for objects that are not accessed for 90 days.", fr: "Remplacer la règle Lifecycle par des chargements dans S3 Intelligent-Tiering et activer le niveau Archive Access pour les objets non consultés pendant 90 jours." }
    - id: b
      text: { en: "Change the transition target of the rule to S3 Glacier Instant Retrieval so that the sidecar files stay readable in milliseconds after the transition.", fr: "Changer la cible de transition de la règle en S3 Glacier Instant Retrieval pour que les fichiers annexes restent lisibles en millisecondes après la transition." }
    - id: c
      text: { en: "Add a second Lifecycle rule with an ObjectSizeLessThan filter of 128 KB and an Expiration action that removes the sidecar files after 90 days.", fr: "Ajouter une seconde règle Lifecycle avec un filtre ObjectSizeLessThan de 128 Ko et une action Expiration qui supprime les fichiers annexes après 90 jours." }
    - id: d
      text: { en: "Edit the rule to add an ObjectSizeGreaterThan filter of 128 KB (131,072 bytes) so that only the video files transition and the sidecar files stay in S3 Standard.", fr: "Modifier la règle pour ajouter un filtre ObjectSizeGreaterThan de 128 Ko (131 072 octets) afin que seuls les fichiers vidéo soient transférés et que les fichiers annexes restent dans S3 Standard." }
answer: { optionId: d }
explanation:
  correct:
    en: "Rules created before September 2024 keep transitioning objects smaller than 128 KB to Glacier Flexible Retrieval. Each transition is a billed request, and every archived object carries about 40 KB of metadata overhead, which dwarfs a 2 KB file and also makes it unreadable without a restore. An ObjectSizeGreaterThan filter keeps the small sidecars in S3 Standard, readable in milliseconds, while the videos still transition."
    fr: "Les règles créées avant septembre 2024 continuent de faire passer dans Glacier Flexible Retrieval les objets de moins de 128 Ko. Chaque transition est une requête facturée, et chaque objet archivé porte environ 40 Ko de surcharge de métadonnées, ce qui dépasse largement un fichier de 2 Ko et le rend en outre illisible sans restauration. Un filtre ObjectSizeGreaterThan garde les petits fichiers annexes dans S3 Standard, lisibles en millisecondes, tandis que les vidéos restent transférées."
  options:
    a:
      en: "The Archive Access tier is part of S3 Intelligent-Tiering, not the S3 Glacier Flexible Retrieval storage class, so the compliance requirement for the videos is no longer met; videos also move only after 90 days without access."
      fr: "Le niveau Archive Access fait partie de S3 Intelligent-Tiering, pas de la classe de stockage S3 Glacier Flexible Retrieval : l'exigence de conformité des vidéos n'est plus remplie, et les vidéos ne passent qu'après 90 jours sans accès."
    b:
      en: "The videos would no longer go to Glacier Flexible Retrieval, and every sidecar would still be a billed transition and would be charged as a 128 KB minimum object."
      fr: "Les vidéos n'iraient plus dans Glacier Flexible Retrieval, et chaque fichier annexe resterait une transition facturée et serait facturé comme un objet minimal de 128 Ko."
    c:
      en: "Expiring the sidecar files deletes data that the catalog application must be able to read at any time."
      fr: "Faire expirer les fichiers annexes supprime des données que l'application de catalogue doit pouvoir lire à tout moment."
references:
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
