id: sapc03-3a-bedrock-flex-tier
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's product team uses Amazon Bedrock for two workloads in the same account. A customer-facing chat assistant needs consistent, everyday response times. Every night, an evaluation pipeline in AWS Step Functions runs thousands of multi-turn agent conversations against new prompt versions, and each turn calls the Converse API synchronously because the next turn depends on the previous response. Individual evaluation calls can take noticeably longer than usual, but the pipeline must finish within the same night. The model supports all service tiers in the Region. The company wants to lower the inference cost of the evaluations without changing the chat experience and without any capacity commitment.

    Which solution will meet these requirements?
  fr: |
    L'équipe produit d'AnyCompany utilise Amazon Bedrock pour deux charges de travail dans le même compte. Un assistant de chat destiné aux clients a besoin de temps de réponse homogènes au quotidien. Chaque nuit, un pipeline d'évaluation dans AWS Step Functions exécute des milliers de conversations d'agent en plusieurs tours sur de nouvelles versions de prompts, et chaque tour appelle l'API Converse de manière synchrone, car le tour suivant dépend de la réponse précédente. Les appels d'évaluation peuvent prendre nettement plus de temps qu'à l'habitude, mais le pipeline doit se terminer dans la nuit. Le modèle prend en charge tous les niveaux de service dans la Région. L'entreprise veut réduire le coût d'inférence des évaluations sans modifier l'expérience du chat et sans aucun engagement de capacité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write all evaluation prompts to Amazon S3 at the start of the night, and run them as one Amazon Bedrock batch inference job instead of calling the Converse API."
        fr: "Écrire tous les prompts d'évaluation dans Amazon S3 en début de nuit, et les exécuter dans une seule tâche d'inférence par lots Amazon Bedrock au lieu d'appeler l'API Converse."
    - id: b
      text:
        en: "Ask the AWS account team for a Reserved tier reservation sized to the nightly peak, and send both the evaluation and chat requests with the reserved service tier."
        fr: "Demander à l'équipe de compte AWS une réservation du niveau Reserved dimensionnée sur le pic nocturne, et envoyer les requêtes d'évaluation et de chat avec le niveau de service reserved."
    - id: c
      text:
        en: "Set the service_tier parameter to flex on the Converse requests of the evaluation pipeline, and keep the default service tier for the chat assistant."
        fr: "Définir le paramètre service_tier sur flex dans les requêtes Converse du pipeline d'évaluation, et conserver le niveau de service par défaut pour l'assistant de chat."
    - id: d
      text:
        en: "Set the service_tier parameter to priority on the requests of both workloads so that the evaluation pipeline finishes earlier and uses fewer Step Functions transitions."
        fr: "Définir le paramètre service_tier sur priority dans les requêtes des deux charges de travail pour que le pipeline d'évaluation se termine plus tôt et utilise moins de transitions Step Functions."
answer: { optionId: c }
explanation:
  correct:
    en: "The Flex tier is selected per request with the service_tier parameter and is billed at a discount from Standard for workloads that tolerate longer processing times, such as evaluations and agentic workflows. The synchronous Converse calls keep working turn by turn, and the chat requests stay on the Standard tier with no reservation."
    fr: "Le niveau Flex se sélectionne par requête avec le paramètre service_tier et est facturé avec une remise par rapport au niveau Standard pour les charges de travail qui tolèrent des temps de traitement plus longs, comme les évaluations et les flux de travail agentiques. Les appels Converse synchrones continuent de fonctionner tour par tour, et les requêtes de chat restent sur le niveau Standard sans réservation."
  options:
    a:
      en: "A batch job processes prompts that are known in advance and returns them asynchronously in S3, but each turn here depends on the previous response, so the conversations cannot be submitted as one job."
      fr: "Une tâche par lots traite des prompts connus à l'avance et les restitue de manière asynchrone dans S3, mais ici chaque tour dépend de la réponse précédente : les conversations ne peuvent pas être soumises en une seule tâche."
    b:
      en: "The Reserved tier is a fixed monthly price for 1-month or 3-month reservations with minimum tokens per minute, which is the capacity commitment the company wants to avoid."
      fr: "Le niveau Reserved est un prix mensuel fixe pour des réservations de 1 ou 3 mois avec un minimum de jetons par minute, c'est-à-dire l'engagement de capacité que l'entreprise veut éviter."
    d:
      en: "The priority tier is billed at a premium over Standard, so it raises the cost of both workloads."
      fr: "Le niveau priority est facturé avec une majoration par rapport au niveau Standard : il augmente le coût des deux charges de travail."
references:
  - title: "Service tiers for optimizing performance and cost"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
  - title: "Process multiple prompts with batch inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
