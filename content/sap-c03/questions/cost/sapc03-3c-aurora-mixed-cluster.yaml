id: sapc03-3c-aurora-mixed-cluster
objective: "3.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a SaaS reporting product on an Amazon Aurora PostgreSQL-Compatible Edition DB cluster with the Aurora Standard storage configuration. The writer is a db.r7g.4xlarge provisioned instance whose load is steady 24 hours a day, and the company has committed to keep this design for at least three years. Four db.r7g.4xlarge provisioned readers are sized for the business-hours peak, but they are almost idle at night and on weekends. I/O charges are about 8% of the cluster cost. The engine version supports Aurora Serverless v2, and the company wants the largest cost reduction without degrading performance during peaks.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exploite un produit SaaS de reporting sur un cluster de bases de données Amazon Aurora PostgreSQL-Compatible Edition avec la configuration de stockage Aurora Standard. L'instance d'écriture est une instance provisionnée db.r7g.4xlarge dont la charge est stable 24 heures sur 24, et l'entreprise s'est engagée à conserver cette conception pendant au moins trois ans. Quatre instances de lecture provisionnées db.r7g.4xlarge sont dimensionnées pour le pic des heures ouvrées, mais elles sont presque inactives la nuit et le week-end. Les frais d'E/S représentent environ 8 % du coût du cluster. La version du moteur prend en charge Aurora Serverless v2, et l'entreprise veut la plus forte réduction de coûts sans dégrader les performances pendant les pics.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Purchase a 3-year reserved DB instance for the db.r7g.4xlarge writer.", fr: "Acheter une instance de base de données réservée de 3 ans pour l'instance d'écriture db.r7g.4xlarge." } }
    - { id: b, text: { en: "Replace the four provisioned readers with Aurora Serverless v2 readers in promotion tiers 2 to 15, so that they scale with the read load.", fr: "Remplacer les quatre instances de lecture provisionnées par des instances de lecture Aurora Serverless v2 dans les niveaux de promotion 2 à 15, pour qu'elles s'adaptent à la charge de lecture." } }
    - { id: c, text: { en: "Convert the writer to Aurora Serverless v2 and purchase a 3-year reserved DB instance to cover its capacity.", fr: "Convertir l'instance d'écriture en Aurora Serverless v2 et acheter une instance de base de données réservée de 3 ans pour couvrir sa capacité." } }
    - { id: d, text: { en: "Purchase 3-year reserved DB instances for the four db.r7g.4xlarge readers to lower their hourly price.", fr: "Acheter des instances de base de données réservées de 3 ans pour les quatre instances de lecture db.r7g.4xlarge afin de réduire leur prix horaire." } }
    - { id: e, text: { en: "Modify the cluster storage configuration to Aurora I/O-Optimized to remove the I/O charges.", fr: "Modifier la configuration de stockage du cluster en Aurora I/O-Optimized pour supprimer les frais d'E/S." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A steady provisioned writer kept for three years is the classic case for a 3-year reserved DB instance. Aurora supports mixed-configuration clusters with a provisioned writer and Aurora Serverless v2 readers, billed in ACU-hours only for the capacity in use; readers in promotion tiers 2 to 15 scale independently of the writer, so they shrink at night and grow for the peak."
    fr: "Une instance d'écriture provisionnée stable conservée trois ans est le cas typique d'une instance de base de données réservée de 3 ans. Aurora prend en charge les clusters à configuration mixte avec une instance d'écriture provisionnée et des instances de lecture Aurora Serverless v2, facturées en ACU-heures pour la seule capacité utilisée : les instances de lecture des niveaux de promotion 2 à 15 évoluent indépendamment de l'instance d'écriture, elles se réduisent donc la nuit et grandissent pour le pic."
  options:
    c:
      en: "Reserved DB instances apply to provisioned instance classes; Aurora Serverless v2 capacity is billed in ACU-hours and is not covered, and a steady writer gains nothing from serverless scaling."
      fr: "Les instances de base de données réservées s'appliquent aux classes d'instance provisionnées : la capacité Aurora Serverless v2 est facturée en ACU-heures et n'est pas couverte, et une instance d'écriture stable ne gagne rien à la mise à l'échelle sans serveur."
    d:
      en: "Reserving the four peak-sized readers commits the company to paying for capacity that is idle every night and weekend."
      fr: "Réserver les quatre instances de lecture dimensionnées pour le pic engage l'entreprise à payer une capacité inactive chaque nuit et chaque week-end."
    e:
      en: "I/O-Optimized raises instance and storage prices to remove I/O charges; with I/O at about 8% of the cost, below the 25% guideline, Aurora Standard remains cheaper."
      fr: "I/O-Optimized augmente les prix des instances et du stockage pour supprimer les frais d'E/S : avec des E/S à environ 8 % du coût, sous le repère de 25 %, Aurora Standard reste moins cher."
references:
