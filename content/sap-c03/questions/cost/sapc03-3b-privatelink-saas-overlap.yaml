id: sapc03-3b-privatelink-saas-overlap
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is a software vendor that runs a TCP-based market data API in its own VPC in us-east-1. About 400 customers want to consume the API privately from VPCs in their own AWS accounts, which are outside AnyCompany's organization.

    Many customers use the same CIDR blocks as each other and as AnyCompany. Traffic must not cross the internet, and customers must reach only the API, not AnyCompany's network. AnyCompany does not want its own connectivity charges to grow with the number of customers: each customer must pay the hourly and data processing charges of its own connection.

    Which solution will meet these requirements?
  fr: |
    AnyCompany est un éditeur de logiciels qui exploite une API de données de marché basée sur TCP dans son propre VPC de us-east-1. Environ 400 clients veulent consommer l'API de façon privée depuis des VPC de leurs propres comptes AWS, qui sont hors de l'organisation d'AnyCompany.

    Beaucoup de clients utilisent les mêmes blocs CIDR entre eux et que ceux d'AnyCompany. Le trafic ne doit pas traverser Internet, et les clients ne doivent atteindre que l'API, pas le réseau d'AnyCompany. AnyCompany ne veut pas que ses propres frais de connectivité augmentent avec le nombre de clients : chaque client doit payer les frais horaires et de traitement des données de sa propre connexion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Share a transit gateway with each customer account by using AWS RAM, have customers attach their VPCs, and isolate customers with separate transit gateway route tables.", fr: "Partager une passerelle de transit avec chaque compte client à l'aide d'AWS RAM, demander aux clients d'y attacher leurs VPC, et isoler les clients avec des tables de routage de passerelle de transit distinctes." } }
    - { id: b, text: { en: "Create an AWS PrivateLink endpoint service in front of a Network Load Balancer for the API, and have each customer create an interface VPC endpoint in its own VPC.", fr: "Créer un service de point de terminaison AWS PrivateLink devant un Network Load Balancer pour l'API, et demander à chaque client de créer un point de terminaison de VPC d'interface dans son propre VPC." } }
    - { id: c, text: { en: "Create a VPC peering connection between AnyCompany's VPC and each customer VPC, and restrict access to the API subnets with security groups.", fr: "Créer une connexion d'appairage de VPC entre le VPC d'AnyCompany et chaque VPC client, et limiter l'accès aux sous-réseaux de l'API avec des groupes de sécurité." } }
    - { id: d, text: { en: "Publish the API through an internet-facing Network Load Balancer with TLS, and allow only the customers' NAT gateway IP addresses in its security group.", fr: "Publier l'API par un Network Load Balancer accessible depuis Internet avec TLS, et n'autoriser dans son groupe de sécurité que les adresses IP des passerelles NAT des clients." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With AWS PrivateLink, each customer reaches only the service behind the endpoint, and overlapping CIDR blocks do not matter because no routes are exchanged. The owner of the interface endpoint pays its hourly charge in each Availability Zone and its per-GB data processing charge, so each customer pays for its own connection. AnyCompany pays only for its Network Load Balancer and service, which keeps its connectivity cost independent of the number of endpoints.
    fr: |
      Avec AWS PrivateLink, chaque client n'atteint que le service situé derrière le point de terminaison, et les blocs CIDR qui se chevauchent n'ont pas d'importance car aucune route n'est échangée. Le propriétaire du point de terminaison d'interface paie ses frais horaires dans chaque zone de disponibilité et ses frais de traitement des données par Go : chaque client paie donc sa propre connexion. AnyCompany ne paie que son Network Load Balancer et son service, ce qui rend son coût de connectivité indépendant du nombre de points de terminaison.
  options:
    a: { en: "Transit gateway routing cannot handle overlapping CIDR blocks, and attaching customer VPCs gives them network-level reachability rather than access to one API.", fr: "Le routage d'une passerelle de transit ne gère pas les blocs CIDR qui se chevauchent, et attacher les VPC clients leur donne un accès au niveau réseau plutôt qu'à une seule API." }
    c: { en: "VPC peering is not possible between VPCs with matching or overlapping CIDR blocks, and 400 peering connections exceed the per-VPC peering quota.", fr: "L'appairage de VPC est impossible entre des VPC dont les blocs CIDR sont identiques ou se chevauchent, et 400 connexions d'appairage dépassent le quota d'appairages par VPC." }
    d: { en: "Traffic would cross the internet, and AnyCompany would pay internet data transfer out for every customer's responses.", fr: "Le trafic traverserait Internet, et AnyCompany paierait le transfert de données sortant vers Internet pour les réponses de chaque client." }
references:
  - title: AWS PrivateLink Pricing
    url: https://aws.amazon.com/privatelink/pricing/
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
