id: sapc03-3a-distributed-map-express-children
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every month, AnyCompany must reprocess 50 million JSON objects that are stored in an Amazon S3 bucket. Each object goes through three short, idempotent steps implemented as AWS Lambda functions: transform, validate and write, which take less than 10 seconds in total. The company orchestrates its batch jobs with AWS Step Functions and wants the run to process thousands of objects in parallel. The result of every object must be exported to S3, and the run must stop automatically if more than 1% of the objects fail. The company wants to reduce the Step Functions cost of this monthly run as much as possible.

    Which solution will meet these requirements?
  fr: |
    Chaque mois, AnyCompany doit retraiter 50 millions d'objets JSON stockés dans un compartiment Amazon S3. Chaque objet passe par trois étapes courtes et idempotentes implémentées par des fonctions AWS Lambda : transformation, validation et écriture, qui prennent moins de 10 secondes au total. L'entreprise orchestre ses traitements par lots avec AWS Step Functions et veut que l'exécution traite des milliers d'objets en parallèle. Le résultat de chaque objet doit être exporté vers S3, et l'exécution doit s'arrêter automatiquement si plus de 1 % des objets échouent. L'entreprise veut réduire autant que possible le coût Step Functions de cette exécution mensuelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a Standard workflow with a Distributed Map state that reads the objects from S3, batches items with ItemBatcher, runs EXPRESS child workflow executions, writes results with ResultWriter and sets a tolerated failure percentage of 1."
        fr: "Utiliser un flux de travail Standard avec un état Distributed Map qui lit les objets dans S3, regroupe les éléments avec ItemBatcher, lance des exécutions de flux de travail enfants EXPRESS, écrit les résultats avec ResultWriter et définit un pourcentage d'échecs toléré de 1."
    - id: b
      text:
        en: "Use a Standard workflow with a Distributed Map state that reads the objects from S3, runs STANDARD child workflow executions for each object, writes results with ResultWriter and sets a tolerated failure percentage of 1."
        fr: "Utiliser un flux de travail Standard avec un état Distributed Map qui lit les objets dans S3, lance des exécutions de flux de travail enfants STANDARD pour chaque objet, écrit les résultats avec ResultWriter et définit un pourcentage d'échecs toléré de 1."
    - id: c
      text:
        en: "Use an Express workflow with a Distributed Map state that reads the objects from S3, runs EXPRESS child workflow executions, writes results with ResultWriter and sets a tolerated failure percentage of 1."
        fr: "Utiliser un flux de travail Express avec un état Distributed Map qui lit les objets dans S3, lance des exécutions de flux de travail enfants EXPRESS, écrit les résultats avec ResultWriter et définit un pourcentage d'échecs toléré de 1."
    - id: d
      text:
        en: "Use a Standard workflow with an Inline Map state that iterates over a list of object keys passed in the execution input, and count failures in a Lambda function that stops the execution above 1%."
        fr: "Utiliser un flux de travail Standard avec un état Map inline qui parcourt une liste de clés d'objets transmise dans l'entrée de l'exécution, et compter les échecs dans une fonction Lambda qui arrête l'exécution au-delà de 1 %."
answer: { optionId: a }
explanation:
  correct:
    en: "Distributed Map runs each iteration as a child workflow, reads the dataset directly from S3, exports results with ResultWriter and enforces ToleratedFailurePercentage. Choosing the EXPRESS execution type for short, idempotent children bills them by executions, duration and memory instead of per state transition, and ItemBatcher further reduces the number of child executions."
    fr: "Distributed Map exécute chaque itération comme un flux de travail enfant, lit le jeu de données directement dans S3, exporte les résultats avec ResultWriter et applique ToleratedFailurePercentage. Choisir le type d'exécution EXPRESS pour des enfants courts et idempotents les facture selon les exécutions, la durée et la mémoire plutôt que par transition d'état, et ItemBatcher réduit encore le nombre d'exécutions enfants."
  options:
    b:
      en: "STANDARD child executions are billed per state transition, so three steps for each of 50 million objects create far more charges than Express children."
      fr: "Les exécutions enfants STANDARD sont facturées par transition d'état : trois étapes pour chacun des 50 millions d'objets génèrent bien plus de frais que des enfants Express."
    c:
      en: "The Distributed Map state is supported only in Standard workflows, not in Express workflows."
      fr: "L'état Distributed Map n'est pris en charge que dans les flux de travail Standard, pas dans les flux Express."
    d:
      en: "An Inline Map is limited to 40 concurrent iterations and to the 25,000-entry execution history and 256 KiB input of one execution, so it cannot handle 50 million objects in parallel."
      fr: "Un état Map inline est limité à 40 itérations simultanées, à l'historique de 25 000 entrées et à l'entrée de 256 Kio d'une exécution : il ne peut pas traiter 50 millions d'objets en parallèle."
references:
  - title: "Using Map state in Distributed mode for large-scale parallel workloads in Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
  - title: "Choosing workflow type in Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
