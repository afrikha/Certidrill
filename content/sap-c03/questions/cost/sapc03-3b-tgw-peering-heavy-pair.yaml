id: sapc03-3b-tgw-peering-heavy-pair
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany connects 45 VPCs in eu-west-1 through an AWS Transit Gateway that a central network account owns. A cost review shows that transit gateway data processing is the largest networking charge on the bill.

    About 80% of the processed data comes from a single flow: an analytics VPC reads about 600 TB each month from a data lake VPC in the same Region. The two VPCs have non-overlapping CIDR blocks. All other VPCs must keep their current connectivity through the transit gateway, and the analytics flow needs no inspection.

    Which solution will reduce the networking cost of the analytics flow the MOST?
  fr: |
    AnyCompany relie 45 VPC de eu-west-1 par une passerelle AWS Transit Gateway qui appartient à un compte réseau central. Une revue des coûts montre que le traitement des données par la passerelle de transit est le premier poste réseau de la facture.

    Environ 80 % des données traitées proviennent d'un seul flux : un VPC d'analytique lit environ 600 To par mois depuis un VPC de lac de données de la même Région. Les deux VPC ont des blocs CIDR qui ne se chevauchent pas. Tous les autres VPC doivent conserver leur connectivité actuelle par la passerelle de transit, et le flux d'analytique n'a besoin d'aucune inspection.

    Quelle solution réduit le PLUS le coût réseau du flux d'analytique ?
body:
  options:
    - { id: a, text: { en: "Migrate the 45 VPCs to an AWS Cloud WAN core network with a segment for the analytics and data lake VPCs.", fr: "Migrer les 45 VPC vers un réseau central AWS Cloud WAN avec un segment pour les VPC d'analytique et de lac de données." } }
    - { id: b, text: { en: "Expose the data lake through an AWS PrivateLink endpoint service behind a Network Load Balancer, and create an interface VPC endpoint in the analytics VPC.", fr: "Exposer le lac de données par un service de point de terminaison AWS PrivateLink derrière un Network Load Balancer, et créer un point de terminaison de VPC d'interface dans le VPC d'analytique." } }
    - { id: c, text: { en: "Associate the analytics and data lake VPC attachments with a dedicated transit gateway route table that propagates only their two CIDR blocks.", fr: "Associer les attachements des VPC d'analytique et de lac de données à une table de routage de passerelle de transit dédiée qui ne propage que leurs deux blocs CIDR." } }
    - { id: d, text: { en: "Create a VPC peering connection between the analytics and data lake VPCs, and point the routes for each other's CIDR block to the peering connection in both VPCs.", fr: "Créer une connexion d'appairage de VPC (VPC peering) entre les VPC d'analytique et de lac de données, et faire pointer vers cette connexion les routes du bloc CIDR de l'autre VPC dans les deux VPC." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A transit gateway charges data processing for each gigabyte sent into it from a VPC attachment, so 600 TB per month through the transit gateway is billed per GB. A VPC peering connection has no hourly charge and no data processing charge; only standard data transfer applies. Moving only this high-volume, non-transitive flow to peering removes most of the processing cost while the other VPCs keep using the transit gateway.
    fr: |
      Une passerelle de transit facture le traitement des données pour chaque gigaoctet qu'elle reçoit d'un attachement de VPC : 600 To par mois qui la traversent sont donc facturés au Go. Une connexion d'appairage de VPC n'a ni frais horaires ni frais de traitement des données ; seul le transfert de données standard s'applique. Déplacer uniquement ce flux volumineux et non transitif vers l'appairage supprime l'essentiel des frais de traitement, tandis que les autres VPC continuent d'utiliser la passerelle de transit.
  options:
    a: { en: "Cloud WAN also charges data processing for traffic that crosses the core network, and migrating 45 VPCs is a large change for one flow.", fr: "Cloud WAN facture aussi le traitement des données pour le trafic qui traverse le réseau central, et migrer 45 VPC est un changement important pour un seul flux." }
    b: { en: "PrivateLink bills interface endpoint hours and data processing for every GB, plus Network Load Balancer capacity, so the flow still pays a per-GB charge.", fr: "PrivateLink facture les heures du point de terminaison d'interface et le traitement des données pour chaque Go, plus la capacité du Network Load Balancer : le flux paie donc toujours des frais par Go." }
    c: { en: "A separate route table changes routing only; the traffic still crosses the transit gateway and is billed the same data processing charge.", fr: "Une table de routage séparée ne change que le routage : le trafic traverse toujours la passerelle de transit et paie les mêmes frais de traitement des données." }
references:
  - title: AWS Transit Gateway pricing
    url: https://aws.amazon.com/transit-gateway/pricing/
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
