id: sapc03-3b-tag-backfill-history
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's infrastructure as code pipelines have applied a Project tag to every resource they create for the last 14 months. Nobody activated the tag for cost allocation until today, when the FinOps team activated it in the management account.

    For an audit next week, the CFO needs the cost of each project for each of the previous 9 months, in AWS Cost Explorer and in the CUR 2.0 export that the auditors query. The FinOps team wants the solution that requires the least effort.

    Which solution will meet these requirements?
  fr: |
    Les pipelines d'infrastructure en tant que code d'AnyCompany appliquent depuis 14 mois une balise Project à chaque ressource qu'ils créent. Personne n'avait activé la balise pour la répartition des coûts avant aujourd'hui, date à laquelle l'équipe FinOps l'a activée dans le compte de gestion.

    Pour un audit la semaine prochaine, le directeur financier a besoin du coût de chaque projet pour chacun des 9 derniers mois, dans AWS Cost Explorer et dans l'export CUR 2.0 que les auditeurs interrogent. L'équipe FinOps veut la solution qui demande le moins d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the management account, request a backfill of cost allocation tags that starts 9 months ago.", fr: "Depuis le compte de gestion, demander un remplissage rétroactif (backfill) des balises de répartition des coûts qui commence il y a 9 mois." } }
    - { id: b, text: { en: "Create a cost category with an inherited value rule on the Project tag key, and let it categorize the previous 9 months.", fr: "Créer une catégorie de coûts avec une règle de valeur héritée sur la clé de balise Project, et la laisser catégoriser les 9 derniers mois." } }
    - { id: c, text: { en: "Ask the owner of each member account to activate the Project tag as a cost allocation tag in their account.", fr: "Demander au propriétaire de chaque compte membre d'activer la balise Project comme balise de répartition des coûts dans son compte." } }
    - { id: d, text: { en: "Reapply the Project tag to every resource with Tag Editor so that AWS Billing reprocesses the historical usage.", fr: "Réappliquer la balise Project à chaque ressource avec Tag Editor pour qu'AWS Billing retraite l'utilisation historique." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Management account users can request a backfill of cost allocation tags for up to 12 months, which updates Cost Explorer, Data Exports, and the Cost and Usage Report. The backfilled data contains a tag value only where the tag was historically assigned to the resource, which is the case here because the pipelines applied it for 14 months. Data refreshes once every 24 hours, so the backfill is visible in time for next week's audit.
    fr: |
      Les utilisateurs du compte de gestion peuvent demander un remplissage rétroactif des balises de répartition des coûts sur 12 mois au maximum, ce qui met à jour Cost Explorer, Data Exports et le rapport Cost and Usage Report. Les données remplies ne contiennent une valeur de balise que si la balise était historiquement affectée à la ressource, ce qui est le cas ici puisque les pipelines l'appliquent depuis 14 mois. Les données sont actualisées toutes les 24 heures : le remplissage est donc visible à temps pour l'audit de la semaine prochaine.
  options:
    b: { en: "Cost categories apply from the start of the current month; they do not recategorize earlier months.", fr: "Les catégories de coûts s'appliquent à partir du début du mois en cours ; elles ne recatégorisent pas les mois précédents." }
    c: { en: "In an organization, only the management account can activate cost allocation tags, and activation alone does not restore past months.", fr: "Dans une organisation, seul le compte de gestion peut activer les balises de répartition des coûts, et l'activation seule ne restaure pas les mois passés." }
    d: { en: "Retagging resources does not change billing data that was already processed; the tags already existed on the resources.", fr: "Rebaliser les ressources ne modifie pas les données de facturation déjà traitées ; les balises existaient déjà sur les ressources." }
references:
  - title: Backfill cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-allocation-backfill.html
