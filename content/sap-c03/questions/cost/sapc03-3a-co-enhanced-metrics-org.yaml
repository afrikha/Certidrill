id: sapc03-3a-co-enhanced-metrics-org
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an organization in AWS Organizations with 200 member accounts. Its finance applications run on Amazon EC2 instances in Auto Scaling groups and on Amazon RDS DB instances across many of these accounts. Each quarter ends with a week of heavy reporting jobs, and usage is moderate for the rest of the quarter. AWS Compute Optimizer is enabled for the whole organization with default settings, and the platform team downsized several resources according to its recommendations. During the next quarter-end, the downsized resources could not handle the reporting load. The company wants rightsizing recommendations for all accounts that account for a full quarter of utilization, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une organisation dans AWS Organizations comprenant 200 comptes membres. Ses applications financières s'exécutent sur des instances Amazon EC2 de groupes Auto Scaling et sur des instances de base de données Amazon RDS dans un grand nombre de ces comptes. Chaque trimestre se termine par une semaine de lourds traitements de reporting, et l'utilisation est modérée le reste du trimestre. AWS Compute Optimizer est activé pour toute l'organisation avec les paramètres par défaut, et l'équipe de plateforme a réduit plusieurs ressources selon ses recommandations. À la clôture trimestrielle suivante, les ressources réduites n'ont pas supporté la charge de reporting. L'entreprise veut des recommandations de dimensionnement adapté pour tous les comptes qui tiennent compte d'un trimestre complet d'utilisation, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the management account, set the lookback period preference of Compute Optimizer to 32 days at the organization level for EC2 instances, Auto Scaling groups and RDS DB instances."
        fr: "Depuis le compte de gestion, définir la préférence de période d'analyse de Compute Optimizer à 32 jours au niveau de l'organisation pour les instances EC2, les groupes Auto Scaling et les instances de base de données RDS."
    - id: b
      text:
        en: "In each member account, activate enhanced infrastructure metrics at the resource level for every finance EC2 instance and RDS DB instance."
        fr: "Dans chaque compte membre, activer les métriques d'infrastructure améliorées (enhanced infrastructure metrics) au niveau de chaque ressource pour toutes les instances EC2 et instances de base de données RDS financières."
    - id: c
      text:
        en: "Stream the CloudWatch metrics of all accounts to a central Amazon S3 bucket with metric streams, and compute 93-day utilization percentiles with Amazon Athena queries."
        fr: "Diffuser les métriques CloudWatch de tous les comptes vers un compartiment Amazon S3 central avec des flux de métriques (metric streams), et calculer des percentiles d'utilisation sur 93 jours avec des requêtes Amazon Athena."
    - id: d
      text:
        en: "From the management account or delegated administrator, activate enhanced infrastructure metrics at the organization level for EC2, Auto Scaling groups and RDS."
        fr: "Depuis le compte de gestion ou l'administrateur délégué, activer les métriques d'infrastructure améliorées au niveau de l'organisation pour EC2, les groupes Auto Scaling et RDS."
answer: { optionId: d }
explanation:
  correct:
    en: "By default, Compute Optimizer analyzes 14 days of metrics, which can miss a quarter-end peak. Enhanced infrastructure metrics, a paid feature for EC2 instances, Auto Scaling group instances and RDS DB instances, extends the lookback to 93 days, and the management account or delegated administrator can activate it once for all member accounts."
    fr: "Par défaut, Compute Optimizer analyse 14 jours de métriques, ce qui peut manquer un pic de fin de trimestre. Les métriques d'infrastructure améliorées, fonctionnalité payante pour les instances EC2, les instances de groupes Auto Scaling et les instances de base de données RDS, étendent la période d'analyse à 93 jours, et le compte de gestion ou l'administrateur délégué peut les activer une seule fois pour tous les comptes membres."
  options:
    a:
      en: "A 32-day lookback captures monthly cycles but not a quarterly peak that happens once every three months."
      fr: "Une période d'analyse de 32 jours capture les cycles mensuels, mais pas un pic trimestriel qui survient une fois tous les trois mois."
    b:
      en: "Resource-level activation in 200 accounts gives the right lookback but creates much more operational overhead than one organization-level preference."
      fr: "Une activation par ressource dans 200 comptes donne la bonne période d'analyse, mais crée bien plus de charge opérationnelle qu'une seule préférence au niveau de l'organisation."
    c:
      en: "Building a custom analytics pipeline replaces a managed feature with code and queries to maintain, which is the opposite of the least operational overhead."
      fr: "Construire un pipeline d'analyse personnalisé remplace une fonctionnalité gérée par du code et des requêtes à maintenir, à l'opposé du MOINS de charge opérationnelle."
references:
  - title: "Enhanced infrastructure metrics"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html
  - title: "Rightsizing recommendation preferences"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
