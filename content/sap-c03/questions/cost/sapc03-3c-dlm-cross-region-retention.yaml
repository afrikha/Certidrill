id: sapc03-3c-dlm-cross-region-retention
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a document management application on Amazon EC2 instances in us-east-1, with data on encrypted Amazon EBS volumes tagged app=docs. The disaster recovery plan for this application accepts an RPO of 24 hours and an RTO of 8 hours, recovering into us-west-2 from the latest snapshot. Operations staff must be able to restore any of the last 7 daily snapshots in us-east-1 after user errors. In us-west-2, only the two most recent daily copies are needed. The company wants to automate the snapshots and copies with the lowest snapshot storage and replication cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application de gestion documentaire sur des instances Amazon EC2 en us-east-1, avec des données sur des volumes Amazon EBS chiffrés balisés app=docs. Le plan de reprise après sinistre de cette application accepte un RPO de 24 heures et un RTO de 8 heures, avec une reprise dans us-west-2 depuis le dernier instantané. Le personnel d'exploitation doit pouvoir restaurer n'importe lequel des 7 derniers instantanés quotidiens dans us-east-1 après une erreur d'utilisateur. Dans us-west-2, seules les deux copies quotidiennes les plus récentes sont nécessaires. L'entreprise veut automatiser les instantanés et les copies avec le coût de stockage d'instantanés et de réplication le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "In us-east-1, create an Amazon Data Lifecycle Manager snapshot policy that targets volumes tagged app=docs with a daily schedule that retains 7 snapshots, and a cross-Region copy rule to us-west-2 that retains 2 copies.", fr: "Dans us-east-1, créer une politique d'instantanés Amazon Data Lifecycle Manager qui cible les volumes balisés app=docs avec une planification quotidienne qui conserve 7 instantanés, et une règle de copie entre Régions vers us-west-2 qui conserve 2 copies." }
    - id: b
      text: { en: "In us-west-2, create an Amazon Data Lifecycle Manager snapshot policy that targets the us-east-1 volumes tagged app=docs with a daily schedule that retains 2 snapshots, and a second policy in us-east-1 that retains 7 snapshots.", fr: "Dans us-west-2, créer une politique d'instantanés Amazon Data Lifecycle Manager qui cible les volumes de us-east-1 balisés app=docs avec une planification quotidienne qui conserve 2 instantanés, et une seconde politique dans us-east-1 qui conserve 7 instantanés." }
    - id: c
      text: { en: "Install the AWS Elastic Disaster Recovery replication agent on the instances to replicate them continuously to a staging area in us-west-2, and keep 7 daily point-in-time recovery points.", fr: "Installer l'agent de réplication AWS Elastic Disaster Recovery sur les instances pour les répliquer en continu vers une zone de transit dans us-west-2, et conserver 7 points de récupération quotidiens." }
    - id: d
      text: { en: "In us-east-1, create an Amazon Data Lifecycle Manager snapshot policy that targets volumes tagged app=docs with a daily schedule that retains 7 snapshots, and a cross-Region copy rule to us-west-2 that also retains 7 copies.", fr: "Dans us-east-1, créer une politique d'instantanés Amazon Data Lifecycle Manager qui cible les volumes balisés app=docs avec une planification quotidienne qui conserve 7 instantanés, et une règle de copie entre Régions vers us-west-2 qui conserve également 7 copies." }
answer: { optionId: a }
explanation:
  correct:
    en: "A Data Lifecycle Manager snapshot policy targets volumes by tag, and each cross-Region copy rule has its own retention, separate from the source schedule. Daily snapshots meet the 24-hour RPO, 7 snapshots stay in us-east-1 for user errors, and only 2 copies are stored in us-west-2. Encrypted snapshots can be copied with a KMS key of the destination Region."
    fr: "Une politique d'instantanés Data Lifecycle Manager cible les volumes par balise, et chaque règle de copie entre Régions a sa propre conservation, distincte de la planification source. Des instantanés quotidiens respectent le RPO de 24 heures, 7 instantanés restent dans us-east-1 pour les erreurs d'utilisateur, et seules 2 copies sont stockées dans us-west-2. Les instantanés chiffrés peuvent être copiés avec une clé KMS de la Région de destination."
  options:
    b:
      en: "A Data Lifecycle Manager policy manages resources in its own Region; a policy in us-west-2 cannot snapshot volumes that are in us-east-1."
      fr: "Une politique Data Lifecycle Manager gère les ressources de sa propre Région : une politique dans us-west-2 ne peut pas créer d'instantanés de volumes situés dans us-east-1."
    c:
      en: "Continuous replication with recovery instances launched in minutes far exceeds a 24-hour RPO and 8-hour RTO, and it adds replication servers and staging storage to pay for."
      fr: "Une réplication continue avec des instances de reprise lancées en quelques minutes dépasse largement un RPO de 24 heures et un RTO de 8 heures, et ajoute des serveurs de réplication et un stockage de transit à payer."
    d:
      en: "Keeping 7 copies in us-west-2 stores five more snapshots per volume than the disaster recovery plan needs."
      fr: "Conserver 7 copies dans us-west-2 stocke cinq instantanés de plus par volume que ce dont le plan de reprise a besoin."
references:
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-ami-policy.html
