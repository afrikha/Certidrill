id: sapc03-3c-dw-volume-mix
objective: "3.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a self-managed data warehouse on 20 Amazon EC2 instances. Each instance has a 100 GiB General Purpose SSD (gp2) boot volume and a 14 TiB Provisioned IOPS SSD (io1) scratch volume with 10,000 provisioned IOPS. CloudWatch shows that the scratch volumes serve only large sequential scans at up to 450 MiB/s with fewer than 1,000 IOPS, and the boot volumes are lightly used. Scratch data can be rebuilt from Amazon S3 if a volume fails. The company wants to reduce EBS costs as much as possible without reducing the performance that the workload uses.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute un entrepôt de données autogéré sur 20 instances Amazon EC2. Chaque instance possède un volume de démarrage General Purpose SSD (gp2) de 100 Gio et un volume de travail Provisioned IOPS SSD (io1) de 14 Tio avec 10 000 IOPS provisionnées. CloudWatch montre que les volumes de travail ne servent que de grands balayages séquentiels jusqu'à 450 Mio/s avec moins de 1 000 IOPS, et que les volumes de démarrage sont peu utilisés. Les données de travail peuvent être reconstruites depuis Amazon S3 en cas de défaillance d'un volume. L'entreprise veut réduire le plus possible ses coûts EBS sans réduire les performances que la charge de travail utilise.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Modify the scratch volumes to Throughput Optimized HDD (st1).", fr: "Modifier les volumes de travail en Throughput Optimized HDD (st1)." } }
    - { id: b, text: { en: "Modify the scratch volumes to Cold HDD (sc1).", fr: "Modifier les volumes de travail en Cold HDD (sc1)." } }
    - { id: c, text: { en: "Modify the boot volumes to Cold HDD (sc1).", fr: "Modifier les volumes de démarrage en Cold HDD (sc1)." } }
    - { id: d, text: { en: "Modify the boot volumes to General Purpose SSD (gp3).", fr: "Modifier les volumes de démarrage en General Purpose SSD (gp3)." } }
    - { id: e, text: { en: "Modify the scratch volumes to Provisioned IOPS SSD (io2) Block Express with 10,000 IOPS.", fr: "Modifier les volumes de travail en Provisioned IOPS SSD (io2) Block Express avec 10 000 IOPS." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "st1 is the low-cost HDD type for frequently accessed sequential workloads: a 14 TiB st1 volume has a baseline of 40 MiB/s per TiB, capped at 500 MiB/s, which covers the 450 MiB/s scans without paying for provisioned IOPS. Boot volumes must stay on SSD, and gp3 costs less per GiB than gp2 while including 3,000 IOPS and 125 MiB/s."
    fr: "st1 est le type HDD économique pour les charges séquentielles fréquemment sollicitées : un volume st1 de 14 Tio a une base de 40 Mio/s par Tio, plafonnée à 500 Mio/s, ce qui couvre les balayages à 450 Mio/s sans payer d'IOPS provisionnées. Les volumes de démarrage doivent rester sur SSD, et gp3 coûte moins cher au Gio que gp2 tout en incluant 3 000 IOPS et 125 Mio/s."
  options:
    b:
      en: "sc1 delivers at most 192 MiB/s of baseline throughput at 16 TiB, far below the 450 MiB/s that the scans use."
      fr: "sc1 fournit au plus 192 Mio/s de débit de base à 16 Tio, bien en dessous des 450 Mio/s utilisés par les balayages."
    c:
      en: "st1 and sc1 volumes cannot be used as boot volumes."
      fr: "Les volumes st1 et sc1 ne peuvent pas servir de volumes de démarrage."
    e:
      en: "io2 still charges for 10,000 provisioned IOPS that the sequential workload does not use, and its SSD storage price is much higher than st1."
      fr: "io2 facture toujours 10 000 IOPS provisionnées que la charge séquentielle n'utilise pas, et son prix de stockage SSD est bien supérieur à celui de st1."
references:
  - title: Amazon EBS Throughput Optimized HDD and Cold HDD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
