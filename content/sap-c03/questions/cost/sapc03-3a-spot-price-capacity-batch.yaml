id: sapc03-3a-spot-price-capacity-batch
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a nightly risk calculation in one AWS account. An Auto Scaling group launches about 400 vCPUs of c6i.4xlarge On-Demand Instances in a single Availability Zone every night and terminates them after 5 hours. The application saves its progress every few minutes and can resume on any instance that has at least 16 vCPUs and 32 GiB of memory. A previous test with Spot Instances of only c6i.4xlarge and the lowest-price allocation strategy suffered frequent interruptions. The company wants to lower the cost of the calculation while keeping interruptions as rare as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un calcul de risque nocturne dans un compte AWS. Chaque nuit, un groupe Auto Scaling lance environ 400 vCPU d'instances à la demande c6i.4xlarge dans une seule zone de disponibilité et les résilie au bout de 5 heures. L'application enregistre sa progression toutes les quelques minutes et peut reprendre sur n'importe quelle instance disposant d'au moins 16 vCPU et 32 Gio de mémoire. Un essai précédent avec des instances Spot uniquement c6i.4xlarge et la stratégie d'allocation lowest-price a subi de fréquentes interruptions. L'entreprise veut réduire le coût du calcul tout en limitant au maximum les interruptions.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a mixed instances policy with many instance types that meet the vCPU and memory needs in all Availability Zones, and the price-capacity-optimized Spot allocation strategy."
        fr: "Utiliser une politique d'instances mixtes avec de nombreux types d'instances conformes aux besoins en vCPU et en mémoire dans toutes les zones de disponibilité, et la stratégie d'allocation Spot price-capacity-optimized."
    - id: b
      text:
        en: "Configure the Auto Scaling group with a mixed instances policy that allows c6i.4xlarge and c5.4xlarge in the current Availability Zone, and use Spot Instances with the lowest-price allocation strategy across two pools."
        fr: "Configurer le groupe Auto Scaling avec une politique d'instances mixtes qui autorise c6i.4xlarge et c5.4xlarge dans la zone de disponibilité actuelle, et utiliser des instances Spot avec la stratégie d'allocation lowest-price sur deux pools."
    - id: c
      text:
        en: "Keep the On-Demand Instances in the Auto Scaling group, and purchase a 3-year EC2 Instance Savings Plan for the C6i family that covers 400 vCPUs of usage."
        fr: "Conserver les instances à la demande dans le groupe Auto Scaling, et acheter un EC2 Instance Savings Plan sur 3 ans pour la famille C6i qui couvre l'utilisation de 400 vCPU."
    - id: d
      text:
        en: "Keep the On-Demand Instances in the Auto Scaling group, and create an On-Demand Capacity Reservation for the c6i.4xlarge instances in the current Availability Zone."
        fr: "Conserver les instances à la demande dans le groupe Auto Scaling, et créer une réservation de capacité à la demande pour les instances c6i.4xlarge dans la zone de disponibilité actuelle."
answer: { optionId: a }
explanation:
  correct:
    en: "The workload saves checkpoints and accepts many instance types, so Spot Instances give the deepest discount. Diversifying across many instance types and all Availability Zones and using the recommended price-capacity-optimized strategy places instances in the pools that are least likely to be interrupted at a low price."
    fr: "La charge de travail enregistre des points de contrôle et accepte de nombreux types d'instances : les instances Spot offrent donc la remise la plus élevée. Diversifier sur de nombreux types d'instances et toutes les zones de disponibilité avec la stratégie recommandée price-capacity-optimized place les instances dans les pools les moins susceptibles d'être interrompus, à un prix bas."
  options:
    b:
      en: "The lowest-price strategy over only two pools in one Availability Zone has the highest interruption risk, which is the problem the company already had."
      fr: "La stratégie lowest-price sur seulement deux pools dans une zone de disponibilité présente le risque d'interruption le plus élevé, c'est-à-dire le problème que l'entreprise a déjà rencontré."
    c:
      en: "A Savings Plan commitment is charged every hour of the term, but the instances run only 5 hours per night, so most of the commitment would be wasted."
      fr: "L'engagement d'un Savings Plan est facturé chaque heure de la durée, alors que les instances ne tournent que 5 heures par nuit : la majeure partie de l'engagement serait perdue."
    d:
      en: "A Capacity Reservation guarantees capacity but provides no discount, and it is billed at the On-Demand rate even when the instances are not running."
      fr: "Une réservation de capacité garantit la capacité mais n'accorde aucune remise, et elle est facturée au tarif On-Demand même lorsque les instances ne tournent pas."
references:
  - title: "Allocation strategies for multiple instance types"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/allocation-strategies.html
