id: sapc03-3a-compute-db-savings-plans
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany will modernize a large application portfolio over the next 12 months. Its Amazon RDS for Oracle databases will move to Amazon Aurora PostgreSQL-Compatible Edition, and several high-traffic tables will move to Amazon DynamoDB tables in on-demand capacity mode. The application tier, which now runs on Amazon EC2 instances, will move to AWS Lambda and Amazon ECS on AWS Fargate. Total hourly compute spend and total hourly database spend are expected to stay roughly constant during and after the migration. The company wants commitment-based discounts on both compute and database spend starting now. The discounts must keep applying throughout the migration without exchanging or modifying any commitment.

    Which combination of purchase options will meet these requirements? (Choose two.)
  fr: |
    AnyCompany va moderniser un vaste portefeuille d'applications au cours des 12 prochains mois. Ses bases de données Amazon RDS for Oracle migreront vers Amazon Aurora PostgreSQL-Compatible Edition, et plusieurs tables très sollicitées migreront vers des tables Amazon DynamoDB en mode de capacité à la demande. Le niveau applicatif, qui s'exécute aujourd'hui sur des instances Amazon EC2, migrera vers AWS Lambda et Amazon ECS sur AWS Fargate. Les dépenses horaires totales de calcul et de bases de données devraient rester à peu près constantes pendant et après la migration. L'entreprise veut dès maintenant des remises liées à un engagement sur les dépenses de calcul et de bases de données. Les remises doivent continuer à s'appliquer tout au long de la migration sans échanger ni modifier d'engagement.

    Quelle combinaison d'options d'achat permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Purchase 3-year Amazon RDS Reserved DB instances for the current RDS for Oracle instances."
        fr: "Acheter des instances de base de données réservées Amazon RDS sur 3 ans pour les instances RDS for Oracle actuelles."
    - id: b
      text:
        en: "Purchase a 3-year EC2 Instance Savings Plan for the instance family that the application tier uses today."
        fr: "Acheter un EC2 Instance Savings Plan sur 3 ans pour la famille d'instances qu'utilise aujourd'hui le niveau applicatif."
    - id: c
      text:
        en: "Purchase a Compute Savings Plan sized to the expected steady hourly compute spend."
        fr: "Acheter un Compute Savings Plan dimensionné sur la dépense horaire de calcul stable attendue."
    - id: d
      text:
        en: "Purchase DynamoDB reserved capacity for the tables that will move to DynamoDB."
        fr: "Acheter de la capacité réservée DynamoDB pour les tables qui migreront vers DynamoDB."
    - id: e
      text:
        en: "Purchase a 1-year Database Savings Plan sized to the expected steady hourly database spend."
        fr: "Acheter un Database Savings Plan sur 1 an dimensionné sur la dépense horaire de bases de données stable attendue."
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: "A Compute Savings Plan applies to EC2 in any family and Region and to Fargate and Lambda, so the discount follows the application tier. A Database Savings Plan, offered with a 1-year term, applies across Aurora, RDS, DynamoDB and other database services regardless of engine, instance family, size or Region, including serverless usage, so it follows the move from RDS for Oracle to Aurora PostgreSQL and DynamoDB."
    fr: "Un Compute Savings Plan s'applique à EC2 quelles que soient la famille et la Région, ainsi qu'à Fargate et Lambda : la remise suit donc le niveau applicatif. Un Database Savings Plan, proposé sur 1 an, s'applique à Aurora, RDS, DynamoDB et d'autres services de bases de données quels que soient le moteur, la famille, la taille d'instance ou la Région, y compris l'utilisation serverless : il suit donc le passage de RDS for Oracle à Aurora PostgreSQL et DynamoDB."
  options:
    a:
      en: "RDS Reserved DB instances are tied to the Oracle engine and instance attributes, so they stop applying when the databases move to Aurora PostgreSQL and DynamoDB."
      fr: "Les instances de base de données réservées RDS sont liées au moteur Oracle et aux attributs d'instance : elles cessent de s'appliquer lorsque les bases migrent vers Aurora PostgreSQL et DynamoDB."
    b:
      en: "An EC2 Instance Savings Plan covers only one EC2 instance family in one Region and never covers Lambda or Fargate."
      fr: "Un EC2 Instance Savings Plan ne couvre qu'une famille d'instances EC2 dans une Région et ne couvre jamais Lambda ni Fargate."
    d:
      en: "DynamoDB reserved capacity applies only to provisioned capacity, so it gives no discount to tables that use on-demand capacity mode."
      fr: "La capacité réservée DynamoDB ne s'applique qu'à la capacité provisionnée : elle n'accorde aucune remise aux tables en mode de capacité à la demande."
references:
  - title: "Savings Plans types"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html
