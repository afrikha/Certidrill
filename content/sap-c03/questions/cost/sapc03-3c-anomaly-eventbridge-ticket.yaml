id: sapc03-3c-anomaly-eventbridge-ticket
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an AWS managed Cost Anomaly Detection monitor for AWS services in the management account of its organization. The FinOps team uses a third-party IT service management tool that exposes an HTTPS API to create tickets. A ticket must be opened automatically, within hours of detection, for every anomaly whose total impact is at least $1,000 and at least 20% above expected spend. Smaller anomalies must not create tickets. Each ticket must contain the root-cause service, linked account, and Region so that the right team can act. The company does not want to write or operate custom code for this integration.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un moniteur Cost Anomaly Detection géré par AWS pour les services AWS dans le compte de gestion de son organisation. L'équipe FinOps utilise un outil tiers de gestion des services informatiques qui expose une API HTTPS de création de tickets. Un ticket doit être ouvert automatiquement, dans les heures qui suivent la détection, pour chaque anomalie dont l'impact total atteint au moins 1 000 $ et au moins 20 % au-dessus des dépenses attendues. Les anomalies plus petites ne doivent pas créer de ticket. Chaque ticket doit contenir le service, le compte lié et la Région à l'origine de l'anomalie, afin que la bonne équipe puisse agir. L'entreprise ne veut ni écrire ni exploiter de code personnalisé pour cette intégration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a daily summary alert subscription with a $1,000 absolute threshold and a 20% percentage threshold combined with AND, and subscribe the ticketing API endpoint to the subscription through an Amazon SNS topic.", fr: "Ajouter un abonnement aux alertes en résumé quotidien avec un seuil absolu de 1 000 $ et un seuil en pourcentage de 20 % combinés par AND, et abonner le point de terminaison de l'API de tickets à cet abonnement via une rubrique Amazon SNS." }
    - id: b
      text: { en: "Add an individual alert subscription to the monitor. Create an Amazon EventBridge rule that matches Anomaly Detected events from aws.ce with numeric conditions on the total impact and impact percentage, and target an API destination for the ticketing API.", fr: "Ajouter un abonnement aux alertes individuelles au moniteur. Créer une règle Amazon EventBridge qui correspond aux événements Anomaly Detected de aws.ce avec des conditions numériques sur l'impact total et le pourcentage d'impact, et cibler une destination d'API pour l'API de tickets." }
    - id: c
      text: { en: "Add an individual alert subscription with a $1,000 absolute threshold and a 20% percentage threshold combined with OR. Create an Amazon EventBridge rule that matches all Anomaly Detected events from aws.ce and targets an API destination.", fr: "Ajouter un abonnement aux alertes individuelles avec un seuil absolu de 1 000 $ et un seuil en pourcentage de 20 % combinés par OR. Créer une règle Amazon EventBridge qui correspond à tous les événements Anomaly Detected de aws.ce et cible une destination d'API." }
    - id: d
      text: { en: "Create an Amazon CloudWatch anomaly detection alarm on the EstimatedCharges billing metric, and create an Amazon EventBridge rule that sends the alarm state changes to an API destination for the ticketing API.", fr: "Créer une alarme de détection d'anomalies Amazon CloudWatch sur la métrique de facturation EstimatedCharges, et créer une règle Amazon EventBridge qui envoie les changements d'état de l'alarme vers une destination d'API pour l'API de tickets." }
answer: { optionId: b }
explanation:
  correct:
    en: "When an immediate (individual) alert is detected, Cost Anomaly Detection emits an Anomaly Detected event with source aws.ce. The event contains the total impact, the impact percentage, and root causes with service, linked account, and Region. Numeric matching in the event pattern keeps only anomalies that meet both conditions, and an API destination calls the HTTPS API without custom code."
    fr: "Lorsqu'une alerte immédiate (individuelle) est détectée, Cost Anomaly Detection émet un événement Anomaly Detected de source aws.ce. L'événement contient l'impact total, le pourcentage d'impact et les causes racines avec le service, le compte lié et la Région. La correspondance numérique du modèle d'événement ne garde que les anomalies qui remplissent les deux conditions, et une destination d'API appelle l'API HTTPS sans code personnalisé."
  options:
    a:
      en: "Daily summaries are delivered only by email to email recipients, not through SNS, and they arrive once a day, so no ticket is created from them through an SNS endpoint."
      fr: "Les résumés quotidiens sont envoyés uniquement par e-mail à des destinataires e-mail, pas via SNS, et ils arrivent une fois par jour : aucun ticket n'en est créé via un point de terminaison SNS."
    c:
      en: "Combining the thresholds with OR, and matching every event in the rule, also opens tickets for anomalies that meet only one condition, such as a 25% anomaly worth $50."
      fr: "Combiner les seuils par OR et faire correspondre tous les événements dans la règle ouvre aussi des tickets pour des anomalies qui ne remplissent qu'une condition, comme une anomalie de 25 % valant 50 $."
    d:
      en: "A CloudWatch alarm on total estimated charges has no notion of expected spend per service and gives no root cause, so tickets would lack the service, account, and Region and would not match the stated thresholds."
      fr: "Une alarme CloudWatch sur les frais estimés totaux n'a aucune notion de dépense attendue par service et ne donne aucune cause racine : les tickets n'auraient ni service, ni compte, ni Région et ne correspondraient pas aux seuils demandés."
references:
  - title: Using EventBridge with Cost Anomaly Detection
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/cad-eventbridge.html
  - title: Getting started with AWS Cost Anomaly Detection
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html
