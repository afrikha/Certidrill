id: sapc03-3c-efs-backup-copy-dr
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores 40 TB of design files on an Amazon EFS Regional file system in us-east-1. The disaster recovery requirements for this data are an RPO of 24 hours and an RTO of 12 hours in us-west-2. In us-west-2, the company needs to keep only the recovery points of the last 7 days. Local recovery from user errors is already handled by an existing AWS Backup plan in us-east-1, and tests show that a full restore from a backup vault in the same Region takes about 6 hours. A FinOps reviewer wants the disaster recovery copies to cost as little as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke 40 To de fichiers de conception sur un système de fichiers Amazon EFS régional en us-east-1. Les exigences de reprise après sinistre pour ces données sont un RPO de 24 heures et un RTO de 12 heures dans us-west-2. Dans us-west-2, l'entreprise doit conserver uniquement les points de récupération des 7 derniers jours. La reprise locale après des erreurs d'utilisateur est déjà assurée par un plan AWS Backup existant en us-east-1, et des tests montrent qu'une restauration complète depuis un coffre de sauvegarde de la même Région prend environ 6 heures. Un réviseur FinOps veut que les copies de reprise après sinistre coûtent le moins possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure Amazon EFS replication from the file system to a new replica file system in us-west-2, and fail over to the replica during a disaster.", fr: "Configurer la réplication Amazon EFS du système de fichiers vers un nouveau système de fichiers réplica dans us-west-2, et basculer vers le réplica lors d'un sinistre." }
    - id: b
      text: { en: "Add a copy action to the daily rule of the existing backup plan that copies each recovery point to a backup vault in us-west-2 with a 7-day retention and no cold storage transition.", fr: "Ajouter à la règle quotidienne du plan de sauvegarde existant une action de copie qui copie chaque point de récupération vers un coffre de sauvegarde dans us-west-2 avec une rétention de 7 jours et sans transition vers le stockage à froid." }
    - id: c
      text: { en: "Add a copy action to the daily rule of the existing backup plan that copies each recovery point to a backup vault in us-west-2, moves the copy to cold storage after 1 day, and deletes it after 7 days.", fr: "Ajouter à la règle quotidienne du plan de sauvegarde existant une action de copie qui copie chaque point de récupération vers un coffre de sauvegarde dans us-west-2, déplace la copie vers le stockage à froid après 1 jour et la supprime après 7 jours." }
    - id: d
      text: { en: "Keep the daily backups only in us-east-1 with a 7-day retention, and restore the latest recovery point directly to a new file system in us-west-2 during a disaster.", fr: "Conserver les sauvegardes quotidiennes uniquement en us-east-1 avec une rétention de 7 jours, et restaurer le dernier point de récupération directement vers un nouveau système de fichiers dans us-west-2 lors d'un sinistre." }
answer: { optionId: b }
explanation:
  correct:
    en: "A copy action in an AWS Backup rule copies every daily recovery point to a vault in another Region with its own retention, so us-west-2 always holds 7 days of copies and the 24-hour RPO is met. After the first full copy, later EFS copies to the same Region are incremental, and the 6-hour restore from a vault in us-west-2 fits the 12-hour RTO without paying for a second live file system."
    fr: "Une action de copie dans une règle AWS Backup copie chaque point de récupération quotidien vers un coffre d'une autre Région avec sa propre rétention : us-west-2 détient toujours 7 jours de copies et le RPO de 24 heures est respecté. Après la première copie complète, les copies EFS suivantes vers la même Région sont incrémentielles, et la restauration de 6 heures depuis un coffre de us-west-2 respecte le RTO de 12 heures sans payer un second système de fichiers actif."
  options:
    a:
      en: "EFS replication keeps a full live file system in us-west-2 with an RPO of about 15 minutes, which is far beyond the need and adds the full storage cost of a second file system."
      fr: "La réplication EFS maintient un système de fichiers actif complet dans us-west-2 avec un RPO d'environ 15 minutes, ce qui dépasse largement le besoin et ajoute le coût de stockage complet d'un second système de fichiers."
    c:
      en: "This lifecycle is invalid: recovery points in cold storage must stay there at least 90 days, so the retention must exceed the transition by more than 90 days, which a 7-day retention cannot do."
      fr: "Ce cycle de vie est invalide : les points de récupération en stockage à froid doivent y rester au moins 90 jours, donc la rétention doit dépasser la transition de plus de 90 jours, ce qu'une rétention de 7 jours ne permet pas."
    d:
      en: "If us-east-1 is unavailable, the backups stored only in us-east-1 are unavailable too, so nothing can be restored in us-west-2."
      fr: "Si us-east-1 est indisponible, les sauvegardes stockées uniquement en us-east-1 le sont aussi : rien ne peut être restauré dans us-west-2."
references:
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
  - title: Replicating EFS file systems
    url: https://docs.aws.amazon.com/efs/latest/ug/efs-replication.html
