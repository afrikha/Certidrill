id: sapc03-3c-ddb-standard-ia-history
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's e-commerce platform stores order history in an Amazon DynamoDB table that uses on-demand capacity mode and the DynamoDB Standard table class. The table holds 80 TB, grows by 2 TB each month, and storage now accounts for about 70% of the table's monthly cost. Customers rarely open orders older than a few weeks, but the customer service application must still read any order through the existing DynamoDB API with single-digit millisecond latency. The company does not want to change the application or its data access code. The company wants to reduce the monthly cost of the table.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    La plateforme d'e-commerce d'AnyCompany stocke l'historique des commandes dans une table Amazon DynamoDB qui utilise le mode de capacité à la demande et la classe de table DynamoDB Standard. La table contient 80 To, augmente de 2 To par mois, et le stockage représente désormais environ 70 % de son coût mensuel. Les clients ouvrent rarement des commandes de plus de quelques semaines, mais l'application du service client doit toujours lire n'importe quelle commande via l'API DynamoDB existante avec une latence de quelques millisecondes. L'entreprise ne veut modifier ni l'application ni son code d'accès aux données. L'entreprise veut réduire le coût mensuel de la table.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Switch the table to provisioned capacity mode and purchase DynamoDB reserved capacity for the average read and write throughput.", fr: "Passer la table en mode de capacité provisionnée et acheter de la capacité réservée DynamoDB pour le débit moyen de lecture et d'écriture." }
    - id: b
      text: { en: "Change the table class to DynamoDB Standard-Infrequent Access and keep on-demand capacity mode.", fr: "Changer la classe de la table en DynamoDB Standard-Infrequent Access et conserver le mode de capacité à la demande." }
    - id: c
      text: { en: "Export orders older than 90 days to Amazon S3, delete them from the table with Time to Live, and query the exports with Amazon Athena.", fr: "Exporter les commandes de plus de 90 jours vers Amazon S3, les supprimer de la table avec Time to Live, et interroger les exports avec Amazon Athena." }
    - id: d
      text: { en: "Switch the table to provisioned capacity mode with auto scaling at a 70% target utilization.", fr: "Passer la table en mode de capacité provisionnée avec mise à l'échelle automatique à un taux d'utilisation cible de 70 %." }
answer: { optionId: b }
explanation:
  correct:
    en: "DynamoDB Standard-IA is designed for tables where storage is the dominant cost: storage costs about 60% less than Standard while reads and writes cost about 25% more. With storage at 70% of the bill, the change lowers the total, keeps the same API, performance, and durability, and is a table setting rather than an application change."
    fr: "DynamoDB Standard-IA est conçu pour les tables dont le stockage est le coût dominant : le stockage coûte environ 60 % de moins qu'avec Standard, tandis que les lectures et écritures coûtent environ 25 % de plus. Avec un stockage à 70 % de la facture, le changement réduit le total, conserve la même API, les mêmes performances et la même durabilité, et c'est un paramètre de table, pas une modification de l'application."
  options:
    a:
      en: "Reserved capacity lowers only throughput costs, which are the minor part of this bill, and it requires a steady provisioned workload that the scenario does not describe."
      fr: "La capacité réservée ne réduit que les coûts de débit, qui sont la petite partie de cette facture, et elle exige une charge provisionnée stable que le scénario ne décrit pas."
    c:
      en: "Orders moved to Amazon S3 could no longer be read through the DynamoDB API with single-digit millisecond latency, and the application would need new query code."
      fr: "Les commandes déplacées vers Amazon S3 ne pourraient plus être lues via l'API DynamoDB avec une latence de quelques millisecondes, et l'application aurait besoin d'un nouveau code de requête."
    d:
      en: "Provisioned mode with auto scaling can change throughput costs, but storage, which is 70% of the bill, is priced the same in both capacity modes."
      fr: "Le mode provisionné avec mise à l'échelle automatique peut modifier les coûts de débit, mais le stockage, qui représente 70 % de la facture, a le même prix dans les deux modes de capacité."
references:
  - title: Evaluate your DynamoDB table class selection
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CostOptimization_TableClass.html
  - title: DynamoDB table classes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.TableClasses.html
