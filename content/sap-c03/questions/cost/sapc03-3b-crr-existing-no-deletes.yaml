id: sapc03-3b-crr-existing-no-deletes
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores 300 TB of scanned contracts in an Amazon S3 bucket in eu-west-3, with S3 Versioning enabled. About 1 TB of new scans is added each day.

    A new disaster recovery standard requires a copy of all contracts, including the objects that already exist, in a versioned bucket in eu-west-1. If a user deletes a contract in the source bucket, the copy in eu-west-1 must stay visible so that it can be recovered. The company wants the solution with the lowest cost and the least operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany stocke 300 To de contrats numérisés dans un compartiment Amazon S3 de eu-west-3, avec S3 Versioning activé. Environ 1 To de nouvelles numérisations s'ajoute chaque jour.

    Une nouvelle norme de reprise après sinistre exige une copie de tous les contrats, y compris les objets qui existent déjà, dans un compartiment versionné de eu-west-1. Si un utilisateur supprime un contrat dans le compartiment source, la copie de eu-west-1 doit rester visible pour pouvoir être récupérée. L'entreprise veut la solution au coût le plus bas et à la charge opérationnelle la plus faible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an S3 Cross-Region Replication rule to the eu-west-1 bucket with delete marker replication enabled.", fr: "Créer une règle S3 Cross-Region Replication vers le compartiment de eu-west-1 avec la réplication des marqueurs de suppression activée." } }
    - { id: b, text: { en: "Create an S3 Cross-Region Replication rule to the eu-west-1 bucket with delete marker replication disabled.", fr: "Créer une règle S3 Cross-Region Replication vers le compartiment de eu-west-1 avec la réplication des marqueurs de suppression désactivée." } }
    - { id: c, text: { en: "Enable S3 Replication Time Control on the replication rule so that the existing objects are copied within 15 minutes.", fr: "Activer S3 Replication Time Control sur la règle de réplication pour que les objets existants soient copiés en moins de 15 minutes." } }
    - { id: d, text: { en: "Schedule an AWS DataSync task that copies the whole source bucket to the eu-west-1 bucket every night.", fr: "Planifier une tâche AWS DataSync qui copie chaque nuit tout le compartiment source vers le compartiment de eu-west-1." } }
    - { id: e, text: { en: "Run a one-time S3 Batch Replication job for the objects that existed before the replication rule was created.", fr: "Exécuter une seule fois une tâche S3 Batch Replication pour les objets qui existaient avant la création de la règle de réplication." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A replication rule copies only the objects written after the rule exists, so a one-time S3 Batch Replication job copies the 300 TB already in the bucket by using the same rule. Delete markers are replicated only when delete marker replication is enabled, so leaving it disabled keeps the replicas visible in eu-west-1 when users delete objects in the source. After that, only the daily new objects pay inter-Region transfer.
    fr: |
      Une règle de réplication ne copie que les objets écrits après sa création : une tâche S3 Batch Replication exécutée une fois copie les 300 To déjà présents en utilisant la même règle. Les marqueurs de suppression ne sont répliqués que si la réplication des marqueurs de suppression est activée : en la laissant désactivée, les réplicas restent visibles dans eu-west-1 quand des utilisateurs suppriment des objets dans la source. Ensuite, seuls les nouveaux objets quotidiens paient le transfert entre Régions.
  options:
    a: { en: "With delete marker replication enabled, a user deletion creates a delete marker in eu-west-1 too, so the copy no longer appears as a current object.", fr: "Avec la réplication des marqueurs de suppression activée, une suppression par un utilisateur crée aussi un marqueur de suppression dans eu-west-1 : la copie n'apparaît plus comme objet actuel." }
    c: { en: "S3 Replication Time Control does not apply to existing objects or to Batch Replication, and its per-GB charge brings no benefit here.", fr: "S3 Replication Time Control ne s'applique ni aux objets existants ni à Batch Replication, et ses frais par Go n'apportent rien ici." }
    d: { en: "A nightly DataSync task adds per-GB task charges, repeated scans of 300 TB, and scheduling to operate, while replication already copies new objects.", fr: "Une tâche DataSync nocturne ajoute des frais par Go, des analyses répétées de 300 To et une planification à exploiter, alors que la réplication copie déjà les nouveaux objets." }
references:
  - title: Amazon S3 FAQs
    url: https://aws.amazon.com/s3/faqs/
  - title: Meeting compliance requirements with S3 Replication Time Control
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
