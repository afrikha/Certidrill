id: sapc03-3a-cloudfront-functions-rewrite
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a global retail website behind an Amazon CloudFront distribution that receives millions of requests per second at peak. Before the cache lookup, every request must be normalized: URLs are converted to lowercase, legacy paths are redirected to new paths, and unused query strings are removed to improve the cache hit ratio. The logic is a few lines of JavaScript, finishes in well under a millisecond, and needs neither the request body nor calls to other services. Today, this logic runs on the origin web servers, so every request reaches the origin before it can be cached. The company wants to move the logic to the edge at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un site de vente au détail mondial derrière une distribution Amazon CloudFront qui reçoit des millions de requêtes par seconde en période de pointe. Avant la recherche dans le cache, chaque requête doit être normalisée : les URL sont converties en minuscules, les anciens chemins sont redirigés vers les nouveaux, et les chaînes de requête inutiles sont supprimées pour améliorer le taux d'accès au cache. La logique tient en quelques lignes de JavaScript, s'exécute en bien moins d'une milliseconde et n'a besoin ni du corps de la requête ni d'appels à d'autres services. Aujourd'hui, cette logique s'exécute sur les serveurs web d'origine : chaque requête atteint donc l'origine avant de pouvoir être mise en cache. L'entreprise veut déplacer cette logique en périphérie au coût le plus faible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Implement the logic in a Lambda@Edge function in Node.js, and associate it with the viewer request event of the cache behaviors."
        fr: "Implémenter la logique dans une fonction Lambda@Edge en Node.js, et l'associer à l'événement de requête utilisateur des comportements de cache."
    - id: b
      text:
        en: "Implement the logic as listener rules on the Application Load Balancer of the origin, and enable Origin Shield to absorb the additional origin requests."
        fr: "Implémenter la logique sous forme de règles d'écouteur sur l'Application Load Balancer de l'origine, et activer Origin Shield pour absorber les requêtes supplémentaires vers l'origine."
    - id: c
      text:
        en: "Implement the logic in a CloudFront Functions function, and associate it with the viewer request event of the cache behaviors."
        fr: "Implémenter la logique dans une fonction CloudFront Functions, et l'associer à l'événement de requête utilisateur des comportements de cache."
    - id: d
      text:
        en: "Implement the logic in an AWS Lambda function behind an Amazon API Gateway REST API, and make the API the origin of the distribution."
        fr: "Implémenter la logique dans une fonction AWS Lambda derrière une API REST Amazon API Gateway, et faire de l'API l'origine de la distribution."
answer: { optionId: c }
explanation:
  correct:
    en: "CloudFront Functions run lightweight JavaScript on viewer request and viewer response events with submillisecond execution and scale to millions of requests per second. AWS positions them for cache key normalization, URL rewrites and redirects, and they cost less than Lambda@Edge, so the normalization happens before the cache lookup without reaching the origin."
    fr: "CloudFront Functions exécute du JavaScript léger sur les événements de requête et de réponse utilisateur, en moins d'une milliseconde, et monte jusqu'à des millions de requêtes par seconde. AWS le destine à la normalisation des clés de cache, aux réécritures d'URL et aux redirections, et il coûte moins cher que Lambda@Edge : la normalisation a lieu avant la recherche dans le cache, sans atteindre l'origine."
  options:
    a:
      en: "Lambda@Edge suits longer or heavier logic that needs the request body, network calls or more memory; for this simple logic it costs more and scales to about 10,000 requests per second per Region."
      fr: "Lambda@Edge convient à une logique plus longue ou plus lourde qui a besoin du corps de la requête, d'appels réseau ou de plus de mémoire ; pour cette logique simple, il coûte plus cher et monte à environ 10 000 requêtes par seconde par Région."
    b:
      en: "Rules on the origin load balancer still run after the cache lookup, so non-normalized requests keep fragmenting the cache and reaching the origin."
      fr: "Des règles sur l'équilibreur de charge d'origine s'exécutent toujours après la recherche dans le cache : les requêtes non normalisées continuent de fragmenter le cache et d'atteindre l'origine."
    d:
      en: "An API Gateway origin adds per-request API and Lambda charges and still runs after the cache lookup instead of at the edge."
      fr: "Une origine API Gateway ajoute des frais d'API et de Lambda par requête et s'exécute toujours après la recherche dans le cache, et non en périphérie."
references:
  - title: "Differences between CloudFront Functions and Lambda@Edge"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
