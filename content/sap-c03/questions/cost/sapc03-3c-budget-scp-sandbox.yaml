id: sapc03-3c-budget-scp-sandbox
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations with all features enabled. A Sandbox OU contains 60 member accounts that developers use for experiments, and each account has a monthly spending limit of $3,000. The central cloud team manages billing from the management account and does not want to deploy or maintain code in the sandbox accounts. When the actual monthly cost of a sandbox account reaches its limit, the account must automatically be prevented from launching new resources until the next budget period, and the account owner must be notified by email. Running resources can keep running so that developers can save their work. The other sandbox accounts must not be affected.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise AWS Organizations avec toutes les fonctionnalités activées. Une unité d'organisation Sandbox contient 60 comptes membres que les développeurs utilisent pour leurs expériences, et chaque compte dispose d'une limite de dépenses mensuelle de 3 000 $. L'équipe cloud centrale gère la facturation depuis le compte de gestion et ne veut ni déployer ni maintenir de code dans les comptes sandbox. Lorsque le coût mensuel réel d'un compte sandbox atteint sa limite, ce compte doit automatiquement être empêché de lancer de nouvelles ressources jusqu'à la période budgétaire suivante, et le propriétaire du compte doit être averti par e-mail. Les ressources en cours d'exécution peuvent continuer à fonctionner pour que les développeurs puissent enregistrer leur travail. Les autres comptes sandbox ne doivent pas être affectés.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "In each sandbox account, create an AWS Budgets cost budget of $3,000 with an email alert at 100% of actual cost and a budget action that applies a service control policy that denies resource creation to the account automatically.", fr: "Dans chaque compte sandbox, créer un budget de coûts AWS Budgets de 3 000 $ avec une alerte par e-mail à 100 % du coût réel et une action budgétaire qui applique automatiquement au compte une politique de contrôle des services (SCP) qui refuse la création de ressources." }
    - id: b
      text: { en: "In the management account, create an AWS Cost Anomaly Detection monitor for linked accounts with an SNS topic that invokes an AWS Lambda function, which attaches a service control policy that denies resource creation to the account that has the anomaly.", fr: "Dans le compte de gestion, créer un moniteur AWS Cost Anomaly Detection pour les comptes liés avec une rubrique SNS qui appelle une fonction AWS Lambda, laquelle attache au compte concerné par l'anomalie une politique de contrôle des services (SCP) qui refuse la création de ressources." }
    - id: c
      text: { en: "In the management account, create one AWS Budgets cost budget of $3,000 per sandbox account, filtered on that linked account, with an email alert at 100% of actual cost and an automatic budget action that applies a deny-provisioning service control policy to that account.", fr: "Dans le compte de gestion, créer un budget de coûts AWS Budgets de 3 000 $ par compte sandbox, filtré sur ce compte lié, avec une alerte par e-mail à 100 % du coût réel et une action budgétaire automatique qui applique à ce compte une politique de contrôle des services (SCP) qui interdit le provisionnement." }
    - id: d
      text: { en: "In the management account, create one AWS Budgets cost budget of $3,000 per sandbox account, filtered on that linked account, with an email alert at 100% of actual cost and an automatic budget action that stops the Amazon EC2 and Amazon RDS instances of that account.", fr: "Dans le compte de gestion, créer un budget de coûts AWS Budgets de 3 000 $ par compte sandbox, filtré sur ce compte lié, avec une alerte par e-mail à 100 % du coût réel et une action budgétaire automatique qui arrête les instances Amazon EC2 et Amazon RDS de ce compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "A budget action can apply a service control policy, but only from the management account, which can target another account of the organization. One budget per linked account isolates each sandbox account, the action can run automatically at the actual-cost threshold, and the SCP blocks new provisioning without stopping what already runs. No code is deployed anywhere."
    fr: "Une action budgétaire peut appliquer une politique de contrôle des services (SCP), mais seulement depuis le compte de gestion, qui peut cibler un autre compte de l'organisation. Un budget par compte lié isole chaque compte sandbox, l'action peut s'exécuter automatiquement au seuil de coût réel, et la SCP bloque tout nouveau provisionnement sans arrêter ce qui fonctionne déjà. Aucun code n'est déployé."
  options:
    a:
      en: "SCP budget actions are configured from the management account; a member account cannot apply an SCP to itself. Creating 60 budgets inside the sandbox accounts also contradicts the central management requirement."
      fr: "Les actions budgétaires de type SCP se configurent depuis le compte de gestion : un compte membre ne peut pas s'appliquer une SCP. Créer 60 budgets dans les comptes sandbox contredit en outre l'exigence de gestion centrale."
    b:
      en: "Cost Anomaly Detection reacts to spend that deviates from the usual pattern, not to a fixed $3,000 limit, and the Lambda function is custom code that the team must maintain."
      fr: "Cost Anomaly Detection réagit aux dépenses qui s'écartent du profil habituel, pas à une limite fixe de 3 000 $, et la fonction Lambda est du code personnalisé que l'équipe doit maintenir."
    d:
      en: "A budget action can stop EC2 or RDS instances only in the account that owns the budget, not in another account. Stopping instances also breaks the requirement to keep running resources and does not prevent new launches."
      fr: "Une action budgétaire ne peut arrêter des instances EC2 ou RDS que dans le compte propriétaire du budget, pas dans un autre compte. Arrêter les instances enfreint aussi l'exigence de laisser tourner les ressources existantes et n'empêche pas de nouveaux lancements."
references:
  - title: Configuring budget actions
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-controls.html
