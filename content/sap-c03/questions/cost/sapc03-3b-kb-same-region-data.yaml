id: sapc03-3b-kb-same-region-data
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany keeps 120 TB of engineering manuals in an Amazon S3 bucket in us-east-1, and about 2% of the manuals change each week. The company is building a retrieval-augmented generation (RAG) assistant with Amazon Bedrock Knowledge Bases for its engineers in Europe.

    The assistant's web tier will run in eu-west-1, close to the users; an extra 80 ms per request is acceptable. The manuals have no data residency constraint. Each question and each generated answer is only a few KB. The company wants to minimize data transfer and storage costs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conserve 120 To de manuels techniques dans un compartiment Amazon S3 de us-east-1, et environ 2 % des manuels changent chaque semaine. L'entreprise construit un assistant de génération augmentée par récupération (RAG) avec les bases de connaissances Amazon Bedrock (Amazon Bedrock Knowledge Bases) pour ses ingénieurs en Europe.

    La couche web de l'assistant s'exécutera dans eu-west-1, près des utilisateurs ; 80 ms de plus par requête sont acceptables. Les manuels n'ont aucune contrainte de résidence des données. Chaque question et chaque réponse générée ne fait que quelques Ko. L'entreprise veut réduire au minimum les coûts de transfert de données et de stockage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create the knowledge base and its vector store in us-east-1 with the existing bucket as the data source, and have the eu-west-1 web tier call the knowledge base APIs in us-east-1.", fr: "Créer la base de connaissances et son magasin de vecteurs dans us-east-1 avec le compartiment existant comme source de données, et faire appeler par la couche web de eu-west-1 les API de la base de connaissances dans us-east-1." } }
    - { id: b, text: { en: "Replicate the bucket to a new bucket in eu-west-1 with S3 Cross-Region Replication and S3 Batch Replication, and create the knowledge base and its vector store in eu-west-1.", fr: "Répliquer le compartiment vers un nouveau compartiment de eu-west-1 avec S3 Cross-Region Replication et S3 Batch Replication, et créer la base de connaissances et son magasin de vecteurs dans eu-west-1." } }
    - { id: c, text: { en: "Create the knowledge base and its vector store in eu-west-1, and configure the existing us-east-1 bucket as its S3 data source.", fr: "Créer la base de connaissances et son magasin de vecteurs dans eu-west-1, et configurer le compartiment existant de us-east-1 comme source de données S3." } }
    - { id: d, text: { en: "Create a knowledge base in each of the two Regions, each synchronized from a bucket in its own Region that is kept current with S3 Cross-Region Replication.", fr: "Créer une base de connaissances dans chacune des deux Régions, chacune synchronisée depuis un compartiment de sa propre Région maintenu à jour avec S3 Cross-Region Replication." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An S3 data source must be in the same Region as its knowledge base, so keeping the knowledge base next to the 120 TB of manuals avoids copying them. Only the small questions and answers cross Regions, which costs far less than replicating 120 TB plus weekly changes and storing a second copy. The extra latency is within the accepted 80 ms.
    fr: |
      Une source de données S3 doit être dans la même Région que sa base de connaissances : garder la base de connaissances près des 120 To de manuels évite de les copier. Seules les petites questions et réponses traversent les Régions, ce qui coûte bien moins que répliquer 120 To plus les changements hebdomadaires et stocker une seconde copie. La latence supplémentaire reste dans les 80 ms acceptés.
  options:
    b: { en: "Replication pays inter-Region transfer for 120 TB and every weekly change, and the company pays storage for a second 120 TB copy.", fr: "La réplication paie le transfert entre Régions pour 120 To et chaque changement hebdomadaire, et l'entreprise paie le stockage d'une seconde copie de 120 To." }
    c: { en: "A knowledge base cannot use an S3 bucket in another Region as its data source; the bucket must be in the same Region as the knowledge base.", fr: "Une base de connaissances ne peut pas utiliser comme source de données un compartiment S3 d'une autre Région ; le compartiment doit être dans la même Région que la base de connaissances." }
    d: { en: "Two knowledge bases double the vector store and ingestion costs, and replication still copies 120 TB across Regions.", fr: "Deux bases de connaissances doublent les coûts du magasin de vecteurs et de l'ingestion, et la réplication copie toujours 120 To entre Régions." }
references:
  - title: Connect to Amazon S3 for your knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
