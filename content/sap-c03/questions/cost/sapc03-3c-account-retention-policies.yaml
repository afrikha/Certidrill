id: sapc03-3c-account-retention-policies
objective: "3.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany centralizes application logs in a shared logging account, in Amazon CloudWatch Logs log groups across three AWS Regions. Teams and pipelines create new log groups every day, and most were created without a retention setting, so storage keeps growing. The compliance team requires that no log data be kept longer than 400 days, except log groups whose names start with /audit/, which must keep data for 2,557 days. The rule must apply to existing and future log groups automatically, even if a pipeline sets a different retention on a log group. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany centralise les journaux applicatifs dans un compte de journalisation partagé, dans des groupes de journaux Amazon CloudWatch Logs répartis sur trois Régions AWS. Les équipes et les pipelines créent chaque jour de nouveaux groupes de journaux, et la plupart ont été créés sans paramètre de rétention : le stockage ne cesse donc d'augmenter. L'équipe de conformité exige qu'aucune donnée de journal ne soit conservée plus de 400 jours, sauf dans les groupes de journaux dont le nom commence par /audit/, qui doivent conserver les données 2 557 jours. La règle doit s'appliquer automatiquement aux groupes existants et futurs, même si un pipeline définit une autre rétention sur un groupe de journaux. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EventBridge rule for CreateLogGroup events that invokes an AWS Lambda function to set the retention of each new log group based on its name, and run the function once for existing log groups.", fr: "Créer une règle Amazon EventBridge pour les événements CreateLogGroup qui appelle une fonction AWS Lambda chargée de définir la rétention de chaque nouveau groupe selon son nom, et exécuter la fonction une fois pour les groupes existants." }
    - id: b
      text: { en: "In each Region, create one account-level retention policy of 400 days in RETROACTIVE mode for all log groups, and set a 2,557-day retention directly on each /audit/ log group.", fr: "Dans chaque Région, créer une politique de rétention au niveau du compte de 400 jours en mode RETROACTIVE pour tous les groupes de journaux, et définir directement une rétention de 2 557 jours sur chaque groupe /audit/." }
    - id: c
      text: { en: "In each Region, create two account-level retention policies in RETROACTIVE mode: one of 400 days for all log groups and one of 2,557 days with the /audit/ log group name prefix.", fr: "Dans chaque Région, créer deux politiques de rétention au niveau du compte en mode RETROACTIVE : une de 400 jours pour tous les groupes de journaux et une de 2 557 jours avec le préfixe de nom de groupe /audit/." }
    - id: d
      text: { en: "Deploy an AWS Config custom rule in each Region that flags log groups without the expected retention, with an automatic remediation that runs an AWS Lambda function to correct the setting.", fr: "Déployer dans chaque Région une règle AWS Config personnalisée qui signale les groupes de journaux sans la rétention attendue, avec une correction automatique qui exécute une fonction AWS Lambda pour rectifier le paramètre." }
answer: { optionId: c }
explanation:
  correct:
    en: "An account-level retention policy applies to existing log groups in RETROACTIVE mode and to new ones, can be scoped with a log group name prefix, and overrides the retention set on a log group. Retention policies may overlap, and the longest period wins, so /audit/ log groups get 2,557 days and all others 400 days. Policies are per Region, so each Region needs its own pair."
    fr: "Une politique de rétention au niveau du compte s'applique aux groupes existants en mode RETROACTIVE et aux nouveaux, peut être limitée par un préfixe de nom de groupe, et prime sur la rétention définie sur un groupe. Les politiques de rétention peuvent se chevaucher et la période la plus longue l'emporte : les groupes /audit/ obtiennent 2 557 jours et tous les autres 400 jours. Les politiques sont régionales, chaque Région a donc besoin de sa propre paire."
  options:
    a:
      en: "The function is custom code to maintain, and a pipeline can change the retention after the function runs, so the rule is not enforced."
      fr: "La fonction est du code personnalisé à maintenir, et un pipeline peut modifier la rétention après son exécution : la règle n'est pas imposée."
    b:
      en: "An account-level retention policy overrides a log group's own setting even when that setting is longer, so the /audit/ log groups would lose data older than 400 days."
      fr: "Une politique de rétention au niveau du compte prime sur le paramètre propre d'un groupe même lorsque celui-ci est plus long : les groupes /audit/ perdraient les données de plus de 400 jours."
    d:
      en: "A custom Config rule and remediation function are more components to build and run, and they correct drift only after it is detected."
      fr: "Une règle Config personnalisée et une fonction de correction sont davantage de composants à construire et à exploiter, et elles ne corrigent la dérive qu'après sa détection."
references:
