id: sapc03-3a-analytics-in-data-region
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores an 800 TB data lake in Amazon S3 in the eu-west-1 Region, and the data lake grows by about 30 TB each day. An analytics team in the us-east-1 Region runs daily Amazon EMR jobs that read about 20 TB of mostly recent partitions directly from the eu-west-1 bucket. The jobs produce a few gigabytes of aggregated results that feed dashboards in us-east-1. Data transfer between Regions is now the largest item of the analytics bill. The company has no data residency constraint and wants to reduce the cost with minimal changes to the jobs.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany stocke un lac de données de 800 To dans Amazon S3 dans la Région eu-west-1, et ce lac s'accroît d'environ 30 To par jour. Une équipe d'analyse de la Région us-east-1 exécute chaque jour des tâches Amazon EMR qui lisent environ 20 To de partitions majoritairement récentes directement dans le compartiment eu-west-1. Les tâches produisent quelques gigaoctets de résultats agrégés qui alimentent des tableaux de bord dans us-east-1. Le transfert de données entre Régions est désormais le premier poste de la facture d'analyse. L'entreprise n'a aucune contrainte de résidence des données et veut réduire le coût en modifiant le moins possible les tâches.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Enable S3 Transfer Acceleration on the data lake bucket, and point the EMR jobs in us-east-1 to the accelerated endpoint."
        fr: "Activer S3 Transfer Acceleration sur le compartiment du lac de données, et diriger les tâches EMR de us-east-1 vers le point de terminaison accéléré."
    - id: b
      text:
        en: "Configure S3 Cross-Region Replication of the whole data lake bucket to a new bucket in us-east-1, and run the EMR jobs against the replica."
        fr: "Configurer S3 Cross-Region Replication de tout le compartiment du lac de données vers un nouveau compartiment dans us-east-1, et exécuter les tâches EMR sur la réplique."
    - id: c
      text:
        en: "Run the EMR jobs on a cluster in eu-west-1 next to the data, and write only the aggregated results to a bucket in us-east-1 for the dashboards."
        fr: "Exécuter les tâches EMR sur un cluster de eu-west-1, à côté des données, et n'écrire que les résultats agrégés dans un compartiment de us-east-1 pour les tableaux de bord."
    - id: d
      text:
        en: "Create an inter-Region VPC peering connection to a VPC in eu-west-1 with an S3 interface endpoint, and route the EMR reads through the peering connection."
        fr: "Créer une connexion d'appairage de VPC (VPC peering) entre Régions vers un VPC de eu-west-1 doté d'un point de terminaison d'interface S3, et faire passer les lectures EMR par cette connexion."
answer: { optionId: c }
explanation:
  correct:
    en: "Moving data between Regions typically incurs charges, so processing the data in the Region where it is stored keeps the 20 TB of daily reads inside eu-west-1. Only a few gigabytes of results cross the Region boundary each day, and the jobs themselves do not change."
    fr: "Le transfert de données entre Régions est généralement facturé : traiter les données dans la Région où elles sont stockées garde les 20 To de lectures quotidiennes dans eu-west-1. Seuls quelques gigaoctets de résultats franchissent la frontière de Région chaque jour, et les tâches elles-mêmes ne changent pas."
  options:
    a:
      en: "Transfer Acceleration speeds up transfers over long distances but adds its own per-GB charge on top of the inter-Region transfer."
      fr: "Transfer Acceleration accélère les transferts sur de longues distances mais ajoute ses propres frais par Go en plus du transfert entre Régions."
    b:
      en: "Replicating the whole bucket transfers about 30 TB of new data across Regions every day, more than the 20 TB read today, and duplicates 800 TB of storage."
      fr: "Répliquer tout le compartiment transfère chaque jour environ 30 To de nouvelles données entre Régions, plus que les 20 To lus aujourd'hui, et duplique 800 To de stockage."
    d:
      en: "Inter-Region peering still transfers the 20 TB between Regions every day, and the interface endpoint adds hourly and per-GB charges."
      fr: "L'appairage entre Régions transfère toujours les 20 To entre Régions chaque jour, et le point de terminaison d'interface ajoute des frais horaires et par Go."
references:
  - title: "COST08-BP02 Select components to optimize data transfer cost"
    url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/cost_data_transfer_optimized_components.html
