id: sapc03-3b-launch-template-volume-tags
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 60 Amazon EC2 Auto Scaling groups across its workload accounts. Each group has CostCenter and Application tags with tag propagation to instances enabled, and the instances use large gp3 data volumes that are created at launch.

    In the CUR 2.0 export, instance costs are allocated correctly, but the EBS volume costs of these groups appear untagged. The FinOps team requires that every new instance and every volume created with it carry the CostCenter and Application tags from the moment they are created, so that no hour of cost is left unallocated. The team wants the solution with the least ongoing operational effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite 60 groupes Amazon EC2 Auto Scaling dans ses comptes de charges de travail. Chaque groupe porte des balises CostCenter et Application avec la propagation des balises vers les instances activée, et les instances utilisent de gros volumes de données gp3 créés au lancement.

    Dans l'export CUR 2.0, les coûts des instances sont correctement répartis, mais les coûts des volumes EBS de ces groupes apparaissent sans balise. L'équipe FinOps exige que chaque nouvelle instance et chaque volume créé avec elle portent les balises CostCenter et Application dès leur création, afin qu'aucune heure de coût ne reste non répartie. L'équipe veut la solution qui demande le moins d'effort opérationnel continu.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the AWS Config required-tags rule for EBS volumes with an automatic remediation that adds the missing tags to noncompliant volumes.", fr: "Déployer la règle AWS Config required-tags pour les volumes EBS avec une correction automatique qui ajoute les balises manquantes aux volumes non conformes." } }
    - { id: b, text: { en: "Schedule an AWS Lambda function that runs every hour in each account and copies the tags of each instance to its attached volumes.", fr: "Planifier une fonction AWS Lambda qui s'exécute toutes les heures dans chaque compte et copie les balises de chaque instance sur ses volumes attachés." } }
    - { id: c, text: { en: "Activate the AWS-generated aws:createdBy cost allocation tag, and allocate the volume costs to the Auto Scaling service role that creates them.", fr: "Activer la balise de répartition des coûts générée par AWS aws:createdBy, et répartir les coûts des volumes vers le rôle de service Auto Scaling qui les crée." } }
    - { id: d, text: { en: "Add CostCenter and Application tag specifications for the volume resource type to the launch templates, and point each Auto Scaling group to the new template version.", fr: "Ajouter aux modèles de lancement des spécifications de balises CostCenter et Application pour le type de ressource volume, et faire pointer chaque groupe Auto Scaling vers la nouvelle version du modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Auto Scaling group tags propagate to instances but not to Amazon EBS volumes; to tag volumes, the tags must be specified in the launch template. Tag specifications for the volume resource type are applied in the same launch request, so the volumes are tagged from their first hour of cost. After the templates are updated, no further process is needed.
    fr: |
      Les balises d'un groupe Auto Scaling se propagent aux instances mais pas aux volumes Amazon EBS ; pour baliser les volumes, les balises doivent être indiquées dans le modèle de lancement. Les spécifications de balises pour le type de ressource volume s'appliquent dans la même requête de lancement : les volumes sont balisés dès leur première heure de coût. Une fois les modèles mis à jour, aucun autre processus n'est nécessaire.
  options:
    a: { en: "AWS Config detects missing tags after the volume exists, so costs are untagged until remediation runs, and the remediation must be built and operated.", fr: "AWS Config détecte les balises manquantes après la création du volume : les coûts restent non balisés jusqu'à l'exécution de la correction, qu'il faut concevoir et exploiter." }
    b: { en: "Volumes stay untagged until the next run, and a scheduled function in every account is ongoing code to operate.", fr: "Les volumes restent sans balise jusqu'à l'exécution suivante, et une fonction planifiée dans chaque compte est du code à exploiter en continu." }
    c: { en: "aws:createdBy identifies the creating principal, which is the same Auto Scaling role for all groups, so it gives no CostCenter or Application.", fr: "aws:createdBy identifie le principal créateur, qui est le même rôle Auto Scaling pour tous les groupes : il ne donne ni CostCenter ni Application." }
references:
  - title: Tag Auto Scaling groups and instances
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-tagging.html
