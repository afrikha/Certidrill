id: sapc03-3b-global-cris-scp
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an internal document summarization service in eu-west-1 that calls a foundation model in Amazon Bedrock on demand. After a legal review, the company confirmed that this workload has no data residency constraint. To lower its token cost and raise throughput, the team wants to invoke the model through the global cross-Region inference profile, which is priced about 10% below geographic profiles.

    The workload account is in an organizational unit (OU) with a service control policy (SCP) that denies all actions, except for global services, when aws:RequestedRegion is not eu-west-1 or eu-central-1. The other workloads in the OU have residency constraints and must remain restricted to those two Regions.

    Which solution will meet these requirements with the LEAST effect on the existing guardrails?
  fr: |
    AnyCompany exploite dans eu-west-1 un service interne de synthèse de documents qui appelle à la demande un modèle de fondation d'Amazon Bedrock. Après une revue juridique, l'entreprise a confirmé que cette charge de travail n'a aucune contrainte de résidence des données. Pour réduire le coût des jetons et augmenter le débit, l'équipe veut appeler le modèle par le profil d'inférence entre Régions global, facturé environ 10 % moins cher que les profils géographiques.

    Le compte de la charge de travail se trouve dans une unité d'organisation (UO) dotée d'une politique de contrôle des services (SCP) qui refuse toutes les actions, sauf pour les services globaux, lorsque aws:RequestedRegion n'est ni eu-west-1 ni eu-central-1. Les autres charges de travail de l'UO ont des contraintes de résidence et doivent rester limitées à ces deux Régions.

    Quelle solution répond à ces exigences avec le MOINS d'effet sur les garde-fous existants ?
body:
  options:
    - { id: a, text: { en: "Add every commercial AWS Region that the global profile can route to the list of allowed values for aws:RequestedRegion in the SCP.", fr: "Ajouter à la liste des valeurs autorisées de aws:RequestedRegion dans la SCP chaque Région AWS commerciale vers laquelle le profil global peut acheminer les requêtes." } }
    - { id: b, text: { en: "Invoke the EU geographic cross-Region inference profile instead, and add its destination Regions to the allowed values for aws:RequestedRegion in the SCP.", fr: "Appeler plutôt le profil d'inférence entre Régions géographique EU, et ajouter ses Régions de destination aux valeurs autorisées de aws:RequestedRegion dans la SCP." } }
    - { id: c, text: { en: "Change the SCP so that Bedrock inference actions are not denied when aws:RequestedRegion is \"unspecified\", and invoke the global profile from eu-west-1.", fr: "Modifier la SCP pour que les actions d'inférence Bedrock ne soient pas refusées lorsque aws:RequestedRegion vaut « unspecified », et appeler le profil global depuis eu-west-1." } }
    - { id: d, text: { en: "Move the workload account to a new OU that has no Region-restriction SCP, and invoke the global profile from eu-west-1.", fr: "Déplacer le compte de la charge de travail vers une nouvelle UO sans SCP de restriction de Région, et appeler le profil global depuis eu-west-1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For global cross-Region inference, the Bedrock documentation states that a Region-deny SCP must allow aws:RequestedRegion with the value "unspecified" for the inference requests. Scoping the exception to Bedrock inference keeps every other action in the OU limited to eu-west-1 and eu-central-1. The global profile gives about 10% savings, and the price is calculated from the source Region in which it is invoked.
    fr: |
      Pour l'inférence entre Régions globale, la documentation de Bedrock indique qu'une SCP qui refuse des Régions doit autoriser aws:RequestedRegion avec la valeur « unspecified » pour les requêtes d'inférence. Limiter l'exception à l'inférence Bedrock laisse toutes les autres actions de l'UO restreintes à eu-west-1 et eu-central-1. Le profil global offre environ 10 % d'économie, et le prix est calculé à partir de la Région source dans laquelle il est appelé.
  options:
    a: { en: "Opening every commercial Region in the SCP removes the residency guardrail for all the other workloads of the OU, and global routing is matched on \"unspecified\" rather than on a Region list.", fr: "Ouvrir toutes les Régions commerciales dans la SCP supprime le garde-fou de résidence pour toutes les autres charges de travail de l'UO, et le routage global correspond à « unspecified » plutôt qu'à une liste de Régions." }
    b: { en: "Geographic profiles are billed at standard pricing, so the workload would not get the lower token price that the team wants.", fr: "Les profils géographiques sont facturés au tarif standard : la charge de travail n'obtiendrait pas le prix des jetons plus bas que l'équipe souhaite." }
    d: { en: "Removing the account from the Region-restriction SCP drops all Region guardrails for every service in that account, not only for Bedrock inference.", fr: "Retirer le compte de la SCP de restriction de Région supprime tous les garde-fous de Région pour tous les services de ce compte, pas seulement pour l'inférence Bedrock." }
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
