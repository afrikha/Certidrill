id: sapc03-3a-origin-request-policy
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves its product catalog pages through an Amazon CloudFront distribution in front of an Application Load Balancer. The pages vary only by the lang query string parameter. The origin application also needs the campaign query string parameter and the CloudFront-Viewer-Country header to log marketing analytics, but these values do not change the page content. To deliver these values, the current cache policy includes all query strings and the CloudFront-Viewer-Country header in the cache key. The cache hit ratio is below 20%, and the origin fleet is sized for the resulting load. The company wants to reduce origin costs while the origin keeps receiving the analytics values.

    Which solution will meet these requirements?
  fr: |
    AnyCompany diffuse les pages de son catalogue produits via une distribution Amazon CloudFront placée devant un Application Load Balancer. Les pages ne varient que selon le paramètre de chaîne de requête lang. L'application d'origine a aussi besoin du paramètre de chaîne de requête campaign et de l'en-tête CloudFront-Viewer-Country pour journaliser des analyses marketing, mais ces valeurs ne modifient pas le contenu des pages. Pour transmettre ces valeurs, la politique de cache actuelle inclut toutes les chaînes de requête et l'en-tête CloudFront-Viewer-Country dans la clé de cache. Le taux d'accès au cache est inférieur à 20 %, et la flotte d'origine est dimensionnée pour la charge qui en résulte. L'entreprise veut réduire les coûts de l'origine tout en continuant à transmettre les valeurs d'analyse à l'origine.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Limit the cache key to the lang query string, and add an origin request policy that forwards the campaign query string and the CloudFront-Viewer-Country header."
        fr: "Limiter la clé de cache à la chaîne de requête lang, et ajouter une politique de requête d'origine qui transmet la chaîne de requête campaign et l'en-tête CloudFront-Viewer-Country."
    - id: b
      text:
        en: "Keep the cache policy, and increase its minimum and default TTL values so that each cached variant stays at the edge locations for longer."
        fr: "Conserver la politique de cache, et augmenter ses valeurs de TTL minimale et par défaut pour que chaque variante en cache reste plus longtemps dans les emplacements périphériques."
    - id: c
      text:
        en: "Change the cache policy so that the cache key includes only the lang query string, and stop forwarding all other query strings and headers to the origin."
        fr: "Modifier la politique de cache pour que la clé de cache n'inclue que la chaîne de requête lang, et cesser de transmettre toutes les autres chaînes de requête et tous les autres en-têtes à l'origine."
    - id: d
      text:
        en: "Add a CloudFront Functions viewer request function that removes the campaign query string and the CloudFront-Viewer-Country header before the cache lookup."
        fr: "Ajouter une fonction CloudFront Functions de requête utilisateur qui supprime la chaîne de requête campaign et l'en-tête CloudFront-Viewer-Country avant la recherche dans le cache."
answer: { optionId: a }
explanation:
  correct:
    en: "Fewer values in the cache key raise the cache hit ratio, so a cache key with only lang serves most requests from the edge and lowers the origin load. An origin request policy forwards additional query strings and headers to the origin on cache misses without adding them to the cache key, so the origin still receives the analytics values."
    fr: "Moins de valeurs dans la clé de cache augmentent le taux d'accès au cache : une clé limitée à lang sert la plupart des requêtes depuis les emplacements périphériques et réduit la charge de l'origine. Une politique de requête d'origine transmet à l'origine des chaînes de requête et des en-têtes supplémentaires lors des échecs d'accès au cache sans les ajouter à la clé de cache : l'origine reçoit donc toujours les valeurs d'analyse."
  options:
    b:
      en: "Longer TTLs do not merge the variants created by campaign values and countries, so the cache stays fragmented and the hit ratio stays low."
      fr: "Des TTL plus longues ne fusionnent pas les variantes créées par les valeurs campaign et les pays : le cache reste fragmenté et le taux d'accès reste faible."
    c:
      en: "Removing the values from the cache key is right, but no longer forwarding them means the origin loses the analytics data it needs."
      fr: "Retirer les valeurs de la clé de cache est correct, mais ne plus les transmettre prive l'origine des données d'analyse dont elle a besoin."
    d:
      en: "Removing the values in a viewer request function improves the hit ratio, but the origin never receives them, which breaks the analytics requirement."
      fr: "Supprimer les valeurs dans une fonction de requête utilisateur améliore le taux d'accès, mais l'origine ne les reçoit jamais, ce qui enfreint l'exigence d'analyse."
references:
  - title: "Control origin requests with a policy"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html
  - title: "Control the cache key with a policy"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html
