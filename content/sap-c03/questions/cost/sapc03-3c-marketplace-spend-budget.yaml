id: sapc03-3c-marketplace-spend-budget
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany buys several third-party SaaS products and data feeds through AWS Marketplace, and all charges are billed to the management account of its organization. The company also uses AWS Cost Anomaly Detection with an AWS managed monitor for AWS services, which works well for its AWS service spend. Last quarter, a new Marketplace SaaS contract doubled the Marketplace charges and nobody was alerted until the invoice arrived. Finance now wants an email and an Amazon SNS notification whenever total AWS Marketplace charges for the month are predicted to exceed $50,000. The solution must cover every Marketplace product and must not require custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany achète plusieurs produits SaaS et flux de données tiers via AWS Marketplace, et tous les frais sont facturés au compte de gestion de son organisation. L'entreprise utilise aussi AWS Cost Anomaly Detection avec un moniteur géré par AWS pour les services AWS, qui fonctionne bien pour ses dépenses de services AWS. Le trimestre dernier, un nouveau contrat SaaS Marketplace a doublé les frais Marketplace et personne n'a été alerté avant l'arrivée de la facture. La finance veut désormais un e-mail et une notification Amazon SNS chaque fois que le total prévu des frais AWS Marketplace du mois dépasse 50 000 $. La solution doit couvrir tous les produits Marketplace et ne doit nécessiter aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an individual alert subscription with a $50,000 absolute threshold to the existing AWS managed monitor, and send the alerts to the SNS topic and to the finance email address.", fr: "Ajouter au moniteur géré par AWS existant un abonnement aux alertes individuelles avec un seuil absolu de 50 000 $, et envoyer les alertes à la rubrique SNS et à l'adresse e-mail de la finance." }
    - id: b
      text: { en: "Create a cost category that groups the Marketplace products, create a Cost Anomaly Detection monitor for that cost category, and add an individual alert subscription to the SNS topic.", fr: "Créer une catégorie de coûts qui regroupe les produits Marketplace, créer un moniteur Cost Anomaly Detection pour cette catégorie de coûts et ajouter un abonnement aux alertes individuelles vers la rubrique SNS." }
    - id: c
      text: { en: "Create a monthly AWS Budgets cost budget of $50,000 filtered on the Subscription charge type, with a forecasted-cost alert at 100% sent to the finance email address and the SNS topic.", fr: "Créer un budget de coûts AWS Budgets mensuel de 50 000 $ filtré sur le type de frais Subscription, avec une alerte de coût prévu à 100 % envoyée à l'adresse e-mail de la finance et à la rubrique SNS." }
    - id: d
      text: { en: "Create a monthly AWS Budgets cost budget of $50,000 filtered on the AWS Marketplace billing entity, with a forecasted-cost alert at 100% sent to the finance email address and the SNS topic.", fr: "Créer un budget de coûts AWS Budgets mensuel de 50 000 $ filtré sur l'entité de facturation AWS Marketplace, avec une alerte de coût prévu à 100 % envoyée à l'adresse e-mail de la finance et à la rubrique SNS." }
answer: { optionId: d }
explanation:
  correct:
    en: "The Billing entity filter of AWS Budgets separates AWS Marketplace purchases from other AWS services, so the budget tracks exactly the Marketplace charges. A forecasted-cost alert fires before the spend accrues, and an alert can notify both email recipients and an SNS topic."
    fr: "Le filtre Billing entity d'AWS Budgets sépare les achats AWS Marketplace des autres services AWS : le budget suit exactement les frais Marketplace. Une alerte de coût prévu se déclenche avant que la dépense ne soit engagée, et une alerte peut avertir à la fois des destinataires e-mail et une rubrique SNS."
  options:
    a:
      en: "Cost Anomaly Detection does not monitor third-party AWS Marketplace products, except third-party foundation models on Amazon Bedrock, and an anomaly threshold is not a forecast of the monthly total."
      fr: "Cost Anomaly Detection ne surveille pas les produits tiers d'AWS Marketplace, sauf les modèles de fondation tiers d'Amazon Bedrock, et un seuil d'anomalie n'est pas une prévision du total mensuel."
    b:
      en: "Grouping the products in a cost category does not change what Cost Anomaly Detection monitors: third-party Marketplace charges are still excluded, and anomalies are not forecasts against a $50,000 limit."
      fr: "Regrouper les produits dans une catégorie de coûts ne change pas ce que surveille Cost Anomaly Detection : les frais Marketplace tiers restent exclus, et les anomalies ne sont pas des prévisions par rapport à une limite de 50 000 $."
    c:
      en: "The charge type filter does not identify Marketplace purchases; the billing entity dimension is the one that distinguishes AWS Marketplace from other AWS services, so this budget can include other charges and miss Marketplace usage fees."
      fr: "Le filtre de type de frais n'identifie pas les achats Marketplace : c'est la dimension d'entité de facturation qui distingue AWS Marketplace des autres services AWS, ce budget peut donc inclure d'autres frais et manquer des frais d'utilisation Marketplace."
references:
  - title: Detecting unusual spend with AWS Cost Anomaly Detection
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
  - title: Budget filters
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-create-filters.html
