id: sapc03-3b-inspection-bypass
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a centralized inspection design in eu-central-1. All traffic between spoke VPCs and all internet-bound traffic is routed by an AWS Transit Gateway through an inspection VPC attachment, where AWS Network Firewall inspects it before it returns to the transit gateway.

    The orders VPC and the payments VPC exchange about 250 TB each month. The security team has classified this flow as trusted and approved that it bypass inspection; all other east-west and egress traffic, including traffic between these two VPCs and any other spoke, must stay inspected. Transit gateway flow logs must keep recording every flow between VPCs, so VPC peering is not allowed. The company wants the lowest cost for the orders-payments flow.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une conception d'inspection centralisée dans eu-central-1. Tout le trafic entre VPC spoke et tout le trafic vers Internet est acheminé par une passerelle AWS Transit Gateway vers un attachement de VPC d'inspection, où AWS Network Firewall l'inspecte avant qu'il ne revienne à la passerelle de transit.

    Le VPC des commandes et le VPC des paiements échangent environ 250 To par mois. L'équipe de sécurité a classé ce flux comme fiable et a approuvé qu'il contourne l'inspection ; tout autre trafic est-ouest et sortant, y compris le trafic entre ces deux VPC et n'importe quel autre spoke, doit rester inspecté. Les journaux de flux de la passerelle de transit doivent continuer à enregistrer chaque flux entre VPC : l'appairage de VPC n'est donc pas autorisé. L'entreprise veut le coût le plus bas pour le flux commandes-paiements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a VPC peering connection between the orders and payments VPCs, and route the traffic between the two VPCs over the peering connection.", fr: "Créer une connexion d'appairage de VPC entre les VPC des commandes et des paiements, et acheminer le trafic entre les deux VPC par cette connexion." } }
    - { id: b, text: { en: "Deploy Network Firewall endpoints inside the orders and payments VPCs, and inspect their traffic locally before sending it to the transit gateway.", fr: "Déployer des points de terminaison Network Firewall dans les VPC des commandes et des paiements, et inspecter leur trafic localement avant de l'envoyer à la passerelle de transit." } }
    - { id: c, text: { en: "Enable appliance mode on the inspection VPC attachment so that the orders-payments flow uses the same firewall endpoint in both directions.", fr: "Activer le mode appliance sur l'attachement du VPC d'inspection pour que le flux commandes-paiements utilise le même point de terminaison de pare-feu dans les deux sens." } }
    - { id: d, text: { en: "Associate the orders and payments attachments with a new route table that routes their CIDR blocks directly to each other and all other destinations to inspection.", fr: "Associer les attachements des commandes et des paiements à une nouvelle table de routage qui achemine leurs blocs CIDR directement l'un vers l'autre et toutes les autres destinations vers l'inspection." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Transit gateway data processing is charged on each GB sent into the transit gateway from an attachment, including the inspection VPC attachment. An inspected flow is therefore processed twice by the transit gateway and once by Network Firewall, while a direct route between the two attachments is processed once and skips the firewall charge. Routing only these two CIDR blocks directly keeps every other destination on the inspection path, and the traffic still crosses the transit gateway, so flow logs record it.
    fr: |
      Le traitement des données de la passerelle de transit est facturé pour chaque Go envoyé dans la passerelle de transit par un attachement, y compris l'attachement du VPC d'inspection. Un flux inspecté est donc traité deux fois par la passerelle de transit et une fois par Network Firewall, tandis qu'une route directe entre les deux attachements n'est traitée qu'une fois et évite les frais du pare-feu. N'acheminer directement que ces deux blocs CIDR laisse toutes les autres destinations sur le chemin d'inspection, et le trafic traverse toujours la passerelle de transit : les journaux de flux l'enregistrent.
  options:
    a: { en: "Traffic over a peering connection does not cross the transit gateway, so transit gateway flow logs would no longer record it, which the stem forbids.", fr: "Le trafic d'une connexion d'appairage ne traverse pas la passerelle de transit : les journaux de flux de la passerelle de transit ne l'enregistreraient plus, ce que l'énoncé interdit." }
    b: { en: "Local firewall endpoints add endpoint hours and per-GB firewall processing to a flow that does not need inspection, and the transit gateway still processes the traffic.", fr: "Des points de terminaison de pare-feu locaux ajoutent des heures de point de terminaison et un traitement par Go du pare-feu à un flux qui n'a pas besoin d'inspection, et la passerelle de transit traite toujours le trafic." }
    c: { en: "Appliance mode keeps flows symmetric through one firewall endpoint; it does not remove the second transit gateway pass or the firewall processing charge.", fr: "Le mode appliance garde les flux symétriques via un seul point de terminaison de pare-feu ; il ne supprime ni le second passage par la passerelle de transit ni les frais de traitement du pare-feu." }
references:
  - title: AWS Transit Gateway pricing
    url: https://aws.amazon.com/transit-gateway/pricing/
  - title: Flexible cost allocation
    url: https://docs.aws.amazon.com/vpc/latest/tgw/metering-policy.html
