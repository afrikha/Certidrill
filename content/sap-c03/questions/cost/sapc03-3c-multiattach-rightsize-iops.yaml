id: sapc03-3c-multiattach-rightsize-iops
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a clustered trading-reference application on eight Nitro-based Amazon EC2 instances in one Availability Zone. The instances share a single 2 TiB Provisioned IOPS SSD (io2) Block Express volume through EBS Multi-Attach, and a cluster-aware file system coordinates writes. The volume was provisioned with 60,000 IOPS three years ago, but six months of CloudWatch data show peaks of 14,000 IOPS. The architecture review board requires that the application keep a single shared block volume, because the vendor supports no other storage design. The company wants to reduce the storage cost of this volume.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany exécute une application de référentiel de négociation en cluster sur huit instances Amazon EC2 basées sur Nitro dans une zone de disponibilité. Les instances partagent un unique volume Provisioned IOPS SSD (io2) Block Express de 2 Tio via EBS Multi-Attach, et un système de fichiers compatible cluster coordonne les écritures. Le volume a été provisionné avec 60 000 IOPS il y a trois ans, mais six mois de données CloudWatch montrent des pics de 14 000 IOPS. Le comité d'architecture exige que l'application conserve un seul volume en mode bloc partagé, car l'éditeur ne prend en charge aucune autre conception de stockage. L'entreprise veut réduire le coût de stockage de ce volume.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Modify the volume to General Purpose SSD (gp3) with 16,000 IOPS and keep Multi-Attach enabled.", fr: "Modifier le volume en General Purpose SSD (gp3) avec 16 000 IOPS et conserver Multi-Attach activé." }
    - id: b
      text: { en: "Keep the io2 Block Express volume with Multi-Attach and reduce its provisioned IOPS to 16,000.", fr: "Conserver le volume io2 Block Express avec Multi-Attach et réduire ses IOPS provisionnées à 16 000." }
    - id: c
      text: { en: "Replace the shared volume with an Amazon EFS file system that uses Elastic throughput, mounted on all eight instances.", fr: "Remplacer le volume partagé par un système de fichiers Amazon EFS en débit Elastic, monté sur les huit instances." }
    - id: d
      text: { en: "Modify the volume to Provisioned IOPS SSD (io1) with 16,000 IOPS, because io1 has a lower durability target and price.", fr: "Modifier le volume en Provisioned IOPS SSD (io1) avec 16 000 IOPS, car io1 a un objectif de durabilité et un prix inférieurs." }
answer: { optionId: b }
explanation:
  correct:
    en: "Multi-Attach is supported only on io1 and io2 volumes, so the shared block design must stay on Provisioned IOPS SSD. Provisioned IOPS are billed whether or not they are used; lowering them from 60,000 to 16,000 keeps headroom above the 14,000 IOPS peak and removes most of the IOPS charge."
    fr: "Multi-Attach n'est pris en charge que sur les volumes io1 et io2 : la conception en bloc partagé doit rester sur Provisioned IOPS SSD. Les IOPS provisionnées sont facturées qu'elles soient utilisées ou non : les abaisser de 60 000 à 16 000 garde une marge au-dessus du pic de 14 000 IOPS et supprime l'essentiel des frais d'IOPS."
  options:
    a:
      en: "gp3 volumes do not support Multi-Attach, so the eight instances could no longer share the volume."
      fr: "Les volumes gp3 ne prennent pas en charge Multi-Attach : les huit instances ne pourraient plus partager le volume."
    c:
      en: "Amazon EFS is a file service, not a shared block volume, so it breaks the vendor-supported design that the review board requires."
      fr: "Amazon EFS est un service de fichiers, pas un volume en mode bloc partagé : il enfreint la conception prise en charge par l'éditeur qu'exige le comité d'architecture."
    d:
      en: "Changing to io1 brings no meaningful saving over io2 at the same IOPS and lowers durability from 99.999% to 99.8–99.9%; the saving comes from removing unused IOPS, not from the type."
      fr: "Passer à io1 n'apporte pas d'économie significative par rapport à io2 au même nombre d'IOPS et réduit la durabilité de 99,999 % à 99,8–99,9 % : l'économie vient de la suppression des IOPS inutilisées, pas du type."
references:
