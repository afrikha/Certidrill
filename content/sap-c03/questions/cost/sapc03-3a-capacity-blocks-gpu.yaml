id: sapc03-3a-capacity-blocks-gpu
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AI platform team in the us-east-2 Region must fine-tune a foundation model on 16 p5.48xlarge instances. The job starts in 3 weeks and runs for 10 consecutive days. The job saves checkpoints, but every interruption delays the project by about a day, so the instances must not be interrupted once the job starts. The instances must be placed close together for low-latency networking between nodes. After the job ends, the team expects no GPU usage for at least 6 months. The finance team does not want to pay for any GPU capacity outside the 10 days.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    L'équipe de plateforme d'IA d'AnyCompany dans la Région us-east-2 doit affiner (fine-tune) un modèle de fondation sur 16 instances p5.48xlarge. La tâche commence dans 3 semaines et dure 10 jours consécutifs. Elle enregistre des points de contrôle, mais chaque interruption retarde le projet d'environ une journée : les instances ne doivent donc pas être interrompues une fois la tâche lancée. Les instances doivent être placées à proximité les unes des autres pour un réseau à faible latence entre les nœuds. Après la tâche, l'équipe ne prévoit aucune utilisation de GPU pendant au moins 6 mois. L'équipe financière ne veut payer aucune capacité GPU en dehors de ces 10 jours.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Create a future-dated On-Demand Capacity Reservation for 16 p5.48xlarge instances that starts on the first day of the job, and cancel the reservation when the job ends."
        fr: "Créer une réservation de capacité à la demande (On-Demand Capacity Reservation) future pour 16 instances p5.48xlarge qui commence le premier jour de la tâche, puis annuler la réservation à la fin de la tâche."
    - id: b
      text:
        en: "Request 16 p5.48xlarge Spot Instances through an EC2 Fleet with the capacity-optimized allocation strategy, and resume the job from the latest checkpoint after each interruption."
        fr: "Demander 16 instances Spot p5.48xlarge via une EC2 Fleet avec la stratégie d'allocation capacity-optimized, et reprendre la tâche depuis le dernier point de contrôle après chaque interruption."
    - id: c
      text:
        en: "Purchase an EC2 Capacity Block for ML for 16 p5.48xlarge instances for the 10 days of the job, and launch the instances by targeting the Capacity Block reservation ID."
        fr: "Acheter un EC2 Capacity Block for ML pour 16 instances p5.48xlarge pour les 10 jours de la tâche, et lancer les instances en ciblant l'ID de réservation du Capacity Block."
    - id: d
      text:
        en: "Purchase a 1-year Compute Savings Plan sized for 16 p5.48xlarge instances, and launch On-Demand Instances in a cluster placement group when the job starts."
        fr: "Acheter un Compute Savings Plan sur 1 an dimensionné pour 16 instances p5.48xlarge, et lancer des instances à la demande dans un groupe de placement de cluster au démarrage de la tâche."
answer: { optionId: c }
explanation:
  correct:
    en: "Capacity Blocks for ML reserve GPU instances such as p5.48xlarge for a future date (up to 8 weeks ahead) for short-duration ML workloads, and you pay only for the reserved period. Instances in a block are colocated in EC2 UltraClusters for low-latency networking, and they are not interrupted during the block."
    fr: "Les Capacity Blocks for ML réservent des instances GPU telles que p5.48xlarge pour une date future (jusqu'à 8 semaines à l'avance) pour des charges de travail ML de courte durée, et seule la période réservée est payée. Les instances d'un bloc sont regroupées dans des EC2 UltraClusters pour un réseau à faible latence, et elles ne sont pas interrompues pendant la durée du bloc."
  options:
    a:
      en: "Future-dated Capacity Reservations are offered only for C, G, I, M, R, T, U and X instance families, not for P instances, and they carry a commitment duration during which they cannot be reduced."
      fr: "Les réservations de capacité futures ne sont proposées que pour les familles d'instances C, G, I, M, R, T, U et X, pas pour les instances P, et elles comportent une durée d'engagement pendant laquelle elles ne peuvent pas être réduites."
    b:
      en: "Spot Instances can be reclaimed at any time, which breaks the requirement that the job must not be interrupted once it starts."
      fr: "Les instances Spot peuvent être récupérées à tout moment, ce qui enfreint l'exigence selon laquelle la tâche ne doit pas être interrompue une fois lancée."
    d:
      en: "A Savings Plan gives a discount but reserves no capacity, and its 1-year hourly commitment would be paid during the months when no GPU is used."
      fr: "Un Savings Plan accorde une remise mais ne réserve aucune capacité, et son engagement horaire sur 1 an serait payé pendant les mois sans utilisation de GPU."
references:
  - title: "Capacity Blocks for ML"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-blocks.html
  - title: "Reserve compute capacity with EC2 On-Demand Capacity Reservations"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
