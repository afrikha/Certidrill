id: sapc03-3a-co-memory-metrics
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an in-memory analytics engine on Amazon EC2 r6i.4xlarge Linux instances in several accounts of its organization. AWS Compute Optimizer is enabled for the organization and reports the instances as over-provisioned because average CPU utilization stays below 15%. It recommends smaller compute-optimized instance types. When the team tested one recommendation, the engine ran out of memory. The company still wants to rightsize the fleet, but every recommendation must take memory usage into account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un moteur d'analyse en mémoire sur des instances Linux Amazon EC2 r6i.4xlarge dans plusieurs comptes de son organisation. AWS Compute Optimizer est activé pour l'organisation et signale les instances comme surprovisionnées, car l'utilisation moyenne du processeur reste inférieure à 15 %. Il recommande des types d'instances plus petits et optimisés pour le calcul. Lorsque l'équipe a testé une recommandation, le moteur a manqué de mémoire. L'entreprise veut toujours adapter la taille de la flotte, mais chaque recommandation doit tenir compte de l'utilisation de la mémoire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the CPU utilization threshold preference to P99.5 and the CPU headroom preference to 30% for the accounts that run the analytics engine."
        fr: "Définir la préférence de seuil d'utilisation du processeur à P99.5 et la préférence de marge de processeur à 30 % pour les comptes qui exécutent le moteur d'analyse."
    - id: b
      text:
        en: "Use AWS Systems Manager to install the Amazon CloudWatch agent on the instances and publish memory utilization metrics for Compute Optimizer."
        fr: "Utiliser AWS Systems Manager pour installer l'agent Amazon CloudWatch sur les instances et publier des métriques d'utilisation de la mémoire pour Compute Optimizer."
    - id: c
      text:
        en: "Enable detailed monitoring on the instances so that Compute Optimizer receives utilization metrics at 1-minute intervals instead of 5-minute intervals."
        fr: "Activer la surveillance détaillée des instances pour que Compute Optimizer reçoive des métriques d'utilisation toutes les minutes au lieu de toutes les 5 minutes."
    - id: d
      text:
        en: "Activate enhanced infrastructure metrics for the instances so that Compute Optimizer analyzes 93 days of utilization instead of 14 days."
        fr: "Activer les métriques d'infrastructure améliorées pour les instances afin que Compute Optimizer analyse 93 jours d'utilisation au lieu de 14."
answer: { optionId: b }
explanation:
  correct:
    en: "EC2 does not report memory utilization by default, so Compute Optimizer recommendations consider memory only when memory utilization is enabled with the CloudWatch agent or imported through external metrics ingestion. Once the agent publishes memory metrics, the recommendations stop proposing instance types with too little memory, and the memory headroom preference applies."
    fr: "EC2 ne publie pas l'utilisation de la mémoire par défaut : les recommandations de Compute Optimizer ne tiennent compte de la mémoire que si son utilisation est publiée par l'agent CloudWatch ou importée par l'ingestion de métriques externes. Dès que l'agent publie les métriques de mémoire, les recommandations cessent de proposer des types d'instances avec trop peu de mémoire, et la préférence de marge de mémoire s'applique."
  options:
    a:
      en: "CPU threshold and headroom preferences only change how CPU data is evaluated; the recommendations would still ignore memory."
      fr: "Les préférences de seuil et de marge de processeur ne changent que l'évaluation des données de processeur ; les recommandations ignoreraient toujours la mémoire."
    c:
      en: "Detailed monitoring increases the frequency of the default EC2 metrics, which still do not include memory utilization."
      fr: "La surveillance détaillée augmente la fréquence des métriques EC2 par défaut, qui n'incluent toujours pas l'utilisation de la mémoire."
    d:
      en: "A longer lookback period analyzes more history of the same metrics, but it does not add memory utilization to the analysis."
      fr: "Une période d'analyse plus longue étudie un historique plus long des mêmes métriques, mais n'ajoute pas l'utilisation de la mémoire à l'analyse."
references:
  - title: "Rightsizing recommendation preferences"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
  - title: "What is AWS Compute Optimizer?"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
