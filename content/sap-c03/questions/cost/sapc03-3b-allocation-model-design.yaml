id: sapc03-3b-allocation-model-design
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is moving 14 product teams from two legacy AWS accounts, where their workloads share VPCs, Amazon RDS instances, and load balancers, to a new multi-account landing zone. The migration will take 18 months.

    The FinOps team must design a cost allocation strategy that gives the highest allocation accuracy for the least tagging effort once workloads are in the landing zone. During the migration, the costs that remain in the two legacy accounts must still be allocated to teams, including the shared resources that no single team owns. The strategy must stay manageable with a small number of active cost allocation tag keys.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany déplace 14 équipes produit de deux comptes AWS hérités, où leurs charges de travail partagent des VPC, des instances Amazon RDS et des équilibreurs de charge, vers une nouvelle zone d'atterrissage (landing zone) multicomptes. La migration durera 18 mois.

    L'équipe FinOps doit concevoir une stratégie de répartition des coûts qui offre la meilleure précision de répartition pour le moindre effort de balisage une fois les charges de travail dans la zone d'atterrissage. Pendant la migration, les coûts qui restent dans les deux comptes hérités doivent toujours être répartis entre les équipes, y compris les ressources partagées qu'aucune équipe ne possède seule. La stratégie doit rester gérable avec un petit nombre de clés de balises de répartition des coûts actives.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the landing zone, give each team and environment its own accounts, and allocate those accounts' costs by account by using activated account tags.", fr: "Dans la zone d'atterrissage, donner à chaque équipe et à chaque environnement ses propres comptes, et répartir les coûts de ces comptes par compte à l'aide de balises de compte activées." } }
    - { id: b, text: { en: "Require the same 25 mandatory tag keys on every resource in every account, and activate all 25 keys as cost allocation tags.", fr: "Exiger les mêmes 25 clés de balises obligatoires sur chaque ressource de chaque compte, et activer les 25 clés comme balises de répartition des coûts." } }
    - { id: c, text: { en: "Encode the team name in the Name tag of each resource, and parse the Name values with Amazon Athena queries on the CUR 2.0 export.", fr: "Encoder le nom de l'équipe dans la balise Name de chaque ressource, et analyser les valeurs Name par des requêtes Amazon Athena sur l'export CUR 2.0." } }
    - { id: d, text: { en: "In the legacy accounts, require a small tag set such as CostCenter and Application, and split the shared resource costs with cost category split charge rules.", fr: "Dans les comptes hérités, exiger un petit ensemble de balises comme CostCenter et Application, et répartir les coûts des ressources partagées avec des règles de répartition des frais d'une catégorie de coûts." } }
    - { id: e, text: { en: "Create one tag key per team, such as TeamA=true or TeamB=true, and activate each team's key as a separate cost allocation tag.", fr: "Créer une clé de balise par équipe, par exemple TeamA=true ou TeamB=true, et activer la clé de chaque équipe comme balise de répartition des coûts distincte." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      An account-based model needs the least effort and gives high accuracy because it does not depend on tagging individual resources; account tags carry the team to every charge of the account. In mixed legacy accounts, a rigorous but small tag set allocates the team-owned resources, and split charge rules in a cost category distribute the shared costs that no tag can attribute. Both keep the number of active tag keys low.
    fr: |
      Un modèle basé sur les comptes demande le moins d'effort et offre une grande précision car il ne dépend pas du balisage de chaque ressource ; les balises de compte portent l'équipe sur chaque frais du compte. Dans les comptes hérités mixtes, un petit ensemble de balises rigoureux répartit les ressources propres à chaque équipe, et les règles de répartition des frais d'une catégorie de coûts distribuent les coûts partagés qu'aucune balise ne peut attribuer. Les deux options gardent un faible nombre de clés de balises actives.
  options:
    b: { en: "Twenty-five mandatory keys on every resource is the most tagging effort, and it still cannot attribute shared resources or untaggable charges.", fr: "Vingt-cinq clés obligatoires sur chaque ressource représentent l'effort de balisage maximal, et cela ne permet toujours pas d'attribuer les ressources partagées ni les frais non balisables." }
    c: { en: "Name values are free text that must be activated and parsed with custom queries, which is fragile and not usable as a clean dimension in Cost Explorer.", fr: "Les valeurs Name sont du texte libre qu'il faut activer et analyser avec des requêtes personnalisées : c'est fragile et inutilisable comme dimension propre dans Cost Explorer." }
    e: { en: "One key per team multiplies active tag keys and makes grouping by team impossible with a single dimension.", fr: "Une clé par équipe multiplie les clés de balises actives et rend impossible le regroupement par équipe avec une seule dimension." }
references:
  - title: Building a cost allocation strategy
    url: https://docs.aws.amazon.com/whitepapers/latest/tagging-best-practices/building-a-cost-allocation-strategy.html
  - title: Using account tags for cost allocation
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/account-tags-cost-allocation.html
