id: sapc03-5a-stackset-self-managed-partner
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany acquired a company that has 14 AWS accounts in its own AWS Organizations organization. For contractual reasons, the accounts will stay in that organization for at least 12 months. AnyCompany's platform team must deploy its standard logging baseline template to the 14 accounts in two Regions from AnyCompany's tooling account, and keep the baseline updated from there. The acquired company's administrators can create IAM roles in their accounts, but they can't change their organization's settings. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a acquis une entreprise qui possède 14 comptes AWS dans sa propre organisation AWS Organizations. Pour des raisons contractuelles, les comptes resteront dans cette organisation pendant au moins 12 mois. L'équipe plateforme d'AnyCompany doit déployer son modèle standard de base de référence de journalisation dans les 14 comptes, dans deux Régions, depuis le compte d'outillage d'AnyCompany, et maintenir cette base à jour depuis ce compte. Les administrateurs de l'entreprise acquise peuvent créer des rôles IAM dans leurs comptes, mais ne peuvent pas modifier les paramètres de leur organisation. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a self-managed StackSet in the tooling account with the administration role there and an AWSCloudFormationStackSetExecutionRole that trusts it in each of the 14 accounts, and add their instances by ID.
        fr: |-
          Créer un StackSet autogéré dans le compte d'outillage, avec le rôle d'administration dans ce compte et un AWSCloudFormationStackSetExecutionRole qui l'approuve dans chacun des 14 comptes, puis ajouter leurs instances par ID.
    - id: b
      text:
        en: |-
          Create a service-managed StackSet in AnyCompany's management account, and add the OU IDs of the acquired organization to its deployment targets in both Regions.
        fr: |-
          Créer un StackSet à autorisations gérées par le service dans le compte de gestion d'AnyCompany, et ajouter les ID d'OU de l'organisation acquise à ses cibles de déploiement dans les deux Régions.
    - id: c
      text:
        en: |-
          Register AnyCompany's tooling account as a delegated administrator for StackSets in the acquired organization, and create service-managed StackSets from the tooling account that target the acquired organization's root.
        fr: |-
          Enregistrer le compte d'outillage d'AnyCompany comme administrateur délégué pour StackSets dans l'organisation acquise, et créer depuis le compte d'outillage des StackSets à autorisations gérées par le service qui ciblent la racine de l'organisation acquise.
    - id: d
      text:
        en: |-
          Create a service-managed StackSet in AnyCompany's organization with an INTERSECTION account filter that lists the 14 account IDs of the acquired company.
        fr: |-
          Créer un StackSet à autorisations gérées par le service dans l'organisation d'AnyCompany avec un filtre de comptes INTERSECTION qui liste les 14 ID de comptes de l'entreprise acquise.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Self-managed permissions let a StackSet deploy to any account in which an IAM role can be created, whatever its organization. The administrator account holds the administration role, each target account holds the execution role that trusts it, and stack instances are added by account ID; updates to the StackSet then reach the 14 accounts from the tooling account.
    fr: |-
      Les autorisations autogérées permettent à un StackSet de déployer dans tout compte où un rôle IAM peut être créé, quelle que soit son organisation. Le compte administrateur détient le rôle d'administration, chaque compte cible détient le rôle d'exécution qui l'approuve, et les instances de pile sont ajoutées par ID de compte ; les mises à jour du StackSet atteignent alors les 14 comptes depuis le compte d'outillage.
  options:
    b:
      en: |-
        Service-managed StackSets deploy only to accounts of the organization that owns the StackSet; OUs of another organization can't be targeted.
      fr: |-
        Les StackSets à autorisations gérées par le service ne déploient que dans les comptes de l'organisation propriétaire du StackSet ; les OU d'une autre organisation ne peuvent pas être ciblées.
    c:
      en: |-
        A delegated administrator must be a member account of the organization that registers it, and the acquired company's administrators can't change that organization's settings anyway.
      fr: |-
        Un administrateur délégué doit être un compte membre de l'organisation qui l'enregistre, et les administrateurs de l'entreprise acquise ne peuvent de toute façon pas modifier les paramètres de cette organisation.
    d:
      en: |-
        Account filters refine targets within the StackSet's own organization; they can't add accounts that belong to another organization.
      fr: |-
        Les filtres de comptes affinent les cibles au sein de l'organisation du StackSet ; ils ne peuvent pas ajouter de comptes appartenant à une autre organisation.
references:
  - title: StackSets concepts - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html
