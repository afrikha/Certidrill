id: sapc03-5b-eks-gpu-metrics
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves machine learning inference on Amazon EKS worker nodes that have NVIDIA GPUs. The platform team needs GPU utilization and GPU memory metrics for each container and each pod in CloudWatch, next to the usual CPU and memory metrics of Container Insights, to decide when to scale. One cluster also has nodes with AWS Neuron accelerators that will need the same visibility later. The team wants the LEAST operational overhead and no self-managed monitoring stack.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert de l'inférence de machine learning sur des nœuds de travail Amazon EKS équipés de GPU NVIDIA. L'équipe plateforme a besoin dans CloudWatch de métriques d'utilisation et de mémoire GPU pour chaque conteneur et chaque pod, à côté des métriques habituelles de processeur et de mémoire de Container Insights, pour décider quand mettre à l'échelle. Un cluster comporte aussi des nœuds avec des accélérateurs AWS Neuron qui auront besoin de la même visibilité plus tard. L'équipe veut le MOINS de charge opérationnelle et aucune pile de surveillance autogérée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the NVIDIA DCGM exporter and a self-managed Prometheus server, and forward the GPU metrics to CloudWatch with a custom AWS Lambda function.", fr: "Déployer le DCGM exporter de NVIDIA et un serveur Prometheus autogéré, et transférer les métriques GPU vers CloudWatch avec une fonction AWS Lambda personnalisée." } }
    - { id: b, text: { en: "Install the CloudWatch agent on each node with a custom configuration that publishes nvidia_gpu metrics with the InstanceId dimension.", fr: "Installer l'agent CloudWatch sur chaque nœud avec une configuration personnalisée qui publie les métriques nvidia_gpu avec la dimension InstanceId." } }
    - { id: c, text: { en: "Install the Amazon CloudWatch Observability EKS add-on, which collects accelerated compute metrics, such as GPU utilization and GPU memory, with enhanced observability.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability, qui collecte les métriques de calcul accéléré, comme l'utilisation et la mémoire GPU, avec l'observabilité améliorée." } }
    - { id: d, text: { en: "Turn on EKS control plane logging for the scheduler, and create metric filters that extract GPU allocation events from the scheduler logs.", fr: "Activer la journalisation du plan de contrôle EKS pour le planificateur, et créer des filtres de métrique qui extraient des journaux du planificateur les événements d'allocation de GPU." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With the CloudWatch Observability EKS add-on, Container Insights with enhanced observability collects accelerated compute metrics, for NVIDIA GPUs, AWS Neuron, and EFA, by default. The metrics appear with the other container, pod, and node metrics, and the add-on is managed and upgraded like any EKS add-on."
    fr: "Avec le module complémentaire EKS CloudWatch Observability, Container Insights avec observabilité améliorée collecte par défaut les métriques de calcul accéléré, pour les GPU NVIDIA, AWS Neuron et EFA. Les métriques apparaissent avec les autres métriques de conteneurs, de pods et de nœuds, et le module est géré et mis à niveau comme tout module complémentaire EKS."
  options:
    a: { en: "A self-managed Prometheus server and a custom forwarding function are the self-managed stack that the team wants to avoid.", fr: "Un serveur Prometheus autogéré et une fonction de transfert personnalisée constituent la pile autogérée que l'équipe veut éviter." }
    b: { en: "Metrics dimensioned by instance show GPU usage per node, not per container or pod, and the configuration must be maintained on every node.", fr: "Des métriques dimensionnées par instance montrent l'utilisation GPU par nœud, pas par conteneur ou par pod, et la configuration doit être maintenue sur chaque nœud." }
    d: { en: "Scheduler logs describe pod placement decisions, not the actual GPU utilization or memory usage of the containers.", fr: "Les journaux du planificateur décrivent les décisions de placement des pods, pas l'utilisation réelle du GPU ni la mémoire GPU des conteneurs." }
references:
  - title: Install the CloudWatch agent with the Amazon CloudWatch Observability EKS add-on or the Helm chart
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
