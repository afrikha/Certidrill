id: sapc03-5c-slo-calendar-interval
objective: "5.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A SaaS provider reports monthly availability to its customers for each calendar month, from the first day to the last day of the month. The SRE team monitors the provider's order service with a CloudWatch Application Signals SLO that has a 99.9 percent goal and a rolling 30-day interval. Customers have questioned the monthly report because the SLO attainment shown on the dashboards on the last day of a month rarely matches the figure in the report. The SRE team wants the SLO attainment and error budget to match the customer report for each month, with no change to the goal or the indicator.

    Which change will meet these requirements?
  fr: |
    Un fournisseur SaaS communique à ses clients la disponibilité mensuelle de chaque mois calendaire, du premier au dernier jour du mois. L'équipe SRE surveille le service de commandes du fournisseur avec un SLO CloudWatch Application Signals dont l'objectif est de 99,9 % et l'intervalle glissant de 30 jours. Des clients ont contesté le rapport mensuel, car l'atteinte du SLO affichée dans les tableaux de bord le dernier jour d'un mois correspond rarement au chiffre du rapport. L'équipe SRE veut que l'atteinte et le budget d'erreur du SLO correspondent au rapport client de chaque mois, sans modifier l'objectif ni l'indicateur.

    Quelle modification permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the rolling interval from 30 days to 31 days so that it always covers the longest month.
        fr: |-
          Faire passer l'intervalle glissant de 30 jours à 31 jours, pour qu'il couvre toujours le mois le plus long.
    - id: b
      text:
        en: |-
          Add an exclusion window on the first day of each month so that the rolling window starts with the month.
        fr: |-
          Ajouter une fenêtre d'exclusion le premier jour de chaque mois, pour que la fenêtre glissante commence avec le mois.
    - id: c
      text:
        en: |-
          Create a CloudWatch dashboard that shows the SLI metric with a period of one month next to the SLO.
        fr: |-
          Créer un tableau de bord CloudWatch qui affiche la métrique du SLI avec une période d'un mois à côté du SLO.
    - id: d
      text:
        en: |-
          Change the SLO to a calendar interval of one month, aligned with each calendar month.
        fr: |-
          Faire passer le SLO à un intervalle calendaire d'un mois, aligné sur chaque mois calendaire.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A calendar interval is aligned to the calendar, and the error budget and attainment adjust to the number of days in the month, so the figure at month end matches a report built on the same month. The interval is one of the settings that can be edited on an existing SLO.
    fr: |-
      Un intervalle calendaire est aligné sur le calendrier, et le budget d'erreur et l'atteinte s'adaptent au nombre de jours du mois : le chiffre de fin de mois correspond à un rapport établi sur le même mois. L'intervalle fait partie des paramètres modifiables sur un SLO existant.
  options:
    a:
      en: |-
        Any rolling window trails the current time, so on the last day of a 30-day month a 31-day window also includes a day of the previous month.
      fr: |-
        Toute fenêtre glissante suit l'heure actuelle : le dernier jour d'un mois de 30 jours, une fenêtre de 31 jours inclut aussi un jour du mois précédent.
    b:
      en: |-
        Exclusion windows remove planned maintenance from the calculation; they don't change where a rolling interval starts, and they would drop a day of real data.
      fr: |-
        Les fenêtres d'exclusion retirent la maintenance planifiée du calcul ; elles ne changent pas le début d'un intervalle glissant, et elles supprimeraient un jour de données réelles.
    c:
      en: |-
        A dashboard widget doesn't change how the SLO computes attainment and error budget, so the SLO still disagrees with the report.
      fr: |-
        Un widget de tableau de bord ne change pas la façon dont le SLO calcule l'atteinte et le budget d'erreur : le SLO reste en désaccord avec le rapport.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
