id: sapc03-5b-bedrock-undimensioned-errors
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company's platform account serves several applications that call foundation models in Amazon Bedrock. The team created CloudWatch alarms on InvocationClientErrors and InvocationServerErrors for each model ID that it uses. During an incident, a faulty client library sent malformed requests that were rejected early, and users saw errors for an hour while every alarm stayed in the OK state. The investigation showed that the alarms received no error data points for these requests. The team wants its error alarms to count every failed request, whatever the model and the stage at which it fails.

    Which solution will meet these requirements?
  fr: |
    Le compte de plateforme d'un éditeur de logiciels sert plusieurs applications qui appellent des modèles de fondation dans Amazon Bedrock. L'équipe a créé des alarmes CloudWatch sur InvocationClientErrors et InvocationServerErrors pour chaque ID de modèle qu'elle utilise. Lors d'un incident, une bibliothèque cliente défectueuse a envoyé des requêtes mal formées qui ont été rejetées très tôt, et les utilisateurs ont vu des erreurs pendant une heure alors que toutes les alarmes restaient à l'état OK. L'enquête a montré que les alarmes n'avaient reçu aucun point de données d'erreur pour ces requêtes. L'équipe veut que ses alarmes d'erreurs comptent chaque requête en échec, quels que soient le modèle et l'étape à laquelle elle échoue.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Lower the thresholds of the per-model alarms, and set them to treat missing data as breaching so that they react to smaller error counts.", fr: "Abaisser les seuils des alarmes par modèle, et les configurer pour traiter les données manquantes comme en dépassement afin qu'elles réagissent à de plus petits nombres d'erreurs." } }
    - { id: b, text: { en: "Create a CloudWatch Synthetics canary that sends a test prompt to each model every minute, and create an alarm on the SuccessPercent metric of the canary.", fr: "Créer un canary CloudWatch Synthetics qui envoie une invite de test à chaque modèle chaque minute, et créer une alarme sur la métrique SuccessPercent du canary." } }
    - { id: c, text: { en: "Create an alarm on the InvocationThrottles metric for each model ID, because requests that are rejected early are reported as throttles.", fr: "Créer une alarme sur la métrique InvocationThrottles pour chaque ID de modèle, car les requêtes rejetées très tôt sont comptées comme des limitations." } }
    - { id: d, text: { en: "Add alarms on the InvocationClientErrors and InvocationServerErrors metrics without any dimension, which also count the requests published without a ModelId.", fr: "Ajouter des alarmes sur les métriques InvocationClientErrors et InvocationServerErrors sans aucune dimension, qui comptent aussi les requêtes publiées sans ModelId." } }
answer: { optionId: d }
explanation:
  correct:
    en: "If a request fails before Amazon Bedrock determines which model it targets, its metrics are published without the ModelId dimension, so filtering by ModelId undercounts errors. AWS recommends querying these metrics without a dimension to account for all requests, which the additional alarms do."
    fr: "Si une requête échoue avant qu'Amazon Bedrock ne détermine le modèle ciblé, ses métriques sont publiées sans la dimension ModelId : filtrer par ModelId sous-estime les erreurs. AWS recommande d'interroger ces métriques sans dimension pour prendre en compte toutes les requêtes, ce que font les alarmes supplémentaires."
  options:
    a: { en: "The per-model metrics never receive the errors of these requests, so lower thresholds change nothing, and treating missing data as breaching would page whenever a model is idle.", fr: "Les métriques par modèle ne reçoivent jamais les erreurs de ces requêtes : abaisser les seuils ne change rien, et traiter les données manquantes comme en dépassement enverrait des pages dès qu'un modèle est inactif." }
    b: { en: "The canary sends well-formed requests that succeed, so it would not detect failures caused by the faulty client library.", fr: "Le canary envoie des requêtes bien formées qui réussissent : il ne détecterait pas les échecs causés par la bibliothèque cliente défectueuse." }
    c: { en: "Malformed requests are client errors, not throttles, and filtering by ModelId would still miss them.", fr: "Des requêtes mal formées sont des erreurs client, pas des limitations, et un filtre par ModelId les manquerait toujours." }
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
