id: sapc03-5b-lambda-otel-layer
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs 150 AWS Lambda functions written in Python and Node.js that call Amazon DynamoDB, Amazon S3, and internal APIs. The company has standardized on OpenTelemetry for new services. It wants the Lambda traces, including the downstream calls, to appear in CloudWatch Application Signals with standard service metrics. The function code must not change, and the company does not want to maintain its own instrumentation packages.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute 150 fonctions AWS Lambda écrites en Python et Node.js qui appellent Amazon DynamoDB, Amazon S3 et des API internes. L'entreprise a adopté OpenTelemetry comme norme pour les nouveaux services. Elle veut que les traces Lambda, y compris les appels en aval, apparaissent dans CloudWatch Application Signals avec des métriques de service standard. Le code des fonctions ne doit pas changer, et l'entreprise ne veut pas maintenir ses propres paquets d'instrumentation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on X-Ray active tracing for each function, and add the AWS X-Ray SDK to each deployment package to capture the downstream calls.", fr: "Activer le suivi actif X-Ray pour chaque fonction, et ajouter le SDK AWS X-Ray à chaque package de déploiement pour capturer les appels en aval." } }
    - { id: b, text: { en: "Run an OpenTelemetry Collector on Amazon ECS, and send the logs of each function to the collector through a CloudWatch Logs subscription filter.", fr: "Exécuter un OpenTelemetry Collector sur Amazon ECS, et envoyer les journaux de chaque fonction au collecteur au moyen d'un filtre d'abonnement CloudWatch Logs." } }
    - { id: c, text: { en: "Add the AWS Lambda Layer for OpenTelemetry to each function, and set the AWS_LAMBDA_EXEC_WRAPPER environment variable to /opt/otel-instrument.", fr: "Ajouter l'AWS Lambda Layer for OpenTelemetry à chaque fonction, et définir la variable d'environnement AWS_LAMBDA_EXEC_WRAPPER sur /opt/otel-instrument." } }
    - { id: d, text: { en: "Build a custom Lambda extension that wraps the OpenTelemetry SDK for both runtimes, and publish it as a layer that every team adds to its functions.", fr: "Construire une extension Lambda personnalisée qui encapsule le SDK OpenTelemetry pour les deux environnements d'exécution, et la publier comme couche que chaque équipe ajoute à ses fonctions." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS recommends the auto-instrumentation layer for Lambda: the AWS Lambda Layer for OpenTelemetry, which feeds Application Signals, is added to the function and activated with the AWS_LAMBDA_EXEC_WRAPPER environment variable set to /opt/otel-instrument. The layer instruments the AWS SDK and HTTP calls automatically, with no change to the function code and no package to maintain."
    fr: "AWS recommande la couche d'auto-instrumentation pour Lambda : l'AWS Lambda Layer for OpenTelemetry, qui alimente Application Signals, est ajoutée à la fonction et activée par la variable d'environnement AWS_LAMBDA_EXEC_WRAPPER définie sur /opt/otel-instrument. La couche instrumente automatiquement les appels du SDK AWS et HTTP, sans modifier le code de la fonction ni maintenir de paquet."
  options:
    a: { en: "Adding the X-Ray SDK changes every deployment package, and the SDK is in maintenance mode instead of following the OpenTelemetry standard.", fr: "Ajouter le SDK X-Ray modifie chaque package de déploiement, et le SDK est en mode maintenance au lieu de suivre la norme OpenTelemetry." }
    b: { en: "Function logs are not traces, so a collector that receives them cannot rebuild the spans of the downstream calls.", fr: "Les journaux des fonctions ne sont pas des traces : un collecteur qui les reçoit ne peut pas reconstruire les spans des appels en aval." }
    d: { en: "A custom extension is exactly the instrumentation package that the company does not want to maintain.", fr: "Une extension personnalisée est exactement le paquet d'instrumentation que l'entreprise ne veut pas maintenir." }
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
  - title: Application Signals
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Monitoring-Sections.html
