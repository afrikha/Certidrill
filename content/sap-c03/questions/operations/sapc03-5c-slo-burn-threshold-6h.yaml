id: sapc03-5c-slo-burn-threshold-6h
objective: "5.3.7"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A streaming company defines a CloudWatch Application Signals SLO for its playback API with a 99.9 percent goal, 1-minute periods, and a rolling 30-day interval. Following the multi-window strategy, the SRE team already pages when 2 percent of the error budget is consumed within 1 hour, with a burn rate threshold of 14.4 on a 1-hour look-back window. The team now adds a second pair of alarms that must page when 5 percent of the 30-day error budget is consumed within 6 hours.

    Which burn rate threshold must the team set on the 6-hour burn rate alarm?
  fr: |
    Une entreprise de streaming définit un SLO CloudWatch Application Signals pour son API de lecture avec un objectif de 99,9 %, des périodes de 1 minute et un intervalle glissant de 30 jours. Selon la stratégie multifenêtre, l'équipe SRE alerte déjà lorsque 2 % du budget d'erreur sont consommés en 1 heure, avec un seuil de taux de consommation de 14,4 sur une fenêtre d'analyse de 1 heure. L'équipe ajoute maintenant une seconde paire d'alarmes qui doit alerter lorsque 5 % du budget d'erreur de 30 jours sont consommés en 6 heures.

    Quel seuil de taux de consommation l'équipe doit-elle définir sur l'alarme de taux de consommation sur 6 heures ?
body:
  options:
    - id: a
      text:
        en: |-
          1
        fr: |-
          1
    - id: b
      text:
        en: |-
          6
        fr: |-
          6
    - id: c
      text:
        en: |-
          14.4
        fr: |-
          14,4
    - id: d
      text:
        en: |-
          36
        fr: |-
          36
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The threshold is the share of the budget multiplied by the interval length and divided by the look-back window: 5 percent x 720 hours / 6 hours = 6. At a burn rate of 6, 6 hours consume as much budget as 36 hours at the sustainable rate, which is 36/720 = 5 percent of the budget. The 6-hour alarm is then combined with a 30-minute alarm in a composite alarm.
    fr: |-
      Le seuil est la part du budget multipliée par la longueur de l'intervalle et divisée par la fenêtre d'analyse : 5 % x 720 heures / 6 heures = 6. À un taux de consommation de 6, 6 heures consomment autant de budget que 36 heures au rythme soutenable, soit 36/720 = 5 % du budget. L'alarme sur 6 heures est ensuite combinée avec une alarme sur 30 minutes dans une alarme composite.
  options:
    a:
      en: |-
        A burn rate of 1 consumes the budget exactly over the whole interval; in 6 hours it spends less than 1 percent of the budget.
      fr: |-
        Un taux de consommation de 1 consomme le budget exactement sur tout l'intervalle ; en 6 heures, il dépense moins de 1 % du budget.
    c:
      en: |-
        14.4 is the threshold for 2 percent of the budget in 1 hour; over 6 hours it would mean about 12 percent of the budget.
      fr: |-
        14,4 est le seuil pour 2 % du budget en 1 heure ; sur 6 heures, il représenterait environ 12 % du budget.
    d:
      en: |-
        36 corresponds to 5 percent of the budget consumed in 1 hour, not in 6 hours, so the alarm would page far too late for this pair.
      fr: |-
        36 correspond à 5 % du budget consommés en 1 heure, et non en 6 heures : l'alarme alerterait bien trop tard pour cette paire.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
