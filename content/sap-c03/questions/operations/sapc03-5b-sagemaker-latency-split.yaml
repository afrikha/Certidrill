id: sapc03-5b-sagemaker-latency-split
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company serves a recommendation model from an Amazon SageMaker AI real-time endpoint. After the mobile app started to send larger request payloads, the latency that the app measures rose by 200 ms. The data science team says that the model code has not changed. Before it changes anything, the operations team wants to determine whether the extra time is spent inside the model container or in the request handling that SageMaker AI adds around the container.

    Which CloudWatch metrics should the operations team compare?
  fr: |
    Une entreprise de distribution sert un modèle de recommandation depuis un point de terminaison en temps réel Amazon SageMaker AI. Après que l'application mobile a commencé à envoyer des requêtes plus volumineuses, la latence mesurée par l'application a augmenté de 200 ms. L'équipe de data science indique que le code du modèle n'a pas changé. Avant de modifier quoi que ce soit, l'équipe d'exploitation veut déterminer si le temps supplémentaire est passé dans le conteneur du modèle ou dans le traitement des requêtes que SageMaker AI ajoute autour du conteneur.

    Quelles métriques CloudWatch l'équipe d'exploitation doit-elle comparer ?
body:
  options:
    - { id: a, text: { en: "Invocation4XXErrors and Invocation5XXErrors, to see whether the larger payloads make the model container reject or fail requests.", fr: "Invocation4XXErrors et Invocation5XXErrors, pour voir si les requêtes plus volumineuses amènent le conteneur du modèle à rejeter ou à faire échouer des requêtes." } }
    - { id: b, text: { en: "Invocations and InvocationsPerInstance, to see whether the endpoint needs more instances to handle the larger payloads.", fr: "Invocations et InvocationsPerInstance, pour voir si le point de terminaison a besoin de plus d'instances pour traiter les requêtes plus volumineuses." } }
    - { id: c, text: { en: "ModelLatency and OverheadLatency, to compare the time that the model takes with the time that SageMaker AI adds to each request.", fr: "ModelLatency et OverheadLatency, pour comparer le temps pris par le modèle et le temps que SageMaker AI ajoute à chaque requête." } }
    - { id: d, text: { en: "CPUUtilization and MemoryUtilization of the endpoint instances, to see whether the larger payloads overload the instances.", fr: "CPUUtilization et MemoryUtilization des instances du point de terminaison, pour voir si les requêtes plus volumineuses surchargent les instances." } }
answer: { optionId: c }
explanation:
  correct:
    en: "ModelLatency is the time that the model takes to respond, including the communication with the container and the inference inside it. OverheadLatency is the time that SageMaker AI adds from receiving the request to returning the response, minus ModelLatency, and it varies with payload sizes, request frequency, and authentication, so comparing the two shows where the 200 ms go."
    fr: "ModelLatency est le temps de réponse du modèle, y compris la communication avec le conteneur et l'inférence dans celui-ci. OverheadLatency est le temps qu'ajoute SageMaker AI entre la réception de la requête et le renvoi de la réponse, moins ModelLatency, et il varie selon la taille des charges utiles, la fréquence des requêtes et l'authentification : comparer les deux montre où passent les 200 ms."
  options:
    a: { en: "Error counts show failed requests, but the requests succeed more slowly, and these metrics say nothing about where the time is spent.", fr: "Le nombre d'erreurs montre les requêtes en échec, mais les requêtes réussissent plus lentement, et ces métriques ne disent rien de l'endroit où le temps est passé." }
    b: { en: "Invocation counts describe traffic volume and are used for scaling; they do not split the latency between the container and SageMaker AI.", fr: "Le nombre d'appels décrit le volume de trafic et sert à la mise à l'échelle ; il ne répartit pas la latence entre le conteneur et SageMaker AI." }
    d: { en: "Instance utilization can show overload, but it does not separate the time spent in the container from the overhead around it.", fr: "L'utilisation des instances peut révéler une surcharge, mais elle ne sépare pas le temps passé dans le conteneur du surcoût qui l'entoure." }
references:
  - title: Amazon SageMaker AI metrics in Amazon CloudWatch
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/monitoring-cloudwatch.html
