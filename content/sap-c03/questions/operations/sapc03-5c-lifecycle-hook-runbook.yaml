id: sapc03-5c-lifecycle-hook-runbook
objective: "5.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A software company runs a license-metered analytics service on Amazon EC2 instances in an Auto Scaling group. When the group scales in, each terminating instance must upload its local application logs to Amazon S3 and release its license seat by running a command on the instance, which takes up to 5 minutes. Today, scale-in terminates instances immediately, the logs are lost, and seats stay assigned until the vendor's monthly audit. The operations team already has a Systems Manager Automation runbook that runs these commands on an instance through Run Command and then calls CompleteLifecycleAction with the CONTINUE result. The company wants the LEAST operational overhead and no custom code outside the runbook.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un éditeur de logiciels exploite un service d'analyse soumis à des licences comptées sur des instances Amazon EC2 dans un groupe Auto Scaling. Quand le groupe réduit sa capacité, chaque instance en cours de résiliation doit envoyer ses journaux applicatifs locaux vers Amazon S3 et libérer son siège de licence en exécutant une commande sur l'instance, ce qui prend jusqu'à 5 minutes. Aujourd'hui, la réduction de capacité résilie les instances immédiatement, les journaux sont perdus, et les sièges restent attribués jusqu'à l'audit mensuel de l'éditeur. L'équipe d'exploitation dispose déjà d'un runbook Systems Manager Automation qui exécute ces commandes sur une instance au moyen de Run Command, puis appelle CompleteLifecycleAction avec le résultat CONTINUE. L'entreprise veut le MOINS de charge opérationnelle et aucun code personnalisé hors du runbook.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a launch lifecycle hook to the group with a heartbeat timeout of 10 minutes for the log upload and license release.
        fr: |-
          Ajouter au groupe un hook de cycle de vie de lancement avec un délai de pulsation de 10 minutes pour l'envoi des journaux et la libération de licence.
    - id: b
      text:
        en: |-
          Add a termination lifecycle hook to the group with a heartbeat timeout of 10 minutes.
        fr: |-
          Ajouter au groupe un hook de cycle de vie de résiliation avec un délai de pulsation de 10 minutes.
    - id: c
      text:
        en: |-
          Turn on scale-in protection for all instances of the group so that they aren't terminated before the commands run.
        fr: |-
          Activer la protection contre la réduction de capacité pour toutes les instances du groupe afin qu'elles ne soient pas résiliées avant l'exécution des commandes.
    - id: d
      text:
        en: |-
          Create an EventBridge rule on the group's EC2 Instance-terminate Lifecycle Action events that targets the Automation runbook.
        fr: |-
          Créer une règle EventBridge sur les événements EC2 Instance-terminate Lifecycle Action du groupe qui cible le runbook Automation.
    - id: e
      text:
        en: |-
          Configure an instance maintenance policy with a minimum healthy percentage of 100 so that instances wait before they are terminated.
        fr: |-
          Configurer une politique de maintenance des instances avec un pourcentage minimal d'instances saines de 100 afin que les instances attendent avant d'être résiliées.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A termination lifecycle hook pauses each instance in a wait state before it is terminated and sends an event to EventBridge; a heartbeat timeout of 10 minutes leaves time for the 5-minute commands. An EventBridge rule on that event can target Systems Manager Automation directly, and the runbook completes the lifecycle action so that termination continues.
    fr: |-
      Un hook de cycle de vie de résiliation met chaque instance en attente avant sa résiliation et envoie un événement à EventBridge ; un délai de pulsation de 10 minutes laisse le temps aux commandes de 5 minutes. Une règle EventBridge sur cet événement peut cibler directement Systems Manager Automation, et le runbook termine l'action de cycle de vie pour que la résiliation se poursuive.
  options:
    a:
      en: |-
        A launch hook pauses instances as they start, not before they are terminated.
      fr: |-
        Un hook de lancement met les instances en pause à leur démarrage, pas avant leur résiliation.
    c:
      en: |-
        Scale-in protection prevents the group from terminating the instances at all, so the group can't scale in, and nothing runs the commands.
      fr: |-
        La protection contre la réduction de capacité empêche totalement le groupe de résilier les instances : le groupe ne peut plus réduire sa capacité, et rien n'exécute les commandes.
    e:
      en: |-
        An instance maintenance policy controls replacement order during refreshes and health check replacements; it doesn't pause scale-in terminations or run commands.
      fr: |-
        Une politique de maintenance des instances contrôle l'ordre de remplacement pendant les actualisations et les remplacements après vérification de l'état ; elle ne met pas en pause les résiliations dues à la réduction de capacité et n'exécute pas de commandes.
references:
  - title: "Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
  - title: "Event bus targets in Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
