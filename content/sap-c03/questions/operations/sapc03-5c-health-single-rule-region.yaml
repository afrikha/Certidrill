id: sapc03-5c-health-single-rule-region
objective: "5.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company operates workloads in eu-west-1, eu-central-1, ap-southeast-2, and us-west-2 in a single AWS account, and it plans to add more Regions next year. The operations team wants account-specific AWS Health events, such as scheduled changes and issues affecting the company's resources, from every Region in the standard partition to reach one Amazon SQS queue that feeds its ticketing tool. The team doesn't need public events about AWS services in general. The team wants to create and maintain as few EventBridge rules as possible, and Regions added later must be covered without any change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exploite des charges de travail dans eu-west-1, eu-central-1, ap-southeast-2 et us-west-2 dans un seul compte AWS, et prévoit d'ajouter d'autres Régions l'an prochain. L'équipe d'exploitation veut que les événements AWS Health propres au compte, comme les modifications planifiées et les problèmes touchant les ressources de l'entreprise, de chaque Région de la partition standard parviennent à une seule file d'attente Amazon SQS qui alimente son outil de tickets. L'équipe n'a pas besoin des événements publics sur les services AWS en général. L'équipe veut créer et maintenir le moins de règles EventBridge possible, et les Régions ajoutées plus tard doivent être couvertes sans aucune modification.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one EventBridge rule in us-east-1 that matches aws.health events, because AWS Health publishes the events of all Regions in US East (N. Virginia).
        fr: |-
          Créer une seule règle EventBridge dans us-east-1 qui correspond aux événements aws.health, car AWS Health publie les événements de toutes les Régions dans USA Est (Virginie du Nord).
    - id: b
      text:
        en: |-
          Create one EventBridge rule in eu-west-1, the company's main Region, that matches aws.health events for all Regions by filtering on the region field.
        fr: |-
          Créer une seule règle EventBridge dans eu-west-1, la Région principale de l'entreprise, qui correspond aux événements aws.health de toutes les Régions en filtrant sur le champ region.
    - id: c
      text:
        en: |-
          Create one EventBridge rule in each Region where the company runs workloads, and add a rule in each new Region when it is adopted.
        fr: |-
          Créer une règle EventBridge dans chaque Région où l'entreprise exécute des charges de travail, et ajouter une règle dans chaque nouvelle Région lorsqu'elle est adoptée.
    - id: d
      text:
        en: |-
          Create one EventBridge rule in us-west-2, which receives a backup copy of the account-specific events of all other Regions in addition to its own events.
        fr: |-
          Créer une seule règle EventBridge dans us-west-2, qui reçoit une copie de secours des événements propres au compte de toutes les autres Régions en plus de ses propres événements.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Health sends each event to its Region and to a backup Region; in the standard partition, US West (Oregon) is the backup for every other Region. A single rule in us-west-2 therefore captures account-specific events from all Regions, including Regions adopted later, although it doesn't receive public events and offers no high availability, which this team doesn't need.
    fr: |-
      AWS Health envoie chaque événement dans sa Région et dans une Région de secours ; dans la partition standard, USA Ouest (Oregon) est la Région de secours de toutes les autres. Une seule règle dans us-west-2 capture donc les événements propres au compte de toutes les Régions, y compris celles adoptées plus tard, même si elle ne reçoit pas les événements publics et n'offre pas de haute disponibilité, ce dont l'équipe n'a pas besoin.
  options:
    a:
      en: |-
        US East (N. Virginia) receives global events and serves as backup only for us-west-2, so a rule there misses the events of the other Regions.
      fr: |-
        USA Est (Virginie du Nord) reçoit les événements globaux et ne sert de secours que pour us-west-2 : une règle à cet endroit manque les événements des autres Régions.
    b:
      en: |-
        A rule receives the Health events delivered to its own Region; filtering on the region field can't pull events that are never delivered to eu-west-1.
      fr: |-
        Une règle reçoit les événements Health livrés dans sa propre Région ; filtrer sur le champ region ne peut pas récupérer des événements qui ne sont jamais livrés dans eu-west-1.
    c:
      en: |-
        One rule per Region works but means more rules to maintain and a change for every new Region, which the team wants to avoid.
      fr: |-
        Une règle par Région fonctionne, mais implique davantage de règles à maintenir et une modification pour chaque nouvelle Région, ce que l'équipe veut éviter.
references:
  - title: "Creating EventBridge rules for AWS Region coverage - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
