id: sapc03-5c-rum-xray-backend-link
objective: "5.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company runs a booking website whose front end calls Amazon API Gateway, which routes to microservices on Amazon EKS in two production accounts. The microservices are instrumented with CloudWatch Application Signals through the Amazon CloudWatch Observability add-on, and a CloudWatch RUM app monitor already collects page performance from real users. RUM shows that the checkout page is slow for about 8 percent of sessions, but the Application Signals dashboards show only average service latency, and engineers spend hours matching slow sessions to back-end calls by timestamp. The engineers want to start from a slow session in RUM and follow its requests to the specific back-end service and dependency that caused the delay. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages exploite un site de réservation dont le front-end appelle Amazon API Gateway, qui achemine vers des microservices sur Amazon EKS dans deux comptes de production. Les microservices sont instrumentés avec CloudWatch Application Signals au moyen du module complémentaire Amazon CloudWatch Observability, et un moniteur d'application CloudWatch RUM collecte déjà la performance des pages auprès des utilisateurs réels. RUM montre que la page de paiement est lente pour environ 8 % des sessions, mais les tableaux de bord Application Signals n'affichent que la latence moyenne des services, et les ingénieurs passent des heures à rapprocher les sessions lentes des appels back-end par horodatage. Les ingénieurs veulent partir d'une session lente dans RUM et suivre ses requêtes jusqu'au service back-end et à la dépendance précis qui ont causé le retard. L'entreprise veut le MOINS d'effort de développement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on X-Ray active tracing in the RUM app monitor and add the trace header to client requests, so that sessions appear on the Application Signals map linked to the services they call.
        fr: |-
          Activer le traçage actif X-Ray dans le moniteur d'application RUM et ajouter l'en-tête de trace aux requêtes clientes, pour que les sessions apparaissent sur la carte Application Signals, reliées aux services qu'elles appellent.
    - id: b
      text:
        en: |-
          Create a CloudWatch Synthetics canary that runs the checkout journey every minute with active tracing, and compare its traces with the slow RUM sessions of the same minute.
        fr: |-
          Créer un canary CloudWatch Synthetics qui exécute le parcours de paiement chaque minute avec le traçage actif, et comparer ses traces avec les sessions RUM lentes de la même minute.
    - id: c
      text:
        en: |-
          Turn on Container Insights with enhanced observability for the EKS clusters, and drill down from the checkout service to the pods with the highest CPU usage during slow sessions.
        fr: |-
          Activer Container Insights avec l'observabilité améliorée pour les clusters EKS, et descendre du service de paiement jusqu'aux pods dont l'utilisation du processeur est la plus élevée pendant les sessions lentes.
    - id: d
      text:
        en: |-
          Turn on API Gateway access logging with the request ID, send the RUM events to CloudWatch Logs, and join both log groups on timestamp and IP address with CloudWatch Logs Insights queries.
        fr: |-
          Activer la journalisation des accès API Gateway avec l'ID de requête, envoyer les événements RUM vers CloudWatch Logs, et joindre les deux groupes de journaux par horodatage et adresse IP avec des requêtes CloudWatch Logs Insights.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With X-Ray active tracing, the RUM web client traces the fetch and XMLHttpRequest calls of sampled sessions, and RUM clients then appear in Application Signals on the application map and service pages of the services they call. Adding the trace header propagates the same trace through the downstream services, so a slow session leads directly to the slow service and dependency, with only configuration and a snippet change.
    fr: |-
      Avec le traçage actif X-Ray, le client web RUM trace les appels fetch et XMLHttpRequest des sessions échantillonnées, et les clients RUM apparaissent alors dans Application Signals, sur la carte de l'application et les pages des services qu'ils appellent. Ajouter l'en-tête de trace propage la même trace à travers les services en aval : une session lente mène directement au service et à la dépendance lents, avec seulement de la configuration et une modification de l'extrait.
  options:
    b:
      en: |-
        Canary traces describe synthetic requests, not the slow sessions of real users, so matching them by minute is still guesswork.
      fr: |-
        Les traces d'un canary décrivent des requêtes synthétiques, pas les sessions lentes des utilisateurs réels : les rapprocher par minute reste approximatif.
    c:
      en: |-
        Container metrics show resource usage per pod, but they don't connect a user session to the service call and dependency that delayed it.
      fr: |-
        Les métriques de conteneurs montrent l'utilisation des ressources par pod, mais elles ne relient pas une session utilisateur à l'appel de service et à la dépendance qui l'ont retardée.
    d:
      en: |-
        Joining logs on timestamps and IP addresses is the manual correlation the engineers already struggle with, and it doesn't reach the dependencies behind the API.
      fr: |-
        Joindre des journaux par horodatage et adresse IP est la corrélation manuelle qui pose déjà problème aux ingénieurs, et elle n'atteint pas les dépendances situées derrière l'API.
references:
