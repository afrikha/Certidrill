id: sapc03-5b-destination-org-policy
objective: "5.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's log archive account owns a CloudWatch Logs destination in eu-west-1 that writes to an Amazon Data Firehose stream through an IAM role that CloudWatch Logs assumes. The company has 120 accounts in AWS Organizations that run in eu-west-1, and new accounts are added every month. Every account must be able to subscribe its log groups to this destination, and no account outside the organization may use it. The team does not want to update any policy when accounts join.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Le compte d'archivage des journaux d'une entreprise possède une destination CloudWatch Logs dans eu-west-1 qui écrit dans un flux Amazon Data Firehose au moyen d'un rôle IAM qu'assume CloudWatch Logs. L'entreprise compte 120 comptes dans AWS Organizations qui s'exécutent dans eu-west-1, et de nouveaux comptes sont ajoutés chaque mois. Chaque compte doit pouvoir abonner ses groupes de journaux à cette destination, et aucun compte extérieur à l'organisation ne doit pouvoir l'utiliser. L'équipe ne veut mettre à jour aucune politique quand des comptes rejoignent l'organisation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach a destination access policy that allows logs:PutSubscriptionFilter for all principals, with a condition on aws:PrincipalOrgID that matches the organization ID.", fr: "Attacher une politique d'accès à la destination qui autorise logs:PutSubscriptionFilter pour tous les principaux, avec une condition aws:PrincipalOrgID correspondant à l'ID de l'organisation." } }
    - { id: b, text: { en: "Attach a resource-based policy to the Firehose stream that allows firehose:PutRecordBatch from each of the 120 account IDs.", fr: "Attacher au flux Firehose une politique basée sur les ressources qui autorise firehose:PutRecordBatch depuis chacun des 120 ID de compte." } }
    - { id: c, text: { en: "Share the destination with the organization through AWS RAM, so that every account can see it in its own CloudWatch Logs console.", fr: "Partager la destination avec l'organisation via AWS RAM, afin que chaque compte la voie dans sa propre console CloudWatch Logs." } }
    - { id: d, text: { en: "In each source account, create subscription filters on the log groups that reference the ARN of the destination in the log archive account.", fr: "Dans chaque compte source, créer sur les groupes de journaux des filtres d'abonnement qui référencent l'ARN de la destination du compte d'archivage des journaux." } }
    - { id: e, text: { en: "In each source account, create an IAM role that CloudWatch Logs assumes to write directly to the Firehose stream of the log archive account.", fr: "Dans chaque compte source, créer un rôle IAM qu'assume CloudWatch Logs pour écrire directement dans le flux Firehose du compte d'archivage des journaux." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The destination's access policy governs who may write to it, and a policy that allows all principals with an aws:PrincipalOrgID condition admits every current and future account of the organization and no other account. Each sender account then creates subscription filters that point to the destination ARN, and CloudWatch Logs delivers through the role that the destination already specifies."
    fr: "La politique d'accès de la destination détermine qui peut y écrire, et une politique qui autorise tous les principaux avec une condition aws:PrincipalOrgID admet chaque compte actuel et futur de l'organisation, et aucun autre. Chaque compte émetteur crée ensuite des filtres d'abonnement qui pointent vers l'ARN de la destination, et CloudWatch Logs livre au moyen du rôle que la destination indique déjà."
  options:
    b: { en: "Senders never write to the stream themselves: the destination's role does, and listing account IDs would need an update for every new account.", fr: "Les émetteurs n'écrivent jamais eux-mêmes dans le flux : c'est le rôle de la destination qui le fait, et lister les ID de compte imposerait une mise à jour pour chaque nouveau compte." }
    c: { en: "Access to a CloudWatch Logs destination is controlled by its access policy, not by an AWS RAM resource share.", fr: "L'accès à une destination CloudWatch Logs est contrôlé par sa politique d'accès, pas par un partage de ressources AWS RAM." }
    e: { en: "Cross-account delivery goes through the destination and its own role in the receiving account; source accounts do not need a role to write to the stream.", fr: "La livraison intercompte passe par la destination et son propre rôle dans le compte récepteur ; les comptes sources n'ont pas besoin de rôle pour écrire dans le flux." }
references:
  - title: Cross-account cross-Region log data sharing using Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions-Kinesis.html
  - title: Cross-account cross-Region subscriptions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions.html
