id: sapc03-5a-xacct-setup-three
objective: "5.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is adding a production account (444455556666) to a V2 AWS CodePipeline pipeline that runs in its tooling account (111122223333). The pipeline, which is defined in an AWS CloudFormation template in the tooling account, must deploy CloudFormation stacks into the production account. The security team requires no long-term credentials and least privilege for the pipeline in production. The stack resources must be created by a role in the production account that the pipeline's own role can't use to call other services directly. The production account's administrators review every IAM role that the pipeline uses.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    AnyCompany ajoute un compte de production (444455556666) à un pipeline AWS CodePipeline V2 qui s'exécute dans son compte d'outillage (111122223333). Le pipeline, défini dans un modèle AWS CloudFormation du compte d'outillage, doit déployer des piles CloudFormation dans le compte de production. L'équipe de sécurité exige l'absence d'informations d'identification à long terme et le moindre privilège pour le pipeline en production. Les ressources des piles doivent être créées par un rôle du compte de production que le rôle propre au pipeline ne peut pas utiliser pour appeler directement d'autres services. Les administrateurs du compte de production examinent chaque rôle IAM utilisé par le pipeline.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Encrypt the artifact store with a customer managed KMS key, and allow the production account's deployment role in the key policy and in the artifact bucket policy.
        fr: |-
          Chiffrer le magasin d'artefacts avec une clé KMS gérée par le client, et autoriser le rôle de déploiement du compte de production dans la politique de clé et dans la politique du compartiment d'artefacts.
    - id: b
      text:
        en: |-
          Keep the AWS managed key for the artifact store, and give the production account's deployment role access to it with a KMS grant that is scoped to the production deployment role.
        fr: |-
          Conserver la clé gérée par AWS pour le magasin d'artefacts, et donner au rôle de déploiement du compte de production l'accès à cette clé au moyen d'un octroi KMS limité au rôle de déploiement de production.
    - id: c
      text:
        en: |-
          Create a deployment role in the production account that trusts the pipeline's service role and allows CloudFormation actions, the artifact bucket and key, and iam:PassRole on an execution role.
        fr: |-
          Créer dans le compte de production un rôle de déploiement qui approuve le rôle de service du pipeline et autorise les actions CloudFormation, le compartiment et la clé d'artefacts, ainsi qu'iam:PassRole sur un rôle d'exécution.
    - id: d
      text:
        en: |-
          Create an IAM user in the production account, and store its access keys in AWS Secrets Manager in the tooling account with a rotation schedule for the deploy action to use.
        fr: |-
          Créer un utilisateur IAM dans le compte de production, et stocker ses clés d'accès dans AWS Secrets Manager dans le compte d'outillage avec un calendrier de rotation, pour que l'action de déploiement les utilise.
    - id: e
      text:
        en: |-
          Create the CloudFormation execution role in the tooling account with the resource permissions, and set its ARN in the RoleArn configuration of the deploy action.
        fr: |-
          Créer le rôle d'exécution CloudFormation dans le compte d'outillage avec les autorisations sur les ressources, et définir son ARN dans le paramètre de configuration RoleArn de l'action de déploiement.
    - id: f
      text:
        en: |-
          Set the action's roleArn to the production deployment role, and its RoleArn configuration to a production execution role that trusts cloudformation.amazonaws.com.
        fr: |-
          Définir le roleArn de l'action sur le rôle de déploiement de production, et son paramètre de configuration RoleArn sur un rôle d'exécution de production qui approuve cloudformation.amazonaws.com.
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |-
      Artifacts read by another account must be encrypted with a customer managed key whose policy, like the bucket policy, allows the target role. The deploy action runs as a role in the production account (the action's roleArn) that trusts the pipeline's service role. That role passes a separate CloudFormation execution role in the same account, which holds the resource permissions and can be assumed only by CloudFormation, so the action role itself stays limited to CloudFormation and artifact access.
    fr: |-
      Les artefacts lus par un autre compte doivent être chiffrés avec une clé gérée par le client dont la politique, comme la politique de compartiment, autorise le rôle cible. L'action de déploiement s'exécute sous un rôle du compte de production (le roleArn de l'action) qui approuve le rôle de service du pipeline. Ce rôle transmet un rôle d'exécution CloudFormation distinct du même compte, qui détient les autorisations sur les ressources et ne peut être endossé que par CloudFormation : le rôle de l'action reste limité à CloudFormation et à l'accès aux artefacts.
  options:
    b:
      en: |-
        The AWS managed key can't be shared with another account, so the production role still couldn't decrypt the artifacts.
      fr: |-
        La clé gérée par AWS ne peut pas être partagée avec un autre compte : le rôle de production ne pourrait toujours pas déchiffrer les artefacts.
    d:
      en: |-
        Access keys of an IAM user are long-term credentials, which the security team forbids.
      fr: |-
        Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, interdites par l'équipe de sécurité.
    e:
      en: |-
        The CloudFormation execution role must be in the same account as the action role, here the production account.
      fr: |-
        Le rôle d'exécution CloudFormation doit se trouver dans le même compte que le rôle de l'action, ici le compte de production.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
