id: sapc03-5b-centralization-cmk
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany centralizes the CloudWatch Logs data of its organization into a security account in eu-west-1, with eu-north-1 as the backup Region of the centralization rule. Many source log groups are encrypted with customer managed AWS KMS keys that the workload accounts own. The security policy requires every centralized log group, in both Regions, to be encrypted with a customer managed key that the security account owns. No log event may be dropped because of how its source log group is encrypted.

    Which solution will meet these requirements?
  fr: |
    AnyCompany centralise les données CloudWatch Logs de son organisation dans un compte de sécurité dans eu-west-1, avec eu-north-1 comme Région de sauvegarde de la règle de centralisation. De nombreux groupes de journaux sources sont chiffrés avec des clés AWS KMS gérées par le client qui appartiennent aux comptes de charge de travail. La politique de sécurité exige que chaque groupe de journaux centralisé, dans les deux Régions, soit chiffré avec une clé gérée par le client qui appartient au compte de sécurité. Aucun événement de journal ne doit être abandonné à cause du chiffrement de son groupe de journaux source.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure the rule to centralize the log groups that use customer managed keys into destination log groups that are encrypted with an AWS owned key.", fr: "Configurer la règle pour centraliser les groupes de journaux qui utilisent des clés gérées par le client dans des groupes de journaux de destination chiffrés avec une clé détenue par AWS." } }
    - { id: b, text: { en: "Configure the rule to skip the source log groups that use customer managed keys, and stream those log groups to the security account with subscription filters.", fr: "Configurer la règle pour ignorer les groupes de journaux sources qui utilisent des clés gérées par le client, et diffuser ces groupes de journaux vers le compte de sécurité avec des filtres d'abonnement." } }
    - { id: c, text: { en: "Configure the rule with a customer managed key of the security account in eu-west-1, and reuse the ARN of that same key for the backup copy in eu-north-1.", fr: "Configurer la règle avec une clé gérée par le client du compte de sécurité dans eu-west-1, et réutiliser l'ARN de cette même clé pour la copie de sauvegarde dans eu-north-1." } }
    - { id: d, text: { en: "Configure the rule with a destination key in eu-west-1 and a backup key in eu-north-1, both customer managed keys of the security account tagged LogsManaged = true.", fr: "Configurer la règle avec une clé de destination dans eu-west-1 et une clé de sauvegarde dans eu-north-1, toutes deux gérées par le client dans le compte de sécurité et balisées LogsManaged = true." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For source log groups encrypted with customer managed keys, a centralization rule can use a destination-specific customer managed key, with the key ARN for the primary Region and a backup key ARN when a backup Region is set. The destination keys must carry the tag LogsManaged = true, otherwise the rule fails to deliver the logs."
    fr: "Pour les groupes de journaux sources chiffrés avec des clés gérées par le client, une règle de centralisation peut utiliser une clé gérée par le client propre à la destination, avec l'ARN de la clé pour la Région principale et l'ARN d'une clé de sauvegarde quand une Région de sauvegarde est définie. Les clés de destination doivent porter la balise LogsManaged = true ; sinon, la règle échoue à livrer les journaux."
  options:
    a: { en: "An AWS owned key is not a customer managed key of the security account, so the centralized log groups would break the security policy.", fr: "Une clé détenue par AWS n'est pas une clé gérée par le client du compte de sécurité : les groupes de journaux centralisés enfreindraient la politique de sécurité." }
    b: { en: "Skipping these log groups leaves them out of the centralized copy, and a second streaming path adds components without encrypting a backup copy in eu-north-1.", fr: "Ignorer ces groupes de journaux les exclut de la copie centralisée, et un second chemin de streaming ajoute des composants sans chiffrer de copie de sauvegarde dans eu-north-1." }
    c: { en: "A KMS key belongs to one Region, so a key in eu-west-1 cannot encrypt the backup log groups in eu-north-1, and the rule needs a separate backup key ARN.", fr: "Une clé KMS appartient à une seule Région : une clé de eu-west-1 ne peut pas chiffrer les groupes de journaux de sauvegarde de eu-north-1, et la règle a besoin d'un ARN de clé de sauvegarde distinct." }
references:
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
