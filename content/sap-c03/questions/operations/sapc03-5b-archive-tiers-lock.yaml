id: sapc03-5b-archive-tiers-lock
objective: "5.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank archives the logs of all its accounts in an S3 bucket of its Log Archive account, delivered by Amazon Data Firehose. Analysts query the last 30 days of logs with Amazon Athena several times a day. Auditors query logs that are 30 to 180 days old a few times a month and expect results within seconds. Logs older than 180 days are retrieved about once a year, and a delay of up to 48 hours is acceptable for them. Regulators require that no one, including the root user, can delete or overwrite any log object for 10 years. The bank wants the LOWEST storage cost that meets these requirements.

    Which combination of steps will meet these requirements? (Choose three.)

    Each correct answer presents part of the solution.
  fr: |
    Une banque archive les journaux de tous ses comptes dans un compartiment S3 de son compte Log Archive, livrés par Amazon Data Firehose. Les analystes interrogent les 30 derniers jours de journaux avec Amazon Athena plusieurs fois par jour. Les auditeurs interrogent des journaux âgés de 30 à 180 jours quelques fois par mois et attendent des résultats en quelques secondes. Les journaux de plus de 180 jours sont récupérés environ une fois par an, et un délai allant jusqu'à 48 heures est acceptable pour eux. Les régulateurs exigent que personne, y compris l'utilisateur root, ne puisse supprimer ou écraser un objet de journal pendant 10 ans. La banque veut le coût de stockage le PLUS BAS qui réponde à ces exigences.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Turn on S3 Object Lock with a default retention of 10 years in governance mode.", fr: "Activer S3 Object Lock avec une rétention par défaut de 10 ans en mode gouvernance." } }
    - { id: b, text: { en: "Turn on S3 Object Lock with a default retention of 10 years in compliance mode.", fr: "Activer S3 Object Lock avec une rétention par défaut de 10 ans en mode conformité." } }
    - { id: c, text: { en: "Add a Lifecycle rule that transitions objects to S3 Glacier Instant Retrieval 30 days after creation.", fr: "Ajouter une règle de cycle de vie qui fait passer les objets vers S3 Glacier Instant Retrieval 30 jours après leur création." } }
    - { id: d, text: { en: "Add a Lifecycle rule that transitions objects to S3 Glacier Flexible Retrieval 30 days after creation.", fr: "Ajouter une règle de cycle de vie qui fait passer les objets vers S3 Glacier Flexible Retrieval 30 jours après leur création." } }
    - { id: e, text: { en: "Add a Lifecycle rule that expires objects 180 days after creation, and keep the logs in CloudWatch Logs for 10 years.", fr: "Ajouter une règle de cycle de vie qui fait expirer les objets 180 jours après leur création, et conserver les journaux dans CloudWatch Logs pendant 10 ans." } }
    - { id: f, text: { en: "Add a Lifecycle rule that transitions objects to S3 Glacier Deep Archive 180 days after creation.", fr: "Ajouter une règle de cycle de vie qui fait passer les objets vers S3 Glacier Deep Archive 180 jours après leur création." } }
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: "In compliance mode, a protected object version cannot be overwritten or deleted by any user, including the root user, until its retention date. S3 Glacier Instant Retrieval keeps millisecond access for rarely accessed data, and the objects stay there 150 days, beyond its 90-day minimum; S3 Glacier Deep Archive is the lowest-cost class, its Standard retrievals finish within 12 hours and Bulk retrievals within 48 hours, and its 180-day minimum is met by a 10-year retention."
    fr: "En mode conformité, une version d'objet protégée ne peut être ni écrasée ni supprimée par aucun utilisateur, y compris l'utilisateur root, avant sa date de fin de rétention. S3 Glacier Instant Retrieval conserve un accès en millisecondes pour des données rarement consultées, et les objets y restent 150 jours, au-delà de sa durée minimale de 90 jours ; S3 Glacier Deep Archive est la classe la moins chère, ses récupérations Standard se terminent en 12 heures et ses récupérations Bulk en 48 heures, et sa durée minimale de 180 jours est respectée par une rétention de 10 ans."
  options:
    a: { en: "In governance mode, users with the s3:BypassGovernanceRetention permission can delete objects or shorten the retention, so the regulators' requirement is not met.", fr: "En mode gouvernance, les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent supprimer des objets ou raccourcir la rétention : l'exigence des régulateurs n'est pas respectée." }
    d: { en: "Objects in S3 Glacier Flexible Retrieval must be restored before they can be read, so the auditors could not get results within seconds.", fr: "Les objets de S3 Glacier Flexible Retrieval doivent être restaurés avant d'être lus : les auditeurs ne pourraient pas obtenir de résultats en quelques secondes." }
    e: { en: "Expiring the archive defeats the 10-year immutable retention, and keeping 10 years of logs in CloudWatch Logs costs far more than Glacier storage.", fr: "Faire expirer l'archive va à l'encontre de la rétention immuable de 10 ans, et conserver 10 ans de journaux dans CloudWatch Logs coûte bien plus cher qu'un stockage Glacier." }
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
