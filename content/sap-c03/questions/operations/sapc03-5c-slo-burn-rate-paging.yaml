id: sapc03-5c-slo-burn-rate-paging
objective: "5.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs its card authorization API on Amazon ECS in a production account, and the service is instrumented with CloudWatch Application Signals. The on-call engineer is paged by a static CloudWatch alarm on a 5xx rate above 1 percent for 5 minutes, which fired 15 times last week, and most pages resolved on their own within minutes. The business target is 99.9 percent of requests succeeding over any 30-day period. The company wants to page only when this target is at real risk, to catch both a sudden outage within minutes and a slower degradation within hours, and to stop paging soon after the problem is fixed.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de paiement exploite son API d'autorisation de cartes sur Amazon ECS dans un compte de production, et le service est instrumenté avec CloudWatch Application Signals. L'ingénieur d'astreinte est alerté par une alarme CloudWatch statique sur un taux de 5xx supérieur à 1 % pendant 5 minutes, qui s'est déclenchée 15 fois la semaine dernière, et la plupart des alertes se sont résolues d'elles-mêmes en quelques minutes. L'objectif métier est que 99,9 % des requêtes réussissent sur toute période de 30 jours. L'entreprise veut n'alerter que lorsque cet objectif est réellement menacé, détecter aussi bien une panne soudaine en quelques minutes qu'une dégradation plus lente en quelques heures, et cesser d'alerter peu après la correction du problème.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a request-based Application Signals SLO on the Availability of the service with a 99.9 percent goal and a rolling 30-day interval.
        fr: |-
          Créer un SLO Application Signals basé sur les requêtes, sur l'Availability du service, avec un objectif de 99,9 % et un intervalle glissant de 30 jours.
    - id: b
      text:
        en: |-
          Replace the static threshold with an anomaly detection band on the 5xx rate, and page when the rate stays above the band for 5 minutes.
        fr: |-
          Remplacer le seuil statique par une bande de détection d'anomalies sur le taux de 5xx, et alerter quand le taux reste au-dessus de la bande pendant 5 minutes.
    - id: c
      text:
        en: |-
          Create burn rate alarm pairs on the SLO (1 hour with 5 minutes, 6 hours with 30 minutes), and page from a composite AND alarm per pair.
        fr: |-
          Créer des paires d'alarmes de taux de consommation (burn rate) sur le SLO (1 heure avec 5 minutes, 6 heures avec 30 minutes), et alerter depuis une alarme composite AND par paire.
    - id: d
      text:
        en: |-
          Create one burn rate alarm on the SLO with a 3-day look-back window, and page the on-call engineer when the burn rate exceeds 1.
        fr: |-
          Créer une seule alarme de taux de consommation sur le SLO avec une fenêtre d'analyse de 3 jours, et alerter l'ingénieur d'astreinte quand le taux de consommation dépasse 1.
    - id: e
      text:
        en: |-
          Keep the static alarm, raise its threshold to 5 percent, and require 15 of 15 breaching datapoints before it pages.
        fr: |-
          Conserver l'alarme statique, relever son seuil à 5 % et exiger 15 points de données en dépassement sur 15 avant d'alerter.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      An SLO turns the 99.9 percent target into an error budget, and burn rate alarms measure how fast that budget is being spent. In each pair, the long window requires a sustained burn before paging and the short window returns to OK quickly once the problem is fixed; the 1-hour pair catches a sudden outage and the 6-hour pair catches a slower degradation, each joined with AND in a composite alarm.
    fr: |-
      Un SLO transforme l'objectif de 99,9 % en budget d'erreur, et les alarmes de taux de consommation mesurent la vitesse à laquelle ce budget est dépensé. Dans chaque paire, la fenêtre longue exige une consommation soutenue avant d'alerter et la fenêtre courte repasse à OK rapidement une fois le problème corrigé ; la paire de 1 heure détecte une panne soudaine et celle de 6 heures une dégradation plus lente, chacune combinée par AND dans une alarme composite.
  options:
    b:
      en: |-
        An anomaly band still reacts to every short spike and isn't tied to the 99.9 percent target, so it keeps paging for blips that don't threaten the objective.
      fr: |-
        Une bande d'anomalie réagit toujours à chaque pic bref et n'est pas liée à l'objectif de 99,9 % : elle continue d'alerter pour des incidents mineurs qui ne menacent pas l'objectif.
    d:
      en: |-
        A single 3-day window detects a sudden outage too slowly and keeps alarming long after the fix, and a threshold of 1 pages for any burn faster than budget.
      fr: |-
        Une seule fenêtre de 3 jours détecte trop lentement une panne soudaine et reste en alarme longtemps après la correction, et un seuil de 1 alerte pour toute consommation plus rapide que le budget.
    e:
      en: |-
        A higher static threshold misses slow degradations below 5 percent that can still exhaust a 0.1 percent error budget, and it isn't tied to the objective.
      fr: |-
        Un seuil statique plus élevé manque les dégradations lentes inférieures à 5 % qui peuvent pourtant épuiser un budget d'erreur de 0,1 %, et il n'est pas lié à l'objectif.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
