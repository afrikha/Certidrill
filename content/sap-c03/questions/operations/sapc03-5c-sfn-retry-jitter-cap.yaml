id: sapc03-5c-sfn-retry-jitter-cap
objective: "5.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an AWS Step Functions Standard workflow whose Distributed Map state processes 500 items in parallel, and each item calls a partner API through a Task state. The Task state's retrier uses an IntervalSeconds of 2, a MaxAttempts of 10, and a BackoffRate of 2.0. During a partner outage, all 500 iterations retried at the same moments and hit the API in waves, and the last retries waited more than 15 minutes. The company wants retries to be spread out randomly and the wait between attempts never to exceed 60 seconds, without adding states to the workflow.

    Which change to the retrier will meet these requirements?
  fr: |
    Une entreprise exécute un flux de travail Standard AWS Step Functions dont l'état Distributed Map traite 500 éléments en parallèle, et chaque élément appelle une API partenaire au moyen d'un état Task. Le retrier de l'état Task utilise un IntervalSeconds de 2, un MaxAttempts de 10 et un BackoffRate de 2.0. Pendant une panne du partenaire, les 500 itérations ont réessayé aux mêmes instants et ont frappé l'API par vagues, et les dernières tentatives ont attendu plus de 15 minutes. L'entreprise veut que les nouvelles tentatives soient réparties de façon aléatoire et que l'attente entre deux tentatives ne dépasse jamais 60 secondes, sans ajouter d'états au flux de travail.

    Quelle modification du retrier permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set BackoffRate to 1.0 so that every retry waits the same 2 seconds.
        fr: |-
          Définir BackoffRate sur 1.0 afin que chaque nouvelle tentative attende les mêmes 2 secondes.
    - id: b
      text:
        en: |-
          Set MaxAttempts to 5 so that the longest wait stays under 60 seconds.
        fr: |-
          Définir MaxAttempts sur 5 afin que l'attente la plus longue reste inférieure à 60 secondes.
    - id: c
      text:
        en: |-
          Set JitterStrategy to FULL and MaxDelaySeconds to 60.
        fr: |-
          Définir JitterStrategy sur FULL et MaxDelaySeconds sur 60.
    - id: d
      text:
        en: |-
          Replace the retrier with a Catch that goes to a Wait state of 60 seconds and then back to the Task state.
        fr: |-
          Remplacer le retrier par un Catch qui passe à un état Wait de 60 secondes puis revient à l'état Task.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      JitterStrategy FULL randomizes the interval of each retry, which desynchronizes the 500 iterations, and MaxDelaySeconds caps the interval that the backoff can reach. Both are retrier fields, so no state is added.
    fr: |-
      JitterStrategy FULL rend aléatoire l'intervalle de chaque nouvelle tentative, ce qui désynchronise les 500 itérations, et MaxDelaySeconds plafonne l'intervalle que le backoff peut atteindre. Ce sont deux champs du retrier : aucun état n'est ajouté.
  options:
    a:
      en: |-
        A constant interval keeps all iterations synchronized, so the waves continue, and it removes the backoff that protects the recovering API.
      fr: |-
        Un intervalle constant garde toutes les itérations synchronisées, si bien que les vagues continuent, et il supprime le backoff qui protège l'API en cours de reprise.
    b:
      en: |-
        Fewer attempts shorten the waits but keep the retries synchronized, and items fail sooner during a long outage.
      fr: |-
        Moins de tentatives raccourcissent les attentes mais gardent les nouvelles tentatives synchronisées, et les éléments échouent plus tôt pendant une longue panne.
    d:
      en: |-
        A Catch and a Wait state add states to the workflow, and a fixed 60-second wait is still synchronized across iterations.
      fr: |-
        Un Catch et un état Wait ajoutent des états au flux de travail, et une attente fixe de 60 secondes reste synchronisée entre les itérations.
references:
  - title: "Handling errors in Step Functions workflows - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
