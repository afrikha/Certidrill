id: sapc03-5b-ecs-nlb-canary
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A stock-trading platform is building a new Amazon ECS service on AWS Fargate for its order gateway. Clients connect over a proprietary TCP protocol, so the service must run behind a Network Load Balancer. For each release, the company wants 5% of the traffic to reach the new version for 15 minutes, and then all the traffic. If a CloudWatch alarm on order rejections goes to ALARM during the release, traffic must return to the previous version automatically. The company wants to use managed deployment features with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une plateforme de courtage d'actions construit un nouveau service Amazon ECS sur AWS Fargate pour sa passerelle d'ordres. Les clients se connectent avec un protocole TCP propriétaire : le service doit donc fonctionner derrière un Network Load Balancer. Pour chaque version, l'entreprise veut que 5 % du trafic atteigne la nouvelle version pendant 15 minutes, puis tout le trafic. Si une alarme CloudWatch sur les rejets d'ordres passe à l'état ALARM pendant la mise en production, le trafic doit revenir automatiquement à la version précédente. L'entreprise veut utiliser des fonctionnalités de déploiement gérées avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the CODE_DEPLOY deployment controller with the CodeDeployDefault.ECSCanary10Percent15Minutes configuration, and add the CloudWatch alarm to the deployment group.", fr: "Utiliser le contrôleur de déploiement CODE_DEPLOY avec la configuration CodeDeployDefault.ECSCanary10Percent15Minutes, et ajouter l'alarme CloudWatch au groupe de déploiement." } }
    - { id: b, text: { en: "Put an Application Load Balancer in front of the service instead, and use the CODE_DEPLOY deployment controller with a custom canary configuration of 5% for 15 minutes.", fr: "Placer plutôt un Application Load Balancer devant le service, et utiliser le contrôleur de déploiement CODE_DEPLOY avec une configuration canary personnalisée de 5 % pendant 15 minutes." } }
    - { id: c, text: { en: "Run two ECS services behind two Network Load Balancers, and have an AWS Lambda function adjust the weights of Route 53 weighted records according to the alarm.", fr: "Exécuter deux services ECS derrière deux Network Load Balancers, et faire ajuster par une fonction AWS Lambda les pondérations d'enregistrements pondérés Route 53 en fonction de l'alarme." } }
    - { id: d, text: { en: "Use the ECS deployment controller with the canary deployment strategy, a canary percentage of 5%, a canary bake time of 15 minutes, and the CloudWatch alarm.", fr: "Utiliser le contrôleur de déploiement ECS avec la stratégie de déploiement canary, un pourcentage canary de 5 %, une durée d'observation (bake time) canary de 15 minutes et l'alarme CloudWatch." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon ECS has built-in canary deployments: it routes a canary percentage of the traffic to the new revision, waits for the canary bake time, then shifts the rest, and CloudWatch alarms can roll the deployment back. Since February 2026, the built-in linear and canary strategies also support services behind a Network Load Balancer, so no extra deployment service is needed."
    fr: "Amazon ECS propose des déploiements canary intégrés : il envoie un pourcentage canary du trafic vers la nouvelle révision, attend la durée d'observation canary, puis déplace le reste, et des alarmes CloudWatch peuvent restaurer le déploiement. Depuis février 2026, les stratégies intégrées linéaire et canary prennent aussi en charge les services derrière un Network Load Balancer : aucun service de déploiement supplémentaire n'est nécessaire."
  options:
    a: { en: "With a Network Load Balancer, CodeDeploy supports only the CodeDeployDefault.ECSAllAtOnce configuration for ECS, and this configuration would send 10%, not 5%.", fr: "Avec un Network Load Balancer, CodeDeploy ne prend en charge que la configuration CodeDeployDefault.ECSAllAtOnce pour ECS, et cette configuration enverrait 10 % et non 5 %." }
    b: { en: "An Application Load Balancer handles HTTP and HTTPS, not a proprietary TCP protocol, so the service would stop working for its clients.", fr: "Un Application Load Balancer traite HTTP et HTTPS, pas un protocole TCP propriétaire : le service cesserait de fonctionner pour ses clients." }
    c: { en: "Custom DNS weighting adds code to maintain, and DNS caching makes both the 5% split and the rollback imprecise and slow.", fr: "Une pondération DNS personnalisée ajoute du code à maintenir, et la mise en cache DNS rend la répartition à 5 % comme la restauration imprécises et lentes." }
references:
  - title: Amazon ECS canary deployments
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/canary-deployment.html
  - title: Working with deployment configurations in CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
