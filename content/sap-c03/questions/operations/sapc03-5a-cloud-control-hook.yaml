id: sapc03-5a-cloud-control-hook
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company is standardizing policy as code across its AWS accounts. Some teams deploy with AWS CloudFormation, and other teams use the Terraform AWS Cloud Control provider (awscc), which creates, updates, and deletes every AWS resource through the AWS Cloud Control API. The security team requires that every Amazon DynamoDB table have point-in-time recovery and deletion protection enabled. A non-compliant table must be rejected before either tool provisions it, with a descriptive message. The security team wants to maintain a single set of rules and no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution standardise les politiques en tant que code dans ses comptes AWS. Certaines équipes déploient avec AWS CloudFormation, et d'autres utilisent le fournisseur Terraform AWS Cloud Control (awscc), qui crée, met à jour et supprime chaque ressource AWS par l'API AWS Cloud Control. L'équipe de sécurité exige que chaque table Amazon DynamoDB ait la restauration à un instant dans le passé et la protection contre la suppression activées. Une table non conforme doit être rejetée avant que l'un ou l'autre outil ne la provisionne, avec un message explicite. L'équipe de sécurité veut maintenir un seul jeu de règles et aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run CloudFormation Guard rules on the templates in the pipelines of the CloudFormation teams, and run the same rule files on the Terraform plan files in the pipelines of the other teams.
        fr: |-
          Exécuter des règles CloudFormation Guard sur les modèles dans les pipelines des équipes CloudFormation, et exécuter les mêmes fichiers de règles sur les fichiers de plan Terraform dans les pipelines des autres équipes.
    - id: b
      text:
        en: |-
          Deploy an AWS Config custom policy rule written in Guard, with automatic remediation that turns on point-in-time recovery and deletion protection for tables after they are created.
        fr: |-
          Déployer une règle de politique personnalisée AWS Config écrite en Guard, avec une correction automatique qui active la restauration à un instant dans le passé et la protection contre la suppression des tables après leur création.
    - id: c
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook with the rules in FAIL mode, with TargetOperations set to RESOURCE and CLOUD_CONTROL, in every account and Region that the teams use.
        fr: |-
          Déployer un AWS::CloudFormation::GuardHook avec les règles en mode FAIL, avec TargetOperations défini à RESOURCE et CLOUD_CONTROL, dans chaque compte et chaque Région utilisés par les équipes.
    - id: d
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook with the rules in FAIL mode, with TargetOperations set to STACK and CHANGE_SET, in every account and Region that the teams use.
        fr: |-
          Déployer un AWS::CloudFormation::GuardHook avec les règles en mode FAIL, avec TargetOperations défini à STACK et CHANGE_SET, dans chaque compte et chaque Région utilisés par les équipes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudFormation Hooks can target CLOUD_CONTROL operations as well as CloudFormation RESOURCE operations, and run immediately before the Cloud Control API creates, updates, or deletes a resource. One Guard hook with both targets applies the same rules to both teams' tools, and FAIL mode stops a non-compliant table with the rule's message before it is provisioned, with no custom code.
    fr: |-
      Les hooks CloudFormation peuvent cibler les opérations CLOUD_CONTROL en plus des opérations RESOURCE de CloudFormation, et s'exécutent juste avant que l'API Cloud Control ne crée, mette à jour ou supprime une ressource. Un seul hook Guard avec les deux cibles applique les mêmes règles aux outils des deux équipes, et le mode FAIL arrête une table non conforme avec le message de la règle avant son provisionnement, sans code personnalisé.
  options:
    a:
      en: |-
        Terraform plan files don't have the structure of CloudFormation templates, so the same rule files don't apply; and a check that runs only in pipelines can be bypassed by any other deployment path.
      fr: |-
        Les fichiers de plan Terraform n'ont pas la structure des modèles CloudFormation : les mêmes fichiers de règles ne s'appliquent pas ; et un contrôle qui ne s'exécute que dans les pipelines peut être contourné par tout autre chemin de déploiement.
    b:
      en: |-
        A Config rule evaluates tables after they exist; remediation fixes them later instead of rejecting them before provisioning.
      fr: |-
        Une règle Config évalue les tables une fois qu'elles existent ; la correction les rectifie ensuite au lieu de les rejeter avant le provisionnement.
    d:
      en: |-
        STACK and CHANGE_SET targets evaluate CloudFormation stacks and change sets only, so tables created by the awscc provider through the Cloud Control API are never evaluated.
      fr: |-
        Les cibles STACK et CHANGE_SET n'évaluent que les piles et les jeux de modifications CloudFormation : les tables créées par le fournisseur awscc par l'API Cloud Control ne sont jamais évaluées.
references:
  - title: CloudFormation Hooks concepts - CloudFormation
