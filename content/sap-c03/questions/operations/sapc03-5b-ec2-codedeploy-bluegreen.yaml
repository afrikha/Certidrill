id: sapc03-5b-ec2-codedeploy-bluegreen
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. AWS CodeDeploy deploys each release in place with the CodeDeployDefault.OneAtATime configuration. When a release fails in production, the automatic rollback redeploys the previous revision instance by instance, which takes more than an hour on the 40 instances. The company wants a rollback that takes only minutes during the first hour after each release, and it does not want capacity to drop during deployments. The instances are stateless and are launched from a launch template.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer. AWS CodeDeploy déploie chaque version sur place avec la configuration CodeDeployDefault.OneAtATime. Quand une version échoue en production, la restauration automatique redéploie la révision précédente instance par instance, ce qui prend plus d'une heure sur les 40 instances. L'entreprise veut une restauration qui ne prenne que quelques minutes pendant la première heure qui suit chaque version, et elle ne veut pas que la capacité diminue pendant les déploiements. Les instances sont sans état et sont lancées à partir d'un modèle de lancement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep in-place deployments, switch to the CodeDeployDefault.AllAtOnce configuration, and turn on automatic rollback when a deployment fails or an alarm threshold is met.", fr: "Conserver les déploiements sur place, passer à la configuration CodeDeployDefault.AllAtOnce, et activer la restauration automatique en cas d'échec du déploiement ou de franchissement d'un seuil d'alarme." } }
    - { id: b, text: { en: "Keep in-place deployments with the CodeDeployDefault.HalfAtATime configuration, and add 20 extra instances to the Auto Scaling group for the duration of each deployment.", fr: "Conserver les déploiements sur place avec la configuration CodeDeployDefault.HalfAtATime, et ajouter 20 instances supplémentaires au groupe Auto Scaling pendant chaque déploiement." } }
    - { id: c, text: { en: "Use a blue/green deployment group that copies the Auto Scaling group, reroutes the load balancer traffic, and keeps the original instances for 1 hour before terminating them.", fr: "Utiliser un groupe de déploiement bleu/vert qui copie le groupe Auto Scaling, réachemine le trafic de l'équilibreur de charge et conserve les instances d'origine pendant 1 heure avant de les résilier." } }
    - { id: d, text: { en: "Create a second Auto Scaling group behind a second load balancer for each release, and switch a Route 53 record to the new load balancer after its instances pass health checks.", fr: "Créer pour chaque version un second groupe Auto Scaling derrière un second équilibreur de charge, et basculer un enregistrement Route 53 vers le nouvel équilibreur après la réussite des vérifications de l'état." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In a blue/green deployment, CodeDeploy creates the replacement instances from a copy of the Auto Scaling group, registers them with the load balancer, and then handles the original instances as the deployment group specifies. While the original instances still exist, traffic can be routed back to them, which is much faster than redeploying, and capacity never drops because both environments run during the switch."
    fr: "Dans un déploiement bleu/vert, CodeDeploy crée les instances de remplacement à partir d'une copie du groupe Auto Scaling, les enregistre auprès de l'équilibreur de charge, puis traite les instances d'origine comme le précise le groupe de déploiement. Tant que les instances d'origine existent, le trafic peut être renvoyé vers elles, ce qui est bien plus rapide qu'un redéploiement, et la capacité ne diminue jamais car les deux environnements fonctionnent pendant la bascule."
  options:
    a: { en: "An in-place rollback still redeploys the previous revision, and AllAtOnce takes every instance out of service at the same time.", fr: "Une restauration sur place redéploie toujours la révision précédente, et AllAtOnce met toutes les instances hors service en même temps." }
    b: { en: "Extra instances protect capacity, but an in-place rollback still redeploys the old revision on every instance, which is the slow step.", fr: "Des instances supplémentaires protègent la capacité, mais une restauration sur place redéploie toujours l'ancienne révision sur chaque instance, ce qui est l'étape lente." }
    d: { en: "This rebuilds blue/green with custom steps, and DNS caching delays both the switch and the switch back, so rollback is not reliably fast.", fr: "Cette option reconstruit le bleu/vert avec des étapes personnalisées, et la mise en cache DNS retarde la bascule comme le retour arrière : la restauration n'est pas rapide de façon fiable." }
references:
  - title: What is CodeDeploy?
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/welcome.html
  - title: Redeploy and roll back a deployment with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-rollback-and-redeploy.html
