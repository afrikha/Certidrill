id: sapc03-5b-eb-full-capacity-rollback
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a customer portal on AWS Elastic Beanstalk in a load-balanced environment with an Application Load Balancer. Partners reach the portal through the environment's DNS name, which some of their proxies cache for hours, so the DNS name and its target must not change during deployments. The environment must keep its full capacity during each deployment. If a new version fails its health checks, Elastic Beanstalk must restore service by removing the new instances, without redeploying the previous version to the existing instances.

    Which deployment options will meet these requirements? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute un portail client sur AWS Elastic Beanstalk dans un environnement à charge équilibrée avec un Application Load Balancer. Les partenaires accèdent au portail par le nom DNS de l'environnement, que certains de leurs proxys mettent en cache pendant des heures : le nom DNS et sa cible ne doivent donc pas changer pendant les déploiements. L'environnement doit conserver toute sa capacité pendant chaque déploiement. Si une nouvelle version échoue à ses vérifications de l'état, Elastic Beanstalk doit rétablir le service en supprimant les nouvelles instances, sans redéployer la version précédente sur les instances existantes.

    Quelles options de déploiement répondent à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use the immutable deployment policy for application deployments.", fr: "Utiliser la politique de déploiement immuable (immutable) pour les déploiements d'application." } }
    - { id: b, text: { en: "Use the rolling with additional batch deployment policy for application deployments.", fr: "Utiliser la politique de déploiement propagé avec lot supplémentaire (rolling with additional batch)." } }
    - { id: c, text: { en: "Deploy each version to a cloned environment, and swap the environment URLs.", fr: "Déployer chaque version dans un environnement cloné, puis permuter les URL des environnements." } }
    - { id: d, text: { en: "Use the traffic-splitting deployment policy for application deployments.", fr: "Utiliser la politique de déploiement par fractionnement du trafic (traffic splitting)." } }
    - { id: e, text: { en: "Use the rolling deployment policy with a batch size of 25%.", fr: "Utiliser la politique de déploiement propagé (rolling) avec une taille de lot de 25 %." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An immutable update launches a full set of new instances in a separate Auto Scaling group beside the old ones; if they fail health checks, Elastic Beanstalk terminates them and leaves the original instances untouched. Traffic splitting also launches a full set of new instances, shifts a share of the load balancer traffic to them, and on failure moves traffic back and terminates them; neither option changes the environment's DNS name."
    fr: "Une mise à jour immuable lance un ensemble complet de nouvelles instances dans un groupe Auto Scaling distinct à côté des anciennes ; si elles échouent aux vérifications de l'état, Elastic Beanstalk les résilie et laisse les instances d'origine intactes. Le fractionnement du trafic lance aussi un ensemble complet de nouvelles instances, leur envoie une part du trafic de l'équilibreur de charge et, en cas d'échec, ramène le trafic et les résilie ; aucune des deux options ne change le nom DNS de l'environnement."
  options:
    b: { en: "The additional batch keeps full capacity, but the existing instances are updated in place, so a failed deployment must be fixed by redeploying a good version.", fr: "Le lot supplémentaire conserve toute la capacité, mais les instances existantes sont mises à jour sur place : un déploiement en échec doit être corrigé en redéployant une bonne version." }
    c: { en: "Swapping environment URLs is a DNS change, which the partners' caching proxies would not see for hours.", fr: "Permuter les URL d'environnement est une modification DNS, que les proxys des partenaires ne verraient pas avant des heures." }
    e: { en: "Each batch is taken out of service, which reduces capacity by 25%, and completed batches keep the new version after a failure.", fr: "Chaque lot est mis hors service, ce qui réduit la capacité de 25 %, et les lots terminés conservent la nouvelle version après un échec." }
references:
  - title: Deployment policies and settings
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
