id: sapc03-5b-mute-rule-maintenance
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team patches the database tier of its platform during a two-hour maintenance window that starts at 02:00 on the fourth Sunday of each month, in the Europe/Paris time zone. During the window, 45 CloudWatch alarms send Amazon SNS notifications that wake engineers up for expected failovers. The team wants these notifications silenced during the window while the alarms keep being evaluated. If an alarm is in a different state at the end of the window than at its start, the alarm's actions must run then. The team does not want to write or schedule any code.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation applique des correctifs à la couche base de données de sa plateforme pendant une fenêtre de maintenance de deux heures qui commence à 02:00 le quatrième dimanche de chaque mois, dans le fuseau horaire Europe/Paris. Pendant la fenêtre, 45 alarmes CloudWatch envoient des notifications Amazon SNS qui réveillent les ingénieurs pour des basculements attendus. L'équipe veut faire taire ces notifications pendant la fenêtre, tout en continuant d'évaluer les alarmes. Si une alarme est dans un état différent à la fin de la fenêtre et au début de celle-ci, ses actions doivent s'exécuter à ce moment-là. L'équipe ne veut écrire ni planifier aucun code.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Lambda function with Amazon EventBridge Scheduler that calls DisableAlarmActions at 02:00 and EnableAlarmActions at 04:00 for the 45 alarms.", fr: "Planifier avec Amazon EventBridge Scheduler une fonction AWS Lambda qui appelle DisableAlarmActions à 02:00 et EnableAlarmActions à 04:00 pour les 45 alarmes." } }
    - { id: b, text: { en: "Create a CloudWatch alarm mute rule with a recurring cron schedule for the fourth Sunday at 02:00 in Europe/Paris, a duration of 2 hours, and the 45 alarms as targets.", fr: "Créer une règle de mise en sourdine d'alarmes CloudWatch avec une planification cron récurrente le quatrième dimanche à 02:00 en Europe/Paris, une durée de 2 heures et les 45 alarmes comme cibles." } }
    - { id: c, text: { en: "Set the treat missing data option of the 45 alarms to ignore, so that the alarms keep their current state while the databases fail over during the window.", fr: "Définir l'option de traitement des données manquantes des 45 alarmes sur ignore, afin que les alarmes conservent leur état actuel pendant les basculements des bases de données dans la fenêtre." } }
    - { id: d, text: { en: "Put the 45 alarms in a composite alarm whose actions suppressor is a metric alarm on the number of database failovers in the last hour.", fr: "Regrouper les 45 alarmes dans une alarme composite dont le suppresseur d'actions est une alarme de métrique sur le nombre de basculements de base de données au cours de la dernière heure." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Alarm mute rules mute alarm actions during predefined windows, with a recurring cron schedule such as the fourth Sunday, a time zone, and a duration, for up to 100 target alarms per rule. The alarms keep being evaluated, and when the window ends, CloudWatch runs the actions of any alarm whose state differs from its state at the start of the window."
    fr: "Les règles de mise en sourdine coupent les actions des alarmes pendant des fenêtres prédéfinies, avec une planification cron récurrente comme le quatrième dimanche, un fuseau horaire et une durée, pour 100 alarmes cibles au plus par règle. Les alarmes continuent d'être évaluées, et à la fin de la fenêtre, CloudWatch exécute les actions de toute alarme dont l'état diffère de celui du début de la fenêtre."
  options:
    a: { en: "A scheduled function is code to write and maintain, and re-enabling actions does not run the actions of alarms that changed state during the window.", fr: "Une fonction planifiée est du code à écrire et à maintenir, et réactiver les actions n'exécute pas celles des alarmes qui ont changé d'état pendant la fenêtre." }
    c: { en: "Failovers produce breaching data points rather than missing ones, so the alarms still change state and notify the engineers.", fr: "Les basculements produisent des points de données en dépassement et non manquants : les alarmes changent quand même d'état et avertissent les ingénieurs." }
    d: { en: "The suppressor would also silence unplanned failovers outside the window, and the 45 alarms would page through one composite alarm instead of their own actions.", fr: "Le suppresseur ferait aussi taire les basculements imprévus hors de la fenêtre, et les 45 alarmes enverraient leurs pages via une seule alarme composite au lieu de leurs propres actions." }
references:
  - title: Alarm Mute Rules
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-mute-rules.html
