id: sapc03-5a-stackset-rollout-prefs
objective: "5.1.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A company is updating a networking baseline StackSet that has 240 stack instances in each of three Regions: eu-west-1, eu-central-1, and us-east-1. The update must run in eu-west-1 first, then in eu-central-1, and then in us-east-1. If more than two accounts fail in a Region, the operation must stop in that Region and must not start in the next Region. Within these limits, the update must run as fast as possible. The operation uses the default concurrency mode.

    Which operation preferences will meet these requirements?
  fr: |
    Une entreprise met à jour un StackSet de base de référence réseau qui compte 240 instances de pile dans chacune de trois Régions : eu-west-1, eu-central-1 et us-east-1. La mise à jour doit s'exécuter d'abord dans eu-west-1, puis dans eu-central-1, puis dans us-east-1. Si plus de deux comptes échouent dans une Région, l'opération doit s'arrêter dans cette Région et ne doit pas démarrer dans la Région suivante. Dans ces limites, la mise à jour doit s'exécuter le plus vite possible. L'opération utilise le mode de simultanéité par défaut.

    Quelles préférences d'opération permettent de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          RegionConcurrencyType PARALLEL, FailureToleranceCount 2, and MaxConcurrentCount 3.
        fr: |-
          RegionConcurrencyType PARALLEL, FailureToleranceCount 2 et MaxConcurrentCount 3.
    - id: b
      text:
        en: |-
          RegionConcurrencyType SEQUENTIAL with RegionOrder eu-west-1, eu-central-1, us-east-1, FailureTolerancePercentage 2, and MaxConcurrentPercentage 25.
        fr: |-
          RegionConcurrencyType SEQUENTIAL avec RegionOrder eu-west-1, eu-central-1, us-east-1, FailureTolerancePercentage 2 et MaxConcurrentPercentage 25.
    - id: c
      text:
        en: |-
          RegionConcurrencyType SEQUENTIAL with RegionOrder eu-west-1, eu-central-1, us-east-1, FailureToleranceCount 2, and MaxConcurrentCount 3.
        fr: |-
          RegionConcurrencyType SEQUENTIAL avec RegionOrder eu-west-1, eu-central-1, us-east-1, FailureToleranceCount 2 et MaxConcurrentCount 3.
    - id: d
      text:
        en: |-
          RegionConcurrencyType SEQUENTIAL with RegionOrder eu-west-1, eu-central-1, us-east-1, FailureToleranceCount 2, and MaxConcurrentCount 20.
        fr: |-
          RegionConcurrencyType SEQUENTIAL avec RegionOrder eu-west-1, eu-central-1, us-east-1, FailureToleranceCount 2 et MaxConcurrentCount 20.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      SEQUENTIAL with a RegionOrder deploys one Region at a time in the given order, and when failures exceed FailureToleranceCount in a Region, StackSets stops there and doesn't attempt the following Regions. With the default STRICT_FAILURE_TOLERANCE mode, MaxConcurrentCount can be at most FailureToleranceCount plus one, so 3 is the fastest valid setting for a tolerance of 2.
    fr: |-
      SEQUENTIAL avec un RegionOrder déploie une Région à la fois dans l'ordre indiqué, et lorsque les échecs dépassent FailureToleranceCount dans une Région, StackSets s'y arrête et ne tente pas les Régions suivantes. Avec le mode par défaut STRICT_FAILURE_TOLERANCE, MaxConcurrentCount vaut au plus FailureToleranceCount plus un : 3 est donc le réglage valide le plus rapide pour une tolérance de 2.
  options:
    a:
      en: |-
        PARALLEL deploys to all Regions at the same time, which breaks the required Region order and the rule not to start the next Region after failures.
      fr: |-
        PARALLEL déploie dans toutes les Régions en même temps, ce qui ne respecte ni l'ordre des Régions exigé ni la règle de ne pas démarrer la Région suivante après des échecs.
    b:
      en: |-
        2 % of 240 accounts rounds down to 4, so up to four failures would be tolerated per Region instead of two.
      fr: |-
        2 % de 240 comptes, arrondi à l'inférieur, donne 4 : jusqu'à quatre échecs seraient tolérés par Région au lieu de deux.
    d:
      en: |-
        In the default STRICT_FAILURE_TOLERANCE mode, MaxConcurrentCount can't exceed FailureToleranceCount plus one, so 20 isn't a valid setting with a tolerance of 2.
      fr: |-
        Dans le mode par défaut STRICT_FAILURE_TOLERANCE, MaxConcurrentCount ne peut pas dépasser FailureToleranceCount plus un : 20 n'est pas un réglage valide avec une tolérance de 2.
references:
  - title: StackSetOperationPreferences - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_StackSetOperationPreferences.html
