id: sapc03-5c-warm-pool-unpredictable-spikes
objective: "5.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial news company runs a market-analytics API on Amazon EC2 instances with EBS root volumes in an Auto Scaling group behind an Application Load Balancer. At boot, each instance loads 40 GB of reference data, so it needs about 18 minutes to become ready. Traffic spikes up to five times the baseline within 2 minutes when major news breaks, and these spikes follow no daily or weekly pattern. To absorb them, the company keeps 30 extra On-Demand Instances running at all times. The company wants new capacity to serve traffic within about 2 minutes of a spike while minimizing cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'informations financières exploite une API d'analyse de marché sur des instances Amazon EC2 à volumes racines EBS dans un groupe Auto Scaling derrière un Application Load Balancer. Au démarrage, chaque instance charge 40 Go de données de référence : elle a donc besoin d'environ 18 minutes pour être prête. Le trafic grimpe jusqu'à cinq fois la base en 2 minutes quand une actualité majeure tombe, et ces pics ne suivent aucun profil quotidien ou hebdomadaire. Pour les absorber, l'entreprise garde en permanence 30 instances à la demande supplémentaires en fonctionnement. L'entreprise veut que la nouvelle capacité serve du trafic dans les 2 minutes environ suivant un pic tout en réduisant les coûts au minimum.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the extra instances with a predictive scaling policy in forecast and scale mode with a scheduling buffer of 20 minutes, and keep the target tracking policy.
        fr: |-
          Remplacer les instances supplémentaires par une politique de mise à l'échelle prédictive en mode prévision et mise à l'échelle avec une marge de planification de 20 minutes, et conserver la politique de suivi de cible.
    - id: b
      text:
        en: |-
          Replace the extra instances with a warm pool whose instances stay in the Running state, so that they are ready to serve traffic immediately.
        fr: |-
          Remplacer les instances supplémentaires par un warm pool dont les instances restent à l'état Running, afin qu'elles soient prêtes à servir du trafic immédiatement.
    - id: c
      text:
        en: |-
          Replace the extra instances with a mixed instances policy that adds Spot Instances and a warm pool of stopped Spot Instances.
        fr: |-
          Remplacer les instances supplémentaires par une politique d'instances mixtes qui ajoute des instances Spot et un warm pool d'instances Spot arrêtées.
    - id: d
      text:
        en: |-
          Use a warm pool of Stopped instances with a launch lifecycle hook that completes after the reference data is loaded, and keep target tracking.
        fr: |-
          Utiliser un warm pool d'instances Stopped avec un hook de cycle de vie de lancement qui se termine une fois les données de référence chargées, et conserver le suivi de cible.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A warm pool keeps pre-initialized instances ready to enter service, so a scale-out starts them instead of running the 18-minute initialization. Stopped instances cost only their EBS volumes and Elastic IP addresses, and the lifecycle hook makes sure each instance finishes loading its data before it is stopped into the pool.
    fr: |-
      Un warm pool garde des instances préinitialisées prêtes à entrer en service : une montée en charge les démarre au lieu d'exécuter l'initialisation de 18 minutes. Les instances arrêtées ne coûtent que leurs volumes EBS et leurs adresses IP Elastic, et le hook de cycle de vie garantit que chaque instance a fini de charger ses données avant d'être arrêtée dans le pool.
  options:
    a:
      en: |-
        Predictive scaling forecasts from recurring daily or weekly patterns; news-driven spikes have no pattern, so the forecast can't anticipate them.
      fr: |-
        La mise à l'échelle prédictive établit ses prévisions à partir de profils quotidiens ou hebdomadaires récurrents ; les pics liés à l'actualité n'ont pas de profil, et la prévision ne peut donc pas les anticiper.
    b:
      en: |-
        Running instances in the warm pool are billed like the current extra instances, which AWS highly discourages and which doesn't reduce cost.
      fr: |-
        Les instances Running du warm pool sont facturées comme les instances supplémentaires actuelles, ce qu'AWS déconseille fortement et qui ne réduit pas les coûts.
    c:
      en: |-
        Warm pools don't support Spot Instances in mixed instances groups; the mixed instances policy must use On-Demand Instances only.
      fr: |-
        Les warm pools ne prennent pas en charge les instances Spot dans les groupes d'instances mixtes ; la politique d'instances mixtes doit utiliser uniquement des instances à la demande.
references:
  - title: "Decrease latency for applications with long boot times using warm pools - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html
