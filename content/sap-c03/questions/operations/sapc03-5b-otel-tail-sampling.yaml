id: sapc03-5b-otel-tail-sampling
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's payment services produce about 20,000 traces per second and are instrumented with OpenTelemetry SDKs. To reduce costs, the services keep 5% of the traces with a trace ID ratio-based sampler in the SDK. Engineers complain that the traces of failed or slow payments are usually missing, because the sampling decision is made when a request starts, before its outcome is known. The company wants to keep every trace that contains an error or that takes more than 2 seconds, and only 5% of the other traces.

    Which solution will meet these requirements?
  fr: |
    Les services de paiement d'AnyCompany produisent environ 20 000 traces par seconde et sont instrumentés avec les SDK OpenTelemetry. Pour réduire les coûts, les services conservent 5 % des traces avec un échantillonneur basé sur un ratio d'ID de trace dans le SDK. Les ingénieurs se plaignent que les traces des paiements en échec ou lents manquent le plus souvent, car la décision d'échantillonnage est prise au début de la requête, avant que son résultat ne soit connu. L'entreprise veut conserver toutes les traces qui contiennent une erreur ou qui durent plus de 2 secondes, et seulement 5 % des autres traces.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the SDK sampler with a parent-based sampler that uses a 5% root ratio, so that every service respects the sampling decision of the calling service.", fr: "Remplacer l'échantillonneur du SDK par un échantillonneur basé sur le parent avec un ratio racine de 5 %, afin que chaque service respecte la décision d'échantillonnage du service appelant." } }
    - { id: b, text: { en: "Configure an X-Ray sampling rule with a reservoir of 100 traces per second and a fixed rate of 5% for the payment services, and use the X-Ray remote sampler.", fr: "Configurer une règle d'échantillonnage X-Ray avec une réserve (reservoir) de 100 traces par seconde et un taux fixe de 5 % pour les services de paiement, et utiliser l'échantillonneur distant X-Ray." } }
    - { id: c, text: { en: "Turn on CloudWatch Transaction Search, and set the indexing rule to 100% so that every span becomes a searchable trace summary in X-Ray.", fr: "Activer CloudWatch Transaction Search, et définir la règle d'indexation sur 100 % pour que chaque span devienne un résumé de trace consultable dans X-Ray." } }
    - { id: d, text: { en: "Send 100% of the spans to an OpenTelemetry Collector gateway, and configure tail sampling policies that keep error and slow traces and 5% of the others.", fr: "Envoyer 100 % des spans à une passerelle OpenTelemetry Collector, et configurer des politiques d'échantillonnage en queue (tail sampling) qui conservent les traces en erreur et lentes, et 5 % des autres." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Tail sampling applies sampling rules to complete traces in the OpenTelemetry Collector, after all their spans have arrived, so the decision can depend on the trace's status and duration. A gateway collector that receives every span can therefore keep all error and slow traces and a 5% ratio of the rest before export."
    fr: "L'échantillonnage en queue applique des règles d'échantillonnage à des traces complètes dans l'OpenTelemetry Collector, une fois tous leurs spans arrivés : la décision peut donc dépendre du statut et de la durée de la trace. Une passerelle qui reçoit chaque span peut ainsi conserver toutes les traces en erreur et lentes, et un ratio de 5 % des autres avant l'export."
  options:
    a: { en: "A parent-based sampler propagates a decision that is still made when the root request starts, so errors and slow requests are dropped at the same rate as the others.", fr: "Un échantillonneur basé sur le parent propage une décision toujours prise au début de la requête racine : les erreurs et les requêtes lentes sont abandonnées au même taux que les autres." }
    b: { en: "X-Ray sampling rules are also applied at the start of a request, so they cannot select traces by their outcome.", fr: "Les règles d'échantillonnage X-Ray s'appliquent aussi au début d'une requête : elles ne peuvent pas sélectionner les traces selon leur résultat." }
    c: { en: "Indexing every span keeps all traces rather than 5% of the successful ones, so it fails the goal of reducing what is kept, and it does not sample by outcome.", fr: "Indexer chaque span conserve toutes les traces au lieu de 5 % des traces réussies : cela ne répond pas à l'objectif de réduire ce qui est conservé, et l'échantillonnage ne dépend pas du résultat." }
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
