id: sapc03-5c-asg-grace-period-loop
objective: "5.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team creates its Auto Scaling groups with the AWS CLI from a deployment pipeline. A new group for a Java order service uses the ELB health check type behind an Application Load Balancer whose target group marks a target healthy after its /health page responds successfully. The application needs about 6 minutes after launch before /health responds. Since the group was created, newly launched instances are marked unhealthy and terminated within a minute or two, replacements suffer the same fate, and the group never reaches its desired capacity. The team must keep detection of application failures through the load balancer for instances that are already running.

    Which solution will meet these requirements?
  fr: |
    Une équipe plateforme crée ses groupes Auto Scaling avec l'AWS CLI depuis un pipeline de déploiement. Un nouveau groupe pour un service de commandes Java utilise le type de vérification de l'état ELB derrière un Application Load Balancer dont le groupe cible déclare une cible saine dès que sa page /health répond correctement. L'application a besoin d'environ 6 minutes après le lancement avant que /health réponde. Depuis la création du groupe, les instances nouvellement lancées sont déclarées non saines et résiliées en une minute ou deux, les remplaçantes subissent le même sort, et le groupe n'atteint jamais sa capacité souhaitée. L'équipe doit conserver la détection des défaillances applicatives par l'équilibreur de charge pour les instances déjà en fonctionnement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the health check type of the group to EC2 so that only the EC2 instance status checks can mark new instances unhealthy.
        fr: |-
          Changer le type de vérification de l'état du groupe en EC2 afin que seules les vérifications d'état des instances EC2 puissent déclarer de nouvelles instances non saines.
    - id: b
      text:
        en: |-
          Set the health check grace period of the group to about 420 seconds, which is 0 seconds by default for a group created with the AWS CLI.
        fr: |-
          Définir le délai de grâce de la vérification de l'état du groupe sur environ 420 secondes ; il vaut 0 seconde par défaut pour un groupe créé avec l'AWS CLI.
    - id: c
      text:
        en: |-
          Raise the unhealthy threshold count of the target group to its maximum so that targets take longer to be marked unhealthy.
        fr: |-
          Relever au maximum le nombre de seuils non sains du groupe cible afin que les cibles mettent plus de temps à être déclarées non saines.
    - id: d
      text:
        en: |-
          Set the default instance warmup of the group to 420 seconds so that new instances aren't evaluated until the application has started.
        fr: |-
          Définir le préchauffage d'instance par défaut du groupe sur 420 secondes afin que les nouvelles instances ne soient pas évaluées avant le démarrage de l'application.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The health check grace period is the time a new instance stays in service before it can be terminated for failing optional health checks such as ELB. It defaults to 300 seconds in the console but to 0 seconds with the AWS CLI or an SDK, which turns it off; a value that covers the 6-minute startup ends the loop while keeping ELB health checks for running instances.
    fr: |-
      Le délai de grâce de la vérification de l'état est la durée pendant laquelle une nouvelle instance reste en service avant de pouvoir être résiliée pour échec des vérifications facultatives comme ELB. Sa valeur par défaut est de 300 secondes dans la console mais de 0 seconde avec l'AWS CLI ou un SDK, ce qui le désactive ; une valeur qui couvre le démarrage de 6 minutes met fin à la boucle tout en conservant les vérifications ELB pour les instances en fonctionnement.
  options:
    a:
      en: |-
        EC2 status checks don't see application failures, so the group would keep instances whose application has crashed, which breaks the stated requirement.
      fr: |-
        Les vérifications d'état EC2 ne voient pas les défaillances applicatives : le groupe garderait des instances dont l'application a planté, ce qui enfreint l'exigence énoncée.
    c:
      en: |-
        A higher threshold delays failure detection for every running instance and may still be shorter than the 6-minute startup, so it weakens detection without reliably ending the loop.
      fr: |-
        Un seuil plus élevé retarde la détection des défaillances pour toutes les instances en fonctionnement et peut rester inférieur au démarrage de 6 minutes : il affaiblit la détection sans mettre fin de façon fiable à la boucle.
    d:
      en: |-
        Default instance warmup only delays when new instances contribute to scaling metrics; it doesn't delay health checks.
      fr: |-
        Le préchauffage d'instance par défaut retarde seulement le moment où les nouvelles instances contribuent aux métriques de mise à l'échelle ; il ne retarde pas les vérifications de l'état.
references:
  - title: "Set the health check grace period for an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html
  - title: "Health checks for instances in an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html
