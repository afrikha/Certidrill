id: sapc03-5a-cdk-secretvalue-synth
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys an AWS CDK application written in TypeScript through a pipeline. The app creates an Amazon EventBridge connection that authenticates to a partner API with an API key stored in an AWS Secrets Manager secret. To configure the connection, the app code calls the Secrets Manager SDK during synthesis and passes the returned string to the construct. A security review found the API key in clear text in the cdk.out directory and in the templates stored in the CDK bootstrap bucket. The key must never appear in synthesized templates or assets, and the connection must still receive the key at deployment time. The team wants the smallest code change.

    Which solution will meet these requirements?
  fr: |
    Une équipe déploie une application AWS CDK écrite en TypeScript au moyen d'un pipeline. L'application crée une connexion Amazon EventBridge qui s'authentifie auprès de l'API d'un partenaire avec une clé d'API stockée dans un secret AWS Secrets Manager. Pour configurer la connexion, le code de l'application appelle le kit SDK Secrets Manager pendant la synthèse et transmet la chaîne obtenue à la construction. Une revue de sécurité a trouvé la clé d'API en clair dans le répertoire cdk.out et dans les modèles stockés dans le compartiment d'amorçage CDK. La clé ne doit jamais apparaître dans les modèles ni les ressources synthétisés, et la connexion doit toujours recevoir la clé au moment du déploiement. L'équipe veut la plus petite modification de code possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Import the secret with Secret.fromSecretNameV2() and pass its secretValue token to the construct, so that the template holds only a dynamic reference.
        fr: |-
          Importer le secret avec Secret.fromSecretNameV2() et transmettre son jeton secretValue à la construction, pour que le modèle ne contienne qu'une référence dynamique.
    - id: b
      text:
        en: |-
          Keep the SDK call, and wrap the returned string with SecretValue.unsafePlainText() so that the CDK marks the value as a secret and masks it in the template.
        fr: |-
          Conserver l'appel au SDK, et encapsuler la chaîne obtenue avec SecretValue.unsafePlainText() pour que CDK marque la valeur comme secrète et la masque dans le modèle.
    - id: c
      text:
        en: |-
          Keep the SDK call, and add a CDK aspect that removes the key from the construct after synthesis and before the template is uploaded to the bootstrap bucket.
        fr: |-
          Conserver l'appel au SDK, et ajouter un aspect CDK qui retire la clé de la construction après la synthèse et avant le chargement du modèle dans le compartiment d'amorçage.
    - id: d
      text:
        en: |-
          Pass the key to cdk deploy as the value of a NoEcho CfnParameter, read from an environment variable of the pipeline's build project at deployment time.
        fr: |-
          Transmettre la clé à cdk deploy comme valeur d'un CfnParameter NoEcho, lue depuis une variable d'environnement du projet de génération du pipeline au moment du déploiement.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An imported secret exposes secretValue, a SecretValue token whose value is retrieved from Secrets Manager and used at CloudFormation deployment time; the app itself never reads the value. The synthesized template contains a secretsmanager dynamic reference instead of the key, so neither cdk.out nor the bootstrap bucket holds it, and the change is limited to how the value is obtained.
    fr: |-
      Un secret importé expose secretValue, un jeton SecretValue dont la valeur est récupérée dans Secrets Manager et utilisée au moment du déploiement CloudFormation ; l'application elle-même ne lit jamais la valeur. Le modèle synthétisé contient une référence dynamique secretsmanager au lieu de la clé : ni cdk.out ni le compartiment d'amorçage ne la contiennent, et la modification se limite à la façon d'obtenir la valeur.
  options:
    b:
      en: |-
        unsafePlainText() embeds the literal value in the synthesized template; as its name says, it doesn't protect the secret.
      fr: |-
        unsafePlainText() incorpore la valeur littérale dans le modèle synthétisé ; comme son nom l'indique, il ne protège pas le secret.
    c:
      en: |-
        Aspects run during the prepare phase of synthesis, not after it; removing the value from the construct would also leave the connection without its key at deployment.
      fr: |-
        Les aspects s'exécutent pendant la phase de préparation de la synthèse, pas après ; retirer la valeur de la construction laisserait en outre la connexion sans sa clé au déploiement.
    d:
      en: |-
        The key would pass through the pipeline's environment and the deployment command; NoEcho only masks it in CloudFormation output.
      fr: |-
        La clé transiterait par l'environnement du pipeline et par la commande de déploiement ; NoEcho la masque seulement dans les sorties de CloudFormation.
references:
  - title: Get a value from AWS Secrets Manager - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/get-secrets-manager-value.html
