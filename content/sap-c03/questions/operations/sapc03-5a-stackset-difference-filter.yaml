id: sapc03-5a-stackset-difference-filter
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a security monitoring baseline with a service-managed StackSet that targets the Workloads OU, which contains 65 accounts. Two accounts in that OU are operated by a managed service provider that already deploys its own equivalent monitoring stack, and deploying the baseline there would create conflicting resources. The two accounts must stay in the Workloads OU because other policies apply to the OU. Automatic deployment isn't enabled on this StackSet, and the OU membership rarely changes. The company wants to deploy to the other 63 accounts with the least effort to maintain the targeting.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie une base de référence de surveillance de sécurité avec un StackSet à autorisations gérées par le service qui cible l'OU Workloads, laquelle contient 65 comptes. Deux comptes de cette OU sont exploités par un fournisseur de services gérés qui déploie déjà sa propre pile de surveillance équivalente, et y déployer la base de référence créerait des ressources en conflit. Les deux comptes doivent rester dans l'OU Workloads car d'autres politiques s'appliquent à l'OU. Le déploiement automatique n'est pas activé sur ce StackSet, et la composition de l'OU change rarement. L'entreprise veut déployer dans les 63 autres comptes avec le moins d'effort possible pour maintenir le ciblage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create stack instances for the Workloads OU with an INTERSECTION account filter that lists the two accounts operated by the managed service provider.
        fr: |-
          Créer des instances de pile pour l'OU Workloads avec un filtre de comptes INTERSECTION qui liste les deux comptes exploités par le fournisseur de services gérés.
    - id: b
      text:
        en: |-
          Create stack instances for the Workloads OU with a DIFFERENCE account filter that lists the two accounts operated by the managed service provider.
        fr: |-
          Créer des instances de pile pour l'OU Workloads avec un filtre de comptes DIFFERENCE qui liste les deux comptes exploités par le fournisseur de services gérés.
    - id: c
      text:
        en: |-
          Create stack instances for the Workloads OU with a UNION account filter that lists the IDs of the 63 accounts that must receive the baseline.
        fr: |-
          Créer des instances de pile pour l'OU Workloads avec un filtre de comptes UNION qui liste les ID des 63 comptes qui doivent recevoir la base de référence.
    - id: d
      text:
        en: |-
          Create stack instances for the whole Workloads OU, and attach an SCP to the two provider accounts that denies cloudformation:CreateStack, with a failure tolerance of 2.
        fr: |-
          Créer des instances de pile pour toute l'OU Workloads, et attacher aux deux comptes du fournisseur une SCP qui refuse cloudformation:CreateStack, avec une tolérance aux échecs de 2.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The DIFFERENCE account filter deploys to every account in the selected OUs except the listed accounts. Listing only the two provider accounts keeps the targeting short and stable: the other 63 accounts are covered without listing them, and the two excluded accounts stay in the OU.
    fr: |-
      Le filtre de comptes DIFFERENCE déploie dans tous les comptes des OU sélectionnées sauf les comptes listés. Lister seulement les deux comptes du fournisseur garde un ciblage court et stable : les 63 autres comptes sont couverts sans être listés, et les deux comptes exclus restent dans l'OU.
  options:
    a:
      en: |-
        INTERSECTION deploys only to the listed accounts within the OU, so the baseline would go to the two provider accounts and nowhere else.
      fr: |-
        INTERSECTION ne déploie que dans les comptes listés au sein de l'OU : la base de référence irait dans les deux comptes du fournisseur et nulle part ailleurs.
    c:
      en: |-
        UNION adds the listed accounts to all the accounts of the OU, so the two provider accounts would still receive the baseline.
      fr: |-
        UNION ajoute les comptes listés à tous les comptes de l'OU : les deux comptes du fournisseur recevraient toujours la base de référence.
    d:
      en: |-
        Forcing failures leaves failed stack instances to clean up, uses up the failure tolerance, and the SCP would also block the provider's own CloudFormation stacks.
      fr: |-
        Provoquer des échecs laisse des instances de pile en échec à nettoyer, consomme la tolérance aux échecs, et la SCP bloquerait aussi les propres piles CloudFormation du fournisseur.
references:
  - title: Create CloudFormation StackSets with service-managed permissions - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-associate-stackset-with-org.html
