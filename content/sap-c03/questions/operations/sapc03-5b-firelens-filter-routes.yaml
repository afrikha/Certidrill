id: sapc03-5b-firelens-filter-routes
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs its matchmaking service on Amazon ECS with AWS Fargate. The containers write JSON logs at the DEBUG, INFO, and ERROR levels to standard output, about 4 TB each day, and most of the volume is DEBUG. The developers want only INFO and ERROR events in CloudWatch Logs, the security team wants only ERROR events in Amazon OpenSearch Service, and the data team wants all events in Amazon S3 through Amazon Data Firehose. The company wants to avoid paying CloudWatch Logs ingestion for the DEBUG events, and it does not want to change the application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute son service de matchmaking sur Amazon ECS avec AWS Fargate. Les conteneurs écrivent des journaux JSON aux niveaux DEBUG, INFO et ERROR sur la sortie standard, environ 4 To par jour, dont la plus grande partie en DEBUG. Les développeurs ne veulent que les événements INFO et ERROR dans CloudWatch Logs, l'équipe de sécurité ne veut que les événements ERROR dans Amazon OpenSearch Service, et l'équipe data veut tous les événements dans Amazon S3 via Amazon Data Firehose. L'entreprise veut éviter de payer l'ingestion CloudWatch Logs pour les événements DEBUG, et elle ne veut pas modifier l'application.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the awslogs log driver for all events, and add subscription filters on the log group that send ERROR events to OpenSearch Service and all events to Firehose.", fr: "Utiliser le pilote de journalisation awslogs pour tous les événements, et ajouter au groupe de journaux des filtres d'abonnement qui envoient les événements ERROR vers OpenSearch Service et tous les événements vers Firehose." } }
    - { id: b, text: { en: "Write the logs to an Amazon EFS volume that is mounted in each task, and run a scheduled ECS task every hour that copies the files to the three destinations.", fr: "Écrire les journaux sur un volume Amazon EFS monté dans chaque tâche, et exécuter chaque heure une tâche ECS planifiée qui copie les fichiers vers les trois destinations." } }
    - { id: c, text: { en: "Use FireLens with the AWS for Fluent Bit image and a custom configuration whose filters route each log level to CloudWatch Logs, OpenSearch Service, and Firehose.", fr: "Utiliser FireLens avec l'image AWS for Fluent Bit et une configuration personnalisée dont les filtres routent chaque niveau de journal vers CloudWatch Logs, OpenSearch Service et Firehose." } }
    - { id: d, text: { en: "Use the awslogs log driver with a 1-day retention, and export the log group to Amazon S3 every hour with export tasks for the data team and the security team.", fr: "Utiliser le pilote de journalisation awslogs avec une rétention de 1 jour, et exporter chaque heure le groupe de journaux vers Amazon S3 avec des tâches d'exportation pour l'équipe data et l'équipe de sécurité." } }
answer: { optionId: c }
explanation:
  correct:
    en: "FireLens uses task definition parameters to route container logs through a Fluent Bit log router, supported on Fargate, to AWS services such as CloudWatch Logs, Firehose, and OpenSearch Service. Fluent Bit filters and multiple outputs send each level only where it is needed, so DEBUG events reach Firehose without ever being ingested into CloudWatch Logs, and the application does not change."
    fr: "FireLens utilise des paramètres de définition de tâche pour router les journaux des conteneurs via un routeur de journaux Fluent Bit, pris en charge sur Fargate, vers des services AWS comme CloudWatch Logs, Firehose et OpenSearch Service. Les filtres et les sorties multiples de Fluent Bit n'envoient chaque niveau que là où il est nécessaire : les événements DEBUG atteignent Firehose sans jamais être ingérés dans CloudWatch Logs, et l'application ne change pas."
  options:
    a: { en: "Every event, including DEBUG, is ingested into CloudWatch Logs before the subscription filters copy it, so the company still pays ingestion for the DEBUG volume.", fr: "Chaque événement, DEBUG compris, est ingéré dans CloudWatch Logs avant que les filtres d'abonnement ne le copient : l'entreprise paie toujours l'ingestion du volume DEBUG." }
    b: { en: "Writing to files requires the application to change where it logs, and hourly copies delay the security team's error events.", fr: "Écrire dans des fichiers exige que l'application change sa destination de journalisation, et des copies horaires retardent les événements d'erreur de l'équipe de sécurité." }
    d: { en: "All events are still ingested into CloudWatch Logs, export tasks do not deliver to OpenSearch Service, and only one export task can be active per account at a time.", fr: "Tous les événements sont toujours ingérés dans CloudWatch Logs, les tâches d'exportation ne livrent pas vers OpenSearch Service, et une seule tâche d'exportation peut être active à la fois par compte." }
references:
  - title: Send Amazon ECS logs to an AWS service or AWS Partner
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_firelens.html
