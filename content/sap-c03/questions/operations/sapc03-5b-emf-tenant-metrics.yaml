id: sapc03-5b-emf-tenant-metrics
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company runs a multi-tenant API on AWS Lambda for about 200 tenants. The product team needs CloudWatch metrics for latency and errors with a TenantId dimension, so that it can graph and alarm per tenant. Engineers also need the detailed log event behind each data point to investigate incidents with CloudWatch Logs Insights. Load tests showed that calling the PutMetricData API from the function adds latency and causes throttling at peak. The company does not want to run any additional infrastructure.

    Which solution will meet these requirements?
  fr: |
    Un éditeur SaaS exécute une API multilocataire sur AWS Lambda pour environ 200 locataires. L'équipe produit a besoin de métriques CloudWatch de latence et d'erreurs avec une dimension TenantId, afin de tracer des graphiques et de définir des alarmes par locataire. Les ingénieurs ont aussi besoin de l'événement de journal détaillé derrière chaque point de données pour enquêter sur les incidents avec CloudWatch Logs Insights. Des tests de charge ont montré qu'appeler l'API PutMetricData depuis la fonction ajoute de la latence et provoque des limitations en pointe. L'entreprise ne veut exécuter aucune infrastructure supplémentaire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Write the metrics in the CloudWatch embedded metric format in the function's log output, with TenantId as a dimension, so that CloudWatch extracts them from the log events.", fr: "Écrire les métriques au format de métrique intégrée (embedded metric format) de CloudWatch dans la sortie de journal de la fonction, avec TenantId comme dimension, afin que CloudWatch les extraie des événements de journal." } }
    - { id: b, text: { en: "Publish the metrics from each invocation to the CloudWatch OTLP metrics endpoint with the OpenTelemetry SDK, and write a separate log line for each request.", fr: "Publier les métriques de chaque appel vers le point de terminaison de métriques OTLP de CloudWatch avec le SDK OpenTelemetry, et écrire une ligne de journal distincte pour chaque requête." } }
    - { id: c, text: { en: "Write each data point to an Amazon DynamoDB table, and run a scheduled Lambda function every minute that publishes the aggregated values with PutMetricData.", fr: "Écrire chaque point de données dans une table Amazon DynamoDB, et exécuter chaque minute une fonction Lambda planifiée qui publie les valeurs agrégées avec PutMetricData." } }
    - { id: d, text: { en: "Stream the log events to Amazon Data Firehose with a subscription filter, and have a transformation function publish the metrics with PutMetricData.", fr: "Diffuser les événements de journal vers Amazon Data Firehose avec un filtre d'abonnement, et faire publier les métriques par une fonction de transformation avec PutMetricData." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The embedded metric format embeds custom metrics in structured log events, and CloudWatch extracts them automatically, so the function needs only logs:PutLogEvents and makes no PutMetricData calls. The metric and its high-cardinality log event stay together, which is the case where AWS recommends this format, and Logs Insights can query the detailed events."
    fr: "Le format de métrique intégrée place des métriques personnalisées dans des événements de journal structurés, et CloudWatch les extrait automatiquement : la fonction n'a besoin que de logs:PutLogEvents et n'appelle pas PutMetricData. La métrique et son événement de journal à forte cardinalité restent ensemble, cas dans lequel AWS recommande ce format, et Logs Insights peut interroger les événements détaillés."
  options:
    b: { en: "OTLP metrics are a good default for new workloads, but each invocation still makes a separate API call, and the metric is no longer tied to the log event that produced it.", fr: "Les métriques OTLP sont un bon choix par défaut pour de nouvelles charges de travail, mais chaque appel effectue toujours un appel d'API distinct, et la métrique n'est plus liée à l'événement de journal qui l'a produite." }
    c: { en: "A table and a scheduled function are additional infrastructure, and the aggregated metrics are delayed and separated from the detailed log events.", fr: "Une table et une fonction planifiée sont une infrastructure supplémentaire, et les métriques agrégées sont retardées et séparées des événements de journal détaillés." }
    d: { en: "Firehose and a transformation function are additional infrastructure, and the function still depends on PutMetricData, which throttles at peak.", fr: "Firehose et une fonction de transformation sont une infrastructure supplémentaire, et la fonction dépend toujours de PutMetricData, qui est limité en pointe." }
references:
  - title: Embedding metrics within logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
