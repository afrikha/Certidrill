id: sapc03-5a-config-guard-custom-policy
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 120 member accounts in AWS Organizations and already blocks non-compliant AWS CloudFormation deployments with CloudFormation Hooks. Auditors now require evidence for resources that were created before the hooks existed or that were changed outside CloudFormation. Every Amazon RDS DB instance must have the DataClass tag and must have IAM database authentication enabled. Compliance must be evaluated again whenever a DB instance changes, and the results must be visible in one dashboard for all accounts. AWS Config already records resources in every account and aggregates them into a central account. The security team doesn't want to maintain Lambda function code for the rules.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 120 comptes membres dans AWS Organizations et bloque déjà les déploiements AWS CloudFormation non conformes avec des hooks CloudFormation. Les auditeurs exigent désormais des preuves pour les ressources créées avant l'existence des hooks ou modifiées en dehors de CloudFormation. Chaque instance de base de données Amazon RDS doit porter l'étiquette DataClass et avoir l'authentification de base de données IAM activée. La conformité doit être réévaluée chaque fois qu'une instance de base de données change, et les résultats doivent être visibles dans un seul tableau de bord pour tous les comptes. AWS Config enregistre déjà les ressources de chaque compte et les agrège dans un compte central. L'équipe de sécurité ne veut pas maintenir de code de fonction Lambda pour les règles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Extend the existing CloudFormation hooks with the DELETE target action so that every existing DB instance is evaluated and reported during the next stack operation of each account.
        fr: |-
          Étendre les hooks CloudFormation existants avec l'action cible DELETE pour que chaque instance de base de données existante soit évaluée et signalée lors de la prochaine opération de pile de chaque compte.
    - id: b
      text:
        en: |-
          Write an AWS Config custom policy rule in Guard that checks the tag and IAM authentication, deploy it in an organization conformance pack, and view the results in the Config aggregator.
        fr: |-
          Écrire une règle de politique personnalisée AWS Config en Guard qui vérifie l'étiquette et l'authentification IAM, la déployer dans un pack de conformité d'organisation, et consulter les résultats dans l'agrégateur Config.
    - id: c
      text:
        en: |-
          Write an AWS Config custom Lambda rule that checks the tag and IAM authentication, deploy it to every account with a StackSet, and view the results in the Config aggregator.
        fr: |-
          Écrire une règle AWS Config personnalisée Lambda qui vérifie l'étiquette et l'authentification IAM, la déployer dans chaque compte avec un StackSet, et consulter les résultats dans l'agrégateur Config.
    - id: d
      text:
        en: |-
          Run the hook's Guard rules every night against the templates of all stacks with a scheduled CodeBuild project, and publish the results to AWS Security Hub in the central account for the auditors.
        fr: |-
          Exécuter chaque nuit les règles Guard du hook sur les modèles de toutes les piles avec un projet CodeBuild planifié, et publier les résultats dans AWS Security Hub dans le compte central pour les auditeurs.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config custom policy rules are written in the Guard language and evaluate the recorded configuration of resources, triggered by configuration changes, so no Lambda code is involved. Deployed through an organization conformance pack, the rule reaches every member account, and the aggregator gives one compliance view. Detective evaluation covers resources created before the hooks or modified outside CloudFormation.
    fr: |-
      Les règles de politique personnalisées AWS Config s'écrivent dans le langage Guard et évaluent la configuration enregistrée des ressources, déclenchées par les modifications de configuration : aucun code Lambda n'intervient. Déployée par un pack de conformité d'organisation, la règle atteint chaque compte membre, et l'agrégateur offre une vue unique de la conformité. L'évaluation de détection couvre les ressources créées avant les hooks ou modifiées en dehors de CloudFormation.
  options:
    a:
      en: |-
        Hooks run only during CloudFormation operations on the resources being provisioned; they never evaluate existing resources or changes made outside CloudFormation.
      fr: |-
        Les hooks ne s'exécutent que pendant les opérations CloudFormation, sur les ressources en cours de provisionnement ; ils n'évaluent jamais les ressources existantes ni les modifications faites en dehors de CloudFormation.
    c:
      en: |-
        A custom Lambda rule meets the evaluation needs, but the security team would have to maintain the function code, which it wants to avoid.
      fr: |-
        Une règle personnalisée Lambda répond aux besoins d'évaluation, mais l'équipe de sécurité devrait maintenir le code de la fonction, ce qu'elle veut éviter.
    d:
      en: |-
        Templates don't show changes made outside CloudFormation or resources that no stack manages, and a nightly run doesn't re-evaluate when a DB instance changes.
      fr: |-
        Les modèles ne montrent ni les modifications faites en dehors de CloudFormation ni les ressources qu'aucune pile ne gère, et une exécution nocturne ne réévalue pas lorsqu'une instance de base de données change.
references:
  - title: Creating AWS Config Custom Policy Rules - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_develop-rules_cfn-guard.html
