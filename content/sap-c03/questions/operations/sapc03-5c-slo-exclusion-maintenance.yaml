id: sapc03-5c-slo-exclusion-maintenance
objective: "5.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a shipment-tracking API with a period-based CloudWatch Application Signals SLO on Availability, a 99.5 percent goal, and burn rate alarms that page the on-call team. Every Sunday from 02:00 to 03:00 UTC, the company applies database maintenance during an announced downtime that the customer contract excludes from availability. During that hour, the SLO counts every minute as unhealthy, the remaining error budget drops sharply each week, and the burn rate alarms page the on-call engineer. The company wants the SLO to ignore the planned hour automatically every week, while unplanned outages, including outages that start right after the maintenance hour, keep counting and paging. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exploite une API de suivi des expéditions avec un SLO CloudWatch Application Signals basé sur les périodes, sur Availability, un objectif de 99,5 % et des alarmes de taux de consommation qui alertent l'équipe d'astreinte. Chaque dimanche de 02:00 à 03:00 UTC, l'entreprise applique une maintenance de base de données pendant une interruption annoncée que le contrat client exclut de la disponibilité. Pendant cette heure, le SLO compte chaque minute comme non saine, le budget d'erreur restant chute fortement chaque semaine, et les alarmes de taux de consommation alertent l'ingénieur d'astreinte. L'entreprise veut que le SLO ignore automatiquement l'heure planifiée chaque semaine, tandis que les pannes non planifiées, y compris celles qui commencent juste après l'heure de maintenance, continuent d'être comptées et d'alerter. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a recurring time window exclusion to the SLO, defined with a cron expression for Sunday 02:00 UTC and a duration of one hour, with the maintenance as the reason.
        fr: |-
          Ajouter au SLO une exclusion de fenêtre temporelle récurrente, définie par une expression cron pour le dimanche à 02:00 UTC et une durée d'une heure, avec la maintenance comme motif.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm mute rule with a cron expression for Sunday 02:00 UTC and a duration of one hour that targets the burn rate alarms.
        fr: |-
          Créer une règle de mise en sourdine d'alarmes CloudWatch avec une expression cron pour le dimanche à 02:00 UTC et une durée d'une heure, qui cible les alarmes de taux de consommation.
    - id: c
      text:
        en: |-
          Schedule an AWS Systems Manager Automation runbook that calls DisableAlarmActions on the burn rate alarms at 02:00 UTC and EnableAlarmActions at 03:00 UTC every Sunday.
        fr: |-
          Planifier un runbook AWS Systems Manager Automation qui appelle DisableAlarmActions sur les alarmes de taux de consommation à 02:00 UTC et EnableAlarmActions à 03:00 UTC chaque dimanche.
    - id: d
      text:
        en: |-
          Lower the SLO goal to 99.3 percent so that the four or five maintenance hours of each month fit within the error budget.
        fr: |-
          Abaisser l'objectif du SLO à 99,3 % afin que les quatre ou cinq heures de maintenance de chaque mois tiennent dans le budget d'erreur.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Time window exclusions remove planned periods from the SLO: for a period-based SLO, excluded data is treated as non-breaching, so neither attainment nor the error budget is affected and the burn rate stays low. An exclusion can recur with a cron expression and carry a reason, and up to 10 exclusion windows can be defined per SLO, so no weekly action is needed.
    fr: |-
      Les exclusions de fenêtres temporelles retirent les périodes planifiées du SLO : pour un SLO basé sur les périodes, les données exclues sont traitées comme non dépassées, si bien que ni l'atteinte ni le budget d'erreur ne sont affectés et que le taux de consommation reste bas. Une exclusion peut être récurrente avec une expression cron et porter un motif, et jusqu'à 10 fenêtres d'exclusion peuvent être définies par SLO : aucune action hebdomadaire n'est nécessaire.
  options:
    b:
      en: |-
        A mute rule only silences actions: the SLO still counts the hour against the budget, and when the mute ends, the actions run if the alarms are still in ALARM, so the on-call engineer is paged after maintenance anyway.
      fr: |-
        Une règle de mise en sourdine ne fait que taire les actions : le SLO compte toujours l'heure dans le budget, et à la fin de la mise en sourdine, les actions s'exécutent si les alarmes sont toujours en ALARM, si bien que l'astreinte est alertée après la maintenance.
    c:
      en: |-
        Disabling actions with a scheduled runbook adds moving parts and still lets the maintenance hour consume the error budget.
      fr: |-
        Désactiver les actions avec un runbook planifié ajoute des composants et laisse toujours l'heure de maintenance consommer le budget d'erreur.
    d:
      en: |-
        A lower goal changes the objective and lets more unplanned downtime pass, and the burn rate alarms still fire during each maintenance hour.
      fr: |-
        Un objectif plus bas modifie l'objectif et laisse passer davantage d'interruptions non planifiées, et les alarmes de taux de consommation se déclenchent toujours pendant chaque heure de maintenance.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
  - title: "Alarm Mute Rules - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-mute-rules.html
