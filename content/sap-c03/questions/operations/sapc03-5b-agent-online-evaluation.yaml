id: sapc03-5b-agent-online-evaluation
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's HR agent runs on Amazon Bedrock AgentCore Runtime with AgentCore Observability enabled, and it handles about 20,000 sessions a day. Last month, a change in a backend API made the agent pick the wrong tool for some requests. The quality drop went unnoticed for two weeks, because the latency and error metrics stayed normal. The company now wants to score a 10% sample of live sessions continuously for goal success and tool selection accuracy, and to follow the trend of these scores in Amazon CloudWatch. The company wants a managed feature with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'agent RH d'AnyCompany s'exécute sur Amazon Bedrock AgentCore Runtime avec AgentCore Observability activé, et il traite environ 20 000 sessions par jour. Le mois dernier, une modification d'une API backend a amené l'agent à choisir le mauvais outil pour certaines requêtes. La baisse de qualité est passée inaperçue pendant deux semaines, car les métriques de latence et d'erreurs restaient normales. L'entreprise veut désormais noter en continu un échantillon de 10 % des sessions réelles pour la réussite de l'objectif et l'exactitude de la sélection d'outils, et suivre la tendance de ces scores dans Amazon CloudWatch. L'entreprise veut une fonctionnalité gérée avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AgentCore batch evaluation every Sunday over all the sessions of the previous week, with the goal success rate and tool selection accuracy evaluators.", fr: "Exécuter chaque dimanche une évaluation par lots AgentCore sur toutes les sessions de la semaine précédente, avec les évaluateurs de taux de réussite de l'objectif et d'exactitude de la sélection d'outils." } }
    - { id: b, text: { en: "Create an AgentCore online evaluation configuration for the agent endpoint, with a 10% sampling rate and the goal success rate and tool selection accuracy evaluators.", fr: "Créer une configuration d'évaluation en ligne AgentCore pour le point de terminaison de l'agent, avec un taux d'échantillonnage de 10 % et les évaluateurs de taux de réussite de l'objectif et d'exactitude de la sélection d'outils." } }
    - { id: c, text: { en: "Create CloudWatch anomaly detection alarms on the latency, token usage, and error rate metrics that AgentCore Observability publishes for the agent.", fr: "Créer des alarmes de détection d'anomalies CloudWatch sur les métriques de latence, d'utilisation des jetons et de taux d'erreur qu'AgentCore Observability publie pour l'agent." } }
    - { id: d, text: { en: "Run an Amazon Bedrock judge-based model evaluation job every night on a fixed set of 500 prompts that represent typical HR requests.", fr: "Exécuter chaque nuit une tâche d'évaluation de modèle Amazon Bedrock avec modèle juge sur un ensemble fixe de 500 invites représentatives des requêtes RH courantes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore online evaluation continuously monitors a deployed agent with live production traffic: the configuration names the data source, such as an AgentCore Runtime endpoint, the evaluators, and a sampling percentage between 0.01% and 100%. Built-in evaluators include goal success rate at session level and tool selection accuracy at tool level, and the results let the team track quality trends over time."
    fr: "L'évaluation en ligne AgentCore surveille en continu un agent déployé à partir du trafic de production réel : la configuration indique la source de données, par exemple un point de terminaison AgentCore Runtime, les évaluateurs et un pourcentage d'échantillonnage compris entre 0,01 % et 100 %. Les évaluateurs intégrés comprennent le taux de réussite de l'objectif au niveau de la session et l'exactitude de la sélection d'outils au niveau des outils, et les résultats permettent de suivre les tendances de qualité dans le temps."
  options:
    a: { en: "A weekly batch job scores sessions up to a week late and scores all of them instead of a continuous 10% sample, so a drop can again go unnoticed for days.", fr: "Une tâche par lots hebdomadaire note les sessions avec jusqu'à une semaine de retard et les note toutes au lieu d'un échantillon continu de 10 % : une baisse peut encore passer inaperçue pendant des jours." }
    c: { en: "The incident showed that latency, tokens, and errors stay normal when the agent picks the wrong tool, so these alarms do not measure quality.", fr: "L'incident a montré que la latence, les jetons et les erreurs restent normaux quand l'agent choisit le mauvais outil : ces alarmes ne mesurent pas la qualité." }
    d: { en: "A model evaluation job on fixed prompts scores single model responses, not the tool choices of live agent sessions.", fr: "Une tâche d'évaluation de modèle sur des invites fixes note des réponses uniques du modèle, pas les choix d'outils des sessions réelles de l'agent." }
references:
