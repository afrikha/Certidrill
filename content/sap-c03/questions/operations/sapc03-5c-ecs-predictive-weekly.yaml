id: sapc03-5c-ecs-predictive-weekly
objective: "5.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payroll SaaS company runs its calculation API as an Amazon ECS service on AWS Fargate, scaled by an Application Auto Scaling target tracking policy on average CPU utilization. Load follows a recurring weekly pattern: it rises sharply every Monday morning and on the last two business days of each month, and the pattern drifts as customers are added. New tasks need about 4 minutes to warm their caches before they serve requests at full speed, so target tracking adds tasks too late and latency rises at the start of each peak. The company wants tasks to be added ahead of the recurring peaks with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un éditeur SaaS de paie exploite son API de calcul sous forme de service Amazon ECS sur AWS Fargate, mis à l'échelle par une politique de suivi de cible Application Auto Scaling sur l'utilisation moyenne du processeur. La charge suit un profil hebdomadaire récurrent : elle augmente fortement chaque lundi matin et les deux derniers jours ouvrés de chaque mois, et le profil dérive à mesure que des clients sont ajoutés. Les nouvelles tâches ont besoin d'environ 4 minutes pour réchauffer leurs caches avant de servir les requêtes à pleine vitesse : le suivi de cible ajoute donc des tâches trop tard et la latence augmente au début de chaque pic. L'entreprise veut que des tâches soient ajoutées avant les pics récurrents avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a predictive scaling policy to the ECS service, validate its forecasts in forecast only mode, then switch it to forecast and scale and keep the target tracking policy.
        fr: |-
          Ajouter une politique de mise à l'échelle prédictive au service ECS, valider ses prévisions en mode prévision uniquement, puis la faire passer en mode prévision et mise à l'échelle et conserver la politique de suivi de cible.
    - id: b
      text:
        en: |-
          Create an EC2 Auto Scaling group for the cluster with a predictive scaling policy, and register it with the cluster as a capacity provider for the service.
        fr: |-
          Créer pour le cluster un groupe Auto Scaling EC2 avec une politique de mise à l'échelle prédictive, et l'enregistrer auprès du cluster comme fournisseur de capacité pour le service.
    - id: c
      text:
        en: |-
          Replace target tracking with a step scaling policy that adds more tasks at lower CPU thresholds, so that capacity grows earlier at the start of each peak.
        fr: |-
          Remplacer le suivi de cible par une politique de mise à l'échelle par étapes qui ajoute plus de tâches à des seuils de processeur plus bas, afin que la capacité augmente plus tôt au début de chaque pic.
    - id: d
      text:
        en: |-
          Create scheduled actions with cron expressions for Monday mornings and month-end days that raise the minimum task count, and review them every quarter as customers are added.
        fr: |-
          Créer des actions planifiées avec des expressions cron pour les lundis matin et les jours de fin de mois qui relèvent le nombre minimal de tâches, et les revoir chaque trimestre à mesure que des clients sont ajoutés.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Predictive scaling for ECS services analyzes past load to find daily or weekly patterns and increases the task count ahead of the forecast, independently of the underlying Fargate capacity. It starts in forecast only mode and doesn't scale in by itself, so it runs alongside target tracking, and the service uses the larger desired count of the two policies.
    fr: |-
      La mise à l'échelle prédictive des services ECS analyse la charge passée pour trouver des profils quotidiens ou hebdomadaires et augmente le nombre de tâches avant la prévision, indépendamment de la capacité Fargate sous-jacente. Elle démarre en mode prévision uniquement et ne réduit pas la capacité d'elle-même : elle fonctionne donc avec le suivi de cible, et le service utilise le plus grand nombre souhaité des deux politiques.
  options:
    b:
      en: |-
        Fargate tasks don't run on an Auto Scaling group that the company manages, and scaling instances doesn't change the number of tasks in the service.
      fr: |-
        Les tâches Fargate ne s'exécutent pas sur un groupe Auto Scaling géré par l'entreprise, et mettre des instances à l'échelle ne change pas le nombre de tâches du service.
    c:
      en: |-
        Step scaling is still reactive: it adds tasks only after the metric rises, so the 4-minute warm-up still hurts the start of each peak.
      fr: |-
        La mise à l'échelle par étapes reste réactive : elle n'ajoute des tâches qu'après la hausse de la métrique, si bien que le réchauffement de 4 minutes pénalise toujours le début de chaque pic.
    d:
      en: |-
        Fixed schedules must be maintained by hand as the pattern drifts, which is more operational overhead than a forecast that updates itself.
      fr: |-
        Des planifications fixes doivent être maintenues à la main à mesure que le profil dérive, ce qui représente plus de charge opérationnelle qu'une prévision qui se met à jour seule.
references:
  - title: "Use historical patterns to scale Amazon ECS services with predictive scaling"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/predictive-auto-scaling.html
