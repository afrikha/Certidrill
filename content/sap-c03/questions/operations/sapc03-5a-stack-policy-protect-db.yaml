id: sapc03-5a-stack-policy-protect-db
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company deploys an application with one AWS CloudFormation stack that contains an Amazon Aurora DB cluster with the logical ID LedgerCluster, Amazon ECS services, and load balancers. Several engineers, including administrators with full CloudFormation permissions, update the stack from the pipeline and sometimes from the AWS CLI. The company must ensure that no stack update can replace or delete LedgerCluster, even when a template change would require it. All other resources in the stack must remain updatable. A deliberate change to the cluster must still be possible for one update after a documented review.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers déploie une application avec une pile AWS CloudFormation qui contient un cluster de bases de données Amazon Aurora d'ID logique LedgerCluster, des services Amazon ECS et des équilibreurs de charge. Plusieurs ingénieurs, dont des administrateurs disposant de toutes les autorisations CloudFormation, mettent à jour la pile depuis le pipeline et parfois depuis l'AWS CLI. L'entreprise doit garantir qu'aucune mise à jour de pile ne puisse remplacer ou supprimer LedgerCluster, même lorsqu'une modification du modèle l'exigerait. Toutes les autres ressources de la pile doivent rester modifiables. Une modification délibérée du cluster doit rester possible, pour une seule mise à jour, après un examen documenté.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on termination protection for the stack and set DeletionPolicy to Snapshot on LedgerCluster, so that the cluster is snapshotted before any replacement or deletion during an update.
        fr: |-
          Activer la protection contre la résiliation de la pile et définir DeletionPolicy à Snapshot sur LedgerCluster, afin qu'un instantané du cluster soit pris avant tout remplacement ou toute suppression lors d'une mise à jour.
    - id: b
      text:
        en: |-
          Set DeletionPolicy and UpdateReplacePolicy to Retain on LedgerCluster, so that CloudFormation keeps the existing cluster whenever an update would replace or remove it.
        fr: |-
          Définir DeletionPolicy et UpdateReplacePolicy à Retain sur LedgerCluster, afin que CloudFormation conserve le cluster existant chaque fois qu'une mise à jour le remplacerait ou le retirerait.
    - id: c
      text:
        en: |-
          Set a stack policy that denies Update:Replace and Update:Delete on LogicalResourceId/LedgerCluster and allows Update:* on all resources, and supply a temporary override policy for a reviewed change.
        fr: |-
          Définir une politique de pile qui refuse Update:Replace et Update:Delete sur LogicalResourceId/LedgerCluster et autorise Update:* sur toutes les ressources, et fournir une politique de remplacement temporaire pour une modification examinée.
    - id: d
      text:
        en: |-
          Attach an IAM policy to every engineer that denies cloudformation:UpdateStack when the submitted template contains a change to LedgerCluster, and remove it for a reviewed change.
        fr: |-
          Attacher à chaque ingénieur une politique IAM qui refuse cloudformation:UpdateStack lorsque le modèle soumis contient une modification de LedgerCluster, et la retirer pour une modification examinée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A stack policy applies to every user who updates the stack, whatever their IAM permissions; once set, a Deny on Update:Replace and Update:Delete for one logical resource blocks those updates while the Allow statement keeps the other resources updatable. For a reviewed change, an override policy passed with the update applies to that update only and doesn't change the stack policy.
    fr: |-
      Une politique de pile s'applique à tout utilisateur qui met à jour la pile, quelles que soient ses autorisations IAM ; une fois définie, un Deny sur Update:Replace et Update:Delete pour une ressource logique bloque ces mises à jour, tandis que l'instruction Allow laisse les autres ressources modifiables. Pour une modification examinée, une politique de remplacement fournie avec la mise à jour ne s'applique qu'à cette mise à jour et ne modifie pas la politique de pile.
  options:
    a:
      en: |-
        Termination protection only blocks deletion of the whole stack, and a snapshot doesn't stop the update from replacing the cluster.
      fr: |-
        La protection contre la résiliation bloque seulement la suppression de la pile entière, et un instantané n'empêche pas la mise à jour de remplacer le cluster.
    b:
      en: |-
        Retain keeps the old cluster as an unmanaged resource, but the replacement still happens: the stack points to a new, empty cluster.
      fr: |-
        Retain conserve l'ancien cluster comme ressource non gérée, mais le remplacement a bien lieu : la pile pointe vers un nouveau cluster vide.
    d:
      en: |-
        IAM has no condition key that inspects which resources a template changes, so such a policy can only block every update of the stack.
      fr: |-
        IAM n'a aucune clé de condition qui inspecte les ressources modifiées par un modèle : une telle politique ne peut que bloquer toutes les mises à jour de la pile.
references:
  - title: Prevent updates to stack resources - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
