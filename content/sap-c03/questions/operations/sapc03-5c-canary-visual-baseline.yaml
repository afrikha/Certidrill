id: sapc03-5c-canary-visual-baseline
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company deploys its public quote website several times a day from a pipeline in a tooling account to production accounts in two Regions. Twice last month, a faulty style sheet hid the "Get a quote" button: every page returned HTTP 200, all links worked, and no JavaScript error was raised, so no alarm fired for several hours. The home page has a rotating banner whose content changes every day. The company wants to detect this kind of rendering problem within 10 minutes of a deployment and raise a CloudWatch alarm. The company wants to write as little test code as possible.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance déploie son site public de devis plusieurs fois par jour depuis un pipeline d'un compte d'outillage vers des comptes de production dans deux Régions. Deux fois le mois dernier, une feuille de style défectueuse a masqué le bouton « Get a quote » : chaque page renvoyait HTTP 200, tous les liens fonctionnaient et aucune erreur JavaScript n'était levée, si bien qu'aucune alarme ne s'est déclenchée pendant plusieurs heures. La page d'accueil comporte une bannière tournante dont le contenu change chaque jour. L'entreprise veut détecter ce type de problème de rendu dans les 10 minutes suivant un déploiement et déclencher une alarme CloudWatch. L'entreprise veut écrire le moins de code de test possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Synthetics canary from the heartbeat monitoring blueprint that loads the home page every 5 minutes, and alarm when the page doesn't return HTTP 200.
        fr: |-
          Créer un canary CloudWatch Synthetics à partir du plan heartbeat monitoring qui charge la page d'accueil toutes les 5 minutes, et déclencher une alarme quand la page ne renvoie pas HTTP 200.
    - id: b
      text:
        en: |-
          Create a CloudWatch Synthetics canary from the broken link checker blueprint that crawls the site every 5 minutes, and alarm on failed runs.
        fr: |-
          Créer un canary CloudWatch Synthetics à partir du plan broken link checker qui parcourt le site toutes les 5 minutes, et déclencher une alarme sur les exécutions en échec.
    - id: c
      text:
        en: |-
          Add a CloudWatch RUM app monitor to the website, and alarm when the JavaScript error count of the home page rises above its usual level.
        fr: |-
          Ajouter un moniteur d'application CloudWatch RUM au site web, et déclencher une alarme quand le nombre d'erreurs JavaScript de la page d'accueil dépasse son niveau habituel.
    - id: d
      text:
        en: |-
          Create a canary from the visual monitoring blueprint that compares screenshots with a baseline every 5 minutes, excluding the banner area, and alarm on failed runs.
        fr: |-
          Créer un canary à partir du plan visual monitoring qui compare des captures d'écran à une référence toutes les 5 minutes, en excluant la zone de la bannière, et déclencher une alarme sur les exécutions en échec.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The visual monitoring blueprint compares each run's screenshots with a baseline run and fails when the difference exceeds a threshold, which catches a missing button even when every request succeeds. Boundaries drawn on the baseline screenshot exclude the rotating banner, and the blueprint generates the script, so little code is needed.
    fr: |-
      Le plan visual monitoring compare les captures d'écran de chaque exécution à une exécution de référence et échoue quand l'écart dépasse un seuil, ce qui détecte un bouton manquant même quand toutes les requêtes réussissent. Des zones tracées sur la capture de référence excluent la bannière tournante, et le plan génère le script : peu de code est nécessaire.
  options:
    a:
      en: |-
        The home page kept returning HTTP 200 during both incidents, so a heartbeat check would have passed.
      fr: |-
        La page d'accueil a continué de renvoyer HTTP 200 pendant les deux incidents : une vérification heartbeat aurait réussi.
    b:
      en: |-
        All links worked during the incidents; the broken link checker reports unreachable links, not missing visual elements.
      fr: |-
        Tous les liens fonctionnaient pendant les incidents ; le broken link checker signale les liens inaccessibles, pas les éléments visuels manquants.
    c:
      en: |-
        The faulty style sheet raised no JavaScript error, so the RUM error count wouldn't change.
      fr: |-
        La feuille de style défectueuse n'a levé aucune erreur JavaScript : le nombre d'erreurs RUM ne changerait pas.
references:
  - title: "Using canary blueprints - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
