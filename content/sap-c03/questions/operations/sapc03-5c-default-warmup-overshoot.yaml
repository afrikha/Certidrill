id: sapc03-5c-default-warmup-overshoot
objective: "5.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs a Java web tier on Amazon EC2 instances in an Auto Scaling group with a target tracking policy that keeps average CPU utilization at 50 percent. For about 4 minutes after an instance enters the InService state, its CPU utilization stays near 90 percent while the JVM compiles code and caches warm, although it serves almost no traffic yet. During each scale-out, these new instances push the group's average CPU above the target, the policy keeps adding instances well beyond the need, and the group then scales in again. The company wants to keep the target tracking policy and stop this overshoot.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie exploite un niveau web Java sur des instances Amazon EC2 dans un groupe Auto Scaling doté d'une politique de suivi de cible qui maintient l'utilisation moyenne du processeur à 50 %. Pendant environ 4 minutes après le passage d'une instance à l'état InService, son utilisation du processeur reste proche de 90 % pendant que la JVM compile le code et que les caches se réchauffent, alors qu'elle ne sert encore presque aucun trafic. Lors de chaque montée en charge, ces nouvelles instances poussent la moyenne du processeur du groupe au-dessus de la cible, la politique continue d'ajouter des instances bien au-delà du besoin, puis le groupe réduit à nouveau sa capacité. L'entreprise veut conserver la politique de suivi de cible et faire cesser ce dépassement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the health check grace period of the group to 300 seconds so that new instances aren't evaluated during the JVM startup phase.
        fr: |-
          Relever le délai de grâce de la vérification de l'état du groupe à 300 secondes afin que les nouvelles instances ne soient pas évaluées pendant la phase de démarrage de la JVM.
    - id: b
      text:
        en: |-
          Turn on scale-in protection for new instances so that the group stops removing the extra instances that each scale-out adds.
        fr: |-
          Activer la protection contre la réduction de capacité pour les nouvelles instances afin que le groupe cesse de retirer les instances supplémentaires ajoutées par chaque montée en charge.
    - id: c
      text:
        en: |-
          Set the default instance warmup of the group to about 300 seconds so that new instances stay out of the aggregated metrics while they warm up.
        fr: |-
          Définir le préchauffage d'instance par défaut du groupe sur environ 300 secondes afin que les nouvelles instances restent hors des métriques agrégées pendant leur préchauffage.
    - id: d
      text:
        en: |-
          Lower the target value of the policy to 35 percent so that the startup CPU of the new instances has less weight in the average.
        fr: |-
          Abaisser la valeur cible de la politique à 35 % afin que le processeur au démarrage des nouvelles instances pèse moins dans la moyenne.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The default instance warmup sets how long after reaching InService an instance waits before its usage data counts in the aggregated metrics used by target tracking and step scaling. While instances warm up, they still count as capacity during scale-out, so the policy stops adding instances in response to their startup CPU; AWS strongly recommends setting it, and 300 seconds is the suggested starting point.
    fr: |-
      Le préchauffage d'instance par défaut définit combien de temps une instance attend après être passée InService avant que ses données d'utilisation comptent dans les métriques agrégées utilisées par le suivi de cible et la mise à l'échelle par étapes. Pendant leur préchauffage, les instances comptent quand même comme capacité lors de la montée en charge : la politique cesse d'ajouter des instances en réaction à leur processeur de démarrage ; AWS recommande fortement de le définir, et 300 secondes est la valeur de départ suggérée.
  options:
    a:
      en: |-
        The grace period delays health checks before an instance can be marked unhealthy; it doesn't remove the instance's CPU from the scaling metric.
      fr: |-
        Le délai de grâce retarde les vérifications de l'état avant qu'une instance puisse être déclarée non saine ; il ne retire pas le processeur de l'instance de la métrique de mise à l'échelle.
    b:
      en: |-
        Protecting instances from scale-in keeps the excess capacity and its cost instead of preventing the overshoot.
      fr: |-
        Protéger les instances contre la réduction de capacité conserve la capacité excédentaire et son coût au lieu d'empêcher le dépassement.
    d:
      en: |-
        A lower target runs more instances all the time, and the new instances' startup CPU still distorts the average during each scale-out.
      fr: |-
        Une cible plus basse fait tourner davantage d'instances en permanence, et le processeur de démarrage des nouvelles instances fausse toujours la moyenne lors de chaque montée en charge.
references:
  - title: "Set the default instance warmup for an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-default-instance-warmup.html
