id: sapc03-5c-lambda-async-destination
objective: "5.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate company uploads property photos to an Amazon S3 bucket, and S3 event notifications invoke an AWS Lambda function asynchronously to resize each photo. When the function fails, the operations team needs the original event together with the error details and the function's response, to reprocess the photo later. A photo that isn't processed within 1 hour is no longer useful, and the team wants a failed event to be retried only once to limit duplicate work. The company wants to use built-in Lambda features.

    Which solution will meet these requirements?
  fr: |
    Une entreprise immobilière dépose des photos de biens dans un compartiment Amazon S3, et les notifications d'événements S3 invoquent une fonction AWS Lambda de façon asynchrone pour redimensionner chaque photo. Quand la fonction échoue, l'équipe d'exploitation a besoin de l'événement d'origine avec le détail de l'erreur et la réponse de la fonction, pour retraiter la photo plus tard. Une photo qui n'est pas traitée dans l'heure n'est plus utile, et l'équipe veut qu'un événement en échec ne soit réessayé qu'une seule fois afin de limiter le travail en double. L'entreprise veut utiliser les fonctionnalités intégrées de Lambda.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the function's asynchronous invocation config to 1 retry attempt and a maximum event age of 3,600 seconds, with an SQS queue as on-failure destination.
        fr: |-
          Définir la configuration d'invocation asynchrone de la fonction sur 1 nouvelle tentative et un âge maximal des événements de 3 600 secondes, avec une file SQS comme destination en cas d'échec.
    - id: b
      text:
        en: |-
          Configure an Amazon SQS dead-letter queue on the function, and set the maximum retry attempts to 1 and the maximum event age to 3,600 seconds.
        fr: |-
          Configurer une file d'attente de lettres mortes Amazon SQS sur la fonction, et définir le nombre maximal de nouvelles tentatives sur 1 et l'âge maximal des événements sur 3 600 secondes.
    - id: c
      text:
        en: |-
          Send the S3 event notifications to an Amazon SQS queue with a redrive policy that has a maxReceiveCount of 2, and have the function poll the queue.
        fr: |-
          Envoyer les notifications d'événements S3 dans une file d'attente Amazon SQS dotée d'une politique de redirection avec un maxReceiveCount de 2, et faire interroger la file par la fonction.
    - id: d
      text:
        en: |-
          Configure an on-failure destination on the function, and keep the default retry and event age settings so that Lambda retries the event until it succeeds.
        fr: |-
          Configurer une destination en cas d'échec sur la fonction, et conserver les paramètres par défaut de nouvelles tentatives et d'âge des événements afin que Lambda réessaie l'événement jusqu'à sa réussite.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For asynchronous invocations, the maximum retry attempts (0 to 2) and the maximum event age (up to 6 hours) control how long Lambda keeps trying. An on-failure destination receives an invocation record with details about the request and the response, which gives the team the event and the error to reprocess it.
    fr: |-
      Pour les invocations asynchrones, le nombre maximal de nouvelles tentatives (de 0 à 2) et l'âge maximal des événements (jusqu'à 6 heures) déterminent combien de temps Lambda continue d'essayer. Une destination en cas d'échec reçoit un enregistrement d'invocation contenant le détail de la requête et de la réponse, ce qui donne à l'équipe l'événement et l'erreur pour le retraiter.
  options:
    b:
      en: |-
        A dead-letter queue receives only the content of the event, without the response details, plus a short error message attribute, so the team loses the function's response.
      fr: |-
        Une file d'attente de lettres mortes ne reçoit que le contenu de l'événement, sans le détail de la réponse, plus un bref attribut de message d'erreur : l'équipe perd la réponse de la fonction.
    c:
      en: |-
        Moving to a queue changes the invocation model and the event source configuration, and an SQS dead-letter queue holds only the message, not the function's error and response.
      fr: |-
        Passer à une file d'attente change le modèle d'invocation et la configuration de la source d'événements, et une file de lettres mortes SQS ne contient que le message, pas l'erreur et la réponse de la fonction.
    d:
      en: |-
        By default, Lambda retries function errors twice and keeps events for up to 6 hours, which allows duplicate work and processing long after the 1-hour limit.
      fr: |-
        Par défaut, Lambda réessaie deux fois les erreurs de fonction et conserve les événements jusqu'à 6 heures, ce qui permet du travail en double et un traitement bien après la limite d'une heure.
references:
  - title: "Capturing records of Lambda asynchronous invocations - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
  - title: "How Lambda handles errors and retries with asynchronous invocation - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
