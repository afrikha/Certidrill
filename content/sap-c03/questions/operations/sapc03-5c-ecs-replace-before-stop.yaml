id: sapc03-5c-ecs-replace-before-stop
objective: "5.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fintech company runs a quote service as an Amazon ECS service on AWS Fargate with a desired count of 4 tasks behind an Application Load Balancer. The service's deployment configuration uses a minimumHealthyPercent of 50 and a maximumPercent of 100, and the account has ample Fargate capacity. When a task fails its health checks, ECS stops it before starting the replacement, and the 3 remaining tasks run above their latency target for about 3 minutes until the new task passes its health checks. The company wants ECS to keep an unhealthy task running until its replacement is healthy, without permanently running more than 4 tasks.

    Which solution will meet these requirements?
  fr: |
    Une fintech exploite un service de cotation sous forme de service Amazon ECS sur AWS Fargate avec un nombre souhaité de 4 tâches derrière un Application Load Balancer. La configuration de déploiement du service utilise un minimumHealthyPercent de 50 et un maximumPercent de 100, et le compte dispose d'une large capacité Fargate. Quand une tâche échoue à ses vérifications de l'état, ECS l'arrête avant de démarrer la remplaçante, et les 3 tâches restantes dépassent leur objectif de latence pendant environ 3 minutes, jusqu'à ce que la nouvelle tâche réussisse ses vérifications. L'entreprise veut qu'ECS garde une tâche non saine en fonctionnement jusqu'à ce que sa remplaçante soit saine, sans exécuter en permanence plus de 4 tâches.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set minimumHealthyPercent to 100 and keep maximumPercent at 100, so that ECS never reduces the number of running tasks.
        fr: |-
          Définir minimumHealthyPercent sur 100 et conserver maximumPercent à 100, afin qu'ECS ne réduise jamais le nombre de tâches en cours d'exécution.
    - id: b
      text:
        en: |-
          Set maximumPercent to 200 so that the scheduler starts each replacement first and stops the unhealthy task once the replacement is healthy.
        fr: |-
          Définir maximumPercent sur 200 afin que le planificateur démarre d'abord chaque remplaçante et arrête la tâche non saine une fois la remplaçante saine.
    - id: c
      text:
        en: |-
          Raise healthCheckGracePeriodSeconds of the service to 300 seconds, so that a task isn't stopped while its replacement starts.
        fr: |-
          Relever le healthCheckGracePeriodSeconds du service à 300 secondes, afin qu'une tâche ne soit pas arrêtée pendant le démarrage de sa remplaçante.
    - id: d
      text:
        en: |-
          Raise the desired count of the service to 5, so that 4 healthy tasks always remain while an unhealthy task is being replaced.
        fr: |-
          Relever le nombre souhaité du service à 5, afin que 4 tâches saines subsistent toujours pendant le remplacement d'une tâche non saine.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The ECS scheduler uses maximumPercent when it replaces unhealthy tasks: when the limit and the capacity allow it, it starts the replacement first and stops the unhealthy task only after the replacement is healthy. With maximumPercent at 100, there is no room for an extra task, so the unhealthy task must be stopped first.
    fr: |-
      Le planificateur ECS utilise maximumPercent lorsqu'il remplace des tâches non saines : quand la limite et la capacité le permettent, il démarre d'abord la remplaçante et n'arrête la tâche non saine qu'une fois la remplaçante saine. Avec maximumPercent à 100, il n'y a pas de place pour une tâche supplémentaire : la tâche non saine doit être arrêtée d'abord.
  options:
    a:
      en: |-
        With maximumPercent at 100, ECS still can't start a replacement alongside the unhealthy task; it stops unhealthy tasks one by one, using minimumHealthyPercent as a constraint, to free room.
      fr: |-
        Avec maximumPercent à 100, ECS ne peut toujours pas démarrer une remplaçante à côté de la tâche non saine ; il arrête les tâches non saines une par une, en utilisant minimumHealthyPercent comme contrainte, pour libérer de la place.
    c:
      en: |-
        The grace period only delays when load balancer health checks start counting for new tasks; it doesn't change the order of replacement and slows failure detection.
      fr: |-
        Le délai de grâce retarde seulement le moment où les vérifications de l'état de l'équilibreur de charge commencent à compter pour les nouvelles tâches ; il ne change pas l'ordre du remplacement et ralentit la détection des défaillances.
    d:
      en: |-
        A fifth task runs permanently, which the company doesn't want.
      fr: |-
        Une cinquième tâche s'exécute en permanence, ce que l'entreprise ne veut pas.
references:
  - title: "DeploymentConfiguration - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_DeploymentConfiguration.html
