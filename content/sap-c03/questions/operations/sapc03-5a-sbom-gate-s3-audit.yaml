id: sapc03-5a-sbom-gate-s3-audit
objective: "5.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's V2 AWS CodePipeline pipeline builds a container image, pushes it with a unique tag to an Amazon ECR repository in the tooling account, and then deploys it to Amazon ECS in production. Two new requirements apply. The pipeline must stop the release before the deployment stage when the pushed image has any critical vulnerability. Auditors also need the software bill of materials (SBOM) of every released image in an S3 bucket named audit-sbom in the tooling account. The company wants managed pipeline actions and no scanner tools to maintain.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le pipeline AWS CodePipeline V2 d'une entreprise génère une image de conteneur, l'envoie avec une balise unique dans un référentiel Amazon ECR du compte d'outillage, puis la déploie sur Amazon ECS en production. Deux nouvelles exigences s'appliquent. Le pipeline doit arrêter la publication avant l'étape de déploiement lorsque l'image envoyée présente la moindre vulnérabilité critique. Les auditeurs ont aussi besoin de la nomenclature logicielle (SBOM) de chaque image publiée dans un compartiment S3 nommé audit-sbom du compte d'outillage. L'entreprise veut des actions de pipeline gérées et aucun outil d'analyse à maintenir.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on ECR basic scanning with scan on push for the repository, so that ECR rejects any pushed image that has a critical finding.
        fr: |-
          Activer l'analyse de base d'ECR avec analyse à l'envoi pour le référentiel, pour qu'ECR rejette toute image envoyée qui présente un résultat critique.
    - id: b
      text:
        en: |-
          Add an ECR lifecycle policy that expires images with critical findings, so that the deployment stage can't find a vulnerable image to deploy.
        fr: |-
          Ajouter une politique de cycle de vie ECR qui fait expirer les images présentant des résultats critiques, pour que l'étape de déploiement ne trouve aucune image vulnérable à déployer.
    - id: c
      text:
        en: |-
          Add an InspectorScan action in ECRImageScan mode after the push, with the repository name, the image tag of the build, and CriticalThreshold set to 0.
        fr: |-
          Ajouter une action InspectorScan en mode ECRImageScan après l'envoi, avec le nom du référentiel, la balise d'image de la génération et CriticalThreshold défini à 0.
    - id: d
      text:
        en: |-
          Add an InspectorScan action in SourceCodeScan mode after the push, with the image digest of the build as its input artifact and CriticalThreshold set to 0.
        fr: |-
          Ajouter une action InspectorScan en mode SourceCodeScan après l'envoi, avec le condensé de l'image de la génération comme artefact d'entrée et CriticalThreshold défini à 0.
    - id: e
      text:
        en: |-
          Add an Amazon S3 deploy action that writes the SBOM output artifact of the InspectorScan action to the audit-sbom bucket.
        fr: |-
          Ajouter une action de déploiement Amazon S3 qui écrit l'artefact de sortie SBOM de l'action InspectorScan dans le compartiment audit-sbom.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      In ECRImageScan mode, the InspectorScan action scans the image identified by its repository and tag and fails when the critical findings exceed the threshold, so a threshold of 0 stops the pipeline before deployment. The action's output artifact is an SBOM, which an S3 deploy action can write to the audit bucket in the same pipeline, with no tool to maintain.
    fr: |-
      En mode ECRImageScan, l'action InspectorScan analyse l'image désignée par son référentiel et sa balise et échoue lorsque les résultats critiques dépassent le seuil : un seuil de 0 arrête le pipeline avant le déploiement. L'artefact de sortie de l'action est une SBOM, qu'une action de déploiement S3 peut écrire dans le compartiment d'audit au sein du même pipeline, sans outil à maintenir.
  options:
    a:
      en: |-
        Basic scanning reports findings after the push but never rejects an image, and it produces no SBOM.
      fr: |-
        L'analyse de base signale des résultats après l'envoi mais ne rejette jamais d'image, et elle ne produit pas de SBOM.
    b:
      en: |-
        Lifecycle rules select images by tag status, age, or count, not by scan findings, and deleting images doesn't stop the pipeline.
      fr: |-
        Les règles de cycle de vie sélectionnent les images selon l'état des balises, l'âge ou le nombre, pas selon les résultats d'analyse, et supprimer des images n'arrête pas le pipeline.
    d:
      en: |-
        SourceCodeScan mode scans source code in an input artifact; scanning an image in ECR requires ECRImageScan mode.
      fr: |-
        Le mode SourceCodeScan analyse du code source contenu dans un artefact d'entrée ; analyser une image dans ECR exige le mode ECRImageScan.
references:
  - title: Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
