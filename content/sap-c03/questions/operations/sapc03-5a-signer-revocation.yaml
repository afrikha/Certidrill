id: sapc03-5a-signer-revocation
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company signs AWS Lambda .zip packages with version v3 of an AWS Signer signing profile named release. Every production function has a code signing configuration in Enforce mode that allows this profile version. The security team learns that a build server that could start signing jobs with release v3 was compromised starting at 02:00 UTC yesterday. Packages signed before that time are trusted and must remain deployable during the investigation. Any package signed with release v3 at or after 02:00 UTC yesterday must be rejected at deployment in all Regions. New releases will be signed with a new profile.

    Which solution will meet these requirements?
  fr: |
    Une entreprise signe des packages .zip AWS Lambda avec la version v3 d'un profil de signature AWS Signer nommé release. Chaque fonction de production a une configuration de signature de code en mode Enforce qui autorise cette version de profil. L'équipe de sécurité apprend qu'un serveur de génération qui pouvait lancer des tâches de signature avec release v3 a été compromis à partir de 02:00 UTC hier. Les packages signés avant cette heure sont fiables et doivent rester déployables pendant l'enquête. Tout package signé avec release v3 à partir de 02:00 UTC hier doit être rejeté au déploiement dans toutes les Régions. Les nouvelles versions seront signées avec un nouveau profil.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Revoke version v3 of the release signing profile with an effective time of 02:00 UTC yesterday, and add the new profile to the allowed publishers of the code signing configurations.
        fr: |-
          Révoquer la version v3 du profil de signature release avec une heure d'effet fixée à 02:00 UTC hier, et ajouter le nouveau profil aux éditeurs autorisés des configurations de signature de code.
    - id: b
      text:
        en: |-
          Remove release v3 from the allowed publishers of every code signing configuration, and add the new profile so that only packages signed by the new profile can be deployed.
        fr: |-
          Retirer release v3 des éditeurs autorisés de chaque configuration de signature de code, et ajouter le nouveau profil pour que seuls les packages signés par le nouveau profil puissent être déployés.
    - id: c
      text:
        en: |-
          Change UntrustedArtifactOnDeployment to Warn on every code signing configuration until the investigation ends, and alarm on the SignatureValidationErrors metric to find affected deployments.
        fr: |-
          Passer UntrustedArtifactOnDeployment à Warn sur chaque configuration de signature de code jusqu'à la fin de l'enquête, et créer une alarme sur la métrique SignatureValidationErrors pour repérer les déploiements concernés.
    - id: d
      text:
        en: |-
          Revoke version v3 of the release signing profile with an effective time of 00:00 UTC tomorrow, so that deployments that are in progress today can finish first.
        fr: |-
          Révoquer la version v3 du profil de signature release avec une heure d'effet fixée à 00:00 UTC demain, pour que les déploiements en cours aujourd'hui puissent d'abord se terminer.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Revoking a signing profile version makes the signatures that it generated after the effective time untrusted, and the profile can't start new signing jobs. Lambda checks revocation at deployment, and a revoked signature fails the check in all Regions of the partition, so packages signed from 02:00 UTC yesterday are blocked in Enforce mode while earlier packages still pass. Adding the new profile lets new releases deploy.
    fr: |-
      Révoquer une version de profil de signature rend non fiables les signatures qu'elle a générées après l'heure d'effet, et le profil ne peut plus lancer de nouvelles tâches de signature. Lambda vérifie la révocation au déploiement, et une signature révoquée échoue à ce contrôle dans toutes les Régions de la partition : les packages signés à partir de 02:00 UTC hier sont bloqués en mode Enforce, tandis que les packages antérieurs passent toujours. Ajouter le nouveau profil permet de déployer les nouvelles versions.
  options:
    b:
      en: |-
        Removing the profile version from the allowed publishers rejects every package that it signed, including the trusted packages signed before the compromise.
      fr: |-
        Retirer la version de profil des éditeurs autorisés rejette tous les packages qu'elle a signés, y compris les packages fiables signés avant la compromission.
    c:
      en: |-
        Warn mode lets packages that fail validation deploy, so packages signed by the compromised server would reach production.
      fr: |-
        Le mode Warn laisse se déployer les packages qui échouent à la validation : des packages signés par le serveur compromis atteindraient la production.
    d:
      en: |-
        The effective time of a profile revocation must be in the past, and a later time would leave the packages signed since 02:00 UTC yesterday trusted.
      fr: |-
        L'heure d'effet d'une révocation de profil doit être dans le passé, et une heure ultérieure laisserait fiables les packages signés depuis 02:00 UTC hier.
references:
  - title: Revoke signatures generated by Signer - AWS Signer
    url: https://docs.aws.amazon.com/signer/latest/developerguide/revocation.html
  - title: RevokeSigningProfile - AWS Signer
    url: https://docs.aws.amazon.com/signer/latest/api/API_RevokeSigningProfile.html
