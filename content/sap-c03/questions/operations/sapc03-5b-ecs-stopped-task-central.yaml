id: sapc03-5b-ecs-stopped-task-central
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs Amazon ECS services on AWS Fargate in 25 workload accounts of its organization in AWS Organizations, all in eu-west-1. After bad configuration changes, some tasks enter crash loops, and the on-call team learns about it only when users complain. The central operations account must be notified within a minute whenever a task stops because an essential container exited. The notification must include the cluster, the task definition, and the reason the task stopped. New workload accounts must be covered without manual steps.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute des services Amazon ECS sur AWS Fargate dans 25 comptes de charge de travail de son organisation AWS Organizations, tous dans eu-west-1. Après de mauvaises modifications de configuration, certaines tâches entrent dans des boucles de plantage, et l'équipe d'astreinte ne l'apprend que lorsque les utilisateurs se plaignent. Le compte d'exploitation central doit être averti en moins d'une minute chaque fois qu'une tâche s'arrête parce qu'un conteneur essentiel s'est terminé. La notification doit indiquer le cluster, la définition de tâche et la raison de l'arrêt de la tâche. Les nouveaux comptes de charge de travail doivent être couverts sans étape manuelle.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Turn on Container Insights in every account, and create a CloudWatch alarm in each account on the RunningTaskCount metric of every service, with an Amazon SNS action.", fr: "Activer Container Insights dans chaque compte, et créer dans chaque compte une alarme CloudWatch sur la métrique RunningTaskCount de chaque service, avec une action Amazon SNS." } }
    - { id: b, text: { en: "Deploy with StackSets automatic deployment an EventBridge rule that matches ECS Task State Change events with the STOPPED status and the EssentialContainerExited stop code, and targets a central event bus.", fr: "Déployer avec le déploiement automatique de StackSets une règle EventBridge qui correspond aux événements ECS Task State Change avec le statut STOPPED et le code d'arrêt EssentialContainerExited, et qui cible un bus d'événements central." } }
    - { id: c, text: { en: "Create an organization trail in AWS CloudTrail, and add a metric filter in the central account that counts StopTask API calls, with an alarm that notifies the on-call team.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail, et ajouter dans le compte central un filtre de métrique qui compte les appels d'API StopTask, avec une alarme qui avertit l'équipe d'astreinte." } }
    - { id: d, text: { en: "Schedule a CloudWatch Logs Insights query every 5 minutes in each account that searches the application logs for container exit messages and publishes the results to Amazon SNS.", fr: "Planifier toutes les 5 minutes dans chaque compte une requête CloudWatch Logs Insights qui recherche les messages de fin de conteneur dans les journaux applicatifs et publie les résultats dans Amazon SNS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon ECS sends an ECS Task State Change event to EventBridge when a container changes state or the service scheduler stops a task, and for a stopped task the stoppedReason and stopCode fields explain why. A rule that forwards these events to a central event bus, whose policy allows the organization, delivers them within seconds, and StackSets automatic deployment creates the rule in new accounts."
    fr: "Amazon ECS envoie un événement ECS Task State Change à EventBridge quand un conteneur change d'état ou que le planificateur de service arrête une tâche, et pour une tâche arrêtée, les champs stoppedReason et stopCode expliquent pourquoi. Une règle qui transfère ces événements vers un bus d'événements central, dont la politique autorise l'organisation, les livre en quelques secondes, et le déploiement automatique de StackSets crée la règle dans les nouveaux comptes."
  options:
    a: { en: "A task count does not carry the stop reason or the task definition, and one alarm per service in every account adds overhead and misses new services.", fr: "Un nombre de tâches ne porte ni la raison de l'arrêt ni la définition de tâche, et une alarme par service dans chaque compte ajoute de la charge et oublie les nouveaux services." }
    c: { en: "A task that stops because its essential container exits is not stopped by a StopTask API call, so the trail does not record these stops.", fr: "Une tâche qui s'arrête parce que son conteneur essentiel s'est terminé n'est pas arrêtée par un appel d'API StopTask : le journal de suivi n'enregistre pas ces arrêts." }
    d: { en: "A query every 5 minutes cannot notify within a minute, and application logs do not reliably contain the ECS stop reason.", fr: "Une requête toutes les 5 minutes ne peut pas avertir en moins d'une minute, et les journaux applicatifs ne contiennent pas de façon fiable la raison d'arrêt ECS." }
references:
  - title: Amazon ECS task state change events
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_task_events.html
