id: sapc03-5a-iac-generator-import
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company built its first production workload two years ago by using the AWS Management Console in one AWS account and one Region. The workload contains a VPC, an Amazon RDS for PostgreSQL DB instance, Amazon S3 buckets, AWS Lambda functions, and Amazon SQS queues, about 180 resources in total, and none of them is managed by AWS CloudFormation. The company now wants every change to go through CloudFormation and a deployment pipeline. The resources hold production data and partners reference them by name, so they must not be recreated or renamed, and the workload cannot have downtime. The team wants to avoid writing the templates by hand.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique a créé sa première charge de travail de production il y a deux ans à l'aide de l'AWS Management Console, dans un compte AWS et une Région. La charge de travail comprend un VPC, une instance de base de données Amazon RDS for PostgreSQL, des compartiments Amazon S3, des fonctions AWS Lambda et des files d'attente Amazon SQS, soit environ 180 ressources, dont aucune n'est gérée par AWS CloudFormation. L'entreprise veut désormais que chaque modification passe par CloudFormation et un pipeline de déploiement. Les ressources contiennent des données de production et des partenaires les désignent par leur nom : elles ne doivent être ni recréées ni renommées, et la charge de travail ne peut subir aucune interruption. L'équipe veut éviter d'écrire les modèles à la main.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Write templates that declare the same resources with the same physical names, deploy them as new stacks, and let CloudFormation adopt the existing resources whose names match the template.
        fr: |-
          Écrire des modèles qui déclarent les mêmes ressources avec les mêmes noms physiques, les déployer comme nouvelles piles, et laisser CloudFormation adopter les ressources existantes dont le nom correspond au modèle.
    - id: b
      text:
        en: |-
          Run CloudFormation drift detection on the account to produce a template of the unmanaged resources, and then create a stack from the drift detection results.
        fr: |-
          Exécuter la détection de dérive CloudFormation sur le compte pour produire un modèle des ressources non gérées, puis créer une pile à partir des résultats de la détection de dérive.
    - id: c
      text:
        en: |-
          Use the CloudFormation IaC generator to scan the Region, generate a template from the scanned resources and their related resources, and import the resources into a new stack with that template.
        fr: |-
          Utiliser le générateur IaC de CloudFormation pour analyser la Région, générer un modèle à partir des ressources analysées et de leurs ressources associées, puis importer les ressources dans une nouvelle pile avec ce modèle.
    - id: d
      text:
        en: |-
          Export the configuration items of the resources with AWS Config advanced queries, convert them into an AWS CDK app, and deploy the app to the account with cdk deploy, using the same resource names.
        fr: |-
          Exporter les éléments de configuration des ressources avec les requêtes avancées d'AWS Config, les convertir en application AWS CDK, puis déployer l'application dans le compte avec cdk deploy, avec les mêmes noms de ressources.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The IaC generator scans the resources of a Region that CloudFormation doesn't manage yet and builds a template from them and their related resources (up to 500 resources per template). The generated template is then used to import the existing resources into a stack, so CloudFormation takes them over in place, without recreating or renaming them. The same template can also be migrated to a CDK app with cdk migrate if the team prefers code.
    fr: |-
      Le générateur IaC analyse les ressources d'une Région que CloudFormation ne gère pas encore et construit un modèle à partir de ces ressources et de leurs ressources associées (jusqu'à 500 ressources par modèle). Le modèle généré sert ensuite à importer les ressources existantes dans une pile : CloudFormation les prend en charge sur place, sans les recréer ni les renommer. Le même modèle peut aussi être converti en application CDK avec cdk migrate si l'équipe préfère le code.
  options:
    a:
      en: |-
        A regular stack creation always tries to create new resources; CloudFormation doesn't adopt existing resources by name, so creations fail on name conflicts or produce duplicates.
      fr: |-
        Une création de pile classique tente toujours de créer de nouvelles ressources ; CloudFormation n'adopte pas les ressources existantes par leur nom, donc les créations échouent sur des conflits de noms ou produisent des doublons.
    b:
      en: |-
        Drift detection compares resources that already belong to a stack with the stack's template; it doesn't discover unmanaged resources or generate templates.
      fr: |-
        La détection de dérive compare des ressources qui appartiennent déjà à une pile avec le modèle de cette pile ; elle ne découvre pas les ressources non gérées et ne génère pas de modèles.
    d:
      en: |-
        Deploying a new CDK app creates new resources instead of taking over the existing ones, which would duplicate the workload and break the names that partners use.
      fr: |-
        Le déploiement d'une nouvelle application CDK crée de nouvelles ressources au lieu de prendre en charge les ressources existantes, ce qui dupliquerait la charge de travail et casserait les noms utilisés par les partenaires.
references:
  - title: Generate templates from existing resources with IaC generator - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/generate-IaC.html
