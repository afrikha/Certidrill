id: sapc03-5a-hook-warn-rollout
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's cloud platform team wrote AWS CloudFormation Guard rules that require customer managed KMS keys for Amazon S3 buckets, Amazon EBS volumes, and Amazon SQS queues. The 150 member accounts in AWS Organizations deploy infrastructure only through AWS CloudFormation, in three Regions. The team expects some existing pipelines to violate the rules. For two weeks, it wants to see which stack operations would be affected without blocking any deployment. After that, the same rules must stop non-compliant resources before CloudFormation provisions them, in every member account and Region, including accounts created later. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme cloud d'AnyCompany a écrit des règles AWS CloudFormation Guard qui exigent des clés KMS gérées par le client pour les compartiments Amazon S3, les volumes Amazon EBS et les files d'attente Amazon SQS. Les 150 comptes membres d'AWS Organizations déploient leur infrastructure uniquement avec AWS CloudFormation, dans trois Régions. L'équipe s'attend à ce que certains pipelines existants enfreignent les règles. Pendant deux semaines, elle veut voir quelles opérations de pile seraient affectées, sans bloquer aucun déploiement. Ensuite, les mêmes règles doivent arrêter les ressources non conformes avant que CloudFormation ne les provisionne, dans chaque compte membre et chaque Région, y compris dans les comptes créés plus tard. L'équipe veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook that reads the rules from Amazon S3 with FailureMode WARN, through a service-managed StackSet with automatic deployment to all OUs and Regions, and later update it to FAIL.
        fr: |-
          Déployer un AWS::CloudFormation::GuardHook qui lit les règles dans Amazon S3 avec FailureMode WARN, au moyen d'un StackSet à autorisations gérées par le service avec déploiement automatique sur toutes les OU et Régions, puis le passer à FAIL.
    - id: b
      text:
        en: |-
          Deploy the rules as AWS Config custom policy rules in proactive evaluation mode through an organization conformance pack, and then switch the rules to detective evaluation with automatic remediation after two weeks in every account.
        fr: |-
          Déployer les règles sous forme de règles de politique personnalisées AWS Config en mode d'évaluation proactive au moyen d'un pack de conformité d'organisation, puis passer les règles en évaluation de détection avec correction automatique au bout de deux semaines dans chaque compte.
    - id: c
      text:
        en: |-
          Convert the rules into an SCP, attach it to the organization root in audit mode for two weeks so that denied calls are only logged, and then switch the SCP to enforcement mode.
        fr: |-
          Convertir les règles en SCP, l'attacher à la racine de l'organisation en mode audit pendant deux semaines pour que les appels refusés soient seulement journalisés, puis passer la SCP en mode application.
    - id: d
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook with HookStatus set to DISABLED in every account for two weeks to collect its evaluation results, and then set HookStatus to ENABLED with FailureMode set to FAIL.
        fr: |-
          Déployer un AWS::CloudFormation::GuardHook avec HookStatus défini à DISABLED dans chaque compte pendant deux semaines pour collecter ses résultats d'évaluation, puis définir HookStatus à ENABLED avec FailureMode à FAIL.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Guard hook evaluates resources before CloudFormation provisions them. In WARN mode it lets the operation continue and records a warning, which shows the affected stacks without blocking them; switching FailureMode to FAIL then stops non-compliant operations. Hooks are configured per account and Region, so a service-managed StackSet with automatic deployment reaches every member account, Region, and future account from one place.
    fr: |-
      Un hook Guard évalue les ressources avant que CloudFormation ne les provisionne. En mode WARN, il laisse l'opération se poursuivre et enregistre un avertissement, ce qui montre les piles concernées sans les bloquer ; passer ensuite FailureMode à FAIL arrête les opérations non conformes. Les hooks se configurent par compte et par Région : un StackSet à autorisations gérées par le service avec déploiement automatique atteint depuis un seul endroit chaque compte membre, chaque Région et les comptes futurs.
  options:
    b:
      en: |-
        AWS Config rules, in proactive or detective mode, report compliance but never stop a CloudFormation operation, so the enforcement requirement isn't met.
      fr: |-
        Les règles AWS Config, en mode proactif ou de détection, signalent la conformité mais n'arrêtent jamais une opération CloudFormation : l'exigence d'application n'est pas satisfaite.
    c:
      en: |-
        SCPs have no audit mode and can't evaluate Guard rules against template properties; they only allow or deny API calls by action, resource, and condition keys.
      fr: |-
        Les SCP n'ont pas de mode audit et ne peuvent pas évaluer des règles Guard sur les propriétés d'un modèle ; elles autorisent ou refusent seulement des appels d'API selon l'action, la ressource et les clés de condition.
    d:
      en: |-
        A disabled hook isn't invoked, so it produces no evaluation results during the observation period.
      fr: |-
        Un hook désactivé n'est pas invoqué : il ne produit aucun résultat d'évaluation pendant la période d'observation.
references:
