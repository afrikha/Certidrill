id: sapc03-5a-lambda-layer-signing
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company attached a Lambda code signing configuration in Enforce mode to 200 production functions; the only allowed publisher is the company's release signing profile in AWS Signer. The function packages are signed by the release pipeline. The functions also use a shared Lambda layer that a third-party vendor publishes, unsigned, in the vendor's AWS account. Since the change, every deployment of these functions fails code signing validation. The layer must remain a separate layer that all the functions share, and unsigned code must never be deployed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a attaché une configuration de signature de code Lambda en mode Enforce à 200 fonctions de production ; le seul éditeur autorisé est le profil de signature release de l'entreprise dans AWS Signer. Les packages des fonctions sont signés par le pipeline de publication. Les fonctions utilisent aussi une couche Lambda partagée qu'un éditeur tiers publie, non signée, dans son propre compte AWS. Depuis cette modification, chaque déploiement de ces fonctions échoue à la validation de la signature de code. La couche doit rester une couche distincte partagée par toutes les fonctions, et du code non signé ne doit jamais être déployé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change UntrustedArtifactOnDeployment to Warn, so that deployments that include the unsigned vendor layer succeed while the function code itself remains signed by the release profile.
        fr: |-
          Passer UntrustedArtifactOnDeployment à Warn, pour que les déploiements qui incluent la couche non signée de l'éditeur réussissent tandis que le code des fonctions reste signé par le profil release.
    - id: b
      text:
        en: |-
          Add the vendor's AWS account ID to the allowed publishers of the code signing configuration, so that layers published by that account are accepted.
        fr: |-
          Ajouter l'ID de compte AWS de l'éditeur aux éditeurs autorisés de la configuration de signature de code, pour que les couches publiées par ce compte soient acceptées.
    - id: c
      text:
        en: |-
          Sign a copy of the vendor's layer archive with the release profile in the pipeline, publish it as a layer version in the company's accounts, and use it in the functions.
        fr: |-
          Signer une copie de l'archive de la couche de l'éditeur avec le profil release dans le pipeline, la publier comme version de couche dans les comptes de l'entreprise, et l'utiliser dans les fonctions.
    - id: d
      text:
        en: |-
          Add the ARN of the vendor's layer to an exclusion list in the code signing configuration, so that Lambda validates only the function packages.
        fr: |-
          Ajouter l'ARN de la couche de l'éditeur à une liste d'exclusion de la configuration de signature de code, pour que Lambda ne valide que les packages des fonctions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When code signing is enabled on a function, every layer that the function uses must also be signed by an allowed signing profile. Signing a copy of the vendor's layer with the release profile and publishing it as the company's own layer version keeps one shared layer, passes validation in Enforce mode, and lets the security team review what it signs.
    fr: |-
      Lorsque la signature de code est activée sur une fonction, chaque couche que la fonction utilise doit aussi être signée par un profil de signature autorisé. Signer une copie de la couche de l'éditeur avec le profil release et la publier comme version de couche propre à l'entreprise conserve une couche partagée unique, réussit la validation en mode Enforce et permet à l'équipe de sécurité d'examiner ce qu'elle signe.
  options:
    a:
      en: |-
        Warn mode lets any package that fails validation deploy, so unsigned code would reach production, which the company forbids.
      fr: |-
        Le mode Warn laisse se déployer tout package qui échoue à la validation : du code non signé atteindrait la production, ce que l'entreprise interdit.
    b:
      en: |-
        Allowed publishers are signing profile versions, not AWS accounts; an unsigned layer fails validation whoever publishes it.
      fr: |-
        Les éditeurs autorisés sont des versions de profils de signature, pas des comptes AWS ; une couche non signée échoue à la validation, quel que soit son éditeur.
    d:
      en: |-
        Code signing configurations have no exclusion list: every layer of a function with code signing must be signed by an allowed profile.
      fr: |-
        Les configurations de signature de code n'ont pas de liste d'exclusion : chaque couche d'une fonction soumise à la signature de code doit être signée par un profil autorisé.
references:
  - title: Using code signing to verify code integrity with Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
