id: sapc03-5c-sdk-adaptive-single-table
objective: "5.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a nightly loader as an Amazon ECS task that uses the AWS SDK to write about 40 million items into a single Amazon DynamoDB table. The table uses provisioned capacity, which the finance team has fixed for budget reasons. The loader runs with the SDK's standard retry mode and default settings; during the load, frequent throttling errors deplete the SDK's retry quota, retries stop, and the job fails. The company wants the SDK itself to slow down the request rate, including first attempts, when throttling occurs, so that the job finishes without failing. The company wants to change only the SDK configuration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute chaque nuit un chargeur sous forme de tâche Amazon ECS qui utilise le SDK AWS pour écrire environ 40 millions d'éléments dans une seule table Amazon DynamoDB. La table utilise une capacité provisionnée, que l'équipe financière a fixée pour des raisons budgétaires. Le chargeur s'exécute avec le mode de nouvelle tentative standard du SDK et les paramètres par défaut ; pendant le chargement, de fréquentes erreurs de limitation épuisent le quota de nouvelles tentatives du SDK, les nouvelles tentatives s'arrêtent et la tâche échoue. L'entreprise veut que le SDK lui-même ralentisse le débit des requêtes, premières tentatives comprises, quand une limitation se produit, afin que la tâche se termine sans échouer. L'entreprise veut modifier uniquement la configuration du SDK.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the SDK to the legacy retry mode, which retries throttling errors for this client without applying a retry quota.
        fr: |-
          Passer le SDK au mode de nouvelle tentative legacy, qui réessaie les erreurs de limitation de ce client sans appliquer de quota de nouvelles tentatives.
    - id: b
      text:
        en: |-
          Set the SDK retry mode to adaptive for the loader's DynamoDB client so that its client-side rate limiter delays requests after throttling.
        fr: |-
          Définir le mode de nouvelle tentative du SDK sur adaptive pour le client DynamoDB du chargeur, afin que son limiteur de débit côté client retarde les requêtes après une limitation.
    - id: c
      text:
        en: |-
          Keep the standard retry mode, and raise the maximum attempts to 20 so that each throttled request is retried more times.
        fr: |-
          Conserver le mode de nouvelle tentative standard, et relever le nombre maximal de tentatives à 20 afin que chaque requête limitée soit réessayée plus de fois.
    - id: d
      text:
        en: |-
          Switch the table to on-demand capacity mode so that it absorbs the nightly load without returning throttling errors.
        fr: |-
          Passer la table en mode de capacité à la demande afin qu'elle absorbe la charge nocturne sans renvoyer d'erreurs de limitation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Adaptive mode adds a client-side rate limiter to standard retries that can delay or block the initial request, not only retries, when throttling is detected. AWS recommends it for a client that targets a single resource, such as one DynamoDB table, and expects frequent throttling, which matches this loader.
    fr: |-
      Le mode adaptive ajoute aux nouvelles tentatives standard un limiteur de débit côté client qui peut retarder ou bloquer la requête initiale, et pas seulement les nouvelles tentatives, quand une limitation est détectée. AWS le recommande pour un client qui cible une seule ressource, comme une table DynamoDB, et s'attend à des limitations fréquentes, ce qui correspond à ce chargeur.
  options:
    a:
      en: |-
        Legacy mode exists only for backward compatibility and AWS recommends moving off it; it has no client-side rate limiter, so it doesn't slow first attempts.
      fr: |-
        Le mode legacy n'existe que pour la compatibilité ascendante et AWS recommande de l'abandonner ; il n'a pas de limiteur de débit côté client et ne ralentit donc pas les premières tentatives.
    c:
      en: |-
        More attempts send even more requests to a throttled table, the retry quota still applies, and first attempts are never delayed.
      fr: |-
        Davantage de tentatives envoient encore plus de requêtes à une table limitée, le quota de nouvelles tentatives s'applique toujours, et les premières tentatives ne sont jamais retardées.
    d:
      en: |-
        The capacity is fixed by the finance team, and changing the table isn't a change to the SDK configuration.
      fr: |-
        La capacité est fixée par l'équipe financière, et modifier la table n'est pas une modification de la configuration du SDK.
references:
  - title: "Retry behavior - AWS SDKs and Tools"
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
