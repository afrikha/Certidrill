id: sapc03-5b-centralization-name-pattern
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a CloudWatch Logs centralization rule to copy the logs of 80 accounts in three Regions to a central account. Every account has a log group named /app/orders. After the rule was created, investigators could not tell which account or Region an event came from, because all the events were written to a single /app/orders log group in the central account. The investigators also need the tags of the source log groups on the centralized log groups, so that they can filter them. The team wants to fix this without adding any processing component.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une règle de centralisation CloudWatch Logs pour copier les journaux de 80 comptes dans trois Régions vers un compte central. Chaque compte possède un groupe de journaux nommé /app/orders. Après la création de la règle, les enquêteurs n'ont pas pu savoir de quel compte ou de quelle Région provenait un événement, car tous les événements étaient écrits dans un seul groupe de journaux /app/orders du compte central. Les enquêteurs ont aussi besoin des balises des groupes de journaux sources sur les groupes de journaux centralisés, pour pouvoir les filtrer. L'équipe veut corriger cela sans ajouter de composant de traitement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one centralization rule for each source account and Region, each with its own destination account, so that the log groups of each source stay separate.", fr: "Créer une règle de centralisation par compte et par Région sources, chacune avec son propre compte de destination, afin que les groupes de journaux de chaque source restent séparés." } }
    - { id: b, text: { en: "Add a subscription filter to each source log group that streams the events to an AWS Lambda function, which adds the account ID and the Region to each event.", fr: "Ajouter à chaque groupe de journaux source un filtre d'abonnement qui diffuse les événements vers une fonction AWS Lambda, laquelle ajoute l'ID de compte et la Région à chaque événement." } }
    - { id: c, text: { en: "Set the destination log group name pattern of the rule to include ${source.accountId}, ${source.region}, and ${source.logGroup}, and turn on tag propagation.", fr: "Définir le modèle de nom des groupes de journaux de destination de la règle pour inclure ${source.accountId}, ${source.region} et ${source.logGroup}, et activer la propagation des balises." } }
    - { id: d, text: { en: "Keep the default destination naming, and run CloudWatch Logs Insights queries in the central account that filter the merged events on the @logStream field.", fr: "Conserver le nommage de destination par défaut, et exécuter dans le compte central des requêtes CloudWatch Logs Insights qui filtrent les événements fusionnés sur le champ @logStream." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, a centralization rule names destination log groups ${source.logGroup}, which merges log groups that have the same name in all sources. A destination pattern can use attributes such as ${source.accountId} and ${source.region}, and when tag propagation is enabled, the pattern must contain ${source.logGroup}, ${source.accountId}, and ${source.region}, which also keeps every source separate."
    fr: "Par défaut, une règle de centralisation nomme les groupes de journaux de destination ${source.logGroup}, ce qui fusionne les groupes de journaux de même nom de toutes les sources. Un modèle de destination peut utiliser des attributs comme ${source.accountId} et ${source.region}, et quand la propagation des balises est activée, le modèle doit contenir ${source.logGroup}, ${source.accountId} et ${source.region}, ce qui sépare aussi chaque source."
  options:
    a: { en: "Sending each source to a different destination account defeats central investigation, and 240 rules add the overhead that one naming pattern avoids.", fr: "Envoyer chaque source vers un compte de destination différent empêche l'investigation centrale, et 240 règles ajoutent la charge qu'un seul modèle de nommage évite." }
    b: { en: "A Lambda function on every log group is the processing component that the team wants to avoid, and it does not propagate the tags of the source log groups.", fr: "Une fonction Lambda sur chaque groupe de journaux est le composant de traitement que l'équipe veut éviter, et elle ne propage pas les balises des groupes de journaux sources." }
    d: { en: "The default pattern keeps merging the log groups and does not propagate the source tags, so the investigators still cannot filter by those tags.", fr: "Le modèle par défaut continue de fusionner les groupes de journaux et ne propage pas les balises sources : les enquêteurs ne peuvent toujours pas filtrer selon ces balises." }
references:
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
