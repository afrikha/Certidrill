id: sapc03-5a-promote-by-digest
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds the container image of its order service in a tooling account and deploys it to Amazon ECS in test, staging, and production accounts in the same Region. Today, each environment's stage rebuilds the image from the same commit and tags it latest. An incident showed that production ran an image whose dependencies differed from the tested image, because a base image changed between the builds. The company wants production to run exactly the image that passed the tests in staging. Images must be pulled from a single repository, and nothing must be rebuilt for promotion.

    Which solution will meet these requirements?
  fr: |
    Une entreprise génère l'image de conteneur de son service de commandes dans un compte d'outillage et la déploie sur Amazon ECS dans des comptes de test, de préproduction et de production de la même Région. Aujourd'hui, l'étape de chaque environnement régénère l'image à partir du même commit et lui donne la balise latest. Un incident a montré que la production exécutait une image dont les dépendances différaient de l'image testée, car une image de base avait changé entre les générations. L'entreprise veut que la production exécute exactement l'image qui a réussi les tests en préproduction. Les images doivent être tirées d'un référentiel unique, et rien ne doit être régénéré pour la promotion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep one build per environment, pin the base image tag in the Dockerfile, and keep deploying the latest tag in each environment.
        fr: |-
          Conserver une génération par environnement, épingler la balise de l'image de base dans le Dockerfile, et continuer à déployer la balise latest dans chaque environnement.
    - id: b
      text:
        en: |-
          Build once, push the image with the latest tag to a central repository, and have each environment's task definition reference latest, with tag immutability turned off so that promotions can retag images.
        fr: |-
          Générer une seule fois, envoyer l'image avec la balise latest dans un référentiel central, et faire référencer latest par la définition de tâche de chaque environnement, avec l'immuabilité des balises désactivée pour que les promotions puissent réétiqueter les images.
    - id: c
      text:
        en: |-
          Build once, save the image as a tar file in the pipeline artifacts, and have each stage load it and push it to an ECR repository in that environment's account.
        fr: |-
          Générer une seule fois, enregistrer l'image dans un fichier tar des artefacts du pipeline, et faire charger puis envoyer ce fichier par chaque étape dans un référentiel ECR du compte de l'environnement.
    - id: d
      text:
        en: |-
          Build once, push to an ECR repository in the tooling account whose policy lets the three accounts pull, and pass the image digest to every deploy stage so that each task definition references it.
        fr: |-
          Générer une seule fois, envoyer l'image dans un référentiel ECR du compte d'outillage dont la politique permet aux trois comptes de la tirer, et transmettre le condensé de l'image à chaque étape de déploiement pour que chaque définition de tâche le référence.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Building once and promoting the same artifact guarantees that production runs what was tested. A digest identifies the image content and can't be moved like a tag, so every task definition that references it runs the same image. A repository policy in the tooling account grants the workload accounts pull access, which keeps a single repository.
    fr: |-
      Générer une seule fois et promouvoir le même artefact garantit que la production exécute ce qui a été testé. Un condensé identifie le contenu de l'image et ne peut pas être déplacé comme une balise : chaque définition de tâche qui le référence exécute la même image. Une politique de référentiel dans le compte d'outillage accorde aux comptes de charge de travail l'accès en tirage, ce qui conserve un référentiel unique.
  options:
    a:
      en: |-
        Each environment still rebuilds the image, so other dependencies can change between builds, and latest is a moving tag.
      fr: |-
        Chaque environnement régénère toujours l'image : d'autres dépendances peuvent changer entre les générations, et latest est une balise mobile.
    b:
      en: |-
        A mutable latest tag can be moved by the next build, so production could pull an image that never ran in staging.
      fr: |-
        Une balise latest mutable peut être déplacée par la génération suivante : la production pourrait tirer une image qui n'a jamais tourné en préproduction.
    c:
      en: |-
        This creates one repository per environment instead of a single repository, and moving image files through pipeline artifacts adds work at every stage.
      fr: |-
        Cette approche crée un référentiel par environnement au lieu d'un référentiel unique, et faire transiter des fichiers d'image par les artefacts du pipeline ajoute du travail à chaque étape.
references:
  - title: Private repository policy examples in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-policy-examples.html
  - title: Preventing image tags from being overwritten in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
